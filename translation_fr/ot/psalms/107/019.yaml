  text: וַ/יִּזְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֻֽקוֹתֵי/הֶ֗ם יוֹשִׁיעֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/019.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: fr
  text: Alors, dans leur détresse, ils crièrent vers Yahvé[a], et il les sauva de leurs angoisses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR »; autre transcription possible : « Yahweh ».'
    reason: Signaler le nom divin sous-jacent ainsi que les principaux usages de traduction et de transcription.
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Alors … ils crièrent
  rationale: Le wayyiqtol fait progresser la séquence et reprend le refrain du psaume. « Crièrent » exprime un appel pressant au secours.
- source_word: אֶל־יְהוָה
  choice: vers Yahvé
  rationale: La préposition marque la direction de l'appel. « Yahvé » représente directement le nom divin יהוה, avec une note signalant l'usage traditionnel.
- source_word: בַּצַּר לָהֶם
  choice: dans leur détresse
  rationale: La construction signifie littéralement « dans la détresse pour eux »; le possessif donne en français une formulation naturelle tout en conservant le singulier collectif.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: de leurs angoisses
  rationale: Le pluriel désigne les situations oppressantes ou les détresses qui les accablent. « Angoisses » maintient une distinction lexicale avec צַר, rendu par « détresse ».
- source_word: יוֹשִׁיעֵם
  choice: il les sauva
  rationale: Le hiphil de ישׁע exprime ici l'action de sauver ou délivrer. « Sauva » est direct, naturel et conserve la portée du secours divin.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin. « Yahvé » le représente comme nom propre sans le remplacer silencieusement par un titre; la note indique la tradition de traduction.
translation_notes:
  register: Français moderne, courant et digne. L'ordre « dans leur détresse » met naturellement en relief la situation qui provoque leur cri. Le passé simple convient au registre poétique et narratif du psaume.
