  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: fr
  text: Puis ils devinrent moins nombreux et furent abaissés à cause de l’oppression, du malheur et du chagrin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: ils diminuèrent
  rationale: Le qal wayyiqtol de מעט indique qu’ils devinrent moins nombreux ou furent réduits. « Ils diminuèrent » reste naturel tout en conservant l’ambiguïté entre recul numérique et affaiblissement de condition.
- source_word: וַיָּשֹׁחוּ
  choice: furent abaissés
  rationale: Le verbe שׁחח exprime le fait d’être courbé, accablé ou abaissé. Cette formulation rend leur déchéance sans imposer une posture uniquement physique.
- source_word: מֵעֹצֶר
  choice: par l’oppression
  rationale: עֹצֶר peut désigner la contrainte ou l’oppression, et la préposition מִן peut ici exprimer la cause. « Par l’oppression » donne un sens clair dans le contexte, tandis que la note conserve une autre lecture possible.
- source_word: רָעָה
  choice: le malheur
  rationale: Dans cette série de détresses, רָעָה désigne vraisemblablement l’adversité ou la calamité plutôt que le mal moral. « Le malheur » est courant, digne et suffisamment large.
- source_word: וְיָגוֹן
  choice: et le chagrin
  rationale: יָגוֹן désigne la douleur affective, le chagrin ou l’affliction. « Chagrin » distingue clairement cette dimension intérieure du « malheur » extérieur.
