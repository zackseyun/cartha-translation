  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: fr
  text: Ils ont vu les œuvres de Yahweh et ses merveilles dans les profondeurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’abîme ». Le mot hébreu désigne les eaux profondes, ce qui correspond au contexte maritime du psaume.'
    reason: 'Alternative lexicale : « abîme » peut rendre l’image des profondeurs marines sans modifier le sens.'
lexical_decisions:
- source_word: הֵמָּה
  choice: Ils
  rationale: Le pronom indépendant masculin pluriel met le sujet en relief. En français courant, le pronom explicite « Ils » suffit ici sans alourdir le vers par une tournure emphatique.
- source_word: רָאוּ
  choice: ont vu
  rationale: Le qal accompli décrit l’expérience vécue par les marins; le passé composé convient naturellement au récit poétique en français moderne.
- source_word: מַעֲשֵׂי
  choice: les œuvres
  rationale: Le pluriel construit désigne les actions accomplies par Dieu. « Œuvres » conserve l’ampleur du terme et forme un parallélisme naturel avec « merveilles ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, afin de préserver le nom divin présent dans le texte hébreu.
- source_word: וְנִפְלְאוֹתָיו
  choice: et ses merveilles
  rationale: Le nom pluriel issu de פלא évoque des actes extraordinaires qui suscitent l’émerveillement; le suffixe possessif est rendu par « ses ».
- source_word: בִּמְצוּלָה
  choice: au cœur des profondeurs
  rationale: Le terme désigne les eaux profondes ou les profondeurs marines. Dans le contexte des voyageurs en mer, cette formulation française est naturelle et évocatrice sans expliciter davantage que l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, poétique et accessible. Le parallélisme « œuvres / merveilles » est conservé, ainsi que l’imagerie maritime du texte.
