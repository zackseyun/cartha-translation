  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: fr
  text: Qu’ils remercient Yahweh pour son amour fidèle et pour ses merveilles envers les humains[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envers les fils de l’être humain » ; expression désignant les humains, l’humanité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Qu’ils remercient
  rationale: Le hifil de ידה a ici, dans le refrain du psaume, une valeur exhortative. « Qu’ils remercient » rend naturellement cette nuance en français.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל marque le destinataire de l’action de grâce. Le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד associe bonté, attachement et constance loyale. « Amour fidèle » exprime ces dimensions sans imposer une formulation confessionnelle plus étroite.
- source_word: וְנִפְלְאוֹתָיו
  choice: et pour les merveilles qu’il accomplit
  rationale: Le nom dérivé de פלא désigne ici les actes extraordinaires de Dieu. La formulation verbale française met clairement en valeur ces œuvres.
- source_word: לִבְנֵי אָדָם
  choice: en faveur des humains
  rationale: L’expression signifie littéralement « pour/envers les fils d’Adam/de l’être humain ». Dans ce contexte, ל indique les bénéficiaires des merveilles; « les humains » restitue le sens collectif et inclusif de l’idiome.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve sa fonction de nom propre, tandis que « le SEIGNEUR » reflète la tradition de lecture.
- issue: Portée de בני אדם
  choice: les humains
  alternative: les enfants d’Adam / les fils des hommes
  rationale: L’expression masculine est représentative de l’ensemble de l’humanité. Le texte principal en donne le sens naturel en français moderne, et la note conserve l’idiome hébreu.
translation_notes:
  register: Français moderne, international et digne. La tournure exhortative est préservée; le point d’exclamation convient au refrain poétique. « Merveilles qu’il accomplit » reste naturel tout en soulignant qu’il s’agit d’actes divins extraordinaires.
