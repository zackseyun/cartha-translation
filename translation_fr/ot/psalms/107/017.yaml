source:
  edition: WLC
  text: אֱ֭וִלִים מִ/דֶּ֣רֶךְ פִּשְׁעָ֑/ם וּֽ֝/מֵ/עֲוֺֽנֹתֵי/הֶ֗ם יִתְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: fr
  text: Les insensés, à cause de leur conduite rebelle et de leurs fautes, étaient accablés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱוִילִים
  choice: Les insensés
  rationale: Le terme désigne des personnes moralement insensées, et non simplement peu intelligentes. « Les insensés » conserve cette catégorie sapientielle en français naturel.
- source_word: מִדֶּרֶךְ פִּשְׁעָם
  choice: à cause de leur conduite rebelle
  rationale: מִן exprime vraisemblablement ici la cause. דֶּרֶךְ évoque la manière de vivre ou la conduite, tandis que פֶּשַׁע porte la nuance de transgression ou de rébellion. Cette formulation rend l’ensemble avec naturel sans effacer son poids moral.
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: et de leurs fautes
  rationale: Le second מִן est également compris comme causal et dépend en français de « à cause de ». עָוֹן peut désigner la faute, la culpabilité ou ses conséquences ; « fautes » convient ici aux actes coupables et reste distinct de la conduite rebelle.
- source_word: יִתְעַנּוּ
  choice: étaient accablés
  rationale: Le hitpael de ענה exprime ici l’affliction subie. « Étaient accablés » rend l’état de souffrance dans le récit passé du psaume, avec une formulation courante et digne.
theological_decisions:
- issue: Lien causal entre les fautes et la souffrance
  choice: Leur affliction est présentée comme résultant de leur conduite rebelle et de leurs fautes.
  alternative: Les prépositions pourraient être rendues plus formellement par « du fait de » ou « par suite de », voire « loin de », mais la valeur causale est la plus probable ici.
  rationale: Les deux occurrences de מִן soutiennent une lecture causale dans ce contexte. La traduction affirme ce lien pour les personnes décrites sans en tirer la doctrine générale selon laquelle toute souffrance résulterait d’une faute personnelle.
translation_notes:
  register: Français international moderne, sobre et poétique. « Conduite » explicite la valeur figurée de « chemin » sans lourdeur, et « accablés » traduit l’affliction sans préciser au-delà de l’hébreu sa forme exacte.
