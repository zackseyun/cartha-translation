  source_fidelity: « Les insensés » rend bien אֱוִילִים dans son sens moral sapientiel. « À cause de leur conduite rebelle et de leurs fautes » exprime de manière naturelle la valeur probablement causale des deux prépositions מִן, tout en conservant la distinction générale entre פֶּשַׁע (rébellion/transgression) et עָוֹן (faute coupable/iniquité). « Étaient accablés » rend adéquatement l’affliction exprimée par יִתְעַנּוּ sans en préciser indûment la nature.
