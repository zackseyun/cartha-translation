  source_fidelity: 'Le sens général est bien rendu : l’imparfait hiphil de ידה a une valeur exhortative, חֶסֶד est correctement exprimé par « amour fidèle », et le nom divin est fidèlement translittéré « Yahweh ». Toutefois, « les merveilles qu’il accomplit en faveur des humains » transforme le substantif נִפְלָאוֹתָיו en proposition verbale et interprète le ל de לִבְנֵי אָדָם comme une bienfaisance explicite. « Ses merveilles envers les humains » reste plus proche de la formulation et de sa portée relationnelle sans surinterpréter.'
