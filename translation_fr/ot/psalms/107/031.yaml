  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: fr
  text: Qu’ils rendent grâce à Yahweh pour son amour fidèle et pour ses merveilles envers les humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « envers les fils de l’homme » ; c’est-à-dire les êtres humains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Qu’ils remercient
  rationale: L’imparfait hiphil a ici, dans le refrain du psaume, une valeur exhortative ou volitive. « Qu’ils remercient » est naturel et conserve cette nuance.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל marque le destinataire de la reconnaissance; le tétragramme est rendu par la translittération usuelle « Yahweh ».
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne ici un amour loyal, durable et bienveillant. « Amour fidèle » en exprime le cœur sans imposer dans le texte le terme plus étroit d’« alliance ».
- source_word: וְנִפְלְאוֹתָיו
  choice: et pour les merveilles qu’il accomplit
  rationale: Le nom désigne des actes extraordinaires qui suscitent l’émerveillement. La formulation verbale est idiomatique en français et explicite qu’il s’agit d’actes.
- source_word: לִבְנֵי אָדָם
  choice: en faveur des humains
  rationale: L’expression hébraïque signifie littéralement « pour les fils de l’homme/de l’humanité », mais possède ici une portée collective et désigne les êtres humains. « En faveur de » exprime naturellement la direction bénéfique de ces actes.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le distingue d’un titre tout en laissant l’autre tradition de rendu comme possibilité connue.
- issue: Portée de בני אדם
  choice: les humains
  alternative: les fils de l’homme
  rationale: Cette expression masculine hébraïque a ici une valeur générique et collective. Le français « les humains » en restitue clairement la portée sans la confondre avec le titre singulier « Fils de l’homme ».
translation_notes:
  register: Français international moderne, digne et accessible. La cadence du refrain est préservée, avec une formulation naturelle; « amour fidèle » maintient la richesse de חֶסֶד et « les merveilles qu’il accomplit » rend explicitement la dimension active de נִפְלָאוֹת.
