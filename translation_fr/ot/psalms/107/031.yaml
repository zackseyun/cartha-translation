  - severity: low
    issue: Verbalisation de « ses merveilles »
    rationale: « Qu’il accomplit » est compatible avec le contexte, mais le texte hébreu emploie le nom « ses merveilles ». Le conserver maintient mieux le parallélisme du refrain.
