source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: fr
  text: Car il parla et fit se lever un vent de tempête[a], qui souleva les vagues de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il dit et fit surgir un vent de tempête ».'
    reason: Alternative lexicale permettant de rendre וַיֹּאמֶר par « il dit » et la valeur causative de וַיַּעֲמֵד par « fit surgir ».
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: il parla
  rationale: Le verbe אמר signifie normalement « dire/parler ». « Il parla » garde l’idée que la tempête surgit à la parole de Dieu, sans préciser davantage qu’il s’agit d’un ordre explicite.
- source_word: וַיַּעֲמֵד
  choice: fit se lever
  rationale: 'Le hifil de עמד a ici une valeur causative : faire surgir ou se lever. Cette tournure est naturelle en français et reste proche de l’image hébraïque.'
- source_word: רוּחַ סְעָרָה
  choice: un vent de tempête
  rationale: Cette expression conserve la mention explicite du vent et son caractère violent, dans un français actuel et évocateur.
- source_word: וַתְּרוֹמֵם
  choice: qui souleva
  rationale: Le féminin singulier renvoie grammaticalement à רוּחַ, « vent ». La proposition relative indique clairement que le vent soulève les vagues.
- source_word: גַּלָּיו
  choice: les vagues de la mer
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à la mer comprise d’après le contexte. L’explicitation « de la mer » évite en français un possessif ambigu tout en préservant la relation exprimée.
theological_decisions:
- issue: Sujet divin implicite
  choice: « il », renvoyant à Dieu dans le contexte immédiat
  alternative: Une formulation impersonnelle
  rationale: Les formes verbales ont un sujet personnel, et le contexte attribue l’action au Seigneur. Le pronom préserve l’enchaînement du psaume sans ajouter de qualification théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’action souveraine exprimée dans l’hébreu, ainsi que le rôle grammatical du vent dans le soulèvement des vagues.
