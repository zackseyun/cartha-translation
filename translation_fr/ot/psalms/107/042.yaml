  text: יִרְא֣וּ יְשָׁרִ֣ים וְ/יִשְׂמָ֑חוּ וְ/כָל עַ֝וְלָ֗ה קָ֣פְצָה פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/042.yaml
  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: fr
  text: Les hommes droits voient et se réjouissent, et toute injustice ferme la bouche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un nom féminin singulier (« injustice ») avec un suffixe féminin à « bouche », personnifiant ainsi l’injustice réduite au silence.
    reason: personnification_poétique
lexical_decisions:
- source_word: יִרְאוּ
  choice: le voient
  rationale: Le qal inaccompli à la 3e personne du pluriel peut exprimer ici une vérité générale. Le pronom « le » reprend naturellement l’action salvatrice décrite dans le contexte.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: L’adjectif pluriel substantivé désigne ceux qui sont moralement droits. Cette formulation est claire en français et évite de confondre le terme avec צַדִּיק.
- source_word: וְיִשְׂמָחוּ
  choice: et se réjouissent
  rationale: Le présent rend la portée générale de l’inaccompli et conserve la force active et joyeuse du verbe.
- source_word: וְכָל
  choice: et toute
  rationale: Rend directement la conjonction et le quantificateur, sans introduire explicitement une valeur adversative absente de l’hébreu.
- source_word: עַוְלָה
  choice: injustice
  rationale: Le nom abstrait désigne le mal, l’iniquité ou l’injustice. « Injustice » préserve son caractère abstrait tout en permettant la personnification poétique.
- source_word: קָפְצָה
  choice: ferme
  rationale: Avec « bouche », le verbe forme l’image idiomatique de quelqu’un réduit au silence. Le présent convient à la portée générale du verset malgré la forme hébraïque accomplie.
- source_word: פִּיהָ
  choice: la bouche
  rationale: Le français dit naturellement « fermer la bouche ». L’article défini évite un pronom possessif de genre tout en conservant intacte la personnification.
theological_decisions:
- issue: Personnification du mal ou de l’injustice
  choice: Conserver le nom abstrait « injustice » comme sujet de « ferme la bouche ».
  alternative: Traduire par « les méchants », ou employer le terme plus théologique « iniquité ».
  rationale: L’hébreu emploie un nom abstrait féminin, non un nom désignant explicitement des personnes. La traduction garde donc l’image poétique d’une injustice personnifiée et réduite au silence.
- issue: Objet implicite de « voient »
  choice: Employer « le voient », le pronom renvoyant à l’intervention divine exposée dans le contexte.
  alternative: 'Traduire sans complément explicite : « Les hommes droits voient et se réjouissent ».'
  rationale: Le verbe hébreu est sans objet exprimé, mais le français appelle ici un complément. Le pronom garde la référence contextuelle ouverte sans préciser davantage ce que les hommes droits voient.
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme est conservé, avec un présent à valeur générale et une personnification intelligible.
