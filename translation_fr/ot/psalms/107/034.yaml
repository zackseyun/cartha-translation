source:
  edition: WLC
  text: אֶ֣רֶץ פְּ֭רִי לִ/מְלֵחָ֑ה מֵ֝/רָעַ֗ת יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/034.yaml
  text: a fruitful land into a salt waste[a], because of the evil of those who dwell in it.
translation:
  language: fr
  text: une terre fertile en terre salée[a], à cause du mal de ceux qui l’habitent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en salure » ou « en sol salin » ; l’image hébraïque évoque probablement une région stérile et improductive.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: une terre fertile
  rationale: Littéralement « une terre de fruit » ; en français actuel, « une terre fertile » exprime naturellement une région productive tout en conservant l’image agricole.
- source_word: לִמְלֵחָה
  choice: en étendue de sel
  rationale: La préposition ל indique ici le résultat de la transformation. מְלֵחָה désigne un terrain salé ou une condition saline évoquant une région stérile ; « étendue de sel » maintient l’image concrète sans la réduire à la seule idée de stérilité.
- source_word: מֵרָעַת
  choice: à cause du mal de
  rationale: La préposition מִן a ici une valeur causale, et רָעָה désigne le mal ou la méchanceté. Cette formulation conserve clairement le lien moral et causal.
- source_word: יֹשְׁבֵי בָהּ
  choice: ceux qui l’habitent
  rationale: Le participe de ישׁב désigne ceux qui résident dans le pays. Cette traduction garde la nuance verbale et reste naturelle en français moderne.
theological_decisions:
- issue: Cause de la désolation de la terre
  choice: La terre fertile devient une étendue de sel à cause du mal de ses habitants.
  alternative: Présenter le changement comme un phénomène purement environnemental ou historique, sans causalité morale.
  rationale: L’hébreu relie explicitement la transformation à מֵרָעַת יֹשְׁבֵי בָהּ ; il faut donc préserver ce rapport causal sans l’atténuer.
translation_notes:
  register: Français international moderne, sobre et digne. « Étendue de sel » conserve l’image hébraïque concrète tout en étant intelligible ; la note signale les autres formulations possibles.
