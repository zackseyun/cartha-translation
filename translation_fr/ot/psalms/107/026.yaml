  text: יַעֲל֣וּ שָׁ֭מַיִם יֵרְד֣וּ תְהוֹמ֑וֹת נַ֝פְשָׁ֗/ם בְּ/רָעָ֥ה תִתְמוֹגָֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/026.yaml
  text: They rose up to the heavens; they went down to the depths[a]. Their soul melted away in distress.
translation:
  language: fr
  text: Ils montaient jusqu’aux cieux, ils descendaient dans les profondeurs. Leur âme fondait dans la détresse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Leur vie se dissolvait dans le malheur » : נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même, et רָעָה peut évoquer la détresse, le malheur ou le désastre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלוּ שָׁמַיִם
  choice: Ils montaient jusqu’aux cieux
  rationale: Le qal imperfectif de עלה exprime le mouvement ascendant. « Jusqu’aux cieux » rend naturellement en français la construction poétique hébraïque et l’élévation provoquée par la tempête.
- source_word: יֵרְדוּ תְהוֹמוֹת
  choice: ils descendaient dans les profondeurs
  rationale: La formulation conserve l’antithèse avec la montée. Le pluriel תְהוֹמוֹת désigne ici les profondeurs marines, notamment les creux de la mer agitée.
- source_word: נַפְשָׁם
  choice: leur âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Leur âme » préserve l’image poétique de l’être intérieur qui défaille sans réduire l’ambiguïté lexicale.
- source_word: בְּרָעָה
  choice: dans la détresse
  rationale: Dans le contexte de la tempête, רָעָה évoque le malheur ou une situation désastreuse plutôt que le mal moral. « Dans la détresse » est idiomatique et décrit l’épreuve éprouvée.
- source_word: תִתְמוֹגָג
  choice: fondait
  rationale: La forme issue de מוג évoque le fait de fondre, de se dissoudre ou de défaillir. « Fondait » conserve la métaphore vive et s’accorde avec le singulier collectif « leur âme ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. L’imparfait restitue la scène descriptive et le parallélisme des mouvements successifs. La métaphore « leur âme fondait » est maintenue plutôt que remplacée par l’explication « ils perdaient courage ».
