  yaml_path: translation/ot/psalms/107/029.yaml
  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: fr
  text: Il apaisa la tempête[a], et leurs vagues se turent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu exprime littéralement l’action de faire passer la tempête à un état de calme ou de silence. Autre traduction possible : « Il transforma la tempête en calme. »'
    reason: lexical_alternative
  - marker: b
    text: Ou « ses vagues », si le suffixe renvoie à la mer ou aux eaux plutôt qu’aux personnes dans le bateau.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֵם
  choice: Il apaisa
  rationale: 'Le hifil de קום a ici une valeur causative : Dieu fait passer la tempête à un état de calme. « Il apaisa » exprime cette action de façon naturelle et concise en français.'
- source_word: סְעָרָה
  choice: la tempête
  rationale: Le nom désigne une tempête ou un violent coup de vent, particulièrement adapté au contexte maritime. « Tempête » est le terme courant et digne.
- source_word: לִדְמָמָה
  choice: apaisa
  rationale: 'La préposition ל suivie de דְּמָמָה indique le résultat : la tempête est conduite au calme ou au silence. Ce complément est intégré au verbe français « apaisa »; une traduction plus formelle est signalée en note.'
- source_word: וַיֶּחֱשׁוּ
  choice: se turent
  rationale: Le verbe exprime le fait de devenir silencieux ou de cesser de faire du bruit. Appliqué aux vagues, « se turent » conserve l’image poétique et le passage au silence.
- source_word: גַּלֵּיהֶם
  choice: leurs vagues
  rationale: Le suffixe hébreu est formellement à la troisième personne du masculin pluriel, « leurs ». Cette traduction préserve la forme et l’ambiguïté de l’antécédent sans la résoudre dans le texte principal.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et poétique. « Apaisa » rend naturellement la construction causative, tandis que « se turent » conserve la personnification des vagues. Les notes préservent la formulation résultative et l’ambiguïté du suffixe hébreu.
