  text: יָשֵׂ֣ם נְהָר֣וֹת לְ/מִדְבָּ֑ר וּ/מֹצָ֥אֵי מַ֝֗יִם לְ/צִמָּאֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: fr
  text: 'Il change les fleuves en désert,

    et les sources d’eau en terre aride.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֵׂם
  choice: change ... en
  rationale: Le verbe signifie littéralement « placer, établir, faire ». Dans ce parallélisme de transformation, « changer ... en » rend naturellement le sens résultatif.
- source_word: נְהָרוֹת
  choice: les fleuves
  rationale: Le pluriel désigne normalement des fleuves ou des cours d’eau importants ; « fleuves » est le correspondant français direct.
- source_word: לְמִדְבָּר
  choice: en désert
  rationale: מִדְבָּר désigne une région désertique ou sauvage. « Désert » exprime clairement ici le contraste avec les fleuves, tandis que la préposition לְ indique l’état résultant.
- source_word: וּמֹצָאֵי מַיִם
  choice: les sources d’eau
  rationale: L’expression désigne littéralement les lieux d’où l’eau sort ; « sources d’eau » conserve cette image en français naturel.
- source_word: לְצִמָּאוֹן
  choice: en terre aride
  rationale: Le nom signifie littéralement « soif » ou « état de sécheresse ». Appliqué au paysage, « terre aride » transmet clairement l’idée d’un lieu privé d’eau sans imposer une lecture étrangère au contexte.
