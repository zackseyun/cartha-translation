  text: כִּֽי הִמְר֥וּ אִמְרֵי אֵ֑ל וַ/עֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: fr
  text: 'Car ils s’étaient rebellés contre les paroles de Dieu

    et avaient méprisé le conseil du Très-Haut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la situation décrite dans le contexte précédent; « car » conserve naturellement la progression explicative et poétique.
- source_word: הִמְרוּ
  choice: s’étaient rebellés contre
  rationale: Le verbe מרה exprime la rébellion ou la défiance. Le plus-que-parfait explicite en français le rapport causal avec la situation antérieure sans modifier la logique du texte.
- source_word: אִמְרֵי
  choice: les paroles de
  rationale: Le pluriel construit désigne les paroles ou déclarations divines; « paroles » est naturel, digne et suffisamment large.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici une désignation divine courante; « Dieu » convient au parallélisme sans ajouter une nuance absente du contexte.
- source_word: וַעֲצַת
  choice: et le conseil du
  rationale: עֵצָה peut signifier conseil, dessein ou projet. « Conseil » préserve l’idée d’une direction empreinte de sagesse sans trancher en faveur d’un décret ou d’un plan.
- source_word: עֶלְיוֹן
  choice: Très-Haut
  rationale: « Le Très-Haut » est l’équivalent français consacré et intelligible de ce titre divin.
- source_word: נָאָצוּ
  choice: avaient méprisé
  rationale: נאץ exprime le mépris et le rejet dédaigneux; « mépriser » en conserve la force tout en restant naturel.
theological_decisions:
- issue: Traduction parallèle des titres divins אֵל et עֶלְיוֹן
  choice: Dieu … le Très-Haut
  alternative: le Puissant … l’Exalté
  rationale: Cette formulation maintient deux désignations distinctes en parallèle, sans introduire une interprétation doctrinale supplémentaire ni rendre le français artificiel.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est rendu sur deux lignes. Le plus-que-parfait marque naturellement l’antériorité causale par rapport au contexte des versets précédents.
