  variant: modern international French
source:
  edition: WLC
  text: וַ/יְבָרֲכֵ֣/ם וַ/יִּרְבּ֣וּ מְאֹ֑ד וּ֝/בְהֶמְתָּ֗/ם לֹ֣א יַמְעִֽיט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: fr
  text: Il les bénit, et ils devinrent très nombreux ; il ne laissa pas diminuer leur bétail.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et leur bétail ne diminua pas. » Le verbe hébreu est au singulier : on peut comprendre que Dieu reste le sujet (« il ne laissa pas… ») ou rendre la proposition comme l’énoncé du résultat.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Il les bénit
  rationale: Le piel de ברך avec suffixe de troisième personne du masculin pluriel exprime ici l’action de bénir et de faire prospérer. Le sujet singulier renvoie à Dieu dans le contexte du psaume.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: ils devinrent très nombreux
  rationale: רבה décrit une forte augmentation numérique, et מְאֹד en intensifie le degré. Cette formulation française est naturelle et convient à l’accroissement d’une population.
- source_word: וּבְהֶמְתָּם
  choice: leur bétail
  rationale: בְּהֵמָה est ici un collectif désignant les animaux domestiques possédés par le groupe. « Bétail » est plus précis que « animaux » et moins restrictif que « bovins ».
- source_word: לֹא יַמְעִיט
  choice: il ne laissa pas diminuer
  rationale: Le hiphil de מעט a une valeur causative (« rendre moindre, réduire »). En conservant Dieu comme sujet, cette tournure française exprime naturellement qu’il empêcha leur bétail de décroître.
theological_decisions:
- issue: Sujet de la dernière proposition
  choice: 'Dieu reste le sujet : « il ne laissa pas diminuer leur bétail »'
  alternative: « leur bétail ne diminua pas »
  rationale: Le verbe hébreu au singulier peut naturellement poursuivre le sujet divin de « Il les bénit », ce qui maintient l’accent du psaume sur l’action de Dieu. Cependant, la construction peut aussi être rendue en français comme l’énoncé du résultat ; cette possibilité est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, simple et digne. « Devinrent très nombreux » est plus idiomatique que « se multiplièrent » pour une population humaine, tandis que « leur bétail » conserve la valeur collective du terme hébreu.
