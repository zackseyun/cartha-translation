  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: fr
  text: Qu’ils remercient Yahweh pour son amour fidèle et pour les merveilles qu’il accomplit en faveur des humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les fils de l’homme » ; expression hébraïque générique désignant les êtres humains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Qu’ils remercient
  rationale: Le hiphil de ידה, dans ce refrain du psaume, exprime l’action de remercier ou de célébrer. « Qu’ils remercient » rend naturellement l’appel à répondre aux délivrances de Dieu.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל introduit le destinataire de la reconnaissance. Le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד désigne ici un amour bienveillant, loyal et durable. « Amour fidèle » en rend les dimensions relationnelle et constante dans un français courant.
- source_word: וְנִפְלְאוֹתָיו
  choice: et pour les merveilles qu’il accomplit
  rationale: נפלאות désigne des actes extraordinaires qui suscitent l’émerveillement. La formulation verbale française indique clairement qu’il s’agit des œuvres de Dieu, et la répétition de « pour » explicite la coordination naturelle avec le motif de la reconnaissance.
- source_word: לִבְנֵי אָדָם
  choice: en faveur des humains
  rationale: L’expression hébraïque littérale « pour les fils d’Adam/de l’homme » est générique et désigne les êtres humains. « En faveur des humains » transmet sa portée universelle tout en rattachant clairement le complément aux actes merveilleux.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme comme nom propre. « Yahweh » le préserve sans le remplacer par un titre.
- issue: Portée de אדם dans l’expression לבני אדם
  choice: les humains
  alternative: les fils de l’homme
  rationale: Dans cette expression, אדם a une portée générique. Le français « les humains » conserve cette référence à toute l’humanité sans donner à tort l’impression que seuls les hommes de sexe masculin sont visés.
- issue: Rapport syntaxique de לבני אדם
  choice: en faveur des humains, rattaché aux merveilles accomplies
  alternative: ses merveilles aux humains
  rationale: Le complément en ל indique les bénéficiaires ou destinataires des œuvres merveilleuses. « En faveur de » exprime ce rapport sans réduire la préposition à une seule nuance rigide.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme du refrain, emploie un vocabulaire accessible et évite un calque peu idiomatique de l’expression hébraïque générique.
