  text: וַ/יִּזְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֻֽקוֹתֵי/הֶ֗ם יוֹשִׁיעֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/013.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he saved them from their distresses.
translation:
  language: fr
  text: Alors, dans leur détresse, ils crièrent vers Yahweh, et il les sauva de leurs angoisses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Alors […] ils crièrent
  rationale: Le verbe exprime un cri pressant, notamment un appel au secours. « Alors » rend la progression narrative du waw et le refrain caractéristique du psaume.
- source_word: אֶל־יְהוָה
  choice: vers Yahweh
  rationale: La préposition indique la personne vers qui monte le cri. « Yahweh » translittère le nom divin plutôt que de lui substituer un titre.
- source_word: בַּצַּר לָהֶם
  choice: dans leur détresse
  rationale: Cette tournure rend naturellement en français l’état d’affliction collectif exprimé par le singulier hébreu.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: de leurs angoisses
  rationale: Le nom pluriel évoque des situations oppressantes et sans issue. « Angoisses » conserve le pluriel et distingue ce terme de צַר, rendu par « détresse ».
- source_word: יוֹשִׁיעֵם
  choice: il les sauva
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. « Sauva » en donne ici le sens le plus direct et naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme; sa translittération préserve le nom propre au lieu de le remplacer par un titre.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le contraste entre la « détresse » au singulier et les « angoisses » au pluriel, tout en suivant naturellement le mouvement du verset hébreu.
