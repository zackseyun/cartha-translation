source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: fr
  text: Car il rassasie l’âme assoiffée[a] et remplit l’âme affamée de bonnes choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la personne », « la vie » ou « l’être ». Le mot hébreu nefesh désigne souvent l’être vivant tout entier, et non seulement une partie immatérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à louer et à remercier Dieu dans le contexte immédiat.
- source_word: הִשְׂבִּיעַ
  choice: rassasie
  rationale: Le hifil de שבע signifie « faire être rassasié ». Le présent convient à la portée générale et poétique de l’affirmation.
- source_word: נֶפֶשׁ
  choice: l’être
  rationale: Ici, נֶפֶשׁ désigne la personne vivante dans son besoin, sans nécessairement isoler une composante immatérielle. « L’être » garde une certaine densité poétique tout en évitant une lecture dualiste imposée.
- source_word: שֹׁקֵקָה
  choice: assoiffé
  rationale: Dans le parallélisme avec « affamé », le mot évoque naturellement une soif ou un désir intense.
- source_word: רְעֵבָה
  choice: affamé
  rationale: Rend directement la faim et maintient le parallélisme avec « assoiffé ».
- source_word: מִלֵּא טוֹב
  choice: comble de bien
  rationale: Reproduit de façon concise la construction « remplir de bien », tout en conservant l’ambiguïté entre ce qui est bon et les bonnes choses accordées.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: « l’être » dans les deux membres
  alternative: « l’âme », « la personne », « la vie »
  rationale: Le terme hébreu peut désigner la personne entière, notamment comme siège du désir et du besoin. « L’être » préserve la profondeur poétique sans imposer une anthropologie dualiste.
- issue: Valeur de טוֹב
  choice: « de bien »
  alternative: « de bonnes choses » ou « de ce qui est bon »
  rationale: Le singulier hébreu reste ouvert entre une notion collective, qualitative ou substantivée. « De bien » conserve cette concision et cette latitude.
translation_notes:
  register: Français moderne, international et poétique. Le parallélisme est conservé par « l’être assoiffé / l’être affamé », avec une formulation concise et digne.
