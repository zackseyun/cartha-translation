  text: יָשֵׂ֣ם מִ֭דְבָּר לַֽ/אֲגַם מַ֑יִם וְ/אֶ֥רֶץ צִ֝יָּ֗ה לְ/מֹצָ֥אֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: fr
  text: 'Il transforme le désert en étang,

    et la terre aride en sources d’eau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֵׂם
  choice: Il transforme
  rationale: Le verbe שׂים signifie fondamentalement « placer, établir, faire ». Dans ce parallélisme où un milieu aride devient un lieu d’eau, « transforme » exprime naturellement le changement d’état sans l’expliciter au-delà du contexte.
- source_word: מִדְבָּר
  choice: le désert
  rationale: מִדְבָּר désigne une région inculte et aride, un désert ou une étendue sauvage. « Le désert » est ici clair, courant et adapté au contraste poétique avec l’étang.
- source_word: לַאֲגַם מַיִם
  choice: en étang
  rationale: אֲגַם peut désigner une étendue d’eau stagnante, un étang ou un marais. « Étang » conserve l’image d’une masse d’eau et rend inutile en français l’ajout redondant « d’eau ».
- source_word: וְאֶרֶץ צִיָּה
  choice: et la terre aride
  rationale: צִיָּה qualifie une terre sèche ou desséchée. « Terre aride » est une formulation naturelle et poétique qui maintient nettement l’opposition avec les sources.
- source_word: לְמֹצָאֵי מָיִם
  choice: en sources d’eau
  rationale: מוֹצָא désigne un lieu d’où quelque chose sort, ici les points d’émergence de l’eau. « Sources d’eau » restitue simplement l’image concrète au pluriel.
