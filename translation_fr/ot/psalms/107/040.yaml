  text: שֹׁפֵ֣ךְ בּ֭וּז עַל נְדִיבִ֑ים וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/040.yaml
  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: fr
  text: Il répand le mépris sur les notables[a] et les fait errer dans une étendue désolée, sans chemin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes ». Le mot hébreu peut désigner des nobles, des princes ou des dirigeants de haut rang.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans une étendue désolée, sans chemin » ; l’expression évoque un lieu désert où aucune voie n’est tracée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: déverse
  rationale: Le participe de שׁפך exprime l’action de répandre ou de verser. « Déverse le mépris » conserve l’image poétique et le présent convient à l’énoncé général sur l’action de Dieu.
- source_word: בּוּז
  choice: mépris
  rationale: בּוּז désigne le mépris ou le dédain, avec ici une nuance d’humiliation publique.
- source_word: נְדִיבִים
  choice: notables
  rationale: Dans ce contexte, le terme désigne des personnes de rang élevé ou des dirigeants. « Notables » reste assez large pour ne pas limiter indûment le sens aux princes héréditaires.
- source_word: וַיַּתְעֵם
  choice: les fait errer
  rationale: Le hiphil de תעה signifie « faire errer ». Cette formulation préserve l’action causative et l’image concrète de l’errance.
- source_word: בְּתֹהוּ
  choice: dans un lieu désolé
  rationale: תֹהוּ peut évoquer la désolation, le vide ou l’absence de forme. Ici, la mention d’un lieu sans chemin favorise le sens spatial d’une étendue désolée.
- source_word: לֹא דָרֶךְ
  choice: sans chemin
  rationale: Cette traduction proche de l’expression hébraïque « pas de chemin » est naturelle en français et conserve l’image d’un endroit dépourvu de voie.
theological_decisions:
- issue: Sujet implicite
  choice: Le sujet est rendu par « Il », renvoyant à Dieu dans le contexte du psaume.
  alternative: Un sujet impersonnel ou indéterminé.
  rationale: Le contexte littéraire attribue ces renversements à l’action de Dieu. Le français exige ici un sujet explicite, sans qu’il soit nécessaire de répéter le nom divin.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme poétique, la métaphore de l’effusion du mépris et l’image spatiale de l’errance.
