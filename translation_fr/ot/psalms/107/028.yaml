  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: fr
  text: Alors, dans leur détresse, ils crièrent vers Yahweh, et il les fit sortir de leurs détresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Alors, ils crièrent
  rationale: Le waw consécutif fait progresser le récit et reprend le refrain du psaume; « crièrent » exprime ici un appel pressant au secours.
- source_word: אֶל־יְהוָה
  choice: vers Yahweh
  rationale: « Vers » rend naturellement la direction de l’appel, tandis que « Yahweh » translittère le nom divin יהוה au lieu de lui substituer un titre.
- source_word: בַּצַּר לָהֶם
  choice: dans leur détresse
  rationale: L’expression signifie littéralement « dans la détresse pour eux » et désigne la situation éprouvante où ils se trouvent; le singulier hébreu est conservé.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: de leurs angoisses
  rationale: Le nom pluriel מְצוּקוֹת évoque des situations d’oppression, de resserrement ou de détresse; « angoisses » conserve le pluriel et distingue ce terme du singulier précédent.
- source_word: יוֹצִיאֵם
  choice: il les fit sortir
  rationale: Le hiphil de יצא signifie « faire sortir »; cette formulation préserve l’image concrète du texte plutôt que de la remplacer par le plus interprétatif « délivrer ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. La translittération « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Nature de l’action exprimée par יוֹצִיאֵם
  choice: il les fit sortir
  alternative: il les délivra
  rationale: Le choix retient le sens causatif et l’image spatiale du verbe hébreu, sans préciser davantage la manière de la délivrance.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe place « dans leur détresse » près de l’appel afin de reproduire clairement le rapport circonstanciel de l’hébreu. Le contraste singulier « détresse » / pluriel « angoisses » reflète les deux expressions distinctes du texte source.
