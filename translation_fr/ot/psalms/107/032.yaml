  text: וִֽ֭/ירֹמְמוּ/הוּ בִּ/קְהַל עָ֑ם וּ/בְ/מוֹשַׁ֖ב זְקֵנִ֣ים יְהַלְלֽוּ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: fr
  text: Qu’ils l’exaltent dans l’assemblée du peuple[a] et qu’ils le louent dans le conseil des anciens[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la communauté du peuple ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans la session des anciens »; l’expression évoque leur assemblée lorsqu’ils siègent ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Qu’ils l’exaltent
  rationale: Le verbe רומם exprime ici l’action d’élever quelqu’un en honneur. « Exalter » conserve ce sens public et laudatif dans un registre français digne et naturel.
- source_word: בִּקְהַל עָם
  choice: dans l’assemblée du peuple
  rationale: קהל désigne un rassemblement constitué, et עָם le peuple pris collectivement. « Assemblée du peuple » demeure transparent sans coloration ecclésiale excessive.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: et dans le conseil des anciens
  rationale: מוֹשָׁב évoque littéralement le fait de siéger ou une session; associé aux anciens, il désigne leur réunion délibérative. « Conseil des anciens » rend naturellement cette réalité institutionnelle.
- source_word: יְהַלְלוּהוּ
  choice: qu’ils le louent
  rationale: Le piel de הלל a ici son sens courant de louer ou célébrer. « Louer » convient au parallélisme et au contexte d’adoration publique.
