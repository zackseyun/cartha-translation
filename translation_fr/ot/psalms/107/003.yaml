  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: fr
  text: et qu’il a rassemblés de diverses contrées, de l’est et de l’ouest, du nord et de la mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « du sud » ; hébreu : « de la mer ». Dans certains contextes, « la mer » peut indiquer une direction, généralement l’ouest, mais l’ouest est déjà mentionné ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: de différents pays
  rationale: Le pluriel אֲרָצוֹת désigne plusieurs terres, contrées ou pays d’où les personnes ont été rassemblées. « Différents pays » restitue naturellement cette pluralité sans introduire l’idée de totalité.
- source_word: קִבְּצָם
  choice: qu’il a rassemblés
  rationale: Le verbe קבץ signifie « rassembler, réunir ». La tournure avec « que » conserve le lien syntaxique avec le verset précédent, et l’accord au masculin pluriel renvoie aux rachetés.
- source_word: מִמִּזְרָח
  choice: de l’est
  rationale: מִזְרָח désigne l’est, littéralement le côté du lever du soleil. « De l’est » est clair et naturel en français moderne.
- source_word: וּמִמַּעֲרָב
  choice: et de l’ouest
  rationale: מַעֲרָב désigne l’ouest. Cette traduction maintient le parallélisme des indications géographiques.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: צָפוֹן est le terme courant pour le nord.
- source_word: וּמִיָּם
  choice: et de la mer
  rationale: יָם signifie normalement « mer ». Bien qu’il puisse parfois servir d’indication pour l’ouest, מַעֲרָב a déjà nommé l’ouest dans ce verset ; la traduction littérale préserve donc au mieux la formulation hébraïque et son éventuelle tension géographique.
