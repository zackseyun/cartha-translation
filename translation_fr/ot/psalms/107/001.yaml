source:
  edition: WLC
  text: הֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce à Yahweh[a], car il est bon, car son amour fidèle dure pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu יהוה est aussi traditionnellement rendu par « le Seigneur ».
    reason: alternative_reading
  - marker: b
    text: Ou « car sa fidélité à l’alliance est pour toujours ». Le mot hébreu חֶסֶד exprime un amour loyal, bienveillant et durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Célébrez
  rationale: L’impératif pluriel hiphil de ידה appelle ici la communauté à exprimer publiquement reconnaissance et louange. « Célébrez » convient au registre liturgique et se construit naturellement avec un complément introduit par « à » implicite en français.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל marque le destinataire de l’action. Le nom divin יהוה est translittéré « Yahweh », conformément à sa valeur de nom propre dans le texte hébreu.
- source_word: כִּי
  choice: car
  rationale: Dans les deux occurrences, כִּי introduit le motif de l’exhortation. « Car » conserve clairement ce lien causal et la structure répétitive du verset.
- source_word: טוֹב
  choice: bon
  rationale: L’adjectif טוֹב affirme largement la bonté de Yahweh, sans la réduire à la bienveillance ou à la générosité.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression signifie littéralement « pour toujours ». Avec « amour fidèle », le verbe « dure » rend naturellement en français la permanence affirmée par la proposition nominale hébraïque.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté, bonté et engagement durable. « Amour fidèle » garde ensemble les dimensions relationnelle et constante du terme sans le limiter à la seule compassion ni au seul cadre juridique de l’alliance.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme comme nom propre. « Yahweh » le représente explicitement, tandis que « le Seigneur » reflète la tradition de lecture sans être la forme écrite dans l’hébreu.
- issue: Rendu de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à l’alliance
  rationale: « Amour fidèle » préserve à la fois l’affection bienveillante et la loyauté durable du mot. L’alternative met davantage en avant son arrière-plan d’alliance, mais risque de restreindre un terme dont la portée est plus riche.
translation_notes:
  register: Français international moderne, digne et liturgique. La répétition de « car » reproduit le parallélisme causal de l’hébreu. « Célébrez » évite la tournure plus lourde « Rendez grâce à » tout en maintenant l’appel communautaire à la reconnaissance et à la louange.
