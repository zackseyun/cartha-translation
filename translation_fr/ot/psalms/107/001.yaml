review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle, notamment le pluriel impératif, les deux propositions causales et la permanence du חֶסֶד. Toutefois, « Célébrez Yahweh » oriente הוֹדוּ vers la louange/célébration et n’exprime pas assez précisément l’action de rendre grâce. L’impératif liturgique « Rendez grâce à Yahweh » rend directement le hiphil de ידה avec son destinataire marqué par לְ.
  naturalness: « Rendez grâce à Yahweh » est une tournure française moderne, digne et liturgique. Elle est plus idiomatique et plus exacte ici que « Célébrez Yahweh »; cette dernière est possible au sens large, mais la justification d’un « à » implicite n’est pas linguistiquement fondée.
  terminology: « Yahweh » respecte le choix du projet pour יהוה. « Amour fidèle » est un rendu prudent et naturel de חֶסֶד, sans imposer une interprétation confessionnelle étroite. La note conserve utilement l’arrière-plan de loyauté et d’alliance sans identifier le terme à la seule « fidélité à l’alliance ».
  issues:
  - severity: medium
    issue: Le rendu de הוֹדוּ par « Célébrez » est trop général.
    rationale: Dans cette formule psalmique, le hiphil de ידה signifie spécifiquement « rendre grâce » / « remercier », même s’il comporte un aspect de louange. « Célébrez » perd cette composante de reconnaissance.
  - severity: low
    issue: La rationale lexicale affirme à tort que « Célébrez » se construit avec un « à » implicite.
    rationale: En français, « célébrer » est transitif direct (« célébrer quelqu’un/quelque chose »). Cette construction ne reflète donc pas la préposition לְ du texte source.
  revised_text: Rendez grâce à Yahweh[a], car il est bon, car son amour fidèle dure pour toujours[b].
