source:
  edition: WLC
  text: כִּֽי שִׁ֭בַּר דַּלְת֣וֹת נְחֹ֑שֶׁת וּ/בְרִיחֵ֖י בַרְזֶ֣ל גִּדֵּֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/016.yaml
  text: For he shattered the doors of bronze and cut through the bars of iron[a].
translation:
  language: fr
  text: Car il a brisé les portes de bronze et coupé les barres de fer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « abattu les barres de fer ». Le verbe hébreu évoque l’action de couper ou d’abattre.
    reason: alternative_lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel précédent à remercier le Seigneur et conserve naturellement la valeur explicative de l’hébreu.
- source_word: שִׁבַּר
  choice: a brisé
  rationale: Rend l’action énergique et décisive du verbe sans imposer l’idée plus précise d’un éclatement en fragments.
- source_word: דַּלְתוֹת
  choice: les portes
  rationale: Correspond au sens lexical direct de portes ou battants; le contexte peut évoquer les portes fortifiées d’une ville.
- source_word: נְחֹשֶׁת
  choice: de bronze
  rationale: Rendu moderne habituel pour ce terme désignant ici du cuivre ou, plus probablement dans cette image, un alliage cuivreux.
- source_word: בְרִיחֵי
  choice: les barres
  rationale: Désigne les barres transversales servant à fermer et renforcer des portes.
- source_word: בַרְזֶל
  choice: de fer
  rationale: Équivalent français direct du nom du métal.
- source_word: גִּדֵּעַ
  choice: mis en pièces
  rationale: Exprime la destruction violente de barres de fer; cette formulation française convient mieux à l’objet que le sens plus littéral «couper» ou «abattre».
theological_decisions:
- issue: Sujet divin implicite
  choice: il
  alternative: le Seigneur
  rationale: Les verbes hébreux sont au masculin singulier sans sujet nommé dans ce verset et renvoient au Seigneur dans le contexte. «Il» préserve cet enchaînement discursif sans expliciter ce que l’hébreu laisse implicite.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme est conservé avec deux verbes de destruction vigoureux. «Portes» suit le nom hébreu plus précisément que «portes fortifiées» ou «portails», tandis que la note préserve la nuance concrète du second verbe.
