  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם מִ֝/מְּצֽוּקוֹתֵי/הֶ֗ם יַצִּילֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/006.yaml
  text: Then they cried out to Yahweh in their trouble[a]; he delivered them from their distresses.
translation:
  language: fr
  text: Alors ils crièrent à Yahweh dans leur détresse[a] ; il les délivra de leurs détresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leur adversité » ou « dans une situation critique ». Le terme hébreu est au singulier et peut désigner la détresse, l’adversité ou une situation resserrée et critique.
    reason: Le nom צַר peut désigner la détresse, l’adversité ou une situation resserrée et critique ; le singulier hébreu a ici une valeur collective.
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Alors ils crièrent
  rationale: Le wayyiqtol fait avancer le récit ; « alors » exprime naturellement la succession, et « crièrent » rend l’appel pressant de צעק.
- source_word: אֶל
  choice: vers
  rationale: Avec le verbe « crier », « vers » exprime clairement l’orientation de l’appel et reste naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: בַּצַּר לָהֶם
  choice: dans leur détresse
  rationale: צַר désigne ici une situation de détresse ou d’adversité. Le singulier collectif de l’hébreu est conservé.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: de leurs angoisses
  rationale: Le pluriel מְצוּקוֹת évoque des situations oppressantes et multiples. « Angoisses » maintient le pluriel et distingue cette expression de la détresse singulière du premier membre.
- source_word: יַצִּילֵם
  choice: il les délivra
  rationale: Le hiphil de נצל signifie délivrer ou arracher au danger. Le passé simple convient à la progression narrative et au registre poétique digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre et sans privilégier la forme traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre la « détresse » au singulier et les « angoisses » au pluriel est conservé, tout comme la succession entre l’appel et la délivrance.
