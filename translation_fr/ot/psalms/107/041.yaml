  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: fr
  text: 'Mais il élève le pauvre hors de la misère,

    et rend les familles semblables à un troupeau.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il met les familles comme un troupeau ». Le texte hébreu ne précise pas à qui appartiennent les familles; le verbe « élève » peut aussi évoquer le fait de mettre en lieu sûr.'
    reason: Préserve l’absence de possessif explicite avec « familles » et signale la nuance de protection de שׂגב.
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: met … à l’abri
  rationale: Le verbe שׂגב évoque le fait de placer en hauteur et, par extension, en sécurité. « Met à l’abri » exprime naturellement en français la protection impliquée, sans introduire l’idée abstraite d’exaltation.
- source_word: אֶבְיוֹן
  choice: le pauvre
  rationale: אֶבְיוֹן désigne une personne démunie ou dans le besoin. « Le pauvre » est ici courant, direct et adapté au parallélisme avec la misère.
- source_word: מֵעֹנִי
  choice: loin de la misère
  rationale: עֹנִי peut désigner la misère, l’affliction ou la pauvreté. La préposition מִן marque ici l’éloignement de cette condition; « loin de la misère » conserve ce mouvement de délivrance.
- source_word: וַיָּשֶׂם
  choice: fait de
  rationale: שׂים signifie largement « mettre, placer, faire ». Avec « famille » et la comparaison qui suit, « fait de … » donne en français une construction claire et naturelle.
- source_word: כַּצֹּאן
  choice: un troupeau nombreux
  rationale: צֹאן est un collectif désignant le petit bétail, surtout les moutons et les chèvres. Le troupeau suggère ici une famille devenue nombreuse; « nombreux » explicite cette valeur contextuelle sans abandonner l’image pastorale.
- source_word: מִשְׁפָּחוֹת
  choice: sa famille
  rationale: Le nom est morphologiquement pluriel et sans possessif explicite. Dans ce contexte, le français idiomatique rattache les familles au pauvre mentionné dans le premier membre; le singulier collectif « sa famille » évite le peu naturel « ses familles ».
theological_decisions:
- issue: Rapport entre le pauvre et מִשְׁפָּחוֹת (« familles »)
  choice: sa famille
  alternative: des familles / les familles
  rationale: L’hébreu dit littéralement « familles » sans possessif. Le contexte permet de comprendre qu’il s’agit de la descendance ou du groupe familial du pauvre. « Sa famille » rend ce rapport en français courant, tandis qu’une note signale la forme littérale afin de préserver l’ambiguïté grammaticale.
- issue: Valeur de l’image du troupeau
  choice: un troupeau nombreux
  alternative: comme un troupeau
  rationale: Dans le contexte du renversement de situation et de la fécondité, l’image paraît souligner la multiplication des familles. L’ajout de « nombreux » rend cette implication intelligible, sans transformer l’image en affirmation doctrinale distincte.
translation_notes:
  register: Français international moderne, simple et digne. Le vers est formulé au présent narratif, conforme à l’usage poétique français. « Met à l’abri » privilégie la portée protectrice de l’élévation; la note conserve les possibilités plus littérales et l’absence de possessif dans l’hébreu.
