source:
  edition: WLC
  text: יִשְׁלַ֣ח דְּ֭בָר/וֹ וְ/יִרְפָּאֵ֑/ם וִֽ֝/ימַלֵּ֗ט מִ/שְּׁחִיתוֹתָֽ/ם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/020.yaml
  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: fr
  text: Il envoya sa parole et les guérit ; il les délivra de leurs fosses[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de leurs destructions ». Le terme hébreu peut désigner des fosses ou des tombeaux, ainsi que des situations de destruction ou de ruine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: envoya
  rationale: Dans le récit poétique des interventions de Dieu, l’inaccompli hébreu se rend naturellement par un passé narratif. « Envoya » reste direct et concis.
- source_word: דְּבָרוֹ
  choice: sa parole
  rationale: « Sa parole » reproduit l’expression hébraïque sans la réduire à un ordre ou à un message précis, et conserve l’idée d’une parole divine efficace.
- source_word: וְיִרְפָּאֵם
  choice: et les guérit
  rationale: Le verbe רפא signifie ici « guérir » ; le pronom renvoie aux personnes affligées évoquées dans le contexte.
- source_word: וִימַלֵּט
  choice: il les délivra
  rationale: La forme intensive de מלט exprime le fait de faire échapper ou de délivrer. « Délivra » convient au registre du psaume et demeure naturel en français.
- source_word: מִשְּׁחִיתוֹתָם
  choice: de leurs fosses
  rationale: Le nom pluriel peut désigner des fosses associées à la mort, mais aussi, plus largement, des états de destruction. « Leurs fosses » respecte le pluriel et l’image concrète du texte, tandis qu’une note conserve l’autre possibilité.
theological_decisions:
- issue: Portée théologique de « sa parole »
  choice: Conserver « sa parole » comme parole efficace envoyée par Dieu, sans préciser davantage son référent.
  alternative: Traduire « son ordre » ou identifier explicitement la Parole à une personne.
  rationale: Le psaume affirme que Dieu envoie sa parole pour guérir et délivrer, mais il n’explicite pas ici une identification personnelle ou messianique. La traduction ne doit ni exclure les résonances canoniques ni les imposer.
- issue: Sens de מִשְּׁחִיתוֹתָם
  choice: « de leurs fosses » dans le texte, avec l’idée de destruction signalée en note
  alternative: « de leur destruction » ou « de leurs ruines »
  rationale: L’image des fosses convient au danger mortel du contexte et respecte le pluriel hébreu. Toutefois, le terme peut aussi évoquer la destruction ou la ruine, ambiguïté qu’il convient de préserver en note.
translation_notes:
  register: Français moderne, sobre et poétique. Le passé simple maintient la concision du récit psalmique et un registre digne sans archaïsme lexical. Le parallélisme est rendu par un point-virgule.
