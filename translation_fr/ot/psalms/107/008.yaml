  source_fidelity: 'Le sens du refrain est bien rendu : un appel à rendre grâce à Yahweh pour son חֶסֶד et pour ses actes merveilleux envers les êtres humains. Toutefois, « les fils d’Adam » dans la note ne constitue pas le littéral le plus exact : אָדָם est ici le nom commun générique (« humain / homme, humanité »), non le nom propre Adam. La révision conserve aussi la formulation nominale du texte hébreu (« ses merveilles »), sans expliciter par une relative l’action divine déjà impliquée.'
