  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: fr
  text: Qu’ils rendent grâce à Yahweh pour son amour fidèle et pour ses merveilles envers les êtres humains[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’homme » ; expression hébraïque courante désignant les êtres humains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Qu’ils rendent grâce
  rationale: Le hifil de ידה exprime ici l’action de remercier ou de louer. « Rendre grâce » convient au refrain du psaume et à la construction avec ce qui motive la reconnaissance.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque le destinataire de l’action de grâce, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne un amour loyal, constant et bienveillant. « Amour fidèle » en conserve la force relationnelle sans imposer dans le texte une explicitation doctrinale comme « amour d’alliance ».
- source_word: וְנִפְלְאוֹתָיו
  choice: pour les merveilles qu’il accomplit
  rationale: נִפְלָאוֹת désigne des actes extraordinaires suscitant l’émerveillement. Cette formulation naturelle en français rend explicitement la valeur active de ces merveilles.
- source_word: לִבְנֵי אָדָם
  choice: en faveur des humains
  rationale: Littéralement « pour les fils d’Adam/de l’être humain », cette expression hébraïque courante désigne collectivement les êtres humains. « En faveur des humains » rend clairement le bénéficiaire des actes merveilleux.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Portée de בני אדם
  choice: les humains
  alternative: les fils d’Adam
  rationale: L’expression a ici une portée générique et collective. Le rendu idiomatique évite qu’une traduction littérale soit comprise comme visant seulement les hommes ou des descendants particuliers, tandis que la note conserve l’image hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé par la répétition de « pour », et l’exclamation convient à l’appel à la reconnaissance formulé dans le refrain.
