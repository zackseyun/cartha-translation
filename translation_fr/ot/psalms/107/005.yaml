  variant: modern international French
source:
  edition: WLC
  text: רְעֵבִ֥ים גַּם צְמֵאִ֑ים נַ֝פְשָׁ֗/ם בָּ/הֶ֥ם תִּתְעַטָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/005.yaml
  text: Hungry and thirsty[b][a], their soul fainted within them.
translation:
  language: fr
  text: Affamés et assoiffés, leur âme[a] défaillait en eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur vie défaillait en eux » ou « ils défaillaient eux-mêmes » ; le mot hébreu peut désigner l’âme, la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעֵבִים
  choice: Affamés
  rationale: L’adjectif désigne ceux qui ont faim. « Affamés » convient au registre poétique sans imposer nécessairement l’intensité extrême de « mourant de faim ».
- source_word: גַּם
  choice: et
  rationale: Dans cette coordination, « et » exprime naturellement en français le cumul de la faim et de la soif; « et aussi » serait plus lourd.
- source_word: צְמֵאִים
  choice: assoiffés
  rationale: Équivalent courant de l’adjectif hébreu, parallèle à « affamés ».
- source_word: נַפְשָׁם
  choice: leur âme[a]
  rationale: Ce choix conserve l’image anthropologique de l’hébreu, tout en signalant par une note que נֶפֶשׁ peut ici désigner la vie ou la personne elle-même.
- source_word: בָּהֶם
  choice: en eux
  rationale: L’expression marque le siège intérieur de la défaillance et reproduit sobrement l’image hébraïque.
- source_word: תִּתְעַטָּף
  choice: défaillait
  rationale: Dans ce contexte de faim et de soif, le verbe décrit les forces intérieures qui s’épuisent. L’imparfait s’intègre au récit et rend l’état prolongé.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: Conserver « âme » dans le texte avec une note lexicale
  alternative: « leur vie » ou « eux-mêmes »
  rationale: Le terme ne désigne pas obligatoirement une âme immatérielle distincte du corps. La formulation retenue préserve l’image du texte sans exclure ses autres nuances.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme « Affamés et assoiffés » reste fluide; « leur âme défaillait en eux » conserve l’image intérieure et la légère étrangeté expressive de l’hébreu.
