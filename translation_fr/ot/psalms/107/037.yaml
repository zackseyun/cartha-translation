  text: וַ/יִּזְרְע֣וּ שָׂ֭דוֹת וַ/יִּטְּע֣וּ כְרָמִ֑ים וַ֝/יַּעֲשׂ֗וּ פְּרִ֣י תְבֽוּאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/037.yaml
  text: They sowed fields and planted vineyards[a], and produced the fruit of the harvest.
translation:
  language: fr
  text: Ils ensemencèrent des champs et plantèrent des vignes, et ils en retirèrent une récolte abondante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et ils produisirent le fruit de la récolte ».'
    reason: La construction hébraïque פְּרִי תְבוּאָה est rendue de manière idiomatique dans le texte, tandis que la note en conserve la relation lexicale.
lexical_decisions:
- source_word: וַיִּזְרְעוּ
  choice: ils ensemencèrent
  rationale: Le verbe זרע désigne l’action de semer. « Ensemencer des champs » est une tournure agricole naturelle en français et évite l’expression moins idiomatique « semer des champs ».
- source_word: שָׂדוֹת
  choice: des champs
  rationale: Le pluriel de שָׂדֶה désigne ici des terres cultivées; « champs » en rend directement le sens.
- source_word: וַיִּטְּעוּ
  choice: plantèrent
  rationale: נטע est le verbe courant pour planter, notamment une vigne ou un vignoble.
- source_word: כְרָמִים
  choice: des vignes
  rationale: כֶּרֶם désigne un vignoble ou une vigne comme terrain planté. En français courant, « planter des vignes » est plus naturel que « planter des vignobles ».
- source_word: וַיַּעֲשׂוּ
  choice: qui donnèrent
  rationale: Littéralement « et ils firent ». Dans ce contexte agricole, le verbe exprime la production; la relative « qui donnèrent » rattache naturellement le rendement aux cultures sans altérer le résultat décrit.
- source_word: פְּרִי תְבוּאָה
  choice: une récolte fructueuse
  rationale: פְּרִי signifie « fruit, produit » et תְבוּאָה « production, récolte ». La formulation française exprime idiomatiquement l’abondance productive de la locution, tandis que la note conserve sa forme littérale.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Ensemencèrent » conserve le geste agricole précis; « plantèrent des vignes » est idiomatique. La dernière proposition privilégie une expression naturelle tout en signalant dans la note la densité et l’ambiguïté lexicales de l’hébreu.
