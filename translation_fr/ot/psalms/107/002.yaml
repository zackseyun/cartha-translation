source:
  edition: WLC
  text: יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה אֲשֶׁ֥ר גְּ֝אָלָ֗/ם מִ/יַּד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: fr
  text: 'Que les rachetés de Yahweh le proclament,

    eux qu’il a rachetés de la main de l’adversaire ![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la main de l’ennemi » ou « de l’oppresseur ». Le mot hébreu peut désigner un adversaire, un ennemi ou quelqu’un qui opprime.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: le proclament
  rationale: Dans ce contexte d’exhortation, l’imparfait a une valeur volitive. « Le proclament » exprime naturellement en français l’appel à déclarer publiquement la délivrance évoquée au verset précédent.
- source_word: גְּאוּלֵי
  choice: ceux que Yahweh a rachetés
  rationale: Le participe passif de גאל désigne les personnes délivrées par l’action du rédempteur. Cette tournure est plus naturelle en français courant que le substantif « les rachetés » et conserve le vocabulaire du rachat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: גְּאָלָם
  choice: qu’il a rachetés
  rationale: Le parfait présente l’action comme accomplie. La reprise du verbe « racheter » conserve la répétition hébraïque fondée sur la racine גאל.
- source_word: מִיַּד
  choice: de la main de
  rationale: La traduction garde l’image hébraïque de la main comme symbole de pouvoir ou d’emprise, image encore intelligible en français.
- source_word: צָר
  choice: l’adversaire
  rationale: Le substantif singulier désigne ici celui qui se montre hostile ou oppresse. « Adversaire » préserve cette largeur de sens sans réduire nécessairement le terme à un ennemi militaire.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin au lieu de lui substituer un titre.
- issue: Portée du vocabulaire de גאל
  choice: rachetés
  alternative: délivrés
  rationale: « Racheter » maintient le lien lexical entre le participe גְּאוּלֵי et le verbe גְּאָלָם, ainsi que la dimension de délivrance attachée à la racine, sans préciser davantage le mécanisme du rachat.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme et la répétition de la racine hébraïque גאל sont conservés. L’exclamation rend la force exhortative du verset.
