  yaml_path: translation/ot/psalms/107/027.yaml
  text: They reel and stagger like a drunkard[a], and all their wisdom is swallowed up.
translation:
  language: fr
  text: Ils titubent et chancellent comme un homme ivre, et toute leur sagesse[a] est engloutie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte maritime, « sagesse » peut désigner leur compétence pratique, notamment leur savoir-faire de marins.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹגּוּ
  choice: Ils titubent
  rationale: Dans ce contexte, le verbe décrit un mouvement instable. « Titubent » est naturel en français et s’accorde avec l’image de l’ivresse.
- source_word: וְיָנוּעוּ
  choice: et chancellent
  rationale: Le verbe exprime l’oscillation ou la perte d’équilibre. « Chancellent » préserve le parallélisme de deux verbes de mouvement proches sans les confondre.
- source_word: כַּשִּׁכּוֹר
  choice: comme un homme ivre
  rationale: Cette formulation rend clairement et dignement la comparaison exprimée par le substantif ou adjectif masculin singulier.
- source_word: וְכָל חָכְמָתָם
  choice: et tout leur savoir-faire
  rationale: חָכְמָה signifie couramment « sagesse », mais désigne ici, dans une scène de tempête en mer, la compétence pratique des marins. « Savoir-faire » garde cette portée sans limiter explicitement le terme à la navigation.
- source_word: תִּתְבַּלָּע
  choice: sombre
  rationale: Le verbe évoque ce qui est englouti ou absorbé. Dans le contexte maritime, « sombre » restitue naturellement l’image concrète tout en exprimant l’effondrement de leur compétence.
theological_decisions: []
translation_notes:
  register: Français moderne, international et poétique. Le double mouvement « titubent et chancellent » conserve le parallélisme hébreu ; « savoir-faire » explicite avec mesure le sens contextuel de חָכְמָה, tandis que la note préserve le sens lexical plus formel.
