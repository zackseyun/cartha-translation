  source_fidelity: Le parallélisme des deux verbes de démarche instable est bien rendu par « titubent et chancellent », et la comparaison « comme un homme ivre » est fidèle. En revanche, « tout leur savoir-faire sombre » modifie la métaphore de תִּתְבַּלָּע (« est engloutie / avalée ») et donne à « savoir-faire » un sujet peu naturel pour « sombre ».
