  text: וַ/יַּכְנַ֣ע בֶּ/עָמָ֣ל לִבָּ֑/ם כָּ֝שְׁל֗וּ וְ/אֵ֣ין עֹזֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/012.yaml
  text: So he humbled their heart with hard labor[a]; they stumbled[c][b], and there was no one to help.
translation:
  language: fr
  text: Il a abaissé leur cœur[a] par la peine[b] ; ils ont trébuché[c], sans personne pour les secourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « leur cœur » ; le singulier a ici un sens collectif.
    reason: lexical_alternative
  - marker: b
    text: Ou « par un dur labeur », « par des travaux pénibles » ou « dans la détresse » ; le mot hébreu peut désigner le labeur, la peine ou la détresse.
    reason: lexical_alternative
  - marker: c
    text: Ou « ils sont tombés » ou « ils se sont effondrés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: il a humilié
  rationale: Le hiphil de כנע exprime ici l’action de rabaisser ou d’humilier. Le sujet masculin singulier, implicite dans ce verset, est Dieu d’après le contexte immédiat.
- source_word: בֶּעָמָל
  choice: par un dur labeur
  rationale: עָמָל peut désigner un travail pénible, la peine ou la misère. « Par un dur labeur » convient au contexte d’oppression tout en laissant les autres nuances en note.
- source_word: לִבָּם
  choice: leur cœur
  rationale: Le singulier hébreu est collectif et désigne leur être intérieur, notamment leur courage ou leur volonté. Le français peut conserver naturellement cette formulation.
- source_word: כָּשְׁלוּ
  choice: ils ont trébuché
  rationale: כשל évoque le fait de trébucher, de chanceler, voire de s’effondrer. « Ils ont trébuché » préserve l’image sans imposer nécessairement l’idée d’une chute complète.
- source_word: וְאֵין עֹזֵר
  choice: sans personne pour les aider
  rationale: Cette tournure française naturelle rend la construction existentielle אֵין suivie du participe et souligne l’absence totale de secours humain.
theological_decisions:
- issue: Sujet implicite de וַיַּכְנַע
  choice: 'Dieu est le sujet implicite : « il a humilié »'
  alternative: 'Formulation passive : « leur cœur a été humilié »'
  rationale: Le contexte attribue au Seigneur l’épreuve puis la délivrance. Garder le verbe actif au masculin singulier préserve cette attribution sans ajouter explicitement le nom divin absent du verset.
translation_notes:
  register: Français international moderne, sobre et digne. « Dur labeur » garde la dimension concrète et éprouvante du terme hébreu ; les notes préservent son éventail sémantique. La ponctuation maintient le parallélisme du verset.
