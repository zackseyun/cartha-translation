  yaml_path: translation/ot/psalms/107/004.yaml
  text: They wandered in the wilderness[a], in a desolate way; they found no city to dwell in.
translation:
  language: fr
  text: Ils erraient dans le désert, sur un chemin désolé ; ils ne trouvaient aucune ville où habiter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעוּ
  choice: Ils erraient
  rationale: Le verbe תעה exprime l’idée d’errer ou de s’égarer. Dans ce contexte de voyageurs sans direction, « erraient » rend à la fois leur déplacement et leur désorientation sans y ajouter explicitement une faute morale.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage ou désertique. En français courant, « désert » évoque naturellement ici un espace aride et inhabité.
- source_word: בִּישִׁימוֹן
  choice: sur une terre désolée
  rationale: יְשִׁימוֹן désigne une étendue déserte ou dévastée. « Terre désolée » conserve l’image géographique tout en restant naturel en français.
- source_word: דָּרֶךְ
  choice: chemin
  rationale: דָּרֶךְ peut signifier chemin, route ou voie. Pris comme complément de מָצָאוּ, il désigne le chemin recherché pour atteindre un lieu habité.
- source_word: עִיר מוֹשָׁב
  choice: une ville habitée
  rationale: L’expression désigne une ville où l’on demeure, donc un lieu de peuplement. « Ville habitée » est concis et restitue le contraste avec le désert.
- source_word: לֹא מָצָאוּ
  choice: ils ne trouvaient aucun
  rationale: La négation avec מָצָאוּ indique qu’ils ne réussirent pas à trouver ce qu’ils cherchaient. L’imparfait français s’accorde avec la scène durative introduite par « erraient ».
