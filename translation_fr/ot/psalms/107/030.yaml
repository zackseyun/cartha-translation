  text: וַ/יִּשְׂמְח֥וּ כִֽי יִשְׁתֹּ֑קוּ וַ֝/יַּנְחֵ֗/ם אֶל מְח֥וֹז חֶפְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/030.yaml
  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: fr
  text: Alors ils se réjouirent du retour au calme[a], et il les conduisit au port[b] qu’ils désiraient atteindre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car/parce qu’ils se turent » ou « devinrent silencieux ». Le sujet sous-entendu peut désigner les vagues ou les eaux devenues calmes.'
    reason: Ambiguïté grammaticale et variante lexicale.
  - marker: b
    text: Ou « lieu d’arrivée » ; le mot hébreu peut désigner un port, un havre ou une destination.
    reason: Alternative lexicale.
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Alors ils se réjouirent
  rationale: Le verbe שׂמח exprime la joie. « Alors » rend naturellement la progression narrative marquée par le waw consécutif.
- source_word: כִּי יִשְׁתֹּקוּ
  choice: du retour au calme
  rationale: שׁתק signifie « se taire, devenir calme ». La formulation nominale est naturelle en français et évite d’attribuer trop explicitement le verbe aux marins ou aux eaux, puisque le sujet n’est pas exprimé dans ce verset.
- source_word: וַיַּנְחֵם
  choice: et il les conduisit
  rationale: נחה signifie « conduire, guider ». Le sujet masculin singulier implicite renvoie à Dieu dans le contexte immédiat.
- source_word: מְחוֹז
  choice: au port
  rationale: Le nom désigne ici un lieu d’arrivée dans un contexte maritime. « Port » est clair, courant et précis en français moderne.
- source_word: חֶפְצָם
  choice: qu’ils désiraient atteindre
  rationale: Le suffixe exprime leur désir à l’égard du lieu d’arrivée. Cette tournure est plus idiomatique en français que « leur port désiré » et conserve l’idée d’une destination ardemment souhaitée.
theological_decisions:
- issue: Sujet implicite de וַיַּנְחֵם
  choice: Le sujet est rendu par « il », avec Dieu comme référent contextuel.
  alternative: Une tournure passive telle que « ils furent conduits ».
  rationale: Le verbe hébreu est à la troisième personne du masculin singulier, et le contexte présente le Seigneur comme celui qui intervient après leur cri. Le pronom conserve cette action personnelle sans ajouter le nom divin au verset.
- issue: Sujet non exprimé de יִשְׁתֹּקוּ
  choice: « du retour au calme », sans sujet explicite
  alternative: « parce que les eaux s’étaient apaisées » ou, plus littéralement, « parce qu’ils s’étaient calmés ».
  rationale: Le contexte suggère fortement l’apaisement des vagues ou des eaux, mais le verset hébreu n’en nomme pas explicitement le sujet. La traduction principale préserve cette légère indétermination, tandis que la note expose les lectures possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Retour au calme » garde l’image maritime du contexte sans introduire dans le corps du verset un sujet absent de l’hébreu ; « port qu’ils désiraient atteindre » exprime naturellement la destination souhaitée.
