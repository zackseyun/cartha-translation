  text: כָּל אֹ֭כֶל תְּתַעֵ֣ב נַפְשָׁ֑/ם וַ֝/יַּגִּ֗יעוּ עַד שַׁ֥עֲרֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/018.yaml
  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: fr
  text: Toute nourriture leur faisait horreur[a], et ils arrivèrent jusqu’aux portes de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur âme avait en horreur toute nourriture ». Ici, le mot hébreu traduit par « âme » peut désigner l’être lui-même, la vie ou l’appétit.'
    reason: alternative lexicale et conservation de l’image hébraïque
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: toute nourriture
  rationale: 'Cette formulation rend naturellement en français la portée collective de כָּל avec אֹכֶל : la nourriture sous toutes ses formes.'
- source_word: תְּתַעֵב
  choice: leur faisait horreur
  rationale: Le piel de תעב exprime une forte répulsion. « Leur faisait horreur » en restitue l’intensité dans un français actuel et digne.
- source_word: נַפְשָׁם
  choice: leur
  rationale: Le pronom français exprime ici les personnes elles-mêmes de façon naturelle. La note conserve toutefois l’image hébraïque, « leur âme », et signale les nuances possibles de נֶפֶשׁ dans ce contexte.
- source_word: וַיַּגִּיעוּ עַד
  choice: ils arrivèrent jusqu’à
  rationale: Le hifil de נגע accompagné de עַד évoque le fait d’atteindre une limite. Cette traduction préserve l’image d’hommes parvenus au seuil de la mort sans suggérer qu’ils l’ont franchi.
- source_word: שַׁעֲרֵי מָוֶת
  choice: les portes de la mort
  rationale: Traduction directe de la métaphore hébraïque, qui représente le seuil de la mort sans introduire le Shéol, absent du texte.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte d’une maladie grave
  choice: leur, avec explicitation en note de l’expression littérale « leur âme »
  alternative: leur âme avait en horreur toute nourriture ; leur appétit rejetait toute nourriture
  rationale: En français, « leur âme avait en horreur toute nourriture » risquerait de suggérer une opposition entre âme et corps étrangère au contexte. Le texte principal désigne donc naturellement les personnes tout entières, tandis que la note maintient l’anthropologie ouverte du terme hébreu, qui peut évoquer l’être, la vie ou l’appétit.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. « Leur faisait horreur » garde la force de la répulsion ; « jusqu’aux portes de la mort » conserve la métaphore biblique et l’idée d’un seuil atteint sans être franchi.
