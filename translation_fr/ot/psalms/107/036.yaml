  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: fr
  text: Il y installa ceux qui avaient faim, et ils établirent une ville pour y habiter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une ville d’habitation ».'
    reason: Alternative plus littérale pour l’expression hébraïque עִיר מוֹשָׁב, « une ville de demeure/d’habitation ».
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: il installa
  rationale: Le hiphil de ישׁב exprime ici l’idée causative de faire habiter ou d’établir quelqu’un en un lieu. « Il installa » est naturel en français et garde cette nuance.
- source_word: שָׁם
  choice: y
  rationale: Le pronom adverbial « y » reprend naturellement le lieu évoqué dans le contexte et traduit שָׁם sans lourdeur.
- source_word: רְעֵבִים
  choice: ceux qui avaient faim
  rationale: L’adjectif pluriel est employé comme substantif. Cette formulation courante désigne clairement les personnes affamées sans registre excessivement soutenu.
- source_word: וַיְכוֹנְנוּ
  choice: ils fondèrent
  rationale: Dans le contexte d’une ville, כון évoque son établissement durable. « Fondèrent » rend cette idée de façon idiomatique, sans réduire le verbe à la seule construction matérielle.
- source_word: עִיר
  choice: une ville
  rationale: « Ville » est l’équivalent ordinaire de עִיר dans l’usage biblique, même si la taille précise de l’agglomération n’est pas indiquée.
- source_word: מוֹשָׁב
  choice: pour y habiter
  rationale: מוֹשָׁב désigne l’habitation ou le lieu où l’on demeure. Dans la construction עִיר מוֹשָׁב, « une ville pour y habiter » exprime naturellement en français la destination de la ville.
theological_decisions:
- issue: Sujet implicite du verbe singulier וַיּוֹשֶׁב
  choice: Le sujet est Dieu, repris par « il » conformément au contexte du psaume.
  alternative: Un sujet indéterminé, comme « on », pourrait être envisagé si le verset était isolé.
  rationale: Les versets environnants racontent les actes de Dieu. Le maintien du simple pronom « il » respecte toutefois la forme hébraïque sans ajouter ici un titre divin absent du verset.
translation_notes:
  register: Français international moderne, clair et digne. « Ceux qui avaient faim » reste accessible, tandis que « fondèrent une ville » conserve la portée durable du verbe hébreu. Le marqueur de note est placé sur l’expression à laquelle l’alternative se rapporte.
