lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Certains habitaient
  rationale: Le participe de ישב désigne ceux qui sont assis ou qui demeurent dans une situation. Une proposition verbale est naturelle en français, et « certains » convient à la succession des groupes décrits dans le psaume.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: « Ténèbres » rend directement l’obscurité, concrète ou figurée, tout en conservant le registre poétique.
- source_word: צַלְמָוֶת
  choice: l’ombre profonde
  rationale: Le terme évoque vraisemblablement une obscurité ou une ombre très profonde. Cette formulation préserve l’image sans introduire explicitement la mort; la traduction traditionnelle figure en note.
- source_word: אֲסִירֵי
  choice: prisonniers
  rationale: Le pluriel construit désigne des personnes liées ou détenues. « Prisonniers » est clair et s’accorde avec l’image des fers.
- source_word: עֳנִי
  choice: la misère
  rationale: Le nom peut désigner l’affliction, la détresse ou la pauvreté. « Misère » exprime ici une condition pénible sans la limiter au seul dénuement économique.
- source_word: בַרְזֶל
  choice: les fers
  rationale: Bien que l’hébreu ait le singulier « fer », celui-ci désigne par métonymie des entraves métalliques. En français, « les fers » est l’expression idiomatique correspondante.
