  source_fidelity: 'Le sens général est bien rendu : le verset décrit un groupe plongé dans les ténèbres et retenu sous des entraves. « Ténèbres », « ombre profonde », « misère » et « fers » correspondent de manière défendable aux termes hébreux. Toutefois, la construction « prisonniers dans la misère et les fers » affaiblit la relation construite d’אָסִירֵי avec les deux substantifs qui suivent : il s’agit de prisonniers/captifs caractérisés ou retenus par l’affliction et le fer, non de personnes situées « dans » ces réalités.'
