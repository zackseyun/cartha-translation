  text: Some sat in darkness and deep shadow[a], prisoners in affliction and irons,
translation:
  language: fr
  text: Certains habitaient les ténèbres et l’ombre profonde[a], prisonniers de la misère et des fers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ombre de la mort », traduction traditionnelle de צַלְמָוֶת ; le mot hébreu désigne probablement plus largement une obscurité profonde ou lugubre.
