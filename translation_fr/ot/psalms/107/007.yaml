  text: He led them by a straight way to go to a city to dwell in[a].
translation:
  language: fr
  text: Il les conduisit par un chemin droit vers une ville où habiter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « vers une ville d’habitation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Il les conduisit
  rationale: Le hiphil de דרך exprime l’action de conduire ou guider. « Conduisit » restitue naturellement le sens causatif dans ce contexte de voyage.
- source_word: בְּדֶרֶךְ
  choice: par un chemin
  rationale: דֶּרֶךְ peut désigner un chemin, une route ou une voie. « Par un chemin » est concret et idiomatique en français.
- source_word: יְשָׁרָה
  choice: droit
  rationale: L’adjectif signifie « droit » ou « rectiligne »; ici, il évoque concrètement un itinéraire direct et sûr.
- source_word: לָלֶכֶת אֶל
  choice: vers
  rationale: L’infinitif de but suivi de אֶל indique le déplacement en direction de la ville. En français, « vers » exprime ce mouvement avec naturel sans alourdir la phrase par « pour aller jusqu’à ».
- source_word: עִיר
  choice: une ville
  rationale: עִיר désigne une ville ou une localité; « ville » est le terme usuel et convient à l’image d’un lieu habité après l’errance.
- source_word: מוֹשָׁב
  choice: où ils pourraient habiter
  rationale: מוֹשָׁב désigne une habitation, un séjour ou un lieu habité. Cette formulation française rend la finalité implicite de « ville d’habitation » tout en restant naturelle.
