  text: מִי חָכָ֥ם וְ/יִשְׁמָר אֵ֑לֶּה וְ֝/יִתְבּֽוֹנְנ֗וּ חַֽסְדֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: fr
  text: Qui est sage ? Qu’il retienne tout cela, et qu’ils considèrent[a] les actes d’amour fidèle de Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe ici du singulier (« qu’il retienne ») au pluriel (« qu’ils considèrent »).
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le pluriel, littéralement « les amours fidèles » ; il peut désigner les nombreux actes d’amour fidèle et de miséricorde de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Qui est sage ?
  rationale: La question rhétorique propre au langage de sagesse est conservée directement, sans la transformer en proposition générale (« quiconque est sage »).
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: Qu’il retienne tout cela
  rationale: Le verbe שׁמר exprime ici l’idée de garder attentivement, de ne pas oublier. « Retenir tout cela » est naturel en français et renvoie à l’ensemble des faits racontés dans le psaume.
- source_word: וְיִתְבּוֹנְנוּ
  choice: et qu’ils considèrent
  rationale: La forme exprime une réflexion attentive et discernante. Le pluriel « ils » conserve le passage remarquable du singulier au pluriel dans l’hébreu.
- source_word: חַסְדֵי
  choice: les bontés fidèles
  rationale: Le pluriel de חֶסֶד évoque les multiples manifestations de la bonté, de la loyauté et de la miséricorde divines. « Bontés fidèles » conserve à la fois le pluriel et la dimension de fidélité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
theological_decisions:
- issue: Passage du singulier au pluriel
  choice: « Qu’il retienne… et qu’ils considèrent »
  alternative: « Que le sage retienne… et considère »
  rationale: L’hébreu passe délibérément d’un sujet masculin singulier à un verbe pluriel. La traduction préserve cette tension au lieu de l’uniformiser.
- issue: Sens et nombre de חַסְדֵי
  choice: « les bontés fidèles »
  alternative: « l’amour fidèle »
  rationale: Le pluriel hébreu peut désigner les nombreux actes de bonté loyale de Dieu. Le français au pluriel rend visible cette nuance sans limiter le terme à une seule qualité abstraite.
- issue: Rendu du nom divin
  choice: « Yahweh »
  alternative: « le Seigneur »
  rationale: Le texte porte le nom propre יהוה ; sa translittération distingue le nom divin d’un titre.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve la question de sagesse, le changement de nombre grammatical et le pluriel de חֶסֶד, tout en employant une expression française naturelle pour שׁמר.
