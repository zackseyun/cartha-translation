source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְלוּ אֵ֥ל בְּ/קָדְשׁ֑/וֹ הַֽ֝לְל֗וּ/הוּ בִּ/רְקִ֥יעַ עֻזּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: fr
  text: Louez Yah[a] ! Louez Dieu dans son sanctuaire[b] ! Louez-le dans l’étendue de sa puissance[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Yah, forme abrégée du nom divin ; beaucoup de traductions rendent ce nom par « le Seigneur ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « dans sa sainteté » ou « dans son lieu saint ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans le firmament de sa force » ou « dans sa puissante étendue ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louez
  rationale: Impératif pluriel de הלל servant d’appel liturgique. « Louez » est direct, naturel et conserve la répétition exhortative de l’hébreu.
- source_word: יָהּ
  choice: Yah
  rationale: Il s’agit de la forme abrégée du nom divin. « Yah » maintient cette distinction lexicale et fait entendre l’acclamation liturgique à l’origine d’« alléluia ».
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל désigne Dieu sans qu’il soit nécessaire d’ajouter « puissant » ou « tout-puissant », ce qui expliciterait davantage que le texte.
- source_word: בְּקָדְשׁוֹ
  choice: dans son sanctuaire
  rationale: קֹדֶשׁ peut désigner la sainteté ou un lieu saint. Le parallélisme locatif avec « dans l’étendue » favorise ici « sanctuaire », tout en laissant les autres possibilités en note.
- source_word: הַלְלוּהוּ
  choice: Louez-le
  rationale: Le même impératif porte ici un suffixe objet masculin singulier, naturellement rendu en français par « le ».
- source_word: בִּרְקִיעַ
  choice: dans l’étendue
  rationale: רָקִיעַ évoque ce qui est déployé ou étendu. « Étendue » garde l’image hébraïque sans recourir au terme vieilli « firmament » ni réduire le mot au simple « ciel ».
- source_word: עֻזּוֹ
  choice: de sa puissance
  rationale: עֹז exprime la force ou la puissance. « Puissance » convient au registre d’éloge et conserve la relation nominale concise de l’hébreu.
theological_decisions:
- issue: Traduction de la forme courte du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: Le texte emploie יָהּ, forme abrégée du nom divin, et non le tétragramme complet. La translittération « Yah » préserve cette particularité et la tonalité de l’acclamation liturgique.
- issue: Sens de קֹדֶשׁ avec le suffixe possessif
  choice: son sanctuaire
  alternative: sa sainteté / son lieu saint
  rationale: Le parallélisme avec un second complément introduit par « dans » rend probable une référence spatiale, sans exclure entièrement le sens abstrait de « sainteté ».
- issue: Relation entre רָקִיעַ et עֹז
  choice: l’étendue de sa puissance
  alternative: le firmament de sa force / sa puissante étendue
  rationale: La formulation conserve le rapport génitival de l’hébreu et son ambiguïté poétique, sans décider si la puissance caractérise l’étendue ou s’y manifeste.
translation_notes:
  register: Français international moderne, sobre et liturgique. Les trois impératifs parallèles sont conservés, avec une ponctuation exclamative qui restitue l’élan de l’appel à la louange. La formulation volontairement dense « l’étendue de sa puissance » maintient la tension poétique et l’ambiguïté de l’hébreu.
