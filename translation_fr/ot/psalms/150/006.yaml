source:
  edition: WLC
  text: כֹּ֣ל הַ֭/נְּשָׁמָה תְּהַלֵּ֥ל יָ֗הּ הַֽלְלוּ יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/006.yaml
  text: Let everything that has breath praise Yah[a]. Praise Yah!
translation:
  language: fr
  text: Que tout ce qui respire loue Yah ! Louez Yah[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Alléluia ! » L’expression hébraïque הַלְלוּ־יָהּ est à l’origine de la formule liturgique « Alléluia ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: tout ce qui respire
  rationale: La tournure française exprime naturellement la portée universelle de כֹּל avec הַנְּשָׁמָה, littéralement liée au souffle ou à la respiration. Elle conserve l’image des êtres animés par le souffle sans introduire la notion plus étroite d’« âme ».
- source_word: תְּהַלֵּל
  choice: loue
  rationale: Dans ce contexte d’appel culminant à la louange, l’imparfait hébreu a une valeur jussive. La construction « Que… loue » en rend clairement la force exhortative.
- source_word: יָהּ
  choice: Yah
  rationale: Yah est la forme poétique abrégée du nom divin employée dans le texte. La conserver respecte sa forme particulière et son lien sonore avec הַלְלוּ־יָהּ.
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif hébreu est au pluriel et adresse directement un appel collectif. « Louez Yah ! » en traduit le sens plutôt que de reprendre uniquement la translittération liturgique traditionnelle.
theological_decisions:
- issue: Rendu de la forme poétique abrégée du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: Le texte porte יָהּ, et non la forme complète du tétragramme. « Yah » préserve cette distinction lexicale et poétique sans ajouter une interprétation confessionnelle.
- issue: Traduction ou translittération de הַלְלוּ־יָהּ
  choice: Louez Yah ! dans le texte principal
  alternative: Alléluia !
  rationale: La traduction principale rend directement le sens de l’impératif hébreu, tandis que la forme liturgique française bien établie est signalée en note.
translation_notes:
  register: Français international moderne, simple et solennel. La répétition de « Yah » et les deux exclamations conservent le caractère culminant et liturgique de la conclusion du psaume.
