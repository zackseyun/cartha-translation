  yaml_path: translation/ot/psalms/150/005.yaml
  text: Praise him with sounding cymbals[b][a]; praise him with clashing cymbals.
translation:
  language: fr
  text: Louez-le avec des cymbales sonores ; louez-le avec des cymbales retentissantes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des cymbales de teroua ». Le mot hébreu peut désigner un cri, une acclamation, une sonnerie ou un bruit retentissant ; avec des cymbales, il évoque probablement leur fracas puissant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Louez-le
  rationale: L’impératif masculin pluriel de הלל, accompagné du suffixe de troisième personne masculin singulier, adresse à la communauté un appel direct à louer Dieu. La répétition est conservée.
- source_word: בְצִלְצְלֵי
  choice: au son des cymbales
  rationale: La préposition ב a ici une valeur instrumentale. « Au son des cymbales » est naturel en français et rend explicite leur fonction sonore dans la louange.
- source_word: שָׁמַע
  choice: retentissantes
  rationale: Dans cette construction nominale, le mot qualifie vraisemblablement des cymbales dont le son se fait clairement entendre. « Retentissantes » exprime un son sonore et ample sans surcharger la formulation.
- source_word: תְרוּעָה
  choice: éclatantes
  rationale: תְרוּעָה peut désigner une clameur, un cri d’acclamation ou une sonnerie éclatante. Appliqué aux cymbales, le terme évoque ici un bruit puissant et jubilatoire ; « éclatantes » convient à l’instrument tout en laissant percevoir cette intensité.
