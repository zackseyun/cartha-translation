  text: הַֽ֭לְלוּ/הוּ בְ/תֹ֣ף וּ/מָח֑וֹל הַֽ֝לְל֗וּ/הוּ בְּ/מִנִּ֥ים וְ/עוּגָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/004.yaml
  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
translation:
  language: fr
  text: Louez-le avec le tambourin et la danse ; louez-le avec les instruments à cordes et la flûte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un chalumeau » ou « une flûte de roseau ». Le terme hébreu désigne probablement un instrument à vent, plutôt qu’un orgue moderne à clavier.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Louez-le
  rationale: 'Impératif pluriel de הלל avec suffixe masculin singulier : l’appel s’adresse à la communauté et a Dieu pour objet.'
- source_word: בְתֹף
  choice: au son du tambourin
  rationale: תֹף désigne un instrument de percussion tenu à la main, probablement un tambour sur cadre ; « tambourin » est clair et courant en français moderne.
- source_word: וּמָחוֹל
  choice: et par la danse
  rationale: מָחוֹל désigne la danse ou une danse. La tournure distingue naturellement cette activité des instruments qui l’entourent sans réduire l’ambiguïté lexicale à un objet précis.
- source_word: בְמִנִּים
  choice: au son des instruments à cordes
  rationale: מִנִּים renvoie collectivement aux instruments à cordes ; l’explicitation est plus naturelle et moins ambiguë en français que « les cordes ».
- source_word: וְעוּגָב
  choice: et du chalumeau
  rationale: עוּגָב désigne vraisemblablement un instrument à vent de type tuyau ou flûte de roseau, et non l’orgue moderne. « Chalumeau » évoque ici un instrument ancien à anche ou tuyau, sans suggérer un clavier.
theological_decisions: []
translation_notes:
  register: Français international moderne, accessible et digne. Le parallélisme est conservé par la répétition de « louez-le » ; « au son de » rend naturellement la valeur instrumentale de בְּ, tandis que « par la danse » convient à une activité corporelle.
