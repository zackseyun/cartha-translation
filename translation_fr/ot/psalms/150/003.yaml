  text: הַֽ֭לְלוּ/הוּ בְּ/תֵ֣קַע שׁוֹפָ֑ר הַֽ֝לְל֗וּ/הוּ בְּ/נֵ֣בֶל וְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/003.yaml
  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: fr
  text: Louez-le au son du shofar[a] ; louez-le avec la harpe et la lyre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au son de la trompe ». Le shofar est une corne, souvent de bélier, utilisée dans le culte et pour donner des signaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: Louez-le
  rationale: L’impératif pluriel de הלל, accompagné du suffixe masculin singulier, adresse à la communauté un appel direct. « Louez-le » est naturel, concis et permet de conserver la répétition hébraïque.
- source_word: בְּ/תֵקַע
  choice: au son éclatant du
  rationale: תֵּקַע désigne le fait de souffler ou le son produit, particulièrement une sonnerie de cor. « Au son éclatant du » met l’accent sur la sonnerie entendue plutôt que sur le seul instrument.
- source_word: שׁוֹפָר
  choice: shofar
  rationale: שׁוֹפָר désigne un cor employé notamment dans le culte et pour donner des signaux, souvent fabriqué avec une corne de bélier. Le terme français « shofar », aujourd’hui attesté et précis, évite de l’assimiler à une trompette moderne ; une note l’explique.
- source_word: בְּ/נֵבֶל
  choice: avec la harpe
  rationale: נֵבֶל désigne un instrument à cordes dont l’identification exacte demeure incertaine. « Harpe » est un équivalent français courant et lisible.
- source_word: וְ/כִנּוֹר
  choice: et la lyre
  rationale: כִּנּוֹר désigne un autre instrument à cordes. « Lyre » le distingue de נֵבֶל et préserve la paire de deux instruments du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « Louez-le » et le parallélisme du vers hébreu sont conservés. « Shofar » apporte la précision culturelle, tandis que la note fournit un équivalent descriptif immédiatement accessible.
