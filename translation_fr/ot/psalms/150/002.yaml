source:
  edition: WLC
  text: הַֽלְל֥וּ/הוּ בִ/גְבוּרֹתָ֑י/ו הַֽ֝לְל֗וּ/הוּ כְּ/רֹ֣ב גֻּדְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/002.yaml
  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
translation:
  language: fr
  text: Louez-le pour ses actes puissants[a] ; louez-le à la mesure de son immense grandeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen de ses actes puissants » ou « dans ses actes puissants » ; la préposition hébraïque peut être rendue plus formellement, mais elle indique probablement ici le motif de la louange.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon l’abondance de sa grandeur » ; l’hébreu peut exprimer une norme ou une proportion.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Louez-le
  rationale: L’impératif pluriel de הלל, avec suffixe objet masculin singulier, s’adresse directement à la communauté appelée à louer Dieu. « Louez-le » est naturel, actuel et précis.
- source_word: בִגְבוּרֹתָיו
  choice: pour ses actes puissants
  rationale: Le pluriel גְּבוּרוֹת désigne ici des actes manifestant la puissance. La préposition ב marque vraisemblablement le motif de la louange ; « pour » rend ce rapport naturellement en français.
- source_word: כְּרֹב
  choice: à la mesure de son immense
  rationale: La préposition כ avec רֹב exprime une norme ou une mesure proportionnelle. « À la mesure de » préserve cette nuance, tandis que « immense » rend idiomatiquement l’idée d’abondance appliquée à la grandeur.
- source_word: גֻּדְלוֹ
  choice: grandeur
  rationale: Le nom dérivé de גדל désigne fondamentalement la grandeur. Ce choix reste plus direct que « majesté », qui ajouterait une nuance interprétative.
theological_decisions:
- issue: Motif et mesure de la louange
  choice: Le premier membre appelle à louer Dieu en raison de ses actes puissants ; le second appelle à une louange à la mesure de son immense grandeur.
  alternative: 'On peut comprendre le second membre plus largement comme un autre motif de louange : « pour son immense grandeur ».'
  rationale: 'Les prépositions ב et כ portent vraisemblablement des nuances distinctes : le fondement de la louange dans le premier membre et sa mesure dans le second. La traduction maintient cette tension poétique sans uniformiser les deux propositions.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé par la répétition de « Louez-le ». « Actes puissants » garde le caractère concret du pluriel hébreu, et « à la mesure de » restitue clairement la force proportionnelle de כְּרֹב.
