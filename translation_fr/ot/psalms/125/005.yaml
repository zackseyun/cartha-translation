id: PSA.125.5
reference: Psalms 125:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: fr
  text: Mais ceux qui se détournent vers leurs voies tortueuses[a], Yahweh les emmènera avec les malfaiteurs. Que la paix soit sur Israël ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se tournent vers leurs sentiers tortueux » ou « suivent leurs voies tortueuses ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Paix sur Israël » ; cette formule concise peut être comprise comme une bénédiction, une prière ou une proclamation.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: Mais ceux qui s’engagent
  rationale: Le participe de נטה exprime ici le fait de dévier ou de s’écarter. « Mais » marque le contraste avec les hommes droits du verset précédent, tandis que « s’engagent » s’emploie naturellement avec les voies mentionnées ensuite.
- source_word: עַקַלְקַלּוֹתָם
  choice: dans des voies tortueuses
  rationale: Le terme désigne des chemins ou des conduites tortueux. Cette formulation conserve à la fois l’image du chemin et sa portée morale. Le possessif hébreu peut qualifier les voies qu’ils adoptent plutôt qu’exprimer strictement la possession.
- source_word: יוֹלִיכֵם
  choice: les emmènera
  rationale: Le hiphil de הלך signifie « faire aller, conduire ». « Emmènera » rend naturellement l’idée de conduite vers une issue de jugement sans préciser une destination absente de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: אֶת
  choice: avec
  rationale: 'Dans cette construction, אֶת a une valeur associative : les personnes qui dévient sont conduites avec ceux qui font le mal.'
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: ceux qui font le mal
  rationale: L’expression signifie littéralement « ceux qui accomplissent le mal/l’iniquité ». La formulation choisie est claire et naturelle en français tout en conservant l’idée d’une pratique active du mal.
- source_word: שָׁלוֹם עַל יִשְׂרָאֵל
  choice: Que la paix soit sur Israël !
  rationale: La proposition nominale très concise fonctionne naturellement comme une bénédiction ou une prière finale. « Paix » conserve aussi les nuances plus larges de bien-être et de plénitude portées par שָׁלוֹם.
theological_decisions:
- issue: Valeur de la formule finale שָׁלוֹם עַל יִשְׂרָאֵל
  choice: 'Une bénédiction ou prière : « Que la paix soit sur Israël ! »'
  alternative: 'Une déclaration nominale : « La paix est sur Israël. »'
  rationale: Dans ce contexte psalmique, la formule sans verbe se lit naturellement comme un souhait liturgique. La note signale toutefois que l’hébreu demeure formellement concis et peut aussi être compris comme une proclamation.
- issue: Portée du jugement exprimé par יוֹלִיכֵם
  choice: « les emmènera », sans destination explicitée
  alternative: « les chassera » ou « les emmènera au loin »
  rationale: Le contexte indique un jugement, mais le texte hébreu ne nomme ni bannissement ni destination. La traduction évite donc de préciser ce que le verset laisse implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore des voies est conservée sans lourdeur littérale. Le nom divin est rendu par « Yahweh ». La formulation finale adopte le ton d’une bénédiction tout en maintenant son ambiguïté grammaticale en note.
