source:
  edition: WLC
  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: fr
  text: Car le sceptre de la méchanceté[a] ne reposera pas sur la part attribuée aux justes[b], de peur que les justes ne tendent leurs mains vers l’injustice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sceptre des méchants ». La construction hébraïque peut désigner soit la méchanceté, soit les méchants qui exercent ce pouvoir.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le lot des justes »; le mot peut aussi désigner leur part ou leur héritage, c’est-à-dire ce qui leur a été attribué.
    reason: lexical_alternative
  - marker: c
    text: Ou « ne tendent leurs mains vers l’iniquité ». L’expression hébraïque signifie ici se livrer à une conduite mauvaise.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la confiance exprimée dans le contexte du psaume.
- source_word: יָנוּחַ
  choice: ne reposera pas
  rationale: Conserve l’image concrète du verbe נוח, qui peut exprimer le repos, l’installation ou la permanence, sans nier toute oppression temporaire.
- source_word: שֵׁבֶט
  choice: sceptre
  rationale: Dans ce contexte, le terme représente le pouvoir ou la domination; « sceptre » rend clairement cette valeur métaphorique.
- source_word: הָרֶשַׁע
  choice: de la méchanceté
  rationale: Le nom abstrait peut désigner la méchanceté ou, par métonymie, les méchants qui exercent le pouvoir. Le texte principal préserve la construction abstraite.
- source_word: גּוֹרַל
  choice: part attribuée
  rationale: Le mot désigne le lot obtenu par attribution, puis la part ou l’héritage ainsi assigné. Cette formulation rend le sens en français courant tout en conservant l’idée d’attribution.
- source_word: הַצַּדִּיקִים
  choice: les justes
  rationale: Équivalent français naturel de l’adjectif substantivé, qui maintient sa portée morale sans la préciser excessivement.
- source_word: לְמַעַן לֹא
  choice: de peur que… ne
  rationale: Rend naturellement la proposition de prévention ou de finalité négative.
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: ne tendent les mains
  rationale: Préserve l’image de l’expression hébraïque, qui évoque ici le fait de se livrer activement au mal.
- source_word: בְּעַוְלָתָה
  choice: vers l’injustice
  rationale: עַוְלָה peut désigner l’injustice, l’iniquité ou une conduite mauvaise. « Vers l’injustice » s’accorde avec l’image des mains tendues et reste suffisamment large.
theological_decisions:
- issue: Portée de la promesse concernant la domination mauvaise sur les justes
  choice: Le pouvoir mauvais ne s’installera pas durablement sur la part des justes.
  alternative: Les méchants n’exerceront jamais aucune autorité sur les justes.
  rationale: Le verbe יָנוּחַ évoque le fait de reposer, de s’établir ou de demeurer. La traduction conserve donc la tension entre une oppression possible et la promesse qu’elle ne sera pas permanente, notamment afin que les justes ne soient pas entraînés dans l’injustice.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images du sceptre, du repos et des mains tendues, tout en explicitant discrètement le sens de גּוֹרַל par « part attribuée ». Les variantes réelles sont signalées sans résoudre indûment les ambiguïtés.
