source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: fr
  text: 'Chant des montées. Ceux qui se confient en Yahvé sont comme le mont Sion : il ne sera pas ébranlé[a], il demeure pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne vacillera pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend formellement le titre traditionnel hébreu tout en restant compréhensible; le contexte peut évoquer les montées vers Jérusalem.
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: Ceux qui se confient en Yahvé
  rationale: « Se confier en » exprime naturellement en français la confiance personnelle indiquée par בטח; « Yahvé » représente le nom divin יהוה plutôt qu’un titre.
- source_word: לֹא יִמּוֹט
  choice: il ne chancelle pas
  rationale: Conserve l’image de stabilité sans la réduire à une impossibilité abstraite; le présent français convient à la déclaration générale.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: il demeure pour toujours
  rationale: « Demeurer » restitue ici le sens contextuel de stabilité durable porté par ישב, et « pour toujours » rend לְעוֹלָם en français courant.
theological_decisions:
- issue: Référent des verbes hébreux au singulier
  choice: Employer « il » en référence immédiate au mont Sion
  alternative: Employer le pluriel pour appliquer directement les verbes à ceux qui se confient en Yahvé
  rationale: La syntaxe hébraïque enchaîne la comparaison avec « le mont Sion », nom masculin singulier, puis deux formes verbales au singulier. L’image décrit néanmoins, par comparaison, la stabilité de ceux qui se confient en Yahvé.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation suit étroitement la comparaison hébraïque tout en gardant une syntaxe naturelle.
