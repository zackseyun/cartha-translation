source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: fr
  text: 'Chant des montées. Ceux qui se confient en Yahweh sont comme le mont Sion : il ne sera pas ébranlé[a], il demeure pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « il ne vacillera pas ».'
    reason: Alternative lexicale pour לֹא יִמּוֹט; elle conserve l’image de stabilité sans répéter exactement la formulation retenue dans le texte.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Cette formule conserve l’image des montées et le titre traditionnel du groupe des Psaumes 120–134, dans un français naturel.
- source_word: הַבֹּטְחִים בַּיהוָה
  choice: Ceux qui mettent leur confiance en Yahweh
  rationale: Le participe désigne les personnes caractérisées par une confiance continue; « mettre sa confiance en » exprime naturellement en français l’objet introduit par בְּ.
- source_word: כְּהַר צִיּוֹן
  choice: comme le mont Sion
  rationale: La préposition כְּ introduit une comparaison; « mont Sion » est la forme française établie du nom de lieu.
- source_word: לֹא יִמּוֹט
  choice: il ne chancellera pas
  rationale: Le verbe מוֹט au niphal évoque ce qui vacille, chancelle ou est déplacé. Le futur français respecte la forme verbale et souligne la stabilité de Sion sans transformer explicitement la négation en incapacité.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: il demeure pour toujours
  rationale: Dans ce contexte, יָשַׁב exprime la permanence plutôt que la simple posture assise; « demeure pour toujours » conserve cette idée en français clair et digne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » représente le nom propre divin sans le remplacer par un titre.
- issue: Référent des verbes singuliers יִמּוֹט et יֵשֵׁב
  choice: le mont Sion, repris par « il »
  alternative: les personnes qui mettent leur confiance en Yahweh, comprises collectivement
  rationale: L’antécédent singulier masculin immédiat est « le mont Sion ». La syntaxe favorise donc cette reprise, tout en laissant la comparaison communiquer implicitement sa stabilité à ceux qui se confient en Yahweh.
translation_notes:
  register: Français international moderne, poétique mais accessible. Les deux propositions finales restent coordonnées, conformément au parallélisme hébreu, sans ajout du contraste « mais ».
