  text: הֵיטִ֣יבָ/ה יְ֭הוָה לַ/טּוֹבִ֑ים וְ֝/לִֽ/ישָׁרִ֗ים בְּ/לִבּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/004.yaml
  text: Do good[a], O Yahweh, to the good[b], and to the upright in heart.
translation:
  language: fr
  text: Fais du bien, Yahweh, à ceux qui sont bons, et à ceux dont le cœur est droit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: Fais du bien
  rationale: 'L’impératif hiphil de יטב exprime ici une demande adressée à Dieu : « faire du bien » ou « agir favorablement ». « Fais du bien » est naturel en français et conserve le lien lexical avec « ceux qui sont bons ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: לַטּוֹבִים
  choice: à ceux qui sont bons
  rationale: L’adjectif substantivé désigne des personnes bonnes. Cette formulation est plus naturelle que « aux bons » en français courant et maintient l’écho avec « Fais du bien ».
- source_word: וְלִישָׁרִים
  choice: à ceux qui… sont droits
  rationale: יָשָׁר décrit la droiture morale. « Droits » convient au registre poétique et éthique du psaume.
- source_word: בְּלִבּוֹתָם
  choice: dont le cœur est droit
  rationale: Littéralement « droits dans leurs cœurs ». La tournure française exprime naturellement l’intégrité intérieure tout en conservant la référence au cœur.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve cette donnée sans le remplacer par un titre.
- issue: Description morale des bénéficiaires
  choice: ceux qui sont bons… ceux dont le cœur est droit
  alternative: les justes… les hommes droits
  rationale: La traduction maintient les deux termes hébreux distincts et leur parallélisme, sans transformer טוֹב en catégorie théologique technique.
translation_notes:
  register: Français moderne, digne et accessible. La coordination française évite de répéter « et » sans nécessité, tout en préservant le parallélisme de la supplication hébraïque.
