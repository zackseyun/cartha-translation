id: PSA.125.2
reference: Psalms 125:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְֽרוּשָׁלִַ֗ם הָרִים֮ סָבִ֪יב לָ֥/הּ וַ֭/יהוָה סָבִ֣יב לְ/עַמּ֑/וֹ מֵ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: fr
  text: Comme les montagnes entourent Jérusalem[a], ainsi Yahweh entoure son peuple, dès maintenant et pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Jérusalem — les montagnes sont autour d’elle, et Yahweh est autour de son peuple, dès maintenant et pour toujours. »'
    reason: La syntaxe hébraïque juxtapose « Jérusalem » et la proposition décrivant les montagnes, puis coordonne la seconde moitié par « et ». La traduction principale explicite la comparaison suggérée par le parallélisme.
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville.
- source_word: הָרִים
  choice: les montagnes
  rationale: Le pluriel de הַר peut désigner des montagnes ou des collines ; « montagnes » convient au relief entourant Jérusalem et maintient la force protectrice de l’image.
- source_word: סָבִיב לָהּ
  choice: entourent Jérusalem
  rationale: סָבִיב avec ל exprime le fait d’être autour de quelqu’un ou de quelque chose. La reprise explicite de « Jérusalem » est naturelle en français ; le suffixe féminin hébreu renvoie à la ville.
- source_word: וַיהוָה
  choice: ainsi Yahweh
  rationale: 'Le waw est compris ici selon la relation comparative créée par le parallélisme : les montagnes autour de Jérusalem correspondent à Yahweh autour de son peuple.'
- source_word: סָבִיב לְעַמּוֹ
  choice: entoure son peuple
  rationale: La répétition du même champ lexical conserve le parallélisme et l’image d’une protection de tous côtés.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Cette formulation restitue directement la relation possessive sans préciser davantage l’identité du peuple.
- source_word: מֵעַתָּה
  choice: dès maintenant
  rationale: Expression française actuelle indiquant que l’action commence dans le présent.
- source_word: וְעַד עוֹלָם
  choice: et pour toujours
  rationale: Rend naturellement l’idée d’une durée sans fin dans cette formule temporelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Valeur du waw devant יְהוָה
  choice: valeur comparative exprimée par « ainsi Yahweh »
  alternative: 'simple coordination : « et Yahweh »'
  rationale: Le waw signifie souvent « et », mais le parallélisme poétique établit ici une analogie. « Comme… ainsi… » la rend intelligible tout en signalant en note la construction plus formelle.
translation_notes:
  register: Français international moderne, simple et digne. La structure « Comme… ainsi… » rend clairement l’analogie poétique ; la répétition d’« entoure » conserve l’image centrale et le parallélisme.
