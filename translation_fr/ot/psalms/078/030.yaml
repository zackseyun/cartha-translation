id: PSA.78.30
reference: Psalms 78:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא זָר֥וּ מִ/תַּאֲוָתָ֑/ם ע֝֗וֹד אָכְלָ֥/ם בְּ/פִי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/030.yaml
  text: They had not yet turned away from their craving[a]; their food was still in their mouths.
translation:
  language: fr
  text: Ils ne s’étaient pas encore détournés de leur convoitise[a] ; leur nourriture était encore dans leur bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’étaient pas encore détachés de leur convoitise ». Le verbe hébreu peut exprimer le fait de devenir étranger à quelque chose ou de s’en détourner.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָרוּ
  choice: s’étaient détournés
  rationale: Avec מִן, le verbe exprime ici probablement l’idée de se détourner ou de se retirer de quelque chose. La formulation reste naturelle en français tout en conservant la valeur verbale de l’hébreu.
- source_word: מִתַּאֲוָתָם
  choice: de leur convoitise
  rationale: תַּאֲוָה désigne un désir intense, ici le désir avide de nourriture dans le contexte du psaume. « Convoitise » rend cette dimension excessive sans limiter le terme au domaine sexuel.
- source_word: עוֹד
  choice: encore
  rationale: L’adverbe indique que la nourriture se trouvait toujours dans leur bouche au moment où Dieu intervint.
- source_word: אָכְלָם
  choice: leur nourriture
  rationale: Le nom אֹכֶל signifie simplement « nourriture » ; ce choix direct convient au registre poétique et au contexte.
- source_word: בְּפִיהֶם
  choice: dans leur bouche
  rationale: 'Le français emploie naturellement le singulier distributif après un possessif pluriel : chacun avait encore de la nourriture dans la bouche.'
theological_decisions: []
