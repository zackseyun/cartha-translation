  text: וַ֭/יִּזְכֹּר כִּי בָשָׂ֣ר הֵ֑מָּה ר֥וּחַ ה֝וֹלֵ֗ךְ וְ/לֹ֣א יָשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/039.yaml
  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: fr
  text: Il se souvint qu’ils étaient chair, un vent qui s’en va et ne revient pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un souffle qui passe et ne revient pas ». Le mot hébreu רוּחַ peut signifier « vent », « souffle » ou « esprit »; ici, l’image évoque très probablement le caractère passager et fragile de la vie humaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Il se souvint
  rationale: Le wayyiqtol qal de זכר poursuit le récit au passé; Dieu est le sujet implicite d’après le contexte. Le ו narratif n’a pas besoin d’être rendu séparément en français.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce dont Dieu se souvint.
- source_word: בָשָׂר
  choice: n’étaient que chair
  rationale: « Chair » conserve l’image concrète de la fragilité et de la condition mortelle. La tournure « ne… que » rend naturellement en français la portée contextuelle sans remplacer l’image.
- source_word: הֵמָּה
  choice: ils
  rationale: Le pronom indépendant est intégré à la proposition nominale française avec le verbe « être » à l’imparfait.
- source_word: רוּחַ
  choice: un souffle
  rationale: רוּחַ peut désigner le vent, le souffle ou l’esprit. Ici, « souffle » évoque naturellement la brièveté et la fragilité de la vie, tout en s’accordant avec « qui passe ».
- source_word: הוֹלֵךְ
  choice: qui passe
  rationale: Le participe exprime un mouvement caractéristique; « qui passe » est idiomatique et fait ressortir le caractère transitoire de l’image.
- source_word: וְלֹא יָשׁוּב
  choice: et ne revient pas
  rationale: Le présent français convient à la portée générale de cette description poétique, sans imposer une valeur exclusivement future.
theological_decisions:
- issue: Image anthropologique de la fragilité humaine
  choice: 'Le verset présente les humains comme fragiles et passagers: « chair » et « un souffle qui passe ».'
  alternative: Comprendre רוּחַ comme « esprit » et voir ici une affirmation technique au sujet de l’esprit humain qui s’en va.
  rationale: Le parallélisme poétique souligne surtout la mortalité et le caractère éphémère de l’être humain. « Souffle » préserve la polysémie de רוּחַ sans importer une doctrine anthropologique plus précise que le texte.
translation_notes:
  register: Français moderne, courant et digne, avec une cadence poétique concise. « N’étaient que chair » rend l’idée de fragilité de manière naturelle tout en conservant le terme concret du texte hébreu.
