  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: fr
  text: 'Il fit jaillir des ruisseaux du rocher

    et fit couler l’eau comme des fleuves.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Il fit jaillir
  rationale: Le hiphil de יצא exprime la causation. « Fit jaillir » rend naturellement en français l’idée que Dieu a fait sortir l’eau, tout en convenant à l’image poétique.
- source_word: נוֹזְלִים
  choice: des ruisseaux
  rationale: Le participe de נזל désigne ce qui coule. Dans ce contexte d’eau tirée du rocher, « ruisseaux » est clair, concret et idiomatique.
- source_word: מִסָּלַע
  choice: du rocher
  rationale: סלע désigne un rocher ou un escarpement rocheux. L’article défini convient à l’allusion au miracle du désert.
- source_word: וַיּוֹרֶד
  choice: fit couler
  rationale: Le hiphil de ירד signifie littéralement « fit descendre ». Pour de l’eau, « fit couler » exprime naturellement le mouvement descendant et conserve la valeur causative.
- source_word: כַּנְּהָרוֹת
  choice: comme des fleuves
  rationale: Le préfixe כ marque la comparaison, et נהרות est le pluriel de « fleuve/rivière ». « Comme des fleuves » maintient l’ampleur de l’image.
- source_word: מָיִם
  choice: l’eau
  rationale: Bien que מָיִם ait une forme plurielle en hébreu, il fonctionne couramment comme un nom massif. « L’eau » est naturel en français moderne.
theological_decisions: []
