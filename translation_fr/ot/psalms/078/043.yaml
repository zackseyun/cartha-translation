lexical_decisions:
- source_word: אֲשֶׁר
  choice: quand
  rationale: Dans le contexte des versets 42–43, le relatif introduit le moment des actes divins dont Israël ne s’est pas souvenu. « Quand » rend naturellement cette valeur temporelle en français.
- source_word: שָׂם
  choice: accomplit
  rationale: Le verbe signifie fondamentalement « mettre, placer, établir ». Avec « signes », le français idiomatique appelle « accomplir »; ce choix exprime leur réalisation sans ajouter l’idée plus précise de les faire contre l’Égypte.
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: La préposition indique ici naturellement le lieu. « Contre l’Égypte » introduirait une nuance adversative qui n’est pas explicitement exprimée.
- source_word: אֹתוֹתָיו
  choice: ses signes
  rationale: « Signes » conserve la valeur d’אוֹת et la distinction lexicale avec les « prodiges » qui suivent.
- source_word: וּמוֹפְתָיו
  choice: et ses prodiges
  rationale: « Prodiges » rend מוֹפֵת dans un registre actuel et digne, tout en préservant le binôme traditionnel et sémantiquement distinct « signes et prodiges ».
- source_word: בִּשְׂדֵה
  choice: dans les campagnes de
  rationale: Bien que le nom hébreu soit au singulier construit, il désigne ici les terres ouvertes ou la région entourant la ville. « Dans les campagnes de » est naturel et évite l’étrangeté de « dans le champ de ».
- source_word: צֹעַן
  choice: Tsoân
  rationale: Le toponyme hébreu est translittéré plutôt que remplacé dans le texte par son identification grecque courante, Tanis.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « ses signes… ses prodiges » est conservé. « Tsoân » suit de près la forme hébraïque; l’identification usuelle à Tanis figure en note.
