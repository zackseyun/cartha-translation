  text: וַ/יִּתֵּ֣ן לֶ/חָסִ֣יל יְבוּלָ֑/ם וִֽ֝/יגִיעָ֗/ם לָ/אַרְבֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/046.yaml
  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: fr
  text: 'Il livra leur récolte à l’insecte dévorant[a],

    et leur labeur[b] à la sauterelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la chenille ». Le mot hébreu désigne probablement, de façon plus générale, un insecte qui dévore les cultures, souvent considéré dans les récits de fléaux comme une sorte de sauterelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « le fruit de leur labeur ». Le terme hébreu peut désigner soit le travail pénible lui-même, soit ce qu’il produit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il livra
  rationale: Dans ce contexte de jugement, « livra » exprime naturellement le fait de donner ou d’abandonner quelque chose au pouvoir d’un ravageur, sans ajouter d’idée étrangère au verbe נתן.
- source_word: לֶחָסִיל
  choice: à l’insecte dévorant
  rationale: חָסִיל désigne un insecte qui dévore les cultures, souvent compris comme une espèce ou un stade de criquet. Cette formulation garde la portée générale du terme et sa nuance destructrice sans imposer une identification zoologique incertaine.
- source_word: יְבוּלָם
  choice: leur récolte
  rationale: יְבוּל désigne le produit ou le rendement de la terre. « Récolte » est clair, naturel et convient au contexte agricole.
- source_word: וִיגִיעָם
  choice: leur labeur
  rationale: יְגִיעַ peut désigner le travail pénible lui-même ou, par métonymie, ce qu’il produit. « Leur labeur » conserve la concision et l’ambiguïté de l’hébreu.
- source_word: לָאַרְבֶּה
  choice: au criquet
  rationale: אַרְבֶּה est le terme hébreu courant pour le criquet. Le singulier français peut ici avoir une valeur collective, comme le singulier hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébreu est conservé sur deux lignes, tandis que « insecte dévorant » et « criquet » maintiennent la distinction entre les deux termes hébreux sans prétendre à une taxonomie précise.
