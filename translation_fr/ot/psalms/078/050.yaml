source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: fr
  text: Il fraya un chemin à sa colère[a] ; il ne préserva pas leur vie[b] de la mort, mais livra leur existence à la peste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aplanit un sentier pour sa colère ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « leur âme » ; ici, le mot hébreu désigne leur vie.
    reason: lexical_alternative
  - marker: c
    text: Ou « la pestilence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַלֵּס נָתִיב
  choice: fraya un chemin
  rationale: Le piel de פלס évoque l’action de rendre praticable ou d’aplanir une voie. « Fraya un chemin » conserve l’image concrète tout en étant naturel en français.
- source_word: לְאַפּוֹ
  choice: à sa colère
  rationale: אַף désigne littéralement le nez, mais exprime ici idiomatiquement la colère. La construction française présente cette colère comme ce à quoi un passage est ouvert.
- source_word: לֹא חָשַׂךְ מִמָּוֶת
  choice: il ne préserva pas … de la mort
  rationale: חשׂך avec מן exprime ici le fait de retenir ou d’épargner quelque chose face à la mort. « Ne préserva pas … de la mort » restitue clairement cette relation.
- source_word: נַפְשָׁם
  choice: leur vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne la vie mortelle des personnes, non nécessairement une âme immatérielle.
- source_word: וְחַיָּתָם
  choice: leur existence
  rationale: חַיָּה désigne ici leur vie ou leur existence vivante. « Existence » maintient le parallélisme avec נַפְשָׁם sans une répétition lourde en français.
- source_word: לַדֶּבֶר
  choice: à la peste
  rationale: דֶּבֶר désigne une maladie épidémique meurtrière, souvent dans un contexte de jugement. « Peste » est concis, traditionnel et intelligible.
- source_word: הִסְגִּיר
  choice: livra
  rationale: Le hiphil de סגר peut signifier livrer ou remettre au pouvoir de quelqu’un ou de quelque chose. « Livra » exprime l’action directe du texte.
theological_decisions:
- issue: Image anthropomorphique du chemin ouvert à la colère divine
  choice: 'Conserver l’image : « Il fraya un chemin à sa colère »'
  alternative: « Il donna libre cours à sa colère »
  rationale: L’hébreu représente poétiquement la colère comme avançant sur une voie préparée. Conserver cette image évite de réduire le vers à une abstraction.
- issue: Sens de נֶפֶשׁ
  choice: « leur vie »
  alternative: « leur âme »
  rationale: Le contexte de mort physique et le parallélisme avec חַיָּה indiquent la vie des personnes, sans affirmation particulière sur la constitution immatérielle de l’être humain.
translation_notes:
  register: Français international moderne, poétique et digne. « Fraya un chemin » conserve la métaphore hébraïque sans archaïsme excessif ; « leur existence » évite une répétition pesante tout en maintenant le parallélisme des deux termes hébreux pour la vie.
