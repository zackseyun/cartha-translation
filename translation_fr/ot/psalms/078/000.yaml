  yaml_path: translation/ot/psalms/078/000.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: fr
  text: 'Maskil[a] d’Asaph.


    Mon peuple, écoute mon enseignement ; prête l’oreille aux paroles de ma bouche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu « maskil », employé dans certains titres de psaumes, est un terme technique ; il peut désigner une composition destinée à instruire ou à susciter la réflexion.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Poème didactique
  rationale: Terme technique des titres de psaumes, probablement lié à l’idée d’instruction ou de réflexion. Une traduction fonctionnelle en français moderne est préférable à une simple translittération obscure, tout en signalant l’incertitude en note.
- source_word: תּוֹרָתִי
  choice: mon enseignement
  rationale: Dans ce contexte sapientiel, תּוֹרָה désigne l’instruction donnée par le psalmiste, et non nécessairement la Loi mosaïque au sens technique.
- source_word: הַאֲזִינָה ... הַטּוּ אָזְנְכֶם
  choice: écoute ... prête l’oreille
  rationale: Les deux expressions parallèles appellent une attention soutenue. Le singulier collectif du premier impératif et le pluriel du second sont rendus naturellement par l’adresse collective « Mon peuple » suivie d’impératifs français au singulier.
