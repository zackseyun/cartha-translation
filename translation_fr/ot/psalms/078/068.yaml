  text: Mais il choisit la tribu de Juda et le mont Sion, qu’il aimait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Mais il choisit
  rationale: Le waw narratif fait progresser le récit; dans le contexte du rejet mentionné au verset précédent, « Mais » exprime naturellement le contraste. בחר signifie « choisir ».
- source_word: שֵׁבֶט יְהוּדָה
  choice: la tribu de Juda
  rationale: שֵׁבֶט désigne ici une tribu d’Israël; cette tournure française est courante et précise.
- source_word: הַר צִיּוֹן
  choice: le mont Sion
  rationale: Rendu français usuel du nom géographique.
- source_word: אֲשֶׁר אָהֵב
  choice: qu’il aimait
  rationale: La proposition relative se rattache le plus naturellement à l’antécédent immédiat, « le mont Sion ». L’imparfait convient à la description de cette relation dans un récit au passé.
- source_word: אֶת ... אֶת
  choice: et
  rationale: L’hébreu marque successivement « la tribu de Juda » et « le mont Sion » comme compléments directs du même verbe. La coordination par « et » rend cette structure clairement et naturellement en français.
theological_decisions:
- issue: Rapport entre le choix de Juda et celui de Sion
  choice: Présenter Juda et le mont Sion comme les deux compléments du même acte divin de choisir.
  alternative: Lire « le mont Sion » comme une apposition explicative de « la tribu de Juda ».
  rationale: La répétition de אֶת favorise l’analyse de deux compléments directs, sans qu’il soit nécessaire de développer une doctrine de l’élection au-delà de l’affirmation du verset.
translation_notes:
  register: Français moderne, digne et accessible. « Le mont Sion » suit l’usage biblique français courant; la phrase reste concise et poétique.
