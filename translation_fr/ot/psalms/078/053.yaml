  text: וַ/יַּנְחֵ֣/ם לָ֭/בֶטַח וְ/לֹ֣א פָחָ֑דוּ וְ/אֶת א֝וֹיְבֵי/הֶ֗ם כִּסָּ֥ה הַ/יָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/053.yaml
  text: He led them securely[a], and they were not afraid; and the sea covered their enemies.
translation:
  language: fr
  text: Il les conduisit en sécurité, et ils n’eurent pas peur, et la mer recouvrit leurs ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Il les conduisit
  rationale: Le hiphil de נחה avec suffixe de troisième personne du pluriel signifie « conduire, guider ». « Conduisit » exprime naturellement le déplacement sous la direction de Dieu dans le contexte de l’exode.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: בֶּטַח désigne la sécurité ou la sûreté. Avec ל à valeur adverbiale, l’expression décrit la manière dont Dieu les conduisit.
- source_word: וְלֹא פָחָדוּ
  choice: et ils n’eurent pas peur
  rationale: La coordination simple par ו est conservée sans imposer un rapport explicite de conséquence. « Ne pas avoir peur » est naturel en français moderne.
- source_word: אֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Équivalent français direct et courant de אֹיֵב avec suffixe possessif.
- source_word: כִּסָּה
  choice: recouvrit
  rationale: Le verbe כסה signifie « couvrir ». « Recouvrit » préserve l’image concrète de la mer passant sur les ennemis sans expliciter davantage leur sort.
- source_word: הַיָּם
  choice: la mer
  rationale: Le texte hébreu emploie le nom commun défini « la mer » sans donner ici de nom géographique précis.
theological_decisions:
- issue: Allusion historique à la traversée de la mer lors de l’exode
  choice: Conserver « la mer » dans le texte principal.
  alternative: « la mer Rouge » ou « la mer des Roseaux »
  rationale: Le contexte évoque clairement l’exode, mais le verset dit seulement הַיָּם, « la mer ». La traduction n’ajoute donc pas une identification plus précise que le texte source.
- issue: Relation entre la conduite en sécurité et l’absence de peur
  choice: Conserver la coordination « et ».
  alternative: « de sorte qu’ils n’eurent pas peur »
  rationale: Le ו hébreu permet qu’une conséquence soit comprise dans le contexte, mais ne la marque pas explicitement. La coordination préserve cette souplesse.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif et poétique du psaume. La répétition de « et » est légèrement allégée avant la dernière proposition par le point-virgule, sans modifier la coordination du texte.
