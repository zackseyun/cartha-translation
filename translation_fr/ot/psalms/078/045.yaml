base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/045.yaml
  text: He sent among them swarms of flies[a], which devoured them, and frogs[b], which destroyed them.
translation:
  language: fr
  text: Il envoya parmi eux des essaims d’insectes[a] qui les dévorèrent, et des grenouilles qui les ravagèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nuées de mouches »; le mot hébreu peut désigner plus généralement un essaim d’insectes, traditionnellement compris comme des mouches.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Il envoya
  rationale: Le piel de שׁלח exprime ici l’envoi d’un fléau contre l’Égypte. « Il envoya » est naturel et conserve l’action divine explicite.
- source_word: בָּהֶם
  choice: parmi eux
  rationale: La préposition ב situe les fléaux au milieu des Égyptiens; « parmi eux » en rend directement la valeur locative.
- source_word: עָרֹב
  choice: des essaims d’insectes
  rationale: עָרֹב désigne ici un fléau d’êtres grouillants, traditionnellement compris comme des mouches. « Essaims d’insectes » reste clair sans réduire une désignation hébraïque incertaine aux seules mouches.
- source_word: וַיֹּאכְלֵם
  choice: qui les dévorèrent
  rationale: אכל signifie littéralement « manger » et prend ici un sens destructeur. Le relatif donne une phrase française fluide, tandis que le pluriel s’accorde avec « essaims ».
- source_word: וּצְפַרְדֵּעַ
  choice: et des grenouilles
  rationale: Le singulier hébreu a une valeur collective; le pluriel est la formulation idiomatique en français pour ce fléau.
- source_word: וַתַּשְׁחִיתֵם
  choice: qui les ravagèrent
  rationale: Le hifil de שׁחת exprime le fait de causer la ruine. « Ravagèrent » rend avec naturel la violence du fléau sans suggérer nécessairement l’extermination totale.
