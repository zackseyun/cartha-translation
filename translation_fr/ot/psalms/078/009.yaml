lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: Les fils d’Éphraïm
  rationale: L’expression désigne les membres de la tribu d’Éphraïm tout en conservant l’image généalogique de l’hébreu.
- source_word: נוֹשְׁקֵי רוֹמֵי קָשֶׁת
  choice: armés d’arcs
  rationale: Cette formulation française concise et naturelle rend l’équipement militaire et la mention explicite de l’arc. La construction participiale hébraïque est très condensée et peut aussi décrire des hommes armés qui tirent à l’arc.
- source_word: הָפְכוּ
  choice: ont tourné le dos
  rationale: L’expression conserve l’image d’un retournement et, dans ce contexte militaire, fait naturellement comprendre qu’ils ont renoncé au combat, sans préciser davantage les circonstances.
- source_word: בְּיוֹם קְרָב
  choice: le jour du combat
  rationale: Traduction temporelle directe, idiomatique et solennelle en français moderne.
