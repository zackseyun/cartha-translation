source:
  edition: WLC
  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: fr
  text: L’homme a mangé le pain des puissants[a] ; Dieu leur a envoyé des provisions en abondance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain des anges ». L’hébreu dit plus littéralement « le pain des puissants » ou « des êtres puissants ».
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: pain
  rationale: Le sens premier est « pain ». Ce choix conserve l’image concrète et poétique de l’hébreu.
- source_word: אַבִּירִים
  choice: des puissants
  rationale: Le terme désigne littéralement des êtres forts ou puissants. « Des puissants » préserve cette portée sans imposer l’interprétation traditionnelle « des anges ».
- source_word: אָכַל
  choice: a mangé
  rationale: L’accompli hébreu s’exprime naturellement ici par le passé composé, courant dans le récit poétique en français moderne.
- source_word: אִישׁ
  choice: L’homme
  rationale: Le singulier a une valeur générique et représentative. « L’homme » conserve la forme de l’hébreu tout en restant naturel dans ce registre.
- source_word: צֵידָה
  choice: des provisions
  rationale: Le mot désigne de la nourriture fournie pour répondre à un besoin. « Provisions » le distingue du « pain » de la première proposition.
- source_word: שָׁלַח
  choice: a envoyé
  rationale: Le verbe signifie directement « envoyer » ; ce choix évite de l’interpréter plus librement comme « donner ».
- source_word: לָהֶם
  choice: leur
  rationale: Le pronom marque le destinataire ; placé avant « a envoyé », « leur » est l’équivalent français naturel.
- source_word: לָשֹׂבַע
  choice: à satiété
  rationale: L’expression indique une quantité suffisante pour rassasier pleinement. « À satiété » est concise, digne et proche de l’image hébraïque.
theological_decisions:
- issue: Interprétation de אַבִּירִים dans l’expression « pain des puissants »
  choice: Traduire littéralement par « des puissants » dans le texte principal
  alternative: « des anges » ou « des êtres puissants »
  rationale: Le contexte de la manne a favorisé l’interprétation traditionnelle « pain des anges », mais le mot hébreu ne signifie pas sans ambiguïté « anges ». Le texte principal conserve donc le sens lexical direct, tandis que la note signale l’interprétation ancienne.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé composé rend le verset naturel sans l’alourdir ; « à satiété » conserve l’idée d’abondance rassasiante.
