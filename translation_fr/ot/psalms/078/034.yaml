  verdict: approve
  source_fidelity: 'Le texte rend fidèlement la progression de l’hébreu : circonstance temporelle (« Quand »), mise à mort, recherche de Dieu, retour, puis recherche insistante. L’imparfait français convient au tableau itératif exprimé dans le contexte, sans altérer la valeur du verbe hébreu. « Ils revenaient » préserve à juste titre l’ambiguïté de וְשָׁבוּ, sans imposer « se repentaient » ni ajouter « à lui ».'
  naturalness: Le français est naturel, sobre et adapté à un registre biblique moderne international. La répétition contrôlée de « cherchaient / recherchaient » reflète utilement les deux verbes hébreux distincts. « Avec empressement » rend clairement la force idiomatique de שִׁחֲרוּ.
  terminology: « Dieu » rend naturellement אֵל. Le vocabulaire de « revenir » et de « chercher » reste non confessionnel et ne surinterprète pas les implications théologiques possibles du verset.
