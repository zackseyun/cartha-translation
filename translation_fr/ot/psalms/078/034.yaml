id: PSA.78.34
reference: Psalms 78:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: fr
  text: Quand il les tuait, ils le cherchaient ; ils revenaient[a] et recherchaient Dieu avec empressement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils faisaient demi-tour ». Dans ce contexte, le verbe peut évoquer la repentance, mais il signifie littéralement « revenir » ou « retourner ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « recherchaient dès l’aube », expression qui signifie chercher avec empressement ou assiduité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Quand
  rationale: Dans ce récit poétique, אִם introduit une circonstance répétée plutôt qu’une condition hypothétique ; « quand » en rend naturellement la valeur temporelle.
- source_word: הֲרָגָם
  choice: il les tuait
  rationale: Le verbe הרג signifie clairement « tuer ». L’imparfait français exprime ici la situation répétée évoquée dans le contexte, et le sujet masculin singulier implicite renvoie à Dieu.
- source_word: וּדְרָשׁוּהוּ
  choice: ils le cherchaient
  rationale: דרש avec une personne comme complément signifie couramment « chercher » cette personne, notamment se tourner vers Dieu. Le pronom objet hébreu est conservé.
- source_word: וְשָׁבוּ
  choice: ils revenaient
  rationale: שוב signifie fondamentalement « revenir » ou « retourner ». Ce choix préserve le sens lexical sans expliciter davantage l’idée possible de repentance.
- source_word: וְשִׁחֲרוּ
  choice: recherchaient avec empressement
  rationale: Au piel, שחר évoque littéralement le fait de chercher de bonne heure, d’où l’idée d’une recherche empressée ou assidue. La formulation française rend cet idiome de façon claire.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici le titre divin courant ; « Dieu » est la traduction française naturelle sans expansion interprétative.
theological_decisions:
- issue: Faut-il rendre וְשָׁבוּ par un terme explicitement lié à la repentance ?
  choice: ils revenaient
  alternative: ils se repentaient ; ils revenaient à lui
  rationale: Le contexte peut donner à שוב une portée de repentance, mais le verbe signifie d’abord « revenir ». La traduction retenue conserve cette possibilité sans transformer l’implication contextuelle en affirmation explicite.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait rend la circonstance répétée du récit. La répétition de « chercher/rechercher » reflète les deux verbes hébreux tout en distinguant la nuance d’empressement du second.
