  text: וַ/יַּכְעִיס֥וּ/הוּ בְּ/בָמוֹתָ֑/ם וּ֝/בִ/פְסִילֵי/הֶ֗ם יַקְנִיאֽוּ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: fr
  text: Ils provoquèrent sa colère par leurs hauts lieux[a], et, par leurs idoles sculptées[b], ils excitèrent sa jalousie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « hauts lieux » étaient des lieux de culte locaux, souvent associés à un culte illégitime et à l’idolâtrie.
    reason: cultural_note
  - marker: b
    text: Ou « images taillées ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ils le provoquèrent à la jalousie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Ils provoquèrent sa colère
  rationale: Le hifil de כעס exprime le fait de provoquer ou de causer la colère. Cette formulation française conserve clairement la valeur causative.
- source_word: בְּבָמוֹתָם
  choice: par leurs hauts lieux
  rationale: במות désigne ici des sanctuaires locaux, souvent liés dans le contexte biblique à un culte illégitime. « Par » rend naturellement la valeur instrumentale de ב.
- source_word: וּבִפְסִילֵיהֶם
  choice: et, par leurs idoles sculptées
  rationale: פסילים désigne des représentations cultuelles taillées ou sculptées. « Idoles sculptées » garde à la fois le caractère concret des objets et leur fonction idolâtre.
- source_word: יַקְנִיאוּהוּ
  choice: ils excitèrent sa jalousie
  rationale: Le hifil de קנא signifie susciter ou provoquer la jalousie. « Excitèrent sa jalousie » préserve la force causative et l'écho relationnel du terme.
theological_decisions:
- issue: La jalousie attribuée à Dieu
  choice: ils excitèrent sa jalousie
  alternative: ils provoquèrent son ardeur jalouse
  rationale: Le texte hébreu emploie explicitement קנא dans un contexte de culte idolâtre. La traduction conserve donc la tension biblique de la jalousie divine sans la réduire à la seule colère ni l'assimiler à une envie humaine.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est maintenu, avec répétition de « par ». « Hauts lieux » conserve le terme biblique traditionnel, expliqué en note, tandis que « idoles sculptées » reste immédiatement compréhensible.
