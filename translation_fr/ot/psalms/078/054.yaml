  text: וַ֭/יְבִיאֵ/ם אֶל גְּב֣וּל קָדְשׁ֑/וֹ הַר זֶ֝֗ה קָנְתָ֥ה יְמִינֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: fr
  text: Il les fit donc entrer dans son territoire saint[a], cette montagne[b] que sa main droite avait acquise[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à sa frontière sainte » ou « dans le domaine de sa sainteté ». Le mot hébreu peut désigner une frontière, des limites ou le territoire qu’elles délimitent.
    reason: lexical_alternative
  - marker: b
    text: Ou « cette région montagneuse ». Dans le contexte, l’expression peut désigner le pays montagneux donné à Israël et peut aussi évoquer Sion, sans que le verset précise davantage.
    reason: alternative_reading
  - marker: c
    text: Ou « conquise », « obtenue » ou « prise en possession ». Le verbe hébreu possède plusieurs sens proches; ici, il décrit ce que la main droite de Dieu s’est assuré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: Il les fit donc entrer
  rationale: Le hiphil de בוא exprime le fait de faire venir ou d’amener. « Fit entrer » convient naturellement à l’arrivée dans un territoire, tandis que « donc » rend ici la progression du récit poétique.
- source_word: אֶל גְּבוּל קָדְשׁוֹ
  choice: dans son territoire saint
  rationale: גְּבוּל peut désigner une frontière, des limites ou le territoire qu’elles délimitent. Dans ce contexte d’entrée dans le pays, « territoire » exprime naturellement le domaine visé; קָדְשׁוֹ est rendu par « son… saint » sans préciser davantage la nature de cette sainteté.
- source_word: הַר זֶה
  choice: cette montagne
  rationale: La formulation déictique et précise de l’hébreu est conservée sans identifier explicitement la montagne à Sion ou à toute la région montagneuse du pays.
- source_word: קָנְתָה
  choice: avait acquise
  rationale: קנה peut signifier acquérir, acheter, posséder ou, dans certains contextes, créer. Ici, « acquérir » rend l’idée de prise de possession sans suggérer nécessairement un achat.
- source_word: יְמִינוֹ
  choice: sa main droite
  rationale: L’image anthropomorphique hébraïque est conservée; elle évoque la puissance victorieuse de Dieu sans être explicitée dans le texte.
theological_decisions:
- issue: Référent de « cette montagne »
  choice: Conserver « cette montagne » sans l’identifier dans le texte principal.
  alternative: Sion; la région montagneuse de Canaan; le pays montagneux donné à Israël.
  rationale: Le verset ne nomme pas explicitement le référent. Le contexte plus large peut évoquer à la fois le pays et Sion; la traduction maintient donc cette ouverture interprétative.
- issue: Sens de קָנְתָה appliqué à la montagne
  choice: « avait acquise »
  alternative: « avait conquise », « possédait », « avait achetée » ou « avait créée ».
  rationale: Le contexte met en avant l’action puissante de Dieu, mais le verbe seul ne tranche pas entre toutes ses nuances. « Acquise » conserve une amplitude sémantique convenable sans imposer une doctrine de création ni une transaction commerciale.
translation_notes:
  register: Français international moderne, poétique et digne. La structure appositive relie « cette montagne » à « son territoire saint » sans ajouter une seconde destination. Le plus-que-parfait « avait acquise » présente naturellement l’acquisition comme antérieure à l’entrée d’Israël.
