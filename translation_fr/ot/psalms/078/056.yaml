  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: fr
  text: Mais ils mirent Dieu, le Très-Haut, à l’épreuve et se rebellèrent contre lui ; ils ne respectèrent pas ses prescriptions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ses témoignages » ou « ses lois » : le terme hébreu désigne les prescriptions qui attestent la volonté de Dieu dans le cadre de l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: ils mirent … à l’épreuve
  rationale: Le verbe נסה signifie ici soumettre Dieu à une épreuve, dans un contexte d’infidélité. Cette formulation française est naturelle et garde la force accusatrice du texte.
- source_word: וַיַּמְרוּ
  choice: se rebellèrent contre lui
  rationale: Le verbe מרה exprime une opposition volontaire et rebelle à Dieu. Le complément « contre lui » explicite naturellement en français l’objet commun indiqué en hébreu.
- source_word: אֱלֹהִים עֶלְיוֹן
  choice: Dieu, le Très-Haut
  rationale: Cette formulation conserve les deux éléments du titre divin et rend naturellement la valeur appositionnelle ou qualificative de עֶלְיוֹן.
- source_word: וְעֵדוֹתָיו
  choice: ses prescriptions
  rationale: Dans ce contexte d’alliance, עֵדוֹת désigne les prescriptions divines qui attestent la volonté de Dieu. « Prescriptions » est plus immédiatement compréhensible en français moderne que le calque « témoignages », tout en conservant la nuance normative.
- source_word: לֹא שָׁמָרוּ
  choice: ils ne respectèrent pas
  rationale: Avec des prescriptions divines, שׁמר signifie les observer ou s’y conformer. « Respecter » est idiomatique et clair en français contemporain.
- source_word: וַ
  choice: Mais
  rationale: La conjonction poursuit le récit tout en marquant ici le contraste entre les bienfaits précédemment accordés par Dieu et la réponse rebelle du peuple.
theological_decisions:
- issue: Titre divin אֱלֹהִים עֶלְיוֹן
  choice: Dieu, le Très-Haut
  alternative: le Dieu Très-Haut
  rationale: Le choix préserve l’affirmation de la suprématie divine sans ajouter de nuance doctrinale absente de l’hébreu, et laisse percevoir la valeur appositionnelle possible de עֶלְיוֹן.
- issue: Portée juridique et liée à l’alliance de עֵדוֹתָיו
  choice: ses prescriptions
  alternative: ses témoignages
  rationale: « Prescriptions » communique clairement l’obligation d’alliance dans ce contexte. La note conserve le sens plus littéral de témoignages ou attestations, sans réduire silencieusement l’amplitude du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination est légèrement explicitée par « contre lui » afin que « mettre à l’épreuve » conserve son objet direct naturel et que « se rebeller » reçoive son complément idiomatique.
