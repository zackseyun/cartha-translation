source:
  edition: WLC
  text: לָ/כֵ֤ן שָׁמַ֥ע יְהוָ֗ה וַֽ/יִּתְעַבָּ֥ר וְ֭/אֵשׁ נִשְּׂקָ֣ה בְ/יַעֲקֹ֑ב וְ/גַם אַ֝֗ף עָלָ֥ה בְ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: fr
  text: C’est pourquoi Yahvé entendit et entra en fureur[a] ; un feu s’alluma contre Jacob[b], et la colère s’éleva aussi contre Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut saisi de colère » ou « fut provoqué à la colère ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en Jacob » et, plus loin, « en Israël » ; dans ce contexte de jugement hostile, la préposition est rendue par « contre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence de la plainte rapportée dans les versets précédents.
- source_word: שָׁמַע
  choice: entendit
  rationale: Rend directement le verbe hébreu, qui indique ici que Yahvé prit connaissance des paroles d’Israël.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: וַיִּתְעַבָּר
  choice: entra en fureur
  rationale: Le hitpael exprime une vive montée de colère ; cette formulation française conserve sa force et son caractère dynamique.
- source_word: וְאֵשׁ נִשְּׂקָה
  choice: un feu s’alluma
  rationale: Conserve l’image explicite du feu et rend naturellement la valeur passive ou inchoative de la forme verbale en français.
- source_word: בְיַעֲקֹב
  choice: contre Jacob
  rationale: Dans ce contexte de jugement hostile, la préposition בְ peut être rendue idiomatiquement par « contre », tout en signalant en note son sens plus littéral.
- source_word: וְגַם אַף עָלָה
  choice: et la colère s’éleva aussi
  rationale: Préserve à la fois la valeur additive de וְגַם et la métaphore verticale du verbe עָלָה.
- source_word: בְיִשְׂרָאֵל
  choice: contre Israël
  rationale: Le parallélisme avec « contre Jacob » et le contexte judiciaire favorisent ce sens contextuel de la préposition.
theological_decisions:
- issue: Force du langage relatif à la colère divine
  choice: « entra en fureur » et « la colère s’éleva »
  alternative: « fut mécontent » ou une autre formulation atténuée
  rationale: L’hébreu emploie un vocabulaire intense. La traduction conserve cette force sans adoucir la réaction divine ni ajouter d’explication doctrinale.
- issue: Nature du feu
  choice: 'Maintenir simplement l’image : « un feu s’alluma »'
  alternative: Préciser qu’il s’agit soit d’un feu littéral, soit d’une métaphore du jugement
  rationale: Le verset ne tranche pas explicitement entre une référence littérale, figurée ou susceptible de réunir les deux ; la traduction préserve cette ambiguïté.
- issue: Fonction du waw devant אֵשׁ
  choice: Ponctuation par point-virgule sans ajout d’un connecteur explicatif
  alternative: « car un feu s’alluma » ou « et un feu s’alluma »
  rationale: La juxtaposition française après le point-virgule respecte la coordination hébraïque et laisse ouverte sa nuance exacte, qui peut être simplement additive ou légèrement explicative.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif poétique du psaume. « Yahvé » est employé comme forme française courante du nom divin. La syntaxe conserve le parallélisme entre Jacob et Israël sans rendre la phrase artificiellement lourde.
