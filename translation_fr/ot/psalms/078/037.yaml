source:
  edition: WLC
  text: וְ֭/לִבָּ/ם לֹא נָכ֣וֹן עִמּ֑/וֹ וְ/לֹ֥א נֶ֝אֶמְנ֗וּ בִּ/בְרִיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/037.yaml
  text: Their heart was not steadfast with him[b][a], and they were not faithful to his covenant.
translation:
  language: fr
  text: Leur cœur n’était pas constant envers lui[a], et ils n’étaient pas fidèles à son alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « leur cœur n’était pas ferme avec lui » ; ou « leur cœur n’était pas solidement attaché à lui ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « ils n’étaient pas fidèles dans son alliance » ; le français dit naturellement « fidèles à son alliance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבָּם
  choice: leur cœur
  rationale: Le singulier hébreu avec suffixe pluriel présente collectivement la disposition intérieure du peuple; le français « leur cœur » conserve naturellement ce sens collectif.
- source_word: נָכוֹן
  choice: ferme
  rationale: Le terme exprime ici la stabilité et la constance de la disposition intérieure. « Ferme » est naturel en français et reste proche du sens fondamental, sans réduire le mot à la simple rectitude.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: La préposition signifie normalement « avec » et décrit ici l’accord relationnel avec Dieu. La traduction directe préserve cette formulation sans l’interpréter excessivement.
- source_word: נֶאֶמְנוּ
  choice: étaient fidèles
  rationale: Au nifal, le verbe אמן exprime ici la fiabilité ou la fidélité. Avec l’alliance comme complément, « être fidèle » rend clairement la déloyauté envers l’engagement d’alliance.
- source_word: בִּבְרִיתוֹ
  choice: à son alliance
  rationale: Bien que ב signifie littéralement « dans », le français idiomatique construit « fidèle » avec « à ». Cette adaptation conserve le rapport d’appartenance et de loyauté exprimé par l’hébreu.
theological_decisions:
- issue: Langage de fidélité à l’alliance
  choice: Le verset décrit le manque de loyauté d’Israël envers l’alliance, en parallèle avec l’instabilité de son cœur.
  alternative: On pourrait rendre plus littéralement la seconde proposition par « ils ne furent pas fermes dans son alliance ».
  rationale: Le parallélisme relie la disposition intérieure instable à l’infidélité dans la relation d’alliance. « Fidèles à son alliance » transmet cette portée relationnelle et morale sans introduire de catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, simple et digne. « Ferme avec lui » conserve au plus près la préposition hébraïque et sa tension relationnelle; la note propose une formulation française plus explicite. Le singulier collectif « leur cœur » est maintenu.
