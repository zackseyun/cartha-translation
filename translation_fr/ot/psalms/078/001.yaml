base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/001.yaml
  text: A Maskil of Asaph. Give ear[a], my people, to my instruction; incline your ears to the words of my mouth.
translation:
  language: fr
  text: Maskil[a] d’Asaph. Mon peuple, écoute mon enseignement ; tendez l’oreille aux paroles de ma bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Maskil » est un terme technique employé dans les titres de psaumes ; il peut désigner une composition instructive ou contemplative.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Méditation
  rationale: Le terme technique du titre a un sens précis incertain. « Méditation » donne en français une désignation naturelle susceptible d’évoquer une composition didactique ou contemplative, tandis que la note préserve l’incertitude lexicale.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: Dans un titre, ל peut indiquer l’auteur, l’association ou la destination. « D’Asaph » est idiomatique sans préciser davantage la relation.
- source_word: הַאֲזִינָה
  choice: écoute
  rationale: L’impératif appelle une écoute attentive. « Écoute » est direct, naturel et digne en français moderne.
- source_word: עַמִּי
  choice: Mon peuple
  rationale: Le possessif est explicite et l’expression fonctionne naturellement comme apostrophe.
- source_word: תּוֹרָתִי
  choice: mon enseignement
  rationale: תּוֹרָה désigne ici l’instruction transmise, et non nécessairement un code légal. « Enseignement » convient à l’introduction didactique du psaume.
- source_word: הַטּוּ אָזְנְכֶם
  choice: tendez l’oreille
  rationale: Cette locution française conserve l’image hébraïque de l’oreille orientée vers la parole et exprime une écoute attentive.
- source_word: לְאִמְרֵי פִי
  choice: aux paroles de ma bouche
  rationale: La formulation conserve l’image concrète et le parallélisme auditif de l’hébreu tout en restant intelligible en français.
