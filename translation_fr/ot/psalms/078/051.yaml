source:
  edition: WLC
  text: וַ/יַּ֣ךְ כָּל בְּכ֣וֹר בְּ/מִצְרָ֑יִם רֵאשִׁ֥ית א֝וֹנִ֗ים בְּ/אָהֳלֵי חָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/051.yaml
  text: He struck down every firstborn in Egypt[a], the firstfruits of their vigor in the tents of Ham.
translation:
  language: fr
  text: 'Il frappa tous les premiers-nés en Égypte,

    les prémices de leur vigueur dans les tentes de Cham.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se rendre par « les premiers produits de leur force » ; elle désigne le premier produit de la puissance procréatrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il frappa
  rationale: Le verbe נכה, dans cette forme narrative, rapporte une action passée. « Il frappa » reste proche de l’hébreu; le contexte de la mort des premiers-nés en précise la portée mortelle.
- source_word: כָּל בְּכוֹר
  choice: tous les premiers-nés
  rationale: Cette expression désigne la totalité des premiers-nés concernés. Le masculin n’est pas ajouté explicitement au-delà de ce que porte en français le nom « premiers-nés ».
- source_word: בְּמִצְרַיִם
  choice: en Égypte
  rationale: La préposition indique ici le lieu et renvoie directement au fléau rapporté dans l’Exode.
- source_word: רֵאשִׁית אֹנִים
  choice: les prémices de leur vigueur
  rationale: L’expression poétique désigne le premier fruit de la puissance procréatrice. « Prémices » conserve l’idée de commencement ou de premier produit, et « vigueur » rend la notion de force sans formulation archaïque.
- source_word: בְּאָהֳלֵי חָם
  choice: sous les tentes de Cham
  rationale: Cette désignation poétique associe l’Égypte à Cham. « Sous les tentes de Cham » conserve l’image et la texture généalogique du texte hébreu.
theological_decisions:
- issue: Désignation poétique de l’Égypte par « Cham »
  choice: Conserver « Cham » dans le texte principal.
  alternative: Remplacer l’expression par « parmi les Égyptiens » ou « dans les demeures de l’Égypte ».
  rationale: Le premier vers nomme déjà l’Égypte; le second la désigne poétiquement comme les « tentes de Cham ». Maintenir ce nom préserve l’écho canonique et généalogique sans lui imposer une interprétation doctrinale supplémentaire.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme du vers est conservé, ainsi que l’image des « tentes de Cham ». Le marqueur de note est placé après l’expression qu’elle éclaire.
