id: PSA.78.38
reference: Psalms 78:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/ה֤וּא רַח֨וּם יְכַפֵּ֥ר עָוֺן֮ וְֽ/לֹא יַ֫שְׁחִ֥ית וְ֭/הִרְבָּה לְ/הָשִׁ֣יב אַפּ֑/וֹ וְ/לֹֽא יָ֝עִיר כָּל חֲמָתֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/038.yaml
  text: But he[a], being compassionate, made atonement for iniquity and did not destroy; he often turned back his anger and did not stir up all his wrath.
translation:
  language: fr
  text: Mais lui, plein de compassion, faisait l’expiation pour la faute[a] et ne détruisait pas ; souvent, il détournait sa colère et ne déchaînait pas toute sa fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pardonnait la faute ». Le verbe hébreu est le terme habituellement employé pour faire l’expiation ; le texte principal en conserve donc la portée théologique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: plein de compassion
  rationale: Cette expression rend naturellement en français le caractère compatissant et miséricordieux désigné par l’adjectif hébreu.
- source_word: יְכַפֵּר
  choice: faisait l’expiation pour
  rationale: Le piel de כפר est le terme habituel de l’expiation. L’imparfait français convient à la valeur habituelle ou répétée des actions décrites dans ce contexte narratif et poétique.
- source_word: עָוֺן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « La faute » est clair et naturel tout en conservant la portée morale du terme.
- source_word: יַשְׁחִית
  choice: ne détruisait pas
  rationale: Le hiphil de שׁחת désigne ici l’exercice d’un jugement destructeur ; « détruire » en donne le sens direct.
- source_word: וְהִרְבָּה לְהָשִׁיב
  choice: souvent, il détournait
  rationale: La construction הרבה suivie de l’infinitif exprime la fréquence ou la répétition. « Souvent » la rend idiomatiquement.
- source_word: אַפּוֹ
  choice: sa colère
  rationale: אַף signifie littéralement le nez, mais désigne idiomatiquement la colère dans cette expression.
- source_word: יָעִיר
  choice: déchaînait
  rationale: Le hiphil de עור signifie éveiller ou susciter. Avec la fureur pour objet, « déchaîner » exprime naturellement l’idée de la mettre pleinement en mouvement.
- source_word: כָּל חֲמָתוֹ
  choice: toute sa fureur
  rationale: « Toute » représente כָּל, et « fureur » restitue l’intensité de חֵמָה tout en distinguant ce terme de אַף, rendu par « colère ».
theological_decisions:
- issue: Rendu de כפר dans un psaume historique, hors d’un cadre cultuel explicite
  choice: faisait l’expiation pour la faute
  alternative: pardonnait la faute
  rationale: Le verbe hébreu est le terme usuel de l’expiation. Le conserver maintient la densité théologique du texte sans préciser un mécanisme que le verset n’énonce pas ; une note signale le sens contextuel possible de pardon.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait présente les actes divins comme caractéristiques et répétés dans le récit. Le parallélisme entre « colère » et « fureur » ainsi que la tension entre expiation, non-destruction et retenue du jugement sont conservés.
