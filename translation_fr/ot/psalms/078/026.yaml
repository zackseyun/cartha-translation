  text: יַסַּ֣ע קָ֭דִים בַּ/שָּׁמָ֑יִם וַ/יְנַהֵ֖ג בְּ/עֻזּ֣/וֹ תֵימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: fr
  text: Il mit en mouvement le vent d’est dans les cieux[a] et, par sa puissance, dirigea le vent du sud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il fit souffler le vent d’est dans les cieux. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le sud » ; le sens « vent du sud » ressort du parallélisme avec « vent d’est ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: fit partir
  rationale: Le hifil de נסע signifie littéralement « faire partir » ou « mettre en route ». Cette formulation naturelle conserve l’image hébraïque et l’action directe de Dieu sur le vent.
- source_word: קָדִים
  choice: le vent d’est
  rationale: קָדִים désigne couramment le vent d’est; le parallélisme avec תֵימָן confirme ici qu’il s’agit d’un vent plutôt que du seul point cardinal.
- source_word: בַּשָּׁמָיִם
  choice: dans le ciel
  rationale: Dans ce contexte météorologique, שָׁמַיִם désigne l’espace céleste où se déplacent les vents. Le singulier français « le ciel » est naturel tout en gardant la dignité poétique.
- source_word: וַיְנַהֵג
  choice: conduisit
  rationale: נהג peut signifier conduire, mener ou diriger. « Conduisit » exprime sobrement la maîtrise divine sans préciser davantage la manière.
- source_word: בְּעֻזּוֹ
  choice: par sa puissance
  rationale: עֹז désigne la force ou la puissance; avec ב, l’expression indique ici le moyen par lequel Dieu dirige le vent.
- source_word: תֵימָן
  choice: le vent du sud
  rationale: Le mot signifie formellement « sud » ou « région du sud », mais le parallélisme avec « vent d’est » implique naturellement le vent venant du sud.
theological_decisions:
- issue: Action divine sur les forces naturelles
  choice: Les deux verbes présentent Dieu comme celui qui met les vents en mouvement et les dirige.
  alternative: Décrire plus impersonnellement les vents comme se levant ou soufflant.
  rationale: Les formes verbales ont Dieu pour sujet dans le contexte; la traduction préserve cette action explicite sans développer une affirmation doctrinale au-delà du verset.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le passé simple convient au récit psalmique. « Faire partir » conserve plus directement l’image du verbe hébreu que « susciter », tandis que les notes signalent les principales ambiguïtés lexicales.
