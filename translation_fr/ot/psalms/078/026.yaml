revisions:
- from: Il fit partir le vent d’est dans le ciel[a] et, par sa puissance, conduisit le vent du sud[b].
  to: Il mit en mouvement le vent d’est dans les cieux[a] et, par sa puissance, dirigea le vent du sud[b].
  rationale: La révision évite l’ambiguïté française de « fit partir » tout en préservant l’image du vent mis en route et l’action directe de Dieu. « Dirigea » rend naturellement le second verbe sans renforcer ni réduire l’idée de maîtrise exprimée par l’hébreu. Les deux notes restent correctement ancrées et signalent les alternatives pertinentes.
