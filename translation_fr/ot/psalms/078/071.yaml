  text: from following the nursing ewes he brought him[a], to shepherd Jacob his people[b], and Israel his inheritance.
translation:
  language: fr
  text: Il le fit venir d’auprès des brebis allaitantes[a], pour paître Jacob, son peuple, et Israël, son héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après les brebis accompagnées de leurs petits » ; c’est-à-dire en les suivant.
    reason: lexical_alternative
  - marker: b
    text: « Héritage » peut aussi se traduire par « patrimoine » ou « possession ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחַר
  choice: de derrière
  rationale: L’expression indique que David est pris de derrière le troupeau, là où il le suivait. « De derrière » conserve l’image spatiale et pastorale sans la réduire à une simple activité de garde.
- source_word: עָלוֹת
  choice: les brebis qui allaitent
  rationale: Le terme désigne ici des brebis allaitant leurs petits. Cette formulation moderne conserve la précision du cadre pastoral.
- source_word: הֱבִיאוֹ
  choice: il le fit venir
  rationale: Le hiphil de בוא signifie « faire venir, amener ». Dieu est le sujet implicite dans le contexte précédent, et David le complément.
- source_word: לִרְעוֹת
  choice: pour qu’il soit le berger de
  rationale: Le verbe רעה applique à la conduite du peuple le métier pastoral de David. Cette tournure rend naturellement en français la métaphore royale tout en maintenant le lien avec les brebis.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: de Jacob, son peuple
  rationale: La formulation exprime l’apposition entre Jacob et le peuple de Dieu, tout en restant idiomatique en français.
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: et d’Israël, son héritage
  rationale: « Héritage » est l’équivalent direct de נַחֲלָה et en préserve la résonance d’appartenance accordée par alliance.
theological_decisions:
- issue: Métaphore royale et pastorale de la vocation de David
  choice: Conserver explicitement l’image du berger.
  alternative: « pour qu’il conduise » ou « pour qu’il prenne soin de »
  rationale: Le verset établit délibérément un parallèle entre le travail de David auprès des brebis et sa charge envers Israël. L’image est donc maintenue sans lui ajouter de développement doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe est légèrement explicitée afin que la métaphore pastorale appliquée au peuple reste claire, tandis que les deux désignations parallèles « Jacob, son peuple » et « Israël, son héritage » sont conservées.
