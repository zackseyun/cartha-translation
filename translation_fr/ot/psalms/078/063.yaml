  text: בַּחוּרָ֥י/ו אָֽכְלָה אֵ֑שׁ וּ֝/בְתוּלֹתָ֗י/ו לֹ֣א הוּלָּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: fr
  text: 'Le feu dévora ses jeunes hommes,

    et ses jeunes filles ne furent pas célébrées[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses vierges ne furent pas célébrées »; il s’agit probablement de l’absence de chants de mariage pour les jeunes femmes, conséquence de la dévastation.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: ses jeunes hommes
  rationale: בָּחוּר désigne couramment des hommes jeunes, dans la force de l’âge; cette formulation naturelle préserve le parallélisme avec les jeunes filles.
- source_word: אָכְלָה אֵשׁ
  choice: Le feu dévora
  rationale: Avec le feu pour sujet, אָכַל (« manger ») exprime idiomatiquement l’action de dévorer ou consumer. « Dévora » conserve l’image vive de l’hébreu.
- source_word: וּבְתוּלֹתָיו
  choice: et ses jeunes filles
  rationale: בְּתוּלָה peut désigner une vierge ou une jeune fille non mariée. « Jeunes filles » est naturel en français moderne, tandis qu’une note explicite la nuance possible de virginité.
- source_word: לֹא הוּלָּלוּ
  choice: ne furent pas célébrées
  rationale: Le pual de הלל indique ici qu’elles ne furent pas célébrées, probablement par des chants nuptiaux. La traduction conserve l’implicite culturel sans imposer cette interprétation dans le texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le passé simple convient au registre narratif du psaume. « Dévora » maintient la personnification du feu; « célébrées » préserve l’ambiguïté de הלל tout en laissant la note préciser l’allusion probable aux noces.
