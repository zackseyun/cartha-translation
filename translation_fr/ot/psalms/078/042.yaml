    issue: « Il les avait rachetés de l’ennemi »
    rationale: Bien que « racheter » puisse traduire פדה, la construction « racheter quelqu’un de l’ennemi » n’est pas idiomatique en français moderne et peut suggérer indûment un rachat effectué auprès de l’ennemi. « Délivrer de l’ennemi » restitue le sens contextuel avec clarté.
