source:
  edition: WLC
  text: לֹא זָכְר֥וּ אֶת יָד֑/וֹ י֝֗וֹם אֲֽשֶׁר פָּדָ֥/ם מִנִּי צָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/042.yaml
  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: fr
  text: Ils ne se sont pas souvenus de sa main[a], du jour où il les avait délivrés de l’ennemi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa puissance » ou « de ce que sa main avait accompli ». L’hébreu dit littéralement « sa main ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’adversaire » ou « de l’oppresseur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: se sont souvenus
  rationale: Le qal de זכר signifie couramment « se souvenir, se rappeler ». Avec לֹא, « ne se sont pas souvenus » conserve la formulation hébraïque sans la réduire au plus interprétatif « ont oublié ».
- source_word: יָדוֹ
  choice: sa main
  rationale: La « main » est ici une image hébraïque concrète de la puissance ou de l’action. La conserver respecte la poésie du texte et demeure intelligible en français.
- source_word: יוֹם אֲשֶׁר
  choice: du jour où
  rationale: Cette tournure rend naturellement la valeur temporelle de l’hébreu et rattache le jour à l’acte de rédemption.
- source_word: פָּדָם
  choice: il les avait rachetés
  rationale: פדה exprime le rachat ou la délivrance hors d’une servitude ou d’un danger. « Racheter » préserve cette nuance forte; le plus-que-parfait marque naturellement en français l’antériorité de cet acte par rapport à leur défaut de mémoire.
- source_word: מִנִּי צָר
  choice: de l’ennemi
  rationale: צָר peut désigner l’ennemi, l’adversaire ou l’oppresseur. « L’ennemi » est clair, concis et adapté au registre poétique du psaume.
theological_decisions:
- issue: Force métaphorique de « sa main »
  choice: Conserver « sa main » dans le texte principal.
  alternative: « sa puissance » ou « ce que sa main avait accompli »
  rationale: L’hébreu emploie l’image concrète de la main pour évoquer la puissance et l’action de Dieu. La conserver évite de résoudre inutilement la métaphore.
- issue: Sens de פדה dans le contexte de l’Exode
  choice: Traduire par « racheter ».
  alternative: « délivrer » ou « libérer »
  rationale: Dans ce rappel historique, le verbe évoque l’intervention salvatrice par laquelle Dieu a soustrait son peuple à l’oppression. « Racheter » maintient cette portée sans préciser au-delà du texte le mécanisme du rachat.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme temporel et l’image biblique de la main, tout en employant des temps naturels dans un récit rétrospectif.
