id: PSA.78.8
reference: Psalms 78:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֤א יִהְי֨וּ כַּ/אֲבוֹתָ֗/ם דּוֹר֮ סוֹרֵ֪ר וּ/מֹ֫רֶ֥ה דּ֭וֹר לֹא הֵכִ֣ין לִבּ֑/וֹ וְ/לֹא נֶאֶמְנָ֖ה אֶת אֵ֣ל רוּחֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/008.yaml
  text: and that they should not be like their fathers[a], a stubborn and rebellious generation[b], a generation that did not set its heart aright and whose spirit was not faithful to God.
translation:
  language: fr
  text: et qu’ils ne soient pas comme leurs pères[a], une génération obstinée et rebelle, une génération qui n’avait pas affermi son cœur[b] et dont l’esprit n’était pas fidèle à Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ancêtres ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’avait pas préparé son cœur » ou « n’avait pas établi fermement son cœur ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dont l’esprit n’était pas ferme avec Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: génération
  rationale: Ce terme désigne ici un groupe humain d’une même époque ou l’ensemble des ancêtres évoqués comme une collectivité; sa répétition conserve le parallélisme hébreu.
- source_word: סוֹרֵר
  choice: indocile
  rationale: Le mot exprime une résistance obstinée et un refus de se laisser conduire; « indocile » s’associe naturellement à « rebelle » en français actuel.
- source_word: וּמֹרֶה
  choice: rebelle
  rationale: Le terme souligne la révolte active et complète le portrait d’une génération qui résiste et désobéit.
- source_word: הֵכִין לִבּוֹ
  choice: n’avait pas affermi son cœur
  rationale: הכין peut signifier préparer, établir ou rendre ferme. « Affermir son cœur » garde la métaphore de la résolution intérieure sans la réduire à une simple intention intellectuelle.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Le « cœur » désigne le centre de la volonté et des dispositions intérieures; le terme biblique reste naturel en français et ne doit pas être aplati en « pensée ».
- source_word: נֶאֶמְנָה
  choice: n’était pas fidèle
  rationale: Le niphal de אמן exprime ici la fidélité, la fiabilité ou la fermeté. « Fidèle » rend clairement la relation à Dieu tout en laissant l’idée de constance présente.
- source_word: אֶת אֵל
  choice: à Dieu
  rationale: Dans cette construction, la particule marque la relation de fidélité à Dieu. « Fidèle à Dieu » est le tour français le plus naturel; la possibilité plus littérale « ferme avec Dieu » est signalée en note.
- source_word: רוּחוֹ
  choice: l’esprit
  rationale: Le mot renvoie à la disposition intérieure de la génération. Le conserver distinct du « cœur » respecte le parallélisme anthropologique du texte.
- source_word: וְלֹא יִהְיוּ
  choice: et qu’ils ne soient pas
  rationale: 'Cette forme poursuit la visée exprimée dans le contexte précédent: la génération à venir doit apprendre afin de ne pas ressembler à ses pères.'
- source_word: כַאֲבוֹתָם
  choice: comme leurs pères
  rationale: « Pères » correspond directement à l’hébreu et maintient le contraste entre générations; « ancêtres » est une possibilité française plus explicite, indiquée en note.
theological_decisions:
- issue: Distinction entre le cœur et l’esprit
  choice: 'Conserver les deux termes: « cœur » et « esprit ».'
  alternative: Les fondre en une seule notion, telle que « pensée » ou « être intérieur ».
  rationale: L’hébreu emploie intentionnellement deux termes apparentés mais distincts pour évoquer à la fois la résolution intérieure et la fidélité. Les conserver préserve la texture poétique et théologique.
- issue: Accord avec le nom collectif « génération »
  choice: Employer le singulier dans « son cœur » et « dont l’esprit ».
  alternative: 'Passer au pluriel: « leurs cœurs » et « leurs esprits ».'
  rationale: Les suffixes hébreux sont au singulier et renvoient au collectif singulier דּוֹר. Le français permet le même accord sans obscurité.
- issue: Nature de la fidélité envers Dieu
  choice: Traduire נֶאֶמְנָה אֶת אֵל par « l’esprit n’était pas fidèle à Dieu ».
  alternative: « L’esprit n’était pas ferme avec Dieu. »
  rationale: Le texte peut mettre l’accent soit sur la fidélité relationnelle, soit sur la fermeté et la constance. Le texte principal offre le français le plus naturel, tandis que la note maintient l’autre nuance sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe conserve l’apposition répétée « une génération » ainsi que les deux images intérieures du texte hébreu. Les temps du passé décrivent naturellement en français la génération des pères, tandis que le subjonctif initial maintient le lien de finalité avec le contexte précédent.
