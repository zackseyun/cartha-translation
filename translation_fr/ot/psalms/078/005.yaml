source:
  edition: WLC
  text: וַ/יָּ֤קֶם עֵד֨וּת בְּֽ/יַעֲקֹ֗ב וְ/תוֹרָה֮ שָׂ֤ם בְּ/יִשְׂרָ֫אֵ֥ל אֲשֶׁ֣ר צִ֭וָּה אֶת אֲבוֹתֵ֑י/נוּ לְ֝/הוֹדִיעָ֗/ם לִ/בְנֵי/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: fr
  text: Il a établi un témoignage en Jacob et institué une loi[a] en Israël, qu’il a ordonné à nos pères[b] de faire connaître à leurs enfants[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une instruction » (hébreu : torah).'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « nos pères ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu peut aussi se traduire littéralement par « leurs fils »; ici, le mot désigne vraisemblablement leurs enfants dans leur ensemble.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: a établi
  rationale: Le hiphil de קום exprime ici l’action de faire tenir, donc d’établir durablement; « établir » convient au cadre institutionnel et à la langue biblique française actuelle.
- source_word: עֵדוּת
  choice: un témoignage
  rationale: Le terme peut désigner un témoignage ou une prescription attestant la volonté de Dieu. « Témoignage » conserve son champ lexical sans le réduire à un simple décret.
- source_word: בְּיַעֲקֹב
  choice: en Jacob
  rationale: La préposition ב est rendue directement, et « Jacob » désigne par métonymie le peuple; cette formulation maintient le parallélisme avec « en Israël ».
- source_word: וְתוֹרָה
  choice: une loi
  rationale: תורה désigne l’enseignement ou la loi. En parallèle avec עֵדוּת et dans ce contexte normatif de transmission, « loi » convient, tandis que « instruction » demeure une possibilité signalée en note.
- source_word: שָׂם
  choice: institué
  rationale: Le sens de base est « placer, mettre ». En français, « instituer une loi » exprime naturellement l’acte d’établir cette norme et évite la tournure moins idiomatique « mettre une loi ».
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: Cette traduction préserve la préposition et le parallélisme poétique avec « en Jacob ».
- source_word: אֲשֶׁר צִוָּה
  choice: qu’il a ordonné
  rationale: La relative peut se rapporter collectivement au témoignage et à la loi. La formulation française préserve cette souplesse sans ajouter un antécédent explicatif.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: à nos pères
  rationale: Le substantif hébreu est explicitement masculin pluriel. « Nos pères » le rend avec exactitude tout en restant compréhensible dans le registre intergénérationnel.
- source_word: לְהוֹדִיעָם
  choice: de faire connaître
  rationale: Le hiphil de ידע signifie « faire savoir, faire connaître ». Le pronom suffixe masculin pluriel renvoie probablement à l’ensemble « témoignage et loi »; le français permet de ne pas répéter ce complément.
- source_word: לִבְנֵיהֶם
  choice: à leurs enfants
  rationale: בנים peut désigner les fils ou, collectivement, les enfants et descendants. Le contexte de transmission entre générations favorise ici « enfants ».
theological_decisions:
- issue: Sens de תּוֹרָה dans ce contexte d’alliance
  choice: une loi
  alternative: une instruction
  rationale: Le parallélisme avec « témoignage » et le commandement de la transmettre soulignent sa force normative. « Instruction » reste lexicalement possible et est conservé en note.
- issue: Antécédent de אֲשֶׁר et du suffixe dans לְהוֹדִיעָם
  choice: formulation française laissant la référence collective au témoignage et à la loi
  alternative: faire de la seule « loi » l’antécédent explicite
  rationale: Le suffixe hébreu est masculin pluriel, ce qui peut reprendre collectivement les deux réalités mentionnées. Ne pas expliciter davantage préserve l’ambiguïté syntaxique du texte.
- issue: Langage de parenté genré
  choice: nos pères ... leurs enfants
  alternative: nos ancêtres ... leurs fils
  rationale: « Pères » respecte le masculin explicite de אבותינו. Pour בנים, le cadre intergénérationnel permet le sens collectif « enfants », sans affirmer une restriction aux seuls fils.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme « en Jacob / en Israël » est conservé. « Institué une loi » privilégie une collocation française naturelle, tandis que les notes rendent visibles les principales possibilités lexicales de l’hébreu.
