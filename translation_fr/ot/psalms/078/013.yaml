id: PSA.78.13
reference: Psalms 78:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּ֣קַע יָ֭ם וַ/יַּֽעֲבִירֵ֑/ם וַֽ/יַּצֶּב מַ֥יִם כְּמוֹ נֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/013.yaml
  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: fr
  text: Il fendit la mer et les fit passer ; il dressa les eaux comme un amas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une masse amoncelée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: fendit
  rationale: Le verbe exprime l’action de fendre ou d’ouvrir en séparant. « Fendit » conserve cette image vive et reste naturel dans un registre poétique digne.
- source_word: יָם
  choice: la mer
  rationale: Dans ce contexte de la tradition de l’exode, le nom désigne la mer traversée, sans que le verset la nomme plus précisément.
- source_word: וַיַּעֲבִירֵם
  choice: les fit passer
  rationale: La forme causative de עבר indique qu’il leur fit effectuer le passage. Cette formulation française préserve explicitement cette valeur.
- source_word: וַיַּצֶּב
  choice: dressa
  rationale: Le verbe signifie mettre ou faire tenir debout. « Dressa » rend de façon concise et imagée la valeur causative.
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel poétique français correspond à la forme hébraïque et convient à la représentation des eaux de la mer.
- source_word: כְּמוֹ
  choice: comme
  rationale: Équivalent comparatif direct et naturel en français.
- source_word: נֵד
  choice: un amas
  rationale: Le nom désigne une masse amoncelée ou un tas. « Amas » conserve l’image des eaux accumulées sans importer l’image interprétative d’une muraille.
theological_decisions:
- issue: Nature de l’image du miracle de la mer
  choice: Conserver l’image concrète des eaux dressées comme un amas, sans en expliquer le mécanisme.
  alternative: Paraphraser par « retint les eaux » ou interpréter l’image comme une muraille.
  rationale: Le verset présente l’action de Dieu au moyen d’une image vive liée à l’exode. La traduction en maintient la force sans trancher la question de son mécanisme ni remplacer la métaphore du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé simple convient au récit psalmique. Le parallélisme des deux propositions est conservé, avec une formulation concise.
