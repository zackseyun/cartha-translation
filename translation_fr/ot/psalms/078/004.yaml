source:
  edition: WLC
  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: fr
  text: Nous ne les cacherons pas à leurs enfants ; nous raconterons à la génération à venir[b] les actes dignes de louange[a] de Yahweh, sa puissance et les merveilles qu’il a accomplies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les louanges de Yahweh ». Le mot hébreu peut désigner soit les louanges adressées à Yahweh, soit ce qui, dans ses actes, est digne de louange ; le contexte favorise ici ce dernier sens.
    reason: lexical_alternative
  - marker: b
    text: Ou « à la génération suivante » ou « à une génération future ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: nous ne les cacherons pas
  rationale: Le piel de כחד exprime ici le fait de dissimuler ou de soustraire à la connaissance. « Cacher » est naturel et conserve la force volontaire du futur.
- source_word: מִבְּנֵיהֶם
  choice: à leurs enfants
  rationale: בנים peut désigner les fils, les enfants ou les descendants. Le contexte de transmission entre générations favorise le terme inclusif « enfants ».
- source_word: לְדוֹר אַחֲרוֹן
  choice: à la génération à venir
  rationale: L’expression désigne une génération postérieure. « À venir » garde l’orientation vers l’avenir sans imposer qu’il s’agisse uniquement de la génération immédiatement suivante.
- source_word: מְסַפְּרִים
  choice: nous raconterons
  rationale: 'Le participe décrit la manière de ne pas cacher : en relatant. Une proposition coordonnée avec « nous raconterons » donne en français une phrase nette et vigoureuse tout en conservant ce rapport explicatif.'
- source_word: תְּהִלּוֹת יְהוָה
  choice: les actes dignes de louange de Yahweh
  rationale: תהלות peut désigner les louanges adressées à Yahweh ou ce qui, en lui et dans son action, mérite la louange. La coordination avec sa puissance et les merveilles qu’il a accomplies favorise ici le second sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עֱזוּזוֹ
  choice: sa puissance
  rationale: עֱזוּז désigne la force ou la puissance. « Puissance » convient à l’évocation des interventions divines et s’intègre naturellement à l’énumération.
- source_word: נִפְלְאוֹתָיו
  choice: les merveilles
  rationale: Le nom désigne des actes extraordinaires qui suscitent l’émerveillement. « Merveilles » est concis, clair et conforme au registre poétique du psaume.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a accomplies
  rationale: La relative qualifie les merveilles. Le passé composé présente ces actes comme accomplis mais toujours pertinents pour la mémoire transmise.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » conserve le nom divin sans le remplacer par un titre.
- issue: Sens de תְּהִלּוֹת יְהוָה
  choice: les actes dignes de louange de Yahweh
  alternative: les louanges de Yahweh
  rationale: La proximité de « sa puissance » et de « ses merveilles » favorise les réalités louables que l’on raconte au sujet de Yahweh. Une note maintient toutefois l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est rendu par deux propositions séparées par un point-virgule ; cette formulation naturelle explicite la valeur du participe hébreu sans modifier la relation logique. L’énumération garde les trois éléments du texte source.
