id: PSA.78.32
reference: Psalms 78:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: fr
  text: Malgré tout cela, ils continuèrent à pécher et ne crurent pas à ses actes merveilleux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne mirent pas leur confiance dans ses actes merveilleux »; le verbe hébreu peut signifier croire ou faire confiance.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל־זֹאת
  choice: Malgré tout cela
  rationale: 'L’expression est concessive dans ce contexte : malgré les jugements et les bienfaits divins rapportés auparavant, le peuple persiste dans le péché.'
- source_word: חָטְאוּ עוֹד
  choice: ils continuèrent à pécher
  rationale: Le parfait חָטְאוּ exprime l’action de pécher, tandis que עוֹד en souligne la poursuite obstinée. Cette formulation est plus naturelle en français que « ils péchèrent encore » dans ce contexte.
- source_word: וְלֹא הֶאֱמִינוּ
  choice: et ne crurent pas
  rationale: Le hiphil de אמן peut exprimer le fait de croire ou de faire confiance. « Ne crurent pas » conserve ici l’accent sur leur incrédulité face aux actes accomplis par Dieu.
- source_word: בְּנִפְלְאוֹתָיו
  choice: à ses actes merveilleux
  rationale: נִפְלָאוֹת désigne les actes extraordinaires de Dieu. « Actes merveilleux » rend leur caractère concret et prodigieux; avec croire, la préposition ב peut naturellement être rendue par « à » en français.
theological_decisions:
- issue: Nature de la défaillance d’Israël devant les actes de Dieu
  choice: ne crurent pas à ses actes merveilleux
  alternative: ne mirent pas leur confiance dans ses actes merveilleux / ne crurent pas ses actes merveilleux
  rationale: L’hébreu permet une nuance de croyance ou de confiance. Le texte principal exprime clairement l’incrédulité face aux actes divins sans préciser davantage sa nature doctrinale; la note préserve les autres nuances possibles.
translation_notes:
  register: Français moderne, international et digne. La tournure « continuèrent à pécher » traduit naturellement la valeur persistante de עוֹד. Le marqueur de note est placé après la proposition concernée.
