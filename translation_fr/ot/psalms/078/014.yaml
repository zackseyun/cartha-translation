  text: וַ/יַּנְחֵ֣/ם בֶּ/עָנָ֣ן יוֹמָ֑ם וְ/כָל הַ֝/לַּ֗יְלָה בְּ/א֣וֹר אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/014.yaml
  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: fr
  text: Il les conduisit[a], le jour, par une nuée, et toute la nuit par la lumière d’un feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « guida ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Il les conduisit
  rationale: Le hiphil de נחה avec suffixe de troisième personne du masculin pluriel signifie « conduire » ou « guider ». « Conduisit » exprime naturellement et directement la direction donnée par Dieu dans le désert.
- source_word: בֶּעָנָן
  choice: par une nuée
  rationale: 'La préposition ב a ici une valeur instrumentale : Dieu les conduit au moyen de la nuée. « Par une nuée » conserve cette relation sans préciser davantage la nature du phénomène.'
- source_word: יוֹמָם
  choice: le jour
  rationale: Cet adverbe temporel signifie « le jour » ou « pendant la journée ». La formulation concise répond naturellement à « toute la nuit ».
- source_word: וְכָל הַלַּיְלָה
  choice: et toute la nuit
  rationale: Cette traduction rend explicitement l’idée de totalité portée par כָּל et reste idiomatique en français moderne.
- source_word: בְּאוֹר אֵשׁ
  choice: par la lumière d’un feu
  rationale: 'L’expression garde distincts les deux noms, « lumière » et « feu », tout en rendant la valeur instrumentale de ב : le feu fournissait la lumière qui les guidait.'
theological_decisions:
- issue: Nature de l’image de la conduite dans le désert
  choice: Présenter la conduite historique du peuple par la nuée et la lumière du feu, sans ajouter d’interprétation typologique.
  alternative: Expliciter dans le texte principal une signification typologique de la nuée et du feu.
  rationale: Le verset rappelle la conduite d’Israël lors de l’Exode. Il ne formule pas lui-même l’interprétation théologique plus large que cette image peut recevoir ailleurs.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit rétrospectif du psaume. « Nuée » est conservé comme terme biblique courant et précis, tandis que la syntaxe reste accessible.
