source:
  edition: WLC
  text: יְשַׁלַּח בָּ֨/ם חֲר֬וֹן אַפּ֗/וֹ עֶבְרָ֣ה וָ/זַ֣עַם וְ/צָרָ֑ה מִ֝שְׁלַ֗חַת מַלְאֲכֵ֥י רָעִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/049.yaml
  text: He sent against them his burning anger[a], fury, indignation, and distress, a band of destructive messengers.
translation:
  language: fr
  text: Il envoya contre eux son ardente colère, sa fureur, son indignation et la détresse — un envoi de messagers destructeurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « un envoi de messagers funestes » ou « d’anges de malheur » ; traditionnellement : « de mauvais anges ». L’hébreu peut désigner des messagers porteurs d’une calamité destructrice plutôt que des êtres moralement mauvais.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: Il déchaîna
  rationale: Le piel de שלח exprime ici une action divine hostile dirigée contre les Égyptiens. « Déchaîna » rend naturellement l’idée d’envoyer ou de laisser se répandre les fléaux énumérés, avec leur force poétique.
- source_word: בָּם
  choice: contre eux
  rationale: Dans ce contexte de jugement, la préposition désigne les destinataires visés par l’action hostile.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: Cette expression idiomatique évoque littéralement la chaleur de la colère. « Ardente colère » en conserve l’intensité dans un français naturel et digne.
- source_word: עֶבְרָה
  choice: sa fureur
  rationale: Le nom désigne une colère débordante ou furieuse. « Fureur » le distingue du terme précédent tout en maintenant l’accumulation poétique.
- source_word: וָזַעַם
  choice: son indignation
  rationale: זעם peut exprimer une colère réprobatrice ou une indignation. Ce choix évite de confondre les quasi-synonymes successifs.
- source_word: וְצָרָה
  choice: et la détresse
  rationale: Le terme désigne l’angoisse, l’épreuve ou la détresse infligée. « La détresse » convient au contexte des plaies et du jugement.
- source_word: מִשְׁלַחַת
  choice: une troupe
  rationale: Le nom évoque un envoi ou un détachement envoyé en mission. « Une troupe » rend idiomatiquement l’idée d’un groupe mandaté, sans nier le sens d’envoi.
- source_word: מַלְאֲכֵי
  choice: messagers
  rationale: מלאך peut désigner un messager humain ou céleste. « Messagers » conserve cette latitude lexicale sans trancher leur nature dans le texte principal.
- source_word: רָעִים
  choice: destructeurs
  rationale: L’adjectif peut signifier mauvais, nuisible ou calamiteux. Ici, « destructeurs » met en avant leur effet funeste sans imposer l’idée d’une perversité morale.
theological_decisions:
- issue: La formule מַלְאֲכֵי רָעִים désigne-t-elle des anges moralement mauvais ou des agents porteurs de calamité ?
  choice: une troupe de messagers destructeurs
  alternative: 'un envoi d’anges de malheur ; traditionnellement : de mauvais anges'
  rationale: מלאך signifie « messager » et רָעִים peut qualifier ce qui est mauvais, nuisible ou funeste. Le texte principal conserve le sens judiciaire sans affirmer que Dieu mandate des êtres moralement mauvais ; la note préserve les autres lectures possibles.
translation_notes:
  register: Français international actuel, poétique et digne. L’accumulation des termes de colère est conservée. Les possessifs répétés clarifient que la fureur et l’indignation sont celles de Dieu, tandis que les deux-points présentent la troupe de messagers comme l’expression ou le moyen de la détresse envoyée.
