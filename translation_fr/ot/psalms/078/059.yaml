base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: fr
  text: Dieu entendit, s’emporta[a] et rejeta[b] complètement Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut poussé à la colère ». Le verbe hébreu exprime le fait de se mettre en colère ou d’être saisi de fureur.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « prit Israël en profond dégoût » ou « repoussa fortement Israël ». Le verbe peut exprimer le rejet aussi bien que le mépris ou l’aversion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: entendit
  rationale: Le qal exprime ici simplement le fait d’entendre ; ce verbe introduit la réaction de Dieu à la conduite d’Israël.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici, avec un sens singulier, le Dieu d’Israël.
- source_word: וַיִּתְעַבָּר
  choice: entra dans une grande colère
  rationale: Le hitpael de עבר décrit ici le fait de s’emporter ou d’être saisi de colère. Cette formulation française naturelle conserve la force du terme sans préciser indûment la cause de la colère.
- source_word: וַיִּמְאַס
  choice: rejeta
  rationale: מאס peut exprimer le rejet, le refus ou le mépris. « Rejeta » convient au contexte de jugement et préserve l’acte de répudiation sans réduire le terme à un sentiment de dédain.
- source_word: מְאֹד
  choice: complètement
  rationale: L’adverbe intensifie fortement le rejet. « Complètement » rend cette intensité de façon claire et idiomatique, sans ajouter une idée explicite de permanence.
- source_word: בְּיִשְׂרָאֵל
  choice: Israël
  rationale: Avec מאס, la préposition ב marque l’objet du rejet ; en français, celui-ci s’exprime naturellement comme complément d’objet direct.
theological_decisions:
- issue: Langage anthropopathique concernant la colère et le rejet divins
  choice: Conserver les expressions fortes « entra dans une grande colère » et « rejeta complètement ».
  alternative: Atténuer en « fut mécontent » et « retira sa faveur à Israël ».
  rationale: L’hébreu emploie un langage vigoureux de jugement dans le cadre de l’alliance. La traduction maintient cette tension théologique au lieu d’adoucir le texte.
translation_notes:
  register: Français international moderne, clair et digne. La proposition coordonnée est rendue par un point-virgule pour éviter une succession lourde de « et », tout en conservant l’enchaînement narratif de l’hébreu.
