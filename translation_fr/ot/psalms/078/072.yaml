  text: וַ֭/יִּרְעֵ/ם כְּ/תֹ֣ם לְבָב֑/וֹ וּ/בִ/תְבוּנ֖וֹת כַּפָּ֣י/ו יַנְחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/072.yaml
  text: So he shepherded them with integrity of heart[b][a], and guided them with the skill of his hands.
translation:
  language: fr
  text: Il les fit paître avec un cœur intègre[a], et les guida par l’habileté de ses mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon l’intégrité de son cœur ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, l’expression peut se rendre par « avec les discernements de ses mains », c’est-à-dire avec un savoir-faire éclairé dans sa manière de conduire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: Il prit soin d’eux en berger
  rationale: Le verbe רעה évoque l’action d’un berger. Cette formulation française naturelle conserve explicitement l’image pastorale appliquée ici au règne de David.
- source_word: כְּתֹם לְבָבוֹ
  choice: avec un cœur intègre
  rationale: תֹם exprime l’intégrité, la droiture ou la plénitude morale. « Un cœur intègre » rend clairement le sens éthique tout en conservant l’image hébraïque du cœur comme centre de la volonté et des dispositions intérieures.
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: par l’habileté de ses mains
  rationale: תְּבוּנָה désigne l’intelligence, le discernement ou la compétence pratique. Associé aux mains, le pluriel évoque ici un savoir-faire éclairé ; « l’habileté de ses mains » est idiomatique et préserve la métaphore corporelle.
- source_word: יַנְחֵם
  choice: les guida
  rationale: Le hifil de נחה signifie conduire ou guider. « Guida » exprime une direction avisée et s’accorde avec l’image du berger.
theological_decisions:
- issue: L’image royale de David comme berger
  choice: Conserver explicitement l’image du berger dans le texte principal.
  alternative: Employer seulement une expression générale telle que « il prit soin d’eux » ou « il les dirigea ».
  rationale: Le verset conclut la présentation de David comme berger choisi pour gouverner le peuple. Garder cette image préserve la portée royale et pastorale du texte sans lui imposer une interprétation messianique qui n’est pas formulée dans ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « prit soin d’eux en berger » évite l’ambiguïté concrète de « les fit paître » tout en maintenant l’image pastorale ; le parallélisme entre l’intégrité intérieure et la compétence pratique demeure visible.
