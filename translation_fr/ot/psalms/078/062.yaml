  text: וַ/יַּסְגֵּ֣ר לַ/חֶ֣רֶב עַמּ֑/וֹ וּ֝/בְ/נַחֲלָת֗/וֹ הִתְעַבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/062.yaml
  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: fr
  text: Il livra son peuple à l’épée et s’emporta contre son héritage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: il livra
  rationale: Le hifil de סגר signifie ici remettre quelqu’un au pouvoir d’un autre. « Livra » exprime naturellement cette idée dans le contexte du jugement.
- source_word: לַחֶרֶב
  choice: à l’épée
  rationale: חֶרֶב désigne littéralement l’épée et, par métonymie, la mort violente au combat. L’image hébraïque est conservée.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם avec le suffixe masculin singulier signifie directement « son peuple » et désigne ici le peuple de Dieu.
- source_word: וּבְנַחֲלָתוֹ
  choice: contre son héritage
  rationale: נַחֲלָה présente Israël comme la part qui appartient à Dieu. Avec le verbe de colère, בְּ se rend naturellement par « contre » en français.
- source_word: הִתְעַבָּר
  choice: s’emporta
  rationale: Le hitpael de עבר exprime ici une violente colère. « S’emporta » en rend la force tout en restant naturel et digne.
theological_decisions:
- issue: Désignations d’alliance appliquées à Israël
  choice: son peuple… son héritage
  alternative: sa nation… son patrimoine
  rationale: 'Le maintien des deux désignations conserve la tension théologique du texte : le jugement frappe ceux qui demeurent présentés comme le peuple et la possession de Dieu.'
translation_notes:
  register: Français moderne, courant et digne. La formulation concise garde le parallélisme hébreu et la forte image de l’épée.
