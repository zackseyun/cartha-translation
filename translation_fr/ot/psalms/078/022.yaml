  text: because they did not believe in God, and did not trust in his salvation.
translation:
  language: fr
  text: 'car ils n’ont pas cru en Dieu

    et n’ont pas mis leur confiance dans son salut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: ils n’ont pas cru en Dieu
  rationale: Le hiphil de אמן avec ב exprime ici le fait de croire en Dieu ou de se fier à lui. « Croire en Dieu » est naturel en français et maintient la distinction avec la proposition parallèle sur la confiance.
- source_word: בָטְחוּ בִּישׁוּעָתוֹ
  choice: ont mis leur confiance dans son salut
  rationale: בטח avec ב désigne la confiance placée dans quelque chose. Cette formulation française restitue clairement le complément, tandis que « son salut » conserve le nom ישועה et sa portée théologique sans le réduire à une délivrance particulière.
theological_decisions:
- issue: Objet de la foi dans הֶאֱמִינוּ בֵּאלֹהִים
  choice: cru en Dieu
  alternative: cru Dieu
  rationale: La préposition ב soutient « en Dieu ». Ce choix décrit la foi ou la confiance placée en Dieu, plutôt que la seule acceptation de sa parole comme vraie.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique est conservé sur deux lignes, ainsi que la nuance entre croire en Dieu et mettre sa confiance dans son salut.
