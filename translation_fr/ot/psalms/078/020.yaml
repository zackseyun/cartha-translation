  text: הֵ֤ן הִכָּה צ֨וּר וַ/יָּז֣וּבוּ מַיִם֮ וּ/נְחָלִ֪ים יִ֫שְׁטֹ֥פוּ הֲ/גַם לֶ֭חֶם י֣וּכַל תֵּ֑ת אִם יָכִ֖ין שְׁאֵ֣ר לְ/עַמּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: fr
  text: 'Certes, il a frappé le rocher : les eaux ont jailli, des torrents ont déferlé. Peut-il aussi donner du pain, ou fournir de la viande à son peuple ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Dans cette reprise emphatique d’un fait admis, « Oui » marque naturellement la concession en français moderne; le « Mais » de la question suivante fait ressortir le contraste sceptique.
- source_word: הִכָּה
  choice: a frappé
  rationale: Rend directement l’action accomplie, avec la force du verbe hébreu.
- source_word: צוּר
  choice: le rocher
  rationale: L’article défini convient à l’épisode précis du rocher au désert évoqué dans le contexte.
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: les eaux ont jailli
  rationale: « Jaillir » restitue l’image vive d’une eau sortant en abondance; le pluriel « les eaux » conserve celui de l’hébreu.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: et des torrents ont déferlé
  rationale: נְחָלִים peut désigner des cours d’eau torrentiels, et שׁטף évoque un écoulement puissant; cette formulation conserve l’intensité de l’image.
- source_word: הֲגַם
  choice: Mais pourra-t-il aussi
  rationale: La particule interrogative et גם ouvrent une question sceptique qui étend l’épreuve de l’eau à la nourriture; « Mais » explicite en français la transition argumentative sans en changer le sens.
- source_word: לֶחֶם
  choice: du pain
  rationale: Conserve le terme concret de l’hébreu plutôt que de le généraliser en « nourriture ».
- source_word: יוּכַל תֵּת
  choice: pourra-t-il donner
  rationale: Exprime explicitement la capacité mise en doute dans la question rhétorique.
- source_word: אִם
  choice: ou
  rationale: Dans cette construction interrogative, אִם introduit naturellement le second membre coordonné.
- source_word: יָכִין
  choice: procurer
  rationale: Dans le contexte du ravitaillement du peuple, le verbe signifie préparer ou mettre à disposition; « procurer » rend clairement ce sens.
- source_word: שְׁאֵר
  choice: de la viande
  rationale: Le nom désigne littéralement la chair, ici envisagée comme nourriture; « viande » est le terme français naturel dans ce contexte.
- source_word: לְעַמּוֹ
  choice: à son peuple
  rationale: Rend simplement la relation entre Dieu et le peuple d’Israël sans ajouter de précision interprétative.
theological_decisions:
- issue: Force rhétorique du scepticisme d’Israël
  choice: Présenter les dernières propositions comme une question sceptique portant sur la capacité de Dieu à fournir de la nourriture en plus de l’eau.
  alternative: Les rendre comme des affirmations neutres ou comme une simple demande d’information.
  rationale: La particule interrogative et le contexte d’incrédulité indiquent une mise en doute rhétorique de la puissance divine; la traduction conserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme poétique est soutenu par les deux verbes imagés « ont jailli » et « ont déferlé ». Aucun archaïsme ni particularisme confessionnel.
