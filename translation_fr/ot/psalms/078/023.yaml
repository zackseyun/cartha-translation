  text: וַ/יְצַ֣ו שְׁחָקִ֣ים מִ/מָּ֑עַל וְ/דַלְתֵ֖י שָׁמַ֣יִם פָּתָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/023.yaml
  text: Yet he commanded the clouds above[b][a], and opened the doors of heaven.
translation:
  language: fr
  text: Pourtant, il donna ses ordres aux nuages d’en haut et ouvrit les portes du ciel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: il donna ses ordres
  rationale: Le verbe צוה exprime l’action de commander ou de donner un ordre. Cette formulation naturelle en français conserve l’autorité personnelle de Dieu et la valeur narrative passée.
- source_word: שְׁחָקִים
  choice: aux nuages
  rationale: שׁחקים peut désigner les nuages ou les cieux. Dans le contexte de la manne et en parallèle avec les portes du ciel, « nuages » donne une image concrète sans exclure la dimension céleste.
- source_word: מִמָּעַל
  choice: d’en haut
  rationale: L’expression indique la position supérieure. « Les nuages d’en haut » rend distinctement cet élément tout en restant idiomatique.
- source_word: דַלְתֵי
  choice: les portes
  rationale: דלת signifie normalement « porte ». Le pluriel construit est rendu directement, sans le remplacer par « portes monumentales » ou « portails ».
- source_word: שָׁמַיִם
  choice: du ciel
  rationale: שמים peut désigner le ciel ou les cieux. Dans l’expression poétique française « les portes du ciel », le singulier collectif est naturel et digne.
- source_word: פָּתָח
  choice: ouvrit
  rationale: פתח signifie simplement « ouvrir ». Le passé simple convient au récit poétique et n’ajoute aucune intensité absente de l’hébreu.
- source_word: וַ
  choice: Pourtant
  rationale: La conjonction peut signifier simplement « et », mais le contexte oppose l’incrédulité d’Israël à l’action généreuse de Dieu. « Pourtant » exprime clairement cette relation discursive sans modifier le contenu de l’action.
theological_decisions:
- issue: Valeur discursive de la conjonction initiale dans le contexte de l’incrédulité d’Israël et de la provision divine
  choice: Pourtant
  alternative: Et / Puis
  rationale: L’hébreu autorise une simple coordination, mais le contexte du psaume présente ici un contraste. La traduction retenue préserve cette tension narrative sans introduire une conclusion doctrinale étrangère.
translation_notes:
  register: Français moderne, international et poétique. Le passé simple maintient la dignité du psaume tout en restant immédiatement compréhensible. Aucun marqueur de note n’est requis, puisque les principales nuances lexicales sont rendues directement sans qu’une variante soit indispensable à la lecture.
