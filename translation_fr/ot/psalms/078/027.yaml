id: PSA.78.27
reference: Psalms 78:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּמְטֵ֬ר עֲלֵי/הֶ֣ם כֶּ/עָפָ֣ר שְׁאֵ֑ר וּֽ/כְ/ח֥וֹל יַ֝מִּ֗ים ע֣וֹף כָּנָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/027.yaml
  text: He rained meat on them like dust[b][a], and winged birds like the sand of the seas.
translation:
  language: fr
  text: Il fit pleuvoir sur eux de la viande[a] comme la poussière, et des oiseaux ailés comme le sable des mers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la chair ». Le mot hébreu peut désigner la chair ou la viande ; ici, il s’agit de la nourriture fournie dans le désert.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement « le sable des mers » ; on peut aussi traduire plus couramment « le sable de la mer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Il fit pleuvoir
  rationale: Le hiphil de מטר exprime l’idée de faire pleuvoir ou de faire tomber en pluie. « Il fit pleuvoir » conserve clairement cette valeur causative en français naturel.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל avec suffixe pronominal signifie ici naturellement « sur eux ».
- source_word: כֶּעָפָר
  choice: comme la poussière
  rationale: Le préfixe comparatif כְּ est rendu par « comme » ; « la poussière » conserve l’image d’une quantité innombrable.
- source_word: שְׁאֵר
  choice: de la viande
  rationale: שְׁאֵר peut désigner la chair ou la viande. Dans le contexte de la nourriture fournie au désert, « viande » exprime naturellement la chair destinée à être mangée.
- source_word: וּכְחוֹל יַמִּים
  choice: comme le sable des mers
  rationale: Cette traduction conserve le pluriel hébreu יַמִּים, « mers », tout en restant idiomatique et intelligible en français.
- source_word: עוֹף כָּנָף
  choice: des oiseaux ailés
  rationale: L’expression signifie littéralement « oiseau d’aile ». « Oiseaux ailés » préserve l’image hébraïque dans un français digne et compréhensible.
theological_decisions: []
