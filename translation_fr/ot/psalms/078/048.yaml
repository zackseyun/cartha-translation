  text: וַ/יַּסְגֵּ֣ר לַ/בָּרָ֣ד בְּעִירָ֑/ם וּ֝/מִקְנֵי/הֶ֗ם לָ/רְשָׁפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/048.yaml
  text: He gave over their cattle to the hail[a], and their livestock to the lightning bolts.
translation:
  language: fr
  text: Il livra leurs bêtes à la grêle, et leurs troupeaux aux éclairs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux traits de feu » ou « aux flammes » ; le terme hébreu peut désigner des forces destructrices ardentes ou fulgurantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Il livra
  rationale: Le verbe סגר peut signifier « enfermer », mais aussi « livrer, remettre ». Dans ce contexte de jugement destructeur, « livra » exprime naturellement l’idée que Dieu abandonne les animaux à ces fléaux.
- source_word: לַבָּרָד
  choice: à la grêle
  rationale: בָּרָד désigne sans ambiguïté la grêle, et la préposition ל marque ici la puissance destructrice à laquelle les bêtes sont livrées.
- source_word: בְּעִירָם
  choice: leurs bêtes
  rationale: בְּעִיר désigne collectivement les animaux domestiques, notamment les bêtes de somme. « Leurs bêtes » reste naturel et permet de conserver la variation poétique avec מִקְנֶה.
- source_word: וּמִקְנֵיהֶם
  choice: et leurs troupeaux
  rationale: מִקְנֶה désigne le bétail possédé. « Leurs troupeaux » convient au contexte pastoral et maintient le parallélisme sans répéter exactement « leurs bêtes ».
- source_word: לָרְשָׁפִים
  choice: aux traits de feu
  rationale: רְשָׁפִים peut évoquer des traits ou éclats brûlants, notamment des éclairs, mais aussi plus largement des flammes ou des forces ardentes. « Traits de feu » conserve l’image plurielle et son ambiguïté, précisée en note.
