  source_fidelity: Le texte hébreu dit littéralement que Dieu « consuma/acheva leurs jours dans la futilité » et « leurs années dans la terreur ». « Mit fin à » est défendable pour כלה, mais « donc » n'est pas exprimé lexicalement par le texte et ajoute une inférence connective. La révision conserve l'agent divin implicite rendu par « Il », les deux repères temporels parallèles et la force de בהלה.
  naturalness: « Il consuma leurs jours dans la futilité » est une formulation poétique et intelligible en français moderne, plus proche de la construction transitive de כלה que « Il mit fin à leurs jours ». « Épouvante » est naturel dans ce registre biblique et poétique.
  terminology: « Futilité » rend correctement הבל dans son sens figuré de vanité/inconsistance ; « épouvante » rend בהלה, peur soudaine ou affolement. La note présente des variantes lexicales sans les imposer au texte principal.
