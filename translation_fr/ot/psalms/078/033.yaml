  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: fr
  text: Il consuma leurs jours dans la futilité[a], et leurs années dans l’épouvante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il acheva leurs jours dans la vanité, et leurs années dans une terreur soudaine. »'
    reason: כלה peut signifier « consumer » ou « achever » ; הבל peut évoquer la vanité ; בהלה peut désigner une terreur soudaine ou l’affolement.
lexical_decisions:
- source_word: וַיְכַל
  choice: il mit donc fin à
  rationale: Le verbe כלה peut signifier « achever », « mettre fin à » ou « consumer ». Avec Dieu comme sujet implicite, cette tournure exprime clairement son action de jugement sans suggérer nécessairement l’anéantissement.
- source_word: בַּהֶבֶל
  choice: dans la futilité
  rationale: הֶבֶל désigne littéralement un souffle ou une vapeur, puis ce qui est vain, inconsistant ou futile. « Dans la futilité » rend ici le caractère vain et gâché de leurs jours.
- source_word: יְמֵיהֶם
  choice: leurs jours
  rationale: La traduction littérale conserve l’image temporelle et le parallélisme poétique.
- source_word: וּשְׁנוֹתָם
  choice: et à leurs années
  rationale: « Années » est maintenu en parallèle avec « jours » ; la répétition de « à » rend naturelle en français la construction régie par « mettre fin ».
- source_word: בַּבֶּהָלָה
  choice: dans l’épouvante
  rationale: בֶּהָלָה évoque la terreur, l’affolement ou une soudaine consternation. « Épouvante » conserve la forte intensité du terme dans ce contexte de jugement.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: 'Dieu est le sujet : « Il mit donc fin… »'
  alternative: 'Formulation impersonnelle : « leurs jours prirent fin »'
  rationale: Le contexte attribue ce jugement à Dieu, et la forme verbale hébraïque a un sujet masculin singulier. Le pronom explicite préserve cette agentivité divine.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Il mit donc fin » est plus idiomatique que « il consuma » dans le texte principal ; « épouvante » restitue la vigueur du jugement sans archaïsme marqué.
