source:
  edition: WLC
  text: וַ/יַּסַּ֣ע כַּ/צֹּ֣אן עַמּ֑/וֹ וַֽ/יְנַהֲגֵ֥/ם כַּ֝/עֵ֗דֶר בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/052.yaml
  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: fr
  text: 'Puis il fit partir son peuple comme des brebis,

    et les conduisit comme un troupeau dans le désert.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: il fit partir
  rationale: La forme causative de נסע exprime le fait de mettre en route. « Fit partir » conserve cette valeur sans suggérer la contrainte de « chassa ».
- source_word: כַּצֹּאן
  choice: comme des brebis
  rationale: צֹאן désigne le petit bétail, notamment les moutons et les chèvres. Dans cette comparaison pastorale, « des brebis » est naturel et prépare l’image du troupeau.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici Israël en tant que peuple appartenant à Dieu; « son peuple » rend directement cette relation.
- source_word: וַיְנַהֲגֵם
  choice: les conduisit
  rationale: נהג signifie mener, conduire ou guider, notamment un troupeau. « Les conduisit » préserve la nuance pastorale et se distingue du premier verbe.
- source_word: כָּעֵדֶר
  choice: comme un troupeau
  rationale: עֵדֶר désigne un troupeau. Ce choix maintient la cohérence de la comparaison avec les brebis.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région non cultivée ou peu habitée. « Désert » est le terme français courant dans le contexte de l’Exode, sans impliquer nécessairement une étendue uniquement sablonneuse.
theological_decisions:
- issue: Image de Dieu comme berger d’Israël dans le contexte de l’Exode
  choice: 'Les deux comparaisons pastorales sont conservées directement: Dieu met son peuple en route comme des brebis et le conduit comme un troupeau.'
  alternative: Expliciter Dieu comme « berger » ou développer la portée de l’image.
  rationale: Le verset suggère l’image du berger sans employer ce nom. La traduction conserve donc la métaphore et la relation entre Dieu et son peuple sans ajouter de développement doctrinal.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme hébreu est préservé en deux lignes, avec une variation verbale naturelle entre « fit partir » et « conduisit ».
