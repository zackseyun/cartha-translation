  text: וַֽ֭/יִּזְכְּרוּ כִּֽי אֱלֹהִ֣ים צוּרָ֑/ם וְ/אֵ֥ל עֶ֝לְיוֹן גֹּאֲלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/035.yaml
  text: Then they remembered that God was their rock[a], and God Most High was their redeemer.
translation:
  language: fr
  text: Alors ils se souvinrent que Dieu était leur rocher, et que Dieu, le Très-Haut,[a] était leur rédempteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « et que le Dieu Très-Haut était leur rédempteur ». L’ordre des mots hébreux est littéralement : « et Dieu Très-Haut, leur rédempteur ».'
    reason: La suite אֵל עֶלְיוֹן peut être rendue comme un titre composé ou comme un nom suivi d’une épithète en apposition.
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Alors ils se souvenaient
  rationale: Le wayyiqtol fait progresser le récit. « Alors » en exprime la succession, tandis que l’imparfait convient au mouvement rétrospectif et aux réactions répétées décrites dans le contexte.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce dont ils se souvenaient, et non une proposition causale.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le terme désigne ici au singulier le Dieu d’Israël.
- source_word: צוּרָם
  choice: leur rocher
  rationale: La traduction directe conserve la métaphore de Dieu comme appui ferme, refuge et force. La minuscule évite d’ajouter une interprétation typographique absente de l’hébreu.
- source_word: וְאֵל
  choice: et que Dieu
  rationale: אֵל est ici un titre divin parallèle à אֱלֹהִים. Le traduire par « Dieu » préserve le parallélisme sans introduire la translittération « El ».
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: « Le Très-Haut » est le rendu français naturel et consacré de l’épithète divine עֶלְיוֹן; l’apposition rend clairement le rapport avec « Dieu ».
- source_word: גֹּאֲלָם
  choice: leur rédempteur
  rationale: Le nom participial issu de גאל désigne celui qui rachète ou délivre. « Rédempteur » conserve cette forme nominale et sa portée théologique sans préciser indûment le rôle juridique d’un parent proche.
theological_decisions:
- issue: Traduction des titres divins parallèles אֱלֹהִים … וְאֵל עֶלְיוֹן
  choice: « Dieu … et Dieu, le Très-Haut »
  alternative: « Dieu … et le Dieu Très-Haut » ou « Dieu … et El, le Très-Haut »
  rationale: Les deux membres poétiques désignent le même Dieu. La répétition de « Dieu » maintient le parallélisme; l’apposition « le Très-Haut » est idiomatique en français et évite de suggérer deux êtres distincts. Le titre אֵל est traduit plutôt que translittéré.
- issue: Portée de גֹּאֲלָם
  choice: « leur rédempteur »
  alternative: « celui qui les délivrait » ou « leur parent rédempteur »
  rationale: « Rédempteur » préserve à la fois l’image du rachat et la forme nominale, sans réduire le terme à une délivrance générale ni importer le cadre juridique plus précis du parent ayant droit de rachat.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple; les métaphores « rocher » et « rédempteur » sont conservées. La reprise de « que » et du verbe « était » rend les deux prédications naturelles et explicites en français.
