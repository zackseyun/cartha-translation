id: PSA.78.24
reference: Psalms 78:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּמְטֵ֬ר עֲלֵי/הֶ֣ם מָ֣ן לֶ/אֱכֹ֑ל וּ/דְגַן שָׁ֝מַ֗יִם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/024.yaml
  text: He rained down manna on them to eat[a], and gave them the grain of heaven.
translation:
  language: fr
  text: Il fit pleuvoir sur eux de la manne pour qu’ils en mangent, et leur donna le grain du ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grain des cieux ». L’expression décrit poétiquement la manne ; dans une traduction plus interprétative, elle peut être rendue par « la nourriture venue du ciel » ou « le pain du ciel ».
    reason: Variante lexicale et explication de la métaphore poétique.
lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: Il fit pleuvoir
  rationale: La forme causative du verbe מטר signifie « faire pleuvoir ». Cette tournure française conserve à la fois l’image et la valeur causative.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: 'La préposition על avec suffixe pronominal exprime ici la direction : la manne tombe sur le peuple.'
- source_word: מָן
  choice: de la manne
  rationale: « Manne » est la forme française traditionnelle et courante qui désigne cette nourriture du désert.
- source_word: לֶאֱכֹל
  choice: pour qu’ils en mangent
  rationale: L’infinitif avec ל exprime le but. Cette formulation naturelle précise que la manne leur est destinée comme nourriture sans ajouter d’interprétation.
- source_word: דְגַן
  choice: le grain
  rationale: דגן désigne le grain ou les céréales. « Le grain » préserve ici la métaphore poétique et la valeur collective du terme.
- source_word: שָׁמַיִם
  choice: du ciel
  rationale: Dans cette construction poétique, « du ciel » est idiomatique en français et garde l’idée d’une provenance céleste. Le pluriel morphologique hébreu peut aussi être rendu par « des cieux ».
- source_word: נָתַן
  choice: donna
  rationale: Le verbe נתן signifie simplement « donner » ; « donna » en conserve la sobriété et le parallélisme.
- source_word: לָמוֹ
  choice: leur
  rationale: Cette forme pronominale poétique signifie « à eux » ; le pronom complément « leur » est la formulation française naturelle.
theological_decisions:
- issue: Description métaphorique de la manne comme « grain du ciel »
  choice: Conserver la métaphore poétique « le grain du ciel ».
  alternative: « la nourriture venue du ciel » ou « le pain du ciel »
  rationale: Le texte hébreu emploie דגן, « grain », en parallèle avec la manne. Garder cette image évite de la remplacer par une explication ou d’importer la formulation « pain du ciel » d’autres contextes.
translation_notes:
  register: Français international actuel, clair et digne. « Il fit pleuvoir » maintient l’image poétique et le causatif hébreu ; « pour qu’ils en mangent » évite la tournure moins naturelle « à manger » tout en conservant l’idée de but.
