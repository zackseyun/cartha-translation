  text: He made it fall in the midst of their camp[a], all around their dwellings.
translation:
  language: fr
  text: Il les fit tomber au milieu de leur camp[a], tout autour de leurs habitations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son camp » et « ses habitations » ; les suffixes au singulier renvoient vraisemblablement à Israël considéré comme un peuple, d’où « leur » et « leurs » dans la traduction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל
  choice: Il les fit tomber
  rationale: Le hifil de נפל exprime la causation. Le pronom « les » reprend naturellement les oiseaux mentionnés au verset précédent et convient au français, qui exige ici d’en expliciter le genre et le nombre.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: L’expression indique une localisation à l’intérieur du camp et conserve la force spatiale du texte hébreu.
- source_word: מַחֲנֵהוּ
  choice: leur camp
  rationale: Le suffixe hébreu est morphologiquement au singulier (« son camp »), mais renvoie vraisemblablement à Israël comme collectivité ; le possessif pluriel est naturel en français.
- source_word: סָבִיב
  choice: tout autour de
  rationale: Cette formulation rend l’idée d’une distribution environnante et étendue.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: de leurs habitations
  rationale: מִשְׁכָּן désigne ici les lieux où le peuple demeure. « Habitations » reste plus large et plus précis que « tentes » ; « leurs » rend idiomatiquement la référence collective.
