  naturalness: « Il choisit David, son serviteur, et le prit des enclos à moutons » est naturel dans un registre biblique moderne et conserve le parallélisme concis. La répétition de « des » est idiomatique ici.
  terminology: « Serviteur » convient pour עַבְדּוֹ dans cette désignation honorifique. « Enclos à moutons » est une expression française claire pour מִכְלְאֹת צֹאן, tout en reconnaissant que צֹאן peut inclure des chèvres; la note conserve cette latitude.
