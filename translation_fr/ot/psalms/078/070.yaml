  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: fr
  text: 'Il choisit David, son serviteur,

    et le prit des enclos à moutons[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des parcs » ou « des enclos pour le petit bétail ».
    reason: 'Alternative lexicale : מִכְלְאֹת désigne des lieux clos, et צֹאן peut inclure les moutons et les chèvres.'
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Il choisit
  rationale: Le wayyiqtol qal de בחר exprime ici l’action narrative passée. « Il choisit » est naturel et conserve la portée du verbe sans explicitation théologique supplémentaire.
- source_word: בְּדָוִד
  choice: David
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: עבד peut désigner un serviteur ou un esclave. Dans ce contexte, le terme caractérise honorifiquement David dans sa relation à Dieu plutôt qu’il ne souligne une condition juridique d’esclave.
- source_word: וַיִּקָּחֵהוּ
  choice: et le prit
  rationale: לקח signifie couramment « prendre ». Cette formulation directe respecte l’enchaînement hébreu et prépare le passage de David de la garde du troupeau à sa fonction royale.
- source_word: מִמִּכְלְאֹת
  choice: dans les enclos
  rationale: Le nom désigne des lieux clos où l’on garde des animaux. Avec צאן, « enclos à moutons » est une formulation française claire et concrète.
- source_word: צֹאן
  choice: à moutons
  rationale: צאן désigne le petit bétail, notamment les moutons et les chèvres. Dans cette collocation, « enclos à moutons » rend naturellement l’image pastorale, tandis qu’une note signale l’expression plus générale possible.
theological_decisions:
- issue: Statut de David comme עבד de Dieu
  choice: son serviteur
  alternative: son esclave
  rationale: Le texte affirme que David appartient à Dieu et le sert, mais le contexte met en avant sa désignation honorifique et sa mission, non sa condition servile. « Serviteur » convient donc mieux tout en maintenant sa subordination à Dieu.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme est conservé sur deux lignes. « Enclos à moutons » privilégie la clarté immédiate, avec une note pour préserver l’étendue lexicale de l’hébreu.
