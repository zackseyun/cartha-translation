id: PSA.78.7
reference: Psalms 78:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָשִׂ֥ימוּ בֵֽ/אלֹהִ֗ים כִּ֫סְלָ֥/ם וְ/לֹ֣א יִ֭שְׁכְּחוּ מַֽעַלְלֵי אֵ֑ל וּ/מִצְוֺתָ֥י/ו יִנְצֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/007.yaml
  text: so that they might set their hope in God and not forget the deeds of God[b][a], but keep his commandments.
translation:
  language: fr
  text: afin qu’ils mettent leur espérance en Dieu, qu’ils n’oublient pas les actes de Dieu[b] et qu’ils gardent ses commandements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou «les œuvres de Dieu» ou «les actions de Dieu».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׂימוּ בֵאלֹהִים כִּסְלָם
  choice: afin qu’ils mettent leur espérance en Dieu
  rationale: La suite des imparfaits prolonge le but exprimé au verset précédent. כֶּסֶל désigne ici une confiance assurée ou une espérance placée en Dieu; «mettre leur espérance en Dieu» est naturel en français moderne.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: qu’ils n’oublient pas
  rationale: Le qal inaccompli négatif s’intègre à la série de propositions de but sans qu’il soit nécessaire de répéter «afin».
- source_word: מַעַלְלֵי אֵל
  choice: les actes de Dieu[b]
  rationale: מַעֲלָלִים désigne des actes ou des œuvres. «Actes» rend clairement les interventions de Dieu sans ajouter une nuance absente du texte.
- source_word: וּמִצְוֺתָיו יִנְצֹרוּ
  choice: et qu’ils gardent ses commandements
  rationale: נצר signifie garder, veiller sur ou observer. Avec «commandements», «garder» conserve l’image hébraïque tout en restant idiomatique dans le registre biblique français.
theological_decisions:
- issue: Rendu parallèle de אֱלֹהִים et אֵל
  choice: Dieu dans les deux cas
  alternative: Dieu, puis «le Fort» ou «le Tout-Puissant»
  rationale: Les deux désignations divines fonctionnent ici en parallèle poétique. Les rendre toutes deux par «Dieu» évite d’introduire une distinction théologique que le verset ne souligne pas.
translation_notes:
  register: Français international moderne, clair et digne. La structure ternaire du verset est conservée. Aucune note n’est ajoutée à «espérance», car les variantes «confiance» et «assurance» n’apportent pas ici une ambiguïté assez substantielle pour justifier une note; le seul marqueur présent, [b], figure bien dans le texte.
