  text: וַ/יַּהֲפֹ֣ךְ לְ֭/דָם יְאֹרֵי/הֶ֑ם וְ֝/נֹזְלֵי/הֶ֗ם בַּל יִשְׁתָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/044.yaml
  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: fr
  text: 'Il changea leurs cours d’eau[a] en sang,

    et ils ne purent boire de leurs eaux courantes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les bras et les canaux du Nil » ; dans un contexte égyptien, le terme hébreu désigne souvent le Nil ou les cours d’eau qui en dépendent.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et leurs eaux courantes, ils ne pouvaient les boire ».'
    reason: source_structure
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: Il changea
  rationale: Le verbe הפך exprime ici le passage d’un état à un autre. « Changea … en » est naturel en français et garde le sens de transformation.
- source_word: לְדָם
  choice: en sang
  rationale: La préposition לְ indique l’état résultant; après « changer », le français idiomatique demande « en sang ».
- source_word: יְאֹרֵיהֶם
  choice: leurs cours d’eau
  rationale: יְאֹר désigne souvent le Nil ou ses canaux dans un contexte égyptien. « Cours d’eau » reste compréhensible et suffisamment large, tandis qu’une note signale la référence possible aux bras et canaux du Nil.
- source_word: וְנֹזְלֵיהֶם
  choice: de leurs eaux courantes
  rationale: Le terme, formé sur נזל (« couler »), désigne ce qui coule. « Eaux courantes » préserve cette image et fonctionne naturellement comme complément de « boire ».
- source_word: בַּל יִשְׁתָּיוּן
  choice: ils ne purent boire
  rationale: La particule poétique בַּל nie l’action; dans ce contexte, l’imparfait verbal exprime l’impossibilité produite par la transformation des eaux. Le passé simple convient au registre narratif et poétique du psaume.
