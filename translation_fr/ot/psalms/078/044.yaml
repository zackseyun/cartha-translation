translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme hébreu est rendu en deux lignes selon la césure massorétique; la seconde est reformulée légèrement pour éviter en français une dislocation lourde, sans effacer la mise en relief des eaux devenues imbuvables.
