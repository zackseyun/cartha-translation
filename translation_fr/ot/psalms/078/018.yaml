  text: וַ/יְנַסּוּ אֵ֥ל בִּ/לְבָבָ֑/ם לִֽ/שְׁאָל אֹ֥כֶל לְ/נַפְשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/018.yaml
  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: fr
  text: Ils mirent Dieu à l’épreuve dans leur cœur en demandant de la nourriture pour eux-mêmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour leur nèfèsh ». Le mot hébreu peut désigner la personne elle-même, la vie ou l’appétit. Ici, on peut aussi comprendre : « en demandant de la nourriture pour satisfaire leur appétit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: ils mirent à l’épreuve
  rationale: 'Le piel de נסה signifie ici « mettre à l’épreuve » : le peuple défie Dieu et cherche à éprouver sa capacité ou sa fidélité. Cette formulation est plus précise que « tenter », qui pourrait suggérer qu’ils cherchent à l’entraîner au mal.'
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici un titre divin courant. « Dieu » est la formulation française la plus claire et naturelle.
- source_word: בִּלְבָבָם
  choice: dans leur cœur
  rationale: La forme hébraïque est au singulier avec un suffixe pluriel, littéralement « dans leur cœur ». Le français permet cet emploi distributif, qui conserve aussi la représentation collective de la disposition intérieure du peuple.
- source_word: לִשְׁאָל
  choice: en demandant
  rationale: 'Dans ce contexte, l’infinitif précédé de ל indique le moyen ou la manière : ils mettent Dieu à l’épreuve en formulant leur demande.'
- source_word: אֹכֶל
  choice: de la nourriture
  rationale: אֹכֶל désigne la nourriture en général. Rien dans ce verset ne justifie de restreindre le sens à « pain ».
- source_word: לְנַפְשָׁם
  choice: pour eux-mêmes
  rationale: נֶפֶשׁ peut désigner la personne elle-même, la vie ou l’appétit. « Pour eux-mêmes » reste proche de l’expression hébraïque et produit un français naturel, tandis que la note signale le sens contextuel possible d’« appétit ».
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un contexte de désir de nourriture
  choice: pour eux-mêmes
  alternative: pour satisfaire leur appétit
  rationale: Le contexte favorise l’idée d’appétit ou de désir, mais le nom peut aussi renvoyer aux personnes elles-mêmes. Le texte principal conserve cette amplitude sans introduire le verbe explicatif « satisfaire »; la note rend visible l’interprétation contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Mettre Dieu à l’épreuve » est idiomatique et précis; « dans leur cœur » préserve l’image hébraïque et sa forme collective.
