base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/055.yaml
  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: fr
  text: Il chassa des nations devant eux, leur attribua, au cordeau, un héritage[a], et installa les tribus d’Israël dans les tentes de ces nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu évoque littéralement ce qui « tombe » ou est attribué au cordeau comme héritage. La construction peut aussi se comprendre ainsi : « il les répartit au cordeau comme héritage », le pronom renvoyant alors aux nations.'
    reason: ambiguïté_lexicale_et_syntaxique
  - marker: b
    text: 'Ou : « dans les habitations de ces nations » ; littéralement : « dans leurs tentes ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: Il chassa
  rationale: Le verbe גרש exprime l’action de chasser ou d’expulser. « Chassa » restitue directement la force du terme sans préciser un moyen que le texte ne donne pas.
- source_word: מִפְּנֵיהֶם
  choice: devant eux
  rationale: Cette expression signifie littéralement « de devant eux » et indique que les nations furent écartées sur le passage d’Israël.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans ce contexte, גּוֹיִם désigne les peuples non israélites du pays. « Nations » reste clair et ne lui impose pas le sens religieux que pourrait suggérer « païens ».
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: leur attribua au cordeau un territoire en héritage
  rationale: La tournure associe le verbe נפל employé dans le cadre d’une attribution, le cordeau servant à mesurer et partager le sol, et נַחֲלָה, le bien reçu en héritage. La formulation française rend ensemble l’attribution, la division mesurée et la possession foncière.
- source_word: וַיַּשְׁכֵּן
  choice: installa
  rationale: La forme causative de שכן signifie « faire habiter ». « Installa » est naturel en français et conserve cette causalité.
- source_word: בְּאָהֳלֵיהֶם
  choice: dans leurs tentes
  rationale: אֹהֶל signifie concrètement « tente », même s’il peut désigner par extension une habitation. Le choix garde l’image du texte.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: les tribus d’Israël
  rationale: Traduction directe et usuelle du groupe construit hébreu.
theological_decisions:
- issue: Agent de la conquête, du partage et de l’installation
  choice: Dieu demeure le sujet des trois verbes.
  alternative: Rendre l’action de manière impersonnelle ou présenter Israël comme l’agent principal.
  rationale: Dans la continuité du psaume, le sujet grammatical est Dieu. La traduction conserve cette attribution sans développer de conclusion doctrinale au-delà du verset.
- issue: Référent du suffixe dans וַיַּפִּילֵם
  choice: La traduction principale comprend l’expression comme l’attribution à Israël d’un territoire en héritage.
  alternative: Comprendre le suffixe comme renvoyant aux nations elles-mêmes, réparties ou données en héritage.
  rationale: Le contexte de la division du pays et de l’installation des tribus favorise l’attribution du territoire à Israël, mais la construction hébraïque est concise; la note maintient visible son autre analyse possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Au cordeau » conserve l’image concrète du partage mesuré des terres; « territoire en héritage » explicite naturellement la dimension foncière de נַחֲלָה. Les marqueurs de note suivent leur point d’ancrage dans le texte.
