revisions:
- from: Il chassa des nations devant eux, leur attribua au cordeau un territoire en héritage[a], et installa les tribus d’Israël dans leurs tentes[b].
  to: Il chassa des nations devant eux, leur attribua, au cordeau, un héritage[a], et installa les tribus d’Israël dans les tentes de ces nations[b].
  rationale: La révision évite l’ajout de « territoire » et rend plus directement l’attribution d’un héritage, tout en conservant en note l’analyse syntaxique concurrente. Elle explicite aussi que les tentes sont celles des nations chassées, afin que le français ne rattache pas à tort le possessif aux tribus d’Israël. Les deux notes restent ancrées aux expressions qu’elles expliquent.
