    text: 'L’hébreu évoque littéralement ce qui « tombe » ou est attribué au cordeau comme héritage. La construction peut aussi se comprendre ainsi : « il les répartit au cordeau comme héritage », le pronom renvoyant alors aux nations.'
    reason: ambiguïté_lexicale_et_syntaxique
  - marker: b
    text: 'Ou : « dans les habitations de ces nations » ; littéralement : « dans leurs tentes ».'
    reason: alternative_lexicale
  revision_rationale: La révision évite l’ajout de « territoire » et rend plus directement l’attribution d’un héritage, tout en conservant en note l’analyse syntaxique concurrente. Elle explicite aussi que les tentes sont celles des nations chassées, afin que le français ne rattache pas à tort le possessif aux tribus d’Israël. Les deux notes restent ancrées aux expressions qu’elles expliquent.
