source:
  edition: WLC
  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: fr
  text: Ils n’ont pas gardé l’alliance de Dieu et ont refusé de marcher selon sa loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son enseignement » : le mot hébreu torah peut désigner la loi, l’enseignement ou l’instruction de Dieu.'
    reason: alternative lexicale
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: ont gardé
  rationale: Avec « alliance », le verbe שׁמר exprime le fait de garder ou de respecter les engagements de l’alliance. « Garder » conserve le vocabulaire biblique tout en restant clair en français.
- source_word: בְּרִית אֱלֹהִים
  choice: l’alliance de Dieu
  rationale: Cette formulation rend naturellement le groupe construit hébreu et laisse entendre l’alliance établie par Dieu, sans préciser davantage une relation que le texte ne développe pas.
- source_word: וּבְתוֹרָתוֹ
  choice: selon sa loi
  rationale: תּוֹרָה peut désigner la loi, l’enseignement ou l’instruction. Dans ce contexte d’obéissance à l’alliance, « loi » rend bien sa force normative. Avec « marcher », « selon » est plus naturel en français que le calque « dans ».
- source_word: מֵאֲנוּ
  choice: ont refusé
  rationale: מאן exprime un refus délibéré ou le fait de ne pas vouloir; « ont refusé » en restitue clairement la force.
- source_word: לָלֶכֶת
  choice: de marcher
  rationale: Le sens concret de הלך, « marcher », sert ici de métaphore pour la conduite. Le conserver maintient l’image biblique sans rendre la phrase obscure.
- source_word: לֹא
  choice: n’ont pas
  rationale: La négation simple de l’hébreu est rendue par la forme négative française naturelle au passé composé.
theological_decisions:
- issue: Traduction de תּוֹרָה dans le cadre de l’alliance
  choice: loi
  alternative: enseignement ou instruction
  rationale: Le parallélisme entre garder l’alliance et marcher selon la תּוֹרָה souligne ici une obligation normative. « Loi » préserve cette dimension, tandis qu’une note maintient la portée lexicale plus large du terme.
translation_notes:
  register: Français moderne, sobre et digne. La métaphore « marcher selon » est conservée parce qu’elle reste intelligible et porte la nuance de conduite habituelle. Le marqueur de note est placé après « loi », terme auquel la note se rapporte.
