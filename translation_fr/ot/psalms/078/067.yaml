  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: fr
  text: Alors il rejeta la tente de Joseph[a] et ne choisit pas la tribu d’Éphraïm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Éphraïm était la principale tribu issue de Joseph. Le verset prépare ainsi le choix de Juda et de Sion dans la suite du psaume. On pourrait aussi traduire « il repoussa la tente de Joseph ».
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: Alors il rejeta
  rationale: Le verbe מָאַס signifie rejeter, repousser ou dédaigner. « Rejeta » exprime clairement le refus divin sans accentuer indûment l’idée de mépris; « alors » rend la progression narrative du wayyiqtol.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: la tente de Joseph
  rationale: אֹהֶל désigne littéralement une tente. L’image concrète est conservée, tout en laissant au contexte sa portée métonymique liée au lieu de résidence ou au sanctuaire associé aux tribus de Joseph.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: la tribu d’Éphraïm
  rationale: שֵׁבֶט peut désigner une tribu, un bâton ou un sceptre. Avec le nom d’Éphraïm et en parallèle avec « la tente de Joseph », « tribu » est ici le sens le plus naturel.
- source_word: לֹא בָחָר
  choice: ne choisit pas
  rationale: Cette formulation traduit directement בָּחַר et conserve le langage biblique du choix sans introduire un vocabulaire théologique plus technique.
theological_decisions:
- issue: Portée historique du rejet de Joseph et du non-choix d’Éphraïm
  choice: Conserver les désignations tribales concrètes, dans le cadre du déplacement du centre choisi vers Juda et Sion aux versets suivants.
  alternative: Comprendre explicitement Joseph et Éphraïm comme des désignations symboliques de l’ensemble du royaume du Nord.
  rationale: Le psaume présente l’histoire d’Israël au moyen d’un langage tribal concret. La traduction ne doit pas remplacer ce langage par son interprétation historique plus large, mais une note peut éclairer le rôle représentatif d’Éphraïm.
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme est maintenu, ainsi que l’image concrète de la « tente ». La note réunit l’éclairage historique et la nuance lexicale sans surcharger le verset.
