source:
  edition: WLC
  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: fr
  text: Il abandonna la demeure de Silo, la tente qu’il avait établie parmi les humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre sens possible : « la tente où il demeurait parmi les humains ».'
    reason: Le piel שִׁכֵּן peut décrire l’établissement de la tente ; dans le contexte du sanctuaire, il peut aussi être compris comme évoquant le lieu où Dieu demeurait parmi les humains.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: Il abandonna
  rationale: Le verbe נטשׁ exprime ici le fait de délaisser ou d’abandonner. « Abandonna » restitue clairement la force du retrait divin sans ajouter l’idée plus précise d’un rejet définitif.
- source_word: מִשְׁכַּן
  choice: la demeure
  rationale: מִשְׁכָּן désigne la demeure cultuelle de Dieu, le tabernacle. « Demeure » reste proche de l’image hébraïque et évite les connotations ecclésiastiques particulières que « tabernacle » peut avoir en français moderne, tout en conservant le parallélisme avec « tente ».
- source_word: שִׁלֹה
  choice: Silo
  rationale: Forme française traditionnelle et courante du nom de lieu biblique.
- source_word: אֹהֶל
  choice: la tente
  rationale: « Tente » est l’équivalent direct et naturel, et permet de distinguer אֹהֶל de מִשְׁכָּן dans le parallélisme poétique.
- source_word: שִׁכֵּן
  choice: qu’il avait dressée
  rationale: 'La forme intensive de שׁכן peut avoir un sens causatif : faire demeurer, installer ou établir. Appliqué à la tente placée parmi les humains, « dresser » est idiomatique en français et respecte la syntaxe transitive probable.'
- source_word: בָּאָדָם
  choice: parmi les humains
  rationale: אָדָם est ici collectif et générique. « Les humains » rend ce sens sans le limiter aux personnes de sexe masculin et demeure naturel en français contemporain.
theological_decisions:
- issue: Sens de שִׁכֵּן et rapport entre Dieu et la tente
  choice: La tente que Dieu avait dressée ou établie parmi les humains
  alternative: La tente où Dieu demeurait parmi les humains
  rationale: Le piel שִׁכֵּן favorise le sens causatif « installer, établir », avec אֹהֶל comme objet antéposé. Toutefois, le contexte du sanctuaire permet aussi de comprendre la phrase comme une évocation de la présence de Dieu parmi les humains. Cette possibilité théologiquement significative est conservée en note sans être imposée au texte principal.
- issue: Portée de אָדָם
  choice: les humains
  alternative: l’humanité
  rationale: Le nom singulier אָדָם a ici une valeur collective. Le pluriel français « les humains » exprime naturellement cette portée générique, tandis que « l’humanité » serait plus abstrait.
translation_notes:
  register: Français moderne, digne et poétique. « Demeure » conserve l’image cultuelle sans employer un terme devenu potentiellement confessionnel en français courant. Le passé simple convient au registre narratif du psaume, et « donc » rend la progression marquée par וַ־.
