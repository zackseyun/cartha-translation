source:
  edition: WLC
  text: וַ/יַּךְ צָרָ֥י/ו אָח֑וֹר חֶרְפַּ֥ת ע֝וֹלָ֗ם נָ֣תַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/066.yaml
  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: fr
  text: Il frappa ses adversaires par derrière[a] ; il leur infligea une honte perpétuelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il frappa ses adversaires en les repoussant ». Le mot hébreu אָחוֹר peut désigner l’arrière, ou être compris comme indiquant un mouvement vers l’arrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il frappa
  rationale: Le verbe נכה, dans cette forme narrative, décrit une action passée. « Frappa » est naturel et vigoureux, sans préciser à tort qu’ils furent tués.
- source_word: צָרָיו
  choice: ses adversaires
  rationale: Le terme désigne ceux qui s’opposent à lui, ses ennemis. « Adversaires » convient au registre poétique et reste clair en français moderne.
- source_word: אָחוֹר
  choice: et les fit reculer
  rationale: Pris adverbialement, אָחוֹר indique un mouvement vers l’arrière. Cette formulation française naturelle rend l’image sans conserver une tournure maladroite.
- source_word: חֶרְפַּת עוֹלָם
  choice: une honte durable
  rationale: La construction exprime une honte publique qui se prolonge. « Durable » rend ici עוֹלָם sans imposer nécessairement l’idée métaphysique d’une éternité absolue.
- source_word: נָתַן לָמוֹ
  choice: il les couvrit de
  rationale: נתן avec ל peut exprimer le fait d’imposer ou d’infliger quelque chose. « Couvrir de honte » est idiomatique en français et restitue ce sens.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. La traduction principale privilégie la lecture adverbiale de אָחוֹר, tout en conservant dans une note l’autre analyse possible.
