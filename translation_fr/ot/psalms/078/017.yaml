  text: וַ/יּוֹסִ֣יפוּ ע֭וֹד לַ/חֲטֹא ל֑/וֹ לַֽ/מְר֥וֹת עֶ֝לְי֗וֹן בַּ/צִּיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/017.yaml
  text: Yet they continued to sin against him[a], rebelling against the Most High in the dry land.
translation:
  language: fr
  text: Mais ils continuèrent à pécher contre lui, se révoltant contre le Très-Haut en terre aride.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Mais ils continuèrent
  rationale: La construction avec יסף à l’inaccompli consécutif suivi de עוד et de l’infinitif exprime la poursuite répétée de l’action. « Mais » fait ressortir le contraste avec les bienfaits divins évoqués dans le contexte, tandis que « continuèrent » porte l’idée de persistance.
- source_word: לַחֲטֹא לוֹ
  choice: à pécher contre lui
  rationale: Avec le complément introduit par ל, חטא désigne ici le fait de pécher contre quelqu’un. Le pronom renvoie naturellement à Dieu dans le contexte.
- source_word: לַמְרוֹת
  choice: se révoltant contre
  rationale: 'L’infinitif de מרה précise la nature ou la manière de leur péché : une désobéissance rebelle. Le participe présent français relie naturellement cette précision à la proposition principale.'
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Titre divin traditionnel et transparent en français, qui conserve l’idée de suprématie exprimée par l’hébreu.
- source_word: בַּצִּיָּה
  choice: dans la terre aride
  rationale: צִיָּה désigne un lieu sec, desséché ou aride. « Terre aride » conserve cette précision lexicale plutôt que de généraliser en « désert ».
theological_decisions:
- issue: Rendu du titre divin עֶלְיוֹן
  choice: le Très-Haut
  alternative: le Dieu Très-Haut
  rationale: Le texte porte uniquement le titre עֶלְיוֹן. « Le Très-Haut » en préserve la forme concise et la portée théologique sans ajouter explicitement « Dieu ».
translation_notes:
  register: Français moderne, digne et courant. La formulation reste proche de la structure poétique hébraïque tout en évitant le littéralisme maladroit. Aucun appel de note n’est nécessaire, car « terre aride » rend directement la valeur propre de צִיָּה.
