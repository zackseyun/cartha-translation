source:
  edition: WLC
  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: fr
  text: afin qu’une génération future le sache, que les enfants qui naîtront se lèvent et le racontent à leurs enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat visé et se combine naturellement avec le subjonctif en français.
- source_word: יֵדְעוּ
  choice: le sache
  rationale: Le subjonctif après « afin que » exprime la visée du texte; le pronom « le » reprend naturellement l’enseignement établi dans le contexte précédent.
- source_word: דּוֹר אַחֲרוֹן
  choice: une génération future
  rationale: Désigne une génération ultérieure, sans imposer le sens eschatologique de « dernière génération ».
- source_word: בָּנִים יִוָּלֵדוּ
  choice: les enfants qui naîtraient
  rationale: Rend le passif inaccompli et la perspective future; « enfants » exprime ici la descendance sans la limiter aux garçons.
- source_word: יָקֻמוּ
  choice: qu’ils se lèvent
  rationale: Conserve l’image vive de קום et évoque leur entrée en action dans la succession des générations.
- source_word: וִיסַפְּרוּ
  choice: et le racontent
  rationale: ספר désigne ici la transmission orale de ce qui a été reçu; « raconter » est naturel et suffisamment ample dans ce contexte.
- source_word: לִבְנֵיהֶם
  choice: à leurs enfants
  rationale: Le masculin hébreu désigne ici de façon générique les descendants de la génération suivante.
theological_decisions:
- issue: Langage masculin relatif à la descendance (בָּנִים / לִבְנֵיהֶם)
  choice: « les enfants » / « à leurs enfants »
  alternative: « les fils » / « à leurs fils »
  rationale: Dans ce contexte de transmission entre générations, les pluriels masculins hébreux désignent la descendance de manière générique; la traduction ne doit pas restreindre indûment le propos aux garçons.
- issue: Référent de יֵדְעוּ et וִיסַפְּרוּ
  choice: Employer le pronom « le »
  alternative: Laisser les verbes sans complément explicite ou répéter « ces choses »
  rationale: Le français demande ici un complément plus explicite que l’hébreu. « Le » renvoie sobrement au témoignage et à la loi mentionnés dans le contexte, sans réduire leur contenu à une seule notion.
translation_notes:
  register: Français international moderne, digne et fluide. La syntaxe conserve l’apposition « les enfants qui naîtraient » et la chaîne de transmission entre générations, sans donner à אַחֲרוֹן un sens eschatologique.
