  text: וְ/אַ֤ף אֱלֹהִ֨ים עָ֘לָ֤ה בָ/הֶ֗ם וַֽ֭/יַּהֲרֹג בְּ/מִשְׁמַנֵּי/הֶ֑ם וּ/בַחוּרֵ֖י יִשְׂרָאֵ֣ל הִכְרִֽיעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: fr
  text: Alors la colère de Dieu s’éleva contre eux ; il tua les plus robustes[a] parmi eux et abattit les jeunes hommes d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leurs gras » ; l’expression désigne probablement les hommes les plus robustes ou les mieux nourris parmi eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף
  choice: Alors la colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. « Alors » rend la progression narrative portée par וְ.
- source_word: אֱלֹהִים
  choice: de Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne le Dieu d’Israël.
- source_word: עָלָה בָהֶם
  choice: s’éleva contre eux
  rationale: Cette formulation conserve l’image hébraïque d’une colère qui monte, tandis que « contre eux » exprime naturellement l’orientation hostile indiquée par ב.
- source_word: וַיַּהֲרֹג
  choice: il tua
  rationale: Traduction directe, actuelle et non euphémisée de הרג.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: les plus robustes parmi eux
  rationale: Le terme, formé sur la notion de graisse, désigne ici vraisemblablement les hommes bien nourris, vigoureux ou de choix. « Les plus robustes » communique ce sens probable sans imposer l’image littérale comme seule interprétation ; celle-ci est signalée en note.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: les jeunes hommes d’Israël
  rationale: בָּחוּר désigne couramment un jeune homme dans la force de l’âge, parfois avec une nuance militaire.
- source_word: הִכְרִיעַ
  choice: abattit
  rationale: Le hifil de כרע signifie faire plier ou tomber. « Abattit » convient au parallélisme avec « tua » et conserve l’idée de faire tomber sous le jugement.
theological_decisions:
- issue: Expression anthropopathique de la colère divine
  choice: la colère de Dieu s’éleva contre eux
  alternative: Dieu se mit en colère contre eux
  rationale: Le choix retenu préserve l’image hébraïque de la colère qui monte au lieu de la réduire à une simple paraphrase psychologique.
- issue: Portée de ב dans עָלָה בָהֶם
  choice: contre eux
  alternative: parmi eux
  rationale: Le contexte immédiat de mise à mort favorise le sens hostile « contre eux », tout en reconnaissant que la préposition peut, dans d’autres contextes, avoir une valeur locale.
translation_notes:
  register: Français international moderne, sobre et poétique. Le passé simple convient au registre narratif des Psaumes. Le point-virgule marque le passage de la montée de la colère à l’action judiciaire sans alourdir la phrase.
