source:
  edition: WLC
  text: וַ/יִּקַ֖ץ כְּ/יָשֵׁ֥ן אֲדֹנָ֑/י כְּ֝/גִבּ֗וֹר מִתְרוֹנֵ֥ן מִ/יָּֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/065.yaml
  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: fr
  text: Alors le Seigneur s’éveilla comme un homme qui dormait, comme un guerrier qui pousse des cris sous l’effet du vin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un héros qui exulte à cause du vin » ou « comme un homme vaillant qui crie, stimulé par le vin ».
    reason: 'Alternative lexicale : מִתְרוֹנֵן peut évoquer un cri jubilant ou triomphant, tandis que גִּבּוֹר peut se rendre par « héros », « guerrier » ou « homme vaillant ».'
lexical_decisions:
- source_word: וַיִּקַץ
  choice: s’éveilla
  rationale: Le verbe יקץ signifie se réveiller ou sortir du sommeil. « S’éveilla » est naturel et conserve l’image poétique.
- source_word: כְּיָשֵׁן
  choice: comme un homme qui dormait
  rationale: La préposition כְּ marque une comparaison, et יָשֵׁן désigne ici quelqu’un qui dort. Cette formulation maintient explicitement le caractère figuré de l’image.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, et non du tétragramme ; « le Seigneur » est donc la distinction appropriée en français.
- source_word: כְּגִבּוֹר
  choice: comme un guerrier
  rationale: גִּבּוֹר peut désigner un homme fort, un héros ou un vaillant guerrier. « Guerrier » convient au contexte martial et rend l’image avec vigueur.
- source_word: מִתְרוֹנֵן
  choice: qui pousse des cris
  rationale: Ce participe exprime un cri sonore, éventuellement joyeux ou triomphant. « Pousse des cris » préserve cette force sans imposer une émotion précise.
- source_word: מִיָּיִן
  choice: sous l’effet du vin
  rationale: 'La préposition מִן peut ici indiquer la cause ou l’influence : le vin provoque ou stimule les cris du guerrier. Cette expression est idiomatique en français tout en conservant l’image audacieuse.'
theological_decisions:
- issue: Représentation anthropomorphique de Dieu qui s’éveille et comparaison avec un guerrier stimulé par le vin
  choice: Conserver sans l’atténuer la double comparaison poétique.
  alternative: Reformuler pour exclure l’idée de sommeil ou interpréter le vin comme une métaphore indépendante.
  rationale: Le psaume décrit par une image hardie l’intervention décisive du Seigneur après une période d’apparente inaction. La traduction doit préserver cette tension théologique et la force littéraire du texte.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe parallèle reproduit les deux comparaisons hébraïques ; le vocabulaire reste concret et poétique sans expliquer ni adoucir l’anthropomorphisme.
