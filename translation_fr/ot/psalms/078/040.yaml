  text: כַּ֭/מָּה יַמְר֣וּ/הוּ בַ/מִּדְבָּ֑ר יַ֝עֲצִיב֗וּ/הוּ בִּֽ/ישִׁימֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/040.yaml
  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: fr
  text: Combien de fois se sont-ils révoltés contre lui dans le désert[a] et lui ont-ils causé de la peine dans la terre désolée[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que de fois ils se sont révoltés contre lui dans le désert ! » L’expression initiale peut souligner la répétition des actes de rébellion.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’ont attristé », « l’ont affligé » ou « l’ont irrité » dans la terre désolée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Combien de fois
  rationale: Dans cette exclamation rétrospective, l’expression souligne la répétition des actes plutôt qu’une demande de nombre précis.
- source_word: יַמְרוּהוּ
  choice: ils se sont révoltés contre lui
  rationale: Le verbe מרה exprime ici la rébellion ou l’insoumission envers Dieu; cette formulation en rend clairement la force.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne la région désertique où Israël a erré; « désert » est naturel et géographiquement approprié en français.
- source_word: יַעֲצִיבוּהוּ
  choice: et l’ont attristé
  rationale: Le hiphil de עצב évoque le fait de causer peine, douleur ou affliction. « L’ont attristé » conserve la dimension relationnelle et affective du texte.
- source_word: בִּישִׁימוֹן
  choice: dans la terre aride
  rationale: יְשִׁימוֹן désigne un lieu désolé et aride. Cette expression le distingue de מִדְבָּר tout en maintenant le parallélisme poétique.
theological_decisions:
- issue: Langage anthropopathique appliqué à Dieu dans יַעֲצִיבוּהוּ
  choice: Conserver dans le texte principal l’expression personnelle et affective « l’ont attristé ».
  alternative: « lui ont causé de la peine » ou « l’ont irrité »
  rationale: L’hébreu présente les actes d’Israël comme causant à Dieu une véritable peine relationnelle. La traduction préserve cette tension au lieu de la réduire à une réaction impersonnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre מִדְבָּר et יְשִׁימוֹן est rendu par « désert » et « terre aride », deux expressions proches mais distinctes.
