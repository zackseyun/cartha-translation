lexical_decisions:
- source_word: נֶגֶד
  choice: Sous les yeux de
  rationale: La préposition exprime ici la présence visible des témoins. « Sous les yeux de » rend naturellement en français l’idée que les actes furent accomplis en leur présence.
- source_word: אֲבוֹתָם
  choice: leurs pères
  rationale: Le terme signifie littéralement « leurs pères » et désigne ici les générations antérieures d’Israël. Cette formulation conserve l’expression familiale et historique de l’hébreu.
- source_word: עָשָׂה פֶלֶא
  choice: il accomplit des prodiges
  rationale: Le verbe courant « faire » associé à פֶלֶא forme une expression signifiant accomplir des actes extraordinaires. Le pluriel français convient à la valeur collective du singulier hébreu dans le contexte des événements d’Égypte.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: au pays d’Égypte
  rationale: Cette formulation garde la mention explicite du « pays » tout en restant idiomatique en français moderne.
- source_word: שְׂדֵה צֹעַן
  choice: dans la campagne de Tsoân
  rationale: Le singulier hébreu « champ de Tsoân » peut désigner le territoire rural ou la région environnant la ville. « Campagne » préserve cette image géographique sans imposer artificiellement un champ unique.
