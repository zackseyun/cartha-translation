  text: Before their fathers he did wonders in the land of Egypt[b][a], in the fields of Zoan.
translation:
  language: fr
  text: Sous les yeux de leurs pères, il accomplit des prodiges au pays d’Égypte, dans la campagne de Tsoân[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « dans le champ de Tsoân », expression qui désigne probablement la campagne ou la région autour de Tsoân.'
