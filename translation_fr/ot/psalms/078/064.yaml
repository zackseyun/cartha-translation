  text: כֹּ֭הֲנָי/ו בַּ/חֶ֣רֶב נָפָ֑לוּ וְ֝/אַלְמְנֹתָ֗י/ו לֹ֣א תִבְכֶּֽינָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: fr
  text: Ses prêtres tombèrent sous l’épée, et ses veuves ne pleurèrent pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne purent pas pleurer ». L’hébreu dit littéralement « ne pleurèrent pas »; il peut s’agir d’un simple constat ou de l’idée que le désastre ne laissa aucune possibilité d’accomplir les lamentations funèbres habituelles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: ses prêtres
  rationale: כֹּהֵן désigne normalement un prêtre. Ce choix conserve la fonction cultuelle propre à Israël sans l’élargir de façon interprétative à de simples « serviteurs ».
- source_word: בַּחֶרֶב
  choice: sous l’épée
  rationale: La préposition בְּ marque ici le moyen de la mort violente. « Tomber sous l’épée » est une expression française naturelle qui préserve l’image hébraïque.
- source_word: נָפָלוּ
  choice: tombèrent
  rationale: Le verbe נפל signifie littéralement « tomber » et, associé à l’épée, évoque clairement la mort au combat sans expliciter davantage que le texte.
- source_word: וְאַלְמְנֹתָיו
  choice: et ses veuves
  rationale: Le suffixe possessif est au masculin singulier. « Ses » respecte cette forme tout en restant naturel en français; le référent collectif demeure celui du contexte.
- source_word: לֹא תִבְכֶּינָה
  choice: ne pleurèrent pas
  rationale: Cette traduction rend directement la négation et le verbe « pleurer ». Elle évite d’inscrire dans le texte principal l’interprétation possible selon laquelle les veuves n’avaient ni la possibilité ni l’occasion d’accomplir le deuil.
theological_decisions:
- issue: Sens de l’absence de pleurs chez les veuves
  choice: Le texte principal énonce sobrement qu’elles ne pleurèrent pas.
  alternative: « Elles ne purent pas pleurer », au sens où l’ampleur du désastre empêcha les lamentations funèbres habituelles.
  rationale: L’hébreu dit formellement « ne pleurèrent pas » et ne marque pas explicitement l’incapacité. Le contexte peut toutefois suggérer que la catastrophe ne laissa aucune possibilité de faire son deuil; cette nuance est donc conservée en note plutôt qu’imposée dans le texte.
translation_notes:
  register: Français moderne, sobre et poétique. « Tombèrent sous l’épée » conserve l’image biblique dans une tournure idiomatique; la syntaxe parallèle et concise reflète celle du vers hébreu.
