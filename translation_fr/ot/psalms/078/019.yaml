reference: Psalms 78:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ/יְדַבְּר֗וּ בֵּֽ/אלֹ֫הִ֥ים אָ֭מְרוּ הֲ/י֣וּכַל אֵ֑ל לַ/עֲרֹ֥ךְ שֻׁ֝לְחָ֗ן בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/019.yaml
  text: They spoke against God; they said[a], “Can God prepare a table in the wilderness?”
translation:
  language: fr
  text: 'Ils parlèrent contre Dieu ; ils dirent[a] : « Dieu peut-il dresser une table dans le désert ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parlèrent au sujet de Dieu ». La construction hébraïque peut avoir un sens plus neutre, mais le contexte favorise ici le sens adversatif et souligne la plainte d’Israël contre Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: Ils parlèrent
  rationale: Le wayyiqtol de דבר poursuit le récit et introduit les paroles du peuple. Le passé simple convient au registre narratif biblique français sans être obscur.
- source_word: בֵּאלֹהִים
  choice: contre Dieu
  rationale: Avec דבר, la préposition ב peut prendre un sens adversatif. Le contexte de révolte et la question provocatrice favorisent « contre Dieu », tout en signalant en note la possibilité plus neutre.
- source_word: אָמְרוּ
  choice: ils dirent
  rationale: Le verbe déclaratif est rendu explicitement afin de conserver la formule hébraïque en deux temps.
- source_word: הֲיוּכַל
  choice: peut-il
  rationale: La particule interrogative jointe à יכל porte sur la capacité. « Peut-il » exprime directement la contestation de la puissance divine.
- source_word: אֵל
  choice: Dieu
  rationale: Ici, אֵל désigne Dieu parallèlement à אֱלֹהִים. « Dieu » reste clair et n'ajoute pas une nuance interprétative telle que « le Puissant ».
- source_word: לַעֲרֹךְ
  choice: dresser
  rationale: ערך associé à שֻׁלְחָן signifie disposer ou préparer une table. « Dresser une table » conserve l'image concrète et constitue une collocation française naturelle.
- source_word: שֻׁלְחָן
  choice: une table
  rationale: La traduction littérale préserve l'image du repas et de la provision sans la réduire à une paraphrase comme « un repas ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne la région inhabitée où Israël erre. En français moderne, « désert » est le terme biblique courant et ne suppose pas nécessairement une étendue uniquement sablonneuse.
theological_decisions:
- issue: Tonalité des paroles d’Israël à l’égard de Dieu
  choice: Traduire בֵּאלֹהִים par « contre Dieu »
  alternative: « au sujet de Dieu » ou « à Dieu »
  rationale: Le contexte du psaume présente l’incrédulité et la révolte d’Israël ; le sens adversatif rend cette hostilité sans ajouter au texte. La note préserve toutefois l’ambiguïté réelle de la construction hébraïque.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient la tenue narrative du psaume ; « dresser une table » conserve l’image concrète de l’hébreu. La ponctuation française et l’espace avant les deux-points et le point d’interrogation sont respectées.
