source:
  edition: WLC
  text: יְבַקַּ֣ע צֻ֭רִים בַּ/מִּדְבָּ֑ר וַ֝/יַּ֗שְׁקְ כִּ/תְהֹמ֥וֹת רַבָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/015.yaml
  text: He split rocks in the wilderness and gave them drink abundantly[a], as from the great depths.
translation:
  language: fr
  text: Il fendit des rochers dans le désert et les abreuva comme avec les eaux des profondeurs immenses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et les abreuva abondamment, comme avec les eaux des profondeurs ».'
    reason: L’intensification finale peut être rendue en français comme portant sur l’abondance de l’abreuvement, tout en conservant la comparaison avec les profondeurs.
lexical_decisions:
- source_word: יְבַקַּע
  choice: fendit
  rationale: Le piel de בקע exprime l’ouverture violente d’une masse solide. « Fendit » est vivant, précis et naturel dans ce contexte.
- source_word: צֻרִים
  choice: des rochers
  rationale: Le pluriel désigne de grandes masses rocheuses; « rochers » en conserve à la fois le nombre et la force visuelle.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici la région désertique traversée par Israël. « Désert » est clair en français moderne sans imposer une précision géographique supplémentaire.
- source_word: וַיַּשְׁקְ
  choice: leur donna à boire
  rationale: Le hiphil de שׁקה signifie « faire boire, donner à boire ». Le complément « leur », implicite en hébreu mais fourni par le contexte, est nécessaire à une formulation française naturelle.
- source_word: כִּתְהֹמוֹת
  choice: comme si l’eau venait des grandes profondeurs
  rationale: Le préfixe כ marque la comparaison, tandis que le pluriel תְּהֹמוֹת évoque les eaux profondes ou les abîmes. Cette formulation française rend explicitement l’image sans affirmer l’existence de réservoirs souterrains précis.
- source_word: רַבָּה
  choice: en abondance / grandes
  rationale: La forme intensifie l’ampleur de l’eau donnée ou des profondeurs évoquées. La traduction répartit cette nuance entre « en abondance » et « grandes », conformément à l’ambiguïté syntaxique du texte poétique.
theological_decisions:
- issue: Nature de l’image des eaux profondes
  choice: 'Conserver une comparaison : « comme si l’eau venait des grandes profondeurs »'
  alternative: Comprendre que l’eau provenait littéralement d’un immense abîme
  rationale: Le כ hébreu introduit normalement une comparaison. Le texte célèbre l’abondance miraculeuse de l’eau sans obliger la traduction à préciser une cosmologie ou un mécanisme souterrain.
- issue: Rattachement de רַבָּה
  choice: Exprimer à la fois l’abondance de la boisson et la grandeur des profondeurs
  alternative: 'Rattacher exclusivement le terme aux profondeurs : « les vastes profondeurs »'
  rationale: La construction poétique permet une nuance d’abondance portant sur l’acte d’abreuver ou sur l’image des eaux profondes. Le texte principal conserve les deux résonances; la note signale une traduction plus formelle.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le passé simple convient au registre narratif du psaume; « fendit » et « grandes profondeurs » maintiennent la vigueur et l’ampleur de l’image hébraïque.
