  revision_rationale: La révision remplace une paraphrase hypothétique par une comparaison directe, plus fidèle à la syntaxe et à l’imagerie hébraïques. Elle conserve le pluriel imagé des profondeurs, l’action causative d’abreuver et l’intensité de l’eau fournie, sans imposer une interprétation cosmologique.
