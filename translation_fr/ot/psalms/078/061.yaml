source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לַ/שְּׁבִ֣י עֻזּ֑/וֹ וְֽ/תִפְאַרְתּ֥/וֹ בְ/יַד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/061.yaml
  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: fr
  text: 'Il livra sa force à la captivité[a],

    et sa splendeur aux mains de l’ennemi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sa force » peut faire allusion à l’arche, signe de la force de Dieu au milieu d’Israël.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « dans la main de l’ennemi », c’est-à-dire en son pouvoir.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Il livra
  rationale: Dans ce contexte de jugement et de prise par l’ennemi, « livra » exprime naturellement le sens de נתן sans expliciter davantage le référent poétique.
- source_word: לַשְּׁבִי
  choice: à la captivité
  rationale: שְׁבִי désigne ici la captivité ou la capture. La formulation conserve la construction concise et personnifiée de l’hébreu.
- source_word: עֻזּוֹ
  choice: sa force
  rationale: עֹז signifie « force » ou « puissance ». « Sa force » préserve la possible valeur métonymique sans identifier explicitement l’arche.
- source_word: וְתִפְאַרְתּוֹ
  choice: et sa splendeur
  rationale: תִּפְאֶרֶת peut désigner la splendeur, la gloire ou la beauté. « Splendeur » restitue le caractère magnifique et honorifique du terme.
- source_word: בְיַד
  choice: aux mains de
  rationale: L’expression idiomatique indique la remise au pouvoir de quelqu’un. Le pluriel français « aux mains de » est naturel tout en conservant l’image hébraïque de la main.
- source_word: צָר
  choice: l’ennemi
  rationale: צַר désigne l’ennemi ou l’adversaire. « L’ennemi » est clair, digne et naturel en français moderne.
theological_decisions:
- issue: Identification de « sa force » et de « sa splendeur »
  choice: Conserver les expressions poétiques sans nommer leur référent dans le texte principal
  alternative: Identifier explicitement la force et la splendeur à l’arche, au sanctuaire ou à la présence glorieuse de Dieu
  rationale: Le contexte évoque probablement la capture de l’arche, mais l’hébreu ne la nomme pas ici. La traduction maintient donc l’allusion et la tension poétique du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé. « Livra » rend le contexte de remise à l’ennemi, tandis que « à la captivité » préserve la formulation condensée et inhabituelle de l’original.
