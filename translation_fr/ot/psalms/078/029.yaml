source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: fr
  text: Ils mangèrent et furent pleinement rassasiés ; il leur apporta ce qu’ils désiraient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur désir » ou « leur convoitise ». Le nom hébreu peut désigner le désir lui-même ou ce qui est désiré.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: Ils mangèrent
  rationale: Le qal narratif de אכל est rendu par le verbe courant « manger », dans un passé narratif naturel en français.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: furent pleinement rassasiés
  rationale: שׂבע exprime le fait d’être rassasié, et מְאֹד en renforce le degré. « Pleinement rassasiés » est naturel, digne et garde l’idée d’une satiété abondante.
- source_word: תַאֲוָתָם
  choice: ce qu’ils désiraient
  rationale: תַּאֲוָה peut désigner le désir ou l’objet désiré. Dans ce contexte de nourriture accordée, la formulation concrète « ce qu’ils désiraient » est claire tout en laissant en note l’alternative abstraite.
- source_word: יָבִא לָהֶם
  choice: il leur apporta
  rationale: Le hiphil de בוא a ici le sens causatif de « faire venir, apporter ». Le complément לָהֶם se rend naturellement par « leur ».
theological_decisions:
- issue: Sujet implicite de יָבִא
  choice: « il », avec Dieu comme sujet implicite
  alternative: Une lecture impersonnelle telle que « leur désir leur vint »
  rationale: Dans le déroulement du psaume, Dieu est l’agent qui procure la nourriture. La forme hiphil de בוא favorise le sens causatif « apporter » plutôt que l’intransitif « venir », sans qu’il soit nécessaire d’ajouter explicitement le nom de Dieu.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif poétique. « Pleinement rassasiés » évite une tournure familière tout en conservant l’intensité de מְאֹד.
