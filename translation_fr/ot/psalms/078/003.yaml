lexical_decisions:
- source_word: אֲשֶׁר
  choice: ce que
  rationale: Introduit naturellement en français la proposition relative qui reprend les réalités évoquées au verset précédent.
- source_word: שָׁמַעְנוּ
  choice: nous avons entendu
  rationale: Rend directement le verbe שמע et conserve l’idée de transmission orale.
- source_word: וַנֵּדָעֵם
  choice: et connu
  rationale: Préserve le sens propre de ידע ainsi que le complément pluriel implicite dans le suffixe hébreu, repris globalement par « ce que ».
- source_word: וַאֲבוֹתֵינוּ
  choice: et nos pères
  rationale: Reproduit l’expression générationnelle du texte hébreu; dans ce contexte, « pères » désigne les générations précédentes.
- source_word: סִפְּרוּ־לָנוּ
  choice: nous ont raconté
  rationale: Rend le verbe ספר dans son sens de relater ou transmettre un récit.
