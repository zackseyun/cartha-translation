  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: fr
  text: Mais ils reculèrent et agirent en traîtres comme leurs pères ; ils se détournèrent comme un arc trompeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « comme un arc détendu » ou « comme un arc défectueux » : un arc auquel on ne peut se fier pour tirer juste.'
    reason: Alternative lexicale pour רְמִיָּה, qui peut évoquer la tromperie, le relâchement ou le défaut de fiabilité.
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: ils reculèrent
  rationale: Le verbe סוּג exprime un mouvement de recul ou l’abandon d’une voie suivie jusque-là. « Reculèrent » conserve cette image sans introduire le vocabulaire théologique plus spécialisé de l’apostasie.
- source_word: וַיִּבְגְּדוּ
  choice: agirent en traîtres
  rationale: בגד désigne une conduite perfide ou déloyale. Cette formulation garde la force morale et relationnelle du verbe sans ajouter un complément absent de l’hébreu.
- source_word: כַּאֲבוֹתָם
  choice: comme leurs pères
  rationale: L’hébreu dit explicitement « leurs pères ». Le maintien du terme familial masculin préserve la formulation et le parallèle historique du texte.
- source_word: נֶהְפְּכוּ
  choice: ils dévièrent
  rationale: Dans la comparaison avec un arc qui ne tire pas droit, « dévièrent » rend naturellement l’idée de retournement ou de déviation portée par הפך, tout en reliant clairement le comportement du peuple à l’image de l’arc.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: comme un arc trompeur
  rationale: 'רְמִיָּה peut évoquer la tromperie, le relâchement ou le manque de fiabilité. « Arc trompeur » conserve l’image métaphorique et son ambiguïté : un arc sur lequel on ne peut compter pour tirer juste.'
theological_decisions:
- issue: Portée de l’infidélité d’Israël
  choice: Employer l’expression moralement forte « agirent en traîtres » sans préciser envers qui cette trahison s’exerce.
  alternative: Expliciter « trahirent Dieu » ou « rompirent l’alliance ».
  rationale: Le contexte du psaume évoque l’infidélité envers Dieu, mais ce verset ne nomme ni l’objet de la trahison ni l’alliance. La traduction en préserve la portée sans explicitation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif et poétique du psaume. « Arc trompeur » maintient l’image concise de l’hébreu, tandis que la note en précise les autres lectures possibles.
