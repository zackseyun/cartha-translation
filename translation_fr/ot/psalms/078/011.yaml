  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: fr
  text: Ils oublièrent ses œuvres[a] et les merveilles[b] qu’il leur avait montrées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ses actes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les actes merveilleux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Ils oublièrent
  rationale: Le wayyiqtol qal, troisième personne du masculin pluriel de שׁכח, poursuit le récit au passé. Le passé simple convient au registre narratif et soutenu du psaume.
- source_word: עֲלִילוֹתָיו
  choice: ses œuvres
  rationale: עֲלִילוֹת désigne des actes accomplis. « Œuvres » est ici naturel dans un registre biblique moderne et garde la portée générale du terme; « exploits » serait trop héroïsant.
- source_word: וְנִפְלְאוֹתָיו
  choice: et les merveilles
  rationale: Le nom issu de פלא désigne des actes extraordinaires qui suscitent l’émerveillement. « Merveilles » conserve cette portée sans réduire le terme aux seuls miracles.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif introduit la proposition qui précise « les merveilles ».
- source_word: הֶרְאָם
  choice: qu’il leur avait montrées
  rationale: Le hiphil accompli de ראה avec suffixe pluriel signifie littéralement « qu’il leur avait fait voir », idiomatiquement « qu’il leur avait montrées ». Le plus-que-parfait marque naturellement l’antériorité de ces manifestations par rapport à l’oubli.
theological_decisions:
- issue: Référent des suffixes possessifs
  choice: 'Les suffixes renvoient à Dieu : « ses œuvres » et « les merveilles » qu’il a montrées.'
  alternative: Répéter explicitement « les œuvres de Dieu » et « ses merveilles ».
  rationale: Le contexte du psaume identifie clairement Dieu comme l’auteur de ces actes. Garder les pronoms reproduit la formulation hébraïque sans explicitation superflue.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif poétique; « œuvres » et « merveilles » préservent la distinction lexicale de l’hébreu. Tous les marqueurs de note figurent dans le texte.
