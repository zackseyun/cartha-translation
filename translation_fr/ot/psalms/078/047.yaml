source:
  edition: WLC
  text: יַהֲרֹ֣ג בַּ/בָּרָ֣ד גַּפְנָ֑/ם וְ֝/שִׁקְמוֹתָ֗/ם בַּֽ/חֲנָמַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/047.yaml
  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: fr
  text: 'Il détruisit leurs vignes par la grêle,

    et leurs figuiers sycomores par le gel[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par les sauterelles », « par les grêlons » ou « par le grésil » ; le terme hébreu est rare et son sens incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַהֲרֹג
  choice: détruisit
  rationale: Le verbe signifie littéralement « tuer » ou « abattre », mais, appliqué à des plantes, « détruisit » exprime naturellement en français l’effet de l’action.
- source_word: בַּבָּרָד
  choice: par la grêle
  rationale: 'La préposition ב a ici une valeur instrumentale : la grêle est le moyen par lequel les vignes sont détruites.'
- source_word: גַּפְנָם
  choice: leurs vignes
  rationale: Le nom collectif désigne les plants de vigne appartenant aux Égyptiens. « Leurs vignes » est naturel en français et ne transforme pas explicitement les plants en domaines viticoles.
- source_word: וְשִׁקְמוֹתָם
  choice: et leurs figuiers sycomores
  rationale: שִׁקְמָה désigne le figuier sycomore. Cette formulation précise l’espèce et évite la confusion moderne avec l’érable sycomore.
- source_word: בַּחֲנָמַל
  choice: par le gel
  rationale: Ce terme très rare est de sens incertain. « Le gel » convient au parallélisme avec la grêle et à la destruction des cultures, tout en exigeant une note signalant les autres interprétations possibles.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au récit poétique. La disposition en deux lignes conserve le parallélisme du vers hébreu.
