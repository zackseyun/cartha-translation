source:
  edition: WLC
  text: וַ/יְפַתּ֥וּ/הוּ בְּ/פִי/הֶ֑ם וּ֝/בִ/לְשׁוֹנָ֗/ם יְכַזְּבוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: fr
  text: Mais ils le flattaient de leur bouche[a], et de leur langue ils lui mentaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils le trompaient » ou « ils cherchaient à le séduire ». Le verbe hébreu peut avoir ces sens ; ici, il désigne probablement des paroles flatteuses et hypocrites.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: ils le flattaient
  rationale: Le piel de פתה peut exprimer l’idée de séduire, de tromper ou de chercher à gagner quelqu’un par des paroles. En parallèle avec « ils lui mentaient », « flattaient » rend ici le caractère intéressé et hypocrite de leurs propos sans affirmer que Dieu a réellement été trompé.
- source_word: בְּפִיהֶם
  choice: de leur bouche
  rationale: La préposition בְּ indique ici le moyen. La formulation conserve l’image concrète et le singulier collectif de l’hébreu.
- source_word: וּבִלְשׁוֹנָם
  choice: et de leur langue
  rationale: La traduction littérale de לָשׁוֹן préserve le parallélisme poétique entre la bouche et la langue.
- source_word: יְכַזְּבוּ
  choice: ils mentaient
  rationale: Le piel de כזב désigne directement l’action de mentir ou de parler faussement. L’imparfait français convient au contexte narratif et à l’action décrite.
- source_word: לוֹ
  choice: lui
  rationale: 'Le לְ avec suffixe marque naturellement le destinataire des paroles mensongères : ils mentaient à Dieu.'
theological_decisions:
- issue: Le verset implique-t-il que les humains ont effectivement trompé Dieu, ou qu’ils lui ont adressé des paroles trompeuses ?
  choice: Le texte décrit des paroles flatteuses et mensongères adressées à Dieu, sans déclarer qu’il a réellement été trompé.
  alternative: « Ils le trompaient » ou « ils le séduisaient »
  rationale: Le contexte dénonce la réponse hypocrite et l’infidélité d’Israël. « Ils le flattaient » maintient l’idée d’une tentative verbale intéressée tout en évitant de trancher le verset en affirmation d’une tromperie réussie.
translation_notes:
  register: Français moderne, digne et poétique. L’ordre « de leur langue ils lui mentaient » conserve le parallélisme hébreu tout en restant compréhensible ; « bouche » et « langue » sont maintenues comme images concrètes.
