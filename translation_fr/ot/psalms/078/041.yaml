base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/041.yaml
  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: fr
  text: 'Ils revinrent encore et mirent Dieu à l’épreuve,

    et provoquèrent le Saint d’Israël[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu est rare et son sens est incertain. Il peut aussi signifier « fixer une limite à » ou « marquer » le Saint d’Israël.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: De nouveau
  rationale: Le verbe שׁוב, joint à la suite narrative, exprime ici la répétition de la conduite rebelle. « De nouveau » restitue naturellement cette valeur itérative sans imposer l’idée d’un déplacement physique.
- source_word: וַיְנַסּוּ
  choice: ils mirent Dieu à l’épreuve
  rationale: נסה signifie couramment « mettre à l’épreuve, tester ». Cette tournure française rend clairement l’accusation selon laquelle le peuple défie Dieu par son incrédulité.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל désigne ici le Dieu d’Israël. « Dieu » est la formulation française la plus directe et n’ajoute pas une nuance de puissance que le contexte n’exige pas d’expliciter.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Ce titre biblique souligne à la fois la sainteté de Dieu et sa relation particulière avec Israël. La formulation retenue est concise, digne et bien établie en français.
- source_word: הִתְווּ
  choice: provoquèrent
  rationale: Ce verbe rare est de sens incertain. Dans le parallélisme avec « mirent Dieu à l’épreuve » et dans le contexte de rébellion, « provoquèrent » exprime vraisemblablement l’affront fait à Dieu, tout en signalant en note les autres analyses possibles.
theological_decisions:
- issue: Sens du verbe rare הִתְווּ
  choice: provoquèrent
  alternative: limitèrent ; marquèrent
  rationale: « Provoquèrent » convient au parallélisme et au contexte sans faire du verset une affirmation métaphysique selon laquelle les humains pourraient restreindre Dieu. Comme le lexème demeure difficile et que « limitèrent » appartient à une importante tradition de traduction, l’incertitude est explicitement conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La disposition en deux lignes respecte le parallélisme poétique. « Mettre à l’épreuve » est idiomatique et précis ; « le Saint d’Israël » conserve le poids du titre biblique traditionnel.
