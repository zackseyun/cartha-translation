  text: I will open my mouth in a parable[d][c][b][a]; I will utter riddles from of old.
translation:
  language: fr
  text: J’ouvrirai ma bouche pour prononcer une parabole[a][d] ; je ferai jaillir des énigmes[b] venues des temps anciens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour prononcer un proverbe » ou « une parole figurée ». Le mot hébreu peut désigner un proverbe, une parabole ou une parole imagée.
    reason: lexical_alternative
  - marker: b
    text: Ou « des paroles énigmatiques ».
    reason: lexical_alternative
  - marker: c
    text: Ou « depuis les temps d’autrefois ».
    reason: lexical_alternative
  - marker: d
    text: Ce verset est cité en Matthieu 13.35 à propos de Jésus parlant en paraboles.
    reason: cross_reference
lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: J’ouvrirai
  rationale: La forme poétique à la première personne exprime ici naturellement une intention tournée vers l’avenir.
- source_word: בְמָשָׁל
  choice: pour dire une parabole
  rationale: מָשָׁל peut désigner un proverbe, une parabole ou une parole figurée. Cette formulation rend la fonction de la préposition en français naturel tout en conservant le sens littéraire et figuré.
- source_word: פִּי
  choice: la bouche
  rationale: L’expression concrète « ouvrir la bouche » est idiomatique en français et reproduit fidèlement l’image hébraïque.
- source_word: אַבִּיעָה
  choice: je ferai jaillir
  rationale: Le hiphil de נבע évoque ce que l’on fait jaillir ou couler ; cette image poétique peut être conservée naturellement en français.
- source_word: חִידוֹת
  choice: des énigmes
  rationale: חִידָה désigne une énigme ou une parole énigmatique. « Énigmes » est direct, digne et compréhensible.
- source_word: מִנִּי קֶדֶם
  choice: venues des temps anciens
  rationale: La locution renvoie à l’ancienneté ou aux temps d’autrefois sans imposer l’idée absolue du commencement.
theological_decisions:
- issue: Rapport avec Matthieu 13.35 et portée de מָשָׁל / חִידוֹת
  choice: Traduire le texte hébreu selon ses propres termes par « parabole » et « énigmes » sans l’harmoniser avec la formulation de la citation grecque.
  alternative: « paroles cachées depuis les temps anciens »
  rationale: La priorité donnée au texte hébreu préserve son ambiguïté poétique et son enseignement figuré, tandis qu’une note signale le rapport intertextuel avec Matthieu.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu et l’image de la parole qui jaillit sont conservés sans rendre la syntaxe artificielle.
