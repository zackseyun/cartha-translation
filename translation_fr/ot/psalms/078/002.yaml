  source_fidelity: 'Le sens global est bien rendu : le locuteur annonce une parole figurée et énigmatique liée aux temps anciens. Toutefois, « la bouche » efface inutilement le possessif de פִּי (« ma bouche »). La préposition de בְּמָשָׁל est rendue idiomatiquement par « pour prononcer », sans prétendre qu’il s’agit d’un but théologique ou doctrinal.'
  naturalness: Le français est poétique et accessible. « J’ouvrirai ma bouche pour prononcer une parabole » est plus naturel et plus précis que « J’ouvrirai la bouche pour dire une parabole ». « Je ferai jaillir des énigmes venues des temps anciens » conserve efficacement l’image expressive du verbe hébreu.
