  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: fr
  text: Il bâtit son sanctuaire comme les hauteurs[a], comme la terre qu’il a fondée pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hauts cieux » ou « les sommets élevés ». L’expression hébraïque est poétique et peut évoquer les hauteurs célestes ou montagneuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Il bâtit
  rationale: Le wayyiqtol de בנה poursuit la séquence narrative. « Il bâtit » rend directement le verbe sans alourdir le vers poétique d’un connecteur qui n’est pas indispensable en français.
- source_word: כְּמוֹ
  choice: pareil aux
  rationale: La préposition introduit une comparaison. « Pareil aux » produit ici un parallélisme naturel et soutenu avec la seconde proposition.
- source_word: רָמִים
  choice: les hauteurs
  rationale: Le terme pluriel issu de רום évoque ce qui est élevé. « Les hauteurs » conserve l’indétermination poétique entre hauteurs célestes et reliefs élevés, sans suggérer les hauts lieux cultuels.
- source_word: מִקְדָּשׁוֹ
  choice: son sanctuaire
  rationale: מקדש désigne un lieu saint ou sanctuaire. « Son sanctuaire » reste assez large pour le référent poétique tout en convenant au contexte du lieu où Dieu demeure.
- source_word: כְּאֶרֶץ
  choice: pareil à la terre
  rationale: La terre constitue ici le second terme de comparaison et évoque une réalité solidement établie. « Terre » convient mieux que « pays » au parallélisme cosmique.
- source_word: יְסָדָהּ
  choice: qu’il a fondée
  rationale: Le verbe יסד signifie poser les fondations, fonder ou établir. « Fondée » conserve cette image, et l’accord féminin indique clairement que le suffixe renvoie à la terre.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression indique une permanence durable. « Pour toujours » est idiomatique en français moderne et garde la force poétique.
theological_decisions:
- issue: Référent et portée de la comparaison concernant le sanctuaire
  choice: Le sanctuaire de Dieu est comparé aux hauteurs, puis à la terre fondée pour toujours.
  alternative: Comprendre les hauteurs comme désignant précisément les hauts cieux, ou comme des sommets montagneux.
  rationale: L’hébreu est poétique et condensé. « Les hauteurs » préserve l’ambiguïté entre imagerie céleste et imagerie montagneuse, sans imposer une cosmologie plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme « pareil aux… pareil à… » restitue la structure comparative du vers, tandis que « fondée » maintient l’image architecturale de l’hébreu.
