  text: 'J’ai dit au SEIGNEUR : « Tu es mon Dieu. » SEIGNEUR, prête l’oreille à la voix de mes supplications !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Je dis
  rationale: Le qatal peut évoquer une déclaration prononcée, mais dans ce contexte de prière il se rend naturellement comme une affirmation actuelle, conformément à la valeur performative du propos.
- source_word: לַיהוָה / יְהוָה
  choice: au SEIGNEUR / SEIGNEUR
  rationale: Le tétragramme est rendu selon la convention française établie par « SEIGNEUR », sans introduire une vocalisation discutée du nom divin.
- source_word: הַאֲזִינָה
  choice: prête l’oreille
  rationale: Cette expression française conserve l’image concrète du verbe hébreu et son caractère d’appel pressant.
- source_word: קוֹל תַּחֲנוּנָי
  choice: la voix de mes supplications
  rationale: La formulation garde le substantif « voix » et le pluriel intensif des demandes de grâce, plutôt que de les réduire à un simple « appel ».
theological_decisions:
- issue: Identification personnelle de YHWH comme Dieu du psalmiste
  choice: « Tu es mon Dieu »
  alternative: « C’est toi, mon Dieu »
  rationale: La traduction directe préserve la confession personnelle sans ajouter d’emphase interprétative.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme de l’adresse divine est conservé, ainsi que le ton direct et suppliant du verset.
