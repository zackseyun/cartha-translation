source:
  edition: WLC
  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: fr
  text: Garde-moi, Yahweh, des mains du méchant[a] ; protège-moi des hommes violents[b], qui ont projeté de faire chanceler mes pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la main d’un méchant ». Le singulier hébreu peut désigner un individu ou avoir une portée collective.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de l’homme de violences ». Le groupe nominal est singulier en hébreu, mais le verbe qui suit est pluriel.
    reason: source_ambiguity
  - marker: c
    text: Ou « de renverser mes pas » ou « de me faire trébucher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Garde-moi
  rationale: L’impératif de שׁמר exprime ici une demande de protection. « Garde-moi » est direct, naturel et convient au parallélisme poétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: מִידֵי רָשָׁע
  choice: des mains du méchant
  rationale: Cette formulation conserve l’image hébraïque des « mains », qui représentent le pouvoir hostile, ainsi que le singulier morphologique רָשָׁע, susceptible d’un sens collectif.
- source_word: מֵאִישׁ חֲמָסִים
  choice: des hommes violents
  rationale: אִישׁ est formellement singulier et חֲמָסִים désigne une violence intense ou répétée. Le pluriel français s’accorde naturellement avec חָשְׁבוּ, verbe pluriel, et rend explicite la portée collective possible de l’expression.
- source_word: תִּנְצְרֵנִי
  choice: protège-moi
  rationale: נצר forme un parallélisme synonymique avec שׁמר. « Protège-moi » exprime clairement la préservation demandée sans répétition pesante.
- source_word: חָשְׁבוּ
  choice: ont projeté
  rationale: Dans ce contexte hostile, חשב désigne l’élaboration d’un dessein, non une simple pensée. Le pluriel du verbe hébreu est conservé.
- source_word: לִדְחוֹת פְּעָמָי
  choice: faire chanceler mes pas
  rationale: דחה évoque l’action de pousser, d’écarter ou de faire tomber, tandis que פְּעָמָי peut désigner les pas. La formulation garde l’image du déplacement rendu instable.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- issue: Variation de nombre entre אִישׁ חֲמָסִים et חָשְׁבוּ
  choice: « des hommes violents, qui ont projeté »
  alternative: « de l’homme violent, lui qui a projeté »
  rationale: Le groupe nominal est formellement singulier, mais le verbe relatif est pluriel. Le texte principal conserve le pluriel verbal et comprend le singulier comme collectif, tandis que la note signale la forme littérale afin de ne pas masquer la tension grammaticale.
translation_notes:
  register: Français international actuel, sobre et poétique. Le parallélisme des deux demandes de protection est conservé. Le pluriel de « des hommes violents » rend la reprise verbale plurielle naturelle, tandis qu’une note maintient visible le singulier formel de l’hébreu.
