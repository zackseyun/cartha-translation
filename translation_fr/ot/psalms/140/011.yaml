  text: אִ֥ישׁ לָשׁוֹן֮ בַּל יִכּ֪וֹן בָּ֫/אָ֥רֶץ אִישׁ חָמָ֥ס רָ֑ע יְ֝צוּדֶ֗/נּוּ לְ/מַדְחֵפֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/011.yaml
  text: A man of tongue will not be established in the land[c][b][a]; evil will hunt down a man of violence to thrustings.
translation:
  language: fr
  text: L’homme à la langue malveillante[a] ne s’établira pas dans le pays[b] ; le mal traquera l’homme violent, le poussant vers sa chute[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme de langue » ; on peut aussi comprendre : « le calomniateur » ou « le médisant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sur la terre ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’expression hébraïque finale est difficile. Elle évoque des poussées ou des renversements ; on peut aussi traduire : « sous des poussées répétées », « à coups redoublés » ou « jusqu’à sa chute ».'
    reason: textual_difficulty
lexical_decisions:
- source_word: אִישׁ לָשׁוֹן
  choice: l’homme à la langue malveillante
  rationale: Littéralement « homme de langue ». Cette formulation française conserve l’image de la langue tout en rendant explicite, sans la réduire au seul bavardage, sa portée nuisible probable dans le contexte.
- source_word: בַּל יִכּוֹן
  choice: ne s’établira pas
  rationale: Le niphal de כון exprime le fait d’être établi, affermi ou durablement installé ; le futur français convient à la portée prédictive ou souhaitée de la négation poétique.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner le pays, la terre habitée ou la terre entière. Le cadre social du psaume favorise « dans le pays », tout en laissant l’autre possibilité en note.
- source_word: אִישׁ חָמָס
  choice: l’homme violent
  rationale: Rend naturellement l’expression littérale « homme de violence », qui caractérise une personne vouée à la violence ou à l’injustice.
- source_word: רָע
  choice: le mal
  rationale: Le terme est compris comme le sujet personnifié du verbe suivant, conformément à la syntaxe où « l’homme violent » peut être repris comme objet. « Le mal » conserve sa portée morale et sa force poétique.
- source_word: יְצוּדֶנּוּ
  choice: traquera
  rationale: Le verbe צוד évoque la chasse ou la capture. « Traquera » exprime une poursuite persistante et convient à la personnification du mal.
- source_word: לְמַדְחֵפֹת
  choice: pour le précipiter dans la ruine
  rationale: Le substantif rare, au pluriel, est lié à l’idée de pousser ou de précipiter. La traduction principale donne en français naturel l’issue destructrice, tandis qu’une note conserve les lectures plus concrètes.
theological_decisions:
- issue: Sujet de יְצוּדֶנּוּ dans la seconde proposition
  choice: « le mal » est le sujet qui traque « l’homme violent »
  alternative: « un homme violent et mauvais — qu’on le traque » ou « que cela le traque »
  rationale: La lecture retenue comprend אִישׁ חָמָס comme thème ou objet repris par le suffixe, et רָע comme sujet du verbe. Elle produit une personnification forte du mal, mais la syntaxe hébraïque permet une autre segmentation, signalée en note.
translation_notes:
  register: Français international actuel, poétique et digne. La métaphore de la langue est conservée sous une forme intelligible ; la seconde moitié privilégie une syntaxe fluide où le mal est personnifié, tout en signalant l’ambiguïté de la construction hébraïque et du dernier substantif rare.
