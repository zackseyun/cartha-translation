revisions:
- from: L’homme à la langue malveillante[a] ne s’établira pas dans le pays[b] ; le mal traquera l’homme violent pour le précipiter dans la ruine[c][d].
  to: L’homme à la langue malveillante[a] ne s’établira pas dans le pays[b] ; le mal traquera l’homme violent, le poussant vers sa chute[c].
  rationale: La révision maintient la lecture principale, solidement soutenue par la syntaxe hébraïque, où le mal personnifié traque l’homme violent. Elle rend la dernière expression rare avec une image française de poussée vers la chute, moins réductrice que « dans la ruine », et retire une note syntaxique trompeuse. L’ambiguïté réelle du dernier terme demeure explicitement signalée.
