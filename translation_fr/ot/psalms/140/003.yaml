  text: שָֽׁנֲנ֣וּ לְשׁוֹנָ/ם֮ כְּֽמוֹ נָ֫חָ֥שׁ חֲמַ֥ת עַכְשׁ֑וּב תַּ֖חַת שְׂפָתֵ֣י/מוֹ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/003.yaml
  text: They sharpen their tongue like a snake[a]; the venom of a viper is under their lips[b]. Selah
translation:
  language: fr
  text: Ils aiguisent leur langue comme un serpent ; le venin d’une vipère[a] est sous leurs lèvres. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aspic » ou « couleuvre venimeuse ». L’hébreu désigne un serpent venimeux, mais l’espèce exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est probablement une indication liturgique ou musicale ; son sens précis est incertain.
    reason: cultural_note
lexical_decisions:
- source_word: שָֽׁנֲנ֣וּ
  choice: aiguisent
  rationale: Le piel de שׁנן signifie « aiguiser ». Le choix conserve l’image d’une parole rendue tranchante et dangereuse.
- source_word: לְשׁוֹנָם
  choice: leur langue
  rationale: Le singulier collectif de l’hébreu est conservé naturellement en français et présente la langue comme l’instrument commun de leur parole.
- source_word: כְּמוֹ נָחָשׁ
  choice: comme un serpent
  rationale: נָחָשׁ désigne un serpent. « Serpent » est courant en français et convient au registre poétique sans préciser indûment l’espèce.
- source_word: חֲמַת
  choice: le venin
  rationale: Dans ce contexte ophidien, חֵמָה désigne le poison du serpent plutôt que la colère. « Venin » est le terme français précis.
- source_word: עַכְשׁוּב
  choice: une vipère
  rationale: Le mot désigne un serpent venimeux dont l’espèce exacte reste incertaine. « Vipère » communique clairement l’image sans employer un nom archaïque.
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: est sous leurs lèvres
  rationale: La copule, absente de la proposition nominale hébraïque, est ajoutée selon l’usage français. « Sous leurs lèvres » préserve l’image d’un venin caché dans leur parole.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le terme, probablement liturgique ou musical, est translittéré puisque son sens précis demeure incertain.
