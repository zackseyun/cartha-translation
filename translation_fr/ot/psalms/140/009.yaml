source:
  edition: WLC
  text: רֹ֥אשׁ מְסִבָּ֑/י עֲמַ֖ל שְׂפָתֵ֣י/מוֹ יכסו/מו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/009.yaml
  text: As for the head of those who surround me[b][a], let the trouble of their lips cover them.
translation:
  language: fr
  text: 'La tête de ceux qui m’encerclent[a] : que le mal[b] de leurs lèvres les couvre !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé. On peut aussi comprendre : « Que les têtes de ceux qui m’encerclent soient couvertes par le mal de leurs lèvres. » Le singulier « tête » peut avoir ici une valeur collective.'
    reason: alternative_reading
  - marker: b
    text: Le mot traduit par « mal » peut aussi signifier « méfait », « tort » ou « peine » ; il désigne ici le mal associé à leurs paroles.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: tête
  rationale: Le nom signifie concrètement « tête ». Le conserver maintient l’image corporelle et son lien poétique avec le verbe « couvrir », sans résoudre artificiellement la syntaxe compacte.
- source_word: מְסִבָּי
  choice: ceux qui m’encerclent
  rationale: Le participe issu de סבב désigne ceux qui entourent le psalmiste. « M’encerclent » exprime naturellement en français la disposition hostile suggérée par le contexte sans préciser indûment qu’il s’agit d’un siège militaire.
- source_word: עֲמַל
  choice: mal
  rationale: Le terme peut désigner la peine, le mal, le méfait ou le tort. Avec « leurs lèvres », « mal » rend de façon concise et suffisamment large les effets nuisibles de leurs paroles.
- source_word: שְׂפָתֵימוֹ
  choice: leurs lèvres
  rationale: La traduction concrète du membre du corps préserve l’image poétique hébraïque plutôt que de la remplacer par le terme abstrait « paroles ».
- source_word: יכסומו
  choice: que … les couvre
  rationale: כסה signifie « couvrir ». Dans le contexte de cette prière imprécatoire, la tournure optative « que … » convient mieux qu’un simple futur prédictif; le pronom pluriel « les » reflète la forme transmise.
theological_decisions:
- issue: Structure de la proposition et valeur imprécatoire
  choice: 'Lire le verset comme un souhait imprécatoire : « Quant à la tête de ceux qui m’encerclent, que le mal de leurs lèvres les couvre ! »'
  alternative: Comprendre « tête » collectivement comme un pluriel implicite (« Que les têtes de ceux qui m’encerclent soient couvertes… ») ou lire le verbe comme une prédiction (« … les couvrira »).
  rationale: L’hébreu est elliptique et associe le singulier « tête » à un pronom objet pluriel. La traduction conserve cette tension, tandis que le contexte de supplication soutient la valeur optative du verbe sans exclure totalement une lecture indicative.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve les images concrètes de la « tête » et des « lèvres », ainsi que l’ellipse du texte hébreu. L’exclamation rend le ton de prière imprécatoire sans ajouter de vocabulaire confessionnel.
