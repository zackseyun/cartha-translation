source:
  edition: WLC
  text: אַ֣ךְ צַ֭דִּיקִים יוֹד֣וּ לִ/שְׁמֶ֑/ךָ יֵשְׁב֥וּ יְ֝שָׁרִ֗ים אֶת פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: fr
  text: Oui, les justes rendront grâce à ton nom ; les hommes droits demeureront devant ta face[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en ta présence ». Littéralement : « devant ta face ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule introduit ici avec assurance la conclusion du psaume. « Oui » exprime cette certitude avec naturel en français moderne, sans lui donner un sens exclusif.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif pluriel substantivé désigne ceux qui agissent avec justice ; « les justes » est concis, idiomatique et conserve sa portée morale.
- source_word: יוֹדוּ
  choice: rendront grâce
  rationale: Dans le langage des psaumes, le hifil de ידה exprime couramment l’action de remercier ou de louer Dieu. « Rendre grâce » convient naturellement avec « à ton nom ».
- source_word: לִשְׁמֶךָ
  choice: à ton nom
  rationale: La préposition ל marque ici la direction de l’action de grâce. Cette traduction conserve aussi l’importance poétique et théologique du nom divin.
- source_word: יֵשְׁבוּ
  choice: demeureront
  rationale: Le verbe peut signifier « s’asseoir », « habiter » ou « demeurer ». Dans ce contexte, « demeureront » exprime une présence stable et durable sans réduire le terme à une simple posture.
- source_word: יְשָׁרִים
  choice: les hommes droits
  rationale: L’adjectif pluriel substantivé caractérise les personnes intègres. « Les hommes droits » est une formulation française claire et digne, employée ici au sens collectif.
- source_word: אֶת פָּנֶיךָ
  choice: devant ta face
  rationale: La formulation conserve l’image concrète de la « face » de Dieu présente dans l’hébreu, plutôt que de la remplacer silencieusement par son sens idiomatique.
theological_decisions:
- issue: Langage anthropomorphique exprimant la présence divine
  choice: devant ta face
  alternative: en ta présence
  rationale: Le texte hébreu parle littéralement de la « face » de Dieu. Maintenir cette image préserve la texture poétique et la notion de proximité avec Dieu, tandis que la note donne l’équivalent idiomatique.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme entre « les justes » et « les hommes droits » est conservé, ainsi que l’image hébraïque de la face divine.
