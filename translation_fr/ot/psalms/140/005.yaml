  variant: modern international French
source:
  edition: WLC
  text: טָֽמְנֽוּ גֵאִ֨ים פַּ֡ח לִ֗/י וַ/חֲבָלִ֗ים פָּ֣רְשׂוּ רֶ֭שֶׁת לְ/יַד מַעְגָּ֑ל מֹקְשִׁ֖ים שָֽׁתוּ לִ֣/י סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: fr
  text: Les orgueilleux[a] ont dissimulé un piège contre moi ; à l’aide de cordes, ils ont déployé un filet au bord du sentier[b] ; ils ont placé des pièges contre moi. Séla[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les arrogants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à côté du chemin » ou « le long de la piste ».
    reason: lexical_alternative
  - marker: c
    text: « Séla » est probablement une indication liturgique ou musicale ; son sens précis est incertain.
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: ont dissimulé
  rationale: Le verbe désigne l’action de cacher ou de dissimuler, particulièrement dans le contexte d’un piège. « Ont dissimulé » conserve explicitement cette idée.
- source_word: גֵאִים
  choice: les orgueilleux
  rationale: Le terme qualifie des personnes fières ou arrogantes. « Les orgueilleux » est naturel, concis et ne précise pas leur genre.
- source_word: פַּח
  choice: un piège
  rationale: Le nom désigne un piège ou un lacet. « Piège » préserve l’image de chasse tout en permettant de rendre מֹקְשִׁים par le même champ lexical sans employer un mot français rare.
- source_word: לִי
  choice: contre moi
  rationale: Dans ce contexte hostile, la préposition indique que le piège est destiné au psalmiste. « Contre moi » exprime naturellement cette visée sans faire croire que le piège lui est offert.
- source_word: וַחֲבָלִים
  choice: à l’aide de cordes
  rationale: חֲבָלִים signifie « cordes ». La formulation instrumentale s’accorde à l’image du filet déployé et produit une syntaxe française intelligible.
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: ils ont déployé un filet
  rationale: La locution signifie étendre ou déployer un filet. « Déployer un filet » est idiomatique et conserve l’image concrète.
- source_word: לְיַד מַעְגָּל
  choice: au bord du sentier
  rationale: לְיַד signifie « à côté de, au bord de », tandis que מַעְגָּל désigne une piste, un chemin ou un sentier. Le choix garde l’image d’un piège placé le long du trajet.
- source_word: מֹקְשִׁים
  choice: des pièges
  rationale: Le pluriel désigne des pièges ou des lacets. « Pièges » est immédiatement compréhensible en français moderne.
- source_word: שָׁתוּ
  choice: ils ont placé
  rationale: Le verbe signifie mettre ou placer. « Placer des pièges » est une collocation française naturelle et reste proche du sens hébreu.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens précis du terme demeure incertain ; il s’agit vraisemblablement d’une indication liturgique ou musicale. Il est donc translittéré plutôt que traduit de manière conjecturale.
