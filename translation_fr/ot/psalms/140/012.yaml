source:
  edition: WLC
  text: ידעת כִּֽי יַעֲשֶׂ֣ה יְ֭הוָה דִּ֣ין עָנִ֑י מִ֝שְׁפַּ֗ט אֶבְיֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/012.yaml
  text: I know that Yahweh will uphold the cause of the afflicted[b][a], and justice for the needy.
translation:
  language: fr
  text: Je sais[a] que Yahweh défendra la cause[b] de l’opprimé et rendra justice aux démunis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu transmis porte formellement « Tu sais ». La lecture traditionnelle, suivie ici dans le contexte de la confession du psalmiste, comprend « Je sais »; on peut aussi traduire « J’ai reconnu ».
    reason: textual_variant
  - marker: b
    text: Littéralement « fera la cause de l’opprimé », c’est-à-dire qu’il interviendra pour faire valoir son droit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ידעת
  choice: Je sais
  rationale: 'Bien que la forme consonantique puisse se lire « tu sais » et que la vocalisation massorétique corresponde formellement à une 2e personne masculine singulière, le contexte est traditionnellement compris comme une confession du psalmiste : « je sais ». Une note préserve l’ambiguïté textuelle.'
- source_word: כִּי
  choice: que
  rationale: Introduit naturellement en français le contenu de ce que le psalmiste sait.
- source_word: יַעֲשֶׂה ... דִּין
  choice: défendra la cause
  rationale: Littéralement « fera la cause/le procès » ; l’expression a un sens judiciaire et indique que Yahweh intervient pour faire valoir le droit de l’opprimé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: עָנִי
  choice: l’opprimé
  rationale: Dans le contexte de violences et de persécution du psaume, le terme désigne ici la personne affligée ou opprimée, au-delà de la seule pauvreté matérielle.
- source_word: מִשְׁפַּט
  choice: rendra justice
  rationale: Dans le parallélisme, le nom désigne le droit ou la justice accordée aux personnes vulnérables ; la formulation verbale est naturelle en français.
- source_word: אֶבְיֹנִים
  choice: aux démunis
  rationale: Rend le pluriel et évoque ceux qui manquent de ressources ou de soutien, sans limiter nécessairement leur besoin à l’aspect financier.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme ; « Yahweh » en préserve la fonction de nom propre.
- issue: Personne grammaticale de ידעת
  choice: Je sais
  alternative: Tu sais ; j’ai reconnu
  rationale: La lecture à la première personne s’accorde avec la déclaration de confiance qui clôt le psaume, mais la forme transmise permet réellement « tu sais » ; cette tension est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme judiciaire est conservé sans lourdeur, avec « défendra la cause » puis « rendra justice ».
