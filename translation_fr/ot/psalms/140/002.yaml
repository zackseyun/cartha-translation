translation:
  language: fr
  text: eux qui trament des méfaits dans leur cœur ; tout le jour, ils suscitent des guerres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chaque jour, ils se rassemblent pour le combat » ou « tout le jour, ils attisent des guerres ». Le verbe hébreu employé ici est difficile, et le contexte permet plusieurs traductions.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: eux qui
  rationale: La particule relative poursuit la description des hommes mauvais du verset précédent ; « eux qui » permet au fragment de rester naturel en français tout en marquant ce lien.
- source_word: חָשְׁבוּ
  choice: méditent
  rationale: Le verbe désigne ici une réflexion intentionnelle qui élabore des desseins nuisibles. « Méditent » conserve l'intériorité exprimée par « dans leur cœur » sans réduire l'action à une simple pensée passagère.
- source_word: רָעוֹת
  choice: le mal
  rationale: Le pluriel hébreu peut désigner des projets ou des actes mauvais. Le singulier collectif « le mal » est idiomatique en français et garde toute la portée morale du terme.
- source_word: בְּלֵב
  choice: dans leur cœur
  rationale: Cette formulation conserve l'image anthropologique hébraïque du cœur comme siège de la pensée et de l'intention ; le possessif est explicité selon le sujet pluriel.
- source_word: כָּל יוֹם
  choice: tout le jour
  rationale: La formulation rend directement l'expression temporelle et souligne une activité persistante au cours de la journée, tout en gardant une diction poétique.
- source_word: יָגוּרוּ
  choice: provoquent
  rationale: Le sens du verbe est difficile dans ce contexte. Avec « conflits » comme complément, « provoquent » exprime naturellement l'idée de susciter ou d'attiser des affrontements, sans masquer les autres analyses possibles signalées en note.
- source_word: מִלְחָמוֹת
  choice: des conflits
  rationale: Le nom pluriel signifie littéralement « guerres » ou « combats ». « Conflits » s'accorde naturellement avec « provoquer » et peut couvrir aussi bien les hostilités que les affrontements, tandis que la note conserve l'option plus littérale du combat.
