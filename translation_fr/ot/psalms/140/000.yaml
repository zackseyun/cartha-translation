lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. « Au chef de chœur » est une formulation française claire et consacrée qui rend aussi le préfixe ל de manière naturelle.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Ce nom constitue ici une désignation de genre; « psaume » en est l’équivalent français établi et exact.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, la préposition ל peut exprimer l’auteur, la destination, l’appartenance ou l’association. « De David » conserve mieux cette latitude que « par David » ou « pour David ».
theological_decisions:
- issue: Rapport du psaume à David dans le titre
  choice: de David
  alternative: par David; pour David
  rationale: L’hébreu ne tranche pas nécessairement en faveur d’une attribution stricte de l’auteur. La formulation retenue préserve l’ambiguïté du titre sans imposer une conclusion historique ou théologique plus précise.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation brève respecte le caractère de suscription du texte hébreu; le marqueur est placé après « David », expression à laquelle la note se rapporte.
