translation:
  language: fr
  text: Au chef de chœur. Psaume de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; le titre hébreu peut indiquer l’auteur, l’association ou la dédicace.
