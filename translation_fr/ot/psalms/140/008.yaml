  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: fr
  text: Yahweh, n’accorde pas au méchant ce qu’il désire ; ne favorise pas son projet[a], de peur qu’ils ne s’élèvent[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu de cette proposition est difficile. Autres traductions possibles : « ne fais pas aboutir son projet » ou « ne mène pas son projet à son accomplissement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, en harmonisant avec le singulier qui précède : « de peur qu’il ne s’élève ». Le texte hébreu porte toutefois un verbe au pluriel : « qu’ils ne s’élèvent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מַאֲוַיֵּי רָשָׁע
  choice: ce qu’il désire au méchant
  rationale: « Ce qu’il désire » exprime naturellement les désirs du singulier רָשָׁע, rendu ici par « le méchant » afin de conserver les reprises pronominales singulières.
- source_word: זְמָמוֹ
  choice: son projet
  rationale: Désigne son dessein ou plan ; le contexte en indique le caractère mauvais sans qu’il soit nécessaire de le surtraduire par « complot ».
- source_word: אַל תָּפֵק
  choice: ne fais pas aboutir
  rationale: Le verbe est difficile dans ce contexte ; cette formulation exprime l’idée de ne pas favoriser l’accomplissement du projet, tout en signalant l’incertitude en note.
- source_word: יָרֻמוּ
  choice: qu’ils ne s’élèvent
  rationale: Conserve le pluriel du texte massorétique et le possible sens d’élévation, sans harmoniser avec le méchant singulier.
- source_word: סֶלָה
  choice: Sélah
  rationale: Translittération française traditionnelle, puisque la fonction précise du terme reste incertaine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Préserve le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- issue: Passage du singulier au pluriel dans la dernière proposition
  choice: de peur qu’ils ne s’élèvent
  alternative: de peur qu’il ne s’élève
  rationale: Le verbe hébreu est pluriel, alors que « le méchant » et « son projet » sont singuliers. La traduction maintient cette tension grammaticale au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le mouvement du singulier au pluriel et place les variantes liées au verbe difficile en notes.
