id: PSA.140.7
reference: Psalms 140:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהֹוִ֣ה אֲ֭דֹנָ/י עֹ֣ז יְשׁוּעָתִ֑/י סַכֹּ֥תָה לְ֝/רֹאשִׁ֗/י בְּ/י֣וֹם נָֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: fr
  text: Ô Yahweh, mon Seigneur, force de mon salut, tu as couvert ma tête au jour du combat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au jour des armes » ou « au jour de l’armement ». L’hébreu désigne probablement ici le temps du conflit armé.'
    reason: Alternative lexicale pour נָשֶׁק et explicitation du choix contextuel « combat ».
lexical_decisions:
- source_word: יְהֹוִה
  choice: Ô Yahweh
  rationale: Le nom divin est translittéré « Yahweh » afin de préserver sa valeur de nom propre; « Ô » marque l’adresse directe de la prière.
- source_word: אֲדֹנָי
  choice: mon Seigneur
  rationale: La forme porte le suffixe de première personne, d’où « mon Seigneur »; cette formulation distingue le titre du nom divin qui précède.
- source_word: עֹז יְשׁוּעָתִי
  choice: force de mon salut
  rationale: Cette traduction conserve la relation entre « force » et « mon salut », tout en restant concise et naturelle dans le registre poétique du psaume.
- source_word: סַכֹּתָה
  choice: tu as couvert
  rationale: Le verbe signifie couvrir, abriter ou protéger. « Couvert » maintient l’image concrète plutôt que d’en expliciter seulement l’effet protecteur.
- source_word: לְרֹאשִׁי
  choice: ma tête
  rationale: Après « couvrir », le français exprime naturellement le complément sans reproduire littéralement la préposition hébraïque.
- source_word: בְּיוֹם נָשֶׁק
  choice: au jour du combat
  rationale: נָשֶׁק peut désigner les armes ou l’armement; dans cette expression temporelle, il évoque vraisemblablement le conflit armé. « Combat » rend clairement ce sens contextuel, tandis que la lecture plus littérale est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le Tétragramme comme nom propre. « Yahweh » en conserve la spécificité et permet de le distinguer du titre אֲדֹנָי, rendu juste après par « mon Seigneur ».
- issue: Rapport entre עֹז et יְשׁוּעָתִי
  choice: force de mon salut
  alternative: puissance qui me sauve
  rationale: La formulation retenue préserve la construction condensée et sa portée théologique sans décider si le salut désigne ici principalement la délivrance, la protection ou la victoire.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe nominale resserrée (« force de mon salut ») conserve la densité de l’hébreu, tandis que « au jour du combat » reste intelligible pour un lectorat général.
