source:
  edition: WLC
  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: fr
  text: Délivre-moi[a], Yahweh, de l’homme mauvais ; protège-moi de l’homme violent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Arrache-moi, Yahweh, à l’homme mauvais ; préserve-moi de l’homme violent. »'
    reason: Alternative lexicale reflétant les nuances possibles de חלץ et נצר.
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: Délivre-moi
  rationale: L’impératif hiphil de חלץ avec suffixe de première personne exprime l’action de tirer quelqu’un d’un danger, de le secourir ou de le délivrer. « Délivre-moi » restitue naturellement l’urgence de la supplication.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que par un titre.
- source_word: מֵאָדָם רָע
  choice: de l’homme mauvais
  rationale: אָדָם désigne ici un homme hostile, en parallèle avec אִישׁ au second membre. Le singulier représentatif et l’adjectif רָע sont conservés.
- source_word: מֵאִישׁ חֲמָסִים
  choice: de l’homme violent
  rationale: Le pluriel חֲמָסִים exprime ici la violence comme trait dominant. « L’homme violent » est idiomatique en français tout en conservant le singulier masculin du texte.
- source_word: תִּנְצְרֵנִי
  choice: protège-moi
  rationale: נצר signifie garder, préserver ou protéger. « Protège-moi » rend clairement la demande de sauvegarde et se distingue du premier verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom propre divin ; sa translittération préserve cette distinction sans le remplacer par un titre.
- issue: Genre et portée des noms אָדָם et אִישׁ
  choice: l’homme
  alternative: une personne / l’être humain
  rationale: Le parallélisme présente un adversaire au masculin singulier. « L’homme » respecte cette forme sans élargir le sens à toute l’humanité.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme poétique est conservé ; « protège-moi » évite le tour moins naturel « garde-moi de » tout en maintenant la distinction entre délivrance et protection.
