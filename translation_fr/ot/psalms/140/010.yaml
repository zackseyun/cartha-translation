id: PSA.140.10
reference: Psalms 140:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ימיטו עֲלֵי/הֶ֗ם גֶּֽחָ֫לִ֥ים בָּ/אֵ֥שׁ יַפִּלֵ֑/ם בְּ֝/מַהֲמֹר֗וֹת בַּֽל יָקֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: fr
  text: Que des braises tombent sur eux[a] ! Qu’il les précipite dans le feu, dans des gouffres profonds[b], d’où ils ne se relèveront jamais !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Que des braises pleuvent sur eux ! » Le verbe hébreu peut évoquer l’action de faire tomber ou pleuvoir.'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans des abîmes », voire « dans des profondeurs aquatiques ». Le terme hébreu est rare, et son sens précis reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: Que ... tombent
  rationale: Le hiphil inaccompli à valeur imprécatoire exprime ici le souhait qu’une chute soit provoquée. Cette tournure française conserve la force de la prière sans préciser l’agent.
- source_word: גחלים
  choice: des braises
  rationale: Le nom désigne des charbons ardents ou des braises. « Braises » exprime naturellement en français actuel leur caractère brûlant.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: Rendu direct et idiomatique de la préposition על avec suffixe pronominal.
- source_word: בָּאֵשׁ יַפִּלֵם
  choice: Qu’il les précipite dans le feu
  rationale: Le hiphil de נפל exprime l’action de faire tomber. « Précipiter » restitue cette valeur causative et le mouvement vers le feu, tout en conservant le sujet masculin singulier implicite.
- source_word: בְּמַהֲמֹרוֹת
  choice: dans des gouffres profonds
  rationale: Ce terme rare et difficile semble désigner des fosses, des abîmes ou des profondeurs. « Gouffres profonds » préserve l’image concrète de lieux d’où l’on ne peut remonter, sans retenir comme certaine l’interprétation aquatique.
- source_word: בַּל יָקוּמוּ
  choice: d’où ils ne se relèveront jamais
  rationale: קום signifie se lever ou se relever. Après l’image de la chute dans des gouffres, « se relever » est naturel ; « jamais » rend la force finale de la négation בל.
theological_decisions:
- issue: Langage imprécatoire et sujet implicite du verbe singulier
  choice: Conserver la demande de jugement et le sujet singulier implicite avec « Qu’il les précipite »
  alternative: Employer une tournure entièrement passive (« qu’ils soient précipités ») ou nommer explicitement Dieu
  rationale: L’hébreu passe d’une forme verbale plurielle à une forme singulière, dont le sujet est vraisemblablement Dieu sans être nommé. Le pronom « il » préserve ce changement et évite d’ajouter un nom absent du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les exclamations rendent la force imprécatoire du verset. « Braises » et « gouffres profonds » maintiennent la vigueur poétique, tandis que les notes signalent les ambiguïtés lexicales réelles.
