id: PSA.75.6
reference: Psalms 75:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לֹ֣א מִ֭/מּוֹצָא וּ/מִֽ/מַּעֲרָ֑ב וְ֝/לֹ֗א מִ/מִּדְבַּ֥ר הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: fr
  text: Car ce n’est ni de l’orient ni de l’occident, ni du désert que vient l’élévation[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire plus librement : « l’avancement » ou « la promotion ». L’hébreu est elliptique; le verset suivant précise que Dieu abaisse l’un et élève l’autre.'
    reason: lexical_alternative
  - marker: b
    text: Le dernier mot hébreu peut également être compris comme « montagnes », ce qui donnerait une formulation telle que « ni du désert des montagnes ». Le contexte favorise cependant le sens d’« élévation ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve le lien argumentatif du psaume.
- source_word: מִמּוֹצָא
  choice: de l’orient
  rationale: Le terme évoque littéralement le lieu où le soleil se lève; « l’orient » exprime naturellement ici la direction correspondante.
- source_word: וּמִמַּעֲרָב
  choice: ni de l’occident
  rationale: Dans cette série négative, « ni » rend naturellement la coordination hébraïque; le mot désigne le couchant, donc l’occident.
- source_word: מִמִּדְבַּר
  choice: ni du désert
  rationale: מִדְבָּר désigne couramment une région désertique ou sauvage; « désert » est clair et convient au contraste géographique.
- source_word: הָרִים
  choice: que vient l’élévation
  rationale: La forme peut être comprise en rapport avec le verbe רום, « élever ». La proposition hébraïque étant elliptique, « que vient » explicite sobrement la relation sans effacer l’image de l’élévation, reprise au verset suivant.
theological_decisions:
- issue: Interprétation de la forme finale הָרִים dans une proposition elliptique
  choice: Comprendre le verset comme niant que l’élévation vienne d’une direction terrestre.
  alternative: Lire הָרִים comme le nom « montagnes », avec un sens tel que « ni du désert des montagnes ».
  rationale: Le verset suivant affirme que Dieu abaisse l’un et élève l’autre, ce qui favorise ici le sens verbal d’élévation. Une note maintient toutefois visible l’autre analyse grammaticale possible.
translation_notes:
  register: Français international actuel, sobre et digne. La construction « ce n’est ni… ni… que » restitue clairement la série négative, tandis que « élévation » préserve le lien lexical et thématique avec le verset suivant.
