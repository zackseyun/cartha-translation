id: PSA.75.10
reference: Psalms 75:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: fr
  text: Et je trancherai toutes les cornes[a] des méchants ; les cornes du juste seront élevées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, les « cornes » symbolisent la force, la puissance ou un rang élevé.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Et… toutes
  rationale: La conjonction וְ relie ce verset au contexte précédent, tandis que כָּל exprime la totalité.
- source_word: קַרְנֵי / קַרְנוֹת
  choice: les cornes
  rationale: Le sens concret de « cornes » est conservé afin de préserver l’image poétique biblique de la force, de la puissance ou d’un rang élevé.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne collectivement les personnes qui agissent avec méchanceté ; cette formulation est naturelle et concise en français.
- source_word: אֲגַדֵּעַ
  choice: je trancherai
  rationale: Le verbe גדע signifie couper ou retrancher. « Trancher » convient à l’image des cornes et évoque leur suppression décisive.
- source_word: תְּרוֹמַמְנָה
  choice: seront élevées
  rationale: Cette forme de רום exprime ici l’élévation ou l’exaltation des cornes et s’accorde au féminin pluriel en hébreu comme en français.
- source_word: צַדִּיק
  choice: du juste
  rationale: Le singulier hébreu est maintenu ; il peut avoir une valeur générique et forme le pendant poétique des « méchants ».
theological_decisions:
- issue: Les cornes comme image de la puissance et de l’honneur
  choice: Conserver « cornes » dans le texte principal.
  alternative: Rendre explicitement l’image par « force », « puissance » ou « rang élevé ».
  rationale: La métaphore est bien établie dans la poésie biblique. La conserver maintient la force de l’image sans en réduire le sens à une seule interprétation abstraite.
- issue: Le singulier générique de צַדִּיק
  choice: Traduire par « du juste » au singulier.
  alternative: Employer le collectif « des justes ».
  rationale: Le singulier du texte hébreu peut représenter la catégorie entière, mais le conserver respecte la forme poétique et laisse subsister cette portée générique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure parallèle et la métaphore concrète de l’hébreu sont préservées ; le point-virgule rend le contraste implicite sans ajouter de conjonction absente du second membre hébreu.
