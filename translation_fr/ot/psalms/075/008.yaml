  text: כִּ֤י כ֪וֹס בְּֽ/יַד יְהוָ֡ה וְ/יַ֤יִן חָמַ֨ר מָ֥לֵא מֶסֶךְ֮ וַ/יַּגֵּ֪ר מִ֫/זֶּ֥ה אַךְ שְׁ֭מָרֶי/הָ יִמְצ֣וּ יִשְׁתּ֑וּ כֹּ֝֗ל רִשְׁעֵי אָֽרֶץ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: fr
  text: 'Car une coupe est dans la main de Yahvé : du vin qui écume, plein d’un mélange ; il en verse, et tous les méchants de la terre en videront la lie et la boiront[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en aspireront la lie et la boiront ». La lie est le dépôt qui reste au fond du vin ; l’image souligne qu’ils boiront la coupe jusqu’à l’épuiser.'
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du jugement évoqué dans le contexte précédent, tout en gardant le lien argumentatif du psaume.
- source_word: כּוֹס בְּיַד יְהוָה
  choice: une coupe est dans la main de Yahvé
  rationale: Conserve l’image concrète et l’ordre général de l’hébreu; la coupe demeure une métaphore non explicitée du jugement divin.
- source_word: חָמַר
  choice: écume
  rationale: Rend le mouvement d’un vin puissant qui mousse ou fermente, plutôt qu’une simple indication de couleur.
- source_word: מָלֵא מֶסֶךְ
  choice: plein d’un mélange aromatisé
  rationale: מֶסֶךְ désigne un vin préparé par mélange, possiblement avec des aromates; cette formulation reste intelligible sans identifier avec certitude les ingrédients.
- source_word: וַיַּגֵּר מִזֶּה
  choice: Il en verse
  rationale: Exprime naturellement en français l’action de verser depuis la coupe.
- source_word: אַךְ
  choice: devront jusqu’au dernier
  rationale: La construction rend l’insistance et l’exhaustivité du jugement, en lien avec כֹּל, sans ajouter un adverbe français pesant.
- source_word: שְׁמָרֶיהָ יִמְצוּ יִשְׁתּוּ
  choice: en boire la lie
  rationale: « La lie » désigne le dépôt au fond du vin; la tournure française exprime le fait de vider entièrement la coupe, bien que le sens littéral du premier verbe soit plus énergique.
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: tous les méchants de la terre
  rationale: Équivalent direct, naturel et non interprétatif de l’expression hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte français conserve ici le nom propre de l’alliance sous sa forme française courante, sans substituer un titre.
- issue: Image de la coupe
  choice: Conserver la coupe de vin comme image implicite du jugement
  alternative: Expliciter « la coupe de la colère »
  rationale: Le contexte indique le jugement divin, mais le verset ne contient ni « colère » ni une explication directe de la métaphore.
- issue: Sujet contraint à boire
  choice: « devront ... boire »
  alternative: simple futur « boiront »
  rationale: Le couple verbal décrivant l’épuisement de la lie présente les méchants comme subissant entièrement le contenu de la coupe; « devront » communique cette contrainte sans expliciter davantage la nature du jugement.
translation_notes:
  register: Français international moderne, digne et poétique. La ponctuation distingue les propositions tout en maintenant leur enchaînement. « Mélange aromatisé » évite le terme technique « vin mêlé » et préserve l’incertitude sur la composition exacte.
