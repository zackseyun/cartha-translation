  yaml_path: translation/ot/psalms/075/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] A psalm of Asaph[b]. A song.'
translation:
  language: fr
  text: Au chef de chœur. « Ne détruis pas. »[a] Psaume d’Asaph[b]. Chant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Il s’agit peut-être du nom d’un air ou d’une indication musicale : « Ne détruis pas. »'
    reason: cultural_note
  - marker: b
    text: L’expression « d’Asaph » peut indiquer qu’Asaph en est l’auteur, que le psaume lui est associé ou qu’il appartient au recueil asaphite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement la personne chargée de diriger l’exécution musicale; cette formulation est concise et naturelle en français.
- source_word: אַל תַּשְׁחֵת
  choice: « Ne détruis pas. »
  rationale: La formule est vraisemblablement un titre, le nom d’un air ou une indication musicale. Les guillemets signalent cette fonction tout en conservant le sens direct du verbe.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme générique habituel pour ce type de composition musicale et cultuelle.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association ou le rattachement à une collection; la tournure traditionnelle française préserve cette ouverture.
- source_word: שִׁיר
  choice: Chant
  rationale: Ce second terme générique est rendu séparément afin de conserver la double désignation hébraïque.
