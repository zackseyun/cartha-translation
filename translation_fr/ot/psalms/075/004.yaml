base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: fr
  text: 'J’ai dit à ceux qui se vantent : « Ne vous vantez pas ! » et aux méchants : « Ne levez pas votre corne[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La « corne » est ici une image de la force, de la puissance ou de l’orgueil qui s’élève. Autre traduction possible : « N’exaltez pas votre puissance » ou « Ne relevez pas la tête avec orgueil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: Le qal accompli à la première personne du singulier désigne ici une parole prononcée; le passé composé est naturel en français moderne tout en conservant cet aspect accompli.
- source_word: הוֹלְלִים
  choice: ceux qui se vantent
  rationale: Cette formulation rend le sens de personnes qui se glorifient avec arrogance et maintient le lien lexical avec l’injonction parallèle « Ne vous vantez pas ».
- source_word: אַל תָּהֹלּוּ
  choice: Ne vous vantez pas
  rationale: L’interdiction avec אַל et la forme verbale à la deuxième personne du pluriel est rendue directement; la répétition de « vanter » reproduit le jeu lexical hébreu.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Traduction courante de רְשָׁעִים dans les Psaumes, elle conserve la catégorie morale sans lui imposer un sens strictement juridique.
- source_word: אַל תָּרִימוּ
  choice: Ne levez pas
  rationale: Rend directement le hiphil de רום employé avec une valeur d’interdiction.
- source_word: קָרֶן
  choice: votre corne
  rationale: La métaphore de la corne est conservée. Bien que le nom hébreu n’ait pas de possessif explicite, « votre » explicite naturellement en français le rapport implicite avec les destinataires pluriels.
theological_decisions:
- issue: Portée métaphorique de « corne »
  choice: Conserver « votre corne » dans le texte principal
  alternative: N’exaltez pas votre puissance / Ne relevez pas la tête avec orgueil
  rationale: La corne peut évoquer la force, la puissance, le rang ou l’orgueil qui s’élève. Garder l’image préserve la poésie et son amplitude de sens sans la réduire à une seule interprétation; la note en facilite la compréhension.
translation_notes:
  register: Français international actuel, clair et digne. La répétition « ceux qui se vantent / Ne vous vantez pas » préserve le jeu de mots du texte hébreu. L’image biblique de la corne est maintenue et expliquée en note.
