  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: fr
  text: Car, lorsque je choisirai le moment fixé[a], je jugerai moi-même avec droiture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « lorsque je prendrai le moment fixé ». On peut aussi comprendre : « lorsque je fixerai le moment » ou « au moment que j’aurai choisi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec équité », « avec justice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car, quand
  rationale: כִּי introduit ici l’explication de l’affirmation précédente, tandis que la proposition qui suit a une portée temporelle. « Car, quand » conserve ces deux valeurs sans les confondre.
- source_word: אֶקַּח
  choice: je choisirai
  rationale: לקח signifie littéralement « prendre », mais, associé à מוֹעֵד, il exprime ici le choix ou la détermination du moment d’agir. « Choisir » donne en français un sens naturel tout en laissant l’expression plus littérale en note.
- source_word: מוֹעֵד
  choice: le moment fixé
  rationale: מוֹעֵד désigne un temps déterminé ou assigné. « Le moment fixé » est idiomatique et conserve l’idée d’un moment établi.
- source_word: אֲנִי
  choice: moi-même
  rationale: Le pronom indépendant renforce le sujet déjà indiqué par la forme verbale. « Moi-même » rend explicitement cette insistance.
- source_word: מֵישָׁרִים
  choice: avec droiture
  rationale: Le pluriel abstrait évoque la rectitude, l’équité et la justice dans l’exercice du jugement. « Avec droiture » reste proche de la forme nominale hébraïque.
- source_word: אֶשְׁפֹּט
  choice: je jugerai
  rationale: Dans cette déclaration, שׁפט désigne l’exercice du jugement; le futur français convient à la valeur prospective de l’imparfait hébreu dans ce contexte.
theological_decisions:
- issue: Identité du locuteur et autorité judiciaire
  choice: Conserver une déclaration emphatique à la première personne sans ajouter « Dieu » dans le verset.
  alternative: Identifier explicitement le locuteur comme Dieu dans le corps du texte.
  rationale: Le contexte du psaume conduit traditionnellement à comprendre que Dieu parle, mais ce verset ne le nomme pas. La traduction garde donc la première personne et la revendication d’autorité judiciaire sans explicitation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition emphatique « moi-même » préserve l’insistance de l’hébreu. « Car, quand » maintient à la fois le lien explicatif avec le contexte et la nuance temporelle de la proposition.
