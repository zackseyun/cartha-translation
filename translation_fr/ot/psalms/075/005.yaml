  text: אַל תָּרִ֣ימוּ לַ/מָּר֣וֹם קַרְנְ/כֶ֑ם תְּדַבְּר֖וּ בְ/צַוָּ֣אר עָתָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/005.yaml
  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: fr
  text: N’élevez pas votre corne vers les hauteurs[a] ; ne parlez pas le cou tendu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « corne » représente ici la force, la puissance ou l’orgueil.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne parlez pas avec arrogance » ou « avec insolence ». L’hébreu emploie une image corporelle associant la parole au cou et à une attitude de défi orgueilleux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: ne… pas
  rationale: La particule négative, employée ici avec une forme verbale à valeur injonctive, exprime une interdiction directe.
- source_word: תָּרִימוּ
  choice: élevez
  rationale: Le verbe רום signifie « lever, élever ». « Élever » conserve l’image concrète et convient au registre poétique.
- source_word: לַמָּרוֹם
  choice: bien haut
  rationale: מָרוֹם désigne la hauteur. « Bien haut » rend naturellement en français l’orientation vers le haut et renforce l’idée d’exaltation présomptueuse sans l’expliciter à outrance.
- source_word: קַרְנְכֶם
  choice: votre corne
  rationale: קֶרֶן signifie littéralement « corne » et évoque métaphoriquement la force, la puissance ou l’orgueil. Le texte principal conserve cette image biblique, précisée en note.
- source_word: תְּדַבְּרוּ
  choice: parlez
  rationale: דבר est le verbe courant pour « parler » ; ce choix est simple, digne et exact.
- source_word: בְצַוָּאר
  choice: le cou
  rationale: La préposition ב introduit ici vraisemblablement la manière de parler. La formulation française conserve l’image corporelle du cou.
- source_word: עָתָק
  choice: raide
  rationale: עָתָק peut exprimer l’insolence ou l’arrogance. Avec « cou », « raide » produit en français une image naturelle de défi orgueilleux, tout en laissant à la note les autres nuances possibles.
theological_decisions:
- issue: Valeur métaphorique de la « corne »
  choice: Conserver « corne » dans le texte
  alternative: Traduire directement par « force », « puissance » ou « orgueil »
  rationale: La métaphore est intentionnelle et importante dans le langage des Psaumes ; l’expliciter dans le corps du texte réduirait sa richesse et trancherait entre plusieurs valeurs possibles.
- issue: Rapport syntaxique et sens de בְצַוָּאר עָתָק
  choice: « le cou raide » comme expression de défi orgueilleux
  alternative: « avec arrogance » ou « d’un ton insolent »
  rationale: L’hébreu associe concrètement la parole au cou et à l’insolence. La traduction conserve la tension de cette image corporelle au lieu de la remplacer entièrement par une abstraction.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme et les deux images corporelles de l’hébreu sont préservés ; les notes éclairent les métaphores sans les remplacer dans le texte.
