source:
  edition: WLC
  text: נְֽמֹגִ֗ים אֶ֥רֶץ וְ/כָל יֹשְׁבֶ֑י/הָ אָנֹכִ֨י תִכַּ֖נְתִּי עַמּוּדֶ֣י/הָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: fr
  text: La terre et tous ceux qui l’habitent chancellent[a] ; moi, j’ai affermi ses piliers[b]. Sélah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fondent », « se dissolvent » ou « s’effondrent ». L’hébreu évoque une perte de stabilité ou un effondrement.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai établi ses piliers » ou « j’ai fixé ses piliers ».
    reason: lexical_alternative
  - marker: c
    text: « Sélah » est traditionnellement translittéré ; son sens précis demeure incertain.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: chancellent
  rationale: Le participe de מוג évoque la dissolution, l’effondrement ou la perte de stabilité. « Chancellent » exprime naturellement l’instabilité de la terre et de ses habitants tout en conservant l’image poétique.
- source_word: אֶרֶץ
  choice: la terre
  rationale: La mention de tous ses habitants et de ses piliers favorise ici le sens cosmique de « terre » plutôt que celui, local, de « pays ».
- source_word: יֹשְׁבֶיהָ
  choice: tous ceux qui l’habitent
  rationale: Cette formulation garde la valeur verbale du participe de ישב et reste claire en français moderne.
- source_word: אָנֹכִי
  choice: moi
  rationale: Le pronom indépendant est emphatique ; le détachement de « moi » restitue cette insistance sans ajouter l’idée d’exclusivité.
- source_word: תִכַּנְתִּי
  choice: j’affermis
  rationale: Dans ce contexte, le piel de כון signifie établir ou rendre ferme. Le présent français convient à l’énoncé poétique et à l’opposition entre instabilité et action stabilisatrice.
- source_word: עַמּוּדֶיהָ
  choice: ses piliers
  rationale: « Piliers » conserve directement l’image cosmologique concrète du texte hébreu.
- source_word: סֶּלָה
  choice: Sélah
  rationale: Le sens précis du terme étant incertain, il est translittéré plutôt que traduit de manière conjecturale.
theological_decisions:
- issue: Image cosmologique des piliers de la terre
  choice: Conserver littéralement « ses piliers »
  alternative: ses fondements / ses appuis
  rationale: Le verset emploie une image poétique ancienne pour présenter l’action stabilisatrice de Dieu. La conserver évite aussi bien une réinterprétation scientifique qu’une paraphrase théologique.
- issue: Valeur temporelle de תִכַּנְתִּי
  choice: j’affermis
  alternative: j’ai affermi / j’ai établi
  rationale: La forme accomplie peut présenter l’action comme établie ou certaine, tandis que le contexte poétique permet un présent français. La variante en note préserve l’autre lecture naturelle sans trancher excessivement.
translation_notes:
  register: Français international moderne, poétique et digne. Le point-virgule met en relief le contraste entre l’instabilité de la terre et l’action stabilisatrice du locuteur. Les trois appels de note figurent dans le texte et suivent l’ordre alphabétique.
