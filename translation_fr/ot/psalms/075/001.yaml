source:
  edition: WLC
  text: ה֘וֹדִ֤ינוּ לְּ/ךָ֨ אֱֽלֹהִ֗ים ה֭וֹדִינוּ וְ/קָר֣וֹב שְׁמֶ֑/ךָ סִ֝פְּר֗וּ נִפְלְאוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/001.yaml
  text: We give thanks to you[a], O God; we give thanks, for your name is near[c][b]; your wondrous deeds are recounted.
translation:
  language: fr
  text: Nous te rendons grâce, ô Dieu, nous te rendons grâce, car ton nom est proche[a] ; on raconte[b] tes actes merveilleux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ton nom est proche » peut évoquer la proximité de Dieu, sa présence manifestée ou son caractère révélé ; l’image hébraïque est conservée sans être réduite à une seule interprétation.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils racontent ». Le verbe hébreu est à la troisième personne du pluriel, sans sujet exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: nous te rendons grâce
  rationale: Le hifil de ידה exprime ici l’action de remercier et de louer Dieu. « Rendre grâce » est naturel dans un psaume et la répétition hébraïque est conservée.
- source_word: לְּךָ אֱלֹהִים
  choice: ô Dieu
  rationale: Le pronom de deuxième personne est intégré à « te rendons grâce », tandis que אֱלֹהִים est compris comme une apostrophe. « Ô Dieu » maintient un registre poétique digne sans être obscur.
- source_word: וְקָרוֹב
  choice: car ... est proche
  rationale: Le waw peut être simplement coordonnant, mais la proposition donne vraisemblablement le motif de l’action de grâce. « Car » rend cette relation naturellement en français sans modifier le contenu de l’affirmation.
- source_word: שְׁמֶךָ
  choice: ton nom
  rationale: La formulation hébraïque est conservée afin de ne pas réduire le « nom » à la seule présence, réputation ou révélation de Dieu.
- source_word: סִפְּרוּ
  choice: on raconte
  rationale: Le verbe est à la troisième personne du pluriel sans sujet exprimé. Le pronom indéfini « on » reproduit naturellement en français cette absence de sujet déterminé.
- source_word: נִפְלְאוֹתֶיךָ
  choice: tes actes merveilleux
  rationale: Le nom désigne les actes extraordinaires de Dieu qui suscitent l’émerveillement. « Actes merveilleux » garde cette dimension concrète.
theological_decisions:
- issue: Sens de « ton nom est proche »
  choice: Conserver littéralement l’expression « ton nom est proche ».
  alternative: « ta présence est proche » ou « ta renommée est proche »
  rationale: Dans les Psaumes, le nom de Dieu peut évoquer sa présence manifestée, son caractère révélé ou sa renommée. Le texte ne tranche pas entre ces nuances ; la traduction préserve donc son ampleur et sa tension théologiques.
- issue: Lien logique introduit par וְ
  choice: Rendre la conjonction par « car ».
  alternative: « et ton nom est proche »
  rationale: La proximité du nom de Dieu peut être comprise comme le motif de l’action de grâce. Ce choix explicite légèrement le rapport le plus probable, tandis que la note principale porte sur l’ambiguïté théologique de l’expression elle-même.
translation_notes:
  register: Français international actuel, poétique et digne. La répétition solennelle est maintenue ; l’indéfini « on » évite d’ajouter au texte un groupe humain précis.
