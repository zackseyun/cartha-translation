source:
  edition: WLC
  text: כִּֽי אֱלֹהִ֥ים שֹׁפֵ֑ט זֶ֥ה יַ֝שְׁפִּ֗יל וְ/זֶ֣ה יָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/007.yaml
  text: 'For God is the judge: he brings one down[b][a], and lifts up another.'
translation:
  language: fr
  text: 'Car Dieu est juge : il abaisse l’un[a] et élève l’autre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Car Dieu juge : il abaisse l’un et élève l’autre. » Le participe hébreu peut exprimer l’action de juger ou désigner Dieu comme juge. L’hébreu dit littéralement : « celui-ci, il l’abaisse, et celui-ci, il l’élève » ; la répétition du démonstratif a ici une valeur distributive.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de l’affirmation précédente ; « Car » exprime naturellement ce lien explicatif.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte et les formes verbales au singulier imposent le sens singulier.
- source_word: שֹׁפֵט
  choice: c’est Dieu qui juge
  rationale: Le participe peut désigner l’action de juger ou la fonction de juge. Cette tournure française naturelle conserve la valeur prédicative et l’accent porté sur Dieu, sans figer le texte dans un titre exclusivement nominal.
- source_word: זֶה … וְזֶה
  choice: l’un … l’autre
  rationale: La répétition du démonstratif a une valeur distributive ; « l’un… l’autre » en rend le contraste en français idiomatique.
- source_word: יַשְׁפִּיל
  choice: il abaisse
  rationale: Le hiphil de שׁפל exprime le fait de rendre bas ou d’abaisser ; ce choix garde le sens causatif et le parallélisme vertical.
- source_word: יָרִים
  choice: élève
  rationale: Le hiphil de רום signifie faire monter ou élever ; « élève » conserve l’image verticale et s’oppose clairement à « abaisse ».
theological_decisions:
- issue: 'Valeur de אֱלֹהִים שֹׁפֵט : action de juger ou désignation de Dieu comme juge'
  choice: c’est Dieu qui juge
  alternative: Dieu est le juge
  rationale: Le participe hébreu permet les deux nuances. La traduction retenue rend directement l’action judiciaire tout en soulignant que Dieu en est l’auteur ; la note préserve explicitement la lecture nominale.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme antithétique et l’image verticale de l’hébreu sont conservés ; la formulation reste accessible sans ajouter de précision doctrinale.
