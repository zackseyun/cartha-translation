  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: fr
  text: Un cœur tortueux s’éloignera de moi ; je ne connaîtrai pas le mal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je n’aurai rien à faire avec le mal ». L’hébreu dit littéralement : « je ne connaîtrai pas le mal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵבָב
  choice: cœur
  rationale: Dans l’anthropologie hébraïque, le terme désigne la personne intérieure, notamment la volonté et la pensée. « Cœur » est transparent en français et conserve la portée morale.
- source_word: עִקֵּשׁ
  choice: tortueux
  rationale: L’adjectif exprime une déviation morale et conserve l’image de ce qui n’est pas droit. « Tortueux » est naturel, digne et moins susceptible que « pervers » d’ajouter une nuance moderne trop particulière.
- source_word: יָסוּר מִמֶּנִּי
  choice: s’éloignera de moi
  rationale: Le verbe סור avec מן indique ici le fait de se détourner ou de se tenir à distance du psalmiste. Cette formulation reste proche de l’hébreu tout en étant idiomatique en français.
- source_word: רָע
  choice: le mal
  rationale: Le mot a ici une portée morale générale. « Le mal » en préserve l’ampleur sans le limiter à un acte ou à une forme précise de méchanceté.
- source_word: לֹא אֵדָע
  choice: je ne connaîtrai pas
  rationale: La traduction formelle conserve le verbe « connaître » et son ambiguïté relationnelle ou expérientielle, tandis que la note explicite son sens possible dans le contexte.
theological_decisions:
- issue: Sens de « connaître » en rapport avec le mal
  choice: Conserver dans le texte la déclaration littérale « je ne connaîtrai pas le mal », qui peut exprimer le refus de toute association avec lui.
  alternative: « Je n’aurai rien à faire avec le mal. »
  rationale: Le verbe ידע peut dépasser la connaissance intellectuelle et désigner une relation ou une participation. Garder « connaître » préserve l’idiome hébreu et la tension du texte sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la métaphore morale de l’hébreu sont conservés ; la note rend explicite l’implication idiomatique possible de « connaître ».
