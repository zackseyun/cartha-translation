source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: fr
  text: De David[a]. Psaume. Je chanterai l’amour fidèle et la justice ; à toi, Yahweh[b], je chanterai tes louanges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « De David » peut indiquer l’auteur, le destinataire ou une association avec David.
    reason: alternative_reading
  - marker: b
    text: Yahweh est le nom divin représenté en hébreu par les quatre consonnes YHWH, souvent rendu traditionnellement par « le SEIGNEUR ».
    reason: translation_clarification
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: Dans une suscription, לְ peut exprimer l’auteur, la destination ou l’association. « De David » est naturel en français et conserve mieux cette ouverture que « par David ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Équivalent français établi et précis pour ce terme désignant un chant psalmique.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression rend à la fois l’amour, la loyauté et la constance souvent impliqués par חֶסֶד, sans le réduire à la seule miséricorde.
- source_word: וּמִשְׁפָּט
  choice: et la justice
  rationale: מִשְׁפָּט peut désigner le jugement ou la justice. Associé ici à חֶסֶד et dans le cadre éthique du psaume, « justice » convient le mieux.
- source_word: אָשִׁירָה
  choice: je chanterai
  rationale: Le cohortatif exprime ici la résolution du psalmiste ; le futur français la rend naturellement.
- source_word: לְךָ
  choice: pour toi
  rationale: Le syntagme désigne celui en l’honneur de qui le psalmiste chante. « Pour toi » est idiomatique en français dans ce contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֲזַמֵּרָה
  choice: je chanterai tes louanges
  rationale: Le verbe זמר désigne le chant ou la musique de louange. Cette formulation naturelle distingue légèrement le second verbe de אָשִׁירָה tout en exprimant sa portée laudative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: miséricorde
  rationale: « Amour fidèle » maintient ensemble les dimensions d’amour, de constance et de loyauté du terme, tandis que « miséricorde » en restreindrait ici la portée.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et la répétition des verbes de chant reflète le parallélisme hébreu sans devenir pesante.
