source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/000.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: fr
  text: De David[a]. Psaume. Je chanterai l’amour fidèle et la justice[b] ; pour toi, Yahweh[c], je chanterai tes louanges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « de David » peut indiquer l’auteur, une dédicace ou une association avec David.
    reason: alternative_reading
  - marker: b
    text: Ou « la bonté et le jugement », ou encore « la miséricorde et le droit ». Les termes hébreux ont une gamme de sens plus large que chacune de ces formulations.
    reason: lexical_alternative
  - marker: c
    text: Yahweh représente le nom divin écrit avec les quatre consonnes YHWH en hébreu.
    reason: name_explanation
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance, la dédicace ou l’association. La formule française traditionnelle et concise « De David » conserve cette ouverture sans trancher.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression rend la fidélité relationnelle et durable souvent portée par חֶסֶד, mieux que le seul mot « bonté » ou « miséricorde » dans ce contexte.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Le terme peut désigner le jugement, le droit ou la justice. « Justice » convient au sens éthique général tout en laissant l’alternative en note.
- source_word: אֲזַמֵּרָה
  choice: je chanterai tes louanges
  rationale: Le verbe זמר désigne ici le chant musical adressé à Dieu. Cette formulation française naturelle explicite sa portée laudative sans introduire d’instrument absent du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Portée de חֶסֶד וּמִשְׁפָּט
  choice: l’amour fidèle et la justice
  alternative: la bonté et le jugement / la miséricorde et le droit
  rationale: Le texte peut évoquer à la fois les qualités et les actes de Dieu, ou les principes qui guideront le roi. La traduction ne précise pas leur agent et préserve ainsi cette tension.
- issue: Sens de la suscription לְדָוִד
  choice: De David
  alternative: Pour David / Au sujet de David / Psaume appartenant à la collection davidique
  rationale: La construction hébraïque ne permet pas à elle seule de déterminer s’il s’agit d’une attribution d’auteur, d’une dédicace ou d’une association.
- issue: Rendu du tétragramme
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Employer le nom translittéré distingue le nom propre divin des titres, sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La suscription reste brève. Le parallélisme des deux formes de « chanter » est conservé, tandis que « tes louanges » donne à la seconde une tournure française naturelle correspondant à la valeur laudative de זמר.
