id: PSA.101.3
reference: Psalms 101:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: fr
  text: Je ne placerai rien de vil devant mes yeux[a]. Je hais la conduite de ceux qui s’écartent[b] ; elle ne s’attachera pas à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rien de sans valeur », « aucune chose mauvaise » ou « aucune chose de Bélial ». Ici, le mot hébreu בְּלִיַּעַל désigne très probablement ce qui est vil ou sans valeur plutôt qu’un nom propre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les actes de ceux qui se détournent », « l’œuvre des apostats » ou « la conduite des pervers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: je placerai
  rationale: Le qal inaccompli à la première personne du singulier de שׂים signifie « mettre, placer ». Le futur français exprime ici la ferme résolution du psalmiste.
- source_word: לְנֶגֶד עֵינַי
  choice: devant mes yeux
  rationale: Cette formulation conserve l’image concrète de ce que le psalmiste choisit de mettre sous son regard.
- source_word: דְּבַר בְּלִיָּעַל
  choice: rien de vil
  rationale: דבר désigne ici une chose ou une affaire, tandis que בליעל qualifie très probablement ce qui est indigne, mauvais ou sans valeur. « Rien de vil » rend naturellement la portée morale de l’expression sans faire de Bélial un nom propre.
- source_word: עֲשֹׂה סֵטִים
  choice: la conduite de ceux qui s’écartent
  rationale: עֲשֹׂה évoque l’action, l’œuvre ou la pratique, et סֵטִים ceux qui dévient ou se détournent. « La conduite de ceux qui s’écartent » préserve l’image de la déviation morale tout en restant idiomatique en français.
- source_word: שָׂנֵאתִי
  choice: je hais
  rationale: Le parfait exprime ici une attitude arrêtée et durable. Le présent français en restitue clairement la valeur.
- source_word: לֹא יִדְבַּק בִּי
  choice: elle ne s’attachera pas à moi
  rationale: דבק signifie « s’attacher, adhérer, rester collé ». Le pronom féminin reprend naturellement « la conduite » et conserve la métaphore de quelque chose qui chercherait à adhérer au psalmiste.
theological_decisions:
- issue: Sens de בְּלִיַּעַל
  choice: 'Nom commun à valeur qualificative : « vil »'
  alternative: 'Nom propre : « Bélial »'
  rationale: Dans ce contexte, דְּבַר בְּלִיָּעַל désigne le plus naturellement une chose vile, mauvaise ou sans valeur. La traduction évite donc d’introduire la personnification plus tardive de Bélial, sans exclure cette possibilité de l’apparat de notes.
- issue: Identité de ceux qui sont désignés par סֵטִים
  choice: Ceux qui s’écartent
  alternative: Les apostats ou les pervers
  rationale: Le choix retenu conserve l’image verbale de personnes qui dévient, sans préciser plus que l’hébreu la nature exacte ou le degré de leur infidélité.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme de la résolution personnelle, l’image concrète du regard et celle d’une conduite mauvaise qui pourrait s’attacher au psalmiste.
