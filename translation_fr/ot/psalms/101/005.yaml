  source_fidelity: La première clause rend bien מְלָשְׁנִי בַסֵּתֶר רֵעֵהוּ (« celui qui calomnie son prochain en secret »). En revanche, אַצְמִית est un hiphil à portée sévère (« je détruirai / ferai périr / retrancherai ») et non simplement « je réduirai au silence ». Cette dernière formulation restreint indûment l’acte de jugement à l’arrêt de la parole calomnieuse. La seconde clause rend fidèlement les deux idiomes d’arrogance et לֹא אוּכָל exprime naturellement le refus de supporter ou de tolérer.
  naturalness: Le français est naturel, digne et accessible. « Je le détruirai » est plus direct et fidèle que « je le réduirai au silence »; dans ce contexte poétique et judiciaire, il reste idiomatique. « Le regard hautain et le cœur orgueilleux » restitue avec fluidité les images hébraïques.
  terminology: « Calomnie », « son prochain », « hautain » et « orgueilleux » conviennent. La note sur les idiomes doit donner une formulation littérale plus exacte et moins artificielle que « celui qui est haut d’yeux ».
