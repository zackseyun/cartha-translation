  text: מלושני בַ/סֵּ֨תֶר רֵעֵ/הוּ֮ אוֹת֪/וֹ אַ֫צְמִ֥ית גְּֽבַהּ עֵ֭ינַיִם וּ/רְחַ֣ב לֵבָ֑ב אֹ֝ת֗/וֹ לֹ֣א אוּכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: fr
  text: Celui qui calomnie son prochain en secret, je le détruirai[a] ; celui qui a le regard hautain et le cœur orgueilleux, je ne le supporterai pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je le retrancherai » ou « je le ferai périr ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « haut des yeux et large de cœur » ; ces images hébraïques décrivent un regard arrogant et une disposition intérieure orgueilleuse.'
    reason: cultural_note
lexical_decisions:
- source_word: מְלוֹשְׁנִי
  choice: Celui qui calomnie
  rationale: Le participe employé comme substantif désigne quiconque tient des propos malveillants contre autrui. « Calomnie » rend précisément la gravité de לשׁן.
- source_word: בַסֵּתֶר
  choice: en secret
  rationale: L’expression signifie littéralement « dans le lieu caché » et décrit une action dissimulée.
- source_word: רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ désigne ici une personne proche dans le cadre social, sans impliquer nécessairement une amitié intime.
- source_word: אַצְמִית
  choice: je le réduirai au silence
  rationale: Le hiphil de צמת peut exprimer l’anéantissement ou le fait de faire cesser. Dans ce contexte de calomnie, « réduire au silence » conserve un lien verbal naturel, tandis qu’une note signale le sens plus sévère possible.
- source_word: גְּבַהּ עֵינַיִם
  choice: le regard hautain
  rationale: Littéralement « haut d’yeux », cette image hébraïque désigne l’arrogance visible dans le regard ou l’attitude.
- source_word: וּרְחַב לֵבָב
  choice: le cœur plein d’orgueil
  rationale: Littéralement « large de cœur » ; dans ce contexte, l’expression évoque une disposition arrogante, non la générosité.
- source_word: לֹא אוּכָל
  choice: je ne le supporterai pas
  rationale: Littéralement « je ne peux pas », avec l’idée implicite de tolérer la personne en question. La formulation française exprime à la fois l’impossibilité morale et le refus.
theological_decisions:
- issue: Portée du jugement dans cette déclaration royale et éthique
  choice: Le locuteur affirme qu’il fera cesser le calomniateur et qu’il refusera de tolérer l’orgueilleux, sans préciser le moyen exact du jugement.
  alternative: Comprendre אַצְמִית comme une promesse explicite de détruire ou de retrancher physiquement le coupable.
  rationale: Le verbe est sévère et peut aller jusqu’à l’anéantissement, mais le texte ne précise pas la procédure. Le corps du texte conserve une lecture contextuelle naturelle et la note maintient ouverte l’interprétation plus forte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est préservé, avec un vocabulaire accessible. Les deux marqueurs de note figurent dans le texte principal.
