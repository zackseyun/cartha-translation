  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: fr
  text: Chaque matin, je détruirai tous les méchants du pays[a], afin de retrancher de la ville de Yahweh[b] tous ceux qui commettent l’injustice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Le mot hébreu peut avoir les deux sens; « pays » convient au cadre royal du psaume.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ». On trouve aussi les formes « Yahvé » et « Jéhovah ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Chaque matin
  rationale: Le pluriel précédé de la préposition et de l’article a ici une valeur distributive et exprime une action répétée.
- source_word: אַצְמִית
  choice: je réduirai au silence
  rationale: Le hiphil de צמת peut signifier faire disparaître ou détruire; « réduire au silence » conserve l’image lexicale et, dans ce contexte judiciaire, implique la suppression des méchants sans préciser davantage le moyen.
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: tous les méchants du pays
  rationale: רִשְׁעֵי désigne substantivement les méchants. אָרֶץ peut désigner le pays ou la terre; le cadre royal et la mention de la ville de Yahweh favorisent ici « pays ».
- source_word: לְהַכְרִית
  choice: afin de retrancher
  rationale: L’infinitif hiphil exprime naturellement le but de l’action précédente; « retrancher » garde la force judiciaire de כרת.
- source_word: מֵעִיר יְהוָה
  choice: de la ville de Yahweh
  rationale: La formulation reproduit sobrement la relation exprimée en hébreu entre la ville et le nom divin.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: tous ceux qui commettent l’injustice
  rationale: Cette formulation française naturelle rend le sens concret de « tous les faiseurs d’אָוֶן », אָוֶן désignant ici l’injustice ou le mal.
theological_decisions:
- issue: Portée de אָרֶץ
  choice: pays
  alternative: terre
  rationale: Le locuteur royal entend purifier son domaine, en particulier la ville de Yahweh; « terre » demeure néanmoins possible lexicalement.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin; sa translittération préserve cette distinction plutôt que de lui substituer un titre.
- issue: Force de אַצְמִית
  choice: réduirai au silence
  alternative: détruirai
  rationale: Le verbe peut exprimer l’anéantissement ou la destruction, mais sa nuance première permet une formulation qui conserve l’image sans atténuer la sévérité de l’action royale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme du verset tout en évitant le calque « ouvriers d’iniquité », peu naturel en français courant.
