source:
  edition: WLC
  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: fr
  text: Je serai attentif à la voie de l’intégrité[b] — quand viendras-tu à moi[a] ? Je marcherai d’un cœur intègre dans ma maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit : « quand viendras-tu à moi ? » Le sujet n’est pas explicite ; beaucoup y voient une adresse à Dieu.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Je considérerai la voie de l’intégrité » ou « Je me conduirai avec sagesse dans une voie irréprochable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Je veillerai à suivre
  rationale: Le hiphil de שׂכל peut exprimer une conduite avisée ou une attention réfléchie. « Veiller à suivre » rend ici l’engagement volontaire envers une manière de vivre, sans réduire le verbe à une simple réflexion intellectuelle.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: une voie irréprochable
  rationale: דֶּרֶךְ porte la métaphore éthique de la « voie », et תָּמִים évoque l’intégrité ou une conduite sans reproche plutôt qu’une perfection absolue.
- source_word: מָתַי תָּבוֹא אֵלַי
  choice: quand viendras-tu à moi ?
  rationale: Le verbe est à la deuxième personne du masculin singulier, mais son sujet n’est pas nommé. La traduction directe conserve cette adresse sans identifier explicitement l’interlocuteur.
- source_word: אֶתְהַלֵּךְ
  choice: Je marcherai
  rationale: Le hitpael de הלך désigne ici la manière de vivre. « Marcher » conserve la métaphore biblique tout en restant intelligible en français moderne.
- source_word: בְּתָם לְבָבִי
  choice: d’un cœur intègre
  rationale: תֹּם exprime l’intégrité, la droiture ou l’entièreté intérieure. Cette formulation française est naturelle et maintient l’accent sur la sincérité morale du cœur.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: au sein de ma maison
  rationale: בְּקֶרֶב signifie littéralement « au milieu de » ou « à l’intérieur de ». « Au sein de ma maison » rend naturellement la sphère domestique.
theological_decisions:
- issue: Sujet implicite de « quand viendras-tu à moi ? »
  choice: Conserver l’adresse à la deuxième personne sans nommer son destinataire dans le texte principal.
  alternative: Comprendre que le psalmiste s’adresse explicitement à Dieu, ou rattacher plus librement la proposition à la venue de la voie irréprochable.
  rationale: L’hébreu emploie une forme verbale masculine singulière à la deuxième personne, sans sujet explicite. Dieu est souvent compris comme le destinataire, mais le texte principal ne doit pas résoudre silencieusement cette implicitation.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores de la voie, de la marche et du cœur sont conservées. « Irréprochable » et « intègre » rendent la plénitude morale sans suggérer nécessairement une perfection absolue.
