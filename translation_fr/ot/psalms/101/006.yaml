source:
  edition: WLC
  text: עֵינַ֤/י בְּ/נֶֽאֶמְנֵי אֶרֶץ֮ לָ/שֶׁ֪בֶת עִמָּ֫דִ֥/י הֹ֭לֵךְ בְּ/דֶ֣רֶךְ תָּמִ֑ים ה֝֗וּא יְשָׁרְתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: fr
  text: Mes yeux seront sur les fidèles du pays, pour qu’ils demeurent auprès de moi[a]. Celui qui marche dans une voie intègre[b], c’est lui qui me servira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’asseoir avec moi ». Le verbe hébreu peut signifier « s’asseoir » ou « demeurer » ; il évoque probablement ici une présence durable auprès du roi.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la voie de l’intégrité ». « Intègre » désigne ici une conduite droite et irréprochable, non une perfection absolue.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: J’aurai les yeux sur
  rationale: Conserve l’image concrète de l’hébreu et exprime une attention favorable. Le futur convient à la série de résolutions royales du psaume.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: les gens fidèles du pays
  rationale: נֶאֱמָן désigne ici des personnes fidèles ou dignes de confiance; «du pays» renvoie naturellement au territoire ou au royaume.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: pour qu’ils demeurent auprès de moi
  rationale: Le verbe יָשַׁב peut signifier «s’asseoir» ou «demeurer». Dans ce contexte royal, «demeurer auprès de moi» laisse entendre une association suivie sans la réduire à une fonction officielle.
- source_word: הֹלֵךְ בְּדֶרֶךְ תָּמִים
  choice: Celui qui suit une voie intègre
  rationale: Le participe décrit une conduite habituelle. «Suivre une voie» rend naturellement la métaphore de la marche, tandis qu’«intègre» exprime l’idée de totalité morale et de droiture, non d’absence absolue de péché.
- source_word: הוּא
  choice: c’est lui
  rationale: La tournure détachée rend l’insistance du pronom hébreu sur la personne ainsi qualifiée.
- source_word: יְשָׁרְתֵנִי
  choice: qui me servira
  rationale: שׁרת évoque un service personnel, éventuellement à la cour. «Servir» reste naturel et ne lui impose pas une coloration ecclésiastique.
theological_decisions:
- issue: Qualification morale des proches ou serviteurs du roi
  choice: Le verset présente les personnes fidèles comme objet du regard favorable du psalmiste et l’homme intègre comme apte à le servir.
  alternative: On peut comprendre plus précisément qu’il s’agit de la sélection de fonctionnaires de la cour.
  rationale: Les expressions «demeurer auprès de moi» et «me servir» permettent à la fois l’idée d’une proximité durable et celle d’un service officiel; la traduction ne tranche pas artificiellement entre ces dimensions.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur exprime la résolution du roi; le parallélisme et l’insistance de הוּא sont conservés sans lourdeur.
