source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: fr
  text: Celui qui pratique la tromperie[a] n’habitera pas dans ma maison ; celui qui profère des mensonges ne se tiendra pas devant mes yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui fait la tromperie » ; l’expression désigne une conduite trompeuse habituelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne sera pas établi devant mes yeux ». Le verbe hébreu peut signifier « être établi », « être affermi » ou « se tenir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: n’habitera pas
  rationale: Dans le cadre de « ma maison », le verbe exprime naturellement le fait d’habiter ou de demeurer, plutôt que la simple posture assise.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: au milieu de ma maison
  rationale: Cette formulation conserve l’image spatiale de בְּקֶרֶב tout en restant claire et digne en français moderne.
- source_word: עֹשֵׂה רְמִיָּה
  choice: celui qui pratique la tromperie
  rationale: Le participe décrit une conduite caractéristique ou habituelle ; « pratique la tromperie » préserve cette nuance mieux que le simple nom « trompeur ».
- source_word: דֹּבֵר שְׁקָרִים
  choice: celui qui profère des mensonges
  rationale: Le participe et le pluriel hébreux sont maintenus ; « profère » rend une conduite verbale répétée dans un registre actuel et digne.
- source_word: יִכּוֹן
  choice: ne se tiendra pas
  rationale: Le niphal de כון peut signifier être établi, affermi ou se maintenir. Ici, « se tenir » convient à la présence personnelle ou royale suggérée par « devant mes yeux », sans effacer l’ambiguïté lexicale.
- source_word: לְנֶגֶד עֵינַי
  choice: devant mes yeux
  rationale: La traduction conserve l’image hébraïque exacte et sa portée personnelle et évaluative.
theological_decisions:
- issue: Portée de l’exclusion prononcée par le locuteur
  choice: Une résolution personnelle ou royale concernant ceux qui peuvent habiter dans la maison du psalmiste et demeurer en sa présence.
  alternative: Une affirmation générale concernant la maison de Dieu, ou une métaphore de la pureté intérieure.
  rationale: Les possessifs « ma maison » et « mes yeux » sont maintenus sans identifier silencieusement le locuteur à Dieu ni spiritualiser son propos.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux participes est conservé par « celui qui… celui qui… ». Les marqueurs de notes suivent l’expression précise qu’ils éclairent.
