  text: I am for peace[a]; but when I speak[b], they are for war.
translation:
  language: fr
  text: Moi, je suis pour la paix[a] ; mais quand je parle[b], eux sont pour la guerre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « moi — paix » ; la traduction rend cette tournure par « je suis pour la paix ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et quand je parle » ; la conjonction hébraïque peut se comprendre plus simplement, mais le contexte favorise ici un sens contrastif.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, je
  rationale: Le pronom de première personne est exprimé et mis en relief en hébreu ; « Moi, je » rend naturellement cette insistance en français.
- source_word: שָׁלוֹם
  choice: je suis pour la paix
  rationale: La proposition nominale signifie littéralement « moi — paix ». Cette formulation française exprime l’attachement du psalmiste à la paix sans donner à la phrase un sens ontologique.
- source_word: וְכִי
  choice: mais quand
  rationale: La conjonction et la particule peuvent se lire plus simplement « et quand », mais le contraste contextuel entre la paix du locuteur et l’attitude guerrière de ses adversaires favorise « mais quand ».
- source_word: אֲדַבֵּר
  choice: je parle
  rationale: L’imparfait piel à la première personne se rend ici naturellement par un présent. Ajouter « de paix » expliciterait un objet absent de l’hébreu.
- source_word: הֵמָּה
  choice: eux
  rationale: Le pronom indépendant est emphatique. Le français « eux » maintient le contraste marqué avec « moi ».
- source_word: לַמִּלְחָמָה
  choice: sont pour la guerre
  rationale: La préposition ל exprime ici l’orientation ou la disposition. « Pour la guerre » forme un parallèle bref et clair avec « pour la paix ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme « pour la paix / pour la guerre » est conservé, ainsi que l’opposition emphatique « Moi… eux ».
