lexical_decisions:
- source_word: חִצֵּי
  choice: des flèches de
  rationale: Le pluriel construit de חֵץ introduit le possesseur ou l’agent associé, exprimé naturellement en français par « des flèches d’un guerrier ».
- source_word: גִבּוֹר
  choice: un guerrier
  rationale: Dans cette image martiale, גִבּוֹר désigne naturellement un homme fort au combat; « guerrier » est précis et courant.
- source_word: שְׁנוּנִים
  choice: acérées
  rationale: Le terme décrit des flèches aiguisées ou affûtées. « Acérées » restitue cette qualité avec une formulation poétique naturelle.
- source_word: עִם
  choice: avec
  rationale: La préposition associe directement les deux images de jugement sans préciser davantage leur relation.
- source_word: גַּחֲלֵי
  choice: des braises de
  rationale: גַּחֲלֵי désigne des charbons incandescents ou des braises. « Braises » rend le terme de façon concise sans ajouter un adjectif absent de l’hébreu.
- source_word: רְתָמִים
  choice: genêt
  rationale: רְתָמִים désigne le rétem, arbuste désertique traditionnellement rendu par « genêt » en français; le singulier générique convient pour l’espèce et son combustible.
