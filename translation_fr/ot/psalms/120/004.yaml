  text: Sharp arrows of a warrior[b][a], with coals of the broom tree.
translation:
  language: fr
  text: 'Des flèches acérées d’un guerrier,

    avec des braises de genêt[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « genêt » (hébreu rétem) est un arbuste des régions désertiques dont le charbon conserve longtemps sa chaleur.
