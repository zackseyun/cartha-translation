  text: רַ֭בַּת שָֽׁכְנָה לָּ֣/הּ נַפְשִׁ֑/י עִ֝֗ם שׂוֹנֵ֥א שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/006.yaml
  text: My soul has long dwelt with one who hates peace[a].
translation:
  language: fr
  text: Depuis longtemps, mon âme habite avec celui qui déteste la paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon âme habite depuis trop longtemps avec celui qui déteste la paix. » Le début du verset hébreu souligne la longue durée et peut aussi laisser entendre que celle-ci est excessive.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: Depuis longtemps
  rationale: Employé avec le verbe suivant, le terme exprime ici une longue durée. « Depuis longtemps » rend cette durée naturellement, sans imposer dans le texte l'idée possible, mais non explicite, d'une durée excessive.
- source_word: שָׁכְנָה
  choice: habite
  rationale: Le verbe שכן signifie habiter ou résider. Le présent français, associé à « depuis longtemps », exprime une situation commencée dans le passé et toujours pertinente.
- source_word: לָּהּ
  choice: non rendu séparément
  rationale: Le suffixe féminin singulier est syntaxiquement difficile et peut être compris comme une reprise pléonastique de נַפְשִׁי. Le rendre séparément produirait une formulation française artificielle.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Cette formulation conserve l'image poétique et la texture anthropologique de l'hébreu, plutôt que de réduire le terme à « je ».
- source_word: עִם
  choice: avec
  rationale: La préposition exprime directement l'association ou la coexistence.
- source_word: שׂוֹנֵא
  choice: celui qui déteste
  rationale: Le participe décrit une disposition caractéristique. Cette tournure conserve sa force verbale et reste naturelle en français.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: Dans ce contexte d'hostilité et de relations humaines, « paix » est le sens le plus clair, tout en restant fidèle au champ sémantique du terme.
