  text: יְֽהוָ֗ה הַצִּ֣ילָ/ה נַ֭פְשִׁ/י מִ/שְּׂפַת שֶׁ֑קֶר מִ/לָּשׁ֥וֹן רְמִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/002.yaml
  text: O Yahweh[a], deliver my soul from lying lips[b], from a deceitful tongue.
translation:
  language: fr
  text: 'Yahweh, délivre-moi des lèvres mensongères,

    d’une langue trompeuse.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de le remplacer par un titre, conformément à la valeur propre du tétragramme.
- source_word: הַצִּילָה נַפְשִׁי
  choice: délivre-moi
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne elle-même. « Délivre-moi » est naturel en français et restitue directement la supplication sans introduire une opposition entre âme et corps.
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: des lèvres mensongères
  rationale: Conserve l’image concrète des lèvres et rend idiomatiquement le groupe construit exprimant la fausseté.
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: d’une langue trompeuse
  rationale: Préserve le parallélisme poétique entre « lèvres » et « langue » ainsi que l’idée de tromperie portée par רְמִיָּה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom personnel est conservé par translittération, sans lui substituer un titre.
- issue: Portée de נַפְשִׁי
  choice: moi
  alternative: mon âme / ma vie
  rationale: Ici, נֶפֶשׁ peut désigner l’être ou la personne tout entière. Le français « moi » évite de préciser indûment une anthropologie particulière.
translation_notes:
  register: Français moderne, sobre et digne. L’apostrophe est directe; le parallélisme hébreu et les images corporelles des « lèvres » et de la « langue » sont maintenus. La mise en deux lignes souligne la structure poétique.
