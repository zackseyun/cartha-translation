  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֶל יְ֭הוָה בַּ/צָּרָ֣תָ/ה לִּ֑/י קָ֝רָ֗אתִי וַֽ/יַּעֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/001.yaml
  text: A Song of Ascents. In my distress I called to Yahweh[a], and he answered me.
translation:
  language: fr
  text: Chant des montées[a]. Dans ma détresse, j’ai fait appel à Yahweh, et il m’a répondu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Titre hébreu : « Chant des montées », suscription traditionnelle des Psaumes 120 à 134 ; on peut aussi traduire : « Chant des ascensions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Chant
  rationale: Le nom désigne directement un chant. « Chant » convient au registre des suscriptions psalmiques tout en restant plus proche de l’hébreu que « psaume ».
- source_word: הַמַּעֲלוֹת
  choice: des montées
  rationale: Cette expression traditionnelle peut évoquer des ascensions ou le fait de monter. « Des montées » conserve cette image de mouvement vers le haut sans imposer une explication historique particulière.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: Avec « appeler », la direction exprimée par אֶל est rendue naturellement par la construction française directe. Le nom divin יהוה est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: בַּצָּרָתָה לִּי
  choice: Dans ma détresse
  rationale: L’expression signifie littéralement « dans la détresse pour moi ». « Dans ma détresse » en donne le sens idiomatique et conserve son intensité.
- source_word: קָרָאתִי
  choice: j’ai appelé
  rationale: Le verbe signifie « appeler ». Cette traduction évite d’ajouter l’intensité de « crier », même si le contexte de détresse peut la suggérer.
- source_word: וַיַּעֲנֵנִי
  choice: et il m’a répondu
  rationale: La forme verbale fait avancer le récit et son suffixe signifie « me ». Le sujet implicite renvoie à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte hébreu emploie le nom propre divin. Sa translittération préserve ce nom au lieu de lui substituer un titre; « Yahweh » suit la forme retenue par le projet.
- issue: Identification des « montées »
  choice: Ne pas préciser leur référent
  alternative: montées vers Jérusalem / degrés / marches
  rationale: La suscription ne précise pas s’il s’agit de pèlerinages, de marches ou d’un autre type de montée. La traduction conserve cette ouverture.
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste proche de la brièveté hébraïque; la note explique la suscription sans trancher son origine ou son usage précis.
