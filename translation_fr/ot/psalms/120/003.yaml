  text: מַה יִּתֵּ֣ן לְ֭/ךָ וּ/מַה יֹּסִ֥יף לָ֗/ךְ לָשׁ֥וֹן רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: fr
  text: Que te donnera-t-il[a], et que t’ajoutera-t-il encore, langue trompeuse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que te fera-t-il, et que te fera-t-il encore, langue trompeuse ? » Le sujet sous-entendu peut être compris de manière générale, bien que beaucoup y voient Dieu exerçant son jugement dans ce contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יִּתֵּן לְךָ
  choice: Que te donnera-t-il
  rationale: La question directe conserve le verbe נתן (« donner ») et laisse implicite l’identité du sujet masculin, comme en hébreu.
- source_word: וּמַה יֹּסִיף לָךְ
  choice: et que t’ajoutera-t-il encore
  rationale: « Ajoutera » préserve la valeur lexicale de יסף, tandis que « encore » rend naturellement sa nuance additive en français.
- source_word: לָשׁוֹן רְמִיָּה
  choice: langue trompeuse
  rationale: L’apostrophe littérale maintient l’image poétique de la langue comme représentation de la parole mensongère; « trompeuse » exprime la fraude sans surinterprétation.
theological_decisions:
- issue: Identité du sujet implicite des verbes
  choice: Maintenir « il » sans identifier le sujet
  alternative: Expliciter Dieu comme sujet de son jugement
  rationale: Les formes verbales ont un sujet masculin singulier non exprimé. Le contexte peut suggérer Dieu, mais le verset ne le nomme pas; la traduction conserve donc cette ambiguïté.
translation_notes:
  register: Français moderne, poétique et digne. L’inversion interrogative soutient le caractère rhétorique du verset, et l’apostrophe « langue trompeuse » conserve son image vive.
