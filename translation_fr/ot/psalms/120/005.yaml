  text: אֽוֹיָה לִ֭/י כִּי גַ֣רְתִּי מֶ֑שֶׁךְ שָׁ֝כַ֗נְתִּי עִֽם אָהֳלֵ֥י קֵדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: fr
  text: Malheur à moi ! Car j’ai séjourné à Méshek[a], j’ai habité parmi[b] les tentes de Qédar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Méshek et Qédar peuvent évoquer poétiquement des peuples lointains et hostiles, sans signifier que le psalmiste ait littéralement vécu auprès de l’un et de l’autre.
    reason: cultural_note
  - marker: b
    text: 'Ou : « avec les tentes de Qédar ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: Malheur à moi !
  rationale: Cette exclamation française conserve la force brève et personnelle de la lamentation hébraïque.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la cause de la plainte et convient au registre poétique.
- source_word: גַרְתִּי
  choice: j’ai séjourné
  rationale: Le verbe גור évoque le séjour d’une personne étrangère ou non établie, nuance que « séjourner » préserve mieux que le simple « vivre ».
- source_word: מֶשֶׁךְ
  choice: Méshek
  rationale: Le nom propre est translittéré selon une forme lisible en français, sans remplacer l’image géographique et poétique par une interprétation.
- source_word: שָׁכַנְתִּי
  choice: j’ai habité
  rationale: Le verbe שכן désigne le fait de demeurer ou d’habiter; ce choix naturel en français le distingue du séjour d’étranger exprimé dans le premier membre.
- source_word: עִם אָהֳלֵי
  choice: parmi les tentes de
  rationale: עִם signifie littéralement « avec », mais, dans ce contexte de résidence, « parmi » exprime naturellement la présence au milieu des campements tout en conservant l’image concrète des tentes.
- source_word: קֵדָר
  choice: Qédar
  rationale: Le nom propre est translittéré sous une forme française usuelle et maintient la référence au peuple arabe associé aux tentes.
theological_decisions:
- issue: Faut-il rendre Méshek et Qédar comme des noms propres ou expliciter dans le texte des peuples lointains et hostiles ?
  choice: Conserver les noms propres dans le texte principal.
  alternative: Traduire de manière interprétative par « des peuples lointains et hostiles » ou présenter ces noms comme de purs symboles.
  rationale: L’hébreu nomme explicitement Méshek et Qédar. Les conserver respecte l’imagerie historique et poétique ainsi que l’ambiguïté entre localisation réelle et évocation littéraire de l’éloignement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé, de même que le contraste entre « séjourner » comme étranger et « habiter ». Les noms propres restent translittérés et l’image concrète des tentes n’est pas explicitée dans le corps du verset.
