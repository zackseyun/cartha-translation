  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֶל יְ֭הוָה בַּ/צָּרָ֣תָ/ה לִּ֑/י קָ֝רָ֗אתִי וַֽ/יַּעֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/000.yaml
  text: A Song of Ascents. To Yahweh in my distress I called[a], and he answered me.
translation:
  language: fr
  text: Chant des montées[a]. Dans ma détresse, j’ai crié vers Yahvé, et il m’a répondu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Titre hébreu traditionnel des psaumes 120–134; on peut aussi traduire: «Chant des ascensions» ou «Chant des degrés».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend le titre traditionnel de la collection des psaumes 120–134 tout en conservant l’image de mouvements vers le haut portée par מַעֲלוֹת.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français moderne le nom divin personnel représenté par le tétragramme, plutôt que de le remplacer par un titre.
- source_word: בַּצָּרָתָה לִּי
  choice: Dans ma détresse
  rationale: Expression française naturelle qui restitue l’idée d’une situation d’angoisse ou d’adversité touchant personnellement le psalmiste.
- source_word: קָרָאתִי
  choice: j’ai crié
  rationale: Le verbe קרא, construit avec אֶל, désigne ici un appel pressant adressé à Yahvé; «crié vers» en préserve l’intensité.
- source_word: וַיַּעֲנֵנִי
  choice: et il m’a répondu
  rationale: Conserve la coordination narrative et l’affirmation directe de la réponse divine.
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte source emploie le nom propre divin; sa translittération préserve cette distinction sans introduire une substitution confessionnelle.
- issue: Temporalité de la réponse divine
  choice: «il m’a répondu», comme événement accompli
  alternative: «il me répond» ou une lecture optative
  rationale: La forme verbale וַיַּעֲנֵנִי présente la réponse comme accomplie dans la séquence du récit.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre des mots a été légèrement réorganisé pour une syntaxe française naturelle, sans modifier la relation entre la détresse, l’appel adressé à Yahvé et sa réponse.
