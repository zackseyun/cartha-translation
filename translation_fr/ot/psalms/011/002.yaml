id: PSA.11.2
reference: Psalms 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה הָ/רְשָׁעִ֡ים יִדְרְכ֬וּ/ן קֶ֗שֶׁת כּוֹנְנ֣וּ חִצָּ֣/ם עַל יֶ֑תֶר לִ/יר֥וֹת בְּמוֹ אֹ֝֗פֶל לְ/יִשְׁרֵי לֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/002.yaml
  text: For look[a], the wicked bend the bow; they have fitted their arrow to the string to shoot in the darkness at the upright in heart.
translation:
  language: fr
  text: 'Car voici : les méchants bandent leur arc ; ils ont placé leur flèche sur la corde, pour tirer dans l’obscurité[a] sur ceux dont le cœur est droit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis l’obscurité ». L’expression hébraïque peut souligner soit le cadre obscur de l’attaque, soit le lieu caché d’où elle est lancée.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: « Car » maintient le lien explicatif avec le verset précédent, tandis que « voici » attire vivement l’attention sur la menace imminente.
- source_word: הָרְשָׁעִים
  choice: les méchants
  rationale: Désigne ici des adversaires moralement mauvais, et non simplement des personnes reconnues coupables sur le plan juridique.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: bandent leur arc
  rationale: Expression française naturelle pour l’action de courber et de préparer l’arc avant le tir.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: ils ont placé leur flèche sur la corde
  rationale: Rend concrètement la préparation délibérée du projectile. Le singulier « leur flèche » suit la forme hébraïque et conserve l’image poétique d’un tir prêt à partir.
- source_word: לִירוֹת
  choice: pour tirer
  rationale: Rend directement l’infinitif employé dans son sens technique lié au tir à l’arc.
- source_word: בְּמוֹ אֹפֶל
  choice: dans l’obscurité
  rationale: Exprime naturellement le cadre obscur et clandestin de l’attaque, tout en signalant en note l’autre nuance possible, celle du lieu caché d’où part le tir.
- source_word: לְיִשְׁרֵי לֵב
  choice: sur ceux dont le cœur est droit
  rationale: Préserve la métaphore biblique du cœur comme siège de l’intégrité morale, dans une formulation française claire et actuelle.
