id: PSA.11.5
reference: Psalms 11:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָה֮ צַדִּ֪יק יִ֫בְחָ֥ן וְ֭/רָשָׁע וְ/אֹהֵ֣ב חָמָ֑ס שָֽׂנְאָ֥ה נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/005.yaml
  text: Yahweh tests the righteous[a], but his soul hates the wicked and the one who loves violence.
translation:
  language: fr
  text: Yahweh examine le juste, mais son âme déteste le méchant et celui qui aime la violence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « son âme déteste », expression qui souligne une aversion profonde et personnelle. On pourrait rendre plus simplement : « mais il déteste le méchant et celui qui aime la violence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé désigne ici, au singulier générique, une personne caractérisée par la justice.
- source_word: יִבְחָן
  choice: examine
  rationale: Le verbe בחן exprime l’idée de mettre à l’épreuve ou d’examiner. « Examine » conserve ici la dimension évaluative sans suggérer nécessairement une épreuve pénible.
- source_word: וְרָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé, parallèle à « le juste », désigne une personne caractérisée par sa méchanceté.
- source_word: וְאֹהֵב חָמָס
  choice: celui qui aime la violence
  rationale: Le participe décrit une personne caractérisée par son attachement habituel à la violence.
- source_word: חָמָס
  choice: violence
  rationale: Le nom peut évoquer la violence et l’injustice violente ; « violence » est direct et convient au contexte.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: son âme déteste
  rationale: Cette formulation conserve l’expression hébraïque emphatique, qui attribue à Yahweh une aversion profonde et personnelle, au lieu de la réduire au simple « il déteste ».
theological_decisions:
- issue: Référent et portée de « son âme » dans la dernière proposition
  choice: « son âme » renvoie à Yahweh et exprime son aversion personnelle profonde
  alternative: « il déteste », formulation plus fluide qui omet la mention de l’âme
  rationale: L’hébreu attribue explicitement la haine à la נֶפֶשׁ de Yahweh. Garder cette expression préserve sa force anthropomorphique et théologique sans spéculer davantage sur la nature des passions divines.
translation_notes:
  register: Français international moderne, clair et digne. La structure reste proche de l’hébreu, tandis que « examine » offre ici une formulation naturelle pour l’action évaluative exprimée par בחן.
