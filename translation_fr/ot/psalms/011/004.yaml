  text: יְהוָ֤ה בְּֽ/הֵ֘יכַ֤ל קָדְשׁ֗/וֹ יְהוָה֮ בַּ/שָּׁמַ֪יִם כִּ֫סְא֥/וֹ עֵינָ֥י/ו יֶחֱז֑וּ עַפְעַפָּ֥י/ו יִ֝בְחֲנ֗וּ בְּנֵ֣י אָדָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: fr
  text: Yahvé est dans son saint temple ; Yahvé — son trône est dans les cieux. Ses yeux voient, ses paupières examinent les êtres humains.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: dans son saint temple
  rationale: הֵיכָל peut désigner un palais ou un temple. « Temple » conserve naturellement l’image de la demeure sacrée, sans décider s’il s’agit exclusivement du sanctuaire terrestre ou céleste.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: son trône est dans les cieux
  rationale: Le pluriel français « les cieux » correspond à la forme hébraïque et convient au registre poétique du psaume.
- source_word: עֵינָיו יֶחֱזוּ
  choice: Ses yeux voient
  rationale: « Voient » rend directement חזה dans un français actuel tout en conservant l’anthropomorphisme et le parallélisme.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: ses paupières examinent
  rationale: La formulation littérale préserve l’image poétique des paupières ; « examinent » exprime l’observation qui éprouve et discerne.
- source_word: בְּנֵי אָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque signifie littéralement « les fils d’Adam/de l’homme », mais possède ici une portée collective. « Les êtres humains » communique clairement cette référence à l’humanité entière.
theological_decisions:
- issue: L’imagerie de la demeure divine
  choice: Maintenir côte à côte le saint temple et le trône dans les cieux
  alternative: Identifier explicitement le temple au sanctuaire terrestre, ou en faire uniquement un synonyme des cieux
  rationale: L’hébreu juxtapose les deux affirmations sans préciser leur rapport. La traduction conserve cette tension au lieu de la résoudre.
- issue: La portée collective de בְּנֵי אָדָם
  choice: les êtres humains
  alternative: les fils de l’homme / les enfants d’Adam
  rationale: Dans ce contexte, l’expression vise collectivement les humains. Le choix retenu évite qu’un idiome hébreu soit compris en français comme désignant seulement des hommes ou une filiation particulière.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition de « Yahvé » et l’image anthropomorphique des yeux et des paupières sont conservées. La virgule après le second « Yahvé » rend la construction détachée de l’hébreu sans l’alourdir.
