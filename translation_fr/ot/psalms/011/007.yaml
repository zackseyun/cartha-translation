id: PSA.11.7
reference: Psalms 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי צַדִּ֣יק יְ֭הוָה צְדָק֣וֹת אָהֵ֑ב יָ֝שָׁ֗ר יֶחֱז֥וּ פָנֵֽי/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/007.yaml
  text: For Yahweh is righteous[a]; he loves righteous deeds[b]; the upright will behold his face.
translation:
  language: fr
  text: Car Yahvé est juste ; il aime les actes justes. Ceux qui sont droits contempleront son visage[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, moins probable : « son visage regarde celui qui est droit ». La syntaxe hébraïque de la dernière proposition a été comprise de plusieurs manières.'
    reason: alternative_reading
  - marker: b
    text: Littéralement « son visage ». L’expression peut aussi évoquer sa présence ou sa faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’affirmation précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: צַדִּיק
  choice: juste
  rationale: Décrit le caractère moral de Yahvé et maintient en français le lien lexical avec צְדָקוֹת, rendu par « actes justes ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin sous sa forme française courante plutôt que de le remplacer par un titre.
- source_word: צְדָקוֹת
  choice: actes justes
  rationale: Le pluriel désigne vraisemblablement des manifestations concrètes de justice ; cette formulation est naturelle et préserve le lien avec « juste ».
- source_word: אָהֵב
  choice: aime
  rationale: Rend directement la disposition constante exprimée par le verbe hébreu.
- source_word: יָשָׁר
  choice: ceux qui sont droits
  rationale: L’adjectif substantivé désigne les personnes moralement droites ; le pluriel est indiqué par le verbe יֶחֱזוּ.
- source_word: יֶחֱזוּ
  choice: contempleront
  rationale: Le verbe signifie voir ou contempler ; « contempleront » garde la tonalité élevée du psaume sans être archaïque.
- source_word: פָנֵימוֹ
  choice: son visage
  rationale: Conserve l’image concrète du visage divin, tout en laissant en note ses nuances possibles de présence ou de faveur et l’autre analyse syntaxique.
theological_decisions:
- issue: Sujet et objet de la dernière proposition
  choice: Ceux qui sont droits contempleront son visage
  alternative: Son visage regarde celui qui est droit
  rationale: Le verbe au pluriel favorise l’interprétation où les personnes droites constituent le sujet collectif. Toutefois, la syntaxe hébraïque a aussi été comprise avec « son visage » comme sujet ; cette possibilité est conservée en note plutôt que supprimée.
- issue: Portée de l’expression « son visage »
  choice: Conserver l’image littérale du visage
  alternative: sa présence ou sa faveur
  rationale: Le texte emploie une expression concrète susceptible d’évoquer la présence bienveillante de Dieu. La traduction principale ne remplace pas cette image par son interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Ceux qui sont droits » évite un masculin lexical potentiellement restrictif tout en rendant le sens collectif ; « contempleront » maintient le registre poétique sans archaïsme.
