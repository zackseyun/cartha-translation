review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend fidèlement ביהוה חסיתי. En revanche, « comme un oiseau » introduit une comparaison qui n’est pas exprimée par le texte massorétique fourni : צפור (« oiseau ») s’y trouve sans particule comparative. La séquence נודו הרכם צפור est grammaticalement difficile (impératif et possessif pluriels, puis « oiseau » au singulier) et doit rester signalée.'
  naturalness: Le français est globalement fluide et convient à un registre psalmique moderne. La formulation révisée conserve une lecture française intelligible tout en renvoyant explicitement à l’irrégularité du texte hébreu.
  terminology: « Au chef de chœur », « De David », « SEIGNEUR » et « refuge » sont appropriés. « Auprès du SEIGNEUR » est une manière naturelle de rendre l’image de la confiance placée en YHWH.
  issues:
  - severity: medium
    issue: La comparaison « comme un oiseau » n’est pas marquée dans l’hébreu massorétique.
    rationale: Le texte source porte צפור sans כ (« comme »). La construction est un crux syntaxique; une traduction qui fournit une comparaison doit l’indiquer en note plutôt que la présenter comme non problématique.
  - severity: medium
    issue: La note propose « oiseaux » au pluriel, alors que צפור est graphiquement et morphologiquement singulier.
    rationale: La note doit décrire précisément l’anomalie du texte plutôt que la résoudre en modifiant silencieusement le nombre du nom.
  revised_text: 'Au chef de chœur. De David.


    C’est auprès du SEIGNEUR que j’ai trouvé refuge. Comment pouvez-vous me dire : « Fuyez vers votre montagne, comme des oiseaux ! »'
  revised_footnotes:
  - marker: a
    text: 'L’hébreu est difficile : l’impératif « fuyez » et « votre » sont au pluriel, tandis que le mot rendu par « oiseaux » est singulier (« oiseau ») et n’est pas précédé de la particule habituelle signifiant « comme ». Une traduction plus littérale serait : « Fuyez vers votre montagne, oiseau ! »; d’autres comprennent : « Fuis vers ta montagne, comme un oiseau ! ».'
    reason: Signale la discordance grammaticale et l’absence de marque comparative dans le texte massorétique, sans imposer une solution textuelle ou interprétative.
  revision_rationale: La révision évite de faire passer pour explicite une comparaison absente de la forme massorétique tout en conservant, dans le texte courant, une résolution française naturelle de cette construction notoirement difficile. La note corrige également l’affirmation erronée selon laquelle une lecture « oiseaux » reproduirait le singulier hébreu.
