  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: fr
  text: 'Au chef de chœur. De David.


    C’est auprès du SEIGNEUR que j’ai trouvé refuge. Comment pouvez-vous me dire : « Fuyez vers votre montagne, comme des oiseaux ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Rend naturellement le titre cultuel traditionnel tout en conservant l’idée d’un responsable de l’exécution musicale.
- source_word: לְדָוִד
  choice: De David
  rationale: Conserve la formulation brève et l’ambiguïté possible de la préposition, qui peut indiquer l’auteur, l’appartenance ou le rattachement à David.
- source_word: בַּיהוָה חָסִיתִי
  choice: C’est auprès du SEIGNEUR que j’ai trouvé refuge
  rationale: La tournure emphatique française reflète la mise en tête de « auprès du SEIGNEUR »; le parfait חָסִיתִי est rendu comme une confiance déjà placée en lui.
- source_word: לְנַפְשִׁי
  choice: me
  rationale: Dans ce contexte, « à mon âme » est une manière hébraïque de dire « à moi-même »; « me » est idiomatique en français sans modifier le référent.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Fuyez vers votre montagne comme un oiseau
  rationale: Respecte les formes plurielles de l’impératif et du possessif dans le texte massorétique, tout en rendant צִפּוֹר comme une comparaison selon l’analyse traditionnelle; l’ambiguïté syntaxique est signalée en note.
theological_decisions:
- issue: Nom divin יהוה
  choice: SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Suit la convention française largement intelligible qui représente le tétragramme par « SEIGNEUR », sans imposer une vocalisation reconstruite.
- issue: Nature du refuge exprimé par חָסִיתִי
  choice: j’ai trouvé refuge
  alternative: je me réfugie / j’ai mis ma confiance
  rationale: Garde l’image concrète du refuge et la valeur accomplie du parfait, sans réduire cette image à une abstraction doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme rhétorique et l’emphase sur le SEIGNEUR sont préservés; la suscription reste concise.
