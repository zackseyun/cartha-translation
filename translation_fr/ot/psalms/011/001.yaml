  to: 'Au chef de chœur. De David.


    C’est auprès du SEIGNEUR que j’ai trouvé refuge. Comment pouvez-vous me dire : « Fuyez vers votre montagne, comme des oiseaux ! »'
  rationale: La révision évite de faire passer pour explicite une comparaison absente de la forme massorétique tout en conservant, dans le texte courant, une résolution française naturelle de cette construction notoirement difficile. La note corrige également l’affirmation erronée selon laquelle une lecture « oiseaux » reproduirait le singulier hébreu.
  reviewer_model: gpt-5.6-terra
