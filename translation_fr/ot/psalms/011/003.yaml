source:
  edition: WLC
  text: כִּ֣י הַ֭/שָּׁתוֹת יֵֽהָרֵס֑וּ/ן צַ֝דִּ֗יק מַה פָּעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: fr
  text: Si les fondations sont détruites[a], que peut faire le juste ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car les fondations sont démolies ; qu’a fait le juste ? » Le dernier verbe hébreu est formellement à l’accompli, bien que le contexte soit souvent compris au sens de « que peut faire le juste ? »'
    reason: Lecture alternative permise par la valeur de כִּי et par la forme verbale de פָּעָל.
lexical_decisions:
- source_word: כִּי
  choice: Si
  rationale: Dans ce contexte poétique, la conjonction introduit naturellement une condition qui mène à la question rhétorique, tout en laissant en note la possibilité d’un sens causal (« car »).
- source_word: הַשָּׁתוֹת
  choice: les fondations
  rationale: Ce choix conserve l’image concrète de l’hébreu sans préciser si elle désigne l’ordre social, moral, judiciaire ou alliance.
- source_word: יֵהָרֵסוּן
  choice: sont détruites
  rationale: Le nifal exprime ici un sens passif. « Sont détruites » est idiomatique et garde l’image de fondations que l’on renverse ou démolit.
- source_word: צַדִּיק
  choice: le juste
  rationale: Le singulier générique hébreu est rendu par la formulation française biblique et naturelle « le juste », sans explicitation supplémentaire.
- source_word: מַה פָּעָל
  choice: que peut faire
  rationale: Bien que פָּעָל soit formellement un accompli, le contexte permet de comprendre la question comme portant sur la possibilité d’agir. La note préserve la lecture plus littéralement passée.
theological_decisions:
- issue: Portée métaphorique des « fondations »
  choice: Conserver la métaphore sans l’expliciter.
  alternative: Préciser « les fondements de la société », « de la justice » ou « de l’ordre moral ».
  rationale: L’image hébraïque demeure ouverte et évocatrice ; la préciser réduirait inutilement sa portée interprétative.
- issue: Valeur temporelle et pragmatique de פָּעָל
  choice: Traduire contextuellement par « peut faire ».
  alternative: « Qu’a fait le juste ? »
  rationale: La question de la capacité d’action s’accorde bien au contexte immédiat, mais la forme accomplie autorise une lecture passée qu’il convient de signaler sans la supprimer.
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le parallélisme concis et l’image concrète de l’hébreu ; « le juste » maintient le registre biblique courant sans archaïsme marqué.
