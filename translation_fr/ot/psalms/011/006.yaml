  text: יַמְטֵ֥ר עַל רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭/גָפְרִית וְ/ר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: fr
  text: Il fera pleuvoir sur les méchants des pièges, du feu et du soufre ; un vent brûlant sera la part de leur coupe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַמְטֵר
  choice: Qu’il fasse pleuvoir
  rationale: Le yiqtol peut être compris ici comme un souhait ou une affirmation. Le contexte imprécatoire du verset permet le jussif français, tout en conservant l’image concrète de la pluie.
- source_word: פַּחִים
  choice: des pièges
  rationale: Le pluriel de פַּח désigne normalement des pièges ou filets destinés à capturer. « Pièges » est naturel et respecte la lecture consonantique massorétique.
- source_word: גָפְרִית
  choice: du soufre
  rationale: Équivalent moderne et précis du terme désignant le soufre combustible, traditionnellement rendu autrefois par « soufre » ou « brimstone ».
- source_word: רוּחַ זִלְעָפוֹת
  choice: un vent brûlant
  rationale: רוּחַ signifie « vent » et זִלְעָפוֹת évoque une chaleur dévorante ou brûlante. Cette formulation reste naturelle sans surdéterminer l’image.
- source_word: מְנָת כּוֹסָם
  choice: la part qui leur revient dans la coupe
  rationale: Conserve la métaphore biblique de la coupe comme lot attribué, tout en explicitant sobrement le sens de מְנָה, « part ».
theological_decisions:
- issue: Valeur modale de יַמְטֵר
  choice: 'souhait/jussif : « Qu’il fasse pleuvoir »'
  alternative: 'futur déclaratif : « Il fera pleuvoir »'
  rationale: La forme hébraïque non préfixée par un waw peut exprimer soit l’action future, soit un souhait. Dans cette prière, le jussif est plausible et la traduction ne doit pas présenter le futur comme la seule analyse possible.
- issue: Métaphore de la coupe du jugement
  choice: maintien de « la coupe »
  alternative: 'paraphrase : « tel sera leur sort »'
  rationale: La coupe est une image théologique et poétique importante du lot assigné par Dieu; elle doit être conservée plutôt que remplacée par une abstraction.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est rendu en deux phrases, avec une exclamation pour porter la valeur jussive plausible de l’hébreu. Aucun archaïsme ni vocabulaire confessionnel particulier.
