base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: fr
  text: 'Au maître de chant[a]. De David.


    En Yahvé je trouve refuge. Comment pouvez-vous dire à mon âme : « Fuyez vers votre montagne, oiseau ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur ». Le sens précis de ce titre musical est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est très condensé : « Fuyez, votre montagne, oiseau ! » Il porte un impératif pluriel (« Fuyez ») avec « oiseau » au singulier. Sa formulation est difficile; on peut aussi comprendre : « Fuis comme un oiseau vers ta montagne ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au maître de chant
  rationale: Rend la fonction liturgique probable de ce terme de suscription dans un français actuel, tout en signalant en note l’alternative plus littérale.
- source_word: חָסִיתִי
  choice: je trouve refuge
  rationale: Exprime naturellement l’idée de chercher et trouver sa sécurité en quelqu’un; le parfait hébreu peut décrire ici une confiance établie.
- source_word: לְנַפְשִׁי
  choice: à mon âme
  rationale: Conserve l’expression hébraïque plutôt que de la réduire silencieusement à « à moi », malgré son caractère moins idiomatique en français.
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Fuyez vers votre montagne, oiseau !
  rationale: Suit au plus près le texte consonantique transmis, y compris la tension entre l’impératif pluriel et « oiseau » au singulier; la difficulté et une lecture plus naturelle sont exposées en note.
theological_decisions:
- issue: Traduction du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Emploie en français la forme usuelle du nom divin personnel, sans le remplacer par un titre; la vocalisation antique exacte demeure incertaine.
translation_notes:
  register: Français international moderne, sobre et digne. La suscription est conservée. La formulation inhabituelle de la dernière injonction reste visible dans le texte, tandis que la note présente une interprétation française plus naturelle sans effacer l’ambiguïté de l’hébreu.
