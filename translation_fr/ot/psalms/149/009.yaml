id: PSA.149.9
reference: Psalms 149:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לַ/עֲשׂ֤וֹת בָּ/הֶ֨ם מִשְׁפָּ֬ט כָּת֗וּב הָדָ֣ר ה֭וּא לְ/כָל חֲסִידָ֗י/ו הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/009.yaml
  text: to execute on them the written judgment[a]. This is an honor for all his faithful ones[d][c][b]. Praise Yah!
translation:
  language: fr
  text: pour exécuter contre eux le jugement écrit[a]. C’est un honneur pour tous ses fidèles[b][c]. Louez Yah ![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le jugement consigné », c’est-à-dire le jugement déjà écrit ou prescrit par Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une gloire » ou « une splendeur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « tous ceux qui lui sont fidèles » ; traduction traditionnelle : « tous ses saints ».'
    reason: lexical_alternative
  - marker: d
    text: L’hébreu porte « Louez Yah » (hallélou-Yah), traditionnellement transcrit « Alléluia ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: exécuter
  rationale: Avec מִשְׁפָּט et l’imagerie guerrière des versets précédents, le verbe désigne l’exécution effective d’un jugement ou d’une sentence.
- source_word: בָּהֶם
  choice: contre eux
  rationale: En français, « exécuter un jugement contre eux » exprime naturellement que les nations et leurs dirigeants subissent ce jugement.
- source_word: מִשְׁפָּט כָּתוּב
  choice: le jugement écrit
  rationale: Cette formulation conserve à la fois la portée judiciaire de מִשְׁפָּט et l’image explicite de ce qui est « écrit », sans remplacer celle-ci par l’interprétation « décrété ».
- source_word: הָדָר
  choice: un honneur
  rationale: Dans ce contexte, le nom désigne la dignité ou le privilège accordé aux fidèles. « Un honneur » est idiomatique en français, tandis que « gloire » ou « splendeur » restent des possibilités lexicales.
- source_word: חֲסִידָיו
  choice: ses fidèles
  rationale: Le terme désigne ceux qui font preuve de fidélité et d’attachement envers Dieu. « Ses fidèles » est actuel, clair et évite les connotations ecclésiastiques ultérieures de « saints ».
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: La traduction rend l’impératif pluriel et conserve la forme courte du nom divin effectivement présente dans l’hébreu.
theological_decisions:
- issue: Sens du jugement « écrit »
  choice: Conserver l’expression concrète « le jugement écrit »
  alternative: le jugement décrété / prescrit
  rationale: Le texte ne précise pas ici où ce jugement est écrit. La formulation retenue préserve cette indétermination ainsi que la possible idée d’un jugement déjà consigné ou prescrit par Dieu.
- issue: Désignation des חֲסִידָיו
  choice: ses fidèles
  alternative: ses saints
  rationale: « Fidèles » exprime l’attachement loyal à Dieu sans importer une catégorie confessionnelle ou canonique étrangère au contexte.
- issue: Forme courte du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur / l’Éternel
  rationale: Le verset emploie יָהּ, forme courte du nom divin dans la formule liturgique הַלְלוּ יָהּ. La translittération préserve cette forme particulière.
translation_notes:
  register: Français international moderne, digne et direct. Le début en minuscule signale que le verset poursuit syntaxiquement le verset précédent. « Exécuter contre eux le jugement » conserve le registre judiciaire sans produire le calque peu naturel « exécuter sur eux ». La clôture garde la force liturgique et impérative de l’hébreu.
