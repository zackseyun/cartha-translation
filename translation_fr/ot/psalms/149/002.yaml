  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
translation:
  language: fr
  text: Qu’Israël se réjouisse en son Créateur[a] ! Que les fils de Sion exultent en leur Roi[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte une forme plurielle, littéralement « en ses faiseurs / ceux qui l’ont fait ». Elle est couramment comprise ici comme un pluriel désignant Dieu, le Créateur d’Israël.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en leur roi », si l’on comprend ce terme comme désignant un roi terrestre plutôt que Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמַח
  choice: Qu’… se réjouisse
  rationale: L’imparfait qal à valeur jussive exprime ici une exhortation poétique ; cette tournure française en conserve naturellement la nuance.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre traditionnel du peuple de l’alliance.
- source_word: בְּעֹשָׂיו
  choice: en ceux qui l’ont fait
  rationale: La forme hébraïque est morphologiquement plurielle, avec un suffixe masculin singulier renvoyant à Israël. Une traduction au pluriel préserve cette donnée inhabituelle et l’ambiguïté réelle du texte, sans imposer l’explication traditionnelle par un pluriel de majesté.
- source_word: בְּנֵי צִיּוֹן
  choice: les fils de Sion
  rationale: Rend littéralement l’expression masculine plurielle, employée collectivement pour les membres du peuple de Sion.
- source_word: יָגִילוּ
  choice: Que … exultent
  rationale: Le verbe גיל évoque une joie vive et jubilante ; « exulter » conserve sa force poétique et le parallélisme exhortatif.
- source_word: בְמַלְכָּם
  choice: en leur Roi
  rationale: La préposition ב marque ici celui en qui l’on se réjouit. La majuscule indique la lecture contextuellement probable selon laquelle Dieu est le roi visé.
theological_decisions:
- issue: Nombre et référent de בְּעֹשָׂיו
  choice: 'Conserver dans le texte le pluriel formel : « ceux qui l’ont fait »'
  alternative: « celui qui l’a fait » ou « son Créateur »
  rationale: Le mot hébreu est réellement pluriel. Même si cette forme est couramment comprise comme désignant le Dieu unique, la conserver dans le texte respecte l’ambiguïté et la tension de la formulation originale ; la note donne la compréhension habituelle.
- issue: Référent de « leur Roi »
  choice: Dieu, signalé par la majuscule
  alternative: Un roi terrestre d’Israël
  rationale: Le parallélisme avec ceux qui ont fait Israël favorise fortement un référent divin, mais la forme lexicale peut aussi désigner un roi humain ; cette possibilité est donc maintenue en note.
translation_notes:
  register: Français moderne, international et poétique. Les deux exhortations parallèles sont conservées. « Fils de Sion » maintient l’image hébraïque, tandis que « exulter » rend l’intensité jubilante du second verbe. Le pluriel difficile de בְּעֹשָׂיו est maintenu dans le texte principal et expliqué en note.
