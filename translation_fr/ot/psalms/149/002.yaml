  to: Qu’Israël se réjouisse en son Créateur[a] ! Que les fils de Sion exultent en leur Roi[b] !
  rationale: La révision adopte dans le texte la lecture singulière contextuellement la plus probable de עֹשָׂיו, conformément au parallélisme avec « leur Roi », tout en conservant intégralement en note le pluriel formel et l’interprétation alternative qu’il peut susciter. Elle élimine une tournure française opaque sans modifier le mouvement exhortatif, les images ni le registre poétique du verset.
