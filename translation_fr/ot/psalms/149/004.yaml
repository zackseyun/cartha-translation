source:
  edition: WLC
  text: כִּֽי רוֹצֶ֣ה יְהוָ֣ה בְּ/עַמּ֑/וֹ יְפָאֵ֥ר עֲ֝נָוִ֗ים בִּ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/004.yaml
  text: For Yahweh delights in his people[a]; he adorns the humble with salvation.
translation:
  language: fr
  text: Car Yahweh prend plaisir à son peuple ; il pare les humbles du salut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la délivrance » ou « de la victoire ». Le terme hébreu peut désigner le salut, la délivrance ou la victoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange exprimée dans le contexte ; « Car » convient au mouvement explicatif et poétique.
- source_word: רוֹצֶה
  choice: prend plaisir à
  rationale: Exprime ici l’accueil favorable et le plaisir éprouvé envers quelqu’un, plutôt qu’une simple volonté.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu, sans lui substituer un titre.
- source_word: בְּעַמּוֹ
  choice: à son peuple
  rationale: Avec רצה, la préposition ב introduit l’objet du plaisir ; en français courant, « prendre plaisir à » rend naturellement cette construction.
- source_word: יְפָאֵר
  choice: pare
  rationale: Le piel de פאר évoque le fait d’embellir, d’orner ou d’honorer ; « pare » conserve l’image concrète sans la surinterpréter.
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme désigne les humbles ou les doux, avec une nuance possible de petitesse sociale ou d’affliction ; « les humbles » reste naturel et suffisamment large.
- source_word: בִּישׁוּעָה
  choice: du salut
  rationale: ישועה peut désigner le salut, la délivrance ou la victoire. « Du salut » préserve l’étendue théologique du terme et s’intègre à l’image de la parure.
theological_decisions:
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin ; « Yahweh » le conserve sous forme translittérée plutôt que de le remplacer par un titre.
- issue: Sens de ישועה dans ce psaume de louange
  choice: salut
  alternative: délivrance ; victoire
  rationale: « Salut » conserve le champ sémantique le plus large, tandis que la note maintient les sens concrets de délivrance ou de victoire que le contexte peut autoriser.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure « prend plaisir à » est idiomatique, et « pare les humbles du salut » conserve l’image hébraïque tout en restant intelligible.
