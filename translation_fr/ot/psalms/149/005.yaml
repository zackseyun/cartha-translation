source:
  edition: WLC
  text: יַעְלְז֣וּ חֲסִידִ֣ים בְּ/כָב֑וֹד יְ֝רַנְּנ֗וּ עַל מִשְׁכְּבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/005.yaml
  text: Let the faithful exult in glory[c][b][a]; let them sing for joy on their beds.
translation:
  language: fr
  text: Que les fidèles exultent dans la gloire[a] ! Qu’ils poussent des cris de joie[b] sur leurs lits !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’honneur » ; le rapport exact entre leur exultation et cette gloire ou cet honneur n’est pas précisé.
    reason: lexical_alternative
  - marker: b
    text: Ou « chantent de joie ». Le verbe hébreu peut désigner des cris joyeux, notamment sous forme de chant.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעְלְזוּ
  choice: Que ... exultent
  rationale: L’imparfait hébreu à valeur exhortative et le parallélisme poétique appellent « Que… ». « Exulter » conserve l’intensité festive du verbe.
- source_word: חֲסִידִים
  choice: les fidèles
  rationale: Le terme désigne ceux qui se caractérisent par leur fidélité et leur attachement à Dieu dans le cadre de l’alliance. « Les fidèles » est naturel et évite les connotations ecclésiastiques ultérieures de « les saints ».
- source_word: בְּכָבוֹד
  choice: dans la gloire
  rationale: La préposition בְּ peut marquer ici la sphère ou la condition de l’exultation. « Gloire » préserve le poids poétique de כָּבוֹד, tout en laissant « honneur » comme autre lecture possible.
- source_word: יְרַנְּנוּ
  choice: Qu’ils poussent des cris de joie
  rationale: Le piel de רנן évoque une expression vocale éclatante de joie, qui peut être chantée ou criée. Cette formulation garde cette amplitude sans réduire le verbe au seul chant.
- source_word: עַל
  choice: sur
  rationale: La préposition indique directement la position sur les lieux où l’on se couche.
- source_word: מִשְׁכְּבוֹתָם
  choice: leurs couches
  rationale: Le pluriel désigne les endroits où ils s’allongent. « Couches » convient au registre poétique et reste plus large que « lits ».
theological_decisions:
- issue: Sens de חֲסִידִים
  choice: les fidèles
  alternative: les hommes pieux ; les saints ; ceux qui lui sont attachés
  rationale: Le mot qualifie les personnes marquées par la fidélité, la piété et l’attachement liés à l’alliance, sans imposer une catégorie ecclésiastique technique.
- issue: Référent de la gloire ou de l’honneur
  choice: Conserver « dans la gloire » sans préciser de qui vient ou à qui appartient cette gloire
  alternative: fiers de l’honneur reçu ; à cause de la gloire
  rationale: L’hébreu ne précise pas explicitement le rapport exact entre les fidèles et la gloire. La traduction maintient cette ambiguïté au lieu d’attribuer l’honneur de façon interprétative.
translation_notes:
  register: Français international moderne, poétique et digne. Le double tour exhortatif reproduit le parallélisme hébreu. « Exultent » soutient l’élévation du psaume, tandis que « poussent des cris de joie » rend clairement la vigueur de l’expression vocale.
