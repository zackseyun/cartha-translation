  text: לֶ/אְסֹ֣ר מַלְכֵי/הֶ֣ם בְּ/זִקִּ֑ים וְ֝/נִכְבְּדֵי/הֶ֗ם בְּ/כַבְלֵ֥י בַרְזֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/008.yaml
  text: to bind their kings with chains[a], and their honored men with iron fetters,
translation:
  language: fr
  text: 'pour lier leurs rois avec des chaînes,

    et leurs dignitaires avec des entraves de fer,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאְסֹר
  choice: pour enchaîner
  rationale: L’infinitif construit exprime ici le but dans la continuité du verset précédent. « Enchaîner » rend naturellement l’action concrète de lier au moyen de chaînes.
- source_word: מַלְכֵיהֶם
  choice: leurs rois
  rationale: מֶלֶךְ désigne précisément un roi, et le suffixe masculin pluriel est rendu par « leurs ».
- source_word: בְּזִקִּים
  choice: enchaîner
  rationale: זִקִּים désigne des chaînes ou des liens. En français, leur présence est intégrée de façon idiomatique au verbe « enchaîner », sans perdre l’image matérielle.
- source_word: וְנִכְבְּדֵיהֶם
  choice: et leurs dignitaires
  rationale: Le terme dérivé de כבד désigne des hommes honorés ou importants. « Dignitaires » exprime clairement leur rang social sans les identifier plus précisément à une noblesse héréditaire.
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: dans des entraves de fer
  rationale: כבל désigne des liens ou des entraves. « Entraves de fer » conserve l’image concrète, la matière et la variation lexicale du parallélisme hébreu.
theological_decisions:
- issue: Rendu du masculin pluriel וְנִכְבְּדֵיהֶם
  choice: leurs dignitaires
  alternative: leurs hommes honorés
  rationale: « Dignitaires » peut désigner en contexte les hommes de haut rang visés par le masculin hébreu, tout en offrant en français une formulation naturelle et précise. Le terme ne tranche pas davantage leur fonction politique ou leur statut social.
translation_notes:
  register: Style poétique, actuel et digne. Le parallélisme est conservé, avec une variation naturelle entre « enchaîner » et « entraves de fer ». Aucun marqueur de note n’est requis.
