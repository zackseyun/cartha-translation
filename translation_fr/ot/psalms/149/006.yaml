  text: The high praises of God are in their throat[a], and a two-edged sword is in their hand[d][c][b],
translation:
  language: fr
  text: Dans leur gorge, les hautes louanges de Dieu[a] ; dans leur main[c], une épée à deux tranchants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les exaltations de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « une épée à double tranchant ». Littéralement, « une épée à deux bouches » ou « à deux tranchants ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte « dans leur main » ; le singulier peut avoir un sens distributif. On pourrait aussi traduire « dans leurs mains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: hautes louanges
  rationale: Le nom pluriel désigne des louanges élevées ou des acclamations exaltantes. « Hautes louanges » conserve cette intensité dans un registre poétique et compréhensible.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל est un titre divin désignant le Dieu d’Israël ; « Dieu » est le rendu français le plus naturel.
- source_word: בִּגְרוֹנָם
  choice: dans leur gorge
  rationale: Le mot גָּרוֹן signifie littéralement « gorge ». Ce rendu préserve l’image corporelle frappante de la louange qui sort d’eux ; le verbe « résonnent », exigé par le français, explicite sobrement la proposition nominale hébraïque.
- source_word: וְחֶרֶב
  choice: une épée
  rationale: La conjonction introduit le second membre parallèle, et le nom a ici un sens indéfini.
- source_word: פִּיפִיּוֹת
  choice: à deux tranchants
  rationale: L’expression désigne une épée pourvue de deux tranchants, littéralement de « deux bouches ». « À deux tranchants » est précis et idiomatique en français.
- source_word: בְּיָדָם
  choice: dans leur main
  rationale: L’hébreu emploie le singulier « main » avec un suffixe pluriel. Le français peut le conserver avec une valeur distributive, tandis que « dans leurs mains » demeure possible.
theological_decisions:
- issue: Association de la louange et de l’imagerie guerrière
  choice: Conserver sans atténuation la juxtaposition des louanges et de l’épée.
  alternative: Interpréter l’épée comme une métaphore dans le texte principal.
  rationale: L’hébreu place directement l’imagerie guerrière en parallèle avec la louange. La traduction préserve cette tension théologique au lieu de la résoudre par une interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion « Dans leur gorge résonnent… » rend naturellement la proposition nominale hébraïque et conserve la mise en relief de « gorge ». Le parallélisme des deux membres et l’image martiale restent intacts.
