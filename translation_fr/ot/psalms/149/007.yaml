source:
  edition: WLC
  text: לַ/עֲשׂ֣וֹת נְ֭קָמָה בַּ/גּוֹיִ֑ם תּֽ֝וֹכֵחֹ֗ת בַּל אֻמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/007.yaml
  text: to execute vengeance on the nations[a], punishments on the peoples,
translation:
  language: fr
  text: 'pour exercer la vengeance contre les nations,

    infliger des châtiments[a] aux peuples,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des réprimandes » ou « des corrections ». Le terme hébreu peut désigner des reproches, mais il semble avoir ici un sens judiciaire, en parallèle avec « vengeance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: pour exercer / infliger
  rationale: 'L’infinitif construit précédé de ל exprime ici le but. En français, le verbe est rendu selon chacun des deux compléments parallèles : « exercer la vengeance » et « infliger des châtiments ».'
- source_word: נְקָמָה
  choice: la vengeance
  rationale: Le nom désigne la vengeance ou l’acte de venger, avec ici une forte dimension judiciaire et guerrière. « Vengeance » conserve sans l’atténuer la force du texte hébreu.
- source_word: בַּגּוֹיִם
  choice: contre les nations
  rationale: Dans cette construction, ב marque les nations comme cibles de la vengeance. « Contre » est naturel en français et exprime clairement cette relation.
- source_word: תּוֹכֵחוֹת
  choice: des châtiments
  rationale: Le terme peut désigner des réprimandes ou des corrections, mais son parallélisme avec « vengeance » et le contexte judiciaire des versets suivants favorisent ici le sens concret de sanctions infligées.
- source_word: בַּל
  choice: aux
  rationale: Cette forme poétique introduit les peuples visés par les châtiments. En français, « infliger des châtiments aux peuples » rend naturellement la relation.
- source_word: אֻמִּים
  choice: les peuples
  rationale: Le mot désigne des groupes humains ou ethniques. « Peuples » préserve le pluriel collectif et le parallélisme avec « nations » sans confondre les deux termes.
theological_decisions:
- issue: Faut-il atténuer le langage de jugement attribué au peuple de Dieu ?
  choice: Conserver les termes forts « vengeance » et « châtiments ».
  alternative: Employer des termes plus modérés comme « justice », « réprimandes » ou « corrections ».
  rationale: L’hébreu emploie un langage vigoureux de jugement dans un contexte guerrier. L’atténuer résoudrait artificiellement la tension théologique du psaume.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme poétique est conservé sur deux lignes, tandis que la variation verbale « exercer / infliger » assure une formulation naturelle.
