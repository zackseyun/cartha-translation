id: PSA.149.1
reference: Psalms 149:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ שִׁ֣ירוּ לַֽ֭/יהוָה שִׁ֣יר חָדָ֑שׁ תְּ֝הִלָּת֗/וֹ בִּ/קְהַ֥ל חֲסִידִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: fr
  text: Louez Yah[a] ! Chantez à Yahvé un chant nouveau, sa louange dans l’assemblée des fidèles[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu : « Hallelu-Yah », littéralement « Louez Yah ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des hommes pieux », « des saints » ou « de ceux qui lui sont attachés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah
  rationale: L’impératif pluriel הַלְלוּ appelle directement la communauté à louer; יָהּ est la forme courte du nom divin et demeure distincte de יהוה dans la suite du verset.
- source_word: שִׁירוּ לַיהוָה
  choice: Chantez à Yahvé
  rationale: L’impératif pluriel שִׁירוּ est rendu directement, et la préposition ל indique à qui le chant est adressé. « Yahvé » représente explicitement le tétragramme.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Expression psalmique simple et naturelle; « chant » convient au registre poétique français et préserve la formulation hébraïque.
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: Le nom avec suffixe masculin singulier signifie littéralement « sa louange ». La formulation nominale conserve le parallélisme et la concision de l’hébreu.
- source_word: בִּקְהַל
  choice: dans l’assemblée
  rationale: קהל désigne une communauté réunie. « Assemblée » restitue le cadre collectif sans connotation ecclésiastique trop étroite.
- source_word: חֲסִידִים
  choice: des fidèles
  rationale: Le terme désigne des personnes caractérisées par leur attachement loyal et pieux. « Fidèles » reste naturel et évite les connotations techniques possibles de « saints ».
theological_decisions:
- issue: Distinction entre יָהּ et יהוה dans le même verset
  choice: « Yah » pour יָהּ et « Yahvé » pour יהוה
  alternative: Rendre les deux formes par « le Seigneur », ou employer « Yahweh » pour יהוה
  rationale: La traduction maintient la distinction formelle voulue par l’hébreu et rend visibles les deux formes du nom divin, sans les confondre sous un titre commun.
- issue: Portée de חֲסִידִים
  choice: « les fidèles »
  alternative: « les hommes pieux », « les saints » ou « ceux qui lui sont attachés »
  rationale: « Fidèles » exprime de façon concise la loyauté et la dévotion associées au mot, tout en préservant sa portée relationnelle sans imposer une catégorie confessionnelle ultérieure.
- issue: Construction elliptique de תְּהִלָּתוֹ בִּקְהַל חֲסִידִים
  choice: 'Conserver la proposition nominale : « sa louange dans l’assemblée des fidèles »'
  alternative: 'Expliciter : « que sa louange retentisse dans l’assemblée des fidèles »'
  rationale: L’hébreu ne donne pas de verbe explicite dans ce segment. La formulation retenue préserve cette concision et l’ambiguïté entre apposition au « chant nouveau » et exhortation elliptique.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs pluriels gardent l’adresse collective. La ponctuation finale souligne l’élan exhortatif, tandis que la seconde moitié demeure nominale afin de respecter l’ellipse hébraïque.
