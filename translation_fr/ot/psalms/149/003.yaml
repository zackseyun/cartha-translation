  text: יְהַֽלְל֣וּ שְׁמ֣/וֹ בְ/מָח֑וֹל בְּ/תֹ֥ף וְ֝/כִנּ֗וֹר יְזַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/003.yaml
  text: Let them praise his name with dancing[c][b][a]; let them make music to him with tambourine and lyre.
translation:
  language: fr
  text: Qu’ils louent son nom en dansant[a] ! Qu’ils fassent de la musique pour lui, au tambourin et à la lyre[b][c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une danse ». Le mot hébreu peut désigner aussi bien l’action de danser qu’une danse particulière.
    reason: lexical_alternative
  - marker: b
    text: Ou « qu’ils lui chantent des louanges ». Le verbe hébreu peut désigner le chant de louange aussi bien que la musique instrumentale.
    reason: lexical_alternative
  - marker: c
    text: Traditionnellement « harpe » ; le terme hébreu désigne plus précisément une lyre qu’une harpe moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַֽלְל֣וּ
  choice: Qu’ils louent
  rationale: Le piel inaccompli a ici une valeur d’exhortation. « Qu’ils louent » la restitue naturellement en français.
- source_word: שְׁמ֣וֹ
  choice: son nom
  rationale: L’hébreu mentionne explicitement le nom, expression qui désigne la personne telle qu’elle se fait connaître et reçoit l’honneur.
- source_word: בְמָחוֹל
  choice: par la danse
  rationale: מָחוֹל peut désigner l’action de danser ou une danse. « Par la danse » est naturel et conserve la fonction de moyen ou d’accompagnement de בְּ.
- source_word: בְּתֹף
  choice: du tambourin
  rationale: תֹף désigne un tambour sur cadre, proche du tambourin ; ce terme est courant et compréhensible en français moderne.
- source_word: וְכִנּוֹר
  choice: et de la lyre
  rationale: כִּנּוֹר désigne vraisemblablement un instrument à cordes de type lyre plutôt qu’une harpe moderne.
- source_word: יְזַמְּרוּ
  choice: Qu’ils jouent
  rationale: Au piel, זמר peut évoquer le chant de louange ou la production de musique. Avec les instruments nommés, « jouer » donne un français naturel, tandis qu’une note préserve le sens plus large.
- source_word: לוֹ
  choice: pour lui
  rationale: לְ marque ici le destinataire ou le bénéficiaire de la musique ; « pour lui » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est rendu par deux exhortations. Les points d’exclamation expriment l’élan de l’exhortation sans ajouter de contenu doctrinal.
