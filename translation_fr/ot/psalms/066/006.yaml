id: PSA.66.6
reference: Psalms 66:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָ֤פַךְ יָ֨ם לְֽ/יַבָּשָׁ֗ה בַּ֭/נָּהָר יַֽעַבְר֣וּ בְ/רָ֑גֶל שָׁ֝֗ם נִשְׂמְחָה בּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/006.yaml
  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: fr
  text: Il changea la mer en terre sèche ; ils traversèrent le fleuve à pied[a]. Là, nous nous sommes réjouis en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset rappelle probablement à la fois le passage de la mer lors de la sortie d’Égypte et le passage du Jourdain pour entrer dans le pays.
    reason: cross_reference
  - marker: b
    text: 'Ou : « Là, réjouissons-nous en lui. » La forme hébraïque peut exprimer une exhortation plutôt qu’une déclaration rétrospective.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָפַךְ
  choice: changea
  rationale: Le verbe signifie « tourner, changer, transformer ». « Changea » exprime naturellement ici la transformation concrète de la mer.
- source_word: יָם
  choice: la mer
  rationale: Traduction directe du nom hébreu, sans préciser dans le corps du texte de quelle mer il s’agit.
- source_word: לְיַבָּשָׁה
  choice: en terre sèche
  rationale: Le nom désigne la terre ou le sol sec ; cette formulation conserve la construction de transformation marquée par la préposition.
- source_word: בַּנָּהָר
  choice: le fleuve
  rationale: La préposition signifie littéralement « dans/au fleuve », mais avec le verbe de passage, le français exprime naturellement le mouvement par « traversèrent le fleuve ».
- source_word: יַעַבְרוּ
  choice: ils traversèrent
  rationale: Le verbe signifie passer ou traverser. Le passé convient au rappel poétique des actes salvateurs de Dieu, même si la forme hébraïque est un inaccompli.
- source_word: בְרָגֶל
  choice: à pied
  rationale: Expression française idiomatique correspondant exactement au moyen de passage indiqué.
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe est conservé sans déterminer s’il renvoie strictement au lieu ou, plus largement, à l’événement rappelé.
- source_word: נִשְׂמְחָה
  choice: nous nous sommes réjouis
  rationale: Cette forme de première personne du pluriel peut être comprise comme une déclaration rétrospective ou comme une exhortation. Le passé rend l’identification de la communauté aux délivrances anciennes, tandis qu’une note conserve l’autre lecture.
- source_word: בּוֹ
  choice: en lui
  rationale: Le suffixe masculin singulier renvoie vraisemblablement à Dieu dans ce contexte de louange. La formulation maintient le complément hébreu sans le paraphraser.
theological_decisions:
- issue: Allusions historiques et identification communautaire
  choice: 'Le verset rappelle les passages de la mer et du fleuve, et la communauté qui chante s’associe à ces actes en disant : « nous nous sommes réjouis ».'
  alternative: 'La dernière proposition peut être comprise comme une exhortation présente : « là, réjouissons-nous en lui ».'
  rationale: Le contexte célèbre les actes puissants de Dieu. La lecture rétrospective préserve la solidarité poétique de la communauté avec les générations délivrées, sans effacer l’ambiguïté grammaticale, signalée en note.
- issue: Référent du pronom בּוֹ
  choice: Le pronom est rendu par « en lui » et compris comme renvoyant à Dieu.
  alternative: Il pourrait, moins probablement dans ce contexte, être rattaché au lieu ou à l’événement.
  rationale: Le suffixe est masculin singulier et le mouvement de louange du psaume favorise Dieu comme référent, sans qu’il soit nécessaire d’expliciter son nom dans le texte.
translation_notes:
  register: Français international actuel, clair et digne. Le passé composé de la dernière proposition reste naturel pour le lecteur moderne ; le passé simple des actes narratifs donne au rappel poétique une solennité mesurée. Les deux ambiguïtés principales — valeur de נִשְׂמְחָה et portée historique des deux traversées — sont conservées ou signalées sans ajout confessionnel.
