  text: אָב֣וֹא בֵיתְ/ךָ֣ בְ/עוֹל֑וֹת אֲשַׁלֵּ֖ם לְ/ךָ֣ נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/013.yaml
  text: I will come into your house with burnt offerings[a]; I will fulfill my vows to you[c][b],
translation:
  language: fr
  text: Je viendrai dans ta maison avec des holocaustes ; je m’acquitterai de mes vœux envers toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’accomplirai mes vœux envers toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Je viendrai
  rationale: Le qal inaccompli à la première personne du singulier de בוא exprime ici l’action projetée du psalmiste. « Je viendrai » rend directement le verbe, tandis que le complément « dans ta maison » indique naturellement l’entrée.
- source_word: בֵיתְךָ
  choice: dans ta maison
  rationale: Le nom signifie littéralement « ta maison ». Dans ce contexte cultuel, il désigne vraisemblablement le sanctuaire de Dieu, mais conserver « maison » évite de préciser au-delà du texte hébreu.
- source_word: בְעוֹלוֹת
  choice: avec des holocaustes
  rationale: עוֹלָה est le terme sacrificiel usuel pour une offrande entièrement brûlée. En français biblique moderne, « holocauste » demeure le terme précis et idiomatique ; la préposition ב exprime ici l’accompagnement.
- source_word: אֲשַׁלֵּם
  choice: je m’acquitterai
  rationale: Au piel, שלם associé à des vœux signifie les payer ou les accomplir. « S’acquitter de ses vœux » restitue naturellement l’idée d’une obligation solennelle honorée.
- source_word: לְךָ
  choice: envers toi
  rationale: La préposition ל indique ici celui envers qui l’engagement doit être honoré. « Envers toi » s’intègre naturellement à la tournure française « s’acquitter de ».
- source_word: נְדָרָי
  choice: mes vœux
  rationale: Le pluriel muni du suffixe de première personne signifie directement « mes vœux ».
theological_decisions:
- issue: Faut-il interpréter « ta maison » comme une désignation explicite du temple ou du sanctuaire ?
  choice: Conserver « ta maison » dans le texte principal.
  alternative: « ton temple » ou « ton sanctuaire »
  rationale: L’hébreu porte littéralement « ta maison ». Les holocaustes rendent le cadre cultuel évident, mais le traduire directement par « temple » ou « sanctuaire » réduirait une expression que le texte laisse imagée.
translation_notes:
  register: Français international moderne, digne et lisible. « Holocaustes » conserve la précision du vocabulaire sacrificiel ; « je m’acquitterai envers toi de mes vœux » rend l’idiome hébreu sans connotation commerciale excessive. Le point-virgule reflète les deux propositions parallèles.
