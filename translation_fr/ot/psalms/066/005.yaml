source:
  edition: WLC
  text: לְכ֣וּ וּ֭/רְאוּ מִפְעֲל֣וֹת אֱלֹהִ֑ים נוֹרָ֥א עֲ֝לִילָ֗ה עַל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/005.yaml
  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: fr
  text: 'Venez voir les œuvres de Dieu : il inspire la crainte par ses actes envers les humains[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de l’homme », c’est-à-dire l’humanité.'
    reason: Précision sur la forme hébraïque et sa portée générique.
lexical_decisions:
- source_word: לְכוּ
  choice: Venez
  rationale: L’impératif pluriel de הלך peut signifier « allez », mais sert ici d’invitation. « Venez voir » est la tournure française naturelle.
- source_word: וּרְאוּ
  choice: voir
  rationale: L’impératif de ראה appelle les auditeurs à observer les actions de Dieu ; avec « venez », l’infinitif coordonné est idiomatique en français.
- source_word: מִפְעֲלוֹת
  choice: les œuvres
  rationale: Le pluriel désigne ce que Dieu accomplit. « Œuvres » garde un registre digne et permet de distinguer ce terme de עֲלִילָה.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte désigne clairement le Dieu d’Israël ; le singulier français convient.
- source_word: נוֹרָא
  choice: il inspire la crainte
  rationale: Le terme exprime ce qui suscite crainte et révérence. Cette formulation conserve cette force mieux que « impressionnant », sans imposer l’idée exclusive de terreur.
- source_word: עֲלִילָה
  choice: par ses actes
  rationale: Le nom singulier à valeur collective ou abstraite décrit l’activité divine ; le pluriel français est naturel et reste distinct de « œuvres ».
- source_word: עַל
  choice: envers
  rationale: La préposition marque ici le rapport ou l’orientation des actes divins à l’égard de l’humanité, sans préciser s’ils sont favorables ou hostiles.
- source_word: בְּנֵי אָדָם
  choice: les humains
  rationale: Littéralement « les fils d’Adam/de l’homme », cette expression hébraïque conventionnelle désigne collectivement les êtres humains. Le français courant « les humains » en restitue naturellement la portée générique.
theological_decisions:
- issue: Portée générique de בְּנֵי אָדָם
  choice: les humains
  alternative: les fils de l’homme
  rationale: L’expression vise l’humanité en général plutôt qu’un groupe exclusivement masculin. Le texte principal emploie une formulation française naturelle, tandis que la note conserve la forme littérale et son lien possible avec Adam.
- issue: Valeur de נוֹרָא
  choice: il inspire la crainte
  alternative: il est redoutable
  rationale: La formulation retenue préserve l’ambivalence entre effroi et révérence sans présenter nécessairement Dieu comme hostile.
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points articule l’invitation et l’affirmation qui la motive. « Inspire la crainte » conserve la gravité religieuse de נוֹרָא ; « envers » maintient l’indétermination de עַל.
