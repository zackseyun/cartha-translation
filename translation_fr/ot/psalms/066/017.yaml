  yaml_path: translation/ot/psalms/066/017.yaml
  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: fr
  text: J’ai crié vers lui de ma bouche, et la louange[a] était sous ma langue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’exaltation ». La forme hébraïque est rare et peut désigner l’exaltation, au sens de la louange exprimée.'
    reason: Ambiguïté lexicale de וְרוֹמַם.
lexical_decisions:
- source_word: אֵלָיו
  choice: l’
  rationale: Le syntagme signifie littéralement « vers lui ». En français, avec « appeler » au sens d’invoquer, le pronom objet « l’ » exprime naturellement cette relation sans remplacer le pronom hébreu par « Dieu ».
- source_word: פִּי
  choice: ma bouche
  rationale: Le nom désigne concrètement la bouche. Cette formulation conserve l’image corporelle du texte hébreu.
- source_word: קָרָאתִי
  choice: j’ai appelé
  rationale: Dans le contexte de la prière, le verbe signifie appeler ou crier vers quelqu’un. « J’ai appelé » reste digne et direct, tandis que le contexte fait entendre l’appel adressé à Dieu.
- source_word: וְרוֹמַם
  choice: et la louange
  rationale: La forme rare, issue de la racine רום (« élever, exalter »), peut exprimer l’exaltation ou la louange prononcée. « La louange » rend naturellement son sens contextuel sans masquer l’incertitude grammaticale, signalée en note.
- source_word: תַּחַת
  choice: sous
  rationale: La préposition signifie littéralement « sous ». Le maintien de cette image inhabituelle respecte la poésie hébraïque et évoque une louange prête à être exprimée.
- source_word: לְשׁוֹנִי
  choice: ma langue
  rationale: Le nom désigne littéralement la langue. Le conserver maintient le parallélisme corporel avec « ma bouche ».
theological_decisions:
- issue: Référent du pronom אֵלָיו
  choice: Conserver le pronom « le/lui »
  alternative: Expliciter « Dieu »
  rationale: Dieu est clairement l’antécédent dans le contexte, mais le verset emploie un pronom. La traduction évite donc une explicitation théologique inutile.
- issue: Valeur de וְרוֹמַם
  choice: Le comprendre comme une expression nominale de louange
  alternative: 'Le comprendre verbalement : « il était exalté »'
  rationale: La lecture nominale s’accorde bien avec la construction elliptique et le parallélisme poétique, mais la vocalisation et la forme rares autorisent une lecture verbale, conservée en note.
translation_notes:
  register: Français moderne, sobre et poétique. La tournure concrète « de ma bouche » et l’image inhabituelle « sous ma langue » sont maintenues afin de respecter le parallélisme et la texture du texte hébreu.
