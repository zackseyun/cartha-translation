id: PSA.66.19
reference: Psalms 66:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֭כֵן שָׁמַ֣ע אֱלֹהִ֑ים הִ֝קְשִׁ֗יב בְּ/ק֣וֹל תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/019.yaml
  text: Surely God has heard[a]; he has listened to the voice of my prayer.
translation:
  language: fr
  text: Oui, Dieu a entendu[a] ; il a prêté attention à la voix de ma prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Dieu a entendu la voix de ma prière et y a prêté attention. »'
    reason: 'Alternative syntaxique : le complément « la voix de ma prière » peut être compris comme précisant l’ensemble des deux verbes.'
lexical_decisions:
- source_word: אָכֵן
  choice: Oui
  rationale: Introduit ici une affirmation assurée et emphatique. « Oui » rend cette confirmation de manière naturelle et digne en français moderne.
- source_word: שָׁמַע
  choice: a entendu
  rationale: Le parfait présente l’écoute comme accomplie. Le passé composé convient au témoignage du psalmiste et garde sa portée actuelle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom, accompagné ici d’un verbe au singulier, désigne Dieu au singulier.
- source_word: הִקְשִׁיב
  choice: a prêté attention
  rationale: La forme causative de קשׁב exprime une écoute attentive. Cette tournure distingue cette idée du simple fait d’entendre exprimé dans la première proposition.
- source_word: בְּקוֹל
  choice: à la voix de
  rationale: קוֹל signifie « voix » ou « son » ; « à la voix de » conserve l’image concrète de l’hébreu tout en restant intelligible en français.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Rend directement le nom avec son suffixe possessif de première personne.
theological_decisions:
- issue: Rapport de « à la voix de ma prière » avec les deux verbes
  choice: Le complément est rattaché explicitement au second verbe, conformément à l’ordre et à la syntaxe immédiate de l’hébreu.
  alternative: Comprendre que Dieu « a entendu la voix de ma prière » puis qu’il y a prêté attention.
  rationale: L’hébreu place בְּקוֹל תְּפִלָּתִי après הִקְשִׁיב, mais le parallélisme permet de l’entendre aussi comme précisant le contenu de l’écoute dans l’ensemble du verset. La note conserve cette possibilité sans l’imposer.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu est conservé, ainsi que la distinction entre entendre et écouter avec attention.
