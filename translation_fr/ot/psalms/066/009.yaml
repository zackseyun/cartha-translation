id: PSA.66.9
reference: Psalms 66:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/שָּׂ֣ם נַ֭פְשֵׁ/נוּ בַּֽ/חַיִּ֑ים וְ/לֹֽא נָתַ֖ן לַ/מּ֣וֹט רַגְלֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/009.yaml
  text: the one who keeps our soul in life and has not allowed our feet to slip[a][b][c].
translation:
  language: fr
  text: lui qui nous maintient en vie[a][b] et n’a pas laissé nos pieds chanceler[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « celui qui place notre être dans la vie ». Le verbe hébreu peut signifier « placer » ou « établir »; dans ce contexte, il exprime l’idée de préserver en vie.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « nous » peut aussi être rendu par « notre âme » ou « notre vie ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vaciller » ou « glisser ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: lui qui maintient
  rationale: 'Le participe substantivé renvoie à Dieu comme à celui qui agit. Si שׂוּם signifie fondamentalement « placer, établir », l’expression entière a ici une valeur de préservation : Dieu maintient en vie.'
- source_word: נַפְשֵׁנוּ
  choice: nous
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. Dans cette expression, « nous » rend naturellement la personne entière sans imposer une opposition entre âme et corps; les autres possibilités sont signalées en note.
- source_word: בַּחַיִּים
  choice: en vie
  rationale: L’expression situe la נֶפֶשׁ dans la sphère de la vie; en français actuel, « en vie » en exprime clairement le sens idiomatique.
- source_word: וְלֹא נָתַן
  choice: et n’a pas laissé
  rationale: 'Avec l’infinitif qui suit, נָתַן exprime ici la permission : Dieu n’a pas permis que les pieds deviennent instables.'
- source_word: לַמּוֹט
  choice: chanceler
  rationale: מוֹט évoque l’instabilité, le vacillement ou le glissement. Avec « pieds », « chanceler » conserve l’image concrète et le registre poétique.
- source_word: רַגְלֵנוּ
  choice: nos pieds
  rationale: Traduction directe qui préserve l’image corporelle de la stabilité accordée par Dieu.
theological_decisions:
- issue: Portée anthropologique de נַפְשֵׁנוּ
  choice: nous
  alternative: notre âme / notre vie
  rationale: Le contexte concerne la préservation de la personne vivante. « Nous » évite de réduire נֶפֶשׁ à une composante immatérielle distincte, tout en conservant les autres lectures dans une note.
translation_notes:
  register: Français international moderne, naturel et digne. « Lui qui » conserve la valeur substantivée du participe hébreu; « chanceler » maintient l’image poétique des pieds rendus instables.
