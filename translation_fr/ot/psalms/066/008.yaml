  text: בָּרְכ֖וּ עַמִּ֥ים אֱלֹהֵ֑י/נוּ וְ֝/הַשְׁמִ֗יעוּ ק֣וֹל תְּהִלָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/008.yaml
  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: fr
  text: 'Peuples, bénissez notre Dieu,

    et faites entendre la voix de sa louange[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la voix de la louange qui lui est adressée ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: בָּרְכוּ
  choice: bénissez
  rationale: L’impératif pluriel de ברך appelle directement les peuples à bénir Dieu. « Bénissez » conserve l’expression biblique sans la réduire à « louez ».
- source_word: עַמִּים
  choice: Peuples
  rationale: Le pluriel est pris comme une apostrophe adressée aux divers peuples. « Peuples » préserve mieux cette pluralité collective que « nations ».
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le suffixe de première personne du pluriel est rendu directement et maintient la perspective de la communauté qui parle.
- source_word: וְהַשְׁמִיעוּ
  choice: faites entendre
  rationale: 'Le hifil impératif de שמע a une valeur causative : faire entendre. Cette formulation française est à la fois naturelle et proche de la force verbale de l’hébreu.'
- source_word: קוֹל
  choice: la voix
  rationale: קוֹל peut désigner la voix ou le son. Avec « louange », « la voix de sa louange » conserve l’image auditive et reste digne en français.
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: Le nom muni du suffixe de troisième personne masculin singulier est rendu formellement par « sa louange », sans trancher entièrement entre la louange qui lui appartient et celle qui lui est adressée.
theological_decisions:
- issue: Valeur du suffixe dans תְּהִלָּתוֹ
  choice: sa louange
  alternative: la louange qui lui est adressée
  rationale: « Sa louange » préserve la relation grammaticale du suffixe hébreu et son ambiguïté. La possibilité d’une louange adressée à Dieu est indiquée en note plutôt qu’imposée dans le texte.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. L’apostrophe initiale clarifie naturellement le destinataire des impératifs. Le parallélisme poétique est conservé sur deux lignes.
