source:
  edition: WLC
  text: מֹ֘שֵׁ֤ל בִּ/גְבוּרָת֨/וֹ עוֹלָ֗ם עֵ֭ינָי/ו בַּ/גּוֹיִ֣ם תִּצְפֶּ֑ינָה הַ/סּוֹרְרִ֓ים אַל ירימו לָ֣/מוֹ סֶֽלָה׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/007.yaml
  text: He rules forever by his might; his eyes watch the nations[a]. Let not the rebellious exalt themselves. Selah
translation:
  language: fr
  text: Il règne pour toujours par sa puissance ; ses yeux observent les nations. Que les rebelles ne s’exaltent pas[a] ! Séla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’élèvent pas » ou « ne se soulèvent pas ». Le verbe hébreu peut évoquer le fait de s’élever, de se soulever ou de s’exalter.
    reason: alternative lexicale
lexical_decisions:
- source_word: מֹשֵׁל
  choice: Il règne
  rationale: Le participe qal décrit l’exercice continu de la souveraineté divine ; un verbe conjugué est naturel en français tout en gardant cette valeur durative.
- source_word: בִּגְבוּרָתוֹ
  choice: par sa puissance
  rationale: 'גְּבוּרָה exprime la force ou la puissance, et בְּ a ici une valeur instrumentale : Dieu règne au moyen de sa puissance.'
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Dans cette position adverbiale, le terme indique une durée sans fin ; « pour toujours » est clair et idiomatique.
- source_word: עֵינָיו ... תִּצְפֶּינָה
  choice: ses yeux surveillent
  rationale: La formulation conserve l’image anthropomorphique explicite de l’hébreu et rend צפה par un verbe exprimant une observation attentive.
- source_word: בַּגּוֹיִם
  choice: les nations
  rationale: גּוֹיִם désigne ici les nations ou les peuples en général, sans imposer le sens confessionnel plus tardif de « païens ».
- source_word: הַסּוֹרְרִים
  choice: les rebelles
  rationale: Le participe désigne ceux qui résistent avec obstination ; le nom « rebelles » est naturel et vigoureux en français.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: Que les rebelles ne s’élèvent pas eux-mêmes
  rationale: אַל avec l’inaccompli exprime une défense. Le hiphil de רום peut signifier lever, s’élever ou s’exalter, tandis que לָמוֹ favorise ici une compréhension réflexive, sans éliminer les autres nuances.
- source_word: סֶלָה
  choice: Séla
  rationale: Ce terme liturgique ou musical de sens incertain est translittéré plutôt que traduit de manière conjecturale.
theological_decisions:
- issue: Image anthropomorphique de la perception divine
  choice: Conserver « ses yeux surveillent les nations »
  alternative: « il surveille les nations »
  rationale: L’hébreu mentionne explicitement les yeux de Dieu. Garder cette image préserve la force poétique sans définir la manière dont s’exerce la connaissance divine.
- issue: Sens de l’interdiction adressée aux rebelles
  choice: « ne s’élèvent pas eux-mêmes »
  alternative: « ne s’exaltent pas » ou « ne se soulèvent pas »
  rationale: La tournure réflexive rend לָמוֹ et préserve la gamme sémantique de רום entre élévation, soulèvement et exaltation orgueilleuse, au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme et l’image des « yeux » sont conservés ; « Séla » maintient le marqueur liturgique traditionnel. Le point d’exclamation restitue la force de l’interdiction sans alourdir la syntaxe.
