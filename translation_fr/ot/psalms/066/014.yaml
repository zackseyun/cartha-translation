  yaml_path: translation/ot/psalms/066/014.yaml
  text: which my lips uttered and my mouth spoke when I was in distress[a].
translation:
  language: fr
  text: 'ceux que mes lèvres ont prononcés

    et que ma bouche a exprimés quand j’étais dans la détresse.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que mes lèvres ont ouvertes ». Cette expression hébraïque signifie prononcer des paroles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: ceux que
  rationale: Le relatif renvoie aux vœux du verset précédent. « Ceux que » explicite naturellement en français le pluriel de cet antécédent sans ajouter une nouvelle idée.
- source_word: פָּצוּ
  choice: ont prononcés
  rationale: Le verbe signifie littéralement que les lèvres se sont ouvertes, mais l’expression désigne ici l’acte de prononcer des paroles. Ce choix rend l’idiome tout en conservant l’image des lèvres.
- source_word: שְׂפָתַי
  choice: mes lèvres
  rationale: La traduction littérale est naturelle en français et maintient le parallélisme poétique avec « ma bouche ».
- source_word: וְדִבֶּר
  choice: et ... a exprimés
  rationale: דבר signifie parler. « A exprimés » évite une tournure française maladroite avec « bouche » et conserve le second membre parallèle comme acte de parole.
- source_word: פִּי
  choice: ma bouche
  rationale: La formulation littérale préserve le parallélisme synonymique « mes lèvres / ma bouche ».
- source_word: בַּצַּר לִי
  choice: quand j’étais dans la détresse
  rationale: La préposition et la construction indiquent la circonstance temporelle dans laquelle se trouvait le psalmiste. « Dans la détresse » garde la force personnelle et grave de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique entre les lèvres et la bouche est conservé, tandis que l’idiome hébreu est rendu naturellement. L’accord de « prononcés » et « exprimés » avec les vœux du verset précédent maintient clairement le lien relatif.
