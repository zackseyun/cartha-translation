id: PSA.66.11
reference: Psalms 66:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲבֵאתָ֥/נוּ בַ/מְּצוּדָ֑ה שַׂ֖מְתָּ מוּעָקָ֣ה בְ/מָתְנֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/011.yaml
  text: You brought us into the net[b][a]; you laid affliction on our loins.
translation:
  language: fr
  text: Tu nous as fait entrer dans le filet[a] ; tu as placé un fardeau sur nos reins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le piège » ou « dans la forteresse » ; le mot hébreu peut désigner un moyen de capture ou un lieu fortifié.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur nos reins » ; le terme hébreu désigne la région des reins ou des hanches.
    reason: lexical_clarification
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Tu nous as fait entrer
  rationale: Le hiphil de בוא avec suffixe de première personne du pluriel signifie « faire entrer, amener ». Cette formulation naturelle conserve explicitement l’action divine.
- source_word: בַמְּצוּדָה
  choice: dans le filet
  rationale: מְצוּדָה peut désigner un dispositif de capture, un piège ou une place forte. Dans cette évocation d’épreuve et de contrainte, « filet » rend bien l’image de la capture sans dissimuler l’ambiguïté lexicale, signalée en note.
- source_word: שַׂמְתָּ
  choice: tu as placé
  rationale: שׂים signifie couramment « mettre, placer ». « Placer un fardeau sur » est clair et demeure proche de la construction hébraïque.
- source_word: מוּעָקָה
  choice: un fardeau
  rationale: Le nom évoque la pression, la détresse ou une charge contraignante. « Fardeau » convient à l’image corporelle de quelque chose placé sur les reins, tout en suggérant l’épreuve imposée.
- source_word: בְמָתְנֵינוּ
  choice: sur nos reins
  rationale: מָתְנַיִם désigne les reins ou les hanches. « Reins » conserve l’image corporelle biblique dans un français digne et compréhensible; la préposition est naturellement rendue par « sur ».
theological_decisions:
- issue: Action divine dans l’épreuve
  choice: 'Maintenir l’adresse directe à Dieu : « Tu nous as fait entrer… tu as placé… »'
  alternative: Atténuer l’action divine par une tournure impersonnelle, telle que « nous sommes entrés » ou « un fardeau est tombé sur nous »
  rationale: Les deux verbes hébreux sont à la deuxième personne et attribuent directement à Dieu l’entrée dans le lieu de capture ainsi que l’imposition du fardeau. La traduction préserve cette tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. Le parallélisme et l’image corporelle sont conservés.
