source:
  edition: WLC
  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: fr
  text: Si j’avais entretenu le mal dans mon cœur[a], le Seigneur ne m’aurait pas écouté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si j’avais considéré le mal dans mon cœur, le Seigneur ne m’aurait pas entendu. »'
    reason: Alternative lexicale conservant plus directement les sens usuels de ראה (« voir, considérer ») et שׁמע (« entendre »).
lexical_decisions:
- source_word: אָוֶן
  choice: le mal
  rationale: Dans ce contexte moral, אָוֶן désigne le mal ou la faute. « Le mal » est naturel en français moderne et évite le registre plus spécialisé d’« iniquité ».
- source_word: אִם
  choice: si
  rationale: La particule introduit simplement la condition irréelle exprimée par le plus-que-parfait et le conditionnel passé en français.
- source_word: רָאִיתִי
  choice: j’avais entretenu
  rationale: Le sens premier est « voir », mais l’expression « voir le mal dans son cœur » évoque ici le fait de lui accorder intérieurement une place favorable. « Entretenir » rend cet accueil volontaire sans aller jusqu’au terme affectif plus fort « chérir ».
- source_word: בְלִבִּי
  choice: dans mon cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de la pensée et de la volonté.
- source_word: לֹא יִשְׁמַע
  choice: ne m’aurait pas écouté
  rationale: שׁמע peut signifier « entendre » ou « écouter ». Dans le contexte de la prière, « écouter » suggère une audition favorable sans ajouter explicitement l’idée d’exaucer.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: אֲדֹנָי est ici le titre divin consacré, naturellement rendu en français par « le Seigneur ».
theological_decisions:
- issue: Faut-il rendre littéralement l’expression « voir le mal dans mon cœur » ou en expliciter la valeur idiomatique ?
  choice: Exprimer l’idée de maintenir volontairement le mal dans son cœur par « entretenir ».
  alternative: « Si j’avais considéré le mal dans mon cœur » ou, plus littéralement, « Si j’avais vu le mal dans mon cœur ».
  rationale: Le propos ne vise vraisemblablement pas la simple conscience de son péché, mais l’attention favorable ou la place accordée au mal intérieurement. La note préserve toutefois la formulation plus proche de l’hébreu.
- issue: Faut-il traduire שׁמע par « entendre », « écouter » ou « exaucer » ?
  choice: « écouter » dans le texte principal.
  alternative: « entendre » ; « exaucer ».
  rationale: « Écouter » convient au contexte de prière et garde la nuance d’accueil favorable, tandis qu’« exaucer » préciserait davantage que ne le fait directement le verbe hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conditionnelle irréelle est rendue par le plus-que-parfait suivi du conditionnel passé. L’image du cœur est conservée.
