    rationale: יַזַמְּרוּ שִׁמְךָ signifie littéralement qu’ils chanteront/fêteront « ton nom ». En français biblique moderne, « elle chantera ton nom » est intelligible, naturel et maintient le parallélisme ainsi que l’expression théologique « ton nom ».
  - severity: low
    issue: La première occurrence de זמר peut être formulée plus près de son complément « à toi ».
    rationale: « Te chantera des louanges » rend explicitement le pronom לְךָ et garde le lexique de la louange sans ajouter de contenu.
