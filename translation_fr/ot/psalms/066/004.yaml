  text: כָּל הָ/אָ֤רֶץ יִשְׁתַּחֲו֣וּ לְ֭/ךָ וִֽ/יזַמְּרוּ לָ֑/ךְ יְזַמְּר֖וּ שִׁמְ/ךָ֣ סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/004.yaml
  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: fr
  text: Toute la terre se prosternera devant toi[a] et te chantera des louanges ; elle chantera ton nom. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’adorera ». Le verbe hébreu peut désigner la prosternation comme acte d’adoration.
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est probablement une indication musicale ou liturgique, mais son sens précis demeure incertain.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Toute la terre
  rationale: L’expression a ici une portée universelle. « Terre » convient mieux au contexte cosmique du psaume que « pays ».
- source_word: יִשְׁתַּחֲווּ
  choice: se prosternera
  rationale: Le verbe désigne le fait de s’incliner profondément ou de se prosterner devant quelqu’un, notamment comme geste d’adoration. Cette traduction conserve l’image corporelle sans réduire le terme à une notion abstraite.
- source_word: לְךָ
  choice: devant toi / tes
  rationale: Avec « se prosterner », le français idiomatique demande « devant toi » ; avec le chant de louange dirigé vers Dieu, « chantera tes louanges » exprime naturellement la relation marquée par la préposition hébraïque.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: chantera les louanges
  rationale: Dans ce contexte, זמר désigne un chant de louange. La répétition du verbe hébreu est conservée en français par la répétition de « chantera ».
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La traduction littérale préserve l’expression biblique, qui peut évoquer à la fois l’identité révélée, le caractère et la renommée de Dieu.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens exact du terme demeure incertain. Sa translittération évite de lui attribuer une signification musicale ou liturgique trop précise.
theological_decisions:
- issue: Faut-il rendre יִשְׁתַּחֲווּ par un terme cultuel explicite ou par le geste corporel ?
  choice: se prosternera
  alternative: t’adorera
  rationale: Le verbe peut décrire la prosternation comme acte d’adoration. La traduction retenue préserve toutefois l’image concrète du texte hébreu et laisse perceptible sa dimension cultuelle sans l’expliciter davantage.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier « elle chantera » reprend grammaticalement le collectif « toute la terre ». La ponctuation met en relief le parallélisme sans effacer la répétition de l’hébreu.
