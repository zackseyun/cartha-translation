id: PSA.66.16
reference: Psalms 66:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: fr
  text: Venez, écoutez, vous tous qui craignez Dieu, et je raconterai ce qu’il a fait pour moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour mon âme » ou « pour ma vie ». Le mot hébreu נֶפֶשׁ (néfèsh) peut désigner la personne elle-même, son âme ou sa vie selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venez
  rationale: Bien que le verbe signifie littéralement « aller, marcher », il introduit ici une invitation et se rend naturellement en français par « Venez ».
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif appelle à une attention volontaire. « Écoutez » est plus idiomatique ici que « entendez » en français moderne.
- source_word: וַאֲסַפְּרָה
  choice: et je raconterai
  rationale: La forme exprime l’intention du psalmiste de relater l’action de Dieu. « Je raconterai » conserve le sens de ספר et convient au témoignage personnel.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: vous tous qui craignez Dieu
  rationale: Cette formulation française directe conserve la notion biblique de crainte révérencielle sans la réduire au simple respect ni l’identifier à la terreur.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le texte emploie le titre אֱלֹהִים, et non le nom divin YHWH ; « Dieu » est donc approprié.
- source_word: אֲשֶׁר עָשָׂה
  choice: ce qu’il a fait
  rationale: Le passé composé exprime naturellement en français une action accomplie dont les effets demeurent pertinents dans ce témoignage.
- source_word: לְנַפְשִׁי
  choice: pour moi
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne ou la vie du locuteur. « Pour moi » est naturel et évite que « mon âme » suggère en français une composante immatérielle distincte, sans imposer cette anthropologie au terme hébreu. Les rendus plus formels sont signalés en note.
theological_decisions:
- issue: Sens de « craindre Dieu »
  choice: Conserver « craignez Dieu »
  alternative: « révérez Dieu » ou une peur terrifiée devant Dieu
  rationale: Le français « craindre Dieu » préserve la tension biblique d’une crainte faite de révérence et d’obéissance, sans l’adoucir en simple respect ni la durcir en terreur pure.
- issue: Portée de נֶפֶשׁ
  choice: « pour moi » dans le texte
  alternative: « pour mon âme » ou « pour ma vie »
  rationale: Le terme hébreu peut désigner l’âme, la vie ou la personne elle-même. Dans cette construction, « pour moi » restitue avec naturel la référence à la personne entière, tandis qu’une note conserve les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La succession « Venez, écoutez » garde les deux impératifs hébreux ; « raconterai » maintient la tonalité de témoignage du psaume.
