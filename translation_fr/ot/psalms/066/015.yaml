  text: עֹ֘ל֤וֹת מֵחִ֣ים אַעֲלֶה לָּ֭/ךְ עִם קְטֹ֣רֶת אֵילִ֑ים אֶ֥עֱשֶֽׂה בָקָ֖ר עִם עַתּוּדִ֣ים סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: fr
  text: Je t’offrirai des holocaustes de bêtes engraissées, avec la fumée[a] des béliers ; je sacrifierai des bovins avec des boucs. Séla[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’odeur des béliers » ; le mot hébreu peut désigner la fumée ou l’odeur produite par la combustion d’un sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Le sens exact de « Séla » est incertain ; il s’agit peut-être d’une indication musicale ou liturgique.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת מֵחִים
  choice: des bêtes engraissées en holocauste
  rationale: עֹלוֹת désigne des sacrifices entièrement consumés sur l’autel, et מֵחִים des animaux gras ou bien nourris. Cette formulation française exprime naturellement les deux éléments.
- source_word: אַעֲלֶה לָךְ
  choice: je t’offrirai
  rationale: Dans ce contexte sacrificiel, la forme causative de עלה signifie faire monter une offrande, donc l’offrir à Dieu.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: avec la fumée des béliers
  rationale: קְטֹרֶת peut désigner la fumée ou l’odeur produite par la combustion. Puisque des béliers sont en vue, « fumée » évite de suggérer qu’ils seraient de l’encens.
- source_word: אֶעֱשֶׂה
  choice: je sacrifierai
  rationale: Le verbe עשה, littéralement « faire », prend ici un sens sacrificiel idiomatique. « Je sacrifierai » est clair et naturel en français.
- source_word: בָקָר
  choice: des bovins
  rationale: Le nom collectif désigne le gros bétail sans préciser nécessairement qu’il s’agit de taureaux. « Bovins » conserve cette généralité.
- source_word: עַתּוּדִים
  choice: des boucs
  rationale: Le terme désigne spécifiquement des caprins mâles ; « boucs » rend cette précision directement dans le texte.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens exact de cette indication probablement musicale ou liturgique demeure incertain ; elle est donc transcrite plutôt que traduite.
theological_decisions: []
