  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/000.yaml
  text: For the choir director[a]. A song, a psalm. Shout joyfully to God[b], all the earth.
translation:
  language: fr
  text: Au chef de chœur[a]. Chant, psaume. Acclame Dieu, terre entière[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur de la musique » ou « Au maître de chant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Pousse des cris de joie vers Dieu, terre entière ! »
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Rend naturellement en français la désignation probablement musicale du responsable de l’exécution, tout en signalant en note les autres traductions possibles.
- source_word: שִׁיר מִזְמוֹר
  choice: Chant, psaume
  rationale: Conserve les deux désignations juxtaposées et leur ordre sans expliciter une relation que l’hébreu ne précise pas.
- source_word: הָרִיעוּ
  choice: Acclame
  rationale: L’impératif hébreu appelle à pousser un cri retentissant, souvent joyeux ou triomphal. « Acclame » exprime cet appel de manière naturelle et digne.
- source_word: כָּל־הָאָרֶץ
  choice: terre entière
  rationale: En apostrophe, le singulier français « terre entière » correspond naturellement à l’ensemble du monde habité visé par l’hébreu.
theological_decisions:
- issue: Nature exacte de l’acclamation exprimée par הָרִיעוּ
  choice: Acclame Dieu
  alternative: Pousse des cris de joie vers Dieu
  rationale: Le contexte cultuel favorise une acclamation joyeuse, mais le verbe lui-même désigne plus largement un cri retentissant. Le texte principal reste concis, et la note conserve l’explicitation possible.
translation_notes:
  register: Français international moderne, solennel mais accessible. L’apostrophe « terre entière » appelle naturellement le singulier « Acclame ». La ponctuation distingue la suscription musicale de l’appel adressé à toute la terre.
