source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ שִׁ֣יר מִזְמ֑וֹר הָרִ֥יעוּ לֵ֝/אלֹהִים כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/001.yaml
  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: fr
  text: Au chef de chœur[a]. Chant, psaume. Acclamez Dieu[b], terre entière !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur musical » ou « Au maître de chœur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Poussez des cris vers Dieu, terre entière ! » Le verbe peut désigner un cri de joie ou de triomphe.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Cette formule de suscription désigne vraisemblablement le responsable de l’exécution musicale. « Au chef de chœur » est clair et actuel, tout en laissant ouverte la nature précise de sa fonction.
- source_word: שִׁיר
  choice: Chant
  rationale: Rend simplement l’étiquette de genre et convient au registre d’une suscription.
- source_word: מִזְמוֹר
  choice: psaume
  rationale: Équivalent français usuel du terme technique מִזְמוֹר. Les deux désignations, « chant » et « psaume », sont conservées plutôt que fusionnées.
- source_word: הָרִיעוּ
  choice: Acclamez
  rationale: Le verbe évoque un cri sonore, souvent jubilant ou triomphal. « Acclamez » exprime naturellement en français cet appel collectif sans préciser à l’excès s’il s’agit de joie ou de victoire.
- source_word: לֵאלֹהִים
  choice: Dieu
  rationale: Avec « acclamer », le complément français se construit directement, alors que la préposition hébraïque marque le destinataire de l’acclamation.
- source_word: כָּל הָאָרֶץ
  choice: terre entière
  rationale: Dans cet appel universel à la louange, הָאָרֶץ désigne naturellement toute la terre plutôt qu’un territoire particulier. La tournure vocative française est concise et poétique.
theological_decisions:
- issue: Portée de כָּל הָאָרֶץ
  choice: appel universel adressé à la terre entière
  alternative: appel adressé à tout le pays ou à l’ensemble du domaine terrestre
  rationale: Le contexte de louange soutient une portée universelle. « Terre entière » préserve cette ampleur sans expliciter davantage l’identité des personnes appelées à acclamer.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la brièveté de la suscription ainsi que les deux étiquettes de genre. « Acclamez » restitue idiomatiquement la force collective de l’impératif hébreu pluriel.
