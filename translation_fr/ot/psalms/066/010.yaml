  text: כִּֽי בְחַנְתָּ֥/נוּ אֱלֹהִ֑ים צְ֝רַפְתָּ֗/נוּ כִּ/צְרָף כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: fr
  text: Car tu nous as mis à l’épreuve[a], ô Dieu ; tu nous as affinés comme on affine l’argent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu nous as examinés » ; le verbe hébreu peut souligner une mise à l’épreuve destinée à manifester l’authenticité.
    reason: lexical_alternative
  - marker: b
    text: 'L’image est métallurgique : Dieu est comparé à celui qui affine l’argent.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison de la louange dans le contexte et conserve naturellement la valeur explicative de la particule.
- source_word: בְחַנְתָּנוּ
  choice: tu nous as mis à l’épreuve
  rationale: Le verbe בחן désigne l’action d’examiner ou d’éprouver afin de vérifier la qualité ou l’authenticité ; cette formulation française est claire et s’accorde avec l’image de l’affinage.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le contexte indique une adresse directe ; « ô Dieu » en conserve la valeur vocative dans un registre poétique digne.
- source_word: צְרַפְתָּנוּ
  choice: tu nous as affinés
  rationale: צרף appartient au vocabulaire du travail des métaux et évoque leur affinage par le feu ; « affinés » préserve cette métaphore.
- source_word: כִּצְרָף
  choice: comme on affine
  rationale: Le préfixe כְּ marque la comparaison et la forme verbale décrit le procédé de manière générale ; le tour impersonnel est naturel en français.
- source_word: כָּסֶף
  choice: l’argent
  rationale: Désigne littéralement le métal précieux employé dans la comparaison.
