source:
  edition: WLC
  text: אִמְר֣וּ לֵ֭/אלֹהִים מַה נּוֹרָ֣א מַעֲשֶׂ֑י/ךָ בְּ/רֹ֥ב עֻ֝זְּ/ךָ֗ יְֽכַחֲשׁ֖וּ לְ/ךָ֣ אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/003.yaml
  text: Say to God[a], “How awesome are your works! Because of the greatness of your strength, your enemies cringe before you.”
translation:
  language: fr
  text: 'Dites à Dieu : « Que tes œuvres sont redoutables ! À cause de la grandeur de ta puissance, tes ennemis feignent de se soumettre à toi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se soumettent à toi à contrecœur ». Le verbe hébreu peut désigner une soumission feinte ou imposée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ לֵאלֹהִים
  choice: Dites à Dieu
  rationale: L’impératif qal pluriel appelle la communauté à s’adresser directement à Dieu ; cette formulation est naturelle et fidèle.
- source_word: מַה נּוֹרָא מַעֲשֶׂיךָ
  choice: Que tes œuvres sont redoutables !
  rationale: La tournure exclamative מַה exprime l’émerveillement, tandis que נוֹרָא évoque ce qui inspire à la fois crainte et révérence. « Redoutables » conserve cette force mieux que le faible « impressionnantes ».
- source_word: בְּרֹב עֻזֶּךָ
  choice: Devant la grandeur de ta puissance
  rationale: La préposition בְּ peut ici exprimer la cause ou la puissance face à laquelle les ennemis réagissent. « Devant » produit un français idiomatique tout en reliant leur soumission à l’immensité de la force divine.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: feignent de se soumettre à toi
  rationale: Le piel de כחש construit avec ל peut désigner une soumission mensongère, contrainte ou réticente. Cette traduction rend explicitement la nuance de feinte sans la réduire à une soumission sincère.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Équivalent français direct du nom pluriel muni du suffixe de deuxième personne du masculin singulier.
theological_decisions:
- issue: Nature de la réaction des ennemis envers Dieu
  choice: Une soumission feinte sous l’effet de la puissance divine
  alternative: « tes ennemis se courbent devant toi » ou « se soumettent à toi à contrecœur »
  rationale: כחש comporte souvent une nuance de tromperie ou d’obéissance seulement apparente. Le texte ne présente donc pas nécessairement une adoration sincère ; la note conserve toutefois l’éventail sémantique du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. « Redoutables » garde la dimension de crainte révérencielle ; la formulation de la dernière proposition préserve l’ambiguïté entre feinte et contrainte grâce à la note.
