  yaml_path: translation/ot/psalms/066/002.yaml
  text: Sing the glory of his name[a]; make his praise glorious.
translation:
  language: fr
  text: Chantez la gloire de son nom ; rendez glorieuse sa louange.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « donnez de la gloire à sa louange ». L’hébreu emploie littéralement le nom « gloire » dans une expression dont le sens exact reste quelque peu ouvert.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Chantez
  rationale: Impératif pluriel de זמר, qui appelle à célébrer Dieu en musique. « Chantez » est concis, naturel et convient au parallélisme poétique.
- source_word: כְבוֹד שְׁמוֹ
  choice: la gloire de son nom
  rationale: Cette traduction directe du groupe construit préserve l’accent hébreu sur la gloire attachée au nom, plutôt que de réduire l’expression à l’adjectif « son nom glorieux ».
- source_word: שִׂימוּ כָבוֹד
  choice: rendez glorieuse
  rationale: שׂים signifie littéralement « mettre, placer », mais l’expression demande ici que la louange soit présentée avec gloire. « Rendez glorieuse » restitue naturellement en français la construction idiomatique avec le nom כָבוֹד.
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: Le nom תְּהִלָּה avec suffixe masculin singulier signifie directement « sa louange » et peut désigner la louange qui lui est adressée ou celle qui lui appartient.
