source:
  edition: WLC
  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: fr
  text: Tu as fait passer un homme à cheval sur nos têtes ; nous sommes passés par le feu et par l’eau, et tu nous as fait sortir vers l’abondance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers un lieu bien arrosé » ; le mot hébreu peut évoquer l’abondance, la satiété ou un lieu richement irrigué.'
    reason: Le terme רְוָיָה est rare et son image précise demeure incertaine.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: un homme
  rationale: Le nom collectif אֱנוֹשׁ est ici au singulier et désigne un être humain, probablement l’oppresseur ; « un homme » préserve cette forme et l’indétermination du texte.
- source_word: הִרְכַּבְתָּ ... לְרֹאשֵׁנוּ
  choice: Tu as fait chevaucher ... sur nos têtes
  rationale: Cette formulation conserve l’image forte de domination du texte hébreu, où Dieu permet à un homme de passer à cheval au-dessus du peuple.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: nous sommes passés par le feu et par l’eau
  rationale: Littéralement « nous sommes entrés dans le feu et dans l’eau » ; « passer par » exprime naturellement en français la traversée de ces épreuves tout en gardant les deux images.
- source_word: לָרְוָיָה
  choice: vers l’abondance
  rationale: Le terme rare רְוָיָה évoque la satiété, l’abondance ou un lieu bien arrosé. « L’abondance » rend le contraste avec les épreuves sans préciser excessivement la nature du bienfait.
theological_decisions:
- issue: Agent divin et oppression humaine
  choice: Maintenir « Tu as fait »
  alternative: « Tu as laissé »
  rationale: Le causatif hébreu attribue directement à Dieu l’action de faire chevaucher l’oppresseur ; l’atténuer en simple permission résoudrait la tension théologique présente dans le texte.
- issue: Identité de אֱנוֹשׁ
  choice: « un homme » au singulier
  alternative: « des hommes » ou « les mortels »
  rationale: Le singulier indéfini correspond à la forme source et préserve l’ambiguïté entre un oppresseur individuel et une désignation représentative de l’ennemi.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme et les images concrètes du verset sont conservés ; la ponctuation rend clairement le passage de l’oppression à la délivrance.
