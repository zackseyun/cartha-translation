    rationale: Cette formulation ajoute une opposition explicite qui n'est pas marquée par le texte et ne rend pas le verbe יצא (« faire sortir »).
  - severity: low
    issue: « fait chevaucher un homme »
    rationale: La construction est moins naturelle en français et peut laisser incertaine l'image du cavalier; « fait passer un homme à cheval » la clarifie sans modifier le sens.
  revised_text: Tu as fait passer un homme à cheval sur nos têtes ; nous sommes passés par le feu et par l’eau, et tu nous as fait sortir vers l’abondance.[a]
