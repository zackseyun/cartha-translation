  source_fidelity: La finale hébraïque וַתּוֹצִיאֵנוּ signifie explicitement « tu nous as fait sortir / tu nous as fait parvenir hors de là »; « tu nous as conduits » affaiblit cette image de délivrance. Le waw narratif ne porte pas nécessairement l'opposition marquée par « mais ». Le singulier indéfini « un homme » rend correctement אֱנוֹשׁ, et l'image de quelqu'un monté à cheval au-dessus du peuple est conservée.
  naturalness: « Faire chevaucher un homme sur nos têtes » est grammaticalement possible, mais peu idiomatique et ambigu en français moderne. « Faire passer un homme à cheval sur nos têtes » rend l'image de façon plus claire et naturelle.
  terminology: « L'abondance » est une option prudente pour לָרְוָיָה et la note rend utilement compte de son champ sémantique et de l'incertitude de l'image. Aucun terme théologique ne demande de modification.
