  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: fr
  text: Béni soit Dieu, qui n’a pas rejeté ma prière ni retiré de moi son amour fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu emploie un seul verbe : « qui n’a pas écarté ma prière et son amour fidèle d’auprès de moi ». En français, « rejeté » s’applique naturellement à la prière et « retiré de moi » à l’amour fidèle. Le mot hébreu traduit par « amour fidèle » peut aussi évoquer la bonté loyale ou la fidélité à l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif fonctionne ici comme une acclamation de louange. « Béni soit » rend naturellement en français cette formule doxologique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom désigne ici le Dieu d’Israël, célébré directement.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le relatif introduit une proposition décrivant ce que Dieu n’a pas fait.
- source_word: לֹא הֵסִיר
  choice: n’a rejeté
  rationale: Le hiphil de סור signifie faire partir, écarter ou détourner. Avec « prière », « rejeter » exprime naturellement le refus d’accueillir; la coordination étend le même verbe à l’amour fidèle sans effacer l’image hébraïque, explicitée en note.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Traduction directe du nom désignant ici la prière adressée à Dieu.
- source_word: וְחַסְדּוֹ
  choice: ni son amour fidèle
  rationale: Après une négation, « ni… ni… » rend idiomatiquement la coordination hébraïque. חֶסֶד associe amour, bonté et fidélité durable.
- source_word: מֵאִתִּי
  choice: envers moi
  rationale: Avec « son amour fidèle », cette formulation française indique naturellement que Dieu ne l’a pas retiré au psalmiste; le sens littéral de séparation est signalé en note.
theological_decisions:
- issue: Rendu de חֶסֶד
  choice: son amour fidèle
  alternative: sa fidélité à l’alliance ; son amour loyal ; sa bonté
  rationale: « Amour fidèle » conserve à la fois la bienveillance et la constance relationnelle du terme, sans imposer dans le texte une explicitation technique de l’alliance.
- issue: Portée de la négation et coordination
  choice: n’a rejeté ni ma prière ni son amour fidèle envers moi
  alternative: n’a pas écarté ma prière et son amour fidèle loin de moi
  rationale: La syntaxe hébraïque place les deux compléments sous le même verbe négatif. La tournure française « ni… ni… » communique clairement cette portée tout en gardant la tension entre l’accueil de la prière et le maintien de l’amour divin.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Béni soit Dieu » conserve le ton liturgique du psaume. La note maintient l’image littérale et l’étendue sémantique de חֶסֶד.
