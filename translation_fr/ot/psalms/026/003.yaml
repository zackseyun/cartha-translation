  source_fidelity: 'Le texte principal rend correctement כִּי (« Car »), חַסְדְּךָ (« ton amour fidèle »), לְנֶגֶד עֵינַי (« devant mes yeux ») et בַּאֲמִתֶּךָ (« dans ta vérité »). Toutefois, וְהִתְהַלַּכְתִּי est un parfait : « j’ai marché » conserve mieux l’aspect accompli que le présent « je marche », qui explicite une habitude possible mais non grammaticalement marquée en français.'
