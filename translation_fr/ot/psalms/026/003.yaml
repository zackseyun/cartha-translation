  terminology: '« Amour fidèle » et « vérité » préservent de manière équilibrée les champs sémantiques de חֶסֶד et dֶאֱמֶת, sans les réduire respectivement à l’alliance ou à la fidélité. La note sur l’alliance doit être reformulée : « loyauté envers ton alliance » suggère une relation formulée comme si Dieu était loyal envers sa propre alliance, formulation peu naturelle et plus étroite que le mot hébreu.'
