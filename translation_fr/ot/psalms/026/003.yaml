  text: For your steadfast love is before my eyes[b][a], and I have walked in your truth.
translation:
  language: fr
  text: Car ton amour fidèle est devant mes yeux[a], et j’ai marché dans ta vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ton amour constant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans ta fidélité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation du psalmiste dans le contexte et conserve naturellement la valeur explicative de l’hébreu.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: Rend la bonté aimante, durable et loyale exprimée par חֶסֶד, avec sa portée relationnelle et potentiellement alliancélle, sans la réduire à la seule miséricorde.
- source_word: לְנֶגֶד עֵינַי
  choice: devant mes yeux
  rationale: Conserve l’image hébraïque et exprime naturellement ce que le psalmiste garde constamment en vue.
- source_word: וְהִתְהַלַּכְתִּי
  choice: et je marche
  rationale: Le hitpael de הלך décrit ici une manière habituelle de vivre. Le présent français exprime clairement cette conduite continue tout en conservant la métaphore de la marche.
- source_word: בַּאֲמִתֶּךָ
  choice: dans ta vérité
  rationale: Préserve la formulation et l’étendue sémantique de אֱמֶת, qui peut désigner la vérité, la fidélité et la fiabilité de Dieu.
theological_decisions:
- issue: Étendue sémantique des termes divins חֶסֶד et אֱמֶת
  choice: Traduire חֶסֶד par « amour fidèle » et אֱמֶת par « vérité ».
  alternative: Traduire par « loyauté envers ton alliance » et « fidélité ».
  rationale: Le verset présente le caractère fiable et aimant de Dieu comme orientant la conduite du psalmiste. Le texte principal conserve la richesse des deux termes sans imposer une précision doctrinale plus étroite que l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du parallélisme hébraïque; « amour fidèle » est immédiatement compréhensible, tandis que les notes préservent les principales possibilités lexicales.
