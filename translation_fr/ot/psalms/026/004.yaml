  text: לֹא יָ֭שַׁבְתִּי עִם מְתֵי שָׁ֑וְא וְ/עִ֥ם נַ֝עֲלָמִ֗ים לֹ֣א אָבֽוֹא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/004.yaml
  text: I have not sat with men of falsehood[a], and I do not go in with those who conceal themselves.
translation:
  language: fr
  text: Je ne me suis pas assis avec des gens faux, et je n’entrerai pas avec ceux qui dissimulent ce qu’ils sont[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « et je n’entrerai pas avec ceux qui se cachent ». L’hébreu peut désigner des personnes qui cachent leur véritable caractère, donc des dissimulateurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: je ne me suis pas assis en compagnie de
  rationale: Le verbe signifie littéralement « s’asseoir, demeurer » et, avec « avec », évoque ici le fait de tenir compagnie à quelqu’un. La formulation conserve l’image hébraïque tout en explicitant naturellement la relation.
- source_word: מְתֵי שָׁוְא
  choice: des gens faux
  rationale: L’expression désigne littéralement des « hommes de fausseté »; שָׁוְא peut évoquer la fausseté, la tromperie ou la vanité. « Des gens faux » rend le sens moral dans un français actuel sans restreindre indûment le groupe aux hommes de sexe masculin.
- source_word: נַעֲלָמִים
  choice: ceux qui dissimulent ce qu’ils sont
  rationale: Ce terme dérive d’une racine signifiant « cacher ». La traduction exprime l’idée probable de personnes dissimulées ou dissimulatrices, sans adopter le terme plus interprétatif « hypocrites ».
- source_word: אָבוֹא
  choice: je ne me mêle pas à
  rationale: בוא signifie normalement « venir, aller, entrer ». Dans ce parallélisme et avec « avec », il évoque vraisemblablement le fait de rejoindre la compagnie de ces personnes; l’expression française rend cette valeur relationnelle avec naturel.
- source_word: וְעִם
  choice: et ... à
  rationale: La conjonction et la préposition coordonnent étroitement le second membre au premier. La construction française adapte la préposition au verbe « se mêler à » tout en maintenant le parallélisme.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Gens » évite un masculin inutilement restrictif; « se mêler à » rend idiomatiquement l’association suggérée par le verbe de mouvement, tandis que la note conserve la formulation plus littérale et l’ambiguïté de נַעֲלָמִים.
