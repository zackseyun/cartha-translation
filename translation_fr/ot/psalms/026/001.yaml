source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: fr
  text: 'De David.[a]


    Rends-moi justice,[b] Yahweh,

    car j’ai marché dans mon intégrité,[c]

    et j’ai mis ma confiance en Yahweh :

    je ne chancellerai pas.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David » ou « À David ». Le titre hébreu peut indiquer l’auteur, l’appartenance, l’association ou la dédicace.
    reason: ambiguïté_du_titre
  - marker: b
    text: Littéralement « Juge-moi ». Ici, le verbe peut exprimer une demande de jugement favorable, donc de justification.
    reason: alternative_lexicale
  - marker: c
    text: Ou « dans ma droiture » ou « dans mon innocence ». Le terme hébreu évoque l’intégrité et le caractère entier d’une conduite.
    reason: alternative_lexicale
  - marker: d
    text: Ou « je ne glisserai pas » ou « je ne vacillerai pas ». L’image hébraïque est celle d’une perte d’appui.
    reason: alternative_lexicale
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres des psaumes peut indiquer l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve cette relative indétermination.
- source_word: שָׁפְטֵנִי
  choice: Rends-moi justice
  rationale: L’impératif de שׁפט signifie littéralement « juge-moi », mais, dans cet appel judiciaire fondé sur l’intégrité du psalmiste, il demande vraisemblablement une décision favorable. « Rends-moi justice » exprime ce sens sans effacer l’image du jugement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. « Yahweh » le représente comme nom propre plutôt que de lui substituer un titre.
- source_word: בְּתֻמִּי
  choice: dans mon intégrité
  rationale: תֹּם désigne l’intégrité, la droiture ou le caractère entier. « Intégrité » maintient l’affirmation morale du psalmiste sans lui faire nécessairement revendiquer une perfection absolue.
- source_word: הָלַכְתִּי
  choice: j’ai marché
  rationale: Le verbe conserve la métaphore hébraïque de la marche pour la conduite de la vie, métaphore compréhensible en français biblique courant.
- source_word: בָּטַחְתִּי
  choice: j’ai mis ma confiance
  rationale: בטח exprime une confiance assurée et un appui placé en quelqu’un. Cette tournure est naturelle en français et rend explicitement la relation à Yahweh.
- source_word: לֹא אֶמְעָד
  choice: je ne chancellerai pas
  rationale: מעד évoque le pied qui glisse, la perte d’appui ou le vacillement. « Chanceler » préserve cette image tout en exprimant ici l’assurance tournée vers l’avenir.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Puisque l’hébreu emploie explicitement le tétragramme, le texte français conserve un nom propre au lieu de le remplacer par un titre.
- issue: Portée de l’affirmation בְּתֻמִּי
  choice: dans mon intégrité
  alternative: dans mon innocence / dans ma perfection
  rationale: Le psalmiste invoque la cohérence et la droiture de sa conduite dans un contexte judiciaire. Le choix maintient la force de cette revendication sans la transformer en affirmation explicite d’une absence absolue de péché.
- issue: Valeur de לֹא אֶמְעָד
  choice: 'assurance : « je ne chancellerai pas »'
  alternative: 'demande implicite : « que je ne chancelle pas »'
  rationale: La forme verbale se lit naturellement comme l’expression confiante de la stabilité découlant de la confiance en Yahweh, tout en laissant l’image concrète ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et les images hébraïques de la marche et du vacillement sont conservés. La ponctuation relie la confiance en Yahweh à l’assurance finale sans imposer une relation logique plus précise que celle du texte hébreu.
