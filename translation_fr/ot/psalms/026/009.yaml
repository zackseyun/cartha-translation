  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: fr
  text: 'Ne rassemble pas mon âme avec les pécheurs[a],

    ni ma vie avec les hommes sanguinaires[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe peut aussi évoquer le fait d’être emporté avec les méchants lors du jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « hommes de sangs », expression hébraïque désignant des hommes violents ou coupables d’effusion de sang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: m’emporte
  rationale: Dans ce contexte de jugement, אָסַף peut évoquer le fait d’être emporté ou retranché avec un groupe. « M’emporte » exprime naturellement cette portée en français, tandis qu’une note conserve l’image plus littérale de « rassembler ».
- source_word: נַפְשִׁי
  choice: me
  rationale: נֶפֶשׁ désigne ici la personne ou la vie du psalmiste. Le pronom « me » évite de suggérer une anthropologie technique absente du verset et produit une supplication naturelle en français.
- source_word: חַטָּאִים
  choice: les pécheurs
  rationale: Le nom désigne directement les personnes caractérisées par le péché ; « les pécheurs » est précis, courant et digne.
- source_word: אַנְשֵׁי דָמִים
  choice: les hommes sanguinaires
  rationale: L’expression hébraïque, littéralement « hommes de sangs », désigne des hommes violents ou coupables d’effusion de sang. « Hommes sanguinaires » conserve l’image du sang sans limiter le sens aux seuls meurtriers.
- source_word: חַיָּי
  choice: '[sous-entendu dans « m’emporte »]'
  rationale: Le second objet, « ma vie », forme un parallélisme avec « mon âme/ma personne ». En français, sa répétition avec le même verbe serait possible, mais la formulation elliptique retenue rend le vers plus fluide ; la note signale la structure littérale.
- source_word: אַל
  choice: Ne… pas
  rationale: Avec l’imparfait, אַל introduit ici une supplication négative, rendue naturellement par « Ne… pas ».
theological_decisions:
- issue: Nuance anthropologique de נַפְשִׁי et חַיָּי
  choice: Rendre la demande globalement par « m’emporte » et signaler en note les termes « mon âme » et « ma vie ».
  alternative: Conserver explicitement « mon âme » et « ma vie » dans les deux membres.
  rationale: Les deux expressions poétiques concernent toute la personne et sa vie sans imposer une distinction technique entre âme et corps. La note préserve le parallélisme et l’ambiguïté lexicale de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu est resserré pour une lecture naturelle, tandis que les notes conservent les images littérales et la nuance judiciaire.
