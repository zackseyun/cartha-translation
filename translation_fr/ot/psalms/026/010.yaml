  text: in whose hands is wickedness[a], and whose right hand is full of bribes.
translation:
  language: fr
  text: 'eux qui ont la perversité[a] entre les mains,

    et dont la main droite est pleine de pots-de-vin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le crime », « la dépravation » ou « un mauvais dessein » pour « la perversité » (זִמָּה).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: eux qui ont… entre les mains
  rationale: Le relatif renvoie aux hommes évoqués au verset précédent. « Entre les mains » conserve l’image hébraïque tout en donnant une tournure française naturelle.
- source_word: זִמָּה
  choice: le crime
  rationale: Dans ce contexte de violence et de corruption, le terme désigne un acte ou dessein mauvais; « crime » convient sans lui donner le sens sexuel qu’il peut avoir ailleurs.
- source_word: וִימִינָם
  choice: et dont la main droite
  rationale: Le singulier collectif de l’hébreu est conservé, ainsi que l’image de la main droite comme instrument de l’action.
- source_word: מָלְאָה
  choice: est pleine de
  rationale: Cette formulation rend simplement l’état exprimé par le verbe hébreu.
- source_word: שֹׁחַד
  choice: pots-de-vin
  rationale: Le nom singulier a ici une valeur générique. Le pluriel français exprime naturellement une pratique habituelle de corruption.
