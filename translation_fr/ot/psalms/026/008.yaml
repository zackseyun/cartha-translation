  text: יְֽהוָ֗ה אָ֭הַבְתִּי מְע֣וֹן בֵּיתֶ֑/ךָ וּ֝/מְק֗וֹם מִשְׁכַּ֥ן כְּבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/008.yaml
  text: O Yahweh[a], I love the habitation of your house, the place where your glory dwells.
translation:
  language: fr
  text: Yahweh, j’aime la demeure de ta maison et le lieu où réside ta gloire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Yahweh, j’ai aimé la demeure de ta maison et le lieu de la demeure de ta gloire. »'
    reason: Alternative formelle conservant le parfait et la syntaxe nominale de l’hébreu.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que remplacé par un titre.
- source_word: אָהַבְתִּי
  choice: j’aime
  rationale: En contexte poétique, le parfait peut exprimer une disposition établie et actuelle; le présent est naturel en français.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: la demeure de ta maison
  rationale: Cette formulation conserve les deux substantifs et l’image concrète de la maison-sanctuaire, malgré une légère densité poétique.
- source_word: וּמְקוֹם
  choice: le lieu
  rationale: La coordination hébraïque peut être rendue par une apposition fluide en français.
- source_word: מִשְׁכַּן כְּבוֹדֶךָ
  choice: où réside ta gloire
  rationale: La proposition relative restitue naturellement le syntagme nominal littéral « demeure de ta gloire » sans perdre l’image de résidence.
theological_decisions:
- issue: Identification du sanctuaire
  choice: ta maison
  alternative: ton temple
  rationale: Le texte dit littéralement « ta maison »; conserver cette image évite de préciser le référent au-delà de l’hébreu.
- issue: Présence de la gloire divine
  choice: où réside ta gloire
  alternative: la demeure de ta gloire
  rationale: La formulation dynamique exprime la présence divine sans introduire l’idée supplémentaire d’intronisation.
translation_notes:
  register: Français moderne, digne et poétique. Le nom divin est translittéré. La légère étrangeté de « la demeure de ta maison » préserve la formulation hébraïque et son parallélisme.
