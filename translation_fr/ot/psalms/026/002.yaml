  text: בְּחָנֵ֣/נִי יְהוָ֣ה וְ/נַסֵּ֑/נִי צרופ/ה כִלְיוֹתַ֣/י וְ/לִבִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/002.yaml
  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: fr
  text: Examine-moi, Yahweh, et mets-moi à l’épreuve ; passe mes reins[a] et mon cœur au creuset.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la pensée hébraïque ancienne, les reins représentent les pensées et les sentiments les plus intimes.
    reason: cultural_note
lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Examine-moi
  rationale: Le verbe בחן exprime l’examen destiné à éprouver l’authenticité. « Examine-moi » reste naturel et permet de le distinguer du verbe נסה qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: וְנַסֵּנִי
  choice: et mets-moi à l’épreuve
  rationale: נסה désigne la mise à l’épreuve. Cette expression préserve le parallélisme avec בחן sans répéter exactement le même verbe français.
- source_word: צְרוֹפָה
  choice: passe au creuset
  rationale: צרף appartient au vocabulaire du raffinage des métaux. « Passer au creuset » conserve cette image concrète et s’applique naturellement aux deux compléments.
- source_word: כִלְיוֹתַי
  choice: mes reins
  rationale: Le mot désigne littéralement les reins, considérés dans l’anthropologie hébraïque comme le siège des pensées et des sentiments les plus intimes. L’image est maintenue dans le texte et expliquée en note.
- source_word: וְלִבִּי
  choice: et mon cœur
  rationale: לב désigne le cœur comme centre de la pensée, de la volonté et de la vie intérieure. « Mon cœur » conserve l’image poétique usuelle.
theological_decisions:
- issue: Imagerie anthropologique de la poésie hébraïque
  choice: Conserver les parties du corps « reins » et « cœur » dans le texte principal.
  alternative: Traduire de manière interprétative par « mes pensées les plus intimes et mon cœur » ou « mon esprit et mon cœur ».
  rationale: Le texte évoque l’être intérieur au moyen d’images corporelles concrètes. Les conserver respecte la poésie et évite de réduire la portée du symbole ; une note en éclaire le sens culturel.
translation_notes:
  register: Français international moderne, poétique et digne. « Mets-moi à l’épreuve » est idiomatique, tandis que « passe au creuset » préserve nettement la métaphore métallurgique. Le nom divin est rendu par « Yahweh ».
