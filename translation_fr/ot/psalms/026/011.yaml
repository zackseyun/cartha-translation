id: PSA.26.11
reference: Psalms 26:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: fr
  text: Mais moi, je marcherai dans mon intégrité[a] ; rachète-moi et fais-moi grâce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma droiture » ou « dans mon innocence ».
    reason: lexical_alternative
  - marker: b
    text: Ou « aie pitié de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction jointe au pronom indépendant marque à la fois le contraste et l’insistance. « Mais moi » les rend naturellement en français.
- source_word: בְּתֻמִּי
  choice: dans mon intégrité
  rationale: תֻּם évoque l’intégrité, la droiture ou l’état irréprochable. « Intégrité » conserve la force morale du terme sans suggérer nécessairement une absence absolue de péché.
- source_word: אֵלֵךְ
  choice: je marcherai
  rationale: Le verbe הלך garde ici la métaphore biblique de la marche comme manière de vivre. Le futur exprime naturellement la détermination du psalmiste.
- source_word: פְּדֵנִי
  choice: rachète-moi
  rationale: פדה désigne l’action de racheter ou de libérer moyennant rançon. « Rachète-moi » préserve mieux cette valeur précise que le terme plus général « délivre-moi ».
- source_word: וְחָנֵּנִי
  choice: et fais-moi grâce
  rationale: חנן signifie accorder grâce ou faveur. « Fais-moi grâce » est idiomatique, digne et conserve cette nuance, tout en laissant possible la traduction « aie pitié de moi ».
theological_decisions:
- issue: Portée de l’affirmation בְּתֻמִּי
  choice: Le psalmiste affirme son intégrité et sa droiture dans sa conduite.
  alternative: Il affirme être irréprochable ou innocent au sens plus fort.
  rationale: « Intégrité » respecte la revendication morale positive du texte sans la transformer explicitement en affirmation de perfection absolue. La demande de rachat et de grâce maintient la tension théologique présente dans le verset.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore de la marche ainsi que les impératifs « rachète-moi » et « fais-moi grâce » sont conservés. Les appels de notes sont placés après les expressions auxquelles leurs variantes se rapportent.
