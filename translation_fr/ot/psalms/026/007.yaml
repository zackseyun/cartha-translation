  text: לַ֭/שְׁמִעַ בְּ/ק֣וֹל תּוֹדָ֑ה וּ֝/לְ/סַפֵּ֗ר כָּל נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/007.yaml
  text: to proclaim with a voice of thanksgiving[b][a], and to recount all your wondrous deeds.
translation:
  language: fr
  text: 'afin de faire entendre une voix de reconnaissance[a]

    et de raconter toutes tes merveilles[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « afin de proclamer ma reconnaissance ». Le verbe hébreu est causatif : littéralement, « faire entendre ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes tes œuvres merveilleuses » ou « tous tes actes prodigieux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: afin de faire entendre
  rationale: L’infinitif à la forme causative signifie littéralement « faire entendre ». Cette formulation française conserve à la fois la valeur causative et le lien de but indiqué par לְ.
- source_word: בְּקוֹל תּוֹדָה
  choice: une voix de reconnaissance
  rationale: La traduction garde l’image concrète de la « voix » et rend תּוֹדָה par « reconnaissance », au sens de gratitude exprimée à Dieu.
- source_word: וּלְסַפֵּר
  choice: et de raconter
  rationale: À la forme intensive, ספר désigne ici l’action de relater ou d’énumérer les œuvres de Dieu. « Raconter » est naturel et respecte le parallélisme poétique.
- source_word: כָּל
  choice: toutes
  rationale: Le terme exprime ici la totalité et s’accorde en français avec « merveilles ».
- source_word: נִפְלְאוֹתֶיךָ
  choice: tes merveilles
  rationale: Le nom pluriel peut désigner les actes extraordinaires de Dieu aussi bien que les merveilles elles-mêmes. « Tes merveilles » préserve cette concision et cette légère ouverture sémantique.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La structure en deux infinitifs coordonnés est conservée, de même que l’image hébraïque de la voix. Le début en minuscule signale que le verset poursuit syntaxiquement la phrase précédente.
