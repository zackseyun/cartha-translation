  yaml_path: translation/ot/psalms/026/006.yaml
  text: I wash my hands in innocence[a], and go around your altar, O Yahweh[b],
translation:
  language: fr
  text: Je lave mes mains dans l’innocence[a], et je fais le tour[b] de ton autel, ô Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la pureté » ou « dans la propreté ». Le terme hébreu peut évoquer aussi bien l’innocence morale que la pureté rituelle.'
    reason: lexical_alternative
  - marker: b
    text: 'La forme hébraïque peut aussi exprimer une résolution : « et je veux faire le tour » ou « et je ferai le tour ».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אֶרְחַץ
  choice: Je lave
  rationale: L’imparfait qal à la première personne peut décrire ici une action habituelle ou présentée avec vivacité. Le présent français convient au contexte, sans lui imposer une orientation future.
- source_word: בְּנִקָּיוֹן
  choice: dans l’innocence
  rationale: Le nom נִקָּיוֹן peut exprimer la propreté, la pureté ou l’innocence. Dans ce contexte cultuel et moral, « dans l’innocence » conserve la dimension éthique tout en laissant une note signaler l’autre nuance.
- source_word: כַּפָּי
  choice: mes mains
  rationale: כף désigne littéralement la paume, mais « laver mes mains » est l’expression naturelle en français dans ce contexte.
- source_word: וַאֲסֹבְבָה
  choice: et je fais le tour
  rationale: Le verbe סבב signifie tourner autour ou faire le tour. Le présent s’enchaîne naturellement avec « je lave »; la forme cohortative peut aussi suggérer la volonté ou la résolution, nuance signalée en note.
- source_word: מִזְבַּחֲךָ
  choice: ton autel
  rationale: Traduction directe et courante de מזבח avec le suffixe de deuxième personne du masculin singulier.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Portée morale ou rituelle de בְּנִקָּיוֹן
  choice: dans l’innocence
  alternative: dans la pureté / dans la propreté
  rationale: Le terme peut évoquer à la fois l’innocence morale et la pureté associée au geste de se laver. Le texte principal privilégie la force morale probable, tandis que la note préserve l’ambiguïté lexicale.
- issue: Valeur de la forme וַאֲסֹבְבָה
  choice: et je fais le tour
  alternative: et je veux faire le tour / afin que je fasse le tour
  rationale: La forme avec finale cohortative peut exprimer une résolution ou une intention. Le présent coordonné rend bien le mouvement du vers, mais la note maintient ouverte la nuance volitive.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Sa translittération préserve cette distinction sans substituer un titre.
translation_notes:
  register: Français moderne, simple et digne. « Faire le tour de » est plus idiomatique que « tourner autour de » dans ce contexte. La virgule avant l’apostrophe finale met en relief l’adresse à Yahweh.
