  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: fr
  text: 'De David.[a]


    Rends-moi justice, Yahweh,[b] car j’ai marché dans mon intégrité[c] et je me suis confié en Yahweh ; je ne chancellerai pas.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David » ou « Au sujet de David ». La préposition hébraïque peut exprimer l’auteur, l’appartenance, la dédicace ou une relation plus générale.
    reason: superscription_ambiguity
  - marker: b
    text: Littéralement « Juge-moi, Yahweh ». Ici, le verbe peut avoir le sens de « prononce un jugement en ma faveur » ou « justifie-moi ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans ma conduite irréprochable ». Le terme hébreu évoque l’intégrité, la droiture ou une conduite sans reproche.
    reason: lexical_alternative
  - marker: d
    text: Ou « je ne vacillerai pas » ou « je ne glisserai pas ». L’image hébraïque est celle d’une personne qui perd sa stabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La formule traditionnelle et concise convient au titre du psaume, tout en laissant en note l’éventail sémantique de la préposition hébraïque.
- source_word: שָׁפְטֵנִי
  choice: Rends-moi justice
  rationale: Dans ce contexte d’appel à Dieu fondé sur l’intégrité du psalmiste, le verbe demande un jugement favorable ou une justification, plutôt que le simple fait de juger.
- source_word: בְּתֻמִּי
  choice: dans mon intégrité
  rationale: Le terme désigne la droiture, l’entier attachement ou une conduite irréprochable, sans nécessairement affirmer une perfection absolue.
- source_word: לֹא אֶמְעָד
  choice: je ne chancellerai pas
  rationale: Cette expression conserve l’image d’une perte d’équilibre ou de stabilité et rend naturellement la forme verbale hébraïque au futur.
theological_decisions:
- issue: La revendication d’intégrité du psalmiste
  choice: Conserver « mon intégrité » sans l’atténuer
  alternative: « ma conduite irréprochable » ou une reformulation moins directe
  rationale: Le texte affirme réellement l’intégrité du locuteur, mais le nom hébreu n’exige pas l’idée de perfection morale absolue ; la traduction préserve ainsi la tension sans imposer une lecture doctrinale.
- issue: Rapport entre la confiance en Yahweh et la stabilité
  choice: Relier les propositions par un point-virgule sans expliciter une causalité
  alternative: « puisque je me suis confié en Yahweh, je ne chancellerai pas »
  rationale: L’hébreu juxtapose les affirmations et ne marque pas explicitement le lien logique ; le point-virgule conserve cette relative ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. « Yahweh » reproduit explicitement le nom divin. Le parallélisme est préservé, avec une ponctuation qui n’ajoute pas de rapport causal absent de l’hébreu.
