  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: fr
  text: Je déteste l’assemblée de ceux qui font le mal[a], et je ne m’assiérai pas avec les méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai pris en haine la compagnie de ceux qui font le mal. » La forme verbale hébraïque peut évoquer une attitude acquise dans le passé, mais elle exprime probablement ici la position ferme et durable du psalmiste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Je déteste
  rationale: Le qatal à la première personne du singulier exprime ici naturellement une attitude établie et durable. Le présent français rend cette valeur sans réduire le verbe à une action passée.
- source_word: קְהַל
  choice: l’assemblée
  rationale: Le terme désigne un groupe réuni. « Assemblée » conserve cette dimension collective sans supposer qu’il s’agit d’une communauté cultuelle.
- source_word: מְרֵעִים
  choice: ceux qui font le mal
  rationale: Le participe substantivé désigne des personnes caractérisées par leurs mauvaises actions. Cette formulation est claire et naturelle en français moderne.
- source_word: וְעִם
  choice: et … avec
  rationale: La conjonction et la préposition relient directement les deux membres du verset; en français, « avec » dépend naturellement du verbe « m’assiérai ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce substantif adjectival désigne les personnes moralement mauvaises. « Les méchants » est concis et maintient le parallélisme poétique.
- source_word: לֹא אֵשֵׁב
  choice: je ne m’assiérai pas
  rationale: L’imparfait hébreu nié exprime ici une résolution ou un refus durable. Le futur français préserve cette nuance volontaire ainsi que l’image concrète de s’asseoir avec quelqu’un.
