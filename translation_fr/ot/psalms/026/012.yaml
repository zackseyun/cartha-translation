source:
  edition: WLC
  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: fr
  text: Mon pied tient ferme sur un terrain plat[a] ; dans les assemblées, je bénirai Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu uni » ; l’hébreu peut aussi évoquer la droiture.
    reason: Alternative lexicale et maintien de la possible nuance morale de מִישׁוֹר.
lexical_decisions:
- source_word: רַגְלִי
  choice: Mon pied
  rationale: Le nom hébreu est au singulier avec un suffixe de première personne. Le singulier reste naturel en français et conserve l’image personnelle de stabilité.
- source_word: עָמְדָה
  choice: se tient
  rationale: Le parfait qal féminin singulier s’accorde avec « pied » en hébreu et peut exprimer ici un état présent acquis. « Se tient » rend naturellement cette stabilité sans ajouter explicitement « ferme ».
- source_word: בְּמִישׁוֹר
  choice: sur un terrain plat
  rationale: מִישׁוֹר désigne concrètement un lieu nivelé ou uni, tout en pouvant évoquer la droiture. La traduction maintient l’image spatiale et laisse la nuance morale implicite.
- source_word: בְּמַקְהֵלִים
  choice: dans les assemblées
  rationale: Le pluriel désigne des groupes réunis. « Assemblées » conserve ce pluriel sans imposer une coloration ecclésiastique particulière.
- source_word: אֲבָרֵךְ
  choice: je bénirai
  rationale: Le piel de ברך signifie directement « bénir ». Le futur français convient à la déclaration d’intention du psalmiste.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme. « Yahweh » préserve le caractère de nom propre sans remplacer celui-ci par un titre.
- issue: Nuance concrète ou morale de מִישׁוֹר
  choice: Image concrète d’un terrain plat, avec nuance morale laissée ouverte
  alternative: dans la droiture
  rationale: Le sens spatial est bien attesté, mais le mot peut aussi suggérer la rectitude. Le texte principal conserve l’image et la note signale l’ambivalence sans la résoudre.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé, ainsi que le singulier « mon pied » et le pluriel « les assemblées ».
