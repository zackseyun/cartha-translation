  text: וַ/יַּרְקִידֵ֥/ם כְּמוֹ עֵ֑גֶל לְבָנ֥וֹן וְ֝/שִׂרְיֹ֗ן כְּמ֣וֹ בֶן רְאֵמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/006.yaml
  text: He makes Lebanon skip like a calf[c][b][a], and Sirion like a young wild ox.
translation:
  language: fr
  text: Il fait bondir le Liban comme un veau, et le Sirion[a] comme un jeune bœuf sauvage[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sirion est un autre nom du mont Hermon.
    reason: cross_reference
  - marker: b
    text: Ou « comme un jeune bovin ». L’hébreu dit littéralement « comme un fils de bœufs sauvages », expression qui désigne le petit d’un bœuf sauvage.
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction, plus littérale : « Il les fait bondir comme un veau — le Liban et le Sirion comme un jeune bœuf sauvage. »'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Il fait bondir
  rationale: 'Le hifil de רקד exprime ici la causalité : « faire bondir/sauter ». « Faire bondir » rend naturellement en français le mouvement vif suggéré par les comparaisons animales. Le suffixe pluriel « les » est explicité par les noms géographiques qui suivent.'
- source_word: כְּמוֹ עֵגֶל
  choice: comme un veau
  rationale: עֵגֶל désigne normalement un veau ou un jeune bovin ; « veau » conserve l’image vive et simple du texte.
- source_word: לְבָנוֹן
  choice: le Liban
  rationale: Le nom propre géographique est rendu selon son équivalent français établi.
- source_word: וְשִׂרְיֹן
  choice: et le Sirion
  rationale: Le texte hébreu emploie le nom Sirion plutôt que Hermon. Sa forme est conservée, tandis que son identification est indiquée en note.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: comme un jeune bœuf sauvage
  rationale: Littéralement « comme un fils de bœufs sauvages » ; בֶן fonctionne idiomatiquement pour désigner le petit, et רְאֵם renvoie vraisemblablement à un bovidé sauvage. La formulation française transmet l’image sans reproduire un idiome opaque.
