base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/000.yaml
  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: fr
  text: Psaume de David. Rendez à Yahvé, ô fils des dieux, rendez à Yahvé gloire et puissance !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Psaume de David
  rationale: La formule française traditionnelle et naturelle conserve l’ambiguïté possible de לְ, qui peut signaler l’auteur, l’appartenance ou le rapport à David.
- source_word: הָבוּ
  choice: Rendez
  rationale: L’impératif pluriel signifie ici attribuer ou reconnaître ce qui revient à Yahvé. « Rendez à » est idiomatique, solennel et permet de reproduire la répétition hébraïque.
- source_word: יהוה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que son remplacement par un titre.
- source_word: בְּנֵי אֵלִים
  choice: fils des dieux
  rationale: Traduction formellement proche de l’hébreu, où אֵלִים est morphologiquement pluriel. Dans ce contexte poétique, l’expression désigne probablement les êtres du conseil céleste, possibilité précisée en note sans effacer l’image du texte.
- source_word: כָּבוֹד וָעֹז
  choice: gloire et puissance
  rationale: « Gloire » rend כָּבוֹד et « puissance » exprime ici עֹז de façon naturelle, sans réduire le terme à la seule force physique.
theological_decisions:
- issue: Identité des בְּנֵי אֵלִים
  choice: Conserver l’expression « fils des dieux » dans le texte et expliquer en note sa probable référence aux êtres célestes.
  alternative: « êtres célestes », « fils de Dieu » ou « fils des puissants »
  rationale: L’hébreu admet une image littérale et une référence contextuelle au conseil céleste. La traduction retenue préserve la tension lexicale et évite de trancher silencieusement la question ontologique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition impérative de l’hébreu est conservée, ainsi que l’adresse directe aux êtres célestes.
