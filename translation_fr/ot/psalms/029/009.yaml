  text: ק֤וֹל יְהוָ֨ה יְחוֹלֵ֣ל אַיָּלוֹת֮ וַֽ/יֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת וּ/בְ/הֵיכָל֑/וֹ כֻּ֝לּ֗/וֹ אֹמֵ֥ר כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: fr
  text: 'La voix du SEIGNEUR fait mettre bas les biches[a] et met les forêts à nu ; et, dans son temple[b], tout proclame : « Gloire ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « fait se tordre les biches », ou « les fait se tordre de douleur, comme lors de l’accouchement ».

      '
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut signifier « temple » ou « palais ».
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: La voix du SEIGNEUR
  rationale: Le groupe construit est rendu directement. « le SEIGNEUR » représente le nom divin יהוה selon une convention française largement reconnue.
- source_word: יְחוֹלֵ֣ל
  choice: fait mettre bas
  rationale: Le verbe חול peut évoquer les contorsions et, en particulier, les douleurs de l’accouchement. Avec les biches comme complément, « fait mettre bas » exprime naturellement le sens probable sans effacer l’autre nuance, conservée en note.
- source_word: אַיָּלוֹת֮
  choice: les biches
  rationale: Le pluriel désigne ici des cervidés femelles ; « biches » est précis, courant et non archaïque.
- source_word: וַֽיֶּחֱשֹׂ֪ף
  choice: et dépouille
  rationale: Le verbe signifie découvrir, dénuder ou dépouiller. « dépouille les forêts » restitue de façon concise et vive l’effet de la tempête.
- source_word: יְעָ֫ר֥וֹת
  choice: les forêts
  rationale: Traduction directe et naturelle du pluriel.
- source_word: וּבְהֵיכָלוֹ
  choice: dans son temple
  rationale: Dans ce contexte d’acclamation cultuelle adressée au SEIGNEUR, « temple » est le sens le plus probable. La possibilité « palais » est signalée en note.
- source_word: כֻּלּוֹ אֹמֵר
  choice: tous disent
  rationale: Le singulier morphologique fonctionne collectivement ou distributivement avec כֻּלּוֹ. Le pluriel français est naturel, et « disent » reste proche du verbe hébreu.
- source_word: כָּבֽוֹד
  choice: « Gloire ! »
  rationale: L’exclamation nominale brève conserve la force de l’acclamation hébraïque.
theological_decisions:
- issue: Sens de הֵיכָל comme lieu associé au SEIGNEUR
  choice: temple
  alternative: palais
  rationale: L’acclamation « Gloire ! » favorise une scène de culte dans le temple, éventuellement céleste. Toutefois, le mot peut aussi désigner un palais royal, lecture pertinente dans un psaume célébrant la royauté divine ; cette ambiguïté est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme et la vigueur de la scène, tandis que les notes préservent les ambiguïtés lexicales réelles.
