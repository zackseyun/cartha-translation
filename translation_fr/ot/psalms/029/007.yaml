lexical_decisions:
- source_word: קוֹל
  choice: voix
  rationale: Le nom peut désigner la « voix » ou le « son ». Le refrain du psaume présente le fracas de l’orage comme la puissante parole de Yahweh; « voix » conserve cette image poétique et théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre du texte hébreu plutôt que de lui substituer un titre.
- source_word: חֹצֵב
  choice: taille
  rationale: Le participe de חצב évoque l’action de tailler ou de fendre, notamment la pierre. « Taille » garde la vigueur concrète et inhabituelle de l’image hébraïque sans la réduire à « produit ».
- source_word: לַהֲבוֹת
  choice: flammes
  rationale: Le pluriel désigne directement des flammes ou langues de feu. Dans le cadre de l’orage, il peut évoquer les éclairs, nuance signalée en note.
- source_word: אֵשׁ
  choice: feu
  rationale: Le mot signifie simplement « feu ». L’expression « flammes de feu » conserve l’intensité poétique de la formulation hébraïque.
theological_decisions:
- issue: Préserver l’action divine et l’image de l’orage sans transformer le verset en description météorologique moderne
  choice: « La voix de Yahweh taille des flammes de feu »
  alternative: « La voix de Yahweh fait jaillir des éclairs »
  rationale: La traduction principale conserve l’image concrète et énigmatique de l’hébreu; la note indique l’interprétation probable comme éclairs sans l’imposer au texte.
translation_notes:
  register: Français moderne, poétique et digne. Le verbe « taille » est volontairement concret pour rendre la force de חֹצֵב; la légère étrangeté de l’image originale est préservée.
