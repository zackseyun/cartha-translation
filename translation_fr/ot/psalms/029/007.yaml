translation:
  language: fr
  text: La voix de Yahweh fait jaillir des flammes de feu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éclairs », probablement en référence à la foudre dans l’imagerie de l’orage du psaume.
