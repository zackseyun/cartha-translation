  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: fr
  text: Psaume de David. Fils des dieux[a], rendez à Yahweh gloire et puissance, rendez à Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fils de Dieu », « êtres célestes » ou « fils des puissants ». L’expression hébraïque désigne probablement des membres de la cour céleste.
    reason: L’expression בְּנֵי אֵלִים est lexicalement ambiguë. La note signale les principales lectures sans trancher la nature exacte des destinataires.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et exact pour cette désignation littéraire placée en tête du psaume.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette souplesse que « écrit par David ».
- source_word: הָבוּ
  choice: Rendez
  rationale: Dans cet appel poétique, il ne s’agit pas de donner matériellement quelque chose à Dieu, mais de reconnaître et de proclamer ce qui lui revient. « Rendez à » exprime naturellement cette valeur en français biblique actuel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le texte porte directement le nom divin יהוה ; « Yahweh » le représente comme nom propre plutôt que de le remplacer par un titre.
- source_word: בְּנֵי אֵלִים
  choice: fils de Dieu
  rationale: Cette formulation garde l’image filiale de l’hébreu et suit une compréhension possible de אֵלִים, tout en signalant en note l’ambiguïté du syntagme et sa probable référence aux êtres de la cour céleste.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Équivalent français usuel qui convient au registre de majesté divine du psaume.
- source_word: וָעֹז
  choice: et puissance
  rationale: עֹז désigne la force ou la puissance ; « puissance » forme ici un binôme poétique naturel avec « gloire ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le nom propre présent dans l’hébreu est conservé, sans le remplacer par un titre.
- issue: Interprétation de בְּנֵי אֵלִים
  choice: fils de Dieu
  alternative: fils des dieux ; êtres célestes ; fils des puissants
  rationale: L’expression est débattue et désigne probablement des membres de la cour céleste. Le texte principal conserve son image concrète, tandis que la note présente les principales possibilités sans effacer l’ambiguïté.
translation_notes:
  register: Français moderne, digne et poétique. La répétition de « rendez à Yahweh » reproduit la structure emphatique de l’hébreu. L’interpellation est conservée sans « ô », devenu marqué ou archaïsant en français courant.
