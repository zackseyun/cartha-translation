id: PSA.29.8
reference: Psalms 29:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֣וֹל יְ֭הוָה יָחִ֣יל מִדְבָּ֑ר יָחִ֥יל יְ֝הוָ֗ה מִדְבַּ֥ר קָדֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: fr
  text: La voix de Yahweh fait trembler le désert[a] ; Yahweh fait trembler le désert de Qadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secoue le désert » ou « fait se tordre le désert ».
    reason: Alternative lexicale pour יָחִיל, qui peut évoquer le tremblement, l’ébranlement ou la torsion.
lexical_decisions:
- source_word: ק֣וֹל
  choice: voix
  rationale: Dans le Psaume 29, l’expression répétée קוֹל יְהוָה forme un refrain poétique. « Voix » conserve la dimension personnelle et littéraire, contrairement au terme plus impersonnel « son ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend le nom divin exprimé directement dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: יָחִיל
  choice: fait trembler
  rationale: La forme causative du verbe חול peut exprimer l’action de faire trembler, se tordre ou chanceler. « Fait trembler » est naturel en français, conserve la valeur causative et convient à l’effet de la voix divine sur le désert.
- source_word: מִדְבָּר
  choice: désert
  rationale: Ici, « désert » désigne naturellement en français une région inculte et inhabitée. Le contexte géographique de Qadesh appuie ce choix, sans exclure le sens plus large d’étendue sauvage.
- source_word: מִדְבַּר קָדֵשׁ
  choice: le désert de Qadesh
  rationale: Cette formulation rend directement la relation construite en hébreu et conserve le nom géographique קָדֵשׁ sous la translittération française « Qadesh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre.
- issue: Nature de l’action exercée sur le désert
  choice: fait trembler
  alternative: fait se tordre
  rationale: Le verbe autorise une image plus forte de torsion ou de convulsion. Le texte principal retient l’expression française la plus naturelle tout en signalant cette nuance en note, sans supprimer l’intensité poétique possible.
translation_notes:
  register: Français moderne, international et digne. La répétition exacte de « Yahweh fait trembler le désert » maintient le parallélisme et la force du refrain hébreu.
