  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: fr
  text: La voix de Yahweh[a] est puissante[b] ; la voix de Yahweh est majestueuse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « La voix de Yahweh retentit avec puissance ; la voix de Yahweh retentit avec majesté. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: voix
  rationale: Dans la formule répétée de ce psaume, « voix » conserve le caractère personnel et actif de la manifestation sonore de Yahweh, plutôt que de la réduire à un simple bruit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre présent dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: בַּכֹּחַ
  choice: est puissante
  rationale: La tournure adjectivale rend naturellement en français la force attribuée à la voix, tout en conservant dans une note la possibilité de comprendre la préposition ב comme marquant la manière ou l’accompagnement.
- source_word: הָדָר
  choice: est majestueuse
  rationale: הָדָר évoque la majesté et la splendeur imposante. « Majestueuse » convient au registre royal et théophanique du psaume et maintient le parallélisme avec « puissante ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre, tandis que la note signale la substitution traditionnelle sans l’introduire dans le corps du verset.
- issue: Valeur des groupes prépositionnels בַּכֹּחַ et בֶּהָדָר
  choice: 'prédicats adjectivaux : « est puissante » et « est majestueuse »'
  alternative: « retentit avec puissance » et « retentit avec majesté »
  rationale: Les propositions hébraïques sont sans verbe exprimé et permettent une lecture descriptive ou circonstancielle. Le texte principal privilégie un français idiomatique, tandis que la note conserve l’ambiguïté syntaxique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « la voix de Yahweh » et le parallélisme « puissante / majestueuse » reproduisent la structure solennelle de l’hébreu.
