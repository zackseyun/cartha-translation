  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: fr
  text: La voix de Yahweh est sur les eaux ; le Dieu de gloire[a] tonne ; Yahweh est sur les grandes eaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu glorieux ». L’hébreu dit littéralement « Dieu de gloire ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Yahweh sur les grandes eaux » ; l’hébreu n’exprime pas le verbe « être ».'
    reason: source_structure
lexical_decisions:
- source_word: ק֥וֹל
  choice: voix
  rationale: Dans le refrain poétique du psaume, « voix » conserve la personnification et la puissance de la parole divine, tandis que le contexte l’associe au tonnerre.
- source_word: יְהוָ֗ה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, plutôt que remplacement par un titre.
- source_word: עַל הַמָּיִם
  choice: au-dessus des eaux
  rationale: עַל exprime ici la position ou le déploiement de la voix divine sur les eaux ; « au-dessus de » est naturel en français et préserve l’image.
- source_word: אֵל הַכָּבוֹד
  choice: le Dieu de gloire
  rationale: Rend directement le groupe construit hébreu et conserve sa formulation poétique, sans réduire d’emblée le génitif à l’adjectif « glorieux ».
- source_word: הִרְעִים
  choice: fait gronder le tonnerre
  rationale: La forme verbale issue de רעם évoque l’action de tonner. Cette tournure française restitue clairement la valeur causative de la forme hébraïque et l’image sonore du verset.
- source_word: מַיִם רַבִּים
  choice: les grandes eaux
  rationale: Expression française poétique et idiomatique pour une vaste étendue d’eau ; רַבִּים peut dénoter ici l’ampleur ou l’abondance.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le nom divin. Le translittérer préserve sa fonction de nom propre.
- issue: Le tonnerre comme voix de Dieu
  choice: Maintenir à la fois « voix » et « fait gronder le tonnerre »
  alternative: Réduire l’image à « le tonnerre de Yahweh »
  rationale: Le parallélisme poétique associe le phénomène de l’orage à la voix de Yahweh sans les fondre en une simple description météorologique.
- issue: Clause nominale finale
  choice: Yahweh est au-dessus des grandes eaux
  alternative: Yahweh, au-dessus des grandes eaux
  rationale: Le verbe « est » est suppléé pour rendre en français la proposition nominale hébraïque comme une affirmation parallèle distincte, conformément à la division massorétique, tout en signalant la formulation littérale en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en trois propositions reflète le parallélisme hébreu ; « grandes eaux » conserve une diction psalmique compréhensible.
