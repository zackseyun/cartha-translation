  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: fr
  text: La voix de Yahweh brise les cèdres[a] ; Yahweh fracasse les cèdres du Liban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le bruit de Yahweh ». Le mot hébreu peut désigner une voix ou un son.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu reprend dans les deux propositions la même racine verbale, « briser » ; « fracasse » fait ressortir l’intensification poétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: La voix de Yahweh
  rationale: קוֹל peut désigner une « voix » ou un « son ». « Voix » conserve ici la force personnelle et théophanique du refrain, tout en évoquant le tonnerre.
- source_word: שֹׁבֵר
  choice: brise
  rationale: Le participe qal exprime ici une action vive et actuelle. « Brise » est naturel, énergique et fidèle au sens.
- source_word: אֲרָזִים
  choice: les cèdres
  rationale: Le pluriel désigne les cèdres en général ; cette formulation concise est idiomatique en français.
- source_word: וַיְשַׁבֵּר
  choice: fracasse
  rationale: Le texte hébreu reprend la racine שבר. « Fracasse » rend naturellement en français l’intensification poétique du second membre, sans imposer un passé narratif.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: les cèdres du Liban
  rationale: Cette tournure française usuelle préserve l’expression géographique élevée du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom propre tout en évitant de le remplacer silencieusement par un titre.
- issue: Valeur de קוֹל dans la théophanie
  choice: voix
  alternative: bruit / son
  rationale: Les deux sens sont possibles, mais « voix » maintient la présentation répétée de Yahweh comme sujet personnel de cette manifestation tonitruante ; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, avec une légère variation verbale idiomatique. Les deux occurrences du nom divin sont maintenues.
