    issue: Valeur de « siégeait »
    rationale: L’imparfait français présente normalement une action en cours ou habituelle dans le passé. Le parfait hébreu יָשָׁב se rend plus directement par « a siégé » (ou, dans un style plus littéraire, « siégea »), tandis que le second verbe peut exprimer le règne durable.
