  text: יְ֭הוָה לַ/מַּבּ֣וּל יָשָׁ֑ב וַ/יֵּ֥שֶׁב יְ֝הוָ֗ה מֶ֣לֶךְ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/010.yaml
  text: Yahweh sat enthroned over the flood[a]; Yahweh sits enthroned as King forever.
translation:
  language: fr
  text: Yahvé a siégé au-dessus du déluge[a] ; Yahvé siège comme roi pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « le Déluge », avec une allusion particulière au déluge de Noé.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin YHWH, claire et conforme à un registre biblique moderne.
- source_word: לַמַּבּוּל
  choice: au-dessus du déluge
  rationale: מַבּוּל désigne le déluge ou une grande inondation, souvent le déluge primordial. Avec le verbe « siéger », la préposition ל peut exprimer ici la sphère sur laquelle s’exerce la souveraineté ; « au-dessus du déluge » rend cette idée sans imposer une identification précise.
- source_word: יָשָׁב
  choice: siégeait
  rationale: Le sens premier est « s’asseoir » ou « demeurer », mais le contexte royal autorise « siéger », qui conserve l’image de la position assise tout en suggérant le trône.
- source_word: וַיֵּשֶׁב
  choice: siège
  rationale: Bien que la forme verbale puisse poursuivre un récit au passé, לְעוֹלָם met en relief la permanence du règne. Le présent français exprime naturellement cette réalité durable tout en maintenant le contraste avec « siégeait ».
- source_word: מֶלֶךְ
  choice: comme roi
  rationale: Le nom est employé comme prédicat et désigne explicitement le statut royal de Yahvé. « Comme roi » est idiomatique en français et évite de surcharger « siège ».
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle et actuelle pour une durée sans fin.
theological_decisions:
- issue: מַבּוּל désigne-t-il précisément le déluge de Noé ou, plus généralement, les eaux du déluge et du chaos ?
  choice: Le texte principal porte « le déluge » sans mentionner Noé.
  alternative: « le Déluge », compris explicitement comme celui de Noé
  rationale: Le terme peut évoquer le déluge primordial, mais le verset ne nomme pas Noé et le contexte immédiat du psaume décrit une tempête. La traduction et la note préservent les deux possibilités sans trancher silencieusement.
- issue: Valeur temporelle de וַיֵּשֶׁב après יָשָׁב
  choice: 'Présent duratif : « Yahvé siège »'
  alternative: 'Passé narratif : « Yahvé siégea »'
  rationale: La construction hébraïque permet une continuation au passé, mais « pour toujours » présente aussi le règne comme une réalité permanente. Le passage du passé au présent rend cette portée en français, sans nier l’ambiguïté aspectuelle de l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Siéger » maintient l’imagerie royale sans expliciter deux fois le trône ; « déluge » conserve la possible allusion à Genèse 6–9 ainsi que l’image plus générale des eaux menaçantes.
