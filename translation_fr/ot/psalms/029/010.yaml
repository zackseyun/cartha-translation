  source_fidelity: Le qatal יָשָׁב est mieux rendu ici par un passé ponctuel/accompli que par l’imparfait français « siégeait », qui introduit une durée de fond non explicitée. Le présent « siège » pour וַיֵּשֶׁב, en lien avec « pour toujours », reste une restitution défendable de la permanence du règne. « Au-dessus du déluge » conserve l’image de souveraineté et ne force pas l’identification du déluge.
  naturalness: La formulation révisée est naturelle en français international moderne et maintient un registre biblique sobre. « A siégé » évite l’effet légèrement descriptif et inachevé de « siégeait ».
  terminology: « Yahvé », « déluge », « roi » et « pour toujours » sont appropriés. La note conserve prudemment la possibilité d’une allusion au Déluge de Noé sans la transformer en identification imposée dans le texte.
