id: PSA.29.11
reference: Psalms 29:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: fr
  text: Yahvé donne de la force à son peuple[a] ; Yahvé bénit son peuple en lui donnant la paix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Yahvé donnera de la force à son peuple ; Yahvé bénira son peuple en lui donnant la paix. » Les verbes hébreux à l’inaccompli peuvent avoir ici une valeur future.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu shalom, traduit par « paix », peut aussi évoquer la plénitude, l’intégrité et le bien-être.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française usuelle du nom divin, qui préserve son caractère de nom propre plutôt que de lui substituer un titre.
- source_word: עֹז
  choice: de la force
  rationale: Le nom désigne la force ou la puissance ; « de la force » est naturel en français comme complément de « donne ».
- source_word: לְעַמּוֹ
  choice: à son peuple
  rationale: La préposition לְ marque ici naturellement le destinataire du don.
- source_word: יִתֵּן
  choice: donne
  rationale: L'inaccompli peut exprimer ici l'action caractéristique ou la déclaration confiante ; le présent français convient au parallélisme poétique.
- source_word: יְבָרֵךְ
  choice: bénit
  rationale: Le présent rend, comme dans le premier membre, une déclaration confiante sur l'action de Yahvé.
- source_word: אֶת עַמּוֹ
  choice: son peuple
  rationale: La répétition de « son peuple » conserve le parallélisme hébreu.
- source_word: בַשָּׁלוֹם
  choice: en lui donnant la paix
  rationale: La préposition בְּ associée à « bénir » indique ce par quoi la bénédiction se manifeste. Cette formulation est plus naturelle que « bénit avec la paix » et explicite sans excès la relation instrumentale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom divin ; « Yahvé » en est la forme française courante et permet de le distinguer d'un simple titre.
- issue: Valeur des inaccomplis יִתֵּן et יְבָרֵךְ
  choice: 'présent déclaratif : « donne… bénit »'
  alternative: 'futur : « donnera… bénira » ; souhait : « que Yahvé donne… bénisse »'
  rationale: Dans cette conclusion poétique, les formes peuvent présenter l'action caractéristique de Yahvé avec assurance. Le futur demeure possible et est signalé en note ; la lecture optative est grammaticalement envisageable mais moins probable dans ce contexte.
- issue: Portée de שָׁלוֹם
  choice: paix
  alternative: bien-être ; plénitude
  rationale: « Paix » en conserve le sens central, sans réduire silencieusement le terme à l'absence de conflit ; sa portée plus large est précisée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme ainsi que la répétition de « Yahvé » et de « son peuple » sont conservés. Les notes suivent l'ordre d'apparition des marqueurs.
