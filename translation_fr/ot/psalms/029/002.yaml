id: PSA.29.2
reference: Psalms 29:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: fr
  text: Rendez à Yahweh la gloire de son nom ; prosternez-vous devant Yahweh dans une sainte splendeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la splendeur de la sainteté » ; autre traduction possible : « en vêtements sacrés ».'
    reason: L’expression hébraïque peut évoquer la splendeur propre à la sainteté ou, plus concrètement, une parure portée pour le culte.
lexical_decisions:
- source_word: הָבוּ
  choice: Rendez
  rationale: L’impératif pluriel, dans cette formule liturgique, appelle les adorateurs à reconnaître et à attribuer à Yahweh la gloire qui lui appartient ; « rendez » exprime naturellement cet hommage sans évoquer un transfert matériel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque le destinataire, et le nom divin יהוה est translittéré « Yahweh ».
- source_word: כְּבוֹד שְׁמוֹ
  choice: la gloire de son nom
  rationale: Cette formulation suit de près le groupe construit hébreu sans expliciter davantage l’idée de gloire due, qui ressort déjà de l’impératif.
- source_word: הִשְׁתַּחֲווּ
  choice: prosternez-vous devant
  rationale: Le verbe désigne concrètement l’action de se courber ou de se prosterner en signe d’adoration. Cette traduction conserve l’image corporelle et exprime clairement son orientation vers Yahweh.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: dans une sainte splendeur
  rationale: La formule française demeure poétique et laisse ouverte l’ambiguïté entre la splendeur caractérisée par la sainteté, la splendeur de la sainteté et une parure sacrée.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme ; « Yahweh » préserve le nom propre d’alliance sans le remplacer par un titre.
- issue: Interprétation de בְּהַדְרַת קֹדֶשׁ
  choice: dans une sainte splendeur
  alternative: dans la splendeur de la sainteté ; en vêtements sacrés
  rationale: L’expression hébraïque est difficile et peut désigner une qualité abstraite ou une parure cultuelle. Le texte principal conserve cette ouverture, tandis que la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, digne et liturgique. L’impératif pluriel est conservé. « Prosternez-vous » maintient le geste concret du verbe hébreu, tandis que « sainte splendeur » préserve l’ambiguïté poétique de la dernière expression.
