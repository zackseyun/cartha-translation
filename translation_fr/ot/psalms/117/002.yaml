id: PSA.117.2
reference: Psalms 117:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: fr
  text: Car son amour fidèle s’est montré puissant envers nous, et la fidélité[a] de Yahweh demeure pour toujours. Louez Yah !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vérité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel universel à la louange formulé au verset précédent.
- source_word: גָבַר עָלֵינוּ
  choice: s’est montré puissant envers nous
  rationale: Conserve la force verbale de גבר, « être puissant, prévaloir », tout en évitant en français l’idée trompeuse que l’amour divin aurait vaincu son peuple comme un adversaire.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: Rend à la fois l’affection et la loyauté durable exprimées par חֶסֶד, dans une formulation naturelle en français contemporain.
- source_word: וֶאֱמֶת
  choice: et la fidélité
  rationale: Dans son association avec חֶסֶד, אֱמֶת souligne ici particulièrement la fiabilité constante de Dieu. Le sens plus littéral « vérité » est conservé en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: Exprime naturellement en français la permanence durable indiquée par la locution hébraïque.
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: Traduit l’impératif et conserve la forme courte du nom divin, יָהּ.
theological_decisions:
- issue: Sens de אֱמֶת associé à חֶסֶד
  choice: fidélité
  alternative: vérité
  rationale: « Fidélité » exprime naturellement la fiabilité de Yahweh dans ce couple de termes, tandis que la note maintient l’ambiguïté lexicale réelle sans l’effacer.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom personnel divin; sa transcription le distingue d’un titre.
translation_notes:
  register: Français international contemporain, poétique et digne. « S’est montré puissant envers nous » préserve l’image de force de גבר sans suggérer une victoire hostile sur le peuple. L’espace avant les signes doubles suit la typographie française.
