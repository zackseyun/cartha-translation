source:
  edition: WLC
  text: הַֽלְל֣וּ אֶת יְ֭הוָה כָּל גּוֹיִ֑ם שַׁ֝בְּח֗וּ/הוּ כָּל הָ/אֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/001.yaml
  text: Praise Yahweh[a], all nations; extol him, all peoples.
translation:
  language: fr
  text: Louez Yahweh[a], toutes les nations ! Célébrez-le, tous les peuples !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yahweh » (YHWH), nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: Signaler l’identité du nom hébreu et l’autre convention majeure de traduction.
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Louez
  rationale: Impératif pluriel du piel de הלל. « Louez » exprime directement et naturellement l’appel collectif à la louange.
- source_word: אֶת יְהוָה
  choice: Yahweh[a]
  rationale: Le texte porte directement le nom divin יהוה. La translittération « Yahweh » préserve ce nom plutôt que de le remplacer par un titre.
- source_word: כָּל גּוֹיִם
  choice: vous toutes, nations
  rationale: גּוֹיִם désigne ici l’ensemble des nations. L’apostrophe avec « vous toutes » rend explicite en français que celles-ci sont directement interpellées.
- source_word: שַׁבְּחוּהוּ
  choice: Célébrez-le
  rationale: Impératif pluriel de שבח avec suffixe masculin singulier. « Célébrez-le » conserve l’idée de louange tout en reflétant le changement de verbe dans le parallélisme hébreu.
- source_word: כָּל הָאֻמִּים
  choice: vous tous, peuples
  rationale: אֻמִּים désigne des peuples ou groupes humains. « Peuples » maintient une légère distinction lexicale avec « nations » dans le premier membre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le tétragramme comme nom propre. « Yahweh » le rend explicitement, tandis que la note signale la convention traditionnelle « le SEIGNEUR » sans trancher silencieusement la question de traduction.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux impératifs sont maintenus, ainsi que le parallélisme entre « nations » et « peuples ». La ponctuation exclamative restitue la force de l’appel sans ajouter de contenu.
