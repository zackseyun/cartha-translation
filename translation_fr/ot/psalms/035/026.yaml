source:
  edition: WLC
  text: יֵ֘בֹ֤שׁוּ וְ/יַחְפְּר֨וּ יַחְדָּו֮ שְׂמֵחֵ֪י רָעָ֫תִ֥/י יִֽלְבְּשׁוּ בֹ֥שֶׁת וּ/כְלִמָּ֑ה הַֽ/מַּגְדִּילִ֥ים עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/026.yaml
  text: Let those who rejoice at my harm be put to shame and humiliated together[a]; let those who magnify themselves against me be clothed with shame and disgrace.
translation:
  language: fr
  text: Qu’ils soient tous ensemble couverts de honte et humiliés, ceux qui se réjouissent de mon malheur ! Qu’ils soient revêtus de honte et d’opprobre, ceux qui s’élèvent contre moi[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui se grandissent à mes dépens » ou « ceux qui se vantent contre moi ». L’hébreu parle littéralement de ceux qui se font grands au-dessus de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ
  choice: qu’ils soient couverts de honte et humiliés
  rationale: Les deux verbes expriment ici, dans une prière imprécatoire, la honte et l’humiliation publiques. Cette formulation française garde leur parallélisme sans employer le terme vieilli « confondus ».
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: L’adverbe indique que les personnes visées partagent collectivement le même sort; « tous ensemble » le rend clairement.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: ceux qui se réjouissent de mon malheur
  rationale: רָעָה désigne ici le mal subi par le psalmiste, non une faute morale qu’il aurait commise. « Mon malheur » restitue naturellement ce sens.
- source_word: יִלְבְּשׁוּ בֹשֶׁת וּכְלִמָּה
  choice: qu’ils soient revêtus de honte et d’opprobre
  rationale: « Être revêtu » préserve l’image hébraïque du vêtement. « Honte et opprobre » rend les deux noms proches tout en conservant leur effet d’intensification.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: ceux qui s’élèvent contre moi
  rationale: Le participe hiphil de גדל avec עַל évoque le fait de se faire grand aux dépens de quelqu’un, donc de s’élever avec arrogance contre lui. La formulation retenue est naturelle et conserve cette image.
