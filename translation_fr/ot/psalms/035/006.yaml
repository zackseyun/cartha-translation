source:
  edition: WLC
  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: fr
  text: Que leur chemin soit sombre et glissant, avec l’ange de Yahweh qui les poursuit !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: Que … soit
  rationale: Le jussif de היה exprime ici un souhait imprécatoire. La tournure française « Que … soit » en conserve naturellement la force volitive.
- source_word: דַרְכָּם
  choice: leur chemin
  rationale: דֶּרֶךְ peut désigner un chemin concret ou, au sens figuré, la conduite et la destinée. « Chemin » maintient cette double portée.
- source_word: חֹשֶׁךְ
  choice: sombre
  rationale: Le nom « obscurité » est employé comme prédicat. L’adjectif « sombre » produit un français naturel tout en préservant l’image d’un chemin privé de lumière.
- source_word: וַחֲלַקְלַקּוֹת
  choice: et glissant
  rationale: Le pluriel חֲלַקְלַקּוֹת évoque des endroits ou un terrain glissants. La formulation adjectivale s’accorde naturellement avec « sombre » sans perdre l’image du danger.
- source_word: וּמַלְאַךְ יְהוָה
  choice: tandis que l’ange de Yahweh
  rationale: '« Tandis que » exprime ici la circonstance concomitante suggérée par la coordination : le chemin est dangereux pendant que l’ange poursuit les ennemis. La valeur simplement coordinative demeure signalée en note.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que par un titre substitutif, afin de conserver le nom divin présent dans le texte hébreu.
- source_word: רֹדְפָם
  choice: les poursuit
  rationale: Le participe de רדף décrit une poursuite active et continue. Le présent français convient à la proposition circonstancielle et n’en précise pas indûment les modalités.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre au lieu de le remplacer par un titre.
- issue: Rapport entre le chemin dangereux et la poursuite de l’ange
  choice: circonstance concomitante introduite par « tandis que »
  alternative: 'coordination imprécative : « et que l’ange de Yahweh les poursuive »'
  rationale: La conjonction hébraïque permet une simple coordination, mais le participe רֹדְפָם peut présenter la poursuite comme une circonstance accompagnant le chemin sombre et glissant. Le texte principal garde cette relation sans exclure l’autre lecture, donnée en note.
translation_notes:
  register: Français moderne, digne et direct. L’exclamation rend la vigueur de l’imprécation. Les adjectifs « sombre et glissant » privilégient une expression idiomatique tout en conservant l’image poétique du texte hébreu.
