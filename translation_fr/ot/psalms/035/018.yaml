  text: I will give thanks to you in the great assembly[b][a]; among a mighty people I will praise you.
translation:
  language: fr
  text: Je te rendrai grâce dans une grande assemblée[a] ; je te louerai au milieu d’un peuple puissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une grande communauté réunie ».
