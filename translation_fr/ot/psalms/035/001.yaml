  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: fr
  text: 'De David[a].


    Affronte, Yahweh, ceux qui m’affrontent[b] ; combats ceux qui me combattent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David ». La formule hébraïque peut exprimer l’auteur, l’appartenance ou l’association.
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu peut aussi avoir un sens juridique : « Défends ma cause contre mes adversaires. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ devant le nom de David peut indiquer l’auteur, l’appartenance ou l’association. « De David » conserve cette relative ouverture sans imposer la formulation plus étroite « par David ».
- source_word: רִיבָה ... אֶת יְרִיבַי
  choice: Affronte ... ceux qui m’affrontent
  rationale: La racine ריב évoque une contestation qui peut être judiciaire ou plus largement conflictuelle. « Affronter » est naturel en français actuel et maintient la reprise du même verbe, tandis qu’une note conserve la nuance juridique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par le titre « le Seigneur ».
- source_word: לְחַם ... אֶת לֹחֲמָי
  choice: combats ceux qui me combattent
  rationale: Cette formulation directe conserve la force militaire de לחם ainsi que la répétition entre l’impératif et le participe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée judiciaire ou générale de ריב
  choice: Affronte ... ceux qui m’affrontent
  alternative: Défends ma cause contre mes adversaires
  rationale: Le choix principal préserve la tension entre litige et conflit général sans ajouter explicitement « ma cause », absent de l’hébreu. La note signale la lecture judiciaire possible.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme et les répétitions de l’hébreu sont conservés. « Affronte » évite une tournure juridique trop restrictive tout en permettant d’en signaler la nuance en note.
