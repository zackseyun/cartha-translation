source:
  edition: WLC
  text: וּ/בְ/צַלְעִ/י֮ שָׂמְח֪וּ וְֽ/נֶאֱ֫סָ֥פוּ נֶאֶסְפ֬וּ עָלַ֣/י נֵ֭כִים וְ/לֹ֣א יָדַ֑עְתִּי קָֽרְע֥וּ וְ/לֹא דָֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: fr
  text: Mais quand j’ai trébuché, ils se sont réjouis et se sont rassemblés[a] ; ils se sont rassemblés contre moi, des agresseurs que je ne connaissais pas[b]. Ils m’ont déchiré sans s’arrêter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand je boitais » ou « au moment de ma défaillance ». L’hébreu peut désigner une claudication physique ou, plus largement, un moment de faiblesse ou de chute.
    reason: lexical_alternative
  - marker: b
    text: 'Le mot hébreu traduit par « agresseurs » est rare et de sens incertain. Il peut désigner ceux qui frappent, mais certains le comprennent comme « des infirmes ». La suite peut aussi se traduire : « des agresseurs se sont rassemblés contre moi sans que je le sache ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « ils m’ont déchiré et ne se sont pas tus », si l’image évoque des attaques verbales incessantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: quand j’ai trébuché
  rationale: Le terme peut évoquer une claudication, un faux pas ou, plus largement, un moment de faiblesse. Cette formulation française conserve l’idée de chute ou de défaillance sans imposer une infirmité strictement physique.
- source_word: שָׂמְחוּ
  choice: ils se sont réjouis
  rationale: Rend directement le qal accompli de שמח et exprime la joie hostile des adversaires.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: ils se sont rassemblés ; ils se sont rassemblés
  rationale: La répétition du verbe אסף est conservée afin de rendre l’insistance du texte hébreu.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte hostile, « contre moi » exprime naturellement en français la valeur adversative de la préposition.
- source_word: נֵכִים
  choice: des agresseurs
  rationale: Ce mot rare et incertain est probablement lié à l’idée de frapper. « Agresseurs » est naturel en français moderne tout en restant assez général ; les autres analyses sont signalées en note.
- source_word: וְלֹא יָדַעְתִּי
  choice: que je ne connaissais pas
  rationale: La phrase est comprise comme une relative décrivant les agresseurs. Une autre analyse, « sans que je le sache », demeure possible et est indiquée en note.
- source_word: קָרְעוּ
  choice: ils m’ont déchiré
  rationale: קרע signifie littéralement déchirer ou mettre en pièces. Le complément « me » est fourni par le contexte, sans préciser si l’attaque est physique ou verbale.
- source_word: וְלֹא דָמּוּ
  choice: sans s’arrêter
  rationale: דמם peut signifier se taire ou cesser. Ici, « sans s’arrêter » rend naturellement la poursuite incessante de l’attaque, tandis que l’autre sens est conservé en note.
