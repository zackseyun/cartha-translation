id: PSA.35.27
reference: Psalms 35:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: fr
  text: 'Que ceux qui se plaisent à voir mon bon droit reconnu[a] poussent des cris de joie et se réjouissent ! Qu’ils disent sans cesse : « Que Yahweh soit proclamé grand, lui qui prend plaisir à la paix[b] de son serviteur ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ma justice ». Le mot hébreu peut désigner la justice ou la droiture au sens moral ou juridique ; ici, il évoque probablement la reconnaissance du bon droit du psalmiste.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « paix » peut aussi désigner le bien-être ou la prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ
  choice: poussent des cris de joie
  rationale: Le verbe רנן évoque une expression vocale, éclatante et publique de la joie ; cette formulation en restitue mieux la force que le seul verbe « chanter ».
- source_word: וְיִשְׂמְחוּ
  choice: et se réjouissent
  rationale: שמח exprime la joie ou l’allégresse. « Se réjouissent » conserve le parallélisme avec les cris de joie sans rendre les deux verbes identiques.
- source_word: חֲפֵצֵי
  choice: ceux qui se plaisent à
  rationale: Le participe de חפץ désigne ceux qui éprouvent du plaisir ou trouvent leur satisfaction dans quelque chose. La tournure est naturelle en français et garde cette dimension affective.
- source_word: צִדְקִי
  choice: voir mon bon droit reconnu
  rationale: Dans le contexte judiciaire du psaume, צֶדֶק désigne vraisemblablement la reconnaissance du fait que le psalmiste est dans son droit. Cette formulation française exprime clairement cette valeur forensique sans transformer le terme en simple qualité morale.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: Qu’ils disent sans cesse
  rationale: Le souhait ou l’exhortation des premiers verbes se poursuit ici. « Sans cesse » rend naturellement le caractère continu de תָמִיד.
- source_word: יִגְדַּל יְהוָה
  choice: Que Yahweh soit proclamé grand
  rationale: L’imparfait a ici une valeur jussive dans une formule de louange. « Soit proclamé grand » conserve l’idée de גדל tout en évitant l’ambiguïté française de « soit grandi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הֶחָפֵץ
  choice: lui qui prend plaisir
  rationale: Le participe exprime le plaisir ou la satisfaction. Cette traduction maintient le lien lexical avec חֲפֵצֵי tout en restant idiomatique.
- source_word: שְׁלוֹם
  choice: paix
  rationale: שָׁלוֹם peut désigner la paix, le bien-être, l’intégrité ou la prospérité. « Paix » en est le rendu direct, tandis qu’une note préserve son sens plus large.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans les Psaumes, עֶבֶד désigne couramment le psalmiste dans sa relation de service envers Dieu ; « serviteur » est ici plus juste et naturel que « esclave ».
theological_decisions:
- issue: Sens de צִדְקִי appliqué au psalmiste
  choice: voir mon bon droit reconnu
  alternative: ma justice ; ma droiture
  rationale: 'Le cadre de conflit avec des accusateurs favorise une lecture forensique : le psalmiste souhaite que son bon droit soit reconnu. La note conserve les sens moral et juridique plus généraux du mot hébreu.'
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le nom propre est conservé par translittération, sans le remplacer par un titre ni privilégier une forme confessionnelle traditionnelle.
- issue: Valeur de יִגְדַּל dans la formule de louange
  choice: Que Yahweh soit proclamé grand
  alternative: Que Yahweh soit exalté ; Yahweh est grand
  rationale: La formulation choisie garde la valeur de souhait ou d’acclamation du jussif et le sens verbal de « devenir ou être rendu grand », plutôt que de le convertir en simple affirmation.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset conserve l’élan poétique des souhaits successifs, l’expression publique de la joie et la répétition de l’idée de plaisir présente dans le texte hébreu.
