translation:
  language: fr
  text: Ils me rendent le mal pour le bien ; mon âme est endeuillée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « deuil » ou « perte pour mon âme ». Le mot hébreu traduit par « âme » peut aussi désigner la vie ou la personne elle-même ; le terme rendu par « endeuillée » peut évoquer une perte cruelle, notamment un deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: Ils me rendent
  rationale: Le piel de שׁלם exprime ici l’idée de rendre ou de payer en retour. « Rendre le mal pour le bien » est une tournure française naturelle qui conserve la réciprocité hostile.
- source_word: רָעָה
  choice: le mal
  rationale: Le nom peut désigner le mal ou le tort causé. « Le mal » préserve à la fois la portée morale et la concision du texte.
- source_word: תַּחַת
  choice: pour
  rationale: La préposition marque ici l’échange ou la substitution. Dans l’expression française « le mal pour le bien », « pour » rend ce rapport avec naturel.
- source_word: טוֹבָה
  choice: le bien
  rationale: Le terme désigne le bien, la bonté ou un bienfait. « Le bien » maintient l’antithèse concise avec « le mal ».
- source_word: שְׁכוֹל
  choice: endeuillée
  rationale: Le mot évoque la privation cruelle et le deuil, souvent liés à la perte d’enfants. L’adjectif verbal « endeuillée » restitue cette image forte dans une phrase française intelligible sans préciser indûment la nature de la perte.
- source_word: לְנַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » conserve ici l’imagerie poétique et la profondeur affective, tandis que la note signale les autres valeurs possibles.
