translation_notes:
  register: Français contemporain, poétique et digne. Le point-virgule maintient le parallélisme tout en rendant intelligible la proposition nominale hébraïque. « En est endeuillée » explicite sobrement le résultat sans définir la perte ni supprimer l’ambiguïté de נֶפֶשׁ.
