source:
  edition: WLC
  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: fr
  text: 'Tous mes os diront : « Éternel, qui est comme toi, toi qui délivres le pauvre d’un plus fort que lui, le pauvre et le démuni de celui qui le dépouille ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: Tous mes os
  rationale: Rend littéralement l’expression hébraïque, qui désigne avec force l’être tout entier sans effacer son image corporelle.
- source_word: יְהוָה
  choice: Éternel
  rationale: Traduction française traditionnelle et immédiatement reconnaissable du tétragramme dans ce registre biblique.
- source_word: עָנִי
  choice: le pauvre
  rationale: Dans ce contexte de violence et d’exploitation, le terme désigne une personne faible, affligée ou socialement vulnérable; « pauvre » reste naturel et conserve la dimension sociale.
- source_word: חָזָק מִמֶּנּוּ
  choice: un plus fort que lui
  rationale: Reproduit directement le rapport de force exprimé par l’hébreu.
- source_word: אֶבְיוֹן
  choice: le démuni
  rationale: Distingue ce terme de עָנִי et exprime le manque matériel et la vulnérabilité.
- source_word: גֹּזְלוֹ
  choice: celui qui le dépouille
  rationale: Le participe de גזל évoque l’action d’arracher, de voler ou de dépouiller par la force; cette formulation convient à la relation d’oppression décrite.
theological_decisions:
- issue: Portée de la délivrance divine
  choice: Conserver les catégories concrètes du « pauvre » et du « démuni » ainsi que l’asymétrie de force
  alternative: Spiritualiser en parlant du pécheur ou d’une délivrance exclusivement intérieure
  rationale: Le texte présente directement YHWH comme le défenseur des personnes vulnérables contre un oppresseur plus puissant; aucune restriction spirituelle n’est explicitée.
- issue: Nom divin יהוה
  choice: Éternel
  alternative: Yahvé / le SEIGNEUR
  rationale: « Éternel » est une convention française digne et courante; elle signale le nom divin sans imposer une vocalisation reconstruite.
translation_notes:
  register: Français moderne, clair et solennel. La métaphore « Tous mes os diront » est maintenue, ainsi que le parallélisme poétique. La question puis l’affirmation rendent naturellement l’adresse hébraïque sans ajouter d’interprétation.
