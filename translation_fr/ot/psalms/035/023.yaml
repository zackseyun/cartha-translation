  text: הָעִ֣ירָ/ה וְ֭/הָקִיצָ/ה לְ/מִשְׁפָּטִ֑/י אֱלֹהַ֖/י וַֽ/אדֹנָ֣/י לְ/רִיבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/023.yaml
  text: Awake and rise up for my judgment[a], my God and my Lord[c][b], for my cause.
translation:
  language: fr
  text: Réveille-toi, lève-toi pour me rendre justice[a], mon Dieu et mon Seigneur, pour ma cause[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour mon jugement » ou « pour faire reconnaître mon bon droit » ; le terme hébreu peut désigner le jugement, la justice ou la reconnaissance judiciaire du bon droit.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour mon litige » ; le terme hébreu désigne une contestation, un litige ou une cause judiciaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִירָה
  choice: Réveille-toi
  rationale: Impératif intensif adressé à Dieu, qui appelle son intervention tout en conservant l’image du réveil.
- source_word: וְהָקִיצָה
  choice: lève-toi
  rationale: Second verbe de réveil employé en parallèle pour intensifier l’appel. « Lève-toi » évite une répétition pesante en français et exprime le passage à l’action.
- source_word: לְמִשְׁפָּטִי
  choice: pour me rendre justice
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou la reconnaissance judiciaire du bon droit. Dans cette supplication, cette formulation française naturelle conserve la portée juridique sans présumer explicitement l’issue.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Forme possessive employée comme apostrophe directe.
- source_word: וַאדֹנָי
  choice: et mon Seigneur
  rationale: Titre divin en adresse directe. « Seigneur » est la traduction française usuelle et appropriée, sans ajout christologique.
- source_word: לְרִיבִי
  choice: pour défendre ma cause
  rationale: רִיב désigne ici un litige, une contestation ou une cause judiciaire. L’ajout idiomatique de « défendre » rend clairement en français l’appel à intervenir en faveur de la cause du psalmiste.
theological_decisions:
- issue: Double titre divin אֱלֹהַי וַאדֹנָי
  choice: mon Dieu et mon Seigneur
  alternative: mon Dieu et mon maître
  rationale: Le texte adresse à Dieu deux titres révérenciels. « Seigneur » convient au titre divin אֲדֹנָי et n’introduit aucune identification christologique propre au contexte néotestamentaire.
- issue: Portée de לְמִשְׁפָּטִי
  choice: pour me rendre justice
  alternative: pour mon jugement / pour faire reconnaître mon bon droit
  rationale: La formulation garde ensemble les dimensions judiciaire et juste de מִשְׁפָּט. Elle exprime la demande du psalmiste sans transformer explicitement le terme en déclaration préalable de son innocence.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme urgent des deux impératifs est conservé, ainsi que l’apostrophe centrale « mon Dieu et mon Seigneur ». La ponctuation exclamative convient à l’intensité de la supplication.
