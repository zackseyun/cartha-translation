source:
  edition: WLC
  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: fr
  text: 'Tire la lance et barre le passage à ceux qui me poursuivent[a] ; dis à mon âme[b] : « Je suis ton salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tire la lance et la hache de combat contre ceux qui me poursuivent », si וּסְגֹר est compris comme le nom d’une arme plutôt que comme le verbe « fermer, barrer ».
    reason: alternative_reading
  - marker: b
    text: Ou « à moi-même » ou « à ma vie ». Le mot hébreu peut désigner l’âme, la personne elle-même ou sa vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Tire
  rationale: L’impératif hiphil de ריק signifie ici vraisemblablement tirer ou sortir une arme. « Tire » est naturel en français dans l’expression « tirer la lance » et conserve l’image guerrière.
- source_word: חֲנִית
  choice: la lance
  rationale: חֲנִית désigne couramment une lance. L’article défini convient à l’expression française, sans imposer une précision absente du contexte.
- source_word: וּסְגֹר
  choice: barre le passage
  rationale: Le verbe signifie littéralement fermer. Dans ce contexte, il évoque l’action d’arrêter la route aux poursuivants ; « barre le passage » explicite naturellement l’objet sous-entendu, tout en conservant l’ambiguïté textuelle dans une note.
- source_word: לִקְרַאת
  choice: devant
  rationale: La préposition exprime ici le mouvement ou la position face aux poursuivants. « Devant » s’accorde naturellement avec « barrer le passage » et évite de surdéterminer la nuance comme purement adversative.
- source_word: רֹדְפָי
  choice: ceux qui me poursuivent
  rationale: Le participe avec suffixe de première personne décrit des poursuivants en pleine action. Cette tournure est claire et actuelle.
- source_word: אֱמֹר
  choice: dis
  rationale: Rendu direct de l’impératif de אמר, sans ajouter l’idée plus forte de proclamation.
- source_word: לְנַפְשִׁי
  choice: à mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la personne ou la vie. « À mon âme » préserve la force poétique et l’adresse intérieure du texte.
- source_word: יְשֻׁעָתֵךְ
  choice: ton salut
  rationale: יְשׁוּעָה peut désigner une délivrance concrète ou le salut au sens plus large. « Ton salut » conserve cette ampleur sémantique en français biblique moderne.
- source_word: אָֽנִי
  choice: Je suis
  rationale: 'Le pronom indépendant est emphatique. La phrase nominale hébraïque exige naturellement la copule en français : « Je suis ton salut. »'
theological_decisions:
- issue: Sens de יְשׁוּעָה dans une prière demandant le secours
  choice: salut
  alternative: délivrance
  rationale: Le contexte immédiat concerne le secours face à des poursuivants, ce qui permet « délivrance ». « Salut » reste toutefois fidèle à la portée plus large du terme hébreu sans lui imposer un contenu doctrinal ultérieur ; l’alternative est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. L’image militaire demeure concrète, tandis que la syntaxe reste accessible. Les notes préservent l’incertitude concernant וּסְגֹר et l’étendue sémantique de נֶפֶשׁ.
