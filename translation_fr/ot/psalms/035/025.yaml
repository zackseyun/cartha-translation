  text: אַל יֹאמְר֣וּ בְ֭/לִבָּ/ם הֶאָ֣ח נַפְשֵׁ֑/נוּ אַל יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: fr
  text: 'Qu’ils ne se disent pas en eux-mêmes : « Ah ! Voilà ce que nous désirions ! » Qu’ils ne disent pas : « Nous l’avons englouti ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Qu’ils ne se disent pas / Qu’ils ne disent pas
  rationale: אַל avec l’imparfait à valeur jussive exprime ici une demande négative adressée à Dieu. La tournure française au subjonctif conserve cette valeur de souhait ou de prière.
- source_word: בְלִבָּם
  choice: en eux-mêmes
  rationale: Littéralement « dans leur cœur ». Dans ce contexte, l’expression désigne une parole intérieure; « en eux-mêmes » est naturel en français moderne et évite l’étrange singulier collectif « dans leur cœur ».
- source_word: הֶאָח
  choice: Ah !
  rationale: Interjection exprimant une satisfaction malveillante ou un triomphe. « Ah ! » en restitue naturellement la force exclamative.
- source_word: נַפְשֵׁנוּ
  choice: Voilà ce que nous désirions !
  rationale: נֶפֶשׁ peut désigner la personne, la vie, l’appétit ou le désir. Ici, l’exclamation semble exprimer la satisfaction d’un désir; la formulation française rend l’idiome sans introduire une conception métaphysique de l’âme.
- source_word: בִּלַּעֲנוּהוּ
  choice: Nous l’avons englouti !
  rationale: Le verbe בלע signifie « avaler, engloutir, dévorer ». « Englouti » préserve l’image vive d’une destruction ou d’une victoire totale.
