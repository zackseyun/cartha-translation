  text: כִּ֤י לֹ֥א שָׁל֗וֹם יְדַ֫בֵּ֥רוּ וְ/עַ֥ל רִגְעֵי אֶ֑רֶץ דִּבְרֵ֥י מִ֝רְמוֹת יַחֲשֹׁבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/020.yaml
  text: For they do not speak peace[a], but against the quiet ones of the land they devise deceitful words.
translation:
  language: fr
  text: Car ils ne parlent pas de paix, mais ils préparent des paroles trompeuses contre les gens paisibles du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les gens tranquilles du pays » ou « ceux qui vivent en repos dans le pays ». Le sens exact de l’expression hébraïque est incertain ; elle désigne probablement des personnes qui vivent tranquillement et en paix.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de la plainte précédente et convient au mouvement argumentatif du psaume.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: ils ne parlent pas de paix
  rationale: Conserve « paix » comme objet du verbe, sans réduire l’expression au simple ton de leur discours.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Rend le sens central de שָׁלוֹם tout en laissant résonner ses connotations de concorde et de bien-être.
- source_word: וְעַל
  choice: mais … contre
  rationale: Le contraste avec l’absence de paroles de paix justifie la valeur adversative de « mais »; « contre » exprime la cible de leurs machinations.
- source_word: רִגְעֵי אֶרֶץ
  choice: les gens paisibles du pays
  rationale: Expression française naturelle désignant vraisemblablement ceux qui vivent tranquillement et sans hostilité dans le pays, tout en signalant en note l’incertitude lexicale.
- source_word: דִּבְרֵי מִרְמוֹת
  choice: des paroles trompeuses
  rationale: Rend naturellement le syntagme construit hébreu et son contenu verbal mensonger ou perfide.
- source_word: יַחֲשֹׁבוּן
  choice: ils méditent
  rationale: Dans ce contexte hostile, le verbe désigne l’élaboration délibérée de propos trompeurs; « méditent » conserve l’idée de conception réfléchie.
theological_decisions: []
