  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: fr
  text: 'Tu as vu, Yahvé ! Ne garde pas le silence.

    Seigneur, ne reste pas loin de moi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Tu as vu
  rationale: Le qal accompli, à la 2e personne du masculin singulier, affirme que Dieu a déjà vu la situation. Le passé composé exprime naturellement en français cette constatation sur laquelle s’appuie l’appel du psalmiste, sans ajouter d’objet absent de l’hébreu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre. « Yahvé » est la forme française courante et immédiatement prononçable du nom divin.
- source_word: אַל תֶּחֱרַשׁ
  choice: Ne garde pas le silence
  rationale: Le verbe חרשׁ signifie ici « se taire, garder le silence ». Cette formulation conserve l’image d’un Dieu qui ne doit pas demeurer sans répondre ni agir.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: אֲדֹנָי est ici le titre divin « Seigneur ». La traduction le distingue du nom propre יהוה employé dans le premier membre.
- source_word: אַל תִּרְחַק
  choice: ne reste pas loin
  rationale: Le verbe רחק décrit le fait d’être ou de demeurer éloigné. « Ne reste pas loin » préserve la métaphore spatiale et relationnelle sans suggérer nécessairement que Dieu serait en train de s’éloigner.
- source_word: מִמֶּנִּי
  choice: de moi
  rationale: La préposition מן avec le suffixe de la 1re personne du singulier signifie « de moi » et complète naturellement l’expression « rester loin de moi ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin, tandis que אֲדֹנָי fournit déjà le titre « Seigneur » dans le membre suivant. La translittération française maintient cette distinction et évite de remplacer silencieusement le nom par un titre.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse singulière de l’hébreu et à l’usage français courant dans les psaumes. Le parallélisme des deux supplications est conservé sur deux lignes.
