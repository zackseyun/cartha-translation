  text: אַֽל יִשְׂמְחוּ לִ֣/י אֹיְבַ֣/י שֶׁ֑קֶר שֹׂנְאַ֥/י חִ֝נָּ֗ם יִקְרְצוּ עָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/019.yaml
  text: Do not let my enemies falsely rejoice over me[b][a], nor let those who hate me without cause wink the eye.
translation:
  language: fr
  text: Que mes ennemis ne se réjouissent pas à tort à mon sujet[a] ! Que ceux qui me haïssent sans raison ne clignent pas de l’œil[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que mes ennemis menteurs ne se réjouissent pas à mon sujet ». L’expression hébraïque est concise et peut soit caractériser les ennemis par le mensonge, soit qualifier leur attitude ou leur réjouissance comme fausse, injustifiée.
    reason: lexical_alternative
  - marker: b
    text: « Cligner de l’œil » est ici un idiome désignant un signe malveillant ou complice, qui peut exprimer la moquerie, le mépris ou une hostilité dissimulée.
    reason: cultural_note
lexical_decisions:
- source_word: אַל ... יִשְׂמְחוּ
  choice: Que ... ne se réjouissent pas
  rationale: La particule négative avec l’imparfait exprime ici une demande adressée à Dieu. Cette tournure française conserve la forme de prière sans ajouter explicitement « laisse ».
- source_word: לִי
  choice: à mon sujet
  rationale: La préposition signifie littéralement « pour/à moi » et, dans ce contexte hostile, peut évoquer la joie prise au malheur du psalmiste. « À mon sujet » reste naturel tout en évitant de préciser excessivement la cause de cette joie.
- source_word: אֹיְבַי שֶׁקֶר
  choice: mes ennemis menteurs
  rationale: L’expression hébraïque compacte associe les ennemis au mensonge. Ce choix conserve ce lien direct, tandis qu’une note signale que שֶׁקֶר peut aussi qualifier leur manière d’agir.
- source_word: שֹׂנְאַי חִנָּם
  choice: ceux qui me haïssent sans raison
  rationale: Le participe désigne ceux qui haïssent le psalmiste, et חִנָּם indique que cette haine est gratuite, sans motif valable.
- source_word: יִקְרְצוּ עָיִן
  choice: se fassent des clins d’œil
  rationale: L’expression décrit un signal fait de l’œil, ici malveillant ou complice. Le pluriel idiomatique français rend naturellement le geste entre adversaires sans en effacer l’image concrète.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé par deux propositions jussives. « Sans raison » rend clairement l’hostilité injustifiée, et les notes préservent l’ambiguïté de אֹיְבַי שֶׁקֶר ainsi que la portée culturelle du geste de l’œil.
