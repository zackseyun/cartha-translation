  text: For without cause they hid their net's pit for me[d][c][b][a]; without cause they dug it for my life.
translation:
  language: fr
  text: Car, sans raison, ils ont caché contre moi la fosse de leur filet[a] ; sans raison, ils l’ont creusée pour m’ôter la vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le rapport exact entre « fosse » et « leur filet » est incertain en hébreu. On pourrait aussi traduire : « une fosse destinée à leur filet » ou « leur filet dans une fosse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour ma vie » ou « pour ma personne ». Le mot hébreu désigne ici le psalmiste lui-même ou sa vie, et pas nécessairement l’« âme » au sens théologique plus tardif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel du psalmiste dans le contexte et conserve la valeur causale de la conjonction.
- source_word: חִנָּם
  choice: sans raison
  rationale: Exprime une hostilité gratuite, dépourvue de motif légitime. La répétition dans les deux propositions reproduit l’insistance de l’hébreu.
- source_word: טָמְנוּ
  choice: ont caché
  rationale: Rend directement l’idée de dissimuler un piège destiné au psalmiste.
- source_word: לִי
  choice: pour moi
  rationale: Conserve la formulation compacte de l’hébreu en indiquant la personne visée par le piège.
- source_word: שַׁחַת רִשְׁתָּם
  choice: une fosse avec leur filet
  rationale: Maintient les deux éléments concrets de l’image, la fosse et le filet, sans trancher trop fortement leur rapport syntaxique difficile.
- source_word: חָפְרוּ
  choice: ont creusé
  rationale: Correspond au sens concret du verbe et prolonge naturellement l’image de la fosse.
- source_word: לְנַפְשִׁי
  choice: pour m’ôter la vie
  rationale: Dans ce contexte hostile, נֶפֶשׁ désigne la vie ou la personne du psalmiste, non une âme immatérielle au sens théologique étroit. Cette formulation exprime naturellement en français le but meurtrier.
theological_decisions:
- issue: Sens de נֶפֶשׁ
  choice: la vie du psalmiste
  alternative: son âme
  rationale: Le contexte décrit une menace contre sa personne et sa vie. Traduire par « âme » risquerait d’introduire une distinction anthropologique absente du verset.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme et la répétition de « sans raison » sont conservés. La première proposition garde visible l’ambiguïté de la construction hébraïque, tandis que la seconde explicite avec naturel la menace contre la vie.
