source:
  edition: WLC
  text: תְּבוֹאֵ֣/הוּ שׁוֹאָה֮ לֹֽא יֵ֫דָ֥ע וְ/רִשְׁתּ֣/וֹ אֲשֶׁר טָמַ֣ן תִּלְכְּד֑/וֹ בְּ֝/שׁוֹאָ֗ה יִפָּל בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: fr
  text: Que la ruine le surprenne sans qu’il s’en doute[a] ! Que le filet qu’il a caché le prenne ! Qu’il tombe dans cette ruine[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que la ruine vienne sur lui, sans qu’il le sache. »'
    reason: lexical_alternative
  - marker: b
    text: 'Le dernier pronom, littéralement « en elle », peut renvoyer à la ruine : « qu’il tombe dans cette ruine ». Il peut aussi renvoyer au filet : « qu’il tombe dans le filet qu’il avait caché ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ שׁוֹאָה
  choice: Que la ruine le surprenne
  rationale: Le verbe בוא signifie littéralement « venir » ; avec שׁוֹאָה pour sujet, « que la ruine le surprenne » exprime naturellement en français la venue soudaine du désastre et la valeur de souhait du contexte imprécatoire.
- source_word: לֹא יֵדָע
  choice: sans qu’il s’en doute
  rationale: Littéralement « il ne sait pas ». Cette formulation française conserve l’absence de connaissance ou d’anticipation sans alourdir la phrase.
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: le filet qu’il a caché
  rationale: Le suffixe de רִשְׁתּוֹ indique « son filet », tandis que la relative précise que c’est lui qui l’a caché. Cette formulation est naturelle et préserve l’image du piège dissimulé.
- source_word: תִּלְכְּדוֹ
  choice: le capture
  rationale: לכד signifie prendre ou capturer. Avec un filet comme sujet, « capturer » est clair, actuel et fidèle.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: Qu’il tombe lui-même dans cette ruine
  rationale: La reprise prépositionnelle בְּשׁוֹאָה…בָּהּ peut mettre en relief la ruine déjà nommée. « Cette ruine » et « lui-même » rendent cette insistance en français tout en évitant une répétition maladroite.
theological_decisions:
- issue: Référent du suffixe féminin dans בָּהּ
  choice: Le texte principal le rapporte à שׁוֹאָה (« cette ruine »).
  alternative: 'Le suffixe peut être compris comme renvoyant au filet : « qu’il y tombe lui-même » ou « qu’il tombe dans son propre filet ».'
  rationale: שׁוֹאָה est le nom féminin immédiatement repris dans la proposition, ce qui soutient la lecture adoptée. Cependant, רֶשֶׁת (« filet ») est également féminin et l’image de l’homme pris à son propre piège reste grammaticalement et contextuellement possible ; l’ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les trois souhaits imprécatoires sont rendus par des subjonctifs exhortatifs. « Ruine » permet une répétition naturelle et correspond au champ sémantique de שׁוֹאָה. Tous les marqueurs de notes figurent dans le texte principal.
