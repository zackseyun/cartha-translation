  text: לְ/דָוִ֨ד רִיבָ֣/ה יְ֭הוָה אֶת יְרִיבַ֑/י לְ֝חַ֗ם אֶת לֹֽחֲמָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: fr
  text: De David. SEIGNEUR, prends à partie ceux qui me prennent à partie[a] ; combats ceux qui me combattent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut aussi avoir un sens juridique : « plaide contre mes adversaires ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres peut indiquer l’auteur, l’appartenance ou la destination. « De David » conserve cette concision et une part de l’ambiguïté.
- source_word: רִיבָה … אֶת־יְרִיבַי
  choice: Défends ma cause … contre ceux qui m’accusent
  rationale: La racine ריב appartient souvent au domaine du litige et peut signifier plaider, défendre une cause ou contester. Cette formulation restitue ici l’image judiciaire tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Éternel
  rationale: Rendu français traditionnel et reconnaissable du tétragramme, employé comme nom divin dans l’adresse directe.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: combats ceux qui me combattent
  rationale: La répétition de la racine לחם est reproduite afin de préserver le parallélisme et l’intensité de l’hébreu.
theological_decisions:
- issue: Nature du premier appel adressé à Dieu
  choice: Conserver l’image d’une défense judiciaire sans exclure l’idée plus générale d’affrontement
  alternative: « Prends à partie ceux qui me prennent à partie » ou « Affronte ceux qui m’affrontent »
  rationale: Le premier membre emploie ריב, souvent juridique, tandis que le second emploie explicitement le vocabulaire du combat. Les distinguer préserve la progression et la tension poétique.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le parallélisme hébreu est conservé, avec une distinction entre le procès ou litige du premier membre et le combat du second.
