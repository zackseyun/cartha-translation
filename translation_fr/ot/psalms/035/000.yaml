    issue: « ceux qui m’accusent » est trop étroit pour יְרִיבַי.
    rationale: Le terme désigne des adversaires ou des personnes en conflit avec le psalmiste; il ne précise pas qu’ils sont des accusateurs.
  - severity: medium
    issue: « Défends ma cause » transforme l’appel à contester les adversaires en une défense explicitement formulée.
    rationale: La nuance judiciaire de ריב est possible, mais le texte ne mentionne pas explicitement « ma cause » et garde une formulation plus largement conflictuelle.
  - severity: low
    issue: « Éternel » interprète le nom divin plutôt que de le représenter selon la convention typographique habituelle.
    rationale: Le tétragramme est mieux rendu ici par « SEIGNEUR », forme conventionnelle qui n’impose pas l’étymologie « éternel ».
