  text: Among the godless mockers at a feast[a], they gnash their teeth at me.
translation:
  language: fr
  text: Parmi les moqueurs impies, lors d’un festin[a], ils grincent des dents contre moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parmi les moqueurs profanes pour un gâteau (ou une bouchée) » ; le terme hébreu rendu par « lors d’un festin » est rare et son sens demeure incertain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: Parmi les impies
  rationale: 'Le terme désigne des personnes profanes ou moralement corrompues. « Impies » conserve ici sa portée morale et religieuse, tandis que la préposition בְּ est comprise au sens associatif : « parmi ».'
- source_word: לַעֲגֵי
  choice: qui se moquent
  rationale: Le mot désigne des moqueurs ou railleurs. La proposition relative est plus naturelle en français courant que l’enchaînement nominal « les moqueurs ».
- source_word: מָעוֹג
  choice: dans les festins
  rationale: Ce terme rare et incertain a été associé à un gâteau, à une bouchée ou à un contexte de banquet. « Dans les festins » rend naturellement l’interprétation contextuelle sans masquer l’incertitude, signalée en note.
- source_word: חָרֹק
  choice: ils grincent
  rationale: Le verbe exprime le grincement des dents comme manifestation d’hostilité. Une forme verbale finie donne une phrase française naturelle.
- source_word: עָלַי
  choice: contre moi
  rationale: Avec ce geste hostile, « contre moi » exprime clairement l’orientation de l’animosité et reste idiomatique en français.
- source_word: שִׁנֵּימוֹ
  choice: des dents
  rationale: Dans l’expression française « grincer des dents », le possessif est normalement omis, mais la référence aux dents des adversaires reste sans ambiguïté.
