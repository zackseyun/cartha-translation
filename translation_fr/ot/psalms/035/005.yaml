  text: יִֽהְי֗וּ כְּ/מֹ֥ץ לִ/פְנֵי ר֑וּחַ וּ/מַלְאַ֖ךְ יְהוָ֣ה דּוֹחֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/005.yaml
  text: May they be like chaff before the wind[a], with the angel of Yahweh driving them away.
translation:
  language: fr
  text: Qu’ils soient comme de la balle devant le vent[a], tandis que l’ange de Yahweh les repousse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et l’ange de Yahweh les repousse ». La conjonction hébraïque peut être simplement coordinative; le participe peut aussi se comprendre comme « les chassant » ou « les repoussant ».'
    reason: Préserve l’ambiguïté syntaxique et lexicale du waw suivi du participe דּוֹחֶה.
lexical_decisions:
- source_word: יִהְיוּ
  choice: Qu’ils soient
  rationale: Dans ce contexte imprécatoire, la forme exprime un souhait ou une demande plutôt qu’un simple futur.
- source_word: כְּמֹץ
  choice: comme la balle
  rationale: מֹץ désigne la balle des céréales, légère et emportée lors du vannage. « La balle » est le terme français précis dans cette image agricole.
- source_word: לִפְנֵי רוּחַ
  choice: emportée par le vent
  rationale: Littéralement « devant le vent ». Cette formulation naturelle en français explicite l’effet suggéré par l’image sans en modifier le sens.
- source_word: וּמַלְאַךְ יְהוָה
  choice: et que l’ange de Yahweh
  rationale: Le waw est rendu par « et », sa valeur coordinative la plus directe. מַלְאָךְ est compris comme « ange » dans cette expression biblique, sans préciser davantage son identité.
- source_word: דּוֹחֶה
  choice: les chasse
  rationale: Le participe de דחה exprime l’action de repousser ou chasser avec force. Le pronom objet, implicite en hébreu, est restitué en français d’après le contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre divin est translittéré afin de préserver sa fonction de nom dans le texte hébreu.
- issue: Identité de מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  alternative: le messager de Yahweh
  rationale: « Ange » est ici le sens contextuel et traditionnellement reconnu de מַלְאָךְ, sans que la traduction avance une identification théologique particulière.
- issue: Rapport entre les deux propositions
  choice: et que l’ange de Yahweh les chasse
  alternative: tandis que l’ange de Yahweh les chasse
  rationale: Le parallélisme de deux souhaits coordonnés et la valeur simple du waw favorisent « et que ». La formulation conserve néanmoins l’association étroite entre le vent et l’action de l’ange.
translation_notes:
  register: Français moderne, digne et directement compréhensible. L’image agricole est conservée avec « balle » au sens des enveloppes légères du grain. La ponctuation exclamative rend la force imprécatoire du verset.
