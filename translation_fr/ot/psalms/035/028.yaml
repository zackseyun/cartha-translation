  to: Et ma langue parlera de ta justice et de ta louange tout au long du jour.
  rationale: La révision remplace « redira » par « parlera de », expression naturelle qui rend l'idée d'une parole de la langue sans ajouter une répétition. Elle fait régir les deux compléments par le seul verbe, conformément à la syntaxe elliptique des deux membres hébreux. La note explicative sur l'ellipse n'est plus nécessaire, puisque la formulation française n'introduit plus de second verbe.
