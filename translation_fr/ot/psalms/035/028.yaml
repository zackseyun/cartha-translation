  text: And my tongue will meditate on your righteousness[d][c][b][a], and on your praise all day long.
translation:
  language: fr
  text: Et ma langue parlera de ta justice et de ta louange tout au long du jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: Et ma langue
  rationale: Conserve la conjonction qui relie le verset au contexte précédent et la métonymie hébraïque de la langue pour la parole.
- source_word: תֶּהְגֶּה
  choice: redira
  rationale: Avec « ma langue » pour sujet, הגה désigne ici une expression vocale répétée ou continue. « Redira » reste naturel en français et suggère cette parole soutenue sans la réduire à une méditation silencieuse.
- source_word: צִדְקֶךָ
  choice: ta justice
  rationale: Dans ce psaume de demande de délivrance et de réhabilitation, le terme évoque particulièrement l’action juste de Dieu qui rend justice au psalmiste. « Justice » garde aussi en français une portée morale large.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Expression française naturelle qui rend la durée continue indiquée par l’hébreu.
- source_word: תְּהִלָּתֶךָ
  choice: elle te louera
  rationale: Le nom hébreu signifie littéralement « ta louange » et peut désigner la louange adressée à Dieu. La reformulation verbale produit un parallélisme clair et idiomatique en français.
theological_decisions:
- issue: Sens de צִדְקֶךָ dans un contexte de justification et de délivrance
  choice: ta justice
  alternative: ta droiture
  rationale: Le contexte met en avant la juste intervention de Dieu en faveur du psalmiste. « Justice » exprime bien cette dimension sans exclure la rectitude divine; « droiture » demeure une traduction possible.
- issue: Rapport syntaxique entre תֶּהְגֶּה et תְּהִלָּתֶךָ
  choice: 'Deux propositions parallèles : « redira ta justice / elle te louera »'
  alternative: 'Un seul verbe régissant les deux objets : « parlera de ta justice et de ta louange »'
  rationale: L’hébreu n’énonce qu’un verbe, mais la poésie permet de le prolonger dans le second membre. La traduction explicite cette continuité par un verbe français naturel sans modifier le contenu essentiel.
translation_notes:
  register: Français international moderne, poétique et digne. Le découpage en deux lignes restitue le parallélisme. « Redira » exprime une parole répétée ou continue; « elle te louera » évite en français l’expression ambiguë « ta louange » tout en signalant la forme hébraïque en note.
