id: PSA.35.24
reference: Psalms 35:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: fr
  text: Rends-moi justice selon ta justice[a], Yahweh, mon Dieu, et qu’ils ne se réjouissent pas à mes dépens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon ta droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Rends-moi justice
  rationale: Dans cette supplication, l’impératif de שׁפט demande à Dieu de prononcer un jugement favorable en faveur du psalmiste. « Rends-moi justice » exprime naturellement en français cette portée judiciaire et justificatrice.
- source_word: כְצִדְקְךָ
  choice: selon ta justice
  rationale: צדק désigne ici la rectitude et la justice propres à Dieu. En français courant, « selon ta justice » conserve à la fois la dimension morale et judiciaire du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Le suffixe de première personne du singulier est explicite et se rend directement par « mon Dieu ».
- source_word: וְאַל יִשְׂמְחוּ
  choice: et qu’ils ne se réjouissent pas
  rationale: אַל suivi de l’inaccompli exprime ici une demande négative adressée à Dieu. Cette tournure française garde la forme de souhait ou de requête sans expliciter plus que l’hébreu la causalité divine.
- source_word: לִי
  choice: à mes dépens
  rationale: Avec שמח dans ce contexte hostile, לִי indique une joie triomphante dirigée contre le psalmiste. « À mes dépens » rend clairement cette nuance en français idiomatique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de צִדְקְךָ
  choice: ta justice
  alternative: ta droiture
  rationale: Le mot hébreu embrasse la rectitude morale et l’exercice juste du jugement. « Justice » convient particulièrement à la demande judiciaire formulée par שָׁפְטֵנִי, tandis que « droiture » reste une possibilité légitime signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Rends-moi justice selon ta justice » reproduit volontairement la concentration judiciaire de l’hébreu, tandis que « à mes dépens » restitue naturellement la jubilation hostile.
