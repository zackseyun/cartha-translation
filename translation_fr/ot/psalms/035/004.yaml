source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: fr
  text: Que ceux qui cherchent à m’ôter la vie[a] soient couverts de honte et humiliés ! Que ceux qui projettent de me faire du mal[b] reculent et soient déshonorés !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui cherchent mon âme » ; dans ce contexte, l’expression hébraïque signifie chercher à prendre la vie de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui méditent le mal contre moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: soient couverts de honte
  rationale: Le qal de בוש exprime ici l’expérience de la honte. La tournure française conserve la valeur de souhait ou de demande portée par le contexte imprécatoire.
- source_word: וְיִכָּלְמוּ
  choice: et humiliés
  rationale: Le niphal de כלם renforce le vocabulaire de la honte avec une nuance passive et publique; « humiliés » maintient cette intensification sans répéter exactement le premier verbe.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ceux qui en veulent à ma vie
  rationale: Dans ce contexte hostile, l’expression signifie chercher à prendre la vie du psalmiste. « En vouloir à ma vie » rend naturellement l’idiome tout en conservant la référence explicite à la vie.
- source_word: יִסֹּגוּ אָחוֹר
  choice: reculent
  rationale: סוג avec אָחוֹר décrit un mouvement de retrait ou de défaite. « Reculent » est concis, naturel et évite la redondance de « retournent en arrière ».
- source_word: וְיַחְפְּרוּ
  choice: et soient déshonorés
  rationale: חפר relève ici du champ de la honte et non de son sens concret de creuser. « Déshonorés » le distingue légèrement des deux termes précédents.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: ceux qui projettent de me faire du mal
  rationale: חשב exprime l’action de concevoir ou de préparer, tandis que רָעָתִי désigne ici le mal destiné au psalmiste. Cette formulation est claire et actuelle sans atténuer l’intention hostile.
theological_decisions:
- issue: Valeur imprécatoire des formes verbales
  choice: Employer « Que… soient » et « Que… reculent » pour exprimer un souhait ou une requête de jugement.
  alternative: 'Les rendre comme de simples futurs déclaratifs : « Ils seront couverts de honte… »'
  rationale: Bien que les formes inaccomplies puissent être ambiguës isolément, le contexte de prière favorise une valeur jussive ou imprécatoire. La traduction préserve ainsi l’appel du psalmiste sans le transformer en simple prédiction.
translation_notes:
  register: Français international actuel, digne et accessible. « En veulent à ma vie » rend l’idiome hébreu de façon naturelle; la succession « couverts de honte », « humiliés » et « déshonorés » conserve la forte accumulation de termes apparentés sans les réduire à une répétition uniforme.
