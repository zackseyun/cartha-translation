source:
  edition: WLC
  text: יְ֭קוּמוּ/ן עֵדֵ֣י חָמָ֑ס אֲשֶׁ֥ר לֹא יָ֝דַ֗עְתִּי יִשְׁאָלֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/011.yaml
  text: Violent witnesses rise up[a]; they ask me about things I do not know.
translation:
  language: fr
  text: Des témoins malveillants se dressent[a] ; ils m’interrogent sur ce que j’ignore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de faux témoins » ou « des témoins violents » ; littéralement, « des témoins de violence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקוּמוּן
  choice: se dressent
  rationale: Le verbe קום décrit ici des témoins hostiles qui se lèvent ou comparaissent contre le psalmiste. « Se dressent » conserve à la fois l’image vive et la nuance d’opposition.
- source_word: עֵדֵי חָמָס
  choice: témoins malveillants
  rationale: L’expression signifie littéralement « témoins de violence ». חָמָס peut désigner la violence, le tort ou l’injustice brutale. « Malveillants » exprime le caractère nuisible et injuste de leur témoignage sans le réduire nécessairement à sa fausseté.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: sur ce que j’ignore
  rationale: Le relatif hébreu n’a pas d’antécédent explicite. Cette formulation française naturelle conserve cette indétermination et rend la déclaration d’ignorance du psalmiste.
- source_word: יִשְׁאָלוּנִי
  choice: ils m’interrogent
  rationale: שׁאל signifie demander ou questionner. Dans ce contexte hostile, « interroger » fait entendre la situation quasi judiciaire sans imposer la nuance plus forte d’un interrogatoire coercitif.
