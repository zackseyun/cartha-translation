    rationale: Le verbe appelle littéralement à faire revenir/rétablir et, dans ce contexte, à délivrer. « Arrache » ajoute l’image d’une extraction forcée, qui n’est pas exprimée dans le texte.
  - severity: medium
    issue: « mon unique bien » est à la fois interprétatif et peu idiomatique.
    rationale: יְחִידָתִי signifie littéralement « mon unique [être/chose] » et fonctionne probablement comme une expression poétique pour la vie unique et précieuse du psalmiste. Le substantif « bien » n’est pas dans la source et risque de suggérer une possession plutôt que la personne ou la vie.
  revised_text: Seigneur, jusqu’à quand regarderas-tu ? Délivre ma vie de leurs ravages, ma vie précieuse des jeunes lions.
