source:
  edition: WLC
  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: fr
  text: Seigneur, jusqu’à quand regarderas-tu ? Délivre ma vie de leurs ravages, ma vie précieuse des jeunes lions.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Correspond au titre divin « Adonaï » dans un français biblique naturel et digne.
- source_word: כַּמָּה תִרְאֶה
  choice: jusqu’à quand regarderas-tu ?
  rationale: Dans cette plainte, l’expression interrogative demande combien de temps Dieu continuera à regarder sans intervenir ; « jusqu’à quand » exprime naturellement cette valeur contextuelle.
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: Arrache ma vie
  rationale: נפשׁי désigne ici la vie ou la personne menacée, plutôt qu’une « âme » opposée au corps. Le verbe peut évoquer le fait de ramener ou de délivrer ; « arrache » rend l’appel pressant au sauvetage.
- source_word: מִשֹּׁאֵיהֶם
  choice: à leurs ravages
  rationale: Le nom rare שֹׁאִים évoque des ravages, une dévastation ou une destruction ; ce choix conserve l’image sans préciser indûment le moyen de l’attaque.
- source_word: יְחִידָתִי
  choice: mon unique bien
  rationale: Le féminin substantivé peut désigner ce que le psalmiste possède d’unique et de précieux, en parallèle avec « ma vie ». Cette formulation conserve la nuance d’unicité sans répéter simplement « ma vie ».
- source_word: מִכְּפִירִים
  choice: aux jeunes lions
  rationale: כפירים désigne de jeunes lions, image poétique des assaillants.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: ma vie
  alternative: mon âme
  rationale: Le contexte est celui d’une menace mortelle et d’une demande de délivrance ; le terme hébreu désigne la vie entière du psalmiste, sans imposer une distinction doctrinale entre âme et corps.
- issue: Rapport entre נַפְשִׁי et יְחִידָתִי
  choice: 'Maintenir deux expressions parallèles : « ma vie » et « mon unique bien »'
  alternative: Traduire les deux comme des désignations identiques de la vie
  rationale: Le parallélisme les rapproche fortement, mais le second terme conserve une nuance propre d’unicité et de valeur précieuse ; la traduction évite de trancher davantage.
translation_notes:
  register: Français moderne, international et soutenu, avec la vigueur d’une supplication poétique. Le futur « regarderas-tu » reproduit naturellement la question de durée, et les images de ravages et de jeunes lions sont conservées.
