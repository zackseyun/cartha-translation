  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: fr
  text: Alors[a], mon âme se réjouira en Yahweh ; elle exultera de son salut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et mon âme se réjouira en Yahweh. »'
