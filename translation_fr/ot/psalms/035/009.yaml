lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Alors, mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la personne ou la vie. « Mon âme » conserve ici l’expression poétique de la joie intérieure. Dans la continuité de la demande formulée au verset précédent, וְ est rendu par « Alors » ; « Et » reste possible.
- source_word: תָּגִיל
  choice: se réjouira
  rationale: Le verbe גיל exprime la joie et l’allégresse. « Se réjouira » est clair, naturel et laisse au second verbe son intensité propre.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב indique ici en qui la joie trouve son objet ou sa sphère. Le nom divin יהוה est transcrit « Yahweh ».
- source_word: תָּשִׂישׂ
  choice: exultera
  rationale: שׂושׂ/שׂישׂ évoque une joie vive et exubérante. « Exultera » préserve l’intensification poétique par rapport à « se réjouira ».
- source_word: בִּישׁוּעָתוֹ
  choice: de son salut
  rationale: יְשׁוּעָה peut désigner le salut ou la délivrance. « Salut » maintient la portée large du terme, tandis que « délivrance » convient particulièrement au contexte du secours face aux ennemis. En français, « exulter de » exprime naturellement le motif de cette joie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; la transcription « Yahweh » préserve le nom propre divin sans le remplacer par un titre.
- issue: Portée de יְשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: « Salut » conserve l’amplitude sémantique et théologique du terme, sans exclure la délivrance concrète demandée dans le psaume ; l’autre possibilité est signalée en note.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme est conservé grâce à « se réjouira » puis « exultera ». « Mon âme » maintient l’image hébraïque tout en restant immédiatement compréhensible.
