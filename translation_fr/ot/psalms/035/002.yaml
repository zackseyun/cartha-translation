  text: הַחֲזֵ֣ק מָגֵ֣ן וְ/צִנָּ֑ה וְ֝/ק֗וּמָ/ה בְּ/עֶזְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/002.yaml
  text: Take hold of shield and buckler[a], and rise up for my help.
translation:
  language: fr
  text: Saisis le bouclier et le grand bouclier[a], et lève-toi pour me secourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux mots différents pour « bouclier »; le second désigne probablement un bouclier plus grand, couvrant davantage le corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: Saisis
  rationale: L’impératif de חזק invite ici Dieu à prendre en main ses armes. « Saisis » est concret, direct et conserve l’image guerrière.
- source_word: מָגֵן
  choice: le bouclier
  rationale: מָגֵן est le terme courant pour désigner un bouclier. Cette traduction simple et naturelle préserve l’image militaire.
- source_word: צִנָּה
  choice: le grand bouclier
  rationale: צִנָּה désigne vraisemblablement un bouclier de grande taille couvrant davantage le corps, distinct du מָגֵן. « Grand bouclier » rend cette différence sans employer le terme français « rondache », qui désigne plutôt un petit bouclier et inverserait probablement le contraste hébreu.
- source_word: וְקוּמָה
  choice: et lève-toi
  rationale: L’impératif de קום, avec hé paragogique, exprime un appel pressant à intervenir. « Lève-toi » est idiomatique en français et convient au contexte guerrier.
- source_word: בְּעֶזְרָתִי
  choice: pour me secourir
  rationale: 'La tournure française verbale rend naturellement le sens de l’expression hébraïque : entrer en action afin d’apporter de l’aide au psalmiste.'
theological_decisions:
- issue: Représentation de Dieu au moyen d’une image guerrière
  choice: Conserver l’image concrète de Dieu saisissant deux boucliers et se levant pour secourir le psalmiste.
  alternative: Atténuer l’image en formulant seulement une demande générale de protection.
  rationale: L’hébreu emploie explicitement un langage militaire et présente Dieu comme un défenseur guerrier. Il convient de préserver cette métaphore plutôt que de la rendre abstraite.
translation_notes:
  register: Français moderne, international et digne. L’impératif « Saisis » garde la vigueur de l’appel, tandis que « pour me secourir » est plus naturel en français actuel que le calque « pour mon aide ». La répétition de « bouclier » est volontaire afin de préserver les deux termes hébreux distincts.
