  text: וַ/אֲנִ֤י בַּ/חֲלוֹתָ֡/ם לְב֬וּשִׁ/י שָׂ֗ק עִנֵּ֣יתִי בַ/צּ֣וֹם נַפְשִׁ֑/י וּ֝/תְפִלָּתִ֗/י עַל חֵיקִ֥/י תָשֽׁוּב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/013.yaml
  text: But as for me[a], when they were sick, my clothing was sackcloth; I humbled myself with fasting[c][b], and my prayer returned to my own bosom.
translation:
  language: fr
  text: Mais moi, quand ils étaient malades, je portais un vêtement de sac[a] ; je me suis humilié par le jeûne[b], et ma prière est revenue dans mon sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sac était une étoffe grossière portée en signe de deuil, de détresse ou d’humiliation.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « j’ai affligé mon âme par le jeûne », expression hébraïque désignant l’humiliation volontaire par le jeûne.'
    reason: lexical_alternative
  - marker: c
    text: Expression hébraïque au sens incertain. Elle peut signifier que sa prière lui revenait sans réponse, que son bienfait lui revenait, ou qu’il priait pour eux comme il aurait prié pour lui-même.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: quand ils étaient malades
  rationale: Le ב suivi de la forme infinitive de חלה avec suffixe de troisième personne du pluriel exprime naturellement la circonstance temporelle de leur maladie.
- source_word: לְבוּשִׁי שָׂק
  choice: j’avais le sac pour vêtement
  rationale: 'Cette formulation française naturelle conserve l’image de la proposition nominale hébraïque : son vêtement était fait de toile de sac, signe de deuil et de détresse.'
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: je m’humiliais par le jeûne
  rationale: Littéralement, le psalmiste « affligeait son être par le jeûne ». La traduction rend l’idiome hébraïque de manière intelligible tout en conservant l’idée d’abaissement volontaire.
- source_word: וּתְפִלָּתִי עַל חֵיקִי תָשׁוּב
  choice: et ma prière revenait sur mon sein
  rationale: La traduction garde l’image hébraïque et l’imparfait français convient à l’action passée décrite dans son déroulement ou sa répétition, sans trancher le sens précis de l’expression.
theological_decisions:
- issue: Sens de « ma prière revenait sur mon sein »
  choice: Conserver dans le texte l’image hébraïque ambiguë.
  alternative: « ma prière me revenait sans réponse » ; « le bienfait de ma prière me revenait » ; « je priais comme pour moi-même »
  rationale: L’expression peut évoquer une prière demeurée sans effet sur les adversaires, un bienfait revenant au psalmiste, ou une intercession aussi fervente que pour lui-même. Le contexte ne permet pas de résoudre sûrement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et l’image finale sont conservés ; les notes explicitent la pratique culturelle et les ambiguïtés réelles sans imposer une lecture confessionnelle.
