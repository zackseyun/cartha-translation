base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: fr
  text: Je me comportais comme envers un ami, comme envers un frère ; je me courbais, sombre[b], comme quelqu’un qui est en deuil de sa mère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « sombre » ou « noirci ». Dans le contexte du deuil, le mot peut évoquer une apparence abattue et assombrie par le chagrin.'
    reason: lexical_alternative
  - marker: c
    text: 'Autre traduction possible : « comme pour le deuil d’une mère » ou « comme celui qui porte le deuil de sa mère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֵעַ כְּאָח לִי
  choice: comme s’il s’agissait d’un ami, comme s’il était mon frère
  rationale: Les deux כְּ marquent des comparaisons parallèles, tandis que לִי exprime la proximité personnelle (« pour moi, à moi »). La formulation française explicite la relation sous-entendue sans réduire l’intimité exprimée par l’hébreu.
- source_word: הִתְהַלָּכְתִּי
  choice: je me comportais
  rationale: Le hitpael de הלך peut décrire ici une manière habituelle d’aller ou de se conduire. « Je me comportais » rend clairement l’attitude du psalmiste dans ce contexte, tout en évitant l’image française peu naturelle de « marcher comme un ami ».
- source_word: כַּאֲבֶל אֵם
  choice: comme celui qui porte le deuil de sa mère
  rationale: אֲבֵל désigne une personne en deuil et אֵם précise ici l’objet de ce deuil. Cette traduction conserve la comparaison distincte avec quelqu’un qui pleure la mort de sa mère.
- source_word: קֹדֵר
  choice: assombri
  rationale: קדר évoque littéralement un état sombre ou noirci et, dans un contexte de deuil, une apparence abattue. « Assombri » conserve l’image source tout en restant compréhensible en français.
- source_word: שַׁחֽוֹתִי
  choice: je me courbais
  rationale: Le verbe exprime une posture abaissée ou courbée sous le poids du chagrin. L’imparfait s’accorde avec l’attitude prolongée décrite dans le verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. La phrase distingue la comparaison avec une personne en deuil (כַּאֲבֶל אֵם) de l’état assombri exprimé par קֹדֵר, conformément à la syntaxe hébraïque, tout en rendant idiomatiquement la relation personnelle du premier hémistiche.
