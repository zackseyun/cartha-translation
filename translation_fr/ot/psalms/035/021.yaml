  text: They opened their mouths wide against me; they said[a], “Aha, aha! Our eyes have seen it!”
translation:
  language: fr
  text: 'Ils ont ouvert grand la bouche contre moi ; ils ont dit[a] : « Ah ! Ah ! Nos yeux l’ont vu ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « notre œil a vu ». L’hébreu emploie un verbe au singulier avec l’expression collective « nos yeux » ; l’objet de « vu » est sous-entendu.'
    reason: Précise la construction collective de l’hébreu et l’objet implicite, conformément à l’audit lexical, sans modifier le sens.
lexical_decisions:
- source_word: וַיַּרְחִיבוּ
  choice: ouvrent grand
  rationale: Le hiphil de רחב signifie littéralement « élargir ». Avec « bouche », « ouvrir grand » conserve l’image concrète et exprime naturellement la jubilation hostile.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte de paroles hostiles, עַל marque l’opposition plutôt qu’une relation spatiale.
- source_word: פִּיהֶם
  choice: la bouche
  rationale: L’hébreu emploie le singulier collectif « leur bouche ». Le français peut naturellement conserver ce collectif avec un sujet pluriel.
- source_word: הֶאָח הֶאָח
  choice: Ah ! Ah !
  rationale: L’interjection répétée exprime ici une satisfaction malveillante. « Ah ! Ah ! » est idiomatique en français et préserve la répétition.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Nos yeux l’ont vu
  rationale: La tournure hébraïque est littéralement « notre œil a vu », avec un nom collectif et un verbe au singulier. Le pluriel est plus naturel en français ; « l’ » explicite sobrement l’objet implicite.
