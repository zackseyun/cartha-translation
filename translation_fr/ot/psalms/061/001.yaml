  text: שִׁמְעָ֣/ה אֱ֭לֹהִים רִנָּתִ֑/י הַ֝קְשִׁ֗יבָ/ה תְּפִלָּתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/001.yaml
  text: Hear my cry[a], O God; listen to my prayer.
translation:
  language: fr
  text: Écoute mon cri[a], ô Dieu ! Prête attention à ma prière !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon cri retentissant » ou « mon appel pressant ». Le nom hébreu peut désigner un grand cri et, dans certains contextes, un cri ou un chant de joie ; ici, le contexte de prière favorise l’idée d’un appel urgent.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Écoute
  rationale: Impératif qal de שׁמע adressé à Dieu. « Écoute » est direct, naturel en français moderne et conserve l’image concrète de l’audition.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé comme vocatif. « ô Dieu » marque clairement l’invocation dans un registre digne et actuel.
- source_word: רִנָּתִי
  choice: mon cri
  rationale: רִנָּה peut désigner un cri retentissant, un appel pressant ou, selon le contexte, un cri ou chant de joie. Son parallélisme avec « ma prière » favorise ici le sens d’un appel urgent.
- source_word: הַקְשִׁיבָה
  choice: Prête attention à
  rationale: L’impératif hiphil de קשׁב demande une écoute attentive. « Prête attention à » maintient la nuance d’attention renforcée par rapport au premier impératif, sans archaïsme.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Traduction directe du terme courant désignant la prière; elle préserve le parallélisme avec « mon cri ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, avec une légère intensification entre « Écoute » et « Prête attention à ».
