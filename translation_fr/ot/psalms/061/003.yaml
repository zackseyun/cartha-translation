  text: Car tu as été pour moi un refuge, une tour fortifiée face à l’ennemi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְסֶה
  choice: refuge
  rationale: Le terme désigne un abri ou un lieu de protection; « refuge » est naturel et fidèle en français.
- source_word: מִגְדַּל עֹז
  choice: tour fortifiée
  rationale: Littéralement « tour de force/puissance »; l’expression évoque une tour offrant une solide protection. « Tour fortifiée » restitue cette image sans suggérer simplement une grande puissance abstraite.
- source_word: מִפְּנֵי אוֹיֵב
  choice: face à l’ennemi
  rationale: La préposition peut exprimer la protection « loin de/devant » l’ennemi. « Face à l’ennemi » préserve l’idée d’un abri protecteur dans la confrontation, sans préciser indûment une direction spatiale.
