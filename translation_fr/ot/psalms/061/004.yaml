  yaml_path: translation/ot/psalms/061/004.yaml
  text: Let me dwell in your tent forever[a]; let me take refuge in the shelter of your wings[b]. Selah
translation:
  language: fr
  text: Que j’habite dans ta tente pour toujours[a] ! Que je trouve refuge à l’abri de tes ailes[b] ! Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « J’habiterai dans ta tente pour toujours » ou « Puissé-je habiter dans ta tente pour toujours ». La forme hébraïque exprime un souhait fervent ou une ferme résolution.'
    reason: lexical_alternative
  - marker: b
    text: L’image des ailes évoque un refuge protecteur. La « tente » de la première phrase peut, quant à elle, faire penser au sanctuaire ou à la demeure de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: אָגוּרָה
  choice: Que j’habite
  rationale: Le cohortatif qal à la première personne exprime ici un souhait ou une résolution. « Que j’habite » rend naturellement cette valeur volitive ; « je demeurerai » reste possible.
- source_word: בְאָהָלְךָ
  choice: dans ta tente
  rationale: אָהֶל désigne concrètement une tente. L’expression peut évoquer le sanctuaire et la présence de Dieu, mais conserver l’image évite de préciser excessivement son référent.
- source_word: עוֹלָמִים
  choice: pour toujours
  rationale: Le pluriel idiomatique intensifie l’idée de durée ; « pour toujours » est clair et naturel en français moderne.
- source_word: אֶחֱסֶה
  choice: Que je trouve refuge
  rationale: Le verbe חסה signifie chercher ou trouver refuge. Dans le parallélisme avec le cohortatif précédent, la formulation volitive convient, sans exclure entièrement une lecture comme résolution future.
- source_word: בְסֵתֶר
  choice: à l’abri
  rationale: סֵתֶר évoque un lieu caché qui protège. « À l’abri » restitue de façon concise les idées de protection et de couverture.
- source_word: כְּנָפֶיךָ
  choice: de tes ailes
  rationale: 'La traduction conserve l’image concrète des ailes et la relation syntaxique avec סֵתֶר : « à l’abri de tes ailes ».'
- source_word: סֶּלָה
  choice: Sèla
  rationale: Le sens précis de ce terme liturgique ou musical demeure incertain ; il est donc translittéré plutôt que traduit conjecturalement.
theological_decisions:
- issue: Image de la tente divine
  choice: Conserver « ta tente »
  alternative: « ton sanctuaire » ou « ta demeure »
  rationale: La tente peut désigner ou évoquer le sanctuaire, la présence de Dieu, voire sa demeure, mais le texte garde une image concrète qu’il convient de ne pas résoudre en une interprétation unique.
- issue: Valeur des formes verbales
  choice: Exprimer une prière par « Que j’habite… Que je trouve refuge… »
  alternative: « J’habiterai… je trouverai refuge… »
  rationale: Le premier verbe est explicitement cohortatif et le second peut être compris dans son prolongement. La note maintient toutefois la tension entre souhait et ferme résolution.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé par deux propositions volitives. « Tente » et « ailes » maintiennent les métaphores concrètes de l’hébreu ; « Sèla » préserve le marqueur dont le sens exact est incertain.
