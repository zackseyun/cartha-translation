base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: fr
  text: Du bout de la terre, je crie vers toi quand mon cœur défaille[a] ; conduis-moi vers un rocher plus haut que moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand mon cœur est accablé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vers un rocher trop haut pour moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: Du bout de la terre
  rationale: קָצֶה désigne l’extrémité ou le bout. « Du bout de la terre » conserve l’image poétique de l’éloignement extrême et sonne naturellement en français.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: je crie vers toi
  rationale: קרא peut signifier appeler ou crier. Dans cette prière pressante, « je crie vers toi » exprime l’appel adressé à Dieu sans ajouter d’interprétation.
- source_word: בַּעֲטֹף לִבִּי
  choice: quand mon cœur défaille
  rationale: עטף évoque ici l’affaiblissement ou l’accablement intérieur. « Mon cœur défaille » garde l’image hébraïque du cœur dont les forces cèdent.
- source_word: בְּצוּר
  choice: sur un rocher
  rationale: צוּר est le terme concret « rocher ». Avec le verbe de conduite, « conduis-moi sur un rocher » rend naturellement en français l’idée d’être mené jusqu’à une hauteur sûre.
- source_word: יָרוּם מִמֶּנִּי
  choice: plus haut que moi
  rationale: רוּם exprime la hauteur, et מִמֶּנִּי permet une comparaison. Cette formulation préserve le sens formel sans imposer l’interprétation possible « trop haut pour moi ».
- source_word: תַנְחֵנִי
  choice: conduis-moi
  rationale: Le hiphil de נחה signifie conduire ou guider. « Conduis-moi » convient à la demande dépendante du psalmiste et s’accorde avec la destination exprimée.
theological_decisions:
- issue: Portée métaphorique du « rocher »
  choice: Conserver « rocher » sans expliciter la métaphore dans le texte principal.
  alternative: Rendre par « refuge » ou « lieu sûr ».
  rationale: L’hébreu emploie l’image concrète צוּר. La maintenir préserve la poésie et sa résonance théologique sans identifier ou expliquer prématurément le rocher.
- issue: Sens de יָרוּם מִמֶּנִּי
  choice: « plus haut que moi »
  alternative: « trop haut pour moi »
  rationale: La construction peut être comprise comme une simple comparaison de hauteur ou comme indiquant une hauteur inaccessible au psalmiste. Le texte principal retient la comparaison la moins interprétative, tandis que la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. « Du bout de la terre » et « mon cœur défaille » conservent les images du texte hébreu tout en restant intelligibles. Les deux ambiguïtés lexicales importantes sont signalées en notes.
