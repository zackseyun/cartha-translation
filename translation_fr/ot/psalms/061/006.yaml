id: PSA.61.6
reference: Psalms 61:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: fr
  text: Ajoute des jours aux jours du roi[a] ! Que ses années durent de génération en génération[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Tu ajouteras des jours aux jours du roi ; ses années dureront de génération en génération. » La forme verbale hébraïque peut exprimer une affirmation au futur plutôt qu’une prière.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « comme génération et génération », expression qui évoque la succession continue des générations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: des jours aux jours du roi
  rationale: Cette formulation conserve l’image hébraïque de jours ajoutés aux jours, tout en restant compréhensible en français et en maintenant le parallèle avec « ses années ».
- source_word: תּוֹסִיף
  choice: Ajoute
  rationale: L’imparfait hiphil à la deuxième personne du masculin singulier est compris ici comme une demande adressée à Dieu, conformément au contexte de prière. L’impératif français exprime naturellement cette valeur volitive.
- source_word: שְׁנוֹתָיו
  choice: ses années
  rationale: Le suffixe masculin singulier renvoie naturellement au roi.
- source_word: כְּמוֹ דֹר וָדֹר
  choice: durent de génération en génération
  rationale: L’expression répétitive désigne une succession continue de générations. Le verbe « durent », explicité en français, rend la portée temporelle de la comparaison sans imposer une durée métaphysique.
theological_decisions:
- issue: Prière pour la longévité du roi ou affirmation au futur
  choice: 'Lecture volitive : « Ajoute… ! Que… durent… ! »'
  alternative: 'Lecture déclarative : « Tu ajouteras… ; ses années dureront… »'
  rationale: La forme verbale permet une lecture au futur, mais le contexte de supplication favorise une demande. L’autre possibilité est conservée en note afin de ne pas supprimer l’ambiguïté de l’hébreu.
- issue: Portée de « de génération en génération »
  choice: Souhait poétique d’une durée se prolongeant à travers les générations
  alternative: Longévité individuelle littéralement égale à plusieurs générations
  rationale: La traduction garde l’expression biblique sans préciser artificiellement si elle concerne la personne du roi, sa dynastie ou une espérance royale plus large.
translation_notes:
  register: Français moderne, digne et poétique. La répétition « des jours aux jours » est volontairement conservée pour refléter l’expression hébraïque. Les deux propositions sont rendues comme une prière, avec l’ambiguïté temporelle signalée en note.
