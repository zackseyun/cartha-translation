id: PSA.61.7
reference: Psalms 61:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵשֵׁ֣ב ע֭וֹלָם לִ/פְנֵ֣י אֱלֹהִ֑ים חֶ֥סֶד וֶ֝/אֱמֶ֗ת מַ֣ן יִנְצְרֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: fr
  text: Qu’il siège pour toujours devant Dieu[a] ! Charge l’amour fidèle et la vérité[b] de le garder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Qu’il demeure pour toujours en présence de Dieu ». Le verbe peut signifier « s’asseoir », « demeurer » ou « siéger » ; dans ce contexte royal, « siéger » peut évoquer l’exercice durable de la royauté.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « vérité » peut aussi signifier « fidélité ». L’expression « amour fidèle et vérité / fidélité » évoque la loyauté constante et la fiabilité de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Qu’il siège
  rationale: 'L’imparfait qal de ישב peut signifier « s’asseoir », « demeurer » ou, dans un contexte royal, « siéger ». Le contexte de prière et l’impératif du second membre favorisent ici une valeur de souhait : « Qu’il siège ».'
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Cette expression française courante rend naturellement l’idée de durée indéfinie et durable portée par עוֹלָם.
- source_word: לִפְנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: La traduction concise conserve l’idée de présence et de vie ou de règne sous le regard de Dieu.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: חֶסֶד désigne souvent un amour loyal, constant et engagé. « Amour fidèle » exprime à la fois l’affection et la loyauté sans ajouter explicitement le mot « alliance ».
- source_word: אֱמֶת
  choice: la vérité
  rationale: אֱמֶת peut désigner la vérité, la fidélité ou la fiabilité. « Vérité » maintient la transparence lexicale, tandis qu’une note signale l’autre sens contextuellement fort.
- source_word: מַן
  choice: Charge … de
  rationale: La forme est comprise comme un impératif demandant à Dieu d’assigner une fonction aux qualités personnifiées qui suivent. La tournure française « charger de » transmet cette idée de mission avec naturel.
- source_word: יִנְצְרֻהוּ
  choice: le garder
  rationale: נצר signifie garder, protéger ou préserver. Le verbe pluriel présente l’amour fidèle et la vérité comme les agents personnifiés de la protection du roi.
theological_decisions:
- issue: Valeur de l’imparfait dans cette prière royale
  choice: 'Souhait ou prière : « Qu’il siège »'
  alternative: 'Déclaration au futur : « Il siégera »'
  rationale: Le contexte est celui d’une requête, et le second membre comporte un impératif adressé à Dieu. Le souhait assure donc la cohérence de l’ensemble, tout en laissant l’ambiguïté lexicale de ישב dans une note.
- issue: Sens du couple חֶסֶד וֶאֱמֶת
  choice: « l’amour fidèle et la vérité » comme qualités divines personnifiées
  alternative: « l’amour fidèle et la fidélité » ou « la bonté et la vérité »
  rationale: Ce couple exprime souvent la loyauté constante et la fiabilité de Dieu. Le texte principal conserve « vérité », sens direct de אֱמֶת, et la note présente « fidélité », sens particulièrement pertinent ici.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste concise, conserve la structure de prière du verset et rend perceptible la personnification des deux qualités divines.
