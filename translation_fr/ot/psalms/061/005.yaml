id: PSA.61.5
reference: Psalms 61:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: fr
  text: Car toi, ô Dieu, tu as entendu mes vœux ; tu as donné[a] l’héritage de ceux qui craignent ton nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas à qui cet héritage a été donné. D’après le contexte, on peut aussi comprendre : « tu m’as donné l’héritage de ceux qui craignent ton nom ».'
    reason: alternative_reading
  - marker: b
    text: « Craindre ton nom » signifie vivre dans une crainte respectueuse de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la prière ou l’assurance exprimée dans le contexte précédent.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le contexte à la deuxième personne indique une adresse directe ; « ô Dieu » rend naturellement ce vocatif dans une prière solennelle.
- source_word: שָׁמַעְתָּ
  choice: tu as entendu
  rationale: Le parfait présente ici une action accomplie dont les effets demeurent pertinents dans la prière.
- source_word: לִנְדָרָי
  choice: mes vœux
  rationale: נדר désigne normalement des engagements solennels pris envers Dieu, plutôt que les offrandes qui peuvent les accompagner.
- source_word: נָתַתָּ
  choice: tu as donné
  rationale: Rend directement le parfait hébreu comme une action accomplie, sans ajouter dans le texte principal un destinataire absent de l’hébreu.
- source_word: יְרֻשַּׁת
  choice: l’héritage
  rationale: Le terme désigne un bien reçu en héritage ou une possession transmise ; « héritage » conserve cette portée sans l’expliciter davantage.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: ceux qui craignent ton nom
  rationale: Cette formulation transparente conserve le poids biblique de la crainte révérencielle et le lien explicite avec le nom de Dieu.
theological_decisions:
- issue: Sens de נָתַתָּ יְרֻשַּׁת יִרְאֵי שְׁמֶךָ
  choice: tu as donné l’héritage de ceux qui craignent ton nom
  alternative: tu m’as donné l’héritage de ceux qui craignent ton nom
  rationale: L’hébreu ne comporte aucun complément indirect équivalant à « me ». Le texte principal conserve donc cette absence, tandis que la possibilité de sous-entendre le psalmiste comme bénéficiaire est signalée en note.
- issue: Portée de « craindre le nom » de Dieu
  choice: conserver l’expression dans le texte et l’expliquer en note
  alternative: ceux qui révèrent ton nom
  rationale: « Craindre » préserve la force théologique de ירא, tandis que la note empêche de réduire cette crainte à la simple terreur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique reste proche de l’hébreu, notamment dans la dernière proposition, afin de ne pas ajouter silencieusement un destinataire.
