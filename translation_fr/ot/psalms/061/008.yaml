  text: כֵּ֤ן אֲזַמְּרָ֣ה שִׁמְ/ךָ֣ לָ/עַ֑ד לְֽ/שַׁלְּמִ֥/י נְדָרַ֗/י י֣וֹם יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/008.yaml
  text: So I will sing praise to your name forever[a], to fulfill my vows day by day.
translation:
  language: fr
  text: Ainsi, je chanterai les louanges de ton nom pour toujours, pour accomplir mes vœux jour après jour.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour m’acquitter de mes vœux jour après jour ». Le verbe hébreu peut signifier « accomplir » ou « s’acquitter de » lorsqu’il se rapporte à des vœux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: Marque ici la conséquence ou la résolution qui découle de la prière et de la confiance exprimées auparavant.
- source_word: אֲזַמְּרָה
  choice: je célébrerai
  rationale: Le piel de זמר désigne couramment le chant de louange, avec une possible dimension musicale. « Célébrer » exprime naturellement en français l’action de louer par le chant.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Rend directement l’expression hébraïque, qui peut aussi évoquer la personne telle qu’elle se révèle, son caractère et sa réputation.
- source_word: לָעַד
  choice: pour toujours
  rationale: Exprime la durée indéfinie ou perpétuelle dans une formulation française courante.
- source_word: לְשַׁלְּמִי
  choice: j’accomplirai
  rationale: Le piel de שלם, avec des vœux pour objet, signifie s’en acquitter, les payer ou les accomplir. « Accomplir ses vœux » est clair et idiomatique en français.
- source_word: נְדָרַי
  choice: mes vœux
  rationale: Traduction directe du terme usuel désignant des engagements solennels pris envers Dieu.
- source_word: יוֹם יוֹם
  choice: jour après jour
  rationale: La répétition du nom « jour » exprime une régularité continue; cette tournure en restitue naturellement la force itérative.
theological_decisions:
- issue: Rapport syntaxique de לְשַׁלְּמִי avec la louange perpétuelle
  choice: 'Coordination explicite : « et j’accomplirai »'
  alternative: 'Valeur finale : « afin d’accomplir » ou « pour accomplir »'
  rationale: L’infinitif préfixé par לְ peut exprimer le but, mais dans ce contexte il présente aussi l’acquittement régulier des vœux comme l’action qui accompagne et concrétise la louange. La coordination produit un français naturel sans imposer que l’accomplissement des vœux soit la seule finalité du chant.
translation_notes:
  register: Français moderne, international et digne. « Je célébrerai ton nom » conserve le registre poétique et cultuel sans archaïsme; « jour après jour » restitue la répétition hébraïque de façon idiomatique.
