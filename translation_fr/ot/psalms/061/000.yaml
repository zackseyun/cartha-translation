  text: לַ/מְנַצֵּ֬חַ עַֽל נְגִינַ֬ת לְ/דָוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/000.yaml
  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: fr
  text: Au chef de chœur, avec des instruments à cordes. De David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par David » ou « Pour David » ; la construction hébraïque peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. Cette formulation est claire et naturelle en français moderne.
- source_word: עַל
  choice: avec
  rationale: Dans ce contexte musical, la préposition introduit probablement le type d’accompagnement; « avec » l’exprime naturellement sans imposer le sens littéral « sur ».
- source_word: נְגִינַת
  choice: des instruments à cordes
  rationale: Le terme renvoie à la musique produite par des cordes ou à un accompagnement de cordes. La formulation retenue est idiomatique et convient au contexte liturgique.
- source_word: לְדָוִד
  choice: De David
  rationale: Le lamed des titres de psaumes peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette souplesse que « Par David ».
theological_decisions:
- issue: Valeur du lamed dans la mention davidique
  choice: De David
  alternative: Par David ou Pour David
  rationale: L’hébreu ne tranche pas à lui seul entre attribution d’auteur, association et dédicace. La traduction préserve cette ambiguïté au lieu d’affirmer une conclusion historique plus précise.
translation_notes:
  register: Français international moderne, sobre et digne. Le titre conserve sa forme concise et sa terminologie musicale, tout en signalant l’ambiguïté réelle de la mention davidique.
