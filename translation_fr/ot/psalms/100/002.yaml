id: PSA.100.2
reference: Psalms 100:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: fr
  text: Servez Yahweh avec joie ; venez devant lui avec des cris d’allégresse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en chantant avec allégresse » ; le terme hébreu peut désigner une louange jubilante exprimée par des cris ou par le chant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Servez
  rationale: L’impératif pluriel de עבד, employé à propos de Yahweh, exprime le service qui lui est dû, avec une dimension de dévouement et d’adoration. « Servez » conserve cette ampleur sans réduire le sens au seul culte liturgique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit « Yahweh » afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּשִׂמְחָה
  choice: avec joie
  rationale: La préposition ב indique ici la manière ou l’état dans lequel le service est rendu. « Avec joie » est naturel en français et rend directement שִׂמְחָה.
- source_word: בֹּאוּ
  choice: venez
  rationale: L’impératif pluriel de בוא signifie largement « venir ». Ce choix évite de préciser une entrée dans le sanctuaire, notion qui n’est pas explicite dans ce verset pris isolément.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « devant sa face » et, par extension, « en sa présence ». « Devant lui » reste concis, idiomatique et proche de la formulation hébraïque.
- source_word: בִּרְנָנָה
  choice: avec des cris d’allégresse
  rationale: רְנָנָה peut désigner une acclamation retentissante, un cri jubilant ou un chant d’exultation. « Des cris d’allégresse » conserve le caractère vocal et exubérant du terme sans exclure qu’ils soient chantés.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » représente le nom divin dans le texte français et évite de le remplacer par un titre.
- issue: Portée cultuelle de עִבְדוּ
  choice: Servez
  alternative: Adorez
  rationale: Le contexte est cultuel, mais le verbe עבד possède une portée plus large que l’acte d’adoration seul. « Servez » préserve cette tension entre service, obéissance dévouée et culte.
translation_notes:
  register: Français international moderne, simple et digne. Les deux impératifs pluriels sont conservés. « Cris d’allégresse » restitue l’intensité sonore de רְנָנָה, tandis que la note maintient l’ambiguïté entre acclamation et chant.
