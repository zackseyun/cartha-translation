id: PSA.100.1
reference: Psalms 100:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/001.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: fr
  text: Psaume pour l’action de grâce[a]. Acclamez Yahweh avec joie, terre entière !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le titre peut aussi se comprendre : « Psaume pour une offrande de reconnaissance » ou « Psaume d’action de grâce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Dans les titres, ce nom désigne couramment un psaume ou un chant accompagné; « Psaume » est ici l’équivalent français établi et naturel.
- source_word: לְתוֹדָה
  choice: pour l’action de grâce
  rationale: תּוֹדָה peut désigner l’action de grâce, la louange reconnaissante ou une offrande de reconnaissance. « Pour l’action de grâce » reflète la préposition לְ sans imposer un cadre sacrificiel précis.
- source_word: הָרִיעוּ
  choice: Acclamez avec joie
  rationale: L’impératif hiphil de רוע appelle une manifestation sonore et publique, ici dans un contexte de joie. « Acclamez avec joie » est idiomatique et conserve la force de l’appel.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit « Yahweh »; la préposition ל dirige l’acclamation vers lui. En français, le complément direct du verbe « acclamer » rend naturellement cette relation.
- source_word: כָּל־הָאָרֶץ
  choice: terre entière
  rationale: Dans cet appel universel, אֶרֶץ désigne la terre plutôt qu’un territoire particulier. L’apostrophe « terre entière » restitue naturellement le vocatif hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération préserve le nom propre sans le remplacer par un titre.
- issue: Portée de תּוֹדָה dans le titre
  choice: action de grâce
  alternative: offrande de reconnaissance
  rationale: Le terme admet un sens cultuel sacrificiel, mais le titre ne permet pas de trancher avec certitude. Le texte principal garde le sens plus large et une note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et oral. L’impératif pluriel et l’apostrophe finale conservent l’élan liturgique du verset; « terre entière » évite la tournure plus lourde « toute la terre » après l’impératif.
