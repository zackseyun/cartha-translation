id: PSA.100.5
reference: Psalms 100:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי ט֣וֹב יְ֭הֹוָה לְ/עוֹלָ֣ם חַסְדּ֑/וֹ וְ/עַד דֹּ֥ר וָ֝/דֹ֗ר אֱמוּנָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: fr
  text: Car Yahweh est bon ; son amour fidèle dure pour toujours, et sa fidélité demeure de génération en génération.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison des appels à louer et à servir Yahweh dans les versets précédents.
- source_word: טוֹב
  choice: bon
  rationale: Rend directement la bonté morale et bienfaisante exprimée par l’adjectif hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: Exprime naturellement en français la durée illimitée ; le verbe « dure », implicite dans la proposition nominale hébraïque, est explicité.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: Réunit les idées d’amour, de loyauté et de constance portées par חֶסֶד sans réduire le terme à la seule miséricorde ni imposer explicitement une catégorie doctrinale.
- source_word: וְעַד דֹּר וָדֹר
  choice: et … de génération en génération
  rationale: Rend l’extension de la fidélité divine à travers la succession des générations dans un idiome français naturel.
- source_word: אֱמוּנָתוֹ
  choice: sa fidélité
  rationale: Exprime la fiabilité, la fermeté et la constance de Dieu, en parallèle avec son amour fidèle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa transcription préserve cette donnée au lieu de la remplacer par un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: bonté / miséricorde / fidélité à l’alliance
  rationale: « Amour fidèle » conserve ensemble les dimensions affective, bienveillante et loyale du terme, sans en enfermer le sens dans une seule nuance.
- issue: Verbe absent dans les propositions nominales
  choice: Expliciter « dure » dans la première proposition seulement
  alternative: Répéter « dure » devant « de génération en génération »
  rationale: L’hébreu juxtapose des propositions sans verbe exprimé. Le français exige une articulation plus explicite ; le même verbe se comprend par ellipse dans le second membre, ce qui garde la concision et le parallélisme.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en valeur les trois affirmations parallèles. « De génération en génération » est préféré à un calque tel que « jusqu’à génération et génération », peu naturel en français.
