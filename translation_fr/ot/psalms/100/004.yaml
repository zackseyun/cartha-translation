id: PSA.100.4
reference: Psalms 100:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֹּ֤אוּ שְׁעָרָ֨י/ו בְּ/תוֹדָ֗ה חֲצֵרֹתָ֥י/ו בִּ/תְהִלָּ֑ה הֽוֹדוּ ל֝֗/וֹ בָּרֲכ֥וּ שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/004.yaml
  text: Enter his gates with thanksgiving[a], his courts with praise; give thanks to him; bless his name.
translation:
  language: fr
  text: Entrez par ses portes avec des actions de grâce[a], dans ses parvis avec des louanges ; rendez-lui grâce, bénissez son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une offrande de reconnaissance ». Le mot hébreu peut désigner soit l’action de grâce, soit une offrande exprimant la reconnaissance, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: Entrez
  rationale: Impératif pluriel de בוא. Avec les portes et les parvis, « Entrez » exprime naturellement le mouvement vers l’espace de culte.
- source_word: שְׁעָרָיו
  choice: par ses portes
  rationale: Le nom désigne les portes donnant accès à une ville ou au sanctuaire. En français, « entrer par ses portes » est plus idiomatique que « entrer dans ses portes ».
- source_word: בְּתוֹדָה
  choice: avec des actions de grâce
  rationale: תּוֹדָה peut désigner la reconnaissance exprimée envers Dieu ou une offrande de reconnaissance. Le parallèle avec la louange favorise ici le sens abstrait, sans exclure l’autre sens, signalé en note.
- source_word: חֲצֵרֹתָיו
  choice: dans ses parvis
  rationale: Le terme désigne les cours du sanctuaire. « Parvis » conserve clairement et avec dignité l’image cultuelle.
- source_word: בִּתְהִלָּה
  choice: avec des louanges
  rationale: תְּהִלָּה désigne la louange. Le pluriel français est naturel ici et maintient le parallélisme avec « des actions de grâce ».
- source_word: הוֹדוּ לוֹ
  choice: rendez-lui grâce
  rationale: Dans ce contexte de culte, le hifil de ידה signifie remercier ou rendre grâce. Cette formulation française garde le lien lexical et thématique avec « actions de grâce ».
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: L’impératif de ברך est rendu directement par « bénissez », ce qui le distingue de la louange déjà mentionnée.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: Traduction directe de l’expression hébraïque, où le nom représente l’identité révélée et la réputation de Dieu.
theological_decisions:
- issue: Imagerie cultuelle des portes et des parvis
  choice: Conserver littéralement les portes et les parvis du sanctuaire.
  alternative: Généraliser en parlant de la présence ou de la maison de Dieu.
  rationale: L’hébreu évoque explicitement l’entrée des adorateurs dans l’enceinte sacrée. Garder cette image évite d’introduire une abstraction théologique absente du verset.
- issue: Sens de תּוֹדָה
  choice: Retenir dans le texte le sens abstrait d’« actions de grâce » tout en signalant le sens sacrificiel en note.
  alternative: Traduire directement par « offrande de reconnaissance ».
  rationale: Le parallélisme avec « louanges » soutient le sens abstrait, mais le terme hébreu peut aussi nommer une offrande de reconnaissance ; la note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé, avec une ellipse naturelle dans « dans ses parvis ». « Parvis » maintient l’ancrage dans le sanctuaire sans explicitation supplémentaire.
