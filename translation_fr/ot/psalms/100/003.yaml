id: PSA.100.3
reference: Psalms 100:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: fr
  text: Sachez que Yahvé, c’est lui qui est Dieu. C’est lui qui nous a faits, et non pas nous-mêmes[a] ; nous sommes son peuple et les brebis de son pâturage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la lecture marginale traditionnelle : « Il nous a faits, et nous sommes à lui. »'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Sachez
  rationale: L’impératif pluriel de ידע appelle les auditeurs à reconnaître et à tenir pour certaine cette vérité. « Sachez » est direct, naturel et solennel.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qu’il faut savoir ; « que » convient naturellement après « Sachez ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin יהוה au lieu de lui substituer un titre.
- source_word: הוּא אֱלֹהִים
  choice: c’est lui qui est Dieu
  rationale: La tournure disloquée rend l’insistance portée par le pronom הוּא sans ajouter explicitement « seul », absent de l’hébreu.
- source_word: הוּא עָשָׂנוּ
  choice: C’est lui qui nous a faits
  rationale: La reprise de « c’est lui » conserve l’emphase du pronom hébreu et עשה est rendu simplement par « faire ».
- source_word: וְלֹא אֲנַחְנוּ
  choice: et non pas nous-mêmes
  rationale: 'Cette formulation suit le texte consonantique לא, « non », et conserve son contraste marqué : Dieu nous a faits, pas nous-mêmes.'
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Traduction directe de la désignation collective et relationnelle עַמּוֹ.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: et les brebis de son pâturage
  rationale: Cette traduction préserve l’image pastorale ainsi que la correspondance entre צֹאן et מַרְעִית.
theological_decisions:
- issue: Lecture ketiv/qere au milieu du verset
  choice: 'Le texte principal suit le ketiv לא : « C’est lui qui nous a faits, et non pas nous-mêmes. »'
  alternative: 'Suivre le qere לו : « Il nous a faits, et nous sommes à lui. »'
  rationale: Le texte consonantique porte לא, « non », tandis que la lecture marginale traditionnelle porte לו, « à lui ». Les deux lectures étant anciennes et cohérentes, le ketiv est maintenu dans le texte principal et le qere est signalé en note afin de préserver la tension textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La construction « c’est lui qui » rend l’emphase hébraïque sans introduire une affirmation supplémentaire. Le vocabulaire pastoral traditionnel est conservé.
