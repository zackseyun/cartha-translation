  text: מִזְמ֥וֹר לְ/תוֹדָ֑ה הָרִ֥יעוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/000.yaml
  text: A psalm for thanksgiving[a]. Shout joyfully to Yahweh[d][c][b], all the earth.
translation:
  language: fr
  text: 'Psaume pour l’action de grâce[a].


    Acclamez Yahvé, toute la terre !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le titre hébreu peut aussi se comprendre : « Psaume pour une offrande de reconnaissance » ou « Psaume d’action de grâce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Équivalent français établi pour désigner un chant accompagné de musique dans les titres du Psautier.
- source_word: לְתוֹדָה
  choice: pour l’action de grâce
  rationale: Le לְ exprime naturellement ici la destination ou l’usage; תּוֹדָה peut désigner l’action de grâce, mais aussi une offrande ou un sacrifice de reconnaissance, ambiguïté signalée en note.
- source_word: הָרִיעוּ
  choice: Poussez des cris de joie
  rationale: L’impératif désigne une acclamation forte et publique; cette formulation française garde à la fois l’intensité sonore et la tonalité joyeuse du contexte.
- source_word: לַיהוָה
  choice: en l’honneur de Yahvé
  rationale: La préposition לְ marque le destinataire de l’acclamation; « en l’honneur de » est naturel en français et évite de suggérer que les cris sont dirigés physiquement vers Dieu.
- source_word: כָּל־הָאָרֶץ
  choice: terre entière
  rationale: Apostrophe idiomatique qui conserve la portée universelle de l’hébreu; selon le contexte, אֶרֶץ peut aussi évoquer tous les habitants de la terre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin; « Yahvé » le représente explicitement en français sans le remplacer par un titre. La vocalisation ancienne exacte demeure incertaine.
- issue: Sens cultuel possible de לְתוֹדָה
  choice: pour l’action de grâce
  alternative: pour une offrande de reconnaissance
  rationale: Le titre peut indiquer soit le thème ou l’usage du psaume, soit son emploi lors d’un sacrifice de reconnaissance. Le texte principal garde le sens général et la note préserve la lecture cultuelle.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le titre reste concis; l’impératif emploie une expression française courante qui restitue l’acclamation collective et joyeuse.
