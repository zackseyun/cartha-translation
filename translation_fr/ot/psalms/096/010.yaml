id: PSA.96.10
reference: Psalms 96:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: fr
  text: 'Dites parmi les nations : « Yahweh règne[a] ! Oui, le monde[b] est solidement établi, il ne vacillera pas. Il jugera les peuples avec équité[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh est roi », ou « Yahweh est devenu roi ». L’hébreu peut proclamer sa royauté présente ou son accession au trône.
    reason: alternative_reading
  - marker: b
    text: Ou « le monde habité ».
    reason: lexical_alternative
  - marker: c
    text: Ou « avec droiture », ou « avec justice ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ בַגּוֹיִם
  choice: Dites parmi les nations
  rationale: L’impératif pluriel appelle à annoncer publiquement ce message au milieu des nations. « Dites » reste simple et direct, tandis que « parmi les nations » conserve la valeur locative de ב.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: מָלָךְ
  choice: règne
  rationale: Dans cette proclamation royale, le qatal peut exprimer la royauté présente de Yahweh. « Règne » est naturel en français et n’impose pas l’idée que sa royauté vient seulement de commencer.
- source_word: אַף
  choice: Oui
  rationale: La particule renforce et confirme la proclamation précédente. « Oui » restitue brièvement cette valeur emphatique.
- source_word: תִּכּוֹן תֵּבֵל
  choice: le monde est solidement établi
  rationale: Le nifal de כון exprime un état de fermeté résultant, et תֵּבֵל désigne le monde, souvent envisagé comme monde habité.
- source_word: בַּל תִּמּוֹט
  choice: il ne vacillera pas
  rationale: Le verbe מוט évoque la perte de stabilité. « Ne vacillera pas » rend cette image avec une tournure poétique naturelle en français.
- source_word: יָדִין עַמִּים
  choice: Il jugera les peuples
  rationale: דין garde ici son sens judiciaire dans le cadre de la royauté divine, et « les peuples » préserve la distinction lexicale avec גּוֹיִם, « les nations ».
- source_word: בְּמֵישָׁרִים
  choice: avec équité
  rationale: Le pluriel מֵישָׁרִים évoque la droiture, la rectitude ou l’équité. Dans un contexte de jugement, « avec équité » exprime clairement une justice droite et impartiale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le conserve comme nom personnel sans le remplacer par un titre.
- issue: Valeur aspectuelle de מָלָךְ dans une proclamation d’intronisation
  choice: Yahweh règne
  alternative: Yahweh est roi ; Yahweh est devenu roi
  rationale: Le contexte permet une proclamation actuelle de la royauté ou une nuance d’accession au trône. Le texte principal retient la formulation française la plus naturelle, tandis que la note préserve l’ambiguïté sans trancher la question théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du parallélisme hébreu, avec une ponctuation fluide. « Vacillera » conserve l’image poétique de stabilité sans archaïsme, et les notes maintiennent les principales ambiguïtés lexicales et aspectuelles.
