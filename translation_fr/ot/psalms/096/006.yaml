  text: הוֹד וְ/הָדָ֥ר לְ/פָנָ֑י/ו עֹ֥ז וְ֝/תִפְאֶ֗רֶת בְּ/מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: fr
  text: Splendeur et majesté sont devant lui ; force et beauté sont dans son sanctuaire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « force et splendeur sont dans son sanctuaire ». Le mot hébreu תִפְאֶרֶת peut aussi se traduire par « splendeur » ou « gloire ».
    reason: Alternative lexicale préservant l'étendue sémantique du terme hébreu.
lexical_decisions:
- source_word: הוֹד
  choice: splendeur
  rationale: Le nom évoque une magnificence imposante. « Splendeur » convient au parallélisme poétique avec הָדָר tout en gardant les deux termes distincts.
- source_word: הָדָר
  choice: majesté
  rationale: Dans ce binôme, le mot exprime la dignité et la grandeur souveraine ; « majesté » en restitue naturellement la portée royale.
- source_word: לְפָנָיו
  choice: sont devant lui
  rationale: La locution signifie littéralement « devant lui ». L'ajout du verbe « sont », sous-entendu en hébreu, produit une phrase française naturelle sans effacer l'image de présence.
- source_word: עֹז
  choice: force
  rationale: « Force » rend directement l'idée de puissance ou de vigueur et forme un binôme poétique naturel avec « beauté ».
- source_word: תִפְאֶרֶת
  choice: beauté
  rationale: Le terme peut désigner la beauté, la splendeur ou la gloire. « Beauté » préserve ici sa dimension esthétique et évite de répéter « splendeur ».
- source_word: בְּמִקְדָּשׁוֹ
  choice: dans son sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu consacré. « Sanctuaire » conserve cette notion sans préciser indûment qu'il s'agit du Temple.
theological_decisions:
- issue: Référent des suffixes pronominaux (« lui », « son »)
  choice: Les pronoms renvoient au SEIGNEUR dans le contexte du psaume, sans remplacer ceux-ci par le nom divin.
  alternative: Expliciter « devant le SEIGNEUR » et « dans son sanctuaire ».
  rationale: Le contexte immédiat identifie clairement le référent, mais l'hébreu emploie ici des pronoms. Leur maintien respecte le mouvement poétique sans ajouter une explicitation absente du verset.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste proche du parallélisme hébreu ; le point-virgule en marque les deux membres. Le vocabulaire est courant tout en conservant le registre cultuel de « sanctuaire ».
