  text: הִשְׁתַּחֲו֣וּ לַ֭/יהוָה בְּ/הַדְרַת קֹ֑דֶשׁ חִ֥ילוּ מִ֝/פָּנָ֗י/ו כָּל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: fr
  text: Prosternez-vous devant Yahweh dans la splendeur de la sainteté[a] ; tremblez devant lui, terre entière !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une parure sacrée » ou « dans une sainte splendeur ». L’expression hébraïque peut désigner soit la splendeur propre à la sainteté, soit une parure ou une tenue sacrée portée pour le culte.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Prosternez-vous
  rationale: Le verbe désigne l’acte de se courber ou de se prosterner en signe de révérence et, dans ce contexte, d’adoration. Cette formulation conserve l’image corporelle de l’hébreu tout en restant naturelle en français.
- source_word: לַיהוָה
  choice: devant Yahweh
  rationale: La préposition marque ici celui auquel l’hommage est rendu. Le nom divin est transcrit « Yahweh » afin de représenter directement le tétragramme.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: dans la splendeur de la sainteté
  rationale: Cette traduction maintient le caractère poétique de l’expression et son ambiguïté entre la splendeur propre à la sainteté et une parure sacrée portée lors du culte.
- source_word: חִילוּ
  choice: tremble
  rationale: Le verbe évoque le tremblement ou l’agitation devant une présence redoutable. Le singulier s’accorde naturellement avec l’apostrophe collective « terre entière ».
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: Littéralement lié à la face ou à la présence, le syntagme signifie idiomatiquement être devant sa présence.
- source_word: כָּל הָאָרֶץ
  choice: terre entière
  rationale: Dans l’appel universel du psaume, l’expression désigne l’ensemble de la terre et de ses habitants. L’apostrophe sans article est idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme. La transcription conserve le nom propre sans le remplacer par un titre.
- issue: Sens de בְּהַדְרַת קֹדֶשׁ
  choice: dans la splendeur de la sainteté
  alternative: dans une parure sacrée
  rationale: La construction peut évoquer soit la splendeur attachée à la sainteté, soit l’ornement ou le vêtement sacré des adorateurs. Le texte principal garde la lecture abstraite et poétique, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif pluriel « Prosternez-vous » s’adresse aux peuples, puis l’apostrophe collective « terre entière » appelle naturellement l’impératif singulier « tremble ». Le point d’exclamation restitue la force de l’appel sans ajouter de contenu.
