id: PSA.96.5
reference: Psalms 96:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: fr
  text: Car tous les dieux des peuples sont des idoles[a], mais Yahweh[b] a fait les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi évoquer des idoles sans valeur, voire des « néants ».
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel précédent et convient au registre poétique du psaume.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: tous les dieux des peuples
  rationale: Rend directement la totalité exprimée par כָּל, le pluriel אֱלֹהֵי et le syntagme construit « des peuples ».
- source_word: אֱלִילִים
  choice: des idoles
  rationale: Traduction claire et naturelle du terme désignant les faux dieux, tout en laissant sa nuance polémique d’inanité ou de nullité à la note.
- source_word: וַיהוָה
  choice: mais Yahweh
  rationale: La conjonction marque ici un contraste net entre les idoles et Yahweh, le Créateur.
- source_word: שָׁמַיִם עָשָׂה
  choice: a fait les cieux
  rationale: Préserve le sens général de עָשָׂה, « faire », sans le préciser en « créer », et rend naturellement le pluriel hébreu שָׁמַיִם.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme; « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Statut des dieux des peuples
  choice: sont des idoles
  alternative: ne sont que néant / sont des idoles sans valeur
  rationale: « Idoles » maintient l’affirmation polémique sans imposer dans le texte principal toute la nuance étymologique ou rhétorique possible d’inanité.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste concise et conserve l’opposition entre les divinités des peuples et Yahweh, auteur des cieux.
