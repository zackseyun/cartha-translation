id: PSA.96.13
reference: Psalms 96:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: fr
  text: devant Yahweh, car il vient, car il vient[a] pour juger la terre. Il jugera le monde avec justice, et les peuples[b] selon sa fidélité[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il est venu, car il est venu » ; la forme hébraïque peut présenter cette venue comme déjà accomplie ou comme absolument certaine.'
    reason: ambiguïté_aspectuelle
  - marker: b
    text: 'Ou : « les nations ».'
    reason: variante_lexicale
  - marker: c
    text: 'Ou : « selon sa vérité ».'
    reason: variante_lexicale
lexical_decisions:
- source_word: לִפְנֵי
  choice: devant
  rationale: La locution signifie « devant » ou « en présence de ». « Devant » est naturel et conserve la relation exprimée par l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כִּי בָא ... כִּי בָא
  choice: car il vient, car il vient
  rationale: Dans ce contexte poétique, la forme verbale présente la venue comme imminente ou certaine. La répétition hébraïque est conservée pour son effet d’insistance.
- source_word: לִשְׁפֹּט / יִשְׁפֹּט
  choice: pour juger / il jugera
  rationale: Le verbe peut englober l’exercice du gouvernement, mais les compléments « avec justice » et « selon sa fidélité » mettent ici en avant l’acte de juger.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallèle avec « le monde » indique une portée universelle plutôt qu’un territoire particulier.
- source_word: תֵּבֵל
  choice: le monde
  rationale: Le terme désigne couramment le monde habité et ordonné ; « le monde » en est l’équivalent français le plus naturel.
- source_word: בְּצֶדֶק
  choice: avec justice
  rationale: Cette formulation exprime naturellement en français la qualité morale selon laquelle Yahweh juge, tout en restant proche de la construction hébraïque.
- source_word: וְעַמִּים
  choice: et les peuples
  rationale: Le pluriel désigne plusieurs collectivités humaines. « Les peuples » correspond directement au terme hébreu, tandis que « les nations » reste possible.
- source_word: בֶּאֱמוּנָתוֹ
  choice: selon sa fidélité
  rationale: Le nom évoque la fermeté, la fiabilité et la fidélité. « Selon sa fidélité » exprime idiomatiquement que son jugement est conforme à son caractère fiable, sans effacer le suffixe possessif.
theological_decisions:
- issue: Nature du jugement divin dans le contexte poétique
  choice: Conserver le vocabulaire du jugement sans l’atténuer en simple gouvernement ni l’élargir en une doctrine détaillée du jugement final.
  alternative: Traduire par « gouverner » ou expliciter un jugement eschatologique final.
  rationale: Le verset annonce clairement que Yahweh vient juger toute la terre, mais la traduction doit s’en tenir à ce qu’affirme le texte.
- issue: Rendu du tétragramme יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: « Yahweh » représente le nom propre hébreu et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique et la répétition emphatique de l’hébreu sont conservées. Le verset commençant au milieu d’une phrase, la minuscule initiale maintient son lien avec le contexte précédent.
