  text: הָב֣וּ לַ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ שְׂאֽוּ מִ֝נְחָ֗ה וּ/בֹ֥אוּ לְ/חַצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/008.yaml
  text: Ascribe to Yahweh the glory of his name[a]; bring an offering and come into his courts.
translation:
  language: fr
  text: Rendez à Yahweh la gloire qui revient à son nom ; apportez une offrande[a] et entrez dans ses cours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un don » ou « un tribut ». Le terme hébreu peut désigner un don, un tribut ou une offrande selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Rendez
  rationale: Dans cette formule psalmique, l’impératif appelle à reconnaître et à attribuer à Yahweh l’honneur qui lui appartient. « Rendez » conserve l’idée de donner ce qui lui revient sans suggérer qu’il manquerait de gloire.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme יהוה est rendu par le nom propre « Yahweh », conformément à sa fonction de nom divin dans le texte hébreu.
- source_word: כְּבוֹד שְׁמוֹ
  choice: la gloire de son nom
  rationale: Cette traduction suit étroitement la construction hébraïque et préserve la portée du « nom » comme expression de l’identité et de la réputation révélées, sans l’expliciter dans le corps du texte.
- source_word: שְׂאוּ
  choice: apportez
  rationale: Avec מִנְחָה, le verbe נשׂא a ici le sens idiomatique de porter ou d’apporter un don cultuel.
- source_word: מִנְחָה
  choice: une offrande
  rationale: Le terme peut désigner un don, un tribut ou une offrande. Dans ce contexte d’adoration et d’accès aux cours du sanctuaire, « offrande » est le rendu français le plus naturel et suffisamment large.
- source_word: וּבֹאוּ
  choice: et entrez
  rationale: Bien que le verbe signifie littéralement « venez », la préposition qui suit indique un mouvement vers l’intérieur des cours ; « entrez » exprime naturellement ce mouvement en français.
- source_word: לְחַצְרוֹתָיו
  choice: dans ses cours
  rationale: חֲצֵרוֹת désigne les cours ou enceintes du sanctuaire. « Cours » conserve le vocabulaire cultuel traditionnel tout en restant intelligible.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve sa fonction de nom propre d’alliance sans le remplacer par un titre.
- issue: Rapport entre la gloire et le nom
  choice: la gloire de son nom
  alternative: la gloire due à son nom
  rationale: La formulation retenue reproduit l’ambiguïté concise de l’hébreu, tandis que « due à » expliciterait une relation seulement implicite.
translation_notes:
  register: Français international moderne, digne et liturgique sans archaïsme marqué. Le parallélisme impératif est conservé. Aucun marqueur de note n’est requis, puisque les nuances lexicales sont consignées dans l’apparat plutôt que dans une note publiée.
