  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: fr
  text: Chantez pour Yahweh un chant nouveau ! Chantez pour Yahweh, terre entière !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif masculin pluriel de שׁיר. « Chantez » exprime directement l’appel collectif sans ajouter l’idée de louange, qui n’est pas formulée explicitement.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique ici le destinataire du chant. En français, « chanter pour » est naturel et conserve cette orientation.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: L’hébreu désigne un chant caractérisé comme nouveau. L’article indéfini est requis par l’usage français, et « chant nouveau » garde la dignité et l’écho biblique de l’expression.
- source_word: כָּל הָאָרֶץ
  choice: terre entière
  rationale: Dans le contexte universel du psaume, הָאָרֶץ désigne la terre plutôt qu’un territoire particulier. L’apostrophe française « terre entière » rend naturellement l’ensemble de ses habitants tout en préservant l’image hébraïque.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le présente comme un nom propre et évite de le remplacer silencieusement par un titre ; une note n’est pas nécessaire dans ce verset isolé puisque le rendu est direct.
translation_notes:
  register: Français international moderne, simple et solennel. La répétition impérative et le parallélisme hébreu sont conservés. Les points d’exclamation rendent l’élan de l’appel poétique sans modifier son contenu.
