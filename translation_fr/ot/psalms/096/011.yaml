  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: fr
  text: Que les cieux se réjouissent et que la terre exulte ! Que la mer gronde[a], et tout ce qui la remplit !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retentisse ».
    reason: Alternative lexicale pour רעם, qui peut évoquer le tonnerre, le grondement ou un puissant retentissement.
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Que ... se réjouissent
  rationale: L’imparfait qal à valeur volitive ouvre une suite d’appels poétiques. « Que ... se réjouissent » exprime naturellement cette invitation en français.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Le pluriel « les cieux » conserve la portée cosmique et le registre poétique du terme hébreu.
- source_word: וְתָגֵל
  choice: et que ... exulte
  rationale: Le verbe גיל évoque une joie vive. « Exulte » préserve sa nuance propre et évite de répéter « se réjouissent ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans la triade cosmique formée par les cieux, la terre et la mer, « la terre » convient mieux que « le pays ».
- source_word: יִרְעַם
  choice: Que ... gronde
  rationale: רעם désigne un bruit puissant comparable au tonnerre. Pour la mer, « gronder » est naturel en français tout en conservant la force sonore de l’image.
- source_word: הַיָּם
  choice: la mer
  rationale: Équivalent français courant de ים, approprié au parallélisme cosmique du verset.
- source_word: וּמְלֹאוֹ
  choice: avec tout ce qui la remplit
  rationale: Littéralement « et sa plénitude » ; l’expression désigne tout ce que contient la mer. Cette formulation reste concrète et compréhensible en français moderne.
theological_decisions:
- issue: Valeur volitive des imparfaits poétiques
  choice: 'Rendre la suite comme une invitation : « Que les cieux se réjouissent ... Que la mer gronde »'
  alternative: 'Lecture prédictive : « Les cieux se réjouiront ... la mer grondera »'
  rationale: Dans ce contexte d’appel universel à la louange, les imparfaits parallèles ont vraisemblablement une force jussive ou volitive. La tournure avec « que » respecte cette fonction sans transformer l’invitation en prédiction.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est marqué par deux phrases exclamatives ; « exulte » maintient la variation lexicale de l’hébreu, tandis que « gronde » donne à la personnification de la mer une expression idiomatique.
