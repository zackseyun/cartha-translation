id: PSA.96.12
reference: Psalms 96:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: fr
  text: Que la campagne et tout ce qu’elle contient exultent ! Alors tous les arbres de la forêt pousseront des cris de joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chanteront de joie ». Le verbe hébreu peut désigner une clameur ou un chant joyeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: Que … exulte
  rationale: L’imparfait à valeur jussive exprime ici un souhait ou un appel. « Que … exulte » en conserve la force volitive et le ton poétique soutenu.
- source_word: שָׂדַי
  choice: la campagne
  rationale: Le nom singulier a ici une portée collective et désigne l’étendue ouverte plutôt qu’un champ agricole particulier. « La campagne » est naturel en français et convient à la personnification de la création.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: avec tout ce qu’elle contient
  rationale: La préposition « avec » rend naturellement l’association entre la campagne et tout ce qui s’y trouve, tandis que « tout ce qu’elle contient » maintient la portée totalisante de l’hébreu.
- source_word: אָז
  choice: Alors
  rationale: Le terme marque le mouvement poétique suivant, voire sa conséquence. « Alors » restitue clairement cette progression.
- source_word: יְרַנְּנוּ
  choice: pousseront des cris de joie
  rationale: Le piel désigne des clameurs sonores et joyeuses. Cette formulation française garde cette intensité sans limiter le verbe au chant, sens possible mais plus précis que l’hébreu.
- source_word: כָּל עֲצֵי יָעַר
  choice: tous les arbres de la forêt
  rationale: Cette formulation naturelle conserve à la fois la totalité exprimée par כָּל et l’image de la forêt entière participant à la joie.
theological_decisions:
- issue: Personnification de la création dans la louange
  choice: Conserver directement la personnification poétique de la campagne et des arbres.
  alternative: Paraphraser le verset comme une évocation de la beauté ou de l’abondance de la nature.
  rationale: Le psaume représente explicitement la création non humaine comme prenant part à une réponse joyeuse. Garder cette image préserve la portée théologique du texte sans l’expliquer ni la réduire.
translation_notes:
  register: Français international moderne, poétique et digne. Le subjonctif initial restitue l’appel jussif; l’exclamation soutient l’élan lyrique. La personnification et la progression marquée par « Alors » sont conservées.
