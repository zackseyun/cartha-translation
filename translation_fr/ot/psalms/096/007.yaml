  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: fr
  text: Rendez[a] à Yahweh[b], familles des peuples[c], rendez à Yahweh gloire et puissance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Donnez ». Ici, l’impératif invite à reconnaître à Dieu ce qui lui revient.'
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin יהוה ; on trouve aussi « Yahvé » ou, selon la tradition, « le Seigneur ».
    reason: alternative_reading
  - marker: c
    text: 'Ou : « clans des nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Rendez
  rationale: Dans cet appel liturgique, l’impératif signifie reconnaître et accorder à Dieu ce qui lui revient. « Rendez » conserve l’image de « donner » tout en exprimant naturellement cette reconnaissance en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique ici le destinataire, et le nom divin יהוה est transcrit « Yahweh » afin de préserver le nom propre présent dans le texte hébreu.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: familles des peuples
  rationale: מִשְׁפָּחוֹת désigne des familles élargies ou des clans, tandis que עַמִּים est un pluriel collectif signifiant « peuples ». La formulation retenue préserve ces deux éléments sans réduire le sens à des États politiques.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Dans ce contexte d’adoration, כָּבוֹד désigne la gloire ou l’honneur reconnus à Dieu. « Gloire » convient au registre poétique et liturgique.
- source_word: וָעֹז
  choice: et puissance
  rationale: עֹז peut désigner la force, la puissance ou la vigueur. « Puissance » exprime ici de façon idiomatique la force souveraine attribuée à Dieu et forme une paire naturelle avec « gloire ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: L’hébreu emploie explicitement le Tétragramme. La transcription « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre, tout en signalant en note l’usage traditionnel français.
- issue: Nature de l’appel à rendre gloire et puissance
  choice: « Rendez » au sens de reconnaître ce qui revient à Dieu
  alternative: « Donnez » ou « Attribuez »
  rationale: Le verset ne suppose pas que les humains procurent à Dieu une qualité qui lui manquerait. Dans cet emploi liturgique, l’impératif appelle les peuples à reconnaître publiquement sa gloire et sa puissance, tout en conservant la tension de l’image hébraïque du don.
translation_notes:
  register: Style poétique, direct et solennel, mais accessible en français moderne international. La répétition de l’impératif et l’apostrophe centrale sont maintenues. L’absence d’articles devant « gloire et puissance » donne à la formule une concision liturgique proche de l’hébreu.
