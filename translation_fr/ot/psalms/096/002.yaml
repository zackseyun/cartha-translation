id: PSA.96.2
reference: Psalms 96:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: fr
  text: Chantez pour Yahweh ; bénissez son nom ; proclamez[a] jour après jour son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « annoncez la bonne nouvelle de son salut ».
    reason: Alternative lexicale faisant ressortir la nuance favorable souvent portée par le verbe בשר.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel direct du verbe שׁיר, sans ajout d’un complément comme « des louanges » qui n’est pas explicite.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל désigne ici le destinataire du chant. En français courant, « chanter pour » exprime naturellement cette orientation, tandis que le nom divin est conservé.
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: L’impératif de ברך est rendu littéralement afin de préserver l’expression biblique « bénir son nom » et la distinction avec « chanter ».
- source_word: שְׁמוֹ
  choice: son nom
  rationale: Rend directement le nom שׁם avec son suffixe masculin singulier, tout en conservant les résonances bibliques de l’identité et de la renommée.
- source_word: בַּשְּׂרוּ
  choice: proclamez
  rationale: Le piel de בשר appelle à une annonce publique et comporte souvent la nuance d’une bonne nouvelle. « Proclamez » convient au parallélisme impératif ; la nuance plus précise est signalée en note.
- source_word: מִיּוֹם לְיוֹם
  choice: jour après jour
  rationale: Expression française naturelle qui restitue la répétition continue exprimée par l’idiome hébreu « de jour en jour ».
- source_word: יְשׁוּעָתוֹ
  choice: son salut
  rationale: ישׁועה peut désigner le salut, la délivrance ou la victoire. « Salut » conserve ici son sens large et son adéquation au contexte de louange.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre ; « Yahvé » est une forme française traditionnelle possible.
- issue: Portée de יְשׁוּעָתוֹ
  choice: son salut
  alternative: sa délivrance ; sa victoire
  rationale: Le substantif peut couvrir une délivrance concrète ou une victoire, mais le contexte ne permet pas de réduire son sens à l’une de ces seules nuances.
translation_notes:
  register: Français moderne, sobre et liturgique. Le rythme de trois impératifs est conservé, ainsi que l’expression biblique « bénissez son nom ». « Jour après jour » est préféré à « de jour en jour » pour une lecture plus naturelle à l’échelle internationale.
