source:
  edition: WLC
  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: fr
  text: Car Yahweh est grand et très digne de louange[a] ; il est à craindre plus que tous les dieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et hautement loué ». L’hébreu dit plus littéralement « loué grandement » ; « très digne de louange » en rend naturellement le sens.'
    reason: lexical_alternative
  - marker: b
    text: Les « dieux » peuvent désigner les divinités des peuples ; le verset suivant les présente comme des idoles sans valeur.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à louer et à adorer qui précède ; « Car » en conserve naturellement la valeur explicative.
- source_word: גָדוֹל
  choice: grand
  rationale: Exprime ici la grandeur et la majesté de Yahweh sans limiter le sens à sa seule puissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וּמְהֻלָּל מְאֹד
  choice: et digne de toute louange
  rationale: Rend de façon idiomatique le participe passif « loué » intensifié par מְאֹד, avec l’idée qu’une louange éminente lui revient.
- source_word: נוֹרָא
  choice: redoutable
  rationale: Conserve l’idée qu’il inspire la crainte révérencielle ; « impressionnant » serait trop affaibli en français moderne.
- source_word: הוּא
  choice: il est
  rationale: Représente le pronom hébreu explicite et souligne Yahweh comme sujet de la seconde proposition.
- source_word: עַל כָּל אֱלֹהִים
  choice: plus que tous les dieux
  rationale: עַל marque ici la supériorité ; « les dieux » maintient la formulation du texte sans l’interpréter d’emblée comme « idoles ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa transcription préserve sa fonction personnelle et identificatrice.
- issue: Sens de אֱלֹהִים dans ce contexte
  choice: les dieux
  alternative: les idoles
  rationale: Le verset dit littéralement « dieux ». Le verset suivant les qualifie, mais il convient de ne pas anticiper ici cette interprétation.
- issue: Force de נוֹרָא
  choice: redoutable
  alternative: digne d’être craint
  rationale: « Redoutable » exprime de manière concise le fait d’inspirer la crainte, tout en laissant le contexte cultuel orienter celle-ci vers la révérence.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve le parallélisme poétique et la tension entre la grandeur de Yahweh, la louange qui lui revient et la crainte qu’il inspire.
