id: PSA.96.3
reference: Psalms 96:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: fr
  text: Proclamez sa gloire parmi les nations, ses actes merveilleux[a] parmi tous les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses merveilles » ou « ses œuvres merveilleuses ».
    reason: Alternative lexicale pour נִפְלְאוֹתָיו, qui peut désigner les merveilles elles-mêmes ou les actes extraordinaires accomplis.
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Proclamez
  rationale: L’impératif pluriel intensif de ספר appelle à raconter publiquement. « Proclamez » restitue bien la force exhortative du verset dans un français naturel et soutenu.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations dans leur diversité. « Parmi » exprime une proclamation faite en leur sein, sans introduire la nuance ethnoreligieuse plus tardive de « païens ».
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: כָּבוֹד évoque l’honneur, la majesté et la splendeur. « Gloire » est le terme français le plus juste dans ce contexte de louange.
- source_word: בְּכָל הָעַמִּים
  choice: parmi tous les peuples
  rationale: « Peuples » distingue עַמִּים de גּוֹיִם tout en conservant le parallélisme poétique et la portée universelle de l’expression.
- source_word: נִפְלְאוֹתָיו
  choice: ses actes merveilleux
  rationale: Le nom issu de פלא désigne des actes extraordinaires qui suscitent l’émerveillement. « Actes merveilleux » en exprime à la fois le caractère admirable et la dimension active.
theological_decisions:
- issue: Portée universelle de la proclamation
  choice: Le verset appelle à proclamer la gloire et les actes du Seigneur parmi toutes les nations et tous les peuples.
  alternative: Limiter principalement l’appel aux peuples voisins d’Israël.
  rationale: Le parallélisme entre גּוֹיִם et כָּל הָעַמִּים souligne une portée internationale très large. La traduction la conserve sans y ajouter une formulation missiologique ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif pluriel « Proclamez » maintient le ton public et exhortatif; le parallélisme « parmi les nations / parmi tous les peuples » reproduit la structure poétique hébraïque.
