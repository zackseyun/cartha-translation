  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: fr
  text: Au chef de chœur[a] ; avec instruments à cordes. Psaume d’Asaph[b]. Chant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur musical » ; le terme désigne la personne chargée de diriger l’exécution.
    reason: alternative_reading
  - marker: b
    text: « D’Asaph » peut indiquer qu’Asaph en est l’auteur, que ce psaume est associé au groupe d’Asaph ou qu’il lui est dédié.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est naturel en français et convient au contexte liturgique et musical.
- source_word: בִּנְגִינֹת
  choice: avec instruments à cordes
  rationale: Le terme renvoie ici à l’accompagnement par des instruments à cordes. Cette formulation garde le sens instrumental sans préciser indûment la manière de jouer.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Il s’agit du terme de genre habituel dans les suscriptions. « Psaume » le distingue du second terme de genre, « chant ».
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: Dans les titres des psaumes, la préposition לְ peut signaler l’auteur, l’appartenance ou la dédicace. La formulation concise « d’Asaph » conserve cette ambiguïté.
- source_word: שִׁיר
  choice: chant
  rationale: Ce second terme de genre est apposé à « Psaume » ; « chant » restitue sobrement la double désignation hébraïque.
theological_decisions:
- issue: Portée de לְ dans לְאָסָף
  choice: d’Asaph
  alternative: pour Asaph
  rationale: Le texte hébreu ne permet pas de trancher entre attribution personnelle, association au groupe d’Asaph et dédicace ; le texte principal et la note maintiennent cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation sépare les deux indications musicales parallèles. La formulation nominale conserve le style concis d’une suscription.
