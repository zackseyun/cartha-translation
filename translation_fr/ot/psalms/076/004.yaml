source:
  edition: WLC
  text: נָ֭אוֹר אַתָּ֥ה אַדִּ֗יר מֵֽ/הַרְרֵי טָֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/004.yaml
  text: You are radiant[a], more majestic than the mountains of prey.
translation:
  language: fr
  text: Tu es resplendissant, plus majestueux que les montagnes de proie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « plus majestueux que les montagnes de butin ». Le mot hébreu peut désigner une proie ou, par extension, du butin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֹר
  choice: resplendissant
  rationale: Le terme évoque l’éclat lumineux et la splendeur. « Resplendissant » conserve cette image dans un registre poétique, naturel et digne.
- source_word: אַתָּה
  choice: tu es
  rationale: Le français exige ici la copule, sous-entendue dans la proposition nominale hébraïque. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume.
- source_word: אַדִּיר
  choice: plus majestueux
  rationale: Le mot exprime la majesté, la noblesse ou la puissance. Avec מִן, le sens comparatif est le plus naturel; « majestueux » conserve une portée plus large que « puissant ».
- source_word: מֵהַרְרֵי
  choice: que les montagnes de
  rationale: La préposition מִן marque probablement ici la comparaison après אַדִּיר. La construction nominale « montagnes de » reproduit le rapport d’annexion hébreu.
- source_word: טָרֶף
  choice: proie
  rationale: Le nom désigne d’abord une proie saisie ou déchirée, puis, par extension, le butin. « Proie » préserve l’image vive et l’ambiguïté poétique du texte.
theological_decisions:
- issue: Sens de la proposition comparative מֵהַרְרֵי טָרֶף
  choice: Dieu est plus majestueux que « les montagnes de proie ».
  alternative: Dieu resplendit depuis les montagnes de proie; ou « les montagnes de butin » comme objet de la comparaison.
  rationale: La syntaxe avec אַדִּיר favorise le comparatif, sans toutefois supprimer l’ambiguïté lexicale de טָרֶף. La traduction n’assigne donc pas à l’image un référent historique ou doctrinal précis.
translation_notes:
  register: Français international moderne, poétique et digne. « Resplendissant » rend l’éclat inhérent du terme hébreu; « montagnes de proie » conserve l’image inhabituelle plutôt que de l’expliquer dans le corps du verset.
