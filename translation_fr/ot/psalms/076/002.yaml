  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: fr
  text: À Salem se trouvait son abri[b], et à Sion sa demeure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Salem est traditionnellement identifiée à Jérusalem ; le verset met Salem et Sion en parallèle comme noms du lieu où Dieu demeure.
    reason: cross_reference
  - marker: b
    text: Ou « sa hutte », « son pavillon » ou « son tabernacle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: se trouvait
  rationale: Dans cette construction locative, le verbe היה indique naturellement où était situé l’abri de Dieu. « Se trouvait » donne en français courant une phrase fluide sans ajouter l’idée d’un changement d’état.
- source_word: בְשָׁלֵם
  choice: à Salem
  rationale: Le texte hébreu emploie le nom propre Salem plutôt que Jérusalem. Le conserver respecte la formulation poétique et laisse l’identification traditionnelle à la note.
- source_word: סֻכּוֹ
  choice: son abri
  rationale: סֻכָּה désigne un abri, une hutte ou un pavillon. « Abri » exprime ici le sens général sans introduire la connotation cultuelle plus technique de « tabernacle ».
- source_word: וּמְעוֹנָתוֹ
  choice: et sa demeure
  rationale: מְעוֹנָה désigne un lieu d’habitation. « Demeure » est naturel, digne et convient au parallélisme avec « abri ».
- source_word: בְצִיּוֹן
  choice: à Sion
  rationale: Sion est le nom propre traditionnel en français; la préposition « à » est idiomatique pour ce lieu.
theological_decisions:
- issue: Rapport entre Salem et Sion
  choice: Conserver distinctement les deux noms propres dans le texte principal.
  alternative: Traduire Salem par « Jérusalem » afin de rendre explicite l’identification traditionnelle.
  rationale: L’hébreu met poétiquement Salem et Sion en parallèle. Les identifier directement dans le texte effacerait une distinction présente dans la formulation source; la note peut signaler leur rapport traditionnel.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe locative placée en tête reproduit le parallélisme hébreu; « abri » évite un terme cultuel indûment précis.
