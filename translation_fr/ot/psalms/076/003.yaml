id: PSA.76.3
reference: Psalms 76:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁ֭מָּ/ה שִׁבַּ֣ר רִשְׁפֵי קָ֑שֶׁת מָגֵ֬ן וְ/חֶ֖רֶב וּ/מִלְחָמָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/003.yaml
  text: There he shattered the arrows of the bow[a], shield and sword and battle[c][b]. Selah
translation:
  language: fr
  text: Là, il a brisé les flèches de l’arc[a], le bouclier, l’épée et la guerre[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les flèches enflammées de l’arc ». L’expression hébraïque évoque littéralement les « flammes » ou les « éclairs de l’arc », image poétique désignant ses flèches.
    reason: lexical_alternative
  - marker: b
    text: Ou « le combat » ou « la bataille ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: Là
  rationale: Adverbe de lieu qui renvoie à l’endroit nommé dans le contexte précédent, sans le préciser de nouveau.
- source_word: שִׁבַּר
  choice: il a brisé
  rationale: Le piel exprime ici une destruction énergique et décisive. « Briser » convient naturellement aux armes tout en permettant de conserver l’image poétique appliquée à la guerre.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: les flèches de l’arc
  rationale: Dans ce contexte militaire, רִשְׁפֵי désigne les projectiles de l’arc. La traduction principale privilégie la clarté, tandis qu’une note conserve l’image sous-jacente de flammes ou d’éclairs.
- source_word: מָגֵן
  choice: le bouclier
  rationale: Équivalent français courant de cette arme défensive.
- source_word: וְחֶרֶב
  choice: l’épée
  rationale: Traduction directe du nom dans l’énumération des instruments de guerre.
- source_word: וּמִלְחָמָה
  choice: et la guerre
  rationale: Le nom peut désigner la guerre, le combat ou la bataille. « La guerre » préserve le mouvement culminant qui passe des armes particulières à l’ensemble du conflit.
- source_word: סֶלָה
  choice: Sélah
  rationale: Transcription traditionnelle conservée, puisque la fonction exacte de ce terme liturgique ou musical reste incertaine.
theological_decisions:
- issue: Sujet sous-entendu du verbe masculin singulier
  choice: Le pronom « il » renvoie à Dieu selon le contexte immédiat du psaume.
  alternative: Un sujet masculin non précisé
  rationale: Le sujet n’est pas exprimé dans ce verset hébreu, mais le contexte précédent identifie Dieu comme l’auteur de l’action. Le français exige ici l’expression du pronom sujet.
translation_notes:
  register: Français international moderne, clair et digne. L’énumération conserve la concision et la progression poétiques de l’hébreu. « Sélah » est maintenu comme indication liturgique ou musicale non traduite.
