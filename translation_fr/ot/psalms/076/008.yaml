  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: fr
  text: Du ciel, tu as fait entendre le jugement[a] ; la terre a eu peur et s’est tue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as fait entendre la justice » ou « la sentence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « est restée immobile » ou « s’est calmée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Du ciel
  rationale: La préposition מִן indique la provenance. En français, « du ciel » exprime naturellement la source céleste tout en conservant le contraste avec « la terre ».
- source_word: הִשְׁמַעְתָּ
  choice: tu as fait entendre
  rationale: Le hiphil de שׁמע a ici une valeur causative. « Faire entendre » en maintient la force sans expliciter davantage le mode de proclamation.
- source_word: דִּין
  choice: le jugement
  rationale: דִּין désigne ici la décision ou l’intervention judiciaire de Dieu. « Le jugement » convient au contexte et reste assez large pour préserver cette nuance.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Le contraste poétique entre le ciel et אֶרֶץ favorise le sens cosmique de « terre » plutôt que celui, également possible, de « pays ».
- source_word: יָרְאָה
  choice: a eu peur
  rationale: Le verbe ירא exprime la peur ou la crainte. Dans ce contexte de jugement, « a eu peur » rend directement la réaction de la terre, sans transformer explicitement cette peur en révérence.
- source_word: וְשָׁקָטָה
  choice: et s’est tenue tranquille
  rationale: שׁקט évoque le calme, le silence ou l’immobilité après une agitation. « S’est tenue tranquille » est naturel en français et laisse ouverte la nuance de silence ou d’immobilité.
theological_decisions:
- issue: Portée de אֶרֶץ dans le contraste poétique avec le ciel
  choice: la terre, au sens du monde terrestre dans son ensemble
  alternative: le pays, éventuellement un territoire déterminé
  rationale: Le parallélisme « du ciel / la terre » suggère une perspective cosmique. Cette traduction évite d’introduire une référence nationale plus étroite que le texte n’impose pas.
- issue: Nature de la réaction exprimée par יָרְאָה
  choice: une peur face au jugement divin
  alternative: une crainte révérencielle ou un profond respect
  rationale: Le contexte judiciaire autorise une peur réelle, tandis que le verbe peut aussi inclure l’idée de crainte révérencielle. La formulation retenue ne développe pas une interprétation théologique plus précise que l’hébreu.
translation_notes:
  register: Français moderne, sobre et poétique. La syntaxe conserve le mouvement du vers hébreu et le contraste entre ciel et terre, tout en évitant une tournure artificielle.
