  text: אַתָּ֤ה נ֥וֹרָא אַ֗תָּה וּ/מִֽי יַעֲמֹ֥ד לְ/פָנֶ֗י/ךָ מֵ/אָ֥ז אַפֶּֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/007.yaml
  text: You—you are to be feared[a]; and who can stand before you from the time of your anger[b]?
translation:
  language: fr
  text: Toi, tu es redoutable[a] ! Et qui peut tenir devant toi depuis que ta colère se manifeste[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « digne d’être craint » ou « qui inspires la crainte ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est elliptique : « depuis lors, ta colère ». Autres traductions possibles : « depuis que ta colère a commencé » ou « quand ta colère se manifeste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: Toi, tu
  rationale: Le pronom répété est rendu par la dislocation française « Toi, tu », qui conserve l’insistance sans ajouter l’idée d’exclusivité.
- source_word: נוֹרָא
  choice: redoutable
  rationale: L’adjectif qualifie Dieu comme inspirant la crainte. « Redoutable » est naturel en français moderne et garde ici une force solennelle, sans affaiblir le terme en simple admiration.
- source_word: וּמִי
  choice: Et qui
  rationale: « Et » traduit simplement la conjonction hébraïque et introduit la question rhétorique sans lui imposer une valeur adversative.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: peut tenir devant toi
  rationale: Dans cette question rhétorique, l’imparfait exprime la possibilité ou la capacité. « Tenir devant toi » conserve l’image de rester debout ou de résister en présence de Dieu.
- source_word: מֵאָז
  choice: dès que
  rationale: Dans ce contexte, « dès que » rend naturellement le point de départ temporel marqué par מִן et אָז, tout en laissant la note signaler une traduction plus littérale.
- source_word: אַפֶּךָ
  choice: ta colère éclate
  rationale: אַף désigne couramment la colère par métonymie. Le verbe « éclate », requis par la tournure française avec « dès que », exprime son déclenchement sans recourir au littéral « nez ».
theological_decisions:
- issue: Nature de la crainte inspirée par Dieu
  choice: redoutable
  alternative: digne d’être craint ; qui inspires la crainte
  rationale: « Redoutable » maintient à la fois la majesté terrifiante de Dieu et la réaction de crainte qu’elle suscite, sans réduire le terme à la terreur seule ni à une admiration affaiblie.
- issue: Possibilité de subsister devant la colère divine
  choice: 'question rhétorique : « qui peut tenir »'
  alternative: qui tiendra ; qui pourrait tenir
  rationale: La formulation exprime l’incapacité humaine à subsister devant Dieu lorsqu’il se met en colère, sans préciser davantage la nature du jugement.
translation_notes:
  register: Français international moderne, poétique et solennel. La dislocation « Toi, tu » restitue l’emphase hébraïque ; « tenir devant toi » conserve l’image biblique tout en restant immédiatement compréhensible.
