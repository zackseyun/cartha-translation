  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: fr
  text: Il brise l’esprit des princes[a] ; il est redoutable aux rois de la terre.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il retient l’esprit des dirigeants ». Le mot traduit par « esprit » peut aussi signifier « souffle », « courage » ou « tempérament ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il est redoutable pour les rois de la terre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: brise
  rationale: Le qal imparfait de בצר peut évoquer l’action de retrancher, réduire ou contenir. Avec « l’ardeur des princes », « brise » exprime naturellement en français l’abaissement décisif des dirigeants sans imposer l’idée précise de leur mort.
- source_word: רוּחַ
  choice: ardeur
  rationale: רוּחַ peut désigner le souffle, l’esprit, le courage ou la disposition intérieure. « Ardeur » convient ici à l’élan fier ou combatif des dirigeants, tout en restant assez large; les autres nuances sont signalées en note.
- source_word: נְגִידִים
  choice: princes
  rationale: נְגִידִים désigne des chefs ou des gouvernants. « Princes » conserve le registre poétique et le parallélisme avec « les rois de la terre ».
- source_word: נוֹרָא
  choice: redoutable
  rationale: נוֹרָא qualifie celui qui inspire la crainte. « Redoutable » exprime en français actuel cette majesté terrifiante sans l’affaiblissement possible de « impressionnant ».
- source_word: לְמַלְכֵי אָרֶץ
  choice: pour les rois de la terre
  rationale: 'La préposition ל marque ici la relation: Dieu est redoutable aux yeux des rois ou à leur égard. « Pour les rois de la terre » garde cette construction ouverte plutôt que de transformer explicitement les rois en agents d’un passif.'
theological_decisions:
- issue: Nature de l’action divine envers les dirigeants
  choice: Dieu brise leur ardeur, c’est-à-dire leur élan intérieur, leur courage ou leur orgueil.
  alternative: Dieu retranche leur souffle et leur ôte ainsi la vie, ou bien il contient leur colère.
  rationale: L’association de בצר et רוּחַ permet plusieurs nuances. Le contexte célèbre la souveraineté de Dieu sur les puissants; le texte principal exprime donc leur abaissement décisif sans limiter le propos à la mort physique ni à une émotion particulière.
translation_notes:
  register: Français moderne, digne et poétique. « Brise l’ardeur » restitue de façon naturelle l’image d’une réduction décisive de la force intérieure des gouvernants. Les notes conservent l’ambiguïté lexicale de l’hébreu et la nuance relationnelle de נוֹרָא לְ.
