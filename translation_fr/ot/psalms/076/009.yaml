lexical_decisions:
- source_word: בְּקוּם
  choice: quand Dieu se lève
  rationale: La préposition בְּ avec l’infinitif construit de קוּם a ici une valeur temporelle. Le présent convient au tableau poétique de l’intervention divine.
- source_word: לַמִּשְׁפָּט
  choice: pour juger
  rationale: מִשְׁפָּט désigne ici l’exercice du jugement ou de la justice. La tournure verbale est naturelle en français et maintient la scène judiciaire.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Il s’agit de la désignation habituelle du Dieu d’Israël, avec une référence singulière.
- source_word: לְהוֹשִׁיעַ
  choice: pour sauver
  rationale: L’infinitif hifil de יָשַׁע exprime l’action de sauver ou de délivrer; « sauver » reste direct et largement compréhensible.
- source_word: כָּל
  choice: tous
  rationale: כָּל introduit ici collectivement l’ensemble du groupe désigné.
- source_word: עַנְוֵי
  choice: les humbles
  rationale: עָנָו peut évoquer l’humilité, la douceur ou l’affliction. « Les humbles » conserve au mieux ses dimensions morale et sociale sans le réduire à une seule nuance.
- source_word: אֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut signifier « terre » au sens large ou « pays ». Le contexte poétique et כָּל favorisent ici la portée universelle, tout en laissant l’autre lecture possible.
- source_word: סֶלָה
  choice: Sèla
  rationale: La fonction exacte de ce terme, probablement liturgique ou musicale, demeure incertaine; il est donc translittéré.
theological_decisions:
- issue: Nuance sémantique de עַנְוֵי
  choice: les humbles
  alternative: les doux; les affligés
  rationale: Le terme peut décrire à la fois une disposition d’humilité et une condition d’abaissement ou d’oppression. Le texte principal retient la formulation la plus englobante, et la note préserve les autres nuances.
- issue: Portée de אֶרֶץ
  choice: la terre
  alternative: le pays
  rationale: « La terre » convient à la portée potentiellement universelle du vers, mais l’hébreu permet aussi une référence au pays; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé sur deux lignes. « Sèla » est translittéré sans en préciser la fonction incertaine.
