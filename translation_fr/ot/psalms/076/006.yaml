  text: מִ֭/גַּעֲרָ֣תְ/ךָ אֱלֹהֵ֣י יַעֲקֹ֑ב נִ֝רְדָּ֗ם וְ/רֶ֣כֶב וָ/סֽוּס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/006.yaml
  text: At your rebuke[a], O God of Jacob[b], both chariot and horse were cast into a deep sleep.
translation:
  language: fr
  text: À ta réprimande[a], Dieu de Jacob, char et cheval[b] ont été plongés dans un profond sommeil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sous l’effet de ta réprimande » ou « À cause de ta réprimande ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « char et cheval », expression poétique évoquant la force militaire ; certains comprennent que l’image englobe aussi ceux qui les montent ou les conduisent.
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: À ta réprimande
  rationale: La préposition מִן peut ici exprimer le point de départ ou la cause. « À ta réprimande » restitue naturellement l’effet immédiat de la parole menaçante de Dieu tout en conservant l’ambiguïté causale.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Dieu de Jacob
  rationale: Cette expression construite est un titre divin employé ici comme apostrophe directe. En français, le vocatif ne requiert pas d’interjection équivalente à l’anglais « O ».
- source_word: נִרְדָּם
  choice: ont sombré dans un profond sommeil
  rationale: Le nifal de רדם désigne un sommeil profond ou une torpeur incapacitante plutôt qu’un repos ordinaire. Cette formulation française préserve l’image poétique et son intensité sans préciser s’il s’agit littéralement du sommeil ou d’une image de la défaite.
- source_word: וְרֶכֶב וָסוּס
  choice: char et cheval
  rationale: La traduction conserve les deux noms singuliers du texte hébreu et leur valeur collective dans cette évocation poétique de la puissance militaire.
theological_decisions:
- issue: Nature de la défaite décrite
  choice: La réprimande de Dieu réduit à l’impuissance la puissance militaire ennemie, sous l’image d’un profond sommeil.
  alternative: Comprendre soit un sommeil littéral, soit une affirmation explicite de la mort ou de l’anéantissement total.
  rationale: Le texte emploie l’image de la torpeur profonde dans un contexte de victoire divine. La traduction en conserve la tension sans la réduire à un sommeil ordinaire ni remplacer l’image par une mention explicite de la mort.
translation_notes:
  register: Français moderne, poétique et digne. L’apostrophe « Dieu de Jacob » reste sans « ô », jugé plus soutenu et moins courant. « Ont sombré dans un profond sommeil » garde l’image forte de la torpeur tout en demeurant idiomatique.
