  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: fr
  text: Les hommes au cœur vaillant ont été dépouillés ; ils ont dormi leur sommeil, et aucun homme valeureux n’a pu se servir de ses mains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucun homme valeureux n’a trouvé ses mains » ; c’est-à-dire qu’ils étaient incapables d’agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: ont été dépouillés
  rationale: Le verbe, issu de la racine שלל dans une forme à valeur passive ou réflexive, présente les puissants comme ceux qui sont eux-mêmes dépouillés. « Ont été dépouillés » convient au contexte militaire sans préciser indûment de quoi ils l’ont été.
- source_word: אַבִּירֵי לֵב
  choice: les hommes au cœur vaillant
  rationale: Cette expression rend l’image littérale du « cœur puissant » tout en désignant naturellement des hommes courageux et résolus.
- source_word: נָמוּ שְׁנָתָם
  choice: ils se sont endormis de leur sommeil
  rationale: La formulation conserve la répétition poétique de l’hébreu et laisse ouverte la nuance entre sommeil, sommeil profond et mort, même si le contexte évoque fortement une défaite mortelle.
- source_word: אַנְשֵׁי חַיִל
  choice: hommes de guerre
  rationale: Dans ce contexte martial, l’expression désigne des combattants puissants et valeureux. « Hommes de guerre » est clair, naturel et ne surcharge pas la traduction.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: n’a retrouvé l’usage de ses mains
  rationale: Littéralement, ils « n’ont pas trouvé leurs mains ». La traduction exprime l’impuissance suggérée par cet idiome tout en conservant l’image des mains ; la note donne la forme plus littérale.
theological_decisions:
- issue: La nature du sommeil des guerriers
  choice: Ne pas expliciter « le sommeil de la mort » dans le texte
  alternative: ils se sont endormis du sommeil de la mort
  rationale: Le contexte peut évoquer leur mort, mais l’hébreu dit seulement « leur sommeil ». La traduction préserve donc cette tension poétique sans imposer l’interprétation.
translation_notes:
  register: Français moderne, digne et poétique. L’expression « au cœur vaillant » garde l’image hébraïque, tandis que « retrouvé l’usage de ses mains » communique naturellement l’impuissance des guerriers sans effacer complètement cette image.
