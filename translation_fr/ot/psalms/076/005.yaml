  source_fidelity: Le premier membre rend correctement אֶשְׁתּוֹלְלוּ comme un dépouillement subi, et « au cœur vaillant » reflète bien אַבִּירֵי לֵב. Le sommeil doit demeurer non explicité, car le texte hébreu n’impose pas « la mort ». En revanche, « retrouvé l’usage » ajoute indûment l’idée de récupération antérieure, absente de וְלֹא מָצְאוּ ... יְדֵיהֶם.
  naturalness: « Ils se sont endormis de leur sommeil » est un calque peu naturel en français. « Ils ont dormi leur sommeil » conserve la répétition expressive dans un français poétique recevable. « Aucun homme valeureux n’a pu se servir de ses mains » rend naturellement l’idiome d’impuissance; la note préserve l’image littérale.
  terminology: « Hommes au cœur vaillant » et « hommes valeureux » conviennent au registre martial et poétique sans surinterprétation. « Dépouillés » est approprié. Le texte et la note évitent de transformer le sommeil en affirmation explicite de mort.
