source:
  edition: WLC
  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: fr
  text: Car la fureur humaine te célébrera[b] ; tu te ceindras du reste des fureurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu retiendras le reste des fureurs ». Le dernier membre est difficile en hébreu ; le texte principal suit de plus près le texte massorétique et en conserve la métaphore.'
    reason: alternative_reading
  - marker: b
    text: « Humaine » rend ici un terme qui désigne l’être humain ou l’humanité en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici une explication ou un fondement ; « Car » conserve naturellement cette valeur causale dans le contexte.
- source_word: חֲמַת אָדָם
  choice: la fureur humaine
  rationale: חֵמָה exprime la fureur ou la colère ardente, et אָדָם désigne ici l’humanité en général. Cette formulation est naturelle en français et évite de réduire le terme aux hommes de sexe masculin.
- source_word: תּוֹדֶךָּ
  choice: te célébrera
  rationale: Le hifil de ידה signifie louer ou célébrer. Dans ce contexte paradoxal, la fureur humaine finit par contribuer à la gloire reconnue à Dieu ; « célébrera » garde le registre poétique sans suggérer que la fureur éprouve littéralement de la gratitude.
- source_word: שְׁאֵרִית
  choice: le reste
  rationale: Le nom désigne ce qui subsiste ou demeure. « Le reste » est clair et naturel en français moderne.
- source_word: חֵמֹת
  choice: des fureurs
  rationale: Le pluriel hébreu est conservé parce qu’il peut évoquer les diverses manifestations ou l’intensité des colères, tout en maintenant l’étrangeté poétique du texte.
- source_word: תַּחְגֹּר
  choice: tu te ceindras
  rationale: Le verbe חגר signifie se ceindre ou attacher autour de soi. Cette traduction garde la métaphore massorétique sans préciser indûment s’il s’agit de porter, d’armer ou de maîtriser.
theological_decisions:
- issue: Interprétation de שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: Dieu est le sujet et se ceint métaphoriquement du reste des fureurs.
  alternative: « tu retiendras le reste de la fureur » ; ou « le reste des fureurs t’entourera dans la fête »
  rationale: La forme verbale à la deuxième personne masculine singulière désigne naturellement Dieu comme sujet. Le dernier membre est difficile ; le texte principal suit au plus près le texte massorétique et conserve sa métaphore plutôt que de trancher silencieusement en faveur de l’idée de retenue.
translation_notes:
  register: Français international moderne, poétique et digne. « Fureur humaine » rend explicitement le sens générique de אָדָם. « Tu te ceindras » conserve l’image inhabituelle et l’ambiguïté du texte hébreu.
