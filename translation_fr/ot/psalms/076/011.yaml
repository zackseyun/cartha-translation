id: PSA.76.11
reference: Psalms 76:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: fr
  text: Faites des vœux à Yahweh, votre Dieu, et accomplissez-les ; que tous ceux qui l’entourent apportent un tribut[a] au Redoutable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un don » ou « des présents ». Le mot hébreu שַׁי désigne un cadeau offert à un supérieur honoré ; « tribut » fait ressortir la nuance de révérence et peut-être de soumission politique.
    reason: lexical_alternative
  - marker: b
    text: Ou « à celui qu’on doit craindre » ou « à celui qui inspire l’effroi ». Le titre hébreu souligne que Dieu est celui qu’il convient de craindre et de révérer.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Faites des vœux
  rationale: L’impératif pluriel de נדר appelle les destinataires à prononcer des vœux. « Faites des vœux » est naturel en français moderne.
- source_word: וְשַׁלְּמוּ
  choice: et accomplissez-les
  rationale: Dans le contexte des vœux, שלם signifie les acquitter ou les mener à leur accomplissement. Le pronom reprend explicitement « des vœux ».
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: à Yahweh, votre Dieu
  rationale: 'Le nom divin יהוה est translittéré « Yahweh », tandis que אֱלֹהֵיכֶם précise en apposition : « votre Dieu ».'
- source_word: כָּל סְבִיבָיו
  choice: tous ceux qui l’entourent
  rationale: Le pluriel verbal montre qu’il s’agit des personnes ou des peuples alentour, et non simplement des lieux environnants.
- source_word: יוֹבִילוּ
  choice: apportent
  rationale: Le hiphil de יבל exprime ici le fait d’apporter un présent à un supérieur.
- source_word: שַׁי
  choice: un tribut
  rationale: שַׁי désigne un don présenté à un personnage honoré ou supérieur. « Tribut » conserve les nuances de révérence et de royauté possibles dans ce contexte.
- source_word: לַמּוֹרָא
  choice: au Redoutable
  rationale: מוֹרָא évoque la crainte, la terreur ou l’effroi et fonctionne ici comme un titre divin. « Le Redoutable » garde cette force sans réduire le terme à une simple admiration.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le caractère personnel du nom divin sans le remplacer par un titre.
- issue: Interprétation de לַמּוֹרָא comme titre divin
  choice: au Redoutable
  alternative: à celui qu’on doit craindre ; à celui qui inspire l’effroi
  rationale: Le contexte du psaume souligne la majesté terrifiante de Dieu face aux rois et aux nations. La formulation retenue préserve cette tension théologique et la concision poétique.
translation_notes:
  register: Français international moderne, digne et poétique. L’impératif pluriel est rendu sans archaïsme. La majuscule à « Redoutable » signale l’emploi comme titre divin, tout en maintenant la force redoutable du terme hébreu.
