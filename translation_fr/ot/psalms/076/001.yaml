source:
  edition: WLC
  text: נוֹדָ֣ע בִּֽ/יהוּדָ֣ה אֱלֹהִ֑ים בְּ֝/יִשְׂרָאֵ֗ל גָּד֥וֹל שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/001.yaml
  text: God is known in Judah[b][a]; his name is great in Israel.
translation:
  language: fr
  text: Dieu est connu en Juda[a] ; en Israël, son nom est grand[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu s’est fait connaître en Juda » ; la forme hébraïque peut exprimer soit un état (« est connu »), soit, dans ce contexte, une action (« s’est fait connaître »).'
    reason: lexical_alternative
  - marker: b
    text: Dans la poésie hébraïque, le « nom » peut désigner l’identité révélée ou la renommée de Dieu, et non pas seulement le nom prononcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: est connu
  rationale: Le nifal de ידע peut exprimer ici un état passif, « être connu ». Cette formulation conserve la concision du vers hébreu sans imposer la nuance réfléchie « s’est fait connaître », également possible.
- source_word: בִּיהוּדָה
  choice: en Juda
  rationale: La préposition ב avec Juda se rend naturellement par « en ». Cette traduction préserve la possible résonance à la fois géographique et collective du nom.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le mot a ici un sens singulier et désigne le Dieu d’Israël.
- source_word: בְּיִשְׂרָאֵל
  choice: en Israël
  rationale: « En » rend naturellement la préposition ב et maintient le parallélisme avec « en Juda ».
- source_word: גָּדוֹל
  choice: grand
  rationale: L’adjectif signifie directement « grand » ; ce choix évite de transformer la proposition en une affirmation plus interprétative sur l’exaltation ou la renommée.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: La traduction littérale conserve la portée biblique du « nom », qui peut désigner l’identité révélée et la renommée de Dieu, et non seulement son appellation.
theological_decisions:
- issue: Sens du « nom » divin
  choice: Conserver « son nom est grand ».
  alternative: « sa renommée est grande » ou « il est grandement honoré »
  rationale: La formulation concrète maintient la richesse théologique du nom comme identité révélée et réputation de Dieu, sans la réduire à la seule célébrité ou à l’honneur qui lui est rendu.
- issue: Nuance de נוֹדָע
  choice: « Dieu est connu »
  alternative: « Dieu s’est fait connaître »
  rationale: Le texte hébreu permet une lecture stative ou, selon le contexte, plus événementielle. Le texte principal retient la valeur passive/stative la plus directe, tandis que la note conserve l’autre possibilité sans trancher excessivement.
translation_notes:
  register: Français international moderne, sobre et poétique. L’ordre de la seconde proposition (« en Israël, son nom est grand ») met en relief le parallélisme Juda/Israël tout en restant naturel. Tous les marqueurs de notes figurent dans le texte principal.
