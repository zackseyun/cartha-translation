  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: fr
  text: Que le nom de Yahweh soit béni dès maintenant et pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que le nom de Yahweh soit béni. »'
    reason: La note conserve l’alternative française possible pour le jussif יְהִי, sans présenter une rétroversion française maladroite comme une traduction littérale.
lexical_decisions:
- source_word: יְהִי
  choice: Que … soit
  rationale: Le jussif de היה exprime ici un souhait ou une exhortation. La tournure française « Que … soit » en restitue naturellement la valeur.
- source_word: שֵׁם
  choice: nom
  rationale: 'Le terme est conservé sans explicitation : dans l’usage hébreu, le nom représente aussi la personne et sa renommée.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que remplacé par un titre.
- source_word: מְבֹרָךְ
  choice: béni
  rationale: Le participe passif de ברך signifie « béni ». Ce choix préserve le langage de bénédiction du texte, là où « loué » serait plus interprétatif.
- source_word: מֵעַתָּה
  choice: dès maintenant
  rationale: Cette expression désigne le moment présent comme point de départ ; « dès maintenant » est idiomatique et en conserve la force temporelle.
- source_word: וְעַד עוֹלָם
  choice: et pour toujours
  rationale: La construction indique une durée sans fin. « Pour toujours » est clair, actuel et fidèle au sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le nom propre divin au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, simple et digne. La structure jussive est conservée par « Que … soit », et le point d’exclamation rend le ton d’acclamation sans ajouter de contenu.
