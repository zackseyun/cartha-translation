  text: מְקִֽימִ֣י מֵ/עָפָ֣ר דָּ֑ל מֵֽ֝/אַשְׁפֹּ֗ת יָרִ֥ים אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: fr
  text: 'Il relève le pauvre de la poussière,

    il relève l’indigent du tas de cendres.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du tas d’ordures » ; le mot hébreu désigne un lieu où l’on jetait ou entassait des cendres et des déchets, image d’un extrême abaissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: relève
  rationale: Le participe hiphil de קום exprime l’action de faire se lever. « Relève » rend naturellement cette action en français et convient à l’image d’une personne abaissée.
- source_word: מֵעָפָר
  choice: de la poussière
  rationale: עָפָר désigne la poussière ou la terre meuble, et מִן marque ici le point de départ. La formulation conserve l’image concrète de l’abaissement.
- source_word: דָּל
  choice: le pauvre
  rationale: דָּל peut désigner une personne pauvre, faible ou de condition modeste. « Le pauvre » est clair et naturel tout en laissant entendre sa vulnérabilité sociale.
- source_word: מֵאַשְׁפֹּת
  choice: du tas de cendres
  rationale: אַשְׁפֹּת désigne un lieu où l’on entasse des cendres ou des déchets. « Tas de cendres » conserve l’image traditionnelle, tandis qu’une note signale l’autre sens possible.
- source_word: יָרִים
  choice: retire
  rationale: Le hiphil de רום signifie élever ou soulever. Dans ce contexte, « retire … du » exprime naturellement le mouvement ascendant sans anticiper explicitement l’exaltation sociale développée au verset suivant.
- source_word: אֶבְיוֹן
  choice: l’indigent
  rationale: אֶבְיוֹן désigne celui qui manque du nécessaire. « L’indigent » le distingue de דָּל tout en préservant le parallélisme synonymique.
theological_decisions:
- issue: Imagerie anthropologique et sociale
  choice: Conserver le langage concret du renversement de condition
  alternative: Spiritualiser la poussière et le tas de cendres comme images de l’humilité intérieure
  rationale: L’hébreu nomme des réalités matérielles et des personnes socialement vulnérables. La traduction ne réduit donc pas le verset à une application spirituelle, sans toutefois exclure de telles lectures théologiques.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme hébreu est maintenu, avec « pauvre » et « indigent » pour distinguer les deux termes proches. La note porte sur « tas de cendres », là où se trouve réellement l’ambiguïté lexicale.
