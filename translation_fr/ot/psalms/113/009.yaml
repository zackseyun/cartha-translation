source:
  edition: WLC
  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: fr
  text: Il donne un foyer à la femme sans enfant[a], mère heureuse d’enfants. Louez Yah ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Il fait habiter la femme stérile dans la maison. »'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression hébraïque signifie « Louez Yah ! » ; traditionnellement : « Alléluia ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִ֨י
  choice: Il fait habiter
  rationale: Le participe hiphil de ישׁב exprime ici l’action de faire habiter ou d’établir. Cette formulation conserve explicitement la valeur causative de l’hébreu.
- source_word: עֲקֶ֬רֶת
  choice: la femme qui n’avait pas d’enfant
  rationale: Le nom désigne une femme privée d’enfants. Cette expression naturelle évite la tonalité médicale d’« infertile » et rend le renversement décrit dans le verset.
- source_word: הַבַּ֗יִת
  choice: dans une maison
  rationale: Littéralement « dans la maison » ; le contexte évoque un foyer où la femme est établie. L’indéfini convient mieux à l’usage français sans exclure le sens de foyer ou de maisonnée.
- source_word: אֵֽם הַבָּנִ֥ים
  choice: une mère ... au milieu de ses enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants. La construction hébraïque « mère des enfants » est rendue idiomatiquement tout en conservant l’image d’une maternité comblée.
- source_word: שְׂמֵחָ֗ה
  choice: heureuse
  rationale: L’adjectif féminin décrit la joie de la mère. « Heureuse » est naturel, actuel et digne dans ce contexte poétique.
- source_word: הַֽלְלוּ יָֽהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel est traduit directement, et la forme divine abrégée יָהּ est translittérée « Yah », plutôt que confondue avec le tétragramme complet.
theological_decisions:
- issue: Rendu du nom divin abrégé יָהּ dans l’acclamation finale
  choice: Yah
  alternative: le Seigneur ; Alléluia
  rationale: Le texte porte la forme abrégée יָהּ, non le tétragramme יהוה. « Yah » en préserve la forme distincte ; « Alléluia » est la translittération traditionnelle de l’ensemble de l’expression plutôt que sa traduction.
- issue: Nature du renversement vécu par la femme sans enfant
  choice: Ne pas préciser le moyen par lequel elle devient mère
  alternative: Interpréter explicitement le verset comme une guérison de l’infertilité ou comme une adoption
  rationale: L’hébreu juxtapose l’établissement de la femme dans une maison et son état de mère heureuse, sans expliquer le mécanisme. La traduction maintient cette réserve et cette tension poétique.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La syntaxe conserve le parallélisme du verset ; « femme qui n’avait pas d’enfant » évite un terme clinique, et « Yah » préserve la forme divine abrégée de l’hébreu.
