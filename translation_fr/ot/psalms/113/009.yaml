revisions:
- from: Il fait habiter dans une maison la femme qui n’avait pas d’enfant[a] ; il fait d’elle une mère heureuse au milieu de ses enfants. Louez Yah ![b]
  to: Il donne un foyer à la femme sans enfant[a], mère heureuse d’enfants. Louez Yah ![b]
  rationale: La révision supprime le passé implicite et l’ajout spatial, tout en conservant le renversement poétique de la femme sans enfant devenue mère heureuse. « Donne un foyer » est une équivalence française idiomatique du causatif « fait habiter/établit »; la note maintient la formulation plus littérale et l’article défini de l’hébreu. Les ancres de note restent correctement attachées aux éléments qu’elles documentent.
