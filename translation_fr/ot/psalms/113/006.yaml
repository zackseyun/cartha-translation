  text: who stoops down to look on the heavens and the earth[a].
translation:
  language: fr
  text: lui qui s’abaisse pour regarder dans les cieux et sur la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui s’humilie pour contempler les cieux et la terre ».'
    reason: Alternative lexicale possible pour הַמַּשְׁפִּילִי et לִרְאוֹת.
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: lui qui s’abaisse
  rationale: Le participe hiphil de שׁפל exprime ici le fait de se faire bas, dans le prolongement du contraste avec l’élévation de Dieu au verset précédent. « S’abaisse » conserve l’image anthropomorphique sans suggérer nécessairement une humiliation morale.
- source_word: לִרְאוֹת
  choice: pour regarder
  rationale: L’infinitif construit de ראה indique le but. « Pour regarder » est naturel en français et conserve l’idée d’un regard porté sur ce qui suit.
- source_word: בַּשָּׁמַיִם
  choice: dans les cieux
  rationale: Le pluriel poétique שׁמים désigne les cieux. La préposition ב est rendue explicitement par « dans », conformément à l’expression française usuelle.
- source_word: וּבָאָרֶץ
  choice: et sur la terre
  rationale: אָרֶץ forme avec les cieux une paire cosmique. Pour exprimer naturellement en français la préposition ב devant « terre », « sur » convient mieux que « dans ».
theological_decisions:
- issue: Description anthropomorphique de la transcendance et de l’abaissement de Dieu
  choice: Conserver l’image de Dieu qui « s’abaisse » pour regarder.
  alternative: « qui s’humilie pour contempler » ou une formulation abstraite telle que « qui prend connaissance de »
  rationale: Le texte met poétiquement en relief que, pour le Dieu exalté du verset précédent, même les cieux sont en bas. « S’abaisse » maintient la tension entre transcendance divine et attention portée à la création, sans transformer l’image en proposition doctrinale plus précise.
translation_notes:
  register: Français moderne, digne et poétique. « Lui qui » assure naturellement la continuité de la proposition relative avec le verset précédent; « les cieux et la terre » préserve la portée cosmique du parallélisme.
