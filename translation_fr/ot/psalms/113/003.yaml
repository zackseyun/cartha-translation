id: PSA.113.3
reference: Psalms 113:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/מִּזְרַח שֶׁ֥מֶשׁ עַד מְבוֹא֑/וֹ מְ֝הֻלָּ֗ל שֵׁ֣ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/003.yaml
  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: fr
  text: Du lever du soleil jusqu’à son coucher[a], le nom de Yahweh[b] est digne de louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’est à l’ouest »; littéralement, « du lever du soleil jusqu’à son coucher ».
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: Du lever du soleil
  rationale: מִזְרַח peut désigner l’est ou le lever du soleil. Avec שֶׁמֶשׁ et en parallèle avec מְבוֹאוֹ, « du lever du soleil » restitue naturellement l’image poétique.
- source_word: עַד מְבוֹאוֹ
  choice: jusqu’à son coucher
  rationale: Le nom מָבוֹא, muni du suffixe renvoyant au soleil, exprime ici son entrée ou sa disparition; « son coucher » est l’équivalent français naturel.
- source_word: מְהֻלָּל
  choice: est digne de louange
  rationale: Le participe passif peut signifier « loué » ou « digne d’être loué ». Cette formulation préserve la portée générale et normative sans transformer la phrase en impératif explicite.
- source_word: שֵׁם
  choice: le nom
  rationale: Le rendu littéral conserve la richesse biblique du « nom », qui évoque l’identité révélée et la réputation de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » conserve le nom personnel tout en signalant en note le rendu français traditionnel.
- issue: Valeur de מְהֻלָּל
  choice: est digne de louange
  alternative: est loué; soit loué
  rationale: Le participe permet une lecture descriptive ou normative. « Est digne de louange » maintient la portée durable et l’appel implicite à la louange sans introduire un impératif absent de la forme hébraïque.
translation_notes:
  register: Français international moderne, poétique et digne. La structure « du… jusqu’à… » conserve le mérisme hébreu, qui peut évoquer à la fois toute la journée et toute l’étendue d’est en ouest.
