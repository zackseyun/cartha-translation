  text: to seat him with nobles[b][a], with the nobles of his people.
translation:
  language: fr
  text: pour le faire siéger avec des notables[a], avec les notables de son peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes »; le mot hébreu peut désigner des notables ou des personnes de rang princier.
    reason: lexical_alternative
  - marker: b
    text: « Son peuple » désigne probablement le peuple du SEIGNEUR; grammaticalement, le possessif peut aussi renvoyer à l’homme qui vient d’être relevé.
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: pour le faire siéger
  rationale: 'L’infinitif construit au hiphil de ישׁב, avec לְ et suffixe objet masculin singulier, exprime ici le but ou le résultat de l’action précédente : faire asseoir celui qui était dans le besoin. « Faire siéger » conserve la valeur causative et suggère naturellement l’accès à une place d’honneur.'
- source_word: עִם
  choice: avec
  rationale: La préposition signifie directement « avec ». Sa répétition est conservée afin de respecter le parallélisme et l’insistance poétique de l’hébreu.
- source_word: נְדִיבִים / נְדִיבֵי
  choice: les notables
  rationale: Dans ce contexte social, נָדִיב désigne des personnes de haut rang. « Notables » est naturel en français international et évite de préciser indûment une fonction dynastique que pourrait suggérer « princes ».
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne couramment un peuple ou une communauté. Le suffixe masculin singulier est rendu sans en fixer silencieusement le référent, qui demeure grammaticalement ambigu.
theological_decisions:
- issue: Référent de « son » dans « son peuple »
  choice: Conserver « son peuple » dans le texte, avec comme lecture contextuellement probable le peuple du SEIGNEUR.
  alternative: 'Le possessif peut renvoyer à l’homme pauvre que Dieu a relevé : les notables de son propre peuple.'
  rationale: Le suffixe hébreu permet les deux rattachements. Le contexte, où le SEIGNEUR reste l’auteur des actions, favorise un renvoi au SEIGNEUR, mais la syntaxe n’exclut pas que le possessif renvoie à l’homme relevé; une note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français moderne, digne et accessible. « Faire siéger » maintient l’image d’une installation honorifique; « notables » exprime le rang social sans introduire une précision monarchique absente du terme hébreu.
