  text: רָ֖ם עַל כָּל גּוֹיִ֥ם יְהוָ֑ה עַ֖ל הַ/שָּׁמַ֣יִם כְּבוֹדֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/004.yaml
  text: Yahweh is high above all nations; his glory is above the heavens.
translation:
  language: fr
  text: Yahweh est élevé au-dessus de toutes les nations ; sa gloire est au-dessus des cieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָם
  choice: est élevé
  rationale: L’adjectif prédicatif exprime à la fois la hauteur et l’exaltation. « Est élevé » convient au registre poétique et affirme naturellement la suprématie de Yahweh.
- source_word: עַל כָּל גּוֹיִם
  choice: au-dessus de toutes les nations
  rationale: La préposition marque ici la hauteur et la supériorité. Cette formulation conserve en français le parallélisme avec « au-dessus des cieux ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la présence explicite du tétragramme dans le texte hébreu.
- source_word: עַל הַשָּׁמַיִם
  choice: au-dessus des cieux
  rationale: Dans ce contexte poétique, שָׁמַיִם désigne les cieux. La répétition de « au-dessus » reproduit le parallélisme hébreu.
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: כָּבוֹד évoque la gloire, l’honneur et la majesté. « Sa gloire » est ici la formulation française la plus directe et la plus appropriée au contexte de louange.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » le préserve comme nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « au-dessus » conserve la structure parallèle et l’image verticale du texte hébreu.
