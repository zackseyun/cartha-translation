id: PSA.113.1
reference: Psalms 113:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: fr
  text: Louez Yah ![a] Louez, serviteurs de Yahweh[b] ; louez le nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu « Hallélou-Yah » signifie littéralement « Louez Yah », avec la forme abrégée du nom divin ; c’est l’origine du mot « Alléluia ».
    reason: lexical_alternative
  - marker: b
    text: Ou « esclaves de Yahweh » ; le terme hébreu peut désigner des personnes en service ou en esclavage, mais « serviteurs » convient mieux ici au contexte de louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louez
  rationale: Impératif pluriel du piel de הלל. « Louez » restitue clairement l’appel direct et sa triple répétition.
- source_word: יָהּ
  choice: Yah
  rationale: Forme abrégée du nom divin, distincte de יְהוָה employé ensuite. « Yah » conserve cette distinction et rend transparent le sens de l’expression liturgique « Alléluia ».
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Pluriel construit de עבד. Dans cette adresse aux adorateurs de Yahweh, « serviteurs » est naturel et approprié, tout en laissant une note signaler le sens possible d’« esclaves ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription française courante du nom divin, qui préserve sa présence explicite dans le texte hébreu et sa distinction d’avec la forme courte « Yah ».
- source_word: אֶת שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: Cette formulation conserve la construction hébraïque et met bien le nom divin au centre de la louange.
theological_decisions:
- issue: Distinction entre יָהּ et יְהוָה dans le même verset
  choice: Rendre יָהּ par « Yah » et יְהוָה par « Yahweh »
  alternative: Rendre les deux formes par « le Seigneur », ou uniformiser avec « Yahweh »
  rationale: Le texte emploie délibérément la forme abrégée puis le nom divin complet. Les rendre distinctement respecte cette différence sans l’effacer.
- issue: Portée de עַבְדֵי
  choice: « serviteurs » dans le texte, avec « esclaves » en note
  alternative: « esclaves » dans le texte principal
  rationale: Le mot peut désigner des personnes en service ou en esclavage. Le contexte cultuel favorise « serviteurs », mais la note préserve l’étendue sémantique du terme.
translation_notes:
  register: Français international moderne, simple et digne. La répétition impérative et le rythme bref de l’hébreu sont conservés. « Yahweh » maintient le nom divin explicite, tandis que « Yah » en préserve la forme abrégée.
