  text: Who is like Yahweh our God[a], who is seated on high[b],
translation:
  language: fr
  text: Qui est comme Yahweh, notre Dieu[a], lui qui siège dans les hauteurs[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom divin יהוה est rendu ici par « Yahweh »; il est traditionnellement traduit par « le SEIGNEUR » ou « l’Éternel ».
    reason: alternative_reading
  - marker: b
    text: La formulation hébraïque emploie un participe causatif, littéralement « qui élève / rend haut pour siéger ». Elle exprime l’exaltation de Yahweh dans son intronisation; l’objet implicite et la nuance exacte de la tournure sont discutés.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif ouvre une question rhétorique exprimant l’incomparabilité de Dieu.
- source_word: כַּ/יהוָה
  choice: est comme Yahweh
  rationale: Le préfixe כְּ marque la comparaison; le français ajoute naturellement « est » dans cette proposition sans verbe exprimé.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La forme avec suffixe de première personne du pluriel signifie directement « notre Dieu » et se place en apposition à Yahweh.
- source_word: הַמַּגְבִּיהִי
  choice: lui qui siège dans les hauteurs
  rationale: Le participe causatif associé à לָשָׁבֶת dépeint Yahweh comme élevé pour siéger. Cette formulation française naturelle conserve à la fois l’élévation et l’image royale.
- source_word: לָשָׁבֶת
  choice: siège
  rationale: Le verbe peut signifier « s’asseoir », « siéger » ou « demeurer ». « Siéger » convient ici à l’image de l’intronisation divine.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée de l’élévation divine
  choice: siège dans les hauteurs
  alternative: s’élève pour siéger
  rationale: Le contexte évoque l’exaltation et l’intronisation de Dieu. Le rendu principal exprime cette image sans trancher explicitement la question de savoir si la forme causative est réfléchie; la note signale la tournure plus littérale.
translation_notes:
  register: Français international actuel, digne et accessible. « Siège dans les hauteurs » conserve l’imagerie royale et la transcendance du texte, tandis que la note maintient visible la forme causative plus littérale.
