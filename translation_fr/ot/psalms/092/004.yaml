  text: כִּ֤י שִׂמַּחְתַּ֣/נִי יְהוָ֣ה בְּ/פָעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖י יָדֶ֣י/ךָ אֲרַנֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/004.yaml
  text: For you have made me glad[a], O Yahweh, by your work[b]; at the works of your hands I sing for joy.
translation:
  language: fr
  text: Car tu m’as réjoui, Yahvé[a], par ton œuvre ; je chante de joie[b] à cause des œuvres de tes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte le nom divin יהוה (YHWH), rendu ici par « Yahvé ».
    reason: divine_name
  - marker: b
    text: 'Ou : « je pousse des cris de joie ». Le verbe hébreu peut désigner un chant jubilant ou une acclamation éclatante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de la louange exprimée dans le contexte ; « Car » conserve cette valeur causale dans un registre poétique naturel.
- source_word: שִׂמַּחְתַּנִי
  choice: tu m’as réjoui
  rationale: Le piel accompli de שׂמח avec suffixe de première personne signifie que Dieu a causé la joie du psalmiste. Le passé composé rend l’action accomplie et son effet présent.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּפָעֳלֶךָ
  choice: par ton œuvre
  rationale: 'פֹּעַל désigne une œuvre, une action ou un accomplissement. Ici, בְּ a naturellement une valeur causale ou instrumentale : l’œuvre de Dieu est la source de la joie.'
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: devant les œuvres de tes mains
  rationale: La formulation conserve l’image hébraïque concrète des « œuvres des mains ». « Devant » présente ces œuvres comme le motif qui suscite l’acclamation, sans préciser excessivement la nuance de la préposition.
- source_word: אֲרַנֵּן
  choice: je chante de joie
  rationale: Le verbe רנן peut évoquer aussi bien un chant jubilant qu’un cri éclatant de joie. Dans le contexte d’un psaume de louange, « je chante de joie » est naturel, tandis qu’une note préserve l’autre nuance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme, nom personnel du Dieu d’Israël. Le rendre par « Yahvé » le distingue du titre אֲדֹנָי, « Seigneur ».
- issue: Nature de l’expression joyeuse décrite par אֲרַנֵּן
  choice: je chante de joie
  alternative: je pousse des cris de joie
  rationale: Le contexte de louange favorise le chant, mais le champ sémantique du verbe inclut également une acclamation sonore ; la note maintient cette amplitude.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste proche du parallélisme hébreu, avec le singulier « ton œuvre » suivi du pluriel « les œuvres de tes mains ». Les images concrètes du texte source sont conservées.
