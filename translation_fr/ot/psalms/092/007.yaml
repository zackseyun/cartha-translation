source:
  edition: WLC
  text: בִּ/פְרֹ֤חַ רְשָׁעִ֨ים כְּמ֥וֹ עֵ֗שֶׂב וַ֭/יָּצִיצוּ כָּל פֹּ֣עֲלֵי אָ֑וֶן לְ/הִשָּֽׁמְדָ֥/ם עֲדֵי עַֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/007.yaml
  text: When the wicked sprout like grass and all workers of wickedness flourish[b][a], it is so that they may be destroyed forever.
translation:
  language: fr
  text: Quand les méchants poussent comme l’herbe et que tous ceux qui font le mal fleurissent[a], c’est pour qu’ils soient détruits à jamais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les auteurs du mal prospèrent » ; littéralement, « tous ceux qui commettent le mal fleurissent » en hébreu.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour leur destruction à jamais » ou « seulement pour être détruits à jamais ».
    reason: alternative_reading
lexical_decisions:
- source_word: בִּפְרֹחַ
  choice: Quand … poussent
  rationale: La préposition ב avec l’infinitif construit introduit ici une circonstance temporelle. « Quand … poussent » est naturel en français et maintient l’image végétale.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé au pluriel désigne collectivement les personnes méchantes. Cette formulation est concise et courante.
- source_word: כְּמוֹ עֵשֶׂב
  choice: comme l’herbe
  rationale: עֵשֶׂב désigne couramment l’herbe ou la végétation. « L’herbe » conserve l’image d’une croissance rapide et passagère.
- source_word: וַיָּצִיצוּ
  choice: fleurissent
  rationale: Le verbe צוץ évoque le fait de bourgeonner ou de fleurir. « Fleurissent » prolonge clairement l’image végétale tout en pouvant suggérer la prospérité visible.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: tous ceux qui font le mal
  rationale: La formulation rend le sens de « tous les auteurs du mal » dans un français actuel et accessible, sans affaiblir la portée morale de אָוֶן.
- source_word: לְהִשָּׁמְדָם
  choice: c’est pour qu’ils soient détruits
  rationale: L’infinitif nifal avec suffixe de troisième personne du pluriel a un sens passif et peut exprimer le but ou le résultat. Cette traduction garde ce lien sans introduire de sujet divin explicite.
- source_word: עֲדֵי עַד
  choice: à jamais
  rationale: Cette locution exprime une durée perpétuelle. « À jamais » convient au registre poétique et reste immédiatement compréhensible.
theological_decisions:
- issue: Le rapport entre la prospérité apparente des méchants et leur destruction finale
  choice: c’est pour qu’ils soient détruits à jamais
  alternative: pour leur destruction à jamais ; seulement pour être détruits à jamais
  rationale: L’hébreu relie directement leur floraison à leur destruction ultime, avec une nuance possible de but ou de résultat. La formulation retenue maintient cette tension sans préciser davantage la causalité ni ajouter explicitement Dieu comme agent.
translation_notes:
  register: Français international moderne, clair et digne. L’image végétale est maintenue par « poussent », « herbe » et « fleurissent ». La syntaxe reste fluide tout en conservant l’ambiguïté hébraïque entre but et résultat.
