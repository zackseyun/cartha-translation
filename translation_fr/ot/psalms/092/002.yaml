  text: 'pour proclamer, le matin, ton amour fidèle,

    et, durant les nuits, ta fidélité[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nuit après nuit ». L’hébreu emploie le pluriel « nuits », qui peut évoquer une louange répétée chaque nuit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: pour proclamer
  rationale: L’infinitif précédé de לְ exprime le but ou prolonge la construction du verset précédent. « Proclamer » conserve la dimension déclarative et publique du verbe.
- source_word: בַּבֹּקֶר
  choice: dès le matin
  rationale: La préposition בְּ introduit ici le moment. « Dès le matin » est naturel en français et maintient le contraste poétique avec les nuits.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד associe bonté aimante, loyauté et constance. « Amour fidèle » rend ces dimensions sans archaïsme ni restriction confessionnelle.
- source_word: וֶאֱמוּנָתְךָ
  choice: et ta fidélité
  rationale: אֱמוּנָה désigne ici la fiabilité et la constance de Dieu. « Fidélité » est l’équivalent français le plus direct et naturel.
- source_word: בַּלֵּילוֹת
  choice: au fil des nuits
  rationale: Le pluriel hébreu est conservé. « Au fil des nuits » exprime naturellement en français la répétition possible, tout en maintenant le nombre et le parallélisme temporel.
