  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: fr
  text: pour proclamer que Yahweh est droit. Il est mon rocher, et il n’y a en lui aucune injustice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun tort en lui » ; le terme hébreu peut désigner l’injustice, le tort ou l’iniquité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַגִּיד
  choice: pour proclamer
  rationale: L’infinitif construit exprime ici le but ou le résultat dans la continuité du contexte précédent. « Proclamer » conserve la dimension publique de l’annonce.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce qui est proclamé.
- source_word: יָשָׁר
  choice: droit
  rationale: Appliqué à Dieu, le terme décrit sa rectitude morale. « Droit » est naturel en français et conserve l’image fondamentale de ce qui n’est pas tortueux.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: צוּרִי
  choice: mon rocher
  rationale: Cette traduction préserve la métaphore concrète et fréquente dans les Psaumes, sans la réduire à l’idée interprétative de refuge.
- source_word: וְלֹא עַוְלָתָה בּוֹ
  choice: et il n’y a en lui aucune injustice
  rationale: La proposition nominale négative est rendue idiomatiquement. « Injustice » exprime le tort ou la fausseté morale désignés par עַוְלָתָה.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le Tétragramme; sa transcription préserve le nom personnel présent dans l’hébreu.
- issue: Portée morale de עַוְלָתָה
  choice: aucune injustice
  alternative: rien de mauvais
  rationale: Le terme peut désigner plus largement le tort ou la perversité, mais « injustice » exprime avec précision son contraste avec la rectitude de Yahweh sans restreindre l’affirmation à une décision judiciaire particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste liée au contexte précédent par « pour proclamer ». Le parallélisme entre la rectitude de Yahweh et l’absence de toute injustice est conservé.
