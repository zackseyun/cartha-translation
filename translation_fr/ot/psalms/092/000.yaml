lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme usuel des titres du Psautier, avec une association musicale; « psaume » est l’équivalent français consacré et naturel.
- source_word: שִׁיר
  choice: Chant
  rationale: Terme hébreu courant pour un chant. Il est rendu séparément afin de préserver les deux substantifs du titre, מִזְמוֹר et שִׁיר.
- source_word: לְיוֹם
  choice: pour le jour
  rationale: La préposition לְ exprime ici la destination ou l’association. « Pour le jour » conserve explicitement יוֹם tout en restant idiomatique dans un titre.
- source_word: הַשַּׁבָּת
  choice: du sabbat
  rationale: Désigne précisément le sabbat. Cette formulation française préserve l’article défini hébreu au sein de l’expression « le jour du sabbat ».
theological_decisions:
- issue: Nature du verset comme suscription plutôt que comme ligne poétique
  choice: 'Le présenter comme un titre nominal : « Psaume. Chant pour le jour du sabbat. »'
  alternative: Le traiter comme le premier vers poétique, sans ponctuation propre à un titre.
  rationale: L’hébreu réunit des éléments nominaux sans verbe conjugué. Une présentation en titre reflète sa fonction littéraire dans le Psautier sans introduire de proposition absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation en deux segments rend clairement la juxtaposition des deux termes hébreux sans les fondre en une seule désignation.
