  text: צַ֭דִּיק כַּ/תָּמָ֣ר יִפְרָ֑ח כְּ/אֶ֖רֶז בַּ/לְּבָנ֣וֹן יִשְׂגֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/012.yaml
  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: fr
  text: Le juste s’épanouit comme le palmier ; il grandit comme un cèdre au Liban.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le juste s’épanouit comme le palmier ; comme un cèdre au Liban, il devient grand. » Le dernier verbe peut exprimer la croissance, l’essor ou le fait de devenir grand.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier substantivé désigne ici une personne juste et peut avoir une portée représentative. « Le juste » conserve la forme singulière sans ajouter « homme ».
- source_word: כַּתָּמָר
  choice: comme le palmier
  rationale: La préposition comparative כְּ et תָּמָר forment une comparaison avec le palmier. L’article défini convient naturellement en français à cette image générique.
- source_word: יִפְרָח
  choice: s’épanouit
  rationale: Le verbe פרח évoque le fait de bourgeonner ou de fleurir, puis figurativement de prospérer. « S’épanouit » garde à la fois l’image végétale et sa portée métaphorique.
- source_word: כְּאֶרֶז
  choice: comme un cèdre
  rationale: La comparaison porte sur un cèdre ; l’article indéfini est naturel en français dans cette construction comparative.
- source_word: בַּלְּבָנוֹן
  choice: au Liban
  rationale: La préposition בְּ localise directement le cèdre au Liban. « Au Liban » rend cette localisation de manière idiomatique.
- source_word: יִשְׂגֶּה
  choice: il grandit
  rationale: Le verbe שׂגה exprime la croissance, l’accroissement ou le fait de devenir grand. « Grandit » convient à l’image du cèdre sans préciser indûment qu’il pousse en hauteur.
