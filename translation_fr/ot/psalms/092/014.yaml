  text: ע֭וֹד יְנוּב֣וּ/ן בְּ/שֵׂיבָ֑ה דְּשֵׁנִ֖ים וְ/רַֽעֲנַנִּ֣ים יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/014.yaml
  text: They still bear fruit in old age[c][b][a]; they are full of sap and green.
translation:
  language: fr
  text: Ils portent encore du fruit dans leur vieillesse[a] ; ils sont pleins de sève et verdoyants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Ils porteront encore du fruit dans leur vieillesse ; ils seront pleins de sève et verdoyants. » Les formes verbales hébraïques peuvent également avoir une valeur future.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « gras et verdoyants » ; dans l’image végétale, « pleins de sève » exprime une vitalité abondante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹד
  choice: encore
  rationale: 'Marque la continuité : leur fécondité se prolonge jusque dans la vieillesse.'
- source_word: יְנוּבוּן
  choice: portent du fruit
  rationale: Le verbe נוב évoque la production de fruit et prolonge précisément l’image des arbres plantés des versets précédents.
- source_word: בְּשֵׂיבָה
  choice: dans leur vieillesse
  rationale: Le nom renvoie littéralement aux cheveux gris, mais désigne idiomatiquement la vieillesse ; le possessif rend la tournure naturelle en français.
- source_word: דְּשֵׁנִים
  choice: pleins de sève
  rationale: Littéralement « gras » ou « opulents » ; dans cette image végétale, l’expression décrit une vitalité abondante et bien nourrie.
- source_word: רַעֲנַנִּים
  choice: verdoyants
  rationale: Le terme décrit la fraîcheur verte et luxuriante de la végétation ; « verdoyants » maintient clairement l’image de l’arbre.
- source_word: יִהְיוּ
  choice: ils sont
  rationale: L’imparfait hébreu peut exprimer ici une réalité générale ou habituelle ; le présent français convient à cette description proverbiale.
theological_decisions:
- issue: Valeur temporelle et aspectuelle des imparfaits hébreux
  choice: Présent à valeur générale (« portent », « sont »)
  alternative: Futur (« porteront encore du fruit… ils seront »)
  rationale: Dans le contexte, le verset décrit de manière générale les justes sous l’image d’arbres vigoureux. Le présent préserve cette portée sans exclure la nuance de continuité ; la lecture future reste possible et est signalée en note.
- issue: Portée de l’image de דְּשֵׁנִים
  choice: Maintenir l’image végétale par « pleins de sève »
  alternative: 'Traduction plus formelle : « gras » ou « opulents »'
  rationale: « Gras » risquerait en français moderne d’évoquer principalement la corpulence. « Pleins de sève » exprime naturellement la vigueur que le parallélisme végétal attribue aux justes.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule conserve le parallélisme poétique. « Vieillesse », « pleins de sève » et « verdoyants » restent immédiatement compréhensibles tout en maintenant l’image arboricole du contexte.
