id: PSA.92.5
reference: Psalms 92:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַה גָּדְל֣וּ מַעֲשֶׂ֣י/ךָ יְהוָ֑ה מְ֝אֹ֗ד עָמְק֥וּ מַחְשְׁבֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/005.yaml
  text: How great are your works[a], O Yahweh; your thoughts are very deep.
translation:
  language: fr
  text: Que tes œuvres sont grandes, Yahweh ! Tes pensées[a] sont très profondes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes projets » ou « tes desseins ».
    reason: alternative lexicale
lexical_decisions:
- source_word: מַה
  choice: Que… sont
  rationale: מַה introduit ici une exclamation admirative, non une question. La tournure française « Que… sont » rend naturellement cette valeur exclamative.
- source_word: גָּדְלוּ
  choice: sont grandes
  rationale: Le parfait qal de גדל a ici une valeur stative dans l’exclamation poétique. « Sont grandes » exprime directement l’admiration présente.
- source_word: מַעֲשֶׂיךָ
  choice: tes œuvres
  rationale: מַעֲשֶׂה désigne des œuvres ou des actes. « Œuvres » conserve la portée large du terme dans ce chant de louange.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que remplacé par un titre.
- source_word: מְאֹד
  choice: très
  rationale: מְאֹד renforce l’adjectif verbal qui suit. « Très » est direct, courant et fidèle au degré exprimé.
- source_word: עָמְקוּ
  choice: sont profondes
  rationale: Le parfait qal de עמק est employé stativement. « Sont profondes » reste concret et proche de l’image hébraïque.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: tes pensées
  rationale: מַחְשָׁבָה peut désigner des pensées, des projets ou des desseins. « Pensées » est le correspondant le plus transparent et préserve l’ampleur poétique du terme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel divin au lieu de lui substituer un titre.
- issue: Portée de מַחְשְׁבֹתֶיךָ
  choice: tes pensées
  alternative: tes projets / tes desseins
  rationale: Le terme peut évoquer aussi bien la pensée divine que ses intentions. Le choix principal conserve cette amplitude sans réduire le sens à la seule planification.
translation_notes:
  register: Français international moderne, simple et digne. La première proposition garde la force exclamative de l’hébreu, tandis que la seconde suit une syntaxe française naturelle sans effacer l’image de profondeur.
