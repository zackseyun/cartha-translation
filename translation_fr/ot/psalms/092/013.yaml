  text: שְׁ֭תוּלִים בְּ/בֵ֣ית יְהוָ֑ה בְּ/חַצְר֖וֹת אֱלֹהֵ֣י/נוּ יַפְרִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: fr
  text: Plantés dans la maison de Yahweh, ils s’épanouiront dans les cours de notre Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Plantés
  rationale: Le participe passif évoque directement des végétaux mis en terre et conserve naturellement la métaphore horticole.
- source_word: בְּבֵית
  choice: dans la maison de
  rationale: « Maison » rend le sens premier de בַּיִת tout en pouvant désigner ici le sanctuaire, sans expliciter davantage que l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: בְּחַצְרוֹת
  choice: dans les cours de
  rationale: Le terme désigne ici les cours du sanctuaire ; « cours » est naturel en français et maintient le parallélisme avec la maison de Yahweh.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Cette formulation rend directement le nom avec son suffixe de première personne du pluriel.
- source_word: יַפְרִיחוּ
  choice: ils s’épanouiront
  rationale: Dans cette image végétale, le verbe peut évoquer le fait de pousser, fleurir ou prospérer ; « s’épanouir » conserve à la fois l’image de la floraison et l’idée de pleine vitalité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La structure participiale initiale et le parallélisme entre « maison » et « cours » sont conservés.
