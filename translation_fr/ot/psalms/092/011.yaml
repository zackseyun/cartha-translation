  text: וַ/תַּבֵּ֥ט עֵינִ֗/י בְּ/שׁ֫וּרָ֥/י בַּ/קָּמִ֖ים עָלַ֥/י מְרֵעִ֗ים תִּשְׁמַ֥עְנָה אָזְנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/011.yaml
  text: My eye has looked on my foes[b][a]; my ears hear of the evildoers who rise against me.
translation:
  language: fr
  text: Mon œil a regardé mes adversaires[a] ; mes oreilles entendent parler des malfaiteurs qui se dressent contre moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui m’épient » ; le terme hébreu peut désigner plus littéralement des observateurs aux intentions hostiles.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes oreilles ont entendu » ou « mes oreilles entendront » ; la forme verbale hébraïque peut recevoir diverses valeurs temporelles ou aspectuelles dans ce contexte poétique. Le texte ne précise pas explicitement ce que les oreilles entendent.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: a regardé
  rationale: Le verbe נבט signifie « regarder, porter le regard sur ». Le passé composé rend ici naturellement l’action accomplie du récit poétique sans ajouter l’idée, implicite mais non exprimée, de triomphe ou de satisfaction.
- source_word: עֵינִי
  choice: Mon œil
  rationale: Le singulier hébreu avec suffixe de première personne est conservé ; cette formulation reste intelligible et poétique en français.
- source_word: בְּשׁוּרָי
  choice: mes adversaires
  rationale: Le terme peut désigner ceux qui observent ou épient le psalmiste et, dans ce contexte hostile, ses adversaires. « Mes adversaires » exprime clairement la valeur contextuelle, tandis que le sens plus littéral est signalé en note.
- source_word: בַּקָּמִים עָלַי
  choice: qui se dressent contre moi
  rationale: Cette expression conserve l’image de קום avec על et rend naturellement l’idée d’une opposition hostile.
- source_word: מְרֵעִים
  choice: les malfaiteurs
  rationale: Le participe désigne ceux qui font le mal ou causent du tort. « Malfaiteurs » est concis, actuel et conserve la portée morale du terme.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: mes oreilles entendront
  rationale: Le verbe est à une forme inaccomplie, à la troisième personne féminine plurielle, accordée avec « oreilles ». Le futur préserve cette forme sans effacer la possibilité contextuelle d’une lecture présente ou accomplie.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme entre « mon œil » et « mes oreilles » est maintenu, ainsi que l’ellipse du texte hébreu sur ce que le psalmiste voit ou entend au sujet de ses adversaires.
