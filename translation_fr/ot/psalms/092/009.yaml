id: PSA.92.9
reference: Psalms 92:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: fr
  text: 'Car voici tes ennemis, Yahweh !

    Oui, voici tes ennemis : ils périront ;

    tous ceux qui commettent le mal[a] seront dispersés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous ceux qui œuvrent au mal ». Autre traduction possible : « tous les malfaiteurs ».'
    reason: La tournure hébraïque פֹּעֲלֵי אָוֶן est concrètement « ceux qui font/œuvrent l’iniquité » ; la note signale le caractère imagé de l’expression et son équivalent français plus condensé.
lexical_decisions:
- source_word: כִּי
  choice: Car / Oui
  rationale: La première occurrence garde la valeur explicative qui relie le verset au contexte précédent ; la seconde marque avec naturel l’insistance de la répétition hébraïque.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la force démonstrative et emphatique du terme tout en convenant au registre poétique du psaume.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Rend directement le pluriel muni du suffixe de deuxième personne masculine singulière, qui renvoie à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: Car voici… Oui, voici
  rationale: Préserve la répétition poétique marquée sans produire en français la lourdeur de « car voici… car voici ».
- source_word: יֹאבֵדוּ
  choice: ils périront
  rationale: Le verbe אבד exprime ici la disparition ou la ruine ; « périront » en garde la force sans préciser indûment le moyen du jugement.
- source_word: יִתְפָּרְדוּ
  choice: seront dispersés
  rationale: Le hitpael de פרד évoque la séparation ou la dispersion ; la forme passive française exprime naturellement la dissolution du groupe.
- source_word: כָּל
  choice: tous
  rationale: Conserve la portée universelle du jugement énoncé.
- source_word: פֹּעֲלֵי אָוֶן
  choice: tous ceux qui commettent le mal
  rationale: Formulation française naturelle qui conserve l’idée littérale de personnes faisant ou pratiquant le mal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » préserve la référence au nom divin personnel sans la remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et poétique. La disposition en trois lignes fait ressortir la répétition emphatique et le parallélisme. L’apostrophe « Yahweh » est maintenue au cœur de la première ligne.
