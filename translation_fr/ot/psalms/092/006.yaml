lexical_decisions:
- source_word: אִישׁ
  choice: l’homme
  rationale: Le nom masculin singulier introduit une figure représentative et se construit naturellement avec l’adjectif masculin qui suit.
- source_word: בַּעַר
  choice: abruti
  rationale: Le terme décrit quelqu’un rendu obtus, dépourvu de discernement, avec une nuance animale; « abruti » conserve cette force sans signifier simplement « mal informé ».
- source_word: יֵדָע
  choice: ne sait pas
  rationale: ידע exprime ici l’absence de connaissance ou de perception; la formulation directe préserve le parallélisme.
- source_word: כְסִיל
  choice: l’insensé
  rationale: Terme courant de la littérature sapientiale pour une personne dont la folie est à la fois intellectuelle et morale; « insensé » convient au registre biblique tout en restant compréhensible.
- source_word: יָבִין
  choice: ne comprend pas
  rationale: בין souligne la compréhension et le discernement; cette traduction maintient une légère distinction avec « ne sait pas ».
- source_word: אֶת זֹאת
  choice: ceci
  rationale: Le démonstratif désigne la réalité expliquée par le contexte qui suit; « ceci » et les deux-points conservent cette orientation sans la préciser artificiellement.
