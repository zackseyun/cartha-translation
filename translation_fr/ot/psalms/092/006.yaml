  text: 'L’homme abruti ne sait pas[a], et l’insensé ne comprend pas ceci :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « L’homme dépourvu de sens » ou « L’homme stupide ». Le mot hébreu présente cette personne comme obtuse, à la manière d’un animal, et non comme simplement ignorante.
