  text: sur l’instrument à dix cordes et sur la harpe[a], avec un jeu résonnant sur la lyre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’identification exacte des instruments à cordes hébreux est incertaine. נָבֶל peut aussi être traduit par « lyre » ou « luth », tandis que כִּנּוֹר est parfois traduit par « harpe ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec méditation sur la lyre ». Le mot hébreu הִגָּיוֹן peut désigner la méditation, un murmure ou un son musical résonnant ; dans ce contexte, le sens musical est probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵי
  choice: sur
  rationale: Dans ce contexte musical, עַל marque l’instrument ou l’accompagnement. « Sur » est naturel en français et permet de conserver la répétition poétique de l’hébreu.
- source_word: עָשׂוֹר
  choice: l’instrument à dix cordes
  rationale: Le terme désigne ici vraisemblablement un instrument à dix cordes. Cette formulation évite d’en préciser indûment le type.
- source_word: וַעֲלֵי
  choice: et sur
  rationale: La conjonction et la préposition répétée sont conservées afin de reproduire l’énumération poétique.
- source_word: נָבֶל
  choice: la harpe
  rationale: נָבֶל désigne un instrument à cordes dont l’identification précise reste incertaine. « Harpe » est une désignation française traditionnelle et intelligible, accompagnée d’une note signalant l’incertitude.
- source_word: הִגָּיוֹן
  choice: au son mélodieux
  rationale: Dans cet environnement instrumental, le mot évoque probablement un son musical résonnant ou méditatif. « Au son mélodieux » rend naturellement le sens musical sans effacer entièrement sa nuance contemplative, explicitée en note.
- source_word: בְּכִנּוֹר
  choice: de la lyre
  rationale: כִּנּוֹר désigne un instrument à cordes, couramment rendu par « lyre ». La tournure « au son… de la lyre » exprime naturellement la valeur instrumentale de בְּ en français.
