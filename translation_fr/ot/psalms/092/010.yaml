  source_fidelity: La comparaison « ma corne comme celle d’un bœuf sauvage » rend fidèlement כִּרְאֵים קַרְנִי et conserve la métaphore. Toutefois, le parfait hébreu de וַתָּרֶם est mieux rendu ici par « tu as élevé » que par le présent « tu élèves ». Pour בַּלֹּתִי, « je suis arrosé » évoque plutôt l’aspersion et ne rend pas bien le sens débattu d’être humecté, imprégné ou mêlé à l’huile. « J’ai été imprégné » est plus proche de l’image sans imposer l’onction rituelle.
  naturalness: La formulation révisée est naturelle en français international moderne et garde un ton poétique digne. « Huile fraîche » est recevable dans ce contexte imagé.
  terminology: « Corne » doit être conservé comme métaphore. « Bœuf sauvage » est une solution traditionnelle et intelligible pour רְאֵם, à accompagner d’une note qui évite toute identification zoologique excessive. La note lexicale doit présenter « oint » comme interprétation contextuelle, non comme le seul sens du verbe.
