  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: fr
  text: Mais tu as élevé ma corne comme celle d’un bœuf sauvage[a] ; j’ai été imprégné d’huile fraîche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne probablement un bovidé sauvage puissant, traditionnellement rendu par « bœuf sauvage ». Certaines traductions anciennes portent « licorne ».
    reason: cultural_note
  - marker: b
    text: Le verbe hébreu est inhabituel et son sens exact est discuté. Il peut aussi évoquer le fait d’être humecté ou mêlé à de l’huile ; dans ce contexte, on le comprend parfois comme « j’ai été oint d’huile fraîche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: tu élèves
  rationale: Le verbe רום exprime l’action d’élever ou de porter en hauteur. Le présent poétique français rend naturellement l’action divine affirmée dans le contexte sans imposer une valeur temporelle plus précise que l’hébreu.
- source_word: כִּרְאֵים
  choice: comme celle du bœuf sauvage
  rationale: רְאֵם désigne un bovidé sauvage puissant. « Celle » indique clairement que la comparaison porte sur la corne, et « bœuf sauvage » évite le traditionnel mais trompeur « licorne ».
- source_word: קַרְנִי
  choice: ma corne
  rationale: La traduction littérale conserve la métaphore biblique de la force, de la dignité et de la puissance, sans l’interpréter à la place du lecteur.
- source_word: בַּלֹּתִי
  choice: je suis arrosé
  rationale: La forme rare issue de בלל peut évoquer le fait d’être humecté ou imprégné. « Arrosé » reste proche de cette image et évite de transformer sans certitude le verbe en terme technique d’onction; l’incertitude est signalée en note.
- source_word: בְּשֶׁמֶן
  choice: d’une huile
  rationale: La préposition et le nom indiquent la matière ou le moyen dont le psalmiste est arrosé ou imprégné. Cette tournure est idiomatique en français.
- source_word: רַעֲנָן
  choice: fraîche
  rationale: רַעֲנָן évoque la fraîcheur, la vigueur et l’abondance. Avec « huile », « fraîche » constitue une expression française naturelle tout en préservant l’image de vitalité.
theological_decisions:
- issue: Métaphore de la corne
  choice: Conserver « ma corne » comme image de force et d’élévation
  alternative: ma force ; ma puissance
  rationale: Le texte hébreu emploie une image concrète qui structure la comparaison avec le bovidé sauvage. La conserver respecte la poésie et évite d’en réduire la portée.
- issue: Sens de בַּלֹּתִי avec l’huile
  choice: Traduire « je suis arrosé » et signaler l’incertitude
  alternative: j’ai reçu l’onction ; je suis imprégné ; je suis mêlé
  rationale: Le verbe est inhabituel et son sens exact fait débat. Une formulation proche de l’idée d’humecter préserve l’ambiguïté lexicale et n’introduit pas nécessairement une cérémonie d’onction.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste claire pour un large public; les images de la corne et du bovidé sauvage sont conservées. Les marqueurs [a] et [b] figurent dans le texte principal et correspondent aux notes.
