  text: ט֗וֹב לְ/הֹד֥וֹת לַ/יהוָ֑ה וּ/לְ/זַמֵּ֖ר לְ/שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: fr
  text: Il est bon de remercier Yahvé[a] et de chanter en l’honneur de ton nom, Très-Haut !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom propre du Dieu d’Israël, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Précision sur le nom divin et indication du rendu traditionnel alternatif.
lexical_decisions:
- source_word: טוֹב
  choice: Il est bon
  rationale: L’adjectif prédicatif évalue les deux infinitifs; la tournure impersonnelle française exprime naturellement cette appréciation générale sans la réduire à ce qui est seulement agréable ou convenable.
- source_word: לְהוֹדוֹת
  choice: de remercier
  rationale: Dans ce contexte de culte, le hifil de ידה désigne l’action de rendre grâce. « Remercier » est idiomatique en français et maintient une nuance distincte de la louange chantée du second membre.
- source_word: לַיהוָה
  choice: Yahvé
  rationale: Le texte porte explicitement le nom divin יהוה. « Yahvé » est une forme française courante qui conserve le nom propre plutôt que de le remplacer par un titre.
- source_word: וּלְזַמֵּר
  choice: et de chanter les louanges
  rationale: Le piel de זמר évoque la louange musicale, souvent chantée. Cette formulation naturelle conserve à la fois l’idée du chant et sa finalité laudative sans imposer un accompagnement instrumental.
- source_word: לְשִׁמְךָ
  choice: de ton nom
  rationale: Le syntagme hébreu est conservé, car le « nom » porte une valeur révélatrice et réputationnelle importante et reste intelligible en français biblique moderne.
- source_word: עֶלְיוֹן
  choice: Très-Haut
  rationale: Le titre divin signifie « le Très-Haut ». La ponctuation et la position finale rendent clairement sa valeur vocative en français sans qu’il soit nécessaire d’ajouter l’interjection vieillie « ô ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le verset emploie le tétragramme comme nom propre. Le conserver sous la forme française « Yahvé » distingue ce nom du titre אֲדֹנָי et suit directement le témoignage du texte source.
- issue: Portée de « ton nom »
  choice: conserver l’expression littérale
  alternative: chanter tes louanges
  rationale: Remplacer « ton nom » par un simple pronom ou par « tes louanges » supprimerait une notion théologiquement significative du texte hébreu; la formulation littérale reste naturelle en français.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre « remercier » et « chanter les louanges » est maintenu; le vocatif final est rendu par la ponctuation plutôt que par « ô », plus solennel et vieilli.
