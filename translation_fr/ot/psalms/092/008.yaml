  text: וְ/אַתָּ֥ה מָר֗וֹם לְ/עֹלָ֥ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/008.yaml
  text: But you are on high forever[a], O Yahweh.
translation:
  language: fr
  text: Mais toi, Yahvé, tu es élevé pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom personnel de Dieu, traditionnellement rendu par « le Seigneur ».'
    reason: Précision sur la traduction du nom divin.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi, tu es
  rationale: Dans le contexte, la conjonction et le pronom indépendant marquent le contraste avec les méchants voués à disparaître. Le verbe « être », absent mais sous-entendu dans la proposition nominale hébraïque, est nécessaire en français.
- source_word: מָרוֹם
  choice: là-haut
  rationale: Cette expression conserve l’image de la hauteur et de l’élévation sans transformer le terme en titre divin (« le Très-Haut ») ni suggérer une action passive comme pourrait le faire « élevé ».
- source_word: לְ/עֹלָם
  choice: pour toujours
  rationale: Formulation française naturelle qui exprime la durée sans fin affirmée par le texte.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente le nom divin YHWH et préserve ici l’adresse directe plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה dans une adresse directe
  choice: Yahvé
  alternative: le Seigneur
  rationale: L’hébreu emploie explicitement le tétragramme. « Yahvé » préserve le caractère personnel du nom divin, tandis que « le Seigneur » correspond à la substitution traditionnelle par un titre.
- issue: Valeur de מָרוֹם
  choice: là-haut
  alternative: le Très-Haut
  rationale: Le mot décrit ici la position élevée de Dieu; le rendre comme un titre divin trancherait une ambiguïté et renforcerait la formulation au-delà de ce qu’exige la syntaxe.
translation_notes:
  register: Français international moderne, simple et digne. La reprise « toi, tu » rend naturellement l’emphase du pronom hébreu; « là-haut » maintient l’image poétique sans lourdeur.
