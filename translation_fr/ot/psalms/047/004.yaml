  text: He chooses for us our inheritance[a], the pride of Jacob, whom he loves[c][b]. Selah
translation:
  language: fr
  text: Il choisit pour nous notre héritage[a], la fierté de Jacob, qu’il aime[b]. Séla[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Il choisira pour nous notre héritage, la gloire de Jacob, qu’il aime. »'
    reason: lexical_alternative
  - marker: b
    text: 'La proposition « qu’il aime » peut aussi se rapporter à l’héritage, c’est-à-dire à la terre : « la fierté de Jacob, qu’il aime ».'
    reason: alternative_reading
  - marker: c
    text: « Séla » est un terme liturgique ou musical hébreu dont le sens précis demeure incertain; il est traditionnellement laissé sans traduction.
    reason: cultural_note
lexical_decisions:
- source_word: יִבְחַר
  choice: Il choisit
  rationale: L’imparfait qal peut exprimer une action présente ou habituelle, tout en permettant une nuance future. Le présent convient au contexte de célébration de l’action souveraine de Dieu; la possibilité du futur est signalée en note.
- source_word: לָנוּ
  choice: pour nous
  rationale: La préposition ל avec le suffixe de première personne du pluriel exprime ici l’avantage ou la destination.
- source_word: נַחֲלָתֵנוּ
  choice: notre héritage
  rationale: נחלה désigne un héritage ou une possession attribuée, souvent la terre reçue dans le cadre de l’alliance. « Héritage » conserve ces deux dimensions.
- source_word: אֶת ... אֶת
  choice: non traduits séparément
  rationale: Les deux occurrences marquent l’objet direct; la seconde introduit vraisemblablement une apposition qui précise « notre héritage ».
- source_word: גְּאוֹן
  choice: la fierté
  rationale: 'Le mot peut évoquer la fierté, la splendeur, la gloire ou la majesté. Ici, son sens est positif: il désigne ce qui fait la fierté de Jacob, probablement son héritage territorial.'
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom hébreu est conservé plutôt que remplacé par « Israël », même s’il représente collectivement le peuple.
- source_word: אֲשֶׁר אָהֵב
  choice: qu’il aime
  rationale: Le parfait אָהֵב peut décrire un état durable et se rendre naturellement au présent. En français, « qu’il aime » préserve aussi l’ambiguïté du rattachement de la proposition relative.
- source_word: סֶלָה
  choice: Séla
  rationale: Ce terme liturgique ou musical est de sens incertain; il est donc translittéré plutôt qu’interprété.
theological_decisions:
- issue: Référent de « qu’il aime »
  choice: Le rattachement à Jacob est privilégié dans l’analyse.
  alternative: La proposition peut se rapporter à l’héritage, c’est-à-dire à la terre aimée de Dieu.
  rationale: Jacob est le référent personnel le plus proche et l’amour de Dieu pour Jacob correspond à un langage biblique courant. Toutefois, l’hébreu autorise le rattachement à l’héritage; la formulation française et la note préservent cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise et poétique. « Fierté » exprime ici une valeur positive, non l’arrogance. La formulation « qu’il aime » maintient sans lourdeur l’ambiguïté du texte hébreu.
