lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est concis, naturel en français et conserve la fonction liturgique; la préposition ל est rendue par « au », sans exclure l’idée de destination.
- source_word: לִבְנֵי
  choice: Des fils de
  rationale: Dans les titres, la préposition ל peut exprimer l’appartenance, l’association, la destination ou l’attribution. « Des fils de » maintient une certaine ambiguïté sans affirmer explicitement qu’ils en sont les auteurs ou les destinataires.
- source_word: קֹרַח
  choice: Coré
  rationale: La forme française traditionnelle et largement reconnue du nom biblique קֹרַח est « Coré ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: מִזְמוֹר est le terme générique habituel pour un psaume; « Psaume » convient au style bref d’un titre français.
