source:
  edition: WLC
  text: כָּֽל הָ֭/עַמִּים תִּקְעוּ כָ֑ף הָרִ֥יעוּ לֵ֝/אלֹהִ֗ים בְּ/ק֣וֹל רִנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/001.yaml
  text: Clap your hands[a], all peoples[b]; shout to God with a voice of joy.
translation:
  language: fr
  text: Battez des mains, tous les peuples[a] ; acclamez Dieu par des cris de joie[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Toutes les nations ». Le mot hébreu עַמִּים peut désigner des peuples au sens ethnique ou collectif, ou plus largement des nations.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’une voix joyeuse » ou « au son des réjouissances ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: Tous les peuples
  rationale: « Peuples » conserve le pluriel collectif et ethnique de עַמִּים, sans lui donner nécessairement le sens politique moderne de « nations ». La portée universelle de כָּל est maintenue.
- source_word: תִּקְעוּ כָף
  choice: battez des mains
  rationale: Cette tournure française naturelle rend l’expression idiomatique hébraïque qui décrit le fait de frapper la paume, ici comme geste collectif de célébration.
- source_word: הָרִיעוּ
  choice: acclamez
  rationale: Le hiphil impératif de רוע évoque un grand cri de joie ou d’acclamation. « Acclamez » exprime à la fois l’intensité sonore et l’orientation honorifique du cri.
- source_word: לֵאלֹהִים
  choice: Dieu
  rationale: Avec « acclamez », le complément direct français rend naturellement le ל hébreu, qui indique ici le destinataire de l’acclamation.
- source_word: בְּקוֹל רִנָּה
  choice: par des cris de joie
  rationale: Cette expression idiomatique restitue קוֹל comme manifestation sonore et רִנָּה comme jubilation exprimée à haute voix, sans la réduire à un simple sentiment intérieur.
theological_decisions:
- issue: Portée de l’appel adressé aux peuples
  choice: Le verset appelle universellement tous les peuples à louer Dieu.
  alternative: L’appel viserait rhétoriquement seulement les nations voisines d’Israël.
  rationale: Le texte hébreu dit explicitement « tous les peuples » ; le contexte royal du psaume appuie un appel universel à reconnaître la royauté de Dieu, sans qu’il soit nécessaire d’en restreindre la portée.
translation_notes:
  register: Français international moderne, naturel et digne. « Battez des mains » et « acclamez » donnent au verset un rythme vif adapté à l’exhortation poétique, tandis que « cris de joie » conserve sa dimension sonore et jubilatoire.
