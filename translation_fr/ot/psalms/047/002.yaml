source:
  edition: WLC
  text: כִּֽי יְהוָ֣ה עֶלְי֣וֹן נוֹרָ֑א מֶ֥לֶךְ גָּ֝דוֹל עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/002.yaml
  text: For Yahweh Most High is to be feared[a], a great King over all the earth.
translation:
  language: fr
  text: Car Yahweh, le Très-Haut, est redoutable[a], un grand roi sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « digne d’être craint » ou « inspire la crainte ». Le mot hébreu présente Yahweh comme celui qui suscite une crainte profonde, mêlée de respect et de saisissement.
    reason: Alternative lexicale destinée à préserver toute la nuance de נוֹרָא.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à la louange dans le contexte et conserve naturellement la valeur causale en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Rend le titre divin et sa valeur superlative dans une formulation française établie et naturelle.
- source_word: נוֹרָא
  choice: est redoutable
  rationale: Exprime le fait que Yahweh suscite crainte et profond respect, sans réduire le terme à la seule terreur.
- source_word: מֶלֶךְ גָּדוֹל
  choice: un grand roi
  rationale: Conserve directement l’image royale ainsi que l’idée de grandeur et de majesté.
- source_word: עַל כָּל הָאָרֶץ
  choice: sur toute la terre
  rationale: Dans ce contexte de royauté universelle, אֶרֶץ désigne au mieux la terre entière plutôt qu’un territoire particulier.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ou Jéhovah
  rationale: Le texte emploie explicitement le tétragramme; sa transcription préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Nuance de נוֹרָא appliqué à Dieu
  choice: est redoutable
  alternative: est digne d’être craint ou inspire la crainte
  rationale: « Redoutable » maintient la tension entre crainte, respect et saisissement devant Dieu; la note explicite cette amplitude sémantique sans la résoudre abusivement.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste proche du parallélisme hébreu tout en étant naturelle; « le Très-Haut » fonctionne comme titre divin en apposition.
