id: PSA.47.9
reference: Psalms 47:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: fr
  text: Les nobles des peuples se sont rassemblés comme peuple du Dieu d’Abraham[a], car les boucliers de la terre appartiennent à Dieu[b] ; il est souverainement élevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec le peuple du Dieu d’Abraham ». L’expression hébraïque, très condensée, peut indiquer l’identification ou une étroite association.
    reason: alternative_reading
  - marker: b
    text: Ou « les dirigeants de la terre » ; littéralement « les boucliers de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי
  choice: les nobles de
  rationale: Le terme désigne couramment des personnes de haut rang, des notables ou des princes. « Nobles » reste naturel en français et correspond au contexte des dirigeants évoqués plus loin par l’image des boucliers.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel renvoie à plusieurs collectivités humaines. « Peuples » conserve cette dimension humaine et collective sans imposer le sens plus politique de « nations ».
- source_word: נֶאֱסָפוּ
  choice: se sont rassemblés
  rationale: Le niphal de אסף exprime ici le rassemblement. Le passé composé rend naturellement la déclaration poétique en français moderne.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: comme peuple du Dieu d’Abraham
  rationale: La construction hébraïque est très condensée et ne comporte pas de préposition explicite. « Comme peuple » exprime prudemment une identification possible des nobles rassemblés avec le peuple du Dieu d’Abraham, tandis qu’une note conserve la lecture associative.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le fondement de l’affirmation précédente. « Car » en restitue la valeur explicative dans un registre digne et courant.
- source_word: לֵאלֹהִים
  choice: appartiennent à Dieu
  rationale: La préposition ל marque ici l’appartenance. Cette formulation est explicite et idiomatique en français.
- source_word: מָגִנֵּי אֶרֶץ
  choice: les boucliers de la terre
  rationale: La traduction conserve l’image hébraïque forte. Dans ce contexte, les « boucliers » peuvent désigner métaphoriquement les dirigeants ou protecteurs du monde, possibilité signalée en note.
- source_word: מְאֹד נַעֲלָה
  choice: il est souverainement élevé
  rationale: Le verbe masculin singulier a vraisemblablement Dieu pour sujet implicite. « Élevé » convient au langage de louange du psaume, et « souverainement » rend l’intensité de מְאֹד sans suggérer un déplacement matériel.
theological_decisions:
- issue: Relation des nobles des peuples avec le peuple du Dieu d’Abraham
  choice: Ils sont présentés comme rassemblés « comme peuple » du Dieu d’Abraham.
  alternative: Ils se rassemblent « avec le peuple » du Dieu d’Abraham.
  rationale: L’hébreu juxtapose les expressions sans préciser leur rapport syntaxique. Le contexte universel du psaume favorise l’identification, mais la note préserve la lecture d’une association étroite sans trancher davantage la portée théologique.
- issue: Référent du sujet dans la proposition finale
  choice: Le pronom « il » renvoie à Dieu.
  alternative: Comprendre la forme verbale de manière plus littérale comme « il s’est beaucoup élevé » ou laisser le sujet moins explicite.
  rationale: Le masculin singulier et la mention immédiatement précédente de Dieu rendent ce référent naturel. La formulation ne développe aucune conclusion doctrinale au-delà de l’exaltation divine affirmée par le verset.
translation_notes:
  register: Français international moderne, poétique et digne sans archaïsmes. La métaphore des « boucliers » est maintenue dans le texte, tandis que l’ambiguïté syntaxique concernant le rassemblement des peuples est conservée au moyen d’une formulation mesurée et d’une note.
