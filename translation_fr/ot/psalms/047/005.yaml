  text: עָלָ֣ה אֱ֭לֹהִים בִּ/תְרוּעָ֑ה יְ֝הֹוָ֗ה בְּ/ק֣וֹל שׁוֹפָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: fr
  text: Dieu est monté au milieu des acclamations[a] ; Yahweh, au son du shofar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’est élevé ».
    reason: lexical_alternative
  - marker: b
    text: Le shofar est une trompe en corne, traditionnellement une corne de bélier.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: est monté
  rationale: Le verbe signifie « monter, s’élever ». Le passé composé convient à cette proclamation poétique sans imposer une lecture théologique ultérieure.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le parallèle avec יהוה montre qu’il s’agit ici du Dieu d’Israël ; le singulier français est donc requis.
- source_word: בִּתְרוּעָה
  choice: au milieu des acclamations
  rationale: תְּרוּעָה désigne une clameur forte, notamment une acclamation cultuelle ou victorieuse. Cette formulation garde le sens large sans préciser indûment qu’il s’agit d’un cri de joie ou de guerre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: בְּקוֹל
  choice: au son du
  rationale: Avec un instrument, קוֹל se rend naturellement en français par « son » ; la préposition peut exprimer l’accompagnement sonore.
- source_word: שׁוֹפָר
  choice: shofar
  rationale: Le terme français « shofar » désigne précisément la trompe de corne employée pour les signaux et le culte, tandis qu’une note en explicite la réalité culturelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée potentiellement christologique du mouvement ascendant
  choice: Dieu est monté
  alternative: Dieu s’est élevé
  rationale: Le psaume évoque la royauté et l’intronisation de Dieu. « Est monté » conserve l’image hébraïque sans imposer une référence christologique ultérieure ; l’autre sens possible est signalé en note.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu est conservé au moyen du point-virgule et de l’ellipse verbale dans le second membre.
