source:
  edition: WLC
  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: fr
  text: 'Il soumet des peuples à notre autorité[a],

    et des nations sous nos pieds.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous nous ». On peut aussi traduire : « Il place des peuples sous notre domination. » Le verbe hébreu signifie ici « soumettre », et non « parler ».'
    reason: Précision lexicale et traduction littérale alternative.
lexical_decisions:
- source_word: יַדְבֵּר
  choice: Il soumet
  rationale: Dans ce contexte, la forme verbale exprime l’action de mettre en sujétion, comme le confirme le parallèle « sous nos pieds »; elle ne signifie pas « parler ».
- source_word: עַמִּים
  choice: des peuples
  rationale: « Peuples » rend naturellement le pluriel de עַם et maintient une distinction lexicale avec לְאֻמִּים dans le second membre.
- source_word: תַּחְתֵּינוּ
  choice: à notre autorité
  rationale: Littéralement « sous nous »; en français actuel, « à notre autorité » exprime clairement la relation de sujétion tout en évitant une tournure peu naturelle.
- source_word: וּלְאֻמִּים
  choice: et des nations
  rationale: « Nations » préserve la variation poétique avec « peuples » et convient au cadre royal et collectif du psaume.
- source_word: תַּחַת רַגְלֵינוּ
  choice: sous nos pieds
  rationale: La traduction littérale est aussi idiomatique en français et conserve l’image traditionnelle de la conquête et de la domination.
theological_decisions:
- issue: Voix collective et agent de la soumission
  choice: Dieu est le sujet implicite de « Il soumet » et agit en faveur du groupe qui parle en disant « notre » et « nos ».
  alternative: Comprendre le verset comme une affirmation générale des victoires militaires d’Israël.
  rationale: Le contexte immédiat attribue à Dieu la royauté et la victoire. La traduction conserve la première personne du pluriel et l’image de la soumission sans les atténuer ni leur imposer une interprétation théologique ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébraïque est conservé sur deux lignes; « à notre autorité » rend idiomatiquement le premier emploi de « sous », tandis que « sous nos pieds » préserve l’image forte du second membre.
