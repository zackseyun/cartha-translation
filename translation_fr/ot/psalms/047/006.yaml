  text: זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ זַמְּר֖וּ לְ/מַלְכֵּ֣/נוּ זַמֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: fr
  text: Chantez à Dieu[a], chantez ; chantez à notre Roi, chantez !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Faites de la musique pour Dieu… faites de la musique pour notre Roi ». Le verbe hébreu peut désigner plus largement la louange musicale, et pas seulement le chant.
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: Célébrez… par vos chants / célébrez-le
  rationale: Le verbe זמר appelle ici à une louange musicale. Cette formulation française naturelle conserve la dimension chantée et reproduit la quadruple répétition du verbe hébreu, avec les pronoms requis par la syntaxe française.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte de louange directe, אֱלֹהִים désigne le Dieu d’Israël et se rend naturellement au singulier par « Dieu ».
- source_word: לְמַלְכֵּנוּ
  choice: notre Roi
  rationale: Le לְ marque le destinataire de la louange. En français, « célébrez notre Roi » exprime naturellement cette orientation sans devoir rendre la préposition séparément. La majuscule signale un titre divin, conformément au contexte.
theological_decisions:
- issue: Titre de royauté divine
  choice: notre Roi
  alternative: notre roi
  rationale: Le contexte immédiat célèbre Dieu comme roi de toute la terre. La majuscule traite donc « Roi » comme un titre divin sans ajouter d’idée étrangère au psaume.
translation_notes:
  register: Français international moderne, accessible et digne. Le parallélisme et la quadruple injonction de l’hébreu sont conservés; les points d’exclamation rendent l’élan liturgique sans modifier le sens.
