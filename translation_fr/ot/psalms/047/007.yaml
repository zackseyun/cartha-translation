source:
  edition: WLC
  text: כִּ֤י מֶ֖לֶךְ כָּל הָ/אָ֥רֶץ אֱלֹהִ֗ים זַמְּר֥וּ מַשְׂכִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: fr
  text: Car Dieu est roi de toute la terre ; chantez avec discernement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chantez avec intelligence », « chantez avec art », ou peut-être « chantez un maskil », terme musical ou littéraire dont le sens précis est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à célébrer Dieu dans le contexte précédent et conserve naturellement la valeur explicative ou causale de la conjonction.
- source_word: מֶלֶךְ כָּל הָאָרֶץ
  choice: roi de toute la terre
  rationale: Rend directement la construction hébraïque et maintient la portée universelle de la royauté divine sans l’élargir ni la restreindre.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le terme désigne ici, avec un sens singulier, le Dieu d’Israël.
- source_word: זַמְּרוּ
  choice: chantez
  rationale: L’impératif pluriel appelle à célébrer Dieu par le chant ou la musique ; « chantez » est concis, naturel et adapté au contexte du psaume.
- source_word: מַשְׂכִּיל
  choice: avec discernement
  rationale: Cette lecture adverbiale exprime l’idée d’intelligence ou de discernement tout en restant naturelle en français. Le terme pouvant aussi évoquer l’habileté ou désigner un genre poétique et musical, ces possibilités sont conservées en note.
theological_decisions:
- issue: Portée de la royauté divine
  choice: Dieu est présenté comme roi de toute la terre, dans un sens universel.
  alternative: Comprendre אֶרֶץ comme « pays » ou « territoire », avec une portée plus locale.
  rationale: Dans ce psaume, la formulation et le contexte soutiennent naturellement la portée universelle ; la traduction ne doit pas la réduire à un territoire particulier.
- issue: Sens de מַשְׂכִּיל dans l’appel au chant
  choice: 'Lecture adverbiale : chanter avec discernement.'
  alternative: 'Lecture comme terme musical ou littéraire : chanter un « maskil », ou un psaume composé avec art.'
  rationale: La forme hébraïque demeure difficile à trancher. Le texte principal retient une lecture intelligible et proche de la syntaxe, tandis que la note préserve les autres possibilités sans imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, sobre et digne. « Car » maintient le lien logique avec le contexte ; « roi de toute la terre » conserve la formulation universelle. La ponctuation française emploie une espace avant le point-virgule, et la note signale honnêtement l’ambiguïté du dernier mot hébreu.
