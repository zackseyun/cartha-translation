source:
  edition: WLC
  text: מָלַ֣ךְ אֱ֭לֹהִים עַל גּוֹיִ֑ם אֱ֝לֹהִ֗ים יָשַׁ֤ב עַל כִּסֵּ֬א קָדְשֽׁ/וֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/008.yaml
  text: God reigns over the nations[a]; God sits on his holy throne.
translation:
  language: fr
  text: Dieu règne sur les nations[a] ; Dieu siège sur son trône saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu est devenu roi sur les nations ; Dieu a pris place sur son trône saint. » Les verbes hébreux au parfait peuvent souligner l’établissement de son règne.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: règne
  rationale: Le qatal peut exprimer ici, dans une proclamation poétique, un état présent résultant. « Règne » rend naturellement la royauté actuelle de Dieu sans exclure la nuance possible d'une entrée en règne.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, la forme morphologiquement plurielle désigne sans ambiguïté le Dieu unique. La répétition dans les deux membres est conservée pour respecter l'emphase poétique.
- source_word: עַל
  choice: sur
  rationale: Avec le verbe « régner », « sur » exprime naturellement en français l'autorité exercée à l'égard des nations.
- source_word: גּוֹיִם
  choice: les nations
  rationale: « Les nations » désigne ici collectivement les peuples et évite les connotations plus tardives que pourrait introduire « les païens ».
- source_word: יָשַׁב
  choice: siège
  rationale: Le verbe signifie littéralement « s'asseoir, être assis ». Devant « sur son trône », « siège » est idiomatique, digne et fait naturellement ressortir l'image de l'intronisation.
- source_word: כִּסֵּא
  choice: trône
  rationale: Dans ce contexte royal et divin, « trône » est le sens précis du terme.
- source_word: קָדְשׁוֹ
  choice: son trône saint
  rationale: Littéralement « le trône de sa sainteté ». La tournure adjectivale française conserve le sens tout en restant naturelle ; « saint » convient au registre biblique et à la sainteté divine.
theological_decisions:
- issue: La royauté divine exprimée par des verbes hébreux au qatal
  choice: 'Proclamation au présent : « Dieu règne… Dieu siège… »'
  alternative: 'Lecture perfective ou ingressive : « Dieu est devenu roi… Dieu a pris place… »'
  rationale: Le psaume acclame la royauté universelle actuelle de Dieu. Le présent français communique au mieux cette réalité continue, tandis que la note conserve la possibilité que les formes verbales soulignent l'établissement de son règne.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la répétition de « Dieu » sont conservés. « Siège » évite la lourdeur de « est assis » tout en maintenant l'image royale.
