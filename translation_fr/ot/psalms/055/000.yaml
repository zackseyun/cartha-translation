  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: fr
  text: 'Au chef de chœur : avec des instruments à cordes. Maskil[a] de David[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « psaume instructif » ou « chant méditatif » ; le sens précis de « maskil » dans les titres des psaumes est incertain.
    reason: lexical_alternative
  - marker: b
    text: L’expression « de David » peut aussi signifier « par David » ou « pour David ».
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne vraisemblablement le responsable de l’exécution musicale. « Chef de chœur » est courant, digne et adapté au contexte liturgique; le préfixe ל est rendu par « au ».
- source_word: בִּנְגִינֹת
  choice: Avec instruments à cordes
  rationale: Le terme renvoie ici à un accompagnement sur instruments à cordes. « Avec » restitue naturellement la valeur instrumentale de la préposition בּ.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Il s’agit d’un terme technique propre aux titres de psaumes, dont le sens exact demeure incertain. La translittération évite de trancher entre les idées d’instruction et de méditation.
- source_word: לְדָוִד
  choice: de David
  rationale: La construction peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette amplitude que « par David ».
theological_decisions:
- issue: Rapport de David au psaume exprimé par לְדָוִד
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu n’impose pas ici une seule relation précise. La formulation retenue préserve l’ambiguïté du titre sans affirmer plus explicitement l’auteur direct.
translation_notes:
  register: Français international moderne, concis et digne, conforme au style d’un titre psalmique. Les deux marqueurs sont placés immédiatement après les expressions qu’ils expliquent.
