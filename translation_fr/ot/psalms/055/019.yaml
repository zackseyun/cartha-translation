source:
  edition: WLC
  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: fr
  text: Dieu entendra et leur répondra[a], lui qui siège depuis toujours. Séla. Car ils ne connaissent aucun changement[b] et ne craignent pas Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les humiliera » ou « les affligera ». Selon une autre analyse du verbe hébreu, le contexte peut évoquer une intervention punitive de Dieu.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ils ne connaissent aucun revers ». L’expression hébraïque est difficile ; elle peut désigner une situation stable et paisible qui nourrit leur insouciance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: entendra
  rationale: L’imparfait qal peut exprimer ici l’avenir; dans cette prière, il traduit l’assurance que Dieu interviendra.
- source_word: אֵל
  choice: Dieu
  rationale: Ce titre divin poétique se rend naturellement par « Dieu » en français.
- source_word: וְיַעֲנֵם
  choice: leur répondra
  rationale: La forme peut être comprise à partir de ענה, « répondre », lecture directement compatible avec la vocalisation massorétique; le contexte de jugement permet toutefois aussi une compréhension punitive, signalée en note.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: lui qui siège depuis toujours
  rationale: Le participe יֹשֵׁב peut évoquer la demeure ou la position souveraine de Dieu; « siège » conserve cette nuance royale, tandis que קֶדֶם indique son existence et son règne depuis les temps anciens.
- source_word: סֶלָה
  choice: Séla
  rationale: La translittération traditionnelle est conservée, car la fonction exacte du terme reste incertaine.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: car ils ne connaissent aucun changement
  rationale: חֲלִיפוֹת désigne des changements, alternances ou revers de situation. La formulation française reste assez générale pour préserver la difficulté de l’expression.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: et ne craignent pas Dieu
  rationale: Le parfait hébreu décrit ici leur attitude établie; le présent français en exprime naturellement la permanence.
theological_decisions:
- issue: Sens de ענה dans le second verbe
  choice: Dieu leur répondra
  alternative: Dieu les humiliera ou les affligera
  rationale: La vocalisation massorétique permet naturellement le sens « répondre », sans exclure, dans ce contexte de jugement contre les méchants, une interprétation punitive. La note maintient cette tension sans la trancher silencieusement.
- issue: Nature des « changements » absents
  choice: absence générale de changement dans leur situation
  alternative: absence de revers ou de bouleversements qui les corrigeraient
  rationale: Le texte ne précise pas quels changements sont visés. La traduction conserve cette indétermination, tandis que la note indique l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, sobre et poétique. « Depuis toujours » rend l’ancienneté souveraine de Dieu dans une langue courante et digne. La phrase est divisée autour de « Séla » afin de respecter la pause liturgique sans imposer une fonction précise au terme.
