source:
  edition: WLC
  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: fr
  text: Car ce n’est pas un ennemi qui m’insulte — je pourrais alors le supporter[a] ; ce n’est pas quelqu’un qui me hait qui s’élève contre moi — je pourrais alors me cacher de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me couvre de reproches » ou « me raille ». Le verbe hébreu désigne un outrage verbal méprisant.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la plainte dans le contexte immédiat et convient au mouvement poétique.
- source_word: אוֹיֵב
  choice: ennemi
  rationale: Équivalent français courant et direct pour un adversaire hostile.
- source_word: יְחָרְפֵנִי
  choice: qui m’insulte
  rationale: Le verbe חרף désigne un outrage verbal empreint de mépris ; « insulte » est naturel et suffisamment large en français moderne.
- source_word: וְאֶשָּׂא
  choice: je pourrais alors le supporter
  rationale: נשׂא signifie ici endurer ou supporter. La tournure modale rend naturellement la situation irréelle implicite ; « le » reprend l’outrage.
- source_word: מְשַׂנְאִי
  choice: quelqu’un qui me hait
  rationale: Rend le participe substantivé de manière idiomatique tout en conservant sa dimension personnelle.
- source_word: עָלַי הִגְדִּיל
  choice: qui s’élève contre moi
  rationale: Rend l’idée de se grandir avec arrogance contre quelqu’un sans imposer une formulation artificielle en français.
- source_word: וְאֶסָּתֵר
  choice: je pourrais alors me cacher
  rationale: Le niphal exprime le fait de se cacher ; le conditionnel potentiel restitue la structure irréelle du verset.
- source_word: מִמֶּנּוּ
  choice: loin de lui
  rationale: Exprime idiomatiquement l’éloignement recherché par celui qui se cache, tout en correspondant à la préposition מן.
theological_decisions: []
