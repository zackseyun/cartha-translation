  yaml_path: translation/ot/psalms/055/007.yaml
  text: Look[a], I would wander far away; I would lodge in the wilderness[c][b]. Selah
translation:
  language: fr
  text: Voici, j’irais errer au loin[a] ; je passerais la nuit dans le désert[b]. Séla[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je m’éloignerais en fuyant » ou « je partirais loin ». L’hébreu associe un verbe exprimant l’éloignement à un infinitif dont la racine peut évoquer l’errance ou la fuite.
    reason: lexical_alternative
  - marker: b
    text: Ou « je logerais dans le désert ».
    reason: lexical_alternative
  - marker: c
    text: « Séla » est traditionnellement laissé sans traduction. Son sens précis demeure incertain ; il pourrait s’agir d’une indication musicale ou liturgique.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec dignité et concision l’introduction insistante de l’énoncé ; « voici » reste naturel dans le registre poétique biblique français.
- source_word: אַרְחִיק נְדֹד
  choice: je m’enfuirais au loin
  rationale: Le verbe d’éloignement accompagné de l’infinitif de נדד exprime un départ vers une grande distance, avec une nuance possible de fuite ou d’errance. Cette formulation rend naturellement l’élan d’évasion dans le contexte.
- source_word: אָלִין
  choice: je passerais la nuit
  rationale: Le verbe לין désigne concrètement le fait de loger ou de passer la nuit ; cette expression est plus courante et précise en français moderne que « je logerais ».
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région inhabitée, aride ou sauvage. « Désert » est ici idiomatique et conserve l’image d’un lieu isolé, sans imposer nécessairement celle de dunes de sable.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens exact du terme est incertain ; sa translittération traditionnelle préserve cette incertitude plutôt que d’en proposer une traduction conjecturale.
