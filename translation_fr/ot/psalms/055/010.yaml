  text: Day and night they go around her on her walls[b][a], and trouble and misery are within her.
translation:
  language: fr
  text: Jour et nuit, ils font le tour de la ville sur ses murailles[a] ; le mal et l’oppression sont en son sein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils l’encerclent sur ses murailles ». Le verbe hébreu peut exprimer aussi bien le fait de tourner autour que celui d’encercler.'
    reason: lexical_alternative
  - marker: b
    text: '« Le mal et l’oppression » peuvent aussi se traduire par « l’iniquité et le malheur » ou « les maux et la peine » : les mots hébreux peuvent désigner à la fois le mal commis et la souffrance qu’il produit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Jour et nuit
  rationale: Expression temporelle idiomatique qui évoque une activité continuelle ; cette formulation est naturelle et concise en français moderne.
- source_word: יְסוֹבְבֻהָ
  choice: ils font le tour de la ville
  rationale: Le verbe סבב peut signifier « faire le tour » ou « encercler ». La formulation retenue conserve l’idée de mouvement sans déterminer davantage le sujet pluriel, implicite dans le contexte. « De la ville » explicite seulement l’antécédent féminin pour éviter en français une ambiguïté artificielle.
- source_word: עַל חוֹמֹתֶיהָ
  choice: sur ses murailles
  rationale: עַל signifie normalement « sur ». « Murailles » convient au cadre d’une ville fortifiée et conserve l’image concrète du texte.
- source_word: אָוֶן
  choice: le mal
  rationale: אָוֶן peut désigner le mal moral, l’iniquité ou les maux qui en résultent. « Le mal » garde cette amplitude sémantique sans la réduire à la seule souffrance.
- source_word: עָמָל
  choice: l’oppression
  rationale: עָמָל peut évoquer peine, malheur, trouble ou action oppressive. Dans la description sociale de la ville, « oppression » exprime bien le tort infligé tout en restant distinct de אָוֶן.
- source_word: בְּקִרְבָּהּ
  choice: au-dedans d’elle règnent
  rationale: Littéralement « en son sein ». « Au-dedans d’elle » préserve la personnification féminine de la ville ; « règnent » rend naturellement en français la proposition nominale hébraïque.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La ville est explicitée dans le premier membre puis personnifiée par « elle ». La traduction conserve l’ambiguïté du sujet pluriel et signale en notes les principales possibilités lexicales.
