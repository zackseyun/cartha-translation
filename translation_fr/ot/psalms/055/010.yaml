  source_fidelity: Le texte rend correctement le couple temporel יוֹמָם וָלַיְלָה, le sujet pluriel non exprimé, le mouvement de סבב, l’image des murailles et les deux réalités négatives présentes « en son sein ». « Le mal et l’oppression » est un choix défendable pour אָוֶן וְעָמָל, sans réduire indûment leur champ sémantique. La formulation révisée évite toutefois d’ajouter l’idée de domination contenue dans « règnent », absente de la phrase nominale hébraïque.
