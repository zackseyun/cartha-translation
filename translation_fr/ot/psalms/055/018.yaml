  text: פָּ֘דָ֤ה בְ/שָׁל֣וֹם נַ֭פְשִׁ/י מִ/קֲּרָב לִ֑/י כִּֽי בְ֝/רַבִּ֗ים הָי֥וּ עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/018.yaml
  text: He has redeemed my soul in peace from the battle against me[a], for many were with me.
translation:
  language: fr
  text: Il a délivré mon âme en paix du combat contre moi[a], car ils étaient nombreux avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour la fin : « car ils étaient nombreux contre moi ». Littéralement, l’hébreu dit : « car ils étaient nombreux avec moi »; dans ce contexte, cette expression peut désigner idiomatiquement de nombreux adversaires.'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּדָה
  choice: a délivré
  rationale: Le verbe désigne la libération ou le rachat par un acte de secours. « A délivré » est naturel ici en français et conserve l’idée forte d’arrachement au danger, sans suggérer nécessairement le paiement d’une rançon.
- source_word: בְשָׁלוֹם
  choice: dans la paix
  rationale: Cette formulation directe préserve les nuances de paix, d’intégrité et de bien-être portées par שָׁלוֹם.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: « Mon âme » maintient l’image et le registre poétiques de l’hébreu, tout en pouvant désigner la personne ou la vie entière.
- source_word: מִקֲּרָב לִי
  choice: loin du combat contre moi
  rationale: קְרָב évoque un combat ou une bataille. « Contre moi » exprime naturellement la valeur contextuelle de לִי, tandis que « loin de » rend la séparation produite par מִן.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit avec naturel l’explication donnée par le dernier membre du verset.
- source_word: בְרַבִּים הָיוּ
  choice: ils étaient nombreux
  rationale: Cette formulation française concise reflète l’idée de pluralité contenue dans בְרַבִּים avec le verbe הָיוּ.
- source_word: עִמָּדִי
  choice: avec moi
  rationale: Le sens ordinaire de la préposition est « avec moi ». Le conserver dans le texte principal respecte la formulation hébraïque et son ambiguïté contextuelle.
theological_decisions:
- issue: Interprétation de la proposition finale בְרַבִּים הָיוּ עִמָּדִי
  choice: car ils étaient nombreux avec moi
  alternative: car ils étaient nombreux contre moi
  rationale: La préposition עִמָּדִי signifie le plus directement « avec moi », alors que le contexte de conflit permet de comprendre les nombreux personnages comme des adversaires. Le texte principal maintient la tension de l’hébreu; la lecture adversative est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible tout en conservant « mon âme », « dans la paix » et l’ambiguïté de « avec moi ».
