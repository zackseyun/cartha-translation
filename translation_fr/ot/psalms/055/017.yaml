source:
  edition: WLC
  text: עֶ֤רֶב וָ/בֹ֣קֶר וְ֭/צָהֳרַיִם אָשִׂ֣יחָה וְ/אֶהֱמֶ֑ה וַ/יִּשְׁמַ֥ע קוֹלִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/017.yaml
  text: Evening[a], morning, and noon I complain and groan[c][b], and he hears my voice.
translation:
  language: fr
  text: Le soir, le matin et à midi, je me plains et je gémis[a], et il entend ma voix[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je médite et je murmure ». Le premier verbe peut signifier parler, méditer ou se plaindre ; dans cette lamentation, le sens de plainte paraît le plus probable.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit simplement « il entend ma voix » ; d’après le contexte, le pronom désigne Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: Le soir, le matin et à midi
  rationale: Cette formulation naturelle en français conserve la suite ternaire des moments de la journée et la cadence poétique de l’hébreu.
- source_word: אָשִׂיחָה
  choice: je me plains
  rationale: Le verbe שׂיח peut exprimer la méditation, la parole ou la plainte. Dans ce contexte de détresse, et en parallèle avec le verbe suivant, « je me plains » rend le mieux la lamentation exprimée à voix haute.
- source_word: וְאֶהֱמֶה
  choice: et je gémis
  rationale: Le verbe המה évoque ici une agitation audible, un grondement ou un gémissement. « Je gémis » est idiomatique et convient au registre de la lamentation.
- source_word: וַיִּשְׁמַע
  choice: et il entend
  rationale: 'Dans ce contexte poétique, la forme verbale peut exprimer avec assurance une action présente ou habituelle : Dieu entend la voix du psalmiste.'
- source_word: קוֹלִי
  choice: ma voix
  rationale: Traduction directe et naturelle de קוֹלִי, qui préserve le caractère audible et personnel de la supplication.
theological_decisions:
- issue: Sujet implicite de וַיִּשְׁמַע
  choice: « il », désignant Dieu selon le contexte
  alternative: « le Seigneur entend ma voix »
  rationale: L’hébreu ne nomme pas explicitement le sujet dans ce verset. Le contexte l’identifie comme Dieu, mais conserver le pronom évite d’ajouter un nom divin absent du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La triple indication temporelle garde un rythme équilibré ; « se plaindre » et « gémir » rendent la lamentation audible sans l’exagérer.
