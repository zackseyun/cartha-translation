  text: Fear and trembling come upon me[a], and horror covers me.
translation:
  language: fr
  text: La peur et le tremblement viennent sur moi[a], et l’épouvante me couvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la terreur me couvre » ou « le frisson me couvre ».'
    reason: פַּלָּצוּת peut désigner l’épouvante, la terreur ou un frisson d’horreur ; la note préserve les principales nuances lexicales attestées.
lexical_decisions:
- source_word: יִרְאָה
  choice: la peur
  rationale: Le nom désigne la peur ou l’effroi. « La peur » est direct, naturel et forme avec « le tremblement » une expression claire en français.
- source_word: וָרַעַד
  choice: et le tremblement
  rationale: Le terme évoque le fait de trembler physiquement sous l’effet de la terreur. « Le tremblement » conserve à la fois la manifestation corporelle et sa dimension émotionnelle.
- source_word: יָבֹא בִי
  choice: m’envahissent
  rationale: Littéralement, l’expression signifie « viennent en moi ». « M’envahissent » rend naturellement l’idée d’une expérience qui pénètre et saisit le psalmiste; le pluriel respecte les deux sujets coordonnés en français.
- source_word: וַתְכַסֵּנִי
  choice: et m’enveloppe
  rationale: Le verbe signifie fondamentalement « couvrir ». Avec un sentiment abstrait comme sujet, « m’enveloppe » préserve la métaphore tout en étant plus idiomatique que « me couvre » en français.
- source_word: פַּלָּצוּת
  choice: l’épouvante
  rationale: Le nom exprime une terreur intense pouvant faire frissonner. « L’épouvante » convient à cette intensité et évite de répéter « peur ».
