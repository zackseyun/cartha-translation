source:
  edition: WLC
  text: בַּלַּ֣ע אֲ֭דֹנָ/י פַּלַּ֣ג לְשׁוֹנָ֑/ם כִּֽי רָאִ֨יתִי חָמָ֖ס וְ/רִ֣יב בָּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/009.yaml
  text: Confuse them[a], Lord; divide their speech[b], for I have seen violence and strife in the city.
translation:
  language: fr
  text: Engloutis-les[a], Seigneur ; divise leur langue[b], car j’ai vu la violence et la discorde dans la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Confonds-les, Seigneur » ou « Détruis-les, Seigneur ». Le verbe hébreu signifie littéralement « avaler, engloutir », mais il peut ici demander que leurs projets soient ruinés par la confusion.
    reason: alternative_reading
  - marker: b
    text: Littéralement « divise leur langue » ; c’est-à-dire désorganise leur parole commune ou leur capacité à se comprendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּע
  choice: Engloutis-les
  rationale: Le verbe signifie d’abord « avaler, engloutir » et peut, dans ce contexte imprécatoire, évoquer la destruction ou la mise en déroute. Le rendu littéral conserve l’image hébraïque et l’ambiguïté, tandis que la note signale le sens contextuel possible « mets-les en confusion ».
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin Adonaï, rendu naturellement par « Seigneur », et non du nom divin YHWH.
- source_word: פַּלַּג
  choice: divise
  rationale: L’impératif signifie « diviser, partager ». « Divise » préserve la formulation énergique et son possible écho à la dispersion des langues.
- source_word: לְשׁוֹנָם
  choice: leur langage
  rationale: Littéralement « leur langue » ; ici, l’organe désigne par métonymie leur parole ou leur langage. « Leur langage » exprime clairement la communication commune qui doit être désorganisée.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la supplication et convient au registre poétique.
- source_word: רָאִיתִי
  choice: je vois
  rationale: Le parfait hébreu présente une réalité constatée par le psalmiste. En français, le présent rend naturellement cette perception actuelle et persistante.
- source_word: חָמָס
  choice: la violence
  rationale: Le nom désigne couramment la violence ou le tort violent ; « la violence » est ici le rendu le plus direct.
- source_word: וְרִיב
  choice: et les querelles
  rationale: רִיב désigne la dispute, la contestation ou le conflit. Le pluriel français « les querelles » est idiomatique dans cette description de la vie urbaine.
- source_word: בָּעִיר
  choice: dans la ville
  rationale: Rendu locatif direct et naturel de l’expression hébraïque.
theological_decisions:
- issue: Sens de l’impératif initial בַּלַּע en relation avec « divise leur langage »
  choice: Conserver dans le texte l’image littérale « Engloutis-les »
  alternative: « Mets-les en confusion » ou « Détruis-les »
  rationale: Même si le parallélisme avec la division du langage peut suggérer la confusion des adversaires et rappeler Babel, le sens lexical destructeur demeure réel. Le texte principal conserve donc l’image hébraïque sans trancher silencieusement, et la note expose les lectures contextuelles possibles.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste concise, avec des impératifs vigoureux. Les deux marqueurs de note figurent dans le texte principal.
