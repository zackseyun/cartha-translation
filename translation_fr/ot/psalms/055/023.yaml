source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: fr
  text: Mais toi, Dieu, tu les feras descendre dans la fosse de destruction[a] ; les hommes sanguinaires et trompeurs n’atteindront pas la moitié de leurs jours[b]. Quant à moi, je mettrai ma confiance en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la fosse de corruption », « dans la fosse sépulcrale » ou simplement « dans la fosse ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne diviseront pas leurs jours » ; cette expression signifie que leur vie sera abrégée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִדֵם
  choice: tu les feras descendre
  rationale: 'Le hifil de ירד exprime une action causative : Dieu les fera descendre. Cette formulation française conserve cette valeur sans préciser indûment la manière du jugement.'
- source_word: לִבְאֵר שַׁחַת
  choice: dans la fosse de destruction
  rationale: בְּאֵר désigne une fosse ou un puits, tandis que שַׁחַת peut évoquer la fosse, la destruction ou la corruption. La formulation retenue préserve à la fois l’image concrète et sa portée mortelle.
- source_word: אַנְשֵׁי דָמִים וּמִרְמָה
  choice: les hommes sanguinaires et trompeurs
  rationale: L’expression littérale « hommes de sang et de tromperie » désigne des hommes violents, coupables d’effusion de sang, et fourbes. « Sanguinaires et trompeurs » rend naturellement en français les deux caractérisations.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: ne vivront pas la moitié de leurs jours
  rationale: Le verbe חצה signifie littéralement « partager en deux ». La tournure conserve l’image hébraïque d’une vie interrompue avant son terme tout en restant intelligible en français.
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: Quant à moi, je mettrai ma confiance en toi
  rationale: Le pronom וַאֲנִי est emphatique et marque le contraste avec le sort des hommes violents. « Quant à moi » restitue cette mise en relief, et « mettre ma confiance en toi » exprime naturellement אֶבְטַח בָּךְ.
theological_decisions:
- issue: Portée de l’image de la « fosse de destruction »
  choice: Conserver l’image d’un jugement divin conduisant à la mort ou à la destruction, sans lui donner un sens eschatologique technique.
  alternative: Traduire par « tombe », « séjour des morts » ou par un terme désignant explicitement l’enfer.
  rationale: Le texte évoque avec force la mort et le jugement, mais ne permet pas d’identifier avec certitude la fosse à une notion doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. Le contraste emphatique final est rendu par « Quant à moi ». L’image du sang est conservée par « sanguinaires », tandis que la formulation évite tout vocabulaire confessionnel ou eschatologique plus précis que l’hébreu.
