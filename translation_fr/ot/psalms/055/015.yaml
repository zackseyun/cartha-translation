id: PSA.55.15
reference: Psalms 55:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ישימות עָלֵ֗י/מוֹ יֵרְד֣וּ שְׁא֣וֹל חַיִּ֑ים כִּֽי רָע֖וֹת בִּ/מְגוּרָ֣/ם בְּ/קִרְבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/015.yaml
  text: Let death come upon them[a]; let them go down alive to Sheol, for evil is in their dwelling[d][c][b], in their midst.
translation:
  language: fr
  text: Que la mort tombe sur eux[a] ! Qu’ils descendent vivants au shéol[b], car le mal est dans leur demeure[c], au milieu d’eux[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que la dévastation tombe sur eux », « Que la mort les surprenne », ou une formulation semblable. Le premier mot hébreu est difficile, et sa nuance exacte demeure incertaine.
    reason: textual_variant
  - marker: b
    text: 'Le shéol est le terme hébreu désignant le séjour des morts; autre traduction possible : « la tombe ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « dans leur habitation » ou « dans leur lieu de séjour ».
    reason: lexical_alternative
  - marker: d
    text: Ou « en eux » ou « parmi eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ישימות
  choice: Que la mort tombe
  rationale: Le mot hébreu d’ouverture est difficile. Cette formulation conserve l’imprécation et son parallélisme avec la descente au shéol, sans ajouter l’idée incertaine de tromperie ni préciser indûment le caractère soudain de la mort.
- source_word: עָלֵימוֹ
  choice: sur eux
  rationale: Rend directement la préposition et son suffixe, dans un registre poétique naturel.
- source_word: יֵרְדוּ
  choice: Qu’ils descendent
  rationale: Le contexte appelle une valeur volitive ou imprécatoire. « Descendent » préserve l’image verticale du texte.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération maintient la notion hébraïque du séjour des morts sans la réduire à « tombe » ni lui imposer le sens doctrinal plus tardif d’« enfer ».
- source_word: חַיִּים
  choice: vivants
  rationale: Indique qu’ils descendent au shéol alors qu’ils sont encore en vie.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’imprécation dans un registre poétique digne.
- source_word: רָעוֹת
  choice: le mal
  rationale: Le pluriel hébreu désigne ici collectivement le mal ou les méfaits; le singulier collectif est idiomatique en français.
- source_word: בִּמְגוּרָם
  choice: dans leur demeure
  rationale: Rend le sens locatif probable de מָגוּר, tout en signalant en note les nuances possibles d’habitation ou de séjour.
- source_word: בְּקִרְבָּם
  choice: au milieu d’eux
  rationale: Convient au parallélisme locatif et préserve la dimension collective, tandis que les sens « en eux » et « parmi eux » restent possibles.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: Conserver « shéol » dans le texte principal
  alternative: « le séjour des morts » ou « la tombe »
  rationale: La translittération préserve l’étendue sémantique et la tension théologique du terme hébreu sans l’assimiler à l’enfer.
- issue: Nature de l’imprécation initiale
  choice: « Que la mort tombe sur eux »
  alternative: « Que la dévastation tombe sur eux » ou « Que la mort les surprenne »
  rationale: Le texte appelle un jugement mortel, mais la forme hébraïque est incertaine. Le texte principal reste sobre et la note conserve les principales possibilités.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux souhaits imprécatoires sont nettement parallèles. La ponctuation rend leur force sans archaïsme, et les notes préservent les incertitudes textuelles et lexicales.
