  text: וָ/אֹמַ֗ר מִֽי יִתֶּן לִּ֣/י אֵ֭בֶר כַּ/יּוֹנָ֗ה אָע֥וּפָה וְ/אֶשְׁכֹּֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: fr
  text: 'Et j’ai dit[a] : « Qui me donnera des ailes comme celles d’une colombe ? Je m’envolerais et je demeurerais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « Ah ! si j’avais des ailes comme celles d’une colombe ! Je m’envolerais et trouverais le repos. »'
    reason: Cette formulation rend explicitement la valeur optative de מִי יִתֶּן לִּי et exprime, de manière interprétative, le repos suggéré par le contexte, sans le substituer au sens premier de שכן dans le texte principal.
lexical_decisions:
- source_word: וָאֹמַר
  choice: Et j’ai dit
  rationale: Le wayyiqtol de אמר fait progresser le discours et introduit les paroles du psalmiste. « Et j’ai dit » conserve simplement cet enchaînement.
- source_word: מִי יִתֶּן לִּי
  choice: Qui me donnera
  rationale: La tournure signifie littéralement « qui donnera à moi ? » tout en exprimant ici un vif souhait. La traduction principale garde la forme interrogative hébraïque; la note en explicite la valeur optative.
- source_word: אֵבֶר
  choice: des ailes
  rationale: Bien que le nom soit singulier en hébreu, il a ici une valeur collective. Le pluriel « des ailes » est naturel en français pour évoquer le moyen de voler.
- source_word: כַּיּוֹנָה
  choice: comme à la colombe
  rationale: Le כ marque la comparaison. La construction française « des ailes comme à la colombe » préserve l’image tout en restant idiomatique.
- source_word: אָעוּפָה
  choice: Je m’envolerais
  rationale: Le cohortatif exprime le désir du psalmiste. Le conditionnel français rend ce souhait dans la continuité de la question précédente.
- source_word: וְאֶשְׁכֹּנָה
  choice: et j’irais demeurer ailleurs
  rationale: Le verbe שכן signifie demeurer, habiter ou s’établir. « J’irais demeurer ailleurs » conserve ce sens spatial et exprime naturellement l’éloignement recherché, sans remplacer directement le verbe par l’idée contextuelle de repos.
