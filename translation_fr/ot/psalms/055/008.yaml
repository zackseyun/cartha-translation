  text: אָחִ֣ישָׁה מִפְלָ֣ט לִ֑/י מֵ/ר֖וּחַ סֹעָ֣ה מִ/סָּֽעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/008.yaml
  text: I would hasten to a refuge for myself from the rushing wind[a], from the storm.
translation:
  language: fr
  text: Je me hâterais vers un refuge[a], pour échapper au vent impétueux, à la tempête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je me hâterais de m’échapper » ; ou : « Que je me hâte vers un refuge. » La forme hébraïque exprime une résolution ou un désir personnel urgent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִישָׁה
  choice: Je me hâterais
  rationale: Le cohortatif de חוּשׁ exprime ici un désir ou une résolution personnelle empreinte d’urgence. Le conditionnel français convient au souhait formulé dans le contexte immédiat, sans le réduire à un simple futur.
- source_word: מִפְלָט
  choice: vers un refuge
  rationale: Le nom peut désigner un refuge, un lieu où échapper au danger, ou l’évasion elle-même. « Refuge » est clair et naturel dans ce contexte, tandis que « vers » rend idiomatiquement le mouvement implicite avec le verbe de hâte.
- source_word: לִי
  choice: me… vers un refuge
  rationale: Le suffixe de première personne marque l’intérêt personnel. En français, la construction pronominale « je me hâterais » en restitue naturellement la portée sans l’expression lourde « pour moi-même ».
- source_word: מֵרוּחַ
  choice: loin du vent
  rationale: רוּחַ a ici son sens météorologique, imposé par son association avec la tempête. « Loin de » rend naturellement la séparation exprimée par מִן.
- source_word: סֹעָה
  choice: déchaîné
  rationale: Le participe évoque un mouvement violent ou tempétueux. « Déchaîné » donne une image vive et idiomatique du vent sans répéter le mot « tempête ».
- source_word: מִסָּעַר
  choice: loin de la tempête
  rationale: סַעַר désigne une tempête ou un violent tourbillon. La répétition de « loin de » conserve le parallélisme produit par la préposition hébraïque répétée.
