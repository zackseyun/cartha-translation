  text: לִ֭בִּ/י יָחִ֣יל בְּ/קִרְבִּ֑/י וְ/אֵימ֥וֹת מָ֝֗וֶת נָפְל֥וּ עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/004.yaml
  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: fr
  text: Mon cœur se tord en moi[a], et les terreurs de la mort se sont abattues sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mon cœur tremble en moi ». Le verbe hébreu peut évoquer le fait de se tordre, de trembler ou d’être dans l’angoisse.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: Mon cœur
  rationale: לֵב désigne ici le centre intérieur des émotions et de la pensée. « Mon cœur » est naturel en français et conserve la force corporelle de l’image.
- source_word: יָחִיל
  choice: se tord
  rationale: Le verbe issu de חול/חיל peut évoquer le fait de se tordre, de trembler ou d’être dans l’angoisse. « Se tord » rend la violence viscérale de la détresse sans effacer l’ambiguïté, signalée en note.
- source_word: בְּקִרְבִּי
  choice: au-dedans de moi
  rationale: קֶרֶב avec le suffixe de première personne renvoie à l’intérieur de la personne. Cette formulation poétique s’accorde avec l’image du cœur qui se tord.
- source_word: אֵימוֹת
  choice: les terreurs
  rationale: Le pluriel אֵימוֹת exprime des effrois accablants. « Les terreurs » en conserve le nombre et l’intensité.
- source_word: מָוֶת
  choice: de la mort
  rationale: Cette construction préserve le rapport génitival sans décider si la mort est la source, l’objet ou une personnification de la terreur.
- source_word: נָפְלוּ
  choice: se sont abattues
  rationale: Le qatal présente l’action comme accomplie avec un effet présent. « Se sont abattues » restitue idiomatiquement l’image d’une menace tombant sur le psalmiste.
- source_word: עָלָי
  choice: sur moi
  rationale: עַל avec le suffixe de première personne signifie directement « sur moi » ; cette expression convient à « se sont abattues ».
