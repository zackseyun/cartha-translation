  text: הַקְשִׁ֣יבָ/ה לִּ֣/י וַ/עֲנֵ֑/נִי אָרִ֖יד בְּ/שִׂיחִ֣/י וְ/אָהִֽימָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/002.yaml
  text: Pay attention to me and answer me[a]; I am restless in my complaint[b], and I moan.
translation:
  language: fr
  text: Écoute-moi et réponds-moi ; je suis agité[a] dans ma plainte[b] et je gémis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’erre sans repos ». Le verbe hébreu rare peut évoquer une errance agitée ou un profond trouble.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner une méditation, une réflexion ou des propos exprimés ; dans ce contexte de lamentation, « plainte » paraît préférable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Prête-moi attention
  rationale: L’impératif de קשׁב demande une écoute attentive. Cette formulation française moderne conserve le caractère pressant de l’appel.
- source_word: לִּי
  choice: -moi
  rationale: Le pronom de première personne est naturellement intégré à la locution française « prêter attention à quelqu’un ».
- source_word: וַעֲנֵנִי
  choice: et réponds-moi
  rationale: Le verbe ענה signifie ici répondre; la formulation est directe et idiomatique dans une prière.
- source_word: אָרִיד
  choice: Je m’agite
  rationale: Le verbe rare ריד/רוד évoque une agitation inquiète et peut aussi suggérer une errance fébrile. « Je m’agite » rend l’état de détresse sans imposer l’idée d’un déplacement physique.
- source_word: בְּשִׂיחִי
  choice: dans ma plainte
  rationale: שׂיח peut désigner une méditation, des pensées exprimées ou une plainte. Le contexte de lamentation favorise « plainte », tout en justifiant une note sur l’ambiguïté.
- source_word: וְאָהִימָה
  choice: et je gémis
  rationale: המה exprime ici un bruit produit sous l’effet du trouble, tel qu’un murmure ou un gémissement. « Je gémis » convient au registre de la lamentation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation après « réponds-moi » restitue l’urgence de la supplication. L’ambiguïté de שׂיח est conservée en note; celle de אָרִיד est rendue dans le texte par le terme assez large « je m’agite ».
