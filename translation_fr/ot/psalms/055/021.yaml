  text: חָלְק֤וּ מַחְמָאֹ֣ת פִּי/ו֮ וּֽ/קֲרָב לִ֫בּ֥/וֹ רַכּ֖וּ דְבָרָ֥י/ו מִ/שֶּׁ֗מֶן וְ/הֵ֣מָּה פְתִחֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: fr
  text: Les paroles de sa bouche sont onctueuses[a], mais son cœur est en guerre ; ses paroles sont plus douces que l’huile, pourtant ce sont des épées dégainées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « flatteuses » ; l’expression hébraïque est rare et évoque peut-être plus précisément des paroles lisses comme du beurre.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le dernier mot peut désigner des armes « ouvertes », d’où le sens d’épées sorties de leur fourreau.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: Les paroles de sa bouche sont onctueuses
  rationale: L’expression hébraïque, rare et difficile, évoque vraisemblablement une parole lisse, comparable au beurre, donc séduisante ou flatteuse. « Onctueuses » conserve à la fois l’image de douceur grasse et sa connotation de flatterie en français actuel.
- source_word: וּקֲרָב לִבּוֹ
  choice: mais son cœur est en guerre
  rationale: קְרָב est le nom « combat, guerre ». Cette formulation préserve la métaphore concise du texte et le contraste entre les paroles agréables et l’hostilité intérieure.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: ses paroles sont plus douces que l’huile
  rationale: Le comparatif hébreu décrit la douceur des paroles par rapport à l’huile. « Douces » rend naturellement l’image sensorielle sans la réduire à la seule gentillesse.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: pourtant ce sont des épées dégainées
  rationale: Le contexte conduit à comprendre פְתִחוֹת comme des armes sorties de leur fourreau. « Épées dégainées » exprime clairement l’image et la forte opposition avec la douceur apparente des paroles.
