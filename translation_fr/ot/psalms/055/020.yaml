id: PSA.55.20
reference: Psalms 55:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: fr
  text: Il a tendu les mains contre ceux qui vivaient en paix avec lui[a] ; il a profané son alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre ses amis » ou « contre ses alliés ». L’expression hébraïque désigne des personnes qui entretenaient avec lui des relations pacifiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « il a violé son alliance ». Le verbe hébreu signifie plus littéralement « profaner » ou « traiter comme souillé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  choice: a tendu les mains
  rationale: Cette formulation conserve l’image concrète et le pluriel de l’hébreu. Dans ce contexte, les mains sont dirigées contre autrui avec une intention hostile.
- source_word: בִּשְׁלֹמָיו
  choice: contre ceux qui vivaient en paix avec lui
  rationale: שָׁלוֹם désigne ici une relation pacifique. La traduction évite de réduire le sens aux seuls « amis » ou « alliés », tout en exprimant naturellement la relation visée.
- source_word: חִלֵּל
  choice: a profané
  rationale: Le piel de חלל signifie traiter comme profane, souiller ou déshonorer. « Profané » préserve la force morale et religieuse du terme, là où « rompu » serait plus faible.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: « Alliance » est le correspondant français usuel de בְּרִית. Le possessif maintient la concision et l’indétermination de l’hébreu quant à la nature précise de cette alliance.
theological_decisions:
- issue: Nature de l’alliance
  choice: son alliance
  alternative: son pacte ; son engagement
  rationale: Le contexte dénonce la trahison d’un proche sans désigner explicitement une alliance divine. « Alliance » conserve donc la gravité relationnelle et morale du texte sans préciser abusivement son caractère.
- issue: Force du verbe appliqué à l’alliance
  choice: a profané
  alternative: a violé ; a rompu
  rationale: « Profané » maintient la tension du langage hébreu, qui présente l’alliance comme une réalité traitée de manière sacrilège, sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français moderne, digne et accessible. « Tendre les mains contre » conserve volontairement l’image hébraïque et le pluriel, tandis que les notes signalent les principales possibilités lexicales sans résoudre au-delà du texte la nature des relations ni celle de l’alliance.
