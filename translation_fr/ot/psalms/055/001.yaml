  text: הַאֲזִ֣ינָ/ה אֱ֭לֹהִים תְּפִלָּתִ֑/י וְ/אַל תִּ֝תְעַלַּ֗ם מִ/תְּחִנָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/001.yaml
  text: Give ear[a], O God, to my prayer, and do not hide yourself from my supplication.
translation:
  language: fr
  text: Prête l’oreille, ô Dieu, à ma prière, et ne te dérobe pas à ma supplication.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Prête l’oreille
  rationale: L’impératif de אזן appelle une écoute attentive. « Prête l’oreille » conserve l’image hébraïque tout en restant naturel dans le registre de la prière.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Il s’agit d’une adresse directe à Dieu. La particule « ô » marque clairement l’apostrophe et convient au ton poétique sans introduire le nom divin absent de l’hébreu.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: תְּפִלָּה est le terme général désignant la prière; « ma prière » en est l’équivalent français direct et naturel.
- source_word: וְאַל
  choice: et ne… pas
  rationale: La conjonction coordonne la seconde demande à la première, tandis que אַל exprime ici une défense ou une requête négative.
- source_word: תִּתְעַלַּם
  choice: te dérobe
  rationale: La forme réflexive de עלם évoque le fait de se cacher, de se rendre inaccessible ou de refuser son attention. « Te dérober » préserve cette force relationnelle et imagée mieux que le seul verbe « ignorer ».
- source_word: מִתְּחִנָּתִי
  choice: à ma supplication
  rationale: תְּחִנָּה désigne une demande pressante de faveur ou de grâce. « Supplication » convient au registre digne du psaume. Avec « se dérober », le français idiomatique demande « à », qui rend fonctionnellement le מִן hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. L’image de l’écoute attentive est conservée par « Prête l’oreille », tandis que « ne te dérobe pas » maintient la métaphore relationnelle de l’hébreu sans la réduire à « ne m’ignore pas ».
