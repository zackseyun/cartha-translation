source:
  edition: WLC
  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: fr
  text: Jette ton fardeau sur Yahweh[a], et il te soutiendra ; jamais il ne laissera le juste[b] vaciller.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton lot », « ton souci » ou, peut-être, « ce qu’il t’a donné ». Le nom hébreu est rare et peut désigner plus largement ce qui est imposé à une personne.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte le masculin singulier « le juste », probablement employé avec une valeur représentative.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Remets
  rationale: L’impératif de שלך évoque l’action de jeter ou de déposer quelque chose sur un autre. « Remets à » exprime naturellement en français le transfert confiant du fardeau, tout en gardant l’image.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui conserve ici le nom divin présent dans le texte hébreu.
- source_word: יְהָבְךָ
  choice: le fardeau qui pèse sur toi
  rationale: Ce nom hébreu rare peut désigner le poids, le lot ou ce qui est imposé à quelqu’un. Cette formulation rend le sens contextuel sans masquer l’incertitude lexicale, signalée en note.
- source_word: יְכַלְכְּלֶךָ
  choice: il te soutiendra
  rationale: Le verbe כלכל peut exprimer le soutien, l’entretien ou la subsistance. « Soutiendra » convient au parallèle avec le fardeau et reste assez large.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: jamais il ne laissera
  rationale: La tournure exprime un refus durable de permettre la situation décrite ; cette formulation est idiomatique en français.
- source_word: מוֹט
  choice: vaciller
  rationale: Le terme désigne l’instabilité, le fait de chanceler ou de perdre pied. « Vaciller » conserve cette métaphore sans nécessairement suggérer une chute définitive.
- source_word: לַצַּדִּיק
  choice: le juste
  rationale: L’adjectif substantivé est au masculin singulier. « Le juste » respecte cette forme et peut avoir ici une portée représentative.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- issue: Portée de לַצַּדִּיק
  choice: le juste
  alternative: les justes
  rationale: Le singulier masculin de l’hébreu est conservé. Il peut toutefois représenter toute personne juste, ce qui est indiqué en note.
- issue: Portée de la promesse de stabilité
  choice: jamais il ne laissera le juste vaciller
  alternative: il ne permettra jamais que le juste tombe
  rationale: « Vaciller » maintient l’image d’instabilité du mot מוֹט et évite de préciser abusivement si la promesse exclut toute épreuve passagère ou vise l’effondrement durable.
translation_notes:
  register: Français international moderne, sobre et digne. « Remets à » est plus naturel que « jette sur » dans ce contexte, tandis que « le fardeau qui pèse sur toi » explicite légèrement le nom rare sans en figer toutes les nuances. Les deux appels de note figurent dans le texte.
