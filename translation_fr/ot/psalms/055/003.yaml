source:
  edition: WLC
  text: מִ/קּ֤וֹל אוֹיֵ֗ב מִ/פְּנֵ֣י עָקַ֣ת רָשָׁ֑ע כִּי יָמִ֥יטוּ עָלַ֥/י אָ֝֗וֶן וּ/בְ/אַ֥ף יִשְׂטְמֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: fr
  text: À cause de la voix de l’ennemi, à cause de l’oppression du méchant ; car ils font retomber le malheur sur moi[a] et, dans leur colère, ils me haïssent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils font retomber le mal sur moi ». Le mot hébreu peut désigner le malheur ou le tort subi, mais aussi le mal ou l’iniquité.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: À cause des cris de l’ennemi
  rationale: מִן est causal dans ce contexte de lamentation. קוֹל désigne la voix ou le bruit produit ; le pluriel français « cris » rend naturellement la menace audible sans effacer l’image concrète.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: sous la pression du méchant
  rationale: עָקָה évoque une pression oppressante ou la détresse qu’elle cause. « Sous la pression » conserve cette image tout en restant idiomatique ; le singulier « du méchant » respecte la forme hébraïque, qui peut avoir une valeur représentative.
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: ils font retomber le malheur sur moi
  rationale: Le hiphil de מוט exprime ici l’action de faire tomber ou déverser quelque chose sur quelqu’un. אָוֶן peut désigner le mal, le malheur, le tort ou l’iniquité ; « malheur » convient à ce que les adversaires infligent au psalmiste.
- source_word: וּבְאַף
  choice: et, dans leur colère
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. Le possessif « leur » est explicité en français d’après le sujet pluriel du verbe.
- source_word: יִשְׂטְמוּנִי
  choice: ils me traitent en ennemi
  rationale: שׂטם exprime une hostilité active, le fait de nourrir de la haine ou de se comporter en ennemi. Cette formulation garde la nuance d’hostilité sans réduire nécessairement le verbe au seul sentiment intérieur.
