source:
  edition: WLC
  text: הַוּ֥וֹת בְּ/קִרְבָּ֑/הּ וְֽ/לֹא יָמִ֥ישׁ מֵ֝/רְחֹבָ֗/הּ תֹּ֣ךְ וּ/מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/011.yaml
  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: fr
  text: Les ravages sont en son sein[a] ; l’oppression et la tromperie ne quittent pas sa place publique[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des maux destructeurs sont au milieu d’elle. » Le nom hébreu est au pluriel et peut désigner des calamités, des actes destructeurs ou des maux qui conduisent à la ruine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses rues ». Le terme hébreu désigne souvent plus précisément une place ou un espace public ouvert dans la ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: les ravages
  rationale: Le pluriel hébreu évoque des maux destructeurs, des désastres ou des actes qui causent la ruine. Le pluriel français « les ravages » conserve ce nombre et exprime naturellement leur présence généralisée dans la ville.
- source_word: בְּקִרְבָּהּ
  choice: en son sein
  rationale: La formule rend le sens littéral « au milieu d’elle » tout en conservant la personnification féminine de la ville dans un registre digne et naturel.
- source_word: יָמִישׁ
  choice: ne quittent pas
  rationale: Le verbe hébreu est au singulier, mais il régit ici le groupe coordonné « l’oppression et la tromperie », envisagé collectivement. Le pluriel est requis par la syntaxe française et exprime leur présence continuelle.
- source_word: מֵרְחֹבָהּ
  choice: sa place publique
  rationale: רְחוֹב désigne souvent un espace ouvert de la ville où se déroule la vie publique. « Place publique » est plus précis ici que le terme général « rues ».
- source_word: תֹּךְ
  choice: l’oppression
  rationale: Dans ce contexte civique, le mot peut désigner l’oppression ou l’extorsion. « Oppression » garde une portée assez large et s’accorde avec le tableau de violence sociale.
- source_word: וּמִרְמָה
  choice: et la tromperie
  rationale: מִרְמָה désigne la tromperie, la fraude ou la perfidie. « Tromperie » est clair, courant et laisse ouverte la gamme des pratiques malhonnêtes visées.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La personnification féminine de la ville est maintenue par « son sein » et « sa place publique ». Le parallélisme poétique reste compact, sans expliciter davantage la nature des ravages.
