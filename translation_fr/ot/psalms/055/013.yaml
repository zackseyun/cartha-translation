source:
  edition: WLC
  text: וְ/אַתָּ֣ה אֱנ֣וֹשׁ כְּ/עֶרְכִּ֑/י אַ֝לּוּפִ֗/י וּ/מְיֻדָּֽעִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/013.yaml
  text: But you—a man as my equal[a], my companion, and my familiar friend.
translation:
  language: fr
  text: Mais toi, un homme qui es mon égal, mon compagnon[a] et mon ami intime !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon guide » ; le terme hébreu peut désigner un proche associé ou une personne qui dirige.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction et le pronom introduisent ici un contraste marqué avec le contexte précédent ; « Mais toi » rend naturellement cette opposition et conserve l’adresse directe.
- source_word: אֱנוֹשׁ
  choice: un homme
  rationale: Le nom désigne un être humain, parfois avec une nuance de fragilité ou de mortalité. Ici, l’accent porte surtout sur la trahison commise par un homme proche du psalmiste.
- source_word: כְּעֶרְכִּי
  choice: qui es mon égal
  rationale: Issu de עֵרֶךְ, le terme exprime une équivalence ou un rang comparable. Cette formulation est naturelle en français et convient au sens relationnel du contexte.
- source_word: אַלּוּפִי
  choice: mon compagnon
  rationale: Le mot peut désigner un proche associé, un compagnon ou un guide. Dans son association avec « mon ami intime », le sens relationnel paraît principal, sans exclure l’autre possibilité signalée en note.
- source_word: וּמְיֻדָּעִי
  choice: et mon ami intime
  rationale: La forme issue de ידע désigne quelqu’un que l’on connaît personnellement et étroitement. « Ami intime » restitue mieux la proximité affective et la force de la plainte que « connaissance ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. La construction exclamative fait ressortir la stupeur douloureuse devant la trahison. Le relatif « qui es » évite une juxtaposition raide tout en conservant l’idée d’égalité.
