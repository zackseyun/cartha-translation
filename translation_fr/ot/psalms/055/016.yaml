  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: fr
  text: Quant à moi, je crie vers Dieu, et Yahweh me sauvera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant, placé en tête, porte une valeur emphatique ou contrastive que « Quant à moi » rend naturellement en français.
- source_word: אֶל אֱלֹהִים אֶקְרָא
  choice: j’appelle Dieu
  rationale: La préposition אֶל indique la direction de l’appel. L’imparfait אֶקְרָא peut avoir une nuance présente, habituelle ou future; ici, le présent français conserve cette souplesse tout en exprimant l’appel actuel du psalmiste.
- source_word: וַיהוָה
  choice: et Yahweh
  rationale: La conjonction est additive, et le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans l’hébreu.
- source_word: יוֹשִׁיעֵנִי
  choice: me sauvera
  rationale: Le hiphil de ישׁע signifie « sauver, délivrer ». Le futur exprime ici avec naturel la confiance tournée vers l’intervention attendue de Dieu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur temporelle de יוֹשִׁיעֵנִי
  choice: me sauvera
  alternative: me sauve
  rationale: L’imparfait hébreu permet plusieurs nuances. Dans le contexte, le futur rend bien l’assurance du psalmiste concernant l’intervention attendue, sans en faire une vérité exclusivement habituelle.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme bref du vers hébreu ainsi que l’emphase initiale sur le locuteur.
