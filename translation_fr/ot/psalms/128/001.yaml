  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אַ֭שְׁרֵי כָּל יְרֵ֣א יְהוָ֑ה הַ֝/הֹלֵ֗ךְ בִּ/דְרָכָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/001.yaml
  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: fr
  text: Chant des montées. Heureux quiconque craint Yahweh et marche dans ses voies.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Cette formule de titre appartient au recueil des Psaumes 120–134. « Montées » conserve le sens concret et l’ambiguïté de מַעֲלוֹת sans imposer un cadre historique précis comme celui d’un pèlerinage.
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Dans cette formule de béatitude, le terme décrit l’état enviable et florissant de la personne concernée. « Heureux » est naturel en français biblique moderne et ne suppose pas nécessairement une émotion passagère.
- source_word: כָּל יְרֵא
  choice: quiconque craint
  rationale: Le singulier masculin a ici une portée représentative et générale. « Quiconque » restitue cette valeur distributive sans limiter l’énoncé aux hommes.
- source_word: יְרֵא
  choice: craint
  rationale: Le verbe exprime ici la crainte révérencielle envers Dieu. « Craint » conserve le poids de l’expression sapientielle hébraïque sans la réduire au simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » préserve le nom propre plutôt que de lui substituer un titre.
- source_word: הַהֹלֵךְ
  choice: marche
  rationale: « Marche » conserve la métaphore hébraïque de la conduite et relie naturellement la seconde caractérisation à la première.
- source_word: בִּדְרָכָיו
  choice: dans ses voies
  rationale: Le pluriel désigne métaphoriquement les manières d’agir voulues par Yahweh. « Dans ses voies » conserve l’image et le référent pronominal du texte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » le rend comme nom propre et évite de le remplacer silencieusement par un titre.
- issue: Portée de כָּל יְרֵא au masculin singulier
  choice: quiconque craint
  alternative: tout homme qui craint
  rationale: La construction a une portée générique et distributive. « Quiconque » maintient le singulier représentatif tout en exprimant clairement l’inclusion de toute personne.
- issue: Nuance de אַשְׁרֵי
  choice: Heureux
  alternative: Béni
  rationale: אַשְׁרֵי proclame un état enviable de bonheur ou d’épanouissement, sans être la forme verbale habituelle exprimant l’acte de bénir. « Heureux » garde cette distinction, tandis que la note signale l’autre rendu traditionnel.
translation_notes:
  register: Français international moderne, digne et accessible. Le titre conserve la formulation traditionnelle sans préciser s’il s’agit de marches, de pèlerinages ou d’une autre forme de montée. Le parallélisme participial est rendu par deux verbes coordonnés au présent.
