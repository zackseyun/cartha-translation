    issue: « Oui » pour כִּי
    rationale: Cette particule n'appelle pas ici une affirmation autonome. Dans le contexte, « car » rend plus précisément son lien explicatif avec la béatitude du verset précédent et avec l'énoncé qui suit.
  - severity: low
    issue: Futur antérieur « auront produit »
    rationale: Le futur antérieur présente la production comme achevée avant l'acte de manger. L'imparfait hébreu ne marque pas cette antériorité ; le présent générique dans la relative évite cet ajout.
