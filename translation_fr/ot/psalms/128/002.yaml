  source_fidelity: 'La formulation principale rend bien l''idée de jouir de ce que les mains ont produit et conserve la béatitude ainsi que la promesse de bien-être. Cependant, « Oui » ne rend pas de façon sûre כִּי dans cette construction : la particule introduit plus naturellement ici l''énoncé explicatif ou consécutif (« car »), comme le retient aussi l''audit anglais. Le futur antérieur « auront produit » ajoute en outre une antériorité que l''inaccompli hébreu n''exprime pas nécessairement.'
  naturalness: « Ce que tes mains ont produit » et « tout ira bien pour toi » sont naturels en français international moderne. « Heureux es-tu » convient au registre sapientiel. Le remplacement de « Oui » par « Car » rend l'enchaînement plus idiomatique et plus clair.
  terminology: « Heureux » rend de manière appropriée אַשְׁרֶיךָ sans confondre cette formule de béatitude avec le verbe « bénir ». La périphrase « ce que tes mains produisent » communique le produit du labeur, qui est ce qui peut être mangé, tout en maintenant la mention concrète des mains. La note explicite utilement le sens littéral de « labeur de tes mains ».
  issues:
