source:
  edition: WLC
  text: יְגִ֣יעַ כַּ֭פֶּי/ךָ כִּ֣י תֹאכֵ֑ל אַ֝שְׁרֶ֗י/ךָ וְ/ט֣וֹב לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/002.yaml
  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: fr
  text: Car tu mangeras ce que tes mains produisent[a] ; heureux es-tu[b], et tout ira bien pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le labeur de tes mains » ; le mot peut aussi désigner le produit du travail.'
    reason: Précision lexicale et conservation de l’expression concrète de l’hébreu.
  - marker: b
    text: 'Ou : « quel bonheur pour toi » ; il s’agit d’une formule de béatitude.'
    reason: Autre manière de rendre la portée de אַשְׁרֶיךָ sans le confondre avec le verbe « bénir ».
lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: ce que tes mains auront produit
  rationale: יְגִיעַ peut désigner le labeur ainsi que son produit. Cette formulation française naturelle conserve les mains explicitement mentionnées et exprime ce qui peut concrètement être mangé, sans ajouter l’image absente du « fruit ».
- source_word: כִּי
  choice: oui
  rationale: Dans cette construction, la particule peut avoir une valeur affirmative ou explicative. « Oui » relie la promesse au verset précédent sans imposer une lecture exclusivement causale ou temporelle.
- source_word: תֹאכֵל
  choice: tu mangeras
  rationale: Le futur rend ici l’inaccompli comme résultat attendu et maintient l’image concrète de la nourriture.
- source_word: אַשְׁרֶיךָ
  choice: heureux es-tu
  rationale: Le terme de béatitude décrit une condition enviable et florissante, non une simple émotion passagère. « Heureux » est idiomatique dans le registre sapientiel français.
- source_word: וְטוֹב לָךְ
  choice: et tout ira bien pour toi
  rationale: Cette expression rend naturellement l’idée de bien-être et d’issue favorable contenue dans la formule hébraïque.
theological_decisions:
- issue: Rendu de la formule de béatitude dans un contexte sapientiel
  choice: heureux es-tu
  alternative: tu es béni / quelle chance tu as
  rationale: « Heureux » correspond à l’usage français traditionnel et actuel des béatitudes, tout en laissant entendre une condition de plénitude accordée à celui qui craint le SEIGNEUR. « Béni » risquerait de confondre אַשְׁרֵי avec בָּרוּךְ.
- issue: Rapport logique introduit par כִּי
  choice: 'valeur affirmative : « oui »'
  alternative: car / quand
  rationale: La particule admet plusieurs nuances. Le choix affirmatif préserve la continuité avec la déclaration générale du verset précédent sans transformer explicitement le fait de manger en cause de la béatitude ni en subordonnée temporelle.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement suit l’adresse individuelle au masculin singulier de l’hébreu. La construction garde le verbe concret « manger » et la mention des mains, tout en évitant le calque peu naturel « manger le labeur de tes mains ».
