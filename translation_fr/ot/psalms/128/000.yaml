  text: A Song of Ascents. Blessed is everyone who fears Yahweh[a], who walks in his ways.
translation:
  language: fr
  text: Chant des montées. Heureux tous ceux qui craignent le Seigneur[a], qui marchent dans ses voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte ici le nom divin YHWH, traditionnellement rendu par « le Seigneur ». « Heureux » peut aussi exprimer l’idée d’une vie bénie ou florissante.
    reason: nom_divin_et_nuance_lexicale
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: 'Rend littéralement le titre traditionnel tout en conservant son ambiguïté : il peut évoquer des montées géographiques, cultuelles ou liturgiques.'
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: « Heureux » exprime naturellement en français l’état enviable, béni ou florissant désigné par le terme hébreu.
- source_word: כָּל
  choice: tous ceux qui
  rationale: Dans cette construction, le collectif français « tous ceux qui » est plus naturel que le singulier « quiconque » et conserve la portée universelle.
- source_word: יְרֵא
  choice: craignent
  rationale: Conserve le langage biblique de la crainte révérencielle sans le réduire à la peur ni l’interpréter par un terme plus faible.
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Suit l’usage français courant pour le tétragramme, tout en signalant en note le nom divin sous-jacent.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: qui suivent ses voies
  rationale: « Suivre ses voies » rend idiomatiquement l’image hébraïque de marcher dans les chemins de Dieu, sans en effacer la métaphore fondamentale.
theological_decisions:
- issue: Sens de la crainte de Dieu
  choice: craignent le Seigneur
  alternative: révèrent le Seigneur
  rationale: Le terme « craignent » préserve la tension sémantique et théologique de ירא, qui peut inclure crainte, respect et révérence, plutôt que de la résoudre en faveur d’une seule nuance.
- issue: Représentation du nom divin
  choice: le Seigneur avec une note indiquant « YHWH »
  alternative: Yahvé
  rationale: Le texte principal reste naturel et conforme à l’usage biblique français largement reconnu, tandis que la note rend transparente la présence du nom propre divin dans l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La formulation garde le parallélisme du verset, le langage traditionnel de la crainte de Dieu et l’ambiguïté du titre, tout en restant immédiatement compréhensible.
