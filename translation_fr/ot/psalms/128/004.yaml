  text: הִנֵּ֣ה כִי כֵ֭ן יְבֹ֥רַךְ גָּ֗בֶר יְרֵ֣א יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/004.yaml
  text: Behold[a], thus shall the man who fears Yahweh be blessed.
translation:
  language: fr
  text: 'Voici : ainsi sera béni l’homme[a] qui craint Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « l’homme » est masculin ; il désigne ici, de manière proverbiale, toute personne caractérisée par la crainte de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Oui
  rationale: Dans ce contexte récapitulatif, la particule attire l’attention et renforce solennellement l’affirmation. « Oui » en restitue naturellement la valeur emphatique en français moderne.
- source_word: כִי כֵן
  choice: c’est ainsi que
  rationale: Cette tournure exprime la manière et le résultat annoncés en renvoyant aux bénédictions décrites dans les versets précédents.
- source_word: יְבֹרַךְ
  choice: sera béni
  rationale: 'Le poual de ברך est passif : l’homme reçoit la bénédiction. Le futur français convient à la déclaration proverbiale tout en conservant la voix passive.'
- source_word: גָּבֶר
  choice: l’homme
  rationale: Le nom hébreu est masculin et désigne ici, de manière proverbiale, l’être humain caractérisé par la crainte de Yahweh. La traduction garde la forme masculine du texte et en précise la portée en note.
- source_word: יְרֵא יְהוָה
  choice: qui craint Yahweh
  rationale: Le participe décrit la caractéristique constante de cet homme. « Craindre Yahweh » préserve l’expression biblique sapientielle sans la réduire au seul respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », conformément à sa fonction de nom propre dans le texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée du masculin גָּבֶר
  choice: l’homme
  alternative: la personne
  rationale: Le masculin lexical est conservé, tandis qu’une note signale sa portée proverbiale afin de ne pas exclure indûment les femmes ni de neutraliser silencieusement la forme source.
translation_notes:
  register: Français moderne, sobre et poétique. La structure « Oui, c’est ainsi que… » donne au verset sa force de conclusion emphatique et renvoie clairement aux bénédictions qui précèdent.
