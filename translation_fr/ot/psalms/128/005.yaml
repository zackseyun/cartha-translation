source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: fr
  text: Que Yahweh te bénisse de Sion, et que tu voies la prospérité[a] de Jérusalem tous les jours de ta vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bien de Jérusalem » ou « le bien-être de Jérusalem ».
    reason: Alternative lexicale pour טוּב, qui peut désigner le bien, le bien-être ou la prospérité.
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Que … te bénisse
  rationale: L’imparfait piel à valeur volitive exprime ici un souhait de bénédiction. Cette tournure restitue naturellement cette force en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: מִצִּיּוֹן
  choice: depuis Sion
  rationale: La préposition מִן indique ici la provenance de la bénédiction. « Depuis Sion » conserve clairement cette relation de source.
- source_word: וּרְאֵה
  choice: et puisses-tu voir
  rationale: L’impératif qui suit le souhait de bénédiction prolonge naturellement la formule de vœu; cette traduction évite de le transformer en ordre abrupt.
- source_word: בְּטוּב
  choice: la prospérité
  rationale: טוּב peut désigner le bien, le bonheur, le bien-être ou la prospérité. Dans ce contexte de bénédiction collective, « prospérité » exprime de façon naturelle le bien visible de Jérusalem, tout en signalant les autres nuances en note.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: tous les jours de ta vie
  rationale: Cette formulation française naturelle conserve la structure et le sens de l’expression hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ou « le Seigneur »
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le nom divin sans lui substituer un titre.
- issue: La bénédiction provenant de Sion
  choice: Conserver Sion comme provenance de la bénédiction sans explicitation supplémentaire
  alternative: Développer Sion comme centre du temple ou comme réalité messianique
  rationale: Le verset relie la bénédiction à Sion et au bien de Jérusalem, mais n’explicite pas davantage cette relation. Une expansion interprétative dépasserait ce que dit le texte.
- issue: Valeur de וּרְאֵה après la bénédiction
  choice: 'Le rendre comme la continuation d’un souhait : « et puisses-tu voir »'
  alternative: 'Impératif direct : « et vois »'
  rationale: La forme hébraïque est impérative, mais son contexte bénédictif permet naturellement une valeur volitive. La traduction retenue préserve la cohérence de la bénédiction sans effacer la force grammaticale, mentionnée ici comme autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond aux formes masculines singulières de l’hébreu. La construction « Que… et puisses-tu… » maintient le ton de bénédiction du verset.
