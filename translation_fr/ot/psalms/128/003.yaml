source:
  edition: WLC
  text: אֶשְׁתְּ/ךָ֤ כְּ/גֶ֥פֶן פֹּרִיָּה֮ בְּ/יַרְכְּתֵ֪י בֵ֫יתֶ֥/ךָ בָּ֭נֶי/ךָ כִּ/שְׁתִלֵ֣י זֵיתִ֑ים סָ֝בִ֗יב לְ/שֻׁלְחָנֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: fr
  text: Ta femme sera comme une vigne féconde au fond de ta maison ; tes fils[a], comme de jeunes oliviers autour de ta table.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes enfants », si le terme masculin est compris comme représentant ici l’ensemble de la descendance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: ta femme
  rationale: Le nom avec suffixe possessif désigne ici naturellement l’épouse.
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: comme une vigne féconde
  rationale: Cette formulation conserve la comparaison agricole et l’idée de fécondité attachée à la bénédiction.
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: au fond de ta maison
  rationale: יַרְכְּתֵי évoque les parties reculées ou intérieures d’un lieu ; « au fond de » est concret, naturel et ne réduit pas l’expression au simple fait d’être à l’intérieur.
- source_word: בָּנֶיךָ
  choice: tes fils
  rationale: Le texte hébreu emploie le pluriel masculin précis « fils » ; la possibilité d’un emploi représentatif pour la descendance est signalée en note.
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: comme de jeunes oliviers
  rationale: שְׁתִלֵי désigne des plants ou de jeunes arbres mis en terre. « Jeunes oliviers » restitue clairement en français l’image d’une croissance vigoureuse.
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: autour de ta table
  rationale: Traduction directe et idiomatique de l’image familiale et spatiale.
theological_decisions:
- issue: Portée du terme masculin désignant la descendance
  choice: tes fils
  alternative: tes enfants
  rationale: Le masculin pluriel du texte source est maintenu sans décider qu’il désigne nécessairement toute la descendance ; la portée représentative possible est préservée dans une note.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique est conservé par le point-virgule et l’ellipse du verbe dans le second membre.
