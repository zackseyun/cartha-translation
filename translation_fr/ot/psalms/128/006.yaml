id: PSA.128.6
reference: Psalms 128:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/רְאֵֽה בָנִ֥ים לְ/בָנֶ֑י/ךָ שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/006.yaml
  text: May you see your children's children[b][a]. Peace be upon Israel.
translation:
  language: fr
  text: Puisses-tu voir les enfants de tes enfants. Que la paix[a] soit sur Israël !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu shalom peut aussi évoquer le bien-être, l’intégrité et l’épanouissement.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Puisses-tu voir
  rationale: L’impératif hébreu prend ici, dans le contexte conclusif de bénédiction, la valeur naturelle d’un souhait. Cette tournure française préserve cette force sans transformer le verset en simple prédiction.
- source_word: בָנִים לְבָנֶיךָ
  choice: les enfants de tes enfants
  rationale: Littéralement « des fils à tes fils », cette expression désigne les descendants de la génération suivante. « Les enfants de tes enfants » est naturel, inclusif au sens familial et conserve l’image multigénérationnelle.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: « Paix » est l’équivalent français traditionnel et direct, tout en laissant au terme hébreu sa portée plus large de bien-être, d’intégrité et d’épanouissement, explicitée en note.
- source_word: עַל יִשְׂרָאֵל
  choice: sur Israël
  rationale: « Sur » garde l’idée de la bénédiction reposant sur Israël et convient à une formule française de bénédiction.
theological_decisions:
- issue: Portée de la bénédiction finale
  choice: Conserver explicitement « Israël »
  alternative: Élargir dans la traduction à la communauté croyante ou à l’Église
  rationale: Le texte hébreu nomme Israël. La traduction maintient ce référent historique et lié à l’alliance, sans introduire une extension théologique ultérieure.
- issue: Valeur de וּרְאֵה
  choice: 'Exprimer un souhait de bénédiction : « Puisses-tu voir »'
  alternative: Impératif littéral « et vois » ou prédiction « tu verras »
  rationale: Le contexte bénédictionnel favorise un souhait, mais la formulation ne prétend pas en faire une promesse prédictive absolue.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement au singulier reflète l’adresse masculine singulière de l’hébreu. La première phrase garde la tonalité de souhait solennel; la seconde emploie une formule bénédictionnelle naturelle.
