source:
  edition: WLC
  text: וּ/רְאֵ֗ה אִם דֶּֽרֶךְ עֹ֥צֶב בִּ֑/י וּ֝/נְחֵ֗/נִי בְּ/דֶ֣רֶךְ עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/024.yaml
  text: And see whether there is any grievous way in me[b][a], and lead me in the everlasting way.
translation:
  language: fr
  text: Vois s’il y a en moi une voie douloureuse[a], et conduis-moi sur la voie éternelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une voie nuisible », « une voie offensante »; peut-être « une voie idolâtre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la voie de toujours » ou « la voie ancienne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאֵה
  choice: Vois
  rationale: L’impératif poursuit directement la prière adressée à Dieu. « Vois » reste simple, naturel et proche de l’hébreu.
- source_word: אִם
  choice: s’il y a
  rationale: Dans ce contexte, אִם introduit une interrogation indirecte. « S’il y a » est idiomatique en français et conserve l’examen demandé à Dieu.
- source_word: דֶּרֶךְ עֹצֶב
  choice: une voie qui fait souffrir
  rationale: עֹצֶב évoque la peine, la douleur ou ce qui blesse. Cette formulation conserve à la fois la métaphore de la voie et l’ambiguïté entre une conduite douloureuse, nuisible ou affligeante, sans la réduire à l’idolâtrie.
- source_word: בִּי
  choice: en moi
  rationale: Rend directement la préposition et le suffixe de première personne, avec une possible portée intérieure.
- source_word: וּנְחֵנִי
  choice: et conduis-moi
  rationale: Le verbe נחה signifie conduire ou guider. « Conduis-moi » convient au mouvement suggéré par la voie et au ton de supplication.
- source_word: בְּדֶרֶךְ
  choice: sur la voie
  rationale: En français, on conduit naturellement quelqu’un « sur » une voie; ce choix préserve l’image du cheminement.
- source_word: עוֹלָם
  choice: de toujours
  rationale: עוֹלָם peut désigner la perpétuité, une durée indéfinie ou l’ancienneté. « De toujours » est naturel, dignifié et laisse résonner à la fois la continuité durable et, dans une certaine mesure, l’ancienneté.
theological_decisions:
- issue: Sens de דֶּרֶךְ עֹצֶב
  choice: une voie qui fait souffrir
  alternative: une voie nuisible, offensante ou idolâtre
  rationale: Le syntagme est difficile et peut évoquer ce qui cause douleur, tort ou offense; un lien avec l’idolâtrie est parfois proposé. Le texte principal garde le champ sémantique large sans imposer une faute particulière.
- issue: Sens de דֶּרֶךְ עוֹלָם
  choice: la voie de toujours
  alternative: la voie éternelle ou la voie ancienne
  rationale: La formule peut décrire une voie durable à jamais ou une voie ancienne. « De toujours » préserve mieux cette amplitude que des formulations qui trancheraient nettement en faveur de l’éternité ou de l’antiquité.
translation_notes:
  register: Français international moderne, sobre et priant. La répétition de « voie » reproduit le parallélisme lexical de l’hébreu. Les deux marqueurs de note figurent dans le texte au point précis de l’ambiguïté.
