  text: לֹא נִכְחַ֥ד עָצְמִ֗/י מִ֫מֶּ֥/ךָּ אֲשֶׁר עֻשֵּׂ֥יתִי בַ/סֵּ֑תֶר רֻ֝קַּ֗מְתִּי בְּֽ/תַחְתִּיּ֥וֹת אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/015.yaml
  text: My frame was not hidden from you when I was made in secret[b][a], woven in the depths of the earth.
translation:
  language: fr
  text: 'Mon corps ne t’était pas caché

    quand j’ai été façonné en secret,

    tissé dans les profondeurs de la terre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les parties les plus basses de la terre ». L’expression peut évoquer poétiquement une formation entièrement cachée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְחַד
  choice: ne t’était pas cachée
  rationale: Le nifal exprime ici ce qui est dissimulé ou soustrait au regard. « Ne t’était pas cachée » conserve le passif et s’intègre naturellement à la négation.
- source_word: עָצְמִי
  choice: mon ossature
  rationale: Bien que עֶצֶם désigne souvent un os, le singulier avec suffixe renvoie ici plus largement à la charpente corporelle du psalmiste. « Ossature » garde l’image concrète sans réduire le sens à un seul os.
- source_word: עֻשֵּׂיתִי
  choice: j’ai été fait
  rationale: Le passif de עשה a le sens général de « faire ». Cette formulation simple respecte la voix passive et laisse au verbe suivant l’image plus précise du travail textile.
- source_word: בַסֵּתֶר
  choice: en secret
  rationale: L’expression évoque un lieu ou un processus caché. « En secret » est idiomatique, concis et maintient le parallèle avec les profondeurs de la terre.
- source_word: רֻקַּמְתִּי
  choice: tissé
  rationale: רקם évoque la broderie ou un travail textile élaboré. « Tissé » rend clairement cette métaphore en français courant; le participe poursuit la phrase sans ajouter une seconde conjonction temporelle absente de l’hébreu.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: dans les profondeurs de la terre
  rationale: Cette traduction naturelle conserve l’image spatiale et poétique de l’hébreu sans décider si elle doit être comprise exclusivement comme une métaphore de la formation cachée.
theological_decisions:
- issue: Sens des « profondeurs de la terre »
  choice: Conserver l’image poétique dans le texte principal
  alternative: L’expliciter directement comme une référence au sein maternel, ou la rendre de façon strictement cosmologique
  rationale: Dans le contexte, l’expression correspond à « en secret » et peut évoquer le caractère caché et mystérieux de la formation prénatale. La traduction ne remplace toutefois pas l’image par son interprétation et ne nie pas sa portée cosmologique possible.
translation_notes:
  register: Vers poétique en français moderne et digne. Les retours à la ligne font ressortir le parallélisme. « Ossature » garde la dimension corporelle de עָצְמִי, tandis que « tissé » préserve l’image textile sans recourir à une formulation archaïque.
