source:
  edition: WLC
  text: אֲשֶׁ֣ר יֹ֭אמְרֻ/ךָ לִ/מְזִמָּ֑ה נָשֻׂ֖א לַ/שָּׁ֣וְא עָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/020.yaml
  text: who speak of you with evil intent[a]; your enemies take your name in vain.
translation:
  language: fr
  text: Ceux qui parlent de toi avec de mauvaises intentions[a] ; tes ennemis utilisent ton nom à des fins mensongères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition est difficile en hébreu. Littéralement, elle contient les termes « porter/élever », « pour la fausseté » et « tes adversaires » ; elle peut aussi se comprendre : « tes adversaires t’élèvent/te portent faussement ». Le mot « nom » n’est pas exprimé dans le texte hébreu.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: eux qui
  rationale: Le relatif introduit la description des méchants mentionnés au verset précédent ; « eux qui » assure un enchaînement naturel en français.
- source_word: יֹאמְרֻךָ
  choice: parlent de toi
  rationale: Le verbe אמר muni du suffixe de deuxième personne masculin singulier peut signifier ici parler au sujet de Dieu, plutôt que s’adresser directement à lui.
- source_word: לִמְזִמָּה
  choice: avec de mauvaises intentions
  rationale: מְזִמָּה désigne un projet ou dessein, souvent malveillant dans ce contexte ; cette formulation rend à la fois la préméditation et la malveillance.
- source_word: נָשֻׂא
  choice: prononcent
  rationale: נשׂא signifie littéralement « lever, porter » ; dans cette construction difficile, « prononcent » explicite prudemment l’usage verbal compris dans la ligne sans reproduire artificiellement l’idiome français « prendre un nom ».
- source_word: לַשָּׁוְא
  choice: pour tromper
  rationale: שָׁוְא peut exprimer le vide, la fausseté ou la tromperie. « Pour tromper » convient au contexte de parole malveillante, tout en évitant le français désormais ambigu de « en vain ».
- source_word: עָרֶיךָ
  choice: tes ennemis
  rationale: Bien que la forme consonantique soit difficile et puisse formellement évoquer « tes villes », le contexte et le parallélisme soutiennent le sens d’adversaires de Dieu.
theological_decisions:
- issue: Objet et sens de la dernière proposition
  choice: tes ennemis prononcent ton nom pour tromper
  alternative: 'tes adversaires t’invoquent faussement ; ou : ils élèvent tes adversaires pour la fausseté'
  rationale: La syntaxe hébraïque est obscure et le mot « nom » n’est pas exprimé. Le texte principal adopte l’interprétation idiomatique liée à l’usage trompeur du nom de Dieu, mais la note signale explicitement l’ajout interprétatif et conserve d’autres analyses possibles.
translation_notes:
  register: Français moderne, international et digne. « Mauvaises intentions » reste immédiatement compréhensible ; « prononcent ton nom pour tromper » communique l’interprétation retenue sans employer l’expression française potentiellement équivoque « prendre ton nom en vain ». La note préserve l’incertitude réelle de l’hébreu.
