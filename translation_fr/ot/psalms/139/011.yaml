  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: fr
  text: 'Et j’ai dit : « Sûrement, les ténèbres me couvriront[a], et la nuit sera claire autour de moi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’engloutiront », ou « me meurtriront ». Le verbe hébreu est rare, et sa nuance précise ici fait débat.
    reason: lexical_alternative
  - marker: b
    text: Ou « et la nuit est claire autour de moi ». La proposition hébraïque est sans verbe exprimé ; elle peut être rendue au présent ou au futur selon son lien avec la déclaration du psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Et j’ai dit
  rationale: Le waw suivi du qatal à la première personne du singulier exprime naturellement ici une réflexion formulée au passé. Cette traduction conserve la forme hébraïque sans la transformer en conditionnelle.
- source_word: אַךְ
  choice: Sûrement
  rationale: La particule marque ici une affirmation appuyée plutôt qu’une restriction.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Équivalent français courant et digne du nom hébreu désignant l’obscurité.
- source_word: יְשׁוּפֵנִי
  choice: me couvriront
  rationale: Le verbe שׁוף est rare et sa nuance précise est discutée. Avec les ténèbres pour sujet, « couvrir » convient à l’image et au développement du verset suivant, tout en laissant les autres possibilités en note.
- source_word: וְלַיְלָה
  choice: et la nuit
  rationale: Rend simplement la conjonction et le nom, en préservant le parallélisme.
- source_word: אוֹר
  choice: sera lumière
  rationale: La proposition hébraïque est sans verbe exprimé. Le futur s’accorde avec la pensée projetée dans la première proposition, tandis que le nom « lumière » préserve la concision de l’hébreu.
- source_word: בַּעֲדֵנִי
  choice: autour de moi
  rationale: Dans ce contexte, la préposition exprime le plus naturellement une relation spatiale d’enveloppement.
