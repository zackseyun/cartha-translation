lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Pour le maître de chœur
  rationale: Le participe substantivé désigne probablement la personne chargée de diriger l’exécution musicale. « Pour » rend naturellement le lamed du titre tout en laissant ouverte sa fonction exacte.
- source_word: חֲקַרְתַּנִי
  choice: tu m’as examiné
  rationale: Le verbe חקר exprime une recherche approfondie ou un examen attentif; « examiné » convient au registre du psaume sans suggérer une simple recherche d’information.
- source_word: וַתֵּדָע
  choice: et tu me connais
  rationale: Le complément « me » est implicite dans le contexte. Le présent français exprime naturellement la connaissance acquise et désormais effective, sans réduire le verbe à un simple événement passé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération lisible du nom divin personnel, plutôt que son remplacement silencieux par un titre.
theological_decisions:
- issue: Rapport de David au psaume dans לְדָוִד
  choice: De David
  alternative: Pour David / Au sujet de David
  rationale: Le lamed peut signaler l’auteur, une dédicace ou une association. La formulation française brève « De David » conserve dans une certaine mesure cette ambiguïté traditionnelle sans imposer une théorie précise de l’attribution.
translation_notes:
  register: Français international actuel, simple et digne. Le titre est conservé sous une forme concise, et le passage à la prière directe est marqué par un alinéa.
