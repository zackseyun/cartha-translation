  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: fr
  text: 'Pour le maître de chœur[a]. De David[b]. Psaume.


    Yahweh, tu m’as examiné et tu me connais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au maître de chœur » ; dans les titres des psaumes, la préposition hébraïque peut indiquer la destination ou la dédicace.
    reason: lexical_alternative
  - marker: b
    text: Ou « Pour David » ; l’expression hébraïque peut indiquer l’auteur, une dédicace ou une association.
