id: PSA.139.13
reference: Psalms 139:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑/י תְּ֝סֻכֵּ֗/נִי בְּ/בֶ֣טֶן אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: fr
  text: Car c’est toi qui as formé mes profondeurs[a] ; tu m’as tissé dans le ventre de ma mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes reins », expression hébraïque désignant le plus profond de l’être.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « tu m’as enveloppé » ; plus littéralement : « tu m’as couvert ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange exprimée dans le contexte précédent et conserve naturellement la valeur causale de l’hébreu.
- source_word: קָנִיתָ
  choice: tu as formé
  rationale: Le verbe peut signifier « acquérir » ou « posséder », mais, dans ce contexte de formation prénatale, « former » exprime naturellement l’action créatrice de Dieu sans connotation commerciale.
- source_word: כִלְיֹתָי
  choice: mes profondeurs
  rationale: Littéralement « mes reins », expression hébraïque désignant les parties les plus intimes de l’être. « Mes profondeurs » reste concret et poétique tout en étant compréhensible en français moderne.
- source_word: תְּסֻכֵּנִי
  choice: tu m’as tissé
  rationale: Le sens premier de la racine concerne le fait de couvrir ou protéger. Dans le contexte du ventre maternel, « tissé » rend l’image d’une formation délicate, tout en signalant en note la formulation plus littérale.
- source_word: בְּבֶטֶן אִמִּי
  choice: dans le ventre de ma mère
  rationale: Rendu français naturel qui conserve le lieu de la formation et la référence maternelle ; « ventre » correspond directement à בטן, tandis que « sein maternel » serait plus idiomatique mais moins concret.
theological_decisions:
- issue: Rendre la formation prénatale sans ajouter de formulation doctrinale ultérieure
  choice: Le verset affirme poétiquement l’action directe de Dieu dans la formation du psalmiste dans le ventre maternel.
  alternative: 'Traduire plus littéralement : « tu as acquis mes reins ; tu m’as couvert dans le ventre de ma mère ».'
  rationale: La traduction conserve la forte affirmation de l’action divine avant la naissance, sans développer des conclusions doctrinales qui ne sont pas explicitement formulées dans ce verset.
translation_notes:
  register: Français international moderne, poétique et digne. « Mes profondeurs » évite l’opacité de « mes reins » dans cet emploi figuré ; « tu m’as tissé » préserve l’image traditionnelle de la formation tout en indiquant en note l’ambiguïté lexicale.
