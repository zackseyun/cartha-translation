id: PSA.139.17
reference: Psalms 139:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: fr
  text: Et pour moi, que tes pensées[a] sont précieuses, ô Dieu ! Que leur nombre[b] est immense !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes amis » ou « ceux qui te sont chers ». La forme hébraïque peut se comprendre ainsi, mais le contexte du dénombrement aux versets 17-18 favorise « tes pensées ».
    reason: alternative_reading
  - marker: b
    text: Littéralement « leurs têtes » ; cette expression désigne probablement ici leur somme ou leur total.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: Pour moi
  rationale: La préposition avec suffixe marque ici le point de vue personnel avec insistance. « Pour moi » est naturel en français et laisse ouverte la nuance connective ou légèrement contrastive du וְ.
- source_word: מַה יָּקְרוּ
  choice: que … sont précieuses
  rationale: מַה a une valeur exclamative, et יקר exprime ici la valeur ou le prix. La tournure « que … sont précieuses » restitue naturellement l’émerveillement du texte.
- source_word: רֵעֶיךָ
  choice: tes pensées
  rationale: La forme peut aussi être comprise comme « tes amis » ou « ceux qui te sont chers », mais la mention de leur dénombrement au verset 18 favorise ici le sens traditionnel et contextuel de « pensées ».
- source_word: אֵל
  choice: ô Dieu
  rationale: אֵל fonctionne comme une apostrophe directe. « Ô Dieu » en conserve la force poétique et vocative.
- source_word: מֶה עָצְמוּ
  choice: Que … est immense
  rationale: La seconde proposition est elle aussi exclamative. Le verbe עצם peut évoquer la puissance ou la multitude ; dans le contexte du comptage, « immense » exprime bien la grandeur numérique.
- source_word: רָאשֵׁיהֶם
  choice: leur nombre
  rationale: Littéralement « leurs têtes », expression comprise ici comme leur somme ou leur total. « Leur nombre » prépare clairement l’allusion au fait de les compter au verset suivant.
theological_decisions:
- issue: Sens de רֵעֶיךָ
  choice: tes pensées
  alternative: tes amis ; ceux qui te sont chers
  rationale: Le contexte immédiat, qui parle de compter ces réalités et de leur multitude, favorise « pensées ». La variante possible est néanmoins signalée afin de préserver l’ambiguïté réelle de l’hébreu sans imposer une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux exclamations parallèles sont conservées. « Pour moi » évite une tournure trop littérale, tandis que « leur nombre » rend intelligible l’idiome hébreu. Tous les appels de note figurent dans le texte.
