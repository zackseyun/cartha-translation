  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: fr
  text: SEIGNEUR, ne détesté-je pas ceux qui te détestent ? N’ai-je pas en horreur ceux qui se dressent contre toi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ / אֶשְׂנָא
  choice: ceux qui te détestent / ne détesté-je pas
  rationale: Le même verbe hébreu שׂנא est rendu par le même verbe français afin de préserver la reprise expressive du texte.
- source_word: יְהוָה
  choice: SEIGNEUR
  rationale: Cette forme suit la convention française courante qui représente le nom divin YHWH par « SEIGNEUR » en petites capitales ou en capitales.
- source_word: וּבִתְקוֹמְמֶיךָ
  choice: ceux qui se dressent contre toi
  rationale: Le participe réfléchi de קום désigne ceux qui se soulèvent ou prennent position contre Dieu.
- source_word: אֶתְקוֹטָט
  choice: n’ai-je pas en horreur
  rationale: Le verbe rare exprime ici l’aversion ou le dégoût profond; « avoir en horreur » conserve sa force sans introduire l’idée moins probable de lutte active.
theological_decisions:
- issue: La haine déclarée par le psalmiste envers les adversaires de Dieu
  choice: Conserver sans atténuation « détester » et « avoir en horreur »
  alternative: Adoucir en « désapprouver » ou « rejeter »
  rationale: Le verset exprime délibérément une loyauté intense et troublante; la traduction ne doit ni l’atténuer ni ajouter une justification théologique absente du texte.
translation_notes:
  register: Français moderne, direct et digne. Les deux propositions sont rendues comme des questions rhétoriques parallèles. L’inversion « ne détesté-je pas » est soutenue mais naturelle dans ce registre poétique.
