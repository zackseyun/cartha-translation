id: PSA.139.12
reference: Psalms 139:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם חֹשֶׁךְ֮ לֹֽא יַחְשִׁ֪יךְ מִ֫מֶּ֥/ךָ וְ֭/לַיְלָה כַּ/יּ֣וֹם יָאִ֑יר כַּ֝/חֲשֵׁיכָ֗ה כָּ/אוֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/012.yaml
  text: Even darkness is not dark to you[a]; the night shines like the day[b]; darkness is like light to you.
translation:
  language: fr
  text: Même les ténèbres ne sont pas obscures pour toi[a] ; la nuit brille comme le jour ; ténèbres et lumière sont pareilles pour toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Même les ténèbres n’obscurcissent pas pour toi. » Le verbe hébreu signifie « rendre sombre, obscurcir ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme les ténèbres, comme la lumière » ; autrement dit, les ténèbres et la lumière sont semblables devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Introduit avec emphase une extension de la pensée précédente : même les ténèbres ne limitent pas la perception de Dieu.'
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Terme français courant et poétique qui maintient l’opposition avec la lumière.
- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: ne sont pas obscures pour toi
  rationale: Rend naturellement en français le verbe causatif « obscurcir, rendre sombre » sans transformer l’image en explication sur ce qui serait caché à Dieu.
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  choice: la nuit brille comme le jour
  rationale: Conserve le parallélisme, la comparaison marquée par כְּ et le sens de אור, « briller, éclairer ».
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: ténèbres et lumière sont pareilles pour toi
  rationale: Exprime en français naturel la comparaison elliptique finale selon laquelle obscurité et lumière sont équivalentes devant Dieu, sans effacer la variante syntaxique possible.
theological_decisions:
- issue: Explicitation de l’incapacité des ténèbres à cacher quoi que ce soit à Dieu
  choice: Conserver l’image selon laquelle les ténèbres ne sont pas obscures pour Dieu.
  alternative: Même les ténèbres ne peuvent rien te cacher.
  rationale: L’alternative exprime justement l’implication contextuelle, mais ajoute un objet et résout l’image en une affirmation explicite sur la perception divine.
- issue: Interprétation de la dernière proposition comparative
  choice: Ténèbres et lumière sont pareilles pour toi.
  alternative: Comme les ténèbres, ainsi est la lumière.
  rationale: L’hébreu est très condensé et peut être compris comme une formule d’équivalence. Le texte principal donne cette valeur en français idiomatique, tandis que la note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, digne et poétique. « Ténèbres » maintient le contraste biblique traditionnel sans archaïsme marqué. La ponctuation suit les trois membres parallèles du vers.
