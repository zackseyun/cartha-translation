id: PSA.139.18
reference: Psalms 139:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶ֭סְפְּרֵ/ם מֵ/ח֣וֹל יִרְבּ֑וּ/ן הֱ֝קִיצֹ֗תִי וְ/עוֹדִ֥/י עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: fr
  text: Si je les comptais[a], elles seraient plus nombreuses que les grains de sable. Quand je m’éveille[b], je suis encore avec toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand je les compte, elles sont plus nombreuses que les grains de sable. » L’hébreu est concis et permet de nuancer différemment la relation entre les deux propositions.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « Je me suis éveillé, et je suis encore avec toi. » L’hébreu ne précise pas explicitement si ce réveil est habituel, ponctuel ou figuré.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְפְּרֵם
  choice: Si je les comptais
  rationale: Le qal inaccompli à la 1re personne avec suffixe objet peut introduire ici une tentative hypothétique de dénombrement. Cette tournure est naturelle en français et conserve le pronom qui renvoie au contexte précédent.
- source_word: מֵחוֹל יִרְבּוּן
  choice: elles seraient plus nombreuses que les grains de sable
  rationale: Le préfixe מ exprime la comparaison, et רבה indique la supériorité numérique. « Les grains de sable » explicite naturellement en français ce qui se compte, sans modifier l’image.
- source_word: הֱקִיצֹתִי
  choice: Quand je m’éveille
  rationale: La forme signifie « je me suis éveillé / je m’éveille ». La subordonnée temporelle préserve l’indétermination contextuelle entre réveil habituel, ponctuel ou figuré.
- source_word: וְעוֹדִי עִמָּךְ
  choice: je suis encore avec toi
  rationale: עוֹדִי exprime la continuité de l’état, tandis que עִמָּךְ signifie simplement « avec toi ». La formulation française est directe et ne surinterprète pas la nature de cette présence.
theological_decisions:
- issue: Référent du pronom « les / elles »
  choice: Le pronom renvoie aux pensées de Dieu mentionnées au verset précédent.
  alternative: Il pourrait récapituler plus largement les œuvres merveilleuses ou les desseins de Dieu.
  rationale: Le contexte immédiat favorise les pensées de Dieu. Le texte principal conserve toutefois le pronom hébreu plutôt que de répéter explicitement « tes pensées ».
- issue: Sens de la dernière proposition
  choice: Au réveil, le psalmiste constate qu’il est toujours avec Dieu.
  alternative: Il peut s’agir du réveil après le sommeil et la méditation; certains y perçoivent aussi un écho possible d’un réveil au-delà de la mort.
  rationale: Le verset affirme la continuité de la présence avec Dieu, sans préciser la nature du réveil. Aucune référence explicite à la résurrection n’est donc ajoutée.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le féminin « elles » reprend naturellement « les pensées » du verset précédent. Le tutoiement conserve l’adresse directe du psaume.
