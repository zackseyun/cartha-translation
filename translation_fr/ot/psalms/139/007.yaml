  text: Where can I go from your Spirit? Or where can I flee from your presence?[a]
translation:
  language: fr
  text: Où pourrais-je aller loin de ton Esprit[a] ? Où pourrais-je fuir loin de ta présence ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « Esprit » peut aussi signifier « vent » ou « souffle » ; ici, le contexte favorise « Esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֭נָה
  choice: Où
  rationale: Adverbe interrogatif de destination. « Où » est naturel en français moderne; le mouvement est exprimé par le verbe « aller ».
- source_word: אֵלֵךְ
  choice: pourrais-je aller
  rationale: L’imparfait hébreu à la première personne apparaît dans une question rhétorique portant sur la possibilité de se soustraire à Dieu. Le conditionnel « pourrais-je » rend naturellement cette nuance en français.
- source_word: מֵ/רוּחֶךָ
  choice: loin de ton Esprit
  rationale: רוּחַ peut désigner l’esprit, le vent ou le souffle. Son parallélisme avec « ta présence » et le contexte du psaume favorisent ici « Esprit ». « Loin de » exprime idiomatiquement l’éloignement recherché.
- source_word: וְ/אָ֗נָה
  choice: Où
  rationale: La conjonction relie deux questions parallèles. En français poétique naturel, la juxtaposition et la répétition de « Où » suffisent sans imposer un « et » ou un « ou » absent de la nuance principale.
- source_word: מִ/פָּנֶיךָ
  choice: loin de ta présence
  rationale: פָּנִים signifie littéralement « face », mais la construction désigne ici la présence personnelle de Dieu. « Ta présence » transmet clairement l’idiome hébreu.
- source_word: אֶבְרָֽח
  choice: pourrais-je fuir
  rationale: Le verbe ברח signifie « fuir ». Dans cette question rhétorique, « pourrais-je fuir » conserve le parallélisme et souligne l’impossibilité de l’évasion sans remplacer le verbe par l’idée plus interprétative d’« échapper ».
theological_decisions:
- issue: Faut-il rendre רוּחַ par une réalité impersonnelle (« vent », « souffle ») ou par une référence personnelle et divine (« Esprit ») ?
  choice: ton Esprit
  alternative: ton vent / ton souffle
  rationale: Le psaume traite de la connaissance totale et de la présence à laquelle nul ne peut se soustraire. Le parallélisme avec « ta présence » favorise fortement une référence à l’Esprit de Dieu, tout en laissant les autres sens lexicaux signalés en note.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition de « Où pourrais-je » conserve le parallélisme hébreu. « Loin de » rend les deux prépositions d’éloignement de manière fluide et symétrique.
