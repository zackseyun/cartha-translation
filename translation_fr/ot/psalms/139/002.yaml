source:
  edition: WLC
  text: אַתָּ֣ה יָ֭דַעְתָּ שִׁבְתִּ֣/י וְ/קוּמִ֑/י בַּ֥נְתָּה לְ֝/רֵעִ֗/י מֵ/רָחֽוֹק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/002.yaml
  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: fr
  text: Tu sais quand je m’assieds et quand je me lève ; tu discernes ma pensée[a] de loin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon intention » ou « mon dessein ».
    reason: lexical_alternative
  - marker: b
    text: « De loin » peut évoquer une distance spatiale ou le fait que Dieu discerne la pensée bien avant qu’elle soit exprimée.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: tu sais
  rationale: Le qal accompli à la 2e personne du singulier exprime ici la connaissance pleine et constante de Dieu. Le présent français rend naturellement cette valeur stative dans le contexte.
- source_word: שִׁבְתִּי
  choice: quand je m’assieds
  rationale: Cette tournure française naturelle exprime l’action de s’asseoir tout en conservant son parallélisme avec « quand je me lève ».
- source_word: וְקוּמִי
  choice: et quand je me lève
  rationale: La formulation maintient le couple poétique avec l’action de s’asseoir, probablement une manière d’englober les activités ordinaires de la vie.
- source_word: בַּנְתָּה
  choice: tu discernes
  rationale: « Discerner » traduit l’idée d’une compréhension pénétrante et distingue ce verbe de יָדַע, rendu par « savoir » dans le premier membre.
- source_word: לְרֵעִי
  choice: ma pensée
  rationale: Le nom peut désigner la pensée, l’intention ou le dessein. « Ma pensée » est ici le rendu le plus direct, sans exclure les autres nuances.
- source_word: מֵרָחוֹק
  choice: de loin
  rationale: 'Cette expression proche de l’hébreu conserve l’image et son ambiguïté : elle peut évoquer une distance spatiale ou une connaissance antérieure à l’expression de la pensée.'
theological_decisions:
- issue: Étendue de la connaissance divine dans le verset
  choice: Le texte affirme la connaissance profonde que Dieu a des actes et de la pensée intérieure du psalmiste, sans préciser un modèle philosophique de l’omniscience.
  alternative: Interpréter « de loin » exclusivement comme une distance spatiale, ou le paraphraser explicitement comme une connaissance anticipée de la pensée.
  rationale: L’hébreu présente une connaissance divine des réalités extérieures et intérieures, mais laisse ouverte la portée exacte de « de loin ». La traduction préserve cette tension poétique et théologique.
translation_notes:
  register: Français moderne, international et digne. Les propositions temporelles « quand je m’assieds » et « quand je me lève » sont plus idiomatiques que des substantifs d’action, tout en préservant le parallélisme hébreu. « De loin » maintient volontairement l’ambiguïté de l’original.
