source:
  edition: WLC
  text: אִם אֶסַּ֣ק שָׁ֭מַיִם שָׁ֣ם אָ֑תָּה וְ/אַצִּ֖יעָה שְּׁא֣וֹל הִנֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/008.yaml
  text: If I ascend to heaven[a], you are there; if I make my bed in Sheol, behold, you are there.
translation:
  language: fr
  text: Si je monte au ciel, tu es là ; si je me fais un lit dans le séjour des morts[a], te voici !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le shéol ». Le mot hébreu désigne le domaine des morts, sans signifier nécessairement « l’enfer » au sens ultérieur de lieu de châtiment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La conjonction introduit ici une hypothèse et ouvre naturellement la construction poétique parallèle.
- source_word: אֶסַּק
  choice: je monte
  rationale: Ce verbe exprime un mouvement ascendant ; « je monte » est actuel et conserve clairement l’image verticale.
- source_word: שָׁמַיִם
  choice: au ciel
  rationale: Dans l’opposition poétique avec le séjour des morts, le singulier français « ciel » désigne naturellement le domaine d’en haut.
- source_word: שָׁם אָתָּה
  choice: tu es là
  rationale: Cette formulation conserve le repère spatial et l’adresse directe à Dieu.
- source_word: וְאַצִּיעָה
  choice: si je me fais un lit
  rationale: Le verbe évoque l’action d’étendre ou de préparer une couche. Cette expression française naturelle maintient l’image concrète sans la réduire au simple fait de descendre.
- source_word: שְּׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression rend le domaine des morts visé par le terme hébreu sans lui imposer le sens plus tardif de lieu de châtiment final.
- source_word: הִנֶּךָּ
  choice: te voici !
  rationale: « Te voici » restitue avec concision la force déictique et emphatique de הִנֵּה accompagné du suffixe de deuxième personne.
theological_decisions:
- issue: Sens de שְּׁאוֹל dans l’affirmation de la présence universelle de Dieu
  choice: le séjour des morts
  alternative: le shéol ; la tombe ; l’enfer
  rationale: Le terme hébreu désigne ici le domaine des morts, opposé au ciel. « L’enfer » introduirait indûment une conception ultérieure du châtiment eschatologique, tandis que « la tombe » pourrait restreindre l’image à une sépulture individuelle.
translation_notes:
  register: Français moderne, direct et poétique. Le tutoiement maintient l’adresse personnelle à Dieu. Le parallélisme entre le ciel et le séjour des morts est conservé, de même que l’exclamation finale suscitée par הִנֶּה.
