  text: אֽוֹדְ/ךָ֗ עַ֤ל כִּ֥י נוֹרָא֗וֹת נִ֫פְלֵ֥יתִי נִפְלָאִ֥ים מַעֲשֶׂ֑י/ךָ וְ֝/נַפְשִׁ֗/י יֹדַ֥עַת מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: fr
  text: Je te loue[a], car je suis fait d’une manière qui suscite la crainte respectueuse et l’émerveillement[b]. Merveilleuses sont tes œuvres, et mon être tout entier le sait très bien[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je te célèbre » ou « Je te remercie ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu évoque une crainte révérencielle et l’émerveillement, non la terreur. Le contexte parle de la manière dont Dieu a formé le psalmiste.
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : « mon âme » ; le mot peut aussi désigner « moi-même » ou « mon être intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: Je te célèbre
  rationale: Le hiphil de ידה exprime ici la louange ou l’action de grâce adressée à Dieu. « Je te célèbre » garde la portée doxologique tout en restant naturel en français.
- source_word: עַל כִּי
  choice: car
  rationale: La locution introduit la raison de la louange. « Car » convient au registre poétique et exprime clairement le rapport causal.
- source_word: נוֹרָאוֹת
  choice: d’une manière impressionnante
  rationale: Le terme, issu de ירא, évoque ce qui suscite l’émerveillement et un respect mêlé de crainte, non ce qui serait simplement terrifiant. « Impressionnante » communique cette force en français moderne.
- source_word: נִפְלֵיתִי
  choice: je suis fait … merveilleuse
  rationale: Le niphal de פלא décrit ce qui est extraordinaire ou merveilleux. Le contexte immédiat de la formation du psalmiste autorise l’ajout de « fait », nécessaire à une formulation française naturelle, sans masquer dans la note la formulation plus littérale.
- source_word: נִפְלָאִים מַעֲשֶׂיךָ
  choice: Merveilleuses sont tes œuvres
  rationale: Cette inversion conserve l’accent initial de l’hébreu sur le caractère merveilleux des œuvres de Dieu et garde une diction poétique intelligible.
- source_word: וְנַפְשִׁי
  choice: et mon être tout entier
  rationale: נפש peut désigner l’âme, la personne elle-même ou l’être intérieur. « Mon être tout entier » rend ici la connaissance personnelle et profonde sans imposer une anthropologie dualiste.
- source_word: יֹדַעַת מְאֹד
  choice: le sait très bien
  rationale: Le complément est implicite en hébreu et renvoie à ce qui vient d’être affirmé. Le pronom « le » l’explicite naturellement en français.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: mon être tout entier
  alternative: mon âme ; moi-même ; mon être intérieur
  rationale: Le mot hébreu ne requiert pas une séparation stricte entre corps et âme. Le choix principal exprime la personne dans sa profondeur et sa totalité, tandis que la note préserve les autres possibilités.
- issue: Sens de נוֹרָאוֹת
  choice: d’une manière impressionnante
  alternative: d’une manière redoutable ; de façon à inspirer une crainte respectueuse
  rationale: Le terme évoque l’émerveillement et la crainte révérencielle. La traduction évite de suggérer que la création de l’être humain serait terrifiante, tout en conservant l’idée de saisissement.
- issue: Valeur de נִפְלֵיתִי dans le contexte de la création
  choice: je suis fait … merveilleuse
  alternative: je suis merveilleusement distingué ; je suis extraordinaire
  rationale: Le verbe ne signifie pas explicitement « faire », mais les versets voisins parlent de la formation du psalmiste. L’ajout rend le sens contextuel en français, et la note signale la formulation plus littérale.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion « Merveilleuses sont tes œuvres » reproduit l’emphase hébraïque sans devenir obscure. « Impressionnante » est employé au sens de ce qui saisit et inspire un profond respect.
