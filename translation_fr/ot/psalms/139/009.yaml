  text: אֶשָּׂ֥א כַנְפֵי שָׁ֑חַר אֶ֝שְׁכְּנָ֗ה בְּ/אַחֲרִ֥ית יָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/009.yaml
  text: If I take up the wings of the dawn[a], if I dwell in the farthest part of the sea,
translation:
  language: fr
  text: Si je prends les ailes de l’aurore[a], si je demeure aux confins de la mer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux confins de l’ouest » ; dans la géographie poétique hébraïque, « la mer » peut évoquer l’ouest.'
    reason: alternative lexicale
lexical_decisions:
- source_word: אֶשָּׂא
  choice: je prends
  rationale: Le verbe נשׂא signifie « lever, porter, prendre ». Avec l’image des ailes, « prendre les ailes » exprime naturellement l’idée de s’en emparer pour gagner rapidement un lieu lointain.
- source_word: כַנְפֵי
  choice: les ailes de
  rationale: כנף désigne d’abord une aile, puis par extension un bord ou une extrémité. « Les ailes de l’aurore » conserve ici la métaphore poétique.
- source_word: שָׁחַר
  choice: l’aurore
  rationale: שׁחר désigne l’aube ou l’aurore. « Aurore » convient au registre poétique et s’associe naturellement aux « ailes ».
- source_word: אֶשְׁכְּנָה
  choice: je vais demeurer
  rationale: שכן signifie « demeurer, s’établir ». La tournure « je vais demeurer » rend la valeur cohortative possible de la forme hébraïque et l’idée de s’installer dans le lieu évoqué.
- source_word: בְּאַחֲרִית
  choice: au-delà de
  rationale: אַחֲרִית désigne l’extrémité ou la limite la plus reculée. Dans la géographie poétique du verset, « au-delà de la mer » rend de façon idiomatique la destination occidentale extrêmement lointaine, sans transformer directement יָם en « ouest ».
- source_word: יָם
  choice: la mer
  rationale: יָם signifie littéralement « mer » et peut évoquer l’ouest dans la géographie hébraïque. Le texte conserve l’image concrète de la mer, tandis que la note explicite la nuance directionnelle.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme conditionnel est conservé. « Au-delà de la mer » est plus naturel en français que « à l’extrémité de la mer » et exprime la destination occidentale lointaine suggérée par le contexte.
