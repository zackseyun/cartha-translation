  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר יְהוָ֥ה חֲ֝קַרְתַּ֗/נִי וַ/תֵּדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: fr
  text: Au maître de chant[a]. De David[b]. Psaume. Yahweh, tu m’as sondé et tu me connais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour le maître de chant » ; dans les titres des psaumes, la préposition hébraïque peut marquer la destination ou l’attribution.
    reason: lexical_alternative
  - marker: b
    text: Ou « Pour David » ou « Par David » ; le titre hébreu peut indiquer l’auteur, une dédicace ou une association.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au maître de chant
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Au maître de chant » est concis, naturel en français et conserve la valeur possible de destination du préfixe ל.
- source_word: לְדָוִד
  choice: De David
  rationale: Le préfixe ל dans les titres peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « De David » maintient mieux cette diversité possible que « par David ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Le nom désigne un chant, probablement accompagné d’instruments à cordes. « Psaume » est l’équivalent français consacré et clair dans un titre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer le titre « le Seigneur ».
- source_word: חֲקַרְתַּנִי
  choice: tu m’as sondé
  rationale: Le verbe exprime un examen approfondi. « Sonder » préserve l’image et convient au registre poétique, tandis que le passé composé rend ici naturellement l’accompli hébreu.
- source_word: וַתֵּדָע
  choice: et tu me connais
  rationale: ידע signifie « connaître ». Le présent français exprime naturellement la connaissance actuelle et complète qui résulte de l’examen, sans alourdir le vers par « tu m’as connu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Portée de לְדָוִד dans le titre
  choice: De David
  alternative: Par David
  rationale: La formulation retenue évite d’imposer l’idée d’auteur comme seule interprétation possible et préserve l’ambiguïté du titre hébreu.
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement convient à l’adresse directe à Dieu. La ponctuation distingue nettement le titre du corps du verset.
