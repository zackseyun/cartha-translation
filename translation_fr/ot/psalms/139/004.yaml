id: PSA.139.4
reference: Psalms 139:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: fr
  text: Car aucune parole n’est sur ma langue — voici[a], Yahweh, tu la connais tout entière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oui » ou « assurément ».
    reason: La particule הֵן peut servir d’appel à l’attention ou marquer fortement l’affirmation.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente et maintient naturellement le lien logique en français.
- source_word: אֵין מִלָּה
  choice: aucune parole n’est
  rationale: Cette formulation rend la négation existentielle et le singulier מִלָּה dans un français clair, tout en laissant ouverte la nuance exacte du rapport entre la parole et la langue.
- source_word: בִּלְשׁוֹנִי
  choice: sur ma langue
  rationale: Cette expression conserve l’image corporelle de l’hébreu, qui évoque une parole présente ou sur le point d’être prononcée.
- source_word: הֵן
  choice: voici
  rationale: « Voici » conserve la fonction emphatique et l’appel à l’attention de la particule, tandis qu’une autre valeur possible est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: יָדַעְתָּ
  choice: tu la connais
  rationale: Le parfait hébreu exprime ici une connaissance certaine et complète; le présent français convient au sens statif. Le pronom féminin reprend « parole ».
- source_word: כֻלָּהּ
  choice: tout entière
  rationale: Le féminin singulier renvoie naturellement à « parole » et souligne que Yahweh la connaît dans sa totalité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Étendue de la connaissance divine exprimée par כֻלָּהּ
  choice: tu la connais tout entière
  alternative: tu sais tout
  rationale: Le choix principal rattache grammaticalement le suffixe féminin à « parole » et conserve l’affirmation de sa connaissance exhaustive, sans élargir explicitement l’objet à toute chose.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste proche de l’hébreu afin de préserver sa formulation frappante et son ambiguïté, sans ajouter « encore » ou « déjà », qui expliciteraient une temporalité seulement implicite.
