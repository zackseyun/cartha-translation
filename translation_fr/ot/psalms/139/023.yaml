  text: חָקְרֵ֣/נִי אֵ֭ל וְ/דַ֣ע לְבָבִ֑/י בְּ֝חָנֵ֗/נִי וְ/דַ֣ע שַׂרְעַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: fr
  text: Sonde-moi, ô Dieu, et connais mon cœur ; éprouve-moi et connais mes pensées inquiètes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes pensées troublantes » ou « mes pensées partagées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: Sonde-moi
  rationale: Le verbe חקר exprime une investigation approfondie. « Sonde-moi » est naturel dans un registre poétique et conserve l’image d’un examen qui atteint les profondeurs de la personne.
- source_word: אֵל
  choice: ô Dieu
  rationale: אֵל est ici un titre divin employé en apostrophe. « ô Dieu » rend explicitement cette adresse directe tout en convenant au registre digne de la prière.
- source_word: וְדַע
  choice: et connais
  rationale: ידע demande ici à Dieu de connaître pleinement. La répétition de « connais » est maintenue afin de respecter le parallélisme poétique de l’hébreu.
- source_word: לְבָבִי
  choice: mon cœur
  rationale: לֵבָב désigne la vie intérieure, notamment la pensée et la volonté. « Mon cœur » demeure en français une expression claire, large et poétiquement appropriée.
- source_word: בְּחָנֵנִי
  choice: éprouve-moi
  rationale: בחן évoque une mise à l’épreuve destinée à révéler la qualité réelle, comme lors de l’essai d’un métal. « Éprouve-moi » préserve cette nuance et se distingue de « sonde-moi ».
- source_word: שַׂרְעַפָּי
  choice: mes pensées inquiètes
  rationale: שַׂרְעַפִּים peut désigner des pensées troublantes, partagées ou inquiètes. « Mes pensées inquiètes » fournit un sens naturel en contexte sans effacer les autres nuances possibles, signalées en note.
theological_decisions:
- issue: Langage anthropologique de la vie intérieure
  choice: Conserver à la fois « mon cœur » et « mes pensées inquiètes ».
  alternative: Réduire les deux expressions à « mon être intérieur » et « mon esprit ».
  rationale: L’hébreu emploie en parallèle deux termes distincts concernant la vie intérieure. Les conserver évite d’imposer une conception psychologique moderne et maintient la richesse poétique.
- issue: Nature exacte des שַׂרְעַפִּים
  choice: « pensées inquiètes » dans le texte, avec les autres nuances en note.
  alternative: « pensées troublantes » ou « pensées partagées » dans le texte principal.
  rationale: Le terme admet plusieurs nuances qui touchent au trouble, à l’inquiétude ou à la division intérieure. Le contexte ne permet pas de trancher absolument ; la note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs brefs et la répétition de « connais » reproduisent le parallélisme de la prière. « Ô » marque clairement l’apostrophe sans alourdir la phrase.
