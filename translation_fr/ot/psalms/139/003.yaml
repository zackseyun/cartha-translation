  text: אָרְחִ֣/י וְ/רִבְעִ֣/י זֵרִ֑יתָ וְֽ/כָל דְּרָכַ֥/י הִסְכַּֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/003.yaml
  text: You sift out my path and my lying down[a], and you are acquainted with all my ways.
translation:
  language: fr
  text: Tu passes au crible mon chemin et mon coucher[a], et toutes mes voies te sont familières.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le fait de me coucher ». Le mot hébreu désigne l’action de se coucher ou de s’étendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרְחִי
  choice: mon chemin
  rationale: Le nom désigne un sentier ou un chemin. « Mon chemin » conserve l’image concrète tout en pouvant évoquer le cours de la vie.
- source_word: רִבְעִי
  choice: mon repos
  rationale: Le terme renvoie au fait de se coucher ou de s’étendre. « Mon repos » est naturel en français et maintient le contraste avec le déplacement évoqué par « chemin ».
- source_word: זֵרִיתָ
  choice: tu passes au crible
  rationale: Le verbe évoque littéralement le vannage ou le tri et, dans ce contexte, un examen minutieux. Cette expression française préserve l’image sans réduire le sens à un simple « tu connais ».
- source_word: כָל
  choice: toutes
  rationale: Le quantificateur exprime la totalité et porte ici sur le pluriel féminin « voies ».
- source_word: דְּרָכַי
  choice: mes voies
  rationale: Le mot peut désigner des routes aussi bien que la conduite ou les manières d’agir. « Mes voies » conserve cette double portée concrète et figurée.
- source_word: הִסְכַּנְתָּה
  choice: te sont familières
  rationale: Dans ce contexte, la forme verbale exprime une connaissance étroite ou approfondie. La tournure est naturelle en français et évite d’ajouter une explication doctrinale.
theological_decisions:
- issue: Image anthropomorphique de la connaissance divine
  choice: Conserver l’image concrète du passage au crible et celle des voies, tout en exprimant la connaissance exhaustive de Dieu sans développement doctrinal.
  alternative: Aplanir les images en traduisant « tu examines » et « tu connais ».
  rationale: Le verset décrit poétiquement la connaissance intime de Dieu au moyen d’images concrètes. Les maintenir respecte la texture du texte hébreu et sa tension entre déplacement, repos et conduite.
translation_notes:
  register: Français international moderne, poétique et digne. « Passer au crible » rend de façon intelligible l’image hébraïque du vannage; « mon repos » évite la lourdeur de « le fait que je me couche », tandis que la note conserve l’autre nuance possible.
