source:
  edition: WLC
  text: אִם תִּקְטֹ֖ל אֱל֥וֹהַּ רָשָׁ֑ע וְ/אַנְשֵׁ֥י דָ֝מִ֗ים ס֣וּרוּ מֶֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/019.yaml
  text: If only you would kill the wicked[a], O God, and you men of blood, depart from me.
translation:
  language: fr
  text: Ah ! si tu tuais le méchant, ô Dieu ! Hommes de sang[a], éloignez-vous de moi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « hommes de sangs » : des hommes violents ou meurtriers.'
    reason: Explication d’un idiome hébreu conservé dans le texte.
lexical_decisions:
- source_word: אִם תִּקְטֹל
  choice: Ah ! si tu tuais
  rationale: En tête de cette exclamation, אִם avec l’imparfait exprime un souhait plutôt qu’une condition ordinaire. « Ah ! si tu tuais » rend naturellement en français cette valeur optative sans atténuer le verbe.
- source_word: אֱלוֹהַּ
  choice: ô Dieu
  rationale: Le nom est employé comme apostrophe. « ô Dieu » marque clairement l’adresse directe et convient au registre solennel de la prière.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le terme est morphologiquement singulier. Le français conserve ici ce singulier générique, tandis que l’adresse plurielle qui suit élargit la scène aux hommes violents.
- source_word: וְאַנְשֵׁי דָמִים
  choice: Hommes de sang
  rationale: L’expression hébraïque, littéralement « hommes de sangs », désigne des hommes violents ou meurtriers. Le calque intelligible « hommes de sang » préserve l’image frappante de l’original; une note en explicite le sens.
- source_word: סוּרוּ מֶנִּי
  choice: éloignez-vous de moi
  rationale: L’impératif pluriel de סור commande aux hommes de sang de se retirer. « Éloignez-vous de moi » est direct, naturel et plus courant en français moderne que « retirez-vous loin de moi ».
theological_decisions:
- issue: Faut-il atténuer le souhait imprécatoire adressé à Dieu ?
  choice: Conserver le souhait explicite que Dieu tue le méchant.
  alternative: Reformuler comme une simple annonce du jugement ou employer un verbe atténué tel que « traiter » ou « supprimer ».
  rationale: L’hébreu exprime directement le souhait que Dieu tue le méchant. La traduction garde cette tension théologique et morale au lieu de la résoudre ou de l’adoucir.
- issue: Rapport entre « le méchant » au singulier et « hommes de sang » au pluriel
  choice: Préserver le singulier hébreu puis l’apostrophe plurielle.
  alternative: Uniformiser les deux expressions au pluriel, par exemple « les méchants » puis « hommes sanguinaires ».
  rationale: Le changement de nombre appartient à la forme du texte et peut refléter un singulier générique suivi d’une adresse au groupe; il n’est pas nécessaire de l’harmoniser.
translation_notes:
  register: Français moderne, direct et digne. L’interjection « Ah ! » et l’apostrophe « ô Dieu » rendent le souhait ardent et la prière solennelle; « éloignez-vous » reste courant. La ponctuation distingue l’appel à Dieu de l’ordre adressé aux hommes violents.
