  text: even there your hand will lead me, and your right hand will hold me fast.
translation:
  language: fr
  text: Même là, ta main me conduira, et ta main droite me saisira.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם שָׁם
  choice: Même là
  rationale: Rend naturellement l’idée inclusive et emphatique de « même en ce lieu-là », en continuité avec le contexte.
- source_word: תַנְחֵנִי
  choice: me conduira
  rationale: Le verbe נחה exprime l’action de guider ou conduire; le futur français convient à la forme imperfective et au parallélisme.
- source_word: וְתֹאחֲזֵנִי
  choice: et … me saisira
  rationale: אחז signifie saisir, tenir ou retenir. « Me saisira » préserve la force concrète du verbe sans préciser indûment si le geste protège ou retient.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: Traduction directe de l’expression hébraïque, associée ici à la puissance et à l’action de Dieu.
theological_decisions:
- issue: Nuance de l’action de la main droite
  choice: me saisira
  alternative: me tiendra fermement
  rationale: Le texte affirme que Dieu saisit le psalmiste, mais l’adverbe « fermement » n’est pas explicite. La formulation retenue conserve la vigueur et l’ambiguïté du verbe hébreu.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme entre « ta main » et « ta main droite » est conservé, tout comme le mouvement futur des deux verbes.
