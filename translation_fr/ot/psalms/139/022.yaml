source:
  edition: WLC
  text: תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑י/ם לְ֝/אוֹיְבִ֗ים הָ֣יוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/022.yaml
  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: fr
  text: Je les hais d’une haine totale[a] ; ils sont devenus mes ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une haine extrême » ou « d’une haine parfaite ».
    reason: 'Alternative lexicale : תַּכְלִית peut évoquer la totalité, le degré ultime ou l’achèvement.'
lexical_decisions:
- source_word: תַּכְלִית
  choice: totale
  rationale: Le nom exprime ici l’achèvement, la totalité ou le degré extrême. Dans la construction תַּכְלִית שִׂנְאָה, « totale » restitue clairement et naturellement la force intensive.
- source_word: שִׂנְאָה
  choice: haine
  rationale: Le substantif est conservé afin de rendre la répétition emphatique de la racine hébraïque de la haine dans « je hais… d’une haine ».
- source_word: שְׂנֵאתִים
  choice: Je les hais
  rationale: Le parfait qal avec suffixe de troisième personne masculine plurielle exprime ici l’attitude ferme et présente du psalmiste ; le présent français convient au discours poétique.
- source_word: לְאוֹיְבִים
  choice: mes ennemis
  rationale: Avec היה et לִי, le syntagme indique un état ou un rôle résultant dans la relation au psalmiste. « Mes ennemis » est idiomatique et garde le sens relationnel.
- source_word: הָיוּ לִי
  choice: ils sont devenus mes ennemis
  rationale: 'Le passé composé rend naturellement la valeur résultative possible de היה + ל : ils en sont venus à être ses ennemis, avec un état qui demeure.'
theological_decisions:
- issue: Force de la dénonciation du psalmiste
  choice: Conserver explicitement le langage de la haine personnelle, renforcé par la répétition.
  alternative: « Je m’oppose entièrement à eux » ou « je les considère comme mes ennemis »
  rationale: L’hébreu emploie deux fois la racine liée à la haine. La traduction ne doit ni atténuer cette dureté pour des raisons de sensibilité moderne, ni ajouter une justification théologique absente du verset.
translation_notes:
  register: Français international moderne, direct et digne. La tournure « haïr d’une haine » est volontairement conservée malgré son caractère marqué, car elle reproduit l’emphase poétique de la répétition hébraïque. Le point-virgule maintient le parallélisme entre les deux propositions.
