  text: גָּלְמִ֤/י רָ֘א֤וּ עֵינֶ֗י/ךָ וְ/עַֽל סִפְרְ/ךָ֮ כֻּלָּ֪/ם יִכָּ֫תֵ֥בוּ יָמִ֥ים יֻצָּ֑רוּ ו/לא אֶחָ֣ד בָּ/הֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: fr
  text: 'Tes yeux ont vu mon être encore informe[a] ; dans ton livre, ils étaient tous inscrits : les jours qui furent façonnés[b], alors qu’aucun d’eux n’existait encore.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon embryon », « ma forme inachevée ». Le mot hébreu désigne quelque chose qui n’est pas encore pleinement formé.
    reason: lexical_alternative
  - marker: b
    text: 'La syntaxe hébraïque est très condensée et difficile. On peut aussi comprendre : « tous étaient inscrits dans ton livre, les jours furent façonnés ». « Façonnés » peut aussi être traduit par « formés » ; « décrétés » serait plus interprétatif que le verbe hébreu lui-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלְמִי
  choice: mon corps encore informe
  rationale: גֹּלֶם désigne ici ce qui n’est pas encore achevé ou formé. « Mon corps encore informe » reste naturel en français, conserve l’image corporelle du contexte et évite d’imposer le terme biologique moderne « embryon ».
- source_word: רָאוּ עֵינֶיךָ
  choice: Tes yeux ont vu
  rationale: Traduction directe du verbe qatal avec « tes yeux » pour sujet ; le passé composé convient au français moderne tout en gardant la formulation poétique.
- source_word: וְעַל סִפְרְךָ
  choice: dans ton livre
  rationale: Bien que עַל signifie souvent « sur », le français idiomatique dit que des éléments sont inscrits « dans » un livre.
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: ils étaient tous inscrits
  rationale: Le passif conserve l’image du livre et la compression de l’hébreu. Le pronom « ils » laisse son antécédent être précisé par l’apposition « les jours ».
- source_word: יָמִים
  choice: les jours
  rationale: « Les jours » est vraisemblablement l’antécédent de « tous » ; l’apposition française rend intelligible la syntaxe condensée sans effacer sa structure.
- source_word: יֻצָּרוּ
  choice: furent façonnés
  rationale: Le Pual de יצר signifie « être formé/façonné ». « Façonnés » préserve l’image d’une action créatrice sans renforcer le verbe jusqu’à « décrétés » ou « ordonnés ».
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: alors qu’aucun d’eux n’existait encore
  rationale: La proposition hébraïque est elliptique. Cette formulation explicite sobrement l’idée temporelle implicite et donne un français naturel.
theological_decisions:
- issue: Faut-il rendre יֻצָּרוּ par un terme affirmant explicitement la prédestination ?
  choice: furent façonnés
  alternative: furent décrétés / furent ordonnés
  rationale: Le passage présente la connaissance préalable et l’action intentionnelle de Dieu, mais le sens lexical fondamental de יצר est « former/façonner ». La traduction évite donc de trancher la tension théologique par un terme doctrinalement plus fort.
- issue: Faut-il ajouter « pour moi » après « façonnés » ?
  choice: ne pas l’ajouter dans le texte principal
  alternative: les jours façonnés pour moi
  rationale: Le contexte concerne bien les jours du psalmiste, mais « pour moi » n’est pas exprimé dans cette proposition hébraïque. Son omission maintient une traduction plus étroitement fondée sur le texte source.
translation_notes:
  register: Français international moderne, digne et poétique. La formulation conserve l’image concrète du corps informe, du livre et des jours façonnés, tout en rendant lisible la syntaxe hébraïque particulièrement condensée.
