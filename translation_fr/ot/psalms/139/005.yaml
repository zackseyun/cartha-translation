id: PSA.139.5
reference: Psalms 139:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָח֣וֹר וָ/קֶ֣דֶם צַרְתָּ֑/נִי וַ/תָּ֖שֶׁת עָלַ֣/י כַּפֶּֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/005.yaml
  text: You hem me in behind and before[a], and lay your hand upon me.
translation:
  language: fr
  text: Tu m’enserres par-derrière et par-devant[a], et tu poses ta main sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu m’entoures » ou « Tu m’assièges »; le verbe hébreu peut évoquer ici aussi bien une présence enveloppante et protectrice qu’une contrainte pressante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחוֹר
  choice: par-derrière
  rationale: Rend le sens spatial « derrière » et forme avec « par-devant » une paire poétique claire.
- source_word: קֶדֶם
  choice: par-devant
  rationale: Dans l’opposition avec אָחוֹר, le terme est compris spatialement (« devant »), plutôt que temporellement ou géographiquement.
- source_word: צַרְתָּנִי
  choice: tu m’enserres
  rationale: Rend l’idée d’entourer étroitement sans trancher entre protection et contrainte; « former » est ici moins probable au vu des deux indications spatiales.
- source_word: וַתָּשֶׁת
  choice: tu poses
  rationale: Traduction naturelle du verbe « placer, poser », adaptée à l’expression française « poser la main sur ».
- source_word: עָלַי
  choice: sur moi
  rationale: Rend directement la préposition עַל dans cette image de la main posée sur le psalmiste.
- source_word: כַּפֶּךָ
  choice: ta main
  rationale: Bien que כַּף puisse désigner la paume, « main » est la formulation idiomatique naturelle en français et conserve l’image anthropomorphique.
theological_decisions:
- issue: La clôture divine est-elle protectrice, contraignante, ou les deux?
  choice: Conserver l’ambivalence avec « tu m’enserres ».
  alternative: Employer « tu me protèges » pour une lecture nettement rassurante, ou « tu m’assièges » pour une lecture nettement oppressive.
  rationale: Le contexte présente la connaissance et la présence totales de Dieu comme à la fois intimes et potentiellement accablantes. Le verbe hébreu permet cette tension, que la traduction ne doit pas résoudre artificiellement.
translation_notes:
  register: Français international moderne, poétique et digne. « Par-derrière et par-devant » conserve le parallélisme spatial de l’hébreu; « enserres » maintient volontairement l’ambivalence du verbe.
