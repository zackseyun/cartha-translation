  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: fr
  text: 'Cette connaissance est trop merveilleuse pour moi[a] ; elle est trop élevée : je ne peux l’atteindre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cette connaissance me dépasse ; elle est trop élevée, je ne peux l’atteindre. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: פלאיה
  choice: Une telle connaissance me dépasse
  rationale: Le terme exprime ce qui est extraordinaire, prodigieux ou hors de la compréhension ordinaire. Avec מִמֶּנִּי, « me dépasse » rend naturellement en français l’idée d’une réalité qui excède les capacités du psalmiste.
- source_word: דַעַת
  choice: connaissance
  rationale: Le nom désigne directement la « connaissance » et renvoie ici à la connaissance divine décrite dans les versets précédents.
- source_word: מִמֶּנִּי
  choice: me dépasse
  rationale: Littéralement « de moi » ou « plus que moi » ; dans ce contexte, la tournure indique que cette connaissance est au-delà des capacités du locuteur.
- source_word: נִשְׂגְּבָה
  choice: elle est trop élevée
  rationale: Le verbe évoque ce qui est élevé, inaccessible ou hors d’atteinte. Cette traduction conserve l’image de la hauteur et prépare naturellement la proposition suivante.
- source_word: לֹא אוּכַל
  choice: je ne peux pas
  rationale: Traduction directe de la négation suivie de la première personne du verbe יכל, qui exprime l’incapacité.
- source_word: לָהּ
  choice: l’atteindre
  rationale: La forme signifie littéralement « jusqu’à elle / vers elle ». Le verbe « atteindre », nécessaire en français après « je ne peux pas », est déduit de l’image de hauteur et d’inaccessibilité.
