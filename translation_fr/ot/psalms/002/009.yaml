id: PSA.2.9
reference: Psalms 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: fr
  text: Tu les briseras[b] avec un sceptre de fer[a] ; tu les mettras en pièces comme un vase de potier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sceptre » peut aussi se traduire par « verge » ou « bâton » ; le terme hébreu peut désigner un signe d’autorité ou un instrument de correction.
    reason: lexical_alternative
  - marker: b
    text: 'Selon une autre tradition textuelle, attestée dans certaines versions anciennes et reprise dans l’Apocalypse, on peut lire : « Tu les conduiras comme un berger avec un sceptre de fer » ou « Tu les gouverneras avec un sceptre de fer ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: Tu les briseras
  rationale: La vocalisation massorétique rattache le verbe à l’idée de briser, et le parallélisme avec תְּנַפְּצֵם appuie un jugement destructeur. L’autre tradition de lecture est signalée en note.
- source_word: בְּשֵׁבֶט
  choice: avec un sceptre
  rationale: שֵׁבֶט peut désigner une verge, un bâton ou un sceptre. Dans le cadre royal du psaume 2, « sceptre » exprime naturellement l’autorité royale tout en conservant l’image d’un instrument de jugement.
- source_word: בַּרְזֶל
  choice: de fer
  rationale: Le terme désigne directement le fer et souligne ici la force et la rigueur.
- source_word: כִּכְלִי יוֹצֵר
  choice: comme un vase de potier
  rationale: כְּלִי est un objet ou récipient, et יוֹצֵר désigne ici le potier. « Vase de potier » est une expression française naturelle qui rend clairement l’image de la poterie fragile.
- source_word: תְּנַפְּצֵם
  choice: tu les mettras en pièces
  rationale: Le verbe évoque un fracassement violent. « Mettre en pièces » est actuel, expressif et convient à la comparaison avec un vase.
theological_decisions:
- issue: Le premier verbe décrit-il un jugement destructeur ou un gouvernement royal/pastoral ?
  choice: '« Tu les briseras » : jugement destructeur'
  alternative: « Tu les conduiras comme un berger » ou « Tu les gouverneras »
  rationale: La vocalisation du texte massorétique et le parallélisme avec « tu les mettras en pièces » favorisent le sens destructeur. Une autre tradition textuelle, attestée dans certaines versions anciennes et reprise dans l’Apocalypse, comprend toutefois le verbe au sens de faire paître ou gouverner ; cette tension est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le futur simple garde la force de la déclaration. « Sceptre » maintient le contexte royal ; « mettre en pièces » rend avec naturel la violence de l’image. Les marqueurs sont placés immédiatement après les expressions auxquelles les notes se rapportent.
