  text: Why do the nations rage[a], and the peoples plot in vain?
translation:
  language: fr
  text: Pourquoi les nations s’agitent-elles, et les peuples forment-ils des projets vains[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « murmurent des choses vaines » ou « méditent des choses vaines ». Le verbe hébreu peut évoquer le murmure, la méditation ou la conception d’un projet, et le nom désigne le vide, la vanité ou ce qui est futile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Interrogatif naturel qui conserve la force rhétorique de l’hébreu.
- source_word: רָגְשׁוּ
  choice: s’agitent
  rationale: Le verbe évoque l’agitation tumultueuse de groupes. « S’agitent » en restitue le noyau lexical sans imposer trop précisément l’idée de fureur ou de complot.
- source_word: גוֹיִם
  choice: les nations
  rationale: Désigne ici des collectivités politiques; « nations » évite d’importer le sens religieux plus tardif de « païens ».
- source_word: לְאֻמִּים
  choice: les peuples
  rationale: Préserve le parallélisme avec « nations » ainsi que la nuance collective du pluriel hébreu.
- source_word: יֶהְגּוּ
  choice: méditent
  rationale: Le verbe peut désigner le fait de murmurer, de méditer ou de concevoir. « Méditent » conserve mieux cette ampleur sémantique que le seul « complotent », même si le contexte rend une intention hostile probable.
- source_word: רִיק
  choice: ce qui est vain
  rationale: Le nom signifie le vide, la vanité ou ce qui est futile. Cette formulation le garde comme objet du verbe plutôt que de le transformer en simple adverbe (« en vain »).
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe poétique et le parallélisme sont conservés; la note maintient l’ambiguïté lexicale du second verbe et de son objet.
