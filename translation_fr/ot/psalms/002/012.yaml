  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: fr
  text: Embrassez le fils[a], de peur qu’il ne s’irrite et que vous ne périssiez en chemin, car sa colère s’embrase vite[b]. Heureux tous ceux qui trouvent refuge en lui !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Rendez hommage au fils. » Le verbe signifie littéralement « embrasser » et peut désigner un geste de soumission ou d’hommage dans un cadre royal. Le terme araméen bar, traduit ici par « fils », est inhabituel dans ce verset ; certains proposent plutôt « pureté » ou « purement ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « car sa colère s’embrase pour peu de temps » ou « car sa colère va bientôt s’embraser ». L’expression hébraïque, très concise, peut souligner soit la brièveté, soit la soudaineté ou l’imminence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Embrassez
  rationale: L’impératif pluriel de נשׁק signifie concrètement « embrasser ». Dans ce cadre royal, le geste exprime vraisemblablement la soumission ou l’hommage ; l’image hébraïque est conservée dans le texte, avec l’interprétation explicitée en note.
- source_word: בַר
  choice: le fils
  rationale: Bien qu’inhabituel ici et discuté, בַר se comprend le mieux comme « fils » dans le contexte royal du psaume et en écho au verset 7. Les autres analyses sont signalées en note.
- source_word: פֶּן יֶאֱנַף
  choice: de peur qu’il ne s’irrite
  rationale: פֶּן introduit l’éventualité négative que l’impératif cherche à prévenir, tandis que אנף désigne la colère. Cette formulation française reste naturelle et solennelle.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: et que vous ne périssiez en chemin
  rationale: אבד signifie « périr » et דֶרֶךְ apparaît sans préposition dans une expression poétique condensée. « En chemin » préserve l’idée d’une ruine sur le parcours sans imposer une interprétation trop précise.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: car sa colère s’embrase en un instant
  rationale: בער conserve l’image du feu, et כמעט peut exprimer une faible mesure ou un très court délai. « En un instant » rend clairement la soudaineté possible, tandis que l’autre nuance est conservée en note.
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Formule de béatitude courante dans les Psaumes. « Heureux » est naturel en français biblique moderne et désigne l’état favorable de ceux qui se réfugient en Dieu, au-delà d’une simple émotion.
- source_word: כָּל חוֹסֵי בוֹ
  choice: tous ceux qui trouvent refuge en lui
  rationale: חסה évoque le fait de chercher protection et sécurité. « Trouver refuge en lui » restitue naturellement cette image en français.
theological_decisions:
- issue: Identité de בַר en Psaumes 2.12
  choice: « le fils », en continuité avec la figure royale appelée « mon fils » au verset 7
  alternative: Comprendre le terme comme « pureté », « purement », ou reconnaître ici une difficulté textuelle sans référent filial
  rationale: Le contexte littéraire et royal favorise la lecture filiale sans exiger que le verset explicite à lui seul des développements doctrinaux ultérieurs. La difficulté réelle du terme demeure visible dans la note.
- issue: Référent des pronoms masculins dans l’avertissement et la béatitude
  choice: Conserver « il », « sa » et « lui » sans préciser davantage le référent
  alternative: Identifier explicitement le référent comme le fils royal ou comme Dieu
  rationale: L’hébreu emploie des formes pronominales masculines, mais le verset compact laisse une certaine tension quant au référent exact. La traduction ne résout pas silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible tout en conservant l’image concrète du baiser, la métaphore du feu et la formulation de béatitude. Les ambiguïtés de בַר, de כִּמְעַט et du référent pronominal ne sont pas effacées.
