  naturalness: Le français est globalement naturel, poétique et accessible. « Embrassez le fils » garde l’image concrète de l’hébreu; la note fournit utilement le sens d’hommage. La construction « de peur qu’il ne s’irrite et que vous ne périssiez » est recevable dans un registre soutenu. « Heureux tous ceux qui trouvent refuge en lui ! » est idiomatique.
  terminology: '« Fils », « s’irrite », « périssiez » et « trouvent refuge » conviennent au registre des Psaumes sans surinterprétation doctrinale. La note sur בַר doit conserver le caractère disputé de ce terme. La première alternative de la note b, « pour peu de chose », est en revanche trompeuse en français moderne : elle suggère que la colère est déclenchée par un motif insignifiant, sens que l’hébreu n’exprime pas nécessairement.'
