source:
  edition: WLC
  text: וְ֭/עַתָּה מְלָכִ֣ים הַשְׂכִּ֑ילוּ הִ֝וָּסְר֗וּ שֹׁ֣פְטֵי אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/010.yaml
  text: So now[a], O kings, be wise; be warned, O judges of the earth.
translation:
  language: fr
  text: Et maintenant, rois, faites preuve de sagesse ; acceptez la correction[a], juges de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « laissez-vous instruire » ou « tenez compte de l’avertissement ». Le verbe hébreu peut évoquer l’instruction, la discipline ou la réprimande reçue.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois la conjonction et la valeur temporelle de la transition, tout en introduisant naturellement l’exhortation qui découle de ce qui précède.
- source_word: מְלָכִים
  choice: rois
  rationale: Le nom est employé en apostrophe. En français moderne, la ponctuation suffit à marquer l’adresse directe, sans ajouter « ô », plus solennel et moins courant.
- source_word: הַשְׂכִּילוּ
  choice: faites preuve de sagesse
  rationale: L’impératif hiphil de שכל appelle à une intelligence avisée qui se manifeste dans la conduite. Cette formulation rend cette dimension pratique plus nettement que le simple « soyez sages ».
- source_word: הִוָּסְרוּ
  choice: acceptez la correction
  rationale: L’impératif niphal de יסר peut désigner le fait de recevoir instruction, discipline ou réprimande. « Acceptez la correction » conserve l’idée de se laisser reprendre sans réduire le terme à un simple avertissement.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: juges de la terre
  rationale: Rend précisément la fonction judiciaire exprimée par שֹׁפְטֵי. Dans le cadre international du psaume, « terre » convient mieux que « pays ».
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique, avec une adresse directe claire. Le parallélisme entre « rois » et « juges de la terre » est préservé, de même que la progression entre discernement pratique et acceptation de la réprimande.
