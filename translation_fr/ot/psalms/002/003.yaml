lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Arrachons
  rationale: Le cohortatif à la première personne du pluriel exprime une résolution commune. « Arrachons » rend avec force l’idée de rompre ou de détacher ce qui entrave.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: leurs liens
  rationale: Le nom désigne des entraves ou des liens. « Liens » reste concret sans préciser indûment qu’il s’agit de chaînes métalliques.
- source_word: וְנַשְׁלִיכָה
  choice: et rejetons
  rationale: Le second cohortatif poursuit l’exhortation résolue. « Rejetons » exprime à la fois le geste de lancer et le refus de la contrainte.
- source_word: מִמֶּנּוּ
  choice: loin de nous
  rationale: La préposition avec le suffixe de première personne du pluriel indique l’éloignement par rapport aux locuteurs. « Loin de nous » est idiomatique et souligne ce mouvement.
- source_word: עֲבֹתֵימוֹ
  choice: leurs cordes
  rationale: Le terme désigne des cordes ou cordons servant à attacher. « Cordes » est clair en français moderne et maintient le parallélisme concret des entraves.
theological_decisions:
- issue: Métaphore de la contrainte divine et royale
  choice: Conserver l’image concrète des liens et des cordes sans qualifier moralement cette contrainte.
  alternative: Interpréter les entraves comme une oppression, ou employer des termes abstraits tels que « joug » et « obligations ».
  rationale: Dans le contexte, les nations rejettent le SEIGNEUR et son oint, mais le verset rapporte leur propre parole imagée. La traduction préserve cette perspective et sa tension sans y ajouter un jugement explicatif.
translation_notes:
  register: Français international moderne, poétique et énergique. L’impératif à la première personne du pluriel reproduit naturellement la valeur cohortative. La ponctuation marque qu’il s’agit de la parole des rois et dirigeants commencée au verset précédent.
