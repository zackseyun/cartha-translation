id: PSA.2.11
reference: Psalms 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/יִרְאָ֑ה וְ֝/גִ֗ילוּ בִּ/רְעָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/011.yaml
  text: Serve Yahweh with fear[b][a], and rejoice with trembling.
translation:
  language: fr
  text: Servez Yahweh avec crainte[a], et exultez en tremblant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec révérence » ; le mot hébreu peut exprimer aussi bien la crainte que le profond respect éprouvé devant Dieu.
    reason: lexical_alternative
  - marker: b
    text: Litt. « dans le tremblement ».
    reason: literal_rendering
lexical_decisions:
- source_word: עִבְדוּ
  choice: Servez
  rationale: L’impératif pluriel de עבד exprime ici le service et l’allégeance dus à Yahweh. « Servez » conserve cette ampleur sans réduire le sens au seul culte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, qui préserve le nom personnel plutôt que de lui substituer un titre.
- source_word: בְּיִרְאָה
  choice: avec crainte
  rationale: יִרְאָה peut désigner la crainte, la révérence ou l’effroi respectueux. « Avec crainte » est direct et maintient la force du contexte.
- source_word: וְגִילוּ
  choice: et exultez
  rationale: גיל exprime une joie vive, allant jusqu’à l’exultation. « Exultez » rend mieux cette intensité que le plus général « réjouissez-vous ».
- source_word: בִּרְעָדָה
  choice: en tremblant
  rationale: רְעָדָה désigne le tremblement. La tournure française « en tremblant » est naturelle et conserve le contraste avec l’exultation.
theological_decisions:
- issue: Association de la joie et de la crainte dans les deux impératifs
  choice: 'Conserver sans l’atténuer la tension : « Servez Yahweh avec crainte, et exultez en tremblant. »'
  alternative: « Servez Yahweh avec révérence et réjouissez-vous devant lui »
  rationale: L’hébreu juxtapose la soumission craintive et la joie intense. La traduction ne doit ni adoucir la crainte en simple respect ni éliminer le paradoxe de l’exultation accompagnée de tremblement.
- issue: Rendu de יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin personnel ; sa translittération le distingue d’un titre.
translation_notes:
  register: Français moderne, international et digne. L’impératif pluriel s’adresse collectivement aux rois et aux dirigeants mentionnés dans le contexte. « Exultez » garde la vigueur poétique du verbe hébreu, tandis que « en tremblant » demeure idiomatique.
