source:
  edition: WLC
  text: אֲסַפְּרָ֗ה אֶֽ֫ל חֹ֥ק יְֽהוָ֗ה אָמַ֘ר אֵלַ֥/י בְּנִ֥/י אַ֑תָּה אֲ֝נִ֗י הַ/יּ֥וֹם יְלִדְתִּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/007.yaml
  text: 'I will declare the decree of Yahweh: He said to me[a], “You are my Son[b]; today I have begotten you.”'
translation:
  language: fr
  text: 'Je proclamerai le décret de Yahvé : il m’a dit : « Tu es mon Fils[a] ; aujourd’hui, je t’ai engendré[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon fils ». L’hébreu ne distingue pas les majuscules des minuscules ; la majuscule du texte principal met en relief la portée royale et messianique du verset dans son contexte et dans son usage canonique ultérieur.
    reason: alternative_reading
  - marker: b
    text: Ou « aujourd’hui, je suis devenu ton père ». L’hébreu emploie plus littéralement le langage de l’engendrement, qui peut évoquer l’intronisation ou l’adoption royale ; le texte principal conserve cette image.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Je proclamerai
  rationale: La forme volitive ou imperfective introduit ici une déclaration solennelle. « Proclamer » convient au contexte royal et reste naturel en français moderne.
- source_word: אֶל חֹק יְהוָה
  choice: le décret de Yahvé
  rationale: Avec ספר, אֶל peut introduire l’objet ou le contenu proclamé. חֹק désigne ici une décision royale établie, d’où « décret ». Le nom divin יהוה est rendu par « Yahvé ».
- source_word: אָמַר אֵלַי
  choice: Il m’a dit
  rationale: Le sujet implicite renvoie naturellement à Yahvé, nommé dans la phrase précédente. Le pronom évite une répétition sans créer d’ambiguïté.
- source_word: בְּנִי אַתָּה
  choice: Tu es mon Fils
  rationale: L’ordre hébreu signifie littéralement « mon fils, c’est toi ». La majuscule signale la portée royale et messianique reconnue dans l’usage canonique, sans modifier le sens lexical; l’autre graphie est indiquée en note.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent français moderne et direct, qui conserve l’accent temporel.
- source_word: אֲנִי ... יְלִדְתִּיךָ
  choice: moi, je t’ai engendré
  rationale: Le pronom indépendant אֲנִי donne une certaine emphase, rendue par « moi, je ». Le verbe ילד emploie l’image de l’engendrement; cette formulation la préserve sans la réduire à une seule interprétation.
theological_decisions:
- issue: Filiation royale et portée messianique de בְּנִי
  choice: « Tu es mon Fils » dans le texte principal
  alternative: « Tu es mon fils »
  rationale: Le contexte immédiat concerne le roi davidique, tandis que la réception canonique applique aussi ce verset au Messie. Comme l’hébreu ne marque pas les majuscules, la variante en minuscule est explicitement conservée.
- issue: Sens de « aujourd’hui, moi, je t’ai engendré »
  choice: Conserver le langage de l’engendrement
  alternative: « aujourd’hui, je suis devenu ton père »
  rationale: L’hébreu utilise explicitement une image de génération ou de naissance. La traduction ne tranche pas entre intronisation royale, adoption covenantale et accomplissement messianique.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Proclamer » et « décret » maintiennent le registre royal. La ponctuation française clarifie que les paroles suivantes constituent le décret, tandis que « moi, je » conserve l’emphase du pronom hébreu.
