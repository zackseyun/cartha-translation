source:
  edition: WLC
  text: אָ֤ז יְדַבֵּ֣ר אֵלֵ֣י/מוֹ בְ/אַפּ֑/וֹ וּֽ/בַ/חֲרוֹנ֥/וֹ יְבַהֲלֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/005.yaml
  text: Then he will speak to them in his anger[a], and in his burning wrath he will terrify them.
translation:
  language: fr
  text: Alors il leur parlera dans sa colère et, dans sa fureur brûlante, il les terrifiera.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui fait progresser la scène vers la réponse de Dieu; « Alors » est naturel et concis.
- source_word: יְדַבֵּר
  choice: il parlera
  rationale: L’imparfait piel présente ici la réponse qui suivra; le futur français convient à cette progression.
- source_word: אֵלֵימוֹ
  choice: leur
  rationale: Le pronom masculin pluriel renvoie aux rois et aux dirigeants rebelles des versets précédents.
- source_word: בְאַפּוֹ
  choice: dans sa colère
  rationale: אַף désigne littéralement le nez, mais exprime idiomatiquement la colère; la traduction française restitue le sens sans conserver une image obscure.
- source_word: וּבַחֲרוֹנוֹ
  choice: et, dans sa fureur brûlante
  rationale: חָרוֹן évoque une colère ardente et intensifiée; « fureur brûlante » préserve l’image de la chaleur tout en se distinguant de « colère ».
- source_word: יְבַהֲלֵמוֹ
  choice: il les terrifiera
  rationale: Le piel de בהל indique qu’on provoque l’effroi, la panique ou le désarroi; « terrifiera » en conserve ici toute la force.
theological_decisions:
- issue: Langage anthropopathique concernant la colère divine
  choice: Conserver explicitement « sa colère » et « sa fureur brûlante ».
  alternative: Atténuer en parlant de son mécontentement ou de son jugement.
  rationale: L’hébreu décrit avec force l’opposition personnelle de Dieu à la rébellion. La traduction préserve cette tension théologique sans l’adoucir ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et l’intensification de « colère » à « fureur brûlante » sont conservés; aucun marqueur de note n’est nécessaire.
