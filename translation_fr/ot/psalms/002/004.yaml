id: PSA.2.4
reference: Psalms 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יוֹשֵׁ֣ב בַּ/שָּׁמַ֣יִם יִשְׂחָ֑ק אֲ֝דֹנָ֗/י יִלְעַג לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: fr
  text: Celui qui trône dans les cieux rit[a] ; le Seigneur se moque d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui siège dans les cieux rit ; le Seigneur les tourne en dérision. »'
    reason: Alternative lexicale plus littérale pour יוֹשֵׁב et autre rendu possible de יִלְעַג.
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: celui qui trône
  rationale: Le participe signifie littéralement « celui qui est assis » ou « celui qui demeure ». Dans ce psaume consacré à la révolte des rois, « trône » restitue naturellement en français la nuance de souveraineté céleste sans rendre explicite davantage que le contexte.
- source_word: בַּשָּׁמַיִם
  choice: dans les cieux
  rationale: Le pluriel « les cieux » reflète la forme hébraïque et convient au registre élevé du psaume ; « le ciel » resterait possible, mais serait moins formellement proche.
- source_word: יִשְׂחָק
  choice: rit
  rationale: L’imparfait hébreu peut ici exprimer une action présente, caractéristique et vive. Le présent français s’insère naturellement dans la scène et conserve le verbe concret sans ajouter « avec mépris ».
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre אֲדֹנָי et non du nom divin YHWH. « Le Seigneur » est sa traduction française courante et digne dans ce contexte.
- source_word: יִלְעַג
  choice: se moque de
  rationale: Le verbe exprime la moquerie ou la dérision. « Se moque de » est direct, actuel et compréhensible, tout en maintenant le parallélisme avec « rit ».
- source_word: לָמוֹ
  choice: d’eux
  rationale: Ce pronom renvoie aux peuples et aux dirigeants rebelles des versets précédents. La construction française « se moque d’eux » rend naturellement la relation marquée en hébreu.
theological_decisions:
- issue: Représentation royale et anthropomorphique de Dieu
  choice: Employer « celui qui trône » tout en conservant les verbes concrets « rit » et « se moque d’eux ».
  alternative: « Celui qui siège dans les cieux rit ; le Seigneur les tourne en dérision. »
  rationale: Le contexte royal permet de faire entendre la souveraineté impliquée par la position assise, sans atténuer l’image saisissante de Dieu qui rit et se moque des rebelles. La formulation ne transforme pas ces anthropomorphismes en explication abstraite.
translation_notes:
  register: Français international moderne, poétique et digne. Le point-virgule préserve le parallélisme hébreu ; « les cieux » maintient la couleur élevée du texte.
