  text: שְׁאַ֤ל מִמֶּ֗/נִּי וְ/אֶתְּנָ֣ה ג֭וֹיִם נַחֲלָתֶ֑/ךָ וַ֝/אֲחֻזָּתְ/ךָ֗ אַפְסֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: fr
  text: Demande-moi, et je te donnerai les nations en héritage, et les extrémités de la terre[a] comme ta possession.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les régions les plus lointaines de la terre ».'
    reason: Alternative lexicale pour אַפְסֵי אָרֶץ, expression qui peut évoquer les limites ou les régions les plus reculées de la terre.
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: Demande-moi
  rationale: L’impératif de שאל suivi de מן et du suffixe de première personne invite directement le roi à adresser sa demande à celui qui parle. « Demande-moi » est naturel, concis et conserve le ton solennel.
- source_word: וְאֶתְּנָה
  choice: et je te donnerai
  rationale: La forme volitive de נתן après l’impératif exprime ici la réponse promise à la demande. Le futur français rend clairement cet engagement sans expliciter davantage la relation logique.
- source_word: גּוֹיִם
  choice: les nations
  rationale: גּוֹיִם désigne ici les peuples ou nations. « Les nations » convient à la portée universelle du verset sans introduire la distinction théologique plus tardive que pourrait suggérer « les païens ».
- source_word: נַחֲלָתֶךָ
  choice: en héritage
  rationale: נַחֲלָה désigne un bien reçu en partage ou en héritage. Cette formulation française exprime naturellement le rapport prédicatif entre les nations et l’héritage du destinataire.
- source_word: וַאֲחֻזָּתְךָ
  choice: et … en possession
  rationale: אֲחֻזָּה désigne ce qui est détenu comme possession ou domaine. « En possession » maintient le parallélisme avec « en héritage » tout en distinguant les deux termes hébreux.
- source_word: אַפְסֵי אָרֶץ
  choice: les extrémités de la terre
  rationale: Cette expression désigne les limites ou régions les plus éloignées de la terre. « Les extrémités de la terre » est une tournure française claire, traditionnelle et fidèle à l’image spatiale.
theological_decisions:
- issue: Portée royale ou messianique de la promesse
  choice: Présenter directement la promesse divine adressée au roi ou fils, sans rendre l’interprétation messianique explicite dans le texte.
  alternative: Employer une paraphrase explicitement messianique.
  rationale: Le texte hébreu promet au destinataire les nations et toute l’étendue de la terre. La formulation retenue préserve son ouverture à une lecture royale et canonique sans imposer dans la traduction une conclusion interprétative ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle « en héritage … en possession » conserve la poésie du verset et la distinction entre נַחֲלָה et אֲחֻזָּה. Le marqueur de note est placé après l’expression qu’il précise.
