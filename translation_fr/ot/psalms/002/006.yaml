id: PSA.2.6
reference: Psalms 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֭/אֲנִי נָסַ֣כְתִּי מַלְכִּ֑/י עַל צִ֝יּ֗וֹן הַר קָדְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/006.yaml
  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: fr
  text: Mais moi, j’ai établi[a] mon roi sur Sion, ma montagne sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai installé mon roi » ; certains comprennent le verbe au sens de « j’ai consacré mon roi par l’onction ».
    reason: Alternative lexicale liée au sens discuté du verbe נָסַךְ dans ce contexte.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction suivie du pronom indépendant marque ici à la fois le contraste avec la révolte des nations et l’insistance sur l’action souveraine de Dieu.
- source_word: נָסַכְתִּי
  choice: j’ai établi
  rationale: Dans ce contexte royal, le verbe désigne vraisemblablement l’établissement ou l’installation du roi. « Établi » est naturel et digne en français, tout en évitant de préciser à tort le rite de l’onction.
- source_word: מַלְכִּי
  choice: mon roi
  rationale: Le nom porte un suffixe possessif de première personne du singulier. La minuscule conserve le sens lexical sans imposer une lecture messianique particulière.
- source_word: עַל
  choice: sur
  rationale: Avec le nom de lieu Sion, « sur » exprime naturellement la localisation du roi, plutôt qu’une domination exercée sur Sion.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom de lieu.
- source_word: הַר קָדְשִׁי
  choice: ma montagne sainte
  rationale: Cette formulation rend directement et naturellement le groupe nominal hébreu, tout en conservant l’image de la montagne.
theological_decisions:
- issue: Faut-il rendre נָסַכְתִּי comme une onction rituelle ou comme l’établissement du roi ?
  choice: 'Établissement royal : « j’ai établi mon roi »'
  alternative: 'Onction rituelle : « j’ai consacré mon roi par l’onction » ; ou simple installation : « j’ai installé mon roi »'
  rationale: Le contexte présente la réponse de Dieu aux rois rebelles par l’établissement de son propre roi à Sion. « Établi » conserve cette portée royale sans confondre le verbe avec le terme hébreu habituel pour oindre et sans imposer une interprétation rituelle plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe brève conserve le contraste emphatique de l’hébreu et le parallélisme poétique du verset.
