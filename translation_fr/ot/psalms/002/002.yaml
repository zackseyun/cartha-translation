  text: יִ֥תְיַצְּב֨וּ מַלְכֵי אֶ֗רֶץ וְ/רוֹזְנִ֥ים נֽוֹסְדוּ יָ֑חַד עַל יְ֝הוָה וְ/עַל מְשִׁיחֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: fr
  text: Les rois de la terre prennent position, et les dirigeants se rassemblent[a] contre Yahvé et contre celui qu’il a consacré par l’onction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tiennent conseil ensemble ». L’expression hébraïque évoque une action commune et coordonnée dans l’opposition.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « son oint ». On peut aussi traduire « son Messie ». Dans les traductions qui rendent le nom divin par un titre, on lit « contre le SEIGNEUR et contre son oint » (ou « son Messie »).
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: prennent position
  rationale: Le hitpael de יצב exprime le fait de se placer délibérément; dans ce contexte hostile, « prennent position » conserve cette nuance sans surinterpréter.
- source_word: מַלְכֵי אֶרֶץ
  choice: les rois de la terre
  rationale: Le syntagme désigne ici les rois terrestres dans une perspective large, plutôt que ceux d’un seul pays.
- source_word: רוֹזְנִים
  choice: les dirigeants
  rationale: Le terme désigne de hauts responsables politiques; « dirigeants » est actuel, clair et suffisamment large.
- source_word: נוֹסְדוּ יָחַד
  choice: se liguent ensemble
  rationale: L’expression décrit une action commune et coordonnée dans l’opposition. « Se liguent » rend mieux cette force contextuelle que le simple « se rassemblent », tandis que la note conserve d’autres possibilités.
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte d’opposition, la préposition a une valeur adversative.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » représente le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: מְשִׁיחוֹ
  choice: celui qu’il a consacré par l’onction
  rationale: Cette formulation traduit le sens de « son oint » en français naturel, préserve le référent royal immédiat et évite d’imposer dans le texte principal le titre interprétatif « Messie ».
theological_decisions:
- issue: Portée royale et messianique de מְשִׁיחוֹ
  choice: celui qu’il a consacré par l’onction
  alternative: son oint ; son Messie
  rationale: L’hébreu désigne littéralement la personne consacrée par l’onction et peut viser immédiatement le roi davidique, tout en portant une trajectoire messianique plus large. Le texte principal conserve cette amplitude; la note signale les formulations plus traditionnelles ou explicitement messianiques.
- issue: Représentation du tétragramme יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Employer le nom propre reflète directement le texte hébreu; la substitution traditionnelle par un titre est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation maintient la tonalité politique et solennelle du psaume, rend explicitement l’action concertée et préserve la tension entre le roi consacré dans le contexte immédiat et la portée messianique du passage.
