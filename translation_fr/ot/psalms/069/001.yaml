source:
  edition: WLC
  text: הוֹשִׁיעֵ֥/נִי אֱלֹהִ֑ים כִּ֤י בָ֖אוּ מַ֣יִם עַד נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/001.yaml
  text: Save me[a], O God, for the waters have come up to my neck.
translation:
  language: fr
  text: Sauve-moi, ô Dieu, car les eaux me montent jusqu’à la gorge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à mon âme » ou « jusqu’à ma vie ». Le mot hébreu peut désigner l’âme, la vie, la personne elle-même ou, dans un contexte comme celui-ci, la gorge.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Sauve-moi
  rationale: L’impératif hifil de ישׁע avec suffixe de première personne exprime un appel direct à la délivrance. « Sauve-moi » est naturel, fort et traditionnel dans le langage des psaumes.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé comme vocatif. « Ô Dieu » conserve l’adresse directe et solennelle sans paraître obscur en français actuel.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel. « Car » convient au registre poétique et reste immédiatement compréhensible.
- source_word: בָאוּ מַיִם
  choice: les eaux me montent
  rationale: L’hébreu dit littéralement que les eaux « sont venues ». Dans l’image d’une submersion, le français idiomatique « me montent » rend naturellement leur progression vers le haut sans ajouter l’idée plus précise d’une inondation.
- source_word: עַד־נָפֶשׁ
  choice: jusqu’à la gorge
  rationale: נֶפֶשׁ peut désigner l’âme, la vie, la personne ou, concrètement dans une scène de noyade, la gorge par laquelle on respire. « Jusqu’à la gorge » communique clairement le péril immédiat tout en laissant la portée existentielle du mot dans la note.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans l’image poétique de détresse
  choice: 'Sens corporel concret : « la gorge »'
  alternative: « l’âme » ou « la vie »
  rationale: Le contexte des eaux qui submergent favorise la partie du corps associée au souffle et au risque de noyade. Cette traduction ne transforme pas le verset en affirmation doctrinale sur l’âme; la polysémie hébraïque est signalée en note.
translation_notes:
  register: Français moderne, naturel et digne, avec une cadence poétique concise. « Ô Dieu » maintient la solennité de la prière; « les eaux me montent jusqu’à la gorge » rend l’image de submersion de façon idiomatique.
