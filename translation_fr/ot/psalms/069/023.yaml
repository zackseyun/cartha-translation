source:
  edition: WLC
  text: תֶּחְשַׁ֣כְנָה עֵ֭ינֵי/הֶם מֵ/רְא֑וֹת וּ֝/מָתְנֵ֗י/הֶם תָּמִ֥יד הַמְעַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: fr
  text: Que leurs yeux s’obscurcissent, de sorte qu’ils ne voient pas, et fais chanceler constamment leurs reins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: Que… s’obscurcissent
  rationale: Le qal inaccompli a ici, dans le contexte imprécatoire, une valeur de souhait ou de prière. La tournure française exprime naturellement l’entrée dans l’obscurité sans préciser davantage l’agent.
- source_word: עֵינֵיהֶם
  choice: leurs yeux
  rationale: Traduction directe qui conserve l’image corporelle du texte hébreu.
- source_word: מֵרְאוֹת
  choice: au point de ne plus voir
  rationale: Le מן suivi de l’infinitif de ראה signifie littéralement « de voir »; après « s’obscurcir », cette formulation française exprime naturellement l’empêchement ou l’incapacité qui en résulte.
- source_word: וּמָתְנֵיהֶם
  choice: leurs reins
  rationale: מָתְנַיִם désigne la région des reins, des hanches ou de la taille. « Reins » conserve ici l’image corporelle traditionnelle dans un registre poétique digne.
- source_word: תָּמִיד
  choice: constamment
  rationale: L’adverbe marque une durée continue; « constamment » est naturel en français moderne.
- source_word: הַמְעַד
  choice: fais… chanceler
  rationale: Le hifil impératif de מעד est causatif et évoque une perte de stabilité. « Faire chanceler » conserve plus précisément cette image que le simple tremblement.
theological_decisions:
- issue: Force imprécatoire du verset
  choice: Rendre les verbes comme une prière ou un souhait de jugement (« Que… et fais… »)
  alternative: Les rendre comme un futur prédictif (« Leurs yeux s’obscurciront… »)
  rationale: Dans le contexte, les formes verbales portent une demande adressée à Dieu plutôt qu’une simple prédiction. La traduction maintient cette tension sans atténuer l’appel au jugement.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe garde le parallélisme de l’hébreu; « reins » est retenu dans son sens corporel biblique, tandis que « chanceler » rend l’instabilité physique suggérée par le verbe.
