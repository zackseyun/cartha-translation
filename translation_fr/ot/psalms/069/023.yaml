review_pass:
  verdict: revise
  source_fidelity: La force imprécatoire est bien rendue par « Que… » puis l’impératif « fais ». « Chanceler » restitue adéquatement le causatif הַמְעַד et l’image d’instabilité des מָתְנַיִם. En revanche, « ne plus voir » introduit l’idée temporelle de cessation (« plus »), absente de מֵרְאוֹת, qui exprime l’empêchement de voir.
  naturalness: Le français est globalement naturel et de registre poétique sobre. « De sorte qu’ils ne voient pas » est plus idiomatique et plus exact que « au point de ne plus voir » dans ce contexte. La position de « constamment » après le verbe rend aussi plus nettement sa portée continue.
  terminology: « Reins » est un terme biblique français établi pour מָתְנַיִם et convient au registre, sans devoir le remplacer par un terme anatomique plus plat. Aucun enjeu théologique supplémentaire ni note n’est requis.
