id: PSA.69.8
reference: Psalms 69:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מ֭וּזָר הָיִ֣יתִי לְ/אֶחָ֑/י וְ֝/נָכְרִ֗י לִ/בְנֵ֥י אִמִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: fr
  text: 'Je suis devenu[a] un inconnu pour mes frères,

    un étranger pour les fils de ma mère[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’étais » ou « je devins ». Le verbe hébreu peut exprimer soit un état passé, soit l’entrée dans cet état.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque « les fils de ma mère » désigne ici les membres les plus proches de la famille, en particulier les frères issus de la même mère.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: un inconnu
  rationale: Le terme décrit quelqu’un devenu étranger à son propre milieu, tenu à distance comme s’il n’était pas des leurs. « Un inconnu » rend naturellement cette rupture relationnelle en français et permet de distinguer le mot parallèle נָכְרִי.
- source_word: הָיִיתִי
  choice: je suis devenu
  rationale: L’accompli de היה peut décrire l’état résultant dans lequel se trouve le psalmiste. Le passé composé français exprime naturellement qu’il en est venu à cette situation, tout en laissant en note les autres valeurs temporelles possibles.
- source_word: לְאֶחָי
  choice: pour mes frères
  rationale: 'La traduction conserve le pluriel masculin explicite du texte hébreu. La préposition לְ exprime ici la relation ou le point de vue : aux yeux de ses frères, il est comme un inconnu.'
- source_word: וְנָכְרִי
  choice: un étranger
  rationale: נָכְרִי désigne une personne étrangère, venue d’un autre groupe. « Un étranger » préserve l’image concrète et renforce le parallélisme avec « un inconnu ».
- source_word: לִבְנֵי אִמִּי
  choice: pour les fils de ma mère
  rationale: Cette formulation proche de l’hébreu conserve l’expression poétique et souligne la parenté la plus étroite, celle de frères ayant la même mère.
theological_decisions:
- issue: Langage de parenté genré
  choice: Conserver « mes frères » et « les fils de ma mère »
  alternative: mes frères et sœurs ; ma famille ; mes proches
  rationale: Les deux expressions hébraïques sont explicitement masculines et forment un parallélisme poétique. Les généraliser ferait disparaître un trait réel du texte sans nécessité contextuelle.
- issue: Valeur temporelle de הָיִיתִי
  choice: je suis devenu
  alternative: j’étais ; je devins
  rationale: Le contexte de lamentation permet de comprendre un état résultant, mais la forme hébraïque ne tranche pas à elle seule entre cette nuance et un simple passé. L’ambiguïté est donc signalée en note.
translation_notes:
  register: Français international actuel, sobre et poétique. Le balancement des deux membres est conservé, avec « un inconnu » puis « un étranger » pour rendre les deux termes hébreux apparentés sans répétition plate. La conjonction initiale du second membre n’est pas explicitée, la juxtaposition étant plus naturelle dans la poésie française.
