source:
  edition: WLC
  text: תְּהִי טִֽירָתָ֥/ם נְשַׁמָּ֑ה בְּ֝/אָהֳלֵי/הֶ֗ם אַל יְהִ֥י יֹשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/025.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: fr
  text: Que leur campement devienne désert[a] ! Que personne n’habite dans leurs tentes[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dévasté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « habitations » ; littéralement « tentes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי
  choice: Que … devienne
  rationale: Le jussif exprime ici un souhait imprécatoire. La tournure française avec « que » et le subjonctif en conserve la force volitive.
- source_word: טִירָתָם
  choice: leur campement
  rationale: טִירָה peut désigner un campement ou un lieu d’habitation fortifié. « Campement » garde le sens collectif et concret, en parallèle avec les tentes.
- source_word: נְשַׁמָּה
  choice: désert
  rationale: Le terme évoque un lieu dévasté et abandonné. Avec « devienne », « désert » forme une expression naturelle et digne en français.
- source_word: בְּאָהֳלֵיהֶם
  choice: dans leurs tentes
  rationale: אֹהֶל désigne littéralement une tente, avec une possible extension au logement. Le choix retient l’image concrète du texte hébreu.
- source_word: אַל יְהִי
  choice: Que … ne …
  rationale: Cette construction jussive négative formule un souhait imprécatoire ; le subjonctif français en rend naturellement la valeur.
- source_word: יֹשֵׁב
  choice: personne n’habite
  rationale: Le participe de ישב signifie ici habiter ou demeurer. La formulation personnelle et verbale est idiomatique en français.
theological_decisions:
- issue: Valeur des jussifs imprécatoires dans un psaume de lamentation
  choice: 'Les rendre comme des souhaits ou requêtes : « Que… ! »'
  alternative: 'Les rendre comme de simples futurs : « Leur campement deviendra désert… »'
  rationale: Les formes hébraïques sont volitives et fonctionnent comme une imprécation devant Dieu, non comme une simple prédiction. Le subjonctif préserve cette tension rhétorique sans l’atténuer.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique et les images concrètes de « campement » et de « tentes » sont conservés ; les deux exclamations rendent la force imprécatoire des jussifs.
