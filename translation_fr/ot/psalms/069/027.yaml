source:
  edition: WLC
  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: fr
  text: 'Ajoute une faute à leur faute[a],

    et ne les laisse pas entrer dans ta justice[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu peut désigner la faute, la culpabilité ou les conséquences de la faute. Autre traduction possible : « Ajoute l’iniquité à leur iniquité. »'
    reason: lexical_alternative
  - marker: b
    text: La « justice » de Dieu peut évoquer son action juste, salvatrice ou qui rétablit le droit.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Ajoute
  rationale: L’impératif de נתן signifie littéralement « donne » ou « place », mais, dans la construction עָוֺן עַל עֲוֺנָם, « ajoute » exprime naturellement l’idée d’accumulation.
- source_word: עָוֺן / עֲוֺנָם
  choice: faute / leur faute
  rationale: Le même nom est rendu de façon identique afin de conserver la répétition. « Faute » est actuel et peut évoquer l’acte coupable aussi bien que la culpabilité, sans réduire le terme à son châtiment.
- source_word: עַל
  choice: à
  rationale: Bien que la préposition signifie littéralement « sur », le français idiomatique emploie « ajouter X à Y ».
- source_word: וְאַל יָבֹאוּ
  choice: et ne leur permets pas d’accéder
  rationale: אַל suivi de l’inaccompli exprime ici un souhait négatif adressé à Dieu. « Ne leur permets pas » en rend clairement la force, tandis que « accéder » conserve l’idée d’entrer dans une réalité ou d’en bénéficier.
- source_word: בְּצִדְקָתֶךָ
  choice: à ta justice
  rationale: צְדָקָה peut désigner la justice, la rectitude ou l’action juste et salvatrice de Dieu. « Ta justice » est le terme français le plus large et préserve cette tension.
theological_decisions:
- issue: Sens de « ta justice » dans cette imprécation
  choice: Conserver « ta justice » sans préciser s’il s’agit de la rectitude de Dieu, de son jugement juste ou de son action qui rétablit et sauve.
  alternative: ta justice qui sauve ; la faveur d’être déclaré juste par toi
  rationale: Le contexte n’impose pas une seule nuance. Une formulation plus précise résoudrait indûment l’ambiguïté théologique du texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Faute » évite le caractère plus ecclésiastique d’« iniquité », conservé en note. La tournure « ne leur permets pas d’accéder » est naturelle tout en maintenant la métaphore d’une entrée dans la justice divine.
