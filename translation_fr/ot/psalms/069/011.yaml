translation:
  language: fr
  text: J’ai revêtu un sac, et je suis devenu pour eux un sujet de moquerie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un proverbe » ou « un dicton » ; ici, quelqu’un que l’on cite pour se moquer de lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: J’ai pris
  rationale: Dans la construction avec « pour vêtement », נתן exprime ici le fait d’adopter ou de faire de quelque chose son vêtement. « J’ai pris » rend naturellement cette action en français sans suggérer un don à autrui.
- source_word: לְבוּשִׁי
  choice: pour vêtement
  rationale: Le nom désigne ce que porte le psalmiste; cette tournure française conserve la relation prédicative avec la toile de sac.
- source_word: שָׂק
  choice: une toile de sac
  rationale: Désigne l’étoffe grossière portée en signe de deuil, d’humiliation ou de pénitence; « toile de sac » est idiomatique en français biblique moderne.
- source_word: וָאֱהִי
  choice: je suis devenu
  rationale: Le verbe marque ici l’entrée dans un nouvel état résultant de son comportement.
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition indique le rapport aux personnes qui font du psalmiste un sujet de dérision.
- source_word: לְמָשָׁל
  choice: un objet de moquerie
  rationale: Dans ce contexte de mépris public, מָשָׁל désigne non une maxime neutre, mais quelqu’un devenu un exemple cité avec dérision. Cette formulation communique clairement le sens contextuel tout en signalant l’image lexicale en note.
