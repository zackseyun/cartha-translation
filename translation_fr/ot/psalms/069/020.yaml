source:
  edition: WLC
  text: חֶרְפָּ֤ה שָֽׁבְרָ֥ה לִבִּ֗/י וָֽ/אָ֫נ֥וּשָׁ/ה וָ/אֲקַוֶּ֣ה לָ/נ֣וּד וָ/אַ֑יִן וְ֝/לַ/מְנַחֲמִ֗ים וְ/לֹ֣א מָצָֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: fr
  text: L’opprobre m’a brisé le cœur, et je suis malade. J’ai cherché de la compassion[a], mais il n’y en avait pas ; j’ai cherché des consolateurs, mais je n’en ai trouvé aucun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la pitié ». Le terme hébreu désigne le fait de compatir au malheur de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  choice: le mépris
  rationale: Le nom évoque à la fois les outrages subis et la honte publique qu’ils infligent. « Le mépris » rend naturellement cette réalité en français sans la réduire à une seule insulte verbale.
- source_word: שָׁבְרָה לִבִּי
  choice: m’a brisé le cœur
  rationale: La formulation conserve l’image hébraïque du cœur comme siège de la vie intérieure et exprime l’effet durable de l’épreuve.
- source_word: וָאֲנוּשָׁה
  choice: et je suis malade
  rationale: Le verbe décrit un état grave d’affliction ou de maladie. Cette traduction garde sa force tout en évitant de préciser qu’il serait incurable, sens possible mais non certain ici.
- source_word: וָאֲקַוֶּה
  choice: j’ai cherché
  rationale: Dans ce contexte, l’attente pleine d’espoir porte sur une réaction humaine que le psalmiste ne trouve pas. « J’ai cherché » communique cette attente orientée vers un secours concret.
- source_word: לָנוּד
  choice: de la compassion
  rationale: L’infinitif désigne ici le fait de compatir au malheur d’autrui. « Compassion » exprime cette commisération sans la nuance potentiellement condescendante de « pitié ».
- source_word: וָאַיִן
  choice: mais il n’y en avait pas
  rationale: La tournure affirme l’absence totale de la compassion espérée et rend naturellement en français le contraste implicite.
- source_word: וְלַמְנַחֲמִים
  choice: des consolateurs
  rationale: Le participe pluriel désigne des personnes susceptibles d’apporter du réconfort. « Consolateurs » maintient la forme personnelle et le parallélisme du verset.
- source_word: וְלֹא מָצָאתִי
  choice: mais je n’en ai trouvé aucun
  rationale: La formulation rend directement l’échec de la recherche et conserve la cadence parallèle de la lamentation.
theological_decisions:
- issue: Usage messianique dans l’interprétation chrétienne
  choice: Traduire d’abord le verset comme une lamentation individuelle dans son contexte psalmique.
  alternative: Introduire dans le texte principal une formulation explicitement prédictive des souffrances du Messie.
  rationale: Le Psaume 69 est appliqué à Jésus dans le Nouveau Testament, mais le sens immédiat de ce verset hébreu reste celui de la plainte d’un fidèle souffrant. La traduction demeure compatible avec cette application ultérieure sans l’ajouter au texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le parallélisme de la lamentation hébraïque; « brisé le cœur » reste une image courante et forte, tandis que « je suis malade » préserve l’ambiguïté entre atteinte physique et profond accablement.
