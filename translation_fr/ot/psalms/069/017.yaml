id: PSA.69.17
reference: Psalms 69:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַל תַּסְתֵּ֣ר פָּ֭נֶי/ךָ מֵֽ/עַבְדֶּ֑/ךָ כִּֽי צַר לִ֝֗/י מַהֵ֥ר עֲנֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/017.yaml
  text: And do not hide your face from your servant[a], for I am in distress[b]; answer me quickly.
translation:
  language: fr
  text: Et ne cache pas ton visage[a] à ton serviteur[b], car je suis dans la détresse ; réponds-moi vite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta présence ». L’hébreu dit littéralement « ton visage », expression courante évoquant la faveur ou la présence attentive.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton esclave ». Le mot hébreu peut désigner un serviteur ou un esclave, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: Et ne… pas
  rationale: וְ relie cette supplication aux demandes précédentes, tandis que אַל suivi de l’inaccompli exprime ici une défense ou une prière négative.
- source_word: תַּסְתֵּר
  choice: cache
  rationale: Le verbe סתר signifie « cacher » ou « dissimuler ». Le choix conserve l’image hébraïque associée au visage de Dieu.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: La formulation littérale préserve la métaphore relationnelle du texte, qui évoque la faveur, l’attention et la proximité de Dieu.
- source_word: מֵעַבְדֶּךָ
  choice: à ton serviteur
  rationale: עבד peut désigner un serviteur ou un esclave. Dans cette prière, « serviteur » exprime naturellement l’humble appartenance du psalmiste à Dieu sans imposer au contexte l’accent juridique d’« esclave ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la supplication et « car » convient au registre poétique.
- source_word: צַר לִי
  choice: je suis dans la détresse
  rationale: Cette expression concise décrit l’état d’angoisse du psalmiste. La traduction est claire, naturelle et fidèle à son intensité.
- source_word: מַהֵר
  choice: vite
  rationale: Employé avec l’impératif suivant, le terme presse Dieu de répondre sans délai. « Vite » restitue directement cette urgence en français actuel.
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Dans le contexte de la prière, ענה signifie couramment « répondre ».
theological_decisions:
- issue: Langage anthropomorphique concernant la relation avec Dieu
  choice: Conserver « ton visage » dans le texte principal
  alternative: ta présence
  rationale: Le « visage » de Dieu évoque sa faveur, son attention et sa proximité. Garder cette image maintient la richesse poétique et théologique de l’hébreu sans la réduire à une interprétation abstraite.
- issue: Sens de עבד dans la relation à Dieu
  choice: serviteur
  alternative: esclave
  rationale: Le mot peut porter les deux sens. Ici, la formule de prière met surtout en avant l’humble appartenance et le service du psalmiste ; « serviteur » est donc le meilleur choix contextuel, tandis qu’une note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure poétique sans archaïsme ; « vite » communique l’urgence avec naturel. Les deux notes sont placées sur les expressions auxquelles elles se rapportent.
