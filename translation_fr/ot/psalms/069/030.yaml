  text: אֲהַֽלְלָ֣ה שֵׁם אֱלֹהִ֣ים בְּ/שִׁ֑יר וַ/אֲגַדְּלֶ֥/נּוּ בְ/תוֹדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/030.yaml
  text: I will praise the name of God with song[a], and I will magnify him with thanksgiving.
translation:
  language: fr
  text: Je louerai le nom de Dieu en chantant, je proclamerai sa grandeur avec reconnaissance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une offrande d’action de grâce » ; le mot hébreu peut désigner soit l’action de grâce, soit un sacrifice offert en action de grâce.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Je louerai
  rationale: Le cohortatif à la première personne exprime ici une résolution volontaire; le futur français la rend naturellement dans ce contexte poétique.
- source_word: שֵׁם אֱלֹהִים
  choice: le nom de Dieu
  rationale: Cette formulation conserve directement l’expression hébraïque et sa portée révérencielle.
- source_word: בְּשִׁיר
  choice: par un chant
  rationale: La préposition ב indique ici le moyen ou la manière; « par un chant » est naturel en français et garde le sens instrumental.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: et je proclamerai sa grandeur
  rationale: Le piel de גדל signifie ici reconnaître et célébrer la grandeur de Dieu. Cette formulation française est plus naturelle que « je le magnifierai » tout en préservant le parallélisme avec « louerai ».
- source_word: בְתוֹדָה
  choice: avec reconnaissance
  rationale: תּוֹדָה désigne ici vraisemblablement l’action de remercier, en parallèle avec la louange et le chant, tout en pouvant aussi évoquer une offrande de reconnaissance.
theological_decisions:
- issue: תּוֹדָה désigne-t-il une action de grâce verbale ou une offrande de reconnaissance ?
  choice: l’action de grâce, rendue par « reconnaissance »
  alternative: une offrande de reconnaissance
  rationale: Le parallélisme immédiat porte sur la louange, le chant et la proclamation de la grandeur de Dieu, ce qui favorise l’acte verbal de remercier. Le sens sacrificiel demeure toutefois possible et est signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Proclamer sa grandeur » évite le caractère plus technique ou vieilli de « magnifier » sans atténuer l’idée hébraïque. Le marqueur de note est placé après « reconnaissance », terme concerné par l’alternative lexicale.
