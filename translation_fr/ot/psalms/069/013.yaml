source:
  edition: WLC
  text: וַ/אֲנִ֤י תְפִלָּתִֽ/י לְ/ךָ֨ יְהוָ֡ה עֵ֤ת רָצ֗וֹן אֱלֹהִ֥ים בְּ/רָב חַסְדֶּ֑/ךָ עֲ֝נֵ֗/נִי בֶּ/אֱמֶ֥ת יִשְׁעֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: fr
  text: Mais moi, ma prière s’élève vers toi, Yahweh, au temps favorable[a]. Ô Dieu, dans l’abondance de ton amour fidèle, réponds-moi dans la vérité[b] de ton salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à un temps favorable ». L’expression hébraïque désigne un moment propice où Dieu écoute et intervient.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la fidélité de ton salut ». Le mot hébreu peut signifier « vérité », « fidélité » ou « fiabilité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent à la fois le contraste avec le contexte précédent et l’insistance sur le psalmiste.
- source_word: תְפִלָּתִי לְךָ
  choice: je t’adresse ma prière
  rationale: Le texte hébreu dit littéralement « ma prière [est] vers toi ». Cette formulation française naturelle conserve le nom « prière » et l’idée de direction vers Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: עֵת רָצוֹן
  choice: au temps favorable
  rationale: L’expression désigne un temps d’accueil favorable, propice à l’écoute et à l’intervention de Dieu.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: La reprise de l’adresse directe est explicitée par le vocatif français « Ô Dieu », adapté au registre poétique.
- source_word: בְּרָב חַסְדֶּךָ
  choice: dans l’abondance de ton amour fidèle
  rationale: רֹב exprime l’abondance, tandis que חֶסֶד évoque un amour loyal, constant et miséricordieux. « Amour fidèle » en rend le poids sans imposer un vocabulaire confessionnel particulier.
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Dans le contexte de la prière, l’impératif signifie directement « réponds-moi ».
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: selon la vérité de ton salut
  rationale: La formulation demeure proche de l’hébreu et maintient le lien entre אֱמֶת, qui peut évoquer la vérité ou la fidélité, et le salut accordé par Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom divin lui-même. « Yahweh » le conserve plutôt que de le remplacer par un titre.
- issue: Nuance de אֱמֶת associé au salut
  choice: vérité
  alternative: fidélité
  rationale: אֱמֶת peut désigner la vérité aussi bien que la fidélité ou la fiabilité. Le texte principal retient « vérité », tandis que la note préserve l’autre lecture plausible.
- issue: Lien syntaxique de עֵת רָצוֹן
  choice: au temps favorable
  alternative: au temps où tu accueilles favorablement
  rationale: L’expression peut se rattacher à la prière adressée à Dieu ou évoquer plus largement le moment propice où Dieu écoute et agit. La traduction garde une formulation temporelle concise sans préciser davantage ce lien.
translation_notes:
  register: Français international moderne, poétique et digne. La structure vocative du psaume est conservée sans archaïsmes inutiles. Les formulations légèrement denses « dans l’abondance de » et « la vérité de ton salut » maintiennent les images et l’ambiguïté du texte hébreu; les notes éclairent les principales autres lectures.
