  text: הַצִּילֵ֣/נִי מִ֭/טִּיט וְ/אַל אֶטְבָּ֑עָה אִנָּצְלָ֥ה מִ֝/שֹּֽׂנְאַ֗/י וּ/מִ/מַּֽעֲמַקֵּי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: fr
  text: Délivre-moi de la boue, ne me laisse pas sombrer. Que je sois délivré de ceux qui me haïssent et des profondeurs des eaux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif hiphil de נצל avec suffixe de première personne exprime un appel pressant à être tiré du danger. « Délivre-moi » est naturel, digne et permet de conserver la reprise du même verbe hébreu dans le second membre.
- source_word: מִטִּיט
  choice: de la boue
  rationale: טיט désigne la boue, la vase ou l’argile humide. « Boue » est immédiatement compréhensible et s’accorde naturellement avec l’image de l’enfoncement.
- source_word: וְאַל אֶטְבָּעָה
  choice: que je ne m’y enfonce pas
  rationale: La négation אַל suivie de l’imparfait à la première personne a ici une valeur volitive. Cette formulation française préserve la prière sans ajouter explicitement un agent; « y » renvoie naturellement à la boue.
- source_word: אִנָּצְלָה
  choice: Que je sois délivré
  rationale: Le niphal cohortatif de נצל renouvelle la supplication sous une forme passive. La traduction conserve à la fois la nuance volitive et la répétition lexicale qui structure le parallélisme.
- source_word: מִשֹּׂנְאַי
  choice: de ceux qui me haïssent
  rationale: Traduction transparente du participe substantivé « ceux qui me haïssent », sans le remplacer par le terme plus interprétatif « ennemis ».
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: et des eaux profondes
  rationale: Le groupe constructif désigne les profondeurs des eaux. « Eaux profondes » restitue naturellement en français l’image du péril aquatique tout en gardant sa force poétique.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La répétition de « délivre/délivré » reproduit celle de la racine נצל et maintient le parallélisme de la supplication. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
