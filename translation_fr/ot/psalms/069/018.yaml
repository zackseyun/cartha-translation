id: PSA.69.18
reference: Psalms 69:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קָרְבָ֣/ה אֶל נַפְשִׁ֣/י גְאָלָ֑/הּ לְמַ֖עַן אֹיְבַ֣/י פְּדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/018.yaml
  text: Come near to my soul[a]; redeem it. Because of my enemies[b], ransom me.
translation:
  language: fr
  text: Approche-toi de mon âme[a] et rachète-la ; à cause de mes ennemis[b], libère-moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « mon âme » ; le terme peut aussi désigner « ma vie » ou simplement « moi-même », selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « en considération de mes ennemis ». Ici, l’expression hébraïque signifie probablement « à cause de mes ennemis » ou « en raison de mes ennemis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָה
  choice: Approche-toi
  rationale: L’impératif qal exprime une demande directe adressée à Dieu. « Approche-toi » est naturel en français actuel et conserve l’idée de proximité.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve ici l’expression hébraïque et son registre personnel, tandis qu’une note signale l’étendue sémantique du terme.
- source_word: גְאָלָהּ
  choice: rachète-la
  rationale: Le verbe גאל évoque l’action de racheter ou de reprendre en charge comme rédempteur. Le pronom féminin « la » reprend grammaticalement « mon âme ».
- source_word: לְמַעַן
  choice: à cause de
  rationale: Dans ce contexte, les ennemis constituent vraisemblablement le motif de la supplication. La tournure hébraïque peut aussi se comprendre « à cause de » ou, plus littéralement, « en considération de / pour l’amour de ».
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Traduction directe, claire et usuelle du pluriel muni du suffixe de première personne.
- source_word: פְּדֵנִי
  choice: libère-moi
  rationale: פדה désigne une libération, souvent conçue comme un rachat. « Libère-moi » distingue ce verbe de גאל dans le membre précédent sans imposer explicitement l’idée d’un paiement.
theological_decisions:
- issue: Distinction entre les deux verbes de délivrance גאל et פדה
  choice: Traduire גאל par « racheter » et פדה par « libérer »
  alternative: Traduire les deux verbes par « racheter », ou rendre פדה par « délivrer »
  rationale: Le texte juxtapose deux verbes proches mais distincts. Des rendus différents conservent cette intensification poétique sans transformer la supplication en formulation technique d’une théorie de l’expiation.
- issue: Rapport exprimé par לְמַעַן avec les ennemis
  choice: « à cause de mes ennemis »
  alternative: « pour l’amour de mes ennemis » ou « en considération de mes ennemis »
  rationale: Le contexte favorise l’idée que le danger venant des ennemis motive la demande. Une note conserve toutefois l’ambiguïté de la locution hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le parallélisme de la supplication. « Âme » maintient l’image hébraïque, tandis que les notes rendent accessibles les ambiguïtés lexicales réelles.
