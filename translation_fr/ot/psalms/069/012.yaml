  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: fr
  text: Ceux qui sont assis à la porte[a] parlent de moi, et je suis le sujet de leurs chansons, eux qui boivent des boissons enivrantes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les villes de l’Antiquité, la porte était un lieu public où se traitaient notamment les affaires civiques et judiciaires. L’expression évoque donc probablement des personnes socialement influentes, et non de simples gardiens.
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « et les ivrognes chantent à mon sujet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: parlent de moi
  rationale: Le verbe שׂיח peut désigner la méditation ou la parole, mais le contexte hostile et public favorise ici l’idée de parler ou de discourir. La préposition ב marque naturellement le sujet du propos, sans exprimer à elle seule l’hostilité.
- source_word: יֹשְׁבֵי שָׁעַר
  choice: ceux qui siègent à la porte
  rationale: Cette formulation conserve l’image hébraïque tout en suggérant que ces personnes occupent habituellement cet espace public. Elle évite de les identifier trop précisément comme anciens, juges ou gardiens.
- source_word: וּנְגִינוֹת
  choice: je suis le sujet des chansons
  rationale: Le nom désigne des chants ou de la musique. Le parallèle avec le premier membre implique que le psalmiste est le thème de ces chants; l’ajout de « je suis le sujet » explicite cette relation sous-entendue en hébreu.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: ceux qui boivent des boissons enivrantes
  rationale: שֵׁכָר désigne une boisson alcoolisée ou enivrante, généralement distincte du vin. Cette traduction préserve le sens lexical sans transformer directement les buveurs en « ivrognes », qualification que le contexte peut suggérer mais que le groupe nominal n’impose pas.
theological_decisions: []
translation_notes:
  register: Français international actuel, naturel et digne. « Siègent » rend l’occupation habituelle et publique de la porte sans préciser indûment la fonction des personnes. « Boissons enivrantes » est plus intelligible aujourd’hui que le calque traditionnel « boissons fortes » et conserve la distinction lexicale avec le vin.
