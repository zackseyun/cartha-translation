  text: רַבּ֤וּ מִ/שַּׂעֲר֣וֹת רֹאשִׁ/י֮ שֹׂנְאַ֪/י חִ֫נָּ֥ם עָצְמ֣וּ מַ֭צְמִיתַ/י אֹיְבַ֣/י שֶׁ֑קֶר אֲשֶׁ֥ר לֹא גָ֝זַ֗לְתִּי אָ֣ז אָשִֽׁיב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: fr
  text: Ceux qui me haïssent sans raison sont plus nombreux que les cheveux de ma tête ; ils sont puissants, ceux qui cherchent à me détruire, mes ennemis trompeurs[a]. Ce que je n’ai pas volé, je dois alors le rendre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mes ennemis mensongers » ou « ceux qui sont mes ennemis sans motif ». L’expression hébraïque peut décrire ces ennemis comme trompeurs ou indiquer qu’ils s’opposent injustement au psalmiste.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « alors je rends » ou « je rendrai ». Le sens peut être que le psalmiste est contraint de rendre ce qu’il n’a pas volé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: sont plus nombreux que les cheveux de ma tête
  rationale: Le verbe רַבּוּ exprime le grand nombre et le מִן introduit ici une comparaison. Cette formulation française rend naturellement l’image hyperbolique.
- source_word: שֹׂנְאַי חִנָּם
  choice: ceux qui me haïssent sans raison
  rationale: חִנָּם indique ici l’absence de motif ou de justification, plutôt que la gratuité au sens financier.
- source_word: עָצְמוּ
  choice: ils sont puissants
  rationale: Le verbe exprime la force ou la puissance des adversaires. « Puissants » conserve le registre poétique et souligne la menace.
- source_word: מַצְמִיתַי
  choice: ceux qui veulent me détruire
  rationale: Le participe désigne ceux qui cherchent la ruine du psalmiste. Cette tournure est claire et idiomatique en français moderne.
- source_word: אֹיְבַי שֶׁקֶר
  choice: mes ennemis qui m’accusent faussement
  rationale: שֶׁקֶר peut qualifier les ennemis comme trompeurs ou indiquer qu’ils agissent sans vérité, notamment par de fausses accusations. La formulation retenue relie naturellement le groupe à l’innocence affirmée dans la proposition suivante, tout en signalant l’ambiguïté en note.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: Ce que je n’ai pas volé
  rationale: גזל désigne une prise injuste, souvent violente. « Voler » est le terme courant le plus accessible dans ce contexte.
- source_word: אָז אָשִׁיב
  choice: il faut alors que je le rende
  rationale: L’hébreu dit littéralement « alors je rends / rendrai ». Dans le contexte d’une accusation injuste, le français explicite sobrement la restitution imposée, tandis que la note conserve la forme plus littérale.
theological_decisions:
- issue: Sens de אֹיְבַי שֶׁקֶר
  choice: mes ennemis qui m’accusent faussement
  alternative: mes ennemis trompeurs / ceux qui sont mes ennemis sans motif
  rationale: La construction hébraïque permet de comprendre שֶׁקֶר comme une description des ennemis ou comme une indication du caractère mensonger et injustifié de leur hostilité. Le texte choisit une lecture contextuelle sans masquer les autres possibilités.
- issue: Restitution imposée malgré l’innocence
  choice: Ce que je n’ai pas volé, il faut alors que je le rende.
  alternative: Ce que je n’ai pas volé, alors je le rends / le rendrai.
  rationale: Le contexte présente le psalmiste comme victime d’hostilité et d’accusations injustifiées. « Il faut » fait entendre la contrainte implicite, mais la note préserve la sobriété et l’ambiguïté de la formulation hébraïque.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé, avec une syntaxe légèrement explicitée pour assurer la clarté. Les deux ambiguïtés majeures du verset sont signalées en notes.
