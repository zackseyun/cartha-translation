id: PSA.69.15
reference: Psalms 69:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: fr
  text: 'Que le torrent des eaux[a] ne m’emporte pas,

    que l’abîme ne m’engloutisse pas,

    et que la fosse[b] ne referme pas sa bouche sur moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le courant des eaux » ou « le flot des eaux ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu peut aussi se traduire par « le puits » ; dans ce contexte poétique, il évoque vraisemblablement une fosse mortelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: ne m’emporte pas
  rationale: Le verbe שטף évoque ici l’action irrésistible d’eaux qui submergent et entraînent. « Emporter » rend naturellement cette force destructrice en français.
- source_word: שִׁבֹּלֶת מַיִם
  choice: le torrent des eaux
  rationale: שִׁבֹּלֶת peut désigner un courant puissant ou un flot. « Torrent des eaux » conserve l’image concrète d’une masse d’eau impétueuse et l’intensité poétique.
- source_word: תִּבְלָעֵנִי
  choice: ne m’engloutisse pas
  rationale: בלע signifie littéralement « avaler ». Dans le contexte des eaux profondes, « engloutir » exprime idiomatiquement en français l’idée d’être entièrement avalé.
- source_word: מְצוּלָה
  choice: l’abîme
  rationale: Le nom désigne les profondeurs, notamment celles des eaux. « L’abîme » est concis, poétique et personnifiable comme dans l’hébreu.
- source_word: תֶּאְטַר
  choice: ne referme pas
  rationale: Le verbe exprime l’action de fermer. « Refermer » convient à l’image d’une ouverture qui se clôt sur le psalmiste.
- source_word: בְּאֵר
  choice: la fosse
  rationale: Bien que בְּאֵר désigne ordinairement un puits, le parallélisme avec les eaux mortelles et l’image d’une bouche qui se ferme donnent ici à l’ouverture le caractère menaçant d’une fosse.
- source_word: פִּיהָ
  choice: sa bouche
  rationale: « Bouche » préserve la personnification saisissante de la fosse comme puissance capable d’avaler et d’enfermer.
- source_word: עָלַי
  choice: sur moi
  rationale: Avec le verbe « refermer », « sur moi » traduit directement l’idée que l’ouverture se clôt au-dessus du psalmiste.
theological_decisions: []
