source:
  edition: WLC
  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: fr
  text: Cela plaira davantage à Yahweh qu’un bovin, un taureau aux cornes et aux sabots fendus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְתִיטַב
  choice: Cela plaira
  rationale: Le qal inaccompli féminin singulier renvoie à la louange ou à l’action de grâce du verset précédent. Avec מִן, le verbe exprime ici ce qui plaît davantage.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le nom divin יהוה est rendu par sa forme usuelle translittérée, « Yahweh ».
- source_word: מִשּׁוֹר
  choice: plus qu’un bœuf
  rationale: Après יטב, מִן introduit la comparaison. « Bœuf » rend naturellement שׁוֹר tout en laissant פָּר préciser ensuite l’animal.
- source_word: פָּר
  choice: qu’un taureau
  rationale: Le second terme est conservé en apposition explicative plutôt que fusionné avec שׁוֹר.
- source_word: מַקְרִן
  choice: muni de cornes
  rationale: Cette formulation naturelle rend le participe décrivant l’animal comme pourvu de cornes.
- source_word: מַפְרִיס
  choice: de sabots fendus
  rationale: L’expression rend l’idée de fendre le sabot et évoque clairement les caractéristiques d’un animal propre au sacrifice.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre la louange et le sacrifice
  choice: La louange mentionnée au verset précédent plaira davantage qu’un animal sacrificiel pleinement qualifié
  alternative: La louange rendra Yahweh meilleur qu’un bœuf
  rationale: Le féminin singulier de וְתִיטַב renvoie naturellement à l’action évoquée auparavant, et la construction יטב avec מִן exprime une préférence, sans nier pour autant toute valeur au sacrifice.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « bœuf… taureau » conserve l’apposition hébraïque et son insistance sur un animal sacrificiel pleinement développé.
