revisions:
- from: Cela plaira à Yahweh plus qu’un bœuf, qu’un taureau muni de cornes et de sabots fendus.
  to: Cela plaira davantage à Yahweh qu’un bovin, un taureau aux cornes et aux sabots fendus.
  rationale: La révision préserve la comparaison et l’accumulation descriptive de l’hébreu, tout en évitant l’opposition involontaire entre « bœuf » et « taureau » dans l’usage français moderne. Elle ne précise pas indûment la portée sacrificielle au-delà du texte.
