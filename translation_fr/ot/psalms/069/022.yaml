id: PSA.69.22
reference: Psalms 69:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהִֽי שֻׁלְחָנָ֣/ם לִ/פְנֵי/הֶ֣ם לְ/פָ֑ח וְ/לִ/שְׁלוֹמִ֥ים לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: fr
  text: Que leur table, devant eux, devienne un piège, et leur bien-être[a], un filet !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur sécurité » ; le mot hébreu peut aussi évoquer ici les sacrifices de communion.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Que … devienne
  rationale: Le jussif exprime ici un souhait imprécatoire. Cette tournure française en conserve naturellement la force volitive.
- source_word: שֻׁלְחָנָם
  choice: leur table
  rationale: Le terme désigne concrètement la table, même si celle-ci évoque aussi la nourriture, l’abondance ou le festin.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: La traduction spatiale directe préserve l’ironie de ce qui se trouve sous leurs yeux et devient pourtant dangereux.
- source_word: לְפָח
  choice: un piège
  rationale: פַּח désigne un piège ou un lacet. « Piège » permet de distinguer ce mot du terme parallèle מוֹקֵשׁ.
- source_word: וְלִשְׁלוֹמִים
  choice: et leur bien-être
  rationale: Dans ce contexte, le pluriel שְׁלוֹמִים peut évoquer ce qui assure leur paix, leur sécurité ou leur prospérité. La formulation abstraite s’intègre naturellement au parallélisme sans exclure la résonance possible des sacrifices de communion.
- source_word: לְמוֹקֵשׁ
  choice: un filet
  rationale: מוֹקֵשׁ désigne un piège, notamment un lacet ou un filet. « Filet » maintient la variation lexicale du parallélisme hébreu.
theological_decisions:
- issue: Sens de שְׁלוֹמִים dans cette imprécation
  choice: Traduire abstraitement par « leur bien-être »
  alternative: « leurs sacrifices de communion » ou « leur sécurité »
  rationale: Le contexte oppose vraisemblablement ce qui contribue à leur paix ou à leur prospérité au filet du jugement. Le sens cultuel demeure possible, notamment à proximité de l’image de la table, mais il n’est pas assez certain pour être imposé dans le texte principal.
translation_notes:
  register: Français international moderne, digne et concis. La structure imprécatoire et le parallélisme concret sont conservés ; « piège » et « filet » rendent les deux termes de chasse distincts.
