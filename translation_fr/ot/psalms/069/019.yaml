  text: אַתָּ֤ה יָדַ֗עְתָּ חֶרְפָּתִ֣/י וּ֭/בָשְׁתִּ/י וּ/כְלִמָּתִ֑/י נֶ֝גְדְּ/ךָ֗ כָּל צוֹרְרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/019.yaml
  text: You know my reproach[a], my shame, and my humiliation; all my adversaries are before you.
translation:
  language: fr
  text: Tu connais mon opprobre, ma honte et mon humiliation ; tous mes adversaires sont devant toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Tu connais
  rationale: Le qal accompli de ידע exprime ici, dans une prière adressée à Dieu, une connaissance établie et actuelle. Le présent français rend naturellement cette valeur stative.
- source_word: חֶרְפָּתִי
  choice: les outrages que je subis
  rationale: חֶרְפָּה désigne l’opprobre, les insultes ou le mépris infligés publiquement. Cette formulation naturelle explicite que le psalmiste en est la cible sans réduire le terme à un simple sentiment intérieur.
- source_word: בָשְׁתִּי
  choice: ma honte
  rationale: Le nom exprime directement la honte ou le déshonneur. « Ma honte » est clair, sobre et fidèle.
- source_word: כְלִמָּתִי
  choice: mon humiliation
  rationale: כְּלִמָּה évoque la disgrâce et l’humiliation publique. « Mon humiliation » maintient l’accumulation de termes proches sans le confondre avec בָשְׁתִּי.
- source_word: נֶגְדְּךָ
  choice: devant toi
  rationale: נֶגֶד avec suffixe indique que les adversaires sont face à Dieu, donc pleinement présents à son regard. « Devant toi » conserve l’expression spatiale et sa portée implicite.
- source_word: כָּל
  choice: tous
  rationale: Le quantificateur englobe collectivement l’ensemble des adversaires.
- source_word: צוֹרְרָי
  choice: mes adversaires
  rationale: Le participe substantivé de צרר désigne ceux qui se montrent hostiles au psalmiste. « Mes adversaires » convient au registre poétique et garde l’idée d’opposition active.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme accumulatif de trois formes de déshonneur est conservé, tandis que « les outrages que je subis » rend explicitement et naturellement la dimension sociale de חֶרְפָּה.
