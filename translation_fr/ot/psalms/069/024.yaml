  text: שְׁפָךְ עֲלֵי/הֶ֥ם זַעְמֶ֑/ךָ וַ/חֲר֥וֹן אַ֝פְּ/ךָ֗ יַשִּׂיגֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: fr
  text: 'Déverse sur eux ton indignation,

    et que ton ardente colère les atteigne.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁפָךְ
  choice: Déverse
  rationale: L’impératif exprime métaphoriquement l’effusion de la colère. « Déverse » conserve l’image avec force dans un français actuel.
- source_word: עֲלֵיהֶם
  choice: sur eux
  rationale: La préposition עַל avec suffixe indique ici la cible contre laquelle l’indignation est dirigée.
- source_word: זַעְמֶךָ
  choice: ton indignation
  rationale: זַעַם désigne une vive colère, souvent divine. « Indignation » en garde la dimension morale et évite de répéter « colère ».
- source_word: וַחֲרוֹן אַפְּךָ
  choice: et que ton ardente colère
  rationale: L’expression חֲרוֹן אַף évoque littéralement l’embrasement de la colère. « Ardente colère » conserve l’image de chaleur tout en restant naturelle en français.
- source_word: יַשִּׂיגֵם
  choice: les atteigne
  rationale: Le verbe peut signifier atteindre, rattraper ou saisir. « Les atteigne » rend clairement l’idée que la colère parvient jusqu’à ses cibles, sans imposer davantage l’image d’une poursuite.
theological_decisions:
- issue: Langage imprécatoire dirigé contre des ennemis
  choice: Maintenir la demande directe de jugement divin sans l’atténuer.
  alternative: Une reformulation adoucie, telle que « montre-leur ton mécontentement ».
  rationale: L’hébreu demande explicitement que l’indignation de Dieu soit déversée sur les ennemis et que sa colère les atteigne. La tension théologique du texte doit être préservée.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé en deux lignes; « ardente colère » restitue l’intensité de l’idiome hébreu sans traduction anatomique littérale.
