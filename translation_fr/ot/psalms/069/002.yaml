  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: fr
  text: Je me suis enfoncé dans une boue profonde, sans endroit où prendre pied ; je suis arrivé dans les profondeurs des eaux, et le courant m’a submergé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et le torrent m’a emporté » ou « et le flot m’a englouti ».
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: Je me suis enfoncé
  rationale: Le qal accompli à la première personne décrit une situation déjà vécue dont l’effet demeure. Le passé composé est naturel en français et « s’enfoncer » convient précisément à l’image de la boue.
- source_word: בִּיוֵן מְצוּלָה
  choice: dans une boue profonde
  rationale: יוֵן désigne la boue ou la vase, et מְצוּלָה une profondeur. Cette formulation conserve les deux éléments de l’image dans un français naturel.
- source_word: וְאֵין מָעֳמָד
  choice: sans rien où prendre pied
  rationale: מָעֳמָד désigne un endroit où se tenir ou un appui. La tournure exprime concrètement l’absence de point d’appui sans ajouter l’idée d’un sol ferme absente du texte.
- source_word: בָּאתִי
  choice: je suis arrivé
  rationale: Le qal accompli de בוא indique que le psalmiste est parvenu dans cette situation périlleuse. Le passé composé maintient le parallélisme avec le premier membre.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: au milieu des eaux profondes
  rationale: L’expression désigne les profondeurs des eaux. Avec « arriver », « au milieu de » rend naturellement l’entrée dans cet espace tout en préservant l’image.
- source_word: שִׁבֹּלֶת
  choice: le courant
  rationale: Dans ce contexte, שִׁבֹּלֶת désigne vraisemblablement un courant ou un flot. « Courant » conserve l’idée d’une masse d’eau en mouvement sans préciser indûment s’il s’agit d’une crue ou d’un torrent.
- source_word: שְׁטָפָתְנִי
  choice: m’a submergé
  rationale: Le verbe שטף évoque l’action d’inonder, de recouvrir ou d’emporter par les eaux. « Submerger » rend directement l’image et la force du courant.
