source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: fr
  text: Ô Dieu, tu connais ma folie[a], et mes fautes[b] ne te sont pas cachées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma sottise »; le terme évoque une folie moralement coupable.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma culpabilité ne t’est pas cachée ». L’hébreu emploie ici un nom au pluriel qui peut désigner concrètement les actes coupables.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom divin est employé ici comme une adresse directe. « Ô Dieu » restitue naturellement en français le ton de la prière.
- source_word: אַתָּה יָדַעְתָּ
  choice: tu connais
  rationale: 'Le parfait du verbe ידע a ici une valeur stative : la connaissance de Dieu est présente et entière. Le pronom sujet explicite en hébreu souligne l’interlocuteur; le français l’exprime naturellement par « tu ».'
- source_word: לְאִוַּלְתִּי
  choice: ma folie
  rationale: Le nom désigne une folie moralement coupable, et non un simple manque d’intelligence. « Ma folie » est à la fois direct, digne et fidèle.
- source_word: וְאַשְׁמוֹתַי
  choice: mes fautes
  rationale: Le substantif hébreu est au pluriel et désigne ici les actes ou manquements qui rendent coupable. « Mes fautes » préserve cette forme concrète et plurielle.
- source_word: מִמְּךָ לֹא נִכְחָדוּ
  choice: ne te sont pas cachées
  rationale: Cette tournure française rend l’idée idiomatique de choses qui ne peuvent être dissimulées à la connaissance de Dieu, tout en conservant la négation et le pluriel de l’hébreu.
theological_decisions:
- issue: La confession de faute du locuteur dans un psaume ultérieurement appliqué de manière messianique dans le Nouveau Testament
  choice: Conserver la confession personnelle de folie et de fautes à la première personne.
  alternative: Comprendre ou reformuler la confession comme uniquement collective ou représentative.
  rationale: L’hébreu présente sans détour une confession à la première personne. La traduction doit préserver cette voix et la tension théologique du texte sans lui imposer une harmonisation ultérieure.
translation_notes:
  register: Français international moderne, poétique sans archaïsme. « Ô Dieu » convient au registre de la prière; la syntaxe reste simple et immédiatement compréhensible.
