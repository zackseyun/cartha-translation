  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: fr
  text: Les descendants de ses serviteurs en hériteront[a], et ceux qui aiment son nom y habiteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « En » et « y » renvoient à Sion, la ville restaurée évoquée au verset précédent ; certains comprennent plus largement le pays ou Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: la descendance
  rationale: Le nom collectif זֶרַע désigne ici la postérité des serviteurs de Dieu. « La descendance » est naturel en français moderne et conserve la valeur collective du singulier hébreu.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte psalmique et dévotionnel, « serviteurs » exprime adéquatement la relation à Dieu sans mettre au premier plan le statut social que pourrait suggérer « esclaves ».
- source_word: יִנְחָלוּהָ
  choice: en héritera
  rationale: Le verbe נחל exprime la réception ou la possession d’un héritage. Le pronom « en » reprend naturellement en français le lieu féminin évoqué dans le contexte précédent, tout en gardant la nuance d’héritage.
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: ceux qui aiment son nom
  rationale: Cette formulation claire conserve l’expression biblique et relationnelle « aimer son nom », sans la réduire à « ceux qui l’aiment ».
- source_word: יִשְׁכְּנוּ בָהּ
  choice: y habiteront
  rationale: שׁכן signifie habiter, demeurer ou s’établir. « Y habiteront » est idiomatique en français et reprend le même lieu que le suffixe féminin hébreu.
theological_decisions:
- issue: Référent des suffixes féminins dans « en héritera » et « y habiteront »
  choice: Ils renvoient à Sion, comprise comme la ville restaurée mentionnée dans le contexte immédiat.
  alternative: Ils peuvent être compris plus largement comme renvoyant au pays ou à Jérusalem.
  rationale: Le verset précédent parle du salut de Sion et de la reconstruction des villes de Juda. Les pronoms français « en » et « y » préservent le renvoi du texte hébreu sans préciser davantage que celui-ci.
translation_notes:
  register: Français international moderne, naturel et digne. « La descendance » garde la valeur collective de זֶרַע ; « hériter » et « habiter » maintiennent les nuances d’héritage et de résidence durable du texte hébreu.
