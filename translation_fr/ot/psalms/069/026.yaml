  text: כִּֽי אַתָּ֣ה אֲשֶׁר הִכִּ֣יתָ רָדָ֑פוּ וְ/אֶל מַכְא֖וֹב חֲלָלֶ֣י/ךָ יְסַפֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/026.yaml
  text: For they persecute the one you struck[a], and they recount the pain of those you wounded.
translation:
  language: fr
  text: 'Car ils persécutent celui que tu as frappé,

    et parlent de la souffrance de ceux que tu as blessés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la souffrance de tes tués ». Le mot hébreu peut aussi désigner tes transpercés.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’imprécation précédente et conserve clairement la valeur causale.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: celui que tu as frappé
  rationale: Rend naturellement en français l’objet singulier implicite relié par אֲשֶׁר, sans effacer le fait que Dieu est présenté comme celui qui frappe.
- source_word: רָדָפוּ
  choice: ils persécutent
  rationale: Dans ce contexte de lamentation, רדף désigne une poursuite hostile plutôt qu’un simple déplacement derrière quelqu’un.
- source_word: וְאֶל
  choice: et
  rationale: La préposition אֶל introduit ici de manière idiomatique le sujet de leurs paroles; le français naturel rattache directement « les souffrances » au verbe « racontent ».
- source_word: מַכְאוֹב
  choice: les souffrances
  rationale: Le nom peut désigner la douleur ou la souffrance. Le pluriel français s’accorde naturellement avec le groupe de personnes blessées sans modifier le sens collectif du singulier hébreu.
- source_word: חֲלָלֶיךָ
  choice: ceux que tu as blessés
  rationale: Le terme peut désigner des blessés, des transpercés ou des morts. « Ceux que tu as blessés » convient au parallèle avec celui que Dieu a frappé et à la mention de leurs souffrances, tout en gardant Dieu comme agent.
- source_word: יְסַפֵּרוּ
  choice: racontent
  rationale: Le piel de ספר signifie couramment raconter ou relater; cette traduction conserve l’idée qu’ils parlent des souffrances infligées.
theological_decisions:
- issue: 'Sens de חֲלָלֶיךָ : blessés, transpercés ou morts'
  choice: ceux que tu as blessés
  alternative: tes morts / ceux que tu as transpercés
  rationale: La lecture retenue s’accorde le mieux avec « souffrances » et avec l’image d’ennemis qui accablent encore des personnes déjà frappées par Dieu. La note conserve toutefois l’ambiguïté lexicale réelle sans trancher une tension théologique du texte.
translation_notes:
  register: Français international actuel, poétique mais direct. « Persécutent » exprime l’hostilité du contexte; « racontent » maintient le sens lexical du texte massorétique sans adopter une conjecture telle que « ajoutent à ».
