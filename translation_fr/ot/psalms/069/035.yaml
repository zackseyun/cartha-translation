source:
  edition: WLC
  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: fr
  text: 'Car Dieu sauvera Sion

    et bâtira les villes de Juda ;

    ils y habiteront

    et en prendront possession[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en hériteront » ou « la posséderont ». Le verbe hébreu peut exprimer l’héritage ou la prise de possession, notamment d’un territoire.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte un complément féminin singulier, littéralement « ils la posséderont », qui renvoie probablement à Sion ou à la terre personnifiée.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’espérance exprimée dans le contexte précédent ; « Car » restitue naturellement cette valeur explicative.
- source_word: יוֹשִׁיעַ
  choice: sauvera
  rationale: Le hiphil de ישׁע signifie « sauver, délivrer ». Le futur convient au caractère de promesse de ce verset.
- source_word: וְיִבְנֶה
  choice: et bâtira
  rationale: Le verbe בנה signifie simplement « bâtir, construire ». « Rebâtira » préciserait une répétition que la forme hébraïque n’exprime pas elle-même.
- source_word: עָרֵי יְהוּדָה
  choice: les villes de Juda
  rationale: Cette formulation rend directement la construction hébraïque et emploie le nom traditionnel et courant « Juda ».
- source_word: וְיָשְׁבוּ שָׁם
  choice: ils y habiteront
  rationale: ישׁב désigne une habitation établie. Le pronom adverbial « y » reprend naturellement les lieux qui viennent d’être mentionnés.
- source_word: וִירֵשׁוּהָ
  choice: et en prendront possession
  rationale: ירשׁ peut signifier « posséder », « hériter » ou « prendre possession ». Cette tournure française est naturelle dans le contexte territorial, sans trancher explicitement entre Sion et le territoire évoqué.
theological_decisions:
- issue: Référent du suffixe féminin singulier dans וִירֵשׁוּהָ
  choice: « en prendront possession », avec une note signalant le féminin singulier hébreu
  alternative: « la posséderont », « hériteront d’elle » ou « prendront possession de Sion »
  rationale: Le suffixe renvoie vraisemblablement à Sion, ou à la ville/terre personnifiée, mais son référent précis reste implicite. La traduction française conserve cette ouverture grâce à « en », tandis que la note rend compte de la forme grammaticale.
- issue: Identité du sujet pluriel de « ils habiteront »
  choice: Conserver le pronom non explicité « ils »
  alternative: Expliciter « les serviteurs de Dieu » ou « leurs descendants » d’après le verset suivant
  rationale: Le texte de ce verset n’exprime pas le sujet nominal. L’expliciter importerait dans le verset une identification contextuelle qui, bien que probable, n’est pas formulée ici.
translation_notes:
  register: Français international moderne, clair et digne. La disposition en lignes conserve le parallélisme poétique. « Habiteront » maintient la nuance d’établissement durable, tandis que « en prendront possession » reste idiomatique sans effacer l’ambiguïté du référent hébreu.
