  text: וָ/אֶבְכֶּ֣ה בַ/צּ֣וֹם נַפְשִׁ֑/י וַ/תְּהִ֖י לַ/חֲרָפ֣וֹת לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/010.yaml
  text: When I wept with fasting in my soul[b][a], it became a reproach to me.
translation:
  language: fr
  text: Quand j’ai pleuré en jeûnant de tout mon être[a], cela m’a valu des insultes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement, dans une construction condensée : « j’ai pleuré dans le jeûne, mon âme ». On peut aussi comprendre l’expression comme : « j’ai affligé mon être par le jeûne »; cette interprétation explicite un verbe qui n’est pas exprimé dans le texte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Quand j’ai pleuré
  rationale: Le verbe בכה signifie « pleurer ». Le waw introduit ici une action dont la proposition suivante présente le résultat ; « quand » rend naturellement ce rapport en français.
- source_word: בַצּוֹם
  choice: en jeûnant
  rationale: צוֹם désigne le jeûne. Avec la préposition ב, la tournure indique ici que les pleurs s’accompagnent du jeûne ; la forme verbale est plus naturelle en français que « avec le jeûne ».
- source_word: נַפְשִׁי
  choice: au plus profond de moi[a]
  rationale: נֶפֶשׁ peut désigner l’âme, la personne ou l’être intérieur. Cette formulation conserve la dimension intérieure explicite sans imposer le terme français « âme » dans une construction peu naturelle ; la syntaxe hébraïque et ses autres lectures possibles sont signalées en note.
- source_word: וַתְּהִי
  choice: cela m’a valu
  rationale: Le féminin singulier renvoie vraisemblablement à l’action ou à la situation précédente. « Cela m’a valu » exprime idiomatiquement le résultat marqué par היה suivi de ל.
- source_word: לַחֲרָפוֹת
  choice: des insultes
  rationale: חֲרָפוֹת est un pluriel désignant des outrages, railleries ou insultes. Le pluriel concret « des insultes » respecte la forme hébraïque et reste naturel en français.
- source_word: לִי
  choice: m’a valu
  rationale: Le ל indique ici la personne touchée par le résultat ; il est intégré à la construction française « cela m’a valu ».
theological_decisions:
- issue: Rapport syntaxique entre « jeûne » et נַפְשִׁי (« mon âme / mon être »)
  choice: 'Rattacher l’expression à l’expérience intérieure des pleurs et du jeûne : « en jeûnant au plus profond de moi »'
  alternative: « quand j’ai humilié mon être par le jeûne » ou, très littéralement, « quand j’ai pleuré dans le jeûne, mon âme »
  rationale: L’hébreu est condensé et n’exprime aucun verbe correspondant à « humilier ». Le texte principal évite donc de l’ajouter, tout en conservant explicitement נַפְשִׁי et en laissant la tension syntaxique visible dans la note.
translation_notes:
  register: Français international actuel, sobre et poétique. « Au plus profond de moi » rend נַפְשִׁי de façon compréhensible sans effacer sa présence ; « des insultes » conserve le pluriel hébreu et convient au registre des lamentations.
