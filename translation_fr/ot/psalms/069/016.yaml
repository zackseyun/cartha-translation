  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: fr
  text: Réponds-moi, Yahweh, car ton amour fidèle est bon ; selon l’abondance de ta compassion, tourne-toi vers moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Réponds-moi
  rationale: L’impératif de ענה, dans le contexte d’une prière, demande à Dieu d’accorder une réponse. « Réponds-moi » est naturel et direct en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande ; « car » en restitue sobrement la valeur causale.
- source_word: טוֹב
  choice: est bon
  rationale: Cette traduction conserve le sens prédicatif simple de l’adjectif hébreu appliqué à l’amour fidèle de Dieu.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חסד désigne ici un amour bienveillant, loyal et constant. « Amour fidèle » exprime cette richesse sans vocabulaire archaïque.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: dans ta grande compassion
  rationale: La tournure hébraïque exprime la mesure ou la norme fondée sur l’abondance des compassions divines. Cette formulation française est naturelle tout en gardant l’idée d’une compassion immense.
- source_word: פְּנֵה אֵלָי
  choice: tourne-toi vers moi
  rationale: L’impératif de פנה avec אֶל décrit le mouvement relationnel de se tourner vers quelqu’un ; la formulation retenue est idiomatique et fidèle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. Sa translittération préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Relation entre la demande et les attributs divins
  choice: 'Conserver deux motifs distincts : la bonté de l’amour fidèle et la grandeur de la compassion'
  alternative: Fondre les deux expressions en une seule idée générale de bonté
  rationale: Le parallélisme hébreu juxtapose חסד et רחמים sans les identifier entièrement ; la traduction maintient cette tension et cette complémentarité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme bref d’une supplication poétique. « Dans ta grande compassion » privilégie l’idiome français tout en exprimant כְּרֹב, littéralement « selon l’abondance de ».
