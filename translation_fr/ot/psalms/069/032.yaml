  text: רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִ/יחִ֥י לְבַבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: fr
  text: Les humbles ont vu et se réjouissent[a] ; vous qui cherchez Dieu, que votre cœur vive[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les affligés ont vu et se réjouissent » ou « Les doux ont vu et se réjouissent ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « que votre cœur vive » ; cette expression évoque un regain de courage, de vitalité ou d’espérance.
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: ont vu
  rationale: Le qal accompli, 3e personne du pluriel, présente une perception déjà réalisée. L’absence de complément dans l’hébreu est conservée, malgré le caractère légèrement elliptique de la tournure française.
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme peut désigner les humbles, les doux ou les affligés. « Les humbles » conserve ici sa portée morale et spirituelle sans exclure une condition sociale éprouvée.
- source_word: יִשְׂמָחוּ
  choice: se réjouissent
  rationale: L’inaccompli peut exprimer une réaction présente, future ou vivement envisagée. Le présent s’enchaîne naturellement avec « ont vu » et exprime la joie qui en résulte sans imposer une valeur strictement future.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: vous qui cherchez Dieu
  rationale: Le participe construit est compris comme un vocatif en raison du suffixe de deuxième personne du pluriel qui suit. L’adresse directe est naturelle en français et respecte le mouvement du vers.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le nom désigne le Dieu d’Israël au singulier.
- source_word: וִיחִי לְבַבְכֶם
  choice: que votre cœur revive
  rationale: La formulation garde l’image hébraïque du cœur au singulier collectif tout en exprimant naturellement en français le retour du courage, de la vitalité et de l’espérance.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le tour elliptique « ont vu » préserve l’absence de complément dans le texte hébreu. « Votre cœur » maintient le singulier collectif hébreu, tandis que « revive » rend intelligible l’image sans la remplacer par une paraphrase telle que « reprenez courage ».
