  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: fr
  text: Je suis épuisé d’avoir crié ; ma gorge est desséchée[a]. Mes yeux s’épuisent à attendre mon Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma gorge est enrouée ». L’hébreu évoque plus littéralement une gorge desséchée, brûlante ou irritée à force de crier.
    reason: lexical_alternative
  - marker: b
    text: Ou « à espérer en mon Dieu ». Le verbe hébreu peut exprimer à la fois l’attente et l’espérance confiante.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי בְקָרְאִי
  choice: Je m’épuise à force de crier
  rationale: Le parfait יָגַעְתִּי exprime l’épuisement résultant, et בְקָרְאִי en indique ici la cause. Cette formulation française restitue naturellement l’usure produite par des appels répétés.
- source_word: נִחַר גְּרוֹנִי
  choice: ma gorge est desséchée
  rationale: נִחַר évoque la chaleur, la sécheresse ou l’irritation. « Desséchée » conserve l’image physique du texte hébreu, sans la réduire à l’interprétation « enrouée ».
- source_word: כָּלוּ עֵינַי
  choice: Mes yeux s’épuisent
  rationale: כָּלוּ peut signifier arriver à son terme, se consumer ou défaillir. Avec les yeux pour sujet, « s’épuisent » préserve l’image d’une attente prolongée et éprouvante.
- source_word: מְיַחֵל לֵאלֹהָי
  choice: tandis que j’attends mon Dieu
  rationale: יחל peut exprimer à la fois l’attente et l’espérance. « J’attends » met en avant la durée de l’épreuve, tandis qu’une note conserve explicitement la nuance d’espérance.
theological_decisions:
- issue: Ambiguïté entre attente et espérance dans מְיַחֵל
  choice: tandis que j’attends mon Dieu
  alternative: tandis que j’espère en mon Dieu
  rationale: Le contexte de lamentation favorise l’idée d’une attente prolongée, mais le verbe porte aussi une attente confiante. La note maintient cette tension sans imposer une lecture théologique plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme bref conserve l’intensité corporelle de la lamentation. « À force de crier » est idiomatique et explicite la valeur causale de la préposition hébraïque ; les notes préservent les principales ambiguïtés lexicales.
