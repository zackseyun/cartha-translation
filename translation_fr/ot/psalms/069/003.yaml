  source_fidelity: La première proposition rend bien l’épuisement causé par les cris, mais « Je m’épuise » décrit plus directement un processus en cours que l’état résultant exprimé par le parfait hébreu יָגַעְתִּי. « Je suis épuisé d’avoir crié » restitue plus précisément cet état tout en restant naturel. « Ma gorge est desséchée » correspond bien à נִחַר גְּרוֹנִי. « Mes yeux s’épuisent à attendre mon Dieu » conserve l’image de כָּלוּ עֵינַי et la valeur durative du participe מְיַחֵל.
  naturalness: La révision est fluide en français international moderne et garde un registre digne de lamentation. « D’avoir crié » est idiomatique et exprime clairement le rapport causal. « À attendre » est plus resserré et naturel que « tandis que j’attends » dans cette construction.
  terminology: « Mon Dieu » respecte le suffixe personnel de לֵאלֹהָי. Le choix « attendre » préserve sans l’épuiser la nuance de יחל; la note indique de façon appropriée l’alternative « espérer en ». « Desséchée » maintient l’image corporelle de sécheresse ou de brûlure sans imposer « enrouée ».
