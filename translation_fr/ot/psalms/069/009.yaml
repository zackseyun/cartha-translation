id: PSA.69.9
reference: Psalms 69:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: fr
  text: Car le zèle pour ta maison m’a dévoré[a], et les insultes de ceux qui t’insultent sont tombées sur moi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a consumé ».'
    reason: lexical_alternative
  - marker: b
    text: La première partie de ce verset est citée en Jean 2.17 à propos de Jésus; la seconde est reprise en Romains 15.3.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la situation décrite par le psalmiste et conserve naturellement la valeur explicative de l’hébreu.
- source_word: קִנְאַת
  choice: le zèle
  rationale: Désigne ici un attachement fervent, et non la jalousie; « zèle » est précis et naturel dans cette construction.
- source_word: בֵּיתְךָ
  choice: ta maison
  rationale: Reproduit l’expression hébraïque sans la préciser en « temple », laissant intacte sa portée concrète et symbolique.
- source_word: אֲכָלָתְנִי
  choice: m’a dévoré
  rationale: Rend directement l’image forte du verbe « manger, dévorer » tout en restant idiomatique en français.
- source_word: וְחֶרְפּוֹת
  choice: et les insultes
  rationale: Exprime clairement en français moderne les outrages verbaux ou le mépris visés par le nom hébreu.
- source_word: חֹרְפֶיךָ
  choice: de ceux qui t’insultent
  rationale: Préserve la répétition de la même racine hébraïque au moyen du couple « insultes / insultent ».
- source_word: נָפְלוּ עָלַי
  choice: sont tombées sur moi
  rationale: Suit de près l’image hébraïque selon laquelle les insultes adressées à Dieu retombent sur le psalmiste.
theological_decisions:
- issue: Résonance messianique et canonique du verset
  choice: Traduire selon la voix immédiate du psalmiste, en signalant séparément la reprise néotestamentaire.
  alternative: Introduire explicitement une lecture christologique dans le corps du verset.
  rationale: Le texte hébreu parle directement à la première personne dans le cadre du psaume; l’application à Jésus appartient à sa réception canonique et ne doit pas être ajoutée au libellé même.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe à Dieu dans le psautier. La répétition « insultes / insultent » reproduit volontairement la figure étymologique de l’hébreu.
