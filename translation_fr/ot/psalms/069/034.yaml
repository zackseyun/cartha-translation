id: PSA.69.34
reference: Psalms 69:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְֽ֭הַלְלוּ/הוּ שָׁמַ֣יִם וָ/אָ֑רֶץ יַ֝מִּ֗ים וְֽ/כָל רֹמֵ֥שׂ בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/034.yaml
  text: Let heaven and earth praise him[c][b][a], the seas and everything that moves in them.
translation:
  language: fr
  text: Que le ciel et la terre le louent[a], ainsi que les mers et tout ce qui s’y meut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le ciel et la terre le loueront » ; le verbe hébreu peut exprimer soit un appel, comme ici, soit une annonce.
    reason: alternative_reading
  - marker: b
    text: Ou « tout ce qui y rampe » ou « tout ce qui y grouille » ; le terme hébreu désigne largement les êtres qui se déplacent, rampent ou grouillent.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: Que … le louent
  rationale: Le piel inaccompli à la 3e personne du pluriel, avec suffixe objet masculin singulier, a ici une valeur probablement jussive. La tournure « Que… » exprime naturellement cet appel à la louange tout en conservant l’objet explicite « le ».
- source_word: שָׁמַיִם
  choice: le ciel
  rationale: Bien que le nom hébreu ait une forme plurielle, « le ciel » est en français le collectif usuel dans le couple cosmique « le ciel et la terre ».
- source_word: וָאָרֶץ
  choice: et la terre
  rationale: Dans ce contexte cosmique, אֶרֶץ désigne la terre plutôt qu’un territoire particulier.
- source_word: יַמִּים
  choice: les mers
  rationale: Le pluriel hébreu est rendu directement par « les mers », terme naturel dans cette évocation de l’ensemble de la création.
- source_word: וְכָל רֹמֵשׂ
  choice: et tout ce qui s’y meut
  rationale: Le participe רֹמֵשׂ peut désigner ce qui se déplace, rampe ou grouille. « Tout ce qui s’y meut » garde cette portée générale dans le contexte marin sans la limiter aux animaux qui rampent.
- source_word: בָּם
  choice: s’y
  rationale: Le suffixe masculin pluriel renvoie le plus naturellement aux mers. « S’y » restitue ce lien pronominal avec concision.
theological_decisions:
- issue: Valeur modale de יְהַלְלוּהוּ
  choice: 'Un appel adressé à la création : « Que… le louent »'
  alternative: 'Une annonce : « le ciel et la terre le loueront »'
  rationale: La forme inaccomplie peut être comprise comme jussive ou, moins probablement ici, comme prédictive. Le contexte de louange favorise l’appel, sans effacer l’autre possibilité, signalée en note.
- issue: Étendue de l’appel à la louange
  choice: Le ciel, la terre, les mers et les êtres qui s’y meuvent sont convoqués à louer Dieu.
  alternative: Une simple description future de la louange cosmique.
  rationale: La syntaxe et le mouvement poétique du psaume soutiennent une convocation de toute la création, sans ajouter de précision doctrinale étrangère au verset.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme poétique et le mérisme traditionnel « le ciel et la terre ». « Tout ce qui s’y meut » est légèrement soutenu, mais clair et approprié au registre des Psaumes.
