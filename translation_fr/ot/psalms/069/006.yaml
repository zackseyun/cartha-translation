source:
  edition: WLC
  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: fr
  text: Que ceux qui espèrent en toi ne soient pas couverts de honte à cause de moi[a], Seigneur, Yahweh des armées[b] ; que ceux qui te cherchent ne soient pas humiliés à cause de moi, Dieu d’Israël !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui t’attendent ». Le participe hébreu peut désigner une attente empreinte d’espérance.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Seigneur, Yahweh des armées ». Le titre « des armées » peut évoquer les armées célestes ou terrestres ; le texte ne le précise pas ici.'
    reason: source_clarification
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: soient couverts de honte
  rationale: Le verbe בוש désigne ici l’expérience de la honte ou du déshonneur. Cette tournure française exprime clairement le résultat redouté dans la prière.
- source_word: בִי
  choice: à cause de moi
  rationale: Dans ce contexte, la préposition ב avec le pronom indique que le psalmiste pourrait devenir l’occasion de la honte d’autrui. « À cause de moi » restitue naturellement cette valeur causale.
- source_word: קֹוֶיךָ
  choice: ceux qui espèrent en toi
  rationale: Le participe de קוה peut exprimer l’attente confiante aussi bien que l’espérance. « Espèrent en toi » met en relief l’attente confiante dirigée vers Dieu.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Seigneur Yahweh des armées
  rationale: « Seigneur » rend אֲדֹנָי, « Yahweh » représente directement le nom divin יהוה, et « des armées » conserve l’image du titre צְבָאוֹת sans la remplacer par une interprétation comme « Tout-Puissant ».
- source_word: יִכָּלְמוּ
  choice: soient humiliés
  rationale: כלם évoque la honte, le déshonneur ou l’humiliation. Un terme distinct du premier verbe préserve la variation du parallélisme hébreu.
- source_word: מְבַקְשֶׁיךָ
  choice: ceux qui te cherchent
  rationale: Le participe de בקש décrit une recherche active et continue ; cette formulation est idiomatique en français et en conserve le sens.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Dieu d’Israël
  rationale: La construction désigne le Dieu d’Israël et fonctionne ici comme une adresse directe, sans qu’il soit nécessaire d’ajouter une interjection.
theological_decisions:
- issue: Représentation du nom divin יהוה dans l’adresse אֲדֹנָי יְהוָה
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU ; Seigneur, l’Éternel
  rationale: La traduction « Yahweh » représente directement le nom divin présent dans l’hébreu, tandis que « Seigneur » conserve le titre אֲדֹנָי. Cette solution évite de confondre les deux éléments de l’adresse.
- issue: Portée de בִי dans les deux membres parallèles
  choice: à cause de moi
  alternative: en moi ; par moi
  rationale: La prière demande que le sort du psalmiste ne devienne pas une cause de honte pour ceux qui comptent sur Dieu. La traduction conserve cette relation sans préciser de quelle manière exacte cela pourrait se produire.
translation_notes:
  register: Français international moderne, digne et accessible. Les deux exclamations rendent la supplication poétique. La répétition de « à cause de moi » et la distinction entre « couverts de honte » et « humiliés » préservent le parallélisme et la variation lexicale de l’hébreu.
