lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Au chef de chœur » est une formule française concise, naturelle et adaptée à une instruction liturgique.
- source_word: עַל
  choice: sur
  rationale: Dans ce contexte musical, la préposition introduit probablement un air, un mode ou une indication d’exécution. « Sur » conserve cette souplesse et fonctionne naturellement devant le titre présumé d’un air.
- source_word: שׁוֹשַׁנִּים
  choice: « Les Lis »
  rationale: Le nom signifie littéralement « lis » et paraît désigner ici un air ou un style musical. Les guillemets signalent cet emploi probable comme titre; l’article français rend le titre idiomatique sans prétendre qu’il figure en hébreu.
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres de psaumes peut marquer l’auteur, l’appartenance, la dédicace ou plus largement l’association. « De David » préserve mieux cette amplitude que « par David ».
theological_decisions:
- issue: Portée de לְדָוִד dans le titre
  choice: De David
  alternative: Par David / Pour David
  rationale: Le titre hébreu ne tranche pas à lui seul entre attribution d’auteur, dédicace et association; la traduction évite donc d’imposer une conclusion.
translation_notes:
  register: Titre bref, liturgique et digne, en français international moderne. Les guillemets indiquent que « Les Lis » est probablement le nom d’un air, tandis que les notes préservent les ambiguïtés musicales et attributives de l’hébreu.
