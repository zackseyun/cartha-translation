  text: כִּֽי עָ֭לֶי/ךָ נָשָׂ֣אתִי חֶרְפָּ֑ה כִּסְּתָ֖ה כְלִמָּ֣ה פָנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/007.yaml
  text: For because of you I have borne reproach[b][a]; disgrace has covered my face.
translation:
  language: fr
  text: Car c’est à cause de toi que j’ai subi l’opprobre ; la honte a couvert mon visage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’hostilité et de l’humiliation évoquées dans le contexte. « Car » conserve naturellement ce lien en français.
- source_word: עָלֶיךָ
  choice: à cause de toi
  rationale: La préposition עַל exprime ici la cause ou le motif. « À cause de toi » reste direct et évite la nuance éventuellement volontariste ou bénéficiaire de « pour toi ».
- source_word: נָשָׂאתִי
  choice: je supporte
  rationale: Avec חֶרְפָּה, נשׂא signifie porter ou endurer l’opprobre. « Supporter les insultes » est une tournure française naturelle qui conserve l’idée d’endurance.
- source_word: חֶרְפָּה
  choice: les insultes
  rationale: Le terme désigne l’opprobre, les outrages ou les railleries qui déshonorent. « Les insultes » est clair en français moderne et met en relief l’agression verbale sans effacer sa dimension publique.
- source_word: כִּסְּתָה
  choice: couvre
  rationale: Le verbe signifie littéralement « couvrir ». Le présent français exprime avec naturel l’état résultant du parfait hébreu et maintient l’image concrète.
- source_word: כְלִמָּה
  choice: la honte
  rationale: Le nom évoque la honte, l’humiliation ou le déshonneur. « La honte » est idiomatique avec « couvre mon visage » et se distingue clairement des « insultes » de la première proposition.
- source_word: פָנַי
  choice: mon visage
  rationale: Le sens concret de « visage » convient à l’image de la honte qui le couvre.
