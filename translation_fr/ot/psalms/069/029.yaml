id: PSA.69.29
reference: Psalms 69:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֭/אֲנִי עָנִ֣י וְ/כוֹאֵ֑ב יְשׁוּעָתְ/ךָ֖ אֱלֹהִ֣ים תְּשַׂגְּבֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/029.yaml
  text: But as for me[a], I am afflicted and in pain; O God[c][b], let your salvation set me on high.
translation:
  language: fr
  text: Mais moi, je suis affligé et dans la douleur ; Dieu, que ton salut m’élève en lieu sûr[a][b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « ton salut, ô Dieu, m’élèvera en lieu sûr ». Le verbe hébreu peut être compris soit comme une demande, soit comme une affirmation au futur.'
    reason: alternative_reading
  - marker: b
    text: L’expression rend un verbe hébreu qui signifie placer quelqu’un dans un endroit élevé et inaccessible, donc le protéger ou le mettre en sécurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction suivie du pronom indépendant marque un contraste appuyé avec ce qui précède ; « Mais moi » le rend naturellement en français.
- source_word: עָנִי
  choice: affligé
  rationale: Dans ce contexte de lamentation, le terme décrit celui qui est abaissé ou éprouvé, sans se limiter à la pauvreté matérielle.
- source_word: וְכוֹאֵב
  choice: et dans la douleur
  rationale: Le participe exprime un état présent de souffrance ; cette formulation française reste naturelle et conserve le parallélisme avec « affligé ».
- source_word: יְשׁוּעָתְךָ
  choice: ton salut
  rationale: « Salut » conserve l’ampleur du nom hébreu, qui peut aussi désigner la délivrance ou le secours concret.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est compris comme une apostrophe directe au sein de la prière ; placé en tête de proposition, il demeure naturel en français.
- source_word: תְּשַׂגְּבֵנִי
  choice: que ton salut m’élève en lieu sûr
  rationale: Le piel de שׂגב évoque le fait de placer quelqu’un en hauteur, hors d’atteinte, donc en sécurité. La formulation conserve à la fois l’image verticale et son sens protecteur.
theological_decisions:
- issue: Valeur de l’imparfait תְּשַׂגְּבֵנִי
  choice: 'Requête à valeur jussive : « que ton salut m’élève »'
  alternative: 'Déclaration au futur : « ton salut m’élèvera »'
  rationale: Le contexte de lamentation et d’appel favorise une requête, mais la morphologie permet aussi de comprendre une affirmation au futur ; cette possibilité est préservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le contraste initial est marqué sans lourdeur ; l’image hébraïque de la hauteur protectrice est conservée, tandis que l’ambiguïté modale du verbe est signalée en note.
