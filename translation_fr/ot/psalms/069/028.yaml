  text: יִ֭מָּחֽוּ מִ/סֵּ֣פֶר חַיִּ֑ים וְ/עִ֥ם צַ֝דִּיקִ֗ים אַל יִכָּתֵֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: fr
  text: Qu’ils soient effacés du livre de la vie[a] ; qu’ils ne soient pas inscrits avec les justes !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du registre des vivants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: Qu’ils soient effacés
  rationale: Le nifal à valeur jussive exprime ici une demande imprécatoire au passif. « Effacés » prolonge naturellement l’image d’un livre ou d’un registre.
- source_word: מִסֵּפֶר
  choice: du livre
  rationale: סֵפֶר désigne un écrit, un livre ou un registre. « Livre » conserve l’expression biblique familière tout en restant naturel en français.
- source_word: חַיִּים
  choice: de la vie
  rationale: Le nom pluriel peut désigner la vie ou les vivants. « Livre de la vie » préserve l’expression traditionnelle et sa portée ouverte ; l’autre lecture est signalée en note.
- source_word: וְעִם צַדִּיקִים
  choice: avec les justes
  rationale: La préposition עִם signifie « avec », et צַדִּיקִים désigne ceux qui sont justes. La formulation conserve l’association envisagée dans le registre sans préciser davantage sa nature.
- source_word: אַל יִכָּתֵבוּ
  choice: qu’ils ne soient pas inscrits
  rationale: אַל suivi de l’imparfait exprime une défense ou un souhait négatif. « Inscrits » rend le passif de כתב et s’accorde avec l’image d’un livre servant de registre.
theological_decisions:
- issue: Sens du « livre de la vie » dans cette imprécation
  choice: Conserver la métaphore « livre de la vie » sans en fixer la portée théologique.
  alternative: Comprendre l’expression comme « registre des vivants » ou comme livre eschatologique du salut.
  rationale: L’hébreu permet l’idée de la vie ou celle des vivants, tandis que l’expression possède ailleurs des résonances théologiques plus larges. La traduction ne tranche pas ce que le verset laisse ouvert.
- issue: Valeur des formes verbales imprécatoires
  choice: 'Les rendre comme une demande ou un souhait : « Qu’ils soient… qu’ils ne soient pas… »'
  alternative: 'Les rendre comme une prédiction : « Ils seront… »'
  rationale: Dans la suite des imprécations du psaume, les formes verbales ont une valeur jussive plutôt que simplement déclarative.
translation_notes:
  register: Français moderne, digne et direct. Le parallélisme hébreu est conservé, ainsi que l’image cohérente de l’effacement et de l’inscription dans un livre ou registre.
