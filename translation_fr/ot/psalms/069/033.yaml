id: PSA.69.33
reference: Psalms 69:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: fr
  text: Car Yahweh écoute ceux qui sont dans le besoin et ne méprise pas ses prisonniers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses captifs ». Le terme hébreu peut désigner plus largement des personnes détenues ou privées de liberté.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’appel à la louange qui précède; « Car » conserve cette valeur causale dans un registre poétique naturel.
- source_word: שֹׁמֵעַ אֶל
  choice: écoute
  rationale: Le participe décrit une action caractéristique de Yahweh. « Écoute » rend ici non seulement l’audition, mais aussi l’attention portée à la prière ou à la détresse.
- source_word: אֶבְיוֹנִים
  choice: ceux qui sont dans le besoin
  rationale: Le terme désigne des personnes pauvres ou démunies. Cette formulation moderne conserve l’idée générale de vulnérabilité sans la limiter à la seule pauvreté matérielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit directement afin de préserver la référence personnelle et conventionnelle du tétragramme.
- source_word: אֲסִירָיו
  choice: ses prisonniers
  rationale: Le nom peut désigner des prisonniers ou des captifs, et le suffixe possessif de troisième personne est explicitement conservé par « ses ».
- source_word: לֹא בָזָה
  choice: ne méprise pas
  rationale: Le parfait poétique exprime ici une vérité générale, en parallèle avec le participe « écoute »; le présent français convient donc au sens gnomique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme; sa transcription maintient le nom propre sans le remplacer par un titre.
- issue: Valeur du possessif dans אֲסִירָיו
  choice: ses prisonniers
  alternative: les prisonniers
  rationale: Le suffixe hébreu doit être conservé. La traduction n’explicite toutefois pas la nature exacte du lien entre Yahweh et ces prisonniers.
- issue: Nature de la détention exprimée par אֲסִירָיו
  choice: prisonniers
  alternative: captifs
  rationale: Les deux sens sont possibles. « Prisonniers » convient au sens large de personnes détenues, tandis qu’une note préserve l’autre lecture sans préciser indûment les circonstances.
translation_notes:
  register: Français international moderne, sobre et poétique. La coordination est resserrée en omettant la répétition du sujet devant « ne méprise pas », tout en conservant le parallélisme des deux actions divines.
