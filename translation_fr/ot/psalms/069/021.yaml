source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ בְּ/בָרוּתִ֣/י רֹ֑אשׁ וְ֝/לִ/צְמָאִ֗/י יַשְׁק֥וּ/נִי חֹֽמֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/021.yaml
  text: They gave me poison for my food[c][b][a], and for my thirst they gave me vinegar to drink.
translation:
  language: fr
  text: Pour nourriture, ils m’ont donné du poison[a] ; et, dans ma soif, ils m’ont donné du vinaigre à boire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du fiel ». Le mot hébreu désigne ici une substance ou une plante amère et toxique ; « fiel » est la traduction traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « du vin aigre ». Le mot hébreu peut désigner du vin aigre ou du vinaigre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: ils ont mis
  rationale: Avec בְּבָרוּתִי, « mettre dans » exprime naturellement en français l’idée qu’ils ont placé ou mêlé la substance à la nourriture, tout en restant dans le champ sémantique courant de נתן.
- source_word: בְּבָרוּתִי
  choice: dans ma nourriture
  rationale: La préposition בְּ se prête ici au sens locatif « dans » ; cette lecture produit un français naturel et conserve l’image d’une substance ajoutée à la nourriture.
- source_word: רֹאשׁ
  choice: poison
  rationale: Dans ce contexte poétique, רֹאשׁ désigne une substance toxique ou amère. « Poison » rend clairement cette valeur sans l’identifier trop précisément à la bile.
- source_word: וְלִצְמָאִי
  choice: quand j’avais soif
  rationale: Cette tournure française idiomatique rend la situation exprimée par לִצְמָאִי sans l’étrangeté de « pour ma soif ».
- source_word: יַשְׁקוּנִי
  choice: ils m’ont donné … à boire
  rationale: Le hifil de שׁקה signifie faire boire ou donner à boire ; cette formulation est naturelle et précise en français.
- source_word: חֹמֶץ
  choice: vinaigre
  rationale: « Vinaigre » est le correspondant français traditionnel et large de חֹמֶץ ; le terme peut aussi désigner du vin aigre, signalé en note.
theological_decisions:
- issue: Résonance avec les récits évangéliques de la Passion
  choice: Traduire d’abord le sens propre du texte hébreu du psaume, avec « poison » et « vinaigre ».
  alternative: Employer « fiel » et « vin aigre » pour rendre plus explicite la formulation traditionnelle ou le rapprochement avec les récits de la Passion.
  rationale: La traduction doit partir du texte hébreu et ne pas harmoniser silencieusement le psaume avec les formulations du Nouveau Testament. Les autres possibilités lexicales sont néanmoins conservées en notes.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme est rendu par deux propositions équilibrées, tout en évitant l’expression peu naturelle « pour ma soif ». Les notes maintiennent les variantes traditionnelles et l’ambiguïté lexicale.
