  text: יְֽהוָ֗ה יִשְׁמָרְ/ךָ֥ מִ/כָּל רָ֑ע יִ֝שְׁמֹ֗ר אֶת נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
translation:
  language: fr
  text: Yahweh te gardera de tout mal[a] ; il gardera ta vie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout malheur » ou « de tout ce qui fait du mal ». Le mot hébreu peut désigner le mal moral, le tort ou l’adversité.
    reason: ambiguïté lexicale
  - marker: b
    text: Ou « ton être » ou « ton âme ». Le mot hébreu néfèsh peut désigner la vie, la personne elle-même ou l’âme selon le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin YHWH et préserve le nom d’alliance présent dans le texte hébreu.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: te gardera / il gardera
  rationale: Le verbe שׁמר signifie garder, protéger ou veiller sur. La répétition de « gardera » reproduit le refrain lexical et l’insistance du verset.
- source_word: מִכָּל רָע
  choice: de tout mal
  rationale: Cette formulation conserve l’ampleur de רָע, qui peut désigner aussi bien le mal que le malheur ou ce qui cause du tort.
- source_word: נַפְשֶׁךָ
  choice: ta vie
  rationale: Dans ce contexte, נֶפֶשׁ peut désigner la vie ou la personne elle-même. « Ta vie » est clair en français moderne et n’impose pas une distinction étroite entre corps et âme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme ; sa transcription préserve le nom propre sans le remplacer par un titre.
- issue: Portée de רָע
  choice: tout mal
  alternative: tout malheur
  rationale: « Mal » maintient la possible portée morale et adverse du terme hébreu, tandis que « malheur » limiterait davantage le sens aux calamités.
- issue: Sens de נַפְשֶׁךָ
  choice: ta vie
  alternative: ton âme
  rationale: « Ta vie » convient au sens contextuel de la personne vivante et évite d’introduire une anthropologie dualiste que l’hébreu n’exige pas ; la note conserve l’autre lecture traditionnelle.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement reflète la deuxième personne du singulier. La répétition de « gardera » conserve la structure et le thème dominants du psaume.
