base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/000.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains; from where will my help come?
translation:
  language: fr
  text: 'Chant des montées. Je lève les yeux vers les montagnes[a] : d’où me viendra mon secours ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les collines ».'
    reason: Alternative lexicale possible pour le pluriel hébreu הֶהָרִים.
lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend littéralement le titre traditionnel tout en conservant l’ambiguïté sur la nature de ces « montées ».
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: Correspond au sens courant du pluriel de הַר ; « collines » demeure possible selon le relief envisagé, mais n’est pas nécessaire ici.
- source_word: עֶזְרִי
  choice: le secours
  rationale: Le nom עֵזֶר désigne l’aide ou le secours ; avec le suffixe, le français naturel exprime ici « le secours [qui m’est destiné] » après « me viendra ».
theological_decisions:
- issue: Rapport entre les montagnes et la provenance du secours
  choice: 'Conserver la question ouverte : « d’où me viendra le secours ? »'
  alternative: Comprendre implicitement que le secours vient des montagnes ou, au contraire, que celles-ci représentent une menace
  rationale: Le texte de ce verset ne tranche pas à lui seul ; la traduction préserve donc la tension avant la réponse du verset suivant.
translation_notes:
  register: Français international moderne, simple et digne. Le deux-points relie le regard porté vers les montagnes à la question sans imposer une interprétation causale.
