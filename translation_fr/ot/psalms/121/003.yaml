id: PSA.121.3
reference: Psalms 121:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: fr
  text: Il ne laissera pas ton pied chanceler[a] ; celui qui veille sur toi ne sommeillera pas.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « glisser », « vaciller » ou « trébucher ».
    reason: alternative lexicale
  - marker: b
    text: 'On peut aussi comprendre : « Qu’il ne laisse pas ton pied chanceler ; que celui qui veille sur toi ne sommeille pas. » Les formes hébraïques peuvent exprimer un souhait ou une prière aussi bien qu’une assurance.'
    reason: lecture alternative
lexical_decisions:
- source_word: אַל
  choice: ne… pas
  rationale: Avec les verbes à l’inaccompli, אַל peut avoir une valeur jussive (« qu’il ne… pas »). Dans le contexte d’assurance du psaume, la formulation déclarative française exprime naturellement la confiance, tandis qu’une note préserve la lecture optative.
- source_word: יִתֵּן
  choice: laissera
  rationale: 'Bien que נתן signifie littéralement « donner », la construction exprime ici la permission : « laisser » est l’équivalent idiomatique naturel.'
- source_word: לַמּוֹט
  choice: chanceler
  rationale: 'מוֹט évoque la perte de stabilité : vaciller, chanceler, glisser. Avec « pied », « chanceler » conserve l’image concrète et la portée métaphorique sans limiter le sens à une glissade matérielle.'
- source_word: רַגְלֶךָ
  choice: ton pied
  rationale: Le singulier hébreu et le suffixe masculin singulier sont conservés ; « ton pied » est naturel dans cette image poétique.
- source_word: יָנוּם
  choice: sommeillera
  rationale: נוּם désigne l’assoupissement ou le sommeil léger plutôt que le sommeil profond. « Sommeiller » convient au registre poétique et prépare le parallèle du verset suivant.
- source_word: שֹׁמְרֶךָ
  choice: celui qui veille sur toi
  rationale: שׁמר signifie garder, surveiller, veiller sur. Cette tournure est plus naturelle en français actuel que « ton gardien » et permet de conserver le motif répété de la vigilance protectrice.
theological_decisions:
- issue: Valeur des négations hébraïques avec les verbes à l’inaccompli
  choice: 'Assurance déclarative : « Il ne laissera pas… ne sommeillera pas »'
  alternative: 'Souhait ou prière : « Qu’il ne laisse pas… que celui qui veille sur toi ne sommeille pas »'
  rationale: Les formes peuvent être entendues comme jussives, mais le contexte du psaume met l’accent sur l’assurance confiante de la protection divine. Le texte principal suit cette dynamique sans supprimer l’autre possibilité, signalée en note.
translation_notes:
  register: Français moderne, digne et poétique, avec tutoiement singulier conforme aux suffixes hébreux. « Celui qui veille sur toi » privilégie la clarté courante tout en maintenant le thème central de la garde divine.
