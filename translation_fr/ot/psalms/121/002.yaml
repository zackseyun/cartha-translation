source:
  edition: WLC
  text: עֶ֭זְרִ/י מֵ/עִ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/002.yaml
  text: My help comes from Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: fr
  text: 'Mon secours vient de Yahweh,

    le Créateur du ciel et de la terre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶזְרִי
  choice: Mon secours
  rationale: Le nom עֵזֶר désigne l’aide ou le secours. « Mon secours » est naturel, digne et exprime bien la dépendance personnelle du psalmiste.
- source_word: מֵעִם
  choice: vient de
  rationale: La préposition indique ici la source auprès d’une personne. Puisque la proposition hébraïque ne comporte pas de verbe conjugué explicite, « vient de » restitue naturellement en français le sens implicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: עֹשֵׂה
  choice: qui a fait
  rationale: Le participe présente Yahweh comme l’auteur du ciel et de la terre. Dans ce contexte de création accomplie, « qui a fait » est un français plus courant que « le Faiseur » et évite la nuance artisanale possible de « fabricant ».
- source_word: שָׁמַיִם
  choice: le ciel
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, « le ciel et la terre » est en français l’expression idiomatique consacrée pour désigner l’ensemble de la création.
- source_word: וָאָרֶץ
  choice: et la terre
  rationale: Dans ce mérisme, אֶרֶץ désigne la terre, non un pays particulier. L’article est requis par l’usage français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin. Le conserver sous la forme « Yahweh » distingue le nom propre du titre אֲדֹנָי sans ajouter une interprétation confessionnelle.
- issue: Valeur du participe עֹשֵׂה
  choice: qui a fait le ciel et la terre
  alternative: le Créateur du ciel et de la terre
  rationale: Le participe peut caractériser Yahweh comme celui qui fait ou a fait. « Qui a fait » demeure proche du verbe hébreu et s’insère naturellement dans la phrase, tandis que « le Créateur » transformerait le participe en titre nominal.
- issue: Absence de verbe conjugué dans la première proposition
  choice: vient de
  alternative: est auprès de
  rationale: L’hébreu énonce littéralement « mon secours, de la part de Yahweh ». Le français exige ici une relation verbale; « vient de » exprime la provenance sans modifier l’affirmation théologique.
translation_notes:
  register: Français international moderne, simple et solennel. Le parallélisme concis est conservé sur deux lignes. Aucun archaïsme ni terme technique n’est employé.
