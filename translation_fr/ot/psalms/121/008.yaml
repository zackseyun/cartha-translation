source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָר צֵאתְ/ךָ֥ וּ/בוֹאֶ֑/ךָ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: fr
  text: Yahweh veillera sur tes allées et venues, dès maintenant et pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh gardera ta sortie et ton entrée, dès maintenant et pour toujours ». L’expression hébraïque « sortir et entrer » peut désigner globalement tous les déplacements ou l’ensemble du cours de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, plutôt que de lui substituer un titre.
- source_word: יִשְׁמָר
  choice: veillera sur
  rationale: Le verbe שׁמר signifie garder, protéger ou veiller sur. Cette formulation est naturelle en français et exprime ici la protection attentive promise par le psaume.
- source_word: צֵאתְךָ וּבוֹאֶךָ
  choice: tes allées et venues
  rationale: Cette expression française courante conserve les deux mouvements opposés de l’hébreu et leur valeur englobante, sans les réduire à un départ et à une arrivée uniques.
- source_word: מֵעַתָּה
  choice: dès maintenant
  rationale: Exprime clairement le point de départ présent et la continuité immédiate de la protection.
- source_word: וְעַד עוֹלָם
  choice: et pour toujours
  rationale: Rend naturellement en français la durée future sans limite exprimée par עוֹלָם.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin; sa transcription préserve le caractère personnel du nom sans le remplacer par un titre.
- issue: Portée de « sortir et entrer »
  choice: tes allées et venues
  alternative: ta sortie et ton entrée
  rationale: La paire fonctionne vraisemblablement comme un mérisme englobant les déplacements et, plus largement, le cours de la vie; la note conserve toutefois la formulation plus littérale.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier correspond aux suffixes hébreux de deuxième personne masculine singulière. « Allées et venues » privilégie une équivalence naturelle tout en conservant le mérisme dans la note.
