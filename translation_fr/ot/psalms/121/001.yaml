id: PSA.121.1
reference: Psalms 121:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: fr
  text: 'Chant des montées. Je lève les yeux vers les montagnes[a] : d’où viendra mon secours ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les collines ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Chant
  rationale: Rend directement le nom désignant un chant, sans lui attribuer un genre plus précis que ne le fait l’hébreu.
- source_word: לַמַּעֲלוֹת
  choice: des montées
  rationale: Conserve la forme plurielle et l’ambiguïté de l’expression hébraïque, sans décider s’il s’agit de pèlerinages, de marches liturgiques ou de montées au sens figuré.
- source_word: אֶשָּׂא
  choice: Je lève
  rationale: Le présent français rend naturellement l’action vive exprimée ici par l’imparfait hébreu.
- source_word: עֵינַי
  choice: les yeux
  rationale: Avec le sujet « je », la tournure française idiomatique « je lève les yeux » exprime naturellement la possession indiquée en hébreu.
- source_word: אֶל
  choice: vers
  rationale: Exprime clairement l’orientation du regard dans un français naturel.
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: « Montagnes » restitue la valeur courante du terme tout en conservant « collines » comme possibilité lexicale en note.
- source_word: מֵאַיִן
  choice: d’où
  rationale: Formulation interrogative directe, claire et actuelle, qui demande l’origine du secours.
- source_word: יָבֹא
  choice: viendra
  rationale: Le futur rend la valeur prospective naturelle de la forme verbale dans cette question.
- source_word: עֶזְרִי
  choice: mon secours
  rationale: « Secours » est une expression française simple et digne qui restitue le nom hébreu avec son suffixe possessif.
theological_decisions:
- issue: Valeur syntaxique du second membre
  choice: 'Question directe : « d’où viendra mon secours ? »'
  alternative: 'Proposition déclarative ou interrogative indirecte : « d’où vient mon secours »'
  rationale: מֵאַיִן suivi de l’imparfait יָבֹא forme le plus naturellement une question directe. Cette lecture maintient l’attente poétique à laquelle répond le verset 2.
- issue: Portée symbolique des montagnes
  choice: Maintien du terme neutre « montagnes »
  alternative: Identifier les montagnes à Sion, à un lieu de danger ou à des hauts lieux idolâtres
  rationale: Le verset ne précise pas leur portée symbolique. La traduction ne tranche donc pas entre ces interprétations.
- issue: Sens du titre « des montées »
  choice: Expression compacte laissée ouverte
  alternative: Expliciter « chant des pèlerinages » ou « chant des marches »
  rationale: L’hébreu ne détermine pas explicitement la nature de ces montées ; l’explicitation imposerait une interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. Le titre reste compact ; la question conserve la tension du texte hébreu. Le deux-points marque le mouvement du regard vers l’interrogation sans ajouter d’interprétation.
