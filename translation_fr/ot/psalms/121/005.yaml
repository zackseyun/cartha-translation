id: PSA.121.5
reference: Psalms 121:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֥ה שֹׁמְרֶ֑/ךָ יְהוָ֥ה צִ֝לְּ/ךָ֗ עַל יַ֥ד יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/005.yaml
  text: Yahweh is your keeper[a]; Yahweh is your shade at your right hand.
translation:
  language: fr
  text: Yahweh est celui qui te garde ; Yahweh est ton ombre[a] à ta droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image est celle d’une ombre protectrice, toute proche de toi.
    reason: Clarification de la métaphore concrète de צֵל sans l’aplanir dans le texte principal.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent deux fois dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: שֹׁמְרֶךָ
  choice: celui qui te garde
  rationale: Le participe de שׁמר exprime ici une action continue. Cette tournure naturelle préserve aussi le lien lexical avec le thème récurrent de la garde dans le psaume.
- source_word: צִלְּךָ
  choice: ton ombre
  rationale: צֵל désigne concrètement l’ombre ou l’ombrage. « Ton ombre » conserve la métaphore hébraïque d’une présence proche qui protège de l’ardeur du soleil, sans la réduire au terme abstrait « protection ».
- source_word: עַל יַד יְמִינֶךָ
  choice: à ta droite
  rationale: L’expression situe Yahweh tout près du fidèle, du côté droit. « À ta droite » est idiomatique en français et conserve l’image spatiale sans reproduire lourdement la formulation littérale « sur la main de ta droite ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. La translittération maintient le nom personnel et sa répétition emphatique dans le verset.
- issue: Sens métaphorique de צִלְּךָ
  choice: conserver l’image « ton ombre »
  alternative: expliciter par « ta protection » ou « ton abri »
  rationale: L’hébreu présente Yahweh comme l’ombre même du fidèle. Garder cette métaphore respecte la poésie et le contexte du verset suivant, qui évoque le soleil, tout en laissant la note en préciser la portée protectrice.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme des deux propositions commençant par « Yahweh » est conservé. « Celui qui te garde » est plus naturel que « ton gardien » tout en faisant écho au vocabulaire dominant du psaume.
