source:
  edition: WLC
  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: fr
  text: Voici, celui qui garde Israël ne somnole ni ne dort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici, celui qui garde Israël ne s’assoupira pas et ne dormira pas. »'
    reason: Les formes verbales hébraïques peuvent, dans ce contexte, être comprises comme décrivant une réalité présente ou comme exprimant ce qui n’arrivera pas.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec naturel et dignité l’appel emphatique à l’attention, sans l’archaïsme plus prononcé de « Voici donc » ou d’autres tournures.
- source_word: לֹא ... וְלֹא
  choice: ne ... ni ne
  rationale: La construction corrélative française rend avec fluidité les deux négations hébraïques coordonnées.
- source_word: יָנוּם
  choice: somnole
  rationale: Désigne l’assoupissement ou la somnolence et maintient la distinction lexicale avec le sommeil exprimé par le verbe suivant.
- source_word: יִישָׁן
  choice: dort
  rationale: Verbe français courant correspondant au verbe hébreu ordinaire pour dormir.
- source_word: שֹׁמֵר
  choice: celui qui garde
  rationale: Le participe substantivé désigne « celui qui garde/protège ». Cette formulation naturelle conserve le vocabulaire récurrent de la garde dans le psaume et évite de réduire le sens à une fonction militaire.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom propre.
theological_decisions:
- issue: Description anthropomorphique de la vigilance de Dieu
  choice: Conserver l’image selon laquelle celui qui garde Israël ne somnole ni ne dort.
  alternative: Expliciter abstraitement que Dieu est toujours vigilant.
  rationale: Le parallélisme poétique exprime une vigilance incessante au moyen d’une image anthropomorphique. La traduction préserve cette image et sa tension sans lui substituer une formulation philosophique.
translation_notes:
  register: Français moderne, international et digne. « Celui qui garde » est clair pour un large lectorat et favorise la cohérence avec le thème dominant du psaume. « Somnole » préserve la gradation entre l’assoupissement et le sommeil.
