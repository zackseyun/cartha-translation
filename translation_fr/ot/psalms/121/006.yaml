  text: יוֹמָ֗ם הַ/שֶּׁ֥מֶשׁ לֹֽא יַכֶּ֗/כָּה וְ/יָרֵ֥חַ בַּ/לָּֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: fr
  text: Le jour, le soleil ne te frappera pas[a], ni la lune, la nuit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne te fera pas de mal ». Le verbe hébreu signifie littéralement « frapper », mais il peut ici évoquer un effet nuisible.
    reason: lexical_alternative
  - marker: b
    text: L’association du jour et de la nuit exprime une protection qui s’étend à tout moment. Le soleil et la lune peuvent être compris au sens littéral ou figuré, ou selon les deux sens à la fois.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: Le jour
  rationale: Adverbe temporel signifiant « le jour » ou « pendant le jour » ; cette formulation est concise et prépare le contraste avec la nuit.
- source_word: הַשֶּׁמֶשׁ
  choice: le soleil
  rationale: Équivalent direct et naturel du nom hébreu défini.
- source_word: לֹא יַכֶּכָּה
  choice: ne te frappera pas
  rationale: Le verbe נכה signifie concrètement « frapper ». Ce choix conserve l’image vive de l’hébreu sans adopter l’archaïsme « meurtrir » ni expliciter par « faire du mal ».
- source_word: וְיָרֵחַ
  choice: ni la lune
  rationale: La conjonction introduit le second membre parallèle sous la portée de la négation précédente ; « ni » rend naturellement cette relation en français.
- source_word: בַּלָּיְלָה
  choice: pendant la nuit
  rationale: Expression temporelle mise en contraste avec « le jour » ; elle donne en français une construction fluide avec le groupe nominal elliptique « ni la lune ».
theological_decisions:
- issue: Nature de la protection promise
  choice: Conserver les images concrètes du soleil et de la lune sans préciser si elles sont littérales, figurées ou les deux.
  alternative: Interpréter explicitement le verset comme une protection contre les dangers naturels, comme une protection totale en tout temps, ou comme une allusion aux craintes anciennes liées à la lune.
  rationale: Le parallélisme jour-nuit peut exprimer une protection complète tout en gardant sa force imagée. La traduction ne doit pas trancher une ambiguïté que le texte poétique laisse ouverte.
translation_notes:
  register: Français moderne, clair et digne. Le tutoiement correspond au suffixe hébreu de deuxième personne du singulier. La structure parallèle et l’image poétique sont conservées, avec une légère explicitation syntaxique naturelle en français.
