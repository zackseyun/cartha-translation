source:
  edition: WLC
  text: יְדֵי/הֶ֤ם וְ/לֹ֬א יְמִישׁ֗וּ/ן רַ֭גְלֵי/הֶם וְ/לֹ֣א יְהַלֵּ֑כוּ לֹֽא יֶ֝הְגּ֗וּ בִּ/גְרוֹנָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: fr
  text: Ils ont des mains, mais ne peuvent rien toucher ; des pieds, mais ne peuvent pas marcher ; ils n’émettent aucun son de leur gorge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne murmurent pas » ; littéralement, « dans leur gorge ». Le verbe hébreu peut désigner une émission sourde ou un murmure.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: Ils ont des mains
  rationale: Le texte hébreu dit littéralement « leurs mains » dans une proposition nominale. Cette formulation française explicite naturellement la possession et maintient le parallélisme avec les pieds.
- source_word: יְמִישׁוּן
  choice: ne peuvent pas toucher
  rationale: Le hifil de מושׁ désigne ici l'action de tâter ou de toucher avec les mains. « Ne peuvent pas toucher » exprime clairement l'impuissance des idoles, implicite dans le contexte.
- source_word: רַגְלֵיהֶם
  choice: des pieds
  rationale: Le nom signifie « leurs pieds ». Après « Ils ont », l'article indéfini produit en français un parallélisme compact et naturel.
- source_word: יְהַלֵּכוּ
  choice: ne peuvent pas marcher
  rationale: La forme signifie littéralement « ils ne marchent pas » ; dans cette satire des idoles, la négation décrit leur incapacité. « Ne peuvent pas marcher » en restitue la force en français courant.
- source_word: יֶהְגּוּ
  choice: ne font entendre aucun son
  rationale: הגה peut évoquer un son bas, un murmure ou une émission vocale. La formulation retenue conserve la portée générale du verbe sans la réduire à une parole articulée.
- source_word: בִּגְרוֹנָם
  choice: dans leur gorge
  rationale: Cette expression suit de près l'image hébraïque de la gorge comme siège de l'émission vocale et demeure intelligible en français.
theological_decisions:
- issue: Nature de l'incapacité des idoles
  choice: 'Rendre les deux premières négations comme des incapacités : « ne peuvent pas toucher » et « ne peuvent pas marcher ».'
  alternative: 'Traduction plus formelle : « ne touchent pas » et « ne marchent pas ».'
  rationale: Le contexte tourne en dérision des idoles qui possèdent des organes sans pouvoir s'en servir. La modalité d'incapacité rend cette idée sans ajouter de contenu doctrinal.
- issue: Portée de יֶהְגּוּ
  choice: Employer l'expression générale « ne font entendre aucun son ».
  alternative: « ne murmurent pas » ou « ne profèrent aucun son ».
  rationale: Le verbe peut désigner une émission sourde ou un murmure. Une formulation générale préserve cette étendue sémantique et souligne seulement l'absence de voix.
translation_notes:
  register: Français moderne, international et digne, avec un parallélisme poétique compact. Le singulier collectif « leur gorge » est naturel en français pour des sujets pluriels et correspond au suffixe pluriel hébreu.
