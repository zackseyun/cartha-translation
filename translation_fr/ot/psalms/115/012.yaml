id: PSA.115.12
reference: Psalms 115:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: fr
  text: Yahweh s’est souvenu de nous[a] ; il bénira, il bénira la maison d’Israël, il bénira la maison d’Aaron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a pensé à nous ».'
    reason: Alternative lexicale pour זְכָרָנוּ, qui peut exprimer le fait de garder quelqu’un présent à l’esprit et de lui accorder son attention.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre de l’alliance présent dans le texte hébreu.
- source_word: זְכָרָנוּ
  choice: s’est souvenu de nous
  rationale: Le parfait qal avec suffixe de première personne du pluriel exprime ici le fait accompli qui fonde l’assurance de la bénédiction à venir.
- source_word: יְבָרֵךְ
  choice: il bénira
  rationale: Dans ce contexte, l’imparfait se comprend naturellement comme un futur exprimant la confiance. La triple répétition est conservée pour respecter l’insistance poétique.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Cette formulation conserve le sens collectif et familial de בֵּית ainsi que le parallélisme du verset.
- source_word: בֵּית אַהֲרֹן
  choice: la maison d’Aaron
  rationale: La traduction maintient le parallélisme avec « la maison d’Israël » et désigne explicitement la lignée sacerdotale.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin propre ; sa translittération le distingue du titre אֲדֹנָי et préserve cette donnée du texte source.
- issue: Valeur modale ou future de יְבָרֵךְ
  choice: il bénira
  alternative: qu’il bénisse
  rationale: La progression de l’énoncé, du souvenir déjà manifesté à la bénédiction attendue, favorise une affirmation confiante au futur, sans exclure que la forme hébraïque puisse ailleurs porter une nuance volitive.
translation_notes:
  register: Français moderne, sobre et liturgique. La structure répétitive de l’hébreu est volontairement préservée ; le point-virgule rend l’enchaînement solennel des affirmations.
