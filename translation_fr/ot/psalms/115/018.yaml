id: PSA.115.18
reference: Psalms 115:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: fr
  text: Mais nous, nous bénirons Yah dès maintenant et pour toujours. Louez Yah ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, « Louez Yah ! » est l’expression à l’origine de la forme liturgique « Alléluia ». « Yah » est la forme poétique abrégée du nom divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Mais nous, nous
  rationale: Le waw et le pronom indépendant marquent le contraste avec les morts du verset précédent. La dislocation « Mais nous, nous » rend cette opposition avec naturel et conserve l’insistance sur le sujet.
- source_word: נְבָרֵךְ
  choice: bénirons
  rationale: L’imparfait piel à la première personne du pluriel exprime ici l’engagement qui se prolonge dans l’avenir. Le futur français convient au contraste entre les morts qui ne louent pas Yah et la communauté vivante qui le bénira.
- source_word: יָהּ
  choice: Yah
  rationale: Il s’agit de la forme poétique abrégée du nom divin, distincte du tétragramme complet. La conserver permet aussi de faire percevoir la composition de l’acclamation finale.
- source_word: מֵעַתָּה
  choice: dès maintenant
  rationale: Cette expression indique le point de départ présent d’une action appelée à se poursuivre. « Dès maintenant » est actuel et idiomatique.
- source_word: וְעַד עוֹלָם
  choice: et pour toujours
  rationale: L’expression désigne une durée sans fin. « Pour toujours » la rend clairement, sans archaïsme.
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel suivi du nom abrégé est traduit directement, ce qui conserve sa transparence lexicale et sa force liturgique.
theological_decisions:
- issue: Traduction de la forme poétique abrégée du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: L’hébreu emploie ici deux fois יָהּ, et non le tétragramme complet יְהוָה. « Yah » préserve cette distinction textuelle et le lien avec l’acclamation traditionnellement transcrite « Alléluia ».
- issue: Valeur contrastive de וַאֲנַחְנוּ
  choice: Mais nous, nous
  alternative: Et nous, nous
  rationale: Le verset oppose la communauté vivante aux morts mentionnés juste avant. « Mais » explicite la valeur adversative contextuelle sans modifier le contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « nous, nous » porte l’opposition sans lourdeur excessive. Le nom « Yah » est maintenu pour respecter la forme hébraïque abrégée et assurer la cohérence avec l’acclamation finale.
