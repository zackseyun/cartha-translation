  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: fr
  text: Vous qui craignez Yahweh[a], mettez votre confiance en Yahweh ! Il est leur secours et leur bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceux qui craignent Yahweh, qu’ils mettent leur confiance en Yahweh ! » L’expression hébraïque peut être comprise comme une adresse directe ou comme la désignation d’un groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: Vous qui craignez
  rationale: Le participe construit pluriel de ירא est employé comme substantif, « ceux qui craignent ». La formulation en adresse directe s’accorde naturellement avec l’impératif pluriel qui suit, tout en laissant l’autre analyse en note.
- source_word: יְהוָה / בַיהוָה
  choice: Yahweh / en Yahweh
  rationale: Le nom divin est translittéré « Yahweh ». Sa répétition dans l’hébreu est conservée, et la préposition ב après בטח se rend naturellement par « en ».
- source_word: בִּטְחוּ
  choice: mettez votre confiance
  rationale: Impératif qal pluriel de בטח. Cette tournure est idiomatique en français et exprime clairement l’appel à se confier en Yahweh.
- source_word: עֶזְרָם
  choice: leur secours
  rationale: Le nom עזר désigne le secours ou l’aide. « Leur secours » conserve le substantif abstrait et le suffixe de troisième personne du texte hébreu.
- source_word: וּמָגִנָּם
  choice: et leur bouclier
  rationale: מגן signifie concrètement « bouclier ». L’image protectrice est conservée plutôt que remplacée par une explicitation.
- source_word: הוּא
  choice: Il est
  rationale: Le pronom indépendant est emphatique dans la proposition nominale ; « Il est » en rend naturellement la force en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. La translittération préserve le nom propre divin plutôt que de lui substituer un titre.
- issue: Changement de personne entre l’exhortation et l’affirmation
  choice: « votre confiance » puis « leur secours »
  alternative: harmoniser en « votre secours »
  rationale: L’hébreu passe de l’impératif adressé au groupe à des suffixes de troisième personne. La traduction conserve cette tension grammaticale au lieu de l’effacer.
translation_notes:
  register: Français international moderne, clair et digne. L’apostrophe initiale et l’impératif gardent le mouvement exhortatif du psaume ; « secours » et « bouclier » préservent son parallélisme concret.
