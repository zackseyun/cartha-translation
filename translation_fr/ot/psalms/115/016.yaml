  text: הַ/שָּׁמַ֣יִם שָׁ֭מַיִם לַ/יהוָ֑ה וְ֝/הָ/אָ֗רֶץ נָתַ֥ן לִ/בְנֵי אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/016.yaml
  text: The heavens are Yahweh's heavens[c][b][a], but the earth he has given to the sons of man.
translation:
  language: fr
  text: Les cieux, les cieux appartiennent à Yahvé ; mais la terre, il l’a donnée aux humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de l’homme ». Expression hébraïque désignant les êtres humains, l’humanité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם שָׁמַיִם
  choice: Les cieux, les cieux
  rationale: La répétition hébraïque met les cieux en relief. Sa conservation en français restitue la structure emphatique et poétique sans en réduire la force à un simple possessif.
- source_word: לַיהוָה
  choice: appartiennent à Yahvé
  rationale: La préposition לְ exprime ici l’appartenance. « Appartiennent à » rend clairement cette relation, et « Yahvé » représente directement le nom divin יהוה.
- source_word: וְהָאָרֶץ
  choice: mais la terre
  rationale: Dans ce parallélisme antithétique, וְ introduit un contraste entre les cieux qui appartiennent à Yahvé et la terre donnée aux humains ; « mais » rend naturellement cette relation en français.
- source_word: נָתַן
  choice: il l’a donnée
  rationale: L’accompli hébreu présente le don comme effectué. Le pronom « il » reprend naturellement Yahvé, sujet compris d’après le contexte, et « l’ » reprend « la terre » dans une dislocation française idiomatique.
- source_word: לִבְנֵי אָדָם
  choice: aux humains
  rationale: L’expression hébraïque « fils d’Adam/de l’homme » désigne collectivement les êtres humains. « Aux humains » en communique directement le sens générique en français moderne, tandis qu’une note conserve la forme de l’expression source.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahvé » conserve le nom propre dans le corps du verset plutôt que de le remplacer par un titre.
- issue: Portée de בְנֵי אָדָם
  choice: aux humains
  alternative: aux fils d’Adam
  rationale: L’expression masculine hébraïque est ici collective et vise l’humanité, non un groupe exclusivement masculin. Le texte principal en donne le sens, et la note signale sa forme littérale.
translation_notes:
  register: Français international moderne, courant et digne. La répétition initiale conserve l’insistance poétique de l’hébreu ; la reprise « la terre, il l’a donnée » rend naturellement sa mise en relief.
