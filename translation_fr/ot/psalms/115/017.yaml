source:
  edition: WLC
  text: לֹ֣א הַ֭/מֵּתִים יְהַֽלְלוּ יָ֑הּ וְ֝/לֹ֗א כָּל יֹרְדֵ֥י דוּמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/017.yaml
  text: The dead do not praise Yah[b][a], nor do any who go down into silence.
translation:
  language: fr
  text: Ce ne sont pas les morts qui louent Yah, pas plus que quiconque descend dans le silence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « silence » est ici une image poétique de l’état ou du domaine de la mort ; certains y voient plus précisément « la tombe » ou « le shéol ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֵּתִים
  choice: les morts
  rationale: La forme substantivée désigne collectivement les personnes mortes; « les morts » est naturel et précis en français.
- source_word: יְהַלְלוּ
  choice: louent
  rationale: Le piel de הלל signifie couramment « louer », particulièrement dans un contexte d’adoration, et conserve l’écho de l’expression « alléluia ».
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ est la forme courte et poétique du nom divin; « Yah » maintient cette distinction sans l’assimiler au tétragramme complet.
- source_word: כָּל
  choice: aucun
  rationale: Sous la portée de וְלֹא, « aucun » rend naturellement en français la valeur distributive de כָּל dans cette proposition négative.
- source_word: יֹרְדֵי
  choice: ceux qui descendent
  rationale: Le participe de ירד caractérise ceux qui descendent; cette formulation française conserve la valeur générale de l’expression.
- source_word: דוּמָה
  choice: le silence
  rationale: « Le silence » préserve l’image poétique hébraïque sans l’identifier explicitement à la tombe ou au shéol.
theological_decisions:
- issue: Le verset nie-t-il doctrinalement toute louange après la mort, ou emploie-t-il une image poétique de la mort comme silence ?
  choice: Conserver l’affirmation poétique et l’image du « silence » sans développer une doctrine de l’état après la mort.
  alternative: Traduire explicitement « la tombe » ou « le shéol » et restreindre ainsi l’énoncé à ce domaine.
  rationale: Le psaume oppose les vivants qui louent Dieu aux morts au moyen d’un langage poétique hébraïque conventionnel. La traduction doit préserver cette tension sans trancher les débats théologiques plus larges.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure emphatique « Ce ne sont pas les morts qui… » reflète naturellement l’ordre marqué de l’hébreu. Le singulier « aucun » rend l’effet de כָּל sous négation.
