  yaml_path: translation/ot/psalms/115/004.yaml
  text: Their idols are silver and gold[a], the work of human hands.
translation:
  language: fr
  text: Leurs idoles sont d’argent et d’or, œuvre de mains humaines.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: Leurs idoles
  rationale: Dans ce contexte polémique, עָצָב désigne des représentations cultuelles tenues pour des dieux. « Idoles » exprime clairement le référent et convient au contraste du psaume avec le Dieu vivant.
- source_word: כֶּסֶף וְזָהָב
  choice: d’argent et d’or
  rationale: Les deux noms indiquent directement les matières dont les idoles sont faites; la coordination hébraïque est conservée naturellement en français.
- source_word: מַעֲשֵׂה
  choice: œuvre de
  rationale: Le nom construit signifie « œuvre, ouvrage, produit ». « Œuvre de » préserve sa force nominale et le parallélisme concis de l’hébreu.
- source_word: יְדֵי אָדָם
  choice: mains humaines
  rationale: יְדֵי est le pluriel concret « mains de », tandis que אָדָם a ici une valeur générique. « Mains humaines » est naturel en français moderne et maintient le contraste entre le divin et ce qui est fabriqué par les humains.
theological_decisions:
- issue: Valeur générique de אָדָם
  choice: mains humaines
  alternative: mains de l’homme
  rationale: Le terme ne désigne pas un homme précis, mais l’être humain collectivement. La formulation choisie conserve le contraste théologique avec Dieu sans introduire une référence masculine particulière.
translation_notes:
  register: Français moderne, sobre et dignifié. La structure nominale concise de l’hébreu est conservée; aucune note n’est nécessaire, car « œuvre de mains humaines » rend directement et sans ambiguïté notable l’expression source.
