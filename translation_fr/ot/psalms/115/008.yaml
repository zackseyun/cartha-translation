  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/008.yaml
  text: Those who make them become like them[b][a], as does everyone who trusts in them.
translation:
  language: fr
  text: Ceux qui les fabriquent deviendront comme elles[b][a], de même que tous ceux qui mettent leur confiance en elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront comme elles ». Le verbe hébreu peut exprimer le fait d’être ou de devenir.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire les idoles, muettes, aveugles, sourdes et impuissantes, décrites dans les versets précédents.
    reason: cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: comme elles
  rationale: La préposition comparative avec suffixe exprime la ressemblance. Le féminin reprend naturellement « les idoles », auxquelles renvoie le pronom dans le contexte précédent.
- source_word: יִהְיוּ
  choice: deviennent
  rationale: Le verbe היה peut signifier « être » ou, avec cet attribut comparatif, « devenir ». « Deviennent » exprime ici naturellement la ressemblance qui en résulte, sans exclure l’autre analyse.
- source_word: עֹשֵׂיהֶם
  choice: ceux qui les fabriquent
  rationale: Le participe désigne les personnes qui confectionnent les idoles. « Fabriquent » précise qu’il s’agit d’objets façonnés tout en restant courant.
- source_word: כֹּל אֲשֶׁר
  choice: tous ceux qui
  rationale: Cette tournure conserve la portée universelle de la construction hébraïque et s’accorde avec le pluriel du premier groupe.
- source_word: בֹּטֵחַ
  choice: mettent leur confiance
  rationale: בטח exprime la confiance ou l’assurance placée en quelqu’un ou quelque chose. La locution française est naturelle dans ce contexte religieux.
- source_word: בָּהֶם
  choice: en elles
  rationale: La préposition ב introduit l’objet de la confiance. En français, le pronom féminin renvoie clairement aux idoles du contexte.
theological_decisions:
- issue: Nature de la ressemblance avec les idoles
  choice: Le texte affirme que leurs fabricants et ceux qui leur font confiance deviennent comme elles, sans définir davantage cette ressemblance.
  alternative: Expliciter qu’ils deviennent insensibles, impuissants ou spirituellement morts comme les idoles.
  rationale: Les versets précédents décrivent les idoles, mais ce verset ne précise pas lui-même toutes les dimensions de la ressemblance. La traduction préserve donc la force et l’ouverture de l’avertissement.
- issue: Valeur de יִהְיוּ
  choice: deviennent
  alternative: seront comme elles
  rationale: La construction permet une lecture stative ou résultative. Le corps du texte retient la valeur résultative probable, tandis que la note conserve explicitement l’autre possibilité.
translation_notes:
  register: Français moderne, international et digne. La répétition des pronoms féminins assure le renvoi aux idoles du contexte. La syntaxe reste proche du parallélisme hébreu sans être artificielle.
