  text: בְּרוּכִ֣ים אַ֭תֶּם לַ/יהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/015.yaml
  text: May you be blessed by Yahweh[b][a], the Maker of heaven and earth.
translation:
  language: fr
  text: Que Yahvé vous bénisse[a], le Créateur du ciel et de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Bénis êtes-vous de/par Yahvé. » L’hébreu peut aussi se comprendre comme une déclaration : « Vous êtes bénis par Yahvé. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les cieux et la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם לַיהוָה
  choice: Que Yahvé vous bénisse
  rationale: La construction hébraïque, littéralement « bénis [êtes] vous pour/par Yahvé », fonctionne ici comme une formule de bénédiction. Le français optatif rend naturellement cette valeur, tout en signalant en note la formulation nominale et passive de l’hébreu.
- source_word: אַתֶּם
  choice: vous
  rationale: Le pronom hébreu est à la deuxième personne du masculin pluriel. En français, « vous » en exprime naturellement le nombre dans ce contexte collectif.
- source_word: יהוה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin, qui conserve ici sa valeur de nom propre.
- source_word: עֹשֵׂה
  choice: lui qui a fait
  rationale: Le participe qal de עשה sert d’épithète divine. Cette tournure française est naturelle et reste proche du sens de « celui qui fait/a fait ».
- source_word: שָׁמַיִם וָאָרֶץ
  choice: le ciel et la terre
  rationale: Cette paire forme un mérisme désignant l’ensemble de la création. « Le ciel et la terre » est l’expression française idiomatique, tandis que le pluriel morphologique de שָׁמַיִם est signalé en note.
theological_decisions:
- issue: Valeur de la formule בְּרוּכִים אַתֶּם לַיהוָה
  choice: Que Yahvé vous bénisse
  alternative: Vous êtes bénis par Yahvé
  rationale: Le contexte est celui d’une bénédiction prononcée sur les destinataires. L’optatif français communique cette fonction sans transformer la phrase en simple constat; la note préserve toutefois l’ambiguïté formelle de la proposition nominale hébraïque.
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme comme nom propre. « Yahvé » le représente explicitement sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, simple et digne. L’optatif « Que… bénisse » est idiomatique dans une formule de bénédiction; « lui qui a fait » évite un substantif plus interprétatif comme « Créateur » tout en conservant la portée du participe hébreu.
