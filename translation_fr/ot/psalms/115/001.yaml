  variant: modern international French
source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: fr
  text: Non pas à nous, Yahweh, non pas à nous, mais donne gloire à ton nom, à cause de ton amour fidèle, à cause de ta fidélité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ta vérité ».
    reason: Alternative lexicale possible pour אֲמִתֶּךָ.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom d’alliance présent dans le texte hébreu.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: Non pas à nous… non pas à nous
  rationale: Cette formulation conserve la répétition emphatique et le refus que la gloire revienne aux locuteurs.
- source_word: כִּי לְשִׁמְךָ תֵּן כָּבוֹד
  choice: mais à ton nom donne gloire
  rationale: « Mais » exprime naturellement le retournement contrastif introduit ici par כִּי, tandis que l’ordre légèrement poétique conserve la mise en relief du nom de Dieu.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne un amour loyal et constant; « amour fidèle » en rend les dimensions relationnelle et durable sans vocabulaire archaïque.
- source_word: אֲמִתֶּךָ
  choice: ta fidélité
  rationale: En parallèle avec חֶסֶד, le nom évoque surtout la fiabilité et la constance de Dieu; le sens également possible de « vérité » est conservé en note.
- source_word: עַל ... עַל
  choice: à cause de… à cause de
  rationale: La répétition rend les deux motifs sur lesquels repose la demande et préserve le parallélisme hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom propre sans le remplacer par un titre.
- issue: Sens de אֲמִתֶּךָ dans le couple חֶסֶד ואֱמֶת
  choice: ta fidélité
  alternative: ta vérité
  rationale: Le parallélisme décrit vraisemblablement la constance fiable de Dieu, mais le sens de « vérité » demeure authentiquement possible et figure donc en note.
translation_notes:
  register: Français international actuel, digne et poétique. La répétition et l’ordre marqué « à ton nom donne gloire » gardent l’insistance du vers hébreu sans rendre la phrase obscure.
