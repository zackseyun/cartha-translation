  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: fr
  text: Mais notre Dieu est dans les cieux ; il fait tout ce qu’il désire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il fait tout ce qu’il veut » ; autre traduction possible : « il a fait tout ce qui lui plaisait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: Mais notre Dieu
  rationale: Dans le contexte, la conjonction ו marque le contraste entre le Dieu vivant et les idoles. « Mais » rend naturellement cette valeur adversative ; אֱלֹהֵינוּ signifie « notre Dieu ».
- source_word: בַשָּׁמַיִם
  choice: est dans les cieux
  rationale: Cette formulation conserve le pluriel hébreu שָׁמַיִם et reste naturelle dans un registre français digne et courant.
- source_word: כֹּל אֲשֶׁר
  choice: tout ce que
  rationale: L’expression rend directement la portée totale de la construction hébraïque, sans la renforcer ni la restreindre.
- source_word: חָפֵץ
  choice: il désire
  rationale: חָפֵץ exprime ici le désir, le bon plaisir ou la volonté. « Désire » conserve cette amplitude lexicale sans transformer le terme en catégorie théologique technique.
- source_word: עָשָׂה
  choice: il fait
  rationale: Bien que la forme hébraïque soit un qatal, elle énonce ici une vérité générale sur l’action efficace de Dieu ; le présent français convient à cette valeur gnomique.
theological_decisions:
- issue: Formulation de la souveraineté divine
  choice: il fait tout ce qu’il désire
  alternative: il fait tout ce qu’il veut
  rationale: Le verset affirme la liberté et l’efficacité de Dieu par contraste avec les idoles impuissantes. « Désire » reflète le champ de חָפֵץ sans réduire l’énoncé à une formulation doctrinale plus technique.
translation_notes:
  register: Français international moderne, naturel et digne. « Dans les cieux » préserve la forme plurielle de l’hébreu. Le point-virgule maintient le lien étroit entre la demeure céleste de Dieu et son action souveraine.
