source:
  edition: WLC
  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/005.yaml
  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: fr
  text: Ils ont une bouche, mais ne parlent pas ; des yeux, mais ne voient pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: une bouche
  rationale: 'Le nom hébreu est au singulier et s’emploie distributivement avec le pronom pluriel : les idoles ont chacune une bouche. Le français naturel permet de conserver ce singulier distributif.'
- source_word: לָהֶם
  choice: ils ont
  rationale: La préposition ל avec suffixe pronominal exprime ici la possession (« à eux »), rendue idiomatiquement en français par « ils ont ».
- source_word: וְלֹא
  choice: mais ne… pas
  rationale: La coordination marque le contraste entre la présence des organes et l’absence de leur fonction ; « mais » exprime naturellement cette opposition.
- source_word: יְדַבֵּרוּ
  choice: parlent
  rationale: Le piel imparfait de דבר désigne ici l’action de parler. Le présent français convient à la description générale et au parallélisme poétique.
- source_word: עֵינַיִם
  choice: des yeux
  rationale: Équivalent français direct de la forme hébraïque désignant les yeux ; l’article indéfini s’accorde naturellement avec la construction possessive elliptique.
- source_word: יִרְאוּ
  choice: voient
  rationale: Le qal imparfait de ראה signifie « voir » et décrit l’incapacité sensorielle des idoles, en parallèle avec leur incapacité à parler.
theological_decisions:
- issue: Référent des pronoms pluriels
  choice: Les pronoms sont rendus par « ils », en continuité avec les idoles décrites dans le contexte précédent.
  alternative: 'Conserver la tournure hébraïque plus littérale : « Une bouche est à eux… des yeux sont à eux… »'
  rationale: 'La formulation française fait clairement ressortir la satire du psaume : les idoles possèdent des traits corporels sans pouvoir en exercer les fonctions, sans ajouter d’interprétation doctrinale.'
translation_notes:
  register: Français international moderne, sobre et poétique. L’ellipse du second « ils ont » préserve le parallélisme et la concision de l’hébreu tout en restant immédiatement compréhensible.
