source:
  edition: WLC
  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יִשְׁמָ֑עוּ אַ֥ף לָ֝/הֶ֗ם וְ/לֹ֣א יְרִיחֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: fr
  text: Ils ont des oreilles, mais ils n’entendent pas ; un nez, mais ils ne sentent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: des oreilles
  rationale: Le duel hébreu désigne les organes de l’ouïe. Le pluriel français convient naturellement au sujet pluriel et au parallélisme des parties du corps.
- source_word: לָהֶם
  choice: ils ont
  rationale: La préposition ל avec suffixe exprime ici la possession dans une proposition sans verbe ; « ils ont » est l’équivalent idiomatique français.
- source_word: יִשְׁמָעוּ
  choice: entendent
  rationale: Le qal imparfait de שׁמע désigne ici la faculté d’entendre, et non l’obéissance ou l’écoute attentive.
- source_word: אַף
  choice: un nez
  rationale: Dans ce contexte, אַף désigne concrètement le nez, et non la colère. Le singulier distributif est naturel en français avec un sujet pluriel.
- source_word: יְרִיחוּן
  choice: sentent
  rationale: La forme issue de ריח exprime ici la perception des odeurs. « Sentir » est le verbe français courant et maintient le parallélisme avec « entendre ».
- source_word: וְלֹא
  choice: mais … ne … pas
  rationale: Bien que la construction soit formellement « et ne… pas », « mais » rend naturellement le contraste ironique entre la présence des organes et l’absence de fonction.
theological_decisions:
- issue: Description anthropomorphique des idoles
  choice: Conserver l’image concrète d’organes sensoriels dépourvus de capacité sensorielle
  alternative: Expliciter leur impuissance spirituelle
  rationale: Le texte hébreu formule sa polémique au moyen d’une image corporelle concrète. La traduction la préserve sans ajouter d’interprétation théologique.
translation_notes:
  register: Français moderne, courant et digne. Le point-virgule conserve le parallélisme serré du verset. « Un nez » est employé au singulier distributif, usage naturel en français.
