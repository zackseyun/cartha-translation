  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: fr
  text: Il bénira ceux qui craignent Yahweh, les petits comme les grands.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les plus modestes avec les plus importants » ; l’hébreu oppose largement les petits et les grands, probablement notamment quant au rang ou à la condition sociale, et non à la seule taille.
