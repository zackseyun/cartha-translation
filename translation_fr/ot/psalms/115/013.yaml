lexical_decisions:
- source_word: יְבָרֵךְ
  choice: Il bénira
  rationale: Le piel inaccompli à la 3e personne du masculin singulier exprime ici, dans le contexte, une assurance tournée vers l’avenir plutôt qu’un souhait.
- source_word: יִרְאֵי יְהוָה
  choice: ceux qui craignent Yahweh
  rationale: La tournure française est naturelle et conserve la notion biblique de crainte révérencielle sans la réduire au simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הַקְּטַנִּים עִם הַגְּדֹלִים
  choice: les petits comme les grands
  rationale: Cette expression idiomatique garde le contraste englobant de l’hébreu, qui peut concerner le rang, l’importance ou la condition, sans le limiter à la taille.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Valeur de l’inaccompli יְבָרֵךְ
  choice: 'affirmation future : « Il bénira »'
  alternative: 'souhait : « Qu’il bénisse »'
  rationale: La suite des affirmations de confiance dans le contexte favorise une déclaration d’assurance, tout en reconnaissant que la forme hébraïque pourrait isolément recevoir une nuance volitive.
translation_notes:
  register: Français international moderne, simple et digne. « Les petits comme les grands » est une formule naturelle qui conserve le parallélisme et la portée inclusive du texte hébreu.
