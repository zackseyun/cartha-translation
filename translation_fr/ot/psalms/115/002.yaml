source:
  edition: WLC
  text: לָ֭/מָּה יֹאמְר֣וּ הַ/גּוֹיִ֑ם אַיֵּה נָ֝֗א אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: fr
  text: 'Pourquoi les nations diraient-elles[a] : « Où donc est leur Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi les nations disent-elles : “Où est donc leur Dieu ?” »'
    reason: 'Alternative grammaticale : l’imparfait hébreu peut aussi être rendu par un présent décrivant une raillerie effectivement proférée ou répétée.'
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi… diraient-elles
  rationale: Avec l’imparfait יֹאמְרוּ, introduit une question rhétorique exprimant l’objection à la raillerie des nations. Le conditionnel français rend naturellement cette nuance sans en faire une simple prédiction.
- source_word: יֹאמְרוּ
  choice: diraient-elles
  rationale: Imparfait qal, troisième personne du masculin pluriel, de אמר. Dans cette question rhétorique, le conditionnel présent français traduit bien la parole envisagée ou répétée.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Rendu direct de גּוֹיִם, qui désigne ici les peuples étrangers par contraste avec Israël, sans les connotations plus tardives que pourrait porter « les païens ».
- source_word: אַיֵּה
  choice: Où… est
  rationale: Interrogatif de lieu ; le verbe copule, absent en hébreu, doit être exprimé en français.
- source_word: נָא
  choice: donc
  rationale: La particule renforce ici le défi moqueur plutôt qu’elle n’exprime une demande polie. « Donc » transmet naturellement cette insistance en français.
- source_word: אֱלֹהֵיהֶם
  choice: leur Dieu
  rationale: Le mot désigne ici le Dieu d’Israël, avec un référent singulier malgré la forme morphologique de אֱלֹהִים. La majuscule indique ce référent précis.
theological_decisions:
- issue: Référent de אֱלֹהֵיהֶם
  choice: leur Dieu
  alternative: leur dieu
  rationale: Les nations tournent en dérision Israël en mettant en question la présence ou l’intervention de son Dieu. La majuscule reflète ce référent contextuel sans ajouter d’affirmation absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. L’inversion interrogative convient au registre poétique sans être archaïque. « Où donc » conserve la vigueur provocatrice de la question.
