source:
  edition: WLC
  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: fr
  text: Maison d’Aaron, mettez votre confiance en Yahweh ; il est leur[a] secours et leur bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici de l’adresse directe (« mettez votre confiance ») à la troisième personne : « leur secours et leur bouclier ».'
    reason: grammatical_shift
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: Maison d’Aaron
  rationale: La locution construite signifie littéralement « maison d’Aaron » et désigne ici la lignée sacerdotale. Cette formulation conserve l’image hébraïque et le parallélisme du psaume.
- source_word: בִּטְחוּ
  choice: mettez votre confiance
  rationale: L’impératif pluriel de בטח exprime une exhortation directe. « Mettez votre confiance » est idiomatique en français et rend clairement le pluriel.
- source_word: בַיהוָה
  choice: en Yahweh
  rationale: La préposition ב introduit l’objet de la confiance, tandis que le tétragramme est rendu par le nom propre « Yahweh ».
- source_word: עֶזְרָם
  choice: leur secours
  rationale: Le nom עֵזֶר avec suffixe de troisième personne du pluriel signifie « leur secours ». « Secours » convient au registre poétique et reste proche du substantif hébreu.
- source_word: וּמָגִנָּם
  choice: et leur bouclier
  rationale: מָגֵן désigne littéralement un bouclier. La traduction conserve cette métaphore concrète fréquente dans les Psaumes.
- source_word: הוּא
  choice: il est
  rationale: Le pronom indépendant ouvre avec insistance une proposition nominale ; le français exige ici l’ajout du verbe « est », sans introduire l’idée absente de « lui seul ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le caractère de nom propre du nom divin sans le remplacer par un titre.
- issue: Passage de la deuxième à la troisième personne
  choice: leur secours et leur bouclier
  alternative: votre secours et votre bouclier
  rationale: Malgré l’adresse directe à la maison d’Aaron, les suffixes hébreux sont à la troisième personne du pluriel. La traduction préserve ce changement grammatical plutôt que de l’harmoniser.
translation_notes:
  register: Français moderne, digne et accessible. « Maison d’Aaron » maintient l’idiome biblique ; « mettez votre confiance » évite une tournure trop archaïque. Le changement de personne de l’hébreu est conservé et signalé en note.
