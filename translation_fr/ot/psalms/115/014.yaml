  text: יֹסֵ֣ף יְהוָ֣ה עֲלֵי/כֶ֑ם עֲ֝לֵי/כֶ֗ם וְ/עַל בְּנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/014.yaml
  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: fr
  text: Que Yahweh vous fasse croître[a] — vous et vos enfants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que Yahweh vous accorde davantage — à vous et à vos enfants. » Le verbe hébreu signifie littéralement « ajouter » et peut exprimer l’idée d’accroître.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵף
  choice: fasse croître
  rationale: Dans cette bénédiction, le hiphil de יסף exprime l’idée d’ajouter ou d’accroître. « Vous fasse croître » est naturel en français et conserve la portée volitive de la forme verbale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: vous ... vous
  rationale: La première occurrence est intégrée au verbe français, tandis que la seconde est maintenue dans l’expansion emphatique après le tiret.
- source_word: וְעַל בְּנֵיכֶם
  choice: et vos enfants
  rationale: Dans ce contexte familial, בנים désigne naturellement les enfants; cette traduction évite de restreindre indûment le sens aux seuls fils.
theological_decisions:
- issue: Valeur volitive de la forme verbale dans un contexte de bénédiction
  choice: Que Yahweh vous fasse croître
  alternative: Yahweh vous fera croître
  rationale: Le contexte immédiat de bénédiction favorise le souhait ou la prière plutôt qu’une simple affirmation prédictive.
- issue: Portée de l’accroissement demandé
  choice: Conserver une formulation générale
  alternative: Que Yahweh vous rende plus nombreux / vous enrichisse
  rationale: L’hébreu ne précise pas explicitement s’il s’agit du nombre, de la prospérité ou d’une autre forme d’accroissement; la traduction préserve cette ouverture.
translation_notes:
  register: Français moderne, digne et accessible. Le tiret présente « vous et vos enfants » comme une reprise explicative et emphatique, conformément à la répétition de l’hébreu.
