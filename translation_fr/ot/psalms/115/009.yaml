  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: fr
  text: Israël, mets ta confiance en Yahweh ; il est leur secours et leur bouclier.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre du peuple de l’alliance, conservé sous sa forme française habituelle.
- source_word: בְּטַח
  choice: mets ta confiance
  rationale: Impératif masculin singulier adressé collectivement à Israël. Le singulier français préserve cette adresse collective et cette formulation est naturelle et digne.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition בְּ marque ici l’objet de la confiance, et le nom divin יהוה est rendu directement par « Yahweh ».
- source_word: עֶזְרָם
  choice: leur secours
  rationale: Le nom עֵזֶר avec suffixe de troisième personne masculine plurielle désigne ce que Yahweh est pour eux. « Secours » conserve la construction nominale sans l’interpréter comme « celui qui les aide ».
- source_word: וּמָגִנָּם
  choice: et leur bouclier
  rationale: « Bouclier » préserve la métaphore concrète de מָגֵן ainsi que le suffixe pluriel « leur ».
- source_word: הוּא
  choice: il est
  rationale: Le pronom indépendant souligne que Yahweh lui-même est leur secours et leur bouclier ; la copule est explicitée naturellement en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Passage de l’adresse singulière aux possessifs pluriels
  choice: « mets » puis « leur »
  alternative: « mettez » puis « votre »
  rationale: L’hébreu adresse Israël comme une entité collective au singulier, puis parle des membres du peuple à la troisième personne plurielle. La traduction préserve cette variation grammaticale et sa légère tension plutôt que de l’harmoniser.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. L’adresse collective au singulier est conservée, de même que la transition hébraïque vers « leur ». La métaphore du bouclier reste concrète.
