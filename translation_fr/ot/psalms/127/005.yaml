source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: fr
  text: Heureux l’homme qui en a rempli son carquois ! Ils ne seront pas couverts de honte[a] quand ils parleront avec des ennemis[b] à la porte de la ville[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ils n’auront pas honte ». Certains comprennent que le père seul est le sujet et traduisent : « il ne sera pas couvert de honte ». En hébreu, les verbes sont au pluriel.'
    reason: alternative_reading
  - marker: b
    text: Ou « quand ils affronteront des ennemis » ou « quand ils défendront leur cause contre des ennemis ». Dans ce contexte, le verbe peut avoir une nuance judiciaire ou conflictuelle.
    reason: lexical_alternative
  - marker: c
    text: Dans les villes anciennes, la porte était le lieu où l’on rendait la justice et traitait les affaires publiques.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Formule de béatitude naturelle et élevée en français, qui exprime une situation enviable sans réduire le sens à une émotion passagère.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom hébreu est masculin et désigne ici le père évoqué par le contexte; « l’homme » conserve cette précision.
- source_word: מִלֵּא אֶת אַשְׁפָּתוֹ מֵהֶם
  choice: qui en a rempli son carquois
  rationale: Le parfait hébreu présente le carquois comme rempli; le pronom « en » renvoie naturellement aux fils comparés à des flèches au verset précédent.
- source_word: לֹא יֵבֹשׁוּ
  choice: Ils ne seront pas couverts de honte
  rationale: Cette formulation rend la honte publique ou le déshonneur et maintient le pluriel explicite du texte hébreu.
- source_word: כִּי
  choice: quand
  rationale: La conjonction introduit ici naturellement la circonstance dans laquelle ils ne connaîtront pas la honte.
- source_word: יְדַבְּרוּ אֶת אוֹיְבִים
  choice: ils parleront avec des ennemis
  rationale: Le rendu garde le sens large de « parler » et n’impose pas dans le texte principal une nuance judiciaire ou conflictuelle plus précise, tout en la signalant en note.
- source_word: בַּשָּׁעַר
  choice: à la porte de la ville
  rationale: L’ajout explicatif « de la ville » rend immédiatement intelligible le lieu institutionnel visé sans altérer l’image ancienne.
theological_decisions:
- issue: Langage représentatif masculin
  choice: l’homme
  alternative: la personne; celui qui
  rationale: Le texte désigne grammaticalement un homme et, dans le contexte, un père. La traduction conserve ce référent plutôt que de le neutraliser.
- issue: Sujet pluriel de לֹא יֵבֹשׁוּ et יְדַבְּרוּ
  choice: Ils ne seront pas couverts de honte… ils parleront
  alternative: Il ne sera pas couvert de honte… il parlera
  rationale: Les deux verbes hébreux sont au pluriel. Le texte principal conserve cette donnée, qui peut viser le père avec ses fils ou la famille collectivement, sans la résoudre en un sujet singulier.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure de béatitude reste solennelle; « carquois » préserve la métaphore du verset précédent. Les pluriels hébreux sont maintenus, et les nuances judiciaires possibles sont réservées à une note afin de conserver l’ambiguïté du verbe.
