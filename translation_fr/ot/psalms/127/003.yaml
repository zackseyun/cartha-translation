source:
  edition: WLC
  text: הִנֵּ֤ה נַחֲלַ֣ת יְהוָ֣ה בָּנִ֑ים שָׂ֝כָ֗ר פְּרִ֣י הַ/בָּֽטֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/003.yaml
  text: Behold[a], children are a heritage from Yahweh, the fruit of the womb a reward.
translation:
  language: fr
  text: Voici, les enfants sont un héritage de la part de Yahweh[a] ; le fruit du ventre est une récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les enfants sont l’héritage de Yahweh ».'
    reason: La construction hébraïque peut exprimer aussi bien la provenance que la possession.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force présentative et l’appel à l’attention de l’hébreu, dans une forme poétique encore naturelle en français.
- source_word: נַחֲלַת יְהוָה
  choice: un héritage reçu de Yahweh
  rationale: La chaîne construite peut indiquer soit la provenance, soit la possession. Le parallélisme avec « une récompense » favorise ici l’idée d’un don venant de Yahweh ; « reçu de » rend cette lecture sans suggérer un héritage obtenu à la mort d’un propriétaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: בָּנִים
  choice: les enfants
  rationale: Bien que le nom hébreu soit au masculin pluriel, il désigne ici la descendance de manière générique, et non exclusivement les fils.
- source_word: שָׂכָר
  choice: une récompense
  rationale: Exprime la valeur positive du don dans ce contexte, sans la connotation strictement commerciale que pourrait avoir « salaire ».
- source_word: פְּרִי הַבָּטֶן
  choice: le fruit du ventre
  rationale: Préserve l’image poétique concrète de l’expression hébraïque tout en restant compréhensible en français moderne.
theological_decisions:
- issue: Sens de la construction נַחֲלַת יְהוָה
  choice: les enfants sont un héritage reçu de Yahweh
  alternative: les enfants sont l’héritage de Yahweh
  rationale: La construction hébraïque permet de comprendre soit que l’héritage vient de Yahweh, soit qu’il lui appartient. Le parallélisme avec « récompense » appuie la première lecture, tandis qu’une note conserve la seconde.
translation_notes:
  register: Français international moderne, poétique et digne. « Voici » conserve l’élan exclamatif du verset ; le point-virgule met en valeur le parallélisme hébreu.
