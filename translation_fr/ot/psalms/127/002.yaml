id: PSA.127.2
reference: Psalms 127:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: fr
  text: C’est en vain que vous vous levez tôt et veillez tard, mangeant le pain d’un travail pénible ; car il donne le sommeil à celui qu’il aime.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car ainsi il donne à celui qu’il aime pendant son sommeil », ou « car il donne à celui qu’il aime quand celui-ci dort ». L’hébreu est condensé : Dieu peut être présenté soit comme donnant le sommeil lui-même, soit comme accordant ses dons même pendant le sommeil.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: en vain
  rationale: Exprime naturellement l’inutilité des efforts décrits, sans ajouter l’idée de tromperie ou de néant.
- source_word: מַשְׁכִּימֵי קוּם
  choice: vous vous levez tôt
  rationale: Rend clairement la construction qui désigne ceux qui se lèvent de bonne heure et s’intègre au parallélisme français.
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: veillez tard
  rationale: Le tour hébreu évoque le fait de prolonger tard la position assise et, par contexte, l’activité éveillée. « Veillez tard » restitue ce contraste avec le lever matinal dans un français naturel.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: mangeant le pain d’un travail pénible
  rationale: Préserve l’image du pain tout en rendant עֲצָבִים par l’effort pénible et chargé de peine, sans limiter le sens à la seule tristesse ou à la seule inquiétude.
- source_word: כֵּן
  choice: car
  rationale: Dans cette lecture de la proposition finale, introduit naturellement le fondement du contraste entre les efforts humains épuisants et le don de Dieu.
- source_word: יִתֵּן
  choice: il donne
  rationale: Le présent convient à cette affirmation générale. Le sujet implicite renvoie à Dieu dans le contexte du psaume.
- source_word: לִידִידוֹ
  choice: à celui qu’il aime
  rationale: Conserve le singulier et la nuance affective de יָדִיד dans une formulation française courante et digne.
- source_word: שֵׁנָא
  choice: le sommeil
  rationale: Le nom signifie « sommeil ». La syntaxe condensée permet de le comprendre comme complément direct, tout en autorisant une lecture adverbiale signalée en note.
theological_decisions:
- issue: Syntaxe condensée de כֵּן יִתֵּן לִידִידוֹ שֵׁנָא
  choice: car il donne le sommeil à celui qu’il aime
  alternative: 'car ainsi il donne à celui qu’il aime pendant son sommeil ; ou : car il donne à celui qu’il aime quand celui-ci dort'
  rationale: Le mot « sommeil » peut être compris soit comme ce que Dieu donne, soit comme l’indication du moment où il donne. Le texte principal retient la construction française la plus directe, tandis que la note conserve l’autre possibilité sans trancher une ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Veillez tard » privilégie l’expression idiomatique plutôt qu’un calque obscur de la position assise. La proposition finale garde le pronom « il », dont le référent divin ressort du contexte immédiat du psaume.
