source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: fr
  text: 'Chant des montées. De Salomon.[a]


    Si Yahweh ne bâtit pas la maison[b],

    ceux qui la bâtissent peinent en vain[c] ;

    si Yahweh ne garde pas la ville,

    le gardien reste éveillé en vain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « Pour Salomon » ou « Appartenant à Salomon » ; dans cette suscription, l’hébreu peut indiquer l’auteur, une dédicace ou une association.
    reason: alternative_reading
  - marker: b
    text: En hébreu, « maison » peut aussi désigner une maisonnée ou une dynastie.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ceux qui la bâtissent peinent en elle » ; en français, « en elle » est sous-entendu et serait redondant.'
    reason: source_form
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Cette formule conserve le sens lexical de מַעֲלוֹת et le titre traditionnel de cette collection de psaumes, sans préciser de manière conjecturale s’il s’agit de pèlerinages, de degrés ou d’une autre forme de montée.
- source_word: לִשְׁלֹמֹה
  choice: De Salomon
  rationale: Formulation française concise et conventionnelle pour une suscription ; la note préserve l’éventail sémantique de la préposition ל, qui peut signaler l’auteur, le destinataire, la dédicace ou une association.
- source_word: אִם ... לֹא
  choice: Si ... ne ... pas
  rationale: Cette construction conditionnelle est naturelle en français et conserve directement la forme répétée de l’hébreu. Elle exprime ici la condition négative rendue en anglais par « unless ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel représenté par le tétragramme, plutôt que substitution par un titre.
- source_word: יִבְנֶה בַיִת
  choice: bâtit la maison
  rationale: Le concret « maison » convient au parallélisme avec « ville ». En hébreu, בַיִת peut aussi désigner une maisonnée ou une dynastie ; cette possibilité est signalée en note sans être imposée au texte.
- source_word: שָׁוְא
  choice: en vain
  rationale: Rend l’idée de futilité et permet de conserver exactement la répétition qui structure les deux membres poétiques.
- source_word: עָמְלוּ
  choice: peinent
  rationale: Le verbe exprime un travail pénible et soutenu. « Peinent » est naturel, concis et adapté au ton sapientiel.
- source_word: בּוֹנָיו
  choice: ceux qui la bâtissent
  rationale: Rend clairement le participe pluriel et son suffixe renvoyant à la maison, dans un français plus naturel que « ses bâtisseurs » dans ce contexte.
- source_word: יִשְׁמָר עִיר
  choice: garde la ville
  rationale: שׁמר désigne ici la protection vigilante ; « garde » maintient le lien lexical et thématique avec le gardien.
- source_word: שָׁקַד
  choice: reste éveillé
  rationale: Le verbe souligne l’état d’éveil vigilant plutôt que l’action générale de surveiller.
- source_word: שׁוֹמֵר
  choice: le gardien
  rationale: Désigne naturellement celui qui assure la garde d’une ville et maintient en français le lien avec le verbe « garder ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom personnel au lieu de le remplacer par un titre.
- issue: Portée de בַיִת dans ce contexte sapientiel
  choice: la maison
  alternative: la maisonnée ; la dynastie
  rationale: Le parallélisme immédiat avec la ville et le gardien favorise l’image concrète d’une construction. Les sens collectifs possibles restent accessibles en note afin de ne pas trancher indûment la portée du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux propositions conditionnelles et la répétition de « en vain » reproduisent le parallélisme hébreu. La mise en lignes fait ressortir la structure poétique sans ajouter d’interprétation.
