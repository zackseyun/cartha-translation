  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: fr
  text: Comme des flèches dans la main d’un guerrier, tels sont les fils que l’on a dans sa jeunesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la jeunesse »; autrement dit, les fils nés pendant les jeunes années.'
    reason: La note conserve l’expression hébraïque condensée et explicite son sens idiomatique probable.
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: Comme des flèches
  rationale: חִצִּים est le pluriel du terme courant désignant les flèches, et כְּ introduit une comparaison.
- source_word: בְּ/יַד
  choice: dans la main d’un
  rationale: La préposition בְּ avec יָד exprime ici concrètement la maîtrise ou la possession; le singulier hébreu est conservé.
- source_word: גִּבּוֹר
  choice: guerrier
  rationale: Dans l’image des flèches, גִּבּוֹר désigne naturellement un homme fort au combat; « guerrier » est précis et idiomatique.
- source_word: כֵּן
  choice: tels sont
  rationale: כֵּן introduit le second terme de la comparaison; « tels sont » préserve la structure proverbiale avec naturel.
- source_word: בְּנֵי
  choice: les fils
  rationale: Le nom est explicitement masculin pluriel. « Fils » conserve cette précision sans élargir silencieusement le sens à tous les enfants.
- source_word: הַ/נְּעוּרִים
  choice: que l’on a dans sa jeunesse
  rationale: נְעוּרִים désigne la jeunesse ou les jeunes années. Cette formulation rend naturellement en français la relation condensée « fils de la jeunesse » sans imposer davantage que le texte.
theological_decisions:
- issue: Portée genrée de בְּנֵי הַנְּעוּרִים
  choice: les fils que l’on a dans sa jeunesse
  alternative: les enfants nés dans la jeunesse
  rationale: L’hébreu emploie le masculin « fils », vraisemblablement significatif dans l’image sociale du psaume. La traduction conserve cette forme et n’introduit pas le terme plus large « enfants ».
- issue: Sens de la relation « fils de la jeunesse »
  choice: que l’on a dans sa jeunesse
  alternative: nés dans la jeunesse
  rationale: Le syntagme hébreu indique des fils associés aux jeunes années, généralement compris comme des fils nés à cette époque. « Que l’on a » reste naturel tout en évitant d’ajouter explicitement le verbe « naître », absent de l’hébreu.
translation_notes:
  register: Français moderne, courant et digne. La symétrie « Comme… tels… » maintient le caractère poétique et proverbial du verset; « l’on » convient au registre sans alourdir la phrase.
