source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: fr
  text: 'Chant des montées. De Salomon.[a]


    Si Yahvé ne bâtit la maison,[b]

    ceux qui la bâtissent travaillent en vain.

    Si Yahvé ne garde la ville,

    c’est en vain que le gardien veille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre « Pour Salomon » ou « appartenant à Salomon » : la suscription hébraïque peut indiquer l’auteur, une dédicace ou une association.'
    reason: alternative_reading
  - marker: b
    text: En hébreu, « maison » peut aussi désigner une maisonnée ou une dynastie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend naturellement le titre traditionnel des psaumes 120–134 sans préciser à tort s’il s’agit de marches, d’ascensions ou de pèlerinages.
- source_word: לִשְׁלֹמֹה
  choice: De Salomon
  rationale: Lecture naturelle de la suscription; une note conserve la polyvalence du לְ hébreu, qui peut signaler l’auteur, le destinataire, l’appartenance ou l’association.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: בַיִת
  choice: maison
  rationale: Sens concret requis par le parallèle avec ceux qui bâtissent, tout en signalant en note les sens plus larges possibles de maisonnée ou dynastie.
- source_word: שָׁקַד שׁוֹמֵר
  choice: le gardien veille
  rationale: Expression française concise qui restitue l’idée du gardien restant vigilant, avec une légère reprise lexicale de « garde » dans le membre parallèle.
theological_decisions:
- issue: Portée du mot « maison »
  choice: Conserver le sens concret « maison » dans le texte
  alternative: « maisonnée » ou « dynastie »
  rationale: Le contexte immédiat évoque l’activité des bâtisseurs, mais l’usage hébreu permet une résonance familiale ou dynastique qu’il convient de ne pas exclure.
- issue: Relation de Salomon au psaume
  choice: « De Salomon » avec note d’ambiguïté
  alternative: « Pour Salomon » ou « appartenant à Salomon »
  rationale: La préposition hébraïque ne permet pas de trancher avec certitude entre attribution, dédicace et association.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme des deux propositions conditionnelles est conservé, ainsi que la répétition de « en vain ». La formulation évite le calque redondant « travaillent en vain en elle » tout en rendant le pronom hébreu par « la ».
