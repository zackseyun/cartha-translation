  source_fidelity: Le texte rend fidèlement la suscription et les deux membres parallèles du verset. « Si Yahvé ne bâtit la maison » correspond à אִם־יְהוָה לֹא יִבְנֶה בַיִת; « ceux qui la bâtissent travaillent en vain » exprime correctement שָׁוְא עָמְלוּ בוֹנָיו בּוֹ sans alourdir le français par une reprise redondante de « en elle ». Le second parallèle, avec « garde la ville » et « le gardien veille », restitue exactement l’opposition entre la garde divine et la vigilance humaine vaine.
