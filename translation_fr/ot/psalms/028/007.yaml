base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: fr
  text: Yahweh est ma force et mon bouclier. En lui mon cœur a mis sa confiance, et j’ai été secouru. Aussi mon cœur exulte, et je le louerai par mon chant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je le remercierai » ou « je lui rendrai grâce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: עֻזִּי
  choice: ma force
  rationale: Rend directement עֹז et forme un parallélisme naturel avec « mon bouclier ».
- source_word: מָגִנִּי
  choice: mon bouclier
  rationale: Conserve l’image concrète et transparente de מָגֵן.
- source_word: בּוֹ בָטַח לִבִּי
  choice: En lui mon cœur a mis sa confiance
  rationale: Le parfait בָטַח est rendu comme un acte accompli de confiance; « mettre sa confiance en » est idiomatique en français et garde le cœur comme sujet.
- source_word: וְנֶעֱזָרְתִּי
  choice: et j’ai été secouru
  rationale: Préserve la valeur passive du nifal de עזר sans préciser au-delà du texte la manière dont le secours a été accordé.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: Alors mon cœur a exulté
  rationale: עלז exprime une joie intense; « exulter » conserve cette force, et « alors » marque naturellement la conséquence dans la suite verbale.
- source_word: וּמִשִּׁירִי
  choice: et par mon chant
  rationale: Le מִן indique ici vraisemblablement le moyen par lequel la louange est exprimée; « par mon chant » est naturel et proche de la construction hébraïque.
- source_word: אֲהוֹדֶנּוּ
  choice: je le louerai
  rationale: Le hifil de ידה peut désigner la louange ou l’action de grâce. Le contexte du chant favorise « louer », sans exclure la nuance de remerciement signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le conserve comme nom propre plutôt que de le remplacer par un titre.
- issue: Sens de אֲהוֹדֶנּוּ
  choice: je le louerai
  alternative: je le remercierai; je lui rendrai grâce
  rationale: Le verbe peut exprimer aussi bien la louange que la reconnaissance. Le chant favorise ici la louange, tandis que la note maintient l’autre lecture possible.
translation_notes:
  register: Français international moderne, poétique et digne. Les métaphores du cœur et du bouclier sont conservées. Les formes verbales accomplies sont rendues au passé composé, tandis que la dernière forme est rendue au futur.
