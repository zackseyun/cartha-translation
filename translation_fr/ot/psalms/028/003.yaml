  text: אַל תִּמְשְׁכֵ֣/נִי עִם רְשָׁעִים֮ וְ/עִם פֹּ֪עֲלֵ֫י אָ֥וֶן דֹּבְרֵ֣י שָׁ֭לוֹם עִם רֵֽעֵי/הֶ֑ם וְ֝/רָעָ֗ה בִּ/לְבָבָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: fr
  text: Ne m’entraîne pas avec les méchants[a], avec ceux qui font le mal, qui parlent de paix à leurs compagnons[b], alors que le mal est dans leur cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne me traîne pas avec les méchants ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à leurs amis » ou « à leur prochain ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: m’entraîne pas
  rationale: Le verbe משׁך exprime ici l’idée d’être tiré ou emporté avec d’autres, vraisemblablement vers le même sort. « Entraîner » garde cette force sans préciser davantage le mécanisme.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rendu courant dans les Psaumes pour désigner des personnes moralement mauvaises, et non seulement juridiquement coupables.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: Cette formulation naturelle et accessible conserve la valeur active du participe פֹּעֲלֵי.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: qui parlent de paix
  rationale: Ce choix préserve l’image hébraïque et le contraste entre les paroles pacifiques et le mal intérieur.
- source_word: רֵעֵיהֶם
  choice: leur prochain
  rationale: רֵעַ peut désigner un ami, un compagnon ou une autre personne avec laquelle on est en relation. « Prochain » convient au cadre relationnel sans supposer une amitié véritable.
- source_word: רָעָה
  choice: le mal
  rationale: Le terme désigne ici une disposition ou une intention mauvaise; le contexte du cœur en précise le caractère intérieur.
- source_word: בִּלְבָבָם
  choice: dans leur cœur
  rationale: Le singulier collectif est idiomatique en français et conserve le cœur comme siège de la pensée et de l’intention.
theological_decisions:
- issue: Nature de la requête du psalmiste concernant le sort des méchants
  choice: Une demande de ne pas être entraîné avec ceux qui font le mal, dans leur compagnie ou vers leur sort
  alternative: Une demande portant seulement sur le fait de ne pas imiter les méchants
  rationale: L’association de משׁך avec עִם indique le plus naturellement que le psalmiste ne veut pas être emporté avec eux. Comme l’hébreu ne nomme pas explicitement le jugement, la traduction ne l’ajoute pas.
translation_notes:
  register: Français moderne, clair et digne. « M’entraîne pas » est naturel tout en gardant l’idée d’un mouvement subi; « alors que » rend explicitement le contraste porté par la coordination hébraïque. Les deux occurrences de « mal » maintiennent le lien lexical et thématique du verset.
