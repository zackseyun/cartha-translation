id: PSA.28.8
reference: Psalms 28:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֥ה עֹֽז לָ֑/מוֹ וּ/מָ֘ע֤וֹז יְשׁוּע֖וֹת מְשִׁיח֣/וֹ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/008.yaml
  text: Yahweh is strength for them[b][a], and he is a stronghold of salvation for his anointed one.
translation:
  language: fr
  text: Yahweh est leur force ; il est une forteresse de salut[a] pour celui qu’il a oint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « une forteresse de délivrances » ; l’hébreu emploie ici un nom pluriel, qui peut évoquer des délivrances répétées ou de multiples actes de salut.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire « son oint » ou « son Messie ». Dans le contexte, l’expression désigne d’abord vraisemblablement le roi oint par Yahweh, sans exclure une portée messianique plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: עֹז
  choice: force
  rationale: Le nom désigne la force ou la puissance. « Leur force » rend naturellement en français la construction prédicative avec לָמוֹ, sans la confondre avec l’image distincte de la forteresse dans la proposition suivante.
- source_word: לָמוֹ
  choice: leur
  rationale: La forme pronominale est plurielle. « Leur force » en conserve le nombre et donne un français plus idiomatique que « une force pour eux ».
- source_word: מָעוֹז
  choice: forteresse
  rationale: Le terme évoque un lieu sûr et puissamment défendu. « Forteresse » maintient cette image concrète de protection.
- source_word: יְשׁוּעוֹת
  choice: salut
  rationale: Le pluriel hébreu peut évoquer des délivrances répétées ou multiples. Le singulier collectif « salut » est plus naturel en français dans cette construction, tandis que le pluriel littéral est signalé en note.
- source_word: מְשִׁיחוֹ
  choice: celui qu’il a oint
  rationale: Cette formulation descriptive rend le sens immédiat du terme dans le contexte royal sans en faire d’emblée le titre fixé « Messie » ; la résonance messianique reste ouverte en note.
- source_word: הוּא
  choice: il est
  rationale: Le pronom indépendant reprend Yahweh et porte la seconde affirmation. La ponctuation française suffit à donner à la phrase sa netteté sans ajouter une tournure emphatique lourde.
theological_decisions:
- issue: Faut-il rendre מְשִׁיחוֹ comme un titre (« son Messie ») ou comme une désignation descriptive ?
  choice: celui qu’il a oint
  alternative: son Messie
  rationale: Dans ce psaume, le mot désigne d’abord naturellement le roi consacré par onction. La traduction descriptive respecte ce contexte tout en laissant subsister, dans la note, la portée messianique possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche de la structure hébraïque tout en évitant le peu naturel « forteresse de délivrances » dans le texte principal. Les deux images distinctes, la force et la forteresse, sont conservées.
