source:
  edition: WLC
  text: שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַ/י בְּ/שַׁוְּעִ֣/י אֵלֶ֑י/ךָ בְּ/נָשְׂאִ֥/י יָ֝דַ֗/י אֶל דְּבִ֥יר קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: fr
  text: Entends la voix[a] de mes supplications[b] quand je crie vers toi, quand j’élève les mains vers ton saint sanctuaire intérieur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le son de mes supplications ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de mes appels à la compassion ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ton saint sanctuaire » ; le terme hébreu peut désigner plus précisément la partie la plus intérieure du sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Entends
  rationale: L’impératif qal adresse à Dieu une demande directe et pressante. « Entends » convient au registre de la prière et garde l’idée d’une écoute qui accueille la requête.
- source_word: קוֹל
  choice: la voix
  rationale: קוֹל peut désigner la voix ou le son. Avec des supplications personnelles, « la voix » est naturel et conserve l’expression concrète de l’hébreu.
- source_word: תַּחֲנוּנַי
  choice: mes supplications
  rationale: Le terme désigne des demandes instantes qui sollicitent faveur ou compassion. « Supplications » est précis, digne et intelligible en français moderne.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: quand je crie vers toi
  rationale: La préposition suivie de l’infinitif construit a ici une valeur temporelle. « Crier vers » conserve l’intensité et la direction de l’appel.
- source_word: בְּנָשְׂאִי יָדַי
  choice: quand j’élève les mains
  rationale: La tournure temporelle est rendue naturellement, et le geste corporel de la prière est conservé. En français, l’article défini avec une partie du corps est idiomatique malgré le suffixe possessif hébreu.
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: vers ton sanctuaire intérieur, le lieu saint
  rationale: דְּבִיר désigne plus précisément l’espace intérieur sacré du sanctuaire. Cette formulation garde la référence spatiale tout en rendant perceptible la sainteté exprimée par קָדְשֶׁךָ.
theological_decisions:
- issue: Référence cultuelle de דְּבִיר קָדְשֶׁךָ
  choice: ton sanctuaire intérieur, le lieu saint
  alternative: ton saint sanctuaire ; le lieu très saint de ton sanctuaire
  rationale: Le texte évoque la chambre sacrée intérieure associée à la présence de Dieu. La traduction retenue préserve cette image cultuelle sans imposer une identification doctrinale plus précise que le terme hébreu.
translation_notes:
  register: Français international moderne, au registre poétique et digne de la prière. Le parallélisme des deux propositions introduites par « quand » est conservé, ainsi que le geste concret des mains élevées.
