  source_fidelity: La traduction rend correctement l’impératif, la voix des supplications, les deux propositions temporelles et le geste de prière. Toutefois, « le lieu saint » ajoute une apposition absente de l’hébreu et tend à brouiller la désignation plus spécifique de דְּבִיר comme sanctuaire intérieur. La sainteté doit être conservée dans le texte principal.
  naturalness: « Entends la voix de mes supplications » et « quand je crie vers toi » conviennent au français poétique contemporain. « Ton saint sanctuaire intérieur » est une formulation naturelle et concise qui évite l’explication ajoutée dans le corps du verset.
  terminology: « Supplications » restitue bien תַּחֲנוּנַי. « Saint sanctuaire intérieur » rend à la fois קָדְשֶׁךָ et la spécificité spatiale de דְּבִיר, sans imposer l’équivalent interprétatif « lieu très saint ».
