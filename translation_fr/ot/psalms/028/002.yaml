    rationale: Dans « ton sanctuaire intérieur, le lieu saint », l’adjectif « saint » porte grammaticalement sur l’apposition ajoutée plutôt que directement sur le sanctuaire intérieur. Une formulation unifiée reflète mieux l’hébreu.
