  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: fr
  text: 'De David.[a]


    C’est vers toi, Yahvé, que je crie ;

    mon rocher, ne reste pas sourd à mon appel.[b]

    Si tu gardes le silence envers moi,

    je deviendrai semblable à ceux qui descendent dans la fosse.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule hébraïque peut aussi signifier « pour David » ou indiquer plus largement un lien avec David.
    reason: textual_ambiguity
  - marker: b
    text: 'Ou : « ne reste pas silencieux envers moi ». Le premier verbe peut exprimer le silence ou l’absence de réponse.'
    reason: lexical_alternative
  - marker: c
    text: Ici, « la fosse » peut désigner la tombe ou le séjour des morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut signaler l’auteur, l’appartenance, la dédicace ou le lien avec David. « De David » est une suscription française concise qui conserve une part de cette souplesse.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu comme un nom propre, dans sa forme française courante, plutôt que remplacé par un titre.
- source_word: תֶּחֱרַשׁ
  choice: reste pas sourd à mon appel
  rationale: Le verbe évoque le silence ou l’absence de réponse. Cette formulation naturelle distingue cette première demande du verbe suivant, également associé au silence, sans prétendre que Dieu serait incapable d’entendre.
- source_word: תֶּחֱשֶׁה
  choice: gardes le silence envers moi
  rationale: La traduction conserve explicitement l’image du silence divin et le parallélisme tendu avec la demande précédente.
- source_word: בּוֹר
  choice: fosse
  rationale: « Fosse » conserve l’image concrète du puits ou de la fosse tout en permettant, dans ce contexte, son emploi pour la tombe ou le séjour des morts.
theological_decisions:
- issue: Sens de la suscription לְדָוִד
  choice: De David
  alternative: Pour David / À David
  rationale: Le texte hébreu ne précise pas à lui seul la nature exacte du rapport avec David ; la note maintient cette ambiguïté.
- issue: Silence divin et absence de réponse
  choice: Distinguer « rester sourd à mon appel » et « garder le silence envers moi »
  alternative: Rendre les deux verbes par « garder le silence »
  rationale: Les deux verbes hébreux se recouvrent, mais ne sont pas identiques. La distinction française préserve la progression possible entre ne pas répondre à l’appel et demeurer silencieux, sans résoudre excessivement la nuance.
- issue: Portée funéraire de בור
  choice: Conserver l’image de la « fosse »
  alternative: Traduire directement par « tombe » ou « séjour des morts »
  rationale: Le terme peut désigner une fosse concrète et, par extension, la mort ou le domaine des morts. Le texte principal conserve l’image, et la note en indique la portée.
translation_notes:
  register: Français international moderne, poétique mais direct. La disposition en lignes respecte le mouvement de l’appel, de la supplication et de la conséquence redoutée. « C’est vers toi… que » donne un relief naturel à l’antéposition hébraïque, tandis que « mon rocher » conserve l’adresse métaphorique.
