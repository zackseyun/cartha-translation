  to: De David. C’est vers toi, Yahweh, que je crie ; mon rocher, ne sois pas sourd à mon appel[a], de peur que tu ne gardes le silence envers moi et que je ne devienne semblable à ceux qui descendent dans la fosse[b].
  rationale: La révision restitue la nuance appréhensive de פֶּן par « de peur que », tout en gardant la syntaxe française fluide et le parallélisme entre la surdité redoutée et le silence. Elle conserve les choix théologiques et lexicaux du projet, sans lever l’ambiguïté de « la fosse ».
