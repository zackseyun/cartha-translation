  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: fr
  text: De David. C’est vers toi, Yahweh, que je crie ; mon rocher, ne sois pas sourd à mon appel[a], de peur que tu ne gardes le silence envers moi et que je ne devienne semblable à ceux qui descendent dans la fosse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne garde pas le silence envers moi ». Le verbe peut exprimer la surdité ou le silence ; le texte principal le distingue du verbe « garder le silence » qui suit.'
    reason: lexical_alternative
  - marker: b
    text: La « fosse » peut désigner la tombe ou le domaine des morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres des psaumes peut indiquer l’auteur, l’appartenance, la destination ou le lien avec David. « De David » conserve cette relative ambiguïté sans imposer « par » ou « pour ».
- source_word: אֵלֶיךָ ... אֶקְרָא
  choice: C’est vers toi ... que je crie
  rationale: La tournure française met naturellement en relief la direction de l’appel. « Je crie » rend ici קרא comme une invocation pressante, sans ajouter de contenu à la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin יהוה, plutôt que substitution par un titre.
- source_word: צוּרִי
  choice: Mon rocher
  rationale: Préserve la métaphore concrète de Dieu comme appui stable et protecteur.
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: ne reste pas sourd à mon appel
  rationale: חרשׁ peut évoquer la surdité ou le silence. Ce rendu distingue le refus d’entendre du silence exprimé par le verbe חשה dans la proposition suivante; « à mon appel » explicite en français le référent immédiat sans modifier le sens.
- source_word: פֶּן־תֶּחֱשֶׁה מִמֶּנִּי
  choice: Si tu gardes le silence envers moi
  rationale: Dans ce contexte, פן introduit l’éventualité redoutée et sa conséquence. La construction conditionnelle est naturelle en français et maintient le rapport avec « je deviendrai ».
- source_word: וְנִמְשַׁלְתִּי
  choice: je deviendrai semblable à
  rationale: Le niphal de משל signifie ici devenir ou être rendu semblable. La formulation conserve l’idée d’assimilation sans suggérer nécessairement un jugement humain.
- source_word: עִם־יֹרְדֵי בוֹר
  choice: à ceux qui descendent dans la fosse
  rationale: Après « semblable », le français exige naturellement « à ». « La fosse » conserve l’image concrète tout en laissant ouverte sa portée funéraire.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le représente directement au lieu de lui substituer un titre.
- issue: Portée de בוֹר
  choice: la fosse
  alternative: la tombe / le séjour des morts
  rationale: '« La fosse » conserve l’image et son ambiguïté: elle peut désigner la tombe ou, par extension, le domaine des morts, sans identifier explicitement le terme au shéol.'
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif « Mon rocher » et l’image de la fosse sont conservés. La ponctuation répartit l’hébreu en phrases naturelles sans effacer l’enchaînement entre le silence redouté de Dieu et le sort du psalmiste.
