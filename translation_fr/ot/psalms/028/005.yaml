source:
  edition: WLC
  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: fr
  text: Car ils ne comprennent ni les œuvres de Yahweh ni l’œuvre de ses mains[a] ; il les démolira et ne les bâtira pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car ils ne prêtent pas attention aux œuvres de Yahweh ni à l’œuvre de ses mains. »'
    reason: Alternative lexicale pour לֹא יָבִינוּ אֶל, qui peut exprimer le fait de ne pas considérer ou de ne pas prendre en compte.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la demande de jugement formulée dans le contexte précédent, tout en gardant une articulation naturelle en français.
- source_word: לֹא יָבִינוּ אֶל
  choice: ils ne discernent ni
  rationale: Le verbe בין exprime ici l’intelligence ou le discernement orienté vers les actes de Dieu. « Discerner » conserve cette idée, tandis que la construction avec « ni… ni… » rend naturellement les deux compléments coordonnés.
- source_word: פְּעֻלֹּת
  choice: les œuvres
  rationale: Le pluriel désigne les actes accomplis par Yahweh. « Œuvres » convient au registre poétique et maintient le parallèle lexical avec l’expression suivante.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מַעֲשֵׂה יָדָיו
  choice: l’ouvrage de ses mains
  rationale: Cette formulation conserve le singulier hébreu, l’image des mains et le parallélisme avec « les œuvres ».
- source_word: יֶהֶרְסֵם
  choice: il les démolira
  rationale: Le verbe הרס évoque la démolition. Ce choix préserve l’image de construction qui structure l’antithèse avec le verbe suivant.
- source_word: וְלֹא יִבְנֵם
  choice: et ne les bâtira pas
  rationale: La traduction garde le verbe simple « bâtir », sans ajouter explicitement l’idée de reconstruction, et maintient l’opposition directe entre démolir et bâtir.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération préserve le nom propre et évite de le remplacer par un titre.
- issue: Nature de la faute reprochée
  choice: manque de discernement à l’égard des œuvres divines
  alternative: absence d’attention portée aux œuvres divines
  rationale: Le verbe בין désigne d’abord l’intelligence ou le discernement, mais la construction avec אֶל peut aussi suggérer le fait de considérer ou de prendre en compte. Le texte principal retient le sens cognitif sans exclure l’alternative, signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu entre « œuvres » et « ouvrage », puis l’antithèse architecturale entre « démolira » et « bâtira », sont volontairement conservés.
