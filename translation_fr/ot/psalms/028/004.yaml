  text: תֶּן לָ/הֶ֣ם כְּ/פָעֳלָ/ם֮ וּ/כְ/רֹ֪עַ מַֽעַלְלֵ֫י/הֶ֥ם כְּ/מַעֲשֵׂ֣ה יְ֭דֵי/הֶם תֵּ֣ן לָ/הֶ֑ם הָשֵׁ֖ב גְּמוּלָ֣/ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: fr
  text: Donne-leur selon leurs actes, selon la méchanceté de leurs actions ; donne-leur selon l’œuvre de leurs mains ; rends-leur leur rétribution.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּן
  choice: Donne-leur
  rationale: L’impératif de נתן adresse à Dieu une demande directe. « Donne-leur » en conserve la simplicité et la force, ainsi que sa répétition dans le verset.
- source_word: כְּפָעֳלָם
  choice: selon leurs actes
  rationale: פעל désigne ici l’action ou l’œuvre accomplie. Le pluriel français « actes » rend naturellement le singulier collectif hébreu.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: et selon la méchanceté de leurs agissements
  rationale: רֹעַ exprime le mal ou la méchanceté, tandis que מַעַלְלִים désigne des actes avec une coloration morale dans ce contexte. « Agissements » convient à cette nuance défavorable.
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: selon l’œuvre de leurs mains
  rationale: Cette formulation conserve l’image hébraïque des mains et le parallélisme du verset.
- source_word: הָשֵׁב גְּמוּלָם לָהֶם
  choice: fais retomber sur eux ce qu’ils méritent
  rationale: Le hiphil de שוב présente la rétribution comme revenant sur ses auteurs, et גְּמוּלָם désigne ce qui leur est rendu en retour. Cette formulation est claire en français moderne tout en gardant l’idée de juste rétribution.
theological_decisions:
- issue: Imprécation et rétribution divine
  choice: Le verset demeure une prière demandant à Dieu de rétribuer les coupables en proportion de leurs actes.
  alternative: Atténuer le passage en simple constat descriptif ou en demande générale de justice.
  rationale: Les impératifs répétés תֶּן, תֵּן et הָשֵׁב expriment sans ambiguïté une requête adressée à Dieu. La traduction en conserve la tension morale sans renforcer la violence du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme et l’image de « l’œuvre de leurs mains » sont conservés ; « agissements » porte la nuance morale négative du contexte.
