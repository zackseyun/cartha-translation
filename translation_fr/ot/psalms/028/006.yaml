  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: fr
  text: Béni soit Yahweh, car il a entendu la voix de mes supplications[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le son de mes supplications ». L’hébreu porte littéralement « la voix/le son de mes supplications » ; le dernier terme désigne des demandes pressantes de faveur ou de compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif employé comme acclamation appelle ici une formule de bénédiction; « Béni soit » est naturel, digne et fidèle à la valeur doxologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la bénédiction; « car » conserve clairement ce lien causal.
- source_word: שָׁמַע
  choice: il a entendu
  rationale: Le parfait présente l'écoute comme accomplie; le passé composé convient naturellement au contexte de louange.
- source_word: קוֹל
  choice: la voix de
  rationale: Le nom peut désigner le son ou la voix. Dans le contexte d'une prière personnelle, « la voix de » restitue l'expression hébraïque sans en effacer l'image.
- source_word: תַּחֲנוּנָי
  choice: mes supplications
  rationale: Le terme désigne des demandes instantes de faveur ou de compassion. « Supplications » en préserve l'intensité et reste intelligible en français biblique moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa translittération préserve le nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La formulation conserve le parallélisme conceptuel de l'hébreu et l'image littérale de la « voix » des supplications.
