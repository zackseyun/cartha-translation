id: PSA.28.9
reference: Psalms 28:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹשִׁ֤יעָ/ה אֶת עַמֶּ֗/ךָ וּ/בָרֵ֥ךְ אֶת נַחֲלָתֶ֑/ךָ וּֽ/רְעֵ֥/ם וְ֝/נַשְּׂאֵ֗/ם עַד הָ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: fr
  text: Sauve ton peuple et bénis ton héritage ; sois leur berger[a] et porte-les[b] à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nourris-les ». Le verbe hébreu peut désigner le fait de faire paître ou de nourrir un troupeau, mais aussi, plus largement, toute l’activité du berger.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « élève-les » ou « soutiens-les ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Sauve
  rationale: L’impératif de ישׁע s’adresse à Dieu. « Sauve » est direct, naturel et conserve toute la portée du terme sans l’expliciter excessivement.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: עַם avec le suffixe de deuxième personne du masculin singulier désigne le peuple qui appartient à Dieu. « Ton peuple » est clair et fidèle.
- source_word: בָרֵךְ
  choice: bénis
  rationale: L’impératif de ברך exprime ici une demande adressée à Dieu. « Bénis » en conserve simplement le sens et le registre liturgique.
- source_word: נַחֲלָתֶךָ
  choice: ton héritage
  rationale: נַחֲלָה peut désigner un héritage, un patrimoine ou une possession attribuée. « Ton héritage » maintient l’image selon laquelle le peuple appartient à Dieu.
- source_word: רְעֵם
  choice: sois leur berger
  rationale: L’impératif de רעה avec suffixe masculin pluriel évoque l’ensemble de l’activité du berger, et non seulement le fait de nourrir. Cette formulation est naturelle en français et préserve l’image pastorale.
- source_word: נַשְּׂאֵם
  choice: porte-les
  rationale: נשא peut signifier lever, porter ou soutenir. « Porte-les » convient au parallélisme avec l’image du berger tout en laissant ouverte la nuance précise.
- source_word: עַד הָעוֹלָם
  choice: à jamais
  rationale: L’expression indique une durée sans fin. « À jamais » est idiomatique, concise et adaptée au registre poétique du psaume.
theological_decisions:
- issue: Métaphore pastorale dans רְעֵם
  choice: sois leur berger
  alternative: nourris-les
  rationale: Le verbe peut inclure l’action de nourrir, mais il couvre plus largement la conduite et les soins du berger. Le choix retenu conserve cette image riche sans lui imposer une interprétation doctrinale ultérieure.
- issue: Identité du peuple comme נַחֲלָתֶךָ
  choice: ton héritage
  alternative: ceux qui t’appartiennent
  rationale: La formulation métaphorique présente le peuple comme l’héritage ou la possession attribuée à Dieu. La conserver respecte le langage d’alliance du texte sans l’aplatir.
- issue: Portée de נַשְּׂאֵם
  choice: porte-les
  alternative: élève-les / soutiens-les
  rationale: Le verbe hébreu admet plusieurs nuances liées au fait de lever ou de porter. « Porte-les » s’accorde naturellement avec les soins du berger, tandis qu’une note maintient visibles les autres possibilités.
translation_notes:
  register: Français moderne, sobre et poétique, avec tutoiement de Dieu conforme au registre biblique français courant. Le parallélisme hébreu et les métaphores de l’héritage et du berger sont conservés.
