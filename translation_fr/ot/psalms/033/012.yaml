  text: אַשְׁרֵ֣י הַ֭/גּוֹי אֲשֶׁר יְהוָ֣ה אֱלֹהָ֑י/ו הָ/עָ֓ם בָּחַ֖ר לְ/נַחֲלָ֣ה לֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/012.yaml
  text: Blessed is the nation whose God is Yahweh[b][a], the people he has chosen for his inheritance.
translation:
  language: fr
  text: Heureuse[a] est la nation qui a Yahweh pour Dieu, le peuple qu’il a choisi comme son héritage[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Bénie » ou « Bienheureuse ». Le terme hébreu décrit une condition enviable sous la faveur de Dieu, plutôt qu’un simple sentiment de bonheur.'
    reason: lexical_alternative
  - marker: b
    text: Le second membre vise probablement tout particulièrement Israël, peuple que Yahweh a choisi pour lui appartenir, mais l’hébreu dit simplement « le peuple ».
    reason: referent_clarification
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureuse
  rationale: Dans une béatitude, la forme idiomatique exprime une condition enviable accordée par Dieu, et non une simple émotion. « Heureuse » est naturel en français moderne tout en gardant le ton solennel du psaume.
- source_word: הַגּוֹי
  choice: la nation
  rationale: גּוֹי désigne ici une collectivité nationale et forme un parallélisme avec הָעָם, « le peuple ».
- source_word: אֲשֶׁר יְהוָה אֱלֹהָיו
  choice: qui a Yahweh pour Dieu
  rationale: Cette tournure française rend naturellement la relation possessive exprimée par אֱלֹהָיו, littéralement « dont Yahweh est son Dieu », sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: הָעָם
  choice: le peuple
  rationale: עָם évoque une communauté unie par son identité et maintient le parallélisme poétique avec « la nation ».
- source_word: בָּחַר
  choice: a choisi
  rationale: Le parfait hébreu présente le choix comme un acte accompli; le passé composé convient naturellement en français et laisse entendre son résultat durable.
- source_word: לְנַחֲלָה לוֹ
  choice: pour être son héritage
  rationale: Cette formulation exprime à la fois la destination marquée par לְ et l’appartenance indiquée par לוֹ, tout en conservant la portée d’allocation et de possession de נַחֲלָה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Yahvé
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en préserve le caractère de nom personnel sans lui substituer un titre.
- issue: Référent de « la nation » et « le peuple »
  choice: Conserver le parallélisme sans ajouter « Israël »
  alternative: Identifier explicitement la nation et le peuple à Israël
  rationale: Israël est très probablement visé, surtout par l’expression du peuple choisi comme héritage, mais le texte hébreu garde les termes poétiques généraux « nation » et « peuple ». La traduction ne résout donc pas cette tension par une précision absente du verset.
- issue: Sens de נַחֲלָה appliqué au peuple choisi
  choice: héritage
  alternative: possession ; patrimoine
  rationale: « Héritage » conserve l’image d’une part attribuée et appartenant à Yahweh, sans expliquer davantage la nature de cette appartenance.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « qui a Yahweh pour Dieu » évite un calque maladroit tout en restant proche de l’hébreu. L’exclamation restitue la force de la béatitude.
