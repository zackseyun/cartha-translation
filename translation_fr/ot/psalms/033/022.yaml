  yaml_path: translation/ot/psalms/033/022.yaml
  text: Let your steadfast love be upon us, O LORD, even as we hope in you.
translation:
  language: fr
  text: Que ton amour fidèle soit sur nous, SEIGNEUR, comme nous mettons notre espérance en toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד (ḥésèd)
  choice: amour fidèle
  rationale: Rend à la fois la bienveillance, la loyauté et la constance relationnelle exprimées par ce terme, sans le réduire à la seule bonté ou miséricorde.
- source_word: יְהוָה (YHWH)
  choice: SEIGNEUR
  rationale: Suit la convention française largement reconnue qui représente le nom divin par « SEIGNEUR » en petites capitales typographiques.
- source_word: יִחַלְנוּ (yiḥalnu)
  choice: nous mettons notre espérance
  rationale: Le verbe יחל exprime ici l’attente confiante; cette tournure est naturelle en français et conserve l’orientation personnelle marquée par « en toi ».
- source_word: כַּאֲשֶׁר (kaʾasher)
  choice: comme
  rationale: Préserve sobrement le rapport entre l’amour demandé et l’espérance placée en Dieu, sans trancher excessivement entre comparaison, correspondance et mesure.
theological_decisions:
- issue: Rapport entre l’amour fidèle de Dieu et l’espérance humaine
  choice: comme
  alternative: à la mesure de / puisque
  rationale: L’hébreu permet une relation de correspondance sans préciser nettement s’il s’agit d’une mesure ou d’un motif. « Comme » maintient cette tension sans faire de l’espérance humaine la cause explicite de l’amour divin.
translation_notes:
  register: Formulation brève, priante et digne, avec tutoiement conforme à l’adresse directe à Dieu. La syntaxe conserve le parallélisme simple et l’ambiguïté mesurée de l’hébreu.
