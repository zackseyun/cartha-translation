id: PSA.33.5
reference: Psalms 33:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֹ֭הֵב צְדָקָ֣ה וּ/מִשְׁפָּ֑ט חֶ֥סֶד יְ֝הוָ֗ה מָלְאָ֥ה הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: fr
  text: Il aime la justice et le droit ; la terre est remplie de l’amour fidèle[a] de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bonté fidèle ». Le mot hébreu חֶסֶד évoque un amour bienveillant, loyal et durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Il aime
  rationale: Le participe qal masculin singulier décrit ici de manière habituelle l’attitude de Yahweh. La forme verbale française est naturelle et conserve cette valeur descriptive.
- source_word: צְדָקָה
  choice: la justice
  rationale: Dans son association avec מִשְׁפָּט, le terme désigne la rectitude, ce qui est juste. « La justice » convient au registre du psaume sans faire double emploi exact avec « le droit ».
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Le mot évoque ici l’ordre juste et l’exercice de la justice. « Le droit » préserve la distinction avec צְדָקָה tout en formant une expression française naturelle.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: Cette expression réunit les idées d’amour, de bonté et de loyauté durable portées par חֶסֶד, sans réduire le terme à une seule nuance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: מָלְאָה
  choice: est remplie de
  rationale: 'Le parfait féminin singulier exprime ici un état présent résultant : la terre se trouve pleine de cet amour fidèle.'
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte cosmique du psaume favorise le sens universel de « terre » plutôt que celui, plus local, de « pays ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le Tétragramme. « Yahweh » conserve le caractère de nom propre, tandis que « le Seigneur » lui substituerait un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: bonté
  rationale: « Amour fidèle » maintient ensemble l’affection, la bienveillance et la loyauté durable du terme hébreu, sans imposer dans le corps du verset une explicitation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme concis de l’hébreu est conservé, avec « justice et droit » pour distinguer les deux termes associés. Le point-virgule marque les deux propositions du verset sans alourdir le rythme.
