  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: fr
  text: 'Car la parole de Yahweh est droite,

    et toute son œuvre est accomplie avec fidélité.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à louer qui précède, tout en gardant un enchaînement poétique naturel.
- source_word: יָשָׁר
  choice: droite
  rationale: Exprime ici la rectitude et la justesse de la parole divine; « droite » conserve aussi l’image hébraïque de ce qui est droit.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » convient à la déclaration ou à l’expression de Dieu dans ce contexte, tandis que « Yahweh » représente directement le nom divin.
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: et tout ce qu’il fait
  rationale: Rend naturellement en français le singulier collectif hébreu et maintient la portée exhaustive de כָּל.
- source_word: בֶּאֱמוּנָה
  choice: avec fidélité
  rationale: אֱמוּנָה désigne ici la constance, la fiabilité et la fidélité; cette formulation française restitue le nom hébreu sans réduire le sens à la seule sincérité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » conserve le nom propre et sa portée d’alliance.
- issue: Portée du singulier מַעֲשֵׂהוּ
  choice: tout ce qu’il fait
  alternative: toute son œuvre
  rationale: Le nom est morphologiquement singulier mais peut désigner collectivement l’ensemble de l’activité divine. La formulation retenue garde cette totalité dans un français plus naturel, sans décider entre une œuvre globale et chacun de ses actes.
- issue: Clause nominale בֶּאֱמוּנָה
  choice: il le fait avec fidélité
  alternative: est dans la fidélité
  rationale: L’hébreu ne comporte pas de verbe explicite dans la seconde proposition. Le français exige ici une explicitation; la répétition de « faire » exprime le sens sans transformer la fidélité en simple attribut abstrait de l’œuvre.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes. La seconde proposition privilégie une tournure idiomatique plutôt qu’un calque peu naturel de la clause nominale hébraïque.
