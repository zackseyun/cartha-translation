  text: הוֹד֣וּ לַ/יהוָ֣ה בְּ/כִנּ֑וֹר בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר זַמְּרוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/002.yaml
  text: Give thanks to Yahweh with the lyre[a]; make music to him with a ten-stringed harp.
translation:
  language: fr
  text: Rendez grâce à Yahweh avec la lyre ; jouez pour lui du nével à dix cordes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nével est un instrument à cordes hébreu dont l’identification exacte est incertaine ; on le traduit aussi par « harpe », « luth » ou « lyre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Célébrez
  rationale: L’impératif hiphil de ידה exprime ici l’action liturgique de rendre grâce et de louer. « Célébrez » est naturel en français dans un appel au culte et maintient ces deux nuances.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: בְּכִנּוֹר
  choice: au son de la lyre
  rationale: כִּנּוֹר désigne un instrument à cordes ancien généralement identifié comme une lyre ; « au son de » rend naturellement la valeur instrumentale de בְּ en français.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: sur la harpe à dix cordes
  rationale: נֵבֶל désigne un instrument à cordes dont l’identification précise reste incertaine, tandis que עָשׂוֹר indique qu’il comporte dix cordes. « Harpe » le distingue naturellement de la lyre du premier membre.
- source_word: זַמְּרוּ לוֹ
  choice: jouez pour lui
  rationale: Dans ce contexte où deux instruments sont explicitement nommés, זמר peut désigner l’exécution d’une musique de louange. « Jouez pour lui » conserve la référence instrumentale sans ajouter explicitement le chant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; employer « Yahweh » préserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée cultuelle de זמר
  choice: jouez pour lui
  alternative: chantez ses louanges
  rationale: La mention immédiate de la lyre et du נֵבֶל favorise ici le sens instrumental, tout en laissant au contexte du psaume la dimension de louange.
translation_notes:
  register: Français international moderne, digne et fluide. Le parallélisme impératif est conservé, avec un vocabulaire cultuel accessible et sans archaïsme.
