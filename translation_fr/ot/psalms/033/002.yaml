review_pass:
  verdict: revise
  source_fidelity: Le premier impératif הוֹדוּ désigne plus précisément l’action de rendre grâce que « célébrer », même si la louange est impliquée. Les deux compléments instrumentaux et le second impératif sont autrement bien rendus. Conserver « nével » dans le texte évite d’identifier de façon trop assurée un instrument ancien incertain.
  naturalness: « Rendez grâce à Yahweh avec la lyre ; jouez pour lui du nével à dix cordes » est idiomatique, digne et naturel en français international moderne. Le parallélisme des impératifs est maintenu.
  terminology: « Yahweh » correspond au tétragramme. « Lyre » est approprié pour kinnôr. La translittération « nével », accompagnée d’une note, est préférable à « harpe », car l’équivalence organologique exacte demeure incertaine. « Rendez grâce » reflète la valeur liturgique usuelle de הודו sans réduire le terme à une simple célébration.
  issues:
  - severity: medium
    issue: « Célébrez » atténue la nuance de gratitude de הוֹדוּ.
    rationale: Dans ce contexte liturgique, la forme hiphil de ידה signifie couramment « rendre grâce », avec la louange comme dimension associée. « Célébrer » est possible dans un sens large, mais moins exact.
  - severity: low
    issue: « Harpe » présente le nével comme identifié plus précisément que ne le permet le lexique.
    rationale: Le nével est bien un instrument à cordes, mais son identification moderne est disputée. Employer « nével » et expliquer l’incertitude en note préserve cette ambiguïté.
  revised_text: Rendez grâce à Yahweh avec la lyre ; jouez pour lui du nével à dix cordes[a].
