  source_fidelity: La première proposition rend fidèlement l’impératif pluriel שִׁירוּ, le datif לוֹ et l’expression psalmique שִׁיר חָדָשׁ. « Jouez avec talent » communique globalement הֵיטִיבוּ נַגֵּן, mais « jouez habilement » reproduit plus précisément l’idée d’une exécution soignée. Surtout, בִּתְרוּעָה exprime ici l’accompagnement (« avec »), non un cadre spatial ou situationnel (« au milieu de »).
  naturalness: « Chantez-lui un chant nouveau » est naturel dans un registre poétique moderne. « Jouez habilement, avec des cris de joie » est idiomatique, clair et conserve le parallélisme d’exhortations musicales et acclamatives.
  terminology: « Chant nouveau » préserve la formulation psalmique établie sans être archaïque. « Cris de joie » rend naturellement la valeur jubilatoire de תְּרוּעָה dans ce contexte tout en évitant d’imposer le sens instrumental de « sonnerie de trompette ». La note maintient explicitement cette possibilité lexicale contextuelle.
