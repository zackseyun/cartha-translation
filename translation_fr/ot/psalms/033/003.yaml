  text: שִֽׁירוּ ל֭/וֹ שִׁ֣יר חָדָ֑שׁ הֵיטִ֥יבוּ נַ֝גֵּ֗ן בִּ/תְרוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: fr
  text: Chantez-lui un chant nouveau ; jouez habilement, avec des cris de joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une joyeuse acclamation ». Le mot hébreu peut désigner un cri retentissant, une acclamation ou, dans certains contextes, une sonnerie de trompette.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel de שׁיר, verbe courant signifiant « chanter » ; l’impératif français est direct et naturel.
- source_word: לוֹ
  choice: lui
  rationale: 'Le ל préfixé avec suffixe masculin singulier indique ici le destinataire : le chant est adressé à Dieu.'
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Rend directement l’expression hébraïque tout en conservant sa résonance poétique et liturgique.
- source_word: הֵיטִיבוּ נַגֵּן
  choice: jouez avec talent
  rationale: הֵיטִיבוּ qualifie ici l’action musicale exprimée par נַגֵּן et appelle une exécution soignée ou habile. Cette formulation est idiomatique en français sans préciser indûment l’instrument.
- source_word: בִּתְרוּעָה
  choice: au milieu des cris de joie
  rationale: תְרוּעָה désigne une forte acclamation, un cri retentissant ou parfois une sonnerie. Dans ce contexte de louange, des cris jubilants conviennent le mieux, tandis que la préposition ב peut exprimer l’accompagnement ou les circonstances.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans לוֹ
  choice: Le pronom « lui » renvoie à Dieu, le SEIGNEUR, destinataire de la louange dans le contexte immédiat.
  alternative: Traduire explicitement « au SEIGNEUR ».
  rationale: Le référent est clair dans le contexte, mais conserver le pronom respecte la forme du verset sans ajouter le nom divin.
translation_notes:
  register: Français international moderne, poétique et digne. « Chant nouveau » conserve l’expression psalmique traditionnelle ; « jouez avec talent » reste accessible tout en exprimant l’habileté musicale. Le marqueur de note est placé après le segment qu’il précise.
