  text: לְ/הַצִּ֣יל מִ/מָּ֣וֶת נַפְשָׁ֑/ם וּ֝/לְ/חַיּוֹתָ֗/ם בָּ/רָעָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/019.yaml
  text: to deliver their soul from death and to keep them alive in famine[a].
translation:
  language: fr
  text: 'pour les arracher à la mort

    et les garder en vie durant la famine.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַצִּיל
  choice: arracher
  rationale: Le hifil de נצל exprime ici le fait de délivrer ou sauver. « Arracher à la mort » est une tournure française naturelle, concise et suffisamment poétique.
- source_word: מִמָּוֶת
  choice: à la mort
  rationale: 'Après « arracher », la préposition française « à » rend naturellement le מן séparatif de l’hébreu : ils sont soustraits à la mort.'
- source_word: נַפְשָׁם
  choice: les
  rationale: Dans ce contexte, נֶפֶשׁ désigne les personnes elles-mêmes ou leur vie. Le pronom « les » évite l’expression peu naturelle « leur âme » en français tout en conservant la référence personnelle; l’alternative explicite « leur vie » est signalée en note.
- source_word: וּלְחַיּוֹתָם
  choice: et les garder en vie
  rationale: L’infinitif piel de חיה signifie maintenir ou préserver en vie. Cette formulation actuelle rend clairement l’idée de conservation de la vie.
- source_word: בָּרָעָב
  choice: durant la famine
  rationale: רָעָב désigne ici une famine plutôt que la seule sensation de faim. « Durant » explicite naturellement la valeur circonstancielle de ב sans ajouter de contenu.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: Rendre le référent par « les » dans le texte et signaler « leur vie » en note
  alternative: « leur âme »
  rationale: Ici, le parallélisme avec le maintien en vie pendant la famine favorise le sens de personne ou de vie, sans imposer une distinction doctrinale entre âme et corps. La note préserve l’étendue sémantique du terme hébreu.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme de l’hébreu est conservé sur deux lignes; « arracher à la mort » et « garder en vie » forment un contraste clair et idiomatique.
