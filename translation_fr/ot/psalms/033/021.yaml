  text: כִּי ב֭/וֹ יִשְׂמַ֣ח לִבֵּ֑/נוּ כִּ֤י בְ/שֵׁ֖ם קָדְשׁ֣/וֹ בָטָֽחְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/021.yaml
  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: fr
  text: Car notre cœur[a] se réjouit[b] en lui, parce que nous avons mis notre confiance en son saint nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « notre cœur » au singulier, comme expression collective de la vie intérieure du peuple.
    reason: cultural_note
  - marker: b
    text: 'Ou : « se réjouira en lui », si l’inaccompli hébreu est compris comme un futur plutôt que comme l’expression d’une disposition présente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La première occurrence introduit la raison de l’affirmation précédente et s’intègre naturellement au mouvement poétique.
- source_word: בּוֹ
  choice: en lui
  rationale: Le suffixe masculin singulier renvoie, dans le contexte, au SEIGNEUR, sans que le nom divin soit répété dans ce verset.
- source_word: יִשְׂמַח
  choice: se réjouit
  rationale: L’inaccompli peut exprimer une disposition présente et habituelle; le futur reste possible et est signalé en note.
- source_word: לִבֵּנוּ
  choice: notre cœur
  rationale: Le singulier collectif hébreu est conservé; il présente la vie intérieure commune du peuple.
- source_word: כִּי
  choice: parce que
  rationale: La seconde occurrence énonce clairement le fondement de la joie.
- source_word: בְשֵׁם קָדְשׁוֹ
  choice: en son saint nom
  rationale: Avec le verbe de confiance, la préposition indique l’objet de celle-ci; « saint » rend directement la qualité exprimée par קֹדֶשׁ.
- source_word: בָטָחְנוּ
  choice: nous avons mis notre confiance
  rationale: Le parfait décrit une confiance effectivement placée, dont la portée demeure présente; cette tournure est idiomatique en français moderne.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans בּוֹ et קָדְשׁוֹ
  choice: Les pronoms renvoient au SEIGNEUR mentionné dans le contexte immédiat.
  alternative: Une référence plus générale à Dieu, sans lien explicite avec le nom d’alliance.
  rationale: Le contexte désigne à plusieurs reprises le SEIGNEUR. Toutefois, puisque son nom n’apparaît pas explicitement dans ce verset, la traduction conserve « lui » et « son » au lieu de l’ajouter.
- issue: Valeur temporelle de יִשְׂמַח
  choice: Présent exprimant une disposition actuelle ou habituelle.
  alternative: 'Futur de confiance: « se réjouira ».'
  rationale: La forme hébraïque permet les deux lectures. Le contexte confessionnel favorise le présent, tandis qu’une note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier collectif « notre cœur » est maintenu, et « mettre sa confiance en » rend idiomatiquement la force du parfait hébreu.
