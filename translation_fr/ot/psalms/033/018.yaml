  text: הִנֵּ֤ה עֵ֣ין יְ֭הוָה אֶל יְרֵאָ֑י/ו לַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/018.yaml
  text: Behold[a], the eye of Yahweh is on those who fear him, on those who wait for his steadfast love,
translation:
  language: fr
  text: Voici, l’œil de Yahweh veille sur ceux qui le craignent, sur ceux qui attendent son amour fidèle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui espèrent en son amour fidèle ». Le verbe hébreu peut exprimer à la fois l’attente et l’espérance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette particule attire l’attention et donne de l’emphase; « Voici » en conserve la force déictique et poétique dans un français biblique actuel.
- source_word: עֵין יְהוָה אֶל
  choice: l’œil de Yahweh veille sur
  rationale: Le nom concret « œil » préserve l’image anthropomorphique, tandis que « veille sur » exprime naturellement en français l’attention bienveillante indiquée par la préposition אֶל.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יְרֵאָיו
  choice: ceux qui le craignent
  rationale: Cette formulation naturelle conserve le langage biblique de la crainte révérencielle sans le réduire à la seule vénération.
- source_word: לַמְיַחֲלִים
  choice: ceux qui espèrent
  rationale: Le verbe יחל associe attente et espérance. Avec חֶסֶד comme objet, « espèrent en » exprime clairement l’attente confiante en français.
- source_word: לְחַסְדּוֹ
  choice: en son amour fidèle
  rationale: « Amour fidèle » rend la bienveillance durable et loyale de חֶסֶד sans la restreindre à la compassion; la préposition s’intègre naturellement à « espérer en ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le Tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: bonté; miséricorde; amour loyal
  rationale: « Amour fidèle » maintient ensemble l’amour bienveillant et la fidélité durable du terme, sans imposer une lecture confessionnelle particulière.
- issue: Nuance de יחל
  choice: espèrent
  alternative: attendent; attendent avec espérance
  rationale: Le verbe peut exprimer à la fois l’attente et l’espérance. Dans cette construction, « espèrent en » est idiomatique et conserve l’orientation confiante vers le חֶסֶד divin.
translation_notes:
  register: Français international moderne, digne et poétique. L’image de « l’œil » est conservée, mais l’expression littérale est rendue idiomatiquement par « veille sur ». Aucun marqueur de note n’est nécessaire puisque la nuance attente/espérance est représentée directement par « espèrent ».
