id: PSA.33.10
reference: Psalms 33:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְֽהוָ֗ה הֵפִ֥יר עֲצַת גּוֹיִ֑ם הֵ֝נִ֗יא מַחְשְׁב֥וֹת עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: fr
  text: Yahvé[a] réduit à néant le dessein des nations ; il fait échouer les projets des peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, nom divin également transcrit « Yahweh » ou « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et ses autres transcriptions usuelles.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel YHWH sous sa forme française courante, plutôt que de lui substituer le titre « le Seigneur ».
- source_word: הֵפִיר
  choice: réduit à néant
  rationale: Le hifil de פרר exprime ici l’action de rendre un dessein inopérant ou de l’annuler ; cette formulation française en restitue clairement la force.
- source_word: עֲצַת
  choice: le dessein
  rationale: עֵצָה peut désigner un conseil, un projet ou un dessein. « Dessein » convient à une intention collective et maintient une distinction poétique avec « projets » dans le second membre.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans ce contexte, le terme désigne largement les nations, sans imposer le sens religieux plus marqué de « païens ».
- source_word: הֵנִיא
  choice: fait échouer
  rationale: Le hifil de ניא signifie empêcher ou détourner de sorte qu’une intention n’aboutisse pas. « Fait échouer » est naturel et conserve le parallélisme verbal.
- source_word: מַחְשְׁבוֹת
  choice: les projets
  rationale: Bien que le mot puisse signifier « pensées » ou « intentions », son parallélisme avec עֲצַת favorise ici le sens de projets conçus par les peuples.
- source_word: עַמִּים
  choice: des peuples
  rationale: « Peuples » préserve la nuance lexicale par rapport à גּוֹיִם, rendu par « nations », ainsi que le parallélisme hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme YHWH. La transcription « Yahvé » conserve le nom personnel dans une forme française largement reconnue, sans le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme est conservé par les couples « dessein/projets » et « nations/peuples », tandis que les deux verbes expriment de façon naturelle l’annulation puis l’échec des intentions humaines.
