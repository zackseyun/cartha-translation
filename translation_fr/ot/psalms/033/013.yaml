  text: מִ֭/שָּׁמַיִם הִבִּ֣יט יְהוָ֑ה רָ֝אָ֗ה אֶֽת כָּל בְּנֵ֥י הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/013.yaml
  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: fr
  text: Du ciel, Yahvé regarde ; il voit tous les êtres humains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les fils de l’homme », expression poétique désignant l’ensemble des humains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: Du ciel
  rationale: La préposition מִן indique le point de départ ou le lieu depuis lequel on regarde. « Du ciel » est l’expression française naturelle et conserve le point de vue céleste.
- source_word: הִבִּיט
  choice: regarde
  rationale: Le hifil de נבט exprime un regard dirigé ou attentif. Le présent rend ici la valeur générale du parfait dans ce contexte poétique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du tétragramme conserve le nom divin personnel au lieu de lui substituer un titre.
- source_word: רָאָה
  choice: il voit
  rationale: ראה signifie couramment « voir ». Le présent s’accorde avec le parallélisme et exprime une réalité générale.
- source_word: כָּל בְּנֵי הָאָדָם
  choice: tous les êtres humains
  rationale: L’expression hébraïque littérale « tous les fils de l’homme » désigne collectivement l’ensemble des humains. La formulation choisie communique ce sens naturellement en français, tandis qu’une note préserve l’image hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahvé » en conserve la fonction de nom personnel et correspond à une forme bien établie en français.
- issue: Portée de בְּנֵי הָאָדָם
  choice: tous les êtres humains
  alternative: tous les fils de l’homme
  rationale: Dans ce pluriel collectif, l’expression hébraïque englobe l’humanité, et non uniquement les hommes de sexe masculin. Le sens inclusif est donc explicité dans le texte, sans effacer la forme littérale, signalée en note.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme des deux verbes (« regarde ; il voit ») est conservé, de même que leur valeur générale au présent.
