source:
  edition: WLC
  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: fr
  text: Que toute la terre craigne[a] Yahweh ! Que tous les habitants du monde tremblent devant lui !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que toute la terre redoute Yahweh ». Le verbe hébreu désigne une crainte qui peut être empreinte de révérence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִירְאוּ
  choice: Que ... craigne
  rationale: Le qal inaccompli à valeur exhortative se rend naturellement en français par « Que ... craigne ». « Craindre » conserve la gamme de sens allant de la crainte à la révérence empreinte d’effroi.
- source_word: מֵיְהוָה
  choice: craigne Yahweh
  rationale: Après ירא, la préposition מִן introduit ici l’objet de la crainte. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: Le parallèle avec « tous les habitants du monde » indique une portée universelle plutôt qu’un territoire particulier.
- source_word: מִמֶּנּוּ יָגוּרוּ
  choice: tremblent devant lui
  rationale: גור exprime ici l’effroi ou la crainte saisissante. « Trembler devant lui » est naturel, préserve l’intensité du terme et évite de répéter simplement « craindre ».
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: tous les habitants du monde
  rationale: Le participe construit יֹשְׁבֵי désigne ceux qui habitent, et תֵבֵל le monde habité. Cette formulation est claire et actuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
- issue: Nature de la crainte demandée
  choice: craindre / trembler devant
  alternative: révérer / être saisi d’admiration
  rationale: Les verbes hébreux peuvent inclure la révérence, mais ils gardent une réelle dimension de crainte et d’effroi qu’une traduction limitée à l’admiration atténuerait.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est maintenu par deux exhortations, tandis que « craindre » et « trembler devant » rendent les deux verbes distincts sans affaiblir leur intensité.
