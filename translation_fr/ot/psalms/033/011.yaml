id: PSA.33.11
reference: Psalms 33:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: fr
  text: Le dessein de Yahweh subsiste pour toujours[a], les projets de son cœur de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conseil » ou « projet » pour « dessein » ; « pensées » ou « intentions » pour « projets ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: dessein
  rationale: Le nom peut désigner le conseil, le projet ou le dessein. « Dessein » exprime ici à la fois la délibération et l’intention durable, tout en formant un parallèle naturel avec « projets ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin personnel employé dans le texte hébreu, sans le remplacer par un titre.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend naturellement en français la permanence durable indiquée par l’hébreu.
- source_word: תַּעֲמֹד
  choice: subsiste
  rationale: L’imparfait exprime ici une vérité générale et durable. Le présent « subsiste » communique à la fois la stabilité et la continuité.
- source_word: מַחְשְׁבוֹת
  choice: projets
  rationale: Le terme peut désigner des pensées, des intentions ou des plans. Dans ce parallélisme portant sur la volonté divine, « projets » rend clairement la nuance intentionnelle.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: La traduction littérale préserve l’image anthropologique hébraïque du cœur comme siège de la pensée et de la volonté.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette tournure française courante restitue l’idée de continuité à travers les générations successives.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre, sans adopter la forme française traditionnelle « Jéhovah ».
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu est conservé, de même que l’image du « cœur ». « Dessein » reste intelligible tout en portant une nuance plus solennelle que « plan ».
