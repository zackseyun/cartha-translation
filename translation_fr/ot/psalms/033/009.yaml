  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: fr
  text: Car il a parlé[a], et cela fut ; il a commandé[b], et cela se tint ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « cela arriva ». L’hébreu est très concis : « et ce fut » ; il peut aussi évoquer ce qui vint à l’existence.'
    reason: lexical_alternative
  - marker: b
    text: Ou « cela se tint debout » ou « cela fut établi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison de ce qui précède et conserve naturellement la valeur causale de l’hébreu.
- source_word: הוּא
  choice: il
  rationale: Le pronom indépendant souligne le sujet divin. En français, la construction parallèle avec « il » garde cette insistance sans lourdeur.
- source_word: אָמַר
  choice: a parlé
  rationale: Rend directement la parole divine dans un registre poétique digne ; « a dit » reste possible, mais paraît plus plat.
- source_word: וַיְהִי
  choice: la chose a été
  rationale: La formule hébraïque est extrêmement concise et signifie littéralement « et ce fut / cela advint ». « La chose a été » conserve cette concision et évite d’ajouter explicitement une notion de création qui demeure contextuelle.
- source_word: צִוָּה
  choice: a commandé
  rationale: Rend le plus directement l’acte de donner un ordre et maintient le parallélisme avec « a parlé ».
- source_word: וַיַּעֲמֹד
  choice: elle s’est tenue ferme
  rationale: Préserve l’image concrète de עמד, « se tenir, rester debout », tout en exprimant la stabilité résultant du commandement.
theological_decisions:
- issue: Efficacité de la parole et du commandement divins
  choice: « la chose a été » puis « elle s’est tenue ferme »
  alternative: « elle est venue à l’existence » puis « elle a été établie »
  rationale: Le texte affirme avec force le résultat immédiat et durable de la parole divine, mais sa formulation poétique reste concise. La traduction choisie conserve cette tension sans développer une formulation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est maintenu, ainsi que la concision des deux propositions de résultat. Les antécédents implicites de l’hébreu sont rendus par « la chose » puis « elle », sans préciser davantage ce qui vient à être.
