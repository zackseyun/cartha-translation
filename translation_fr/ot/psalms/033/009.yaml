  source_fidelity: 'Le parallélisme est bien compris : אָמַר / צִוָּה (« a parlé / a commandé ») introduisent deux résultats, וַיְהִי (« ce fut / cela vint à être ») et וַיַּעֲמֹד (« cela se tint / tint ferme »). La formulation proposée « la chose a été » ne rend toutefois pas idiomatiquement וַיְהִי en français.'
  naturalness: '« La chose a été » est une tournure inachevée et peu naturelle en français moderne : avec « être », un attribut est normalement attendu. « Cela fut » est une formulation poétique, concise et claire dans ce contexte psalmique. « Cela se tint ferme » conserve l’image de la station et la stabilité exprimée par le second verbe.'
  terminology: Aucun terme théologique spécialisé n’est en jeu. « Car », « a parlé » et « a commandé » conviennent au registre poétique et à la relation causale du contexte.
