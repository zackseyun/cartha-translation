source:
  edition: WLC
  text: בִּ/דְבַ֣ר יְ֭הוָה שָׁמַ֣יִם נַעֲשׂ֑וּ וּ/בְ/ר֥וּחַ פִּ֝֗י/ו כָּל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: fr
  text: 'Par la parole de Yahvé, les cieux ont été faits,

    et par le souffle[a] de sa bouche, toute leur armée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par l’esprit de sa bouche ». Le mot hébreu peut signifier « souffle », « vent » ou « esprit » selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: Par la parole de
  rationale: 'La préposition בְּ a ici une valeur instrumentale : les cieux ont été faits au moyen de la parole divine. « Par la parole de » est naturel en français et conserve cette valeur.'
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » transcrit en français moderne le nom divin יהוה au lieu de lui substituer un titre comme « le Seigneur ».
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français correspond à la forme hébraïque et convient au contexte de la création de l'ensemble céleste.
- source_word: נַעֲשׂוּ
  choice: ont été faits
  rationale: Le passif de עשה signifie ici « être fait ». Cette traduction évite de renforcer le verbe en employant « créer », qui correspondrait plus directement à un autre lexème hébreu.
- source_word: וּבְרוּחַ
  choice: et par le souffle
  rationale: רוּחַ peut désigner le souffle, le vent ou l'esprit. Le parallèle avec « de sa bouche » favorise ici « souffle », sans exclure l'autre lecture signalée en note.
- source_word: פִּיו
  choice: de sa bouche
  rationale: La traduction littérale conserve l'image poétique et le parallélisme entre la parole et le souffle venant de la bouche de Dieu.
- source_word: כָּל־צְבָאָם
  choice: toute leur armée
  rationale: צָבָא désigne ici l'ensemble organisé qui peuple les cieux, notamment les astres. « Toute leur armée » conserve l'image collective et le suffixe pluriel renvoyant aux cieux.
theological_decisions:
- issue: Le sens de רוּחַ dans le récit poétique de la création et son éventuelle résonance avec l'Esprit de Dieu
  choice: souffle
  alternative: Esprit
  rationale: La mention immédiate de la bouche favorise l'image du souffle qui porte la parole. La note maintient néanmoins la possibilité lexicale et théologique d'« Esprit », sans imposer au texte une précision personnelle qu'il n'exprime pas sans ambiguïté.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme des deux propositions est conservé. « Armée » garde l'image hébraïque traditionnelle de la multitude céleste, tandis que la note préserve l'ambiguïté de רוּחַ.
