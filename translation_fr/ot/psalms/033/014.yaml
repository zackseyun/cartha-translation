id: PSA.33.14
reference: Psalms 33:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: fr
  text: Du lieu où il demeure, il observe attentivement tous les habitants de la terre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il porte son regard sur » ou « il veille sur ». Le verbe hébreu évoque une observation attentive.
    reason: lexical_alternative
  - marker: b
    text: Ou « du pays », si le terme est compris dans un sens régional ; le contexte favorise ici « de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: Du lieu
  rationale: מָכוֹן désigne ici un lieu établi. « Du lieu » est naturel en français et s’accorde avec le complément « où il demeure ».
- source_word: שִׁבְתּוֹ
  choice: où il demeure
  rationale: La forme issue de ישׁב avec suffixe signifie « sa demeure » ou « le lieu où il siège ». La tournure relative rend naturellement la relation avec מִמְּכוֹן sans ajouter de précision doctrinale.
- source_word: הִשְׁגִּיחַ
  choice: il observe attentivement
  rationale: Le hiphil de שׁגח exprime un regard dirigé et attentif, éventuellement depuis les hauteurs. « Observe attentivement » conserve cette nuance mieux que le simple « regarde ».
- source_word: אֶל
  choice: '[relation exprimée par le complément direct de « observe »]'
  rationale: Avec un verbe de regard, אֶל marque l’orientation vers son objet. En français, « observer » se construit naturellement sans préposition.
- source_word: כָּל
  choice: tous
  rationale: כָּל a ici une valeur globale portant sur le pluriel « habitants ».
- source_word: יֹשְׁבֵי
  choice: les habitants
  rationale: Le participe substantivé de ישׁב signifie littéralement « ceux qui habitent ». « Les habitants » est la formulation française idiomatique correspondante.
- source_word: הָאָרֶץ
  choice: de la terre
  rationale: Dans le contexte universel du psaume, הָאָרֶץ désigne vraisemblablement la terre entière, tout en pouvant lexicalement signifier « le pays ».
theological_decisions:
- issue: Étendue du regard divin
  choice: 'Portée universelle : Dieu observe tous les habitants de la terre.'
  alternative: 'Portée régionale : les habitants du pays.'
  rationale: Le contexte du psaume, notamment la référence globale aux êtres humains, favorise « la terre ». Une note conserve néanmoins l’autre sens possible de הָאָרֶץ.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’hébreu tout en étant naturelle ; « observe attentivement » explicite la nuance lexicale du verbe sans transformer l’observation en intervention.
