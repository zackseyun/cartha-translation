source:
  edition: WLC
  text: הַ/יֹּצֵ֣ר יַ֣חַד לִבָּ֑/ם הַ֝/מֵּבִ֗ין אֶל כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/015.yaml
  text: the one who forms the hearts of them all[a], who understands all their deeds.
translation:
  language: fr
  text: celui qui façonne le cœur de chacun d’eux[a] et comprend tous leurs actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui façonne ensemble leurs cœurs ». Le terme hébreu peut signifier « ensemble » ou souligner ici qu’il façonne le cœur de chacun d’eux.
    reason: alternative lexicale
lexical_decisions:
- source_word: הַיֹּצֵר
  choice: celui qui façonne
  rationale: Le participe qal substantivé décrit Dieu par son activité caractéristique. « Façonne » conserve l’image du potier portée par יצר et reste naturel en français.
- source_word: יַחַד לִבָּם
  choice: le cœur de tous
  rationale: Cette formulation rend le singulier hébreu לִבָּם tout en comprenant יַחַד comme indiquant la totalité des personnes concernées. Elle évite de suggérer que tous partageraient littéralement un seul cœur.
- source_word: הַמֵּבִין
  choice: comprend
  rationale: Le participe hiphil de בין exprime ici la compréhension ou le discernement. « Comprend » est clair, direct et maintient le parallélisme avec « façonne ».
- source_word: אֶל כָּל מַעֲשֵׂיהֶם
  choice: tous leurs actes
  rationale: Avec בין, אֶל introduit ce vers quoi se porte la compréhension et n’a pas besoin d’être traduit séparément en français. « Actes » rend concrètement מַעֲשִׂים sans atténuer la portée morale possible.
theological_decisions:
- issue: Étendue du groupe visé
  choice: « tous » renvoie largement à l’ensemble des humains mentionnés dans le contexte.
  alternative: Limiter le propos aux rois ou aux nations évoqués dans les versets voisins.
  rationale: Les versets 13 à 15 parlent de tous les fils des hommes et de tous les habitants de la terre. La traduction conserve cette portée générale sans préciser davantage ce que le texte ne précise pas.
- issue: Rapport entre la formation des cœurs et les actes humains
  choice: Juxtaposer la formation divine du cœur et la compréhension divine des actes sans expliciter leur rapport causal.
  alternative: Formuler le verset de manière à affirmer que Dieu détermine directement tous les actes humains.
  rationale: Le texte affirme les deux réalités en parallèle, mais ne définit pas ici le rapport exact entre elles. La traduction préserve cette tension.
translation_notes:
  register: Français moderne, sobre et digne. La structure participiale est rendue par deux relatives coordonnées. La minuscule initiale convient au fragment fourni, qui poursuit syntaxiquement le verset précédent.
