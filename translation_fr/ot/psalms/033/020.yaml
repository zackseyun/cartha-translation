  text: נַ֭פְשֵׁ/נוּ חִכְּתָ֣ה לַֽ/יהוָ֑ה עֶזְרֵ֖/נוּ וּ/מָגִנֵּ֣/נוּ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/020.yaml
  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: fr
  text: Notre âme[a] attend Yahweh ; il est notre secours et notre bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « âme » désigne collectivement tout l’être de la communauté, et non seulement une partie immatérielle.
    reason: Précision lexicale sur l’emploi collectif de נֶפֶשׁ et ancrage sur le terme expliqué.
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Notre âme
  rationale: Le singulier נֶפֶשׁ avec suffixe de première personne du pluriel désigne ici, de manière collective, l’être tout entier de la communauté. « Notre âme » conserve l’image poétique hébraïque sans la réduire à une partie immatérielle de l’être humain.
- source_word: חִכְּתָה
  choice: attend
  rationale: חכה exprime une attente confiante et tournée vers l’avenir. Le présent français convient au caractère poétique et actuel de l’énoncé, sans imposer la valeur accomplie que suggérerait « a attendu ».
- source_word: לַיהוָה
  choice: Yahweh
  rationale: La préposition ל marque ici celui vers qui se porte l’attente ; en français, le verbe « attendre » se construit directement avec son objet. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: עֶזְרֵנוּ
  choice: notre secours
  rationale: עֵזֶר signifie « aide, secours ». « Notre secours » préserve le nom abstrait hébreu et s’insère naturellement dans la proposition nominale.
- source_word: וּמָגִנֵּנוּ
  choice: et notre bouclier
  rationale: מָגֵן désigne littéralement un bouclier. Cette métaphore de protection reste claire en français et doit être conservée.
- source_word: הוּא
  choice: il est
  rationale: Le pronom indépendant הוּא met le sujet en relief dans la proposition sans verbe. Le français exige ici la copule « est » ; il n’est pas nécessaire d’ajouter « lui seul », qui expliciterait davantage que l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme יהוה. « Yahweh » préserve sa fonction de nom propre et suit la décision terminologique fournie, sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, poétique et digne. La structure parallèle et les images concrètes de l’hébreu sont conservées. Une espace insécable avant le point-virgule est conforme à la typographie française.
