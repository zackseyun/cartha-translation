source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: fr
  text: Le roi n’est pas sauvé par une grande armée[a] ; le guerrier[b] n’est pas délivré par une grande force.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par une grande puissance » ; le mot hébreu traduit par « armée » peut aussi désigner la force ou, plus largement, les ressources militaires.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’homme vaillant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: n’est pas
  rationale: Avec le sujet défini et le participe qui suivent, cette négation se rend naturellement en français par « n’est pas ».
- source_word: הַמֶּלֶךְ
  choice: Le roi
  rationale: L’article défini hébreu est conservé ; le singulier défini exprime ici une vérité générale.
- source_word: נוֹשָׁע
  choice: sauvé
  rationale: Le participe nifal de ישׁע signifie être sauvé ou délivré ; « sauvé » conserve le vocabulaire biblique usuel sans effacer le contexte militaire.
- source_word: בְּרָב חָיִל
  choice: par une grande armée
  rationale: La préposition indique ici le moyen, et חַיִל peut désigner une force militaire ; « grande armée » convient au contexte royal et au parallélisme.
- source_word: גִּבּוֹר
  choice: le guerrier
  rationale: Le terme désigne un homme fort ou vaillant, souvent au combat ; « guerrier » est naturel et précis dans ce contexte.
- source_word: יִנָּצֵל
  choice: n’est pas délivré
  rationale: Le nifal de נצל exprime le fait d’être délivré, secouru ou arraché au danger ; ce choix maintient le parallélisme tout en variant le vocabulaire.
- source_word: בְּרָב כֹּחַ
  choice: par une grande force
  rationale: כֹּחַ désigne la force ou la puissance ; « grande force » restitue l’idée d’une force abondante employée comme moyen.
theological_decisions: []
