id: PSA.33.17
reference: Psalms 33:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֶׁ֣קֶר הַ֭/סּוּס לִ/תְשׁוּעָ֑ה וּ/בְ/רֹ֥ב חֵ֝יל֗/וֹ לֹ֣א יְמַלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: fr
  text: Le cheval est un espoir trompeur pour la délivrance[a][b] ; malgré toute sa force, il ne peut sauver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Le cheval est mensonge pour la délivrance ». L’expression hébraïque, très concise, signifie que le cheval se révèle trompeur ou vain comme moyen de délivrance.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « délivrance » peut aussi signifier « salut » ou « victoire », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: un espoir trompeur
  rationale: Le nom désigne la fausseté ou la tromperie. Dans cette construction concise, « un espoir trompeur » exprime naturellement en français que le cheval déçoit celui qui compte sur lui.
- source_word: הַסּוּס
  choice: le cheval
  rationale: L’article hébreu et la portée proverbiale permettent le singulier générique français « le cheval », qui représente ici les chevaux de guerre en général.
- source_word: לִתְשׁוּעָה
  choice: pour la délivrance
  rationale: Le terme peut désigner le salut, la délivrance ou la victoire. Le contexte militaire favorise « délivrance », sans exclure les autres nuances.
- source_word: וּבְרֹב חֵילוֹ
  choice: malgré toute sa force
  rationale: L’expression signifie littéralement « dans/par l’abondance de sa force ». Dans le contexte négatif, « malgré toute sa force » rend clairement la circonstance concessive suggérée, tout en conservant l’idée de grande puissance.
- source_word: לֹא יְמַלֵּט
  choice: il ne peut sauver
  rationale: Le piel de מלט signifie faire échapper, délivrer ou sauver. « Il ne peut sauver » exprime ici l’inefficacité du cheval comme moyen de secours, plutôt qu’une simple prédiction future.
theological_decisions:
- issue: Portée de תְּשׁוּעָה
  choice: délivrance
  alternative: salut ou victoire
  rationale: Le cadre évoque la puissance militaire du cheval ; « délivrance » convient donc directement, tandis qu’une note préserve l’étendue sémantique du terme sans imposer une lecture exclusivement spirituelle ou militaire.
translation_notes:
  register: Français international moderne, sobre et proverbial. Le parallélisme est conservé, avec une formulation naturelle et digne. « Malgré toute sa force » explicite la valeur concessive du second membre sans atténuer l’affirmation selon laquelle la puissance militaire ne garantit pas le salut.
