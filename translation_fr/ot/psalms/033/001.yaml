  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: fr
  text: Vous les justes, poussez des cris de joie en Yahweh[a] ! La louange convient à ceux qui sont droits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Chantez de joie en Yahweh. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « La louange est belle pour ceux qui sont droits » ou « La louange sied à ceux qui sont droits. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: Poussez des cris de joie
  rationale: L’impératif pluriel exprime une manifestation vocale et exubérante de joie. Cette formulation en conserve la force, tandis que « chantez de joie » demeure possible.
- source_word: צַדִּיקִים
  choice: vous qui êtes justes
  rationale: L’adjectif substantivé a ici une valeur vocative. Cette tournure rend explicitement et naturellement l’adresse aux justes.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: 'La préposition ב peut indiquer ici la sphère ou l’objet de la joie : la joie trouve son objet et son fondement en Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que remplacé par un titre.
- source_word: לַיְשָׁרִים
  choice: aux hommes droits
  rationale: 'La préposition ל exprime ici le rapport de convenance : la louange est appropriée à ceux qui sont droits.'
- source_word: נָאוָה
  choice: convient
  rationale: Le terme désigne ce qui est approprié, digne ou beau. « Convient » exprime clairement l’idée de convenance dans un français actuel.
- source_word: תְהִלָּה
  choice: la louange
  rationale: Le nom désigne la louange ou son expression. Le sens général est conservé sans préciser indûment qu’il s’agit d’un chant.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, naturel et digne. L’exclamation restitue l’élan de l’impératif hébreu ; la seconde proposition garde la formulation générale et sentencieuse de l’original.
