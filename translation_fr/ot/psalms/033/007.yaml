  text: כֹּנֵ֣ס כַּ֭/נֵּד מֵ֣י הַ/יָּ֑ם נֹתֵ֖ן בְּ/אֹצָר֣וֹת תְּהוֹמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/007.yaml
  text: He gathers the waters of the sea like a heap[b][a]; he puts the depths in storehouses.
translation:
  language: fr
  text: Il rassemble les eaux de la mer comme un monceau[a] ; il met les profondeurs dans des dépôts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une masse amoncelée » ; certains comprennent « comme un mur », en rapprochant cette image d’autres passages où les eaux se dressent.
    reason: lexical_alternative
  - marker: b
    text: Ou « les abîmes » ou « les eaux profondes ». Le pluriel hébreu peut désigner les grandes profondeurs de la mer ou les eaux de l’abîme primordial. « Dépôts » peut aussi se traduire par « trésors » ou « entrepôts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: Il rassemble
  rationale: Le participe qal de כנס décrit Dieu en train de réunir ou d’amasser. Le présent français restitue naturellement la valeur descriptive du participe dans ce contexte poétique.
- source_word: כַּנֵּד
  choice: comme un monceau
  rationale: נֵד désigne une masse amoncelée, notamment à propos des eaux. « Monceau » conserve l’image concrète et poétique ; « mur » demeure une interprétation contextuelle possible.
- source_word: מֵי הַיָּם
  choice: les eaux de la mer
  rationale: Cette formulation suit directement le groupe construit hébreu tout en étant naturelle en français.
- source_word: נֹתֵן
  choice: il met
  rationale: Le participe qal de נתן a un sens large. « Il met » est simple et maintient le parallélisme verbal avec « il rassemble ».
- source_word: בְּאֹצָרוֹת
  choice: dans des réserves
  rationale: אֹצָר désigne un lieu où l’on entrepose ou conserve quelque chose. « Réserves » rend clairement l’image cosmologique sans suggérer principalement des richesses monétaires, comme pourrait le faire « trésors ».
- source_word: תְּהוֹמוֹת
  choice: les profondeurs
  rationale: Le pluriel de תְּהוֹם évoque les profondeurs océaniques ou les eaux profondes primordiales. « Les profondeurs » est idiomatique et conserve la portée de l’image.
theological_decisions:
- issue: Imagerie cosmologique de la souveraineté de Dieu sur les eaux
  choice: Conserver les images concrètes du monceau et des réserves.
  alternative: 'Paraphraser : « Il maîtrise la mer » ou « il retient les océans ».'
  rationale: Le texte exprime la souveraineté divine au moyen d’images poétiques précises. Les remplacer par une abstraction effacerait une partie de sa force et imposerait une explication.
translation_notes:
  register: Français international moderne, sobre et poétique. « Monceau » est légèrement soutenu mais reste intelligible et rend mieux l’image de נֵד que le plus abstrait « amas ». Les deux marqueurs de note figurent dans le texte, placés auprès des expressions concernées.
