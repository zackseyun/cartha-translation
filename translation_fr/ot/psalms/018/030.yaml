id: PSA.18.30
reference: Psalms 18:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָ/אֵל֮ תָּמִ֪ים דַּ֫רְכּ֥/וֹ אִמְרַֽת יְהוָ֥ה צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לְ/כֹ֤ל הַ/חֹסִ֬ים בּֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/030.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is refined[b]; he is a shield to all who take refuge in him.
translation:
  language: fr
  text: Quant à Dieu, sa voie est sans défaut ; la parole de Yahweh est passée au creuset[a] ; il est un bouclier pour tous ceux qui trouvent refuge en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éprouvée » ou « purifiée ». L’hébreu évoque un métal affiné au feu et souligne ainsi la pureté avérée de la parole de Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui mettent leur confiance en lui ». Plus littéralement, l’hébreu parle de ceux qui trouvent refuge en lui, en accord avec l’image du bouclier protecteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Quant à Dieu
  rationale: L’article et la position initiale donnent à l’expression une valeur thématique que « Quant à Dieu » restitue naturellement.
- source_word: תָּמִים
  choice: sans défaut
  rationale: Le terme exprime ici l’intégrité, la plénitude et l’absence de défaut de la manière d’agir de Dieu, sans suggérer une simple perfection technique.
- source_word: דַּרְכּוֹ
  choice: sa voie
  rationale: « Voie » conserve l’image hébraïque tout en désignant naturellement la manière d’agir de Dieu.
- source_word: אִמְרַת יְהוָה
  choice: la parole de Yahweh
  rationale: אִמְרָה désigne une parole ou une déclaration ; le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: צְרוּפָה
  choice: passée au creuset
  rationale: 'Cette expression française conserve l’image métallurgique du verbe צרף : une matière affinée et dont la pureté a ainsi été éprouvée.'
- source_word: מָגֵן
  choice: un bouclier
  rationale: La traduction directe maintient l’image concrète de la protection divine.
- source_word: הַחֹסִים בּוֹ
  choice: ceux qui trouvent refuge en lui
  rationale: Le verbe חסה évoque le fait de chercher ou de trouver un abri protecteur ; la confiance est impliquée sans remplacer l’image.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le tétragramme, nom personnel du Dieu d’Israël. « Yahweh » le translittère au lieu de lui substituer un titre.
- issue: Portée de תָּמִים appliqué à la voie de Dieu
  choice: sans défaut
  alternative: parfaite ; irréprochable
  rationale: « Sans défaut » garde ensemble l’idée de totalité et d’intégrité sans réduire le terme à une catégorie morale humaine.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique et les images concrètes de la voie, du creuset, du bouclier et du refuge sont conservées sans archaïsme.
