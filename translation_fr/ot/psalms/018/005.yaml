  text: חֶבְלֵ֣י שְׁא֣וֹל סְבָב֑וּ/נִי קִ֝דְּמ֗וּ/נִי מ֣וֹקְשֵׁי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/005.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: fr
  text: Les cordes du shéol[a] m’ont entouré ; les pièges de la mort se sont dressés devant moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la tombe » ou « du séjour des morts » pour « shéol ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sont venus à ma rencontre » ou « m’ont affronté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: les liens de
  rationale: Le nom désigne ici des cordes ou des liens, dans une image poétique d’entrave. « Liens » est naturel en français et conserve la métaphore sans introduire celle des douleurs de l’enfantement.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération préserve l’étendue du concept hébreu et évite de le réduire à la tombe ou de lui imposer une conception ultérieure de l’au-delà.
- source_word: סְבָבוּנִי
  choice: m’entouraient
  rationale: Le verbe signifie entourer ou encercler. L’imparfait restitue naturellement, dans ce récit poétique, la situation menaçante évoquée.
- source_word: קִדְּמוּנִי
  choice: se dressaient devant moi
  rationale: Le verbe exprime l’idée de venir au-devant de quelqu’un ou de le rencontrer. Dans ce contexte hostile, cette formulation garde l’image spatiale et rend clairement la menace.
- source_word: מוֹקְשֵׁי
  choice: les pièges de
  rationale: Le terme désigne des pièges ou des traquenards. « Pièges » est actuel, clair et convient au parallélisme avec les liens.
- source_word: מָוֶת
  choice: la mort
  rationale: Équivalent français habituel, qui conserve ici la force menaçante et presque personnifiée de la mort.
theological_decisions:
- issue: Rendu de שְׁאוֹל
  choice: shéol
  alternative: la tombe ; le séjour des morts
  rationale: Conserver le terme hébreu évite d’en restreindre le sens et maintient la distinction poétique entre le shéol et la mort, sans imposer un modèle doctrinal particulier de l’au-delà.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu est conservé par « liens / pièges » et « shéol / mort ». La forme « shéol », peu courante mais intelligible dans un texte biblique, préserve l’ambiguïté du terme source.
