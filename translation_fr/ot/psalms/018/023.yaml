source:
  edition: WLC
  text: וָ/אֱהִ֣י תָמִ֣ים עִמּ֑/וֹ וָ֝/אֶשְׁתַּמֵּ֗ר מֵ/עֲוֺנִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/023.yaml
  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: fr
  text: J’ai été intègre envers lui[a], et je me suis gardé de ma faute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « irréprochable avec lui » ou « entier envers lui ». Le pronom « lui » renvoie au SEIGNEUR dans le contexte. Ici, l’expression évoque l’intégrité, sans nécessairement affirmer une absence absolue de péché.
    reason: lexical_alternative
  - marker: b
    text: Ou « de mon iniquité » ou « de ma culpabilité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: J’ai été
  rationale: Le wayyiqtol qal à la première personne exprime ici un état passé dans la progression poétique; « J’ai été » est naturel en français.
- source_word: תָמִים
  choice: intègre
  rationale: Dans ce contexte moral, le terme désigne la droiture et l’intégrité plutôt qu’une perfection exempte de tout péché.
- source_word: עִמּוֹ
  choice: envers lui
  rationale: Littéralement « avec lui »; « envers lui » rend naturellement en français la relation de loyauté visée, tout en conservant le pronom hébreu. Dans le contexte, celui-ci renvoie au SEIGNEUR.
- source_word: וָאֶשְׁתַּמֵּר
  choice: je me suis gardé
  rationale: 'La forme hitpael de שמר a un sens réfléchi: le locuteur s’est tenu sur ses gardes ou préservé.'
- source_word: מֵעֲוֺנִי
  choice: de ma faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Ma faute » conserve le suffixe personnel et la portée morale sans rendre le vers artificiel.
theological_decisions:
- issue: Portée morale de תָמִים
  choice: « intègre » exprime une conduite droite et entière envers Dieu.
  alternative: Une perfection absolue, sans aucun péché.
  rationale: Le terme porte une forte affirmation d’intégrité, mais n’oblige pas à comprendre une impeccabilité absolue; la traduction préserve cette tension sans ajouter une doctrine.
- issue: Sens de מֵעֲוֺנִי
  choice: « de ma faute »
  alternative: « de mon iniquité » ou « de ma culpabilité »
  rationale: Le mot hébreu peut viser l’acte fautif comme la culpabilité qui en découle. Le texte ne précise pas davantage, et la note conserve cette latitude.
translation_notes:
  register: Français international moderne, sobre et poétique. « Intègre envers lui » évite l’ambiguïté peu naturelle de « intègre avec lui », tandis que « ma faute » garde le caractère personnel et moral de l’hébreu.
