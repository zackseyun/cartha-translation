source:
  edition: WLC
  text: תְּפַלְּטֵ/נִי֮ מֵ/רִ֪יבֵ֫י עָ֥ם תְּ֭שִׂימֵ/נִי לְ/רֹ֣אשׁ גּוֹיִ֑ם עַ֖ם לֹא יָדַ֣עְתִּי יַֽעַבְדֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/043.yaml
  text: You rescue me from the strivings of the people[a]; you set me as the head of nations[d][c][b]; a people whom I have not known serve me.
translation:
  language: fr
  text: Tu me délivres des querelles du peuple[a] ; tu m’établis à la tête des nations[b] ; un peuple que je ne connaissais pas me sert[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des conflits du peuple » ou « des contestations du peuple ». Le mot hébreu peut désigner une querelle, un conflit, une contestation ou un litige.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme chef des nations ». En hébreu, le mot rendu par « tête » est une métaphore de l’autorité.
    reason: lexical_alternative
  - marker: c
    text: Ou « me servira ». La forme verbale hébraïque peut avoir ici une valeur future.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Tu me délivres
  rationale: Le piel de פלט exprime ici une délivrance active. « Délivrer » est naturel dans ce contexte poétique et conserve l’idée que Dieu arrache le psalmiste au danger.
- source_word: מֵרִיבֵי עָם
  choice: des querelles du peuple
  rationale: רִיב peut désigner une querelle, un conflit, une contestation ou un litige. Le pluriel « querelles » garde la portée générale de l’expression, tandis que עָם reste un collectif singulier.
- source_word: תְּשִׂימֵנִי
  choice: tu m’établis
  rationale: שׂים signifie fondamentalement « placer, mettre ». Avec le complément « à la tête », « établir » rend naturellement en français l’idée d’une position d’autorité sans ajouter celle d’une nomination officielle.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: à la tête des nations
  rationale: Cette formulation française conserve la métaphore de רֹאשׁ, « tête », tout en exprimant clairement la prééminence. גּוֹיִם désigne ici des collectivités politiques et se traduit donc par « nations ».
- source_word: עַם לֹא יָדַעְתִּי
  choice: un peuple que je ne connaissais pas
  rationale: עַם est indéfini dans cette proposition. En français, l’imparfait « ne connaissais pas » présente naturellement l’absence de relation antérieure exprimée par le parfait hébreu.
- source_word: יַעַבְדוּנִי
  choice: me sert
  rationale: עבד signifie « servir ». Le présent convient à l’énoncé poétique d’une situation effective, tandis que l’imparfait hébreu permet aussi une lecture future, signalée en note.
theological_decisions:
- issue: Portée de גּוֹיִם et de עַם dans un psaume royal
  choice: Employer les termes politiques et collectifs « nations » et « un peuple ».
  alternative: Traduire גּוֹיִם par « païens » ou charger ces termes d’une distinction théologique ultérieure.
  rationale: Le contexte évoque l’autorité du roi sur des groupes étrangers. « Nations » respecte cette portée sans importer une opposition théologique qui n’est pas explicitée dans le verset.
- issue: Valeur temporelle de יַעַבְדוּנִי
  choice: Employer le présent « me sert », avec une note indiquant la lecture future possible.
  alternative: « me servira »
  rationale: L’imparfait hébreu peut décrire une action en cours ou caractéristique aussi bien qu’une action à venir. La traduction principale reste fluide sans supprimer cette ambiguïté.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme en trois membres est conservé ; les formulations « délivres », « à la tête des nations » et « me sert » restent accessibles sans effacer les métaphores ni l’ambiguïté temporelle de l’hébreu.
