base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: fr
  text: Yahweh tonna dans les cieux, et le Très-Haut fit retentir sa voix[a] — grêlons[b] et charbons de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donna sa voix ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « grêle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: tonna
  rationale: Dans cette théophanie orageuse, le verbe רעם désigne le tonnerre. « Tonna » est naturel en français et maintient le parallélisme avec la voix divine.
- source_word: בַּשָּׁמַיִם
  choice: dans les cieux
  rationale: Le pluriel poétique « les cieux » conserve le registre élevé de שׁמים sans réduire l’image au seul ciel visible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: וְעֶלְיוֹן
  choice: le Très-Haut
  rationale: « Le Très-Haut » est le titre divin français établi qui correspond naturellement à עֶלְיוֹן.
- source_word: יִתֵּן קֹלוֹ
  choice: fit retentir sa voix
  rationale: Littéralement, l’hébreu dit « donna sa voix ». La formulation retenue exprime naturellement en français l’émission puissante de la voix tout en laissant la note signaler l’image exacte.
- source_word: בָּרָד
  choice: grêlons
  rationale: Le singulier hébreu peut avoir un sens collectif. « Grêlons » concrétise l’image de la tempête et s’accorde avec l’énumération des phénomènes physiques.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: et charbons de feu
  rationale: Cette traduction proche de l’hébreu préserve l’image poétique sans décider s’il s’agit d’éclairs, d’un autre phénomène naturel ou d’une image du jugement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » conserve le nom propre au lieu de le remplacer par un titre.
- issue: Rapport de « grêlons et charbons de feu » avec la proposition précédente
  choice: Conserver la suite elliptique après un tiret
  alternative: Ajouter un verbe implicite tel que « il envoya » ou former une proposition indépendante
  rationale: L’hébreu ne contient ici aucun verbe explicite pour ces éléments. Le tiret maintient la brusque succession poétique sans ajouter une relation syntaxique absente du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé simple convient au registre psalmique ; le tiret préserve l’ellipse vigoureuse de l’hébreu.
