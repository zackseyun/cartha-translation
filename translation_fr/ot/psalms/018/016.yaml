  text: יִשְׁלַ֣ח מִ֭/מָּרוֹם יִקָּחֵ֑/נִי יַֽ֝מְשֵׁ֗/נִי מִ/מַּ֥יִם רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/016.yaml
  text: He sent from on high[a]; he took me; he drew me out of many waters.
translation:
  language: fr
  text: D’en haut, il tend la main[a] ; il me prend, il me tire hors des grandes eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il envoie d’en haut ». Le texte hébreu ne précise pas ce qui est envoyé ; « il tend la main » explicite l’image du secours dans ce contexte.'
    reason: Le complément de « envoyer » n’est pas exprimé en hébreu ; la note signale l’explicitation nécessaire à une formulation française naturelle.
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: D’en haut, il étend la main
  rationale: Le verbe signifie littéralement « envoyer » et peut aussi évoquer le geste d’étendre quelque chose. Comme aucun complément n’est exprimé en hébreu, « la main » explicite sobrement le geste de sauvetage qu’indiquent les verbes suivants, tout en évitant la tournure française incomplète « il envoie d’en haut ».
- source_word: יִקָּחֵנִי
  choice: il me saisit
  rationale: Dans cette scène de délivrance, « saisir » exprime naturellement le fait de prendre fermement quelqu’un pour le sauver, sans introduire l’idée plus violente de s’emparer de lui.
- source_word: יַמְשֵׁנִי
  choice: il me retire
  rationale: La forme verbale signifie faire sortir ou tirer hors de l’eau. « Retirer » est clair et naturel en français moderne, tout en conservant l’image concrète du sauvetage.
- source_word: מִמַּיִם רַבִּים
  choice: des eaux immenses
  rationale: Littéralement « de nombreuses eaux ». Dans ce contexte poétique, « eaux immenses » rend leur ampleur menaçante et l’image d’un danger qui submerge, sans les transformer explicitement en « eaux profondes ».
theological_decisions:
- issue: Faut-il identifier explicitement le lieu élevé au ciel ?
  choice: D’en haut
  alternative: Du ciel
  rationale: L’hébreu parle de la hauteur ou d’en haut, sans nommer explicitement le ciel. La traduction conserve donc l’image et son ouverture.
- issue: Faut-il présenter les eaux comme une métaphore explicite du danger ?
  choice: Conserver l’image des « eaux immenses »
  alternative: Me délivrer d’un immense danger
  rationale: Le texte décrit directement un retrait hors des eaux. Maintenir cette image préserve sa force poétique ainsi que la possibilité d’un sens à la fois concret et figuré.
translation_notes:
  register: 'Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme en trois mouvements est conservé : intervention d’en haut, saisie, retrait hors des eaux.'
