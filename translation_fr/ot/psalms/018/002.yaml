  text: יְהוָ֤ה סַֽלְעִ֥/י וּ/מְצוּדָתִ֗/י וּ/מְפַ֫לְטִ֥/י אֵלִ֣/י צ֭וּרִ/י אֶֽחֱסֶה בּ֑/וֹ מָֽגִנִּ֥/י וְ/קֶֽרֶן יִ֝שְׁעִ֗/י מִשְׂגַּבִּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: fr
  text: 'Yahweh est mon rocher escarpé, ma forteresse et mon libérateur,


    mon Dieu, mon roc, en qui je trouve refuge,


    mon bouclier, la corne de mon salut[a], mon haut refuge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la poésie biblique, la « corne » symbolise la force et la puissance victorieuse qui apporte le salut.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: סַלְעִי
  choice: mon rocher escarpé
  rationale: סֶלַע évoque une masse rocheuse ou un escarpement; ce choix le distingue du terme צוּר employé ensuite.
- source_word: מְצוּדָתִי
  choice: ma forteresse
  rationale: Le nom désigne un lieu fortifié et protecteur.
- source_word: מְפַלְטִי
  choice: mon libérateur
  rationale: Le participe substantivé désigne celui qui fait échapper au danger; «libérateur» reste concis et solennel.
- source_word: אֵלִי
  choice: mon Dieu
  rationale: Dans ce contexte, אֵל est une désignation divine directe avec suffixe possessif.
- source_word: צוּרִי
  choice: mon roc
  rationale: Le mot exprime la stabilité et la protection, tout en restant distinct de «rocher escarpé» pour סֶלַע.
- source_word: אֶחֱסֶה בּוֹ
  choice: en qui je trouve refuge
  rationale: חסה signifie chercher ou trouver refuge; la formulation conserve l’image protectrice et s’enchaîne naturellement avec «mon Dieu, mon roc».
- source_word: מָגִנִּי
  choice: mon bouclier
  rationale: Équivalent direct de la métaphore militaire hébraïque.
- source_word: קֶרֶן יִשְׁעִי
  choice: la corne de mon salut
  rationale: La traduction conserve l’image hébraïque de la corne ainsi que la relation génitivale, sans réduire la métaphore à une seule interprétation.
- source_word: מִשְׂגַּבִּי
  choice: ma hauteur fortifiée
  rationale: מִשְׂגָּב désigne un lieu élevé et inaccessible où l’on est en sûreté; cette expression préserve l’idée de hauteur et évite de répéter «forteresse».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ou «le Seigneur»
  rationale: Le texte porte directement le tétragramme; la translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Maintien des diverses images de protection
  choice: Des termes français distincts pour סֶלַע, צוּר, מְצוּדָה et מִשְׂגָּב
  alternative: Uniformiser plusieurs images sous «rocher» ou «forteresse»
  rationale: L’hébreu accumule des métaphores voisines mais distinctes; leur diversité poétique et leur tension sémantique sont ainsi conservées.
- issue: Métaphore de קֶרֶן יִשְׁעִי
  choice: la corne de mon salut
  alternative: ma force salvatrice ou la puissance qui me sauve
  rationale: Conserver la métaphore évite d’en imposer une paraphrase théologique unique; une note en éclaire la portée culturelle.
translation_notes:
  register: Français international moderne, poétique et digne. La structure accumulative de l’hébreu est conservée sur trois lignes, avec des possessifs répétés. «Rocher escarpé» et «roc» rendent perceptibles les deux termes hébreux apparentés mais distincts; «hauteur fortifiée» restitue la sûreté d’un lieu élevé.
