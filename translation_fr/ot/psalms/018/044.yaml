  text: לְ/שֵׁ֣מַֽע אֹ֭זֶן יִשָּׁ֣מְעוּ לִ֑/י בְּנֵֽי נֵ֝כָ֗ר יְכַחֲשׁוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: fr
  text: Dès qu’ils entendent, ils m’obéissent[a] ; les étrangers[b] font semblant de se soumettre à moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « À l’audition de l’oreille, ils m’obéissent. » On peut aussi traduire : « Au seul ouï-dire, ils m’obéissent. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les fils de l’étranger » ou « les fils d’une terre étrangère ».'
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition peut aussi se traduire : « me mentent » ou « se soumettent à moi à contrecœur ». Elle peut évoquer une soumission forcée ou dépourvue de sincérité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Dès qu’ils entendent
  rationale: L’expression signifie littéralement « à l’audition de l’oreille » et décrit une réaction immédiate à ce qui est entendu. Cette formulation française naturelle en conserve le sens temporel.
- source_word: יִשָּׁמְעוּ לִי
  choice: ils m’obéissent
  rationale: Avec la préposition ל, le verbe שׁמע peut signifier « écouter quelqu’un, lui obéir ». Dans ce contexte de victoire royale, il s’agit vraisemblablement d’obéissance plutôt que de simple perception auditive.
- source_word: בְּנֵי נֵכָר
  choice: les étrangers
  rationale: L’expression, littéralement « fils de l’étranger » ou « fils d’une terre étrangère », est un idiome désignant des personnes ou des peuples étrangers.
- source_word: יְכַחֲשׁוּ לִי
  choice: font semblant de se soumettre à moi
  rationale: Au piel, כחש peut exprimer la tromperie, le déni ou, dans un contexte de conquête, une soumission contrainte ou insincère. Le choix retenu rend explicite cette possible fausseté tout en maintenant le parallèle avec l’obéissance du premier membre.
