id: PSA.18.28
reference: Psalms 18:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה תָּאִ֣יר נֵרִ֑/י יְהוָ֥ה אֱ֝לֹהַ֗/י יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/028.yaml
  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: fr
  text: 'Car c’est toi qui fais briller ma lampe[a] ;

    Yahweh, mon Dieu, éclaire mes ténèbres[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui allumes ma lampe ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « mes ténèbres » peut évoquer la détresse, le danger ou l’abattement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif qui fonde la confiance et la louange exprimées dans le contexte ; « Car » convient au mouvement poétique du psaume.
- source_word: אַתָּה
  choice: c’est toi qui
  rationale: La construction met en relief le pronom sujet hébreu, qui serait autrement facultatif ; « c’est toi qui » restitue naturellement cette insistance en français.
- source_word: תָּאִיר
  choice: fais briller
  rationale: Le hifil de אור exprime ici l’action de donner de la lumière ou de faire luire. Cette formulation conserve la valeur causative et s’accorde naturellement avec l’image de la lampe.
- source_word: נֵרִי
  choice: ma lampe
  rationale: Le nom נֵר désigne concrètement une lampe. Le maintien de cette image évite de la réduire à l’idée abstraite de lumière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Rend directement le nom avec son suffixe possessif de première personne.
- source_word: יַגִּיהַּ
  choice: éclaire
  rationale: Le verbe exprime le fait de rendre lumineux ou d’illuminer. « Éclaire » est actuel, digne et maintient le parallélisme avec le premier vers sans répétition lourde.
- source_word: חָשְׁכִּי
  choice: mes ténèbres
  rationale: Le nom porte un suffixe de première personne. « Mes ténèbres » préserve la métaphore et son ambiguïté, qu’elle évoque la détresse, le danger ou l’obscurité morale ou affective.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » conserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée de l’image des ténèbres
  choice: mes ténèbres
  alternative: ma détresse
  rationale: Le texte ne précise pas si les ténèbres représentent une situation extérieure, un danger ou un état intérieur. La traduction conserve cette tension poétique au lieu de choisir une interprétation.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme hébreu est conservé en deux lignes, avec une légère variation entre « fais briller » et « éclaire ». L’insistance portée par אַתָּה est rendue par « c’est toi qui ».
