  text: כִּֽי שָׁ֭מַרְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹֽא רָ֝שַׁ֗עְתִּי מֵ/אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: fr
  text: 'Car j’ai suivi les voies de Yahweh,

    et je ne me suis pas éloigné de mon Dieu en faisant le mal[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne me suis pas détourné de mon Dieu de manière coupable ». Le verbe hébreu signifie littéralement « agir avec méchanceté » ou « agir en coupable » ; l’expression qui suit marque l’éloignement d’avec Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: שָׁמַרְתִּי דַּרְכֵי
  choice: j’ai suivi les voies
  rationale: שׁמר exprime ici l’observance fidèle, tandis que דֶּרֶךְ désigne la conduite prescrite par Dieu. « Suivre les voies » restitue naturellement cette idée en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: et je n’ai pas fait le mal en me détournant de mon Dieu
  rationale: רשׁע signifie « agir avec méchanceté, faire le mal » et la préposition מִן marque l’éloignement d’avec Dieu. La formulation française conserve les deux éléments sans réduire le verbe au seul fait de se détourner.
theological_decisions:
- issue: Portée de l’affirmation de justice du psalmiste
  choice: 'Une affirmation forte de fidélité concrète : il a suivi les voies de Yahweh et n’a pas fait le mal en se détournant de Dieu.'
  alternative: Comprendre le verset comme une déclaration abstraite d’absence totale de péché.
  rationale: L’hébreu décrit une conduite fidèle et l’absence d’un éloignement coupable vis-à-vis de Dieu; il ne formule pas directement une doctrine de perfection absolue.
- issue: Rapport entre l’action mauvaise et l’éloignement de Dieu
  choice: « faire le mal en se détournant de mon Dieu »
  alternative: « me détourner de mon Dieu pour faire le mal » ou « agir en coupable envers mon Dieu »
  rationale: La construction hébraïque associe רשׁע à מִן et permet plusieurs formulations du rapport logique entre la faute et l’éloignement. Le texte principal garde leur association, et la note signale une autre lecture naturelle.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Voies » maintient l’image biblique traditionnelle, tandis que « suivi » évite la tournure moins naturelle « gardé les voies ».
