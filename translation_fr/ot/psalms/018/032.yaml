source:
  edition: WLC
  text: הָ֭/אֵל הַ/מְאַזְּרֵ֣/נִי חָ֑יִל וַ/יִּתֵּ֖ן תָּמִ֣ים דַּרְכִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/032.yaml
  text: The God who girds me with strength and makes my way blameless[a][b].
translation:
  language: fr
  text: Le Dieu qui me ceint de force[a] et rend ma voie irréprochable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui m’équipe de puissance » ; l’hébreu évoque littéralement le fait d’être « ceint » de חיל, terme qui peut signifier force, puissance ou vaillance.
    reason: lexical_alternative
  - marker: b
    text: Ou « rend ma voie parfaite » ou « entière ». Le mot hébreu תמים peut exprimer l’intégrité, la plénitude ou le caractère irréprochable.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Le Dieu
  rationale: L’article hébreu est conservé, ainsi que la tournure descriptive qui présente Dieu comme celui qui agit en faveur du psalmiste.
- source_word: הַמְאַזְּרֵנִי
  choice: qui me ceint
  rationale: Le verbe אזר évoque concrètement le fait de mettre une ceinture, donc de préparer ou d’équiper quelqu’un pour l’action. « Me ceint » préserve cette image.
- source_word: חָיִל
  choice: de force
  rationale: חיל peut exprimer la force, la puissance ou la vaillance. « Force » convient ici à l’idée de capacité reçue de Dieu sans restreindre le terme à la seule bravoure guerrière.
- source_word: וַיִּתֵּן
  choice: et rend
  rationale: 'Bien que נתן signifie couramment « donner », la construction exprime ici le résultat produit par Dieu : il rend la voie du psalmiste intègre.'
- source_word: תָּמִים
  choice: intègre
  rationale: תמים désigne ce qui est entier, sans défaut ou irréprochable. « Intègre » rend sa portée éthique sans suggérer nécessairement une perfection absolue.
- source_word: דַּרְכִּי
  choice: ma voie
  rationale: דרך évoque à la fois le chemin et la manière de vivre. « Ma voie » conserve cette métaphore biblique tout en restant intelligible.
theological_decisions:
- issue: Portée de תָּמִים appliqué à la voie du psalmiste
  choice: intègre
  alternative: parfaite, entière ou irréprochable
  rationale: La traduction conserve l’idée de plénitude et de rectitude morale sans trancher le verset comme une affirmation explicite de perfection morale absolue.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore concrète de la ceinture est maintenue, tandis que « intègre » préserve l’étendue éthique de תמים sans imposer l’idée de perfection absolue.
