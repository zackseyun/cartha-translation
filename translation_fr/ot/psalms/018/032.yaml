    issue: Collocation française de « voie intègre »
    rationale: En français moderne, « intègre » qualifie normalement une personne, une conduite ou un comportement, et beaucoup moins une « voie ». « Voie irréprochable » conserve le référent métaphorique du texte et rend plus naturellement le sens éthique de תמים.
