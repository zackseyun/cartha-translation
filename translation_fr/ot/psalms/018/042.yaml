  yaml_path: translation/ot/psalms/018/042.yaml
  text: I beat them fine like dust before the wind[c][b][a]; like mud in the streets I poured them out.
translation:
  language: fr
  text: Je les broie comme la poussière emportée par le vent[a] ; comme la boue des rues, je les répands[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la face du vent » ; l’expression évoque une poussière chassée et dispersée par le vent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je les déverse » ou « je les vide ». Le verbe hébreu peut signifier « répandre », « déverser » ou « vider ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Je les broie
  rationale: Le qal de שׁחק avec suffixe de 3e personne masculine plurielle exprime ici l’action de réduire en particules, de broyer. « Je les broie » restitue directement cette image sans l’atténuer.
- source_word: כְּעָפָר
  choice: comme la poussière
  rationale: עָפָר désigne couramment la poussière ou la terre meuble. « La poussière » s’accorde naturellement avec l’image du broyage et de la dispersion par le vent.
- source_word: עַל פְּנֵי רוּחַ
  choice: emportée par le vent
  rationale: L’expression signifie littéralement « sur la face du vent ». La formulation française explicite avec naturel l’image d’une poussière entraînée et dispersée par le vent.
- source_word: כְּטִיט חוּצוֹת
  choice: comme la boue des rues
  rationale: טִיט signifie « boue » ou « bourbier », et חוּצוֹת désigne les rues ou les espaces extérieurs. « La boue des rues » conserve l’image concrète et dégradante.
- source_word: אֲרִיקֵם
  choice: je les déverse
  rationale: Le hifil de ריק peut signifier vider ou verser. « Je les déverse » préserve l’image verbale et son lien avec la boue répandue dans les rues.
