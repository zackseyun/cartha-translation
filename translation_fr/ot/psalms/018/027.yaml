id: PSA.18.27
reference: Psalms 18:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַ֭תָּה עַם עָנִ֣י תוֹשִׁ֑יעַ וְ/עֵינַ֖יִם רָמ֣וֹת תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/027.yaml
  text: For you save an afflicted people[b][a], but haughty eyes you bring low.
translation:
  language: fr
  text: Car tu sauves un peuple affligé[a], mais tu abaisses les regards hautains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pauvre » ou « humble ». Le terme hébreu peut désigner la pauvreté, l’affliction ou une condition humble.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les yeux élevés », expression hébraïque évoquant l’orgueil ou l’arrogance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve naturellement la valeur causale du texte hébreu.
- source_word: אַתָּה
  choice: tu
  rationale: Pronom masculin singulier désignant Dieu; le français n’exige aucun ajout pour en marquer l’emphase.
- source_word: עַם
  choice: un peuple
  rationale: Rend le nom collectif sans lui donner la nuance politique que pourrait suggérer « nation ».
- source_word: עָנִי
  choice: affligé
  rationale: Le terme peut évoquer la pauvreté, l’affliction ou l’humilité. « Affligé » convient au contexte de délivrance tout en laissant les autres nuances en note.
- source_word: תוֹשִׁיעַ
  choice: tu sauves
  rationale: Rend directement le hiphil de ישׁע et préserve toute l’ampleur de l’idée de salut ou de délivrance.
- source_word: וְעֵינַיִם רָמוֹת
  choice: mais les regards hautains
  rationale: La conjonction marque ici un contraste poétique. « Regards hautains » transmet en français l’image hébraïque littérale des « yeux élevés » et son sens d’orgueil.
- source_word: תַּשְׁפִּיל
  choice: tu abaisses
  rationale: Conserve l’image spatiale opposant ce qui est élevé à l’action divine de le faire descendre, dans une formulation française concise.
theological_decisions:
- issue: Sens de עָנִי
  choice: un peuple affligé
  alternative: un peuple pauvre; un peuple humble
  rationale: Le choix principal souligne la détresse dont Dieu délivre sans réduire le terme à la pauvreté économique ni le limiter à une disposition morale. La note conserve l’ambiguïté lexicale réelle.
- issue: Référent des « yeux élevés »
  choice: les regards hautains
  alternative: les yeux élevés; les orgueilleux
  rationale: Cette formulation garde l’image corporelle tout en rendant son sens idiomatique, sans remplacer entièrement la métaphore par une désignation des personnes.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme antithétique est conservé par « mais », et les images de hauteur et d’abaissement restent perceptibles.
