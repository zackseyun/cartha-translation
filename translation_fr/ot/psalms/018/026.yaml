  text: עִם נָבָ֥ר תִּתְבָּרָ֑ר וְ/עִם עִ֝קֵּ֗שׁ תִּתְפַּתָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: fr
  text: Avec celui qui est pur, tu te montres pur ; avec celui qui est tortueux, tu te montres retors[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tu te montres habile » ou « tu déjoues les ruses de celui qui est tortueux ». L’hébreu joue sur la réciprocité : Dieu traite la personne tortueuse d’une manière qui répond à ses détours et les met en échec, sans devenir lui-même moralement tortueux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: celui qui est pur
  rationale: L’adjectif désigne ici une personne pure ou intègre. « Pur » rend directement le sens moral et permet de conserver la reprise de la même racine dans le verbe suivant.
- source_word: תִּתְבָּרָר
  choice: tu te montres pur
  rationale: La forme hitpael exprime la manière dont Dieu se manifeste dans sa relation avec la personne pure. Cette formulation préserve à la fois la valeur réflexive et le jeu de mots hébreu.
- source_word: עִקֵּשׁ
  choice: celui qui est tortueux
  rationale: Le terme décrit une personne moralement dévoyée, dont les voies sont tordues. « Tortueux » convient au registre poétique et prépare le parallélisme avec « retors ».
- source_word: תִּתְפַּתָּל
  choice: tu te montres retors
  rationale: Le verbe évoque une action qui se fait sinueuse ou rusée en réponse à la perversité. « Retors » conserve la force troublante et la réciprocité de l’hébreu sans les atténuer dans le corps du texte.
theological_decisions:
- issue: Description anthropomorphique de la réponse de Dieu à la personne tortueuse
  choice: Conserver « tu te montres retors » dans le texte principal.
  alternative: « tu te montres habile » ou « tu déjoues ses ruses »
  rationale: Le parallélisme poétique présente une réponse divine correspondant à la conduite humaine. La formulation forte préserve la tension du texte ; la note précise qu’elle n’attribue pas à Dieu une perversité morale.
translation_notes:
  register: Français moderne, naturel et digne. Le couple « tortueux/retors » maintient le parallélisme et l’effet saisissant de la poésie hébraïque ; la note prévient une lecture qui attribuerait à Dieu une corruption morale.
