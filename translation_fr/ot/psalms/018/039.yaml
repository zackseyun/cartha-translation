  text: וַ/תְּאַזְּרֵ֣/נִי חַ֭יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֖יעַ קָמַ֣/י תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/039.yaml
  text: You equipped me with strength for battle[b][a]; you subdued those who rose against me beneath me.
translation:
  language: fr
  text: Tu m’as ceint de force pour le combat[a] ; tu as fait plier sous moi ceux qui se dressaient contre moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu m’as équipé de force pour le combat. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu as contraint à s’incliner devant moi ceux qui se dressaient contre moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: tu m’as ceint
  rationale: Le verbe אזר évoque l’action de ceindre quelqu’un, donc de l’équiper ou de le préparer. « Ceint » conserve cette image concrète et poétique sans la réduire au fait de fournir des armes.
- source_word: חַיִל
  choice: de force
  rationale: Dans ce contexte militaire, חַיִל désigne la force ou la capacité au combat, plutôt qu’une armée ou une qualité morale particulière comme la vaillance.
- source_word: לַמִּלְחָמָה
  choice: pour le combat
  rationale: « Pour le combat » exprime naturellement ici la préparation à l’affrontement, tandis que « pour la guerre » aurait une portée plus générale.
- source_word: תַּכְרִיעַ
  choice: tu as fait plier
  rationale: La forme causative de כרע signifie faire plier, s’incliner ou s’affaisser. « Faire plier » garde l’image corporelle tout en exprimant clairement la défaite.
- source_word: קָמַי
  choice: ceux qui se dressaient contre moi
  rationale: Cette formulation préserve l’image verbale du participe de קום et rend explicite, comme l’exige le contexte, l’hostilité de ceux qui se lèvent contre le psalmiste.
- source_word: תַּחְתָּי
  choice: sous moi
  rationale: La traduction conserve directement la métaphore spatiale de la domination et de la défaite.
theological_decisions: []
translation_notes:
  register: Français moderne, soutenu et poétique. « Ceint » conserve l’image hébraïque traditionnelle ; la note propose une formulation plus immédiatement transparente. Le second membre maintient l’image physique de l’ennemi contraint de plier sous le vainqueur.
