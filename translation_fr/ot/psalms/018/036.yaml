source:
  edition: WLC
  text: תַּרְחִ֣יב צַעֲדִ֣/י תַחְתָּ֑/י וְ/לֹ֥א מָ֝עֲד֗וּ קַרְסֻלָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/036.yaml
  text: You broaden my steps beneath me[c][b][a], and my ankles have not given way.
translation:
  language: fr
  text: Tu donnes de l’espace à mes pas[a], et mes chevilles ne fléchissent pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu élargis mon pas sous moi. » L’expression hébraïque évoque des pas qui disposent d’un espace ample et sûr.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mes chevilles ne glissent pas » ou « ne chancellent pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: tu donnes de l’espace
  rationale: Le hiphil de רחב signifie « rendre large, élargir ». En français, « donner de l’espace » exprime naturellement cette action causative dans l’image de la marche, sans la réduire à une simple affirmation de sécurité.
- source_word: צַעֲדִי
  choice: à mes pas
  rationale: צעד désigne le pas ou l’enjambée. Le singulier hébreu peut avoir ici une valeur collective; le pluriel français « mes pas » rend l’image de manière naturelle tout en conservant le mouvement du psalmiste comme élément central.
- source_word: תַחְתָּי
  choice: à mes pas
  rationale: Le sens spatial « sous moi » est intégré idiomatiquement à l’expression « donner de l’espace à mes pas ». Une note conserve la formulation plus littérale et l’ambiguïté de l’image.
- source_word: וְלֹא
  choice: et ... ne ... pas
  rationale: La coordination et la négation hébraïques sont rendues directement.
- source_word: מָעֲדוּ
  choice: ne fléchissent pas
  rationale: מעד évoque le fait de glisser, chanceler ou céder. Avec les chevilles comme sujet, « fléchir » rend naturellement la perte de stabilité physique sans imposer l’idée plus précise d’une glissade.
- source_word: קַרְסֻלָּי
  choice: mes chevilles
  rationale: Le nom désigne précisément les chevilles ou les os des chevilles. Ce choix préserve l’image corporelle vive de l’hébreu.
