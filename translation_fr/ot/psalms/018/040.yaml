  text: וְֽ/אֹיְבַ֗/י נָתַ֣תָּה לִּ֣/י עֹ֑רֶף וּ֝/מְשַׂנְאַ֗/י אַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/040.yaml
  text: You gave me the backs of my enemies[a]; I destroyed those who hated me.
translation:
  language: fr
  text: Tu as fait fuir devant moi mes ennemis[a] ; j’ai anéanti ceux qui me haïssaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu m’as donné la nuque de mes ennemis. » Cette image peut évoquer des ennemis qui tournent le dos en fuyant ou qui sont livrés à la défaite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹיְבַי
  choice: mes ennemis
  rationale: אֹיֵב désigne un adversaire ou un ennemi ; le suffixe de première personne est rendu par « mes ».
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: tu as fait tourner le dos … devant moi
  rationale: Littéralement, le texte dit que le locuteur reçoit la « nuque » de ses ennemis. Cette image idiomatique évoque des ennemis qui tournent le dos et prennent la fuite. La formulation française exprime clairement leur déroute tout en conservant l’image corporelle.
- source_word: וּמְשַׂנְאַי
  choice: ceux qui me haïssaient
  rationale: Le participe de שׂנא désigne les personnes animées de haine envers le locuteur ; cette tournure est naturelle en français et garde la force du verbe « haïr ».
- source_word: אַצְמִיתֵם
  choice: j’ai anéanti
  rationale: La forme causative de צמת exprime ici l’élimination ou la destruction des adversaires. « Anéanti » restitue cette intensité sans l’atténuer.
theological_decisions:
- issue: Image de la nuque des ennemis livrée au psalmiste
  choice: Interpréter l’image comme celle d’ennemis contraints de tourner le dos et de fuir, tout en la signalant en note.
  alternative: « Tu m’as livré la nuque de mes ennemis »
  rationale: Le mot עֹרֶף signifie concrètement « nuque », mais la construction décrit vraisemblablement la mise en fuite ou la défaite des ennemis. La traduction principale reste compréhensible en français, tandis que la note préserve la forme exacte et la vigueur de l’hébreu sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme et la violence explicite du texte sont conservés. L’ordre « à mes ennemis devant moi » évite de suggérer à tort que le psalmiste lui-même tourne le dos à ses ennemis.
