  text: וַ/יֹּאמַ֡ר אֶרְחָמְ/ךָ֖ יְהוָ֣ה חִזְקִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/001.yaml
  text: And he said[a], “I love you, O Yahweh, my strength.”
translation:
  language: fr
  text: 'Et il dit : « Je t’aime[a], Yahweh, ma force. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu évoque habituellement une tendre compassion ; ici, il peut aussi se comprendre : « je te chéris profondément » ou « tu m’es profondément cher ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Et il dit
  rationale: Le waw avec la forme narrative de אמר rattache cette parole à ce qui précède dans le texte hébreu; « Et il dit » en conserve explicitement l’enchaînement sans harmoniser la numérotation française habituelle.
- source_word: אֶרְחָמְךָ
  choice: Je t’aime
  rationale: Le verbe רחם évoque normalement la compassion ou une profonde tendresse. Adressé ici à Dieu, « Je t’aime » exprime naturellement l’affection fervente du psalmiste, tandis que la nuance lexicale inhabituelle est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel plutôt que de lui substituer un titre.
- source_word: חִזְקִי
  choice: ma force
  rationale: Cette forme nominale munie du suffixe de première personne désigne Yahweh comme la force ou l’appui du psalmiste; « ma force » est à la fois précis, naturel et concis en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom propre sans le remplacer par un titre.
- issue: Valeur de רחם lorsque Dieu est l’objet du verbe
  choice: Je t’aime
  alternative: J’ai compassion de toi; je te chéris profondément
  rationale: Une traduction littérale par « avoir compassion » pourrait suggérer à tort que le psalmiste prend Dieu en pitié. « Je t’aime » rend l’affection dévouée dans un français naturel, tout en laissant paraître en note la nuance de tendre compassion.
translation_notes:
  register: Français international moderne, digne et direct. L’exclamation rend l’intensité affective de l’adresse sans ajouter de contenu doctrinal. Le marqueur de note est placé après l’expression à laquelle il se rapporte.
