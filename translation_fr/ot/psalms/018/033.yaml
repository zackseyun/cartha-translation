id: PSA.18.33
reference: Psalms 18:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מְשַׁוֶּ֣ה רַ֭גְלַ/י כָּ/אַיָּל֑וֹת וְ/עַ֥ל בָּ֝מֹתַ֗/י יַעֲמִידֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/033.yaml
  text: He makes my feet like the deer’s[b][a], and sets me on my heights.
translation:
  language: fr
  text: Il rend mes pieds semblables à ceux des biches[a] et me fait tenir sur mes hauteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semblables à ceux des femelles du cerf ». L’hébreu emploie un nom féminin pluriel et évoque des animaux agiles au pied sûr.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur mes lieux élevés ».
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: rend ... semblables
  rationale: Le participe piel de שׁוה exprime ici l’action de rendre comparable. Cette tournure française introduit naturellement la comparaison sans l’expliciter davantage.
- source_word: רַגְלַי
  choice: mes pieds
  rationale: רֶגֶל désigne normalement le pied; le pluriel convient directement à l’image de déplacement agile et assuré.
- source_word: כָּאַיָּלוֹת
  choice: semblables à ceux des biches
  rationale: Le nom est au féminin pluriel et désigne des biches. L’ajout idiomatique de « ceux » rapporte clairement la comparaison aux pieds, sans remplacer l’animal par une qualité abstraite.
- source_word: וְעַל
  choice: et ... sur
  rationale: La conjonction et la préposition sont rendues simplement et directement en français moderne.
- source_word: בָּמוֹתַי
  choice: mes hauteurs
  rationale: La traduction conserve le suffixe de première personne et l’image poétique de lieux élevés, sans imposer ici le sens cultuel possible de בָּמוֹת.
- source_word: יַעֲמִידֵנִי
  choice: me fait tenir
  rationale: Le hiphil de עמד signifie littéralement faire tenir ou faire se tenir. « Me fait tenir » conserve la valeur causative sans ajouter explicitement l’idée de sécurité.
theological_decisions:
- issue: Image métaphorique d’agilité et de stabilité
  choice: Conserver l’image des pieds de biches et de la station sur les hauteurs
  alternative: Expliciter une marche sûre, une sécurité spirituelle ou une domination militaire
  rationale: Le contexte général peut être martial, mais le verset lui-même emploie une image poétique. La traduction maintient cette image et sa tension sans en fixer une interprétation militaire ou spirituelle particulière.
- issue: Référent de « mes hauteurs »
  choice: Maintenir la première personne possessive
  alternative: Traduire « les hauteurs » ou interpréter les hauteurs comme des positions conquises
  rationale: Le texte massorétique porte explicitement le suffixe « mes ». Le conserver respecte la forme du texte sans préciser de quelle manière ces hauteurs appartiennent au psalmiste.
translation_notes:
  register: Français international moderne, poétique et digne. « Biches » est précis et courant; « mes hauteurs » préserve la formulation imagée et le suffixe hébreu. La syntaxe reste intelligible à la lecture publique.
