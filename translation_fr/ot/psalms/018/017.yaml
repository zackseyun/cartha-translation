  yaml_path: translation/ot/psalms/018/017.yaml
  text: He delivered me from my strong enemy[a], and from those who hated me[b], for they were too mighty for me.
translation:
  language: fr
  text: Il me délivra[a] de mon puissant ennemi[b] et de ceux qui me haïssaient, car ils étaient plus forts que moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Il me délivre », si l’imparfait poétique hébreu est compris avec une valeur de présent.'
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « mon ennemi » est au singulier, tandis que l’expression suivante, « ceux qui me haïssaient », est au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Il me délivra
  rationale: Le hifil de נצל signifie « délivrer, arracher, sauver ». Le passé simple convient au registre poétique et au récit des interventions passées de Dieu dans cette partie du psaume, tout en gardant en note la valeur imperfective possible.
- source_word: מֵאֹיְבִי עָז
  choice: de mon puissant ennemi
  rationale: אֹיְבִי est morphologiquement singulier (« mon ennemi »), et עָז exprime la force ou la puissance. « Puissant ennemi » est naturel et dignifié en français.
- source_word: וּמִשֹּׂנְאַי
  choice: et de ceux qui me haïssaient
  rationale: Le participe pluriel de שׂנא avec suffixe de première personne désigne ceux qui nourrissaient de la haine envers le psalmiste. Une proposition relative est plus naturelle que « mes haineux ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la délivrance.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: ils étaient plus forts que moi
  rationale: אמץ indique la force, et מן marque ici la comparaison ou la supériorité. Cette formulation française rend directement le rapport comparatif sans ajouter l'idée qu'ils auraient effectivement triomphé.
theological_decisions:
- issue: Valeur temporelle de l’imparfait poétique יַצִּילֵנִי
  choice: 'Récit au passé : « Il me délivra »'
  alternative: 'Présent à valeur poétique : « Il me délivre »'
  rationale: Le contexte immédiat raconte l’intervention passée de YHWH en réponse à la détresse du psalmiste. Le passé respecte ce fil narratif, tandis qu’une note préserve l’ambiguïté aspectuelle réelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. Le passé simple maintient la dignité poétique du psaume; le vocabulaire reste immédiatement compréhensible.
