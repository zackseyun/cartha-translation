  text: הָ/אֵ֗ל הַ/נּוֹתֵ֣ן נְקָמ֣וֹת לִ֑/י וַ/יַּדְבֵּ֖ר עַמִּ֣ים תַּחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/047.yaml
  text: the God who gives vengeance to me and subdues peoples under me[a][b].
translation:
  language: fr
  text: le Dieu qui m’accorde la vengeance[a] et soumet des peuples à mon autorité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des actes de vengeance » ; l’hébreu emploie un pluriel à valeur abstraite ou intensive.
    reason: lexical_alternative
  - marker: b
    text: Le verbe est traditionnellement compris ici au sens de « soumettre » ou « assujettir », et non de « parler », malgré son lien avec le verbe hébreu courant signifiant « parler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: le Dieu
  rationale: L’article défini est présent en hébreu. « le Dieu » conserve cette forme dans la suite poétique de la description.
- source_word: הַנּוֹתֵן
  choice: qui m’accorde
  rationale: Le participe décrit Dieu par une action caractéristique. « qui m’accorde » est naturel en français et permet d’intégrer le bénéficiaire exprimé par לִי.
- source_word: נְקָמוֹת לִי
  choice: m’accorde la vengeance
  rationale: Le pluriel hébreu peut avoir une valeur abstraite ou intensive. Le singulier collectif « la vengeance » est idiomatique en français, tandis que « m’accorde » conserve l’idée que celle-ci est donnée au psalmiste ou exercée en sa faveur.
- source_word: וַיַּדְבֵּר
  choice: et soumet
  rationale: Dans ce contexte royal et militaire, la forme signifie traditionnellement « soumettre, assujettir », et non « parler ». Le présent s’accorde avec la description participiale de Dieu et le style proverbial du verset.
- source_word: עַמִּים
  choice: des peuples
  rationale: « peuples » rend directement le pluriel et garde l’idée de plusieurs collectivités humaines; l’article indéfini est naturel en français.
- source_word: תַּחְתָּי
  choice: sous moi
  rationale: Cette expression conserve la métaphore spatiale hébraïque de la domination, dont le sens politique est explicité par « soumet ».
theological_decisions:
- issue: La vengeance divine
  choice: Conserver « vengeance » comme désignation de la rétribution exercée par Dieu en faveur du psalmiste.
  alternative: « délivrance » ou « justification »
  rationale: Le nom hébreu désigne directement la vengeance ou des actes de vengeance. Des termes plus atténués réduiraient la force du texte et résoudraient son enjeu théologique au lieu de le préserver.
- issue: Temporalité de וַיַּדְבֵּר
  choice: Employer le présent « soumet » dans la description de Dieu.
  alternative: « a soumis »
  rationale: La forme verbale peut être comprise comme un passé dans une séquence narrative, mais le contexte immédiat présente Dieu par des actions caractéristiques. Le présent maintient cette cohésion sans nier la possibilité d’une référence aux délivrances passées.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe reste concise pour s’insérer dans une phrase ou une série descriptive commencée au verset précédent. Les deux notes signalent les principales difficultés lexicales sans surcharger le texte.
