  text: מְ֭הֻלָּל אֶקְרָ֣א יְהוָ֑ה וּ/מִן אֹ֝יְבַ֗/י אִוָּשֵֽׁעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/003.yaml
  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: fr
  text: J’invoque Yahweh[a], digne de louange, et je suis sauvé de mes ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh représente le nom divin YHWH.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je serai sauvé de mes ennemis ». Le verbe hébreu peut aussi avoir un sens futur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: Digne de louange
  rationale: Le participe passif de הלל est placé en tête pour l’emphase et qualifie Yahweh. « Digne de louange » exprime naturellement en français sa valeur évaluative, plutôt que le simple état d’être loué.
- source_word: אֶקְרָא
  choice: j’invoque
  rationale: קרא avec le nom divin désigne ici l’appel adressé à Dieu. « J’invoque » est concis, idiomatique dans ce registre et conserve la portée religieuse du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par une translittération usuelle du nom divin plutôt que remplacé par un titre.
- source_word: וּמִן
  choice: et ... de
  rationale: La conjonction et la préposition relient l’invocation au salut hors de l’emprise des ennemis sans préciser davantage le rapport logique.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Rendu direct et transparent de אויב avec le suffixe de première personne du singulier.
- source_word: אִוָּשֵׁעַ
  choice: je suis sauvé
  rationale: Le nifal inaccompli de ישׁע peut présenter ici le résultat assuré ou habituel de l’invocation. Le présent français convient à cette confession générale, tandis que le futur demeure possible et est signalé en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu porte le nom divin lui-même. « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Valeur aspectuelle de אִוָּשֵׁעַ
  choice: 'présent à valeur générale ou résultative : « je suis sauvé »'
  alternative: 'futur : « je serai sauvé »'
  rationale: L’inaccompli hébreu autorise dans ce contexte poétique une lecture générale ou prospective. Le texte principal exprime la confiance habituelle du psalmiste, et la note préserve la lecture future.
translation_notes:
  register: Français moderne, international et digne. L’ordre initial « Digne de louange » conserve l’emphase poétique de l’hébreu. « Invoquer » reste compréhensible tout en convenant à la prière. Les marqueurs ont été placés sur les éléments auxquels leurs notes se rapportent.
