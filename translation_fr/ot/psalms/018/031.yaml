  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: fr
  text: Car qui est Dieu, sinon Yahweh ? Et qui est un rocher, sinon notre Dieu ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en dehors de Yahweh » dans la première proposition et « en dehors de notre Dieu » dans la seconde ; les deux expressions hébraïques marquent l’exclusivité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la louange précédente et conserve naturellement la valeur connective de l’hébreu.
- source_word: מִי
  choice: qui
  rationale: Pronom interrogatif employé dans une question rhétorique.
- source_word: אֱלוֹהַּ
  choice: Dieu
  rationale: Le singulier désigne ici le vrai Dieu dans une affirmation d’exclusivité.
- source_word: מִבַּלְעֲדֵי
  choice: en dehors de
  rationale: 'Exprime l’exclusion : nul n’est Dieu hormis Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: וּמִי
  choice: Et qui
  rationale: Conserve la coordination et le parallélisme des deux questions rhétoriques.
- source_word: צוּר
  choice: un rocher
  rationale: Préserve la métaphore hébraïque de la stabilité, de la force et de la protection.
- source_word: זוּלָתִי
  choice: sinon
  rationale: Terme d’exclusion idiomatique en français, parallèle à מִבַּלְעֲדֵי.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Conserve le suffixe possessif et sa portée communautaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel révélé sans lui substituer un titre.
- issue: Rendu de צוּר comme métaphore divine
  choice: un rocher
  alternative: le Rocher ; un refuge
  rationale: Le nom est ici un attribut métaphorique. « un rocher » conserve l’image concrète sans la transformer en titre fixe ni l’expliciter.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux questions rhétoriques et leur parallélisme sont conservés, ainsi que la métaphore concrète du rocher.
