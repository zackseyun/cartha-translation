id: PSA.18.24
reference: Psalms 18:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּֽשֶׁב יְהוָ֣ה לִ֣/י כְ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י לְ/נֶ֣גֶד עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/024.yaml
  text: Yahweh repaid me according to my righteousness[b][a], according to the cleanness of my hands before his eyes.
translation:
  language: fr
  text: Yahvé m’a rétribué[a] selon ma justice, selon la pureté de mes mains[b] devant ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « m’a récompensé » ou « m’a rendu ce qui me revenait ». Le verbe hébreu peut désigner le fait de rendre à quelqu’un ou de le rétribuer selon sa conduite.
    reason: lexical_alternative
  - marker: b
    text: La « pureté de mes mains » est une expression hébraïque qui évoque une conduite innocente ou droite.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: m’a rétribué
  rationale: Le hiphil de שוב avec לִי exprime ici l’idée de rendre à quelqu’un selon sa conduite, de lui donner une rétribution. « Rétribué » conserve cette correspondance sans limiter nécessairement le sens à une récompense positive.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du nom divin préserve ici le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: לִי
  choice: m’
  rationale: Avec « rétribuer », le français emploie naturellement un complément d’objet direct, qui rend sans lourdeur le ל hébreu.
- source_word: כְצִדְקִי
  choice: selon ma justice
  rationale: La préposition כ marque la conformité ou la mesure. « Justice » garde l’affirmation explicite du psalmiste concernant sa droiture, sans l’atténuer par une paraphrase.
- source_word: כְּבֹר
  choice: selon la pureté
  rationale: בֹּר désigne la netteté ou la pureté. « Pureté » s’associe naturellement à « mes mains » en français tout en maintenant l’image concrète.
- source_word: יָדַי
  choice: de mes mains
  rationale: La traduction conserve la métaphore hébraïque des mains pures, qui évoque une conduite innocente et droite.
- source_word: לְנֶגֶד
  choice: devant
  rationale: Le mot indique ce qui se trouve en face de quelqu’un ou sous son regard. « Devant » reste concis et proche de l’image source.
- source_word: עֵינָיו
  choice: ses yeux
  rationale: La formulation littérale maintient l’expression anthropomorphique du texte hébreu plutôt que de l’aplatir en « à ses yeux » ou « devant lui ».
theological_decisions:
- issue: Faut-il atténuer l’affirmation du psalmiste concernant sa propre justice ?
  choice: Conserver l’affirmation directe d’une rétribution conforme à « ma justice » et à « la pureté de mes mains ».
  alternative: Paraphraser en parlant de fidélité à l’alliance, de droiture relative ou d’innocence dans une affaire particulière.
  rationale: L’hébreu affirme explicitement que Yahvé agit envers le psalmiste selon sa justice et la pureté de ses mains. La traduction préserve cette tension théologique sans déterminer à la place du texte la portée exacte de cette justice.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe parallèle de l’hébreu et ses images concrètes sont conservées, avec un verbe français naturel mais suffisamment large pour ne pas réduire la rétribution à une simple récompense.
