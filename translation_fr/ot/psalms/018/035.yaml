source:
  edition: WLC
  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: fr
  text: Tu m’as donné le bouclier de ton salut ; ta main droite m’a soutenu, et ton humilité[a] m’a rendu grand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta douceur ». Le mot hébreu peut désigner l’humilité, la douceur ou la mansuétude.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Tu m’as donné
  rationale: Le wayyiqtol qal de נתן exprime ici naturellement une action passée dans ce chant d’action de grâce.
- source_word: מָגֵן יִשְׁעֶךָ
  choice: le bouclier de ton salut
  rationale: La formulation conserve le rapport construit et l’image concrète du bouclier, tout en gardant à « salut » sa portée plus large que le seul secours immédiat.
- source_word: וִימִינְךָ
  choice: ta main droite
  rationale: La traduction littérale préserve l’image biblique de la force et de l’aide agissante de Dieu.
- source_word: תִסְעָדֵנִי
  choice: m’a soutenu
  rationale: סעד signifie soutenir ou maintenir ; « m’a soutenu » est clair, naturel et adapté au parallélisme.
- source_word: וְעַנְוַתְךָ
  choice: ton humilité
  rationale: Le terme peut exprimer l’humilité, la douceur ou la mansuétude. « Ton humilité » conserve la formulation théologiquement frappante du texte hébreu sans l’atténuer.
- source_word: תַרְבֵּנִי
  choice: m’a rendu grand
  rationale: Le hiphil de רבה signifie faire grandir ou rendre grand ; cette traduction est concise et idiomatique en français.
theological_decisions:
- issue: Attribution de וְעַנְוַתְךָ à Dieu
  choice: ton humilité
  alternative: ta douceur
  rationale: L’hébreu permet les deux sens. Le texte principal garde l’étonnante attribution de l’humilité à Dieu, évoquant son abaissement pour secourir le psalmiste, tandis que la note signale l’autre lecture légitime.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement correspond à l’adresse directe à Dieu. Le point-virgule allège la succession des propositions tout en respectant le parallélisme poétique.
