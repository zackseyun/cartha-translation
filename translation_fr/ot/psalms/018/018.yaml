source:
  edition: WLC
  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: fr
  text: Ils m’ont affronté le jour de mon malheur[a], mais Yahweh a été mon appui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils sont venus à ma rencontre » ou « Ils m’ont devancé » le jour de mon malheur.'
    reason: La forme יְקַדְּמוּנִי peut désigner le fait de venir devant quelqu’un, de le rencontrer ou de le devancer ; dans le contexte hostile, le texte principal rend cette rencontre comme une confrontation.
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Ils m’ont affronté
  rationale: Le piel de קדם avec suffixe de première personne signifie littéralement « ils sont venus à ma rencontre / se sont présentés devant moi ». Dans ce contexte hostile, « affronté » exprime la confrontation sans préciser indûment qu’il s’agit d’une attaque militaire.
- source_word: בְּיוֹם אֵידִי
  choice: au jour de mon malheur
  rationale: La locution temporelle désigne le moment où le psalmiste subit un désastre. « Malheur » est naturel en français poétique et conserve l’étendue de sens de אֵיד, qui peut évoquer calamité, désastre ou ruine.
- source_word: וַיְהִי
  choice: mais … a été
  rationale: Le verbe היה présente Yahweh comme l’appui du psalmiste. « Mais » rend le contraste implicite entre la confrontation hostile et le secours divin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », plutôt que par un titre de substitution.
- source_word: לְמִשְׁעָן לִי
  choice: mon appui
  rationale: מִשְׁעָן désigne ce sur quoi l’on s’appuie. « Mon appui » restitue naturellement en français l’image d’un soutien qui permet de tenir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: L’hébreu porte directement le tétragramme. « Yahweh » conserve ici le nom divin plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et poétique. « Au jour de mon malheur » garde la concision et le parallélisme du vers hébreu ; « appui » préserve la métaphore sans introduire l’objet concret d’un bâton.
