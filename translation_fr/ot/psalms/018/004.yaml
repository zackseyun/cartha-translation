  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: fr
  text: Les liens de la mort m’ont entouré, et les torrents de destruction[a] m’ont épouvanté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torrents de perversité » ou, plus littéralement, « torrents de ce qui est sans valeur ». Le terme hébreu peut aussi être compris comme le nom propre « Bélial », mais il désigne plus probablement ici ce qui est destructeur ou funeste.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: m’encerclaient
  rationale: Le verbe אפף exprime l’idée d’entourer ou d’encercler. « M’encerclaient » conserve l’image menaçante dans un français naturel.
- source_word: חֶבְלֵי
  choice: les liens de
  rationale: חבל désigne concrètement une corde ou un lien et peut, en poésie, évoquer des pièges ou des douleurs. « Liens » préserve ici l’image concrète sans imposer une interprétation plus précise.
- source_word: מָוֶת
  choice: la mort
  rationale: Rendu direct et usuel du terme hébreu.
- source_word: נַחֲלֵי
  choice: les torrents de
  rationale: נחל peut désigner un cours d’eau, un oued ou, en contexte poétique, un torrent impétueux. « Torrents » restitue la force menaçante de l’image.
- source_word: בְלִיַּעַל
  choice: perdition
  rationale: Dans ce contexte, בְלִיַּעַל fonctionne probablement comme un nom commun évoquant ce qui est funeste, destructeur ou pervers. « Perdition » rend la menace de ruine avec une concision poétique, sans transformer automatiquement le mot en nom propre.
- source_word: יְבַעֲתוּנִי
  choice: m’épouvantaient
  rationale: Le verbe בעת exprime une vive terreur. « M’épouvantaient » convient au registre poétique et garde toute l’intensité du terme.
theological_decisions:
- issue: Faut-il comprendre בְלִיַּעַל comme le nom propre « Bélial » ou comme un nom commun évoquant la ruine, la perversité ou ce qui est funeste ?
  choice: Nom commun rendu par « perdition »
  alternative: « Bélial », « perversité » ou « destruction »
  rationale: Le contexte poétique ne requiert pas la personnification ultérieure de Bélial. Le choix d’un nom commun évite d’importer cette conception tout en maintenant dans une note les autres lectures possibles.
translation_notes:
  register: Français international moderne, poétique et digne. L’imparfait présente les dangers comme entourant et terrifiant le psalmiste, tout en évitant une tournure archaïque.
