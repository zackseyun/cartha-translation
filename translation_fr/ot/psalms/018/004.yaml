  - severity: medium
    issue: « Perdition » pour בְלִיַּעַל
    rationale: En français contemporain, « perdition » porte facilement une connotation de damnation ou de perte morale/spirituelle. « Destruction » rend plus clairement l’idée contextuelle de force ruineuse, tout en évitant de faire de Bélial un nom propre dans le texte.
