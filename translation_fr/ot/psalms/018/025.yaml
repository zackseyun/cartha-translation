id: PSA.18.25
reference: Psalms 18:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עִם חָסִ֥יד תִּתְחַסָּ֑ד עִם גְּבַ֥ר תָּ֝מִ֗ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/025.yaml
  text: With the faithful you show yourself faithful[a]; with the blameless man you show yourself blameless.
translation:
  language: fr
  text: Avec celui qui est fidèle, tu te montres fidèle[a] ; avec l’homme intègre, tu te montres intègre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avec celui qui est loyal envers toi, tu te montres loyal envers lui. » En hébreu, les deux termes viennent de la même racine et soulignent une loyauté réciproque dans le cadre de l’alliance.'
    reason: Alternative lexicale et explication du jeu de mots hébreu.
lexical_decisions:
- source_word: חָסִיד
  choice: celui qui est fidèle
  rationale: Le terme désigne une personne caractérisée par la fidélité, la loyauté et la piété dans le cadre de l’alliance. Cette formulation naturelle conserve le lien lexical avec le verbe qui suit.
- source_word: תִּתְחַסָּד
  choice: tu te montres fidèle
  rationale: La forme hitpael exprime ici la manière dont Dieu se manifeste envers le fidèle. « Tu te montres » préserve la réciprocité poétique sans suggérer un changement de nature en Dieu.
- source_word: גְּבַר
  choice: l’homme
  rationale: Le nom masculin singulier signifie « homme », avec parfois une nuance de vigueur qui n’est pas assez marquée ici pour être explicitée.
- source_word: תָּמִים
  choice: intègre
  rationale: Dans ce contexte éthique, le mot évoque la totalité morale, la droiture et l’absence de duplicité. « Intègre » est plus naturel en français actuel que « irréprochable » dans la reprise appliquée à Dieu.
- source_word: תִּתַּמָּם
  choice: tu te montres intègre
  rationale: Le verbe reprend la racine de תָּמִים. La répétition de « intègre » restitue cette correspondance lexicale et la construction réflexive du parallélisme.
theological_decisions:
- issue: Description réciproque de la manière dont Dieu se manifeste en réponse au caractère humain
  choice: Rendre les deux verbes par « tu te montres », en conservant la correspondance entre fidélité humaine et fidélité divine, puis entre intégrité humaine et intégrité divine.
  alternative: 'Traduire plus dynamiquement : « tu es bon envers celui qui est bon » ou « tu agis avec fidélité envers le fidèle ».'
  rationale: Les formes verbales réflexives et le parallélisme soutiennent « tu te montres ». Cette traduction maintient la tension poétique sans affirmer que la nature de Dieu serait modifiée ou moralement déterminée par les humains.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et les répétitions de racines sont rendus autant que possible. « Intègre » évite l’ambiguïté française de « irréprochable » appliqué à Dieu et conserve la dimension de droiture entière.
