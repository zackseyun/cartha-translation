  - severity: medium
    issue: Temps et collocation de la proposition finale
    rationale: « Parce qu’il prenait plaisir en moi » emploie un imparfait qui n’est pas requis par le parfait hébreu et dont la collocation est moins idiomatique. « Parce qu’il trouvait son plaisir en moi » exprime la faveur durable suggérée par le contexte sans la théologiser.
