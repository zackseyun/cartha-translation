  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: fr
  text: Il m’a conduit dans un vaste espace[a] ; il m’a délivré[b], car il trouvait son plaisir en moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu spacieux » ou « dans un espace ouvert ». L’image hébraïque oppose l’espace ouvert à l’enfermement et à la détresse.
    reason: lexical_alternative
  - marker: b
    text: Ou « il m’a secouru » ou « il m’a sauvé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « car il se plaisait en moi » ou « parce qu’il était favorable à mon égard ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Il m’a fait sortir
  rationale: Le hifil de יצא a un sens causatif, « faire sortir ». Cette formulation française conserve directement l’image de la délivrance.
- source_word: לַמֶּרְחָב
  choice: au large
  rationale: מֶרְחָב désigne un espace vaste et ouvert, par contraste avec l’enfermement ou la détresse. « Au large » est une expression française naturelle qui garde cette image spatiale.
- source_word: יְחַלְּצֵנִי
  choice: il m’a délivré
  rationale: Le piel de חלץ peut signifier retirer d’un danger, délivrer ou secourir. « Délivré » convient au parallélisme et au registre poétique sans préciser indûment la manière du salut.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la raison de la délivrance ; « parce que » en exprime clairement la valeur causale.
- source_word: חָפֵץ
  choice: il prenait plaisir
  rationale: חפץ exprime le plaisir, l’agrément ou une disposition favorable. « Prenait plaisir » restitue ce sens personnel tout en laissant ouverte sa portée théologique.
- source_word: בִּי
  choice: en moi
  rationale: Avec חפץ, la préposition ב marque l’objet du plaisir ou de la faveur. « En moi » en est le rendu direct.
theological_decisions:
- issue: Nature de la faveur divine dans la proposition finale
  choice: parce qu’il prenait plaisir en moi
  alternative: parce qu’il trouvait son plaisir en moi ; parce qu’il se plaisait en moi
  rationale: L’hébreu présente la faveur divine comme raison de la délivrance sans dire si elle repose sur le mérite, l’élection, l’alliance ou un autre fondement. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme hébreu est conservé ; « au large » rend naturellement l’image de l’espace et de la liberté.
