source:
  edition: WLC
  text: מְפַלְּטִ֗/י מֵ/אֹ֫יְבָ֥/י אַ֣ף מִן קָ֭מַ/י תְּרוֹמְמֵ֑/נִי מֵ/אִ֥ישׁ חָ֝מָ֗ס תַּצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/048.yaml
  text: the one who rescues me from my enemies[a]; indeed, you lift me up above those who rise against me[c][b]; you deliver me from the violent man.
translation:
  language: fr
  text: toi qui me délivres de mes ennemis[a] ; oui, tu m’élèves au-dessus de ceux qui se dressent contre moi[b] ; tu m’arraches à l’homme violent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon libérateur, qui me délivres de mes ennemis ». En hébreu, le début du verset emploie un participe comme désignation de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu m’exaltes au-dessus de ceux qui se dressent contre moi ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « d’un homme de violence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: toi qui me délivres
  rationale: Le participe substantivé avec suffixe de première personne décrit Dieu comme celui qui délivre le psalmiste. La tournure vocative « toi qui » s’accorde naturellement avec les verbes à la deuxième personne qui suivent.
- source_word: מֵאֹיְבַי
  choice: de mes ennemis
  rationale: La préposition מן marque ici l’éloignement ou la délivrance hors du pouvoir des ennemis ; « ennemis » rend normalement אֹיְבִים dans ce contexte hostile.
- source_word: אַף
  choice: oui
  rationale: La particule renforce la progression poétique. « Oui » exprime cette insistance avec naturel en français moderne.
- source_word: מִן קָמַי
  choice: au-dessus de ceux qui se dressent contre moi
  rationale: 'Le participe pluriel de קום désigne les adversaires qui se soulèvent contre le psalmiste. Avec רום, מן se comprend naturellement dans un sens comparatif : Dieu le place au-dessus d’eux.'
- source_word: תְּרוֹמְמֵנִי
  choice: tu m’élèves
  rationale: La forme intensive/causative de רום signifie faire monter ou placer en hauteur. « Tu m’élèves » conserve l’image verticale et la possible nuance d’exaltation.
- source_word: מֵאִישׁ חָמָס
  choice: à l’homme violent
  rationale: אִישׁ est un nom masculin singulier, tandis que חָמָס évoque la violence et l’injustice. Avec « arracher à », la préposition française « à » exprime idiomatiquement la délivrance hors de son pouvoir.
- source_word: תַּצִּילֵנִי
  choice: tu m’arraches
  rationale: נצל exprime le fait de retirer ou sauver quelqu’un d’un danger. « Arracher » distingue ce verbe du premier פלט et communique vivement la délivrance.
theological_decisions:
- issue: Référent et fonction du participe initial
  choice: 'Adresse directe à Dieu : « toi qui me délivres »'
  alternative: Rattacher le participe au verset précédent au moyen d’une proposition relative
  rationale: Le participe peut fonctionner comme une désignation de Dieu, suivie sans difficulté de verbes à la deuxième personne. Cette lecture préserve l’adresse directe et le mouvement du texte hébreu.
- issue: Genre de אִישׁ
  choice: l’homme violent
  alternative: la personne violente
  rationale: Le texte hébreu emploie un nom masculin singulier pour désigner l’oppresseur ; le français conserve ici cette précision sans en tirer une généralisation doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif « toi qui » préserve la valeur descriptive du participe et l’adresse directe à Dieu. Les deux verbes hébreux de délivrance sont différenciés par « délivres » et « arraches ».
