  text: The sons of foreigners fade away and come trembling out of their strongholds[a][b][c].
translation:
  language: fr
  text: Les fils des étrangers dépérissent et sortent en tremblant de leurs forteresses[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « les fils de l’étranger » ou « les fils de l’étrangeté »; on peut aussi traduire simplement : « les étrangers ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « sortent en tremblant » est rare et de sens incertain; il peut aussi évoquer une sortie craintive ou le fait de sortir en boitant.
    reason: lexical_alternative
  - marker: c
    text: « Forteresses » peut aussi se traduire par « places fortes » ou, plus généralement, « enceintes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: les fils de l’étranger
  rationale: Cette formulation conserve l’expression poétique hébraïque, littéralement « fils de l’étranger/de l’étrangeté », sans la réduire simplement à « les étrangers ».
- source_word: יִבֹּלוּ
  choice: dépérissent
  rationale: Le qal de נבל évoque le fait de se flétrir, de perdre sa vigueur ou de dépérir. « Dépérissent » convient à des ennemis qui s’affaiblissent, sans attribuer à ce verbe l’idée de tremblement portée plus probablement par le suivant.
- source_word: וְיַחְרְגוּ
  choice: sortent en tremblant
  rationale: Le verbe חרג est rare et son sens précis demeure incertain. Dans ce contexte, il semble décrire une sortie marquée par la peur ou l’agitation; une note conserve d’autres possibilités.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: de leurs forteresses
  rationale: Le nom désigne des lieux clos ou des enceintes. Dans le contexte militaire, « forteresses » exprime naturellement les positions défendues d’où les ennemis sont contraints de sortir.
