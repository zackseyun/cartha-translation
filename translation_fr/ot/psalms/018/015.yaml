  text: וַ/יֵּ֤רָא֨וּ אֲפִ֥יקֵי מַ֗יִם וַֽ/יִּגָּלוּ֮ מוֹסְד֪וֹת תֵּ֫בֵ֥ל מִ/גַּעֲרָ֣תְ/ךָ֣ יְהוָ֑ה מִ֝/נִּשְׁמַ֗ת ר֣וּחַ אַפֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/015.yaml
  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: fr
  text: 'Alors les chenaux des eaux devinrent visibles[a],

    et les fondations du monde furent mises à nu[b],

    à ta réprimande, Yahweh,

    au souffle de tes narines[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les lits des cours d’eau » ou « les cours d’eau ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les fondations de la terre ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « au souffle du vent — ou de l’esprit — de tes narines ». L’expression est une image poétique de la puissance du souffle de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: devinrent visibles
  rationale: Le nifal exprime ici l’apparition ou la mise en visibilité. « Devinrent visibles » conserve cette nuance sans la lourdeur de « furent vus » en français.
- source_word: אֲפִיקֵי מַיִם
  choice: les lits des eaux
  rationale: אֲפִיקִים désigne des chenaux, des lits ou des cours d’eau. « Les lits des eaux » reste proche de l’image hébraïque et convient au dévoilement cosmique décrit dans le verset.
- source_word: וַיִּגָּלוּ
  choice: furent mises à nu
  rationale: Le nifal de גלה indique ici que quelque chose est découvert ou exposé. « Furent mises à nu » rend la force de l’image.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: les fondations du monde
  rationale: מוֹסְדוֹת signifie « fondations » ou « bases », tandis que תֵּבֵל désigne le monde ou la terre habitée et ordonnée. « Monde » est naturel et garde la portée cosmique.
- source_word: מִגַּעֲרָתְךָ
  choice: sous l’effet de ta réprimande
  rationale: La préposition מִן marque ici la cause ou la source. Cette formulation française explicite naturellement cette valeur tout en conservant l’idée d’une réprimande divine efficace.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: au souffle de l’haleine de tes narines
  rationale: La formulation conserve l’intensification poétique créée par נִשְׁמָה et רוּחַ ainsi que l’image anthropomorphique explicite de אַף, « narine » ou « nez ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le verset emploie le nom propre divin. Sa translittération préserve cette donnée du texte sans lui substituer un titre.
- issue: Image anthropomorphique de la respiration divine
  choice: au souffle de l’haleine de tes narines
  alternative: sous l’effet de ta colère
  rationale: Le texte décrit concrètement le souffle issu des narines de Dieu. La traduction conserve cette image poétique au lieu de la réduire à son association possible avec la colère.
translation_notes:
  register: Poésie élevée mais accessible, avec parallélisme conservé sur quatre lignes. « Sous l’effet de » évite un calque peu naturel de la préposition hébraïque, tandis que « souffle de l’haleine » maintient volontairement l’intensité inhabituelle de l’expression source. Les marqueurs de notes suivent l’élément précis qu’ils éclairent.
