source:
  edition: WLC
  text: יִגְמְלֵ֣/נִי יְהוָ֣ה כְּ/צִדְקִ֑/י כְּ/בֹ֥ר יָ֝דַ֗/י יָשִׁ֥יב לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: fr
  text: Yahvé a agi envers moi selon ma justice[a] ; il m’a récompensé selon la pureté de mes mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahvé m’a récompensé selon ma justice. »'
    reason: lexical_alternative
  - marker: b
    text: La « pureté de mes mains » est une image hébraïque désignant une conduite innocente ou droite.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: m’a traité
  rationale: Le verbe גמל peut exprimer la manière dont on agit envers quelqu’un en fonction de sa conduite. « M’a traité » préserve cette amplitude, tandis que le parallèle précise ici une rétribution favorable.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כְּצִדְקִי
  choice: selon ma justice
  rationale: צדק désigne ici la rectitude du psalmiste. « Ma justice » conserve directement l’affirmation hébraïque et sa tension théologique, sans la réduire à une perfection absolue.
- source_word: כְּבֹר יָדַי
  choice: selon la pureté de mes mains
  rationale: Cette formulation conserve l’image concrète de mains pures, qui évoque une conduite innocente ou droite.
- source_word: יָשִׁיב לִי
  choice: il m’a récompensé
  rationale: Le hiphil de שוב exprime ici le fait de rendre à quelqu’un selon sa conduite. Dans ce contexte favorable, « récompensé » est naturel en français et fait ressortir la rétribution correspondante.
theological_decisions:
- issue: Risque de comprendre « ma justice » comme une perfection sans péché ou comme le fondement d’un salut mérité
  choice: Conserver « ma justice » comme affirmation de la rectitude du psalmiste dans le contexte.
  alternative: mon innocence ; la justice de ma cause
  rationale: L’hébreu attribue explicitement cette justice au locuteur. La traduction ne doit pas atténuer l’affirmation afin d’éviter sa tension théologique ; dans le contexte, elle porte sur sa conduite droite et sa justification par Yahvé.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme hébraïque et l’image des mains sont conservés ; les verbes sont différenciés pour refléter la nuance des deux termes sources.
