base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: fr
  text: Il fit des ténèbres sa retraite[a] ; autour de lui, son abri était fait d’eaux obscures[c] et d’épais nuages du ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son lieu secret » ou « sa cachette ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa hutte », « sa tente » ou « son couvert ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « ténèbres des eaux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: Il fit
  rationale: Le verbe poétique signifie ici établir ou disposer quelque chose comme autre chose. « Il fit des ténèbres sa cachette » est naturel en français tout en conservant cette relation.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Rendu courant qui maintient l’image atmosphérique de l’obscurité entourant Dieu.
- source_word: סִתְרוֹ
  choice: sa cachette
  rationale: Le nom désigne un lieu où l’on se dissimule. « Cachette » exprime concrètement le lieu de retrait sans ajouter une interprétation symbolique.
- source_word: סְבִיבוֹתָיו
  choice: autour de lui
  rationale: Rend directement et naturellement la disposition spatiale décrite par l’hébreu.
- source_word: סֻכָּתוֹ
  choice: son abri
  rationale: Le terme peut désigner une hutte, une tente ou un couvert temporaire. « Abri » convient à l’image poétique sans lui donner artificiellement une portée cultuelle.
- source_word: חֶשְׁכַת מַיִם
  choice: ténèbres des eaux
  rationale: Cette formulation conserve la chaîne construite et l’étrangeté poétique de l’hébreu; « eaux obscures » demeure une possibilité plus idiomatique.
- source_word: עָבֵי שְׁחָקִים
  choice: épais nuages du ciel
  rationale: « Épais nuages » rend la densité des nuées, et le singulier collectif « ciel » est naturel en français poétique moderne.
theological_decisions:
- issue: L’obscurité décrit la dissimulation divine au sein d’une manifestation liée à l’orage, sans préciser sa valeur morale ou métaphysique.
  choice: Conserver littéralement l’obscurité et les images atmosphériques autour de Dieu.
  alternative: Interpréter les ténèbres comme le jugement, ou l’abri comme une allusion explicite au sanctuaire.
  rationale: Le parallélisme hébreu présente avant tout une scène poétique de nuées, d’eaux et d’obscurité. La traduction ne doit pas imposer une interprétation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation met en relief l’apposition finale sans résoudre entièrement la relation syntaxique entre l’abri, les eaux et les nuages.
