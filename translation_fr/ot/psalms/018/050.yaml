reference: Psalms 18:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: fr
  text: Il accorde de grandes victoires à son roi[a] et manifeste son amour fidèle envers son oint[b], David, et sa descendance[c], pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il est une tour de délivrances pour son roi. » La forme hébraïque au début du verset est difficile sur les plans textuel et syntaxique. Le passage parallèle de 2 Samuel 22.51 porte une formulation étroitement apparentée : « Il rend grandes les délivrances de son roi. »'
    reason: textual_variant
  - marker: b
    text: « Son oint » peut aussi se traduire par « son Messie ». Le terme désigne ici d’abord David, le roi consacré par l’onction, tout en ayant une portée messianique plus large.
    reason: alternative_reading
  - marker: c
    text: Le mot hébreu est un collectif singulier. Il peut désigner l’ensemble de la lignée de David et, dans le contexte canonique, peut aussi évoquer un descendant messianique.
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל יְשׁוּעוֹת
  choice: accorde de grandes victoires
  rationale: Le premier mot hébreu présente une difficulté textuelle et syntaxique. En tenant compte du parallèle de 2 Samuel 22.51, cette formulation exprime naturellement l’idée que Dieu procure ou amplifie les délivrances victorieuses de son roi, sans imposer dans le texte principal l’image difficile d’une « tour ».
- source_word: מַלְכּוֹ
  choice: son roi
  rationale: Traduction directe de la construction avec suffixe possessif, qui conserve la relation entre Dieu et le roi davidique.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: et témoigne un amour fidèle
  rationale: « Amour fidèle » rend la dimension relationnelle, durable et souvent alliance de חֶסֶד dans un français actuel et digne.
- source_word: לִמְשִׁיחוֹ
  choice: à celui qui a reçu son onction
  rationale: Cette expression française reste compréhensible pour un large public et désigne immédiatement David comme roi consacré, tout en laissant la note signaler la traduction « son Messie » et sa portée plus large.
- source_word: לְדָוִד
  choice: à David
  rationale: Le nom propre est rendu sous sa forme française usuelle.
- source_word: וּלְזַרְעוֹ
  choice: et à sa descendance
  rationale: « Descendance » fonctionne comme un collectif singulier en français et évite de décider si le terme vise seulement l’ensemble de la lignée ou aussi un descendant particulier.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Formulation française naturelle qui exprime la durée indéfinie et permanente du syntagme hébreu.
theological_decisions:
- issue: Portée messianique de מְשִׁיחוֹ dans un psaume royal davidique
  choice: celui qui a reçu son onction
  alternative: son Messie
  rationale: Le contexte immédiat désigne David, le roi consacré par l’onction. La traduction principale garde ce sens historique, tandis que la note préserve explicitement la résonance messianique du terme.
- issue: Étendue de זַרְעוֹ
  choice: sa descendance
  alternative: sa postérité ; sa semence
  rationale: Le collectif singulier hébreu peut désigner toute la lignée davidique sans exclure, dans le contexte canonique, une lecture orientée vers un descendant messianique. « Descendance » conserve cette tension sans la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite les archaïsmes comme « bonté » au sens d’amour d’alliance ou « semence » pour une lignée humaine. Les notes conservent la difficulté textuelle du premier mot ainsi que les tensions davidique et messianique du verset.
