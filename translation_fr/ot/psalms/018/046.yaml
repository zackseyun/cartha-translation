source:
  edition: WLC
  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: fr
  text: Yahweh est vivant ! Béni soit mon rocher ! Que le Dieu de mon salut soit exalté ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et le Dieu de mon salut est exalté ! »'
    reason: La forme hébraïque וְיָרוּם peut être comprise comme une acclamation volitive ou comme une affirmation déclarative.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahweh est vivant !
  rationale: חַי est employé comme prédicat avec le nom divin et proclame ici, dans un contexte de louange, que Yahweh est vivant. Cette formulation française naturelle n’introduit pas la valeur de serment de « Aussi vrai que Yahweh est vivant ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וּבָרוּךְ
  choice: Béni soit
  rationale: Dans cette acclamation de louange, le participe passif a une valeur de bénédiction. « Béni soit » garde le ton doxologique et soutenu.
- source_word: צוּרִי
  choice: mon rocher
  rationale: Le choix conserve directement la métaphore de צוּר, qui présente Dieu comme un appui solide et protecteur, sans la remplacer par une interprétation telle que « mon refuge ».
- source_word: וְיָרוּם
  choice: Que … soit exalté !
  rationale: L’imparfait hébreu peut avoir ici une nuance volitive ou acclamative, en parallèle avec « Béni soit ». La construction française rend clairement cette lecture tout en signalant en note la possibilité déclarative.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: le Dieu de mon salut
  rationale: Cette formulation respecte la construction génitivale hébraïque et présente Dieu comme la source du salut, sans expliciter davantage que le texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » en conserve la fonction de nom propre et évite de le remplacer par un titre.
- issue: Valeur de וְיָרוּם dans la formule de louange
  choice: 'Volitive ou acclamative : « Que le Dieu de mon salut soit exalté ! »'
  alternative: 'Déclarative : « le Dieu de mon salut est exalté »'
  rationale: Le parallélisme avec וּבָרוּךְ favorise une acclamation doxologique, mais la morphologie de l’imparfait permet aussi une compréhension déclarative. La note préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et poétique. Les trois exclamations brèves reproduisent l’élan de la louange hébraïque. La métaphore « mon rocher » et l’expression « le Dieu de mon salut » sont conservées formellement.
