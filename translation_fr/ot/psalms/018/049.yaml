id: PSA.18.49
reference: Psalms 18:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּ֤ן אוֹדְ/ךָ֖ בַ/גּוֹיִ֥ם יְהוָ֑ה וּ/לְ/שִׁמְ/ךָ֥ אֲזַמֵּֽרָה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/049.yaml
  text: Therefore I will give thanks to you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: fr
  text: C’est pourquoi je te rendrai grâce parmi les nations[a], Yahweh, et je chanterai les louanges de ton nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les peuples »; le terme hébreu peut aussi désigner les nations non israélites.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution exprime la conclusion tirée du contexte précédent; « C’est pourquoi » en conserve clairement la valeur déductive.
- source_word: אוֹדְךָ
  choice: je te rendrai grâce
  rationale: Le hifil de ידה, fréquent dans les psaumes, exprime ici l’action de remercier et de louer Dieu; cette formulation préserve aussi le suffixe de deuxième personne.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne largement les nations ou les peuples; « nations » convient au cadre du psaume et maintient sa portée internationale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: וּלְשִׁמְךָ
  choice: et … de ton nom
  rationale: Avec le verbe זמר, le français idiomatique dit « chanter les louanges de ton nom », tout en conservant la référence explicite au nom divin.
- source_word: אֲזַמֵּרָה
  choice: je chanterai les louanges
  rationale: Le piel de זמר évoque le chant ou la musique de louange; cette expression restitue sa dimension cultuelle et le parallélisme avec l’action de grâce.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le verset emploie directement le tétragramme; « Yahweh » en préserve le caractère de nom propre sans lui substituer un titre.
- issue: Portée de גּוֹיִם
  choice: les nations
  alternative: les païens; les non-Juifs; les peuples
  rationale: Dans son contexte hébreu, le terme peut désigner les nations étrangères sans imposer ici une qualification religieuse; le choix retenu préserve cette largeur de sens.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur rend les formes volitives/cohortatives du contexte comme une résolution de louer. L’adresse « Yahweh » est maintenue sans interjection ajoutée.
