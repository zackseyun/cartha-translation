source:
  edition: WLC
  text: אֶ֭מְחָצֵ/ם וְ/לֹא יֻ֣כְלוּ ק֑וּם יִ֝פְּל֗וּ תַּ֣חַת רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/038.yaml
  text: I crush them[a], and they cannot rise[b]; they fall beneath my feet.
translation:
  language: fr
  text: Je les écrase[a], et ils ne peuvent pas se relever[b] ; ils tombent sous mes pieds.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je les fracasse » ou « Je les abats » ; le verbe hébreu évoque un écrasement violent au combat.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ne peuvent pas tenir debout ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Je les écrase
  rationale: Le verbe מחץ exprime ici un coup violent qui écrase ou fracasse dans un contexte de combat. « Je les écrase » en conserve la force et reste naturel en français.
- source_word: וְלֹא יֻכְלוּ
  choice: et ils ne peuvent pas
  rationale: La coordination suivie de la négation et du verbe יכל exprime simplement l’incapacité ; cette formulation est concise et courante.
- source_word: קוּם
  choice: se relever
  rationale: Après « ne peuvent pas », קום décrit le fait de se remettre debout après avoir été abattu. « Se relever » rend clairement cette image, tandis que « tenir debout » demeure possible.
- source_word: יִפְּלוּ
  choice: ils tombent
  rationale: Le verbe נפל signifie directement « tomber ». Le présent convient au parallélisme poétique du verset.
- source_word: תַּחַת רַגְלָי
  choice: sous mes pieds
  rationale: Cette expression spatiale littérale évoque la défaite totale ; « sous mes pieds » est à la fois idiomatique et fidèle.
theological_decisions:
- issue: Violence guerrière dans un psaume royal
  choice: Conserver sans l’atténuer l’image martiale à la première personne
  alternative: Employer une formulation moins violente, comme « je les vaincs » ou « je les maîtrise »
  rationale: L’hébreu parle explicitement d’écrasement, d’incapacité à se relever et de chute sous les pieds. Atténuer ces images effacerait la force et le contexte guerrier du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en trois propositions et la violence concrète de l’hébreu sont conservés sans archaïsme.
