revisions:
- from: Alors la terre chancela et trembla ; les fondations des montagnes frémirent et chancelèrent, parce qu’il était en colère.[a]
  to: Alors la terre s’ébranla et trembla ; les fondations des montagnes frémirent et s’ébranlèrent, parce qu’il était en colère.[a]
  rationale: La révision remplace le verbe français moins adapté « chanceler » par « s’ébranler », qui exprime naturellement le bouleversement cosmique et préserve la reprise de געשׁ entre le début et la fin du verset. Elle corrige aussi la syntaxe de la note, sans modifier le sens ni résoudre de façon confessionnelle l’anthropopathisme de la colère divine.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:44:08Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la succession des quatre verbes de bouleversement et la relation causale de כִּי. Toutefois, « chanceler » évoque surtout une perte d’équilibre chez un être animé et est moins idiomatique pour la terre et les fondations que « s’ébranler ». La reprise de ce verbe dans les deux membres conserve de manière appropriée la cohésion produite par la répétition de געשׁ.
  naturalness: La formulation révisée est moderne, poétique et naturelle en français international. Le point-virgule marque clairement le parallélisme sans ajouter de relation logique absente du texte. La note actuelle contient en outre une construction maladroite (« … brûlait » qui suit…) qui est corrigée.
  terminology: « Terre », « fondations des montagnes », « frémirent » et « en colère » sont des choix appropriés. Le référent de « il » demeure contextualisé sans ajout doctrinal. La note conserve prudemment l’image de l’idiome hébreu sans prétendre lever toute nuance de חָרָה לוֹ.
  issues:
  - severity: medium
    issue: « Chancela/chancelèrent » est peu naturel pour les éléments cosmiques et affaiblit l’idée d’ébranlement violent.
    rationale: געשׁ désigne une agitation ou un ébranlement puissant. « S’ébranler » est idiomatique avec « la terre » et « les fondations », tout en permettant de reproduire la répétition lexicale du verset.
  - severity: low
    issue: La note est grammaticalement et stylistiquement maladroite.
    rationale: La relative « qui suit la métaphore » ne s’intègre pas correctement à la citation. Une formulation explicite rend mieux son statut d’alternative lexicale et d’explication idiomatique.
  revised_text: Alors la terre s’ébranla et trembla ; les fondations des montagnes frémirent et s’ébranlèrent, parce qu’il était en colère.[a]
