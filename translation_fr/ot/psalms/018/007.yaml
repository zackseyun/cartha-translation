base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/007.yaml
  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: fr
  text: Alors la terre s’ébranla et trembla ; les fondations des montagnes frémirent et s’ébranlèrent, parce qu’il était en colère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « parce que sa colère s’était enflammée », suivant l’image de l’idiome hébreu.'
    reason: Alternative lexicale préservant l’image idiomatique de חָרָה לוֹ.
lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: chancela
  rationale: Le verbe געשׁ évoque une agitation violente. « Chancela » exprime un mouvement puissant de la terre tout en permettant de reprendre le même verbe à la fin du parallélisme.
- source_word: וַתִּרְעַשׁ
  choice: trembla
  rationale: Le verbe רעשׁ désigne couramment un tremblement, notamment sismique. « La terre trembla » est naturel en français et reste distinct de « chancela ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le contexte théophanique et cosmique favorise « la terre » plutôt que le sens plus local de « pays ».
- source_word: מוֹסְדֵי הָרִים
  choice: les fondations des montagnes
  rationale: Cette expression conserve l’image poétique des montagnes reposant sur des assises profondes et respecte l’article défini hébreu.
- source_word: יִרְגָּזוּ
  choice: frémirent
  rationale: רגז décrit le tremblement ou l’agitation. « Frémirent » différencie ce mouvement des deux verbes voisins sans en atténuer la force dans le contexte.
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: chancelèrent
  rationale: La reprise de געשׁ renvoie au premier verbe du verset. Répéter « chancelèrent » préserve cette cohésion poétique et l’agitation des fondations.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici la cause du bouleversement cosmique ; « parce que » en rend clairement la valeur causale.
- source_word: חָרָה לוֹ
  choice: il était en colère
  rationale: L’expression idiomatique décrit une colère qui brûle. Cette formulation française actuelle transmet directement le sens, tandis que l’image littérale est conservée en note.
theological_decisions:
- issue: Description anthropopathique de la colère divine
  choice: parce qu’il était en colère
  alternative: parce que sa colère brûlait
  rationale: Le référent masculin est Dieu dans le contexte. La traduction affirme sa colère sans expliquer ni réduire la tension théologique de l’image hébraïque ; la note conserve sa métaphore du feu.
translation_notes:
  register: Français moderne, international et poétique. Le parallélisme verbal et la reprise de געשׁ sont conservés sans recourir à un vocabulaire archaïque.
