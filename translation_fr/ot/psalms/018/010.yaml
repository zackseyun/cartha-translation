source:
  edition: WLC
  text: וַ/יִּרְכַּ֣ב עַל כְּ֭רוּב וַ/יָּעֹ֑ף וַ֝/יֵּ֗דֶא עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/010.yaml
  text: And he rode on a cherub and flew[b][a]; he sped on the wings of the wind.
translation:
  language: fr
  text: Il chevaucha un chérubin et vola ; il s’élança[a] sur les ailes du vent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il fondit » ou « il vola à toute vitesse ». Le verbe hébreu est rare et semble désigner ici un mouvement aérien rapide.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut signifier « vent », « souffle » ou « esprit » ; ici, « vent » convient le mieux à l’image de la tempête.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: chevaucha
  rationale: Le verbe רכב exprime le fait de monter ou de se déplacer sur une monture. « Chevaucha » conserve ici l’image vive du chérubin servant de monture, sans la paraphraser.
- source_word: עַל
  choice: sur
  rationale: La préposition indique que le chérubin sert de support ou de monture ; « sur » est l’équivalent français naturel.
- source_word: כְּרוּב
  choice: chérubin
  rationale: Le singulier hébreu désigne un chérubin, créature céleste associée au trône divin. Le terme français traditionnel reste précis et compréhensible.
- source_word: וַיָּעֹף
  choice: s’envola
  rationale: Le verbe עוף signifie « voler ». La forme pronominale française rend naturellement le début du mouvement aérien dans cette suite narrative.
- source_word: וַיֵּדֶא
  choice: fila
  rationale: Ce verbe rare évoque vraisemblablement un déplacement aérien rapide, en parallèle avec « s’envola ». « Fila » exprime la vitesse sans imposer un mouvement descendant.
- source_word: כַּנְפֵי
  choice: les ailes de
  rationale: Le pluriel construit de כָּנָף signifie littéralement « ailes de ». Le maintien de cette métaphore respecte la poésie hébraïque.
- source_word: רוּחַ
  choice: vent
  rationale: רוּחַ peut signifier « vent », « souffle » ou « esprit ». Dans cette manifestation divine accompagnée d’éléments de tempête, « vent » convient le mieux.
theological_decisions:
- issue: Nature de l’image du chérubin
  choice: Conserver l’image concrète de Dieu chevauchant un chérubin.
  alternative: Interpréter explicitement le chérubin comme une métaphore des nuages d’orage ou de l’armée céleste.
  rationale: Le texte présente une image théophanique poétique sans en fournir lui-même une explication cosmologique. La conserver évite toute démythologisation ou précision doctrinale ajoutée.
- issue: Sens de רוּחַ dans l’expression finale
  choice: Traduire par « vent » dans le texte principal.
  alternative: « esprit » ou « souffle »
  rationale: Le contexte immédiat de tempête favorise « vent », tout en laissant reconnaître dans une note l’étendue sémantique du mot hébreu.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. « Chevaucha » préserve la force poétique de la scène, tandis que « fila » rend le mouvement rapide avec sobriété. Le parallélisme et l’image des « ailes du vent » sont maintenus.
