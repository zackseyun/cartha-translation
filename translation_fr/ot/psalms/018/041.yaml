  text: יְשַׁוְּע֥וּ וְ/אֵין מוֹשִׁ֑יעַ עַל יְ֝הוָ֗ה וְ/לֹ֣א עָנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/041.yaml
  text: They cried for help, but there was no savior; to the LORD, but he did not answer them.
translation:
  language: fr
  text: Ils ont crié au secours, mais il n’y avait pas de sauveur ; ils ont crié vers le SEIGNEUR, mais il ne leur a pas répondu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: Ils ont crié au secours
  rationale: Le verbe שׁוע exprime un appel pressant à l’aide. Cette tournure naturelle en français en restitue directement la force.
- source_word: מוֹשִׁיעַ
  choice: sauveur
  rationale: Le participe substantivé de ישׁע désigne celui qui sauve ou délivre. « Sauveur » conserve le terme personnel et le parallélisme avec l’appel au secours.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Conformément à l’usage français traditionnel pour le tétragramme, les petites capitales signalent le nom divin sans introduire une vocalisation incertaine.
- source_word: עָנָם
  choice: il ne leur a pas répondu
  rationale: Le verbe ענה signifie ici répondre ; le suffixe pluriel est rendu par « leur ».
theological_decisions:
- issue: La désignation de celui qui pourrait délivrer
  choice: sauveur
  alternative: personne pour les sauver
  rationale: « Sauveur » suit de près le participe hébreu et préserve la formulation théologiquement chargée sans préciser l’identité du sauveur absent.
- issue: L’absence de réponse divine
  choice: mais il ne leur a pas répondu
  alternative: sans qu’il leur réponde
  rationale: La proposition explicite respecte le contraste hébreu et n’explique pas la raison du silence divin.
translation_notes:
  register: Français moderne, clair et digne. La répétition de « ils ont crié » explicite l’ellipse après « vers le SEIGNEUR » tout en conservant le parallélisme et le contraste du verset.
