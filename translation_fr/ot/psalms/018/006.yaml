  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: fr
  text: Dans ma détresse, j’invoque Yahweh et, vers mon Dieu, je crie au secours. De son temple[a], il entend[b] ma voix, et mon cri devant lui parvient à ses oreilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Temple » peut aussi se traduire par « palais » ou « sanctuaire » ; le mot hébreu peut désigner la demeure d’un roi ou celle de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il entendra ma voix de son temple… mon cri devant lui parviendra à ses oreilles ». Les formes verbales hébraïques peuvent ici avoir une valeur future.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Dans ma détresse
  rationale: 'צַר désigne la détresse ou l’adversité, et לִי personnalise ici la situation : « ma détresse ».'
- source_word: אֶקְרָא
  choice: j’invoque
  rationale: Avec le nom divin comme complément, קרא exprime l’appel adressé à Dieu ; « invoquer » rend ce sens naturellement en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, sans lui substituer un titre.
- source_word: אֶל־אֱלֹהַי אֲשַׁוֵּעַ
  choice: je crie au secours vers mon Dieu
  rationale: שׁוע au piel exprime un appel pressant à l’aide, tandis que אֶל conserve l’orientation de ce cri vers Dieu.
- source_word: יִשְׁמַע
  choice: il entend
  rationale: L’inaccompli hébreu peut avoir une valeur présente, habituelle ou future ; le présent donne ici à la prière une immédiateté poétique sans exclure les autres nuances.
- source_word: מֵהֵיכָלוֹ
  choice: De son temple
  rationale: הֵיכָל peut désigner un temple, un sanctuaire ou un palais. En parlant de la demeure de Dieu, « temple » est clair tout en laissant ouverte la dimension céleste.
- source_word: קוֹלִי
  choice: ma voix
  rationale: קוֹל désigne naturellement la voix dans le contexte d’une prière prononcée.
- source_word: שַׁוְעָתִי
  choice: mon cri
  rationale: Le nom désigne un cri demandant de l’aide ; « mon cri » préserve le parallélisme poétique sans répétition pesante.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « devant sa face », c’est-à-dire en sa présence.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: parvient à ses oreilles
  rationale: Cette formulation garde l’image anthropomorphique des oreilles tout en rendant idiomatiquement le mouvement exprimé par בוא.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin. « Yahweh » le conserve comme nom propre plutôt que de le remplacer par un titre.
- issue: Valeur temporelle des inaccomplis יִשְׁמַע et תָּבוֹא
  choice: 'Présent poétique : « il entend… parvient »'
  alternative: 'Futur : « il entendra… parviendra »'
  rationale: La poésie hébraïque permet les deux lectures. Le présent exprime vivement la confiance du psalmiste, tandis qu’une note conserve explicitement la possibilité du futur.
translation_notes:
  register: Français international moderne, digne et accessible. « J’invoque » exprime l’appel adressé à Dieu ; « je crie au secours » explicite la demande d’aide. La syntaxe conserve le parallélisme et l’image concrète des oreilles sans devenir artificielle.
