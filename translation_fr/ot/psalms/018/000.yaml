  text: לַ/מְנַצֵּ֤חַ לְ/עֶ֥בֶד יְהוָ֗ה לְ/דָ֫וִ֥ד אֲשֶׁ֤ר דִּבֶּ֨ר לַ/יהוָ֗ה אֶת דִּ֭בְרֵי הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/י֤וֹם הִֽצִּיל יְהוָ֘ה אוֹת֥/וֹ מִ/כַּ֥ף כָּל אֹ֝יְבָ֗י/ו וּ/מִ/יַּ֥ד שָׁאֽוּל׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: fr
  text: Au chef de chœur. De David, serviteur de Yahweh[a], qui adressa à Yahweh les paroles de ce chant, le jour où Yahweh le délivra de la main de tous ses ennemis et de celle de Saül.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave de Yahweh ». Le mot hébreu peut désigner un serviteur ou un esclave ; il est ici employé comme titre honorifique de David.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: La formule désigne vraisemblablement le responsable de l’exécution musicale. Cette tournure traditionnelle reste claire et concise en français moderne.
- source_word: לְעֶבֶד יְהוָה
  choice: serviteur de Yahweh
  rationale: עֶבֶד peut désigner un serviteur ou un esclave. Dans ce titre honorifique appliqué à David, « serviteur » convient au contexte sans effacer l’autre valeur possible, signalée en note.
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, cette formulation peut exprimer l’auteur, l’appartenance ou l’association, sans imposer une précision absente de l’hébreu.
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה
  choice: Il adressa à Yahweh
  rationale: Le relatif hébreu renvoie à David. « Adressa à » exprime naturellement en français le fait de prononcer ce chant à l’intention de Yahweh.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: les paroles de ce chant
  rationale: Rendu direct et idiomatique de la désignation du cantique.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Conserve la construction temporelle hébraïque dans un français naturel.
- source_word: הִצִּיל
  choice: délivra
  rationale: Le verbe exprime ici l’arrachement à un danger ou à une domination; « délivra » convient au registre des Psaumes.
- source_word: מִכַּף כָּל אֹיְבָיו
  choice: du pouvoir de tous ses ennemis
  rationale: כַּף, littéralement « paume/main », forme ici une image idiomatique désignant le pouvoir ou l’emprise. Le sens est rendu explicitement afin d’éviter une répétition lourde tout en conservant « main » dans le membre parallèle.
- source_word: וּמִיַּד שָׁאוּל
  choice: et de la main de Saül
  rationale: Préserve l’image hébraïque et le relief particulier donné à Saül après l’ensemble des ennemis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte le nom divin personnel. « Yahweh » le translittère au lieu de lui substituer un titre.
- issue: Sens de עֶבֶד dans le titre de David
  choice: serviteur
  alternative: esclave
  rationale: Le terme évoque une relation d’appartenance et de service, mais fonctionne ici comme un titre honorifique. « Serviteur » convient donc au contexte, tandis que l’alternative littérale est conservée en note.
- issue: Rapport exprimé par לְדָוִד
  choice: De David
  alternative: Pour David; appartenant à David
  rationale: La préposition peut couvrir plusieurs rapports. La formulation française retenue maintient l’ambiguïté conventionnelle du titre sans trancher davantage la question de l’auteur ou de l’usage.
translation_notes:
  register: Français international moderne, digne et accessible. Le titre conserve sa forme nominale traditionnelle. L’alternance entre « pouvoir » et « main » rend l’idiome hébreu intelligible tout en préservant son image et le parallélisme.
