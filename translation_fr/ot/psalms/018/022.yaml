  text: For all his judgments were before me[a], and I did not put away his statutes from me.
translation:
  language: fr
  text: Car tous ses jugements étaient devant moi, et je n’ai pas écarté de moi ses prescriptions[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne me suis pas détourné de ses prescriptions ». Le verbe hébreu peut évoquer soit le fait d’écarter les prescriptions loin de soi, soit celui de s’en détourner ; le texte retient le sens transitif le plus direct de la forme verbale, avec « de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de l’affirmation précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: כָל מִשְׁפָּטָיו
  choice: tous ses jugements
  rationale: Préserve la portée globale de כָל et la nuance à la fois judiciaire et normative de מִשְׁפָּט dans le contexte de l’alliance.
- source_word: לְנֶגְדִּי
  choice: devant moi
  rationale: Rend directement l’image spatiale hébraïque et suggère que le psalmiste gardait ces jugements présents à l’esprit.
- source_word: וְחֻקֹּתָיו
  choice: et ses prescriptions
  rationale: « Prescriptions » exprime des dispositions fixées et normatives, tout en restant clair en français international moderne.
- source_word: לֹא אָסִיר מֶנִּי
  choice: je n’ai pas écarté de moi
  rationale: Conserve la construction causative et transitive du hifil de סור ainsi que le complément explicite « de moi », sans effacer la possibilité contextuelle de comprendre que le psalmiste ne s’en est pas détourné.
