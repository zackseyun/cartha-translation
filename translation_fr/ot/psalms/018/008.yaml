  text: עָ֘לָ֤ה עָשָׁ֨ן בְּ/אַפּ֗/וֹ וְ/אֵשׁ מִ/פִּ֥י/ו תֹּאכֵ֑ל גֶּ֝חָלִ֗ים בָּעֲר֥וּ מִמֶּֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/008.yaml
  text: Smoke rose from his nostrils[a], and fire from his mouth consumed; coals blazed from him.
translation:
  language: fr
  text: De ses narines montait de la fumée[a], et de sa bouche un feu dévorait ; des braises brûlaient de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa colère ». Le mot hébreu peut désigner le nez ou les narines, mais aussi, par extension, la colère. Ici, le parallèle avec « de sa bouche » favorise l’image concrète.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָשָׁן
  choice: montait de la fumée
  rationale: עָלָה exprime un mouvement ascendant. L’imparfait français convient à la description poétique et « monter » s’emploie naturellement avec la fumée.
- source_word: בְּאַפּוֹ
  choice: de ses narines
  rationale: אַף peut désigner le nez ou, par métonymie, la colère. Le parallélisme avec « de sa bouche » favorise ici l’image corporelle concrète ; le pluriel « narines » est naturel en français.
- source_word: מִפִּיו תֹּאכֵל
  choice: de sa bouche sortait un feu dévorant
  rationale: Le texte présente le feu venant de sa bouche, puis emploie תֹּאכֵל, littéralement « mangeait/dévorait ». « Un feu dévorant » conserve cette force active dans une formulation française naturelle.
- source_word: גֶּחָלִים בָּעֲרוּ
  choice: des braises jaillissaient
  rationale: גֶּחָלִים désigne des braises ou charbons ardents, et בָּעֲרוּ leur embrasement. Dans ce contexte d’émission de feu, « jaillissaient » rend avec vigueur l’image, tout en laissant « braises » exprimer leur caractère incandescent.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: Traduction directe de la provenance exprimée par מִן avec le pronom suffixe, sans préciser davantage la nature de cette sortie.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu dans une théophanie
  choice: Conserver les images corporelles « narines » et « bouche »
  alternative: Rendre אַף par « colère » et atténuer l’anthropomorphisme
  rationale: La poésie théophanique associe délibérément fumée, narines, bouche et feu. Maintenir cette image respecte le parallélisme et évite de remplacer le tableau concret par une interprétation abstraite.
translation_notes:
  register: Français moderne, international et poétique, avec une syntaxe accessible. L’imparfait unifie la scène descriptive ; « feu dévorant » garde la valeur active du verbe hébreu sans produire une tournure française maladroite.
