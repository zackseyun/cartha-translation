  source_fidelity: 'La première proposition et l’image anthropomorphique sont fidèlement rendues : « De ses narines montait de la fumée » reflète bien עָלָה עָשָׁן בְּאַפּוֹ. La note préserve correctement l’alternative lexicale de אַף. En revanche, « jaillissaient » ajoute une idée de projection absente de בָּעֲרוּ, qui signifie « brûlaient / s’embrasaient ».'
