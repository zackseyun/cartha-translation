id: PSA.18.29
reference: Psalms 18:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי בְ֭/ךָ אָרֻ֣ץ גְּד֑וּד וּ֝/בֵֽ/אלֹהַ֗/י אֲדַלֶּג שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: fr
  text: Car, grâce à toi, je me rue sur une troupe[a] ; grâce à mon Dieu, je franchis d’un bond une muraille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je cours contre une bande de pillards ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je saute par-dessus un rempart ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication ou le fondement de la louange qui précède.
- source_word: בְךָ
  choice: grâce à toi
  rationale: La préposition בְּ exprime ici le moyen ou l’aide reçue. « Grâce à toi » rend naturellement en français l’action rendue possible par Dieu.
- source_word: אָרֻץ
  choice: je me rue sur
  rationale: Le verbe רוץ signifie « courir » ; dans ce contexte militaire, il évoque une charge rapide contre un adversaire, sans abandonner l’image concrète de la course.
- source_word: גְּדוּד
  choice: une troupe
  rationale: גְּדוּד désigne une troupe ou une bande armée, souvent engagée dans un raid. « Troupe » reste clair sans en faire une armée entière.
- source_word: וּבֵאלֹהַי
  choice: grâce à mon Dieu
  rationale: Reprend parallèlement l’idée du moyen ou de l’aide divine tout en conservant la confession personnelle « mon Dieu ».
- source_word: אֲדַלֶּג
  choice: je franchis d’un bond
  rationale: Le verbe דלג signifie « bondir, sauter ». Cette tournure française conserve à la fois le mouvement et l’idée de surmonter l’obstacle.
- source_word: שׁוּר
  choice: une muraille
  rationale: שׁוּר désigne un mur, particulièrement dans un cadre défensif. « Muraille » convient à l’image militaire sans préciser indûment le type de fortification.
theological_decisions:
- issue: Nature des images militaires du verset
  choice: Conserver les images concrètes d’une charge contre une troupe et du franchissement d’une muraille comme témoignage de la puissance accordée par Dieu.
  alternative: Généraliser le texte en parlant simplement des obstacles de la vie.
  rationale: L’hébreu emploie des termes militaires explicites. Les conserver évite de spiritualiser le texte, tout en laissant ouverte son application plus large.
- issue: Nuance des formes verbales אָרֻץ et אֲדַלֶּג
  choice: Employer le présent français, qui peut exprimer ici l’action rendue possible par Dieu.
  alternative: Expliciter la capacité par « je peux me ruer » et « je peux franchir » ou employer un futur.
  rationale: Les formes hébraïques à l’inaccompli permettent une nuance modale ou habituelle sans imposer à elles seules un auxiliaire de capacité. Le parallèle avec « grâce à toi / grâce à mon Dieu » fait déjà ressortir l’habilitation divine.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme hébreu est conservé par la reprise de « grâce à », et les images militaires restent concrètes.
