source:
  edition: WLC
  text: מְלַמֵּ֣ד יָ֭דַ/י לַ/מִּלְחָמָ֑ה וְֽ/נִחֲתָ֥ה קֶֽשֶׁת נְ֝חוּשָׁ֗ה זְרוֹעֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: fr
  text: Il entraîne mes mains au combat, et mes bras peuvent bander un arc de bronze.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « un arc de bronze est bandé par mes bras ». La proposition hébraïque est difficile et peut se comprendre dans un sens passif plus littéral.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: entraîne
  rationale: Le participe de למד signifie « enseigner, former ». Dans ce contexte guerrier, « entraîne » exprime naturellement une préparation pratique au combat.
- source_word: יָדַי
  choice: mes mains
  rationale: Le pluriel concret est conservé afin de préserver l’image corporelle du texte hébreu.
- source_word: לַמִּלְחָמָה
  choice: au combat
  rationale: מלחמה peut désigner la guerre ou le combat. Ici, « au combat » s’accorde naturellement avec l’entraînement des mains.
- source_word: וְנִחֲתָה
  choice: peuvent bander
  rationale: La forme verbale et la syntaxe de cette proposition sont difficiles. Cette formulation rend l’idée d’une capacité reçue, tout en laissant la traduction passive plus formelle en note.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: un arc de bronze
  rationale: « Arc » est le sens usuel de קשת, et « bronze » rend de façon conventionnelle נחושה dans le contexte d’une arme particulièrement résistante.
- source_word: זְרוֹעֹתָי
  choice: mes bras
  rationale: Le pluriel littéral est maintenu et désigne les membres qui bandent l’arc.
theological_decisions:
- issue: Interprétation de la proposition difficile וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: « mes bras peuvent bander un arc de bronze »
  alternative: « un arc de bronze est bandé par mes bras »
  rationale: La traduction principale exprime avec naturel la force accordée au psalmiste et correspond au parallélisme sur la préparation au combat. La note conserve toutefois la valeur passive plus formelle possible, sans trancher silencieusement une syntaxe hébraïque difficile.
translation_notes:
  register: Français international moderne, naturel et digne. « Bander un arc » est l’expression française précise pour tendre sa corde avant de tirer; la formulation conserve les images concrètes des mains, des bras et de l’arc.
