source:
  edition: WLC
  text: אֶרְדּ֣וֹף א֭וֹיְבַ/י וְ/אַשִּׂיגֵ֑/ם וְ/לֹֽא אָ֝שׁוּב עַד כַּלּוֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: fr
  text: J’ai poursuivi mes ennemis et je les ai rattrapés ; je n’ai pas fait demi-tour jusqu’à leur destruction complète[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « jusqu’à leur achèvement » ou « jusqu’à ce qu’ils soient consumés ».
    reason: L’infinitif construit hébreu exprime l’achèvement de leur destruction, sans préciser explicitement l’agent dans cette dernière expression.
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: J’ai poursuivi
  rationale: Le qal inaccompli à la 1re personne du singulier s’inscrit ici dans un récit poétique de victoire. Le passé composé rend naturellement en français moderne cette action passée.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Traduction directe et courante du nom avec suffixe de 1re personne du singulier.
- source_word: וְאַשִּׂיגֵם
  choice: et je les ai rattrapés
  rationale: Le hifil de נשׂג désigne le fait d’atteindre ou de rejoindre ceux que l’on poursuit. « Rattraper » restitue clairement l’image de la poursuite.
- source_word: וְלֹא אָשׁוּב
  choice: je ne suis pas revenu
  rationale: שׁוב signifie revenir ou faire demi-tour. « Revenir » conserve la formulation spatiale du texte tout en indiquant que le locuteur n’a pas interrompu la poursuite.
- source_word: עַד כַּלּוֹתָם
  choice: avant qu’ils soient anéantis
  rationale: עַד marque le terme de l’action, tandis que l’infinitif de כלה avec suffixe exprime leur fin complète. Cette tournure française rend l’issue totale sans ajouter explicitement un agent que l’hébreu laisse implicite.
theological_decisions:
- issue: Violence et agent implicite dans la proposition finale
  choice: avant qu’ils soient anéantis
  alternative: jusqu’à ce que je les aie entièrement détruits
  rationale: Le verset célèbre une victoire militaire totale et ne doit pas être atténué. Cependant, l’hébreu ne désigne pas explicitement l’agent de l’anéantissement dans la dernière expression ; la formulation passive préserve cette retenue.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé convient à la narration poétique actuelle ; le parallélisme des actions est conservé, ainsi que la force militaire du verset.
