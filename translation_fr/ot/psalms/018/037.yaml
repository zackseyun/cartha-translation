revisions:
- from: J’ai poursuivi mes ennemis et je les ai rattrapés ; je ne suis pas revenu avant qu’ils soient anéantis[a].
  to: J’ai poursuivi mes ennemis et je les ai rattrapés ; je n’ai pas fait demi-tour jusqu’à leur destruction complète[a].
  rationale: La révision restitue la valeur terminative de עַד par « jusqu’à », précise naturellement le mouvement de שוב dans le cadre d’une poursuite, et conserve l’agent implicite de כַּלּוֹתָם. La note indique une alternative littérale sans imposer une interprétation de l’agent.
