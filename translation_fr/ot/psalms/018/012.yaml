  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: fr
  text: De l’éclat devant lui, ses nuages passèrent — grêle et charbons ardents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De l’éclat devant lui passèrent ses nuages épais, la grêle et les charbons ardents. » L’hébreu est compact et très poétique ; la relation syntaxique exacte entre les nuages, la grêle et les charbons ardents peut être comprise de plusieurs manières.'
    reason: Alternative syntaxique et lexicale due à la formulation poétique compacte de l’hébreu.
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: De l’éclat
  rationale: נֹגַהּ désigne un éclat ou une lumière rayonnante. « De l’éclat » rend le préfixe מִן et convient à la manifestation divine décrite dans la tempête.
- source_word: נֶגְדּוֹ
  choice: qui était devant lui
  rationale: נֶגֶד avec le suffixe de troisième personne signifie « devant lui ». L’ajout de « qui était » relie naturellement le complément à « l’éclat » en français sans transformer l’expression en notion abstraite de présence.
- source_word: עָבָיו
  choice: ses nuages
  rationale: Le terme peut évoquer des nuages épais ou une masse nuageuse. « Ses nuages » conserve le suffixe possessif et la concision poétique.
- source_word: עָבְרוּ
  choice: passèrent
  rationale: Le qal pluriel de עבר signifie passer, traverser ou défiler. « Passèrent » respecte l’accord avec « ses nuages » tout en préservant l’indétermination de leur mouvement exact.
- source_word: בָּרָד
  choice: grêle
  rationale: Équivalent français direct du terme météorologique hébreu.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: et charbons ardents
  rationale: La construction signifie littéralement « charbons de feu ». « Charbons ardents » est une expression française naturelle qui conserve l’image vive de braises enflammées.
theological_decisions:
- issue: Imagerie poétique d’une manifestation divine dans la tempête
  choice: Conserver sans explication l’éclat, les nuages, la grêle et les charbons ardents comme éléments de la manifestation divine.
  alternative: Réduire ces images à une simple métaphore de victoire militaire, ou les développer en description explicite d’un miracle météorologique littéral.
  rationale: L’hébreu présente une scène poétique dense sans préciser le rapport exact entre image et événement. La traduction maintient cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le deux-points préserve la juxtaposition abrupte du texte poétique; « charbons ardents » est plus idiomatique en français que le calque « charbons de feu ».
