  text: וַ/יִּשְׁלַ֣ח חִ֭צָּי/ו וַ/יְפִיצֵ֑/ם וּ/בְרָקִ֥ים רָ֝ב וַ/יְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: fr
  text: Il lança ses flèches et les dispersa ; par de nombreux éclairs[a], il les mit en déroute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il lança ses flèches et les dispersa ; il multiplia les éclairs et les mit en déroute. » L’hébreu peut exprimer ici soit l’abondance des éclairs, soit leur multiplication.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il lança
  rationale: Dans cette scène guerrière, שׁלח décrit l’envoi de projectiles. « Lança » exprime naturellement en français la projection des flèches sans ajouter l’idée plus précise de tirer à l’arc.
- source_word: חִצָּיו
  choice: ses flèches
  rationale: חֵץ désigne une flèche ; le pluriel avec suffixe masculin singulier signifie directement « ses flèches ».
- source_word: וַיְפִיצֵם
  choice: et les dispersa
  rationale: Le verbe exprime l’action de disperser ou d’éparpiller. Le pronom pluriel renvoie le plus naturellement aux ennemis évoqués par le contexte.
- source_word: וּבְרָקִים
  choice: par […] éclairs
  rationale: בְּרָקִים est le pluriel de « éclair ». La préposition ב־ est rendue instrumentalement par « par », en parallèle avec les flèches comme armes du guerrier divin.
- source_word: רָב
  choice: de nombreux
  rationale: La forme peut exprimer ici l’abondance, soit adjectivalement (« de nombreux éclairs »), soit avec une nuance verbale. La formulation retenue est naturelle et laisse la variante en note.
- source_word: וַיְהֻמֵּם
  choice: il les mit en déroute
  rationale: המם signifie jeter dans la confusion ou la panique, notamment au combat. « Mettre en déroute » rend avec concision l’effet militaire sans impliquer nécessairement leur destruction.
theological_decisions:
- issue: Référent des suffixes pluriels dans « les dispersa » et « les mit en déroute »
  choice: Les pronoms renvoient aux ennemis de David, compris d’après le contexte plus large.
  alternative: Les pronoms pourraient être rattachés aux flèches ou aux éclairs, compris comme dispersés dans toutes les directions.
  rationale: Dans l’image de YHWH comme guerrier, les flèches et les éclairs sont les moyens par lesquels les ennemis sont dispersés et jetés dans la confusion. Cette lecture correspond mieux à l’emploi militaire de המם.
- issue: Fonction de רָב
  choice: 'Valeur quantitative : « de nombreux éclairs ».'
  alternative: 'Valeur verbale : « il multiplia les éclairs ».'
  rationale: L’hébreu est concis et permet de comprendre רָב comme l’expression de l’abondance ou comme une forme à valeur verbale. Le texte principal privilégie une construction française naturelle, tandis que la note préserve l’autre analyse.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme en deux membres et l’imagerie du guerrier divin sont conservés. « Mettre en déroute » communique à la fois la confusion et la débâcle militaire.
