lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est concis, naturel et dignifié ; la préposition ל est rendue par « au », sans exclure une nuance de destination ou de dédicace.
- source_word: לִבְנֵי
  choice: Des fils de
  rationale: La préposition ל peut marquer ici l’appartenance, l’attribution ou la destination. « Des fils de Coré » conserve mieux cette indétermination que « par » ou « pour ».
- source_word: קֹרַח
  choice: Coré
  rationale: « Coré » est la forme française biblique traditionnelle et largement reconnue de ce nom propre.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: מִזְמוֹר est le terme générique courant pour un chant accompagné de musique. « Psaume » en est l’équivalent français établi et convient au style bref d’un titre.
