  text: תָּ֭בוֹא עַד דּ֣וֹר אֲבוֹתָ֑י/ו עַד נֵ֝֗צַח לֹ֣א יִרְאוּ אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: fr
  text: Il ira[a] jusqu’à la génération de ses ancêtres[b] ; ils ne reverront jamais la lumière[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu présente une tension de personne et de nombre : le premier verbe est écrit à la 2e personne du masculin singulier (« tu iras/viendras »), tandis que le second est au pluriel (« ils verront »). Le contexte permet de comprendre le premier comme renvoyant à l’homme dont il est question, mais le changement de perspective demeure dans le texte hébreu.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement « la génération de ses pères » ; il s’agit ici de ses ancêtres.
    reason: lexical_alternative
  - marker: c
    text: « Voir la lumière » est une expression hébraïque évoquant l’expérience de la vie ; dans ce contexte, elle décrit la condition définitive des morts, qui ne reviendront plus à la vie dans ce monde.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: il ira
  rationale: La forme massorétique est un imparfait qal à la 2e personne du masculin singulier (« tu viendras/iras »), mais le contexte poursuit le sort de l’homme prospère à la 3e personne. « Il ira » suit ce fil discursif sans masquer la difficulté, signalée en note.
- source_word: עַד
  choice: vers
  rationale: Devant « la génération de ses pères », la préposition indique ici la destination ou le terme du mouvement. « Vers » conserve cette valeur sans imposer le sens temporel « jusqu’à ».
- source_word: דּוֹר
  choice: génération
  rationale: Le mot désigne couramment une génération et évoque ici le groupe des ancêtres décédés auquel l’homme va être réuni.
- source_word: אֲבוֹתָיו
  choice: ses pères
  rationale: Traduction formelle du terme hébreu, qui désigne dans ce contexte ses prédécesseurs familiaux, c’est-à-dire ses ancêtres.
- source_word: עַד נֵצַח
  choice: jamais
  rationale: Avec la négation et le verbe qui suit, l’expression marque une non-réalisation définitive. En français, « jamais » rend naturellement cette portée.
- source_word: לֹא יִרְאוּ
  choice: ils ne reverront
  rationale: Le verbe hébreu est à la 3e personne du masculin pluriel. « Revoir » exprime en français l’idée de ne plus retourner à la lumière de la vie, tout en conservant explicitement le pluriel transmis.
- source_word: אוֹר
  choice: la lumière
  rationale: La traduction conserve l’image hébraïque, qui peut désigner la lumière au sens propre et, idiomatiquement, l’expérience de la vie.
theological_decisions:
- issue: Changement de personne et de nombre dans le verset
  choice: Le texte principal emploie d’abord le singulier (« Il ira »), puis le pluriel (« ils ne reverront »).
  alternative: Traduire tout au singulier (« Il ira… il ne reverra jamais ») ou conserver la 2e personne au début (« Tu iras… »).
  rationale: תָּבוֹא est morphologiquement à la 2e personne du masculin singulier, tandis que יִרְאוּ est à la 3e personne du masculin pluriel. Le contexte favorise une référence initiale à l’homme prospère ; le pluriel final présente ensuite le sort collectif des morts. La traduction garde ce déplacement au lieu de l’uniformiser.
- issue: Portée de l’image « voir la lumière »
  choice: Conserver l’expression imagée « revoir la lumière » dans le texte et en expliquer le sens en note.
  alternative: Expliciter directement « ils ne reviendront jamais à la vie ».
  rationale: Le texte hébreu parle de lumière. Garder cette métaphore préserve sa force poétique et évite de réduire l’énoncé à une formulation doctrinale plus précise que l’original.
translation_notes:
  register: Français international moderne, sobre et poétique. « Ses pères » conserve le lexique familial du texte, avec clarification en note. Le point-virgule rend lisible le passage du destin individuel au sort collectif.
