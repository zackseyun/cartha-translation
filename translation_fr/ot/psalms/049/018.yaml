  text: כִּֽי נַ֭פְשׁ/וֹ בְּ/חַיָּ֣י/ו יְבָרֵ֑ךְ וְ֝/יוֹדֻ֗/ךָ כִּי תֵיטִ֥יב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: fr
  text: Car, durant sa vie, il s’estime heureux[a], et l’on te félicite quand tu réussis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme se bénit durant sa vie » ; ou : « il se considère comme béni tant qu’il vit ».'
    reason: Préserve l’expression hébraïque avec נֶפֶשׁ et signale l’autre rendu possible de sa valeur réflexive.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: נַפְשׁוֹ
  choice: il
  rationale: נֶפֶשׁ désigne ici idiomatiquement la personne elle-même. Le pronom français rend naturellement cette valeur réflexive sans suggérer une âme distincte qui agirait.
- source_word: בְּחַיָּיו
  choice: durant sa vie
  rationale: Rend directement la portée temporelle de l’expression hébraïque.
- source_word: יְבָרֵךְ
  choice: s’estime heureux
  rationale: 'Le verbe a ici vraisemblablement une valeur réflexive : l’homme se considère comme béni ou heureux. Cette formulation reste claire et digne en français moderne.'
- source_word: וְיוֹדֻךָ
  choice: et l’on te félicite
  rationale: Le pluriel hébreu a un sujet humain indéfini. « L’on » le rend naturellement, tandis que « félicite » exprime l’approbation sociale liée à la réussite.
- source_word: כִּי
  choice: quand
  rationale: Introduit la circonstance dans laquelle les autres expriment leur approbation.
- source_word: תֵיטִיב לָךְ
  choice: tu réussis
  rationale: Dans le contexte de richesse et de prospérité, l’expression signifie que tout va bien pour la personne ou qu’elle prospère. « Tu réussis » est naturel sans lui attribuer explicitement une valeur morale.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passage de la troisième personne (« il ») à la deuxième (« te », « tu ») est conservé, comme dans l’hébreu.
