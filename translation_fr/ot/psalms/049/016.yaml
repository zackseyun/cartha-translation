source:
  edition: WLC
  text: אַל תִּ֭ירָא כִּֽי יַעֲשִׁ֣ר אִ֑ישׁ כִּֽי יִ֝רְבֶּה כְּב֣וֹד בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: fr
  text: Ne crains pas lorsqu’un homme s’enrichit, lorsque la gloire de sa maison[a] augmente ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa maisonnée » ou « son domaine » ; le mot hébreu traduit par « maison » peut aussi désigner la famille et les biens qui lui sont attachés.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Ne crains pas
  rationale: אַל suivi de l’imparfait exprime ici une défense. « Ne crains pas » est concis, naturel et conserve le registre poétique.
- source_word: כִּי
  choice: lorsque
  rationale: Dans ses deux occurrences, כִּי introduit la circonstance qui ne doit pas susciter la crainte plutôt qu’une cause.
- source_word: יַעֲשִׁר
  choice: s’enrichit
  rationale: 'Le hiphil de עשר a ici un sens intransitif : devenir riche. « S’enrichit » est idiomatique et digne en français contemporain.'
- source_word: אִישׁ
  choice: un homme
  rationale: Cette traduction conserve le masculin singulier et le caractère proverbial de l’hébreu.
- source_word: יִרְבֶּה
  choice: augmente
  rationale: רבה signifie devenir nombreux ou grand, augmenter ; avec כָּבוֹד comme sujet, « augmente » est clair et naturel.
- source_word: כְּבוֹד
  choice: la gloire
  rationale: « Gloire » préserve l’image hébraïque, qui peut englober prestige, splendeur et abondance sans la réduire à la seule richesse matérielle.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: בַּיִת peut désigner la maison, la maisonnée ou le domaine. « Sa maison » conserve l’image du texte, tandis que la note signale l’étendue sémantique.
