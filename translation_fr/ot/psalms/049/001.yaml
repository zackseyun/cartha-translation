lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif pluriel de שׁמע. « Écoutez » exprime naturellement en français l’appel à entendre avec attention tout en conservant la force directe de l’impératif.
- source_word: זֹאת
  choice: ceci
  rationale: Le démonstratif renvoie à l’enseignement ou à la proclamation qui va suivre.
- source_word: כָּל הָעַמִּים
  choice: vous tous, peuples
  rationale: Le pluriel עַמִּים désigne largement les peuples. La tournure vocative rend clairement l’adresse universelle sans la réduire aux États-nations.
- source_word: הַאֲזִינוּ
  choice: prêtez l’oreille
  rationale: Cet impératif appelle à une écoute attentive. « Prêtez l’oreille » garde le registre poétique et le parallélisme avec « Écoutez » tout en restant aisément compréhensible.
- source_word: כָּל יֹשְׁבֵי
  choice: vous tous qui habitez
  rationale: La construction participiale désigne tous ceux qui résident dans un lieu. Cette formulation est plus naturelle en français moderne que « tous les habitants de » dans ce parallélisme d’adresse directe.
- source_word: חָלֶד
  choice: le monde
  rationale: חָלֶד peut désigner le monde où vivent les humains ou le domaine terrestre. Ici, l’appel universel favorise « le monde », sans exclure la traduction « la terre » ni imposer au texte la nuance possible de caractère passager.
