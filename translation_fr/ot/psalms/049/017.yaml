source:
  edition: WLC
  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: fr
  text: Car, à sa mort, il n’emportera rien[a] ; sa gloire[b] ne descendra pas après lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne prendra pas le tout » ; dans ce contexte, l’expression signifie qu’il n’emportera rien.'
    reason: lexical_alternative
  - marker: b
    text: « Sa gloire » peut aussi désigner son honneur, son prestige, sa splendeur ou sa richesse.
    reason: lexical_alternative
  - marker: c
    text: La descente évoque probablement la mort, la tombe ou le séjour des morts, sans que l’hébreu précise la destination.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: בְמוֹתוֹ
  choice: à sa mort
  rationale: La préposition בְּ a ici une valeur temporelle ; cette formulation est naturelle et concise en français.
- source_word: יִקַּח הַכֹּל
  choice: il n’emportera rien
  rationale: Sous la négation, l’expression littérale « il ne prendra pas le tout » signifie qu’il n’en prendra rien. « Emporter » rend naturellement l’idée de prendre avec soi au moment de mourir.
- source_word: יֵרֵד אַחֲרָיו
  choice: ne descendra pas après lui
  rationale: Conserve l’image concrète de la descente et laisse implicite sa destination, comme en hébreu.
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: Préserve l’étendue sémantique de כָּבוֹד, qui peut évoquer la gloire, l’honneur, le prestige ou la richesse.
theological_decisions:
- issue: Destination implicite de la descente après la mort
  choice: Conserver « descendra » sans préciser la destination.
  alternative: « ne le suivra pas dans la tombe » ou « ne descendra pas avec lui au séjour des morts »
  rationale: Le contexte évoque la mort, la tombe ou le séjour des morts, mais l’hébreu ne nomme aucune destination ; la préciser résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. « Emportera » est idiomatique dans le contexte de la mort, tandis que « descendra après lui » conserve l’image et l’ambiguïté du texte hébreu.
