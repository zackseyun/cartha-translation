id: PSA.49.8
reference: Psalms 49:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: fr
  text: Car le prix du rachat de leur vie est élevé, et il faut y renoncer pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé. On peut aussi comprendre : « cela cesse pour toujours » ou « il ne pourra jamais suffire ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: est élevé
  rationale: Le terme exprime ici le caractère précieux ou coûteux du prix à payer. « Le prix… est élevé » est naturel en français et évite d'ajouter explicitement l'idée de prix excessif.
- source_word: פִּדְיוֹן
  choice: le prix du rachat
  rationale: Le nom désigne le prix versé pour obtenir une libération. Cette formulation conserve plus précisément la dimension transactionnelle que le seul mot « rachat ».
- source_word: נַפְשָׁם
  choice: leur vie
  rationale: Dans ce contexte de délivrance face à la mort, נֶפֶשׁ désigne la vie ou la personne vivante, sans imposer le sens plus restreint d'une âme immatérielle.
- source_word: וְחָדַל
  choice: il faut y renoncer
  rationale: Le verbe signifie cesser, s'arrêter ou renoncer. La proposition hébraïque étant elliptique, cette tournure française intelligible conserve l'idée que l'entreprise de rachat doit être abandonnée.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: La locution exprime ici une cessation permanente et se rend directement par « pour toujours ».
theological_decisions:
- issue: Sens de נֶפֶשׁ dans le contexte du rachat et de la mortalité
  choice: vie
  alternative: âme
  rationale: Le psaume traite de l'impossibilité pour un être humain de soustraire une vie à la mort. « Vie » convient au contexte sans introduire une anthropologie dualiste que le mot hébreu n'exige pas.
- issue: Interprétation de la proposition elliptique וְחָדַל לְעוֹלָם
  choice: il faut y renoncer pour toujours
  alternative: cela cesse pour toujours ; il ne pourra jamais suffire
  rationale: L'hébreu ne précise ni le sujet ni tout le rapport logique. Le texte principal garde le sens fondamental de cessation sans transformer explicitement la proposition en affirmation de suffisance; la note signale les autres compréhensions possibles.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste claire tout en préservant dans une note l'ambiguïté réelle de la dernière proposition hébraïque.
