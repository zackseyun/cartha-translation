id: PSA.49.10
reference: Psalms 49:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: fr
  text: Car il voit que les sages meurent ; ensemble, l’insensé et l’homme sans raison périssent, et ils laissent leurs richesses à d’autres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs biens », « leur fortune » ou « leurs ressources » ; le mot hébreu peut désigner l’ensemble de ce qu’ils possèdent.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la réflexion précédente et conserve naturellement le lien logique.
- source_word: יִרְאֶה
  choice: il voit
  rationale: Le qal inaccompli à la 3e personne du masculin singulier est rendu au présent pour exprimer une constatation générale.
- source_word: חֲכָמִים
  choice: les sages
  rationale: Le substantif adjectival pluriel désigne une catégorie humaine représentative ; « les sages » est naturel et fidèle en français.
- source_word: יָמוּתוּ
  choice: meurent
  rationale: Le présent exprime la vérité générale de la mortalité.
- source_word: יַחַד
  choice: ensemble
  rationale: Souligne le destin commun des deux types humains mentionnés ensuite.
- source_word: כְּסִיל
  choice: l’insensé
  rationale: Terme sapientiel désignant une personne à la fois moralement et intellectuellement dépourvue de discernement.
- source_word: בַעַר
  choice: l’homme sans raison
  rationale: Rend l’idée d’une personne abrutie, dépourvue de discernement, sans employer en français moderne le peu naturel « homme bestial ».
- source_word: יֹאבֵדוּ
  choice: périssent
  rationale: Conserve la nuance de disparition ou de ruine, au-delà du simple fait de mourir.
- source_word: וְעָזְבוּ
  choice: et ils laissent
  rationale: Exprime simplement le fait de laisser derrière soi ses biens à sa mort.
- source_word: לַאֲחֵרִים
  choice: à d’autres
  rationale: Reproduit l’indétermination de l’hébreu sans renforcer le sens en « étrangers ».
- source_word: חֵילָם
  choice: leurs richesses
  rationale: Dans ce contexte de mort et de transmission des biens, désigne naturellement les ressources ou possessions accumulées.
theological_decisions:
- issue: Portée anthropologique des formes masculines חֲכָמִים, כְּסִיל et בַעַר
  choice: les sages… l’insensé et l’homme sans raison
  alternative: les hommes sages… l’homme insensé et l’homme abruti
  rationale: Les formes hébraïques masculines présentent des types humains représentatifs. Le français « les sages » garde cette portée générale, tandis que le singulier « l’homme sans raison » conserve la forme personnelle et le parallélisme sans prétendre que l’énoncé ne concerne que les hommes.
- issue: Nuance de חֵילָם
  choice: leurs richesses
  alternative: leurs biens / leur fortune / leurs ressources
  rationale: Le contexte vise ce que les humains possèdent et abandonnent à leur mort. « Richesses » préserve l’étendue du terme sans le limiter juridiquement à un héritage.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu est conservé, ainsi que la distinction entre « meurent » et « périssent ». La ponctuation rend lisible la progression sans résoudre l’ambiguïté du sujet singulier initial.
