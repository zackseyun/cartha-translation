  text: קִרְבָּ֤/ם בָּתֵּ֨י/מוֹ לְֽ/עוֹלָ֗ם מִ֭שְׁכְּנֹתָ/ם לְ/דֹ֣ר וָ/דֹ֑ר קָֽרְא֥וּ בִ֝/שְׁמוֹתָ֗/ם עֲלֵ֣י אֲדָמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/011.yaml
  text: Their inward thought is that their houses will last forever[a], their dwelling places from generation to generation[b]; they have called lands by their own names.
translation:
  language: fr
  text: Au fond d’eux-mêmes, ils pensent que leurs maisons dureront toujours[a], que leurs demeures subsisteront de génération en génération ; ils ont donné leurs propres noms à des terres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible du texte : « Leurs tombes sont leurs maisons pour toujours, leurs demeures de génération en génération. »'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « ils ont appelé par leurs noms sur des terres ». Le sens semble être qu’ils ont donné leurs noms à des terres ou à des domaines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבָּם
  choice: Au fond d’eux-mêmes, ils pensent
  rationale: Le texte massorétique vocalisé renvoie à l’intérieur de la personne. Le français explicite sobrement la pensée implicite dans cette proposition nominale, sans écarter l’autre compréhension textuelle signalée en note.
- source_word: בָּתֵּימוֹ
  choice: leurs maisons
  rationale: Le sens courant de בַּיִת convient au parallélisme avec « demeures » et au contexte des biens auxquels les riches attribuent une permanence illusoire.
- source_word: לְעוֹלָם
  choice: dureront toujours
  rationale: La tournure exprime une permanence indéfinie. Le verbe « durer » rend naturelle en français la proposition sans verbe de l’hébreu.
- source_word: מִשְׁכְּנֹתָם
  choice: leurs demeures
  rationale: « Demeures » désigne naturellement des lieux d’habitation et maintient le parallélisme avec « maisons ».
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette expression française courante rend l’idée d’une continuité à travers les générations successives.
- source_word: קָרְאוּ
  choice: ils ont donné
  rationale: Dans cette construction, קרא exprime l’action de nommer. « Donner son nom à » est la formulation française idiomatique.
- source_word: בִשְׁמוֹתָם
  choice: leurs propres noms
  rationale: Le complément indique que les terres portent les noms de leurs propriétaires ; « propres » souligne cette référence à eux-mêmes sans ajouter d’idée étrangère au contexte.
- source_word: עֲלֵי אֲדָמוֹת
  choice: à des terres
  rationale: Le pluriel אֲדָמוֹת désigne ici vraisemblablement des terres ou domaines. La formulation idiomatique est précisée par une note plus littérale.
theological_decisions:
- issue: Ambiguïté entre la pensée intérieure des riches et leurs tombes
  choice: 'Suivre la vocalisation massorétique : « Au fond d’eux-mêmes, ils pensent »'
  alternative: « Leurs tombes seront leurs maisons pour toujours »
  rationale: La WLC porte קִרְבָּם, compris comme « leur intérieur ». L’autre lecture ancienne et contextuellement significative est conservée en note plutôt que substituée au texte fourni.
translation_notes:
  register: Français international moderne, clair et digne. La première proposition explicite avec mesure la pensée sous-entendue par la construction nominale hébraïque ; le parallélisme poétique et la tension entre permanence imaginée et mortalité restent perceptibles.
