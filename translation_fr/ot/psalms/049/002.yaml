translation:
  language: fr
  text: Gens de condition modeste aussi bien que gens de haut rang[a], riches et pauvres, tous ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « fils d’Adam et fils de l’homme »; ces deux expressions mises en parallèle désignent ici des personnes de condition modeste et de haut rang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם ... גַּם
  choice: comme
  rationale: Dans la structure « gens de condition modeste comme gens de haut rang », « comme » inclut naturellement les deux groupes visés par la répétition hébraïque.
- source_word: בְּנֵי אָדָם
  choice: gens de condition modeste
  rationale: En opposition à בְּנֵי אִישׁ, l’expression désigne ici idiomatiquement les personnes de statut social modeste plutôt qu’une filiation littérale.
- source_word: בְּנֵי אִישׁ
  choice: gens de haut rang
  rationale: Dans ce parallélisme social, l’expression désigne les personnes de statut élevé. Cette formulation française est claire sans réduire le groupe aux seuls nobles.
- source_word: יַחַד
  choice: tous ensemble
  rationale: L’expression indique que toutes les catégories sont réunies dans la même adresse; « tous » explicite naturellement la portée collective en français.
- source_word: עָשִׁיר
  choice: riches
  rationale: Équivalent français courant et direct dans l’opposition socioéconomique.
- source_word: וְאֶבְיוֹן
  choice: et pauvres
  rationale: Dans son contraste avec « riches », « pauvres » est l’équivalent français le plus naturel; « nécessiteux » resterait possible.
