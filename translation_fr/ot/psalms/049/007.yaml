review_pass:
  verdict: revise
  source_fidelity: Le texte massorétique de Ps 49.8 (numérotation hébraïque ; 49.7 dans certaines numérotations) commence par אַךְ, « certes / assurément », et non par אָח, « frère ». Il ne contient donc pas « un frère » comme complément de « racheter ». אִישׁ est le sujet de פדה, et le suffixe de כָּפְרוֹ renvoie naturellement à cet homme. La formulation révisée rend l’impossibilité absolue sans ajouter un frère à racheter.
  naturalness: « Certes, nul homme ne peut se racheter » est un français moderne, sobre et fluide. Le présent générique exprime adéquatement l’impossibilité proverbiale ; « le prix de sa rançon » conserve l’image financière de כֹּפֶר.
  terminology: « Racheter » et « rançon » correspondent au champ sémantique de פדה et כֹּפֶר sans imposer une interprétation sacrificielle. « Dieu » est approprié pour לֵאלֹהִים dans ce contexte.
  issues:
  - severity: high
    issue: Le brouillon traduit « frère » comme complément de « racheter ».
    rationale: Dans le texte massorétique, l’ouverture est אַךְ (« certes, assurément »), non אָח (« frère »). La chaîne source fournie paraît présenter une confusion graphique ou textuelle à cet endroit, tandis que son attribution à la WLC et le contexte du psaume confirment la lecture אַךְ. La note du brouillon, qui défend « frère », propage donc cette erreur et modifie le sens du verset.
  - severity: medium
    issue: « Jamais ... ne pourra » déplace légèrement l’énoncé vers le futur.
    rationale: L’imparfait hébreu dans ce proverbe exprime l’impossibilité générale ; le présent français (« ne peut ») le rend plus directement.
  revised_text: Certes, nul homme ne peut se racheter, ni donner à Dieu le prix de sa rançon.
  revised_footnotes: []
  revision_rationale: 'La révision corrige l’analyse de l’ouverture hébraïque : l’adverbe אַךְ introduit l’affirmation, tandis que « homme » est le sujet. Elle maintient l’ambiguïté théologique et économique de la rançon, sans introduire un référent (« frère » ou « un autre ») absent du texte massorétique.'
