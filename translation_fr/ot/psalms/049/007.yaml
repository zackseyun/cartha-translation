id: PSA.49.7
reference: Psalms 49:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֗ח לֹא פָדֹ֣ה יִפְדֶּ֣ה אִ֑ישׁ לֹא יִתֵּ֖ן לֵ/אלֹהִ֣ים כָּפְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/007.yaml
  text: Surely no man can redeem a brother[a], or give to God his ransom—
translation:
  language: fr
  text: Jamais un homme ne pourra racheter un frère[a], ni donner à Dieu le prix de sa rançon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son frère ». L’hébreu place « frère » en tête de la phrase et ne porte pas ici de possessif explicite.'
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: אָח
  choice: un frère
  rationale: Le nom signifie littéralement « frère ». Dans ce contexte, il peut désigner un proche ou un autre être humain, sans se limiter nécessairement au frère biologique. L’indéfini respecte l’absence de suffixe possessif dans l’hébreu.
- source_word: פָדֹה יִפְדֶּה
  choice: ne pourra jamais racheter
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe. Avec la négation, « ne pourra jamais » exprime naturellement l’impossibilité absolue sans reproduire artificiellement le verbe deux fois.
- source_word: אִישׁ
  choice: un homme
  rationale: אִישׁ est un nom masculin singulier. « Un homme » conserve cette forme tout en ayant ici une portée représentative.
- source_word: לֵאלֹהִים
  choice: à Dieu
  rationale: Dans ce contexte psalmique, אֱלֹהִים désigne Dieu au singulier.
- source_word: כָּפְרוֹ
  choice: le prix de sa rançon
  rationale: כֹּפֶר désigne le prix versé pour obtenir une libération. Cette formulation garde l’image économique et évite d’introduire des connotations sacrificielles que le verset n’impose pas.
theological_decisions:
- issue: Sens de כֹּפֶר offert à Dieu
  choice: le prix d’une rançon versé à Dieu pour une vie humaine
  alternative: un prix d’expiation offert à Dieu
  rationale: Le contexte affirme qu’un être humain ne peut acheter auprès de Dieu la délivrance d’un autre. « Prix de sa rançon » préserve cette image sans préciser indûment un mécanisme d’expiation.
- issue: Référent du possessif dans « sa rançon »
  choice: maintenir l’ambiguïté du suffixe masculin singulier
  alternative: expliciter « la rançon de son frère » ou « sa propre rançon »
  rationale: Le suffixe hébreu peut être rapporté au frère à racheter ou à l’homme qui paierait. Le français « sa rançon » conserve cette tension référentielle.
translation_notes:
  register: Français moderne, sobre et poétique. « Jamais » rend l’intensification hébraïque, tandis que « le prix de sa rançon » reste clair pour un lectorat courant et conserve l’ambiguïté du possessif.
