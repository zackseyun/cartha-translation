source:
  edition: WLC
  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: fr
  text: L’être humain qui jouit des honneurs mais manque de discernement est semblable aux bêtes qui périssent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une autre analyse du dernier verbe : « L’être humain qui jouit des honneurs mais manque de discernement est semblable aux bêtes ; il leur ressemble. »'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: L’être humain
  rationale: Le singulier a ici une portée générique et proverbiale. « L’être humain » exprime naturellement cette portée en français moderne sans limiter l’énoncé aux hommes de sexe masculin.
- source_word: בִּיקָר
  choice: qui jouit des honneurs
  rationale: Le nom désigne ici une condition de dignité, de prestige ou de haut rang. Cette formulation française rend cette situation avec naturel et prépare le contraste qui suit.
- source_word: וְלֹא יָבִין
  choice: mais manque de discernement
  rationale: Le verbe בין évoque la compréhension et la capacité de discerner. « Mais » fait ressortir le contraste entre les honneurs et l’absence de discernement.
- source_word: נִמְשַׁל
  choice: est semblable
  rationale: Le niphal de משל exprime une comparaison. « Est semblable » conserve le ton poétique et sentencieux du verset.
- source_word: כַּבְּהֵמוֹת
  choice: aux bêtes
  rationale: בְּהֵמוֹת désigne ici les animaux de manière générale. « Bêtes » convient au registre poétique et maintient le contraste avec l’être humain.
- source_word: נִדְמוּ
  choice: qui périssent
  rationale: Dans le contexte du psaume, le verbe est couramment compris au sens de périr ou d’être réduit au silence, ce qui prolonge le thème de la mortalité. Une analyse fondée sur l’idée de ressemblance reste possible et est signalée en note.
theological_decisions:
- issue: Sens du verbe final נִדְמוּ
  choice: Compris comme « périssent », en caractérisation des bêtes
  alternative: Compris au sens de « ressemblent » ou « leur sont devenus semblables »
  rationale: Le psaume insiste sur l’impossibilité pour le prestige humain d’empêcher la mort, et cette lecture produit une conclusion forte et cohérente. Comme la forme hébraïque peut aussi être rattachée à l’idée de ressemblance, cette ambiguïté interprétative est conservée dans une note.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure proverbiale reste concise, tandis que « discernement » restitue la dimension intellectuelle et morale du verbe hébreu.
