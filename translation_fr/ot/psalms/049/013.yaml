  text: זֶ֣ה דַ֭רְכָּ/ם כֵּ֣סֶל לָ֑/מוֹ וְ/אַחֲרֵי/הֶ֓ם בְּ/פִי/הֶ֖ם יִרְצ֣וּ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/013.yaml
  text: This is their way—their folly[a]; yet after them, people approve their words[b]. Selah
translation:
  language: fr
  text: 'Telle est leur voie : une folie pour eux ; pourtant, ceux qui viennent après eux prennent plaisir à leurs paroles[b]. Sélah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « dans leur bouche ». « Ceux qui viennent après eux » peut aussi désigner leurs descendants ; la syntaxe hébraïque est condensée.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶה דַרְכָּם
  choice: Voilà leur voie
  rationale: Le démonstratif introduit un jugement récapitulatif. « Voie » conserve à la fois l’image du chemin et le sens de manière de vivre.
- source_word: כֵּסֶל לָמוֹ
  choice: c’est leur folie
  rationale: כֶּסֶל désigne ici naturellement la folie, tandis que לָמוֹ rattache cette caractérisation aux personnes évoquées. La tournure française rend clairement la formulation hébraïque très condensée.
- source_word: וְאַחֲרֵיהֶם
  choice: pourtant, ceux qui viennent après eux
  rationale: L’expression peut viser de manière générale leurs successeurs ou, plus précisément, leurs descendants. La formulation choisie conserve la portée générale sans exclure la seconde possibilité.
- source_word: בְּפִיהֶם
  choice: à leurs paroles
  rationale: Littéralement « à/dans leur bouche » ; par métonymie, la bouche désigne ici ce qu’ils disent. « Leurs paroles » est naturel en français.
- source_word: יִרְצוּ
  choice: se plaisent à
  rationale: Le qal de רצה exprime le fait de prendre plaisir à, d’accueillir favorablement ou d’approuver. « Se plaisent à » préserve la nuance d’agrément plutôt que de la réduire à une approbation purement intellectuelle.
- source_word: סֶלָה
  choice: Sélah
  rationale: Translittération traditionnelle conservée, puisque la fonction précise de ce terme liturgique ou musical demeure incertaine.
theological_decisions:
- issue: Valeur de כֶּסֶל
  choice: folie
  alternative: assurance, confiance
  rationale: Le contexte critique la sécurité illusoire des riches. « Folie » exprime le jugement du psalmiste, tandis qu’une note conserve le sens lexical possible d’« assurance ».
- issue: Référent de וְאַחֲרֵיהֶם
  choice: ceux qui viennent après eux
  alternative: leurs descendants
  rationale: L’hébreu permet de comprendre soit les générations ou imitateurs ultérieurs en général, soit leurs descendants. Le texte principal évite de préciser plus que la source.
- issue: Rapport entre les successeurs et les paroles
  choice: les personnes venues après eux se plaisent à leurs paroles
  alternative: leurs descendants prennent plaisir à ce que dit leur propre bouche
  rationale: La syntaxe hébraïque est serrée et les suffixes peuvent être rattachés de plusieurs façons. La lecture retenue convient au fil de la critique sapientielle, sans effacer l’autre analyse possible.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde l’image biblique de la « voie », explicite seulement ce qu’exige la syntaxe française et signale les principales ambiguïtés lexicales et syntaxiques.
