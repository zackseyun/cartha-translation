  text: that he should still live on forever and not see the Pit[a].
translation:
  language: fr
  text: 'pour qu’il continue de vivre à jamais

    et ne voie pas la fosse[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tombe » ou « la corruption ».
    reason: Alternative lexicale pour שחת, dont le sens dans ce contexte poétique peut désigner la fosse, la tombe ou la corruption.
lexical_decisions:
- source_word: וִיחִי
  choice: pour qu’il vive
  rationale: 'Dans le contexte, la forme poursuit la pensée du vers précédent et exprime le résultat ou le but inaccessible : obtenir qu’un être humain continue de vivre.'
- source_word: עוֹד
  choice: encore
  rationale: Le terme marque ici la continuité de l’existence; « encore » est naturel en français et conserve cette valeur.
- source_word: לָנֶצַח
  choice: à jamais
  rationale: L’expression désigne une durée sans fin; « à jamais » convient au registre poétique tout en restant actuel.
- source_word: יִרְאֶה
  choice: voie
  rationale: Le choix conserve l’idiome hébreu « voir » au sens possible de subir ou connaître une réalité, sans expliciter excessivement la métaphore.
- source_word: הַשָּׁחַת
  choice: la fosse
  rationale: Dans ce contexte de mort, le terme peut évoquer la fosse, la tombe ou la corruption. « La fosse » préserve l’image concrète et sa portée poétique sans la réduire à une seule interprétation.
theological_decisions:
- issue: Sens de שחת dans un contexte de mort
  choice: la fosse
  alternative: la tombe ou la corruption
  rationale: « La fosse » maintient l’ampleur de l’image hébraïque, qui peut englober la tombe, la destruction et la décomposition; les autres possibilités sont signalées en note.
translation_notes:
  register: Français international moderne, digne et poétique. Le découpage en deux lignes respecte le parallélisme du vers; la proposition dépend syntaxiquement de la pensée précédente.
