source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: fr
  text: L’être humain[a], dans l’honneur, ne demeure pas[b] ; il est semblable aux bêtes qui périssent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme ». Le singulier hébreu אָדָם peut désigner un homme ou l’humanité en général; il a ici une valeur représentative.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ne passe pas la nuit » ou « ne loge pas ». L’expression évoque le fait de ne pas demeurer durablement dans une condition honorable.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui sont détruites » ou « qui sont anéanties ». Le dernier verbe est traditionnellement compris ici comme exprimant la disparition ou la mort.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: l’être humain
  rationale: Le nom singulier a ici une portée représentative et désigne l’être humain en général ; cette formulation inclusive convient naturellement au français moderne.
- source_word: בִּיקָר
  choice: malgré les honneurs
  rationale: 'Le nom évoque l’honneur, le prestige ou une condition privilégiée. Avec la négation du verbe, « malgré » exprime naturellement le contraste : même honoré, l’être humain ne demeure pas.'
- source_word: בַּל יָלִין
  choice: ne demeure pas
  rationale: Le verbe signifie littéralement « passer la nuit, loger », mais exprime ici le fait de ne pas rester durablement dans une condition honorée.
- source_word: נִמְשַׁל
  choice: il est semblable
  rationale: Le nifal exprime une comparaison ; cette tournure conserve le ton sentencieux du verset.
- source_word: כַּבְּהֵמוֹת
  choice: aux bêtes
  rationale: Le terme désigne les animaux ; « bêtes » maintient le registre solennel de cette maxime sapientielle.
- source_word: נִדְמוּ
  choice: qui périssent
  rationale: Dans ce contexte de mortalité, le verbe est traditionnellement compris au sens de périr ou d’être anéanti, plutôt que comme une nouvelle expression de ressemblance.
theological_decisions:
- issue: Portée de אָדָם
  choice: Référence générique à l’être humain
  alternative: « l’homme », comme représentant de l’humanité
  rationale: L’hébreu permet les deux formulations ; « l’être humain » rend clairement la portée universelle sans ajouter de précision doctrinale.
- issue: Sens de נִדְמוּ
  choice: « qui périssent »
  alternative: « qui sont anéanties » ou, selon une autre analyse lexicale, « ils sont réduits au silence »
  rationale: Le contexte immédiat compare la mortalité humaine à celle des animaux ; « périssent » préserve cette lecture traditionnelle tout en signalant l’alternative en note.
translation_notes:
  register: Français international moderne, digne et sentencieux. « L’être humain » rend la valeur représentative de אָדָם ; « les honneurs » traduit le statut prestigieux évoqué par בִּיקָר, tandis que la note conserve l’image concrète du séjour nocturne.
