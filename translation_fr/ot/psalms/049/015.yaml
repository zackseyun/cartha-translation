source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: fr
  text: Mais Dieu rachètera ma vie de la main du séjour des morts[a], car il me prendra[b]. Séla
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « le Shéol », terme hébreu désignant le séjour des morts ; autre traduction possible : « la tombe » ou « le monde des morts ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « il m’accueillera ».
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: Dans le contexte, la particule marque le contraste entre le sort inéluctable des humains fortunés et la confiance personnelle du psalmiste en Dieu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Équivalent naturel du nom commun employé ici au singulier pour désigner le Dieu d’Israël.
- source_word: יִפְדֶּה
  choice: rachètera
  rationale: Le verbe פדה exprime la délivrance par rachat; « rachètera » conserve cette image sans préciser le mode de délivrance.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Ici, נֶפֶשׁ désigne vraisemblablement la vie ou la personne, plutôt qu’une âme immatérielle envisagée séparément du corps.
- source_word: מִיַּד
  choice: de la main du
  rationale: Cette formulation conserve l’image hébraïque de la main comme emprise ou puissance.
- source_word: שְׁאוֹל
  choice: séjour des morts
  rationale: « Séjour des morts » rend le référent hébraïque de manière intelligible en français, sans le réduire à la tombe ni l’assimiler à l’enfer.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit naturellement le fondement de l’assurance exprimée dans la première proposition.
- source_word: יִקָּחֵנִי
  choice: il me prendra
  rationale: « Prendra » reste proche du sens de לקח et préserve l’ambiguïté entre le fait de prendre le psalmiste et celui de l’accueillir auprès de Dieu.
- source_word: סֶלָה
  choice: Pause
  rationale: Le terme signale probablement une indication musicale ou liturgique, mais sa fonction exacte est incertaine; « Pause » en donne une approximation lisible, explicitement signalée en note.
theological_decisions:
- issue: Sens de נַפְשִׁי face à la mort
  choice: « ma vie »
  alternative: « mon âme » ou « ma personne »
  rationale: « Ma vie » correspond au champ sémantique immédiat de la mort et évite d’imposer au texte une anthropologie dualiste plus précise qu’il ne l’est.
- issue: Nature de la délivrance hors du séjour des morts
  choice: Conserver la formulation large « rachètera ma vie… il me prendra »
  alternative: Expliciter une résurrection, une communion après la mort ou une délivrance de la mort prématurée
  rationale: L’hébreu affirme avec confiance l’intervention de Dieu sans définir systématiquement sa modalité; la traduction maintient cette tension théologique.
- issue: Portée de יִקָּחֵנִי
  choice: « il me prendra »
  alternative: « il m’accueillera »
  rationale: La formulation retenue conserve l’ambiguïté du verbe hébreu; l’alternative, plus explicitement relationnelle, est donnée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme reste concis; l’image de « la main » est conservée. « Pause » rend le traditionnel « Séla » sans prétendre résoudre entièrement la fonction incertaine du terme.
