  text: I will incline my ear to a proverb[c][b][a]; I will open my riddle with the lyre.
translation:
  language: fr
  text: Je tends l’oreille à un proverbe[a] ; j’ouvrirai mon énigme avec la lyre[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parabole » ou « une maxime ». Le mot hébreu peut désigner diverses formes de parole sapientielle.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur la lyre ». Le terme hébreu désigne un instrument à cordes de type lyre, traditionnellement rendu par « harpe ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ma parole obscure » ou « mon énigme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַטֶּה
  choice: Je tends
  rationale: Le hiphil de נטה exprime ici l’action délibérée d’incliner ou de tendre l’oreille. « Tendre l’oreille » est naturel en français moderne et conserve l’idée d’une écoute attentive.
- source_word: לְמָשָׁל
  choice: vers un proverbe
  rationale: מָשָׁל peut désigner un proverbe, une parabole ou une maxime de sagesse. Dans ce psaume sapientiel, « proverbe » convient au propos didactique sans exclure les autres nuances, signalées en note.
- source_word: אָזְנִי
  choice: l’oreille
  rationale: L’hébreu est au singulier avec suffixe de première personne. En français, « je tends l’oreille » exprime naturellement la possession sans qu’un possessif soit nécessaire.
- source_word: אֶפְתַּח
  choice: j’expose
  rationale: פתח signifie littéralement « ouvrir ». Appliqué à une énigme, « j’expose » rend en français intelligible le fait de la mettre au jour et de l’énoncer, sans trancher entre proposer et expliquer.
- source_word: בְּכִנּוֹר
  choice: au son de la lyre
  rationale: כִּנּוֹר désigne un instrument à cordes de type lyre. La préposition ב peut marquer l’accompagnement instrumental ; « au son de » produit une formulation française naturelle.
- source_word: חִידָתִי
  choice: mon énigme
  rationale: חִידָה désigne une énigme ou une parole obscure demandant du discernement. « Énigme » est actuel, digne et conserve cette dimension sapientielle.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme poétique est conservé. « J’expose » privilégie une expression naturelle tout en maintenant l’ouverture sémantique de la métaphore hébraïque ; la note sur l’instrument préserve les autres lectures possibles de la préposition.
