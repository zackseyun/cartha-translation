  text: פִּ֭/י יְדַבֵּ֣ר חָכְמ֑וֹת וְ/הָג֖וּת לִבִּ֣/י תְבוּנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/003.yaml
  text: My mouth will speak wisdom[a], and the meditation of my heart will be understanding.
translation:
  language: fr
  text: Ma bouche dira des paroles de sagesse[a], et la méditation de mon cœur sera empreinte d’intelligence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement un pluriel, « sagesses », qui peut fonctionner comme un nom abstrait ou évoquer des paroles empreintes de sagesse.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte littéralement un pluriel, « intelligences » ou « discernements », probablement employé ici au sens abstrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Ma bouche
  rationale: Conserve l’image hébraïque concrète et reste parfaitement naturel en français.
- source_word: יְדַבֵּר
  choice: dira
  rationale: L’imparfait hébreu exprime ici la déclaration d’une intention; le futur français convient au contexte.
- source_word: חָכְמוֹת
  choice: des paroles de sagesse
  rationale: Le pluriel hébreu peut désigner soit la sagesse comme notion abstraite, soit des propos sages. Cette formulation française s’accorde naturellement avec «dire» tout en signalant le contenu empreint de sagesse.
- source_word: הָגוּת
  choice: la méditation
  rationale: Le nom désigne la réflexion ou méditation intérieure, possiblement aussi son expression; «méditation» préserve cette profondeur sans surinterpréter.
- source_word: לִבִּי
  choice: de mon cœur
  rationale: Conserve la relation littérale et l’image biblique du cœur comme siège de la pensée intérieure.
- source_word: תְבוּנוֹת
  choice: l’intelligence
  rationale: Ce pluriel hébreu fonctionne vraisemblablement comme un nom abstrait; «intelligence» exprime ici la faculté de comprendre et le discernement.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme entre la bouche qui parle et la méditation du cœur est conservé; «exprimera» rend la proposition nominale de manière naturelle sans effacer la possible dimension intérieure de הָגוּת.
