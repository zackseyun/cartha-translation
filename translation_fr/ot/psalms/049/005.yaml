source:
  edition: WLC
  text: לָ֣/מָּה אִ֭ירָא בִּ֣/ימֵי רָ֑ע עֲוֺ֖ן עֲקֵבַ֣/י יְסוּבֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: fr
  text: Pourquoi aurais-je peur aux jours mauvais, quand la faute de ceux qui me talonnent m’entoure[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « la faute de mes talons m’entoure ». L’expression hébraïque est difficile : elle peut désigner la faute de ceux qui me talonnent ou cherchent à me faire trébucher, mais elle peut aussi évoquer une faute attachée à mes pas.'
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Pourquoi aurais-je peur
  rationale: La tournure conditionnelle française rend naturellement la force de la question rhétorique portée par לָמָּה et l’inaccompli אִירָא.
- source_word: בִּימֵי רָע
  choice: aux jours du mal
  rationale: Cette formulation proche de l’hébreu conserve le sens large de רָע, qui peut évoquer le mal comme l’adversité, sans le réduire à de simples difficultés.
- source_word: עָוֹן
  choice: faute
  rationale: Le terme עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » maintient ici sa portée morale tout en restant naturel en français courant.
- source_word: עֲקֵבַי
  choice: ceux qui me talonnent
  rationale: Le mot évoque littéralement les « talons » et peut suggérer des adversaires qui poursuivent de près ou cherchent à faire trébucher. « Ceux qui me talonnent » conserve l’image corporelle tout en restant intelligible.
- source_word: יְסוּבֵּנִי
  choice: m’environne
  rationale: Le verbe סבב signifie entourer ou encercler. Le singulier français s’accorde avec « la faute », comme le verbe hébreu singulier.
theological_decisions:
- issue: Interprétation de עֲוֹן עֲקֵבַי
  choice: la faute de ceux qui me talonnent
  alternative: la faute attachée à mes pas / la faute de mes talons / ma propre faute qui me suit
  rationale: La construction hébraïque est compacte et ambiguë. Le contexte permet d’y voir la faute d’adversaires qui poursuivent le psalmiste, mais le sens littéral lié aux « talons » ne permet pas d’exclure d’autres lectures. Le texte principal offre une formulation compréhensible et la note préserve l’ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. « Aux jours du mal » conserve la densité poétique de l’hébreu; « ceux qui me talonnent » rend l’image difficile sans la transformer simplement en « poursuivants ».
