  text: הַ/בֹּטְחִ֥ים עַל חֵילָ֑/ם וּ/בְ/רֹ֥ב עָ֝שְׁרָ֗/ם יִתְהַלָּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/006.yaml
  text: those who trust in their wealth and boast in the abundance of their riches—[a][b]
translation:
  language: fr
  text: ceux qui mettent leur confiance dans leurs biens et se vantent de l’abondance de leurs richesses —[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tirent gloire de l’abondance de leurs richesses ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu חַיִל peut aussi signifier « force » ou « ressources » ; ici, le parallélisme avec « richesses » indique des biens matériels.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: ceux qui mettent leur confiance
  rationale: 'Le participe qal masculin pluriel avec article est substantivé : « ceux qui… ». Cette formulation naturelle en français garde l’idée d’une attitude caractéristique.'
- source_word: עַל
  choice: dans
  rationale: Avec בטח, la préposition introduit l’objet de la confiance. « Mettre sa confiance dans » exprime idiomatiquement cette relation en français.
- source_word: חֵילָם
  choice: leurs biens
  rationale: חַיִל peut désigner la force, les ressources ou la richesse. Le parallélisme avec « leurs richesses » favorise ici le sens matériel ; « biens » préserve néanmoins la distinction entre les deux termes hébreux.
- source_word: וּבְרֹב
  choice: et de l’abondance de
  rationale: רֹב exprime une grande quantité ou l’abondance. La tournure française s’intègre naturellement au verbe « se vanter de ».
- source_word: עָשְׁרָם
  choice: leurs richesses
  rationale: עֹשֶׁר désigne précisément la richesse ou les richesses. Ce choix restitue le sens économique et le parallélisme poétique.
- source_word: יִתְהַלָּלוּ
  choice: se vantent
  rationale: Le hitpael de הלל signifie ici se vanter ou tirer gloire de quelque chose. « Se vantent » est clair et actuel, sans supprimer l’autre nuance possible.
