source:
  edition: WLC
  text: כַּ/צֹּ֤אן לִֽ/שְׁא֣וֹל שַׁתּוּ֮ מָ֤וֶת יִ֫רְעֵ֥/ם וַ/יִּרְדּ֘וּ בָ֤/ם יְשָׁרִ֨ים לַ/בֹּ֗קֶר ו/ציר/ם לְ/בַלּ֥וֹת שְׁא֗וֹל מִ/זְּבֻ֥ל לֽ/וֹ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: fr
  text: Comme des moutons, ils sont voués au séjour des morts[a] ; la mort sera leur berger, et les intègres domineront sur eux au matin[b]. Leur apparence se consumera dans le séjour des morts[c], loin de toute demeure élevée[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « séjour des morts » traduit ici le mot hébreu Shéol, qui désigne le domaine des morts et ne se limite pas à une tombe.
    reason: cultural_note
  - marker: b
    text: 'Ou : « exerceront leur autorité sur eux au matin ».'
    reason: alternative_reading
  - marker: c
    text: Le mot rendu par « apparence » est difficile ; on peut aussi comprendre « leur roc » ou « leur force ».
    reason: lexical_alternative
  - marker: d
    text: La fin du verset est difficile en hébreu. Le terme traduit par « demeure élevée » peut aussi désigner une demeure ou un séjour, et son rattachement dans la phrase est incertain. On peut comprendre, par exemple, que le séjour des morts les consume, ou qu’ils n’ont plus de demeure élevée.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Comme des moutons
  rationale: Le nom collectif désigne le petit bétail, en particulier les moutons. Cette formulation naturelle conserve l’image d’un troupeau sans défense.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: ils sont voués au séjour des morts
  rationale: שׁית signifie ici « placer, assigner ». « Être voués à » exprime la destination funeste sans réduire שְׁאוֹל à la tombe physique.
- source_word: מָוֶת יִרְעֵם
  choice: la mort sera leur berger
  rationale: Le verbe רעה signifie « faire paître, conduire comme berger ». La traduction maintient la personnification ironique de la mort et prolonge l’image des moutons.
- source_word: וַיִּרְדּוּ בָם יְשָׁרִים
  choice: les hommes droits domineront sur eux
  rationale: יְשָׁרִים désigne ceux qui sont droits, et le verbe exprime ici vraisemblablement la domination. « Hommes droits » est plus immédiatement compréhensible que l’adjectif substantivé seul.
- source_word: לַבֹּקֶר
  choice: au matin
  rationale: La formule temporelle concise conserve l’évocation d’un renversement à venir sans en préciser théologiquement la nature.
- source_word: וְצוּרָם
  choice: leur apparence
  rationale: Le texte consonantique et la vocalisation donnent une expression difficile. Dans le contexte de la dégradation corporelle, « apparence » rend une interprétation probable de « forme, figure », tout en signalant l’incertitude en note.
- source_word: לְבַלּוֹת
  choice: dépérira
  rationale: Le verbe בלה évoque l’usure, le déclin ou la décomposition. « Dépérira » rend ce processus naturellement en français.
- source_word: שְׁאוֹל
  choice: le séjour des morts
  rationale: Cette expression française communique le domaine des morts plus clairement que le simple emprunt « Shéol » et plus largement que « tombe ».
- source_word: מִזְּבֻל לוֹ
  choice: loin de sa demeure élevée
  rationale: זְבֻל peut désigner une demeure élevée ou prestigieuse. La syntaxe demeure incertaine ; cette traduction suit une compréhension possible tout en la signalant en note.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol ; la tombe
  rationale: « Séjour des morts » préserve la portée plus large du terme hébreu sans le limiter à un tombeau et reste immédiatement intelligible en français moderne.
- issue: Sens du « matin »
  choice: maintien de l’image temporelle sans explication doctrinale
  alternative: interprétation explicite comme résurrection ou jugement
  rationale: Le verset évoque un renversement « au matin », mais n’en définit pas explicitement le mécanisme ; la traduction conserve cette tension.
- issue: Domination des hommes droits
  choice: domineront sur eux
  alternative: les fouleront ; exerceront leur autorité sur eux
  rationale: La formulation conserve l’idée de domination sans déterminer précisément la scène eschatologique ou historique envisagée.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore pastorale est conservée par « la mort sera leur berger ». Les difficultés réelles de la seconde moitié du verset sont maintenues dans les notes plutôt que résolues silencieusement.
