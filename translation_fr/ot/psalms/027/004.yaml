source:
  edition: WLC
  text: אַחַ֤ת שָׁאַ֣לְתִּי מֵֽ/אֵת יְהוָה֮ אוֹתָ֪/הּ אֲבַ֫קֵּ֥שׁ שִׁבְתִּ֣/י בְּ/בֵית יְ֭הוָה כָּל יְמֵ֣י חַיַּ֑/י לַ/חֲז֥וֹת בְּ/נֹֽעַם יְ֝הוָ֗ה וּ/לְ/בַקֵּ֥ר בְּ/הֵיכָלֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: fr
  text: 'Je n’ai demandé qu’une chose à Yahvé[a], et c’est elle que je rechercherai : habiter dans la maison de Yahvé tous les jours de ma vie, contempler la beauté de Yahvé[b] et méditer dans son temple[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », ici rendu par « Yahvé » ; traditionnellement traduit par « l’Éternel ».'
    reason: alternative_reading
  - marker: b
    text: Ou « le charme de Yahvé » ou « la faveur de Yahvé ».
    reason: lexical_alternative
  - marker: c
    text: Ou « chercher dans son temple » ou « s’informer dans son temple ». Le verbe hébreu est difficile ici et peut évoquer une recherche attentive ou une réflexion dans le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת שָׁאַלְתִּי
  choice: Je n’ai demandé qu’une chose
  rationale: Le numéral féminin est employé substantivement et met l’accent sur l’unique objet de la demande. La tournure restrictive française exprime naturellement cette insistance, tandis que le passé composé rend l’accompli hébreu comme une demande déjà formulée et toujours pertinente.
- source_word: מֵאֵת יְהוָה
  choice: à Yahvé
  rationale: Dans le contexte du verbe « demander », le français dit naturellement « demander quelque chose à quelqu’un ». « Yahvé » transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: et c’est elle que je recherche
  rationale: Le pronom féminin reprend avec emphase « une chose ». Le présent traduit bien la poursuite continue ou résolue exprimée par l’imparfait hébreu.
- source_word: שִׁבְתִּי בְּבֵית יְהוָה
  choice: habiter dans la maison de Yahvé
  rationale: La forme infinitive avec suffixe précise le contenu de la demande. « Habiter » rend ici l’idée de demeurer, plus justement que le sens littéral possible « s’asseoir ».
- source_word: כָּל יְמֵי חַיַּי
  choice: tous les jours de ma vie
  rationale: Cette expression française naturelle conserve la durée totale indiquée par l’hébreu.
- source_word: לַחֲזוֹת
  choice: contempler
  rationale: Le verbe exprime une vision attentive. « Contempler » convient au contexte d’adoration et reste naturel en français actuel.
- source_word: בְּנֹעַם יְהוָה
  choice: la beauté de Yahvé
  rationale: נֹעַם peut désigner ce qui est agréable, beau ou favorable. « Beauté » exprime avec naturel l’attrait de la présence divine sans exclure les autres nuances, signalées en note.
- source_word: וּלְבַקֵּר בְּהֵיכָלוֹ
  choice: et méditer dans son temple
  rationale: Le verbe est difficile dans ce contexte et peut évoquer un examen attentif, une recherche ou une interrogation. « Méditer » rend une attention réfléchie dans le sanctuaire, tout en laissant les autres possibilités en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; YHWH
  rationale: Le texte hébreu emploie le nom propre divin. Le rendre par « Yahvé » préserve sa fonction de nom personnel; une note signale la substitution traditionnelle par un titre et la graphie consonantique.
- issue: Portée de נֹעַם יְהוָה
  choice: la beauté de Yahvé
  alternative: le charme de Yahvé ; la faveur de Yahvé
  rationale: Le nom נֹעַם possède une gamme sémantique qui va de l’agrément et du charme à la faveur. Le contexte contemplatif favorise « beauté », sans permettre d’écarter entièrement les autres nuances.
- issue: Sens de וּלְבַקֵּר dans le sanctuaire
  choice: méditer dans son temple
  alternative: chercher dans son temple ; s’informer dans son temple ; examiner attentivement son temple
  rationale: Le verbe admet ici plusieurs analyses contextuelles. La traduction principale retient l’attention contemplative sans préciser artificiellement l’objet de la recherche; la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre la demande déjà formulée et la recherche qui se poursuit est conservé. « Maison » et « temple » maintiennent les deux termes hébreux distincts, tandis que les ambiguïtés de נֹעַם et de בקר sont explicitées sans être résolues de façon dogmatique.
