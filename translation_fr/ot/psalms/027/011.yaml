id: PSA.27.11
reference: Psalms 27:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֤וֹרֵ֥/נִי יְהוָ֗ה דַּ֫רְכֶּ֥/ךָ וּ֭/נְחֵ/נִי בְּ/אֹ֣רַח מִישׁ֑וֹר לְ֝מַ֗עַן שׁוֹרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/011.yaml
  text: Teach me your way[a], O Yahweh, and lead me on a level path because of my enemies.
translation:
  language: fr
  text: Enseigne-moi ta voie, Yahweh, et conduis-moi sur un chemin uni, à cause de mes adversaires[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui m’épient avec hostilité ». Le terme hébreu peut désigner des ennemis, notamment des adversaires qui guettent une occasion de nuire au psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Enseigne-moi
  rationale: Le hifil de ירה exprime ici l’action d’enseigner ou d’instruire. « Enseigne-moi » conserve cette dimension pédagogique et convient naturellement à une prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de le remplacer par un titre.
- source_word: דַּרְכֶּךָ
  choice: ta voie
  rationale: דֶּרֶךְ désigne un chemin ou une manière de vivre. « Ta voie » garde à la fois l’image concrète et sa portée morale.
- source_word: וּנְחֵנִי
  choice: et conduis-moi
  rationale: נחה signifie conduire ou guider. « Conduis-moi » maintient clairement l’image du déplacement sur un chemin.
- source_word: בְּאֹרַח
  choice: sur un chemin
  rationale: Avec le verbe « conduire », la préposition française « sur » rend naturellement l’idée de progression le long d’un chemin.
- source_word: מִישׁוֹר
  choice: uni
  rationale: מִישׁוֹר évoque un terrain plat ou égal, avec une possible connotation de droiture. « Un chemin uni » conserve d’abord l’image concrète sans exclure sa portée figurée.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Dans ce contexte, לְמַעַן introduit le motif de la demande face à des adversaires hostiles. « À cause de » est direct et naturel.
- source_word: שׁוֹרְרָי
  choice: mes adversaires
  rationale: Le terme désigne des opposants hostiles et peut aussi évoquer ceux qui épient le psalmiste. « Mes adversaires » est clair dans le texte principal, tandis que la nuance d’observation hostile est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: « Yahweh » représente directement le nom divin hébreu et évite de lui substituer un titre.
- issue: Portée concrète ou morale de מִישׁוֹר
  choice: un chemin uni
  alternative: une voie droite
  rationale: Le choix retient l’image première d’un terrain égal tout en laissant entendre, sans l’imposer, la possible idée de droiture morale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des images de la voie et du chemin est conservé, ainsi que la prière directe à la deuxième personne.
