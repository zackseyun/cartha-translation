  text: לׅׄוּלֵׅׄ֗אׅׄ הֶ֭אֱמַנְתִּי לִ/רְא֥וֹת בְּֽ/טוּב יְהוָ֗ה בְּ/אֶ֣רֶץ חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/013.yaml
  text: Unless I had believed that I would see the goodness of Yahweh in the land of the living[a][b].
translation:
  language: fr
  text: Si je n’avais pas cru voir la bonté de Yahweh au pays des vivants…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu laisse la phrase en suspens : « Si je n’avais pas cru voir la bonté de Yahweh au pays des vivants… » La conséquence sous-entendue peut se comprendre ainsi : « j’aurais perdu courage » ou « j’aurais désespéré ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵא
  choice: Si je n’avais pas
  rationale: La particule introduit ici une condition contraire aux faits. Cette tournure française conserve naturellement la condition tout en laissant en suspens la conséquence que l’hébreu ne formule pas.
- source_word: הֶאֱמַנְתִּי
  choice: cru
  rationale: Le hifil de אמן signifie ici « croire » ou « avoir confiance ». « Cru » convient à la proposition qui en précise ensuite le contenu.
- source_word: לִרְאוֹת
  choice: que je verrais
  rationale: L’infinitif hébreu « voir » dépend de « croire ». Une proposition complétive est plus naturelle en français et exprime l’attente tournée vers l’avenir.
- source_word: בְּטוּב
  choice: la bonté
  rationale: טוּב peut désigner la bonté, les bienfaits ou l’abondance. « La bonté » préserve ici le sens large sans le limiter à des biens matériels.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּאֶרֶץ חַיִּים
  choice: sur la terre des vivants
  rationale: Cette expression désigne le domaine de ceux qui vivent, par opposition au séjour des morts. « Sur la terre des vivants » est une formulation française naturelle et consacrée.
- source_word: '[apodose implicite après לוּלֵא]'
  choice: laissée inexprimée
  rationale: Le texte hébreu transmis ne formule pas la conséquence de la condition. Les points de suspension signalent cette ellipse sans imposer une reconstruction particulière dans le texte principal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; la translittération conserve le nom propre.
- issue: Apodose absente de la construction elliptique
  choice: Conserver l’ellipse et la signaler par des points de suspension avec une note
  alternative: Ajouter « j’aurais perdu courage » ou « j’aurais désespéré »
  rationale: La conséquence est clairement sous-entendue, mais son libellé exact ne figure pas dans l’hébreu. La conserver implicite respecte l’ambiguïté formelle et évite de faire passer une reconstruction plausible pour le texte lui-même.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase volontairement suspendue reproduit l’ellipse frappante de l’hébreu; la note en explicite les lectures usuelles sans en privilégier une dans le texte.
