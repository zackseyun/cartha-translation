  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: fr
  text: Même si une armée campe contre moi[a], mon cœur n’aura pas peur ; même si la guerre se lève contre moi, en cela, j’ai confiance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si une armée campe contre moi […] si la guerre se lève contre moi. » Le mot hébreu peut introduire une condition ou avoir ici une valeur concessive.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « malgré cela, je reste confiant ». L’hébreu dit littéralement : « en cela, moi, j’ai confiance / je suis confiant » ; le référent exact de « cela » demeure implicite.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: même si
  rationale: La particule peut exprimer une condition (« si ») ou une concession. Dans ce parallélisme, « même si » rend naturellement la force concessive tout en laissant percevoir l’hypothèse.
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: une armée campe
  rationale: Le verbe signifie « camper » et le nom désigne littéralement un « camp », mais, en parallèle avec la guerre, il évoque ici les forces armées qui y campent.
- source_word: לֹא יִירָא לִבִּי
  choice: mon cœur n’aura pas peur
  rationale: Cette formulation conserve le cœur comme sujet explicite, conformément à l’image anthropologique de l’hébreu.
- source_word: תָּקוּם ... מִלְחָמָה
  choice: la guerre se lève
  rationale: La traduction préserve l’image vive du verbe קום, « se lever, surgir », sans la réduire à « éclater ».
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: en cela je garde confiance
  rationale: « En cela » conserve le démonstratif elliptique, tandis que « je garde confiance » exprime la persistance de בטח face à la menace sans lui ajouter un objet explicite.
theological_decisions:
- issue: Référent et portée de בְּזֹאת
  choice: « en cela je garde confiance », avec un renvoi probable à la situation menaçante qui vient d’être décrite
  alternative: « malgré cela, je reste confiant » ou « en ceci je mets ma confiance », éventuellement avec un renvoi au Seigneur dans le contexte précédent
  rationale: L’hébreu reste elliptique. La formulation retenue préserve le démonstratif et la tension entre confiance relationnelle et assurance intérieure, sans préciser un objet absent du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique, l’expression « mon cœur » et l’image de la guerre qui « se lève » sont conservés. Les deux marqueurs de note figurent dans le texte.
