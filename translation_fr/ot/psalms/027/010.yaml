id: PSA.27.10
reference: Psalms 27:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי אָבִ֣/י וְ/אִמִּ֣/י עֲזָב֑וּ/נִי וַֽ/יהוָ֣ה יַֽאַסְפֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: fr
  text: 'Car mon père et ma mère m’ont abandonné,

    mais Yahweh me recueillera.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’accueillera » ou « me prendra sous sa protection ». Le verbe hébreu signifie littéralement « rassembler »; ici, il évoque un accueil protecteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement ou la circonstance de la confiance exprimée par le psalmiste. « Car » en conserve la valeur explicative sans lui imposer le sens concessif de « même si ».
- source_word: אָבִי וְאִמִּי
  choice: mon père et ma mère
  rationale: Traduction directe et naturelle des deux noms munis du suffixe possessif de première personne.
- source_word: עֲזָבוּנִי
  choice: m’ont abandonné
  rationale: Le verbe עזב peut signifier quitter, délaisser ou abandonner. « M’ont abandonné » restitue ici avec naturel la force affective du verbe et la forme accomplie de l’hébreu.
- source_word: וַיהוָה
  choice: mais Yahweh
  rationale: La conjonction, littéralement « et », marque dans ce contexte le contraste entre l’abandon humain et l’accueil divin; « mais » l’exprime naturellement en français. Le nom divin est translittéré « Yahweh » conformément à la convention du projet.
- source_word: יַאַסְפֵנִי
  choice: me recueillera
  rationale: אסף signifie fondamentalement « rassembler » et peut, lorsqu’il a une personne pour objet, évoquer le fait de l’accueillir et de la placer sous sa protection. « Me recueillera » conserve cette nuance concrète et protectrice dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: La translittération maintient dans le texte le nom propre de l’alliance sans l’assimiler au titre « Seigneur ».
- issue: Rapport entre l’abandon parental et l’accueil divin
  choice: Car… mais
  alternative: Même si… Yahweh
  rationale: Le texte hébreu présente formellement כִּי avec un verbe à l’accompli. La traduction principale conserve cette formulation plutôt que de transformer explicitement la phrase en hypothèse, tout en rendant le contraste par « mais ».
translation_notes:
  register: Français moderne, sobre et poétique. « Recueillera » est courant dans le contexte de l’accueil d’une personne abandonnée et préserve mieux que « rassemblera » la portée relationnelle du verbe hébreu.
