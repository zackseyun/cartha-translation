id: PSA.27.9
reference: Psalms 27:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: fr
  text: Ne me cache pas ton visage ; ne repousse pas ton serviteur avec colère[a]. Tu as été mon secours. Ne me délaisse pas[b] et ne m’abandonne pas, ô Dieu de mon salut[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne détourne pas ton serviteur dans ta colère ».'
    reason: Le verbe נטה évoque littéralement l’action d’incliner ou de détourner ; dans le contexte, il peut exprimer le fait d’écarter ou de repousser quelqu’un avec colère.
  - marker: b
    text: 'Ou : « ne me rejette pas ».'
    reason: נטש peut décrire aussi bien le fait de délaisser que celui de rejeter.
  - marker: c
    text: 'Ou : « Dieu de ma délivrance » ou « Dieu qui me sauve ».'
    reason: Le nom ישע peut désigner le salut ou la délivrance, et la construction peut être explicitée par une proposition verbale en français.
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: cache
  rationale: Le verbe סתר signifie « cacher » ou « dissimuler ». « Cacher » est naturel dans cette supplication et conserve l’image relationnelle du visage de Dieu qui se dérobe.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: L’image anthropomorphique explicite de l’hébreu est conservée plutôt que remplacée par l’abstraction « ta présence ».
- source_word: תַּט בְּאַף
  choice: repousse ... avec colère
  rationale: נטה peut signifier « incliner », « détourner » ou « écarter ». Avec le serviteur comme objet et בְּאַף, la proposition exprime ici un rejet sous l’effet de la colère ; « repousser » en rend naturellement la force en français.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans cette prière, עבד exprime l’humble relation du psalmiste à Dieu. « Serviteur » convient mieux que « esclave », puisque le statut juridique de dépendance n’est pas au premier plan.
- source_word: עֶזְרָתִי
  choice: mon secours
  rationale: עזרה désigne l’aide ou le secours. « Mon secours » convient à la construction prédicative et au registre poétique de la prière.
- source_word: הָיִיתָ
  choice: tu as été
  rationale: L’accompli hébreu rappelle l’aide déjà éprouvée de Dieu, encore pertinente pour la demande présente ; le passé composé français rend bien cette valeur.
- source_word: תִּטְּשֵׁנִי
  choice: ne me délaisse pas
  rationale: נטש peut exprimer l’abandon, le rejet ou le fait de délaisser. « Délaisser » garde sa force relationnelle tout en évitant de confondre ce verbe avec עזב dans la proposition suivante.
- source_word: תַּעַזְבֵנִי
  choice: ne m’abandonne pas
  rationale: עזב signifie couramment « laisser » ou « abandonner ». « Abandonner » est clair, fort et naturel dans cette supplication.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: ô Dieu de mon salut
  rationale: La formulation conserve la construction hébraïque et la portée de ישע, tout en exprimant naturellement l’apostrophe en français.
theological_decisions:
- issue: Langage anthropomorphique dans « ton visage »
  choice: Conserver « ton visage » dans le texte principal
  alternative: ta présence
  rationale: L’hébreu parle explicitement du visage de Dieu, image biblique de sa faveur et de sa présence. La conserver respecte la texture poétique sans en résoudre l’image par une abstraction.
- issue: Sens de עבד dans la relation à Dieu
  choice: serviteur
  alternative: esclave
  rationale: Le contexte met en avant l’humilité, le dévouement et l’appel relationnel du psalmiste, non son statut légal de personne asservie.
- issue: Portée de יִשְׁעִי
  choice: mon salut
  alternative: ma délivrance / Dieu qui me sauve
  rationale: « Salut » préserve la formulation compacte et la richesse théologique du substantif, sans limiter celui-ci à une seule forme de délivrance.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse directe habituelle des psaumes. Le parallélisme des demandes est conservé, avec une distinction lexicale entre נטש (« délaisser ») et עזב (« abandonner »).
