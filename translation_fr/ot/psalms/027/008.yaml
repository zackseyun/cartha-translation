base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: fr
  text: 'De ta part, mon cœur dit[a] : « Cherchez ma face ! » C’est ta face[b], Yahweh, que je cherche[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le début hébreu est difficile. On peut aussi comprendre : « À toi, mon cœur dit », ou, en rattachant autrement les mots : « Mon cœur dit à ton sujet : “Cherchez sa face !” »'
    reason: alternative_reading
  - marker: b
    text: Ou « ta présence ». En hébreu, la « face » peut désigner la présence personnelle.
    reason: lexical_alternative
  - marker: c
    text: Ou « je chercherai ». Le verbe hébreu peut exprimer une résolution présente ou une intention future.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Pour toi
  rationale: Le datif placé en tête est syntaxiquement difficile. « Pour toi » conserve sa forme inhabituelle et son rapport possible à Yahweh sans trancher entre une parole adressée à Dieu, dite à son sujet ou prononcée de sa part.
- source_word: אָמַר לִבִּי
  choice: mon cœur dit
  rationale: Le qatal peut, dans ce discours poétique, exprimer l’élan intérieur actuel du psalmiste. Le présent est naturel en français tout en maintenant l’image hébraïque du cœur qui parle.
- source_word: בַּקְּשׁוּ
  choice: Cherchez
  rationale: L’impératif hébreu est au pluriel. Le français conserve ce nombre, malgré son caractère énigmatique dans le contexte, plutôt que de l’aplanir en un singulier.
- source_word: פָנָי
  choice: ma face
  rationale: Le sens concret de « face » est conservé, car le même nom revient dans le second membre et porte l’image relationnelle centrale du verset.
- source_word: אֶת־פָּנֶיךָ
  choice: C’est ta face … que
  rationale: La tournure clivée produit un français naturel tout en rendant la mise en relief de l’objet placé avant le verbe et en conservant la répétition de « face ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de le présenter comme le nom propre employé dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֲבַקֵּשׁ
  choice: je cherche
  rationale: L’imparfait hébreu peut exprimer ici une résolution présente ou une intention future. Le présent répond immédiatement à l’appel cité, tandis que la possibilité du futur est signalée en note.
theological_decisions:
- issue: Interprétation de לְךָ אָמַר לִבִּי
  choice: '« Pour toi, mon cœur dit : “Cherchez ma face !” »'
  alternative: '« Mon cœur te dit » ou « Mon cœur dit à ton sujet : “Cherchez sa face !” »'
  rationale: La syntaxe hébraïque est elliptique et admet plusieurs constructions. Le texte principal maintient le texte massorétique et la citation à la première personne sans imposer une explication unique; la note expose les principales possibilités.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. Sa translittération préserve cette fonction, sans remplacer le nom par un titre.
- issue: Valeur temporelle de אֲבַקֵּשׁ
  choice: je cherche
  alternative: je chercherai
  rationale: Le présent exprime la réponse résolue du psalmiste, mais la forme hébraïque permet également une intention future, conservée en note.
translation_notes:
  register: Français international actuel, sobre et poétique. Le tutoiement convient à l’adresse directe à Dieu. L’impératif pluriel « Cherchez » et la répétition de « face » sont volontairement conservés. La tournure inhabituelle « Pour toi, mon cœur dit » reflète la difficulté réelle de l’hébreu, explicitée en note.
