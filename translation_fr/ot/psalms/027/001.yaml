id: PSA.27.1
reference: Psalms 27:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: fr
  text: 'De David[a].


    Yahweh est ma lumière et mon salut : qui craindrais-je ?

    Yahweh est la forteresse de ma vie : devant qui tremblerais-je ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par David » ou « Pour David ». Dans ce titre, l’hébreu לְדָוִד peut indiquer l’auteur ou une association avec David.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, לְ peut signaler l’auteur, l’appartenance ou l’association. « De David » reste naturel en français tout en conservant cette relative ambiguïté.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que par un titre de substitution.
- source_word: אוֹרִי
  choice: ma lumière
  rationale: La métaphore hébraïque est claire et se transpose directement en français sans qu’il soit nécessaire de l’expliciter.
- source_word: וְיִשְׁעִי
  choice: et mon salut
  rationale: « Salut » exprime ici la délivrance et la sécurité données par Dieu, tout en conservant le terme biblique général.
- source_word: מִמִּי אִירָא
  choice: qui craindrais-je ?
  rationale: Le conditionnel français rend naturellement la force modale de la question rhétorique hébraïque.
- source_word: מָעוֹז חַיַּי
  choice: la forteresse de ma vie
  rationale: מָעוֹז désigne un lieu ou un moyen de protection puissant. « Forteresse » préserve l’image défensive, tandis que « de ma vie » suit la construction hébraïque.
- source_word: מִמִּי אֶפְחָד
  choice: devant qui tremblerais-je ?
  rationale: « Trembler » rend naturellement la peur intense exprimée par פחד et maintient en français la variation lexicale du parallélisme hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve explicitement plutôt que de lui substituer un titre.
- issue: Portée de לְדָוִד dans le titre
  choice: De David
  alternative: Par David / Pour David
  rationale: La préposition peut marquer l’auteur ou une association plus large. Le texte principal adopte la formulation française traditionnelle sans imposer exclusivement l’idée d’auteur, et la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme est conservé, avec une variation naturelle entre « craindre » et « trembler ». Le titre est séparé du corps du verset.
