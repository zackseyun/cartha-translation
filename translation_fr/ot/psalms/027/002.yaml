source:
  edition: WLC
  text: בִּ/קְרֹ֤ב עָלַ֨/י מְרֵעִים֮ לֶ/אֱכֹ֪ל אֶת בְּשָׂ֫רִ֥/י צָרַ֣/י וְ/אֹיְבַ֣/י לִ֑/י הֵ֖מָּה כָשְׁל֣וּ וְ/נָפָֽלוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: fr
  text: Quand des malfaiteurs s’approchent de moi pour dévorer ma chair[a] — mes adversaires et mes ennemis —, ce sont eux qui trébuchent et tombent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « manger ma chair ». Cette expression hébraïque offre une image saisissante d’une attaque violente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקְרֹב
  choice: Quand … s’approchent
  rationale: L’infinitif construit précédé de בְּ introduit ici une circonstance temporelle. Le présent de narration français rend naturellement la scène vive sans imposer une nuance absente de l’hébreu.
- source_word: מְרֵעִים
  choice: des malfaiteurs
  rationale: Le participe désigne ceux qui font le mal. « Malfaiteurs » est courant, concis et conserve la portée morale du terme.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: pour dévorer ma chair
  rationale: « Dévorer » restitue naturellement la violence de l’image, tandis que « ma chair » en préserve le caractère concret et viscéral.
- source_word: צָרַי וְאֹיְבַי לִי
  choice: mes adversaires et mes ennemis
  rationale: Les deux noms sont maintenus afin de respecter le parallélisme hébreu. Les possessifs expriment déjà en français leur hostilité envers le psalmiste ; traduire en plus לִי par « contre moi » serait lourd et redondant.
- source_word: הֵמָּה
  choice: ce sont eux qui
  rationale: 'Cette tournure française rend l’accent porté par le pronom indépendant : ceux qui menaçaient le psalmiste sont précisément ceux qui s’effondrent.'
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: trébuchent et tombent
  rationale: La paire verbale décrit leur défaite ou leur effondrement sans préciser s’il est physique, militaire ou figuré. La formulation conserve cette ouverture.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure en incise conserve l’apposition hébraïque, et « ce sont eux qui » en restitue l’emphase sans alourdir la phrase.
