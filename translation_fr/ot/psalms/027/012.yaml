  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: fr
  text: Ne me livre pas au désir de mes adversaires[a], car de faux témoins se dressent contre moi, et un être qui respire la violence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la volonté de mes adversaires ». Le nom hébreu peut ici signifier le désir, l’appétit ou la volonté plutôt que l’« âme » au sens étroit.
    reason: lexical_alternative
  - marker: b
    text: Ou « et ceux qui respirent la violence ». L’hébreu porte ici un singulier après « de faux témoins »; il peut désigner un témoin en particulier ou caractériser collectivement les faux témoins.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: me livre
  rationale: Avec la négation אַל, נתן et le suffixe objet expriment l’idée de ne pas remettre quelqu’un au pouvoir d’autrui. « Livrer » est naturel et précis en français.
- source_word: בְּנֶפֶשׁ
  choice: au désir de
  rationale: נֶפֶשׁ peut ici désigner le désir, l’appétit ou la volonté. Dans cette construction, « au désir de » rend l’idée sans introduire le sens étroit et trompeur de « âme ».
- source_word: צָרָי
  choice: mes adversaires
  rationale: Le terme désigne des opposants hostiles. « Adversaires » convient au contexte à la fois conflictuel et judiciaire.
- source_word: קָמוּ בִי
  choice: se dressent contre moi
  rationale: קום avec בְּ exprime couramment le fait de se lever ou de se dresser contre quelqu’un.
- source_word: עֵדֵי שֶׁקֶר
  choice: de faux témoins
  rationale: Cette expression construite désigne des témoins caractérisés par le mensonge; « faux témoins » est l’équivalent juridique français naturel.
- source_word: וִיפֵחַ חָמָס
  choice: soufflant la violence
  rationale: La forme singulière יפח après le pluriel « témoins » est difficile et peut être distributive ou appositionnelle. Le participe français conserve l’image vive du souffle tout en laissant ouverte la relation syntaxique exacte.
- source_word: חָמָס
  choice: la violence
  rationale: חָמָס désigne la violence, l’injustice brutale ou le tort violent. « Violence » en conserve ici la force.
theological_decisions: []
