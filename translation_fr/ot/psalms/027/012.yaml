  naturalness: '« Ne me livre pas », « mes adversaires » et « de faux témoins se dressent contre moi » sont naturels, modernes et d''un registre convenant au psaume. En revanche, « soufflant la violence » est peu idiomatique en français contemporain : on souffle habituellement des paroles, des menaces ou un feu, tandis que « respirer la violence » rend plus naturellement la métaphore d''une personne animée par la violence.'
