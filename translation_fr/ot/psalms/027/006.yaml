source:
  edition: WLC
  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: fr
  text: Et maintenant, ma tête s’élèvera au-dessus des ennemis qui m’entourent. Dans sa tente[a], j’offrirai des sacrifices au son des cris de joie[b] ; je chanterai et je jouerai de la musique pour Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le pronom « sa » renvoie très probablement à Yahweh : il s’agit de sa tente, c’est-à-dire de son sanctuaire.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu dit littéralement « des sacrifices de cri d’acclamation ». L’expression peut désigner des sacrifices joyeux ou des sacrifices accompagnés de cris de joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et le tournant temporel vers la confiance présente ou imminente.
- source_word: יָרוּם רֹאשִׁי
  choice: ma tête s’élèvera
  rationale: Garde l’image hébraïque de la tête élevée, qui évoque l’honneur, l’assurance et la victoire, dans une formulation française naturelle.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: au-dessus des ennemis qui m’entourent
  rationale: Exprime à la fois la supériorité indiquée par עַל et l’encerclement indiqué par סְבִיבוֹתַי.
- source_word: וְאֶזְבְּחָה
  choice: j’offrirai
  rationale: Le cohortatif exprime ici une résolution. Avec « des sacrifices » comme complément, « offrir » évite la lourdeur de « sacrifier des sacrifices ».
- source_word: בְאָהֳלוֹ
  choice: dans sa tente
  rationale: Conserve le suffixe masculin singulier et l’image de la tente-sanctuaire sans remplacer implicitement le pronom par son référent probable.
- source_word: זִבְחֵי תְרוּעָה
  choice: des sacrifices au son des cris de joie
  rationale: Rend la relation construite de manière intelligible tout en maintenant l’ambiguïté entre des sacrifices caractérisés par la jubilation et des sacrifices accompagnés d’acclamations.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: je chanterai, je célébrerai … par mes chants
  rationale: 'Distingue les deux verbes proches : שׁיר désigne le chant, tandis que זמר évoque le chant musical ou la louange en musique.'
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel יהוה plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme ; « Yahweh » conserve le nom personnel dans la traduction.
- issue: Référent du suffixe dans בְאָהֳלוֹ
  choice: Conserver « sa tente », avec une note indiquant que le référent naturel est Yahweh
  alternative: Expliciter « dans la tente de Yahweh »
  rationale: Yahweh est le référent le plus naturel dans le contexte cultuel, mais le texte emploie un pronom ; le maintenir évite de supprimer formellement une légère ambiguïté.
- issue: Rapport entre les sacrifices et תְרוּעָה
  choice: « des sacrifices au son des cris de joie »
  alternative: « des sacrifices de jubilation »
  rationale: La construction peut caractériser les sacrifices ou évoquer l’acclamation qui les accompagne. Le texte principal reste idiomatique et la note préserve cette latitude.
translation_notes:
  register: Français international moderne, digne et accessible. L’image de la « tête » et celle de la « tente » sont conservées. La ponctuation répartit clairement l’exaltation attendue, l’offrande cultuelle et la louange musicale.
