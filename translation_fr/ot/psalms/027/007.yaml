  text: שְׁמַע יְהוָ֖ה קוֹלִ֥/י אֶקְרָ֗א וְ/חָנֵּ֥/נִי וַ/עֲנֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/007.yaml
  text: Hear[a], O Yahweh, when I cry aloud[b]; be gracious to me and answer me.
translation:
  language: fr
  text: Écoute, Yahweh, ma voix quand je crie ; fais-moi grâce et réponds-moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif appelle Yahweh à prêter une attention favorable. « Écoute » est naturel en français dans une supplication et s’accorde avec l’objet explicite « ma voix ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », conformément à sa présence explicite dans le texte hébreu.
- source_word: קוֹלִי
  choice: ma voix
  rationale: Cette traduction conserve l’expression concrète de l’hébreu plutôt que de la réduire à « écoute-moi ».
- source_word: אֶקְרָא
  choice: quand je crie
  rationale: Le qal imperfectif de קרא désigne ici l’appel pressant du psalmiste. « Quand je crie » exprime cette supplication sans ajouter l’idée de pleurs.
- source_word: וְחָנֵּנִי
  choice: fais-moi grâce
  rationale: Le verbe חנן demande une faveur accordée par grâce. Cette formulation est plus précise lexicalement que « aie pitié de moi ».
- source_word: וַעֲנֵנִי
  choice: réponds-moi
  rationale: Le verbe ענה signifie ici répondre à l’appel ou à la prière ; « réponds-moi » en est l’équivalent français direct.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le nom divin. « Yahweh » le représente comme un nom propre plutôt que de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et direct, adapté à la prière. La structure « Écoute… ma voix » préserve l’expression concrète de l’hébreu tout en restant naturelle ; le point-virgule distingue l’appel initial des deux impératifs qui suivent.
