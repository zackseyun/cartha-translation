source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: fr
  text: 'De David[a].


    Yahvé est ma lumière et mon salut : qui craindrais-je ?

    Yahvé est la forteresse de ma vie : devant qui tremblerais-je ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par David » ou « Pour David ». Dans le titre, l’hébreu לְדָוִד peut indiquer l’auteur, la destination ou plus largement une association avec David.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut signaler l’auteur, l’appartenance ou l’association. « De David » convient naturellement à un titre tout en laissant cette relation assez ouverte; une note indique les autres possibilités.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française traditionnelle et immédiatement reconnaissable du nom divin יהוה.
- source_word: אוֹרִי
  choice: ma lumière
  rationale: Équivalent direct qui conserve la métaphore hébraïque.
- source_word: יִשְׁעִי
  choice: mon salut
  rationale: Rend le nom hébreu dans son sens théologique et existentiel sans explicitation supplémentaire.
- source_word: מָעוֹז חַיַּי
  choice: la forteresse de ma vie
  rationale: « Forteresse » exprime le lieu de force et de sécurité désigné par מָעוֹז, tandis que « de ma vie » garde la formulation métaphorique de l’hébreu.
- source_word: אֶפְחָד
  choice: tremblerais-je
  rationale: Distingue naturellement en français le second verbe de peur du premier et rend sa nuance de frayeur, sans changer le parallélisme.
theological_decisions:
- issue: Relation de David au psaume dans la suscription
  choice: De David
  alternative: Par David / Pour David
  rationale: L’hébreu לְדָוִד ne tranche pas à lui seul entre attribution d’auteur, destination et association; la traduction principale reste idiomatique et la note préserve l’ambiguïté.
- issue: Représentation du tétragramme
  choice: Yahvé
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte source porte le nom propre יהוה. Le transcrire évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique et les deux questions rhétoriques sont conservés. « Qui craindrais-je ? » et « devant qui tremblerais-je ? » évitent une répétition artificielle tout en reflétant les deux verbes hébreux distincts.
