id: PSA.27.14
reference: Psalms 27:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קַוֵּ֗ה אֶל יְה֫וָ֥ה חֲ֭זַק וְ/יַאֲמֵ֣ץ לִבֶּ֑/ךָ וְ֝/קַוֵּ֗ה אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: fr
  text: Espère en Yahweh[a] ; sois fort, et que ton cœur s’affermisse[b] ! Oui, espère en Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Attends Yahweh ». Le verbe évoque une attente patiente et confiante autant que l’espérance.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre lecture possible : « et il affermira ton cœur », Yahweh étant alors compris comme le sujet.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה / וְקַוֵּה
  choice: Espère / espère
  rationale: Le piel impératif de קוה exprime une attente confiante et persévérante. « Espère en » est naturel en français et maintient l’orientation confiante vers Yahweh ; la nuance d’attente est signalée en note. La répétition finale est conservée.
- source_word: אֶל
  choice: en
  rationale: Avec קוה, אֶל introduit celui vers qui se porte l’attente confiante. En français, « espérer en Yahweh » rend cette orientation de manière idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », et non remplacé par un titre.
- source_word: חֲזַק
  choice: sois fort
  rationale: L’impératif est conservé directement sans préciser indûment la nature de la force demandée.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: et que ton cœur s’affermisse
  rationale: Cette formulation française naturelle garde « ton cœur » et lit la proposition comme la poursuite de l’exhortation. La forme verbale permet aussi une lecture prédictive avec Yahweh comme sujet, conservée en note.
- source_word: וְ
  choice: Oui
  rationale: Devant la répétition finale, « Oui » marque la reprise insistante et culminante de l’exhortation sans supprimer le parallélisme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin lui-même ; sa translittération préserve cette donnée du texte.
- issue: Valeur syntaxique de וְיַאֲמֵץ
  choice: 'Exhortation : « que ton cœur s’affermisse »'
  alternative: 'Promesse : « il affermira ton cœur »'
  rationale: La suite d’impératifs favorise une lecture exhortative, mais la morphologie à la troisième personne permet une lecture prédictive où Yahweh est le sujet. Cette ambiguïté réelle est maintenue par une note.
translation_notes:
  register: Français international actuel, simple et digne. Le parallélisme, la répétition de l’impératif et l’image du cœur sont conservés. La ponctuation fait entendre la progression exhortative du verset.
