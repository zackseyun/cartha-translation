id: PSA.27.5
reference: Psalms 27:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: fr
  text: Car il me cachera dans son abri[a] au jour du malheur[b] ; il me dissimulera au secret de sa tente ; il m’élèvera sur un rocher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa hutte », « dans sa cabane » ou « sous son pavillon ». Le terme hébreu désigne une structure servant d’abri et peut aussi évoquer le sanctuaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « au jour de l’adversité » ou « au jour de la calamité ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il me placera bien haut sur un rocher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement de la confiance exprimée dans le contexte précédent.
- source_word: יִצְפְּנֵנִי
  choice: il me cachera
  rationale: Le verbe צפן exprime l’action de cacher et, dans ce contexte, de protéger en tenant hors d’atteinte.
- source_word: בְּסֻכּוֹ
  choice: dans son abri
  rationale: סֻכָּה désigne une construction protectrice, notamment une hutte ou une cabane. « Abri » rend clairement sa fonction sans exclure d’éventuelles résonances cultuelles.
- source_word: בְּיוֹם רָעָה
  choice: au jour du malheur
  rationale: רָעָה désigne ici l’adversité ou la calamité plutôt que le mal moral.
- source_word: יַסְתִּרֵנִי
  choice: il me dissimulera
  rationale: Le verbe סתר est parallèle à צפן. « Dissimuler » conserve l’idée de soustraire aux regards tout en évitant une répétition exacte.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: au secret de sa tente
  rationale: Cette formulation naturelle et poétique préserve à la fois l’idée d’un lieu caché et l’image concrète de la tente.
- source_word: בְּצוּר
  choice: sur un rocher
  rationale: צוּר désigne un rocher ou un escarpement, image d’une position sûre et inaccessible.
- source_word: יְרוֹמְמֵנִי
  choice: il m’élèvera
  rationale: Le verbe רום signifie élever ou placer en hauteur. La traduction conserve le mouvement vertical sans lui imposer un sens abstrait d’exaltation.
theological_decisions:
- issue: Possible nuance cultuelle de סֻכּוֹ et אָהֳלוֹ
  choice: Conserver les images concrètes de l’abri et de la tente sans expliciter un sanctuaire.
  alternative: Employer « tabernacle », « pavillon » ou un vocabulaire explicitement cultuel.
  rationale: Le contexte peut évoquer le sanctuaire, mais les noms hébreux restent des termes concrets courants. La traduction préserve cette possible résonance sans la rendre obligatoire.
- issue: Sens de רָעָה dans בְּיוֹם רָעָה
  choice: Comprendre le terme comme le malheur ou la calamité.
  alternative: Le traduire par « mal » au sens éventuellement moral.
  rationale: Le contexte porte sur une situation de détresse dont le psalmiste attend d’être protégé, non sur la faute morale.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme des deux verbes de dissimulation est maintenu, avec une variation lexicale naturelle. Les images concrètes de l’abri, de la tente et du rocher sont conservées.
