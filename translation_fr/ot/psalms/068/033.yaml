source:
  edition: WLC
  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: fr
  text: à celui qui chevauche dans les cieux les plus élevés, les cieux très anciens[a] — voici qu’il fait retentir sa voix[b], une voix puissante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans les cieux des cieux d’autrefois ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il donne de la voix, une voix pleine de force ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָ/רֹכֵב
  choice: à celui qui chevauche
  rationale: Le לְ reprend l’appel du verset précédent à reconnaître la puissance de Dieu, tandis que le participe רֹכֵב désigne Dieu comme celui qui chevauche.
- source_word: בִּ/שְׁמֵי שְׁמֵי
  choice: dans les cieux les plus élevés
  rationale: La chaîne construite « cieux des cieux » exprime ici le degré suprême. Cette formulation en restitue le sens dans un français naturel tout en conservant l’image céleste.
- source_word: קֶדֶם
  choice: des temps anciens
  rationale: Dans ce contexte, קֶדֶם a une valeur temporelle et caractérise les cieux par leur ancienneté, plutôt que de désigner l’est.
- source_word: הֵן
  choice: Voici
  rationale: La particule attire solennellement l’attention sur l’action divine qui suit.
- source_word: יִתֵּן
  choice: il fait retentir
  rationale: Le verbe signifie littéralement « donner », mais l’expression avec קוֹל signifie émettre ou faire entendre sa voix. « Fait retentir » conserve la force poétique de l’image.
- source_word: בְּ/קוֹל/וֹ
  choice: sa voix
  rationale: La préposition appartient à la tournure hébraïque avec « donner » ; elle ne doit pas nécessairement être reproduite en français.
- source_word: קוֹל עֹז
  choice: une voix puissante
  rationale: La construction signifie littéralement « une voix de force ». « Une voix puissante » en donne une expression française claire et poétique.
theological_decisions:
- issue: Référent de celui qui chevauche
  choice: Le verset poursuit la description du Dieu d’Israël dans son exaltation céleste, sans préciser de référent christologique ou angélique plus étroit.
  alternative: Une lecture typologique peut rapprocher ultérieurement cette image du cavalier divin d’une application messianique.
  rationale: Le contexte immédiat parle de Dieu. La traduction garde ce référent sans introduire dans le texte une identification théologique postérieure.
translation_notes:
  register: Français poétique, actuel et digne. « Chevauche » préserve l’image concrète du cavalier divin ; « ceux des temps anciens » maintient le lien de קֶדֶם avec les cieux sans réduire l’expression à une simple épithète. Le fragment initial reste syntaxiquement rattaché à l’exhortation du verset précédent.
