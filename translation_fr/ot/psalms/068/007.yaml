id: PSA.68.7
reference: Psalms 68:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים בְּ֭/צֵאתְ/ךָ לִ/פְנֵ֣י עַמֶּ֑/ךָ בְּ/צַעְדְּ/ךָ֖ בִֽ/ישִׁימ֣וֹן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: fr
  text: Dieu, quand tu es sorti devant ton peuple, quand tu as marché dans le désert[a] — Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la région aride » ou « dans la terre désolée ». Le terme hébreu désigne une étendue désertique et inhabitée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom divin placé en tête fonctionne ici comme une adresse directe. « Dieu » conserve cette forme sobre sans ajouter une particule vocative absente de l’hébreu.
- source_word: בְּצֵאתְךָ
  choice: quand tu es sorti
  rationale: La préposition בְּ avec l’infinitif construit et le suffixe de deuxième personne a ici une valeur temporelle. Le passé composé est naturel en français moderne pour rappeler cette intervention passée.
- source_word: לִפְנֵי עַמֶּךָ
  choice: devant ton peuple
  rationale: Cette formulation rend directement l’idée de position en avant du peuple et laisse entendre, sans l’expliciter davantage, que Dieu le conduisait.
- source_word: בְּצַעְדְּךָ
  choice: quand tu as marché
  rationale: Le verbe צעד évoque le fait d’avancer à pas mesurés ou de marcher. « Marché » convient au mouvement solennel et volontaire décrit en parallèle.
- source_word: בִישִׁימוֹן
  choice: dans le désert
  rationale: יְשִׁימוֹן désigne une région désertique et désolée. « Dans le désert » est idiomatique, fidèle à la préposition hébraïque et adapté au rappel de la traversée du désert.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le terme est translittéré, car sa fonction exacte demeure incertaine; il s’agit vraisemblablement d’une indication musicale ou liturgique.
theological_decisions:
- issue: L’action de Dieu pendant la marche de son peuple au désert
  choice: Le verset s’adresse directement à Dieu et rappelle qu’il avançait devant son peuple dans le désert.
  alternative: Comprendre la phrase comme une description de Dieu plutôt que comme une adresse directe.
  rationale: La syntaxe et le contexte du psaume favorisent l’adresse directe. La traduction conserve l’allusion historique à la conduite divine sans préciser davantage l’événement ni lui ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. Le passé composé évite un passé simple trop littéraire. La répétition de « quand tu » reproduit le parallélisme hébreu. Le marqueur de note est placé après « désert », le mot auquel porte l’alternative lexicale.
