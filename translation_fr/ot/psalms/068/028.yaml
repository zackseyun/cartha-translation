source:
  edition: WLC
  text: צִוָּ֥ה אֱלֹהֶ֗י/ךָ עֻ֫זֶּ֥/ךָ עוּזָּ֥/ה אֱלֹהִ֑ים ז֝֗וּ פָּעַ֥לְתָּ לָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: fr
  text: Ton Dieu a ordonné ta puissance. Montre ta force[a], ô Dieu, toi qui as agi pour nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu עוּזָה est difficile. On peut aussi comprendre : « Montre-toi fort, ô Dieu », ou, en reliant l’expression à la suite : « Affermis, ô Dieu, ce que tu as accompli pour nous. »'
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: a ordonné
  rationale: Le parfait exprime une décision souveraine accomplie dont l’effet demeure. « A ordonné » conserve la force autoritative du verbe sans l’affaiblir en simple permission.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים a ici son sens singulier habituel pour le Dieu d’Israël; le suffixe de deuxième personne masculine singulière donne « ton Dieu ».
- source_word: עֻזֶּךָ
  choice: ta puissance
  rationale: Le nom désigne la force ou la puissance. « Ta puissance » convient au contexte solennel et distingue naturellement ce premier membre de la demande qui suit.
- source_word: עוּזָה
  choice: Déploie ta force
  rationale: La forme est difficile. Cette traduction la comprend comme une demande adressée à Dieu afin qu’il manifeste sa force. L’ajout possessif, naturel en français, explicite que la force déployée est celle de Dieu, tandis que la note conserve les autres analyses possibles.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le terme est employé comme vocatif dans la prière; « ô Dieu » en rend clairement la fonction et maintient un registre digne.
- source_word: זוּ
  choice: toi qui
  rationale: La particule relative introduit une proposition décrivant Dieu. Dans une adresse directe, « toi qui » est la tournure française la plus naturelle.
- source_word: פָּעַלְתָּ
  choice: as agi
  rationale: Le verbe évoque une action effective accomplie. « As agi » est idiomatique et laisse ouverte la nature précise de l’intervention divine.
- source_word: לָּנוּ
  choice: pour nous
  rationale: 'La préposition avec suffixe est comprise dans un sens bénéficiaire: Dieu a agi en faveur de son peuple.'
theological_decisions:
- issue: Ambiguïté de la forme עוּזָה
  choice: 'Une prière demandant à Dieu de manifester sa force: « Déploie ta force, ô Dieu »'
  alternative: « Montre-toi fort, ô Dieu » ou « Affermis, ô Dieu, ce que tu as accompli pour nous »
  rationale: La syntaxe hébraïque est difficile et permet plusieurs constructions. Le texte principal conserve l’élan de la supplication dans ce verset, sans y intégrer silencieusement des mots ou une construction tirés du verset suivant; la note signale les lectures concurrentes.
translation_notes:
  register: Français international moderne, naturel et solennel. Le parallélisme est préservé par deux phrases brèves; « ô Dieu » marque clairement le vocatif. La note maintient l’ambiguïté réelle de l’hébreu sans imposer une interprétation confessionnelle.
