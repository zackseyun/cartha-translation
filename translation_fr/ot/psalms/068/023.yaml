translation:
  language: fr
  text: afin que ton pied les écrase dans le sang[a], et que la langue de tes chiens ait sa part des ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas ce que le pied écrase; « les » renvoie vraisemblablement aux ennemis. Littéralement : « afin que ton pied écrase dans le sang ».'
    reason: implicit_object
  - marker: b
    text: La fin du verset est difficile et elliptique en hébreu. Le dernier terme peut se comprendre « de lui », mais son référent et son lien exact avec « des ennemis » sont incertains.
    reason: textual_difficulty
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit ici le but ou le résultat et s’accorde naturellement avec le subjonctif français.
- source_word: תִּמְחַץ
  choice: écrase
  rationale: Le verbe מחץ exprime l’idée de frapper violemment ou d’écraser; « écrase » conserve la force de l’image.
- source_word: רַגְלְךָ
  choice: ton pied
  rationale: Le texte hébreu emploie le singulier avec un suffixe de deuxième personne masculine singulière.
- source_word: בְּדָם
  choice: dans le sang
  rationale: Cette traduction garde la préposition relativement ouverte et préserve l’image concrète sans préciser à qui appartient le sang.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: la langue de tes chiens
  rationale: Le singulier collectif de l’hébreu est conservé; la formulation reste intelligible en français.
- source_word: מֵאֹיְבִים
  choice: des ennemis
  rationale: 'La préposition מן indique la provenance: ce que reçoivent les chiens provient des ennemis vaincus.'
- source_word: מִנֵּהוּ
  choice: reçoive sa part
  rationale: L’expression finale est elliptique et difficile. Cette formulation explicite avec retenue l’idée contextuelle d’une part provenant de l’ennemi, tout en signalant l’incertitude en note.
theological_decisions:
- issue: Violence de l’image de victoire
  choice: Conserver le pied qui écrase dans le sang et les chiens qui reçoivent leur part des ennemis
  alternative: Atténuer l’image en parlant simplement de victoire sur les ennemis
  rationale: Le texte présente délibérément une scène de défaite sanglante. La traduction ne doit ni l’adoucir ni lui donner une portée doctrinale absente de l’hébreu.
- issue: Objet implicite du verbe « écraser »
  choice: Ajouter « les », renvoyant aux ennemis
  alternative: Traduire littéralement « que ton pied écrase dans le sang »
  rationale: Le français exige ici un complément pour que le verbe transitif soit naturel. Le contexte immédiat identifie les ennemis comme référent probable, mais l’ajout est signalé en note.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse individuelle du texte hébreu. L’image violente est maintenue, tandis que deux ellipses syntaxiques sont rendues lisibles et signalées en notes.
