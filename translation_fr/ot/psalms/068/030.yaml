source:
  edition: WLC
  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: fr
  text: 'Menace la bête des roseaux[a],

    la troupe des taureaux parmi les veaux des peuples,

    piétinant des morceaux d’argent[b].

    Disperse[c] les peuples qui prennent plaisir aux combats.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bête sauvage des roseaux » ; l’image désigne peut-être l’Égypte ou une autre puissance hostile.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de cette proposition est difficile. On peut aussi comprendre : « se soumettant avec des morceaux d’argent » ou « se prosternant avec des lingots d’argent », c’est-à-dire en apportant un tribut.'
    reason: alternative_reading
  - marker: c
    text: 'Le texte hébreu vocalisé porte un accompli : « il a dispersé ». « Disperse » comprend la forme comme un impératif, en continuité avec la demande du début du verset.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: גְּעַר
  choice: Menace
  rationale: L’impératif de גער exprime une réprimande divine énergique qui met les puissances hostiles au pas. « Menace » est naturel en français dans ce contexte et garde la force du verbe sans ajouter l’idée de destruction.
- source_word: חַיַּת קָנֶה
  choice: la bête des roseaux
  rationale: La traduction conserve littéralement l’image d’un animal dangereux des marais sans l’identifier explicitement à l’Égypte ni à une espèce précise.
- source_word: עֲדַת אַבִּירִים
  choice: la troupe des taureaux
  rationale: עֲדָה désigne un groupe et אַבִּירִים peut évoquer des taureaux. Dans la suite de l’image animale, « troupe des taureaux » est plus évocateur qu’une formulation abstraite comme « assemblée des puissants ».
- source_word: בְּעֶגְלֵי עַמִּים
  choice: parmi les veaux des peuples
  rationale: La préposition ב est comprise dans un sens local ou associatif. « Veaux » prolonge la métaphore bovine, tandis que « peuples » rend directement עַמִּים.
- source_word: מִתְרַפֵּס
  choice: piétinant
  rationale: La forme est obscure et discutée. Le sens hostile de « piétiner » s’accorde avec l’imagerie menaçante et avec les peuples épris de combats; l’interprétation concurrente, « se soumettre/se prosterner », est signalée en note.
- source_word: בְּרַצֵּי כָסֶף
  choice: des morceaux d’argent
  rationale: רַצֵּי est rare et obscur; il peut désigner des morceaux, des lingots ou des barres. « Morceaux d’argent » reste prudent et ne précise pas indûment leur forme ou leur fonction.
- source_word: בִּזַּר
  choice: Disperse
  rationale: Bien que la forme massorétique soit celle d’un accompli, elle est comprise ici comme la continuation, à valeur de requête, de l’impératif initial. La note conserve l’autre possibilité grammaticale.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: qui prennent plaisir aux combats
  rationale: La tournure rend le désir durable ou l’attrait pour la guerre exprimé par le verbe חפץ et le pluriel קְרָבוֹת, dans un français actuel et digne.
theological_decisions:
- issue: Identification de « la bête des roseaux »
  choice: Conserver la métaphore sans nommer une puissance historique
  alternative: Y voir explicitement l’Égypte ou, plus largement, un empire hostile
  rationale: Le cadre des roseaux peut suggérer l’Égypte et l’image peut représenter une puissance ennemie, mais le texte hébreu ne la nomme pas. La traduction maintient donc l’indétermination du symbole.
- issue: Sens de מִתְרַפֵּס dans la proposition relative à l’argent
  choice: Retenir l’action hostile « piétinant » dans le texte
  alternative: « se soumettant avec des morceaux d’argent » ou « se prosternant avec des lingots d’argent », en offrande de tribut
  rationale: Les deux analyses ont un appui lexical et contextuel. Le sens hostile s’insère bien dans la demande visant les peuples belliqueux, mais la lecture de soumission ou de tribut est assez importante pour figurer en note.
- issue: Valeur verbale de בִּזַּר
  choice: 'Lire une demande parallèle à l’impératif initial : « Disperse »'
  alternative: 'Lire l’accompli selon sa morphologie : « il a dispersé » ou « tu as dispersé »'
  rationale: La syntaxe poétique et le mouvement de supplication favorisent une nouvelle demande adressée à Dieu. La vocalisation massorétique permet toutefois une lecture à l’accompli, conservée en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme et les images animales sont maintenus; les termes trop familiers comme « rabroue » et les identifications historiques trop explicites sont évités.
