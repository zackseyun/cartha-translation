source:
  edition: WLC
  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: fr
  text: Chantez à Dieu, célébrez son nom ! Frayez un chemin à celui qui chevauche dans les plaines désertiques[a] ! Yah est son nom[b] ; exultez devant lui !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les nuées ». Le mot hébreu désigne habituellement des plaines arides ou des steppes, mais il est parfois compris ici dans un sens théophanique.
    reason: lexical_alternative
  - marker: b
    text: « Yah » est la forme courte du nom divin.
    reason: name_clarification
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Chantez pour Dieu
  rationale: L’impératif pluriel שִׁירוּ appelle directement la communauté à chanter, et אֱלֹהִים désigne ici le Dieu d’Israël.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: célébrez son nom
  rationale: Dans ce contexte de louange, זמר désigne le chant accompagné ou la célébration musicale. « Célébrez » est naturel en français et conserve la référence explicite à son nom.
- source_word: סֹלּוּ
  choice: Frayez un chemin
  rationale: Le verbe סלל signifie concrètement élever, aménager ou préparer une route. Cette traduction conserve l’image hébraïque d’une voie préparée pour la venue divine plutôt que de la transformer en invitation à chanter.
- source_word: לָרֹכֵב
  choice: à celui qui chevauche
  rationale: Le participe רֹכֵב fonctionne comme une désignation du Dieu qui avance en cavalier. « Celui qui chevauche » en préserve la forme et l’image dynamique.
- source_word: בָּעֲרָבוֹת
  choice: dans les plaines désertiques
  rationale: עֲרָבוֹת désigne le plus naturellement des steppes ou plaines arides. « Plaines désertiques » exprime clairement ce sens en français tout en laissant en note l’interprétation théophanique « nuées ».
- source_word: בְּיָהּ שְׁמוֹ
  choice: Yah est son nom
  rationale: יָהּ est la forme courte du nom divin. La translittération « Yah » respecte son statut de nom propre et la formulation française restitue naturellement l’identification exprimée par l’hébreu.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: exultez devant lui
  rationale: עלז exprime une joie vive et triomphante. « Exultez » garde l’intensité et le registre poétique de l’appel.
theological_decisions:
- issue: Interprétation de בָּעֲרָבוֹת
  choice: dans les plaines désertiques
  alternative: sur les nuées
  rationale: Le sens lexical ordinaire de עֲרָבוֹת renvoie aux régions arides ou aux steppes, ce qui convient au thème de la marche de Dieu dans le désert. L’interprétation « nuées », fondée sur l’imagerie théophanique et sur des parallèles du Proche-Orient ancien, reste assez importante pour être signalée sans remplacer le sens lexical principal.
- issue: Traduction de la forme courte יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: Le texte porte explicitement la forme courte du nom divin, distincte d’un simple titre. Sa translittération préserve cette particularité sans imposer une substitution confessionnelle.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsmes. Les impératifs pluriels et le rythme exclamatif conservent le caractère communautaire et jubilatoire du verset. L’image concrète de la route préparée est maintenue.
