  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: fr
  text: Dieu est le père des enfants sans père et le juge des veuves dans sa sainte demeure[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis sa sainte demeure » ; certaines traductions comprennent l’expression comme indiquant le lieu d’où Dieu agit, bien que la préposition hébraïque signifie littéralement « dans ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי יְתוֹמִים
  choice: le père des orphelins
  rationale: Le construit אֲבִי exprime directement la relation « père de ». En français actuel, « orphelins » rend naturellement יְתוֹמִים, qui désigne ici des enfants privés de père et socialement vulnérables.
- source_word: דַיַּן אַלְמָנוֹת
  choice: le juge des veuves
  rationale: דַיַּן désigne celui qui juge ou administre la justice. « Juge des veuves » conserve l’image judiciaire du texte, tandis que « défenseur » expliciterait une implication sans rendre aussi directement le terme hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים a ici un sens singulier et constitue le sujet de la proposition nominale.
- source_word: בִּמְעוֹן קָדְשׁוֹ
  choice: dans sa sainte demeure
  rationale: La préposition בְּ est rendue selon son sens locatif ordinaire, « dans ». מָעוֹן désigne une demeure, et קָדְשׁוֹ, littéralement « sa sainteté », qualifie ici cette demeure comme sainte.
theological_decisions:
- issue: Valeur judiciaire ou protectrice de דַיַּן
  choice: le juge des veuves
  alternative: le défenseur des veuves
  rationale: La fonction décrite implique que Dieu fait justice aux veuves, mais le nom hébreu est proprement judiciaire. Le choix retenu préserve cette image sans réduire ni développer son sens théologique.
- issue: Valeur de la préposition בְּ devant מְעוֹן
  choice: dans sa sainte demeure
  alternative: depuis sa sainte demeure
  rationale: « Dans » suit le sens explicite de la préposition hébraïque. « Depuis » ferait de la demeure le point de départ de l’action, lecture possible du contexte mais moins directement exprimée par la forme source.
translation_notes:
  register: Français moderne, international et digne. La proposition nominale hébraïque est rendue naturellement avec « est ». « Orphelins » est plus courant en français que des formulations telles que « enfants sans père », tandis que « juge » maintient volontairement l’imagerie juridique du texte.
