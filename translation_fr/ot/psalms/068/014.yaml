  text: בְּ/פָ֘רֵ֤שׂ שַׁדַּ֓י מְלָ֘כִ֤ים בָּ֗/הּ תַּשְׁלֵ֥ג בְּ/צַלְמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: fr
  text: 'Quand le Tout-Puissant y dispersa les rois,

    il neigea sur le Tsalmôn.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּפָרֵשׂ
  choice: Quand … dispersa
  rationale: La construction בְּ + infinitif construit exprime ici naturellement la circonstance temporelle; « dispersa » conserve le sens de פרשׂ dans ce contexte.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Équivalent français traditionnel et intelligible du titre divin Shaddaï.
- source_word: בָּהּ
  choice: y
  rationale: Le pronom féminin singulier renvoie probablement au pays ou à la réalité féminine évoquée dans le contexte; « y » préserve cette référence sans l’expliciter indûment.
- source_word: תַּשְׁלֵג
  choice: il neigea
  rationale: Rend la forme verbale à valeur passée dans le cadre poétique, sans décider si la neige est littérale ou métaphorique.
- source_word: בְּצַלְמוֹן
  choice: sur le Tsalmôn
  rationale: Translittère le nom de lieu et rend בְּ selon le français idiomatique employé avec une montagne.
theological_decisions:
- issue: Sujet et portée de la dispersion des rois
  choice: Le Tout-Puissant est présenté comme celui qui disperse les rois.
  alternative: Comprendre la forme comme une simple distribution ou un déploiement de rois.
  rationale: Dans le contexte d’une victoire divine, « disperser » est le sens le plus probable, tout en évitant d’ajouter la manière de l’action.
- issue: Nature de la neige sur le Tsalmôn
  choice: Conserver l’énoncé « il neigea » sans interprétation.
  alternative: Y voir explicitement une image de cadavres, de butin ou d’éclatante victoire.
  rationale: Le vers hébreu est très condensé et son image demeure débattue; la traduction ne doit pas trancher une ambiguïté poétique et théologique authentique.
translation_notes:
  register: Français moderne, sobre et poétique. Le nom « Tsalmôn » suit une translittération proche de l’hébreu; la structure en deux lignes conserve le parallélisme et l’énigme du texte source.
