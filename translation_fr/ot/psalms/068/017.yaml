  text: רֶ֤כֶב אֱלֹהִ֗ים רִבֹּתַ֣יִם אַלְפֵ֣י שִׁנְאָ֑ן אֲדֹנָ֥/י בָ֝֗/ם סִינַ֥י בַּ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/017.yaml
  text: The chariots of God are myriads[a], thousands upon thousands; the Lord is among them[c][b], Sinai in holiness.
translation:
  language: fr
  text: Les chars de Dieu sont des myriades, des milliers et des milliers[a] ; le Seigneur est parmi eux[b], comme au Sinaï, dans la sainteté[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « des milliers de shin’an ». Le sens de ce mot rare est incertain ; il semble évoquer la répétition ou la multiplicité, d’où « des milliers et des milliers ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le Seigneur est avec eux ». Toute la fin du verset est très condensée et difficile à interpréter.
    reason: alternative_reading
  - marker: c
    text: 'Le mot « comme » complète une syntaxe hébraïque elliptique. Autres traductions possibles : « le Seigneur est parmi eux — le Sinaï dans la sainteté », « le Sinaï est dans le sanctuaire » ou « le Seigneur est venu du Sinaï dans le lieu saint ».'
    reason: alternative_reading
lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: les chars de Dieu
  rationale: רֶכֶב peut désigner collectivement les chars ou la force de chars. « Les chars de Dieu » conserve l’image concrète et le rapport possessif du construit.
- source_word: רִבֹּתַיִם
  choice: des myriades
  rationale: La forme duelle peut évoquer littéralement deux myriades, mais elle fonctionne ici comme une expression poétique d’une multitude immense. « Des myriades » en garde la force sans imposer un décompte précis.
- source_word: אַלְפֵי שִׁנְאָן
  choice: des milliers et des milliers
  rationale: שִׁנְאָן est un terme rare et incertain, souvent compris comme exprimant la répétition ou la multiplicité. Cette tournure française rend ce sens probable tout en signalant l’incertitude en note.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Rendu français naturel du titre divin אֲדֹנָי.
- source_word: בָם
  choice: parmi eux
  rationale: La préposition ב avec suffixe peut signifier « en eux », « avec eux » ou « parmi eux ». Dans le contexte de la multitude de chars, « parmi eux » est le plus naturel.
- source_word: סִינַי
  choice: le Sinaï
  rationale: Nom propre traditionnellement rendu « le Sinaï » en français.
- source_word: בַּקֹּדֶשׁ
  choice: dans la sainteté
  rationale: קֹדֶשׁ peut désigner la sainteté ou un lieu saint. Le choix principal maintient l’abstraction et la formulation condensée de l’hébreu, tandis que le sens local est indiqué en note.
theological_decisions:
- issue: Interprétation de la proposition condensée אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: le Seigneur est parmi eux — le Sinaï dans la sainteté
  alternative: le Seigneur est parmi eux comme au Sinaï, dans la sainteté ; ou le Seigneur est venu du Sinaï dans le sanctuaire
  rationale: L’hébreu est elliptique et sa syntaxe admet plusieurs analyses. Le texte principal en conserve la tension et la brièveté, sans ajouter explicitement une comparaison (« comme au Sinaï ») ni un mouvement (« est venu ») absents de la formulation hébraïque.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition « des milliers et des milliers » est volontaire. Le tiret préserve la juxtaposition abrupte de l’hébreu, tandis que les notes exposent les principales lectures sans en imposer une.
