  text: יָק֣וּם אֱ֭לֹהִים יָפ֣וּצוּ אוֹיְבָ֑י/ו וְ/יָנ֥וּסוּ מְ֝שַׂנְאָ֗י/ו מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: fr
  text: Dieu se lève ; ses ennemis se dispersent[a], et ceux qui le détestent s’enfuient devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’interprétation traditionnelle comme souhait : « Que Dieu se lève ! Que ses ennemis se dispersent, et que ceux qui le détestent s’enfuient devant lui ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: יָקוּם
  choice: se lève
  rationale: Le qal inaccompli de קום peut exprimer ici soit une déclaration poétique saisissante, soit un souhait à valeur jussive. « Se lève » conserve l’image et permet une lecture déclarative naturelle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom régit ici un verbe au singulier et désigne le Dieu d’Israël.
- source_word: יָפוּצוּ
  choice: se dispersent
  rationale: Le qal inaccompli pluriel de פוץ décrit la dispersion des ennemis. La tournure pronominale est naturelle en français et respecte le parallélisme poétique.
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Le suffixe de troisième personne masculine singulière est rendu par le possessif « ses ».
- source_word: וְיָנוּסוּ
  choice: et … s’enfuient
  rationale: Le qal inaccompli pluriel de נוס exprime la fuite. « S’enfuient » convient au registre poétique tout en restant courant.
- source_word: מְשַׂנְאָיו
  choice: ceux qui le détestent
  rationale: Le participe substantivé conserve ainsi sa force verbale active. « Détestent » exprime clairement l’hostilité intense sans la raideur possible de « ceux qui le haïssent » en français courant.
- source_word: מִפָּנָיו
  choice: loin de lui
  rationale: L’expression signifie littéralement « de devant sa face », donc hors de sa présence. « Loin de lui » exprime idiomatiquement en français le mouvement d’éloignement provoqué par sa présence.
theological_decisions:
- issue: Valeur des inaccomplis dans ce contexte poétique de manifestation guerrière de Dieu
  choice: 'Déclaration au présent : « Dieu se lève ; ses ennemis se dispersent… »'
  alternative: 'Souhait ou prière : « Que Dieu se lève ! Que ses ennemis se dispersent, et que ceux qui le détestent s’enfuient loin de lui ! »'
  rationale: Les formes hébraïques peuvent être comprises comme une déclaration poétique saisissante ou avec une valeur jussive. Le texte principal retient la lecture déclarative sans supprimer l’ambiguïté, puisque la lecture optative traditionnelle figure en note.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme en trois mouvements et le parallélisme hébreu sont préservés ; la note maintient l’ambiguïté réelle entre déclaration et prière.
