id: PSA.68.31
reference: Psalms 68:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֶאֱתָ֣יוּ חַ֭שְׁמַנִּים מִנִּ֣י מִצְרָ֑יִם כּ֥וּשׁ תָּרִ֥יץ יָ֝דָ֗י/ו לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/031.yaml
  text: Nobles shall come from Egypt[b][a]; Cush shall quickly stretch out its hands to God.
translation:
  language: fr
  text: Des dignitaires[a] viendront d’Égypte ; Koush s’empressera de tendre ses mains vers Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des envoyés » ou « des princes ». Le terme hébreu est rare et désigne probablement des personnages importants venus d’Égypte.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie le singulier et personnifie ainsi la nation de Koush. L’expression peut aussi se rendre : « Koush se hâtera de tendre les mains vers Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: viendront
  rationale: Le qal inaccompli à la 3e personne du pluriel exprime ici le fait de venir ou d’arriver. Le contexte peut suggérer une venue avec des présents, mais le verbe lui-même ne l’énonce pas.
- source_word: חַשְׁמַנִּים
  choice: dignitaires
  rationale: Ce terme rare désigne probablement des personnages de haut rang. « Dignitaires » reste naturel en français et n’impose ni une fonction diplomatique précise ni un titre royal.
- source_word: מִנִּי מִצְרָיִם
  choice: d’Égypte
  rationale: La préposition indique simplement l’origine ; « d’Égypte » est la formulation française la plus idiomatique.
- source_word: כּוּשׁ
  choice: Koush
  rationale: La translittération conserve le nom géographique hébreu sans l’identifier de manière réductrice à l’Éthiopie moderne.
- source_word: תָּרִיץ
  choice: s’empressera de tendre
  rationale: Le hiphil de רוץ évoque l’action de faire courir ou de hâter. Avec « mains » comme complément, l’expression indique que Koush se hâte de les tendre.
- source_word: יָדָיו
  choice: ses mains
  rationale: Le suffixe masculin singulier correspond au nom singulier Koush, présenté comme une nation personnifiée. « Ses mains » conserve ce trait grammatical.
- source_word: לֵאלֹהִים
  choice: vers Dieu
  rationale: La préposition marque la direction du geste. « Vers Dieu » rend clairement cette orientation tout en laissant ouverte la nature exacte du geste.
theological_decisions:
- issue: Sens du geste de Koush qui tend les mains vers Dieu
  choice: Un geste dirigé vers Dieu, pouvant exprimer la prière, la supplication, la soumission ou l’adoration, sans en préciser davantage la portée.
  alternative: Un acte diplomatique précis d’offrande de tribut, ou l’affirmation explicite d’une pleine intégration à l’alliance.
  rationale: Le geste des mains tendues vers Dieu permet plusieurs nuances religieuses ou politiques. Le texte annonce le mouvement des nations vers Dieu, mais ne définit pas explicitement ce geste ; la traduction préserve donc cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. « Dignitaires » rend un terme rare sans surinterprétation ; « Koush » conserve le toponyme biblique. La formulation garde la personnification au singulier et l’ambiguïté du geste adressé à Dieu.
