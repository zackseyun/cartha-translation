  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: fr
  text: 'Ils ont vu tes processions, ô Dieu,

    les processions de mon Dieu, de mon Roi, dans le sanctuaire.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils ont vu tes démarches, ô Dieu, les démarches de mon Dieu, de mon Roi, dans la sainteté. »'
    reason: Préserve le sens plus général de הֲלִיכוֹת (« démarches », « marches ») et la lecture de בַּקֹּדֶשׁ comme « dans la sainteté », sans écarter la compréhension cultuelle du texte principal.
lexical_decisions:
- source_word: רָאוּ
  choice: On voit
  rationale: Le qal accompli 3e personne du pluriel signifie littéralement « ils ont vu ». Dans cette description poétique vivante, le français impersonnel « on voit » rend naturellement le témoignage collectif sans imposer un groupe précis; la valeur passée demeure signalée en note.
- source_word: הֲלִיכוֹתֶיךָ / הֲלִיכוֹת
  choice: tes cortèges / les cortèges
  rationale: Le nom pluriel désigne des déplacements ou des marches. Le contexte liturgique et la suite du psaume favorisent « cortèges ». Le pluriel et la répétition de l’hébreu sont conservés.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le contexte permet de comprendre le nom comme une apostrophe; « ô Dieu » conserve le ton poétique et solennel.
- source_word: אֵלִי
  choice: mon Dieu
  rationale: La forme avec suffixe de première personne exprime directement la possession.
- source_word: מַלְכִּי
  choice: mon Roi
  rationale: Le titre royal appliqué à Dieu est rendu directement. La majuscule permet d’identifier clairement le titre divin sans ajout doctrinal.
- source_word: בַקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: La préposition ב signifie normalement « dans » ou « en », et קֹדֶשׁ peut désigner le lieu saint. « Dans le sanctuaire » respecte cette construction tout en convenant à l’image processionnelle; l’autre lecture, « dans la sainteté », est conservée en note.
theological_decisions:
- issue: Nature et lieu des déplacements divins
  choice: Des cortèges de Dieu dans le sanctuaire
  alternative: Les voies ou les marches de Dieu dans la sainteté
  rationale: Le contexte festif et cultuel favorise une procession dans le lieu saint, mais les termes hébreux permettent une lecture plus générale. La note préserve cette ambiguïté sans résoudre excessivement la tension.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme et le pluriel hébreu sont conservés. « Cortèges » communique l’image cultuelle sans préciser un événement historique particulier.
