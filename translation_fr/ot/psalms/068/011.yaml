  text: אֲדֹנָ֥/י יִתֶּן אֹ֑מֶר הַֽ֝/מְבַשְּׂר֗וֹת צָבָ֥א רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/011.yaml
  text: The Lord gives the word[c][b][a]; the women who announce the good news are a great host.
translation:
  language: fr
  text: Le Seigneur donne la parole[a] ; les femmes qui annoncent la bonne nouvelle[b] sont une troupe nombreuse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message » ou « l’ordre ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici un participe au féminin pluriel : « celles qui apportent une bonne nouvelle » ou « les femmes messagères ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « une grande armée » ou « une grande multitude ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Le terme est ici un titre divin. « Le Seigneur » est son équivalent français naturel, sans le confondre avec le nom divin יהוה.
- source_word: יִתֶּן
  choice: donne
  rationale: L’imparfait hébreu peut avoir une valeur présente, future ou modale. Le présent convient au caractère vif et proclamatoire de ce vers poétique.
- source_word: אֹמֶר
  choice: la parole
  rationale: Le nom désigne une parole, un message ou un ordre. « La parole » conserve la concision et l’ouverture sémantique de l’hébreu.
- source_word: הַמְבַשְּׂרוֹת
  choice: les femmes qui annoncent la bonne nouvelle
  rationale: Le participe est explicitement au féminin pluriel et vient du verbe signifiant annoncer ou apporter une bonne nouvelle. La traduction préserve ces deux traits.
- source_word: צָבָא רָב
  choice: une troupe nombreuse
  rationale: צָבָא peut désigner une armée, une troupe ou une multitude organisée, tandis que רָב en souligne le grand nombre. « Une troupe nombreuse » garde la nuance collective et un possible arrière-plan militaire sans imposer « armée ».
theological_decisions:
- issue: Genre grammatical de הַמְבַשְּׂרוֹת
  choice: Rendre explicitement le féminin par « les femmes qui annoncent la bonne nouvelle »
  alternative: « ceux qui annoncent la nouvelle » ou « les messagers »
  rationale: Le féminin pluriel est marqué dans le texte hébreu. Le conserver respecte une donnée littéraire et grammaticale sans lui ajouter de portée doctrinale.
- issue: Nuance de צָבָא
  choice: « une troupe nombreuse »
  alternative: « une grande armée » ou « une grande multitude »
  rationale: Le contexte peut évoquer soit une compagnie très nombreuse, soit une force organisée. La traduction principale maintient cette tension, et la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme concis de l’hébreu, le féminin explicite des messagères et l’ambiguïté entre troupe, armée et multitude.
