id: PSA.68.9
reference: Psalms 68:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: fr
  text: Tu as fait tomber une pluie généreuse[a], ô Dieu ; quand ton héritage[b] était épuisé, tu l’as affermi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une pluie abondante » ou « une pluie de générosité » ; l’expression hébraïque souligne la largesse avec laquelle Dieu pourvoit.
    reason: lexical_alternative
  - marker: b
    text: « Ton héritage » peut désigner le peuple de Dieu, le pays, ou les deux ensemble dans cette expression poétique.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: une pluie généreuse
  rationale: גֶּשֶׁם désigne la pluie, tandis que נְדָבוֹת évoque ici ce qui est offert librement et avec largesse. « Une pluie généreuse » conserve l’image de la générosité divine tout en restant naturelle en français.
- source_word: תָּנִיף
  choice: tu as fait tomber
  rationale: Le hiphil de נוּף exprime littéralement l’action d’agiter ou de faire mouvoir. Associé à la pluie, il décrit Dieu qui la fait tomber ou la répand ; cette formulation rend clairement l’image et l’action divine.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô Dieu » garde le registre poétique et solennel sans être obscur.
- source_word: נַחֲלָתְךָ
  choice: ton héritage
  rationale: Le terme désigne un héritage, une part attribuée ou une possession. Cette traduction préserve la possibilité qu’il s’agisse du peuple de Dieu, du pays, ou des deux dans le langage poétique.
- source_word: וְנִלְאָה
  choice: quand … était épuisé
  rationale: La forme féminine singulière se rapporte à נַחֲלָה et décrit un état de lassitude ou d’épuisement. « Quand » explicite naturellement en français la relation circonstancielle suggérée par la proposition hébraïque.
- source_word: כּוֹנַנְתָּהּ
  choice: tu l’as affermi
  rationale: Le verbe כּוּן signifie établir, rendre ferme ou consolider. « Affermi » convient aussi bien à un pays qu’à un peuple et rend la reprise pronominale féminine.
theological_decisions:
- issue: Référent de « ton héritage »
  choice: Maintien de l’expression générale « ton héritage »
  alternative: Le pays d’Israël, le peuple d’Israël, ou l’ensemble du peuple et du pays
  rationale: Le texte hébreu ne tranche pas explicitement entre le territoire et le peuple appartenant à Dieu. La formulation retenue préserve cette densité poétique et théologique.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe « ô Dieu » conserve la solennité du psaume ; la syntaxe demeure claire pour un lectorat courant.
