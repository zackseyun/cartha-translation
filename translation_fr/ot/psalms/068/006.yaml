  text: אֱלֹהִ֤ים מ֘וֹשִׁ֤יב יְחִידִ֨ים בַּ֗יְתָ/ה מוֹצִ֣יא אֲ֭סִירִים בַּ/כּוֹשָׁר֑וֹת אַ֥ךְ ס֝וֹרֲרִ֗ים שָׁכְנ֥וּ צְחִיחָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/006.yaml
  text: God settles the solitary in a home; he brings out prisoners into prosperity[a], but the rebellious dwell in a parched land.
translation:
  language: fr
  text: Dieu installe dans un foyer ceux qui sont seuls ; il fait sortir les prisonniers pour les conduire vers la prospérité[a], mais les rebelles demeurent sur une terre aride.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers l’abondance » ; le terme hébreu, très rare, est aussi compris par certains comme signifiant « avec des chants » ou comme une autre expression de libération joyeuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le nom désigne le Dieu d’Israël au singulier, comme l’indiquent les participes qui suivent.
- source_word: מוֹשִׁיב
  choice: installe
  rationale: Le participe hiphil de ישׁב exprime l’action de faire habiter ou d’établir quelqu’un. « Installe » conserve cette valeur causative dans un français naturel.
- source_word: יְחִידִים
  choice: ceux qui sont seuls
  rationale: Le terme désigne des personnes seules ou isolées, sans réduire le sens à un sentiment subjectif de solitude.
- source_word: בַּיְתָה
  choice: dans un foyer
  rationale: בַּיִת peut désigner une maison ou un foyer. Ici, « foyer » évoque à la fois un lieu où habiter et une appartenance, sans imposer l’idée plus étroite de famille biologique.
- source_word: מוֹצִיא
  choice: fait sortir
  rationale: Le participe hiphil de יצא signifie faire sortir. Cette formulation directe préserve le parallélisme des actions divines.
- source_word: אֲסִירִים
  choice: les prisonniers
  rationale: Le mot désigne ceux qui sont liés ou détenus ; « prisonniers » est l’équivalent moderne le plus clair.
- source_word: בַּכּוֹשָׁרוֹת
  choice: vers la prospérité
  rationale: Ce terme rare et difficile est souvent rattaché à l’idée de réussite, de bien-être ou d’abondance. Le choix principal retient ce champ sémantique, tandis qu’une note préserve les autres analyses possibles.
- source_word: אַךְ
  choice: mais
  rationale: La particule marque ici le contraste net entre l’action bienfaisante de Dieu et le sort des rebelles.
- source_word: סוֹרֲרִים
  choice: les rebelles
  rationale: Le participe désigne ceux qui résistent avec obstination ou se révoltent.
- source_word: שָׁכְנוּ
  choice: demeurent
  rationale: Le parfait de שכן a ici une portée générale dans le contexte poétique. Le présent français rend naturellement cette valeur.
- source_word: צְחִיחָה
  choice: une terre aride
  rationale: Le nom évoque un lieu desséché. « Terre aride » conserve l’image poétique et le contraste avec le foyer et la prospérité.
theological_decisions:
- issue: Nature de l’action de Dieu envers les personnes seules
  choice: Dieu procure un foyer stable à ceux qui sont isolés.
  alternative: Dieu place les personnes seules dans des familles.
  rationale: L’hébreu mentionne littéralement les personnes seules et une maison ou un foyer. La traduction retenue préserve cette image sans la limiter aux structures familiales biologiques.
- issue: Sens du terme rare בַּכּוֹשָׁרוֹת
  choice: vers la prospérité
  alternative: vers l’abondance, ou avec des chants de joie
  rationale: Le terme est lexicalement incertain. Le texte principal retient l’analyse liée au bien-être ou à la réussite, mais la note signale les principales autres possibilités sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme antithétique du verset est conservé, avec un vocabulaire concret et sans tournure confessionnelle particulière.
