  text: וְֽ/צַדִּיקִ֗ים יִשְׂמְח֣וּ יַֽ֭עַלְצוּ לִ/פְנֵ֥י אֱלֹהִ֗ים וְ/יָשִׂ֥ישׂוּ בְ/שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/003.yaml
  text: But the righteous will be glad[a]; they will exult before God[b], and they will rejoice with gladness.
translation:
  language: fr
  text: Mais les justes se réjouiront[a] ; ils exulteront devant Dieu[b] et ils se réjouiront avec joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et les justes se réjouiront. » La conjonction hébraïque peut simplement se traduire par « et » ; « mais » dans le texte principal souligne le contraste avec le verset précédent.'
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « devant Dieu », c’est-à-dire en présence de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: Mais les justes
  rationale: צַדִּיקִים désigne les personnes justes. « Les justes » est naturel dans le registre des psaumes. La conjonction וְ peut signifier simplement « et », mais « mais » rend ici le contraste discursif avec le sort des méchants au verset précédent.
- source_word: יִשְׂמְחוּ
  choice: se réjouiront
  rationale: Le verbe שׂמח exprime la joie. « Se réjouiront » est clair, naturel et distinct de l'exultation plus vive exprimée ensuite.
- source_word: יַעַלְצוּ
  choice: ils exulteront
  rationale: עלץ évoque une joie vive et débordante. « Exulteront » conserve cette intensité et la progression du texte hébreu.
- source_word: לִפְנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: L'expression signifie littéralement « devant la face de Dieu ». « Devant Dieu » reste concise et fidèle, tout en évoquant naturellement sa présence.
- source_word: וְיָשִׂישׂוּ
  choice: et seront transportés
  rationale: שׂוש exprime une joie exultante. La tournure « seront transportés de joie », complétée par בְשִׂמְחָה, restitue naturellement l'intensification finale sans répéter simplement « se réjouir ».
- source_word: בְשִׂמְחָה
  choice: de joie
  rationale: שִׂמְחָה précise ou intensifie la manière de se réjouir. Dans l'expression française « transportés de joie », le complément conserve l'accent appuyé du cumul hébreu des termes de joie.
