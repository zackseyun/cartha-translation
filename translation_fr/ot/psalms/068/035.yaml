- from: Dieu est redoutable depuis tes sanctuaires[a]. Le Dieu d’Israël, c’est lui qui donne force et grande puissance au peuple. Béni soit Dieu !
  to: Dieu est redoutable, depuis tes lieux saints[a]. Le Dieu d’Israël, c’est lui qui donne force et grande puissance au peuple. Béni soit Dieu !
  rationale: La révision limitée de « sanctuaires » en « lieux saints » améliore l’idiomaticité française tout en conservant le pluriel et la portée sacrée du terme hébreu. La virgule détache le complément afin de favoriser sa lecture spatiale plutôt que temporelle. La note préserve la formulation littérale, le singulier possible et l’alternative « dans ».
