source:
  edition: WLC
  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: fr
  text: Dieu est redoutable, depuis tes lieux saints[a]. Le Dieu d’Israël, c’est lui qui donne force et grande puissance au peuple. Béni soit Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis ton sanctuaire » ou « dans ton sanctuaire ». L’hébreu dit littéralement « depuis tes sanctuaires » ; ce pluriel peut désigner la demeure sainte de Dieu dans un sens collectif ou majestatif.
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: redoutable
  rationale: Le terme décrit celui qui inspire la crainte révérencielle et l’émerveillement. « Redoutable » conserve cette majesté impressionnante sans suggérer que Dieu serait simplement « terrible » au sens moral.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, elle désigne ici le Dieu unique d’Israël.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: depuis tes sanctuaires
  rationale: La forme hébraïque porte la préposition « depuis/de » et un nom au pluriel avec suffixe de deuxième personne du singulier. Le texte principal en préserve donc le nombre et la relation spatiale, malgré le caractère inhabituel de l’expression en français.
- source_word: אֵל יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette apposition identifie le Dieu mentionné comme celui d’Israël. L’article défini est naturel en français.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Cette tournure française rend l’insistance portée par le pronom hébreu explicite.
- source_word: נֹתֵן
  choice: donne
  rationale: Le participe décrit une action caractéristique de Dieu ; le présent simple convient en français.
- source_word: עֹז
  choice: force
  rationale: Le nom désigne couramment la force ou la vigueur.
- source_word: וְתַעֲצֻמוֹת
  choice: et grande puissance
  rationale: Le substantif pluriel exprime une puissance considérable ou intensifiée. « Grande puissance » le distingue de עֹז tout en rendant cette intensité dans un français naturel.
- source_word: לָעָם
  choice: au peuple
  rationale: L’hébreu dit littéralement « au peuple » sans possessif ; la traduction n’ajoute donc pas « son ».
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule doxologique se rend naturellement par « Béni soit Dieu ! ».
theological_decisions:
- issue: Nombre et sens de « sanctuaires »
  choice: depuis tes sanctuaires
  alternative: depuis ton sanctuaire ; dans ton sanctuaire
  rationale: Le nom hébreu est morphologiquement pluriel et précédé de la préposition מִן. Le texte principal maintient ces deux traits. La note signale toutefois le singulier collectif ou majestatif possible ainsi qu’une compréhension plus large de la préposition, sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Redoutable » exprime la crainte révérencielle ; « c’est lui qui » conserve l’emphase du pronom hébreu. La formulation inhabituelle « depuis tes sanctuaires » est volontairement maintenue et expliquée en note.
