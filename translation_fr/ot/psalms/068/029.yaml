  text: מֵֽ֭/הֵיכָלֶ/ךָ עַל יְרוּשָׁלִָ֑ם לְ/ךָ֤ יוֹבִ֖ילוּ מְלָכִ֣ים שָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/029.yaml
  text: From your temple above Jerusalem[c][b][a], kings will bring tribute to you.
translation:
  language: fr
  text: De ton temple qui domine Jérusalem[a], des rois t’apporteront un tribut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « À cause de ton temple à Jérusalem, des rois t’apporteront des présents. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « un présent », « un don ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: Depuis ton temple
  rationale: מִן exprime ici naturellement le point de départ ou la provenance. « Depuis » rend ce rapport spatial sans exclure les autres analyses possibles signalées en note.
- source_word: עַל יְרוּשָׁלִָם
  choice: qui domine Jérusalem
  rationale: עַל peut exprimer une position au-dessus de quelque chose. En français, « qui domine Jérusalem » évoque naturellement la situation élevée du temple sans suggérer qu’il flotte au-dessus de la ville.
- source_word: לְךָ
  choice: t’
  rationale: Le pronom au datif désigne Dieu comme destinataire de ce que les rois apportent; le pronom français placé devant « apporteront » est idiomatique.
- source_word: יוֹבִילוּ
  choice: apporteront
  rationale: Le hiphil de יבל signifie ici faire venir ou apporter quelque chose à un destinataire.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le nom désigne directement des rois et conserve l’imagerie royale du texte.
- source_word: שַׁי
  choice: un tribut
  rationale: שַׁי désigne un don ou un présent offert, souvent à un supérieur. « Tribut » convient au geste de rois rendant hommage à Dieu, tout en laissant l’alternative plus générale en note.
theological_decisions:
- issue: Rapport syntaxique entre le temple et Jérusalem
  choice: Le temple est présenté comme dominant Jérusalem, et les rois apportent un tribut à Dieu.
  alternative: « À cause de ton temple à Jérusalem, des rois t’apporteront des présents. »
  rationale: La construction hébraïque permet de comprendre מִן de manière spatiale ou causale et עַל comme « au-dessus de » ou, plus largement, comme une indication de lieu. Le texte principal conserve la valeur spatiale la plus directe, tandis que la note préserve l’autre analyse sans trancher une ambiguïté réelle.
translation_notes:
  register: Français moderne, courant et digne. « Qui domine Jérusalem » rend la relation spatiale de façon naturelle; « tribut » conserve la nuance politique et honorifique du don royal.
