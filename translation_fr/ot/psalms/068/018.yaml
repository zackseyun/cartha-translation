source:
  edition: WLC
  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: fr
  text: Tu es monté dans les hauteurs ; tu as emmené des captifs ; tu as reçu des dons parmi les humains[a], même parmi les rebelles, afin que Yah Dieu y demeure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as reçu des dons de la part des humains ». La préposition hébraïque peut indiquer le milieu (« parmi ») ou la provenance (« de la part de »).'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que Yah Dieu demeure parmi eux » ; autre compréhension possible : « comme demeure pour Yah Dieu ». La proposition hébraïque est concise et peut s’analyser de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ
  choice: tu es monté
  rationale: Le qal accompli à la 2e personne du masculin singulier décrit une montée. « Monter » conserve simplement l’image verticale et triomphale.
- source_word: לַמָּרוֹם
  choice: dans les hauteurs
  rationale: מָרוֹם désigne la hauteur ou un lieu élevé. Cette expression française naturelle garde la portée spatiale et le registre poétique sans préciser indûment le lieu.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: tu as emmené des captifs
  rationale: La construction à objet de même racine exprime avec force la prise et la conduite de captifs. Une reproduction littérale comme « tu as fait captive la captivité » serait obscure en français moderne ; la formulation retenue conserve l’image du cortège victorieux.
- source_word: לָקַחְתָּ
  choice: tu as reçu
  rationale: לקח signifie couramment « prendre », mais avec מַתָּנוֹת le sens contextuel de « recevoir des dons » convient naturellement, notamment dans une scène de triomphe et d’hommage.
- source_word: מַתָּנוֹת
  choice: des dons
  rationale: Le nom désigne des présents ou des dons. « Dons » reste direct et n’impose pas l’interprétation plus précise de « tribut ».
- source_word: בָּאָדָם
  choice: parmi les humains
  rationale: אָדָם peut désigner collectivement l’humanité. La préposition ב peut indiquer ici le milieu (« parmi ») ou éventuellement la provenance (« de la part de ») ; le texte principal retient la première lecture et signale l’autre en note.
- source_word: וְאַף סוֹרְרִים
  choice: même parmi les rebelles
  rationale: וְאַף ajoute une extension emphatique, tandis que סוֹרְרִים désigne ceux qui résistent ou se révoltent. La reprise de « parmi » explicite naturellement en français le lien elliptique avec le groupe précédent.
- source_word: לִשְׁכֹּן
  choice: afin que … demeure
  rationale: L’infinitif précédé de ל peut exprimer ici le but ou le résultat. « Afin que » rend cette valeur possible, et « demeure » convient au langage de la présence divine.
- source_word: יָהּ אֱלֹהִים
  choice: Yah Dieu
  rationale: יָהּ est la forme courte du nom divin et ne doit pas être confondue avec le tétragramme complet. « Yah » en conserve la forme, tandis que « Dieu » rend אֱלֹהִים.
theological_decisions:
- issue: Valeur de la préposition ב dans בָּאָדָם
  choice: parmi les humains
  alternative: de la part des humains
  rationale: La préposition permet une lecture de sphère ou de provenance. Le texte principal évite de déterminer que les dons sont nécessairement reçus des humains, tandis que la note conserve explicitement cette possibilité.
- issue: Syntaxe et référent de לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: afin que Yah Dieu y demeure
  alternative: afin que Yah Dieu demeure parmi eux ; comme demeure pour Yah Dieu
  rationale: La proposition hébraïque est très condensée et n’exprime pas explicitement le complément de lieu. Le pronom « y » fournit une syntaxe française lisible sans identifier précisément le lieu ou le groupe concerné ; les autres analyses restent signalées.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe au singulier. Les points-virgules maintiennent le rythme des propositions parallèles. Les ajouts nécessaires à la fluidité française sont limités, et les ambiguïtés principales sont conservées en notes.
