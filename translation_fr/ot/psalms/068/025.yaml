  text: קִדְּמ֣וּ שָׁ֭רִים אַחַ֣ר נֹגְנִ֑ים בְּ/ת֥וֹךְ עֲ֝לָמ֗וֹת תּוֹפֵפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/025.yaml
  text: The singers went before[a], the musicians after[b], in the midst of young women beating tambourines.
translation:
  language: fr
  text: Les chanteurs marchaient devant, les musiciens derrière, au milieu des jeunes femmes qui jouaient du tambourin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִדְּמוּ
  choice: marchaient devant
  rationale: Le piel décrit ici la place des chanteurs en tête de la procession. « Marchaient devant » exprime naturellement en français le mouvement et l’organisation du cortège.
- source_word: שָׁרִים
  choice: les chanteurs
  rationale: Dans le parallélisme avec נֹגְנִים et le contexte musical, le mot désigne ceux qui chantent, et non des princes.
- source_word: אַחַר
  choice: derrière
  rationale: Le terme situe les musiciens après les chanteurs dans l’ordre spatial de la procession.
- source_word: נֹגְנִים
  choice: les musiciens
  rationale: Le participe de נגן désigne ceux qui jouent d’un instrument. « Musiciens » est actuel, clair et convient au parallélisme poétique.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Cette expression conserve l’image spatiale du texte hébreu sans alourdir la phrase.
- source_word: עֲלָמוֹת
  choice: jeunes femmes
  rationale: Le mot désigne de jeunes femmes en âge de se marier. « Jeunes femmes » est précis et moderne, tandis que « vierges » préciserait un aspect que le terme n’affirme pas nécessairement.
- source_word: תּוֹפֵפוֹת
  choice: qui jouaient du tambourin
  rationale: La forme évoque l’action de frapper ou de jouer du תֹּף, instrument à percussion proche du tambourin. La tournure française est naturelle et garde la valeur musicale du participe.
