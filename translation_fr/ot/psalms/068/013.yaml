id: PSA.68.13
reference: Psalms 68:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: fr
  text: Même si vous êtes couchés parmi les enclos à moutons[a], les ailes d’une colombe sont couvertes d’argent, et ses grandes plumes, d’or aux reflets jaune-vert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entre les bâts » ou « entre les pierres du foyer » ; le terme hébreu est incertain.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque peut aussi se traduire par « d’or verdâtre » ou « d’un éclat d’or jaune-vert ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Même si
  rationale: Dans ce contexte poétique, אִם peut introduire une proposition conditionnelle ou concessive. « Même si » rend naturellement la lecture concessive probable sans effacer entièrement sa valeur conditionnelle.
- source_word: תִּשְׁכְּבוּן
  choice: vous êtes couchés
  rationale: Le verbe שׁכב évoque le fait de se coucher ou d’être étendu. Cette formulation française conserve l’image physique et s’accorde avec la deuxième personne du pluriel.
- source_word: בֵּין שְׁפַתָּיִם
  choice: parmi les enclos à moutons
  rationale: Le terme שְׁפַתָּיִם est obscur et très discuté. La traduction traditionnelle par des enclos ou parcs à moutons convient à l’image d’un lieu où l’on se couche, tandis que les autres interprétations importantes sont signalées en note.
- source_word: כַּנְפֵי יוֹנָה
  choice: les ailes d’une colombe
  rationale: Cette traduction directe de la chaîne construite conserve l’image poétique et reste naturelle en français.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: sont couvertes d’argent
  rationale: Le participe de חפה exprime l’idée d’être couvert ou revêtu. « Couvertes d’argent » est clair, sobre et proche de la forme hébraïque.
- source_word: אֶבְרוֹתֶיהָ
  choice: ses grandes plumes
  rationale: אֶבְרָה désigne les fortes plumes de l’aile, ou rémiges. « Grandes plumes » est plus immédiatement compréhensible que le terme technique « rémiges », tout en restant plus précis que le simple mot « plumes ».
- source_word: בִּירַקְרַק חָרוּץ
  choice: d’or aux reflets jaune-vert
  rationale: חָרוּץ peut désigner l’or, tandis que יְרַקְרַק évoque une teinte verdâtre ou jaune-vert. La formulation retenue préserve la couleur inhabituelle du texte au lieu de la réduire à un simple « or jaune ».
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique mais accessible. La structure abrupte et l’image énigmatique de l’hébreu sont conservées sans ajout explicatif. « Grandes plumes » évite un technicisme inutile, tandis que « jaune-vert » maintient la nuance chromatique singulière du texte source.
