  text: מַלְכֵ֣י צְ֭בָאוֹת יִדֹּד֣וּ/ן יִדֹּד֑וּ/ן וּ/נְוַת בַּ֝֗יִת תְּחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/012.yaml
  text: Kings of armies flee[a], they flee, and the woman at home divides the spoil.
translation:
  language: fr
  text: 'Les rois des armées fuient, ils fuient,

    et la femme à la maison partage le butin.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la maîtresse de maison partage le butin » ; littéralement : « l’habitante de la maison ». L’expression hébraïque est au féminin singulier et peut évoquer la femme au foyer qui reçoit et répartit le butin de guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי צְבָאוֹת
  choice: les rois des armées
  rationale: Le syntagme construit désigne des rois associés à des armées. Cette formulation conserve le rapport entre les deux noms et le sens militaire, sans évoquer artificiellement un titre divin.
- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: fuient, ils fuient
  rationale: La répétition hébraïque renforce et dramatise la fuite. La reproduire préserve directement l'effet poétique.
- source_word: וּנְוַת בַּיִת
  choice: celle qui reste à la maison
  rationale: L'expression est au féminin singulier et présente une femme demeurant au foyer pendant la bataille. « Celle qui reste à la maison » est naturel en français et évite les connotations modernes ou réductrices de « femme au foyer ».
- source_word: תְּחַלֵּק
  choice: partage
  rationale: La forme intensive exprime ici l'action de diviser ou de répartir les prises. « Partage » convient naturellement à la distribution d'un butin.
- source_word: שָׁלָל
  choice: le butin
  rationale: Le nom désigne les biens pris à la guerre. « Butin » est le terme français courant, précis et idiomatique.
