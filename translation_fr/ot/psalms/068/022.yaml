  text: אָמַ֣ר אֲ֭דֹנָ/י מִ/בָּשָׁ֣ן אָשִׁ֑יב אָ֝שִׁ֗יב מִֽ/מְּצֻל֥וֹת יָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: fr
  text: 'Le Seigneur a dit[a] : « Je les ramènerai du Bashân, je les ramènerai des profondeurs de la mer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Je ramènerai du Bashân, je ramènerai des profondeurs de la mer. » En hébreu, l’objet du verbe n’est pas exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Le titre divin אֲדֹנָי est rendu naturellement en français par « le Seigneur » ; il ne s’agit pas ici du nom divin YHWH.
- source_word: אָמַר
  choice: a dit
  rationale: Le qatal introduit directement la parole divine. Le passé composé est naturel en français moderne dans cette formulation.
- source_word: מִבָּשָׁן
  choice: du Bashân
  rationale: Le nom géographique est translittéré ; la contraction « du » rend la préposition מִן et l’usage français courant avec ce nom de région.
- source_word: אָשִׁיב ... אָשִׁיב
  choice: je les ramènerai… je les ramènerai
  rationale: Le hiphil de שׁוב signifie ici « ramener ». Le pronom « les », absent mais implicite en hébreu, est nécessaire à une formulation française naturelle. La répétition est conservée pour son effet d’insistance.
- source_word: מִמְּצֻלוֹת יָם
  choice: des profondeurs de la mer
  rationale: מְצֻלוֹת désigne les profondeurs des eaux. Cette expression française idiomatique conserve l’image d’un lieu extrêmement profond ou inaccessible.
theological_decisions:
- issue: Objet implicite du verbe répété אָשִׁיב
  choice: 'Ajouter « les » : « je les ramènerai »'
  alternative: 'Conserver l’objet non exprimé : « je ramènerai du Bashân ; je ramènerai des profondeurs de la mer »'
  rationale: L’hébreu ne précise pas l’objet, tandis que le français exige normalement un complément avec « ramener ». « Les » explicite sobrement l’objet fourni par le contexte sans trancher davantage son identité ; une note signale l’ambiguïté formelle.
translation_notes:
  register: Français moderne, clair et digne. La répétition hébraïque est maintenue, ainsi que le parallélisme des deux provenances. La ponctuation française encadre la parole directe.
