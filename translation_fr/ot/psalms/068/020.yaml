  yaml_path: translation/ot/psalms/068/020.yaml
  text: God is to us a God of salvations[b][a], and to the Lord GOD belong escapes from death.
translation:
  language: fr
  text: Dieu est pour nous un Dieu de délivrances[a] ; et à Yahweh, le Seigneur, appartiennent les voies pour échapper à la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Dieu de saluts ». Le pluriel hébreu peut souligner des actes de secours répétés ou multiples.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les sorties » ou « les débouchés » en rapport avec la mort. Dans ce contexte, il s’agit de voies permettant d’échapper à la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Dieu
  rationale: L’article défini désigne ici Dieu de manière précise. En français, « Dieu » employé comme nom propre exprime naturellement cette détermination.
- source_word: לָנוּ
  choice: pour nous
  rationale: La préposition ל marque ici la relation et le bénéfice. « Pour nous » est plus idiomatique en français que « à nous » dans cette proposition.
- source_word: אֵל
  choice: un Dieu
  rationale: Le second emploi est prédicatif. La répétition de « Dieu » conserve l’insistance de l’hébreu au lieu de fondre les deux occurrences.
- source_word: לְמוֹשָׁעוֹת
  choice: de délivrances
  rationale: Le pluriel hébreu est conservé afin d’évoquer des délivrances répétées ou multiples. « Saluts » serait possible, mais moins clairement associé ici à des actes concrets de secours.
- source_word: וְלֵיהוָה אֲדֹנָי
  choice: à Yahweh, le Seigneur
  rationale: Cette formulation rend distinctement le nom divin יהוה et le titre אֲדֹנָי, dans leur ordre hébreu, tout en restant intelligible en français.
- source_word: לַמָּוֶת
  choice: de la mort
  rationale: Avec תּוֹצָאוֹת, la préposition exprime des sorties par rapport à la mort ; le contexte conduit à comprendre des voies permettant d’en sortir.
- source_word: תּוֹצָאוֹת
  choice: les voies de sortie
  rationale: Le nom désigne littéralement des sorties ou débouchés. « Voies de sortie » garde l’image et le pluriel tout en exprimant naturellement l’idée d’échapper à la mort.
theological_decisions:
- issue: Traduction du nom divin יהוה accompagné d’אֲדֹנָי
  choice: Yahweh, le Seigneur
  alternative: le Seigneur DIEU
  rationale: Le texte contient à la fois le nom propre divin et le titre « Seigneur ». Les rendre séparément préserve cette distinction sans remplacer le nom par un titre.
- issue: Sens des « sorties » en rapport avec la mort
  choice: des voies permettant de sortir de la mort
  alternative: des issues conduisant à la mort
  rationale: La construction peut sembler formellement ouverte, mais le contexte de délivrance favorise nettement l’idée que Dieu procure des échappatoires à la mort. La note maintient visible l’image littérale.
translation_notes:
  register: Français international moderne, digne et accessible. « Un Dieu de délivrances » est volontairement légèrement marqué afin de conserver la répétition de אֵל et le pluriel מוֹשָׁעוֹת ; la note en éclaire la portée.
