  text: בְּֽ֭/מַקְהֵלוֹת בָּרְכ֣וּ אֱלֹהִ֑ים יְ֝הוָ֗ה מִ/מְּק֥וֹר יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: fr
  text: 'Dans les assemblées, bénissez Dieu,

    Yahweh[b], depuis la source d’Israël[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « de la source d’Israël ». L’expression hébraïque est elliptique : elle peut qualifier ceux qui sont appelés à bénir (« vous qui êtes de la source d’Israël ») ou se rattacher à l’appel à bénir (« depuis la source d’Israël »).'
    reason: alternative_reading
  - marker: b
    text: 'Hébreu : « YHWH », le nom divin, traditionnellement rendu par « le Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: Dans les assemblées
  rationale: Le pluriel מַקְהֵלוֹת désigne des groupes réunis. « Assemblées » conserve ce pluriel sans connotation ecclésiale institutionnelle excessive.
- source_word: בָּרְכוּ
  choice: bénissez
  rationale: L’impératif pluriel de ברך, avec Dieu pour objet, invite les adorateurs à dire du bien de Dieu et à le célébrer. « Bénissez » maintient le sens lexical et le ton cultuel.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom a ici un référent singulier, identifié en apposition par le nom divin Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom propre présent dans le texte hébreu plutôt que de lui substituer le titre « le Seigneur ».
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  choice: vous qui êtes issus de la source d’Israël
  rationale: מָקוֹר évoque une source ou une fontaine. La phrase hébraïque est elliptique; l’explicitation « vous qui êtes issus » présente naturellement en français l’interprétation selon laquelle elle qualifie les adorateurs, tout en conservant l’image de leur origine commune.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte massorétique porte explicitement le tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Lien syntaxique de מִמְּקוֹר יִשְׂרָאֵל
  choice: 'La phrase décrit l’origine des adorateurs : « vous qui êtes issus de la source d’Israël »'
  alternative: 'La phrase peut modifier l’acte de bénir : « depuis la source d’Israël »'
  rationale: L’hébreu est elliptique et permet les deux analyses. La lecture vocative donne une phrase française naturelle et correspond vraisemblablement à l’appel adressé aux descendants d’Israël, tandis que la note maintient l’autre construction possible.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme est marqué par un retour à la ligne; le pluriel « assemblées » et l’image de la « source » sont conservés. L’explicitation « vous qui êtes issus » rend lisible l’ellipse hébraïque sans masquer l’autre analyse, signalée en note.
