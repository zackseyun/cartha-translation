  text: לָ֤/מָּה תְּֽרַצְּדוּ/ן֮ הָרִ֪ים גַּבְנֻ֫נִּ֥ים הָ/הָ֗ר חָמַ֣ד אֱלֹהִ֣ים לְ/שִׁבְתּ֑/וֹ אַף יְ֝הוָ֗ה יִשְׁכֹּ֥ן לָ/נֶֽצַח׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: fr
  text: Pourquoi bondissez-vous[a], montagnes aux multiples cimes, face à la montagne que Dieu a désirée pour y demeurer ? Oui, Yahweh y demeurera pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi regardez-vous avec jalousie, montagnes aux multiples cimes ? » Le verbe hébreu est rare et son sens est incertain : il peut évoquer le fait de bondir ou de sautiller, ou celui de regarder avec envie ou d’un regard hostile.'
    reason: alternative lexicale
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: bondissez-vous
  rationale: Le verbe hébreu est rare et son sens incertain. « Bondir » conserve l’image possible d’un mouvement, sans masquer dans la note l’autre interprétation contextuelle, celle d’un regard jaloux ou hostile.
- source_word: הָרִים גַּבְנֻנִּים
  choice: montagnes aux multiples cimes
  rationale: Cette expression rend l’image de reliefs marqués par de nombreuses bosses, crêtes ou cimes, dans un français naturel et poétique.
- source_word: הָהָר
  choice: la montagne
  rationale: Le texte désigne une montagne précise sans la nommer. La traduction n’ajoute donc pas explicitement « Sion ».
- source_word: חָמַד
  choice: a désirée
  rationale: Le verbe exprime le désir ou le plaisir pris en quelque chose. « Désirer » reste proche de l’hébreu, tandis que « choisir » expliciterait une implication.
- source_word: לְשִׁבְתּוֹ
  choice: pour demeure
  rationale: La formule exprime la destination de la montagne comme lieu où Dieu demeure. « Pour demeure » est concise, digne et idiomatique.
- source_word: אַף
  choice: Oui
  rationale: Ici, la particule renforce solennellement l’affirmation qui suit plutôt qu’elle n’ajoute simplement un nouvel élément.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: y habitera pour toujours
  rationale: « Habiter » rend le sens de résidence durable; « y » reprend naturellement la montagne choisie, et « pour toujours » exprime la durée indiquée.
theological_decisions:
- issue: Identification explicite de la montagne à Sion
  choice: Conserver « la montagne » dans le texte principal
  alternative: Traduire explicitement par « le mont Sion »
  rationale: Le contexte général du psaume évoque Sion, mais ce verset emploie seulement le nom commun défini. La traduction préserve cette formulation sans ajouter le nom propre.
- issue: Sens du verbe rare תְּרַצְּדוּן dans le contraste entre les montagnes
  choice: Employer « bondissez-vous » et signaler l’incertitude en note
  alternative: Employer « regardez-vous avec jalousie » ou « regardez-vous de travers »
  rationale: Le sens de mouvement est une possibilité lexicale ancienne, tandis que le contexte permet un regard envieux ou hostile. Le texte principal retient l’image concrète sans supprimer l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. La question rhétorique garde son étrangeté imagée, tandis que la note expose franchement l’incertitude lexicale. « Yahweh » conserve le nom divin et « y » explicite seulement le lieu déjà présent dans le contexte.
