  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: fr
  text: Reconnaissez la force de Dieu[a] ! Sa majesté est sur Israël, et sa force est dans les cieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Donnez de la force à Dieu » ; il s’agit ici de reconnaître et de proclamer sa force.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans les nuages » ou « dans le ciel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ עֹז לֵאלֹהִים
  choice: Reconnaissez la force de Dieu
  rationale: Littéralement « donnez de la force à Dieu ». Dans cette exhortation poétique, l’expression appelle les fidèles à reconnaître et à proclamer la force qui appartient à Dieu, non à lui fournir une force qui lui manquerait.
- source_word: גַּאֲוָתוֹ
  choice: sa majesté
  rationale: Dans un contexte de louange adressée à Dieu, גַּאֲוָה exprime ici son élévation glorieuse ou sa majesté, plutôt qu’un orgueil condamnable.
- source_word: עַל יִשְׂרָאֵל
  choice: s’étend sur Israël
  rationale: La préposition עַל peut exprimer une position ou une domination au-dessus de. « S’étend sur » rend naturellement l’image sans imposer une interprétation plus étroite.
- source_word: וְעֻזּוֹ
  choice: et sa force
  rationale: La répétition de « force » préserve le lien poétique avec עֹז dans la première proposition.
- source_word: בַּשְּׁחָקִים
  choice: dans les cieux
  rationale: Le terme poétique שְׁחָקִים désigne les hauteurs célestes, le ciel ou les nuages. « Les cieux » conserve ici le registre élevé et l’ampleur cosmique de l’image.
theological_decisions:
- issue: L’impératif signifie-t-il que les humains donnent littéralement de la force à Dieu ?
  choice: « Reconnaissez la force de Dieu »
  alternative: « Donnez de la force à Dieu »
  rationale: La formulation hébraïque conserve littéralement l’idée de « donner », mais, dans ce contexte de louange, elle invite à attribuer ou reconnaître à Dieu la force qui est la sienne. La traduction évite de suggérer que Dieu recevrait des humains une capacité qui lui manque, tandis que la note préserve la forme littérale.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif est direct et adapté à la poésie de louange. « S’étend sur » explicite légèrement la proposition nominale hébraïque tout en maintenant sa concision et son ambiguïté spatiale ou souveraine.
