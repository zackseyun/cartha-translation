  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: fr
  text: De même qu’on chasse la fumée, tu les chasses[a] ; comme la cire fond devant le feu[b][c], les méchants périssent devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu les disperses » ; le verbe hébreu peut évoquer ce qui est chassé, éparpillé ou emporté par le vent.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « de devant le feu » et « de devant Dieu » : cette tournure peut signifier « en présence de » ou indiquer la cause.'
    reason: lexical_alternative
  - marker: c
    text: Les verbes hébreux peuvent aussi se comprendre au futur (« tu les chasseras… les méchants périront ») ou comme l’expression d’un souhait.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Comme la fumée se disperse
  rationale: La préposition comparative כְּ et l’infinitif construit de נדף introduisent une comparaison. « Se disperse » rend naturellement le mouvement de la fumée chassée ou éparpillée.
- source_word: תִּנְדֹּף
  choice: tu les disperses
  rationale: Le qal inaccompli 2ms s’adresse directement à Dieu. Le complément pluriel, sous-entendu en hébreu, est explicité par « les » en référence aux ennemis évoqués dans le contexte et aux méchants du second parallèle.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: comme la cire fond
  rationale: La construction comparative est rendue par une proposition verbale française naturelle, sans perdre l’image.
- source_word: מִ/פְּנֵי אֵשׁ
  choice: devant le feu
  rationale: מִפְּנֵי signifie littéralement « de devant » et peut exprimer l’effet produit par une présence. « Devant le feu » conserve l’image poétique et l’écho avec « devant Dieu ».
- source_word: יֹאבְדוּ
  choice: périssent
  rationale: Le qal inaccompli de אבד peut signifier « périr », « disparaître » ou « être détruit ». « Périssent » préserve la force du terme sans préciser indûment le mode de disparition.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Le substantif désigne les personnes moralement mauvaises ou coupables ; « les méchants » est concis et usuel.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: Cette formulation conserve le parallélisme avec le feu et peut exprimer à la fois la présence de Dieu et l’effet de cette présence.
theological_decisions:
- issue: Valeur des verbes à l’inaccompli dans ce contexte poétique
  choice: 'Présent à valeur générale : « tu les disperses… périssent »'
  alternative: Futur (« tu les disperseras… périront ») ou souhait (« disperse-les… que les méchants périssent »)
  rationale: L’inaccompli hébreu peut ici être futur, habituel ou modal. Le présent restitue la comparaison de manière vive sans trancher excessivement entre prédiction et imprécation.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « disperser » maintient le lien lexical hébreu, tandis que « devant » préserve le parallélisme entre le feu et Dieu.
