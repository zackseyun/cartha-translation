  text: הַר אֱ֭לֹהִים הַר בָּשָׁ֑ן הַ֥ר גַּ֝בְנֻנִּ֗ים הַר בָּשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/015.yaml
  text: A mountain of God is the mountain of Bashan[b][a]; a mountain of peaks is the mountain of Bashan.
translation:
  language: fr
  text: La montagne de Dieu[a], c’est la montagne du Bashân ; la montagne aux sommets[b], c’est la montagne du Bashân.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une montagne imposante » ou « une montagne majestueuse » ; l’expression hébraïque « montagne de Dieu » peut servir de superlatif.
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu rare traduit par « aux sommets » peut aussi évoquer une montagne accidentée ou bosselée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר
  choice: montagne
  rationale: Sens courant du terme ; sa répétition est conservée afin de respecter la structure emphatique et poétique de l’hébreu.
- source_word: אֱלֹהִים
  choice: de Dieu
  rationale: La construction hébraïque se rend le plus directement ainsi. Elle peut aussi avoir une valeur superlative, signalée en note plutôt qu’intégrée au texte.
- source_word: בָּשָׁן
  choice: Bashân
  rationale: Nom géographique traditionnellement translittéré en français ; l’article est employé selon l’usage français pour désigner la région.
- source_word: גַּבְנֻנִּים
  choice: aux multiples sommets
  rationale: Ce terme rare, au pluriel, semble évoquer un relief présentant plusieurs cimes ou des bosses. La formulation retenue exprime naturellement cette topographie sans imposer l’image plus incertaine de bosses.
theological_decisions:
- issue: Valeur littérale ou superlative de הַר אֱלֹהִים
  choice: « montagne de Dieu » dans le texte principal
  alternative: « montagne imposante » ou « montagne majestueuse »
  rationale: La traduction littérale préserve la forme hébraïque et sa portée théologique et poétique, tandis que la possible valeur idiomatique de superlatif est conservée en note.
translation_notes:
  register: Français moderne, digne et poétique. La répétition de « montagne » et de « la montagne du Bashân » reproduit le parallélisme emphatique du texte hébreu. Les notes suivent l’ordre d’apparition de leurs marqueurs.
