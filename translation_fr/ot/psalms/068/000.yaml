lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne conventionnellement la personne chargée de diriger l’exécution musicale. « Chef de chœur » est une formulation française claire et actuelle, même si « maître de chant » ou « directeur de la musique » sont aussi possibles.
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition hébraïque לְ dans les titres de psaumes peut exprimer l’auteur, l’appartenance, la dédicace ou l’association. « De David » conserve mieux cette pluralité qu’une formulation explicitement attributive comme « composé par David ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est le terme français usuel pour ce genre de composition destinée à être chantée avec un accompagnement musical.
- source_word: שִׁיר
  choice: Chant
  rationale: La traduction distincte « Chant » maintient les deux désignations de genre juxtaposées dans l’hébreu, sans les fusionner.
