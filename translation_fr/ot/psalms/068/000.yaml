  text: Au chef de chœur. De David[a]. Psaume. Chant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition hébraïque peut indiquer que le psaume est de David, pour David, lui appartient ou lui est associé.
