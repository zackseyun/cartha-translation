source:
  edition: WLC
  text: אֶ֤רֶץ רָעָ֨שָׁה אַף שָׁמַ֣יִם נָטְפוּ֮ מִ/פְּנֵ֪י אֱלֹ֫הִ֥ים זֶ֥ה סִינַ֑י מִ/פְּנֵ֥י אֱ֝לֹהִ֗ים אֱלֹהֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/008.yaml
  text: The earth quaked; even the heavens dripped before God—this Sinai—before God, the God of Israel.
translation:
  language: fr
  text: La terre trembla ; même le ciel ruissela devant Dieu — ce Sinaï — devant Dieu, le Dieu d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָשָׁה
  choice: trembla
  rationale: Le verbe décrit ici l’ébranlement de la terre ; « trembla » est naturel, précis et dignifié.
- source_word: אַף
  choice: même
  rationale: 'Marque l’ajout emphatique : non seulement la terre, mais même le ciel.'
- source_word: שָׁמַיִם
  choice: le ciel
  rationale: Le singulier collectif français rend naturellement l’hébreu pluriel dans ce contexte cosmique.
- source_word: נָטְפוּ
  choice: ruissela
  rationale: Le verbe signifie littéralement « goutter, dégoutter » et peut évoquer une pluie abondante ; « ruissela » conserve l’image de l’eau venant du ciel sans l’aplatir en simple « pluie ».
- source_word: מִפְּנֵי
  choice: devant
  rationale: Rend la présence ou la face de Dieu comme cause de la réaction cosmique, tout en conservant la répétition hébraïque.
- source_word: זֶה סִינַי
  choice: ce Sinaï
  rationale: Traduction resserrée de la formulation difficile, qui préserve son caractère déictique et abrupt sans ajouter un verbe absent.
theological_decisions:
- issue: Interprétation de זֶה סִינַי
  choice: ce Sinaï
  alternative: le Sinaï lui-même / au Sinaï
  rationale: Le texte massorétique est syntaxiquement abrupt. « Ce Sinaï » maintient l’ambiguïté et l’emphase du texte au lieu de résoudre explicitement le groupe comme indication de lieu ou comme sujet développé.
- issue: Répétition de « devant Dieu »
  choice: conservée
  alternative: supprimer la seconde occurrence pour alléger le français
  rationale: La répétition structure le vers et aboutit à l’identification solennelle « le Dieu d’Israël » ; elle ne doit pas être lissée.
translation_notes:
  register: Français international moderne, poétique et accessible. La syntaxe volontairement abrupte autour de « ce Sinaï » reflète celle de l’hébreu. Aucun marqueur de note n’est requis.
