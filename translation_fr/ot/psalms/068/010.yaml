  text: חַיָּתְ/ךָ֥ יָֽשְׁבוּ בָ֑/הּ תָּ֤כִ֥ין בְּ/טוֹבָתְ/ךָ֖ לֶ/עָנִ֣י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/010.yaml
  text: Your creatures settled in it; in your goodness[a], O God, you provided for the poor.
translation:
  language: fr
  text: Tes créatures[a] s’y établirent ; dans ta bonté, tu as pourvu au pauvre, ô Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu חַיָּתְךָ est difficile ici. On peut aussi comprendre : « ton troupeau », « ta communauté » ou « ton assemblée ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: tes créatures
  rationale: Le nom désigne littéralement ce qui vit et peut avoir ici un sens collectif. « Tes créatures » reste proche du terme hébreu sans imposer l’interprétation plus précise de « troupeau » ou d’« assemblée » ; les autres possibilités sont signalées en note.
- source_word: יָשְׁבוּ בָהּ
  choice: s’y établirent
  rationale: Le verbe ישב peut signifier s’asseoir, habiter ou s’établir. Ici, il évoque l’installation dans le lieu mentionné dans le contexte précédent ; le pronom « y » reprend naturellement ce lieu en français.
- source_word: תָּכִין
  choice: tu as pourvu aux besoins
  rationale: Au hifil, כון signifie préparer, affermir ou rendre prêt. Avec le bénéficiaire introduit par ל, « pourvoir aux besoins » exprime naturellement en français l’idée d’une disposition préparée en faveur du pauvre, tout en évitant un complément d’objet artificiel.
- source_word: בְּטוֹבָתְךָ
  choice: dans ta bonté
  rationale: טובה peut désigner la bonté, le bienfait ou l’abondance. « Dans ta bonté » conserve la valeur de la préposition et présente la bienveillance divine comme le cadre ou la source de l’action.
- source_word: לֶעָנִי
  choice: aux besoins du pauvre
  rationale: עני peut désigner une personne pauvre, malheureuse, affligée ou démunie. Dans ce contexte de provision, « le pauvre » est le rendu le plus direct ; « aux besoins » complète idiomatiquement le verbe français « pourvoir ».
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom fonctionne comme une apostrophe en fin de vers. « Ô Dieu » restitue clairement cette adresse dans un registre poétique digne.
theological_decisions:
- issue: Interprétation de חַיָּתְךָ dans ce contexte poétique difficile
  choice: Référence générale et collective aux êtres appartenant à Dieu, rendue par « tes créatures »
  alternative: « Ton troupeau », « ta communauté » ou « ton assemblée »
  rationale: Le mot hébreu a d’abord le sens d’être vivant ou d’animal, mais il peut être compris collectivement ici. Le contexte permet d’y voir le peuple de Dieu installé dans le pays, sans exclure totalement une référence plus générale aux êtres vivants. Le texte principal conserve donc un terme large, et la note maintient les lectures collectives possibles sans résoudre abusivement l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et accessible. Le passé simple convient au récit poétique du psaume, tandis que l’apostrophe finale « ô Dieu » conserve la solennité sans archaïsme excessif.
