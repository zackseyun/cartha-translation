  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: fr
  text: 'Béni soit le Seigneur : jour après jour, il nous porte[a] ; Dieu est notre salut. Séla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « il porte pour nous ». Le verbe hébreu peut signifier « charger » ou « porter », mais son objet n’est pas explicitement indiqué. Ou : « il nous soutient ». Traditionnellement : « il nous comble de bienfaits ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif appartient ici à une formule de bénédiction et de louange ; « Béni soit » en conserve la force doxologique dans un français naturel et digne.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Ce titre divin se rend naturellement par « le Seigneur » en français.
- source_word: יוֹם יוֹם
  choice: jour après jour
  rationale: Cette expression distributive préserve la répétition hébraïque tout en étant idiomatique en français moderne.
- source_word: יַעֲמָס לָנוּ
  choice: il porte notre fardeau
  rationale: Le verbe évoque l’action de charger ou de porter, tandis que לָנוּ signifie « pour nous » et que l’objet porté reste implicite. « Il porte notre fardeau » exprime l’aide continuelle de Dieu sans introduire les « bienfaits » de l’interprétation traditionnelle.
- source_word: הָאֵל
  choice: Dieu
  rationale: אֵל est ici une désignation divine courante ; l’article hébreu n’exige pas une formulation française artificielle comme « le Dieu ».
- source_word: יְשׁוּעָתֵנוּ
  choice: notre salut
  rationale: Ce choix conserve toute l’étendue du terme, qui peut désigner le secours, la délivrance et le salut.
- source_word: סֶלָה
  choice: Séla
  rationale: La translittération est maintenue puisque le sens et la fonction exacts de ce terme restent incertains.
theological_decisions:
- issue: Interprétation de la proposition condensée יַעֲמָס לָנוּ
  choice: Dieu porte jour après jour le fardeau de son peuple.
  alternative: 'Dieu nous porte jour après jour ; ou : Dieu nous comble chaque jour de bienfaits.'
  rationale: Le verbe concerne fondamentalement le fait de charger ou de porter, mais son objet n’est pas exprimé. Le texte principal conserve l’image du soutien divin en parlant du fardeau, tandis que la note signale les autres analyses possibles sans résoudre abusivement l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et solennel. La ponctuation distingue la formule de louange de l’affirmation qui suit. « Séla » est conservé comme terme translittéré plutôt que traduit de manière conjecturale.
