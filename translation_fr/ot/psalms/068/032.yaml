    issue: « chantez pour Dieu »
    rationale: Bien que possible dans une paraphrase, « pour » rend moins directement le לְ hébreu, qui marque ici la personne à qui le chant est adressé. « à Dieu » conserve mieux cette relation.
  - severity: low
    issue: « célébrez le Seigneur par vos chants »
    rationale: La formulation est intelligible mais plus expansive et moins parallèle au premier impératif. « Chantez les louanges du Seigneur » est idiomatique et rend la louange musicale de זמר.
