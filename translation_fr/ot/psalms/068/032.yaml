  verdict: revise
  source_fidelity: 'La préposition לְ dans « שִׁירוּ לֵאלֹהִים » introduit l’allocutaire : « chantez à Dieu » est plus fidèle que « chantez pour Dieu ». Le second impératif, זַמְּרוּ, appelle à la louange chantée adressée à Adonaï ; « chantez les louanges du Seigneur » le rend clairement sans résoudre davantage la nuance musicale de זמר. « Royaumes de la terre », « le Seigneur » pour אֲדֹנָי et « Séla » sont appropriés.'
  naturalness: La révision est fluide en français international moderne et conserve le parallélisme poétique des deux impératifs sans la périphrase un peu lourde « célébrez … par vos chants ».
  terminology: « Dieu » rend אֱלֹהִים, tandis que « le Seigneur » rend le titre אֲדֹנָי, sans les confondre avec le tétragramme. « Séla » maintient prudemment le terme liturgique dont le sens précis est incertain.
  issues:
