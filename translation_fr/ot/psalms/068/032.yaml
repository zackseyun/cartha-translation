  text: מַמְלְכ֣וֹת הָ֭/אָרֶץ שִׁ֣ירוּ לֵ/אלֹהִ֑ים זַמְּר֖וּ אֲדֹנָ֣/י סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/032.yaml
  text: Kingdoms of the earth[a], sing to God; sing praises to the Lord—Selah
translation:
  language: fr
  text: Royaumes de la terre, chantez à Dieu ; chantez les louanges du Seigneur — Séla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: Royaumes de la terre
  rationale: L’expression désigne collectivement les royaumes de toute la terre et conserve la portée universelle de l’appel.
- source_word: שִׁירוּ לֵאלֹהִים
  choice: chantez pour Dieu
  rationale: L’impératif pluriel appelle les royaumes à chanter en l’honneur de Dieu ; « pour Dieu » rend naturellement ici la relation marquée par ל.
- source_word: זַמְּרוּ
  choice: célébrez … par vos chants
  rationale: Le piel de זמר désigne une louange musicale ; cette tournure française exprime à la fois le chant et sa fonction laudative.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin Adonaï, et non du tétragramme ; « le Seigneur » est donc la traduction appropriée.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens exact de ce terme liturgique ou musical demeure incertain ; sa translittération évite de le surinterpréter.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Adonaï
  rationale: Le texte porte un titre divin traduisible, non le nom יהוה. « le Seigneur » le distingue de la convention réservée au tétragramme.
translation_notes:
  register: Formulation poétique, actuelle et digne. Le parallélisme entre « chantez » et « célébrez … par vos chants » restitue les deux impératifs hébreux sans donner à entendre qu’ils ont exactement la même nuance.
