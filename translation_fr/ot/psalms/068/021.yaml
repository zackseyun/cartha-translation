source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: fr
  text: Oui, Dieu écrasera la tête de ses ennemis, le sommet chevelu de celui qui persiste dans ses fautes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions : « le crâne chevelu de celui qui marche dans sa culpabilité » ou « le sommet de la tête de celui qui persiste dans ses transgressions ».'
    reason: La formulation hébraïque permet de rendre קָדְקֹד par « sommet de la tête » ou « crâne », מִתְהַלֵּךְ par « marche » ou « persiste », et אֲשָׁמָיו par « culpabilité », « fautes » ou « transgressions ».
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule a ici une valeur affirmative et emphatique. « Oui » exprime naturellement cette assurance en français sans lui donner le sens restrictif de « seulement ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom régit ici un verbe au singulier et désigne le Dieu d’Israël.
- source_word: יִמְחַץ
  choice: écrasera
  rationale: Le verbe évoque une action violente qui broie ou fracasse. « Écrasera » conserve la vigueur concrète de l’image.
- source_word: רֹאשׁ אֹיְבָיו
  choice: la tête de ses ennemis
  rationale: La formulation littérale préserve l’image corporelle et rend le suffixe pronominal avec Dieu comme antécédent le plus naturel.
- source_word: קָדְקֹד שֵׂעָר
  choice: le sommet chevelu du crâne
  rationale: קָדְקֹד désigne le sommet de la tête ou du crâne, tandis que שֵׂעָר le caractérise comme couvert de cheveux. Cette expression française demeure vive et évite l’ambiguïté possible de « couronne ».
- source_word: מִתְהַלֵּךְ
  choice: celui qui persiste
  rationale: Le participe au hitpael évoque une conduite continue ou habituelle. Dans ce contexte moral, « persiste » transmet ce caractère durable plus naturellement que le calque « marche ».
- source_word: בַּאֲשָׁמָיו
  choice: dans ses fautes
  rationale: Le nom avec suffixe pluriel peut désigner des actes coupables ou des torts. « Ses fautes » respecte le pluriel massorétique et convient à la conduite habituelle décrite.
theological_decisions:
- issue: Référent du suffixe dans « ses ennemis »
  choice: Le suffixe renvoie à Dieu.
  alternative: Il pourrait être compris plus largement comme désignant les ennemis du roi divin ou du peuple de Dieu.
  rationale: Dieu est le sujet immédiatement exprimé du verbe singulier; il constitue donc l’antécédent grammatical le plus naturel, sans qu’il soit nécessaire d’introduire un référent messianique ou national plus précis.
- issue: Valeur de בַּאֲשָׁמָיו
  choice: 'Conduite coupable persistante : « persiste dans ses fautes ».'
  alternative: « marche dans sa culpabilité » ou « persiste dans ses transgressions »
  rationale: Le pluriel suffixé désigne vraisemblablement des fautes ou actes coupables, tandis que le participe présente cette conduite comme durable. La traduction conserve ce lien sans réduire le terme à un simple état abstrait.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme corporel et la violence de l’image judiciaire sont maintenus; le calque éthique « marcher dans » est explicité dans le texte principal et signalé en note.
