  source_fidelity: 'Le sens principal est bien rendu : אַךְ est affirmatif, Dieu est le sujet, ימחץ conserve l’image violente d’« écraser », et « ses ennemis » renvoie naturellement à Dieu. « Persiste dans ses fautes » rend de façon recevable le participe de conduite durable et le pluriel suffixé de בַּאֲשָׁמָיו. En revanche, « le sommet chevelu du crâne » surtraduite קָדְקֹד : le terme désigne déjà le sommet de la tête / le crâne et ne requiert pas l’ajout de « du crâne ».'
