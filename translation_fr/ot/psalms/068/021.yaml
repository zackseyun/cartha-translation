  terminology: « Dieu », « écrasera », « tête », « ennemis » et « fautes » conviennent au français biblique moderne sans imposer une lecture doctrinale. La note doit présenter « crâne chevelu » comme une alternative de traduction, non comme une équivalence avec l’expression redondante du texte principal. Le dossier anglais est lui-même incohérent entre « guilt » et « guilty deeds », mais le texte hébreu vocalisé porte ici un pluriel avec suffixe ; « ses fautes » est donc défendable et préférable à un singulier imposé.
