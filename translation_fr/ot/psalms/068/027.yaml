  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: fr
  text: Là se trouve Benjamin, le petit, qui les mène[a] ; les chefs de Juda avec leur foule[b] ; les chefs de Zabulon, les chefs de Nephtali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui les gouverne » ou « qui exerce sa domination sur eux ». Le participe hébreu peut évoquer le gouvernement ou la préséance ; dans ce contexte de procession, le texte le rend par « qui les mène ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leur compagnie », « leur multitude » ou « leur groupe ». Le mot hébreu est rare et son sens précis demeure incertain ; il désigne vraisemblablement un groupe rassemblé associé aux chefs de Juda.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Là se trouve
  rationale: L’adverbe déictique signifie « là ». L’ajout naturel de « se trouve » introduit en français la liste des groupes présents dans la procession.
- source_word: בִּנְיָמִן צָעִיר
  choice: Benjamin, le plus petit
  rationale: צָעִיר peut signifier « jeune », « petit » ou « le plus petit ». Dans cette évocation tribale, « le plus petit » exprime naturellement la petitesse ou le rang de Benjamin sans le réduire nécessairement à l’âge.
- source_word: רֹדֵם
  choice: qui les conduit
  rationale: Le participe avec suffixe pluriel peut évoquer l’exercice de l’autorité ou la préséance. Dans le cadre d’une procession, « qui les conduit » est naturel tout en gardant l’idée d’une position directrice.
- source_word: שָׂרֵי
  choice: les chefs
  rationale: שַׂר désigne des dirigeants, dignitaires ou princes. « Chefs » convient aux responsables tribaux et reste clair en français moderne.
- source_word: רִגְמָתָם
  choice: avec leur foule
  rationale: Ce terme rare et difficile semble désigner un groupe compact, une compagnie ou une multitude associée aux chefs de Juda. « Avec leur foule » rend ce sens sans prétendre lever l’incertitude.
- source_word: זְבֻלוּן / נַפְתָּלִי
  choice: Zabulon / Nephtali
  rationale: Formes françaises traditionnelles et immédiatement reconnaissables des noms tribaux.
theological_decisions:
- issue: Nature de l’action attribuée à Benjamin en רֹדֵם
  choice: qui les conduit
  alternative: qui règne sur eux / qui les domine
  rationale: Le contexte paraît être celui d’un cortège, mais le verbe peut également exprimer la domination ou le gouvernement. L’ambiguïté est donc signalée en note plutôt que résolue dogmatiquement.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme de l’énumération tribale est conservé par les points-virgules. Les deux difficultés lexicales principales sont maintenues dans le texte sous une forme lisible et documentées en notes.
