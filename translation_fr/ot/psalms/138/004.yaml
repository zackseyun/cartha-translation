  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: fr
  text: Tous les rois de la terre te rendront grâce, Yahvé, car ils ont entendu les paroles de ta bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: te rendront grâce
  rationale: Le hiphil de ידה exprime ici l’action de remercier ou de louer. « Te rendront grâce » garde l’orientation personnelle du suffixe et convient au contexte d’action de grâce.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que par un titre.
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: tous les rois de la terre
  rationale: Traduction directe de l’expression collective, qui conserve la mention précise des rois.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit naturellement la raison de l’action de grâce.
- source_word: שָׁמְעוּ
  choice: ils ont entendu
  rationale: L’accompli hébreu présente l’écoute comme un fait acquis qui motive la réponse annoncée.
- source_word: אִמְרֵי פִיךָ
  choice: les paroles de ta bouche
  rationale: Cette formulation conserve l’image concrète de l’hébreu tout en restant intelligible et digne en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahvé » en conserve le caractère de nom propre dans une forme française établie.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure causale et l’image hébraïque « les paroles de ta bouche » sont conservées.
