source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: fr
  text: 'Yahweh mènera à bien ce qui me concerne[a].


    Yahweh, ton amour fidèle dure pour toujours.


    N’abandonne pas les œuvres de tes mains[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh agira pour moi jusqu’au bout » ou « Yahweh achèvera ce qui est en ma faveur ».
    reason: alternative_reading
  - marker: b
    text: Ou « l’œuvre de tes mains » ; l’hébreu emploie le pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le caractère personnel du tétragramme.
- source_word: יִגְמֹר בַּעֲדִי
  choice: mènera à bien ce qui me concerne
  rationale: גמר exprime l’achèvement, tandis que בעדי peut signifier « pour moi », « en ma faveur » ou « à mon sujet ». Cette formulation française naturelle conserve l’idée que Yahweh conduira jusqu’à son terme ce qui concerne le psalmiste, sans introduire explicitement la notion absente de « dessein ».
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חסד désigne ici un amour loyal, constant et engagé. « Amour fidèle » exprime clairement ces dimensions en français actuel.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: La tournure verbale rend naturellement en français la permanence exprimée par לְעוֹלָם dans cette proposition nominale.
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: les œuvres de tes mains
  rationale: Le pluriel hébreu est conservé, de même que l’image concrète des mains, sans limiter le référent à la seule vie du psalmiste.
- source_word: אַל תֶּרֶף
  choice: N’abandonne pas
  rationale: רפה signifie littéralement relâcher, laisser tomber ou délaisser. Dans cette prière, « abandonner » communique naturellement l’appel à ne pas laisser inachevé ce que Dieu a fait.
theological_decisions:
- issue: Objet implicite de יִגְמֹר et portée de בַּעֲדִי
  choice: Yahweh mènera à bien ce qui me concerne
  alternative: Yahweh agira pour moi jusqu’au bout
  rationale: L’hébreu ne mentionne ni « dessein » ni objet explicite. La traduction retenue reste intelligible tout en préservant l’ouverture entre l’achèvement de ce qui concerne le psalmiste et l’action menée en sa faveur.
- issue: Référent de מַעֲשֵׂי יָדֶיךָ
  choice: les œuvres de tes mains
  alternative: l’œuvre de tes mains
  rationale: Le pluriel source laisse ouverte une portée large, qui peut inclure le psalmiste sans se limiter à lui. Le texte principal ne tranche donc pas entre l’œuvre de Dieu dans sa vie et l’ensemble plus vaste de ses œuvres.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme en trois lignes est conservé. « Mènera à bien » évite une formulation artificielle tout en maintenant l’idée d’achèvement ; l’impératif final garde la force de la supplication.
