  text: On the day I called[a], you answered me; you made me bold in my soul with strength.
translation:
  language: fr
  text: Le jour où j’ai appelé, tu m’as répondu ; tu m’as rendu hardi au plus profond de moi, avec force[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu de cette dernière proposition est difficile. On peut aussi comprendre : « tu as élargi mon être intérieur avec force » ou « tu m’as fortifié intérieurement ». Le verbe peut évoquer le fait de rendre hardi, d’élargir ou d’affermir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: Le jour où
  rationale: Conserve l’expression temporelle concrète de l’hébreu tout en donnant une tournure française naturelle.
- source_word: קָרָאתִי
  choice: je t’ai appelé
  rationale: Le verbe קרא désigne ici l’appel adressé à Dieu. Le complément « t’ » est implicite dans le contexte et nécessaire à une formulation française naturelle.
- source_word: וַתַּעֲנֵנִי
  choice: tu m’as répondu
  rationale: Rend directement le verbe ענה et son suffixe de première personne, en maintenant la réciprocité personnelle entre l’appel et la réponse.
- source_word: תַּרְהִבֵנִי
  choice: tu m’as rempli de courage
  rationale: Le hiphil de רהב est difficile dans ce contexte. Cette formulation exprime de façon idiomatique l’idée probable d’un affermissement intérieur ou d’un courage communiqué, sans la réduire à une simple force physique.
- source_word: בְנַפְשִׁי
  choice: au plus profond de moi
  rationale: נפש peut désigner l’être intérieur ou la personne elle-même. Cette tournure française actuelle transmet l’intériorité sans employer « âme » dans un sens technique ou artificiel.
- source_word: עֹז
  choice: de force
  rationale: Rend explicitement עֹז, « force, puissance », en coordination avec le courage afin de préserver les deux éléments de la clause hébraïque difficile.
theological_decisions:
- issue: Sens de תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  choice: 'Une communication intérieure de courage et de force : « tu m’as rempli de courage et de force au plus profond de moi »'
  alternative: « tu m’as rendu hardi dans mon âme, avec force » ; « tu as accru la force en moi » ; « tu m’as fortifié intérieurement »
  rationale: Le verbe רהב au hiphil est rare et son articulation avec « mon être intérieur » et « force » demeure incertaine. Le texte principal privilégie une expression française claire de l’affermissement intérieur, tandis que la note conserve les principales possibilités lexicales sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La première proposition reste proche de la structure temporelle hébraïque ; la dernière adopte une équivalence optimale pour éviter une formulation française obscure, tout en signalant l’ambiguïté dans la note.
