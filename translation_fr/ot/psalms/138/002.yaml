  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: fr
  text: Je me prosterne vers ton saint temple et je rends grâce à ton nom pour ton amour fidèle et ta fidélité, car tu as élevé ta parole au-dessus de tout ton nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car tu as élevé ta promesse au-dessus de toute chose ». L’hébreu de la dernière proposition est difficile ; certains comprennent : « car tu as élevé ton nom et ta parole au-dessus de toute chose ».'
    reason: Lecture alternative d’une construction hébraïque syntaxiquement difficile.
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: Je me prosterne
  rationale: Le verbe désigne ici l’acte concret de s’incliner ou de se prosterner dans l’adoration. « Je me prosterne » en conserve la dimension corporelle.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: en direction de ton temple saint
  rationale: אֶל exprime l’orientation vers le sanctuaire sans impliquer que le psalmiste y entre. הֵיכָל désigne naturellement le temple dans ce contexte cultuel.
- source_word: וְאוֹדֶה אֶת שְׁמֶךָ
  choice: et je célèbre ton nom
  rationale: Le hiphil de ידה peut exprimer la reconnaissance ou la louange. « Célébrer ton nom » est naturel en français et conserve l’idée d’une proclamation reconnaissante adressée à Dieu.
- source_word: עַל חַסְדְּךָ
  choice: pour ton amour fidèle
  rationale: חסד évoque un amour loyal, constant et engagé. « Amour fidèle » rend cette richesse sans recourir à une formulation archaïque ou à une explicitation confessionnelle.
- source_word: וְעַל אֲמִתֶּךָ
  choice: et ta fidélité
  rationale: אמת peut signifier vérité, solidité ou fidélité. En parallèle avec חסד, « fidélité » souligne ici la fiabilité de Dieu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la célébration et se rend naturellement par « car ».
- source_word: הִגְדַּלְתָּ
  choice: tu as élevé
  rationale: Le hiphil de גדל signifie rendre grand, magnifier ou exalter. « Élever » exprime ici la mise à l’honneur tout en restant clair en français courant.
- source_word: עַל כָּל שִׁמְךָ
  choice: au-dessus de tout ton nom
  rationale: La construction hébraïque est difficile. Cette formulation suit de près l’ordre et les rapports apparents du texte massorétique, sans résoudre silencieusement sa tension.
- source_word: אִמְרָתֶךָ
  choice: ta parole
  rationale: אִמְרָה peut désigner une parole, une déclaration ou une promesse. « Parole » préserve l’étendue du terme, tandis que le contexte permet d’y entendre aussi une portée promissoire.
theological_decisions:
- issue: Interprétation de la proposition difficile כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  choice: car tu as élevé ta parole au-dessus de tout ton nom
  alternative: 'car tu as élevé ta promesse au-dessus de toute chose ; ou : car tu as élevé ton nom et ta parole au-dessus de toute chose'
  rationale: La syntaxe massorétique est difficile et permet plusieurs compréhensions. Le texte principal reste proche de sa séquence plutôt que d’introduire une harmonisation interprétative. Les principales lectures plus fluides sont signalées en note, sans suggérer que la parole de Dieu s’opposerait à son nom.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image corporelle de la prosternation, le langage biblique du « nom » et la difficulté réelle de la proposition finale. Le marqueur [a] figure dans le texte principal.
