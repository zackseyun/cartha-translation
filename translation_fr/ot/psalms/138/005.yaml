  variant: modern international French
source:
  edition: WLC
  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: fr
  text: Ils chanteront les voies de Yahweh[a], car grande est la gloire de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « dans les voies de Yahweh » ; l’expression signifie probablement qu’ils chanteront au sujet des voies de Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: Ils chanteront
  rationale: Le qal inaccompli à la 3e personne du pluriel exprime naturellement ici l’action future des rois mentionnés au verset précédent. Une tournure exhortative comme « qu’ils chantent » imposerait une nuance jussive que la forme n’exige pas.
- source_word: בְּדַרְכֵי
  choice: les voies
  rationale: Après « chanter », la préposition ב peut indiquer le thème du chant. En français, « chanter les voies de Yahweh » est naturel, poétique et proche de l’hébreu, tandis que « chanter dans les voies » risquerait d’être compris comme une localisation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre de substitution.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit vraisemblablement la raison du chant. « Car » conserve la concision et le registre poétique.
- source_word: גָדוֹל
  choice: grande
  rationale: L’adjectif signifie directement « grand » et s’accorde ici avec « gloire ».
- source_word: כְּבוֹד
  choice: gloire
  rationale: « Gloire » est l’équivalent français habituel de כבוד lorsqu’il s’agit de Dieu et conserve sa portée théologique et poétique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme; « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Rapport exprimé par בְּדַרְכֵי après « chanter »
  choice: les voies, comprises comme le thème du chant
  alternative: dans les voies
  rationale: L’hébreu permet de conserver l’idée de « dans les voies », mais le contexte favorise probablement un chant ayant pour sujet les voies de Yahweh. La note maintient visible cette ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion « grande est la gloire » conserve l’accent de l’ordre hébreu sans devenir obscure. Le futur relie naturellement ce verset aux rois du verset précédent.
