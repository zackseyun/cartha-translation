id: PSA.138.1
reference: Psalms 138:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: fr
  text: De David. Je te rendrai grâce de tout mon cœur ; devant les dieux[a], je chanterai tes louanges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant les êtres célestes » ou « devant les anges ». Selon le contexte, le mot hébreu peut désigner des dieux, Dieu ou des êtres célestes.
    reason: Lecture alternative rendue nécessaire par l’étendue sémantique de אֱלֹהִים.
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance ou la dédicace. « De David » conserve cette ambiguïté tout en suivant l’usage courant des titres de psaumes.
- source_word: אוֹדְךָ
  choice: Je te rendrai grâce
  rationale: À la forme hiphil, ידה peut signifier remercier, louer ou célébrer. Ici, « rendre grâce » exprime naturellement l’action de grâce adressée directement à Dieu.
- source_word: בְכָל לִבִּי
  choice: de tout mon cœur
  rationale: Cette tournure française naturelle restitue littéralement l’idée d’un engagement intérieur entier et sans partage.
- source_word: נֶגֶד
  choice: devant
  rationale: נֶגֶד indique la position ou l’action en présence de quelqu’un. « Devant » est concis et convient au registre poétique.
- source_word: אֱלֹהִים
  choice: les dieux
  rationale: La forme peut désigner Dieu, des dieux ou des êtres célestes selon le contexte. Ici, la lecture plurielle « les dieux » est la plus directe et conserve la force ainsi que l’ambiguïté théologique du texte hébreu.
- source_word: אֲזַמְּרֶךָ
  choice: je chanterai tes louanges
  rationale: Au piel, זמר désigne le fait de chanter ou de faire de la musique en louange. Cette formulation rend à la fois la dimension musicale et l’adresse à Dieu.
theological_decisions:
- issue: Référent de אֱלֹהִים dans נֶגֶד אֱלֹהִים
  choice: les dieux
  alternative: les êtres célestes ; les anges ; Dieu
  rationale: La forme hébraïque permet plusieurs référents. Le pluriel direct est maintenu dans le texte principal afin de ne pas résoudre prématurément la tension théologique ; les autres compréhensions possibles sont signalées en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme poétique et emploie le futur pour les deux verbes hébreux correspondants.
