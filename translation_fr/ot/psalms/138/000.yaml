  text: לְ/דָוִ֨ד אוֹדְ/ךָ֥ בְ/כָל לִבִּ֑/י נֶ֖גֶד אֱלֹהִ֣ים אֲזַמְּרֶֽ/ךָּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/000.yaml
  text: Of David[a]. I will give thanks to you with all my heart; before the gods I will sing praises to you.
translation:
  language: fr
  text: De David. Je te célébrerai de tout mon cœur ; devant les dieux[a], je chanterai tes louanges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les êtres célestes » ou « les anges ». Selon le contexte, le mot hébreu peut désigner Dieu, des dieux ou des êtres célestes.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: Le לְ du titre peut signaler l’auteur, l’appartenance, la dédicace ou le rapport à David. La formulation française traditionnelle et concise « De David » préserve cette latitude.
- source_word: אוֹדְךָ
  choice: Je te célébrerai
  rationale: Le verbe ידה au hifil exprime ici la louange ou la reconnaissance adressée à Dieu. « Célébrer » convient naturellement avec le complément « de tout mon cœur » et évite de réduire le sens à un simple remerciement.
- source_word: בְכָל־לִבִּי
  choice: de tout mon cœur
  rationale: Expression française naturelle qui rend l’idée hébraïque d’un engagement intérieur total.
- source_word: נֶגֶד אֱלֹהִים
  choice: devant les dieux
  rationale: נֶגֶד signifie « devant, en présence de ». אֱלֹהִים est formellement ambigu et peut désigner ici des dieux ou des êtres célestes ; le texte principal retient le sens lexical direct sans effacer les autres possibilités, signalées en note.
- source_word: אֲזַמְּרֶךָּ
  choice: je chanterai tes louanges
  rationale: Le verbe זמר désigne le chant de louange, éventuellement accompagné de musique. Cette tournure est claire, idiomatique et conserve l’adresse directe à Dieu.
theological_decisions:
- issue: Identité des אֱלֹהִים devant lesquels le psalmiste chante
  choice: les dieux
  alternative: les êtres célestes / les anges
  rationale: Le contexte immédiat ne tranche pas explicitement l’identité de ces figures. « Les dieux » conserve la tension du texte hébreu, tandis qu’une note présente les principales compréhensions possibles sans imposer une lecture confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par deux propositions séparées d’un point-virgule. Le titre reste sobre, et l’ambiguïté théologique de אֱלֹהִים est maintenue dans le texte et explicitée en note.
