  text: כִּי רָ֣ם יְ֭הוָה וְ/שָׁפָ֣ל יִרְאֶ֑ה וְ֝/גָבֹ֗הַּ מִ/מֶּרְחָ֥ק יְיֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: fr
  text: Car Yahvé est élevé, mais il voit les humbles ; mais l’orgueilleux, il le connaît de loin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il le reconnaît de loin ». L’hébreu dit littéralement « il le connaît de loin », expression qui peut suggérer une distance relationnelle sans l’affirmer plus explicitement.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de la louange exprimée dans le contexte précédent, avec une valeur explicative naturelle en français.
- source_word: רָם
  choice: est élevé
  rationale: Conserve l’image verticale qui exprime ici la grandeur transcendante de Yahvé, sans confondre ce terme avec גָבֹהַּ, appliqué ensuite à l’orgueilleux.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui conserve le caractère personnel du tétragramme plutôt que de le remplacer par un titre.
- source_word: שָׁפָל
  choice: les humbles
  rationale: Désigne ceux qui sont abaissés, modestes ou de condition humble. Le pluriel générique est idiomatique en français tout en gardant la portée sociale et morale du terme.
- source_word: יִרְאֶה
  choice: il voit
  rationale: Rend directement le verbe « voir » et laisse au contexte sa nuance d’attention bienveillante sans l’expliciter excessivement.
- source_word: גָבֹהַּ
  choice: l’orgueilleux
  rationale: Littéralement « le haut », mais le contraste avec l’humble lui donne ici une valeur morale négative que « l’orgueilleux » exprime clairement.
- source_word: מִמֶּרְחָק
  choice: de loin
  rationale: Expression spatiale concise qui préserve l’image de distance et sa possible portée relationnelle.
- source_word: יְיֵדָע
  choice: il le connaît
  rationale: Conserve le sens lexical fondamental de « connaître » sans préciser si cette connaissance signifie reconnaissance, surveillance ou distance relationnelle.
theological_decisions:
- issue: Nuance relationnelle de la connaissance que Dieu a de l’orgueilleux
  choice: « il le connaît de loin »
  alternative: « il le reconnaît de loin » ou « il le tient à distance »
  rationale: L’hébreu associe explicitement « connaître » et « de loin ». Il peut suggérer une absence d’intimité ou une distance judiciaire, mais il ne dit pas directement que Dieu rejette l’orgueilleux ou le tient éloigné.
- issue: Relation concessive entre l’élévation de Yahvé et son regard sur les humbles
  choice: « mais il voit les humbles »
  alternative: « et il voit les humbles »
  rationale: 'La conjonction hébraïque est formellement « et », mais le contraste implicite est concessif : bien qu’élevé, Yahvé prête attention aux humbles. « Mais » rend cette relation naturellement sans modifier l’affirmation théologique.'
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre Yahvé « élevé », les « humbles » et « l’orgueilleux » est maintenu, ainsi que l’ambiguïté de la formule finale.
