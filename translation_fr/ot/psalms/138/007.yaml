  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: fr
  text: Si je marche au milieu de la détresse[a], tu me gardes en vie[b] ; contre la colère de mes ennemis[c], tu étends ta main, et ta main droite me sauve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Même si je marche au milieu de la détresse ». Selon le contexte, le mot hébreu אִם peut introduire une proposition conditionnelle ou concessive.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu me ranimes » ou « tu préserves ma vie ». Le verbe hébreu peut exprimer le fait de rendre la vie ou de maintenir en vie.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « contre la colère de mes ennemis ». Le mot hébreu אַף, qui signifie proprement « nez », est employé comme une image de la colère ou de la fureur.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: La particule introduit ici une proposition qui peut être comprise comme conditionnelle ou concessive. « Si » en conserve la valeur la plus directe sans effacer l’autre possibilité.
- source_word: אֵלֵךְ
  choice: je marche
  rationale: Le verbe הלך désigne le fait d’aller ou de marcher. « Je marche » maintient l’image concrète et poétique de l’hébreu.
- source_word: בְּקֶרֶב צָרָה
  choice: au milieu de la détresse
  rationale: קֶרֶב exprime l’idée d’être au cœur ou au milieu de quelque chose, tandis que צָרָה désigne la détresse, l’adversité ou l’épreuve.
- source_word: תְּחַיֵּנִי
  choice: tu me gardes en vie
  rationale: La forme intensive de חיה peut signifier faire vivre, ranimer ou préserver en vie. Dans ce contexte de danger, « tu me gardes en vie » est naturel et conserve l’idée de préservation.
- source_word: עַל אַף אֹיְבַי
  choice: contre la colère de mes ennemis
  rationale: אַף signifie littéralement « nez », mais désigne idiomatiquement la colère. La traduction conserve cette colère comme objet de l’intervention divine au lieu de réduire l’expression à « contre mes ennemis ».
- source_word: תִּשְׁלַח יָדֶךָ
  choice: tu étends la main
  rationale: L’expression évoque une intervention active. « Étendre la main » restitue naturellement en français l’image anthropomorphique de l’hébreu.
- source_word: וְתוֹשִׁיעֵנִי
  choice: me sauve
  rationale: Le verbe ישע à cette forme signifie sauver ou délivrer. « Sauve » est le terme français le plus large et le plus direct.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: La traduction littérale préserve l’image biblique de la force et de la puissance salvatrice associées à la main droite.
theological_decisions:
- issue: Nuance de l’action divine exprimée par תְּחַיֵּנִי
  choice: Préservation de la vie au cœur d’un danger présent
  alternative: Ranimation ou restauration
  rationale: La détresse et les ennemis forment le cadre immédiat du verset. La formulation retenue exprime donc la préservation de la vie sans imposer une interprétation exclusivement spirituelle, tout en signalant en note l’autre nuance possible.
- issue: Portée de עַל אַף אֹיְבַי
  choice: Dieu intervient contre la colère des ennemis
  alternative: Dieu intervient contre les ennemis eux-mêmes
  rationale: Puisque אַף désigne idiomatiquement la colère, la traduction maintient la fureur hostile comme objet explicite de l’intervention divine et préserve ainsi la tension poétique du texte.
translation_notes:
  register: 'Français international moderne, clair et digne. Le rythme poétique et les images corporelles de l’hébreu (« marcher », « étendre la main », « main droite ») sont conservés. La ponctuation distingue les trois mouvements du verset : détresse, intervention et salut.'
