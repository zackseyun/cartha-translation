    rationale: Le mot désigne plus précisément un buisson épineux/broussaille épineuse. Le singulier concret facilite aussi la cohérence syntaxique de la phrase.
  - severity: low
    issue: Note littérale insuffisamment exacte sur le dernier pronom
    rationale: La note doit indiquer que le verbe final porte un objet singulier d’antécédent incertain; le texte principal choisit interprétativement le pluriel des marmites.
