  source_fidelity: La traduction rend bien l’antériorité et l’image probable d’un combustible épineux qui n’a pas encore chauffé les récipients. Toutefois, dans le texte actuel, « qu’elles soient vertes ou embrasées » se rattache grammaticalement aux « marmites », alors que les qualificatifs se rapportent vraisemblablement au buisson/combustible. La référence du pronom final hébreu demeure incertaine; le pluriel français interprétatif (« les » = les marmites) peut être conservé, à condition que la note le signale.
  naturalness: « Sentent la chaleur » est naturel dans cette personnification poétique, mais « épines » est moins précis et produit un accord ambigu. « Le buisson épineux, qu’il soit encore vert ou déjà embrasé » est clair, idiomatique et conserve l’image concrète. L’emploi de « ne » après « avant que » convient au registre soutenu et moderne de la poésie biblique.
  terminology: « Marmites » convient à סִירוֹת. « Buisson épineux » rend plus exactement אָטָד que « épines ». « Embrasé » est une option contextuellement défendable pour חָרוֹן, dont le possible sens de « colère/ardeur » doit rester documenté en note plutôt que résolu dogmatiquement. « Emporter dans un tourbillon » reflète de façon évocatrice le verbe de balayage violent.
