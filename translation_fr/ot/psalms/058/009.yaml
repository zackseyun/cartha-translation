source:
  edition: WLC
  text: בְּ/טֶ֤רֶם יָבִ֣ינוּ סִּֽירֹתֵי/כֶ֣ם אָטָ֑ד כְּמוֹ חַ֥י כְּמוֹ חָ֝ר֗וֹן יִשְׂעָרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: fr
  text: Avant que vos marmites ne sentent la chaleur du buisson épineux[a], qu’il soit encore vert ou déjà embrasé, il les emportera dans un tourbillon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est difficile. Plus littéralement : « Avant que vos marmites perçoivent le buisson épineux, comme vivant, comme ardeur brûlante, il l’emportera dans un tourbillon. » L’image évoque probablement une disparition soudaine avant même que le feu ne puisse chauffer les marmites. Le pronom final est au singulier et son antécédent est incertain; le texte le rapporte ici aux marmites. Certains comprennent la dernière expression comme « il l’emportera dans sa colère ».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Avant que
  rationale: Marque clairement l’antériorité et conserve la soudaineté de l’image.
- source_word: יָבִינוּ
  choice: sentent la chaleur
  rationale: Le verbe signifie normalement « comprendre, percevoir » ; avec des marmites pour sujet, il évoque vraisemblablement le fait de commencer à ressentir la chaleur. L’ajout de « la chaleur » explicite sobrement l’image.
- source_word: סִּירֹתֵיכֶם
  choice: vos marmites
  rationale: Désigne des récipients de cuisson ; « marmites » est concret, courant et naturel en français.
- source_word: אָטָד
  choice: des épines
  rationale: Le terme désigne un buisson épineux ou des broussailles épineuses servant de combustible. « Épines » s’intègre naturellement à l’image du feu tout en laissant la difficulté du texte à la note.
- source_word: כְּמוֹ חַי
  choice: qu’elles soient vertes
  rationale: Dans le contexte du combustible, « vivant » peut signifier frais ou encore vert.
- source_word: כְּמוֹ חָרוֹן
  choice: ou embrasées
  rationale: חָרוֹן signifie souvent « ardente colère », mais peut ici prolonger l’image thermique. « Embrasées » préserve le contraste avec les épines vertes sans imposer la lecture de la colère.
- source_word: יִשְׂעָרֶנּוּ
  choice: il les emportera dans un tourbillon
  rationale: Le verbe évoque une action violente de tempête ou de tourbillon. Le pronom hébreu est singulier et sa référence incertaine ; le pluriel français reprend les marmites selon le sens probable de l’image.
theological_decisions:
- issue: Sens de l’image poétique et de חָרוֹן dans ce verset très difficile
  choice: Un jugement soudain emporte les marmites avant que le feu d’épines puisse les chauffer, que le combustible soit encore vert ou déjà embrasé.
  alternative: Comprendre חָרוֹן comme « colère » et traduire la fin par « il l’emportera dans sa colère » ; ou conserver plus littéralement les pronoms singuliers et l’expression « comme vivant, comme colère ardente ».
  rationale: Le texte hébreu est syntaxiquement obscur. La formulation principale rend l’image probable d’une disparition soudaine avant l’aboutissement d’un projet, sans transformer explicitement חָרוֹן en colère divine. La note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, naturel et digne. L’image concrète est conservée, tandis que la syntaxe obscure, les pronoms incertains et le double sens possible de חָרוֹן sont signalés en note.
