id: PSA.58.10
reference: Psalms 58:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: fr
  text: Le juste se réjouira quand il verra la vengeance[a] ; il lavera ses pieds dans le sang du méchant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parce qu’il aura vu la vengeance ». La conjonction hébraïque peut avoir un sens causal (« parce que », « car ») aussi bien que temporel (« quand »).
    reason: lexical_alternative
  - marker: b
    text: L’image de pieds lavés dans le sang du méchant exprime poétiquement le caractère total du jugement ; elle ne constitue pas un ordre de commettre personnellement des violences.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: se réjouira
  rationale: L’imparfait qal à la 3e personne du masculin singulier a ici une valeur future dans ce contexte poétique.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé singulier désigne de manière représentative la personne juste ; « le juste » est naturel et formellement proche de l’hébreu.
- source_word: כִּי
  choice: quand
  rationale: La conjonction introduit ici naturellement la circonstance dans laquelle le juste se réjouit, tout en pouvant aussi recevoir une nuance causale, signalée en note.
- source_word: חָזָה
  choice: il verra
  rationale: Le parfait à la 3e personne du masculin singulier est intégré à une proposition future introduite par « quand » ; le futur français rend clairement cette perspective.
- source_word: נָקָם
  choice: la vengeance
  rationale: Le nom désigne la vengeance ou la rétribution. Ce choix direct conserve la dureté du texte sans l’atténuer en simple « réhabilitation ».
- source_word: פְּעָמָיו
  choice: ses pieds
  rationale: Dans l’image du lavage dans le sang, le terme pluriel muni du suffixe se comprend concrètement comme les pieds, plutôt que comme les pas.
- source_word: יִרְחַץ
  choice: il lavera
  rationale: L’imparfait qal exprime une action future et maintient l’image poétique dans toute sa force.
- source_word: בְּדַם
  choice: dans le sang
  rationale: La préposition est rendue dans son sens locatif, ce qui préserve directement l’image saisissante de l’hébreu.
- source_word: הָרָשָׁע
  choice: du méchant
  rationale: L’adjectif substantivé singulier est conservé comme figure représentative ; « du méchant » est idiomatique en français biblique moderne.
theological_decisions:
- issue: Le verset décrit-il une vindicte personnelle ou la joie devant un jugement juste ?
  choice: Conserver la joie du juste à la vue de la vengeance sans préciser dans le texte principal qu’elle serait personnelle ou divine.
  alternative: Traduire explicitement par « vengeance divine », « juste jugement » ou « réhabilitation ».
  rationale: L’hébreu parle simplement de vengeance et emploie l’image violente des pieds lavés dans le sang du méchant. Ajouter « divine » ou adoucir en « réhabilitation » résoudrait une tension théologique que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme, le futur et l’image violente de l’original sont conservés sans archaïsme ni atténuation interprétative.
