source:
  edition: WLC
  text: הַֽ/אֻמְנָ֗ם אֵ֣לֶם צֶ֭דֶק תְּדַבֵּר֑וּ/ן מֵישָׁרִ֥ים תִּ֝שְׁפְּט֗וּ בְּנֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/001.yaml
  text: Do you indeed speak righteousness in silence? Do you judge uprightly[c][b][a], sons of man?
translation:
  language: fr
  text: Est-ce vraiment en silence[a] que vous dites ce qui est juste ? Jugez-vous avec équité, fils des hommes[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu אֵלֶם est difficile. Le texte massorétique le vocalise comme un mot signifiant « silence » ou « mutisme ». D’autres analyses, avec une autre vocalisation ou une modification du texte, y voient une adresse : « ô puissants », voire « ô dieux »; on obtient alors : « Est-ce vraiment la justice que vous dites, ô puissants ? »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement, « fils de l’homme » ou « fils d’Adam ». On peut aussi comprendre : « êtres humains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: Est-ce vraiment
  rationale: La particule interrogative renforcée introduit une question rhétorique insistante. « Est-ce vraiment » en conserve naturellement l’emphase et la portée ironique.
- source_word: אֵלֶם
  choice: en silence
  rationale: La vocalisation massorétique renvoie au silence ou au mutisme. La formulation française maintient l’étrangeté mordante de l’hébreu sans résoudre la difficulté textuelle.
- source_word: צֶדֶק
  choice: ce qui est juste
  rationale: Dans le contexte du verbe « dire », cette expression française naturelle conserve la valeur morale et judiciaire de צֶדֶק.
- source_word: תְּדַבֵּרוּן
  choice: vous dites
  rationale: Rend simplement le verbe דבר tout en laissant subsister le paradoxe de parler « en silence ».
- source_word: מֵישָׁרִים
  choice: avec équité
  rationale: Employé adverbialement avec « juger », le terme évoque la rectitude et l’impartialité du jugement. « Avec équité » est idiomatique en français judiciaire.
- source_word: תִּשְׁפְּטוּ
  choice: Jugez-vous
  rationale: Le contexte est judiciaire; « juger » conserve directement cette force.
- source_word: בְּנֵי אָדָם
  choice: fils des hommes
  rationale: Cette traduction proche de la forme hébraïque conserve l’adresse masculine et souligne la condition humaine des juges interpellés. Une formulation plus générale est signalée en note.
theological_decisions:
- issue: Interprétation du terme difficile אֵלֶם
  choice: Suivre dans le texte la vocalisation massorétique au sens de « silence »
  alternative: Comprendre le terme comme une adresse aux « puissants », voire aux « dieux »
  rationale: Le texte massorétique favorise le champ lexical du silence ou du mutisme, mais une autre vocalisation ou une correction proposée produit une adresse aux puissants. Comme cette divergence modifie sensiblement l’identité des destinataires et la portée du reproche, l’autre lecture est conservée en note.
translation_notes:
  register: Français international actuel, sobre et poétique. Les deux questions rhétoriques et leur parallélisme sont conservés. L’expression inhabituelle « en silence » demeure volontairement étrange, conformément au texte massorétique, tandis que la principale autre lecture est explicitée en note.
