  text: אֲשֶׁ֣ר לֹא יִ֭שְׁמַע לְ/ק֣וֹל מְלַחֲשִׁ֑ים חוֹבֵ֖ר חֲבָרִ֣ים מְחֻכָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/005.yaml
  text: that does not listen to the voice of charmers[b][a], of one who skillfully casts spells.
translation:
  language: fr
  text: qui n’écoute pas la voix des charmeurs[a], celle d’un expert en incantations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le son de ceux qui murmurent des incantations ». Le terme hébreu traduit par « charmeurs » est lié au murmure ou à l’incantation.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « un lieur de charmes, habile ». L’expression hébraïque désigne un enchanteur ou un charmeur expert.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif poursuit la description du cobra sourd au verset précédent; « qui » convient naturellement en français.
- source_word: לֹא יִשְׁמַע
  choice: n’écoute pas
  rationale: L’imparfait hébreu décrit ici une absence habituelle de réaction. « N’écoute pas » exprime mieux que « n’entend pas » le fait de ne pas prêter attention aux charmeurs.
- source_word: לְקוֹל
  choice: la voix
  rationale: קוֹל peut désigner la voix ou le son. « La voix » convient aux personnes qui prononcent les incantations, tandis que l’autre possibilité est signalée en note.
- source_word: מְלַחֲשִׁים
  choice: charmeurs
  rationale: Le mot dérive d’une racine liée au murmure et à l’incantation. Dans l’image du serpent, « charmeurs » transmet clairement la fonction de ces praticiens sans préciser excessivement leur technique.
- source_word: חוֹבֵר חֲבָרִים
  choice: à jeter des sorts
  rationale: L’expression, littéralement proche de « liant des charmes », est idiomatique et désigne la pratique d’incantations ou de formules magiques.
- source_word: מְחֻכָּם
  choice: du plus habile
  rationale: Le participe qualifie l’expertise du praticien. Le superlatif français rend naturellement l’idée contextuelle que le serpent ne réagit pas même à un enchanteur expert, sans donner à la sagesse une valeur morale.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation conserve le parallélisme poétique et rend explicite l’expertise évoquée par מְחֻכָּם, tout en documentant dans les notes les images littérales et l’ambiguïté lexicale.
