review_pass:
  verdict: revise
  source_fidelity: « Se détournent » suggère plus précisément le fait de se détourner d’une voie ou d’une personne, alors que זֹרוּ exprime ici l’état d’éloignement/aliénation, en parallèle avec l’égarement. « Sont éloignés » restitue cette valeur sans introduire un complément absent de l’hébreu. Les deux expressions temporelles et l’hyperbole poétique sont conservées.
  naturalness: La formulation révisée reste poétique mais naturelle en français international moderne. « Dès le ventre maternel » préserve la seconde image hébraïque sans l’ajout interprétatif « de leur mère ». « Eux qui disent des mensonges » est plus direct et courant que « profèrent des mensonges », tout en gardant la valeur caractérisante du participe.
  terminology: « Les méchants » rend correctement רְשָׁעִים. « Sein maternel » rend רֶחֶם et « ventre maternel » בֶּטֶן; leur rapprochement conserve le parallélisme. « S’égarent » rend תָּעוּ, et « disent des mensonges » rend δֹבְרֵי כָזָב sans durcir le sens en une affirmation doctrinale.
  issues:
  - severity: medium
    issue: « se détournent » pour זֹרוּ
    rationale: Le français évoque normalement un détournement volontaire d’un objet, d’une personne ou d’une voie. Le verbe hébreu met plutôt l’accent sur l’éloignement ou l’aliénation; « sont éloignés » est plus fidèle et préserve l’absence de complément.
  - severity: low
    issue: « ventre de leur mère »
    rationale: Le possessif « leur mère » n’est pas exprimé dans le texte source et alourdit inutilement le parallélisme. « Ventre maternel » garde l’image et la concision poétiques.
  revised_text: Les méchants sont éloignés dès le sein maternel ; dès le ventre maternel, ils s’égarent, eux qui disent des mensonges.
  revised_footnotes:
