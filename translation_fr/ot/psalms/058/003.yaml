    text: L’hébreu dit littéralement « dès le sein maternel » puis « dès le ventre maternel » ; cette formulation poétique présente les méchants comme égarés depuis le tout début de la vie.
    reason: Précision lexicale et mise en évidence de l’hyperbole poétique.
