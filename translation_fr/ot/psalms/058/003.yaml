  text: זֹ֣רוּ רְשָׁעִ֣ים מֵ/רָ֑חֶם תָּע֥וּ מִ֝/בֶּ֗טֶן דֹּבְרֵ֥י כָזָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/003.yaml
  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: fr
  text: Les méchants sont éloignés dès le sein maternel ; dès le ventre maternel, ils s’égarent, eux qui disent des mensonges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹרוּ
  choice: se détournent
  rationale: Le qal de זור exprime ici l’éloignement ou la séparation. « Se détournent » est naturel en français, conserve la dimension active ou résultative du verbe et répond bien à « s’égarent » sans réduire le terme à la seule corruption morale.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Désignation collective courante et claire de ceux qui agissent mal ; l’article français est requis par l’usage.
- source_word: מֵרָחֶם
  choice: dès le sein maternel
  rationale: « Dès » rend la valeur temporelle de מִן dans ce contexte, tandis que « sein maternel » traduit naturellement רֶחֶם et préserve l’image poétique.
- source_word: תָּעוּ
  choice: ils s’égarent
  rationale: Le verbe תעה signifie errer ou s’écarter du chemin. Le présent français convient à la caractérisation générale exprimée par le parfait hébreu dans ce cadre poétique.
- source_word: מִבֶּטֶן
  choice: dès le ventre de leur mère
  rationale: Cette formulation conserve plus directement la seconde image corporelle du texte hébreu et son parallélisme avec « sein maternel », plutôt que de la paraphraser par « dès la naissance ».
- source_word: דֹּבְרֵי כָזָב
  choice: eux qui profèrent des mensonges
  rationale: La tournure reprend la valeur caractérisante du participe pluriel et rattache clairement l’expression aux méchants. « Profèrent » convient au registre poétique sans être obscur.
- source_word: כָזָב
  choice: mensonges
  rationale: Équivalent français direct et idiomatique dans un contexte de parole fausse.
theological_decisions:
- issue: Le verset enseigne-t-il explicitement une culpabilité morale prénatale ou une doctrine technique du péché hérité ?
  choice: Conserver l’hyperbole poétique selon laquelle les méchants dévient dès le tout début de la vie, sans en faire à elle seule une formulation doctrinale technique.
  alternative: Lire l’expression soit comme une affirmation doctrinale explicite d’une corruption dès la conception, soit comme une simple invective sans aucune portée anthropologique.
  rationale: Le parallélisme « dès le sein maternel » // « dès le ventre de leur mère » donne à la dénonciation une force extrême. La traduction maintient cette force et son ambiguïté sans préciser davantage que l’hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme corporel de l’hébreu est conservé ; « profèrent » maintient la dignité poétique du psaume.
