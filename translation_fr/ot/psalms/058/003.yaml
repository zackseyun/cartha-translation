revisions:
- from: Les méchants se détournent dès le sein maternel ; ils s’égarent dès le ventre de leur mère[a], eux qui profèrent des mensonges.
  to: Les méchants sont éloignés dès le sein maternel ; dès le ventre maternel, ils s’égarent, eux qui disent des mensonges.
  rationale: La révision corrige la nuance de זֹרוּ, allège la seconde expression corporelle sans la paraphraser par « naissance », et emploie une caractérisation idiomatique pour le participe « disant des mensonges ». Elle conserve l’hyperbole du psaume et ne la transforme pas en énoncé doctrinal technique.
