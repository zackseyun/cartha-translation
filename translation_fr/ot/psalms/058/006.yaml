reference: Psalms 58:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: fr
  text: Ô Dieu, brise leurs dents dans leur bouche ; fracasse les crocs[a] des jeunes lions, Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les dents broyeuses ». Le terme hébreu désigne les dents de la mâchoire qui servent à broyer.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est employé ici comme une adresse directe. « Ô Dieu » explicite naturellement le vocatif en français.
- source_word: הֲרָס
  choice: brise
  rationale: L’impératif de הרס signifie démolir ou abattre ; avec les dents pour complément, « brise » rend l’image avec force et naturel.
- source_word: שִׁנֵּימוֹ
  choice: leurs dents
  rationale: Le pluriel muni du suffixe de troisième personne masculine plurielle se rend directement ainsi.
- source_word: בְּפִימוֹ
  choice: dans leur bouche
  rationale: Cette formulation conserve la valeur locative ordinaire de ב et l’image concrète de l’hébreu.
- source_word: מַלְתְּעוֹת
  choice: les crocs
  rationale: Le terme désigne les dents servant à broyer, ou les dents de la mâchoire. Dans l’image de jeunes lions prédateurs, « crocs » exprime naturellement leur puissance dangereuse sans effacer la nuance lexicale, signalée en note.
- source_word: כְּפִירִים
  choice: des jeunes lions
  rationale: כפירים désigne habituellement de jeunes lions vigoureux plutôt que de petits lionceaux.
- source_word: נְתֹץ
  choice: fracasse
  rationale: L’impératif de נתץ évoque l’action de démolir, d’abattre ou de briser. « Fracasse » convient aux crocs et maintient le parallélisme énergique sans imposer l’idée plus précise d’un arrachement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » en conserve la fonction de nom propre.
- issue: Violence de l’imprécation
  choice: Conserver la demande concrète de briser les dents et les crocs
  alternative: Paraphraser par « enlève-leur leur puissance »
  rationale: L’hébreu présente une image corporelle violente et délibérée. L’abstraire atténuerait la tension propre à cette prière imprécatoire.
- issue: Sens précis de נתץ appliqué aux crocs
  choice: fracasse
  alternative: arrache
  rationale: Le verbe peut évoquer la démolition ou la rupture, mais n’exprime pas sans ambiguïté l’extraction. « Fracasse » préserve mieux son champ sémantique tout en restant idiomatique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le vocatif « Ô Dieu » et l’exclamation finale conviennent à la prière poétique ; les verbes concrets préservent la vigueur de l’imprécation et le parallélisme hébreu.
