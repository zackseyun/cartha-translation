translation_notes:
  register: Français international moderne, poétique et digne. Les deux souhaits imprécatoires sont rendus par le subjonctif exhortatif. Le parallélisme et les images concrètes de l’eau et des flèches sont conservés, tandis que les incertitudes lexicales sont exposées en notes.
