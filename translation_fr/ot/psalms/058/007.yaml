  text: יִמָּאֲס֣וּ כְמוֹ מַ֭יִם יִתְהַלְּכוּ לָ֑/מוֹ יִדְרֹ֥ךְ חצ/ו כְּמ֣וֹ יִתְמֹלָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/007.yaml
  text: Let them melt away like water that runs off[a]; when he aims his arrows[c][b], let them be as though cut off.
translation:
  language: fr
  text: Qu’ils se dissipent comme l’eau qui s’écoule[a] ! Quand il ajuste ses flèches[b], qu’elles soient comme si elles étaient brisées[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des eaux qui s’en vont ». L’expression hébraïque évoque une eau qui s’éloigne et disparaît.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sa flèche » au singulier, lequel peut avoir ici un sens collectif.
    reason: lexical_alternative
  - marker: c
    text: La fin du verset est difficile en hébreu. On pourrait aussi comprendre « qu’elles soient émoussées » ou « qu’elles se flétrissent ».
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: qu’ils se dissipent
  rationale: Dans l’image de l’eau qui s’en va, le verbe exprime ici la disparition ou la dissolution. « Se dissipent » rend naturellement en français la valeur souhaitée de la forme verbale sans préciser outre mesure le processus.
- source_word: כְמוֹ מַיִם
  choice: comme l’eau
  rationale: Cette formulation simple conserve directement la comparaison poétique.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: qui s’écoule
  rationale: Le mouvement de l’eau évoque son éloignement et sa disparition. « S’écoule » est idiomatique en français et laisse la direction implicite.
- source_word: יִדְרֹךְ
  choice: quand il pointe
  rationale: Avec les flèches, le verbe désigne l’action de préparer ou de diriger le tir. « Pointe » restitue cette action sans introduire explicitement l’arc, qui n’est pas nommé dans le texte hébreu.
- source_word: חצ/ו
  choice: ses flèches
  rationale: Le texte consonantique et la vocalisation massorétique présentent le singulier « sa flèche », mais le pluriel collectif est naturel en français et s’accorde avec la suite au pluriel; le singulier est signalé en note.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: qu’elles soient comme brisées
  rationale: La forme est rare et difficile. Dans le contexte des flèches, « brisées » exprime leur mise hors d’usage tout en conservant le comparatif « comme » et sans trancher entre les sens proposés de couper, émousser ou flétrir.
