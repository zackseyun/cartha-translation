id: PSA.58.2
reference: Psalms 58:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַף בְּ/לֵב֮ עוֹלֹ֪ת תִּפְעָ֫ל֥וּ/ן בָּ/אָ֡רֶץ חֲמַ֥ס יְ֝דֵי/כֶ֗ם תְּפַלֵּֽסֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/002.yaml
  text: Even in your heart you work injustice[b][a]; on the earth your hands weigh out violence.
translation:
  language: fr
  text: Même dans votre cœur, vous commettez des injustices ; sur la terre[b], vos mains pèsent la violence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mesurent la violence ». Le verbe hébreu peut évoquer l’action de peser ou de mesurer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Même
  rationale: La particule renforce l’accusation et souligne que l’injustice se trouve jusque dans l’intériorité.
- source_word: בְּלֵב
  choice: dans votre cœur
  rationale: Le singulier collectif est conservé pour désigner l’intention intérieure du groupe interpellé.
- source_word: עוֹלֹת תִּפְעָלוּן
  choice: vous commettez des injustices
  rationale: Le pluriel עוֹלֹת désigne des actes injustes, et פעל exprime ici leur accomplissement délibéré. « Commettre » est idiomatique en français.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: Cette lecture générale met en contraste les dispositions intérieures et les actes accomplis publiquement. « Dans le pays » reste possible.
- source_word: חֲמַס
  choice: la violence
  rationale: Le terme désigne couramment la violence, souvent avec la nuance plus large de tort violent.
- source_word: יְדֵיכֶם
  choice: vos mains
  rationale: L’image concrète des mains comme agents des actes est conservée.
- source_word: תְּפַלֵּסוּן
  choice: pèsent
  rationale: Le verbe פלס évoque l’action de peser ou de mesurer. La formulation maintient la métaphore et son ironie judiciaire sans la réduire à « exercer » ou « répandre ».
theological_decisions:
- issue: Portée métaphorique du dernier verbe dans un contexte judiciaire
  choice: 'Conserver l’image de la pesée : « vos mains pèsent la violence »'
  alternative: « vos mains mesurent la violence » ou, de façon plus explicite, « vous distribuez la violence au poids »
  rationale: 'L’image d’une pesée rappelle l’exercice du jugement et en accentue l’ironie : au lieu de rendre la justice, les destinataires dispensent la violence. Le français conserve aussi l’étrangeté poétique de l’hébreu.'
- issue: Référent de בָּאָרֶץ
  choice: « sur la terre »
  alternative: « dans le pays »
  rationale: Le contexte immédiat ne permet pas de trancher avec certitude entre une portée universelle et territoriale ; la variante est donc signalée.
translation_notes:
  register: Français moderne, digne et direct. Le parallélisme entre le cœur et les mains est préservé, ainsi que la métaphore judiciaire volontairement saisissante de la pesée de la violence.
