  edition: WLC
  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: fr
  text: 'Et l’on dira : « Certainement, il y a un fruit pour le juste[a] ; certainement, il y a un Dieu qui juge sur la terre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il y a un fruit pour le juste ». Le « fruit » désigne ici l’issue, le bénéfice ou la récompense qui revient au juste.'
    reason: lexical_alternative
  - marker: b
    text: Le participe hébreu traduit par « qui juge » est au pluriel. L’expression est souvent comprise comme désignant le Dieu unique malgré cette forme plurielle ; elle peut aussi, plus littéralement, se comprendre comme « des dieux qui jugent ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: Alors on dira
  rationale: Le singulier אָדָם est générique et désigne l’être humain en général. La tournure française impersonnelle « on dira » rend naturellement cette valeur collective, tandis que l’imparfait hébreu prend ici un sens futur et consécutif après le jugement décrit auparavant.
- source_word: אַךְ
  choice: Oui
  rationale: Dans ses deux emplois, la particule exprime une affirmation forte plutôt qu’une restriction. « Oui » convient à la reconnaissance publique qui conclut le psaume et évite la nuance d’incertitude que « sûrement » peut avoir en français courant.
- source_word: פְּרִי
  choice: un fruit
  rationale: Le sens concret est « fruit », employé métaphoriquement pour le résultat, les conséquences ou la récompense de la justice. Conserver l’image respecte la poésie hébraïque.
- source_word: לַצַּדִּיק
  choice: pour le juste
  rationale: L’adjectif substantivé singulier désigne la personne juste de manière représentative. « Le juste » est idiomatique dans le registre biblique français et préserve le singulier.
- source_word: יֵשׁ אֱלֹהִים
  choice: il y a un Dieu
  rationale: יֵשׁ est une construction existentielle. « Un Dieu » rend cette affirmation d’existence sans présenter Dieu comme une divinité parmi d’autres ; la majuscule indique le Dieu véritable visé dans le contexte.
- source_word: שֹׁפְטִים
  choice: qui juge
  rationale: Bien que le participe soit morphologiquement pluriel, אֱלֹהִים désigne vraisemblablement ici le Dieu unique. Le singulier français donne un accord naturel tout en signalant en note l’ambiguïté formelle de l’hébreu.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: Le contexte porte sur l’exercice visible de la justice divine dans le monde. « Sur la terre » rend naturellement la portée large de אֶרֶץ.
theological_decisions:
- issue: Interprétation du groupe אֱלֹהִים שֹׁפְטִים
  choice: « un Dieu qui juge » au singulier
  alternative: « des dieux qui jugent » au pluriel
  rationale: Le point culminant du verset est la reconnaissance de la justice du Dieu véritable. Le contexte favorise donc le singulier, mais le participe pluriel constitue une réelle particularité grammaticale qui mérite d’être conservée comme possibilité en note plutôt que supprimée.
translation_notes:
  register: Français moderne, international et digne. La répétition de « oui » conserve le parallélisme emphatique. « Fruit » maintient l’image poétique de l’hébreu, tandis que les notes explicitent son sens contextuel et la tension grammaticale du dernier membre.
