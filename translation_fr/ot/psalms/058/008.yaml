  text: כְּמ֣וֹ שַׁ֭בְּלוּל תֶּ֣מֶס יַהֲלֹ֑ךְ נֵ֥פֶל אֵ֝֗שֶׁת בַּל חָ֥זוּ שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/008.yaml
  text: Like a snail that melts away as it goes[b][a], like a stillborn child that has not seen the sun.
translation:
  language: fr
  text: Comme l’escargot qui se dissout en avançant, comme l’enfant mort-né qui n’a pas vu le soleil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la seconde comparaison dit : « une fausse couche d’une femme — ils n’ont pas vu le soleil ». La syntaxe et le pluriel du verbe hébreu sont difficiles; le sens paraît viser l’enfant non viable, qui n’a jamais vu le jour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ
  choice: Comme
  rationale: Introduit naturellement les deux comparaisons poétiques.
- source_word: שַׁבְּלוּל
  choice: l’escargot
  rationale: Sens traditionnel et le mieux établi ici; l’image évoque l’animal semblant se dissoudre dans sa trace.
- source_word: תֶּמֶס
  choice: qui se dissout
  rationale: Rend l’idée de fonte ou de dissolution associée à l’escargot, sous une forme verbale naturelle en français.
- source_word: יַהֲלֹךְ
  choice: en avançant
  rationale: Exprime le mouvement de l’escargot tout en reliant naturellement l’action à sa dissolution.
- source_word: נֵפֶל אֵשֶׁת
  choice: l’enfant mort-né
  rationale: Rend de façon intelligible le produit d’une fausse couche ou une naissance non viable, sans rattacher à tort la proposition suivante à la femme.
- source_word: בַּל חָזוּ שָׁמֶשׁ
  choice: qui n’a pas vu le soleil
  rationale: La proposition vise l’enfant non viable. Le singulier français lisse l’accord pluriel difficile de l’hébreu tout en conservant le sens.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. « Se dissout en avançant » conserve l’image ancienne de l’escargot qui semble disparaître dans sa trace; « enfant mort-né » clarifie le référent de la seconde comparaison sans masquer la difficulté syntaxique, signalée en note.
