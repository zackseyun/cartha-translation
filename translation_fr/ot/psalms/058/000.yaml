  yaml_path: translation/ot/psalms/058/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: fr
  text: Au chef de chœur. « Ne détruis pas. »[a] De David. Un miktam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « sur l’air de “Ne détruis pas” », si l’expression précise le chant ou l’accompagnement musical.'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu miktam est une désignation de psaume dont le sens est incertain ; il peut indiquer un type de composition ou un arrangement musical.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: La formule des titres de psaumes désigne le responsable de l’exécution musicale. Cette expression est concise, naturelle en français et conserve la fonction liturgique.
- source_word: אַל תַּשְׁחֵת
  choice: « Ne détruis pas »
  rationale: Dans les titres des psaumes, cette expression est probablement le nom d’un air ou d’un arrangement musical. Les guillemets signalent ce statut probable sans ajouter une préposition absente de l’hébreu.
- source_word: לְדָוִד
  choice: De David
  rationale: Le lamed peut exprimer l’auteur, la dédicace ou plus largement l’association. « De David » préserve mieux cette ambiguïté que « par David ».
- source_word: מִכְתָּם
  choice: Un miktam
  rationale: Le sens précis de ce terme servant d’étiquette littéraire ou musicale est incertain. La translittération évite une traduction conjecturale.
theological_decisions:
- issue: Nature des indications du titre
  choice: Présenter la ligne comme un titre canonique comportant des indications musicales et littéraires, sans préciser davantage leur nature incertaine.
  alternative: Comprendre אַל תַּשְׁחֵת comme un ordre direct et rendre לְדָוִד par « par David ».
  rationale: L’hébreu ne permet pas d’imposer avec certitude l’une de ces précisions. La traduction conserve donc l’ambiguïté et n’affirme pas explicitement une paternité littéraire.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation segmente les indications du titre, tandis que les guillemets marquent le nom probable d’un air. Les deux termes incertains sont expliqués en notes.
