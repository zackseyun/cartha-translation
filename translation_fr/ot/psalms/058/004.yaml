source:
  edition: WLC
  text: חֲמַת לָ֗/מוֹ כִּ/דְמ֥וּת חֲמַת נָחָ֑שׁ כְּמוֹ פֶ֥תֶן חֵ֝רֵ֗שׁ יַאְטֵ֥ם אָזְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/004.yaml
  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: fr
  text: Leur venin est comme celui d’un serpent, comme celui d’un cobra sourd[a] qui se bouche l’oreille,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aspic »; le mot hébreu פֶתֶן désigne un serpent venimeux dont l’identification précise est incertaine, traditionnellement rendu par « aspic ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: venin
  rationale: Dans le parallélisme avec le serpent, le nom désigne naturellement le venin plutôt que la colère.
- source_word: לָמוֹ
  choice: leur
  rationale: 'La forme pronominale a ici une valeur possessive naturelle en français : « leur venin ».'
- source_word: כִּדְמוּת
  choice: est comme celui de
  rationale: Cette formulation rend clairement la comparaison tout en évitant la répétition peu naturelle de « venin ».
- source_word: נָחָשׁ
  choice: serpent
  rationale: Terme général, naturel et adapté au registre poétique, distinct du reptile plus précisément nommé dans le second membre.
- source_word: כְּמוֹ
  choice: comme celui de
  rationale: La tournure comparative est rendue idiomatiquement, avec reprise implicite de « venin ».
- source_word: פֶתֶן
  choice: cobra
  rationale: Le mot désigne un serpent venimeux; « cobra » constitue un équivalent moderne clair, tandis que l’identification zoologique exacte demeure incertaine.
- source_word: חֵרֵשׁ
  choice: sourd
  rationale: L’adjectif signifie « sourd »; l’image porte sur l’incapacité ou le refus d’entendre.
- source_word: יַאְטֵם
  choice: se bouche
  rationale: Le verbe exprime l’action de fermer ou d’obturer; « se bouche l’oreille » restitue naturellement l’image en français.
- source_word: אָזְנוֹ
  choice: l’oreille
  rationale: Le singulier hébreu est conservé; le possessif est naturellement exprimé par la construction pronominale française « se bouche l’oreille ».
theological_decisions: []
