source:
  edition: WLC
  text: אַשְׁרֵ֤י הַ/גֶּ֣בֶר אֲשֶׁר תְּיַסְּרֶ֣/נּוּ יָּ֑הּ וּֽ/מִ/תּוֹרָתְ/ךָ֥ תְלַמְּדֶֽ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: fr
  text: Heureux l’homme[a] que tu corriges, Yah[b], et que tu instruis par ta loi[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’homme » ; le singulier masculin a ici une valeur représentative.
    reason: lexical_alternative
  - marker: b
    text: « Yah » est la forme poétique abrégée du nom divin.
    reason: source_clarification
  - marker: c
    text: Ou « par ton instruction ». Le mot hébreu torah peut désigner la loi ou, plus largement, l’enseignement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Formule française naturelle et consacrée des béatitudes, exprimant une condition favorable et épanouie plutôt qu’un simple sentiment passager.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom hébreu est masculin singulier et désigne ici un individu représentatif; la forme masculine du texte source est donc conservée.
- source_word: תְּיַסְּרֶנּוּ
  choice: que tu corriges
  rationale: Le piel de יסר évoque une correction formatrice ou une discipline corrective. « Corriger » est actuel et naturel en français, tout en conservant cette nuance.
- source_word: יָּהּ
  choice: Yah
  rationale: Le texte porte la forme poétique abrégée du nom divin, et non le tétragramme complet; elle est donc rendue distinctement.
- source_word: וּמִתּוֹרָתְךָ
  choice: par ta loi
  rationale: La préposition מן indique ici la source ou le moyen de l’enseignement. « Par ta loi » est idiomatique en français; « instruction » demeure une possibilité sémantique pour תּוֹרָה.
- source_word: תְלַמְּדֶנּוּ
  choice: que tu instruis
  rationale: Le piel de למד signifie « enseigner, instruire ». La répétition de « que » rend clairement en français les deux verbes coordonnés gouvernés par le même antécédent.
theological_decisions:
- issue: Forme du nom divin יָּהּ
  choice: Yah
  alternative: le Seigneur
  rationale: La forme abrégée יָהּ est conservée afin de ne pas l’assimiler silencieusement au tétragramme complet YHWH.
- issue: Portée de הַגֶּבֶר
  choice: l’homme, avec indication de sa valeur représentative en note
  alternative: la personne
  rationale: Le masculin singulier du texte est maintenu sans limiter pour autant la maxime à un seul individu particulier.
- issue: Étendue sémantique de תּוֹרָה
  choice: loi
  alternative: instruction
  rationale: « Loi » garde le terme biblique reconnu, tandis qu’une note préserve le sens plus large d’enseignement ou d’instruction.
translation_notes:
  register: Français international moderne, clair et digne. La tournure de béatitude « Heureux… » et l’exclamation conviennent au registre poétique du psaume. Le parallélisme entre correction et instruction est conservé.
