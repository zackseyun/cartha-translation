source:
  edition: WLC
  text: הַֽ֭/יְחָבְרְ/ךָ כִּסֵּ֣א הַוּ֑וֹת יֹצֵ֖ר עָמָ֣ל עֲלֵי חֹֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/020.yaml
  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: fr
  text: Un trône de ruine peut-il s’allier à toi[a], lui qui façonne le malheur au moyen de la loi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peut-il être associé à toi » ou « peut-il se joindre à toi ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « façonne le malheur sur la loi » : le pouvoir se sert de la loi ou d’un décret pour produire du tort, peut-être sous couvert de légalité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: peut-il s’allier à toi
  rationale: La forme interrogative de חבר exprime ici l’association ou l’alliance. Cette formulation conserve la portée relationnelle et politique de la question rhétorique.
- source_word: כִּסֵּא
  choice: trône
  rationale: Le sens usuel est « trône », employé ici par métonymie pour un pouvoir dirigeant ou judiciaire.
- source_word: הַוּוֹת
  choice: de ruine
  rationale: Le pluriel peut évoquer des désastres, des actes destructeurs ou des entreprises funestes. « Ruine » garde cette force sans réduire le terme à la seule faute morale.
- source_word: יֹצֵר
  choice: façonne
  rationale: Le participe de יצר signifie concrètement former ou façonner; le choix français préserve cette image appliquée à la production institutionnelle du malheur.
- source_word: עָמָל
  choice: le malheur
  rationale: Le nom peut désigner la peine, la misère, le tort ou l’oppression. « Malheur » reste assez large tout en convenant au dommage produit par un pouvoir injuste.
- source_word: עֲלֵי חֹק
  choice: au moyen de la loi
  rationale: Littéralement « sur la loi/le décret ». La formule peut présenter la loi comme instrument, ou éventuellement comme prétexte, du mal causé; le texte principal retient l’instrument sans imposer davantage l’interprétation.
theological_decisions:
- issue: Rapport entre Dieu et un pouvoir injuste
  choice: La question rhétorique met en cause la possibilité qu’un pouvoir destructeur soit allié à Dieu.
  alternative: Le verset pourrait viser plus généralement la présence auprès de Dieu d’un juge injuste.
  rationale: L’image du trône et le verbe d’association suggèrent l’incompatibilité entre Dieu et l’autorité corrompue. La traduction conserve cette incompatibilité sous forme interrogative, sans la transformer en affirmation doctrinale explicite.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste naturelle tout en conservant la question rhétorique, l’image politique du trône et la métaphore de la fabrication du malheur. Les deux appels de note figurent dans le texte principal.
