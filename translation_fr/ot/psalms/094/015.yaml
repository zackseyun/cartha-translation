id: PSA.94.15
reference: Psalms 94:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי עַד צֶ֭דֶק יָשׁ֣וּב מִשְׁפָּ֑ט וְ֝/אַחֲרָ֗י/ו כָּל יִשְׁרֵי לֵֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/015.yaml
  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: fr
  text: Car le jugement reviendra à la justice[a], et tous ceux dont le cœur est droit le suivront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ce qui est juste ». Les mots hébreux traduits par « jugement » et « justice » ont des sens qui se recoupent.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et après lui, tous ceux dont le cœur est droit ». Le sens paraît être qu’ils suivront le jugement rétabli ou s’y conformeront.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement de l’assurance exprimée dans le contexte précédent; « car » rend naturellement la valeur argumentative.
- source_word: עַד צֶדֶק
  choice: à la justice
  rationale: Avec יָשׁוּב, עַד a ici une valeur directionnelle; « justice » rend צֶדֶק comme la norme morale à laquelle le jugement revient.
- source_word: יָשׁוּב
  choice: reviendra
  rationale: Rend directement le sens courant de שוב, « revenir », et conserve l’idée d’un ordre juste rétabli.
- source_word: מִשְׁפָּט
  choice: le jugement
  rationale: Le terme peut désigner le jugement ou la justice. « Jugement » préserve ici la distinction lexicale avec צֶדֶק.
- source_word: וְאַחֲרָיו
  choice: le suivront
  rationale: Littéralement « et après lui »; le français explicite naturellement l’idée verbale sous-entendue, le suffixe masculin renvoyant vraisemblablement au jugement.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: tous ceux dont le cœur est droit
  rationale: Formulation française naturelle qui conserve la portée morale et intérieure de l’expression hébraïque.
theological_decisions:
- issue: Rapport entre le jugement et la justice
  choice: Le jugement reviendra à la justice.
  alternative: Le jugement se poursuivra jusqu’à ce que la justice prévale.
  rationale: La construction de יָשׁוּב avec עַד צֶדֶק indique plus naturellement un retour vers la justice qu’une durée; elle exprime l’espérance du rétablissement de l’ordre moral sans développer davantage l’affirmation.
- issue: Référent du suffixe dans וְאַחֲרָיו
  choice: Le suffixe renvoie au « jugement ».
  alternative: Il peut viser plus largement la justice ou l’ordre juste qui vient d’être évoqué.
  rationale: מִשְׁפָּט est l’antécédent masculin le plus proche, mais la portée conceptuelle plus large demeure possible; la note préserve cette légère ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique reste concise; les notes signalent le chevauchement lexical et l’ellipse de l’hébreu sans résoudre excessivement l’ambiguïté.
