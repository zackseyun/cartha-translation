id: PSA.94.9
reference: Psalms 94:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/נֹ֣טַֽע אֹ֭זֶן הֲ/לֹ֣א יִשְׁמָ֑ע אִֽם יֹ֥צֵֽר עַ֝֗יִן הֲ/לֹ֣א יַבִּֽיט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: fr
  text: Celui qui a planté l’oreille[a] n’entendrait-il pas ? Celui qui a façonné l’œil[b] ne verrait-il pas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « implanté l’oreille ». Le verbe hébreu signifie littéralement « planter » et emploie une image saisissante pour parler de l’œuvre du Créateur.
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « façonné » peut aussi être rendu par « formé » ou « modelé » ; celui qui est traduit par « voir » signifie plus littéralement « regarder » ou « observer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: a planté
  rationale: Le verbe נטע signifie littéralement « planter ». Cette formulation conserve l’image vive et poétique du Créateur, sans l’aplatir en « faire ».
- source_word: אֹזֶן
  choice: l’oreille
  rationale: Le sens concret est « oreille ». Le singulier hébreu est conservé, en parallèle avec « l’œil ».
- source_word: יִשְׁמָע
  choice: n’entendrait-il pas ?
  rationale: שמע désigne ici la faculté d’entendre plutôt que l’écoute attentive ou l’obéissance. Le conditionnel français exprime naturellement la question rhétorique.
- source_word: יֹצֵר
  choice: a façonné
  rationale: Le participe de יצר évoque l’action de former ou de modeler intentionnellement. « Façonner » conserve cette nuance artisanale et s’accorde bien avec l’image poétique.
- source_word: עַיִן
  choice: l’œil
  rationale: Le terme désigne concrètement l’œil. Le singulier maintient le parallélisme poétique avec « l’oreille ».
- source_word: יַבִּיט
  choice: ne verrait-il pas ?
  rationale: נבט peut signifier « regarder » ou « observer », mais le contexte met en parallèle la capacité visuelle avec l’audition. « Voir » rend naturellement le sens dans ce raisonnement rhétorique.
- source_word: הֲ...הֲלֹא
  choice: n’entendrait-il pas ? … ne verrait-il pas ?
  rationale: La construction interrogative négative appelle une réponse affirmative. En français, ces questions au conditionnel préservent la force rhétorique sans transformer l’interrogation en affirmation explicite.
- source_word: אִם
  choice: Celui qui
  rationale: Dans le second membre parallèle, אִם introduit la proposition correspondante plutôt qu’une véritable condition. La répétition de « Celui qui » restitue clairement le parallélisme en français.
theological_decisions:
- issue: Langage anthropomorphique concernant la perception divine
  choice: Conserver l’argument concret qui va du Créateur des organes humains à sa propre capacité d’entendre et de voir.
  alternative: 'Paraphraser : « Celui qui a donné l’ouïe et la vue ne percevrait-il pas ? »'
  rationale: Le texte fonde sa question sur les images de l’oreille et de l’œil. Les maintenir laisse intactes sa force poétique et sa tension théologique, sans expliquer de quelle manière la perception divine correspond aux facultés humaines.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme, les singuliers « oreille » et « œil », ainsi que les deux questions rhétoriques sont conservés. « Façonné » maintient l’imagerie du Créateur artisan, tandis que le conditionnel rend idiomatiquement en français la conclusion évidente attendue.
