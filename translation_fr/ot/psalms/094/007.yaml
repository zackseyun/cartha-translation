  text: וַ֭/יֹּ֣אמְרוּ לֹ֣א יִרְאֶה יָּ֑הּ וְ/לֹא יָ֝בִ֗ין אֱלֹהֵ֥י יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/007.yaml
  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: fr
  text: 'Et ils disent : « Yah[a] ne voit pas, et le Dieu de Jacob ne comprend pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yah », forme poétique abrégée du nom divin ; comparer la forme plus courante du nom d’alliance, souvent rendue par « le SEIGNEUR ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Et ils disent
  rationale: Bien que la forme hébraïque puisse formellement se rendre au passé (« et ils dirent »), le présent convient à la description poétique du discours caractéristique des méchants dans ce contexte.
- source_word: לֹא יִרְאֶה
  choice: ne voit pas
  rationale: Le verbe ראה exprime ici la perception visuelle et, par extension, le fait d'observer les actes humains. Cette traduction conserve l'image concrète de l'hébreu.
- source_word: יָּהּ
  choice: Yah
  rationale: Il s’agit de la forme poétique abrégée du nom divin, distincte dans le texte de la forme complète יהוה. La translittération « Yah » préserve cette particularité.
- source_word: וְלֹא יָבִין
  choice: et ... ne comprend pas
  rationale: Le verbe בין signifie couramment comprendre ou discerner. « Ne comprend pas » rend directement l'affirmation provocatrice selon laquelle Dieu n'aurait pas conscience de ce qui se passe.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: le Dieu de Jacob
  rationale: Cette formulation transparente et traditionnelle conserve le titre relationnel et son association avec le peuple d’Israël.
theological_decisions:
- issue: Rendu de la forme poétique abrégée du nom divin יָּהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: Le texte source emploie יָּהּ plutôt que le tétragramme יהוה. Garder « Yah » évite d’effacer cette distinction poétique sans imposer d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent décrit la parole caractéristique des méchants ; la syntaxe parallèle et la répétition de la négation sont conservées.
