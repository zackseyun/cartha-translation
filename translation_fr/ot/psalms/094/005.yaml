  text: עַמְּ/ךָ֣ יְהוָ֣ה יְדַכְּא֑וּ וְֽ/נַחֲלָתְ/ךָ֥ יְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/005.yaml
  text: O Yahweh[b][a], they crush your people and afflict your inheritance.
translation:
  language: fr
  text: Yahweh, ils écrasent[a] ton peuple et accablent ton héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils oppriment ». Le verbe hébreu évoque une oppression qui écrase.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta possession ». Le terme hébreu désigne un héritage ou un bien reçu en partage.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: עַם désigne ici le peuple qui appartient à Yahweh. « Ton peuple » est la formulation française la plus naturelle et la plus adaptée au contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », plutôt que par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: יְדַכְּאוּ
  choice: ils écrasent
  rationale: Le piel de דכא exprime une action qui broie ou écrase, y compris au sens d’une oppression violente. « Écrasent » conserve cette image forte.
- source_word: וְנַחֲלָתְךָ
  choice: ton héritage
  rationale: נַחֲלָה désigne un héritage ou un bien attribué. Appliqué au peuple de Dieu, « ton héritage » préserve la métaphore de l’appartenance sans l’expliciter davantage.
- source_word: יְעַנּוּ
  choice: ils accablent
  rationale: Au piel, ענה peut signifier affliger, opprimer ou maltraiter. « Accablent » rend la souffrance imposée tout en restant distinct du verbe précédent.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » préserve le nom divin plutôt que de lui substituer un titre.
- issue: Identification de נַחֲלָה
  choice: ton héritage
  alternative: ceux qui t’appartiennent
  rationale: Le texte qualifie collectivement le peuple d’« héritage » de Yahweh. La traduction conserve cette métaphore théologique sans la résoudre en paraphrase.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre des mots a été légèrement adapté pour obtenir une interpellation naturelle en français, tout en conservant le parallélisme entre « ton peuple » et « ton héritage », ainsi qu’entre les deux verbes de violence.
