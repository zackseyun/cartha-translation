  text: וַ/יָּ֤שֶׁב עֲלֵי/הֶ֨ם אֶת אוֹנָ֗/ם וּ/בְ/רָעָתָ֥/ם יַצְמִיתֵ֑/ם יַ֝צְמִיתֵ֗/ם יְהוָ֥ה אֱלֹהֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: fr
  text: Il fera retomber sur eux leurs méfaits[a] ; dans leur méchanceté, il les anéantira[b]. Yahvé[c], notre Dieu, les anéantira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Il a fait retomber sur eux leur faute. » Dans ce contexte poétique, le verbe hébreu peut être lu avec une valeur passée ou future, et אָוֶן peut désigner la faute, le mal ou les actes mauvais.'
    reason: alternative_lexicale_et_aspectuelle
  - marker: b
    text: 'Ou : « à cause de leur méchanceté » ou « par leur méchanceté, il les anéantira ». La préposition hébraïque peut indiquer la cause, le moyen ou plus largement les circonstances associées.'
    reason: ambiguïté_prépositionnelle
  - marker: c
    text: 'Hébreu : YHWH, le nom divin, rendu ici par « Yahvé ».'
    reason: nom_divin
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: Il fera retomber sur eux
  rationale: Le hifil de שוב exprime ici le retour de quelque chose sur quelqu’un. « Faire retomber sur eux » conserve l’image du mal commis qui revient sur ses auteurs. Le futur convient à la déclaration confiante de jugement qui se poursuit avec les deux imparfaits יַצְמִיתֵם.
- source_word: אֶת אוֹנָם
  choice: leurs méfaits
  rationale: אָוֶן peut désigner le mal, la faute ou les actes mauvais. « Leurs méfaits » exprime clairement le sens moral et concret dans un français courant, tout en évitant le registre plus technique d’« iniquité ».
- source_word: וּבְרָעָתָם
  choice: à cause de leur propre méchanceté
  rationale: רָעָה désigne ici le mal moral ou la méchanceté. Dans ce contexte judiciaire, « à cause de » rend naturellement la valeur de fondement que peut porter ב. « Propre » met en relief, sans changer le référent, que leur jugement est lié à leur mal à eux.
- source_word: יַצְמִיתֵם
  choice: il les anéantira
  rationale: Le hifil de צמת signifie détruire, supprimer ou anéantir. « Anéantir » conserve la force du verbe et permet d’en reproduire exactement la répétition emphatique.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahvé, notre Dieu
  rationale: Le nom divin יהוה est rendu par « Yahvé », et אֱלֹהֵינוּ par « notre Dieu ». La virgule rend la juxtaposition naturelle en français sans substituer un titre au nom propre.
theological_decisions:
- issue: Valeur temporelle de וַיָּשֶׁב dans ce contexte poétique
  choice: 'Déclaration au futur : « Il fera retomber »'
  alternative: 'Accompli : « Il a fait retomber » ou « Il a fait revenir »'
  rationale: Bien que la forme soit un wayyiqtol, la poésie peut l’employer hors d’une narration passée. Les deux יַצְמִיתֵם qui suivent et la conclusion confiante du psaume favorisent ici une déclaration future, tout en laissant l’autre analyse en note.
- issue: Rapport exprimé par ב dans וּבְרָעָתָם
  choice: 'Fondement ou cause : « à cause de leur propre méchanceté »'
  alternative: 'Moyen : « par leur propre méchanceté » ; circonstance ou association : « dans leur méchanceté »'
  rationale: La préposition ב admet plusieurs nuances. La traduction principale donne un français naturel adapté au contexte de rétribution, tandis que la note conserve l’ambiguïté réelle du texte hébreu.
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: Le SEIGNEUR
  rationale: Le texte porte le nom divin personnel יהוה. Le translittérer par « Yahvé » le distingue du titre אֲדֹנָי et ne remplace pas silencieusement le nom par un titre.
translation_notes:
  register: 'Français international moderne, clair et digne. « Méfaits » et « méchanceté » restent accessibles tout en maintenant le parallélisme moral du verset. La répétition de « il les anéantira » est volontaire : elle reproduit l’insistance de l’hébreu. La ponctuation en deux phrases met en valeur la reprise finale avec le nom divin.'
