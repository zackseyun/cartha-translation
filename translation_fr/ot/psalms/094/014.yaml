source:
  edition: WLC
  text: כִּ֤י לֹא יִטֹּ֣שׁ יְהוָ֣ה עַמּ֑/וֹ וְ֝/נַחֲלָת֗/וֹ לֹ֣א יַעֲזֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: fr
  text: Car Yahweh ne délaissera[a] pas son peuple ; il n’abandonnera pas son héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne rejettera pas » ou « n’abandonnera pas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son patrimoine » ou « sa possession ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison ou l’explication de ce qui précède ; « Car » en conserve naturellement la valeur logique.
- source_word: יִטֹּשׁ
  choice: ne rejettera pas
  rationale: Le verbe נטשׁ peut exprimer l’idée de délaisser, d’abandonner ou de rejeter. « Ne rejettera pas » convient au rapport entre Yahweh et son peuple et se distingue du second verbe du parallélisme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par une translittération plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Dans ce contexte relationnel et allianciel, עַם désigne naturellement le peuple qui appartient à Yahweh.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: נַחֲלָה évoque un héritage, un patrimoine ou une possession attribuée. « Son héritage » maintient l’image selon laquelle le peuple est la part propre de Yahweh.
- source_word: יַעֲזֹב
  choice: il n’abandonnera pas
  rationale: עזב signifie laisser, délaisser ou abandonner. « Abandonnera » exprime clairement l’idée de ne pas laisser derrière soi, tout en préservant la variation lexicale du parallélisme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom propre sans lui substituer un titre.
- issue: Portée de נַחֲלָתוֹ appliqué au peuple
  choice: son héritage
  alternative: son patrimoine ; son bien propre
  rationale: « Héritage » préserve l’image alliancielle et possessive de l’hébreu sans préciser au-delà du texte la manière dont cette appartenance doit être comprise.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébreu est conservé avec deux verbes français distincts, « rejeter » et « abandonner », et le point-virgule maintient l’équilibre des deux propositions.
