source:
  edition: WLC
  text: יְֽהוָ֗ה יֹ֭דֵעַ מַחְשְׁב֣וֹת אָדָ֑ם כִּי הֵ֥מָּה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/011.yaml
  text: The LORD knows the thoughts of man, that they are vapor.
translation:
  language: fr
  text: 'Le Seigneur connaît les pensées des humains : elles ne sont qu’un souffle.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Rend le nom divin selon la convention française courante, avec une formulation naturelle et digne.
- source_word: מַחְשְׁבוֹת
  choice: les pensées
  rationale: Équivalent direct couvrant ici les raisonnements et desseins intérieurs.
- source_word: אָדָם
  choice: des humains
  rationale: Dans cet emploi collectif et générique, אָדָם désigne l’humanité plutôt qu’un homme particulier.
- source_word: הָבֶל
  choice: un souffle
  rationale: Préserve l’image concrète de ce qui est fugitif, inconsistant et sans substance, plutôt que de réduire le terme à la seule idée morale de vanité.
theological_decisions:
- issue: Portée de la connaissance divine
  choice: « connaît les pensées »
  alternative: « sait que les pensées »
  rationale: Conserve la construction selon laquelle le Seigneur connaît les pensées humaines, puis en affirme le caractère de souffle.
- issue: Valeur de הבל
  choice: « elles ne sont qu’un souffle »
  alternative: « elles sont vaines »
  rationale: Maintient la métaphore hébraïque et sa tension entre caractère passager, inconsistance et futilité, sans imposer une seule abstraction interprétative.
translation_notes:
  register: Français international moderne, clair et digne. Le deux-points explicite naturellement le rapport du כִּי hébreu avec la proposition précédente, tandis que « ne… que » restitue l’affirmation idiomatiquement sans ajouter de contenu.
