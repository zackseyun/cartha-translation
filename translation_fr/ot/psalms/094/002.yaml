source:
  edition: WLC
  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: fr
  text: Lève-toi[a], juge de la terre ! Rends aux orgueilleux ce qu’ils méritent[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Élève-toi, juge de la terre » ; le verbe hébreu peut aussi être compris comme un appel à Dieu à « être exalté ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « rends la rétribution aux orgueilleux » ou « fais revenir la rétribution sur les orgueilleux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Élève-toi
  rationale: L’impératif appelle Dieu à se lever ou à s’élever pour intervenir. « Élève-toi » conserve l’image hébraïque et reste naturel dans ce registre poétique.
- source_word: שֹׁפֵט
  choice: juge
  rationale: Le participe substantivé sert ici de titre divin. « Juge » est concis et préserve la portée judiciaire de l’appel.
- source_word: הָאָרֶץ
  choice: de la terre
  rationale: Dans cette adresse à Dieu comme juge, « la terre » exprime plus naturellement la portée universelle que « le pays ».
- source_word: הָשֵׁב גְּמוּל עַל
  choice: Fais retomber sur
  rationale: L’expression signifie littéralement faire revenir une rétribution sur quelqu’un. Cette tournure française restitue à la fois le mouvement exprimé par שוב et l’idée de rétribution.
- source_word: גְּמוּל
  choice: ce qu’ils méritent
  rationale: Le nom désigne la rétribution ou le dû. La formulation idiomatique explicite le sens judiciaire sans employer le terme plus soutenu « rétribution ».
- source_word: גֵּאִים
  choice: les orgueilleux
  rationale: Le terme vise des personnes moralement arrogantes. « Les orgueilleux » est courant, précis et adapté au registre des Psaumes.
theological_decisions:
- issue: Nature de la demande de jugement divin
  choice: Un appel à Dieu, juge de toute la terre, pour qu’il intervienne et rende aux orgueilleux selon leurs actes.
  alternative: 'Un appel visant principalement la manifestation de la grandeur de Dieu : « sois exalté ».'
  rationale: Les deux impératifs et le vocabulaire judiciaire du verset favorisent une intervention active en justice, tout en laissant la note signaler l’autre valeur possible du premier verbe.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs et l’adresse directe sont conservés. La répétition sonore de la formulation hébraïque est rendue par deux appels brefs et vigoureux.
