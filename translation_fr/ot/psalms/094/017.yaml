id: PSA.94.17
reference: Psalms 94:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לוּלֵ֣י יְ֭הוָה עֶזְרָ֣תָ/ה לִּ֑/י כִּ/מְעַ֓ט שָֽׁכְנָ֖ה דוּמָ֣ה נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: fr
  text: Si Yahweh n’avait pas été mon secours, mon âme[a] aurait bientôt demeuré dans le silence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie » ; l’hébreu dit « mon âme », terme qui peut désigner la personne elle-même ou sa vie.
    reason: lexical_alternative
  - marker: b
    text: Le « silence » désigne probablement ici le silence de la mort ou du séjour des morts.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Si ... n’avait pas été
  rationale: Introduit une condition passée contraire aux faits; cette tournure française exprime naturellement l’irréel du passé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: עֶזְרָתָה לִּי
  choice: mon secours
  rationale: Rend le nom « secours, aide » et sa relation personnelle au psalmiste dans un français digne et idiomatique.
- source_word: כִּמְעַט
  choice: bientôt
  rationale: Dans cette construction, le terme indique que l’issue évoquée était imminente; « bientôt » s’intègre naturellement à la condition irréelle.
- source_word: שָׁכְנָה
  choice: aurait ... demeuré
  rationale: Préserve l’image de résidence ou de séjour portée par le verbe שׁכן tout en restant naturel en français.
- source_word: דוּמָה
  choice: le silence
  rationale: Conserve le sens lexical sans expliciter dans le corps du texte l’allusion probable à la mort ou au séjour des morts.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Maintient l’expression anthropologique et poétique hébraïque; le terme peut aussi désigner la vie ou la personne elle-même, possibilité signalée en note.
theological_decisions:
- issue: Faut-il expliciter l’allusion de דומה à la mort ou au séjour des morts ?
  choice: Conserver « le silence » dans le texte principal.
  alternative: « le silence de la mort », « la mort » ou « le séjour des morts »
  rationale: Le contexte évoque probablement la mort, mais le nom hébreu signifie directement « silence ». La traduction préserve cette image et son ouverture théologique, tandis qu’une note indique l’implication probable.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe conditionnelle est naturelle, tandis que « demeuré dans le silence » conserve l’image hébraïque sans la surinterpréter.
