  text: אַ֭לְמָנָה וְ/גֵ֣ר יַהֲרֹ֑גוּ וִֽ/יתוֹמִ֣ים יְרַצֵּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/006.yaml
  text: They kill the widow and the sojourner[b][a]; they murder the fatherless.
translation:
  language: fr
  text: Ils tuent la veuve et l’étranger établi parmi eux[a] ; ils assassinent les orphelins[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu désigne un étranger qui réside au sein du peuple, et non une personne simplement de passage.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui sont sans père » ; on peut aussi traduire : « les enfants privés de père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלְמָנָה
  choice: la veuve
  rationale: Le singulier hébreu a une valeur générique et représente ici une catégorie sociale vulnérable ; le français conserve cette forme.
- source_word: גֵר
  choice: l’étranger établi parmi eux
  rationale: Le terme désigne un non-Israélite qui réside au sein du peuple, et non un simple étranger de passage. Cette formulation est précise sans recourir au terme administratif « résident étranger ».
- source_word: יַהֲרֹגוּ
  choice: tuent
  rationale: Ce verbe courant exprime directement l’action de tuer ; le présent français convient au contexte poétique.
- source_word: יְתוֹמִים
  choice: les orphelins
  rationale: Le pluriel français est naturel et désigne clairement ce groupe vulnérable. Une note signale que l’hébreu vise plus littéralement ceux qui sont privés de père.
- source_word: יְרַצֵּחוּ
  choice: assassinent
  rationale: Le verbe hébreu porte la forte connotation d’un homicide criminel. « Assassinent » maintient cette valeur morale et distingue ce second verbe du plus général « tuent ».
