source:
  edition: WLC
  text: יַבִּ֣יעוּ יְדַבְּר֣וּ עָתָ֑ק יִֽ֝תְאַמְּר֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/004.yaml
  text: They gush forth[a]; they speak arrogantly[b]; all the workers of wickedness boast.
translation:
  language: fr
  text: Ils déversent des paroles[a], ils parlent avec arrogance[b] ; tous ceux qui font le mal se vantent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils font jaillir leurs paroles » ; l’objet du verbe n’est pas exprimé en hébreu.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils profèrent des paroles insolentes ».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יַבִּיעוּ
  choice: ils déversent des paroles
  rationale: Le hiphil de נבע évoque ce qui jaillit ou se répand. Dans ce contexte de parole, l’objet « des paroles » reste implicite en hébreu mais peut être explicité naturellement en français.
- source_word: יְדַבְּרוּ
  choice: ils parlent
  rationale: Équivalent direct et courant de דבר, qui conserve le parallélisme verbal.
- source_word: עָתָק
  choice: avec arrogance
  rationale: Le terme désigne ici l’arrogance ou l’insolence, vraisemblablement comme contenu ou caractère de la parole. La tournure adverbiale est naturelle sans écarter la nuance morale.
- source_word: יִתְאַמְּרוּ
  choice: se vantent
  rationale: La forme réfléchie exprime l’ostentation ou l’exaltation de soi ; « se vantent » restitue clairement cette idée en français actuel.
- source_word: כָּל
  choice: tous
  rationale: Conserve la portée exhaustive du texte hébreu.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: Rend de façon naturelle la construction « artisans/auteurs de malfaisance », tout en conservant l’idée d’une pratique active du mal.
theological_decisions:
- issue: Sens de עָתָק après « parler »
  choice: ils parlent avec arrogance
  alternative: ils profèrent des paroles insolentes
  rationale: L’hébreu permet de comprendre le terme comme la manière de parler ou comme l’objet de la parole. Le texte principal privilégie une formulation française fluide, tandis que la note préserve l’autre analyse.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le rythme ternaire et la progression entre parole arrogante et vantardise sont conservés.
