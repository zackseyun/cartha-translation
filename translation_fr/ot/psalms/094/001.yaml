source:
  edition: WLC
  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: fr
  text: Dieu des vengeances, Yahweh, Dieu des vengeances, manifeste-toi[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « resplendis ! » / « parais ! ». Le verbe peut désigner une manifestation visible et éclatante de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Dieu
  rationale: Dans cette invocation, אֵל est un titre divin. « Dieu » est naturel en français et convient à la construction « Dieu des vengeances ».
- source_word: נְקָמוֹת
  choice: vengeances
  rationale: Le pluriel hébreu est conservé afin de rendre sa force intensive et les actes de juste rétribution divine, sans atténuer le terme en « justice ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel plutôt que de lui substituer le titre « le Seigneur ».
- source_word: הוֹפִיעַ
  choice: manifeste-toi
  rationale: L’impératif hiphil de יפע appelle Dieu à paraître de façon manifeste, avec une possible nuance d’éclat. « Manifeste-toi » rend bien l’idée d’une manifestation divine tout en restant naturel en français.
theological_decisions:
- issue: Le langage de la vengeance divine
  choice: Conserver « Dieu des vengeances »
  alternative: « Dieu de justice » ou « Dieu vengeur »
  rationale: L’hébreu nomme explicitement les vengeances ou rétributions. « Justice » atténuerait et interpréterait le texte, tandis que « Dieu vengeur » transformerait le complément nominal en qualité permanente.
- issue: La manifestation divine exprimée par הוֹפִיעַ
  choice: « manifeste-toi »
  alternative: « resplendis » ou « parais »
  rationale: Le verbe peut évoquer une apparition éclatante. « Manifeste-toi » préserve l’appel à une intervention divine perceptible sans imposer exclusivement une image lumineuse.
translation_notes:
  register: Français moderne, international et digne. La répétition hébraïque est conservée, ainsi que le pluriel marqué « vengeances ». Le vocatif reste direct et solennel.
