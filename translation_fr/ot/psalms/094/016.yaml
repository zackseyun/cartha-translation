source:
  edition: WLC
  text: מִֽי יָק֣וּם לִ֭/י עִם מְרֵעִ֑ים מִֽי יִתְיַצֵּ֥ב לִ֝/י עִם פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: fr
  text: Qui se lèvera pour moi contre ceux qui font le mal ? Qui prendra position pour moi contre ceux qui commettent l’injustice ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte littéralement « avec »; dans ce contexte d’affrontement, il a le sens de « contre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui pratiquent le mal » ou « les artisans du mal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif ouvre les deux questions parallèles et se traduit directement par « qui ».
- source_word: יָקוּם
  choice: se lèvera
  rationale: L’imparfait qal de קום évoque le fait de se lever pour intervenir; le futur français convient à cette question rhétorique.
- source_word: לִי
  choice: pour moi
  rationale: La préposition לִי exprime ici l’intérêt ou le soutien apporté au psalmiste, et non une simple direction.
- source_word: עִם
  choice: contre
  rationale: Bien que עִם signifie ordinairement « avec », les personnes mentionnées sont ici les adversaires auxquels il faut s’opposer; « contre » rend naturellement cette relation en français.
- source_word: מְרֵעִים
  choice: ceux qui font le mal
  rationale: Ce participe désigne des personnes qui font du mal. Cette formulation est claire, actuelle et conserve l’idée d’une conduite active.
- source_word: יִתְיַצֵּב
  choice: prendra position
  rationale: Le hitpael de יצב exprime le fait de se placer fermement ou de prendre position. Ce choix maintient l’image d’un défenseur qui intervient.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui commettent l’injustice
  rationale: L’expression désigne ceux qui accomplissent activement le mal. « Commettent l’injustice » est naturel en français et garde la portée morale de אָוֶן.
- source_word: אָוֶן
  choice: injustice
  rationale: Dans ce contexte, אָוֶן renvoie à une conduite mauvaise ou injuste; « injustice » préserve cette portée éthique sans imposer un vocabulaire confessionnel.
