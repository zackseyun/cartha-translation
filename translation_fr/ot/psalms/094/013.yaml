  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: fr
  text: pour lui donner du repos, loin des jours de malheur[a], jusqu’à ce qu’une fosse soit creusée pour le méchant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des jours de mal » ; c’est-à-dire des jours marqués par l’adversité ou la calamité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « jusqu’à ce qu’une fosse de perdition soit creusée pour le méchant ». Le mot hébreu peut évoquer la destruction ou la tombe, en plus de son sens premier de « fosse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: pour lui donner du repos
  rationale: L’infinitif hifil de שׁקט exprime le fait de procurer le calme ou le repos à quelqu’un. Cette formulation française est naturelle et conserve la valeur finale liée au verset précédent.
- source_word: מִימֵי רָע
  choice: loin des jours de malheur
  rationale: L’expression signifie littéralement « des jours de mal » et désigne ici des temps marqués par l’adversité ou la calamité. « Loin de » rend la séparation exprimée par מִ sans imposer que toute détresse soit définitivement supprimée.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Le marqueur temporel introduit le terme du repos accordé.
- source_word: יִכָּרֶה
  choice: soit creusée
  rationale: 'Le nifal inaccompli de כרה se comprend naturellement au passif dans cette construction : la fosse est creusée ou préparée pour le méchant.'
- source_word: לָרָשָׁע
  choice: pour le méchant
  rationale: L’adjectif substantivé au singulier désigne la personne méchante comme type représentatif.
- source_word: שָׁחַת
  choice: une fosse
  rationale: Le nom désigne une fosse, souvent avec des connotations de destruction ou de tombe. Le terme direct « fosse » préserve cette image sans en préciser excessivement la nature.
theological_decisions:
- issue: Nature du repos accordé au juste dans l’épreuve
  choice: un repos accordé à l’écart des jours de malheur, dans l’attente du jugement du méchant
  alternative: une tranquillité intérieure au milieu même du malheur, ou un repos exclusivement eschatologique
  rationale: La syntaxe relie ce repos à l’instruction évoquée au verset précédent et lui donne pour horizon le moment où la fosse est creusée pour le méchant. La traduction conserve la tension entre soulagement présent, calme intérieur possible et accomplissement futur de la justice.
translation_notes:
  register: Français international moderne, sobre et poétique. « Jours de malheur » reste proche de l’image hébraïque, tandis que « fosse » conserve la métaphore concrète et ses connotations funèbres sans les expliciter dans le corps du texte.
