  text: בְּ/רֹ֣ב שַׂרְעַפַּ֣/י בְּ/קִרְבִּ֑/י תַּ֝נְחוּמֶ֗י/ךָ יְֽשַׁעַשְׁע֥וּ נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/019.yaml
  text: When my anxious thoughts are many within me[b][a], your consolations delight my soul.
translation:
  language: fr
  text: Quand mes pensées inquiètes se multiplient au-dedans de moi[a], tes consolations[b] réjouissent mon âme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand la multitude de mes pensées troublées est en moi. » Le nom hébreu peut évoquer des pensées troublées, divisées ou ramifiées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tes réconforts font les délices de mon âme ». L’hébreu emploie le pluriel : « consolations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֹב
  choice: Quand ... se multiplient
  rationale: La construction signifie littéralement « dans l’abondance de ». Une proposition circonstancielle introduite par « quand » restitue naturellement cette valeur, tandis que « se multiplient » conserve l’idée d’abondance.
- source_word: שַׂרְעַפַּי
  choice: mes pensées inquiètes
  rationale: Le nom désigne des pensées troublées, partagées ou ramifiées, et donc une agitation intérieure plutôt que de simples pensées.
- source_word: בְּקִרְבִּי
  choice: au-dedans de moi
  rationale: Cette expression localise les pensées dans l’intériorité du psalmiste. « Au-dedans de moi » est naturel, poétique et plus marqué que le simple « en moi ».
- source_word: תַּנְחוּמֶיךָ
  choice: tes consolations
  rationale: Le pluriel hébreu est conservé; il peut évoquer les multiples paroles ou manifestations de réconfort venant de Dieu.
- source_word: יְשַׁעַשְׁעוּ
  choice: réjouissent
  rationale: Le verbe exprime le plaisir, le délice ou l’apaisement réconfortant. « Réjouissent » convient au registre poétique sans affaiblir son effet positif.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Dans ce contexte poétique et intérieur, נֶפֶשׁ désigne la personne profonde; « mon âme » en préserve la portée et le registre.
