lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Expression interrogative idiomatique qui, dans une plainte, demande combien de temps encore la situation durera.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: L’adjectif substantivé pluriel désigne collectivement ceux qui agissent avec méchanceté; cette formulation française est concise et traditionnelle sans être archaïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: יַעֲלֹזוּ
  choice: exulteront-ils
  rationale: Le verbe עלז exprime une joie vive et débordante; « exulter » conserve ici la nuance de jubilation, possiblement triomphante.
- source_word: עַד מָתַי רְשָׁעִים … עַד מָתַי רְשָׁעִים
  choice: les méchants, jusqu’à quand les méchants
  rationale: La répétition volontaire est maintenue pour rendre l’insistance et l’intensité de la plainte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; la transcription préserve le nom propre sans le remplacer par un titre.
- issue: Nuance morale et émotionnelle de יַעֲלֹזוּ
  choice: exulteront-ils
  alternative: se réjouiront-ils
  rationale: « Exulter » exprime mieux la joie débordante suggérée par le verbe, tout en évitant d’ajouter explicitement l’idée de victoire que porterait « triompher ».
translation_notes:
  register: Français moderne, soutenu mais accessible. La construction répétitive et légèrement suspendue reproduit l’insistance poétique de l’hébreu plutôt que de lisser la plainte.
