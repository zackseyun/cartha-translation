source:
  edition: WLC
  text: בִּ֭ינוּ בֹּעֲרִ֣ים בָּ/עָ֑ם וּ֝/כְסִילִ֗ים מָתַ֥י תַּשְׂכִּֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/008.yaml
  text: Understand, you brutish among the people; and you fools, when will you become wise?
translation:
  language: fr
  text: Comprenez, vous, êtres sans raison parmi le peuple ! Et vous, insensés, quand aurez-vous du bon sens ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Comprenez donc
  rationale: 'Impératif pluriel de בין : « comprenez, discernez ». « donc » rend naturellement en français la force interpellative du contexte sans ajouter une conclusion doctrinale.'
- source_word: בֹּעֲרִים
  choice: vous qui êtes abrutis
  rationale: Le terme désigne des êtres dépourvus de raison, comparables à des brutes. « Abrutis » conserve cette image forte tout en restant intelligible en français moderne.
- source_word: בָּעָם
  choice: parmi le peuple
  rationale: Rend directement la préposition בְּ et le nom עָם, en conservant l'identification de ces personnes au sein du peuple.
- source_word: כְסִילִים
  choice: insensés
  rationale: Terme sapientiel pour des personnes moralement et intellectuellement folles ; « insensés » est dignifié et distinct d'une simple déficience mentale.
- source_word: תַּשְׂכִּילוּ
  choice: aurez-vous du discernement
  rationale: Le verbe שכל exprime ici l'accès à l'intelligence pratique ou au discernement. Cette tournure française préserve la question rhétorique et évite la répétition plate de « comprendre ».
theological_decisions:
- issue: Nature de la folie dénoncée
  choice: Conserver une réprimande visant l'absence de raison et de discernement
  alternative: Employer un vocabulaire clinique ou atténué comme « ignorants »
  rationale: Le parallélisme בֹּעֲרִים / כְסִילִים relève du langage moral et sapientiel, non d'un diagnostic médical ; la vigueur du reproche doit être maintenue.
translation_notes:
  register: Français international moderne, direct et solennel. L'interpellation est vigoureuse sans être vulgaire ; le parallélisme poétique hébreu est conservé.
