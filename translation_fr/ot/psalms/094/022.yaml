id: PSA.94.22
reference: Psalms 94:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֬י יְהוָ֣ה לִ֣/י לְ/מִשְׂגָּ֑ב וֵ֝/אלֹהַ֗/י לְ/צ֣וּר מַחְסִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/022.yaml
  text: But Yahweh has become my stronghold[a], and my God the rock of my refuge.
translation:
  language: fr
  text: Mais Yahweh est devenu ma forteresse[a], et mon Dieu, le rocher où je trouve refuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh devint ma forteresse ». Le verbe hébreu peut se traduire par un passé simple ; « est devenu » souligne que le résultat demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: est devenu
  rationale: Le wayyiqtol de היה exprime ici un fait passé dont le résultat demeure. « Est devenu » conserve à la fois l’expérience vécue et la confiance présente du psalmiste.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre de substitution.
- source_word: לִי לְמִשְׂגָּב
  choice: ma forteresse
  rationale: La construction signifie littéralement que Yahweh est devenu « pour moi un lieu sûr en hauteur ». « Ma forteresse » exprime naturellement en français la relation personnelle ainsi que l’image de protection inaccessible.
- source_word: וֵאלֹהַי
  choice: et mon Dieu
  rationale: Cette traduction directe préserve le parallélisme et la confession personnelle du texte hébreu.
- source_word: לְצוּר מַחְסִי
  choice: le rocher où je trouve refuge
  rationale: Cette formulation conserve la métaphore du rocher tout en rendant clairement et naturellement la relation entre צוּר et מַחְסִי.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme יהוה. La translittération préserve le nom personnel sans lui substituer un titre.
- issue: Valeur temporelle de וַיְהִי
  choice: est devenu
  alternative: devint / a été
  rationale: « Est devenu » garde l’idée d’un événement passé avec un résultat encore valable, sans réduire l’énoncé à un simple état.
translation_notes:
  register: Français international moderne, naturel et digne. « Forteresse » rend clairement l’image protectrice de מִשְׂגָּב ; la seconde proposition conserve l’image distincte du rocher et évite la tournure moins idiomatique « le rocher de mon refuge ».
