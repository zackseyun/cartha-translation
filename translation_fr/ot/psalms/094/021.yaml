source:
  edition: WLC
  text: יָ֭גוֹדּוּ עַל נֶ֣פֶשׁ צַדִּ֑יק וְ/דָ֖ם נָקִ֣י יַרְשִֽׁיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/021.yaml
  text: They band together against the life of the righteous[b][a], and they condemn innocent blood.
translation:
  language: fr
  text: Ils se liguent contre la vie du juste[a] et condamnent le sang innocent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils se rassemblent en bande contre la vie d’une personne juste. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et le sang innocent, ils le déclarent coupable » ; ou : « ils déclarent coupable l’innocent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: se liguent
  rationale: Le verbe évoque ici le fait de se rassembler en bande pour agir avec hostilité. « Se liguent » exprime naturellement en français l’action collective et concertée sans imposer une image strictement militaire.
- source_word: עַל
  choice: contre
  rationale: Avec ce verbe hostile, la préposition marque l’opposition et se rend naturellement par « contre ».
- source_word: נֶפֶשׁ
  choice: vie
  rationale: Dans ce contexte de violence et en parallèle avec « sang innocent », le mot désigne la vie concrètement menacée plutôt qu’une âme conçue comme une réalité distincte du corps.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé au singulier désigne une personne juste, possiblement de manière représentative. « Le juste » conserve ce singulier et reste idiomatique dans le registre biblique français.
- source_word: דָם
  choice: sang
  rationale: La traduction littérale préserve l’image vive, à la fois judiciaire et violente, de l’hébreu.
- source_word: נָקִי
  choice: innocent
  rationale: Le terme signifie exempt de faute ou de culpabilité; « sang innocent » est une expression française claire et naturelle.
- source_word: יַרְשִׁיעוּ
  choice: déclarent coupable
  rationale: 'Le hifil de רשע a un sens judiciaire: prononcer quelqu’un coupable. Cette formulation explicite mieux ce sens que le seul verbe « condamner », particulièrement avec « sang innocent » comme objet.'
theological_decisions:
- issue: Singulier représentatif de צַדִּיק
  choice: le juste
  alternative: une personne juste / les justes
  rationale: Le singulier hébreu peut désigner un individu type ou représenter une catégorie. « Le juste » maintient cette tension sans pluraliser ni préciser davantage l’identité de la victime.
- issue: Portée de נֶפֶשׁ
  choice: la vie
  alternative: l’âme / la personne
  rationale: Le contexte vise la vie de la victime, mise en danger par les oppresseurs. « Vie » évite de donner au mot un sens exclusivement spirituel tout en maintenant le lien avec le sang innocent.
- issue: Sens judiciaire de יַרְשִׁיעוּ
  choice: déclarent coupable
  alternative: condamnent
  rationale: 'Le texte décrit le traitement injuste de l’innocent comme coupable. La traduction conserve la tension morale voulue: le sang est innocent, mais les oppresseurs le déclarent coupable.'
translation_notes:
  register: Français international moderne, naturel et digne. « Se liguent » garde l’idée d’une action hostile concertée; « le juste » conserve le singulier représentatif; « déclarent coupable » fait ressortir la dimension judiciaire de la seconde proposition.
