  source_fidelity: Le premier membre rend fidèlement יָגוֹדּוּ עַל (« se liguent contre »), ainsi que נֶפֶשׁ צַדִּיק (« la vie du juste »). Dans le second, יַרְשִׁיעוּ a bien une valeur judiciaire de déclaration de culpabilité. Toutefois, avec « sang innocent » comme objet poétique et métonymique, « déclarent coupable le sang innocent » est trop heurté en français courant. « Condamnent le sang innocent » conserve l’image et la tension de l’hébreu tout en exprimant naturellement l’action judiciaire hostile.
  naturalness: « Ils se liguent contre la vie du juste » est naturel, soutenu et approprié au registre psalmique. « Ils condamnent le sang innocent » est plus idiomatique et fluide que « déclarent coupable le sang innocent », sans atténuer la formulation volontairement saisissante du texte source.
  terminology: « Le juste », « vie », « sang innocent » et « condamnent » sont des choix exacts, modernes et interconfessionnels. Ils préservent le singulier représentatif de צַדִּיק et la portée concrète de נֶפֶשׁ, sans imposer une lecture doctrinale.
