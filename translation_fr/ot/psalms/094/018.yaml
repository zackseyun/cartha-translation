  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: fr
  text: 'Quand j’ai dit : « Mon pied vacille », ton amour fidèle, ô Éternel, m’a soutenu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Quand j’ai dit
  rationale: Dans ce témoignage rétrospectif, אִם introduit le moment où le psalmiste a reconnu son danger; « quand » rend naturellement cette valeur contextuelle en français.
- source_word: מָטָה רַגְלִי
  choice: Mon pied vacille
  rationale: מוט décrit un pied qui chancelle ou cède; « vacille » conserve l’image concrète et le danger imminent sans affirmer nécessairement une chute accomplie.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: Cette expression rend à la fois l’amour bienveillant et la fidélité relationnelle de חֶסֶד.
- source_word: יְהוָה
  choice: Éternel
  rationale: « Éternel » est une convention française digne et largement reconnaissable pour le tétragramme, tout en distinguant ici le nom divin d’un simple titre.
- source_word: יִסְעָדֵנִי
  choice: m’a soutenu
  rationale: Le verbe סעד exprime l’action de soutenir ou d’empêcher de tomber; le passé composé convient au témoignage rétrospectif en français.
theological_decisions:
- issue: Rapport entre le danger humain et l’intervention divine
  choice: Conserver l’image d’un pied qui vacille et d’un amour divin qui soutient
  alternative: Préciser que Dieu empêche toute chute spirituelle
  rationale: Le texte affirme le soutien de Dieu dans un danger réel, mais ne définit pas explicitement la nature de la chute; la traduction évite donc une interprétation doctrinale ajoutée.
- issue: Valeur de אִם
  choice: « Quand »
  alternative: « Si »
  rationale: '« Si » demeure grammaticalement possible, mais le parallélisme testimonial et la forme verbale favorisent ici une circonstance vécue: « quand j’ai dit ».'
translation_notes:
  register: Français international moderne, simple et digne. La métaphore corporelle est conservée, ainsi que l’adresse directe à Dieu. Aucun marqueur de note n’est requis.
