id: PSA.94.10
reference: Psalms 94:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/יֹסֵ֣ר גּ֭וֹיִם הֲ/לֹ֣א יוֹכִ֑יחַ הַֽ/מְלַמֵּ֖ד אָדָ֣ם דָּֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/010.yaml
  text: He who disciplines nations[a], will he not rebuke—he who teaches man knowledge?
translation:
  language: fr
  text: Celui qui corrige les nations ne reprendra-t-il pas — lui qui enseigne la connaissance à l’être humain[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « l’homme » ; le mot hébreu אָדָם est ici un singulier représentatif qui peut désigner l’être humain ou l’humanité.
    reason: Préciser la forme singulière et la portée générique du terme hébreu.
lexical_decisions:
- source_word: יֹסֵר
  choice: corrige
  rationale: Le verbe יסר exprime une discipline visant à redresser. « Corrige » restitue cette idée de correction exercée avec autorité sans la réduire à un simple châtiment.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Dans ce contexte psalmique, גּוֹיִם désigne largement les nations ou les peuples, et non spécifiquement les non-Juifs.
- source_word: יוֹכִיחַ
  choice: reprendra
  rationale: Le hifil de יכח exprime ici le reproche ou la réprimande. « Reprendre » conserve le parallélisme avec la correction du premier membre et permet de ne pas expliciter un complément absent de l’hébreu.
- source_word: הַמְלַמֵּד
  choice: lui qui enseigne
  rationale: Le participe substantivé décrit Dieu par son action. Cette tournure française préserve la structure descriptive et le mouvement rhétorique de l’hébreu.
- source_word: אָדָם
  choice: l’être humain
  rationale: אָדָם est ici un singulier représentatif désignant l’humain en général. « L’être humain » en conserve le singulier tout en exprimant clairement sa portée générique en français moderne.
- source_word: דָּעַת
  choice: la connaissance
  rationale: דָּעַת signifie directement « connaissance » ou, selon le contexte, « compréhension ». « La connaissance » est ici le complément le plus fidèle de « enseigne ».
- source_word: הֲ...הֲלֹא
  choice: ne …-t-il pas ?
  rationale: Les particules interrogatives forment une question rhétorique qui appelle une réponse affirmative. La tournure négative française en rend naturellement la force.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme ; l’humanité
  rationale: Le verset parle de l’enseignement que Dieu donne à l’humain en général, tout en employant un nom singulier. « L’être humain » préserve ce singulier représentatif sans donner au lecteur moderne l’impression que seuls les hommes de sexe masculin sont visés.
- issue: Complément implicite de יוֹכִיחַ
  choice: ne reprendra-t-il pas
  alternative: ne les reprendra-t-il pas
  rationale: L’hébreu n’exprime aucun complément après le verbe. La traduction conserve cette absence plutôt que d’identifier explicitement les nations comme objet de la réprimande, même si cette lecture est contextuellement possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le tiret maintient la tension de la question rhétorique et rattache la dernière proposition à celui qui corrige les nations, sans lisser la syntaxe poétique.
