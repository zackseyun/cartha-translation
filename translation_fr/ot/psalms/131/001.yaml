  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: fr
  text: 'Cantique des montées. De David[a].


    Yahweh, mon cœur ne s’élève pas avec orgueil,

    et mes yeux ne regardent pas de haut ;

    je ne m’engage pas dans des choses trop grandes,

    ni dans des choses trop merveilleuses pour moi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par David » ou « Pour David » ; dans les titres des psaumes, la construction hébraïque peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
  - marker: b
    text: Ou « qui me dépassent ». L’expression hébraïque désigne ce qui excède la place ou les capacités du locuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cantique des montées
  rationale: « Cantique » rend naturellement שִׁיר dans un titre psalmique, tandis que « des montées » conserve le sens concret et le titre traditionnel de cette collection sans imposer une interprétation précise de ces montées.
- source_word: לְדָוִד
  choice: De David
  rationale: Cette formulation française laisse ouvertes l’attribution, l’association et la dédicace que peut exprimer la préposition לְ dans les titres des psaumes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme nom propre plutôt que remplacé par un titre.
- source_word: גָבַהּ לִבִּי
  choice: mon cœur ne s’élève pas avec orgueil
  rationale: La traduction conserve l’image hébraïque du cœur qui s’élève tout en explicitant avec naturel sa portée morale dans ce contexte.
- source_word: רָמוּ עֵינַי
  choice: mes yeux ne regardent pas de haut
  rationale: Cette expression française naturelle préserve l’image du regard élevé et en communique la nuance d’arrogance.
- source_word: הִלַּכְתִּי
  choice: je ne m’engage pas
  rationale: Dans cette construction, le verbe de mouvement décrit le fait de s’aventurer dans un domaine ou de s’en occuper. « Je ne m’engage pas » restitue cette idée sans produire un calque obscur.
- source_word: בִּגְדֹלוֹת
  choice: dans des affaires trop grandes
  rationale: Le pluriel substantivé désigne de grandes matières ou entreprises. « Affaires » convient au contexte, et « trop » exprime la mesure dépassée indiquée par מִמֶּנִּי.
- source_word: וּבְנִפְלָאוֹת
  choice: ni dans des choses trop merveilleuses
  rationale: « Merveilleuses » conserve la valeur de ce qui est extraordinaire ou prodigieux, sans réduire le terme à ce qui serait seulement difficile.
- source_word: מִמֶּנִּי
  choice: pour moi
  rationale: La formule s’associe naturellement à « trop grandes » et « trop merveilleuses » et exprime ce qui excède la mesure ou la capacité du locuteur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme ; sa transcription préserve le caractère personnel du nom divin au lieu de lui substituer un titre.
- issue: Portée de לְדָוִד dans le titre
  choice: De David
  alternative: Par David / Pour David
  rationale: La préposition hébraïque ne permet pas de trancher avec certitude entre l’auteur, l’association et la dédicace. « De David » maintient cette ouverture.
- issue: Nature des réalités décrites par גְדֹלוֹת et נִפְלָאוֹת
  choice: des affaires trop grandes, ni des choses trop merveilleuses pour moi
  alternative: de grandes choses ni des merveilles qui me dépassent
  rationale: Le texte peut viser des matières, des entreprises ou des réalités excédant la place ou les capacités du psalmiste. Le rendu retenu préserve cette largeur sans spécifier une catégorie théologique.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme poétique est conservé en quatre lignes. Les images du cœur qui s’élève et du regard hautain restent perceptibles, tandis que « je ne m’engage pas » évite un calque peu naturel de l’hébreu « marcher ». Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
