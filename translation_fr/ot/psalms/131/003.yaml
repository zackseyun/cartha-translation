  text: יַחֵ֣ל יִ֭שְׂרָאֵל אֶל יְהוָ֑ה מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: fr
  text: 'Israël, mets ton espérance en Yahweh,

    dès maintenant et pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחֵל
  choice: mets ton espérance
  rationale: La forme imperfective de יחל a ici une valeur exhortative. « Mets ton espérance » exprime naturellement en français l’attente confiante, sans la réduire au simple fait d’attendre.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre du peuple auquel s’adresse l’exhortation.
- source_word: אֶל
  choice: en
  rationale: Avec יחל, la préposition marque la personne vers laquelle se porte l’espérance ; en français, « mettre son espérance en » est idiomatique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui conserve ici sa valeur de nom propre plutôt que de lui substituer un titre.
- source_word: מֵעַתָּה
  choice: dès maintenant
  rationale: Rend clairement le point de départ temporel et s’accorde naturellement avec la suite.
- source_word: וְעַד עוֹלָם
  choice: et pour toujours
  rationale: Expression française courante et digne qui rend la durée indéfinie ou perpétuelle de l’hébreu.
theological_decisions:
- issue: Valeur exhortative de יַחֵל et relation syntaxique avec יִשְׂרָאֵל
  choice: 'Interpellation directe : « Israël, mets ton espérance »'
  alternative: 'Jussif à la troisième personne : « Qu’Israël mette son espérance »'
  rationale: L’hébreu permet de représenter cette exhortation soit comme un souhait ou ordre à la troisième personne, soit comme une adresse directe au peuple. L’adresse directe est naturelle en français et conserve la force de l’appel communautaire, sans modifier son contenu théologique.
translation_notes:
  register: Français international moderne, clair et digne. L’expression « mets ton espérance » garde la dimension de confiance active ; le parallélisme temporel est rendu par « dès maintenant et pour toujours ».
