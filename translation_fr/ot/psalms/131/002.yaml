- from: Oui, j’ai apaisé et fait taire mon âme[a], comme un enfant sevré auprès de sa mère[b] ; comme un enfant sevré, mon âme repose en moi[c].
  to: Certes, j’ai apaisé et rendu silencieuse mon âme[a], comme un enfant sevré auprès de sa mère[b] ; comme un enfant sevré, ainsi est mon âme en moi[c].
  rationale: La révision conserve le parallélisme, l’assertion emphatique et l’image maternelle, tout en retirant « repose », qui explicite au-delà de ce que formule la seconde proposition hébraïque. Elle maintient la difficulté textuelle dans une note et n’impose pas une interprétation doctrinale de « mon âme ».
