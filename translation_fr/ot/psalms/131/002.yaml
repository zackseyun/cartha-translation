  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: fr
  text: Certes, j’ai apaisé et rendu silencieuse mon âme[a], comme un enfant sevré auprès de sa mère[b] ; comme un enfant sevré, ainsi est mon âme en moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si je n’ai pas mis mon âme à niveau et ne l’ai pas rendue silencieuse ». L’ouverture hébraïque est une formule emphatique, rendue ici par « Certes ».'
    reason: lexical_alternative
  - marker: b
    text: L’image est celle d’un petit enfant qui, n’exigeant plus d’être allaité, demeure paisiblement auprès de sa mère.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « comme l’enfant sevré, sur moi est mon âme ». La construction hébraïque est difficile ; « ainsi est mon âme en moi » en donne un sens probable dans un français naturel.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Oui
  rationale: La tournure hébraïque est ici une affirmation emphatique de type asseveratif, non une condition ordinaire. « Oui » la rend naturellement en français tout en gardant sa force.
- source_word: שִׁוִּיתִי
  choice: j’ai apaisé
  rationale: Dans ce contexte, le verbe évoque l’action de rendre égal, posé ou calme. « Apaisé » convient à l’état intérieur décrit et prépare le parallèle avec « fait taire ».
- source_word: וְדוֹמַמְתִּי
  choice: et fait taire
  rationale: La forme causative exprime l’action de rendre silencieux ou immobile. « Fait taire » conserve cette action délibérée sans suggérer seulement un état passif.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש désigne ici la personne intérieure, les désirs et l’affectivité du psalmiste. « Mon âme » reste naturel dans le registre poétique biblique français sans imposer un dualisme technique.
- source_word: כְּגָמֻל
  choice: comme un enfant sevré
  rationale: Le participe désigne celui qui a été sevré. L’ajout explicite d’« enfant » rend l’image immédiatement compréhensible.
- source_word: עֲלֵי אִמּוֹ
  choice: auprès de sa mère
  rationale: על exprime ici vraisemblablement un contact ou une proximité étroite. « Auprès de sa mère » restitue l’image avec naturel sans imposer la position littérale « sur ».
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: comme un enfant sevré, mon âme repose en moi
  rationale: L’hébreu dit littéralement que l’âme est « sur moi », tournure difficile en français. « Repose en moi » explicite avec retenue l’état paisible suggéré par la comparaison, tandis qu’une note conserve la formulation plus littérale.
theological_decisions:
- issue: Portée anthropologique de נַפְשִׁי
  choice: « mon âme », au sens de la personne intérieure
  alternative: « mon être » ou « moi-même »
  rationale: Le verset décrit la maîtrise paisible des désirs et de la vie intérieure. Le terme traditionnel « âme » préserve la profondeur poétique sans affirmer une doctrine précise de la constitution humaine.
- issue: Nature de l’image de l’enfant sevré
  choice: Un enfant désormais apaisé qui demeure auprès de sa mère
  alternative: Un enfant venant d’être privé du sein et traversant la détresse du sevrage
  rationale: Le contexte immédiat de calme et de silence favorise l’image d’une confiance sans exigence, mais le texte ne développe pas explicitement le processus émotionnel du sevrage.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme hébreu est maintenu, avec une légère explicitation dans la dernière proposition afin d’éviter une formulation française obscure. Les verbes actifs soulignent la discipline intérieure du psalmiste.
