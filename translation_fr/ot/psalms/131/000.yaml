translation:
  language: fr
  text: 'Chant des montées. De David[a].


    SEIGNEUR, mon cœur ne s’est pas élevé,

    mes yeux ne se sont pas levés avec hauteur ;

    je ne me suis pas mêlé de grandes choses,

    ni de choses trop merveilleuses pour moi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par David » ou « Pour David » ; la suscription hébraïque peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
  - marker: b
    text: 'L’expression hébraïque désigne des réalités qui excèdent la place ou les capacités du locuteur ; on peut aussi traduire : « qui me dépassent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend naturellement le titre traditionnel tout en conservant l’image hébraïque des « montées », dont le contexte précis peut renvoyer aux pèlerinages ou à un usage cultuel.
- source_word: יְהוָה
  choice: SEIGNEUR
  rationale: Suit l’usage français courant qui représente le tétragramme par « SEIGNEUR » en petites capitales, ici transcrit en capitales.
- source_word: לֹא גָבַהּ לִבִּי
  choice: mon cœur ne s’est pas élevé
  rationale: Conserve l’image hébraïque de l’élévation du cœur, qui exprime ici l’orgueil, sans la réduire à une simple paraphrase.
- source_word: וְלֹא רָמוּ עֵינַי
  choice: mes yeux ne se sont pas portés trop haut
  rationale: Maintient l’image des yeux élevés tout en donnant en français une formulation compréhensible évoquant l’ambition ou l’arrogance.
- source_word: וְלֹא הִלַּכְתִּי
  choice: je ne me suis pas engagé
  rationale: Le verbe signifie littéralement « marcher » ; dans ce contexte, il décrit le fait de poursuivre ou de s’occuper de certaines affaires.
- source_word: וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: ni dans des merveilles qui me dépassent
  rationale: « Merveilles » préserve la force de נִפְלָאוֹת, tandis que « qui me dépassent » exprime des réalités excédant la place ou les capacités du psalmiste.
theological_decisions:
- issue: Sens de la préposition לְ dans לְדָוִד
  choice: De David
  alternative: Par David ; pour David
  rationale: La suscription peut indiquer l’auteur, l’association ou la dédicace. La traduction traditionnelle « De David » garde en français une certaine souplesse, et la note signale les autres possibilités.
- issue: Nature des « grandes choses » et des « merveilles »
  choice: Conserver des termes généraux
  alternative: Les expliciter comme des ambitions, des mystères divins ou des responsabilités trop élevées
  rationale: L’hébreu ne précise pas leur nature. La traduction préserve donc l’ambiguïté et n’impose aucune interprétation théologique particulière.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébraïque et les images du cœur et des yeux élevés sont conservés, avec une formulation suffisamment naturelle pour la lecture publique.
