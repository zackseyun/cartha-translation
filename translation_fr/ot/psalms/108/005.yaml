  yaml_path: translation/ot/psalms/108/005.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
translation:
  language: fr
  text: Élève-toi au-dessus des cieux, ô Dieu[a], et que ta gloire soit sur toute la terre[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sois exalté au-dessus des cieux, ô Dieu. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et sur toute la terre, ta gloire »; le verbe est sous-entendu dans le parallélisme poétique.'
