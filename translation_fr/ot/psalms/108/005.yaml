lexical_decisions:
- source_word: רוּמָה
  choice: Élève-toi
  rationale: L’impératif de רום peut exprimer l’élévation spatiale ou l’exaltation. « Élève-toi » conserve directement l’image et la forme d’adresse à Dieu, tout en laissant ouverte la nuance honorifique.
- source_word: עַל שָׁמַיִם
  choice: au-dessus des cieux
  rationale: La préposition עַל, après un verbe d’élévation, indique ici la position supérieure; « les cieux » rend le pluriel hébreu dans un registre poétique naturel.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô » marque clairement l’adresse directe dans un registre français digne et poétique.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: et que… sur toute la terre
  rationale: Le second membre est coordonné au premier et ne comporte pas de verbe exprimé. La construction française fait entendre la portée souhaitée sur la terre entière.
- source_word: כְּבוֹדֶךָ
  choice: ta gloire
  rationale: Dans ce contexte doxologique, כָּבוֹד désigne la gloire ou majesté divine; « gloire » est précis, courant et traditionnel sans ajouter de contenu doctrinal.
theological_decisions:
- issue: Valeur de רוּמָה
  choice: Élève-toi
  alternative: Sois exalté
  rationale: La forme hébraïque est active, mais peut, dans la louange, appeler à la manifestation de l’exaltation de Dieu. Le choix principal garde la forme active et l’ambiguïté entre élévation et exaltation; la note signale l’autre lecture naturelle.
- issue: Verbe sous-entendu dans le second membre
  choice: et que ta gloire s’étende sur toute la terre
  alternative: et ta gloire au-dessus de toute la terre
  rationale: L’hébreu est littéralement verbless et dépend du parallélisme avec l’impératif initial. Le français explicite la valeur de souhait sans en faire une simple affirmation indicative; une note conserve la forme elliptique de l’original.
translation_notes:
  register: Français moderne, international et poétique. L’apostrophe « ô Dieu » convient au registre des psaumes. Le point d’exclamation porte sur l’ensemble de la prière. Les notes préservent à la fois l’alternative lexicale de רום et l’ellipse verbale du second membre.
