source:
  edition: WLC
  text: לִ֤/י גִלְעָ֨ד לִ֤/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹקְקִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: fr
  text: Galaad est à moi, Manassé est à moi ; Éphraïm est la forteresse de ma tête[a] ; Juda est mon bâton de commandement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Éphraïm est la forteresse de ma tête », image poétique évoquant la force protectrice.'
    reason: clarification_of_poetic_image
  - marker: b
    text: 'Ou : « Juda est mon législateur » ; le terme hébreu peut désigner celui qui décrète ou le bâton symbolisant son autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: est à moi
  rationale: La préposition ל avec le suffixe de première personne exprime ici la possession. « Est à moi » est naturel en français et conserve la force de la déclaration territoriale et royale.
- source_word: גִלְעָד
  choice: Galaad
  rationale: Nom géographique rendu selon la forme française biblique courante.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Nom tribal et régional rendu selon la forme française courante.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Nom tribal rendu selon la forme française courante.
- source_word: מָעוֹז
  choice: forteresse
  rationale: Le terme désigne un lieu ou un moyen de force et de protection. « Forteresse » maintient l'image militaire concrète.
- source_word: רֹאשִׁי
  choice: ma tête
  rationale: Le texte hébreu dit littéralement « ma tête ». Cette formulation conserve l'image poétique sans la remplacer par l'interprétation « casque ».
- source_word: יְהוּדָה
  choice: Juda
  rationale: Nom tribal rendu selon la forme française traditionnelle et courante.
- source_word: מְחֹקְקִי
  choice: mon bâton de commandement
  rationale: Le nom dérivé de la racine liée au décret peut désigner celui qui édicte ou le bâton emblématique du commandement. « Bâton de commandement » préserve ici l'image concrète et royale sans employer le terme hébreu spécifique habituellement rendu par « sceptre ».
theological_decisions:
- issue: Image de l'autorité royale associée à Juda dans מְחֹקְקִי
  choice: Juda est mon bâton de commandement
  alternative: Juda est mon législateur
  rationale: Le contexte présente les tribus et régions comme possessions ou instruments de la royauté divine. Le rendu choisi maintient l'image d'autorité, tandis que la note conserve l'autre analyse lexicale possible sans décider abusivement que Juda légifère littéralement pour Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme concis de l'hébreu est conservé, de même que l'image inhabituelle de la « forteresse de ma tête ». Les notes rendent explicites les ambiguïtés lexicales réelles sans imposer une lecture confessionnelle.
