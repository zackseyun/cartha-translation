id: PSA.108.3
reference: Psalms 108:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים יְהוָ֑ה וַ֝/אֲזַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: fr
  text: 'Je te rendrai grâce parmi les peuples[a], Yahweh,

    et je chanterai tes louanges parmi les nations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux termes parallèles, « peuples » et « nations », qui donnent à cette louange une portée internationale.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Je te rendrai grâce
  rationale: Dans le contexte cultuel des psaumes, le hifil de ידה exprime l’action de remercier ou de louer en proclamant les bienfaits reçus. « Rendre grâce » est naturel en français et conserve cette nuance de reconnaissance adressée à Dieu.
- source_word: בָעַמִּים
  choice: parmi les peuples
  rationale: Le pluriel de עַם désigne ici les différents peuples. « Parmi » rend la présence du psalmiste au sein d’un auditoire international.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie le nom divin יהוה. Sa translittération préserve le nom propre plutôt que de lui substituer un titre.
- source_word: וַאֲזַמֶּרְךָ
  choice: et je chanterai tes louanges
  rationale: Au piel, זמר désigne généralement le fait de chanter ou de faire de la musique en l’honneur de Dieu. Cette formulation exprime à la fois le chant et sa fonction de louange.
- source_word: בַּל אֻמִּים
  choice: parmi les nations
  rationale: Dans ce vers poétique, בַּל fonctionne comme une préposition parallèle à בָ־ dans le premier membre, tandis que אֻמִּים désigne des peuples ou nations. Le choix conserve le parallélisme tout en variant le vocabulaire.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset contient explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente directement sans le remplacer par le titre traditionnel « le SEIGNEUR ».
- issue: Nuance de ידה dans la première proposition
  choice: rendre grâce
  alternative: louer
  rationale: Les deux sens sont possibles dans la poésie cultuelle. « Rendre grâce » maintient la nuance de reconnaissance, tandis que le second membre explicite déjà la louange chantée; la tension lexicale n’est pas effacée.
translation_notes:
  register: Français international moderne, sobre et poétique. Le futur reprend l’engagement exprimé par les formes verbales hébraïques; la disposition en deux lignes fait ressortir le parallélisme.
