source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶעְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: fr
  text: 'Dieu a parlé dans sa sainteté[a] : « J’exulterai[b] ; je répartirai Sichem et je mesurerai la vallée de Soukkoth. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans son lieu saint » ou « par sa sainteté ». L’expression hébraïque peut désigner soit la sainteté de Dieu, soit un lieu saint qui lui est associé.
    reason: lexical_alternative
  - marker: b
    text: Ou « je me réjouirai ». Le verbe hébreu exprime une joie débordante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le verbe singulier désigne ici le Dieu d’Israël.
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le parfait présente une parole divine accomplie qui demeure pertinente dans le psaume.
- source_word: בְּקָדְשׁוֹ
  choice: dans sa sainteté
  rationale: Cette formulation conserve le sens attributif probable sans effacer l’ambiguïté possible avec le sanctuaire.
- source_word: אֶעְלֹזָה
  choice: je vais exulter
  rationale: Le verbe exprime une joie intense et triomphante ; « exulter » en garde la force poétique.
- source_word: אֲחַלְּקָה
  choice: je partagerai
  rationale: Dans ce contexte territorial, le verbe évoque la division et la répartition d’un territoire.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue du nom géographique.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: la vallée de Soukkoth
  rationale: Le rapport construit entre la vallée et Soukkoth est rendu naturellement en français.
- source_word: אֲמַדֵּד
  choice: je mesurerai
  rationale: Le piel décrit l’action de mesurer le territoire, avec une possible nuance d’attribution que le contexte laisse percevoir.
theological_decisions:
- issue: Locuteur et portée de la citation
  choice: Les verbes à la première personne sont compris comme les paroles de Dieu affirmant son autorité souveraine sur le territoire.
  alternative: Le psalmiste reprend la parole après avoir annoncé que Dieu a parlé.
  rationale: Après « Dieu a parlé », la syntaxe et le parallèle du Psaume 60 favorisent la poursuite d’un discours divin direct, tout en laissant l’alternative syntaxiquement possible.
translation_notes:
  register: Français international actuel, digne et poétique. Le futur proche « je vais exulter » rend la forme cohortative, tandis que les futurs simples maintiennent la solennité des déclarations territoriales. Les marqueurs de notes figurent tous dans le texte.
