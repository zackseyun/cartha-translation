  text: נָכ֣וֹן לִבִּ֣/י אֱלֹהִ֑ים אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה אַף כְּבוֹדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/001.yaml
  text: My heart is steadfast[a], O God; I will sing and make music, even with my glory.
translation:
  language: fr
  text: Mon cœur est ferme, ô Dieu ! Je chanterai et jouerai de la musique, avec ma gloire même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout mon être » ; l’hébreu dit littéralement « ma gloire », expression poétique qui peut désigner l’être intérieur du psalmiste, voire sa langue comme instrument de louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: ferme
  rationale: Le terme exprime ce qui est établi, stable ou résolu. « Ferme » convient au cœur déterminé à louer Dieu et reste naturel en français.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Dans l’usage hébreu, le cœur désigne notamment l’être intérieur, la volonté et les sentiments. La traduction littérale est claire en français.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est ici une apostrophe. « Ô Dieu » marque directement le vocatif dans un registre poétique digne.
- source_word: אָשִׁירָה
  choice: je chanterai
  rationale: La forme cohortative exprime une volonté résolue. Le futur français rend naturellement cet engagement.
- source_word: וַאֲזַמְּרָה
  choice: et jouerai de la musique
  rationale: Le verbe זמר au piel peut évoquer la musique ou le chant de louange. Cette formulation préserve le parallélisme sans répéter simplement « chanter ».
- source_word: אַף
  choice: même avec
  rationale: אַף apporte ici une extension emphatique. Dans la construction retenue, « même avec » introduit la formule poétique surprenante qui suit.
- source_word: כְּבוֹדִי
  choice: ma gloire
  rationale: Le sens lexical direct est « ma gloire ». Son emploi poétique peut désigner l’être intérieur ou la langue, mais le texte principal conserve l’image et son ambiguïté.
theological_decisions:
- issue: Interprétation de כְּבוֹדִי dans le langage poétique de la louange
  choice: ma gloire
  alternative: tout mon être ; mon âme ; ma langue
  rationale: L’expression hébraïque est métaphorique et son référent exact reste discuté. La traduction conserve donc l’image littérale dans le texte et présente les principales interprétations en note, sans en imposer une.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif « ô Dieu » convient au genre psalmique sans rendre l’ensemble archaïque. L’étrangeté maîtrisée de « ma gloire » préserve l’ambiguïté de l’hébreu.
