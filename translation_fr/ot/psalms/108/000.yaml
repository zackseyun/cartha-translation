lexical_decisions:
- source_word: שִׁיר
  choice: chant
  rationale: Le nom désigne largement un chant. Dans cette suscription, « chant » conserve la distinction avec מִזְמוֹר sans préciser indûment qu’il s’agit d’un chant de louange.
- source_word: מִזְמוֹר
  choice: psaume
  rationale: Dans les suscriptions des Psaumes, ce terme désigne couramment une composition lyrique à caractère musical ; « psaume » est à la fois exact, établi et naturel en français.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut signaler l’auteur, le destinataire, l’appartenance ou une association. En français, « de David » conserve mieux cette ouverture que « par David » ou « pour David ».
theological_decisions:
- issue: Sens de la suscription davidique
  choice: Conserver la formulation ambiguë « de David ».
  alternative: « par David » ou « pour David »
  rationale: L’hébreu ne tranche pas nécessairement entre attribution d’auteur, dédicace et association ; la traduction ne doit pas imposer une conclusion historique ou théologique plus précise.
translation_notes:
  register: Formulation brève et solennelle, conforme au style d’une suscription. La juxtaposition « Chant, psaume » préserve les deux désignations hébraïques sans les fondre ni les expliquer dans le texte principal.
