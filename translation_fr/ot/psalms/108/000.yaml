  text: A song, a psalm of David[a].
translation:
  language: fr
  text: Chant, psaume de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; l’hébreu peut indiquer l’auteur, la dédicace ou une association.
