  text: ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/002.yaml
  text: Awake[a], harp and lyre; I will awaken the dawn.
translation:
  language: fr
  text: Réveillez-vous, harpe et lyre ! Je réveillerai l’aurore.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je réveillerai l’aurore ». Image poétique : le psalmiste se lève avant le jour pour louer Dieu, comme s’il éveillait lui-même l’aurore.'
    reason: clarification_poétique
lexical_decisions:
- source_word: עוּרָה
  choice: Réveillez-vous
  rationale: L’impératif adresse une sommation poétique aux deux instruments coordonnés. Le pluriel français s’accorde naturellement avec « harpe et lyre », malgré la forme hébraïque singulière.
- source_word: הַנֵּבֶל
  choice: harpe
  rationale: Le terme désigne un instrument à cordes. « Harpe » est l’équivalent moderne le plus accessible, sans l’archaïsme de « psaltérion ».
- source_word: וְכִנּוֹר
  choice: et lyre
  rationale: « Lyre » distingue cet instrument du נבל et conserve le parallélisme entre deux instruments à cordes.
- source_word: אָעִירָה
  choice: Je réveillerai
  rationale: La forme à valeur cohortative exprime la résolution du psalmiste. La répétition de « réveiller » reproduit celle de la racine עור dans l’hébreu.
- source_word: שָּׁחַר
  choice: l’aurore
  rationale: « Aurore » rend l’apparition du jour dans une langue poétique, actuelle et digne, tout en maintenant la personnification saisissante de l’hébreu.
theological_decisions: []
