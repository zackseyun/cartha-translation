  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עֲלֵֽי פְ֝לֶ֗שֶׁת אֶתְרוֹעָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/009.yaml
  text: Moab is my washbasin[a]; on Edom I throw my sandal[c][b]; over Philistia I shout in triumph.
translation:
  language: fr
  text: Moab est le bassin où je me lave[a] ; sur Édom, je jette ma sandale[b] ; sur la Philistie, je pousse un cri de triomphe[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon récipient de lavage ». L’image hébraïque est celle d’un récipient servant au lavage ; elle évoque l’humiliation ou la soumission de Moab.
    reason: lexical_alternative
  - marker: b
    text: Ou « je lance ma chaussure ». Ce geste semble symboliser la domination sur Édom ou la revendication de ce territoire.
    reason: lexical_alternative
  - marker: c
    text: Ou « je pousse un cri sur la Philistie » ou « je lance un cri de guerre sur la Philistie ». Le verbe hébreu peut désigner un cri joyeux ou guerrier.
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: mon bassin pour me laver
  rationale: סִיר désigne un récipient ou bassin, et רַחְצִי le rattache au lavage. Cette formulation française conserve l’image concrète tout en restant claire et actuelle.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: je jette ma sandale
  rationale: Le verbe שלך au hifil signifie « jeter » ou « lancer », et נַעַל désigne une chaussure, ici naturellement une sandale dans le contexte ancien. L’image est conservée sans en imposer une interprétation dans le texte.
- source_word: עַל / עֲלֵי
  choice: sur
  rationale: La préposition עַל peut exprimer une relation spatiale ou hostile. « Sur » préserve cette souplesse dans les deux propositions.
- source_word: אֶתְרוֹעָע
  choice: je pousse un cri de triomphe
  rationale: Cette forme verbale désigne le fait de pousser un cri, souvent joyeux ou guerrier. « Cri de triomphe » rend le contexte victorieux sans réduire le terme à un cri de guerre technique.
- source_word: פְלֶשֶׁת
  choice: la Philistie
  rationale: Le nom hébreu désigne le territoire ou pays, plutôt que directement ses habitants.
- source_word: מוֹאָב / אֱדוֹם
  choice: Moab / Édom
  rationale: Ces formes françaises usuelles rendent les noms propres hébreux.
theological_decisions:
- issue: Images métaphoriques de domination sur les nations ennemies
  choice: Conserver les images concrètes du bassin, de la sandale jetée et du cri de triomphe.
  alternative: Paraphraser explicitement en termes d’humiliation, de prise de possession et de victoire politique.
  rationale: La poésie exprime la soumission des nations par des images fortes dont le sens exact ne doit pas être aplati ni surinterprété dans le corps du texte.
translation_notes:
  register: Français international moderne, poétique et digne. La structure en trois membres ainsi que les métaphores concrètes de l’hébreu sont maintenues ; les notes signalent les principales nuances lexicales sans résoudre l’ambiguïté poétique.
