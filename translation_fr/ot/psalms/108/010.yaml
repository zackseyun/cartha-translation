source:
  edition: WLC
  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מִבְצָ֑ר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/010.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: fr
  text: Qui me conduira jusqu’à la ville fortifiée ?[b] Qui me mènera jusqu’en Édom ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le second verbe est formellement à l’accompli en hébreu : on pourrait traduire « Qui m’a mené jusqu’en Édom ? » Dans le parallélisme avec le premier membre, il prend probablement ici une valeur future.'
    reason: lexical_alternative
  - marker: b
    text: « La ville fortifiée » désigne peut-être une place forte précise d’Édom, souvent identifiée traditionnellement à Séla/Pétra, mais le texte hébreu ne la nomme pas.
    reason: cultural_note
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit dans chaque membre une question rhétorique ; « Qui » est direct et naturel en français.
- source_word: יֹבִלֵנִי
  choice: me conduira
  rationale: Le hifil de יבל exprime l’idée de faire aller, conduire ou amener vers une destination. « Me conduira » convient au mouvement vers la ville fortifiée.
- source_word: עִיר מִבְצָר
  choice: la ville fortifiée
  rationale: La construction signifie littéralement une ville de fortification, donc une « ville fortifiée ». L’article défini reflète le caractère vraisemblablement déterminé de cette place forte dans le contexte.
- source_word: נָחַנִי
  choice: me mènera
  rationale: Le verbe signifie conduire ou guider. Bien que sa forme soit un accompli, le parallélisme poétique avec יֹבִלֵנִי et le contexte prospectif favorisent ici une valeur future, sans gommer la difficulté textuelle signalée en note.
- source_word: עַד אֱדוֹם
  choice: jusqu’en Édom
  rationale: עַד marque la limite atteinte ; « jusqu’en Édom » en rend la nuance tout en restant idiomatique avec un nom de région.
theological_decisions:
- issue: Valeur temporelle de נָחַנִי
  choice: 'futur : « me mènera »'
  alternative: 'accompli : « m’a mené »'
  rationale: Le second membre est parallèle à la question future du premier et appartient à une demande orientée vers l’avenir. La forme accomplie demeure toutefois une réelle donnée de l’hébreu, indiquée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La variation « conduira / mènera » préserve le parallélisme sans lourde répétition. « Jusqu’à la ville » et « jusqu’en Édom » rendent naturellement l’orientation et la limite du déplacement.
