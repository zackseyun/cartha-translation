  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: fr
  text: Afin que ceux que tu aimes soient délivrés[a], sauve-les par ta main droite et réponds-moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient secourus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Afin que
  rationale: Introduit naturellement en français le but ou le résultat visé, tout en conservant le lien avec le contexte.
- source_word: יֵחָלְצוּן
  choice: soient délivrés
  rationale: Le nifal de חלץ exprime ici le fait d’être arraché au danger ou délivré. « Délivrés » convient au registre de la prière et préserve la portée salvatrice du terme.
- source_word: יְדִידֶיךָ
  choice: ceux que tu aimes
  rationale: Rend clairement le pluriel et l’affection exprimée par ידיד dans un français moderne, naturel et digne.
- source_word: הוֹשִׁיעָה
  choice: sauve-les
  rationale: L’impératif de ישׁע signifie « sauve ». Le pronom « les », implicite en hébreu mais requis pour une formulation française naturelle, renvoie à « ceux que tu aimes ».
- source_word: יְמִינְךָ
  choice: par ta main droite
  rationale: « Par » exprime le moyen et conserve l’image biblique de la main droite comme manifestation de la puissance divine.
- source_word: וַעֲנֵנִי
  choice: et réponds-moi
  rationale: L’impératif porte un suffixe de première personne du singulier. La traduction maintient donc le passage des bénéficiaires pluriels au psalmiste singulier.
theological_decisions:
- issue: Passage des bénéficiaires au pluriel au suppliant singulier
  choice: « ceux que tu aimes » … « réponds-moi »
  alternative: 'Harmoniser au pluriel : « réponds-nous »'
  rationale: Le texte massorétique passe explicitement du pluriel יְדִידֶיךָ au suffixe singulier de וַעֲנֵנִי. Cette tension doit être conservée plutôt que résolue.
translation_notes:
  register: Français international moderne, accessible et digne. La formulation conserve l’image de la main droite et le changement intentionnel du pluriel au singulier.
