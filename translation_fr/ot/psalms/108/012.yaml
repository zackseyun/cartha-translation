source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: fr
  text: Donne-nous du secours contre l’adversaire[a], car le secours humain est vain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « face à la détresse », si צַר désigne ici une situation pénible plutôt qu’un adversaire.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le salut de l’être humain est vain ». Il s’agit ici du secours humain en général.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  choice: Accorde
  rationale: Dans cette supplication adressée à Dieu, l’impératif idiomatique demande qu’il procure son aide. « Accorde » convient au registre actuel et digne de la prière.
- source_word: לָנוּ
  choice: nous
  rationale: Marque les bénéficiaires de l’aide; la construction française naturelle est « Accorde-nous ».
- source_word: עֶזְרַת
  choice: ton secours
  rationale: Le nom désigne l’aide apportée face au danger. « Secours » est naturel dans une prière et fait écho au salut du second membre. Le possessif explicite en français la source divine demandée sans changer le référent contextuel.
- source_word: מִצָּר
  choice: contre l’adversaire
  rationale: צַר peut désigner soit la détresse, soit un adversaire. Le contexte militaire du psaume favorise le sens personnel; après « secours », מִן se rend idiomatiquement par « contre ».
- source_word: וְשָׁוְא
  choice: car ... est illusoire
  rationale: Le contexte donne à la coordination une portée explicative. שָׁוְא évoque ce qui est vide, vain ou sans efficacité; « illusoire » exprime ici le caractère trompeur et inefficace du secours humain.
- source_word: תְּשׁוּעַת
  choice: le salut qui vient de
  rationale: Le terme peut désigner salut, délivrance ou victoire. « Salut » maintient le lien lexical, tandis que « qui vient de » rend naturellement la relation construite avec אָדָם.
- source_word: אָדָם
  choice: l’être humain
  rationale: 'Le nom a ici un sens générique: il oppose toute capacité humaine au secours divin. « L’être humain » conserve le singulier collectif sans suggérer uniquement les hommes de sexe masculin.'
theological_decisions:
- issue: Portée générique de אָדָם dans l’affirmation sur l’insuffisance humaine
  choice: l’être humain
  alternative: l’homme / l’humanité
  rationale: Le mot hébreu est au singulier et générique. « L’être humain » communique cette portée en français moderne sans ajouter de distinction de sexe ni transformer le vers en abstraction collective.
- issue: Sens contextuel de תְּשׁוּעָה
  choice: salut
  alternative: délivrance / victoire
  rationale: Le contexte militaire permet « délivrance » ou « victoire », mais « salut » préserve la largeur sémantique du terme et la tension entre secours humain et secours divin, sans lui imposer un sens doctrinal spécialisé.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste concise et conserve le parallélisme entre le secours demandé à Dieu et l’inefficacité du salut d’origine humaine. Les deux ambiguïtés principales, צַר (« adversaire » ou « détresse ») et la formulation condensée du second membre, sont signalées en notes.
