- from: Accorde-nous ton secours contre l’adversaire[a], car le salut qui vient de l’être humain est illusoire[b].
  to: Donne-nous du secours contre l’adversaire[a], car le secours humain est vain[b].
  rationale: La révision supprime le possessif ajouté, conserve l’ambiguïté de צַר en note, et rend la formule nominale finale de façon plus directe et naturelle. « Secours humain » exprime dans le contexte la valeur de תְּשׁוּעָה sans imposer au mot « salut » une lecture doctrinale spécialisée.
