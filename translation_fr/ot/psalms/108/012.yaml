review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’ensemble est bien compris : une demande de secours face à un adversaire (ou à la détresse), suivie de l’affirmation que le secours humain est vain. Toutefois, « ton secours » introduit un possessif absent de l’hébreu. Bien que le destinataire divin soit implicite dans le psaume, il est préférable de ne pas l’expliciter dans ce verset. « Le salut qui vient de l’être humain » transforme aussi inutilement la construction concise « salut/secours de l’humain » en une provenance explicitée.'
  naturalness: La formulation est globalement digne et naturelle, mais « le salut qui vient de l’être humain » est plus pesant et moins poétique que nécessaire. « Le secours humain est vain » est idiomatique, concis et convient au parallélisme du verset.
  terminology: « Secours » rend bien עֶזְרָה et, dans le second membre, permet de rendre contextuellement תְּשׁוּעָה sans évoquer prioritairement le salut sotériologique. « Vain » est un équivalent direct et approprié de שָׁוְא. « Adversaire » est un bon choix principal pour צַר; l’alternative impersonnelle doit rester en note.
  issues:
  - severity: low
    issue: Ajout de « ton » dans « ton secours »
    rationale: Le possessif n’est pas exprimé dans le texte hébreu. Le contexte permet de comprendre que le secours est demandé à Dieu, mais la traduction peut conserver l’implicite du source.
  - severity: medium
    issue: Reformulation explicative de la relation en « le salut qui vient de l’être humain »
    rationale: Cette expression alourdit et interprète la construction nominale hébraïque. « Le secours humain » restitue plus directement le contraste entre l’aide demandée et l’insuffisance de l’aide humaine.
  revised_text: Donne-nous du secours contre l’adversaire[a], car le secours humain est vain[b].
