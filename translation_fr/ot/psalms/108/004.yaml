id: PSA.108.4
reference: Psalms 108:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: fr
  text: Car ton amour fidèle s’élève plus haut que les cieux, et ta fidélité[a] atteint jusqu’aux nuages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vérité ».'
    reason: Alternative lexicale pour אֱמֶת, qui peut désigner aussi bien la vérité que la fidélité ou la fiabilité selon le contexte.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison de la louange exprimée dans le contexte.
- source_word: גָדוֹל מֵעַל שָׁמַיִם
  choice: s’élève plus haut que les cieux
  rationale: Cette formulation française naturelle réunit l’idée de grandeur et l’image spatiale de ce qui est au-dessus des cieux, sans effacer la métaphore poétique.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne ici l’amour loyal, durable et bienveillant de Dieu. « Amour fidèle » est clair, actuel et garde sa dimension relationnelle sans ajouter explicitement le terme « alliance ».
- source_word: וְעַד שְׁחָקִים
  choice: et … atteint jusqu’aux nuages
  rationale: Le verbe « atteint » est fourni par le parallélisme pour exprimer en français l’étendue verticale marquée par עַד, tandis que « nuages » conserve l’image concrète de שְׁחָקִים.
- source_word: אֲמִתֶּךָ
  choice: ta fidélité
  rationale: En parallèle avec חֶסֶד et à propos du caractère de Dieu, אֱמֶת évoque sa constance et sa fiabilité. « Vérité » demeure néanmoins une possibilité lexicale réelle, signalée en note.
theological_decisions:
- issue: Traduction des attributs divins חֶסֶד et אֱמֶת dans le parallélisme poétique
  choice: « amour fidèle » et « fidélité »
  alternative: « bonté » ou « amour loyal », et « vérité »
  rationale: Ce couple exprime la bienveillance constante et la fiabilité de Dieu. La traduction retenue communique cette portée relationnelle sans imposer un vocabulaire confessionnel particulier, tandis que la note préserve l’ambiguïté de אֱמֶת.
translation_notes:
  register: Français international moderne, poétique et digne. « S’élève plus haut que les cieux » évite le calque peu naturel « est grand au-dessus des cieux » tout en conservant l’image verticale du texte hébreu.
