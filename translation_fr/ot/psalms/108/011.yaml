  text: הֲ/לֹֽא אֱלֹהִ֥ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: fr
  text: N’est-ce pas toi, Dieu, qui nous as rejetés[a] et qui ne sors pas avec nos armées ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui nous as repoussés ». Le verbe hébreu peut exprimer un rejet énergique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: N’est-ce pas toi… qui
  rationale: Introduit une question rhétorique appelant une réponse affirmative et donne en français une construction naturelle qui porte sur les deux propositions.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu d’Israël au singulier, comme l’indiquent les verbes au singulier.
- source_word: זְנַחְתָּנוּ
  choice: nous as rejetés
  rationale: Le verbe זנח exprime un rejet marqué. « Rejetés » est actuel, clair et conserve la force de la plainte.
- source_word: וְלֹא
  choice: toi qui ne
  rationale: La coordination négative est intégrée à la même question rhétorique; la reprise de « toi » rend le lien naturel sans ajouter un contraste absent de l’hébreu.
- source_word: תֵצֵא
  choice: sors
  rationale: Le verbe signifie littéralement « sortir ». Le présent convient à la plainte concernant l’absence actuelle de Dieu aux côtés des troupes.
- source_word: בְּצִבְאֹתֵינוּ
  choice: avec nos armées
  rationale: Dans ce contexte militaire, צבא désigne les armées; la préposition ב exprime ici l’accompagnement.
theological_decisions:
- issue: Le rejet divin dans la plainte
  choice: La traduction affirme dans une question rhétorique que Dieu a rejeté son peuple et ne sort pas avec ses armées.
  alternative: Atténuer par « nous as délaissés » ou « n’es plus avec nous ».
  rationale: Le verbe זנח porte une accusation forte. La formulation conserve la tension théologique propre à la lamentation au lieu de l’adoucir.
- issue: Portée de l’interrogation
  choice: Une seule construction interrogative englobe les deux propositions.
  alternative: 'Faire de la seconde proposition une affirmation indépendante : « et tu ne sors pas avec nos armées ».'
  rationale: הֲלֹא ouvre la phrase et peut porter sur l’ensemble coordonné; la formulation retenue préserve cette lecture tout en restant naturelle en français.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La dislocation « toi, Dieu… toi qui » marque l’adresse et l’insistance sans recourir à l’archaïsant « ô Dieu ».
