id: PSA.108.13
reference: Psalms 108:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: fr
  text: Avec Dieu, nous accomplirons des exploits[a], et c’est lui qui piétinera nos adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous agirons avec vaillance » ; l’expression hébraïque peut mettre l’accent sur la force, la bravoure ou l’action victorieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Avec Dieu
  rationale: La préposition ב peut ici exprimer à la fois l’association et le moyen. « Avec Dieu » est naturel en français et maintient la dépendance envers Dieu sans réduire le sens à une instrumentalité stricte.
- source_word: נַעֲשֶׂה חָיִל
  choice: nous accomplirons des exploits
  rationale: L’expression idiomatique associe le verbe « faire/accomplir » à חַיִל, qui peut évoquer force, vaillance ou prouesse victorieuse. « Accomplir des exploits » restitue naturellement l’action courageuse et victorieuse dans ce contexte martial.
- source_word: וְהוּא
  choice: et c’est lui qui
  rationale: La tournure emphatique française rend le pronom explicite et souligne le passage de l’action du peuple à l’action décisive de Dieu, tout en conservant la coordination simple.
- source_word: יָבוּס
  choice: piétinera
  rationale: Le verbe בוס signifie fouler ou écraser sous les pieds. « Piétinera » conserve l’image militaire vive du texte hébreu.
- source_word: צָרֵינוּ
  choice: nos adversaires
  rationale: Le terme désigne ceux qui s’opposent avec hostilité. « Adversaires » est clair, digne et légèrement plus proche de la portée lexicale que le seul terme « ennemis ».
theological_decisions:
- issue: L’action humaine et l’action divine dans la victoire
  choice: Le peuple accomplit des exploits avec Dieu, tandis que Dieu lui-même piétine les adversaires.
  alternative: Présenter la victoire comme exclusivement divine en effaçant l’action humaine, ou comme surtout humaine avec une simple assistance divine.
  rationale: L’hébreu attribue explicitement une action au « nous », en dépendance de Dieu, puis l’action décisive à « lui ». La traduction conserve cette tension sans fondre les deux agents l’un dans l’autre.
translation_notes:
  register: Français moderne, international et poétique sans archaïsme. « Accomplir des exploits » est idiomatique et accessible ; « c’est lui qui » reproduit l’emphase du pronom hébreu.
