  yaml_path: translation/ot/psalms/109/023.yaml
  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
translation:
  language: fr
  text: Comme une ombre qui s’allonge[a], je disparais[b] ; je suis secoué comme une sauterelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui décline » ou « qui s’étend » ; le verbe hébreu peut évoquer une ombre qui s’allonge ou décline à l’approche du soir.
    reason: lexical_alternative
  - marker: b
    text: Ou « je m’en vais » ou « je passe » ; l’hébreu emploie littéralement le verbe « aller, marcher », qui exprime ici le départ ou la disparition.
    reason: lexical_alternative
  - marker: c
    text: Ou « un criquet ». Le mot hébreu désigne couramment la sauterelle, en particulier celle qui se déplace en essaim.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: Comme une ombre
  rationale: Le préfixe כְּ marque la comparaison, et צֵל signifie « ombre ». Cette formulation française conserve simplement la comparaison poétique.
- source_word: כִּנְטוֹתוֹ
  choice: qui s’allonge
  rationale: Le verbe נטה peut exprimer l’idée de s’étendre, de s’incliner ou de décliner. Appliqué à une ombre, « s’allonge » est naturel et maintient l’image du soir sans en imposer une seule interprétation.
- source_word: נֶהֱלָכְתִּי
  choice: je m’en vais
  rationale: Le nifal de הלך évoque ici le fait de partir ou de disparaître. « Je m’en vais » reste proche du verbe de mouvement tout en exprimant naturellement l’effacement du psalmiste.
- source_word: נִנְעַרְתִּי
  choice: je suis secoué
  rationale: Le nifal de נער signifie être secoué, chassé ou détaché par une secousse. « Je suis secoué » préserve la voix passive et laisse ouverte la nuance exacte de l’image.
- source_word: כָּאַרְבֶּה
  choice: comme une sauterelle
  rationale: אַרְבֶּה désigne habituellement la sauterelle, notamment sous sa forme grégaire et migratrice. En français courant, « sauterelle » est le terme naturel dans cette comparaison, tandis que « criquet » demeure une possibilité plus précise.
