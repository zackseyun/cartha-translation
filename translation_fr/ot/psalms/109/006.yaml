source:
  edition: WLC
  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: fr
  text: Établis un méchant au-dessus de lui, et qu’un accusateur[a] se tienne à sa droite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un adversaire » ou « Satan ». Le mot hébreu peut désigner un accusateur, un adversaire ou, dans certains contextes, Satan.
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Place
  rationale: L’impératif hiphil de פקד demande ici qu’une personne soit établie dans une position d’autorité. « Place » garde la force impérative et reste naturel en français.
- source_word: עָלָיו
  choice: au-dessus de lui
  rationale: Avec פקד, la préposition על désigne naturellement la personne sur laquelle quelqu’un est établi. Cette formulation conserve le rapport d’autorité sans préciser indûment une fonction.
- source_word: רָשָׁע
  choice: un homme méchant
  rationale: Le terme désigne ici une personne caractérisée par la méchanceté. « Un homme méchant » rend explicitement la référence personnelle dans un français courant.
- source_word: שָׂטָן
  choice: un accusateur
  rationale: Dans ce contexte judiciaire, le nom commun peut désigner celui qui accuse ou s’oppose. « Accusateur » s’accorde bien avec la scène où il se tient à la droite de l’accusé, sans imposer le nom propre « Satan ».
- source_word: יַעֲמֹד
  choice: qu’… se tienne
  rationale: L’imparfait hébreu prend ici une valeur jussive après l’impératif. La tournure « qu’… se tienne » exprime naturellement ce souhait imprécatoire.
- source_word: עַל יְמִינוֹ
  choice: à sa droite
  rationale: Cette expression idiomatique indique une position auprès de quelqu’un, ici vraisemblablement dans un cadre judiciaire. « À sa droite » préserve l’image sans l’expliciter excessivement.
theological_decisions:
- issue: 'שָׂטָן : nom commun ou nom propre'
  choice: 'Nom commun : « un accusateur »'
  alternative: « un adversaire » ou « Satan »
  rationale: L’hébreu n’exige pas ici un nom propre, et le contexte immédiat évoque une accusation judiciaire. Le texte principal retient donc le sens commun le plus contextuel, tandis que la note conserve les autres possibilités lexicales et la lecture traditionnelle.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe conserve le parallélisme de l’hébreu ainsi que l’image judiciaire, tout en évitant de transformer une possibilité lexicale en identification théologique certaine.
