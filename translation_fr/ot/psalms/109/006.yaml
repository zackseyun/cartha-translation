  source_fidelity: Le sens de l’impératif hiphil (« établir/placer »), la relation d’autorité indiquée par עָלָיו (« au-dessus de lui »), et la valeur jussive de la seconde proposition sont bien conservés. « Accusateur » rend de façon appropriée le nom commun שָׂטָן dans ce contexte judiciaire, sans exclure indûment la lecture traditionnelle par la note.
  naturalness: « Place un homme méchant au-dessus de lui » est compréhensible, mais « placer ... au-dessus de » sonne sensiblement plus spatial et moins idiomatique en français biblique moderne lorsqu’il s’agit d’une autorité. « Établis un méchant au-dessus de lui » est plus naturel et conserve la portée administrative sans préciser une fonction.
  terminology: « Un méchant » est l’équivalent français biblique et courant le plus direct de רָשָׁע; il évite l’expression un peu lourde « un homme méchant ». « Accusateur » et « à sa droite » sont justes. La note doit formuler plus naturellement l’éventualité du nom propre.
