source:
  edition: WLC
  text: יִֽהְיוּ בָנָ֥י/ו יְתוֹמִ֑ים וְ֝/אִשְׁתּ/וֹ אַלְמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: fr
  text: Que ses fils soient privés de père[a], et que sa femme soit veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « orphelins ». Le terme hébreu peut désigner des enfants ayant perdu leur père ; ici, « privés de père » correspond au parallèle avec « sa femme soit veuve ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que ... soient / que ... devienne
  rationale: Le yiqtol a ici une valeur jussive et imprécatoire. La tournure française avec « que » exprime naturellement le souhait ou l’appel au jugement; devant « veuve », « devienne » rend l’effet visé plus idiomatiquement que la répétition de « soit ».
- source_word: בָנָיו
  choice: ses fils
  rationale: Le pluriel de בֵּן avec suffixe masculin singulier désigne précisément « ses fils »; cette spécificité est conservée.
- source_word: יְתוֹמִים
  choice: privés de père
  rationale: Le terme peut désigner des orphelins, mais le parallélisme avec la femme devenue veuve met ici l’accent sur la perte du père.
- source_word: וְאִשְׁתּוֹ
  choice: et ... sa femme
  rationale: Dans ce contexte, אִשָּׁה muni du suffixe signifie clairement « sa femme »; la conjonction est maintenue.
- source_word: אַלְמָנָה
  choice: veuve
  rationale: Le nom désigne directement une veuve. Avec « devenir », le français n’exige pas d’article.
theological_decisions:
- issue: Valeur imprécatoire du verset
  choice: 'Formuler un souhait ou une imprécation : « Que ses fils soient… et que sa femme devienne… »'
  alternative: 'Futur prédictif : « Ses fils seront… et sa femme deviendra… »'
  rationale: La forme verbale et le contexte littéraire du psaume favorisent une valeur jussive ou imprécatoire plutôt qu’une simple prédiction. La traduction conserve ainsi la tension du texte sans l’atténuer.
translation_notes:
  register: Français moderne, digne et direct. « Privés de père » est naturel et précis, tandis que la note conserve l’équivalent traditionnel « orphelins ». Le parallélisme hébreu et le caractère imprécatoire sont maintenus.
