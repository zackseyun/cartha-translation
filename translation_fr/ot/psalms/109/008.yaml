id: PSA.109.8
reference: Psalms 109:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִֽהְיֽוּ יָמָ֥י/ו מְעַטִּ֑ים פְּ֝קֻדָּת֗/וֹ יִקַּ֥ח אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/008.yaml
  text: May his days be few[a]; may another take his office.
translation:
  language: fr
  text: Que ses jours soient peu nombreux ; qu’un autre prenne sa charge.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa fonction », « sa responsabilité » ou « son poste ». Le terme hébreu désigne une responsabilité confiée ou un rôle attribué.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que ... soient
  rationale: Le contexte imprécatoire donne à cette forme une valeur jussive, rendue naturellement en français par « Que... » plutôt que par un simple futur.
- source_word: יָמָיו
  choice: ses jours
  rationale: Rend directement le nom pluriel avec suffixe masculin singulier et désigne ici les jours de sa vie.
- source_word: מְעַטִּים
  choice: peu nombreux
  rationale: Exprime directement le petit nombre de jours, sans remplacer cette idée par la conséquence implicite d’une vie courte.
- source_word: פְּקֻדָּתוֹ
  choice: sa charge
  rationale: Le nom désigne une responsabilité confiée, une fonction ou une mission. « Charge » reste naturel et suffisamment large sans lui donner d’emblée un sens ecclésiastique technique.
- source_word: יִקַּח
  choice: qu’... prenne
  rationale: L’imparfait hébreu poursuit ici la valeur jussive de la première proposition ; la construction française avec « que » préserve ce parallélisme imprécatoire.
- source_word: אַחֵר
  choice: un autre
  rationale: Équivalent direct et idiomatique qui conserve l’indétermination de l’hébreu.
theological_decisions:
- issue: Sens de פְּקֻדָּתוֹ dans un verset repris en Actes 1.20
  choice: sa charge
  alternative: sa fonction ; sa responsabilité ; son poste
  rationale: « Charge » exprime une responsabilité ou un rôle confié et convient au contexte du psaume comme à sa reprise ultérieure, sans importer dans le texte hébreu une conception technique particulière d’un ministère ecclésiastique.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme des deux souhaits imprécatoires est conservé par « Que... ; qu’... ». « Peu nombreux » suit de près l’expression hébraïque tout en restant clair.
