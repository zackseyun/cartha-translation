  text: וְ/נ֤וֹעַ יָנ֣וּעוּ בָנָ֣י/ו וְ/שִׁאֵ֑לוּ וְ֝/דָרְשׁ֗וּ מֵ/חָרְבוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/010.yaml
  text: May his children wander about and beg[a]; may they seek from their ruins.
translation:
  language: fr
  text: Que ses enfants errent çà et là et mendient ; qu’ils cherchent dans leurs ruines[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils cherchent loin de leurs ruines ». La préposition hébraïque peut indiquer la provenance ou l’éloignement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֹועַ יָנוּעוּ
  choice: errent sans cesse
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’idée verbale. « Errent sans cesse » rend naturellement en français cette errance insistante dans le cadre d’une imprécation.
- source_word: בָנָיו
  choice: ses enfants
  rationale: בנים peut désigner les fils ou, plus largement, les enfants. « Ses enfants » convient au sens familial général et au français actuel.
- source_word: וְשִׁאֵלוּ
  choice: et mendient
  rationale: Même si שאל signifie couramment « demander », le contexte d’errance et de dénuement favorise ici le sens de mendier.
- source_word: וְדָרְשׁוּ
  choice: qu’ils cherchent de quoi vivre
  rationale: דרש signifie « chercher » sans objet exprimé ici. En français, « chercher » employé absolument serait obscur ; « de quoi vivre » explicite sobrement ce que suggèrent la mendicité et la détresse du contexte.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: parmi leurs ruines
  rationale: חרבות désigne des ruines ou des lieux dévastés. Dans ce contexte, מן peut indiquer le lieu d’où l’on tire quelque chose ; « parmi leurs ruines » donne un français naturel, tandis que la lecture séparative est conservée en note.
