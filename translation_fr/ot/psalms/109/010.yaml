revisions:
- from: Que ses enfants errent sans cesse et mendient ; qu’ils cherchent de quoi vivre parmi leurs ruines[a].
  to: Que ses enfants errent çà et là et mendient ; qu’ils cherchent dans leurs ruines[a].
  rationale: La révision retire l’objet interprétatif « de quoi vivre », rend l’intensification verbale par une expression française naturelle et conserve, par la note, l’ambiguïté de la préposition hébraïque. « Dans leurs ruines » permet une phrase française lisible sans prétendre trancher entièrement entre les valeurs possibles de מן.
