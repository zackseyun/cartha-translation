  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: fr
  text: 'Au chef de chœur. De David[a]. Psaume.


    Dieu de ma louange, ne garde pas le silence[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David », « pour David » ou « à David » ; le titre hébreu est ambigu.
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « ne reste pas silencieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Au chef de chœur » est une formulation française courante et digne.
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut exprimer l’auteur, la destination, la dédicace ou une association. « De David » conserve une part de cette souplesse sans imposer explicitement l’idée d’auteur.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Équivalent français traditionnel, clair et exact du nom de genre employé dans le titre.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Dieu de ma louange
  rationale: Cette traduction reproduit la construction nominale hébraïque et préserve son expression dense, plutôt que de la paraphraser par « Dieu que je loue ».
- source_word: אַל תֶּחֱרַשׁ
  choice: ne garde pas le silence
  rationale: La négation avec la forme verbale exprime ici une supplication pressante. « Ne garde pas le silence » évoque naturellement le refus de demeurer sans réponse.
theological_decisions:
- issue: Portée du titre לְדָוִד
  choice: « De David » dans le texte, avec une note signalant l’ambiguïté
  alternative: « Par David », « pour David » ou « à David »
  rationale: L’hébreu ne tranche pas à lui seul entre attribution d’auteur, dédicace, destination et association. La traduction évite donc d’affirmer plus précisément une paternité davidique.
translation_notes:
  register: Français international moderne, sobre et adapté à la prière. Le titre est présenté en segments brefs conformément à sa structure hébraïque. L’expression inhabituelle mais intelligible « Dieu de ma louange » est conservée afin de respecter la densité poétique de l’original.
