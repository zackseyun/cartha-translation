id: PSA.109.27
reference: Psalms 109:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ֭/יֵדְעוּ כִּי יָ֣דְ/ךָ זֹּ֑את אַתָּ֖ה יְהוָ֣ה עֲשִׂיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/027.yaml
  text: Let them know that this is your hand; you[a], O Yahweh, have done it.
translation:
  language: fr
  text: Qu’ils sachent que c’est ta main ; toi, Yahweh, tu as fait cela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puissent-ils savoir » ou « Et qu’ils sachent » ; dans ce contexte, le verbe hébreu a une valeur de souhait ou de demande.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Qu’ils sachent
  rationale: L’imparfait qal à valeur volitive exprime ici le souhait ou la prière du psalmiste. « Qu’ils sachent » restitue naturellement cette nuance en français.
- source_word: כִּי
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’ils doivent reconnaître, plutôt qu’une cause.
- source_word: יָדְךָ
  choice: ta main
  rationale: Le maintien de l’image hébraïque préserve l’idée d’action et de puissance divines sans l’expliciter excessivement.
- source_word: זֹּאת
  choice: c’est
  rationale: Le démonstratif désigne l’intervention évoquée dans le contexte. La tournure « c’est ta main » est naturelle et conserve la formulation métaphorique.
- source_word: אַתָּה
  choice: toi… tu
  rationale: La dislocation « toi… tu » rend en français l’insistance portée par le pronom indépendant hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עֲשִׂיתָהּ
  choice: tu as fait cela
  rationale: Le verbe עשה indique que Yahweh est l’auteur de l’intervention. « Cela » reprend naturellement en français l’acte désigné par le suffixe féminin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie directement le tétragramme ; sa translittération préserve le nom personnel et évite de le remplacer par un titre.
- issue: Valeur de וְיֵדְעוּ
  choice: 'Souhait ou demande : « Qu’ils sachent »'
  alternative: 'Déclaration future : « Ils sauront »'
  rationale: Dans ce contexte de prière, la forme verbale se comprend le mieux avec une valeur jussive, tout en laissant en note les nuances possibles de souhait et d’enchaînement.
translation_notes:
  register: Français moderne, digne et direct. La répétition emphatique « toi… tu » est conservée pour refléter l’accent de l’hébreu, et la métaphore de la main demeure intacte.
