  text: תַּֽחַת אַהֲבָתִ֥/י יִשְׂטְנ֗וּ/נִי וַ/אֲנִ֥י תְפִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/004.yaml
  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: fr
  text: En échange de mon amour, ils m’accusent, mais moi, je suis prière.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus explicite : « mais moi, je prie » ou « mais moi, je suis un homme de prière ». L’hébreu dit littéralement : « mais moi, prière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: En échange de
  rationale: La préposition exprime ici une rétribution opposée à ce qui a été donné, et non la position spatiale « sous ». « En échange de » conserve cette idée avec naturel.
- source_word: אַהֲבָתִי
  choice: mon amour
  rationale: Le nom désigne directement l’amour ou l’affection du psalmiste ; « mon amour » en est le rendu le plus simple et maintient le vocabulaire biblique courant de l’amour.
- source_word: יִשְׂטְנוּנִי
  choice: ils m’accusent
  rationale: Le verbe signifie agir en adversaire contre quelqu’un, avec une possible nuance judiciaire d’accusation. Le contexte du psaume favorise ici « ils m’accusent », sans exclure l’idée plus générale d’hostilité.
- source_word: וַאֲנִי
  choice: mais moi
  rationale: La conjonction est formellement « et », mais elle introduit ici un contraste marqué entre leur conduite et celle du psalmiste. La reprise « moi » rend cette opposition naturelle en français.
- source_word: תְפִלָּה
  choice: je suis prière
  rationale: L’hébreu présente une proposition nominale très condensée, littéralement « moi, prière ». Le français « je suis prière » en préserve l’image frappante, tandis que la note donne les explicitations possibles.
theological_decisions:
- issue: Force idiomatique de la proposition nominale וַאֲנִי תְפִלָּה
  choice: 'Conserver l’expression nominale condensée : « mais moi, je suis prière »'
  alternative: « mais moi, je prie » ou « mais moi, je suis un homme de prière »
  rationale: La formule hébraïque ne précise pas si elle décrit l’action présente du psalmiste ou son caractère habituel. Le texte principal conserve donc sa tension poétique, et la note présente les deux explicitations plausibles sans trancher.
translation_notes:
  register: Français international moderne, sobre et poétique. « En échange de » est idiomatique tout en gardant la logique de rétribution ; « je suis prière » assume volontairement l’étrangeté expressive de l’hébreu. Le marqueur de note suit la proposition qu’il explique.
