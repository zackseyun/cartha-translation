id: PSA.109.20
reference: Psalms 109:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֹ֤את פְּעֻלַּ֣ת שֹׂ֭טְנַ/י מֵ/אֵ֣ת יְהוָ֑ה וְ/הַ/דֹּבְרִ֥ים רָ֝֗ע עַל נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: fr
  text: Telle est, de la part de Yahvé, la rétribution de mes accusateurs[a] et de ceux qui disent du mal de moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « rétribution » peut aussi signifier « œuvre » ou « acte »; « mes accusateurs » peut également se traduire par « mes adversaires ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « contre mon âme ». Ici, « âme » peut désigner la personne elle-même ou sa vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Telle est
  rationale: Le démonstratif féminin singulier renvoie à פְּעֻלַּת et introduit une constatation récapitulative; « Telle est » restitue naturellement la copule sous-entendue.
- source_word: פְּעֻלַּת
  choice: la rétribution
  rationale: Le nom désigne littéralement une œuvre ou un acte, mais prend ici, dans le contexte du jugement demandé contre les adversaires, le sens de ce qui leur revient en retour.
- source_word: שֹׂטְנַי
  choice: mes accusateurs
  rationale: Le terme peut désigner des adversaires ou des accusateurs. Le contexte du psaume, centré sur des accusations et des paroles hostiles, favorise « accusateurs ».
- source_word: מֵאֵת
  choice: de la part de
  rationale: La préposition marque ici la source ou l’agent; cette tournure française conserve explicitement l’idée que la rétribution vient de Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend directement le nom divin plutôt que de lui substituer un titre.
- source_word: וְהַדֹּבְרִים רָע
  choice: et de ceux qui disent du mal
  rationale: La coordination hébraïque est maintenue. « Dire du mal » exprime naturellement en français l’action de tenir des propos mauvais ou malveillants.
- source_word: עַל נַפְשִׁי
  choice: de moi
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne elle-même, voire sa vie. « De moi » est idiomatique avec « dire du mal », tandis qu’une note conserve l’image et l’ambiguïté hébraïques.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. Le rendre par « Yahvé » le distingue d’un simple titre et suit l’usage français établi sans trancher davantage les questions de vocalisation historique.
- issue: Nature de ce qui vient de Yahvé
  choice: rétribution
  alternative: œuvre / acte
  rationale: Le contexte imprécatoire indique ce qui est rendu aux accusateurs, mais le choix lexical est signalé en note afin de ne pas masquer le sens plus concret du nom hébreu.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe place « de la part de Yahvé » près de « rétribution » pour rendre clairement la source, tout en conservant la coordination des deux groupes hostiles.
