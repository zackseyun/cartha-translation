source:
  edition: WLC
  text: כִּֽי עָנִ֣י וְ/אֶבְי֣וֹן אָנֹ֑כִי וְ֝/לִבִּ֗/י חָלַ֥ל בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/022.yaml
  text: For I am poor and needy[a], and my heart is wounded within me.
translation:
  language: fr
  text: Car je suis pauvre et démuni, et mon cœur est blessé au-dedans de moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transpercé » ou « frappé à mort ». Le verbe hébreu peut évoquer une blessure profonde, le fait d’être transpercé ou une atteinte mortelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la supplication dans le contexte, tout en conservant naturellement la valeur connective de l’hébreu.
- source_word: עָנִי
  choice: pauvre
  rationale: Le terme peut désigner une personne pauvre, affligée ou opprimée. « Pauvre » convient à son association avec אֶבְיוֹן sans préciser excessivement la nature de la détresse.
- source_word: אֶבְיוֹן
  choice: démuni
  rationale: Distingue ce terme de עָנִי et exprime le manque de ressources ainsi que l’impuissance de celui qui est dans le besoin.
- source_word: אָנֹכִי
  choice: je suis
  rationale: Le pronom indépendant est explicite et appuyé en hébreu ; la tournure française avec « je suis » restitue naturellement cette affirmation.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Équivalent français direct qui conserve la référence au centre de la vie intérieure sans la réduire à la seule émotion.
- source_word: חָלַל
  choice: est blessé
  rationale: Dans ce contexte, le verbe évoque une atteinte intérieure grave. « Blessé » préserve l’image tout en laissant ouverte l’intensité exacte, qui peut aller jusqu’à l’idée d’être transpercé ou frappé à mort.
- source_word: בְּקִרְבִּי
  choice: au-dedans de moi
  rationale: Rend explicitement la localisation intérieure exprimée par l’hébreu, dans un registre digne et compréhensible.
theological_decisions:
- issue: Intensité de l’image décrivant l’état du cœur
  choice: « est blessé » dans le texte, avec les sens plus forts signalés en note
  alternative: « est transpercé » ou « est frappé à mort »
  rationale: Le contexte décrit une profonde détresse intérieure, mais la forme hébraïque permet plusieurs nuances. La traduction ne tranche donc pas en faveur d’une blessure littérale, d’une mort intérieure ou d’une formulation doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et digne. « Démuni » évite la répétition de « pauvre » tout en conservant le parallélisme des deux termes hébreux. « Au-dedans de moi » garde la force corporelle et intérieure de l’expression source.
