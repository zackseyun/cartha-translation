source:
  edition: WLC
  text: יִהְי֣וּ נֶֽגֶד יְהוָ֣ה תָּמִ֑יד וְ/יַכְרֵ֖ת מֵ/אֶ֣רֶץ זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: fr
  text: Qu’ils soient constamment devant Yahweh, et qu’il retranche leur souvenir de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays » ; le mot hébreu peut désigner soit la terre, soit un pays selon le contexte.
    reason: Alternative lexicale réelle pour אֶרֶץ.
lexical_decisions:
- source_word: יִהְיוּ
  choice: Qu’ils soient
  rationale: L’imparfait qal à valeur jussive exprime ici un souhait ou une prière imprécatoire.
- source_word: נֶגֶד
  choice: devant
  rationale: Ce terme situe quelque chose en présence de quelqu’un et peut conserver ici une nuance relationnelle ou judiciaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre du texte hébreu plutôt que de lui substituer un titre.
- source_word: תָּמִיד
  choice: constamment
  rationale: L’adverbe exprime la continuité; « constamment » est naturel en français moderne tout en gardant le ton solennel.
- source_word: וְיַכְרֵת
  choice: et qu’il retranche
  rationale: L’imparfait hiphil est compris comme jussif dans le prolongement de la première proposition; « retrancher » rend l’idée d’élimination radicale.
- source_word: מֵאֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un pays; le contexte de l’effacement du souvenir favorise ici « terre », sans exclure l’autre sens.
- source_word: זִכְרָם
  choice: jusqu’à leur souvenir
  rationale: Avec « retrancher », cette formulation idiomatique exprime la disparition complète de ce qui perpétue leur mémoire, tout en conservant l’image hébraïque.
theological_decisions:
- issue: Valeur imprécatoire et jussive des verbes
  choice: 'Rendre les deux verbes comme des souhaits ou demandes : « Qu’ils soient… et qu’il retranche… »'
  alternative: 'Les comprendre comme de simples futurs : « Ils seront… et il retranchera… »'
  rationale: Le contexte de prière imprécatoire et la syntaxe hébraïque favorisent la valeur jussive; cette traduction conserve la tension du psaume sans l’atténuer.
translation_notes:
  register: Français international moderne, digne et direct. « Yahweh » conserve le nom divin; « retranche » maintient la vigueur de l’imprécation sans paraphrase explicative.
