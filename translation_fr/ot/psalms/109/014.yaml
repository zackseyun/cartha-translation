source:
  edition: WLC
  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: fr
  text: Que la faute[a] de ses pères[b] soit gardée en mémoire devant Yahweh, et que le péché de sa mère ne soit pas effacé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la culpabilité » ou « l’iniquité ». Le mot hébreu peut désigner la faute, la culpabilité qu’elle entraîne ou ses conséquences.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ses ancêtres » ; littéralement « de ses pères ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ne soit pas supprimé » ou « ne soit pas rayé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: soit rappelée
  rationale: Le niphal à valeur de souhait appelle une formulation passive. « Soit rappelée » exprime naturellement en français l’idée que la faute demeure portée à l’attention de Dieu.
- source_word: עֲוֺן
  choice: faute
  rationale: עָוֹן peut désigner l’iniquité, la culpabilité ou les conséquences qui en découlent. « Faute » conserve une part de cette amplitude sans employer un terme vieilli.
- source_word: אֲבֹתָיו
  choice: ses pères
  rationale: Traduction formellement proche du pluriel hébreu, qui peut viser les pères au sens strict ou les ancêtres masculins.
- source_word: אֶל יְהוָה
  choice: devant Yahweh
  rationale: Avec le verbe « se souvenir », la préposition אֶל peut ici évoquer ce qui est rappelé en présence de Dieu. « Devant » convient au contexte solennel, voire judiciaire.
- source_word: וְחַטַּאת
  choice: et que le péché
  rationale: חַטָּאת désigne ici le péché, en parallèle avec עָוֹן, et non un sacrifice pour le péché.
- source_word: אִמּוֹ
  choice: de sa mère
  rationale: Rendu direct du nom accompagné du suffixe possessif.
- source_word: אַל תִּמָּח
  choice: ne soit pas effacé
  rationale: La tournure négative exprime un souhait imprécatoire. « Effacé » maintient l’image d’une faute supprimée d’un registre ou ôtée du souvenir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre.
- issue: Responsabilité liée aux fautes des générations précédentes
  choice: Conserver la demande imprécatoire sans l’atténuer ni l’expliquer dans le corps du texte
  alternative: Reformuler pour limiter la portée aux seules conséquences historiques
  rationale: Le verset demande que la faute des pères soit rappelée devant Dieu. La traduction préserve cette tension théologique sans déterminer davantage le mode de responsabilité envisagé.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le parallélisme entre « soit rappelée » et « ne soit pas effacé » conserve l’image d’une faute maintenue devant Dieu, tandis que les notes signalent les principales amplitudes lexicales de l’hébreu.
