  text: Des paroles de haine m’entourent, et ils me font la guerre sans cause.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: des paroles haineuses
  rationale: Le groupe construit désigne des paroles exprimant la haine. « Paroles haineuses » est naturel en français actuel tout en conservant la force de l’accusation.
- source_word: סְבָבוּנִי
  choice: m’encerclent
  rationale: Le verbe סבב évoque le fait d’entourer ou d’encercler. Le présent rend ici l’hostilité de manière vive et s’accorde avec le parallélisme poétique.
- source_word: וַיִּלָּחֲמוּנִי
  choice: ils me font la guerre
  rationale: Le niphal de לחם exprime le combat mené contre quelqu’un. « Faire la guerre à » préserve l’image forte du combat et reste idiomatique en français.
- source_word: חִנָּם
  choice: sans raison
  rationale: L’adverbe indique l’absence de motif valable et souligne le caractère injustifié de l’hostilité.
