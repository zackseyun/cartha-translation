id: PSA.109.29
reference: Psalms 109:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִלְבְּשׁ֣וּ שׂוֹטְנַ֣/י כְּלִמָּ֑ה וְ/יַעֲט֖וּ כַ/מְעִ֣יל בָּשְׁתָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/029.yaml
  text: May my accusers be clothed with disgrace[a], and wrap themselves in their shame like a robe.
translation:
  language: fr
  text: Que mes accusateurs[a] soient revêtus de déshonneur, qu’ils s’enveloppent de leur honte comme d’un manteau !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes adversaires ». Le terme hébreu peut désigner des opposants en général ou, dans un sens plus juridique, des accusateurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: Que ... soient revêtus
  rationale: L’imparfait qal à la 3e personne du pluriel prend ici, dans cette prière imprécatoire, une valeur de souhait. La tournure « soient revêtus » restitue naturellement l’image d’un état imposé par le déshonneur.
- source_word: שׂוֹטְנַי
  choice: mes accusateurs
  rationale: Le participe pluriel avec suffixe de première personne peut désigner des adversaires en général ou des accusateurs dans un cadre plus juridique. « Mes accusateurs » convient au contexte hostile et accusatoire du psaume.
- source_word: כְּלִמָּה
  choice: déshonneur
  rationale: Le nom évoque la honte publique, l’humiliation ou l’opprobre. « Déshonneur » maintient ce champ sémantique tout en évitant de répéter « honte » dans le second membre.
- source_word: וְיַעֲטוּ
  choice: qu’ils s’enveloppent
  rationale: Le verbe עטה exprime l’idée de se couvrir ou de s’envelopper. La formulation pronominale est naturelle en français et prolonge clairement l’image du vêtement.
- source_word: כַמְעִיל
  choice: comme d’un manteau
  rationale: מְעִיל désigne un vêtement extérieur ample. « Manteau » est courant, digne et rend bien l’idée d’enveloppement.
- source_word: בָּשְׁתָּם
  choice: leur honte
  rationale: Le nom, muni du suffixe de troisième personne du pluriel, signifie leur honte ou leur humiliation. « Leur honte » est direct et s’accorde naturellement avec la métaphore vestimentaire.
theological_decisions:
- issue: Valeur modale des imparfaits dans un psaume imprécatoire
  choice: 'Les rendre comme un souhait ou une prière : « Que mes accusateurs soient revêtus... qu’ils s’enveloppent... »'
  alternative: 'Les rendre comme une prédiction au futur : « Mes accusateurs seront revêtus... ils s’envelopperont... »'
  rationale: Dans la suite des demandes du Psaume 109, les imparfaits ont naturellement une portée jussive ou imprécatoire. La construction avec « que » conserve la prière du psalmiste sans la transformer en simple prédiction.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la métaphore vestimentaire sont conservés ; « déshonneur » et « honte » rendent les deux termes hébreux apparentés sans répétition artificielle.
