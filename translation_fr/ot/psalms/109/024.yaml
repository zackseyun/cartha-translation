  yaml_path: translation/ot/psalms/109/024.yaml
  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: fr
  text: Mes genoux défaillent à cause du jeûne, et ma chair s’est amaigrie, faute de graisse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכַּי
  choice: mes genoux
  rationale: Le pluriel avec suffixe de première personne désigne naturellement les genoux du psalmiste.
- source_word: כָּשְׁלוּ
  choice: fléchissent
  rationale: Le verbe exprime le fait de chanceler ou de défaillir. Appliqué aux genoux, « fléchissent » rend naturellement l’affaiblissement physique.
- source_word: מִצּוֹם
  choice: à force de jeûner
  rationale: La préposition marque ici la cause. Cette formulation française exprime clairement que le jeûne prolongé provoque la faiblesse.
- source_word: וּבְשָׂרִי
  choice: et mon corps
  rationale: בשר signifie littéralement « chair », mais, dans cette description de l’amaigrissement de toute la personne physique, « corps » est plus naturel en français courant.
- source_word: כָּחַשׁ
  choice: s’amaigrit
  rationale: Le verbe indique que le corps devient maigre ou dépérit. « S’amaigrit » conserve le sens concret sans exagération.
- source_word: מִשָּׁמֶן
  choice: privé de graisse
  rationale: L’expression décrit la disparition de la graisse corporelle, signe d’émaciation. Cette traduction reste proche de l’image hébraïque tout en étant intelligible.
