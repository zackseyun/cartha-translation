source:
  edition: WLC
  text: יְהִֽי אַחֲרִית֥/וֹ לְ/הַכְרִ֑ית בְּ/ד֥וֹר אַ֝חֵ֗ר יִמַּ֥ח שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/013.yaml
  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: fr
  text: Que sa descendance soit retranchée[a] ! Dans la génération suivante, que leur nom soit effacé !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que sa fin aboutisse à la destruction ». Le mot hébreu peut désigner la fin, l’avenir ou la postérité ; ici, le contexte favorise « descendance ».
    reason: Alternative lexicale reflétant l’ambiguïté réelle de אַחֲרִית.
lexical_decisions:
- source_word: יְהִי
  choice: Que ... soit
  rationale: Le jussif de היה exprime ici un souhait imprécatoire ; la tournure française avec « que » et le subjonctif en restitue naturellement la force.
- source_word: אַחֲרִיתוֹ
  choice: sa descendance
  rationale: Le terme peut désigner la fin, l’avenir ou ce qui vient après quelqu’un. Le parallélisme avec « la génération suivante » et « leur nom » favorise ici le sens collectif de descendance.
- source_word: לְהַכְרִית
  choice: soit retranchée
  rationale: L’infinitif de כרת avec ל exprime l’issue visée. « Retranchée » conserve l’idée forte de suppression sans réduire le texte à une simple prévision.
- source_word: בְּדוֹר אַחֵר
  choice: Dès la génération suivante
  rationale: אַחֵר signifie littéralement « autre ». Dans ce contexte de continuité familiale, « la génération suivante » rend clairement le sens temporel ; « dès » exprime naturellement la portée de בְּ sans ajouter un long délai.
- source_word: יִמַּח
  choice: que ... soit effacé
  rationale: Le nifal de מחה signifie être effacé ou supprimé, notamment lorsqu’il s’agit d’un nom ou d’une mémoire. « Effacé » est naturel et garde l’image du texte.
- source_word: שְׁמָם
  choice: leur nom
  rationale: Le suffixe est pluriel et renvoie aux membres de la descendance, tandis que « nom » reste singulier comme dans l’hébreu, avec une valeur collective.
theological_decisions:
- issue: Force imprécatoire du verset
  choice: Conserver deux souhaits de jugement formulés au subjonctif
  alternative: Présenter les paroles comme de simples prédictions concernant son avenir
  rationale: Les formes volitives et le contexte du psaume expriment une prière imprécatoire. La traduction en maintient la sévérité et la tension théologique sans l’atténuer.
- issue: Référent de אַחֲרִיתוֹ
  choice: Comprendre le mot comme désignant la descendance
  alternative: « sa fin » ou « son avenir »
  rationale: Le passage immédiat à « leur nom » et la mention de la génération suivante indiquent vraisemblablement la lignée survivante, tout en laissant l’autre analyse accessible en note.
translation_notes:
  register: Français international moderne, digne et direct. « Descendance » est courant et précis ; « retranchée » conserve la gravité biblique sans archaïsme excessif. Le parallélisme et la force imprécatoire sont maintenus.
