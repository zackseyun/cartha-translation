source:
  edition: WLC
  text: כִּֽי יַ֭עֲמֹד לִ/ימִ֣ין אֶבְי֑וֹן לְ֝/הוֹשִׁ֗יעַ מִ/שֹּׁפְטֵ֥י נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: fr
  text: Car il se tient à la droite du pauvre, pour le sauver de ceux qui le jugent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ses juges »; l’hébreu peut désigner ceux qui exercent la fonction de juges à son égard ou, plus largement, ceux qui prononcent un jugement contre sa personne ou sa vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange et de l’assurance exprimées au verset précédent.
- source_word: יַעֲמֹד
  choice: il se tient
  rationale: L’imparfait poétique peut exprimer une action caractéristique ou tenue pour certaine; le présent français convient ici sans exclure la portée future.
- source_word: לִימִין
  choice: à la droite de
  rationale: Conserve l’image hébraïque d’une présence proche, protectrice et favorable.
- source_word: אֶבְיוֹן
  choice: du pauvre
  rationale: Désigne une personne démunie et vulnérable; « pauvre » est naturel et fidèle dans ce contexte.
- source_word: לְהוֹשִׁיעַ
  choice: pour le sauver
  rationale: L’infinitif exprime le but; « sauver » couvre ici la délivrance face à une menace judiciaire et vitale.
- source_word: מִשֹּׁפְטֵי נַפְשׁוֹ
  choice: de ceux qui le jugent
  rationale: Cette formulation française rend naturellement les juges ou accusateurs qui prononcent un jugement contre sa personne, sans réduire נֶפֶשׁ à l’âme immatérielle ni imposer explicitement « condamner ».
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ
  choice: Rendu pronominalement par « le » dans « ceux qui le jugent »
  alternative: « ceux qui jugent sa vie » ou « ceux qui jugent son âme »
  rationale: Dans ce contexte judiciaire, נֶפֶשׁ renvoie probablement à la personne ou à la vie menacée. Le pronom donne un français naturel tout en évitant de trancher en faveur d’une anthropologie dualiste.
- issue: Portée de שׁפט
  choice: « jugent »
  alternative: « condamnent »
  rationale: Le contexte hostile peut impliquer une condamnation, mais le verbe hébreu signifie formellement juger; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. La métaphore « à la droite » est conservée; la syntaxe reste accessible tout en gardant la dignité du psaume.
