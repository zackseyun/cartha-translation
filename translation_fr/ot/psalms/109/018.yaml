  text: וַ/יִּלְבַּ֥שׁ קְלָלָ֗ה כְּ/מַ֫דּ֥/וֹ וַ/תָּבֹ֣א כַ/מַּ֣יִם בְּ/קִרְבּ֑/וֹ וְ֝/כַ/שֶּׁ֗מֶן בְּ/עַצְמוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: fr
  text: Il a revêtu la malédiction comme un vêtement[a] ; elle est entrée comme de l’eau au-dedans de lui[b], comme de l’huile dans ses os.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il s’est revêtu de malédiction comme d’un vêtement. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans son intérieur » ; on pourrait aussi traduire : « dans ses entrailles », « au plus profond de lui » ou « dans son être intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: Il s’est revêtu
  rationale: Le verbe לבשׁ exprime l’action de se vêtir ou de revêtir quelque chose. La forme pronominale française préserve l’implication personnelle et l’image vestimentaire.
- source_word: קְלָלָה
  choice: de malédiction
  rationale: קְלָלָה peut désigner une malédiction ou le fait de maudire. « Malédiction » maintient ici l’ambiguïté entre la parole de malédiction adoptée par l’homme et ses effets.
- source_word: כְּמַדּוֹ
  choice: comme d’un vêtement
  rationale: מַד désigne un vêtement, parfois une tenue ou une robe. Cette formulation française s’accorde naturellement avec « se revêtir de » sans préciser indûment le type d’habit.
- source_word: וַתָּבֹא
  choice: elle a pénétré
  rationale: Le féminin singulier renvoie à « malédiction ». Avec les images de l’eau et de l’huile, « pénétrer » rend explicitement en français le mouvement vers l’intérieur porté par le verbe et les compléments prépositionnels.
- source_word: כַמַּיִם בְּקִרְבּוֹ
  choice: en lui comme l’eau
  rationale: קֶרֶב désigne l’intérieur ou l’être intérieur. « En lui » est naturel et garde une certaine amplitude, tandis que le parallèle avec les os conserve la dimension corporelle.
- source_word: וְכַשֶּׁמֶן בְּעַצְמוֹתָיו
  choice: comme l’huile dans ses os
  rationale: La comparaison concrète est conservée. « Dans ses os » suit directement l’hébreu et exprime une pénétration profonde sans ajouter « jusqu’à » ou « mêmes ».
theological_decisions:
- issue: Image imprécatoire et agent de la conséquence
  choice: Le texte présente l’homme comme s’étant lui-même revêtu de malédiction, laquelle pénètre ensuite tout son être.
  alternative: Présenter explicitement Dieu comme celui qui fait entrer la malédiction en lui.
  rationale: L’hébreu n’énonce pas ici d’agent divin explicite. La traduction conserve donc la logique poétique du retour de la malédiction sans préciser son mécanisme.
- issue: Sens de קְלָלָה
  choice: Conserver « malédiction », qui peut évoquer à la fois la pratique de maudire et la malédiction qui en résulte.
  alternative: Traduire uniquement par « paroles de malédiction » ou uniquement par « une malédiction » au sens de sanction subie.
  rationale: Le contexte permet une tension entre l’activité adoptée comme un vêtement et son effet qui envahit l’homme ; il ne convient pas de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et les images corporelles sont conservés, avec une syntaxe naturelle. Tous les marqueurs de notes figurent dans le texte principal.
