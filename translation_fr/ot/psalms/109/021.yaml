  terminology: « Yahweh » pour יְהוָה, « mon Seigneur » pour אֲדֹנָי et « amour fidèle » pour חֶסֶד préservent les distinctions terminologiques du texte. Aucun renvoi de note n’est requis pour cette formulation.
