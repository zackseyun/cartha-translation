  source_fidelity: 'La structure de la prière, le contraste initial, les deux impératifs et le sens de חֶסֶד sont bien rendus. Toutefois, l’ordre et la valeur de l’adresse divine יְהוָה אֲדֹנָי ne le sont pas : le texte hébreu dit « Yahweh, mon Seigneur », non « Seigneur Yahweh ».'
