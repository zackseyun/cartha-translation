source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְה֘וִ֤ה אֲדֹנָ֗/י עֲֽשֵׂה אִ֭תִּ/י לְמַ֣עַן שְׁמֶ֑/ךָ כִּי ט֥וֹב חַ֝סְדְּ/ךָ֗ הַצִּילֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: fr
  text: 'Mais toi, Yahweh, mon Seigneur, agis en ma faveur pour l’honneur de ton nom ; car ton amour fidèle est bon : délivre-moi !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: Le pronom explicite et la conjonction marquent ici le contraste avec les adversaires évoqués dans le contexte.
- source_word: יְהוָה אֲדֹנָי
  choice: Seigneur Yahweh
  rationale: Cette formulation conserve les deux désignations divines successives, sans les fondre en un seul titre.
- source_word: עֲשֵׂה אִתִּי
  choice: agis en ma faveur
  rationale: Littéralement proche de « fais avec moi », l’expression demande dans ce contexte une intervention favorable de Dieu; la traduction reste naturelle sans préciser davantage la nature de l’action.
- source_word: לְמַעַן שְׁמֶךָ
  choice: à cause de ton nom
  rationale: La formule exprime un appel fondé sur le nom de Dieu, c’est-à-dire sur ce qu’il est et sur sa réputation.
- source_word: כִּי
  choice: Puisque
  rationale: La conjonction introduit le motif de la demande de délivrance.
- source_word: טוֹב
  choice: bon
  rationale: Le sens adjectival simple est conservé comme prédicat de l’amour fidèle de Dieu.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: Cette expression rend à la fois la bienveillance et la loyauté durable comprises dans חֶסֶד.
- source_word: הַצִּילֵנִי
  choice: délivre-moi
  rationale: Le verbe désigne le fait d’arracher quelqu’un au danger; « délivre-moi » convient au registre des psaumes.
theological_decisions:
- issue: Double appellation divine יְהוָה אֲדֹנָי
  choice: Seigneur Yahweh
  alternative: Seigneur, mon Maître; Seigneur DIEU
  rationale: Le texte hébreu juxtapose deux appellations. « Seigneur Yahweh » les garde distinctes et évite de réduire l’adresse à un seul titre, tout en restant intelligible en français.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: bonté; miséricorde; fidélité à l’alliance
  rationale: Le terme peut évoquer bonté, loyauté et engagement relationnel. « Amour fidèle » préserve cette richesse sans imposer une formulation confessionnelle plus étroite.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif et les deux propositions courtes gardent l’élan de la prière. Aucun marqueur de note n’est nécessaire, car les principales nuances peuvent être conservées directement dans le texte.
