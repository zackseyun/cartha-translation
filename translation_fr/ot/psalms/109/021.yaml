    rationale: La locution peut indiquer une cause générale ; « pour l’honneur de ton nom » rend mieux l’appel à Dieu d’agir en considération de son nom.
  revised_text: 'Mais toi, Yahweh, mon Seigneur, agis en ma faveur pour l’honneur de ton nom ; car ton amour fidèle est bon : délivre-moi !'
