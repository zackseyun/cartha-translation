  text: יַ֗עַן אֲשֶׁ֤ר לֹ֥א זָכַר֮ עֲשׂ֪וֹת חָ֥סֶד וַ/יִּרְדֹּ֡ף אִישׁ עָנִ֣י וְ֭/אֶבְיוֹן וְ/נִכְאֵ֨ה לֵבָ֬ב לְ/מוֹתֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/016.yaml
  text: because he did not remember to show kindness[a], but pursued the poor and needy man, and the brokenhearted[b], to put them to death.
translation:
  language: fr
  text: parce qu’il ne s’est pas souvenu de faire preuve de bonté[a], mais qu’il a poursuivi l’homme pauvre et démuni, ainsi que celui qui avait le cœur brisé[b], pour les mettre à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de pratiquer la miséricorde ». Le mot hébreu חָסֶד peut aussi évoquer l’amour fidèle ou la loyauté liée à une alliance ; ici, il désigne une bonté concrète envers des personnes vulnérables.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’homme pauvre et démuni, et celui dont le cœur est brisé ». Le singulier a probablement une valeur représentative et décrit le genre de personne qu’il prenait pour cible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: parce que
  rationale: La locution introduit la raison du jugement exprimé dans le contexte. « Parce que » en restitue naturellement la valeur causale.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: il ne s’est pas souvenu de faire preuve de bonté
  rationale: זָכַר suivi de l’infinitif exprime ici le fait de ne pas garder à l’esprit une obligation de manière à l’accomplir. Dans ce contexte de conduite envers les personnes vulnérables, « faire preuve de bonté » rend concrètement חָסֶד sans exclure ses nuances de miséricorde, d’amour fidèle ou de loyauté.
- source_word: וַיִּרְדֹּף
  choice: mais qu’il a poursuivi
  rationale: Le verbe évoque une poursuite hostile. « Mais » explicite le contraste contextuel entre l’absence de bonté et l’acharnement contre les faibles, tandis que « poursuivi » conserve l’image du texte hébreu.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: l’homme pauvre et démuni
  rationale: La formulation conserve le singulier אִישׁ et les deux termes décrivant la vulnérabilité matérielle et sociale. Le singulier peut avoir une portée représentative.
- source_word: וְנִכְאֵה לֵבָב
  choice: ainsi que celui qui avait le cœur brisé
  rationale: נִכְאֵה לֵבָב désigne une personne intérieurement accablée ou brisée. Cette formulation française est naturelle tout en préservant le singulier et l’image du cœur.
- source_word: לְמוֹתֵת
  choice: pour les faire mourir
  rationale: L’infinitif indique le but ou l’aboutissement de la poursuite. « Faire mourir » rend la construction causative et la portée létale sans préciser davantage le moyen.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe causale est maintenue pour relier le verset au jugement du contexte. Les singuliers hébreux sont conservés dans la désignation des victimes, tandis que « les » reprend naturellement en français les deux figures mentionnées.
