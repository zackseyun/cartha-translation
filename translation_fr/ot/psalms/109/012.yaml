id: PSA.109.12
reference: Psalms 109:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: fr
  text: Que personne ne continue à lui témoigner de la bonté[a], et que personne ne fasse grâce à ses enfants sans père[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne prolonge sa bonté envers lui » ; l’expression hébraïque parle littéralement de « tirer » ou d’« étendre » la bonté.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses orphelins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: prolonge
  rationale: Le participe évoque littéralement l’action de « tirer » ou d’« étendre »; avec חֶסֶד, « prolonger » exprime naturellement en français la continuité de la bonté accordée.
- source_word: חָסֶד
  choice: bonté
  rationale: Dans ce contexte de relations humaines, « bonté » rend la bienveillance fidèle ou miséricordieuse sans imposer une lecture exclusivement alliancée.
- source_word: חוֹנֵן
  choice: fasse grâce
  rationale: Le verbe חנן désigne l’octroi bienveillant d’une faveur ou de la grâce; cette tournure conserve sa force tout en restant intelligible.
- source_word: יְתוֹמָיו
  choice: ses enfants sans père
  rationale: יָתוֹם peut désigner l’orphelin, souvent plus précisément l’enfant privé de père dans le cadre social de l’hébreu biblique. Le suffixe renvoie aux enfants de l’homme visé.
- source_word: אַל יְהִי
  choice: Que personne ne…
  rationale: La tournure négative au jussif exprime un souhait ou une requête imprécatoire, et non une simple prédiction.
theological_decisions:
- issue: Rendre la requête imprécatoire sans en atténuer la force
  choice: Conserver la formulation directe « Que personne ne… »
  alternative: Employer un futur descriptif comme « Personne ne… » ou « Il n’y aura personne… »
  rationale: Les formes jussives présentent une invocation ou un souhait. La formulation choisie préserve cette tension rhétorique et théologique sans transformer la parole en simple annonce.
translation_notes:
  register: Français international moderne, digne et direct. « Enfants sans père » conserve la précision sociale probable de יָתוֹם, tandis que la note signale l’équivalent français plus compact « orphelins ». Les deux marqueurs de note figurent dans le texte principal.
