  text: וַ/יָּ֘שִׂ֤ימוּ עָלַ֣/י רָ֭עָה תַּ֣חַת טוֹבָ֑ה וְ֝/שִׂנְאָ֗ה תַּ֣חַת אַהֲבָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/005.yaml
  text: They repaid me evil for good[a], and hatred for my love.
translation:
  language: fr
  text: Ils m’ont rendu le mal pour le bien[a], et la haine pour mon amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils ont mis le mal sur moi à la place du bien. » Le verbe hébreu signifie littéralement « mettre, placer », mais il semble exprimer ici l’idée de rendre quelque chose en retour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: Ils m’ont rendu
  rationale: Le verbe signifie littéralement « mettre, placer », mais, avec les deux propositions introduites par תַּחַת, il exprime vraisemblablement ici une rétribution ou un échange. « Rendre » restitue naturellement cette valeur en français.
- source_word: עָלַי
  choice: m’
  rationale: La préposition signifie littéralement « sur moi » ou, selon le contexte, « contre moi ». Dans la tournure française « rendre le mal à quelqu’un », elle est naturellement intégrée au complément indirect « m’ ».
- source_word: רָעָה
  choice: le mal
  rationale: « Le mal » conserve la portée morale et hostile du terme hébreu sans la réduire au seul préjudice concret.
- source_word: תַּחַת
  choice: pour
  rationale: Le mot marque ici la substitution ou l’échange. « Pour » est concis, idiomatique et maintient le parallélisme poétique.
- source_word: טוֹבָה
  choice: le bien
  rationale: « Le bien » préserve la généralité du terme hébreu et forme l’antithèse directe avec « le mal ».
- source_word: וְשִׂנְאָה
  choice: et la haine
  rationale: Le nom abstrait « haine » correspond directement à l’hébreu et équilibre « mon amour » dans le second membre.
- source_word: אַהֲבָתִי
  choice: mon amour
  rationale: Traduction directe du nom avec suffixe de première personne; elle conserve la concision et l’ambiguïté entre le sentiment du psalmiste et l’amour qu’il a manifesté.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme nominal et l’antithèse mal/bien, haine/amour sont conservés. La note maintient visible le sens plus littéral du verbe hébreu.
