  text: יְקַֽלְלוּ הֵמָּה֮ וְ/אַתָּ֪ה תְבָ֫רֵ֥ךְ קָ֤מוּ וַ/יֵּבֹ֗שׁוּ וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: fr
  text: Qu’ils maudissent[a], mais toi, tu béniras. Ils se lèvent et sont couverts de honte[b], mais ton serviteur se réjouira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils peuvent maudire, mais toi, tu béniras », si les premiers inaccomplis sont compris avec une valeur plus concessive ou future.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu dit littéralement : « Ils se lèvent / se sont levés et sont honteux ». Les formes peuvent recevoir une nuance présente, résultative ou prospective. Le fait de se lever peut évoquer une action hostile, mais le texte ne dit pas explicitement qu’ils attaquent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ הֵמָּה
  choice: Qu’ils maudissent
  rationale: Le piel inaccompli de קלל peut ici avoir une valeur permissive ou jussive. Le pronom indépendant הֵמָּה renforce le contraste avec « toi »; en français, celui-ci ressort naturellement de la construction adversative.
- source_word: וְ/אַתָּה תְבָ֫רֵ֥ךְ
  choice: mais toi, tu béniras
  rationale: Le waw marque ici le contraste. La reprise pronominale « toi, tu » rend l’accent porté par le pronom indépendant אַתָּה, tandis que le futur exprime naturellement l’inaccompli de ברך.
- source_word: קָ֤מוּ
  choice: Ils se sont levés
  rationale: Le qal accompli de קום signifie littéralement qu’ils se sont levés. La traduction n’explicite pas une attaque, même si le contexte peut suggérer une action hostile.
- source_word: וַ/יֵּבֹ֗שׁוּ
  choice: et ont été couverts de honte
  rationale: בוש désigne la honte ou la disgrâce subie. Cette formulation exprime ici une humiliation manifeste plutôt qu’un simple sentiment intérieur.
- source_word: וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח
  choice: mais ton serviteur se réjouira
  rationale: Le waw est adversatif en raison du contraste entre la honte des adversaires et la joie du locuteur. « Ton serviteur » conserve l’humble autodésignation du psalmiste, et le futur rend l’inaccompli de שמח.
theological_decisions:
- issue: Référent de « ton serviteur »
  choice: Le locuteur se désigne lui-même avec humilité devant Dieu.
  alternative: Un serviteur juste plus générique.
  rationale: Dans le contexte immédiat, l’expression est une autodésignation du psalmiste en prière. La traduction n’y introduit pas un titre messianique que ce verset n’impose pas.
- issue: Valeur des premiers inaccomplis
  choice: 'Valeur permissive ou jussive : « Qu’ils maudissent… tu béniras ».'
  alternative: 'Valeur concessive ou simplement future : « Ils peuvent maudire… » ou « Ils maudiront… ».'
  rationale: La morphologie et le parallélisme admettent plusieurs nuances. Le texte principal retient une lecture exhortative/permissive idiomatique, tout en signalant l’autre possibilité en note.
translation_notes:
  register: 'Français international moderne, digne et poétique. La répétition « toi, tu » restitue l’emphase hébraïque sans lourdeur excessive. Les temps suivent autant que possible les formes verbales hébraïques : accompli pour les adversaires, futur pour la bénédiction divine et la joie du serviteur.'
