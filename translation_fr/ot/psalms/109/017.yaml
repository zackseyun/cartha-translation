  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: fr
  text: Il a aimé la malédiction[a], et elle est venue sur lui ; il n’a pas pris plaisir à la bénédiction[b], et elle s’est éloignée de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une malédiction ». Le nom hébreu peut désigner soit la malédiction en général, soit une malédiction particulière.
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne désirait pas la bénédiction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: Il aimait
  rationale: Le qal de אהב exprime ici l’attachement ou l’inclination. L’imparfait français convient au portrait du comportement habituel qui entraîne les conséquences décrites.
- source_word: קְלָלָה
  choice: la malédiction
  rationale: Le nom peut désigner la malédiction comme réalité générale ou une malédiction particulière. Le français emploie naturellement l’article défini dans cette opposition poétique avec « la bénédiction »; une note conserve l’autre lecture.
- source_word: וַתְּבוֹאֵהוּ
  choice: elle est venue sur lui
  rationale: Le sujet féminin renvoie à la malédiction. « Venir sur quelqu’un » conserve l’image hébraïque d’une conséquence qui atteint la personne.
- source_word: וְלֹא חָפֵץ
  choice: Il ne prenait pas plaisir à
  rationale: חפץ peut exprimer le plaisir, le désir ou l’agrément. Cette formulation maintient le contraste affectif avec « aimait » sans réduire le sens à une simple décision.
- source_word: בִּבְרָכָה
  choice: la bénédiction
  rationale: Le substantif s’oppose directement à קְלָלָה et désigne ici la bénédiction comme réalité ou catégorie.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: elle s’est éloignée de lui
  rationale: רחק signifie être ou devenir éloigné. Le verbe narratif peut ici exprimer l’éloignement résultant de la bénédiction; cette traduction préserve le mouvement possible sans imposer une durée continue.
