  text: א֘וֹדֶ֤ה יְהוָ֣ה מְאֹ֣ד בְּ/פִ֑/י וּ/בְ/ת֖וֹךְ רַבִּ֣ים אֲהַֽלְלֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: fr
  text: Je rendrai de très grandes grâces à Yahweh de ma bouche ; au milieu de beaucoup de gens, je le louerai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: je remercierai
  rationale: Le hifil de ידה exprime ici l’action de remercier ou de célébrer dans un cadre de louange. « Je remercierai » est naturel en français et maintient le parallélisme avec « je le louerai ».
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה ; sa translittération préserve le nom propre sans le remplacer par un titre.
- source_word: מְאֹ֣ד
  choice: avec ferveur
  rationale: מאד intensifie l’action de remercier. « Avec ferveur » rend de façon naturelle et poétique l’idée d’intensité, sans la confondre avec la quantité.
- source_word: בְּפִי
  choice: de ma bouche
  rationale: La préposition ב avec « bouche » indique le moyen d’expression. « De ma bouche » conserve l’image corporelle concrète et s’intègre naturellement à l’ordre poétique français.
- source_word: וּבְתוֹךְ רַבִּים
  choice: au milieu d’un grand nombre
  rationale: Cette formulation reste proche du sens spatial et collectif de l’hébreu, sans ajouter une « assemblée » qui n’est pas explicitement mentionnée.
- source_word: אֲהַלְלֶנּוּ
  choice: je le louerai
  rationale: Le piel de הלל signifie ici « louer » ; le suffixe masculin singulier renvoie à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie le Tétragramme comme nom propre. « Yahweh » le représente directement, tandis que « le Seigneur » substituerait un titre au nom.
- issue: Portée de וּבְתוֹךְ רַבִּים
  choice: au milieu d’un grand nombre
  alternative: dans l’assemblée nombreuse
  rationale: L’hébreu évoque de nombreuses personnes sans employer explicitement un terme signifiant « assemblée ». La traduction évite donc de préciser davantage la scène.
translation_notes:
  register: Français international moderne, digne et poétique. L’ordre initial « De ma bouche » conserve la mise en relief de l’expression vocale ; le point-virgule fait ressortir le parallélisme hébraïque.
