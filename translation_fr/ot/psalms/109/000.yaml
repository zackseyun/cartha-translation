lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Rend la désignation traditionnelle du responsable de l’exécution musicale dans un français actuel et intelligible.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Ô Dieu de ma louange
  rationale: Conserve l’expression construite et poétique de l’hébreu sans préciser indûment si Dieu est l’objet, la source ou le motif de la louange du psalmiste.
- source_word: אַל־תֶּחֱרַשׁ
  choice: ne garde pas le silence
  rationale: Expression française naturelle qui garde la force de la demande négative et l’image du silence divin.
theological_decisions:
- issue: Relation exprimée par לְדָוִד dans la suscription
  choice: De David
  alternative: Par David, pour David ou à David
  rationale: La formulation traditionnelle reste concise, tandis qu’une note conserve l’ambiguïté réelle de la préposition hébraïque.
- issue: Sens de « Dieu de ma louange »
  choice: Maintien de la construction ouverte
  alternative: Dieu que je loue
  rationale: La traduction littéraire retenue évite de réduire l’expression au seul sens objectif et préserve sa densité théologique.
translation_notes:
  register: Français international moderne, poétique et digne. La suscription reste brève ; le vocatif « Ô Dieu » et « ne garde pas le silence » conviennent au registre de la prière sans archaïsme excessif.
