source:
  edition: WLC
  text: תְּהִי ל֭/וֹ כְּ/בֶ֣גֶד יַעְטֶ֑ה וּ֝/לְ/מֵ֗זַח תָּמִ֥יד יַחְגְּרֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: fr
  text: Qu’elle soit pour lui comme un vêtement dont il s’enveloppe[a], et comme une ceinture qu’il attache sans cesse autour de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’elle soit pour lui comme un habit qu’il revêt, et comme une ceinture qu’il porte constamment. »'
    reason: 'Alternative lexicale : « revêt » rend de façon plus simple l’action de mettre le vêtement, tandis que « porte » exprime l’état durable associé à la ceinture.'
lexical_decisions:
- source_word: תְּהִי
  choice: Qu’elle soit
  rationale: Le jussif qal à la 3e personne du féminin singulier exprime ici un souhait imprécatoire et s’accorde avec la malédiction évoquée au verset précédent.
- source_word: ל֭וֹ
  choice: pour lui
  rationale: La préposition avec suffixe marque le rapport à l’homme visé; sa traduction explicite conserve la structure et le sens de l’hébreu.
- source_word: כְּבֶ֣גֶד
  choice: comme un vêtement
  rationale: בגד est un terme général désignant un vêtement, sans en préciser le type.
- source_word: יַעְטֶ֑ה
  choice: dont il s’enveloppe
  rationale: Le verbe עטה peut signifier se couvrir ou s’envelopper d’un vêtement; cette formulation préserve l’image de quelque chose qui entoure l’homme.
- source_word: וּ֝לְמֵ֗זַח
  choice: comme une ceinture
  rationale: מזח désigne ce que l’on attache autour de la taille; « ceinture » est clair et actuel en français.
- source_word: תָּמִ֥יד
  choice: constamment
  rationale: L’adverbe exprime la continuité ou la permanence.
- source_word: יַחְגְּרֶֽהָ
  choice: qu’il porte
  rationale: חגר signifie ceindre ou attacher autour de la taille. Avec « ceinture », « porter » produit un français naturel, tandis que la note conserve l’image verbale plus précise.
theological_decisions:
- issue: Valeur imprécatoire du jussif dans le contexte de la malédiction
  choice: 'Traduire comme un souhait ou une prière de jugement : « Qu’elle soit… »'
  alternative: 'Traduire comme une prédiction : « Elle sera… »'
  rationale: La forme verbale et le contexte imprécatoire du psaume favorisent l’expression d’un jugement souhaité plutôt qu’une simple annonce, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Qu’elle » reprend naturellement la malédiction du contexte immédiat. La formulation principale privilégie la fluidité tout en conservant les deux comparaisons parallèles; la note présente une version plus formelle et littérale.
