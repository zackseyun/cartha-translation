id: PSA.109.11
reference: Psalms 109:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְנַקֵּ֣שׁ נ֭וֹשֶׁה לְ/כָל אֲשֶׁר ל֑/וֹ וְ/יָבֹ֖זּוּ זָרִ֣ים יְגִיעֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/011.yaml
  text: May a creditor seize all that belongs to him[a], and may strangers plunder the fruit of his labor.
translation:
  language: fr
  text: Que son créancier saisisse tout ce qui lui appartient[a], et que des étrangers pillent le fruit de son travail !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prenne au piège » ; le verbe hébreu peut évoquer un piège ou une capture. Ici, avec « créancier », il désigne probablement la mainmise de celui-ci sur tous ses biens.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: saisisse
  rationale: Le piel de נקש peut évoquer le fait de prendre au piège ou d’attraper. Avec נוֹשֶׁה (« créancier ») et « tout ce qui lui appartient », « saisisse » exprime naturellement la mainmise du créancier sur ses biens.
- source_word: נוֹשֶׁה
  choice: créancier
  rationale: Le terme désigne celui qui prête et réclame le remboursement. « Créancier » est précis, courant et n’impose pas l’idée plus étroite d’un prêteur professionnel.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: tout ce qui lui appartient
  rationale: Cette formulation rend la portée globale de כָל et la valeur possessive de אֲשֶׁר לוֹ dans un français naturel.
- source_word: וְיָבֹזּוּ
  choice: pillent
  rationale: בזז désigne le fait d’emporter des biens comme butin. « Piller » conserve la force prédatrice et violente du verbe.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le mot désigne des personnes extérieures au cercle familial ou communautaire. « Étrangers » préserve cette largeur sans préciser indûment une nationalité.
- source_word: יְגִיעוֹ
  choice: le fruit de son travail
  rationale: יְגִיעַ peut désigner ce que le labeur produit ou procure, plutôt que l’activité seule. Cette expression française rend clairement les biens acquis par son travail.
theological_decisions:
- issue: Valeur imprécatoire des yiqtol
  choice: Formuler des souhaits ou imprécations avec « Que… »
  alternative: 'Les rendre comme de simples futurs : « Son créancier saisira… et des étrangers pilleront… »'
  rationale: Dans la série d’imprécations du Psaume 109, les formes verbales expriment ici des souhaits ou appels plutôt qu’une simple prédiction. La tournure « Que… » en conserve la force sans effacer la tension du passage.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme est conservé par les deux propositions introduites par « que ». Le point d’exclamation rend la force imprécatoire de l’ensemble.
