  text: עָ֭זְרֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י ה֭וֹשִׁיעֵ֣/נִי כְ/חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/026.yaml
  text: Help me[a], O Yahweh my God; save me according to your steadfast love.
translation:
  language: fr
  text: Viens à mon aide, Yahvé, mon Dieu ; sauve-moi selon ton amour fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sauve-moi conformément à ta fidélité à l’alliance ». Le mot hébreu חֶסֶד désigne un amour loyal et constant et peut comporter une dimension d’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנִי
  choice: Viens à mon aide
  rationale: Impératif de עזר avec suffixe de première personne du singulier. Cette tournure française naturelle conserve le caractère direct et pressant de l’appel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que son remplacement par un titre.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: La forme avec suffixe de première personne du singulier constitue ici une adresse personnelle en apposition à Yahvé.
- source_word: הוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: Impératif hiphil de ישׁע avec suffixe de première personne du singulier. « Sauve-moi » garde la portée générale du verbe et son lien lexical avec le salut.
- source_word: כְחַסְדֶּךָ
  choice: selon ton amour fidèle
  rationale: La préposition כְּ exprime ici la norme ou la mesure, tandis que חֶסֶד désigne un amour loyal et constant, susceptible de comporter une dimension d’alliance.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à ton alliance
  rationale: « Amour fidèle » rend ensemble les dimensions affective, loyale et durable du terme sans rendre explicite une référence à l’alliance qui demeure ici implicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux impératifs est conservé, ainsi que l’adresse personnelle « Yahvé, mon Dieu ».
