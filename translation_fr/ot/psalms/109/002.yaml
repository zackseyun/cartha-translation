  yaml_path: translation/ot/psalms/109/002.yaml
  text: For the mouth of the wicked and the mouth of deceit have opened against me[b][a]; they have spoken to me with a lying tongue.
translation:
  language: fr
  text: Car la bouche du méchant et la bouche trompeuse se sont ouvertes contre moi[a] ; elles m’ont parlé avec une langue mensongère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « la bouche du méchant et une bouche trompeuse se sont ouvertes contre moi ». L’hébreu répète littéralement le mot « bouche ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « elles ont parlé avec moi avec une langue de mensonge ». Dans ce contexte hostile, il s’agit vraisemblablement de paroles mensongères adressées au psalmiste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel du psalmiste dans le contexte immédiat et conserve la valeur causale.
- source_word: פִי רָשָׁע
  choice: la bouche du méchant
  rationale: Rend littéralement la construction « bouche de [quelqu’un de] méchant » tout en gardant le singulier substantivé.
- source_word: וּפִי מִרְמָה
  choice: et la bouche trompeuse
  rationale: Préserve la répétition hébraïque de « bouche » et rend מִרְמָה adjectivement dans un français naturel, sans perdre l’idée de tromperie.
- source_word: עָלַי פָּתָחוּ
  choice: se sont ouvertes contre moi
  rationale: Conserve l’image concrète de bouches qui s’ouvrent et la valeur hostile de עָלַי ; le pluriel correspond aux deux sujets coordonnés.
- source_word: דִּבְּרוּ אִתִּי
  choice: ils m’ont parlé
  rationale: Exprime naturellement en français une parole adressée au psalmiste ; l’hébreu peut aussi se lire plus littéralement « ils ont parlé avec moi ».
- source_word: לְשׁוֹן שָׁקֶר
  choice: avec une langue mensongère
  rationale: Maintient l’image corporelle de la « langue » et rend la construction hébraïque de façon claire et digne.
