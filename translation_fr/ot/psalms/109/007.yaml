  text: בְּ֭/הִשָּׁ֣פְט/וֹ יֵצֵ֣א רָשָׁ֑ע וּ֝/תְפִלָּת֗/וֹ תִּהְיֶ֥ה לַֽ/חֲטָאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/007.yaml
  text: When he is judged[a], let him come out guilty[b], and let his prayer become sin.
translation:
  language: fr
  text: Quand il sera jugé, qu’il soit reconnu coupable[a], et que sa prière devienne un péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il en sorte méchant ». Le mot hébreu רָשָׁע peut signifier « méchant », mais, dans ce contexte judiciaire, il désigne probablement celui qui est reconnu coupable.
    reason: lexical_alternative
  - marker: b
    text: Ou « que sa prière lui soit comptée comme un péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Quand il sera jugé
  rationale: La préposition בְּ suivie de l’infinitif construit niphal de שׁפט et du suffixe de troisième personne du masculin singulier a ici une valeur temporelle. Cette formulation conserve la voix passive et le cadre judiciaire.
- source_word: יֵצֵא רָשָׁע
  choice: qu’il soit reconnu coupable
  rationale: Dans un contexte judiciaire, יֵצֵא décrit l’issue du procès et רָשָׁע peut désigner celui qui est déclaré coupable. La tournure française rend naturellement l’expression hébraïque sans donner au verbe une valeur simplement future.
- source_word: וּתְפִלָּתוֹ
  choice: et que sa prière
  rationale: תְּפִלָּה signifie « prière ». La conjonction relie cette proposition à la précédente dans une même série de demandes imprécatoires.
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: devienne un péché
  rationale: היה avec ל peut exprimer un résultat ou un devenir. La traduction directe maintient l’idée saisissante que sa prière elle-même aboutisse à être péché, sans préciser davantage le mécanisme.
theological_decisions:
- issue: Valeur des formes verbales dans le contexte imprécatoire
  choice: 'Les rendre comme une demande ou un souhait : « qu’il soit… que sa prière devienne… »'
  alternative: 'Les rendre comme une prédiction : « il sera… sa prière deviendra… »'
  rationale: Le contexte du psaume favorise une série de demandes adressées à Dieu. Le subjonctif français en conserve la force sans transformer ces paroles en simple annonce de l’avenir.
- issue: Sens de la prière qui « devient un péché »
  choice: Conserver l’expression directe et ambiguë « que sa prière devienne un péché »
  alternative: 'Expliciter : « que sa prière lui soit comptée comme un péché »'
  rationale: L’hébreu ne précise pas explicitement s’il s’agit d’une imputation, d’un résultat ou de la qualité morale de la prière. Le texte principal préserve cette tension, tandis que la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, sobre et digne. « Reconnu coupable » rend naturellement l’issue judiciaire exprimée par l’hébreu, tandis que « devienne un péché » en préserve la formulation concise et la tension théologique.
