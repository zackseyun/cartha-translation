  text: שִׁ֥יר מִזְמ֗וֹר לִ/בְנֵ֫י קֹ֥רַח לַ/מְנַצֵּ֣חַ עַל מָחֲלַ֣ת לְ/עַנּ֑וֹת מַ֝שְׂכִּ֗יל לְ/הֵימָ֥ן הָ/אֶזְרָחִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/000.yaml
  text: 'A song. A psalm of the sons of Korah. For the choirmaster: according to Mahalath Leannoth[a]. A Maskil[b] of Heman the Ezrahite.'
translation:
  language: fr
  text: Chant. Psaume des fils de Coré. Pour le chef de chœur, sur Mahalath Leannoth[a]. Maskil[b] d’Hémân, l’Ézrahite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « Mahalath Leannoth » est incertaine. Elle peut désigner un air ou un mode musical. On propose aussi : « sur Mahalath, pour un chant responsorial » ou « sur Mahalath, au sujet de l’affliction ».'
    reason: lexical_alternative
  - marker: b
    text: « Maskil » est un terme technique employé dans les titres de psaumes; il désigne souvent une composition à caractère didactique ou méditatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר מִזְמוֹר
  choice: Chant. Psaume
  rationale: Les deux désignations de genre sont conservées séparément, conformément à l’hébreu, dans une formulation concise propre aux titres de psaumes.
- source_word: לִבְנֵי קֹרַח
  choice: des fils de Coré
  rationale: 'Le complément français reste naturel tout en laissant ouverte la relation exacte exprimée par ל : auteur, groupe associé ou destinataire.'
- source_word: לַמְנַצֵּחַ
  choice: Pour le chef de chœur
  rationale: Équivalent français courant du terme de direction musicale, sans prétendre préciser davantage la fonction antique.
- source_word: עַל מָחֲלַת לְעַנּוֹת
  choice: sur Mahalath Leannoth
  rationale: « Sur » convient à une indication possible d’air ou de mode d’exécution. Les termes incertains sont translittérés plutôt que traduits de manière conjecturale.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le terme technique, dont la nuance exacte reste discutée, est conservé en translittération et expliqué en note.
- source_word: לְהֵימָן הָאֶזְרָחִי
  choice: d’Hémân, l’Ézrahite
  rationale: La formulation française est idiomatique; « d’Hémân » ne tranche pas entièrement entre attribution, appartenance et association.
