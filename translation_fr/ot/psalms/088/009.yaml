source:
  edition: WLC
  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: fr
  text: Mon œil dépérit à cause de l’affliction. Je t’invoque chaque jour, Yahweh ; je tends les mains vers toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינִי
  choice: Mon œil
  rationale: Le singulier hébreu est conservé ; dans ce langage poétique, l’œil représente concrètement la vue, la vigueur ou la personne souffrante.
- source_word: דָאֲבָה
  choice: dépérit
  rationale: Le verbe exprime le fait de languir ou de perdre ses forces sous l’effet de la souffrance. « Dépérit » rend cette dégradation progressive avec naturel.
- source_word: מִנִּי עֹנִי
  choice: à cause de l’affliction
  rationale: La préposition indique ici la cause ou la source, et עֹנִי désigne la détresse ou l’affliction.
- source_word: קְרָאתִיךָ
  choice: Je t’invoque
  rationale: Avec « chaque jour », l’accompli hébreu se comprend naturellement comme une action habituelle. « Invoquer » convient à l’appel adressé à Dieu sans en accentuer artificiellement l’intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּכָל יוֹם
  choice: chaque jour
  rationale: L’expression marque ici la répétition quotidienne plutôt qu’une action ininterrompue durant toute une journée.
- source_word: שִׁטַּחְתִּי אֵלֶיךָ כַפָּי
  choice: je tends les mains vers toi
  rationale: L’expression décrit le geste de supplication. Le français idiomatique « tendre les mains » restitue ce geste, même si le verbe hébreu évoque littéralement le fait de les déployer et que כַּפַּיִם désigne les paumes ou les mains.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom propre sans lui substituer un titre.
translation_notes:
  register: Français moderne, digne et poétique. Le singulier concret « mon œil » et la progression sombre du verbe « dépérit » sont maintenus ; la syntaxe reste claire pour une lecture courante.
