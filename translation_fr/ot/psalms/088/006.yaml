  text: שַׁ֭תַּ/נִי בְּ/ב֣וֹר תַּחְתִּיּ֑וֹת בְּ֝/מַחֲשַׁכִּ֗ים בִּ/מְצֹלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/006.yaml
  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: fr
  text: Tu m’as placé au plus profond de la fosse[a], dans les lieux obscurs, dans les abîmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la fosse des régions les plus basses ».
    reason: 'Alternative syntaxique et lexicale : תַּחְתִּיּוֹת peut être compris comme un pluriel substantivé, « les régions les plus basses », plutôt que comme une qualification idiomatique de la profondeur de la fosse.'
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Tu m’as placé
  rationale: Le verbe signifie « mettre, placer ». Le passé composé convient au français actuel et maintient l’attribution directe de l’action à Dieu.
- source_word: בְּבוֹר
  choice: dans la fosse
  rationale: בּוֹר peut désigner une fosse, une citerne ou un lieu semblable à un cachot. « Fosse » conserve ici l’image poétique liée à la mort sans préciser excessivement « tombe ».
- source_word: תַּחְתִּיּוֹת
  choice: au plus profond
  rationale: Le terme évoque les parties ou régions les plus basses. Cette tournure française naturelle exprime l’extrême profondeur tout en laissant la construction hébraïque ouverte à l’idée des régions inférieures.
- source_word: בְּמַחֲשַׁכִּים
  choice: dans les lieux obscurs
  rationale: Le pluriel hébreu désigne des lieux obscurs ou des ténèbres. « Les lieux obscurs » préserve la pluralité concrète et le parallélisme poétique.
- source_word: בִּמְצֹלוֹת
  choice: dans les abîmes
  rationale: Le mot désigne des profondeurs, notamment celles des eaux. « Abîmes » rend naturellement en français l’image de profondeurs accablantes sans la réduire à un seul référent.
theological_decisions:
- issue: L’action de Dieu dans la plainte
  choice: 'Maintien de l’adresse directe : « Tu m’as placé »'
  alternative: Une formulation impersonnelle qui atténuerait l’action attribuée à Dieu
  rationale: L’hébreu présente explicitement Dieu comme celui qui a placé le psalmiste dans cette situation. La traduction conserve ainsi la tension théologique propre à la plainte.
translation_notes:
  register: Français international moderne, digne et poétique. Le tutoiement conserve l’adresse directe du psaume. Le rythme ternaire et l’accumulation des images de profondeur et d’obscurité sont maintenus.
