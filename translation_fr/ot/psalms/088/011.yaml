  text: הַ/יְסֻפַּ֣ר בַּ/קֶּ֣בֶר חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ בָּ/אֲבַדּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: fr
  text: Ton amour fidèle est-il proclamé dans la tombe, ta fidélité dans l’Abaddon[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la destruction » ou « dans le lieu de destruction ». L’hébreu « Abaddon » est un terme poétique désignant le domaine de la ruine et de la mort.
    reason: Alternative lexicale et précision du référent poétique.
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: est-il proclamé
  rationale: 'Le pual imparfait de ספר, précédé de l’interrogatif ה, exprime une question rhétorique au passif : « est-il raconté/proclamé ? ». « Est-il proclamé » est naturel en français et conserve le sens passif.'
- source_word: בַּקֶּבֶר
  choice: dans la tombe
  rationale: קֶבֶר désigne la tombe ou le lieu de sépulture. « Dans la tombe » est clair, idiomatique et convient au parallélisme poétique.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד associe l’amour à la loyauté durable. « Amour fidèle » en restitue la richesse sans imposer explicitement une interprétation confessionnelle de type « amour d’alliance ».
- source_word: אֱמוּנָתְךָ
  choice: ta fidélité
  rationale: אֱמוּנָה désigne ici la fiabilité et la fidélité de Dieu, en parallèle avec חֶסֶד.
- source_word: בָּאֲבַדּוֹן
  choice: dans l’Abaddon
  rationale: אֲבַדּוֹן peut désigner la destruction ou le domaine de la perdition et de la mort. La translittération préserve l’image poétique hébraïque ainsi que son parallélisme avec la tombe; les sens possibles sont précisés en note.
theological_decisions:
- issue: Faut-il rendre אֲבַדּוֹן comme un nom commun ou conserver le terme poétique hébreu ?
  choice: Conserver « l’Abaddon » dans le texte principal.
  alternative: « la destruction » ou « le lieu de perdition »
  rationale: Dans son parallélisme avec « la tombe », le mot évoque vraisemblablement le domaine de la ruine et des morts plutôt qu’une destruction purement abstraite. Le conserver évite de réduire cette portée tout en laissant la note présenter les autres traductions possibles.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure interrogative et l’ellipse du second membre conservent le parallélisme hébreu; « l’Abaddon » garde volontairement l’étrangeté du terme source, expliquée en note.
