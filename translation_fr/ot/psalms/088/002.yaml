  yaml_path: translation/ot/psalms/088/002.yaml
  text: May my prayer come before you[b][a]; incline your ear to my cry.
translation:
  language: fr
  text: Que ma prière vienne devant toi ! Tends l’oreille à mon cri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּבוֹא
  choice: Que … parvienne
  rationale: L’imparfait qal, accordé avec le sujet féminin « ma prière », exprime ici une demande à valeur jussive. La tournure « Que… » la restitue naturellement en français.
- source_word: לְפָנֶיךָ
  choice: jusqu’à toi
  rationale: L’expression signifie littéralement « devant ta face » et désigne l’arrivée dans la présence de Dieu. « Jusqu’à toi » s’accorde naturellement avec « parvienne » tout en conservant l’idée d’une prière portée directement devant Dieu.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: תְּפִלָּה désigne normalement la prière; ce choix conserve le terme général sans le réduire à une supplication particulière.
- source_word: הַטֵּה
  choice: Tends
  rationale: L’impératif hiphil de נטה évoque le fait d’incliner ou de tendre. Avec « l’oreille », « tends l’oreille » est une expression française actuelle et naturelle qui traduit l’appel à une écoute attentive.
- source_word: אָזְנְךָ
  choice: l’oreille
  rationale: Le singulier de l’hébreu est conservé dans l’expression idiomatique française « tendre l’oreille ».
- source_word: לְרִנָּתִי
  choice: à mon cri
  rationale: רִנָּה peut désigner un cri retentissant, de joie ou de détresse selon le contexte. Dans cette lamentation, « mon cri » rend l’intensité sans introduire une nuance de joie.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé, avec une demande jussive au premier membre et un impératif au second. « Tends l’oreille » privilégie un idiome français courant plutôt que le plus littéral « incline ton oreille ».
