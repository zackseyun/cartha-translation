  text: הִרְחַ֣קְתָּ מִ֭מֶּ/נִּי אֹהֵ֣ב וָ/רֵ֑עַ מְֽיֻדָּעַ֥/י מַחְשָֽׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: fr
  text: Tu as éloigné de moi celui qui m’aime et mon compagnon ; mes connaissances sont ténèbres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mes connaissances sont dans les ténèbres ». La fin du texte hébreu est particulièrement concise et peut aussi se comprendre, de manière interprétative, comme : « les ténèbres sont ma seule compagnie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Tu as éloigné
  rationale: Le hiphil accompli à la 2e personne du singulier exprime ici une mise à distance causée par Dieu, directement interpellé.
- source_word: מִמֶּנִּי
  choice: de moi
  rationale: La préposition מִן avec suffixe de première personne marque la séparation d’avec le psalmiste.
- source_word: אֹהֵב
  choice: celui qui m’aime
  rationale: Le participe substantivé désigne une personne qui aime le psalmiste. Cette formulation conserve le point de vue actif, contrairement à « bien-aimé ».
- source_word: וָרֵעַ
  choice: et mon compagnon
  rationale: רֵעַ désigne ici un ami ou un compagnon. « Compagnon » évite de répéter la notion déjà exprimée par « celui qui m’aime » et garde le parallélisme relationnel.
- source_word: מְיֻדָּעַי
  choice: mes connaissances
  rationale: Le terme désigne les personnes connues du locuteur. « Mes connaissances » maintient son sens distinct de celui des relations plus proches mentionnées auparavant.
- source_word: מַחְשָׁךְ
  choice: ce sont les ténèbres
  rationale: Le nom conclut une proposition nominale extrêmement elliptique. La tournure française conserve la prédication abrupte selon laquelle les connaissances du psalmiste sont les ténèbres, sans expliciter davantage l’image.
theological_decisions:
- issue: Rapport syntaxique de מְיֻדָּעַי avec מַחְשָׁךְ
  choice: mes connaissances, ce sont les ténèbres
  alternative: les ténèbres sont ma seule compagnie / mes connaissances sont dans les ténèbres
  rationale: Le texte massorétique permet plusieurs compréhensions de cette clausule très brève. Le texte principal suit l’ordre des mots et lit « les ténèbres » comme prédicat, tandis que la note préserve les autres analyses possibles sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. L’adresse directe à Dieu est rendue par « tu », conformément au registre habituel des psaumes. La dernière proposition demeure volontairement abrupte afin de préserver la force et l’ambiguïté de l’hébreu.
