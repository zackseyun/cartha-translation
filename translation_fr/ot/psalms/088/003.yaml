source:
  edition: WLC
  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: fr
  text: Car mon âme est comblée de malheurs, et ma vie approche du séjour des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Shéol » ou « de la tombe ». Le terme hébreu est Shéol.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la cause de la détresse exprimée dans le contexte et conserve naturellement la valeur causale de la conjonction.
- source_word: שָׂבְעָה
  choice: est comblée
  rationale: Le verbe signifie être rassasié ou rempli. « Est comblée de » garde l’image d’une saturation, ici avec une forte valeur négative.
- source_word: בְרָעוֹת
  choice: de malheurs
  rationale: Dans ce contexte de lamentation, le pluriel désigne les calamités et souffrances qui accablent le psalmiste, non le mal moral qu’il aurait commis.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Conserve la distinction poétique avec חַיַּי, rendu par « ma vie », tout en restant intelligible en français biblique moderne.
- source_word: וְחַיַּי
  choice: et ma vie
  rationale: חַיִּים est morphologiquement pluriel mais fonctionne couramment comme un nom abstrait singulier désignant la vie.
- source_word: לִשְׁאוֹל
  choice: du séjour des morts
  rationale: Rend le concept hébreu du Shéol en français courant sans le réduire à la seule tombe ni lui imposer une conception doctrinale ultérieure.
- source_word: הִגִּיעוּ
  choice: approche
  rationale: Le verbe signifie atteindre ou arriver. Dans ce contexte poétique, « approche du » exprime idiomatiquement l’imminence de la mort sans prétendre que le psalmiste y est déjà arrivé.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol ; la tombe
  rationale: « Le séjour des morts » communique directement le monde des morts évoqué par le terme hébreu, sans le limiter à une sépulture physique ni l’identifier à une catégorie théologique postérieure. Une note conserve le terme source et les autres possibilités.
translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme entre « mon âme » et « ma vie » est conservé, ainsi que l’image d’une existence saturée de malheurs.
