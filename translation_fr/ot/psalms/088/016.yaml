  text: Your burning anger swept over me[c][b][a]; your terrors destroyed me.
translation:
  language: fr
  text: Ta colère brûlante a déferlé sur moi[a] ; tes terreurs m’ont anéanti[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta colère brûlante est passée sur moi » ; le verbe hébreu signifie littéralement « passer », mais le contexte évoque une force qui submerge.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’ont détruit » ou « m’ont retranché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: a déferlé sur moi
  rationale: Le verbe עבר signifie littéralement « passer » ou « traverser ». Avec la colère comme sujet, « déferler sur » conserve l’image d’un mouvement qui submerge et exprime naturellement la force accablante du contexte poétique.
- source_word: חֲרוֹנֶיךָ
  choice: ta colère brûlante
  rationale: Le nom חרון désigne une colère ardente. Le singulier français rend naturellement le pluriel hébreu intensif ou abstrait, tandis que « brûlante » préserve l’image de la chaleur.
- source_word: בִּעוּתֶיךָ
  choice: tes terreurs
  rationale: Le terme désigne des terreurs ou des choses qui inspirent l’effroi. « Tes terreurs » est direct, digne et conserve la formulation fortement personnifiée du psaume.
- source_word: צִמְּתוּתֻנִי
  choice: m’ont anéanti
  rationale: Le verbe צמת peut signifier détruire, exterminer ou retrancher. « Anéantir » restitue l’intensité extrême de la lamentation sans imposer une interprétation plus précise que le contexte.
