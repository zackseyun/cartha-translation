lexical_decisions:
- source_word: סַבּוּנִי
  choice: Ils m’encerclent
  rationale: Le qal accompli de סבב avec suffixe de première personne décrit l’encerclement du psalmiste. Le présent français rend naturellement, dans ce tableau poétique, une détresse vécue comme actuelle et continue.
- source_word: כַמַּיִם
  choice: comme de l’eau
  rationale: Le préfixe כ introduit une comparaison. « Comme de l’eau » est idiomatique et conserve l’image d’une menace qui submerge et enveloppe.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette expression temporelle indique une action qui dure pendant toute la journée. La formulation retenue garde cette valeur durative dans un registre poétique naturel.
- source_word: הִקִּיפוּ
  choice: ils se referment sur moi
  rationale: Le verbe est parallèle à סבב et renforce l’image d’un encerclement hostile. « Se referment sur moi » évite une répétition lourde tout en exprimant le resserrement de l’étau.
- source_word: עָלַי
  choice: sur moi
  rationale: La préposition על signifie ici « sur/contre » dans un contexte hostile. Elle s’intègre naturellement à l’expression française « se refermer sur quelqu’un ».
- source_word: יָחַד
  choice: tous ensemble
  rationale: L’adverbe exprime l’action collective et concertée des menaces. « Tous ensemble » en explicite la force sans ajouter d’idée étrangère.
