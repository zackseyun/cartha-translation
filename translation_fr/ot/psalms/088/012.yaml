  text: הֲ/יִוָּדַ֣ע בַּ/חֹ֣שֶׁךְ פִּלְאֶ֑/ךָ וְ֝/צִדְקָתְ/ךָ֗ בְּ/אֶ֣רֶץ נְשִׁיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: fr
  text: Ton prodige est-il connu dans les ténèbres, ou ta justice[a] dans le pays de l’oubli[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture ».
    reason: lexical_alternative
  - marker: b
    text: Le « pays de l’oubli » est une expression poétique qui désigne le séjour des morts.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/יִוָּדַע
  choice: Fait-on connaître
  rationale: Le nifal imparfait de ידע, dans une interrogation rhétorique, est rendu par une tournure passive à valeur générale, naturelle en français.
- source_word: בַּ/חֹשֶׁךְ
  choice: dans les ténèbres
  rationale: La préposition avec l’article appelle « dans les ténèbres » ; dans le contexte, l’expression évoque aussi le domaine des morts.
- source_word: פִּלְאֶךָ
  choice: ton prodige
  rationale: Le singulier hébreu est conservé. « Prodige » exprime une manifestation merveilleuse de l’action divine sans imposer le sens plus étroit de « miracle ».
- source_word: וְצִדְקָתְךָ
  choice: ou ta justice
  rationale: Dans le parallélisme interrogatif français, « ou » relie naturellement les deux membres. צדקה peut désigner la justice ou la droiture ; « justice » est ici idiomatique et garde la dimension des actes justes de Dieu.
- source_word: בְּ/אֶרֶץ
  choice: dans le pays
  rationale: La construction avec le nom suivant se rend naturellement par « dans le pays de… » et maintient l’image poétique d’un domaine.
- source_word: נְשִׁיָּה
  choice: l’oubli
  rationale: Le nom dénote l’oubli ou l’effacement du souvenir. « L’oubli » est clair, poétique et moins abstrait que « oubliance ».
theological_decisions:
- issue: Sens de צדקה dans ce contexte poétique
  choice: justice
  alternative: droiture
  rationale: Le terme hébreu couvre la conformité au droit, la droiture et les actes justes. « Justice » convient au français courant, tandis que « droiture » demeure une possibilité lexicale signalée en note.
translation_notes:
  register: Français moderne, digne et poétique. La structure en deux questions parallèles ainsi que les images des ténèbres et du pays de l’oubli sont conservées.
