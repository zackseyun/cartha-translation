source:
  edition: WLC
  text: יְ֭הוָה אֱלֹהֵ֣י יְשׁוּעָתִ֑/י יוֹם צָעַ֖קְתִּי בַ/לַּ֣יְלָה נֶגְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: fr
  text: 'Yahvé, Dieu de mon salut,

    le jour, je crie ;

    la nuit, je suis[a] devant toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant toi ». La proposition hébraïque est sans verbe ; « je suis » est ajouté en français pour la clarté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française usuelle du nom divin, conservé comme nom propre dans cette adresse directe.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Dieu de mon salut
  rationale: Rend directement la chaîne construite et maintient la portée à la fois concrète et théologique de יְשׁוּעָה sans préciser indûment la forme de la délivrance.
- source_word: יוֹם
  choice: le jour
  rationale: Emploi temporel adverbial, mis en contraste avec « la nuit ».
- source_word: צָעַקְתִּי
  choice: je crie
  rationale: Le parfait hébreu peut présenter ici le cri comme déjà engagé et continu dans la lamentation. Le présent français exprime naturellement cette prière persistante, sans affaiblir l’urgence du verbe.
- source_word: בַלַּיְלָה
  choice: la nuit
  rationale: Formulation temporelle naturelle qui préserve le parallélisme avec « le jour ».
- source_word: נֶגְדֶּךָ
  choice: je suis devant toi
  rationale: L’hébreu porte littéralement « devant toi » dans une proposition sans verbe. Le français exige ici un verbe pour rendre clairement le sens de présence devant Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Jéhovah ; Yahweh
  rationale: Le texte emploie directement le tétragramme. « Yahvé » le conserve comme nom propre sous sa forme française courante, au lieu de le remplacer par un titre.
- issue: Valeur de « Dieu de mon salut »
  choice: Dieu de mon salut
  alternative: Dieu qui me sauve ; Dieu de ma délivrance
  rationale: 'Cette formulation maintient l’expression nominale hébraïque et son ouverture : Dieu est à la fois la source et l’auteur du salut, sans que le français tranche davantage.'
translation_notes:
  register: Français moderne, sobre et poétique. La disposition en trois lignes met en valeur l’invocation puis le contraste entre le jour et la nuit. Le tutoiement convient à l’adresse directe de la prière biblique.
