  text: הִרְחַ֥קְתָּ מְיֻדָּעַ֗/י מִ֫מֶּ֥/נִּי שַׁתַּ֣/נִי תוֹעֵב֣וֹת לָ֑/מוֹ כָּ֝לֻ֗א וְ/לֹ֣א אֵצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/008.yaml
  text: You have driven my companions far from me[a]; you have made me abhorrent to them[c][b]. I am confined and cannot go out.
translation:
  language: fr
  text: Tu as éloigné de moi mes connaissances[a] ; tu as fait de moi pour eux un objet d’horreur[b]. Je suis enfermé et je ne peux pas sortir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux que je connais » ou « mes compagnons ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu as fait de moi des abominations pour eux ».'
    reason: formal_feature
  - marker: c
    text: 'Littéralement : « je suis enfermé et je ne sors pas ».'
    reason: formal_feature
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: tu as éloigné
  rationale: Le hiphil de רחק exprime le fait de mettre à distance. « Éloigné » rend directement la causalité sans ajouter l’idée plus précise de chasser.
- source_word: מְיֻדָּעַי
  choice: ceux qui me connaissent
  rationale: Le terme désigne les personnes connues du psalmiste, vraisemblablement son entourage. Cette formulation conserve l’étendue sémantique sans imposer le degré d’intimité de « mes amis ».
- source_word: מִמֶּנִּי
  choice: de moi
  rationale: Rend le sens séparatif ordinaire de מן avec le suffixe de première personne.
- source_word: שַׁתַּנִי
  choice: tu as fait de moi
  rationale: Dans cette construction prédicative, שׁית signifie établir ou rendre quelqu’un comme quelque chose ; cette tournure est naturelle en français.
- source_word: תוֹעֵבוֹת
  choice: un objet d’horreur
  rationale: Le pluriel formel intensifie ici l’idée de répulsion. « Un objet d’horreur » conserve la force nominale et le jugement porté sur le psalmiste.
- source_word: לָמוֹ
  choice: pour eux
  rationale: Le pronom renvoie à ceux qui connaissent le psalmiste ; « pour eux » convient naturellement à la construction française « faire de quelqu’un un objet d’horreur ».
- source_word: כָּלֻא
  choice: je suis enfermé
  rationale: La forme exprime l’état d’une personne retenue ou close. « Enfermé » reste concret sans présupposer une incarcération judiciaire.
- source_word: וְלֹא אֵצֵא
  choice: et je ne peux pas sortir
  rationale: L’hébreu dit formellement « et je ne sors pas », mais l’état d’enfermement indique une impossibilité ; la formulation française rend cette implication contextuelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme de la lamentation est conservé, ainsi que l’adresse directe à Dieu. Les formulations évitent de préciser indûment le degré d’intimité de l’entourage ou la nature matérielle de l’enfermement.
