  text: עָ֘נִ֤י אֲנִ֣י וְ/גֹוֵ֣עַ מִ/נֹּ֑עַר נָשָׂ֖אתִי אֵמֶ֣י/ךָ אָפֽוּנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: fr
  text: Je suis affligé et près de mourir depuis ma jeunesse ; je porte tes terreurs, je suis accablé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai porté tes terreurs, je suis désemparé ». Le dernier mot hébreu est difficile ; il peut aussi exprimer le désarroi ou le fait d’être défait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנִי
  choice: affligé
  rationale: Dans ce contexte de lamentation, le terme décrit la détresse et la souffrance plutôt que la pauvreté matérielle.
- source_word: וְגֹוֵעַ
  choice: près de mourir
  rationale: Le participe exprime un état continu de dépérissement ou de proximité de la mort ; cette formulation est naturelle en français sans rendre la mort nécessairement imminente.
- source_word: מִנֹּעַר
  choice: depuis ma jeunesse
  rationale: La préposition indique une situation qui dure depuis le jeune âge ; le possessif est requis par l'usage français.
- source_word: נָשָׂאתִי
  choice: je porte
  rationale: Le verbe signifie porter ou supporter. Le présent français fait ressortir la détresse encore actuelle, tout en laissant en note la valeur accomplie possible de la forme hébraïque.
- source_word: אֵמֶיךָ
  choice: tes terreurs
  rationale: Cette traduction directe conserve l'adresse à Dieu et la force du pluriel, sans atténuer l'association des terreurs avec son action.
- source_word: אָפוּנָה
  choice: je suis anéanti
  rationale: La forme hébraïque est difficile ; dans le contexte, elle évoque quelqu'un d'accablé, désemparé ou défait. « Anéanti » restitue cette force sans prétendre lever entièrement l'incertitude.
theological_decisions:
- issue: Référence de « tes terreurs »
  choice: Les terreurs sont directement rapportées à Dieu, auquel le psalmiste s'adresse.
  alternative: Comprendre seulement des terreurs éprouvées en présence de Dieu, sans qu'elles soient attribuées à son action.
  rationale: Le suffixe de deuxième personne relie naturellement ces terreurs à Dieu. La traduction maintient la tension théologique de la plainte au lieu d'adoucir l'action divine.
translation_notes:
  register: Français international moderne, sobre et poétique. « Affligé », « près de mourir » et « tes terreurs » restent accessibles tout en conservant la gravité du psaume. Le point-virgule distingue l’état durable depuis la jeunesse de l’effet présent des terreurs.
