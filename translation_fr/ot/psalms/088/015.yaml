  source_fidelity: La traduction rend fidèlement la détresse (עָנִי), l’état de mort imminente (וְגֹוֵעַ), la durée depuis la jeunesse et l’adresse directe à Dieu dans « tes terreurs ». Le présent « je porte » est une option poétique défendable pour le parfait נָשָׂאתִי, dont une lecture accomplie doit demeurer signalée. En revanche, « je suis anéanti » tend à exprimer une destruction achevée plus catégorique que le dernier terme hébreu difficile, qui évoque plus prudemment l’accablement, le désarroi ou le fait d’être défait.
  naturalness: Le français est globalement naturel, sobre et adapté à une lamentation poétique. « Je suis accablé » est plus idiomatique ici et correspond mieux à « overwhelmed » sans imposer l’idée plus définitive d’un anéantissement.
