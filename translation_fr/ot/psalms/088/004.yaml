id: PSA.88.4
reference: Psalms 88:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נֶ֭חְשַׁבְתִּי עִם י֣וֹרְדֵי ב֑וֹר הָ֝יִ֗יתִי כְּ/גֶ֣בֶר אֵֽין אֱיָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: fr
  text: Je suis compté parmi ceux qui descendent dans la fosse[a] ; je suis devenu comme un homme sans force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe ». La « fosse » est une image poétique fréquente de la mort.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un homme vigoureux privé de vigueur ». Le mot traduit par « homme » peut évoquer la force.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Je suis compté
  rationale: Le nifal de חשׁב exprime ici le fait d’être considéré comme appartenant à un groupe. Le présent rend naturellement l’état actuel et saisissant décrit dans la plainte, malgré la forme accomplie de l’hébreu.
- source_word: עִם
  choice: parmi
  rationale: Le sens littéral est « avec », mais après « compté », « parmi » exprime idiomatiquement l’inclusion dans le groupe.
- source_word: יוֹרְדֵי בוֹר
  choice: ceux qui descendent dans la fosse
  rationale: Le participe désigne ceux qui sont en train de descendre vers la fosse, image poétique de la mort. Cette formulation conserve le mouvement et la métaphore de l’hébreu.
- source_word: בּוֹר
  choice: la fosse
  rationale: Dans ce contexte poétique, le mot évoque la tombe, l’abîme ou le séjour des morts. « Fosse » préserve l’image concrète sans en réduire la portée à une seule interprétation.
- source_word: הָיִיתִי
  choice: je suis devenu
  rationale: Le parfait de היה décrit ici un état atteint. « Je suis devenu » fait ressortir le passage à une condition voisine de la mort.
- source_word: כְּגֶבֶר
  choice: comme un homme
  rationale: גבר désigne un homme et peut suggérer la vigueur. Le rendu simple permet à l’expression suivante, « sans force », de porter le contraste implicite.
- source_word: אֵין אֱיָל
  choice: sans force
  rationale: אֱיָל désigne la force ou la vigueur. « Sans force » est clair, direct et conserve la formulation abrupte de l’hébreu.
theological_decisions:
- issue: Portée de l’image de la fosse
  choice: Conserver « la fosse » dans le texte principal
  alternative: Expliciter « la tombe » ou « le séjour des morts »
  rationale: L’hébreu emploie une image poétique susceptible d’évoquer à la fois la tombe, la mort et le domaine des morts. La traduction ne doit pas trancher silencieusement entre ces nuances.
- issue: Nuance possible de גבר
  choice: Traduire par « homme »
  alternative: « homme vigoureux » ou « guerrier »
  rationale: Le substantif peut comporter une connotation de vigueur, mais le contexte la renverse aussitôt par « sans force ». Une note conserve cette tension lexicale sans surcharger le verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la plainte est conservé, ainsi que l’image concrète de la fosse et le contraste possible entre l’homme vigoureux et l’absence de force.
