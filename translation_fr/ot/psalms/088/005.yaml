  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: fr
  text: Je suis libre parmi les morts[a], comme ceux qui ont été tués et qui gisent dans la tombe, ceux dont tu ne te souviens plus[b] et qui sont retranchés de ta main[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « libéré parmi les morts ». L’hébreu emploie le langage de la liberté ou de la délivrance, probablement de manière ironique : le psalmiste est comme déjà mort, hors du monde des vivants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « se souvenir » peut signifier davantage que garder quelqu’un en mémoire : il peut aussi s’agir de lui prêter attention et d’agir en sa faveur.'
    reason: lexical_alternative
  - marker: c
    text: '« La main » représente ici la puissance, l’autorité ou les soins de Dieu. On pourrait aussi traduire : « séparés de ta main ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: parmi les morts
  rationale: La préposition בְּ avec le pluriel « les morts » situe le psalmiste dans leur domaine ou leur compagnie. « Parmi les morts » exprime naturellement cette identification en français.
- source_word: חָפְשִׁי
  choice: libre
  rationale: 'L’adjectif signifie « libre, dégagé, relâché ». Le contexte lui donne une force paradoxale et probablement ironique : le psalmiste est comme libéré du monde et des obligations des vivants parce qu’il est tenu pour mort. Garder « libre » préserve cette image déroutante.'
- source_word: כְּמוֹ
  choice: pareil à
  rationale: Cette locution comparative introduit la comparaison. « Pareil à » s’accorde naturellement avec le sujet à la première personne.
- source_word: חֲלָלִים
  choice: ceux qui ont été tués
  rationale: Le nom désigne couramment des personnes tuées, souvent de mort violente. Cette formulation est claire et plus précise que le seul mot « victimes ».
- source_word: שֹׁכְבֵי קֶבֶר
  choice: reposent dans la tombe
  rationale: Le participe construit décrit ceux qui sont couchés durablement dans la tombe. « Reposent » rend cette posture en français biblique actuel sans lourdeur.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: ceux dont tu ne te souviens plus
  rationale: La formulation conserve le verbe « se souvenir » et l’adverbe « plus ». Elle laisse ouverte la portée relationnelle et active du souvenir divin.
- source_word: וְהֵמָּה
  choice: et qui
  rationale: Le וְ est rendu directement par « et ». L’enchaînement relatif est naturel en français, même s’il atténue légèrement la reprise emphatique du pronom hébreu.
- source_word: מִיָּדְךָ
  choice: de ta main
  rationale: L’image hébraïque de la main est conservée, car elle peut évoquer à la fois puissance, autorité et sollicitude sans imposer un seul sens.
- source_word: נִגְזָרוּ
  choice: sont retranchés
  rationale: Le nifal de גזר exprime le fait d’être coupé, séparé ou retranché. « Sont retranchés » maintient l’image brutale de la séparation et s’emploie naturellement avec « de ».
theological_decisions:
- issue: Portée du souvenir de Dieu à l’égard des morts
  choice: tu ne te souviens plus
  alternative: tu ne prends plus soin d’eux
  rationale: Le texte exprime la détresse telle que la vit le psalmiste, sans nier l’omniscience divine. Conserver « se souvenir » respecte à la fois la métaphore relationnelle et la tension théologique du verset.
- issue: Sens paradoxal de la liberté parmi les morts
  choice: libre parmi les morts
  alternative: abandonné parmi les morts
  rationale: L’hébreu emploie réellement le vocabulaire de la liberté ou du dégagement. Le remplacer par « abandonné » supprimerait le paradoxe poétique et introduirait une interprétation absente du terme lui-même.
- issue: Être retranché de la main de Dieu
  choice: retranchés de ta main
  alternative: soustraits à ta puissance
  rationale: La traduction garde l’image ouverte de la main divine plutôt que de la réduire exclusivement à la puissance, au contrôle ou aux soins de Dieu.
translation_notes:
  register: Français international moderne, sobre et poétique. La syntaxe demeure immédiatement compréhensible, tandis que « libre parmi les morts » et « retranchés de ta main » conservent les images fortes et volontairement tendues de l’hébreu.
