source:
  edition: WLC
  text: וַ/אֲנִ֤י אֵלֶ֣י/ךָ יְהוָ֣ה שִׁוַּ֑עְתִּי וּ֝/בַ/בֹּ֗קֶר תְּֽפִלָּתִ֥/י תְקַדְּמֶֽ/ךָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/013.yaml
  text: But as for me[a], O Yahweh, I cry out to you; in the morning my prayer comes before you.
translation:
  language: fr
  text: Mais moi, Yahweh, je crie vers toi ; le matin, ma prière se présente devant toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vient devant toi », « va à ta rencontre » ou « te précède ». Le verbe hébreu peut exprimer le fait de venir devant quelqu’un, d’aller à sa rencontre ou de le précéder.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent un contraste emphatique. « Mais moi » conserve cette mise en relief avec naturel en français.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition exprime la direction du cri adressé à Yahweh. « Vers toi » convient idiomatiquement avec « crier ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que remplacé par un titre.
- source_word: שִׁוַּעְתִּי
  choice: je crie
  rationale: Le verbe désigne un cri, notamment un appel au secours. Le présent français exprime naturellement l'appel persistant du psalmiste dans cette prière poétique.
- source_word: וּבַבֹּקֶר
  choice: dès le matin
  rationale: Cette expression française naturelle indique que la prière est adressée le matin, avec la nuance d'empressement que peut porter le contexte.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Traduction directe du nom singulier avec son suffixe possessif.
- source_word: תְקַדְּמֶךָּ
  choice: se présente devant toi
  rationale: Le hiphil de קדם peut évoquer le fait de venir devant quelqu'un, d'aller à sa rencontre ou de le précéder. « Se présente devant toi » conserve l'image de la prière qui parvient en présence de Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre sans lui substituer un titre.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif « Yahweh » et le parallélisme des deux membres sont conservés ; le point-virgule rend leur articulation sans alourdir la phrase.
