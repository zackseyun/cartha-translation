id: PSA.88.10
reference: Psalms 88:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/לַ/מֵּתִ֥ים תַּעֲשֶׂה פֶּ֑לֶא אִם רְ֝פָאִ֗ים יָק֤וּמוּ יוֹד֬וּ/ךָ סֶּֽלָה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/010.yaml
  text: Do you work wonders for the dead? Do the departed spirits rise up to praise you? Selah[a]
translation:
  language: fr
  text: Fais-tu des prodiges pour les morts ? Les défunts[a] se lèvent-ils pour te louer ? Séla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ombres » ; l’hébreu Refaïm est un terme poétique désignant les morts dans le séjour des morts.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: pour les morts
  rationale: La préposition ל avec l’article et l’interrogation exprime naturellement « pour les morts ? » ; cette formulation conserve la force rhétorique du verset.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: fais-tu des prodiges
  rationale: L’expression associe le verbe général עשה à פֶּלֶא. Le pluriel idiomatique français « des prodiges » rend naturellement le sens collectif de l’acte merveilleux divin sans le limiter à la notion plus étroite de miracle.
- source_word: אִם
  choice: se lèvent-ils
  rationale: Ici, אִם introduit une seconde question rhétorique parallèle, et non une véritable proposition conditionnelle ; l’inversion interrogative française en restitue clairement la fonction.
- source_word: רְפָאִים
  choice: les défunts
  rationale: Dans ce contexte poétique, רְפָאִים désigne les morts du séjour des morts. « Les défunts » est clair en français moderne et évite aussi bien une translittération obscure qu’une définition doctrinale de leur état.
- source_word: יָקוּמוּ
  choice: se lèvent-ils
  rationale: קום évoque le fait de se lever ou de se dresser. La formulation conserve l’image saisissante sans affirmer explicitement une doctrine de résurrection.
- source_word: יוֹדוּךָ
  choice: pour te louer
  rationale: Le hiphil de ידה peut signifier remercier ou louer. Dans ce contexte cultuel et poétique, « te louer » exprime le plus naturellement l’hommage adressé à Dieu.
- source_word: סֶּלָה
  choice: Séla
  rationale: La fonction exacte du terme demeure incertaine ; sa translittération évite de lui imposer une interprétation conjecturale.
theological_decisions:
- issue: Sens de רְפָאִים dans l’imagerie poétique du séjour des morts
  choice: les défunts
  alternative: les ombres
  rationale: « Les défunts » préserve la référence aux morts sans importer une conception doctrinale ultérieure de l’état intermédiaire. La possibilité plus imagée « les ombres » est signalée en note.
- issue: Portée de יָקוּמוּ
  choice: se lèvent-ils
  alternative: ressuscitent-ils
  rationale: Le verbe décrit littéralement l’action de se lever. « Ressuscitent-ils » résoudrait trop explicitement l’ambiguïté en faveur d’une lecture doctrinale précise que le texte poétique n’impose pas à lui seul.
translation_notes:
  register: Français international moderne, sobre et poétique. Les deux questions rhétoriques sont conservées, ainsi que la translittération traditionnelle « Séla ». Le marqueur de note est placé immédiatement après le terme qu’il explique.
