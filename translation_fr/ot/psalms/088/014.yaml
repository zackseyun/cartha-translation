  text: לָ/מָ֣ה יְ֭הוָה תִּזְנַ֣ח נַפְשִׁ֑/י תַּסְתִּ֖יר פָּנֶ֣י/ךָ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: fr
  text: Pourquoi, Yahvé, me rejettes-tu[a] ? Pourquoi me caches-tu ton visage[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « rejettes-tu mon âme ? » Le mot hébreu peut aussi désigner la personne elle-même ou sa vie.
    reason: lexical_alternative
  - marker: b
    text: « Cacher son visage » est une expression hébraïque pouvant évoquer le retrait de sa présence, de son attention ou de sa faveur.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: Pourquoi
  rationale: Interrogatif direct exprimant la cause; « Pourquoi » restitue simplement et vivement la plainte.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre.
- source_word: תִּזְנַח
  choice: rejettes-tu
  rationale: Le verbe exprime l’action de repousser ou de rejeter; ce choix est clair, actuel et fidèle à la force de la plainte.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Le terme נֶפֶשׁ peut désigner l’âme, la personne elle-même ou la vie. La formulation concrète de l’hébreu est conservée, tandis qu’une note signale les autres sens possibles.
- source_word: תַּסְתִּיר
  choice: caches-tu
  rationale: Rend directement le causatif du verbe « cacher » et s’intègre naturellement à l’expression « cacher son visage ».
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Traduction concrète de l’hébreu; l’expression peut évoquer la présence et l’attention favorables de Dieu sans que cette portée soit imposée dans le texte principal.
- source_word: מִמֶּנִּי
  choice: me
  rationale: Dans « me caches-tu ton visage », le pronom indirect rend naturellement en français l’idée de « loin de moi / à moi » portée par la préposition hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR; Yahweh; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahvé » est la transcription française courante et préserve ce nom au lieu de le remplacer par un titre, sans prétendre résoudre définitivement la vocalisation ancienne.
- issue: Portée de « cacher ton visage »
  choice: Conserver l’image hébraïque dans le texte
  alternative: retirer ta présence ou ta faveur
  rationale: L’image peut exprimer le retrait de la présence, de l’attention ou de la faveur divine. La traduction maintient cette amplitude théologique et l’explique en note sans la réduire à une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement convient à l’adresse directe à Dieu dans le registre biblique français. La répétition de « Pourquoi » et les deux questions sont conservées afin de préserver l’intensité de la lamentation.
