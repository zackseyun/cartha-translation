    et tu m’as affligé de tous tes flots déferlants[a]. Sélah'
  rationale: La révision resserre la traduction sur l’image de סמך sans ajouter l’idée de lourdeur, emploie « colère » comme équivalent biblique moderne et non surintensifié de חֵמָה, et normalise « Sélah ». Elle préserve l’adresse directe à Dieu, son action dans l’affliction et l’image de la mer déchaînée.
