source:
  edition: WLC
  text: עָ֭לַ/י סָמְכָ֣ה חֲמָתֶ֑/ךָ וְ/כָל מִ֝שְׁבָּרֶ֗י/ךָ עִנִּ֥יתָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/007.yaml
  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: fr
  text: 'Ta colère repose sur moi,

    et tu m’as affligé de tous tes flots déferlants[a]. Sélah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tes brisants » ; le mot hébreu évoque les vagues de la mer qui se brisent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמְכָה
  choice: s’est appesantie
  rationale: Le verbe évoque ce qui s’appuie ou repose sur quelque chose. « S’est appesantie sur moi » conserve l’image d’un poids qui vient peser sur le psalmiste, tout en restant naturel en français.
- source_word: חֲמָתֶךָ
  choice: ta fureur
  rationale: חֵמָה désigne une colère ardente. « Fureur » en exprime ici l’intensité sans atténuer la gravité de la plainte adressée à Dieu.
- source_word: מִשְׁבָּרֶיךָ
  choice: tes vagues déferlantes
  rationale: Le terme désigne des vagues qui se brisent. « Vagues déferlantes » rend cette image maritime plus clairement en français courant que le substantif « brisants ».
- source_word: עִנִּיתָ
  choice: tu m’as accablé
  rationale: Au piel, ענה peut signifier affliger, humilier ou opprimer. Dans cette image de vagues divines, « accablé » exprime l’affliction subie sans la réduire à une oppression sociale.
- source_word: וְכָל
  choice: par toutes
  rationale: 'La formulation rend explicite la valeur instrumentale naturellement comprise dans le contexte : Dieu accable le psalmiste au moyen de la totalité de ses vagues.'
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens précis de ce terme liturgique demeure incertain ; il est donc translittéré plutôt que traduit.
theological_decisions:
- issue: Colère divine et action de Dieu dans la souffrance
  choice: Le psalmiste affirme directement que la fureur de Dieu pèse sur lui et que Dieu l’accable par ses vagues.
  alternative: Rendre la souffrance impersonnelle ou atténuer « fureur » en simple détresse.
  rationale: L’hébreu attribue explicitement à Dieu la colère et l’action d’affliger. La traduction maintient cette tension théologique propre à la lamentation sans l’expliquer ni l’adoucir.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « S’est appesantie » garde l’image concrète du verbe hébreu, tandis que « vagues déferlantes » rend clairement l’image maritime. « Séla » préserve le marqueur liturgique dont le sens reste incertain.
