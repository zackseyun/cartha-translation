review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la colère divine est « sur » le psalmiste, et Dieu l’afflige au moyen de ses « breakers ». Toutefois, « s’est appesantie » explicite l’idée de poids plus fortement que le verbe סמך (« reposer / être posé, étendu sur ») ne l’exige. « Repose sur moi » conserve plus exactement l’image spatiale et le degré d’expression du texte. « De tous tes flots déferlants » rend naturellement en français la valeur instrumentale et la totalité de וְכָל.'
  naturalness: Le français est poétique, clair et d’un registre approprié. « Ta fureur » est possible, mais « ta colère » est plus idiomatique dans une lamentation biblique moderne et correspond sans surintensifier à חֵמָה. « Sélah » est la translittération française usuelle du marqueur liturgique.
  terminology: « Colère », « affligé » et « flots déferlants » maintiennent respectivement la gravité de חֵמָה, le sens large de ענה au piel, et l’imagerie maritime de מִשְׁבָּרִים. La note préserve utilement « brisants » comme équivalent plus littéral.
  issues:
  - severity: low
    issue: « S’est appesantie » est plus interprétatif que nécessaire.
    rationale: Le verbe סמך avec « sur moi » décrit d’abord une chose posée ou reposant sur le locuteur. L’image de lourdeur est compatible avec le contexte, mais « repose sur moi » est plus directement fidèle et conserve l’ambiguïté expressive.
  - severity: low
    issue: « Séla » devrait être normalisé en « Sélah ».
    rationale: « Sélah » est la translittération française courante de סֶלָה et rend mieux la consonne finale du terme hébreu, tout en laissant son sens indéterminé.
  revised_text: 'Ta colère repose sur moi,

    et tu m’as affligé de tous tes flots déferlants[a]. Sélah'
  revised_footnotes:
