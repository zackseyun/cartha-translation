  text: לָ֤/מָּה תָשִׁ֣יב יָ֭דְ/ךָ וִֽ/ימִינֶ֑/ךָ מִ/קֶּ֖רֶב חוק/ך כַלֵּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/011.yaml
  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: fr
  text: Pourquoi retiens-tu ta main, ta main droite ? Tire-la de ton sein et anéantis-les[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « du milieu de ton sein, anéantis ». Le dernier verbe n’a pas de complément explicite ; « les » est fourni d’après le contexte et renvoie aux ennemis évoqués dans le psaume.'
    reason: Préciser l’image hébraïque et signaler le complément implicite.
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Interrogatif de cause qui introduit la plainte du psalmiste.
- source_word: תָשִׁיב
  choice: retires-tu
  rationale: Le hiphil de שוב, avec « ta main » pour complément et l’image du vêtement dans la suite, exprime ici l’action de retirer ou de retenir sa main au lieu d’intervenir.
- source_word: יָדְךָ וִימִינֶךָ
  choice: ta main, ta main droite
  rationale: La répétition concrète et le parallélisme poétique sont conservés ; la main droite évoque la force et l’action décisive sans que cette valeur soit paraphrasée.
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: du pli de ton vêtement
  rationale: חֵיק désigne le sein, le giron ou le repli du vêtement. Cette formulation naturelle en français rend clairement l’image d’une main gardée inactive dans le vêtement.
- source_word: כַלֵּה
  choice: anéantis-les
  rationale: L’impératif piel de כלה signifie mener à son terme, consumer ou anéantir. Le pronom « les », absent de l’hébreu, reprend contextuellement les ennemis évoqués dans le psaume.
theological_decisions:
- issue: Complément implicite de l’impératif final
  choice: « anéantis-les », où « les » renvoie aux ennemis
  alternative: Laisser l’impératif sans complément, ou comprendre plus généralement « mets-y fin »
  rationale: L’hébreu ne formule aucun complément, mais le contexte du psaume vise les ennemis qui ravagent le sanctuaire et outragent Dieu. Le pronom est donc un ajout grammatical minimal, explicitement signalé en note, sans effacer l’ambiguïté de la source.
translation_notes:
  register: Français international moderne, naturel et digne. « Pli de ton vêtement » rend l’image ancienne plus clairement que « sein » ou « giron », tandis que « anéantis » conserve la vigueur de l’impératif.
