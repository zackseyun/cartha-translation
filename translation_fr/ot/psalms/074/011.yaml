  naturalness: « Pourquoi retiens-tu ta main, ta main droite ? Tire-la de ton sein et anéantis-les ! » est naturel dans un registre poétique français moderne. « Sors-la du pli de ton vêtement » est compréhensible, mais « sortir » est moins idiomatique ici et « pli de ton vêtement » explicite davantage l’image que ne le fait l’hébreu.
