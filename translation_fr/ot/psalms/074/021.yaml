id: PSA.74.21
reference: Psalms 74:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל יָשֹׁ֣ב דַּ֣ךְ נִכְלָ֑ם עָנִ֥י וְ֝/אֶבְי֗וֹן יְֽהַלְל֥וּ שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: fr
  text: Que l’opprimé ne s’en retourne pas couvert de honte[a] ! Que le pauvre et le démuni louent ton nom !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « humilié » ou « déshonoré ». Le mot hébreu peut évoquer une honte infligée publiquement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָשֹׁב
  choice: Que… ne reparte pas
  rationale: La particule négative avec l’imparfait exprime ici une supplication. « Ne reparte pas » rend naturellement le mouvement de retour suggéré par שוב, sans préciser d’où l’opprimé repart.
- source_word: דַּךְ
  choice: l’opprimé
  rationale: Le terme désigne une personne écrasée ou accablée. « L’opprimé » en transmet la portée sociale et existentielle dans un français naturel.
- source_word: נִכְלָם
  choice: couvert de honte
  rationale: Le participe passif évoque la honte subie, avec une possible dimension d’humiliation publique. Cette tournure exprime plus nettement cet état que le simple adjectif « honteux ».
- source_word: עָנִי
  choice: le pauvre
  rationale: Associé à אֶבְיוֹן, le mot porte ici au premier plan le sens de pauvreté ou d’affliction, rendu sobrement par « le pauvre ».
- source_word: אֶבְיוֹן
  choice: le démuni
  rationale: « Le démuni » conserve la distinction avec עָנִי et exprime le manque ainsi que le besoin sans produire la formulation peu naturelle « le nécessiteux ».
- source_word: יְהַלְלוּ
  choice: Que… louent
  rationale: L’imparfait au pluriel a une valeur volitive dans cette prière. « Que… louent » préserve cette supplication et le parallélisme des deux propositions.
- source_word: שְׁמֶךָ
  choice: ton nom
  rationale: La formulation hébraïque est transparente en français et garde sa portée concernant le caractère et la réputation révélés de Dieu.
theological_decisions:
- issue: Rapport entre la délivrance demandée et la louange finale
  choice: 'Conserver deux demandes parallèles : que l’opprimé ne reparte pas humilié et que les pauvres louent Dieu.'
  alternative: Présenter la louange comme le résultat explicite de la délivrance.
  rationale: La succession des formes volitives permet de comprendre un lien entre délivrance et louange, mais n’énonce pas formellement une relation causale. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation convient au ton pressant de la supplication. « L’opprimé », « le pauvre » et « le démuni » restent accessibles tout en préservant les distinctions lexicales de l’hébreu.
