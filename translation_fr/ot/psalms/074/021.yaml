review_pass:
  verdict: revise
  source_fidelity: La première demande rend correctement la valeur jussive de אַל avec l’imparfait. Toutefois, « reparte » exprime surtout le fait de partir de nouveau et atténue le mouvement de retour porté par יָשֹׁב. « S’en retourne » conserve mieux ce mouvement sans imposer un lieu de départ ou d’arrivée. « Couvert de honte », ainsi que « le pauvre et le démuni », rendent bien les termes hébreux et leur distinction.
  naturalness: Le français est moderne, fluide et d’un registre approprié à une supplication poétique. « Que l’opprimé ne s’en retourne pas couvert de honte » est idiomatique et plus précis que « ne reparte pas ».
  terminology: « Opprimé » convient à דַּךְ, tout en laissant percevoir l’idée d’une personne écrasée. « Pauvre et démuni » rend de façon naturelle le couple עָנִי / אֶבְיוֹן. « Louent ton nom » préserve l’expression théologiquement importante sans la paraphraser.
  issues:
  - severity: medium
    issue: « reparte » ne rend pas explicitement l’idée de retour de יָשֹׁב.
    rationale: Le verbe hébreu signifie « revenir / retourner ». Dans ce contexte, « s’en retourner » permet de garder le mouvement de retour, notamment celui d’une personne qui pourrait se retirer sans avoir obtenu secours.
