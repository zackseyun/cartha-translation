source:
  edition: WLC
  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף לָ/מָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָ/נֶ֑צַח יֶעְשַׁ֥ן אַ֝פְּ/ךָ֗ בְּ/צֹ֣אן מַרְעִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: fr
  text: 'Maskil[a] d’Asaph.


    Pourquoi, ô Dieu, nous as-tu rejetés pour toujours ? Pourquoi ta colère fume-t-elle contre les brebis de ton pâturage ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Maskil » est un terme technique employé dans le titre de certains psaumes ; il peut désigner une composition méditative ou instructive, mais son sens précis reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Ce terme technique placé en tête du psaume a un sens précis incertain. La translittération évite de trancher entre une composition méditative, didactique ou d’un autre type.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance ou l’association. « d’Asaph » constitue en français un intitulé naturel qui ne précise pas indûment le rapport exact.
- source_word: לָמָה
  choice: Pourquoi
  rationale: L’interrogatif direct convient au ton de lamentation et se lit naturellement en français.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom a ici une valeur vocative. « ô Dieu » rend clairement l’adresse priante tout en gardant un registre digne.
- source_word: זָנַחְתָּ
  choice: nous as-tu rejetés
  rationale: Le verbe signifie rejeter ou repousser. Le texte hébreu n’exprime pas ici l’objet par un suffixe, mais le contexte de lamentation communautaire permet de l’expliciter par « nous » en français.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Cette expression rend la durée perçue comme sans fin dans la plainte, sans atténuer la force de la question.
- source_word: יֶעְשַׁן
  choice: fume-t-elle
  rationale: Le verbe évoque littéralement la fumée. Conserver cette image vive évite de la réduire au simple sens de « brûler ».
- source_word: אַפְּךָ
  choice: ta colère
  rationale: Le nom désigne littéralement le nez ou la narine, mais exprime idiomatiquement la colère. Le sens idiomatique est rendu clairement, tandis que l’image associée à la fumée est conservée.
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: contre les brebis de ton pâturage
  rationale: Cette formulation maintient la métaphore pastorale concrète et présente le peuple comme les brebis nourries sur le pâturage de Dieu.
theological_decisions:
- issue: Objet non exprimé après le verbe « rejeter »
  choice: nous as-tu rejetés
  alternative: as-tu rejeté [ton peuple]
  rationale: La forme hébraïque זָנַחְתָּ signifie « tu as rejeté » sans suffixe objet explicite dans le texte fourni. Le contexte communautaire identifie toutefois naturellement les locuteurs comme objet. « nous » rend cette ellipse intelligible en français sans ajouter l’expression théologiquement plus déterminée « ton peuple ».
- issue: Portée de « pour toujours » dans la lamentation
  choice: pour toujours
  alternative: sans fin
  rationale: La question exprime l’expérience angoissée d’un rejet apparemment définitif; elle n’oblige pas à conclure que le psalmiste affirme doctrinalement un rejet réellement irrévocable. La traduction conserve cette tension sans l’expliquer dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le terme technique « Maskil » est conservé et expliqué en note. L’image inhabituelle mais intentionnelle de la colère qui « fume » est maintenue afin de respecter la vigueur poétique de l’hébreu.
