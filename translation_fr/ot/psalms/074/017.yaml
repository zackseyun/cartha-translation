id: PSA.74.17
reference: Psalms 74:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: fr
  text: C’est toi qui as établi toutes les limites de la terre[a] ; l’été et l’hiver, c’est toi qui les as façonnés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fixé toutes les limites de la terre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « formés ». Le pronom « les » renvoie à « l’été et l’hiver ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: as établi
  rationale: Le hifil de נצב exprime ici l’action de mettre en place de manière ferme. « Établir » rend à la fois la fixation initiale et la stabilité qui en résulte.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: toutes les limites de la terre
  rationale: Dans ce contexte cosmique, גְּבוּלוֹת désigne les limites qui structurent le monde plutôt que des frontières politiques, et אָרֶץ se comprend naturellement comme « la terre ».
- source_word: קַיִץ וָחֹרֶף
  choice: l’été et l’hiver
  rationale: Ces termes désignent les deux saisons opposées et, ensemble, évoquent le cycle saisonnier.
- source_word: יְצַרְתָּם
  choice: les as façonnés
  rationale: יצר évoque le fait de former ou de façonner. Le suffixe masculin pluriel renvoie naturellement à « l’été et l’hiver ».
- source_word: אַתָּה ... אַתָּה
  choice: C’est toi ... c’est toi
  rationale: La tournure détachée française conserve l’insistance produite par la répétition du pronom hébreu tout en restant naturelle.
theological_decisions:
- issue: Portée des « limites de la terre »
  choice: Une affirmation cosmique sur l’organisation du monde par Dieu
  alternative: Une référence aux frontières de territoires ou de nations
  rationale: La mention immédiate de l’été et de l’hiver situe le verset dans l’ordre de la création plutôt que dans un cadre géopolitique.
translation_notes:
  register: Français moderne, international et digne. La structure « C’est toi… c’est toi » restitue l’emphase hébraïque ; « façonner » conserve l’image concrète de la formation sans imposer une précision doctrinale supplémentaire.
