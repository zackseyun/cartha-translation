  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: fr
  text: C’est toi qui as fait jaillir des sources et des torrents[a] ; c’est toi qui as asséché des fleuves intarissables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « tu as fendu la source et le torrent ».'
    reason: Signaler l’image concrète du verbe hébreu, rendue idiomatiquement par « faire jaillir ».
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: as ouvert un passage à
  rationale: Le verbe signifie « fendre, ouvrir en fendant ». Cette formulation conserve l’image d’une ouverture créée tout en restant naturelle en français.
- source_word: מַעְיָן וָנָחַל
  choice: la source et le torrent
  rationale: Les deux noms sont au singulier dans l’hébreu. « Torrent » rend נחל sans imposer le terme régional « oued » et peut désigner un cours d’eau de vallée.
- source_word: נַהֲרוֹת אֵיתָן
  choice: des fleuves intarissables
  rationale: 'אֵיתָן évoque ici ce qui est durable, permanent ou toujours alimenté. « Intarissables » fait ressortir la tension poétique : Dieu assèche même de tels fleuves.'
theological_decisions:
- issue: Identification implicite des épisodes évoqués
  choice: Ne nommer ni le rocher du désert ni le Jourdain
  alternative: Expliciter ces récits dans le corps du verset
  rationale: Le verset emploie des images susceptibles d’évoquer plusieurs actes divins sans identifier expressément un lieu ou un épisode ; la traduction préserve cette ouverture.
translation_notes:
  register: Style poétique, actuel et digne. La reprise de « c’est toi qui » restitue l’insistance du pronom אַתָּה dans chacun des deux membres.
