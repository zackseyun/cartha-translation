  text: He was known like one who lifts up axes in a thicket of trees[a][b][c].
translation:
  language: fr
  text: Il était connu comme quelqu’un qui levait des haches dans un fourré d’arbres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il se faisait connaître comme quelqu’un qui faisait monter des haches dans un fourré de bois. » L’hébreu est concis et difficile; le sens précis de la comparaison et de l’expression « faisait monter » est discuté.'
    reason: textual_difficulty
lexical_decisions:
- source_word: יִוָּדַע
  choice: Il apparaissait
  rationale: Le nifal imparfait de ידע signifie littéralement « il était connu » ou « il se faisait connaître ». Dans cette description poétique au passé, « il apparaissait » rend naturellement l’idée qu’on reconnaissait la figure à son action, sans imposer une identité précise.
- source_word: כְּמֵבִיא לְמָעְלָה
  choice: comme quelqu’un qui lève
  rationale: כְּ introduit une comparaison, tandis que le participe hiphil de בוא accompagné de לְמָעְלָה exprime ici un mouvement vers le haut. « Qui lève » restitue simplement le geste du bûcheron.
- source_word: בִּסֲבָךְ עֵץ
  choice: dans un fourré d’arbres
  rationale: סֲבָךְ désigne un fourré ou un entrelacs végétal, עֵץ pouvant signifier « arbre » ou « bois ». La préposition בְּ est rendue par « dans », sens locatif naturel dans ce contexte.
- source_word: קַרְדֻּמּוֹת
  choice: la hache
  rationale: Le mot hébreu est pluriel et désigne des outils servant à couper. Le singulier collectif « la hache » produit en français l’image naturelle d’un bûcheron, tandis que la note conserve le pluriel formel.
