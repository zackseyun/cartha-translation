id: PSA.74.14
reference: Psalms 74:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַתָּ֣ה רִ֭צַּצְתָּ רָאשֵׁ֣י לִוְיָתָ֑ן תִּתְּנֶ֥/נּוּ מַ֝אֲכָ֗ל לְ/עָ֣ם לְ/צִיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: fr
  text: C’est toi qui as écrasé les têtes de Léviathan ; tu l’as donné en nourriture au peuple du désert[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux habitants du désert » ou « aux créatures sauvages du désert ». Le terme hébreu est difficile et peut désigner des êtres humains ou des animaux vivant dans les régions arides.
    reason: alternative lexicale
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: as écrasé
  rationale: Le verbe exprime l’action violente de briser ou d’écraser ; « écrasé » en conserve la force dans un français naturel.
- source_word: רָאשֵׁי
  choice: les têtes de
  rationale: Le nom hébreu est au pluriel construit. Le pluriel est maintenu sans expliquer la nature de l’image poétique.
- source_word: לִוְיָתָן
  choice: Léviathan
  rationale: La translittération consacrée préserve le nom poétique et ses résonances dans l’ensemble de la Bible hébraïque.
- source_word: תִּתְּנֶנּוּ
  choice: tu l’as donné
  rationale: Le verbe נתן signifie normalement « donner » ; le pronom masculin singulier renvoie à Léviathan.
- source_word: מַאֲכָל
  choice: en nourriture
  rationale: Cette expression rend directement le sens de « nourriture » et s’intègre naturellement après « donner ».
- source_word: לְעָם לְצִיִּים
  choice: au peuple du désert
  rationale: Cette traduction maintient le substantif עַם, « peuple », et rend le terme difficile צִיִּים par une expression géographique, tout en signalant en note les autres analyses lexicales possibles.
theological_decisions:
- issue: Nature de l’image de Léviathan
  choice: Conserver « Léviathan » et l’image de ses multiples têtes sans identifier davantage le référent.
  alternative: Traduire par « monstre marin » ou l’identifier explicitement à l’Égypte ou aux puissances du chaos.
  rationale: Le verset emploie une image poétique de la victoire divine, mais ne précise pas ici si Léviathan est une créature, un symbole cosmique ou la figure d’un ennemi historique.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure emphatique « C’est toi qui » reflète le pronom hébreu exprimé et convient au contexte hymnique. Le point-virgule conserve le parallélisme des deux propositions.
