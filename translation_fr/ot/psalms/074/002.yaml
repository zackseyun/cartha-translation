source:
  edition: WLC
  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: fr
  text: Souviens-toi de ton assemblée, que tu as acquise autrefois[a], que tu as rachetée, la tribu de ton héritage[b] — ce mont Sion[c] où tu as demeuré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Acquise » peut aussi se traduire par « achetée » ou, moins probablement ici, par « créée ».
    reason: lexical_alternative
  - marker: b
    text: « Tribu » peut aussi signifier « sceptre » ou « bâton » ; dans ce contexte, le sens collectif est le plus probable.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le mont Sion, celui-ci, où tu as demeuré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif direct adressé à Dieu; formulation naturelle et digne dans une supplication.
- source_word: עֲדָתְךָ
  choice: ton assemblée
  rationale: עֵדָה désigne collectivement la communauté réunie; «assemblée» garde ce sens sans connotation confessionnelle trop étroite.
- source_word: קָנִיתָ קֶּדֶם
  choice: que tu as acquise autrefois
  rationale: קנה exprime ici l’acquisition ou l’appropriation du peuple par Dieu, et קדם situe cet acte dans un passé ancien.
- source_word: גָּאַלְתָּ
  choice: que tu as rachetée
  rationale: גאל porte l’idée forte de libération par le rédempteur; «racheter» conserve cette résonance.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: comme la tribu qui constitue ton héritage
  rationale: שֵׁבֶט peut signifier «tribu», «bâton» ou «sceptre»; le parallèle avec l’assemblée rachetée favorise le sens collectif. La relative explicite naturellement le rapport de possession en français.
- source_word: הַר צִיּוֹן זֶה
  choice: le mont Sion
  rationale: Le démonstratif זֶה reprend vraisemblablement le mont Sion. Sa valeur déictique est absorbée dans une apposition française plus naturelle, tandis qu’une note signale le littéral.
- source_word: שָׁכַנְתָּ בוֹ
  choice: où tu as établi ta demeure
  rationale: שכן évoque le fait d’habiter ou de demeurer, avec ici la présence de Dieu en Sion; cette tournure française est naturelle sans préciser davantage la durée.
theological_decisions:
- issue: קָנִיתָ désigne-t-il la création ou l’acquisition d’Israël comme peuple de Dieu?
  choice: L’acquisition d’Israël comme peuple appartenant à Dieu
  alternative: La création ou la formation du peuple
  rationale: Le parallélisme avec «tu as rachetée» et l’objet «ton assemblée» favorisent une acquisition historique et relationnelle, sans exclure lexicalement les autres emplois de קנה ailleurs.
- issue: שֵׁבֶט désigne-t-il une tribu, un sceptre ou un bâton?
  choice: tribu
  alternative: sceptre ou bâton
  rationale: Le contexte porte sur l’assemblée rachetée et son identité collective; «tribu» est donc le sens le plus cohérent, tout en laissant l’ambiguïté lexicale en note.
- issue: Rapport syntaxique entre le peuple racheté et le mont Sion
  choice: Maintenir l’apposition abrupte du texte, qui passe du peuple à Sion, demeure de Dieu
  alternative: Faire du mont Sion l’objet direct du rachat ou réorganiser la phrase pour résoudre explicitement le rapport
  rationale: L’hébreu juxtapose «la tribu de ton héritage» et «le mont Sion, celui-ci, où tu as demeuré». La traduction conserve cette tension plutôt que d’imposer une relation théologique non explicitée.
translation_notes:
  register: Français international moderne, clair et digne. Le vers conserve la longue supplication poétique et l’apposition finale, tout en évitant une syntaxe artificielle. Le passé composé convient naturellement à l’appel fondé sur les actes anciens de Dieu.
