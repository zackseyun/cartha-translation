  text: שָׁאֲג֣וּ צֹ֭רְרֶי/ךָ בְּ/קֶ֣רֶב מוֹעֲדֶ֑/ךָ שָׂ֖מוּ אוֹתֹתָ֣/ם אֹתֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/004.yaml
  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: fr
  text: Tes adversaires ont rugi au cœur de ton lieu de rencontre[a] ; ils ont dressé leurs propres signes comme signes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au milieu de ton assemblée » ou « au cœur de ton lieu fixé ». Le mot hébreu peut désigner un temps fixé, une assemblée ou un lieu de rencontre ; ici, le contexte du sanctuaire favorise le sens spatial et cultuel.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils ont placé leurs signes comme signes ». Il s’agit probablement d’emblèmes ou d’étendards marquant leur occupation, leur domination ou leur victoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: ont rugi
  rationale: Le verbe évoque d’abord le rugissement du lion, puis un cri puissant et menaçant. « Ont rugi » conserve cette violence imagée.
- source_word: צֹרְרֶיךָ
  choice: tes adversaires
  rationale: Le participe désigne ceux qui se montrent hostiles. « Adversaires » convient au contexte militaire et à la profanation du lieu sacré.
- source_word: בְּקֶרֶב
  choice: au cœur de
  rationale: L’expression situe l’action à l’intérieur même du lieu ; « au cœur de » est naturel en français tout en gardant cette insistance spatiale.
- source_word: מוֹעֲדֶךָ
  choice: le lieu où tu rencontres les tiens
  rationale: מוֹעֵד peut désigner un temps fixé, une assemblée ou un lieu de rencontre fixé. Dans ce contexte de profanation du sanctuaire, le sens spatial et cultuel paraît le plus probable, sans que le français impose un bâtiment précis.
- source_word: שָׂמוּ
  choice: ils y ont dressé
  rationale: שׂים signifie placer ou établir. « Dresser » convient à l’installation ostentatoire de signes ou d’emblèmes ennemis dans le lieu sacré.
- source_word: אוֹתֹתָם אֹתוֹת
  choice: leurs propres signes comme signes de leur présence
  rationale: L’hébreu répète « signes » dans une formule concise. La traduction conserve la répétition lexicale tout en explicitant prudemment leur fonction probable de marques d’occupation ou de domination.
theological_decisions:
- issue: Sens de מוֹעֵד dans une lamentation sur la profanation du sanctuaire
  choice: 'sens spatial et cultuel : « le lieu où tu rencontres les tiens »'
  alternative: « ton assemblée », « ton lieu fixé » ou « ton temps fixé »
  rationale: Le contexte immédiat décrit l’intrusion et la destruction dans l’espace sacré. Le sens locatif est donc le plus naturel, mais une note maintient visibles les autres valeurs possibles du terme.
- issue: Fonction des signes ennemis
  choice: marques de leur présence
  alternative: enseignes, étendards ou marques de victoire et de possession
  rationale: Le texte ne précise pas la nature exacte des signes. La formulation indique leur fonction générale sans les identifier à un objet militaire ou cultuel déterminé.
translation_notes:
  register: Français international moderne, digne et accessible. « Rugi » maintient l’image violente de l’hébreu ; « au cœur de » rend naturellement l’insistance spatiale. Les notes préservent l’ambiguïté de מוֹעֵד et la formulation inhabituelle fondée sur la répétition de « signes ».
