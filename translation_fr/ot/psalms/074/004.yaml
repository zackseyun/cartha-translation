  source_fidelity: La première proposition rend bien le cri hostile de שָׁאֲגוּ et la localisation intérieure de בְּקֶרֶב. Cependant, « le lieu où tu rencontres les tiens » ajoute « les tiens », absent de l’hébreu, et transforme inutilement le nom en proposition. Dans la seconde proposition, « de leur présence » explicite une fonction probable, mais non exprimée par le texte. La répétition de « signes » doit rester perceptible sans cette addition.
  naturalness: « Au cœur de ton lieu de rencontre » est naturel en français moderne, garde la portée cultuelle et spatiale, et évite l’ajout interprétatif. « Ils ont dressé leurs propres signes comme signes » demeure volontairement dense, à l’image de l’hébreu, mais reste compréhensible grâce à la note.
  terminology: « Adversaires », « rugi », « lieu de rencontre » et « signes » sont justes et cohérents. « Lieu de rencontre » préserve mieux l’ambiguïté de מוֹעֵד que « sanctuaire », tout en convenant au contexte. Le possessif « leurs propres » souligne de façon acceptable l’opposition implicite entre les signes des ennemis et ceux du lieu sacré.
