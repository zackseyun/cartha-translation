  text: אַל תִּ֭שְׁכַּח ק֣וֹל צֹרְרֶ֑י/ךָ שְׁא֥וֹן קָ֝מֶ֗י/ךָ עֹלֶ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: fr
  text: N’oublie pas la voix de tes ennemis[a] ; le tumulte de ceux qui se dressent contre toi monte sans cesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cris de tes ennemis » ou « le bruit de tes ennemis ». Le mot hébreu peut désigner une voix, un son ou un bruit.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi rendre la construction de façon plus concise : « le tumulte de ceux qui se dressent contre toi monte sans cesse ».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אַל תִּשְׁכַּח
  choice: N’oublie pas
  rationale: Rend directement la supplication négative suivie du verbe שׁכח, tout en restant naturelle en français.
- source_word: קוֹל
  choice: les cris
  rationale: קוֹל peut désigner la voix, le son ou le bruit. Dans ce contexte d’hostilité collective et en parallèle avec שְׁאוֹן, « les cris » exprime naturellement la clameur sans effacer l’idée vocale.
- source_word: צֹרְרֶיךָ
  choice: de tes ennemis
  rationale: Traduction courante et directe du participe pluriel désignant ceux qui se montrent hostiles.
- source_word: שְׁאוֹן
  choice: le tumulte
  rationale: Le terme évoque une agitation bruyante et désordonnée ; « tumulte » convient au registre poétique et au parallélisme.
- source_word: קָמֶיךָ
  choice: de ceux qui se dressent contre toi
  rationale: Préserve l’image verbale de קום et son sens contextuel d’opposition.
- source_word: עֹלֶה
  choice: monte
  rationale: Conserve l’image spatiale du bruit qui s’élève, avec un accord naturel sur « tumulte ».
- source_word: תָמִיד
  choice: sans cesse
  rationale: Expression française idiomatique traduisant la continuité indiquée par תָמִיד.
