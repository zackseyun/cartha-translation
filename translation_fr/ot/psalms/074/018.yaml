source:
  edition: WLC
  text: זְכָר זֹ֗את א֭וֹיֵב חֵרֵ֣ף יְהוָ֑ה וְ/עַ֥ם נָ֝בָ֗ל נִֽאֲצ֥וּ שְׁמֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: fr
  text: 'Souviens-toi de ceci : l’ennemi s’est moqué de Yahweh[a], et un peuple insensé[b] a méprisé ton nom[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a couvert Yahweh de reproches » ou « a provoqué Yahweh par ses insultes ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « insensé » évoque une folie morale, et non seulement un manque d’intelligence ; voir Psaume 14.1.
    reason: cross_reference
  - marker: c
    text: Ou « a traité ton nom avec mépris » ; peut-être « a blasphémé ton nom ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: Souviens-toi de ceci
  rationale: L’impératif qal masculin singulier adresse directement à Dieu une supplication. « Souviens-toi de ceci » est naturel dans la langue de la prière et conserve la portée de l’appel.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le nom singulier, sans article en hébreu, désigne ici l’adversaire de manière générique ou collective. « L’ennemi » convient au contexte de lamentation.
- source_word: חֵרֵף
  choice: s’est moqué de
  rationale: Le verbe exprime une parole de mépris, de reproche ou de provocation. « S’est moqué de » communique clairement cette attitude en français actuel, sans imposer une nuance plus précise que l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: וְעַם נָבָל
  choice: et un peuple insensé
  rationale: עַם désigne collectivement un peuple. נָבָל évoque ici une folie morale et spirituelle, et non un simple manque d’intelligence ; « insensé » garde cette profondeur sans expliciter excessivement.
- source_word: נִאֲצוּ
  choice: a méprisé
  rationale: Le verbe exprime le dédain, le rejet méprisant ou l’outrage. « A méprisé » reste assez large pour préserver l’éventail de sens, tandis que des possibilités plus fortes sont signalées en note.
- source_word: שְׁמֶךָ
  choice: ton nom
  rationale: La traduction littérale préserve l’expression biblique, où le nom peut aussi englober l’identité, la réputation et le caractère révélé de Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le verset emploie directement le tétragramme. « Yahweh » conserve le nom personnel et l’alternance significative entre la troisième personne (« Yahweh ») et la deuxième personne (« ton nom »).
- issue: Portée morale de נָבָל
  choice: insensé
  alternative: fou ; impie ; dépravé
  rationale: Le terme porte souvent une condamnation morale et religieuse. « Insensé » permet cette lecture sans réduire le mot à « impie » ni introduire une qualification plus forte que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La structure parallèle et le passage de « Yahweh » à « ton nom » sont conservés.
