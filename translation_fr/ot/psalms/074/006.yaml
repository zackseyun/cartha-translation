source:
  edition: WLC
  text: ו/עת פִּתּוּחֶ֣י/הָ יָּ֑חַד בְּ/כַשִּׁ֥יל וְ֝/כֵֽילַפֹּ֗ת יַהֲלֹמֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/006.yaml
  text: And now they smash all its carved work together with hatchet and hammers[a][b].
translation:
  language: fr
  text: Et maintenant, ils brisent toutes ses sculptures à coups de hache et de marteaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à coups de cognée et de maillets »; l’hébreu nomme des outils servant à tailler ou à frapper, mais leur équivalent moderne exact est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַת
  choice: Et maintenant
  rationale: La conjonction et l’adverbe temporel introduisent la scène présente de destruction tout en maintenant le lien avec le verset précédent.
- source_word: פִּתּוּחֶיהָ
  choice: ses sculptures
  rationale: Le nom désigne collectivement les ornements taillés ou gravés de l’édifice; « sculptures » est naturel et accessible en français.
- source_word: יַחַד
  choice: toutes
  rationale: Dans ce contexte, l’adverbe exprime la totalité collective. Le rendre par « toutes » évite une tournure ambiguë ou redondante avec « ensemble ».
- source_word: בְּכַשִּׁיל
  choice: à coups de hache
  rationale: Le terme désigne un outil tranchant employé pour travailler le bois. « Hache » est l’équivalent moderne le plus clair, bien que l’identification précise reste incertaine.
- source_word: וְכֵילַפּוֹת
  choice: et de marteaux
  rationale: Le terme pluriel désigne vraisemblablement des outils servant à frapper. « Marteaux » convient au contexte destructeur, sans prétendre lever l’incertitude lexicale.
- source_word: יַהֲלֹמוּן
  choice: ils brisent
  rationale: Le verbe signifie frapper avec force; « brisent » exprime ici le résultat destructeur sans ajouter une image étrangère au texte.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le mouvement narratif, exprime יַחַד par la totalité (« toutes ») et évite l’ambiguïté que créerait « ensemble avec ». L’expression « à coups de » rend naturellement l’emploi destructeur des outils.
