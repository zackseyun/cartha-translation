id: PSA.74.12
reference: Psalms 74:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וֵ֭/אלֹהִים מַלְכִּ֣/י מִ/קֶּ֑דֶם פֹּעֵ֥ל יְ֝שׁוּע֗וֹת בְּ/קֶ֣רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: fr
  text: Pourtant, Dieu est mon roi depuis les temps anciens ; il accomplit des délivrances au milieu de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ». Le mot hébreu peut désigner soit la terre entière, soit un pays ou un territoire particulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Pourtant, Dieu
  rationale: Dans le contexte de la dévastation décrite auparavant, la conjonction a une valeur adversative. « Pourtant » exprime naturellement le contraste et אֱלֹהִים désigne ici le Dieu d’Israël.
- source_word: מַלְכִּי
  choice: mon roi
  rationale: Le nom avec suffixe de première personne du singulier signifie directement « mon roi ». La minuscule est conforme à l’usage courant du français pour les titres accompagnés d’un possessif.
- source_word: מִקֶּדֶם
  choice: depuis les temps anciens
  rationale: L’expression renvoie à une époque reculée ou à une longue ancienneté, sans imposer le sens absolu de « depuis le commencement ».
- source_word: פֹּעֵל
  choice: il accomplit
  rationale: Le participe présente l’action de Dieu comme caractéristique ou continue. Une proposition verbale explicite est plus naturelle en français qu’un participe calqué.
- source_word: יְשׁוּעוֹת
  choice: des délivrances
  rationale: Le pluriel désigne des interventions salvatrices répétées. « Délivrances » conserve ce pluriel de façon idiomatique et convient au contexte des hauts faits divins.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Cette expression garde le sens spatial de ce qui se produit au sein d’un espace donné.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un territoire particulier. Le contexte ample des actes royaux de Dieu favorise « la terre », sans supprimer l’autre possibilité.
theological_decisions:
- issue: Étendue des actes salvateurs de Dieu
  choice: la terre
  alternative: le pays
  rationale: Le mot hébreu אֶרֶץ reste ambigu entre le monde terrestre et un pays déterminé. « La terre » convient à la portée générale du verset, tandis qu’une note préserve la lecture territoriale possible.
translation_notes:
  register: Français moderne, digne et poétique sans archaïsme marqué. Le parallélisme est rendu par un point-virgule ; « des délivrances » conserve le pluriel concret de l’hébreu.
