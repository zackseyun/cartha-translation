  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: fr
  text: Nous ne voyons pas nos signes[a] ; il n’y a plus de prophète, et personne parmi nous ne sait jusqu’à quand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos emblèmes » ou « nos marques distinctives » ; le terme hébreu peut désigner des signes visibles ou des emblèmes, mais son référent précis n’est pas indiqué ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: nos signes
  rationale: « Signes » garde le sens large de אוֹת et évite de préciser à tort s’il s’agit d’emblèmes, de manifestations divines ou d’autres marques visibles.
- source_word: לֹא רָאִינוּ
  choice: nous ne voyons plus
  rationale: 'Le parfait exprime ici, dans la plainte, un état présent résultant : les signes ne sont désormais plus visibles. « Ne… plus » rend naturellement cette absence persistante en français.'
- source_word: אֵין עוֹד נָבִיא
  choice: il n’y a plus de prophète
  rationale: La tournure rend la cessation exprimée par אֵין עוֹד, tandis que le singulier « prophète » conserve la formulation générique de l’hébreu.
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: et personne parmi nous ne sait
  rationale: Cette formulation française explicite naturellement la construction elliptique sans ajouter de contenu.
- source_word: עַד מָה
  choice: jusqu’à quand
  rationale: Dans une lamentation, l’expression interroge normalement la durée. « Jusqu’à quand » en conserve la forme et la force plaintive.
theological_decisions:
- issue: Référent de « nos signes »
  choice: Maintenir l’expression générale « nos signes ».
  alternative: « nos étendards », ou une explicitation telle que « les signes de la présence de Dieu parmi nous »
  rationale: Le texte hébreu ne précise pas de quels signes il s’agit. Une traduction générale préserve cette ambiguïté et n’impose ni cadre cultuel ni interprétation militaire.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « plus » restitue la plainte sur une absence désormais constatée ; « jusqu’à quand » conserve l’élan interrogatif du vers.
