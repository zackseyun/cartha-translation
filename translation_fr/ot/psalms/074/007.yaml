  verdict: revise
  source_fidelity: Le premier membre rend correctement l’idiome hébreu שִׁלְחוּ בָאֵשׁ par une expression française naturelle désignant l’incendie. « Sanctuaire » rend היטement מִקְדָּשׁ. Le second membre conserve « profaner » pour חִלְּלוּ et l’expression littérale « la demeure de ton nom » pour מִשְׁכַּן שְׁמֶךָ. Toutefois, « profané jusqu’à terre la demeure » est syntaxiquement heurté en français et ne rend pas clairement la force destructive de לָאָרֶץ.
  naturalness: « Livré ton sanctuaire aux flammes » est idiomatique, soutenu et adapté à la poésie. Dans le second membre, « ont jeté à terre et profané » est naturel, garde les deux dimensions — abaissement/destruction et profanation — et évite un ordre des mots calqué sur l’hébreu.
  terminology: « Sanctuaire », « profané », « demeure » et « nom » maintiennent le registre cultuel ainsi que la distinction lexicale entre מִקְדָּשׁ et מִשְׁכָּן. La formule « demeure de ton nom » préserve l’idiome théologique sans le réduire à une interprétation confessionnelle.
