  text: שִׁלְח֣וּ בָ֭/אֵשׁ מִקְדָּשֶׁ֑/ךָ לָ֝/אָ֗רֶץ חִלְּל֥וּ מִֽשְׁכַּן שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/007.yaml
  text: They set your sanctuary on fire[c][b][a]; they profaned the dwelling place of your name to the ground.
translation:
  language: fr
  text: Ils ont livré ton sanctuaire aux flammes[a] ; ils ont jeté à terre et profané la demeure de ton nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils ont envoyé le feu dans ton sanctuaire. » L’expression hébraïque signifie qu’ils l’ont incendié.'
    reason: lexical_alternative
  - marker: b
    text: « La demeure de ton nom » désigne le lieu choisi où Dieu fait connaître sa présence.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: ils ont livré … aux flammes
  rationale: L’expression hébraïque signifie littéralement qu’ils ont envoyé ou appliqué le feu au sanctuaire. « Livrer aux flammes » exprime naturellement en français l’action de l’incendier tout en gardant la force poétique.
- source_word: מִקְדָּשֶׁךָ
  choice: ton sanctuaire
  rationale: מִקְדָּשׁ désigne un lieu saint. « Sanctuaire » préserve ce sens sans réduire explicitement le terme au seul bâtiment du temple.
- source_word: לָאָרֶץ
  choice: jusqu’à terre
  rationale: Dans ce contexte, l’expression marque un abaissement ou une profanation poussée jusqu’au sol. La place retenue conserve aussi l’ambiguïté syntaxique possible quant à son rattachement.
- source_word: חִלְּלוּ
  choice: ils ont profané
  rationale: Le piel de חלל exprime ici la profanation de ce qui est saint. « Profaner » rend directement le contraste cultuel.
- source_word: מִשְׁכַּן
  choice: la demeure
  rationale: מִשְׁכַּן désigne un lieu d’habitation. « Demeure » conserve cette image tout en évitant le terme technique « tabernacle », inadapté au contexte de la destruction du sanctuaire.
- source_word: שְׁמֶךָ
  choice: de ton nom
  rationale: La formulation littérale maintient l’expression théologiquement significative selon laquelle le nom de Dieu demeure dans le lieu choisi.
theological_decisions:
- issue: Rendre la paire מִקְדָּשׁ / מִשְׁכַּן
  choice: « sanctuaire » et « demeure »
  alternative: « temple » et « sanctuaire »
  rationale: 'Deux termes français distincts préservent les deux images hébraïques : le lieu est saint et il est la demeure du nom de Dieu.'
- issue: Préserver la théologie du nom
  choice: « la demeure de ton nom »
  alternative: « le lieu où demeure ton nom » ou « ta demeure »
  rationale: La formulation conserve la tension biblique entre la présence divine et le bâtiment, sans identifier simplement Dieu au sanctuaire.
- issue: Rattachement de לָאָרֶץ
  choice: placer « jusqu’à terre » avant le complément d’objet
  alternative: « ils ont profané la demeure de ton nom jusqu’à terre »
  rationale: L’ordre choisi reste compréhensible en français et évite de trancher trop nettement entre l’idée de profaner jusqu’à terre et celle de jeter à terre la demeure du nom.
translation_notes:
  register: Français international moderne, digne et poétique. « Livré … aux flammes » est naturel sans être familier ; « sanctuaire », « profané » et « demeure de ton nom » conservent le registre cultuel et la portée théologique de l’hébreu.
