id: PSA.74.10
reference: Psalms 74:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: fr
  text: Jusqu’à quand, ô Dieu, l’adversaire te couvrira-t-il d’insultes ? L’ennemi méprisera-t-il ton nom pour toujours ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’ennemi blasphémera-t-il ton nom pour toujours ? »'
    reason: Alternative lexicale pour יְנָאֵץ, qui peut désigner plus précisément le mépris sacrilège envers Dieu ou son nom.
lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Expression interrogative idiomatique de la plainte, naturelle en français et fidèle à l’idée d’une souffrance qui se prolonge.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le vocatif conserve l’adresse directe et solennelle de la prière.
- source_word: יְחָרֶף
  choice: te couvrira-t-il d’insultes
  rationale: Le piel de חרף exprime ici l’outrage et les insultes proférés contre Dieu; cette formulation est naturelle en français courant.
- source_word: צָר
  choice: l’adversaire
  rationale: Rend le sens d’opposant hostile tout en distinguant ce terme de אוֹיֵב dans le parallélisme.
- source_word: יְנָאֵץ
  choice: méprisera-t-il
  rationale: Le piel de נאץ dénote le fait de traiter avec mépris; appliqué au nom divin, il peut aussi recevoir le sens plus précis de « blasphémer ».
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Équivalent français usuel, distinct de « l’adversaire » employé pour צָר.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Conserve l’expression hébraïque, riche de ses connotations d’honneur, de réputation et d’identité révélée.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Rend naturellement la durée apparemment sans fin qui nourrit la plainte du psalmiste.
theological_decisions:
- issue: Faut-il expliciter que le mépris du nom de Dieu constitue un blasphème contre Dieu lui-même ?
  choice: Conserver « ton nom » dans le texte principal et traduire נאץ par « mépriser »
  alternative: « L’ennemi blasphémera-t-il ton nom pour toujours ? »
  rationale: L’hébreu mentionne explicitement le nom de Dieu. La formulation retenue en préserve la portée théologique sans imposer dans le texte principal le terme plus spécialisé « blasphémer ».
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme distingue צָר (« l’adversaire ») de אוֹיֵב (« l’ennemi »). Le futur interrogatif traduit les formes inaccomplies hébraïques dans cette plainte.
