source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: fr
  text: Lève-toi, ô Dieu ! Défends ta cause[a] ! Souviens-toi de l’outrage qui t’est fait par l’insensé[b] tout au long du jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Plaide ta cause ». L’hébreu emploie le vocabulaire d’un litige judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « l’insensé » n’est pas simplement une personne dépourvue d’intelligence, mais quelqu’un de moralement corrompu ou d’impie.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: L’impératif de קום, avec ה paragogique, exprime un appel pressant à l’action. « Lève-toi » est naturel en français moderne et conserve cette force.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô Dieu » restitue le caractère solennel et priant de l’appel.
- source_word: רִיבָה רִיבֶךָ
  choice: Défends ta cause
  rationale: Le verbe et son complément relèvent du langage du litige judiciaire. Cette formulation française naturelle conserve l’image d’une cause que Dieu est appelé à soutenir.
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: L’impératif demande à Dieu de prendre en compte les insultes et d’agir, sans expliciter cette conséquence dans le texte.
- source_word: חֶרְפָּתְךָ
  choice: des insultes que […] t’adresse
  rationale: חֶרְפָּה désigne ici l’outrage ou l’insulte. La tournure explicite naturellement en français la direction probable de l’insulte vers Dieu, sans introduire l’idée de honte éprouvée.
- source_word: מִנִּי נָבָל
  choice: que l’insensé t’adresse
  rationale: מִנִּי indique la provenance de l’outrage. נָבָל désigne un être moralement corrompu ou impie, sens biblique que « l’insensé » peut porter et que précise la note.
- source_word: כָּל הַיּוֹם
  choice: sans cesse
  rationale: L’expression signifie littéralement « tout le jour » et peut décrire une action continuelle. « Sans cesse » est idiomatique et évite de suggérer qu’elle se limite aux heures diurnes.
theological_decisions:
- issue: Référent de « ton outrage » (חֶרְפָּתְךָ)
  choice: Les insultes sont présentées comme adressées à Dieu.
  alternative: L’outrage subi par le peuple de Dieu peut aussi être considéré comme le sien en raison de leur relation d’alliance.
  rationale: Le suffixe de deuxième personne et l’appel parallèle à Dieu pour qu’il défende sa propre cause favorisent l’idée d’insultes dirigées contre lui. Le contexte plus large permet néanmoins une dimension collective; la traduction n’ajoute aucune précision doctrinale sur celle-ci.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme impératif est conservé, ainsi que la métaphore judiciaire. Les deux marqueurs de notes figurent dans le texte.
