source:
  edition: WLC
  text: הָרִ֣ימָ/ה פְ֭עָמֶי/ךָ לְ/מַשֻּׁא֣וֹת נֶ֑צַח כָּל הֵרַ֖ע אוֹיֵ֣ב בַּ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/003.yaml
  text: Lift up your steps to the perpetual ruins[a]; the enemy has devastated everything in the sanctuary.
translation:
  language: fr
  text: 'Porte tes pas vers les ruines éternelles[a] : l’ennemi a tout dévasté dans le sanctuaire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Porte tes pieds vers les dévastations perpétuelles ». L’hébreu conserve l’image saisissante de Dieu avançant vers le sanctuaire en ruine.
    reason: Alternative lexicale pour « pas » et « ruines éternelles », avec explication de l’image hébraïque conservée.
lexical_decisions:
- source_word: הָרִימָה
  choice: Élève
  rationale: L’impératif de רום est adressé à Dieu. « Élève » conserve l’image concrète de ses pas sans la remplacer par une paraphrase telle que « Viens ».
- source_word: פְעָמֶיךָ
  choice: tes pas
  rationale: פעם peut désigner le pas ou les pieds. « Tes pas » est naturel en français et préserve l’image anthropomorphique du déplacement de Dieu.
- source_word: לְמַשֻּׁאוֹת
  choice: vers ces ruines
  rationale: Le nom désigne des lieux ou des réalités dévastés. « Ruines » exprime naturellement le résultat de la destruction; « vers » convient au mouvement impliqué par les pas.
- source_word: נֶצַח
  choice: perpétuelles
  rationale: נֶצַח qualifie ici les ruines comme durables ou persistantes. « Perpétuelles » maintient la force du lamentable constat sans préciser indûment si elles sont anciennes ou définitives.
- source_word: כָּל
  choice: tout
  rationale: Le terme exprime l’étendue totale des dégâts causés par l’ennemi.
- source_word: הֵרַע
  choice: a dévasté
  rationale: Le hiphil de רעע signifie ici faire du mal, endommager ou ravager. Dans le contexte du sanctuaire détruit, « a dévasté » rend bien la gravité de l’action.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier peut représenter collectivement l’adversaire; « l’ennemi » est clair et fidèle au contexte.
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: קֹדֶשׁ désigne ici le lieu sacré, vraisemblablement le sanctuaire du temple. « Sanctuaire » conserve cette valeur cultuelle.
theological_decisions:
- issue: Appel anthropomorphique adressé à Dieu
  choice: Conserver l’image concrète « Élève tes pas »
  alternative: « Viens », « Avance » ou « Dirige-toi »
  rationale: La formulation poétique représente Dieu en mouvement vers le sanctuaire ruiné. La conserver évite d’ajouter une idée de vitesse ou de réduire l’image à une simple invitation à venir.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le démonstratif « ces » rend la scène plus naturelle en français, tandis que les termes « ruines perpétuelles » et « sanctuaire » préservent la densité poétique et cultuelle de l’hébreu.
