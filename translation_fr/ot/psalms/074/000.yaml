  yaml_path: translation/ot/psalms/074/000.yaml
  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: fr
  text: Maskil[a] d’Asaph. Pourquoi, ô Dieu, nous as-tu rejetés pour toujours ? Pourquoi ta colère fume-t-elle contre le troupeau de ton pâturage ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Maskil » est un terme technique employé dans les titres de certains psaumes ; il peut désigner une composition méditative ou instructive.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Méditation
  rationale: Ce terme technique de suscription désigne probablement un poème destiné à faire réfléchir ou à instruire. « Méditation » reste naturel en français tout en conservant une part de l’incertitude du terme hébreu.
- source_word: זָנַחְתָּ
  choice: nous as-tu rejetés
  rationale: Le verbe exprime le rejet ou l’abandon. Le complément « nous » est implicite dans l’hébreu et ressort du contexte collectif et de l’image du troupeau.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: ta colère fume-t-elle
  rationale: La traduction conserve l’image vive de la fumée associée à la colère, plutôt que de la réduire à une simple intensité émotionnelle.
- source_word: צֹאן מַרְעִיתֶךָ
  choice: le troupeau dont tu es le berger
  rationale: Littéralement « le troupeau de ton pâturage ». Cette formulation française exprime naturellement la relation pastorale sans laisser entendre que le troupeau appartient au pâturage.
theological_decisions:
- issue: Portée de לָנֶצַח (« pour toujours »)
  choice: pour toujours
  alternative: à jamais / sans fin
  rationale: Le texte met dans la bouche du psalmiste la perception angoissée d’un rejet définitif. La traduction préserve cette tension sans décider si l’expression décrit une réalité absolue ou une plainte rhétorique.
- issue: Image de Dieu comme berger
  choice: dont tu es le berger
  alternative: de ton pâturage
  rationale: Le lien d’appartenance et de soin pastoral est rendu explicitement, sans ajouter une doctrine particulière ni affaiblir l’accusation poignante adressée à Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « ô Dieu » marque naturellement l’adresse directe. Les questions et l’image de la colère qui fume sont conservées avec leur force poétique.
