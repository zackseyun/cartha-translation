  text: אַל תִּתֵּ֣ן לְ֭/חַיַּת נֶ֣פֶשׁ תּוֹרֶ֑/ךָ חַיַּ֥ת עֲ֝נִיֶּ֗י/ךָ אַל תִּשְׁכַּ֥ח לָ/נֶֽצַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: fr
  text: Ne livre pas la vie de ta tourterelle à la bête sauvage ; n’oublie pas pour toujours la vie de tes affligés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיַּת נֶפֶשׁ תּוֹרֶךָ
  choice: la vie de ta tourterelle
  rationale: Le texte massorétique associe littéralement « vie » et « ta tourterelle ». Cette formulation conserve l’image affective de la tourterelle représentant le peuple menacé, sans introduire dans le texte principal l’idée de voracité, absente du nom חיה.
- source_word: לְחַיַּת
  choice: à la bête
  rationale: חיה désigne une bête ou un animal sauvage. « La bête » reste concise et préserve l’opposition poétique entre la tourterelle vulnérable et son prédateur implicite.
- source_word: חַיַּת עֲנִיֶּיךָ
  choice: la vie de tes malheureux
  rationale: La vocalisation massorétique חַיַּת permet de comprendre « la vie de ». עניים désigne ici les personnes affligées, pauvres ou opprimées ; « malheureux » exprime leur détresse sans la réduire à la seule pauvreté matérielle.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Rend directement l’idée de durée indéfinie ou perpétuelle et s’attache naturellement à l’impératif négatif « n’oublie pas ».
theological_decisions:
- issue: Identification de la tourterelle
  choice: Conserver l’image sans expliciter son référent dans le verset
  alternative: Traduire directement par « ton peuple »
  rationale: La tourterelle représente vraisemblablement la communauté de Dieu dans le contexte, mais l’image hébraïque est théologiquement et poétiquement significative et ne doit pas être remplacée par son interprétation.
- issue: Singulier collectif dans « tes malheureux »
  choice: « la vie de tes malheureux »
  alternative: « les vies de tes malheureux »
  rationale: Le singulier חַיַּת est conservé comme collectif, ce qui maintient l’écho lexical avec la première proposition et peut évoquer la vie commune du peuple affligé.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme et la métaphore animale sont préservés ; la légère étrangeté de « la vie de ta tourterelle » reflète celle de l’hébreu plutôt que de la résoudre silencieusement.
