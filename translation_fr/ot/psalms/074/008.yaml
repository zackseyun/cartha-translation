source:
  edition: WLC
  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: fr
  text: 'Ils ont dit dans leur cœur : « Détruisons-les tous ensemble ! »[a] Ils ont incendié tous les lieux de rassemblement de Dieu dans le pays.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « Détruisons-les » est difficile. Il pourrait aussi signifier « Opprimons-les », « Soumettons-les », ou exprimer autrement une intention destructrice.
    reason: lexical_alternative
  - marker: b
    text: Ou « tous les lieux désignés par Dieu ». Le terme hébreu peut évoquer des temps fixés, des rencontres ou des lieux de rassemblement ; certaines traductions traditionnelles ont « toutes les synagogues de Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  choice: Ils ont dit
  rationale: Le qal accompli, troisième personne du pluriel, introduit ici la résolution intérieure des ennemis ; le passé composé convient au récit poétique en français moderne.
- source_word: בְלִבָּם
  choice: dans leur cœur
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de la pensée et de l’intention, tout en restant claire en français.
- source_word: נִינָם
  choice: Anéantissons-les
  rationale: La forme hébraïque est très difficile. Dans le contexte, elle semble exprimer une volonté hostile de suppression totale ; cette traduction rend cette intention sans prétendre résoudre définitivement la difficulté lexicale.
- source_word: יָחַד
  choice: tous ensemble
  rationale: L’adverbe signifie « ensemble » ; avec le pronom objet pluriel, « tous ensemble » exprime naturellement la portée collective ou totale du projet.
- source_word: שָׂרְפוּ
  choice: Ils ont incendié
  rationale: Le verbe désigne l’action de brûler. « Incendier » convient particulièrement à des lieux et rend l’acte volontaire avec concision.
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: tous les lieux de rassemblement de Dieu
  rationale: מוֹעֵד peut désigner un temps fixé, une rencontre ou un lieu de rencontre. Puisque ces réalités sont brûlées et situées dans le pays, le sens spatial est le plus probable. « Lieux de rassemblement » évite l’anachronisme possible de « synagogues ».
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans le contexte du psaume, אֶרֶץ renvoie vraisemblablement au pays d’Israël plutôt qu’à la terre entière.
theological_decisions:
- issue: Sens de מוֹעֲדֵי אֵל dans un contexte d’incendie
  choice: des lieux consacrés au rassemblement devant Dieu
  alternative: les temps ou fêtes fixés par Dieu ; les synagogues de Dieu
  rationale: Le verbe « incendier » et le complément « dans le pays » favorisent un référent spatial. La traduction ne précise pas une institution historique particulière et maintient le lien avec l’assemblée cultuelle.
- issue: Interprétation de la forme obscure נִינָם
  choice: 'une exhortation hostile : « Anéantissons-les »'
  alternative: « Opprimons-les », « Soumettons-les », ou une analyse nominale entraînant une autre syntaxe
  rationale: La forme ne permet pas une certitude lexicale. Le contexte soutient une intention destructrice, mais l’incertitude réelle est explicitement conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. L’image biblique « dans leur cœur » est conservée. « Lieux de rassemblement » privilégie le sens spatial imposé par l’incendie sans introduire une institution potentiellement anachronique ; les deux principales ambiguïtés du texte sont signalées en notes.
