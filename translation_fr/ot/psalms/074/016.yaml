  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: fr
  text: À toi est le jour, à toi aussi la nuit. C’est toi qui as établi la lumière[a] et le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le luminaire ». Certains comprennent « la lune » en raison du parallèle entre le jour et la nuit, mais le texte hébreu ne dit pas explicitement « lune ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: À toi est
  rationale: La préposition ל avec le suffixe de 2e personne masculine singulier exprime ici la possession. La tournure « À toi est » conserve en français l’antéposition emphatique de l’hébreu.
- source_word: יוֹם
  choice: le jour
  rationale: Équivalent courant de יוֹם, ici en contraste avec « la nuit ».
- source_word: אַף
  choice: aussi
  rationale: 'La particule ajoute avec insistance le second élément : non seulement le jour, mais aussi la nuit.'
- source_word: לָיְלָה
  choice: la nuit
  rationale: Équivalent courant, en opposition poétique avec « le jour ».
- source_word: אַתָּה
  choice: C’est toi qui
  rationale: Cette construction française rend naturellement l’insistance portée par le pronom explicite hébreu.
- source_word: הֲכִינוֹתָ
  choice: as établi
  rationale: Le hiphil de כון exprime l’action de fixer, mettre en place ou établir. « Établir » convient au contexte de l’ordre cosmique.
- source_word: מָאוֹר
  choice: la lumière
  rationale: מָאוֹר peut désigner une lumière ou un luminaire. « La lumière » conserve une distinction naturelle avec « le soleil » sans introduire explicitement la lune.
- source_word: וָשָׁמֶשׁ
  choice: et le soleil
  rationale: Traduction directe de la conjonction et du nom שֶׁמֶשׁ.
theological_decisions:
- issue: Sens de מָאוֹר par rapport à שֶׁמֶשׁ
  choice: Traduire מָאוֹר par « la lumière » et le distinguer du « soleil ».
  alternative: Traduire par « le luminaire » ou, par inférence contextuelle, par « la lune ».
  rationale: Le texte hébreu ne dit pas explicitement « lune ». « Lumière » respecte le champ lexical du mot et préserve l’ambiguïté de l’image sans imposer l’interprétation suggérée par le parallèle jour/nuit.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme possessif est conservé par « À toi est… à toi aussi… », tandis que « C’est toi qui » restitue l’emphase du pronom hébreu explicite.
