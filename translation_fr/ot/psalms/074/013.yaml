id: PSA.74.13
reference: Psalms 74:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: fr
  text: C’est toi qui, par ta puissance, as fendu la mer[b] ; tu as brisé les têtes des monstres marins[a] sur les eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dragons » ou « grandes créatures marines ». Le terme hébreu peut désigner des créatures monstrueuses et serpentiformes associées aux eaux.
    reason: lexical_alternative
  - marker: b
    text: Ce verset peut évoquer à la fois la victoire de Dieu sur la mer chaotique dans le langage poétique et la délivrance historique lors du passage de la mer au temps de l’exode.
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: as fendu
  rationale: Le verbe exprime ici l’action de rompre ou de diviser. « Fendre la mer » est naturel en français, garde la vigueur poétique et peut évoquer à la fois la maîtrise des eaux et la délivrance lors de l’exode.
- source_word: בְעָזְּךָ
  choice: par ta puissance
  rationale: Le beth est instrumental et עֹז désigne la force ou la puissance. « Par ta puissance » convient au registre poétique et souligne le moyen de l’action.
- source_word: יָם
  choice: la mer
  rationale: L’article est idiomatique en français pour désigner la mer envisagée dans cette scène poétique, sans décider s’il s’agit uniquement de l’exode ou des eaux chaotiques.
- source_word: שִׁבַּרְתָּ
  choice: tu as brisé
  rationale: « Briser » traduit directement שׁבר et conserve la violence de l’image sans ajouter la nuance plus précise de « broyer ».
- source_word: רָאשֵׁי
  choice: les têtes des
  rationale: La construction nominale désigne littéralement les têtes. Le pluriel est maintenu afin de préserver l’image du texte hébreu.
- source_word: תַנִּינִים
  choice: monstres marins
  rationale: תַנִּינִים peut désigner de grands êtres serpentiformes ou monstrueux associés aux eaux. « Monstres marins » rend clairement l’imagerie poétique en français moderne, tandis qu’une note conserve les autres possibilités lexicales.
- source_word: עַל הַמָּיִם
  choice: sur les eaux
  rationale: « Sur » rend directement עַל et maintient l’image poétique, sans l’harmoniser en « dans les eaux ».
theological_decisions:
- issue: Nature de l’image de la mer et des תַנִּינִים
  choice: Conserver dans le texte l’imagerie poétique d’une victoire divine sur la mer et les monstres marins, tout en signalant son possible écho à l’exode.
  alternative: Interpréter exclusivement le verset comme un récit de l’exode, ou exclusivement comme une image cosmique de la maîtrise du chaos.
  rationale: Le verset permet une résonance à la fois cosmique et historique. La traduction ne réduit donc ni les créatures à des personnages historiques précis ni la mer à une abstraction mythologique.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure emphatique « C’est toi qui » rend le pronom hébreu explicite אַתָּה. Les images concrètes de la mer, des têtes et des monstres sont conservées sans explication doctrinale dans le corps du verset.
