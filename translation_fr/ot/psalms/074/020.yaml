source:
  edition: WLC
  text: הַבֵּ֥ט לַ/בְּרִ֑ית כִּ֥י מָלְא֥וּ מַחֲשַׁכֵּי אֶ֝֗רֶץ נְא֣וֹת חָמָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: fr
  text: Considère l’alliance[a], car les lieux obscurs du pays[b] sont remplis de repaires de violence[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton alliance ». L’hébreu dit littéralement « l’alliance », mais le contexte renvoie à l’alliance de Dieu avec son peuple.
    reason: alternative_reading
  - marker: b
    text: Ou « de la terre ». Le nom hébreu peut désigner le pays ou la terre selon le contexte.
    reason: lexical_alternative
  - marker: c
    text: Ou « demeures de violence » ou « lieux habités par la violence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Considère
  rationale: L’impératif invite Dieu à porter son attention sur l’alliance et à en tenir compte. « Considère » exprime naturellement cet appel en français sans réduire le verbe à la seule perception visuelle.
- source_word: לַבְּרִית
  choice: l’alliance
  rationale: Le nom porte l’article défini, sans possessif explicite. « L’alliance » conserve cette forme, même si le contexte désigne l’alliance de Dieu avec son peuple.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la supplication; « car » maintient clairement ce lien causal dans un registre de prière.
- source_word: מָלְאוּ
  choice: sont remplis de
  rationale: 'Le parfait décrit ici un état résultant: ces lieux se trouvent pleins de repaires caractérisés par la violence.'
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: les lieux obscurs du pays
  rationale: La construction signifie littéralement « les lieux obscurs du pays/de la terre ». « Pays » convient au cadre de la dévastation d’Israël, tout en laissant l’autre portée possible en note.
- source_word: נְאוֹת
  choice: repaires
  rationale: נָוֶה peut désigner une demeure, un lieu habité ou un pâturage. Associé à חָמָס, « repaires » rend naturellement des lieux où la violence s’installe, sans faire de la violence elle-même leur habitant littéral.
- source_word: חָמָס
  choice: violence
  rationale: Le terme désigne couramment la violence, souvent avec la nuance d’injustice violente ou d’oppression. « Violence » en est ici l’équivalent direct.
theological_decisions:
- issue: Faut-il rendre l’alliance explicitement possessive?
  choice: l’alliance
  alternative: ton alliance
  rationale: L’hébreu emploie l’article défini sans suffixe possessif. Le contexte indique bien qu’il s’agit de l’alliance de Dieu, mais le texte principal n’ajoute pas le possessif.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le caractère pressant de la prière, l’article défini de « l’alliance » et l’ambiguïté pays/terre, signalée en note.
