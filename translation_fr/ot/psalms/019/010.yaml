  text: הַֽ/נֶּחֱמָדִ֗ים מִ֭/זָּהָב וּ/מִ/פַּ֣ז רָ֑ב וּ/מְתוּקִ֥ים מִ֝/דְּבַ֗שׁ וְ/נֹ֣פֶת צוּפִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: fr
  text: Ils sont plus désirables que l’or, plus que beaucoup d’or fin ; ils sont plus doux que le miel, que le miel qui s’écoule des rayons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont à désirer plus que l’or […] et sont plus doux que le miel, que le miel qui s’écoule des rayons ». L’hébreu emploie des formes participiales avec des expressions comparatives ; la dernière expression peut aussi se rendre plus littéralement par « miel coulant des rayons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: plus désirables
  rationale: Le participe passif de חמד est employé comme prédicat avec un antécédent implicite repris du verset précédent. « Plus désirables » exprime naturellement la comparaison introduite par מִן.
- source_word: מִזָּהָב
  choice: que l’or
  rationale: La préposition מִן marque ici la comparaison et complète « plus désirables ».
- source_word: וּמִפַּז רָב
  choice: même que beaucoup d’or fin
  rationale: פַּז désigne un or pur ou raffiné, tandis que רָב en souligne l’abondance. « Même » rend la progression vers un bien plus précieux encore.
- source_word: וּמְתוּקִים
  choice: et plus doux
  rationale: L’adjectif est parallèle à « désirables » et prend une valeur comparative grâce au מִן qui suit.
- source_word: מִדְּבַשׁ
  choice: que le miel
  rationale: מִן introduit le second terme de la comparaison avec le miel.
- source_word: וְנֹפֶת צוּפִים
  choice: et que le miel qui coule des rayons
  rationale: נֹפֶת évoque le miel qui s’écoule, et צוּפִים les rayons ou alvéoles. Cette formulation conserve l’image concrète tout en restant naturelle en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le pronom masculin pluriel reprend les enseignements ou jugements mentionnés au verset précédent. Le parallélisme poétique et la progression de l’or à l’or fin, puis du miel au miel coulant des rayons, sont préservés.
