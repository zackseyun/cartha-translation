  yaml_path: translation/ot/psalms/019/002.yaml
  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: fr
  text: Le jour fait jaillir la parole au jour suivant[a], et la nuit fait connaître la connaissance à la nuit suivante[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déverse la parole » ou « profère une parole » ; le verbe hébreu évoque un jaillissement abondant, et non le simple fait de parler.
    reason: lexical_alternative
  - marker: b
    text: Ou « déclare » ou « révèle la connaissance » ; le verbe hébreu signifie « faire connaître » ou « déclarer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  choice: Le jour ... au jour suivant
  rationale: Cette formulation rend la transmission ou la succession exprimée par la répétition de « jour » avec ל, tout en restant naturelle en français et en préservant le parallélisme poétique.
- source_word: יַבִּיעַ
  choice: fait jaillir
  rationale: Le hiphil de נבע évoque un jaillissement ou un écoulement abondant. « Fait jaillir » conserve cette image vive plutôt que de réduire le verbe à une simple prise de parole.
- source_word: אֹמֶר
  choice: le récit
  rationale: Le nom désigne ici une expression verbale ou un propos. « Récit » s'accorde naturellement avec le témoignage continu des cieux dans le contexte, sans préciser indûment son contenu.
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: et la nuit ... à la nuit suivante
  rationale: La construction correspond à celle du premier hémistiche; une formulation parallèle restitue le mouvement d'une nuit à l'autre.
- source_word: יְחַוֶּה
  choice: communique
  rationale: Le piel de חוה signifie faire connaître, déclarer ou exposer. « Communique » rend ici l'idée de transmission sans imposer la nuance plus forte d'une révélation surnaturelle.
- source_word: דָּעַת
  choice: la connaissance
  rationale: « Connaissance » est l'équivalent direct du nom hébreu et maintient le parallélisme conceptuel avec « récit ».
