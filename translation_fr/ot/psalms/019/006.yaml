  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: fr
  text: Son lever vient d’une extrémité du ciel[a], et sa course va jusqu’aux extrémités du ciel[b] ; rien n’est caché à sa chaleur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa sortie ». Le terme hébreu peut désigner la sortie ou le point de départ du soleil.
    reason: lexical_alternative
  - marker: b
    text: Ou « son circuit ». Le terme hébreu évoque le parcours ou le mouvement circulaire du soleil à travers le ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: à une extrémité du ciel
  rationale: קָצֶה désigne une extrémité. En français, « le ciel » est naturel dans cette évocation de la voûte céleste, bien que l’hébreu שָׁמַיִם ait une forme plurielle.
- source_word: מוֹצָאוֹ
  choice: Il se lève
  rationale: מוֹצָא désigne ici la sortie ou l’apparition du soleil. « Il se lève » exprime naturellement ce mouvement en français, sans effacer l’alternative plus littérale signalée en note.
- source_word: וּתְקוּפָתוֹ
  choice: poursuit sa course
  rationale: תְּקוּפָה peut évoquer un circuit, un parcours ou un mouvement circulaire. « Sa course » restitue clairement le trajet poétique du soleil.
- source_word: עַל קְצוֹתָם
  choice: jusqu’à l’autre extrémité
  rationale: Dans ce contexte, עַל indique l’étendue atteinte par la course. L’ajout de « l’autre » rend explicite en français la progression d’une extrémité à l’autre, implicite dans le parallélisme hébreu.
- source_word: וְאֵין נִסְתָּר
  choice: rien n’échappe
  rationale: La construction existentielle avec le participe passif affirme que rien ne demeure caché. « Rien n’échappe » est idiomatique avec le complément « à sa chaleur » et conserve le sens.
- source_word: מֵחַמָּתוֹ
  choice: à sa chaleur
  rationale: חַמָּה désigne la chaleur du soleil. La préposition française « à » est requise par « échapper à » et correspond fonctionnellement à l’hébreu מִן dans cette construction.
theological_decisions:
- issue: Degré de personnification du soleil
  choice: Employer le pronom masculin « il » et le possessif « sa », conformément à l’usage grammatical français pour « le soleil », sans accentuer la personnification.
  alternative: Reformuler en répétant « le soleil » ou employer des tournures impersonnelles afin de réduire la personnification.
  rationale: En français, le genre masculin est grammatical et naturel pour « le soleil » ; il ne suggère pas que celui-ci soit une divinité. Le mouvement poétique de l’hébreu est ainsi préservé sans ajouter de connotation mythologique.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation privilégie une lecture orale fluide tout en conservant l’image cosmique et l’ambiguïté lexicale essentielle.
