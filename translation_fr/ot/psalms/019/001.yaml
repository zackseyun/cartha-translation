source:
  edition: WLC
  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: fr
  text: Les cieux racontent la gloire de Dieu, et l’étendue céleste[a] proclame l’œuvre de ses mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le firmament ». Le terme hébreu traduit par « étendue céleste » désigne le ciel déployé ou la voûte céleste.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Ce choix conserve la portée cosmique et le registre poétique du pluriel hébreu שָׁמַיִם, mieux que le singulier plus restreint « le ciel ».
- source_word: מְסַפְּרִים
  choice: racontent
  rationale: Le participe de ספר exprime l’action de raconter ou de faire connaître. « Racontent » restitue directement cette image tout en personnifiant naturellement les cieux.
- source_word: כְּבוֹד
  choice: la gloire
  rationale: « Gloire » est l’équivalent biblique courant de כָּבוֹד et en préserve les connotations de majesté, d’honneur et d’éclat.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל désigne Dieu comme Créateur; « Dieu » transmet naturellement le titre sans imposer la translittération « El » comme nom propre.
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: l’œuvre de ses mains
  rationale: Cette formulation conserve l’image anthropomorphique concrète et la structure de l’expression hébraïque.
- source_word: מַגִּיד
  choice: proclame
  rationale: Le participe hiphil de נגד signifie faire connaître ou annoncer. « Proclame » convient au parallélisme poétique et évite de répéter « racontent ».
- source_word: הָרָקִיעַ
  choice: l’étendue céleste
  rationale: רָקִיעַ évoque ce qui est déployé au-dessus de la terre. « L’étendue céleste » reste compréhensible en français moderne et préserve mieux cette image que le simple mot « ciel ».
theological_decisions:
- issue: Rendu de אֵל
  choice: Dieu
  alternative: El
  rationale: Le contexte présente celui dont la création manifeste la gloire. Traduire le titre par « Dieu » communique le sens sans donner au terme une valeur de nom propre que le verset n’exige pas.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé, ainsi que l’image concrète de « l’œuvre de ses mains ». « Étendue céleste » évite l’archaïsme de « firmament » dans le texte principal tout en maintenant l’imagerie du terme hébreu.
