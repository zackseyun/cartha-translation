  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: fr
  text: Leur cordeau s’étend sur toute la terre[a], et leurs paroles jusqu’aux extrémités du monde. En eux[b], il a dressé une tente pour le soleil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Leur voix (ou leur son) se répand sur toute la terre. » Le texte hébreu massorétique porte « leur cordeau », mais certaines versions anciennes et de nombreux interprètes comprennent ici « voix » ou « son », en accord avec le parallélisme poétique.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « en eux ». Le pronom renvoie probablement aux cieux mentionnés dans le verset précédent.'
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: leur cordeau
  rationale: Le texte massorétique vocalisé porte « leur cordeau / leur ligne ». « Cordeau » conserve cette image concrète et l’ambiguïté du texte, tandis que la note signale l’interprétation ancienne « voix / son ».
- source_word: יָצָא
  choice: s’étend
  rationale: Le verbe signifie littéralement « est sorti ». Avec « cordeau », « s’étend » exprime naturellement en français la portée qui traverse toute la terre, sans adopter la variante « voix ».
- source_word: מִלֵּיהֶם
  choice: leurs paroles
  rationale: Le terme araméisant désigne les mots ou les paroles; « paroles » convient au parallélisme poétique.
- source_word: תֵבֵל
  choice: monde
  rationale: Le nom désigne couramment le monde habité; « monde » est ici naturel et concis.
- source_word: שָׂם
  choice: il a dressé
  rationale: Dans le contexte d’une tente, « dresser » rend idiomatiquement l’action de placer ou d’établir.
- source_word: אֹהֶל
  choice: une tente
  rationale: C’est le sens ordinaire du nom, sans les connotations cultuelles qu’introduirait « tabernacle ».
- source_word: בָּהֶם
  choice: là
  rationale: Le pronom signifie littéralement « en eux / parmi eux » et renvoie probablement aux cieux du contexte précédent. « Là » est plus naturel en français tout en laissant la note préciser le référent.
- source_word: לַשֶּׁמֶשׁ
  choice: pour le soleil
  rationale: Rendu direct et naturel de la préposition et du nom.
theological_decisions: []
translation_notes:
  register: Français moderne, international et poétique. Le texte principal conserve la lecture massorétique difficile « cordeau » plutôt que de résoudre silencieusement l’ambiguïté en « voix ». « Là » évite la lourdeur de « en eux » en français, tandis que la note préserve la forme littérale et son antécédent probable.
