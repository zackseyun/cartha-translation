source:
  edition: WLC
  text: פִּקּ֘וּדֵ֤י יְהוָ֣ה יְ֭שָׁרִים מְשַׂמְּחֵי לֵ֑ב מִצְוַ֥ת יְהוָ֥ה בָּ֝רָ֗ה מְאִירַ֥ת עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: fr
  text: Les préceptes de Yahweh sont droits et réjouissent le cœur ; le commandement de Yahweh est pur[a] et éclaire les yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « clair » ; l’adjectif hébreu peut souligner la pureté ou la netteté, cette dernière nuance s’accordant avec l’expression parallèle « éclaire les yeux ».
    reason: alternative lexicale
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: préceptes
  rationale: Ce terme désigne des directives établies. « Préceptes » conserve sa portée normative tout en le distinguant de מִצְוַת, rendu ici par « commandement ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: יְשָׁרִים
  choice: droits
  rationale: Dans ce contexte, l’adjectif exprime la rectitude et le caractère juste des préceptes. « Droits » reste naturel en français et conserve l’image de ce qui est droit.
- source_word: מְשַׂמְּחֵי לֵב
  choice: réjouissent le cœur
  rationale: Cette formulation rend le sens causatif du participe et son effet durable, dans un français courant et poétique.
- source_word: לֵב
  choice: cœur
  rationale: « Cœur » préserve l’image hébraïque, qui peut englober les émotions, la pensée et la volonté.
- source_word: מִצְוַת
  choice: commandement
  rationale: Le singulier hébreu est conservé et le terme demeure distinct de « préceptes » dans la série de désignations de l’enseignement divin.
- source_word: בָּרָה
  choice: pur
  rationale: Le sens premier de l’adjectif relève de la pureté ou de la netteté. « Pur » en préserve la valeur fondamentale, tandis que « clair » reste une possibilité contextuelle signalée en note.
- source_word: מְאִירַת עֵינָיִם
  choice: éclaire les yeux
  rationale: Cette expression rend la valeur causative du participe et conserve l’image concrète de la lumière donnée aux yeux.
- source_word: עֵינָיִם
  choice: yeux
  rationale: Le nom concret est maintenu afin de préserver la métaphore hébraïque de la perception et de la vitalité.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom propre divin sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination par « et » rend naturellement le parallélisme des participes hébreux sans alourdir le verset. Le point-virgule marque les deux membres parallèles.
