id: PSA.19.13
reference: Psalms 19:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: fr
  text: Empêche aussi ton serviteur de commettre des péchés présomptueux[a] ; qu’ils ne dominent pas sur moi. Alors je serai intègre[b] et innocent d’une grave transgression[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des arrogants » ou « des personnes orgueilleuses ». L’hébreu peut désigner soit des personnes arrogantes, soit des péchés commis avec présomption.
    reason: alternative_reading
  - marker: b
    text: Ou « irréprochable » ou « entier ». Le terme hébreu évoque l’intégrité et la plénitude.
    reason: lexical_alternative
  - marker: c
    text: Ou « d’une grave rébellion ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Conserve la valeur additive qui relie cette demande à celle concernant les fautes cachées au verset précédent.
- source_word: מִזֵּדִים
  choice: des péchés présomptueux
  rationale: Dans le contexte immédiat des fautes et des égarements, le terme désigne probablement des péchés marqués par l’arrogance et commis de propos délibéré. La possibilité qu’il désigne des personnes arrogantes est signalée en note.
- source_word: חֲשֹׂךְ עַבְדֶּךָ
  choice: Empêche … ton serviteur de commettre
  rationale: Rend clairement en français actuel la demande adressée à Dieu de retenir son serviteur et de le préserver de tels actes.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: qu’ils ne dominent pas sur moi
  rationale: Préserve l’image des péchés exerçant un pouvoir ou une maîtrise sur la personne.
- source_word: אֵיתָם
  choice: je serai intègre
  rationale: Exprime l’idée de droiture et de plénitude morale sans suggérer une perfection absolue.
- source_word: וְנִקֵּיתִי
  choice: innocent
  rationale: Le verbe exprime le fait d’être dégagé de la culpabilité ou tenu pour innocent.
- source_word: מִפֶּשַׁע רָב
  choice: d’une grave transgression
  rationale: Conserve le singulier collectif et la gravité de פֶּשַׁע, qui évoque une violation rebelle de la volonté de Dieu.
theological_decisions:
- issue: Référent de מִזֵּדִים
  choice: des péchés présomptueux
  alternative: des arrogants / des personnes orgueilleuses
  rationale: Le contexte immédiat porte sur les fautes du priant, et la domination évoquée dans la proposition suivante s’applique naturellement au pouvoir du péché. L’ambiguïté réelle de l’hébreu demeure toutefois explicitée en note.
- issue: Portée de אֵיתָם
  choice: intègre
  alternative: irréprochable / entier / innocent
  rationale: « Intègre » exprime une droiture non divisée devant Dieu plutôt qu’une absence absolue de tout péché.
- issue: Sens de פֶּשַׁע
  choice: transgression
  alternative: rébellion
  rationale: « Transgression » convient au contexte moral tout en gardant l’idée d’une grave violation ; « rébellion » rend plus explicitement la nuance de rupture volontaire portée par le mot hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation explicite l’action dont Dieu doit préserver son serviteur, tandis que la proposition suivante conserve la personnification des péchés comme puissance dominatrice.
