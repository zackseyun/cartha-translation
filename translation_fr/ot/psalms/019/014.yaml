source:
  edition: WLC
  text: יִֽהְי֥וּ לְ/רָצ֨וֹן אִמְרֵי פִ֡/י וְ/הֶגְי֣וֹן לִבִּ֣/י לְ/פָנֶ֑י/ךָ יְ֝הוָ֗ה צוּרִ֥/י וְ/גֹאֲלִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: fr
  text: Que les paroles de ma bouche et la méditation de mon cœur soient agréables devant toi[a], Yahweh, mon rocher et mon rédempteur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à tes yeux ». L’hébreu dit littéralement « devant ta face ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « rédempteur » désigne celui qui rachète, délivre ou protège. Dans le droit israélite, il pouvait notamment désigner un proche parent ayant des responsabilités de protection ou de rachat.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ
  choice: Que… soient
  rationale: L’imparfait qal de היה a ici une valeur volitive dans une prière; la tournure française « Que… soient » exprime naturellement ce souhait.
- source_word: לְרָצוֹן
  choice: te soient agréables
  rationale: רָצוֹן avec ל indique ce qui est favorablement accueilli ou jugé acceptable. Cette formulation française est naturelle et conserve la dimension relationnelle de l’expression.
- source_word: אִמְרֵי פִי
  choice: les paroles de ma bouche
  rationale: La traduction directe préserve l’image concrète et le parallélisme entre l’expression extérieure et la réflexion intérieure.
- source_word: הֶגְיוֹן לִבִּי
  choice: la méditation de mon cœur
  rationale: הֶגְיוֹן peut désigner la méditation, la réflexion ou le murmure intérieur. « Méditation » garde cette amplitude dans un registre poétique actuel.
- source_word: לְפָנֶיךָ
  choice: te soient agréables
  rationale: Littéralement « devant toi/ta face ». La relation à la présence et au jugement favorable de Dieu est intégrée idiomatiquement au verbe, tandis qu’une note signale l’image hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: צוּרִי
  choice: mon rocher
  rationale: La métaphore hébraïque de la stabilité et de la protection est conservée sans être explicitée dans le corps du texte.
- source_word: וְגֹאֲלִי
  choice: et mon rédempteur
  rationale: Le terme issu de גאל évoque celui qui délivre ou reprend à son compte, avec un arrière-plan possible de solidarité familiale; « rédempteur » reste concis et n’impose pas une précision absente du verset.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre. Le translittérer préserve cette fonction sans lui substituer un titre.
- issue: Métaphore צוּרִי
  choice: mon rocher
  alternative: mon refuge
  rationale: La métaphore est maintenue afin de préserver la richesse poétique et théologique du texte plutôt que d’en sélectionner une seule interprétation.
- issue: Portée de גֹאֲלִי
  choice: mon rédempteur
  alternative: mon libérateur / mon proche parent rédempteur
  rationale: « Libérateur » atténuerait l’idée de rachat ou de reprise en charge, tandis que « proche parent rédempteur » préciserait excessivement le rapport juridique dans cette adresse poétique.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe optative convient à une prière; les images du cœur, du rocher et du rédempteur sont conservées. L’interjection « ô » n’est pas ajoutée, car elle n’est pas exprimée en hébreu et paraîtrait plus archaïque.
