  text: וְ/ה֗וּא כְּ֭/חָתָן יֹצֵ֣א מֵ/חֻפָּת֑/וֹ יָשִׂ֥ישׂ כְּ֝/גִבּ֗וֹר לָ/ר֥וּץ אֹֽרַח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/005.yaml
  text: And it is like a bridegroom coming out from his wedding chamber[a]; it rejoices like a warrior to run a course.
translation:
  language: fr
  text: Il est comme un jeune marié qui sort de sa chambre nuptiale[a] ; il se réjouit, tel un héros, de courir son chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son dais nuptial ». Le mot hébreu חֻפָּה peut désigner un dais de noces ou une chambre nuptiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Il est
  rationale: Le pronom reprend le soleil du verset précédent. En français, « il » convient naturellement au nom masculin « soleil » ; la coordination hébraïque n’a pas besoin d’être rendue mécaniquement par « et » dans ce membre poétique.
- source_word: כְּחָתָן
  choice: comme un jeune marié
  rationale: חָתָן désigne l’époux au moment des noces. « Jeune marié » est clair, actuel et conserve l’image nuptiale.
- source_word: יֹצֵא
  choice: qui sort
  rationale: Le participe de יצא présente vivement le mouvement de sortie ; la proposition relative est idiomatique en français.
- source_word: מֵחֻפָּתוֹ
  choice: de sa chambre nuptiale
  rationale: חֻפָּה peut désigner la chambre ou le dais nuptial. Dans l’image d’un époux qui en sort, « chambre nuptiale » est naturel, tandis que l’autre possibilité est conservée en note.
- source_word: יָשִׂישׂ
  choice: il se réjouit
  rationale: Le verbe exprime une joie vive et exultante ; « se réjouit » préserve cette tonalité sans surcharge stylistique.
- source_word: כְּגִבּוֹר
  choice: tel un vaillant
  rationale: גִּבּוֹר évoque un homme fort, héros ou guerrier. « Un vaillant » garde l’énergie héroïque de la comparaison sans imposer un contexte militaire.
- source_word: לָרוּץ
  choice: de parcourir
  rationale: L’infinitif רוץ signifie littéralement « courir ». Avec « chemin », « parcourir » donne en français une image fluide de la course du soleil, sans ajouter l’idée de compétition.
- source_word: אֹרַח
  choice: son chemin
  rationale: אֹרַח signifie « sentier, chemin, voie ». Le possessif explicite naturellement en français le chemin suivi par le soleil, tout en conservant la métaphore spatiale.
