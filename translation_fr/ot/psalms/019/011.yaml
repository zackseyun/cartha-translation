  naturalness: « Ton serviteur aussi est averti par eux » est direct, idiomatique et plus fidèle que « se laisse avertir ». « En les observant, la récompense est grande » est naturel en français moderne et conserve le lien circonstanciel ou instrumental de בְּשָׁמְרָם sans ajouter d’agent.
  terminology: « Serviteur », « averti », « observer » et « récompense » conviennent au registre psalmique moderne. Le pronom « eux » renvoie aux préceptes/jugements évoqués dans le contexte précédent. La note sur עֵקֶב doit présenter « conséquence » comme une possibilité de résultat, sans faire de cette nuance une interprétation doctrinale.
