  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: fr
  text: Ton serviteur aussi est averti[a] par eux ; en les observant, la récompense est grande[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prend garde grâce à eux » ou « reçoit un avertissement d’eux » ; le verbe hébreu peut exprimer le fait d’être averti ou de prendre garde.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il y a une abondante rétribution » ou « un grand bénéfice » ; le terme peut désigner ce qui résulte de l’observance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Conserve la valeur additive du terme en reliant ce verset à l’éloge précédent des prescriptions du Seigneur.
- source_word: עַבְדְּךָ
  choice: ton serviteur
  rationale: Le psalmiste s’adresse à Dieu et se désigne dans une relation de service et de fidélité ; « serviteur » convient mieux ici que « esclave ».
- source_word: נִזְהָר
  choice: se laisse avertir
  rationale: Rend la forme niphal et sa nuance d’avertissement reçu, tout en restant naturelle en français.
- source_word: בָּהֶם
  choice: par eux
  rationale: Le pronom reprend les enseignements ou jugements divins mentionnés auparavant et exprime ici le moyen de l’avertissement.
- source_word: בְּשָׁמְרָם
  choice: à les observer
  rationale: Rend la construction prépositionnelle avec l’infinitif de שמר, qui peut exprimer la circonstance ou le moyen, sans alourdir la phrase.
- source_word: עֵקֶב
  choice: récompense
  rationale: Dans ce contexte, le mot désigne le bénéfice ou l’issue favorable qui accompagne l’observance.
- source_word: רָב
  choice: grande
  rationale: Exprime simplement l’importance ou l’abondance de la récompense.
theological_decisions:
- issue: Le verset enseigne-t-il un mérite acquis devant Dieu ou le bénéfice qui découle de l’obéissance ?
  choice: La formulation affirme qu’observer les prescriptions divines comporte une grande récompense, sans préciser un système de mérite.
  alternative: « Les observer permet de gagner une récompense accordée par Dieu. »
  rationale: L’hébreu associe l’observance à un עֵקֶב important, mais ne définit ni la nature exacte de cette récompense ni son rapport à une doctrine du mérite ; la traduction conserve cette tension.
translation_notes:
  register: Français moderne, international et digne. « Se laisse avertir » maintient la nuance réceptive du verbe hébreu ; « à les observer » est idiomatique et conserve le lien entre l’observance et la récompense sans définir davantage leur rapport théologique.
