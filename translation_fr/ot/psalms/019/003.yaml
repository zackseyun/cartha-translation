source:
  edition: WLC
  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: fr
  text: Il n’y a pas de langage, il n’y a pas de paroles ; leur voix[a] ne s’entend pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur son ». Le mot hébreu peut désigner une voix ou un son.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: il n’y a pas
  rationale: Cette tournure rend naturellement en français la négation existentielle répétée dans les deux premiers membres.
- source_word: אֹמֶר
  choice: langage
  rationale: Le mot désigne ici l’expression verbale en général. « Langage » convient au contraste entre la proclamation des cieux et l’absence de paroles audibles.
- source_word: דְּבָרִים
  choice: paroles
  rationale: Dans ce parallélisme poétique consacré à la communication, « paroles » restitue le sens concret du terme.
- source_word: בְּלִי
  choice: ne… pas
  rationale: Avec le passif suivant, cette négation se rend clairement par « ne s’entend pas ».
- source_word: נִשְׁמָע
  choice: s’entend
  rationale: Cette formulation française idiomatique conserve le sens passif de ce qui n’est pas entendu ou audible.
- source_word: קוֹלָם
  choice: leur voix
  rationale: « Voix » maintient la personnification des cieux, tandis que la note conserve l’autre sens possible, « son ».
theological_decisions:
- issue: Le témoignage des cieux comme communication non verbale
  choice: 'Le verset nie la présence d’un langage ordinaire et de paroles audibles : « Il n’y a pas de langage, il n’y a pas de paroles ; leur voix ne s’entend pas. »'
  alternative: On peut comprendre que leur voix se répand sans langage ni paroles, ce qui souligne un témoignage silencieux mais universel.
  rationale: 'La syntaxe hébraïque permet naturellement de nier le langage articulé et l’audibilité. Cette traduction préserve ainsi la tension poétique avec le verset précédent : les cieux proclament, mais non à la manière d’une parole humaine ordinaire.'
translation_notes:
  register: Français moderne, international et digne. La répétition de « il n’y a pas » reproduit le parallélisme hébraïque ; « ne s’entend pas » reste naturel tout en conservant l’ambiguïté poétique.
