source:
  edition: WLC
  text: יִרְאַ֤ת יְהוָ֨ה טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫/עַ֥ד מִֽשְׁפְּטֵי יְהוָ֥ה אֱמֶ֑ת צָֽדְק֥וּ יַחְדָּֽו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: fr
  text: La crainte de Yahweh est pure[a] ; elle demeure à jamais[b] ; les jugements[c] de Yahweh sont vrais ; ils sont tous justes[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans souillure ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle se tient pour toujours ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « les décisions » ou « les ordonnances ».
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « ils sont justes tous ensemble » ; c’est-à-dire qu’ils sont tous justes, considérés comme un tout.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  rationale: Conserve l’expression hébraïque riche de sens, qui évoque à la fois la crainte révérencielle, le respect et l’attachement à Dieu, sans la réduire à « religion » ou à « culte ».
- source_word: טְהוֹרָה
  choice: pure
  rationale: Rend naturellement en français l’idée de pureté morale ou cultuelle ; « sans souillure » est également possible.
- source_word: עוֹמֶדֶת לָעַד
  choice: elle demeure à jamais
  rationale: Exprime idiomatiquement la permanence indiquée littéralement par « se tenant pour toujours ».
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: les jugements de Yahweh
  rationale: Préserve la nuance judiciaire de מִשְׁפָּט, tout en laissant ouverte la possibilité qu’il s’agisse des décisions ou prescriptions divines.
- source_word: אֱמֶת
  choice: vrais
  rationale: L’adjectif prédicatif est naturel en français et peut inclure les notions de vérité et de fiabilité présentes dans le terme hébreu.
- source_word: צָדְקוּ יַחְדָּו
  choice: ils sont tous parfaitement justes
  rationale: Communique la justice complète de l’ensemble des jugements, en rendant le verbe צָדְקוּ et la force collective de יַחְדָּו.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Référent de « la crainte de Yahweh » dans une série de termes décrivant la révélation divine
  choice: Conserver « la crainte de Yahweh »
  alternative: la religion de Yahweh ; le culte de Yahweh
  rationale: La formulation hébraïque peut fonctionner ici de manière métonymique, mais la traduire par « religion » ou « culte » trancherait une question d’interprétation et appauvrirait son contenu théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le parallélisme poétique hébreu, tandis que « demeure à jamais » et « tous parfaitement justes » évitent des calques peu naturels.
