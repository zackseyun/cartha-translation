lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres de psaumes, le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. « Au chef de chœur » est une formulation française claire, concise et consacrée, qui rend aussi le préfixe ל comme l’indication du destinataire.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Ce nom désigne un genre poétique destiné à une exécution musicale. « Psaume » en est l’équivalent français précis et traditionnel.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, la préposition ל peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve mieux cette ouverture que « par David » ou « pour David ».
theological_decisions:
- issue: Sens de לְדָוִד dans le titre
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu ne précise pas à lui seul la nature exacte du lien avec David. La formulation retenue évite d’imposer une affirmation plus étroite sur l’auteur ou le dédicataire.
translation_notes:
  register: Français international moderne, naturel et digne. Le titre reste bref et suit la structure nominale de l’hébreu. Le marqueur [a] est placé après « David », puisque la note porte sur לְדָוִד.
