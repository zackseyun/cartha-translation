  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: fr
  text: 'La loi de Yahweh est parfaite : elle restaure l’âme[a]. Le témoignage de Yahweh est digne de confiance : il rend sage celui qui manque d’expérience.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : elle fait revivre l’âme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: la loi
  rationale: תּוֹרָה désigne ici l’enseignement révélé de Dieu avec sa portée d’alliance. « Loi » en conserve la force traditionnelle et théologique, tandis qu’« instruction » reste une possibilité lexicale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre comme « le Seigneur », afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: תְּמִימָה
  choice: parfaite
  rationale: L’adjectif exprime l’intégrité, la plénitude et l’absence de défaut. « Parfaite » rend naturellement cette excellence globale dans le parallélisme poétique.
- source_word: מְשִׁיבַת נָפֶשׁ
  choice: elle restaure l’être
  rationale: Le participe de שׁוב évoque le retour ou la restauration, tandis que נֶפֶשׁ peut désigner la vie, la personne ou l’être intérieur. Cette formulation reste concise et évite de réduire le terme à une âme séparée du corps.
- source_word: עֵדוּת
  choice: le témoignage
  rationale: Dans cette série de termes relatifs à la révélation divine, עֵדוּת désigne le témoignage attesté de Yahweh, avec une portée d’alliance.
- source_word: נֶאֱמָנָה
  choice: digne de confiance
  rationale: L’expression communique clairement en français actuel l’idée de fermeté, de fiabilité et de sûreté.
- source_word: מַחְכִּימַת
  choice: il rend sage
  rationale: Le participe causatif indique que le témoignage fait accéder quelqu’un à la sagesse.
- source_word: פֶּתִי
  choice: celui qui manque d’expérience
  rationale: Le mot désigne une personne naïve, inexpérimentée et susceptible d’être influencée, sans affirmer nécessairement une corruption morale. Cette formulation évite l’ambiguïté moderne de « simple ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte emploie le Tétragramme comme nom personnel. Sa transcription préserve ce fait au lieu de lui substituer un titre.
- issue: Nuance de מְשִׁיבַת נָפֶשׁ
  choice: elle restaure l’être
  alternative: elle redonne vie
  rationale: Le choix principal conserve la notion fondamentale de retour ou de restauration portée par שׁוב. La note maintient l’autre lecture contextuelle forte, celle de la revivification, sans trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international actuel, poétique et digne. Les deux propositions sont séparées par des deux-points pour rendre clairement le rapport entre la qualité de la révélation et son effet. « Celui qui manque d’expérience » est plus immédiatement intelligible aujourd’hui que « le simple ».
