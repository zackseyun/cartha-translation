    rationale: Le mot hébreu נִסְתָּרוֹת ne précise pas de qui les choses sont cachées. Le contexte permet qu’il s’agisse de fautes inconnues du locuteur, mais aussi de fautes cachées aux autres ou de réalités cachées plus généralement. Cette précision doit rester dans la note plutôt que dans la traduction.
  - severity: low
    issue: « Acquitte-moi » privilégie une nuance judiciaire étroite.
    rationale: נקה peut comporter une dimension d’innocentation ou de purification. Dans cette prière et avec « de choses cachées », « Purifie-moi » conserve mieux l’ampleur de la demande sans imposer la seule métaphore judiciaire.
