  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: fr
  text: Qui peut discerner ses erreurs ? Purifie-moi de ce qui est caché[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des fautes cachées », « des péchés secrets » ou « des choses cachées ». L’hébreu peut désigner des fautes dont le psalmiste n’a pas conscience, des fautes dissimulées aux autres ou, plus généralement, des choses cachées.'
    reason: alternative lexicale et ambiguïté du référent
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: erreurs
  rationale: Le nom désigne des égarements ou des fautes commises par erreur. « Erreurs » reste concis et conserve ici la portée morale sans préciser à tort qu’elles seraient nécessairement involontaires.
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif naturel en français, introduisant une question rhétorique.
- source_word: יָבִין
  choice: peut discerner
  rationale: Le verbe signifie comprendre ou discerner. La tournure exprime naturellement l’incapacité humaine à reconnaître pleinement ses propres erreurs.
- source_word: מִנִּסְתָּרוֹת
  choice: de celles qui me sont cachées
  rationale: La forme peut désigner des choses cachées. Le féminin pluriel reprend naturellement « erreurs » en français, tandis que « me sont cachées » exprime le sens contextuel probable sans transformer explicitement ces fautes en péchés délibérément tenus secrets.
- source_word: נַקֵּנִי
  choice: Acquitte-moi
  rationale: L’impératif piel de נקה peut signifier tenir pour innocent, acquitter ou laver de la culpabilité. « Acquitte-moi » préserve clairement la nuance judiciaire, sans imposer une lecture rituelle.
theological_decisions:
- issue: Nature des choses cachées
  choice: Des erreurs ou fautes que le psalmiste ne perçoit pas lui-même
  alternative: Des péchés dissimulés aux autres, ou des choses cachées en général
  rationale: Le parallélisme avec « erreurs » favorise un référent moral. La formulation retenue établit ce lien tout en signalant en note que l’hébreu ne précise pas entièrement à qui ces fautes sont cachées.
- issue: Valeur de נקה
  choice: Une demande d’acquittement à l’égard de la culpabilité
  alternative: Une demande de purification
  rationale: Le verbe permet les deux nuances. « Acquitte-moi » conserve la dimension de culpabilité sans introduire plus précisément une purification rituelle absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La question rhétorique est rendue directement. « Celles » évite une répétition pesante et relie les deux membres du verset, tandis que la note préserve l’ambiguïté réelle de l’hébreu.
