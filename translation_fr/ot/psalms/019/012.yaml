  terminology: « Erreurs » convient pour שְׁגִיאוֹת. Pour נַקֵּנִי, « Purifie-moi » est une formulation biblique française établie et naturelle; elle ne requiert pas de décider exclusivement entre purification et acquittement. « fautes cachées » dans la note explicite le sens moral contextuellement probable, tout en maintenant « choses cachées » comme possibilité lexicale.
