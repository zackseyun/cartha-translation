translation:
  language: fr
  text: Toute la journée, ils déforment mes paroles[a] ; toutes leurs pensées contre moi visent le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tordent mes paroles ». Le sens du verbe hébreu est difficile : il peut évoquer le fait de causer de la peine, de blesser ou de tordre/déformer. Avec « mes paroles » comme complément, l''idée d''une déformation malveillante est probablement la plus appropriée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toutes leurs pensées contre moi sont pour le mal ». Le mot traduit par « pensées » peut aussi désigner des projets ou des desseins.'
