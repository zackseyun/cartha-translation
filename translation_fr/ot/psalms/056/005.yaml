lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Toute la journée
  rationale: Cette expression naturelle en français conserve l’idée d’une action qui se prolonge tout au long du jour.
- source_word: דְּבָרַי
  choice: mes paroles
  rationale: דָּבָר peut désigner une parole, une affaire ou une chose. Avec le verbe employé ici et dans ce contexte d’hostilité, « mes paroles » est le sens le plus probable.
- source_word: יְעַצֵּבוּ
  choice: ils déforment
  rationale: La forme intensive de עצב est difficile dans ce verset et peut évoquer le fait de faire souffrir, de blesser ou de déformer. Avec « mes paroles » comme complément, « déforment » rend naturellement l’idée probable d’une falsification malveillante, sans masquer l’incertitude signalée en note.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte hostile, la préposition a une valeur adversative que « contre moi » exprime clairement.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: tout ce qu’ils projettent
  rationale: מַחְשְׁבוֹת peut désigner des pensées, des projets ou des desseins. La formulation verbale est idiomatique en français et fait ressortir ici la dimension intentionnelle.
- source_word: לָרָע
  choice: vise à me faire du mal
  rationale: La formule hébraïque indique une orientation vers le mal ou un dessein nuisible. Cette traduction française exprime clairement la finalité hostile tout en conservant la portée morale du terme.
