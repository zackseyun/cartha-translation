  text: בֵּ/אלֹהִים֮ אֲהַלֵּ֪ל דְּבָ֫ר֥/וֹ בֵּ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה בָשָׂ֣ר לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/004.yaml
  text: In God I will praise his word[a]; in God I have trusted; I will not fear[c][b]. What can flesh do to me?
translation:
  language: fr
  text: En Dieu, je louerai sa parole ; en Dieu, j’ai placé ma confiance ; je n’aurai pas peur. Que peut me faire la chair ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que me fera la chair ? » Ici, « chair » désigne les êtres humains dans leur fragilité, par contraste avec Dieu.'
    reason: Précision lexicale et explication de l’image anthropologique hébraïque.
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: En Dieu
  rationale: La préposition ב exprime ici le fondement ou la sphère de la louange et de la confiance. « En Dieu » est naturel en français et maintient le parallélisme des deux propositions.
- source_word: אֲהַלֵּל
  choice: je louerai
  rationale: L’imparfait piel à la première personne peut exprimer une action future ou une résolution ; « je louerai » conserve cette nuance d’engagement.
- source_word: דְּבָרוֹ
  choice: sa parole
  rationale: Cette traduction reste proche du sens large de דָּבָר sans le préciser indûment comme une promesse particulière.
- source_word: בָּטַחְתִּי
  choice: j’ai placé ma confiance
  rationale: Le qatal présente la confiance comme établie, avec un effet présent ; cette tournure est idiomatique et soutient la confiance qui motive l’absence de peur.
- source_word: לֹא אִירָא
  choice: je n’aurai pas peur
  rationale: L’imparfait négatif exprime ici la confiance et la résolution tournées vers l’avenir.
- source_word: מַה יַּעֲשֶׂה
  choice: Que pourrait … faire
  rationale: La forme hébraïque est littéralement future, mais la question est rhétorique. Le conditionnel français communique naturellement l’impuissance relative de l’être humain sans supprimer la valeur interrogative.
- source_word: בָשָׂר
  choice: un être de chair
  rationale: « Chair » conserve l’image hébraïque de la fragilité humaine, tandis que « un être de chair » rend clairement le référent humain dans un français naturel.
- source_word: לִי
  choice: me
  rationale: Le pronom français placé avant « faire » traduit naturellement « à moi » dans cette construction.
theological_decisions:
- issue: Le terme anthropologique בָשָׂר en contraste avec Dieu
  choice: un être de chair
  alternative: la chair ; un mortel ; l’homme
  rationale: Le choix conserve l’image théologique de la faiblesse humaine face à Dieu tout en évitant que « la chair » soit comprise comme une puissance abstraite ou comme le corps seul.
- issue: La portée de דְּבָרוֹ
  choice: sa parole
  alternative: sa promesse ; ce qu’il a dit
  rationale: « Sa parole » préserve l’amplitude du terme hébreu et n’impose pas que le psalmiste vise exclusivement une promesse déterminée.
translation_notes:
  register: Français international moderne, digne et lisible. Le point-virgule maintient le parallélisme étroit entre louange et confiance ; la virgule relie directement la confiance à l’absence de peur. Le vocabulaire conserve les images de « parole » et de « chair » sans produire une formulation inutilement obscure.
