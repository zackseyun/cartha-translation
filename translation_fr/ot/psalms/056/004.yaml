revisions:
- from: En Dieu, je louerai sa parole ; en Dieu, j’ai placé ma confiance, je n’aurai pas peur. Que pourrait me faire un être de chair ?[a]
  to: En Dieu, je louerai sa parole ; en Dieu, j’ai placé ma confiance ; je n’aurai pas peur. Que peut me faire la chair ?[a]
  rationale: La révision restaure « la chair », traduction directe et collective de בָשָׂר, tout en conservant l’explication nécessaire en note. Elle remplace aussi la virgule de jonction par un point-virgule. Le présent « Que peut me faire… ? » demeure une question rhétorique idiomatique en français; la note conserve la valeur formellement future de l’hébreu. Aucun choix doctrinal additionnel n’est introduit.
