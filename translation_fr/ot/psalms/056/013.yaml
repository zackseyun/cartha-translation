  text: כִּ֤י הִצַּ֪לְתָּ נַפְשִׁ֡/י מִ/מָּוֶת֮ הֲ/לֹ֥א רַגְלַ֗/י מִ֫/דֶּ֥חִי לְ֭/הִֽתְהַלֵּךְ לִ/פְנֵ֣י אֱלֹהִ֑ים בְּ֝/א֗וֹר הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/013.yaml
  text: For you have delivered my soul from death[a]; have you not also kept my feet from stumbling[d][c][b], that I may walk before God in the light of life?
translation:
  language: fr
  text: Car tu as délivré mon âme de la mort[a] ; n’as-tu pas aussi préservé mes pieds de la chute[b], afin que je marche devant Dieu dans la lumière de la vie[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie ». Le mot hébreu peut désigner l’âme, la vie ou la personne elle-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « du faux pas » ; littéralement, « de la chute ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans la lumière des vivants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la confiance ou de la louange exprimée auparavant et conserve naturellement la valeur connective de l’hébreu.
- source_word: הִצַּלְתָּ
  choice: tu as délivré
  rationale: Le hifil accompli de נצל désigne une délivrance effective ; le passé composé exprime un acte accompli dont l’effet demeure.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » garde l’image et l’ouverture sémantique de l’hébreu, tandis qu’une note signale l’autre sens naturel.
- source_word: מִמָּוֶת
  choice: de la mort
  rationale: Rend directement la délivrance hors de la menace ou de l’emprise de la mort.
- source_word: הֲלֹא
  choice: n’as-tu pas aussi
  rationale: Conserve la question rhétorique qui attend une réponse affirmative et relie la seconde délivrance à la première.
- source_word: רַגְלַי
  choice: mes pieds
  rationale: Traduction concrète et naturelle qui maintient l’image corporelle prolongée par le verbe « marcher ».
- source_word: מִדֶּחִי
  choice: de la chute
  rationale: Le nom דֶּחִי peut évoquer la chute, le fait d’être renversé ou le faux pas. « De la chute » convient à « préserver mes pieds » sans réduire excessivement le champ de l’image.
- source_word: לְהִתְהַלֵּךְ
  choice: afin que je marche
  rationale: La construction avec לְ exprime ici le but ou le résultat ; « afin que » rend clairement cette relation.
- source_word: לִפְנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: Expression concise et fidèle pour l’idée de marcher en présence de Dieu.
- source_word: בְּאוֹר הַחַיִּים
  choice: dans la lumière de la vie
  rationale: Suit directement la formulation poétique du texte massorétique et préserve son image sans l’interpréter comme une référence exclusivement terrestre ou eschatologique.
theological_decisions:
- issue: Portée anthropologique de נַפְשִׁי
  choice: mon âme
  alternative: ma vie ; moi-même
  rationale: Le terme ne définit pas ici une anthropologie technique. La traduction garde le mot poétique traditionnel sans exclure que la vie ou la personne entière soit visée.
- issue: Sens de « la lumière de la vie »
  choice: la lumière de la vie
  alternative: la lumière des vivants
  rationale: Le texte porte littéralement l’expression « lumière de la vie ». La formulation retenue conserve l’ambiguïté poétique entre vie préservée, vitalité et présence favorable de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé convient à l’action accomplie ayant une portée présente. Le point-virgule respecte la forte coupure après « mort », tandis que la question rhétorique et la proposition de but restent clairement liées. Les images hébraïques de l’âme, des pieds, de la marche et de la lumière sont conservées.
