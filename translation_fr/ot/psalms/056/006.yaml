source:
  edition: WLC
  text: יָג֤וּרוּ יצפינו הֵ֭מָּה עֲקֵבַ֣/י יִשְׁמֹ֑רוּ כַּ֝/אֲשֶׁ֗ר קִוּ֥וּ נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/006.yaml
  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: fr
  text: Ils se rassemblent[a], ils se cachent ; ils surveillent mes pas[b], alors qu’ils guettent ma vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils se liguent ». Le verbe hébreu peut désigner ici le fait de se regrouper avec une intention hostile.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « mes talons » ; l’expression désigne les pas ou les déplacements.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, le verbe signifie « attendre » ou « espérer ». Dans ce contexte hostile, il peut évoquer le fait de guetter la vie de quelqu’un. La conjonction peut aussi se rendre par « comme » ou « tandis que ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוּרוּ
  choice: ils se liguent
  rationale: Dans ce contexte hostile, le verbe désigne vraisemblablement le fait de se rassembler en groupe contre quelqu’un. « Se liguer » exprime naturellement en français ce rassemblement concerté sans ajouter une attaque explicite.
- source_word: יצפינו
  choice: ils se cachent
  rationale: Le verbe évoque ici le fait de se dissimuler, probablement en vue d’une embuscade. « Ils se cachent » reste clair et proche de l’image hébraïque.
- source_word: הֵמָּה
  choice: ils
  rationale: Le pronom indépendant renforce le sujet. En français, la reprise de « ils » dans les propositions successives transmet suffisamment cette insistance sans lourdeur.
- source_word: עֲקֵבַי
  choice: mes pas
  rationale: Le mot signifie littéralement « mes talons », mais désigne idiomatiquement les pas ou les déplacements que les ennemis suivent.
- source_word: יִשְׁמֹרוּ
  choice: ils surveillent
  rationale: Dans ce contexte, שמר indique une observation attentive et hostile, non une garde protectrice.
- source_word: כַּאֲשֶׁר
  choice: eux qui
  rationale: La tournure hébraïque relie leur surveillance à l’attente hostile visant la vie du psalmiste. « Eux qui » donne en français une relation naturelle sans trancher explicitement entre comparaison, circonstance et cause.
- source_word: קִוּוּ
  choice: guettent
  rationale: Le sens fondamental est « attendre, espérer ». Dans ce contexte hostile, « guetter » conserve l’idée d’une attente attentive tout en rendant naturellement la menace en français.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: נפש désigne ici la vie ou la personne du psalmiste, menacée par ses ennemis, plutôt que l’âme au sens abstrait.
theological_decisions:
- issue: Nature de l’attente exprimée par קִוּוּ
  choice: guettent ma vie
  alternative: attendent ma vie / espèrent ma vie
  rationale: « Guettent » rend l’attente hostile indiquée par le contexte, sans préciser de manière doctrinale ou excessive ce que les ennemis comptent faire. Une note conserve le sens lexical plus littéral et son ambiguïté.
translation_notes:
  register: Français international moderne, sobre et poétique. Les propositions brèves conservent le rythme pressant du verset. « Se liguent » et « guettent » sont courants, dignes et adaptés à la menace implicite, tandis que les notes signalent les principales ambiguïtés lexicales de l’hébreu.
