source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: fr
  text: En Dieu, j’ai mis ma confiance ; je n’aurai pas peur. Que peut me faire un être humain[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme ». Le mot hébreu est au singulier et représente ici tout être humain.
    reason: Alternative lexicale permettant de voir la forme singulière et la traduction française traditionnelle.
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: En Dieu
  rationale: La préposition בּ avec אֱלֹהִים désigne ici l’objet de la confiance ; « en Dieu » est la formulation française naturelle.
- source_word: בָּטַחְתִּי
  choice: j’ai mis ma confiance
  rationale: Le parfait qal à la première personne exprime une confiance établie ; le passé composé en restitue l’aspect tout en restant idiomatique.
- source_word: לֹא אִירָא
  choice: je n’aurai pas peur
  rationale: L’imparfait après la négation exprime ici l’assurance ou la résolution qui découle de la confiance.
- source_word: מַה יַּעֲשֶׂה ... לִי
  choice: Que peut me faire… ?
  rationale: La question rhétorique appelle naturellement en français le modal « peut » ; l’ordre des mots est idiomatique sans ajouter de contenu.
- source_word: אָדָם
  choice: un être humain
  rationale: Le singulier est représentatif et désigne ici n’importe quel humain en contraste avec Dieu ; cette expression moderne conserve le nombre et la portée générique.
theological_decisions:
- issue: Portée représentative de אָדָם
  choice: un être humain
  alternative: l’homme
  rationale: Le mot hébreu est singulier mais générique. « Un être humain » préserve cette valeur représentative sans laisser entendre qu’il s’agit d’un homme particulier ni transformer le terme en collectif.
translation_notes:
  register: Français international moderne, simple et digne. Le point-virgule maintient le lien logique entre la confiance en Dieu et l’absence de peur ; la question finale conserve la force rhétorique de l’hébreu.
