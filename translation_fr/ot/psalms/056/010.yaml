source:
  edition: WLC
  text: בֵּֽ֭/אלֹהִים אֲהַלֵּ֣ל דָּבָ֑ר בַּ֝/יהוָ֗ה אֲהַלֵּ֥ל דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: fr
  text: En Dieu, je louerai la parole[a] ; en Yahweh, je louerai la parole.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la promesse », ici et dans le second membre du verset ; le mot hébreu peut signifier « parole », « chose » ou, selon le contexte, « promesse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: En Dieu
  rationale: La préposition בְּ est rendue par « en », formulation relationnelle qui conserve le parallélisme avec בַּיהוָה et l’idiome poétique du texte.
- source_word: אֲהַלֵּל
  choice: je louerai
  rationale: L’imparfait piel à la première personne du singulier exprime ici une résolution ou une orientation future ; « je louerai » convient au caractère déclaratif du verset.
- source_word: דָּבָר
  choice: la parole
  rationale: דָּבָר peut désigner une parole, une chose ou, dans ce contexte, une promesse. « La parole » préserve le terme hébreu et sa répétition sans trancher entièrement l’ambiguïté.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition est conservée par « en » afin de reproduire le parallélisme ; le tétragramme est translittéré « Yahweh » comme nom divin personnel.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve la distinction entre le nom divin personnel et le titre « Seigneur ».
- issue: 'Objet de la louange : parole ou promesse'
  choice: la parole
  alternative: la promesse
  rationale: Le contexte peut viser la promesse de Dieu, mais le nom דָּבָר reste lexicalement plus large. Le texte principal conserve cette amplitude, tandis que la note indique l’interprétation contextuelle possible.
translation_notes:
  register: Français international moderne, simple et digne. La répétition et le parallélisme de l’hébreu sont maintenus, avec un point-virgule entre les deux membres.
