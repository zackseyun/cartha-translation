  text: When I am afraid[a], I will trust in you.
translation:
  language: fr
  text: Quand j’ai peur[a], moi, je mets ma confiance en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Au jour où je crains, moi, je mettrai ma confiance en toi. » Les inaccomplis hébreux peuvent aussi s’exprimer en français par le présent, comme dans le texte.'
    reason: La note conserve « jour » pour יוֹם et rend compte sans surinterprétation de la valeur temporelle et résolutive possible des inaccomplis.
lexical_decisions:
- source_word: יוֹם
  choice: Quand
  rationale: Bien que le nom signifie littéralement « jour », il introduit ici une proposition temporelle. « Quand » restitue naturellement cet emploi idiomatique en français.
- source_word: אִירָא
  choice: j’ai peur
  rationale: Le qal inaccompli à la première personne exprime ici la peur éprouvée par le psalmiste, et non la crainte révérencielle. « J’ai peur » est naturel après « quand ».
- source_word: אֲנִי
  choice: moi, je
  rationale: Le pronom indépendant, grammaticalement superflu devant la forme verbale hébraïque, marque une insistance. La dislocation « moi, je » la rend clairement et naturellement en français.
- source_word: אֵלֶיךָ
  choice: en toi
  rationale: Avec בטח, la préposition אֶל indique vers qui se dirige la confiance. La tournure française idiomatique est « mettre sa confiance en toi ».
- source_word: אֶבְטָח
  choice: je mets ma confiance
  rationale: L’inaccompli de בטח exprime ici une résolution en réponse à la peur. Le présent français peut prendre cette valeur au sein de la proposition temporelle et évite l’ambiguïté temporelle peu naturelle de « je mettrai » après « quand j’ai peur ».
theological_decisions:
- issue: Rapport entre la peur et la confiance
  choice: Le texte reconnaît la peur du psalmiste tout en affirmant sa décision de se confier en Dieu.
  alternative: Présenter la confiance comme supprimant entièrement toute peur.
  rationale: L’hébreu juxtapose l’expérience de la peur et l’acte de confiance sans affirmer que la peur est absente; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, simple et digne. « Moi, je » préserve l’insistance du pronom hébreu; « mettre ma confiance en toi » est plus naturel en français courant que le calque « faire confiance vers toi ».
