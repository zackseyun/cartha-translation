  text: עַל אָ֥וֶן פַּלֶּט לָ֑/מוֹ בְּ֝/אַ֗ף עַמִּ֤ים הוֹרֵ֬ד אֱלֹהִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: fr
  text: À cause de l’injustice, ne les laisse pas échapper[a] ; dans ta colère, abaisse les peuples[b], ô Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour l’injustice, délivre-les » ou « fais-les échapper ». La proposition hébraïque est difficile : le verbe peut signifier « délivrer » ou « faire échapper », et aucune négation n’est exprimée dans le texte hébreu. La traduction principale suit le contexte de jugement.'
    reason: alternative_reading
  - marker: b
    text: Ou « les nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: À cause de leur injustice
  rationale: עַל exprime ici vraisemblablement la cause, et אָוֶן désigne une conduite mauvaise ou injuste. « Leur » explicite en français le lien contextuel avec les adversaires sans changer le référent.
- source_word: פַּלֶּט לָמוֹ
  choice: ne les laisse pas échapper
  rationale: Le verbe פלט peut exprimer le fait d’échapper ou celui de délivrer. Dans cette supplication imprécatoire, la traduction principale comprend la proposition comme une demande négative, bien que la négation ne soit pas exprimée dans le texte massorétique; la difficulté est signalée en note.
- source_word: בְּאַף
  choice: dans ta colère
  rationale: אַף désigne ici la colère. Le possessif, implicite puisque Dieu est directement interpellé, est requis par l’usage naturel du français.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel עַמִּים signifie littéralement « peuples »; « nations » demeure possible selon la portée collective du terme.
- source_word: הוֹרֵד
  choice: abaisse
  rationale: L’impératif causatif de ירד signifie faire descendre et, par extension, rabaisser ou renverser. « Abaisse » conserve la métaphore verticale dans un français digne et concis.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est ici un vocatif placé à la fin de la demande; « ô Dieu » en rend clairement la fonction.
theological_decisions:
- issue: Supplication imprécatoire et négation non exprimée dans une proposition hébraïque difficile
  choice: Comprendre la première proposition comme une demande à Dieu de ne pas laisser les coupables échapper au jugement.
  alternative: « Pour leur injustice, ne les délivre pas »; ou, plus littéralement mais obscurément, « À cause de l’injustice, délivre-les ».
  rationale: La syntaxe hébraïque est très condensée et ne comporte aucune particule négative explicite. Le contexte de jugement et la proposition parallèle demandant à Dieu d’abaisser les peuples favorisent toutefois la lecture négative retenue. La note conserve l’autre valeur directe possible du verbe au lieu de masquer la difficulté.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme bref de la supplication poétique est conservé; « ô Dieu » marque clairement l’interpellation solennelle sans archaïsme excessif.
