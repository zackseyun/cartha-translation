source:
  edition: WLC
  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: fr
  text: Tu as compté mes errances ; mets mes larmes dans ton outre[a]. Ne sont-elles pas dans ton livre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une outre était un récipient fait de peau, et non une bouteille moderne en verre.
    reason: historical_context
lexical_decisions:
- source_word: נֹדִי
  choice: mes errances
  rationale: Le nom dérivé de נוד évoque les déplacements instables et forcés d’une personne qui erre. « Mes errances » conserve cette image concrète sans la réduire à une notion abstraite comme « ma souffrance ».
- source_word: סָפַרְתָּה
  choice: tu as compté
  rationale: ספר signifie d’abord compter ou dénombrer, avec la possibilité contextuelle de noter ou consigner. « Tu as compté » préserve le sens concret et suggère l’attention minutieuse de Dieu.
- source_word: שִׂימָה
  choice: mets
  rationale: L’impératif de שׂים signifie mettre ou placer. « Mets » est direct, naturel et respecte la forme de la supplication.
- source_word: דִמְעָתִי
  choice: mes larmes
  rationale: Le singulier hébreu peut avoir ici une valeur collective. Le pluriel français est idiomatique et maintient l’image poétique.
- source_word: בְנֹאדֶךָ
  choice: dans ton outre
  rationale: נֹאד désigne un récipient fait de peau. « Outre » est précis en français et évite l’image anachronique d’une bouteille moderne.
- source_word: הֲלֹא
  choice: ne sont-elles pas
  rationale: הֲלֹא introduit une question rhétorique qui attend une réponse affirmative. La formulation interrogative est conservée plutôt que transformée en affirmation.
- source_word: בְסִפְרָתֶךָ
  choice: dans ton livre
  rationale: Le terme renvoie à un livre ou registre écrit. « Livre » reste naturel et suffisamment large, sans imposer le support matériel précis d’un rouleau.
theological_decisions:
- issue: Images anthropomorphiques de Dieu qui recueille les larmes et tient un livre
  choice: Conserver les images concrètes de l’outre et du livre
  alternative: Paraphraser par « tu te souviens de toutes mes souffrances »
  rationale: Le langage poétique présente Dieu comme attentif de manière personnelle et minutieuse à la détresse du psalmiste. Une paraphrase abstraite affaiblirait cette force sans que l’hébreu l’exige.
translation_notes:
  register: Français moderne, sobre et poétique. Le tutoiement correspond à l’adresse directe à Dieu. Le parallélisme et la question rhétorique de l’hébreu sont conservés.
