source:
  edition: WLC
  text: עָלַ֣/י אֱלֹהִ֣ים נְדָרֶ֑י/ךָ אֲשַׁלֵּ֖ם תּוֹדֹ֣ת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/012.yaml
  text: Your vows are upon me[a], O God[b]; I will render thank offerings to you.
translation:
  language: fr
  text: Ô Dieu, tes vœux reposent sur moi[a] ; je m’acquitterai envers toi d’offrandes de reconnaissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « les vœux que je t’ai faits ». L’hébreu dit littéralement « tes vœux », ce qui désigne vraisemblablement les vœux dus à Dieu.'
    reason: alternative_reading
  - marker: b
    text: Ou « des actions de grâce ». Le terme hébreu peut désigner aussi bien des expressions de gratitude que des offrandes de reconnaissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: reposent sur moi
  rationale: Cette formulation conserve l’image hébraïque de quelque chose qui repose sur le psalmiste tout en laissant entendre l’obligation qui lui incombe.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est employé ici comme apostrophe directe ; « Ô Dieu » en rend clairement la valeur vocative dans un registre digne.
- source_word: נְדָרֶיךָ
  choice: tes vœux
  rationale: Le suffixe hébreu est à la deuxième personne du masculin singulier. La traduction conserve cette formulation littérale et sa tension, plutôt que d’introduire directement « mes vœux envers toi ».
- source_word: אֲשַׁלֵּם
  choice: je t’offrirai
  rationale: Le piel de שלם exprime l’acquittement de ce qui est dû. Avec des offrandes comme complément, « offrir » est plus naturel en français que « payer » ou « rendre », tout en exprimant l’accomplissement de l’obligation.
- source_word: תּוֹדֹת
  choice: offrandes de reconnaissance
  rationale: Le pluriel peut désigner des expressions de gratitude ou des sacrifices de reconnaissance. Le contexte des vœux et de leur acquittement favorise ici la nuance cultuelle.
- source_word: לָךְ
  choice: t’
  rationale: Le pronom datif indique Dieu comme destinataire de l’offrande. L’élision dans « je t’offrirai » est la formulation française la plus directe et naturelle.
theological_decisions:
- issue: Sens de « tes vœux » par rapport à Dieu
  choice: Conserver « tes vœux » dans le texte principal.
  alternative: « mes vœux envers toi »
  rationale: La forme hébraïque porte explicitement un suffixe de deuxième personne et signifie littéralement « tes vœux ». Elle désigne vraisemblablement les vœux dus à Dieu, mais le texte principal ne résout pas silencieusement cette formulation inhabituelle.
- issue: Nature des תּוֹדֹת
  choice: Comprendre le terme comme des offrandes de reconnaissance.
  alternative: « actions de grâce » ou « remerciements »
  rationale: Le parallélisme avec les vœux et le verbe exprimant l’acquittement d’une obligation appuie une nuance sacrificielle, sans exclure le sens plus général de gratitude signalé en note.
translation_notes:
  register: Français moderne, international et digne. La tournure inhabituelle « tes vœux reposent sur moi » préserve l’image et l’ambiguïté de l’hébreu ; les notes donnent les équivalents idiomatiques sans les imposer au texte principal.
