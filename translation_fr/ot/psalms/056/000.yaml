  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: fr
  text: Au chef de chœur. Sur « La colombe muette des lointains »[a]. De David. Miktam[b], lorsque les Philistins le saisirent à Gath.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « La colombe muette des lointains »; il s’agit peut-être du titre d’un air. Le sens exact de l’expression est incertain.'
    reason: alternative_reading
  - marker: b
    text: Miktam est un terme technique employé dans les titres de certains psaumes; son sens précis est inconnu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: La formule de suscription désigne le responsable de l’exécution musicale; cette expression est claire en français moderne.
- source_word: עַל
  choice: Sur
  rationale: Dans les titres de psaumes, la préposition peut introduire l’air ou le titre musical selon lequel le psaume doit être exécuté.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: « La colombe muette des lointains »
  rationale: La formule obscure est probablement un titre d’air. Cette traduction suit les sens usuels de « colombe », « mutisme » et « lieux éloignés », tout en signalant l’incertitude en note.
- source_word: לְדָוִד
  choice: De David
  rationale: Cette formulation préserve l’ambiguïté de la relation exprimée par la préposition hébraïque, sans imposer exclusivement l’idée d’auteur.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Il s’agit d’un terme technique des suscriptions dont le sens exact demeure inconnu; la translittération évite une conjecture.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: lorsque ... le saisirent
  rationale: La construction indique la circonstance temporelle; « saisirent » rend naturellement l’action hostile sans préciser davantage qu’en hébreu.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation ethnique française traditionnelle et exacte.
- source_word: בְּגַת
  choice: à Gath
  rationale: En français, la préposition « à » est naturelle devant un nom de ville.
theological_decisions:
- issue: Statut et portée de la suscription
  choice: Traduire la suscription comme partie du texte reçu, en conservant ses indications musicales et historiques ainsi que ses termes incertains.
  alternative: La traiter comme une simple métadonnée éditoriale, ou donner à מִכְתָּם un sens conjectural tel que « psaume d’or ».
  rationale: Le texte hébreu transmet cette ligne comme suscription du psaume. La traduction n’en retranche rien et évite de transformer les éléments obscurs en affirmations historiques ou doctrinales plus précises.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe brève respecte la forme d’une suscription. Les guillemets identifient le titre musical probable, tandis que les notes préservent explicitement les incertitudes lexicales.
