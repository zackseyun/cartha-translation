  text: שָׁאֲפ֣וּ שׁ֭וֹרְרַ/י כָּל הַ/יּ֑וֹם כִּֽי רַבִּ֨ים לֹחֲמִ֖ים לִ֣/י מָרֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/002.yaml
  text: My enemies pant after me all day long[a], for many fight against me from on high.
translation:
  language: fr
  text: 'Mes ennemis me traquent toute la journée,

    car nombreux sont ceux qui me combattent avec hauteur[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis les hauteurs »; le dernier mot hébreu peut aussi être compris comme une apostrophe à Dieu : « ô Très-Haut »; certains le rendent par « avec orgueil ».'
    reason: Le mot מָרוֹם et son rapport syntaxique avec le reste du verset admettent une lecture adverbiale, spatiale ou vocative.
lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: me traquent
  rationale: Le verbe évoque littéralement le souffle haletant d’un poursuivant et, dans ce contexte hostile, une poursuite acharnée. « Me traquent » restitue naturellement en français l’image d’ennemis lancés avec avidité à la poursuite du psalmiste, sans imposer le sens plus interprétatif « m’écrasent ».
- source_word: שׁוֹרְרַי
  choice: mes ennemis
  rationale: Le terme désigne ici des adversaires hostiles. « Mes ennemis » est clair, naturel et adapté au registre de la plainte.
- source_word: כָּל הַיּוֹם
  choice: toute la journée
  rationale: Équivalent idiomatique courant de l’expression hébraïque, qui souligne la continuité de l’hostilité.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la plainte; « car » maintient clairement ce rapport explicatif et convient au rythme poétique.
- source_word: רַבִּים
  choice: nombreux sont ceux
  rationale: Cette tournure met en relief le grand nombre des assaillants tout en produisant une phrase française fluide.
- source_word: לֹחֲמִים לִי
  choice: qui me combattent
  rationale: Le participe exprime une action hostile en cours dirigée contre le psalmiste. « Me combattent » conserve la coloration militaire sans lourdeur.
- source_word: מָרוֹם
  choice: avec hauteur
  rationale: Le nom évoque la hauteur ou l’élévation et peut ici fonctionner adverbialement pour caractériser l’attitude hautaine des assaillants. « Avec hauteur » conserve cette image d’élévation sans exclure les autres analyses signalées en note.
theological_decisions:
- issue: Interprétation de מָרוֹם
  choice: avec hauteur
  alternative: ô Très-Haut; depuis les hauteurs
  rationale: La syntaxe très condensée permet de comprendre le dernier mot comme une indication de hauteur ou d’arrogance, ou comme une apostrophe adressée à Dieu. Le texte principal retient une lecture adverbiale naturelle en français, tandis que la note conserve explicitement la lecture vocative théologiquement significative et la lecture spatiale.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme des deux lignes est maintenu; « me traquent » rend l’intensité de la poursuite sans employer une image française artificielle, et la note préserve l’ambiguïté du dernier mot hébreu.
