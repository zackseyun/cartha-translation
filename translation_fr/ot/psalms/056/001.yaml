id: PSA.56.1
reference: Psalms 56:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱ֭לֹהִים כִּֽי שְׁאָפַ֣/נִי אֱנ֑וֹשׁ כָּל הַ֝/יּ֗וֹם לֹחֵ֥ם יִלְחָצֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/001.yaml
  text: Be gracious to me[a], O God, for man pants after me; all day long, fighting, he oppresses me.
translation:
  language: fr
  text: 'Fais-moi grâce, ô Dieu,

    car un mortel me poursuit avec avidité[a] ;

    tout le jour, il me combat et m’opprime.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut évoquer quelqu’un qui halète en poursuivant sa proie ; selon l’interprétation, on peut aussi traduire : « me piétine », « se jette sur moi » ou « cherche à m’engloutir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: L’impératif intensif de חנן avec suffixe de première personne demande la faveur bienveillante de Dieu. Cette formulation française est naturelle dans une prière et n’impose pas une nuance pénitentielle particulière.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe directe ; « ô Dieu » en restitue la valeur vocative dans un registre poétique digne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la supplication.
- source_word: שְׁאָפַנִי
  choice: me poursuit avec avidité
  rationale: Le verbe שׁאף évoque littéralement le halètement ou le reniflement, puis une poursuite avide et hostile. La traduction conserve cette avidité menaçante sans produire en français une image involontairement équivoque.
- source_word: אֱנוֹשׁ
  choice: un mortel
  rationale: אֱנוֹשׁ désigne ici un être humain, souvent avec une nuance de fragilité. Le singulier du texte est maintenu, tandis que « mortel » préserve le contraste implicite avec Dieu.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Cette expression temporelle rend la continuité de l’hostilité dans un français poétique mais actuel.
- source_word: לֹחֵם
  choice: il me combat
  rationale: Le participe qal de לחם décrit l’action hostile en cours. Le français emploie une proposition coordonnée implicite pour rendre la ligne naturellement.
- source_word: יִלְחָצֵנִי
  choice: m’opprime
  rationale: לחץ signifie presser, accabler ou opprimer. « M’opprime » exprime la pression hostile durable et conserve le sujet singulier.
theological_decisions:
- issue: Valeur humaine et masculine de אֱנוֹשׁ
  choice: un mortel
  alternative: un homme
  rationale: Le contexte présente un adversaire humain singulier. « Un mortel » respecte ce singulier tout en faisant entendre la faiblesse de l’être humain face à Dieu, sans généraliser à toute l’humanité.
translation_notes:
  register: Français international moderne, au registre priant et poétique. Le parallélisme et les trois lignes brèves sont conservés ; l’ambiguïté du verbe שׁאף est signalée en note plutôt que résolue silencieusement.
