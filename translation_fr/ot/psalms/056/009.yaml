source:
  edition: WLC
  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: fr
  text: 'Alors mes ennemis reculeront le jour où je crierai. Je le sais[a] : Dieu est pour moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par ceci, je sais que Dieu est pour moi. »'
    reason: L’hébreu peut comprendre « ceci » soit comme l’objet de ce que sait le psalmiste, soit comme le moyen ou le signe par lequel il sait que Dieu est pour lui.
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui marque la conséquence attendue de l’appel du psalmiste.
- source_word: יָשׁוּבוּ ... אָחוֹר
  choice: reculeront
  rationale: L’expression formée avec שוב et אָחוֹר décrit un mouvement en arrière, ici la retraite des ennemis.
- source_word: אוֹיְבַי
  choice: mes ennemis
  rationale: Rend directement le nom avec son suffixe possessif.
- source_word: בְּיוֹם אֶקְרָא
  choice: le jour où je crierai vers toi
  rationale: Préserve l’expression temporelle concrète; dans ce contexte de prière, « crier vers toi » exprime naturellement l’appel adressé à Dieu, implicite dans l’hébreu.
- source_word: זֶה יָדַעְתִּי
  choice: Je le sais
  rationale: Lecture déictique naturelle en français; la lecture instrumentale « À ceci je reconnais » reste possible et figure en note.
- source_word: כִּי
  choice: ':'
  rationale: Le deux-points introduit naturellement en français le contenu de ce que le psalmiste sait.
- source_word: אֱלֹהִים לִי
  choice: Dieu est pour moi
  rationale: Exprime ici l’appui et la faveur de Dieu, conformément au contexte où les ennemis reculent.
theological_decisions:
- issue: Sens de « Dieu est pour moi »
  choice: Dieu soutient le psalmiste et lui accorde sa faveur
  alternative: Dieu est à moi
  rationale: La proposition hébraïque est elliptique, mais le contexte de l’appel suivi du recul des ennemis favorise nettement l’idée de soutien divin sans exclure la force relationnelle de la formule.
- issue: Rapport de זֶה avec ce qui suit
  choice: '« Je le sais » : Dieu est pour moi'
  alternative: « À ceci je reconnais que Dieu est pour moi »
  rationale: La syntaxe permet une lecture déictique ou instrumentale; le texte principal retient la première et la note préserve la seconde.
translation_notes:
  register: Français international moderne, clair et digne. Le futur conserve l’assurance du psalmiste. « Crier vers toi » explicite avec naturel la direction de l’appel en contexte de prière, sans ajouter de contenu doctrinal.
