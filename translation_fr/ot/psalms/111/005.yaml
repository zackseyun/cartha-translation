id: PSA.111.5
reference: Psalms 111:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: טֶ֭רֶף נָתַ֣ן לִֽ/ירֵאָ֑י/ו יִזְכֹּ֖ר לְ/עוֹלָ֣ם בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/005.yaml
  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: fr
  text: Il a donné de la nourriture à ceux qui le craignent[a] ; il se souviendra pour toujours de son alliance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une proie » ; le terme hébreu peut désigner de la nourriture obtenue comme proie, mais il signifie probablement ici la nourriture de manière générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: nourriture
  rationale: Le nom peut désigner une « proie » ou la nourriture tirée d’une proie. Dans ce contexte célébrant les bienfaits de Dieu, « nourriture » exprime naturellement le sens concret sans introduire inutilement une image de prédation.
- source_word: נָתַן
  choice: a donné
  rationale: Le parfait hébreu présente l’action comme accomplie. Le passé composé est naturel en français et convient à l’évocation des bienfaits accordés par Dieu.
- source_word: לִירֵאָיו
  choice: à ceux qui le craignent
  rationale: Cette formulation idiomatique rend le participe désignant les personnes caractérisées par la crainte de Dieu et conserve la force biblique de ירא, que « révèrent » pourrait atténuer.
- source_word: יִזְכֹּר
  choice: il se souviendra
  rationale: L’imparfait hébreu peut ici porter une valeur future, renforcée par « pour toujours ». Le verbe « se souvenir » préserve l’expression biblique de la fidélité active de Dieu à son alliance.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression française courante et digne rend naturellement l’idée de durée indéfinie ou perpétuelle dans ce contexte d’alliance.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: « Alliance » est le terme français établi qui convient à בְּרִית lorsqu’il s’agit des engagements durables de Dieu.
theological_decisions:
- issue: Sens du « souvenir » divin dans le contexte de l’alliance
  choice: « il se souviendra de son alliance », avec l’idée biblique d’une fidélité qui se manifeste en actes
  alternative: « il se souvient de son alliance », comme présent de vérité générale
  rationale: Dans l’hébreu biblique, le fait que Dieu se souvienne de son alliance implique souvent qu’il agisse conformément à celle-ci. La traduction garde toutefois le verbe littéral et l’orientation future, sans remplacer l’expression par une interprétation telle que « il respectera ».
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme entre l’acte accompli de Dieu et sa fidélité durable est conservé, de même que l’expression biblique « craindre Dieu ».
