revisions:
- from: Il a fait que ses œuvres merveilleuses restent dans les mémoires[a] ; Yahweh fait grâce et il est compatissant.
  to: Il a fait qu’on se souvienne de ses merveilles[a] ; Yahweh est bienveillant et compatissant.
  rationale: La révision enlève l’ajout implicite de durée contenu dans « restent dans les mémoires » et rend directement la fonction causative de עָשָׂה avec זֵכֶר. Elle rétablit aussi le parallélisme descriptif de חַנּוּן וְרַחוּם par deux adjectifs français, tout en conservant le nom divin et l’alternative lexicale « mémorial » en note.
