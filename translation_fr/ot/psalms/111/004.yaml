  text: זֵ֣כֶר עָ֭שָׂה לְ/נִפְלְאֹתָ֑י/ו חַנּ֖וּן וְ/רַח֣וּם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: fr
  text: Il a fait qu’on se souvienne de ses merveilles[a] ; Yahweh est bienveillant et compatissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a établi un mémorial pour ses merveilles. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: restent dans les mémoires
  rationale: Le nom peut désigner le souvenir ou un mémorial. Avec עָשָׂה et לְנִפְלְאֹתָיו, cette formulation verbale exprime naturellement en français l’établissement d’un souvenir durable, tout en signalant en note la lecture plus concrète « mémorial ».
- source_word: עָשָׂה
  choice: Il a fait que
  rationale: Le verbe signifie littéralement « faire ». Dans cette construction, « il a fait que… restent » restitue sa valeur causative contextuelle sans transformer le verbe en un simple passif.
- source_word: לְנִפְלְאֹתָיו
  choice: ses œuvres merveilleuses
  rationale: Le terme désigne ici les actes extraordinaires de Dieu. « Œuvres merveilleuses » garde le caractère concret de ses actions et convient au registre poétique.
- source_word: חַנּוּן
  choice: fait grâce
  rationale: L’adjectif décrit celui qui accorde sa faveur ou sa grâce. La tournure « fait grâce » est claire et naturelle, tout en évitant que « gracieux » soit compris au sens esthétique moderne.
- source_word: וְרַחוּם
  choice: et il est compatissant
  rationale: Le mot exprime une profonde compassion ou miséricorde. « Compatissant » préserve cette nuance affective et reste distinct de חַנּוּן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Sujet de עָשָׂה
  choice: Le pronom « Il » renvoie à Yahweh, nommé dans la seconde proposition.
  alternative: 'Formulation impersonnelle : « Un mémorial a été fait… »'
  rationale: Le verbe masculin singulier n’a pas de sujet exprimé avant que Yahweh soit nommé à la fin du verset. La continuité poétique permet de comprendre Yahweh comme sujet, mais la note maintient l’autre analyse lexicale de la construction.
translation_notes:
  register: Français international moderne, digne et poétique. « Restent dans les mémoires » est idiomatique et rend la durée implicite du souvenir ; la solution plus formelle « mémorial » est conservée en note. La reprise « il est » équilibre la seconde proposition et évite l’ambiguïté d’un adjectif détaché.
