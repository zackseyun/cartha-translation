id: PSA.111.7
reference: Psalms 111:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: fr
  text: Les œuvres de ses mains sont vérité et justice ; tous ses préceptes sont dignes de confiance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂי
  choice: œuvres
  rationale: Le pluriel construit désigne ce qui est fait ou accompli ; « œuvres » convient au registre poétique et conserve l’écho traditionnel sans être obscur.
- source_word: יָדָיו
  choice: de ses mains
  rationale: Le rendu littéral préserve l’image poétique des mains comme expression de l’action divine.
- source_word: אֱמֶת
  choice: vérité
  rationale: Le nom caractérise les œuvres de Dieu et forme avec « justice » un couple nominal équilibré ; « vérité » maintient aussi la distinction avec נֶאֱמָנִים dans le second membre.
- source_word: וּמִשְׁפָּט
  choice: et justice
  rationale: Dans ce contexte, מִשְׁפָּט désigne la qualité de ce qui est juste ; « justice » est plus naturel que « jugement » dans ce parallélisme.
- source_word: נֶאֱמָנִים
  choice: sont dignes de confiance
  rationale: Cette expression française actuelle rend clairement la solidité et la fiabilité attribuées aux préceptes.
- source_word: כָּל
  choice: tous
  rationale: Le quantificateur universel est rendu directement et s’accorde avec le nom masculin pluriel.
- source_word: פִּקּוּדָיו
  choice: ses préceptes
  rationale: « Préceptes » conserve la nuance d’instructions prescrites par Dieu et la portée juridique et éthique du terme dans les Psaumes.
theological_decisions:
- issue: Rendu de אֱמֶת pour caractériser les œuvres de Dieu
  choice: vérité
  alternative: fidélité ; fiabilité
  rationale: « Vérité » préserve la forme nominale et le parallélisme avec « justice », tandis que le second membre exprime déjà explicitement la fiabilité par נֶאֱמָנִים.
- issue: Degré de spécificité de פִּקּוּדָיו
  choice: ses préceptes
  alternative: ses instructions ; ses prescriptions
  rationale: « Préceptes » maintient la force prescriptive et éthique du terme sans le réduire à une instruction générale.
translation_notes:
  register: Français international moderne, digne et poétique. La structure en deux membres est conservée, ainsi que l’image concrète des « mains ». Aucun marqueur de note n’est nécessaire, les principales ambiguïtés lexicales étant consignées dans les décisions de traduction.
