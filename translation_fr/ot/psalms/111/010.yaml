source:
  edition: WLC
  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: fr
  text: La crainte de Yahvé est le commencement de la sagesse[a] ; tous ceux qui les mettent en pratique ont un bon discernement[b]. Sa louange subsiste pour toujours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le principe de la sagesse » ou « le fondement de la sagesse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un bon discernement pour tous ceux qui les font ». Le pronom « les » n’a pas d’antécédent explicite dans ce verset ; il peut renvoyer aux préceptes de Yahvé évoqués dans le psaume.'
    reason: source_ambiguity
  - marker: c
    text: 'Ou : « demeure à jamais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: le commencement de la sagesse
  rationale: « Commencement » exprime naturellement l’idée de point de départ ou de fondement sans réduire רֵאשִׁית à un sens uniquement chronologique.
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahvé
  rationale: « Crainte » conserve la force de l’expression sapientielle hébraïque, qui comprend respect, révérence et crainte véritable. Le nom divin est rendu par « Yahvé ».
- source_word: שֵׂכֶל טוֹב
  choice: un bon discernement
  rationale: « Discernement » rend la compréhension juste, pratique et morale désignée ici par שֵׂכֶל ; « bon » conserve directement la valeur de טוֹב.
- source_word: לְכָל עֹשֵׂיהֶם
  choice: tous ceux qui les mettent en pratique ont
  rationale: Cette formulation française restitue la construction nominale implicite et conserve le suffixe masculin pluriel « les », dont l’antécédent n’est pas exprimé dans ce verset.
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à Yahvé. « Louange » préserve la possibilité qu’il s’agisse de la louange qui lui est adressée ou de ce qui le rend digne de louange.
- source_word: עֹמֶדֶת לָעַד
  choice: subsiste pour toujours
  rationale: « Subsiste » exprime avec naturel en français la permanence véhiculée par le verbe hébreu « se tenir, demeurer ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahvé » le traite comme le nom personnel de Dieu plutôt que de le remplacer par un titre.
- issue: Portée de יִרְאָה dans l’expression sapientielle
  choice: crainte
  alternative: respect révérenciel
  rationale: « Crainte » maintient la tension théologique du terme hébreu, qui ne se limite ni à la terreur ni au simple respect.
- issue: Antécédent du suffixe pluriel dans עֹשֵׂיהֶם
  choice: conserver le pluriel indéterminé « les »
  alternative: le rendre au singulier comme renvoyant à la crainte de Yahvé
  rationale: Le suffixe hébreu est pluriel et son antécédent n’est pas explicite. Le singulier résoudrait une ambiguïté que le texte laisse ouverte ; le pluriel peut notamment renvoyer aux préceptes évoqués dans le psaume.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche du parallélisme hébreu tout en étant naturelle. Le pronom pluriel difficile est conservé dans le texte et expliqué en note plutôt que silencieusement harmonisé au singulier.
