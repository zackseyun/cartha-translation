source:
  edition: WLC
  text: כֹּ֣חַ מַ֭עֲשָׂי/ו הִגִּ֣יד לְ/עַמּ֑/וֹ לָ/תֵ֥ת לָ֝/הֶ֗ם נַחֲלַ֥ת גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/006.yaml
  text: He has declared to his people the power of his works[a], in giving them the inheritance of the nations.
translation:
  language: fr
  text: Il a fait connaître à son peuple la puissance de ses œuvres[a], en leur donnant l’héritage des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a fait connaître à son peuple la puissance de ses œuvres afin de leur donner l’héritage des nations. » L’infinitif hébreu peut exprimer le but plutôt que le moyen ou le résultat.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: puissance
  rationale: Le nom désigne la force ou la puissance. « Puissance » convient aux actes remarquables de Dieu et s’emploie naturellement avec « œuvres ».
- source_word: מַעֲשָׂיו
  choice: ses œuvres
  rationale: מַעֲשֶׂה peut désigner une œuvre, un acte ou une action. « Ses œuvres » conserve le registre poétique et le lien avec les actes de Dieu célébrés dans le psaume.
- source_word: הִגִּיד
  choice: a fait connaître
  rationale: Le hiphil de נגד signifie annoncer, déclarer ou faire connaître. Cette formulation est naturelle en français et exprime clairement la révélation au peuple.
- source_word: לְעַמּוֹ
  choice: à son peuple
  rationale: La préposition ל introduit ici le destinataire de ce que Dieu fait connaître.
- source_word: לָתֵת
  choice: en donnant
  rationale: L’infinitif construit avec ל peut exprimer ici le moyen ou le résultat, mais aussi le but. Le texte principal retient la nuance instrumentale la plus probable, tandis que la note conserve l’autre lecture.
- source_word: לָהֶם
  choice: leur
  rationale: Le pronom pluriel renvoie aux membres du collectif « son peuple »; « leur » préserve ce passage du singulier collectif au pluriel.
- source_word: נַחֲלַת
  choice: l’héritage
  rationale: נַחֲלָה désigne un héritage, un patrimoine ou une possession attribuée. « L’héritage » conserve le vocabulaire biblique sans préciser au-delà de l’hébreu qu’il s’agit du territoire.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Le terme désigne ici les nations étrangères. « Des nations » est neutre, exact et préférable à « des païens », qui ajouterait une connotation religieuse.
theological_decisions:
- issue: Rapport de la proposition infinitive לָתֵת לָהֶם נַחֲלַת גּוֹיִם avec la proposition principale
  choice: 'Nuance de moyen ou de manifestation : Dieu a fait connaître sa puissance en donnant l’héritage.'
  alternative: 'Nuance de but : Dieu a fait connaître la puissance de ses œuvres afin de donner l’héritage.'
  rationale: L’infinitif hébreu avec ל peut exprimer le but, le résultat ou le moyen. Le contexte des actes historiques de Dieu favorise la lecture selon laquelle le don manifeste sa puissance, mais l’ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste proche de la structure hébraïque tout en étant naturelle; « son peuple » est un collectif, ce qui explique la reprise plurielle « leur ».
