  text: הוֹד וְ/הָדָ֥ר פָּֽעֳל֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: fr
  text: 'Splendeur et majesté sont son œuvre,

    et sa justice[a] demeure pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: splendeur
  rationale: Le terme évoque l’éclat, la gloire ou la dignité. « Splendeur » conserve ici la force poétique du premier élément de la paire.
- source_word: הָדָר
  choice: majesté
  rationale: Associé à הוֹד, le mot désigne une magnificence imposante. « Majesté » forme en français une paire naturelle et solennelle avec « splendeur ».
- source_word: פָּעֳלוֹ
  choice: son œuvre
  rationale: Le singulier hébreu peut désigner l’œuvre ou l’activité de Dieu dans son ensemble. « Son œuvre » respecte cette forme collective.
- source_word: צִדְקָתוֹ
  choice: sa justice
  rationale: Le nom couvre la justice, la droiture et la conformité à ce qui est juste. « Justice » est naturel dans le contexte des œuvres de Dieu, tandis que « droiture » demeure une possibilité réelle.
- source_word: עֹמֶדֶת
  choice: demeure
  rationale: Le participe signifie littéralement « se tient » et exprime ici la permanence. « Demeure » restitue cette continuité dans un français idiomatique.
- source_word: לָעַד
  choice: pour toujours
  rationale: L’expression indique une durée perpétuelle. « Pour toujours » est clair, courant et fidèle.
theological_decisions:
- issue: Sens de צִדְקָתוֹ dans l’affirmation de la permanence de l’attribut divin
  choice: sa justice
  alternative: sa droiture
  rationale: Le contexte célèbre les œuvres de Dieu et ce qui est juste en lui sans imposer exclusivement un cadre judiciaire. « Justice » garde une portée morale et relationnelle large; la note préserve « droiture », qui met davantage l’accent sur la rectitude.
translation_notes:
  register: Français moderne, international et digne. La tournure « caractérisent son œuvre » rend explicitement la proposition nominale hébraïque sans alourdir le vers; le parallélisme poétique est conservé sur deux lignes.
