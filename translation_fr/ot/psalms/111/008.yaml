  text: סְמוּכִ֣ים לָ/עַ֣ד לְ/עוֹלָ֑ם עֲ֝שׂוּיִ֗ם בֶּ/אֱמֶ֥ת וְ/יָשָֽׁר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/008.yaml
  text: They are established forever and ever[b][a], done in truth and uprightness.
translation:
  language: fr
  text: Ils sont établis pour toujours, à jamais[a], faits dans la vérité[b] et la droiture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soutenus pour toujours, à jamais » ; le participe hébreu peut souligner le fait d’être soutenu ou rendu ferme.
    reason: lexical_alternative
  - marker: b
    text: « Dans la vérité » peut aussi se traduire par « dans la fidélité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: établis
  rationale: Le participe passif de סמך exprime ce qui est soutenu ou rendu ferme. « Établis » rend naturellement la stabilité durable des préceptes évoqués au verset précédent.
- source_word: לָעַד לְעוֹלָם
  choice: pour toujours, à jamais
  rationale: Les deux expressions temporelles se renforcent mutuellement. Cette formulation française conserve l'insistance de l'hébreu sans être excessivement lourde.
- source_word: עֲשׂוּיִם
  choice: accomplis
  rationale: Le participe passif de עשה peut signifier « faits » ou « accomplis ». Ici, « accomplis » convient à des préceptes mis en œuvre conformément à la vérité et à la droiture.
- source_word: בֶּאֱמֶת
  choice: avec vérité
  rationale: אֱמֶת couvre les notions de vérité, de fiabilité et de fidélité. « Avec vérité » préserve le noyau lexical et la manière dont les préceptes sont accomplis.
- source_word: וְיָשָׁר
  choice: et droiture
  rationale: יָשָׁר signifie ce qui est droit, juste ou intègre. Le substantif français « droiture » forme avec « vérité » une paire abstraite naturelle.
