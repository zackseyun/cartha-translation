id: PSA.111.9
reference: Psalms 111:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פְּד֤וּת שָׁ֘לַ֤ח לְ/עַמּ֗/וֹ צִוָּֽה לְ/עוֹלָ֥ם בְּרִית֑/וֹ קָד֖וֹשׁ וְ/נוֹרָ֣א שְׁמֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: fr
  text: Il a envoyé la rédemption à son peuple ; il a établi son alliance pour toujours[a]. Son nom est saint et redoutable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il a ordonné son alliance pour toujours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « digne d’être craint ». L’hébreu évoque une crainte mêlée de profond respect.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: rédemption
  rationale: Le nom désigne une libération obtenue par rachat ou par intervention. « Rédemption » conserve ici l’image biblique et la portée théologique du terme.
- source_word: שָׁלַח
  choice: a envoyé
  rationale: Le sens premier du verbe est « envoyer ». Cette formulation garde l’image concrète de Dieu qui fait parvenir la rédemption à son peuple.
- source_word: לְעַמּוֹ
  choice: à son peuple
  rationale: La préposition לְ marque naturellement ici le destinataire ; « à son peuple » suit directement la construction hébraïque.
- source_word: צִוָּה
  choice: a établi
  rationale: Le verbe signifie littéralement « commander, ordonner ». Avec « alliance » comme complément, « a établi » exprime naturellement en français l’acte souverain et normatif, tandis que la formulation plus littérale est signalée en note.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression française courante rend la durée indéfinie et permanente indiquée par l’hébreu.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: « Alliance » est le terme biblique usuel et conserve la dimension relationnelle, engageante et solennelle de בְּרִית.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: « Saint » est l’équivalent précis et consacré lorsqu’il est question du nom de Dieu.
- source_word: וְנוֹרָא
  choice: et redoutable
  rationale: « Redoutable » exprime qu’il inspire une crainte mêlée de respect et d’émerveillement, sans réduire le mot à la simple admiration.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: La traduction littérale conserve l’usage biblique où le nom représente le caractère révélé et la renommée de Dieu.
theological_decisions:
- issue: Valeur de צִוָּה avec « son alliance »
  choice: il a établi son alliance pour toujours
  alternative: il a ordonné son alliance pour toujours
  rationale: L’hébreu emploie le verbe « commander, ordonner », mais la collocation littérale serait ambiguë et peu naturelle en français. « A établi » rend l’acte souverain qui donne à l’alliance sa validité durable ; la note conserve la force lexicale de l’original.
- issue: Portée de וְנוֹרָא appliqué au nom de Dieu
  choice: redoutable
  alternative: digne d’être craint ; inspirant une crainte révérencielle
  rationale: Le terme associe majesté, effroi et respect religieux. « Redoutable » maintient cette tension mieux qu’un terme limité à l’émerveillement, et la note en précise la nuance.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme du verset est conservé, avec une syntaxe claire. « Rédemption », « alliance » et « saint » maintiennent le registre biblique sans archaïsme ; les notes préservent les nuances que la formulation idiomatique ne peut entièrement porter.
