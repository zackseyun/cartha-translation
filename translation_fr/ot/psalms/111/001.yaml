  text: הַ֥לְלוּ יָ֨הּ אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לֵבָ֑ב בְּ/ס֖וֹד יְשָׁרִ֣ים וְ/עֵדָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: fr
  text: Louez Yah ![a] Je rendrai grâce à Yahweh de tout mon cœur, au conseil des hommes droits[b] et dans l’assemblée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire par « Alléluia ! » Le texte dit littéralement « Louez Yah », avec la forme courte du nom divin.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le cercle des hommes droits ». Le mot hébreu peut désigner un conseil, un cercle proche ou un groupe réuni.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel suivi de la forme courte du nom divin constitue une acclamation. Cette traduction conserve la distinction entre יָהּ et יְהוָה dans le même verset.
- source_word: אוֹדֶה
  choice: Je rendrai grâce
  rationale: Dans ce contexte de louange, le hiphil de ידה exprime l’action de remercier ou de célébrer avec reconnaissance. Le futur français rend bien l’engagement personnel du psalmiste.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin explicite et le distingue de sa forme courte « Yah » au début du verset.
- source_word: בְּכָל לֵבָב
  choice: de tout mon cœur
  rationale: Cette expression française naturelle traduit l’idée d’une reconnaissance entière, sans partage.
- source_word: בְּסוֹד
  choice: dans le cercle
  rationale: סוֹד peut désigner un cercle proche, un conseil ou une réunion. « Cercle » préserve cette nuance et évite de le confondre avec עֵדָה.
- source_word: יְשָׁרִים
  choice: des hommes droits
  rationale: L’adjectif substantivé désigne ceux qui se conduisent avec droiture. Cette formulation reste directe et intelligible.
- source_word: וְעֵדָה
  choice: et dans l’assemblée
  rationale: עֵדָה désigne la communauté rassemblée ; « assemblée » convient au cadre collectif du psaume et reste distinct de « cercle ».
theological_decisions:
- issue: Rendu conjoint des noms divins יָהּ et יְהוָה
  choice: « Yah » puis « Yahweh »
  alternative: « Alléluia » puis « le Seigneur », ou « Louez le Seigneur » dans les deux cas
  rationale: Le texte hébreu emploie successivement la forme courte et la forme complète du nom divin. Les conserver fait entendre cette variation sans les réduire à un même titre.
- issue: Portée de סוֹד יְשָׁרִים
  choice: « dans le cercle des hommes droits »
  alternative: « dans l’assemblée des hommes droits » ou « au conseil des hommes droits »
  rationale: Le mot peut évoquer aussi bien un groupe réuni qu’un cercle proche ou un conseil. « Cercle » maintient l’ambiguïté entre proximité et rassemblement tout en le distinguant de l’assemblée mentionnée ensuite.
translation_notes:
  register: Français international actuel, sobre et liturgique. « Rendre grâce » est idiomatique dans un contexte de culte ; « cercle » conserve la nuance de proximité de סוֹד sans faire double emploi avec « assemblée ».
