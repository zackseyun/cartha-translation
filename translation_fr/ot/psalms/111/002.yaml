  text: 'Grandes sont les œuvres du SEIGNEUR,

    recherchées par tous ceux qui y prennent plaisir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְּדֹלִים
  choice: Grandes
  rationale: Conserve l’adjectif initial et sa mise en relief, dans une formulation française naturelle et solennelle.
- source_word: מַעֲשֵׂי
  choice: les œuvres
  rationale: Rend le terme hébreu désignant les actes ou réalisations de Dieu; « œuvres » convient au registre poétique du psaume.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Suit la convention française courante qui représente le tétragramme par « le SEIGNEUR ».
- source_word: דְּרוּשִׁים
  choice: étudiées
  rationale: Le participe passif de דרש évoque des œuvres recherchées, examinées avec soin; « étudiées » exprime clairement cette attention soutenue.
- source_word: לְכָל חֶפְצֵיהֶם
  choice: par tous ceux qui y prennent plaisir
  rationale: Le suffixe renvoie naturellement aux œuvres; la formulation garde l’idée de plaisir ou de délectation éprouvé à leur égard.
theological_decisions:
- issue: Nature de l’attention portée aux œuvres divines
  choice: étudiées
  alternative: recherchées
  rationale: « Étudiées » met en avant l’examen attentif impliqué par דרש sans limiter le verset à une quête destinée à retrouver des œuvres cachées.
translation_notes:
  register: Français moderne, international et digne. L’inversion « Grandes sont… » préserve l’emphase poétique de l’hébreu sans rendre le vers artificiellement obscur.
