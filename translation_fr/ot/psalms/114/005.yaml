  text: What is with you[a], O sea, that you flee—O Jordan, that you turn back?
translation:
  language: fr
  text: Qu’as-tu, ô mer, à t’enfuir, ô Jourdain, à retourner en arrière ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לְּךָ
  choice: Qu’as-tu
  rationale: Cette tournure française conserve l’adresse directe et étonnée de l’expression idiomatique hébraïque, littéralement « quoi à toi ? », sans la réduire au simple « pourquoi ».
- source_word: הַיָּם
  choice: ô mer
  rationale: Le nom désigne la mer et fonctionne ici comme une apostrophe. « Ô mer » restitue clairement cette adresse poétique.
- source_word: כִּי
  choice: pour
  rationale: Après « Qu’as-tu », « pour » introduit naturellement en français le comportement qui suscite l’étonnement, sans imposer une explication causale.
- source_word: תָנוּס
  choice: t’enfuir
  rationale: Le verbe נוּס signifie fuir. La forme pronominale « t’enfuir » est idiomatique en français et maintient la personnification.
- source_word: הַיַּרְדֵּן
  choice: ô Jourdain
  rationale: Le Jourdain est directement interpellé en parallèle avec la mer ; « ô Jourdain » rend cette valeur vocative.
- source_word: תִּסֹּב
  choice: retourner
  rationale: Dans ce contexte, le verbe exprime un changement de direction ou un retour. « Retourner » s’accorde naturellement avec « en arrière ».
- source_word: לְאָחוֹר
  choice: en arrière
  rationale: L’expression indique un mouvement vers l’arrière et rappelle le recul des eaux évoqué dans le contexte.
