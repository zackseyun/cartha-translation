  source_fidelity: 'Le sens de l’hébreu est globalement bien rendu : Israël / la maison de Jacob forment un parallélisme, de même qu’Égypte / un peuple caractérisé par une langue étrangère ou incompréhensible. L’explicitation de l’ellipse par « quitta » est acceptable en français et ne modifie pas le sens.'
  naturalness: La répétition de « quand » avant le second membre est inutile et alourdit le parallélisme français. Une seule subordonnée temporelle initiale permet de conserver la syntaxe ouverte vers le verset suivant tout en donnant au second membre sa fonction parallèle.
  terminology: « Maison de Jacob » est une désignation traditionnelle appropriée. « Un peuple au langage étranger » est plus idiomatique que « un peuple de langue étrangère » tout en préservant la relativité implicite de לֹעֵז. La note conserve prudemment la nuance possible d’inintelligibilité.
