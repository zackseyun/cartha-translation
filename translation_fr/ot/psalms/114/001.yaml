  text: בְּ/צֵ֣את יִ֭שְׂרָאֵל מִ/מִּצְרָ֑יִם בֵּ֥ית יַ֝עֲקֹ֗ב מֵ/עַ֥ם לֹעֵֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/001.yaml
  text: When Israel went out from Egypt[a], the house of Jacob from a people of strange speech,
translation:
  language: fr
  text: Quand Israël sortit d’Égypte, la maison de Jacob quitta un peuple au langage étranger,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/צֵאת
  choice: Quand … sortit
  rationale: La préposition ב suivie de l’infinitif construit de יצא introduit une proposition temporelle. « Quand … sortit » est naturel en français et conserve cette valeur.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du peuple de l’alliance.
- source_word: מִ/מִּצְרָיִם
  choice: d’Égypte
  rationale: La préposition מן indique ici la provenance ou la séparation. Après « sortit », « d’Égypte » est la formulation française idiomatique.
- source_word: בֵּית יַעֲקֹב
  choice: la maison de Jacob
  rationale: Cette désignation traditionnelle des descendants de Jacob préserve le parallélisme poétique et la résonance collective de l’hébreu.
- source_word: מֵ/עַם
  choice: quitta un peuple
  rationale: La préposition מן exprime la séparation. Le verbe « quitta », sous-entendu dans le parallélisme hébreu, est explicité pour produire une phrase française claire.
- source_word: לֹעֵז
  choice: de langue étrangère
  rationale: Le terme qualifie un peuple dont la langue est étrangère ou inintelligible du point de vue d’Israël. Cette formulation reste concise, poétique et sans connotation ethnique péjorative.
theological_decisions:
- issue: Rapport entre les deux membres parallèles
  choice: 'Le second membre reformule l’exode en parallèle : « la maison de Jacob » correspond à « Israël », et le départ d’un « peuple de langue étrangère » correspond à la sortie d’Égypte.'
  alternative: Conserver strictement l’ellipse verbale du second membre, au prix d’une tournure peu naturelle en français.
  rationale: La poésie hébraïque emploie ici un parallélisme synonymique. Répéter « quand » et expliciter « quitta » rendent ce rapport intelligible sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et poétique. La virgule finale signale que la proposition temporelle se poursuit syntaxiquement au verset suivant.
