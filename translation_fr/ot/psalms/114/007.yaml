  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: fr
  text: Tremble[a], terre, devant le Seigneur, devant le Dieu de Jacob !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Frémis, terre », afin de conserver l’image plus forte d’un bouleversement convulsif que peut exprimer le verbe hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: devant
  rationale: La locution signifie littéralement « de devant la face / la présence de ». En français actuel, « devant » exprime naturellement la réaction de la terre en présence de Dieu et convient à la répétition poétique.
- source_word: אָדוֹן
  choice: le Seigneur
  rationale: אָדוֹן signifie « seigneur, maître ». Ici, le titre désigne le Dieu d’Israël. « le Seigneur » est idiomatique, tout en restant distinct du nom divin YHWH, absent de ce verset.
- source_word: חוּלִי
  choice: Tremble
  rationale: Cet impératif féminin singulier s’adresse directement à la terre. Le verbe חול peut évoquer le tremblement, la torsion convulsive ou les douleurs de l’enfantement. « Tremble » donne un appel poétique naturel sans effacer complètement l’idée d’un profond bouleversement.
- source_word: אָרֶץ
  choice: terre
  rationale: אֶרֶץ peut désigner une terre ou la terre. Le cadre cosmique du psaume et l’apostrophe directe favorisent « terre » ; en français, l’absence d’un « ô » vocatif garde une diction actuelle.
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: le Dieu de Jacob
  rationale: La construction identifie Dieu par sa relation avec Jacob. L’article défini produit une formulation française naturelle après « devant ».
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est rendu selon sa forme française biblique usuelle.
theological_decisions:
- issue: Distinguer אָדוֹן du nom divin YHWH
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte porte אָדוֹן, titre signifiant « seigneur, maître », et non le tétragramme YHWH. « le Seigneur » préserve cette distinction sans modifier l’identité du référent.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif initial et la répétition de « devant » conservent le parallélisme hébreu ; le point d’exclamation marque la force de l’apostrophe.
