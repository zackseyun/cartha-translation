source:
  edition: WLC
  text: הֶֽ֭/הָרִים תִּרְקְד֣וּ כְ/אֵילִ֑ים גְּ֝בָע֗וֹת כִּ/בְנֵי צֹֽאן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/006.yaml
  text: O mountains[a], why do you skip like rams, O hills[b], like lambs of the flock?
translation:
  language: fr
  text: Montagnes, pourquoi bondissez-vous[a] comme des béliers, et vous, collines, comme les agneaux du troupeau[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « sautez » ou « dansez ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme les fils du petit bétail », expression qui désigne les jeunes du troupeau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָרִים
  choice: Montagnes, pourquoi
  rationale: Le nom désigne les montagnes. La formulation interrogative et l’adresse directe poursuivent la question du verset précédent ; « Montagnes, pourquoi » restitue naturellement ce mouvement en français.
- source_word: תִּרְקְדוּ
  choice: bondissez-vous
  rationale: Le verbe רָקַד peut évoquer le fait de bondir, sauter ou danser. « Bondir » convient particulièrement aux comparaisons animales qui suivent.
- source_word: כְאֵילִים
  choice: comme des béliers
  rationale: אֵילִים désigne ici le plus naturellement des béliers et forme un parallèle avec les jeunes animaux du troupeau dans le second membre.
- source_word: גְּבָעוֹת
  choice: et vous, collines
  rationale: Le nom signifie « collines ». L’ajout idiomatique de « et vous » maintient l’adresse directe et rend le parallélisme poétique naturel en français.
- source_word: כִּבְנֵי צֹאן
  choice: comme les agneaux du troupeau
  rationale: L’expression signifie littéralement « comme les fils du petit bétail » et désigne les jeunes du troupeau. « Agneaux du troupeau » en transmet clairement l’image en français courant.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion interrogative conserve l’adresse solennelle, tandis que « bondir » maintient la vivacité de l’image animale.
