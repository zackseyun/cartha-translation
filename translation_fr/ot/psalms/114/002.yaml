id: PSA.114.2
reference: Psalms 114:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָיְתָ֣ה יְהוּדָ֣ה לְ/קָדְשׁ֑/וֹ יִ֝שְׂרָאֵ֗ל מַמְשְׁלוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/002.yaml
  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: fr
  text: 'Juda devint son sanctuaire[a][b],

    Israël, son domaine[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut son sanctuaire ». Le verbe hébreu peut exprimer soit un état (« fut »), soit l’entrée dans un état (« devint »).
    reason: lexical_alternative
  - marker: b
    text: Ou « son lieu saint » ou « sa sainteté ». Le terme hébreu peut désigner la sainteté ou un lieu saint; ici, le sens concret convient au parallélisme avec « son domaine ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le lieu où il règne » ou « son autorité ». Le nom hébreu est au pluriel dans sa forme, mais il semble avoir ici un sens abstrait ou désigner l’étendue de la domination.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: devint
  rationale: Dans la séquence historique introduite au verset précédent, le verbe היה peut marquer l’entrée dans un nouvel état. « Devint » rend cette valeur événementielle tout en laissant en note la lecture stative possible.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française usuelle du nom de la tribu et du territoire.
- source_word: לְקָדְשׁוֹ
  choice: son sanctuaire
  rationale: קֹדֶשׁ peut désigner la sainteté ou, concrètement, un lieu saint. « Son sanctuaire » convient au parallélisme avec le domaine où Dieu exerce son autorité.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du peuple et de la nation.
- source_word: מַמְשְׁלוֹתָיו
  choice: son domaine
  rationale: Le nom désigne l’exercice de l’autorité ou la sphère sur laquelle elle s’étend. Bien que la forme hébraïque soit plurielle, elle a vraisemblablement ici une valeur abstraite ou extensive; le singulier français est donc naturel.
theological_decisions:
- issue: Référent des suffixes possessifs masculins singuliers
  choice: Les pronoms « son » renvoient à Dieu, sans le nommer dans le verset.
  alternative: Nommer explicitement « le Seigneur » ou reformuler par « le sanctuaire de Dieu » et « le domaine de Dieu ».
  rationale: Le contexte du psaume identifie naturellement Dieu comme référent. Les possessifs conservent cependant la concision et l’implicite du texte hébreu.
- issue: Parallélisme entre Juda et Israël
  choice: Conserver distinctement les deux noms propres.
  alternative: Les fondre en une seule désignation collective ou interpréter Juda comme le peuple saint et Israël comme le royaume.
  rationale: Le parallélisme poétique nomme séparément Juda et Israël; les maintenir évite d’aplanir la structure ou d’imposer une interprétation historique ou théologique particulière.
translation_notes:
  register: Français international moderne, sobre et poétique. L’ellipse du verbe dans le second membre est conservée par la virgule. « Sanctuaire » et « domaine » maintiennent le parallélisme entre sphère sacrée et sphère d’autorité sans explicitation doctrinale.
