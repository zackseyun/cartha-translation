lexical_decisions:
- source_word: הָרִים
  choice: les montagnes
  rationale: L’article défini hébreu est rendu naturellement en français par « les ».
- source_word: רָקְדוּ
  choice: bondissaient
  rationale: Le verbe évoque un mouvement vif, comparable à une danse ou à des sauts. « Bondissaient » convient à l’image animale tout en conservant l’animation poétique.
- source_word: כְאֵילִים
  choice: comme des béliers
  rationale: אֵילִים désigne ici naturellement des béliers, en parallèle avec les jeunes du troupeau au second membre.
- source_word: גְּבָעוֹת
  choice: les collines
  rationale: Bien que le nom soit sans article en hébreu, l’article défini est naturel en français dans ce parallélisme avec « les montagnes ».
- source_word: כִּבְנֵי צֹאן
  choice: comme des agneaux
  rationale: L’expression signifie littéralement « comme des fils du petit bétail », c’est-à-dire les jeunes du troupeau; « agneaux » rend clairement et poétiquement l’image en français.
