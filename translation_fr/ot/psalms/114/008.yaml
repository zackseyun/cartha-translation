source:
  edition: WLC
  text: הַ/הֹפְכִ֣י הַ/צּ֣וּר אֲגַם מָ֑יִם חַ֝לָּמִ֗ישׁ לְ/מַעְיְנ/וֹ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/008.yaml
  text: who turned the rock into a pool of water[a], the flint into a spring of water.
translation:
  language: fr
  text: 'qui a changé le rocher en bassin d’eau[a],

    le silex en source d’eau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui change le rocher en bassin d’eau » ; l’hébreu emploie un participe, mais le passé convient au rappel des actes de Dieu dans le désert.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: qui a changé
  rationale: Le participe hiphil de הפך poursuit la description du Dieu de Jacob au verset précédent. Le passé convient au rappel poétique de ses actes dans le désert, tandis que « qui » préserve le lien relatif avec le verset 7.
- source_word: הַצּוּר
  choice: le rocher
  rationale: צוּר désigne couramment un rocher ou une masse rocheuse. « Rocher » est naturel en français et convient à l’allusion au don d’eau dans le désert.
- source_word: אֲגַם
  choice: bassin
  rationale: אֲגַם désigne une étendue d’eau stagnante. « Bassin d’eau » rend clairement l’image sans suggérer nécessairement un ouvrage artificiel.
- source_word: מָיִם
  choice: d’eau
  rationale: La répétition de « d’eau » dans les deux membres conserve le parallélisme explicite de l’hébreu.
- source_word: חַלָּמִישׁ
  choice: le silex
  rationale: חַלָּמִישׁ désigne le silex ou une roche particulièrement dure. « Silex » maintient la vigueur de l’image et souligne le caractère prodigieux de l’acte.
- source_word: לְמַעְיְנוֹ
  choice: en source
  rationale: מַעְיָן signifie « source » ou « fontaine » et le לְ marque ici le résultat de la transformation, parallèlement au premier membre. Le singulier suit la forme hébraïque.
theological_decisions:
- issue: Sujet divin implicite repris du verset précédent
  choice: Conserver la proposition relative « qui a changé » sans répéter « Dieu »
  alternative: « Il a changé le rocher… »
  rationale: L’hébreu continue la description du Seigneur, le Dieu de Jacob, commencée au verset 7. La relative préserve la continuité syntaxique et poétique sans expliciter davantage le sujet.
- issue: Valeur temporelle du participe הַהֹפְכִי
  choice: Rendre le participe par le passé composé « a changé »
  alternative: « qui change »
  rationale: Le psaume évoque les actes accomplis par Dieu lors de l’Exode. Toutefois, le participe hébreu peut aussi se lire de façon caractérisante ou actuelle; cette possibilité est conservée en note.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme des deux membres, la répétition de « d’eau » et l’enchaînement avec le verset précédent sont conservés. « Silex » maintient l’image concrète de la roche extrêmement dure.
