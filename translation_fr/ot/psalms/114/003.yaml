  text: הַ/יָּ֣ם רָ֭אָה וַ/יָּנֹ֑ס הַ֝/יַּרְדֵּ֗ן יִסֹּ֥ב לְ/אָחֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/003.yaml
  text: The sea saw and fled[b][a]; the Jordan turned back.
translation:
  language: fr
  text: La mer vit et s’enfuit[a] ; le Jourdain retourna en arrière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verset évoque poétiquement la traversée de la mer lors de la sortie d’Égypte et l’arrêt des eaux du Jourdain à l’époque de Josué.
    reason: cross_reference
lexical_decisions:
- source_word: הַיָּם
  choice: la mer
  rationale: Nom défini signifiant « la mer ». Le texte hébreu ne précise pas ici « mer Rouge », même si l’allusion à l’Exode ressort du contexte.
- source_word: רָאָה
  choice: vit
  rationale: Équivalent direct du verbe courant « voir » ; le passé simple convient à la poésie narrative et conserve la personnification.
- source_word: וַיָּנֹס
  choice: et s’enfuit
  rationale: Le verbe נוס signifie « fuir ». Cette formulation concise et vive préserve l’image poétique de la mer qui recule.
- source_word: הַיַּרְדֵּן
  choice: le Jourdain
  rationale: Désignation française usuelle du fleuve, correspondant au nom hébreu avec article.
- source_word: יִסֹּב לְאָחוֹר
  choice: retourna en arrière
  rationale: L’expression indique un mouvement en sens inverse. Elle garde explicitement la composante לְאָחוֹר, « en arrière », tout en restant naturelle en français.
theological_decisions:
- issue: Allusion historico-poétique
  choice: Conserver la personnification de la mer et du Jourdain sans expliciter dans le corps du verset les événements historiques évoqués.
  alternative: Ajouter un objet à « vit » ou nommer la traversée de la mer et celle du Jourdain.
  rationale: L’hébreu ne donne aucun objet explicite au verbe « vit ». La poésie laisse le contexte éclairer l’allusion à l’Exode et à l’entrée en Canaan ; ajouter « cela » ou « le Seigneur » trancherait indûment l’ambiguïté.
translation_notes:
  register: Français moderne, digne et poétique. Le passé simple maintient la concision du parallélisme hébreu. « Retourna en arrière » rend les deux éléments de יִסֹּב לְאָחוֹר sans ajouter l’idée plus précise d’un renversement du courant.
