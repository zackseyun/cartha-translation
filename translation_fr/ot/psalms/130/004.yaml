id: PSA.130.4
reference: Psalms 130:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: fr
  text: Mais auprès de toi se trouve le pardon, afin que l’on te craigne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que l’on te révère » ; l’hébreu dit littéralement « que tu sois craint », souvent au sens d’une crainte mêlée de profond respect envers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Mais
  rationale: Dans le contexte, la particule introduit le contraste entre l’impossibilité de subsister sous un jugement strict (v. 3) et le pardon qui se trouve auprès de Dieu.
- source_word: עִמְּךָ
  choice: auprès de toi
  rationale: Cette expression française naturelle rend la présence du pardon auprès de Dieu, sans suggérer qu’il s’agit simplement d’un accompagnement.
- source_word: הַסְּלִיחָה
  choice: le pardon
  rationale: Le nom désigne l’acte ou la réalité du pardon. « Le pardon » est ici idiomatique, clair et digne.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution conserve la valeur de but, avec une possible nuance de résultat, de l’expression hébraïque.
- source_word: תִּוָּרֵא
  choice: l’on te craigne
  rationale: Le verbe ירא au niphal signifie littéralement « être craint ». La tournure impersonnelle active est plus naturelle en français tout en conservant le lexème « craindre » et sa tension sémantique.
theological_decisions:
- issue: Nature de la réponse suscitée par le pardon divin
  choice: Le pardon conduit à craindre Dieu, selon le terme explicite de l’hébreu.
  alternative: « afin que l’on te révère »
  rationale: Le texte emploie le verbe ירא, « craindre », qui peut exprimer devant Dieu une crainte empreinte de profond respect. Le texte principal garde ce mot au lieu d’en réduire la portée à la seule révérence; la note explicite la nuance possible.
translation_notes:
  register: Français international moderne, simple et digne. « Auprès de toi se trouve » garde la structure existentielle du verset sans lourdeur excessive; « l’on » convient au registre poétique et évite l’ambiguïté moderne de la voix passive.
