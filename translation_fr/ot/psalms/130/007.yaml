  text: יַחֵ֥ל יִשְׂרָאֵ֗ל אֶל יְה֫וָה כִּֽי עִם יְהוָ֥ה הַ/חֶ֑סֶד וְ/הַרְבֵּ֖ה עִמּ֣/וֹ פְדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: fr
  text: Israël, espère en Yahweh[a], car auprès de Yahweh se trouve l’amour fidèle, et auprès de lui une abondante rédemption.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « attends Yahweh ». Le verbe hébreu évoque une attente pleine d’espérance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֵל
  choice: attends
  rationale: Le verbe יחל associe l’attente patiente à l’espérance confiante. « Attends » conserve directement l’idée d’attente, tandis que l’autre nuance est signalée en note.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre désigne ici le peuple appelé collectivement à attendre avec espérance.
- source_word: אֶל יְהוָה
  choice: Yahweh
  rationale: 'Avec le verbe « attendre », la préposition אֶל marque l’orientation vers celui qui est attendu. En français, le complément direct est la tournure naturelle : « attendre Yahweh ».'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’exhortation et « car » convient au registre poétique.
- source_word: עִם יְהוָה
  choice: auprès de Yahweh est
  rationale: « Auprès de » préserve l’image de ce qui se trouve avec Dieu, sans réduire le rapport à une simple possession.
- source_word: הַחֶסֶד
  choice: l’amour fidèle
  rationale: חֶסֶד exprime un amour loyal, constant et engagé. « Amour fidèle » restitue ces dimensions dans une langue actuelle et non technique.
- source_word: וְהַרְבֵּה
  choice: abonde
  rationale: La formulation verbale naturelle en français exprime clairement la grande abondance indiquée par l’hébreu.
- source_word: עִמּוֹ
  choice: auprès de lui
  rationale: Cette expression reprend le premier עִם et maintient le parallélisme entre « auprès de Yahweh » et « auprès de lui ».
- source_word: פְדוּת
  choice: la rédemption
  rationale: Le terme désigne la libération obtenue par rachat. « Rédemption » en conserve la portée lexicale et théologique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom personnel divin; sa transcription le distingue d’un simple titre.
- issue: Nuance de יחל dans l’exhortation
  choice: attends Yahweh
  alternative: place ton espérance en Yahweh
  rationale: Le verbe réunit les idées d’attente et d’espérance. Le texte principal conserve l’attente, et la note présente l’autre nuance réelle sans trancher artificiellement entre elles.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est maintenu par la répétition de « auprès de », tandis que « la rédemption abonde » évite une tournure nominale peu naturelle en français.
