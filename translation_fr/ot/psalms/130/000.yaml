lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend littéralement le titre traditionnel de cette collection tout en restant naturel en français.
- source_word: מִמַּעֲמַקִּים
  choice: Du fond des abîmes
  rationale: Exprime les « profondeurs » comme image d’une détresse extrême; la tournure française conserve la force poétique du pluriel hébreu.
- source_word: קְרָאתִיךָ
  choice: je t’appelle
  rationale: Le parfait hébreu peut se rendre par un passé (« je t’ai appelé »), mais le présent fait entendre l’appel comme la prière immédiate du psaume sans modifier son contenu.
- source_word: יהוה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer silencieusement par un titre.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin; sa translittération préserve cette distinction sans ajouter une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, poétique et digne. « Du fond des abîmes » conserve l’image hébraïque; « je t’appelle » garde une simplicité directe. Les marqueurs de notes sont placés après le titre concerné et après le nom divin, tout en documentant respectivement le titre traditionnel et l’alternative temporelle.
