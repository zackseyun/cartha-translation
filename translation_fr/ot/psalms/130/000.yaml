  yaml_path: translation/ot/psalms/130/000.yaml
  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: fr
  text: Chant des montées[a]. Du fond des abîmes, je t’ai appelé, Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Chant des montées », titre traditionnel de ce groupe de psaumes.'
