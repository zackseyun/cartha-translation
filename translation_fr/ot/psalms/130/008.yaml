  text: וְ֭/הוּא יִפְדֶּ֣ה אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל עֲוֺנֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: fr
  text: Et c’est lui qui rachètera Israël de toutes ses fautes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant la pluralité du peuple : « de toutes leurs fautes ». L’hébreu emploie « Israël » au singulier avec un suffixe singulier (« ses »), considérant Israël comme un tout collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Et lui, il
  rationale: La conjonction assure la continuité avec le verset précédent, tandis que le pronom indépendant apporte une légère mise en relief. La tournure française « Et lui, il » la rend sans l'accentuer excessivement.
- source_word: יִפְדֶּה
  choice: rachètera
  rationale: Le verbe פדה désigne la délivrance obtenue par rachat ou libération. « Racheter » conserve cette image et convient naturellement à l'espérance exprimée dans le psaume.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule introduit « Israël » comme objet direct défini et n’a pas d’équivalent lexical distinct en français.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre traditionnel est conservé et désigne ici collectivement le peuple.
- source_word: מִכֹּל
  choice: de toutes
  rationale: La préposition מן jointe à כֹּל exprime une délivrance complète à l’égard de tout ce qui suit. L’accord au féminin pluriel correspond à « fautes ».
- source_word: עֲוֺנֹתָיו
  choice: ses fautes
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Fautes » est clair, digne et naturel en français. Le possessif « ses » respecte formellement le suffixe masculin singulier tout en pouvant, en français, se rapporter sans difficulté au nom collectif « Israël ».
theological_decisions:
- issue: Suffixe collectif singulier rattaché à « Israël »
  choice: « ses fautes »
  alternative: « leurs fautes »
  rationale: L’hébreu traite Israël comme une réalité collective singulière et emploie un suffixe de troisième personne masculine du singulier. Le français « ses » préserve ce nombre grammatical et la représentation corporative d’Israël. « Leurs » explicite plutôt la pluralité des membres du peuple et demeure une possibilité idiomatique signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Et lui, il » conserve la légère insistance du pronom hébreu indépendant; « rachètera » maintient l’image de la rédemption. Le possessif « ses » est à la fois formellement fidèle et idiomatique en français.
