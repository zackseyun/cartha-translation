  yaml_path: translation/ot/psalms/130/006.yaml
  text: My soul waits for the Lord more than watchmen for the morning[a], more than watchmen for the morning.
translation:
  language: fr
  text: Mon âme attend le Seigneur plus que les veilleurs n’attendent le matin[a], plus que les veilleurs n’attendent le matin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon âme est tournée vers le Seigneur plus que les veilleurs vers le matin. » L’hébreu n’exprime pas explicitement le verbe « attendre » dans ce verset ; il est suppléé d’après le contexte du psaume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Mon âme
  rationale: Le nom נֶפֶשׁ avec le suffixe de première personne désigne littéralement « mon âme » et, dans ce contexte poétique, la personne tout entière dans son attente et son désir. « Mon âme » conserve cette force sans réduire l’expression à « je ».
- source_word: לַאדֹנָי
  choice: attend le Seigneur
  rationale: L’hébreu dit littéralement « mon âme, vers/pour le Seigneur » sans verbe exprimé. Le contexte immédiat du psaume permet de suppléer naturellement « attend ». אֲדֹנָי est rendu par le titre divin français usuel « le Seigneur ».
- source_word: מִשֹּׁמְרִים
  choice: plus que les veilleurs
  rationale: La préposition מִן marque ici la comparaison. Le participe pluriel שֹׁמְרִים évoque ceux qui assurent une veille, particulièrement pendant la nuit ; « les veilleurs » est naturel et garde l’image poétique.
- source_word: לַבֹּקֶר
  choice: le matin
  rationale: בֹּקֶר signifie « matin ». Avec le verbe français explicité, « attendre le matin » exprime idiomatiquement l’objet de l’attente, tout en conservant le lexème et sa répétition.
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: les veilleurs n’attendent le matin
  rationale: Le second membre hébreu répète l’expression afin d’intensifier l’attente. La traduction maintient intégralement cette répétition plutôt que de la lisser.
theological_decisions:
- issue: Verbe absent dans la proposition hébraïque
  choice: suppléer « attend »
  alternative: « Mon âme est tournée vers le Seigneur… »
  rationale: Le texte massorétique n’exprime aucun verbe dans ce verset. « Attend » découle du contexte, notamment de l’attente explicitement formulée au verset précédent, mais la note conserve l’ambiguïté syntaxique de l’hébreu.
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: mon Seigneur
  rationale: Le référent est Dieu et « le Seigneur » est en français le titre révérenciel courant. La forme hébraïque peut historiquement être analysée avec un élément possessif, mais elle fonctionne ici comme titre divin.
translation_notes:
  register: Français moderne, international et poétique. La formulation conserve « mon âme », le titre « le Seigneur » et la répétition emphatique de l’hébreu. Le verbe répété dans la comparaison rend la phrase naturelle en français, tandis que la note signale son absence dans le texte source.
