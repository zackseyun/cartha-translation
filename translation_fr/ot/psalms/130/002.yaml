id: PSA.130.2
reference: Psalms 130:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲדֹנָ/י֮ שִׁמְעָ֪/ה בְ/ק֫וֹלִ֥/י תִּהְיֶ֣ינָה אָ֭זְנֶי/ךָ קַשֻּׁב֑וֹת לְ֝/ק֗וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: fr
  text: Seigneur, écoute ma voix ! Que tes oreilles soient attentives à la voix de mes supplications[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes demandes de grâce ». Le terme hébreu désigne d’ardentes supplications sollicitant faveur ou compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé ici comme apostrophe. « Seigneur » est l’équivalent français naturel et digne, sans le confondre avec le tétragramme.
- source_word: שִׁמְעָה
  choice: écoute
  rationale: L’impératif exprime une demande adressée à Dieu. En français actuel, « écoute » convient mieux que le littéral « entends » dans cet appel à prêter attention.
- source_word: בְּקוֹלִי
  choice: ma voix
  rationale: Conserve l’image concrète de קוֹל et donne en français l’expression idiomatique « écoute ma voix ».
- source_word: תִּהְיֶינָה
  choice: Que … soient
  rationale: Rend la valeur jussive de l’imparfait dans une prière.
- source_word: אָזְנֶיךָ
  choice: tes oreilles
  rationale: Maintient l’image corporelle explicite de l’hébreu au lieu de l’abstraire en « ton attention ».
- source_word: קַשֻּׁבוֹת
  choice: attentives
  rationale: Exprime clairement l’écoute soutenue et s’accorde naturellement avec « oreilles ».
- source_word: לְקוֹל
  choice: à la voix de
  rationale: Préserve la répétition de « voix » et le parallélisme poétique du texte hébreu.
- source_word: תַּחֲנוּנָי
  choice: mes supplications
  rationale: Le terme désigne des appels insistants sollicitant faveur ou compassion. « Supplications » conserve à la fois l’intensité et le registre de la prière, tandis que la note explicite la nuance de miséricorde.
theological_decisions:
- issue: Langage anthropomorphique concernant l’écoute de Dieu
  choice: Conserver « tes oreilles soient attentives »
  alternative: Paraphraser par « sois attentif à ma prière »
  rationale: L’hébreu emploie expressément l’image des oreilles de Dieu ; la conserver respecte la poésie et la force relationnelle de la supplication.
- issue: Portée de תַּחֲנוּנָי
  choice: « mes supplications », avec une note sur l’appel à la grâce ou à la compassion
  alternative: « mes appels au secours » ou « mes demandes de grâce »
  rationale: Le mot implique d’ardentes demandes de faveur ou de compassion, sans préciser à lui seul leur contenu exact. Le texte principal reste concis et la note préserve cette amplitude sémantique.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe habituelle des psaumes en français. La répétition de « voix » et l’image concrète des oreilles sont maintenues pour respecter le parallélisme et la poésie de l’hébreu.
