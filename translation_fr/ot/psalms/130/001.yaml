  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: fr
  text: Chant des montées[a]. Des profondeurs, je t’appelle, Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Chant des montées ». Titre traditionnel du groupe formé par les Psaumes 120 à 134 ; son contexte historique précis demeure incertain.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « je t’ai appelé, Yahweh ». La forme verbale hébraïque peut être comprise comme un passé ; le présent fait ressortir l’immédiateté de la prière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Chant
  rationale: Le nom désigne un chant. « Chant » convient au titre sans introduire le genre plus précis de « psaume ».
- source_word: הַמַּעֲלוֹת
  choice: des montées
  rationale: Cette expression traditionnelle désigne le groupe des Psaumes 120–134. La traduction littérale préserve l’image et évite de trancher son cadre historique précis.
- source_word: מִמַּעֲמַקִּים
  choice: Du fond des abîmes
  rationale: Le pluriel hébreu évoque des lieux profonds et, métaphoriquement, une détresse extrême. Cette formulation française conserve la force poétique de l’image.
- source_word: קְרָאתִיךָ
  choice: je t’appelle
  rationale: Le verbe קרא signifie fondamentalement « appeler ». Le présent rend l’immédiateté de la prière, tandis que la valeur passée de l’accompli hébreu est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par le titre traditionnel.
- issue: Valeur temporelle de קְרָאתִיךָ
  choice: je t’appelle
  alternative: je t’ai appelé
  rationale: L’accompli peut renvoyer à un appel déjà formulé, mais le présent convient à l’acte de prière porté par le psaume. La note maintient l’autre lecture possible.
translation_notes:
  register: Français international moderne, poétique et digne. « Montées » garde le titre hébreu sans en imposer une interprétation historique ; « du fond des abîmes » restitue naturellement l’image de détresse profonde.
