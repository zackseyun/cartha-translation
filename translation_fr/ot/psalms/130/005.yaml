source:
  edition: WLC
  text: קִוִּ֣יתִי יְ֭הוָה קִוְּתָ֣ה נַפְשִׁ֑/י וְֽ/לִ/דְבָר֥/וֹ הוֹחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: fr
  text: J’attends Yahweh[a] ; mon âme attend, et je mets mon espérance dans sa parole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai attendu Yahweh ; mon âme a attendu. » Les parfaits hébreux peuvent exprimer ici une résolution acquise ou une attitude présente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’attends sa parole » ou « je mets mon espérance dans sa promesse ». Le mot hébreu peut désigner plus généralement ce que Dieu dit ou, par implication, sa promesse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קִוִּיתִי
  choice: J’attends
  rationale: Le verbe קוה exprime une attente confiante. Le présent rend naturellement, dans ce contexte poétique, l’attitude actuelle et résolue du psalmiste, sans exclure la valeur accomplie possible du parfait hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: קִוְּתָה
  choice: attend
  rationale: La répétition du verbe קוה est maintenue afin de préserver le parallélisme et l’insistance du texte hébreu.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner la personne elle-même ou sa vie intérieure. « Mon âme » garde ici la force poétique de l’expression tout en restant claire en français moderne.
- source_word: לִדְבָרוֹ
  choice: dans sa parole
  rationale: דבר désigne ici ce que Dieu dit, éventuellement avec la nuance de promesse. La préposition française « dans » présente cette parole comme le fondement de l’espérance.
- source_word: הוֹחָלְתִּי
  choice: je mets mon espérance
  rationale: Le verbe יחל associe attente et espérance. Cette formulation le distingue du verbe קוה répété dans les deux premiers membres tout en conservant leur proximité sémantique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Sens de דְבָרוֹ
  choice: sa parole
  alternative: sa promesse
  rationale: « Sa parole » préserve l’étendue sémantique de דבר et évite de préciser sans nécessité qu’il s’agit exclusivement d’une promesse, bien que cette implication soit possible dans le contexte.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition « attends/attend » reproduit l’insistance hébraïque ; « je mets mon espérance » évite une troisième occurrence française du même verbe tout en rendant la nuance propre à יחל.
