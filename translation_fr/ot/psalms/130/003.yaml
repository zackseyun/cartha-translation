source:
  edition: WLC
  text: אִם עֲוֺנ֥וֹת תִּשְׁמָר יָ֑הּ אֲ֝דֹנָ֗/י מִ֣י יַעֲמֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: fr
  text: Si tu tenais compte[a] des péchés, Yah, Seigneur, qui pourrait rester debout ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « relevais » ou « en gardais le compte ». Le verbe hébreu signifie littéralement « garder, surveiller » et évoque ici le fait de tenir compte des péchés.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit simplement et naturellement la proposition conditionnelle.
- source_word: עֲוֺנוֹת
  choice: fautes
  rationale: Le pluriel désigne ici des actes coupables. « Fautes » est clair en français courant tout en conservant la portée morale du terme.
- source_word: תִּשְׁמָר
  choice: tenais compte
  rationale: Le verbe signifie littéralement garder, surveiller ou observer ; dans ce contexte, il évoque le fait de conserver les fautes en compte. Cette formulation française exprime ce sens sans imposer l’image plus précise d’un registre écrit.
- source_word: יָהּ
  choice: Yah
  rationale: Il s’agit de la forme poétique abrégée du nom divin ; la translittération préserve sa distinction par rapport au titre אֲדֹנָי qui suit.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé ici dans l’adresse directe ; « Seigneur » est le rendu français naturel et traditionnel.
- source_word: מִי
  choice: qui
  rationale: Pronom interrogatif direct qui introduit la question rhétorique.
- source_word: יַעֲמֹד
  choice: pourrait tenir debout
  rationale: 'Conserve l’image de se tenir debout tout en rendant la valeur potentielle de la question : nul ne pourrait subsister devant le jugement divin.'
theological_decisions:
- issue: Distinction entre יָהּ et אֲדֹנָי
  choice: « Yah » puis « Seigneur »
  alternative: Rendre les deux désignations par « Seigneur »
  rationale: Le texte hébreu emploie successivement la forme abrégée du nom divin et un titre. Les distinguer respecte la forme poétique et évite de les confondre.
- issue: Portée de תִּשְׁמָר appliqué aux fautes
  choice: « tenais compte des fautes »
  alternative: « surveillais les fautes » ou « consignais les péchés »
  rationale: Le contexte ne parle pas d’une simple observation, mais du fait de garder les fautes à charge. La traduction exprime cette portée judiciaire sans préciser indûment le moyen, par exemple un registre écrit.
translation_notes:
  register: Français moderne, sobre et poétique. « Tenir debout » maintient l’image hébraïque tout en restant immédiatement compréhensible ; les deux appellations divines sont volontairement distinguées.
