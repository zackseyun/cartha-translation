  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: fr
  text: Qu’est-ce que l’être humain, pour que tu te souviennes de lui, et le fils de l’homme[a], pour que tu t’occupes de lui[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « fils de l’homme » est une expression hébraïque qui désigne un être humain. Dans ce psaume, elle est un parallèle poétique de « l’être humain » et ne constitue pas un titre messianique explicite, bien que l’expression puisse recevoir une portée messianique dans des textes bibliques ultérieurs.
    reason: cross_reference
  - marker: b
    text: 'Ou : « que tu prennes soin de lui », « que tu lui prêtes attention » ou « que tu le visites ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֱנוֹשׁ
  choice: Qu’est-ce que l’être humain
  rationale: La question rhétorique souligne la petitesse de l’humanité. « L’être humain » rend naturellement le singulier représentatif et laisse percevoir la fragilité associée à אֱנוֹשׁ.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette tournure interrogative, « pour que » exprime naturellement en français le lien entre l’insignifiance humaine et l’attention étonnante que Dieu lui accorde.
- source_word: תִזְכְּרֶנּוּ
  choice: tu te souviennes de lui
  rationale: Rend directement le sens courant de זכר tout en conservant l’idée d’une attention personnelle et continue.
- source_word: וּבֶן־אָדָם
  choice: et le fils de l’homme
  rationale: Conserve l’image et le parallélisme hébraïques ainsi que leur résonance canonique; ici, l’expression désigne génériquement un être humain.
- source_word: תִפְקְדֶנּוּ
  choice: tu prennes soin de lui
  rationale: Dans ce contexte admiratif, פקד évoque l’attention active de Dieu. « Prendre soin » est idiomatique en français sans exclure totalement les nuances de visite ou d’attention.
theological_decisions:
- issue: Langage masculin représentatif pour l’humanité
  choice: Employer « l’être humain » dans le premier membre et conserver « le fils de l’homme » dans le second
  alternative: « l’homme » et « le fils de l’homme », ou « le mortel » et « l’être humain »
  rationale: Cette formulation rend la portée générique de אֱנוֹשׁ en français moderne tout en préservant le singulier et l’expression biblique בֶן־אָדָם.
- issue: Portée messianique de « fils de l’homme »
  choice: Conserver l’expression sans majuscule et l’expliquer comme une désignation générique dans ce psaume
  alternative: « être humain » ou « Fils de l’homme » comme titre explicite
  rationale: Le contexte immédiat parle de l’humanité, même si l’expression et le psaume reçoivent ailleurs une application christologique. Le texte principal ne tranche pas en faveur d’un titre messianique explicite.
- issue: Nuance de פקד
  choice: « prendre soin de »
  alternative: « visiter », « t’occuper de » ou « prêter attention à »
  rationale: Le contexte favorise l’attention bienveillante, mais la note maintient visible l’étendue sémantique du verbe.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe à Dieu. La structure en deux membres parallèles est conservée, avec une formulation inclusive dans le premier membre et l’idiome biblique traditionnel dans le second.
