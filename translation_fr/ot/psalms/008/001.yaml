id: PSA.8.1
reference: Psalms 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֤ה אֲדֹנֵ֗י/נוּ מָֽה אַדִּ֣יר שִׁ֭מְ/ךָ בְּ/כָל הָ/אָ֑רֶץ אֲשֶׁ֥ר תְּנָ֥/ה ה֝וֹדְ/ךָ֗ עַל הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: fr
  text: 'Yahweh[a], notre Seigneur,

    que ton nom est majestueux sur toute la terre !

    Tu as placé ta splendeur au-dessus des cieux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: b
    text: 'La forme hébraïque traduite par « tu as placé » est difficile ; elle peut aussi se comprendre comme un appel : « Place ta splendeur au-dessus des cieux. »'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend explicitement le nom divin YHWH présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֲדֹנֵינוּ
  choice: notre Seigneur
  rationale: Dans cette adresse directe à Dieu, « notre Seigneur » est naturel, digne et fidèle au titre אֲדוֹן accompagné du suffixe de première personne du pluriel.
- source_word: מָה אַדִּיר
  choice: que … est majestueux
  rationale: מָה a ici une valeur exclamative, tandis que אַדִּיר évoque la grandeur imposante et majestueuse.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La formulation conserve l’image hébraïque du nom, qui exprime ici la manière dont Dieu se fait connaître, sans l’expliciter dans le corps du texte.
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: « Terre » convient à la portée cosmique du verset et forme un contraste naturel avec « les cieux ».
- source_word: תְּנָה
  choice: tu as placé
  rationale: Dans le contexte poétique, cette traduction suit l’interprétation traditionnelle selon laquelle la splendeur de Dieu est établie au-dessus des cieux, tout en signalant en note la difficulté grammaticale de la forme hébraïque.
- source_word: הוֹדְךָ
  choice: ta splendeur
  rationale: הוֹד désigne l’éclat, la majesté ou la gloire. « Splendeur » préserve l’image poétique sans répéter « majestueux ».
- source_word: עַל הַשָּׁמָיִם
  choice: au-dessus des cieux
  rationale: Cette expression rend l’idée d’élévation et de suprématie portée ici par עַל.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. Sa translittération le distingue du titre אֲדֹנֵינוּ, rendu juste après par « notre Seigneur ».
- issue: Valeur de תְּנָה
  choice: 'affirmation : « Tu as placé »'
  alternative: 'appel : « Place ta splendeur au-dessus des cieux »'
  rationale: Le contexte favorise une déclaration de la grandeur divine, mais la forme consonantique et vocalisée ressemble à un impératif. La traduction principale suit le sens traditionnel sans effacer l’autre possibilité, indiquée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est mis en valeur par trois lignes brèves. L’exclamation restitue la valeur admirative de מָה, tandis que la note [b] préserve l’ambiguïté réelle de la forme verbale hébraïque.
