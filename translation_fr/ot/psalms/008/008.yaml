  text: צִפּ֣וֹר שָׁ֭מַיִם וּ/דְגֵ֣י הַ/יָּ֑ם עֹ֝בֵ֗ר אָרְח֥וֹת יַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/008.yaml
  text: the birds of the heavens[a], and the fish of the sea[b], whatever passes along the paths of the seas.
translation:
  language: fr
  text: 'les oiseaux du ciel et les poissons de la mer,

    tout ce qui parcourt les sentiers des mers.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un participe au singulier, qui peut avoir un sens collectif. On pourrait aussi comprendre : « les poissons de la mer qui parcourent les sentiers des mers ».'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: צִפּוֹר
  choice: les oiseaux
  rationale: Le nom est morphologiquement au singulier, mais il a ici une valeur collective dans l’énumération des créatures; le pluriel est naturel en français.
- source_word: שָׁמַיִם
  choice: du ciel
  rationale: Dans ce contexte, l’expression désigne l’espace où volent les oiseaux. « Du ciel » est idiomatique en français moderne et conserve la dignité poétique.
- source_word: וּדְגֵי הַיָּם
  choice: et les poissons de la mer
  rationale: Cette traduction directe respecte le groupe construit hébreu et emploie la désignation courante des créatures aquatiques.
- source_word: עֹבֵר
  choice: tout ce qui parcourt
  rationale: Le participe singulier peut avoir une portée collective et récapitulative. « Tout ce qui » rend cette valeur sans imposer artificiellement un référent individuel.
- source_word: אָרְחוֹת
  choice: les sentiers
  rationale: « Sentiers » restitue l’image poétique de voies tracées à travers les eaux, avec un registre naturel mais élevé.
- source_word: יַמִּים
  choice: des mers
  rationale: Le pluriel français conserve le pluriel hébreu et l’ampleur de l’image poétique.
theological_decisions:
- issue: Portée du participe singulier עֹבֵר
  choice: 'Le rendre comme une formule collective distincte: « tout ce qui parcourt »'
  alternative: 'Le rattacher seulement aux poissons: « qui parcourent »'
  rationale: La forme singulière permet une lecture collective qui élargit ou récapitule les êtres marins; la traduction choisie préserve cette ouverture au lieu de limiter explicitement le participe aux seuls poissons.
translation_notes:
  register: Français moderne, clair et poétique. « Ciel » est préféré à « cieux » parce qu’il désigne ici naturellement le domaine des oiseaux; « sentiers des mers » conserve l’image et le pluriel du texte hébreu.
