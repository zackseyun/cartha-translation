  text: 'petit bétail et gros bétail, tous sans exception,

    ainsi que les animaux des champs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹנֶה
  choice: petit bétail
  rationale: Le nom collectif désigne les petits animaux domestiques des troupeaux, principalement moutons et chèvres. « Petit bétail » conserve cette extension mieux que « moutons » seul.
- source_word: וַאֲלָפִים
  choice: et gros bétail
  rationale: Le terme désigne les bovins domestiques. En parallèle avec « petit bétail », « gros bétail » rend clairement les deux catégories d’animaux domestiques.
- source_word: כֻּלָּם
  choice: tous sans exception
  rationale: La forme pronominale signifie littéralement « eux tous ». Cette formulation française naturelle préserve l’insistance sur la totalité.
- source_word: וְגַם
  choice: ainsi que
  rationale: Cette locution rend naturellement la coordination et la valeur additive, en étendant l’énumération au-delà des animaux domestiques.
- source_word: בַּהֲמוֹת
  choice: les animaux
  rationale: Dans ce contexte, le pluriel a un sens générique. « Animaux » est clair et actuel; « bêtes » serait possible, mais peut avoir une nuance péjorative en français moderne.
- source_word: שָׂדָי
  choice: des champs
  rationale: Le terme poétique désigne le champ ou la campagne ouverte. « Des champs » conserve l’image biblique et s’intègre naturellement à la désignation des animaux non domestiques.
