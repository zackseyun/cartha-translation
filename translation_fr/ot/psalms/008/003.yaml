  text: כִּֽי אֶרְאֶ֣ה שָׁ֭מֶי/ךָ מַעֲשֵׂ֣י אֶצְבְּעֹתֶ֑י/ךָ יָרֵ֥חַ וְ֝/כוֹכָבִ֗ים אֲשֶׁ֣ר כּוֹנָֽנְתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: fr
  text: Quand je contemple ton ciel, œuvre de tes doigts, la lune et les étoiles que tu as mis en place[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car je vois ton ciel… que tu as établis. »'
    reason: 'Alternative lexicale et syntaxique : כִּי peut être causal (« car »), אֶרְאֶה peut se rendre simplement par « je vois », et כּוֹנָנְתָּה par « tu as établi ». L’accord au masculin pluriel renvoie à « la lune et les étoiles ».'
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans ce contexte poétique, la conjonction introduit la circonstance qui suscite la réflexion formulée au verset suivant. « Quand » assure un enchaînement naturel, tout en restant dans le champ sémantique de כִּי.
- source_word: אֶרְאֶה
  choice: je contemple
  rationale: L’imparfait de ראה décrit ici l’observation attentive du ciel. « Je contemple » est naturel en français poétique moderne et rend mieux cette attention que le simple « je vois ».
- source_word: שָׁמֶיךָ
  choice: ton ciel
  rationale: Bien que l’hébreu emploie une forme plurielle, le français désigne naturellement la voûte céleste par le singulier « ciel ». Le possessif est conservé.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: œuvre de tes doigts
  rationale: Cette formulation conserve directement l’image anthropomorphique et rend le nom hébreu de manière collective et poétique.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: la lune et les étoiles
  rationale: Les articles définis, nécessaires au français naturel, désignent les corps célestes particuliers contemplés par le psalmiste.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif français introduit naturellement la proposition portant sur la lune et les étoiles.
- source_word: כּוֹנָנְתָּה
  choice: tu as mises en place
  rationale: Le polel de כון exprime l’action d’établir fermement ou de disposer. « Mettre en place » communique ici de façon accessible l’ordre et la position donnés aux astres.
theological_decisions:
- issue: Langage anthropomorphique décrivant l’action créatrice de Dieu
  choice: Conserver littéralement « tes doigts »
  alternative: « l’ouvrage de tes mains » ou « ce que tu as fait »
  rationale: L’image hébraïque présente de manière poétique une action créatrice à la fois précise et aisée. La conserver respecte la force du texte sans affirmer que Dieu possède un corps.
- issue: Portée du relatif après « la lune et les étoiles »
  choice: Accorder « mises » au féminin pluriel avec l’ensemble coordonné
  alternative: 'Employer une tournure épicène : « que tu as établies »'
  rationale: En français contemporain, l’accord de proximité au féminin pluriel est possible et rend la phrase fluide. Le sens demeure que Dieu a disposé la lune et les étoiles.
translation_notes:
  register: Français international moderne, poétique et digne. « Contemple » garde l’attention émerveillée sans archaïsme. Le tiret final maintient la suspension syntaxique qui conduit à la question du verset suivant.
