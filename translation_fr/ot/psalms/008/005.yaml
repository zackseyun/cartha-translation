id: PSA.8.5
reference: Psalms 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: fr
  text: Pourtant, tu l’as fait de peu inférieur à Dieu[a], et tu l’as couronné de gloire et d’honneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux êtres célestes »; la Septante traduit « aux anges », formulation reprise en Hébreux 2.7.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: tu l’as fait… inférieur
  rationale: Le hiphil de חסר, suivi d’une comparaison introduite par מִן, exprime ici le fait de placer quelqu’un dans une condition moindre. Cette formulation française rend naturellement le rapport de degré.
- source_word: מְּעַט
  choice: de peu
  rationale: Dans le contexte hébreu, l’expression indique plus naturellement un faible degré d’infériorité qu’une courte durée.
- source_word: מֵאֱלֹהִים
  choice: à Dieu
  rationale: אֱלֹהִים peut désigner Dieu, des dieux ou des êtres célestes. Ici, le sens le plus direct du texte hébreu est « Dieu »; les autres possibilités sont signalées en note.
- source_word: וְכָבוֹד
  choice: de gloire
  rationale: כָּבוֹד évoque la gloire et l’honneur conférés; « gloire » convient au registre poétique élevé et au parallélisme.
- source_word: וְהָדָר
  choice: d’honneur
  rationale: הָדָר peut signifier splendeur, majesté ou honneur. « Honneur » exprime ici la dignité accordée et forme un binôme français naturel avec « gloire ».
- source_word: תְּעַטְּרֵהוּ
  choice: tu l’as couronné
  rationale: Le piel de עטר signifie couronner ou entourer. « Couronner » conserve clairement l’image royale du verset.
theological_decisions:
- issue: Référent et portée représentative du pronom masculin singulier
  choice: Conserver « l’ », avec l’accord masculin implicite fourni par le contexte
  alternative: « les » ou « l’humanité »
  rationale: L’hébreu emploie des formes pronominales masculines singulières, en continuité avec « l’être humain » et « le fils de l’homme » au verset précédent. Le singulier laisse intacte sa portée représentative sans la transformer en pluriel ou en abstraction.
- issue: Sens de אֱלֹהִים
  choice: Dieu
  alternative: les êtres célestes; les anges
  rationale: La priorité donnée au texte hébreu favorise « Dieu ». « Les anges » vient de la Septante et se retrouve en Hébreux 2.7; cette tradition importante est conservée en note plutôt qu’introduite dans le texte principal.
translation_notes:
  register: Français international moderne, poétique et digne. « De peu inférieur » exprime clairement une différence de degré, tandis que « couronné de gloire et d’honneur » préserve l’image royale et le parallélisme hébreu.
