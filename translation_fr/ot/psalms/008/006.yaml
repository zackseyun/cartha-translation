  text: תַּ֭מְשִׁילֵ/הוּ בְּ/מַעֲשֵׂ֣י יָדֶ֑י/ךָ כֹּ֝ל שַׁ֣תָּה תַֽחַת רַגְלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: fr
  text: Tu lui as confié l’autorité sur les œuvres de tes mains[a] ; tu as tout placé sous ses pieds.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu l’as fait régner sur les œuvres de tes mains. »'
    reason: lexical_alternative
  - marker: b
    text: 'Les pronoms masculins singuliers poursuivent la formulation représentative du verset précédent : dans le texte hébreu, ils désignent ici l’humanité.'
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Tu lui as donné autorité
  rationale: Le hifil de משל exprime ici le fait d’établir quelqu’un comme dirigeant ou de lui faire exercer l’autorité. « Donner autorité » est naturel en français et conserve l’idée d’une autorité conférée par Dieu ; « tu l’as fait régner » serait également possible, mais peut évoquer plus étroitement la royauté.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: sur les œuvres de tes mains
  rationale: Avec משל, la préposition בְּ marque ce sur quoi s’exerce l’autorité. Cette formulation conserve l’image concrète des mains de Dieu.
- source_word: כֹּל
  choice: tout
  rationale: Employé absolument dans ce contexte, כֹּל désigne l’ensemble de ce qui est placé sous l’autorité humaine. « Tout » est concis et idiomatique.
- source_word: שַׁתָּה
  choice: tu as placé
  rationale: Le verbe שׁית signifie mettre, placer ou établir. « Placer » rend directement l’action tout en convenant au registre poétique.
- source_word: תַחַת רַגְלָיו
  choice: sous ses pieds
  rationale: La traduction littérale préserve l’image hébraïque de la soumission et de l’autorité.
theological_decisions:
- issue: Masculin singulier représentant l’humanité dans le Psaume 8
  choice: Conserver « lui » et « ses » au masculin singulier
  alternative: 'Employer un pluriel inclusif : « leur » et « leurs pieds »'
  rationale: L’hébreu poursuit les formes masculines singulières du verset précédent, où l’être humain est envisagé de manière représentative. La note explicite cette portée sans modifier la grammaire du texte.
- issue: Expression de l’autorité confiée à l’être humain
  choice: « Tu lui as donné autorité »
  alternative: « Tu l’as fait régner »
  rationale: Le hifil de משל indique que Dieu établit l’être humain pour exercer une autorité sur ses œuvres. La formulation choisie maintient cette causalité sans préciser davantage la nature de cette autorité.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme du verset et l’image concrète des mains et des pieds.
