  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: fr
  text: 'De la bouche des tout-petits et des nourrissons,

    tu as établi la force[a] face à tes adversaires,

    afin de réduire au silence l’ennemi et le vengeur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une louange », selon la tradition de la Septante reprise en Matthieu 21.16 ; le texte hébreu porte « force ».
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: De la bouche de
  rationale: La construction מן + פה signifie « de/hors de la bouche de ». Le singulier collectif se conserve naturellement en français.
- source_word: עוֹלְלִים
  choice: tout-petits
  rationale: Le terme désigne de très jeunes enfants. « Tout-petits » est actuel, clair et se distingue du terme suivant.
- source_word: יֹנְקִים
  choice: nourrissons
  rationale: Le participe désigne ceux qui tètent. « Nourrissons » exprime naturellement cette réalité en français moderne.
- source_word: יִסַּדְתָּ
  choice: tu as établi
  rationale: Le verbe signifie fonder ou établir. « Établi » garde l’idée d’une action fermement accomplie sans ajouter d’image absente du texte.
- source_word: עֹז
  choice: une force
  rationale: Le sens usuel du mot hébreu est « force, puissance ». L’article indéfini produit ici une formulation française naturelle sans transformer cette force en attribut possessif explicite de Dieu.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Dans ce contexte, la locution relie l’action divine à l’opposition des adversaires et peut exprimer le motif ou la visée. « À cause de » préserve ce rapport sans le préciser excessivement.
- source_word: צוֹרְרֶיךָ
  choice: tes adversaires
  rationale: Le participe substantivé désigne ceux qui se montrent hostiles. « Adversaires » est naturel et évite de répéter « ennemi ».
- source_word: לְהַשְׁבִּית
  choice: afin de réduire au silence
  rationale: La forme causative signifie « faire cesser ». Dans le contexte de la bouche et de l’opposition hostile, « réduire au silence » rend bien l’effet visé tout en restant idiomatique.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier défini fonctionne comme une désignation représentative et correspond au parallélisme du vers.
- source_word: מִתְנַקֵּם
  choice: le vengeur
  rationale: Le participe désigne celui qui exerce ou recherche la vengeance. « Le vengeur » est concis et conserve la force nominale de l’hébreu.
theological_decisions:
- issue: עֹז dans le texte hébreu face à « louange » dans la tradition grecque reprise en Matthieu 21.16
  choice: Traduire עֹז par « une force » dans le texte principal.
  alternative: « une louange »
  rationale: Le texte massorétique porte clairement « force, puissance ». La priorité donnée à la source hébraïque exige de conserver ce sens dans le texte principal, tandis que la lecture grecque, importante pour le lien intertextuel avec Matthieu 21.16, est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme poétique, l’adresse directe à Dieu et l’ambiguïté fonctionnelle de לְמַעַן sans harmoniser le texte hébreu avec la tradition grecque.
