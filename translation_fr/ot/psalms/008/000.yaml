source:
  edition: WLC
  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/גִּתִּ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/000.yaml
  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: fr
  text: Pour le directeur de la musique ; selon la Gittith[a]. Psaume de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terme hébreu dont le sens est incertain ; il s’agit probablement d’une indication musicale ou liturgique, peut-être du nom d’un air ou d’un instrument.
    reason: cultural_note
  - marker: b
    text: Ou « par David » ou « pour David ». L’expression hébraïque peut indiquer l’auteur ou une autre forme de rapport avec David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Pour le directeur de la musique
  rationale: Dans les titres des psaumes, ce terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. Cette formulation est claire en français moderne sans limiter la fonction à un chœur.
- source_word: עַל
  choice: selon
  rationale: Dans une indication musicale, la préposition peut introduire un air, un instrument ou une autre modalité d’exécution. « Selon » conserve ce rapport sans préciser ce que la Gittith désigne.
- source_word: הַגִּתִּית
  choice: la Gittith
  rationale: Le sens exact du terme est incertain. La translittération évite de choisir arbitrairement entre un instrument, un air ou une autre indication musicale, tout en conservant l’article hébreu.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est le terme français établi et précis pour cette désignation de genre.
- source_word: לְדָוִד
  choice: de David
  rationale: La construction hébraïque peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » en conserve naturellement l’ambiguïté.
theological_decisions:
- issue: Rapport entre David et le psaume exprimé par לְדָוִד
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu ne définit pas avec certitude la nature exacte de ce rapport. La traduction ne tranche donc pas la question de l’auteur au-delà de ce que dit le titre.
translation_notes:
  register: Français international moderne, sobre et digne. « Directeur de la musique » est plus immédiatement compréhensible que « maître de chant » et n’impose pas l’idée précise d’un chœur. Le point-virgule relie les deux indications d’exécution, tandis que la phrase suivante distingue le genre et le rattachement à David.
