id: PSA.8.9
reference: Psalms 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֥ה אֲדֹנֵ֑י/נוּ מָֽה אַדִּ֥יר שִׁ֝מְ/ךָ֗ בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/009.yaml
  text: O Yahweh[a], our Lord[b], how majestic is your name in all the earth!
translation:
  language: fr
  text: Yahweh[a], notre Seigneur, que ton nom est majestueux sur toute la terre !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu en français par « l’Éternel » ou « le SEIGNEUR » ; ici translittéré « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin YHWH afin de le distinguer du titre אֲדֹנֵינוּ qui suit et de préserver l'adresse directe du texte hébreu.
- source_word: אֲדֹנֵינוּ
  choice: notre Seigneur
  rationale: Rend le titre divin exprimant l'autorité et la souveraineté ; « notre Maître » reste possible, mais convient moins naturellement à cette adresse liturgique en français.
- source_word: מָה אַדִּיר
  choice: que … est majestueux
  rationale: La tournure exclamative française rend naturellement מָה suivi de l'adjectif ; « majestueux » exprime la grandeur imposante suggérée par אַדִּיר.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Conserve l'expression hébraïque sans réduire le nom à la seule réputation ni en expliciter excessivement la portée théologique.
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: Dans la portée cosmique du psaume, הָאָרֶץ désigne la terre entière ; « sur toute la terre » est idiomatique en français.
theological_decisions:
- issue: Séquence du nom divin et du titre יְהוָה אֲדֹנֵינוּ
  choice: Yahweh, notre Seigneur
  alternative: L’Éternel, notre Seigneur
  rationale: La translittération préserve le nom divin distinct du titre « Seigneur ». La forme traditionnelle française « l’Éternel » est possible, mais interprète le nom plutôt qu'elle ne le représente directement.
- issue: Portée de « ton nom »
  choice: Conserver littéralement « ton nom »
  alternative: ta renommée / ta gloire révélée
  rationale: Le nom peut évoquer la réputation, l'honneur et la manifestation de Dieu, mais le texte ne force pas une seule de ces nuances ; la formulation littérale préserve cette richesse.
translation_notes:
  register: Français international moderne, solennel et naturel. L'exclamation conserve la force poétique du verset et l'écho de Psaumes 8.2. Le tutoiement correspond à l'adresse directe singulière du suffixe hébreu.
