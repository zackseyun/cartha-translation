  source_fidelity: 'Le texte principal rend fidèlement l’image : Dieu tire une flèche contre eux, et le résultat est soudain. « Les voilà blessés » exprime naturellement en français le prédicat nominal hébreu הָיוּ מַכּוֹתָם, sans en atténuer la violence poétique. En revanche, la note actuelle introduit « paraissent », qui ne rend pas הָיוּ, et déplace indûment « soudain » vers le premier membre malgré la division massorétique après פִּתְאֹם.'
