source:
  edition: WLC
  text: וַ/יֹּרֵ֗/ם אֱלֹ֫הִ֥ים חֵ֥ץ פִּתְא֑וֹם הָ֝י֗וּ מַכּוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/007.yaml
  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: fr
  text: Mais Dieu leur décoche une flèche[a] ; soudain, les voilà blessés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Mais Dieu leur tire une flèche ; soudain, leurs blessures surviennent. »'
    reason: Cette formulation conserve le nom « leurs blessures » et rend plus explicitement la structure résultative de l’hébreu.
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: leur décoche
  rationale: Le verbe ירה au hiphil avec suffixe de 3e personne du pluriel décrit Dieu tirant sur eux. « Leur décoche » restitue naturellement en français l’action vive de lancer une flèche contre les méchants, dans un présent de narration poétique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, אֱלֹהִים désigne au singulier le Dieu d’Israël.
- source_word: חֵץ
  choice: une flèche
  rationale: Sens lexical direct de חֵץ ; l’article indéfini convient à l’expression française « décocher une flèche ».
- source_word: פִּתְאֹם
  choice: soudain
  rationale: L’adverbe exprime le caractère brusque et inattendu du jugement. Sa position peut se rattacher soit au tir, soit au résultat ; la traduction principale suit le découpage qui l’associe à la blessure, tandis que la note signale l’autre possibilité.
- source_word: הָיוּ מַכּוֹתָם
  choice: les voilà blessés
  rationale: Littéralement, la formulation nominale évoque « leurs blessures » qui sont ou surviennent. « Les voilà blessés » rend avec concision et naturel le résultat soudain, sans atténuer l’image.
theological_decisions:
- issue: Dieu comme auteur du jugement figuré par le tir d’une flèche
  choice: 'Conserver Dieu comme sujet actif : « Dieu leur décoche une flèche »'
  alternative: Présenter l’événement comme un simple retournement providentiel ou impersonnel
  rationale: Le texte hébreu attribue directement l’action à Dieu. La traduction maintient cette image de jugement sans la développer au-delà du verset.
- issue: Rattachement syntaxique de « soudain »
  choice: 'Le rattacher dans le texte principal au résultat : « soudain, les voilà blessés »'
  alternative: 'Le rattacher au tir : « Dieu les frappe soudain d’une flèche »'
  rationale: La poésie permet les deux lectures. Le texte principal suit une articulation française naturelle et traditionnelle, tandis que la note préserve l’autre analyse favorisée par l’accentuation massorétique.
translation_notes:
  register: Français moderne, courant et digne. « Décocher une flèche » garde la force de l’image poétique ; « les voilà blessés » exprime vivement son résultat sans lourdeur littérale.
