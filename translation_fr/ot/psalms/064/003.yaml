  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: fr
  text: eux qui aiguisent leur langue comme une épée, qui bandent leur arc, leur flèche — une parole amère —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: aiguisent
  rationale: Rend directement l’image d’une langue affûtée comme une arme.
- source_word: דָּרְכוּ
  choice: bandent leur arc
  rationale: Le verbe décrit l’action de tendre ou bander l’arc; l’arc est sous-entendu dans l’hébreu, tandis que «leur flèche» est le complément exprimé.
- source_word: דָּבָר מָר
  choice: une parole amère
  rationale: Conserve l’apposition métaphorique qui identifie la flèche à une parole blessante.
theological_decisions:
- issue: Rapport entre la flèche et la parole amère
  choice: Maintenir l’apposition au moyen de tirets
  alternative: 'Expliciter: «leur flèche qu’est une parole amère»'
  rationale: La syntaxe hébraïque est concise et métaphorique; les tirets préservent cette densité sans imposer une relation grammaticale plus explicite.
translation_notes:
  register: Français moderne, naturel et digne. Le début relatif «eux qui» maintient la dépendance syntaxique envers le verset précédent. «Bander leur arc» est l’expression française idiomatique pour préparer le tir, avec «pour lancer» ajouté afin de clarifier naturellement le rôle de la flèche.
