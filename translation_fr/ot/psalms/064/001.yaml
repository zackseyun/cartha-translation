  text: שְׁמַע אֱלֹהִ֣ים קוֹלִ֣/י בְ/שִׂיחִ֑/י מִ/פַּ֥חַד א֝וֹיֵ֗ב תִּצֹּ֥ר חַיָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/001.yaml
  text: Hear[a], O God, my voice in my complaint; preserve my life from the fear of the enemy.
translation:
  language: fr
  text: Écoute, ô Dieu, ma voix dans ma plainte[a] ; préserve ma vie de la crainte de l’ennemi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma méditation » ou « dans ma réflexion ». Le terme hébreu peut désigner aussi bien une réflexion intérieure qu’une plainte exprimée.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: Impératif adressé directement à Dieu ; « Écoute » est naturel dans une prière et rend l’appel pressant du psalmiste.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé comme vocatif. « ô Dieu » conserve le caractère solennel de l’adresse directe.
- source_word: קוֹלִי
  choice: ma voix
  rationale: Rend concrètement קוֹלִי sans le réduire à « moi » ou à « ma prière ».
- source_word: בְשִׂיחִי
  choice: dans ma plainte
  rationale: Le terme peut désigner une plainte, une méditation ou un murmure intérieur. Le contexte de supplication face à l’ennemi favorise ici « plainte », tandis qu’une note maintient l’ambiguïté.
- source_word: מִפַּחַד
  choice: de la terreur de
  rationale: פַּחַד exprime une peur intense ou une terreur. Cette formulation conserve aussi l’ambiguïté possible entre la peur éprouvée devant l’ennemi et la menace qu’il inspire.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Préserve le singulier hébreu, qui peut être individuel, générique ou collectif dans la poésie.
- source_word: תִּצֹּר
  choice: préserve
  rationale: Le verbe נצר signifie garder, protéger ou préserver ; avec « ma vie », « préserve » convient au registre de la prière.
- source_word: חַיָּי
  choice: ma vie
  rationale: Équivalent français naturel du pluriel morphologique hébreu employé au sens de la vie de la personne, sans introduire la notion plus interprétative d’« âme ».
theological_decisions:
- issue: Sens de בְשִׂיחִי dans cette lamentation
  choice: dans ma plainte
  alternative: dans ma méditation ; dans mon murmure
  rationale: Le contexte hostile soutient le sens de plainte, mais le champ lexical inclut également la réflexion intérieure. La note conserve cette réelle ambiguïté.
- issue: Rapport exprimé par מִפַּחַד אוֹיֵב
  choice: de la terreur de l’ennemi
  alternative: de la peur de l’ennemi ; loin de la menace de l’ennemi
  rationale: La construction peut évoquer la peur ressentie à cause de l’ennemi ou la terreur qu’il inspire. Une formulation proche de l’hébreu évite de trancher davantage que le texte.
translation_notes:
  register: Français international moderne, digne et directement intelligible. La syntaxe poétique conserve « ma voix » et le vocatif « ô Dieu » ; le point-virgule articule les deux demandes sans les dissocier.
