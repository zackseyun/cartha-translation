- from: Écoute, ô Dieu, ma voix dans ma plainte[a] ; préserve ma vie de la terreur de l’ennemi.
  to: Écoute, ô Dieu, ma voix dans ma plainte[a] ; préserve ma vie de la crainte de l’ennemi.
  rationale: La révision remplace « terreur » par « crainte », équivalent français plus sobre et plus englobant de פַּחַד, sans décider si l’expression vise la peur ressentie face à l’ennemi ou la peur suscitée par lui. La note est ajustée afin de mieux représenter les sens méditatifs de שִׂיחַ tout en conservant « plainte » comme rendu contextuel principal.
