id: PSA.64.9
reference: Psalms 64:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽירְא֗וּ כָּל אָ֫דָ֥ם וַ֭/יַּגִּידוּ פֹּ֥עַל אֱלֹהִ֗ים וּֽ/מַעֲשֵׂ֥/הוּ הִשְׂכִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/009.yaml
  text: Then all mankind will fear[a], and they will declare the work of God; they will understand what he has done.
translation:
  language: fr
  text: Alors tous les humains[a] craindront ; ils proclameront l’œuvre de Dieu et comprendront ce qu’il a fait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout être humain ». L’hébreu emploie ici « tout adam », expression collective désignant l’humanité.
    reason: Préciser la valeur collective et générique du terme hébreu אָדָם.
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: craindront
  rationale: Le verbe ירא peut exprimer aussi bien la peur que la crainte révérencielle. « Craindront » conserve cette amplitude dans le contexte de l’intervention divine.
- source_word: כָּל אָדָם
  choice: tous les humains
  rationale: אָדָם est ici un collectif générique désignant l’ensemble des êtres humains, et non exclusivement les hommes de sexe masculin.
- source_word: וַיַּגִּידוּ
  choice: ils proclameront
  rationale: Le hifil de נגד signifie faire connaître, raconter ou déclarer. « Proclameront » rend ici la dimension publique du témoignage.
- source_word: פֹּעַל אֱלֹהִים
  choice: l’œuvre de Dieu
  rationale: פֹּעַל désigne une œuvre, une action ou un acte. « L’œuvre de Dieu » reste ample et naturel sans préciser davantage la nature de l’intervention.
- source_word: וּמַעֲשֵׂהוּ
  choice: ce qu’il a fait
  rationale: Littéralement « son œuvre » ou « son acte ». Cette formulation évite une répétition pesante tout en gardant la référence concrète à l’action de Dieu.
- source_word: הִשְׂכִּילוּ
  choice: comprendront
  rationale: Le hifil de שׂכל peut signifier comprendre, discerner ou considérer avec attention. Avec l’action de Dieu pour objet, « comprendront » exprime clairement l’acquisition du discernement.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: tous les humains
  alternative: tout être humain
  rationale: Le singulier hébreu a une valeur collective et vise l’humanité en général. La traduction ne restreint donc pas le référent aux seuls hommes.
- issue: Nuance de la crainte exprimée par ירא
  choice: craindront
  alternative: seront saisis de peur
  rationale: Le contexte du jugement peut évoquer l’effroi, mais le verbe peut aussi porter une nuance de respect révérenciel. « Craindront » préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. Le futur suit la progression du contexte et la lecture prospective du texte de consultation, tandis que « craindront » conserve l’ambivalence entre effroi et crainte révérencielle.
