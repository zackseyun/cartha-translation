  text: תַּ֭סְתִּירֵ/נִי מִ/סּ֣וֹד מְרֵעִ֑ים מֵ֝/רִגְשַׁ֗ת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/002.yaml
  text: Hide me from the secret counsel of evildoers[b][a], from the tumult of workers of wickedness.
translation:
  language: fr
  text: Cache-moi loin du conseil secret des malfaiteurs[a], loin de l’agitation de ceux qui font le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loin du complot secret des malfaiteurs ». Le mot hébreu סוֹד peut désigner une concertation confidentielle, un cercle intime ou un projet secret.
    reason: lexical_alternative
  - marker: b
    text: Ou « loin du tumulte de ceux qui font le mal ». Le mot hébreu רִגְשָׁה évoque une agitation, une commotion ou un rassemblement hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵנִי
  choice: Cache-moi
  rationale: Le hiphil de סתר avec suffixe de première personne signifie « cache-moi » ou « dissimule-moi ». Dans cette prière, la forme imperfective exprime naturellement une demande directe.
- source_word: מִסּוֹד
  choice: loin des complots secrets
  rationale: סוֹד peut désigner un conseil confidentiel, un cercle intime ou une délibération secrète. Avec des malfaiteurs comme complément, « complots secrets » rend clairement la dimension clandestine et hostile, sans exclure l’idée d’une concertation.
- source_word: מְרֵעִים
  choice: des malfaiteurs
  rationale: Le participe de רעע désigne ceux qui font le mal. « Malfaiteurs » est concis, courant et conserve l’idée d’agents actifs.
- source_word: מֵרִגְשַׁת
  choice: loin de l’agitation
  rationale: רִגְשָׁה évoque une agitation collective, une commotion ou un tumulte hostile. « Agitation » reste naturel en français moderne tout en préservant l’ambiguïté entre mouvement de foule et effervescence menaçante.
- source_word: פֹּעֲלֵי אָוֶן
  choice: de ceux qui font le mal
  rationale: La locution désigne littéralement ceux qui accomplissent אָוֶן, terme associé au mal, à l’iniquité ou aux actes nuisibles. Cette formulation accessible conserve la valeur active du participe.
theological_decisions: []
