  text: יְחַזְּקוּ לָ֨/מוֹ דָּ֘בָ֤ר רָ֗ע יְֽ֭סַפְּרוּ לִ/טְמ֣וֹן מוֹקְשִׁ֑ים אָ֝מְר֗וּ מִ֣י יִרְאֶה לָּֽ/מוֹ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/005.yaml
  text: They strengthen for themselves an evil matter[a]; they talk of hiding snares; they say[b], “Who will see them?”
translation:
  language: fr
  text: 'Ils renforcent leur mauvais dessein[a] ;

    ils parlent de dissimuler des pièges.

    Ils disent : « Qui les verra[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut aussi se rendre par « une mauvaise affaire », « un projet mauvais » ou « un complot malveillant » ; le mot traduit par « dessein » peut signifier « parole », « chose » ou « affaire ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon une interprétation du propos des comploteurs : « Qui nous verra ? » Toutefois, la forme hébraïque est à la troisième personne du pluriel : « les » ou « eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְחַזְּקוּ לָמוֹ
  choice: Ils s’affermissent
  rationale: Le piel de חזק exprime l’idée de rendre ferme ou fort. Avec לָמוֹ, la tournure française pronominale restitue naturellement l’action exercée en leur propre faveur, sans alourdir le vers.
- source_word: דָּבָר רָע
  choice: dans un mauvais dessein
  rationale: דבר peut désigner une parole, une affaire ou une chose. Le contexte de complot et de pièges favorise ici « dessein », tout en laissant la note signaler l’étendue sémantique du terme.
- source_word: יְסַפְּרוּ
  choice: ils parlent de
  rationale: Le piel de ספר signifie notamment raconter ou exposer. Avec l’infinitif qui suit, « parler de » rend sobrement leur concertation.
- source_word: לִטְמוֹן מוֹקְשִׁים
  choice: de dissimuler des pièges
  rationale: טמן signifie cacher ou enfouir, et מוקשים désigne des pièges ou des traquenards. « Dissimuler des pièges » conserve directement l’image hébraïque.
- source_word: אָמְרוּ
  choice: Ils disent
  rationale: Bien que la forme soit un qatal, le tableau poétique décrit leur conduite et leur discours de manière actuelle ; le présent convient à la séquence française.
- source_word: מִי יִרְאֶה לָּמוֹ
  choice: Qui les verra ?
  rationale: Le suffixe de לָמוֹ est à la troisième personne du pluriel. « Les » en respecte la forme tout en conservant l’antécédent implicite ou comprimé de la poésie hébraïque.
theological_decisions:
- issue: Référent de לָמוֹ dans la question finale
  choice: 'Traduction littérale à la troisième personne du pluriel : « les »'
  alternative: « Qui nous verra ? »
  rationale: La lecture à la première personne rendrait explicite que les comploteurs parlent d’eux-mêmes, mais la forme massorétique est à la troisième personne. Le texte principal préserve donc cette tension, et la variante interprétative est donnée en note.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme poétique est conservé en trois lignes. « S’affermissent » garde la force du verbe hébreu tout en évitant une construction française artificielle ; « dessein » rend le contexte conspirateur sans réduire silencieusement l’éventail de דבר, documenté en note.
