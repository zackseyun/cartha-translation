lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. « Au chef de chœur » est une formulation française claire, naturelle et consacrée dans ce contexte.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Ce nom désigne ici un chant à caractère musical et constitue le terme générique habituel des titres du Psautier. « Psaume » en est l’équivalent français établi.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette latitude que « écrit par David ».
theological_decisions:
- issue: Portée de l’attribution davidique dans le titre
  choice: de David
  alternative: par David ; pour David
  rationale: La construction hébraïque ne précise pas à elle seule s’il s’agit de l’auteur, d’une association ou d’une dédicace. La traduction retenue et la note préservent cette ambiguïté réelle.
translation_notes:
  register: Français moderne, sobre et digne. La formulation brève respecte le caractère de titre liturgique du texte hébreu.
