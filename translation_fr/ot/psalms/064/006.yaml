  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: fr
  text: 'Ils recherchent des injustices : « Nous avons mené à bien une recherche minutieuse. » Le for intérieur de l’homme et son cœur sont profonds[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu difficile. Littéralement, la phrase reprend le vocabulaire de la recherche : « Nous avons achevé une recherche bien recherchée ». On peut aussi y voir l’idée d’un plan soigneusement élaboré.'
    reason: La formule תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ est condensée et son analyse syntaxique demeure discutée. La note conserve le jeu de mots du texte tout en signalant l’interprétation d’un complot élaboré.
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Ils recherchent des projets injustes
  rationale: Le verbe évoque une recherche minutieuse, et עוֹלֹת désigne ici des actes ou desseins injustes. « Projets injustes » rend naturellement le contexte de complot sans réduire le terme à une seule sorte de méfait.
- source_word: תַּמְנוּ חֵפֶשׂ מְחֻפָּשׂ
  choice: Nous avons mis au point un plan soigneusement dissimulé
  rationale: La formulation hébraïque est condensée et difficile. « Mis au point » rend l’idée d’achèvement portée par תַּמְנוּ, tandis que « soigneusement dissimulé » exprime le jeu sur la racine חפש dans le contexte d’une intrigue secrète.
- source_word: קֶרֶב אִישׁ וְלֵב עָמֹק
  choice: Le for intérieur de chacun, comme son cœur, est profond
  rationale: « For intérieur » rend קֶרֶב lorsqu’il désigne la vie intérieure; « chacun » donne au singulier אִישׁ sa portée générale. Le singulier « est profond » traite l’intérieur et le cœur comme deux expressions étroitement parallèles de la même profondeur cachée.
theological_decisions:
- issue: Profondeur du cœur humain
  choice: Conserver l’affirmation sobre selon laquelle l’être intérieur humain est profond
  alternative: Interpréter explicitement cette profondeur comme une dépravation totale ou comme une intelligence exceptionnelle
  rationale: Le verset souligne le caractère insondable et caché des desseins humains dans ce contexte, sans formuler ici une doctrine plus précise sur la nature humaine.
translation_notes:
  register: Français international moderne, digne et accessible. « For intérieur » conserve la densité poétique du parallélisme tout en restant idiomatique; la citation directe suit la vocalisation massorétique de תַּמְנוּ à la première personne du pluriel.
