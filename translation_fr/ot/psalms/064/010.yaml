  text: יִשְׂמַ֬ח צַדִּ֣יק בַּ֭/יהוָה וְ/חָ֣סָה ב֑/וֹ וְ֝/יִתְהַֽלְל֗וּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/010.yaml
  text: The righteous will rejoice in Yahweh and take refuge in him[a], and all the upright in heart will glory.
translation:
  language: fr
  text: Le juste se réjouira en Yahweh et trouvera refuge en lui ; tous ceux dont le cœur est droit se glorifieront[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « exulteront » ou « en tireront fierté ». Le verbe hébreu peut exprimer le fait de se glorifier, de se vanter ou d’exulter ; ici, le contexte lui donne un sens positif lié à Dieu et à son intervention.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: se réjouira
  rationale: L’imparfait hébreu présente ici l’issue attendue après l’intervention de Dieu. Le futur français convient au contexte poétique et garde le sens de joie.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier est employé comme substantif et représente ici la personne juste, sans qu’il soit nécessaire d’ajouter « homme ».
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition désigne celui en qui le juste se réjouit. Le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans l’hébreu.
- source_word: וְחָסָה בּוֹ
  choice: et trouvera refuge en lui
  rationale: Le verbe חסה exprime le fait de chercher ou de trouver protection auprès de quelqu’un. Cette formulation française conserve l’image du refuge et s’accorde naturellement avec le futur du premier verbe.
- source_word: וְיִתְהַלְלוּ
  choice: s’en glorifieront
  rationale: Le hitpael de הלל peut exprimer le fait de se glorifier, de tirer fierté ou d’exulter. « S’en glorifieront » conserve la nuance positive dans ce contexte et laisse le motif implicite, comme en hébreu.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: tous ceux dont le cœur est droit
  rationale: Cette tournure naturelle en français préserve l’image hébraïque du cœur droit, qui désigne une disposition intérieure intègre.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La transcription « Yahweh » conserve le caractère de nom propre sans substituer un titre.
- issue: Objet implicite de וְיִתְהַלְלוּ
  choice: s’en glorifieront
  alternative: exulteront
  rationale: L’hébreu n’énonce pas d’objet explicite. Le pronom « en » renvoie naturellement à Yahweh ou à son intervention salvatrice sans trancher davantage cette relation implicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, avec un point-virgule entre les deux membres. Le marqueur de note est placé après le terme auquel porte l’alternative lexicale.
