review_pass:
  verdict: revise
  source_fidelity: 'La première proposition française (« Ils trébuchent ») efface la valeur causative du hifil de כשל. La construction hébraïque est effectivement difficile : le verbe porte un sujet pluriel et un suffixe singulier, tandis que les pronoms des segments suivants sont pluriels. Une formulation passive/impersonnelle française rend le sens contextuel sans prétendre résoudre cette difficulté. La seconde proposition doit conserver plus directement l’idée que leur langue est « contre eux », plutôt que d’expliciter « se retourne contre eux ».'
  naturalness: « On les fait trébucher » est naturel en français actuel et laisse l’agent non identifié. « Leur propre langue est contre eux » est sobre, intelligible et conserve la concision poétique. « Hocher la tête » est l’expression française idiomatique pour la réaction visible retenue ici.
  terminology: « Langue » préserve l’image concrète de לְשׁוֹנָם et son emploi collectif pour la parole. « Leur propre » restitue l’accent possessif du sens contextuel sans alourdir le verset. La note doit indiquer avec exactitude la forme littérale plurielle « ils le font trébucher », non un sujet singulier « il ».
  issues:
  - severity: medium
    issue: La valeur causative du premier verbe est perdue.
    rationale: וַיַּכְשִׁילוּהוּ est un hifil de כשל (« faire trébucher »), non le simple intransitif « trébucher ». La difficulté des pronoms ne justifie pas la suppression de la causalité.
  - severity: medium
    issue: La note a donne une paraphrase littérale morphologiquement inexacte.
    rationale: Le verbe hébreu est à la 3e personne du pluriel avec suffixe objet masculin singulier ; « Il le fait trébucher » ne rend pas cette morphologie. Il convient aussi de ne pas présenter « sur eux » comme la seule valeur possible de עליהם.
  - severity: low
    issue: « Se retourne contre eux » explicite davantage que le texte.
    rationale: Le texte juxtapose la langue et « contre eux » dans une syntaxe disputée. « Leur propre langue est contre eux » reproduit plus sobrement la relation hostile retenue par le texte anglais d’audit.
  - severity: low
    issue: La note b peut mieux refléter les alternatives lexicales de נוד.
    rationale: Outre le geste de tête, le verbe peut évoquer une agitation, un frémissement ou un éloignement ; « chanceler » est moins adapté comme alternative dans cette scène de témoins.
  revised_text: On les fait trébucher[a] ; leur propre langue est contre eux ; tous ceux qui les voient hochent la tête[b].
