  text: וַ/יַּכְשִׁיל֣וּ/הוּ עָלֵ֣י/מוֹ לְשׁוֹנָ֑/ם יִ֝תְנֹדֲד֗וּ כָּל רֹ֥אֵה בָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: fr
  text: On les fait trébucher[a] ; leur propre langue est contre eux ; tous ceux qui les voient hochent la tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, la proposition pourrait se rendre : « Ils le font trébucher contre eux » ou « sur eux ». La syntaxe hébraïque est difficile, et le rapport entre les pronoms est incertain. Le texte principal exprime l’idée que les méchants sont perdus par leurs propres paroles.'
    reason: alternative_reading
  - marker: b
    text: Le verbe peut aussi évoquer le fait de s’agiter, de frémir ou de s’éloigner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: Ils trébuchent
  rationale: Le hifil de כשׁל signifie normalement « faire trébucher/tomber », mais le suffixe masculin singulier et son rapport avec les autres pronoms rendent la syntaxe difficile. Le texte principal exprime prudemment l’idée contextuelle de la chute des méchants, sans préciser un agent absent du verset.
- source_word: עָלֵימוֹ לְשׁוֹנָם
  choice: leur propre langue se retourne contre eux
  rationale: Cette formulation conserve le sens concret de « langue » et rend naturellement la valeur hostile possible de על, tout en exprimant que leurs paroles contribuent à leur perte.
- source_word: יִתְנֹדֲדוּ
  choice: secouent la tête
  rationale: נוד peut évoquer un mouvement de tête, un frémissement ou l’éloignement. Devant « tous ceux qui les voient », le geste visible de réaction est contextuellement naturel.
- source_word: כָּל רֹאֵה בָם
  choice: tous ceux qui les voient
  rationale: Traduction directe du participe avec כָּל, qui maintient la portée universelle et le pronom pluriel.
theological_decisions:
- issue: Qui ou quoi provoque la chute dans la première proposition ?
  choice: Le texte principal laisse l’agent implicite et rattache contextuellement la chute à leur propre langue.
  alternative: « Sa langue le fait trébucher sur eux » ou « On les fait trébucher ».
  rationale: La syntaxe hébraïque et les pronoms sont difficiles. Il convient de préserver cette incertitude plutôt que d’identifier dogmatiquement l’agent.
translation_notes:
  register: Français international actuel, sobre et digne. « Se retourne contre eux » rend idiomatiquement l’image d’une parole qui accable ses auteurs. Les deux marqueurs de note sont placés auprès des éléments qu’ils expliquent.
