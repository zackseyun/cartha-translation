revisions:
- from: Ils trébuchent[a] ; leur propre langue se retourne contre eux ; tous ceux qui les voient secouent la tête[b].
  to: On les fait trébucher[a] ; leur propre langue est contre eux ; tous ceux qui les voient hochent la tête[b].
  rationale: La révision rétablit la causalité du premier verbe tout en conservant l’incertitude syntaxique dans une note exacte. Elle rend plus littéralement la relation de la « langue » aux méchants et emploie des tournures françaises modernes et naturelles. Les deux ancres de note restent placées sur les expressions qu’elles éclairent.
