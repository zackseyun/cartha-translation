source:
  edition: WLC
  text: לִ/יר֣וֹת בַּ/מִּסְתָּרִ֣ים תָּ֑ם פִּתְאֹ֥ם יֹ֝רֻ֗/הוּ וְ/לֹ֣א יִירָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/004.yaml
  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: fr
  text: pour tirer, depuis des lieux cachés, sur l’homme intègre[a] ; soudain, ils tirent sur lui et ne craignent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur l’innocent ». Le terme hébreu peut évoquer aussi bien l’intégrité morale que l’innocence.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: tirer
  rationale: Dans ce contexte d’attaque, ירה désigne naturellement le fait de tirer un projectile. Le complément « des flèches » reste implicite dans l’hébreu et n’est donc pas ajouté.
- source_word: בַּמִּסְתָּרִים
  choice: depuis leurs cachettes
  rationale: Le nom désigne des lieux cachés. Bien que la préposition signifie littéralement « dans », « depuis leurs cachettes » exprime naturellement en français la position dissimulée d’où part le tir.
- source_word: תָּם
  choice: l’homme intègre
  rationale: Le singulier hébreu désigne ici une personne caractérisée par son intégrité ou son innocence. « L’homme intègre » conserve la valeur morale et permet au pronom singulier suivant de rester clair.
- source_word: פִּתְאֹם
  choice: soudain
  rationale: Rendu adverbial courant qui exprime le caractère brusque de l’attaque.
- source_word: יֹרֻהוּ
  choice: ils tirent sur lui
  rationale: Le suffixe masculin singulier reprend תָּם. « Tirer sur lui » est idiomatique et ne précise ni le projectile ni l’issue du tir.
- source_word: וְלֹא יִירָאוּ
  choice: et ne craignent rien
  rationale: Cette formulation française naturelle conserve l’idée d’absence de crainte, sans introduire un objet précis tel que Dieu ou les hommes.
theological_decisions:
- issue: Objet implicite de la crainte
  choice: ne craignent rien
  alternative: n’ont pas peur
  rationale: L’hébreu ne précise pas qui ou quoi ils ne craignent pas. La traduction maintient cette indétermination sans lui donner explicitement un objet théologique.
translation_notes:
  register: Français moderne, courant et digne. L’image de l’embuscade est rendue sans ajouter explicitement les flèches. Le singulier représentant la victime est conservé, et l’ambiguïté de la dernière proposition est signalée en note.
