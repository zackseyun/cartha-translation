  text: אֶשְׁפֹּ֣ךְ לְ/פָנָ֣י/ו שִׂיחִ֑/י צָ֝רָתִ֗/י לְ/פָנָ֥י/ו אַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/002.yaml
  text: I pour out my complaint before him[b][a]; I declare my distress before him.
translation:
  language: fr
  text: Je répands devant lui ma plainte[a] ; je déclare devant lui ma détresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma méditation » ou « mes pensées ». Le mot hébreu peut désigner une réflexion intérieure ou une plainte exprimée ; le contexte de lamentation favorise ici « plainte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon épreuve » ou « mon malheur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: Je répands
  rationale: Le verbe שׁפך signifie couramment « répandre, verser ». Dans le contexte de la prière, « répandre sa plainte » conserve l’image hébraïque tout en étant idiomatique en français.
- source_word: לְפָנָיו
  choice: devant lui / lui
  rationale: L’expression signifie littéralement « devant sa face, en sa présence ». La première occurrence est rendue explicitement par « devant lui » ; dans le second membre, « lui » exprime naturellement le même destinataire sans alourdir la phrase française.
- source_word: שִׂיחִי
  choice: ma plainte
  rationale: שׂיח peut désigner une méditation, un discours intérieur ou une plainte. Son parallélisme avec « ma détresse » dans ce psaume de lamentation favorise ici « ma plainte ».
- source_word: צָרָתִי
  choice: ma détresse
  rationale: צָרָה désigne la détresse, l’épreuve ou le malheur. « Détresse » garde à la fois la force émotionnelle et l’étendue du terme.
- source_word: אַגִּיד
  choice: j’expose
  rationale: Le hiphil de נגד signifie « faire connaître, déclarer, raconter ». « J’expose » convient à l’action de présenter sa détresse à Dieu et reste naturel en français actuel.
theological_decisions: []
