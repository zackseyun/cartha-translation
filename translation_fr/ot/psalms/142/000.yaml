  text: A Maskil[a] of David[b], when he was in the cave. A prayer.
translation:
  language: fr
  text: Maskil[a] de David[b], lorsqu’il était dans la grotte. Prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu maskil, terme technique employé dans les titres de psaumes; il peut désigner une composition méditative ou instructive.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour David » ou « par David »; dans ce titre, l’hébreu peut indiquer l’auteur, la dédicace ou une association.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Méditation
  rationale: Ce terme technique des titres de psaumes a un sens précis incertain. « Méditation » offre en français un intitulé naturel et plausible, tout en signalant en note que d’autres valeurs sont possibles.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut exprimer ici l’auteur, l’attribution, la dédicace ou l’association. « De David » reste idiomatique et préserve mieux cette latitude que « par David ».
- source_word: בִּהְיוֹתוֹ
  choice: lorsqu’il était
  rationale: La construction avec בְּ et l’infinitif construit de היה a une valeur temporelle; « lorsqu’il était » la rend clairement dans un registre digne.
- source_word: בַמְּעָרָה
  choice: dans la grotte
  rationale: L’article défini hébreu appelle « la grotte » et semble renvoyer à un épisode connu, sans préciser lequel.
- source_word: תְפִלָּה
  choice: Prière
  rationale: Le nom sert d’indication de genre dans le titre. Une phrase nominale distincte restitue sa fonction d’étiquette.
theological_decisions:
- issue: Portée de לְ dans לְדָוִד
  choice: de David
  alternative: pour David / par David
  rationale: Le texte hébreu ne tranche pas explicitement entre composition, dédicace et association; la traduction et la note maintiennent cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. « Méditation » est plus intelligible qu’une translittération non expliquée dans le corps du texte, tandis que la note conserve le terme hébreu et l’incertitude lexicale. Les deux éléments finaux du titre restent brefs et nettement articulés.
