  text: בְּ/הִתְעַטֵּ֬ף עָלַ֨/י רוּחִ֗/י וְ/אַתָּה֮ יָדַ֪עְתָּ נְֽתִיבָ֫תִ֥/י בְּ/אֹֽרַח ז֥וּ אֲהַלֵּ֑ךְ טָמְנ֖וּ פַ֣ח לִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: fr
  text: Quand mon esprit défaille en moi[a], toi, tu connais mon sentier. Sur le chemin où je marche, ils ont caché un piège[b] destiné à me prendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quand mon esprit est accablé au-dedans de moi. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un lacet ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: Quand … défaille
  rationale: La préposition ב avec l’infinitif construit forme une proposition temporelle. Le verbe décrit ici l’affaiblissement ou l’accablement; « défaille » reste concis, naturel et proche de l’image hébraïque.
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ désigne ici la vie intérieure du psalmiste en détresse plutôt que le vent; « mon esprit » en conserve directement la portée.
- source_word: עָלַי
  choice: en moi
  rationale: Littéralement « sur moi », mais, dans cette tournure, le français idiomatique situe la défaillance intérieurement. La note signale une autre compréhension possible de l’ensemble.
- source_word: יָדַעְתָּ
  choice: tu connais
  rationale: 'Le qatal du verbe statif peut exprimer un état présent: Dieu connaît le parcours du psalmiste au cœur même de sa détresse.'
- source_word: נְתִיבָתִי
  choice: mon sentier
  rationale: Le nom désigne une piste ou un sentier, au sens propre ou figuré. « Sentier » préserve la métaphore tout en évitant de répéter « chemin ».
- source_word: בְּאֹרַח
  choice: Sur le chemin
  rationale: אֹרַח désigne un chemin ou une voie. Cette formulation est naturelle en français et maintient l’image du déplacement.
- source_word: זוּ
  choice: où
  rationale: זוּ fonctionne ici comme particule relative introduisant la proposition qui précise le chemin.
- source_word: אֲהַלֵּךְ
  choice: je marche
  rationale: הלך exprime le fait d’aller ou de marcher; « je marche » conserve l’image concrète et sa possible portée figurée.
- source_word: טָמְנוּ
  choice: ils ont caché
  rationale: Le verbe signifie cacher ou dissimuler, notamment un piège. Le passé composé présente une action accomplie dont le danger demeure actuel.
- source_word: פַח
  choice: un piège
  rationale: פַח désigne un piège ou un lacet. « Piège » est immédiatement compréhensible en français moderne; « lacet » est conservé en note comme terme plus imagé.
- source_word: לִי
  choice: pour moi
  rationale: La préposition indique que le piège est destiné au psalmiste; la formulation française reste proche de l’hébreu.
theological_decisions:
- issue: La connaissance divine du parcours du psalmiste
  choice: tu connais mon sentier
  alternative: tu connaissais mon sentier
  rationale: Le parfait d’un verbe statif peut avoir une valeur présente. Le contexte de prière met en relief la connaissance actuelle de Dieu sans ajouter d’affirmation doctrinale étrangère au verset.
translation_notes:
  register: 'Français international moderne, digne et accessible. L’adresse « toi, tu » rend l’opposition emphatique de וְאַתָּה: malgré la défaillance du psalmiste, Dieu connaît son sentier. Le parallélisme des termes de parcours est conservé par « sentier » puis « chemin ».'
