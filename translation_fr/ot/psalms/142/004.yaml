source:
  edition: WLC
  text: הַבֵּ֤יט יָמִ֨ין וּ/רְאֵה֮ וְ/אֵֽין לִ֪/י מַ֫כִּ֥יר אָבַ֣ד מָנ֣וֹס מִמֶּ֑/נִּי אֵ֖ין דּוֹרֵ֣שׁ לְ/נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/004.yaml
  text: 'Look to the right and see: there is no one who recognizes me[a]; refuge has perished from me[b]; no one seeks my life.'
translation:
  language: fr
  text: 'Regarde à droite et vois : personne ne me reconnaît ; tout refuge a disparu pour moi[a] ; personne ne se soucie de ma vie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute possibilité de fuite a disparu » ; le nom hébreu peut désigner un refuge ou un moyen d’échapper.
    reason: lexical_alternative
  - marker: b
    text: Ou « de mon âme ». Ici, le mot hébreu peut désigner la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּיט
  choice: Regarde
  rationale: L’impératif exprime un appel direct et pressant à observer ; « Regarde » est naturel et fidèle.
- source_word: יָמִין
  choice: à droite
  rationale: Le nom désigne le côté droit, lieu où pouvait se tenir un défenseur ou un soutien ; la traduction conserve l’image spatiale sans l’expliciter.
- source_word: וּרְאֵה
  choice: et vois
  rationale: Le second impératif renforce le premier ; cette formulation préserve le parallélisme sobre de l’hébreu.
- source_word: מַכִּיר
  choice: me reconnaît
  rationale: Le participe peut exprimer le fait de reconnaître ou d’accorder de l’attention à quelqu’un. « Me reconnaît » convient au contexte d’abandon social.
- source_word: אָבַד
  choice: a disparu
  rationale: Le parfait de אבד indique que le refuge n’est plus accessible. « A disparu » rend naturellement en français la perte complète exprimée par l’hébreu.
- source_word: מָנוֹס
  choice: refuge
  rationale: Le nom peut désigner un refuge, un lieu de fuite ou un moyen d’échapper. « Refuge » s’intègre au contexte de détresse tout en laissant l’autre sens en note.
- source_word: מִמֶּנִּי
  choice: pour moi
  rationale: Littéralement « de moi », la préposition indique ici que le refuge a disparu de la portée du psalmiste. « Pour moi » donne en français une phrase claire sans modifier le sens.
- source_word: דּוֹרֵשׁ
  choice: se soucie de
  rationale: דרש signifie littéralement « chercher » ou « s’enquérir de ». Avec לְנַפְשִׁי dans cette plainte, il exprime l’attention portée au bien-être du psalmiste ; « se soucie de » est idiomatique et évite le contresens possible de « cherche ma vie ».
- source_word: לְנַפְשִׁי
  choice: de ma vie
  rationale: נפש désigne ici vraisemblablement la vie ou la personne du psalmiste, plutôt qu’une âme immatérielle distinguée du corps. La note conserve l’autre traduction traditionnelle.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans une plainte d’abandon
  choice: ma vie
  alternative: mon âme ; moi-même
  rationale: Le contexte porte sur la survie et l’absence de soutien. « Ma vie » respecte l’usage concret de נֶפֶשׁ sans imposer une anthropologie dualiste, tandis que la note maintient l’ambiguïté lexicale.
- issue: Portée de דּוֹרֵשׁ לְנַפְשִׁי
  choice: personne ne se soucie de ma vie
  alternative: personne ne s’enquiert de mon âme ; personne ne recherche ma vie
  rationale: Dans ce contexte, la construction évoque quelqu’un qui s’informe du psalmiste et veille à son sort. La traduction choisie communique ce sens en français actuel sans faire croire que des ennemis cherchent à lui ôter la vie.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et la succession des trois constats sont conservés. La formulation évite à la fois l’archaïsme « s’enquiert de » et l’ambiguïté française de « cherche ma vie », qui pourrait suggérer une intention hostile.
