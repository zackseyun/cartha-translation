  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: fr
  text: 'J’ai crié vers toi, Yahweh[a] ; j’ai dit : « Tu es mon refuge, ma part au pays des vivants. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « le SEIGNEUR » ou « l’Éternel ».'
    reason: La note signale les principales conventions françaises de substitution du nom divin.
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: J’ai crié
  rationale: Le verbe exprime un appel pressant, souvent un cri de détresse. « J’ai crié » en restitue l’intensité avec naturel en français.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition indique la personne vers qui le cri est dirigé ; « vers toi » est idiomatique dans le registre de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: Cette formulation simple correspond au verbe courant אמר et maintient le parallélisme avec « J’ai crié ».
- source_word: אַתָּה
  choice: Tu es
  rationale: Le pronom hébreu est explicite et appuyé ; le français exige ici la copule.
- source_word: מַחְסִי
  choice: mon refuge
  rationale: « Refuge » exprime naturellement un lieu ou une personne auprès de qui l’on trouve protection.
- source_word: חֶלְקִי
  choice: ma part
  rationale: « Ma part » conserve l’idée de ce qui revient personnellement au psalmiste, sans préciser indûment s’il s’agit d’un lot ou d’un héritage.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: sur la terre des vivants
  rationale: Cette expression française naturelle conserve l’image hébraïque du domaine de la vie terrestre, par opposition au séjour des morts.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte emploie le nom propre divin. « Yahweh » le représente directement, tandis que « le SEIGNEUR » et « l’Éternel » relèvent de traditions françaises de substitution.
- issue: Sens de חֶלְקִי appliqué à Dieu
  choice: ma part
  alternative: mon héritage / mon lot
  rationale: « Ma part » préserve la portée à la fois concrète et relationnelle du terme sans trancher entre possession, attribution et héritage.
translation_notes:
  register: Français moderne, sobre et digne. Le passé composé convient au récit-prière actuel ; l’adresse directe et l’image « la terre des vivants » sont conservées.
