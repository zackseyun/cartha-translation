  text: ק֭וֹלִ/י אֶל יְהוָ֣ה אֶזְעָ֑ק ק֝וֹלִ֗/י אֶל יְהוָ֥ה אֶתְחַנָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: fr
  text: De ma voix, je crie vers Yahvé ; de ma voix, j’implore Yahvé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹלִי
  choice: de ma voix
  rationale: Cette expression conserve l’image concrète de l’hébreu (« ma voix »), sa mise en relief en tête de chaque proposition et sa répétition poétique.
- source_word: אֶל
  choice: vers
  rationale: La préposition indique ici la direction de l’appel adressé à Dieu ; « vers » est naturel avec « crier » et reste perceptible dans le parallélisme.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est sa forme française courante et le distingue d’un simple titre comme « le Seigneur ».
- source_word: אֶזְעָק
  choice: je crie
  rationale: Le verbe זעק désigne un appel pressant, lancé dans la détresse. « Je crie » en restitue la force sans alourdir le vers.
- source_word: אֶתְחַנָּן
  choice: j’implore sa faveur
  rationale: La forme verbale de חנן exprime une supplication pour obtenir faveur ou grâce. Cette formulation explicite naturellement en français ce que le verbe hébreu contient à lui seul.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Puisque l’hébreu emploie le nom propre divin, la traduction le conserve sous sa forme française usuelle plutôt que de lui substituer un titre.
- issue: Objet implicite de אֶתְחַנָּן
  choice: j’implore sa faveur
  alternative: je supplie Yahvé
  rationale: Le verbe peut être rendu soit par une supplication adressée à Yahvé, soit par une demande de sa faveur. Le choix retenu exprime la nuance de grâce contenue dans la racine tout en gardant Yahvé comme destinataire grâce au possessif « sa ».
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition « De ma voix » est volontairement maintenue pour reproduire l’insistance et le parallélisme hébreux.
