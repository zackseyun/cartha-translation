  text: הַקְשִׁ֤יבָ/ה אֶֽל רִנָּתִ/י֮ כִּֽי דַלּ֪וֹתִ֫י מְאֹ֥ד הַצִּילֵ֥/נִי מֵ/רֹדְפַ֑/י כִּ֖י אָמְצ֣וּ מִמֶּֽ/נִּי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/006.yaml
  text: Attend to my cry[a], for I am brought very low; deliver me from my pursuers[c][b], for they are stronger than I.
translation:
  language: fr
  text: Écoute attentivement mon cri[a], car je suis très affaibli[b]. Délivre-moi de ceux qui me poursuivent, car ils sont plus forts que moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon appel au secours ». Le terme hébreu désigne ici un cri pressant.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je suis très abaissé ». L’hébreu peut exprimer un grand affaiblissement ou un profond abaissement.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Écoute attentivement
  rationale: L’impératif de קשׁב demande non seulement d’entendre, mais de prêter une attention réelle. Cette formulation est claire et naturelle en français moderne.
- source_word: רִנָּתִי
  choice: mon cri
  rationale: Dans ce contexte de lamentation, רִנָּה désigne un cri pressant plutôt qu’un chant joyeux. « Mon cri » conserve la force de l’appel sans en préciser excessivement la nature.
- source_word: כִּי דַלּוֹתִי מְאֹד
  choice: car je suis très affaibli
  rationale: Le verbe דלל exprime ici un état de diminution, d’épuisement ou d’abaissement extrême. « Très affaibli » rend naturellement l’état résultant, tandis qu’une note conserve l’image possible de l’abaissement.
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: Le verbe נצל exprime le fait d’arracher quelqu’un à un danger concret. « Délivre-moi » convient au registre de la prière et reste centré sur la menace des poursuivants.
- source_word: מֵרֹדְפַי
  choice: de ceux qui me poursuivent
  rationale: Le participe רדף désigne littéralement les personnes qui poursuivent le psalmiste. Cette tournure est plus claire en français courant que « mes poursuivants » et évite le sens plus étroit de « persécuteurs ».
- source_word: אָמְצוּ מִמֶּנִּי
  choice: ils sont plus forts que moi
  rationale: אָמְצוּ indique la force, et מִמֶּנִּי établit ici la comparaison. La formulation française exprime directement ce rapport de supériorité.
theological_decisions:
- issue: Portée de la délivrance demandée
  choice: Délivre-moi
  alternative: Sauve-moi
  rationale: Le contexte immédiat concerne une délivrance concrète face à des poursuivants humains. « Délivre-moi » préserve cette portée sans imposer au verbe un sens doctrinal plus large que celui qu’exige le verset.
- issue: Nature de l’abaissement du psalmiste
  choice: je suis très affaibli
  alternative: je suis tombé très bas
  rationale: L’hébreu peut évoquer à la fois la faiblesse et l’abaissement extrême. Le texte principal privilégie une expression naturelle de la vulnérabilité, et la note maintient l’autre nuance possible.
translation_notes:
  register: Français moderne, clair et digne, avec le rythme direct d’une supplication. L’exclamation après la première proposition souligne l’urgence sans ajouter de contenu absent de l’hébreu. Les deux propositions causales introduites par כִּי sont rendues parallèlement par « car ».
