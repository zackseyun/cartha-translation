source:
  edition: WLC
  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: fr
  text: Fais sortir mon âme de prison, afin que je rende grâce à ton nom ! Les justes se rassembleront autour de moi[a], car tu me combleras de bienfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les justes m’entoureront ». Le verbe hébreu peut aussi, de manière plus inhabituelle, être compris ainsi : « les justes se couronneront à cause de moi » ou « tireront gloire de moi ».'
    reason: Variante lexicale liée au sens incertain de יַכְתִּרוּ et à sa construction avec בִּי.
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: Fais sortir
  rationale: 'L’impératif hiphil de יצא exprime une demande causative : faire sortir. Cette formulation directe conserve l’image de la libération.'
- source_word: מִמַּסְגֵּר
  choice: de prison
  rationale: מַסְגֵּר désigne un lieu d’enfermement. « Prison » est clair, actuel et n’impose pas un type précis de cachot.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve ici l’expression hébraïque et la portée intérieure de la supplication, sans exclure la personne tout entière.
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  choice: afin que je rende grâce à ton nom
  rationale: L’infinitif exprime le but. Le hiphil de ידה signifie couramment remercier ou louer ; « rendre grâce » convient naturellement avec « à ton nom » et conserve la dimension personnelle et relationnelle du nom divin.
- source_word: בִּי יַכְתִּרוּ צַדִּיקִים
  choice: Les justes se rassembleront autour de moi
  rationale: Le hiphil de כתר peut évoquer le fait d’entourer ou d’encercler. Avec בִּי, le sens exact demeure discuté ; « se rassembleront autour de moi » donne une image naturelle de la communauté des justes réunie autour du psalmiste délivré, tandis que les autres possibilités sont signalées en note.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de la réaction des justes et de l’action de grâce.
- source_word: תִגְמֹל עָלָי
  choice: tu me combleras de bienfaits
  rationale: גמל avec על peut exprimer la manière d’agir envers quelqu’un, notamment en lui faisant du bien. Cette traduction rend l’attente d’une action divine généreuse sans transformer explicitement la phrase en récompense méritée.
theological_decisions:
- issue: La dernière proposition implique-t-elle une récompense fondée sur le mérite ?
  choice: Elle exprime les bienfaits généreux de Dieu envers le psalmiste.
  alternative: « Tu me récompenseras », compris comme une rétribution selon le mérite.
  rationale: Dans ce contexte de lamentation et d’attente de délivrance, גמל peut désigner une action bienfaisante aussi bien qu’une rétribution. « Tu me combleras de bienfaits » conserve l’attente positive du texte sans y importer une doctrine du mérite.
- issue: L’expression « mon âme » désigne-t-elle seulement une réalité intérieure distincte du corps ?
  choice: Conserver l’expression hébraïque tout en la comprenant comme pouvant englober la personne et sa vie.
  alternative: Traduire simplement par « moi » ou « ma vie ».
  rationale: נֶפֶשׁ possède une gamme de sens plus large que la seule notion d’âme immatérielle. La traduction littéraire « mon âme » ne doit donc pas être chargée d’une anthropologie étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif « Fais sortir » garde la vigueur de la supplication ; « rendre grâce » et « combler de bienfaits » sont naturels dans un registre biblique actuel. Le point d’exclamation après la première demande souligne l’élan de la prière sans modifier son contenu.
