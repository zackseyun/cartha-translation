  text: בַּ/עֲב֤וּר יִשְׁמְר֣וּ חֻ֭קָּי/ו וְ/תוֹרֹתָ֥י/ו יִנְצֹ֗רוּ הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/045.yaml
  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: fr
  text: 'afin qu’ils gardent ses prescriptions

    et observent ses instructions.[a]

    Louez Yah ![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et mettent ses lois en pratique » ; le mot hébreu peut désigner des instructions, des enseignements ou des lois, et le verbe évoque le fait de les garder avec soin.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte « Louez Yah ! » ; Yah est une forme abrégée du nom divin. L’expression entière est aussi traditionnellement transcrite « Alléluia ! ».
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: afin que
  rationale: Cette locution introduit ici le but poursuivi; « afin que » en restitue clairement la valeur finale dans un français naturel et soutenu.
- source_word: יִשְׁמְרוּ
  choice: qu’ils gardent
  rationale: Après la locution de but, l’imparfait hébreu se rend naturellement par le subjonctif français. « Garder » conserve la nuance d’attachement fidèle aux prescriptions.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: Le nom חֹק désigne ce qui est prescrit ou établi. « Prescriptions » maintient la nuance normative sans confondre ce terme avec תּוֹרָה.
- source_word: וְתוֹרֹתָיו
  choice: et ses instructions
  rationale: Le pluriel de תּוֹרָה peut désigner les enseignements ou directives de Dieu. « Instructions » préserve cette amplitude mieux que le seul terme « lois ».
- source_word: יִנְצֹרוּ
  choice: observent
  rationale: נצר exprime l’idée de garder avec soin. Avec « instructions », « observer » indique une mise en pratique attentive tout en évitant de répéter « garder ».
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel est traduit directement, et « Yah » conserve la forme abrégée du nom divin présente dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin abrégé יָהּ dans l’acclamation finale
  choice: Louez Yah !
  alternative: Louez le Seigneur ! / Alléluia !
  rationale: Le texte porte יָהּ, forme abrégée du nom divin, et non le tétragramme complet. « Louez Yah ! » préserve cette distinction et rend explicitement l’impératif, sans imposer une formulation confessionnelle particulière.
- issue: Portée de תּוֹרוֹתָיו
  choice: ses instructions
  alternative: ses lois
  rationale: Le pluriel peut viser des lois, mais aussi plus largement les directives ou enseignements divins. « Instructions » conserve cette étendue sémantique dans le contexte de l’obéissance d’Israël.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes, avec une acclamation finale distincte. « Prescriptions » et « instructions » maintiennent la différenciation des deux termes hébreux sans lourdeur juridique excessive.
