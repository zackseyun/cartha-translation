  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: fr
  text: Alors Israël vint en Égypte, et Jacob séjourna comme étranger[a] dans le pays de Cham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vécut en étranger » ; le verbe hébreu souligne qu’il habitait là sans être originaire du pays.
    reason: lexical_alternative
  - marker: b
    text: Le « pays de Cham » est ici un nom poétique de l’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Alors … vint
  rationale: Le wayyiqtol de בוא fait progresser le récit. « Alors » exprime naturellement la succession, tandis que « vint » conserve le sens simple du verbe et le registre poétique.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est rendu selon sa forme française usuelle. Son parallélisme avec « Jacob » est conservé.
- source_word: מִצְרָיִם
  choice: Égypte
  rationale: Forme française usuelle du nom de lieu.
- source_word: וְיַעֲקֹב
  choice: et Jacob
  rationale: Le second nom est maintenu plutôt que remplacé par un pronom afin de préserver le parallélisme poétique Israël/Jacob.
- source_word: גָּר
  choice: vécut en étranger
  rationale: Le verbe גור désigne le fait de résider dans un lieu sans en être originaire ni pleinement établi. Cette formulation actuelle conserve à la fois l'idée de séjour et le statut d'étranger.
- source_word: בְּאֶרֶץ
  choice: dans le pays de
  rationale: Dans ce contexte géographique, אֶרֶץ désigne un pays ou un territoire; « dans le pays de » convient naturellement au nom qui suit.
- source_word: חָם
  choice: Cham
  rationale: Forme française biblique usuelle du nom propre. L'expression poétique « pays de Cham » est conservée au lieu d'être remplacée par « Égypte ».
theological_decisions:
- issue: Faut-il réduire le parallélisme poétique « Israël // Jacob » à un seul nom ?
  choice: Conserver les deux noms dans le texte principal
  alternative: Employer seulement « Jacob » ou seulement « Israël » dans les deux membres
  rationale: L'hébreu emploie intentionnellement les deux noms dans des membres parallèles. Les conserver respecte la texture poétique et la relation représentative possible entre le patriarche et le peuple, sans la préciser davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration poétique. « Vécut en étranger » reste accessible tout en rendant le statut de non-autochtone exprimé par גור; la note donne une formulation plus littérale possible.
