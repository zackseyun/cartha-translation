lexical_decisions:
- source_word: אָמַר
  choice: Il parla
  rationale: Rend directement le verbe « parler/dire » et conserve la formule concise de la parole divine sans expliciter une notion de commandement.
- source_word: וַיָּבֹא
  choice: arrivèrent
  rationale: Exprime naturellement la venue du fléau en français; le singulier hébreu s’accorde avec le collectif עָרֹב, tandis que le français emploie ici le pluriel avec « nuées ».
- source_word: עָרֹב
  choice: des nuées de mouches
  rationale: Dans le récit des fléaux, le terme désigne traditionnellement des essaims d’insectes, souvent compris comme des mouches; la précision reste signalée comme incertaine en note.
- source_word: כִּנִּים
  choice: des moucherons
  rationale: Désigne de petits insectes nuisibles dont l’identification exacte demeure incertaine; « moucherons » est clair en français moderne sans imposer « poux » ou « moustiques ».
- source_word: בְּכָל
  choice: dans tout
  rationale: Reproduit explicitement l’idée d’étendue totale portée par בְּכָל.
- source_word: גְּבוּלָם
  choice: leur territoire
  rationale: Dans ce contexte, גְּבוּל désigne l’ensemble du domaine touché plutôt que ses seules frontières.
