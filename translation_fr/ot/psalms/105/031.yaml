  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: fr
  text: Il parla, et des nuées de mouches vinrent[a], et des moucherons dans tout leur territoire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des essaims »; dans les récits des fléaux, le mot hébreu עָרֹב est traditionnellement compris comme désignant des nuées de mouches, mais l’insecte précis reste incertain.
