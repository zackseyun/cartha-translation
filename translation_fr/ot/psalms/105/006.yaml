  text: זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑/וֹ בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/006.yaml
  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: fr
  text: 'Descendance d’Abraham[a], son serviteur,

    fils de Jacob[b], ceux qu’il a choisis[c] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Postérité d’Abraham ». Le singulier hébreu a ici un sens collectif et désigne les descendants d’Abraham.
    reason: lexical_alternative
  - marker: b
    text: Ou « enfants de Jacob ». L’hébreu dit littéralement « fils de Jacob ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ses élus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: descendance
  rationale: Le nom singulier זֶרַע a ici un sens collectif et désigne la postérité d’Abraham. « Descendance » est naturel en français et conserve la valeur collective.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: 'Le suffixe renvoie à Dieu : Abraham est son serviteur. « Serviteur » convient au titre honorifique dans ce contexte mieux qu’« esclave ».'
- source_word: בְּנֵי
  choice: fils de
  rationale: Le texte hébreu emploie explicitement le pluriel masculin construit « fils de ». Ce choix préserve la forme et le parallélisme, tout en pouvant désigner la lignée de Jacob au sens collectif.
- source_word: בְּחִירָיו
  choice: ceux qu’il a choisis
  rationale: Cette formulation française courante rend le pluriel et évite la charge théologique spécialisée que peut prendre « élus », sans effacer l’acte de choisir attribué à Dieu.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: Descendance d’Abraham // fils de Jacob
  rationale: Les deux expressions parallèles sont maintenues distinctes afin de préserver le parallélisme synonymique du verset.
theological_decisions:
- issue: Référent des suffixes possessifs dans « son serviteur » et « ceux qu’il a choisis »
  choice: 'Les deux renvoient à Dieu : Abraham est le serviteur de Dieu, et les fils de Jacob sont ceux que Dieu a choisis.'
  alternative: Une lecture strictement mécanique pourrait rattacher chaque suffixe au patriarche nommé le plus proche, mais le contexte rend cette compréhension peu probable.
  rationale: Le contexte d’alliance du psaume et l’usage biblique soutiennent la référence à Dieu dans les deux cas, sans ajouter de contenu doctrinal étranger au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux lignes conserve le parallélisme poétique. « Ceux qu’il a choisis » privilégie la clarté courante, tandis que la note signale l’alternative traditionnelle « ses élus ».
