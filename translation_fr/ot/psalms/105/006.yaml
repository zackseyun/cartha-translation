  source_fidelity: 'Le texte rend fidèlement le parallélisme hébreu : זֶרַע (« descendance », singulier collectif), « Abraham, son serviteur », « fils de Jacob » et « ceux qu’il a choisis ». Les suffixes possessifs renvoient naturellement à Dieu dans le contexte immédiat du psaume. La formulation ne résout pas artificiellement une ambiguïté grammaticale qui demeure formellement possible hors contexte.'
