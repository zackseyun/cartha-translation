source:
  edition: WLC
  text: וַ/יִּקְרָ֣א רָ֭עָב עַל הָ/אָ֑רֶץ כָּֽל מַטֵּה לֶ֥חֶם שָׁבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/016.yaml
  text: He called for famine on the land[a]; he broke every staff of bread.
translation:
  language: fr
  text: Il fit venir la famine sur le pays ; il brisa tout soutien de pain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute réserve de nourriture » ; littéralement « tout bâton de pain », image hébraïque désignant ce qui soutient la vie, c’est-à-dire les ressources alimentaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Il fit venir
  rationale: Avec « famine » pour objet, קרא exprime ici l’action de la faire survenir. « Fit venir » est naturel en français et conserve clairement l’initiative divine.
- source_word: רָעָב
  choice: la famine
  rationale: Dans ce contexte, le nom désigne une pénurie générale frappant le pays, plutôt que la simple faim individuelle.
- source_word: עַל הָאָרֶץ
  choice: sur le pays
  rationale: « Pays » convient au cadre historique local du psaume ; « terre » pourrait suggérer à tort une portée mondiale.
- source_word: כָּל מַטֵּה לֶחֶם
  choice: tout soutien de pain
  rationale: La formulation conserve l’image hébraïque du pain comme appui vital, tout en étant plus intelligible en français que le calque « bâton de pain ». La note en explicite le sens idiomatique.
- source_word: שָׁבָר
  choice: il brisa
  rationale: Le sens premier est « briser ». Ce choix maintient la métaphore de l’appui que Dieu rompt.
theological_decisions:
- issue: L’action divine dans la famine
  choice: 'Les deux verbes ont Dieu pour sujet : « Il fit venir… il brisa… »'
  alternative: Une formulation impersonnelle décrivant seulement la survenue de la famine
  rationale: Le contexte du psaume énumère les actes de Dieu, et les verbes au masculin singulier poursuivent naturellement ce sujet. La traduction préserve cette action divine sans l’expliciter au-delà du texte.
translation_notes:
  register: Français moderne, international et digne. « Fit venir la famine » rend naturellement l’idiome verbal. « Soutien de pain » garde la métaphore biblique, tandis que la note fournit le sens courant.
