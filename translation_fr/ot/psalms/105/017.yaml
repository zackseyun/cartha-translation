source:
  edition: WLC
  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: fr
  text: 'Il envoya un homme devant eux : Joseph fut vendu comme esclave.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: Il envoya
  rationale: Le qal accompli à la 3e personne du masculin singulier exprime ici une action de Dieu, sujet implicite fourni par le contexte. « Envoya » est direct et naturel.
- source_word: לִפְנֵיהֶם
  choice: devant eux
  rationale: La locution signifie littéralement « devant eux » et peut, dans ce contexte, indiquer que Joseph les a précédés. Le français conserve naturellement cette nuance sans la préciser davantage.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom masculin singulier est rendu explicitement, conformément au texte hébreu.
- source_word: לְעֶבֶד
  choice: comme esclave
  rationale: La préposition לְ marque ici l'état auquel Joseph fut réduit. Puisqu'il a été vendu, « esclave » exprime mieux que « serviteur » la condition de dépendance imposée.
- source_word: נִמְכַּר
  choice: fut vendu
  rationale: Le nifal accompli de מכר appelle une tournure passive. Le passé simple convient au registre narratif et poétique du psaume.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Forme française traditionnelle et courante du nom propre biblique.
theological_decisions:
- issue: Traduction de עֶבֶד dans le contexte de la vente de Joseph
  choice: esclave
  alternative: serviteur
  rationale: עֶבֶד peut désigner un serviteur ou un esclave selon le contexte, mais le verbe « fut vendu » met ici au premier plan une condition servile imposée. « Esclave » évite d'atténuer cette réalité.
translation_notes:
  register: Français moderne, sobre et digne. Les deux propositions sont reliées par deux-points afin que la seconde identifie l'homme envoyé et précise comment il partit devant les autres, sans ajouter d'explication absente de l'hébreu.
