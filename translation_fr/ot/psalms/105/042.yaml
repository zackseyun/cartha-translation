source:
  edition: WLC
  text: כִּֽי זָ֭כַר אֶת דְּבַ֣ר קָדְשׁ֑/וֹ אֶֽת אַבְרָהָ֥ם עַבְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: fr
  text: Car il s’est souvenu de sa sainte parole et d’Abraham, son serviteur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car il s’est souvenu de la sainte parole qu’il avait adressée à Abraham, son serviteur. »'
    reason: La syntaxe hébraïque permet de comprendre Abraham soit comme un second objet du verbe « se souvenir », soit comme le destinataire de la parole évoquée.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’action précédente; « Car » rend naturellement ce lien causal en français.
- source_word: זָכַר
  choice: s’est souvenu
  rationale: Ce choix conserve l’idiome biblique, qui peut impliquer que Dieu agit conformément à ce qu’il a dit, sans expliciter cette implication dans le texte.
- source_word: דְּבַר קָדְשׁוֹ
  choice: sa sainte parole
  rationale: « Parole » reste proche du nom hébreu דָּבָר, tandis que « sainte » préserve la force de קֹדֶשׁ sans remplacer directement la parole par la notion interprétative de promesse.
- source_word: אֶת אַבְרָהָם
  choice: et d’Abraham
  rationale: La répétition du marqueur d’objet אֶת permet de comprendre Abraham comme un second objet du verbe « se souvenir ». L’ajout français de « et » rend cette coordination possible et naturelle, tout en signalant en note l’autre relation syntaxique couramment comprise.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans ce contexte, « serviteur » exprime naturellement la relation d’Abraham à Dieu sans mettre au premier plan la condition sociale que pourrait suggérer « esclave ».
theological_decisions:
- issue: Portée d’alliance du verbe « se souvenir »
  choice: Conserver « s’est souvenu »
  alternative: a accompli sa promesse
  rationale: Le verbe peut évoquer une action fidèle à l’engagement divin, mais le développer en « accomplir » ferait entrer l’interprétation dans le texte.
- issue: Relation entre « sa sainte parole » et « Abraham, son serviteur »
  choice: Présenter la parole et Abraham comme deux objets coordonnés du souvenir
  alternative: sa sainte parole adressée à Abraham, son serviteur
  rationale: La répétition de אֶת soutient la lecture de deux objets, également attestée dans l’ancienne tradition grecque. Comme le contexte permet aussi de comprendre qu’il s’agit de la parole donnée à Abraham, cette possibilité est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé s’intègre naturellement à la narration poétique actuelle; « sa sainte parole » conserve le vocabulaire biblique sans devenir archaïque.
