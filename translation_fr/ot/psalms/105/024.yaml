id: PSA.105.24
reference: Psalms 105:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יֶּ֣פֶר אֶת עַמּ֣/וֹ מְאֹ֑ד וַ֝/יַּֽעֲצִמֵ/הוּ מִ/צָּרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/024.yaml
  text: And he made his people very fruitful[b][a], and made them mightier than their adversaries.
translation:
  language: fr
  text: Il rendit son peuple très fécond[a] et le rendit plus puissant que ses adversaires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « multiplia considérablement son peuple ». Le verbe hébreu peut mettre l’accent sur la fécondité ou sur l’accroissement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, les pronoms sont au singulier, car ils renvoient au nom collectif « son peuple ».
    reason: collective_singular
lexical_decisions:
- source_word: וַיֶּפֶר
  choice: Il rendit … très fécond
  rationale: Le hifil de פרה exprime l’idée de rendre fécond ou de faire croître. « Rendre très fécond » conserve l’image hébraïque tout en étant naturel en français.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici le peuple d’Israël comme entité collective; « son peuple » convient au contexte de l’alliance et au registre du psaume.
- source_word: מְאֹד
  choice: très
  rationale: Cet adverbe intensifie la fécondité ou l’accroissement; « très » en restitue simplement la force.
- source_word: וַיַּעֲצִמֵהוּ
  choice: le rendit plus puissant
  rationale: Le hifil de עצם signifie rendre fort ou puissant. Le suffixe masculin singulier renvoie grammaticalement au nom collectif « peuple »; le comparatif est exprimé en français par « plus … que ».
- source_word: מִצָּרָיו
  choice: que ses adversaires
  rationale: צַר désigne des ennemis ou adversaires. « Adversaires » conserve la portée générale du terme sans préciser au-delà de l’hébreu.
theological_decisions:
- issue: Reprise pronominale du nom collectif עַם
  choice: 'Maintenir le singulier français : « le » et « ses »'
  alternative: 'Employer un pluriel selon le sens : « les rendit plus puissants que leurs adversaires »'
  rationale: Comme « peuple » est masculin singulier en français et que les suffixes hébreux sont eux aussi au singulier, la reprise par « le » et « ses » est à la fois idiomatique et formellement fidèle, sans modifier le sens collectif.
- issue: Nuance de וַיֶּפֶר
  choice: 'Conserver l’image de la fécondité : « rendit … très fécond »'
  alternative: 'Expliciter l’accroissement : « multiplia considérablement son peuple »'
  rationale: Le verbe peut évoquer aussi bien la fécondité que la multiplication. Le texte principal garde l’image verbale, tandis que la note signale l’autre formulation possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit poétique rétrospectif du psaume. Le singulier collectif, normal en français, suit également la forme de l’hébreu.
