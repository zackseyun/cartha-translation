id: PSA.105.37
reference: Psalms 105:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ֭/יּוֹצִיאֵ/ם בְּ/כֶ֣סֶף וְ/זָהָ֑ב וְ/אֵ֖ין בִּ/שְׁבָטָ֣י/ו כּוֹשֵֽׁל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/037.yaml
  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: fr
  text: Il les fit sortir avec de l’argent et de l’or, et personne, parmi ses tribus, ne chancela.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il n’y eut aucun faible parmi ses tribus ». Le participe hébreu peut évoquer le fait de trébucher, de chanceler, de défaillir ou d’être faible.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Il les fit sortir
  rationale: Le hifil de יצא exprime l’action de faire sortir. Cette formulation naturelle conserve clairement l’action divine dans le contexte de l’Exode.
- source_word: בְּכֶסֶף וְזָהָב
  choice: avec de l’argent et de l’or
  rationale: 'La préposition ב indique ici l’accompagnement ou la possession : le peuple sort avec de l’argent et de l’or, sans préciser davantage la manière dont il les transporte.'
- source_word: וְאֵין
  choice: et personne… ne
  rationale: Cette tournure française rend naturellement la négation existentielle et s’accorde avec le participe qui suit.
- source_word: בִּשְׁבָטָיו
  choice: parmi ses tribus
  rationale: Le pluriel de שֵׁבֶט désigne ici les tribus, et le suffixe masculin singulier est conservé par « ses », Israël étant envisagé collectivement.
- source_word: כּוֹשֵׁל
  choice: ne chancela
  rationale: Le participe de כשל peut exprimer le fait de trébucher, de chanceler, de défaillir ou d’être faible. « Chancela » préserve l’image concrète tout en pouvant évoquer une défaillance physique pendant la marche.
theological_decisions:
- issue: Référent du suffixe singulier dans בִּשְׁבָטָיו
  choice: Conserver le possessif singulier dans « ses tribus », en comprenant Israël/Jacob comme une réalité collective.
  alternative: Employer « leurs tribus » pour rapporter explicitement le possessif aux personnes sorties d’Égypte.
  rationale: L’hébreu porte un suffixe masculin singulier. Le conserver respecte la représentation poétique d’Israël comme un être collectif sans ajouter d’implication doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et poétique. « Argent » conserve ici son sens de métal précieux, coordonné à « or ».
