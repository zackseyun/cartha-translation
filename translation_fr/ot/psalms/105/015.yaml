  text: אַֽל תִּגְּע֥וּ בִ/מְשִׁיחָ֑/י וְ֝/לִ/נְבִיאַ/י אַל תָּרֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: fr
  text: 'Ne touchez pas à mes oints[a],

    et ne faites pas de mal à mes prophètes !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes oints ». Le mot hébreu appartient à la même famille que « Messie », mais il est ici au pluriel et désigne des personnes mises à part par Dieu, non spécifiquement le Messie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: touchez
  rationale: Le verbe נגע signifie couramment « toucher, atteindre, frapper ». « Toucher » conserve ici la force idiomatique de l’interdiction sans la limiter à la violence physique.
- source_word: בִמְשִׁיחָי
  choice: à ceux que j’ai consacrés par l’onction
  rationale: מָשִׁיחַ désigne une personne ayant reçu l’onction. La forme est au pluriel avec un suffixe de première personne du singulier. Cette formulation française explicite naturellement le sens sans suggérer qu’il s’agit ici du Messie unique.
- source_word: לִנְבִיאַי
  choice: à mes prophètes
  rationale: נָבִיא signifie « prophète » ; le pluriel muni du suffixe de première personne du singulier se rend directement par « mes prophètes ».
- source_word: תָּרֵעוּ
  choice: ne faites aucun mal
  rationale: Dans cette construction prohibitive, le verbe רעע signifie faire du mal ou causer du tort. Cette expression est naturelle en français et maintient le parallélisme avec la première interdiction.
- source_word: אַל
  choice: Ne… pas / ne… aucun
  rationale: אַל suivi de l’inaccompli exprime une défense. Ces tournures rendent les deux interdictions de manière concise et idiomatique.
theological_decisions:
- issue: Traduction de מְשִׁיחַ dans un contexte pluriel non directement messianique
  choice: ceux que j’ai consacrés par l’onction
  alternative: mes oints / mes messies
  rationale: Le pluriel désigne ici des personnes mises à part par Dieu dans l’histoire d’Israël, et non directement le Messie singulier. La traduction retenue préserve le lien avec l’onction tout en évitant une lecture christologique indûment imposée.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion implicite de la poésie hébraïque est rendue par deux interdictions parallèles ; « consacrés par l’onction » privilégie la clarté tout en conservant l’image source.
