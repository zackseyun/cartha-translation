  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: fr
  text: Il est Yahvé[a], notre Dieu ; ses jugements[b] sont sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; également transcrit « Yahvé » ou « Jéhovah ».'
    reason: alternative_reading
  - marker: b
    text: Ou « ses ordonnances », « ses décisions de justice » ou « sa justice » ; le mot hébreu peut désigner des décisions judiciaires, des décrets ou la justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Il est
  rationale: Le pronom indépendant est emphatique. Le français naturel explicite la copule sous-entendue en hébreu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante transcrit le nom divin YHWH au lieu de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le nom avec suffixe de première personne du pluriel signifie directement « notre Dieu ».
- source_word: בְּכָל הָאָרֶץ
  choice: à toute la terre
  rationale: Dans cette tournure française avec « s’étendent », la préposition « à » exprime la portée universelle indiquée par l’hébreu ; « terre » convient mieux ici que « pays ».
- source_word: מִשְׁפָּטָיו
  choice: ses jugements
  rationale: מִשְׁפָּט peut désigner des jugements, des décisions de justice, des ordonnances ou la justice. « Jugements » conserve cette amplitude sans préciser à tort s’il s’agit de décrets ou d’actes judiciaires.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: YHWH ou Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahvé » préserve le caractère de nom propre dans une forme française courante, plutôt que de le remplacer par « le Seigneur ».
- issue: Portée de מִשְׁפָּטָיו
  choice: ses jugements
  alternative: ses ordonnances, ses décisions de justice ou sa justice
  rationale: Le terme hébreu reste polysémique dans ce contexte ; la traduction retenue ne tranche pas artificiellement entre normes, verdicts et exercice de la justice.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La première proposition garde l’emphase du pronom hébreu ; « s’étendent à » rend idiomatiquement la portée universelle de la proposition nominale sans localiser les jugements comme de simples objets.
