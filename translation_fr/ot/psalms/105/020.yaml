  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: fr
  text: Le roi envoya quelqu’un pour le relâcher ; le souverain des peuples lui rendit la liberté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: donna l’ordre
  rationale: Le verbe signifie littéralement « envoya ». Employé ici sans complément exprimé devant l’action de libérer Joseph, il indique naturellement que le roi fit transmettre l’ordre de le relâcher.
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Bien que le nom soit sans article en hébreu poétique, le contexte désigne un roi précis, le pharaon.
- source_word: וַיַּתִּירֵהוּ
  choice: de le relâcher
  rationale: Le verbe exprime l’action de délier ou de libérer. « Relâcher » convient au contexte de détention et s’intègre naturellement à la construction française « donner l’ordre de ».
- source_word: מֹשֵׁל עַמִּים
  choice: le souverain des peuples
  rationale: Le participe מֹשֵׁל désigne celui qui gouverne. « Souverain » maintient le parallélisme avec « roi », tandis que « des peuples » conserve le pluriel collectif de עַמִּים.
- source_word: וַיְפַתְּחֵהוּ
  choice: lui rendit la liberté
  rationale: פתח signifie normalement « ouvrir », mais avec une personne comme objet dans ce contexte, l’expression évoque l’ouverture de sa détention et donc sa libération. Cette formulation française restitue l’idée sans littéralisme obscur.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme des deux membres est conservé, avec une légère variation lexicale naturelle entre « relâcher » et « rendre la liberté ».
