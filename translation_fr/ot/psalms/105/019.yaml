id: PSA.105.19
reference: Psalms 105:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: fr
  text: Jusqu’au moment où sa parole s’accomplit[a], la parole de Yahweh le mit à l’épreuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sa parole » peut désigner la parole ou la prédiction de Joseph qui finit par se réaliser ; certains comprennent plutôt la parole de Dieu concernant Joseph.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « l’affina ». Le verbe évoque le raffinage du métal et, au sens figuré, la mise à l’épreuve.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: Jusqu’au moment où
  rationale: Exprime naturellement en français la durée qui s’étend jusqu’à un point déterminé, sans ajouter explicitement l’idée d’un moment fixé.
- source_word: בֹּא
  choice: s’accomplit
  rationale: Littéralement « vint » ; avec « parole », le verbe désigne ici de façon idiomatique la réalisation de ce qui avait été annoncé.
- source_word: דְבָרוֹ
  choice: sa parole
  rationale: 'Préserve la forme et l’ambiguïté du suffixe hébreu : il peut renvoyer à la parole de Joseph, ou à celle de Dieu à son sujet.'
- source_word: אִמְרַת
  choice: la parole
  rationale: Rend ce terme proche de דָּבָר par un français courant et conserve le parallélisme entre les deux propositions.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: צְרָפָתְהוּ
  choice: le mit à l’épreuve
  rationale: Communique clairement le sens métaphorique du raffinage d’un métal appliqué à Joseph, tandis que l’image concrète est signalée en note.
theological_decisions:
- issue: Référent de « sa parole »
  choice: La formulation principale laisse le possessif ambigu, tout en permettant naturellement de comprendre la parole ou prédiction de Joseph.
  alternative: La parole de Dieu concernant Joseph.
  rationale: Le contexte favorise la parole de Joseph qui finit par se réaliser, tandis que la seconde proposition nomme explicitement la parole de Yahweh. Cependant, le suffixe hébreu ne tranche pas à lui seul ; la note conserve donc l’autre lecture.
- issue: Portée de l’épreuve exercée par la parole de Yahweh
  choice: « mit à l’épreuve »
  alternative: « affina » ou « purifia »
  rationale: Le verbe évoque littéralement le raffinage du métal et peut exprimer l’épreuve ou la vérification. Le texte principal privilégie le sens contextuel sans effacer l’image source, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Jusqu’au moment où » évite l’archaïsme ; « s’accomplit » restitue l’emploi idiomatique de « venir » avec une parole. Les deux occurrences de « parole » conservent le parallélisme hébreu, et les notes maintiennent les ambiguïtés lexicale et référentielle.
