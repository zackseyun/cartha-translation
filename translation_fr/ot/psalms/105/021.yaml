  revision_rationale: La révision remplace la collocation peu naturelle « gouverneur de tous ses biens » par « administrateur de tous ses biens ». Elle conserve les deux fonctions parallèles du texte hébreu, l’autorité de Joseph sur la maison et sur les possessions royales, ainsi que le registre sobre et élevé du psaume.
