review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : le roi établit Joseph dans une position d’autorité sur sa maison et sur l’ensemble de ses biens. « Il l’établit maître de sa maison » correspond bien à שָׂמוֹ אָדוֹן לְבֵיתוֹ. Toutefois, « gouverneur de tous ses biens » transpose de façon trop littérale une tournure traditionnelle et n’est pas idiomatique en français moderne : un gouverneur gouverne normalement un territoire ou une collectivité, non des biens.'
  naturalness: La première proposition est naturelle et digne. La seconde est maladroite en français moderne. « Administrateur de tous ses biens » exprime naturellement l’autorité administrative de מֹשֵׁל dans le domaine des possessions, sans ajouter de précision étrangère au texte.
  terminology: '« Maître » convient pour אָדוֹן dans le cadre de la maison royale et ne crée pas d’ambiguïté théologique. « Administrateur » est préférable à « gouverneur » ici : il convient au champ des biens et de l’intendance, tout en préservant l’idée d’autorité exercée sur eux. « Biens » rend adéquatement קִנְיָן.'
  issues:
  - severity: medium
    issue: « gouverneur de tous ses biens » n’est pas une collocation naturelle en français moderne.
    rationale: Le terme « gouverneur » s’emploie ordinairement pour l’administration d’un territoire ou d’une population. Le référent de בְּכָל־קִנְיָנוֹ est l’ensemble des possessions du roi ; « administrateur » rend plus naturellement l’exercice d’autorité dans ce domaine.
  revised_text: Il le nomma maître de sa maison[a] et administrateur de tous ses biens.
