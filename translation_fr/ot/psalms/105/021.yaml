  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: fr
  text: Il le nomma maître de sa maison[a] et administrateur de tous ses biens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il le plaça comme maître de sa maison et lui donna autorité sur tout ce qu’il possédait ».
    reason: 'Alternative lexicale et syntaxique : « plaça » rend explicitement le sens de שׂים, tandis que « donna autorité sur » explicite de façon idiomatique la portée de מֹשֵׁל בְּכָל־קִנְיָנוֹ.'
lexical_decisions:
- source_word: שָׂמוֹ
  choice: Il l’établit
  rationale: Le qal accompli de שׂים/שׂוּם avec suffixe objet signifie « il le plaça/établit ». « Il l’établit » exprime naturellement en français une nomination à la fonction indiquée par les deux titres suivants.
- source_word: אָדוֹן
  choice: maître
  rationale: אָדוֹן désigne ici celui qui exerce l’autorité sur une maison. « Maître » convient au cadre domestique et administratif sans suggérer un titre divin.
- source_word: לְבֵיתוֹ
  choice: de sa maison
  rationale: Après שׂים, le ל marque le domaine de la fonction confiée. Avec « maître », la tournure française naturelle est « maître de sa maison ».
- source_word: וּמֹשֵׁל
  choice: et gouverneur
  rationale: Le participe de משל désigne celui qui gouverne ou exerce l’autorité. « Gouverneur » forme un parallèle clair avec « maître » et correspond au rôle administratif de Joseph.
- source_word: בְּכָל
  choice: de tous
  rationale: Avec משל, ב introduit le domaine sur lequel s’exerce l’autorité. En français, « gouverneur de tous ses biens » rend cette relation de façon idiomatique.
- source_word: קִנְיָנוֹ
  choice: ses biens
  rationale: קִנְיָן désigne ce qui est acquis ou possédé, donc la propriété et les possessions. « Ses biens » est naturel, large et adapté à l’administration de l’ensemble du patrimoine.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme hébreu est conservé par les titres « maître » et « gouverneur »; « maison » peut désigner à la fois le foyer et l’ensemble domestique.
