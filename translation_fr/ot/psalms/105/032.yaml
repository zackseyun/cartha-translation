source:
  edition: WLC
  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: fr
  text: 'Il leur donna pour pluie de la grêle,

    et un feu flamboyant[a] dans leur pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « des éclairs » ou « des traits de feu ». Littéralement : « feu de flammes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: Il leur donna
  rationale: Le verbe signifie couramment « donner ». Cette formulation conserve l’image hébraïque et exprime naturellement l’action divine, sans remplacer le verbe par « envoyer ».
- source_word: גִּשְׁמֵיהֶם בָּרָד
  choice: pour pluie de la grêle
  rationale: La construction indique que la grêle leur fut donnée comme pluie, c’est-à-dire à la place de la pluie ordinaire. La tournure française conserve cette relation poétique.
- source_word: בָּרָד
  choice: de la grêle
  rationale: C’est l’équivalent français direct du nom hébreu et il rappelle clairement la plaie d’Égypte.
- source_word: אֵשׁ לֶהָבוֹת
  choice: un feu flamboyant
  rationale: L’expression associe littéralement le feu et les flammes. « Un feu flamboyant » restitue l’intensification sans imposer l’interprétation plus précise d’éclairs.
- source_word: בְּאַרְצָם
  choice: dans leur pays
  rationale: La préposition signifie normalement « dans » et le contexte désigne le pays des Égyptiens.
theological_decisions:
- issue: Nature de אֵשׁ לֶהָבוֹת dans le récit de la plaie
  choice: « un feu flamboyant » dans le texte principal
  alternative: « des éclairs » ou « des traits de feu »
  rationale: Le contexte d’Exode 9 peut évoquer la foudre, mais l’hébreu présente plus largement l’image du feu et des flammes. Le texte principal préserve cette formulation, tandis que la note signale l’interprétation contextuelle.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique est conservé sur deux lignes. La formulation reste proche de l’hébreu tout en demeurant intelligible.
