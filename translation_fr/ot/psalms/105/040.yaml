source:
  edition: WLC
  text: שָׁאַ֣ל וַ/יָּבֵ֣א שְׂלָ֑ו וְ/לֶ֥חֶם שָׁ֝מַ֗יִם יַשְׂבִּיעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/040.yaml
  text: They asked[a], and he brought quail[b]; he satisfied them with the bread of heaven.
translation:
  language: fr
  text: Ils demandèrent[a], et il fit venir des cailles ; il les rassasia du pain du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un verbe au singulier, littéralement : « Il demanda » ; le sens est probablement collectif et renvoie au peuple d’Israël.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאַל
  choice: Ils demandèrent
  rationale: La forme hébraïque est au singulier (« il demanda »), mais le contexte désigne vraisemblablement le peuple d’Israël pris collectivement. Le pluriel exprime naturellement ce sens en français, tandis que la forme singulière est signalée en note.
- source_word: וַיָּבֵא
  choice: et il fit venir
  rationale: 'Le hifil de בוא a une valeur causative : « faire venir, amener ». « Il fit venir » restitue cette nuance tout en convenant à l’arrivée providentielle des cailles.'
- source_word: שְׂלָו
  choice: des cailles
  rationale: Le nom désigne les cailles fournies au peuple dans le désert. Le pluriel français est naturel pour ce nom collectif hébreu.
- source_word: לֶחֶם שָׁמַיִם
  choice: du pain du ciel
  rationale: Cette traduction conserve la construction poétique littérale « pain du ciel » sans trancher entre appartenance, provenance et caractérisation céleste.
- source_word: יַשְׂבִּיעֵם
  choice: il les rassasia
  rationale: Le hifil de שׂבע signifie « rassasier, satisfaire pleinement ». « Rassasia » convient directement à l’image alimentaire et garde la force du verbe.
theological_decisions:
- issue: Sujet du verbe initial שָׁאַל
  choice: 'Le sujet est compris collectivement comme le peuple d’Israël : « Ils demandèrent ».'
  alternative: 'Conserver le singulier formel : « Il demanda », en l’appliquant éventuellement à Israël comme entité collective ou à un représentant.'
  rationale: Le contexte raconte les actes de Dieu envers Israël dans le désert, et le suffixe pluriel de « il les rassasia » appuie une référence collective. La note préserve toutefois l’écart grammatical réel.
- issue: Rapport exprimé par לֶחֶם שָׁמַיִם
  choice: « le pain du ciel »
  alternative: « du pain venu du ciel » ou « le pain céleste »
  rationale: Le génitif hébreu demeure ouvert quant à la nuance exacte. La formulation retenue conserve cette tension poétique sans imposer exclusivement l’idée de provenance.
translation_notes:
  register: Français moderne, sobre et poétique. Le passé simple convient au récit psalmique. « Rassasia » est courant dans un registre biblique digne sans être archaïque ; « pain du ciel » maintient l’image condensée de l’hébreu.
