  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: fr
  text: Il envoya les ténèbres et fit régner l’obscurité ; ils ne se révoltèrent pas contre ses paroles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « contre sa parole » ou « contre son ordre ». Le sujet de « ils » n’est pas explicité en hébreu : certains y voient les Égyptiens, d’autres Moïse et Aaron.'
    reason: Signaler la possibilité d’un singulier collectif pour « parole » et préserver l’ambiguïté du sujet pluriel implicite.
lexical_decisions:
- source_word: שָׁלַח
  choice: envoya
  rationale: Équivalent français courant et direct du verbe « envoyer », adapté au récit poétique des plaies.
- source_word: חֹשֶׁךְ
  choice: les ténèbres
  rationale: Rend naturellement le nom hébreu désignant l’obscurité et conserve sa force dans le contexte de la plaie.
- source_word: וַיַּחְשִׁךְ
  choice: plongea le pays dans l’obscurité
  rationale: Exprime la valeur causative du verbe. « Le pays » explicite sobrement ce qui est assombri dans le contexte, sans changer l’agent divin.
- source_word: וְלֹא
  choice: ils ne… pas
  rationale: La coordination est rendue par le point-virgule en français, sans introduire un contraste plus fort que celui du texte hébreu.
- source_word: מָרוּ
  choice: se révoltèrent
  rationale: Conserve la nuance de rébellion ou de refus d’obéir portée par מרה.
- source_word: אֶת־דבריו
  choice: contre ses paroles
  rationale: Respecte la forme plurielle du texte massorétique et rend avec מרה le sens idiomatique « se révolter contre ».
theological_decisions:
- issue: Référent du sujet implicite de « ils ne se révoltèrent pas »
  choice: Maintenir le pronom pluriel « ils » sans identifier son référent.
  alternative: Préciser soit « les Égyptiens », soit « Moïse et Aaron ».
  rationale: L’hébreu n’exprime pas le sujet nominal. Les deux identifications sont défendues ; la traduction préserve donc cette ambiguïté réelle.
- issue: Nombre et portée de דבריו
  choice: « ses paroles » au pluriel
  alternative: « sa parole » ou « son ordre » au singulier
  rationale: Le texte massorétique est pluriel dans sa forme, bien qu’un sens collectif ou un commandement précis puisse être envisagé.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, avec une formulation naturelle. Le marqueur [a] figure dans le texte principal.
