- from: L’Égypte se réjouit de leur départ, car la peur d’Israël s’était emparée des Égyptiens.
  to: L’Égypte se réjouit du départ des Israélites, car la crainte qu’ils inspiraient s’était abattue sur eux.
  rationale: La révision explicite les deux référents distincts des suffixes hébreux et rend plus directement l’image de la crainte tombant sur les Égyptiens. Elle conserve la personnification collective de « l’Égypte », un français moderne et un registre biblique sobre.
