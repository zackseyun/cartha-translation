  text: שָׂמַ֣ח מִצְרַ֣יִם בְּ/צֵאתָ֑/ם כִּֽי נָפַ֖ל פַּחְדָּ֣/ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/038.yaml
  text: Egypt was glad when they departed[b][a], for dread of them had fallen upon them.
translation:
  language: fr
  text: L’Égypte se réjouit du départ des Israélites, car la crainte qu’ils inspiraient s’était abattue sur eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: se réjouit
  rationale: Le qal accompli exprime la réaction de joie de l’Égypte au départ d’Israël. « Se réjouit » est naturel et digne en français.
- source_word: מִצְרַיִם
  choice: L’Égypte
  rationale: Le nom désigne collectivement le pays et son peuple; le singulier « L’Égypte » reproduit cette personnification courante.
- source_word: בְּצֵאתָם
  choice: de leur départ
  rationale: La préposition ב avec l’infinitif construit de יצא et le suffixe 3mp situe la joie au moment de la sortie des Israélites. « De leur départ » s’intègre naturellement après « se réjouir ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la joie égyptienne.
- source_word: נָפַל
  choice: s’était emparée
  rationale: L’accompli décrit un état antérieur expliquant la réaction de l’Égypte. Cette tournure française rend idiomatiquement l’image d’une peur tombée sur quelqu’un, sans produire une formulation artificielle.
- source_word: פַּחְדָּם
  choice: la peur d’Israël
  rationale: פחד désigne ici une peur intense. Le suffixe renvoie aux Israélites comme cause ou objet de cette peur; expliciter « Israël » évite l’enchaînement ambigu de pronoms.
- source_word: עֲלֵיהֶם
  choice: des Égyptiens
  rationale: Le suffixe renvoie aux Égyptiens sur qui la peur est tombée. La tournure « s’emparer de » transpose naturellement cette relation en français et l’explicitation évite toute confusion référentielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition explicite d’« Israël » et des « Égyptiens » lève l’ambiguïté des suffixes hébreux, qui ont deux référents distincts, sans modifier le sens.
