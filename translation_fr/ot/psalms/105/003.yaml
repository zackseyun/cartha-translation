source:
  edition: WLC
  text: הִֽ֭תְהַלְלוּ בְּ/שֵׁ֣ם קָדְשׁ֑/וֹ יִ֝שְׂמַ֗ח לֵ֤ב מְבַקְשֵׁ֬י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/003.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: fr
  text: Glorifiez-vous de son saint nom[a] ! Que le cœur de ceux qui cherchent Yahweh se réjouisse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tirez fierté de son saint nom. » Le verbe hébreu peut exprimer le fait d’exulter ou de se glorifier de quelqu’un ou de quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Glorifiez-vous
  rationale: L’impératif hitpael de הלל exprime ici le fait de tirer gloire ou fierté de quelqu’un ou de quelque chose. « Glorifiez-vous de » conserve cette nuance réflexive et convient au registre poétique, tandis qu’une note indique une formulation française plus courante.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: de son saint nom
  rationale: Avec le verbe retenu, la préposition ב se rend naturellement par « de ». « Son saint nom » garde explicitement l’expression hébraïque, où le nom évoque aussi la personne et la réputation révélée.
- source_word: יִשְׂמַח
  choice: Que … se réjouisse
  rationale: L’imparfait de troisième personne a ici une valeur volitive ou exhortative dans le parallélisme poétique avec l’impératif précédent.
- source_word: לֵב
  choice: le cœur
  rationale: Le singulier collectif de l’hébreu est conservé. En français, « le cœur de ceux qui… » désigne naturellement leur être intérieur sans réduire le terme aux seules émotions.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: ceux qui cherchent Yahweh
  rationale: Le participe construit décrit des personnes caractérisées par leur recherche continue de Yahweh ; cette tournure est claire et naturelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par le titre « le Seigneur », afin de conserver le nom divin présent dans le texte source.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération préserve le nom personnel sans lui substituer un titre.
- issue: Valeur de יִשְׂמַח
  choice: 'Souhait ou exhortation : « Que … se réjouisse »'
  alternative: 'Déclaration : « le cœur … se réjouira »'
  rationale: Le contexte d’appel à la louange et le parallélisme avec l’impératif הִתְהַלְלוּ favorisent la valeur volitive, tout en reconnaissant que la forme verbale peut aussi porter une valeur imperfective.
translation_notes:
  register: Français international moderne, poétique et digne. L’ordre « Que le cœur… se réjouisse » reste naturel tout en conservant le singulier collectif hébreu. « Glorifiez-vous » est soutenu mais intelligible ; la note fournit une formulation plus immédiatement courante.
