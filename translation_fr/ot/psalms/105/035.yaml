  text: וַ/יֹּ֣אכַל כָּל עֵ֣שֶׂב בְּ/אַרְצָ֑/ם וַ֝/יֹּ֗אכַל פְּרִ֣י אַדְמָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/035.yaml
  text: It ate all the vegetation in their land[b][a], and it ate the fruit of their ground.
translation:
  language: fr
  text: Il dévora toute la végétation de leur pays[a], il dévora le fruit de leur sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute l’herbe de leur pays ». Le terme hébreu peut désigner l’herbe en particulier ou la végétation au sens large.
    reason: lexical_alternative
  - marker: b
    text: Ou « les produits de leur terre ». Dans un contexte agricole, « fruit » peut désigner plus largement ce que le sol produit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכַל
  choice: elle dévora
  rationale: Le verbe hébreu est au masculin singulier et reprend l’agent collectif singulier du contexte précédent. En français, le pronom féminin convient à « la sauterelle » comprise collectivement; « dévora » conserve l’image concrète et l’aspect narratif.
- source_word: כָּל
  choice: toute
  rationale: Le quantificateur exprime ici la totalité; « toute la végétation » est idiomatique en français.
- source_word: עֵשֶׂב
  choice: végétation
  rationale: Le nom peut désigner l’herbe en particulier ou, plus largement, la croissance végétale. « Végétation » convient au caractère collectif et au contexte de destruction agricole.
- source_word: בְּאַרְצָם
  choice: de leur pays
  rationale: Dans cette construction, le français naturel dit « la végétation de leur pays ». « Pays » rend le sens territorial de אֶרֶץ, tandis que « sol » est réservé au second hémistiche.
- source_word: פְּרִי
  choice: fruit
  rationale: Le mot signifie couramment « fruit » et peut s’étendre aux produits ou à la récolte. Le choix littéral garde l’image agricole du texte.
- source_word: אַדְמָתָם
  choice: leur sol
  rationale: אֲדָמָה désigne le sol, la terre cultivable. « Sol » maintient la distinction avec אֶרֶץ, rendu par « pays » dans le premier membre.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et soutenu. La répétition de « elle dévora » reproduit le parallélisme et l’insistance de l’hébreu. Le passé simple convient au registre narratif poétique du psaume.
