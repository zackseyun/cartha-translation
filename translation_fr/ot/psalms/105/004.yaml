source:
  edition: WLC
  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: fr
  text: Recherchez Yahweh et sa force ; recherchez sans cesse sa face[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « recherchez constamment sa présence ». L’hébreu dit littéralement : « recherchez sans cesse sa face ».'
    reason: Alternative idiomatique pour l’expression hébraïque פָנָיו, dont le sens littéral est conservé dans le texte.
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Recherchez
  rationale: L’impératif pluriel de דרשׁ appelle ici à se tourner volontairement vers Dieu et à le rechercher. « Recherchez » exprime naturellement cette démarche dans un contexte de culte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est conservé sous la forme « Yahweh », plutôt que remplacé par un titre, afin de rendre le tétragramme du texte hébreu.
- source_word: וְעֻזּוֹ
  choice: et sa force
  rationale: עֹז désigne la force, la puissance ou la vigueur. « Sa force » est direct, naturel et conserve le suffixe possessif.
- source_word: בַּקְּשׁוּ
  choice: recherchez
  rationale: L’impératif pluriel de בקשׁ exprime une recherche active. Répéter « recherchez » maintient le parallélisme poétique tout en restant idiomatique en français.
- source_word: פָנָיו
  choice: sa face
  rationale: Le sens littéral est « sa face ». Bien que l’expression puisse désigner la présence de Dieu, conserver l’image préserve sa portée relationnelle et l’ambiguïté de l’hébreu.
- source_word: תָּמִיד
  choice: sans cesse
  rationale: תָּמִיד indique la continuité ou la régularité persistante. « Sans cesse » convient à l’exhortation poétique sans exiger une lecture mécaniquement ininterrompue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Rendu de l’expression פָנָיו
  choice: sa face
  alternative: sa présence
  rationale: L’expression hébraïque peut désigner la présence de Dieu, mais le rendu formel conserve l’image anthropomorphique et sa tension théologique ; le sens idiomatique est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux impératifs est conservé, ainsi que l’image hébraïque de la face divine.
