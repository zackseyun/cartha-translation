  text: אָ֭מַר וַ/יָּבֹ֣א אַרְבֶּ֑ה וְ֝/יֶ֗לֶק וְ/אֵ֣ין מִסְפָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/034.yaml
  text: He spoke[a], and locusts came—young locusts without number.
translation:
  language: fr
  text: Il parla, et les criquets vinrent, ainsi que des criquets dévorants sans nombre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu יֶלֶק désigne un insecte qui dévore les cultures, probablement un criquet à un stade de développement ou d’une variété particulière. On pourrait aussi traduire : « de jeunes criquets sans nombre » ; certaines traductions anciennes ont « chenilles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Il parla
  rationale: Le verbe signifie « dire/parler ». « Il parla » reste concis et souligne que l’événement se produit à sa parole, sans ajouter l’idée plus forte d’un commandement explicite.
- source_word: וַיָּבֹא
  choice: arrivèrent
  rationale: Le verbe בוא décrit ici la venue du fléau. Le pluriel français s’accorde naturellement avec le nom collectif rendu par « les criquets ».
- source_word: אַרְבֶּה
  choice: les criquets
  rationale: Bien que le terme hébreu soit morphologiquement singulier, il fonctionne couramment comme un collectif désignant les criquets du fléau.
- source_word: יֶלֶק
  choice: des criquets dévorants
  rationale: יֶלֶק désigne un insecte ravageur associé aux invasions de criquets, peut-être un stade ou une variété particulière. « Criquets dévorants » préserve cette association et la fonction ravageuse sans imposer l’identification incertaine « jeunes criquets ».
- source_word: וְאֵין מִסְפָּר
  choice: innombrables
  rationale: L’expression signifie littéralement qu’il n’y avait pas de nombre, c’est-à-dire qu’ils étaient impossibles à compter. « Innombrables » est naturel et conserve la force poétique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et poétique. La répétition de « criquets » reflète les deux termes hébreux distincts tout en conservant leur proximité sémantique. Le choix « dévorants » signale la nuance probable de יֶלֶק sans trancher précisément son stade biologique.
