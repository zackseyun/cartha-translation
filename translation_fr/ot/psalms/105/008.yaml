source:
  edition: WLC
  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: fr
  text: 'Il se souvient pour toujours de son alliance,

    de la parole qu’il a prescrite pour mille générations.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la promesse qu’il a prescrite pour mille générations » — le mot hébreu traduit par « parole » peut désigner ici la promesse contenue dans l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: Il se souvient
  rationale: Le qatal peut décrire ici une réalité durable. Le présent français exprime naturellement la fidélité constante de Dieu sans réduire le verbe à un souvenir ponctuel.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend la durée indéfinie et permanente avec un français actuel et naturel.
- source_word: בְּרִיתוֹ
  choice: son alliance
  rationale: « Alliance » est le terme français usuel dans ce contexte biblique et conserve la portée relationnelle et théologique de בְּרִית.
- source_word: דָּבָר
  choice: la parole
  rationale: Le terme hébreu désigne ici la parole prononcée qui exprime l’alliance. « Parole » préserve sa largeur sémantique et le parallélisme poétique; « promesse » reste une possibilité contextuelle signalée en note.
- source_word: צִוָּה
  choice: il a prescrite
  rationale: Le piel de צוה signifie ordonner ou prescrire. « Prescrire » convient à une parole souverainement établie pour les générations et évite la tournure française peu naturelle « commander une parole ».
- source_word: לְאֶלֶף דּוֹר
  choice: pour mille générations
  rationale: La préposition marque l’étendue; bien que דּוֹר soit morphologiquement au singulier après le nombre, le français exige ici le pluriel.
theological_decisions:
- issue: Aspect du souvenir divin
  choice: Présent exprimant la fidélité continue de Dieu
  alternative: « Il s’est souvenu » ou « Il se souvint »
  rationale: Le contexte célèbre une fidélité durable. Le présent communique cette continuité tout en respectant la valeur perfective possible du qatal hébreu.
- issue: Sens de דָּבָר dans le parallélisme de l’alliance
  choice: Conserver « la parole » dans le texte principal
  alternative: « la promesse »
  rationale: « Parole » reste proche du terme hébreu et maintient le parallélisme avec l’alliance; « promesse » explicite une implication probable sans épuiser le sens.
- issue: Force de צִוָּה appliqué à la parole de l’alliance
  choice: « prescrite »
  alternative: « ordonnée » ou « établie »
  rationale: « Prescrite » conserve l’idée d’une décision souveraine et normative. « Établie » serait plus idiomatique mais atténuerait la force lexicale du verbe; « ordonnée » sonne moins naturellement avec « parole ».
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. Le pronom relatif féminin « qu’il a prescrite » s’accorde avec « parole ». Le marqueur [a] est placé après l’ensemble du second membre auquel la variante s’applique.
