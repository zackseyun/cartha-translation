source:
  edition: WLC
  text: וַ/יּוֹצִ֣א עַמּ֣/וֹ בְ/שָׂשׂ֑וֹן בְּ֝/רִנָּ֗ה אֶת בְּחִירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: fr
  text: 'Il fit sortir son peuple dans la joie,

    ceux qu’il avait choisis avec des cris de joie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des chants de joie ». Le terme hébreu peut désigner un cri jubilant aussi bien qu’un chant joyeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: Il fit sortir
  rationale: Le hifil de יצא exprime ici l’action causative de faire sortir. « Fit sortir » reste naturel en français et conserve l’évocation directe de l’Exode.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne couramment un peuple, et dans ce contexte le peuple appartenant à Dieu. « Son peuple » est clair et idiomatique.
- source_word: בְשָׂשׂוֹן
  choice: dans la joie
  rationale: Le nom שָׂשׂוֹן désigne la joie ou l’allégresse. « Dans la joie » rend simplement la valeur circonstancielle de la préposition.
- source_word: בְּרִנָּה
  choice: au son des chants de joie
  rationale: רִנָּה peut désigner aussi bien un chant jubilant qu’un cri de joie. La formulation choisie exprime la manifestation sonore de l’allégresse tout en laissant l’autre nuance en note.
- source_word: אֶת
  choice: non traduit
  rationale: Il s’agit du marqueur du complément d’objet direct défini, sans équivalent lexical autonome en français.
- source_word: בְּחִירָיו
  choice: ceux qu’il avait choisis
  rationale: Le substantif pluriel dérivé de בחר désigne ceux que Dieu a choisis. Cette formulation explicite le sens sans charger « élus » de connotations doctrinales ultérieures.
theological_decisions:
- issue: Rendu de בְּחִירָיו
  choice: ceux qu’il avait choisis
  alternative: ses élus
  rationale: Dans le parallélisme, l’expression désigne le peuple choisi par Dieu et sorti d’Égypte. La traduction retenue préserve cette notion de choix divin sans trancher ni mettre au premier plan des débats théologiques postérieurs.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé sur deux lignes. « Au son des chants de joie » évite la répétition peu élégante de « dans la joie… avec des chants » tout en maintenant la nuance audible de רִנָּה.
