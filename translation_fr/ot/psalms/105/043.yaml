    rationale: Le singulier רִנָּה peut désigner un chant, mais aussi un cri ou une acclamation jubilante. « Au son de » n’est pas exprimé dans l’hébreu et les pluriels « chants » ajoutent une précision absente du texte.
  revised_text: 'Il fit sortir son peuple dans la joie,

