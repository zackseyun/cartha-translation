  text: שָֽׂמוּ בָ֭/ם דִּבְרֵ֣י אֹתוֹתָ֑י/ו וּ֝/מֹפְתִ֗ים בְּ/אֶ֣רֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: fr
  text: Ils accomplirent parmi eux les paroles de ses signes[a] et des prodiges au pays de Cham[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les paroles de ses signes ». Le mot traduit par « paroles » peut aussi désigner des faits ou des événements.'
    reason: lexical_alternative
  - marker: b
    text: « Le pays de Cham » est ici un nom poétique de l’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: ils accomplirent
  rationale: Le verbe signifie littéralement « mettre, placer », mais, associé ici aux signes et aux prodiges, il exprime leur réalisation effective. « Accomplirent » est naturel en français et convient au sujet pluriel du contexte, Moïse et Aaron.
- source_word: בָם
  choice: parmi eux
  rationale: Le suffixe pluriel renvoie aux Égyptiens; « parmi eux » indique que les signes se produisirent au milieu d’eux.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: les signes qu’il avait annoncés
  rationale: L’expression hébraïque inhabituelle signifie littéralement « les paroles — ou les faits — de ses signes ». La formulation française relie ces signes à la parole divine sans conserver une tournure littérale difficilement intelligible.
- source_word: וּמֹפְתִים
  choice: et des prodiges
  rationale: « Prodiges » rend le terme désignant des actes extraordinaires et conserve l’association biblique habituelle entre signes et prodiges.
- source_word: בְּאֶרֶץ חָם
  choice: au pays de Cham
  rationale: Cette désignation poétique de l’Égypte est conservée; « Cham » est la forme française traditionnelle du nom biblique.
theological_decisions:
- issue: Sens de l’expression inhabituelle דִּבְרֵי אֹתוֹתָיו
  choice: les signes qu’il avait annoncés
  alternative: les faits concernant ses signes; littéralement, les paroles de ses signes
  rationale: Le texte peut évoquer les paroles divines relatives aux signes ou, idiomatiquement, les faits constituant ces signes. Le texte principal garde le rapport entre parole et signe sans imposer la tournure obscure « les paroles de ses signes »; la note préserve l’ambiguïté lexicale.
- issue: Identification du pays de Cham
  choice: conserver « pays de Cham »
  alternative: Égypte
  rationale: Le nom poétique du texte hébreu est maintenu, tandis qu’une note fournit son référent géographique sans le substituer dans le verset.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au récit poétique. La formulation évite le calque obscur « les paroles de ses signes », tout en le signalant en note et en maintenant dans le texte le lien possible entre la parole divine et les signes.
