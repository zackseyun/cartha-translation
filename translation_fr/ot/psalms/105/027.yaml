  source_fidelity: La formulation « les signes qu’il avait annoncés » n’est pas fidèle au texte hébreu. Elle introduit l’idée que les signes avaient été annoncés ainsi qu’un antériorité (« avait »), alors que דִּבְרֵי signifie littéralement « paroles » et peut, selon l’usage, désigner des paroles, faits ou événements. Le texte source ne dit pas explicitement que Dieu les avait annoncés. « Ils accomplirent », « parmi eux », « des prodiges » et « au pays de Cham » rendent correctement les autres éléments.
  naturalness: Le français révisé conserve une expression volontairement inhabituelle, « les paroles de ses signes », parce que l’hébreu est lui-même inhabituel. La note en explicite la portée idiomatique. Le reste est naturel, moderne et d’un registre approprié au psaume.
  terminology: « Signes » et « prodiges » maintiennent la paire biblique אותות / מופתים. « Pays de Cham » conserve la désignation poétique hébraïque, avec une note qui l’identifie à l’Égypte sans la remplacer dans le texte.
