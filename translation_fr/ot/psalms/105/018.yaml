  source_fidelity: 'La première proposition rend bien l’affliction des pieds et les entraves, mais « dans des entraves » affaiblit la valeur instrumentale de בַּכֶּבֶל. Dans la seconde, « sa personne fut mise aux fers » transforme l’image verbale : בָּאָה, féminin accordé avec נַפְשׁוֹ, présente « son âme / sa vie » comme sujet de « entrer / venir dans le fer ». Le sens anatomique « cou » est une interprétation ancienne et possible, mais ne doit pas remplacer l’expression difficile dans le texte principal.'
