translation:
  language: fr
  text: Ils lui meurtrirent les pieds avec des entraves ; son âme entra dans le fer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son âme entra dans le fer ». L’expression hébraïque est difficile. « Âme » peut désigner la vie ou la personne ; certains comprennent ici « son cou entra dans le fer », c’est-à-dire qu’il fut placé dans un collier ou un carcan de fer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנּוּ
  choice: on lui fit souffrir
  rationale: Le piel de ענה exprime ici le fait d’affliger ou de faire souffrir. La tournure impersonnelle « on » rend naturellement en français le sujet pluriel indéfini.
- source_word: בַכֶּבֶל
  choice: dans des entraves
  rationale: כבל désigne une entrave ou des fers. « Dans des entraves » restitue l’idée concrète d’un dispositif retenant les pieds.
- source_word: רַגְלָיו
  choice: les pieds
  rationale: Le terme désigne directement les pieds de Joseph ; le pronom complément « lui » marque la possession de façon idiomatique en français.
- source_word: בַּרְזֶל
  choice: aux fers
  rationale: Le nom signifie littéralement « fer ». L’expression française « mettre aux fers » transmet naturellement l’idée d’un emprisonnement au moyen de chaînes de fer, sans préciser indûment la forme de l’objet.
- source_word: בָּאָה
  choice: fut mise
  rationale: Le verbe féminin s’accorde avec נַפְשׁוֹ, qui est donc le sujet grammatical de la proposition. La formulation passive française exprime idiomatiquement l’entrée de la personne dans la contrainte des fers.
- source_word: נַפְשׁוֹ
  choice: sa personne
  rationale: נפש peut désigner l’être vivant ou la personne entière, et parfois, selon l’interprétation du passage, la gorge ou le cou. « Sa personne » conserve ici la référence à Joseph sans imposer dans le texte principal l’interprétation anatomique discutée.
