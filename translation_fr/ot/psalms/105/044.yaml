source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן לָ֭/הֶם אַרְצ֣וֹת גּוֹיִ֑ם וַ/עֲמַ֖ל לְאֻמִּ֣ים יִירָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/044.yaml
  text: He gave them the lands of the nations[a], and they inherited the labor of the peoples.
translation:
  language: fr
  text: 'Il leur donna les terres des nations,

    et ils héritèrent du labeur des peuples.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils prirent possession du labeur des peuples ». Le terme hébreu peut désigner le labeur lui-même ou ce qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם
  choice: Il leur donna
  rationale: Le wayyiqtol de נתן exprime ici un don dans le récit; « leur » rend le bénéficiaire pluriel. Le français peut omettre la conjonction initiale sans perdre la progression narrative.
- source_word: אַרְצוֹת גּוֹיִם
  choice: les terres des nations
  rationale: « Terres » conserve le pluriel hébreu, et « nations » convient au contexte territorial et politique.
- source_word: וַעֲמַל לְאֻמִּים
  choice: du fruit du travail des peuples
  rationale: עָמָל peut désigner le travail pénible lui-même ou, par métonymie, ce qu'il produit. « Fruit du travail » donne en français un objet naturel à « héritèrent » tout en signalant l'ambiguïté dans la note.
- source_word: יִירָשׁוּ
  choice: ils héritèrent
  rationale: ירש peut signifier hériter, prendre possession ou posséder. « Héritèrent » préserve ici la nuance d'un bien reçu par don divin.
theological_decisions:
- issue: Nuance d'alliance de ירש
  choice: ils héritèrent
  alternative: ils prirent possession
  rationale: Le contexte présente Dieu comme celui qui donne les terres. « Héritèrent » maintient cette relation entre don divin et possession, sans exclure la portée concrète de la prise de possession.
- issue: Objet de l'héritage dans וַעֲמַל
  choice: du fruit du travail
  alternative: du travail pénible
  rationale: L'hébreu permet de comprendre soit le labeur, soit les biens acquis par ce labeur. Le texte principal adopte l'expression française la plus naturelle, tandis que la note conserve l'autre lecture.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé en deux lignes; « peuples » évite la répétition de « nations » tout en gardant le sens collectif.
