  source_fidelity: La première ligne rend fidèlement וַיִּתֵּן לָהֶם אַרְצוֹת גּוֹיִם. Dans la seconde, « du fruit du travail » explicite une extension possible de עָמָל, mais le texte hébreu emploie le terme sans préciser qu’il s’agit de son produit. Une formulation moins interprétative préserve mieux l’ambiguïté lexicale.
  naturalness: « Ils héritèrent du labeur des peuples » est naturel dans un registre poétique moderne et correspond bien au parallélisme du psaume. « Labeur » convient mieux que « travail pénible » dans le texte courant, tout en gardant la connotation de peine que peut avoir עָמָל.
  terminology: « Terres des nations » et « peuples » rendent adéquatement les deux désignations collectives distinctes, גּוֹיִם et לְאֻמִּים. « Héritèrent » est recevable pour ירש et conserve la nuance de possession reçue; la note indique l’alternative « prirent possession ».
