  text: בִּֽ֭/הְיוֹתָ/ם מְתֵ֣י מִסְפָּ֑ר כִּ֝/מְעַ֗ט וְ/גָרִ֥ים בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: fr
  text: Quand ils étaient peu nombreux, très peu nombreux, et étrangers dans ce pays[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et résidents temporaires dans ce pays ». Le terme hébreu désigne des personnes qui vivent comme étrangères dans un pays qui n’est pas le leur.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: Quand ils n’étaient
  rationale: La préposition בְּ suivie de l’infinitif construit de היה et du suffixe de 3e personne du pluriel introduit une proposition temporelle. Avec « qu’un petit nombre », cette formulation est naturelle en français.
- source_word: מְתֵי מִסְפָּר
  choice: qu’un petit nombre
  rationale: Cette expression idiomatique désigne un groupe peu nombreux. La tournure française rend clairement cette idée sans reproduire littéralement « hommes de nombre ».
- source_word: כִּמְעַט
  choice: très peu nombreux
  rationale: Dans ce contexte, le terme renforce l’idée précédente de petitesse numérique. La répétition expressive correspond à l’insistance de l’hébreu.
- source_word: וְגָרִים
  choice: et étrangers résidant
  rationale: Le participe de גור désigne des personnes qui habitent comme étrangères ou résidentes temporaires dans un pays qui n’est pas le leur. Cette expression moderne conserve à la fois l’altérité et la résidence, contrairement au seul mot « étrangers ».
- source_word: בָּהּ
  choice: dans ce pays
  rationale: Le suffixe féminin singulier renvoie au pays mentionné dans le contexte. L’explicitation par « ce pays » évite en français un pronom au référent isolé peu clair.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La structure temporelle et la double insistance sur leur très petit nombre sont conservées. « Étrangers résidant » évite l’archaïsme de « séjournant comme étrangers » tout en gardant la nuance sociale de גרים.
