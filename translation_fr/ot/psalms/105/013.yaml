translation:
  language: fr
  text: Ils allaient de nation en nation[a], d’un royaume à un autre peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils se déplaçaient de nation en nation, d’un royaume à un autre peuple. »'
    reason: Alternative lexicale pour וַיִּתְהַלְּכוּ, qui peut souligner le déplacement répété ou itinérant.
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: ils allaient
  rationale: Le hitpael de הלך exprime ici un déplacement répété d’un lieu à l’autre. « Ils allaient » reste naturel en français et, avec les compléments « de… en… », rend l’itinérance sans imposer la nuance potentiellement négative de « erraient ».
- source_word: מִגּוֹי אֶל גּוֹי
  choice: de nation en nation
  rationale: Cette formulation idiomatique conserve la répétition hébraïque et exprime le passage successif entre des groupes politico-ethniques.
- source_word: מִמַּמְלָכָה
  choice: d’un royaume
  rationale: L’article indéfini permet au français d’exprimer naturellement le mouvement depuis un royaume dans la structure corrélative du verset, sans ajouter explicitement un numéral absent de l’hébreu.
- source_word: אֶל עַם אַחֵר
  choice: vers un autre peuple
  rationale: « Peuple » préserve la distinction lexicale entre עַם et מַמְלָכָה, tandis que « autre » traduit אַחֵר. « Vers » évite la lecture d’une transformation du royaume en peuple que pourrait suggérer « d’un royaume à un autre peuple ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « de nation en nation » garde le parallélisme et le mouvement itératif de l’hébreu. Le texte principal évite « erraient », qui pourrait suggérer qu’ils étaient perdus, tout en signalant en note une autre manière de rendre le verbe.
