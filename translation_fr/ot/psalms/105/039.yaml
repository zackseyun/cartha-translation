  yaml_path: translation/ot/psalms/105/039.yaml
  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: fr
  text: Il déploya une nuée pour servir de couverture[a], et un feu pour éclairer la nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme couverture », « comme écran » ou « comme dais ». Le terme hébreu peut désigner une couverture, un écran ou une tenture.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: déploya
  rationale: Le verbe signifie étendre ou déployer. « Déploya » exprime naturellement l’action d’étendre la nuée au-dessus du peuple.
- source_word: עָנָן
  choice: une nuée
  rationale: Le terme désigne un nuage. « Nuée », courant dans le registre biblique français tout en restant compréhensible, convient à la manifestation qui accompagne Israël au désert.
- source_word: לְמָסָךְ
  choice: comme abri
  rationale: מָסָךְ peut désigner une couverture, un écran ou une tenture. Dans ce contexte fonctionnel, « comme abri » rend l’idée de protection sans imposer une forme architecturale précise.
- source_word: וְאֵשׁ
  choice: et un feu
  rationale: La traduction littérale conserve le parallélisme entre la nuée et le feu ainsi que l’allusion au récit du désert.
- source_word: לְהָאִיר
  choice: pour éclairer
  rationale: L’infinitif précédé de לְ exprime ici la fonction ou le but du feu. « Pour éclairer » est naturel et précis en français.
- source_word: לָיְלָה
  choice: la nuit
  rationale: Après « éclairer », « la nuit » rend naturellement la valeur temporelle de l’hébreu.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: Il, c’est-à-dire Dieu
  alternative: L’Éternel / le Seigneur
  rationale: L’hébreu porte un sujet masculin singulier implicite repris du contexte et désignant Dieu. « Il » respecte l’enchaînement du discours sans introduire un nom divin absent de ce verset.
- issue: Imagerie de la manifestation divine au désert
  choice: Conserver littéralement la nuée et le feu, sans développement interprétatif
  alternative: Préciser qu’il s’agit des colonnes de nuée et de feu
  rationale: Le verset évoque le récit de l’Exode, mais mentionne seulement une nuée et un feu avec leurs fonctions. La traduction préserve cette retenue.
translation_notes:
  register: Français moderne, digne et poétique. « Nuée » maintient la couleur biblique sans être obscure; « comme abri » communique clairement la fonction protectrice tout en conservant en note les autres images possibles.
