  text: וַ/יַּֽעֲמִידֶ֣/הָ לְ/יַעֲקֹ֣ב לְ/חֹ֑ק לְ֝/יִשְׂרָאֵ֗ל בְּרִ֣ית עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/010.yaml
  text: He confirmed it to Jacob as a statute[b][a], to Israel as an everlasting covenant.
translation:
  language: fr
  text: Il l’a établie pour Jacob comme une loi, pour Israël comme une alliance perpétuelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Il l’a établie
  rationale: Le hiphil de עמד signifie ici « faire tenir », donc établir ou confirmer fermement. « Établie » est naturel en français et conserve la force institutionnelle du contexte. Le pronom féminin « l’ » reprend sans la préciser davantage la réalité évoquée dans le contexte précédent.
- source_word: לְיַעֲקֹב
  choice: pour Jacob
  rationale: La préposition לְ peut marquer le destinataire ou le bénéficiaire. « Pour Jacob » est idiomatique en français et convient au parallélisme.
- source_word: לְחֹק
  choice: comme une prescription
  rationale: חֹק désigne ce qui est fixé ou prescrit. « Prescription » rend la nuance normative et juridique sans l’archaïsme possible de « statut » dans ce contexte.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: Cette formulation reprend parallèlement לְיַעֲקֹב et conserve la structure poétique hébraïque.
- source_word: בְּרִית עוֹלָם
  choice: comme une alliance perpétuelle
  rationale: בְּרִית est rendu par le terme biblique courant « alliance ». עוֹלָם exprime ici une durée indéfiniment prolongée; « perpétuelle » préserve cette portée sans imposer une interprétation métaphysique.
theological_decisions:
- issue: Référent du suffixe féminin dans וַיַּעֲמִידֶהָ
  choice: Le pronom « l’ » renvoie de façon anaphorique à la réalité covenantale mentionnée dans le contexte précédent, sans préciser davantage.
  alternative: Expliciter « l’alliance », « la promesse » ou « la parole jurée ».
  rationale: Le contexte immédiat mentionne l’alliance, la parole et le serment. Garder un pronom respecte la formulation hébraïque et évite de trancher entre ces référents étroitement liés.
- issue: Portée temporelle de עוֹלָם
  choice: alliance perpétuelle
  alternative: alliance éternelle
  rationale: « Perpétuelle » exprime une durée continue et durable tout en préservant l’amplitude sémantique de עוֹלָם; « éternelle » pourrait suggérer plus directement une catégorie métaphysique.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme entre Jacob et Israël ainsi que la tonalité juridique et covenantale sont conservés.
