  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: fr
  text: Il frappa leurs vignes et leurs figuiers, et brisa les arbres de leur territoire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il frappa
  rationale: Le verbe נכה exprime ici une action directe et destructrice. « Il frappa » est naturel, vigoureux et conserve l’aspect narratif du texte.
- source_word: גַּפְנָם
  choice: leurs vignes
  rationale: גֶּפֶן désigne la vigne. Le pluriel français rend naturellement la valeur collective de la forme hébraïque munie du suffixe possessif.
- source_word: וּתְאֵנָתָם
  choice: et leurs figuiers
  rationale: תְּאֵנָה signifie « figuier ». Bien que la forme hébraïque soit morphologiquement singulière, elle a ici un sens collectif, que le pluriel exprime naturellement en français.
- source_word: וַיְשַׁבֵּר
  choice: et brisa
  rationale: Le piel de שׁבר indique une rupture violente ou destructrice. « Brisa » garde cette force sans introduire l’idée plus spécifique de réduction en éclats.
- source_word: עֵץ
  choice: les arbres
  rationale: עֵץ peut désigner un arbre ou du bois. Le contexte des dégâts causés à la végétation appelle ici le sens collectif « les arbres ».
- source_word: גְּבוּלָם
  choice: de leur territoire
  rationale: גְּבוּל peut signifier frontière, limites ou territoire. Dans cette construction, « de leur territoire » rend naturellement le domaine géographique concerné.
theological_decisions:
- issue: Sujet implicite des verbes
  choice: « Il », renvoyant à Dieu dans le contexte du psaume
  alternative: Répéter explicitement « Dieu » ou « le Seigneur »
  rationale: L’hébreu emploie des verbes à la troisième personne du masculin singulier dont le sujet se déduit du contexte. Le pronom « Il » préserve cette continuité sans explicitation excessive.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif poétique du psaume. La formulation reste proche de la structure hébraïque tout en employant des pluriels collectifs idiomatiques en français.
