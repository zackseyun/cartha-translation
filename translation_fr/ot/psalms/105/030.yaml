  text: שָׁרַ֣ץ אַרְצָ֣/ם צְפַרְדְּעִ֑ים בְּ֝/חַדְרֵ֗י מַלְכֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/030.yaml
  text: Their land swarmed with frogs[a], even in the chambers of their kings.
translation:
  language: fr
  text: Leur pays grouilla de grenouilles jusque dans les appartements de leurs rois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « leurs rois ». Dans le récit des plaies en Exode, il est question du roi au singulier; le psaume emploie ici le pluriel, peut-être dans un sens poétique ou collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: grouilla
  rationale: Le verbe exprime un foisonnement ou une prolifération. « Grouilla » rend naturellement et vivement l’invasion en français.
- source_word: אַרְצָם
  choice: leur pays
  rationale: Le nom avec suffixe pronominal désigne ici le territoire des Égyptiens. « Leur pays » est direct et idiomatique.
- source_word: צְפַרְדְּעִים
  choice: grenouilles
  rationale: C’est le sens usuel et contextuellement certain du nom hébreu.
- source_word: בְּחַדְרֵי
  choice: dans les appartements de
  rationale: Le terme désigne des pièces intérieures ou chambres. « Appartements » convient au contexte royal et garde un registre digne sans être archaïque.
- source_word: מַלְכֵיהֶם
  choice: leurs rois
  rationale: La forme hébraïque est explicitement au pluriel avec un suffixe de troisième personne du pluriel; elle ne doit pas être harmonisée avec le singulier du récit de l’Exode.
theological_decisions:
- issue: Pluriel « leurs rois » dans le psaume
  choice: Conserver le pluriel du texte hébreu
  alternative: « leur roi », par harmonisation avec le récit des plaies dans l’Exode
  rationale: Le texte massorétique porte un pluriel authentique. La traduction préserve cette particularité et laisse ouverte sa portée poétique ou collective.
translation_notes:
  register: Français international moderne, naturel et digne. « Grouilla » restitue l’image du foisonnement; « appartements » évoque les pièces privées d’une résidence royale sans archaïsme.
