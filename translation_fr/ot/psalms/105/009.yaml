  text: which he made with Abraham[a], and his oath to Isaac,
translation:
  language: fr
  text: qu’il a conclue avec Abraham[a], et son serment à Isaac,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « qu’il a coupée avec Abraham », expression idiomatique signifiant conclure une alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: qu’il
  rationale: Le pronom relatif rattache ce verset à « l’alliance » du verset précédent; l’élision donne une formulation française naturelle.
- source_word: כָּרַת
  choice: a conclue
  rationale: Dans le contexte d’une alliance, כָּרַת appartient à l’expression idiomatique « couper une alliance ». Le français dit naturellement « conclure une alliance »; le féminin de « conclue » reprend l’antécédent implicite « alliance ».
- source_word: אֶת אַבְרָהָם
  choice: avec Abraham
  rationale: Bien que אֶת marque ici Abraham comme complément du verbe hébreu, le français exprime idiomatiquement l’établissement d’une alliance par « conclure avec quelqu’un ».
- source_word: וּשְׁבוּעָתוֹ
  choice: et son serment
  rationale: שְׁבוּעָה désigne un serment, et le suffixe masculin singulier est conservé par le possessif « son ».
- source_word: לְיִשְׂחָק
  choice: à Isaac
  rationale: La préposition ל indique ici le destinataire ou bénéficiaire du serment; « à Isaac » en préserve simplement le rapport.
theological_decisions:
- issue: L’objet « alliance » est implicite et repris du verset précédent
  choice: « qu’il a conclue avec Abraham »
  alternative: « qu’il a coupée avec Abraham »; « qu’il a conclue pour Abraham »
  rationale: Le texte hébreu sous-entend « l’alliance » après le relatif. « Conclue avec Abraham » garde ce lien grammatical et le sens de l’idiome sans introduire en français l’image peu naturelle de couper.
translation_notes:
  register: Français moderne, sobre et digne. Le segment demeure syntaxiquement lié au verset précédent; « conclue » reprend explicitement le genre de « l’alliance » sans répéter le nom.
