source:
  edition: WLC
  text: שָׁ֭לַח מֹשֶׁ֣ה עַבְדּ֑/וֹ אַ֝הֲרֹ֗ן אֲשֶׁ֣ר בָּֽחַר בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/026.yaml
  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: fr
  text: Il a envoyé Moïse, son serviteur, et Aaron, qu’il avait choisi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il a choisi ». Le verbe hébreu peut être rendu par un passé composé ; le plus-que-parfait indique explicitement que le choix d’Aaron a précédé son envoi.
    reason: alternative lexicale et temporelle
lexical_decisions:
- source_word: שָׁלַח
  choice: Il a envoyé
  rationale: Le qal accompli, dont le sujet masculin singulier est implicite et renvoie à Dieu dans le contexte, se rend naturellement par le passé composé en français moderne.
- source_word: מֹשֶׁה עַבְדּוֹ
  choice: Moïse, son serviteur
  rationale: עֶבֶד peut désigner un esclave ou un serviteur ; appliqué ici à Moïse dans son rapport à Dieu, « serviteur » exprime naturellement la fonction honorifique et l’appartenance indiquée par le suffixe.
- source_word: אַהֲרֹן
  choice: et Aaron
  rationale: Le nom propre est rendu selon l’usage français établi. La conjonction « et », absente mais implicite dans la juxtaposition hébraïque de deux compléments, rend clairement en français que Moïse et Aaron sont tous deux envoyés.
- source_word: אֲשֶׁר בָּחַר בּוֹ
  choice: qu’il avait choisi
  rationale: La construction בחר ב désigne le choix d’une personne. Le plus-que-parfait explicite naturellement que le choix d’Aaron précède son envoi, tout en conservant l’autre valeur temporelle possible en note.
theological_decisions:
- issue: Sujet implicite de שָׁלַח et de בָּחַר
  choice: Le pronom « il » renvoie à Dieu sans répéter son nom.
  alternative: Expliciter « Le Seigneur a envoyé » ou « Dieu a envoyé ».
  rationale: L’hébreu n’exprime pas le sujet nominal dans ce verset ; celui-ci ressort du contexte. Le pronom préserve donc la continuité du discours sans ajouter un nom divin.
- issue: Rapport temporel entre le choix et l’envoi d’Aaron
  choice: « qu’il avait choisi »
  alternative: « qu’il a choisi »
  rationale: Le plus-que-parfait présente le choix comme antérieur à l’envoi, lecture naturelle dans le contexte, sans prétendre que la forme hébraïque impose à elle seule cette précision temporelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé évite un passé simple plus littéraire, tandis que « serviteur » conserve l’expression biblique courante. La virgule avant la relative présente le choix comme une précision concernant Aaron.
