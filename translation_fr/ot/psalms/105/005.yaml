  text: Remember the wonders that he has done[a], his signs and the judgments of his mouth[c][b],
translation:
  language: fr
  text: Souvenez-vous des merveilles qu’il a accomplies[a], de ses signes[b] et des jugements de sa bouche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des actes merveilleux qu’il a accomplis ».'
    reason: lexical_alternative
  - marker: b
