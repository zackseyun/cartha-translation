lexical_decisions:
- source_word: זִכְרוּ
  choice: Souvenez-vous
  rationale: Impératif pluriel de זכר. Cette formulation exprime naturellement en français l’appel adressé à plusieurs personnes à garder activement en mémoire.
- source_word: נִפְלְאוֹתָיו
  choice: des merveilles
  rationale: Le nom issu de פלא désigne des actes extraordinaires qui suscitent l’émerveillement. « Merveilles » est concis et convient au registre poétique.
- source_word: אֲשֶׁר עָשָׂה
  choice: qu’il a accomplies
  rationale: La proposition relative qualifie les merveilles. Le passé composé souligne des actes passés dont le souvenir reste pertinent; « accomplies » s’accorde naturellement avec des actes divins remarquables.
- source_word: מֹפְתָיו
  choice: ses signes
  rationale: מופת peut désigner des signes, des prodiges ou des présages attestant l’action divine. « Signes » conserve une portée large sans réduire le terme aux seuls miracles.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: et des jugements sortis de sa bouche
  rationale: מִשְׁפָּט peut désigner des jugements, des décisions ou des prescriptions. La formulation conserve l’image hébraïque de la bouche tout en indiquant clairement qu’il s’agit de paroles prononcées.
- source_word: פִיו
  choice: sa bouche
  rationale: Le rendu littéral préserve l’anthropomorphisme et la force poétique de l’expression hébraïque.
theological_decisions:
- issue: Rapport entre נִפְלְאוֹת et מֹפְתִים
  choice: Deux catégories distinctes mais étroitement liées, rendues par « merveilles » et « signes »
  alternative: « œuvres merveilleuses » et « prodiges »
  rationale: L’accumulation évoque les actes puissants de Dieu sans imposer une distinction théologique technique. Deux termes français distincts préservent le parallélisme.
- issue: Sens de מִשְׁפְּטֵי פִיו
  choice: « les jugements sortis de sa bouche »
  alternative: « les décisions qu’il a prononcées » ou « les prescriptions de sa bouche »
  rationale: L’expression peut renvoyer à des décisions judiciaires, des décrets ou des prescriptions divines. Le texte principal préserve l’image hébraïque et laisse ouverte la nuance exacte.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif pluriel est direct; l’image concrète de la bouche divine est conservée sans rendre la phrase obscure.
