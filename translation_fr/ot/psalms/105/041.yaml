  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: fr
  text: Il ouvrit le rocher, l’eau jaillit ; elle coula dans les lieux arides, tel un fleuve.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « elle alla dans les lieux arides, un fleuve ». Le mot traduit par « tel » n’est pas exprimé ; « un fleuve » peut être compris comme une apposition décrivant l’eau qui coule.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: ouvrit
  rationale: Le verbe signifie simplement « ouvrir ». Ce choix conserve l’image hébraïque sans préciser davantage, comme le feraient « fendit » ou « brisa ».
- source_word: צוּר
  choice: le rocher
  rationale: Bien que le nom soit sans article en hébreu, le contexte renvoie au rocher bien connu du récit du désert ; l’article défini est donc naturel en français.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: des eaux jaillirent
  rationale: Le verbe décrit des eaux qui s’écoulent ou sortent. « Jaillirent » rend ici leur sortie soudaine et abondante, tandis que le pluriel « des eaux » permet de conserver l’accord pluriel du verbe hébreu.
- source_word: הָלְכוּ
  choice: elles coulèrent
  rationale: Le sens premier est « elles allèrent », avec les eaux pour sujet. Dans ce contexte, « coulèrent » exprime naturellement leur mouvement en français.
- source_word: בַּצִּיּוֹת
  choice: à travers les lieux arides
  rationale: Le nom désigne des endroits secs ou desséchés. « À travers » rend bien la progression des eaux sans restreindre le sens à des déserts au sens strict.
- source_word: נָהָר
  choice: comme un fleuve
  rationale: Le nom final caractérise le cours des eaux. Le français demande naturellement une comparaison explicite, même si l’hébreu ne comporte pas de terme équivalent à « comme ».
theological_decisions:
- issue: Allusion au don d’eau dans le désert
  choice: Présenter le verset comme le récit poétique d’une action divine historique en faveur d’Israël.
  alternative: Comprendre l’image principalement comme une métaphore générale de la providence divine.
  rationale: Le psaume retrace l’histoire d’Israël et renvoie donc d’abord au don d’eau lors du séjour au désert, sans qu’il soit nécessaire d’expliciter davantage cette allusion dans la traduction.
translation_notes:
  register: Français moderne, poétique et accessible. Le passé simple convient au récit historique du psaume. Le pluriel « des eaux… elles » maintient la correspondance avec les verbes hébreux au pluriel tout en restant naturel dans un registre biblique actuel.
