lexical_decisions:
- source_word: הָפַךְ
  choice: changea
  rationale: Le verbe exprime ici le changement d’un état en un autre. « Changea » est naturel en français et convient au contexte de la plaie.
- source_word: מֵימֵיהֶם
  choice: leurs eaux
  rationale: Le pluriel hébreu désigne collectivement les étendues et réserves d’eau des Égyptiens; « leurs eaux » en conserve le nombre et la portée.
- source_word: לְדָם
  choice: en sang
  rationale: La préposition לְ indique l’état résultant. En français, la construction idiomatique est « changer ... en sang ».
- source_word: וַיָּמֶת
  choice: fit mourir
  rationale: La forme causative du verbe est rendue explicitement par « fit mourir », sans l’aplatir en simple constat ni la renforcer en « tua ».
- source_word: דְּגָתָם
  choice: leurs poissons
  rationale: Le nom hébreu a ici un sens collectif; le pluriel français « leurs poissons » est clair et naturel.
