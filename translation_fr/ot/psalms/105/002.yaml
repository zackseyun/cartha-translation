source:
  edition: WLC
  text: שִֽׁירוּ ל֭/וֹ זַמְּרוּ ל֑/וֹ שִׂ֝֗יחוּ בְּ/כָל נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/002.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous works.
translation:
  language: fr
  text: Chantez pour lui, chantez ses louanges ; parlez de toutes ses merveilles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « racontez toutes ses merveilles » ou « méditez sur toutes ses œuvres merveilleuses ». Le verbe hébreu peut désigner une méditation intérieure ou le fait d’en parler ; dans ce contexte de louange publique, le second sens est privilégié.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ לוֹ
  choice: Chantez pour lui
  rationale: L’impératif pluriel de שׁיר appelle directement la communauté à chanter. Avec ל, « pour lui » est idiomatique en français et exprime l’orientation du chant vers Dieu.
- source_word: זַמְּרוּ לוֹ
  choice: célébrez-le par vos chants
  rationale: זמר désigne ici le chant ou la musique de louange. Cette formulation naturelle conserve le parallélisme tout en évitant une répétition française maladroite de « chantez ».
- source_word: שִׂיחוּ
  choice: parlez de
  rationale: Le verbe שׂיח peut évoquer aussi bien la méditation que l’entretien ou le récit. Dans cette série d’appels publics à la louange, « parlez de » convient au contexte sans effacer l’autre nuance, signalée en note.
- source_word: בְּכָל נִפְלְאוֹתָיו
  choice: de toutes ses merveilles
  rationale: Après un verbe de parole, ב est rendu naturellement par « de ». נִפְלְאוֹת désigne les actes extraordinaires de Dieu ; « merveilles » est concis, digne et courant dans le registre psalmique.
theological_decisions: []
translation_notes:
  register: Français international moderne, accessible et digne. Le parallélisme poétique est maintenu, avec une variation naturelle entre « chantez » et « célébrez-le par vos chants ». Le marqueur de note est placé après le segment lexicalement ambigu.
