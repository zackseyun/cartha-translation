  text: לֶ/אְסֹ֣ר שָׂרָ֣י/ו בְּ/נַפְשׁ֑/וֹ וּ/זְקֵנָ֥י/ו יְחַכֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/022.yaml
  text: to bind his princes at his pleasure[b][a], and to teach his elders wisdom.
translation:
  language: fr
  text: 'pour enchaîner ses princes à son gré[a]

    et rendre sages ses anciens[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « enchaîner ses princes par/avec son âme » ; l’expression hébraïque peut signifier « selon son désir » ou « à son gré ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « enseigner la sagesse à ses anciens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: enchaîner
  rationale: L’infinitif construit exprime le but ou le résultat dans la continuité du verset précédent. « Enchaîner » conserve directement l’idée de lier ou de tenir sous contrainte.
- source_word: שָׂרָיו
  choice: ses princes
  rationale: שַׂר peut désigner un prince, un chef ou un haut fonctionnaire. Dans le cadre de la cour royale, « princes » préserve le registre élevé et la portée politique.
- source_word: בְּנַפְשׁוֹ
  choice: à son gré
  rationale: Littéralement « par/avec son âme » ; נֶפֶשׁ peut ici évoquer le désir ou la volonté. « À son gré » rend naturellement l’expression sans effacer son caractère idiomatique, signalé en note.
- source_word: וּזְקֵנָיו
  choice: ses anciens
  rationale: זָקֵן désigne littéralement une personne âgée et, dans un contexte gouvernemental, un ancien ou un dignitaire expérimenté. « Anciens » conserve ces deux dimensions.
- source_word: יְחַכֵּם
  choice: rendre sages
  rationale: Le piel de חכם peut signifier « rendre sage » ou « enseigner la sagesse ». « Rendre sages » préserve clairement sa valeur causative et laisse ouverte la manière dont cette action s’accomplit.
theological_decisions: []
