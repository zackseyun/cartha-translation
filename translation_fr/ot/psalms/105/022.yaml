  register: Français moderne, digne et accessible. Le parallélisme poétique est maintenu sur deux lignes ; « princes » et « anciens » conservent la couleur de cour de l’hébreu, tandis que les notes rendent visibles l’idiome et l’ambiguïté du verbe final.
