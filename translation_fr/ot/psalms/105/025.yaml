source:
  edition: WLC
  text: הָפַ֣ךְ לִ֭בָּ/ם לִ/שְׂנֹ֣א עַמּ֑/וֹ לְ֝/הִתְנַכֵּ֗ל בַּ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/025.yaml
  text: He turned their heart to hate his people[b][a], to deal deceitfully with his servants.
translation:
  language: fr
  text: Il changea leur cœur, au point qu’ils détestèrent son peuple et agirent avec ruse contre ses serviteurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’ils détestent son peuple et agissent avec ruse contre ses serviteurs » ; les infinitifs hébreux peuvent exprimer le but ou le résultat.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: הָפַךְ
  choice: changea
  rationale: Le verbe signifie « tourner, renverser, changer ». Avec « leur cœur », « changea » exprime naturellement en français l’action directe de Dieu sur leur disposition intérieure.
- source_word: לִבָּם
  choice: leur cœur
  rationale: Le singulier hébreu muni d’un suffixe pluriel est conservé comme expression collective désignant la disposition intérieure commune du peuple égyptien.
- source_word: לִשְׂנֹא
  choice: au point qu’ils détestèrent
  rationale: L’infinitif peut exprimer ici le résultat ou le but. Cette tournure française naturelle rend clairement le résultat sans trancher entièrement la nuance syntaxique.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici le peuple appartenant à Dieu, Israël ; « son peuple » est précis et idiomatique.
- source_word: לְהִתְנַכֵּל
  choice: agirent avec perfidie
  rationale: Le hitpael de נכל évoque une conduite rusée, trompeuse et hostile. « Agir avec perfidie » garde cette dimension morale sans surinterpréter la forme concrète des manœuvres.
- source_word: בַּעֲבָדָיו
  choice: contre ses serviteurs
  rationale: Après ce verbe hostile, בְּ se rend naturellement par « contre ». « Serviteurs » convient au statut d’Israël par rapport à Dieu.
theological_decisions:
- issue: Action divine dans le changement de disposition des Égyptiens
  choice: Conserver l’affirmation directe « Il changea leur cœur »
  alternative: « Il permit que leur cœur change » ou « leur cœur changea »
  rationale: Le verbe hébreu à la troisième personne du masculin singulier présente Dieu comme sujet implicite. La traduction ne réduit pas cette action à une simple permission et préserve la tension entre souveraineté divine et hostilité humaine.
- issue: Valeur des infinitifs לִשְׂנֹא et לְהִתְנַכֵּל
  choice: 'Les rendre comme un résultat coordonné : « au point qu’ils… et… »'
  alternative: 'Les rendre comme un but : « afin qu’ils détestent… et agissent… »'
  rationale: L’hébreu autorise une nuance de but ou de résultat. Dans ce contexte narratif, la conséquence est naturelle en français, mais une note signale l’autre possibilité afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier collectif « leur cœur » conserve l’image hébraïque ; « détestèrent » est plus courant que « haïrent », tandis que « avec perfidie » maintient la gravité poétique du verset.
