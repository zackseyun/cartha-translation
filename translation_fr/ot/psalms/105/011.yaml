  yaml_path: translation/ot/psalms/105/011.yaml
  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: fr
  text: 'en disant : « Je te donnerai le pays de Canaan, la part[a] de votre héritage[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le cordeau » ; le cordeau servant à mesurer un terrain en est venu à désigner la part de terre attribuée.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu passe ici du singulier « te » au pluriel « votre », probablement parce qu’Abraham représente ses descendants.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵאמֹר
  choice: en disant
  rationale: L’infinitif construit introduit ici la promesse divine citée et relie naturellement ce verset au précédent.
- source_word: לְךָ
  choice: je te donnerai
  rationale: Le pronom hébreu est masculin singulier. Le tutoiement conserve l’adresse directe à Abraham et s’intègre naturellement au verbe « donner ».
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: L’imparfait à la première personne exprime ici une promesse à venir.
- source_word: אֶרֶץ כְּנָעַן
  choice: le pays de Canaan
  rationale: Cette expression française courante désigne clairement le territoire de Canaan.
- source_word: חֶבֶל
  choice: la part
  rationale: Le mot signifie littéralement « cordeau », mais désigne par métonymie une part de territoire mesurée et attribuée.
- source_word: נַחֲלַתְכֶם
  choice: qui vous revient en héritage
  rationale: Cette formulation rend le bien attribué en héritage tout en conservant explicitement le possessif pluriel de l’hébreu.
theological_decisions:
- issue: Passage du destinataire singulier au possessif pluriel dans la promesse
  choice: Conserver « te » au singulier puis « vous » au pluriel
  alternative: Harmoniser au singulier, ou expliciter « à tes descendants »
  rationale: L’hébreu passe lui-même du singulier לְךָ au pluriel נַחֲלַתְכֶם. La traduction maintient cette tension, qui peut présenter Abraham comme représentant de ses descendants, sans l’expliciter dans le texte.
translation_notes:
  register: Français moderne, naturel et digne. L’apposition après « Canaan » est conservée, tandis que « qui vous revient en héritage » évite une construction nominale peu naturelle. Le contraste de nombre entre « te » et « vous » reste visible.
