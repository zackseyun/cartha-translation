  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: fr
  text: Rendez grâce à Yahweh[a] ; invoquez son nom ; faites connaître ses œuvres parmi les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », traditionnellement vocalisé « Yahweh ».'
    reason: Le texte hébreu emploie le tétragramme ; la note identifie la forme consonantique transmise et la forme utilisée dans la traduction.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Célébrez
  rationale: L’impératif hiphil de ידה, construit avec לַיהוָה dans un contexte psalmique, appelle à remercier et à louer. « Célébrez » exprime naturellement en français cette action publique de grâce et de louange.
- source_word: לַיהוָה
  choice: Yahvé
  rationale: La préposition ל marque celui à qui s’adresse la célébration. Le tétragramme יְהוָה est rendu par le nom propre traditionnel français « Yahvé ».
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: faites appel à son nom
  rationale: La construction קרא בְּשֵׁם peut signifier invoquer ou faire appel au nom de quelqu’un. Cette formulation conserve le sens cultuel tout en étant claire en français actuel.
- source_word: הוֹדִיעוּ
  choice: faites connaître
  rationale: 'Le hiphil de ידע a ici sa valeur causative : amener d’autres personnes à connaître, donc « faire connaître ».'
- source_word: בָעַמִּים
  choice: parmi les peuples
  rationale: Le בְּ locatif et le pluriel עַמִּים indiquent la diffusion de cette connaissance au milieu des différents peuples, sans limiter le terme à des États politiques.
- source_word: עֲלִילוֹתָיו
  choice: ses œuvres
  rationale: עֲלִילוֹת désigne les actions accomplies. « Œuvres » convient au registre psalmique et n’ajoute pas l’idée de puissance qui serait explicite dans « hauts faits ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: L’hébreu emploie directement le tétragramme. « Yahvé » le présente comme un nom propre plutôt que de le remplacer par un titre, tandis que la note signale la forme hébraïque et l’usage traditionnel alternatif.
- issue: Portée de קִרְאוּ בִּשְׁמוֹ
  choice: faites appel à son nom
  alternative: proclamez son nom
  rationale: La construction peut évoquer l’invocation cultuelle plutôt qu’une simple proclamation. La traduction retenue préserve ce rapport d’appel adressé à Dieu sans développer une doctrine particulière de l’invocation.
translation_notes:
  register: Style poétique, exhortatif et digne, avec trois impératifs parallèles. Le vocabulaire reste courant tout en conservant la tonalité liturgique du psaume.
