  text: He allowed no man to oppress them[a]; he rebuked kings on their account,
translation:
  language: fr
  text: 'Il ne permit à personne de les opprimer ;

    il réprimanda des rois à cause d’eux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: permit
  rationale: À la forme causative et avec l’infinitif, le verbe exprime ici le fait de permettre ou de laisser faire. « Permettre » est naturel et précis en français.
- source_word: אָדָם
  choice: personne
  rationale: Le singulier générique désigne ici tout individu. Dans la tournure négative « ne… à personne », ce choix rend naturellement la portée indéfinie de l’hébreu.
- source_word: לְעָשְׁקָם
  choice: de les opprimer
  rationale: Le verbe עשׁק évoque l’oppression, l’exploitation ou le tort infligé. « Opprimer » conserve sa portée générale et sa force dans ce contexte.
- source_word: וַיּוֹכַח
  choice: il réprimanda
  rationale: Dans ce contexte, יכח désigne une intervention de reproche ou de réprimande adressée aux rois. « Réprimanda » est ferme, clair et digne.
- source_word: עֲלֵיהֶם
  choice: à cause d’eux
  rationale: La préposition על avec suffixe indique ici que Dieu agit en considération des patriarches ou en raison de ce qui les concerne. « À cause d’eux » préserve cette relation sans préciser davantage le motif.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le nom désigne directement des rois ; il n’est pas nécessaire de l’élargir à l’ensemble des dirigeants.
