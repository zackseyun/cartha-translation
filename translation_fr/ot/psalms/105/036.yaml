  yaml_path: translation/ot/psalms/105/036.yaml
  text: He struck down every firstborn in their land[a], the firstfruits of all their strength.
translation:
  language: fr
  text: Il frappa tous les premiers-nés dans leur pays, les prémices de toute leur vigueur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque peut aussi se comprendre : « la première manifestation de toute leur puissance » ; elle présente les premiers-nés comme les premiers produits de la vigueur parentale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Il frappa
  rationale: Le hifil de נכה signifie couramment « frapper ». Dans le contexte de la mort des premiers-nés, le résultat mortel est clair sans devoir l’expliciter dans le verbe.
- source_word: כָּל בְּכוֹר
  choice: tous les premiers-nés
  rationale: Cette tournure française naturelle conserve la portée globale de כָּל et le sens établi de בְּכוֹר dans le récit des plaies.
- source_word: בְּאַרְצָם
  choice: dans leur pays
  rationale: אֶרֶץ désigne ici le territoire où vivent les Égyptiens ; « pays » est naturel en français moderne.
- source_word: רֵאשִׁית
  choice: prémices
  rationale: רֵאשִׁית désigne ce qui vient en premier, le commencement ou la première production. « Prémices » maintient ici l’image des premiers descendants sans la réduire à une simple indication temporelle.
- source_word: לְכָל אוֹנָם
  choice: de toute leur vigueur
  rationale: אוֹן peut désigner la force, la vigueur ou la puissance génératrice. « Vigueur » conserve l’allusion probable à la capacité procréatrice, tandis que לְ exprime ici la relation d’appartenance.
theological_decisions:
- issue: Sujet implicite du verbe
  choice: « Il » renvoie à Dieu
  alternative: Répéter explicitement « Dieu »
  rationale: Le sujet masculin singulier est implicite en hébreu et repris du contexte. Le pronom conserve cette continuité sans ajouter un nom absent du verset.
- issue: Sens de « prémices de toute leur vigueur »
  choice: Conserver l’expression métaphorique et son lien avec les premiers-nés
  alternative: « les premiers fruits de leur puissance génératrice »
  rationale: L’expression hébraïque associe les premiers-nés à la première manifestation de la vigueur parentale. Une formulation imagée préserve cette tension sémantique sans imposer une interprétation exclusivement sexuelle.
translation_notes:
  register: Français moderne, digne et accessible. « Prémices » est légèrement soutenu mais familier au registre biblique ; la note en éclaire l’image. Le marqueur de note est placé après la proposition qu’il explique.
