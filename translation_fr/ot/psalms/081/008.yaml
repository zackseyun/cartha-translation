  yaml_path: translation/ot/psalms/081/008.yaml
  text: Hear[a], my people, and I will testify against you; O Israel[b], if you would listen to me!
translation:
  language: fr
  text: Écoute, mon peuple, et je témoignerai contre toi[a] ; Israël, si tu m’écoutais[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « je t’avertirai solennellement » ou « je t’adresserai un témoignage solennel ».

      '
    reason: lexical_alternative
  - marker: b
    text: 'Cette expression peut aussi être rendue plus explicitement comme un souhait : « Ah ! si seulement tu m’écoutais ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: L’impératif appelle directement le peuple à prêter attention. « Écoute » est naturel en français et permet de reprendre la même racine hébraïque dans la dernière proposition.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Cette formulation courante conserve la relation d’alliance exprimée par l’adresse divine.
- source_word: וְאָעִידָה בָּךְ
  choice: et je témoignerai contre toi
  rationale: Le hiphil de עוד peut désigner un témoignage solennel ou un avertissement. Avec בְּ dans ce contexte de réprimande, « contre toi » conserve la possible nuance judiciaire sans exclure l’idée d’avertissement, signalée en note.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom est employé comme vocatif direct ; le français moderne n’exige pas l’ajout de « ô ».
- source_word: אִם תִּשְׁמַע לִי
  choice: si tu m’écoutais
  rationale: La construction peut exprimer ici un souhait ou un appel plein de regret. Le tour exclamatif français reste proche de la forme conditionnelle hébraïque tout en faisant entendre cette nuance affective.
theological_decisions:
- issue: Valeur de וְאָעִידָה בָּךְ
  choice: « je témoignerai contre toi »
  alternative: « je t’avertirai solennellement » ou « je témoignerai auprès de toi »
  rationale: Le contexte autorise une lecture judiciaire, mais le verbe peut également exprimer un avertissement solennel. La traduction principale retient la force adversative possible de בְּ, tandis que la note préserve l’étendue lexicale.
- issue: Valeur de אִם תִּשְׁמַע לִי
  choice: « si tu m’écoutais ! » comme appel empreint de souhait
  alternative: « si tu m’écoutes » comme proposition conditionnelle, ou « Ah ! si seulement tu m’écoutais ! » comme souhait rendu explicitement
  rationale: La particule אִם peut introduire ici soit une condition, soit un souhait exclamatif. La formulation retenue conserve la forme en « si » tout en laissant l’exclamation communiquer le désir, sans expliciter davantage que l’hébreu.
translation_notes:
  register: Français international actuel, direct et digne. Le tutoiement singulier suit les formes hébraïques adressées collectivement à Israël. La répétition « Écoute / m’écoutais » reproduit celle de la racine שׁמע.
