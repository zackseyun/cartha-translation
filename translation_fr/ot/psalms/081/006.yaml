  text: הֲסִיר֣וֹתִי מִ/סֵּ֣בֶל שִׁכְמ֑/וֹ כַּ֝פָּ֗י/ו מִ/דּ֥וּד תַּעֲבֹֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/006.yaml
  text: I removed the burden from his shoulder[c][b][a]; his hands passed away from the basket.
translation:
  language: fr
  text: J’ai retiré le fardeau de son épaule ; ses mains ont été délivrées de la corbeille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « marmite » ou « chaudron » ; le nom hébreu est rare ici et le récipient précis reste incertain.
