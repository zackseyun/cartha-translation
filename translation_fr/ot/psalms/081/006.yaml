translation_notes:
  register: Français moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que le singulier « épaule ». La seconde proposition explicite légèrement l’idée de libération portée par le contexte, tandis que la note maintient l’incertitude sur le récipient.
