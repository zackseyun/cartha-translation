lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: J’ai retiré
  rationale: Le hifil accompli à la première personne du singulier exprime l’action causative d’écarter ou d’enlever ; le passé composé convient au discours divin rétrospectif.
- source_word: מִסֵּבֶל שִׁכְמוֹ
  choice: le fardeau de son épaule
  rationale: סֵבֶל désigne une charge ou un fardeau, et שׁכם l’épaule. La formulation française naturelle inverse la relation syntaxique littérale sans changer le sens.
- source_word: כַּפָּיו
  choice: ses mains
  rationale: כף peut désigner la paume, mais « mains » est l’équivalent idiomatique dans ce contexte de travail manuel.
- source_word: מִדּוּד
  choice: de la corbeille
  rationale: דּוּד désigne ailleurs un récipient, notamment une marmite ou un chaudron. Dans le parallélisme lié au travail forcé, « corbeille » est contextuellement plausible, mais l’incertitude lexicale est signalée en note.
- source_word: תַּעֲבֹרְנָה
  choice: ont été délivrées de
  rationale: Le qal inaccompli féminin pluriel de עבר signifie littéralement que les mains « passèrent loin de » l’objet. En français, cette tournure exprime naturellement la cessation du travail imposé tout en évitant une formulation obscure.
