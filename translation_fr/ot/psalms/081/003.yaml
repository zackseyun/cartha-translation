source:
  edition: WLC
  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: fr
  text: Sonnez du cor à la nouvelle lune, à la pleine lune[a], le jour de notre fête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la lune cachée » ou « au temps fixé ». Le sens du terme hébreu כֵּסֶה est débattu ; « pleine lune » est retenu ici en raison du parallélisme calendaire avec « nouvelle lune » et du contexte de la fête.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Sonnez
  rationale: Impératif pluriel du verbe תקע. Avec un cor, « sonnez » est naturel en français et conserve pleinement la force de l’ordre.
- source_word: בַחֹדֶשׁ
  choice: à la nouvelle lune
  rationale: חֹדֶשׁ peut désigner le mois ou la nouvelle lune. Le contexte liturgique et le parallélisme calendaire favorisent ici « nouvelle lune ».
- source_word: שׁוֹפָר
  choice: du cor
  rationale: שׁוֹפָר désigne un instrument à vent fait d’une corne, employé notamment pour les signaux cultuels. « Cor » est précis, courant et évite la translittération « shofar ».
- source_word: בַּכֵּסֶה
  choice: à la pleine lune
  rationale: Le sens de כֵּסֶה est débattu. « Pleine lune » rend la lecture traditionnelle et probable dans le parallélisme avec « nouvelle lune », sans dissimuler les autres possibilités, signalées en note.
- source_word: לְיוֹם
  choice: pour le jour de
  rationale: La préposition לְ peut ici marquer la destination ou le rapport au jour de fête. « Pour le jour de » conserve cette nuance, plutôt que de la réduire à une simple indication temporelle.
- source_word: חַגֵּנוּ
  choice: notre fête
  rationale: חַג désigne une fête religieuse, souvent une fête de pèlerinage. « Notre fête » est concis, naturel et garde la dimension collective et cultuelle.
theological_decisions:
- issue: Sens de בַּכֵּסֶה dans la référence au calendrier festif
  choice: à la pleine lune
  alternative: à la lune cachée ; au temps fixé
  rationale: Il s’agit surtout d’une difficulté lexicale. Le parallélisme avec la nouvelle lune et le contexte d’une fête calendaire favorisent « pleine lune », mais le terme hébreu demeure discuté ; les autres lectures sont donc conservées en note.
translation_notes:
  register: Français moderne, digne et directement compréhensible. « Sonnez du cor » rend naturellement l’action cultuelle sans recourir à une translittération technique. La formulation poétique reste concise, et l’ambiguïté de כֵּסֶה est explicitement préservée en note.
