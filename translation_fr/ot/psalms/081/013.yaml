  text: ל֗וּ עַ֭מִּ/י שֹׁמֵ֣עַֽ לִ֑/י יִ֝שְׂרָאֵ֗ל בִּ/דְרָכַ֥/י יְהַלֵּֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/013.yaml
  text: Oh[a], that my people would listen to me, that Israel would walk in my ways!
translation:
  language: fr
  text: Ah ! si mon peuple m’écoutait, si Israël marchait dans mes voies ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si seulement mon peuple m’écoutait, si Israël marchait dans mes voies ! »'
    reason: alternative_reading
lexical_decisions:
- source_word: לוּ
  choice: Ah ! si
  rationale: Cette tournure française exprime naturellement le souhait mêlé de regret introduit par לוּ, tout en laissant percevoir sa forme conditionnelle.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Le suffixe possessif est rendu directement et conserve la relation d’alliance impliquée dans le psaume.
- source_word: שֹׁמֵעַ לִי
  choice: m’écoutait
  rationale: Avec לִי, le verbe désigne une écoute attentive qui implique de tenir compte de la parole, plutôt que la simple perception auditive.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé selon sa forme française traditionnelle.
- source_word: בִּדְרָכַי
  choice: dans mes voies
  rationale: Cette formulation garde la métaphore hébraïque des voies comme manière de vivre et de se conduire.
- source_word: יְהַלֵּכוּ
  choice: marchait
  rationale: L’imparfait, régi par « si » dans ce souhait, rend naturellement en français la conduite désirée tout en préservant la métaphore de la marche.
theological_decisions:
- issue: Souhait optatif ou condition
  choice: 'Le verset est rendu comme un souhait empreint de regret : « Ah ! si… »'
  alternative: « Si seulement mon peuple m’écoutait, si Israël marchait dans mes voies ! »
  rationale: Dans ce contexte, לוּ exprime principalement le désir et la plainte, mais la construction française avec « si » maintient la nuance conditionnelle possible sans transformer le verset en proposition strictement transactionnelle.
translation_notes:
  register: Français moderne, digne et accessible. « Ah ! si » restitue l’élan affectif du texte ; « voies » et « marchait » conservent la métaphore biblique cohérente de la conduite.
