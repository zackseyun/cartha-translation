id: PSA.81.15
reference: Psalms 81:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מְשַׂנְאֵ֣י יְ֭הוָה יְכַֽחֲשׁוּ ל֑/וֹ וִ/יהִ֖י עִתָּ֣/ם לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/015.yaml
  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: fr
  text: Ceux qui détestent Yahvé se soumettraient à lui avec hypocrisie[a], et leur temps durerait pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui offriraient une soumission feinte », « feraient semblant de lui obéir » ou « trembleraient devant lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur temps, pour toujours ». Il peut s’agir de la période qui leur est assignée, de leur sort ou de leur châtiment, qui se prolongerait indéfiniment.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: ceux qui détestent
  rationale: Le participe substantivé désigne les personnes qui haïssent Yahvé. Cette formulation est naturelle en français moderne et conserve la valeur caractérisante du participe.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin représenté par le tétragramme.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: se soumettraient à lui avec hypocrisie
  rationale: Au piel avec ל, כחשׁ peut exprimer une soumission feinte ou contrainte. La traduction rend explicitement son caractère non sincère sans réduire le sens à la seule peur physique.
- source_word: וִיהִי
  choice: durerait
  rationale: Dans cette suite poétique hypothétique, la forme verbale est rendue au conditionnel. « Durerait » donne une expression française naturelle à l'idée que leur temps serait לְעוֹלָם.
- source_word: עִתָּם
  choice: leur temps
  rationale: עֵת signifie d'abord « temps » ou « période ». Le choix littéral préserve l'ambiguïté poétique concernant une période assignée, un sort ou un châtiment.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Équivalent français courant qui conserve la portée temporelle indéfinie ou perpétuelle de l'expression hébraïque.
theological_decisions:
- issue: Sens de la proposition finale וִיהִי עִתָּם לְעוֹלָם
  choice: leur temps durerait pour toujours
  alternative: leur châtiment durerait pour toujours ; leur sort serait fixé pour toujours
  rationale: Le contexte permet une compréhension négative concernant les ennemis de Yahvé, mais le texte dit seulement « leur temps ». La traduction principale conserve donc cette tension au lieu d'introduire une précision doctrinale absente de l'hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le conditionnel maintient le cadre hypothétique du contexte. La tournure légèrement poétique « leur temps durerait » conserve volontairement la concision et l'ambiguïté de l'hébreu.
