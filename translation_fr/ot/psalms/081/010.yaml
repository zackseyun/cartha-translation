id: PSA.81.10
reference: Psalms 81:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: fr
  text: Je suis Yahweh, ton Dieu, qui t’ai fait monter du pays d’Égypte. Ouvre grand ta bouche, et je la remplirai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que je la remplisse ».
    reason: La coordination hébraïque peut exprimer soit le résultat promis, soit le but de l’ordre précédent.
lexical_decisions:
- source_word: אָנֹכִי יְהוָה אֱלֹהֶיךָ
  choice: Je suis Yahweh, ton Dieu
  rationale: La proposition nominale hébraïque exprime l’identité avec un pronom indépendant emphatique. « Je suis » est naturel en français, et le nom divin est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: הַמַּעַלְךָ
  choice: qui t’ai fait monter
  rationale: Le participe hiphil de עלה présente Yahweh comme celui qui a fait monter Israël d’Égypte. Cette formulation conserve le mouvement ascendant du verbe sans le réduire au seul sens de « faire sortir ».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: du pays d’Égypte
  rationale: La préposition מִן marque ici la provenance. « Du pays d’Égypte » rend naturellement la formule de l’Exode en français.
- source_word: הַרְחֶב פִּיךָ
  choice: Ouvre grand ta bouche
  rationale: L’impératif hiphil de רחב signifie littéralement élargir; avec « bouche », l’expression française idiomatique est « ouvrir grand ».
- source_word: וַאֲמַלְאֵהוּ
  choice: et je la remplirai
  rationale: Le suffixe renvoie à « bouche »; le féminin français impose « la ». Après l’impératif, le verbe peut exprimer la conséquence promise, rendue naturellement par le futur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Valeur de וַאֲמַלְאֵהוּ après l’impératif
  choice: et je la remplirai
  alternative: afin que je la remplisse
  rationale: La coordination peut être comprise comme une promesse de résultat ou comme l’expression du but. Le texte principal retient la promesse, tout en signalant l’autre nuance possible.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque à Israël comme interlocuteur collectif. L’image concrète de la bouche ouverte est conservée.
