  text: וָֽ֭/אֲשַׁלְּחֵ/הוּ בִּ/שְׁרִיר֣וּת לִבָּ֑/ם יֵ֝לְכ֗וּ בְּֽ/מוֹעֲצוֹתֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/012.yaml
  text: So I gave them over to the stubbornness of their heart[c][b][a]; they walked in their own counsels.
translation:
  language: fr
  text: Alors je l’ai livré[a] à l’obstination de leur cœur[b] ; ils ont suivi leurs propres projets[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici un pronom singulier : il désigne Israël comme un peuple collectif ; on peut aussi traduire, en harmonisant avec la suite, « je les ai livrés ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’entêtement » ou « à la volonté obstinée de leur cœur ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ils ont marché selon leurs propres conseils » ou « selon leurs propres desseins ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: Alors je l’ai livré
  rationale: Le hiphil de שׁלח avec suffixe masculin singulier exprime ici l’abandon d’Israël aux conséquences de son refus, plutôt qu’un simple envoi. « Livré » rend cette portée judiciaire tout en conservant le pronom collectif singulier du texte hébreu.
- source_word: בִּשְׁרִירוּת
  choice: à l’obstination
  rationale: שְׁרִירוּת désigne l’entêtement ou l’obstination intérieure. « Obstination » est naturel, précis et digne en français contemporain.
- source_word: לִבָּם
  choice: de leur cœur
  rationale: L’hébreu emploie « cœur » au singulier avec un suffixe pluriel, pour désigner la disposition intérieure collective du peuple. Le français peut conserver cette tournure.
- source_word: יֵלְכוּ
  choice: ils ont suivi
  rationale: הלך a souvent un sens figuré de conduite. Avec le complément exprimant les projets, « suivre » restitue naturellement l’idée de régler sa conduite sur ceux-ci.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: leurs propres projets
  rationale: מוֹעֵצָה peut désigner un conseil, un dessein ou un projet. « Leurs propres projets » exprime clairement qu’ils agissent selon leurs décisions plutôt que selon la volonté de Dieu, sans donner au mot une nuance forcément intrigante.
theological_decisions:
- issue: Passage du singulier collectif au pluriel
  choice: Conserver « je l’ai livré » puis « leur… ils »
  alternative: 'Harmoniser au pluriel : « je les ai livrés… »'
  rationale: Le texte hébreu désigne d’abord Israël par un suffixe masculin singulier, comme une entité collective, puis passe aux formes plurielles. La traduction garde cette tension grammaticale et l’explique en note.
- issue: Portée judiciaire de l’action divine
  choice: « je l’ai livré à »
  alternative: « je l’ai laissé aller » ou « je l’ai renvoyé »
  rationale: Dans le contexte, Dieu abandonne le peuple rebelle à sa propre obstination. « Livré à » rend cette conséquence judiciaire sans ajouter de système doctrinal étranger au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le singulier collectif inhabituel est maintenu pour refléter l’hébreu, avec une note explicative. « Ils ont suivi leurs propres projets » rend idiomatiquement la métaphore de la marche sans archaïsme.
