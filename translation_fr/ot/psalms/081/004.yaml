  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: fr
  text: Car c’est une prescription pour Israël, une ordonnance du Dieu de Jacob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le Dieu de Jacob ». La préposition hébraïque peut se traduire plus formellement ainsi, mais le texte principal exprime le sens probable de source ou d’autorité dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’appel à célébrer formulé au verset précédent; « Car » en rend naturellement la valeur explicative.
- source_word: חֹק
  choice: prescription
  rationale: Le terme désigne ce qui est fixé ou prescrit par une autorité. « Prescription » garde ici la portée juridique et cultuelle sans être excessivement technique.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: La préposition marque ici l’application ou la destination de la prescription au peuple d’Israël.
- source_word: הוּא
  choice: c’est
  rationale: Le pronom renvoie à l’observance commandée dans le contexte; la tournure française « c’est » exprime naturellement la proposition nominale hébraïque.
- source_word: מִשְׁפָּט
  choice: ordonnance
  rationale: Dans ce parallélisme juridique avec חֹק, le mot désigne une règle établie avec autorité plutôt qu’un jugement de condamnation.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: du Dieu de Jacob
  rationale: La préposition peut exprimer l’appartenance, la relation ou l’autorité. « Du Dieu de Jacob » présente naturellement l’ordonnance comme relevant de lui ou venant de lui, tout en conservant le titre d’alliance.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
theological_decisions:
- issue: Rapport entre les deux termes juridiques חֹק et מִשְׁפָּט
  choice: Les distinguer par « prescription » et « ordonnance ».
  alternative: Les rendre par des quasi-synonymes comme « loi » et « décret », ou fondre les deux en une seule idée.
  rationale: L’hébreu emploie deux termes apparentés mais distincts dans un parallélisme poétique. Les conserver tous deux respecte la portée juridique, cultuelle et alliance du verset sans imposer une distinction technique trop précise.
- issue: Valeur de ל dans לֵאלֹהֵי יַעֲקֹב
  choice: Exprimer une relation d’appartenance ou de source par « du Dieu de Jacob ».
  alternative: « pour le Dieu de Jacob »
  rationale: La traduction plus formelle « pour le Dieu de Jacob » demeure possible, mais peut faire entendre que Dieu est simplement le bénéficiaire. Le texte principal reflète la lecture contextuellement probable d’une ordonnance relevant de son autorité, tandis que la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme juridique est conservé au moyen de deux noms distincts, et l’ambiguïté de la préposition hébraïque est signalée en note.
