  text: עֵ֤דוּת בִּֽ/יה֘וֹסֵ֤ף שָׂמ֗/וֹ בְּ֭/צֵאת/וֹ עַל אֶ֣רֶץ מִצְרָ֑יִם שְׂפַ֖ת לֹא יָדַ֣עְתִּי אֶשְׁמָֽע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: fr
  text: 'Il l’établit comme un témoignage en Joseph[a]

    quand il partit contre le pays d’Égypte[b].

    J’entendis une langue que je ne connaissais pas[c] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Joseph représente probablement ici le peuple d’Israël, dans le contexte de l’exode ; le nom hébreu « Joseph » est néanmoins conservé.
    reason: cross_reference
  - marker: b
    text: Ou « quand il parcourut le pays d’Égypte ». La préposition hébraïque peut indiquer ici une action exercée sur le pays ou dirigée contre lui.
    reason: lexical_alternative
  - marker: c
    text: Ou « J’entends une langue que je ne connaissais pas ». Dans ce contexte poétique, le verbe hébreu peut se comprendre au présent ou au passé.
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: témoignage
  rationale: Le nom désigne d’abord un témoignage ou une attestation, tout en pouvant prendre le sens d’ordonnance dans un cadre cultuel ou juridique. « Témoignage » conserve ici sa valeur lexicale sans trancher en faveur de « décret ».
- source_word: בִּיהוֹסֵף
  choice: en Joseph
  rationale: La préposition בְּ est rendue au plus près, et le nom Joseph est conservé plutôt que remplacé par « Israël ». La tournure, poétique, laisse ouverte la portée représentative du nom.
- source_word: שָׂמוֹ
  choice: Il l’établit
  rationale: שׂים signifie mettre, placer ou établir. « Établir comme témoignage » exprime naturellement en français l’instauration durable indiquée par le contexte.
- source_word: בְּצֵאתוֹ
  choice: quand il partit
  rationale: L’infinitif construit précédé de בְּ a une valeur temporelle. « Partir » rend ici le mouvement de sortie sans préciser le référent ambigu du pronom masculin.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: contre le pays d’Égypte
  rationale: עַל peut exprimer une action dirigée contre un lieu, lecture bien adaptée au contexte du jugement sur l’Égypte. Son sens spatial « sur/à travers » demeure possible et est signalé en note.
- source_word: שְׂפַת
  choice: une langue
  rationale: Le sens littéral est « lèvre », mais le mot désigne idiomatiquement la langue ou le langage. « Une langue » est clair et naturel en français.
- source_word: לֹא יָדַעְתִּי
  choice: que je ne connaissais pas
  rationale: Cette formulation rend naturellement l’absence de connaissance préalable exprimée par le parfait hébreu.
- source_word: אֶשְׁמָע
  choice: J’entendis
  rationale: Bien que la forme soit un imperfectif, elle peut recevoir dans cette poésie une valeur narrative passée. Le passé simple convient au registre soutenu du psaume; le présent reste possible et figure en note.
theological_decisions:
- issue: Portée du nom « Joseph »
  choice: Conserver « Joseph » dans le texte, avec sa possible valeur représentative pour le peuple de l’alliance.
  alternative: Remplacer Joseph par Israël, ou y voir plus précisément les tribus du Nord et Éphraïm.
  rationale: L’hébreu nomme explicitement Joseph. Le conserver évite d’imposer au texte une identification plus précise que celle qu’il formule.
- issue: Référent du sujet dans « quand il partit »
  choice: Maintenir le pronom implicite sans identifier explicitement celui qui part.
  alternative: Identifier le sujet à Dieu, ou à Joseph/Israël lors de l’exode.
  rationale: Le suffixe masculin singulier permet plusieurs rattachements dans le contexte. Le français peut préserver cette tension en gardant simplement « il ».
- issue: Changement de locuteur dans le dernier membre
  choice: Conserver la première personne sans nommer celui qui parle.
  alternative: Préciser qu’il s’agit de Dieu ou du psalmiste.
  rationale: Le texte passe abruptement à la première personne et le contexte suivant introduit une parole divine. Ne pas ajouter de désignation explicite respecte la transition poétique et son ambiguïté.
- issue: Valeur temporelle de אֶשְׁמָע
  choice: 'Employer le passé : « J’entendis ».'
  alternative: 'Employer le présent : « J’entends ».'
  rationale: La valeur narrative passée s’accorde avec l’évocation de l’exode, mais la morphologie et la poésie permettent aussi une lecture au présent, conservée en note.
translation_notes:
  register: Français international actuel, digne et poétique. Les trois lignes suivent le parallélisme du verset. « En Joseph » conserve volontairement une formulation marquée afin de ne pas remplacer le nom biblique par une interprétation; les notes rendent explicites les principales ambiguïtés lexicales et temporelles.
