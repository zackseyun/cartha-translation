id: PSA.81.9
reference: Psalms 81:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יִהְיֶ֣ה בְ֭/ךָ אֵ֣ל זָ֑ר וְ/לֹ֥א תִ֝שְׁתַּחֲוֶ֗ה לְ/אֵ֣ל נֵכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/009.yaml
  text: You must have no foreign god among you, and you must not bow down to an alien god[a].
translation:
  language: fr
  text: Il ne doit y avoir au milieu de toi aucun dieu étranger, et tu ne dois pas te prosterner devant un dieu venu d’ailleurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie deux termes très proches pour parler d’un dieu extérieur au culte d’Israël : « étranger » et « venu d’ailleurs ». Cette variation relève du parallélisme poétique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיֶה
  choice: Il ne doit y avoir aucun
  rationale: Avec la négation, cette forme exprime ici une interdiction dans le cadre de l’alliance, et non une simple prédiction.
- source_word: בְּךָ
  choice: au milieu de toi
  rationale: Le pronom est au singulier parce qu’Israël est interpellé collectivement. « Au milieu de toi » conserve cette adresse collective sans suggérer seulement l’intériorité d’un individu.
- source_word: אֵל
  choice: dieu
  rationale: Le parallélisme avec l’interdiction de se prosterner montre qu’il s’agit d’une divinité.
- source_word: זָר
  choice: étranger
  rationale: Le terme désigne ce qui est extérieur au culte reconnu d’Israël et forme un parallélisme avec נֵכָר.
- source_word: תִשְׁתַּחֲוֶה
  choice: tu ne dois pas te prosterner
  rationale: La forme négative a une valeur prohibitive; cette formulation française moderne exprime clairement l’interdiction.
- source_word: לְאֵל
  choice: devant un dieu
  rationale: En français, « se prosterner devant » rend naturellement le geste d’hommage ou d’adoration exprimé avec la préposition לְ.
- source_word: נֵכָר
  choice: venu d’ailleurs
  rationale: Cette expression naturelle conserve la variation poétique par rapport à זָר (« étranger »), sans créer artificiellement une autre catégorie de divinité.
theological_decisions:
- issue: Israël est interpellé par un pronom grammaticalement singulier
  choice: Conserver le singulier « toi/tu » tout en traduisant בְּךָ par « au milieu de toi »
  alternative: Employer un pluriel (« parmi vous ») ou une formulation plus individuelle (« en toi »)
  rationale: L’hébreu traite collectivement Israël comme une seule entité. Le singulier français préserve cette forme d’adresse, tandis que « au milieu de toi » en indique naturellement la portée communautaire.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve l’adresse collective au singulier, la force prohibitive des deux propositions et la variation lexicale du parallélisme hébreu.
