id: PSA.81.2
reference: Psalms 81:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְֽׂאוּ זִ֭מְרָה וּ/תְנוּ תֹ֑ף כִּנּ֖וֹר נָעִ֣ים עִם נָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/002.yaml
  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: fr
  text: Entonnez un chant et faites résonner le tambourin[a], la lyre mélodieuse avec la harpe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu תֹף désigne un instrument de percussion, probablement un tambour sur cadre.
    reason: cultural_note
  - marker: b
    text: La distinction exacte entre les deux instruments à cordes hébreux rendus ici par « lyre » (כִּנּוֹר) et « harpe » (נָבֶל) demeure incertaine; d’autres désignations, comme « cithare » ou « luth », sont parfois proposées.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Entonnez
  rationale: L’impératif de נשׂא signifie littéralement « élevez/portez », mais, avec un chant, il invite idiomatiquement à commencer ou à faire entendre celui-ci. « Entonnez » est naturel en français et conserve cette impulsion musicale.
- source_word: זִמְרָה
  choice: un chant
  rationale: Le nom désigne ici un chant ou une musique de louange. « Chant » convient au contexte sans préciser indûment qu’il s’agit d’un psaume.
- source_word: וּתְנוּ
  choice: faites résonner
  rationale: Le verbe signifie littéralement « donnez », mais, associé au tambourin, il demande d’en produire le son. « Faites résonner » rend clairement cette valeur contextuelle.
- source_word: תֹף
  choice: tambourin
  rationale: Il s’agit d’un instrument de percussion de type tambour sur cadre. « Tambourin » est un équivalent moderne clair, contrairement à « tambour de basque », plus daté ou régionalement marqué.
- source_word: כִּנּוֹר
  choice: lyre
  rationale: Ce terme désigne probablement un instrument ancien à cordes de type lyre. Ce choix permet aussi de le distinguer de נָבֶל.
- source_word: נָעִים
  choice: mélodieuse
  rationale: L’adjectif signifie « agréable, plaisant ». Dans ce contexte musical, « mélodieuse » exprime naturellement la qualité agréable de l’instrument ou de sa sonorité.
- source_word: עִם
  choice: avec
  rationale: La préposition marque ici l’association ou l’accompagnement des instruments.
- source_word: נָבֶל
  choice: harpe
  rationale: Le mot désigne un instrument à cordes distinct du כִּנּוֹר, mais son identification précise reste incertaine. « Harpe » est l’équivalent français courant, avec une note signalant l’incertitude organologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Les impératifs pluriels gardent l’appel collectif du texte. « Entonnez » et « faites résonner » privilégient une expression musicale naturelle sans effacer la valeur des termes hébreux; les noms d’instruments suivent les équivalents usuels tout en signalant leur identification incertaine.
