  yaml_path: translation/ot/psalms/081/000.yaml
  text: 'For the choir director: according to the Gittith[a]. Of Asaph.'
translation:
  language: fr
  text: Pour le chef de chœur. Sur la Guittith[a]. D’Asaph.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Guittith. Ce terme désigne probablement un mode musical, un instrument ou le nom d’un air, mais son sens précis demeure incertain. Il pourrait notamment s’agir d’un instrument associé à Gath ou d’une mélodie particulière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Pour le chef de chœur
  rationale: Dans les titres des psaumes, cette forme désigne vraisemblablement le responsable de l’exécution musicale. « Chef de chœur » est clair, courant et fonctionnel, sans recourir à une formulation archaïque.
- source_word: עַל
  choice: Sur
  rationale: Dans ce contexte musical, la préposition introduit probablement une indication d’instrument, d’air ou de mode d’exécution. « Sur » conserve la formulation concise et l’ambiguïté de l’hébreu.
- source_word: הַגִּתִּית
  choice: la Guittith
  rationale: 'Le référent exact est incertain : instrument, air musical ou désignation liée à Gath. La translittération évite de trancher sans preuve suffisante.'
- source_word: לְאָסָף
  choice: D’Asaph
  rationale: Le לְ devant le nom peut marquer l’auteur, l’appartenance, l’association ou la destination. « D’Asaph » reste concis et préserve mieux cette latitude que « par Asaph » ou « pour Asaph ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le titre conserve la brièveté de l’hébreu et ne résout pas les incertitudes relatives à la Guittith ni au rapport entre le psaume et Asaph.
