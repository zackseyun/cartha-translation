  yaml_path: translation/ot/psalms/081/016.yaml
  text: But he would feed him with the finest wheat[b][a], and with honey from the rock I would satisfy you.
translation:
  language: fr
  text: Mais il le nourrirait du meilleur blé[a][b], et je te rassasierais de miel venant du rocher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la graisse du blé » ; cet idiome hébreu désigne le blé le plus riche ou le meilleur.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu change de personne : « il le nourrirait… je te rassasierais ». Le singulier renvoie vraisemblablement à Israël considéré comme un peuple.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּאֲכִילֵהוּ
  choice: il le nourrirait
  rationale: Le hiphil de אכל signifie « faire manger, nourrir ». Dans la suite de la condition non réalisée du verset précédent, le conditionnel convient. Le sujet et le complément masculins singuliers sont conservés.
- source_word: מֵחֵלֶב חִטָּה
  choice: du meilleur froment
  rationale: חֵלֶב signifie littéralement « graisse », mais désigne ici par idiome la part la plus riche ou la meilleure. « Le meilleur froment » restitue naturellement cette idée dans un registre poétique et digne.
- source_word: וּמִצּוּר
  choice: du miel tiré du rocher
  rationale: צוּר désigne un rocher ou un roc. La formulation conserve l'image concrète d'une abondance provenant d'un lieu inattendu.
- source_word: דְּבַשׁ
  choice: miel
  rationale: C'est le sens usuel du terme et le contexte ne justifie pas de le généraliser en « douceur » ou en « sirop ».
- source_word: אַשְׂבִּיעֶךָ
  choice: je te rassasierais
  rationale: Le hiphil de שבע exprime l'action de rassasier ou de combler pleinement. La première personne du sujet et la deuxième personne du complément sont maintenues, tout comme le conditionnel contextuel.
theological_decisions:
- issue: Changement de personne dans le verset
  choice: Conserver « il le nourrirait … je te rassasierais ».
  alternative: Harmoniser en « je te nourrirais … je te rassasierais ».
  rationale: Le texte massorétique passe de la troisième personne masculine singulière à la première personne s'adressant à une deuxième personne singulière. Préserver ce changement respecte la tension du texte sans imposer une harmonisation; les pronoms singuliers renvoient vraisemblablement à Israël envisagé collectivement.
- issue: Images d'abondance
  choice: Maintenir concrètement le froment et le miel tiré du rocher.
  alternative: Interpréter le rocher comme une désignation métaphorique de Dieu dans le texte principal.
  rationale: Le verset dépeint poétiquement la provision divine. Traduire les images sans les allégoriser évite d'introduire une interprétation théologique dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Froment » maintient la coloration poétique et agricole tout en restant intelligible. Le changement de personne de l’hébreu est volontairement conservé et expliqué en note.
