reference: Psalms 81:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: fr
  text: Dans la détresse, tu as appelé, et je t’ai délivré ; je t’ai répondu dans le lieu caché du tonnerre[a] ; je t’ai mis à l’épreuve aux eaux de Meriba[b]. Séla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « depuis le lieu caché du tonnerre » ou « dans le secret du tonnerre ». L’image hébraïque évoque probablement la présence cachée de Dieu dans l’orage.'
    reason: lexical_alternative
  - marker: b
    text: Meriba rappelle les épisodes du désert où le peuple s’est querellé au sujet de l’eau et où il a été mis à l’épreuve (Exode 17.1-7 ; Nombres 20.1-13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: Dans la détresse
  rationale: צָרָה désigne la détresse, l’adversité ou l’épreuve. « Dans la détresse » est direct, naturel et ne précise pas indûment la nature du danger.
- source_word: קָרָאתָ
  choice: tu as appelé
  rationale: קרא exprime ici un appel au secours. Le complément reste implicite, comme en hébreu.
- source_word: וָאֲחַלְּצֶךָּ
  choice: et je t’ai délivré
  rationale: Le hifil de חלץ signifie retirer d’un danger, délivrer ou secourir. « Délivré » convient au registre poétique et au contexte de l’Exode sans ajouter de détail.
- source_word: אֶעֶנְךָ
  choice: je t’ai répondu
  rationale: ענה a ici son sens courant de répondre. La formulation française suit directement la relation entre l’appel d’Israël et la réponse divine.
- source_word: בְּסֵתֶר רַעַם
  choice: dans le lieu caché du tonnerre
  rationale: סֵתֶר peut désigner un lieu caché, un abri ou le secret, tandis que בְּ marque normalement la localisation mais peut, dans ce contexte, être compris comme indiquant la provenance. La traduction conserve l’image énigmatique de la présence divine voilée dans l’orage.
- source_word: אֶבְחָנְךָ
  choice: je t’ai mis à l’épreuve
  rationale: בחן signifie éprouver ou examiner afin de manifester la qualité de quelqu’un. « Mettre à l’épreuve » est idiomatique et ne réduit pas l’action à une punition.
- source_word: עַל מֵי מְרִיבָה
  choice: aux eaux de Meriba
  rationale: עַל prend ici une valeur locative. « Aux eaux de Meriba » conserve le nom propre et l’allusion au récit du désert.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens précis de ce terme liturgique demeure incertain ; il est donc translittéré plutôt que traduit conjecturalement.
theological_decisions:
- issue: Lieu et portée de la réponse divine dans le tonnerre
  choice: Conserver l’image de Dieu répondant « dans le lieu caché du tonnerre » sans identifier explicitement la scène au Sinaï.
  alternative: « Depuis le lieu caché du tonnerre », qui présente plus nettement ce lieu comme la source de la voix divine.
  rationale: Le texte évoque probablement une théophanie liée à l’orage et peut rappeler le Sinaï, mais il ne nomme pas cet événement. La formulation maintient à la fois la présence et le caractère caché de Dieu.
- issue: Sens de l’épreuve à Meriba
  choice: Employer « mis à l’épreuve » sans préciser si l’épreuve est punitive, probatoire ou révélatrice.
  alternative: « Je t’ai examiné », formulation moins naturelle et davantage centrée sur l’évaluation.
  rationale: Le verbe décrit une mise à l’épreuve, mais le verset n’en explicite pas ici la finalité. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse divine au peuple personnifié. La ponctuation conserve la progression des trois actes divins, et les termes énigmatiques « lieu caché du tonnerre » et « Séla » ne sont pas paraphrasés.
