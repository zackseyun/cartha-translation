source:
  edition: WLC
  text: כִּ֭/מְעַט אוֹיְבֵי/הֶ֣ם אַכְנִ֑יעַ וְ/עַ֥ל צָ֝רֵי/הֶ֗ם אָשִׁ֥יב יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/014.yaml
  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: fr
  text: En peu de temps[a], je soumettrais leurs ennemis et je tournerais ma main contre leurs adversaires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Bientôt ». L’hébreu peut désigner un bref délai ou la proximité dans le temps ; plus rarement ici, il pourrait signifier « presque ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « je ramènerais ma main sur leurs adversaires » : image de la puissance de Dieu dirigée contre eux pour les juger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: En peu de temps
  rationale: Dans ce contexte, l’expression indique vraisemblablement un bref délai. Cette formulation conserve la nuance temporelle sans réduire le sens à une simple idée de rapidité.
- source_word: אוֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Rendu courant et clair du terme désignant ceux qui s’opposent à Israël.
- source_word: אַכְנִיעַ
  choice: je soumettrais
  rationale: Le hifil de כנע exprime ici le fait de faire plier ou de réduire à la soumission. Le conditionnel français rend la valeur contingente donnée par le contexte précédent.
- source_word: צָרֵיהֶם
  choice: leurs adversaires
  rationale: Ce choix maintient la distinction lexicale avec « ennemis » tout en exprimant une opposition hostile.
- source_word: אָשִׁיב יָדִי
  choice: je tournerais ma main contre
  rationale: La traduction conserve l’image de la main divine dirigée contre les adversaires, tout en restant compréhensible en français moderne.
theological_decisions:
- issue: Modalité de l’action divine dans le contexte
  choice: 'Employer le conditionnel : « je soumettrais » et « je tournerais »'
  alternative: 'Employer le futur simple : « je soumettrai » et « je tournerai »'
  rationale: Les formes verbales hébraïques peuvent être rendues au futur, mais le contexte évoque ce que Dieu ferait si son peuple l’écoutait. Le conditionnel préserve clairement cette dépendance sans effacer la force de la promesse.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme entre « ennemis » et « adversaires », ainsi que la métaphore de la main divine.
