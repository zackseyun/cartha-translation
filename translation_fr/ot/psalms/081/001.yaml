  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: fr
  text: Chantez avec joie pour Dieu, notre force ; poussez des cris d’allégresse pour le Dieu de Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Chantez avec joie
  rationale: L’impératif pluriel de רנן exprime une louange vocale jubilante ; cette formulation restitue naturellement en français sa dimension à la fois musicale et joyeuse.
- source_word: לֵאלֹהִים
  choice: pour Dieu
  rationale: La préposition ל introduit ici le destinataire de la louange. Dans ce contexte, אֱלֹהִים désigne sans ambiguïté le Dieu d’Israël au singulier.
- source_word: עוּזֵּנוּ
  choice: notre force
  rationale: עוֹז désigne la force ou la puissance. « Notre force » conserve l’image directe sans l’interpréter comme « refuge ».
- source_word: הָרִיעוּ
  choice: poussez des cris d’allégresse
  rationale: Le hiphil de רוע/ריע désigne une forte acclamation, souvent joyeuse dans un contexte de louange. La tournure choisie exprime clairement l’intensité et le caractère jubilant de l’appel.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: pour le Dieu de Jacob
  rationale: La forme construite אֱלֹהֵי suivie de יַעֲקֹב signifie « Dieu de Jacob » ; l’article défini est requis par l’usage français.
theological_decisions:
- issue: Sens de אֱלֹהִים dans les deux membres parallèles
  choice: Dieu / le Dieu de Jacob
  alternative: des dieux
  rationale: 'Bien que la forme soit morphologiquement plurielle, son emploi et le parallèle « Dieu de Jacob » indiquent un référent singulier : le Dieu d’Israël.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé, avec deux impératifs pluriels distincts et une ponctuation qui marque les deux membres du vers.
