id: PSA.81.11
reference: Psalms 81:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹא שָׁמַ֣ע עַמִּ֣/י לְ/קוֹלִ֑/י וְ֝/יִשְׂרָאֵ֗ל לֹא אָ֥בָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: fr
  text: Mais mon peuple n’a pas écouté ma voix[a], et Israël n’a pas voulu de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « n’a pas obéi à ma voix ». Le verbe hébreu peut signifier entendre, écouter ou obéir. La seconde ligne peut aussi se traduire : « et Israël n’a pas consenti à m’écouter » ou « et Israël m’a refusé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Mais… n’a pas
  rationale: La conjonction introduit ici un contraste avec l’appel et la promesse qui précèdent; « mais » exprime naturellement cette valeur adversative.
- source_word: שָׁמַע
  choice: a écouté
  rationale: Avec « ma voix », le verbe désigne le fait d’écouter ou de prêter attention. Ce choix conserve l’expression concrète sans lui substituer d’emblée l’idée d’obéissance.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Traduction directe qui maintient la désignation relationnelle et l’écho d’alliance.
- source_word: לְקוֹלִי
  choice: ma voix
  rationale: « Voix » conserve la formulation personnelle de l’hébreu; en français, « écouter ma voix » rend naturellement la construction.
- source_word: וְיִשְׂרָאֵל
  choice: et Israël
  rationale: Le nom propre et la conjonction sont maintenus afin de préserver le parallélisme entre « mon peuple » et « Israël ».
- source_word: לֹא אָבָה
  choice: n’a pas voulu
  rationale: אָבָה exprime la volonté ou le consentement. « N’a pas voulu » reste proche du sens lexical et garde ouverte la portée précise du refus.
- source_word: לִי
  choice: de moi
  rationale: Après אָבָה, le pronom introduit la personne envers laquelle Israël ne consent pas. « N’a pas voulu de moi » est idiomatique en français et évite d’ajouter explicitement « obéir », absent du texte.
theological_decisions:
- issue: Identification d’Israël comme peuple de Dieu
  choice: Maintenir en parallèle « mon peuple » et « Israël ».
  alternative: 'Fusionner les deux désignations: « Mon peuple, Israël ».'
  rationale: L’hébreu présente deux membres poétiques distincts. Leur maintien conserve la structure et l’accent relationnel sans compression interprétative.
- issue: Portée de l’absence de volonté d’Israël
  choice: « Israël n’a pas voulu de moi »
  alternative: « Israël n’a pas voulu m’obéir »
  rationale: Le contexte implique le refus de répondre à Dieu, possiblement par l’obéissance, mais l’hébreu dit littéralement qu’Israël n’a pas consenti « à moi/pour moi ». La traduction retenue préserve cette tension relationnelle sans préciser davantage que le texte.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique est conservé. « N’a pas voulu de moi » est volontairement plus proche et moins explicatif que « n’a pas voulu m’obéir », tout en restant naturel.
