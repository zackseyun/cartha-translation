  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: fr
  text: Autant l’est est éloigné de l’ouest, autant il a éloigné de nous nos transgressions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « transgressions » peut aussi signifier « rébellions » ou « offenses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: Autant … est loin … autant
  rationale: La construction exprime une comparaison de distance ou d’étendue. Cette tournure française conserve explicitement la corrélation entre la distance est-ouest et l’éloignement des révoltes.
- source_word: מִזְרָח
  choice: l’est
  rationale: Le nom désigne la direction du lever du soleil. « L’est » est le terme courant en français moderne et forme une paire naturelle avec « l’ouest ».
- source_word: מִמַּעֲרָב
  choice: de l’ouest
  rationale: La préposition marque ici le point dont l’est est séparé; « de l’ouest » restitue naturellement la comparaison spatiale.
- source_word: הִרְחִיק
  choice: il a éloigné
  rationale: Le hifil de רחק signifie rendre lointain ou mettre à distance. « Il a éloigné » préserve le sens causatif ainsi que l’accompli du verbe hébreu.
- source_word: מִמֶּנּוּ
  choice: de nous
  rationale: Le suffixe pronominal est à la première personne du pluriel et indique explicitement la séparation d’avec la communauté qui parle.
- source_word: פְּשָׁעֵינוּ
  choice: nos révoltes
  rationale: פשע désigne des actes de rébellion ou de transgression. « Révoltes » garde la dimension volontaire et relationnelle du terme, tandis qu’une note signale d’autres traductions possibles.
theological_decisions:
- issue: Métaphore spatiale du pardon
  choice: Conserver la comparaison entre la distance de l’est à l’ouest et l’éloignement des révoltes.
  alternative: Paraphraser simplement que Dieu a entièrement pardonné les péchés.
  rationale: L’hébreu exprime le pardon par une image spatiale forte sans en expliquer le mécanisme. La conserver respecte à la fois l’image et sa portée théologique.
translation_notes:
  register: Français moderne, clair et digne. Les points cardinaux « est » et « ouest » sont préférés aux termes plus littéraires « orient » et « occident ». La structure corrélative « autant… autant » garde le parallélisme poétique hébreu.
