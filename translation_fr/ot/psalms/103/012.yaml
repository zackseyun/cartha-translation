  naturalness: La tournure corrélative est compréhensible, mais « l’est est loin de l’ouest » est un peu moins fluide que « l’est est éloigné de l’ouest ». La révision conserve le parallélisme et emploie une formulation française moderne et digne.
  terminology: « Transgressions » est le terme français établi et suffisamment précis pour פשע, qui désigne des violations/rebellions envers Dieu. Une note conserve les possibilités lexicales « rébellions » et « offenses », sans réduire le terme à l’une d’elles.
