lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: בַּשָּׁמַיִם
  choice: dans les cieux
  rationale: Conserve le pluriel hébreu et convient au registre poétique élevé.
- source_word: הֵכִין
  choice: a établi
  rationale: Exprime l’idée de mettre fermement en place, particulièrement adaptée à un trône.
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: Équivalent naturel et précis dans ce contexte royal.
- source_word: וּמַלְכוּתוֹ
  choice: et sa royauté
  rationale: Préserve ici le sens abstrait de pouvoir ou règne royal et évite l’image plus territoriale que peut suggérer « royaume ».
- source_word: בַּכֹּל
  choice: sur tout
  rationale: Avec le verbe « dominer », indique naturellement l’étendue universelle de l’autorité.
- source_word: מָשָׁלָה
  choice: domine
  rationale: Le présent rend en français l’assertion générale et durable exprimée par l’accompli hébreu dans ce contexte poétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Préserve le nom personnel révélé dans le texte hébreu sans lui substituer un titre.
- issue: Sens de מַלְכוּת
  choice: sa royauté
  alternative: son royaume / son règne
  rationale: « Royauté » permet au sujet grammatical de dominer sur tout et conserve la portée abstraite du terme, tout en signalant les autres lectures possibles en note.
- issue: Valeur aspectuelle de מָשָׁלָה
  choice: domine
  alternative: a dominé
  rationale: Dans cette affirmation poétique, l’accompli décrit adéquatement une réalité souveraine établie et durable; le présent français communique cette portée sans la limiter au passé.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme royal du verset et maintient l’ambiguïté sémantique de מַלְכוּת par une note.
