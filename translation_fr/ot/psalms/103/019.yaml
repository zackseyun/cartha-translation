  text: Yahweh a établi son trône dans les cieux[a], et sa royauté[b] domine sur tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au ciel ». L’hébreu est au pluriel : « dans les cieux »'
