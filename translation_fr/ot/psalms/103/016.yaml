  text: כִּ֤י ר֣וּחַ עָֽבְרָה בּ֣/וֹ וְ/אֵינֶ֑/נּוּ וְ/לֹא יַכִּירֶ֖/נּוּ ע֣וֹד מְקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/016.yaml
  text: For the wind passes over it[a], and it is gone[c][b], and its place knows it no more.
translation:
  language: fr
  text: 'Car le vent passe sur elle[a] : elle disparaît[b], et le lieu où elle était ne la reconnaît plus[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le souffle » ou « l’esprit » ; l’image de l’herbe et de la fleur favorise ici « le vent ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle n’est plus ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu personnifie le lieu en disant qu’il ne « reconnaît » plus ce qui a disparu.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’image précédente, où la vie humaine est comparée à l’herbe et à la fleur des champs.
- source_word: רוּחַ
  choice: le vent
  rationale: Dans ce contexte poétique d’herbe et de fleur, le sens « vent » est le plus naturel, tout en laissant les autres sens possibles en note.
- source_word: עָבְרָה בּוֹ
  choice: passe sur elle
  rationale: Rend simplement l’action du vent et emploie le présent de vérité générale. Le féminin français renvoie naturellement à « la fleur » du verset précédent.
- source_word: וְאֵינֶנּוּ
  choice: elle disparaît
  rationale: Expression française naturelle du sens contextuel de l’hébreu littéral « elle n’est plus ».
- source_word: וְלֹא יַכִּירֶנּוּ עוֹד מְקוֹמוֹ
  choice: et le lieu où elle était ne la reconnaît plus
  rationale: Préserve la personnification hébraïque du lieu qui ne reconnaît plus la fleur, tout en explicitant naturellement en français le rapport exprimé par « son lieu ».
