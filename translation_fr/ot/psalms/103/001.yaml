  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: fr
  text: 'De David.


    Bénis Yahweh, ô mon âme,


    et que tout ce qui est en moi[a]


    bénisse son saint nom !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes mes parties intérieures » ; autre traduction possible : « tout mon être intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ devant le nom de David indique une relation davidique sans préciser à elle seule s’il s’agit de l’auteur, du destinataire ou d’une autre association. « De David » demeure naturel et conserve cette ambiguïté.
- source_word: בָּרֲכִי
  choice: Bénis
  rationale: Le piel de ברך signifie ici « bénir ». Le psalmiste s’adresse à sa propre âme et l’appelle à bénir Yahweh ; « bénis » conserve cette formulation plutôt que de l’interpréter simplement par « loue ».
- source_word: נַפְשִׁי
  choice: ô mon âme
  rationale: נפש peut désigner l’âme, la vie, la personne ou l’être intérieur. Dans cette apostrophe poétique, « ô mon âme » rend clairement l’adresse à soi-même dans un registre digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », qui préserve le nom divin personnel au lieu de lui substituer un titre.
- source_word: וְכָל קְרָבַי
  choice: et que tout ce qui est en moi
  rationale: Le pluriel possessif קְרָבַי désigne littéralement les parties intérieures, et par extension tout l’être intérieur. Cette formulation française actuelle exprime la totalité intérieure sans donner au vers une tonalité anatomique.
- source_word: שֵׁם קָדְשׁוֹ
  choice: son saint nom
  rationale: L’expression construite signifie littéralement « le nom de sa sainteté » ; « son saint nom » en donne l’équivalent idiomatique naturel en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
- issue: Rapport entre l’âme et les parties intérieures
  choice: Deux aspects parallèles de l’appel que le psalmiste s’adresse à lui-même
  alternative: Identifier techniquement l’âme à une composante distincte de l’être humain
  rationale: Le parallélisme poétique appelle l’ensemble de l’être intérieur à bénir Dieu. La traduction ne transforme pas cette poésie en définition doctrinale de la composition de l’être humain.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe « ô mon âme » conserve la force du discours intérieur, tandis que le subjonctif « que… bénisse » explicite naturellement en français le verbe sous-entendu dans le second membre hébreu.
