source:
  edition: WLC
  text: לֹֽא לָ/נֶ֥צַח יָרִ֑יב וְ/לֹ֖א לְ/עוֹלָ֣ם יִטּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/009.yaml
  text: He will not contend forever[b][a], nor will he keep his anger for all time.
translation:
  language: fr
  text: 'Il ne cherche pas querelle sans fin[a],

    il ne garde pas rancune pour toujours[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il n’accusera pas toujours ». Le verbe peut évoquer une querelle, une accusation ou une action en justice.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le verbe signifie « garder » ou « conserver » ; dans ce contexte, il évoque le fait d’entretenir du ressentiment ou de la colère.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: sans fin
  rationale: Avec לְ, נֶצַח exprime ici une durée indéfiniment prolongée. « Sans fin » est naturel en français et maintient le parallélisme avec « pour toujours ».
- source_word: יָרִיב
  choice: contestera
  rationale: Le verbe ריב peut désigner le fait de contester, d'accuser ou de plaider une cause. « Contestera » conserve la nuance de différend ou de mise en cause sans imposer un cadre judiciaire précis.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: עוֹלָם désigne une durée indéfinie ou perpétuelle. « Pour toujours » rend clairement cette valeur dans le second membre.
- source_word: יִטּוֹר
  choice: gardera rancune
  rationale: Le verbe נטר signifie garder ou conserver et, employé absolument dans ce contexte, évoque le ressentiment ou la colère que l'on entretient. L'expression française « garder rancune » en donne naturellement le sens idiomatique.
theological_decisions:
- issue: Faut-il expliciter ce que Dieu garde ?
  choice: Employer l'expression idiomatique « garder rancune » sans ajouter explicitement « sa colère ».
  alternative: « Il ne gardera pas sa colère pour toujours. »
  rationale: L'hébreu n'exprime aucun complément après יִטּוֹר. « Garder rancune » transmet en français la valeur contextuelle du verbe tout en évitant d'ajouter le complément explicite « sa colère ».
translation_notes:
  register: Français moderne, sobre et poétique. Les deux membres parallèles restent brefs ; « sans fin » et « pour toujours » évitent une répétition mécanique tout en rendant les deux expressions hébraïques de durée.
