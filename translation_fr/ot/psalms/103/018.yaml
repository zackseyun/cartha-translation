  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: fr
  text: pour ceux qui gardent son alliance[a] et qui se souviennent de ses préceptes[b] afin de les mettre en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « observent son alliance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ses prescriptions » ou « ses instructions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: ceux qui gardent
  rationale: Le participe de שׁמר exprime l’idée de garder, préserver ou observer. « Gardent » convient naturellement à l’alliance et conserve la nuance de vigilance fidèle.
- source_word: בְרִיתוֹ
  choice: son alliance
  rationale: בְּרִית désigne ici l’alliance de Dieu avec son peuple ; « alliance » en préserve la portée biblique et théologique.
- source_word: וּלְזֹכְרֵי
  choice: et se souviennent
  rationale: זכר indique le souvenir attentif, orienté ici vers l’obéissance. « Se souviennent » garde le vocabulaire biblique sans incorporer prématurément l’idée d’action, exprimée ensuite.
- source_word: פִקֻּדָיו
  choice: ses préceptes
  rationale: פִּקּוּדִים désigne les prescriptions confiées par Dieu. « Préceptes » est précis et permet de distinguer ce terme d’autres mots hébreux rendus par « commandements », « lois » ou « règles ».
- source_word: לַעֲשׂוֹתָם
  choice: afin de les mettre en pratique
  rationale: L’infinitif avec לְ relie le souvenir des préceptes à leur accomplissement. « Mettre en pratique » rend idiomatiquement עשה lorsqu’il a pour objet des prescriptions, tandis que « afin de » exprime la valeur finale ou orientée vers le résultat.
theological_decisions:
- issue: Portée pratique du souvenir des préceptes
  choice: se souviennent de ses préceptes afin de les mettre en pratique
  alternative: se souviennent de ses préceptes pour les accomplir
  rationale: 'La formulation maintient le lien syntaxique entre mémoire et action : le souvenir visé est une attention qui conduit à l’obéissance. Elle n’ajoute aucune théorie du mérite, mais conserve la caractérisation donnée par le texte.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste un complément introduit par « pour », conformément à son rôle syntaxique dans le contexte du verset précédent. « Mettre en pratique » est plus naturel en français courant que le calque « les faire ».
