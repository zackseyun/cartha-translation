  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/000.yaml
  text: Of David. Bless the LORD, O my soul, and all that is within me[a], bless his holy name.
translation:
  language: fr
  text: De David. Bénis l’Éternel, ô mon âme ! Que tout ce qui est en moi[a] bénisse son saint nom !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « toutes mes parties intérieures » ou « tout mon être intérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres de psaumes peut indiquer l’auteur, l’appartenance, la dédicace ou le lien avec David. « De David » conserve utilement cette concision et une part de l’ambiguïté.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Que tout mon être bénisse
  rationale: נֶפֶשׁ désigne ici la personne intérieure s’adressant à elle-même. « Tout mon être » est naturel en français et évite que « mon âme » soit compris comme une partie strictement distincte du corps.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel du tétragramme, distinct du titre אֲדֹנָי et adapté à une lecture publique courante.
- source_word: כָל־קְרָבַי
  choice: tout ce qui est en moi
  rationale: Littéralement « toutes mes parties intérieures » ; l’expression française retenue transmet naturellement l’idée de l’ensemble de l’être intérieur.
- source_word: שֵׁם קָדְשׁוֹ
  choice: son saint nom
  rationale: Traduction directe qui conserve le langage biblique du nom comme expression de l’identité et de la réputation de Dieu.
theological_decisions:
- issue: Portée de נֶפֶשׁ dans l’appel à la louange
  choice: tout mon être
  alternative: mon âme
  rationale: Le contexte met en parallèle נַפְשִׁי avec « tout ce qui est en moi » ; la traduction choisie exprime cette totalité sans imposer une anthropologie dualiste.
- issue: Valeur du titre לְדָוִד
  choice: De David
  alternative: Pour David / Au sujet de David
  rationale: La formule française traditionnelle reste assez ouverte pour ne pas trancher explicitement entre auteur, dédicataire ou association davidique.
translation_notes:
  register: Français moderne, digne et adapté à la récitation. La répétition de « bénisse » reproduit la structure exhortative hébraïque. Le marqueur [a] est placé immédiatement après l’expression qu’il précise.
