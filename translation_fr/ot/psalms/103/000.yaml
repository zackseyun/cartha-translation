  naturalness: « Bénis l’Éternel, ô mon âme ! » est une formulation française claire, idiomatique dans le registre psalmique et fidèle à l’apostrophe du texte. Le second membre, « Que tout ce qui est en moi bénisse son saint nom ! », reste naturel et conserve la structure exhortative.
  terminology: « De David » préserve l’ambiguïté du לְ des suscriptions. « L’Éternel » est un rendu français établi du tétragramme. « Mon âme » est ici requis par la forme vocative et impérative du texte; il ne tranche pas une anthropologie, tandis que la note explicite adéquatement l’expression distincte « toutes mes parties intérieures ».
