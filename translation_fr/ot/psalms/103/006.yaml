id: PSA.103.6
reference: Psalms 103:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: fr
  text: Yahvé accomplit des actes justes et exerce la justice en faveur de tous ceux qu’on opprime[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahvé accomplit des œuvres de justice et des jugements pour tous les opprimés. »'
    reason: Cette traduction plus formelle fait ressortir le pluriel de צְדָקוֹת et de מִשְׁפָּטִים ainsi que la possibilité de comprendre le second terme comme des jugements ou des décisions judiciaires.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: accomplit
  rationale: Le participe qal décrit l’action caractéristique et continue de Yahvé. Le présent français « accomplit » exprime naturellement cette valeur habituelle.
- source_word: צְדָקוֹת
  choice: des actes justes
  rationale: Le pluriel peut désigner des manifestations concrètes de justice ou de droiture. « Des actes justes » conserve cette valeur concrète sans le confondre avec מִשְׁפָּטִים.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante translittère le nom divin plutôt que de lui substituer un titre.
- source_word: וּמִשְׁפָּטִים
  choice: et exerce la justice
  rationale: Le pluriel désigne ici des décisions ou interventions judiciaires. La formulation collective « exerce la justice » est claire en français moderne et complète « des actes justes ».
- source_word: לְכָל
  choice: en faveur de tous
  rationale: La préposition לְ marque ici les bénéficiaires de l’action; « en faveur de » l’explicite naturellement.
- source_word: עֲשׁוּקִים
  choice: ceux qu’on opprime
  rationale: Le participe passif désigne les personnes qui subissent l’oppression ou l’exploitation. Cette formulation conserve le sens passif et reste naturelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. Sa translittération française préserve ce nom au lieu de le remplacer par un titre.
- issue: Relation entre צְדָקוֹת et מִשְׁפָּטִים
  choice: des actes justes et exerce la justice
  alternative: des œuvres de justice et des jugements
  rationale: 'Le rendu principal maintient deux notions apparentées mais distinctes : les actes conformes à la justice et les interventions judiciaires. Il évite toutefois une formulation française excessivement littérale.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé sans employer une tournure artificielle; « en faveur de » clarifie la relation bénéficiaire.
