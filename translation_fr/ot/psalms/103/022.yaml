  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: fr
  text: 'Vous toutes, ses œuvres,

    bénissez Yahweh

    en tous les lieux où s’exerce son pouvoir.


    Bénis Yahweh, ô mon âme !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: Bénissez / Bénis
  rationale: Les deux impératifs du verbe ברך sont conservés afin de rendre le refrain et l’inclusion du psaume; le premier est au pluriel, le second au féminin singulier parce qu’il s’adresse à נַפְשִׁי.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français du nom divin יהוה, qui préserve ici le nom propre présent dans le texte hébreu.
- source_word: כָּל מַעֲשָׂיו
  choice: vous toutes, ses œuvres
  rationale: « Ses œuvres » peut désigner tout ce que Dieu fait ou a créé. L’ajout vocatif « vous toutes » explicite naturellement en français que ces œuvres sont les destinataires de l’impératif pluriel, sans en modifier le référent.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: en tous les lieux où s’exerce son pouvoir
  rationale: Cette formulation conserve la portée spatiale de מְקֹמוֹת et rend מֶמְשָׁלָה comme autorité souveraine, sans réduire le sens à un royaume géographique.
- source_word: נַפְשִׁי
  choice: ô mon âme
  rationale: Le vocatif exprime l’adresse du psalmiste à lui-même et garde la dignité poétique du refrain.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; « Yahweh » maintient la distinction entre le nom propre divin et un titre, sans ajouter d’interprétation confessionnelle.
- issue: Portée de מֶמְשַׁלְתּוֹ
  choice: son pouvoir
  alternative: sa domination
  rationale: « Pouvoir » désigne ici l’autorité souveraine de Dieu. La relative « où s’exerce » communique que l’appel s’étend partout où règne cette autorité, sans suggérer une oppression.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme impératif est préservé; « vous toutes » évite que « ses œuvres » soit pris pour un second complément d’objet. Mise en vers légère pour faire entendre les trois mouvements de l’hébreu.
