source:
  edition: WLC
  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: fr
  text: Car, aussi haut que les cieux sont au-dessus de la terre, aussi puissant est son amour fidèle envers ceux qui le craignent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa bonté », « sa miséricorde » ou « sa loyauté d’alliance ». Le mot hébreu חֶסֶד désigne un amour bienveillant, constant et loyal dans une relation d’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente et convient au registre poétique.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל הָאָרֶץ
  choice: autant les cieux sont élevés au-dessus de la terre
  rationale: Rend la comparaison de degré exprimée par כ et conserve l’image verticale ainsi que le pluriel poétique « les cieux ».
- source_word: גָּבַר
  choice: est puissant
  rationale: Préserve plus directement l’idée de force et de prééminence du verbe hébreu, tout en restant naturel dans cette comparaison poétique.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: Exprime à la fois l’affection durable et la loyauté relationnelle de חֶסֶד sans réduire le terme à la seule miséricorde.
- source_word: עַל יְרֵאָיו
  choice: envers ceux qui le craignent
  rationale: « Envers » indique l’orientation relationnelle, et « ceux qui le craignent » conserve la force du participe hébreu sans l’atténuer en simple respect.
theological_decisions:
- issue: Rendu de חֶסֶד dans un psaume célébrant la compassion et la fidélité de Dieu
  choice: son amour fidèle
  alternative: sa bonté; sa miséricorde; sa loyauté d’alliance
  rationale: « Amour fidèle » maintient ensemble l’amour et la constance loyale du terme, sans imposer une formulation confessionnelle plus étroite.
- issue: Force de גָּבַר appliqué à l’amour fidèle
  choice: est puissant
  alternative: est grand; prévaut
  rationale: Le choix conserve la notion hébraïque de force ou de supériorité. « Prévaut » pourrait suggérer à tort un conflit, tandis que « est grand » atténuerait la vigueur du verbe.
translation_notes:
  register: Français international moderne, poétique et digne. La structure corrélative « autant… autant… » reproduit le rapport de mesure du vers hébreu; « les cieux » maintient son élévation stylistique.
