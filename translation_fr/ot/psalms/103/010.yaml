  terminology: « Péchés » pour חטאים et « fautes » pour עוונות préservent utilement une distinction lexicale sans surinterpréter עון comme une culpabilité exclusivement juridique. Aucun terme théologique ne force une lecture confessionnelle. L’ancre [a] est correctement placée après « péchés » et sa note correspond bien à l’alternative anglaise, tout en explicitant la proportion.
