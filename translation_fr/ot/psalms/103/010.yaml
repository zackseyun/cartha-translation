id: PSA.103.10
reference: Psalms 103:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֣א כַ֭/חֲטָאֵי/נוּ עָ֣שָׂה לָ֑/נוּ וְ/לֹ֥א כַ֝/עֲוֺנֹתֵ֗י/נוּ גָּמַ֥ל עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: fr
  text: 'Il ne nous a pas traités à la mesure de nos péchés[a],

    il ne nous a pas rétribués à la mesure de nos fautes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Il ne nous a pas fait ce que méritaient nos péchés, il ne nous a pas rendu ce que méritaient nos fautes. »'
    reason: Alternative lexicale explicitant le rapport de proportion exprimé par כ.
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: à la mesure de nos péchés
  rationale: Le préfixe כ exprime ici la comparaison ou la proportion. « À la mesure de » rend clairement cette idée, tandis que « péchés » désigne naturellement les actes fautifs au pluriel.
- source_word: עָשָׂה לָנוּ
  choice: ne nous a pas traités
  rationale: Dans ce contexte, עשה avec ל décrit la manière d’agir envers quelqu’un. « Traiter » est naturel en français et conserve le sens large du verbe sans préciser une forme particulière de jugement.
- source_word: וְלֹא
  choice: il ne nous a pas
  rationale: La reprise explicite du sujet et de la négation produit en français un parallélisme clair et digne. Une tournure avec « ni » serait possible, mais moins fluide avec ces deux verbes conjugués.
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: à la mesure de nos fautes
  rationale: עון peut évoquer la faute, la culpabilité ou ses conséquences. « Fautes » maintient une légère distinction avec « péchés » sans restreindre le terme à la seule culpabilité ressentie.
- source_word: גָּמַל עָלֵינוּ
  choice: ne nous a pas rétribués
  rationale: גמל exprime l’idée d’accorder en retour ou de rendre selon les actes. « Rétribuer » conserve cette réciprocité sans ajouter explicitement l’idée de punition; le complément עָלֵינוּ est rendu naturellement par le pronom objet « nous ».
- source_word: לֹא ... וְלֹא
  choice: ne ... pas ... ne ... pas
  rationale: La double négation hébraïque est reproduite dans les deux membres afin de préserver leur équilibre et l’insistance sur la retenue miséricordieuse de Dieu.
theological_decisions:
- issue: Exprimer la miséricorde divine sans préciser indûment la nature ou le moment du jugement
  choice: Une affirmation générale selon laquelle Dieu n’agit pas envers son peuple en proportion de ses péchés et ne lui rend pas selon ses fautes
  alternative: Limiter l’énoncé aux châtiments temporels, ou lui faire nier toute forme de jugement divin
  rationale: L’hébreu affirme largement que Dieu ne traite ni ne rétribue son peuple à la mesure de ses fautes. La traduction ne limite pas cette affirmation aux conséquences terrestres et n’en fait pas non plus une négation absolue de tout jugement.
translation_notes:
  register: Français international moderne, poétique et digne. « À la mesure de » préserve le parallélisme hébreu; « rétribués » est légèrement soutenu, mais reste compréhensible et évite de réduire גמל à « punir ».
