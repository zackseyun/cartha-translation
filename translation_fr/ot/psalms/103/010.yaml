  source_fidelity: 'Le texte rend fidèlement les deux négations parfaites et le parallélisme : Dieu ne traite pas « selon / à la mesure de » les péchés et ne rend pas en retour « selon / à la mesure de » les fautes. « À la mesure de » exprime correctement la valeur comparative et proportionnelle de כ. « Traités » convient à עשה לנו et « rétribués » rend de façon recevable גמל עלינו, sans imposer une forme précise de jugement.'
