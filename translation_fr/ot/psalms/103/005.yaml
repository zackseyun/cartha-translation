  text: הַ/מַּשְׂבִּ֣יַע בַּ/טּ֣וֹב עֶדְיֵ֑/ךְ תִּתְחַדֵּ֖שׁ כַּ/נֶּ֣שֶׁר נְעוּרָֽיְ/כִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/005.yaml
  text: who satisfies you with good[b][a], so that your youth is renewed like the eagle’s.
translation:
  language: fr
  text: lui qui te comble de biens tout au long de ta vie[a] ; ta jeunesse se renouvelle comme celle de l’aigle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « ta parure ». L’expression est difficile. Beaucoup comprennent : « qui te comble de biens tout au long de ta vie » ; selon une autre tradition d’interprétation : « qui comble ta bouche de biens ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « comme celle d’un aigle ». Le mot hébreu désigne un grand rapace traditionnellement traduit par « aigle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: lui qui te comble
  rationale: Le participe hiphil de שׂבע poursuit la série décrivant les bienfaits du SEIGNEUR. « Te comble » exprime naturellement l’idée de satisfaire pleinement.
- source_word: בַּטּוֹב
  choice: de biens
  rationale: טוֹב est ici substantivé et peut avoir un sens collectif. « De biens » reste concis et idiomatique sans préciser indûment leur nature.
- source_word: עֶדְיֵךְ
  choice: tout au long de ta vie
  rationale: Le mot massorétique signifie normalement « ta parure », mais l’expression est obscure ici. Cette formulation rend une compréhension ancienne et contextuellement plausible tout en signalant l’incertitude en note.
- source_word: תִּתְחַדֵּשׁ
  choice: se renouvelle
  rationale: Le hitpael de חדש possède ici une nuance réflexive ou passive que « se renouvelle » restitue avec naturel.
- source_word: כַּנֶּשֶׁר
  choice: comme celle de l’aigle
  rationale: נֶשֶׁר désigne un grand rapace traditionnellement rendu par « aigle ». « Celle » relie clairement la comparaison à la jeunesse.
- source_word: נְעוּרָיִכִי
  choice: ta jeunesse
  rationale: Le pluriel abstrait désigne la jeunesse ou la vigueur juvénile. « Ta jeunesse » conserve la concision et la force poétique de l’hébreu.
