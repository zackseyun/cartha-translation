source:
  edition: WLC
  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: fr
  text: Car il sait de quoi nous sommes faits[a] ; il se souvient que nous sommes poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre formation » ou « comment nous sommes façonnés ». Le terme hébreu désigne ce qui est formé ou façonné.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement la valeur causale du texte hébreu.
- source_word: הוּא
  choice: lui, il
  rationale: Reproduit l’insistance créée par le pronom hébreu explicite tout en restant naturel en français.
- source_word: יָדַע
  choice: sait
  rationale: Le parfait exprime ici une connaissance établie et actuelle ; le présent français convient au parallélisme du verset.
- source_word: יִצְרֵנוּ
  choice: de quoi nous sommes formés
  rationale: Le nom désigne ce qui est formé ou façonné, et peut évoquer la constitution de l’être humain. Cette formulation française naturelle maintient le lien avec l’image du façonnage sans préciser au-delà de l’hébreu.
- source_word: זָכוּר
  choice: il se souvient
  rationale: Le participe passif ou adjectival exprime ici le fait que Dieu garde constamment cette réalité présente à l’esprit ; cette tournure rend clairement le sens en français.
- source_word: כִּי
  choice: que
  rationale: Introduit le contenu de ce dont Dieu se souvient.
- source_word: עָפָר
  choice: poussière
  rationale: Rendu direct qui conserve l’écho à la création de l’être humain et l’image de sa fragilité mortelle.
- source_word: אֲנָחְנוּ
  choice: nous sommes
  rationale: La proposition nominale hébraïque exige naturellement le verbe « être » en français.
theological_decisions:
- issue: Image anthropologique de la fragilité humaine
  choice: nous sommes poussière
  alternative: nous ne sommes que poussière
  rationale: La formulation retenue préserve sans amplification l’image hébraïque de la condition créée et mortelle de l’être humain. L’ajout de « ne… que » accentuerait une dépréciation que le texte n’énonce pas explicitement.
- issue: Portée de יִצְרֵנוּ
  choice: de quoi nous sommes formés
  alternative: notre constitution
  rationale: La formulation choisie garde l’ambiguïté entre la matière dont l’être humain est façonné et sa condition ou constitution, tandis que « constitution » serait plus abstrait et technique.
translation_notes:
  register: Français international actuel, digne et accessible. La reprise « lui, il » conserve l’emphase du pronom hébreu ; le reste de la phrase demeure sobre et poétique.
