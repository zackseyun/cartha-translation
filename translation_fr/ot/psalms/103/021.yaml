  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: fr
  text: Bénissez Yahvé, toutes ses armées[a], ses serviteurs[b] qui accomplissez sa volonté !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses troupes » ; dans ce contexte, probablement ses armées célestes.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses ministres » ou « ceux qui sont à son service ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Bénissez
  rationale: L’impératif pluriel de ברך est rendu littéralement et maintient le refrain des versets 20 à 22.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du nom divin préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: כָּל צְבָאָיו
  choice: vous toutes, ses armées
  rationale: צָבָא désigne une armée ou une troupe organisée. L’apostrophe avec « vous toutes » est naturelle en français et le féminin s’accorde avec « armées », sans rendre explicite plus que l’hébreu leur caractère céleste suggéré par le contexte.
- source_word: מְשָׁרְתָיו
  choice: vous qui le servez
  rationale: Le participe de שׁרת désigne ceux qui assurent un service auprès de lui. Une proposition relative est plus naturelle et moins ambiguë en français moderne que « ses ministres ».
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: et faites sa volonté
  rationale: Le participe apposé caractérise les êtres interpellés. La coordination française exprime naturellement qu’ils servent Yahvé en accomplissant ce qu’il veut.
theological_decisions:
- issue: Référent des « armées » et de ceux qui servent Yahvé
  choice: Conserver une formulation assez large, tandis que le contexte évoque principalement les êtres célestes.
  alternative: Expliciter « armées célestes » ou comprendre plus largement les serviteurs terrestres de Dieu.
  rationale: Le verset 20 mentionne les anges, ce qui oriente vers la cour céleste, mais le verset 21 ne comporte pas lui-même l’adjectif « célestes ». La traduction évite donc de trancher dans le corps du texte.
translation_notes:
  register: Français moderne, digne et directement exhortatif. « Bénissez » conserve le motif lexical du psaume. La ponctuation exclamative convient à l’appel adressé aux armées de Yahvé.
