source:
  edition: WLC
  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: fr
  text: Bénissez Yahweh, vous, ses anges, héros puissants, qui exécutez sa parole en écoutant la voix de sa parole.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Bénissez
  rationale: Impératif pluriel de ברך, adressé aux anges. « Bénissez » conserve le refrain caractéristique du psaume sans le réduire au seul sens de « louez ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: מַלְאָכָיו
  choice: vous ses anges
  rationale: Dans ce cadre céleste, מַלְאָךְ désigne les anges. L’ajout de « vous », naturel dans l’apostrophe française, explicite les destinataires déjà marqués par l’impératif pluriel.
- source_word: גִּבֹּרֵי כֹחַ
  choice: puissants par la force
  rationale: Rend la construction hébraïque désignant des êtres puissants en force, sans introduire l’idée plus précise de guerriers.
- source_word: עֹשֵׂי דְבָרוֹ
  choice: qui exécutez sa parole
  rationale: Le participe décrit l’action habituelle des anges. « Exécuter sa parole » est plus idiomatique en français que « faire sa parole », tout en conservant דָּבָר comme « parole » plutôt qu’en le réduisant à « ordre ».
- source_word: לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: en obéissant à la voix de sa parole
  rationale: שׁמע בְּקוֹל exprime couramment l’écoute qui se traduit par l’obéissance. « La voix de sa parole » préserve l’image auditive et la répétition de דְבָרוֹ.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa transcription le distingue d’un titre.
- issue: Portée de שׁמע dans לִשְׁמֹעַ בְּקוֹל
  choice: en obéissant à
  alternative: en écoutant
  rationale: La locution hébraïque associe audition attentive et réponse obéissante. « Obéissant » exprime ici cette valeur contextuelle, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe « vous ses anges » clarifie naturellement que les impératifs et participes pluriels s’adressent aux anges. La répétition de « parole » et l’expression inhabituelle « voix de sa parole » sont maintenues afin de préserver le parallélisme et l’imagerie de l’hébreu.
