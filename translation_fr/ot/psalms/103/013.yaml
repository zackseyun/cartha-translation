id: PSA.103.13
reference: Psalms 103:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: fr
  text: Comme un père a compassion de ses enfants[a], Yahweh a compassion de ceux qui le craignent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme un père a pitié de ses fils, Yahweh a pitié de ceux qui le craignent. »'
    reason: Alternative lexicale plus formelle pour רחם et בָּנִים.
lexical_decisions:
- source_word: כְּרַחֵם
  choice: Comme … a compassion
  rationale: Le préfixe כְּ introduit la comparaison, tandis que רחם exprime une compassion profonde et tendre. « A compassion » restitue ce sens dans un français actuel et digne.
- source_word: אָב
  choice: un père
  rationale: 'Le singulier a ici une valeur générale : il s’agit de la conduite caractéristique d’un père, non d’un père déterminé.'
- source_word: עַל
  choice: de
  rationale: Avec « avoir compassion », la préposition française « de » introduit naturellement l’objet de la compassion, sans reproduire mécaniquement l’idiome hébreu.
- source_word: בָּנִים
  choice: ses enfants
  rationale: Le masculin pluriel désigne ici la descendance dans son ensemble. « Enfants » rend ce sens familial générique, et le possessif explicite la relation impliquée par « père ».
- source_word: רִחַם
  choice: a compassion
  rationale: La reprise de la même expression conserve la répétition poétique de la racine רחם. Le présent français convient à la portée générale de l’énoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: יְרֵאָיו
  choice: ceux qui le craignent
  rationale: Cette formulation directe rend le participe désignant les personnes caractérisées par la crainte de Yahweh, sans atténuer cette crainte en simple respect.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Portée de בָּנִים dans l’image familiale
  choice: ses enfants
  alternative: ses fils
  rationale: Dans cette comparaison générale entre un père et sa descendance, le masculin pluriel peut englober tous les enfants. La note conserve toutefois le rendu formel « fils ».
translation_notes:
  register: Français international moderne, simple et solennel. La répétition « a compassion » conserve le parallélisme hébreu ; « craignent » maintient la force théologique du texte sans la réduire à « respectent ».
