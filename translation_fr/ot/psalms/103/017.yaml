id: PSA.103.17
reference: Psalms 103:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/חֶ֤סֶד יְהוָ֨ה מֵ/עוֹלָ֣ם וְ/עַד ע֭וֹלָם עַל יְרֵאָ֑י/ו וְ֝/צִדְקָת֗/וֹ לִ/בְנֵ֥י בָנִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: fr
  text: 'Mais l’amour fidèle de Yahweh dure d’éternité en éternité pour ceux qui le craignent,

    et sa justice[a] s’étend aux enfants de leurs enfants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droiture ». Le terme hébreu peut exprimer l’une ou l’autre nuance dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Mais l’amour fidèle
  rationale: חֶסֶד exprime ici un amour loyal, constant et lié à l’engagement. « Amour fidèle » est naturel en français moderne et garde cette dimension. Le וְ initial est rendu par « Mais » pour marquer le contraste avec la fragilité humaine évoquée au verset précédent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: d’éternité en éternité
  rationale: Cette tournure française conserve le parallélisme poétique et l’idée d’une durée sans limite dans les deux directions.
- source_word: עַל יְרֵאָיו
  choice: pour ceux qui le craignent
  rationale: עַל indique ici les bénéficiaires de l’amour fidèle. « Ceux qui le craignent » préserve le langage biblique de la crainte révérencielle sans le réduire à un simple respect.
- source_word: וְצִדְקָתוֹ
  choice: et sa justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou la fidélité à ce qui est droit. « Justice » est idiomatique en français et convient au parallélisme avec l’amour fidèle, tandis que « droiture » est signalé comme autre possibilité.
- source_word: לִבְנֵי בָנִים
  choice: aux enfants de leurs enfants
  rationale: La formulation conserve l’image générationnelle littérale de l’hébreu sans la restreindre aux seuls petits-enfants immédiats.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » en préserve le caractère de nom propre.
- issue: Sens de צִדְקָה dans ce contexte poétique
  choice: justice
  alternative: droiture
  rationale: Le terme couvre à la fois la conformité à ce qui est droit et l’action juste de Dieu. Le texte principal retient « justice », courant et suffisamment large, tout en conservant l’autre sens possible en note.
- issue: Portée générationnelle de לִבְנֵי בָנִים
  choice: aux enfants de leurs enfants
  alternative: à leurs descendants
  rationale: Le choix garde l’image concrète des générations successives sans limiter la promesse à un degré généalogique précis.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible, avec un léger déploiement verbal (« dure », « s’étend ») pour rendre naturellement les relations elliptiques de l’hébreu.
