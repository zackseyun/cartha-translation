  text: בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/אַל תִּ֝שְׁכְּחִ֗י כָּל גְּמוּלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: fr
  text: Bénis Yahweh, ô mon âme, et n’oublie aucun de ses bienfaits.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses actes » ou « toutes ses rétributions ». Le terme hébreu peut désigner largement ce que l’on reçoit d’un autre ; ici, le contexte favorise le sens positif de « bienfaits ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Bénis
  rationale: L’impératif féminin singulier s’adresse à l’âme du psalmiste. « Bénis » conserve le sens religieux de ברך et l’adresse directe.
- source_word: נַפְשִׁי
  choice: ô mon âme
  rationale: נפש désigne ici la personne intérieure du psalmiste, qu’il interpelle. La tournure vocative « ô mon âme » est poétique, claire et digne en français.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה ; sa translittération préserve le nom propre de l’alliance.
- source_word: וְאַל תִּשְׁכְּחִי
  choice: et n’oublie
  rationale: La coordination et la défense adressée au féminin singulier sont rendues simplement, sans introduire un contraste absent de l’hébreu.
- source_word: כָּל
  choice: aucun de
  rationale: Avec une négation, « n’oublie aucun de » exprime naturellement en français la portée exhaustive de כָּל.
- source_word: גְּמוּלָיו
  choice: ses bienfaits
  rationale: גמול peut désigner ce que quelqu’un accorde ou fait en retour. Le contexte de reconnaissance, développé dans les versets suivants, favorise ici le sens positif de « bienfaits ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie le Tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Portée de גְּמוּלָיו
  choice: ses bienfaits
  alternative: tous ses actes envers toi / ce qu’il t’accorde en retour
  rationale: Le terme demeure lexicalement plus large et peut évoquer les actes, traitements ou rétributions reçus d’un autre ; toutefois, l’énumération des grâces divines qui suit donne ici une orientation positive.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif traditionnel « ô mon âme » reste immédiatement compréhensible ; l’inversion négative « n’oublie aucun de » rend idiomatiquement la totalité exprimée par l’hébreu.
