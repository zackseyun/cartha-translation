source:
  edition: WLC
  text: הַ/סֹּלֵ֥חַ לְ/כָל עֲוֺנֵ֑/כִי הָ֝/רֹפֵ֗א לְ/כָל תַּחֲלֻאָֽיְ/כִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/003.yaml
  text: who forgives all your iniquity[a], who heals all your diseases[b],
translation:
  language: fr
  text: lui qui pardonne toutes tes fautes[a], qui guérit toutes tes maladies[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute ta culpabilité » ou « tous tes péchés ». Le mot hébreu עָוֹן peut désigner la faute, la culpabilité ou les conséquences résultant du mal commis.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes tes affections ». L’expression peut désigner concrètement les maladies du corps, même si certains la comprennent plus largement dans le contexte poétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: lui qui pardonne
  rationale: Le participe avec article désigne ici le Seigneur par son action caractéristique. « Lui qui pardonne » est naturel en français et s’insère dans la série descriptive du psaume.
- source_word: לְכָל
  choice: toutes
  rationale: Le français exige ici l’accord avec les noms pluriels féminins. « Toutes » conserve la portée globale de l’hébreu.
- source_word: עֲוֺנֵכִי
  choice: tes fautes
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. Le pluriel français « fautes » rend naturellement le collectif hébreu dans cette formulation, sans réduire le terme à de simples erreurs.
- source_word: הָרֹפֵא
  choice: qui guérit
  rationale: Comme le participe précédent, cette forme décrit une action caractéristique du Seigneur. « Qui guérit » préserve le parallélisme et le sens direct du verbe.
- source_word: תַּחֲלֻאָיִכִי
  choice: tes maladies
  rationale: Le nom hébreu désigne concrètement les maladies ou affections. « Maladies » est la formulation française la plus claire et la plus directe.
theological_decisions:
- issue: Portée du langage de guérison
  choice: Conserver « qui guérit toutes tes maladies » sans préciser si la guérison est uniquement physique ou également comprise de façon plus large.
  alternative: « qui guérit tous tes maux » ou une explicitation en termes de maladies spirituelles.
  rationale: L’hébreu évoque naturellement la maladie concrète, tandis que le contexte poétique peut permettre une portée plus large. La traduction ne doit ni spiritualiser ni restreindre ce langage.
translation_notes:
  register: Français moderne, international et digne. La tournure « lui qui » maintient le caractère poétique de la série participiale; le tutoiement correspond à l’adresse de l’âme à elle-même dans le contexte.
