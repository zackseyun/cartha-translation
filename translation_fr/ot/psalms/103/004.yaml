lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: lui qui rachète
  rationale: Le participe de גאל exprime l’action de racheter ou de délivrer. « Rachète » conserve la portée théologique du terme sans imposer ici le cadre juridique précis du proche parent rédempteur.
- source_word: מִשַּׁחַת
  choice: de la fosse
  rationale: שַׁחַת peut désigner la fosse, la tombe ou la destruction. « La fosse » garde l’image concrète et poétique, tandis que les autres sens possibles sont signalés en note.
- source_word: חַיָּיִכִי
  choice: ta vie
  rationale: Le français emploie naturellement le singulier « ta vie ». Cette formulation désigne la vie de la personne entière sans introduire la notion plus étroite d’une âme immatérielle.
- source_word: הַמְעַטְּרֵכִי
  choice: qui te couronne
  rationale: Le verbe עטר évoque le fait de couronner, d’entourer ou d’orner. « Te couronne » préserve la métaphore d’honneur et de bienfaits.
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: חֶסֶד désigne un amour loyal, constant et engagé. « Amour fidèle » est naturel en français moderne et conserve à la fois l’affection et la fidélité.
- source_word: וְרַחֲמִים
  choice: et de compassion
  rationale: רַחֲמִים exprime une profonde compassion ou de tendres miséricordes. Le singulier collectif « compassion » est idiomatique en français tout en rendant la qualité abondante évoquée par le pluriel hébreu.
theological_decisions:
- issue: Portée de l’image du rachat
  choice: Une délivrance temporelle et existentielle exprimée poétiquement, sans la limiter au secours physique ni au salut final.
  alternative: Une délivrance visant précisément la mort ou la tombe, ou une affirmation générale du salut spirituel.
  rationale: Le vocabulaire peut englober le sauvetage face à la ruine mortelle. La traduction conserve cette amplitude sans trancher en faveur d’une seule catégorie doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. La structure participiale répétée de l’hébreu est rendue par « lui qui… qui… ». Le tutoiement suit l’adresse directe du psaume à soi-même; la ponctuation finale conserve la continuité avec les versets voisins.
