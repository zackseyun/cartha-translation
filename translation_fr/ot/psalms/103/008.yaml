  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: fr
  text: Yahweh est compatissant et fait grâce, lent à la colère et riche en amour fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu חֶסֶד désigne un amour constant et loyal ; on peut aussi traduire par « amour inébranlable » ou « fidélité » selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: compatissant
  rationale: L’adjectif exprime une profonde compassion ou miséricorde. « Compatissant » est naturel en français moderne et conserve la dimension personnelle et affective du terme.
- source_word: חַנּוּן
  choice: plein de grâce
  rationale: Cette expression distingue le terme du précédent et rend l’idée d’une faveur accordée librement. Elle est plus immédiatement compréhensible ici que le seul adjectif « gracieux », potentiellement ambigu en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Équivalent idiomatique français de l’expression hébraïque littéralement liée à la longueur des narines; il en restitue clairement le sens de colère différée.
- source_word: רַב
  choice: riche en
  rationale: Dans cette construction, le mot indique l’abondance. « Riche en » est une formulation française naturelle et digne.
- source_word: חָסֶד
  choice: amour fidèle
  rationale: Cette traduction concise garde ensemble les dimensions d’affection, de constance et de loyauté souvent portées par חֶסֶד, sans réduire le terme à une seule notion juridique ou doctrinale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom personnel au lieu de le remplacer par un titre.
- issue: Rendu de חָסֶד dans la description du caractère de Dieu
  choice: amour fidèle
  alternative: amour inébranlable; bonté; fidélité à l’alliance
  rationale: « Amour fidèle » préserve à la fois l’amour et la constance impliqués par le terme, tout en évitant d’imposer une définition exclusivement technique ou confessionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La structure brève et équilibrée de l’hébreu est conservée. « Plein de grâce » évite le sens courant de « gracieux » tout en distinguant חַנּוּן de רַחוּם.
