source:
  edition: WLC
  text: אֱ֭נוֹשׁ כֶּ/חָצִ֣יר יָמָ֑י/ו כְּ/צִ֥יץ הַ֝/שָּׂדֶ֗ה כֵּ֣ן יָצִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/015.yaml
  text: As for man[a], his days are like grass; he flourishes like a flower of the field.
translation:
  language: fr
  text: Quant à l’être humain[a], ses jours sont comme l’herbe ; comme une fleur des champs, il fleurit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le mortel ». Le mot hébreu souligne souvent la fragilité de l’être humain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Le nom désigne l’être humain, souvent avec une nuance de faiblesse ou de mortalité. « L’être humain » conserve ici la portée générique et le singulier poétique sans alourdir le verset.
- source_word: כֶּחָצִיר
  choice: comme l’herbe
  rationale: Le préfixe כְּ marque une comparaison. « Comme l’herbe » est une formulation française naturelle et fidèle à l’image.
- source_word: יָמָיו
  choice: ses jours
  rationale: Cette traduction directe du pluriel muni du suffixe de troisième personne conserve l’expression hébraïque désignant la durée de la vie.
- source_word: כְּצִיץ הַשָּׂדֶה
  choice: comme une fleur des champs
  rationale: צִיץ désigne une fleur ou une floraison. « Une fleur des champs » restitue naturellement l’image sans préciser à tort une espèce particulière.
- source_word: כֵּן יָצִיץ
  choice: il fleurit
  rationale: Le verbe évoque directement l’éclosion ou la floraison. En français, « il fleurit » maintient l’image végétale appliquée à l’être humain ; la construction comparative rend suffisamment la valeur de כֵּן (« ainsi »).
theological_decisions: []
translation_notes:
  register: Français moderne, courant et poétique. La reprise « ses jours » conserve la structure détachée de l’hébreu, tandis que « fleurit » maintient la métaphore sans l’expliquer ni en atténuer le caractère éphémère.
