  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: fr
  text: 'Il a fait connaître ses voies à Moïse,

    ses actions aux fils d’Israël.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux enfants d’Israël » ou « au peuple d’Israël ».
    reason: Alternative lexicale explicitant la valeur collective de בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: a fait connaître
  rationale: 'Le hiphil de ידע exprime ici la causation : Dieu a rendu ses voies connues. « A fait connaître » est naturel en français et conserve ce sens causatif.'
- source_word: דְּרָכָיו
  choice: ses voies
  rationale: Le nom דֶּרֶךְ désigne littéralement une voie ou un chemin et, ici, la manière d’agir de Dieu. « Ses voies » préserve la métaphore hébraïque et l’expression biblique.
- source_word: לְמֹשֶׁה
  choice: à Moïse
  rationale: La préposition לְ indique le destinataire de cette révélation.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  rationale: L’expression signifie littéralement « fils d’Israël » et constitue une désignation collective du peuple. La traduction formelle est maintenue dans le texte, tandis que des formulations collectives plus idiomatiques sont signalées en note.
- source_word: עֲלִילוֹתָיו
  choice: ses actions
  rationale: Le nom עֲלִילוֹת désigne les actes ou actions accomplis. « Ses actions » est clair et n’ajoute pas l’idée de puissance, qui n’est pas explicitement exprimée par le terme.
theological_decisions:
- issue: Portée collective et forme masculine de בְּנֵי יִשְׂרָאֵל
  choice: aux fils d’Israël
  alternative: aux enfants d’Israël ; au peuple d’Israël
  rationale: L’hébreu emploie une expression masculine plurielle devenue un ethnonyme collectif. Le texte conserve sa forme lexicale, et la note précise les équivalents collectifs naturels sans restreindre le référent aux seuls hommes.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme du vers hébreu est conservé sur deux lignes. « Voies » maintient la métaphore traditionnelle, tandis que « actions » rend le second membre sans amplification.
