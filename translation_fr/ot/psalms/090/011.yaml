base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/011.yaml
  text: Who knows the power of your anger[a], and your wrath according to the fear due to you?
translation:
  language: fr
  text: Qui connaît la puissance de ta colère, et ta fureur à la mesure de la crainte qui t’est due[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et ta fureur est selon la crainte de toi », ou : « telle est la crainte de toi, telle est ta fureur ». L’expression hébraïque est concise et peut se comprendre de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique. « Qui » en conserve directement la force.
- source_word: יוֹדֵעַ
  choice: connaît
  rationale: Le participe de ידע exprime ici le fait de connaître ou de reconnaître. « Connaît » reste direct sans expliciter indûment l’idée de connaissance complète.
- source_word: עֹז
  choice: puissance
  rationale: עֹז désigne la force ou la puissance. « Puissance » s’emploie naturellement avec la colère et en exprime la force agissante.
- source_word: אַפֶּךָ
  choice: ta colère
  rationale: Dans cet idiome, אַף désigne la colère, malgré son sens concret de « nez » ou « narine ». La traduction naturelle évite un littéralisme trompeur.
- source_word: וּכְיִרְאָתְךָ
  choice: et … à la mesure de la crainte qui t’est due
  rationale: La construction compacte associe la conjonction, la préposition comparative כְּ et « ta crainte ». Cette formulation française conserve le rapport de mesure ou de correspondance tout en rendant explicite que Dieu est l’objet de la crainte révérencielle.
- source_word: עֶבְרָתֶךָ
  choice: ta fureur
  rationale: עֶבְרָה désigne une colère intense. « Fureur » maintient un registre élevé et distingue ce terme de אַף, traduit par « colère ».
theological_decisions:
- issue: Rapport entre la fureur divine et la crainte dans וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: « ta fureur à la mesure de la crainte qui t’est due »
  alternative: « ta fureur est selon la crainte de toi » ou « telle est la crainte de toi, telle est ta fureur »
  rationale: L’hébreu est elliptique et permet plusieurs façons de rattacher le syntagme comparatif. Le texte principal conserve l’idée probable de correspondance entre la fureur divine et la crainte révérencielle due à Dieu, tandis que la note signale l’ambiguïté réelle sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme entre « colère » et « fureur » est conservé, ainsi que la formulation interrogative continue du verset.
