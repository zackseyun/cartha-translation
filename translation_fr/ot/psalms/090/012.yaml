  text: לִ/מְנ֣וֹת יָ֭מֵי/נוּ כֵּ֣ן הוֹדַ֑ע וְ֝/נָבִ֗א לְבַ֣ב חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: fr
  text: Apprends-nous ainsi à compter nos jours[a], afin que nous acquérions un cœur de sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Apprends-nous ainsi à compter nos jours, et nous apporterons un cœur de sagesse. » L’hébreu de la dernière proposition est difficile ; beaucoup le comprennent au sens de « afin que nous acquérions un cœur de sagesse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: compter
  rationale: L’infinitif de מנה désigne l’action de compter ou de dénombrer. « Compter » conserve l’image concrète et sonne naturellement en français.
- source_word: יָמֵינוּ
  choice: nos jours
  rationale: Le nom avec suffixe de première personne du pluriel évoque ici la durée limitée de la vie humaine.
- source_word: כֵּן
  choice: bien
  rationale: כֵּן signifie littéralement « ainsi » ou « de cette manière ». Dans cette construction, « bien compter » exprime naturellement l’idée de compter ses jours de la manière appropriée, sans préciser davantage en quoi elle consiste.
- source_word: הוֹדַע
  choice: apprends-nous
  rationale: L’impératif au hiphil de ידע signifie littéralement « fais-nous connaître ». Dans le contexte d’une prière demandant à Dieu de donner l’intelligence, « apprends-nous » en restitue naturellement la valeur causative.
- source_word: וְנָבִא
  choice: afin que nous acquérions
  rationale: La forme issue de בוא signifie normalement « apporter » ou « faire venir », mais la proposition est difficile. Avec « un cœur sage » comme complément, beaucoup comprennent ici l’idée de parvenir à la sagesse ou de l’acquérir. La note conserve la traduction plus littérale.
- source_word: לְבַב חָכְמָה
  choice: un cœur sage
  rationale: Littéralement, « un cœur de sagesse ». En français actuel, « un cœur sage » exprime naturellement une disposition intérieure façonnée par la sagesse.
theological_decisions:
- issue: Sens de la dernière proposition
  choice: La demande adressée à Dieu vise à faire prendre conscience de la brièveté de la vie, afin que les fidèles acquièrent une disposition intérieure sage.
  alternative: 'Traduire plus littéralement : « et nous apporterons un cœur de sagesse ».'
  rationale: L’hébreu est condensé et difficile. La lecture choisie convient au contexte du psaume et produit un français intelligible, tandis que la note préserve l’autre possibilité sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. « Apprends-nous » garde le ton direct de la prière ; « bien compter » est idiomatique tout en représentant כֵּן. La formulation évite un vocabulaire confessionnel particulier.
