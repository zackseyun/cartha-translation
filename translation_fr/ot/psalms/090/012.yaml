  naturalness: « Apprends-nous » et « compter nos jours » sont naturels, sobres et appropriés au registre psalmique. « Un cœur de sagesse » est un peu plus littéraire que « un cœur sage », mais reste idiomatique et rend plus exactement le tour hébreu.
