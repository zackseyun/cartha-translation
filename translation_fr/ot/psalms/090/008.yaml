source:
  edition: WLC
  text: שת עֲוֺנֹתֵ֣י/נוּ לְ/נֶגְדֶּ֑/ךָ עֲ֝לֻמֵ֗/נוּ לִ/מְא֥וֹר פָּנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: fr
  text: 'Tu as placé devant toi nos fautes,

    nos fautes cachées[a] à la lumière de ta face[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos fautes secrètes ». Le terme hébreu désigne ce qui est caché ou dissimulé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « à la lumière de ta face » : image de ce qui est pleinement exposé devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתָּה / שת (שִׁית)
  choice: Tu as placé
  rationale: Le verbe signifie « mettre, placer ». Le passé composé rend naturellement en français l’accompli hébreu et présente l’action divine comme un fait établi.
- source_word: עֲוֺנֹתֵינוּ
  choice: nos fautes
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Fautes » conserve ici la portée morale et le pluriel tout en restant clair en français moderne.
- source_word: לְנֶגְדֶּךָ
  choice: devant toi
  rationale: Cette expression directe et idiomatique garde l’idée que les fautes sont exposées au regard de Dieu.
- source_word: עֲלֻמֵנוּ
  choice: nos fautes cachées
  rationale: Le terme désigne ce qui est caché ou dissimulé. Le parallélisme avec « nos fautes » permet d’expliciter qu’il s’agit de fautes, sans effacer la nuance de dissimulation.
- source_word: לִמְאוֹר
  choice: dans la lumière de
  rationale: Cette formulation française naturelle exprime l’exposition de ce qui était caché, tout en restant proche de l’image hébraïque.
- source_word: פָּנֶיךָ
  choice: ta face
  rationale: La traduction concrète conserve l’image poétique hébraïque. « Ta présence » en expliciterait le sens, mais atténuerait la métaphore du regard divin.
theological_decisions:
- issue: Explicitation du référent de עֲלֻמֵנוּ
  choice: nos fautes cachées
  alternative: ce que nous cachons / nos choses cachées
  rationale: Le parallélisme avec « nos fautes » indique fortement des actes mauvais dissimulés. L’ajout de « fautes » explicite l’ellipse poétique sans introduire une idée étrangère.
- issue: Image de la face divine
  choice: la lumière de ta face
  alternative: la lumière de ta présence
  rationale: Le choix retient l’image anthropomorphique et la tension poétique du texte, sans la réduire silencieusement à une abstraction.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse directe à Dieu. La disposition en deux lignes préserve le parallélisme poétique; « ta face » maintient l’image concrète de l’hébreu.
