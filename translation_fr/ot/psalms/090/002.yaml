source:
  edition: WLC
  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: fr
  text: Avant que les montagnes ne soient nées, avant que tu n’aies enfanté la terre et le monde, d’éternité en éternité, tu es Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Avant que
  rationale: Introduit naturellement en français une situation antérieure à la création, tout en conservant la valeur temporelle de l’hébreu.
- source_word: הָרִים
  choice: les montagnes
  rationale: Conserve l’article défini et l’image poétique des montagnes primordiales.
- source_word: יֻלָּדוּ
  choice: soient nées
  rationale: Rend le passif de ילד et préserve explicitement la métaphore de la naissance appliquée aux montagnes.
- source_word: וַתְּחוֹלֵל
  choice: que tu aies fait naître
  rationale: Expression française naturelle qui maintient l’imagerie de l’enfantement ou du travail de l’accouchement sans la réduire à « créer » ou « former ».
- source_word: אֶרֶץ
  choice: la terre
  rationale: Dans ce contexte cosmique et en parallèle avec תֵבֵל, le terme désigne la terre plutôt qu’un territoire particulier.
- source_word: וְתֵבֵל
  choice: et le monde
  rationale: Rend de façon concise et naturelle le monde ordonné ou habité évoqué par תֵבֵל.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: d’éternité en éternité
  rationale: Reproduit l’idiome hébreu exprimant une durée sans limite dans les deux directions, dans un registre poétique français établi.
- source_word: אַתָּה
  choice: tu
  rationale: 'Maintient le pronom explicite et son effet d’insistance : c’est Dieu lui-même qui demeure au-delà de toute durée.'
- source_word: אֵל
  choice: Dieu
  rationale: Rend directement la désignation divine sans ajouter une nuance telle que « le Puissant » que le contexte n’exige pas.
theological_decisions:
- issue: Imagerie anthropomorphique de la naissance dans la création
  choice: Conserver la naissance des montagnes et rendre l’action divine par « faire naître » la terre et le monde.
  alternative: Aplatir l’image par « créer », « faire » ou « former », ou employer plus littéralement « enfanter ».
  rationale: Les deux verbes hébreux développent une même imagerie de naissance et d’enfantement. « Faire naître » la préserve dans un français naturel, sans tirer de conclusion doctrinale sur les modalités de la création.
- issue: Expression de l’éternité de Dieu
  choice: d’éternité en éternité, tu es Dieu
  alternative: depuis toujours et pour toujours, tu es Dieu
  rationale: La formulation retenue suit étroitement l’idiome hébreu et affirme que Dieu précède et dépasse la création, sans transformer l’expression poétique en définition philosophique.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe du psaume. La syntaxe « avant que… et que… » maintient le lien coordonné de l’hébreu, tandis que « fait naître » conserve l’image sans produire une tournure inutilement heurtée.
