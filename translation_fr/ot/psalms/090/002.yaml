  rationale: La révision remplace « faire naître » par « enfanter » afin de rendre plus directement l’imagerie de travail et de naissance du verbe hébreu. Elle répète aussi « avant que » et emploie le ne explétif pour une syntaxe poétique française plus limpide. Le sens, l’ambiguïté poétique et la portée théologique du texte source sont préservés.
