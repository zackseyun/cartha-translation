  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: fr
  text: 'Que la faveur[a] du Seigneur, notre Dieu, soit sur nous,

    et affermis pour nous[b] l’œuvre de nos mains ;

    oui, affermis l’œuvre de nos mains !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la beauté », « la douceur » ou « l’agrément » du Seigneur, notre Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « affermis sur nous l’œuvre de nos mains ». Le rapport précis exprimé par « sur nous » est ambigu ; il peut ici avoir le sens de « pour nous » ou « en notre faveur ».'
    reason: source_ambiguity
lexical_decisions:
- source_word: וִיהִי
  choice: Que … soit
  rationale: La forme volitive exprime ici un souhait ou une prière. « Que … soit » en restitue naturellement la valeur en français.
- source_word: נֹעַם
  choice: faveur
  rationale: Le nom peut évoquer l’agrément, la douceur, la beauté ou la faveur. Dans cette prière demandant à Dieu d’affermir le travail humain, « faveur » exprime clairement sa bienveillance sans exclure les autres nuances.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: le Seigneur, notre Dieu
  rationale: Cette traduction conserve les deux titres divins et emploie une formulation française courante, digne et naturelle.
- source_word: עָלֵינוּ
  choice: sur nous
  rationale: Dans la première proposition, la préposition décrit naturellement la faveur divine présente sur la communauté.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: l’œuvre de nos mains
  rationale: La formulation garde l’image concrète de l’hébreu, qui désigne le travail ou les entreprises humaines.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: affermis / affermis-la
  rationale: Le verbe demande à Dieu de rendre le travail ferme, stable et durable. « Affermir » conserve ce sens sans introduire la notion plus étroite de prospérité.
- source_word: עָלֵינוּ (seconde occurrence)
  choice: pour nous
  rationale: Après « affermis l’œuvre de nos mains », le français idiomatique comprend la préposition dans un sens bénéficiaire. La note signale la formulation littérale afin de préserver l’ambiguïté de l’hébreu.
- source_word: וּמַעֲשֵׂה יָדֵינוּ כּוֹנְנֵהוּ
  choice: oui, affermis l’œuvre de nos mains
  rationale: La reprise finale est conservée pour rendre l’insistance poétique. « Oui » traduit la valeur confirmative que prend ici la coordination dans cette répétition.
theological_decisions:
- issue: Nature du נֹעַם divin demandé dans la prière
  choice: la faveur du Seigneur
  alternative: la beauté, la douceur ou l’agrément du Seigneur
  rationale: « Faveur » convient au contexte de bénédiction du travail, tandis qu’une note maintient ouvertes les nuances esthétiques et affectives du terme.
- issue: Effet demandé à Dieu sur le travail humain
  choice: affermis
  alternative: fais prospérer
  rationale: Le texte demande avant tout fermeté, stabilité ou durée. « Fais prospérer » ajouterait une idée de réussite matérielle qui n’est pas nécessairement exprimée.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et la répétition finale de l’hébreu sont maintenus, tandis que la seconde occurrence de עָלֵינוּ est rendue idiomatiquement et accompagnée d’une note qui conserve l’ambiguïté du texte source.
