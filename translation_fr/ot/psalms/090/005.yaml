  text: You sweep them away[a]; they are like a dream[c][b]. In the morning they are like grass that sprouts anew.
translation:
  language: fr
  text: Tu les emportes[a] ; ils sont comme un rêve[b]. Au matin, ils sont comme l’herbe qui renaît[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu les entraînes dans un flot ». Le verbe hébreu évoque l’action d’un courant impétueux.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ils sont comme un sommeil ».'
    reason: literal_reading
  - marker: c
    text: 'Ou : « qui passe ». Le verbe peut exprimer le renouvellement, le changement ou le passage ; le contexte du verset suivant favorise l’idée d’une herbe qui renaît. Le verbe est au singulier et s’accorde formellement avec « l’herbe ».'
    reason: alternative_reading
lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Tu les emportes comme un torrent
  rationale: Le verbe זָרַם évoque un flot impétueux qui entraîne. Cette formulation française conserve l’image de l’eau et la soudaineté de la disparition sans imposer un déluge précis.
- source_word: שֵׁנָה
  choice: un rêve
  rationale: Le nom signifie littéralement « sommeil ». Dans cette poésie très condensée, « comme un rêve » exprime naturellement en français le caractère fugitif de la vie, tout en signalant en note la lecture plus formelle.
- source_word: יִהְיוּ
  choice: ils sont
  rationale: Bien que la forme soit un inaccompli, elle a ici une valeur descriptive ou générale. Le présent convient au mouvement méditatif du psaume.
- source_word: בַּבֹּקֶר
  choice: Au matin
  rationale: Cette tournure française, naturelle dans un registre poétique digne, introduit l’image de l’herbe fraîche du matin.
- source_word: כֶּחָצִיר
  choice: comme l’herbe
  rationale: חָצִיר désigne couramment l’herbe ou la végétation herbacée et prépare l’image développée au verset suivant.
- source_word: יַחֲלֹף
  choice: qui repousse
  rationale: Le verbe חלף peut exprimer le fait de changer, de passer ou de se renouveler. Dans le parallélisme avec le verset 6, où l’herbe fleurit le matin puis sèche le soir, « repousse » rend bien l’idée d’un renouvellement matinal. Le singulier hébreu s’accorde formellement avec « l’herbe ».
