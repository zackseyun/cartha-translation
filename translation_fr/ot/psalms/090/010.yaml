  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: fr
  text: 'La durée de notre vie est de soixante-dix ans,

    et, si la vigueur le permet, de quatre-vingts ans ;

    mais ce qui fait la fierté de ces années[a] n’est que peine et malheur,

    car cela disparaît bien vite[b], et nous nous envolons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais même ce qu’elles ont de meilleur n’est que peine et malheur ». Le terme hébreu rendu par « ce qui fait la fierté de ces années » peut aussi désigner ce que ces années ont de plus remarquable ou de plus vigoureux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car cela passe rapidement » ou « car cela est vite retranché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: La durée de notre vie
  rationale: Cette formulation française naturelle rend l’idiome hébreu littéralement lié aux « jours de nos années », lequel désigne ici la durée de la vie humaine.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: est de soixante-dix ans
  rationale: Le pronom prépositionnel hébreu fonctionne idiomatiquement pour indiquer la durée totale ; le français appelle ici la tournure « est de ».
- source_word: וְאִם בִּגְבוּרֹת
  choice: et, pour les plus vigoureux
  rationale: La force ou vigueur explique ici le cas exceptionnel d’une vie atteignant quatre-vingts ans. Cette formulation conserve la nuance conditionnelle sans lourdeur.
- source_word: וְרָהְבָּם
  choice: ce qui en fait la fierté
  rationale: Le nom peut évoquer la fierté, ce dont on se vante, ou la part la plus remarquable de ces années. La formulation conserve cette gamme de sens et l’ironie du contexte.
- source_word: עָמָל וָאָוֶן
  choice: peine et malheur
  rationale: Dans ce contexte sur la fragilité de la vie, les deux termes désignent surtout l’effort pénible, l’affliction et la détresse, plutôt qu’une faute morale.
- source_word: כִּי גָז חִישׁ
  choice: car cela disparaît bien vite
  rationale: Le verbe peut exprimer le fait de passer, de disparaître ou d’être retranché ; l’adverbe souligne la rapidité. Le démonstratif maintient une certaine ouverture quant à ce qui disparaît.
- source_word: וַנָּעֻפָה
  choice: et nous nous envolons
  rationale: La traduction garde l’image vive du verbe hébreu et sa forme à la première personne du pluriel.
