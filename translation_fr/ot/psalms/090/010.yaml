  naturalness: Le français est moderne, fluide et poétique. La légère explicitation « de ces années » clarifie le référent sans alourdir le verset. « Cela disparaît bien vite » conserve utilement l’ouverture du pronom hébreu quant à ce qui passe ou est retranché.
  terminology: « Peine et malheur » convient à עָמָל וָאָוֶן dans ce contexte. « Fierté » conserve la polysémie de רָהְבָּם, et la note présente de manière équilibrée l’alternative portant sur ce qu’il y a de plus remarquable ou de meilleur. « Nous nous envolons » préserve l’image du verbe hébreu.
