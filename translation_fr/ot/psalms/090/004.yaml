source:
  edition: WLC
  text: כִּ֤י אֶ֪לֶף שָׁנִ֡ים בְּֽ/עֵינֶ֗י/ךָ כְּ/י֣וֹם אֶ֭תְמוֹל כִּ֣י יַעֲבֹ֑ר וְ/אַשְׁמוּרָ֥ה בַ/לָּֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: fr
  text: 'Car mille ans, à tes yeux,

    sont comme le jour d’hier une fois passé[a],

    et comme une veille dans la nuit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand il passe ». La proposition hébraïque peut aussi recevoir cette nuance temporelle.'
    reason: lexical_alternative
  - marker: b
    text: Une « veille » était une portion de la nuit pendant laquelle on montait la garde.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement la relation logique.
- source_word: אֶלֶף שָׁנִים
  choice: mille ans
  rationale: Rend directement l’expression numérique qui fonde le contraste poétique entre le temps humain et la perspective divine.
- source_word: בְּעֵינֶיךָ
  choice: à tes yeux
  rationale: Expression française naturelle qui conserve la métaphore hébraïque de la perception ou de l’évaluation.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: comme le jour d’hier
  rationale: Reproduit l’image temporelle sans la développer ni la réduire à une affirmation abstraite.
- source_word: כִּי יַעֲבֹר
  choice: une fois passé
  rationale: Qualifie le jour d’hier comme désormais révolu; cette formulation est idiomatique en français tout en laissant en note l’autre nuance possible du verbe.
- source_word: וְאַשְׁמוּרָה
  choice: et comme une veille
  rationale: Le coordonnant hébreu introduit une seconde comparaison parallèle; la répétition de « comme » la rend explicite en français.
- source_word: בַלָּיְלָה
  choice: dans la nuit
  rationale: Rend simplement la localisation temporelle de la veille.
theological_decisions:
- issue: Langage anthropomorphique concernant la perspective de Dieu sur le temps
  choice: Conserver « à tes yeux » ainsi que les deux comparaisons temporelles.
  alternative: Paraphraser en disant que mille ans ne sont rien pour Dieu ou qu’il est hors du temps.
  rationale: Le verset exprime poétiquement le contraste entre la perspective divine et le temps humain; il ne formule pas directement une doctrine philosophique de l’intemporalité.
translation_notes:
  register: Français moderne, sobre et poétique. Le tutoiement correspond à l’adresse directe à Dieu. La disposition en trois lignes met en relief les deux comparaisons parallèles sans ajouter d’interprétation.
