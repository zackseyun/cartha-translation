source:
  edition: WLC
  text: כִּ֣י כָל יָ֭מֵי/נוּ פָּנ֣וּ בְ/עֶבְרָתֶ֑/ךָ כִּלִּ֖ינוּ שָׁנֵ֣י/נוּ כְמוֹ הֶֽגֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/009.yaml
  text: For all our days pass away in your wrath[a]; we finish our years like a sigh.
translation:
  language: fr
  text: Car tous nos jours passent sous ta fureur ; nous achevons nos années comme un soupir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un murmure » ou « comme un gémissement ». Le terme hébreu désigne un son faible ; « un soupir » souligne ici le caractère fugitif de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la réflexion précédente et conserve naturellement la valeur connective du terme hébreu.
- source_word: כָל יָמֵינוּ
  choice: tous nos jours
  rationale: Conserve le pluriel concret et le parallélisme poétique avec « nos années ».
- source_word: פָּנוּ
  choice: passent
  rationale: Dans ce contexte temporel, le verbe exprime l’écoulement des jours. Le présent français rend la constatation générale tout en restant naturel.
- source_word: בְעֶבְרָתֶךָ
  choice: sous ta fureur
  rationale: « Fureur » maintient l’intensité de עֶבְרָה, tandis que « sous » exprime naturellement en français la situation dominée par cette colère.
- source_word: כִּלִּינוּ
  choice: nous achevons
  rationale: Rend le piel de כלה au sens de mener à son terme, sans préciser davantage si les années sont simplement vécues ou consumées.
- source_word: שָׁנֵינוּ
  choice: nos années
  rationale: Traduction directe qui maintient le pluriel et le parallélisme avec « jours ».
- source_word: כְמוֹ
  choice: comme
  rationale: Équivalent comparatif simple et idiomatique en français.
- source_word: הֶגֶה
  choice: un soupir
  rationale: Le nom peut désigner un son faible. « Soupir » évoque naturellement ici la brièveté et la fragilité de la vie, tandis que les autres sens plausibles sont signalés en note.
theological_decisions:
- issue: Intensité de la colère divine
  choice: ta fureur
  alternative: ta colère
  rationale: Le terme עֶבְרָה exprime une colère intense. « Fureur » préserve le poids théologique du texte sans atténuer le lien explicite entre cette colère et la fuite des jours.
- issue: Sens de הֶגֶה dans l’image finale
  choice: un soupir
  alternative: un murmure ou un gémissement
  rationale: Le terme hébreu désigne ici vraisemblablement un son faible, mais sa nuance exacte reste ouverte. Le texte principal privilégie l’image fugitive du soupir, et la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste concise, conserve le parallélisme « jours / années » et évite de résoudre l’ambiguïté du dernier mot hébreu.
