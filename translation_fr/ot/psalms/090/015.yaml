source:
  edition: WLC
  text: שַׂ֭מְּחֵ/נוּ כִּ/ימ֣וֹת עִנִּיתָ֑/נוּ שְׁ֝נ֗וֹת רָאִ֥ינוּ רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/015.yaml
  text: Make us glad for as many days as you have afflicted us[a], for as many years as we have seen trouble.
translation:
  language: fr
  text: Réjouis-nous pendant autant de jours que tu nous as affligés, pendant autant d’années que nous avons connu le malheur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adversité », « le désastre » ou « le mal ». Le mot hébreu peut désigner, selon le contexte, une épreuve, une calamité ou le mal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Réjouis-nous
  rationale: 'L’impératif piel de שׂמח avec le suffixe de première personne du pluriel exprime une demande causative : que Dieu fasse éprouver de la joie à la communauté. « Réjouis-nous » conserve cette force de façon concise et digne.'
- source_word: כִּימוֹת
  choice: autant de jours que
  rationale: La préposition כ introduit ici une correspondance de mesure. Cette tournure française exprime naturellement la demande d’une joie proportionnée à la durée de l’affliction.
- source_word: עִנִּיתָנוּ
  choice: tu nous as affligés
  rationale: Le piel de ענה peut signifier « affliger » ou « humilier ». Dans cette lamentation, « affligés » maintient le parallèle avec le malheur sans réduire le sens à l’humilité intérieure ni à l’oppression extérieure.
- source_word: שְׁנוֹת
  choice: autant d’années que
  rationale: Le pluriel construit est parallèle à « jours ». La reprise de « autant de… que » rend explicite en français la proportion demandée.
- source_word: רָאִינוּ
  choice: nous avons connu
  rationale: Littéralement « nous avons vu ». En français, « connaître le malheur » rend naturellement l’idée biblique d’en faire l’expérience, sans changer le sens contextuel.
- source_word: רָעָה
  choice: le malheur
  rationale: רָעָה peut désigner le mal moral, l’adversité ou la calamité. Ici, le parallèle avec l’affliction subie favorise le sens de souffrance ou d’adversité, bien exprimé par « malheur ».
theological_decisions:
- issue: Sens de רָעָה en rapport avec l’action de Dieu
  choice: le malheur, au sens d’adversité éprouvée
  alternative: le mal ; l’adversité ; le désastre
  rationale: Le verset met en parallèle l’affliction passée et le malheur vécu, puis demande une joie de durée correspondante. Le contexte indique l’adversité subie plutôt que le mal moral, tout en maintenant sans l’atténuer l’affirmation selon laquelle Dieu a affligé les suppliants.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme « autant de jours… autant d’années » reproduit la structure poétique et la proportion de l’hébreu. « Réjouis-nous » est conservé malgré son emploi courant possible au sens de divertir, car le contexte de prière établit clairement le sens de « remplir de joie ».
