  source_fidelity: 'Le texte français rend fidèlement l’hébreu : יֵרָאֶה est bien exprimé par « se manifeste », פָעֳלֶךָ par « ton œuvre », et הֲדָרְךָ par « ta splendeur ». Le second membre conserve l’ellipse poétique et la préposition עַל (« sur »), sans transformer indûment la demande en une affirmation que les enfants « verront » la splendeur.'
