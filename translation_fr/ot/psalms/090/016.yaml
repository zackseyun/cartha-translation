source:
  edition: WLC
  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: fr
  text: Que ton œuvre se manifeste à tes serviteurs, et ta splendeur sur leurs enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: se manifeste
  rationale: Le niphal exprime ici le fait de devenir visible ou d’apparaître. « Se manifeste » est naturel en français et conserve l’idée d’une œuvre rendue perceptible.
- source_word: פָעֳלֶךָ
  choice: ton œuvre
  rationale: Le singulier collectif désigne l’action ou l’œuvre accomplie par Dieu; « œuvre » respecte la formulation concise de l’hébreu.
- source_word: וַהֲדָרְךָ
  choice: et ta splendeur
  rationale: הָדָר peut désigner la majesté, la magnificence ou la splendeur. « Splendeur » convient au parallèle avec l’œuvre divine sans préciser indûment son effet.
- source_word: עַל בְּנֵיהֶם
  choice: sur leurs enfants
  rationale: La préposition עַל est conservée par « sur », tandis que בָּנִים est rendu par « enfants » au sens de descendants de la génération présente.
theological_decisions:
- issue: Nature de la manifestation demandée
  choice: Ne pas expliciter s’il s’agit d’une intervention, d’une bénédiction ou d’une révélation.
  alternative: Que tes actes puissants soient visibles à tes serviteurs.
  rationale: Le texte associe sobrement l’œuvre de Dieu à sa manifestation; une explicitation réduirait l’ouverture sémantique et théologique de la prière.
- issue: Rapport de la splendeur divine aux enfants
  choice: Conserver « sur leurs enfants ».
  alternative: Que leurs enfants voient ta splendeur.
  rationale: L’hébreu ne répète pas explicitement le verbe et emploie עַל. La formulation retenue préserve ce parallélisme elliptique et laisse ouverte la manière dont la splendeur repose sur eux ou se révèle à eux.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique et l’ellipse du second membre sont conservés sans ajouter un verbe absent de l’hébreu.
