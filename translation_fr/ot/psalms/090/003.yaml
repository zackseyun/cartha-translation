  text: תָּשֵׁ֣ב אֱ֭נוֹשׁ עַד דַּכָּ֑א וַ֝/תֹּ֗אמֶר שׁ֣וּבוּ בְנֵי אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: fr
  text: 'Tu ramènes l’être humain à la poussière[a], et tu dis : « Retournez, fils des hommes[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ce qui est broyé » ou « à l’écrasement » ; le terme hébreu désigne ce qui est broyé ou réduit en poudre. Ici, « poussière » en exprime le sens dans le contexte.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « fils d’Adam/de l’homme » ; l’expression peut désigner les êtres humains.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: tu fais retourner
  rationale: 'Le hiphil de שוב exprime ici la causalité : Dieu fait revenir l’être humain à son état mortel. Cette formulation conserve aussi le lien verbal avec l’impératif שׁוּבוּ.'
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Le terme désigne l’humain mortel et fragile. Le singulier collectif français rend cette portée sans réduire le référent aux seuls hommes de sexe masculin.
- source_word: עַד דַּכָּא
  choice: à la poussière
  rationale: דַּכָּא évoque ce qui est broyé ou réduit en poudre. « La poussière » exprime naturellement le résultat dans ce contexte de mortalité, tout en laissant l’alternative lexicale en note.
- source_word: וַתֹּאמֶר
  choice: et tu dis
  rationale: Le présent convient à l’énoncé poétique et général du psaume, tout en maintenant l’adresse directe à Dieu.
- source_word: שׁוּבוּ
  choice: Retournez
  rationale: L’impératif pluriel reprend la racine שוב de תָּשֵׁב. « Retournez » préserve cette répétition structurante.
- source_word: בְנֵי אָדָם
  choice: fils d’Adam
  rationale: La traduction conserve la forme imagée de l’hébreu et le lien lexical avec Adam, pertinent dans un contexte de retour à la poussière. Une formulation générique est donnée en note.
theological_decisions:
- issue: Portée anthropologique de אֱנוֹשׁ
  choice: l’être humain
  alternative: l’homme mortel
  rationale: Le terme souligne la fragilité de l’humanité. « L’être humain » garde la valeur collective et universelle sans ajouter explicitement un qualificatif absent du texte.
- issue: Interprétation de בְנֵי אָדָם
  choice: fils d’Adam
  alternative: êtres humains / enfants des humains
  rationale: « Fils d’Adam » préserve l’expression hébraïque et sa possible résonance avec l’origine et la mortalité humaines, sans imposer que le nom propre soit l’unique lecture possible; la portée idiomatique est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement maintient l’adresse directe à Dieu habituelle dans le psaume. La répétition de la racine « retourner » est conservée, ainsi que l’image hébraïque « fils d’Adam », éclairée par une note.
