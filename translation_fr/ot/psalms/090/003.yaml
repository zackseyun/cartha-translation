  naturalness: « Tu fais retourner l’être humain » est compréhensible, mais « Tu ramènes l’être humain » est plus idiomatique en français moderne tout en gardant le parallélisme avec « Retournez ». « Fils des hommes » convient au registre poétique et solennel du psaume.
