source:
  edition: WLC
  text: בַּ֭/בֹּקֶר יָצִ֣יץ וְ/חָלָ֑ף לָ֝/עֶ֗רֶב יְמוֹלֵ֥ל וְ/יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/006.yaml
  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: fr
  text: Le matin, elle germe[a] et grandit[b] ; le soir, elle se flétrit[c] et se dessèche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle fleurit » ; le verbe hébreu peut désigner aussi bien la germination que la floraison.
    reason: lexical_alternative
  - marker: b
    text: Plus littéralement, « et passe » ou « et change » ; dans cette image végétale, le verbe semble décrire la croissance passagère de l’herbe.
    reason: lexical_alternative
  - marker: c
    text: Ou « elle est coupée » ; le verbe hébreu peut évoquer soit le flétrissement, soit le fait d’être retranché.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Le matin
  rationale: Expression temporelle naturelle en français, qui marque le début du cycle très bref de l’herbe.
- source_word: יָצִיץ
  choice: elle germe
  rationale: Le verbe décrit l’apparition ou l’épanouissement d’une plante. « Germe » rend ici le début de sa croissance, tandis que « fleurit » demeure possible.
- source_word: וְחָלָף
  choice: et grandit
  rationale: Dans cette image végétale, le verbe semble évoquer la progression ou la vigueur passagère de l’herbe. « Grandit » est idiomatique, sans effacer l’autre sens possible de « passer » ou « changer ».
- source_word: לָעֶרֶב
  choice: le soir
  rationale: Rend directement le contraste temporel avec « le matin » et souligne la brièveté du cycle décrit.
- source_word: יְמוֹלֵל
  choice: elle se flétrit
  rationale: Dans un contexte végétal, le verbe peut désigner le dépérissement, mais aussi le fait d’être coupé. « Se flétrit » s’accorde naturellement avec le dessèchement qui suit, sans introduire explicitement un agent.
- source_word: וְיָבֵשׁ
  choice: et se dessèche
  rationale: Rend directement le dernier stade du dépérissement de la plante dans un français courant et digne.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et poétique. Le pronom féminin « elle » reprend naturellement « l’herbe » du contexte immédiat du psaume. Le parallélisme entre « le matin » et « le soir » ainsi que la progression de la germination au dessèchement sont conservés.
