source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה עַד מָתָ֑י וְ֝/הִנָּחֵ֗ם עַל עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: fr
  text: Reviens, Yahweh ! Jusqu’à quand ? Aie compassion[a] de tes serviteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « laisse-toi fléchir en faveur de tes serviteurs » ; le verbe peut aussi exprimer le fait de renoncer à une action projetée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Reviens
  rationale: L’impératif de שוב adressé à Yahweh conserve ici sa force directe, relationnelle et imagée, propre au langage de lamentation. « Renonce » ou « apaise-toi » anticiperait la nuance du verbe suivant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עַד מָתָי
  choice: Jusqu’à quand ?
  rationale: Formule française naturelle et traditionnelle de la lamentation, qui garde l’urgence de la question hébraïque.
- source_word: וְהִנָּחֵם
  choice: Aie compassion
  rationale: Le niphal impératif de נחם peut exprimer le fait de se laisser fléchir, de renoncer à une action ou d’être ému de compassion. Dans ce contexte, « aie compassion » rend clairement la dimension affective sans suggérer une faute morale chez Dieu.
- source_word: עַל
  choice: de
  rationale: Avec « avoir compassion », le français idiomatique construit le complément avec « de » ; cette préposition marque ici les personnes en faveur desquelles Yahweh est prié d’agir.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette prière adressée à Dieu, « serviteurs » exprime naturellement l’appartenance et le service, sans mettre au premier plan la nuance sociale d’esclavage que le terme peut avoir ailleurs.
theological_decisions:
- issue: Sens de נחם appliqué à Dieu
  choice: Aie compassion
  alternative: Laisse-toi fléchir en faveur de tes serviteurs
  rationale: L’hébreu peut évoquer à la fois la compassion et un changement dans la conduite annoncée. Le texte principal reste naturel en français et évite « repens-toi », qui suggérerait aujourd’hui la correction d’une faute morale ; la note conserve explicitement la nuance possible de relâchement ou de changement de décision.
translation_notes:
  register: Français international moderne, simple et digne. L’exclamation après l’invocation rend la vigueur de l’impératif hébreu, tandis que la question brève conserve le rythme urgent de la lamentation.
