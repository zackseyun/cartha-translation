  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: fr
  text: Prière de Moïse[a], l’homme de Dieu. Seigneur, tu as été notre demeure[b], de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le titre, on pourrait aussi comprendre : « par Moïse » ou « pour Moïse » ; la préposition hébraïque peut indiquer l’auteur, l’association ou la destination.'
    reason: alternative_reading
  - marker: b
    text: Ou « un refuge » ou « un lieu d’habitation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Prière
  rationale: Dans un titre de psaume, le nom français sans article est naturel et rend directement le genre indiqué par le terme hébreu.
- source_word: לְמֹשֶׁה
  choice: de Moïse
  rationale: Cette formulation convient à un titre français et laisse ouverte la portée de la préposition hébraïque לְ, qui peut signaler l’auteur, l’association ou la destination.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: L’article défini de l’hébreu est conservé, ainsi que le titre traditionnel appliqué ici à Moïse.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Le terme fonctionne ici comme un titre divin employé en adresse directe; « Seigneur » est son équivalent français naturel et digne.
- source_word: מָעוֹן
  choice: une demeure
  rationale: Le mot désigne un lieu d’habitation. « Demeure » conserve la métaphore spatiale sans la réduire à la seule idée de refuge.
- source_word: הָיִיתָ לָּנוּ
  choice: tu as été pour nous
  rationale: Le passé composé exprime naturellement en français une réalité établie dans le passé et toujours pertinente pour la communauté qui parle.
- source_word: בְּדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette expression française idiomatique restitue la continuité à travers les générations successives.
theological_decisions:
- issue: Portée de la préposition לְ dans le titre לְמֹשֶׁה
  choice: de Moïse
  alternative: par Moïse / pour Moïse
  rationale: La préposition hébraïque permet plusieurs relations possibles. « De Moïse » maintient une certaine neutralité sans transformer implicitement le titre en affirmation exclusive d’auteur ou de dédicace.
- issue: Image de Dieu comme מָעוֹן
  choice: une demeure
  alternative: un refuge / un lieu d’habitation
  rationale: « Demeure » préserve l’image fondamentale d’un lieu où habiter. « Refuge » exprimerait une implication possible, mais préciserait davantage que le texte hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement convient à l’adresse directe à Dieu dans le registre biblique français contemporain. La formulation conserve le parallélisme temporel et la métaphore de l’habitation.
