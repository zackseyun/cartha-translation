source:
  edition: WLC
  text: שַׂבְּעֵ֣/נוּ בַ/בֹּ֣קֶר חַסְדֶּ֑/ךָ וּֽ/נְרַנְּנָ֥ה וְ֝/נִשְׂמְחָ֗ה בְּ/כָל יָמֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: fr
  text: Rassasie-nous au matin de ton amour fidèle[a], et nous chanterons de joie et nous nous réjouirons tous nos jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ton amour loyal », « de ton amour d’alliance » ou « de ta miséricorde ». Le mot hébreu חֶסֶד évoque un amour bienveillant, loyal et durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Rassasie-nous
  rationale: L’impératif piel de שבע, avec suffixe de première personne du pluriel, demande d’être pleinement comblés. « Rassasie-nous » exprime naturellement l’idée d’une satisfaction abondante tout en conservant l’image hébraïque.
- source_word: בַבֹּקֶר
  choice: au matin
  rationale: L’expression signifie littéralement « au matin ». Cette formulation conserve la valeur temporelle sans imposer l’idée de répétition (« chaque matin ») ni celle d’une échéance (« d’ici le matin »).
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne ici un amour bienveillant, loyal et durable. « Amour fidèle » restitue à la fois l’affection et la constance impliquées, sans limiter le terme à la seule miséricorde ni expliciter dans le texte une dimension d’alliance qui demeure implicite.
- source_word: וּנְרַנְּנָה
  choice: et nous chanterons de joie
  rationale: Le verbe רנן évoque une manifestation vocale et exubérante de joie, qui peut être un cri ou un chant. « Chanterons de joie » est naturel en français et garde cette dimension audible. Le futur rend ici de manière fluide la nuance cohortative de conséquence ou de visée après l’impératif.
- source_word: וְנִשְׂמְחָה
  choice: et nous nous réjouirons
  rationale: שמח exprime la joie éprouvée et manifestée. « Nous nous réjouirons » préserve le parallélisme avec le chant joyeux du membre précédent.
- source_word: בְּכָל יָמֵינוּ
  choice: tous nos jours
  rationale: L’expression désigne l’ensemble des jours de la vie des locuteurs. « Tous nos jours » est concise, idiomatique et fidèle à la portée temporelle de l’hébreu.
theological_decisions:
- issue: Traduction de חֶסֶד dans une prière sollicitant la faveur divine
  choice: ton amour fidèle
  alternative: ton amour loyal ; ton amour d’alliance ; ta miséricorde
  rationale: Le verset invoque la bonté aimante, durable et loyale de Dieu comme source de joie. « Amour fidèle » conserve cette richesse théologique sans réduire le mot à la miséricorde ni rendre explicite une référence à l’alliance que le terme peut évoquer mais que le contexte immédiat ne formule pas.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la poésie concise du verset, le parallélisme des deux verbes de joie et l’ambiguïté temporelle de « au matin ».
