  text: כִּֽי כָלִ֥ינוּ בְ/אַפֶּ֑/ךָ וּֽ/בַ/חֲמָתְ/ךָ֥ נִבְהָֽלְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: fr
  text: Car nous sommes consumés par ta colère[a] et épouvantés par ta fureur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous arrivons à notre fin par ta colère ». Le verbe hébreu peut signifier être achevé, consumé ou parvenir à sa fin.
    reason: lexical_alternative
  - marker: b
    text: Ou « bouleversés » ou « terrifiés ». Le verbe hébreu exprime l’effroi, la consternation ou un profond trouble.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: La particule introduit ici une confirmation explicative de ce qui précède. « Oui » rend naturellement cette valeur en français sans imposer une relation causale trop étroite.
- source_word: כָלִינוּ
  choice: nous sommes consumés
  rationale: Le verbe כלה peut exprimer l’épuisement, l’anéantissement ou le fait d’arriver à son terme. « Sommes consumés » conserve la force de l’image et sa possible valeur résultative.
- source_word: בְאַפֶּךָ
  choice: par ta colère
  rationale: 'La préposition בְּ est comprise dans un sens causal ou instrumental : la colère divine est ce qui consume les êtres humains.'
- source_word: חֲמָתְךָ
  choice: ta fureur
  rationale: חֵמָה désigne une vive colère, souvent conçue comme ardente. « Fureur » la distingue de אַף tout en respectant l’intensification poétique.
- source_word: נִבְהָלְנוּ
  choice: épouvantés
  rationale: Le nifal de בהל exprime le bouleversement, l’effroi ou la consternation. « Épouvantés » restitue ici l’intensité de la réaction face à la fureur divine.
theological_decisions:
- issue: Rendu parallèle des deux termes désignant la colère divine
  choice: « colère » et « fureur »
  alternative: Employer deux fois « colère », ou rendre חֵמָה par « courroux »
  rationale: L’hébreu emploie deux mots apparentés mais distincts, אַף et חֵמָה. Les différencier préserve l’intensification poétique sans leur attribuer artificiellement deux doctrines distinctes.
- issue: Degré d’anéantissement exprimé par כָלִינוּ
  choice: « nous sommes consumés » avec une variante en note
  alternative: « nous arrivons à notre fin »
  rationale: Le contexte associe la fragilité humaine au jugement divin, mais le verbe permet aussi bien l’idée d’être consumé que celle de parvenir à son terme. La traduction principale reste forte sans exclure l’autre nuance.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme concis de l’hébreu est conservé, avec deux termes distincts pour la colère divine. « Épouvantés » est courant mais soutenu, adapté au registre du psaume.
