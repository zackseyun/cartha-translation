  text: תְּפִלָּה֮ לְ/מֹשֶׁ֪ה אִֽישׁ הָ/אֱלֹ֫הִ֥ים אֲֽדֹנָ֗/י מָע֣וֹן אַ֭תָּה הָיִ֥יתָ לָּ֗/נוּ בְּ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/000.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: fr
  text: Prière de Moïse[a], l’homme de Dieu. Seigneur, tu as été pour nous une demeure[b] de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans la suscription, la préposition hébraïque peut aussi indiquer une association ou une dédicace : « prière liée à Moïse » ou « prière pour Moïse ».'
    reason: alternative_reading
  - marker: b
    text: Ou « un refuge » ou « un lieu d’habitation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Prière
  rationale: Équivalent direct et naturel du nom hébreu désignant une prière.
- source_word: אִישׁ הָאֱלֹהִים
  choice: l’homme de Dieu
  rationale: Expression consacrée qui restitue formellement le titre hébreu sans en préciser davantage la fonction.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Rend le titre divin Adonaï selon l’usage français courant, avec une adresse directe.
- source_word: מָעוֹן
  choice: une demeure
  rationale: Le terme désigne un lieu où l’on demeure; « demeure » conserve l’image spatiale et protectrice sans la réduire explicitement à celle d’un refuge.
- source_word: בְּדֹר וָדֹר
  choice: de génération en génération
  rationale: Formulation idiomatique qui reproduit la continuité exprimée par l’hébreu.
theological_decisions:
- issue: Rapport entre Moïse et la prière dans la suscription
  choice: Prière de Moïse
  alternative: Prière pour Moïse / prière appartenant à Moïse
  rationale: La préposition לְ peut signaler l’auteur, l’association ou la dédicace. La formulation principale suit la compréhension traditionnelle la plus naturelle, tandis que la note préserve l’ambiguïté grammaticale.
- issue: Métaphore appliquée au Seigneur
  choice: une demeure
  alternative: un refuge / un lieu d’habitation
  rationale: Le choix conserve la métaphore hébraïque sans interpréter exclusivement la protection divine comme refuge.
translation_notes:
  register: Français international moderne, digne et accessible. La suscription est maintenue dans la même unité que le premier énoncé, conformément au texte fourni. Le tutoiement rend l’adresse directe à Dieu et s’accorde avec l’usage biblique français courant.
