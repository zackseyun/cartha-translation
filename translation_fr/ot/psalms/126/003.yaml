source:
  edition: WLC
  text: הִגְדִּ֣יל יְ֭הוָה לַ/עֲשׂ֥וֹת עִמָּ֗/נוּ הָיִ֥ינוּ שְׂמֵחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/003.yaml
  text: Yahweh has done great things for us[a]; we were glad.
translation:
  language: fr
  text: Yahweh a fait de grandes choses pour nous[a] ; nous étions dans la joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Yahweh a fait de grandes choses avec nous. »'
    reason: Alternative lexicale préservant le sens littéral de la préposition עִם.
lexical_decisions:
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: a fait de grandes choses
  rationale: L’association du hiphil de גדל avec l’infinitif עשה forme une expression idiomatique signifiant « faire de grandes choses ». Cette formulation française en rend naturellement le sens sans reproduire lourdement la structure infinitive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que remplacé par un titre.
- source_word: עִמָּנוּ
  choice: pour nous
  rationale: Bien que עם signifie littéralement « avec », le contexte permet une nuance bénéficiaire. « Pour nous » est idiomatique en français et s’accorde avec l’action bienfaisante évoquée ; la note conserve la lecture plus littérale.
- source_word: הָיִינוּ שְׂמֵחִים
  choice: nous étions dans la joie
  rationale: Le parfait de היה suivi de l’adjectif שׂמח décrit l’état qui en résulte dans une perspective passée. « Dans la joie » est naturel, poétique et inclusif, sans transformer explicitement l’adjectif en action de se réjouir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin sans lui substituer un titre.
- issue: Valeur de la préposition עִם dans עִמָּנוּ
  choice: pour nous
  alternative: avec nous
  rationale: La valeur bénéficiaire convient au contexte et produit un français naturel, mais la valeur comitative littérale demeure possible et est donc signalée en note.
translation_notes:
  register: Français international actuel, simple et digne. Le point-virgule conserve le parallélisme des deux propositions, et « dans la joie » maintient une tonalité poétique sans marquage de genre.
