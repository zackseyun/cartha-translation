id: PSA.126.4
reference: Psalms 126:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה אֶת שבות/נו כַּ/אֲפִיקִ֥ים בַּ/נֶּֽגֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/004.yaml
  text: Restore our fortunes[a], O Yahweh[b], like streams in the Negev.
translation:
  language: fr
  text: Rétablis notre sort[a], Yahvé, comme les torrents dans le Néguev[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ramène nos captifs » ou « mets fin à notre captivité ». La tournure hébraïque peut désigner précisément le retour des exilés ou, plus largement, le rétablissement de la situation d’un peuple.
    reason: alternative_reading
  - marker: b
    text: L’image évoque les lits de cours d’eau habituellement secs du Néguev, que les pluies peuvent remplir soudainement.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבָה
  choice: Rétablis
  rationale: Impératif de שוב adressé à Yahvé. Avec אֶת et שְׁבוּת, il exprime ici le renversement d’une situation éprouvante et le rétablissement de la communauté, sans limiter la demande au seul retour géographique des exilés.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin יהוה, qui conserve dans le texte le caractère personnel du tétragramme plutôt que de lui substituer un titre.
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule grammaticale n’a pas de sens lexical autonome en français; sa fonction est rendue par la syntaxe.
- source_word: שבותנו
  choice: notre sort
  rationale: Dans la tournure שוב את־שבות, le terme peut évoquer la captivité ou, plus largement, le rétablissement de la condition d’un peuple. « Notre sort » garde cette ampleur et forme en français l’expression naturelle « rétablir le sort ».
- source_word: כַּאֲפִיקִים
  choice: comme les torrents
  rationale: אֲפִיקִים désigne des lits, chenaux ou cours d’eau. Dans le Néguev, il s’agit de cours d’eau temporaires qui se remplissent brusquement après les pluies; « torrents » rend naturellement leur force soudaine.
- source_word: בַּנֶּגֶב
  choice: dans le Néguev
  rationale: Le contexte désigne la région aride du sud d’Israël, et non simplement une direction géographique. Le nom propre rend l’image concrète.
theological_decisions:
- issue: Sens de la tournure שוב את־שבות
  choice: Prière pour le rétablissement du sort ou de la condition de la communauté
  alternative: Prière visant précisément le retour des captifs ou des exilés
  rationale: La tournure hébraïque permet les deux compréhensions. Le contexte du psaume garde une résonance d’exil et de retour, mais le texte principal conserve la portée plus large de la demande sans exclure cette lecture historique.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation concise conserve le parallélisme poétique, l’invocation directe du nom divin et l’ambiguïté de l’expression hébraïque relative au rétablissement.
