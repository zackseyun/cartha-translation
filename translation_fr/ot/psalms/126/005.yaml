  yaml_path: translation/ot/psalms/126/005.yaml
  text: Those who sow in tears will reap with joyful shouting[a].
translation:
  language: fr
  text: Ceux qui sèment dans les larmes moissonneront avec des cris de joie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des chants d’allégresse ». Le mot hébreu רִנָּה désigne une clameur jubilante et peut également évoquer un chant de joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: Ceux qui sèment
  rationale: Le participe précédé de l’article est employé comme un substantif et désigne de manière générale les personnes qui sèment. Cette tournure est naturelle en français et conserve le pluriel générique.
- source_word: בְּדִמְעָה
  choice: dans les larmes
  rationale: La préposition בְּ avec le nom singulier collectif exprime ici la manière ou les circonstances. « Dans les larmes » rend idiomatiquement l’idée de semer en pleurant.
- source_word: בְּרִנָּה
  choice: avec des cris de joie
  rationale: רִנָּה désigne une clameur jubilante et peut aussi évoquer un chant d’allégresse. « Avec des cris de joie » conserve le caractère sonore et exultant du terme sans le limiter au chant.
- source_word: יִקְצֹרוּ
  choice: moissonneront
  rationale: L’imparfait hébreu exprime ici le résultat futur. « Moissonneront » maintient le parallélisme agricole avec « sèment » et convient au registre poétique.
