  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/000.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: fr
  text: Chant des montées. Quand Yahvé a rétabli le sort de Sion[a], nous étions comme ceux qui rêvent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ramena les captifs de Sion » ou « mit fin à la captivité de Sion ». L’expression hébraïque peut désigner précisément le retour d’exil ou, plus largement, le rétablissement d’une situation heureuse.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend naturellement le titre hébreu tout en conservant son image traditionnelle et son possible lien avec les pèlerinages vers Jérusalem.
- source_word: בְּשׁוּב יְהוָה אֶת שִׁיבַת צִיּוֹן
  choice: Quand Yahvé rétablit la situation de Sion
  rationale: La tournure idiomatique hébraïque peut désigner le retour des exilés ou, plus largement, un rétablissement heureux. Le texte principal conserve cette portée générale, tandis que la note signale l'autre lecture.
- source_word: כְּחֹלְמִים
  choice: comme ceux qui rêvent
  rationale: Traduction proche de l'image hébraïque, qui évoque une expérience si étonnante qu'elle paraît irréelle.
theological_decisions:
- issue: Sens historique précis du rétablissement de Sion
  choice: 'Formulation générale : « rétablit la situation de Sion »'
  alternative: « ramena les captifs de Sion » ou « mit fin à la captivité de Sion »
  rationale: L'expression hébraïque permet une référence précise au retour d'exil, mais peut aussi désigner plus largement le rétablissement du sort ou de la situation d'un peuple. La traduction ne tranche pas au-delà du texte.
translation_notes:
  register: Français international moderne, simple et digne. « Yahvé » représente explicitement le nom divin יהוה. « Chant des montées » conserve la formulation imagée du titre sans imposer une explication particulière de sa fonction.
