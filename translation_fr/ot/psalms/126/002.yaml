  text: אָ֤ז יִמָּלֵ֪א שְׂח֡וֹק פִּי/נוּ֮ וּ/לְשׁוֹנֵ֪/נוּ רִ֫נָּ֥ה אָ֭ז יֹאמְר֣וּ בַ/גּוֹיִ֑ם הִגְדִּ֥יל יְ֝הוָ֗ה לַ/עֲשׂ֥וֹת עִם אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: fr
  text: 'Alors notre bouche s’est remplie de rires,

    et notre langue de cris de joie[a].


    Alors, parmi les nations, on disait :

    « Yahweh a fait de grandes choses pour eux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de clameurs joyeuses »; le mot hébreu désigne un cri retentissant de joie, qui peut aussi être chanté.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Yahweh a fait grandement avec ceux-ci »; c’est une expression hébraïque qui signifie qu’il a accompli de grandes choses en leur faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque naturellement en français la conséquence temporelle de la restauration évoquée au verset précédent.
- source_word: יִמָּלֵא
  choice: s’est remplie
  rationale: Le contexte poétique est rétrospectif; le passé composé exprime en français actuel le résultat vécu tout en conservant la valeur passive du verbe.
- source_word: שְׂחוֹק
  choice: rires
  rationale: Le terme désigne ici des rires de joie, en parallèle avec les cris joyeux et sans nuance de moquerie.
- source_word: פִּינוּ
  choice: notre bouche
  rationale: Conserve le singulier collectif de l’hébreu, idiomatique également en français dans cette expression poétique.
- source_word: וּלְשׁוֹנֵנוּ
  choice: et notre langue
  rationale: Maintient le singulier collectif et le parallélisme corporel avec « notre bouche ».
- source_word: רִנָּה
  choice: cris de joie
  rationale: Rend l’idée d’un cri retentissant et joyeux sans la limiter au chant.
- source_word: יֹאמְרוּ
  choice: on disait
  rationale: L’imparfait présente la parole qui circulait parmi les nations; le pronom « on » évite d’ajouter un sujet absent de la proposition hébraïque.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: Traduction transparente et non confessionnelle des peuples étrangers environnants.
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: a fait de grandes choses
  rationale: Rend naturellement l’idiome hébreu signifiant agir grandement ou accomplir de grandes choses.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: עִם אֵלֶּה
  choice: pour eux
  rationale: Littéralement « avec ceux-ci »; le français benefactif « pour eux » exprime naturellement les bienfaits accomplis en faveur du groupe désigné.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le nom propre sans le remplacer par un titre.
- issue: Valeur temporelle de יִמָּלֵא
  choice: 'passé rétrospectif : « s’est remplie »'
  alternative: 'futur : « se remplira »'
  rationale: Le verset poursuit le souvenir de la restauration racontée comme un événement vécu, mais la morphologie imparfaite permet une lecture future dans une autre compréhension du psaume.
- issue: Identification du sujet de יֹאמְרוּ
  choice: sujet indéfini rendu par « on »
  alternative: « ils disaient » en comprenant les nations comme sujet
  rationale: L’hébreu place « parmi les nations » avant la citation sans nommer explicitement le sujet. « On disait parmi les nations » préserve cette légère indétermination.
translation_notes:
  register: Français international moderne, naturel et digne. La disposition en lignes conserve le parallélisme poétique. « Rires » et « cris de joie » rendent l’exubérance du passage; « on disait » préserve l’indétermination syntaxique sans alourdir la phrase.
