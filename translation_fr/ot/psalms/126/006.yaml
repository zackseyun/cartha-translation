  text: הָ֘ל֤וֹךְ יֵלֵ֨ךְ וּ/בָכֹה֮ נֹשֵׂ֪א מֶֽשֶׁךְ הַ֫/זָּ֥רַע בֹּֽ֬א יָב֥וֹא בְ/רִנָּ֑ה נֹ֝שֵׂ֗א אֲלֻמֹּתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/006.yaml
  text: He surely goes out weeping[a], carrying the seed for sowing; he will surely come in with joyful shouting[b], carrying his sheaves.
translation:
  language: fr
  text: Il s’en va en pleurant, portant la semence à semer[a] ; il reviendra assurément avec des cris de joie[b], portant ses gerbes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il poursuit son chemin en pleurant, portant un sac de semence ». L’expression hébraïque rendue par « la semence à semer » est difficile ; certains la comprennent plus concrètement comme un sac ou une provision de semence.
    reason: lexical_alternative
  - marker: b
    text: Ou « en chantant » ou « dans l’allégresse ». Le terme hébreu désigne un cri ou une vive expression de joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: Il s’en va
  rationale: La construction infinitif absolu + imparfait intensifie l’action. En français, la tournure simple, placée en parallèle avec « il reviendra », rend naturellement ce mouvement sans répétition artificielle.
- source_word: וּבָכֹה
  choice: en pleurant
  rationale: L’infinitif absolu coordonné décrit la manière dont l’homme s’en va ; « en pleurant » est idiomatique et précis.
- source_word: נֹשֵׂא
  choice: portant
  rationale: Le participe exprime une action concomitante et se rend directement par le participe présent français.
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: la semence à répandre
  rationale: L’expression hébraïque est difficile. Dans le contexte agricole, elle désigne ce qui est emporté pour être semé, sans qu’il soit nécessaire de préciser de façon incertaine s’il s’agit d’un sac ou d’une provision mesurée.
- source_word: בֹּא יָבֹא
  choice: il reviendra
  rationale: La construction infinitif absolu + imparfait souligne la certitude du retour. « Reviendra » exprime naturellement le mouvement complémentaire au départ vers les champs.
- source_word: בְרִנָּה
  choice: avec des cris de joie
  rationale: רִנָּה évoque une manifestation sonore et éclatante de joie, plutôt qu’un simple sentiment intérieur.
- source_word: אֲלֻמֹּתָיו
  choice: ses gerbes
  rationale: Le terme désigne précisément des gerbes de la récolte ; le mot français est courant et conserve l’image agricole.
