  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת בְּ/שׁ֣וּב יְ֭הוָה אֶת שִׁיבַ֣ת צִיּ֑וֹן הָ֝יִ֗ינוּ כְּ/חֹלְמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: fr
  text: Chant des montées. Quand Yahweh a rétabli le sort de Sion[a], nous étions comme ceux qui rêvent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a ramené les captifs de Sion » ou « a mis fin à la captivité de Sion ». L’expression hébraïque peut désigner précisément le retour d’exil ou, plus largement, le rétablissement du sort de Sion.
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend le titre traditionnel de cette collection de psaumes tout en conservant le sens concret de מַעֲלוֹת, sans préciser s’il s’agit de pèlerinages ou d’une autre forme de montée.
- source_word: בְּשׁוּב
  choice: Quand ... a rétabli
  rationale: La préposition ב avec l’infinitif construit introduit ici naturellement une proposition temporelle. Dans cette expression, שוב évoque le retour à un état favorable ou le fait de ramener.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu.
- source_word: שִׁיבַת צִיּוֹן
  choice: la situation de Sion
  rationale: Avec le verbe שוב, l’expression peut désigner au sens large le rétablissement de la situation de Sion, tout en pouvant évoquer plus précisément le retour de ses captifs; cette seconde possibilité est conservée en note.
- source_word: הָיִינוּ
  choice: nous étions
  rationale: Rend simplement la forme accomplie de היה comme un état passé.
- source_word: כְּחֹלְמִים
  choice: comme des gens qui rêvent
  rationale: Reproduit la comparaison et la valeur personnelle du participe, dans un français moderne et naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte le tétragramme; sa transcription préserve le nom propre sans le remplacer par un titre.
- issue: Sens de שִׁיבַת צִיּוֹן
  choice: a rétabli la situation de Sion
  alternative: a ramené les captifs de Sion / a mis fin à la captivité de Sion
  rationale: L’expression hébraïque peut décrire un renversement général de situation ou, plus précisément, un retour d’exil. Le texte principal garde le sens large et la note maintient l’autre lecture possible.
translation_notes:
  register: Français international moderne, sobre et poétique. « Chant des montées » conserve le titre traditionnel sans explicitation interprétative. La tournure « des gens qui rêvent » reste immédiatement compréhensible tout en suivant la forme hébraïque.
