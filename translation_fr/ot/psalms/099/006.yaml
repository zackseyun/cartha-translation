source:
  edition: WLC
  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: fr
  text: 'Moïse et Aaron étaient parmi ses prêtres[a],

    et Samuel parmi ceux qui invoquaient son nom.

    Ils faisaient appel à Yahweh,

    et il leur répondait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu range ici Moïse et Aaron « parmi ses prêtres », sans préciser la nature exacte du rôle sacerdotal de chacun.
    reason: Préserver la formulation du texte tout en évitant de résoudre silencieusement la question du statut sacerdotal de Moïse.
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: étaient parmi ses prêtres
  rationale: 'La préposition בְּ a ici naturellement une valeur partitive : Moïse et Aaron sont comptés parmi les prêtres de Dieu. Le verbe « étaient » est ajouté pour former une phrase française naturelle, tandis que « prêtres » rend le sens ordinaire de כֹּהֵן.'
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: parmi ceux qui invoquaient son nom
  rationale: Cette expression participiale, parallèle à « parmi ses prêtres », classe Samuel parmi ceux qui s'adressaient à Dieu dans la prière ou le culte. « Invoquaient son nom » conserve explicitement שְׁמוֹ et son sens religieux.
- source_word: קֹרִאים אֶל
  choice: ils appelaient
  rationale: La formulation reprend l'activité habituelle des personnages nommés. « Appelaient » respecte la construction avec אֶל sans imposer l'idée plus étroite d'un cri de détresse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: יַעֲנֵם
  choice: il leur répondait
  rationale: L'imparfait hébreu se comprend bien comme une action habituelle dans ce rappel d'intercesseurs exemplaires. L'imparfait français exprime naturellement cette récurrence et maintient le parallélisme avec « ils appelaient ».
- source_word: שְׁמוֹ
  choice: son nom
  rationale: L'hébreu mentionne explicitement le nom de Dieu, idiome biblique important dans le contexte de la prière et du culte; il ne convient donc pas de le réduire à un simple pronom.
theological_decisions:
- issue: La manière de ranger Moïse et Aaron parmi les prêtres sans effacer la tension concernant la nature précise de leur rôle
  choice: Moïse et Aaron étaient parmi ses prêtres
  alternative: Moïse et Aaron étaient de ses hommes sacerdotaux
  rationale: Le texte classe directement Moïse et Aaron parmi « ses prêtres », mais ne définit pas dans ce verset la fonction cultuelle exacte de chacun. La traduction conserve cette affirmation sans assimiler explicitement leurs offices ni affaiblir כֹּהֵן en une expression vague.
- issue: Le parallélisme entre les prêtres et ceux qui invoquent le nom de Dieu
  choice: et Samuel parmi ceux qui invoquaient son nom
  alternative: et Samuel invoquait son nom
  rationale: La construction hébraïque présente deux groupes parallèles. Garder « parmi ceux qui » évite de transformer la seconde classification en une simple action isolée de Samuel.
translation_notes:
  register: Français international moderne, naturel et digne. « Invoquer son nom » garde une tonalité biblique encore claire pour le lecteur contemporain. Les imparfaits « appelaient » et « répondait » rendent la relation habituelle suggérée par les formes hébraïques.
