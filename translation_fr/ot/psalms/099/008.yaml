source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵי/נוּ֮ אַתָּ֪ה עֲנִ֫יתָ֥/ם אֵ֣ל נֹ֭שֵׂא הָיִ֣יתָ לָ/הֶ֑ם וְ֝/נֹקֵ֗ם עַל עֲלִילוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: fr
  text: Yahweh, notre Dieu, tu leur as répondu ; tu as été pour eux un Dieu qui pardonne[a], mais un vengeur de leurs actes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un Dieu qui porte ou enlève [leur faute] » ; le participe hébreu peut évoquer le pardon comme le fait d’emporter la culpabilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui tire vengeance de leurs actes » ; l’hébreu emploie ici un participe qui peut se comprendre comme un nom (« un vengeur ») ou de manière plus verbale (« tirant vengeance »).
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel révélé dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La forme avec suffixe de première personne du pluriel signifie directement « notre Dieu » et fonctionne ici avec « Yahweh » comme apostrophe.
- source_word: אַתָּה עֲנִיתָם
  choice: tu leur as répondu
  rationale: Le pronom explicite est conservé dans la forme verbale française, et ענה désigne ici la réponse de Dieu aux prières ou aux appels évoqués dans le contexte.
- source_word: אֵל נֹשֵׂא
  choice: un Dieu qui pardonne
  rationale: Le participe נשׂא signifie littéralement porter ou enlever ; appliqué à la faute, il exprime couramment le pardon. La formulation française reste naturelle tout en signalant le sens littéral en note.
- source_word: הָיִיתָ לָהֶם
  choice: tu as été pour eux
  rationale: La construction היה + ל décrit ce que Dieu a été à leur égard ; la tournure française en maintient la relation explicite.
- source_word: וְנֹקֵם
  choice: mais aussi celui qui exerce sa vengeance
  rationale: Le participe de נקם présente Dieu comme celui qui venge ou exerce la vengeance. « Mais aussi » rend le contraste contextuel avec le pardon sans effacer la coordination hébraïque.
- source_word: עַל עֲלִילוֹתָם
  choice: sur leurs agissements
  rationale: עַל conserve ici l'idée que la vengeance s'exerce à l'égard de leurs actes. « Agissements » convient au contexte judiciaire sans ajouter explicitement « mauvais », absent du nom hébreu.
theological_decisions:
- issue: Le pardon divin conjoint à la vengeance
  choice: Maintenir côte à côte le pardon accordé par Dieu et l'exercice de sa justice à l'égard des agissements des personnes concernées.
  alternative: Comprendre que Dieu pardonne entièrement ces personnes mais ne punit que d'autres, ou préciser qu'il punit directement les personnes plutôt que leurs actes.
  rationale: L'hébreu affirme les deux réalités sans expliquer leur articulation. La traduction conserve donc cette tension au lieu de déterminer qui subit exactement la vengeance ou comment celle-ci s'accorde avec le pardon.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l'adresse directe et le parallélisme du verset. « Agissements » préserve la portée assez large de עֲלִילוֹת sans introduire dans le nom lui-même une qualification morale absente de l'hébreu.
