  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: fr
  text: Exaltez Yahweh, notre Dieu, et prosternez-vous devant sa montagne sainte[a], car Yahweh, notre Dieu, est saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « adorez devant sa montagne sainte ». Le verbe hébreu peut désigner aussi bien le fait de se prosterner que celui d’adorer, et la préposition peut exprimer une orientation vers la montagne ou une relation cultuelle auprès d’elle.'
    reason: alternative lexicale et ambiguïté de la préposition
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Exaltez
  rationale: Impératif pluriel de רום exprimant l’élévation ou la glorification. « Exaltez » conserve la force poétique de l’appel sans paraphrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin יהוה, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le nom אֱלֹהִים muni du suffixe de première personne du pluriel signifie directement « notre Dieu ».
- source_word: וְהִשְׁתַּחֲווּ
  choice: et prosternez-vous
  rationale: Le verbe שׁחה désigne l’action de se courber ou de se prosterner et, par extension, l’adoration. Le choix retient l’image corporelle concrète.
- source_word: לְהַר קָדְשׁוֹ
  choice: vers sa montagne sainte
  rationale: La préposition לְ peut exprimer la direction ou la relation au lieu. « Vers » conserve la nuance spatiale et évite de présenter la montagne elle-même comme l’objet de l’adoration.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison des impératifs précédents; « car » convient au registre poétique et argumentatif du verset.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: Équivalent français courant de קָדוֹשׁ, terme central du refrain théologique du psaume.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahweh » conserve le nom divin au lieu de le remplacer par un titre.
- issue: Valeur cultuelle ou corporelle de וְהִשְׁתַּחֲווּ
  choice: prosternez-vous
  alternative: adorez
  rationale: Le verbe peut désigner à la fois le geste de prosternation et l’adoration accomplie par ce geste. Le texte principal préserve l’image concrète, tandis que la note signale la lecture cultuelle.
- issue: Rapport spatial exprimé par לְ devant « sa montagne sainte »
  choice: vers sa montagne sainte
  alternative: sur sa montagne sainte; auprès de sa montagne sainte
  rationale: La préposition permet une compréhension directionnelle ou locative. La traduction principale garde la direction sans trancher excessivement la relation exacte au sanctuaire.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif pluriel est conservé; « montagne sainte » maintient l’ordre naturel du français biblique sans archaïsme marqué.
