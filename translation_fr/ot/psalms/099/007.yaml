  text: בְּ/עַמּ֣וּד עָ֭נָן יְדַבֵּ֣ר אֲלֵי/הֶ֑ם שָׁמְר֥וּ עֵ֝דֹתָ֗י/ו וְ/חֹ֣ק נָֽתַן לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/007.yaml
  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: fr
  text: Dans une colonne de nuée, il leur parlait[a] ; ils ont observé ses témoignages et la prescription qu’il leur avait donnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De la colonne de nuée, il leur parlait. » La préposition hébraïque peut indiquer le lieu ou le moyen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: Dans une colonne de nuée
  rationale: La préposition בְּ peut marquer ici le lieu ou le moyen. « Dans » conserve naturellement l’image d’une parole divine au sein de la colonne de nuée, tandis qu’une note signale l’autre compréhension possible.
- source_word: יְדַבֵּר
  choice: il leur parlait
  rationale: L’imparfait français rend bien la valeur imperfective ou habituelle possible du yiqtol dans ce rappel poétique d’actions passées.
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: Le pronom renvoie naturellement aux personnages mentionnés au verset précédent, sans expliciter dans le texte ce que l’hébreu laisse pronominal.
- source_word: שָׁמְרוּ
  choice: ils ont observé
  rationale: Dans un contexte d’obéissance aux exigences divines, « observer » est idiomatique en français moderne et conserve la portée d’alliance du verbe שׁמר.
- source_word: עֵדֹתָיו
  choice: ses témoignages
  rationale: « Témoignages » maintient le terme juridique et théologique distinct employé par le psaume, sans le confondre avec חֹק dans la proposition suivante.
- source_word: וְחֹק
  choice: et la prescription
  rationale: « Prescription » exprime une règle fixée et garde le singulier de l’hébreu, tout en restant distinct de « témoignages ».
- source_word: נָתַן לָמוֹ
  choice: qu’il leur avait donnée
  rationale: La relative rattache naturellement le verbe à « la prescription ». Le plus-que-parfait clarifie en français que celle-ci avait été donnée avant d’être observée, sans modifier le rapport logique de l’hébreu.
theological_decisions:
- issue: Référents de « il » et « leur / ils »
  choice: « Il » désigne le SEIGNEUR ; « leur / ils » renvoie à Moïse, Aaron et Samuel, nommés au verset précédent.
  alternative: Les pronoms pluriels peuvent être compris plus largement comme visant Israël représenté par ces hommes.
  rationale: Les antécédents immédiats sont Moïse, Aaron et Samuel en Psaumes 99.6. La traduction conserve toutefois les pronoms du texte hébreu et n’impose donc pas une explicitation qui éliminerait toute portée représentative.
translation_notes:
  register: Français international moderne, sobre et poétique. L’imparfait « parlait » suggère une action passée répétée ou caractéristique ; le passé composé « ont observé » présente ensuite leur réponse comme un fait. Le vocabulaire juridique demeure accessible tout en préservant la distinction entre עֵדוֹת et חֹק.
