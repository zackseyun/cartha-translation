source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ יִרְגְּז֣וּ עַמִּ֑ים יֹשֵׁ֥ב כְּ֝רוּבִ֗ים תָּנ֥וּט הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: fr
  text: 'Yahweh règne[a] : que les peuples tremblent ! Il siège sur les chérubins[b] : que la terre tremble !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les peuples tremblent… la terre tremble. » Les verbes hébreux à l’imparfait peuvent aussi être compris ici comme des affirmations plutôt que comme des appels de type jussif.'
    reason: alternative_reading
  - marker: b
    text: 'On peut aussi traduire : « entre les chérubins » ou « au-dessus des chérubins ». L’expression hébraïque est un titre royal lié au sanctuaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre, conformément au texte hébreu.
- source_word: מָלָךְ
  choice: règne
  rationale: Dans cette proclamation poétique, le qatal exprime naturellement la royauté actuelle de Yahweh, sans imposer le sens ingressif « est devenu roi ».
- source_word: יִרְגְּזוּ עַמִּים
  choice: que les peuples tremblent
  rationale: Rend l’imparfait comme une réaction volitive de type jussif à la royauté divine; « peuples » conserve le pluriel collectif.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: Il siège au-dessus des chérubins
  rationale: « Siège » restitue la portée royale de יֹשֵׁב; « au-dessus » exprime le titre cultuel sans fixer trop précisément la relation spatiale.
- source_word: תָּנוּט הָאָרֶץ
  choice: que la terre soit ébranlée
  rationale: Le tour volitif fait pendant à « que les peuples tremblent »; « terre » convient à la portée cosmique, et « soit ébranlée » rend le mouvement ou vacillement exprimé par נוט.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie directement le tétragramme; la translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur des imparfaits יִרְגְּזוּ et תָּנוּט
  choice: 'lecture volitive : « que… tremblent… que… soit ébranlée »'
  alternative: 'lecture indicative : « les peuples tremblent… la terre est ébranlée »'
  rationale: Les deux valeurs sont possibles dans la poésie hébraïque. La lecture volitive souligne ici la réponse à l’acclamation royale, tandis qu’une note conserve l’indicatif comme possibilité réelle.
- issue: Relation spatiale dans יֹשֵׁב כְּרוּבִים
  choice: au-dessus des chérubins
  alternative: entre les chérubins; sur les chérubins
  rationale: L’expression est un titre royal et cultuel de Yahweh. « Au-dessus » reste naturel en français et évite de réduire l’image à une seule représentation spatiale.
translation_notes:
  register: Français international moderne, digne et poétique. Les deux exclamations rendent le parallélisme et la vigueur de l’acclamation sans archaïsme; « chérubins » conserve le terme biblique usuel.
