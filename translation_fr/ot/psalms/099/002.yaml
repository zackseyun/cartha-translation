id: PSA.99.2
reference: Psalms 99:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְ֭הוָה בְּ/צִיּ֣וֹן גָּד֑וֹל וְ/רָ֥ם ה֝֗וּא עַל כָּל הָֽ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: fr
  text: Yahweh est grand en Sion, et il est exalté au-dessus de tous les peuples.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tous les peuples ».
    reason: La préposition hébraïque עַל peut exprimer aussi bien une position « au-dessus de » qu’une autorité exercée « sur ».
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin, plutôt que par un titre de substitution.
- source_word: בְּצִיּוֹן
  choice: en Sion
  rationale: La préposition בְ a ici un sens locatif; « en Sion » est naturel en français et conserve le lien avec le lieu de la présence et du règne de Yahweh.
- source_word: גָּדוֹל
  choice: grand
  rationale: « Grand » rend directement l’adjectif hébreu sans le limiter à la seule puissance.
- source_word: וְרָם הוּא
  choice: et il est exalté
  rationale: « Exalté » exprime la hauteur et la suprématie dans un registre poétique digne; le pronom explicite הוּא est conservé par « il ».
- source_word: עַל כָּל הָעַמִּים
  choice: au-dessus de tous les peuples
  rationale: עַל marque ici la supériorité, tandis que עַמִּים désigne littéralement les « peuples » plutôt que nécessairement des États-nations.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le nom propre divin; « Yahweh » en préserve la fonction et correspond à sa transcription moderne courante.
- issue: Nature de la suprématie exprimée par עַל
  choice: au-dessus de tous les peuples
  alternative: sur tous les peuples
  rationale: « Au-dessus de » s’accorde avec רָם, « exalté/élevé », et exprime la suprématie sans préciser indûment la manière dont elle s’exerce; « sur » peut aussi rendre la préposition.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme poétique et le vocabulaire de louange sans expliciter davantage la nature de la grandeur ou de la suprématie.
