source:
  edition: WLC
  text: וְ/עֹ֥ז מֶלֶךְ֮ מִשְׁפָּ֪ט אָ֫הֵ֥ב אַ֭תָּה כּוֹנַ֣נְתָּ מֵישָׁרִ֑ים מִשְׁפָּ֥ט וּ֝/צְדָקָ֗ה בְּ/יַעֲקֹ֤ב אַתָּ֬ה עָשִֽׂיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/004.yaml
  text: The strength of the King loves justice[a]; you have established uprightness[b]; you have done justice and righteousness in Jacob.
translation:
  language: fr
  text: La puissance du roi aime la justice[a]. C’est toi qui as établi l’équité[b] ; tu as exercé la justice et la droiture en Jacob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre, de manière plus idiomatique : « Le roi puissant aime la justice. » Le début du verset est très condensé en hébreu et peut être construit de plusieurs façons.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la droiture » ; le terme peut désigner ce qui est droit, juste et équitable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֹז
  choice: La puissance
  rationale: עֹז désigne la force ou la puissance. Le nom est conservé afin de laisser paraître la formulation hébraïque condensée, plutôt que de le transformer sans indication en adjectif qualifiant le roi.
- source_word: מֶלֶךְ
  choice: du roi
  rationale: Le mot désigne le roi et renvoie ici à Dieu dans son règne. La minuscule suit l’usage courant du français moderne sans diminuer cette référence.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte, le terme évoque l’exercice juste du pouvoir et l’ordre conforme au droit, plus largement qu’un jugement particulier.
- source_word: אָהֵב
  choice: aime
  rationale: Le parfait exprime ici une disposition caractéristique et durable ; le présent français rend naturellement cette valeur générale.
- source_word: אַתָּה
  choice: C’est toi qui / tu
  rationale: Le pronom explicite et emphatique est rendu par « C’est toi qui » lors de sa première occurrence, puis par « tu » dans la seconde proposition.
- source_word: כּוֹנַנְתָּ
  choice: as établi
  rationale: Le verbe signifie établir, affermir ou rendre stable ; le passé composé exprime une action accomplie dont le résultat demeure.
- source_word: מֵישָׁרִים
  choice: l’équité
  rationale: Le pluriel abstrait désigne ce qui est droit, juste et sans partialité. « Équité » convient particulièrement au contexte du gouvernement royal, tandis que « droiture » demeure une autre possibilité.
- source_word: וּצְדָקָה
  choice: et la droiture
  rationale: צְדָקָה désigne la conformité à ce qui est juste. « Droiture » maintient une distinction lexicale avec מִשְׁפָּט, déjà traduit par « justice ».
- source_word: בְּיַעֲקֹב
  choice: en Jacob
  rationale: La formulation poétique et le nom d’alliance « Jacob » sont conservés, sans les expliciter par « Israël ».
- source_word: עָשִׂיתָ
  choice: tu as exercé
  rationale: Le sens large de « faire » est exprimé idiomatiquement avec les compléments « justice et droiture » ; « exercer » indique leur mise en œuvre concrète sans ajouter de contenu doctrinal.
theological_decisions:
- issue: Interprétation de l’expression condensée וְעֹז מֶלֶךְ
  choice: La puissance du roi aime la justice
  alternative: Le roi puissant aime la justice
  rationale: La syntaxe hébraïque est difficile et permet plusieurs constructions. Le texte principal conserve le nom « puissance » et la personnification apparente afin de ne pas résoudre silencieusement l’ambiguïté ; la lecture adjectivale, plus idiomatique, est signalée en note.
- issue: Relation entre מִשְׁפָּט et צְדָקָה
  choice: justice et droiture
  alternative: droit et justice
  rationale: Les deux notions se recoupent sans être identiques. Deux termes français distincts préservent la paire hébraïque et son ampleur éthique et judiciaire.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation inhabituelle de la première proposition est volontairement maintenue, avec une lecture plus fluide en note. Le tutoiement convient à l’adresse directe à Dieu dans le psaume.
