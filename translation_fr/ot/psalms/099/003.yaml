  text: יוֹד֣וּ שִׁ֭מְ/ךָ גָּד֥וֹל וְ/נוֹרָ֗א קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/003.yaml
  text: Let them praise your great and fearsome name[c][b][a]; he is holy.
translation:
  language: fr
  text: Qu’ils louent[a] ton nom, grand et redoutable[b] ; il est saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Qu’ils rendent grâce à » ; le verbe hébreu peut exprimer l’action de rendre grâce ou de louer.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui inspire la crainte » ; le terme hébreu évoque une crainte mêlée de profond respect.
    reason: lexical_alternative
  - marker: c
    text: « Il » peut désigner Dieu ou reprendre grammaticalement « ton nom ».
    reason: source_ambiguity
lexical_decisions:
- source_word: יוֹדוּ
  choice: Qu’ils louent
  rationale: Le hiphil inaccompli de ידה peut signifier « rendre grâce », « louer » ou « confesser ». Avec le nom de Dieu pour objet, « louer » exprime naturellement la proclamation publique de sa grandeur ; la tournure « Qu’ils… » rend la valeur jussive probable.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: « Nom » conserve l’image hébraïque, qui peut englober la renommée et le caractère révélé de Dieu sans les expliciter.
- source_word: גָּדוֹל
  choice: grand
  rationale: Équivalent direct qui préserve la simplicité et la force du terme hébreu.
- source_word: וְנוֹרָא
  choice: et redoutable
  rationale: Le mot qualifie ce qui inspire à la fois crainte et profond respect. « Redoutable » garde cette intensité mieux que le français courant « impressionnant ».
- source_word: קָדוֹשׁ
  choice: saint
  rationale: « Saint » conserve la portée théologique et liturgique du refrain du psaume.
- source_word: הוּא
  choice: il
  rationale: Le pronom masculin hébreu est rendu directement par « il ». En français comme en hébreu, il peut grammaticalement reprendre « nom », tout en pouvant contextuellement désigner Dieu.
theological_decisions:
- issue: Référent du pronom הוּא dans la proposition finale
  choice: Conserver « il est saint » sans préciser le référent
  alternative: Expliciter soit « Dieu est saint », soit « son nom est saint »
  rationale: Le contexte du psaume oriente vers la sainteté de Dieu, mais « nom » est masculin en hébreu comme en français et peut servir d’antécédent grammatical. La formulation retenue préserve cette ambiguïté réelle et la concision liturgique de l’original.
translation_notes:
  register: Français moderne, sobre et liturgique. « Redoutable » conserve la force du terme hébreu sans recourir au familier « génial » ni affaiblir la dimension de crainte révérencielle. Le point-virgule respecte la juxtaposition concise des deux propositions sans ajouter de lien causal absent de l’hébreu.
