source:
  edition: WLC
  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְֽ֭/הִשְׁתַּחֲווּ לַ/הֲדֹ֥ם רַגְלָ֗י/ו קָד֥וֹשׁ הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: fr
  text: Exaltez le SEIGNEUR, notre Dieu, et prosternez-vous devant son marchepied[a][b] ; il est saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son marchepied ». La préposition hébraïque peut être rendue de différentes façons dans ce contexte de prosternation.
    reason: lexical_alternative
  - marker: b
    text: Le « marchepied » peut évoquer le lieu terrestre de l’intronisation de Dieu, par exemple l’arche ou le sanctuaire, mais le texte ne précise pas ici à quoi l’image renvoie.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Exaltez
  rationale: L’impératif pluriel de רום appelle à reconnaître et proclamer la grandeur de Dieu. « Exaltez » conserve cette image et convient au registre poétique et cultuel du psaume.
- source_word: יְהוָ֤ה
  choice: le SEIGNEUR
  rationale: Cette forme rend le nom divin par la convention révérencielle française courante, tout en le distinguant typographiquement du titre ordinaire « Seigneur ».
- source_word: אֱלֹהֵ֗ינוּ
  choice: notre Dieu
  rationale: Le suffixe de première personne du pluriel est rendu directement et conserve la dimension communautaire de la confession.
- source_word: וְהִשְׁתַּחֲווּ
  choice: et prosternez-vous
  rationale: Le verbe שׁחה désigne le fait de s’incliner profondément ou de se prosterner, notamment dans l’adoration. Cette traduction préserve le geste concret sans le réduire au sens plus général d’« adorer ».
- source_word: לַהֲדֹ֥ם רַגְלָ֗יו
  choice: devant son marchepied
  rationale: הֲדֹם רַגְלָיו signifie littéralement « le marchepied de ses pieds », expression que le français formule naturellement par « son marchepied ». Dans ce contexte cultuel, « devant » exprime bien l’orientation de la prosternation, tandis qu’une note conserve l’amplitude possible de la préposition ל.
- source_word: קָד֥וֹשׁ הֽוּא
  choice: il est saint
  rationale: La proposition nominale hébraïque est rendue dans un ordre naturel en français, sans ajouter de lien causal absent du texte.
theological_decisions:
- issue: Référent du « marchepied » de Dieu
  choice: Conserver l’image non explicitée de « son marchepied ».
  alternative: Identifier le marchepied à l’arche, au sanctuaire, à Sion ou à la terre.
  rationale: Le verset évoque le lieu terrestre associé au règne et à la présence de Dieu sans en préciser ici le référent. Le maintien de la métaphore évite d’imposer une identification particulière.
- issue: Objet ou lieu de la prosternation
  choice: « devant son marchepied »
  alternative: « vers son marchepied » ou « auprès de son marchepied »
  rationale: La construction avec ל peut indiquer l’orientation ou le lieu dans ce contexte d’adoration. « Devant » évite de laisser entendre que le marchepied lui-même serait adoré, tout en conservant l’ambiguïté lexicale dans une note.
translation_notes:
  register: Français international moderne, clair et digne. Le vocabulaire cultuel (« exaltez », « prosternez-vous ») demeure accessible tout en préservant le geste et l’image poétique de l’hébreu. La ponctuation maintient côte à côte l’appel à l’adoration et l’affirmation de la sainteté divine sans ajouter explicitement une relation causale.
