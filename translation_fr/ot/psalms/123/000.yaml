  yaml_path: translation/ot/psalms/123/000.yaml
  text: 'A Song of Ascents[a].

    To you I have lifted up my eyes[b],

    you who sit in the heavens.'
translation:
  language: fr
  text: 'Chant des montées[a].


    J’ai levé les yeux vers toi,

    toi qui sièges dans les cieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chant des ascensions ». Le sens précis de ce titre hébreu est discuté; il peut évoquer les montées des pèlerins vers Jérusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend le titre hébreu de façon concise et conserve l’image des montées, traditionnellement associée aux pèlerinages vers Jérusalem sans l’imposer explicitement.
- source_word: נָשָׂאתִי אֶת־עֵינַי
  choice: J’ai levé les yeux
  rationale: Reproduit naturellement en français l’expression hébraïque et la valeur accomplie de la forme verbale.
- source_word: הַיֹּשְׁבִי
  choice: toi qui sièges
  rationale: « Siéger » conserve le sens de demeurer assis tout en laissant percevoir la possible nuance royale du verbe dans ce contexte.
- source_word: בַּשָּׁמָיִם
  choice: dans les cieux
  rationale: Conserve le pluriel morphologique hébreu et la formulation spatiale du texte source.
theological_decisions:
- issue: Nuance royale de הַיֹּשְׁבִי
  choice: sièges
  alternative: habites / es assis
  rationale: « Sièges » permet d’entendre une autorité souveraine sans ajouter explicitement l’idée de trône, absente du texte hébreu.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme est préservé, ainsi que le pluriel « les cieux ». Le titre reste volontairement ouvert quant à sa fonction exacte.
