  text: רַבַּת֮ שָֽׂבְעָה לָּ֪/הּ נַ֫פְשֵׁ֥/נוּ הַ/לַּ֥עַג הַ/שַּׁאֲנַנִּ֑ים הַ֝/בּ֗וּז לִ/גְאֵ֥יוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/004.yaml
  text: Our soul has had more than enough of the mockery of those at ease[b][a], the contempt of the proud.
translation:
  language: fr
  text: Notre âme en a plus qu’assez des moqueries de ceux qui sont tranquilles[a], du mépris des orgueilleux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens à l’aise », « des gens en sécurité » ou « des complaisants ».
    reason: lexical_alternative
  - marker: b
    text: Le dernier membre peut aussi se comprendre comme le mépris venant des arrogants.
    reason: source_ambiguity
lexical_decisions:
- source_word: רַבַּת שָׂבְעָה לָּהּ
  choice: en a plus qu’assez
  rationale: L’expression associe l’idée d’être rassasié à un intensif marquant l’excès. « En a plus qu’assez » rend naturellement en français le fait d’avoir été rempli au-delà du supportable, sans suggérer une satisfaction positive.
- source_word: נַפְשֵׁנוּ
  choice: Notre âme
  rationale: Le singulier collectif hébreu désigne ici la personne dans sa profondeur. « Notre âme » conserve l’image poétique et la forme du texte source.
- source_word: הַלַּעַג
  choice: les moqueries
  rationale: Le terme désigne la dérision exprimée contre quelqu’un, notamment par des paroles. Le pluriel français est idiomatique dans cette construction.
- source_word: הַשַּׁאֲנַנִּים
  choice: ceux qui vivent dans l’insouciance
  rationale: Le mot décrit des personnes tranquilles, à l’abri et sans inquiétude, avec une possible nuance de suffisance. Cette formulation moderne garde l’idée d’une aisance devenue insensible.
- source_word: הַבּוּז
  choice: le mépris
  rationale: Le nom exprime le dédain et forme un parallélisme net avec les moqueries.
- source_word: לִגְאֵיוֹנִים
  choice: des orgueilleux
  rationale: Le terme désigne des personnes hautaines ou arrogantes. « Orgueilleux » est concis, dignifié et courant.
theological_decisions: []
translation_notes:
  register: Français international actuel, poétique mais immédiatement compréhensible. L’idiome « en a plus qu’assez » exprime avec force le rassasiement pénible et excessif du texte hébreu. Les deux compléments parallèles restent distincts, et les notes signalent les nuances lexicales et syntaxiques sans les trancher abusivement.
