id: PSA.123.1
reference: Psalms 123:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת אֵ֭לֶי/ךָ נָשָׂ֣אתִי אֶת עֵינַ֑/י הַ֝/יֹּשְׁבִ֗י בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/001.yaml
  text: A Song of Ascents[a]. To you I lift up my eyes[b], O you who are enthroned in the heavens.
translation:
  language: fr
  text: 'Chant des montées[a].

    Vers toi je lève les yeux,

    toi qui sièges dans les cieux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chant des degrés ». Le titre hébreu évoque des montées, sans préciser s’il s’agit de pèlerinages, de marches ou d’un usage liturgique ou musical.
    reason: lexical_alternative
  - marker: b
    text: Ou « toi qui habites dans les cieux ». Le verbe hébreu signifie littéralement « être assis » ou « demeurer » et peut ici évoquer l’exercice de la royauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Chant
  rationale: « Chant » traduit directement le nom hébreu et convient au titre poétique de ce groupe de psaumes, sans le confondre avec le terme technique « psaume ».
- source_word: הַמַּעֲלוֹת
  choice: des montées
  rationale: Cette expression conserve l’image hébraïque d’un mouvement ascendant sans trancher entre une montée en pèlerinage, des degrés liturgiques ou une autre interprétation du titre.
- source_word: אֵלֶיךָ
  choice: Vers toi
  rationale: « Vers » rend naturellement l’orientation exprimée par la préposition אֶל et s’accorde avec le mouvement du regard.
- source_word: נָשָׂאתִי
  choice: je lève
  rationale: Bien que la forme hébraïque soit un accompli, le présent français exprime naturellement l’acte de prière en cours et restitue l’usage idiomatique de « lever les yeux ».
- source_word: אֶת עֵינַי
  choice: les yeux
  rationale: Le français emploie normalement l’article défini avec les parties du corps lorsque le possesseur est clair; la première personne portée par « je » correspond donc à l’hébreu « mes yeux ».
- source_word: הַיֹּשְׁבִי
  choice: qui sièges
  rationale: Le verbe hébreu peut signifier « être assis », « demeurer » ou, dans un contexte royal, « siéger ». « Sièges » garde la métaphore sans ajouter explicitement un trône.
- source_word: בַּשָּׁמָיִם
  choice: dans les cieux
  rationale: Le pluriel « les cieux » suit la forme hébraïque et conserve le registre élevé du psaume.
theological_decisions:
- issue: La portée royale de הַיֹּשְׁבִי appliqué à Dieu
  choice: toi qui sièges dans les cieux
  alternative: toi qui habites dans les cieux; toi qui es assis dans les cieux; toi qui trônes dans les cieux
  rationale: « Sièges » peut évoquer l’autorité souveraine tout en restant proche du sens concret du verbe. Il évite d’introduire explicitement un « trône », absent du texte, et préserve ainsi l’ambiguïté entre résidence, posture et royauté.
translation_notes:
  register: Français international moderne, poétique et digne. La disposition en trois lignes distingue le titre du parallélisme de la prière. Le tutoiement respecte l’adresse directe au singulier; « sièges » maintient une légère élévation de registre sans archaïsme.
