source:
  edition: WLC
  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: fr
  text: 'Voici, comme les yeux des serviteurs[a] sont tournés vers la main de leurs maîtres,

    comme les yeux d’une servante vers la main de sa maîtresse,

    ainsi nos yeux sont tournés vers Yahweh, notre Dieu,

    jusqu’à ce qu’il nous fasse grâce.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves » ; l’image est celle de personnes dépendantes qui observent la main de leur supérieur, dans l’attente d’un signal, d’une action ou de ce qu’il leur accordera.
    reason: lexical_alternative
  - marker: b
    text: Ou « jusqu’à ce qu’il nous accorde sa faveur » ou « jusqu’à ce qu’il ait pitié de nous ».
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Cette particule attire l’attention et introduit la comparaison. « Voici » conserve cette force dans un registre poétique digne, sans être obscur.
- source_word: כְעֵינֵי
  choice: comme les yeux de
  rationale: Le préfixe כְּ marque la comparaison; cette tournure préserve clairement le parallélisme du verset.
- source_word: עֲבָדִים
  choice: serviteurs
  rationale: Le terme peut désigner des serviteurs ou des esclaves. Ici, « serviteurs » exprime naturellement la dépendance attentive mise en scène, tandis que l’autre nuance est signalée en note.
- source_word: יַד
  choice: main
  rationale: Le mot est conservé littéralement; la main peut évoquer à la fois un signal, une action et ce qui est accordé par le supérieur.
- source_word: אֲדֹנֵיהֶם
  choice: leurs maîtres
  rationale: Le pluriel avec suffixe masculin pluriel renvoie aux maîtres des serviteurs dans un cadre domestique.
- source_word: שִׁפְחָה
  choice: une servante
  rationale: Le nom désigne spécifiquement une servante ou une esclave; « servante » conserve ici la distinction de genre et convient au parallèle.
- source_word: גְּבִרְתָּהּ
  choice: sa maîtresse
  rationale: Le terme désigne la femme qui exerce l’autorité sur la servante; « maîtresse » est l’équivalent direct dans ce contexte.
- source_word: כֵּן
  choice: ainsi
  rationale: Le mot introduit le second terme de la comparaison et maintient le registre poétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Cette traduction directe conserve le suffixe de première personne du pluriel et la relation exprimée dans le texte.
- source_word: עַד שֶׁיְּחָנֵּנוּ
  choice: jusqu’à ce qu’il nous fasse grâce
  rationale: Le verbe חנן exprime l’action d’accorder faveur ou grâce. Cette formulation est précise, naturelle et conserve l’idée d’une intervention gracieuse attendue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » le rend comme le nom divin sans le remplacer par un titre.
- issue: Nuance de חנן dans la demande finale
  choice: qu’il nous fasse grâce
  alternative: qu’il nous accorde sa faveur; qu’il ait pitié de nous
  rationale: Le verbe met fondamentalement l’accent sur la faveur gracieusement accordée. Les nuances de faveur et de pitié demeurent possibles et sont conservées en note plutôt que réduites à une seule interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé, avec ellipse du verbe au deuxième membre pour une cadence naturelle. « Sont tournés vers » explicite sobrement l’orientation attentive exprimée par la construction hébraïque « les yeux vers ».
