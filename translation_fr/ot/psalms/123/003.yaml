source:
  edition: WLC
  text: חָנֵּ֣/נוּ יְהוָ֣ה חָנֵּ֑/נוּ כִּֽי רַ֝֗ב שָׂבַ֥עְנוּ בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: fr
  text: Fais-nous grâce[a], Yahweh, fais-nous grâce, car nous sommes rassasiés à l’excès de mépris[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aie pitié de nous ». Le verbe hébreu peut exprimer la faveur, la grâce ou la compassion.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car nous sommes grandement rassasiés de mépris ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: Fais-nous grâce
  rationale: L’impératif de חנן avec suffixe de première personne du pluriel demande à Dieu d’accorder sa faveur. « Fais-nous grâce » conserve le champ sémantique de la grâce et de la faveur, tout en restant naturel dans une prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la supplication ; « car » convient au registre poétique et soutenu du psaume.
- source_word: רַב
  choice: rassasiés
  rationale: Associé à שָׂבַעְנוּ, רַב intensifie l’idée de satiété. En français, le verbe « rassasier » exprime déjà fortement l’idée d’en avoir subi à satiété ; une note explicite l’intensification hébraïque.
- source_word: שָׂבַעְנוּ
  choice: nous sommes rassasiés
  rationale: Le parfait signifie littéralement que les locuteurs ont été remplis ou rassasiés. Cette image vive et compréhensible est conservée en français.
- source_word: בּוּז
  choice: mépris
  rationale: Le nom désigne le mépris ou le dédain subi. « Mépris » rend précisément l’abstraction et s’accorde naturellement avec l’image d’en être rassasié.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin. La translittération « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Nuance de חנן
  choice: Fais-nous grâce
  alternative: Aie pitié de nous
  rationale: Le verbe peut exprimer la faveur, la grâce ou la compassion. Le choix principal conserve la notion centrale de faveur gracieusement accordée sans réduire la demande à la seule pitié.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition de la supplication et l’image hébraïque de la satiété sont conservées. Le vocatif français ne requiert pas d’interjection équivalente à l’anglais « O ».
