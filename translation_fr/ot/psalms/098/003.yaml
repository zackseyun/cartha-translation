id: PSA.98.3
reference: Psalms 98:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זָ֘כַ֤ר חַסְדּ֨/וֹ וֶֽ/אֱֽמוּנָת/וֹ֮ לְ/בֵ֪ית יִשְׂרָ֫אֵ֥ל רָא֥וּ כָל אַפְסֵי אָ֑רֶץ אֵ֝֗ת יְשׁוּעַ֥ת אֱלֹהֵֽי/נוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: fr
  text: Il s’est souvenu de son amour fidèle et de sa fidélité envers la maison d’Israël ; toutes les extrémités de la terre ont vu le salut[a] de notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la délivrance » ; dans le contexte du psaume, le terme hébreu peut aussi évoquer une action salvatrice victorieuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַר
  choice: il s’est souvenu
  rationale: Le qal accompli exprime ici un acte réalisé dont le psaume célèbre les effets présents. « S’est souvenu » conserve le sens simple du verbe sans suggérer une simple activité mentale.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne ici l’amour loyal et durable de Dieu dans sa relation avec Israël. « Amour fidèle » est naturel en français moderne et garde cette nuance relationnelle.
- source_word: וֶאֱמוּנָתוֹ
  choice: et de sa fidélité
  rationale: En parallèle avec חֶסֶד, אֱמוּנָה exprime la fiabilité et la constance de Dieu. « Fidélité » restitue directement cette portée.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: envers la maison d’Israël
  rationale: La préposition לְ marque ici la relation ou l’orientation de l’amour et de la fidélité de Dieu. « Envers » est idiomatique et évite l’ambiguïté que pourrait produire « à » en français.
- source_word: רָאוּ
  choice: ont vu
  rationale: Le qal accompli décrit le fait désormais constaté par le monde entier. Le passé composé convient au contexte hymnique et à sa pertinence présente.
- source_word: כָל אַפְסֵי אָרֶץ
  choice: toutes les extrémités de la terre
  rationale: Cette expression hébraïque désigne les régions les plus lointaines, et par extension le monde entier. La formulation retenue conserve l’image poétique.
- source_word: אֵת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule grammaticale n’a pas d’équivalent lexical direct en français ; sa fonction est rendue par la syntaxe.
- source_word: יְשׁוּעַת
  choice: le salut
  rationale: יְשׁוּעָה peut désigner le salut, la délivrance ou une victoire salvatrice. « Salut » en préserve ici l’étendue sémantique, tandis qu’une note signale l’autre possibilité.
- source_word: אֱלֹהֵינוּ
  choice: de notre Dieu
  rationale: 'Le groupe construit signifie littéralement « le salut de notre Dieu » et laisse ouverte la relation précise : salut qui lui appartient, qu’il manifeste ou qu’il accomplit.'
theological_decisions:
- issue: Nuance relationnelle de חֶסֶד et אֱמוּנָה
  choice: « amour fidèle » et « fidélité »
  alternative: « bonté » et « vérité »
  rationale: Le couple hébreu met en relief l’amour loyal et la fiabilité de Dieu envers Israël. La traduction retenue garde cette texture sans employer un vocabulaire archaïque ni imposer une terminologie confessionnelle.
- issue: Portée de יְשׁוּעַת אֱלֹהֵינוּ
  choice: « le salut de notre Dieu »
  alternative: « la délivrance de notre Dieu » ou « la victoire de notre Dieu »
  rationale: Le nom hébreu autorise une idée large de salut ou de délivrance, avec de possibles accents victorieux dans ce psaume. « Salut » ne réduit pas le sens à une victoire militaire et la note préserve l’alternative.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé, ainsi que l’image poétique des « extrémités de la terre ». Le point-virgule marque les deux mouvements du verset.
