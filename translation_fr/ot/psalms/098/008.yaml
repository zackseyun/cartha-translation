source:
  edition: WLC
  text: נְהָר֥וֹת יִמְחֲאוּ כָ֑ף יַ֝֗חַד הָרִ֥ים יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/008.yaml
  text: Let the rivers clap their hands[a]; let the mountains sing for joy together,
translation:
  language: fr
  text: Que les fleuves battent des mains ! Que les montagnes, toutes ensemble, poussent des cris de joie[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chantent de joie ». Le verbe hébreu peut désigner aussi bien une acclamation jubilante qu’un chant joyeux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהָרוֹת
  choice: les fleuves
  rationale: Le nom pluriel désigne des cours d’eau importants; « fleuves » conserve directement l’ampleur de l’image cosmique.
- source_word: יִמְחֲאוּ כָף
  choice: battent des mains
  rationale: L’expression hébraïque évoque le fait de frapper la paume; l’idiome français naturel « battre des mains » préserve la personnification.
- source_word: יַחַד
  choice: toutes ensemble
  rationale: L’adverbe signifie « ensemble »; l’ajout de « toutes » s’accorde naturellement avec le pluriel féminin « montagnes » et souligne leur action unanime.
- source_word: הָרִים
  choice: les montagnes
  rationale: Traduction directe qui conserve la grandeur du paysage évoqué.
- source_word: יְרַנֵּנוּ
  choice: poussent des cris de joie
  rationale: Le verbe peut désigner une acclamation joyeuse retentissante aussi bien qu’un chant jubilant; cette formulation française garde sa vigueur sans réduire le sens au seul chant.
theological_decisions:
- issue: Personnification poétique de la création dans la louange
  choice: Conserver directement les fleuves qui battent des mains et les montagnes qui exultent
  alternative: Interpréter l’image comme une simple évocation indirecte de la louange humaine
  rationale: L’hébreu présente explicitement les éléments de la création comme participants à la joie; la traduction maintient cette image sans lui imposer une explication doctrinale.
- issue: Nature de l’expression joyeuse des montagnes
  choice: « poussent des cris de joie » dans le texte, avec l’alternative du chant en note
  alternative: « chantent de joie »
  rationale: Le verbe hébreu couvre l’acclamation jubilante et le chant joyeux. Le texte retient une expression vive et large, tandis que la note préserve l’autre possibilité authentique.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux impératifs exhortatifs rendent la valeur contextuelle des formes verbales; la ponctuation exclamative soutient l’élan de la louange cosmique.
