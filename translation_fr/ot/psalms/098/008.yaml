  source_fidelity: 'Le texte rend fidèlement le parallélisme poétique hébreu : les נְהָרוֹת (« fleuves/rivières ») battent des mains, et les הָרִים (« montagnes ») expriment ensemble une joie jubilante. « Que » restitue de façon naturelle en français la valeur volitive/exhortative possible des imparfaits dans ce contexte hymnique. « Battent des mains » traduit idiomatiquement מחא כף sans explicitation indue. « Poussent des cris de joie » est un rendu recevable de רנן au piel, qui peut évoquer une acclamation retentissante aussi bien qu’un chant joyeux.'
