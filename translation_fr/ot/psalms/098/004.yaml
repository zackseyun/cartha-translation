  text: הָרִ֣יעוּ לַֽ֭/יהוָה כָּל הָ/אָ֑רֶץ פִּצְח֖וּ וְ/רַנְּנ֣וּ וְ/זַמֵּֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/004.yaml
  text: Shout joyfully to Yahweh[a], all the earth[b]; break forth and sing for joy and make music.
translation:
  language: fr
  text: Acclamez Yahweh, toute la terre ! Éclatez en chants, poussez des cris de joie et faites de la musique !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Poussez des cris de joie
  rationale: L’impératif hiphil de רוע appelle ici à une acclamation jubilante. Cette formulation française est naturelle et conserve à la fois la force de l’ordre et la joie exprimée.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique ici le destinataire de l’acclamation. « Pour Yahweh » est idiomatique en français dans cet appel à la louange.
- source_word: כָּל הָאָרֶץ
  choice: terre entière
  rationale: Dans le cadre universel du psaume, אֶרֶץ désigne toute la terre plutôt qu’un pays particulier. L’apostrophe sans article est poétique et naturelle en français.
- source_word: פִּצְחוּ
  choice: Éclatez
  rationale: Le verbe פצח évoque le fait d’éclater ou de se répandre soudainement en expression vocale; « éclatez en chants » conserve cette image vive.
- source_word: וְרַנְּנוּ
  choice: en chants de joie
  rationale: Le piel de רנן exprime des cris ou des chants jubilants. Associé à « éclatez », « en chants de joie » rend naturellement l’expression en français.
- source_word: וְזַמֵּרוּ
  choice: jouez de la musique
  rationale: זמר, dans un contexte de louange, peut désigner la musique chantée ou instrumentale. Cette traduction maintient une distinction avec les chants déjà mentionnés.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique énergique. Les impératifs et le parallélisme de l’hébreu sont conservés sans tournure archaïque.
