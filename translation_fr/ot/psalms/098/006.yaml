  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: fr
  text: Au son des trompettes et du cor[a], poussez des acclamations devant le Roi, Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la corne de bélier ». Le mot hébreu שׁוֹפָר désigne souvent précisément une corne de bélier utilisée comme instrument, distincte des trompettes mentionnées juste avant.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: Au son des trompettes
  rationale: חֲצֹצְרוֹת désigne des trompettes, vraisemblablement des instruments métalliques droits, distincts du שׁוֹפָר. La préposition בְּ a ici une valeur instrumentale. Le mot « argent » n’est pas ajouté, puisqu’il ne figure pas dans ce verset.
- source_word: וְקוֹל שׁוֹפָר
  choice: et du cor
  rationale: קוֹל désigne le son, tandis que שׁוֹפָר désigne un instrument en corne, souvent une corne de bélier. « Cor » maintient en français la distinction lexicale avec les trompettes déjà mentionnées; la précision possible « corne de bélier » est donnée en note.
- source_word: הָרִיעוּ
  choice: poussez des acclamations
  rationale: L’impératif hiphil pluriel de רוע appelle une clameur forte, festive ou triomphale. « Poussez des acclamations » exprime naturellement cette action en français sans ajouter explicitement la joie, bien que le contexte soit jubilatoire.
- source_word: לִפְנֵי
  choice: devant
  rationale: לִפְנֵי signifie ici « devant » ou « en présence de ». « Devant » est direct, concis et idiomatique.
- source_word: הַמֶּלֶךְ
  choice: le Roi
  rationale: Le nom défini signifie « le roi ». La majuscule signale son emploi comme titre divin, le référent étant immédiatement identifié comme Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », transcription usuelle du nom divin, plutôt que par la substitution traditionnelle « le Seigneur ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom personnel au lieu de lui substituer un titre.
- issue: Rapport entre « le Roi » et « Yahweh »
  choice: 'apposition : « le Roi, Yahweh »'
  alternative: « devant Yahweh, le Roi »
  rationale: L’ordre hébreu הַמֶּלֶךְ יְהוָה présente naturellement « Yahweh » en apposition à « le Roi ». La traduction conserve cet ordre et cette identification sans les réorganiser.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme sonore du verset, distingue les deux instruments et conserve l’apposition finale emphatique.
