  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: fr
  text: Psaume. Chantez à Yahweh un chant nouveau, car il a fait des merveilles ; sa main droite et son bras saint lui ont apporté le salut[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ont sauvé » ou « lui ont remporté la victoire ». L’expression hébraïque peut se rendre plus littéralement, mais elle exprime ici que la puissance même de Yahweh a accompli le salut ou remporté la victoire pour lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Rend directement le titre hébreu désignant un chant accompagné de musique.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Expression française naturelle qui conserve l’idée d’un chant neuf ou renouvelé.
- source_word: נִפְלָאוֹת
  choice: des merveilles
  rationale: Terme biblique courant et compréhensible pour des actes extraordinaires accomplis par Dieu.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: lui ont assuré le salut
  rationale: Conserve le vocabulaire du salut et le complément « pour lui », tout en produisant une formulation française intelligible; la note maintient les autres nuances possibles, notamment celle de victoire.
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: son bras saint
  rationale: Reproduit l’image anthropomorphique et la qualification de sainteté sans lourdeur excessive.
theological_decisions:
- issue: Le sujet divin est présenté comme recevant le salut ou la victoire obtenu par sa propre puissance.
  choice: lui ont assuré le salut
  alternative: l’ont sauvé ; lui ont remporté la victoire
  rationale: La formulation garde la tension du texte hébreu au lieu de la remplacer silencieusement par une paraphrase où Dieu sauverait seulement d’autres personnes. La note indique la portée victorieuse possible de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. Le nom divin « Yahweh » suit explicitement יהוה. Le parallélisme imagé de la main droite et du bras saint est conservé.
