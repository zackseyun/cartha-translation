  text: הוֹדִ֣יעַ יְ֭הוָה יְשׁוּעָת֑/וֹ לְ/עֵינֵ֥י הַ֝/גּוֹיִ֗ם גִּלָּ֥ה צִדְקָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/002.yaml
  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: fr
  text: Yahweh a fait connaître son salut ; sous les yeux des nations[a], il a révélé sa justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la vue des nations ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הוֹדִיעַ
  choice: a fait connaître
  rationale: Rend naturellement en français la valeur causative du hiphil de ידע.
- source_word: יְשׁוּעָתוֹ
  choice: son salut
  rationale: Conserve la portée large de יְשׁוּעָה, qui peut désigner le salut, la délivrance ou la victoire.
- source_word: לְעֵינֵי
  choice: sous les yeux de
  rationale: Préserve l’image concrète de l’expression hébraïque tout en restant idiomatique en français moderne.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Désigne largement les peuples non israélites sans introduire la coloration néotestamentaire que pourrait avoir « les païens ».
- source_word: גִּלָּה
  choice: a révélé
  rationale: Rend le piel de גלה et maintient le parallélisme avec « a fait connaître ».
- source_word: צִדְקָתוֹ
  choice: sa justice
  rationale: Dans ce contexte de salut manifesté publiquement, « justice » exprime la rectitude agissante de Yahweh sans exclure les nuances de fidélité et de juste intervention.
theological_decisions:
- issue: Sens de la justice divine dans un contexte de salut
  choice: sa justice
  alternative: sa fidélité à ce qui est juste ; sa juste intervention
  rationale: Le terme צְדָקָה associe ici le salut de Yahweh à la manifestation publique de sa rectitude. « Justice » conserve cette tension sans réduire le sens à la seule justice punitive.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est conservé, ainsi que l’image visuelle de לְעֵינֵי. Les marqueurs suivent les expressions auxquelles les notes se rapportent.
