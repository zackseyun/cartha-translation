  text: יִרְעַ֣ם הַ֭/יָּם וּ/מְלֹא֑/וֹ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/007.yaml
  text: Let the sea roar[a], and all that fills it[b], the world and those who dwell in it.
translation:
  language: fr
  text: Que la mer retentisse, avec tout ce qui la remplit, le monde et ceux qui l’habitent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעַם
  choice: Que … retentisse
  rationale: L’imparfait de רעם peut exprimer ici une invitation poétique à la louange. « Retentisse » rend le bruit puissant évoqué par le verbe tout en convenant naturellement à la mer.
- source_word: הַיָּם
  choice: la mer
  rationale: Équivalent français courant de יָם, naturel dans ce contexte poétique.
- source_word: וּמְלֹאוֹ
  choice: avec tout ce qui la remplit
  rationale: Littéralement « et sa plénitude » ; la formulation choisie exprime naturellement en français tout ce que contient la mer, sans confondre cet ensemble avec le sujet grammatical singulier du verbe.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne couramment le monde, notamment comme terre habitée. La mention de ceux qui l’habitent explicite cette nuance.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: et ceux qui l’habitent
  rationale: Cette formulation conserve la valeur verbale du participe hébreu et demeure claire et digne en français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et accessible. La tournure jussive « Que… » maintient l’appel cosmique à la louange. « Retentisse » est préféré à « rugisse », plus animal, et à « gronde », susceptible de suggérer la menace.
