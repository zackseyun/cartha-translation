base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/005.yaml
  text: Sing praises to Yahweh with the lyre[b][a], with the lyre and the sound of song.
translation:
  language: fr
  text: Chantez les louanges de Yahweh avec la lyre[a], avec la lyre et le son d’un chant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu kinnor, ancien instrument à cordes, traditionnellement traduit par « harpe ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et la voix d’une mélodie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Chantez les louanges
  rationale: L’impératif pluriel au piel de זמר appelle à célébrer Dieu en musique. Cette formulation exprime à la fois le chant et sa fonction de louange.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: Dans l’expression française « chanter les louanges de », le complément introduit par ל est rendu naturellement par « de ». Le nom divin est translittéré « Yahweh ».
- source_word: בְּכִנּוֹר
  choice: avec la lyre
  rationale: כִּנּוֹר désigne un ancien instrument à cordes, généralement identifié comme une lyre. La préposition ב a ici une valeur instrumentale.
- source_word: בְּכִנּוֹר
  choice: avec la lyre
  rationale: La répétition du texte hébreu est conservée afin de respecter le parallélisme et l’insistance poétiques.
- source_word: וְקוֹל זִמְרָה
  choice: et le son d’un chant
  rationale: קוֹל peut signifier « voix » ou « son », tandis que זִמְרָה désigne un chant, une mélodie ou de la musique. La traduction conserve l’image auditive et le rapport entre les deux noms.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre tout en évitant de le remplacer par un titre.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « avec la lyre » et la formulation concrète « le son d’un chant » conservent la structure poétique et l’image auditive de l’hébreu.
