id: PSA.98.9
reference: Psalms 98:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: fr
  text: devant Yahweh[a], car il vient[b] juger la terre ; il jugera le monde[c] avec justice, et les peuples avec équité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en présence de Yahweh ». L’hébreu porte le nom divin YHWH.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il va venir ». La forme hébraïque peut présenter, en poésie, une action imminente ou certaine.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le monde habité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: devant
  rationale: Cette locution signifie « devant » ou « en présence de ». « Devant » est naturel et conserve sa dimension relationnelle et spatiale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: כִּי בָא
  choice: car il vient
  rationale: כִּי introduit la raison de la joie exprimée dans le contexte. Dans ce cadre poétique, la forme בָא présente la venue comme imminente ou certaine ; le présent français en garde la vivacité sans la réduire à un passé.
- source_word: לִשְׁפֹּט הָאָרֶץ
  choice: juger la terre
  rationale: שׁפט peut inclure l’exercice du gouvernement, mais « juger » rend directement l’action judiciaire. Le parallélisme avec le monde et les peuples donne à הָאָרֶץ une portée universelle.
- source_word: יִשְׁפֹּט תֵּבֵל
  choice: il jugera le monde
  rationale: Le futur exprime l’action attendue liée à sa venue. תֵּבֵל désigne spécialement le monde habité, mais « le monde » est ici idiomatique et suffisamment précis.
- source_word: בְּצֶדֶק
  choice: avec justice
  rationale: La préposition indique la manière dont le jugement s’exerce. Dans ce contexte judiciaire, « avec justice » exprime clairement la rectitude morale de ce jugement.
- source_word: וְעַמִּים בְּמֵישָׁרִים
  choice: et les peuples avec équité
  rationale: « Les peuples » préserve le pluriel et la diversité des groupes humains. מֵישָׁרִים évoque la droiture et l’impartialité ; « avec équité » convient naturellement au contexte judiciaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin YHWH. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
- issue: Portée du jugement divin exprimé par שׁפט
  choice: juger
  alternative: gouverner ; rendre justice
  rationale: « Juger » maintient ensemble l’idée de responsabilité, de justice et de juste mise en ordre, sans ramener l’action à la seule condamnation ni à la seule administration.
- issue: Valeur temporelle de בָא
  choice: il vient
  alternative: il est venu ; il va venir
  rationale: La forme accomplie peut, dans la poésie, présenter une action imminente ou certaine comme déjà établie. Le présent français préserve cette tension et la force vive de l’annonce.
translation_notes:
  register: Français moderne, international et digne. La formulation reste poétique et concise ; « justice » et « équité » conservent le parallélisme judiciaire sans employer un vocabulaire confessionnel spécialisé.
