source:
  edition: WLC
  text: מִזְמ֡וֹר שִׁ֤ירוּ לַֽ/יהוָ֨ה שִׁ֣יר חָ֭דָשׁ כִּֽי נִפְלָא֣וֹת עָשָׂ֑ה הוֹשִֽׁיעָה לּ֥/וֹ יְ֝מִינ֗/וֹ וּ/זְר֥וֹעַ קָדְשֽׁ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/001.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: fr
  text: Psaume. Chantez à Yahweh un chant nouveau, car il a fait des merveilles ; sa main droite et son bras saint lui ont assuré la victoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi rendre : « l’ont sauvé » ou « ont accompli le salut pour lui ». Le pronom hébreu peut exprimer « pour lui » ou « en sa faveur » ; l’expression affirme que la puissance propre de Yahweh a accompli sa délivrance ou sa victoire.'
    reason: Alternative lexicale et précision sur l’ambiguïté du datif dans l’idiome hébreu הוֹשִׁיעָה לּוֹ.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme de suscription désignant un psaume accompagné de musique ; « Psaume » est l’équivalent français usuel et clair.
- source_word: שִׁירוּ
  choice: Chantez
  rationale: Impératif pluriel direct du verbe « chanter », sans ajout interprétatif tel que « louez ».
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique ici le destinataire du chant. « Pour Yahweh » est idiomatique en français et conserve le nom divin.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Rend naturellement l’expression poétique hébraïque tout en conservant son ordre et son sens.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: il a fait des merveilles
  rationale: Expression française courante et digne qui traduit les actes extraordinaires suscitant l’émerveillement.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: lui ont assuré la victoire
  rationale: Dans ce contexte poétique, le verbe exprime que la puissance propre de Yahweh a produit pour lui délivrance ou victoire. Cette formulation est naturelle en français sans effacer les autres lectures possibles, signalées en note.
- source_word: יְמִינוֹ
  choice: sa main droite
  rationale: Conserve l’image anthropomorphique hébraïque de la puissance agissante.
- source_word: וּזְרוֹעַ קָדְשׁוֹ
  choice: et son bras saint
  rationale: Préserve l’image parallèle et traduit directement la construction « bras de sa sainteté » sous une forme française naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération « Yahweh » représente explicitement le nom divin et suit l’orientation fournie pour le projet.
- issue: Sens de הוֹשִׁיעָה לּוֹ appliqué à la main et au bras de Yahweh
  choice: sa main droite et son bras saint lui ont assuré la victoire
  alternative: sa main droite et son bras saint l’ont sauvé ; ont accompli le salut pour lui
  rationale: L’hébreu permet une formulation plus littérale liée au salut, mais le contexte célèbre une délivrance victorieuse accomplie par la puissance même de Dieu. La note maintient visibles la forme et l’ambiguïté de l’expression source.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et adaptée à la proclamation publique. Les images corporelles de la « main droite » et du « bras saint » sont conservées.
