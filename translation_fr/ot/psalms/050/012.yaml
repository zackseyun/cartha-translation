source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: fr
  text: Si j’avais faim, je ne te le dirais pas, car le monde et tout ce qu’il contient sont à moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Si j’avais faim
  rationale: La construction conditionnelle avec l’inaccompli présente ici une hypothèse rhétorique. L’imparfait français après « si » exprime naturellement cette situation hypothétique sans affirmer que Dieu pourrait réellement manquer de nourriture.
- source_word: לֹא אֹמַר לָךְ
  choice: je ne te le dirais pas
  rationale: Le conditionnel répond à la proposition introduite par « si ». Le pronom « le » explicite naturellement en français ce qui serait dit, à savoir le fait d’avoir faim.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’affirmation précédente. « Car » conserve le lien explicatif et le registre poétique.
- source_word: לִי
  choice: sont à moi
  rationale: La préposition marque la possession. Cette formulation s’accorde naturellement avec le sujet composé qui suit.
- source_word: תֵבֵל
  choice: le monde
  rationale: תֵבֵל désigne le monde, souvent envisagé comme la terre habitée. « Le monde » est ici précis, courant et adapté au parallélisme poétique.
- source_word: וּמְלֹאָהּ
  choice: et tout ce qu’il contient
  rationale: Le nom désigne ce qui remplit le monde, sa plénitude. La formulation explicite est plus naturelle en français moderne que le calque « sa plénitude », tout en conservant l’étendue totale de l’expression.
theological_decisions:
- issue: Autosuffisance divine dans le contexte des sacrifices
  choice: La phrase est rendue comme une hypothèse rhétorique soulignant que Dieu ne dépend pas des humains pour sa nourriture.
  alternative: « Si j’ai faim, je ne te le dirai pas »
  rationale: Le contexte rejette l’idée que les sacrifices serviraient à nourrir Dieu. La construction hypothétique française exprime cette portée sans ajouter de terminologie doctrinale absente du texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier conserve l’adresse directe de לָךְ. La formulation reste poétique tout en évitant le tour peu naturel « le monde et sa plénitude ».
