  yaml_path: translation/ot/psalms/050/013.yaml
  text: Do I eat the flesh of bulls[a], or drink the blood of goats?
translation:
  language: fr
  text: Est-ce que je mange la chair des taureaux, ou que je bois le sang des boucs ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאוֹכַל
  choice: Est-ce que je mange
  rationale: La particule interrogative avec l’inaccompli qal à la première personne introduit une question rhétorique. Cette tournure est naturelle et directe en français moderne.
- source_word: בְּשַׂר אַבִּירִים
  choice: la chair des taureaux
  rationale: בָּשָׂר désigne concrètement la « chair ». Dans ce contexte sacrificiel, אַבִּירִים renvoie à des bovins vigoureux, d’où « taureaux », plutôt qu’au sens général de « puissants ».
- source_word: וְדַם
  choice: ou que je bois le sang
  rationale: Le waw coordonne les deux membres parallèles. Dans une question française unique présentant deux possibilités, « ou » en restitue naturellement la relation, tandis que la répétition de « que je » maintient la clarté syntaxique.
- source_word: עַתּוּדִים
  choice: boucs
  rationale: Le terme désigne des chèvres mâles. « Boucs » exprime précisément ce sens en français sans nécessiter de note explicative.
- source_word: אֶשְׁתֶּה
  choice: je bois
  rationale: L’inaccompli qal à la première personne poursuit la question rhétorique du premier membre; le présent français convient à cette affirmation générale mise en question.
theological_decisions:
- issue: Langage sacrificiel anthropomorphique appliqué à Dieu
  choice: Conserver sans l’atténuer la question concrète sur le fait de manger la chair et de boire le sang
  alternative: Paraphraser par « Ai-je besoin de vos sacrifices ? »
  rationale: L’image cultuelle concrète nie que Dieu dépende matériellement des sacrifices. Une paraphrase abstraite ferait perdre la force et la tension rhétoriques de l’hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. « Chair », « taureaux » et « boucs » préservent l’imagerie sacrificielle concrète; la structure interrogative reste immédiatement compréhensible.
