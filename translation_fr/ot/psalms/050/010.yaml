id: PSA.50.10
reference: Psalms 50:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי לִ֥/י כָל חַיְת/וֹ יָ֑עַר בְּ֝הֵמ֗וֹת בְּ/הַרְרֵי אָֽלֶף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: fr
  text: Car tout animal de la forêt est à moi, ainsi que les bêtes sur mille montagnes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bétail sur mille collines ». Le mot hébreu peut désigner de grandes bêtes ou du bétail, et le terme rendu par « montagnes » peut aussi désigner des collines.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Le verset donne la raison de l’affirmation précédente; « car » exprime naturellement ce lien logique.
- source_word: לִי
  choice: est à moi
  rationale: La préposition marque ici la possession divine; cette tournure est idiomatique et directe en français.
- source_word: כָל חַיְתוֹ יָעַר
  choice: tout animal de la forêt
  rationale: Le singulier distributif de l’hébreu est conservé. « Animal » est actuel et neutre, tandis que le complément situe ces créatures dans le monde sauvage.
- source_word: בְּהֵמוֹת
  choice: les bêtes
  rationale: Le mot peut désigner de grands animaux et, selon le contexte, du bétail. « Bêtes » maintient cette amplitude lexicale sans limiter indûment le sens aux bovins.
- source_word: בְּהַרְרֵי
  choice: sur … montagnes
  rationale: La préposition est rendue localement par « sur », et « montagnes » correspond au sens ordinaire de הָר tout en préservant l’image poétique.
- source_word: אָלֶף
  choice: mille
  rationale: Le nombre explicite est conservé plutôt que paraphrasé par « innombrables ».
theological_decisions:
- issue: Étendue de la propriété divine évoquée
  choice: Conserver l’image poétique de mille montagnes comme expression d’une possession immense et globale.
  alternative: Comprendre le verset comme un inventaire strictement limité aux animaux présents sur exactement mille montagnes.
  rationale: Le parallélisme poétique affirme l’appartenance à Dieu des animaux sauvages et des grandes bêtes sans exiger que le nombre soit interprété comme une limite comptable.
- issue: Rapport syntaxique entre les deux membres
  choice: Rendre le second membre comme un élément parallèle inclus dans la même affirmation de possession, au moyen de « ainsi que ».
  alternative: Conserver une simple juxtaposition — « … est à moi, les bêtes… » — qui pourrait être comprise comme une apposition ambiguë en français.
  rationale: L’hébreu juxtapose les groupes nominaux sans conjonction; « ainsi que » explicite en français l’ellipse du prédicat sans modifier la portée de l’affirmation.
translation_notes:
  register: Français moderne, sobre et poétique. Le singulier distributif « tout animal » suit de près l’hébreu; « ainsi que » évite une juxtaposition obscure tout en respectant le parallélisme.
