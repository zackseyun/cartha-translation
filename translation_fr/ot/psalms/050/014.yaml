reference: Psalms 50:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זְבַ֣ח לֵ/אלֹהִ֣ים תּוֹדָ֑ה וְ/שַׁלֵּ֖ם לְ/עֶלְי֣וֹן נְדָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: fr
  text: Offre à Dieu un sacrifice d’action de grâce[a], et accomplis tes vœux envers le Très-Haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Offre à Dieu de l’action de grâce comme sacrifice » ; dans ce contexte cultuel, le terme hébreu peut désigner soit l’action de grâce, soit une offrande d’action de grâce.'
    reason: alternative lexicale
lexical_decisions:
- source_word: זְבַח
  choice: Offre
  rationale: L’impératif du verbe זבח désigne ici l’action d’offrir un sacrifice. « Offre » est naturel en français et garde le cadre cultuel sans la lourdeur de « sacrifie ».
- source_word: לֵאלֹהִים
  choice: à Dieu
  rationale: La préposition ל marque ici le destinataire de l’offrande ; « à Dieu » est la formulation française naturelle.
- source_word: תּוֹדָה
  choice: un sacrifice de reconnaissance
  rationale: תודה peut désigner la reconnaissance exprimée envers Dieu ou une offrande de reconnaissance. Cette formulation conserve à la fois la dimension sacrificielle et celle de l’action de grâce, sans imposer une catégorie rituelle trop étroite.
- source_word: וְשַׁלֵּם
  choice: et acquitte
  rationale: Dans le contexte des vœux, שלם signifie s’acquitter de ce qui a été promis. « Acquitte » exprime clairement l’obligation d’honorer ces engagements.
- source_word: לְעֶלְיוֹן
  choice: envers le Très-Haut
  rationale: עֶלְיוֹן est un titre divin signifiant « le Très-Haut ». Avec « acquitter ses vœux », « envers » rend naturellement la relation marquée par ל.
- source_word: נְדָרֶיךָ
  choice: tes vœux
  rationale: Le pluriel avec suffixe masculin singulier de deuxième personne est rendu directement par « tes vœux ».
theological_decisions:
- issue: Expression cultuelle associant זבח et תודה
  choice: un sacrifice de reconnaissance
  alternative: « de la reconnaissance » ou « une offrande de reconnaissance »
  rationale: L’hébreu peut évoquer soit la reconnaissance offerte comme sacrifice, soit une offrande particulière de reconnaissance. Le texte principal maintient les deux dimensions, et la note signale l’ambiguïté.
- issue: Titre divin עֶלְיוֹן
  choice: le Très-Haut
  alternative: « Élyôn »
  rationale: Il s’agit d’un titre divin intelligible par son sens ; le traduire communique ce sens sans le transformer en nom propre translittéré.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement singulier reflète l’adresse hébraïque à la deuxième personne masculine du singulier. « Reconnaissance » est préféré à « action de grâce » pour rester immédiatement compréhensible, tandis que la note préserve l’ambiguïté cultuelle.
