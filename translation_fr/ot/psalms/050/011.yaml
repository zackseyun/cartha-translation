source:
  edition: WLC
  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: fr
  text: Je connais tous les oiseaux des montagnes, et les créatures de la campagne[a] sont avec moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui se meut dans la campagne » ou « les animaux sauvages de la campagne » ; le mot hébreu est difficile.
    reason: lexical_alternative
  - marker: b
    text: Ou « m’appartiennent » ; l’hébreu dit plus littéralement « sont avec moi ».
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Je connais
  rationale: Le parfait qal à valeur stative exprime ici une connaissance établie et complète ; le présent est naturel en français.
- source_word: כָּל עוֹף
  choice: tous les oiseaux
  rationale: Le singulier collectif hébreu est rendu idiomatiquement par un pluriel précédé de « tous », qui conserve la portée exhaustive.
- source_word: הָרִים
  choice: des montagnes
  rationale: Ce choix direct préserve le cadre élevé et sauvage du parallélisme poétique.
- source_word: וְזִיז
  choice: et les créatures
  rationale: זִיז est un terme rare et difficile, probablement lié à ce qui se meut dans la campagne. « Créatures » reste lisible sans préciser abusivement l'espèce ou la catégorie.
- source_word: שָׂדַי
  choice: des champs
  rationale: Le pluriel français exprime naturellement le domaine ouvert ou rural évoqué par le singulier collectif hébreu.
- source_word: עִמָּדִי
  choice: sont avec moi
  rationale: La traduction conserve le sens direct de la préposition « avec moi », tout en laissant au contexte son éventuelle implication de possession.
theological_decisions:
- issue: L'implication de propriété divine dans עִמָּדִי
  choice: sont avec moi
  alternative: m'appartiennent
  rationale: Le contexte peut suggérer la souveraineté ou la possession divine, mais l'hébreu dit littéralement « avec moi ». La formulation retenue préserve cette tension sans rendre explicite une implication.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé, ainsi que l'ambiguïté du terme זִיז et la formulation littérale de עִמָּדִי.
