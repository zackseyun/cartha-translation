base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/000.yaml
  text: A psalm of Asaph. God[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: fr
  text: Psaume d’Asaph. Dieu[a], Dieu, Yahvé, a parlé et appelé la terre, du soleil levant jusqu’à son couchant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Dieu, Dieu, le SEIGNEUR » ; certains comprennent autrement les titres divins du début, notamment : « Le Dieu des dieux, le SEIGNEUR ».'
    reason: Lecture alternative de la suite inhabituelle des titres divins et autre manière de représenter le nom יהוה.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Psaume d’Asaph
  rationale: Rend naturellement le titre hébreu traditionnel, tout en conservant l’association du psaume à Asaph sans préciser davantage sa nature.
- source_word: אֵל אֱלֹהִים יְהוָה
  choice: Dieu, Dieu, Yahvé
  rationale: Reproduit la succession inhabituelle des trois désignations divines au lieu de la transformer silencieusement en une construction plus interprétative.
- source_word: וַיִּקְרָא אָרֶץ
  choice: et appelé la terre
  rationale: « Appeler » garde la portée large du verbe hébreu, qui peut ici évoquer une convocation sans l’imposer explicitement.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: du soleil levant jusqu’à son couchant
  rationale: Expression française claire et digne qui traduit les deux extrémités du parcours solaire et, par extension, toute la terre.
theological_decisions:
- issue: Rapport syntaxique entre les titres divins אֵל, אֱלֹהִים et יהוה
  choice: 'Trois désignations juxtaposées : « Dieu, Dieu, Yahvé »'
  alternative: « Le Dieu des dieux, Yahvé » ou « Dieu, le Dieu Yahvé »
  rationale: L’hébreu permet plusieurs analyses. Le texte principal conserve sa juxtaposition frappante, tandis que la note signale les principales autres compréhensions sans trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et solennel. La formulation conserve la répétition saisissante de l’hébreu et emploie une expression poétique encore immédiatement compréhensible pour l’étendue universelle de l’appel.
