source:
  edition: WLC
  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: fr
  text: Voilà ce que tu as fait, et je suis resté silencieux. Tu t’es imaginé que je serais comme toi[a]. Je te reprendrai et exposerai l’affaire sous tes yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que j’étais comme toi ». La construction hébraïque permet d’exprimer de plusieurs manières la supposition erronée.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout mettre en ordre sous tes yeux ». Le verbe hébreu signifie « disposer », « mettre en ordre » ou « exposer »; l’objet reste sous-entendu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Voilà ce que tu as fait
  rationale: Le démonstratif pluriel renvoie aux fautes énumérées auparavant. Cette tournure française restitue naturellement cette reprise accusatrice.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: et je suis resté silencieux
  rationale: Le parfait exprime ici le silence prolongé de Dieu face aux actes dénoncés, sans suggérer son approbation.
- source_word: דִּמִּיתָ
  choice: Tu t’es imaginé
  rationale: Le verbe désigne une supposition erronée. « S’imaginer » rend clairement cette nuance en français courant.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: que j’étais vraiment comme toi
  rationale: La construction donne le contenu de la supposition et possède une force emphatique. « Vraiment » marque cette insistance tout en laissant en note la possibilité d’une expression au conditionnel.
- source_word: אוֹכִיחֲךָ
  choice: Je vais te reprendre
  rationale: Le hiphil de יכח exprime une réprimande qui met la faute en évidence. « Reprendre » conserve la portée morale et accusatrice sans imposer un vocabulaire juridique trop technique.
- source_word: וְאֶעֶרְכָה לְעֵינֶיךָ
  choice: et exposer l’affaire sous tes yeux
  rationale: ערך signifie disposer ou présenter en ordre; son objet n’est pas exprimé. Le contexte d’accusation permet « l’affaire », tandis que « sous tes yeux » conserve l’image hébraïque d’une présentation manifeste.
theological_decisions:
- issue: Le silence de Dieu face au mal
  choice: Le silence est présenté comme temporaire, puis suivi d’une réprimande explicite.
  alternative: On pourrait traduire plus littéralement « je me suis tu », sans faire ressortir la durée.
  rationale: La suite du verset montre que ce silence n’équivaut pas à une approbation; la traduction ne précise toutefois pas davantage la raison théologique de ce délai.
- issue: La présentation ordonnée de l’accusation
  choice: « exposer l’affaire » rend explicite l’objet sous-entendu sans détailler la nature exacte de ce qui sera présenté.
  alternative: « tout mettre en ordre sous tes yeux » conserverait davantage l’indétermination de l’objet.
  rationale: Le contexte soutient une scène de réprimande ou d’accusation, mais la note signale que le texte hébreu laisse l’objet implicite.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse divine au coupable au singulier. L’image « sous tes yeux » est conservée, tandis que les notes maintiennent les ambiguïtés grammaticale et lexicale de l’hébreu.
