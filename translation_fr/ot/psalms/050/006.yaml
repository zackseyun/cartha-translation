id: PSA.50.6
reference: Psalms 50:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּגִּ֣ידוּ שָׁמַ֣יִם צִדְק֑/וֹ כִּֽי אֱלֹהִ֓ים שֹׁפֵ֖ט ה֣וּא סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/006.yaml
  text: And the heavens declare his righteousness[a], for God himself is judge. Selah
translation:
  language: fr
  text: Et les cieux proclament sa justice[a], car Dieu lui-même est juge. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ».
    reason: Alternative lexicale réelle pour צִדְקוֹ, qui peut désigner la justice ou la rectitude morale.
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: proclament
  rationale: Le hifil de נגד exprime ici le fait de faire connaître publiquement. « Proclament » convient au registre poétique et solennel du psaume.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel hébreu est bien rendu par la formulation poétique française traditionnelle et toujours compréhensible « les cieux ».
- source_word: צִדְקוֹ
  choice: sa justice
  rationale: צדק désigne ici la rectitude de Dieu manifestée dans son rôle de juge. En français, « justice » conserve naturellement à la fois l'idée de droiture et celle de juste jugement.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la proclamation des cieux ; « car » en préserve clairement la valeur explicative.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le mot a ici un sens singulier, confirmé par la construction.
- source_word: שֹׁפֵט
  choice: est juge
  rationale: Le participe est employé comme prédicat nominal. « Est juge » en conserve la force sans ajouter l'article défini absent de l'hébreu.
- source_word: הוּא
  choice: lui-même
  rationale: Le pronom indépendant porte une valeur emphatique, rendue idiomatiquement en français par « lui-même ».
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis de ce terme liturgique demeure incertain ; sa translittération évite de lui imposer une interprétation.
theological_decisions:
- issue: Sens de צדק dans le contexte du jugement divin
  choice: sa justice
  alternative: sa droiture
  rationale: « Justice » exprime naturellement en français la rectitude morale de Dieu et sa juste activité judiciaire. « Droiture » reste possible, mais rend moins directement le lien contextuel avec Dieu comme juge.
translation_notes:
  register: Français moderne, poétique et solennel sans archaïsme. La coordination initiale « Et » ainsi que le titre prédicatif « juge » suivent de près la structure hébraïque. Le marqueur liturgique est conservé sous la forme française accentuée « Sélah ».
