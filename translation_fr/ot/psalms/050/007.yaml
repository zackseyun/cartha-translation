base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/007.yaml
  text: 'Hear[a], my people, and I will speak; O Israel, and I will testify against you: I am God, your God.'
translation:
  language: fr
  text: 'Écoute, mon peuple, et je parlerai ; Israël, je témoignerai contre toi[a] : je suis Dieu, ton Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je porterai témoignage contre toi ». Le verbe hébreu appartient au langage juridique du témoignage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Écoute
  rationale: L’impératif singulier appelle Israël, envisagé comme un peuple, à une écoute attentive. « Écoute » est naturel en français tout en conservant le ton solennel et judiciaire.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Le nom avec suffixe de première personne exprime le lien d’appartenance et d’alliance.
- source_word: וַאֲדַבֵּרָה
  choice: et je parlerai
  rationale: Le cohortatif de première personne exprime ici la volonté solennelle du locuteur après l’appel à écouter.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé et fonctionne comme une apostrophe en apposition à « mon peuple » ; le français moderne n’exige pas l’ajout de « ô ».
- source_word: וְאָעִידָה בָּךְ
  choice: je témoignerai contre toi
  rationale: 'Le hiphil de עוד avec בְּ porte ici une force juridique : Dieu se présente comme témoin à charge. « Témoigner contre toi » préserve cette image judiciaire, tandis que la note signale une autre analyse possible.'
- source_word: אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: je suis Dieu, ton Dieu
  rationale: La proposition nominale avec le pronom indépendant emphatique exprime une identification solennelle. Cette formulation française claire conserve à la fois l’affirmation de l’identité divine et la relation d’alliance.
theological_decisions:
- issue: Identification divine emphatique אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: je suis Dieu, ton Dieu
  alternative: Dieu, ton Dieu, c’est moi
  rationale: La formulation retenue rend naturellement la proposition sans verbe tout en conservant l’apposition et la revendication relationnelle, sans ajouter de précision doctrinale.
- issue: Valeur juridique de וְאָעִידָה בָּךְ
  choice: je témoignerai contre toi
  alternative: je te prendrai à témoin
  rationale: Le contexte de convocation et de jugement favorise le témoignage à charge, mais la construction permet aussi de comprendre qu’Israël est pris à témoin ; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement singulier correspond aux formes hébraïques adressées à Israël comme à une personne collective. La ponctuation souligne l’apostrophe sans recourir au vocatif littéraire « ô Israël ».
