  - severity: low
    issue: Ponctuation expressive après « je parlerai »
    rationale: Le point d’exclamation est possible stylistiquement, mais le point-virgule rend mieux l’enchaînement parallèle de l’hébreu et maintient un ton solennel sans intensification ajoutée.
