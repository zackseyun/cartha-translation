source:
  edition: WLC
  text: מִ/צִּיּ֥וֹן מִכְלַל יֹ֗פִי אֱלֹהִ֥ים הוֹפִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/002.yaml
  text: From Zion[a], the perfection of beauty, God shines forth.
translation:
  language: fr
  text: De Sion[a], beauté parfaite, Dieu resplendit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « De Sion, perfection de beauté, Dieu a resplendi » ou « De Sion, dans une beauté parfaite, Dieu resplendit ».'
    reason: La construction hébraïque peut être comprise comme une apposition qualifiant Sion, ou, plus librement, comme une indication de la manière dont Dieu se manifeste ; l’accompli hébreu peut également être rendu par un parfait en français.
lexical_decisions:
- source_word: מִ/צִּיּוֹן
  choice: De Sion
  rationale: La préposition מִן indique ici la source ou le point de départ de la manifestation divine. « De Sion » est naturel et fidèle en français.
- source_word: מִכְלַל יֹפִי
  choice: parfaite en beauté
  rationale: La construction exprime la plénitude ou l’accomplissement de la beauté. Cette formulation poétique et compréhensible rattache naturellement l’expression à Sion sans alourdir le vers.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le verbe singulier confirme que le nom a ici un sens singulier.
- source_word: הוֹפִיעַ
  choice: resplendit
  rationale: Le hiphil de יפע évoque une apparition rayonnante ou le fait de briller avec éclat. « Resplendit » conserve à la fois l’image lumineuse et la dignité poétique; le présent rend vivement l’accompli hébreu.
theological_decisions:
- issue: Rapport entre « parfaite en beauté » et Sion ou Dieu
  choice: 'Rattacher l’expression en apposition à Sion : « De Sion, parfaite en beauté, Dieu resplendit. »'
  alternative: Comprendre l’expression de manière adverbiale, « De Sion, dans une beauté parfaite, Dieu resplendit », ou comme décrivant plus directement Dieu.
  rationale: L’ordre des mots hébreux favorise une apposition décrivant Sion, mais une lecture adverbiale demeure possible; elle est donc signalée en note plutôt qu’exclue.
- issue: Valeur temporelle de הוֹפִיעַ
  choice: 'Présent poétique : « resplendit »'
  alternative: 'Accompli : « a resplendi » ou « s’est manifesté dans sa splendeur »'
  rationale: La forme hébraïque est perfective, mais le présent français restitue bien la vivacité et la portée durable de l’énoncé poétique. La valeur accomplie est conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. « Parfaite en beauté » est plus idiomatique que le calque « perfection de la beauté » dans le texte principal, tandis que « resplendit » préserve l’image d’une manifestation lumineuse.
