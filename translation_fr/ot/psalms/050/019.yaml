  text: פִּ֭י/ךָ שָׁלַ֣חְתָּ בְ/רָעָ֑ה וּ֝/לְשׁוֹנְ/ךָ֗ תַּצְמִ֥יד מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/019.yaml
  text: You let your mouth loose for evil[b][a], and your tongue frames deceit.
translation:
  language: fr
  text: Tu laisses ta bouche se déchaîner pour faire le mal[a], et tu mets ta langue au service de la tromperie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Tu donnes libre cours à ta bouche pour faire le mal. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu attaches ta langue à la tromperie » ou « tu associes ta langue à la tromperie »; le verbe évoque le fait de joindre ou d’attacher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיךָ
  choice: ta bouche
  rationale: Le terme désigne littéralement la bouche, employée ici pour la parole; conserver l’image maintient le parallélisme avec « ta langue ».
- source_word: שָׁלַחְתָּ
  choice: tu laisses … se déchaîner
  rationale: Le verbe signifie fondamentalement « envoyer, lâcher »; avec « bouche », cette formulation exprime une parole à laquelle on donne libre cours tout en gardant la vigueur de l’image.
- source_word: בְרָעָה
  choice: pour faire le mal
  rationale: La préposition peut indiquer la direction ou le domaine. Cette formulation française exprime naturellement l’orientation morale de la parole sans réduire רָעָה au seul dommage causé.
- source_word: וּלְשׁוֹנְךָ
  choice: et ta langue
  rationale: La traduction littérale préserve l’image corporelle et le parallélisme poétique avec « ta bouche ».
- source_word: תַּצְמִיד
  choice: tu attaches
  rationale: Le hifil de צמד évoque l’action de joindre ou d’attacher. « Tu attaches » conserve ce sens concret et causatif, malgré son caractère légèrement marqué en français.
- source_word: מִרְמָה
  choice: la tromperie
  rationale: « Tromperie » rend le sens général de fraude ou de duplicité et convient directement au contexte de paroles mensongères.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et poétique. Les images de la bouche et de la langue sont conservées; « se déchaîner » rend l’élan idiomatique du premier verbe, tandis que « attaches » maintient l’image concrète et l’ambiguïté du second.
