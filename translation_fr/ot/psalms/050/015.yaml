  text: וּ֭/קְרָאֵ/נִי בְּ/י֣וֹם צָרָ֑ה אֲ֝חַלֶּצְ/ךָ֗ וּֽ/תְכַבְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: fr
  text: Et invoque-moi au jour de la détresse ; je te délivrerai, et tu m’honoreras.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu me glorifieras ». Le verbe hébreu peut signifier « honorer » ou « glorifier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: Invoque-moi
  rationale: Le verbe קרא avec le suffixe désignant Dieu exprime ici l’appel adressé à Dieu pour obtenir son secours. « Invoque-moi » est naturel, précis et adapté au registre poétique de la prière.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Cette formulation conserve l’expression temporelle et poétique de l’hébreu tout en restant intelligible en français moderne. צָרָה évoque une situation de détresse ou d’adversité grave.
- source_word: אֲחַלֶּצְךָ
  choice: je te délivrerai
  rationale: Le piel de חלץ signifie ici arracher au danger, délivrer ou secourir. « Je te délivrerai » rend clairement la promesse divine sans explicitation excessive.
- source_word: וּתְכַבְּדֵנִי
  choice: et tu m’honoreras
  rationale: Le piel de כבד peut signifier honorer ou glorifier. « Tu m’honoreras » est idiomatique et conserve le sens large de rendre à Dieu l’honneur qui lui revient.
theological_decisions:
- issue: Réponse humaine à la délivrance divine
  choice: et tu m’honoreras
  alternative: et tu me glorifieras
  rationale: L’hébreu présente l’honneur rendu à Dieu comme la réponse appropriée à sa délivrance. « Honorer » préserve l’étendue du sens sans le limiter à une expression spécifiquement doxologique, tandis que « glorifier » demeure une traduction légitime.
translation_notes:
  register: Français international moderne, digne et poétique. « Invoque-moi » convient au contexte de prière sans être archaïque ; « au jour de la détresse » conserve le parallélisme et la concision de l’hébreu.
