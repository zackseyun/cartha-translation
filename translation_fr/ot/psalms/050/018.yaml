  text: Si tu voyais un voleur, tu prenais plaisir à être avec lui[a], et tu avais ta part avec des adultères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu l’approuvais » ou « tu l’acceptais ». Le verbe hébreu peut exprimer la faveur, l’agrément ou l’acceptation.
