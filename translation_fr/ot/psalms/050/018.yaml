lexical_decisions:
- source_word: אִם רָאִיתָ
  choice: Si tu voyais
  rationale: אִם introduit ici un cas à valeur conditionnelle ou habituelle. L’imparfait français rend naturellement cette conduite répétée dans le cadre de l’accusation.
- source_word: גַנָּב
  choice: un voleur
  rationale: Traduction directe et courante de גַּנָּב, qui désigne celui qui dérobe.
- source_word: וַתִּרֶץ עִמּוֹ
  choice: tu te plaisais avec lui
  rationale: Le verbe רצה exprime la faveur, l’agrément ou l’acceptation. Cette formulation conserve l’idée fondamentale de complaisance sans réduire le sens à la simple fréquentation.
- source_word: וְעִם מְנָאֲפִים חֶלְקֶךָ
  choice: et tu partageais le sort des adultères
  rationale: Littéralement, « ta part [était] avec des adultères ». La traduction conserve l’image de la part commune tout en la formulant de manière naturelle en français.
