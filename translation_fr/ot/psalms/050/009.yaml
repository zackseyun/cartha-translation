lexical_decisions:
- source_word: אֶקַּח
  choice: Je ne prendrai pas
  rationale: Le qal inaccompli à la première personne du singulier, nié par לֹא, exprime ici naturellement la déclaration divine par un futur en français.
- source_word: מִבֵּיתְךָ
  choice: de ta maison
  rationale: La formulation conserve l’image concrète de la maison comme domaine où se trouvent les biens et les animaux du fidèle.
- source_word: פָר
  choice: un taureau
  rationale: פָר désigne un bovin mâle, notamment dans un contexte sacrificiel; « taureau » est précis et naturel.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: de tes enclos
  rationale: מִכְלָאָה désigne un espace fermé destiné au bétail; « enclos » convient à différents animaux et reste courant en français.
- source_word: עַתּוּדִים
  choice: des boucs
  rationale: Le terme hébreu désigne spécifiquement des chèvres mâles; « boucs » en restitue directement le sens sans nécessiter de note.
