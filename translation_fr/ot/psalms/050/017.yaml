  variant: modern international French
source:
  edition: WLC
  text: וְ֭/אַתָּה שָׂנֵ֣אתָ מוּסָ֑ר וַ/תַּשְׁלֵ֖ךְ דְּבָרַ֣/י אַחֲרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/017.yaml
  text: For you hate discipline[b][a], and you cast my words behind you.
translation:
  language: fr
  text: Mais toi, tu détestes la correction[a] et tu jettes mes paroles derrière toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’instruction », « la discipline » ou « la réprimande ». Le mot hébreu désigne une instruction corrective qui vise à former.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: Le pronom explicite marque fortement l’interlocuteur, et le contexte favorise ici une valeur adversative du waw. La note conserve les autres nuances possibles.
- source_word: שָׂנֵאתָ
  choice: tu détestes
  rationale: Le parfait qal à la deuxième personne décrit ici une attitude caractéristique. Le présent français convient au discours accusateur, et « détester » rend naturellement la forte aversion exprimée.
- source_word: מוּסָר
  choice: la correction
  rationale: Le terme désigne une instruction qui forme en reprenant ou en disciplinant. « Correction » préserve cette dimension corrective sans la réduire à un simple enseignement.
- source_word: וַתַּשְׁלֵךְ
  choice: tu jettes
  rationale: Le verbe conserve l’image concrète d’un rejet volontaire. Le présent s’accorde avec l’accusation portant sur l’attitude habituelle de l’interlocuteur.
- source_word: דְּבָרַי
  choice: mes paroles
  rationale: Traduction directe du pluriel avec suffixe de première personne, sans préciser indûment qu’il s’agit de commandements ou d’enseignements.
- source_word: אַחֲרֶיךָ
  choice: derrière toi
  rationale: La traduction garde la métaphore hébraïque du rejet hors de la vue et évite « derrière ton dos », qui pourrait suggérer une action secrète en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La structure parallèle et l’image concrète de paroles jetées derrière soi sont conservées. « Mais toi » explicite la valeur adversative la plus probable dans le contexte.
