id: PSA.50.3
reference: Psalms 50:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָ֤בֹ֥א אֱלֹהֵ֗י/נוּ וְֽ/אַל יֶ֫חֱרַ֥שׁ אֵשׁ לְ/פָנָ֥י/ו תֹּאכֵ֑ל וּ֝/סְבִיבָ֗י/ו נִשְׂעֲרָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: fr
  text: Notre Dieu vient et ne garde pas le silence[a]. Devant lui, un feu dévore, et autour de lui une violente tempête fait rage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Notre Dieu viendra et ne gardera pas le silence. » Les formes verbales hébraïques peuvent avoir ici une valeur future. La seconde proposition peut aussi se comprendre comme un souhait : « qu’il ne garde pas le silence ».'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu peut aussi se rendre : « autour de lui, tout est extrêmement tumultueux » ou « autour de lui, la tempête se déchaîne avec violence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: vient
  rationale: L’imparfait qal de בוא peut avoir une valeur présente ou future dans la poésie. Le présent « vient » rend ici la vivacité de l’apparition divine, tandis que la valeur future est signalée en note.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec le suffixe de première personne du pluriel.
- source_word: וְאַל יֶחֱרַשׁ
  choice: et ne garde pas le silence
  rationale: Cette formulation française naturelle conserve le sens de חרשׁ et lit la proposition comme une affirmation liée à la venue de Dieu. La possible nuance volitive de אַל est conservée en note.
- source_word: אֵשׁ לְפָנָיו תֹאכֵל
  choice: Devant lui, un feu dévore
  rationale: « Devant lui » préserve l’image spatiale de לְפָנָיו, et « dévore » exprime avec force l’emploi de אכל dont le feu est le sujet.
- source_word: וּסְבִיבָיו
  choice: et autour de lui
  rationale: Traduction directe, concise et naturelle de la locution spatiale.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: une violente tempête fait rage
  rationale: Le nifal de שער décrit un déchaînement orageux ou tourbillonnant, intensifié par מְאֹד. Le français demande naturellement un sujet explicite; « une violente tempête fait rage » restitue l’image sans l’affaiblir.
theological_decisions:
- issue: Le verset décrit une théophanie de jugement sans en préciser un accomplissement christologique ou un cadre confessionnel.
  choice: Conserver la description directe de la venue de Dieu, accompagnée du feu et de la tempête.
  alternative: Interpréter explicitement cette scène comme une annonce typologique du jugement final.
  rationale: Le texte hébreu présente la venue de Dieu et les phénomènes qui l’accompagnent, mais n’explicite pas ici une interprétation doctrinale ultérieure.
- issue: Valeur de וְאַל יֶחֱרַשׁ après l’annonce de la venue de Dieu.
  choice: 'Le rendre dans le texte principal comme une affirmation : « et ne garde pas le silence ».'
  alternative: 'Le comprendre comme un souhait ou une exhortation : « qu’il ne garde pas le silence ».'
  rationale: Le contexte poétique permet une lecture déclarative, mais la nuance volitive normalement associée à אַל demeure possible et doit rester visible en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent donne à la scène sa vivacité poétique; les notes préservent les ambiguïtés temporelle, volitive et lexicale de l’hébreu.
