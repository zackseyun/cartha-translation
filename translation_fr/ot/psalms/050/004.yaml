id: PSA.50.4
reference: Psalms 50:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִקְרָ֣א אֶל הַ/שָּׁמַ֣יִם מֵ/עָ֑ל וְ/אֶל הָ֝/אָ֗רֶץ לָ/דִ֥ין עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/004.yaml
  text: 'He calls to the heavens above and to the earth[a], that he may judge his people:'
translation:
  language: fr
  text: Il appelle les cieux d’en haut et la terre[a], afin de juger son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il convoque les cieux d’en haut et la terre. » Le verbe peut avoir le sens de convoquer, notamment dans un cadre judiciaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָא
  choice: Il appelle
  rationale: Le qal inaccompli 3 ms de קרא peut signifier « appeler » ou « convoquer ». « Appelle » reste naturel et vivant en français, tout en laissant la note signaler la nuance judiciaire possible.
- source_word: אֶל הַשָּׁמַיִם מֵעָל
  choice: les cieux d’en haut
  rationale: אֶל marque ici le destinataire de l’appel et מֵעָל qualifie adverbialement les cieux. « Les cieux d’en haut » conserve le parallélisme cosmique et le registre poétique.
- source_word: וְאֶל הָאָרֶץ
  choice: et la terre
  rationale: En parallèle avec « les cieux », הָאָרֶץ désigne la terre dans son étendue cosmique, non un territoire particulier.
- source_word: לָדִין
  choice: afin de juger
  rationale: L’infinitif construit précédé de ל exprime le but. « Afin de juger » rend ce rapport explicitement dans un français soutenu mais courant.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עם désigne ici le peuple lié à Dieu; « son peuple » préserve cette relation sans introduire la notion politique moderne de nation.
theological_decisions:
- issue: Identité du sujet implicite
  choice: Maintenir le pronom masculin singulier « Il », qui renvoie contextuellement à Dieu.
  alternative: Introduire explicitement « Dieu ».
  rationale: Le verbe hébreu est à la troisième personne du masculin singulier, sans sujet nominal exprimé dans ce verset. Le pronom respecte la continuité du discours sans ajouter un nom absent du texte.
- issue: Fonction des cieux et de la terre dans la scène judiciaire
  choice: Conserver la formulation ouverte « appelle », sans préciser qu’ils sont témoins.
  alternative: Traduire « convoque » ou expliciter « comme témoins ».
  rationale: Le contexte peut évoquer une convocation judiciaire, mais le verset ne qualifie pas expressément les cieux et la terre de témoins. La note présente la nuance de « convoquer » sans résoudre au-delà du texte.
translation_notes:
  register: Français international moderne, digne et poétique. La structure demeure proche de l’hébreu tout en étant fluide; « afin de » marque clairement le but et « les cieux d’en haut » conserve l’ampleur cosmique du parallélisme.
