source:
  edition: WLC
  text: תֵּ֭שֵׁב בְּ/אָחִ֣י/ךָ תְדַבֵּ֑ר בְּ/בֶֽן אִ֝מְּ/ךָ֗ תִּתֶּן דֹּֽפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/020.yaml
  text: You sit and speak against your brother[a]; you slander your own mother's son.
translation:
  language: fr
  text: Tu t’assieds et tu parles contre ton frère ; tu diffames le fils de ta propre mère.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Tu t’assieds
  rationale: Conserve l’image concrète du verbe ישׁב et sa force accusatrice, plutôt que de la réduire à une simple valeur adverbiale.
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: tu parles contre ton frère
  rationale: Dans ce contexte de parole hostile, la préposition בְּ avec דבר prend naturellement le sens de « contre » ; le français garde ainsi la structure et le parallélisme hébreux.
- source_word: בְּבֶן אִמְּךָ
  choice: le fils de ta propre mère
  rationale: Cette formulation proche de l’hébreu souligne le lien familial particulièrement étroit et reste intelligible en français moderne.
- source_word: תִּתֶּן דֹּפִי
  choice: tu diffames
  rationale: L’expression idiomatique associe נתן, « donner/mettre », à דֹּפִי, « reproche, accusation déshonorante ». « Diffamer » rend naturellement l’acte de porter contre quelqu’un des paroles qui salissent sa réputation.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement conserve l’adresse accusatrice au singulier. Le parallélisme familial entre « ton frère » et « le fils de ta propre mère » est maintenu, tout comme l’image initiale de la personne qui s’assied pour parler.
