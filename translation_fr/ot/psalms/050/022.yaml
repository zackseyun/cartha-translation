  text: בִּֽינוּ נָ֣א זֹ֭את שֹׁכְחֵ֣י אֱל֑וֹהַּ פֶּן אֶ֝טְרֹ֗ף וְ/אֵ֣ין מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: fr
  text: Comprenez donc ceci, vous qui oubliez Dieu, de peur que je ne vous déchire, sans que personne puisse vous délivrer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de peur que je ne déchire, et qu’il n’y ait personne pour délivrer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּֽינוּ נָ֣א זֹאת
  choice: Comprenez donc ceci
  rationale: L’impératif pluriel de בין appelle au discernement. נָא renforce ici l’exhortation; « donc » en restitue naturellement l’insistance en français sans donner à la parole divine le ton d’une supplication.
- source_word: שֹׁכְחֵ֣י אֱל֑וֹהַּ
  choice: vous qui oubliez Dieu
  rationale: Le participe est employé comme vocatif et décrit les destinataires par leur oubli de Dieu. Cette formulation reste directe et naturelle.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française exprime clairement l’avertissement et la conséquence redoutée introduite par פֶּן, dans un registre soutenu mais actuel.
- source_word: אֶ֝טְרֹ֗ף
  choice: je ne vous déchire
  rationale: טרף évoque l’action de mettre une proie en pièces. Le pronom objet, implicite en hébreu mais évident dans le contexte, est explicité en français.
- source_word: וְאֵ֣ין מַצִּֽיל
  choice: sans que personne puisse vous délivrer
  rationale: L’expression nie l’existence d’un libérateur. « Délivrer » conserve le vocabulaire solennel du salut face au jugement, tandis que la construction française exprime naturellement l’absence de tout secours.
theological_decisions:
- issue: Image du jugement divin en אֶטְרֹף
  choice: 'Conserver l’image prédatrice directe : « je ne vous déchire »'
  alternative: Atténuer par « je ne vous détruise » ou « je ne vous saisisse »
  rationale: Le verbe hébreu présente délibérément le jugement de Dieu sous l’image violente d’une proie déchirée. L’atténuer effacerait une tension théologique réellement présente dans le texte.
- issue: Objet implicite de אֶטְרֹף et rapport avec מַצִּיל
  choice: Expliciter « vous » dans les deux propositions
  alternative: 'Traduire plus formellement : « que je ne déchire, sans personne pour délivrer »'
  rationale: Le contexte identifie sans ambiguïté les personnes menacées. L’explicitation rend la phrase idiomatique en français sans résoudre une ambiguïté théologique.
translation_notes:
  register: Français international moderne, direct et digne. « Comprenez donc » porte l’urgence de נָא sans le ton potentiellement inadéquat de « s’il vous plaît ». L’image forte de la déchirure est maintenue.
