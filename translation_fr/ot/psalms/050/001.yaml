id: PSA.50.1
reference: Psalms 50:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֵ֤ל אֱֽלֹהִ֡ים יְֽהוָ֗ה דִּבֶּ֥ר וַ/יִּקְרָא אָ֑רֶץ מִ/מִּזְרַח שֶׁ֝֗מֶשׁ עַד מְבֹאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: fr
  text: 'Psaume d’Asaph.


    Le Puissant[a], Dieu, Yahweh, a parlé ;

    il a convoqué la terre,

    du lever du soleil jusqu’à son coucher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu, Dieu, Yahweh » ; certains comprennent autrement les titres divins du début, notamment : « Le Dieu des dieux, Yahweh ».'
    reason: La syntaxe de אֵל אֱלֹהִים יְהוָה permet plusieurs analyses, qu’il convient de ne pas trancher silencieusement.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et exact pour ce genre de composition dans les titres des psaumes.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: Le ל peut indiquer l’auteur, l’appartenance ou l’association à un recueil ; la formulation française reste concise sans préciser davantage ce rapport.
- source_word: אֵל
  choice: Le Puissant
  rationale: Cette désignation distingue אֵל de אֱלֹהִים et conserve la force de l’accumulation solennelle des noms divins.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Les verbes au singulier et le nom divin יהוה montrent qu’il s’agit ici du Dieu d’Israël, non de plusieurs dieux.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle en français moderne du nom divin, qui préserve son caractère de nom propre plutôt que de lui substituer un titre.
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le parfait présente l’acte comme accompli ; le passé composé convient naturellement au français et introduit la convocation qui suit.
- source_word: וַיִּקְרָא
  choice: il a convoqué
  rationale: Dans ce cadre solennel, קרא signifie appeler ou sommer de comparaître ; « convoquer » restitue cette nuance sans expliciter excessivement une scène judiciaire.
- source_word: אָרֶץ
  choice: la terre
  rationale: Le mérisme allant du lever au coucher du soleil indique une portée universelle plutôt qu’un territoire particulier.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: du lever du soleil
  rationale: Cette expression conserve l’image poétique hébraïque tout en étant idiomatique en français.
- source_word: עַד מְבֹאוֹ
  choice: jusqu’à son coucher
  rationale: Le suffixe masculin renvoie au soleil ; cette formulation restitue clairement l’autre extrémité du mérisme.
theological_decisions:
- issue: Interprétation de la triple désignation אֵל אֱלֹהִים יְהוָה
  choice: Le Puissant, Dieu, Yahweh
  alternative: 'Dieu, Dieu, Yahweh ; ou : Le Dieu des dieux, Yahweh'
  rationale: L’hébreu juxtapose trois désignations divines. Distinguer אֵל par « Le Puissant » préserve l’effet rhétorique et sa valeur lexicale. Une lecture en chaîne construite, « le Dieu des dieux », demeure possible mais paraît moins naturelle ici ; elle est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et poétique. La disposition en lignes rend le parallélisme et le mouvement solennel du verset. « Convoqué » fait entendre la scène d’assemblée ou de jugement suggérée par le contexte sans l’ajouter explicitement.
