source:
  edition: WLC
  text: זֹבֵ֥חַ תּוֹדָ֗ה יְֽכַ֫בְּדָ֥/נְנִי וְ/שָׂ֥ם דֶּ֑רֶךְ אַ֝רְאֶ֗/נּוּ בְּ/יֵ֣שַׁע אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: fr
  text: Celui qui offre un sacrifice de reconnaissance m’honore[a] ; à celui qui règle sa conduite[b], je lui ferai voir le salut de Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui sacrifie une offrande de reconnaissance ». Le mot hébreu désigne ici la reconnaissance exprimée sous forme de sacrifice.
    reason: lexical_alternative
  - marker: b
    text: Ou « à celui qui met son chemin en ordre » ou « à celui qui prépare un chemin ». L’expression hébraïque est concise et peut évoquer une conduite bien réglée.
    reason: alternative_reading
  - marker: c
    text: Ou « la délivrance de Dieu » ou « la victoire de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ תּוֹדָה
  choice: Celui qui offre en sacrifice sa reconnaissance
  rationale: Le participe substantivé désigne une personne de manière générale. תּוֹדָה exprime ici une reconnaissance offerte dans un cadre sacrificiel ; cette formulation conserve à la fois l’acte cultuel et l’action de grâce.
- source_word: יְכַבְּדָנְנִי
  choice: m’honore
  rationale: Le piel de כבד signifie ici « honorer » ou « glorifier » ; « m’honore » est direct, naturel et fidèle.
- source_word: וְשָׂם דֶּרֶךְ
  choice: à celui qui règle sa conduite
  rationale: L’expression hébraïque est compacte et littéralement liée au fait de « placer/ordonner un chemin ». La traduction rend son sens probablement éthique en français naturel tout en signalant l’ambiguïté en note.
- source_word: אַרְאֶנּוּ
  choice: je ferai voir
  rationale: Le hiphil de ראה avec suffixe masculin singulier signifie « faire voir à quelqu’un » ; cette tournure conserve la valeur causative de la forme.
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: le salut de Dieu
  rationale: יֵשַׁע peut désigner le salut, la délivrance ou la victoire. « Le salut de Dieu » respecte l’expression hébraïque et convient au contexte du psaume.
theological_decisions:
- issue: Sens de וְשָׂם דֶּרֶךְ dans le second membre
  choice: Une promesse adressée à celui qui règle sa conduite
  alternative: « à celui qui prépare un chemin » ou, plus littéralement, « à celui qui met le chemin en ordre »
  rationale: Le sens éthique est probable dans le contexte, mais l’hébreu demeure elliptique. La note préserve les autres possibilités sans faire dépendre la traduction d’une doctrine particulière.
- issue: Portée de יֵשַׁע אֱלֹהִים
  choice: le salut de Dieu
  alternative: « la délivrance de Dieu » ou « la victoire de Dieu »
  rationale: « Salut » garde l’étendue sémantique et théologique usuelle du terme, tandis que la note indique les nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Règle sa conduite » rend naturellement la métaphore hébraïque du chemin, tandis que la note en conserve la formulation et l’ambiguïté. Les marqueurs suivent immédiatement les expressions concernées.
