  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: fr
  text: Rassemblez auprès de moi ceux qui me sont fidèles, ceux qui concluent mon alliance par un sacrifice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui coupent mon alliance sur/au moyen d’un sacrifice ». En hébreu, « couper une alliance » signifie « conclure une alliance ».'
    reason: La note est ancrée sur « sacrifice », auquel se rapportent l’idiome « couper une alliance » et l’ambiguïté de la préposition עֲלֵי.
lexical_decisions:
- source_word: אִסְפוּ
  choice: Rassemblez
  rationale: L’impératif qal masculin pluriel appelle plusieurs agents à réunir les personnes désignées. « Rassemblez » est naturel et conserve la force de l’ordre.
- source_word: לִי
  choice: auprès de moi
  rationale: La préposition ל avec suffixe de première personne peut signifier « à/pour moi ». Ici, « auprès de moi » exprime le rassemblement dans la présence de Dieu sans suggérer que Dieu serait lui-même déplacé.
- source_word: חֲסִידָי
  choice: ceux qui me sont fidèles
  rationale: חסיד désigne ici des personnes caractérisées par leur fidélité et leur attachement à Dieu dans le cadre de l’alliance. Cette formulation est claire et évite les connotations ecclésiastiques possibles de « saints ».
- source_word: כֹּרְתֵי בְרִיתִי
  choice: ceux qui concluent mon alliance
  rationale: L’expression hébraïque emploie littéralement le verbe « couper » avec « alliance ». En français actuel, « conclure une alliance » rend naturellement l’idiome tout en conservant son sens relationnel et solennel.
- source_word: עֲלֵי זָבַח
  choice: par un sacrifice
  rationale: La préposition על relie ici la conclusion de l’alliance au rite sacrificiel. « Par un sacrifice » exprime cette médiation rituelle sans imposer la valeur spatiale incertaine de « sur ».
theological_decisions:
- issue: Sens de חֲסִידָי dans le contexte de l’alliance
  choice: ceux qui me sont fidèles
  alternative: mes fidèles ; mes saints ; ceux qui m’aiment fidèlement
  rationale: Le choix conserve la notion de loyauté envers Dieu sans transformer le terme en titre religieux technique ni préciser davantage que l’hébreu la nature de cette fidélité.
- issue: Rapport entre l’alliance et le sacrifice
  choice: ceux qui concluent mon alliance par un sacrifice
  alternative: ceux qui ont conclu mon alliance par un sacrifice ; ceux qui coupent mon alliance sur un sacrifice
  rationale: Le participe hébreu ne marque pas explicitement le temps ; le présent français en préserve la portée descriptive. « Par » rend le lien rituel probable, tandis que la note signale l’expression et les prépositions littérales afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est maintenu par la reprise de « ceux qui ». « Alliance » et « sacrifice » sont conservés comme termes bibliques précis, sans archaïsme inutile.
