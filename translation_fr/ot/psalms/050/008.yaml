id: PSA.50.8
reference: Psalms 50:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: fr
  text: Ce n’est pas pour tes sacrifices que je te reprends ; tes holocaustes sont constamment devant moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא עַל
  choice: Ce n’est pas pour
  rationale: Cette tournure française naturelle exprime que les sacrifices ne constituent pas le motif du reproche, sans nier l’acte de reprendre dans un sens absolu.
- source_word: זְבָחֶיךָ
  choice: tes sacrifices
  rationale: זֶבַח est un terme général désignant les sacrifices, souvent animaux ; « sacrifices » en conserve la portée sans précision excessive.
- source_word: אוֹכִיחֶךָ
  choice: je te reprends
  rationale: Le hiphil de יכח exprime ici le reproche ou la réprimande. « Reprendre » est clair, digne et convient à l’adresse divine.
- source_word: וְעוֹלֹתֶיךָ
  choice: tes holocaustes
  rationale: עוֹלָה désigne techniquement l’offrande entièrement brûlée ; « holocauste » est le terme cultuel français usuel dans ce contexte biblique.
- source_word: לְנֶגְדִּי
  choice: devant moi
  rationale: L’expression indique la présence ou l’exposition au regard de Dieu ; « devant moi » la rend directement.
- source_word: תָמִיד
  choice: constamment
  rationale: תָמִיד exprime ici la continuité ou la régularité persistante des offrandes présentées à Dieu.
theological_decisions:
- issue: Rapport du reproche divin au système sacrificiel d’Israël
  choice: Le verset nie que le reproche de Dieu soit motivé par un manque de sacrifices.
  alternative: Le verset rejetterait entièrement les sacrifices.
  rationale: Le second membre constate que les holocaustes sont constamment devant Dieu. Le problème n’est donc pas leur absence, mais, selon le contexte, une réalité plus profonde concernant le culte rendu.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase clivée « Ce n’est pas pour… » rend explicitement la portée de לֹא עַל et évite l’ambiguïté possible de « Je ne te reprends pas pour… ». Le terme cultuel « holocaustes » est conservé pour sa précision biblique.
