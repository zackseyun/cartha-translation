  text: וְ/לָ֤/רָשָׁ֨ע אָ֘מַ֤ר אֱלֹהִ֗ים מַה לְּ֭/ךָ לְ/סַפֵּ֣ר חֻקָּ֑/י וַ/תִּשָּׂ֖א בְרִיתִ֣/י עֲלֵי פִֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: fr
  text: 'Mais au méchant, Dieu dit : « De quel droit as-tu à réciter mes prescriptions et à prendre mon alliance sur tes lèvres ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: Mais au méchant
  rationale: La conjonction introduit ici un contraste avec les fidèles évoqués auparavant. « Méchant » exprime la catégorie morale désignée par רָשָׁע sans la réduire au seul sens juridique de « coupable ».
- source_word: אָמַר אֱלֹהִים
  choice: Dieu dit
  rationale: Bien que le verbe hébreu soit à la forme qatal, le présent convient naturellement à cette introduction poétique d’un discours direct et en conserve la vivacité.
- source_word: מַה לְּךָ
  choice: De quel droit
  rationale: Cette tournure idiomatique conteste la qualité ou la légitimité de l’interlocuteur plutôt qu’elle ne demande une simple information. « De quel droit » rend clairement la force du reproche.
- source_word: לְסַפֵּר
  choice: racontes-tu
  rationale: Le verbe סָפַר désigne ici l’action d’énoncer ou de réciter les prescriptions divines. « Raconter » reste proche de son champ lexical tout en étant compréhensible en français courant.
- source_word: חֻקָּי
  choice: mes prescriptions
  rationale: חֹק désigne des règles établies ou des dispositions prescrites. « Prescriptions » conserve la nuance normative et juridico-alliantielle dans un français naturel.
- source_word: וַתִּשָּׂא
  choice: et mets-tu
  rationale: נָשָׂא signifie littéralement « lever, porter ». Avec « alliance » et « sur ta bouche », l’image évoque le fait de prendre l’alliance en bouche; « mettre sur ses lèvres » restitue cette expression de manière idiomatique.
- source_word: בְרִיתִי
  choice: mon alliance
  rationale: « Alliance » est le terme français usuel pour בְּרִית et en préserve la portée théologique et canonique.
- source_word: עֲלֵי פִיךָ
  choice: sur tes lèvres
  rationale: Littéralement « sur ta bouche ». « Sur tes lèvres » conserve l’image du texte tout en exprimant naturellement l’acte de parler en français.
theological_decisions:
- issue: Nature du reproche adressé au méchant
  choice: Le verset conteste la légitimité morale du méchant à réciter les prescriptions de Dieu et à invoquer son alliance.
  alternative: Y voir une interdiction absolue faite au méchant de mentionner verbalement l’alliance de Dieu.
  rationale: La tournure מַה לְּךָ met en cause la prétention et l’incohérence de l’interlocuteur. Elle vise son hypocrisie dans le contexte de l’alliance plutôt que toute parole possible au sujet de Dieu.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes hébraïques de deuxième personne et donne au reproche sa force personnelle. Le parallélisme des deux actes — raconter les prescriptions et mettre l’alliance sur les lèvres — est conservé.
