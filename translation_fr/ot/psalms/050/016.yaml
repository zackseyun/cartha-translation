review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : contraste avec le méchant, contestation de sa légitimité à énoncer les prescriptions divines et à se réclamer de l’alliance. Toutefois, l’hébreu coordonne deux infinitifs dépendant de l’interrogation idiomatique מַה־לְּךָ (« Qu’as-tu à… ? / De quel droit… ? »). La formulation actuelle passe à deux verbes personnels, ce qui reste interprétatif et affaiblit légèrement la structure parallèle du source.'
  naturalness: « De quel droit racontes-tu… et mets-tu… ? » est grammatical, mais « raconter des prescriptions » est moins idiomatique et moins précis que « réciter » ou « énoncer ». Une construction infinitive est à la fois plus naturelle dans cette question rhétorique et plus proche du parallélisme hébreu.
  terminology: « Méchant », « prescriptions » et « alliance » conviennent au registre et au vocabulaire du psaume. « Réciter mes prescriptions » rend mieux לְסַפֵּר dans ce contexte que « raconter ». « Prendre mon alliance sur tes lèvres » conserve l’image sans la surinterpréter.
  issues:
