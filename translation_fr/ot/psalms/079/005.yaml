id: PSA.79.5
reference: Psalms 79:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: fr
  text: Jusqu’à quand, Yahweh ? Seras-tu en colère pour toujours ? Ta jalousie[a] brûlera-t-elle comme un feu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton zèle ». Le mot hébreu peut signifier « jalousie » ou « zèle ».
    reason: Alternative lexicale authentique de קִנְאָה.
lexical_decisions:
- source_word: עַד מָה
  choice: Jusqu’à quand
  rationale: Formule idiomatique de lamentation qui demande combien de temps durera la colère divine; cette tournure est naturelle et pressante en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que remplacement par un titre.
- source_word: תֶּאֱנַף
  choice: seras-tu en colère
  rationale: Le verbe אנף exprime la colère; cette formulation française est claire et ne renforce pas indûment le sens.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Dans cette lamentation, le psalmiste demande si la colère divine se prolongera sans fin.
- source_word: תִּבְעַר
  choice: brûlera-t-elle
  rationale: Le verbe בער désigne le fait de brûler et convient directement à la comparaison avec le feu.
- source_word: כְּמוֹ אֵשׁ
  choice: comme un feu
  rationale: Rend simplement et naturellement la comparaison hébraïque.
- source_word: קִנְאָתֶךָ
  choice: ta jalousie
  rationale: קִנְאָה peut désigner la jalousie ou le zèle. « Jalousie » préserve ici la force relationnelle et l’arrière-plan d’alliance, tandis que l’autre sens reste signalé en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de קִנְאָה appliqué à Dieu
  choice: jalousie
  alternative: zèle
  rationale: Le contexte de colère et l’imagerie du feu favorisent « jalousie », sans éliminer le sens possible de « zèle », conservé en note afin de préserver l’ambiguïté lexicale et la tension théologique.
- issue: Portée interrogative de la seconde moitié
  choice: Deux questions successives
  alternative: 'Une seule question prolongée: « Seras-tu en colère pour toujours, ta jalousie brûlera-t-elle comme un feu ? »'
  rationale: La poésie permet une continuité syntaxique, mais deux questions parallèles rendent clairement la progression du vers sans modifier son contenu.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement conserve l’adresse personnelle à Dieu. La structure interrogative et l’image vive du feu sont maintenues.
