source:
  edition: WLC
  text: כִּ֭י אָכַ֣ל אֶֽת יַעֲקֹ֑ב וְֽ/אֶת נָוֵ֥/הוּ הֵשַֽׁמּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: fr
  text: 'Car ils ont dévoré Jacob

    et dévasté sa demeure[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car ils ont consumé Jacob et rendu son habitation déserte. »'
    reason: Alternative lexicale reflétant les sens possibles de אָכַל, נָוֶה et הֵשַׁמּוּ.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la demande formulée dans le contexte précédent et conserve naturellement la valeur explicative de la conjonction.
- source_word: אָכַל
  choice: ont dévoré
  rationale: Le sens premier est « manger », mais, dans cette image d'agression contre un peuple, « dévorer » restitue avec force l'idée de consommation et de destruction.
- source_word: אֶת יַעֲקֹב
  choice: Jacob
  rationale: Le nom poétique et collectif de Jacob est conservé plutôt que remplacé par « Israël » ou explicité comme désignant ses descendants.
- source_word: נָוֵהוּ
  choice: sa demeure
  rationale: Le terme peut désigner une habitation, un séjour ou un pâturage. « Sa demeure » garde ici un sens locatif large sans limiter indûment le référent au sanctuaire.
- source_word: הֵשַׁמּוּ
  choice: dévasté
  rationale: Cette forme causative exprime la mise en désolation. « Dévasté » est actuel, vigoureux et naturel en français poétique.
theological_decisions:
- issue: Référent de « sa demeure »
  choice: La demeure de Jacob/Israël, comprise au sens collectif sans précision supplémentaire.
  alternative: Le sanctuaire en particulier, ou plus généralement le pays.
  rationale: Le suffixe renvoie naturellement à Jacob dans le parallélisme. Le contexte du psaume permet de penser au sanctuaire ou au pays, mais ce verset seul ne commande pas de trancher; la formulation large préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme hébraïque est conservé sur deux lignes; « Car » marque le lien explicatif avec le contexte précédent.
