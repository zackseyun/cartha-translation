id: PSA.79.8
reference: Psalms 79:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: fr
  text: Ne retiens pas contre nous les fautes d’autrefois[a] ! Que ta compassion vienne sans tarder à notre rencontre, car nous avons été profondément abaissés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les fautes de nos ancêtres » ; autre traduction possible : « nos fautes passées ». L’expression hébraïque est ambiguë.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Ne retiens pas contre nous
  rationale: La tournure exprime naturellement en français le souvenir défavorable ou judiciaire impliqué par זכר avec ל dans ce contexte, tout en conservant l’idée de garder les fautes en mémoire.
- source_word: עֲוֺנֹת
  choice: les fautes
  rationale: « Fautes » exprime des actes coupables et leur poids moral dans un français actuel, sans réduire עָוֹן à une erreur involontaire.
- source_word: רִאשֹׁנִים
  choice: d’autrefois
  rationale: 'Cette expression temporelle conserve l’indétermination de l’hébreu : il peut s’agir des fautes des générations antérieures ou de fautes commises auparavant.'
- source_word: מַהֵר
  choice: vite
  rationale: Rend directement l’urgence de l’adverbe dans une prière contemporaine et digne.
- source_word: יְקַדְּמוּנוּ
  choice: vienne … à notre rencontre
  rationale: Préserve l’image de la compassion divine qui se porte au-devant des suppliants.
- source_word: רַחֲמֶיךָ
  choice: ta compassion
  rationale: Le pluriel hébreu רַחֲמִים fonctionne souvent comme un nom abstrait ou collectif ; le singulier « compassion » est ici plus naturel en français que « compassions ».
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: car nous sommes au plus bas
  rationale: Rend l’état résultant d’extrême faiblesse ou d’abaissement exprimé par דלל et renforcé par מְאֹד, sans suggérer nécessairement une déchéance morale.
theological_decisions:
- issue: Référence des « fautes d’autrefois »
  choice: Formulation temporelle qui ne précise pas à qui appartiennent ces fautes
  alternative: « les fautes de nos ancêtres » ou « nos fautes passées »
  rationale: L’hébreu עֲוֺנֹת רִאשֹׁנִים est temporellement et référentiellement ambigu. Le texte principal maintient cette ambiguïté au lieu de trancher entre culpabilité ancestrale et fautes antérieures de la communauté.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation marque la supplication ; « au plus bas » communique clairement la détresse extrême sans archaïsme.
