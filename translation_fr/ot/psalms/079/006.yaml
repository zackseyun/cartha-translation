source:
  edition: WLC
  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: fr
  text: Déverse ta fureur sur les nations qui ne te connaissent pas[a], et sur les royaumes qui n’invoquent pas ton nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne te reconnaissent pas ». En hébreu, « connaître » peut exprimer une reconnaissance relationnelle, et non une simple connaissance intellectuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui ne font pas appel à ton nom ». L’expression hébraïque « invoquer le nom » désigne ici le fait de faire appel à Dieu dans la prière ou le culte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Déverse
  rationale: L’impératif conserve l’image vive d’une colère répandue sur ceux qu’elle vise; «déverse» est naturel et digne en français.
- source_word: חֲמָתְךָ
  choice: ta fureur
  rationale: חֵמָה désigne une colère ardente et intense. «Fureur» en exprime la force sans affaiblir le caractère imprécatoire du verset.
- source_word: אֶל
  choice: sur
  rationale: Avec «déverser», le français emploie naturellement «sur» pour indiquer la cible.
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Le terme désigne ici les peuples étrangers; «nations» préserve le parallélisme et évite les connotations plus tardives de «païens» ou «Gentils».
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: qui ne te connaissent pas
  rationale: Cette formulation directe conserve l’amplitude de יָדַע, qui peut évoquer aussi bien la connaissance que la reconnaissance relationnelle.
- source_word: וְעַל
  choice: et sur
  rationale: La reprise de «sur» rend clairement le parallélisme entre les deux objets de la requête.
- source_word: מַמְלָכוֹת
  choice: les royaumes
  rationale: Équivalent direct qui désigne des entités politiques et maintient le parallélisme poétique avec «nations».
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: qui n’invoquent pas ton nom
  rationale: L’expression קרא בשם désigne l’appel adressé à Dieu dans la prière ou le culte. «Invoquer ton nom» rend naturellement cet idiome en français.
- source_word: בְּשִׁמְךָ
  choice: ton nom
  rationale: La préposition hébraïque est intégrée à la construction française «invoquer ton nom», tout en conservant la portée religieuse du nom divin.
theological_decisions:
- issue: Nature de la connaissance de Dieu attribuée aux nations
  choice: «qui ne te connaissent pas»
  alternative: «qui ne te reconnaissent pas»
  rationale: Le texte hébreu emploie «connaître», qui peut comporter une dimension relationnelle. La traduction principale en conserve la profondeur sans la réduire à la seule reconnaissance ou au seul culte.
- issue: Sens de l’appel au nom de Dieu
  choice: «qui n’invoquent pas ton nom»
  alternative: «qui ne font pas appel à ton nom»
  rationale: «Invoquer» exprime de façon concise la prière ou l’appel cultuel impliqué par l’idiome hébreu, sans préciser davantage que le texte.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme hébraïque est conservé; le tutoiement correspond à l’adresse directe à Dieu. Les notes préservent l’étendue sémantique des deux expressions théologiquement chargées.
