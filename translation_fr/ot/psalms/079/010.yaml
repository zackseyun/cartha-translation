source:
  edition: WLC
  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: fr
  text: 'Pourquoi les nations diraient-elles : « Où est leur Dieu ? » Que la vengeance pour le sang versé de tes serviteurs soit connue[a] parmi les nations, sous nos yeux !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Que l’on sache parmi les nations, sous nos yeux : la vengeance pour le sang versé de tes serviteurs ! »'
    reason: La construction hébraïque peut se comprendre soit avec « la vengeance » comme sujet de « soit connue », soit comme le contenu annoncé après une tournure impersonnelle.
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ
  choice: Pourquoi les nations diraient-elles
  rationale: 'Le conditionnel français rend naturellement la protestation rhétorique et la nuance de souhait implicite : les nations ne devraient pas pouvoir parler ainsi.'
- source_word: הַגּוֹיִם
  choice: les nations
  rationale: Dans ce psaume, le terme désigne les peuples étrangers ; « nations » est précis et n’introduit pas une nuance religieuse plus tardive.
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: Où est leur Dieu ?
  rationale: Cette formulation directe conserve la raillerie des nations envers le Dieu d’Israël.
- source_word: יִוָּדַע
  choice: soit connue
  rationale: Le passif rend le niphal de ידע et exprime le souhait que l’acte de vengeance devienne publiquement manifeste.
- source_word: בַגּוֹיִם
  choice: parmi les nations
  rationale: La préposition désigne ici le milieu dans lequel l’action doit être reconnue publiquement.
- source_word: לְעֵינֵינוּ
  choice: sous nos yeux
  rationale: Expression française naturelle qui garde l’idée d’une intervention visible dont les priants demandent à être témoins.
- source_word: נִקְמַת
  choice: la vengeance
  rationale: Le terme explicite la rétribution demandée à Dieu ; « justice » en atténuerait indûment la force imprécatoire.
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: pour le sang versé de tes serviteurs
  rationale: « Sang versé » conserve l’image de la mort violente, tandis que « pour » exprime naturellement en français le rapport entre la vengeance et le sang qui l’appelle.
theological_decisions:
- issue: Demande imprécatoire de vengeance divine
  choice: Conserver explicitement « la vengeance »
  alternative: Employer « justice » ou reformuler par « rends justice »
  rationale: Le substantif hébreu נְקָמָה désigne bien la vengeance ou la rétribution. Le remplacer par un terme plus doux effacerait la tension théologique du psaume.
- issue: Rapport syntaxique de לְעֵינֵינוּ
  choice: Rattacher « sous nos yeux » à la manifestation publique de la vengeance
  alternative: Le rattacher plus étroitement au groupe nominal « la vengeance… sous nos yeux »
  rationale: L’ordre hébreu permet une certaine souplesse. La formulation retenue indique clairement que les priants demandent à voir eux-mêmes cette vengeance devenir manifeste parmi les nations.
- issue: Agent de la vengeance
  choice: Maintenir une tournure passive sans nommer explicitement l’agent
  alternative: « Fais connaître… » ou « montre que tu venges… »
  rationale: Dieu est clairement l’agent attendu dans le contexte, mais le texte hébreu emploie ici un passif ; la traduction évite donc d’ajouter un sujet grammatical explicite.
translation_notes:
  register: Français international moderne, digne et direct. Le conditionnel interrogatif rend la protestation avec naturel ; « sous nos yeux » préserve la vivacité de la demande. La ponctuation exclamative marque le caractère pressant de la prière sans en amplifier le contenu.
