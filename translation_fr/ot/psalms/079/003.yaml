  text: They have poured out their blood like water all around Jerusalem[a], and there is no one to bury them.
translation:
  language: fr
  text: Ils ont répandu leur sang comme de l’eau tout autour de Jérusalem, et il n’y avait personne pour les enterrer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: ont répandu
  rationale: Le qal accompli, 3e personne du pluriel, décrit une action achevée. « Répandre » conserve à la fois le sens de verser le sang et l’image concrète prolongée par « comme de l’eau ».
- source_word: דָמָם
  choice: leur sang
  rationale: Traduction directe du nom דם avec suffixe de 3e personne masculine plurielle, sans expliciter davantage que l’hébreu.
- source_word: כמים
  choice: comme de l’eau
  rationale: Le préfixe כ marque une comparaison; cette formulation naturelle préserve l’image saisissante du sang traité comme une eau sans valeur.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: tout autour de Jérusalem
  rationale: « Tout autour de » rend naturellement l’étendue environnante exprimée par סביבות.
- source_word: וְאֵין
  choice: et personne n’était là
  rationale: L’expression existentielle négative indique l’absence de quiconque. L’imparfait français harmonise naturellement la description avec l’action passée, sans changer le rapport logique.
- source_word: קוֹבֵר
  choice: pour les ensevelir
  rationale: Le participe signifie « quelqu’un qui enterre ». L’objet « les » est implicite dans le contexte et nécessaire en français; « ensevelir » convient au registre funéraire et poétique.
