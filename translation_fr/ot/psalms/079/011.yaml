source:
  edition: WLC
  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: fr
  text: Que le gémissement du prisonnier parvienne jusqu’à toi ! Selon la grandeur de ton bras, garde en vie ceux qui sont voués à la mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la mort », expression hébraïque désignant ceux qui sont voués à mourir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּבוֹא לְפָנֶיךָ
  choice: parvienne jusqu’à toi
  rationale: L’imparfait à valeur jussive exprime ici une prière. Cette formulation française rend naturellement l’idée d’un gémissement qui arrive en présence de Dieu.
- source_word: אֶנְקַת אָסִיר
  choice: le gémissement du prisonnier
  rationale: Le singulier hébreu est conservé. « Gémissement » exprime une plainte audible causée par la détresse, et « prisonnier » rend clairement אָסִיר.
- source_word: כְּגֹדֶל זְרוֹעֲךָ
  choice: Dans la grandeur de ton bras
  rationale: La préposition כְּ peut indiquer la mesure ou la conformité. Cette traduction garde l’image concrète du bras, symbole transparent de la puissance divine, sans l’aplanir en « puissance ».
- source_word: הוֹתֵר
  choice: garde en vie
  rationale: L’impératif hiphil de יתר demande que Dieu fasse subsister les personnes menacées. « Garde en vie » exprime directement ce sens dans un français actuel.
- source_word: בְּנֵי תְמוּתָה
  choice: ceux qui sont voués à la mort
  rationale: L’expression signifie littéralement « fils de la mort » et désigne des personnes promises, condamnées ou exposées à la mort. « Voués à la mort » préserve une certaine latitude quant à la cause de leur sort.
theological_decisions:
- issue: Statut exact des personnes désignées par בְּנֵי תְמוּתָה
  choice: ceux qui sont voués à la mort
  alternative: ceux qui sont condamnés à mort
  rationale: L’hébreu n’indique pas explicitement s’il s’agit d’une condamnation judiciaire, d’une menace imminente ou d’un autre destin mortel. « Voués » évite de préciser indûment la cause.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la supplication est maintenu, ainsi que la métaphore hébraïque du bras. Le point d’exclamation marque la valeur de prière des deux formes verbales.
