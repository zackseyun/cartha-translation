  text: עָזְרֵ֤/נוּ אֱלֹ֘הֵ֤י יִשְׁעֵ֗/נוּ עַל דְּבַ֥ר כְּבֽוֹד שְׁמֶ֑/ךָ וְ/הַצִּילֵ֥/נוּ וְ/כַפֵּ֥ר עַל חַ֝טֹּאתֵ֗י/נוּ לְמַ֣עַן שְׁמֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: fr
  text: Viens à notre aide, Dieu de notre salut, à cause de la gloire de ton nom ; délivre-nous et fais expiation pour nos péchés, à cause de ton nom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Viens à notre aide
  rationale: L’impératif de עזר avec suffixe de première personne du pluriel exprime un appel pressant. Cette tournure est naturelle et digne en français.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Dieu de notre salut
  rationale: Reproduit la construction hébraïque et présente Dieu comme la source du salut, sans préciser davantage la nature de celui-ci.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: à cause de la gloire de ton nom
  rationale: עַל דְּבַר indique ici le motif ou le fondement de l’intervention demandée. La traduction garde distinctement les notions de gloire et de nom.
- source_word: וְהַצִּילֵנוּ
  choice: délivre-nous
  rationale: Le hiphil de נצל signifie arracher au danger ou délivrer. « Délivre-nous » convient au registre du psaume et évite de répéter « salut ».
- source_word: וְכַפֵּר עַל
  choice: fais l’expiation pour
  rationale: כפר avec עַל relève du langage de l’expiation et dépasse la seule idée de pardon. La formulation conserve ce poids théologique tout en restant compréhensible.
- source_word: חַטֹּאתֵינוּ
  choice: nos péchés
  rationale: Rend directement le nom pluriel muni du suffixe de première personne du pluriel.
- source_word: לְמַעַן שְׁמֶךָ
  choice: à cause de ton nom
  rationale: Exprime que le nom, c’est-à-dire l’honneur et la réputation de Dieu, constitue le motif de son intervention. La répétition du nom est maintenue.
theological_decisions:
- issue: Sens de כפר dans une supplication pénitentielle
  choice: fais l’expiation pour nos péchés
  alternative: pardonne nos péchés
  rationale: « Pardonne » serait fluide, mais atténuerait le langage propre de l’expiation. La traduction retenue préserve la portée du verbe sans introduire un mécanisme doctrinal absent du verset.
- issue: Double appel au nom de Dieu
  choice: à cause de la gloire de ton nom ... à cause de ton nom
  alternative: pour la gloire de ton nom ... pour l’honneur de ton nom
  rationale: Le texte fonde la demande sur le nom et la gloire de Dieu plutôt que sur le mérite du peuple. Le parallélisme et la répétition sont conservés sans les fusionner.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement suit l’usage biblique français courant. « Fais l’expiation » est retenu plutôt que le rare transitif « expie nos péchés », afin de rendre clairement la construction כפר על et de préserver son langage cultuel.
