  text: וְ/הָ֘שֵׁ֤ב לִ/שְׁכֵנֵ֣י/נוּ שִׁ֭בְעָתַיִם אֶל חֵיקָ֑/ם חֶרְפָּ֘תָ֤/ם אֲשֶׁ֖ר חֵרְפ֣וּ/ךָ אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/012.yaml
  text: And repay to our neighbors sevenfold into their lap the reproach with which they reproached you[b][a], O Lord.
translation:
  language: fr
  text: Rends à nos voisins, au septuple, dans leur giron, l’opprobre dont ils t’ont outragé, Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Fais revenir à nos voisins, sept fois, dans leur giron, l’opprobre dont ils t’ont outragé. » Le « giron » évoque l’endroit où l’on reçoit quelque chose ; l’image exprime que leur outrage retombe sur eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָשֵׁב
  choice: Rends
  rationale: Le hiphil impératif de שוב demande ici de faire revenir sur les auteurs ce qu’ils ont infligé; «rends» exprime naturellement cette rétribution tout en conservant l’image du retour.
- source_word: לִשְׁכֵנֵינוּ
  choice: à nos voisins
  rationale: שָׁכֵן désigne ceux qui habitent à proximité. Dans ce contexte national, il peut s’agir des peuples voisins, mais «nos voisins» évite de préciser au-delà de l’hébreu.
- source_word: שִׁבְעָתַיִם
  choice: au septuple
  rationale: La forme adverbiale signifie «sept fois» ou «au septuple». Cette dernière formulation garde la force poétique d’une rétribution intensifiée.
- source_word: אֶל חֵיקָם
  choice: jusque dans leur sein
  rationale: חֵיק désigne le sein, le giron ou le repli du vêtement où l’on reçoit quelque chose. «Dans leur sein» préserve l’image hébraïque du mal qui revient personnellement sur eux; «jusque» rend la direction marquée par אֶל sans transformer l’expression en simple complément abstrait.
- source_word: חֶרְפָּתָם
  choice: l’insulte
  rationale: חֶרְפָּה peut désigner l’opprobre, l’outrage ou l’insulte. Ici, la proposition relative indique une offense verbale adressée à Dieu; «l’insulte» est clair et naturel en français moderne.
- source_word: אֲשֶׁר חֵרְפוּךָ
  choice: qu’ils t’ont faite
  rationale: Le verbe חרף signifie outrager, insulter ou couvrir d’opprobre. En français, «l’insulte qu’ils t’ont faite» rend naturellement la relation étymologique entre le nom et le verbe, même si elle ne peut être reproduite mot pour mot.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: אֲדֹנָי est le titre divin «Seigneur» et fonctionne ici comme une adresse directe.
theological_decisions:
- issue: Prière imprécatoire et intensité de la rétribution
  choice: Conserver la demande directe d’une rétribution au septuple.
  alternative: Reformuler comme une demande générale de justice ou atténuer la sanction.
  rationale: L’hébreu demande explicitement à Dieu de faire revenir l’outrage sur les peuples hostiles. La traduction maintient cette tension théologique sans l’adoucir ni l’expliquer.
- issue: Référent de l’insulte
  choice: Présenter l’insulte comme adressée directement à Dieu.
  alternative: Comprendre principalement l’opprobre infligé au peuple de Dieu.
  rationale: Le suffixe de deuxième personne dans חֵרְפוּךָ signifie explicitement «ils t’ont insulté». La traduction conserve cette adresse sans élargir ou déplacer le référent.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’impératif «Rends» conserve la vigueur de la prière; «au septuple» maintient son rythme poétique. «Dans leur sein» est une image moins courante aujourd’hui, mais elle est gardée et explicitée en note afin de préserver la métaphore hébraïque.
