  - severity: low
    issue: 'Note : « leur opprobre dont ils t’ont couvert »'
    rationale: La formulation littérale proposée dans la note est syntaxiquement maladroite et « couvrir d’opprobre » ne rend pas exactement le verbe avec son objet direct (« ils t’ont outragé »).
