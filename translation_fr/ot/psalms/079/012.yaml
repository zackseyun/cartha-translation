  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : impératif de rétribution, destinataires (« nos voisins »), intensification septuple, image du retour dans leur giron, et outrage adressé à Dieu. Toutefois, « l’insulte qu’ils t’ont faite » affaiblit et reformule de façon trop idiomatique le lien direct avec « l’opprobre » ; l’hébreu répète la racine חרף et désigne plus précisément l’opprobre qu’ils ont lancé contre Dieu.'
  naturalness: « Jusque dans leur sein » est peu naturel et « sein » est ambigu en français moderne. « Dans leur giron » est le correspondant idiomatique et suffisamment littéral de l’image hébraïque. La construction révisée est plus fluide tout en gardant un registre psalmique soutenu.
  terminology: « Opprobre » permet de conserver le registre et le lien lexical avec « ont outragé ». « Au septuple » est acceptable et poétique. « Seigneur » convient pour אֲדֹנָי en apostrophe.
