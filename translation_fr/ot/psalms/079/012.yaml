- from: Rends à nos voisins, au septuple, jusque dans leur sein, l’insulte qu’ils t’ont faite, Seigneur.[a]
  to: Rends à nos voisins, au septuple, dans leur giron, l’opprobre dont ils t’ont outragé, Seigneur.[a]
  rationale: La révision remplace une expression française ambiguë et peu idiomatique par « dans leur giron », préserve plus précisément le vocabulaire d’opprobre et d’outrage du texte hébreu, et corrige la note afin qu’elle explicite l’image sans présenter une pseudo-littéralité maladroite.
