  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: fr
  text: Mais nous, ton peuple et les brebis de ton pâturage[a], nous te rendrons grâce pour toujours ; de génération en génération, nous proclamerons ta louange[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le troupeau de ton pâturage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous raconterons ta louange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Mais nous
  rationale: Le waw joint au pronom indépendant marque ici naturellement le contraste avec les nations et la dévastation évoquées auparavant.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: Expression simple et directe qui désigne Israël dans sa relation d’alliance avec Dieu.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: les brebis de ton pâturage
  rationale: Cette formulation conserve explicitement l’image pastorale ; צֹאן peut désigner les brebis ou, collectivement, le troupeau.
- source_word: נוֹדֶה לְּךָ
  choice: nous te rendrons grâce
  rationale: Le hiphil de ידה exprime ici l’action de remercier ou de louer. « Rendre grâce » préserve une distinction avec תְּהִלָּתֶךָ dans le membre suivant.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Formulation française actuelle et naturelle pour une durée sans fin dans cet engagement de reconnaissance.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Rend naturellement l’idée de continuité au fil des générations successives.
- source_word: נְסַפֵּר
  choice: nous raconterons
  rationale: Le piel de ספר peut exprimer le fait de raconter ou d’énumérer. Ce choix maintient la nuance de transmission répétée, malgré une tournure légèrement plus soutenue en français.
- source_word: תְּהִלָּתֶךָ
  choice: ta louange
  rationale: Le singulier hébreu peut désigner la louange adressée à Dieu ou ce qui, en lui et dans ses œuvres, mérite d’être loué. La traduction directe en préserve l’ouverture.
theological_decisions:
- issue: Image pastorale appliquée au peuple de Dieu
  choice: Conserver explicitement « les brebis de ton pâturage »
  alternative: « le troupeau de ton pâturage »
  rationale: Le verset présente la communauté à la fois comme le peuple de Dieu et comme les brebis placées sous ses soins. L’image est conservée sans lui ajouter de développement doctrinal.
- issue: Objet de l’annonce transmise aux générations suivantes
  choice: Conserver « ta louange »
  alternative: « tes hauts faits dignes de louange »
  rationale: Le nom hébreu peut viser aussi bien la louange elle-même que ce qui la suscite. La formulation retenue évite de réduire cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « nous… nous » rend l’insistance du pronom hébreu. Le parallélisme entre rendre grâce et raconter la louange est conservé, ainsi que l’image pastorale.
