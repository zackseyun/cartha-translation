  source_fidelity: 'La structure et les termes principaux sont bien rendus : titre asaphique, adresse à Dieu, héritage divin, profanation du temple et réduction de Jérusalem en ruines. Toutefois, « ont envahi » explicite l’hostilité contextuelle au-delà de בָּאוּ (« sont venus/entrés »). Le contexte permet cette lecture, mais une traduction d’équivalence optimale peut conserver le verbe plus général sans perdre la force du passage.'
  naturalness: Le français est clair, actuel et d’un registre approprié à une lamentation. « Sont entrées dans ton héritage » est idiomatique et permet de reproduire plus directement le mouvement exprimé par l’hébreu.
