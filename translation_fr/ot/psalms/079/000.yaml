  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: fr
  text: Psaume d’Asaph. Ô Dieu, des nations sont entrées dans ton héritage ; elles ont profané ton saint temple, elles ont réduit Jérusalem à un monceau de ruines.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Psaume d’Asaph
  rationale: Rend naturellement le titre hébreu tout en conservant l’ambiguïté possible du לְ, qui peut exprimer l’auteur, l’appartenance ou l’association.
- source_word: בָּאוּ גוֹיִם בְּנַחֲלָתֶךָ
  choice: des nations ont envahi ton héritage
  rationale: Le verbe signifie littéralement « sont entrées/venues dans ». Dans ce contexte hostile, « ont envahi » exprime naturellement la violation du territoire donné par Dieu, sans préciser davantage l’identité des nations.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: ton saint temple
  rationale: Formulation française claire et directe pour « le temple de ta sainteté ».
- source_word: לְעִיִּים
  choice: à un monceau de ruines
  rationale: Le pluriel hébreu désigne des amas ou monceaux de ruines ; cette expression en restitue concrètement la force.
theological_decisions:
- issue: Sens de « ton héritage »
  choice: ton héritage
  alternative: le pays qui t’appartient / ton domaine
  rationale: La formulation conserve l’image théologique hébraïque sans décider si elle vise principalement le pays, le peuple ou l’ensemble de la possession divine.
- issue: Relation d’Asaph au psaume
  choice: Psaume d’Asaph
  alternative: Psaume appartenant au recueil d’Asaph
  rationale: La traduction traditionnelle reste concise et laisse ouverte la portée exacte de la préposition hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. L’interjection « Ô Dieu » marque l’adresse directe et la plainte solennelle. Le parallélisme des trois actes hostiles est préservé.
