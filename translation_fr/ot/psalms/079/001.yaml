source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: fr
  text: 'Psaume d’Asaph.


    Ô Dieu, des nations sont entrées dans ton héritage ; elles ont profané ton temple saint ; elles ont réduit Jérusalem en ruines[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en amas de ruines ».'
    reason: Le nom hébreu est au pluriel et peut désigner des monceaux de décombres ; « en ruines » est toutefois plus naturel dans le texte courant.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme conventionnel et exact pour ce genre de composition dans les titres des psaumes.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: La préposition marque ici une relation à Asaph sans obliger à préciser s’il s’agit strictement de l’auteur, du destinataire ou d’une appartenance à sa tradition.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est employé comme apostrophe ; « Ô Dieu » en restitue clairement la valeur vocative dans un registre digne.
- source_word: בָּאוּ גוֹיִם
  choice: des nations ont envahi
  rationale: Littéralement, les nations « sont venues dans » le domaine de Dieu. Dans ce contexte de profanation et de destruction, « ont envahi » exprime naturellement en français l’entrée hostile impliquée par la scène.
- source_word: בְּנַחֲלָתֶךָ
  choice: ton héritage
  rationale: « Héritage » conserve la portée d’une possession accordée et appartenant à Dieu, sans réduire explicitement le référent au pays ou au peuple.
- source_word: טִמְּאוּ
  choice: ont profané
  rationale: Le verbe relève de l’impureté cultuelle ; appliqué au temple, « profaner » rend clairement l’atteinte portée à son caractère sacré.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: ton temple saint
  rationale: Formulation française naturelle qui conserve à la fois la référence au temple et son caractère consacré à Dieu.
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: elles ont réduit Jérusalem en ruines
  rationale: La construction exprime le résultat de l’action. « Réduire en ruines » est idiomatique et rend le sens du nom désignant des ruines ou des amas de décombres.
theological_decisions:
- issue: Portée de « ton héritage »
  choice: Conserver « ton héritage » sans en préciser le référent
  alternative: ton pays ; ton peuple
  rationale: L’hébreu peut évoquer la terre, le peuple ou plus largement la possession d’alliance de Dieu. Une explicitation supprimerait cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe « Ô Dieu » conserve le ton de la lamentation ; les reprises par « elles » rendent les propositions successives naturelles sans modifier leur sujet.
