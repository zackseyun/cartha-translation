  yaml_path: translation/ot/psalms/079/004.yaml
  text: We have become a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: fr
  text: Nous sommes devenus un objet de mépris aux yeux de nos voisins, un sujet de moquerie et de raillerie pour ceux qui nous entourent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: Nous sommes devenus
  rationale: 'Le qal accompli à la première personne du pluriel exprime ici un état résultant des événements décrits : « sommes devenus » rend à la fois le changement survenu et la situation présente.'
- source_word: חֶרְפָּה
  choice: un objet de mépris
  rationale: Le nom désigne la honte publique et, par métonymie, la personne exposée au mépris. Cette formulation est naturelle en français et convient au contexte de lamentation.
- source_word: לִשְׁכֵנֵינוּ
  choice: pour nos voisins
  rationale: 'La préposition ל marque ici la relation : Israël est devenu un objet de mépris aux yeux des peuples voisins. « Pour nos voisins » conserve sobrement cette relation.'
- source_word: לַעַג
  choice: un sujet de moquerie
  rationale: Le terme désigne l'action de tourner quelqu'un en ridicule. « Un sujet de moquerie » maintient la construction nominale et s'accorde naturellement avec le premier membre.
- source_word: קֶלֶס
  choice: raillerie
  rationale: Ce nom proche de לַעַג évoque les paroles ou gestes de dérision. « Raillerie » préserve l'accumulation poétique de termes voisins sans les confondre.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: pour ceux qui nous entourent
  rationale: L'expression désigne les peuples ou personnes alentour. Cette traduction naturelle conserve une portée un peu plus large que « nos voisins ».
