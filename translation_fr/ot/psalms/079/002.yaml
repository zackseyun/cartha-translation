id: PSA.79.2
reference: Psalms 79:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נָֽתְנ֡וּ אֶת נִבְלַ֬ת עֲבָדֶ֗י/ךָ מַ֭אֲכָל לְ/ע֣וֹף הַ/שָּׁמָ֑יִם בְּשַׂ֥ר חֲ֝סִידֶ֗י/ךָ לְ/חַיְת/וֹ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: fr
  text: Ils ont livré les cadavres de tes serviteurs en pâture aux oiseaux du ciel, la chair de tes fidèles[a] aux bêtes de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui te sont fidèles »; le terme hébreu désigne des personnes attachées à Dieu avec loyauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Ils ont livré
  rationale: Le qal accompli décrit l’acte hostile comme achevé. « Livrer » est naturel en français et rend ici l’idée de donner les corps à la merci des charognards.
- source_word: נִבְלַת עֲבָדֶיךָ
  choice: les cadavres de tes serviteurs
  rationale: נבלה désigne un cadavre, et עבד, dans l’adresse à Dieu propre aux Psaumes, se rend naturellement par « serviteur ».
- source_word: מַאֲכָל
  choice: en pâture
  rationale: Cette expression française idiomatique conserve l’image brutale de corps abandonnés pour servir de nourriture.
- source_word: לְעוֹף הַשָּׁמָיִם
  choice: aux oiseaux du ciel
  rationale: עוֹף est ici collectif et désigne les oiseaux; « du ciel » rend naturellement la tournure hébraïque.
- source_word: בְּשַׂר
  choice: la chair
  rationale: Le sens concret de « chair » préserve la force physique de l’image ainsi que le parallélisme avec « cadavres ».
- source_word: חֲסִידֶיךָ
  choice: tes fidèles
  rationale: Le terme désigne ceux qui sont attachés à Dieu dans une relation de loyauté; « fidèles » est clair, actuel et non technique.
- source_word: לְחַיְתוֹ אָרֶץ
  choice: aux bêtes de la terre
  rationale: חיה renvoie ici aux animaux, vraisemblablement sauvages et charognards. « Bêtes de la terre » conserve le registre poétique et le parallélisme cosmique avec les oiseaux du ciel.
theological_decisions:
- issue: Sens de חֲסִידֶיךָ comme désignation du peuple attaché à Dieu
  choice: tes fidèles
  alternative: tes saints; ceux qui te sont fidèles
  rationale: « Tes fidèles » exprime la loyauté et l’attachement envers Dieu sans réduire le terme à une sainteté rituelle ni lui imposer le sens ecclésiastique ultérieur de « saints ».
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme du vers hébreu est conservé, avec une imagerie volontairement crue mais sans formulation inutilement archaïque.
