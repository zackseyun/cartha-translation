source:
  edition: WLC
  text: אֵ֤לֶּה אֶזְכְּרָ֨ה וְ/אֶשְׁפְּכָ֬ה עָלַ֨/י נַפְשִׁ֗/י כִּ֤י אֶֽעֱבֹ֨ר בַּ/סָּךְ֮ אֶדַּדֵּ֗/ם עַד בֵּ֥ית אֱלֹ֫הִ֥ים בְּ/קוֹל רִנָּ֥ה וְ/תוֹדָ֗ה הָמ֥וֹן חוֹגֵֽג׀׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/004.yaml
  text: 'These things I remember[a], and I pour out my soul within me: how I used to pass along with the throng, leading them to the house of God with the sound of joyful shouting and thanksgiving[b], a festal multitude.'
translation:
  language: fr
  text: 'Je me souviens de ces choses, et mon âme s’épanche en moi : comment je m’avançais avec la foule[a], les conduisant[b] jusqu’à la maison de Dieu, au son des cris de joie et des actions de grâce d’une multitude en fête.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sein de la procession » au lieu de « avec la foule ». Le nom hébreu בַּסָּךְ est difficile et peut désigner la foule rassemblée pour la fête ou la compagnie qui avance en procession.
    reason: lexical_alternative
  - marker: b
    text: Ou « marchant avec eux » / « les guidant » au lieu de « les conduisant ». Le verbe hébreu אֶדַּדֵּם est rare et sa nuance exacte demeure incertaine, mais le contexte évoque clairement un déplacement collectif vers la maison de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה אֶזְכְּרָה
  choice: Je me souviens de ces choses
  rationale: Le démonstratif pluriel est conservé, et la forme verbale poétique reçoit ici une valeur présente de remémoration.
- source_word: וְאֶשְׁפְּכָה עָלַי נַפְשִׁי
  choice: et je répands mon âme au-dedans de moi
  rationale: L’expression décrit l’effusion intérieure de la détresse. « Mon âme » préserve le langage anthropologique du texte, tandis que « au-dedans de moi » rend naturellement l’hébreu littéral « sur moi ».
- source_word: כִּי אֶעֱבֹר
  choice: je marchais
  rationale: כִּי introduit ici le contenu du souvenir; l’imparfait français exprime naturellement une action habituelle du passé au sein d’une procession.
- source_word: בַּסָּךְ
  choice: avec la foule
  rationale: Ce nom difficile désigne vraisemblablement, dans ce contexte de pèlerinage, la foule ou la compagnie processionnelle plutôt qu’un abri matériel.
- source_word: אֶדַּדֵּם
  choice: les conduisant
  rationale: Le verbe rare comporte un suffixe de troisième personne du pluriel et semble évoquer le fait de mener ou d’accompagner le groupe; la traduction principale retient « conduire » tout en signalant l’incertitude.
- source_word: עַד בֵּית אֱלֹהִים
  choice: jusqu’à la maison de Dieu
  rationale: « Jusqu’à » rend explicitement la valeur directionnelle de עַד et conserve l’expression cultuelle « maison de Dieu ».
- source_word: בְּקוֹל רִנָּה וְתוֹדָה
  choice: au milieu des cris de joie et des actions de grâce
  rationale: La tournure française restitue l’ambiance sonore de la célébration; רִנָּה désigne des acclamations joyeuses et תוֹדָה l’action de grâce ou la louange reconnaissante.
- source_word: הָמוֹן חוֹגֵג
  choice: d’une multitude en fête
  rationale: Cette expression qualifie naturellement la foule comme une assemblée célébrant une fête de pèlerinage.
