  text: בְּ/רֶ֤צַח בְּֽ/עַצְמוֹתַ֗/י חֵרְפ֥וּ/נִי צוֹרְרָ֑/י בְּ/אָמְרָ֥/ם אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/010.yaml
  text: As with a shattering in my bones[a], my adversaries taunt me, saying to me all day long, “Where is your God?”
translation:
  language: fr
  text: 'Comme sous un coup qui brise mes os[a], mes adversaires m’insultent en me disant tout au long du jour : « Où est ton Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile. Elle peut évoquer littéralement « un meurtre dans mes os » ou une blessure meurtrière au plus profond de moi; elle peut aussi décrire une douleur intérieure qui brise ou broie.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח בְּעַצְמוֹתַי
  choice: Comme si l’on broyait mes os
  rationale: Le nom רֶצַח évoque normalement le meurtre ou une mise à mort, mais son association poétique avec « mes os » décrit ici une atteinte intérieure d’une extrême violence. Cette formulation française garde l’image corporelle et la force destructrice sans suggérer à tort un meurtre littéral.
- source_word: חֵרְפוּנִי
  choice: m’insultent
  rationale: Le verbe חרף exprime l’outrage, le mépris ou les railleries. « M’insultent » rend clairement l’agression verbale explicitée par la question qui suit.
- source_word: צוֹרְרָי
  choice: mes adversaires
  rationale: Le terme désigne ceux qui se montrent hostiles au psalmiste. « Adversaires » reste précis sans réduire nécessairement leur hostilité à un conflit militaire.
- source_word: בְּאָמְרָם אֵלַי
  choice: en me disant
  rationale: La construction introduit les paroles par lesquelles les adversaires insultent le psalmiste; la tournure française conserve à la fois le moyen et la circonstance.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette expression rend la durée et la répétition continues indiquées par l’hébreu, dans un registre naturel et digne.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Où est ton Dieu ?
  rationale: La question directe conserve toute la force provocatrice du défi sans y ajouter d’explication.
theological_decisions:
- issue: Le défi des adversaires concernant la présence ou l’aide de Dieu
  choice: « Où est ton Dieu ? »
  alternative: « Où donc est ton Dieu ? »
  rationale: La formulation simple préserve la raillerie et la tension de la lamentation, sans expliquer l’apparente absence de Dieu ni résoudre cette tension théologique.
- issue: La nature de la souffrance décrite dans les os
  choice: Une image de broiement intérieur
  alternative: Un meurtre ou une blessure mortelle dans les os
  rationale: Le contexte est métaphorique, mais l’expression hébraïque demeure difficile. Le texte principal communique une douleur écrasante, tandis que la note conserve le sens lexical plus littéral et l’ambiguïté de l’image.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « comme si l’on broyait mes os » conserve la violence de l’image tout en restant immédiatement compréhensible; « tout au long du jour » maintient le ton poétique sans archaïsme.
