  text: תְּהֽוֹם אֶל תְּה֣וֹם ק֭וֹרֵא לְ/ק֣וֹל צִנּוֹרֶ֑י/ךָ כָּֽל מִשְׁבָּרֶ֥י/ךָ וְ֝/גַלֶּ֗י/ךָ עָלַ֥/י עָבָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: fr
  text: L’abîme appelle l’abîme au grondement de tes cascades[a] ; tous tes brisants et tes vagues ont passé sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au bruit de tes torrents » ; le mot hébreu peut aussi désigner des conduits ou des cours d’eau impétueux.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: L’abîme ... l’abîme
  rationale: תְּהוֹם désigne les profondeurs, notamment les eaux profondes ou l’abîme. « L’abîme » conserve la densité poétique, la répétition et l’indétermination de l’image.
- source_word: קוֹרֵא
  choice: appelle
  rationale: Le participe est rendu par un présent vivant. « Appelle » reproduit directement la relation entre les deux abîmes sans préciser davantage la nature de cet appel.
- source_word: לְקוֹל
  choice: au grondement de
  rationale: קוֹל peut désigner la voix ou le bruit. Avec les eaux tumultueuses, « au grondement de » exprime naturellement en français le cadre sonore, tandis que la note signale une traduction plus formelle.
- source_word: צִנּוֹרֶיךָ
  choice: tes cascades
  rationale: צִנּוֹר peut désigner un conduit, un cours d’eau ou un flot impétueux. « Cascades » offre ici une image naturelle et accessible, cohérente avec le bruit et les eaux qui submergent.
- source_word: כָּל מִשְׁבָּרֶיךָ
  choice: tous tes brisants
  rationale: מִשְׁבָּר désigne les vagues qui se brisent ou les lames déferlantes. « Brisants » conserve l’image marine et la force totalisante de כָּל.
- source_word: וְגַלֶּיךָ
  choice: et tes vagues
  rationale: גַּל signifie couramment « vague ». Ce choix actuel et concret maintient le parallélisme avec « brisants ».
- source_word: עָלַי עָבָרוּ
  choice: ont passé sur moi
  rationale: Cette traduction suit de près le verbe עבר et la préposition עַל, en gardant l’image des eaux qui passent au-dessus du psalmiste sans ajouter explicitement l’idée de balayage.
theological_decisions: []
