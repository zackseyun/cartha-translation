source:
  edition: WLC
  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: fr
  text: 'Le jour, Yahweh ordonne son amour fidèle ; la nuit, son chant est avec moi : une prière au Dieu de ma vie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un chant pour lui est avec moi ». La forme hébraïque peut être comprise soit comme « son chant », soit comme « un chant pour lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹמָם
  choice: Le jour
  rationale: Complément adverbial de temps, mis en parallèle avec « la nuit ».
- source_word: יְצַוֶּה
  choice: ordonne
  rationale: 'Le piel de צוה garde ici sa force vive : Yahweh donne ordre à son amour fidèle d’agir.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד désigne un amour loyal, constant et engagé ; « amour fidèle » est naturel et conserve ces dimensions.
- source_word: וּבַלַּיְלָה
  choice: la nuit
  rationale: Expression temporelle parallèle à « Le jour » ; le point-virgule rend naturellement l’articulation poétique.
- source_word: שירה
  choice: son chant
  rationale: Le texte consonantique permet une analyse comme « son chant », lecture retenue en raison du parallélisme avec « son amour fidèle » ; une autre analyse reste possible et est signalée.
- source_word: עִמִּי
  choice: est avec moi
  rationale: L’ajout de la copule, absente en hébreu, est nécessaire en français et préserve l’idée de présence ou d’accompagnement.
- source_word: תְּפִלָּה
  choice: une prière
  rationale: Apposition qui caractérise le chant nocturne comme une prière.
- source_word: לְאֵל
  choice: au Dieu
  rationale: La préposition ל marque ici le destinataire de la prière.
- source_word: חַיָּי
  choice: de ma vie
  rationale: Le substantif avec suffixe de première personne signifie littéralement « ma vie » ; la construction génitivale est conservée.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; sa transcription le distingue d’un simple titre.
- issue: Sens de לְאֵל חַיָּי
  choice: au Dieu de ma vie
  alternative: au Dieu qui me donne la vie
  rationale: La formulation retenue préserve la construction hébraïque et n’assimile pas חַיָּי à l’expression distincte « Dieu vivant ».
- issue: Relation syntaxique entre יְצַוֶּה et חַסְדּוֹ
  choice: ordonne à son amour fidèle de m’accompagner
  alternative: déploie son amour fidèle
  rationale: La formulation française rend explicite l’action poétique confiée à l’amour fidèle sans réduire le verbe à une simple manifestation ; l’objet implicite « de m’accompagner » reste interprétatif et est signalé.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme temporel « Le jour… la nuit… » est conservé. L’explicitation « de m’accompagner » vise l’intelligibilité courante, tout en étant documentée en note afin de ne pas masquer la concision de l’hébreu.
