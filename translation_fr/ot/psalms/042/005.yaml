source:
  edition: WLC
  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: fr
  text: Pourquoi es-tu abattue, mon âme, et pourquoi t’agites-tu en moi ? Espère en Dieu, car je le louerai encore pour les délivrances qui viennent de sa présence[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les délivrances de sa face ». En hébreu, la « face » de Dieu peut désigner sa présence.'
    reason: Conserver l’image hébraïque et signaler l’ambiguïté de la construction finale.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: es-tu abattue
  rationale: Le verbe évoque le fait d’être courbé ou profondément accablé. « Abattue » exprime naturellement en français cet état intérieur tout en gardant l’image d’un être amené très bas.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Dans cette apostrophe à soi-même, « mon âme » conserve la force poétique et introspective de נֶפֶשׁ sans imposer une définition technique de la personne humaine.
- source_word: וַתֶּהֱמִי
  choice: t’agites-tu
  rationale: Le verbe désigne le tumulte, le grondement ou l’agitation. La forme pronominale rend clairement le bouleversement intérieur en français actuel.
- source_word: עָלָי
  choice: en moi
  rationale: L’expression signifie littéralement « sur moi », mais décrit ici l’agitation qui saisit intérieurement le psalmiste. « En moi » est idiomatique sans effacer le rapport personnel.
- source_word: הוֹחִילִי
  choice: Espère
  rationale: L’impératif appelle à attendre Dieu avec confiance. « Espère » réunit de manière concise l’attente et la confiance.
- source_word: לֵאלֹהִים
  choice: en Dieu
  rationale: Avec ce verbe, la préposition présente Dieu comme l’objet de l’espérance ; « espérer en Dieu » est la tournure française naturelle.
- source_word: עוֹד אוֹדֶנּוּ
  choice: je le louerai encore
  rationale: עוֹד oriente le regard vers une louange future malgré la détresse présente, et ידה au hiphil désigne ici l’action de louer ou célébrer Dieu.
- source_word: יְשׁוּעוֹת
  choice: les délivrances
  rationale: Le pluriel hébreu est conservé, puisqu’il peut évoquer les secours ou actes salvateurs de Dieu plutôt qu’une notion abstraite unique.
- source_word: פָּנָיו
  choice: sa présence
  rationale: Le mot signifie littéralement « sa face », mais la « face » de Dieu désigne fréquemment sa présence. « Sa présence » transmet cet idiome en français moderne, tandis que l’image littérale est signalée en note.
theological_decisions:
- issue: Interprétation de יְשׁוּעוֹת פָּנָיו à la fin du verset
  choice: les délivrances qui viennent de sa présence
  alternative: les délivrances de sa face
  rationale: Le texte fourni porte פָּנָיו, « sa face », et non פָּנַי וֵאלֹהָי, « mon visage et mon Dieu », forme présente dans d’autres reprises du refrain. La traduction suit donc cette leçon précise et comprend la face divine comme sa présence, sans importer la conclusion d’un refrain parallèle.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse du psalmiste à sa propre âme. La formulation finale privilégie la clarté tout en maintenant le pluriel hébreu et en documentant l’image littérale dans la note.
