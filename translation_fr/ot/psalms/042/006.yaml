base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/006.yaml
  text: My God[a], my soul is cast down within me; therefore I remember you from the land of the Jordan and the Hermons[d][c][b], from Mount Mizar.
translation:
  language: fr
  text: Mon Dieu, mon âme est abattue en moi ; c’est pourquoi je me souviens de toi[c] depuis la région du Jourdain et les Hermons[a], depuis le mont Mitséar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « les Hermons », au pluriel ; il peut s’agir du massif ou des sommets de l’Hermon.
    reason: lexical_alternative
  - marker: b
    text: « Mont Mitséar » est peut-être un nom de lieu ; on pourrait aussi comprendre « la petite montagne » ou « le petit mont ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je me souviendrai de toi ». L’imparfait hébreu peut exprimer une résolution présente ou une action future selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Le nom avec suffixe de première personne signifie « mon Dieu » et peut fonctionner ici comme une adresse directe, sans qu’il soit nécessaire d’ajouter une interjection.
- source_word: עָלַי נַפְשִׁי תִשְׁתּוֹחָח
  choice: mon âme est abattue au-dedans de moi
  rationale: Cette formulation conserve « mon âme » et l’image d’un être courbé ou abaissé, tout en exprimant naturellement en français l’état intérieur du psalmiste.
- source_word: עַל־כֵּן
  choice: c’est pourquoi
  rationale: Cette locution marque clairement le lien de conséquence sans donner au vers une tournure trop soutenue.
- source_word: אֶזְכָּרְךָ
  choice: je me souviens de toi
  rationale: L’imparfait hébreu peut décrire ici une action présente ou une résolution. Le présent convient au contexte, sans exclure entièrement une nuance prospective.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: depuis le pays du Jourdain
  rationale: « Pays du Jourdain » conserve la structure géographique de l’hébreu ; « depuis » indique naturellement le lieu d’où le psalmiste se souvient de Dieu.
- source_word: וְחֶרְמוֹנִים
  choice: et les Hermons
  rationale: Le pluriel inhabituel de l’hébreu est conservé afin de ne pas effacer une possible référence au massif ou aux sommets de l’Hermon.
- source_word: מֵהַר מִצְעָר
  choice: depuis le mont Mitséar
  rationale: Le terme est traité comme un nom de lieu, en parallèle avec les autres indications géographiques, tout en translittérant sa forme hébraïque.
