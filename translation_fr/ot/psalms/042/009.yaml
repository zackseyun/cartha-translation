  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: fr
  text: 'Je dis à Dieu, mon rocher : « Pourquoi m’as-tu oublié ? Pourquoi vais-je dans la tristesse, sous l’oppression de l’ennemi ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pourquoi vais-je dans l’obscurité, sous l’oppression de l’ennemi ? »'
    reason: Le mot hébreu traduit par « dans la tristesse » peut aussi décrire un état sombre ou assombri.
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Je dis
  rationale: Le cohortatif qal à la première personne peut exprimer une résolution (« je dirai ») ou introduire la parole présente. Ici, « Je dis » introduit naturellement l’adresse directe à Dieu.
- source_word: לְאֵל
  choice: à Dieu
  rationale: אֵל est ici le titre commun désignant Dieu, non un nom propre.
- source_word: סַלְעִי
  choice: mon rocher
  rationale: Cette traduction conserve l’image poétique de Dieu comme appui solide et refuge, sans l’interpréter à la place du lecteur.
- source_word: שְׁכַחְתָּנִי
  choice: m’as-tu oublié
  rationale: 'Le parfait avec suffixe objet exprime naturellement une situation ressentie comme présente : le psalmiste se plaint d’avoir été oublié, sans renforcer le verbe en « abandonné ».'
- source_word: קֹדֵר
  choice: dans la tristesse
  rationale: Le participe peut évoquer l’assombrissement, la morosité ou le deuil. « Dans la tristesse » rend clairement l’état du psalmiste tout en laissant en note l’autre nuance possible.
- source_word: אֵלֵךְ
  choice: dois-je marcher
  rationale: הלך signifie aller ou marcher. Dans la question de lamentation, « dois-je marcher » exprime idiomatiquement la condition qui se prolonge, sans faire de la contrainte une affirmation indépendante.
- source_word: בְּלַחַץ
  choice: sous l’oppression de
  rationale: לַחַץ désigne la pression ou l’oppression. La préposition בְּ présente ici la situation accablante dans laquelle marche le psalmiste.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier poétique peut être générique ou collectif. « L’ennemi » convient au langage français de la lamentation.
theological_decisions:
- issue: Titre métaphorique divin סַלְעִי
  choice: mon rocher
  alternative: mon roc ; mon refuge
  rationale: La métaphore concrète est conservée au lieu d’être remplacée par son interprétation, afin de maintenir l’image de stabilité et de protection.
- issue: Plainte selon laquelle Dieu aurait oublié le psalmiste
  choice: Pourquoi m’as-tu oublié ?
  alternative: Pourquoi m’as-tu délaissé ?
  rationale: La plainte est rendue sans l’atténuer pour des motifs doctrinaux. « Oublié » reste fidèle au verbe et préserve la tension propre à la lamentation croyante.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme interrogatif et la métaphore du rocher sont conservés. La note maintient l’ambiguïté lexicale de קֹדֵר.
