  text: כְּ/אַיָּ֗ל תַּעֲרֹ֥ג עַל אֲפִֽיקֵי מָ֑יִם כֵּ֤ן נַפְשִׁ֨/י תַעֲרֹ֖ג אֵלֶ֣י/ךָ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/001.yaml
  text: As a deer longs for streams of water[a], so my soul longs for you[c][b], O God.
translation:
  language: fr
  text: Comme un cerf soupire après des cours d’eau[a][b], ainsi mon âme[c] soupire après toi, ô Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « halète après »; le verbe hébreu peut évoquer un désir intense, semblable à celui que provoque la soif.
    reason: lexical_alternative
  - marker: b
    text: Ou « chenaux d’eau » ou « lits de cours d’eau »; l’hébreu peut désigner des cours d’eau, des chenaux ou leurs lits.
    reason: lexical_alternative
  - marker: c
    text: « Mon âme » peut aussi se comprendre comme « ma vie », « tout mon être » ou « moi-même ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Comme un cerf
  rationale: אַיָּל peut désigner un cervidé mâle. « Un cerf » est naturel en français et conserve l’image concrète ainsi que la comparaison marquée par כְּ.
- source_word: תַּעֲרֹג
  choice: soupire après
  rationale: Le verbe ערג exprime une aspiration intense, liée ici à la soif. « Soupirer après » garde la force poétique et convient aux deux membres du parallèle sans réduire l’image au seul halètement physique.
- source_word: עַל
  choice: après
  rationale: Avec « soupirer », la locution française idiomatique « soupirer après » exprime le désir intense visé par la préposition dans ce contexte.
- source_word: אֲפִיקֵי מָיִם
  choice: les cours d’eau
  rationale: אֲפִיקִים désigne des chenaux, lits ou cours d’eau. « Cours d’eau » est clair, actuel et conserve le pluriel, tout en laissant ouverte la nature précise de ces eaux.
- source_word: כֵּן
  choice: ainsi
  rationale: « Ainsi » marque clairement et dignement le second terme de la comparaison.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » convient au registre poétique et dévotionnel, sans imposer à lui seul une anthropologie dualiste; la note signale l’ampleur sémantique.
- source_word: אֵלֶיךָ
  choice: après toi
  rationale: La préposition indique l’orientation vers Dieu. Avec « soupirer après », cette formulation est idiomatique et exprime le désir relationnel du texte hébreu.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le contexte est celui d’une adresse directe. « Ô Dieu » rend explicitement le vocatif dans un français poétique digne.
theological_decisions:
- issue: Portée anthropologique de נַפְשִׁי
  choice: mon âme
  alternative: ma vie; tout mon être; moi-même
  rationale: Le terme hébreu peut renvoyer à la personne vivante tout entière et ne requiert pas une séparation doctrinale stricte entre corps et âme. Le rendu traditionnel et poétique « mon âme » est conservé, avec une note qui préserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé par la répétition de « soupire après ». « Ô Dieu » marque l’adresse directe sans archaïsme excessif.
