source:
  edition: WLC
  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: fr
  text: Mon âme a soif de Dieu, du Dieu vivant. Quand viendrai-je me présenter devant Dieu[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la face de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: a soif
  rationale: Le verbe exprime concrètement la soif. Le présent français rend naturellement l’état durable décrit dans ce contexte poétique, sans affaiblir la métaphore par « désire ardemment ».
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner la personne, la vie ou l’être intérieur. « Mon âme » conserve ici l’image poétique hébraïque et reste naturel dans un psaume.
- source_word: לֵאלֹהִים
  choice: de Dieu
  rationale: Avec « avoir soif », le français emploie naturellement « de » pour indiquer l’objet du désir.
- source_word: לְאֵל חָי
  choice: du Dieu vivant
  rationale: La formule qualifie le Dieu déjà nommé. L’article défini et la reprise par « du » donnent en français une apposition claire et naturelle.
- source_word: מָתַי
  choice: Quand
  rationale: L’interrogatif demande à quel moment l’attente prendra fin. « Quand » en restitue directement le sens sans ajouter explicitement l’idée de durée.
- source_word: אָבוֹא
  choice: viendrai-je
  rationale: Dans cette question, l’imparfait hébreu porte sur une venue attendue. Le futur français convient naturellement.
- source_word: וְאֵרָאֶה
  choice: me présenter
  rationale: La forme niphal de ראה peut signifier « paraître » ou « être vu ». Dans le langage de la venue au sanctuaire, « me présenter » exprime idiomatiquement l’action de paraître en présence de Dieu.
- source_word: פְּנֵי אֱלֹהִים
  choice: devant Dieu
  rationale: Littéralement « la face de Dieu », l’expression signifie ici se tenir en sa présence. « Devant Dieu » en communique le sens en français courant, tandis que la formulation littérale est signalée en note.
theological_decisions:
- issue: Sens de l’expression פְּנֵי אֱלֹהִים
  choice: devant Dieu
  alternative: la face de Dieu / devant la face de Dieu
  rationale: Le verset exprime l’aspiration à accéder à la présence de Dieu, probablement dans le cadre du culte. « Devant Dieu » préserve cette portée sans imposer l’idée d’une vision physique de l’essence divine; la note conserve la transparence sur l’image hébraïque.
- issue: Valeur de וְאֵרָאֶה
  choice: me présenter
  alternative: être vu / voir
  rationale: La vocalisation massorétique indique un niphal, qui favorise « paraître » ou « être vu » plutôt que « voir ». « Me présenter » rend ce sens dans un français naturel tout en maintenant le cadre d’une comparution devant Dieu.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve la métaphore concrète de la soif et l’expression traditionnelle « mon âme », tout en rendant idiomatiquement le langage de la présence cultuelle.
