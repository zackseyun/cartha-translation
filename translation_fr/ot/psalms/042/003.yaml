  text: הָֽיְתָה לִּ֬/י דִמְעָתִ֣/י לֶ֭חֶם יוֹמָ֣ם וָ/לָ֑יְלָה בֶּ/אֱמֹ֥ר אֵלַ֥/י כָּל הַ֝/יּ֗וֹם אַיֵּ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/003.yaml
  text: My tears have been my bread day and night[a], while they say to me all day long, “Where is your God?”
translation:
  language: fr
  text: 'Mes larmes ont été mon pain jour et nuit[a], tandis qu’on me dit tout au long du jour : « Où est ton Dieu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ma larme a été mon pain », le singulier hébreu pouvant avoir un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: sont devenues mon
  rationale: La construction היה + ל indique ce qu’une chose est devenue ou représente pour quelqu’un. « Sont devenues mon » restitue naturellement en français cette nuance résultative et prépare l’image du pain.
- source_word: דִמְעָתִי
  choice: mes larmes
  rationale: Bien que le nom hébreu soit morphologiquement au singulier, il peut avoir ici une valeur collective. Le pluriel français exprime naturellement les pleurs répétés du psalmiste.
- source_word: לֶחֶם
  choice: pain
  rationale: Le terme concret « pain » conserve la métaphore frappante des larmes tenant lieu de nourriture.
- source_word: יוֹמָם וָלָיְלָה
  choice: jour et nuit
  rationale: Cette expression forme un mérisme indiquant la continuité. « Jour et nuit » est fidèle, concis et idiomatique.
- source_word: בֶּאֱמֹר
  choice: tandis qu’on me dit
  rationale: La préposition avec l’infinitif construit indique une action concomitante. « Tandis que » fait entendre que la raillerie accompagne les pleurs continuels; le sujet impersonnel « on » convient au sujet non exprimé en hébreu.
- source_word: אֵלַי
  choice: me
  rationale: Le pronom complément dans « on me dit » rend naturellement en français la direction de la parole vers le psalmiste.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: L’expression souligne la répétition ou la continuité au cours de la journée. « Tout le jour » garde la dignité poétique du psaume sans être obscur.
- source_word: אַיֵּה
  choice: Où est
  rationale: L’interrogatif introduit une question directe et mordante sur la présence ou l’intervention de Dieu.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Le suffixe est masculin singulier. La majuscule à « Dieu » convient puisque les adversaires parlent du Dieu reconnu par le psalmiste.
theological_decisions:
- issue: Nature de la question des railleurs
  choice: « Où est ton Dieu ? »
  alternative: « Qu’est devenu ton Dieu ? »
  rationale: La formulation directe conserve la tension liée à l’apparente absence de Dieu, sans expliciter ni résoudre ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, poétique et digne. La structure imagée est conservée; « tout le jour » maintient une tonalité psalmique compréhensible.
