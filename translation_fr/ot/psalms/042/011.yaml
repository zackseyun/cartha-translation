  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: fr
  text: 'Pourquoi es-tu abattue, mon âme, et pourquoi t’agites-tu en moi ? Espère en Dieu, car je le louerai encore : il est le secours de mon visage[a] et mon Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les saluts de mon visage ». Cette expression hébraïque dense peut aussi être comprise comme « celui qui relève mon visage » ; une autre formulation traditionnelle est « le salut de mon visage ».'
    reason: La note conserve le pluriel et l’image littéraux de l’hébreu tout en signalant, sans trancher, les principales façons idiomatiques de comprendre l’expression.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: es-tu abattue
  rationale: Le verbe évoque le fait d’être courbé ou accablé. « Abattue » est naturel en français et conserve l’image d’un être intérieur abaissé.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Dans cette adresse à soi-même, « mon âme » garde la force poétique et introspective de נֶפֶשׁ.
- source_word: תֶּהֱמִי עָלָי
  choice: t’agites-tu au-dedans de moi
  rationale: Le verbe exprime le tumulte ou l’agitation; עָלַי est rendu idiomatiquement par « au-dedans de moi » dans ce contexte intérieur.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Attends Dieu avec espérance
  rationale: Le verbe יחל associe l’attente à l’espérance confiante. Cette formulation conserve ces deux nuances, avec Dieu comme objet de l’attente.
- source_word: אוֹדֶנּוּ
  choice: je le louerai encore
  rationale: Le hifil de ידה désigne ici la louange; עוֹד exprime la confiance en une louange future malgré la détresse présente.
- source_word: יְשׁוּעֹת פָּנַי
  choice: le salut de mon visage
  rationale: La formulation garde l’image hébraïque compacte et son ambiguïté poétique, tout en indiquant en note une compréhension française plus idiomatique.
- source_word: וֵאלֹהָי
  choice: et mon Dieu
  rationale: La traduction conserve la coordination hébraïque et la confession personnelle qui clôt le verset.
theological_decisions:
- issue: Interprétation de יְשׁוּעֹת פָּנַי
  choice: le salut de mon visage
  alternative: celui qui relève mon visage ; le secours de mon visage
  rationale: L’hébreu est dense et littéralement au pluriel (« les saluts de mon visage »). Le texte principal préserve l’image selon laquelle le salut divin transforme le visage abattu, sans imposer une seule explication; la note donne des formulations interprétatives possibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le féminin grammatical dans « abattue » et « agitée » s’accorde avec « âme ». La répétition intérieure et le contraste entre abattement présent et louange future sont conservés.
