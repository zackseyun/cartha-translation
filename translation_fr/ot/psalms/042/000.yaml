lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne conventionnellement le responsable de l’exécution musicale. « Au chef de chœur » est naturel et concis, tout en laissant ouverte la nuance de la préposition hébraïque.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le sens précis de ce terme technique des titres de psaumes demeure incertain. Sa translittération évite d’imposer une interprétation telle que « méditation » ou « cantique didactique ».
- source_word: לִבְנֵי
  choice: des fils de
  rationale: Dans un titre, la préposition hébraïque peut signaler l’auteur, l’appartenance, l’association ou les interprètes destinataires. « Des fils de » conserve une formulation traditionnelle suffisamment large, avec une note explicitant l’ambiguïté.
- source_word: קֹרַח
  choice: Coré
  rationale: « Coré » est la forme française biblique usuelle du nom propre hébreu קֹרַח.
