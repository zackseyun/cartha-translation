revisions:
- from: Heureux l’homme qui fait grâce et qui prête ! Il règle ses affaires avec justice.[a]
  to: Heureux l’homme qui se montre bienveillant et qui prête ; il conduit ses affaires avec justice.[a]
  rationale: La révision évite l’acception française habituelle de pardon attachée à « faire grâce », améliore l’idiomaticité de la seconde proposition et reformule la note afin de préserver sans surinterprétation l’ambiguïté lexicale de l’hébreu.
  reviewer_model: gpt-5.6-terra
