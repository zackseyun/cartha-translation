  text: Good is the man who is gracious and lends[a]; he conducts his affairs with justice.
translation:
  language: fr
  text: Heureux l’homme qui se montre bienveillant et qui prête ; il conduit ses affaires avec justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : « il mesure ses paroles avec discernement ». Le terme hébreu traduit par « affaires » peut aussi désigner des « paroles », et le verbe peut alors évoquer le fait de mesurer ou de régler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Heureux
  rationale: En tête de phrase, l’adjectif exprime ici la condition favorable de l’homme décrit. « Heureux » rend naturellement en français cette nuance proche d’une béatitude sans réduire le terme à une simple qualité morale.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le nom hébreu est au masculin singulier et présente une figure représentative. « L’homme » conserve cette forme tout en gardant une portée générale.
- source_word: חוֹנֵן
  choice: fait grâce
  rationale: Le participe désigne celui qui accorde faveur ou grâce. « Fait grâce » conserve cette valeur plus large que la seule générosité matérielle.
- source_word: וּמַלְוֶה
  choice: et qui prête
  rationale: Le participe hiphil de לוה désigne directement l’action de prêter, sans préciser ici les conditions du prêt.
- source_word: יְכַלְכֵּל
  choice: il règle
  rationale: Avec « ses affaires » comme complément, le verbe exprime l’idée de gérer ou de conduire. « Règle » est naturel et s’accorde bien avec la notion de justice.
- source_word: דְּבָרָיו
  choice: ses affaires
  rationale: דברים peut désigner des paroles, des choses ou des affaires. Dans le contexte du prêt et de la conduite juste, « ses affaires » est le sens contextuel le plus naturel, tandis que l’autre lecture est conservée en note.
- source_word: בְּמִשְׁפָּט
  choice: avec justice
  rationale: Cette formulation conserve la force éthique et juridique de מִשְׁפָּט sans l’affaiblir en simple équité pratique.
