source:
  edition: WLC
  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: fr
  text: Il ne craint pas les mauvaises nouvelles[a] ; son cœur est ferme[b], confiant en Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une mauvaise nouvelle » ou « un mauvais rapport ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « affermi » ou « solidement établi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: les mauvaises nouvelles
  rationale: L’expression désigne une information défavorable ou alarmante. « Les mauvaises nouvelles » est naturel en français moderne et rend ici la valeur générique de l’hébreu.
- source_word: לֹא יִירָא
  choice: Il ne craint pas
  rationale: Dans ce psaume sapientiel, l’imparfait décrit une attitude habituelle. Le présent de vérité générale est le plus idiomatique en français.
- source_word: נָכוֹן
  choice: ferme
  rationale: Le terme présente le cœur comme solidement établi et stable. « Ferme » conserve cette image sans ajouter une nuance étrangère.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: « Cœur » rend directement le siège intérieur de la volonté, de la pensée et de la disposition.
- source_word: בָּטֻחַ
  choice: confiant
  rationale: Cette forme décrit un état d’assurance fondé sur Yahweh. « Confiant » s’accorde naturellement avec le complément introduit par « en ».
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition marque celui en qui la confiance est placée, et le nom divin est rendu par « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom propre.
- issue: Rapport entre la fermeté du cœur et la confiance
  choice: 'Deux descriptions juxtaposées : « son cœur est ferme, confiant en Yahweh »'
  alternative: 'Lien causal explicite : « son cœur est ferme parce qu’il se confie en Yahweh »'
  rationale: L’hébreu juxtapose נָכוֹן et בָּטֻחַ sans conjonction causale explicite. La traduction conserve cette relation ouverte sans imposer une causalité grammaticale.
translation_notes:
  register: Français moderne, sobre et poétique. Le présent exprime le comportement caractéristique décrit par le psaume ; le point-virgule maintient le parallélisme entre l’absence de crainte et la stabilité intérieure.
