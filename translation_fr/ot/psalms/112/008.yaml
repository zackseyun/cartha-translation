source:
  edition: WLC
  text: סָמ֣וּךְ לִ֭בּ/וֹ לֹ֣א יִירָ֑א עַ֖ד אֲשֶׁר יִרְאֶ֣ה בְ/צָרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/008.yaml
  text: His heart is steadfast[b][a]; he will not fear until he looks on his adversaries.
translation:
  language: fr
  text: Son cœur est ferme ; il n’aura pas peur jusqu’à ce qu’il voie ses adversaires.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à ce qu’il voie ses adversaires ». Dans ce contexte, l’expression peut évoquer le fait d’être témoin de leur sort, sans préciser explicitement ce qui leur arrive.'
    reason: ambiguity_and_idiom
lexical_decisions:
- source_word: סָמוּךְ
  choice: ferme
  rationale: Le participe passif évoque ce qui est soutenu, solidement établi. Appliqué au cœur, « ferme » exprime naturellement la stabilité intérieure sans développer la métaphore.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Dans la poésie sapientiale, le cœur désigne largement l’être intérieur, notamment la pensée et la résolution ; « cœur » conserve cette image biblique familière.
- source_word: לֹא יִירָא
  choice: il n’aura pas peur
  rationale: L’imparfait peut avoir une valeur future ou durative. Cette formulation exprime ici une confiance qui persiste face à l’hostilité.
- source_word: עַד אֲשֶׁר
  choice: et finira par
  rationale: Littéralement « jusqu’à ce que ». En français, une traduction strictement temporelle pourrait laisser entendre que la peur commence dès qu’il aperçoit ses adversaires. « Et finira par » rend l’aboutissement attendu sans ce contresens pragmatique.
- source_word: יִרְאֶה בְצָרָיו
  choice: voir ses adversaires vaincus
  rationale: L’expression signifie littéralement voir ou porter le regard sur ses adversaires, mais, dans ce contexte, elle évoque la constatation de leur défaite ou de la victoire remportée sur eux. « Vaincus » explicite cette implication contextuelle, signalée en note.
- source_word: בְצָרָיו
  choice: ses adversaires
  rationale: צַר désigne un ennemi, un adversaire ou un opposant hostile. « Adversaires » conserve cette portée assez large dans un registre poétique digne.
theological_decisions:
- issue: Nature du regard porté sur les adversaires
  choice: « voir ses adversaires vaincus »
  alternative: « voir ses adversaires »
  rationale: La formulation littérale est ambiguë et risque de suggérer que l’assurance cesse au moment de la rencontre. Le contexte du psaume présente plutôt l’aboutissement de la confiance du juste dans la constatation du sort de ses adversaires. La note conserve toutefois la forme exacte de l’hébreu.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme reste concis. « Ferme » évite un tour lourd, tandis que « finira par » rend l’orientation vers l’issue attendue sans donner à « jusqu’à ce que » un sens trompeur en français.
