  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: fr
  text: Biens et richesses sont dans sa maison, et sa justice subsiste pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa droiture demeure pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: biens
  rationale: הוֹן désigne les ressources, les possessions ou la fortune. « Biens » garde la dimension concrète et permet de distinguer le terme de עֹשֶׁר.
- source_word: וָעֹשֶׁר
  choice: et richesses
  rationale: עֹשֶׁר exprime la richesse ou l’abondance. « Richesses » forme avec « biens » un binôme poétique naturel sans confondre les deux noms hébreux.
- source_word: בְּבֵיתוֹ
  choice: sont dans sa maison
  rationale: בַּיִת peut désigner la maison ou la maisonnée. « Dans sa maison » conserve l’image concrète de l’hébreu tout en laissant entendre la sphère domestique.
- source_word: וְצִדְקָתוֹ
  choice: et sa justice
  rationale: צְדָקָה couvre les notions de justice, de droiture et de conduite conforme au bien. « Justice » est naturel en français biblique moderne et préserve la portée éthique du terme; « droiture » demeure une autre traduction possible.
- source_word: עֹמֶדֶת
  choice: subsiste
  rationale: Le participe de עמד évoque ce qui se tient et demeure. « Subsiste » rend naturellement en français l’idée de stabilité durable sans perdre la métaphore de permanence.
- source_word: לָעַד
  choice: pour toujours
  rationale: לָעַד exprime une continuité durable. « Pour toujours » en est l’équivalent français courant et digne.
theological_decisions:
- issue: Sens de « sa justice » dans un contexte de bénédiction matérielle
  choice: Le possessif renvoie directement à la justice ou à la conduite droite de l’homme décrit dans le psaume, sans préciser davantage sa nature.
  alternative: Comprendre le terme comme sa droiture, sa générosité durable, ou plus largement comme sa justification par Dieu.
  rationale: Le sujet immédiat est l’homme qui craint le SEIGNEUR. La traduction conserve donc le possessif et l’ambivalence sémantique de צְדָקָה, sans introduire une doctrine technique absente du verset.
translation_notes:
  register: Français international moderne, sobre et poétique. Le binôme « biens et richesses » reproduit le parallélisme lexical; « subsiste pour toujours » exprime idiomatiquement la permanence. Le marqueur de note est placé après l’énoncé auquel il se rapporte.
