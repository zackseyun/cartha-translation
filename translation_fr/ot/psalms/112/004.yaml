  text: זָ֘רַ֤ח בַּ/חֹ֣שֶׁךְ א֭וֹר לַ/יְשָׁרִ֑ים חַנּ֖וּן וְ/רַח֣וּם וְ/צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: fr
  text: Dans les ténèbres, une lumière se lève pour ceux qui sont droits[a] ; il est plein de grâce, compatissant et juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible : les trois qualificatifs peuvent se rapporter à la lumière. Les deux premiers, « plein de grâce » et « compatissant », font écho au caractère de l’Éternel en Psaume 111.4.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרַח
  choice: se lève
  rationale: Avec « lumière » pour sujet, « se lève » rend naturellement l’image du surgissement de la lumière et convient à la valeur poétique de l’accompli hébreu, ici exprimée comme une vérité caractéristique.
- source_word: בַּחֹשֶׁךְ
  choice: dans les ténèbres
  rationale: Cette formulation rend la préposition et l’article, tout en conservant la portée à la fois concrète et métaphorique de l’expression.
- source_word: אוֹר
  choice: une lumière
  rationale: « Une lumière » est idiomatique en français comme sujet de « se lève » et ne surdétermine pas l’absence d’article en hébreu.
- source_word: לַיְשָׁרִים
  choice: pour les hommes droits
  rationale: « Hommes droits » désigne clairement des personnes moralement intègres et maintient la distinction lexicale avec צַדִּיק, rendu plus loin par « juste ».
- source_word: חַנּוּן
  choice: il fait grâce
  rationale: La tournure verbale française exprime naturellement une disposition active à accorder faveur et bienveillance, sans la confondre avec la compassion du terme suivant.
- source_word: רַחוּם
  choice: compatissant
  rationale: « Compatissant » rend la sensibilité à la détresse d’autrui et demeure distinct de חַנּוּן.
- source_word: צַדִּיק
  choice: juste
  rationale: « Juste » exprime ici la droiture morale et convient à la série de qualités, tout en évitant le français moins naturel « droit » répété après יְשָׁרִים.
theological_decisions:
- issue: Référent des trois adjectifs finaux חַנּוּן וְרַחוּם וְצַדִּיק
  choice: Le texte principal les rapporte à l’homme juste décrit au singulier dans le psaume, en explicitant le sujet par « il ».
  alternative: Ils peuvent qualifier la lumière ou faire écho au caractère de l’Éternel décrit en Psaume 111.4.
  rationale: Les adjectifs sont au singulier tandis que « les hommes droits » est au pluriel. Le contexte immédiat présente néanmoins au singulier l’homme qui craint l’Éternel, ce qui soutient « il ». L’écho manifeste à Psaume 111.4 demeure théologiquement significatif et est conservé dans la note plutôt que tranché.
translation_notes:
  register: Français international moderne, poétique et digne. L’ordre initial « Dans les ténèbres » met en relief le contraste du vers hébreu. Le point-virgule préserve la tension entre les deux propositions sans imposer une identification trop forte.
