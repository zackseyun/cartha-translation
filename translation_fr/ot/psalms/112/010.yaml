source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: fr
  text: Le méchant le verra et s’irritera[a] ; il grincera des dents et fondra. Le désir des méchants disparaîtra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en éprouvera du dépit ».'
    reason: Alternative lexicale pour כעס, qui peut exprimer la colère, l’irritation ou le dépit provoqué par ce que le méchant voit.
lexical_decisions:
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le substantif adjectival masculin singulier désigne ici un individu représentatif. « Le méchant » conserve le singulier et la portée générique sans ajouter le mot « homme », absent de l’hébreu.
- source_word: יִרְאֶה
  choice: le verra
  rationale: 'L’imparfait qal à la 3e personne du masculin singulier a ici une valeur future : le méchant verra ce qui vient d’être décrit au sujet du juste. Le pronom objet « le » rend naturellement en français l’objet implicite fourni par le contexte.'
- source_word: וְכָעָס
  choice: et s’irritera
  rationale: Le parfait qal coordonné poursuit la séquence poétique. « S’irriter » exprime la colère contrariée de manière naturelle et digne.
- source_word: שִׁנָּיו יַחֲרֹק
  choice: il grincera des dents
  rationale: Cette expression française conserve l’image hébraïque et son sens de rage ou de frustration.
- source_word: וְנָמָס
  choice: et dépérira
  rationale: La forme évoque le fait de fondre, se dissoudre ou se consumer. « Dépérira » exprime naturellement en français l’anéantissement progressif sans imposer une image physique maladroite.
- source_word: תַּאֲוַת
  choice: le désir
  rationale: Le nom à l’état construit désigne le désir ou l’aspiration ; « désir » reste large et respecte la portée morale du verset.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé est rendu par une expression française générique et naturelle, tout en préservant le pluriel.
- source_word: תֹּאבֵד
  choice: disparaîtra
  rationale: L’imparfait qal féminin singulier s’accorde avec « désir » et annonce son échec complet. « Disparaîtra » rend אבד sans suggérer que le désir serait personnellement détruit par un agent explicite.
theological_decisions:
- issue: Portée anthropologique du singulier masculin רָשָׁע
  choice: le méchant
  alternative: une personne méchante / les méchants
  rationale: L’hébreu emploie un masculin singulier représentatif. « Le méchant » en respecte la forme grammaticale tout en gardant une portée générique, sans ajouter « homme » au texte.
- issue: Nature de la disparition exprimée par וְנָמָס
  choice: dépérira
  alternative: fondra / se consumera
  rationale: Le terme garde une image de dissolution ou de dépérissement. La traduction ne précise pas s’il s’agit d’un effondrement intérieur, d’un déclin ou d’une disparition finale.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et les trois futurs sont conservés ; la ponctuation distingue la réaction du méchant de l’issue réservée au désir collectif des méchants.
