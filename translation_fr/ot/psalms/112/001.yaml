id: PSA.112.1
reference: Psalms 112:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ אַשְׁרֵי אִ֭ישׁ יָרֵ֣א אֶת יְהוָ֑ה בְּ֝/מִצְוֺתָ֗י/ו חָפֵ֥ץ מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: fr
  text: 'Louez Yah ![a]

    Heureux l’homme[b] qui craint Yahweh

    et qui prend grand plaisir à ses commandements !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la forme traditionnelle : « Alléluia ! »'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « l’homme »; dans cette maxime de sagesse, le masculin singulier a une portée générique.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel הַלְלוּ est traduit directement par « Louez », et la forme courte du nom divin יָהּ par « Yah ». Cette formulation conserve les deux éléments de l’hébreu, contrairement à la simple translittération traditionnelle « Alléluia ».
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Dans cette formule sapientielle, אַשְׁרֵי proclame la condition enviable et florissante de la personne décrite. « Heureux » est la formule naturelle et traditionnelle des béatitudes en français, sans réduire le propos à une émotion passagère.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le nom hébreu est masculin singulier et représente ici, selon l’usage sapientiel, tout être humain correspondant à cette description. « L’homme » préserve cette forme représentative; une note explicite sa portée générique.
- source_word: יָרֵא אֶת־יְהוָה
  choice: qui craint Yahweh
  rationale: « Craint » conserve le sens premier de יָרֵא ainsi que la tension biblique entre crainte, respect et révérence, sans l’aplanir en simple estime. Le nom יהוה est rendu par « Yahweh ».
- source_word: בְּמִצְוֺתָיו
  choice: à ses commandements
  rationale: « Commandements » restitue le poids normatif de מִצְוֺתָיו. Avec « prendre plaisir », la préposition française « à » exprime naturellement l’objet du plaisir; le possessif renvoie à Yahweh.
- source_word: חָפֵץ מְאֹד
  choice: prend grand plaisir
  rationale: חָפֵץ exprime le plaisir et le désir, tandis que מְאֹד l’intensifie. « Prend grand plaisir » rend les deux éléments dans un français courant et digne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, distinct de la forme courte יָהּ au début du verset. « Yahweh » conserve le nom personnel et permet de maintenir cette distinction, plutôt que de lui substituer un titre.
- issue: Portée du masculin singulier אִישׁ
  choice: l’homme, avec une note signalant l’emploi générique
  alternative: la personne
  rationale: Le masculin singulier appartient à la formulation représentative typique de la littérature de sagesse. Le conserver maintient la forme du texte, tandis que la note empêche de comprendre à tort que la déclaration exclurait les femmes.
- issue: Sens de la crainte exprimée par יָרֵא
  choice: craint
  alternative: révère
  rationale: « Craint » préserve la force et la tension théologiques du terme hébreu, qui comprend la révérence sans se réduire à elle. « Révère » expliciterait une nuance au prix de l’idée de crainte.
translation_notes:
  register: Français international moderne, clair et soutenu. La disposition en trois lignes reflète les unités poétiques du verset. « Heureux » reprend le registre sapientiel et la formulation française des béatitudes; « prend grand plaisir » reste naturel tout en conservant l’intensité de מְאֹד.
