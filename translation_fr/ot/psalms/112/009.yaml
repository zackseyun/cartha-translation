id: PSA.112.9
reference: Psalms 112:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: fr
  text: Il a fait des largesses, il a donné aux pauvres. Sa justice[a] subsiste pour toujours ; sa corne[b] s’élèvera avec honneur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ». Le terme hébreu peut désigner la justice, la droiture ou la conduite juste.
    reason: lexical_alternative
  - marker: b
    text: Dans la poésie hébraïque, la « corne » symbolise la force, la dignité ou un rang élevé.
    reason: cultural_note
  - marker: c
    text: Ou « sera exaltée dans la gloire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: a largement distribué
  rationale: Le verbe évoque l’action de disperser ou de répandre. Dans ce contexte de générosité, « largement distribué » exprime naturellement l’idée d’un don prodigué sans effacer entièrement l’image de dispersion.
- source_word: נָתַן
  choice: a donné
  rationale: Traduction directe de l’accompli, maintenue à côté de « a largement distribué » afin de préserver le parallélisme poétique.
- source_word: לָאֶבְיוֹנִים
  choice: aux pauvres
  rationale: אֶבְיוֹן désigne les pauvres ou les nécessiteux. « Aux pauvres » est concis, naturel et fidèle au contexte.
- source_word: צִדְקָתוֹ
  choice: sa justice
  rationale: צְדָקָה peut exprimer la justice, la droiture ou la conduite juste. En français biblique moderne, « justice » conserve ici sa portée morale et théologique sans réduire le terme à la seule charité.
- source_word: עֹמֶדֶת לָעַד
  choice: subsiste pour toujours
  rationale: Le participe עֹמֶדֶת associé à לָעַד exprime une permanence durable. « Subsiste pour toujours » est naturel en français et garde l’idée de ce qui demeure fermement.
- source_word: קַרְנוֹ
  choice: sa corne
  rationale: La corne est une métaphore hébraïque de la force, de la dignité ou du rang élevé. L’image source est conservée dans le texte et explicitée en note.
- source_word: תָּרוּם
  choice: s’élèvera
  rationale: Le verbe רום exprime l’élévation ou l’exaltation. « S’élèvera » convient à l’image de la corne et préserve l’ambiguïté entre mouvement figuré et exaltation de statut.
- source_word: בְּכָבוֹד
  choice: avec honneur
  rationale: כָּבוֹד peut signifier honneur ou gloire. « Avec honneur » rend clairement la dignité publique dans ce psaume sapientiel, tandis que « dans la gloire » demeure une possibilité.
theological_decisions:
- issue: Sens de « sa justice » en rapport avec le don aux pauvres
  choice: L’expression désigne la justice ou la droiture durable de la personne généreuse, manifestée ici par ses dons.
  alternative: L’expression désigne exclusivement ses œuvres de charité, ou principalement la justice de l’alliance.
  rationale: Le contexte associe clairement la justice à la générosité, mais le terme hébreu reste plus large que l’aumône seule. La traduction évite aussi bien d’introduire une doctrine du mérite salvifique que de réduire la justice à une simple philanthropie.
- issue: Interprétation de l’élévation de la corne
  choice: Conserver la métaphore d’une force ou d’une dignité élevée dans l’honneur.
  alternative: Traduire directement par « sa puissance » ou « son rang sera exalté ».
  rationale: Le texte hébreu emploie une image corporelle et culturelle précise. La conserver maintient la poésie et l’indétermination entre force, dignité et statut, tandis qu’une note en facilite la compréhension.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme des deux premiers membres est conservé. « Sa corne » maintient volontairement la métaphore hébraïque, accompagnée d’une note pour éviter l’opacité.
