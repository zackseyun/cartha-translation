  text: כִּֽי לְ/עוֹלָ֥ם לֹא יִמּ֑וֹט לְ/זֵ֥כֶר ע֝וֹלָ֗ם יִהְיֶ֥ה צַדִּֽיק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/006.yaml
  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: fr
  text: Car il ne vacillera jamais ; on se souviendra toujours du juste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici un masculin singulier qui représente toute personne juste.
    reason: Préciser la portée générique de la forme masculine singulière.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente, tout en conservant le lien logique du texte hébreu.
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: il ne vacillera jamais
  rationale: Avec la négation, לְעוֹלָם exprime ici une permanence absolue. « Vaciller » conserve l’image de stabilité portée par le niphal de מוט.
- source_word: לְזֵכֶר עוֹלָם יִהְיֶה
  choice: on se souviendra toujours
  rationale: Cette formulation française naturelle rend l’idée d’un souvenir durable sans transformer l’affirmation en simple renommée humaine.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé masculin singulier désigne ici, de manière représentative, la personne juste caractéristique de la littérature de sagesse.
theological_decisions:
- issue: Masculin singulier représentatif dans צַדִּיק
  choice: le juste
  alternative: la personne juste
  rationale: « Le juste » respecte la forme grammaticale masculine singulière et l’expression traditionnelle de cette catégorie sapientiale, sans ajouter le nom « homme » absent de l’hébreu. Une note précise sa portée générale.
translation_notes:
  register: Français international actuel, sobre et poétique. « Ne vacillera jamais » préserve l’image biblique de stabilité ; la tournure impersonnelle « on se souviendra » restitue naturellement l’expression hébraïque du souvenir durable.
