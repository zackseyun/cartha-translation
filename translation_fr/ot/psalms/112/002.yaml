id: PSA.112.2
reference: Psalms 112:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גִּבּ֣וֹר בָּ֭/אָרֶץ יִהְיֶ֣ה זַרְע֑/וֹ דּ֭וֹר יְשָׁרִ֣ים יְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/002.yaml
  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: fr
  text: Sa descendance[a] sera puissante dans le pays[b] ; la génération des hommes droits sera bénie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses descendants » ; le mot hébreu est un terme collectif.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur la terre » ; le mot hébreu אֶרֶץ peut désigner aussi bien un pays que la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: puissante
  rationale: Le terme qualifie ici collectivement la descendance par sa force ou son importance, sans la désigner précisément comme guerrière.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner le pays ou la terre. « Dans le pays » convient bien au cadre social et sapientiel du psaume, tout en laissant l’autre possibilité en note.
- source_word: יִהְיֶה
  choice: sera
  rationale: Rend simplement l’imparfait hébreu avec sa valeur prospective dans cette déclaration de bénédiction.
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: זֶרַע désigne collectivement les descendants. « Descendance » est naturel en français actuel et conserve cette valeur collective.
- source_word: דּוֹר
  choice: la génération
  rationale: Le nom construit avec יְשָׁרִים forme naturellement l’expression « la génération des hommes droits ».
- source_word: יְשָׁרִים
  choice: des hommes droits
  rationale: Cette expression met en valeur la droiture morale évoquée par יָשָׁר et évite de confondre ce terme avec צַדִּיק, également présent dans le psaume.
- source_word: יְבֹרָךְ
  choice: sera bénie
  rationale: Le passif de ברך est conservé explicitement et exprime la faveur reçue sans la réduire à la seule prospérité matérielle.
theological_decisions:
- issue: Portée de la bénédiction dans un psaume sapientiel
  choice: Conserver l’affirmation générale de force et de bénédiction concernant la descendance des hommes droits.
  alternative: Limiter cette bénédiction à la prospérité matérielle, ou y voir la garantie du salut spirituel de chaque descendant.
  rationale: L’hébreu formule une promesse large dans le registre sapientiel de la bénédiction. La traduction ne doit ni en restreindre ni en préciser excessivement la portée théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Puissante » s’accorde avec le collectif singulier « descendance » ; « hommes droits » explicite naturellement en français la classe morale désignée par le pluriel hébreu.
