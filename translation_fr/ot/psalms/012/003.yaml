id: PSA.12.3
reference: Psalms 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַכְרֵ֣ת יְ֭הוָה כָּל שִׂפְתֵ֣י חֲלָק֑וֹת לָ֝שׁ֗וֹן מְדַבֶּ֥רֶת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/003.yaml
  text: May Yahweh cut off all flattering lips[b][a], the tongue that speaks great things.
translation:
  language: fr
  text: 'Que Yahweh retranche toutes les lèvres flatteuses[a],

    la langue qui profère de grandes choses[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « les lèvres lisses » : l’image hébraïque évoque une parole enjôleuse et flatteuse.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de grandes choses »; dans ce contexte, il s’agit de propos prétentieux ou arrogants.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: Que ... retranche
  rationale: Le hiphil inaccompli de כרת peut exprimer le fait de couper, retrancher ou éliminer. Ici, la tournure avec « Que » rend naturellement le souhait ou l’imprécation du psalmiste tout en conservant l’image forte de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que remplacé par un titre.
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: toutes les lèvres flatteuses
  rationale: L’expression signifie littéralement « toutes les lèvres de choses lisses ». « Lèvres flatteuses » transmet en français naturel l’idée d’une parole enjôleuse et manipulatrice, tandis que l’image plus littérale est signalée en note.
- source_word: לָשׁוֹן
  choice: la langue
  rationale: Le singulier hébreu est conservé. Il forme une expression parallèle ou apposée aux « lèvres » et personnifie vivement la parole arrogante.
- source_word: מְדַבֶּרֶת
  choice: qui profère
  rationale: Le participe féminin s’accorde avec « langue ». « Profère » convient à des paroles prononcées avec assurance et garde la construction concise du vers.
- source_word: גְּדֹלוֹת
  choice: de grandes choses
  rationale: La traduction littérale préserve l’ambiguïté expressive de l’hébreu; dans le contexte, il s’agit de propos prétentieux ou arrogants, ce que précise la note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de l’imprécation « retranche »
  choice: Conserver l’image sans préciser si elle vise les organes de parole, leur capacité de parler ou les personnes elles-mêmes
  alternative: réduise au silence
  rationale: L’hébreu formule une demande frappante mais laisse implicite la manière dont Yahweh retranchera ces lèvres et cette langue. Une explicitation résoudrait indûment cette tension poétique.
translation_notes:
  register: Français international moderne, poétique et digne. « Retranche » conserve l’image de כרת sans l’affaiblir; « profère » garde une tonalité soutenue mais claire. Le parallélisme entre « les lèvres » et « la langue » ainsi que le singulier hébreu de « langue » sont maintenus.
