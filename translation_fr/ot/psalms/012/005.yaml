id: PSA.12.5
reference: Psalms 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: fr
  text: '« À cause du ravage subi par les pauvres,

    à cause du gémissement des démunis,

    maintenant je me lèverai, dit Yahweh ;

    je mettrai en sécurité celui qui y aspire[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La dernière proposition hébraïque est difficile. Plus littéralement : « je mettrai en sécurité ; il y aspire ». On comprend aussi : « je le mettrai en sécurité loin de celui qui souffle avec mépris contre lui », ou dans un sens proche.'
    reason: Lecture alternative d’une proposition hébraïque dont la syntaxe et le verbe sont débattus.
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: à cause du ravage subi par les pauvres
  rationale: מִן est compris dans un sens causal. שֹׁד évoque une violence destructrice, un ravage ou un pillage. L’ajout de « subi par » évite en français de laisser entendre que les pauvres seraient les auteurs du ravage.
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: à cause du gémissement des démunis
  rationale: Le second מִן est également causal et forme un parallélisme avec le premier. « Gémissement » rend la détresse audible de אֲנָקָה, tandis que « démunis » distingue אֶבְיוֹנִים du terme précédent sans perdre l’idée de pauvreté et de besoin.
- source_word: עַתָּה אָקוּם
  choice: maintenant je me lèverai
  rationale: Cette formulation conserve l’immédiateté de עַתָּה et l’image anthropomorphique de Yahweh qui se lève pour intervenir.
- source_word: יֹאמַר יְהוָה
  choice: dit Yahweh
  rationale: Le présent français convient à la formule d’énonciation divine. Le nom propre « Yahweh » représente directement le tétragramme.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: je mettrai en sécurité
  rationale: שׂים signifie mettre ou placer, et יֵשַׁע désigne ici vraisemblablement la délivrance envisagée comme un état de sécurité. La formulation française reste naturelle tout en conservant l’action divine.
- source_word: יָפִיחַ לוֹ
  choice: celui qui y aspire
  rationale: La proposition finale est difficile. Cette lecture rattache le verbe à l’idée de haleter ou d’aspirer à quelque chose, et comprend לוֹ en rapport avec la personne secourue. Elle donne un sens cohérent dans le contexte, sans dissimuler les autres analyses possibles, signalées en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu porte le tétragramme comme nom personnel. « Yahweh » le translittère au lieu de lui substituer un titre.
- issue: Interprétation de la proposition יָפִיחַ לוֹ
  choice: celui qui y aspire
  alternative: il halète après elle ; loin de celui qui souffle avec mépris contre lui
  rationale: La syntaxe et le sens précis de la proposition sont débattus. Le texte principal retient la lecture contextuellement cohérente d’une sécurité désirée par l’opprimé, tandis que la note conserve l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme poétique est maintenu sur quatre lignes. « Démunis » évite la répétition de « pauvres » tout en conservant la nuance de besoin. La formulation interprétative de la dernière ligne est accompagnée d’une note afin de préserver l’ambiguïté du texte source.
