  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: fr
  text: Sauve-moi, Yahweh ! Car l’homme fidèle n’est plus[a] ; les gens dignes de confiance ont disparu du milieu des humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les hommes fidèles ont disparu ». L’hébreu emploie le singulier : « l’homme fidèle est arrivé à sa fin » ou « l’homme fidèle n’est plus » ; ce singulier peut avoir une portée collective.'
    reason: ambiguïté grammaticale et lexicale
  - marker: b
    text: 'Littéralement : « d’entre les fils de l’être humain » ; expression qui désigne la communauté humaine.'
    reason: note culturelle
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Au secours
  rationale: L’impératif de ישׁע est un appel pressant adressé à Dieu. « Au secours » restitue naturellement en français l’urgence de cette brève supplication, sans préciser un type particulier de délivrance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’appel au secours ; « car » convient au registre poétique et à la relation logique du verset.
- source_word: גָמַר
  choice: n’est plus
  rationale: Le verbe exprime l’idée d’arriver à son terme ou de disparaître. Avec חָסִיד au singulier, « n’est plus » conserve la formulation singulière et la plainte portant sur la disparition de ce type de personne.
- source_word: חָסִיד
  choice: l’homme fidèle
  rationale: Le nom adjectival masculin singulier désigne quelqu’un marqué par la loyauté, notamment envers Dieu. « Fidèle » garde cette dimension sans imposer le terme plus confessionnel « pieux » ; « homme » reflète la forme masculine singulière.
- source_word: פַסּוּ
  choice: ont disparu
  rationale: Le verbe au pluriel évoque la cessation ou la disparition ; « ont disparu » est clair, vivant et cohérent avec le parallélisme.
- source_word: אֱמוּנִים
  choice: les gens dignes de confiance
  rationale: Le pluriel désigne des personnes fiables, loyales ou fidèles. Cette formulation distingue leur fiabilité relationnelle de la foi au sens de croyance et s’accorde avec le contexte de tromperie des versets suivants.
- source_word: מִבְּנֵי אָדָם
  choice: du milieu des humains
  rationale: L’expression signifie littéralement « d’entre les fils de l’être humain/Adam » et désigne la communauté humaine. La traduction française restitue clairement sa portée collective tout en signalant le littéralisme en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée singulière ou collective de חָסִיד
  choice: l’homme fidèle n’est plus
  alternative: les fidèles ne sont plus
  rationale: Le substantif et le verbe hébreux sont au singulier, mais ce singulier peut représenter une catégorie de personnes. Le texte principal conserve la forme grammaticale, tandis que la note maintient ouverte la lecture collective.
- issue: Sens de אֱמוּנִים
  choice: les gens dignes de confiance
  alternative: les fidèles
  rationale: Dans ce contexte social, le mot peut caractériser la fiabilité ou la loyauté des personnes. La traduction évite de réduire le terme à une profession de foi, sans exclure la fidélité envers Dieu.
- issue: Langage anthropologique de בְּנֵי אָדָם
  choice: les humains
  alternative: les fils de l’homme
  rationale: L’expression est un idiome collectif désignant les êtres humains. Une traduction idiomatique moderne communique son référent, tandis que la note conserve sa forme littérale.
translation_notes:
  register: Français international moderne, poétique et digne. « Au secours » rend l’urgence de l’impératif initial ; le point d’exclamation respecte la force de l’appel. Le parallélisme hébreu est préservé, et les notes rendent visibles le singulier collectif possible ainsi que l’idiome anthropologique.
