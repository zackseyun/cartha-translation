  text: לַ/מְנַצֵּ֥חַ עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/000.yaml
  text: 'For the choirmaster: according to The Eighth[a]. A psalm of David[b].'
translation:
  language: fr
  text: Au chef de chœur. Sur « La Huitième »[a]. Psaume de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « la huitième ». Il s’agit probablement d’une indication musicale ou liturgique, qui pourrait désigner un air, un instrument ou un registre à l’octave. Le terme est traditionnellement transcrit « Sheminith ».'
    reason: cultural_note
  - marker: b
    text: Ou « par David » ou « pour David » ; l’hébreu laisse ouverte la nature exacte du rapport avec David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. Cette formulation est consacrée, concise et intelligible en français.
- source_word: עַל
  choice: Sur
  rationale: Dans ce contexte musical, la préposition introduit probablement un air, un mode ou une indication d’exécution. « Sur » est la formulation française naturelle dans un titre, sans préciser indûment la nature exacte de l’indication.
- source_word: הַשְּׁמִינִית
  choice: « La Huitième »
  rationale: Le terme signifie littéralement « la huitième » et semble être une indication musicale ou liturgique. Les guillemets et la majuscule signalent qu’il s’agit d’une désignation technique dont le sens précis reste incertain.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est le terme français standard correspondant à ce genre poétique et musical.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette ouverture que « par David » ou « pour David ».
theological_decisions:
- issue: Rapport de David au psaume exprimé par לְדָוִד
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu ne définit pas sans équivoque la nature du rapport. La traduction retenue évite de trancher la question de l’auteur au-delà de ce qu’indique le texte.
translation_notes:
  register: Français moderne, sobre et liturgique. La ponctuation distingue les trois éléments du titre. « Au chef de chœur » suit l’usage biblique français, tandis que « Sur “La Huitième” » préserve le caractère technique et incertain de l’indication musicale.
