  text: שָׁ֤וְא יְֽדַבְּרוּ֮ אִ֤ישׁ אֶת רֵ֫עֵ֥/הוּ שְׂפַ֥ת חֲלָק֑וֹת בְּ/לֵ֖ב וָ/לֵ֣ב יְדַבֵּֽרוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/002.yaml
  text: They speak emptiness[a], each man to his neighbor; with flattering lips[b], with a double heart they speak.
translation:
  language: fr
  text: Ils parlent de paroles vaines, chacun à son prochain ; avec des lèvres flatteuses, avec un cœur double, ils parlent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « avec un cœur et un cœur » ; expression qui évoque la duplicité ou une intention divisée.
    reason: idiom
lexical_decisions:
- source_word: שָׁוְא
  choice: des paroles vides
  rationale: Le nom désigne ce qui est vide, vain, faux ou sans valeur. « Des paroles vides » reste naturel en français, s’accorde avec le verbe « parler » et conserve une portée plus large que « des mensonges ».
- source_word: יְדַבְּרוּ / יְדַבֵּרוּ
  choice: se disent / ils parlent
  rationale: Le piel de דבר signifie couramment « parler ». La reprise de la notion de parole reflète l’encadrement verbal de l’hébreu, tandis que « se disent » rend naturellement la relation réciproque exprimée par « chacun à son prochain ».
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: chacun à son prochain
  rationale: אִישׁ est distributif et רֵעֵהוּ désigne le prochain, le compagnon ou l’associé. Cette formulation conserve la structure interpersonnelle et la portée générale de l’hébreu.
- source_word: שְׂפַת חֲלָקוֹת
  choice: leurs lèvres sont flatteuses
  rationale: L’expression évoque littéralement une « lèvre de choses lisses » ou des « lèvres lisses ». « Lèvres flatteuses » transmet en français actuel la douceur trompeuse suggérée par l’image.
- source_word: בְּלֵב וָלֵב
  choice: avec un cœur double
  rationale: La tournure littérale « avec un cœur et un cœur » est un idiome de duplicité. « Un cœur double » préserve l’image hébraïque sans réduire explicitement l’expression à une seule interprétation psychologique.
