  text: אַתָּֽה יְהוָ֥ה תִּשְׁמְרֵ֑/ם תִּצְּרֶ֓/נּוּ מִן הַ/דּ֖וֹר ז֣וּ לְ/עוֹלָֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: fr
  text: Toi, Yahweh, tu les garderas ; tu le protégeras[a] de cette génération, pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe ici du pluriel (« tu les garderas ») au singulier (« tu le protégeras »). Certaines traductions harmonisent les deux verbes au pluriel.
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Toi
  rationale: Le pronom indépendant, placé en tête, est emphatique. « Toi » conserve naturellement cette insistance en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: תִּשְׁמְרֵם
  choice: tu les garderas
  rationale: Le verbe שׁמר exprime l’idée de garder, veiller sur ou préserver. Le suffixe objet est au pluriel et est conservé par « les ».
- source_word: תִּצְּרֶנּוּ
  choice: tu le protégeras
  rationale: Le verbe נצר signifie garder, préserver ou protéger. La forme massorétique porte un suffixe masculin singulier ; « le » maintient donc le passage du pluriel au singulier.
- source_word: מִן הַדּוֹר זּוּ
  choice: de cette génération
  rationale: מִן garde son sens séparatif, tandis que דור désigne normalement une génération. L’expression évoque ici la protection face à la génération présente.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française courante et naturelle pour une durée sans fin dans un contexte poétique et religieux.
theological_decisions:
- issue: Variation de nombre entre les deux suffixes objets (« les », puis « le »)
  choice: 'Conserver dans le texte la forme massorétique : « tu les garderas ; tu le protégeras »'
  alternative: 'Harmoniser au pluriel : « tu les garderas ; tu les protégeras »'
  rationale: L’hébreu passe réellement d’un objet pluriel à un objet masculin singulier. La traduction conserve cette tension sans décider si le singulier désigne un individu représentatif ou chaque membre du groupe.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est préservé, ainsi que l’accent initial porté par « Toi ». « Protéger » distingue naturellement le second verbe du premier sans surinterpréter sa portée.
