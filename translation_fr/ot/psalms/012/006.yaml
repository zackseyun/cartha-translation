source:
  edition: WLC
  text: אִֽמֲר֣וֹת יְהוָה֮ אֲמָר֪וֹת טְהֹ֫ר֥וֹת כֶּ֣סֶף צָ֭רוּף בַּ/עֲלִ֣יל לָ/אָ֑רֶץ מְ֝זֻקָּ֗ק שִׁבְעָתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/006.yaml
  text: The words of Yahweh are pure words[a], like silver refined in a furnace on the earth[b], purified seven times.
translation:
  language: fr
  text: Les paroles de Yahweh sont des paroles pures, comme de l’argent affiné dans un creuset[a] sur la terre[b], purifié sept fois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un fourneau » ou « dans un four de fusion ». Le terme hébreu est rare et son référent précis demeure incertain, mais l’image est clairement métallurgique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur la terre ». L’expression peut indiquer le lieu ou le cadre de l’affinage; sa nuance exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: paroles
  rationale: Le nom répété désigne des paroles ou des déclarations. « Paroles » reste naturel, conserve la répétition poétique et n’en restreint pas le sens à des promesses.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: טְהֹרוֹת
  choice: pures
  rationale: L’adjectif exprime la pureté et convient à la fois à l’affirmation portant sur les paroles et à l’image métallurgique qui suit.
- source_word: כֶּסֶף
  choice: argent
  rationale: Le nom désigne ici sans ambiguïté le métal précieux.
- source_word: צָרוּף
  choice: affiné
  rationale: Le participe décrit un métal soumis à l’affinage. « Affiné » est précis et idiomatique en français.
- source_word: בַּעֲלִיל
  choice: dans un creuset
  rationale: Ce terme rare est incertain, mais le contexte de l’argent purifié indique vraisemblablement un récipient ou une installation d’affinage. « Creuset » restitue clairement l’image sans prétendre lever toute l’incertitude.
- source_word: לָאָרֶץ
  choice: sur la terre
  rationale: La construction est difficile. Cette traduction formelle préserve la formulation hébraïque et son ambiguïté quant au rapport exact avec le procédé d’affinage.
- source_word: מְזֻקָּק
  choice: purifié
  rationale: Le participe poursuit et intensifie l’image métallurgique; « purifié » évite de répéter « affiné » tout en gardant le parallélisme sémantique.
- source_word: שִׁבְעָתָיִם
  choice: sept fois
  rationale: Cette expression adverbiale évoque une purification répétée et complète; « sept fois » en donne une traduction transparente.
theological_decisions:
- issue: Nature de la pureté des paroles de Yahweh
  choice: Le verset affirme la pureté entière et, par implication, la fiabilité des paroles de Yahweh au moyen d’une comparaison métallurgique.
  alternative: Limiter l’énoncé à la seule pureté morale, ou l’élargir à une théorie ultérieure précise de la préservation textuelle.
  rationale: L’hébreu compare les paroles de Yahweh à de l’argent entièrement purifié. La traduction conserve cette affirmation poétique sans y importer une formulation doctrinale plus tardive.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition « paroles… paroles » reproduit l’insistance de l’hébreu. La syntaxe demeure claire tout en conservant l’incertitude réelle des deux expressions difficiles.
