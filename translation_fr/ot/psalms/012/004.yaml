source:
  edition: WLC
  text: אֲשֶׁ֤ר אָֽמְר֨וּ לִ/לְשֹׁנֵ֣/נוּ נַ֭גְבִּיר שְׂפָתֵ֣י/נוּ אִתָּ֑/נוּ מִ֖י אָד֣וֹן לָֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/004.yaml
  text: who say[a], “With our tongue we will prevail[d][c][b]; our lips are with us—who is lord over us?”
translation:
  language: fr
  text: 'qui disent : « Par notre langue, nous l’emporterons[a] ; nos lèvres sont à nous[b] : qui est notre maître ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Nous rendrons notre langue puissante. »'
    reason: ambiguïté de la construction לִלְשֹׁנֵנוּ נַגְבִּיר et de la valeur du hiphil
  - marker: b
    text: 'Littéralement : « nos lèvres sont avec nous » ; autre sens possible : « nos lèvres sont de notre côté ».'
    reason: la tournure אִתָּנוּ peut exprimer la présence, la possession ou l’avantage
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: qui disent
  rationale: Le relatif rattache cette parole aux personnes décrites au verset précédent. Bien que אָמְרוּ soit formellement un accompli, le présent français exprime naturellement leur attitude caractéristique.
- source_word: לִלְשֹׁנֵנוּ
  choice: Par notre langue
  rationale: 'Le ל préfixé est compris comme instrumental : la langue, c’est-à-dire la parole, est le moyen par lequel ils prétendent l’emporter.'
- source_word: נַגְבִּיר
  choice: nous l’emporterons
  rationale: Le hiphil de גבר exprime ici l’affirmation de sa force ou de sa supériorité. « L’emporter » restitue la vantardise sans ajouter un objet absent de l’hébreu.
- source_word: שְׂפָתֵינוּ
  choice: nos lèvres
  rationale: La traduction conserve l’image concrète des lèvres, en parallèle avec la langue.
- source_word: אִתָּנוּ
  choice: sont à nous
  rationale: Littéralement « sont avec nous ». Dans cette déclaration de défi, l’expression peut indiquer la possession ou la libre disposition de leur parole ; « sont à nous » reste concise et intelligible.
- source_word: מִי אָדוֹן לָנוּ
  choice: qui est notre maître ?
  rationale: אָדוֹן désigne ici celui qui exerce une autorité. « Maître » convient au contexte et évite de faire automatiquement de ce nom générique un titre divin.
theological_decisions:
- issue: Portée de אָדוֹן
  choice: maître
  alternative: seigneur
  rationale: Le texte exprime le rejet de toute autorité sur les locuteurs sans nommer explicitement Dieu. « Maître » préserve ce sens générique et la portée provocatrice de la question.
- issue: Sens de אִתָּנוּ dans la revendication des lèvres
  choice: nos lèvres sont à nous
  alternative: nos lèvres sont avec nous / nos lèvres sont de notre côté
  rationale: La formulation retenue présente leur revendication d’autonomie, tout en signalant en note la tournure hébraïque plus littérale et son autre nuance possible.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme concret « langue / lèvres » est conservé. Les deux-points avant la question rendent le mouvement de la vantardise vers le défi ouvert.
