  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: fr
  text: Les méchants circulent de tous côtés[a], quand la bassesse est exaltée parmi les humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les méchants rôdent de tous côtés, tandis que la bassesse est exaltée parmi les humains. »'
    reason: alternative_reading
lexical_decisions:
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe exprime un mouvement ou une présence de tous côtés; « tout autour » en conserve naturellement l’image.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Le pluriel substantivé désigne les personnes qui agissent avec méchanceté, sans qu’il soit nécessaire d’ajouter « hommes ».
- source_word: יִתְהַלָּכוּן
  choice: vont et viennent
  rationale: La forme hitpael de הלך évoque le fait de circuler ou d’aller çà et là; cette formulation française garde l’idée de déplacement sans renforcer indûment le verbe par « rôdent ».
- source_word: כְּרֻם
  choice: quand … est exaltée
  rationale: La construction difficile est comprise comme indiquant la circonstance temporelle dans laquelle les méchants circulent; « quand » reste clair sans exclure entièrement une nuance concomitante.
- source_word: זֻלּוּת
  choice: la bassesse
  rationale: Le nom désigne ce qui est vil, méprisable ou de peu de valeur; « bassesse » rend ici sa portée morale dans un registre digne et courant.
- source_word: לִבְנֵי אָדָם
  choice: parmi les humains
  rationale: Littéralement « parmi les fils d’Adam/de l’homme », l’expression hébraïque a ici une référence humaine générique. « Parmi les humains » transmet ce sens naturellement en français moderne.
theological_decisions:
- issue: Portée anthropologique de לִבְנֵי אָדָם
  choice: parmi les humains
  alternative: parmi les fils de l’homme
  rationale: La tournure source est masculine dans sa forme, mais générique dans sa portée. La traduction principale explicite cette portée collective sans lui donner un sens christologique absent du contexte.
- issue: Relation syntaxique introduite par כְּרֻם
  choice: quand la bassesse est exaltée
  alternative: tandis que la bassesse est exaltée
  rationale: L’hébreu permet une relation circonstancielle difficile à préciser. « Quand » présente une lecture temporelle naturelle; la note conserve la possibilité d’une concomitance.
translation_notes:
  register: Français international moderne, naturel et digne. « Vont et viennent » préserve l’image du déplacement tout en évitant la nuance prédatrice plus interprétative de « rôdent ». La formulation inclusive « les humains » rend la référence générique de l’hébreu.
