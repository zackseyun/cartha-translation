  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: fr
  text: Car ton amour fidèle atteint les cieux[a], et ta fidélité, les nuages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car ton amour fidèle est grand jusqu’aux cieux, et ta vérité jusqu’aux nuages. »'
    reason: Alternative plus littérale pour la construction de גָדֹל avec עַד et alternative lexicale (« vérité ») pour אֱמֶת.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange exprimée dans le contexte précédent, tout en conservant la fluidité poétique.
- source_word: גָדֹל
  choice: est grand
  rationale: Rend simplement l’ampleur de l’amour de Dieu dans un français naturel et digne.
- source_word: עַד
  choice: jusqu’aux
  rationale: Exprime l’étendue ou la portée vers les cieux et maintient l’image verticale du texte hébreu.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Terme poétique courant qui désigne l’espace céleste et convient au registre élevé du psaume.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: Réunit les dimensions d’amour, de loyauté et de constance portées par חֶסֶד, sans employer un terme confessionnel spécialisé.
- source_word: וְעַד
  choice: et ... jusqu’aux
  rationale: Préserve le parallélisme formel et sémantique des deux membres du vers.
- source_word: שְׁחָקִים
  choice: les nuages
  rationale: Conserve l’image concrète du terme poétique hébreu, en parallèle avec les cieux.
- source_word: אֲמִתֶּךָ
  choice: ta fidélité
  rationale: Dans son parallélisme avec חֶסֶד et comme attribut divin, אֱמֶת évoque ici surtout la fiabilité et la constance; « fidélité » l’exprime naturellement en français.
theological_decisions:
- issue: Traduction des attributs divins חֶסֶד et אֱמֶת
  choice: « amour fidèle » et « fidélité »
  alternative: « bonté » et « vérité »
  rationale: Le couple hébreu célèbre l’amour loyal et la fiabilité de Dieu. La traduction choisie rend cette portée relationnelle tout en reconnaissant en note que אֱמֶת peut aussi signifier « vérité ».
translation_notes:
  register: Français international moderne, poétique et accessible. Le parallélisme hébreu est conservé; « jusqu’aux » maintient l’image d’étendue malgré une légère tension idiomatique, tandis que la note offre une formulation plus explicite.
