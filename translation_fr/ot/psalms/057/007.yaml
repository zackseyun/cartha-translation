  text: נָ֘כ֤וֹן לִבִּ֣/י אֱ֭לֹהִים נָכ֣וֹן לִבִּ֑/י אָ֝שִׁ֗ירָה וַ/אֲזַמֵּֽרָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/007.yaml
  text: My heart is steadfast[a], O God; my heart is steadfast. I will sing, yes[b], I will make melody.
translation:
  language: fr
  text: Mon cœur est ferme, ô Dieu, mon cœur est ferme. Je chanterai et je ferai de la musique.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je chanterai tes louanges ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: ferme
  rationale: Le terme exprime ici un cœur affermi, stable et résolu. « Ferme » est naturel en français et préserve à la fois la stabilité intérieure et la détermination.
- source_word: לִבִּי
  choice: mon cœur
  rationale: « Cœur » conserve l’image hébraïque de la personne intérieure, notamment sa volonté et ses dispositions.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô Dieu » rend clairement cette adresse directe dans un registre poétique et digne.
- source_word: אָשִׁירָה
  choice: je chanterai
  rationale: Le cohortatif exprime la résolution du psalmiste. Le futur français communique naturellement cette volonté arrêtée.
- source_word: וַאֲזַמֵּרָה
  choice: je jouerai pour toi
  rationale: Le verbe זמר au piel évoque l’exécution de musique ou le chant de louange. Dans le parallélisme avec « chanterai », « jouerai pour toi » maintient la nuance musicale sans répéter simplement le premier verbe; le complément « pour toi » explicite en français la destination implicite de cette musique dans l’adresse à Dieu.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et accessible. La répétition de « mon cœur est ferme » est conservée. Le vers évite un « oui » ajouté, puisque la coordination hébraïque peut être rendue directement en français.
