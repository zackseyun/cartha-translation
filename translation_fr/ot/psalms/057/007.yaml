  source_fidelity: La répétition de « mon cœur est ferme » rend fidèlement נָכוֹן לִבִּי et l’apostrophe « ô Dieu » est justifiée. Les deux cohortatifs sont bien rendus comme une résolution future. Toutefois, « pour toi » n’est pas exprimé dans l’hébreu ; l’adresse à Dieu permet de le comprendre pragmatiquement, mais son ajout n’est pas nécessaire et restreint légèrement la formulation source.
