source:
  edition: WLC
  text: אוֹדְ/ךָ֖ בָ/עַמִּ֥ים אֲדֹנָ֑/י אֲ֝זַמֶּרְ/ךָ֗ בַּל אֻמִּֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: fr
  text: 'Je te rendrai grâce[a] parmi les peuples, Seigneur ;

    je chanterai tes louanges parmi les nations.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je te louerai parmi les peuples ». Le verbe hébreu peut exprimer aussi bien l’action de remercier que celle de louer ; « rendre grâce » permet de le distinguer du chant de louange mentionné dans la ligne suivante.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Je te rendrai grâce
  rationale: Le hifil de ידה peut exprimer l’action de remercier ou de louer. « Rendre grâce » conserve ici une nuance distincte de celle du verbe musical זמר dans le second membre.
- source_word: בָעַמִּים
  choice: parmi les peuples
  rationale: Le pluriel de עַם désigne ici des collectivités humaines. « Peuples » préserve ce pluriel et permet de le distinguer du terme parallèle אֻמִּים.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, et non du nom יהוה. « Seigneur » rend naturellement le vocatif sans ajouter l’interjection vieillie « ô ».
- source_word: אֲזַמֶּרְךָ
  choice: je chanterai tes louanges
  rationale: Le piel de זמר, fréquent dans les psaumes, évoque un chant ou une musique de louange adressés à Dieu. Cette formulation française exprime clairement le caractère à la fois musical et laudatif.
- source_word: בַּל
  choice: parmi
  rationale: Dans ce vers poétique, בַּל fonctionne comme une préposition parallèle au ב du premier membre et introduit le cadre dans lequel la louange est proclamée.
- source_word: אֻמִּים
  choice: les nations
  rationale: אֻמִּים peut désigner des nations ou des peuples. « Nations » maintient le parallélisme tout en reflétant la variation lexicale de l’hébreu.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: ô Seigneur
  rationale: Le texte porte le titre divin אֲדֹנָי et non le tétragramme. « Seigneur » respecte cette distinction et le vocatif est suffisamment clair en français sans « ô ».
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique entre « peuples » et « nations » est conservé, ainsi que la différence de nuance entre l’action de rendre grâce et celle de chanter des louanges.
