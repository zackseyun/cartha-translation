base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: fr
  text: Mon âme est au milieu des lions ; je me couche parmi des êtres enflammés[a], des fils d’homme[b], dont les dents sont une lance et des flèches, et dont la langue est une épée tranchante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « des êtres brûlants » ou « flamboyants ». L’expression dépeint l’ardeur menaçante des adversaires.'
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque qui désigne ici des êtres humains.
    reason: lexical_clarification
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Mon âme
  rationale: Conserve l’image poétique de נֶפֶשׁ, qui peut désigner l’âme, la vie ou la personne elle-même, sans réduire ici le terme à un simple pronom.
- source_word: לְבָאִם
  choice: les lions
  rationale: Rend directement l’image animale du texte hébreu, qu’elle vise des lions réels ou, métaphoriquement, des ennemis féroces.
- source_word: אֶשְׁכְּבָה
  choice: je suis couché
  rationale: Exprime naturellement en français la position du psalmiste au milieu du danger, tout en gardant le verbe concret « se coucher ».
- source_word: לֹהֲטִים
  choice: des êtres embrasés
  rationale: Le participe évoque ce qui brûle ou flamboie. « Embrasés » maintient cette métaphore intense sans la réduire à la colère ni préciser abusivement qu’ils dévorent.
- source_word: בְּנֵי אָדָם
  choice: des fils d’Adam
  rationale: Préserve la forme masculine et l’écho lexical à אָדָם, tout en laissant une note préciser que l’expression désigne des êtres humains.
- source_word: חֲנִית וְחִצִּים
  choice: une lance et des flèches
  rationale: Respecte le contraste de nombre de l’hébreu, où « lance » est au singulier et « flèches » au pluriel, malgré son caractère inhabituel en français.
- source_word: חֶרֶב חַדָּה
  choice: une épée tranchante
  rationale: Rend directement la métaphore de paroles dangereuses et destructrices dans un français poétique naturel.
theological_decisions:
- issue: Rapport entre les lions et les adversaires humains
  choice: Conserver successivement les lions et les fils d’Adam sans expliquer leur rapport dans le corps du verset.
  alternative: Identifier explicitement les lions aux ennemis humains, ou comprendre les lions comme des animaux distincts.
  rationale: Le passage superpose l’image des lions et la description d’adversaires humains. La traduction préserve cette ambiguïté poétique plutôt que d’imposer une seule lecture.
- issue: Portée de בְּנֵי אָדָם
  choice: « des fils d’Adam » dans le texte, avec clarification en note.
  alternative: « des êtres humains » ou « des hommes ».
  rationale: Cette formulation conserve la marque masculine et la texture poétique de l’hébreu, tandis que la note indique sa portée idiomatique générale.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La syntaxe conserve l’accumulation poétique des images hébraïques et la métaphore directe des dents et de la langue.
