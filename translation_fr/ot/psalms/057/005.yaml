  text: ר֣וּמָ/ה עַל הַ/שָּׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/005.yaml
  text: Be exalted above the heavens[a], O God; let your glory be over all the earth.
translation:
  language: fr
  text: Sois exalté au-dessus des cieux, ô Dieu ! Que ta gloire soit sur toute la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ta gloire est sur toute la terre. » En hébreu, le second membre n’a pas de verbe exprimé et peut se comprendre soit comme une prière ou un souhait, soit comme une déclaration.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Élève-toi
  rationale: La forme impérative de רום appelle Dieu à manifester son élévation et sa suprématie. « Élève-toi » conserve l’image verticale et reste naturel dans une prière poétique.
- source_word: עַל הַשָּׁמַיִם
  choice: au-dessus des cieux
  rationale: עַל exprime ici l’élévation, et le pluriel « les cieux » préserve l’idiome cosmologique et le registre poétique de l’hébreu.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « ô Dieu » rend explicitement le vocatif dans un français digne et courant.
- source_word: עַל כָּל הָאָרֶץ
  choice: sur toute la terre
  rationale: Dans le second membre, עַל peut exprimer l’étendue ou la domination. « sur toute la terre » maintient le parallélisme sans imposer une nuance plus précise que l’hébreu.
- source_word: כְּבוֹדֶךָ
  choice: ta gloire
  rationale: כבוד, appliqué à Dieu, désigne sa majesté manifeste et son éclat. « ta gloire » est à la fois exact, transparent et idiomatique.
theological_decisions:
- issue: Valeur de la proposition nominale עַל כָּל הָאָרֶץ כְּבוֹדֶךָ, dépourvue de verbe
  choice: Que ta gloire soit sur toute la terre
  alternative: Ta gloire est sur toute la terre
  rationale: Le parallélisme avec l’impératif du premier membre favorise une lecture comme souhait ou prière. La note conserve toutefois la possibilité grammaticale d’une déclaration, sans résoudre abusivement l’ambiguïté.
translation_notes:
  register: Français moderne, international et poétique, avec un registre de prière digne. Le rythme en deux membres est préservé et l’ambiguïté de la proposition sans verbe est signalée en note.
