id: PSA.57.11
reference: Psalms 57:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: fr
  text: Élève-toi au-dessus des cieux, ô Dieu ! Que ta gloire soit au-dessus de toute la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ta gloire est au-dessus de toute la terre. » Le second membre de la phrase ne comporte aucun verbe explicite en hébreu ; le verbe doit être suppléé d’après le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Élève-toi
  rationale: Cette forme adressée à Dieu a une valeur impérative ou jussive. « Élève-toi » conserve directement l’image d’élévation du verbe רום, tout en exprimant naturellement une prière en français.
- source_word: עַל
  choice: au-dessus de
  rationale: Dans les deux membres, la préposition évoque à la fois l’élévation spatiale et la suprématie. « Au-dessus de » maintient cette image poétique.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français « les cieux » correspond à l’expression hébraïque et convient au registre poétique et cosmique du verset.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. La particule « ô » marque clairement cette adresse directe dans une prière poétique.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: Le parallèle avec « les cieux » donne à אֶרֶץ une portée cosmique plutôt que le sens restreint de « pays ». « Toute la terre » est idiomatique en français.
- source_word: כְּבוֹדֶךָ
  choice: ta gloire
  rationale: Appliqué à Dieu, כָּבוֹד désigne sa gloire, sa majesté manifeste. « Ta gloire » est à la fois précis, transparent et naturel.
theological_decisions:
- issue: Le second membre hébreu ne comporte aucun verbe explicite.
  choice: Que ta gloire soit au-dessus de toute la terre.
  alternative: Ta gloire est au-dessus de toute la terre.
  rationale: Le premier membre étant une demande adressée à Dieu, l’emploi de « Que… soit » prolonge vraisemblablement cette valeur jussive et préserve le parallélisme poétique. La note signale toutefois la lecture déclarative, également possible en raison de l’absence de verbe explicite.
translation_notes:
  register: Français international moderne, poétique et digne. L’apostrophe « ô Dieu » convient au caractère liturgique du refrain sans rendre l’ensemble archaïque. L’impératif pronominal « Élève-toi » préserve davantage l’image hébraïque que « Sois exalté ».
