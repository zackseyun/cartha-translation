  text: ע֤וּרָ/ה כְבוֹדִ֗/י ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: fr
  text: Éveille-toi, ma gloire[a] ! Éveillez-vous, harpe et lyre[b] ! Je réveillerai l’aurore.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « mon âme » ou « tout mon être ». Littéralement : « ma gloire », expression poétique par laquelle le psalmiste peut se désigner lui-même.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu nomme deux anciens instruments à cordes ; leurs équivalents modernes exacts sont incertains.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Éveille-toi / Éveillez-vous
  rationale: L’impératif appelle directement à sortir du sommeil. « Éveille-toi » conserve le ton poétique pour « ma gloire » ; devant les deux instruments coordonnés, le pluriel français « Éveillez-vous » est naturel, même si la forme hébraïque demeure au singulier.
- source_word: כְבוֹדִי
  choice: ma gloire
  rationale: Traduction littérale qui préserve la métaphore hébraïque et son ambiguïté. Dans ce contexte poétique, l’expression peut désigner l’être intérieur, l’âme ou la personne tout entière ; ces possibilités sont signalées en note sans être imposées au texte.
- source_word: הַנֵּבֶל
  choice: harpe
  rationale: Désigne un ancien instrument à cordes dont l’identification précise reste incertaine. « Harpe » est un équivalent français courant et se distingue naturellement de « lyre ».
- source_word: כִנּוֹר
  choice: lyre
  rationale: Désigne un ancien instrument à cordes, souvent rendu par « lyre ». Ce choix maintient dans le texte la distinction entre les deux termes hébreux.
- source_word: אָעִירָה
  choice: Je réveillerai
  rationale: La forme causative exprime l’idée de faire s’éveiller. Le futur français restitue la détermination du psalmiste et conserve la personnification poétique de l’aurore.
- source_word: שָּׁחַר
  choice: l’aurore
  rationale: Le mot désigne l’aube ou le point du jour. « L’aurore » convient au registre poétique et s’emploie naturellement avec « réveiller ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « Éveille- » rend l’anaphore hébraïque, tandis que « ma gloire » conserve l’image surprenante du texte source au lieu de la résoudre silencieusement.
