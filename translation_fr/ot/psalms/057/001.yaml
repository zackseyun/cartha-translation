id: PSA.57.1
reference: Psalms 57:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָנֵּ֤/נִי אֱלֹהִ֨ים חָנֵּ֗/נִי כִּ֥י בְ/ךָ֮ חָסָ֪יָה נַ֫פְשִׁ֥/י וּ/בְ/צֵֽל כְּנָפֶ֥י/ךָ אֶחְסֶ֑ה עַ֝֗ד יַעֲבֹ֥ר הַוּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: fr
  text: 'Fais-moi grâce, Dieu, fais-moi grâce,

    car en toi mon âme[a] se réfugie ;

    à l’ombre de tes ailes, je chercherai refuge

    jusqu’à ce que les calamités[b] soient passées.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu traduit par « âme » peut aussi désigner la vie ou la personne elle-même ; on pourrait donc comprendre : « je me réfugie en toi ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu est au pluriel et peut aussi se traduire par « désastres » ou « destructions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: L’impératif de חנן demande à Dieu d’accorder sa faveur. « Fais-moi grâce » conserve cette nuance tout en convenant au registre de la prière.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Équivalent français normal du titre divin employé ici en apostrophe.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la supplication et maintient avec concision le lien causal.
- source_word: בְךָ
  choice: en toi
  rationale: Avec חסה, la préposition désigne celui auprès de qui ou en qui l’on cherche refuge ; « en toi » restitue naturellement la relation de confiance.
- source_word: חָסָיָה נַפְשִׁי
  choice: mon âme se réfugie
  rationale: La forme verbale au parfait décrit ici une confiance établie ou présente. « Mon âme » préserve l’expression poétique hébraïque, tandis qu’une note signale que נֶפֶשׁ peut désigner la vie ou la personne entière.
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: à l’ombre de tes ailes
  rationale: Conserve sans l’expliciter la métaphore poétique de la protection divine.
- source_word: אֶחְסֶה
  choice: je chercherai refuge
  rationale: L’imparfait à la première personne peut exprimer une action à venir ou prolongée. Le futur maintient la progression par rapport à la confiance déjà affirmée.
- source_word: עַד יַעֲבֹר
  choice: jusqu’à ce que … soient passées
  rationale: Rend la limite temporelle et l’image de menaces qui finissent par s’éloigner ; le subjonctif est exigé en français après « jusqu’à ce que ».
- source_word: הַוּוֹת
  choice: les calamités
  rationale: Le pluriel hébreu désigne des événements destructeurs ou des dangers entraînant la ruine. « Calamités » en préserve le pluriel et la gravité.
theological_decisions:
- issue: Portée anthropologique de נַפְשִׁי
  choice: mon âme
  alternative: ma vie ; moi-même ; je me réfugie
  rationale: Le terme hébreu peut désigner la vie ou la personne entière, et non nécessairement une âme immatérielle au sens philosophique. Le rendu littéraire « mon âme » est conservé, avec une note qui empêche de réduire indûment son champ sémantique.
- issue: Image protectrice de l’ombre des ailes divines
  choice: à l’ombre de tes ailes
  alternative: sous ta protection
  rationale: La métaphore est traduite directement, sans la transformer en explication ni préciser la manière dont s’exerce la protection divine.
translation_notes:
  register: Français international actuel, poétique et digne. La répétition initiale et le parallélisme des deux emplois de « refuge » sont conservés. « Fais-moi grâce » garde la nuance de faveur de חנן, tandis que la syntaxe demeure accessible.
