  text: אֶ֭קְרָא לֵֽ/אלֹהִ֣ים עֶלְי֑וֹן לָ֝/אֵ֗ל גֹּמֵ֥ר עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: fr
  text: Je fais appel à Dieu, le Très-Haut, à Dieu qui mène à bien ce qui me concerne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui achève ce qui me concerne » ; l’hébreu peut désigner ce que Dieu achève au sujet du psalmiste ou en sa faveur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶקְרָא
  choice: Je crie
  rationale: L’imparfait qal à la première personne peut exprimer ici une action présente ou résolue. « Je crie vers » est naturel dans le contexte d’une supplication et rend l’appel adressé à Dieu, sans ajouter « au secours ».
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: vers le Dieu Très-Haut
  rationale: עֶלְיוֹן est un titre divin, couramment et dignement rendu en français par « Très-Haut ». La préposition ל־ après קרא indique le destinataire de l’appel.
- source_word: לָאֵל
  choice: vers Dieu
  rationale: אֵל désigne ici Dieu et forme un parallélisme avec אֱלֹהִים. Répéter « Dieu » préserve ce parallélisme sans introduire le nom « El », potentiellement trompeur en français courant.
- source_word: גֹמֵר
  choice: qui mène à bien
  rationale: Le participe de גמר exprime l’action d’achever ou de conduire jusqu’à son terme. « Mène à bien » rend naturellement cette idée sans préciser outre mesure l’objet implicite.
- source_word: עָלָי
  choice: ce qui me concerne
  rationale: Avec גמר, עָלַי peut désigner ce qui touche le psalmiste ou ce qui est accompli en sa faveur. « Ce qui me concerne » conserve cette largeur de sens.
theological_decisions:
- issue: Sens de גֹמֵר עָלָי
  choice: Dieu mène à bien ce qui concerne le psalmiste
  alternative: Dieu accomplit son dessein pour moi
  rationale: Le texte hébreu ne nomme pas explicitement un « dessein ». La formulation retenue préserve l’objet implicite et l’ambiguïté entre ce que Dieu accomplit au sujet du psalmiste et ce qu’il accomplit en sa faveur.
translation_notes:
  register: Français moderne, international et digne. « Je crie vers » convient au registre de la supplication poétique ; « mène à bien ce qui me concerne » évite d’ajouter au texte l’idée explicite de « dessein » tout en restant intelligible.
