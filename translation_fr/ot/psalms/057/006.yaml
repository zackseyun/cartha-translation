  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: fr
  text: 'Ils ont préparé un filet pour mes pas[a] ; mon âme était accablée[b] ; ils ont creusé devant moi une fosse : ils y sont tombés[c]. Sélah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un piège ». Littéralement : « un filet pour mes pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « mon âme était courbée ». « Mon âme » peut aussi désigner « moi-même » ou « ma vie ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ils sont tombés en son milieu ».'
    reason: literal_rendering
lexical_decisions:
- source_word: רֶשֶׁת
  choice: filet
  rationale: Le nom désigne concrètement un filet servant à capturer ; « filet » conserve directement l’image du piège.
- source_word: הֵכִינוּ
  choice: avaient tendu
  rationale: Le hiphil signifie préparer ou mettre en place. Avec « filet », le français idiomatique dit « tendre un filet », tout en gardant l’idée d’une action délibérée.
- source_word: לִפְעָמַי
  choice: sous mes pas
  rationale: פעם peut désigner le pied ou le pas. « Sous mes pas » exprime naturellement en français l’emplacement du filet destiné à prendre le psalmiste.
- source_word: כָּפַף נַפְשִׁי
  choice: mon âme était courbée
  rationale: Cette formulation conserve l’expression anthropologique et l’image physique de l’hébreu, sans réduire נפשׁ à un simple pronom personnel.
- source_word: כָּרוּ
  choice: avaient creusé
  rationale: Le verbe signifie directement « creuser ». Le plus-que-parfait relie la préparation antérieure du piège à la chute qui en résulte.
- source_word: לְפָנַי שִׁיחָה
  choice: devant moi une fosse
  rationale: « Devant moi » rend la localisation, et « fosse » convient à une cavité creusée comme piège.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: ils sont tombés en plein dedans
  rationale: La tournure restitue le mouvement implicite vers l’intérieur et souligne naturellement en français qu’ils sont tombés au milieu même de la fosse.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens exact du terme liturgique ou musical reste incertain ; il est donc translittéré.
theological_decisions:
- issue: Référent de « mon âme » et relation syntaxique avec « était courbée »
  choice: Conserver « mon âme était courbée »
  alternative: « j’étais accablé » ou rattacher la proposition autrement à son contexte
  rationale: L’hébreu associe explicitement נפשׁי à une forme masculine singulière de כפף. La traduction garde cette tension poétique au lieu de l’aplanir ou d’expliciter une cause non formulée.
translation_notes:
  register: Français international moderne, poétique et digne. Les plus-que-parfaits rendent naturellement les préparatifs du piège antérieurs au renversement final. « En plein dedans » est courant sans être familier et restitue avec force בְתוֹכָהּ.
