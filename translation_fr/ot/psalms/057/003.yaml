lexical_decisions:
- source_word: יִשְׁלַח מִשָּׁמַיִם
  choice: Du ciel, il enverra son secours
  rationale: Le verbe « envoyer » n’a pas de complément exprimé en hébreu. L’ajout contextuel « son secours » rend l’ellipse intelligible en français sans identifier trop précisément ce que Dieu envoie ; la dernière proposition précise ensuite qu’il envoie son amour fidèle et sa fidélité.
- source_word: וְיוֹשִׁיעֵנִי
  choice: et me sauvera
  rationale: Le hifil de ישׁע exprime ici la délivrance accordée par Dieu. « Me sauvera » reste large, naturel et conforme au mouvement du psaume.
- source_word: חֵרֵף
  choice: il couvrira d’opprobre
  rationale: Le verbe signifie « outrager, couvrir d’opprobre ». Le futur français l’intègre à la déclaration confiante qui précède, tout en conservant l’idée de déshonneur attachée au verbe hébreu.
- source_word: שֹׁאֲפִי
  choice: celui qui me poursuit avidement
  rationale: Le participe de שאף évoque quelqu’un qui halète après sa proie, donc un adversaire animé d’une poursuite avide. La formulation française conserve l’avidité hostile sans produire une image obscure.
- source_word: סֶלָה
  choice: Sélah
  rationale: La translittération traditionnelle est maintenue puisque la fonction exacte de ce terme liturgique ou musical demeure incertaine.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד associe bonté, attachement durable et loyauté. « Amour fidèle » exprime ces dimensions dans un français actuel sans imposer un cadre doctrinal plus précis que le texte.
- source_word: וַאֲמִתּוֹ
  choice: et sa fidélité
  rationale: Dans son association fréquente avec חסד, אמת désigne la sûreté, la vérité et la fidélité de Dieu. « Fidélité » convient le mieux à ce binôme.
theological_decisions:
- issue: Sujet et fonction de חֵרֵף dans חֵרֵף שֹׁאֲפִי
  choice: 'Dieu reste le sujet : « il couvrira d’opprobre celui qui me poursuit avidement »'
  alternative: « celui qui me poursuit avidement m’outrage » ; ou « il me sauvera de l’opprobre de celui qui me poursuit avidement »
  rationale: La syntaxe poétique est très condensée et permet plusieurs analyses. Maintenir Dieu comme sujet relie la proposition à son intervention salvatrice, mais la note conserve explicitement la lecture où le poursuivant est le sujet afin de ne pas effacer l’ambiguïté réelle.
- issue: Nature de ce que Dieu « enverra » du ciel
  choice: « son secours », complément contextuel non spécifique
  alternative: 'Conserver l’ellipse stricte : « Du ciel, il enverra et me sauvera »'
  rationale: Le français courant exige plus naturellement un complément après « envoyer ». « Son secours » explicite seulement la fonction salvatrice donnée par le verbe suivant et ne préjuge pas de la forme de l’intervention divine.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation garde le parallélisme du verset et emploie « amour fidèle » et « fidélité » pour reproduire le couple חסד–אמת. L’expression « couvrir d’opprobre » relève d’un registre soutenu mais reste intelligible et reflète plus directement חֵרֵף que « confondre » ou « faire honte ».
