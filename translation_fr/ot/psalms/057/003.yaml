  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: fr
  text: Il enverra du ciel et me sauvera ; il outrage celui qui me poursuit avidement[a]. Sélah[b]. Dieu enverra son amour fidèle et sa fidélité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé et peut aussi se comprendre : « celui qui me poursuit avidement m’outrage », le poursuivant étant alors le sujet. Littéralement, celui-ci « halète après moi », image d’une poursuite avide qui peut aller jusqu’au désir d’engloutir.'
    reason: alternative_reading_and_lexical_alternative
  - marker: b
