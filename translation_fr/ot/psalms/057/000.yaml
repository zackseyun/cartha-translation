  text: לַ/מְנַצֵּ֣חַ אַל תַּ֭שְׁחֵת לְ/דָוִ֣ד מִכְתָּ֑ם בְּ/בָרְח֥/וֹ מִ/פְּנֵי שָׁ֝א֗וּל בַּ/מְּעָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: fr
  text: Au chef de chœur. Sur « Ne détruis pas ». De David[a]. Miktam[b], lorsqu’il fuyait Saül, dans la grotte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour David » ou « par David ». La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association ou la dédicace.'
    reason: alternative_reading
  - marker: b
    text: Le sens du mot hébreu « miktam » est incertain ; il est donc transcrit plutôt que traduit.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Cette formule conventionnelle des titres de psaumes désigne vraisemblablement le responsable de l’exécution musicale. Cette traduction est claire et conserve la fonction de la suscription.
- source_word: אַל־תַּשְׁחֵת
  choice: Sur « Ne détruis pas »
  rationale: Dans ce titre, l’expression est probablement le nom d’un air ou d’un refrain. « Sur » indique cette fonction probable sans l’intégrer au corps du psaume.
- source_word: לְדָוִד
  choice: De David
  rationale: Le ל des suscriptions peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « De David » préserve mieux cette latitude que « par David ».
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Le sens précis du terme hébreu demeure incertain. La translittération évite d’imposer une interprétation conjecturale.
- source_word: בְּבָרְחוֹ
  choice: lorsqu’il s’enfuit
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle, rendue naturellement en français par « lorsqu’il s’enfuit ».
- source_word: מִפְּנֵי
  choice: loin de
  rationale: Dans le contexte d’une fuite, l’expression idiomatique signifie que David se dérobe à Saül. « Loin de » restitue cette relation sans calquer inutilement « de devant la face de ».
- source_word: שָׁאוּל
  choice: Saül
  rationale: Forme française usuelle du nom propre biblique.
- source_word: בַּמְּעָרָה
  choice: dans la grotte
  rationale: La préposition indique le plus naturellement le lieu. La virgule détache cette précision circonstancielle conformément à la structure de la suscription.
theological_decisions:
- issue: Nature de la suscription
  choice: Présenter l’ensemble comme le titre éditorial et liturgique du psaume.
  alternative: Lire certains éléments, notamment « Ne détruis pas », comme le début du poème.
  rationale: 'Le texte hébreu réunit des éléments conventionnels de suscription : indication musicale, titre ou air, association davidique, désignation de genre et circonstance historique.'
- issue: Portée de לְדָוִד
  choice: « De David », formulation qui laisse ouvertes l’attribution d’auteur, l’association et la dédicace.
  alternative: « Par David » ou « Pour David ».
  rationale: La préposition hébraïque ne tranche pas à elle seule entre ces possibilités; la traduction ne doit donc pas résoudre silencieusement cette ambiguïté.
- issue: Sens de מִכְתָּם
  choice: Conserver le terme sous la forme translittérée « Miktam ».
  alternative: « inscription », « psaume d’or » ou une autre interprétation du genre.
  rationale: Aucune définition proposée ne bénéficie d’une certitude suffisante. La translittération maintient explicitement l’incertitude lexicale.
translation_notes:
  register: Français international actuel, sobre et digne. La ponctuation signale les différents éléments de la suscription. « Chef de chœur » est immédiatement compréhensible; « grotte » est naturel dans ce contexte. Les guillemets français identifient « Ne détruis pas » comme titre probable d’un air ou d’un refrain.
