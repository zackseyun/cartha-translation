base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: fr
  text: Yahvé, le matin, tu entends ma voix ; le matin, je présente devant toi ma prière[a] et je guette[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je dispose pour toi » ou « je mets en ordre pour toi ». L’objet n’est pas exprimé en hébreu ; il s’agit probablement de la prière du psalmiste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et j’attends avec espoir ». Le verbe hébreu peut exprimer le fait de regarder, de guetter ou d’attendre dans l’espérance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que substitution par un titre comme « le Seigneur ».
- source_word: בֹּקֶר
  choice: le matin
  rationale: Le nom temporel est employé adverbialement. La répétition présente dans l’hébreu est conservée.
- source_word: תִּשְׁמַע
  choice: tu entends
  rationale: L’imparfait hébreu peut exprimer ici une attente assurée ou une réalité habituelle ; le présent français préserve cette nuance sans imposer un futur strict.
- source_word: קוֹלִי
  choice: ma voix
  rationale: Traduction directe de קוֹלִי ; « mon cri » renforcerait inutilement le terme.
- source_word: אֶעֱרָךְ לְךָ
  choice: je présente devant toi ma prière
  rationale: Le verbe ערך signifie disposer ou mettre en ordre. L’objet n’est pas exprimé ; dans ce contexte, la prière est vraisemblablement ce que le psalmiste présente à Dieu. La note conserve la formulation plus littérale.
- source_word: וַאֲצַפֶּה
  choice: et je reste dans l’attente
  rationale: Le verbe צפה évoque le fait de regarder, de guetter ou d’attendre avec espoir. Cette formulation française exprime l’attente attentive sans lui ajouter d’objet absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur ; Yahweh
  rationale: Le texte porte le nom divin lui-même. « Yahvé » en est la transcription française courante et évite de remplacer un nom propre par un titre.
- issue: Objet implicite du verbe אֶעֱרָךְ
  choice: ma prière
  alternative: ma requête ; absence d’objet explicité
  rationale: Le contexte immédiat est celui d’une parole adressée à Dieu, mais l’hébreu laisse l’objet sous-entendu. Le corps du texte explicite « ma prière » pour la clarté, tandis que la note signale l’ambiguïté lexicale.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme créé par la répétition de « le matin » est conservé. « Je reste dans l’attente » garde une dignité naturelle tout en laissant la note restituer l’image concrète du guetteur.
