  verdict: revise
  source_fidelity: 'La structure imprécatoire est fidèlement rendue : impératif judiciaire, souhait de chute, impératif d’expulsion, puis motif de la rébellion contre Dieu. « Par leurs propres desseins » rend de manière recevable la relation ambiguë exprimée par מִן. En revanche, « nombreuses révoltes » est moins précis pour פְּשָׁעִים, qui désigne ici des transgressions/offenses, même si le terme peut comporter une nuance de rébellion.'
  naturalness: Le français est naturel, poétique et accessible. « Déclare-les coupables, ô Dieu ! » et « Chasse-les » conservent avec justesse la vigueur de la prière. « La multitude de leurs transgressions » est légèrement plus soutenu, mais reste clair et convient au registre psalmique.
  terminology: « Transgressions » rend plus exactement פְּשָׁעִים que « révoltes » et évite de réduire les fautes multiples à des actes de soulèvement. « Ils se sont rebellés contre toi » traduit précisément מָרוּ בָךְ. La note a est ajustée afin d’exprimer l’alternative liée à la préposition sans transformer indûment « tomber » en simple « échouer ».
