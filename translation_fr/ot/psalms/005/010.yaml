revisions:
- from: Déclare-les coupables, ô Dieu ! Qu’ils tombent par leurs propres desseins[a] ! Chasse-les à cause de leurs nombreuses révoltes[b], car ils se sont rebellés contre toi.
  to: Déclare-les coupables, ô Dieu ! Qu’ils tombent par leurs propres desseins[a] ! Chasse-les à cause de la multitude de leurs transgressions[b], car ils se sont rebellés contre toi.
  rationale: La révision remplace « révoltes » par « transgressions », terme plus directement correspondant à פְּשָׁעִים, tout en maintenant la rébellion explicite du dernier membre. Elle reformule aussi la note a pour préserver l’image de la chute et signaler sobrement l’incertitude de la relation exprimée par la préposition. Les impératifs, le vocatif et la tension de la prière imprécatoire sont conservés.
