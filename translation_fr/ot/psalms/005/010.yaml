source:
  edition: WLC
  text: הַֽאֲשִׁימֵ֨/ם אֱֽלֹהִ֗ים יִפְּלוּ֮ מִֽ/מֹּעֲצ֪וֹתֵ֫י/הֶ֥ם בְּ/רֹ֣ב פִּ֭שְׁעֵי/הֶם הַדִּיחֵ֑/מוֹ כִּי מָ֥רוּ בָֽ/ךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: fr
  text: Déclare-les coupables, ô Dieu ! Qu’ils tombent par leurs propres desseins[a] ! Chasse-les à cause de la multitude de leurs transgressions[b], car ils se sont rebellés contre toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’ils tombent à cause de leurs desseins », c’est-à-dire qu’ils soient ruinés par leurs propres projets.'
    reason: lexical_alternative
  - marker: b
    text: « Chasse-les » peut aussi se traduire par « rejette-les », « expulse-les » ou « bannis-les ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: Déclare-les coupables
  rationale: L’impératif hiphil de אשם avec suffixe de 3e personne du masculin pluriel exprime une demande adressée à Dieu pour qu’il les reconnaisse ou les déclare coupables. Cette formulation conserve la portée judiciaire sans préciser indûment le châtiment.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe directe dans la prière ; « ô Dieu » rend naturellement le vocatif et le registre poétique.
- source_word: יִפְּלוּ
  choice: Qu’ils tombent
  rationale: L’imparfait à valeur jussive exprime ici une demande imprécatoire, et non une simple prédiction.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: par leurs propres desseins
  rationale: מוֹעֵצוֹת désigne leurs projets ou plans. La préposition מן peut marquer la source, la cause ou l’éloignement ; « par leurs propres desseins » rend l’idée probable que leurs plans deviennent l’instrument de leur chute, tout en signalant l’autre possibilité en note.
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: à cause de leurs nombreuses révoltes
  rationale: בְּ avec רֹב prend ici une valeur causale. פֶּשַׁע peut désigner la transgression comme acte de rébellion ; « révoltes » maintient le lien sémantique avec leur rébellion contre Dieu dans le dernier membre.
- source_word: הַדִּיחֵמוֹ
  choice: Chasse-les
  rationale: L’impératif hiphil de נדח signifie faire partir, repousser ou bannir. « Chasse-les » est direct, énergique et naturel en français actuel.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif des demandes précédentes.
- source_word: מָרוּ בָךְ
  choice: ils se sont rebellés contre toi
  rationale: מרה construit avec בְּ exprime la rébellion dirigée contre Dieu ; cette traduction en conserve la force et l’objet.
theological_decisions:
- issue: Langage de prière imprécatoire
  choice: 'Conserver les demandes directes de jugement : « Déclare-les », « Qu’ils tombent », « Chasse-les ».'
  alternative: Transformer ces formes en prédictions ou les atténuer en souhaits indirects.
  rationale: L’hébreu emploie deux impératifs et un imparfait à valeur jussive adressés à Dieu. Le maintien de ces demandes respecte la forme de la prière et préserve sa tension théologique sans l’adoucir.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs gardent la vigueur de la supplication hébraïque. « Desseins » est légèrement soutenu, mais demeure clair et convient au parallélisme poétique ; « révoltes » fait ressortir la dimension de rébellion contenue dans פֶּשַׁע.
