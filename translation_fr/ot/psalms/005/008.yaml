id: PSA.5.8
reference: Psalms 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֤ה נְחֵ֬/נִי בְ/צִדְקָתֶ֗/ךָ לְמַ֥עַן שׁוֹרְרָ֑/י הושר לְ/פָנַ֣/י דַּרְכֶּֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/008.yaml
  text: O Yahweh[a], lead me in your righteousness because of my enemies[b]; make your way straight before me.
translation:
  language: fr
  text: Yahweh, conduis-moi selon ta justice à cause de mes adversaires[a] ; rends ta voie droite devant moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui me guettent » ; le mot hébreu peut désigner des adversaires qui observent avec hostilité ou se tiennent à l’affût.
    reason: lexical_alternative
  - marker: b
    text: Ou « aplanis ta voie devant moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui conserve ici le nom propre présent dans le texte hébreu.
- source_word: נְחֵנִי
  choice: conduis-moi
  rationale: Le verbe נחה exprime l’action de mener ou de guider. « Conduis-moi » convient à la prière et garde l’image d’un chemin à suivre.
- source_word: בְצִדְקָתֶךָ
  choice: selon ta justice
  rationale: La préposition ב peut indiquer la norme ou la sphère. « Selon ta justice » est naturel en français et présente la justice de Dieu comme la règle de sa conduite, sans réduire le terme à une seule action judiciaire.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Dans ce contexte, l’expression introduit la situation hostile qui motive la demande du psalmiste.
- source_word: שׁוֹרְרָי
  choice: mes adversaires
  rationale: Le terme désigne des opposants hostiles et peut évoquer ceux qui observent ou guettent le psalmiste. « Adversaires » exprime le sens général, tandis que la nuance particulière est signalée en note.
- source_word: הושר
  choice: rends … droite
  rationale: La forme causative de ישר signifie rendre droit, uni ou praticable. Ce choix conserve l’image du chemin et son sens moral possible.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Rendu direct et idiomatique de la locution hébraïque.
- source_word: דַּרְכֶּךָ
  choice: ta voie
  rationale: דרך peut désigner un chemin concret ou une manière d’agir. « Voie » maintient cette double portée et convient au registre poétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » le rend comme un nom propre sans le remplacer par un titre.
- issue: Sens de צְדָקָה dans la demande
  choice: justice
  alternative: droiture
  rationale: « Justice » conserve en français la portée morale et relationnelle du terme, tout en laissant ouverte sa dimension judiciaire. « Droiture » serait possible, mais resserrerait légèrement le champ sémantique.
- issue: Image de la voie rendue droite
  choice: rends ta voie droite devant moi
  alternative: aplanis ta voie devant moi
  rationale: Le texte peut évoquer une voie droite ou nivelée. Le corps du verset conserve l’idée de rectitude, qui porte aussi une résonance morale, et la variante concrète est donnée en note.
translation_notes:
  register: Français moderne, digne et poétique. La formulation demeure concise et conserve la métaphore directrice de la conduite sur une voie. Les marqueurs de notes sont placés sur les expressions auxquelles les variantes se rapportent.
