id: PSA.5.4
reference: Psalms 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: fr
  text: Car tu n’es pas un Dieu qui prend plaisir au mal ; le mal ne peut séjourner auprès de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le méchant ne peut séjourner auprès de toi » ; ou : « celui qui fait le mal ne peut séjourner auprès de toi ».'
    reason: L’hébreu רָע peut désigner soit le mal de manière abstraite, soit une personne mauvaise.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’appel précédent et convient au mouvement argumentatif du psaume.
- source_word: אֵל
  choice: Dieu
  rationale: Désigne ici le vrai Dieu, directement interpellé ; « Dieu » est la formulation française naturelle.
- source_word: חָפֵץ
  choice: prend plaisir à
  rationale: Exprime le fait de trouver son plaisir en quelque chose, et non simplement de le vouloir.
- source_word: רֶשַׁע
  choice: mal
  rationale: Le nom désigne la méchanceté ou la conduite coupable. « Mal » est naturel en français moderne et maintient le parallélisme avec רָע sans réduire le terme à un simple dommage.
- source_word: יְגֻרְךָ
  choice: ne peut séjourner auprès de toi
  rationale: Le verbe גור évoque le séjour, notamment comme résident temporaire ou hôte. « Séjourner auprès de toi » conserve cette image, tandis que « ne peut » exprime l’exclusion de la présence divine plutôt qu’une simple prédiction.
- source_word: רָע
  choice: le mal
  rationale: Le terme peut désigner abstraitement le mal ou, substantivé, une personne mauvaise. Le sens abstrait s’accorde bien avec רֶשַׁע dans le premier membre, tout en laissant l’autre lecture en note.
theological_decisions:
- issue: Faut-il comprendre רָע comme une réalité abstraite (« le mal ») ou comme une personne (« le méchant ») ?
  choice: le mal
  alternative: le méchant / celui qui fait le mal
  rationale: L’hébreu autorise les deux lectures. Le parallélisme immédiat avec « mal » au premier membre favorise ici la lecture abstraite, tandis que le verset suivant explicite les personnes qui pratiquent le mal. La variante personnelle est conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu. « Séjourner auprès de toi » préserve l’image hébraïque de l’hôte ou du résident temporaire, et la note maintient l’ambiguïté entre le mal abstrait et la personne mauvaise.
