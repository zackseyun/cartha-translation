source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: fr
  text: Car rien n’est fiable dans leur bouche[a] ; au fond d’eux-mêmes, ce n’est que destruction[b]. Leur gosier est une tombe ouverte ; avec leur langue, ils flattent[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, selon la forme singulière : « rien n’est fiable dans sa bouche » ; le reste du verset emploie le pluriel.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « leur être intérieur est ruine » ou « leur être intérieur est fait de desseins destructeurs » ; le terme hébreu peut évoquer la ruine ou des projets destructeurs.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « avec leur langue, ils parlent avec douceur » ; l’expression peut évoquer des paroles flatteuses ou trompeuses.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la demande formulée dans le contexte précédent.
- source_word: אֵין בְּפִיהוּ נְכוֹנָה
  choice: rien n’est fiable dans leur bouche
  rationale: נְכוֹנָה désigne ici ce qui est ferme, sûr ou digne de confiance. Le pluriel contextuel assure la cohérence avec les suffixes pluriels qui suivent, tout en signalant en note la forme singulière du texte consonantique.
- source_word: קִרְבָּם
  choice: au fond d’eux-mêmes
  rationale: Rend naturellement l’intériorité visée par l’expression hébraïque sans la limiter à une faculté particulière comme le cœur.
- source_word: הַוּוֹת
  choice: ce n’est que destruction
  rationale: Le pluriel hébreu peut évoquer des actions ou projets funestes; le singulier abstrait français conserve ici la force prédicative et le parallélisme.
- source_word: קֶבֶר פָּתוּחַ גְּרוֹנָם
  choice: Leur gosier est une tombe ouverte
  rationale: Préserve l’image corporelle et mortelle du texte. « Gosier » relie clairement la métaphore à la parole tout en restant digne et intelligible.
- source_word: לְשׁוֹנָם יַחֲלִיקוּן
  choice: de leur langue, ils usent de flatterie
  rationale: Le hiphil de חלק évoque l’action de rendre lisse, appliquée ici aux paroles; « user de flatterie » conserve à la fois l’instrument exprimé par לְ et la portée trompeuse de la parole douce.
theological_decisions:
- issue: Métaphore anthropologique de קִרְבָּם
  choice: au fond d’eux-mêmes
  alternative: leur être intérieur / leur cœur
  rationale: Cette formulation garde l’idée générale de corruption intérieure sans réduire le terme à une conception particulière du cœur.
- issue: Nombre de בְּפִיהוּ
  choice: dans leur bouche
  alternative: dans sa bouche
  rationale: La forme reçue est singulière, mais les suffixes pluriels du reste du verset montrent que le groupe des méchants est visé. Le pluriel rend ce référent collectif avec naturel; la tension textuelle est conservée en note.
- issue: Portée de הַוּוֹת
  choice: ce n’est que destruction
  alternative: ce ne sont que ruines / projets funestes
  rationale: Le mot peut désigner la ruine ou des desseins destructeurs. La traduction principale maintient l’abstraction vigoureuse sans préciser indûment s’il s’agit de l’état intérieur ou de ses projets.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et les images concrètes sont conservés, tandis que les formulations idiomatiques évitent l’archaïsme. Les ambiguïtés concernant le nombre initial, l’intériorité et les « paroles lisses » sont explicitées sans imposer une lecture confessionnelle.
