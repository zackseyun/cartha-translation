  rationale: La révision remplace une construction française susceptible de signifier « je te supplie » par une expression explicite et naturelle de la prière adressée à Dieu. Elle allège aussi « au son de mon appel au secours » sans perdre le sens du cri implorant. La note conserve l’alternative future réelle de l’inaccompli hébreu.
