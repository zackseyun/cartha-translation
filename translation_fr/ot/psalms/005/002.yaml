  text: הַקְשִׁ֤יבָ/ה לְ/ק֬וֹל שַׁוְעִ֗/י מַלְכִּ֥/י וֵ/אלֹהָ֑/י כִּֽי אֵ֝לֶ֗י/ךָ אֶתְפַּלָּֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/002.yaml
  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: fr
  text: Sois attentif à mon appel au secours, mon Roi et mon Dieu, car c’est à toi que j’adresse ma prière[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « c’est à toi que j’adresserai ma prière ». La forme hébraïque peut exprimer, selon le contexte, une action présente, habituelle ou future.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Sois attentif
  rationale: L’impératif de קשׁב demande une écoute attentive. « Sois attentif » est naturel en français moderne et conserve l’idée d’une attention soutenue.
- source_word: לְקוֹל
  choice: au son de
  rationale: קוֹל désigne la voix ou le son. Avec שַׁוְעִי, « au son de mon appel au secours » reproduit clairement la construction hébraïque.
- source_word: שַׁוְעִי
  choice: mon appel au secours
  rationale: שַׁוְעָה désigne un cri de détresse lancé pour obtenir de l’aide. « Appel au secours » exprime cette portée sans surtraduire.
- source_word: מַלְכִּי
  choice: mon Roi
  rationale: Le titre royal avec suffixe de première personne est conservé dans l’adresse directe à Dieu. La majuscule relève de l’usage typographique français pour un titre divin.
- source_word: וֵאלֹהָי
  choice: et mon Dieu
  rationale: Rendu direct du titre divin muni du suffixe de première personne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande. « Car » convient au registre de la prière tout en restant courant.
- source_word: אֵלֶיךָ
  choice: c’est toi que
  rationale: La tournure disloquée met en relief le destinataire exclusif ou privilégié de la prière et rend naturellement en français l’antéposition de אֵלֶיךָ.
- source_word: אֶתְפַּלָּל
  choice: je prie
  rationale: L’inaccompli hébreu peut exprimer une action présente, habituelle ou future. Dans cette supplication immédiate, le présent français est naturel sans supprimer l’autre possibilité, signalée en note.
theological_decisions:
- issue: Adresse divine avec un titre royal
  choice: mon Roi et mon Dieu
  alternative: mon roi et mon Dieu
  rationale: Le verset s’adresse directement à Dieu sous les titres de roi et de Dieu. Les deux sont conservés sans ajout doctrinal; la majuscule à « Roi » est une convention typographique.
- issue: Valeur aspectuelle et temporelle de אֶתְפַּלָּל
  choice: je prie
  alternative: je prierai
  rationale: L’inaccompli peut être orienté vers l’avenir, mais le contexte d’une demande immédiate permet naturellement le présent. La note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la structure poétique de l’appel, évite l’archaïsme « prête l’oreille » et préserve en note l’ambiguïté temporelle de l’inaccompli hébreu.
