  yaml_path: translation/ot/psalms/005/006.yaml
  text: You destroy those who speak lies[b][a]; Yahweh abhors a man of bloodshed and deceit.
translation:
  language: fr
  text: Tu détruis[a] ceux qui disent des mensonges ; Yahweh a en horreur l’homme sanguinaire et trompeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu détruiras ». La forme verbale hébraïque peut exprimer une action future ou une affirmation générale sur la manière d’agir de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’homme de sangs et de tromperie », expression désignant un homme caractérisé par le sang versé et la duplicité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Tu détruis
  rationale: Le piel de אבד exprime ici l’action de faire périr ou de détruire. Le présent convient à une affirmation générale sur l’action de Dieu, sans exclure la nuance future de l’inaccompli hébreu.
- source_word: דֹּבְרֵי כָזָב
  choice: ceux qui disent des mensonges
  rationale: Cette formulation naturelle conserve la valeur verbale de דֹּבְרֵי, « ceux qui disent », et rend כָזָב par son sens courant de mensonge ou de fausseté.
- source_word: אִישׁ דָּמִים
  choice: l’homme sanguinaire
  rationale: L’expression hébraïque littérale « homme de sangs » désigne un homme caractérisé par le sang versé et la violence. « Sanguinaire » en restitue l’intensité dans un français actuel et concis, tout en conservant le masculin singulier.
- source_word: וּמִרְמָה
  choice: et trompeur
  rationale: מִרְמָה désigne la tromperie, la duplicité ou la perfidie. L’adjectif « trompeur » s’accorde naturellement avec « homme » et forme un parallèle fluide avec « sanguinaire ».
- source_word: יְתָעֵב
  choice: a en horreur
  rationale: Le piel de תעב marque une forte répulsion. La locution « avoir en horreur » préserve cette intensité morale dans un registre digne et accessible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est translittéré « Yahweh » plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Valeur temporelle de תְּאַבֵּד
  choice: 'Présent général : « Tu détruis »'
  alternative: 'Futur : « Tu détruiras »'
  rationale: L’inaccompli hébreu peut décrire aussi bien une action future qu’une manière habituelle d’agir. Le contexte permet une affirmation générale ; l’autre lecture est signalée en note afin de préserver l’ambiguïté.
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme, nom personnel du Dieu d’Israël. Sa translittération évite de le remplacer par un titre.
- issue: Masculin singulier אִישׁ
  choice: l’homme sanguinaire et trompeur
  alternative: la personne violente et trompeuse
  rationale: Le texte hébreu emploie explicitement le nom masculin singulier אִישׁ. La traduction le conserve sans généralisation neutre.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme est conservé par deux propositions directes ; « a en horreur » maintient la force du verbe hébreu sans archaïsme excessif.
