source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: fr
  text: Mais moi, grâce à l’abondance de ton amour fidèle[a], j’entrerai dans ta maison ; je me prosternerai vers ton saint temple, avec crainte devant toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta fidélité à l’alliance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec révérence pour toi » ou « dans l’émerveillement devant toi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le pronom indépendant, associé à la conjonction, marque ici le contraste entre le psalmiste et les méchants évoqués auparavant.
- source_word: בְּרֹב
  choice: grâce à l’abondance de
  rationale: La préposition exprime le fondement de l’entrée du psalmiste. « Grâce à » rend naturellement en français cette idée sans effacer la notion d’abondance.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne un amour loyal, durable et engagé. « Amour fidèle » en conserve à la fois la dimension affective et la constance.
- source_word: אָבוֹא
  choice: j’entrerai
  rationale: L’imparfait hébreu exprime ici une résolution ou une attente, et le verbe « entrer » convient naturellement avec « ta maison ».
- source_word: בֵיתֶךָ
  choice: ta maison
  rationale: Le sens concret de « maison » est conservé, sans l’assimiler trop vite au temple, puisque הֵיכַל figure dans la proposition suivante.
- source_word: אֶשְׁתַּחֲוֶה
  choice: je me prosternerai
  rationale: Le verbe évoque l’acte corporel de se courber ou de se prosterner dans l’adoration ; ce choix préserve cette image.
- source_word: אֶל
  choice: vers
  rationale: La préposition indique la direction du geste et n’implique pas nécessairement que le psalmiste pénètre dans le sanctuaire.
- source_word: הֵיכַל קָדְשְׁךָ
  choice: ton saint temple
  rationale: Dans ce contexte cultuel, הֵיכַל désigne le temple de Dieu ; la formulation française est claire et naturelle.
- source_word: בְּיִרְאָתֶךָ
  choice: dans la crainte de toi
  rationale: Cette traduction garde la force de יִרְאָה, qui unit crainte, révérence et saisissement devant Dieu, sans la réduire à un simple respect.
theological_decisions:
- issue: Sens de חֶסֶד dans le contexte de l’adoration
  choice: amour fidèle
  alternative: fidélité à l’alliance ; bonté ; miséricorde
  rationale: L’accès à la maison de Dieu repose sur son amour loyal et constant. « Amour fidèle » garde cette profondeur sans limiter le terme à la seule miséricorde ni expliciter une alliance que le verset ne nomme pas.
- issue: Nuance de יִרְאָה devant Dieu
  choice: crainte de toi
  alternative: respect pour toi ; saisissement devant toi
  rationale: Le texte associe l’adoration à une véritable crainte sainte. Cette formulation maintient la tension entre peur, révérence et émerveillement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le contraste initial, l’image corporelle de la prosternation et la force théologique de la crainte révérencielle.
