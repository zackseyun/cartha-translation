  text: לַ/מְנַצֵּ֥חַ אֶֽל הַ/נְּחִיל֗וֹת מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/000.yaml
  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: fr
  text: Au chef de chœur. Sur les flûtes[a]. Psaume de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « sur les instruments à vent ». Le terme hébreu semble être une indication musicale technique; on le transcrit aussi traditionnellement « Nehiloth ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « de David » peut indiquer que David en est l’auteur, qu’il lui est dédié ou qu’il appartient à la collection qui lui est associée.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est naturel en français et la préposition « à » rend la valeur destinative du préfixe hébreu.
- source_word: אֶל הַנְּחִילוֹת
  choice: Sur les flûtes
  rationale: Dans ce titre musical, אֶל peut introduire l’instrumentation, l’air ou le mode d’exécution. « Sur » convient à une rubrique musicale française, tandis que « flûtes » exprime l’interprétation probable de הַנְּחִילוֹת sans masquer son incertitude.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Il s’agit du terme habituel pour une composition chantée avec accompagnement musical dans les titres du Psautier.
- source_word: לְדָוִד
  choice: de David
  rationale: 'Cette formulation française conserve mieux que « par David » l’éventail des rapports possibles exprimés par le לְ hébreu : auteur, appartenance, dédicace ou rattachement à la collection davidique.'
theological_decisions:
- issue: Portée de לְדָוִד dans le titre
  choice: de David
  alternative: par David
  rationale: Le titre hébreu ne contraint pas à comprendre exclusivement une attribution directe d’auteur; la traduction retenue préserve cette ambiguïté historique et canonique.
translation_notes:
  register: Français international moderne, sobre et liturgique. La ponctuation en phrases brèves présente clairement les trois éléments du titre. « Sur les flûtes » sonne comme une indication d’exécution musicale tout en laissant l’incertitude lexicale à la note.
