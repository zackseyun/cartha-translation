id: PSA.5.11
reference: Psalms 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִשְׂמְח֨וּ כָל ח֪וֹסֵי בָ֡/ךְ לְ/עוֹלָ֣ם יְ֭רַנֵּנוּ וְ/תָסֵ֣ךְ עָלֵ֑י/מוֹ וְֽ/יַעְלְצ֥וּ בְ֝/ךָ֗ אֹהֲבֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: fr
  text: Mais que tous ceux qui se réfugient en toi se réjouissent ! Qu’ils poussent des cris de joie pour toujours[a] ! Étends ta protection sur eux[b], et que ceux qui aiment ton nom exultent en toi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils chantent de joie pour toujours ». Le verbe hébreu peut désigner des cris retentissants de jubilation et peut aussi inclure le chant.
    reason: lexical_alternative
  - marker: b
    text: Ou « couvre-les » ou « abrite-les ». L’hébreu évoque une couverture protectrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: que … se réjouissent
  rationale: Dans le contexte de prière, l’imparfait peut avoir une valeur volitive. Cette tournure rend le souhait sans le transformer en simple prédiction.
- source_word: חוֹסֵי בָךְ
  choice: ceux qui trouvent refuge en toi
  rationale: Le participe de חסה évoque le fait de chercher et de trouver abri ou protection, plutôt qu’une confiance purement intérieure.
- source_word: לְעוֹלָם
  choice: éternellement
  rationale: Le terme exprime une durée sans fin ou durable ; « éternellement » convient au registre poétique du psaume.
- source_word: יְרַנֵּנוּ
  choice: qu’ils poussent … des cris de joie
  rationale: Le piel de רנן désigne des cris retentissants de jubilation et peut aussi inclure le chant.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Étends sur eux ta protection
  rationale: Le hiphil de סכך porte l’image d’une couverture protectrice. La formulation française explicite la fonction protectrice tout en conservant l’image de quelque chose étendu au-dessus d’eux.
- source_word: וְיַעְלְצוּ בְךָ
  choice: qu’ils … exultent en toi
  rationale: עלץ exprime une joie débordante. « Exulter » en garde l’intensité, tandis que « en toi » maintient explicitement l’objet divin de cette joie.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: ceux qui aiment ton nom
  rationale: L’hébreu mentionne expressément le « nom », qui renvoie à l’identité révélée et à la réputation de Dieu ; il ne faut pas l’aplanir en « ceux qui t’aiment ».
theological_decisions:
- issue: Souhait-prière ou prédiction dans l’ensemble du verset
  choice: 'Rendre les formes imperfectives à valeur jussive comme des souhaits ou demandes : « que… »'
  alternative: « Tous ceux… se réjouiront… pousseront des cris… exulteront »
  rationale: Dans ce contexte de prière, les formes verbales se lisent naturellement comme des souhaits adressés à Dieu. Le français avec « que » préserve cette force liturgique, tout en reconnaissant que l’hébreu imperfectif pourrait formellement être compris comme futur.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs de souhait sont rendus par « que », et le parallélisme est marqué par des phrases exclamatives. « Trouvent refuge » conserve l’image concrète ; « exultent » maintient l’intensité du dernier verbe.
