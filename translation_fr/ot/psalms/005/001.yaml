source:
  edition: WLC
  text: אֲמָרַ֖/י הַאֲזִ֥ינָ/ה יְהוָ֗ה בִּ֣ינָ/ה הֲגִֽיגִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/001.yaml
  text: Give ear to my words[a], O Yahweh; understand my groaning.
translation:
  language: fr
  text: Prête l’oreille à mes paroles, Yahweh ; comprends mon murmure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma méditation », « ma réflexion », « ma plainte » ou « mon gémissement ». Le mot hébreu peut désigner une pensée intérieure ou une parole prononcée à voix basse.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: mes paroles
  rationale: Le pluriel avec suffixe de première personne désigne ce que dit le psalmiste ; « mes paroles » est direct, naturel et digne.
- source_word: הַאֲזִינָה
  choice: Prête l’oreille
  rationale: L’impératif appelle une écoute attentive. L’expression française conserve l’image concrète et le ton suppliant de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה ; sa translittération préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: בִּינָה
  choice: comprends
  rationale: L’impératif de בין demande une perception qui discerne le sens, rendue simplement par « comprends ».
- source_word: הֲגִיגִי
  choice: mon murmure intérieur
  rationale: Le terme peut désigner une méditation, un murmure ou une plainte à peine exprimée. « Murmure intérieur » conserve ensemble l’idée de réflexion intime et celle d’une faible émission de voix, sans imposer exclusivement le sens de gémissement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie directement le tétragramme. « Yahweh » le rend comme nom propre et évite de le remplacer par un titre.
- issue: Nature de הֲגִיגִי
  choice: mon murmure intérieur
  alternative: mon gémissement ; ma méditation
  rationale: Le contexte de supplication favorise une expression douloureuse, mais le lexème garde une ambiguïté entre pensée intérieure et parole à voix basse. Le rendu choisi préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. « Prête l’oreille » maintient l’image poétique hébraïque sans archaïsme excessif ; l’apostrophe « Yahweh » reste sobre, sans ajouter « ô » absent de l’hébreu.
