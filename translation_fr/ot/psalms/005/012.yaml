source:
  edition: WLC
  text: כִּֽי אַתָּה֮ תְּבָרֵ֪ךְ צַ֫דִּ֥יק יְהוָ֑ה כַּ֝/צִּנָּ֗ה רָצ֥וֹן תַּעְטְרֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/012.yaml
  text: For you bless the righteous[a], O Yahweh; like a shield, favor surrounds him.
translation:
  language: fr
  text: Car toi, tu bénis le juste, Yahweh ; tu l’entoures de ta faveur comme d’un bouclier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour le verbe : « tu le couronnes de faveur ». Le verbe hébreu peut évoquer le fait de couronner ou d’entourer ; l’image du bouclier favorise ici l’idée d’une protection qui enveloppe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement de la confiance exprimée dans le contexte précédent et conserve la valeur explicative ou causale de la particule.
- source_word: תְּבָרֵךְ
  choice: tu bénis
  rationale: L’inaccompli exprime ici une action caractéristique ou tenue pour certaine ; le présent français rend naturellement cette confiance.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé au singulier désigne le juste de manière représentative, sans limiter le propos à un individu précis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: כַּצִּנָּה
  choice: comme d’un bouclier
  rationale: La préposition comparative et l’image protectrice sont rendues naturellement en français ; le terme hébreu peut désigner plus précisément un grand bouclier.
- source_word: רָצוֹן
  choice: ta faveur
  rationale: Dans ce contexte, le nom désigne la disposition favorable de Dieu envers le juste ; le possessif explicite en français le référent déjà indiqué par le sujet divin.
- source_word: תַּעְטְרֶנּוּ
  choice: tu l’entoures
  rationale: Le verbe peut évoquer le fait de couronner ou d’encercler. L’image du bouclier favorise ici l’idée d’un enveloppement protecteur, sans supprimer l’autre possibilité, signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ; le Seigneur
  rationale: Le texte porte directement le tétragramme. La transcription « Yahweh » préserve le nom personnel et évite de le remplacer par un titre.
- issue: Portée de צַדִּיק
  choice: le juste
  alternative: un juste ; les justes
  rationale: Le singulier hébreu est conservé comme désignation générique et représentative, sans transformer explicitement l’énoncé en pluriel collectif.
- issue: Image de תַּעְטְרֶנּוּ avec le bouclier
  choice: tu l’entoures de ta faveur
  alternative: tu le couronnes de faveur
  rationale: Le contexte du bouclier suggère une protection enveloppante, mais l’ambiguïté lexicale entre entourer et couronner est maintenue par une note.
translation_notes:
  register: Français moderne, international et digne. La reprise « toi, tu » conserve l’insistance du pronom hébreu. La formulation reste concise et poétique, avec une ponctuation qui distingue l’affirmation de bénédiction de l’image protectrice.
