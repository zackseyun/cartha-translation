source:
  edition: WLC
  text: לֹֽא יִתְיַצְּב֣וּ הֽ֭וֹלְלִים לְ/נֶ֣גֶד עֵינֶ֑י/ךָ שָׂ֝נֵ֗אתָ כָּל פֹּ֥עֲלֵי אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: fr
  text: Les arrogants[a] ne se tiendront pas devant tes yeux ; tu détestes tous ceux qui font le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vantards », « les présomptueux » ou « les insensés ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous les artisans du mal » ; ou « tous ceux qui commettent l’injustice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: ne tiendront pas
  rationale: Le hitpael de יצב exprime le fait de prendre position ou de se présenter. « Ne tiendront pas » est naturel en français et conserve l’idée qu’ils ne peuvent demeurer en présence de Dieu.
- source_word: הוֹלְלִים
  choice: les arrogants
  rationale: Dans cette forme, le terme désigne ceux qui se glorifient avec présomption. « Les arrogants » rend clairement cette attitude morale en français courant ; « les vantards » reste une possibilité plus concrète.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: devant tes yeux
  rationale: La formulation conserve l’image concrète de l’hébreu tout en évoquant naturellement la présence et le regard de Dieu.
- source_word: שָׂנֵאתָ
  choice: tu détestes
  rationale: Le verbe affirme directement l’aversion de Dieu. « Détester » conserve sa force sans l’atténuer et convient ici au registre du français moderne.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: Cette expression française naturelle maintient le caractère actif du participe et la portée morale de אָוֶן. Une traduction plus formelle serait « les artisans du mal ».
theological_decisions:
- issue: L’affirmation de l’aversion divine
  choice: Conserver l’énoncé direct « tu détestes tous ceux qui font le mal »
  alternative: « tu t’opposes à tous ceux qui font le mal » ou « tu rejettes tous ceux qui font le mal »
  rationale: שָׂנֵאתָ exprime sans détour la haine ou l’aversion. La traduction ne doit pas adoucir cette tension théologique en la réduisant à une simple opposition.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique demeure net ; « devant tes yeux » préserve l’image hébraïque, et le langage relatif à l’aversion divine n’est pas atténué.
