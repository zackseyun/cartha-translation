  text: הִרְעַ֣שְׁתָּה אֶ֣רֶץ פְּצַמְתָּ֑/הּ רְפָ֖/ה שְׁבָרֶ֣י/הָ כִי מָֽטָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/002.yaml
  text: You have shaken the earth; you have split it open. Heal its fractures[a], for it is tottering.
translation:
  language: fr
  text: Tu as ébranlé la terre, tu l’as fendue. Guéris ses fractures[a], car elle chancelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays » plutôt que « de la terre ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays particulier ; le contexte poétique permet les deux nuances.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: tu as ébranlé
  rationale: Le hifil de רָעַשׁ exprime l’action de faire trembler ou secouer. « Ébranlé » restitue naturellement cette force causative et convient au registre poétique.
- source_word: אֶרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner la terre ou un pays. « La terre » convient à l’image du séisme sans exclure une application au pays concerné.
- source_word: פְּצַמְתָּהּ
  choice: tu l’as fendue
  rationale: Le verbe évoque une rupture ou une fissuration. « Fendue » prépare avec précision l’image des fractures dans le membre suivant.
- source_word: רְפָה
  choice: guéris
  rationale: L’impératif de רָפָא signifie normalement « guérir ». Ce choix conserve la personnification poétique de la terre plutôt que de l’aplatir par « répare ».
- source_word: שְׁבָרֶיהָ
  choice: ses fractures
  rationale: שֶׁבֶר désigne une cassure, une fracture ou une brèche. « Fractures » s’accorde bien avec l’image sismique et avec le verbe « guérir ».
- source_word: כִי
  choice: car
  rationale: La conjonction introduit ici le motif de la supplication. « Car » est concis et dignement poétique.
- source_word: מָטָה
  choice: elle chancelle
  rationale: Le verbe décrit ce qui penche, vacille ou menace de céder. « Chancelle » rend l’instabilité en cours sans suggérer un effondrement déjà achevé.
