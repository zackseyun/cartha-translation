  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ ו/ענ/נו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: fr
  text: Afin que ceux que tu aimes soient délivrés[a], sauve-les par ta main droite et réponds-nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient secourus ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre lecture : « réponds-moi ».'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: Afin que
  rationale: Introduit le but ou le résultat recherché et convient naturellement à une prière en français moderne.
- source_word: יֵחָלְצוּן
  choice: soient délivrés
  rationale: Le nifal de חלץ exprime ici le fait d’être tiré du danger, délivré ou secouru. « Délivrés » garde la force du verbe sans préciser indûment la nature du péril.
- source_word: יְדִידֶיךָ
  choice: ceux que tu aimes
  rationale: Rend clairement le pluriel et l’affection exprimée par le nom hébreu, dans une formulation naturelle pour le lecteur moderne.
- source_word: הוֹשִׁיעָה
  choice: sauve-les
  rationale: L’impératif demande directement l’action salvatrice de Dieu. Le pronom « les », implicite en hébreu, reprend naturellement « ceux que tu aimes » en français.
- source_word: יְמִינְךָ
  choice: par ta main droite
  rationale: Exprime le moyen de l’action tout en conservant l’image hébraïque de la main droite comme manifestation de la puissance salvatrice de Dieu.
- source_word: וַעֲנֵנוּ
  choice: et réponds-nous
  rationale: 'La vocalisation et la segmentation fournies portent un suffixe de première personne du pluriel : la supplication est donc rendue au pluriel.'
theological_decisions:
- issue: Image de la main droite divine
  choice: Conserver « par ta main droite »
  alternative: Paraphraser par « par ta puissance »
  rationale: L’image anthropomorphique appartient à la poésie et à la théologie du texte; la conserver évite d’en réduire la portée.
- issue: Suffixe du dernier verbe
  choice: « réponds-nous » dans le texte principal
  alternative: « réponds-moi » selon une variante de lecture attestée et le passage parallèle de Psaumes 108.7
  rationale: Le texte massorétique fourni se lit au pluriel. La lecture au singulier mérite toutefois d’être signalée en note sans remplacer la forme du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux que tu aimes » évite l’ambiguïté possible de « tes bien-aimés », tandis que « sauve-les » explicite en français l’objet suggéré par la proposition de but.
