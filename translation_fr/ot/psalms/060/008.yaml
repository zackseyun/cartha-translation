  text: מוֹאָ֤ב סִ֬יר רַחְצִ֗/י עַל אֱ֭דוֹם אַשְׁלִ֣יךְ נַעֲלִ֑/י עָ֝לַ֗/י פְּלֶ֣שֶׁת הִתְרֹעָֽעִֽי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/008.yaml
  text: Moab is my washbasin[a]; on Edom I cast my sandal; over Philistia[b], shout in triumph for me.
translation:
  language: fr
  text: 'Moab est le bassin où je me lave ;

    sur Édom, je jette ma sandale ;

    Philistie, pousse des cris de triomphe pour moi[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu est difficile. Autre traduction possible, notamment d’après le passage parallèle en Psaume 108.10 : « Sur la Philistie, je pousse des cris de triomphe. » Ici, le texte massorétique se lit comme un ordre adressé à la Philistie personnifiée, probablement avec une nuance ironique de soumission.'
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: le bassin où je me lave
  rationale: סִיר désigne un récipient ou bassin, et רַחְצִי en précise l’usage pour la toilette. Cette formulation concrète et actuelle conserve l’image humiliante de la mise au service et de la soumission.
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: je jette ma sandale
  rationale: Le hifil de שלך exprime l’action de jeter, tandis que נַעַל désigne une chaussure, ici rendue par « sandale » conformément au cadre ancien. La tournure garde l’image de domination sans en préciser abusivement le geste symbolique.
- source_word: עַל אֱדוֹם
  choice: sur Édom
  rationale: La préposition עַל garde ici sa valeur spatiale directe dans l’image de la sandale jetée sur Édom.
- source_word: עָלַי ... הִתְרֹעָעִי
  choice: pousse pour moi des cris de triomphe
  rationale: Le suffixe de première personne dans עָלַי est rendu naturellement par « pour moi ». La forme verbale massorétique est un impératif féminin singulier adressé à la Philistie et évoque une clameur retentissante, vraisemblablement triomphale dans ce contexte.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Moab / Édom / Philistie
  rationale: Les noms géographiques suivent leurs formes françaises usuelles ; « Philistie » désigne ici le pays ou la nation personnifiée.
theological_decisions:
- issue: Valeur de l’impératif הִתְרֹעָעִי adressé à la Philistie
  choice: Une injonction, probablement ironique, à pousser des cris de triomphe pour le locuteur victorieux
  alternative: « Sur la Philistie, je pousse des cris de triomphe », selon une autre lecture du verbe, notamment suggérée par le passage parallèle de Psaume 108.10
  rationale: Le texte massorétique de ce verset porte grammaticalement un impératif féminin singulier, qui peut s’adresser à la Philistie personnifiée. Le contexte de soumission des nations donne vraisemblablement à l’ordre une force ironique, mais la traduction ne l’explicite pas dans le corps du texte. La lecture à la première personne demeure signalée en note afin de préserver la difficulté textuelle et l’ambiguïté.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme en trois lignes est conservé. « Bassin où je me lave » évite l’archaïsme de « pot à laver » tout en maintenant l’image concrète ; « pousse des cris de triomphe » garde la dimension sonore du verbe sans imposer exclusivement l’idée d’un cri de guerre.
