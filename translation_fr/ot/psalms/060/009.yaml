lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Pronom interrogatif introduisant chacune des deux questions rhétoriques.
- source_word: יֹבִלֵנִי
  choice: me conduira
  rationale: Le hiphil de יבל exprime le fait de faire aller quelqu’un, donc de le conduire ou de l’amener vers une destination.
- source_word: עִיר מָצוֹר
  choice: la ville fortifiée
  rationale: L’expression désigne naturellement une ville caractérisée par ses fortifications, plutôt qu’une ville assiégée.
- source_word: נָחַנִי
  choice: me mènera
  rationale: Le verbe נחה signifie « conduire, guider ». Le futur français maintient le parallélisme prospectif, tout en signalant en note la nuance aspectuelle possible du parfait hébreu.
- source_word: עַד אֱדוֹם
  choice: jusqu’en Édom
  rationale: עַד indique le terme atteint. Avec un nom de région, « jusqu’en Édom » est idiomatique et précis en français.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Forme française traditionnelle et actuelle du nom propre biblique.
