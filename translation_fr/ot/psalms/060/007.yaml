  text: לִ֤/י גִלְעָ֨ד וְ/לִ֬/י מְנַשֶּׁ֗ה וְ֭/אֶפְרַיִם מָע֣וֹז רֹאשִׁ֑/י יְ֝הוּדָ֗ה מְחֹֽקְקִ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/007.yaml
  text: Gilead is mine[a], and Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my scepter.
translation:
  language: fr
  text: À moi Galaad, à moi Manassé ; Éphraïm est la forteresse de ma tête ; Juda est mon sceptre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui établit mes décrets » ou « mon bâton de commandement ». Le terme hébreu peut désigner celui qui décrète, ou le bâton, le sceptre, qui symbolise mon autorité.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִי
  choice: à moi
  rationale: La préposition avec suffixe de première personne exprime la possession. La tournure nominale « à moi » garde la concision et le parallélisme poétiques de l’hébreu.
- source_word: גִלְעָד
  choice: Galaad
  rationale: Forme française traditionnelle et courante du nom géographique.
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Forme française traditionnelle du nom tribal et régional.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Forme française usuelle du nom tribal.
- source_word: מָעוֹז
  choice: forteresse
  rationale: Le nom désigne un lieu ou un moyen de protection et de puissance ; « forteresse » conserve ici l’image militaire.
- source_word: רֹאשִׁי
  choice: ma tête
  rationale: La traduction concrète maintient la métaphore hébraïque sans en imposer une interprétation particulière.
- source_word: מְחֹקְקִי
  choice: mon sceptre
  rationale: Dans ce contexte royal et territorial, « sceptre » exprime naturellement l’autorité souveraine symbolisée par Juda, tout en conservant en note les autres sens possibles.
theological_decisions:
- issue: Sens de מְחֹקְקִי dans l’imagerie royale
  choice: mon sceptre
  alternative: celui qui établit mes décrets ; mon bâton de commandement
  rationale: Le mot peut désigner celui qui promulgue des décrets ou l’insigne de son autorité. « Mon sceptre » convient au parallélisme politico-militaire sans réduire silencieusement la gamme de sens, signalée en note.
- issue: Métaphore מָעוֹז רֹאשִׁי
  choice: la forteresse de ma tête
  alternative: une forteresse pour ma tête ; la force de ma tête
  rationale: La formulation préserve le rapport construit et l’image volontairement compacte de l’hébreu, plutôt que d’expliciter sa fonction protectrice.
translation_notes:
  register: Français moderne, sobre et poétique. L’ellipse « À moi… » reproduit la vigueur du parallélisme hébreu. La métaphore inhabituelle « la forteresse de ma tête » est maintenue afin de préserver l’image et son ambiguïté.
