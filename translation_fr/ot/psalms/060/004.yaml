id: PSA.60.4
reference: Psalms 60:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נָ֘תַ֤תָּה לִּ/ירֵאֶ֣י/ךָ נֵּ֭ס לְ/הִתְנוֹסֵ֑ס מִ֝/פְּנֵ֗י קֹ֣שֶׁט סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/004.yaml
  text: You have given a banner to those who fear you[a], to be raised up because of the truth[b]. Selah
translation:
  language: fr
  text: Tu as donné à ceux qui te craignent une bannière à déployer[a] à cause de la vérité[b]. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à brandir », « pour qu’ils se rallient », ou peut-être « pour fuir ». Le verbe hébreu est difficile et son sens est débattu.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu qoshet signifie très probablement « vérité » ou « véracité »; certaines versions anciennes et certains interprètes comprennent autrement cette ligne et traduisent notamment « à cause de l’arc ».
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Tu as donné
  rationale: Le qal accompli, deuxième personne du masculin singulier, s’adresse à Dieu. Le passé composé exprime naturellement en français une action accomplie dont l’effet demeure.
- source_word: לִירֵאֶיךָ
  choice: à ceux qui te craignent
  rationale: Cette formulation française courante conserve l’idée biblique de révérence envers Dieu, sans la réduire à la terreur.
- source_word: נֵס
  choice: une bannière
  rationale: Le nom désigne un étendard ou signal élevé. « Bannière » restitue clairement l’image publique et militaire.
- source_word: לְהִתְנוֹסֵס
  choice: à déployer
  rationale: La forme verbale est difficile et discutée. Dans son association avec נֵס, « à déployer » rend naturellement l’image d’une bannière rendue visible, tout en signalant d’autres possibilités en note.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La locution signifie littéralement « de devant la face de », mais peut ici recevoir une valeur causale cohérente avec le contexte.
- source_word: קֹשֶׁט
  choice: la vérité
  rationale: Ce terme poétique signifie très probablement « vérité » ou « véracité ». L’article est ajouté selon l’usage naturel du français; l’autre lecture traditionnelle est conservée en note.
- source_word: סֶלָה
  choice: Sélah
  rationale: Translittération traditionnelle de ce terme liturgique ou musical dont le sens précis demeure incertain.
theological_decisions:
- issue: Rapport entre la bannière et קֹשֶׁט
  choice: à cause de la vérité
  alternative: à cause de l’arc
  rationale: Le texte massorétique soutient le sens « vérité/véracité », mais une compréhension ancienne différente de la ligne mérite d’être signalée sans être intégrée au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu. « Craignent » conserve le vocabulaire biblique de la révérence. La formulation reste concise et poétique, et les ambiguïtés lexicales réelles sont préservées dans les notes.
