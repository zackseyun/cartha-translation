    issue: « des choses dures »
    rationale: Cette formulation reproduit trop littéralement l’anglais et l’hébreu, mais n’est pas naturelle en français international moderne. « De rudes épreuves » exprime le collectif substantivé sans imposer une interprétation doctrinale.
  - severity: low
    issue: « un vin qui donne le vertige »
    rationale: Le « vertige » peut évoquer principalement une sensation rotatoire, tandis que תַּרְעֵלָה renvoie plus directement au vacillement, au titubement ou à la désorientation. « Qui fait chanceler » préserve mieux l’image.
