  text: הִרְאִ֣יתָה עַמְּ/ךָ֣ קָשָׁ֑ה הִ֝שְׁקִיתָ֗/נוּ יַ֣יִן תַּרְעֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: fr
  text: Tu as fait connaître à ton peuple de rudes épreuves ; tu nous as fait boire un vin qui fait chanceler.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un vin d’étourdissement » ou « un vin de désorientation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: Tu as fait voir
  rationale: Le hiphil de ראה signifie « faire voir, montrer ». « Faire voir » conserve ici l’idée que Dieu a amené son peuple à connaître concrètement ces épreuves.
- source_word: עַמְּךָ
  choice: à ton peuple
  rationale: עַם désigne ici le peuple qui appartient à Dieu ; « ton peuple » est naturel et respecte la portée relationnelle du texte.
- source_word: קָשָׁה
  choice: des choses dures
  rationale: L’adjectif féminin singulier est employé substantivement et collectivement pour évoquer une dure réalité ou de rudes expériences. La formulation concise préserve l’indétermination de l’hébreu.
- source_word: הִשְׁקִיתָנוּ
  choice: tu nous as fait boire
  rationale: Le hiphil de שׁקה exprime le fait de donner ou faire boire. « Tu nous as fait boire » rend clairement la valeur causative et imposée.
- source_word: יַיִן
  choice: un vin
  rationale: Le terme courant pour « vin » est maintenu afin de préserver l’image métaphorique du texte.
- source_word: תַּרְעֵלָה
  choice: qui donne le vertige
  rationale: Le nom évoque le vacillement, l’étourdissement ou la désorientation. Cette proposition relative est idiomatique en français et conserve l’effet produit par ce vin sans préciser indûment s’il s’agit seulement d’ivresse ou aussi de confusion.
theological_decisions:
- issue: Portée métaphorique du vin
  choice: Conserver l’image d’un vin imposé par Dieu qui provoque vertige et désorientation.
  alternative: Remplacer l’image par une paraphrase explicite telle que « tu nous as plongés dans la détresse » ou comprendre un vin littéral.
  rationale: Le parallélisme avec les « choses dures » favorise une image de détresse ou de jugement vécu comme une désorientation. Garder le vin dans le texte respecte la métaphore biblique et évite d’en fixer trop étroitement l’interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. « Des choses dures » conserve la concision et l’étrangeté mesurée de l’hébreu ; « qui donne le vertige » rend naturellement l’image finale. Le tutoiement correspond à l’adresse directe à Dieu.
