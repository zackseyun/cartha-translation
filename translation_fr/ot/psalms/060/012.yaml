id: PSA.60.12
reference: Psalms 60:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: fr
  text: Avec Dieu[a], nous accomplirons des exploits, et c’est lui qui piétinera nos adversaires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par Dieu ». La préposition hébraïque peut exprimer l’association étroite ou le moyen.
    reason: lexical_alternative
  - marker: b
    text: Ou « foulera aux pieds nos ennemis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Avec Dieu
  rationale: La préposition ב peut ici exprimer l’association étroite ou le moyen. « Avec Dieu » est naturel en français et exprime la dépendance envers Dieu sans exclure la nuance « par Dieu ».
- source_word: נַעֲשֶׂה חָיִל
  choice: nous accomplirons des exploits
  rationale: L’expression idiomatique formée de עשה et חַיִל évoque une action vaillante ou des hauts faits. « Accomplir des exploits » restitue clairement et dignement cette valeur dans le contexte militaire et poétique.
- source_word: וְהוּא
  choice: et c’est lui
  rationale: Le pronom indépendant הוּא met le sujet en relief. « C’est lui » conserve cette insistance tout en maintenant la coordination avec l’action humaine mentionnée auparavant.
- source_word: יָבוּס
  choice: piétinera
  rationale: Le verbe בוס décrit l’action de fouler ou de piétiner. Ce choix conserve l’image martiale concrète sans l’atténuer en une formulation abstraite.
- source_word: צָרֵינוּ
  choice: nos adversaires
  rationale: צָר désigne des ennemis ou des adversaires. « Adversaires » reste proche de l’étendue lexicale du terme et convient au contexte de conflit.
theological_decisions:
- issue: L’action humaine et l’action divine dans la victoire
  choice: Le peuple accomplit des exploits avec Dieu, tandis que Dieu lui-même piétine les adversaires.
  alternative: Mettre exclusivement l’accent soit sur l’effort humain, soit sur l’action divine.
  rationale: 'L’hébreu maintient ensemble les deux affirmations : « nous » agissons avec Dieu, et « lui » accomplit l’action décisive contre les adversaires. La traduction préserve cette tension sans réduire l’un des deux aspects.'
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique demeure clair; « accomplir des exploits » rend l’idiome hébreu, et « c’est lui » conserve l’emphase portée par le pronom indépendant.
