id: PSA.60.6
reference: Psalms 60:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶ֫עְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: fr
  text: 'Dieu a parlé dans sa sainteté[a] : « Je me réjouirai[b] ; je partagerai Sichem et je mesurerai la vallée de Soukkoth. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans son lieu saint » ou « par sa sainteté ». L’expression hébraïque peut désigner la sainteté même de Dieu ou la sphère de sa sainte présence.'
    reason: lexical_alternative
  - marker: b
    text: On peut aussi comprendre « Je me réjouirai » comme la réponse du psalmiste à la parole de Dieu, plutôt que comme le début de la déclaration divine.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom, bien que de forme plurielle, régit ici le verbe singulier דִּבֶּר et désigne le Dieu d’Israël.
- source_word: דִּבֶּר
  choice: a parlé
  rationale: Le parfait présente la parole divine comme prononcée et toujours pertinente; le passé composé est naturel en français moderne.
- source_word: בְּקָדְשׁוֹ
  choice: dans sa sainteté
  rationale: Cette traduction conserve la formulation compacte et l’ambiguïté entre la sainteté propre de Dieu et la sphère de sa présence sainte.
- source_word: אֶעְלֹזָה
  choice: Je triompherai
  rationale: Le verbe exprime une joie exultante; dans ce contexte royal et territorial, « triompher » rend naturellement sa coloration victorieuse.
- source_word: אֲחַלְּקָה
  choice: Je partagerai
  rationale: Le verbe évoque le partage ou la répartition d’un territoire; « partager » reste clair sans expliciter excessivement l’attribution.
- source_word: שְׁכֶם
  choice: Sichem
  rationale: Forme française traditionnelle et largement reconnue de ce nom géographique biblique.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: la vallée de Soukkoth
  rationale: Le groupe construit désigne la région géographique liée à Soukkoth; cette translittération française distingue clairement les consonnes du nom hébreu.
- source_word: אֲמַדֵּד
  choice: je mesurerai
  rationale: Le piel conserve ici l’image de mesurer ou délimiter un territoire; le contexte laisse entendre l’exercice de la souveraineté sans qu’il faille ajouter « répartirai ».
theological_decisions:
- issue: Portée de la citation et identité du locuteur de אֶעְלֹזָה
  choice: Les trois verbes à la première personne sont présentés comme les paroles de Dieu.
  alternative: Le psalmiste pourrait dire « Je triompherai » en réponse à la parole de Dieu, avant que l’oracle divin commence avec « Je partagerai Sichem ».
  rationale: Après la formule introductive « Dieu a parlé », la suite s’enchaîne naturellement comme un oracle divin, et les actes de partager Sichem et de mesurer la vallée correspondent à la souveraineté territoriale de Dieu. L’autre découpage demeure toutefois grammaticalement possible et est signalé en note.
- issue: Sens de בְּקָדְשׁוֹ
  choice: dans sa sainteté
  alternative: dans son lieu saint; par sa sainteté
  rationale: L’hébreu peut évoquer soit la sainteté de Dieu, soit la sphère de sa présence sainte. La traduction principale garde cette densité sans imposer l’image plus précise d’un sanctuaire.
translation_notes:
  register: Français international moderne, digne et accessible. « Sichem » suit l’usage biblique français courant; « Soukkoth » représente directement le nom hébreu. La ponctuation marque l’oracle sans effacer l’ambiguïté de son point de départ, conservée en note.
