source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/011.yaml
  text: Give us help against the adversary[c][b][a], for the salvation of man is vain.
translation:
  language: fr
  text: Accorde-nous ton aide contre l’adversaire[a], car le secours humain[b] est vain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la détresse » ; le mot hébreu peut désigner soit la détresse, soit un adversaire ou un ennemi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le salut de l’être humain » ; le mot traduit par « secours » peut aussi signifier « délivrance », « salut » ou « victoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Accorde
  rationale: Dans cette prière adressée à Dieu, l’impératif idiomatique exprime une demande pressante. « Accorde » est naturel et digne en français.
- source_word: לָּנוּ
  choice: nous
  rationale: Pronom de première personne du pluriel, complément du verbe de demande.
- source_word: עֶזְרַת
  choice: aide
  rationale: Le nom signifie « aide » ou « secours ». « Aide » s’emploie naturellement avec « contre l’adversaire ».
- source_word: מִצָּר
  choice: contre l’adversaire
  rationale: צַר peut désigner la détresse ou un adversaire. Le contexte militaire du psaume favorise ici le sens personnel, et la préposition est rendue idiomatiquement par « contre ».
- source_word: וְשָׁוְא
  choice: car ... est vain
  rationale: שָׁוְא exprime la vanité, l’inanité ou l’inefficacité. « Est vain » conserve la brièveté et la force poétique de l’hébreu ; la conjonction introduit naturellement la raison de la demande.
- source_word: תְּשׁוּעַת
  choice: le secours
  rationale: Dans ce contexte de conflit, le terme évoque le salut, la délivrance ou la victoire. « Secours » rend clairement l’intervention salvatrice sans imposer un sens exclusivement spirituel.
- source_word: אָדָם
  choice: humain
  rationale: אָדָם désigne ici l’être humain ou l’humanité en général, par contraste avec Dieu. L’adjectif « humain » exprime ce sens collectif de façon naturelle et inclusive.
theological_decisions:
- issue: Contraste entre l’aide divine et le secours humain
  choice: Le secours humain est déclaré vain dans le cadre de la demande adressée à Dieu.
  alternative: Une affirmation générale selon laquelle tout effort humain serait vain.
  rationale: Le verset oppose directement l’aide sollicitée auprès de Dieu à l’inefficacité du secours humain, sans élargir explicitement cette affirmation à toute activité humaine.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement de Dieu convient à l’usage biblique français courant. La formulation reste concise et poétique, tout en signalant les ambiguïtés lexicales réelles de צַר et תְּשׁוּעָה.
