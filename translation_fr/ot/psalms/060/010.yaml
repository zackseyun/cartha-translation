id: PSA.60.10
reference: Psalms 60:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: fr
  text: N’est-ce pas toi, ô Dieu, qui nous as rejetés[a] et qui ne sors pas, ô Dieu, avec nos armées[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « repoussés » ou « abandonnés ».
    reason: lexical_alternative
  - marker: b
    text: « Sortir avec nos armées » signifie ici partir avec elles au combat.
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא
  choice: N’est-ce pas
  rationale: Introduit une question rhétorique qui attend une réponse affirmative et permet de maintenir les deux propositions dans une même interrogation.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom indépendant est mis en relief naturellement en français par la tournure « N’est-ce pas toi… ».
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom fonctionne comme une apostrophe. Sa répétition dans la seconde proposition est conservée conformément à l’hébreu.
- source_word: זְנַחְתָּנוּ
  choice: nous as rejetés
  rationale: זנח exprime le rejet ou la mise à l’écart. « Rejetés » est actuel, clair et ne réduit pas la force de la plainte.
- source_word: וְלֹא תֵצֵא
  choice: et qui ne sors pas
  rationale: La négation et l’imparfait décrivent ici l’absence de Dieu auprès des troupes. La proposition relative maintient clairement la portée de la question initiale.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: avec nos armées
  rationale: Dans ce contexte militaire, צבאות désigne les forces armées, et la préposition exprime naturellement l’accompagnement.
theological_decisions:
- issue: Le rejet du peuple et l’absence de Dieu au combat
  choice: Conserver l’affirmation directe selon laquelle Dieu a rejeté les siens et ne sort pas avec leurs armées.
  alternative: Atténuer par « tu as permis que nous soyons rejetés » ou « tu sembles nous avoir rejetés ».
  rationale: L’hébreu attribue directement à Dieu le rejet et son absence au combat. La plainte garde ainsi toute sa tension théologique.
- issue: Portée interrogative de הֲלֹא
  choice: Présenter les deux propositions comme les éléments d’une seule question rhétorique.
  alternative: 'Clore la question après « rejetés », puis traduire la seconde proposition comme une déclaration indépendante : « Tu ne sors pas… »'
  rationale: Cette construction rend de façon cohérente la lecture où הֲלֹא gouverne l’ensemble de la phrase, tout en évitant que la seconde proposition soit comprise comme un ordre négatif.
translation_notes:
  register: Français international moderne, digne et direct. La tournure interrogative « N’est-ce pas toi… qui… » restitue l’insistance du pronom hébreu. Le verbe concret « sortir » conserve l’image militaire originale, explicitée en note.
