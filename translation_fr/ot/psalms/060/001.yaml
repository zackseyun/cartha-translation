id: PSA.60.1
reference: Psalms 60:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: fr
  text: Dieu, tu nous as rejetés ; tu as ouvert une brèche parmi nous ; tu t’es mis en colère. Rétablis-nous[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reviens vers nous. » L’hébreu peut évoquer soit le rétablissement du peuple, soit le retour de Dieu auprès de lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est employé ici comme apostrophe directe. « Dieu » est naturel en français moderne, sans qu’il soit nécessaire d’ajouter le vocatif littéraire « ô ».
- source_word: זְנַחְתָּנוּ
  choice: tu nous as rejetés
  rationale: זנח exprime le rejet ou l’abandon. « Rejetés » est clair, actuel et conserve la force relationnelle du verbe.
- source_word: פְרַצְתָּנוּ
  choice: tu as ouvert une brèche parmi nous
  rationale: פרץ évoque l’action de rompre une défense ou d’y ouvrir une brèche. Cette formulation française conserve l’image violente de la désagrégation du peuple sans employer le peu naturel « tu nous as bréchés ».
- source_word: אָנַפְתָּ
  choice: tu t’es mis en colère
  rationale: Le verbe désigne la colère. Cette tournure naturelle rend l’action passée sans amplifier indûment le terme en parlant de fureur.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Rétablis-nous
  rationale: La forme issue de שוב demande le renversement de la situation provoquée par le jugement. « Rétablis-nous » exprime naturellement la restauration du peuple, tandis que la possibilité d’un retour de Dieu vers lui est signalée en note.
theological_decisions:
- issue: Sens de la demande finale תְּשׁוֹבֵב לָנוּ
  choice: Une demande adressée à Dieu pour qu’il rétablisse son peuple après le jugement
  alternative: '« Reviens vers nous » : une demande pour que Dieu retourne auprès de son peuple'
  rationale: L’expression hébraïque permet de comprendre soit que Dieu restaure le peuple, soit qu’il revienne vers lui. Le texte principal suit le mouvement du rejet vers le rétablissement, mais la note préserve l’autre lecture sans dissocier artificiellement retour divin et restauration communautaire.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement convient à l’adresse biblique à Dieu. Les points-virgules maintiennent la succession solennelle des verbes hébreux, et l’image de la brèche est conservée sous une forme idiomatique.
