  source_fidelity: 'Le texte rend fidèlement la succession des parfaits hébreux : rejet, brèche infligée au peuple, colère divine, puis demande de renversement. « Tu as ouvert une brèche parmi nous » exprime de manière idiomatique l’image de פְרַצְתָּנוּ sans transformer le peuple en objet matériel d’un verbe français peu naturel. La demande finale « Rétablis-nous » est une lecture défendable de תְּשׁוֹבֵב לָנוּ, dont l’ambiguïté pertinente est préservée en note.'
  naturalness: Le français est moderne, direct et digne. L’apostrophe « Dieu », le tutoiement, les points-virgules et l’impératif final conviennent au registre d’une lamentation psalmique. « Tu t’es mis en colère » est naturel et conserve la force verbale sans surinterpréter la colère comme une fureur.
  terminology: « Dieu », « rejetés », « brèche », « colère » et « rétablis-nous » sont cohérents avec le vocabulaire biblique français contemporain et ne chargent pas le texte d’une interprétation confessionnelle. La note rend clairement l’alternative relationnelle, « Reviens vers nous ».
