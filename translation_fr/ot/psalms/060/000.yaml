base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: fr
  text: 'Au chef de chœur : sur « Le lis du témoignage »[a]. Miktam[b] de David[c], pour enseigner.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « sur l’air du “Lis du témoignage” ». L’hébreu conserve vraisemblablement un titre musical ou liturgique, mais son sens exact est incertain.'
    reason: lexical_alternative
  - marker: b
    text: « Miktam » transcrit un terme hébreu désignant un genre dont le sens exact est incertain, peut-être une indication musicale ou littéraire.
    reason: lexical_alternative
  - marker: c
    text: « De David » peut aussi signifier « par David » ou « pour David » ; la construction hébraïque peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. Cette formulation est concise, naturelle et conserve sa fonction liturgique.
- source_word: עַל
  choice: Sur
  rationale: La préposition peut introduire un air, un accompagnement ou une indication liturgique. « Sur » conserve cette souplesse sans imposer une interprétation précise.
- source_word: שׁוּשַׁן עֵדוּת
  choice: « Le lis du témoignage »
  rationale: L’expression semble être un titre musical ou liturgique dont le sens exact demeure incertain. Une traduction formelle entre guillemets rend visible ce caractère de titre.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Le sens de ce terme hébreu désignant probablement un genre musical ou littéraire est incertain. La translittération évite une traduction conjecturale.
- source_word: לְדָוִד
  choice: de David
  rationale: La construction hébraïque peut exprimer l’auteur, l’association ou la dédicace. « De David » préserve mieux cette ambiguïté que « par David » ou « pour David ».
- source_word: לְלַמֵּד
  choice: pour enseigner
  rationale: L’infinitif précédé de la préposition exprime ici le but. Cette formulation française restitue directement la valeur pédagogique indiquée par l’hébreu.
