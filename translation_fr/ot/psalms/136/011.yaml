source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א יִ֭שְׂרָאֵל מִ/תּוֹכָ֑/ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/011.yaml
  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: et fit sortir Israël du milieu d’eux, car son amour fidèle dure pour toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: et fit sortir
  rationale: 'Le hiphil de יצא exprime la causation : « faire sortir ». Cette formulation française conserve directement cette valeur sans préciser indûment la manière.'
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre désignant ici le peuple d’Israël, selon le contexte de la sortie d’Égypte.
- source_word: מִתּוֹכָם
  choice: du milieu d’eux
  rationale: La locution désigne une sortie hors de l’intérieur ou du sein d’un groupe. « Du milieu d’eux » reste naturel et conserve le pronom pluriel du texte hébreu.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain du psaume, כִּי introduit le motif de la louange. « Car » en maintient la valeur causale et la cadence liturgique.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. « Dure » fournit en français le lien verbal nécessaire et rend l’idée de permanence portée par לְעוֹלָם.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד associe bonté, attachement et fidélité durable. « Amour fidèle » restitue ces dimensions sans limiter le terme à la seule compassion ni expliciter excessivement une notion d’alliance.
theological_decisions:
- issue: Rendu de חַסְדּוֹ dans le refrain du Psaume 136
  choice: son amour fidèle dure pour toujours
  alternative: sa bonté dure pour toujours ; sa miséricorde dure éternellement
  rationale: « Amour fidèle » maintient ensemble la bienveillance et la loyauté durable exprimées par חסד. Le verbe « dure », absent mais impliqué dans la phrase nominale hébraïque, donne un français naturel sans résoudre davantage la portée théologique du mot.
translation_notes:
  register: Français moderne, digne et liturgique. « Fit sortir » conserve nettement la forme causative hébraïque ; « du milieu d’eux » garde la structure et le référent pluriel du texte source.
