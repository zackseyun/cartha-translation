  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: et fit passer Israël au milieu de la mer, car son amour fidèle demeure pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu חֶסֶד peut aussi désigner la bonté, la miséricorde ou la fidélité à l’alliance, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִיר
  choice: et fit passer
  rationale: 'Le hiphil de עבר exprime ici une action causative : Dieu fit passer Israël. Cette formulation française reste naturelle tout en conservant explicitement la valeur causative de l’hébreu.'
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre rendu selon l’usage français courant.
- source_word: בְּ/תוֹכ֑/וֹ
  choice: en son milieu
  rationale: L’expression signifie littéralement « dans son milieu ». Le pronom renvoie à la mer mentionnée au verset précédent, et la formulation préserve l’image spatiale du texte.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain liturgique du psaume, כִּי introduit le motif de la louange. « Car » rend clairement ce rapport en français soutenu mais courant.
- source_word: לְ/עוֹלָם
  choice: demeure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. « Demeure pour toujours » restitue naturellement en français la permanence continue indiquée par לְעוֹלָם.
- source_word: חַסְדּֽ/וֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté, bonté et fidélité relationnelle. « Amour fidèle » en exprime de façon concise les dimensions affective et durable sans imposer une terminologie confessionnelle.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle demeure pour toujours
  alternative: sa bonté demeure pour toujours ; sa fidélité à l’alliance demeure pour toujours ; sa miséricorde demeure pour toujours
  rationale: « Amour fidèle » conserve à la fois la bienveillance et la loyauté durable exprimées par חֶסֶד. La note signale les autres nuances légitimes sans réduire le terme à une seule dimension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Fit passer » conserve la causalité de la forme hébraïque, tandis que « en son milieu » maintient l’image poétique de la traversée. Le refrain privilégie une formulation fluide et mémorisable.
