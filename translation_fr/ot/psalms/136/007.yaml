id: PSA.136.7
reference: Psalms 136:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: À celui qui a fait les grands luminaires[a], car son amour fidèle est éternel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les grandes lumières ». L’hébreu désigne ici les grands corps célestes qui donnent la lumière.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa fidélité envers son alliance est éternelle ». Le mot hébreu חֶסֶד évoque un amour loyal, bienveillant et durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: À celui qui a fait
  rationale: La préposition לְ maintient la formule de louange adressée « à celui qui… ». Le participe עֹשֵׂה est rendu par un acte accompli, conformément au contexte des œuvres créatrices célébrées dans le psaume.
- source_word: אוֹרִים גְּדֹלִים
  choice: les grandes lumières
  rationale: Cette expression claire et digne conserve l’écho du récit de la création en Genèse 1. Il s’agit des corps célestes qui donnent la lumière.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain, la conjonction introduit le motif de la louange et garde sa valeur explicative.
- source_word: לְעוֹלָם
  choice: est éternel
  rationale: L’hébreu signifie littéralement « pour toujours ». L’ajout du verbe « est », implicite en hébreu, produit en français un refrain naturel sans ajouter l’idée plus spécifique de résistance suggérée par « dure ».
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, bonté et loyauté durable. « Amour fidèle » en préserve l’ampleur sans le réduire à la seule émotion, à la seule miséricorde ou à un terme juridique.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain
  choice: son amour fidèle est éternel
  alternative: sa fidélité envers son alliance est éternelle
  rationale: « Amour fidèle » exprime à la fois l’attachement et la loyauté durable, tout en préservant la richesse du terme hébreu. L’autre formulation rend explicite la dimension d’alliance, mais la précise davantage que ne le fait ce verset pris isolément.
translation_notes:
  register: Français international moderne, simple et digne. La structure « À celui qui… » conserve la forme litanique du psaume, et le refrain reste bref et mémorisable.
