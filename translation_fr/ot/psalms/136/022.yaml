  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'un héritage[a] pour Israël, son serviteur,

    car son amour fidèle[b] dure toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un patrimoine » ou « une possession ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne un amour constant et loyal, souvent manifesté dans le cadre d’une alliance ; on peut aussi traduire par « bonté fidèle » ou « miséricorde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: en héritage
  rationale: Le nom désigne un bien reçu en partage ou transmis comme possession. Dans le prolongement du verset précédent, « en héritage » exprime naturellement en français la fonction de la terre donnée à Israël.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: La préposition לְ marque ici le bénéficiaire ou le destinataire de l’héritage ; « à Israël » convient à la construction française « donner en héritage à » sous-entendue par le contexte.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Dans ce contexte, עֶבֶד est un titre relationnel et collectif qui présente Israël comme appartenant à Dieu et le servant, sans mettre l’accent sur l’esclavage.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le refrain qui donne le motif de la louange ; « car » en conserve la fonction liturgique et poétique.
- source_word: לְעוֹלָם
  choice: dure toujours
  rationale: L’expression indique une durée sans fin. Associée à חַסְדּוֹ, la formulation « dure toujours » est idiomatique et maintient l’idée de permanence.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et constance dans la relation. « Amour fidèle » transmet ces dimensions sans réduire le terme à la seule compassion ni expliciter excessivement la notion d’alliance.
theological_decisions:
- issue: La relation d’Israël à Dieu dans עַבְדּוֹ
  choice: son serviteur
  alternative: son esclave
  rationale: Le terme affirme qu’Israël appartient à Dieu et le sert, mais le contexte célèbre le don de la terre et ne met pas au premier plan une condition de servitude forcée. « Serviteur » convient donc mieux comme titre collectif et relationnel.
- issue: Le sens de חַסְדּוֹ dans le refrain
  choice: son amour fidèle
  alternative: sa bonté ; sa miséricorde ; son amour d’alliance
  rationale: « Amour fidèle » conserve la tension entre affection, bonté et loyauté durable, sans limiter le mot à la pitié ni introduire dans le texte le terme interprétatif « alliance ».
translation_notes:
  register: Français moderne, sobre et liturgique. Le début en syntagme (« en héritage ») conserve le lien syntaxique avec le verset précédent sans ajouter un verbe absent de l’hébreu. Le refrain privilégie une formulation naturelle et mémorisable.
