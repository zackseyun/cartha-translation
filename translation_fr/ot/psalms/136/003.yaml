id: PSA.136.3
reference: Psalms 136:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֭וֹדוּ לַ/אֲדֹנֵ֣י הָ/אֲדֹנִ֑ים כִּ֖י לְ/עֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce au Seigneur des seigneurs, car son amour fidèle[a] demeure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa fidélité à son alliance ». Le mot hébreu חֶסֶד peut désigner un amour loyal et fidèle, notamment dans le cadre d’une alliance, ainsi que la bonté ou la compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Rendez grâce
  rationale: L’impératif pluriel du hifil de ידה appelle l’assemblée à exprimer sa reconnaissance et sa louange. « Rendez grâce » convient au refrain liturgique du psaume et reste naturel en français.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: au Seigneur des seigneurs
  rationale: La construction « Seigneur des seigneurs » exprime la souveraineté suprême. Elle conserve l’idiome hébreu et sa portée de titre divin.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’appel à rendre grâce. « Car » est concis et adapté au registre poétique.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: L’expression signifie littéralement « pour toujours ». Dans cette proposition sans verbe exprimé, « demeure » restitue naturellement en français la permanence affirmée par le refrain.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement loyal et fidélité, souvent dans un cadre d’alliance. « Amour fidèle » préserve cette richesse sans réduire le terme à la seule miséricorde ni expliciter excessivement l’alliance.
theological_decisions:
- issue: Sens du titre אֲדֹנֵי הָאֲדֹנִים
  choice: le Seigneur des seigneurs
  alternative: le maître des maîtres
  rationale: Le contexte emploie une formule de suprématie appliquée à Dieu. « Seigneur » garde la force du titre divin et l’idée de souveraineté, tandis que « maître » pourrait évoquer trop étroitement une relation sociale.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à son alliance
  rationale: Le mot peut inclure la loyauté liée à l’alliance, mais celle-ci n’est pas explicitement nommée dans le verset. La traduction retient donc une formulation assez large, et la note signale l’autre nuance possible.
translation_notes:
  register: Français international moderne, digne et liturgique. Le parallélisme bref du refrain est conservé, avec une formulation immédiatement compréhensible.
