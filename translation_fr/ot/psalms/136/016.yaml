source:
  edition: WLC
  text: לְ/מוֹלִ֣יךְ עַ֭מּ/וֹ בַּ/מִּדְבָּ֑ר כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/016.yaml
  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'à celui qui a conduit son peuple dans le désert,

    car son amour fidèle[a] dure éternellement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « amour fidèle » peut aussi désigner la bonté, la fidélité ou l’attachement loyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: lui qui a conduit
  rationale: Le participe hifil de הלך exprime ici l’action de faire aller, donc de conduire. Avec le ל préfixé, il s’insère dans la litanie comme « lui qui… ».
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici le peuple lié à Dieu; « son peuple » conserve ce rapport tout en restant naturel en français.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: La préposition ב signifie littéralement « dans ». En français, « conduire son peuple dans le désert » peut naturellement évoquer le parcours sans imposer le sens plus précis de « à travers ».
- source_word: כִּי
  choice: car
  rationale: Dans le refrain, כִּי introduit le motif de la louange. « Car » convient au registre poétique et liturgique.
- source_word: לְעוֹלָם
  choice: dure éternellement
  rationale: L’expression signifie « pour toujours ». Avec חֶסֶד, le verbe « dure », implicite en hébreu, rend clairement la continuité en français.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement et fidélité. « Amour fidèle » en conserve la richesse relationnelle sans recourir à un terme technique.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain
  choice: son amour fidèle dure éternellement
  alternative: sa bonté / sa fidélité / son amour bienveillant est pour toujours
  rationale: « Amour fidèle » maintient ensemble la bienveillance et la loyauté durable exprimées par חֶסֶד, sans réduire le terme à la seule compassion ni en faire explicitement un terme technique d’alliance.
translation_notes:
  register: Français international moderne, poétique et digne. La structure en deux lignes conserve la cadence liturgique du psaume; « dans le désert » suit de près la préposition hébraïque tout en restant idiomatique.
