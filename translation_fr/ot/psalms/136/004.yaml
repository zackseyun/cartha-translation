source:
  edition: WLC
  text: לְ/עֹ֘שֵׂ֤ה נִפְלָא֣וֹת גְּדֹל֣וֹת לְ/בַדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/004.yaml
  text: to him who alone does great wonders[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'à celui qui, seul, accomplit de grands prodiges[a],

    car son amour fidèle dure pour toujours[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « merveilles » ou « œuvres merveilleuses ».
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « amour fidèle » traduit l’hébreu ḥésed, qui peut évoquer un amour loyal et constant, notamment dans le cadre d’une alliance ; autres traductions possibles : « bonté », « miséricorde » ou « fidélité à l’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: à celui qui accomplit
  rationale: La préposition לְ reprend la construction liturgique « rendez grâce à… », tandis que le participe substantivé décrit celui qui agit de manière caractéristique. « Accomplit » convient naturellement à des actes divins extraordinaires.
- source_word: נִפְלָאוֹת
  choice: prodiges
  rationale: Le terme désigne des actes extraordinaires qui suscitent l’émerveillement. « Prodiges » est concis, digne et courant dans le registre biblique français sans préciser abusivement leur nature.
- source_word: גְּדֹלוֹת
  choice: grands
  rationale: L’adjectif qualifie directement les prodiges et se traduit naturellement par « grands ».
- source_word: לְבַדּוֹ
  choice: seul
  rationale: '« Seul » conserve l’accent d’exclusivité : Dieu est l’unique auteur de ces grands prodiges.'
- source_word: כִּי
  choice: car
  rationale: Dans le refrain, כִּי introduit le motif de la louange. « Car » en maintient la valeur causale et la cadence liturgique.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. « Dure pour toujours » restitue naturellement en français sa portée temporelle continue.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bienveillance, loyauté et constance relationnelle. « Amour fidèle » rend ces dimensions dans un français moderne, clair et adapté au refrain.
theological_decisions:
- issue: Traduction du refrain כִּי לְעוֹלָם חַסְדּוֹ
  choice: car son amour fidèle dure pour toujours
  alternative: car sa bonté est éternelle ; car sa fidélité d’alliance dure pour toujours ; car sa miséricorde dure éternellement
  rationale: « Amour fidèle » conserve à la fois la bienveillance et la loyauté durable de חֶסֶד sans réduire le terme à la seule compassion ni expliciter systématiquement l’alliance, qui demeure une implication contextuelle possible. Le verbe ajouté « dure » rend idiomatiquement la proposition nominale.
translation_notes:
  register: Français international moderne, poétique et liturgique, mais accessible. L’ordre « qui, seul, accomplit » met nettement en relief l’exclusivité exprimée par לְבַדּוֹ. Les deux notes sont appelées dans le texte dans leur ordre d’apparition.
