id: PSA.136.1
reference: Psalms 136:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce à Yahweh[a], car il est bon, car son amour fidèle[b] dure toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au SEIGNEUR ». Yahweh représente le nom divin יהוה présent dans le texte hébreu.
    reason: alternative_reading
  - marker: b
    text: Ou « sa fidélité à l’alliance », « sa bonté » ou « sa miséricorde ». Le mot hébreu חֶסֶד évoque un amour loyal, constant et durable, particulièrement dans le cadre d’une alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Rendez grâce
  rationale: L’impératif pluriel hiphil de ידה exprime ici l’action de remercier et de louer. « Rendez grâce » convient au cadre liturgique tout en restant fidèle à cette valeur.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque le destinataire, et le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans le texte hébreu.
- source_word: כִּי
  choice: car
  rationale: Dans ses deux occurrences, כִּי introduit le motif de l’appel à rendre grâce. « Car » en conserve sobrement la valeur causale.
- source_word: טוֹב
  choice: bon
  rationale: L’adjectif affirme directement la bonté de Yahweh. « Bon » préserve toute l’étendue de cette affirmation sans la réduire à la bienveillance seule.
- source_word: לְעוֹלָם
  choice: dure toujours
  rationale: לְעוֹלָם indique une durée sans fin. Avec חַסְדּוֹ, « dure toujours » forme en français une proposition naturelle, bien que le verbe soit implicite en hébreu.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et constance, notamment dans le cadre de l’alliance. « Amour fidèle » maintient cette richesse mieux qu’un terme limité à la seule compassion ou fidélité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme comme nom propre. « Yahweh » le rend explicitement, tandis que « le SEIGNEUR » suit la tradition de substitution par un titre.
- issue: Rendu de חֶסֶד dans le refrain
  choice: amour fidèle
  alternative: fidélité à l’alliance ; bonté ; miséricorde
  rationale: « Amour fidèle » conserve ensemble les dimensions affective, loyale et durable du terme sans imposer une définition exclusivement juridique ou émotionnelle.
- issue: Expression française de la proposition nominale לְעוֹלָם חַסְדּוֹ
  choice: son amour fidèle dure toujours
  alternative: son amour fidèle est pour toujours
  rationale: L’hébreu ne comporte pas de verbe exprimé. L’ajout idiomatique de « dure » rend la durée naturellement en français sans modifier le sens du refrain.
translation_notes:
  register: Français international moderne, digne et adapté à une récitation liturgique. La répétition de « car » reproduit la structure causale et rythmique de l’hébreu. « Rendons grâce » a été écarté parce que l’hébreu porte un impératif à la deuxième personne du pluriel, non une exhortation inclusive à la première personne.
