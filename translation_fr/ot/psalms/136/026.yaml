source:
  edition: WLC
  text: ה֭וֹדוּ לְ/אֵ֣ל הַ/שָּׁמָ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/026.yaml
  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'Rendez grâce au Dieu du ciel,

    car son amour fidèle dure pour toujours.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car sa fidélité à l’alliance est pour toujours ». Le mot hébreu חֶסֶד évoque un amour loyal et fidèle, notamment dans le cadre d’une alliance.'
    reason: alternative lexicale
lexical_decisions:
- source_word: הוֹדוּ
  choice: Rendez grâce
  rationale: L’impératif pluriel de ידה appelle la communauté à exprimer sa reconnaissance et sa louange. « Rendez grâce » convient au registre liturgique du psaume et reste naturel en français.
- source_word: לְאֵל
  choice: au Dieu
  rationale: אֵל désigne ici Dieu, précisé par « du ciel ». L’article donne en français une tournure titulaire naturelle.
- source_word: הַשָּׁמָיִם
  choice: du ciel
  rationale: Bien que שָׁמַיִם ait une forme plurielle en hébreu, « du ciel » est l’expression française idiomatique pour désigner le domaine céleste de Dieu.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit le motif de l’action de grâce. « Car » conserve avec concision le lien logique et la tonalité poétique.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression signifie littéralement « pour toujours ». Le verbe « dure », implicite dans la proposition hébraïque nominale, rend naturellement sa valeur continue.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement loyal et fidélité relationnelle, souvent dans un cadre d’alliance. « Amour fidèle » en exprime les dimensions affective et durable sans réduire le terme à la seule compassion.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle dure pour toujours
  alternative: sa fidélité à l’alliance dure pour toujours
  rationale: « Amour fidèle » préserve à la fois l’affection, la bonté et la loyauté durable évoquées par חֶסֶד. L’alternative explicite davantage le cadre d’alliance, mais risque de restreindre un terme dont le champ sémantique est plus large.
translation_notes:
  register: Français international moderne, digne et liturgique. Le parallélisme bref et la formule répétitive du refrain sont conservés; « pour toujours » est préféré à « éternellement » pour sa clarté courante.
