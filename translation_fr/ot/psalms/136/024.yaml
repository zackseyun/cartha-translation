  text: וַ/יִּפְרְקֵ֥/נוּ מִ/צָּרֵ֑י/נוּ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/024.yaml
  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: fr
  text: Il nous a délivrés de nos adversaires[a], car son amour fidèle dure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nos ennemis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: Il nous a délivrés
  rationale: Le verbe פרק exprime ici l’action d’arracher ou de soustraire à un danger ou à une oppression. « Délivrés » convient au registre liturgique du psaume tout en restant courant.
- source_word: מִצָּרֵינוּ
  choice: de nos adversaires
  rationale: Le terme désigne ceux qui se montrent hostiles ou oppressent. « Adversaires » conserve cette portée sans imposer un contexte militaire précis.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain du psaume, כִּי introduit le motif de la louange. « Car » en préserve la force explicative et la cadence liturgique.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression signifie littéralement « pour toujours ». L’ajout idiomatique de « dure » exprime la permanence continue du חֶסֶד.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד réunit les idées d’amour, de bonté et de loyauté durable. « Amour fidèle » en restitue l’ampleur relationnelle sans le réduire à la seule miséricorde.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle dure pour toujours
  alternative: sa bonté dure pour toujours ; sa fidélité aimante dure pour toujours ; sa miséricorde dure pour toujours
  rationale: « Amour fidèle » maintient ensemble l’amour bienveillant et la constance loyale de Dieu manifestés dans ses actes, sans rendre explicite dans le texte une notion d’alliance qui demeure implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Délivrés » soutient le ton liturgique sans archaïsme marqué ; « adversaires » garde la portée assez large du terme hébreu. Le refrain privilégie une formulation naturelle et stable.
