  text: לְ/מַכֵּ֣ה מִ֭צְרַיִם בִּ/בְכוֹרֵי/הֶ֑ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/010.yaml
  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: fr
  text: À celui qui frappa l’Égypte en frappant ses premiers-nés[a], car son amour fidèle dure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « dans/avec leurs premiers-nés ». On peut aussi comprendre « parmi ses premiers-nés »; « en frappant ses premiers-nés » explicite le sens dans le contexte.
    reason: La préposition hébraïque בְּ admet plusieurs nuances. La note préserve l’ambiguïté de la formulation source, tandis que le texte français explicite avec retenue la relation sous-entendue.
lexical_decisions:
- source_word: לְמַכֵּה
  choice: À celui qui frappa
  rationale: Le לְ introduit ici le destinataire implicite de la louange dans la litanie (« à celui qui… »). Le participe de נכה est rendu verbalement; le passé simple convient au registre poétique et à l’acte historique évoqué.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Traduction française usuelle du nom du pays et, par métonymie, de son peuple.
- source_word: בִּבְכוֹרֵיהֶם
  choice: dans ses premiers-nés
  rationale: Cette formulation conserve la construction hébraïque compacte avec בְּ sans trancher entièrement entre la sphère atteinte et le moyen du coup. En français, « ses » reprend l’Égypte comme collectivité, tandis que l’hébreu emploie littéralement le pluriel « leurs » pour ses habitants.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français le refrain explicatif récurrent du psaume.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: Le verbe « dure », ajouté pour former une phrase française naturelle, exprime la permanence indiquée par לְעוֹלָם.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne un amour loyal, constant et engagé. « Amour fidèle » en communique les dimensions affective et relationnelle sans le réduire à la seule miséricorde.
theological_decisions:
- issue: Rendre le jugement divin contre les premiers-nés de l’Égypte sans en atténuer la force
  choice: Conserver l’affirmation directe selon laquelle Dieu frappa l’Égypte dans ses premiers-nés, au sein même du refrain célébrant son amour fidèle.
  alternative: 'Atténuer le jugement par une paraphrase, ou expliciter dans le texte principal : « en frappant ses premiers-nés ».'
  rationale: Le verset associe explicitement cet acte de jugement au motif de louange. La traduction maintient cette tension théologique sans adoucir le propos ni ajouter une explication absente de la formulation hébraïque.
translation_notes:
  register: Français moderne, digne et poétique. Le passé simple « frappa » convient à la litanie historique. La tournure inhabituelle « dans ses premiers-nés » est volontairement conservée afin de refléter la concision et l’ambiguïté de l’hébreu; la note en précise les lectures possibles.
