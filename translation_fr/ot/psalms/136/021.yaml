id: PSA.136.21
reference: Psalms 136:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נָתַ֣ן אַרְצָ֣/ם לְ/נַחֲלָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/021.yaml
  text: and gave their land as an inheritance[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'et leur donna leur pays en héritage[a],

    car son amour fidèle dure pour toujours[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme possession attribuée ». Le mot hébreu désigne un bien reçu en partage, notamment une terre donnée en héritage.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « amour fidèle » peut aussi évoquer la bonté, la miséricorde et la fidélité à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: et leur donna
  rationale: Le qatal qal à la 3e personne du masculin singulier poursuit l’énumération des actes de Dieu. Le complément indirect « leur » est implicite dans la construction hébraïque avec לְנַחֲלָה et se rapporte à Israël dans le contexte immédiat.
- source_word: אַרְצָם
  choice: leur pays
  rationale: אֶרֶץ avec le suffixe de la 3e personne du masculin pluriel désigne le territoire des rois et peuples vaincus. « Pays » est ici naturel en français et ne suppose pas nécessairement l’État moderne.
- source_word: לְנַחֲלָה
  choice: en héritage
  rationale: נַחֲלָה désigne un bien attribué et transmis, particulièrement la terre accordée à Israël. L’expression française « donner en héritage » conserve cette dimension d’attribution durable.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain du psaume, כִּי introduit le motif de la louange. « Car » en préserve la valeur explicative et la cadence liturgique.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’hébreu signifie littéralement « pour toujours ». Le verbe « dure », ajouté selon l’usage français, exprime naturellement la permanence du חֶסֶד divin.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et fidélité durable, souvent dans un cadre d’alliance. « Amour fidèle » rend ces dimensions dans un français actuel sans réduire le terme à la seule miséricorde.
theological_decisions:
- issue: Sens de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle dure pour toujours
  alternative: sa bonté / sa fidélité à l’alliance / sa miséricorde demeure à jamais
  rationale: « Amour fidèle » maintient ensemble l’affection bienveillante et la loyauté constante manifestées dans les actes historiques de Dieu, sans imposer un terme confessionnel technique.
- issue: Bénéficiaires implicites de l’héritage
  choice: expliciter « leur » devant « donna »
  alternative: « et donna leur pays en héritage », sans bénéficiaire exprimé
  rationale: Le contexte identifie Israël comme bénéficiaire de la terre des rois vaincus. L’explicitation est nécessaire à un français naturel, tout en laissant le verset précédent fournir le référent.
translation_notes:
  register: Français international moderne, simple et liturgique. Le parallélisme en deux lignes et la formule « car son amour fidèle dure pour toujours » conviennent au refrain récurrent du psaume. Les deux appels de note figurent dans le texte au point précis correspondant.
