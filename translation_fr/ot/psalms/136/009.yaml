  text: the moon and stars to rule over the night[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: la lune et les étoiles pour dominer sur la nuit, car son amour fidèle dure toujours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶת
  choice: '[marqueur d’objet direct, non traduit]'
  rationale: Ce marqueur introduit les objets dans la série amorcée aux versets précédents; il n’a pas d’équivalent naturel en français.
- source_word: הַיָּרֵחַ
  choice: la lune
  rationale: Traduction courante du nom de l’astre, avec maintien de l’article défini.
- source_word: וְכוֹכָבִים
  choice: et les étoiles
  rationale: Le pluriel signifie « étoiles »; la répétition de l’article est naturelle en français.
- source_word: לְמֶמְשְׁלוֹת
  choice: pour dominer
  rationale: Le terme exprime l’exercice de la domination ou du gouvernement; « pour dominer » conserve ici la fonction assignée aux astres et l’écho de Genèse 1.
- source_word: בַּלָּיְלָה
  choice: sur la nuit
  rationale: Avec « dominer », la préposition « sur » rend naturellement en français le domaine sur lequel s’exerce cette domination.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain liturgique du psaume, « car » introduit le motif de la louange avec une cadence naturelle et digne.
- source_word: לְעוֹלָם
  choice: dure toujours
  rationale: Associé à חַסְדּוֹ, le syntagme exprime la permanence; le verbe « dure » est ajouté en français pour former une proposition idiomatique.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement loyal et fidélité relationnelle; « amour fidèle » en conserve l’ampleur sans le réduire à la seule miséricorde.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle dure toujours
  alternative: sa bonté dure toujours; sa fidélité bienveillante est pour toujours; sa miséricorde dure toujours
  rationale: « Amour fidèle » maintient à la fois la dimension affective et la loyauté durable du terme, sans imposer une formulation confessionnelle particulière. Le refrain reste accessible et solennel.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme avec le verset précédent et le caractère liturgique du refrain.
