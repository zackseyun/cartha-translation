id: PSA.136.2
reference: Psalms 136:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֭וֹדוּ לֵֽ/אלֹהֵ֣י הָ/אֱלֹהִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/002.yaml
  text: Give thanks to the God of gods[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce au Dieu des dieux[a], car son amour fidèle[b] demeure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au Dieu au-dessus de tous les dieux ». L’hébreu dit littéralement « Dieu des dieux », formule exprimant la suprématie.
    reason: lexical_alternative
  - marker: b
    text: L’expression « amour fidèle » traduit l’hébreu ḥésèd, qui peut désigner un amour loyal, la bonté, la miséricorde ou la fidélité dans une relation d’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Rendez grâce
  rationale: L’impératif pluriel du hifil de ידה appelle ici la communauté à remercier et à louer Dieu. « Rendez grâce » conserve cette valeur d’appel et convient au refrain liturgique du psaume.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: au Dieu des dieux
  rationale: La chaîne construite signifie littéralement « Dieu des dieux ». Cette formulation solennelle exprime la suprématie divine sans effacer l’image hébraïque.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de l’appel à rendre grâce. « Car » est concis et naturel dans ce registre poétique.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: L’expression signifie « pour toujours ». Le verbe « demeure », sous-entendu dans la proposition nominale hébraïque, donne une phrase française naturelle tout en exprimant la permanence.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté, bienveillance et fidélité relationnelle. « Son amour fidèle » en restitue les dimensions principales sans limiter le terme à la seule miséricorde.
theological_decisions:
- issue: Sens de אֱלֹהִים dans le titre « Dieu des dieux »
  choice: Conserver « Dieu des dieux » comme affirmation de la suprématie de Dieu.
  alternative: Traduire « Dieu au-dessus de tous les dieux » pour expliciter la suprématie.
  rationale: La formule hébraïque affirme la prééminence et l’incomparabilité de Dieu, sans trancher ici la question du statut ontologique des autres « dieux ». La traduction littérale préserve cette tension rhétorique.
- issue: Portée de חֶסֶד
  choice: Traduire par « amour fidèle ».
  alternative: Employer « bonté », « miséricorde » ou « fidélité à l’alliance ».
  rationale: Le terme possède une richesse relationnelle que ne couvre entièrement aucun équivalent français unique. « Amour fidèle » garde ensemble l’affection bienveillante et la loyauté durable, sans imposer dans le texte principal une explicitation confessionnelle de l’alliance.
translation_notes:
  register: Français international moderne, clair et digne. « Rendez grâce » maintient le ton liturgique de l’impératif collectif; « demeure pour toujours » restitue naturellement la proposition nominale du refrain.
