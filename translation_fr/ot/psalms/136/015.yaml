  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: fr
  text: Il a précipité Pharaon et son armée dans la mer des Roseaux[a], car son amour fidèle dure toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traduction traditionnelle : « mer Rouge ». L’hébreu dit littéralement « mer des roseaux » ou « mer de roseaux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִעֵר
  choice: il précipita
  rationale: Le verbe נָעַר évoque l’action de secouer pour rejeter ou se débarrasser de quelque chose. Dans ce contexte, « précipita » restitue naturellement en français le mouvement violent vers la mer sans réduire le terme au plus abstrait « renversa ».
- source_word: פַּרְעֹה
  choice: le pharaon
  rationale: Le nom commun précédé de l’article est l’usage naturel en français pour le titre royal égyptien.
- source_word: וְחֵילוֹ
  choice: et son armée
  rationale: Dans ce contexte militaire, חַיִל désigne les forces armées du pharaon. « Armée » est clair et actuel.
- source_word: בְיַם סוּף
  choice: dans la mer des Roseaux
  rationale: Cette traduction rend directement le sens le plus transparent de יַם־סוּף et respecte la primauté du texte hébreu. La préposition בְּ indique ici le lieu ou l’aboutissement du mouvement.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit avec concision le motif récurrent de la louange et convient au registre liturgique du psaume.
- source_word: לְעוֹלָם
  choice: dure toujours
  rationale: La tournure verbale française exprime naturellement la permanence indiquée par לְעוֹלָם dans le refrain.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et bienveillance durable. « Amour fidèle » conserve cette richesse sans imposer une formulation confessionnelle particulière.
theological_decisions:
- issue: Traduction de יַם סוּף
  choice: mer des Roseaux dans le texte principal
  alternative: mer Rouge
  rationale: « Mer des Roseaux » traduit plus directement l’expression hébraïque. « Mer Rouge » est l’appellation traditionnelle bien connue et mérite donc d’être signalée en note, sans remplacer la donnée lexicale du texte source.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure liturgique brève du verset et son refrain. « Précipita » maintient l’image énergique du verbe hébreu dans une formulation idiomatique.
