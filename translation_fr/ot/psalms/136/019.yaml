source:
  edition: WLC
  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: fr
  text: Sihôn, roi des Amorites[a], car son amour fidèle demeure pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « roi de l’Amorite »; le singulier hébreu est un gentilé collectif.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car sa fidélité à l’alliance demeure pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Sihôn
  rationale: La préposition לְ rattache Sihôn au verbe « frappa » du verset 18 et marque ici l’objet atteint. En français naturel, le complément d’objet se construit sans préposition; le lien syntaxique avec le verset précédent reste implicite.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Équivalent courant et précis du titre royal hébreu.
- source_word: הָאֱמֹרִי
  choice: des Amorites
  rationale: 'La forme hébraïque est un gentilé singulier, mais le titre français idiomatique désigne collectivement le peuple gouverné : « roi des Amorites ».'
- source_word: כִּי
  choice: car
  rationale: Dans le refrain liturgique du psaume 136, כִּי introduit le motif de la louange; « car » conserve cette relation avec dignité et concision.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. « Demeure pour toujours » restitue naturellement en français sa portée durable.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et bienveillance durable. « Amour fidèle » conserve cette richesse sans limiter le terme à la seule compassion ni expliciter excessivement l’idée d’alliance.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du psaume 136
  choice: son amour fidèle demeure pour toujours
  alternative: sa fidélité à l’alliance demeure pour toujours
  rationale: « Amour fidèle » exprime à la fois l’attachement bienveillant et la constance de Dieu. L’alternative souligne justement la dimension d’alliance, mais l’explicite davantage que le mot hébreu pris isolément.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset conserve sa forme de fragment poétique dépendant du verbe du verset 18 et reprend un refrain fluide et mémorisable.
