  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: À celui qui a frappé de grands rois[a], car son amour fidèle[b] dure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a abattu de grands rois ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque traduite par « amour fidèle » désigne une bonté constante et loyale ; elle peut aussi être rendue par « fidélité » ou « bonté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Celui qui a frappé
  rationale: Le לְ préfixé poursuit la formule de louange du psaume, tandis que le participe de נכה a ici une valeur verbale. « A frappé » reste proche de l’hébreu et laisse le contexte exprimer l’idée de défaite mortelle.
- source_word: מְלָכִים גְּדֹלִים
  choice: de grands rois
  rationale: Traduction directe et naturelle du nom pluriel suivi de l’adjectif; « grands » peut évoquer leur importance comme leur puissance.
- source_word: כִּי
  choice: car
  rationale: Introduit le motif de la louange dans le refrain et conserve une cadence liturgique naturelle.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’hébreu exprime une durée sans fin; le verbe « dure », sous-entendu dans la proposition nominale hébraïque, donne une formulation française idiomatique.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד associe amour bienveillant, fidélité et loyauté relationnelle. « Amour fidèle » en rend la richesse de façon claire et actuelle.
theological_decisions:
- issue: Traduction de חסד dans le refrain
  choice: son amour fidèle dure pour toujours
  alternative: sa bonté / sa fidélité / son amour constant est pour toujours
  rationale: « Amour fidèle » maintient ensemble la bienveillance et la constance de Dieu sans réduire חסד à la seule miséricorde ni expliciter excessivement l’idée d’alliance.
- issue: Portée de נכה appliqué aux rois
  choice: a frappé
  alternative: a abattu
  rationale: Le contexte historique peut impliquer leur défaite ou leur mise à mort, mais le verbe hébreu signifie d’abord « frapper ». La formulation principale préserve cette latitude, tandis que la note signale l’interprétation plus décisive.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe conserve la formule litanique du psaume; « car » et « pour toujours » soutiennent la cadence du refrain.
