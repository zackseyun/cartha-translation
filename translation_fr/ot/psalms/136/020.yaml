source:
  edition: WLC
  text: וּ֭/לְ/עוֹג מֶ֣לֶךְ הַ/בָּשָׁ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/020.yaml
  text: and Og king of Bashan[a], for his steadfast love endures forever.
translation:
  language: fr
  text: et Og, roi de Basan[a], car son amour fidèle dure toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et à Og, roi de Basan », en explicitant la valeur indirecte de la préposition reprise de la proposition précédente.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעוֹג
  choice: et Og
  rationale: La conjonction וּ poursuit l’énumération. Le לְ reprend la construction des versets précédents et marque ici Og comme objet du verbe sous-entendu; le français naturel emploie donc le complément d’objet direct sans préposition.
- source_word: מֶלֶךְ
  choice: roi
  rationale: Traduction courante du nom; la relation avec le nom de lieu suivant se rend naturellement par « roi du Bashân ».
- source_word: הַבָּשָׁן
  choice: du Bashân
  rationale: Le nom géographique est translittéré. La tournure française idiomatique correspondant à l’hébreu avec article est « roi du Bashân ».
- source_word: כִּי
  choice: car
  rationale: Dans le refrain du psaume, כִּי introduit le motif de la louange; « car » en conserve la fonction explicative et liturgique.
- source_word: לְעוֹלָם
  choice: dure toujours
  rationale: L’expression signifie « pour toujours ». Avec le verbe implicite du refrain, « dure toujours » donne une formulation française claire et fidèle.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne un amour loyal, durable et bienveillant. « amour fidèle » en garde la richesse relationnelle sans le réduire à la seule miséricorde; le suffixe masculin singulier est rendu par « son ».
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: amour fidèle
  alternative: bonté; miséricorde; amour d’alliance
  rationale: « Amour fidèle » exprime à la fois l’attachement, la loyauté et la durée associés au terme, sans imposer une interprétation confessionnelle plus étroite.
translation_notes:
  register: Français international moderne, simple et digne. La phrase demeure un fragment coordonné aux versets précédents, comme dans le texte hébreu, et conserve la cadence répétitive du refrain liturgique.
