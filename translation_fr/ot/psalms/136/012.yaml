  text: with a strong hand and an outstretched arm[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: par une main puissante et un bras étendu, car son amour fidèle dure pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car sa bonté dure pour toujours ». Le mot hébreu traduit par « amour fidèle » peut aussi exprimer la bonté, la miséricorde et la loyauté dans une relation d’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: par une main puissante
  rationale: La préposition בְּ exprime ici le moyen. « Main puissante » restitue naturellement la formule hébraïque et son évocation de la délivrance hors d’Égypte.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: et un bras étendu
  rationale: Cette traduction conserve l’image concrète du bras déployé dans l’action ainsi que les échos du langage de l’Exode.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit la raison de la louange et préserve la valeur liturgique du refrain.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’hébreu signifie littéralement « pour toujours »; l’ajout du verbe « dure », implicite dans la formule, produit un refrain naturel en français.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne ici un amour bienveillant, constant et loyal. « Amour fidèle » en conserve la richesse relationnelle sans le réduire à la seule miséricorde.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle dure pour toujours
  alternative: sa bonté dure pour toujours; sa fidélité d’alliance dure pour toujours; sa miséricorde dure pour toujours
  rationale: « Amour fidèle » exprime à la fois la bienveillance et la loyauté durable de Dieu. Les autres possibilités mettent chacune en relief une dimension réelle, mais plus étroite, du terme hébreu.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme, les images corporelles de l’hébreu et le caractère répétitif et liturgique du refrain.
