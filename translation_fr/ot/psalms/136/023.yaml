  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: fr
  text: qui s’est souvenu de nous dans notre abaissement[a], car son amour fidèle est éternel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand nous étions abaissés ». Le terme peut aussi évoquer l’humiliation ou une condition humble.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, de manière plus idiomatique : « car son amour fidèle dure toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: qui s’est souvenu de nous dans notre abaissement
  rationale: La tournure conserve la proposition relative et rend שִׁפְלֵנוּ par « notre abaissement », terme qui laisse ouvertes les nuances de détresse, d’humiliation et de condition humble sans préciser indûment la cause.
- source_word: זָכַר לָנוּ
  choice: s’est souvenu de nous
  rationale: « Se souvenir de » est l’équivalent français naturel. Le contexte peut impliquer une intervention favorable de Dieu, mais cette conséquence n’est pas ajoutée au verbe lui-même.
- source_word: כִּי
  choice: car
  rationale: « Car » exprime le lien causal du refrain avec l’acte célébré et convient au registre liturgique du psaume.
- source_word: לְעוֹלָם
  choice: est éternel
  rationale: L’hébreu dit littéralement « pour toujours » sans verbe exprimé. « Est éternel » fournit en français une formulation concise et naturelle, proche de cette structure nominale.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, bonté et fidélité durable. « Amour fidèle » préserve ces dimensions sans archaïsme ni restriction confessionnelle.
theological_decisions:
- issue: Rendu du refrain כִּי לְעוֹלָם חַסְדּוֹ
  choice: car son amour fidèle est éternel
  alternative: car son amour fidèle dure toujours
  rationale: Le choix principal reste proche de la proposition hébraïque sans verbe explicite, tandis que l’alternative explicite de façon idiomatique la permanence active de l’amour fidèle de Dieu.
translation_notes:
  register: Français international moderne, digne et adapté à un refrain liturgique. La syntaxe relative respecte la continuité avec les versets précédents; « abaissement » conserve l’indétermination du terme hébreu.
