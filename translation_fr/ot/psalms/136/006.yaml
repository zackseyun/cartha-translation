  text: לְ/רֹקַ֣ע הָ֭/אָרֶץ עַל הַ/מָּ֑יִם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/006.yaml
  text: to him who spread out the earth upon the waters[a], for his steadfast love endures forever.
translation:
  language: fr
  text: à celui qui a étendu la terre sur les eaux[a], car son amour fidèle demeure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « déployé la terre au-dessus des eaux » ; le verbe hébreu peut aussi évoquer concrètement l’action de marteler un matériau pour l’aplatir et l’élargir.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/רֹקַע
  choice: à celui qui a déployé
  rationale: Dans la litanie du psaume, לְ introduit celui qui est célébré. Le participe de רקע évoque l’action d’étendre ou d’aplatir une surface. « Déployé » restitue naturellement l’image en français, tandis que la note conserve le sens concret possible.
- source_word: הָ/אָרֶץ
  choice: la terre
  rationale: Dans ce contexte de création cosmique, אֶרֶץ désigne la terre plutôt qu’un territoire particulier.
- source_word: עַל הַ/מָּיִם
  choice: sur les eaux
  rationale: עַל peut signifier « sur » ou « au-dessus de ». « Sur les eaux » garde avec concision l’image cosmologique et son ambiguïté spatiale.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici le motif de la louange dans le refrain répété du psaume.
- source_word: לְ/עוֹלָם
  choice: demeure pour toujours
  rationale: לְעוֹלָם exprime la perpétuité. Le verbe « demeure », implicite en hébreu, donne au refrain une formulation française naturelle sans en modifier le sens.
- source_word: חַסְדּֽ/וֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté, bienveillance et fidélité durable. « Amour fidèle » en conserve les principales dimensions sans le réduire à la seule miséricorde.
theological_decisions:
- issue: Image cosmologique de la création
  choice: Conserver l’image poétique de la terre déployée sur les eaux.
  alternative: Paraphraser par une affirmation générale selon laquelle Dieu a fondé le monde.
  rationale: Le texte présente une image poétique issue de son propre cadre cosmologique. La conserver respecte le texte sans l’harmoniser avec des catégories scientifiques modernes ni lui faire dire davantage.
translation_notes:
  register: Français moderne, poétique et digne. La tournure « à celui qui » maintient la structure litanique du psaume ; « déployé » reste accessible tout en conservant l’image du texte hébreu.
