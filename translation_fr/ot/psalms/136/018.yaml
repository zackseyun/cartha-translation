  text: and killed mighty kings[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'et il tua des rois puissants[a],

    car son amour fidèle[b] dure pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des rois redoutables ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu ḥésèd : terme également traduit par « bonté fidèle », « miséricorde » ou « fidélité envers l’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: et il tua
  rationale: Le wayyiqtol de הרג poursuit le récit des actes passés de Dieu. « Tua » rend directement le verbe, tandis que « et » maintient l’enchaînement avec le verset précédent.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le nom pluriel signifie simplement « rois » ; l’article partitif contracté convient naturellement après « tuer » en français.
- source_word: אַדִּירִים
  choice: puissants
  rationale: Dans ce contexte guerrier, l’adjectif qualifie ces rois de forts ou redoutables. « Puissants » est naturel en français moderne et évite la nuance surtout majestueuse de « majestueux ».
- source_word: כִּי
  choice: car
  rationale: La particule introduit le refrain qui donne le motif de la louange. « Car » conserve sa valeur explicative et la cadence liturgique.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression signifie « pour toujours ». L’ajout de « dure », impliqué dans la proposition nominale hébraïque, donne une formulation française complète et naturelle.
- source_word: חַסְדּוֹ
  choice: sa bonté fidèle
  rationale: חֶסֶד associe bonté, attachement loyal, miséricorde et fidélité dans la relation. « Bonté fidèle » préserve cette richesse sans réduire le terme à un seul de ses aspects.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain
  choice: sa bonté fidèle dure pour toujours
  alternative: sa fidélité envers son alliance demeure pour toujours ; sa miséricorde dure pour toujours
  rationale: Le refrain célèbre l’attachement bienveillant et constant de Dieu, manifesté ici jusque dans ses actes de jugement et de délivrance. « Bonté fidèle » garde ensemble les dimensions de bienveillance et de loyauté sans imposer une explicitation confessionnelle du terme.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme en deux lignes et la formule récurrente du refrain sont conservés. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
