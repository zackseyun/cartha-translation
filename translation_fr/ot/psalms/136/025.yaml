source:
  edition: WLC
  text: נֹתֵ֣ן לֶ֭חֶם לְ/כָל בָּשָׂ֑ר כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/025.yaml
  text: who gives food to all flesh[a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'Celui qui donne de la nourriture à toute chair[a],

    car son amour fidèle dure pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pain à toute chair ». « Toute chair » est une expression hébraïque qui peut désigner l’ensemble des êtres vivants, et « pain » peut désigner la nourriture en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹתֵן
  choice: Lui qui donne
  rationale: Le participe décrit Dieu par son action continue dans la litanie du psaume. « Lui qui donne » conserve cette valeur descriptive et le mouvement poétique.
- source_word: לֶחֶם
  choice: de la nourriture
  rationale: Le nom signifie littéralement « pain », mais désigne couramment la nourriture en général. Ici, « nourriture » exprime naturellement l'étendue de la providence divine.
- source_word: לְכָל בָּשָׂר
  choice: à toute chair
  rationale: Cette expression hébraïque peut englober l'ensemble des êtres vivants. Le maintien de l'image préserve l'idiome biblique et évite de limiter sans raison le propos aux seuls humains.
- source_word: כִּי
  choice: car
  rationale: « Car » introduit naturellement le motif de la louange et respecte le rythme récurrent du psaume.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. L'ajout de « dure » rend en français la permanence indiquée par לְעוֹלָם.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, loyauté et fidélité relationnelle. « Amour fidèle » en restitue les principales nuances sans imposer une interprétation confessionnelle plus étroite.
theological_decisions:
- issue: Portée de « toute chair »
  choice: L'expression est conservée et comprise comme pouvant inclure tous les êtres vivants.
  alternative: Toute l'humanité ou tous les humains.
  rationale: Dans cet emploi, l'hébreu n'oblige pas à restreindre la providence divine aux humains. Conserver l'idiome maintient la portée ouverte du texte.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « Lui qui donne » convient à la structure litanique; « toute chair » conserve volontairement l'image biblique, explicitée en note.
