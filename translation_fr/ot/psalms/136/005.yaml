id: PSA.136.5
reference: Psalms 136:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'À celui qui a fait les cieux avec intelligence,

    car son amour fidèle demeure pour toujours.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: À celui qui a fait
  rationale: Le לְ introduit ici le destinataire de la louange dans la série liturgique. Le participe peut littéralement évoquer « celui qui fait », mais le passé composé rend naturellement en français l’acte créateur évoqué dans le contexte.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Dans ce contexte de création, « les cieux » conserve la portée cosmologique et le registre poétique du pluriel hébreu.
- source_word: בִּתְבוּנָה
  choice: avec intelligence
  rationale: תְּבוּנָה désigne l’intelligence, le discernement ou la compétence réfléchie. « Avec intelligence » reste proche de l’hébreu et exprime ici la manière ou le moyen de l’acte créateur.
- source_word: כִּי
  choice: car
  rationale: Dans le refrain du psaume, כִּי introduit le motif de la louange. « Car » est concis, naturel et adapté au registre liturgique.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: L’hébreu signifie littéralement « pour toujours » sans verbe exprimé. « Demeure » explicite sobrement la continuité impliquée et produit un refrain français naturel.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté, bonté et fidélité. « Amour fidèle » préserve ces dimensions essentielles dans une formulation française courante et non technique.
theological_decisions:
- issue: Traduction de חֶסֶד dans le refrain du Psaume 136
  choice: son amour fidèle demeure pour toujours
  alternative: sa bonté est pour toujours ; sa fidélité demeure pour toujours ; sa miséricorde dure toujours
  rationale: « Amour fidèle » conserve à la fois la dimension affective et la loyauté durable de חֶסֶד, sans réduire le terme à la seule compassion ni imposer une formulation confessionnelle particulière.
- issue: Valeur temporelle du participe עֹשֵׂה
  choice: qui a fait
  alternative: qui fait
  rationale: Le participe hébreu permet une formulation plus littérale au présent, mais le contexte énumère les actes créateurs de Dieu. Le passé composé est naturel en français tout en laissant intacte l’affirmation de Dieu comme Créateur.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme bref et la cadence du refrain sont préservés. Aucune note n’est indispensable dans ce verset isolé ; les ambiguïtés lexicales sont consignées dans les décisions de traduction.
