source:
  edition: WLC
  text: לְ/גֹזֵ֣ר יַם ס֭וּף לִ/גְזָרִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/013.yaml
  text: to him who divided the Sea of Reeds into parts[a], for his steadfast love endures forever.
translation:
  language: fr
  text: 'à celui qui divisa la mer des Roseaux[a] en parties,

    car son amour fidèle demeure pour toujours.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Traditionnellement « mer Rouge ». L’hébreu dit « mer des Roseaux ».
    reason: alternative_reading
lexical_decisions:
- source_word: לְגֹזֵר
  choice: à celui qui fendit
  rationale: Le לְ introduit ici, dans la litanie, celui qui est célébré. Le participe de גזר évoque l’action de couper ou de séparer; « fendit » est naturel en français et conserve la force de l’image.
- source_word: יַם סוּף
  choice: la mer des Roseaux
  rationale: Cette expression rend directement le sens courant de l’hébreu יַם סוּף, sans lui substituer l’appellation traditionnelle « mer Rouge ».
- source_word: לִגְזָרִים
  choice: en deux
  rationale: Le pluriel גְזָרִים désigne des parties séparées. Dans le contexte du passage de la mer, « en deux » exprime naturellement en français la division produite, sans la formulation peu idiomatique « en parties ».
- source_word: כִּי
  choice: car
  rationale: Dans le refrain du psaume, כִּי introduit le motif de la louange.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: L’hébreu est une proposition sans verbe exprimé; « demeure » fournit en français le verbe nécessaire tout en gardant l’idée de permanence.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד désigne un amour loyal, durable et engagé. « Amour fidèle » en transmet la richesse dans un français moderne et accessible.
