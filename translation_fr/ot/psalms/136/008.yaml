  text: the sun to rule by day[b][a], for his steadfast love endures forever.
translation:
  language: fr
  text: le soleil pour dominer pendant le jour[a], car son amour fidèle dure éternellement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour exercer sa domination pendant le jour ». L’hébreu emploie un nom, « domination » ou « règne », là où le français préfère généralement une construction à l’infinitif.
    reason: lexical_alternative
  - marker: b
    text: L’expression « amour fidèle » traduit l’hébreu ḥésèd, terme riche qui peut aussi être rendu, selon le contexte, par « bonté », « miséricorde » ou « fidélité à l’alliance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[marqueur d’objet direct, non traduit séparément]'
  rationale: Ce marqueur introduit en hébreu un objet direct défini; sa fonction est rendue implicitement par la syntaxe française.
- source_word: הַשֶּׁמֶשׁ
  choice: le soleil
  rationale: Équivalent direct et naturel du nom défini hébreu.
- source_word: לְמֶמְשֶׁלֶת
  choice: pour dominer
  rationale: Le substantif hébreu exprime la domination ou l’exercice de l’autorité. Une tournure infinitive est naturelle en français et maintient le parallélisme avec le verset suivant.
- source_word: בַּיּוֹם
  choice: sur le jour
  rationale: La préposition peut désigner la sphère sur laquelle s’exerce la domination. Cette formulation fait écho à Genèse 1.16 tout en restant intelligible; « pendant le jour » serait plus idiomatique mais atténuerait l’idée de gouvernement.
- source_word: כִּי
  choice: car
  rationale: Introduit le motif de la louange dans le refrain et conserve une cadence liturgique naturelle.
- source_word: לְעוֹלָם
  choice: dure à toujours
  rationale: Le refrain hébreu est sans verbe explicite; « dure » exprime naturellement la permanence indiquée par לְעוֹלָם.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et bienveillance durable. « Amour fidèle » garde cette richesse sans limiter le terme à la seule miséricorde.
theological_decisions:
- issue: Sens de la domination exercée par le soleil
  choice: pour dominer sur le jour
  alternative: pour éclairer pendant le jour
  rationale: Le texte parle explicitement de domination, non simplement d’éclairage. La traduction conserve cette image cosmique sans suggérer que le soleil possède une autorité indépendante de Dieu.
- issue: Traduction de חֶסֶד dans le refrain
  choice: son amour fidèle dure à toujours
  alternative: sa bonté dure éternellement; sa fidélité à l’alliance dure à toujours; sa miséricorde dure à toujours
  rationale: « Amour fidèle » exprime conjointement l’affection, la loyauté et la constance du terme, sans imposer un sens exclusivement émotionnel, juridique ou compassionnel.
translation_notes:
  register: Français international moderne, poétique et liturgique. « À toujours » donne au refrain une cadence biblique digne tout en restant compréhensible; « éternellement » demeure une possibilité plus courante.
