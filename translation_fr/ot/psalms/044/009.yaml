source:
  edition: WLC
  text: אַף זָ֭נַחְתָּ וַ/תַּכְלִימֵ֑/נוּ וְ/לֹא תֵ֝צֵ֗א בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: fr
  text: Pourtant, tu nous as rejetés et couverts de honte, et tu ne sors pas avec nos armées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « tu ne sors pas dans nos armées ».'
    reason: La préposition hébraïque ב peut être rendue plus littéralement par « dans »; « avec » explicite naturellement en français le sens associatif dans le contexte militaire.
lexical_decisions:
- source_word: אַף
  choice: Pourtant
  rationale: La particule marque ici un contraste abrupt avec le rappel des secours accordés autrefois par Dieu. « Pourtant » rend naturellement ce retournement dans le discours.
- source_word: זָנַחְתָּ
  choice: tu nous as rejetés
  rationale: Le verbe זנח exprime le rejet ou l’abandon. « Rejetés » conserve sa force relationnelle dans un français actuel et digne.
- source_word: וַתַּכְלִימֵנוּ
  choice: et couverts de honte
  rationale: Le hifil de כלם signifie causer la honte ou le déshonneur. « Couvrir de honte » exprime clairement cette valeur causative sans préciser indûment la manière.
- source_word: וְלֹא תֵצֵא
  choice: et tu ne sors plus
  rationale: יצא signifie fondamentalement « sortir ». Dans ce contexte militaire, le présent français exprime l’absence actuelle de Dieu aux côtés des troupes; « plus » fait ressortir le contraste avec ses interventions passées, implicite dans le contexte.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: avec nos armées
  rationale: 'צָבָא désigne ici les forces militaires. La préposition ב est comprise dans un sens associatif : Dieu ne sort pas avec elles. Cette formulation est naturelle en français et conserve l’image militaire.'
theological_decisions:
- issue: Retrait de Dieu lors des combats
  choice: Le verset présente la plainte selon laquelle Dieu a rejeté son peuple et ne l’accompagne plus au combat.
  alternative: Traduire plus littéralement la dernière proposition par « tu ne sors pas au milieu de nos armées » ou « dans nos armées ».
  rationale: 'La traduction garde entière la tension de la lamentation : le psalmiste attribue directement à Dieu le rejet, la honte et son absence au combat, sans expliquer ni systématiser cette expérience.'
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. Aucun marqueur de note n’est nécessaire, puisque « avec nos armées » rend directement et sans perte notable la valeur contextuelle de בְּ.
