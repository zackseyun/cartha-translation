source:
  edition: WLC
  text: מִ֭/קּוֹל מְחָרֵ֣ף וּ/מְגַדֵּ֑ף מִ/פְּנֵ֥י א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/016.yaml
  text: because of the voice of one who reproaches and blasphemes[b][a], because of the enemy and the avenger.
translation:
  language: fr
  text: 'à cause de la voix de celui qui couvre d’opprobre et blasphème[a],

    à cause de l’ennemi et de celui qui se venge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et profère des outrages ». Le verbe hébreu peut désigner aussi bien des paroles injurieuses qu’un discours blasphématoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: à cause de la voix de
  rationale: La préposition מִן a ici une valeur causale. « La voix » conserve l’image concrète de l’hébreu et désigne les paroles hostiles entendues.
- source_word: מְחָרֵף
  choice: celui qui couvre d’opprobre
  rationale: Le participe חרף désigne quelqu’un qui accable de mépris ou d’insultes. Cette formulation garde la force participiale sans préciser abusivement la personne visée.
- source_word: וּמְגַדֵּף
  choice: et blasphème
  rationale: גדף peut désigner des paroles outrageantes et, dans plusieurs contextes bibliques, un discours impie. « Blasphème » maintient cette nuance forte, tandis qu’une note signale le sens plus général possible.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: L’expression, littéralement liée à la face ou à la présence, a ici une valeur causale et forme un parallèle avec מִקּוֹל.
- source_word: אֹיֵב
  choice: l’ennemi
  rationale: Le singulier défini rend naturellement le nom hébreu, qui peut avoir une portée représentative ou collective.
- source_word: וּמִתְנַקֵּם
  choice: et de celui qui se venge
  rationale: Le participe hitpael de נקם présente une personne qui exerce ou recherche la vengeance. La périphrase évite le caractère potentiellement positif du nom français « vengeur ».
theological_decisions:
- issue: Portée religieuse ou générale du discours hostile exprimé par גדף
  choice: blasphème
  alternative: outrage / profère des injures
  rationale: Le terme peut évoquer une parole impie contre Dieu, mais il peut aussi désigner une injure grave. Le texte principal conserve la possible portée théologique, et la note maintient l’ambiguïté lexicale.
- issue: Identité de l’ennemi et de celui qui se venge
  choice: maintenir deux désignations coordonnées
  alternative: « l’ennemi assoiffé de vengeance », compris comme une seule personne
  rationale: La conjonction hébraïque permet que les deux expressions renvoient à une même figure ou à deux figures. La coordination formelle évite de trancher cette question.
translation_notes:
  register: Français moderne, digne et lisible. La syntaxe causale et le parallélisme poétique de l’hébreu sont conservés. « Couvre d’opprobre » garde la gravité du premier participe sans ajouter un complément absent du texte source.
