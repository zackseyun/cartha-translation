  source_fidelity: Le texte rend fidèlement les deux groupes causaux de l’hébreu (מִקּוֹל et מִפְּנֵי), en conservant l’image de la « voix » et la coordination des deux participes dans chaque groupe. « Celui qui couvre d’opprobre » rend correctement מְחָרֵף sans ajouter de destinataire, et « blasphème » maintient la possible portée impie de מְגַדֵּף. « L’ennemi et celui qui se venge » préserve la construction coordonnée sans décider s’il s’agit d’une seule figure ou de deux.
