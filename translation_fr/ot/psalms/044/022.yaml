  naturalness: La formulation révisée est naturelle en français moderne, conserve un registre poétique sobre et maintient le parallélisme du verset. « Destinées à l’abattage » est idiomatique et moins concrètement industriel que « à l’abattoir », tout en exprimant la destination de l’image.
  terminology: « Mis à mort », « considérés », « brebis » et « abattage » conviennent au registre du psaume. La seconde note doit porter sur « considérés », car elle correspond à l’alternative lexicale de נֶחְשַׁבְנוּ ; la note du projet sur « abattage » ne reflète pas l’alternative documentée et laisse sans ancrage l’alternative pertinente.
