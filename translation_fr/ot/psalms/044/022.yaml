  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: fr
  text: Car, à cause de toi, nous sommes mis à mort tout au long du jour[a] ; nous sommes considérés comme des brebis destinées à l’abattage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour toi » ou « en raison de toi ». L’hébreu peut désigner une souffrance endurée du fait de la relation avec Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous sommes comptés comme des brebis destinées à l’abattage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: Dans ce contexte poétique, כִּי appuie la plainte précédente et peut avoir une valeur affirmative. « Oui » restitue cet enchaînement sans alourdir le vers français d’un « car » potentiellement trop strictement causal.
- source_word: עָלֶיךָ
  choice: à cause de toi
  rationale: La préposition עַל avec le suffixe renvoie ici à Dieu comme motif ou cause relationnelle de la souffrance. « À cause de toi » conserve l’ambiguïté entre souffrir en raison de son appartenance à Dieu et souffrir du fait de cette relation, sans préciser que Dieu tue directement.
- source_word: הֹרַגְנוּ
  choice: nous sommes mis à mort
  rationale: Le parfait passif décrit ici, avec « tout au long du jour », une réalité répétée ou continue. Le présent français convient à cette portée et « mis à mort » garde le registre grave du poème.
- source_word: כָל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette tournure française naturelle exprime une durée continue ou répétée pendant toute la journée.
- source_word: נֶחְשַׁבְנוּ
  choice: nous sommes considérés
  rationale: Le passif de חשׁב exprime ici une estimation ou une manière de traiter quelqu’un. « Considérés » est clair en français moderne et évite le sens numérique de « comptés ».
- source_word: כְּצֹאן
  choice: comme des brebis
  rationale: Le כ comparatif introduit une image. « Comme des brebis » est naturel et maintient le pluriel collectif de צֹאן dans ce contexte.
- source_word: טִבְחָה
  choice: destinées à l’abattoir
  rationale: Le terme désigne l’abattage. Cette formulation idiomatique exprime la destination funeste des brebis tout en conservant un registre digne.
theological_decisions:
- issue: La souffrance est-elle causée par Dieu ou endurée en raison de la relation et de la fidélité à Dieu ?
  choice: « à cause de toi » dans le texte principal, avec une note proposant « pour toi » et « en raison de toi »
  alternative: « pour toi »
  rationale: 'L’hébreu laisse ouverte la nature précise du rapport causal. Le texte et la note préservent la tension : le peuple souffre en relation avec Dieu, sans faire explicitement de Dieu l’agent direct de sa mise à mort.'
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé en deux propositions, avec une ponctuation sobre. Les deux marqueurs de note figurent dans le texte principal.
