base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: fr
  text: Pourquoi caches-tu ton visage et oublies-tu notre misère et notre oppression ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta présence ». L’hébreu dit littéralement « ton visage », expression courante qui évoque une attention favorable ou la proximité.
