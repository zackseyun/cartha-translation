lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Interrogatif direct de cause, naturel en français et adapté à la plainte adressée à Dieu.
- source_word: פָנֶיךָ
  choice: ton visage
  rationale: Conserve l’image hébraïque du visage, qui évoque ici la présence, l’attention et la faveur divines sans réduire la force poétique de l’expression.
- source_word: תַסְתִּיר
  choice: caches
  rationale: Rend directement le hifil de סתר et forme en français l’expression biblique naturelle « cacher son visage ».
- source_word: תִּשְׁכַּח
  choice: oublies
  rationale: Préserve le sens premier et l’audace de la plainte, plutôt que de l’atténuer en « négliges » ou « ignores ».
- source_word: עָנְיֵנוּ
  choice: notre misère
  rationale: Rend l’état d’affliction et de souffrance collective dans un français moderne et courant.
- source_word: וְלַחֲצֵנוּ
  choice: notre oppression
  rationale: Exprime la pression hostile exercée sur la communauté et distingue ce terme de la misère déjà évoquée.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu dans « ton visage »
  choice: Conserver littéralement « ton visage ».
  alternative: ta présence
  rationale: L’hébreu emploie une image corporelle et relationnelle qui suggère l’attention, la proximité et la faveur de Dieu. La conserver maintient la force poétique et la tension de la plainte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La formulation conserve le parallélisme de la plainte et l’image biblique du visage divin.
