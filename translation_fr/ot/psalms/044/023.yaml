id: PSA.44.23
reference: Psalms 44:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ע֤וּרָ/ה לָ֖/מָּה תִישַׁ֥ן אֲדֹנָ֑/י הָ֝קִ֗יצָ/ה אַל תִּזְנַ֥ח לָ/נֶֽצַח׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: fr
  text: Éveille-toi ! Pourquoi dors-tu, Seigneur ? Réveille-toi ! Ne nous rejette pas pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : Ne nous abandonne pas à jamais.'
    reason: Alternative lexicale possible pour תִּזְנַח et formulation équivalente de לָנֶצַח.
lexical_decisions:
- source_word: ע֤וּרָה
  choice: Éveille-toi !
  rationale: L’impératif appelle directement Dieu à s’éveiller. « Éveille-toi ! » conserve la force et la dignité de cette interpellation.
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Rend simplement l’adverbe interrogatif qui introduit la plainte.
- source_word: תִישַׁן
  choice: dors-tu
  rationale: Préserve sans l’atténuer l’image audacieuse du sommeil divin dans une question rhétorique.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé ici en apostrophe directe ; « Seigneur » est le rendu français naturel et traditionnel.
- source_word: הָקִיצָה
  choice: Réveille-toi !
  rationale: Second impératif d’éveil. Un verbe français différent de celui de la première proposition respecte la variation lexicale hébraïque et l’intensification parallèle.
- source_word: אַל
  choice: Ne… pas
  rationale: Rend la particule négative employée dans cette demande pressante.
- source_word: תִּזְנַח
  choice: rejette
  rationale: Le verbe זנח peut signifier rejeter, repousser ou abandonner. « Rejette » est clair, actuel et conserve la vigueur de la plainte.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Expression française courante correspondant à l’idée d’une durée permanente.
theological_decisions:
- issue: Langage anthropomorphique présentant Dieu comme endormi et appelé à s’éveiller
  choice: Conserver directement les images du sommeil et du réveil
  alternative: 'Atténuer l’image, par exemple : « Pourquoi sembles-tu ne pas agir ? »'
  rationale: L’hébreu formule une plainte audacieuse en s’adressant à Dieu au moyen de cette image. La traduction doit préserver cette tension poétique et théologique sans la transformer en explication.
translation_notes:
  register: Français international moderne, direct et digne. Les deux impératifs distincts (« Éveille-toi », « Réveille-toi ») rendent la variation des deux verbes hébreux tout en maintenant le parallélisme et l’urgence de la supplication.
