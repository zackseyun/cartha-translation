id: PSA.44.25
reference: Psalms 44:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י שָׁ֣חָה לֶ/עָפָ֣ר נַפְשֵׁ֑/נוּ דָּבְקָ֖ה לָ/אָ֣רֶץ בִּטְנֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/025.yaml
  text: For our soul has sunk down to the dust[b][a]; our belly clings to the earth.
translation:
  language: fr
  text: Car notre âme s’est affaissée jusqu’à la poussière[a][b] ; notre ventre reste collé à la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre vie » ou « nous-mêmes », au lieu de « notre âme ».
    reason: lexical_alternative
  - marker: b
    text: Ou « s’est courbée jusqu’à la poussière ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison de la supplication qui suit ; « Car » conserve naturellement la valeur causale en français.
- source_word: שָׁחָה
  choice: s’est affaissée
  rationale: Le verbe évoque l’abaissement ou l’effondrement. « S’est affaissée » s’accorde avec l’image de la poussière sans réduire le sens à une simple posture.
- source_word: לֶעָפָר
  choice: jusqu’à la poussière
  rationale: עָפָר désigne la poussière, et la préposition indique la direction ou le point atteint. « Jusqu’à » rend clairement l’extrême abaissement décrit.
- source_word: נַפְשֵׁנוּ
  choice: notre âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Notre âme » préserve le langage anthropologique et poétique sans en fixer excessivement la portée.
- source_word: דָּבְקָה
  choice: reste collé
  rationale: Le verbe signifie adhérer ou être étroitement attaché. Avec « ventre », « reste collé » donne en français une image concrète et naturelle de la prostration.
- source_word: לָאָרֶץ
  choice: à la terre
  rationale: אֶרֶץ peut désigner la terre ou le sol. « La terre » maintient le parallélisme poétique avec « la poussière ».
- source_word: בִּטְנֵנוּ
  choice: notre ventre
  rationale: בֶּטֶן désigne littéralement le ventre ou l’intérieur du corps. La traduction directe conserve l’image du corps étendu face contre terre.
theological_decisions:
- issue: Portée anthropologique de נַפְשֵׁנוּ
  choice: notre âme
  alternative: notre vie ; nous-mêmes
  rationale: Dans cette lamentation poétique, le mot hébreu peut désigner l’âme, la vie ou la personne entière. « Notre âme » conserve cette profondeur et cette tension sans imposer une anthropologie plus précise que le texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « poussière / terre » et l’image corporelle très concrète sont conservés. Les marqueurs sont placés après l’expression à laquelle se rapportent les deux variantes.
