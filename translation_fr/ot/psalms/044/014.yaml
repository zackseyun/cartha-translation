  text: תְּשִׂימֵ֣/נוּ מָ֭שָׁל בַּ/גּוֹיִ֑ם מְנֽוֹד רֹ֝֗אשׁ בַּל אֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/014.yaml
  text: You make us a proverb among the nations[b][a], a shaking of the head among the peoples.
translation:
  language: fr
  text: 'Tu fais de nous un proverbe parmi les nations[a],

    un hochement de tête parmi les peuples[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un sujet de raillerie parmi les nations ». Le mot hébreu peut désigner un proverbe ou une formule proverbiale employée avec mépris.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un hochement de tête », geste exprimant la moquerie ou le mépris.
    reason: cultural_note
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Tu fais de nous
  rationale: Le verbe שׂים signifie « mettre, placer » et peut exprimer ici le résultat produit. « Tu fais de nous » est naturel en français et conserve l’adresse directe à Dieu au masculin singulier.
- source_word: מָשָׁל
  choice: un proverbe
  rationale: מָשָׁל peut désigner un proverbe, une formule proverbiale ou un sobriquet méprisant. « Un proverbe » en garde l’équivalent direct, tandis qu’une note signale la nuance possible de mépris.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations étrangères en général. « Parmi les nations » est précis et évite le sens technique plus tardif que pourrait suggérer « les païens ».
- source_word: מְנוֹד רֹאשׁ
  choice: un objet de dérision
  rationale: L’expression évoque le mouvement de tête par lequel on manifeste le mépris ou la moquerie. Le corps du texte en explicite naturellement la fonction en français, tandis que la note conserve l’image concrète.
- source_word: בַּל אֻמִּים
  choice: parmi les peuples
  rationale: La formule est parallèle à בַּגּוֹיִם. « Parmi les peuples » préserve le parallélisme poétique sans répéter « nations ».
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « nations / peuples » est conservé. La seconde ligne privilégie une formulation immédiatement intelligible, avec l’image corporelle littérale donnée en note.
