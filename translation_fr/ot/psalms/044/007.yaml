  text: כִּ֣י ה֭וֹשַׁעְתָּ/נוּ מִ/צָּרֵ֑י/נוּ וּ/מְשַׂנְאֵ֥י/נוּ הֱבִישֽׁוֹתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/007.yaml
  text: For you have saved us from our adversaries[a], and you have put those who hate us to shame.
translation:
  language: fr
  text: Car tu nous as sauvés de nos adversaires, et tu as couvert de honte ceux qui nous haïssent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Dans le contexte, la conjonction introduit le motif de la louange exprimée au verset précédent; « Car » en conserve naturellement la valeur explicative.
- source_word: הוֹשַׁעְתָּנוּ
  choice: tu nous as sauvés
  rationale: Le hifil de יָשַׁע exprime ici l’action de sauver ou de délivrer. Le passé composé présente cette action accomplie sans la réduire à la seule idée de victoire.
- source_word: מִצָּרֵינוּ
  choice: de nos adversaires
  rationale: צַר désigne ceux qui s’opposent avec hostilité. « Adversaires » convient au registre poétique et reste plus proche du terme hébreu que des formulations explicitant une oppression.
- source_word: וּמְשַׂנְאֵינוּ
  choice: et ceux qui nous haïssent
  rationale: Le participe de שָׂנֵא désigne littéralement « ceux qui nous haïssent ». Cette tournure est naturelle en français et préserve l’idée d’une hostilité personnelle continue.
- source_word: הֱבִישׁוֹתָ
  choice: tu as couvert de honte
  rationale: 'Le hifil de בּוֹשׁ a un sens causatif: faire éprouver la honte ou livrer à la honte. « Couvrir de honte » rend ce sens dans un français idiomatique et digne.'
