  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: fr
  text: Dieu ne scruterait-il pas cela ? Car il connaît les secrets du cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: ne… pas ?
  rationale: Introduit une question rhétorique appelant une réponse affirmative ; la tournure française avec inversion en préserve la force interrogative et le registre soutenu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le pluriel morphologique fonctionne ici comme le titre singulier du Dieu d’Israël.
- source_word: יַחֲקָר
  choice: découvrirait
  rationale: Le verbe désigne une recherche approfondie conduisant à mettre au jour ce qui est caché. « Découvrir » est idiomatique avec le complément « cela » et conserve cette idée d’investigation.
- source_word: זֹאת
  choice: cela
  rationale: Le démonstratif renvoie de façon concise à la conduite évoquée dans le contexte précédent.
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde la question rhétorique, dans une formulation française concise et digne.
- source_word: יֹדֵעַ
  choice: connaît
  rationale: Le participe exprime la connaissance constante et caractéristique de Dieu ; le présent français la rend naturellement.
- source_word: תַּעֲלֻמוֹת
  choice: les secrets
  rationale: Le nom désigne les réalités cachées ou secrètes. « Les secrets du cœur » est une expression française naturelle qui conserve le sens de ce qui demeure dissimulé.
- source_word: לֵב
  choice: cœur
  rationale: Conserve l’image anthropologique hébraïque, qui englobe pensées, intentions, volonté et sentiments sans réduire le terme au seul intellect.
theological_decisions:
- issue: Portée anthropologique de לֵב
  choice: cœur
  alternative: esprit ; être intérieur
  rationale: « Cœur » préserve l’image biblique et l’ampleur du terme hébreu, qui comprend la pensée, la volonté et les affections, sans imposer une lecture doctrinale plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est maintenue, ainsi que l’enchaînement explicatif introduit par « Car ».
