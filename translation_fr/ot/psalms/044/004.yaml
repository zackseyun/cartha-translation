  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: fr
  text: C’est toi qui es mon roi, ô Dieu ! Ordonne des victoires pour Jacob.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Ordonne des délivrances pour Jacob » ou « décrète des actes de salut pour Jacob ».

      '
    reason: 'Alternative lexicale : יְשׁוּעוֹת peut désigner des victoires, des délivrances ou des actes de salut ; צַוֵּה peut aussi être rendu par « décrète » selon la nuance retenue.'
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: C’est toi qui es
  rationale: La combinaison des deux pronoms est emphatique. Cette tournure française naturelle conserve l’insistance de l’hébreu.
- source_word: מַלְכִּי
  choice: mon roi
  rationale: Le nom avec suffixe de première personne du singulier signifie « mon roi ». La minuscule suit l’usage courant du français moderne, sans diminuer la valeur du titre divin.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le terme fonctionne ici comme une apostrophe. « Ô Dieu » restitue clairement l’adresse directe et le ton poétique de la prière.
- source_word: צַוֵּה
  choice: Ordonne
  rationale: L’impératif piel de צוה signifie directement « ordonner, commander ». « Ordonne » est idiomatique lorsque Dieu est prié de faire advenir ces victoires.
- source_word: יְשׁוּעוֹת
  choice: des victoires
  rationale: Le pluriel désigne des actes de salut ou de délivrance. Dans le contexte militaire et collectif du psaume, « victoires » exprime concrètement ces délivrances, tandis que la note préserve l’éventail lexical.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom hébreu est conservé plutôt que remplacé par « Israël » ; il désigne poétiquement le peuple dans son ensemble.
theological_decisions:
- issue: Sens de יְשׁוּעוֹת dans un psaume guerrier
  choice: « victoires », au sens de délivrances concrètes face aux ennemis
  alternative: « délivrances » ou « saluts »
  rationale: Le contexte environnant est celui du combat collectif. « Victoires » rend ce cadre de façon claire sans effacer les autres valeurs possibles du terme, signalées en note.
- issue: Construction de l’adresse directe
  choice: 'אֱלֹהִים est compris comme un vocatif : « ô Dieu »'
  alternative: Une apposition telle que « mon roi, Dieu » ou une proposition comme « mon roi est Dieu »
  rationale: 'La syntaxe se lit le plus naturellement comme une prière adressée à Dieu : « C’est toi qui es mon roi, ô Dieu ! » Cette lecture conserve aussi l’emphase initiale.'
translation_notes:
  register: Français international moderne, poétique et digne. L’emphase hébraïque est rendue par « C’est toi qui es » ; l’apostrophe « ô Dieu » maintient le ton de prière. La formulation reste accessible sans aplanir la pluralité sémantique de יְשׁוּעוֹת.
