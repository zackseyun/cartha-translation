id: PSA.44.19
reference: Psalms 44:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י דִ֭כִּיתָ/נוּ בִּ/מְק֣וֹם תַּנִּ֑ים וַ/תְּכַ֖ס עָלֵ֣י/נוּ בְ/צַלְמָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/019.yaml
  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: fr
  text: Car tu nous as écrasés dans un lieu de chacals[b], et tu nous as couverts de profondes ténèbres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’ombre de la mort ».
    reason: lexical_alternative
  - marker: b
    text: « Chacals » est le sens le plus probable dans cette évocation d’un lieu désolé; certaines traductions anciennes ont « dragons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente. « Car » rend clairement ce lien dans un registre poétique digne.
- source_word: דִכִּיתָנוּ
  choice: tu nous as écrasés
  rationale: Le verbe דכה exprime l’idée d’écraser, de briser ou d’humilier. « Écrasés » conserve la force de l’affliction sans la réduire à une oppression uniquement sociale ou psychologique.
- source_word: בִּמְקוֹם
  choice: dans un lieu de
  rationale: Cette formulation respecte le sens spatial et le caractère indéfini de l’expression hébraïque, tout en restant naturelle en français.
- source_word: תַּנִּים
  choice: chacals
  rationale: Dans cette évocation poétique d’un endroit désolé, le mot désigne très probablement des chacals. D’autres interprétations zoologiques, notamment « dragons » dans des traductions anciennes, sont moins vraisemblables ici.
- source_word: וַתְּכַס
  choice: et tu nous as couverts
  rationale: Le verbe poursuit l’adresse directe à Dieu et conserve la métaphore concrète d’une obscurité qui recouvre les personnes.
- source_word: עָלֵינוּ
  choice: nous
  rationale: Avec le verbe français « couvrir », le pronom objet rend naturellement la valeur de עַל dans cette construction; une traduction littérale par « sur nous » serait moins idiomatique.
- source_word: בְצַלְמָוֶת
  choice: de profondes ténèbres
  rationale: צַלְמָוֶת peut désigner une obscurité très profonde ou être compris traditionnellement comme « l’ombre de la mort ». Le texte principal emploie une expression française claire sans effacer l’autre lecture, conservée en note.
theological_decisions:
- issue: Sens de בְצַלְמָוֶת
  choice: de profondes ténèbres
  alternative: de l’ombre de la mort
  rationale: Le terme peut fonctionner comme une désignation intensifiée de l’obscurité sans constituer nécessairement une référence explicite à la mort. La note maintient la lecture traditionnelle et la tension lexicale sans imposer une interprétation théologique unique.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « couverts de profondes ténèbres » demeure idiomatique et intelligible.
