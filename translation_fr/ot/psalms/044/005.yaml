id: PSA.44.5
reference: Psalms 44:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ֭/ךָ צָרֵ֣י/נוּ נְנַגֵּ֑חַ בְּ֝/שִׁמְ/ךָ֗ נָב֥וּס קָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/005.yaml
  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: fr
  text: Par toi, nous repoussons nos adversaires[a] ; par ton nom[b], nous piétinons ceux qui se dressent contre nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « encorner » ou « frapper avec les cornes » ; il évoque ici le fait de refouler vigoureusement les adversaires.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « en ton nom ». Ici, le « nom » désigne l’identité révélée, l’autorité et la puissance de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: Par toi
  rationale: La préposition בְּ avec suffixe personnel exprime ici le moyen ou l’agent dans un contexte de victoire militaire. « Par toi » est naturel en français et attribue clairement à Dieu l’efficacité décisive.
- source_word: צָרֵינוּ
  choice: nos adversaires
  rationale: Le terme désigne des opposants hostiles. « Adversaires » est précis, digne et convient au registre poétique.
- source_word: נְנַגֵּחַ
  choice: nous repoussons
  rationale: Le verbe évoque littéralement l’action de frapper ou d’encorner avec des cornes, puis, métaphoriquement, celle de refouler vigoureusement l’ennemi. « Repoussons » rend le mouvement martial sans imposer une image animale étrange dans le texte principal.
- source_word: בְּשִׁמְךָ
  choice: par ton nom
  rationale: La construction parallèle à בְּךָ présente le nom de Dieu comme moyen ou puissance agissante. En hébreu, le « nom » renvoie à l’identité révélée, à l’autorité et à la puissance de Dieu.
- source_word: נָבוּס
  choice: nous piétinons
  rationale: Le verbe בוס signifie fouler ou piétiner. Ce choix conserve la vigueur de l’image militaire et le parallélisme du verset.
- source_word: קָמֵינוּ
  choice: ceux qui se dressent contre nous
  rationale: Le participe issu de קום désigne ceux qui se lèvent en opposition. La proposition relative préserve la nuance verbale de l’hébreu.
theological_decisions:
- issue: Agent de la victoire dans l’image guerrière
  choice: Le verset attribue la victoire à l’action déterminante de Dieu (« Par toi… par ton nom »), tout en décrivant l’action du peuple au combat.
  alternative: Mettre davantage l’accent soit sur l’action militaire humaine, soit sur le « nom » comme formule d’invocation.
  rationale: Les deux groupes prépositionnels parallèles présentent Dieu comme la source efficace de la victoire, tandis que les verbes à la première personne du pluriel maintiennent la participation humaine. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, ainsi que les images militaires fortes, sans archaïsme inutile.
