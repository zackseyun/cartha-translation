id: PSA.44.26
reference: Psalms 44:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֭וּמָֽ/ה עֶזְרָ֣תָ/ה לָּ֑/נוּ וּ֝/פְדֵ֗/נוּ לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/026.yaml
  text: Rise up as our help[c][b][a], and redeem us for the sake of your steadfast love.
translation:
  language: fr
  text: Lève-toi pour nous secourir[a], et délivre-nous[b] à cause de ton amour fidèle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Lève-toi, secours pour nous »; on peut aussi traduire : « Lève-toi comme notre secours ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rachète-nous ». Le verbe hébreu peut désigner une délivrance, notamment par rachat ou par une intervention décisive.'
    reason: lexical_alternative
  - marker: c
    text: L’expression hébraïque désigne un amour empreint de bonté, de loyauté et de fidélité durable.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: Impératif qal masculin singulier de קום. « Lève-toi » conserve l’image vive et l’urgence de l’appel adressé à Dieu.
- source_word: עֶזְרָתָה לָנוּ
  choice: pour nous secourir
  rationale: L’hébreu emploie littéralement le nom « secours/aide » avec « pour nous ». La tournure verbale française est naturelle tout en gardant la finalité de l’appel; la construction nominale est signalée en note.
- source_word: וּפְדֵנוּ
  choice: et délivre-nous
  rationale: L’impératif de פדה peut exprimer la libération, parfois par rachat. « Délivre-nous » convient ici à l’appel collectif sans imposer une transaction explicite; « rachète-nous » reste indiqué comme possibilité.
- source_word: לְמַעַן
  choice: à cause de
  rationale: La préposition présente le חֶסֶד de Dieu comme le fondement ou le motif de son intervention. « À cause de » est clair et idiomatique en français.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד associe bonté, loyauté et fidélité relationnelle. « Amour fidèle » exprime ces dimensions sans rendre explicite une notion d’alliance qui demeure implicite.
theological_decisions:
- issue: Portée théologique de פדה
  choice: délivre-nous
  alternative: rachète-nous
  rationale: Le contexte demande une intervention salvatrice de Dieu, mais le verset ne précise ni prix ni moyen de rachat. « Délivre-nous » préserve cette ouverture sémantique, tandis que la note conserve l’autre nuance.
- issue: Rendu de חֶסֶד
  choice: ton amour fidèle
  alternative: ta bonté fidèle; ton amour loyal; ta fidélité
  rationale: « Amour fidèle » maintient ensemble l’affection bienveillante et la loyauté durable de Dieu, sans réduire le terme à la seule miséricorde ni expliciter excessivement son cadre d’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme impératif est conservé. La formulation principale privilégie l’idiome français, tandis que les notes rendent visibles la construction nominale inhabituelle et les principales ambiguïtés lexicales de l’hébreu.
