  source_fidelity: '« Tout cela nous est arrivé » rend fidèlement כָּל־זֹאת בָּאַתְנוּ, avec une formulation française idiomatique. Les deux négations conservent l’adresse directe à Dieu : « nous ne t’avons pas oublié » correspond à וְלֹא שְׁכַחֲנוּךָ, et « nous n’avons pas été infidèles à ton alliance » exprime de façon juste l’idée de conduite déloyale ou fausse à l’égard de l’alliance dans וְלֹא שִׁקַּרְנוּ בִּבְרִיתֶךָ. Le contraste contextuel introduit par « pourtant » est légitime et ne renforce pas indûment l’affirmation.'
  naturalness: Le français est moderne, clair et d’un registre convenant à un psaume. L’enchaînement au passé composé est naturel, et « infidèles à ton alliance » est plus fluide en français international que des calques tels que « agir faussement dans ton alliance ».
  terminology: « Alliance » est le terme établi et approprié pour בְּרִית. « Infidèles à ton alliance » conserve la portée d’infidélité covenantale sans transformer le verset en déclaration d’absence totale de péché.
