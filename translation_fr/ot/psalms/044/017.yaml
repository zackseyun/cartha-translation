id: PSA.44.17
reference: Psalms 44:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: fr
  text: Tout cela nous est arrivé, pourtant nous ne t’avons pas oublié et nous n’avons pas été infidèles à ton alliance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל זֹאת
  choice: Tout cela
  rationale: Cette expression récapitule naturellement en français l’ensemble des malheurs évoqués précédemment, tout en conservant la valeur globale de כָּל.
- source_word: בָּאַתְנוּ
  choice: nous est arrivé
  rationale: Le verbe בוא signifie littéralement « venir »; appliqué à des événements, « arriver à quelqu’un » est naturel en français et garde l’idée que ces épreuves ont atteint le peuple.
- source_word: וְלֹא
  choice: pourtant… ne… pas
  rationale: Dans le contexte, la coordination marque un contraste entre les épreuves subies et la fidélité maintenue; « pourtant » l’explicite sans modifier le sens.
- source_word: שְׁכַחֲנוּךָ
  choice: nous ne t’avons pas oublié
  rationale: La traduction conserve le sens direct du verbe et le suffixe de deuxième personne singulier qui désigne Dieu.
- source_word: שִׁקַּרְנוּ
  choice: nous n’avons pas été infidèles
  rationale: Dans ce contexte d’alliance, שׁקר exprime le fait d’agir faussement ou avec déloyauté. « Être infidèle » rend clairement cette portée relationnelle et covenantale, sans réduire le verbe au seul fait de mentir.
- source_word: בִּבְרִיתֶךָ
  choice: à ton alliance
  rationale: Avec « être infidèle », la préposition française « à » exprime idiomatiquement l’objet de la déloyauté; « ton alliance » conserve l’adresse directe à Dieu.
theological_decisions:
- issue: Portée de la déclaration d’innocence d’Israël au sein de la souffrance
  choice: Le verset affirme que le peuple n’a ni oublié Dieu ni trahi son alliance.
  alternative: Comprendre ces paroles comme une affirmation générale d’absence totale de péché.
  rationale: L’hébreu formule deux dénégations précises concernant l’oubli de Dieu et l’infidélité à l’alliance. La traduction préserve cette revendication limitée sans en faire une déclaration de perfection morale absolue.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient à des épreuves passées dont les effets demeurent dans le contexte du psaume. « Infidèles à ton alliance » communique clairement la déloyauté visée par שׁקר sans introduire de terminologie confessionnelle.
