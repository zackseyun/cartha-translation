id: PSA.44.1
reference: Psalms 44:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: fr
  text: Dieu, nous avons entendu de nos propres oreilles ; nos pères nous ont raconté l’œuvre que tu as accomplie de leur temps, aux jours d’autrefois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les temps anciens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom placé en tête constitue une adresse directe. En français moderne, « Dieu, » exprime naturellement le vocatif sans ajouter « ô ».
- source_word: בְּאָזְנֵינוּ
  choice: de nos propres oreilles
  rationale: 'Cette tournure française naturelle conserve l’insistance concrète de l’hébreu : les locuteurs ont eux-mêmes entendu le récit transmis.'
- source_word: שָׁמַעְנוּ
  choice: nous avons entendu
  rationale: Le passé composé convient à un témoignage reçu dans le passé et encore pertinent au moment de la prière.
- source_word: אֲבוֹתֵינוּ
  choice: nos pères
  rationale: Ce choix conserve le terme familial masculin de l’hébreu ; selon le contexte, il désigne les générations précédentes.
- source_word: סִפְּרוּ לָנוּ
  choice: nous ont raconté
  rationale: Le verbe hébreu évoque le fait de narrer ou de rapporter, notamment dans la transmission d’un souvenir collectif.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: l’œuvre que tu as accomplie
  rationale: La formulation restitue la relation étymologique entre le nom et le verbe hébreux tout en restant idiomatique et digne en français.
- source_word: בִּימֵיהֶם
  choice: de leur temps
  rationale: Expression française naturelle équivalant à « durant leurs jours », c’est-à-dire pendant leur génération.
- source_word: בִּימֵי קֶדֶם
  choice: aux jours d’autrefois
  rationale: Cette expression poétique mais compréhensible rend l’idée d’une époque reculée et maintient la répétition temporelle du texte.
theological_decisions:
- issue: Expression de l’adresse initiale à Dieu
  choice: Dieu, nous avons entendu
  alternative: Ô Dieu, nous avons entendu
  rationale: L’hébreu emploie une adresse directe sans particule vocative distincte. Le français moderne n’exige pas « ô », qui donnerait un registre plus traditionnel et soutenu.
- issue: Référent de אֲבוֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » préserve la forme masculine et familiale du texte source, sans exclure la portée générationnelle du terme dans ce contexte.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation garde l’adresse directe, l’insistance auditive, la transmission par les pères et le parallélisme des deux indications temporelles.
