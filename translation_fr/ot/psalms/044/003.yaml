revisions:
- from: Car ce n’est pas par leur épée qu’ils ont pris possession du pays, et ce n’est pas leur bras qui les a sauvés, mais ta main droite, ton bras et la lumière de ton visage[a], parce que tu leur étais favorable.
  to: Car ce n’est pas par leur épée qu’ils ont pris possession du pays, ni par leur bras qu’ils ont été délivrés, mais par ta main droite, ton bras et la lumière de ton visage[a], parce que tu leur étais favorable.
  rationale: La révision clarifie la syntaxe française en faisant correspondre « ni par leur bras » à « ce n’est pas par leur épée » et en introduisant « mais par » devant les agents divins. Elle conserve l’ellipse quant à la double action — possession du pays et délivrance — et maintient toutes les images et la logique causale de l’hébreu.
