review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement le contraste entre les moyens humains (« leur épée », « leur bras ») et l’action de Dieu (« ta main droite », « ton bras », « la lumière de ton visage »). « Prendre possession du pays » convient à יָרְשׁוּ dans ce contexte. Toutefois, la proposition positive française laissée sans verbe ni préposition (« mais ta main droite… ») est trop elliptique et ne rattache pas clairement la série divine aux deux actions précédentes.
  naturalness: La formulation révisée emploie une ellipse poétique recevable en français, tout en répétant « par » afin que le contraste instrumental soit immédiatement intelligible. « Ils ont été délivrés » est plus naturel dans ce contexte que « leur bras les a sauvés », sans perdre le sens de הוֹשִׁיעָה.
  terminology: Les images corporelles (« épée », « bras », « main droite », « visage ») sont conservées. « La lumière de ton visage » reproduit l’image hébraïque sans la réduire à « présence » ou « faveur ». « Tu leur étais favorable » rend sobrement רָצִיתָם, sans imposer une lecture doctrinale.
  issues:
  - severity: medium
    issue: Ellipse positive insuffisamment marquée en français
    rationale: Après « ce n’est pas par… », la coordination « mais ta main droite… » est syntaxiquement incomplète et peut sembler une rupture de construction. L’hébreu permet l’ellipse verbale, mais le français a besoin au minimum de marquer le rapport instrumental par « par ».
  revised_text: Car ce n’est pas par leur épée qu’ils ont pris possession du pays, ni par leur bras qu’ils ont été délivrés, mais par ta main droite, ton bras et la lumière de ton visage[a], parce que tu leur étais favorable.
  revised_footnotes:
