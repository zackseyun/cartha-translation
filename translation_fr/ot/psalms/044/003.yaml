source:
  edition: WLC
  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: fr
  text: Car ce n’est pas par leur épée qu’ils ont pris possession du pays, ni par leur bras qu’ils ont été délivrés, mais par ta main droite, ton bras et la lumière de ton visage[a], parce que tu leur étais favorable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la lumière de ton visage » évoque la faveur et la présence bienveillante de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרְשׁוּ
  choice: ont pris possession
  rationale: Le verbe ירשׁ désigne ici l’acquisition du pays dans le contexte de la conquête. « Prendre possession » rend ce sens sans réduire le verbe à un héritage passif.
- source_word: אָרֶץ
  choice: du pays
  rationale: Dans ce contexte historique, le nom vise le territoire promis plutôt que la terre entière. En français, « le pays » est naturel et précis.
- source_word: זְרוֹעָם
  choice: leur bras
  rationale: La métaphore corporelle est conservée afin de maintenir le parallélisme entre la force humaine et le bras de Dieu.
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: les a sauvés
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. « Sauver » préserve la portée fondamentale du terme tout en convenant au cadre militaire.
- source_word: יְמִינְךָ
  choice: ta main droite
  rationale: Cette expression traditionnelle conserve l’image hébraïque de l’action puissante de Dieu.
- source_word: זְרוֹעֲךָ
  choice: ton bras
  rationale: La traduction littérale maintient le contraste poétique avec « leur bras ».
- source_word: אוֹר פָּנֶיךָ
  choice: la lumière de ton visage
  rationale: La formulation préserve l’image hébraïque du visage divin rayonnant de faveur, sans la réduire à une paraphrase abstraite.
- source_word: רְצִיתָם
  choice: tu leur étais favorable
  rationale: רצה exprime ici l’agrément ou la faveur divine. Cette formulation française est naturelle et rend explicitement la faveur sans suggérer nécessairement une émotion plus forte.
- source_word: כִּי ... כִּי
  choice: Car ... parce que
  rationale: Le premier כִּי introduit l’explication du contexte précédent, tandis que le dernier donne la raison de l’intervention divine.
theological_decisions:
- issue: Action divine et puissance militaire humaine
  choice: La possession du pays et le salut sont attribués à l’action de Dieu plutôt qu’aux armes ou à la force du peuple.
  alternative: Une affirmation générale sur la nécessité de dépendre de Dieu.
  rationale: Le texte oppose expressément « leur épée » et « leur bras » à « ta main droite », « ton bras » et « la lumière de ton visage ». La traduction conserve ce contraste précis sans en tirer une doctrine plus générale.
- issue: אוֹר פָּנֶיךָ comme image de faveur ou de présence
  choice: Conserver dans le texte « la lumière de ton visage ».
  alternative: « la lumière de ta présence » ou « ta faveur »
  rationale: L’expression évoque la faveur et la présence bienveillante de Dieu, mais son image concrète possède une richesse propre qu’il convient de préserver. La note indique le sens figuré sans le substituer au texte.
- issue: Ellipse verbale dans la proposition positive
  choice: Conserver une proposition nominale coordonnée par « mais », laissant comprendre que ces réalités divines ont accompli ce que la force humaine n’a pas accompli.
  alternative: Ajouter « c’est grâce à » ou répéter explicitement les verbes « prendre possession » et « sauver ».
  rationale: L’hébreu omet le verbe après la série « ta main droite, ton bras et la lumière de ton visage ». Le français poétique tolère ici l’ellipse après le contraste précédent, ce qui préserve l’ambiguïté quant à la manière exacte de rattacher la série aux deux actions.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des « bras » et l’image du visage divin sont conservés. « Pays » désigne naturellement le territoire concerné, et « tu leur étais favorable » rend רצה sans surinterprétation affective.
