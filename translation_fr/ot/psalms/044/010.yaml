source:
  edition: WLC
  text: תְּשִׁיבֵ֣/נוּ אָ֭חוֹר מִנִּי צָ֑ר וּ֝/מְשַׂנְאֵ֗י/נוּ שָׁ֣סוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/010.yaml
  text: You make us turn back from the foe[b][a], and those who hate us plunder for themselves.
translation:
  language: fr
  text: Tu nous fais reculer devant l’adversaire[a], et ceux qui nous haïssent pillent pour leur propre compte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « loin de l’adversaire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et ceux qui nous haïssent se sont emparés du butin pour eux-mêmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיבֵנוּ
  choice: Tu nous fais reculer
  rationale: Le hiphil de שוב est causatif (« faire retourner/reculer »). Dans ce contexte militaire, « faire reculer » exprime naturellement une retraite imposée.
- source_word: אָחוֹר
  choice: reculer
  rationale: L’idée adverbiale de mouvement vers l’arrière est intégrée au verbe français « reculer », ce qui évite la tournure moins naturelle « retourner en arrière ».
- source_word: מִנִּי צָר
  choice: devant l’adversaire
  rationale: La préposition peut décrire le recul loin de l’ennemi ou face à lui. « Devant l’adversaire » convient au contexte de défaite militaire tout en laissant l’autre lecture en note.
- source_word: מְשַׂנְאֵינוּ
  choice: ceux qui nous haïssent
  rationale: Cette formulation verbale restitue le participe et maintient sa distinction avec צָר, rendu par « adversaire ».
- source_word: שָׁסוּ
  choice: nous dépouillent
  rationale: Le verbe désigne l’action de prendre du butin. « Nous dépouillent » est naturel en français et rend explicite, d’après le contexte, que le peuple subit le pillage.
- source_word: לָמוֹ
  choice: à leur profit
  rationale: 'Le pronom fonctionne vraisemblablement comme un datif d’intérêt : les ennemis prennent le butin pour eux-mêmes. « À leur profit » rend ce sens avec concision.'
theological_decisions:
- issue: Dieu est présenté comme la cause du recul
  choice: 'Conserver le causatif direct : « Tu nous fais reculer »'
  alternative: « Nous reculons » ou « tu permets que nous reculions »
  rationale: Le texte hébreu attribue directement à Dieu l’action causative. L’atténuer en simple permission résoudrait indûment la tension théologique du psaume.
translation_notes:
  register: Français international actuel, sobre et poétique. Le tutoiement correspond à l’adresse directe à Dieu. La formulation garde le parallélisme et la tension du texte sans archaïsmes.
