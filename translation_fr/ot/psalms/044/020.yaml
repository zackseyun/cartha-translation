source:
  edition: WLC
  text: אִם שָׁ֭כַחְנוּ שֵׁ֣ם אֱלֹהֵ֑י/נוּ וַ/נִּפְרֹ֥שׂ כַּ֝פֵּ֗י/נוּ לְ/אֵ֣ל זָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: fr
  text: 'Si nous avions oublié le nom de notre Dieu

    et tendu les mains vers un dieu étranger[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un dieu d’un autre peuple ». L’adjectif hébreu désigne ici un dieu étranger au culte d’Israël.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit naturellement en français une hypothèse rétrospective dans cette protestation.
- source_word: שָׁכַחְנוּ
  choice: nous avions oublié
  rationale: Le plus-que-parfait convient au caractère hypothétique et rétrospectif de la proposition.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: le nom de notre Dieu
  rationale: Conserve l’expression hébraïque solennelle, où le nom représente l’identité de Dieu telle qu’elle est invoquée.
- source_word: וַנִּפְרֹשׂ כַּפֵּינוּ
  choice: et tendu les mains
  rationale: Rend naturellement le geste concret de prière ou d’appel sans l’interpréter explicitement par « adorer ».
- source_word: לְאֵל זָר
  choice: vers un dieu étranger
  rationale: La préposition exprime l’orientation du geste, et זָר désigne ici une divinité étrangère au culte d’Israël.
theological_decisions:
- issue: Geste associé à l’idolâtrie
  choice: tendu les mains vers un dieu étranger
  alternative: adressé nos prières à un autre dieu
  rationale: La traduction maintient l’image physique du texte hébreu et laisse le lecteur saisir sa portée cultuelle, sans remplacer l’image par une interprétation.
translation_notes:
  register: Français moderne, clair et digne. Le plus-que-parfait marque l’hypothèse rétrospective; « tendre les mains » est idiomatique en contexte de prière. Le tiret final conserve la phrase en suspens, poursuivie au verset suivant.
