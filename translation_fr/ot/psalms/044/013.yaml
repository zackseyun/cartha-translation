source:
  edition: WLC
  text: תְּשִׂימֵ֣/נוּ חֶ֭רְפָּה לִ/שְׁכֵנֵ֑י/נוּ לַ֥עַג וָ֝/קֶ֗לֶס לִ/סְבִיבוֹתֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/013.yaml
  text: You have made us a reproach to our neighbors[a], a mockery and derision to those around us.
translation:
  language: fr
  text: Tu as fait de nous un objet d’opprobre pour nos voisins, de moquerie et de raillerie pour ceux qui nous entourent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Tu as fait de nous
  rationale: Le verbe שׂים signifie « placer, établir, faire de ». Le passé composé exprime naturellement en français l’état résultant décrit dans cette lamentation, tandis que le singulier « tu » conserve l’adresse directe à Dieu.
- source_word: חֶרְפָּה
  choice: un objet de honte
  rationale: חֶרְפָּה désigne la honte publique, l’opprobre ou le déshonneur infligé par autrui. « Un objet de honte » rend clairement l’idée que les voisins considèrent le peuple avec mépris.
- source_word: לִשְׁכֵנֵינוּ
  choice: pour nos voisins
  rationale: 'La préposition ל marque ici la relation ou le point de vue : le peuple est devenu un objet de honte aux yeux de ses voisins. « Pour nos voisins » est naturel et proche de la structure hébraïque.'
- source_word: לַעַג
  choice: un sujet de moquerie
  rationale: לַעַג évoque l’action de se moquer ou le ridicule dont quelqu’un est l’objet. « Un sujet de moquerie » donne au nom abstrait une formulation française naturelle.
- source_word: קֶלֶס
  choice: raillerie
  rationale: קֶלֶס désigne une raillerie méprisante ou une dérision. « Raillerie » distingue ce terme de לַעַג tout en maintenant le parallélisme intensif.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: pour ceux qui nous entourent
  rationale: L’expression signifie littéralement « pour ceux qui sont autour de nous » et renvoie largement aux peuples environnants. Cette formulation reste claire sans préciser au-delà de l’hébreu.
theological_decisions:
- issue: Identité de l’interlocuteur
  choice: Conserver le singulier « Tu » sans nommer Dieu dans le verset
  alternative: Expliciter « Dieu, tu as fait de nous »
  rationale: La forme verbale hébraïque s’adresse à un interlocuteur masculin singulier, identifié comme Dieu par le contexte du psaume. L’ajout explicite de « Dieu » n’est pas nécessaire et irait au-delà du texte de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, avec « objet de honte », « sujet de moquerie » et « raillerie » pour exprimer l’accumulation du mépris public sans alourdir la phrase.
