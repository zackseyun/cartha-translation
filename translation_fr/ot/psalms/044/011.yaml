source:
  edition: WLC
  text: תִּ֭תְּנֵ/נוּ כְּ/צֹ֣אן מַאֲכָ֑ל וּ֝/בַ/גּוֹיִ֗ם זֵרִיתָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: fr
  text: Tu nous livres comme des brebis pour servir de nourriture[a], et tu nous as dispersés parmi les nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu nous livres comme des brebis destinées à être mangées. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, les « nations » sont les peuples étrangers parmi lesquels Israël a été dispersé.
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Tu nous livres
  rationale: Le verbe נתן signifie couramment « donner », mais, dans cette lamentation, il exprime l’idée de livrer quelqu’un à un sort hostile. « Tu nous livres » restitue naturellement cette force en français.
- source_word: כְּצֹאן
  choice: comme des brebis
  rationale: La préposition כ marque une comparaison. « Comme des brebis » conserve clairement l’image du troupeau.
- source_word: מַאֲכָל
  choice: destinées à être mangées
  rationale: Le nom désigne la nourriture ou ce qui est mangé, sans signifier précisément « abattage ». Cette formulation française rend l’image sévère sans ajouter une précision absente de l’hébreu.
- source_word: וּבַגּוֹיִם
  choice: et parmi les nations
  rationale: גוים désigne ici les peuples étrangers au milieu desquels Israël est dispersé. « Nations » reste le terme français standard et le moins interprétatif.
- source_word: זֵרִיתָנוּ
  choice: tu nous as dispersés
  rationale: Le verbe זרה peut évoquer l’action d’éparpiller ou de vanner. Dans le contexte de la dispersion parmi les peuples, « dispersés » est clair et idiomatique; le passé composé présente l’acte accompli dont les effets demeurent.
theological_decisions:
- issue: Métaphore du peuple comparé à des brebis
  choice: Conserver l’image de brebis destinées à être mangées
  alternative: comme des brebis destinées à l’abattoir; comme des brebis que l’on dévore
  rationale: Le verset présente le peuple de Dieu comme une proie livrée à ses ennemis. La traduction maintient la dureté de la plainte sans introduire l’idée plus précise d’abattage, qui n’est pas exprimée par מַאֲכָל.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La formulation conserve le parallélisme et la violence de l’image tout en restant naturelle.
