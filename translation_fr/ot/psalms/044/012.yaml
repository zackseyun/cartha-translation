source:
  edition: WLC
  text: תִּמְכֹּֽר עַמְּ/ךָ֥ בְ/לֹא ה֑וֹן וְ/לֹ֥א רִ֝בִּ֗יתָ בִּ/מְחִירֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: fr
  text: Tu vends ton peuple sans rien en tirer[a] ; tu n’en exiges pas un prix élevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu as vendu ton peuple pour rien ; tu n’en as pas exigé un prix élevé. »'
    reason: L’imparfait hébreu peut être rendu au présent, pour la vivacité de la plainte, ou au passé selon le contexte. « Pour rien » est une autre manière concise de rendre l’absence de richesse ou de gain.
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: Tu vends
  rationale: L’imparfait qal à la deuxième personne du masculin singulier s’adresse directement à Dieu. Le présent français conserve la force immédiate de la plainte poétique, même si le passé reste possible selon le contexte.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: עַם désigne ici le peuple lié à Dieu; « ton peuple » garde cette portée relationnelle et collective.
- source_word: בְלֹא הוֹן
  choice: sans rien en tirer
  rationale: הוֹן évoque les biens, la richesse ou le profit. Cette formulation naturelle exprime l’absence de contrepartie substantielle sans réduire nécessairement l’expression au seul sens monétaire.
- source_word: רִבִּיתָ
  choice: tu ne t’enrichis pas
  rationale: Le piel de רבה peut exprimer l’idée d’accroître ou de rendre abondant. Dans le contexte d’une vente et de son prix, « s’enrichir » restitue clairement l’idée d’un accroissement de biens ou de profit.
- source_word: בִּמְחִירֵיהֶם
  choice: du prix reçu pour eux
  rationale: מְחִיר désigne le prix d’achat ou de vente, et la préposition ב peut marquer le moyen ou la source. La formulation précise en français que ce prix est celui du peuple vendu.
theological_decisions:
- issue: La plainte attribue directement à Dieu la vente de son peuple.
  choice: 'Maintenir l’adresse directe: « Tu vends ton peuple ».'
  alternative: Atténuer en parlant seulement de l’abandon ou de la permission divine.
  rationale: Le texte hébreu emploie explicitement le verbe « vendre » avec Dieu comme sujet; cette tension théologique fait partie de la lamentation et ne doit pas être adoucie.
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme économique de l’hébreu est conservé par « sans rien en tirer » et « ne t’enrichis pas », tandis que « du prix reçu pour eux » évite une tournure littérale obscure.
