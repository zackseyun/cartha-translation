  source_fidelity: La première proposition rend correctement l’imparfait adressé à Dieu et l’idée que la vente du peuple ne procure aucune richesse. Dans la seconde, רִבִּיתָ avec בִּמְחִירֵיהֶם évoque plus précisément l’absence d’un prix élevé ou majoré pour ce peuple; « tu ne t’enrichis pas du prix reçu » en déplace légèrement le sens vers l’enrichissement personnel de Dieu.
  naturalness: Le français est fluide, mais « du prix reçu pour eux » est explicatif et un peu lourd. « Tu n’en exiges pas un prix élevé » est naturel et maintient le parallélisme commercial.
  terminology: « Ton peuple » et l’adresse directe à Dieu sont appropriés. « Prix élevé » rend de manière idiomatique l’idée de ne pas accroître/majorer leur prix, sans imposer une interprétation théologique.
