id: PSA.44.6
reference: Psalms 44:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לֹ֣א בְ/קַשְׁתִּ֣/י אֶבְטָ֑ח וְ֝/חַרְבִּ֗/י לֹ֣א תוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/006.yaml
  text: For I do not trust in my bow[b][a], and my sword does not save me.
translation:
  language: fr
  text: Car ce n’est pas en mon arc que je mets ma confiance[a], et mon épée ne me sauve pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Car je ne mettrai pas ma confiance en mon arc, et mon épée ne me sauvera pas. » Les formes verbales hébraïques peuvent avoir ici une nuance de futur.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte militaire, « me sauve » peut aussi se traduire par « me délivre » ou « me donne la victoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’affirmation du contexte; « Car » conserve naturellement cette valeur explicative dans le registre poétique.
- source_word: בְקַשְׁתִּי
  choice: en mon arc
  rationale: קֶשֶׁת désigne l’arc comme arme; la préposition ב est liée au verbe בטח et indique ce en quoi la confiance est placée.
- source_word: אֶבְטָח
  choice: je mets ma confiance
  rationale: Le qal de בטח signifie « avoir confiance, se fier ». La tournure française rend clairement la relation avec « en mon arc » et l’imparfait hébreu est compris ici comme une attitude générale au présent.
- source_word: וְחַרְבִּי
  choice: et mon épée
  rationale: Traduction directe de חֶרֶב avec suffixe de première personne; la conjonction maintient le parallélisme entre l’arc et l’épée.
- source_word: תוֹשִׁיעֵנִי
  choice: ne me sauve pas
  rationale: Le hiphil de ישׁע peut signifier « sauver, délivrer, donner la victoire ». « Sauver » préserve l’étendue du terme sans le limiter à la victoire militaire.
theological_decisions:
- issue: Portée du langage du salut en contexte militaire
  choice: « ne me sauve pas »
  alternative: « ne me donne pas la victoire » ou « ne me délivre pas »
  rationale: Le contexte guerrier permet l’idée de victoire, mais « sauver » conserve la portée plus large du verbe hébreu et le thème de la dépendance envers Dieu sans ajouter de précision doctrinale.
- issue: Valeur temporelle des imparfaits hébreux
  choice: Présent exprimant une disposition générale
  alternative: 'Futur : « je ne mettrai pas ma confiance… ne me sauvera pas »'
  rationale: Dans ce parallélisme poétique, le présent français exprime naturellement une conviction habituelle; une nuance future demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation légèrement soutenue « en mon arc » convient à la poésie biblique, tandis que « je mets ma confiance » reste immédiatement compréhensible. Les marqueurs [a] et [b] figurent tous deux dans le texte.
