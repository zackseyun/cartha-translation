  text: כָּל הַ֭/יּוֹם כְּלִמָּתִ֣/י נֶגְדִּ֑/י וּ/בֹ֖שֶׁת פָּנַ֣/י כִּסָּֽתְ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/015.yaml
  text: All day long my disgrace is before me[a], and the shame of my face has covered me.
translation:
  language: fr
  text: Tout au long du jour, mon déshonneur est devant moi, et la honte de mon visage me couvre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la honte qui se lit sur mon visage me couvre ». L’hébreu dit plus littéralement : « la honte de mon visage me couvre ».'
    reason: La relation exprimée par « de mon visage » peut désigner la honte associée au visage ou celle qui y est visible; la formulation hébraïque demeure concise et ambiguë.
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Tout au long du jour
  rationale: 'Cette expression française naturelle conserve la valeur durative de la locution hébraïque : durant toute la journée, sans répit.'
- source_word: כְּלִמָּתִי
  choice: mon déshonneur
  rationale: Le nom désigne ici l’opprobre ou l’humiliation publique. « Déshonneur » en préserve la dimension sociale tout en évitant de répéter « honte » dans le second membre.
- source_word: נֶגְדִּי
  choice: est devant moi
  rationale: La formulation rend directement l’idée de quelque chose constamment placé sous les yeux ou présent devant la personne.
- source_word: וּבֹשֶׁת
  choice: et la honte
  rationale: « Honte » est l’équivalent direct du nom hébreu et forme un parallélisme avec « déshonneur » sans lui être strictement identique.
- source_word: פָּנַי
  choice: de mon visage
  rationale: Le groupe nominal conserve la construction littérale et l’image hébraïques, tout en laissant ouverte la relation précise entre la honte et le visage.
- source_word: כִּסָּתְנִי
  choice: me couvre
  rationale: Le verbe signifie « couvrir ». Le présent français exprime naturellement l’état actuel résultant évoqué par la forme hébraïque, sans imposer un genre au locuteur comme le ferait « m’a couvert/couverte ».
