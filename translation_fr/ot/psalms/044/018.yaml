source:
  edition: WLC
  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: fr
  text: Notre cœur n’a pas reculé[a], et nos pas ne se sont pas écartés de ton sentier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’est pas revenu en arrière ».'
    reason: Alternative lexicale reflétant plus explicitement les deux éléments נָסוֹג אָחוֹר.
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: n’a pas reculé
  rationale: L’expression évoque un mouvement de retrait ou de retour en arrière. « Reculer » est naturel en français et conserve l’image d’un abandon ou d’une défection sans l’expliciter.
- source_word: לִבֵּנוּ
  choice: Notre cœur
  rationale: Le « cœur » désigne ici l’être intérieur, notamment la volonté et la fidélité. Le maintien du singulier collectif préserve l’image et la portée du texte hébreu.
- source_word: וַתֵּט
  choice: ne se sont pas écartés
  rationale: Le verbe נטה peut exprimer l’inclinaison ou la déviation. Dans l’image d’un chemin, « s’écarter » rend clairement et naturellement le mouvement hors de la voie.
- source_word: אֲשֻׁרֵינוּ
  choice: nos pas
  rationale: Le nom désigne les pas ou la marche. « Nos pas » conserve la métaphore poétique du cheminement.
- source_word: מִנִּי אָרְחֶךָ
  choice: de ton sentier
  rationale: La préposition marque l’éloignement, tandis que אֹרַח désigne un chemin ou un sentier, souvent au sens figuré d’une conduite prescrite. « Ton sentier » garde l’image concrète et poétique.
theological_decisions:
- issue: Métaphore anthropologique du cœur
  choice: Conserver littéralement « Notre cœur »
  alternative: « Notre volonté » ou « notre fidélité »
  rationale: Le terme hébreu ne se limite ni aux émotions ni à l’intellect. Le traduire par « cœur » maintient l’ampleur de l’image biblique sans imposer une interprétation plus étroite.
translation_notes:
  register: Français moderne, sobre et poétique. Le tutoiement de Dieu convient au registre biblique français courant. Le parallélisme entre « cœur », « pas » et « sentier » est conservé.
