base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/000.yaml
  text: For the choirmaster[a]. Of the sons of Korah[b]. A Maskil[c].
translation:
  language: fr
  text: Au chef de chœur[a]. Des fils de Coré[b]. Maskil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour le chef de chœur ».
    reason: alternative_reading
  - marker: b
    text: Ou « Pour les fils de Coré » ou « Par les fils de Coré » ; dans les titres de psaumes, la préposition hébraïque peut signaler diverses formes d’association.
    reason: alternative_reading
  - marker: c
    text: Maskil est un terme hébreu employé dans plusieurs titres de psaumes ; il désigne peut-être une composition didactique ou méditative.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Au chef de chœur » est concis, naturel en français et conserve la valeur possible de destination portée par la préposition.
- source_word: לִבְנֵי
  choice: Des fils de
  rationale: Dans les titres de psaumes, la préposition ל peut exprimer l’attribution, la destination ou une autre forme d’association. « Des fils de » maintient cette indétermination mieux qu’une formulation explicitement auctoriale.
- source_word: קֹרַח
  choice: Coré
  rationale: Forme française traditionnelle et courante du nom biblique hébreu קֹרַח.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le sens précis de ce terme technique employé dans plusieurs titres de psaumes demeure incertain. Sa translittération évite de trancher indûment entre une indication littéraire, didactique ou musicale.
