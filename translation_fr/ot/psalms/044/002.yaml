revisions:
- from: C’est toi qui, de ta main, as chassé des nations et les as plantés ; tu as accablé des peuples et les as expulsés.[a]
  to: C’est toi qui, de ta main, as chassé des nations et planté nos ancêtres ; tu as accablé des peuples et tu les as renvoyés.[a]
  rationale: La correction explicite le référent implicite du premier suffixe afin d’éviter que le français fasse nécessairement de « nations » l’objet de « planté ». Elle conserve la lecture principale attestée dans le dossier, tout en maintenant en note l’analyse selon laquelle le suffixe final renvoie aux ancêtres d’Israël. Le remplacement de « expulsés » par « renvoyés » est une correction de précision lexicale qui ne modifie pas le sens général.
