source:
  edition: WLC
  text: אַתָּ֤ה יָדְ/ךָ֡ גּוֹיִ֣ם ה֭וֹרַשְׁתָּ וַ/תִּטָּעֵ֑/ם תָּרַ֥ע לְ֝אֻמִּ֗ים וַֽ/תְּשַׁלְּחֵֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/002.yaml
  text: You[a], by your hand, drove out nations and planted them; you afflicted peoples and sent them out.
translation:
  language: fr
  text: C’est toi qui, de ta main, as chassé des nations et planté nos ancêtres ; tu as accablé des peuples et tu les as renvoyés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre interprétation : « tu as accablé des peuples et tu as fait s’étendre nos ancêtres » ; le dernier suffixe peut renvoyer aux ancêtres d’Israël plutôt qu’aux peuples.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדְךָ
  choice: de ta main
  rationale: Cette formulation conserve l’image concrète de la main tout en exprimant naturellement en français le moyen et la puissance par lesquels Dieu agit.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans ce contexte historique, le terme désigne les groupes nationaux qui occupaient le pays ; « nations » est précis et naturel.
- source_word: הוֹרַשְׁתָּ
  choice: as chassé
  rationale: Le hifil de ירשׁ exprime ici l’éviction et la dépossession. « Chasser » rend clairement cette action sans alourdir le vers poétique.
- source_word: וַתִּטָּעֵם
  choice: et les as plantés
  rationale: Le choix conserve la métaphore agricole de l’établissement d’un peuple dans le pays. Le masculin pluriel indique naturellement en français que le pronom vise les ancêtres d’Israël, implicites dans le contexte, plutôt que les nations.
- source_word: תָּרַע
  choice: tu as accablé
  rationale: Le hifil de רעע peut signifier faire du mal, maltraiter ou affliger. « Accabler » exprime un tort grave ou un jugement sans en préciser indûment la forme.
- source_word: לְאֻמִּים
  choice: des peuples
  rationale: « Peuples » préserve la variation poétique avec גּוֹיִם, rendu par « nations ».
- source_word: וַתְּשַׁלְּחֵם
  choice: et les as expulsés
  rationale: Le verbe signifie fondamentalement « envoyer » ou « renvoyer ». Dans le contexte de la conquête, « expulser » exprime naturellement l’éloignement forcé tout en évitant l’expansion interprétative « disperser ».
theological_decisions:
- issue: Référents des suffixes dans « les as plantés » et « les as expulsés »
  choice: Le premier suffixe renvoie aux ancêtres d’Israël, et le dernier aux peuples chassés.
  alternative: 'Les deux suffixes peuvent être compris comme renvoyant aux ancêtres d’Israël : Dieu a accablé des peuples et a permis à Israël de s’étendre.'
  rationale: La structure poétique oppose vraisemblablement l’expulsion des nations à l’établissement d’Israël, puis l’accablement des peuples à leur expulsion. Toutefois, l’hébreu n’explicite pas les référents et permet de rattacher le dernier suffixe à Israël ; cette ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La dislocation « C’est toi qui » rend l’emphase du pronom אַתָּה. Le genre grammatical distingue utilement, sans ajout nominal, les ancêtres d’Israël (« plantés ») des nations (« chassé des nations »).
