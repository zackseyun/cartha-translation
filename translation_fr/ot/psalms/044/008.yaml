  yaml_path: translation/ot/psalms/044/008.yaml
  text: In God we boast all day long[a], and we will give thanks to your name forever[b]. Selah
translation:
  language: fr
  text: En Dieu, nous nous glorifions tout le jour[a], et nous rendrons grâce à ton nom pour toujours[b]. Sélah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous louons Dieu tout le jour » ou « nous tirons gloire de Dieu tout le jour ». Le verbe hébreu peut exprimer la louange ou une glorification exultante selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Le « nom » de Dieu renvoie, dans la Bible, à ce qu’il révèle de lui-même et à sa réputation.
    reason: cultural_note
  - marker: c
    text: Hébreu « Sélah ». Terme liturgique dont le sens précis est incertain.
    reason: textual_or_liturgical_note
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: En Dieu
  rationale: 'La préposition ב marque ici naturellement la sphère ou le fondement de la fierté : c’est en Dieu que le peuple trouve son sujet de gloire.'
- source_word: הִלַּלְנוּ
  choice: nous mettons… notre fierté
  rationale: Au piel, הלל peut exprimer la louange ou le fait de se glorifier. Avec בֵּאלֹהִים, la tournure française « mettre sa fierté en Dieu » restitue naturellement cette nuance sans suggérer une vantardise déplacée.
- source_word: כָל הַיּוֹם
  choice: toute la journée
  rationale: Rend concrètement la durée exprimée par l’hébreu, sans l’élargir interprétativement à « continuellement ».
- source_word: וְשִׁמְךָ
  choice: ton nom
  rationale: Conserve l’objet explicite de l’action et la manière biblique de désigner le caractère révélé et la réputation de Dieu.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française courante et digne de la durée indéfinie ou perpétuelle indiquée ici.
- source_word: נוֹדֶה
  choice: nous célébrerons
  rationale: Le hiphil de ידה exprime la reconnaissance, l’action de grâce ou la louange. « Célébrer » convient à « ton nom », maintient le parallélisme poétique et distingue ce verbe de הלל.
- source_word: סֶלָה
  choice: Pause
  rationale: Le sens précis du terme liturgique est incertain. « Pause » en propose prudemment la fonction probable, tandis qu’une note conserve le terme hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et accessible. « Mettre sa fierté en Dieu » préserve la tension entre louange et glorification présente dans הלל. Le futur de נוֹדֶה est conservé comme déclaration résolue. « Pause » rend le marqueur liturgique de façon intelligible, avec transparence en note sur l’incertitude.
