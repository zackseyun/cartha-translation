  source_fidelity: 'La première proposition doit rendre l’idiome בֵּאלֹהִים הִלַּלְנוּ comme une glorification/exultation « en Dieu »; « mettre notre fierté » est moins direct et sa syntaxe est maladroite. Pour נוֹדֶה, « rendre grâce » préserve mieux la nuance de reconnaissance que « célébrer ». Le sens de סֶלָה demeure incertain : il faut le translittérer plutôt que le traduire par « Pause ».'
  naturalness: « En Dieu, nous nous glorifions tout le jour » est une formulation poétique, claire et naturelle dans un registre biblique moderne. « Nous rendrons grâce à ton nom pour toujours » est idiomatique dans ce même registre et conserve l’objet exprimé par l’hébreu.
  terminology: « Nous nous glorifions » rend sans imposer une interprétation confessionnelle le verbe הלל dans cette construction. « Rendre grâce » rend ידה. « Sélah » est la translittération française usuelle du marqueur liturgique incertain.
