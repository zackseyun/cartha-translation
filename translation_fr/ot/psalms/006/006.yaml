  text: יָגַ֤עְתִּי בְּֽ/אַנְחָתִ֗/י אַשְׂחֶ֣ה בְ/כָל לַ֭יְלָה מִטָּתִ֑/י בְּ֝/דִמְעָתִ֗/י עַרְשִׂ֥/י אַמְסֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/006.yaml
  text: I am weary with my groaning[a]; every night I drench my bed[b]; with my tears I soak my couch.
translation:
  language: fr
  text: Je suis épuisé à force de gémir ; chaque nuit[b], j’inonde mon lit[a] ; de mes larmes, je détrempe ma couche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je fais nager mon lit » ; c’est une hyperbole poétique évoquant un lit inondé de larmes.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toute la nuit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Je suis épuisé
  rationale: Le parfait exprime ici l’état présent résultant d’une souffrance prolongée. « Épuisé » rend avec force la lassitude profonde indiquée par יגע.
- source_word: בְּאַנְחָתִי
  choice: à force de gémir
  rationale: אַנְחָה peut désigner le gémissement ou le soupir. Dans ce contexte, la préposition בְּ se comprend naturellement comme la cause ou l’accompagnement de l’épuisement ; cette tournure française exprime les deux sans alourdir le vers.
- source_word: אַשְׂחֶה
  choice: j’inonde
  rationale: La forme causative signifie littéralement faire « nager » le lit. « J’inonde » transmet en français actuel cette hyperbole poétique, tandis qu’une note conserve l’image hébraïque.
- source_word: בְכָל לַיְלָה
  choice: chaque nuit
  rationale: La formulation peut évoquer une action répétée nuit après nuit. « Chaque nuit » convient bien au contexte, sans masquer l’autre compréhension possible, « toute la nuit », signalée en note.
- source_word: מִטָּתִי
  choice: mon lit
  rationale: מִטָּה est le terme courant pour le lit ou le lieu où l’on se couche.
- source_word: בְּדִמְעָתִי
  choice: de mes larmes
  rationale: 'La préposition indique ici le moyen : les larmes sont ce qui détrempe la couche. « De mes larmes » est idiomatique en français et maintient la mise en relief poétique.'
- source_word: עַרְשִׂי
  choice: ma couche
  rationale: « Couche » préserve la variation lexicale du parallélisme hébreu par rapport à מִטָּה, rendu par « lit », tout en restant digne et compréhensible.
- source_word: אַמְסֶה
  choice: je détrempe
  rationale: Le verbe causatif évoque littéralement le fait de faire fondre ou dissoudre. Dans l’image des larmes, « détremper » exprime clairement l’imprégnation complète et conserve la force hyperbolique.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme ternaire et la variation « lit / couche » reproduisent le parallélisme hébreu. Les images fortes sont conservées dans une formulation naturelle, avec leur sens littéral ou leur ambiguïté signalés en notes.
