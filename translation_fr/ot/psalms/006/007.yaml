  yaml_path: translation/ot/psalms/006/007.yaml
  text: My eye has wasted away from grief[a]; it has grown old because of all my enemies.
translation:
  language: fr
  text: Mon œil s’est affaibli de chagrin[a] ; il a vieilli à cause de tous mes adversaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon œil s’est obscurci de dépit ; il a vieilli à cause de tous mes ennemis. »'
    reason: 'Alternative lexicale : עָשְׁשָׁה peut évoquer l’affaiblissement ou l’obscurcissement, כַּעַס le dépit ou l’irritation, et עָתְקָה le vieillissement.'
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: dépérit
  rationale: Le verbe exprime le dépérissement ou l’affaiblissement. « Dépérit » conserve l’image corporelle sans la limiter à une baisse de la vue.
- source_word: מִכַּעַס
  choice: de chagrin
  rationale: כַּעַס peut désigner le dépit, l’irritation ou le chagrin. Dans cette lamentation, « chagrin » rend naturellement la souffrance qui cause le dépérissement, tout en signalant en note l’autre nuance possible.
- source_word: עֵינִי
  choice: Mon œil
  rationale: Le texte hébreu emploie le singulier avec un suffixe de première personne ; le français peut conserver cette image poétique au singulier.
- source_word: עָתְקָה
  choice: il s’est usé
  rationale: Le verbe évoque le fait de vieillir ou de devenir usé. Avec « œil » pour sujet, « s’est usé » est naturel et maintient l’idée d’une détérioration progressive.
- source_word: בְּכָל
  choice: à cause de tous
  rationale: Dans ce contexte, la préposition présente l’ensemble des adversaires comme la cause ou l’occasion de cet épuisement.
- source_word: צוֹרְרָי
  choice: mes adversaires
  rationale: Le participe désigne ceux qui manifestent une hostilité oppressante. « Adversaires » restitue cette opposition et convient au registre poétique de la lamentation.
