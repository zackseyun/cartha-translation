source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: fr
  text: Car dans la mort, personne ne se souvient de toi ; dans le Shéol[a], qui te rendra grâce ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe » ou « dans le séjour des morts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient la supplication précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: אֵין
  choice: on ne… plus
  rationale: Dans ce contexte de mort, cette tournure française exprime idiomatiquement l’absence de souvenir ou de mention, sans prétendre que Dieu cesse objectivement d’être connu.
- source_word: בַּמָּוֶת
  choice: dans la mort
  rationale: Rend la construction prépositionnelle de manière locative et maintient le parallélisme poétique avec « dans le shéol ».
- source_word: זִכְרֶךָ
  choice: on ne se souvient plus de toi
  rationale: Le nom dérivé de זכר peut évoquer le souvenir ou la mention commémorative. La formulation retenue est naturelle en français et laisse au second membre le soin de préciser la dimension de louange publique.
- source_word: בִּשְׁאוֹל
  choice: dans le shéol
  rationale: La translittération préserve la notion hébraïque du séjour des morts sans la réduire à la seule tombe ni lui imposer une conception ultérieure plus précise.
- source_word: מִי
  choice: qui
  rationale: Rend directement le pronom interrogatif qui introduit la question rhétorique.
- source_word: יוֹדֶה לָּךְ
  choice: te rendra grâce
  rationale: Le hiphil de ידה signifie couramment remercier, célébrer ou louer. « Rendre grâce » exprime ici avec dignité l’action de grâce adressée à Dieu.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: shéol
  alternative: la tombe ; le séjour des morts
  rationale: La translittération conserve la spécificité historique et théologique du terme hébreu et évite de trancher entre la tombe et le domaine des morts. Les équivalents possibles sont signalés en note.
- issue: Portée de l’absence de souvenir dans la mort
  choice: formulation poétique laissée dans sa tension propre
  alternative: expliciter qu’il s’agit seulement de la louange publique parmi les vivants
  rationale: Le verset affirme poétiquement qu’il n’y a ni souvenir ni action de grâce dans la mort et le shéol. La traduction ne transforme pas cette affirmation en exposé systématique sur l’état des morts.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure proche du parallélisme hébreu, tandis que « on ne se souvient plus de toi » privilégie une expression française courante. Le terme « shéol » est conservé et brièvement éclairé en note.
