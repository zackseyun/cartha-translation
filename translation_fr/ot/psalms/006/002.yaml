source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: fr
  text: Accorde-moi ta grâce, Yahweh, car je dépéris[a] ; guéris-moi, Yahweh, car mes os tremblent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis faible » ou « je languis » ; l’hébreu évoque un état de faiblesse, d’épuisement ou de dépérissement.
    reason: lexical_alternative
  - marker: b
    text: Ou « mes os sont troublés » ou « mes os sont consternés » ; « mes os » peut exprimer une profonde détresse physique ou intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: L’impératif de חנן demande faveur et grâce. Cette formulation reste proche de l’hébreu, naturelle dans une supplication et n’impose pas comme seul sens la nuance affective de « aie pitié de moi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de chacune des deux demandes.
- source_word: אֻמְלַל
  choice: je dépéris
  rationale: Le terme décrit l’affaiblissement, l’épuisement ou le dépérissement. « Je dépéris » conserve cette image dynamique mieux que le simple adjectif « faible ».
- source_word: רְפָאֵנִי
  choice: guéris-moi
  rationale: Le verbe רפא signifie directement « guérir » et peut ici concerner la détresse de la personne entière.
- source_word: נִבְהֲלוּ
  choice: sont bouleversés
  rationale: Le verbe בהל exprime un état de trouble intense, d’effroi ou de désarroi. Avec « mes os », « bouleversés » préserve une ambiguïté entre atteinte physique et détresse intérieure, sans transformer explicitement le trouble en tremblement.
- source_word: עֲצָמָי
  choice: mes os
  rationale: La formulation concrète de l’hébreu est conservée ; elle peut désigner la structure corporelle et, par extension, une détresse profonde.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte emploie le nom divin. « Yahweh » en préserve la valeur de nom propre sans lui substituer un titre.
- issue: Nature du bouleversement des « os »
  choice: Ne pas préciser s’il est exclusivement physique ou intérieur
  alternative: « mes os tremblent », qui privilégie une manifestation physique
  rationale: L’hébreu associe les os au verbe בהל, lequel peut exprimer trouble, effroi ou consternation. Le contexte de guérison suggère une dimension corporelle, mais ne ferme pas la portée intérieure de l’image.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le parallélisme des deux impératifs et des deux propositions causales est conservé. « Fais-moi grâce » maintient la teneur de la supplication, tandis que « je dépéris » restitue la force de l’état décrit. Les deux occurrences du nom Yahweh sont gardées.
