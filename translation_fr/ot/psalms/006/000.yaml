  text: לַ/מְנַצֵּ֣חַ בִּ֭/נְגִינוֹת עַֽל הַ/שְּׁמִינִ֗ית מִזְמ֥וֹר לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/000.yaml
  text: 'For the choirmaster: with stringed instruments, according to the Sheminith[a]. A psalm of David[b].'
translation:
  language: fr
  text: Pour le chef de chœur, avec des instruments à cordes, selon la Sheminith[a]. Psaume de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : Sheminith ; peut-être « la huitième », un registre à l’octave ou un instrument à huit cordes.'
    reason: lexical_alternative
  - marker: b
    text: Ou « par David » ou « pour David » ; l’hébreu peut indiquer l’auteur ou une association.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Pour le chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne conventionnellement la personne chargée de diriger l’exécution musicale. « Chef de chœur » est clair et actuel, tout en conservant le cadre liturgique et musical.
- source_word: בִּנְגִינוֹת
  choice: avec des instruments à cordes
  rationale: Le terme renvoie ici à la musique produite par des instruments à cordes. Cette formulation naturelle n’ajoute aucune précision indue sur la manière d’en jouer.
- source_word: עַל
  choice: selon
  rationale: Dans un titre musical, la préposition peut introduire un air, un mode ou une indication d’exécution. « Selon » préserve cette ouverture sans imposer l’idée d’un instrument déterminé.
- source_word: הַשְּׁמִינִית
  choice: la Sheminith
  rationale: Le référent exact de ce terme technique est incertain. La translittération évite de trancher artificiellement entre un registre à l’octave, un mode appelé « la huitième » et un instrument à huit cordes.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est l’équivalent français établi de ce terme désignant un chant destiné à une exécution musicale.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette souplesse que la formulation plus catégorique « par David ».
theological_decisions:
- issue: Auteur ou association indiqués par לְדָוִד
  choice: de David
  alternative: par David ; pour David
  rationale: Le titre hébreu ne contraint pas à affirmer plus précisément une attribution directe à David. La traduction maintient donc l’ambiguïté historique et théologique du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe concise conserve la forme d’un titre liturgique et musical. Les termes techniques ou ambigus sont maintenus dans le texte et explicités en note.
