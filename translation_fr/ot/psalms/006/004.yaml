  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: fr
  text: Reviens, SEIGNEUR ; délivre ma vie ; sauve-moi à cause de ton amour fidèle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: Reviens
  rationale: L’impératif de שׁוב appelle le retour de YHWH auprès du psalmiste ; « Reviens » en conserve la force directe.
- source_word: יְהוָה
  choice: SEIGNEUR
  rationale: La forme en petites capitales représente conventionnellement le nom divin YHWH en français, sans lui substituer une prononciation reconstruite.
- source_word: חַלְּצָה נַפְשִׁי
  choice: délivre ma vie
  rationale: נֶפֶשׁ désigne ici la vie ou la personne menacée plutôt qu’une « âme » séparée du corps. La formulation conserve l’objet explicite et le parallélisme avec « sauve-moi ».
- source_word: הוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: Rend directement l’impératif hiphil de ישׁע et maintient l’insistance de la seconde supplication.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: à cause de ton amour fidèle
  rationale: לְמַעַן exprime le motif invoqué, tandis que חֶסֶד associe amour, loyauté et fidélité relationnelle ; « amour fidèle » rend cette densité sans imposer un terme confessionnel.
theological_decisions:
- issue: Fondement demandé pour le salut
  choice: à cause de ton amour fidèle
  alternative: selon ton amour fidèle
  rationale: Le texte présente le חֶסֶד de Dieu comme le motif de l’appel. La traduction conserve cette logique sans préciser davantage comment cet amour agit.
- issue: Sens de נֶפֶשׁ
  choice: ma vie
  alternative: mon âme
  rationale: Dans ce contexte de détresse et de délivrance, le terme vise l’existence vivante du psalmiste. « Ma vie » évite une lecture dualiste que l’hébreu n’exige pas.
translation_notes:
  register: Supplication brève, solennelle et directe. La ponctuation garde les trois impératifs successifs et le parallélisme poétique de l’hébreu.
