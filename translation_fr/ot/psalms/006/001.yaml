source:
  edition: WLC
  text: יְֽהוָ֗ה אַל בְּ/אַפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וְֽ/אַל בַּ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: fr
  text: 'Yahweh, ne me reprends pas dans ta colère,

    ne me corrige pas dans ta fureur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », transcription courante du nom divin; l’adresse directe ne nécessite pas d’ajouter une interjection en français.
- source_word: אַל ... תוֹכִיחֵנִי
  choice: ne me reprends pas
  rationale: La particule négative אַל avec la forme verbale exprime ici une supplication prohibitive. Le hifil de יכח signifie réprimander ou reprendre; « reprends » convient au registre de la prière et reste naturel.
- source_word: בְּאַפְּךָ
  choice: dans ta colère
  rationale: אַף, littéralement associé au nez, désigne idiomatiquement la colère. « Dans ta colère » conserve la construction hébraïque de manière naturelle.
- source_word: וְאַל ... תְיַסְּרֵנִי
  choice: ne me corrige pas
  rationale: Le second אַל poursuit la supplication parallèle. Le piel de יסר désigne une correction disciplinaire; « corrige » en conserve la portée sans la réduire à une punition.
- source_word: בַּחֲמָתְךָ
  choice: dans ta fureur
  rationale: חֵמָה évoque une colère ardente. « Fureur » la distingue de אַף et préserve l’intensification poétique du parallélisme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Nature de la demande du psalmiste
  choice: La demande porte sur une réprimande et une correction exercées dans la colère et la fureur.
  alternative: Comprendre que le psalmiste refuse toute réprimande ou toute correction.
  rationale: 'La place des groupes « dans ta colère » et « dans ta fureur » permet de conserver la tension du texte: la requête vise explicitement la manière ou le contexte de la correction, sans affirmer que toute correction est refusée.'
- issue: Distinction entre אַף et חֵמָה
  choice: colère / fureur
  alternative: colère / colère; courroux / fureur
  rationale: Deux termes français distincts rendent les deux noms hébreux apparentés et l’intensité du second, sans surinterpréter leur différence.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé sur deux lignes. Le tutoiement correspond à l’adresse priante directe et à l’usage biblique français courant.
