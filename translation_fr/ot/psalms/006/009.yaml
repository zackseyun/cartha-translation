source:
  edition: WLC
  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: fr
  text: Yahweh a entendu ma supplication ; Yahweh recevra[a] ma prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « prendra » ; on peut aussi comprendre « acceptera ma prière ».
    reason: Alternative lexicale reflétant le sens concret du verbe hébreu et sa portée idiomatique dans ce contexte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu, conformément à l’usage du projet, plutôt que de le remplacer par un titre.
- source_word: שָׁמַע
  choice: a entendu
  rationale: L’accompli hébreu présente ici l’écoute comme un fait établi dont le psalmiste affirme avec confiance la réalité.
- source_word: תְּחִנָּה
  choice: supplication
  rationale: Désigne une demande pressante de faveur ou de grâce ; « supplication » en conserve l’intensité et se distingue de « prière » dans le membre parallèle.
- source_word: תְּפִלָּה
  choice: prière
  rationale: Terme courant pour la prière, qui préserve le parallélisme lexical sans le confondre avec תְּחִנָּה.
- source_word: לָקַח
  choice: recevra
  rationale: Le verbe signifie littéralement « prendre », mais, avec « ma prière » comme complément, « recevra » exprime naturellement l’accueil de cette prière tout en conservant la confiance tournée vers l’avenir.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: Le texte emploie directement le Tétragramme ; « Yahweh » maintient le nom propre sans lui substituer un titre.
- issue: Portée de לָקַח appliqué à la prière
  choice: recevra
  alternative: acceptera
  rationale: « Recevra » garde ouverte la nuance entre le fait de prendre en compte la prière et celui de l’agréer, sans transformer implicitement le verbe en déclaration technique d’acceptation cultuelle.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule met en valeur le parallélisme hébreu ; la répétition de « Yahweh » est conservée.
