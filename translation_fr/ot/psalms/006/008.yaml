  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: fr
  text: Éloignez-vous de moi, vous tous qui faites le mal[a], car Yahweh a entendu le son de mes pleurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous tous qui commettez le mal ». Littéralement : « tous les faiseurs de mal ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la voix de mes pleurs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Éloignez-vous de moi
  rationale: L’impératif pluriel de סור appelle les personnes visées à partir ou à se tenir à l’écart. « Éloignez-vous de moi » est direct, énergique et naturel en français.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: vous tous qui faites le mal
  rationale: Cette formulation rend l’ensemble des personnes interpellées et conserve l’idée active de « faire/commettre » exprimée par פֹּעֲלֵי, dans une langue immédiatement compréhensible.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison qui fonde l’ordre précédent. « Car » convient au registre poétique et reste courant.
- source_word: שָׁמַע
  choice: a entendu
  rationale: Le parfait présente l’écoute comme un fait accompli sur lequel le psalmiste fonde maintenant son assurance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de représenter directement le tétragramme du texte hébreu.
- source_word: קוֹל בִּכְיִי
  choice: le bruit de mes sanglots
  rationale: קוֹל désigne ici le son audible, tandis que בִּכְיִי désigne les pleurs du psalmiste. « Le bruit de mes sanglots » exprime naturellement en français cette lamentation entendue.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme nom au lieu de lui substituer un titre.
- issue: Portée de l’assurance du psalmiste
  choice: « a entendu », comme fait accompli fondant l’ordre donné
  alternative: « entend », comme action présente ou habituelle
  rationale: Le parfait שָׁמַע marque ici l’écoute comme accomplie, tout en laissant au contexte poétique sa portée présente sans développer davantage ses implications théologiques.
translation_notes:
  register: Français international moderne, direct et digne. La tournure garde la force de l’impératif et l’image sonore des pleurs sans recourir à un vocabulaire religieux archaïque.
