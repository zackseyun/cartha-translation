  yaml_path: translation/ot/psalms/006/010.yaml
  text: Let all my enemies be ashamed and greatly terrified[a]; let them turn back and be ashamed in an instant.
translation:
  language: fr
  text: Que tous mes ennemis soient couverts de honte et saisis d’une grande épouvante[a] ! Qu’ils fassent demi-tour, soudain couverts de honte !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que tous mes ennemis soient honteux et très troublés ! Qu’ils fassent demi-tour et soient soudain honteux ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: soient couverts de honte
  rationale: Dans ce contexte poétique à valeur de souhait, le qal imparfait exprime une demande. « Être couverts de honte » rend la honte et la disgrâce, tout en laissant possible l’idée d’être publiquement confondus.
- source_word: וְיִבָּהֲלוּ מְאֹד
  choice: et saisis d’une grande épouvante
  rationale: בהל évoque un effroi ou un désarroi soudain, et מְאֹד en renforce fortement l’intensité. Cette formulation restitue ensemble la soudaineté émotionnelle et l’intensification.
- source_word: כָּל אֹיְבָי
  choice: tous mes ennemis
  rationale: Rendu direct et naturel du groupe nominal avec suffixe possessif.
- source_word: יָשֻׁבוּ
  choice: qu’ils reculent
  rationale: שׁוב signifie revenir ou faire demi-tour. Face à des ennemis, « reculer » exprime naturellement leur mouvement en arrière sans développer une scène militaire absente du texte.
- source_word: יֵבֹשׁוּ
  choice: couverts de honte
  rationale: La reprise de la même expression conserve la répétition emphatique du verbe בוש dans l’hébreu.
- source_word: רָגַע
  choice: soudain
  rationale: Employé adverbialement, le terme marque ici la brusquerie ou l’immédiateté de ce retournement.
