id: PSA.6.3
reference: Psalms 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: fr
  text: Et mon âme[a] est profondément bouleversée[b]. Mais toi[c], Yahvé[d], jusqu’à quand ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi signifier « ma vie » ou « moi-même ».
    reason: lexical_alternative
  - marker: b
    text: Ou « est saisie d’effroi » ou « est consternée ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « et toi »; « mais toi » marque ici le brusque retournement de la plainte vers Dieu.
    reason: lexical_alternative
  - marker: d
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR »; autre transcription possible : « Yahweh ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: Et mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » conserve ici l’expression poétique hébraïque et la dimension intérieure de la détresse; la conjonction initiale est rendue par « Et ».
- source_word: נִבְהֲלָה מְאֹד
  choice: est profondément bouleversée
  rationale: Le verbe בהל exprime un trouble intense pouvant aller jusqu’à l’effroi, et מְאֹד en renforce le degré. « Profondément bouleversée » est naturel en français et garde l’intensité sans réduire le sens à la seule peur.
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction וְ signifie formellement « et », mais elle introduit ici un brusque retournement de la plainte vers Dieu. « Mais toi » rend cette force adversative tout en laissant la phrase suspendue.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte porte le nom divin YHWH. « Yahvé » est sa transcription française courante et permet de le distinguer du titre « Seigneur ».
- source_word: עַד מָתָי
  choice: jusqu’à quand ?
  rationale: Cette formule habituelle de lamentation rend directement l’attente douloureuse et l’urgence de la question.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin YHWH. La transcription « Yahvé » le rend explicitement, tandis que « le SEIGNEUR » reflète la substitution traditionnelle à la lecture.
- issue: Phrase suspendue après « Mais toi, Yahvé »
  choice: 'Conserver l’ellipse : « Mais toi, Yahvé, jusqu’à quand ? »'
  alternative: Expliciter un verbe tel que « tarderas-tu à intervenir ? »
  rationale: L’hébreu ne précise pas ce que Dieu tarde à faire. Garder l’ellipse préserve l’intensité de la plainte ainsi que son ambiguïté authentique.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La formulation conserve le parallélisme de la plainte, l’intensité affective et surtout l’ellipse finale de l’hébreu, sans ajouter l’action attendue de Dieu.
