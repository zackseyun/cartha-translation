  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: fr
  text: Que l’assemblée des peuples t’entoure[a], et, au-dessus d’elle[b], reviens en haut !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des nations ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte un singulier féminin, renvoyant à l’assemblée comme collectif. On peut aussi traduire, selon le sens : « au-dessus d’eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: assemblée
  rationale: Le nom désigne un groupe réuni. « Assemblée » est naturel, digne et n’introduit pas la coloration ecclésiale possible de « congrégation ».
- source_word: לְאֻמִּים
  choice: peuples
  rationale: Le pluriel désigne plusieurs groupes humains ou ethniques. « Peuples » rend directement cette pluralité; « nations » demeure possible.
- source_word: תְּסוֹבְבֶךָּ
  choice: Que … t’entoure
  rationale: La forme verbale est comprise ici comme un souhait ou une demande de valeur jussive, plutôt que comme un simple futur. « Entourer » restitue sobrement l’image de סבב.
- source_word: וְעָלֶיהָ
  choice: Au-dessus d’elle
  rationale: Le suffixe hébreu est féminin singulier et renvoie naturellement à « l’assemblée », collectif lui aussi féminin singulier en français. Cette formulation préserve la référence grammaticale sans la redistribuer explicitement aux peuples.
- source_word: לַמָּרוֹם
  choice: dans les hauteurs
  rationale: מָרוֹם désigne la hauteur ou un lieu élevé. « Dans les hauteurs » conserve l’image spatiale et la portée d’exaltation sans ajouter explicitement « ciel » ou « trône ».
- source_word: שׁוּבָה
  choice: retourne
  rationale: L’impératif de שוב signifie « revenir, retourner ». La traduction conserve cet impératif sans expliciter une intronisation qui n’est pas énoncée lexicalement.
theological_decisions:
- issue: Le verset décrit-il le jugement divin depuis une position élevée ou un déplacement spatial vers le haut ?
  choice: Conserver l’appel poétique à Dieu pour qu’il retourne dans les hauteurs, au-dessus de l’assemblée.
  alternative: Expliciter que Dieu reprend sa place souveraine de juge sur un trône, ou comprendre une ascension physique vers le ciel.
  rationale: L’impératif שׁוּבָה favorise une demande, tandis que לַמָּרוֹם porte à la fois une image spatiale et une possible connotation d’exaltation. La traduction maintient cette tension sans préciser un trône, le ciel ou un mouvement purement physique.
- issue: Le référent du suffixe féminin singulier dans וְעָלֶיהָ
  choice: Le rendre au singulier par « elle », en référence à « l’assemblée ».
  alternative: Employer « eux », en référence collective aux peuples assemblés.
  rationale: L’hébreu présente formellement un suffixe féminin singulier qui s’accorde avec l’antécédent collectif עֲדָה. Le français permet de préserver naturellement ce nombre et ce genre.
translation_notes:
  register: Français moderne, poétique et accessible. Les deux impératifs sont conservés, avec une ponctuation qui fait entendre la supplication. « Dans les hauteurs » garde la métaphore d’élévation sans imposer une interprétation cosmologique ou royale précise.
