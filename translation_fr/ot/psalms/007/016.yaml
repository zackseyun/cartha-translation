    rationale: Le suffixe de עֲמָלוֹ signifie « son mal / son tort / sa peine »; le contexte peut suggérer un mal commis, mais le verbe « cause » n’est pas exprimé et réduit l’ambiguïté du substantif.
  - severity: low
    issue: « Retombe » remplace l’image verbale de descente.
    rationale: ירד signifie « descendre ». La conséquence qui revient sur l’auteur est déjà exprimée par le premier membre; « descend » conserve plus exactement l’image du second.
  - severity: low
    issue: « Crâne » est plus anatomique et moins précis que l’image du sommet de la tête.
    rationale: קָדְקֹד désigne normalement le sommet ou la couronne de la tête. « Le sommet de sa tête » est la correspondance la plus directe.
