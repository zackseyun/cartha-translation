  text: His trouble returns on his own head[b][a], and his violence descends on his own skull.
translation:
  language: fr
  text: 'Son mal lui revient sur la tête[a],

    et sa violence descend sur le sommet de sa tête[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Son méfait lui revient sur la tête ». Le mot hébreu עָמָל peut désigner la peine, le mal, le tort ou une action nuisible selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur son crâne ». Le mot hébreu קָדְקֹד désigne le sommet ou la couronne de la tête.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: lui revient
  rationale: Le qal inaccompli de שׁוב exprime ici le retour contre le méchant des conséquences de ses propres actes. « Lui revient » rend naturellement ce mouvement de retour.
- source_word: עֲמָלוֹ
  choice: le mal qu’il cause
  rationale: עָמָל peut désigner la peine, le mal ou une action nuisible. Dans ce contexte de rétribution, l’expression vise le mal produit par l’auteur plutôt qu’un simple effort ou une souffrance neutre.
- source_word: בְרֹאשׁוֹ
  choice: sur la tête
  rationale: Cette formulation conserve l’image hébraïque et exprime idiomatiquement en français les conséquences qui reviennent sur leur auteur.
- source_word: קָדְקֳדוֹ
  choice: son crâne
  rationale: קָדְקֹד désigne le sommet ou la partie supérieure de la tête. « Crâne » donne une image concrète tout en maintenant le parallélisme avec « tête ».
- source_word: חֲמָסוֹ
  choice: sa violence
  rationale: חָמָס désigne couramment la violence, la brutalité ou le tort violent. « Sa violence » est direct et préserve la responsabilité personnelle exprimée par le suffixe.
- source_word: יֵרֵד
  choice: retombe
  rationale: Le verbe ירד signifie descendre. Dans cette image de rétribution, « retombe » garde le mouvement dirigé vers la tête et produit un français poétique naturel.
theological_decisions:
- issue: L’image de la rétribution poétique
  choice: Le mal et la violence du méchant reviennent sur leur propre auteur.
  alternative: Le verset pourrait être compris plus généralement comme la souffrance qui revient sur quelqu’un, sans accent moral marqué.
  rationale: Le parallélisme entre le mal qui revient sur la tête et la violence qui retombe sur le crâne présente clairement les actes nuisibles comme se retournant contre leur auteur, sans ajouter d’affirmation doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébraïque entre « tête » et « crâne » est conservé, tandis que « revient » et « retombe » rendent naturellement le mouvement de rétribution.
