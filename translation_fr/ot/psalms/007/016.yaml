  source_fidelity: La formulation « le mal qu’il cause » explicite de manière interprétative l’idée que עֲמָלוֹ est un mal produit par le sujet. Dans ce contexte, cette compréhension est plausible, mais le substantif peut aussi désigner le malheur, le tort ou la peine, et la formulation directe « son mal » préserve mieux sa portée. יֵרֵד signifie proprement « descend »; « retombe » est interprétatif quoique contextuellement acceptable. קָדְקֳדוֹ vise le sommet/couronne de la tête plutôt que spécifiquement le crâne.
  naturalness: Le texte révisé reste idiomatique, poétique et clair en français international moderne. La répétition de « tête » dans « le sommet de sa tête » reflète le parallélisme concret de l’hébreu sans lourdeur excessive.
  terminology: « Son mal » conserve l’ambiguïté lexicale de עֲמָל dans un cadre de rétribution. « Sa violence » rend directement חֲמָסוֹ. « Le sommet de sa tête » rend avec précision קָדְקֳדוֹ et maintient la distinction poétique avec « tête » au premier membre.
  issues:
