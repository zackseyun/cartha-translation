source:
  edition: WLC
  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: fr
  text: Yahvé juge les peuples[a]. Juge-moi[b], Yahvé, selon ma justice et selon l’intégrité qui est en moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahvé jugera les peuples ».
    reason: ambiguïté de l’aspect verbal
  - marker: b
    text: Ou « Rends-moi justice ». Dans ce contexte, « juger » peut signifier prononcer un verdict favorable.
    reason: alternative lexicale et contextuelle
  - marker: c
    text: Littéralement « et selon mon intégrité qui est sur moi » ; la tournure peut désigner l’intégrité qui appartient au psalmiste ou qui se trouve en lui.
    reason: idiome hébreu et traduction littérale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est transcrit sous sa forme française courante « Yahvé », plutôt que remplacé par un titre.
- source_word: יָדִין
  choice: juge
  rationale: L’imparfait de דין peut exprimer ici une action générale ou caractéristique. Le présent français convient à cet emploi, tout en laissant en note la possibilité du futur.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne largement des groupes humains. « Les peuples » préserve mieux cette portée collective que « les nations », qui peut évoquer des États modernes.
- source_word: שָׁפְטֵנִי
  choice: Juge-moi
  rationale: L’impératif de שׁפט signifie directement « juger ». Dans ce contexte, il implique probablement une décision favorable, mais la traduction principale conserve la formulation judiciaire et son lien avec le verbe précédent.
- source_word: כְּצִדְקִי
  choice: selon ma justice
  rationale: צדק désigne ici la droiture ou le bon droit du psalmiste dans l’affaire en cause. « Ma justice » conserve la formulation explicite et la tension du texte sans la réduire à une simple prétention d’innocence.
- source_word: וּכְתֻמִּי
  choice: et selon l’intégrité
  rationale: תֻּם évoque l’intégrité, la plénitude morale ou l’état irréprochable. « Intégrité » est naturel en français moderne et n’implique pas nécessairement une perfection absolue.
- source_word: עָלָי
  choice: qui est en moi
  rationale: La préposition signifie littéralement « sur moi », mais, appliquée à une qualité personnelle, « qui est en moi » exprime naturellement en français que cette intégrité appartient au psalmiste. La tournure hébraïque est signalée en note.
theological_decisions:
- issue: La revendication personnelle de justice et d’intégrité implique-t-elle une absence absolue de péché ?
  choice: Conserver sans l’atténuer la revendication à « ma justice » et à « l’intégrité qui est en moi ».
  alternative: Paraphraser par « mon bon droit », « mon innocence dans cette affaire » ou « la droiture de ma cause ».
  rationale: L’hébreu formule directement une revendication personnelle. La traduction préserve cette tension, qui peut viser la situation présente sans que le verset précise lui-même qu’il s’agit d’une perfection morale absolue.
- issue: La demande שָׁפְטֵנִי doit-elle être explicitement favorable ?
  choice: Traduire « Juge-moi » dans le texte principal.
  alternative: « Rends-moi justice » ou « Donne-moi gain de cause ».
  rationale: Le contexte favorise l’idée d’une justification, mais le verbe reste judiciairement ouvert. La traduction principale maintient cette amplitude, tandis que la note indique le sens favorable possible.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du parallélisme hébreu, tandis que « qui est en moi » évite le calque peu naturel « qui est sur moi ». Les termes judiciaires sont conservés sans résoudre implicitement la portée théologique de la revendication du psalmiste.
