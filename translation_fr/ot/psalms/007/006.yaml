source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: fr
  text: 'Lève-toi, Yahweh, dans ta colère ! Dresse-toi contre les fureurs de mes adversaires ! Éveille-toi en ma faveur : tu as ordonné le jugement.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Éveille-toi en ma faveur, pour le jugement que tu as ordonné. » La relation entre « en ma faveur » et « le jugement que tu as ordonné » peut être comprise de différentes manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: L’impératif de קום appelle Yahweh à se mettre en action. « Lève-toi » conserve l’image poétique et reste naturel en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin présent dans l’hébreu.
- source_word: בְּאַפֶּךָ
  choice: dans ta colère
  rationale: אַף désigne littéralement le nez, puis idiomatiquement la colère. « Dans ta colère » exprime clairement cette valeur figurée.
- source_word: הִנָּשֵׂא
  choice: Dresse-toi
  rationale: L’impératif niphal de נשׂא peut signifier « élève-toi ». Dans ce parallélisme d’intervention, « dresse-toi » garde l’image dynamique sans suggérer seulement une exaltation abstraite.
- source_word: בְּעַבְרוֹת
  choice: contre les fureurs
  rationale: Le pluriel עַבְרוֹת évoque des accès ou débordements de fureur. La préposition ב est comprise ici dans un rapport d’opposition, cohérent avec l’appel à intervenir contre les adversaires.
- source_word: צוֹרְרָי
  choice: mes adversaires
  rationale: Le participe substantivé désigne ceux qui traitent le psalmiste en ennemi. « Adversaires » convient au contexte conflictuel et judiciaire.
- source_word: וְעוּרָה
  choice: Éveille-toi
  rationale: L’impératif conserve l’anthropomorphisme vigoureux de la prière sans l’expliquer ni l’atténuer.
- source_word: אֵלַי
  choice: en ma faveur
  rationale: La préposition signifie littéralement « vers moi », mais peut ici indiquer que l’intervention demandée doit bénéficier au psalmiste.
- source_word: מִשְׁפָּט צִוִּיתָ
  choice: ordonne le jugement
  rationale: L’ordre hébreu permet de rattacher « le jugement » à l’impératif précédent ou au parfait צִוִּיתָ. La vocalisation massorétique donne « tu as ordonné », mais la formulation française retenue suit une possibilité syntaxique ancienne et signale l’autre lecture en note.
theological_decisions:
- issue: Nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; l’Éternel
  rationale: Le texte porte un nom propre et non un titre. La translittération évite de substituer silencieusement une désignation confessionnelle.
- issue: Impératifs anthropomorphiques adressés à Dieu
  choice: Conserver « Lève-toi », « Dresse-toi » et « Éveille-toi »
  alternative: Interviens ; agis
  rationale: Ces images structurent la supplication. Les conserver respecte sa force poétique sans affirmer que Dieu serait littéralement endormi ou inactif.
- issue: Syntaxe de מִשְׁפָּט צִוִּיתָ
  choice: « ordonne le jugement »
  alternative: « le jugement que tu as ordonné » ou « tu as ordonné le jugement »
  rationale: Le texte consonantique et la syntaxe poétique ont suscité plusieurs rattachements. La traduction principale rend une lecture impérative possible, tandis que la note préserve la lecture du texte massorétique vocalisé, « tu as ordonné ».
translation_notes:
  register: Français international moderne, poétique et digne. Les trois impératifs parallèles et les exclamations rendent l’intensité de l’appel. « Adversaires » maintient une tonalité judiciaire, et la note conserve l’ambiguïté syntaxique de la fin du verset.
