  naturalness: « Lève-toi », « Dresse-toi » et « Éveille-toi » forment une séquence poétique naturelle et soutenue en français moderne. Une ponctuation par deux-points rend la dernière proposition intelligible sans transformer le parfait hébreu en nouvel impératif.
  terminology: « Yahweh », « colère », « fureurs », « adversaires », « jugement » et « en ma faveur » sont appropriés. « Fureurs » rend de manière recevable le pluriel de עַבְרוֹת.
