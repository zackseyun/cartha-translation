source:
  edition: WLC
  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: fr
  text: qu’un ennemi poursuive ma vie et la rattrape[a] ; qu’il piétine ma vie à terre et fasse demeurer ma gloire dans la poussière[b]. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon âme » pour « ma vie » (נַפְשִׁי) ; le terme hébreu peut désigner la personne, l’âme ou la vie selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon honneur » ou « ma dignité » pour « ma gloire » (כְבוֹדִי).
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: qu’un ennemi poursuive
  rationale: Le yiqtol a ici une valeur jussive et imprécatoire dans le serment conditionnel commencé au verset précédent ; « poursuivre » garde le sens concret du verbe.
- source_word: אוֹיֵב
  choice: un ennemi
  rationale: Le nom singulier est sans article en hébreu ; « un ennemi » préserve naturellement cette indétermination.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: נפשׁ désigne ici la vie ou la personne vivante poursuivie, plutôt qu’une âme immatérielle distincte.
- source_word: וְיַשֵּׂג
  choice: et la rattrape
  rationale: Le verbe signifie atteindre ou rattraper quelqu’un que l’on poursuit ; le pronom reprend naturellement « ma vie ».
- source_word: וְיִרְמֹס
  choice: qu’il piétine
  rationale: Le verbe évoque l’action violente de fouler aux pieds ; la tournure garde la force jussive.
- source_word: לָאָרֶץ
  choice: jusqu’à terre
  rationale: Dans ce contexte de piétinement, cette expression française rend idiomatiquement le mouvement vers le sol.
- source_word: חַיָּי
  choice: ma vie
  rationale: Le pluriel hébreu fonctionne idiomatiquement avec le sens de « vie ».
- source_word: וּכְבוֹדִי
  choice: ma gloire
  rationale: « Gloire » conserve la richesse poétique de כבוד, qui peut aussi désigner l’honneur ou la dignité.
- source_word: לֶעָפָר
  choice: dans la poussière
  rationale: Avec le verbe « demeurer », « dans la poussière » est naturel et maintient l’image d’humiliation et de mort.
- source_word: יַשְׁכֵּן
  choice: fasse demeurer
  rationale: La forme causative de שכן signifie faire habiter ou faire demeurer ; la traduction conserve cette valeur et l’image poétique.
- source_word: סֶלָה
  choice: Sélah
  rationale: La translittération traditionnelle est conservée, car la fonction exacte du terme reste incertaine.
theological_decisions:
- issue: Sens anthropologique de נַפְשִׁי
  choice: ma vie
  alternative: mon âme
  rationale: La poursuite, le fait d’être rattrapé et le piétinement concernent ici la vie de la personne ; « ma vie » évite d’imposer une distinction corps-âme que l’hébreu n’exige pas.
- issue: Sens de כְבוֹדִי dans l’expression poétique de soi
  choice: ma gloire
  alternative: mon honneur / ma dignité
  rationale: « Ma gloire » préserve l’expression imagée et sa polysémie, tandis que la note signale les principaux sens possibles sans trancher abusivement.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme, la violence des images et la force imprécatoire sont maintenus. « Sélah » est conservé comme terme technique non traduit.
