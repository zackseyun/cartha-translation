id: PSA.7.12
reference: Psalms 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: fr
  text: S’il ne fait pas demi-tour[a], il[b] aiguisera son épée ; il a bandé son arc et l’a préparé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’il ne se repent pas ». Le verbe hébreu signifie « revenir, faire demi-tour » et peut, dans ce contexte, évoquer la repentance.
    reason: lexical_alternative
  - marker: b
    text: Les pronoms renvoient probablement à Dieu, qui prépare les armes du jugement contre celui qui ne fait pas demi-tour. Ils peuvent aussi être compris, quoique moins probablement, comme renvoyant au méchant qui prépare ses propres armes.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: S’il ne… pas
  rationale: Rend directement la proposition conditionnelle négative de l’hébreu, dans un français naturel.
- source_word: יָשׁוּב
  choice: fait demi-tour
  rationale: Le verbe שׁוב signifie revenir ou se détourner. « Faire demi-tour » conserve ici l’image d’un changement de direction sans réduire explicitement le sens à la repentance.
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: il aiguisera son épée
  rationale: « Aiguiser » rend clairement l’action de rendre une lame tranchante ; le futur convient à l’apodose conditionnelle.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: il a bandé son arc
  rationale: « Bander un arc » est l’expression française idiomatique correspondant à l’action de le courber et de le mettre en état de tirer.
- source_word: וַיְכוֹנְנֶהָ
  choice: et l’a préparé
  rationale: Le verbe exprime ici la mise en état ou la préparation de l’arc ; le pronom masculin français reprend naturellement « arc » malgré le suffixe féminin hébreu qui reprend קשת.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Conserver les pronoms sans identifier explicitement leur référent ; dans le contexte, ils renvoient probablement à Dieu qui prépare les armes du jugement.
  alternative: Les pronoms peuvent être compris comme renvoyant au méchant qui prépare ses propres armes.
  rationale: Le contexte immédiat favorise Dieu comme sujet de la préparation guerrière, mais l’hébreu ne le nomme pas dans ce verset. La traduction maintient donc l’ambiguïté grammaticale et la signale en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire demi-tour » préserve l’image concrète du retournement tout en permettant son sens moral ; « bander son arc » emploie l’expression française usuelle.
