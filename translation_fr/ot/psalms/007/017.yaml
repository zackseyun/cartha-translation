source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: fr
  text: Je rendrai grâce à Yahweh selon sa justice[a], et je chanterai en l’honneur du nom de Yahweh, le Très-Haut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de sa justice » ; le mot hébreu peut aussi évoquer sa droiture.
    reason: La préposition peut être comprise comme marquant la correspondance ou la cause, et צֶדֶק recouvre les notions de justice et de droiture.
lexical_decisions:
- source_word: אוֹדֶה
  choice: Je célébrerai
  rationale: Le hiphil de ידה désigne ici l’action de remercier ou de louer Dieu. « Je célébrerai » convient au registre poétique et accepte naturellement Yahweh comme complément direct.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כְּצִדְקוֹ
  choice: selon sa justice
  rationale: La préposition כְּ exprime vraisemblablement la conformité ou la correspondance (« selon »). צֶדֶק réunit ici les nuances de justice, de droiture et de juste conduite; « justice » est naturel en français et la note conserve l’autre nuance majeure.
- source_word: וַאֲזַמְּרָה
  choice: et je chanterai
  rationale: זמר désigne le chant, souvent musical, adressé à Dieu. Avec « le nom de Yahweh » comme complément, « chanterai » exprime naturellement l’acte de louange sans ajout explicatif.
- source_word: שֵׁם
  choice: le nom
  rationale: La traduction littérale préserve la portée biblique du nom comme expression de l’identité et de la renommée révélées de Dieu.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Ce titre divin signifie « Très-Haut ». L’article français est requis dans l’apposition « Yahweh, le Très-Haut », sans qu’il soit nécessaire d’ajouter « Dieu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel et évite de le remplacer par un titre; « Jéhovah » repose sur une vocalisation traditionnelle plus tardive.
- issue: Portée de צֶדֶק appliqué à Dieu
  choice: justice
  alternative: droiture
  rationale: Le terme hébreu peut désigner à la fois la conformité morale, la droiture et l’exercice de la justice. Le contexte du psaume met fortement en avant le juste jugement de Dieu, mais la note maintient l’étendue sémantique.
- issue: Valeur de la préposition כְּ dans כְּצִדְקוֹ
  choice: selon
  alternative: à cause de / pour
  rationale: « Selon » préserve formellement l’idée de correspondance avec la justice de Dieu. Une valeur causale est possible dans le contexte de la louange et reste signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. « Je célébrerai » évite la tournure moins idiomatique « je rendrai grâce à Yahweh » avec un complément direct, tandis que la seconde proposition garde la simplicité du parallélisme hébreu.
