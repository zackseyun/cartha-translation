  yaml_path: translation/ot/psalms/007/009.yaml
  text: Please let the evil of the wicked come to an end, but establish the righteous—O righteous God who examines hearts and kidneys.
translation:
  language: fr
  text: Que cesse le mal des méchants ! Affermis le juste, ô Dieu juste, toi qui sondes les cœurs et les reins.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la pensée hébraïque, le cœur et les reins représentent la vie intérieure, y compris les pensées, les intentions et les émotions profondes.
    reason: Explique l’image anatomique biblique, qui pourrait être comprise seulement au sens physique en français moderne, tout en conservant dans le texte les termes concrets de l’hébreu.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Que cesse donc
  rationale: Le verbe exprime l’achèvement ou la cessation, tandis que נָא donne à la demande une nuance pressante; la tournure optative française restitue les deux.
- source_word: וּתְכוֹנֵן
  choice: Affermis
  rationale: Le piel de כון signifie ici rendre ferme, établir solidement ou maintenir; « affermis » est naturel et conserve l’image de stabilité.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: les cœurs et les reins
  rationale: Traduction concrète des organes qui, dans l’anthropologie hébraïque, désignent la vie intérieure, notamment les pensées, les intentions et les émotions profondes.
- source_word: אֱלֹהִים צַדִּיק
  choice: Dieu juste
  rationale: Conserve l’adjectif hébreu et son lien possible aussi bien avec Dieu qu’avec l’acte d’examiner; l’apostrophe française rend naturellement la syntaxe.
theological_decisions:
- issue: Portée de « juste » dans וּתְכוֹנֵן צַדִּיק
  choice: « le juste » au singulier générique
  alternative: « les justes »
  rationale: Le texte massorétique porte un singulier; le français peut naturellement l’entendre comme désignant la personne juste en général.
- issue: Description de l’examen divin
  choice: Maintien de « cœurs et reins » avec explication en note
  alternative: « pensées et sentiments profonds »
  rationale: La formulation corporelle appartient à l’image poétique et théologique du texte; la remplacer dans le corps du verset effacerait cette image et préciserait excessivement les facultés visées.
translation_notes:
  register: Français international moderne, poétique et digne. L’exclamation rend la supplication énergique du verset; l’apostrophe « toi, Dieu juste » clarifie la construction sans supprimer sa tension. Le terme concret « reins » est conservé dans le texte et éclairé par une note.
