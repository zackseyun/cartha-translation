  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: fr
  text: 'si j’ai rendu le mal à celui qui était en paix avec moi,

    ou délivré mon adversaire sans raison[a] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dépouillé mon adversaire sans raison ». Le verbe hébreu peut aussi être compris au sens de « dépouiller » plutôt que de « délivrer ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: si
  rationale: Introduit la condition d’un serment imprécatoire; « si » est la tournure française naturelle.
- source_word: גָּמַלְתִּי
  choice: j’ai rendu
  rationale: Le verbe exprime ici l’idée de traiter quelqu’un en retour ou de lui rendre quelque chose; avec רָע, « rendre le mal » est idiomatique et précis.
- source_word: שׁוֹלְמִי
  choice: celui qui vivait en paix avec moi
  rationale: Désigne une personne entretenant une relation paisible avec le psalmiste. Cette formulation reste plus proche de l’hébreu que « mon allié » ou « mon ami ».
- source_word: רָע
  choice: le mal
  rationale: Conserve la portée morale du terme et forme en français l’expression naturelle « rendre le mal ».
- source_word: וָאֲחַלְּצָה
  choice: si j’ai dépouillé
  rationale: Le sens hostile « dépouiller » donne deux fautes parallèles niées dans le serment. La répétition de « si » explicite en français la fonction conditionnelle de la seconde proposition sans en modifier la logique.
- source_word: צוֹרְרִי
  choice: mon adversaire
  rationale: Rend le participe substantivé désignant celui qui se montre hostile; « adversaire » convient au registre poétique sans être archaïque.
- source_word: רֵיקָם
  choice: sans raison
  rationale: Pris adverbialement, le mot indique ici l’absence de motif ou de juste cause à l’acte hostile.
theological_decisions:
- issue: Sens de וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: 'Lecture négative et parallèle : « si j’ai dépouillé sans raison mon adversaire »'
  alternative: 'Lecture positive ou concessive : « alors que j’ai délivré celui qui était sans raison mon adversaire »'
  rationale: La proposition est lexicalement et syntaxiquement difficile. Le sens « dépouiller » maintient le parallélisme entre deux actes injustes que le psalmiste nie avoir commis. Comme le verbe peut aussi signifier « délivrer », cette autre lecture authentique est conservée en note plutôt que supprimée.
translation_notes:
  register: Français moderne, digne et poétique. La structure conditionnelle est répétée pour rendre clairement les deux membres parallèles du serment. Le tiret final signale que la conséquence de la condition vient au verset suivant.
