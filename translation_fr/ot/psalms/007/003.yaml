id: PSA.7.3
reference: Psalms 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֣ה אֱ֭לֹהַ/י אִם עָשִׂ֣יתִי זֹ֑את אִֽם יֶשׁ עָ֥וֶל בְּ/כַפָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/003.yaml
  text: O Yahweh my God[a], if I have done this, if there is injustice in my hands—
translation:
  language: fr
  text: Yahweh, mon Dieu, si j’ai fait cela, s’il y a de l’injustice dans mes mains[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’il y a du tort sur mes mains » ; l’expression hébraïque peut évoquer une faute morale ou une culpabilité.
    reason: La préposition et l’image corporelle permettent plusieurs formulations françaises, tandis que l’expression dépasse le sens strictement matériel.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », transcription courante du nom divin personnel, plutôt que par un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: La forme porte le suffixe de première personne du singulier et s’inscrit ici dans une adresse directe à Yahweh.
- source_word: אִם
  choice: si
  rationale: La particule introduit les conditions d’une protestation d’innocence qui se poursuit dans les versets suivants.
- source_word: עָשִׂיתִי זֹאת
  choice: j’ai fait cela
  rationale: Cette formulation rend simplement le parfait qal à la première personne et le démonstratif, sans préciser ce que « cela » désigne.
- source_word: עָוֶל
  choice: injustice
  rationale: Le terme désigne le tort, l’injustice ou la perversité morale ; « injustice » convient au contexte judiciaire du psaume.
- source_word: בְּכַפָּי
  choice: dans mes mains
  rationale: La traduction conserve l’image hébraïque des paumes ou des mains, qui peut évoquer des actes coupables ou une culpabilité attachée à leur auteur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin ; sa transcription préserve la distinction entre ce nom propre et le titre אֲדֹנָי.
- issue: Portée de la protestation d’innocence
  choice: formulation conditionnelle sans affirmation d’une innocence absolue
  alternative: reformuler comme une déclaration catégorique d’innocence
  rationale: Les deux occurrences de אִם ouvrent une auto-imprécation conditionnelle. La traduction conserve cette tension et n’étend pas la revendication au-delà des accusations visées.
translation_notes:
  register: Français international actuel, sobre et digne. L’image concrète des mains est conservée, et le tiret final signale que la phrase conditionnelle se poursuit au verset suivant.
