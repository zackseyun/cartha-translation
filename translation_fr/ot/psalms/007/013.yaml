id: PSA.7.13
reference: Psalms 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/ל/וֹ הֵכִ֣ין כְּלֵי מָ֑וֶת חִ֝צָּ֗י/ו לְֽ/דֹלְקִ֥ים יִפְעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/013.yaml
  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: fr
  text: Il a préparé pour lui des armes mortelles ; il rend ses flèches enflammées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il destine ses flèches aux poursuivants » ou « contre les poursuivants ». Le terme hébreu peut venir du verbe signifiant « poursuivre » plutôt que « brûler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: pour lui
  rationale: La préposition לְ avec le suffixe masculin singulier désigne naturellement la personne contre laquelle les armes sont préparées, ici le méchant évoqué dans le contexte.
- source_word: הֵכִין
  choice: a préparé
  rationale: Le hiphil de כון signifie « préparer, tenir prêt ». Le passé composé exprime en français une préparation accomplie dont le résultat demeure pertinent.
- source_word: כְּלֵי מָוֶת
  choice: des armes mortelles
  rationale: כְּלִי peut désigner un objet, un instrument ou une arme. Le contexte guerrier des flèches favorise « armes » ; « mortelles » restitue naturellement le complément hébreu « de mort ».
- source_word: חִצָּיו
  choice: ses flèches
  rationale: Traduction directe du nom pluriel muni du suffixe possessif masculin singulier.
- source_word: לְדֹלְקִים
  choice: enflammées
  rationale: דלק peut évoquer le fait de brûler ou celui de poursuivre. Avec des flèches, « enflammées » rend l’image guerrière traditionnelle, tout en signalant l’autre analyse dans une note.
- source_word: יִפְעָל
  choice: il rend
  rationale: Le qal de פעל signifie « faire, produire, façonner ». Avec « ses flèches » et l’attribut « enflammées », « il rend » donne une construction française naturelle.
theological_decisions:
- issue: Référent de « pour lui »
  choice: Conserver le pronom sans expliciter son référent.
  alternative: « contre le méchant »
  rationale: Le contexte permet de comprendre qu’il s’agit du méchant, mais l’hébreu emploie seulement un pronom. La traduction évite donc une explicitation interprétative.
translation_notes:
  register: Français moderne, sobre et poétique. « Armes mortelles » est plus naturel que le calque « armes de mort », tandis que « flèches enflammées » conserve l’image martiale. L’ambiguïté lexicale de דלק est maintenue en note.
