  text: שִׁגָּי֗וֹן לְ/דָ֫וִ֥ד אֲשֶׁר שָׁ֥ר לַ/יהוָ֑ה עַל דִּבְרֵי כ֝֗וּשׁ בֶּן יְמִינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/000.yaml
  text: A Shiggaion of David[a], which he sang to Yahweh concerning the words of Cush, a Benjaminite.
translation:
  language: fr
  text: Shiggaïon de David[a], qu’il chanta à Yahweh au sujet des paroles de Koush, un Benjaminite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être un terme technique musical ou poétique, tel que « complainte » ou « chant tumultueux » ; le mot hébreu Shiggaïon est rare et son sens demeure incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Shiggaïon
  rationale: Ce terme rare, probablement musical ou poétique, a un sens incertain. Sa translittération préserve son caractère technique sans imposer une interprétation conjecturale.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, la préposition ל peut exprimer l’auteur, l’appartenance, l’association ou la destination. « de David » conserve cette concision et une part de cette ouverture.
- source_word: אֲשֶׁר שָׁר
  choice: qu’il chanta
  rationale: Cette formulation rend directement la proposition relative et la forme accomplie du verbe שׁיר, dans un français naturel et digne.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique le destinataire du chant, et le tétragramme est rendu par la translittération française « Yahweh ».
- source_word: עַל
  choice: au sujet de
  rationale: Dans un titre, עַל peut signaler le thème ou l’occasion. « au sujet de » reste naturel sans imposer un rapport causal.
- source_word: דִּבְרֵי
  choice: des paroles de
  rationale: Le pluriel construit de דָּבָר peut désigner des paroles, une affaire ou des événements. Le choix formel « paroles » évite d’ajouter l’idée non explicite d’accusations.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Le nom propre est translittéré selon une forme lisible en français moderne.
- source_word: בֶּן יְמִינִי
  choice: un Benjaminite
  rationale: L’expression désigne idiomatiquement un membre de la tribu de Benjamin. « un Benjaminite » en communique clairement le sens en français.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom divin personnel plutôt que de le remplacer par un titre, tout en évitant la forme tardive « Jéhovah ».
- issue: Portée de לְדָוִד dans le titre
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu peut exprimer l’auteur, l’association, l’appartenance ou la destination. La formulation retenue ne tranche pas au-delà de ce que permet le texte.
translation_notes:
  register: Titre bref, de registre littéraire et cultuel, mais immédiatement compréhensible. La translittération « Shiggaïon » conserve l’incertitude du terme hébreu, explicitée en note. « Koush » suit une graphie adaptée au français, et « Benjaminite » est l’ethnonyme courant.
