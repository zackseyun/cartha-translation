  yaml_path: translation/ot/psalms/007/015.yaml
  text: He dug a pit and hollowed it out[a], and he fell into the hole he made.
translation:
  language: fr
  text: Il a creusé une fosse et l’a creusée, puis il est tombé dans le trou qu’il avait fait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בּוֹר
  choice: fosse
  rationale: בּוֹר désigne couramment une fosse ou une citerne. Ici, le parallélisme avec שַׁחַת et l’image d’un piège favorisent le terme général « fosse ».
- source_word: כָּרָה
  choice: a creusé
  rationale: Le verbe signifie concrètement « creuser » ; cette formulation naturelle conserve l’image du texte hébreu.
- source_word: וַיַּחְפְּרֵהוּ
  choice: et l’a approfondie
  rationale: חפר appartient aussi au vocabulaire du creusement. Dans cette succession, « l’a approfondie » exprime naturellement la poursuite ou l’intensification de l’action sans répétition pesante.
- source_word: וַיִּפֹּל
  choice: puis il est tombé
  rationale: Le verbe נפל signifie « tomber ». « Puis » rend clairement la succession narrative exprimée par le waw consécutif.
- source_word: שַׁחַת
  choice: le trou
  rationale: Dans ce contexte, שַׁחַת désigne concrètement la cavité servant de piège. « Trou » évite de répéter « fosse » tout en maintenant l’image physique ; le sens abstrait « destruction » convient moins au contexte immédiat.
- source_word: יִפְעָל
  choice: qu’il avait fait
  rationale: פעל est un verbe général signifiant faire ou produire. Le plus-que-parfait français explicite naturellement que le trou résulte du travail déjà accompli.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la brièveté proverbiale et l’ironie de l’auteur du piège qui y tombe lui-même.
