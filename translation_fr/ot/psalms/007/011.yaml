source:
  edition: WLC
  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: fr
  text: Dieu est un juge juste[a], et un Dieu qui s’indigne chaque jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu juge le juste. »'
    reason: Le participe hébreu peut être compris verbalement, avec « le juste » comme complément.
  - marker: b
    text: 'Ou : « qui est en colère chaque jour. »'
    reason: Le participe hébreu peut être rendu par le vocabulaire plus direct de la colère.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, la forme morphologiquement plurielle désigne le Dieu unique et a un sens singulier.
- source_word: שׁוֹפֵט צַדִּיק
  choice: est un juge juste
  rationale: Le participe שׁוֹפֵט peut être rendu comme un verbe (« juge ») ou comme un nom prédicatif (« est un juge »). צַדִּיק caractérise ici le juge comme conforme à la justice; « juste » est naturel en français et garde la portée morale du terme.
- source_word: וְאֵל
  choice: et un Dieu
  rationale: אֵל renvoie ici au même Dieu que אֱלֹהִים. La traduction conserve la conjonction וְ et la construction parallèle, sans ajouter la nuance possible de puissance que le contexte n’impose pas.
- source_word: זֹעֵם
  choice: qui s’indigne
  rationale: Le participe exprime une indignation persistante. « S’indigne » rend une colère motivée par le mal sans atténuer l’affirmation de la colère divine.
- source_word: בְּכָל יוֹם
  choice: chaque jour
  rationale: L’expression indique naturellement une répétition quotidienne plutôt qu’une action ininterrompue durant toute une seule journée.
theological_decisions:
- issue: Langage de la colère divine
  choice: un Dieu qui s’indigne chaque jour
  alternative: un Dieu qui se met en colère chaque jour
  rationale: L’hébreu attribue explicitement à Dieu une indignation régulière. La formulation principale préserve cette tension théologique tout en exprimant le caractère moral de cette colère; la variante plus directe est signalée en note.
- issue: Fonction de שׁוֹפֵט צַדִּיק
  choice: Dieu est un juge juste
  alternative: Dieu juge avec justice
  rationale: La lecture prédicative décrit naturellement le caractère de Dieu comme juge. La valeur verbale du participe demeure possible et est conservée en note sans trancher excessivement l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « Dieu » reflète le parallélisme hébreu; « s’indigne » reste courant tout en portant une nuance morale appropriée.
