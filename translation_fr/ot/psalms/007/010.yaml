  text: מָֽגִנִּ֥/י עַל אֱלֹהִ֑ים מ֝וֹשִׁ֗יעַ יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: fr
  text: Mon bouclier est en Dieu[a], qui sauve ceux dont le cœur est droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu est mon bouclier. » La formulation hébraïque est compacte et peut se comprendre de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: Mon bouclier
  rationale: Le nom désigne concrètement un bouclier. Conserver cette image respecte la métaphore du psaume mieux qu’un terme abstrait comme « protection ».
- source_word: עַל
  choice: est auprès de
  rationale: Dans la proposition nominale compacte מָגִנִּי עַל אֱלֹהִים, la préposition situe le secours du psalmiste en Dieu ou auprès de lui. « Auprès de Dieu » demeure proche de la formulation hébraïque sans suggérer une position physique « sur Dieu ».
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le mot désigne ici le Dieu unique et se traduit naturellement au singulier.
- source_word: מוֹשִׁיעַ
  choice: qui sauve
  rationale: Le participe décrit l’action caractéristique de Dieu. La proposition relative donne en français une formulation naturelle tout en conservant cette valeur descriptive.
- source_word: יִשְׁרֵי
  choice: ceux dont … est droit
  rationale: Le terme qualifie des personnes moralement droites. Cette tournure permet de rendre naturellement en français l’expression hébraïque יִשְׁרֵי־לֵב.
- source_word: לֵב
  choice: le cœur
  rationale: Le singulier hébreu désigne l’être intérieur. « Ceux dont le cœur est droit » conserve cette image et constitue une expression française claire.
theological_decisions:
- issue: Relation syntaxique du premier membre
  choice: '« Mon bouclier est auprès de Dieu » : le secours protecteur du psalmiste se trouve auprès de Dieu.'
  alternative: « Dieu est mon bouclier », restructuration interprétative plus fluide.
  rationale: L’hébreu ne comporte pas de verbe exprimé et sa formulation très compacte admet plusieurs analyses. Le texte principal maintient l’ordre et la tension de l’original, tandis que la note signale l’interprétation métaphorique courante sans l’imposer silencieusement.
translation_notes:
  register: Français moderne, international et digne. La formulation « auprès de Dieu » est volontairement légèrement marquée afin de préserver la syntaxe et l’ambiguïté réelles de l’hébreu; la seconde moitié est rendue idiomatiquement.
