- from: Mon bouclier est auprès de Dieu[a], qui sauve ceux dont le cœur est droit.
  to: Mon bouclier est en Dieu[a], qui sauve ceux dont le cœur est droit.
  rationale: La révision remplace la tournure spatialement trompeuse « auprès de Dieu » par « en Dieu ». Cette dernière est idiomatique dans un registre poétique et biblique français, préserve l’image concrète de « bouclier » ainsi que l’ellipse du texte hébreu, et ne tranche pas silencieusement en faveur de la restructuration « Dieu est mon bouclier », laquelle demeure signalée en note.
  reviewer_model: gpt-5.6-terra
