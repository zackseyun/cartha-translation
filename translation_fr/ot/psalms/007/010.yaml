    issue: « auprès de Dieu » donne une nuance de proximité physique.
    rationale: Pour עַל dans cette expression elliptique, cette formulation est plus étroite et plus concrètement locative que ne le permet le texte. Elle ne rend pas bien l’idée traditionnelle de protection fondée en Dieu et demeure maladroite en français.
  revised_text: Mon bouclier est en Dieu[a], qui sauve ceux dont le cœur est droit.
