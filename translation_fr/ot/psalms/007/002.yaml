source:
  edition: WLC
  text: פֶּן יִטְרֹ֣ף כְּ/אַרְיֵ֣ה נַפְשִׁ֑/י פֹּ֝רֵ֗ק וְ/אֵ֣ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/002.yaml
  text: lest he tear my soul like a lion[a], rending it apart with no one to rescue.
translation:
  language: fr
  text: de peur qu’il ne me[a] déchire comme un lion, me mettant en pièces sans que personne ne me délivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut se traduire par « ma vie », « mon être » ou « ma personne » ; il désigne ici la personne même du psalmiste, menacée de mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Introduit la conséquence redoutée; cette tournure française conserve la force d’avertissement et appelle naturellement le subjonctif.
- source_word: יִטְרֹף
  choice: déchire
  rationale: Le verbe טרף évoque l’action d’un prédateur qui déchire sa proie; « déchire » est vif, naturel et cohérent avec l’image du lion.
- source_word: כְּאַרְיֵה
  choice: comme un lion
  rationale: Rend directement la comparaison marquée par le préfixe כ.
- source_word: נַפְשִׁי
  choice: me
  rationale: Dans ce contexte de menace mortelle, נֶפֶשׁ désigne la personne ou la vie du psalmiste. Le pronom « me » exprime naturellement en français la personne entière sans imposer le sens plus étroit de l’âme immatérielle.
- source_word: פֹּרֵק
  choice: me mettant en pièces
  rationale: Le participe prolonge et intensifie l’image du prédateur. « Mettre en pièces » exprime clairement la violence, tout en laissant le rapport précis avec le verbe précédent aussi ouvert que dans l’hébreu.
- source_word: וְאֵין מַצִּיל
  choice: sans que personne ne me délivre
  rationale: Rend l’absence de tout sauveteur. « Délivrer » convient au registre des Psaumes et décrit ici un secours concret face au danger.
theological_decisions:
- issue: Sens anthropologique de נַפְשִׁי
  choice: me
  alternative: mon âme / ma vie
  rationale: Le contexte porte sur la personne du psalmiste menacée par un prédateur. « Me » préserve cette portée globale et évite de réduire נֶפֶשׁ soit à une âme immatérielle, soit à la seule survie biologique.
translation_notes:
  register: Français moderne, digne et imagé. La construction « de peur que… ne » conserve la tonalité poétique et la conséquence redoutée; « mettre en pièces » reste immédiatement compréhensible.
