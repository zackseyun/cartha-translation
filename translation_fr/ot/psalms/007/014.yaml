  text: הִנֵּ֥ה יְחַבֶּל אָ֑וֶן וְ/הָרָ֥ה עָ֝מָ֗ל וְ/יָ֣לַד שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/014.yaml
  text: 'Look: he labors with wickedness, conceives trouble, and gives birth to falsehood.[a]'
translation:
  language: fr
  text: 'Voici : il est en travail du mal, il conçoit le malheur et enfante le mensonge.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu superpose les images du travail pénible — peut-être des douleurs de l’enfantement —, de la conception et de la naissance. Le premier verbe peut aussi se traduire par « se tord de douleur » ; les mots rendus par « mal » et « malheur » ont des sens qui se recoupent.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voyez
  rationale: L’interjection attire vivement l’attention sur l’image qui suit. « Voyez » est direct, actuel et digne.
- source_word: יְחַבֶּל
  choice: travaille
  rationale: Dans cette métaphore de l’enfantement, le verbe évoque le travail pénible, voire les douleurs de l’accouchement. « Travaille » conserve la polysémie sans imposer artificiellement une chronologie biologique.
- source_word: אָוֶן
  choice: mal
  rationale: Le terme associe faute morale, mal nuisible et peine. « Mal » garde cette amplitude tout en restant distinct du « malheur » de la proposition suivante.
- source_word: הָרָה
  choice: conçoit
  rationale: Le verbe désigne la conception ou le fait de devenir enceinte. « Conçoit » maintient l’image reproductive et la formulation condensée de l’hébreu.
- source_word: עָמָל
  choice: malheur
  rationale: Le mot peut désigner peine, misère, tourment ou méfait. Ici, « malheur » exprime le dommage produit et s’intègre naturellement à l’image de la conception.
- source_word: יָלַד שָׁקֶר
  choice: enfante le mensonge
  rationale: Cette expression achève explicitement l’image de la naissance. « Enfante » est concis et digne, tandis que « mensonge » rend clairement שָׁקֶר.
theological_decisions: []
translation_notes:
  register: Français international moderne, concis et poétique. La traduction conserve la succession volontairement non linéaire des images hébraïques et évite de la réorganiser en conception, grossesse puis naissance.
