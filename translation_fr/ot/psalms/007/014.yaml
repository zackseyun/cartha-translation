    issue: L’expression « travaille au mal » affaiblit l’image du travail de l’enfantement.
    rationale: En français, « travailler au mal » signifie spontanément œuvrer au mal. Le verbe hébreu évoque ici le travail, les douleurs ou les torsions de l’enfantement; la traduction doit rendre cette imagerie dans le texte principal plutôt que seulement en note.
  - severity: low
    issue: « Voyez » transforme l’interjection en impératif pluriel.
    rationale: הִנֵּה est une particule déictique. « Voici » conserve mieux cette fonction sans ajouter un destinataire pluriel.
