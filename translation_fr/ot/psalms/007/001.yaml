  text: יְהוָ֣ה אֱ֭לֹהַ/י בְּ/ךָ֣ חָסִ֑יתִי הוֹשִׁיעֵ֥/נִי מִ/כָּל רֹ֝דְפַ֗/י וְ/הַצִּילֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: fr
  text: Yahweh, mon Dieu, en toi, je trouve refuge[a]. Sauve-moi de tous ceux qui me poursuivent et délivre-moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en toi je me suis réfugié ». Dans ce contexte de prière, l’accompli hébreu peut aussi se rendre par un passé composé.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de représenter directement le tétragramme présent dans le texte hébreu.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le nom porte le suffixe de première personne du singulier et forme avec « Yahweh » une adresse directe.
- source_word: בְּךָ חָסִיתִי
  choice: en toi je me suis réfugié
  rationale: Le verbe חָסָה exprime le fait de chercher ou de trouver refuge. Le passé composé rend l’accompli hébreu tout en conservant sa pertinence présente dans cette prière.
- source_word: הוֹשִׁיעֵנִי
  choice: Sauve-moi
  rationale: L’impératif hiphil de יָשַׁע demande ici le salut ou la mise à l’abri.
- source_word: מִכָּל רֹדְפַי
  choice: de tous ceux qui me poursuivent
  rationale: Le participe avec suffixe désigne ceux qui poursuivent continuellement le psalmiste, sans préciser davantage leur motivation.
- source_word: וְהַצִּילֵנִי
  choice: et délivre-moi
  rationale: L’impératif hiphil de נָצַל évoque l’arrachement au danger; « délivre-moi » maintient une légère distinction avec « Sauve-moi ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Valeur temporelle de חָסִיתִי
  choice: je me suis réfugié
  alternative: je trouve refuge
  rationale: L’accompli hébreu peut présenter une démarche déjà faite et toujours pertinente, mais le contexte de prière permet aussi une formulation française au présent; l’ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition des deux impératifs, « Sauve-moi » et « délivre-moi », conserve le parallélisme ainsi que la nuance entre les verbes hébreux.
