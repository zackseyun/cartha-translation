id: PSA.67.4
reference: Psalms 67:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: fr
  text: Que les nations se réjouissent et chantent de joie[a], car tu juges les peuples avec équité et tu guides les nations sur la terre[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussent des cris de joie ». Le verbe peut évoquer aussi bien un chant jubilant que des acclamations éclatantes.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le pays », si אֶרֶץ est compris dans un sens plus local. « Sur la terre » est retenu ici en raison de la portée universelle du psaume.
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Que les nations se réjouissent
  rationale: L’imparfait qal à valeur volitive convient ici à un souhait ou à un appel liturgique. « Que… se réjouissent » en restitue naturellement la force.
- source_word: וִירַנְּנוּ
  choice: et chantent de joie
  rationale: Le verbe piel de רנן évoque une expression vocale éclatante de joie. « Chanter de joie » est idiomatique et poétique, tandis que « pousser des cris de joie » demeure une possibilité réelle.
- source_word: לְאֻמִּים
  choice: les nations
  rationale: Le terme désigne des communautés nationales ou des peuples. « Les nations » convient à la portée universelle du psaume et est maintenu lors de sa seconde occurrence.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la joie des nations. « Car » est concis et adapté au registre poétique.
- source_word: תִשְׁפֹּט
  choice: tu juges
  rationale: L’imparfait peut être futur ou exprimer une action caractéristique. Le présent décrit ici naturellement l’action constante de Dieu sans exclure une portée future.
- source_word: עַמִּים
  choice: les peuples
  rationale: « Peuples » conserve une distinction lexicale avec לְאֻמִּים, rendu par « nations », tout en gardant la portée collective du terme.
- source_word: מִישׁוֹר
  choice: avec équité
  rationale: Le nom exprime ce qui est droit, juste et sans partialité. Dans ce contexte judiciaire, « avec équité » rend clairement cette nuance.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: La portée universelle du psaume favorise le sens global de אֶרֶץ. « Sur la terre » est naturel en français et n’enferme pas le verset dans un territoire particulier.
- source_word: תַּנְחֵם
  choice: tu guides
  rationale: Le hiphil de נחה signifie conduire ou guider. « Guider » exprime la direction exercée par Dieu sans réduire le verbe à un déplacement physique.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le terme est translittéré, car sa fonction exacte demeure incertaine; la graphie accentuée facilite sa lecture en français.
theological_decisions:
- issue: Portée de אֶרֶץ
  choice: la terre, au sens global
  alternative: le pays, dans un sens local
  rationale: Les références répétées à l’ensemble des peuples et des nations dans le psaume soutiennent la portée universelle, sans rendre impossible en soi le sens plus local du nom.
- issue: Valeur des formes verbales à l’imparfait
  choice: souhait pour les premiers verbes, puis présent caractéristique
  alternative: 'lecture future : « les nations se réjouiront… tu jugeras… tu guideras »'
  rationale: Le contexte hymnique permet de comprendre l’ouverture comme un appel ou un souhait, puis les actions de Dieu comme le fondement permanent de la louange. L’hébreu ne contraint toutefois pas à exclure toute nuance future.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre « nations » et « peuples » est conservé, ainsi que la brièveté du verset. « Sélah » reste non interprété afin de préserver l’incertitude du terme hébreu.
