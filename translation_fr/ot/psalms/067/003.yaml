  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/003.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: fr
  text: Que les peuples te louent[a], ô Dieu ! Que tous les peuples te louent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Les peuples te loueront. » La forme verbale hébraïque peut exprimer ici un souhait ou une prière, ou, moins probablement dans ce contexte, une action future.'
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: te louent
  rationale: Dans les psaumes, le hifil de ידה désigne couramment l’action de louer ou de célébrer Dieu. « Louer » convient au refrain public et cultuel, tandis que la construction avec « que » rend ici la valeur de souhait ou de prière.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne divers groupes humains. « Les peuples » conserve ce pluriel concret sans lui donner nécessairement la nuance politique de « nations ».
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô Dieu » exprime clairement cette adresse directe dans un registre poétique digne.
- source_word: כֻּלָּם
  choice: tous les peuples
  rationale: Le pronom totalisant est rendu naturellement en français en répétant « les peuples », ce qui préserve la clarté et le parallélisme du refrain.
theological_decisions:
- issue: Valeur modale de la forme verbale répétée dans le refrain
  choice: 'La rendre comme un souhait ou une prière : « Que les peuples te louent »'
  alternative: « Les peuples te loueront »
  rationale: La forme hébraïque peut, selon le contexte, exprimer l’inaccompli ou l’avenir, mais le refrain liturgique favorise ici une lecture volitive. La note conserve l’ambiguïté réelle sans transformer le verset en prédiction certaine.
translation_notes:
  register: Français international moderne, poétique et accessible. L’apostrophe « ô Dieu » maintient la dignité du psaume ; la répétition de « peuples » conserve la structure insistante du texte hébreu.
