id: PSA.67.7
reference: Psalms 67:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: fr
  text: Dieu nous bénira[a], et toutes les extrémités de la terre le craindront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que Dieu nous bénisse ». La forme verbale hébraïque peut exprimer ici soit une assurance, soit un souhait.
    reason: ambiguïté de la valeur verbale
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: nous bénira
  rationale: Le piel imparfait de ברך avec suffixe de première personne du pluriel signifie « bénir nous ». Dans cette conclusion poétique, le futur exprime naturellement une assurance et correspond à l’imparfait qui suit, sans exclure totalement une nuance souhaitée dans le contexte plus large.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le terme désigne ici le Dieu unique, comme l’indique la syntaxe au singulier.
- source_word: וְיִירְאוּ
  choice: et … craindront
  rationale: Le verbe ירא appliqué à Dieu peut associer crainte, révérence et saisissement. « Craindront » en conserve la force et l’ambivalence théologique.
- source_word: אֹתוֹ
  choice: le
  rationale: Le pronom objet masculin singulier renvoie personnellement à Dieu.
- source_word: כָּל
  choice: toutes les
  rationale: Avec le groupe nominal suivant, כָּל possède un sens collectif rendu naturellement par « toutes les ».
- source_word: אַפְסֵי אָרֶץ
  choice: les extrémités de la terre
  rationale: Cette expression construite désigne les régions les plus lointaines du monde. La formulation française conserve son caractère idiomatique et poétique.
theological_decisions:
- issue: Sens de ירא à l’égard de Dieu
  choice: le craindront
  alternative: le révéreront ; seront saisis de respect devant lui
  rationale: « Craindre » préserve la tension biblique entre peur, révérence, saisissement et soumission, au lieu de réduire le terme au simple respect.
- issue: Valeur des formes verbales imparfaites
  choice: 'futur affirmatif : « bénira … craindront »'
  alternative: 'valeur volitive : « Que Dieu nous bénisse… » ou éventuelle : « puisse bénir »'
  rationale: Le dernier verset se lit le plus naturellement comme l’expression confiante du résultat attendu, tout en reconnaissant que l’imparfait hébreu peut recevoir une nuance volitive dans le contexte du psaume.
translation_notes:
  register: Français international moderne, simple et digne. La tournure poétique traditionnelle « les extrémités de la terre » reste claire et reproduit l’image hébraïque. Le marqueur [a] est placé immédiatement après le verbe concerné.
