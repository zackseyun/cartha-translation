source:
  edition: WLC
  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: fr
  text: Que Dieu nous fasse grâce et nous bénisse. Qu’il fasse briller son visage sur nous[a]. Sélah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec nous ». Cette expression fait écho à la bénédiction sacerdotale de Nombres 6.24-26, notamment : « Que le Seigneur fasse briller son visage sur toi. »'
    reason: Alternative lexicale et renvoi intertextuel
  - marker: b
    text: « Sélah » est probablement une indication liturgique ou musicale, mais son sens précis est incertain.
    reason: Note culturelle
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique et s’accorde avec des formes verbales au singulier.
- source_word: יְחָנֵּנוּ
  choice: nous accorde sa grâce
  rationale: Le verbe חנן exprime ici, dans une prière, la faveur gracieuse demandée à Dieu. Cette formulation est naturelle en français et évite de restreindre le sens à la seule compassion.
- source_word: וִיבָרְכֵנוּ
  choice: et nous bénisse
  rationale: ברך est le verbe courant signifiant « bénir » ; le subjonctif rend la valeur de souhait ou de demande.
- source_word: יָאֵר
  choice: Que … brille
  rationale: Le hiphil de אור signifie littéralement « faire briller ». Avec « visage », le français naturel permet « que son visage brille », qui conserve l’image et l’écho de la bénédiction sacerdotale.
- source_word: פָּנָיו
  choice: son visage
  rationale: La traduction concrète préserve l’image hébraïque et son lien avec Nombres 6.25, sans la remplacer par une interprétation comme « sa faveur » ou « sa présence ».
- source_word: אִתָּנוּ
  choice: sur nous
  rationale: La préposition signifie littéralement « avec nous », mais, dans l’expression relative au visage qui brille, « sur nous » communique naturellement la faveur divine dirigée vers le peuple. Une note conserve la particularité du texte hébreu.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens exact du terme demeure incertain ; sa translittération évite de lui imposer une interprétation liturgique ou musicale précise.
theological_decisions:
- issue: Valeur volitive de la suite verbale
  choice: 'Traduire comme une prière ou un souhait : « Que Dieu… »'
  alternative: 'Lecture déclarative, par exemple : « Dieu nous accorde sa grâce et nous bénit »'
  rationale: Dans ce contexte de bénédiction psalmique, les formes verbales ont naturellement une valeur jussive ou optative. La construction française avec « que » et le subjonctif rend cette force.
- issue: Allusion à la bénédiction sacerdotale
  choice: Conserver l’image du visage qui brille
  alternative: Expliciter l’image par « qu’il porte sur nous un regard favorable »
  rationale: Le verset fait fortement écho à Nombres 6.24-26. Garder l’image concrète préserve ce lien intertextuel sans résoudre l’expression en une interprétation théologique unique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme de la prière hébraïque, l’image concrète du visage divin et la translittération traditionnelle « Sélah ». Les points d’exclamation rendent la force suppliante sans alourdir la syntaxe.
