source:
  edition: WLC
  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: fr
  text: La terre[a] a donné son produit ; Dieu, notre Dieu, nous bénit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le pays ». Le mot hébreu אֶרֶץ peut désigner la terre entière ou un pays.
    reason: lexical_alternative
  - marker: b
    text: Ou « que Dieu, notre Dieu, nous bénisse », ou « Dieu, notre Dieu, nous bénira ». Dans ce contexte, le verbe hébreu peut se comprendre comme un présent, un souhait ou un futur.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: la terre
  rationale: Dans le cadre universel du psaume, « la terre » convient mieux que « le pays », tout en laissant cette autre possibilité en note.
- source_word: נָתְנָה
  choice: a donné
  rationale: Le parfait hébreu exprime ici un fait accompli. « A donné » reste proche du verbe source et s’emploie naturellement avec « récolte ».
- source_word: יְבוּלָהּ
  choice: sa récolte
  rationale: Le terme désigne le produit ou rendement de la terre. « Sa récolte » est clair et naturel en français moderne, sans alourdir la phrase.
- source_word: יְבָרְכֵנוּ
  choice: nous bénit
  rationale: L’imparfait hébreu peut avoir ici une valeur présente, volitive ou future. Le présent exprime une affirmation confiante, tandis que les autres lectures sont conservées en note.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Traduction française habituelle du titre divin lorsqu’il désigne le Dieu d’Israël.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: 'La formulation directe conserve la répétition emphatique de l’hébreu : « Dieu, notre Dieu ».'
theological_decisions:
- issue: Valeur de l’imparfait יְבָרְכֵנוּ
  choice: 'présent de l’indicatif : « nous bénit »'
  alternative: 'souhait : « que Dieu, notre Dieu, nous bénisse » ; futur : « Dieu, notre Dieu, nous bénira »'
  rationale: La forme hébraïque demeure ambiguë dans ce contexte. Le présent s’accorde avec la récolte déjà donnée et exprime une affirmation confiante, mais la note préserve les lectures volitive et future sans trancher artificiellement.
translation_notes:
  register: Français international moderne, simple et digne. La répétition « Dieu, notre Dieu » est maintenue pour conserver l’accent de l’hébreu. La ponctuation en deux membres respecte le parallélisme du verset.
