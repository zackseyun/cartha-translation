  text: יוֹד֖וּ/ךָ עַמִּ֥ים אֱלֹהִ֑ים י֝וֹד֗וּ/ךָ עַמִּ֥ים כֻּלָּֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/005.yaml
  text: Let the peoples praise you[a], O God[b]; let all the peoples praise you.
translation:
  language: fr
  text: Que les peuples te louent, ô Dieu[a] ! Que tous les peuples te louent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les peuples te loueront, ô Dieu ! Tous les peuples te loueront ! » Le verbe hébreu peut aussi signifier « te rendre grâce ».'
    reason: La forme verbale peut être comprise comme un souhait ou comme une affirmation, et ידה peut exprimer à la fois la louange et l’action de grâce.
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: Que les peuples te louent
  rationale: Le hiphil de ידה exprime couramment, dans les Psaumes, la louange ou l’action de grâce adressée publiquement à Dieu. « Louer » convient au refrain cultuel, tandis que la tournure avec « que » rend sa valeur volitive probable.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne plusieurs groupes humains et maintient la portée universelle du verset. « Les peuples » est ici plus précis que « les nations ».
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô Dieu » en explicite la valeur vocative dans un registre poétique et priant.
- source_word: כֻּלָּם
  choice: tous les peuples
  rationale: Le terme inclut la totalité des peuples. La reprise du nom en français est naturelle et conserve l’insistance du parallélisme.
theological_decisions:
- issue: Mode et fonction du refrain répété
  choice: 'Une prière ou un souhait : « Que les peuples te louent »'
  alternative: 'Une affirmation au futur : « Les peuples te loueront »'
  rationale: La forme hébraïque peut aussi être comprise comme un indicatif, mais le contexte priant du psaume favorise une valeur volitive. L’autre lecture est conservée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la tonalité liturgique sont préservés sans archaïsme excessif.
