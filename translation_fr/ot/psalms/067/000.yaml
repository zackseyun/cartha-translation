lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement la personne chargée de diriger l’exécution musicale. « Au chef de chœur » est une formulation française claire et naturelle qui rend aussi la préposition לַ־.
- source_word: בִּנְגִינֹת
  choice: Avec les instruments à cordes
  rationale: Le nom renvoie ici aux instruments ou à la musique à cordes. « Avec » rend naturellement la préposition בְּ־ dans une indication d’exécution, tandis que « sur » demeure possible.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme usuel désignant ce genre de composition musicale et poétique dans les titres bibliques.
- source_word: שִׁיר
  choice: Chant
  rationale: Ce terme de genre est rendu séparément afin de conserver la double désignation hébraïque « psaume, chant ».
