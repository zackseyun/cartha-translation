id: PSA.67.2
reference: Psalms 67:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/דַ֣עַת בָּ/אָ֣רֶץ דַּרְכֶּ֑/ךָ בְּ/כָל גּ֝וֹיִ֗ם יְשׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/002.yaml
  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: fr
  text: afin que l’on connaisse ta voie sur la terre[a], ton salut[b] parmi toutes les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le pays », si le terme est compris dans un sens plus local ; le parallèle « parmi toutes les nations » favorise toutefois le sens plus large « sur la terre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ta délivrance ». Le terme hébreu peut désigner un secours concret ou, plus largement, le salut.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: afin que l’on connaisse
  rationale: L’infinitif construit précédé de ל exprime ici le but, dans la continuité de la prière du verset précédent. Cette tournure française rend naturellement cette valeur finale sans préciser un sujet absent de l’hébreu.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner une terre ou la terre entière. Le parallèle avec « parmi toutes les nations » favorise ici la portée universelle.
- source_word: דַּרְכֶּךָ
  choice: ta voie
  rationale: « Voie » conserve la métaphore de דֶּרֶךְ et peut évoquer à la fois le chemin de Dieu et sa manière d’agir.
- source_word: בְּכָל גּוֹיִם
  choice: parmi toutes les nations
  rationale: גּוֹיִם désigne ici les nations dans leur ensemble. « Parmi » rend bien la préposition בְּ dans ce contexte international.
- source_word: יְשׁוּעָתֶךָ
  choice: ton salut
  rationale: יְשׁוּעָה peut désigner le secours, la délivrance ou le salut. « Salut » garde l’ampleur de l’action salvatrice de Dieu sans exclure une délivrance concrète.
theological_decisions:
- issue: Portée de אֶרֶץ dans un psaume à horizon universel
  choice: « la terre », au sens universel
  alternative: « le pays », au sens local
  rationale: Le parallélisme avec « parmi toutes les nations » indique une perspective mondiale, sans imposer de développement doctrinal ultérieur.
- issue: Ampleur sémantique de יְשׁוּעָה
  choice: « salut »
  alternative: « délivrance » ou « victoire »
  rationale: « Salut » préserve la largeur théologique du terme, tandis que la note signale sa possible dimension concrète de délivrance.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation « afin que l’on connaisse » reste naturelle tout en conservant la valeur de but et l’absence de sujet explicite dans l’hébreu. Le parallélisme poétique est maintenu.
