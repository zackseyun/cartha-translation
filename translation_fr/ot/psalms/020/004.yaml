id: PSA.20.4
reference: Psalms 20:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִֽתֶּן לְ/ךָ֥ כִ/לְבָבֶ֑/ךָ וְֽ/כָל עֲצָתְ/ךָ֥ יְמַלֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: fr
  text: Qu’il t’accorde ce que ton cœur désire et qu’il accomplisse tous tes desseins[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous tes projets ».
    reason: Alternative lexicale pour עֲצָתְךָ, qui peut désigner des desseins, des plans ou des projets.
lexical_decisions:
- source_word: יִתֶּן
  choice: Qu’il t’accorde
  rationale: Dans cette suite de prières, le yiqtol a une valeur de souhait. « Accorder » rend naturellement l’idée de donner en réponse à un vœu ou à une demande.
- source_word: לְךָ
  choice: t’
  rationale: Le pronom masculin singulier est rendu par le tutoiement, adapté à l’adresse directe et cohérent avec le registre poétique du psaume.
- source_word: כִלְבָבֶךָ
  choice: ce que ton cœur désire
  rationale: 'Cette formulation française naturelle conserve l’image biblique du cœur tout en exprimant la valeur de כ (« selon, conformément à ») : ce qui correspond au désir ou à l’intention intérieure.'
- source_word: וְכָל
  choice: et… tous
  rationale: La conjonction et la totalité exprimée par כֹּל sont conservées dans une syntaxe française fluide.
- source_word: עֲצָתְךָ
  choice: tes desseins
  rationale: עֵצָה peut désigner un conseil, un projet ou un dessein issu de la délibération. « Desseins » maintient cette nuance d’intention réfléchie sans imposer un contexte particulier.
- source_word: יְמַלֵּא
  choice: qu’il accomplisse
  rationale: Le piel de מלא exprime ici la réalisation complète. « Accomplir » convient à des desseins et maintient la valeur optative du contexte.
theological_decisions:
- issue: Valeur des formes verbales dans un contexte de bénédiction et de prière
  choice: 'Rendre les deux verbes comme des souhaits : « Qu’il t’accorde… et qu’il accomplisse… »'
  alternative: 'Les rendre comme des futurs déclaratifs : « Il t’accordera… et accomplira… »'
  rationale: Le contexte pétitionnaire du psaume favorise une valeur jussive ou optative plutôt qu’une prédiction catégorique.
- issue: Sens de « cœur »
  choice: Conserver le cœur comme siège du désir et de l’intention
  alternative: Remplacer entièrement l’image par « tes désirs » ou « ta volonté »
  rationale: Le texte hébreu emploie explicitement « cœur ». La traduction garde cette anthropologie biblique sans réduire le terme à l’émotion seule.
- issue: Portée de עֵצָה
  choice: Employer « desseins », avec « projets » en note
  alternative: Employer « conseils » ou « projets » dans le texte principal
  rationale: « Desseins » préserve l’idée d’une intention réfléchie, tandis que la note signale l’équivalent contextuel plus courant « projets » sans trancher excessivement l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier reflète l’adresse hébraïque au destinataire. Le point d’exclamation souligne la valeur de souhait sans transformer le verset en affirmation prédictive.
