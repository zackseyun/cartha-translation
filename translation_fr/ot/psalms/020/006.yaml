  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: fr
  text: Maintenant, je sais que l’Éternel sauve son oint ; il lui répond de son saint ciel par les actes puissants de salut de sa main droite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Maintenant
  rationale: L’adverbe temporel est explicite dans le texte hébreu et marque ici l’assurance nouvellement affirmée du psalmiste.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et dignifié du tétragramme, distinct du titre « Seigneur ».
- source_word: מְשִׁיחוֹ
  choice: celui qu’il a consacré par l’onction
  rationale: Exprime le sens concret de « son oint » dans un français moderne, sans effacer la portée royale ni imposer ici le titre propre « Messie ».
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: depuis son ciel saint
  rationale: Conserve le singulier naturel en français pour l’hébreu pluriel « cieux » employé comme désignation céleste.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: par les puissants actes de salut de sa main droite
  rationale: Préserve le pluriel abstrait/intensif de גְּבֻרוֹת et le lien de יֵשַׁע avec ces manifestations puissantes, sans réduire la formule à une simple « puissance salvatrice ».
theological_decisions:
- issue: Identité du « consacré par l’onction »
  choice: 'Maintenir une désignation générique et possessive : « celui qu’il a consacré par l’onction »'
  alternative: « son Messie » ou « son oint »
  rationale: Dans le contexte immédiat, le mot vise le roi consacré, tout en pouvant recevoir une portée messianique plus large. La traduction ne tranche pas cette tension en transformant le terme en titre propre.
- issue: Agent et moyen du salut
  choice: Rattacher les actes puissants à la « main droite » de Dieu
  alternative: « par la puissance salvatrice de sa main droite »
  rationale: La formulation retenue garde les images hébraïques de la droite divine et des manifestations plurielles de puissance salvatrice.
translation_notes:
  register: Français international moderne, solennel mais accessible. La phrase conserve le parallélisme hébreu et son affirmation de confiance, avec un point-virgule entre les deux propositions.
