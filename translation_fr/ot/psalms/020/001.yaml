id: PSA.20.1
reference: Psalms 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: fr
  text: Que Yahweh te réponde au jour de la détresse ! Que le nom du Dieu de Jacob te mette hors d’atteinte[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te protège » ; le verbe hébreu évoque le fait de placer quelqu’un en hauteur, dans un lieu inaccessible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: Que … te réponde
  rationale: Le hiphil de ענה signifie ici « répondre ». La tournure avec « Que » rend la valeur de souhait ou de prière des formes verbales dans ce psaume.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: בְּיוֹם צָרָה
  choice: au jour de la détresse
  rationale: Cette formulation conserve l’image temporelle de l’hébreu et rend צָרָה par un terme naturel qui évoque une situation d’angoisse ou de danger.
- source_word: יְשַׂגֶּבְךָ
  choice: te mette hors d’atteinte
  rationale: Le piel de שׂגב présente la protection sous l’image d’une personne placée dans une position élevée et inaccessible. « Mettre hors d’atteinte » exprime naturellement en français à la fois l’image et son effet protecteur.
- source_word: שֵׁם
  choice: le nom
  rationale: Le mot garde sa portée poétique et théologique, qui peut inclure la réputation, l’autorité et la présence invoquée, sans réduire cette richesse à une seule interprétation.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: le Dieu de Jacob
  rationale: Cette traduction directe conserve la résonance historique et relationnelle de l’expression hébraïque.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Yahvé ou le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans lui substituer un titre.
- issue: Valeur des formes verbales
  choice: Souhait ou prière introduit par « Que »
  alternative: 'Futur affirmatif : « Yahweh te répondra… »'
  rationale: Dans le cadre liturgique de ce psaume, les imparfaits ont vraisemblablement une valeur optative ou jussive. La traduction évite donc de les transformer en simples prédictions.
- issue: Portée de שׂגב
  choice: Conserver l’image protectrice par « mettre hors d’atteinte »
  alternative: Traduire simplement par « protéger »
  rationale: La formulation choisie maintient la métaphore d’une mise en hauteur inaccessible tout en exprimant clairement sa fonction de protection.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la bénédiction est conservé par deux propositions introduites par « Que ». « Au jour de la détresse » maintient la tonalité poétique sans archaïsme excessif.
