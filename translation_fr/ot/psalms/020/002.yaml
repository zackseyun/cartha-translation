  text: יִשְׁלַֽח עֶזְרְ/ךָ֥ מִ/קֹּ֑דֶשׁ וּ֝/מִ/צִּיּ֗וֹן יִסְעָדֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: fr
  text: Qu’il t’envoie du secours depuis le sanctuaire[a] et qu’il te soutienne[b] depuis Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le lieu saint » ; l’hébreu peut aussi signifier littéralement « depuis la sainteté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « t’appuie » ou « t’affermisse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Qu’il t’envoie
  rationale: L’imparfait qal à la 3e personne du masculin singulier exprime ici, dans le contexte de bénédiction et de prière du psaume, un souhait plutôt qu’un simple futur.
- source_word: עֶזְרְךָ
  choice: du secours
  rationale: Le nom עֵזֶר avec suffixe de 2e personne signifie littéralement « ton secours » ou « du secours pour toi ». La tournure française naturelle « t’envoyer du secours » restitue clairement le destinataire.
- source_word: מִקֹּדֶשׁ
  choice: depuis le sanctuaire
  rationale: קֹדֶשׁ peut désigner la sainteté ou un lieu saint. Le parallèle locatif avec « depuis Sion » favorise ici le sens concret de sanctuaire, tout en laissant l’alternative en note.
- source_word: וּמִצִּיּוֹן
  choice: et … depuis Sion
  rationale: Le nom propre צִיּוֹן est rendu par sa forme française traditionnelle « Sion ». La conjonction relie les deux membres du parallélisme synonymique.
- source_word: יִסְעָדֶךָּ
  choice: qu’il te soutienne
  rationale: Le verbe סעד signifie soutenir, appuyer ou affermir. « Soutienne » est naturel, digne et conserve le souhait exprimé par l’imparfait dans ce contexte.
theological_decisions:
- issue: Référent du sujet implicite
  choice: Conserver le pronom implicite sous la forme « il », sans ajouter de nom divin.
  alternative: Expliciter « que le Seigneur » ou « que l’Éternel ».
  rationale: Les verbes hébreux sont à la 3e personne du masculin singulier, sans sujet exprimé dans ce verset. Le référent divin ressort du contexte précédent; l’expliciter ici ajouterait un élément absent de la ligne.
translation_notes:
  register: Français international moderne, poétique et accessible. Le double « depuis » est conservé afin de rendre le parallélisme et la provenance exprimée deux fois en hébreu. Les marqueurs de notes suivent immédiatement les expressions concernées.
