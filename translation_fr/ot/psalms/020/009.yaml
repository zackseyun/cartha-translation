  text: יְהוָ֥ה הוֹשִׁ֑יעָ/ה הַ֝/מֶּ֗לֶךְ יַעֲנֵ֥/נוּ בְ/יוֹם קָרְאֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: fr
  text: Yahweh[a], sauve ! Que le roi nous réponde le jour où nous appelons au secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh, sauve le roi ! Réponds-nous le jour où nous appelons au secours. » Ou peut-être : « Yahweh, sauve ! Le Roi nous répond le jour où nous appelons au secours. » La syntaxe hébraïque est condensée et permet plusieurs façons de comprendre la fonction de « le roi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par le titre traditionnel « le Seigneur », afin de préserver son caractère de nom personnel.
- source_word: הוֹשִׁיעָה
  choice: sauve !
  rationale: L’impératif de ישׁע exprime ici une prière directe. « Sauve ! » reste volontairement large et peut englober délivrance et victoire.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom commun défini est rendu sans majuscule, conformément au cadre royal du psaume, tout en signalant en note la possibilité d’un référent divin.
- source_word: יַעֲנֵנוּ
  choice: Que le roi nous réponde
  rationale: L’imparfait peut avoir ici une valeur de souhait. La tournure française avec « que » restitue naturellement cette nuance de prière.
- source_word: בְיוֹם
  choice: le jour où
  rationale: Cette formulation conserve l’image temporelle de l’hébreu tout en restant idiomatique en français.
- source_word: קָרְאֵנוּ
  choice: nous lançons notre appel
  rationale: Cette formulation rend l’emploi absolu de קרא sans imposer explicitement un objet à l’appel, ce qui aide à ne pas résoudre la syntaxe ambiguë.
theological_decisions:
- issue: Référent et fonction syntaxique de « le roi »
  choice: Dans le texte principal, « le roi » est le sujet de « nous réponde », probablement le roi humain dans le cadre royal et liturgique du psaume.
  alternative: 'On peut aussi comprendre : « Yahweh, sauve le roi ! Réponds-nous… », ou prendre « le Roi » comme un titre divin et lire une affirmation : « Le Roi nous répond… »'
  rationale: La syntaxe hébraïque est très condensée et admet plusieurs analyses significatives. Le texte principal suit la lecture qui prolonge le thème du roi davidique, tandis que la note préserve les autres possibilités sans trancher dogmatiquement.
translation_notes:
  register: Français international moderne, poétique et digne. « Nous lançons notre appel » évite l’emploi peu naturel du verbe « appeler » sans complément et ne précise pas indûment le destinataire de l’appel.
