  text: Au chef de chœur. Psaume de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; dans les titres hébreux des psaumes, cette expression peut indiquer l’auteur, une association ou une dédicace.
