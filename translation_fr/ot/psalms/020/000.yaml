lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. Cette formulation est concise, naturelle et conserve la fonction d’indication musicale.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Le nom désigne un chant destiné à une exécution musicale; « psaume » est le terme français précis et consacré dans ce contexte littéraire.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve en français une certaine latitude, sans imposer exclusivement l’idée d’auteur.
theological_decisions:
- issue: Sens du titre davidique
  choice: de David
  alternative: par David; pour David
  rationale: La construction hébraïque ne permet pas de trancher avec certitude entre attribution d’auteur, association et dédicace. Le texte principal préserve cette ambiguïté, et la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation brève respecte le caractère de titre liturgique et musical du verset.
