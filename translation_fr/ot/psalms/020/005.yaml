base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: fr
  text: 'Nous pousserons des cris de joie à cause de ton salut[a],

    et, au nom de notre Dieu, nous déploierons nos étendards[b].

    Que Yahweh exauce toutes tes requêtes[c] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta victoire » ou « ta délivrance ». Le terme hébreu peut désigner le salut au sens large, notamment une délivrance ou une victoire militaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous dresserons notre bannière ». Le verbe hébreu évoque probablement le fait de lever ou d’exposer des bannières en signe de célébration.
    reason: lexical_alternative
  - marker: c
    text: Ou « Yahweh exaucera toutes tes requêtes ». La forme hébraïque peut exprimer soit un souhait ou une prière, soit une affirmation au futur ; le souhait convient bien au contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: Nous pousserons des cris de joie
  rationale: Le verbe רנן exprime une exultation joyeuse et sonore. Cette formulation en restitue la force sans préciser qu’il s’agit nécessairement d’un chant.
- source_word: בִּישׁוּעָתֶךָ
  choice: pour ton salut
  rationale: יְשׁוּעָה peut désigner le salut, la délivrance ou la victoire. « Salut » conserve cette amplitude, tandis que « pour » rend naturellement en français le motif de la joie exprimé ici.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: et, au nom de notre Dieu
  rationale: « Au nom de » est l’expression française naturelle pour évoquer l’identité, l’autorité et l’appui du Dieu auquel le peuple se rattache.
- source_word: נִדְגֹּל
  choice: nous déploierons nos étendards
  rationale: Le verbe évoque vraisemblablement l’exposition ou l’élévation d’une bannière. « Déployer nos étendards » conserve cette image concrète de célébration collective.
- source_word: יְמַלֵּא
  choice: Que … accomplisse
  rationale: Bien que la forme soit un inaccompli, le contexte permet de la comprendre comme un souhait ou une prière. La construction française avec « que » rend clairement cette valeur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver sa fonction de nom propre dans le texte hébreu.
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: toutes tes demandes
  rationale: Le nom désigne ce qui est demandé. Cette expression est claire en français moderne et convient au contexte de prière.
theological_decisions:
- issue: Sens de יְשׁוּעָה dans le contexte royal et militaire du psaume
  choice: salut
  alternative: victoire ; délivrance
  rationale: Le contexte rend « victoire » tout à fait possible, mais « salut » préserve la portée plus large du terme hébreu sans exclure une délivrance militaire.
- issue: Valeur de l’inaccompli יְמַלֵּא
  choice: 'souhait ou prière : « Que Yahweh accomplisse »'
  alternative: 'affirmation au futur : « Yahweh accomplira »'
  rationale: Dans ce contexte liturgique de supplication, la valeur de souhait s’intègre naturellement au mouvement du psaume, tout en reconnaissant que la forme hébraïque peut aussi être lue comme un futur.
translation_notes:
  register: Français international moderne, poétique et digne. « Pousser des cris de joie » garde le caractère sonore de l’exultation ; « étendards » maintient l’imagerie royale et militaire sans archaïsme excessif.
