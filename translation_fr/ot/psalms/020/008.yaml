  text: הֵ֭מָּה כָּרְע֣וּ וְ/נָפָ֑לוּ וַ/אֲנַ֥חְנוּ קַּ֝֗מְנוּ וַ/נִּתְעוֹדָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/008.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: fr
  text: Eux se sont courbés et sont tombés ; mais nous, nous nous sommes relevés et nous tenons debout.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous sommes affermis », « nous avons repris des forces » ou « nous tenons ferme » pour le dernier verbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eux, ils
  rationale: Le pronom indépendant marque fortement le contraste avec « nous » ; la dislocation « Eux, ils » rend cette emphase de façon naturelle en français.
- source_word: כָּרְעוּ
  choice: ont fléchi
  rationale: Le verbe évoque le fait de plier les genoux ou de s’affaisser. « Ont fléchi » conserve l’image corporelle et s’enchaîne naturellement avec « sont tombés ».
- source_word: וְנָפָלוּ
  choice: et sont tombés
  rationale: Traduction directe qui préserve la coordination et le parallélisme poétique.
- source_word: וַאֲנַחְנוּ
  choice: mais nous, nous
  rationale: La conjonction introduit ici un contraste net. « Mais » exprime cette valeur adversative, tandis que la reprise du pronom restitue l’emphase de l’hébreu.
- source_word: קַּמְנוּ
  choice: nous nous sommes relevés
  rationale: Le verbe קום signifie se lever ou se relever. Dans l’opposition avec la chute des adversaires, « nous nous sommes relevés » exprime clairement le mouvement de rétablissement.
- source_word: וַנִּתְעוֹדָד
  choice: nous tenons debout
  rationale: Cette forme rare peut évoquer le fait de se redresser, de s’affermir ou de retrouver sa stabilité. « Nous tenons debout » conserve l’image physique sans exclure l’idée de fermeté retrouvée.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La double construction contrastive « Eux, ils… mais nous, nous… » restitue l’emphase des pronoms indépendants hébreux. Le point-virgule met en relief l’antithèse du verset.
