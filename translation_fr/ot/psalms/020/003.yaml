id: PSA.20.3
reference: Psalms 20:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִזְכֹּ֥ר כָּל מִנְחֹתֶ֑/ךָ וְ/עוֹלָתְ/ךָ֖ יְדַשְּׁנֶ֣/ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: fr
  text: Qu’il se souvienne de toutes tes offrandes[a] et qu’il agrée ton holocauste[b]. Séla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tes offrandes végétales » : le mot hébreu peut désigner précisément une offrande végétale, ou plus largement une offrande ou un don.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « rende gras » ou « considère comme riche », expression imagée indiquant que le sacrifice est accueilli favorablement.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: Qu’il se souvienne
  rationale: L’imparfait qal à valeur de souhait s’inscrit dans une prière de bénédiction. Cette tournure française exprime naturellement la demande adressée à Dieu.
- source_word: כָּל
  choice: toutes
  rationale: Conserve la portée globale du quantificateur hébreu et s’accorde naturellement avec le pluriel « offrandes ».
- source_word: מִנְחֹתֶךָ
  choice: tes offrandes
  rationale: מִנְחָה peut désigner un don ou une offrande en général, mais aussi plus précisément une offrande végétale. Le terme large convient au parallélisme sans trancher indûment; le sens cultuel plus précis est signalé en note.
- source_word: וְעוֹלָתְךָ
  choice: et ton holocauste
  rationale: עוֹלָה est le terme cultuel courant pour le sacrifice entièrement brûlé. « Holocauste » est ici le terme biblique français établi et concis.
- source_word: יְדַשְּׁנֶה
  choice: qu’il agrée
  rationale: Le piel de דשן évoque littéralement le fait de rendre gras ou de tenir pour riche. Dans ce contexte sacrificiel, il exprime l’accueil favorable du sacrifice; « agréer » restitue cet idiome dans un registre digne.
- source_word: סֶלָה
  choice: Séla
  rationale: La translittération traditionnelle est conservée, puisque la fonction exacte de ce terme demeure incertaine.
theological_decisions:
- issue: Référent des verbes à la troisième personne du masculin singulier
  choice: Dieu est le sujet implicite, rendu par « il » dans les deux propositions de souhait.
  alternative: Laisser l’agent divin entièrement implicite.
  rationale: Dans le contexte du psaume 20, l’assemblée demande la faveur de Dieu pour le roi. Le français exige ici l’expression du sujet, sans que cela ajoute une affirmation doctrinale étrangère au contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle de la prière est conservée; « agréer » maintient le registre cultuel sans reproduire dans le corps du texte un idiome hébreu qui serait obscur en français.
