  yaml_path: translation/ot/psalms/020/007.yaml
  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: fr
  text: Les uns comptent sur leurs chars, les autres sur leurs chevaux ; mais nous, nous faisons mémoire du nom du SEIGNEUR, notre Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, le texte est elliptique : « Les uns dans les chars, les autres dans les chevaux ; mais nous, au nom du SEIGNEUR notre Dieu, nous faisons mémoire [ou : nous le mentionnons]. » Le verbe peut aussi exprimer l’idée de célébrer ou de proclamer ce nom ; dans ce contexte, il peut être compris comme un recours confiant à Dieu.'
    reason: Préserver l’ellipse de l’hébreu et l’éventail sémantique de נַזְכִּיר, sans faire de l’invocation le seul sens possible.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: Les uns comptent sur leurs chars, les autres sur leurs chevaux
  rationale: 'L’hébreu est elliptique : il nomme les chars et les chevaux sans verbe explicite. « Comptent sur » explicite naturellement le contraste contextuel entre la confiance militaire des nations et le recours d’Israël à Dieu, sans retenir « se glorifient », qui anticiperait une autre interprétation possible.'
- source_word: נַזְכִּיר
  choice: nous invoquons
  rationale: Le hiphil de זכר peut signifier faire mémoire, mentionner ou proclamer. Avec « le nom de YHWH », « invoquer » rend ici l’acte public de se tourner vers Dieu, tout en signalant en note la portée littérale plus large.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La petites capitales reproduisent la convention française courante pour le tétragramme divin, sans imposer une vocalisation reconstruite.
theological_decisions:
- issue: Nature du contraste entre les moyens militaires et le nom divin
  choice: « comptent sur » face à « invoquons »
  alternative: « se glorifient de » face à « célébrons / faisons mémoire de »
  rationale: Le texte oppose deux fondements de sécurité, mais les expressions hébraïques restent elliptiques et polysémiques. La traduction principale suit le sens contextuel le plus naturel ; la note conserve l’autre possibilité sans résoudre abusivement la tension.
translation_notes:
  register: Français international moderne, clair et digne. Le redoublement « mais nous, nous » marque naturellement le contraste emphatique de וַאֲנַחְנוּ. « Chars » désigne ici les chars de guerre.
