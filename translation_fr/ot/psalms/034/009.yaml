id: PSA.34.9
reference: Psalms 34:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְר֣אוּ אֶת יְהוָ֣ה קְדֹשָׁ֑י/ו כִּי אֵ֥ין מַ֝חְס֗וֹר לִ/ירֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/009.yaml
  text: Fear Yahweh[a], his holy ones[b], for those who fear him lack nothing.
translation:
  language: fr
  text: Craignez Yahweh, vous qui lui êtes consacrés[a], car rien ne manque à ceux qui le craignent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses saints » ou « ses êtres saints ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « ceux qui le craignent ne connaissent aucune privation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְר֣אוּ
  choice: Craignez
  rationale: Impératif masculin pluriel de ירא. « Craignez » conserve le lien lexical avec לִירֵאָיו et la force religieuse de l’exhortation; « révérez » serait possible, mais atténuerait la polysémie de la crainte respectueuse.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה; la translittération « Yahweh » le distingue d’un titre tel que « le Seigneur ».
- source_word: קְדֹשָׁיו
  choice: vous qui lui êtes consacrés
  rationale: Le substantif adjectival pluriel avec suffixe signifie littéralement « ses saints » ou « ses êtres saints ». La formulation retenue exprime naturellement en français l’appartenance et la mise à part, sans suggérer une catégorie canonisée.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’exhortation et « car » rend clairement ce rapport explicatif.
- source_word: אֵין מַחְסוֹר
  choice: rien ne manque
  rationale: Cette tournure idiomatique exprime l’absence de manque ou de privation; « rien ne manque » est direct et naturel en français moderne.
- source_word: לִירֵאָיו
  choice: à ceux qui le craignent
  rationale: Le participe pluriel précédé de ל et muni du suffixe masculin singulier désigne ceux qui craignent Yahweh. La répétition de « craindre » préserve l’écho avec l’impératif initial.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie le tétragramme comme nom propre. « Yahweh » préserve cette fonction sans le remplacer par un titre.
- issue: Identité des קְדֹשָׁיו
  choice: vous qui lui êtes consacrés
  alternative: ses saints
  rationale: Le terme peut désigner les membres du peuple mis à part pour Dieu. Le rendu choisi conserve cette idée de consécration sans importer la notion plus tardive de saints officiellement reconnus.
- issue: Portée de l’absence de manque
  choice: rien ne manque
  alternative: ils ne connaissent aucune privation
  rationale: L’énoncé général est maintenu sans préciser de lui-même s’il vise tous les désirs ou ce qui est nécessaire; cette tension sapientielle ne doit pas être résolue par un ajout.
translation_notes:
  register: Français international moderne, digne et accessible. La structure exhortation-motif et la répétition de « craindre » sont conservées. « Consacrés » évite l’ambiguïté contemporaine de « saints » tout en restant proche de l’idée hébraïque de mise à part.
