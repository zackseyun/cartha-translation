source:
  edition: WLC
  text: כְּ֭פִירִים רָשׁ֣וּ וְ/רָעֵ֑בוּ וְ/דֹרְשֵׁ֥י יְ֝הוָ֗ה לֹא יַחְסְר֥וּ כָל טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/010.yaml
  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: fr
  text: Les jeunes lions sont dans le besoin et ont faim[a], mais ceux qui cherchent Yahweh ne manquent de rien de bon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « deviennent pauvres et ont faim ». Le verbe hébreu peut exprimer le fait d’être dans le besoin ou de devenir pauvre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפִירִים
  choice: Les jeunes lions
  rationale: Le nom désigne de jeunes lions vigoureux, et non simplement des lionceaux; l’image souligne que même de puissants prédateurs peuvent manquer de nourriture.
- source_word: רָשׁוּ
  choice: connaissent la disette
  rationale: Le verbe exprime l’indigence ou le manque. « Connaissent la disette » convient au registre poétique et demeure distinct de la faim mentionnée ensuite.
- source_word: וְרָעֵבוּ
  choice: et la faim
  rationale: Le verbe signifie avoir faim. Cette formulation concise forme avec « connaissent » une coordination naturelle en français.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: mais ceux qui cherchent Yahweh
  rationale: Le participe désigne ceux qui se caractérisent par leur recherche de Yahweh; la tournure est naturelle et préserve le sens religieux sans le préciser excessivement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre de substitution.
- source_word: לֹא יַחְסְרוּ
  choice: ne manquent
  rationale: L’imparfait hébreu énonce ici une vérité générale ou une assurance proverbiale; le présent français restitue naturellement cette valeur.
- source_word: כָל טוֹב
  choice: d’aucun bien
  rationale: L’expression peut signifier tout bien ou quelque chose de bon. Dans une proposition négative, « aucun bien » rend sobrement sa portée globale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le nom divin; « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Portée de la promesse « ne manquent d’aucun bien »
  choice: Conserver l’énoncé général sans explicitation
  alternative: Préciser qu’il s’agit seulement de ce que Dieu juge bon ou des besoins spirituels
  rationale: Le texte affirme largement « aucun bien » sans définir ici la nature de ce bien; une précision doctrinale réduirait une tension présente dans le verset.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Disette » garde la distinction entre indigence et faim tout en restant intelligible; la phrase conserve le contraste net de l’hébreu.
