source:
  edition: WLC
  text: מִֽי הָ֭/אִישׁ הֶ/חָפֵ֣ץ חַיִּ֑ים אֹהֵ֥ב יָ֝מִ֗ים לִ/רְא֥וֹת טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: fr
  text: Qui est l’homme[a] qui prend plaisir à la vie, qui aime les jours afin de voir le bien[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la personne » ou « quiconque » ; l’hébreu dit littéralement « l’homme » au sens représentatif.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin de connaître le bonheur » ou « afin de faire l’expérience du bien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Qui est l’homme
  rationale: L’interrogatif ouvre une question rhétorique. « L’homme » conserve le masculin singulier représentatif de l’hébreu, avec une note précisant sa portée générique.
- source_word: הֶחָפֵץ
  choice: qui prend plaisir à
  rationale: Le verbe חפץ exprime un désir favorable pouvant aller jusqu’au plaisir pris à une chose. Cette formulation restitue cette nuance sans réduire le sens à un simple souhait.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le nom soit morphologiquement pluriel en hébreu, il désigne idiomatiquement la vie.
- source_word: אֹהֵב יָמִים
  choice: qui aime les jours
  rationale: La formulation conserve le parallélisme et l’expression ouverte de l’hébreu, sans ajouter l’idée de « longs » jours, absente du texte source.
- source_word: לִרְאוֹת טוֹב
  choice: afin de voir le bien
  rationale: « Voir » est l’équivalent direct de ראה et « le bien » préserve l’étendue sémantique de טוֹב. Une note signale le sens idiomatique possible, « connaître le bonheur ».
theological_decisions:
- issue: Masculin singulier à portée générique
  choice: l’homme
  alternative: la personne ; quiconque
  rationale: Le texte hébreu emploie un nom masculin singulier défini, mais la question de sagesse vise toute personne. Le texte principal maintient la forme source et la note en explicite la portée représentative.
- issue: Portée de « voir le bien »
  choice: voir le bien
  alternative: connaître le bonheur
  rationale: La traduction principale garde l’expression hébraïque ouverte, qui peut évoquer l’expérience du bonheur ou de ce qui est bon sans la limiter à la prospérité matérielle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve volontairement le parallélisme poétique et l’expression inhabituelle « aimer les jours », sans introduire « de longs jours », qui ne figure pas dans l’hébreu.
