source:
  edition: WLC
  text: קָר֣וֹב יְ֭הוָה לְ/נִשְׁבְּרֵי לֵ֑ב וְֽ/אֶת דַּכְּאֵי ר֥וּחַ יוֹשִֽׁיעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/018.yaml
  text: Yahweh is near to the brokenhearted[a], and he saves those crushed in spirit.
translation:
  language: fr
  text: Yahweh est proche de ceux qui ont le cœur brisé, et il sauve ceux dont l’esprit est accablé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui ont l’esprit contrit ». L’hébreu peut désigner des personnes intérieurement écrasées ou humiliées.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: est proche
  rationale: L’adjectif prédicatif exprime la proximité, à la fois relationnelle et imagée; « est proche » est naturel en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: de ceux qui ont le cœur brisé
  rationale: Cette formulation idiomatique conserve l’image hébraïque d’un cœur brisé et exprime une profonde détresse intérieure.
- source_word: דַּכְּאֵי רוּחַ
  choice: ceux dont l’esprit est accablé
  rationale: דכא évoque une personne écrasée ou abattue; « accablé » restitue cette intensité sans imposer un sens exclusivement pénitentiel.
- source_word: יוֹשִׁיעַ
  choice: il sauve
  rationale: Le hifil de ישׁע signifie sauver ou délivrer; « sauve » conserve le vocabulaire biblique du salut tout en convenant au secours évoqué ici.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le tétragramme comme nom propre; la translittération préserve ce nom au lieu de lui substituer un titre.
- issue: Nuance de דַּכְּאֵי רוּחַ
  choice: ceux dont l’esprit est accablé
  alternative: ceux qui ont l’esprit contrit; ceux dont l’esprit est écrasé
  rationale: L’hébreu peut évoquer l’écrasement intérieur ou l’humiliation. Le contexte ne requiert pas de limiter le sens à la repentance; la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, avec des tournures immédiatement compréhensibles.
