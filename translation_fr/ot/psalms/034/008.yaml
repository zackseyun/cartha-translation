id: PSA.34.8
reference: Psalms 34:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: fr
  text: Goûtez et voyez combien Yahweh est bon ! Heureux l’homme qui trouve refuge en lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « l’homme » ; le masculin singulier a ici une portée représentative et concerne toute personne qui trouve refuge en Yahweh.
    reason: Préciser la portée générique du masculin hébreu sans effacer sa forme dans le texte principal.
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Goûtez
  rationale: L’impératif pluriel signifie littéralement « goûtez ». Le verbe concret préserve l’image sensorielle et sa portée expérientielle.
- source_word: וּרְאוּ
  choice: et voyez
  rationale: L’impératif pluriel conserve le parallélisme sensoriel avec « goûtez » tout en permettant le sens figuré de constater par expérience.
- source_word: כִּי טוֹב
  choice: combien … est bon
  rationale: Dans cette exhortation poétique, « combien » exprime naturellement en français le contenu et la constatation émerveillée introduits par כִּי, sans réduire טוֹב à la seule idée d’agrément.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Formule de béatitude indiquant la condition enviable et florissante de la personne concernée ; « Heureux » est idiomatique, digne et traditionnel en français.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom hébreu est masculin singulier et désigne ici un homme avec une portée représentative ; la note explicite cette portée.
- source_word: יֶחֱסֶה בּוֹ
  choice: qui trouve refuge en lui
  rationale: Cette formulation conserve l’image protectrice du verbe חסה et rend naturellement en français la relation exprimée par la préposition et le pronom.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; sa translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Portée du masculin singulier הַגֶּבֶר
  choice: l’homme, avec note sur sa portée représentative
  alternative: la personne / quiconque
  rationale: Le texte principal conserve la forme masculine singulière de l’hébreu, tandis que la note évite de restreindre indûment la béatitude aux seuls hommes.
- issue: Valeur de כִּי après les impératifs
  choice: combien
  alternative: que / car
  rationale: La tournure française « voyez combien » présente naturellement ce qui doit être constaté par expérience. « Car » ferait plutôt de la proposition une justification, possibilité grammaticale moins adaptée ici au mouvement exhortatif.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs conservent l’image sensorielle centrale ; « trouve refuge » maintient la métaphore de protection. La ponctuation met en relief l’exhortation et la béatitude.
