  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: fr
  text: J’ai cherché Yahweh, et il m’a répondu ; il m’a délivré de toutes mes frayeurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tout ce que je redoutais » ou « de toutes mes terreurs ».
    reason: Le nom מְגוּרוֹת peut désigner les frayeurs ressenties, les réalités redoutées ou des terreurs ; le contexte ne permet pas de trancher entièrement entre ces nuances.
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: J’ai cherché
  rationale: Le verbe דרשׁ exprime ici le fait de rechercher Yahweh en se tournant vers lui dans la prière et la dépendance. « J’ai cherché » reste proche de l’hébreu tout en étant clair en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: וְעָנָנִי
  choice: et il m’a répondu
  rationale: Le verbe ענה accompagné du suffixe de première personne signifie naturellement « il m’a répondu » ; le sujet renvoie à Yahweh.
- source_word: מִכָּל
  choice: de toutes
  rationale: La combinaison מן avec כל exprime une délivrance complète à l’égard de l’ensemble des réalités désignées.
- source_word: מְגוּרוֹתַי
  choice: mes frayeurs
  rationale: Dans ce contexte, מְגוּרוֹת désigne des causes ou des expériences de peur. « Mes frayeurs » rend ce sens sans décider si l’accent porte sur le sentiment éprouvé ou sur ce qui inspirait la peur.
- source_word: הִצִּילָנִי
  choice: il m’a délivré
  rationale: Le hiphil de נצל signifie arracher au danger ou délivrer. « Il m’a délivré » conserve la portée générale du terme sans la limiter à un sauvetage physique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La transcription « Yahweh » préserve le nom personnel sans lui substituer un titre.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation conserve les deux membres du témoignage poétique. Le marqueur de note est placé après « frayeurs », terme auquel la variante lexicale se rapporte.
