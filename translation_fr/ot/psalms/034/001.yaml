lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Je bénirai
  rationale: La forme préfixée à la première personne, munie d’un hé paragogique, exprime ici une résolution durable. Le futur français rend naturellement cet engagement de louange.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle représente directement le nom divin YHWH au lieu de lui substituer un titre.
- source_word: בְּכָל עֵת
  choice: en tout temps
  rationale: Expression française naturelle qui conserve l’idée hébraïque d’une louange à chaque moment, sans exception.
- source_word: תָּמִיד
  choice: sans cesse
  rationale: Rend l’idée de continuité tout en évitant une répétition lourde de « en tout temps ».
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: Conserve la formulation concise de l’hébreu ; il s’agit de la louange dont Dieu est l’objet.
- source_word: בְּפִי
  choice: dans ma bouche
  rationale: Reproduit l’image corporelle concrète de l’hébreu et demeure compréhensible en français actuel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre YHWH. Le rendre par « Yahvé » préserve ce nom plutôt que de le remplacer silencieusement par un titre ; une note signale la forme hébraïque et l’autre transcription courante.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique est maintenu, avec « en tout temps » puis « sans cesse ». Le concret « dans ma bouche » est conservé plutôt que remplacé par « sur mes lèvres ».
