id: PSA.34.7
reference: Psalms 34:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֹנֶ֤ה מַלְאַךְ יְהוָ֓ה סָ֘בִ֤יב לִֽ/ירֵאָ֗י/ו וַֽ/יְחַלְּצֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: fr
  text: L’ange de Yahweh campe autour de ceux qui le craignent[a], et il les délivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le messager de Yahweh ». Le mot hébreu מַלְאַךְ peut signifier « messager » ou « ange », bien qu’ici le sens « ange » soit le plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: campe
  rationale: Le participe qal de חנה exprime l’action de camper. « Campe » est naturel en français et conserve l’image concrète d’une présence protectrice.
- source_word: מַלְאַךְ יְהוָה
  choice: l’ange de Yahweh
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste, mais dans cette construction le sens « ange » est le plus probable. La traduction ne précise pas davantage son identité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: סָבִיב
  choice: autour de
  rationale: Cette expression rend simplement la position environnante et maintient l’image spatiale de protection.
- source_word: לִירֵאָיו
  choice: ceux qui le craignent
  rationale: Cette formulation idiomatique conserve le langage biblique de la crainte de Dieu, qui peut inclure respect, révérence et obéissance sans être réduit à l’un de ces aspects.
- source_word: וַיְחַלְּצֵם
  choice: et il les délivre
  rationale: Dans ce contexte, חלץ signifie arracher au danger ou délivrer. « Délivre » est clair et digne, tout en prolongeant l’image protectrice.
theological_decisions:
- issue: Sens et identité de מַלְאַךְ יְהוָה
  choice: « l’ange de Yahweh », sans préciser son identité
  alternative: « le messager de Yahweh » ou identification explicite à une manifestation divine ou christophanique
  rationale: Le contexte favorise « ange », mais le verset lui-même ne définit pas précisément l’identité de cette figure. La traduction préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent « campe » restitue le participe hébreu et son image protectrice; « craignent » maintient volontairement la portée révérencielle et covenantale du texte.
