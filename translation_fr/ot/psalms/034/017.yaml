source:
  edition: WLC
  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: fr
  text: Ils ont crié, et Yahvé[a] a entendu ; il les a délivrés de toutes leurs détresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le Seigneur ».'
    reason: Signaler la forme du texte source et l’usage traditionnel concurrent.
lexical_decisions:
- source_word: צָעֲקוּ
  choice: Ils ont crié
  rationale: Le qal accompli, troisième personne du pluriel, exprime ici un cri pressant lancé dans la détresse. « Ils ont crié » est naturel en français et conserve la force du verbe sans ajouter un complément absent de l’hébreu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par le titre traditionnel « le Seigneur ». « Yahvé » est la forme française courante du nom divin.
- source_word: שָׁמֵעַ
  choice: a entendu
  rationale: 'Bien qu’il s’agisse morphologiquement d’un participe, sa place dans cette séquence poétique entre des formes accomplies favorise une valeur passée : Yahvé répond au cri qui vient d’être poussé.'
- source_word: מִכָּל
  choice: de toutes
  rationale: La préposition מִן jointe à כָּל indique que la délivrance s’étend à l’ensemble des situations pénibles évoquées.
- source_word: צָרוֹתָם
  choice: leurs détresses
  rationale: « Détresses » rend la gravité de צָרוֹת et convient au contexte d’un appel urgent au secours, tout en restant intelligible en français moderne.
- source_word: הִצִּילָם
  choice: il les a délivrés
  rationale: Le hiphil de נצל désigne l’action d’arracher quelqu’un au danger ou de l’en délivrer. « Délivrés » conserve cette amplitude sans préciser un moyen absent du texte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: L’hébreu emploie directement le tétragramme. Le rendre comme nom propre préserve cette donnée du texte, tandis que « le Seigneur » lui substituerait un titre.
translation_notes:
  register: 'Français international moderne, sobre et digne. La coordination et le passé composé rendent clairement la progression poétique : cri, écoute, délivrance. Le pronom « ils » conserve le sujet pluriel implicite dans les formes verbales hébraïques sans l’identifier davantage.'
