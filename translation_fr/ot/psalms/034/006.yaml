  text: זֶ֤ה עָנִ֣י קָ֭רָא וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗י/ו הוֹשִׁיעֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/006.yaml
  text: This poor man cried out[a], and Yahweh heard[b], and saved him from all his troubles.
translation:
  language: fr
  text: Ce pauvre a crié[a] ; Yahweh l’a entendu et l’a sauvé[b] de toutes ses détresses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet homme affligé » ou « cet humble ». Le terme hébreu peut désigner la pauvreté, l’affliction ou une humble condition.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’a délivré » ou « l’a secouru ». Le verbe désigne le fait de sauver d’un danger ou d’une détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עָנִי
  choice: Cet homme affligé
  rationale: Le démonstratif désigne ici l’individu qui témoigne. עָנִי peut évoquer la pauvreté, l’affliction ou l’humble condition ; « homme affligé » convient au contexte immédiat de détresse et conserve le masculin singulier.
- source_word: קָרָא
  choice: a crié
  rationale: Dans ce contexte d’appel pressant suivi de l’écoute et du secours divins, « a crié » exprime naturellement l’urgence sans ajouter explicitement un complément absent de l’hébreu.
- source_word: יהוה
  choice: Yahweh
  rationale: Le nom divin est rendu comme un nom propre, conformément à sa présence explicite dans le texte hébreu.
- source_word: שָׁמֵעַ
  choice: a entendu
  rationale: Le parfait décrit l’intervention passée de Yahweh dans ce témoignage ; « a entendu » reste proche de la forme et du sens hébreux.
- source_word: צָרוֹתָיו
  choice: ses détresses
  rationale: Le pluriel צָרוֹת désigne les situations d’angoisse ou d’adversité. « Détresses » garde la force du terme et convient au registre poétique.
- source_word: הוֹשִׁיעוֹ
  choice: l’a sauvé
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer d’un danger. « Sauvé » conserve le vocabulaire biblique du salut tout en désignant ici un secours concret.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » le distingue du titre אֲדֹנָי et préserve sa fonction de nom propre.
- issue: Portée du masculin singulier עָנִי
  choice: cet homme affligé
  alternative: ce pauvre / cette personne affligée
  rationale: La forme hébraïque est masculine singulière et renvoie d’abord au psalmiste, tout en pouvant avoir une valeur représentative. Le texte conserve cette forme sans exclure sa portée générale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure testimoniale de l’hébreu et évite d’expliciter ce que le texte laisse implicite.
