  text: Préserve ta langue du mal, et tes lèvres des paroles trompeuses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְצֹר
  choice: Préserve
  rationale: L’impératif de נצר exprime l’idée de garder ou de préserver. « Préserve » s’emploie naturellement avec « ta langue de » et conserve l’exhortation à maîtriser sa parole.
- source_word: לְשׁוֹנְךָ
  choice: ta langue
  rationale: La traduction concrète garde l’image poétique hébraïque, immédiatement compréhensible en français comme désignation de la parole.
- source_word: מֵרָע
  choice: du mal
  rationale: רַע possède ici une portée morale; « du mal » la conserve sans réduire le sens au seul dommage causé.
- source_word: וּשְׂפָתֶיךָ
  choice: et tes lèvres
  rationale: La formulation littérale maintient le parallélisme corporel et poétique entre la langue et les lèvres.
- source_word: מִדַּבֵּר מִרְמָה
  choice: des paroles trompeuses
  rationale: Cette formulation française naturelle rend l’action de parler avec tromperie tout en évitant la tournure moins idiomatique « de parler tromperie ».
