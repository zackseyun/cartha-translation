id: PSA.34.19
reference: Psalms 34:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: fr
  text: Nombreux sont les malheurs[a] du juste[b], mais Yahweh le délivre de tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les maux » ou « les épreuves ». Le mot hébreu peut désigner des maux, des détresses ou des calamités; ici, il s’agit de ce qui atteint le juste.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie le masculin singulier « le juste », qui peut représenter toute personne juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Nombreux sont
  rationale: L’adjectif prédicatif placé en tête met l’accent sur le grand nombre; cette tournure reproduit naturellement cette emphase en français.
- source_word: רָעוֹת
  choice: les malheurs
  rationale: Dans ce contexte, le mot désigne les épreuves et calamités qui atteignent le juste, plutôt qu’un mal moral qu’il commet.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif substantivé masculin singulier désigne ici, de manière représentative, la personne juste; « le juste » est une formulation française naturelle et formellement proche.
- source_word: וּמִכֻּלָּם
  choice: mais ... de tous
  rationale: Le contexte donne à la conjonction une valeur contrastive. « De tous » conserve la portée exhaustive de כֻּלָּם et renvoie aux malheurs.
- source_word: יַצִּילֶנּוּ
  choice: le délivre
  rationale: Le hiphil de נצל exprime l’action de délivrer ou de sauver d’un danger; « le délivre » convient au registre du psaume.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel du texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Valeur représentative du masculin singulier צַדִּיק
  choice: du juste
  alternative: de la personne juste
  rationale: Le texte hébreu emploie un masculin singulier qui peut représenter toute personne juste. La traduction conserve cette forme sans limiter explicitement l’énoncé aux hommes.
- issue: Sens de רָעוֹת appliqué à ce qui atteint le juste
  choice: les malheurs
  alternative: les maux
  rationale: « Malheurs » exprime ici les adversités subies, sans effacer la gamme sémantique du terme hébreu ni suggérer que le juste commet ces maux.
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom divin; le conserver sous la forme « Yahweh » distingue le nom propre d’un titre.
translation_notes:
  register: Français international moderne, sobre et poétique. L’inversion « Nombreux sont » garde l’emphase initiale de l’hébreu, tandis que « mais » rend le contraste implicite entre la multitude des malheurs et la délivrance complète accordée par Yahweh.
