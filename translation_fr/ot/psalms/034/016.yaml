source:
  edition: WLC
  text: פְּנֵ֣י יְ֭הוָה בְּ/עֹ֣שֵׂי רָ֑ע לְ/הַכְרִ֖ית מֵ/אֶ֣רֶץ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: fr
  text: La face de Yahweh est contre ceux qui font le mal, pour effacer leur souvenir de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays » plutôt que « de la terre », si le propos est compris dans un sens plus local.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: La face de
  rationale: Conserve l’image anthropomorphique concrète de l’hébreu. Ici, la « face » exprime la présence personnelle de Yahweh tournée contre les malfaiteurs.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: בְּעֹשֵׂי רָע
  choice: contre ceux qui font le mal
  rationale: Dans ce contexte, la préposition marque une orientation hostile. La formulation garde la valeur participiale et reste naturelle en français moderne.
- source_word: לְהַכְרִית
  choice: afin d’effacer
  rationale: L’infinitif exprime ici le but de l’opposition divine. Avec « souvenir », « effacer » rend naturellement l’idée forte de retrancher ou faire disparaître.
- source_word: מֵאֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un pays. Le contexte sapientiel et général favorise « la terre », sans exclure l’autre possibilité.
- source_word: זִכְרָם
  choice: jusqu’à leur souvenir
  rationale: Le nom désigne leur mémoire ou souvenir parmi les vivants. « Jusqu’à » explicite idiomatiquement l’étendue radicale de l’effacement sans ajouter une nouvelle entité au texte.
theological_decisions:
- issue: L’expression « face de Yahweh » comme image de l’opposition divine
  choice: Conserver l’expression concrète « La face de Yahweh est contre… »
  alternative: 'Rendre plus abstraitement : « Yahweh s’oppose à… » ou « La présence de Yahweh est contre… »'
  rationale: La formulation retenue préserve l’image poétique et la force théologique du texte sans imposer une compréhension corporelle de Dieu.
- issue: Portée de אֶרֶץ
  choice: la terre
  alternative: le pays
  rationale: Le verset formule le sort général de ceux qui font le mal ; « terre » convient à cette portée, tout en signalant en note l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et poétique. L’image hébraïque de la « face » est conservée, tandis que « afin d’effacer… jusqu’à leur souvenir » offre une formulation idiomatique et forte.
