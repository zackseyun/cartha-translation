review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux termes sont bien rendus : « la face de Yahweh » préserve פְּנֵי יְהוָה, « contre ceux qui font le mal » exprime correctement l’orientation hostile de בְּעֹשֵׂי רָע, et « la terre » convient au sens général probable de מֵאֶרֶץ. Toutefois, « jusqu’à leur souvenir » ne correspond pas à une construction présente dans l’hébreu : זִכְרָם est directement l’objet de l’infinitif « retrancher / faire disparaître ».'
  naturalness: « Afin d’effacer de la terre jusqu’à leur souvenir » est maladroit et obscur en français moderne, notamment parce que « jusqu’à » donne l’impression d’une gradation ajoutée. « Pour effacer leur souvenir de la terre » est naturel, poétique et précis.
  terminology: « Yahweh » respecte le choix de translittération. « Face » conserve volontairement l’image anthropomorphique du texte. « Souvenir » rend bien זִכְרָם dans ce contexte; « effacer » exprime de façon idiomatique l’effet visé par לְהַכְרִית sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Ajout implicite et syntaxe fautive dans « jusqu’à leur souvenir »
    rationale: Le texte hébreu dit littéralement qu’il s’agit de retrancher « leur souvenir » de la terre; il ne contient aucun équivalent de « jusqu’à ». Cette expression alourdit et brouille le rapport entre l’action et son objet.
  revised_text: La face de Yahweh est contre ceux qui font le mal, pour effacer leur souvenir de la terre.[a]
  revised_footnotes:
  - marker: a
    text: Ou « du pays » plutôt que « de la terre », si le propos est compris dans un sens plus local.
    reason: lexical_alternative
