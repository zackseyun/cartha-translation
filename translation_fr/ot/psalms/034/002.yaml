source:
  edition: WLC
  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: fr
  text: En Yahweh, mon âme se glorifiera ; les humbles[a] entendront et se réjouiront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les affligés » ou « les doux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: En Yahweh
  rationale: La préposition בְּ situe en Yahweh le fondement et l’objet de cette fierté. « En Yahweh » conserve la formulation concise et poétique de l’hébreu.
- source_word: תִּתְהַלֵּל
  choice: se glorifiera
  rationale: Le hitpael de הלל exprime ici le fait de tirer gloire ou fierté de quelqu’un. « Se glorifiera » préserve cette valeur sans réduire le verbe à « louer ».
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner la personne elle-même, mais « mon âme » conserve l’expression anthropologique et poétique du psaume.
- source_word: יִשְׁמְעוּ
  choice: entendront
  rationale: Le qal inaccompli de שמע signifie simplement « entendre ». L’absence de complément explicite dans la traduction respecte celle du texte hébreu.
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme peut désigner les humbles, les doux ou les affligés. « Les humbles » convient au contexte tout en laissant percevoir une condition d’abaissement.
- source_word: וְיִשְׂמָחוּ
  choice: et se réjouiront
  rationale: שמח exprime la joie. Le futur coordonné maintient le parallélisme avec les deux autres verbes à l’inaccompli.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le nom divin יהוה. La translittération « Yahweh » le distingue d’un titre et préserve sa fonction de nom propre.
- issue: Sens de la fierté exprimée par תִּתְהַלֵּל
  choice: se glorifiera en Yahweh
  alternative: se vantera de Yahweh
  rationale: « Se glorifier en Yahweh » conserve l’idée biblique d’une fierté dont Yahweh est le fondement, sans lui donner nécessairement la connotation négative que « se vanter » possède souvent en français moderne.
translation_notes:
  register: Français international moderne, poétique et digne. L’ordre initial « En Yahweh » garde l’accent porté par l’hébreu sur le nom divin ; « mon âme » préserve l’image originale, et « entendront » reste sans complément ajouté.
