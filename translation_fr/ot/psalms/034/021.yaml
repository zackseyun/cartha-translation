  text: תְּמוֹתֵ֣ת רָשָׁ֣ע רָעָ֑ה וְ/שֹׂנְאֵ֖י צַדִּ֣יק יֶאְשָֽׁמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/021.yaml
  text: Evil will put the wicked to death[a], and those who hate the righteous will be held guilty.
translation:
  language: fr
  text: Le mal fera mourir le méchant[a], et ceux qui haïssent le juste seront tenus pour coupables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le malheur fera périr le méchant. » Le mot hébreu peut désigner le mal, le malheur ou la calamité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: fera mourir
  rationale: Le hifil inaccompli, avec רָעָה comme sujet féminin, exprime la causalité. « Fera mourir » conserve cette valeur tout en restant naturel en français.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé singulier désigne ici une figure représentative; « le méchant » en conserve le caractère générique.
- source_word: רָעָה
  choice: le mal
  rationale: Le nom peut désigner le mal moral, le malheur ou la calamité. « Le mal » préserve la formulation concise, la personnification et la possible double portée du terme.
- source_word: שֹׂנְאֵי
  choice: ceux qui détestent
  rationale: Le participe qal pluriel construit exprime une disposition caractéristique. La proposition relative est idiomatique en français moderne.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé singulier est rendu par la désignation représentative naturelle « le juste », sans préciser le genre au-delà de la forme grammaticale française.
- source_word: יֶאְשָׁמוּ
  choice: seront tenus pour coupables
  rationale: Le qal inaccompli exprime le fait d’encourir la culpabilité ou d’être reconnu passible. Cette formulation conserve la dimension juridique sans expliciter une condamnation particulière.
theological_decisions:
- issue: Faut-il comprendre רָעָה comme le mal moral ou comme le malheur/la calamité ?
  choice: le mal
  alternative: le malheur / la calamité
  rationale: « Le mal » suit de près l’hébreu et maintient l’ironie morale selon laquelle le mal fait périr le méchant. Le sens circonstanciel de malheur ou de calamité reste néanmoins possible et est signalé en note.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme est conservé; « détestent » évite la légère ambiguïté française de « haïssent » à l’oral, tandis que « seront tenus pour coupables » maintient la portée judiciaire du dernier verbe.
