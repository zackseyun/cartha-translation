  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: fr
  text: Les yeux de Yahweh sont tournés vers les justes, et ses oreilles vers leur appel au secours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur cri de détresse ». Le terme hébreu désigne un cri poussé dans la détresse pour demander de l’aide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Les yeux de
  rationale: Rend littéralement le pluriel construit et conserve l’image anthropomorphique de l’attention divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé directement dans le texte hébreu, au lieu de lui substituer un titre.
- source_word: אֶל
  choice: sont tournés vers / vers
  rationale: Exprime l’orientation attentive indiquée par la préposition hébraïque; le verbe est explicité une seule fois en français et reste sous-entendu dans le second membre.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: Équivalent français courant de l’adjectif pluriel substantivé, qui conserve sa portée morale et relationnelle.
- source_word: וְאָזְנָיו
  choice: et ses oreilles
  rationale: Conserve le pluriel et le parallélisme anthropomorphique avec « les yeux ».
- source_word: שַׁוְעָתָם
  choice: leur appel au secours
  rationale: Le nom désigne un cri ou un appel poussé dans la détresse afin d’obtenir de l’aide; cette formulation est claire et naturelle en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre; « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Langage anthropomorphique concernant la perception divine
  choice: Conserver littéralement « les yeux » et « les oreilles »
  alternative: Interpréter par « Yahweh veille sur » ou « Yahweh écoute »
  rationale: Les images concrètes appartiennent à la poésie du verset et expriment l’attention de Dieu; les préserver évite de réduire leur force ou d’imposer une paraphrase.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle du vers hébreu et ses images corporelles sont conservées; la copule absente en hébreu est explicitée de façon idiomatique en français.
