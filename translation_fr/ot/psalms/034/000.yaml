source:
  edition: WLC
  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: fr
  text: De David[a]. Lorsqu’il modifia son comportement devant Abimélek, celui-ci le chassa, et David s’en alla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En 1 Samuel 21.10-15, ce roi est appelé Akish ; « Abimélek » peut être ici un autre nom ou un titre royal.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres des psaumes peut indiquer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve cette amplitude mieux que « Par David » ou « Pour David ».
- source_word: בְּשַׁנּוֹתוֹ
  choice: Lorsqu’il modifia
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle. « Lorsqu’il modifia » est naturel et rend l’idée d’un changement intentionnel.
- source_word: טַעְמוֹ
  choice: son comportement
  rationale: Le nom peut désigner le goût, le discernement ou le bon sens ; dans ce contexte, il renvoie à l’attitude extérieure adoptée par David. « Comportement » rend l’idiome sans imposer le terme clinique « santé mentale ».
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: devant Abimélek
  rationale: Traduction directe et idiomatique de la locution signifiant « en présence de ».
- source_word: וַיְגָרֲשֵׁהוּ
  choice: celui-ci le chassa
  rationale: Le verbe signifie chasser ou expulser. « Celui-ci » identifie clairement Abimélek comme sujet sans ajouter une relation de but ou de conséquence absente de la simple coordination hébraïque.
- source_word: וַיֵּלַךְ
  choice: David s’en alla
  rationale: Le verbe signifie simplement « aller ». La répétition du nom lève l’ambiguïté pronominale naturelle en français et précise que David est celui qui part.
- source_word: אֲבִימֶלֶךְ
  choice: Abimélek
  rationale: Le texte hébreu porte ce nom. Il est conservé dans le texte principal plutôt que remplacé par Akish ; le rapprochement historique est signalé en note.
theological_decisions:
- issue: Identification historique d’Abimélek
  choice: Conserver « Abimélek » dans le texte principal.
  alternative: Comprendre « Abimélek » comme un autre nom ou un titre royal d’Akish de Gath.
  rationale: La priorité donnée au texte hébreu exige de ne pas harmoniser silencieusement ce titre avec 1 Samuel 21. La tension historique est conservée et documentée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le titre conserve la concision de l’hébreu. Les référents des pronoms sont explicités uniquement pour éviter une ambiguïté peu naturelle en français.
