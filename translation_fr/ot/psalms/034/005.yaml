  text: They looked to him and were radiant[b][a], and their faces were not put to shame.
translation:
  language: fr
  text: Ils ont regardé vers lui[a] et sont devenus rayonnants[b] ; leurs visages ne seront pas couverts de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La tradition hébraïque présente ici deux lectures : « vers lui » et « vers moi ». Le texte principal suit « vers lui », qui convient au contexte ; « vers moi » est une variante conservée.'
    reason: textual_variant
  - marker: b
    text: Ou « ont brillé ». Le verbe hébreu peut exprimer ici l’éclat ou le rayonnement.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: ont tourné les regards
  rationale: Le hiphil de נבט exprime ici le fait de regarder en direction de quelqu’un. Cette tournure française est naturelle, poétique et conserve l’orientation marquée par אֵלָיו.
- source_word: אֵלָי/ו
  choice: vers lui
  rationale: La tradition de lecture portée par le qeré אֵלָיו donne « vers lui », ce qui convient au contexte où des personnes se tournent vers le Seigneur. La forme « vers moi » du texte consonantique est conservée en note.
- source_word: וְנָהָרוּ
  choice: sont devenus rayonnants
  rationale: Dans ce parallélisme avec le visage et la honte, le verbe évoque l’éclat ou la lumière plutôt que l’écoulement. « Sont devenus rayonnants » restitue la transformation exprimée, sans supprimer l’alternative lexicale.
- source_word: וּפְנֵיהֶם
  choice: leur visage
  rationale: Le français emploie naturellement le singulier distributif pour une partie du corps possédée par chacun, tout en conservant l’image concrète des visages hébreux.
- source_word: אַל יֶחְפָּרוּ
  choice: n’a pas été couvert de honte
  rationale: Dans ce contexte poétique, אַל avec l’inaccompli exprime une issue négative plutôt qu’une interdiction. La formulation conserve la dimension visible et sociale de la honte et s’accorde avec le singulier distributif « leur visage ».
theological_decisions:
- issue: Variante de lecture אֵלָי/ו
  choice: vers lui
  alternative: vers moi
  rationale: Le qeré « vers lui » s’intègre au mouvement du psaume, où le locuteur invite à regarder vers le Seigneur. Le ketiv « vers moi » modifie toutefois la perspective du locuteur et constitue une variante authentique ; elle est donc signalée sans être harmonisée.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé composé rend naturellement les formes verbales dans une narration poétique. Le singulier distributif « leur visage » est idiomatique en français ; le point-virgule maintient le parallélisme hébreu.
