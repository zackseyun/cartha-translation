    rationale: אַל יֶחְפָּרוּ contient un inaccompli négatif ; « n’a pas été couvert » le rend comme un événement passé achevé. « Ne seront pas couverts de honte » préserve mieux l’orientation non accomplie du verbe sans prétendre trancher davantage sa nuance.
  - severity: low
    issue: Singulier « leur visage »
    rationale: Le singulier distributif est possible en français, mais le pluriel explicite de וּפְנֵיהֶם est naturel et conserve plus directement l’imagerie du texte.
  - severity: low
    issue: Tournure « ont tourné les regards »
    rationale: La tournure est compréhensible mais moins fluide que « ont regardé vers », qui rend directement הִבִּיטוּ אֵלָיו.
