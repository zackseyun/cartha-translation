source:
  edition: WLC
  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: fr
  text: Yahweh rachète la vie de ses serviteurs[a], et aucun de ceux qui trouvent refuge en lui ne sera tenu pour coupable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’âme » pour « la vie » (hébreu : néfèsh), c’est-à-dire l’être vivant lui-même.'
    reason: lexical_alternative
  - marker: b
    text: Ou « n’encourra aucune culpabilité » ou « ne sera pas condamné ». Le verbe hébreu appartient au vocabulaire judiciaire de la culpabilité.
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: rachète
  rationale: Le participe de פדה exprime le rachat ou la délivrance. « Rachète » conserve à la fois l’idée de délivrance et la portée rédemptrice du terme.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: נֶפֶשׁ
  choice: la vie
  rationale: Dans ce contexte, נֶפֶשׁ désigne naturellement la vie ou l’être vivant tout entier; « la vie » évite de limiter le sens à une composante immatérielle.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans le contexte du psaume, « serviteurs » rend naturellement עבד sans mettre au premier plan la condition servile.
- source_word: יֶאְשְׁמוּ
  choice: ne sera tenu pour coupable
  rationale: Le verbe אשם relève du champ de la culpabilité et de la responsabilité judiciaire. Cette formulation en conserve la force sans imposer l’idée plus étroite d’une condamnation finale.
- source_word: הַחֹסִים בּוֹ
  choice: ceux qui trouvent refuge en lui
  rationale: חסה évoque le fait de chercher ou de trouver un abri. Cette expression préserve l’image concrète du refuge qui traverse le psaume.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans un contexte de salut
  choice: « la vie »
  alternative: « l’âme »
  rationale: Le terme hébreu peut désigner l’être vivant tout entier ou sa vie; le contexte ne requiert pas une anthropologie opposant l’âme au corps.
- issue: Force de יֶאְשְׁמוּ
  choice: « ne sera tenu pour coupable »
  alternative: « ne sera pas condamné » ou « n’encourra aucune culpabilité »
  rationale: La formulation choisie maintient la dimension judiciaire du verbe tout en évitant de préciser au-delà du texte la nature ou le moment du jugement.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé; « trouvent refuge » rend l’image hébraïque de manière idiomatique, tandis que les notes signalent les principales ambiguïtés lexicales et judiciaires.
