source:
  edition: WLC
  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: fr
  text: Venez, enfants, écoutez-moi ; je vous enseignerai la crainte de Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « crainte de Yahweh » est une expression caractéristique de la littérature de sagesse. Elle comprend le respect révérencieux, l’obéissance et la juste crainte devant Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Venez
  rationale: Bien qu’issu du verbe « aller, marcher », l’impératif sert ici d’invitation adressée directement aux auditeurs ; « Venez » est l’équivalent idiomatique naturel en français.
- source_word: בָנִים
  choice: mes enfants
  rationale: Le nom signifie littéralement « fils », mais, dans le cadre de l’enseignement sapientiel, il désigne les élèves auxquels le maître s’adresse. « Mes enfants » restitue naturellement ce ton pédagogique sans limiter explicitement l’adresse aux hommes.
- source_word: שִׁמְעוּ לִי
  choice: écoutez-moi
  rationale: La construction appelle à prêter une attention obéissante, et non simplement à percevoir des sons ; « écoutez-moi » rend cette exhortation en français courant.
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  rationale: « Crainte » conserve toute l’étendue et la tension de cette expression sapientielle, qui comprend respect révérencieux, obéissance et juste effroi devant Dieu, sans la réduire à la seule « révérence ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » préserve le nom divin personnel exprimé par le tétragramme.
- source_word: אֲלַמֶּדְכֶם
  choice: je vous enseignerai
  rationale: L’imparfait piel exprime ici naturellement l’intention du locuteur à la suite de l’invitation ; le futur français convient à cette promesse d’enseignement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme ; « Yahweh » maintient le nom d’alliance au lieu de le remplacer par un titre.
- issue: Rendu de יִרְאַת יְהוָה
  choice: la crainte de Yahweh
  alternative: le respect révérencieux envers Yahweh
  rationale: Le mot « crainte » garde la tension théologique et le champ sémantique de l’hébreu, qui ne se limite ni à la terreur ni à la révérence.
- issue: Portée de בָנִים
  choice: mes enfants
  alternative: fils
  rationale: Dans ce discours de sagesse, l’appellation fonctionne comme une adresse du maître à ses élèves. Le français inclusif naturel ne tranche pas en faveur d’un auditoire exclusivement masculin.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement collectif est rendu par « vous ». « Mes enfants » explicite en français le ton affectueux et pédagogique de l’adresse sapientielle, sans alourdir la phrase.
