  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: fr
  text: Proclamez avec moi la grandeur de Yahweh[a] ; ensemble, célébrons son nom !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom propre de Dieu, traditionnellement rendu par « le SEIGNEUR ».'
    reason: Préciser la forme du texte source et signaler le rendu traditionnel.
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Proclamez la grandeur
  rationale: L’impératif pluriel de גדל appelle les auditeurs à reconnaître et à proclamer la grandeur de Dieu. Cette tournure naturelle en français évite l’idée d’un agrandissement littéral que pourrait suggérer « magnifiez ».
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: La préposition ל marque ici l’objet de la louange, et le tétragramme est translittéré « Yahweh » afin de préserver le nom divin présent dans le texte hébreu.
- source_word: אִתִּי
  choice: avec moi
  rationale: La préposition avec suffixe de première personne invite directement la communauté à se joindre au psalmiste.
- source_word: וּנְרוֹמְמָה
  choice: célébrons
  rationale: La forme cohortative à la première personne du pluriel exprime une invitation commune. « Célébrons » restitue idiomatiquement l’idée d’élever ou d’exalter par la louange.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: La traduction littérale demeure naturelle et conserve la portée biblique du nom comme expression de l’identité et de la réputation de Dieu.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe exprime l’action commune et unie ; placé en tête de la seconde proposition, il met cette dimension en relief.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre, tandis que « le SEIGNEUR » reflète la tradition de lecture et de traduction.
- issue: Sens de l’exaltation divine
  choice: Proclamer la grandeur et célébrer
  alternative: Magnifier et exalter
  rationale: Ces formulations décrivent un acte de louange qui reconnaît publiquement la grandeur de Dieu, sans laisser entendre que les humains augmenteraient réellement sa grandeur.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le parallélisme poétique et l’appel collectif sont conservés ; le point d’exclamation rend l’élan exhortatif des deux formes verbales.
