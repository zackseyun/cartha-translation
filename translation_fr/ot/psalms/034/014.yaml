source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֑וֹב בַּקֵּ֖שׁ שָׁל֣וֹם וְ/רָדְפֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/014.yaml
  text: Turn away from evil and do good[a]; seek peace and pursue it.
translation:
  language: fr
  text: Détourne-toi du mal et fais le bien ; recherche la paix[a] et poursuis-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « paix » peut aussi évoquer l’intégrité, l’harmonie ou le bien-être, et pas seulement l’absence de conflit.
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּר
  choice: Détourne-toi
  rationale: L’impératif exprime le fait de se détourner activement ou de s’éloigner. « Détourne-toi » est naturel en français et conserve l’idée d’une réorientation morale.
- source_word: מֵרָע
  choice: du mal
  rationale: Dans cette exhortation de sagesse, רַע désigne principalement le mal moral ; la préposition מִן marque l’éloignement.
- source_word: וַעֲשֵׂה טוֹב
  choice: et fais le bien
  rationale: Cette formulation concise et idiomatique préserve l’opposition directe entre le mal et le bien.
- source_word: בַּקֵּשׁ
  choice: recherche
  rationale: L’impératif intensif évoque une quête résolue. « Recherche » rend cet effort de façon claire et naturelle.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: « Paix » est ici l’équivalent principal le plus naturel, tout en laissant une note signaler le champ sémantique plus large de שָׁלוֹם.
- source_word: וְרָדְפֵהוּ
  choice: et poursuis-la
  rationale: Le verbe רדף évoque une poursuite active et persistante. Le suffixe masculin singulier renvoie à שָׁלוֹם, rendu en français par le féminin « paix », d’où « la ».
