  text: שֹׁמֵ֥ר כָּל עַצְמוֹתָ֑י/ו אַחַ֥ת מֵ֝/הֵ֗נָּה לֹ֣א נִשְׁבָּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/020.yaml
  text: He keeps all his bones[b][a]; not one of them is broken.
translation:
  language: fr
  text: Il veille sur tous ses os[a] ; aucun d’eux n’est brisé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garde » ou « préserve » tous ses os.
    reason: lexical_alternative
  - marker: b
    text: Cette ligne est citée en Jean 19.36 à propos de la crucifixion de Jésus.
    reason: cross_reference
lexical_decisions:
- source_word: שֹׁמֵר
  choice: veille sur
  rationale: Le participe de שׁמר exprime une garde protectrice et continue. « Veille sur » est naturel en français moderne et convient au contexte de la protection divine.
- source_word: כָּל עַצְמוֹתָיו
  choice: tous ses os
  rationale: כָּל désigne ici la totalité, עַצְמוֹת signifie « os », et le suffixe masculin singulier est rendu par « ses ».
- source_word: אַחַת מֵהֵנָּה
  choice: aucun d’eux
  rationale: Littéralement « pas un parmi eux » ; « aucun d’eux » rend naturellement en français la construction partitive et négative, malgré la forme féminine hébraïque accordée avec עֶצֶם.
- source_word: לֹא נִשְׁבָּרָה
  choice: n’est brisé
  rationale: Le parfait nifal de שׁבר signifie « être brisé ». Le présent français exprime ici naturellement la portée générale de l’affirmation poétique.
theological_decisions:
- issue: Référent des suffixes pronominaux au singulier
  choice: Le texte conserve « ses », renvoyant directement au juste qui souffre dans le contexte immédiat du psaume.
  alternative: Identifier explicitement le référent à Jésus à partir de Jean 19.36, ou reformuler par « les os du juste ».
  rationale: L’hébreu emploie le singulier et le contexte immédiat concerne le juste délivré par le Seigneur. La traduction maintient ce sens direct sans exclure l’emploi christologique ultérieur signalé en note.
translation_notes:
  register: Français moderne, international et digne. « Veille sur » exprime clairement la protection sans lourdeur ; la syntaxe reste concise et poétique.
