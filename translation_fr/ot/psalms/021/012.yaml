  yaml_path: translation/ot/psalms/021/012.yaml
  text: For you will make them turn their back[c][b][a]; with your bowstrings you will aim at their faces.
translation:
  language: fr
  text: Car tu leur feras tourner le dos[a] ; avec les cordes de ton arc, tu viseras leurs visages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu les placeras comme une épaule ». L’expression peut évoquer des ennemis qui tournent le dos pour fuir ou qui présentent leur flanc comme cible.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avec tes cordes, tu prépareras [ton tir] contre leurs visages ». L’image hébraïque est condensée ; les cordes sont probablement celles d’un arc.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’assurance exprimée précédemment ; « Car » marque naturellement ce lien en français.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: tu leur feras tourner le dos
  rationale: Littéralement, l’expression évoque le fait de les placer comme une épaule. Le rendu idiomatique exprime vraisemblablement la fuite ou le fait de présenter le dos, sans effacer l’image dans la note.
- source_word: בְּמֵיתָרֶיךָ
  choice: avec les cordes de ton arc
  rationale: מֵיתָר désigne une corde ; dans ce contexte guerrier, il s’agit probablement des cordes de l’arc. Cette formulation est plus claire que le seul mot « cordes ».
- source_word: תְּכוֹנֵן
  choice: tu viseras
  rationale: Le verbe signifie préparer ou disposer ; associé aux cordes de l’arc et à une cible, il décrit naturellement l’action de viser.
- source_word: עַל־פְּנֵיהֶם
  choice: leur visage
  rationale: Le pluriel hébreu פָּנִים désigne la face ou le visage. « Viser leur visage » conserve l’image directe et menaçante du texte.
theological_decisions:
- issue: Rapport entre les deux propositions
  choice: Maintien de la juxtaposition par un point-virgule
  alternative: 'Introduire un rapport temporel ou causal : « quand tu viseras »'
  rationale: L’hébreu juxtapose les propositions sans conjonction exprimant explicitement que la visée provoque la fuite. Le français préserve cette tension au lieu de préciser une relation absente du texte source.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le vers conserve le parallélisme serré et l’image guerrière du texte hébreu ; les ambiguïtés lexicales sont signalées en notes.
