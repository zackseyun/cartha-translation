  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: fr
  text: Car tu fais de lui une bénédiction pour toujours[a] ; tu le combles de joie en ta présence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu fais de lui des bénédictions ». On peut aussi comprendre : « tu répands sur lui des bénédictions pour toujours » ou « tu le rends abondamment béni pour toujours ». L’expression hébraïque peut présenter le roi soit comme bénéficiaire, soit comme incarnation ou source de bénédiction.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication de la louange qui précède.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: tu fais de lui une bénédiction
  rationale: La tournure hébraïque, littéralement « tu fais de lui des bénédictions », est très compacte. Cette formulation française reste naturelle tout en présentant le roi comme l’incarnation ou la source d’une bénédiction durable; l’autre nuance possible est signalée en note.
- source_word: לָעַד
  choice: pour toujours
  rationale: Expression française courante qui rend la durée indéfinie ou perpétuelle.
- source_word: תְּחַדֵּהוּ בְשִׂמְחָה
  choice: tu le combles de joie
  rationale: Rend naturellement la valeur causative du verbe et le complément « de joie », sans la répétition peu idiomatique « tu le réjouis de joie ».
- source_word: אֶת־פָּנֶיךָ
  choice: en ta présence
  rationale: Littéralement lié à la « face » de Dieu, l’hébreu désigne ici le fait de se tenir devant lui et de jouir de sa présence.
theological_decisions:
- issue: Sens de « tu fais de lui des bénédictions »
  choice: Le roi devient une bénédiction, sans préciser la nature matérielle, royale ou messianique de celle-ci.
  alternative: Dieu répand des bénédictions sur le roi et le rend abondamment béni.
  rationale: Le pluriel hébreu et la construction prédicative permettent de comprendre soit que le roi incarne ou transmet la bénédiction, soit qu’il en est le bénéficiaire. Le texte principal adopte une formulation française concise, tandis que la note conserve l’autre lecture et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Tu » est employé conformément à l’adresse directe à Dieu. La tournure du premier membre privilégie la lisibilité, avec une note destinée à préserver l’ambiguïté réelle de l’hébreu.
