  yaml_path: translation/ot/psalms/021/008.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: fr
  text: Ta main atteindra tous tes ennemis[a] ; ta main droite atteindra ceux qui te haïssent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trouvera » ou « rattrapera » ; le verbe hébreu traduit ici par « atteindra » peut, dans ce contexte, évoquer le fait de parvenir à saisir les ennemis.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: atteindra
  rationale: Le verbe מצא signifie fondamentalement « trouver », mais, dans ce contexte guerrier, il exprime l’idée de parvenir jusqu’aux ennemis et de se saisir d’eux. « Atteindra » rend naturellement cette valeur en français tout en conservant l’image de la main agissante.
- source_word: יָדְךָ
  choice: ta main
  rationale: La traduction concrète préserve l’image anthropomorphique de la puissance et de l’action du roi.
- source_word: לְכָל
  choice: tous
  rationale: « Tous tes ennemis » est idiomatique en français et conserve la portée globale de כל.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Équivalent courant de אויב, avec maintien de l’adresse directe à la deuxième personne du singulier.
- source_word: יְמִינְךָ
  choice: ta main droite
  rationale: La traduction littérale préserve le parallélisme hébreu ainsi que l’image traditionnelle de force et d’efficacité victorieuse.
- source_word: שֹׂנְאֶיךָ
  choice: ceux qui te haïssent
  rationale: Cette formulation française claire conserve la nuance verbale du participe plutôt que de la réduire à un second nom désignant les ennemis.
theological_decisions:
- issue: Langage corporel décrivant la puissance royale ou divine dans un psaume royal
  choice: Maintien des images concrètes « main » et « main droite ».
  alternative: Ta puissance rattrapera tous tes ennemis.
  rationale: Le texte hébreu emploie une image corporelle significative sur les plans poétique et théologique. La conserver évite d’imposer une abstraction et maintient le parallélisme du verset.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe au roi. La répétition de « main » est conservée pour respecter le parallélisme hébreu.
