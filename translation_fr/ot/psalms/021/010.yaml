source:
  edition: WLC
  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: fr
  text: 'Tu feras disparaître leur fruit de la terre,

    et leur descendance d’entre les fils des hommes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « d’entre les humains ». Hébreu : « d’entre les fils des hommes ».'
    reason: Alternative idiomatique pour l’expression générique hébraïque בני אדם, tout en conservant dans le texte sa formulation poétique.
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: leur fruit
  rationale: Le sens concret de « fruit » conserve l’image poétique hébraïque; dans ce parallélisme avec « leur descendance », il évoque leurs descendants sans expliciter à outrance la métaphore.
- source_word: מֵאֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner la terre ou un pays. Le contexte général du jugement et l’absence de territoire précis favorisent « la terre ».
- source_word: תְּאַבֵּד
  choice: tu feras disparaître
  rationale: Le piel de אבד exprime ici l’élimination ou la destruction. « Faire disparaître » rend naturellement la valeur causative et convient à l’idée d’effacer une lignée.
- source_word: וְזַרְעָם
  choice: leur descendance
  rationale: זֶרַע signifie littéralement « semence » et, appliqué à des personnes, « descendance ». Ce dernier terme est clair en français et répond au « fruit » du premier vers.
- source_word: מִבְּנֵי אָדָם
  choice: du milieu des fils des hommes
  rationale: La formulation garde l’expression poétique et grammaticalement masculine de l’hébreu בְּנֵי אָדָם, tout en indiquant par « du milieu de » l’appartenance au genre humain.
theological_decisions:
- issue: Portée de בְּנֵי אָדָם
  choice: les fils des hommes
  alternative: l’humanité / les êtres humains
  rationale: L’expression hébraïque désigne collectivement les humains. Le texte principal en conserve la forme poétique sans lui donner un sens exclusivement masculin; la note fournit l’équivalent collectif idiomatique.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « leur fruit / leur descendance » est conservé. « Faire disparaître » évite une tournure archaïque tout en maintenant la force du jugement.
