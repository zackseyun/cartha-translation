  text: יְֽהוָ֗ה בְּ/עָזְּ/ךָ֥ יִשְׂמַח מֶ֑לֶךְ וּ֝/בִ/ישׁ֥וּעָתְ/ךָ֗ מַה יגיל מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/001.yaml
  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: fr
  text: Yahvé, le roi se réjouit de ta force ; combien il exulte grâce à ton salut[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « délivrance » ou « victoire ».'
    reason: Alternative lexicale contextuellement possible pour יְשׁוּעָה.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante « Yahvé » ; le vocatif est exprimé naturellement sans ajouter « ô ».
- source_word: בְּעָזְּךָ
  choice: de ta force
  rationale: La préposition בְּ indique ici le fondement ou le motif de la joie ; « se réjouit de ta force » est idiomatique en français et conserve le parallélisme sémantique.
- source_word: יִשְׂמַח
  choice: se réjouit
  rationale: L'inaccompli poétique peut avoir une valeur présente ou générale ; le présent convient au contexte de louange sans imposer une lecture strictement future.
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Malgré l'absence d'article en hébreu, le contexte désigne un roi déterminé.
- source_word: וּבִישׁוּעָתְךָ
  choice: ton salut
  rationale: יְשׁוּעָה couvre les idées de salut, délivrance et victoire ; « salut » conserve cette portée large.
- source_word: מַה … יגיל מְאֹד
  choice: quelle vive allégresse lui donne
  rationale: מַה est exclamatif, גיל exprime une joie intense et מְאֹד l'amplifie. Cette formulation française naturelle préserve l'exclamation et distingue ce second membre du simple « se réjouit ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom divin ; « Yahvé » le représente directement dans une forme familière aux lecteurs francophones, sans le remplacer par un titre.
- issue: Portée de יְשׁוּעָה
  choice: salut
  alternative: délivrance ou victoire
  rationale: « Salut » garde ouverte la portée du terme hébreu, qui peut désigner dans ce contexte une délivrance concrète ou une victoire accordée au roi.
translation_notes:
  register: Français international moderne, poétique et digne. L'ordre d'adresse initial est conservé ; la seconde proposition est légèrement restructurée pour produire une exclamation naturelle tout en maintenant l'intensité de l'hébreu.
