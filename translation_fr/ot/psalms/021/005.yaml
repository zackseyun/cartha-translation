source:
  edition: WLC
  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: fr
  text: Grande est sa gloire grâce à ton salut[a] ; tu le revêts de splendeur et de majesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ton salut » ou « dans ton salut ». Ici, « salut » peut aussi avoir le sens de « délivrance » ou, dans ce contexte royal, de « victoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grande est
  rationale: L’adjectif attribut placé en tête reçoit une tournure française marquée mais naturelle, qui conserve l’emphase poétique.
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: כָּבוֹד désigne ici la gloire ou l’honneur du roi ; « gloire » convient au contexte royal et exalté.
- source_word: בִּישׁוּעָתֶךָ
  choice: grâce à ton salut
  rationale: La préposition ב peut indiquer le moyen, la cause ou la sphère. « Grâce à » exprime naturellement l’action salvatrice de Dieu, tandis que la note préserve les autres nuances possibles.
- source_word: הוֹד
  choice: splendeur
  rationale: הוֹד évoque un éclat imposant et royal ; « splendeur » le distingue du terme coordonné הָדָר.
- source_word: וְהָדָר
  choice: et de majesté
  rationale: Dans ce parallélisme royal, הָדָר exprime la dignité et la magnificence ; « majesté » rend bien cette nuance.
- source_word: תְּשַׁוֶּה
  choice: tu le revêts
  rationale: Avec עַל, le verbe signifie littéralement placer sur quelqu’un. « Revêtir de » rend naturellement en français l’image d’une dignité conférée sans la réduire à une abstraction.
- source_word: עָלָיו
  choice: le
  rationale: Le pronom objet dans « tu le revêts de » transpose idiomatiquement la construction hébraïque « placer sur lui ».
theological_decisions:
- issue: Sens de יְשׁוּעָה dans un psaume royal
  choice: salut
  alternative: délivrance ou victoire
  rationale: « Salut » conserve l’étendue du terme hébreu, qui peut désigner une délivrance et, dans un contexte royal ou militaire, une victoire, sans limiter le verset au seul succès guerrier.
translation_notes:
  register: Français moderne, international et digne. L’inversion « Grande est sa gloire » maintient l’emphase initiale de l’hébreu. « Tu le revêts » conserve de façon idiomatique l’image d’un honneur placé sur le roi.
