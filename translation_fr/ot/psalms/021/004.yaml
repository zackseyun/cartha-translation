source:
  edition: WLC
  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: fr
  text: 'Il t’a demandé la vie ; tu la lui as donnée : une longue vie, pour toujours et à jamais.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule « pour toujours et à jamais » peut être comprise comme une hyperbole royale évoquant une vie et un règne durables, ou comme une parole qui trouve son plein accomplissement dans le Messie.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que le nom soit morphologiquement pluriel, il désigne couramment la vie comme réalité abstraite. Le complément « une longue suite de jours » en précise ensuite la durée.
- source_word: שָׁאַל מִמְּךָ
  choice: Il t’a demandé
  rationale: Cette formulation française exprime naturellement une demande adressée à Dieu et évite le tour plus lourd « il a demandé de toi ».
- source_word: נָתַתָּה לּוֹ
  choice: tu la lui as donnée
  rationale: Le pronom « la » reprend explicitement « la vie », comme l’exige ici le français naturel, tandis que le passé composé convient à l’énoncé poétique d’un don accompli.
- source_word: אֹרֶךְ יָמִים
  choice: une longue suite de jours
  rationale: Cette expression conserve l’image hébraïque de jours qui se prolongent, tout en étant plus naturelle en français moderne que le calque « longueur de jours ».
- source_word: עוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: La formule redoublée rend l’intensification de la durée dans l’hébreu sans l’atténuer.
theological_decisions:
- issue: Étendue de la vie accordée au roi dans un psaume royal
  choice: 'Conserver dans le texte la durée non limitée : « pour toujours et à jamais »'
  alternative: Comprendre la formule comme une hyperbole royale désignant une vie et un règne durables, ou comme une parole trouvant son plein accomplissement dans le Messie
  rationale: L’hébreu exprime directement une durée sans borne. La traduction ne doit trancher ni en faveur d’une simple hyperbole de cour ni en faveur d’une interprétation messianique exclusive.
translation_notes:
  register: Français international moderne, poétique et digne. « Une longue suite de jours » préserve l’image source sans recourir au calque peu idiomatique « longueur de jours ».
