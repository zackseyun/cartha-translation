id: PSA.21.3
reference: Psalms 21:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: fr
  text: Car tu vas au-devant de lui avec des bénédictions de bonheur[a] ; tu poses sur sa tête une couronne d’or fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu le précèdes avec des bénédictions de bonheur » ou « tu viens à sa rencontre avec de bonnes bénédictions ». Le verbe hébreu peut exprimer le fait d’aller à la rencontre de quelqu’un ou de le devancer.
    reason: lexical_alternative
  - marker: b
    text: « Or fin » peut aussi se traduire par « or pur » ou « or raffiné ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici naturellement l’explication de la joie et des bienfaits évoqués dans le contexte précédent.
- source_word: תְקַדְּמֶנּוּ
  choice: tu vas au-devant de lui
  rationale: 'Cette expression conserve l’idée portée par le piel de קדם : Dieu prend l’initiative, soit en allant à la rencontre du roi, soit en le précédant.'
- source_word: בִּרְכוֹת טוֹב
  choice: avec des bénédictions de bonheur
  rationale: Le pluriel « bénédictions » est conservé, et « bonheur » rend טוֹב de manière large sans limiter ces bienfaits à la prospérité matérielle.
- source_word: תָּשִׁית
  choice: tu poses
  rationale: « Poser » convient naturellement à l’action de mettre une couronne sur la tête de quelqu’un et garde la simplicité du verbe hébreu.
- source_word: לְרֹאשׁוֹ
  choice: sur sa tête
  rationale: Avec le verbe de placement, la préposition לְ se rend idiomatiquement par « sur » en français.
- source_word: עֲטֶרֶת
  choice: une couronne
  rationale: Dans ce psaume royal, « couronne » exprime clairement le sens régalien du nom.
- source_word: פָּז
  choice: or fin
  rationale: Le terme désigne un or de grande qualité ; « or fin » est précis, naturel et d’un registre poétique digne.
theological_decisions:
- issue: Nature des bénédictions accordées au roi
  choice: Conserver une désignation large des bienfaits divins avec « bénédictions de bonheur ».
  alternative: Préciser qu’il s’agit soit de prospérité matérielle, soit de bénédictions exclusivement spirituelles ou liées à l’alliance.
  rationale: L’expression hébraïque reste générale et ne permet pas de réduire ces bénédictions à une seule catégorie théologique.
translation_notes:
  register: Français international moderne, poétique et digne. « Aller au-devant de » demeure courant dans un registre soutenu et permet de préserver l’initiative ainsi que l’ambiguïté spatiale du verbe hébreu. Le point-virgule reflète le parallélisme du vers.
