source:
  edition: WLC
  text: תְּשִׁיתֵ֤/מוֹ כְּ/תַנּ֥וּר אֵשׁ֮ לְ/עֵ֪ת פָּ֫נֶ֥י/ךָ יְ֭הוָה בְּ/אַפּ֣/וֹ יְבַלְּעֵ֑/ם וְֽ/תֹאכְלֵ֥/ם אֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: fr
  text: Tu les rendras semblables à une fournaise ardente au moment de ta présence[a] ; Yahweh, dans sa colère, les engloutira, et le feu les dévorera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moment où tu paraîtras » ; littéralement, « au temps de ta face ».
    reason: Alternative lexicale pour l’expression hébraïque de la « face », qui peut évoquer la présence ou la manifestation.
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Tu feras d’eux
  rationale: Le verbe שׁית signifie « placer, établir, faire ». Avec le complément comparatif, « faire d’eux » exprime naturellement en français l’état auquel ils seront réduits.
- source_word: כְּתַנּוּר אֵשׁ
  choice: comme une fournaise ardente
  rationale: תנור désigne un four ou une fournaise, et אֵשׁ souligne ici la chaleur destructrice. « Fournaise ardente » restitue l’image dans un français naturel.
- source_word: לְעֵת פָּנֶיךָ
  choice: au moment où tu paraîtras[a]
  rationale: L’expression signifie littéralement « au temps de ta face ». La face peut évoquer la présence ou la manifestation d’une personne ; « où tu paraîtras » rend clairement cette idée sans imposer un sens eschatologique technique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: בְּאַפּוֹ
  choice: dans sa colère
  rationale: אַף désigne littéralement le nez, mais exprime idiomatiquement la colère.
- source_word: יְבַלְּעֵם
  choice: les engloutira
  rationale: בלע signifie « avaler, engloutir ». Ce choix conserve la métaphore vive tout en la distinguant du verbe suivant.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: et le feu les dévorera
  rationale: Le verbe אכל signifie fondamentalement « manger » ; appliqué au feu, « dévorer » est naturel et conserve la vigueur de l’image.
theological_decisions:
- issue: Expression anthropomorphique « au temps de ta face »
  choice: au moment où tu paraîtras
  alternative: au moment de ta présence
  rationale: La formulation retenue rend la manifestation associée à la « face » sans transformer l’expression en terme eschatologique spécialisé. La note préserve la formulation littérale et l’autre sens possible.
- issue: Passage de la deuxième à la troisième personne
  choice: Maintien de « tu » puis « Yahweh… sa »
  alternative: Harmoniser les pronoms en attribuant toutes les actions au même référent
  rationale: L’hébreu passe de « ta face » à « Yahweh, dans sa colère ». La traduction conserve ce changement réel au lieu de trancher silencieusement la relation entre le roi interpellé et l’action de Yahweh.
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération préserve le nom personnel יהוה présent dans le texte hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme poétique et les images fortes de la fournaise, de l’engloutissement et du feu qui dévore sont conservés.
