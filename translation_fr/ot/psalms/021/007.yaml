id: PSA.21.7
reference: Psalms 21:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: fr
  text: Car le roi met sa confiance en Yahweh et, grâce à l’amour fidèle du Très-Haut[a], il ne vacillera pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’amour fidèle du Très-Haut »; la préposition hébraïque peut exprimer le moyen ou la situation, et חֶסֶד peut aussi se traduire par « fidélité à l’alliance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il ne sera pas ébranlé » ou « il ne chancellera pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente, sans préciser outre mesure le rapport logique.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Rend directement le nom défini désignant la figure royale du psaume.
- source_word: בֹּטֵחַ
  choice: met sa confiance
  rationale: Le participe qal exprime ici une confiance durable ou caractéristique; cette tournure est naturelle en français moderne.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition désigne l’objet de la confiance, et le nom divin est translittéré afin de conserver le nom personnel présent dans l’hébreu.
- source_word: וּבְחֶסֶד
  choice: et, grâce à l’amour fidèle
  rationale: חֶסֶד évoque un amour loyal et durable; « grâce à » comprend la préposition dans un sens instrumental ou causal, tout en signalant en note l’autre lecture possible.
- source_word: עֶלְיוֹן
  choice: du Très-Haut
  rationale: Rend le titre divin substantivé par son équivalent français courant.
- source_word: בַּל יִמּוֹט
  choice: il ne vacillera pas
  rationale: Conserve l’image poétique d’une stabilité qui empêche de chanceler, dans une formulation française claire et concise.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le Tétragramme; « Yahweh » conserve le caractère de nom personnel sans le remplacer par un titre.
- issue: Rapport entre la fidélité divine et la stabilité du roi
  choice: grâce à l’amour fidèle du Très-Haut
  alternative: dans l’amour fidèle du Très-Haut
  rationale: Le sens instrumental ou causal convient bien au contexte, mais la préposition hébraïque permet aussi une lecture locative; cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme, le nom divin et la métaphore de la stabilité, tout en évitant un vocabulaire confessionnel spécialisé.
