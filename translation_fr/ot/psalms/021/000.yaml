  yaml_path: translation/ot/psalms/021/000.yaml
  text: For the choirmaster. A psalm of David[a].
translation:
  language: fr
  text: Pour le chef de chœur. Psaume de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David »; dans ce titre hébreu, la préposition peut indiquer l’auteur, l’association, l’appartenance ou la dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Pour le chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. « Pour » rend la préposition לְ dans son emploi de destination, et « chef de chœur » exprime naturellement la fonction en français moderne.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Il s’agit du terme habituel désignant une composition poétique destinée au chant ou à l’accompagnement musical; « psaume » en est l’équivalent français établi dans ce contexte.
- source_word: לְדָוִד
  choice: de David
  rationale: La construction avec לְ peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette latitude que « par David » ou « pour David ».
theological_decisions:
- issue: Portée de la mention davidique dans le titre
  choice: de David
  alternative: par David; pour David
  rationale: Le titre hébreu n’impose pas à lui seul une seule relation précise entre David et le psaume. La formulation retenue préserve cette ambiguïté sans affirmer plus explicitement l’auteur ou le destinataire.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation brève respecte le caractère de titre liturgique. Le marqueur [a] est placé immédiatement après « David », puisqu’il porte sur לְדָוִד.
