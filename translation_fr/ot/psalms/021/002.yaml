  text: תַּאֲוַ֣ת לִ֭בּ/וֹ נָתַ֣תָּה לּ֑/וֹ וַ/אֲרֶ֥שֶׁת שְׂ֝פָתָ֗י/ו בַּל מָנַ֥עְתָּ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/002.yaml
  text: You have given him his heart’s desire[a], and you have not withheld the request of his lips[b]. Selah
translation:
  language: fr
  text: 'Tu lui as accordé le désir de son cœur,

    et tu ne lui as pas refusé la requête de ses lèvres[a].

    Sélah[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le désir de ses lèvres » ou « la demande de ses lèvres ». Le nom hébreu rare אֲרֶשֶׁת désigne probablement une demande exprimée, en parallèle avec « le désir de son cœur ».
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est conservé sous forme de translittération, car son sens ou sa fonction exacte reste incertain; il marque probablement une pause musicale ou liturgique.
    reason: cultural_note
lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: le désir de son cœur
  rationale: Cette expression rend directement le désir intérieur exprimé par le groupe construit hébreu, dans un français naturel et digne.
- source_word: נָתַתָּה לּוֹ
  choice: Tu lui as accordé
  rationale: Dans ce contexte, « accorder » exprime naturellement le fait de donner à quelqu’un ce qu’il désire, tout en conservant l’accompli du verbe hébreu.
- source_word: וַאֲרֶשֶׁת
  choice: la requête
  rationale: Ce nom rare semble désigner une demande formulée; « requête » préserve son parallélisme avec le désir du cœur sans confondre les deux expressions.
- source_word: שְׂפָתָיו
  choice: de ses lèvres
  rationale: La formulation conserve l’image poétique hébraïque des lèvres qui expriment la demande.
- source_word: בַּל מָנַעְתָּ
  choice: tu ne lui as pas refusé
  rationale: « Refuser » est naturel en français avec « requête » et communique ici l’idée de ne pas retenir ou écarter ce qui est demandé.
- source_word: סֶּלָה
  choice: Sélah
  rationale: Le terme est translittéré, avec une graphie adaptée au français, puisque sa signification et sa fonction exactes demeurent incertaines.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre le désir intérieur et la demande exprimée est conservé, ainsi que l’image concrète des lèvres.
