  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: fr
  text: Élève-toi[a], Yahweh, dans ta force ! Nous chanterons et nous ferons de la musique pour célébrer ta puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lève-toi, Yahweh, dans ta force ! » Le verbe hébreu peut appeler Dieu à se lever pour agir ou à manifester son élévation.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Chantons et faisons de la musique pour célébrer ta puissance ». Les formes hébraïques peuvent exprimer aussi bien une résolution qu’une invitation.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Élève-toi
  rationale: L’impératif de רום appelle Yahweh à se montrer élevé ou à se lever. « Élève-toi » conserve l’image de la hauteur et convient à la fois à la supplication et à l’acclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », qui préserve le nom divin plutôt que de lui substituer un titre.
- source_word: בְּעֻזֶּךָ
  choice: dans ta force
  rationale: La préposition ב peut ici marquer la sphère ou le moyen. « Dans ta force » reste proche de la formulation hébraïque et suggère que l’élévation de Yahweh se manifeste dans sa force.
- source_word: נָשִׁירָה
  choice: Nous chanterons
  rationale: La forme cohortative de première personne du pluriel peut exprimer une résolution ou une invitation. Le futur français rend naturellement ici la réponse résolue des adorateurs.
- source_word: וּנְזַמְּרָה
  choice: et jouerons de la musique
  rationale: זמר désigne l’action de faire de la musique, souvent en chantant des louanges. Cette formulation conserve la nuance musicale sans simplement répéter « chanter ».
- source_word: גְּבוּרָתֶךָ
  choice: en l’honneur de ta puissance
  rationale: גְּבוּרָה évoque la puissance ou la vaillance manifestée. « En l’honneur de » explicite de manière idiomatique en français le thème célébré par le chant et la musique, sans faire de la puissance leur destinataire.
theological_decisions:
- issue: Traduction du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Sens de l’appel רוּמָה adressé à Dieu
  choice: Élève-toi
  alternative: Lève-toi
  rationale: Le verbe peut appeler Dieu soit à se lever pour agir, soit à manifester sa hauteur et son exaltation. Le texte principal retient la seconde nuance sans exclure la première, signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif sans « ô » évite une tournure vieillie. La phrase conserve le parallélisme entre la force de Yahweh et la puissance célébrée par l’assemblée.
