  text: כִּי נָט֣וּ עָלֶ֣י/ךָ רָעָ֑ה חָֽשְׁב֥וּ מְ֝זִמָּ֗ה בַּל יוּכָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/011.yaml
  text: For they intended evil against you[a]; they devised a scheme[b], but they could not carry it out.
translation:
  language: fr
  text: Car ils ont projeté du mal contre toi[a], ils ont conçu un complot[b], mais ils n’ont pas pu le réaliser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ont étendu le mal contre toi ». L’expression hébraïque évoque un mal dirigé ou projeté contre quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils ont conçu un plan, mais ils n’ont pas pu l’exécuter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et conserve naturellement la valeur explicative de la particule.
- source_word: נָטוּ עָלֶיךָ רָעָה
  choice: ils ont projeté le mal contre toi
  rationale: נָטָה signifie littéralement « étendre » ou « tendre », mais l’expression désigne ici une action mauvaise dirigée intentionnellement contre quelqu’un. « Projeter le mal » garde à la fois l’idée de dessein hostile et la dimension morale de רָעָה.
- source_word: חָשְׁבוּ
  choice: ils ont conçu
  rationale: Dans ce contexte, le verbe exprime une élaboration délibérée; « concevoir » convient au parallélisme et au registre poétique.
- source_word: מְזִמָּה
  choice: un complot
  rationale: Le nom peut désigner un projet ou un plan; le contexte hostile favorise « complot », sans ajouter de contenu absent de l’hébreu.
- source_word: בַּל יוּכָלוּ
  choice: mais ils n’ont pas pu le réaliser
  rationale: בַּל est une négation poétique et יכל signifie « être capable ». Le pronom « le » reprend naturellement le complot, tandis que « réaliser » explicite sobrement l’action laissée implicite en hébreu.
