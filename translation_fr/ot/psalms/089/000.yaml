lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Poème didactique
  rationale: Le terme désigne un genre littéraire ou musical dans les titres de psaumes, mais son sens précis demeure incertain. « Poème didactique » offre une formulation française naturelle tout en signalant sa valeur probablement instructive; l’incertitude est conservée en note.
- source_word: לְ
  choice: de
  rationale: Dans les titres de psaumes, la préposition marque une relation d’attribution ou d’association, sans établir nécessairement l’auteur. « De » est bref et laisse cette relation ouverte.
- source_word: אֵיתָן
  choice: Étan
  rationale: Transcription française usuelle du nom propre hébreu.
- source_word: הָאֶזְרָחִי
  choice: l’Ézrahite
  rationale: Cette transcription suit directement la forme consonantique transmise et présente le terme comme une désignation familiale ou clanique. Un rapprochement avec Zérah reste possible et figure en note.
