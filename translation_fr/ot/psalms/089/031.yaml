id: PSA.89.31
reference: Psalms 89:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם חֻקֹּתַ֥/י יְחַלֵּ֑לוּ וּ֝/מִצְוֺתַ֗/י לֹ֣א יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/031.yaml
  text: If they profane my statutes and do not keep my commandments,[a]
translation:
  language: fr
  text: S’ils profanent mes prescriptions et n’observent pas mes commandements,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « transgressent mes prescriptions ». Le verbe hébreu peut exprimer l’action de profaner ou de traiter comme profane; « profanent » en conserve la force plus marquée.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: S’ils
  rationale: La particule introduit ici la condition; « si » en conserve directement la valeur sans suggérer la certitude temporelle de « quand ».
- source_word: חֻקֹּתַי
  choice: mes prescriptions
  rationale: Le terme désigne des règles établies ou prescrites. « Prescriptions » est naturel en français moderne et demeure distinct de « commandements » dans le parallélisme.
- source_word: יְחַלֵּלוּ
  choice: profanent
  rationale: Au piel, le verbe exprime l’idée de profaner ou de traiter comme dépourvu de sainteté. « Profanent » préserve cette force religieuse, plus marquée que le simple « transgressent ».
- source_word: וּמִצְוֺתַי
  choice: et mes commandements
  rationale: מִצְוָה désigne un commandement dans le cadre de l’alliance et de la loi; ce choix garde le registre digne ainsi que la distinction avec חֻקֹּתַי.
- source_word: לֹא יִשְׁמֹרוּ
  choice: n’observent pas
  rationale: Dans un contexte légal ou lié à l’alliance, שׁמר signifie garder au sens de respecter ou observer. « Observer » convient naturellement à des commandements en français.
theological_decisions:
- issue: Force du langage de violation de l’alliance dans חלל appliqué aux prescriptions
  choice: « profanent mes prescriptions »
  alternative: « transgressent mes prescriptions » ou « traitent mes prescriptions comme profanes »
  rationale: « Profanent » maintient la gravité du piel de חלל, qui évoque davantage qu’une simple désobéissance, sans ajouter une interprétation doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé, avec une distinction lexicale entre « prescriptions » et « commandements ».
