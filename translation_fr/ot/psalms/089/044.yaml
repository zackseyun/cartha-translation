id: PSA.89.44
reference: Psalms 89:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִשְׁבַּ֥תָּ מִ/טְּהָר֑/וֹ וְ֝/כִסְא֗/וֹ לָ/אָ֥רֶץ מִגַּֽרְתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/044.yaml
  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: fr
  text: Tu as mis fin à sa splendeur[a] et jeté son trône à terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as fait cesser son éclat » ou « sa pureté ». Le terme hébreu peut désigner l’éclat, la pureté ou la splendeur; « splendeur » convient particulièrement au contexte royal.
    reason: lexical_alternative
  - marker: b
    text: Ou « renversé son trône jusqu’à terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Tu as mis fin à
  rationale: Le hifil de שׁבת exprime l’action de faire cesser. « Mettre fin à » en restitue naturellement la valeur causative en français moderne.
- source_word: מִטְּהָרוֹ
  choice: sa splendeur
  rationale: טֹהַר peut évoquer l’éclat, la pureté ou la splendeur. Dans ce contexte royal, « splendeur » rend au mieux la majesté rayonnante désormais supprimée; la préposition מִן est intégrée idiomatiquement à « mettre fin à ».
- source_word: וְכִסְאוֹ
  choice: et son trône
  rationale: כִּסֵּא désigne directement le trône; la conjonction et le suffixe masculin singulier sont conservés.
- source_word: לָאָרֶץ
  choice: à terre
  rationale: Dans l’image d’un trône précipité, « à terre » est l’équivalent français naturel de לָאָרֶץ et souligne l’abaissement.
- source_word: מִגַּרְתָּה
  choice: jeté
  rationale: Le verbe exprime ici l’action de précipiter ou d’abattre. « Jeter à terre » conserve l’image concrète et la force poétique sans surinterprétation.
theological_decisions:
- issue: Référent des suffixes masculins singuliers
  choice: Traduire simplement par « sa » et « son », sans préciser le référent.
  alternative: Expliciter « la splendeur du roi » ou « le trône de ton oint ».
  rationale: L’hébreu ne répète pas l’antécédent dans ce verset. Le maintien des possessifs préserve le mouvement poétique et laisse ouverte l’identification contextuelle au roi davidique ou à l’oint de l’alliance.
translation_notes:
  register: Français moderne, digne et poétique. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La formulation reste concise et conserve les possessifs implicites de l’hébreu.
