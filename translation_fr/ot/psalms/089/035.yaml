source:
  edition: WLC
  text: אַ֭חַת נִשְׁבַּ֣עְתִּי בְ/קָדְשִׁ֑/י אִֽם לְ/דָוִ֥ד אֲכַזֵּֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/035.yaml
  text: Once I have sworn by my holiness[b][a]; I will not lie to David.
translation:
  language: fr
  text: 'J’ai juré une fois par ma sainteté[a] : je ne mentirai pas à David.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une fois pour toutes, j’ai juré par ma sainteté ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « si je mens à David… » Formule de serment signifiant : « je ne mentirai pas à David » ou « je ne me montrerai pas faux envers David ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: une fois
  rationale: Dans ce contexte de serment, le terme fonctionne adverbialement et désigne un engagement unique et décisif. « Une fois » reste proche de l’hébreu sans imposer dans le corps du texte la nuance plus forte « une fois pour toutes ».
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Le niphal de שׁבע exprime l’action de prêter serment. Le passé composé français présente naturellement cet acte passé dont la force demeure.
- source_word: בְקָדְשִׁי
  choice: par ma sainteté
  rationale: La préposition ב introduit ici ce qui garantit le serment; קֹדֶשׁ avec le suffixe de première personne désigne le plus probablement la sainteté même de Dieu.
- source_word: אִם
  choice: je ne… pas
  rationale: Après une formule de serment, אִם introduit une imprécation elliptique qui équivaut en contexte à une négation solennelle. Le français explicite cette valeur, tandis qu’une note signale la forme littérale.
- source_word: לְדָוִד
  choice: à David
  rationale: La préposition ל marque la personne envers laquelle une parole ou une promesse serait mensongère.
- source_word: אֲכַזֵּב
  choice: mentirai
  rationale: Le piel de כזב peut signifier mentir ou se montrer faux. « Mentir à David » est direct, idiomatique et conserve la dimension personnelle de la promesse.
theological_decisions:
- issue: Rendre la formule de serment divine sans compléter excessivement l’hébreu
  choice: je ne mentirai pas à David
  alternative: si je mens à David…
  rationale: L’hébreu conserve une formule conditionnelle elliptique dont le sens négatif est conventionnel dans un serment. L’expliciter produit une phrase française complète, tandis que la note préserve la tension formelle du texte source.
- issue: Portée temporelle du serment
  choice: une fois
  alternative: une fois pour toutes
  rationale: « Une fois » rend le caractère singulier et décisif du serment tout en évitant de faire de la valeur renforcée « pour toutes » une certitude textuelle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple; le deux-points fait entendre que la déclaration suivante donne le contenu ou la conséquence solennelle du serment.
