  text: אֲשֶׁ֣ר יָ֭דִ/י תִּכּ֣וֹן עִמּ֑/וֹ אַף זְרוֹעִ֥/י תְאַמְּצֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: fr
  text: Ma main sera à ses côtés, ferme[a] ; oui, mon bras le fortifiera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ma main sera fermement établie avec lui ».'
    reason: lexical_alternative
  - marker: b
    text: Le « bras » est ici une image poétique de la force et de la puissance.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: avec lui
  rationale: Le relatif renvoie à l’élu du verset précédent, tandis que עִמּוֹ signifie littéralement « avec lui ». En français, dans ce verset isolé, « avec lui » rend naturellement la relation sans forcer une tournure relative.
- source_word: יָדִי
  choice: ma main
  rationale: Conserve l’image poétique concrète de l’action et du soutien puissants de Dieu.
- source_word: תִּכּוֹן
  choice: restera ferme
  rationale: Le niphal de כון exprime ici la fermeté ou la stabilité. « Restera ferme » est idiomatique avec « avec lui » et maintient la portée de promesse de l’imparfait.
- source_word: אַף
  choice: oui
  rationale: Marque avec naturel l’insistance et la progression parallèle du second membre.
- source_word: זְרוֹעִי
  choice: mon bras
  rationale: Préserve l’image poétique hébraïque du bras comme expression de force et de puissance.
- source_word: תְאַמְּצֶנּוּ
  choice: le fortifiera
  rationale: Le piel de אמץ signifie rendre fort ou affermir ; « fortifiera » rend de façon concise cette action causative.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « ma main » et « mon bras »
  alternative: Paraphraser par « ma puissance » et « ma force »
  rationale: Les images corporelles font partie du parallélisme poétique et décrivent le soutien actif de Dieu sans devoir être réduites à des abstractions.
- issue: Valeur temporelle des formes verbales
  choice: 'Employer le futur : « restera », « fortifiera »'
  alternative: Employer un présent général
  rationale: Dans ce contexte de promesse royale, les imparfaits expriment naturellement l’engagement durable et promis de Dieu.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme ainsi que les images concrètes de la main et du bras sont conservés ; « restera ferme » évite la tournure moins naturelle « sera établie avec lui ».
