source:
  edition: WLC
  text: וְ/כַתּוֹתִ֣י מִ/פָּנָ֣י/ו צָרָ֑י/ו וּ/מְשַׂנְאָ֥י/ו אֶגּֽוֹף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/023.yaml
  text: And I will crush his adversaries before him[b][a], and strike down those who hate him.
translation:
  language: fr
  text: J’écraserai devant lui ses adversaires et je frapperai ceux qui le haïssent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’abattrai ceux qui le haïssent » ; le verbe hébreu peut désigner un coup décisif, le fait d’abattre ou d’infliger un fléau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: J’écraserai
  rationale: Le verbe כתת exprime ici une défaite violente et décisive. Dans la suite des promesses divines, la forme avec וְ reçoit naturellement une valeur future en français.
- source_word: מִפָּנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « de devant sa face/présence ». « Devant lui » conserve l’image spatiale hébraïque tout en restant naturel en français.
- source_word: צָרָיו
  choice: ses adversaires
  rationale: צָרָיו désigne ceux qui s’opposent activement à lui. « Adversaires » maintient la distinction avec « ceux qui le haïssent » dans le second membre.
- source_word: וּמְשַׂנְאָיו
  choice: et ceux qui le haïssent
  rationale: Le participe de שׂנא désigne les personnes caractérisées par leur haine envers lui ; cette tournure est claire et idiomatique en français moderne.
- source_word: אֶגּוֹף
  choice: je frapperai
  rationale: נגף peut signifier frapper, abattre ou infliger un fléau. « Frapper » préserve l’ampleur du terme et la vigueur du langage guerrier sans préciser indûment le moyen ou le résultat.
theological_decisions:
- issue: Langage du guerrier divin dans la promesse faite au roi davidique
  choice: 'Conserver l’action martiale directe de Dieu : « J’écraserai… je frapperai ».'
  alternative: Atténuer en traduisant par « je vaincrai » ou « je protégerai contre ».
  rationale: Les deux verbes hébreux sont vigoureux et présentent Dieu comme intervenant lui-même contre les ennemis du roi. La traduction conserve cette tension sans lui ajouter une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est maintenu, ainsi que la distinction entre « adversaires » et « ceux qui le haïssent ». Le pronom divin à la première personne est conservé sans explicitation.
