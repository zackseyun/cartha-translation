  text: כִּ֤י מִ֣י בַ֭/שַּׁחַק יַעֲרֹ֣ךְ לַ/יהוָ֑ה יִדְמֶ֥ה לַ֝/יהוָ֗ה בִּ/בְנֵ֥י אֵלִים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: fr
  text: Car qui, dans les cieux, peut être comparé au SEIGNEUR ? Qui, parmi les fils de Dieu, est semblable au SEIGNEUR ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les êtres célestes », « parmi les êtres divins » ou « parmi les fils des puissants ». Litt. « parmi les fils des dieux / êtres divins » ; l’expression hébraïque est ambiguë.
    reason: alternative lexicale et ambiguïté de l’expression hébraïque
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison de la louange précédente et s’insère naturellement dans la question rhétorique.
- source_word: בַשַּׁחַק
  choice: dans les cieux
  rationale: שׁחק peut désigner le ciel, les cieux ou les nuées ; « dans les cieux » rend clairement le cadre céleste sans imposer une cosmologie technique.
- source_word: יַעֲרֹךְ לַיהוָה
  choice: peut être comparé à l’Éternel
  rationale: Le verbe ערך exprime ici l’idée de placer quelqu’un à côté d’un autre pour les comparer ; cette formulation française restitue la force rhétorique.
- source_word: יִדְמֶה לַיהוָה
  choice: est semblable à l’Éternel
  rationale: דמה exprime la ressemblance ; « est semblable à » est naturel et maintient le parallélisme avec le premier membre.
- source_word: בִּבְנֵי אֵלִים
  choice: parmi les fils de Dieu
  rationale: Cette traduction proche de la forme hébraïque préserve l’image des êtres célestes et son ambiguïté, tandis que les principales interprétations sont signalées en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: l’Éternel
  alternative: Yahvé ; le SEIGNEUR
  rationale: « l’Éternel » est un rendu français traditionnel, digne et immédiatement reconnaissable du tétragramme ; il évite une vocalisation reconstruite tout en distinguant le nom divin du titre ordinaire « Seigneur ».
- issue: Interprétation de בִּבְנֵי אֵלִים
  choice: parmi les fils de Dieu
  alternative: parmi les êtres célestes ; parmi les êtres divins ; parmi les fils des puissants
  rationale: Le choix principal conserve l’expression imagée et la tension théologique de l’hébreu, sans réduire d’emblée ces figures à une catégorie interprétative unique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme des deux questions rhétoriques est conservé, ainsi que l’imagerie céleste et l’ambiguïté de בְּנֵי אֵלִים.
