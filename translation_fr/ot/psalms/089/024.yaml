source:
  edition: WLC
  text: וֶֽ/אֶֽמוּנָתִ֣/י וְ/חַסְדִּ֣/י עִמּ֑/וֹ וּ֝/בִ/שְׁמִ֗/י תָּר֥וּם קַרְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: fr
  text: Ma fidélité et mon amour constant seront avec lui, et en mon nom sa corne[a] s’élèvera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « corne » est une image hébraïque de la force, de la dignité ou de la puissance royale.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: ma fidélité
  rationale: Dans ce parallélisme d’alliance, אֱמוּנָה désigne la constance et la fiabilité de Dieu plutôt que l’acte de croire.
- source_word: חַסְדִּי
  choice: mon amour constant
  rationale: חֶסֶד exprime ici un amour loyal et durable. « Amour constant » est naturel en français moderne et conserve cette dimension d’alliance.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: Traduction directe de la préposition עִם avec suffixe, exprimant ici la présence et le soutien qui accompagnent le roi.
- source_word: בִּשְׁמִי
  choice: par mon nom
  rationale: 'La préposition ב peut ici marquer le moyen ou le fondement : la puissance royale s’élève grâce au nom de Dieu. « Par mon nom » rend ce rapport plus naturellement en français que le calque « en mon nom ».'
- source_word: תָּרוּם
  choice: s’élèvera
  rationale: רוּם signifie être haut ou s’élever. Avec « corne » comme sujet, « s’élèvera » garde l’image concrète et le mouvement du texte hébreu.
- source_word: קַרְנוֹ
  choice: sa corne
  rationale: Le sens littéral est conservé afin de préserver l’image poétique hébraïque de la force, de la dignité et de la puissance royale.
theological_decisions:
- issue: Maintien de la métaphore royale de la corne
  choice: sa corne s’élèvera
  alternative: sa puissance grandira
  rationale: La formulation retenue préserve l’imagerie royale et théologique du psaume sans la réduire à une seule interprétation abstraite.
- issue: Valeur de la préposition ב dans בִּשְׁמִי
  choice: par mon nom
  alternative: en mon nom
  rationale: « Par mon nom » présente le nom de Dieu comme le moyen ou le fondement de l’élévation du roi, tout en laissant subsister la portée représentative de l’expression.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, ainsi que l’image biblique de la corne; la note en explicite le sens culturel sans remplacer la métaphore.
