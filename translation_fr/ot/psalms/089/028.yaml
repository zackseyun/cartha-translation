source:
  edition: WLC
  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: fr
  text: Pour toujours, je lui conserverai mon amour fidèle, et mon alliance avec lui sera ferme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Pour toujours
  rationale: Exprime naturellement en français moderne la durée permanente portée par עוֹלָם avec לְ.
- source_word: אֶשְׁמֹר
  choice: je garderai
  rationale: שׁמר désigne ici le fait de conserver et de maintenir; « garder » reste concis et convient à l’amour fidèle de l’alliance.
- source_word: לוֹ
  choice: lui
  rationale: Le pronom datif français rend avec naturel la relation ou le bénéfice exprimé par לְ, dans les deux propositions.
- source_word: חַסְדִּי
  choice: mon amour fidèle
  rationale: Cette expression rend à la fois la bienveillance et la loyauté durable de חֶסֶד, sans archaïsme ni surdétermination doctrinale.
- source_word: וּבְרִיתִי
  choice: et mon alliance
  rationale: « Alliance » est le terme français usuel et précis pour בְּרִית dans le contexte de la promesse davidique.
- source_word: נֶאֱמֶנֶת
  choice: restera assurée
  rationale: Le participe niphal de אמן exprime ce qui est fiable, ferme et certain. « Restera assurée » préserve cette nuance tout en formant une phrase française naturelle avec « alliance ».
theological_decisions:
- issue: Langage de l’alliance sans explicitation messianique ajoutée
  choice: Conserver le pronom « lui » et présenter la promesse divine directement à son bénéficiaire dans le contexte davidique.
  alternative: Introduire explicitement le Messie ou l’accomplissement christologique dans le texte principal.
  rationale: L’hébreu parle simplement de l’amour et de l’alliance de Dieu à l’égard de « lui ». La traduction préserve le référent immédiat et laisse le développement canonique à l’interprétation.
- issue: Rapport syntaxique et sémantique de נֶאֱמֶנֶת avec l’alliance
  choice: « mon alliance lui restera assurée »
  alternative: « mon alliance lui sera fidèle » ou « mon alliance sera fermement établie pour lui »
  rationale: נֶאֱמֶנֶת peut évoquer la fidélité, la fiabilité ou la fermeté. « Assurée » maintient cette amplitude sans personnifier excessivement l’alliance ni préciser au-delà du texte le mode de son établissement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, avec une formulation fluide et sans vocabulaire confessionnel ajouté.
