source:
  edition: WLC
  text: אֵ֣ל נַ֭עֲרָץ בְּ/סוֹד קְדֹשִׁ֣ים רַבָּ֑ה וְ֝/נוֹרָ֗א עַל כָּל סְבִיבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/007.yaml
  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: fr
  text: Dieu est grandement redouté dans le conseil[a] des êtres saints[b] ; il est redoutable plus que tous ceux qui l’entourent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « assemblée » ; le terme hébreu peut désigner un conseil intime ou une assemblée délibérative.
    reason: lexical_alternative
  - marker: b
    text: L’expression « êtres saints » désigne probablement ici des êtres célestes plutôt que des saints humains.
    reason: cultural_note
lexical_decisions:
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte poétique, le terme désigne le Dieu d’Israël, non une divinité indéterminée.
- source_word: נַעֲרָץ
  choice: est redouté
  rationale: Le participe nifal exprime le fait d’être considéré avec une crainte mêlée de révérence. « Est redouté » conserve cette force sans suggérer le mal moral.
- source_word: בְּסוֹד
  choice: dans l’assemblée
  rationale: סוֹד peut désigner un conseil intime ou une assemblée délibérante. « Assemblée » est naturel en français et laisse ouverte la nuance de conseil céleste.
- source_word: קְדֹשִׁים
  choice: des êtres saints
  rationale: Le contexte céleste indique probablement des êtres célestes. Cette formulation évite l’association spontanée de « saints » avec des croyants humains, tout en restant proche de l’hébreu.
- source_word: רַבָּה
  choice: grande
  rationale: La forme peut être comprise comme qualifiant l’assemblée (« dans la grande assemblée »), conformément à l’accentuation massorétique, plutôt que comme un adverbe intensifiant « redouté ».
- source_word: וְנוֹרָא
  choice: il inspire la crainte
  rationale: La formule rend l’idée de quelqu’un qui suscite à la fois crainte et révérence, dans un français moderne et digne.
- source_word: עַל כָּל סְבִיבָיו
  choice: plus que tous ceux qui l’entourent
  rationale: 'עַל porte ici vraisemblablement une valeur comparative : Dieu inspire davantage la crainte que les membres de son entourage céleste.'
theological_decisions:
- issue: Identité des « êtres saints » et de ceux qui entourent Dieu
  choice: Conserver « êtres saints » dans le texte, avec une note indiquant le référent céleste probable
  alternative: Les fidèles humains, ou une assemblée mixte
  rationale: Le contexte immédiat du psaume évoque les cieux et leur assemblée. La traduction signale donc qu’il s’agit d’êtres, sans préciser leur catégorie au-delà de ce que permet le texte.
- issue: Portée de רַבָּה
  choice: « grande » qualifie l’assemblée
  alternative: « grandement » intensifie « redouté »
  rationale: L’accentuation massorétique rattache naturellement רַבָּה au groupe « assemblée des êtres saints ». L’autre analyse demeure grammaticalement défendable mais n’a pas besoin d’être introduite dans le corps du verset.
translation_notes:
  register: Français international moderne, poétique et solennel sans archaïsmes. Le parallélisme hébreu est conservé, ainsi que la distinction entre « redouté » et « inspire la crainte ».
