  text: נֵ֭אַרְתָּה בְּרִ֣ית עַבְדֶּ֑/ךָ חִלַּ֖לְתָּ לָ/אָ֣רֶץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/039.yaml
  text: You have renounced the covenant of your servant[b][a]; you have defiled his crown to the ground.
translation:
  language: fr
  text: Tu as rejeté l’alliance de ton serviteur[a] ; tu as profané son diadème et l’as jeté à terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « répudié » ou « repoussé » l’alliance de ton serviteur.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « tu as profané son diadème à terre ». Le mot traduit par « diadème » peut aussi évoquer la consécration.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: tu as rejeté
  rationale: Le piel de נאר exprime ici un rejet actif ou une répudiation. « Rejeté » est naturel en français et conserve la force de l’accusation dans cette lamentation.
- source_word: בְּרִית
  choice: l’alliance
  rationale: « Alliance » est le terme français usuel pour בְּרִית dans le cadre de l’engagement royal conclu avec David.
- source_word: עַבְדֶּךָ
  choice: de ton serviteur
  rationale: Dans ce contexte royal, עבד désigne le roi davidique dans sa relation de subordination à Dieu ; « serviteur » rend cette relation sans introduire inutilement l’idée d’esclavage.
- source_word: חִלַּלְתָּ
  choice: tu as profané
  rationale: Le piel de חלל évoque la profanation de ce qui est consacré ou honoré. Ce choix maintient le lien avec la valeur de consécration portée par נזר.
- source_word: לָאָרֶץ
  choice: en le jetant à terre
  rationale: Littéralement « à terre » ou « vers la terre ». La formulation française explicite naturellement l’image d’abaissement attachée au diadème, sans réduire celle-ci à une simple défaite politique.
- source_word: נִזְרוֹ
  choice: son diadème
  rationale: נזר désigne ici l’insigne royal tout en pouvant évoquer la consécration. « Diadème » convient au roi et s’accorde naturellement avec le verbe « profaner ».
theological_decisions:
- issue: L’apparente répudiation de l’alliance davidique et l’humiliation du roi
  choice: Conserver l’accusation directe adressée à Dieu ainsi que l’imagerie d’alliance, de consécration et de royauté.
  alternative: Atténuer le propos en parlant seulement d’une défaite politique, ou l’interpréter explicitement à la lumière d’un accomplissement messianique ultérieur.
  rationale: 'Le verset exprime la tension propre à la lamentation : la situation paraît contredire l’alliance divine. La traduction ne doit ni résoudre cette tension ni importer une interprétation théologique postérieure.'
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. « Diadème » conserve à la fois l’image royale et, avec « profané », l’arrière-plan de consécration.
