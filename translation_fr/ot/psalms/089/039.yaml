  rationale: La révision conserve les deux affirmations de l’hébreu — la profanation du diadème et son abaissement à terre — dans une coordination française naturelle. Elle évite de faire de « jeter » le moyen explicite de « profaner », tout en maintenant l’image royale et la nuance de consécration. Les notes sont harmonisées et clarifiées sans modifier le sens du passage.
