source:
  edition: WLC
  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: fr
  text: 'Tu fais même reculer le tranchant de son épée[a],

    et tu ne l’as pas fait tenir bon au combat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu émousses le tranchant de son épée ». L’hébreu dit littéralement « tu fais reculer le tranchant de son épée », image qui exprime le fait de rendre l’arme inefficace.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu ne l’as pas soutenu au combat » ou « tu ne l’as pas fait tenir debout au combat ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: même
  rationale: Dans cette suite de reproches, la particule ajoute un nouvel élément tout en le renforçant. « Même » restitue naturellement en français cette valeur additive et emphatique.
- source_word: תָּשִׁיב
  choice: tu fais reculer
  rationale: Le hifil de שוב signifie ici « faire revenir » ou « faire reculer ». La formulation conserve l’image concrète du texte hébreu plutôt que d’en donner seulement l’effet (« émousser »). Le présent respecte la forme inaccomplie et présente l’action comme une réalité actuelle dans la lamentation.
- source_word: צוּר
  choice: le tranchant
  rationale: Dans la construction avec « son épée », צוּר désigne très probablement son fil ou son tranchant, plutôt que son sens courant de « rocher ».
- source_word: חַרְבּוֹ
  choice: de son épée
  rationale: 'Cette formulation rend explicitement et naturellement en français le rapport construit de l’hébreu : « le tranchant de son épée ».'
- source_word: הֲקֵימֹתוֹ
  choice: tu ne lui as pas permis de tenir ferme
  rationale: Le hifil de קום exprime le fait de faire tenir debout ou de permettre à quelqu’un de rester en place. Dans un contexte militaire, « tenir ferme » communique l’idée de résister et de garder sa position sans effacer l’image du verbe.
- source_word: בַּמִּלְחָמָה
  choice: au combat
  rationale: « Au combat » est une expression française naturelle qui rend ici la situation militaire indiquée par le syntagme hébreu.
theological_decisions:
- issue: Dieu est directement présenté comme agissant contre le roi davidique
  choice: 'Conserver l’adresse directe à Dieu : « Tu fais… tu ne lui as pas permis… »'
  alternative: Employer une tournure impersonnelle ou passive qui atténuerait l’action divine
  rationale: La lamentation attribue explicitement à Dieu le revers militaire du roi. Cette tension théologique appartient au texte et ne doit pas être atténuée.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Tenir ferme » est idiomatique dans le contexte militaire tout en restant proche de l’image hébraïque.
