id: PSA.89.41
reference: Psalms 89:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: fr
  text: Tous ceux qui passent sur le chemin l’ont dépouillé ; il est devenu un objet de mépris pour ses voisins.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: l’ont dépouillé
  rationale: Le verbe שׁסה exprime l’idée de dépouiller ou de piller. « L’ont dépouillé » garde la force concrète de l’action hostile et convient naturellement à un être humain comme complément.
- source_word: כָּל
  choice: Tous
  rationale: 'כָּל donne ici une portée globale au groupe défini par le participe : tous ceux qui passent.'
- source_word: עֹבְרֵי דָרֶךְ
  choice: ceux qui passent sur le chemin
  rationale: Cette formulation conserve l’image hébraïque des « passants du chemin » tout en restant claire et idiomatique en français moderne.
- source_word: הָיָה
  choice: il est devenu
  rationale: Le parfait décrit une situation résultant de l’humiliation antérieure ; « est devenu » exprime à la fois le changement et l’état qui en découle.
- source_word: חֶרְפָּה
  choice: un objet de mépris
  rationale: חֶרְפָּה désigne l’opprobre, la honte ou le mépris subi. « Un objet de mépris » rend clairement le fait qu’il est méprisé par ceux qui l’entourent, sans archaïsme.
- source_word: לִשְׁכֵנָיו
  choice: pour ses voisins
  rationale: 'שָׁכֵן désigne celui qui habite à proximité. La préposition ל marque ici la relation : il est devenu un objet de mépris aux yeux de ses voisins.'
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Conserver « l’ » et « il » sans préciser le référent.
  alternative: Identifier explicitement le roi davidique, l’oint ou le peuple représenté par le roi.
  rationale: Le contexte vise la chute du roi davidique ou de l’oint, mais le verset lui-même ne donne qu’un référent pronominal masculin singulier. La traduction préserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en deux propositions parallèles est conservée, ainsi que le passage du pillage concret au mépris social.
