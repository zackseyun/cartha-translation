  text: אָ֤ז דִּבַּ֥רְתָּֽ בְ/חָ֡זוֹן לַֽ/חֲסִידֶ֗י/ךָ וַ/תֹּ֗אמֶר שִׁוִּ֣יתִי עֵ֭זֶר עַל גִּבּ֑וֹר הֲרִימ֖וֹתִי בָח֣וּר מֵ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: fr
  text: 'Alors, tu as parlé dans une vision à ceux qui te sont fidèles[a] et tu as dit : « J’ai accordé mon aide à un homme puissant[b] ; j’ai élevé un homme choisi[c] du milieu du peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre lecture reflétée dans certaines versions : « à celui qui t’est fidèle ».'
    reason: textual_variant
  - marker: b
    text: L’expression peut aussi se traduire par « un guerrier », « un héros » ou « un homme vaillant ».
    reason: lexical_alternative
  - marker: c
    text: Le mot peut aussi désigner « un jeune homme » ; dans ce contexte, il est compris au sens de « choisi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Introduit naturellement en français la séquence temporelle du discours poétique.
- source_word: בְחָזוֹן
  choice: dans une vision
  rationale: Exprime le cadre ou le moyen de la révélation sans préciser davantage le rapport prépositionnel.
- source_word: לַחֲסִידֶיךָ
  choice: à ceux qui te sont fidèles
  rationale: Rend le pluriel du texte fourni et la notion de fidélité ou de piété attachée à חָסִיד, sans employer un terme ecclésiastique comme « saints ».
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: J’ai accordé mon aide à
  rationale: Formulation française naturelle qui conserve l’idée d’une aide placée ou conférée à quelqu’un, sans reproduire servilement la construction hébraïque avec « sur ».
- source_word: גִּבּוֹר
  choice: un homme puissant
  rationale: Conserve le masculin singulier et la notion générale de puissance, tout en laissant en note les nuances plus militaires ou héroïques.
- source_word: הֲרִימוֹתִי
  choice: j’ai élevé
  rationale: Rend le causatif de רום et convient à l’élévation d’un homme à une dignité royale.
- source_word: בָּחוּר
  choice: un homme choisi
  rationale: Dans ce contexte de sélection et d’élévation divines, le sens « choisi » convient au parallélisme, tandis que le sens possible « jeune homme » est signalé en note.
- source_word: מֵעָם
  choice: du milieu du peuple
  rationale: Exprime clairement l’origine et la sélection au sein du peuple.
theological_decisions:
- issue: Référent davidique et portée messianique possible
  choice: La traduction reste au niveau du référent davidique immédiat sans expliciter une lecture messianique.
  alternative: Rendre le verset de manière à signaler directement un accomplissement messianique au-delà de David.
  rationale: Le contexte du psaume concerne l’alliance avec David. Une lecture typologique demeure possible, mais elle ne doit pas être ajoutée au texte du verset.
- issue: Nombre de לַחֲסִידֶיךָ
  choice: Le pluriel « ceux qui te sont fidèles » suit le texte massorétique fourni.
  alternative: Le singulier « celui qui t’est fidèle », attesté par une autre tradition de lecture reflétée dans certaines versions.
  rationale: Le pluriel est directement attesté par la forme du WLC fourni ; l’autre lecture mérite toutefois d’être conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. La formulation privilégie une syntaxe française naturelle tout en conservant le parallélisme des deux déclarations divines.
