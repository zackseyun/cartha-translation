  text: לֹֽא יַשִּׁ֣א אוֹיֵ֣ב בּ֑/וֹ וּ/בֶן עַ֝וְלָ֗ה לֹ֣א יְעַנֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: fr
  text: Aucun ennemi ne lui imposera aucun tribut[a], et aucun homme injuste[b] ne l’opprimera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi signifier « le trompera », « abusera de lui » ou « lui imposera une charge ». Le contexte d’oppression hostile favorise ici l’idée d’un tribut imposé.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « fils de l’injustice », expression hébraïque désignant un homme injuste ou un malfaiteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: imposera de tribut
  rationale: Le hiphil de נשׁא peut évoquer ici le fait d’exiger ou d’imposer une charge, notamment un tribut. Le parallélisme avec « opprimera » et le contexte de protection royale favorisent l’idée d’une exploitation politique ou économique, sans exclure entièrement les autres sens possibles.
- source_word: אוֹיֵב
  choice: ennemi
  rationale: Équivalent français courant et précis du nom singulier, adapté au cadre royal et conflictuel du psaume.
- source_word: בּוֹ
  choice: lui
  rationale: Avec « imposer un tribut », la construction française naturelle est « imposer un tribut à quelqu’un », rendue ici par le pronom indirect « lui ».
- source_word: בֶן עַוְלָה
  choice: homme injuste
  rationale: L’expression hébraïque signifie littéralement « fils de l’injustice » et désigne idiomatiquement une personne caractérisée par l’injustice ou le mal. La formulation française retenue est claire et naturelle, tandis que l’image littérale est conservée en note.
- source_word: עַוְלָה
  choice: injuste
  rationale: Le nom peut désigner l’injustice, le mal ou la perversité. Dans l’expression idiomatique, « homme injuste » rend clairement la conduite moralement mauvaise et oppressive visée ici.
- source_word: יְעַנֶּנּוּ
  choice: ne l’opprimera
  rationale: Le piel de ענה exprime ici l’action d’affliger, d’humilier ou d’opprimer. « Opprimer » s’accorde particulièrement bien avec le parallélisme de l’exploitation hostile dans le premier membre.
theological_decisions:
- issue: Identité de l’homme protégé
  choice: Conserver le pronom masculin singulier « lui / le » sans préciser son identité.
  alternative: Nommer explicitement David, le roi davidique ou le Messie.
  rationale: Dans son contexte immédiat, l’hébreu renvoie à la figure royale singulière évoquée dans le psaume. La traduction préserve ce référent sans imposer une identification théologique plus étroite ou ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est maintenu, avec une formulation idiomatique dans le texte et les traits plus littéraux ou ambigus signalés en notes.
