id: PSA.89.4
reference: Psalms 89:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד ע֭וֹלָם אָכִ֣ין זַרְעֶ֑/ךָ וּ/בָנִ֨יתִי לְ/דֹר וָ/ד֖וֹר כִּסְאֲ/ךָ֣ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: fr
  text: J’affermirai ta descendance pour toujours[a], et je bâtirai ton trône de génération en génération. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ta semence » ; le singulier hébreu peut désigner collectivement les descendants.
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est probablement une indication musicale ou liturgique, mais son sens précis est incertain.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression marque une durée indéfiniment prolongée, voire perpétuelle. « Pour toujours » est naturel en français moderne et convient au contexte de l’alliance.
- source_word: אָכִין
  choice: J’affermirai
  rationale: Le hifil de כון signifie rendre ferme ou établir. « Affermirai » conserve l’idée de solidité et s’accorde naturellement avec la promesse dynastique.
- source_word: זַרְעֶךָ
  choice: ta descendance
  rationale: Le singulier collectif זֶרַע désigne ici la postérité. « Descendance » rend ce sens collectif sans l’étrangeté que produirait « semence » en français contemporain.
- source_word: וּבָנִיתִי
  choice: et je bâtirai
  rationale: Bien que la forme soit un accompli, le parallélisme avec le verbe précédent lui donne ici une valeur future. « Bâtirai » préserve la métaphore architecturale appliquée au trône.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette tournure française idiomatique exprime la continuité au fil des générations et respecte la répétition hébraïque.
- source_word: כִּסְאֲךָ
  choice: ton trône
  rationale: Dans ce contexte royal, le terme désigne le trône et, par métonymie, la royauté dynastique.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis de ce terme liturgique ou musical reste incertain ; sa translittération évite d’imposer une interprétation.
theological_decisions:
- issue: Portée de la promesse dynastique dans le contexte de l’alliance royale
  choice: Conserver l’adresse directe au roi davidique et le langage de la descendance et du trône
  alternative: Expliciter un accomplissement messianique dans le corps du verset, ou réduire le propos à une promesse générale de postérité
  rationale: L’hébreu formule directement une promesse royale et dynastique. La traduction ne doit ni introduire explicitement un accomplissement ultérieur ni effacer la portée liée à l’alliance.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur est explicité dans les deux membres parallèles. « Affermirai » distingue le premier verbe de « bâtirai » et maintient à la fois l’idée de stabilité et la métaphore architecturale.
