source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י בַ/יָּ֣ם יָד֑/וֹ וּֽ/בַ/נְּהָר֥וֹת יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/025.yaml
  text: I will set his hand on the sea[a], and his right hand on the rivers.
translation:
  language: fr
  text: Je poserai sa main sur la mer[a], et sa main droite sur les fleuves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je placerai sa main au-dessus de la mer, et sa main droite au-dessus des fleuves » — l’image exprime probablement la domination ou l’étendue de son pouvoir.'
    reason: Alternative lexicale et explicitation possible de la portée de l’image.
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je poserai
  rationale: Le qal accompli à la première personne du singulier, précédé de la conjonction, prend ici une valeur future dans le contexte de la promesse. « Poserai » conserve l’image concrète sans expliciter prématurément l’idée de domination.
- source_word: בַיָּם
  choice: sur la mer
  rationale: La préposition ב, dans cette image royale, peut désigner la sphère sur laquelle la main est posée. « Sur la mer » reste proche de l’hébreu, tandis que « au-dessus de la mer » rendrait la domination plus explicite.
- source_word: יָדוֹ
  choice: sa main
  rationale: Le terme concret est conservé afin de préserver la métaphore poétique de la puissance et de l’étendue du règne.
- source_word: וּבַנְּהָרוֹת
  choice: et ... sur les fleuves
  rationale: Le pluriel נְהָרוֹת désigne des fleuves ou des rivières. « Fleuves » convient au registre poétique et au parallèle géographique avec « la mer »; la préposition est répétée pour restituer la structure hébraïque.
- source_word: יְמִינוֹ
  choice: sa main droite
  rationale: La traduction littérale maintient le parallélisme avec « sa main » ainsi que les connotations de force et d’autorité associées à la droite.
theological_decisions:
- issue: Image royale de domination
  choice: Conserver l’image concrète de la main et de la main droite posées sur la mer et les fleuves.
  alternative: J’étendrai son pouvoir sur la mer, et sa puissance sur les fleuves.
  rationale: Le verset évoque vraisemblablement l’étendue du règne accordé au roi par Dieu, mais l’hébreu l’exprime par une métaphore corporelle. La traduction préserve cette image et laisse son implication se dégager du contexte.
translation_notes:
  register: Français moderne, clair et soutenu. Le parallélisme poétique de l’hébreu est conservé, ainsi que l’ambiguïté entre position concrète et domination symbolique.
