  source_fidelity: 'Le sens fondamental est bien rendu : כי introduit la justification, et les deux groupes avec ל sont présentés comme parallèles et relationnels/possessifs. « Bouclier », « roi » et « le Saint d’Israël » respectent l’imagerie et le titre hébreux. La traduction ne tranche pas indûment le référent métaphorique de « notre bouclier ».'
