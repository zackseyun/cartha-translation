  text: כִּ֣י לַֽ֭/יהוָה מָֽגִנֵּ֑/נוּ וְ/לִ/קְד֖וֹשׁ יִשְׂרָאֵ֣ל מַלְכֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: fr
  text: 'Car notre bouclier appartient au SEIGNEUR[a],

    et notre roi appartient au Saint d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique et présente un fort parallélisme. On peut aussi traduire : « Car notre bouclier est celui du SEIGNEUR, et notre roi appartient au Saint d’Israël. » Le terme « bouclier » peut évoquer le roi en tant que protecteur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange et de l’assurance exprimées dans le contexte précédent, sans renforcer indûment l’affirmation.
- source_word: לַיהוָה
  choice: appartient au SEIGNEUR
  rationale: Le ל préfixé exprime ici vraisemblablement l’appartenance ou la relation. « Appartient au » rend en français l’ellipse hébraïque tout en conservant le parallèle avec le second membre. Le nom divin יהוה est rendu par « le SEIGNEUR ».
- source_word: מָגִנֵּנוּ
  choice: notre bouclier
  rationale: Le sens concret de « bouclier » préserve l’image poétique, qui peut désigner une protection ou, dans ce contexte royal, le roi protecteur.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: et notre roi au Saint d’Israël
  rationale: Le second ל est parallèle au premier et marque pareillement l’appartenance ou la relation. L’ordre des mots est adapté au français sans effacer le parallélisme.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette formulation conserve le titre divin reconnu et sa dignité, sans le paraphraser.
- source_word: מַלְכֵּנוּ
  choice: notre roi
  rationale: Le nom signifie directement « roi » et maintient l’imagerie royale ainsi que la possible référence au représentant humain d’Israël.
theological_decisions:
- issue: Référent de « notre bouclier » et de « notre roi »
  choice: La traduction présente le bouclier et le roi d’Israël comme appartenant à Dieu, conformément aux deux constructions parallèles avec ל.
  alternative: Comprendre « notre bouclier » comme une désignation directe de Dieu, tandis que « notre roi » désignerait le roi humain.
  rationale: Le parallélisme « au SEIGNEUR notre bouclier // au Saint d’Israël notre roi » favorise l’idée d’appartenance, mais l’ellipse hébraïque et l’usage métaphorique de « bouclier » laissent subsister une ambiguïté. La note la signale sans imposer une résolution doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux membres est conservé, avec une ellipse naturelle dans le second. « SEIGNEUR » en petites capitales typographiques est représenté ici par des capitales pour signaler le nom divin.
