  terminology: « SEIGNEUR » convient pour יהוה dans la convention typographique indiquée. « Le Saint d’Israël » est une traduction établie et sobre de קדוש ישראל. « Notre roi » conserve à juste titre le terme royal sans le réduire à « dirigeant ».
