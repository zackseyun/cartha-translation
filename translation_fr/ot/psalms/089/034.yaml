  text: לֹא אֲחַלֵּ֥ל בְּרִיתִ֑/י וּ/מוֹצָ֥א שְׂ֝פָתַ֗/י לֹ֣א אֲשַׁנֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: fr
  text: Je ne violerai pas mon alliance[a], je ne changerai pas ce qui est sorti de mes lèvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne profanerai pas mon alliance » ou « je ne romprai pas mon alliance ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « la sortie de mes lèvres », c’est-à-dire ce que j’ai prononcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: profanerai
  rationale: Le piel de חלל signifie ici profaner ou violer. « Profaner » conserve la force du terme hébreu et son association avec ce qui est sacré, tout en laissant la note signaler les équivalents contextuels plus idiomatiques.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: בְּרִית est le terme biblique habituel désignant une alliance solennelle; le suffixe de première personne est conservé.
- source_word: מוֹצָא שְׂפָתַי
  choice: ce qui est sorti de mes lèvres
  rationale: Cette formulation préserve l'image hébraïque littérale du « sortir » des lèvres tout en restant compréhensible en français; elle désigne ce qui a été prononcé.
- source_word: אֲשַׁנֶּה
  choice: changerai
  rationale: Le piel de שנה signifie changer ou modifier. « Changer » est naturel et exact pour une parole déjà prononcée.
- source_word: לֹא ... לֹא
  choice: Je ne… pas et je ne… pas
  rationale: La répétition des deux négations est maintenue afin de préserver le parallélisme emphatique de l'hébreu.
theological_decisions:
- issue: Nature de l’engagement divin
  choice: Conserver le langage concret de l’alliance et de la parole prononcée sans l’élargir en formulation doctrinale sur l’immutabilité divine.
  alternative: Je ne romprai pas ma promesse et je ne reviendrai pas sur ma parole.
  rationale: Le texte parle précisément de l’alliance de Dieu et de ce qui est sorti de ses lèvres. La traduction garde ces images et cette terminologie sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébreu et l’image des lèvres sont conservés; « profaner » maintient la gravité du verbe source, avec des équivalents contextuels en note.
