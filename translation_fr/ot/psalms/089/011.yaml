source:
  edition: WLC
  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: fr
  text: Les cieux sont à toi ; la terre aussi est à toi[a]. Le monde et tout ce qui le remplit, c’est toi qui les as fondés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa plénitude », c’est-à-dire tout ce qui est dans le monde.'
    reason: Alternative lexicale pour מְלֹאָהּ ; elle conserve l’ancre de la piste d’audit tout en expliquant le sens de l’expression littérale.
lexical_decisions:
- source_word: לְךָ
  choice: à toi sont / à toi aussi la terre
  rationale: La préposition לְ avec le suffixe de 2e personne masculine singulière marque ici la possession. La tournure « à toi sont » conserve le parallélisme poétique et reste intelligible en français soutenu.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel français traditionnel et encore courant dans le registre poétique rend le pluriel hébreu et désigne le domaine céleste.
- source_word: אַף
  choice: aussi
  rationale: 'La particule étend l’affirmation des cieux à la terre : celle-ci appartient elle aussi à Dieu.'
- source_word: אָרֶץ
  choice: la terre
  rationale: Le parallèle avec les cieux, puis la mention du monde, indique le sens cosmique plutôt que celui d’un pays particulier.
- source_word: תֵּבֵל
  choice: le monde
  rationale: Le terme désigne la terre comme monde ordonné et habité ; « le monde » est naturel et précis dans ce contexte.
- source_word: מְלֹאָהּ
  choice: tout ce qui le remplit
  rationale: Littéralement « sa plénitude », l’expression désigne tout ce que contient le monde. Cette formulation actuelle préserve l’image de ce qui remplit le monde sans l’opacité de « sa plénitude ».
- source_word: יְסַדְתָּם
  choice: c’est toi qui les as fondés
  rationale: Le verbe יסד évoque l’action de poser des fondations ou d’établir. Le pluriel suffixé est conservé par « les », qui reprend « le monde et tout ce qui le remplit » ; la dislocation emphatique rend l’accent porté par אַתָּה.
theological_decisions:
- issue: Possession divine et action créatrice
  choice: Affirmer à la fois que les cieux et la terre appartiennent à Dieu et qu’il a fondé le monde avec tout ce qu’il contient.
  alternative: Expliciter une création à partir de rien, ou réduire יְסַדְתָּם à une simple domination royale.
  rationale: Le texte exprime directement la possession et l’action fondatrice, sans préciser davantage le mode de création. La traduction n’ajoute donc aucune formulation doctrinale étrangère au verset.
translation_notes:
  register: Français moderne, digne et poétique. L’inversion « À toi sont les cieux » reproduit l’emphase initiale de l’hébreu sans devenir obscure ; la seconde proposition omet naturellement la copule, comme le permet le parallélisme français.
