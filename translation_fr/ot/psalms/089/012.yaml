source:
  edition: WLC
  text: צָפ֣וֹן וְ֭/יָמִין אַתָּ֣ה בְרָאתָ֑/ם תָּב֥וֹר וְ֝/חֶרְמ֗וֹן בְּ/שִׁמְ/ךָ֥ יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/012.yaml
  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: fr
  text: Le nord et le sud[a], c’est toi qui les as créés ; le Thabor et l’Hermon chantent de joie[b] en ton nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le nord et le côté droit ». Dans cette manière de s’orienter, le côté droit désigne vraisemblablement le sud.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « poussent des cris de joie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: le nord
  rationale: Le nom commun désigne normalement le nord ou la région septentrionale. Ici, son association avec יָמִין forme vraisemblablement un couple géographique englobant.
- source_word: יָמִין
  choice: le sud
  rationale: Le mot signifie littéralement « main droite » ou « côté droit », mais peut désigner le sud selon l’orientation géographique ancienne. Avec צָפוֹן, « le nord et le sud » exprime naturellement l’étendue du monde créé.
- source_word: בְרָאתָם
  choice: c’est toi qui les as créés
  rationale: Le qal accompli à la 2e personne masculine du singulier, avec suffixe objet pluriel, affirme l’action créatrice de Dieu. La tournure emphatique française rend la présence explicite du pronom sujet hébreu אַתָּה.
- source_word: תָּבוֹר
  choice: le Thabor
  rationale: Nom propre géographique, rendu selon sa forme française traditionnelle ; l’article est naturel devant ce nom de montagne.
- source_word: חֶרְמוֹן
  choice: l’Hermon
  rationale: Nom propre géographique, translittéré selon l’usage français ; l’article convient au nom de la montagne.
- source_word: בְּשִׁמְךָ
  choice: en ton nom
  rationale: La préposition בְּ peut indiquer la sphère, le fondement ou l’occasion. « En ton nom » conserve cette relative ouverture tout en reliant la joie à l’identité et à la renommée de Dieu.
- source_word: יְרַנֵּנוּ
  choice: chantent de joie
  rationale: Le piel de רנן évoque des manifestations sonores et vibrantes de joie. « Chantent de joie » convient à la personnification poétique des montagnes, tandis que « poussent des cris de joie » demeure possible et est signalé en note.
theological_decisions:
- issue: Sens de יָמִין en parallèle avec צָפוֹן
  choice: 'Mérisme géographique : « le nord et le sud »'
  alternative: 'Sens spatial littéral : « le nord et le côté droit »'
  rationale: Dans ce contexte célébrant la création, le sens géographique produit un couple directionnel cohérent. La note conserve toutefois le sens littéral du terme hébreu.
- issue: Personnification du Thabor et de l’Hermon
  choice: Les montagnes sont présentées comme chantant de joie
  alternative: Les habitants de ces régions chantent de joie
  rationale: Le verbe pluriel s’accorde avec les deux noms de lieux pris ensemble, et la poésie des Psaumes personnifie fréquemment la création. La traduction maintient cette image sans la remplacer par une référence interprétative aux habitants.
translation_notes:
  register: Français international moderne, poétique et digne. La construction détachée « c’est toi qui » restitue l’insistance de אַתָּה. Les articles devant les noms de montagnes suivent l’usage idiomatique français.
