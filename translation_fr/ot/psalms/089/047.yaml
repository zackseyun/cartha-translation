  naturalness: « Souviens-toi combien ma vie est brève ! » est naturel, digne et poétique. « Pour quelle futilité as-tu créé » est une tournure calquée et peu naturelle en français moderne; « Pourquoi as-tu créé tous les êtres humains pour le néant ? » est plus fluide tout en gardant le registre de lamentation.
