source:
  edition: WLC
  text: זְכָר אֲנִ֥י מֶה חָ֑לֶד עַל מַה שָּׁ֝֗וְא בָּרָ֥אתָ כָל בְּנֵי אָדָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: fr
  text: Souviens-toi combien ma vie est brève ![a] Pourquoi as-tu créé tous les êtres humains pour le néant ?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est elliptique : « Souviens-toi : moi, quelle durée [de vie] ! » Il peut aussi se comprendre : « Souviens-toi de ce que je suis : combien [mon temps] est bref ! »'
    reason: ambiguïté syntaxique et rendu littéral
  - marker: b
    text: 'Littéralement : « tous les fils d’homme » ; cette expression désigne l’ensemble de l’humanité.'
    reason: idiome hébreu et portée générique
lexical_decisions:
- source_word: זְכָר
  choice: Souviens-toi
  rationale: Impératif masculin singulier adressé à Dieu ; cette formulation directe conserve la supplication.
- source_word: אֲנִי מֶה חָלֶד
  choice: combien ma vie est brève
  rationale: חֶלֶד désigne la durée ou le temps de la vie. Dans cette lamentation, מֶה donne à l’expression une force interrogative ou exclamative qui souligne la brièveté de la vie ; la note conserve la forme plus littérale et son ambiguïté.
- source_word: עַל מַה
  choice: Pour quelle
  rationale: Conserve la nuance de but ou de finalité du syntagme hébreu, plutôt que de la réduire à un simple « pourquoi ».
- source_word: שָּׁוְא
  choice: futilité
  rationale: Le terme évoque ce qui est vide, vain ou sans valeur. « Futilité » exprime ici le caractère apparemment vain de l’existence humaine sans faire de l’acte créateur lui-même un acte inutile.
- source_word: בָּרָאתָ
  choice: as-tu créé
  rationale: Verbe à la deuxième personne masculine singulière, avec Dieu pour sujet ; le passé composé convient à la question rhétorique en français moderne.
- source_word: כָל בְּנֵי אָדָם
  choice: tous les êtres humains
  rationale: L’expression idiomatique, littéralement « tous les fils d’Adam/de l’homme », désigne collectivement l’humanité. Le rendu retenu est naturel et inclusif en français, tandis que la forme hébraïque est signalée en note.
theological_decisions:
- issue: Portée générique de בְּנֵי אָדָם
  choice: tous les êtres humains
  alternative: tous les fils d’Adam / tous les fils de l’homme
  rationale: Le masculin hébreu est générique et vise l’ensemble de l’humanité, non les seuls hommes. Le texte principal rend explicitement cette portée, et la note préserve l’image littérale.
- issue: Valeur de la question sur la création humaine
  choice: Pour quelle futilité as-tu créé… ?
  alternative: Pourquoi as-tu créé en vain… ?
  rationale: 'Le choix retenu maintient la tension de la plainte : le psalmiste interroge la finalité apparente de la vie humaine sans affirmer que l’acte créateur de Dieu aurait réellement été vain.'
translation_notes:
  register: Français moderne, poétique et digne. « Futilité » conserve le vocabulaire de la lamentation tout en évitant l’ambiguïté courante de « vanité », qui peut évoquer l’orgueil. La ponctuation présente la seconde proposition comme une question rhétorique, conformément à עַל מַה.
