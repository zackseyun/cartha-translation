revisions:
- from: Les cieux célébreront tes merveilles, Yahweh, oui, ta fidélité dans l’assemblée des êtres saints[a].
  to: Les cieux célébreront tes merveilles, ô Yahweh ; ta fidélité aussi, dans l’assemblée des êtres saints[a].
  rationale: La révision remplace « oui » par « aussi », qui rend la valeur additive de אַף, et utilise un point-virgule pour conserver l’ellipse verbale poétique sans produire une syntaxe maladroite. La note est reformulée comme une véritable variante et conserve la prudence quant au référent des « êtres saints ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:31:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens des principaux termes est bien rendu : « les cieux », « merveilles », « fidélité », « assemblée » et le nom Yahweh correspondent au texte hébreu. « Êtres saints » préserve utilement sans la trancher l’identification des קדשים. Toutefois, « oui » ne relie pas naturellement les deux membres en français et rend moins clairement la valeur additive de אַף.'
  naturalness: La première proposition est naturelle et poétique. La séquence « Yahweh, oui, ta fidélité » est cependant heurtée en français actuel, car l’ellipse verbale et l’incise « oui » rendent la relation syntaxique incertaine. Une ponctuation qui maintient l’ellipse poétique tout en plaçant « aussi » avec le second membre est plus fluide.
  terminology: '« Yahweh », « fidélité » et « assemblée des êtres saints » conviennent au registre biblique et ne surinterprètent pas le référent des « saints ». La note actuelle est à corriger : « Littéralement “des saints” » n’est pas une présentation exacte du terme, qui signifie plus précisément « saints/êtres saints/saints ones » selon le contexte.'
  issues:
  - severity: medium
    issue: Rendu de אַף par « oui »
    rationale: Dans cette construction, אַף ajoute le second élément (« aussi », « également ») plutôt que de fonctionner simplement comme une affirmation « oui ». Le placement actuel nuit à la lisibilité du parallélisme.
  - severity: low
    issue: Formulation de la note
    rationale: La mention « Littéralement “des saints” » est imprécise et peut faire croire que le français « saints » épuise le sens du terme. Une note formulée comme variante respecte mieux l’ambiguïté du référent.
  revised_text: Les cieux célébreront tes merveilles, ô Yahweh ; ta fidélité aussi, dans l’assemblée des êtres saints[a].
