  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: fr
  text: Les cieux célébreront tes merveilles, ô Yahweh ; ta fidélité aussi, dans l’assemblée des êtres saints[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des saints » ; dans ce contexte, l’expression désigne probablement des êtres célestes.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: célébreront
  rationale: Le hifil de ידה exprime ici la louange. « Célébreront » s’emploie naturellement avec « merveilles » et conserve la nuance future de l’imparfait hébreu.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Cette formulation conserve le pluriel hébreu et le registre poétique biblique.
- source_word: פִּלְאֲךָ
  choice: tes merveilles
  rationale: Le nom désigne ce qui est extraordinaire, notamment les actes merveilleux de Dieu; le pluriel collectif convient au contexte de louange.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אַף
  choice: oui
  rationale: Ici, אַף renforce et prolonge le premier membre du vers; « oui » restitue cette insistance sans alourdir la poésie.
- source_word: אֱמוּנָתְךָ
  choice: ta fidélité
  rationale: Le terme désigne la constance et la fiabilité de Dieu.
- source_word: בִּקְהַל
  choice: dans l’assemblée des
  rationale: Cette traduction garde l’image concrète d’un groupe réuni.
- source_word: קְדֹשִׁים
  choice: êtres saints
  rationale: L’expression reste assez générale pour ne pas identifier explicitement ces figures comme des anges, tout en convenant au cadre céleste du passage.
theological_decisions:
- issue: Référent de קְדֹשִׁים
  choice: êtres saints, probablement célestes d’après le contexte
  alternative: les saints; les anges
  rationale: Le contexte proche évoque les cieux et le conseil céleste, mais le mot hébreu ne signifie pas explicitement « anges ». Le texte principal conserve donc une désignation générale, précisée avec prudence en note.
translation_notes:
  register: Français international actuel, poétique et digne. La structure parallèle et l’ellipse verbale du second membre sont conservées; « oui » marque l’intensification exprimée par אַף.
