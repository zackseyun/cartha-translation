  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: fr
  text: 'Car j’ai dit : « Pour toujours, l’amour fidèle sera bâti[a] ; dans les cieux, tu établiras ta fidélité. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’amour fidèle sera établi pour toujours ». Le verbe hébreu signifie littéralement « bâtir », mais peut aussi exprimer plus généralement l’idée d’établir fermement.'
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou l’affirmation du psalmiste et conserve la valeur causale du terme hébreu.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: Le parfait qal à la première personne du singulier se rend naturellement par le passé composé en français moderne.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Expression française courante qui restitue la durée indéfinie et durable indiquée ici.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: Cette expression réunit les dimensions d’amour et de loyauté durable du terme, sans le réduire à la seule compassion ni expliciter excessivement son cadre d’alliance.
- source_word: יִבָּנֶה
  choice: sera édifié
  rationale: Le nifal imparfait de בנה a un sens passif. « Sera édifié » conserve la métaphore architecturale tout en restant digne et intelligible.
- source_word: שָׁמַיִם
  choice: dans les cieux
  rationale: Le pluriel hébreu est conservé dans une formulation poétique française usuelle.
- source_word: תָּכִן
  choice: tu établiras
  rationale: La forme causative à la deuxième personne du masculin singulier exprime l’action de rendre ferme ou durable ; le futur convient au parallélisme de l’affirmation précédente.
- source_word: אֱמוּנָתְךָ
  choice: ta fidélité
  rationale: Le nom désigne ici la fermeté, la fiabilité et la fidélité de Dieu ; « fidélité » est l’équivalent français le plus naturel dans ce contexte.
- source_word: בָהֶם
  choice: dans les cieux
  rationale: Le pronom renvoie aux « cieux ». Le français exprime naturellement ce rapport en plaçant « dans les cieux » en tête de proposition, sans répéter « en eux ».
theological_decisions:
- issue: Portée de חֶסֶד dans ce contexte poétique
  choice: l’amour fidèle
  alternative: la bonté ; l’amour d’alliance ; la miséricorde
  rationale: « Amour fidèle » préserve à la fois l’affection et la loyauté durable associées au terme, sans imposer une formulation confessionnelle particulière.
- issue: Adresse directe à Dieu dans le second membre
  choice: tu établiras ta fidélité
  alternative: ta fidélité sera établie dans les cieux
  rationale: Le verbe et le suffixe possessif sont tous deux à la deuxième personne du masculin singulier ; l’adresse directe rend donc explicitement la grammaire hébraïque sans résoudre au-delà du texte la relation poétique entre les deux membres.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore de la construction est maintenue dans le texte principal, tandis que la note signale le sens plus général possible. L’ordre du premier membre conserve la mise en relief de « pour toujours ».
