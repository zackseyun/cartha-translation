  text: כָּרַ֣תִּֽי בְ֭רִית לִ/בְחִירִ֑/י נִ֝שְׁבַּ֗עְתִּי לְ/דָוִ֥ד עַבְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/003.yaml
  text: 'I have made a covenant with my chosen one[a]; I have sworn to David my servant:'
translation:
  language: fr
  text: '« J’ai conclu une alliance avec celui que j’ai choisi[a] ; j’ai prêté serment à David, mon serviteur : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « J’ai coupé une alliance avec celui que j’ai choisi. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי בְרִית
  choice: J’ai conclu une alliance
  rationale: L’expression hébraïque signifie littéralement « couper une alliance », mais « conclure une alliance » en restitue naturellement et dignement le sens idiomatique en français. Le passé composé convient à cette parole divine dont l’acte garde sa validité.
- source_word: לִבְחִירִי
  choice: avec celui que j’ai choisi
  rationale: Dans cette construction, ל marque le partenaire de l’alliance. La tournure verbale est claire en français moderne et conserve la désignation personnelle sans recourir au terme plus marqué « élu ».
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai prêté serment
  rationale: Le nifal de שׁבע exprime l’action solennelle de jurer. « Prêter serment » est une formulation française naturelle qui maintient la force de l’engagement.
- source_word: לְדָוִד
  choice: à David
  rationale: Après le verbe exprimant le serment, la préposition désigne naturellement son destinataire.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans le contexte de l’alliance royale, עבד désigne David dans son rapport de service envers Dieu ; « serviteur » est donc préférable à « esclave ».
theological_decisions:
- issue: Identité de « celui que j’ai choisi »
  choice: Conserver une désignation qui renvoie immédiatement à David dans le parallélisme du verset.
  alternative: Employer « mon élu » et lui donner explicitement une portée messianique.
  rationale: Le verset met en parallèle celui que Dieu a choisi et « David, mon serviteur ». Une portée typologique ou messianique éventuelle relève de l’interprétation et ne doit pas être imposée au texte français.
translation_notes:
  register: Français international moderne, naturel et digne. Le deux-points final est conservé, car la déclaration introduit la suite du discours divin.
