  source_fidelity: Le texte rend fidèlement la comparaison introduite par כְּ (« Comme la lune »), le verbe passif implicite (« il sera affermi »), la durée de עוֹלָם (« pour toujours »), ainsi que l’expression non identifiée « le témoin dans le ciel ». « Sélah » est correctement translittéré. Le singulier « ciel » correspond bien à בַּשַּׁחַק, dont le sens poétique peut couvrir le ciel, la voûte ou les nuées sans qu’il soit nécessaire de préciser davantage.
