source:
  edition: WLC
  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: fr
  text: Comme la lune[a], il sera affermi pour toujours, et le témoin dans le ciel est fidèle[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « telle la lune ».'
    reason: lexical_alternative
  - marker: b
    text: Le « témoin dans le ciel » est souvent compris comme étant la lune, qui atteste de manière constante la permanence de l’alliance.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Comme la lune
  rationale: Le préfixe כְּ marque la comparaison et יָרֵחַ désigne la lune. « Comme la lune » conserve la comparaison initiale dans un français naturel.
- source_word: יִכּוֹן
  choice: il sera affermi
  rationale: Le niphal inaccompli de כון exprime ici le fait d’être établi ou rendu stable. « Sera affermi » préserve la valeur passive et l’idée de stabilité durable; le pronom reprend le trône ou la réalité dynastique évoquée dans le contexte précédent sans l’expliciter davantage que l’hébreu.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Dans ce contexte poétique et lié à l’alliance, le terme exprime une permanence durable. « Pour toujours » est clair, digne et idiomatique.
- source_word: וְעֵד
  choice: et le témoin
  rationale: עֵד signifie « témoin ». L’article défini français présente le témoin céleste comme identifiable dans le contexte, tout en laissant son identité non précisée.
- source_word: בַּשַּׁחַק
  choice: dans le ciel
  rationale: שַׁחַק peut désigner poétiquement le ciel, la voûte céleste ou les nuées. Le singulier « dans le ciel » rend sobrement le cadre céleste sans imposer les nuages.
- source_word: נֶאֱמָן
  choice: est fidèle
  rationale: L’adjectif exprime la sûreté, la fiabilité et la fidélité. « Fidèle » conserve à la fois l’idée de fiabilité et la résonance liée à l’alliance.
- source_word: סֶלָה
  choice: Sélah
  rationale: La fonction exacte du terme demeure incertaine; il est donc translittéré selon l’usage biblique français plutôt que traduit conjecturalement.
theological_decisions:
- issue: Référent du sujet implicite de יִכּוֹן
  choice: Employer « il » sans répéter explicitement « son trône » ou « sa descendance ».
  alternative: Rendre « son trône sera affermi » ou « sa descendance sera affermie ».
  rationale: Le sujet est fourni par le contexte immédiat mais n’est pas exprimé dans ce membre de phrase. Le pronom masculin, naturellement rattaché au « trône » du verset précédent, maintient la concision du texte et évite de trancher explicitement entre les éléments dynastiques étroitement associés.
- issue: Identité du témoin céleste
  choice: Conserver l’expression générale « le témoin dans le ciel ».
  alternative: Identifier explicitement ce témoin à la lune, à l’arc-en-ciel ou à un autre signe céleste.
  rationale: L’hébreu ne nomme pas directement le témoin. La traduction maintient cette ambiguïté, tandis qu’une note signale l’interprétation fréquente selon laquelle il s’agit de la lune.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. « Affermi » garde la solennité du psaume sans archaïsme marqué; « Sélah » est conservé comme terme liturgique non traduit.
