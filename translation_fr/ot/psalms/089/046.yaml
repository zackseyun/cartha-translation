id: PSA.89.46
reference: Psalms 89:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תִּסָּתֵ֣ר לָ/נֶ֑צַח תִּבְעַ֖ר כְּמוֹ אֵ֣שׁ חֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/046.yaml
  text: How long[a], O Yahweh? Will you hide yourself forever? Will your wrath burn like fire?
translation:
  language: fr
  text: Jusqu’à quand, Yahweh[a] ? Te cacheras-tu pour toujours ? Ta fureur brûlera-t-elle comme un feu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָה
  choice: Jusqu’à quand
  rationale: Formule de lamentation qui exprime avec urgence la durée de l’épreuve ; cette tournure est naturelle en français et conserve la force de la plainte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération courante du nom divin, qui préserve ici l’adresse personnelle au Dieu d’Israël plutôt que de lui substituer un titre.
- source_word: תִּסָּתֵר
  choice: te cacheras-tu
  rationale: 'Le nifal de סתר peut être rendu ici de manière réfléchie : le psalmiste éprouve Dieu comme se dérobant à lui.'
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Expression française claire et naturelle de la durée indéfinie évoquée par le texte.
- source_word: תִּבְעַר
  choice: brûlera-t-elle
  rationale: Le verbe signifie « brûler » et s’accorde avec חֲמָתֶךָ ; ce choix maintient la métaphore sans préciser indûment ses effets.
- source_word: כְּמוֹ אֵשׁ
  choice: comme un feu
  rationale: Rend directement la comparaison entre la fureur divine et le feu dans un français idiomatique.
- source_word: חֲמָתֶךָ
  choice: ta fureur
  rationale: Le nom évoque une colère ardente et intense ; « fureur » conserve cette force tout en convenant au registre poétique du psaume.
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre, tandis que « le SEIGNEUR » représente la lecture traditionnelle, signalée en note.
- issue: Portée de « pour toujours »
  choice: 'Une question distincte : « Te cacheras-tu pour toujours ? »'
  alternative: 'Rattacher « pour toujours » à la question initiale : « Jusqu’à quand te cacheras-tu ? Pour toujours ? »'
  rationale: La ponctuation retenue suit naturellement la structure interrogative du verset tout en laissant intacte la tension rhétorique de la lamentation.
translation_notes:
  register: Français moderne, direct et digne, avec trois questions brèves qui conservent l’urgence de la lamentation. L’espace avant les points d’interrogation suit la typographie française.
