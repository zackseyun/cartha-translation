id: PSA.89.40
reference: Psalms 89:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: fr
  text: Tu as abattu toutes ses murailles[a] ; tu as réduit ses places fortes[b] à l’état de ruines[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes ses enceintes », « toutes ses clôtures » ou « toutes ses haies ». Le terme hébreu peut désigner diverses sortes de barrières protectrices.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses forteresses » ou « ses ouvrages fortifiés ».
    reason: lexical_alternative
  - marker: c
    text: Ou « à la destruction » ; le nom hébreu peut aussi évoquer l’effondrement, la terreur ou la consternation.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: as abattu
  rationale: Le verbe פרץ exprime ici l’action d’ouvrir une brèche ou de démanteler une enceinte. « Abattre » restitue naturellement en français la destruction des défenses, sans imposer une image militaire plus précise que l’hébreu.
- source_word: כָל
  choice: toutes
  rationale: Ce choix conserve explicitement l’idée de totalité.
- source_word: גְּדֵרֹתָיו
  choice: ses murailles
  rationale: גְּדֵרָה peut désigner un mur, une clôture, une haie ou toute enceinte protectrice. « Murailles » convient au parallélisme avec les places fortes et au contexte de défenses renversées.
- source_word: שַׂמְתָּ
  choice: as réduit … à l’état de
  rationale: שׂים signifie largement « placer, établir, rendre ». Cette tournure française exprime idiomatiquement le changement d’état indiqué par la construction hébraïque.
- source_word: מִבְצָרָיו
  choice: ses places fortes
  rationale: מִבְצָר désigne un lieu fortifié. « Places fortes » garde cette portée sans supposer nécessairement des forteresses d’un type précis.
- source_word: מְחִתָּה
  choice: ruines
  rationale: Dans ce contexte, le nom évoque la destruction ou l’état de ce qui est brisé. « À l’état de ruines » s’accorde avec le parallélisme des murailles abattues, tout en signalant en note les autres valeurs possibles.
theological_decisions:
- issue: Référent des suffixes masculins singuliers (« ses ») dans la lamentation du Psaume 89 sur le roi davidique et l’alliance
  choice: Conserver le pronom possessif masculin singulier « ses » sans préciser son référent dans le texte principal.
  alternative: Expliciter « les murailles du roi » ou comprendre ces défenses collectivement comme celles de Sion/Jérusalem.
  rationale: L’hébreu emploie des suffixes de troisième personne masculine singulière. Le contexte immédiat vise l’oint davidique, mais expliciter davantage résoudrait une part de l’ambiguïté poétique que le texte laisse subsister.
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. Le passé composé rend naturellement les accomplis hébreux dans cette lamentation, tandis que le parallélisme des deux propositions est conservé.
