id: PSA.89.33
reference: Psalms 89:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ֭/חַסְדִּ/י לֹֽא אָפִ֣יר מֵֽ/עִמּ֑/וֹ וְ/לֹֽא אֲ֝שַׁקֵּ֗ר בֶּ/אֱמוּנָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/033.yaml
  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: fr
  text: Mais je ne lui retirerai pas mon amour fidèle[a], et je ne trahirai pas ma fidélité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon amour constant », « mon amour d’alliance » ou « ma bonté fidèle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne manquerai pas à ma fidélité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Mais
  rationale: Dans le contexte, la conjonction introduit un contraste avec le châtiment annoncé aux versets précédents.
- source_word: חַסְדִּי
  choice: mon amour fidèle
  rationale: חֶסֶד exprime ici un amour loyal et durable, lié à l’engagement de Dieu, sans réduire le terme à la seule miséricorde.
- source_word: אָפִיר
  choice: je ne retirerai pas
  rationale: Le hiphil de פור avec מֵעִמּוֹ indique que Dieu ne fera pas disparaître ou ne soustraira pas son amour à la personne concernée.
- source_word: מֵעִמּוֹ
  choice: je ne lui retirerai pas
  rationale: La tournure française avec le pronom indirect « lui » rend naturellement l’idée de séparation exprimée par la préposition hébraïque.
- source_word: אֲשַׁקֵּר
  choice: je ne trahirai pas
  rationale: Le piel de שׁקר désigne ici une conduite fausse ou trompeuse, et non seulement un mensonge verbal. « Trahir » s’emploie naturellement avec « fidélité » tout en exprimant le manquement à celle-ci.
- source_word: בֶּאֱמוּנָתִי
  choice: ma fidélité
  rationale: אֱמוּנָה désigne la fiabilité ou la fidélité de Dieu. Le complément direct après « trahir » transpose idiomatiquement la relation exprimée par ב.
theological_decisions:
- issue: Langage d’alliance concernant l’engagement de Dieu envers le roi davidique
  choice: Conserver les notions d’« amour fidèle » et de « fidélité »
  alternative: Employer « bonté » ou « miséricorde », et « vérité »
  rationale: Le verset affirme que le châtiment divin n’annule pas l’attachement loyal de Dieu. Cette formulation maintient la tension entre discipline et fidélité sans importer une construction doctrinale ultérieure.
- issue: Portée de שׁקר appliqué à la fidélité divine
  choice: « je ne trahirai pas ma fidélité »
  alternative: « je n’agirai pas faussement dans ma fidélité » ou « je ne manquerai pas à ma fidélité »
  rationale: La formulation retenue est naturelle en français et exprime une conduite contraire à la fidélité, sans limiter le verbe à un mensonge prononcé. La note conserve une autre formulation idiomatique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est naturelle sans effacer le parallélisme entre l’amour fidèle et la fidélité de Dieu.
