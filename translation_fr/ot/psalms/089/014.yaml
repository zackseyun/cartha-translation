source:
  edition: WLC
  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: fr
  text: La justice et le droit sont le fondement de ton trône ; l’amour fidèle et la vérité marchent devant toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils précèdent ta face ».'
    reason: La note conserve l’image concrète de l’hébreu פָנֶיךָ et reflète plus exactement la construction avec יְקַדְּמוּ, rendue idiomatiquement par « marchent devant toi » dans le texte.
lexical_decisions:
- source_word: צֶדֶק
  choice: la justice
  rationale: Dans ce parallélisme, צֶדֶק désigne la rectitude conforme à ce qui est juste. « La justice » est naturel en français et reste distinct de « le droit », qui rend la dimension judiciaire de מִשְׁפָּט.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Associé à צֶדֶק, le terme évoque l’exercice juste du jugement et l’ordre juridique. « Le droit » préserve mieux la distinction du binôme que la répétition de « justice ».
- source_word: מְכוֹן
  choice: le fondement
  rationale: Le nom désigne une base ou un lieu solidement établi ; avec un trône, « fondement » restitue clairement la métaphore.
- source_word: כִּסְאֶךָ
  choice: ton trône
  rationale: Rendu direct de la métaphore royale et du suffixe masculin singulier de deuxième personne.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: Cette expression rend la bonté loyale, durable et relationnelle de חֶסֶד sans recourir à un terme archaïque ni ajouter explicitement l’idée d’alliance.
- source_word: אֱמֶת
  choice: la vérité
  rationale: אֱמֶת peut exprimer la vérité, la fiabilité ou la fidélité. « Vérité » conserve ici l’ampleur sémantique et le binôme traditionnel avec חֶסֶד, tandis que la nuance de fidélité demeure possible.
- source_word: יְקַדְּמוּ
  choice: marchent devant
  rationale: Le verbe signifie aller devant ou se présenter au-devant. « Marchent devant » est naturel dans l’image poétique de qualités qui précèdent le roi.
- source_word: פָנֶיךָ
  choice: toi
  rationale: Littéralement « ta face », mais devant ta face signifie idiomatiquement « devant toi ». Le texte principal privilégie un français naturel, et l’image concrète est signalée en note.
theological_decisions:
- issue: Rendu du couple חֶסֶד וֶאֱמֶת
  choice: l’amour fidèle et la vérité
  alternative: la bonté et la fidélité
  rationale: Le choix conserve la richesse relationnelle de חֶסֶד tout en laissant à אֱמֶת son sens premier de vérité, sans réduire le binôme à une seule interprétation covenantale.
- issue: Rendu de פָנֶיךָ
  choice: devant toi
  alternative: devant ta face
  rationale: « Devant toi » communique naturellement l’idée de présence en français moderne. La note préserve la formulation concrète de l’hébreu et son image poétique.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme nominal est conservé, ainsi que la métaphore royale du trône et le mouvement personnifié de l’amour fidèle et de la vérité.
