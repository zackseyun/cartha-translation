  text: וּ/פָקַדְתִּ֣י בְ/שֵׁ֣בֶט פִּשְׁעָ֑/ם וּ/בִ/נְגָעִ֥ים עֲוֺנָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: fr
  text: Alors je punirai leur révolte avec le bâton[a], et leur faute avec des coups.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je visiterai leur révolte avec le bâton… et leur faute avec des plaies ». Le verbe hébreu peut signifier « visiter » au sens de s’occuper de quelqu’un ou de lui demander des comptes; dans ce contexte, il exprime le châtiment. Le mot rendu par « coups » peut aussi désigner des « plaies » ou des « afflictions ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Alors je punirai
  rationale: Dans ce contexte de discipline, פקד exprime une intervention punitive. « Alors » rend naturellement la conséquence liée à la condition énoncée dans les versets précédents.
- source_word: בְשֵׁבֶט
  choice: par le bâton
  rationale: שֵׁבֶט peut désigner un bâton, une verge ou un sceptre. Ici, il s’agit clairement d’un instrument de discipline; « bâton » conserve l’image concrète en français actuel.
- source_word: פִּשְׁעָם
  choice: leur révolte
  rationale: פֶּשַׁע désigne une transgression conçue comme rupture ou rébellion. « Révolte » distingue ce terme de עָוֹן dans le membre parallèle et en garde la force.
- source_word: וּבִנְגָעִים
  choice: et … par des coups
  rationale: נֶגַע peut signifier atteinte, plaie ou coup. En parallèle avec le bâton, « coups » exprime naturellement le châtiment infligé sans limiter le sens à la maladie.
- source_word: עֲוֹנָם
  choice: leur faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » est clair, moralement marqué et naturel dans ce parallélisme poétique.
theological_decisions:
- issue: Nature de la réponse divine au péché des membres de l’alliance
  choice: Conserver l’image explicite d’un châtiment disciplinaire réel.
  alternative: Atténuer le propos en parlant seulement de correction ou d’intervention.
  rationale: Le bâton et les coups constituent des images punitives concrètes. La traduction ne les adoucit pas, mais n’ajoute aucune conclusion concernant un rejet définitif, question que le contexte plus large traite séparément.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation garde le parallélisme hébreu, l’image corporelle de la discipline et la distinction entre פֶּשַׁע et עָוֹן, sans archaïsme inutile.
