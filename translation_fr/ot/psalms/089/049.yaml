revisions:
- from: Où sont tes premiers actes d’amour fidèle[a], Seigneur, ceux que tu as jurés à David dans ta fidélité[b] ?
  to: Où sont tes actes d’amour fidèle d’autrefois[a], Seigneur, que tu as promis par serment à David dans ta fidélité[b] ?
