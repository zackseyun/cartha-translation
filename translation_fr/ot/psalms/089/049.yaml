  - severity: low
    issue: « tes premiers actes »
    rationale: « Premiers » est possible, mais peut suggérer une priorité séquentielle. Dans le contexte, l’adjectif vise les manifestations passées; « d’autrefois » est plus naturel et garde ce contraste.
