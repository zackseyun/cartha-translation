source:
  edition: WLC
  text: אַיֵּ֤ה חֲסָדֶ֖י/ךָ הָ/רִאשֹׁנִ֥ים אֲדֹנָ֑/י נִשְׁבַּ֥עְתָּ לְ֝/דָוִ֗ד בֶּ/אֱמוּנָתֶֽ/ךָ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/049.yaml
  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: fr
  text: Où sont tes actes d’amour fidèle d’autrefois[a], Seigneur, que tu as promis par serment à David dans ta fidélité[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes bontés d’autrefois » ou « tes marques d’amour fidèle d’autrefois ». L’hébreu emploie un pluriel, littéralement « tes amours fidèles d’autrefois ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par ta fidélité ». La formule peut exprimer la manière ou le fondement du serment.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Où sont
  rationale: L’interrogatif porte sur l’existence ou la manifestation présente des bienfaits évoqués; le pluriel français s’accorde avec « actes ».
- source_word: חֲסָדֶיךָ
  choice: tes actes d’amour fidèle
  rationale: חֶסֶד désigne ici l’amour loyal manifesté dans le cadre de l’alliance. L’ajout de « actes » rend naturellement le pluriel hébreu sans réduire le terme à un simple sentiment.
- source_word: הָרִאשֹׁנִים
  choice: premiers
  rationale: L’adjectif signifie littéralement « premiers » et renvoie, dans cette lamentation, aux manifestations d’amour accordées autrefois. Le français conserve cette formulation biblique naturelle.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin employé comme apostrophe; « Seigneur » en est l’équivalent français courant.
- source_word: נִשְׁבַּעְתָּ
  choice: tu as jurés
  rationale: Le passé composé renvoie naturellement en français au serment antérieur dont les effets demeurent pertinents. L’accord avec « ceux », représentant les actes promis sous serment, rend explicite la relation syntaxique.
- source_word: לְדָוִד
  choice: à David
  rationale: La préposition marque ici le destinataire du serment.
- source_word: בֶּאֱמוּנָתֶךָ
  choice: dans ta fidélité
  rationale: אֱמוּנָה exprime la fermeté et la fiabilité. Avec ב, la formule peut indiquer la sphère ou la manière du serment; « dans ta fidélité » préserve cette nuance.
theological_decisions:
- issue: Rendu de חֶסֶד dans une lamentation liée à l’alliance davidique
  choice: amour fidèle
  alternative: bonté; bienveillance; fidélité d’alliance
  rationale: « Amour fidèle » exprime à la fois la bonté et la loyauté durable envers l’alliance, sans imposer un vocabulaire confessionnel particulier.
- issue: Expression du pluriel חֲסָדֶיךָ
  choice: actes d’amour fidèle
  alternative: bontés; marques d’amour fidèle
  rationale: Le pluriel peut viser les manifestations concrètes de l’amour loyal de Dieu. « Actes » le rend explicitement dans un français idiomatique.
- issue: Valeur de ב dans בֶּאֱמוּנָתֶךָ
  choice: dans ta fidélité
  alternative: par ta fidélité
  rationale: La préposition peut exprimer la manière, la sphère ou le fondement du serment. Le texte principal évite de trancher en faveur d’une stricte instrumentalité, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure interrogative conserve la force de la lamentation. « Actes d’amour fidèle » explicite sobrement le pluriel hébreu, et les notes préservent les principales ambiguïtés lexicales et syntaxiques.
