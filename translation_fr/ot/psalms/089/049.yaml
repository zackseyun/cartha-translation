  source_fidelity: 'Le sens fondamental est bien rendu : la question porte sur les manifestations antérieures du חֶסֶד divin, et l’adresse à Dieu, David et la fidélité divine sont tous conservés. Toutefois, « ceux que tu as jurés » attribue directement le verbe « jurer » aux « actes », tournure française maladroite et syntaxiquement moins claire que le lien implicite entre ces bienfaits et le serment. « Promis par serment » rend ce lien sans ajout interprétatif significatif.'
  naturalness: Le registre est digne et accessible. « Actes d’amour fidèle » est idiomatique, mais « premiers actes » peut évoquer les premières étapes d’une série plutôt que les actes d’autrefois, lesquels sont opposés à la détresse présente. « D’autrefois » exprime plus naturellement le contraste contextuel.
  terminology: « Amour fidèle » rend bien חֶסֶד dans ce contexte d’alliance, et « Seigneur » convient pour אֲדֹנָי. « Fidélité » est un rendu approprié d’אֱמוּנָה; « dans ta fidélité » conserve sans la résoudre l’ambiguïté de la préposition ב.
