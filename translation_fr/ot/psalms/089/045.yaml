source:
  edition: WLC
  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: fr
  text: Tu as abrégé les jours de sa jeunesse ; tu l’as couvert de honte[a]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu l’as revêtu de honte ».'
    reason: Alternative lexicale reflétant la valeur possible de עטה, « couvrir » ou « revêtir ».
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: tu as abrégé
  rationale: Le hifil de קצר signifie « rendre court, abréger ». Le passé composé exprime naturellement en français une action accomplie dont les effets demeurent.
- source_word: יְמֵי
  choice: les jours de
  rationale: Le pluriel construit signifie littéralement « les jours de » et peut désigner la durée d’une période de vie ; l’expression hébraïque est ici conservée.
- source_word: עֲלוּמָיו
  choice: sa jeunesse
  rationale: Le nom désigne la jeunesse ou la période de vigueur propre au jeune âge. « Sa jeunesse » est direct, naturel et laisse au contexte le soin de préciser la portée.
- source_word: הֶעֱטִיתָ
  choice: tu as couvert
  rationale: Le hifil de עטה peut signifier envelopper, couvrir ou revêtir. Avec la honte, « couvrir de honte » est idiomatique en français et reste proche de l’image source.
- source_word: עָלָיו
  choice: le
  rationale: La préposition signifie littéralement « sur lui », mais le français « tu l’as couvert de honte » intègre naturellement cette relation.
- source_word: בּוּשָׁה
  choice: honte
  rationale: Le nom désigne la honte ou l’opprobre. « Honte » est l’équivalent le plus direct et convient au registre poétique.
- source_word: סֶלָה
  choice: Sélah
  rationale: La fonction exacte de ce terme liturgique ou musical demeure incertaine ; sa translittération évite de lui imposer une interprétation.
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans « sa jeunesse » et « sur lui »
  choice: Conserver le masculin singulier (« sa », « le ») sans identifier explicitement le référent.
  alternative: Préciser qu’il s’agit du roi davidique, de la dynastie davidique ou de l’oint personnifié.
  rationale: Le contexte renvoie au roi oint humilié et peut aussi évoquer sa dynastie, mais ce verset ne nomme pas le référent. Le pronom maintient l’ambiguïté poétique et théologique du texte.
translation_notes:
  register: Français international moderne, poétique et digne. « Abrégé les jours de sa jeunesse » préserve l’image hébraïque sans devenir obscur. La ponctuation suit le parallélisme du verset, et « Sélah » est conservé comme terme translittéré.
