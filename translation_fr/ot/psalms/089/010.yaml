source:
  edition: WLC
  text: אַתָּ֤ה דִכִּ֣אתָ כֶ/חָלָ֣ל רָ֑הַב בִּ/זְר֥וֹעַ עֻ֝זְּ/ךָ֗ פִּזַּ֥רְתָּ אוֹיְבֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/010.yaml
  text: You crushed Rahab like one slain[a]; with your mighty arm you scattered your enemies.
translation:
  language: fr
  text: Tu as écrasé Rahab comme un homme tué[a] ; par ton bras puissant, tu as dispersé tes ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab est un nom poétique qui peut désigner l’Égypte ou une puissance du chaos vaincue par Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: דִכִּאתָ
  choice: tu as écrasé
  rationale: Le verbe exprime l’action de briser ou d’écraser avec force ; « écrasé » convient à l’imagerie de victoire.
- source_word: כֶחָלָל
  choice: comme un homme tué
  rationale: La préposition כ marque la comparaison, et חָלָל désigne couramment une personne transpercée ou tuée au combat. Cette formulation française conserve la comparaison et le singulier du texte.
- source_word: רָהַב
  choice: Rahab
  rationale: La translittération préserve le nom poétique et son ambiguïté entre l’Égypte personnifiée et une puissance chaotique.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: par ton bras puissant
  rationale: Cette formulation naturelle garde à la fois la valeur instrumentale de la préposition et l’image anthropomorphique du bras divin.
- source_word: פִּזַּרְתָּ
  choice: tu as dispersé
  rationale: « Dispersé » rend directement le verbe sans ajouter l’idée plus précise d’une déroute militaire.
- source_word: אוֹיְבֶיךָ
  choice: tes ennemis
  rationale: Rendu direct et idiomatique du nom pluriel avec suffixe possessif.
theological_decisions:
- issue: Identité de רָהַב dans le contexte poétique
  choice: Conserver « Rahab » dans le texte principal comme nom poétique de l’adversaire vaincu.
  alternative: Traduire par « l’Égypte » ou expliciter une puissance, voire un monstre, du chaos.
  rationale: Le terme peut désigner poétiquement l’Égypte tout en évoquant les forces du chaos. Le conserver évite de trancher une ambiguïté réelle du texte et maintient sa richesse poétique et théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé, ainsi que l’image du bras puissant. « Un homme tué » explicite naturellement en français le nom hébreu singulier désignant celui qui est tombé au combat.
