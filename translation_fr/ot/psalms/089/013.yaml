  text: לְ/ךָ֣ זְ֭רוֹעַ עִם גְּבוּרָ֑ה תָּעֹ֥ז יָ֝דְ/ךָ֗ תָּר֥וּם יְמִינֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: fr
  text: Tu as un bras puissant ; ta main est forte, ta main droite est élevée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְךָ
  choice: À toi est
  rationale: La construction prépositionnelle placée en tête exprime avec emphase la possession ou l’appartenance. « À toi est » conserve cet ordre et reste intelligible dans le registre poétique.
- source_word: זְרוֹעַ
  choice: un bras
  rationale: Le sens concret est conservé afin de préserver l’image anthropomorphique hébraïque de la puissance divine.
- source_word: עִם גְּבוּרָה
  choice: puissant
  rationale: Littéralement « avec puissance ». En français, l’adjectif « puissant » exprime naturellement la caractérisation du bras sans alourdir le vers.
- source_word: תָּעֹז
  choice: est forte
  rationale: Le verbe exprime le fait d’être fort. La tournure copulative convient naturellement en français avec « ta main » comme sujet.
- source_word: יָדְךָ
  choice: ta main
  rationale: La traduction littérale maintient l’image poétique de la puissance en action.
- source_word: תָּרוּם
  choice: est élevée
  rationale: Le verbe רום peut signifier être haut, s’élever ou être exalté. « Est élevée » préserve l’ambiguïté entre hauteur et exaltation sans imposer l’idée d’un simple mouvement physique.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: La traduction littérale conserve le parallélisme et le symbole biblique de force et de victoire.
theological_decisions:
- issue: Langage anthropomorphique décrivant la puissance de Dieu
  choice: Conserver « bras », « main » et « main droite » dans le texte principal.
  alternative: Remplacer ces images par des termes abstraits comme « force » ou « puissance ».
  rationale: Le texte décrit poétiquement la puissance divine par des parties du corps. Garder ces images respecte la forme et la tension poétique de l’hébreu sans les réduire à une explication.
translation_notes:
  register: Français international moderne, digne et poétique. La formulation initiale « À toi est » est légèrement marquée, mais elle reproduit l’emphase du לְךָ placé en tête. Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
