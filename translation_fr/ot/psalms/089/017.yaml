id: PSA.89.17
reference: Psalms 89:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי תִפְאֶ֣רֶת עֻזָּ֣/מוֹ אָ֑תָּה וּ֝/בִ/רְצֹנְ/ךָ֗ תרים קַרְנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: fr
  text: Car tu es la gloire de leur force[a], et par ta faveur tu élèves notre corne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la splendeur de leur force » ou « la beauté de leur force ».
    reason: lexical_alternative
  - marker: b
    text: Dans la poésie hébraïque, la « corne » est une image de la force, de la puissance, de la dignité ou d’une position élevée.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et convient naturellement à l’enchaînement explicatif du psaume.
- source_word: תִפְאֶרֶת
  choice: la gloire
  rationale: Le nom peut désigner la gloire, la splendeur ou la beauté. « Gloire » exprime ici que Dieu est l’honneur et l’éclat de leur force, sans exclure les autres nuances.
- source_word: עֻזָּמוֹ
  choice: leur force
  rationale: Le nom désigne la force ou la puissance, et le suffixe est à la troisième personne du pluriel. La traduction conserve donc « leur », sans l’harmoniser avec « notre » dans le second membre.
- source_word: אָתָּה
  choice: tu es
  rationale: Le pronom indépendant est emphatique et forme ici une proposition nominale; le français exige naturellement le verbe « être ».
- source_word: וּבִרְצֹנְךָ
  choice: et par ta faveur
  rationale: רָצוֹן désigne la faveur, la bienveillance ou l’agrément. « Par » rend bien la valeur instrumentale probable de la préposition.
- source_word: תרים
  choice: tu élèves
  rationale: La forme causative de רוּם signifie faire monter, élever ou exalter. « Tu élèves » conserve l’image et adopte un registre digne sans être archaïque.
- source_word: קַרְנֵנוּ
  choice: notre corne
  rationale: La traduction littérale préserve une image poétique hébraïque désignant la force, la puissance ou une position élevée; une note en explicite le sens culturel.
theological_decisions:
- issue: Sens métaphorique de « corne »
  choice: Conserver « notre corne » dans le texte principal.
  alternative: notre force; notre puissance; notre dignité
  rationale: L’image hébraïque est vive et théologiquement non réductrice. La remplacer par une seule interprétation ferait perdre sa polysémie; une note permet de la rendre accessible.
- issue: Passage de « leur » à « notre »
  choice: 'Conserver exactement le changement de personne du texte hébreu : « leur force » puis « notre corne ».'
  alternative: Harmoniser les deux pronoms en « notre » pour fluidifier le verset.
  rationale: Le changement pronominal appartient au texte source et peut porter une tension poétique réelle. L’harmoniser introduirait une résolution interprétative non justifiée.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique et le changement de pronoms sont conservés; la métaphore de la corne reste dans le texte et reçoit une explication en note.
