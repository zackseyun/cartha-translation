  source_fidelity: 'Le texte rend fidèlement le verset hébreu : כִּי est bien explicatif (« Car »), תִפְאֶרֶת עֻזָּמוֹ est conservé par « la gloire de leur force », et le changement délibéré de « leur » à « notre » correspond au texte massorétique. « Par ta faveur » rend naturellement וּבִרְצֹנְךָ, tandis que « tu élèves notre corne » respecte le causatif de רוּם et maintient l’image hébraïque.'
