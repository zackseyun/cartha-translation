  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: fr
  text: En ton nom, ils se réjouissent tout le jour, et par ta justice ils sont élevés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ta droiture, ils s’élèvent ».
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: En ton nom
  rationale: La préposition בְּ exprime ici la sphère ou le fondement de la joie. Dans ce contexte, le « nom » désigne aussi le caractère révélé et la renommée de Dieu.
- source_word: יְגִילוּן
  choice: ils se réjouissent
  rationale: Le verbe גיל exprime une joie vive. « Se réjouissent » est naturel en français moderne tout en conservant cette force positive.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: L’expression indique une durée continue au cours de la journée. « Tout le jour » convient au registre poétique et reste aisément compréhensible.
- source_word: וּבְצִדְקָתְךָ
  choice: et par ta justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou l’action juste. « Par » met naturellement en évidence que la justice de Dieu est le fondement ou le moyen de leur élévation.
- source_word: יָרוּמוּ
  choice: ils sont élevés
  rationale: Le verbe רום signifie être haut ou élevé. Cette formulation préserve l’idée que leur élévation découle de la justice de Dieu sans préciser davantage l’agent grammatical.
theological_decisions:
- issue: Portée de la צְדָקָה de Dieu dans ce contexte de louange
  choice: justice
  alternative: droiture
  rationale: Le terme hébreu associe la rectitude morale et l’action juste ou fidèle. « Justice » conserve cette portée en français, tandis que « droiture » demeure une traduction possible.
- issue: Nature de l’élévation exprimée par יָרוּמוּ
  choice: ils sont élevés
  alternative: ils s’élèvent
  rationale: La forme hébraïque peut décrire leur état élevé sans exprimer explicitement un passif. Le contexte suggère que la justice de Dieu est à l’origine de cette élévation; la note préserve l’autre nuance grammaticale.
translation_notes:
  register: Français moderne, digne et poétique. Le tutoiement correspond à l’adresse directe à Dieu. La formulation conserve le parallélisme hébraïque et évite de réduire « nom » à une simple appellation.
