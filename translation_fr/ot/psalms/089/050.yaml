  naturalness: Le français est globalement naturel et convient au registre de la lamentation. « Opprobre » et « en mon sein » sont soutenus mais justifiés par le registre et par l’image hébraïque. « De tous ces nombreux peuples » est plus idiomatique que la juxtaposition littérale « de tous les nombreux peuples », tout en conservant l’idée de totalité.
  terminology: « Seigneur » est le rendu approprié d’אֲדֹנָי dans cette adresse divine. « Serviteurs » convient à עֲבָדֶיךָ. « Opprobre » conserve utilement la nuance de honte publique et de mépris de חֶרְפָּה.
