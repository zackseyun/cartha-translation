  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: fr
  text: Souviens-toi, Seigneur, de l’opprobre de tes serviteurs, que je porte en mon sein[b], venant de tous ces nombreux peuples[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « je porte en mon sein l’opprobre de tous ces nombreux peuples ». Après « en mon sein », la syntaxe hébraïque est condensée : les peuples peuvent être compris soit comme la source de l’opprobre, soit comme ce qui en précise le contenu ou l’étendue.'
    reason: alternative_reading
  - marker: b
    text: « En mon sein » est une image hébraïque exprimant le fait de porter quelque chose personnellement, au plus intime de soi, et non simplement de le transporter physiquement.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif masculin singulier de זכר, adressé directement à Dieu. « Souviens-toi » est la formulation naturelle d’une supplication en français biblique moderne.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit ici du titre divin אֲדֹנָי employé dans une adresse directe. « Seigneur » en rend l’usage conventionnel sans lui ajouter un possessif.
- source_word: חֶרְפַּת
  choice: l’opprobre
  rationale: חֶרְפָּה peut désigner le mépris, la honte, l’insulte ou l’opprobre. « Opprobre » conserve à la fois la disgrâce subie et le mépris public propres au registre de la lamentation.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette prière concernant ceux qui appartiennent à Dieu et le servent, « serviteurs » est plus naturel et contextuellement plus juste que « esclaves ».
- source_word: שְׂאֵתִי
  choice: que je porte
  rationale: Cette forme de נשׂא signifie « porter » ou « supporter ». La proposition relative française relie naturellement l’action à l’opprobre sans effacer l’image concrète.
- source_word: בְּחֵיקִי
  choice: en mon sein
  rationale: חֵיק désigne littéralement le sein ou le giron. « En mon sein » maintient l’image hébraïque d’une charge portée au plus près de soi.
- source_word: כָּל רַבִּים עַמִּים
  choice: par de nombreux peuples
  rationale: La construction hébraïque est condensée et difficile. Dans la lecture principale, les peuples sont la source de l’opprobre; « par » exprime idiomatiquement cette relation. Le pluriel « peuples » respecte עַמִּים.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: mon Seigneur
  rationale: אֲדֹנָי est ici le titre divin consacré dans une adresse à Dieu, et non un possessif qu’il faudrait nécessairement expliciter.
- issue: Relation syntaxique de כָּל רַבִּים עַמִּים avec l’opprobre porté
  choice: Les nombreux peuples infligent l’opprobre
  alternative: Le psalmiste porte l’opprobre de tous les nombreux peuples
  rationale: La syntaxe après « en mon sein » est très condensée. La lecture retenue donne aux peuples le rôle de source, mais l’autre rattachement demeure possible et est signalé en note.
translation_notes:
  register: Français moderne, digne et adapté à la lamentation. « Opprobre » est légèrement soutenu, mais reste précis et conserve la double nuance de honte et de mépris public. L’image « en mon sein » est maintenue puis expliquée en note.
