source:
  edition: WLC
  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: fr
  text: Mais toi, tu l’as rejeté et repoussé ; tu t’es emporté contre celui que tu as consacré par l’onction[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ton oint » ; le même mot hébreu peut être rendu par « ton Messie ». Ici, il désigne directement le roi de la lignée de David, établi dans le cadre de l’alliance de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque un contraste vigoureux avec les affirmations précédentes concernant l’alliance ; « Mais toi » le rend naturellement.
- source_word: זָנַחְתָּ
  choice: tu l’as rejeté
  rationale: Le verbe exprime le rejet ou l’abandon. Le complément implicite est rendu par « l’ » en français pour produire une phrase naturelle, son référent étant précisé à la fin du verset.
- source_word: וַ/תִּמְאָס
  choice: et repoussé
  rationale: Le verbe ajoute l’idée d’un refus marqué. Le couple « rejeté et repoussé » conserve l’intensification de deux verbes hébreux proches sans être inutilement archaïque.
- source_word: הִתְעַבַּרְתָּ
  choice: tu t’es emporté
  rationale: La forme réfléchie exprime ici une vive montée de colère. « S’emporter contre » restitue avec naturel l’aspect dynamique du verbe et sa force émotionnelle.
- source_word: עִם
  choice: contre
  rationale: Bien que la préposition signifie couramment « avec », le français idiomatique demande ici « s’emporter contre » ; cela exprime la relation hostile sans ajouter une idée étrangère au contexte.
- source_word: מְשִׁיחֶךָ
  choice: celui que tu as consacré par l’onction
  rationale: Cette formulation rend le sens concret de « ton oint » en français moderne et garde le lien avec l’onction royale. La note préserve les formulations plus littérales et la résonance messianique du terme.
theological_decisions:
- issue: Rendu de מְשִׁיחֶךָ dans une lamentation royale à résonance messianique
  choice: celui que tu as consacré par l’onction
  alternative: ton oint ; ton Messie
  rationale: Dans le contexte immédiat, le terme désigne le roi davidique consacré par Dieu, tout en étant le mot hébreu dont vient « Messie ». Le texte principal exprime le sens royal sans imposer une identification christologique plus explicite que l’hébreu ; la note conserve la tension lexicale et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le redoublement verbal du rejet et la vive accusation adressée à Dieu sont conservés. Le passé composé convient à la lamentation qui décrit une rupture désormais constatée.
