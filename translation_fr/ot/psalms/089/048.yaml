id: PSA.89.48
reference: Psalms 89:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: fr
  text: Quel homme peut vivre sans voir la mort[a] ? Peut-il délivrer son âme[b] de la main du shéol[c] ? Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « faire l’expérience de la mort ». Littéralement : « voir la mort ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « sa vie », ou encore « lui-même ».
    reason: lexical_alternative
  - marker: c
    text: 'Le shéol est le terme hébreu désignant le domaine des morts ; autre traduction possible : « la tombe ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Quel homme
  rationale: La tournure introduit une question rhétorique universelle. « Homme » rend le nom masculin גֶבֶר, qui désigne ici l’être humain représentatif confronté à la mortalité.
- source_word: יִחְיֶה
  choice: peut vivre
  rationale: Dans cette question rhétorique, l’imparfait exprime naturellement la possibilité plutôt qu’un simple futur.
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: sans voir la mort
  rationale: Cette formulation française conserve l’image hébraïque de « voir la mort » tout en exprimant naturellement la relation négative portée par וְלֹא.
- source_word: יְמַלֵּט
  choice: Peut-il délivrer
  rationale: Le piel exprime le fait de faire échapper ou de délivrer. L’interrogation explicite en français restitue la force rhétorique du second membre.
- source_word: נַפְשׁוֹ
  choice: son âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Âme » préserve ici la densité poétique sans éliminer les autres nuances, signalées en note.
- source_word: מִיַּד
  choice: de la main de
  rationale: La traduction conserve la métaphore hébraïque de la main comme emprise ou puissance.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération maintient la catégorie hébraïque du domaine des morts sans la réduire à la tombe ni lui imposer le sens doctrinal ultérieur d’enfer.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le terme est translittéré selon l’usage, puisque sa fonction exacte demeure incertaine.
theological_decisions:
- issue: Sens de שְׁאוֹל dans ce contexte poétique
  choice: Le terme « shéol » est conservé par translittération.
  alternative: « le séjour des morts » ou « la tombe »
  rationale: Le verset souligne l’universalité de la mort et l’impossibilité pour l’être humain d’échapper au shéol. La translittération évite aussi bien de réduire le mot à la sépulture que de lui attribuer automatiquement le sens d’« enfer ».
- issue: Portée du masculin גֶבֶר
  choice: « homme »
  alternative: « être humain » ou « personne »
  rationale: Le terme hébreu est masculin et désigne ici de façon représentative l’être humain mortel. La traduction conserve cette forme sans limiter la portée universelle de la question.
- issue: Nuance de נַפְשׁוֹ
  choice: « son âme »
  alternative: « sa vie » ou « lui-même »
  rationale: Le contexte de la mort et du shéol permet plusieurs nuances réelles de נפש. Le texte principal garde « âme », tandis que la note préserve les autres lectures sans trancher artificiellement.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe interrogative reste naturelle, tandis que les images de « voir la mort » et de « la main du shéol » sont conservées. « Sélah » demeure non traduit en raison de l’incertitude sur sa fonction précise.
