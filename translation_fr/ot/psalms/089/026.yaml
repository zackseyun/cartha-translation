  text: ה֣וּא יִ֭קְרָאֵ/נִי אָ֣בִ/י אָ֑תָּה אֵ֝לִ֗/י וְ/צ֣וּר יְשׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: fr
  text: 'Il m’appellera[a] : « Tu es mon Père, mon Dieu et le rocher de mon salut. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il m’appellera ». Le verbe hébreu signifie « appeler »; dans un contexte d’invocation, il peut aussi évoquer le fait de crier vers Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Lui, il
  rationale: Le pronom indépendant, emphatique en hébreu, est rendu explicitement par une dislocation naturelle en français.
- source_word: יִקְרָאֵנִי
  choice: m’appellera
  rationale: קרא signifie « appeler » ou « crier ». Le suffixe de première personne est conservé comme complément direct; le contexte permet aussi le sens d’un appel adressé à Dieu, signalé en note.
- source_word: אָבִי
  choice: mon Père
  rationale: Le nom avec suffixe possessif est rendu littéralement. La majuscule marque ici l’emploi comme désignation relationnelle de Dieu dans une adresse directe.
- source_word: אָתָּה
  choice: Tu es
  rationale: Le pronom indépendant explicite est conservé, avec la copule nécessaire en français idiomatique.
- source_word: אֵלִי
  choice: mon Dieu
  rationale: Dans cette série d’appellations adressées à Dieu, אֵלִי se traduit naturellement par « mon Dieu ».
- source_word: וְצוּר יְשׁוּעָתִי
  choice: et le rocher de mon salut
  rationale: La métaphore du rocher et la relation construite avec « mon salut » sont préservées sans ajouter de possessif absent devant « rocher ».
theological_decisions:
- issue: Adresse divine dans un contexte royal et messianique
  choice: « Tu es mon Père, mon Dieu et le rocher de mon salut. »
  alternative: Employer « père » avec une minuscule ou expliciter une interprétation exclusivement royale ou messianique.
  rationale: Le verset présente directement le roi comme s’adressant à Dieu au moyen d’un langage relationnel et covenantiel. La traduction conserve cette portée sans imposer une conclusion doctrinale ultérieure.
translation_notes:
  register: Français moderne, international et digne. « Lui, il » reproduit l’emphase du pronom hébreu tout en restant naturel; la formulation de l’adresse demeure solennelle et accessible.
