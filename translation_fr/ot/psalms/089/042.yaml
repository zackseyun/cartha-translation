id: PSA.89.42
reference: Psalms 89:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: fr
  text: Tu as élevé la main droite de ses adversaires[a] ; tu as réjoui tous ses ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu as relevé la main droite de ses adversaires. »'
    reason: 'Alternative lexicale pour הֲרִימוֹתָ : « relever » ou « lever » rend plus concrètement le mouvement exprimé, tandis qu’« élever » fait mieux ressortir ici l’idée de puissance accrue.'
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: tu as élevé
  rationale: Le hiphil accompli, deuxième personne masculine singulière, de רום exprime ici le fait de faire monter ou d’élever. Avec « la main droite », « élever » conserve l’image hébraïque tout en suggérant que Dieu a accru la puissance des adversaires.
- source_word: יְמִין
  choice: la main droite
  rationale: Le nom désigne couramment la main droite et symbolise souvent la force ou la puissance. Le maintien de cette expression préserve l’image du texte source.
- source_word: צָרָיו
  choice: ses adversaires
  rationale: Le terme désigne des opposants hostiles. « Adversaires » est naturel et permet de distinguer ce mot du quasi-synonyme אוֹיְבָיו dans le second membre.
- source_word: הִשְׂמַחְתָּ
  choice: tu as réjoui
  rationale: 'Le hiphil accompli de שׂמח a une valeur causative : Dieu a rendu les ennemis joyeux. En français, « réjouir » exprime naturellement cette causalité.'
- source_word: כָּל
  choice: tous
  rationale: Avec le pluriel « ennemis », « tous » rend directement et naturellement la totalité exprimée par כָּל.
- source_word: אוֹיְבָיו
  choice: ses ennemis
  rationale: Ce nom courant désignant des ennemis se traduit directement ainsi. Le choix d’un terme différent de « adversaires » reflète sans l’exagérer la variation lexicale de l’hébreu.
theological_decisions:
- issue: Référent des suffixes masculins singuliers de la troisième personne
  choice: Traduction par « ses », renvoyant au roi davidique ou à l’oint dans le contexte immédiat du psaume.
  alternative: Formulation plus générale qui ne préciserait pas le référent.
  rationale: Les deux suffixes sont à la troisième personne masculine singulière. Dans le contexte du Psaume 89, la lamentation porte sur le renversement apparent des promesses faites à David et à son oint. « Ses » respecte la grammaire sans résoudre davantage la tension théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu est conservé, ainsi que l’image de la « main droite ». Le point-virgule marque l’équilibre entre les deux membres du verset.
