source:
  edition: WLC
  text: יְהוָ֤ה אֱלֹ֘הֵ֤י צְבָא֗וֹת מִֽי כָֽמ֖וֹ/ךָ חֲסִ֥ין יָ֑הּ וֶ֝/אֱמֽוּנָתְ/ךָ֗ סְבִיבוֹתֶֽי/ךָ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: fr
  text: Yahweh, Dieu des armées, qui est comme toi, puissant Yah ? Et ta fidélité t’entoure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et le distingue du titre « Seigneur ».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Dieu des armées
  rationale: Rend naturellement le syntagme construit sans limiter les armées à une catégorie terrestre ou céleste.
- source_word: מִי כָמוֹךָ
  choice: qui est … comme toi ?
  rationale: Conserve la formule interrogative d’incomparabilité et sa force poétique.
- source_word: חֲסִין
  choice: puissant
  rationale: Exprime la force attribuée à Dieu dans un français actuel et digne.
- source_word: יָהּ
  choice: Yah
  rationale: Préserve la forme courte du nom divin, distincte de יְהוָה dans le même verset.
- source_word: וֶאֱמוּנָתְךָ
  choice: Ta fidélité
  rationale: אֱמוּנָה désigne ici la constance et la fiabilité de Dieu; la coordination hébraïque est rendue par une nouvelle proposition française.
- source_word: סְבִיבוֹתֶיךָ
  choice: t’entoure
  rationale: Rend idiomatiquement la valeur locative « tout autour de toi » tout en conservant l’image enveloppante.
theological_decisions:
- issue: Distinction entre יְהוָה et la forme courte יָהּ
  choice: Traduire par « Yahweh » puis « Yah »
  alternative: Uniformiser les deux formes en « Seigneur » ou en « Yahweh »
  rationale: Le texte hébreu emploie délibérément deux formes distinctes du nom divin; les conserver évite d’effacer cette différence sans imposer d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, poétique et digne. L’interrogation rhétorique et la répétition différenciée des deux formes du nom divin sont conservées.
