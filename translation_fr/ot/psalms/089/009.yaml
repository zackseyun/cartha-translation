source:
  edition: WLC
  text: אַתָּ֣ה מ֭וֹשֵׁל בְּ/גֵא֣וּת הַ/יָּ֑ם בְּ/שׂ֥וֹא גַ֝לָּ֗י/ו אַתָּ֥ה תְשַׁבְּחֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: fr
  text: Tu domines le gonflement de la mer[a] ; quand ses vagues se soulèvent, c’est toi qui les apaises[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’orgueil de la mer » ou « la majesté de la mer ». Le terme hébreu peut évoquer l’élévation, l’orgueil, la majesté ou le gonflement ; ici, le contexte favorise l’image de la mer qui se soulève.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu les calmes » ou « tu les maîtrises ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: tu domines
  rationale: Le participe exprime une autorité souveraine et constante. « Dominer » convient naturellement à la construction avec la mer et garde la force poétique du verbe.
- source_word: בְּגֵאוּת הַיָּם
  choice: la fureur de la mer
  rationale: גֵּאוּת peut désigner l’élévation, l’orgueil, la majesté ou le gonflement. Dans ce contexte de vagues qui se soulèvent, « fureur » rend de façon naturelle la mer déchaînée, tout en laissant en note les sens plus formels.
- source_word: בְּשׂוֹא גַלָּיו
  choice: quand ses vagues se soulèvent
  rationale: L’infinitif construit décrit la circonstance dans laquelle les vagues montent. Cette formulation temporelle est claire et conserve l’image concrète.
- source_word: תְשַׁבְּחֵם
  choice: c’est toi qui les apaises
  rationale: Au piel, שׁבח signifie ici calmer ou réduire au repos les eaux agitées. « Apaiser » est idiomatique en français ; la tournure emphatique fait entendre le second אַתָּה.
theological_decisions:
- issue: La souveraineté divine sur les eaux chaotiques
  choice: Affirmer directement que Dieu maîtrise la mer et apaise ses vagues.
  alternative: Lire le verset comme une allusion mythopoétique à la victoire de Dieu sur le chaos cosmique.
  rationale: Le texte affirme explicitement la maîtrise de Dieu sur la mer. La traduction conserve cette image sans introduire dans le corps du texte un cadre mythologique qui demeure interprétatif.
translation_notes:
  register: Français moderne, poétique et dignifié. « Tu domines » exprime la souveraineté continue ; « c’est toi » restitue l’insistance produite par la répétition du pronom hébreu.
