  text: בָּר֖וּךְ יְהוָ֥ה לְ֝/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: fr
  text: Béni soit Yahweh pour toujours ! Amen et amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif ouvre une formule de bénédiction et de louange. « Béni soit » en restitue naturellement la force liturgique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression temporelle signifie « à perpétuité, pour l’éternité ». « Pour toujours » est clair, naturel et fidèle en français moderne.
- source_word: אָמֵן וְאָמֵן
  choice: Amen et amen
  rationale: La formule liturgique répétée est conservée telle quelle, avec la conjonction qui souligne la solennité de l’affirmation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: L’hébreu porte explicitement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre et correspond à la translittération retenue.
translation_notes:
  register: Formulation liturgique brève, digne et immédiatement compréhensible. Le point d’exclamation rend la force doxologique de la formule sans en modifier le sens.
