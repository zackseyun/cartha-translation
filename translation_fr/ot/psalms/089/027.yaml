id: PSA.89.27
reference: Psalms 89:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: fr
  text: Et moi, je ferai de lui le premier-né[a], le plus élevé des rois de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ici, « premier-né » désigne le premier en rang et en privilège, sans nécessairement indiquer l’ordre de naissance. Autre traduction possible : « celui qui a la prééminence ».'
    reason: Précision lexicale sur l’emploi statutaire de בְּכוֹר.
lexical_decisions:
- source_word: אַף אָ֭נִי
  choice: Et moi
  rationale: אַף ajoute ici un nouvel engagement divin, tandis que le pronom indépendant אָ֭נִי met le locuteur en relief. « Et moi » rend naturellement en français cette progression et cette insistance.
- source_word: בְּכ֣וֹר
  choice: le premier-né
  rationale: Le terme désigne ici un statut de prééminence et les privilèges qui lui sont attachés, sans imposer l’idée d’un ordre de naissance littéral. Le terme concret est conservé afin de préserver sa portée royale.
- source_word: אֶתְּנֵ֑הוּ
  choice: je ferai de lui
  rationale: Dans cette construction avec un attribut, נתן signifie établir ou constituer quelqu’un dans un statut. « Je ferai de lui » exprime clairement ce sens résultatif.
- source_word: עֶ֝לְי֗וֹן
  choice: le plus élevé
  rationale: L’adjectif indique ici le rang suprême du roi par rapport aux autres rois. « Le plus élevé » évite aussi de le confondre avec le titre divin « le Très-Haut ».
- source_word: לְמַלְכֵי אָֽרֶץ
  choice: des rois de la terre
  rationale: Le לְ marque la relation ou la comparaison après עֶלְיוֹן. En français, « le plus élevé des rois de la terre » exprime naturellement sa suprématie par rapport à eux.
theological_decisions:
- issue: Portée royale et potentiellement messianique de « premier-né »
  choice: Conserver « le premier-né » comme terme de rang et de privilège royal, sans expliciter une interprétation messianique dans le corps du texte.
  alternative: Traduire de manière interprétative par « l’héritier » ou « celui qui a la prééminence ».
  rationale: Dans son contexte, le psaume parle du roi davidique; une lecture canonique chrétienne peut aussi y discerner une portée messianique. Le terme hébreu doit rester visible afin de préserver cette profondeur et cette tension sans imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle « le premier-né, le plus élevé » conserve la force poétique et royale de l’hébreu.
