source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י לָ/עַ֣ד זַרְע֑/וֹ וְ֝/כִסְא֗/וֹ כִּ/ימֵ֥י שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: fr
  text: 'J’établirai sa descendance pour toujours,

    et son trône durera aussi longtemps que dureront les cieux.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et son trône comme les jours des cieux ».'
    reason: La note conserve l’image et la syntaxe hébraïques derrière la formulation française idiomatique.
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: J’établirai
  rationale: Le verbe שׂים signifie littéralement « placer », mais, dans cette promesse d’alliance portant sur une descendance royale, « établir » exprime naturellement l’idée de lui assurer une existence durable.
- source_word: לָעַד
  choice: pour toujours
  rationale: לָעַד exprime ici la perpétuité; « pour toujours » en restitue clairement la force en français moderne.
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: זֶרַע est un collectif qui peut désigner la postérité ou les descendants. « Descendance » conserve ce sens collectif ainsi que la résonance dynastique du contexte.
- source_word: וְכִסְאוֹ
  choice: et son trône
  rationale: כִּסֵּא désigne directement le trône, ici par métonymie avec sa portée royale laissée intacte.
- source_word: כִּימֵי שָׁמָיִם
  choice: durera autant que les cieux
  rationale: Littéralement « comme les jours des cieux ». La formulation retenue rend en français naturel la comparaison de durée implicite, sans réduire la force poétique de l’image cosmique.
theological_decisions:
- issue: Durée de la promesse faite à la dynastie davidique
  choice: 'Conserver le langage absolu de perpétuité : « pour toujours » et « autant que les cieux »'
  alternative: Atténuer en « de génération en génération » ou préciser un cadre dynastique ou eschatologique particulier
  rationale: Le verset formule une promesse forte et poétique sans en expliquer ici les modalités. La traduction en préserve la tension théologique sans la systématiser.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes; « les cieux » maintient le registre biblique sans archaïsme marqué.
