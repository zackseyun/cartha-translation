source:
  edition: WLC
  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: fr
  text: Sa descendance subsistera pour toujours[a], et son trône[b] sera comme le soleil devant moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Sa semence sera pour toujours. » Le mot hébreu peut désigner collectivement la postérité ou la descendance.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu n’exprime pas de verbe dans cette seconde proposition : « et son trône comme le soleil devant moi ».'
    reason: source_form
  - marker: c
    text: 'Ou : « en ma présence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעוֹ
  choice: sa descendance
  rationale: זֶרַע désigne ici collectivement la postérité du roi dans le cadre de l’alliance dynastique. « Sa descendance » est naturel en français moderne et conserve cette valeur collective.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans ce contexte poétique et allianciel, עוֹלָם exprime une durée permanente. « Pour toujours » est une formulation claire et idiomatique.
- source_word: יִהְיֶה
  choice: subsistera
  rationale: Le verbe signifie littéralement « sera », mais « sa descendance sera pour toujours » serait peu naturel. « Subsistera » rend en français la continuité d’existence exprimée dans le contexte, sans ajouter l’idée plus marquée de résistance que pourrait suggérer « perdurera ».
- source_word: וְכִסְאוֹ
  choice: et son trône
  rationale: כִּסֵּא désigne littéralement le trône et, par métonymie, la royauté. L’image concrète est conservée plutôt que remplacée par « règne » ou « royaume ».
- source_word: כַשֶּׁמֶשׁ
  choice: comme le soleil
  rationale: Le préfixe כ marque une comparaison directe. « Comme le soleil » restitue simplement la métaphore royale et cosmique.
- source_word: נֶגְדִּי
  choice: devant moi
  rationale: נֶגֶד avec le suffixe de première personne signifie « devant moi » ou « en ma présence ». La formulation retenue reste proche de l’hébreu tout en étant compréhensible en français.
theological_decisions:
- issue: Référence du suffixe de première personne dans נֶגְדִּי
  choice: Conserver « devant moi » comme parole directe de Dieu
  alternative: « en ma présence »
  rationale: Le passage présente Dieu parlant de David et de sa lignée. Le maintien de la première personne préserve la force directe de la promesse d’alliance sans la paraphraser.
- issue: Verbe sous-entendu dans la seconde proposition
  choice: Fournir « sera » pour rendre la proposition naturelle en français
  alternative: « et son trône comme le soleil devant moi »
  rationale: L’hébreu présente une proposition nominale elliptique après יִהְיֶה. L’ajout de « sera » explicite en français le lien syntaxique sans imposer que le trône « subsistera » de la même manière que la descendance.
translation_notes:
  register: Français international moderne, poétique et digne. « Descendance » convient au contexte dynastique; « subsistera » évite la tournure peu idiomatique « sera pour toujours ». La répétition d’un verbe fort dans la seconde proposition est évitée afin de respecter l’ellipse et l’ambiguïté de l’hébreu.
