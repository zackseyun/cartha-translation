  text: אֲשֶׁ֤ר חֵרְפ֖וּ אוֹיְבֶ֥י/ךָ יְהוָ֑ה אֲשֶׁ֥ר חֵ֝רְפ֗וּ עִקְּב֥וֹת מְשִׁיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/051.yaml
  text: with which your enemies have taunted[a], O Yahweh[b], with which they have taunted the footsteps of your anointed.
translation:
  language: fr
  text: par lesquelles tes ennemis t’ont outragé, ô Yahweh, par lesquelles ils ont outragé les pas de ton oint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « les pas de ton oint ». « Oint » peut aussi être rendu par « Messie »; dans ce contexte, le terme désigne probablement le roi davidique. « Pas » peut également évoquer les talons, les traces, les déplacements ou la venue de l’oint.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵרְפוּ
  choice: ont accablé de mépris
  rationale: Le verbe חרף exprime l’outrage, le mépris et la raillerie hostile. Cette formulation française restitue cette force et convient aux deux emplois parallèles du verbe.
- source_word: אוֹיְבֶיךָ
  choice: tes ennemis
  rationale: Rend directement le nom avec suffixe de deuxième personne du masculin singulier.
- source_word: יְהוָה
  choice: ô Yahweh
  rationale: La translittération du nom divin conserve ici le nom propre hébreu, précédé de « ô » puisque le terme est en apostrophe.
- source_word: אֲשֶׁר
  choice: dont
  rationale: Le relatif reprend l’opprobre mentionné au verset précédent et introduit la manière dont les ennemis l’ont infligé. « Dont » assure naturellement le lien en français.
- source_word: עִקְּבוֹת
  choice: les pas
  rationale: Le nom peut désigner les talons, les pas ou les traces. « Les pas » conserve l’image concrète tout en permettant le sens métaphorique des déplacements ou de la venue du roi consacré.
- source_word: מְשִׁיחֶךָ
  choice: celui que tu as consacré par l’onction
  rationale: Cette formulation rend le sens concret de משיח avec le suffixe « ton », ici explicité par « que tu as », sans imposer dans le texte principal le titre « Messie ». Le contexte vise probablement le roi davidique consacré.
theological_decisions:
- issue: Portée royale et messianique de מְשִׁיחֶךָ
  choice: celui que tu as consacré par l’onction
  alternative: ton Messie
  rationale: Le contexte immédiat évoque vraisemblablement le roi davidique consacré par Yahweh. Le choix principal préserve ce sens royal, tandis que la note maintient la résonance messianique réelle du même terme hébreu.
- issue: Sens de עִקְּבוֹת appliqué au consacré
  choice: les pas
  alternative: les talons, les traces ou la venue
  rationale: L’expression demeure difficile et peut évoquer les mouvements, les traces, voire la venue du consacré. Le texte garde l’image hébraïque sans trancher son référent métaphorique.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme hébreu est conservé par la répétition de « dont ils ont accablé de mépris ». La relative dépend du verset précédent, comme dans le texte source. Le marqueur [a] figure immédiatement après l’expression annotée.
