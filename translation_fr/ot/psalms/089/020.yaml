  text: מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑/י בְּ/שֶׁ֖מֶן קָדְשִׁ֣/י מְשַׁחְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/020.yaml
  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: fr
  text: J’ai trouvé David, mon serviteur[a] ; je l’ai oint de mon huile sainte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire les deux verbes au passé simple : « Je trouvai David, mon serviteur ; je l’oignis de mon huile sainte. » Les formes verbales hébraïques présentent ces actes comme accomplis.'
    reason: alternative grammaticale
lexical_decisions:
- source_word: מָצָאתִי
  choice: J’ai trouvé
  rationale: Le qal accompli à la 1re personne du singulier exprime un acte achevé. Le passé composé est naturel en français et peut conserver la pertinence présente de cet acte dans la déclaration d’alliance.
- source_word: דָּוִד
  choice: David
  rationale: Forme française conventionnelle du nom propre.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte royal, עבד est une désignation honorifique de David dans sa relation à Dieu ; « serviteur » convient mieux que « esclave ».
- source_word: בְּשֶׁמֶן קָדְשִׁי
  choice: avec mon huile sainte
  rationale: La préposition ב indique ici le moyen de l’onction. « Huile sainte » exprime le caractère consacré et mis à part de cette huile.
- source_word: מְשַׁחְתִּיו
  choice: je l’ai consacré par l’onction
  rationale: Le verbe משׁח signifie oindre. Cette formulation française rend clairement l’acte d’investiture royale sans employer le tour moins naturel « je l’ai oint ».
theological_decisions:
- issue: Langage de l’onction royale et résonance messianique possible
  choice: Conserver la référence historique explicite à David et rendre l’acte royal d’onction sans ajouter de titre messianique.
  alternative: Employer une formulation interprétative qui mettrait au premier plan le Messie ou l’Oint.
  rationale: Le texte hébreu nomme directement David et décrit son onction. Ses résonances typologiques éventuelles ne doivent pas être ajoutées au verset.
translation_notes:
  register: Français moderne, clair et digne. Le passé composé est retenu pour sa naturalité et pour la pertinence durable des actes divins. « Consacré par l’onction » évite l’archaïsme de « oint » tout en préservant le sens royal et cultuel du verbe hébreu.
