source:
  edition: WLC
  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: fr
  text: Je chanterai pour toujours les bontés[a] de Yahweh ; de génération en génération, ma bouche fera connaître ta fidélité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’amour fidèle », « les actes de bonté fidèle » ou « les compassions ». Le mot hébreu peut désigner l’amour loyal de Yahweh, notamment tel qu’il se manifeste par des actes répétés de bonté et de compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: les bontés
  rationale: Le pluriel construit peut désigner les manifestations répétées de la bonté loyale et fidèle de Yahweh. « Les bontés » conserve le pluriel et reste naturel en français, tandis que la note signale les nuances d’amour fidèle et de compassion.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: עוֹלָם
  choice: pour toujours
  rationale: Employé ici adverbialement avec « je chanterai », le terme exprime une durée indéfinie et durable.
- source_word: אָשִׁירָה
  choice: Je chanterai
  rationale: La forme cohortative exprime ici la résolution ou l’intention du psalmiste ; le futur français la rend naturellement.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette tournure idiomatique exprime la transmission continue au fil des générations.
- source_word: אוֹדִיעַ
  choice: je ferai connaître
  rationale: Le hiphil de ידע signifie « faire connaître » ; cette traduction conserve la valeur causative.
- source_word: אֱמוּנָתְךָ
  choice: ta fidélité
  rationale: Le mot désigne ici la constance et la fiabilité de Dieu, en parallèle avec חַסְדֵי.
- source_word: בְּפִי
  choice: par ma bouche
  rationale: Cette formulation préserve l’image concrète de la proclamation orale sans remplacer « bouche » par « lèvres ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Portée de חַסְדֵי
  choice: les bontés
  alternative: l’amour fidèle ; les actes de bonté fidèle ; les compassions
  rationale: Le pluriel peut évoquer les manifestations répétées de l’amour loyal de Yahweh. Le texte garde un pluriel concret, et la note préserve l’éventail sémantique sans imposer une seule lecture théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que les images concrètes de la bouche et des générations.
