  text: אִם יַֽעַזְב֣וּ בָ֭נָי/ו תּוֹרָתִ֑/י וּ֝/בְ/מִשְׁפָּטַ֗/י לֹ֣א יֵלֵכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: fr
  text: Si ses fils abandonnent ma loi[a] et ne marchent pas selon mes règles[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon enseignement ». Le mot hébreu torah peut désigner un enseignement ou une instruction aussi bien qu’une loi; ici, « loi » est retenu en raison du parallélisme avec « mes règles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne vivent pas conformément à mes décisions »; littéralement, « ne marchent pas dans mes jugements ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit directement la condition exprimée par l’hébreu, sans laisser entendre qu’elle se réalisera nécessairement.
- source_word: יַעַזְבוּ
  choice: abandonnent
  rationale: Rend le sens de quitter ou délaisser, avec la nuance de déloyauté envers l’alliance présente dans le contexte.
- source_word: בָנָיו
  choice: ses fils
  rationale: Conserve le masculin pluriel explicite de l’hébreu et son renvoi aux descendants du roi dans le contexte de l’alliance davidique.
- source_word: תּוֹרָתִי
  choice: ma loi
  rationale: תּוֹרָה peut désigner une instruction ou une loi. Le parallélisme avec מִשְׁפָּטַי favorise ici la nuance juridique, tout en laissant l’autre possibilité en note.
- source_word: וּבְמִשְׁפָּטַי
  choice: selon mes règles
  rationale: Le בְּ indique ici la norme selon laquelle on marche. « Règles » exprime naturellement en français les prescriptions ou décisions normatives désignées par מִשְׁפָּטִים.
- source_word: לֹא יֵלֵכוּן
  choice: ne marchent pas
  rationale: Préserve la métaphore biblique de la marche comme manière de vivre et d’agir.
theological_decisions:
- issue: Sens de תּוֹרָה dans ce contexte d’alliance
  choice: ma loi
  alternative: mon enseignement
  rationale: L’association immédiate avec « mes règles » donne au vers une tonalité juridique liée à l’alliance, sans exclure le sens plus large d’enseignement, signalé en note.
- issue: Rendu du masculin בָנָיו
  choice: ses fils
  alternative: ses enfants
  rationale: Le texte hébreu emploie explicitement le masculin pluriel et vise les fils ou descendants dans la lignée davidique; la traduction ne neutralise donc pas cette forme.
- issue: Métaphore de la marche dans לֹא יֵלֵכוּן
  choice: ne marchent pas
  alternative: ne vivent pas conformément à
  rationale: La formulation retenue conserve l’image hébraïque sans expliquer davantage que le texte source.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore traditionnelle de la marche est conservée, tandis que « selon mes règles » donne au complément une tournure française naturelle. La virgule finale signale que la proposition conditionnelle se poursuit au verset suivant.
