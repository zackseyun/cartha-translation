  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: fr
  text: 'Heureux le peuple qui connaît le cri de joie[a] !

    Yahweh, ils marchent dans la lumière de ton visage[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’acclamation festive » ; l’expression peut aussi inclure une sonnerie de trompette employée dans le culte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ton visage » ; cette image peut évoquer la présence ou la faveur de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule exclamative introduit une béatitude. « Heureux » est la tournure française naturelle et traditionnelle, sans réduire l’expression à une émotion passagère.
- source_word: הָעָם
  choice: le peuple
  rationale: Dans ce contexte, עָם désigne la communauté comme peuple, sans mettre l’accent sur une entité politique comme le ferait « nation ».
- source_word: יוֹדְעֵי
  choice: qui connaît
  rationale: Le participe caractérise durablement le peuple. Le singulier s’accorde naturellement en français avec le nom collectif « peuple ».
- source_word: תְרוּעָה
  choice: le cri de joie
  rationale: Le terme peut désigner une clameur, une acclamation festive ou un signal de trompette. « Cri de joie » convient au contexte cultuel et festif sans limiter le mot à un instrument.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme un nom propre plutôt que remplacé par un titre. La virgule marque ici l’apostrophe directe.
- source_word: בְּאוֹר
  choice: à la lumière
  rationale: Cette expression française naturelle conserve l’image d’une marche éclairée par la face de Dieu.
- source_word: פָּנֶיךָ
  choice: de ton visage
  rationale: La traduction garde l’image hébraïque concrète. « Ta présence » ou « ta faveur » en expliciteraient seulement certaines implications.
- source_word: יְהַלֵּכוּן
  choice: ils marchent
  rationale: Le verbe évoque à la fois le déplacement et, par métaphore, la manière de vivre. « Ils marchent » préserve ces deux dimensions.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie le nom divin lui-même. Le conserver sous la forme « Yahweh » évite de le remplacer par un titre.
- issue: Sens de פָּנֶיךָ
  choice: ton visage
  alternative: ta présence / ta faveur
  rationale: Le sens idiomatique peut renvoyer à la présence ou à la faveur divine, mais le maintien de « visage » préserve l’image et sa richesse théologique.
- issue: Portée de תְרוּעָה
  choice: le cri de joie
  alternative: l’acclamation festive / le son de la trompette
  rationale: Le contexte favorise une acclamation cultuelle joyeuse, mais le mot peut aussi inclure une sonnerie de trompette. La note maintient cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Heureux », « marche » et « visage » maintiennent les images bibliques sans archaïsme marqué.
