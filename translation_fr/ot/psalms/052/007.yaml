  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: fr
  text: 'Les justes verront et éprouveront de la crainte[a] ; ils riront de lui[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auront peur ». Le verbe hébreu peut désigner l’effroi, mais, dans ce contexte, il peut aussi évoquer une crainte respectueuse devant le jugement de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « se moqueront de lui ». Le verbe hébreu signifie « rire » ; le contexte lui donne ici une nuance de dérision.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: le verront
  rationale: Le qal inaccompli, 3e personne du pluriel, de ראה a ici une valeur future. Le pronom « le » reprend naturellement en français ce que les justes voient dans le contexte, sans remplacer le sens perceptif du verbe par « comprendront ».
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif pluriel employé comme nom désigne ceux qui sont justes. « Les justes » est naturel, digne et traditionnel en français contemporain.
- source_word: וְיִירָאוּ
  choice: éprouveront de la crainte
  rationale: Le qal inaccompli de ירא peut exprimer aussi bien la peur que la crainte révérencielle. Cette formulation conserve cette amplitude sans imposer « auront peur » ni « seront saisis de respect ».
- source_word: וְעָלָיו
  choice: de lui
  rationale: Avec שׂחק, la préposition על marque la personne prise pour objet du rire. « Rire de lui » est la tournure idiomatique française.
- source_word: יִשְׂחָקוּ
  choice: riront
  rationale: Le sens lexical direct est « rire ». Le contexte donne au rire une nuance de dérision, qu’une note explicite sans la substituer au verbe dans le texte.
theological_decisions:
- issue: Nature de la crainte suscitée par le jugement
  choice: éprouveront de la crainte
  alternative: auront peur ; seront saisis de respect
  rationale: La réaction des justes devant le jugement peut comporter à la fois effroi et crainte révérencielle. La traduction préserve cette tension au lieu de la réduire à la terreur ou à l’admiration religieuse.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme bref du vers hébreu et maintient l’ambiguïté de ירא. Les deux appels de note figurent explicitement dans le texte.
