    issue: Explicitation causale de בְּהַוָּתוֹ
    rationale: « Par ce qui cause sa ruine » ne rend pas directement le substantif possessif « sa ruine / son désastre » et fixe indûment une relation causale. Le texte hébreu conserve une ambiguïté que la traduction doit préserver.
  revised_text: Voilà l’homme qui n’a pas fait de Dieu son refuge[a], mais qui a mis sa confiance dans l’abondance de ses richesses et s’est fortifié dans sa ruine[b].
