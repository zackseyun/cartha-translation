source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: fr
  text: Voilà l’homme qui n’a pas fait de Dieu son refuge[a], mais qui a mis sa confiance dans l’abondance de ses richesses et s’est fortifié dans sa ruine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa forteresse » ou « sa place forte ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu rendu par « ruine » peut aussi désigner un désastre, un mauvais désir ou des desseins destructeurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voilà
  rationale: Interjection déictique qui attire l’attention sur un exemple frappant. « Voilà » est naturel en français moderne et conserve la force présentative de l’hébreu.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom est masculin singulier et désigne ici l’homme présenté comme exemple; « l’homme » préserve cette forme sans suraccentuer une idée de puissance.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: qui n’a pas fait de Dieu son refuge
  rationale: שׂים exprime ici le fait de prendre ou d’établir quelqu’un comme source de sécurité, et מָעוֹז désigne un refuge, une forteresse ou une place forte.
- source_word: וַיִּבְטַח
  choice: mais qui a mis sa confiance
  rationale: La coordination marque ici un contraste avec le refus de prendre Dieu pour refuge; « mais » rend naturellement cette valeur adversative.
- source_word: בְּרֹב עָשְׁרוֹ
  choice: dans l’abondance de ses richesses
  rationale: La formulation conserve à la fois l’idée de grande quantité portée par רֹב et celle de richesse portée par עֹשֶׁר.
- source_word: יָעֹז
  choice: s’est fortifié
  rationale: Le verbe exprime le fait de devenir fort ou de chercher sa force. La tournure pronominale est concise et garde le lien lexical avec la force sans préciser indûment le mécanisme.
- source_word: בְּהַוָּתוֹ
  choice: par ce qui cause sa ruine
  rationale: הַוָּה peut désigner la ruine, le désastre, un désir mauvais ou des entreprises destructrices. Cette formulation rend l’ironie probable du contexte tout en évitant le français obscur « dans sa ruine ».
theological_decisions:
- issue: Valeur du masculin singulier הַגֶּבֶר
  choice: l’homme
  alternative: la personne
  rationale: L’hébreu présente un homme au masculin singulier comme exemple représentatif; conserver « l’homme » respecte cette donnée grammaticale sans universaliser explicitement le référent.
- issue: Sens de הַוָּה
  choice: ce qui cause sa ruine
  alternative: sa ruine; son mauvais désir; ses entreprises destructrices
  rationale: 'Le terme est polysémique et le contexte permet une ironie: l’homme tire sa force de ce qui est en réalité ruineux. Les autres sens possibles sont signalés plutôt que résolus silencieusement.'
translation_notes:
  register: Français international moderne, digne et lisible. La structure antithétique du verset est conservée, ainsi que l’ambiguïté du dernier nom hébreu au moyen d’une note.
