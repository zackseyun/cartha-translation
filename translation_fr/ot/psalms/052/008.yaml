  rationale: La révision remplace une paraphrase causale par une traduction qui correspond à la forme possessive et à la préposition de l’hébreu. Elle conserve ainsi la tension du dernier membre, sans décider si הַוָּה désigne principalement la ruine, le désastre, un désir mauvais ou des agissements destructeurs.
