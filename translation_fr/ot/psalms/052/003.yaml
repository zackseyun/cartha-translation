    issue: Rattachement français trompeur de « pratiquant la tromperie »
    rationale: Après « un rasoir affilé », le participe masculin singulier se rapporte normalement à « rasoir ». La phrase donne donc l’impression qu’un rasoir pratique la tromperie, alors que le participe hébreu est interprété soit en lien avec la langue, soit avec l’homme interpellé. Une reformulation est nécessaire pour éviter cette lecture grammaticalement forcée.
  revised_text: Tu projettes des ravages[a] ; ta langue est comme un rasoir affilé, faisant œuvre de tromperie[b].
