  text: הַ֭וּוֹת תַּחְשֹׁ֣ב לְשׁוֹנֶ֑/ךָ כְּ/תַ֥עַר מְ֝לֻטָּ֗שׁ עֹשֵׂ֥ה רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/003.yaml
  text: You devise destruction[a]; your tongue is like a sharpened razor[c][b], working deceit.
translation:
  language: fr
  text: Tu projettes des ravages[a] ; ta langue est comme un rasoir affilé, faisant œuvre de tromperie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « des destructions » ; ce pluriel hébreu désigne collectivement des ravages ou un mal destructeur.
    reason: lexical_alternative
  - marker: b
    text: Le participe hébreu peut être compris comme se rapportant à la langue ou à la personne interpellée, qui agit avec tromperie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: la destruction
  rationale: Le pluriel hébreu désigne ici collectivement des actes ou des effets destructeurs. Le singulier collectif est plus naturel en français tout en conservant l’idée de ruine causée.
- source_word: תַּחְשֹׁב
  choice: tu projettes
  rationale: Le verbe à la deuxième personne exprime ici une intention calculée, et non une simple pensée. « Projeter » rend cette idée sans déplacer le sujet vers « ta langue ».
- source_word: לְשׁוֹנֶךָ
  choice: ta langue
  rationale: La traduction littérale préserve l’image corporelle de la parole comme instrument de nuisance.
- source_word: כְתַעַר מְלֻטָּשׁ
  choice: comme un rasoir affilé
  rationale: La comparaison est explicite. « Affilé » convient naturellement à une lame rendue tranchante et maintient la force menaçante de l’image.
- source_word: עֹשֵׂה רְמִיָּה
  choice: pratiquant la tromperie
  rationale: Cette formulation conserve la valeur active du participe et, par son rattachement syntaxique ouvert, ne tranche pas entièrement entre la langue et la personne interpellée comme agent de la tromperie.
theological_decisions:
- issue: Référent du participe עֹשֵׂה (« pratiquant »)
  choice: Conserver une formulation participiale légèrement ouverte
  alternative: « toi qui pratiques la tromperie » ou « elle pratique la tromperie »
  rationale: L’hébreu permet de rapporter le participe à la langue ou, en apposition, à la personne interpellée. Le texte français évite de résoudre silencieusement cette ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. Le point-virgule respecte la césure principale et distingue le sujet implicite « tu » du premier membre de « ta langue » dans le second.
