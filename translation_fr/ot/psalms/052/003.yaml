review_pass:
  verdict: revise
  source_fidelity: 'Le premier membre rend correctement le verbe à la deuxième personne (« Tu projettes ») et respecte la césure qui fait de « ta langue » le sujet du second membre. « Des ravages » reflète plus directement le pluriel הַוּוֹת tout en restant idiomatique. La formulation actuelle du dernier participe est toutefois syntaxiquement mal rattachée en français : placé après « un rasoir affilé », « pratiquant » qualifie grammaticalement le rasoir, ce qui ne rend pas de manière fiable l’ambiguïté d’interprétation du participe hébreu.'
  naturalness: « Tu projettes des ravages ; ta langue est comme un rasoir affilé, faisant œuvre de tromperie » est naturel dans un registre poétique moderne. « Faisant œuvre de tromperie » évite l’image incongrue d’un rasoir qui « pratique » et laisse la relation exacte entre la langue et la personne interpellée moins explicitement déterminée.
  terminology: « Ravages » rend bien le pluriel collectif de הַוּוֹת. « Rasoir affilé » est exact et idiomatique pour כְּתַעַר מְלֻטָּשׁ. « Tromperie » rend correctement רְמִיָּה sans imposer le terme plus spécialisé « fraude » ou « trahison ».
  issues:
