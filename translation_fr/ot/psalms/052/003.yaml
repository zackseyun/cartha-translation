revisions:
- from: Tu projettes la destruction[a] ; ta langue est comme un rasoir affilé, pratiquant la tromperie[b].
  to: Tu projettes des ravages[a] ; ta langue est comme un rasoir affilé, faisant œuvre de tromperie[b].
  rationale: La révision remplace le singulier collectif « la destruction » par le pluriel naturel « des ravages », plus proche de la forme hébraïque, et corrige le rattachement syntaxique du participe final. Elle conserve la distinction essentielle entre la personne qui projette et sa langue, comparée à un rasoir, sans trancher indûment la portée du participe hébreu.
