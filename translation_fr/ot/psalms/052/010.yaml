id: PSA.52.10
reference: Psalms 52:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: fr
  text: Je te rendrai grâce pour toujours, car tu as agi. J’espérerai en ton nom[a], car il est bon, en présence de ceux qui te sont fidèles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu peut aussi exprimer l’idée d’attendre avec confiance : « j’attendrai ton nom ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Je te rendrai grâce
  rationale: Le hiphil de ידה exprime ici l’action de remercier Dieu et de célébrer ce qu’il a fait. « Rendre grâce » conserve ces deux nuances dans un français actuel et digne.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend naturellement l’idée d’une durée sans fin.
- source_word: כִּי עָשִׂיתָ
  choice: car tu as agi
  rationale: Le verbe עשה est employé sans complément exprimé. « Tu as agi » reste naturel en français sans ajouter un pronom dont le référent devrait être déduit du contexte.
- source_word: וַאֲקַוֶּה שִׁמְךָ
  choice: J’espérerai en ton nom
  rationale: קוה peut désigner l’attente confiante ou l’espérance. La construction avec « ton nom » est inhabituelle; « espérer en ton nom » communique clairement la confiance placée dans le caractère révélé de Dieu, tout en gardant l’image biblique du nom. Une note signale la nuance d’attente.
- source_word: כִּי טוֹב
  choice: car il est bon
  rationale: Le masculin singulier « il » renvoie naturellement au « nom », sans répéter celui-ci et en conservant la formulation concise de l’hébreu.
- source_word: נֶגֶד חֲסִידֶיךָ
  choice: en présence de ceux qui te sont fidèles
  rationale: נגד indique que la déclaration se fait devant la communauté, tandis que חסיד désigne des personnes attachées à Dieu avec fidélité. Cette formulation évite les connotations techniques que pourrait avoir « saints ».
theological_decisions:
- issue: Sens de l’espérance placée dans le nom de Dieu
  choice: J’espérerai en ton nom
  alternative: J’attendrai ton nom
  rationale: Le texte associe directement קוה au nom de Dieu. Le choix principal exprime une attente confiante sans réduire le « nom » à une simple appellation; la note préserve la valeur plus concrète d’attente portée par le verbe.
- issue: Désignation des חֲסִידֶיךָ
  choice: ceux qui te sont fidèles
  alternative: tes fidèles / tes saints
  rationale: Le terme évoque l’attachement loyal à Dieu et ne doit pas être chargé d’un sens ecclésiologique technique ultérieur.
- issue: Référent de טוֹב
  choice: il est bon
  alternative: ton nom est bon
  rationale: Le nom de Dieu est l’antécédent grammatical et contextuel le plus naturel. Le pronom maintient toutefois la brièveté de l’énoncé hébreu.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme des deux engagements à la première personne est conservé, avec deux phrases pour éviter une ponctuation trop lourde.
