source:
  edition: WLC
  text: גַּם אֵל֮ יִתָּצְ/ךָ֪ לָ֫/נֶ֥צַח יַחְתְּ/ךָ֣ וְ/יִסָּחֲ/ךָ֣ מֵ/אֹ֑הֶל וְ/שֵֽׁרֶשְׁ/ךָ֨ מֵ/אֶ֖רֶץ חַיִּ֣ים סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: fr
  text: Mais Dieu aussi te renversera à jamais ; il t’emportera, t’arrachera de ta tente et te déracinera du pays des vivants[c][a][b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il te saisira » ou « il t’enlèvera ». Le verbe hébreu est rare et évoque une prise suivie d’un enlèvement énergique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « de la tente ». Le mot peut désigner une tente ou, par extension, une demeure.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « ta racine du pays des vivants » ; le sens est qu’il te déracinera du pays des vivants.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Mais Dieu, lui aussi
  rationale: גַּם a normalement une valeur additive (« aussi »), tandis que le contexte lui donne ici une nuance de contraste avec les paroles précédentes. La formulation française conserve les deux aspects.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל désigne ici Dieu ; « Dieu » est le rendu français naturel et non marqué.
- source_word: יִתָּצְךָ
  choice: te démolira
  rationale: Le verbe נתץ évoque la destruction ou la démolition, souvent celle d’une construction. « Démolir » garde cette image violente et prépare le passage de la métaphore du bâtiment à celle de la plante déracinée.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: L’expression indique le plus naturellement une durée permanente. Elle préserve la force du jugement sans préciser davantage sa portée théologique.
- source_word: יַחְתְּךָ
  choice: il te saisira
  rationale: Le verbe rare חתה exprime ici une prise ou un enlèvement énergique. « Saisir » reste naturel tout en laissant la note signaler d’autres nuances possibles.
- source_word: וְיִסָּחֲךָ
  choice: et t’arrachera
  rationale: נסח signifie enlever, arracher ou tirer hors de quelque chose. « Arracher » rend la force du mouvement et s’accorde avec le complément désignant la tente.
- source_word: מֵאֹהֶל
  choice: à ta tente
  rationale: אֹהֶל signifie littéralement « tente ». Le possessif n’est pas exprimé morphologiquement dans le texte hébreu, mais il est naturellement déduit de l’adresse à la deuxième personne et rend la phrase idiomatique en français.
- source_word: וְשֵׁרֶשְׁךָ
  choice: il te déracinera
  rationale: L’hébreu dit littéralement « et ta racine », dans une construction poétique elliptique. Le verbe français explicite l’action sous-entendue tout en conservant l’image de la racine.
- source_word: מֵאֶרֶץ חַיִּים
  choice: du pays des vivants
  rationale: Cette expression hébraïque traditionnelle désigne le monde de ceux qui vivent, par opposition à la mort. « Le pays des vivants » en conserve l’image et reste intelligible.
- source_word: סֶלָה
  choice: Sélah
  rationale: La fonction exacte du terme demeure incertaine ; il est donc translittéré plutôt qu’interprété.
theological_decisions:
- issue: Portée du jugement exprimé par לָנֶצַח
  choice: pour toujours
  alternative: entièrement / une fois pour toutes
  rationale: Le sens temporel durable est le plus naturel. Ce choix affirme la permanence du jugement annoncé sans trancher des questions métaphysiques que le verset ne développe pas.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement conserve l’adresse directe du texte hébreu. Les images successives de démolition, d’arrachement à la tente et de déracinement sont maintenues. « Sélah » est translittéré avec l’accentuation française usuelle.
