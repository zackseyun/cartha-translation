  naturalness: Le texte est globalement clair et poétique. « Dieu aussi te renversera à jamais » est plus naturel et moins ambigu que « Mais Dieu, lui aussi, te démolira pour toujours » ; « démolir » appliqué à une personne peut en outre sonner familièrement ou mécanique dans ce contexte.
  terminology: « pays des vivants » et « Sélah » conviennent. Le tutoiement et les métaphores de renversement, d’arrachement et de déracinement sont préservés. La note b doit correspondre au texte principal et ne pas présenter « hors de la tente » comme une citation littérale française avec un possessif absent.
