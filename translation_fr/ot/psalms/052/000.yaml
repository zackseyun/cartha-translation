translation:
  language: fr
  text: Au chef de chœur[a]. Maskil[b] de David[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour le chef de chœur ».
    reason: lexical_alternative
  - marker: b
    text: Hébreu maskil, probablement un terme musical ou littéraire ; peut-être « psaume didactique » ou « chant méditatif ».
    reason: lexical_alternative
  - marker: c
    text: Ou « par David » ou « pour David » ; l’hébreu peut indiquer l’auteur, la destination, l’appartenance ou une association.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Au chef de chœur » est une formulation française consacrée, concise et compatible avec le sens directionnel ou destinataire de la préposition.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le sens précis de ce terme technique dans les titres de psaumes demeure incertain. La translittération évite de trancher entre les interprétations « psaume didactique », « chant méditatif » ou une indication musicale.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, la destination ou l’association. « De David » conserve en français une part de cette ambiguïté sans imposer explicitement l’idée d’auteur.
theological_decisions:
- issue: Rapport de David au psaume exprimé par לְדָוִד
  choice: de David
  alternative: par David ; pour David ; appartenant à David
  rationale: Le titre hébreu ne précise pas sans ambiguïté qu’il s’agit de l’auteur. La formulation retenue préserve l’indétermination historique et théologique du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève respecte la forme d’un titre de psaume. Les marqueurs sont placés immédiatement après les expressions qu’ils expliquent.
