source:
  edition: WLC
  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: fr
  text: Tu as aimé le mal plutôt que le bien, le mensonge plutôt que de dire ce qui est juste.[a] Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le mensonge plutôt que dire ce qui est juste » ; on peut aussi comprendre : « la fausseté plutôt qu’une parole droite ».'
    reason: La formulation hébraïque emploie le nom « mensonge, fausseté » en parallèle avec le verbe « dire, parler » ; plusieurs tournures françaises sont possibles.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: tu as aimé
  rationale: Le parfait qal à la deuxième personne masculine du singulier interpelle directement l’homme mauvais. Le passé composé conserve l’aspect accompli tout en gardant la vigueur actuelle de l’accusation.
- source_word: רָּע
  choice: le mal
  rationale: En opposition directe avec « le bien », le terme a ici un sens moral général.
- source_word: מִטּוֹב
  choice: plutôt que le bien
  rationale: Après un verbe exprimant une préférence, מִן marque ici ce qui est préféré à autre chose. « Plutôt que » est idiomatique en français et n’impose pas une mesure quantitative.
- source_word: שֶׁקֶר
  choice: mentir
  rationale: Le nom signifie « mensonge » ou « fausseté ». La formulation verbale « mentir » rend naturellement en français le parallélisme avec « dire », sans changer la portée éthique du terme.
- source_word: מִדַּבֵּר
  choice: plutôt que dire
  rationale: La préposition מִן introduit de nouveau l’élément rejeté dans la comparaison, tandis que la forme verbale est naturellement rendue par un infinitif français.
- source_word: צֶדֶק
  choice: ce qui est juste
  rationale: Dans ce contexte de parole opposée au mensonge, צֶדֶק désigne ce qui est droit, vrai et conforme à la justice. Cette expression française conserve le sens éthique sans suggérer exclusivement la justice judiciaire.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le terme liturgique ou musical est translittéré, sa fonction précise demeurant incertaine.
theological_decisions:
- issue: Traduction de צֶדֶק dans un contexte de parole
  choice: dire ce qui est juste
  alternative: dire la justice / parler avec droiture
  rationale: Le contexte oppose le mensonge à une parole droite. « Ce qui est juste » préserve la dimension morale de צֶדֶק tout en restant naturel et sans réduire le terme à son seul sens judiciaire.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé, tandis que « mentir » évite une construction nominale lourde en français. « Sélah » est maintenu sans interprétation.
