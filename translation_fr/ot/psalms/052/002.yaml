  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: fr
  text: Pourquoi te vantes-tu du mal, homme puissant ? La bonté fidèle de Dieu dure tout le jour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: te glorifies-tu du mal
  rationale: Le verbe réfléchi הלל exprime ici le fait de se vanter ou de tirer gloire de quelque chose; «se glorifier du mal» rend naturellement la construction avec ב et conserve la force morale du reproche.
- source_word: הַגִּבּוֹר
  choice: homme puissant
  rationale: גִּבּוֹר peut désigner un homme fort, puissant ou vaillant. Dans cette apostrophe ironique ou accusatrice, «homme puissant» préserve la portée sans introduire l’idée positive de bravoure.
- source_word: חֶסֶד אֵל
  choice: la bonté fidèle de Dieu
  rationale: חֶסֶד associe bonté, loyauté et fidélité relationnelle; «bonté fidèle» en conserve les principales nuances. אֵל est rendu par «Dieu».
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Expression temporelle littérale pouvant signifier continuellement au cours du jour; la formulation française conserve sa concision et son contraste avec la vantardise humaine.
theological_decisions:
- issue: Rapport syntaxique de חֶסֶד אֵל כָּל הַיּוֹם avec la question précédente
  choice: 'Phrase déclarative indépendante : «La bonté fidèle de Dieu subsiste tout le jour.»'
  alternative: Comprendre implicitement que l’homme se vante alors que la bonté de Dieu demeure, ou rattacher plus étroitement les mots à l’interpellation.
  rationale: Le texte hébreu est très condensé et ne contient pas de verbe explicite dans le second membre. Une déclaration nominale avec «subsiste» exprime la permanence suggérée sans préciser abusivement le rapport logique.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. L’apostrophe «homme puissant» conserve la tension et la possible ironie de l’hébreu; «subsiste» est ajouté comme copule française nécessaire, sans transformer la ligne en affirmation plus précise que le texte source.
