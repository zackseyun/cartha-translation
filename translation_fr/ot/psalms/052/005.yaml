  text: אָהַ֥בְתָּ כָֽל דִּבְרֵי בָ֗לַע לְשׁ֣וֹן מִרְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/005.yaml
  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: fr
  text: Tu aimes toutes les paroles qui dévorent, langue trompeuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Tu aimes
  rationale: Le qal accompli, dans cette accusation poétique directe, décrit une disposition établie. Le présent français l’exprime naturellement sans réduire l’énoncé à un acte passé.
- source_word: כָל
  choice: toutes les
  rationale: Avec le pluriel construit דִּבְרֵי, « toutes les » rend directement la totalité visée.
- source_word: דִּבְרֵי
  choice: paroles
  rationale: Le pluriel construit de דָּבָר désigne ici des paroles ou propos; « paroles » convient au contexte centré sur la langue.
- source_word: בָלַע
  choice: qui dévorent
  rationale: Ce choix conserve l’image vive de la racine « avaler, dévorer » et exprime en français le caractère destructeur de ces paroles sans remplacer la métaphore par une interprétation abstraite.
- source_word: לְשׁוֹן
  choice: langue
  rationale: La traduction littérale maintient la personnification poétique de l’organe de la parole.
- source_word: מִרְמָה
  choice: trompeuse
  rationale: Le nom « tromperie, perfidie » qualifie la langue. L’adjectif « trompeuse » est naturel en français et préserve le sens sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et poétique. La personnification « langue trompeuse » est conservée; l’interjection vieillie « ô » est évitée. La métaphore de la dévoration est maintenue plutôt que neutralisée en « paroles destructrices ».
