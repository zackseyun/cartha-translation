id: PSA.52.9
reference: Psalms 52:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: fr
  text: Mais moi, je suis comme un olivier verdoyant[a] dans la maison de Dieu ; je mets ma confiance dans l’amour fidèle de Dieu[b], pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un olivier plein de vigueur » ou « un olivier toujours vert ». L’adjectif hébreu souligne une vitalité verdoyante.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ḥésèd désigne notamment l’amour loyal et constant de Dieu ; selon le contexte, on peut aussi traduire par « bonté », « bienveillance » ou « fidélité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent le contraste avec le méchant décrit auparavant. « Mais moi » restitue cette mise en relief avec naturel.
- source_word: כְּזַיִת רַעֲנָן
  choice: comme un olivier verdoyant
  rationale: כְּ introduit une comparaison, זַיִת désigne ici l’olivier, et רַעֲנָן évoque sa verdeur pleine de vitalité. « Verdoyant » conserve à la fois l’image végétale et l’idée de vigueur.
- source_word: בְּבֵית אֱלֹהִים
  choice: dans la maison de Dieu
  rationale: Cette traduction directe préserve l’image du sanctuaire tout en restant naturelle et familière en français biblique moderne.
- source_word: בָּטַחְתִּי
  choice: je mets ma confiance
  rationale: L’accompli hébreu peut exprimer une confiance établie qui demeure. Le présent français rend clairement cette disposition durable.
- source_word: בְחֶסֶד אֱלֹהִים
  choice: dans l’amour fidèle de Dieu
  rationale: חֶסֶד associe bonté, attachement loyal et constance. « Amour fidèle » exprime ces dimensions sans réduire le terme à la seule compassion ni imposer une formulation confessionnelle particulière.
- source_word: עוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: La formule redoublée intensifie l’idée de durée sans fin ; cette expression française en conserve l’emphase poétique.
theological_decisions:
- issue: Sens de חֶסֶד appliqué à Dieu
  choice: amour fidèle
  alternative: bonté, bienveillance, fidélité, amour d’alliance
  rationale: Le psalmiste fonde sa confiance sur l’attachement loyal et durable de Dieu. « Amour fidèle » maintient ensemble la dimension affective et la constance relationnelle du mot, sans enfermer celui-ci dans un système doctrinal particulier.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le contraste initial, l’image du sanctuaire et le parallélisme poétique. « Verdoyant » et « amour fidèle » rendent les termes hébreux riches sans les surinterpréter.
