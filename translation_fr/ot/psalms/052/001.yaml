source:
  edition: WLC
  text: בְּ/ב֤וֹא דּוֹאֵ֣ג הָ/אֲדֹמִי֮ וַ/יַּגֵּ֪ד לְ/שָׁ֫א֥וּל וַ/יֹּ֥אמֶר ל֑/וֹ בָּ֥א דָ֝וִ֗ד אֶל בֵּ֥ית אֲחִימֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/001.yaml
  text: when Doeg the Edomite came and told Saul[a], saying to him, “David has come to the house of Ahimelech.”
translation:
  language: fr
  text: 'quand Doëg l’Édomite vint informer Saül et lui dit : « David est venu chez Ahimélek[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « David vint chez Ahimélek. » Dans le discours rapporté, l’accompli hébreu peut se rendre soit par un passé narratif, soit par un passé composé soulignant la pertinence présente de l’action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹוא
  choice: quand … vint
  rationale: La préposition בְּ suivie de l’infinitif construit de בוא introduit une proposition temporelle. « Quand … vint » rend naturellement cette construction et convient au cadre narratif.
- source_word: דּוֹאֵג
  choice: Doëg
  rationale: Transcription française usuelle du nom propre, avec tréma pour signaler que les voyelles se prononcent séparément.
- source_word: הָאֲדֹמִי
  choice: l’Édomite
  rationale: Le gentilé identifie Doëg par son origine ou son appartenance ethnique ; « l’Édomite » est l’équivalent français concis et traditionnel.
- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: informer Saül
  rationale: À la forme hiphil, נגד signifie ici faire connaître ou rapporter une information. « Informer Saül » est naturel en français et conserve l’idée d’un rapport adressé au roi.
- source_word: וַיֹּאמֶר לוֹ
  choice: et lui dit
  rationale: La formulation préserve la succession verbale de l’hébreu et introduit directement le contenu du rapport.
- source_word: בָּא
  choice: est venu
  rationale: L’accompli qal de בוא désigne une venue achevée, présentée dans le discours rapporté avec une pertinence actuelle pour Saül. Le passé composé français exprime naturellement cette nuance, sans exclure une lecture purement narrative.
- source_word: אֶל בֵּית אֲחִימֶלֶךְ
  choice: chez Ahimélek
  rationale: Littéralement « vers la maison d’Ahimélek ». En français actuel, « chez Ahimélek » exprime idiomatiquement le mouvement vers sa demeure sans alourdir la phrase.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et fluide. Le passé simple porte le récit introductif (« vint », « dit »), tandis que le passé composé dans la citation (« est venu ») maintient le point de vue du rapport adressé à Saül. Le fragment conserve sa forme de proposition temporelle, puisqu’il appartient à la suscription développée du psaume.
