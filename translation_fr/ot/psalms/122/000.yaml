  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: fr
  text: 'Chant des montées[a]. De David.


    Je me suis réjoui quand ils m’ont dit :


    « Allons à la maison de Yahvé[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Titre hébreu : « Chant des montées ». Il désigne probablement un chant de pèlerinage ou une collection liturgique ; on peut aussi traduire : « chant des ascensions » ou « chant des degrés ».'
    reason: cultural_note
  - marker: b
    text: « Yahvé » transcrit le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: 'Rend formellement le titre hébreu tout en conservant son ambiguïté : il peut désigner les montées vers Jérusalem ou une collection liturgique.'
- source_word: לְדָוִד
  choice: De David
  rationale: Conserve la formulation traditionnelle et l’ambiguïté de la préposition לְ, qui peut indiquer l’auteur, l’appartenance ou une dédicace.
- source_word: שָׂמַחְתִּי
  choice: Je me suis réjoui
  rationale: Exprime directement l’accompli hébreu à la première personne et garde le registre poétique.
- source_word: בְּאֹמְרִים לִי
  choice: quand on m’a dit
  rationale: Le participe pluriel hébreu a un sujet indéfini; le français « on » le rend naturellement sans inventer d’interlocuteurs précis.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: « Maison » préserve l’image cultuelle du texte et « Yahvé » représente explicitement le nom divin YHWH.
- source_word: נֵלֵךְ
  choice: Allons
  rationale: Rend le cohortatif pluriel comme une invitation collective énergique.
theological_decisions:
- issue: Sens du titre « montées »
  choice: Conserver « Chant des montées » dans le texte et expliquer l’incertitude en note
  alternative: « Chant des pèlerinages » ou « chant des degrés »
  rationale: Le sens précis du titre de la collection n’est pas certain; une traduction interprétative aurait indûment tranché.
- issue: Rendu du tétragramme יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La translittération française courante rend visible le nom propre divin sans le remplacer par un titre.
- issue: Portée de לְדָוִד
  choice: De David
  alternative: « Pour David » ou « appartenant à David »
  rationale: La formulation concise traditionnelle conserve mieux l’éventail sémantique de la suscription hébraïque.
translation_notes:
  register: Français international moderne, poétique et digne. La mise en lignes distingue la suscription du verset et met en relief la parole collective, sans ajouter d’éléments absents de l’hébreu.
