source:
  edition: WLC
  text: יְהִֽי שָׁל֥וֹם בְּ/חֵילֵ֑/ךְ שַׁ֝לְוָ֗ה בְּ/אַרְמְנוֹתָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/007.yaml
  text: May there be peace within your ramparts[c][b][a], prosperity within your citadels.
translation:
  language: fr
  text: Que la paix règne dans tes remparts[a], la tranquillité dans tes citadelles[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ton enceinte fortifiée ». Le terme hébreu désigne ici les défenses ou l'enceinte d'une ville.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans tes palais ». Le mot hébreu peut désigner des palais ou des places fortes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Que… règne
  rationale: Le jussif de היה exprime ici un souhait ou une prière. Cette tournure française est naturelle et conserve la valeur optative.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם peut désigner la paix, le bien-être ou l'intégrité. « La paix » convient directement à la prière pour Jérusalem.
- source_word: בְּחֵילֵךְ
  choice: dans tes remparts
  rationale: חֵיל désigne ici l'enceinte défensive ou les fortifications de la ville. « Remparts » est précis et idiomatique dans ce contexte.
- source_word: שַׁלְוָה
  choice: la tranquillité
  rationale: שַׁלְוָה évoque le calme, l'aisance et un bien-être assuré. « Tranquillité » préserve ce sens sans réduire le terme à la prospérité matérielle.
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: dans tes citadelles
  rationale: אַרְמוֹן peut désigner un palais ou une place forte. « Citadelles » maintient à la fois le registre urbain élevé et la nuance défensive, en parallèle avec les remparts.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé. « Tranquillité » rend la sécurité paisible de שַׁלְוָה et évite d'imposer le sens plus étroit de prospérité matérielle.
