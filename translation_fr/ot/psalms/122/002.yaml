translation:
  language: fr
  text: Nos pieds se tiennent à tes portes[a], Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nos pieds se tenaient à tes portes, Jérusalem. » L’hébreu emploie un participe avec « étaient », une périphrase qui peut aussi être rendue par l’imparfait.'
    reason: Préserve l’alternative aspectuelle et temporelle de la périphrase hébraïque, tout en adoptant une formulation française idiomatique.
lexical_decisions:
- source_word: עֹמְדוֹת
  choice: se tiennent
  rationale: Le participe qal féminin pluriel s’accorde avec « nos pieds » et exprime une posture ou un état qui dure. « Se tiennent » est naturel en français et conserve cette valeur stative.
- source_word: הָיוּ
  choice: se tiennent
  rationale: Le parfait de היה avec le participe forme une tournure périphrastique. Dans ce contexte de joie à l’arrivée, le présent français exprime naturellement l’état atteint, tandis que l’imparfait reste possible et est signalé en note.
- source_word: רַגְלֵינוּ
  choice: nos pieds
  rationale: Traduction directe du pluriel avec suffixe de première personne du pluriel, qui préserve l’image concrète des pèlerins arrivés à destination.
- source_word: בִּשְׁעָרַיִךְ
  choice: dans tes portes
  rationale: Le בְּ locatif et « tes portes » désignent l’espace des portes de la ville. La formulation conserve l’image hébraïque sans imposer plus précisément « à » ou « à l’intérieur de ».
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. L’apostrophe finale sans « ô » évite une solennité archaïsante; le point d’exclamation rend l’élan poétique de l’adresse. La note préserve l’ambiguïté entre état présent et scène évoquée au passé.
