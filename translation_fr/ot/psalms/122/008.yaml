  text: לְ֭מַעַן אַחַ֣/י וְ/רֵעָ֑/י אֲדַבְּרָה נָּ֖א שָׁל֣וֹם בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/008.yaml
  text: For the sake of my brothers and my companions[a], I will now say[c][b], “Peace be within you.”
translation:
  language: fr
  text: 'Pour le bien de mes frères et de mes compagnons, je dirai maintenant[a] : « Que la paix soit en toi ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La particule hébraïque rendue par « maintenant » peut aussi ajouter une nuance d'insistance ou de prière ; la phrase peut alors se comprendre comme une déclaration de bénédiction pressante.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « paix » peut aussi évoquer le bien-être, l'intégrité ou la prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: À cause de
  rationale: Exprime ici le motif qui pousse le psalmiste à prononcer cette parole en faveur de Jérusalem.
- source_word: אַחַי
  choice: mes frères
  rationale: Reproduit le masculin pluriel concret du texte hébreu et son sens communautaire.
- source_word: וְרֵעָי
  choice: mes compagnons
  rationale: רֵעַ peut désigner un ami, un proche ou un compagnon ; « compagnons » convient au parallélisme avec « frères » et au cadre communautaire.
- source_word: אֲדַבְּרָה נָּא
  choice: je veux dire maintenant
  rationale: « Je veux dire » rend la nuance volitive du cohortatif, tandis que « maintenant » représente une lecture naturelle de נָא sans exclure sa possible nuance d'insistance ou de supplication.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: 'Rendu traditionnel et naturel, qui conserve la richesse de sens de שָׁלוֹם : paix, bien-être, intégrité et prospérité.'
- source_word: בָּךְ
  choice: en toi
  rationale: Le suffixe féminin singulier s'adresse directement à Jérusalem, ville grammaticalement féminine ; « en toi » conserve cette adresse poétique.
theological_decisions:
- issue: Terme de parenté genré
  choice: mes frères
  alternative: mes proches ; mes frères et sœurs
  rationale: Le texte porte le masculin pluriel אַחַי. Le conserver évite de neutraliser une forme explicitement genrée, tout en laissant au contexte communautaire sa portée propre.
- issue: Destinataire de la parole de paix
  choice: 'Jérusalem est directement interpellée au féminin singulier : « Que la paix soit en toi ! »'
  alternative: Qu'il y ait la paix en elle
  rationale: Le suffixe בָּךְ est à la deuxième personne du féminin singulier et renvoie naturellement à Jérusalem ; l'adresse directe préserve la force poétique.
- issue: Valeur de la formule de paix
  choice: 'souhait : « Que la paix soit en toi ! »'
  alternative: 'déclaration elliptique : « Paix en toi ! »'
  rationale: L'hébreu présente une formule nominale brève. Le souhait français explicite naturellement sa portée sans transformer la paix en simple constat.
translation_notes:
  register: Français international moderne, poétique et digne. « Je veux dire maintenant » conserve la résolution personnelle du cohortatif sans la raideur de « je dirai maintenant ». Le tutoiement s'impose parce que le poète s'adresse directement à Jérusalem.
