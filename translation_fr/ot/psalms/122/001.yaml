id: PSA.122.1
reference: Psalms 122:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: fr
  text: 'Cantique des montées[a]. De David[b].


    Je me suis réjoui quand ils m’ont dit : « Allons à la maison de Yahweh[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Cantique des montées ». Ce titre désigne probablement un chant de pèlerinage ou une collection liturgique; on peut aussi comprendre « chant des montées » ou « chant des degrés ».'
    reason: Note culturelle et ambiguïté du titre hébreu.
  - marker: b
    text: « De David » peut aussi signifier « pour David » ou « appartenant à David »; le titre hébreu ne précise pas à lui seul la nature exacte du lien avec David.
    reason: Ambiguïté grammaticale de la préposition hébraïque.
  - marker: c
    text: Yahweh représente le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR » dans de nombreuses Bibles françaises.
    reason: Information sur le rendu du nom divin.
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cantique des montées
  rationale: « Cantique » rend naturellement שִׁיר dans un titre psalmique. « Montées » conserve l’expression traditionnelle et son possible rapport avec le pèlerinage, sans trancher dans le texte principal entre montée géographique, procession liturgique et nom de collection.
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ dans les titres de psaumes peut signaler l’auteur, l’appartenance, la dédicace ou l’association. « De David » maintient mieux cette souplesse que « par David » ou « pour David ».
- source_word: שָׂמַחְתִּי
  choice: Je me suis réjoui
  rationale: Le parfait à la première personne exprime la joie éprouvée par le psalmiste. Cette formulation est vive, naturelle et plus proche du verbe que le simple « j’ai été heureux ».
- source_word: בְּאֹמְרִים לִי
  choice: quand ils m’ont dit
  rationale: La construction introduit naturellement en français la circonstance temporelle de la joie. Le pluriel « ils » respecte la forme hébraïque, plutôt que l’impersonnel « on ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahweh
  rationale: Le syntagme construit désigne la maison, c’est-à-dire le sanctuaire, portant le nom divin. La traduction garde « maison » et rend directement le tétragramme par « Yahweh ».
- source_word: נֵלֵךְ
  choice: Allons
  rationale: Dans ce contexte de discours direct, l’imparfait à la première personne du pluriel a une valeur d’exhortation ou d’invitation, rendue naturellement par l’impératif français « Allons ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » conserve le nom propre dans le texte principal; une note signale la convention française traditionnelle « le SEIGNEUR ».
- issue: Portée de לְדָוִד dans le titre
  choice: De David
  alternative: Par David / Pour David
  rationale: Le titre peut indiquer l’auteur, une dédicace, une appartenance ou une association. Le français « De David » laisse subsister cette ambiguïté au lieu d’imposer une attribution d’auteur certaine.
translation_notes:
  register: Français international moderne, digne et accessible. Le titre conserve la formulation biblique reçue sans surinterpréter sa fonction. Le discours direct est bref et dynamique; le point d’exclamation rend l’élan de l’invitation sans ajouter de contenu.
