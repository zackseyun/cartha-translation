source:
  edition: WLC
  text: כִּ֤י שָׁ֨מָּ/ה יָשְׁב֣וּ כִסְא֣וֹת לְ/מִשְׁפָּ֑ט כִּ֝סְא֗וֹת לְ/בֵ֣ית דָּוִֽיד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/005.yaml
  text: For there thrones sit for judgment[c][b][a], thrones for the house of David.
translation:
  language: fr
  text: Car c’est là que sont établis les trônes pour rendre la justice[a], les trônes de la maison de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « là siègent des trônes pour le jugement » ; le verbe peut évoquer des trônes installés pour exercer la justice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’importance de Jérusalem dans le contexte immédiat.
- source_word: שָׁמָּה
  choice: c’est là
  rationale: Renvoie clairement à Jérusalem et donne en français naturel une légère valeur emphatique au locatif hébreu.
- source_word: יָשְׁבוּ
  choice: sont établis
  rationale: Le verbe signifie littéralement « s’asseoir » ou « siéger » ; avec des trônes pour sujet, il évoque leur installation durable et leur fonction officielle. Une note conserve l’image littérale.
- source_word: כִסְאוֹת
  choice: les trônes
  rationale: Préserve les connotations royales et judiciaires du nom, au-delà de simples sièges.
- source_word: לְמִשְׁפָּט
  choice: pour rendre la justice
  rationale: Exprime naturellement en français la fonction judiciaire des trônes, tout en conservant le champ sémantique de מִשְׁפָּט, qui comprend jugement et justice.
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: les trônes de la maison de David
  rationale: Rend l’association de ces trônes à la dynastie davidique de manière claire et idiomatique, sans réduire la maison de David à une simple institution civique.
theological_decisions:
- issue: Nature de la référence davidique
  choice: Les trônes sont associés à la maison royale de David et à sa fonction judiciaire à Jérusalem.
  alternative: Comprendre uniquement des tribunaux civiques, ou expliciter directement une lecture messianique.
  rationale: Le texte nomme la maison de David et les trônes de justice. La traduction garde ce cadre royal et judiciaire historique sans introduire dans le verset une interprétation messianique plus développée.
translation_notes:
  register: Français moderne, digne et poétique. « C’est là » maintient l’accent locatif ; « sont établis » évite l’expression peu naturelle « les trônes siègent », tandis que la note préserve la formulation concrète et l’ambiguïté du verbe hébreu.
