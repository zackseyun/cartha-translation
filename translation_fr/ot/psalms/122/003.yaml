  text: יְרוּשָׁלִַ֥ם הַ/בְּנוּיָ֑ה כְּ֝/עִ֗יר שֶׁ/חֻבְּרָה לָּ֥/הּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/003.yaml
  text: Jerusalem[a], built like a city joined together as one[b],
translation:
  language: fr
  text: Jérusalem, bâtie comme une ville dont toutes les parties sont reliées entre elles[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui forme en elle-même un ensemble uni ». L’hébreu souligne vraisemblablement la cohésion étroite de la ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Nom propre rendu selon sa forme française traditionnelle.
- source_word: הַבְּנוּיָה
  choice: bâtie
  rationale: Le participe passif de בנה qualifie Jérusalem et exprime son état résultant, sans imposer l’idée plus précise de reconstruction.
- source_word: כְּעִיר
  choice: comme une ville
  rationale: Le préfixe כ marque ici une comparaison; cette formulation française en conserve la portée.
- source_word: שֶׁחֻבְּרָה
  choice: dont toutes les parties sont reliées
  rationale: Le passif de חבר évoque des éléments joints ou assemblés; l’explicitation de «parties» rend naturellement en français la cohésion structurelle de la ville.
- source_word: לָּהּ
  choice: entre elles
  rationale: Le pronom féminin renvoie à la ville; dans cette formulation, il exprime le rapport interne entre ses parties sans reproduire maladroitement le littéral «à elle-même».
- source_word: יַחְדָּו
  choice: toutes … entre elles
  rationale: Cette tournure restitue l’idée d’ensemble et d’unité portée par l’adverbe.
theological_decisions: []
