  verdict: revise
  source_fidelity: 'Le mouvement (« montèrent »), le parallélisme « les tribus / les tribus de Yah » et la distinction entre יָהּ (Yah) et יהוה (le SEIGNEUR) sont bien rendus. En revanche, « selon le témoignage donné à Israël » interprète et amplifie עֵדוּת לְיִשְׂרָאֵל : ni « selon » ni « donné » ne sont exprimés dans l’hébreu. La fonction exacte de l’expression demeure discutée et doit rester ouverte. « Rendre grâce » correspond plus directement à לְהֹדוֹת que « célébrer ».'
  naturalness: Le français est poétique, clair et d’un registre approprié. Le passé simple « montèrent » convient à la diction psalmique. « Un témoignage pour Israël » est naturel tout en laissant place à l’ambiguïté du syntagme hébreu.
  terminology: « Yah » conserve la forme brève יָהּ, tandis que « le SEIGNEUR » représente יהוה selon une convention biblique française largement comprise. « Rendre grâce au nom du SEIGNEUR » exprime la reconnaissance et la louange impliquées par ידה sans imposer une interprétation cultuelle plus étroite.
  issues:
  - severity: medium
    issue: Interprétation et ajout dans « selon le témoignage donné à Israël »
    rationale: עֵדוּת לְיִשְׂרָאֵל ne comporte pas le verbe « donner » ni une préposition équivalente à « selon ». L’expression peut évoquer un témoignage, une attestation ou, selon certains, une prescription relative à Israël; la traduction ne doit pas trancher sans signalement.
  - severity: low
    issue: « célébrer » atténue la notion de reconnaissance de לְהֹדוֹת
    rationale: Dans ce contexte, le verbe signifie rendre grâce / remercier, avec une dimension de louange. « Rendre grâce » est plus proche tout en restant idiomatique.
  revised_text: 'C’est là que montèrent les tribus,

