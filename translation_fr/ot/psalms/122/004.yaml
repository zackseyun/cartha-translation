  text: שֶׁ/שָּׁ֨ם עָל֪וּ שְׁבָטִ֡ים שִׁבְטֵי יָ֭הּ עֵד֣וּת לְ/יִשְׂרָאֵ֑ל לְ֝/הֹד֗וֹת לְ/שֵׁ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: fr
  text: 'C’est là que montèrent les tribus,

    les tribus de Yah,

    un témoignage pour Israël,

    afin de rendre grâce au nom du SEIGNEUR.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלוּ
  choice: montèrent
  rationale: Le qatal hébreu est rendu par un passé simple, conformément à sa forme passée et au registre poétique du psaume; le verbe « monter » convient au pèlerinage vers Jérusalem.
- source_word: שִׁבְטֵי יָהּ
  choice: les tribus de Yah
  rationale: Conserve la forme divine poétique abrégée יָהּ et la distingue de יהוה à la fin du verset.
- source_word: עֵדוּת לְיִשְׂרָאֵל
  choice: selon le témoignage donné à Israël
  rationale: « Selon » exprime naturellement la valeur normative probable de עֵדוּת; « donné » explicite seulement la relation du lamed sans identifier davantage le contenu du témoignage.
- source_word: לְהֹדוֹת
  choice: afin de célébrer
  rationale: Dans ce contexte cultuel, ידה désigne la louange reconnaissante adressée au nom divin; « célébrer » restitue cette amplitude mieux que le seul « remercier ».
- source_word: שֵׁם יְהוָה
  choice: le nom du SEIGNEUR
  rationale: Suit la convention française courante qui représente le tétragramme par « le SEIGNEUR », tout en conservant « Yah » lorsqu’il figure explicitement sous sa forme abrégée.
theological_decisions:
- issue: Nature de עֵדוּת לְיִשְׂרָאֵל
  choice: selon le témoignage donné à Israël
  alternative: comme témoignage pour Israël
  rationale: La construction peut désigner soit une prescription normative imposée à Israël, soit un témoignage destiné à Israël. Le choix principal reflète l’usage fréquent de עֵדוּת pour une ordonnance divine, sans préciser laquelle.
- issue: Représentation des noms divins יָהּ et יהוה
  choice: « Yah » puis « le SEIGNEUR »
  alternative: « Yah » puis « Yahvé »
  rationale: La distinction formelle de l’hébreu est maintenue, sans assimiler silencieusement les deux graphies; « le SEIGNEUR » suit la convention biblique française pour le tétragramme.
translation_notes:
  register: Poésie française moderne, sobre et digne. Les lignes suivent les unités parallèles de l’hébreu. Le passé simple rend le récit liturgique avec concision; « C’est là que » met naturellement en relief שֶׁשָּׁם.
