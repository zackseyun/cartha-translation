  text: שַׁ֭אֲלוּ שְׁל֣וֹם יְרוּשָׁלִָ֑ם יִ֝שְׁלָ֗יוּ אֹהֲבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/006.yaml
  text: 'Pray for the peace of Jerusalem: may those who love you prosper[a][b].'
translation:
  language: fr
  text: 'Priez pour la paix de Jérusalem : que ceux qui t’aiment prospèrent[a][b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Demandez la paix pour Jérusalem. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que ceux qui t’aiment vivent dans la tranquillité » ; autre compréhension possible : « ceux qui t’aiment prospéreront ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: Priez pour
  rationale: L’impératif de שׁאל signifie littéralement « demandez ». Avec שְׁלוֹם comme objet et dans ce cadre liturgique, « priez pour » exprime naturellement une demande adressée à Dieu en faveur de Jérusalem.
- source_word: שְׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם englobe la paix, le bien-être et l’intégrité. « La paix » est ici une formulation naturelle et traditionnelle qui convient au contexte.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: יִשְׁלָיוּ
  choice: vivent dans la tranquillité
  rationale: Le verbe שלה peut évoquer la tranquillité, l’aisance, la sécurité ou la prospérité. Cette formulation conserve le lien avec la paix demandée sans réduire le sens à la réussite matérielle.
- source_word: אֹהֲבָיִךְ
  choice: ceux qui t’aiment
  rationale: Le participe muni du suffixe féminin singulier désigne ceux qui aiment Jérusalem et maintient l’adresse directe à la ville.
theological_decisions:
- issue: Valeur du second membre du vers
  choice: 'Souhait ou prière : « que ceux qui t’aiment vivent dans la tranquillité »'
  alternative: 'Déclaration ou promesse : « ceux qui t’aiment vivront dans la tranquillité »'
  rationale: L’imparfait hébreu peut avoir ici une valeur volitive ou indicative. Après l’impératif « Priez », le souhait s’intègre naturellement au mouvement de la prière, tout en signalant en note la possibilité d’une affirmation.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement renvoie directement à Jérusalem, conformément au suffixe féminin singulier hébreu. « Vivent dans la tranquillité » privilégie le champ de l’aisance paisible de שלה tout en laissant « prospèrent » en note.
