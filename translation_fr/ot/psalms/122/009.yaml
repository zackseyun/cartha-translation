  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: fr
  text: 'Pour la maison de Yahweh, notre Dieu,

    je rechercherai ton bien[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton bien-être » ou « ta prospérité ». Ici, le mot hébreu traduit par « bien » désigne ce qui contribue au bien-être de Jérusalem.
