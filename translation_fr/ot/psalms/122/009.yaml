lexical_decisions:
- source_word: לְמַעַן
  choice: À cause de
  rationale: Exprime ici le motif de l’engagement du psalmiste, dans un français naturel, sans exclure la nuance de finalité portée par la préposition hébraïque.
- source_word: בֵּית
  choice: la maison de
  rationale: Conserve l’image hébraïque de la « maison » tout en désignant, dans le contexte, le temple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec son suffixe de première personne du pluriel.
- source_word: אֲבַקְשָׁה
  choice: je rechercherai
  rationale: Le cohortatif exprime une résolution ou une intention ferme ; le futur français rend naturellement cet engagement.
- source_word: טוֹב
  choice: bien
  rationale: Préserve la formulation large de l’hébreu, qui désigne ici le bien-être et les conditions favorables de Jérusalem.
- source_word: לָךְ
  choice: ton
  rationale: Le suffixe féminin singulier renvoie à Jérusalem, directement interpellée dans le psaume.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; sa transcription préserve le nom divin personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. « Maison » conserve l’expression hébraïque tout en restant intelligible comme désignation du temple ; « ton bien » maintient la largeur sémantique de טוֹב, explicitée en note.
