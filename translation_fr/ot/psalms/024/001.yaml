id: PSA.24.1
reference: Psalms 24:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: fr
  text: 'Psaume de David[a].


    À Yahweh appartiennent la terre et tout ce qu’elle contient,

    le monde et ceux qui l’habitent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Psaume pour David » ou « Psaume associé à David ».'
    reason: Le préfixe hébreu לְ peut indiquer l’auteur, l’appartenance, l’association ou la destination.
lexical_decisions:
- source_word: לְדָוִד
  choice: de David
  rationale: Dans un titre de psaume, לְ peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » est naturel en français et évite de limiter explicitement le sens à « écrit par David ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme habituel pour un chant accompagné de musique; « psaume » est précis, digne et immédiatement compréhensible.
- source_word: לַיהוָה
  choice: À Yahweh appartiennent
  rationale: La proposition nominale hébraïque exprime ici la possession. Cette tournure française conserve la mise en relief initiale de Yahweh tout en restant naturelle.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallélisme avec תֵּבֵל et la portée universelle du verset favorisent « terre » plutôt que « pays ».
- source_word: וּמְלוֹאָהּ
  choice: et tout ce qu’elle contient
  rationale: Cette formulation rend naturellement l’idée de la totalité de ce qui remplit la terre, sans l’expression plus abstraite « sa plénitude ».
- source_word: תֵּבֵל
  choice: le monde
  rationale: Le mot désigne le monde habité et ordonné; « monde » convient au contexte, tandis que la mention de ses habitants explicite sa dimension humaine.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: et ceux qui l’habitent
  rationale: La traduction conserve la valeur verbale du participe hébreu et demeure fluide en français moderne.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom divin plutôt que de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, poétique mais accessible. La disposition en deux lignes reflète le parallélisme hébreu. « Tout ce qu’elle contient » privilégie une expression idiomatique tout en gardant la portée exhaustive de מְלוֹאָהּ.
