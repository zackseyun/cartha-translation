  text: כִּי ה֭וּא עַל יַמִּ֣ים יְסָדָ֑/הּ וְ/עַל נְ֝הָר֗וֹת יְכוֹנְנֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/002.yaml
  text: For he founded it upon the seas[a], and established it upon the rivers.
translation:
  language: fr
  text: 'Car c’est lui qui l’a fondée sur les mers,

    et qui l’a fermement établie sur les fleuves.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation du verset précédent et convient au registre poétique soutenu.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Rend l’emploi explicite et emphatique du pronom indépendant, plus nettement que le simple « il ».
- source_word: עַל יַמִּים
  choice: sur les mers
  rationale: Traduit directement la préposition et le pluriel de יָם, tout en conservant l’imagerie cosmologique du poème.
- source_word: יְסָדָהּ
  choice: l’a fondée
  rationale: Exprime l’action de poser un fondement; le pronom féminin reprend naturellement « la terre » au verset 1.
- source_word: וְעַל נְהָרוֹת
  choice: et sur les fleuves
  rationale: Préserve le parallélisme hébreu et le sens ordinaire de נָהָר sans remplacer l’image par une explication.
- source_word: יְכוֹנְנֶהָ
  choice: l’a fermement établie
  rationale: Rend la nuance de כון, qui évoque l’affermissement et la stabilité, tout en distinguant ce verbe de יסד.
theological_decisions:
- issue: Imagerie cosmologique de la terre fondée sur les mers et les fleuves
  choice: Conserver directement l’image poétique ancienne.
  alternative: La reformuler comme une simple affirmation abstraite de la stabilité de la terre.
  rationale: Le texte célèbre l’ordre donné par Dieu à la création au moyen d’une imagerie cosmologique hébraïque; la traduction ne doit ni la moderniser ni la réduire à une abstraction.
translation_notes:
  register: Français international moderne, poétique et digne. « Car » maintient le lien argumentatif avec le verset précédent; « c’est lui qui » conserve l’emphase du pronom hébreu. Le parallélisme en deux lignes est préservé.
