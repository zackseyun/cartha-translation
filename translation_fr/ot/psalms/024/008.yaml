  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: fr
  text: Qui est ce roi de gloire ? Yahweh, fort et puissant ; Yahweh, puissant au combat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puissant dans la guerre ».'
    reason: Alternative lexicale pour מִלְחָמָה, qui peut désigner la guerre aussi bien que le combat ou la bataille.
lexical_decisions:
- source_word: מִי זֶה
  choice: Qui est ce
  rationale: Cette tournure rend naturellement en français la question directe qui structure l’échange liturgique.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: roi de gloire
  rationale: Le complément « de gloire » conserve la construction hébraïque et la valeur de titre reprise dans le psaume.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel exprimé par le tétragramme, sans lui substituer un titre.
- source_word: עִזּוּז
  choice: fort
  rationale: Le terme exprime la force intense ; « fort » reste distinct du mot suivant tout en formant une expression française naturelle.
- source_word: וְגִבּוֹר
  choice: et puissant
  rationale: גִּבּוֹר désigne ici celui qui possède une grande puissance, avec une nuance guerrière que la suite explicite.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: puissant au combat
  rationale: Cette formulation conserve l’adjectif répété et le sens martial de מִלְחָמָה sans ajouter explicitement le nom « guerrier ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin ; le rendre par « Yahweh » préserve cette distinction au lieu de le remplacer par un titre.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme, la question liturgique et la répétition de « puissant » sont conservés.
