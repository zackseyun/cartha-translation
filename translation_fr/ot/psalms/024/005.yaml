id: PSA.24.5
reference: Psalms 24:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: fr
  text: Il recevra la bénédiction de Yahweh et la justice[a] du Dieu de son salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture », « la justification » ou « la réhabilitation ». Le terme hébreu peut évoquer aussi bien la rectitude morale que la justice salvatrice ou un verdict favorable rendu par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: recevra
  rationale: Avec le nom abstrait « bénédiction » comme complément, נָשָׂא a ici le sens idiomatique de recevoir ou d’obtenir, plutôt que celui de porter ou de soulever.
- source_word: בְרָכָה
  choice: la bénédiction
  rationale: « Bénédiction » est l’équivalent français naturel de בְּרָכָה. Le singulier hébreu est conservé; l’article défini convient à l’expression française dans ce contexte.
- source_word: מֵאֵת יְהוָה
  choice: de Yahweh
  rationale: La préposition indique la source de la bénédiction. Le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: וּצְדָקָה
  choice: et la justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou une décision favorable qui rétablit quelqu’un dans son droit. « Justice » garde en français une portée morale, relationnelle et judiciaire suffisamment large; les autres nuances sont signalées en note.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: du Dieu de son salut
  rationale: Cette formulation reproduit naturellement la construction hébraïque et laisse ouverte l’idée de Dieu comme source du salut aussi bien que comme celui qui sauve.
- source_word: יִשְׁעוֹ
  choice: son salut
  rationale: « Salut » convient au registre du psaume et conserve la portée large du nom hébreu, qui peut aussi évoquer la délivrance ou la victoire.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme, traité ici comme un nom propre. « Yahweh » le rend explicitement sans le remplacer par un titre.
- issue: Sens de צְדָקָה dans ce contexte
  choice: justice
  alternative: droiture; justification; réhabilitation
  rationale: Le terme décrit ce que le fidèle reçoit de Dieu et peut associer rectitude, justice salvatrice et verdict favorable. Le texte principal retient le terme français le plus large, tandis que la note préserve les nuances possibles sans trancher abusivement.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme hébreu entre « la bénédiction » et « la justice », ainsi que la formulation théologique « le Dieu de son salut ».
