  text: נְקִ֥י כַפַּ֗יִם וּֽ/בַר לֵ֫בָ֥ב אֲשֶׁ֤ר לֹא נָשָׂ֣א לַ/שָּׁ֣וְא נַפְשִׁ֑/י וְ/לֹ֖א נִשְׁבַּ֣ע לְ/מִרְמָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: fr
  text: Celui qui a les mains innocentes et le cœur pur, qui n’a pas élevé mon âme[a] vers le mensonge[b] et n’a pas juré pour tromper.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte écrit hébreu porte « mon âme » ; la lecture « son âme » s’accorde mieux avec la description à la troisième personne dans l’ensemble du verset.
    reason: textual_variant
  - marker: b
    text: Ou « vers le néant », « vers ce qui est faux » ; certains comprennent ici une allusion à une idole.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: les mains innocentes
  rationale: L’expression associe les mains à une conduite moralement irréprochable. « Les mains innocentes » conserve l’image concrète tout en étant plus naturel en français que « les mains propres », qui pourrait évoquer surtout la propreté physique.
- source_word: בַר לֵבָב
  choice: le cœur pur
  rationale: Cette expression désigne la pureté intérieure et forme un parallèle avec l’innocence manifestée dans les actes.
- source_word: נָשָׂא ... נַפְשִׁי
  choice: a élevé mon âme
  rationale: La traduction garde l’image hébraïque de l’âme élevée ou dirigée vers quelque chose et retient le suffixe de première personne du texte écrit fourni. La lecture contextuellement plus fluide « son âme » est signalée en note.
- source_word: לַשָּׁוְא
  choice: vers le mensonge
  rationale: שָׁוְא peut exprimer le faux, le vide ou ce qui est sans valeur. « Le mensonge » convient au contexte moral et fait écho à l’acte de jurer pour tromper, sans exclure les autres nuances, indiquées en note.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: a juré pour tromper
  rationale: Cette formulation française naturelle exprime un serment prononcé avec une intention trompeuse, sans limiter le sens au seul faux serment.
theological_decisions:
- issue: 'Suffixe de נַפְשִׁי : « mon âme » ou « son âme »'
  choice: Le texte principal retient « mon âme », conformément à la forme écrite dans la source WLC fournie.
  alternative: « son âme », lecture qui s’accorde avec la description à la troisième personne dans le reste du verset.
  rationale: La première personne crée une difficulté réelle dans le contexte, mais elle appartient au texte source fourni. La conserver dans le texte principal et présenter la lecture contextuelle en note évite de résoudre silencieusement la tension textuelle.
- issue: Portée de שָׁוְא
  choice: « le mensonge »
  alternative: « le néant », « ce qui est faux » ou, selon une interprétation possible, « une idole »
  rationale: Le terme possède une gamme sémantique allant du vide à la fausseté. Le contexte du serment trompeur favorise ici « mensonge », tandis que la note préserve les autres possibilités sans imposer une référence idolâtrique.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme entre la conduite extérieure (« les mains innocentes ») et la disposition intérieure (« le cœur pur »). L’étrangeté de « mon âme » est volontaire et expliquée en note afin de respecter la forme de la source fournie.
