  source_fidelity: 'Le texte massorétique porte « voici/telle est la génération de ceux qui le cherchent, [de] ceux qui recherchent ta face, Jacob. Sèla ». Il maintient une alternance réelle entre le suffixe de troisième personne (« le ») et « ta face ». En revanche, « ô Jacob » impose une fonction vocative qui est très difficile dans ce contexte : c’est Dieu qui est visé par « ta face », alors que Jacob désigne normalement le peuple. La fonction exacte de יַעֲקֹב demeure problématique et ne doit pas être résolue par une apostrophe dans le texte principal.'
  naturalness: « Telle est la génération » est compréhensible mais un peu calqué. « Voici la génération » est plus direct et idiomatique en français biblique moderne, sans perdre le sens collectif de דּוֹר. La mise en apposition après un tiret rend visible la difficulté finale sans introduire un sens non attesté.
  terminology: « Chercher/rechercher ta face » est une expression biblique française établie et appropriée. « Sèla » est une translittération recevable. « Jacob » doit être conservé sans l’expansion « Dieu de Jacob », laquelle relève de témoins anciens ou d’une émendation.
