  text: Such is the generation of those who seek him, who seek your face, O Jacob. Selah
translation:
  language: fr
  text: 'Voici la génération de ceux qui le cherchent,

    de ceux qui recherchent ta face — Jacob[a].


    Sèla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte simplement « Jacob ». Sa fonction dans la phrase est difficile : il peut désigner Jacob comme le peuple qui cherche Dieu, ou être compris autrement. Certaines versions anciennes lisent ou sous-entendent « le Dieu de Jacob ».'
    reason: Conserver « Jacob » du texte massorétique tout en signalant la difficulté syntaxique et les lectures anciennes, sans imposer une apostrophe ni ajouter « Dieu de » au texte principal.
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: Telle est la génération
  rationale: Conserve l’image collective de « génération » et rend naturellement en français l’identification introduite par זֶה.
- source_word: דֹּרְשָׁיו
  choice: de ceux qui le cherchent
  rationale: Le suffixe de troisième personne est maintenu (« le »), sans harmonisation avec la deuxième personne du membre parallèle.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: de ceux qui recherchent ta face
  rationale: Préserve l’expression hébraïque « chercher la face », ainsi que le passage à la deuxième personne.
- source_word: סֶלָה
  choice: Sèla
  rationale: Translittération du terme liturgique ou musical dont le sens précis demeure incertain, plutôt qu’une interprétation conjecturale.
theological_decisions:
- issue: Fonction de יַעֲקֹב (« Jacob »)
  choice: ô Jacob
  alternative: le Dieu de Jacob / ceux qui recherchent ta face, Jacob
  rationale: Le texte massorétique transmis porte simplement « Jacob » et permet une lecture vocative. L’ajout de « Dieu de » dépend de versions anciennes ou d’une correction textuelle et n’est donc pas introduit dans le texte principal; l’ambiguïté est signalée en note.
- issue: Alternance entre « le cherchent » et « ta face »
  choice: maintien de l’alternance de personne
  alternative: harmoniser en « te cherchent » ou « recherchent sa face »
  rationale: L’hébreu passe réellement de la troisième à la deuxième personne. Cette tension rhétorique et théologique ne doit pas être effacée.
translation_notes:
  register: Français moderne, sobre et liturgique. Le parallélisme poétique est conservé sur deux lignes. « Rechercher ta face » garde l’image biblique tout en restant intelligible; « Sèla » préserve l’indétermination du terme hébreu.
