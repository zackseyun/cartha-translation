  text: מִֽי יַעֲלֶ֥ה בְ/הַר יְהוָ֑ה וּ/מִי יָ֝קוּם בִּ/מְק֥וֹם קָדְשֽׁ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/003.yaml
  text: Who may ascend the mountain of Yahweh? And who may stand in his holy place?[a]
translation:
  language: fr
  text: Qui peut monter à la montagne[a] de Yahweh ? Et qui peut se tenir dans son lieu saint ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « colline ». Le mot hébreu הַר peut désigner une montagne ou une colline ; « montagne » est retenu ici comme rendu usuel dans ce psaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique sur la personne qualifiée ; « Qui » est l’équivalent français le plus naturel et le plus concis.
- source_word: יַעֲלֶה
  choice: peut monter
  rationale: L’imparfait qal de עלה signifie « monter ». Dans cette question liturgique, « peut » exprime l’aptitude ou l’autorisation d’approcher, plutôt qu’un simple futur.
- source_word: בְהַר
  choice: à la montagne de
  rationale: הַר peut désigner une montagne ou une colline. « Montagne » convient au cadre de Sion et conserve l’image élevée du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin du texte hébreu, plutôt que de lui substituer un titre.
- source_word: וּמִי
  choice: Et qui
  rationale: Cette formulation conserve la conjonction et le parallélisme poétique entre les deux questions.
- source_word: יָקוּם
  choice: peut se tenir
  rationale: Le qal de קום peut signifier « se lever » ou « se tenir debout ». Ici, « se tenir » évoque le fait de prendre place et de demeurer en présence de Dieu.
- source_word: בִּמְקוֹם
  choice: dans … lieu
  rationale: מָקוֹם signifie couramment « lieu ». Ce choix évite de préciser « sanctuaire » au-delà de ce qu’énonce directement l’hébreu.
- source_word: קָדְשׁוֹ
  choice: son lieu saint
  rationale: Le nom קֹדֶשׁ avec suffixe masculin singulier qualifie ici le lieu comme appartenant à Yahweh et consacré ; « son lieu saint » est idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre. « Yahweh » le préserve explicitement sans le remplacer par un titre.
- issue: Valeur des imparfaits dans les questions rhétoriques
  choice: peut monter / peut se tenir
  alternative: montera / se tiendra
  rationale: Le contexte interroge la qualité requise ou la possibilité légitime d’entrer dans la présence divine, et non seulement une action future. « Peut » maintient cette portée sans la surinterpréter.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux questions est conservé, ainsi que le langage spatial du texte hébreu.
