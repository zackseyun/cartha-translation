id: PSA.24.7
reference: Psalms 24:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: fr
  text: Portes, levez vos têtes ! Élevez-vous, portails anciens[a], afin que le roi de gloire entre !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portails éternels ». Le terme hébreu peut évoquer aussi bien une très haute antiquité qu’une durée perpétuelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: levez
  rationale: L’impératif conserve l’appel vif adressé aux portes personnifiées et reprend le sens courant de נשׂא dans ce contexte.
- source_word: שְׁעָרִים
  choice: portes
  rationale: « Portes » est l’équivalent français naturel pour les portes d’une ville ou d’un sanctuaire.
- source_word: רָאשֵׁיכֶם
  choice: vos têtes
  rationale: La formulation littérale préserve la personnification audacieuse du texte hébreu sans la réduire à une explication architecturale comme « linteaux ».
- source_word: וְהִנָּשְׂאוּ
  choice: élevez-vous
  rationale: Cette tournure française rend naturellement l’impératif niphal, qui peut avoir ici une nuance passive ou réfléchie, tout en maintenant le parallélisme poétique.
- source_word: פִּתְחֵי עוֹלָם
  choice: portails anciens
  rationale: « Portails » convient à des ouvertures monumentales parallèles aux « portes ». עוֹלָם peut évoquer soit une haute antiquité, soit une durée perpétuelle ; « anciens » retient le premier sens et l’autre est signalé en note.
- source_word: וְיָבֹא
  choice: afin que … entre
  rationale: Après les impératifs, le waw suivi de l’imparfait se comprend naturellement comme exprimant le but ou le résultat.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: le roi de gloire
  rationale: Le syntagme construit est conservé comme titre solennel, sans l’aplatir en « roi glorieux ».
theological_decisions:
- issue: Préserver la personnification et l’image de l’entrée royale sans en imposer l’interprétation
  choice: Maintenir l’adresse directe aux portes et aux portails, y compris l’expression « vos têtes »
  alternative: Paraphraser l’ensemble comme un simple ordre d’ouvrir les portes
  rationale: Le texte hébreu personnifie directement les portes. Garder cette image respecte sa force poétique et liturgique sans préciser de manière indue l’identité historique ou messianique du roi.
translation_notes:
  register: Français international moderne, poétique et solennel. L’inversion légère de l’adresse (« Portes, levez… ») reste naturelle, tandis que « vos têtes » conserve volontairement l’image saisissante de l’hébreu.
