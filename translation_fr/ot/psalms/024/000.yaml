id: PSA.24.0
reference: Psalms 24:0
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר לַֽ֭/יהוָה הָ/אָ֣רֶץ וּ/מְלוֹאָ֑/הּ תֵּ֝בֵ֗ל וְ/יֹ֣שְׁבֵי בָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: fr
  text: 'Psaume de David[a].


    À Yahweh appartiennent la terre et tout ce qu’elle contient[b],

    le monde et ceux qui l’habitent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « appartenant à David » ou « pour David ». L’expression hébraïque ne précise pas la nature exacte du lien avec David.'
    reason: source_ambiguity
  - marker: b
    text: 'Littéralement : « sa plénitude »; autre traduction : « tout ce qui la remplit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: de David
  rationale: La formule française traditionnelle et naturelle conserve la relation assez large exprimée par לְ, sans préciser dans le texte principal s’il s’agit de l’auteur, du destinataire ou d’une appartenance à un recueil.
- source_word: לַיהוָה
  choice: À Yahweh appartiennent
  rationale: La construction française rend le syntagme prépositionnel placé en tête, qui affirme l’appartenance, tout en conservant le nom divin personnel יהוה.
- source_word: מְלוֹאָהּ
  choice: tout ce qu’elle contient
  rationale: Cette expression idiomatique rend la totalité de ce qui remplit la terre sans employer le calque peu naturel « sa plénitude ».
- source_word: תֵּבֵל
  choice: le monde
  rationale: « Le monde » distingue ce terme de הָאָרֶץ tout en conservant le parallélisme poétique.
- source_word: יֹשְׁבֵי בָהּ
  choice: ceux qui l’habitent
  rationale: Rend directement le participe substantivé et son complément, dans un français inclusif et naturel.
theological_decisions:
- issue: Rendu du tétragramme יהוה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source emploie le nom divin personnel; sa translittération évite de le remplacer silencieusement par un titre et suit la couche de consultation fournie.
- issue: Portée de la formule לְדָוִד
  choice: de David, avec note d’ambiguïté
  alternative: composé par David
  rationale: La préposition לְ ne détermine pas à elle seule la nature exacte du rapport avec David; la traduction préserve cette ouverture au lieu d’affirmer explicitement l’auteur.
translation_notes:
  register: Français international moderne, sobre et poétique. L’inversion « À Yahweh appartiennent… » conserve l’accent initial de l’hébreu sur le possesseur tout en restant naturelle. Les deux lignes maintiennent le parallélisme entre « la terre » et « le monde ».
