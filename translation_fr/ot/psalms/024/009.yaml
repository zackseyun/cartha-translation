source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וּ֭/שְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָבֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/009.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: fr
  text: Levez vos têtes, portes ! Élevez-vous, portes antiques[a], pour que le roi de gloire entre !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portes éternelles » ou « portes de toujours ». Le terme hébreu peut évoquer aussi bien une très grande ancienneté qu’une durée sans fin.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: levez
  rationale: L’impératif pluriel conserve l’appel énergique adressé poétiquement aux portes et reprend l’image concrète du texte hébreu.
- source_word: שְׁעָרִים
  choice: portes
  rationale: Terme français courant et naturel pour les portes monumentales d’une ville ou d’un sanctuaire.
- source_word: רָאשֵׁיכֶם
  choice: vos têtes
  rationale: Rendu littéral qui préserve la personnification frappante des portes, sans la réduire à une paraphrase architecturale comme « ouvrez-vous toutes grandes ».
- source_word: וּשְׂאוּ
  choice: élevez-vous
  rationale: Cette formulation française rend naturellement le second impératif dans le parallélisme et maintient la personnification, tout en laissant entendre le mouvement d’élévation des portes.
- source_word: פִּתְחֵי עוֹלָם
  choice: portes antiques
  rationale: עוֹלָם peut ici évoquer une très longue durée, l’ancienneté ou la permanence. « Portes antiques » exprime naturellement leur âge vénérable sans imposer l’idée qu’elles seraient éternelles au sens absolu.
- source_word: וְיָבֹא
  choice: pour que … entre
  rationale: La tournure exprime clairement le but ou le résultat attendu des impératifs précédents et emploie le verbe naturel pour franchir des portes.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: le roi de gloire
  rationale: Le syntagme construit est rendu au plus près et conserve ce titre solennel ainsi que sa répétition dans le psaume.
theological_decisions:
- issue: Préservation de la personnification des portes, auxquelles le texte attribue des « têtes »
  choice: Conserver « Portes, levez vos têtes » dans le texte principal
  alternative: Paraphraser par « Portes, ouvrez-vous toutes grandes »
  rationale: L’hébreu nomme explicitement les « têtes » des portes. Garder cette image respecte la force poétique et liturgique du verset sans lui substituer une interprétation architecturale.
- issue: Sens de עוֹלָם dans פִּתְחֵי עוֹלָם
  choice: Employer « portes antiques » dans le texte principal
  alternative: « portes éternelles » ou « portes de toujours »
  rationale: Dans ce contexte poétique et architectural, le mot peut désigner une antiquité reculée ou une durée indéfinie. Le choix principal reste naturel en français moderne, tandis que l’autre sens plausible est signalé en note.
translation_notes:
  register: Français moderne, solennel et poétique. La répétition impérative, la personnification et le titre « roi de gloire » sont conservés. La ponctuation exclamative restitue l’intensité de l’appel sans recourir à un vocabulaire archaïsant.
