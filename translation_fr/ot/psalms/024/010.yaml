source:
  edition: WLC
  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: fr
  text: Qui est ce roi de gloire ? Yahweh des armées[a], c’est lui le roi de gloire. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Yahweh, le maître des armées ». Le titre hébreu peut désigner largement les armées célestes ou les puissances ordonnées.
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est probablement une indication musicale ou liturgique, mais son sens précis reste incertain.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Qui est-il, ce… ?
  rationale: La tournure disloquée rend naturellement en français la question hébraïque emphatique formée de l’interrogatif, du pronom et du démonstratif.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: roi de gloire
  rationale: Cette formulation conserve la construction nominale hébraïque et le sens de כָּבוֹד, « gloire, honneur, poids ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: le maître des armées
  rationale: Dans le titre divin, cette expression est naturelle en français moderne tout en gardant le pluriel et la vaste portée des armées célestes ou puissances ordonnées.
- source_word: הוּא
  choice: c’est lui
  rationale: La tournure française marque l’identification emphatique portée par le pronom explicite, sans ajouter l’idée d’exclusivité.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le terme est translittéré puisque sa fonction précise demeure incertaine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme, nom personnel de Dieu ; sa translittération préserve cette donnée du texte source.
- issue: Portée du titre יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  alternative: Yahweh des armées
  rationale: « Le maître des armées » exprime en français courant le rapport implicite du titre sans déterminer si les armées sont terrestres, célestes ou, plus largement, les puissances ordonnées.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La reprise « Qui est-il, ce… ? » conserve l’emphase de l’hébreu ; « c’est lui » répond avec la même force. Les deux appels de note figurent immédiatement après les termes concernés.
