  text: וְ/הוֹצִ֣יא כָ/א֣וֹר צִדְקֶ֑/ךָ וּ֝/מִשְׁפָּטֶ֗/ךָ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/006.yaml
  text: He will bring forth your righteousness like the light[b][a], and your justice like the noonday.
translation:
  language: fr
  text: Il fera paraître ta justice[a] comme la lumière, et ton bon droit[b] comme le plein midi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta justification » ou « ta droiture » pour « ta justice ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ta cause juste » pour « ton bon droit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Il fera paraître
  rationale: Le hiphil de יצא exprime ici l’action de faire sortir ou apparaître. « Faire paraître » rend naturellement en français l’idée d’une réalité rendue manifeste.
- source_word: כָאוֹר
  choice: comme la lumière
  rationale: Le préfixe כ marque la comparaison, et אוֹר signifie « lumière ». La formulation conserve l’image poétique d’une manifestation claire et visible.
- source_word: צִדְקֶךָ
  choice: ta justice
  rationale: צדק peut désigner la justice, la droiture ou, dans ce contexte, la reconnaissance publique du bon droit. « Ta justice » reste proche du lexème hébreu sans effacer la nuance possible de justification.
- source_word: וּמִשְׁפָּטֶךָ
  choice: et ton bon droit
  rationale: משפט peut signifier jugement, justice, droit ou cause judiciaire. Dans le parallélisme, « ton bon droit » exprime naturellement la légitimité de la cause de la personne rendue évidente.
- source_word: כַצָּהֳרָיִם
  choice: comme le plein midi
  rationale: צָהֳרַיִם désigne midi, moment où la lumière est à son comble. « Le plein midi » préserve la force et la dignité de l’image.
theological_decisions:
- issue: 'La portée de צִדְקֶךָ et מִשְׁפָּטֶךָ : qualité morale ou reconnaissance publique d’une cause juste'
  choice: Conserver « ta justice » dans le premier membre et rendre le second par « ton bon droit »
  alternative: « ton innocence » / « ta cause » ou « ta justification » / « ta justice »
  rationale: Le contexte évoque vraisemblablement la manifestation publique de la droiture du fidèle, mais le texte peut aussi viser sa justice au sens plus large. La traduction maintient cette tension au lieu de réduire les deux termes à une seule idée judiciaire.
translation_notes:
  register: Français international moderne, poétique et digne. « Faire paraître » et « plein midi » conservent l’imagerie lumineuse ; « bon droit » est courant et permet de distinguer les deux termes hébreux parallèles.
