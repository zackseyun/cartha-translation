    issue: « il fait grâce » pour חוֹנֵן
    rationale: En français moderne, l’expression est habituellement associée au pardon ou à la clémence judiciaire. Dans ce contexte, où le juste donne généreusement et prête, « il est généreux » rend plus naturellement la bienveillance active du participe hébreu.
  revised_text: Tout le jour, il est généreux et prête, et sa descendance est une bénédiction.[a]
