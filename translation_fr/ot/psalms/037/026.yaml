  text: כָּל הַ֭/יּוֹם חוֹנֵ֣ן וּ/מַלְוֶ֑ה וְ֝/זַרְע֗/וֹ לִ/בְרָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: fr
  text: Tout le jour, il est généreux et prête, et sa descendance est une bénédiction.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa descendance est bénie ». L’hébreu dit littéralement : « sa descendance [est] pour une bénédiction ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Tout au long du jour
  rationale: Cette tournure naturelle conserve la valeur temporelle de l’expression hébraïque et présente l’action comme continuelle ou habituelle.
- source_word: חוֹנֵן
  choice: il fait grâce
  rationale: Le participe de חנן exprime le fait d’accorder faveur ou grâce. « Fait grâce » préserve ce sens plus large sans le réduire à la seule générosité matérielle.
- source_word: וּמַלְוֶה
  choice: et prête
  rationale: La forme hiphil de לוה signifie ici « prêter », et non « emprunter »; le présent rend la valeur habituelle du participe.
- source_word: וְזַרְעוֹ
  choice: et sa descendance
  rationale: זֶרַע est un nom collectif pouvant désigner la postérité. « Descendance » est clair en français moderne et conserve cette portée collective.
- source_word: לִבְרָכָה
  choice: est une bénédiction
  rationale: Littéralement « pour une bénédiction », l’expression indique naturellement ici que la descendance constitue une bénédiction, tout en laissant signaler en note l’autre compréhension possible.
theological_decisions:
- issue: Sens de la proposition finale לִבְרָכָה
  choice: sa descendance est une bénédiction
  alternative: sa descendance est bénie
  rationale: 'La préposition ל avec בְּרָכָה exprime le plus directement une destination ou une caractérisation: « pour une bénédiction ». La traduction retenue suit cette formulation sans écarter l’interprétation traditionnelle possible, indiquée en note.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme participial hébreu est rendu par des présents à valeur habituelle; « fait grâce » conserve la portée lexicale et théologique de חנן.
