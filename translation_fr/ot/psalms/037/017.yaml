lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde l’affirmation dans son contexte, avec une valeur causale naturelle en français.
- source_word: זְרוֹעוֹת
  choice: les bras
  rationale: Conserve l’image concrète de l’hébreu; les bras représentent ici probablement la force ou la puissance.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Rend l’adjectif substantivé pluriel par une catégorie morale concise et courante.
- source_word: תִּשָּׁבַרְנָה
  choice: seront brisés
  rationale: Reproduit directement le nifal imparfait passif au féminin pluriel, accordé avec « bras ».
- source_word: וְ
  choice: mais
  rationale: Exprime la valeur adversative du lien entre le sort des méchants et le soutien accordé aux justes.
- source_word: סוֹמֵךְ
  choice: soutient
  rationale: Le participe décrit l’action continue par laquelle Yahweh maintient et affermit les justes.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: Rend naturellement l’adjectif substantivé pluriel dans le registre sapientiel et poétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel tout en évitant de le remplacer par un titre.
- issue: Sens figuré de « bras »
  choice: Conserver l’image concrète dans le texte et en préciser la portée probable en note
  alternative: Traduire directement par « force » ou « puissance »
  rationale: 'Cette solution préserve la métaphore poétique et sa tension: ce sont les bras qui sont brisés, avec une référence probable à la puissance des méchants.'
