source:
  edition: WLC
  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: fr
  text: Yahweh connaît les jours des intègres[a], et leur héritage sera pour toujours[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des irréprochables », « des droits » ou « des personnes au cœur entier ». Il est question ici d’intégrité, non nécessairement de perfection absolue.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur héritage sera pour toujours ». L’expression peut évoquer soit une possession durable, soit la permanence de leur héritage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel du texte hébreu plutôt que de le remplacer par un titre.
- source_word: יוֹדֵעַ
  choice: connaît
  rationale: Le participe exprime une connaissance continue et attentive. « Connaît » reste direct sans expliciter davantage la portée relationnelle suggérée par le contexte.
- source_word: יְמֵי
  choice: les jours de
  rationale: Cette formulation conserve l’image hébraïque, qui désigne ici les jours constituant le cours de la vie.
- source_word: תְמִימִם
  choice: les hommes intègres
  rationale: Le terme évoque l’intégrité et la droiture d’une vie entière, sans nécessairement affirmer une perfection morale absolue.
- source_word: נַחֲלָתָם
  choice: leur héritage
  rationale: « Héritage » conserve les dimensions concrète et liée à l’attribution d’un bien que porte נַחֲלָה.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle qui rend la durée indéfinie ou permanente indiquée par l’hébreu.
- source_word: תִּהְיֶה
  choice: subsistera
  rationale: Dans cette construction, « subsistera » rend naturellement l’idée que l’héritage sera durable, tout en signalant en note la formulation plus littérale.
theological_decisions:
- issue: Sens de תְמִימִם dans le contexte sapientiel
  choice: Des personnes caractérisées par l’intégrité
  alternative: Des personnes irréprochables ou sans défaut
  rationale: Le psaume oppose les justes aux méchants. « Intègres » exprime une vie droite et entière sans imposer l’idée d’une absence absolue de péché.
- issue: Portée de la connaissance de Yahweh
  choice: La rendre simplement par « connaît »
  alternative: « veille sur » ou « prend soin de »
  rationale: Le contexte peut suggérer une connaissance attentive et favorable, mais le verbe hébreu ne doit pas être développé en paraphrase théologique.
- issue: Permanence de l’héritage
  choice: « subsistera pour toujours »
  alternative: « sera pour toujours »
  rationale: La formulation française explicite idiomatiquement la permanence impliquée par la proposition hébraïque, tandis que la note préserve sa forme littérale et son ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. L’expression « les jours de » conserve l’image poétique hébraïque; « hommes intègres » est employé au sens générique pour désigner les personnes caractérisées par l’intégrité.
