id: PSA.37.25
reference: Psalms 37:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: fr
  text: J’ai été jeune, et j’ai vieilli ; pourtant, je n’ai pas vu le juste abandonné, ni sa descendance[b] demander du pain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chercher du pain ». Le verbe hébreu signifie littéralement « chercher » ou « demander » ; dans ce contexte, il peut évoquer le fait de mendier sa nourriture.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sa semence », c’est-à-dire sa descendance ou ses descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: J’ai été jeune
  rationale: La tournure prédicative signifie naturellement « j’ai été jeune » et introduit le contraste autobiographique entre jeunesse et vieillesse.
- source_word: גַּם זָקַנְתִּי
  choice: et j’ai vieilli
  rationale: גַּם relie ici les deux étapes de la vie. La formulation française rend avec simplicité le processus accompli exprimé par זָקַנְתִּי.
- source_word: וְלֹא רָאִיתִי
  choice: pourtant, je n’ai pas vu
  rationale: « Pourtant » exprime la légère valeur contrastive de la coordination, sans transformer l’observation personnelle du psalmiste en promesse absolue.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé masculin singulier a une portée représentative. « Le juste » est à la fois fidèle à la forme hébraïque et naturel dans le registre sapiential.
- source_word: נֶעֱזָב
  choice: abandonné
  rationale: Le participe niphal exprime l’état de celui qui a été délaissé. « Abandonné » est actuel et conserve la force existentielle du terme.
- source_word: וְזַרְעוֹ
  choice: ni sa descendance
  rationale: Sous la portée de la négation « je n’ai pas vu », la coordination se rend naturellement par « ni ». זֶרַע désigne ici la postérité ou les descendants.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: demander du pain
  rationale: בקש signifie fondamentalement « chercher » ou « demander ». Avec « pain » dans ce contexte de dénuement, « demander du pain » évoque le besoin de solliciter la nourriture sans exclure l’ambiguïté lexicale, signalée en note.
theological_decisions:
- issue: Observation personnelle ou garantie théologique absolue
  choice: 'Conserver la formulation à la première personne : « je n’ai pas vu »'
  alternative: Formuler une promesse générale selon laquelle aucun juste ne connaîtra jamais le dénuement
  rationale: L’hébreu présente explicitement le propos comme le témoignage d’une vie entière. La traduction n’étend pas cette observation au-delà de ce que dit le verset.
- issue: Portée générique du masculin singulier צַדִּיק et du suffixe de וְזַרְעוֹ
  choice: « le juste » et « sa descendance »
  alternative: « les justes » et « leurs enfants »
  rationale: Le singulier représentatif de l’hébreu est préservé. « Descendance » rend le nom collectif sans limiter le référent aux seuls enfants immédiats.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe simple adaptée à la poésie sapientiale. Le point-virgule marque le passage du bilan de vie à l’observation, et « ni » rend clairement la coordination sous la portée de la négation.
