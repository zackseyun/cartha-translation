id: PSA.37.29
reference: Psalms 37:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: fr
  text: Les justes hériteront du pays et y habiteront pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la terre ». Le mot hébreu אֶרֶץ peut désigner aussi bien un pays que la terre; ici, « le pays » correspond au langage répété du Psaume 37.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif masculin pluriel est employé comme substantif et désigne collectivement les personnes qui agissent avec justice. « Les justes » est naturel, actuel et conserve la portée morale et théologique du terme.
- source_word: יִירְשׁוּ
  choice: hériteront
  rationale: Le verbe ירשׁ peut exprimer l’idée d’hériter ou de prendre possession. « Hériteront » préserve ici la nuance de promesse et l’écho du langage d’alliance répété dans le psaume.
- source_word: אָרֶץ
  choice: du pays
  rationale: אֶרֶץ peut désigner un pays, une terre ou la terre entière. Dans le Psaume 37, la promesse répétée d’hériter du pays favorise le sens concret lié au territoire, sans exclure le sens plus large signalé en note.
- source_word: וְיִשְׁכְּנוּ
  choice: et y habiteront
  rationale: שׁכן évoque une habitation stable et durable. Le pronom adverbial « y » reprend naturellement « le pays » en français.
- source_word: לָעַד
  choice: pour toujours
  rationale: L’expression indique une durée permanente ou indéfiniment prolongée. « Pour toujours » en restitue clairement la force en français moderne.
- source_word: עָלֶיהָ
  choice: y
  rationale: La préposition על munie du suffixe féminin renvoie à אָרֶץ. En français, « y habiter » est plus idiomatique que « habiter sur lui » tout en conservant le rapport au pays.
theological_decisions:
- issue: Portée de אָרֶץ dans le contexte de la promesse
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat du Psaume 37 répète la promesse de recevoir le pays en héritage, ce qui favorise « le pays ». Toutefois, le mot hébreu peut aussi désigner « la terre » au sens plus large; cette possibilité est maintenue en note afin de ne pas trancher indûment la portée théologique de la promesse.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme bref du verset et emploie « y habiteront », tournure française naturelle qui reprend explicitement le lieu promis.
