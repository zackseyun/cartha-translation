id: PSA.37.24
reference: Psalms 37:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: fr
  text: Même s’il tombe[a], il ne sera pas jeté à terre, car Yahweh lui tient la main[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car s’il tombe » ou « Quand il tombe ». La conjonction hébraïque peut exprimer ici la cause, la condition ou la concession.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « soutient sa main ».'
    reason: source_form
lexical_decisions:
- source_word: כִּי
  choice: Même si
  rationale: 'Dans le contexte, la conjonction a naturellement une valeur concessive : la chute est possible, mais elle n’aboutit pas à l’anéantissement. La note conserve les autres analyses possibles.'
- source_word: יִפֹּל
  choice: il tombe
  rationale: Le verbe נפל signifie fondamentalement « tomber ». Cette formulation préserve la portée générale de l’image sans la limiter à une faute morale ni à un danger physique.
- source_word: יוּטָל
  choice: il ne sera pas terrassé
  rationale: Le hophal de טול exprime le fait d’être jeté ou abattu. « Être terrassé » distingue ce verbe de la simple chute mentionnée auparavant et rend naturellement l’idée d’un renversement subi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: סוֹמֵךְ יָדוֹ
  choice: lui tient la main
  rationale: Le participe סמך exprime un soutien continu, et יָדוֹ désigne explicitement « sa main ». La tournure française idiomatique représente Yahweh tenant et soutenant la main de l’homme.
theological_decisions:
- issue: Portée métaphorique de la chute
  choice: La formulation évoque largement les revers ou l’abattement que peut connaître le juste.
  alternative: Comprendre la chute exclusivement comme un péché, une apostasie ou un danger physique.
  rationale: L’hébreu ne précise pas la nature de la chute. La traduction en préserve donc l’étendue et la tension sans imposer une interprétation doctrinale particulière.
- issue: Résultat de la chute
  choice: « Il ne sera pas terrassé » indique qu’il ne sera pas définitivement abattu.
  alternative: Comprendre que le juste ne tombe jamais.
  rationale: Le premier verbe admet réellement la chute, tandis que le second nie qu’elle aboutisse à un renversement total, en raison du soutien de Yahweh.
translation_notes:
  register: Français international moderne, sobre et digne. « Terrassé » maintient le contraste entre les deux verbes hébreux, tandis que « lui tient la main » rend l’image de manière naturelle en français.
