  text: מֵ֭/יְהוָה מִֽצְעֲדֵי גֶ֥בֶר כּוֹנָ֗נוּ וְ/דַרְכּ֥/וֹ יֶחְפָּֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: fr
  text: Yahvé affermit les pas d’un homme, et il prend plaisir au chemin de cet homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension : « et cet homme prend plaisir à son chemin ». En hébreu, le sujet de « prend plaisir » n’est pas exprimé ; il peut désigner Yahvé ou l’homme.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: C’est de Yahvé que viennent
  rationale: La préposition מִן exprime ici la source ou l’origine. Cette tournure française conserve cette nuance tout en indiquant naturellement que l’affermissement vient de Yahvé.
- source_word: מִצְעֲדֵי
  choice: les pas
  rationale: Le nom désigne les pas ou la démarche et évoque, dans ce contexte sapientiel, le cours de la vie.
- source_word: גֶבֶר
  choice: d’un homme
  rationale: גֶבֶר désigne grammaticalement un homme; la traduction conserve cette forme masculine sans ajouter la nuance facultative de force.
- source_word: כּוֹנָנוּ
  choice: fermement établis
  rationale: Le passif de כון exprime l’idée d’être affermi, solidement établi. L’ajout de « fermement » rend la nuance du verbe plus clairement en français.
- source_word: וְדַרְכּוֹ
  choice: à sa voie
  rationale: דֶּרֶךְ signifie « voie » ou « chemin », au sens propre comme figuré. « Voie » garde ici le registre poétique et sapientiel.
- source_word: יֶחְפָּץ
  choice: il prend plaisir
  rationale: חפץ exprime le plaisir, l’agrément ou le désir. Le sujet masculin singulier reste implicite en hébreu; « il » préserve cette caractéristique.
theological_decisions:
- issue: Sujet de יֶחְפָּץ (« il prend plaisir »)
  choice: Dans la lecture principale, « il » renvoie à Yahvé, qui prend plaisir à la voie de l’homme.
  alternative: « Il » peut renvoyer à l’homme, qui prend plaisir à sa voie.
  rationale: Le sujet n’est pas exprimé en hébreu. Yahvé constitue l’antécédent le plus cohérent, mais le changement de sujet demeure grammaticalement possible; l’ambiguïté authentique est donc signalée en note.
translation_notes:
  register: Français moderne, digne et poétique. La construction détachée « C’est de Yahvé que viennent… » suit l’accent initial de l’hébreu sur la source divine, tandis que le pronom de la seconde proposition conserve l’ambiguïté du texte source.
