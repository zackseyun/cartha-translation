id: PSA.37.22
reference: Psalms 37:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י מְ֭בֹרָכָי/ו יִ֣ירְשׁוּ אָ֑רֶץ וּ֝/מְקֻלָּלָ֗י/ו יִכָּרֵֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/022.yaml
  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: fr
  text: Car ceux qui sont bénis par lui hériteront du pays[a], mais ceux qui sont maudits par lui seront retranchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Le mot hébreu peut désigner soit le pays, soit la terre ; ici, « le pays » convient le mieux au cadre de la promesse qui traverse le psaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: מְבֹרָכָיו
  choice: ceux qu’il bénit
  rationale: Rend naturellement en français le participe passif muni du suffixe de troisième personne, sans alourdir la phrase par « ceux qui sont bénis par lui ».
- source_word: יִירְשׁוּ
  choice: hériteront
  rationale: Conserve à la fois le sens de recevoir ou posséder et la résonance liée à la promesse du pays.
- source_word: אָרֶץ
  choice: du pays
  rationale: Dans le contexte récurrent du Psaume 37, « le pays » exprime au mieux le cadre sapientiel et celui de la promesse, tout en laissant « la terre » comme possibilité réelle en note.
- source_word: וּמְקֻלָּלָיו
  choice: mais ceux qu’il maudit
  rationale: « Mais » explicite le contraste entre les deux membres. La tournure active est naturelle en français et exprime la relation indiquée par le participe passif et son suffixe.
- source_word: יִכָּרֵתוּ
  choice: seront retranchés
  rationale: Préserve l’image hébraïque et sa portée judiciaire, plutôt que de la réduire à « seront détruits ».
theological_decisions:
- issue: Référent des suffixes masculins singuliers dans מְבֹרָכָיו et מְקֻלָּלָיו
  choice: Les rendre par « qu’il bénit » et « qu’il maudit », le pronom renvoyant au Seigneur dans le contexte.
  alternative: « ses bénis » et « ses maudits », formulation plus formelle mais peu naturelle et potentiellement ambiguë en français.
  rationale: Le contexte identifie le Seigneur comme référent. La formulation choisie clarifie la relation sans introduire une affirmation étrangère à l’hébreu.
- issue: Portée de אָרֶץ
  choice: le pays
  alternative: la terre
  rationale: « Le pays » maintient le cadre de la promesse récurrente dans le psaume, tandis que la note conserve la portée plus large possible de אָרֶץ.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme antithétique est conservé, ainsi que l’expression imagée « seront retranchés ».
