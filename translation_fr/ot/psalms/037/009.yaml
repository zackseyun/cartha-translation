  source_fidelity: « Car » rend convenablement la valeur explicative de כִּי. « Ceux qui font le mal » et « seront retranchés » reproduisent sans surinterprétation מְרֵעִים et le passif de כרת. « Ceux qui espèrent en Yahweh » exprime de façon idiomatique l’attente confiante portée par קוה; l’opposition introduite par « mais » est contextuellement justifiée. « Ce sont eux qui » rend bien l’emphase de הֵמָּה, et « hériteront du pays » conserve le lexique et la portée de la promesse, avec l’alternative légitime de « terre » maintenue en note.
