id: PSA.37.9
reference: Psalms 37:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי מְ֭רֵעִים יִכָּרֵת֑וּ/ן וְ/קֹוֵ֥י יְ֝הוָ֗ה הֵ֣מָּה יִֽירְשׁוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/009.yaml
  text: For evildoers will be cut off[a], but those who wait for Yahweh—they will inherit the land.
translation:
  language: fr
  text: Car ceux qui font le mal seront retranchés, mais ceux qui espèrent en Yahweh, ce sont eux qui hériteront du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la terre ». Le mot hébreu אֶרֶץ peut désigner aussi bien le pays que la terre; ici, « le pays » convient mieux au cadre des promesses de l’alliance dans ce psaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’exhortation précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: מְרֵעִים
  choice: ceux qui font le mal
  rationale: Rend clairement et naturellement le participe désignant les personnes qui pratiquent le mal, tout en maintenant le contraste moral du psaume.
- source_word: יִכָּרֵתוּן
  choice: seront retranchés
  rationale: Préserve l’image et la portée judiciaire du niphal de כרת sans préciser indûment s’il s’agit de destruction, d’exclusion ou de disparition.
- source_word: וְקֹוֵי
  choice: mais ceux qui espèrent en
  rationale: Le participe de קוה exprime une attente confiante. « Espèrent en » est idiomatique en français et le « mais » explicite le contraste porté par la coordination.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: הֵמָּה
  choice: ce sont eux qui
  rationale: Reproduit l’insistance du pronom indépendant hébreu dans une tournure française naturelle.
- source_word: יִירְשׁוּ
  choice: hériteront
  rationale: Conserve la résonance de promesse et d’alliance du verbe ירשׁ ainsi que le vocabulaire récurrent du psaume.
- source_word: אָרֶץ
  choice: du pays
  rationale: Dans le contexte du Psaume 37, « le pays » évoque naturellement la promesse territoriale de l’alliance, sans nier le sens possible de « terre » indiqué en note.
theological_decisions:
- issue: Portée de אָרֶץ dans la promesse
  choice: le pays
  alternative: la terre
  rationale: Le contexte immédiat et la répétition de cette promesse dans le psaume favorisent le cadre de l’héritage du pays. Toutefois, le terme hébreu peut aussi désigner la terre au sens plus large; cette ambiguïté réelle est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation « ce sont eux qui » conserve l’emphase hébraïque; « seront retranchés » maintient la métaphore traditionnelle sans en fixer excessivement la portée.
