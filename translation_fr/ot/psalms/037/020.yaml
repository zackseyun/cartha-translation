id: PSA.37.20
reference: Psalms 37:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: fr
  text: 'Car les méchants périront,

    et les ennemis de Yahweh seront comme la splendeur des pâturages[a] :

    ils disparaîtront ; comme la fumée, ils disparaîtront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation traditionnelle : « comme la graisse des agneaux ». L’expression hébraïque est difficile.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve la valeur causale du terme hébreu.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rendu courant et naturel dans les textes de sagesse pour désigner ceux qui agissent mal.
- source_word: יֹאבֵדוּ
  choice: périront
  rationale: Exprime la ruine et la disparition annoncées par le verbe אבד, tout en conservant la valeur future du contexte.
- source_word: וְאֹיְבֵי יְהוָה
  choice: et les ennemis de Yahweh
  rationale: Rend directement la construction hébraïque et maintient le nom divin.
- source_word: כִּיקַר כָּרִים
  choice: comme la splendeur des pâturages
  rationale: La phrase hébraïque est difficile. Ce rendu comprend יקר au sens de « splendeur » et כרים au sens de « pâturages »; il s’accorde avec l’image d’une beauté passagère qui disparaît.
- source_word: כָּלוּ … כָּלוּ
  choice: ils disparaîtront … ils disparaîtront
  rationale: La répétition est conservée afin de reproduire l’insistance poétique sur leur disparition totale.
- source_word: בֶעָשָׁן
  choice: comme la fumée
  rationale: Rend naturellement en français l’image de la fumée qui se dissipe, bien que la préposition puisse aussi être comprise « en fumée ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » préserve ici le nom propre plutôt que de lui substituer un titre.
- issue: Interprétation de כִּיקַר כָּרִים
  choice: comme la splendeur des pâturages
  alternative: comme la graisse des agneaux
  rationale: La formulation hébraïque est lexicalement difficile. Le texte principal suit la lecture « splendeur des pâturages », tandis que l’interprétation traditionnelle est signalée en note afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la répétition du dernier verbe sont maintenus; la ponctuation met en relief l’image finale sans alourdir le vers.
