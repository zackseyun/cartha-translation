  text: חֶ֤רֶב פָּֽתְח֣וּ רְשָׁעִים֮ וְ/דָרְכ֪וּ קַ֫שְׁתָּ֥/ם לְ֭/הַפִּיל עָנִ֣י וְ/אֶבְי֑וֹן לִ֝/טְב֗וֹחַ יִשְׁרֵי דָֽרֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: fr
  text: Les méchants ont tiré l’épée et tendu leur arc pour faire tomber le pauvre et le démuni, pour massacrer ceux dont la conduite est droite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: ont tiré l’épée
  rationale: Littéralement « ont ouvert l’épée » ; avec חֶרֶב, le verbe décrit idiomatiquement le fait de dégainer. « Tirer l’épée » est naturel en français et conserve l’image guerrière.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rend le substantif pluriel désignant ceux qui agissent injustement, sans préciser leur genre.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: et tendu leur arc
  rationale: דרך, avec « arc », désigne sa mise en tension en vue de tirer. Le singulier collectif de l’hébreu est conservé.
- source_word: לְהַפִּיל
  choice: pour abattre
  rationale: Le hifil de נפל signifie « faire tomber ». Dans ce contexte violent, « abattre » exprime naturellement l’action projetée sans l’édulcorer.
- source_word: עָנִי וְאֶבְיוֹן
  choice: le pauvre et le démuni
  rationale: Le binôme désigne des personnes économiquement faibles et vulnérables. « Démuni » distingue אֶבְיוֹן de עָנִי tout en gardant le parallélisme.
- source_word: לִטְבּוֹחַ
  choice: pour égorger
  rationale: Le verbe désigne une mise à mort brutale, souvent un abattage. « Égorger » garde sa force concrète et convient à l’image de l’épée.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: ceux qui suivent le droit chemin
  rationale: Littéralement « les droits de chemin ». Cette formulation française naturelle exprime la rectitude morale manifestée dans la conduite, sans réduire דֶּרֶךְ à une simple opinion intérieure.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le verset conserve les deux propositions finales parallèles et la progression de la menace armée vers la mise à mort.
