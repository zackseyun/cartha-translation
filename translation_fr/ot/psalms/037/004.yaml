id: PSA.37.4
reference: Psalms 37:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הִתְעַנַּ֥ג עַל יְהוָ֑ה וְ/יִֽתֶּן לְ֝/ךָ֗ מִשְׁאֲלֹ֥ת לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/004.yaml
  text: Delight yourself in Yahweh[a], and he will give you the desires of your heart.
translation:
  language: fr
  text: Trouve ta joie en Yahweh, et il te donnera les désirs de ton cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les demandes de ton cœur ». Le nom hébreu peut désigner ce que l’on demande aussi bien que ce que l’on désire intérieurement.'
    reason: alternative lexicale
lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Trouve ta joie
  rationale: L’impératif hitpael invite la personne à prendre elle-même plaisir en Yahweh. « Trouve ta joie » restitue cette orientation personnelle dans un français naturel et digne.
- source_word: עַל
  choice: en
  rationale: Avec l’idée de joie ou de plaisir, la préposition hébraïque עַל se rend ici naturellement par « en » en français et exprime la relation à Yahweh plutôt qu’une position spatiale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » conserve ce nom personnel au lieu de lui substituer un titre.
- source_word: יִתֶּן
  choice: il te donnera
  rationale: Dans cette exhortation sapientielle, l’imparfait qal coordonné exprime naturellement la conséquence ou la promesse qui suit l’impératif.
- source_word: מִשְׁאֲלֹת
  choice: les désirs
  rationale: Le nom peut désigner aussi bien ce qui est désiré que ce qui est demandé. Associé au cœur, « les désirs » rend clairement les aspirations intérieures sans exclure entièrement la nuance de requête.
- source_word: לִבֶּךָ
  choice: de ton cœur
  rationale: « Cœur » conserve l’image hébraïque et désigne ici le siège intérieur des désirs et de la volonté.
theological_decisions:
- issue: Risque de lire la promesse comme une garantie de prospérité sans condition morale
  choice: Conserver la promesse telle qu’elle est formulée, sans ajouter de restriction dans le texte.
  alternative: Préciser « les désirs conformes à sa volonté » ou expliquer que Dieu transforme d’abord les désirs.
  rationale: Le verset relie directement la joie trouvée en Yahweh au don des désirs du cœur. Ajouter une qualification explicite résoudrait une tension que l’hébreu laisse intacte.
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme יהוה ; le nom propre est donc conservé.
translation_notes:
  register: Français international moderne, poétique sans archaïsme. « Trouve ta joie » est immédiatement compréhensible et évite le tour plus ancien « fais tes délices ». La structure brève et coordonnée du vers hébreu est conservée.
