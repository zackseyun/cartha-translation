  text: Yet a little while[a], and the wicked will be no more; though you look carefully at his place, he will not be there.
translation:
  language: fr
  text: Encore un peu de temps, et le méchant[a] ne sera plus ; tu examineras attentivement son lieu, et il n’y sera plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le singulier hébreu peut désigner un individu représentatif ou les méchants de manière collective ou générique.
    reason: Rend compte de la valeur possible du singulier substantivé רָשָׁע, conformément à la note de l’audit anglais.
lexical_decisions:
- source_word: וְעוֹד מְעַט
  choice: Encore un peu de temps
  rationale: L’expression est temporelle et annonce un délai bref. Cette formulation reste proche de l’hébreu tout en étant naturelle en français.
- source_word: וְאֵין רָשָׁע
  choice: et le méchant ne sera plus
  rationale: Dans ce contexte orienté vers l’avenir, la négation existentielle exprime la disparition prochaine du méchant. Le singulier français conserve la figure représentative de l’hébreu.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: tu observeras attentivement
  rationale: Le verbe exprime un examen attentif. Le futur maintient la coordination verbale de l’hébreu sans imposer une valeur concessive qui n’est pas explicitement marquée.
- source_word: עַל מְקוֹמוֹ
  choice: l’endroit où il était
  rationale: La formulation rend concrètement le lieu associé au méchant et prépare naturellement le constat de son absence.
- source_word: וְאֵינֶנּוּ
  choice: mais il aura disparu
  rationale: La négation existentielle signifie qu’il ne se trouvera plus à cet endroit. « Mais » explicite le contraste contextuel, tandis que « aura disparu » évite une répétition lourde.
