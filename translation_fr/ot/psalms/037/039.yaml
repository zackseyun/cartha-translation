source:
  edition: WLC
  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: fr
  text: Le salut[a] des justes vient de Yahweh[b] ; il est leur forteresse[c] au temps de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrance » ; le terme hébreu peut désigner le secours ou la victoire aussi bien que le salut.
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ».'
    reason: alternative_reading
  - marker: c
    text: Ou « refuge » ou « place forte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: Le salut
  rationale: תְּשׁוּעָה désigne le salut ou la délivrance, et peut aussi évoquer la victoire. « Salut » convient au registre du psaume tout en gardant ici le sens concret de secours.
- source_word: צַדִּיקִים
  choice: des justes
  rationale: L’adjectif pluriel est employé comme substantif. « Les justes » est naturel en français et désigne ceux qui se caractérisent par la justice.
- source_word: מֵיְהוָה
  choice: vient de Yahweh
  rationale: La préposition מִן indique la source. L’ajout de « vient », nécessaire à une formulation française naturelle, explicite la copule sous-entendue sans modifier le sens.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin exprimé par le tétragramme et préserve sa fonction de nom propre.
- source_word: מָעוּזָּם
  choice: leur forteresse
  rationale: מָעוֹז évoque un lieu ou une source de force et de protection. « Forteresse » conserve l’image défensive, tandis que « leur » rend le suffixe de troisième personne du pluriel.
- source_word: בְּעֵת צָרָה
  choice: au temps de la détresse
  rationale: Cette expression rend clairement la valeur temporelle de בְּעֵת et le danger oppressant exprimé par צָרָה, dans un français actuel et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Rapport syntaxique de מָעוּזָּם avec Yahweh
  choice: il est leur forteresse
  alternative: leur forteresse au temps de la détresse
  rationale: L’hébreu juxtapose une proposition nominale qui peut se lire comme une apposition ou comme l’affirmation implicite que Yahweh est leur forteresse. Le français explicite la copule par « il est » tout en conservant ce lien naturel.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme sobre du verset, explicite seulement les copules nécessaires en français et maintient l’image concrète de la protection divine.
