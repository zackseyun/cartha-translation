source:
  edition: WLC
  text: וַ֭/יַּֽעֲבֹר וְ/הִנֵּ֣ה אֵינֶ֑/נּוּ וָֽ֝/אֲבַקְשֵׁ֗/הוּ וְ/לֹ֣א נִמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/036.yaml
  text: But he passed by[a], and behold, he was no more; I sought him, but he could not be found.
translation:
  language: fr
  text: Il passa[a], et voici qu’il n’était plus ; je le cherchai, mais il fut introuvable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il disparut. » Le verbe hébreu signifie littéralement « passer » et peut ici décrire le fait de disparaître.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Il passa
  rationale: Le verbe עבר signifie fondamentalement « passer » ou « passer à côté », mais peut ici évoquer la disparition du méchant. La formulation française conserve cette concision et cette ambiguïté sans affirmer explicitement sa mort.
- source_word: וְהִנֵּה
  choice: et voici que
  rationale: La particule הִנֵּה attire brusquement l’attention sur un constat surprenant. « Voici que » en garde la force rhétorique dans un registre poétique digne.
- source_word: אֵינֶנּוּ
  choice: il n’était plus
  rationale: Cette expression indique que la personne n’est plus présente. Le français conserve la gravité et la brièveté de l’hébreu sans préciser s’il s’agit de mort ou simplement de disparition.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: je l’ai cherché
  rationale: בקשׁ désigne ici l’action de chercher quelqu’un. Cette traduction est directe, naturelle et fidèle.
- source_word: וְלֹא נִמְצָא
  choice: mais il fut introuvable
  rationale: Le nifal de מצא exprime le fait de ne pas être trouvé. « Il fut introuvable » rend naturellement le résultat de la recherche tout en maintenant le contraste.
theological_decisions:
- issue: Nature de la disparition du méchant
  choice: Ne pas préciser s’il est mort ou s’il a disparu de la vue
  alternative: Traduire וַיַּעֲבֹר par « il mourut » ou « il disparut »
  rationale: Le texte hébreu décrit un passage suivi d’une absence sans nommer explicitement la mort. La traduction préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international, actuel et poétique. Le passé simple soutient la concision solennelle du psaume ; « voici que » conserve son effet de surprise. Le point-virgule reflète les deux mouvements parallèles du verset.
