source:
  edition: WLC
  text: זֹמֵ֣ם רָ֭שָׁע לַ/צַּדִּ֑יק וְ/חֹרֵ֖ק עָלָ֣י/ו שִׁנָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/012.yaml
  text: The wicked plots against the righteous and gnashes his teeth at him[a][b].
translation:
  language: fr
  text: Le méchant complote contre le juste[a] et grince des dents contre lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trame des projets contre le juste » ou « médite le mal contre le juste ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « grincer des dents » manifeste ici la colère et l’hostilité.
    reason: cultural_note
lexical_decisions:
- source_word: זֹמֵם
  choice: complote
  rationale: Le participe exprime l’action de préparer un projet hostile. « Complote » est naturel, concis et conserve cette intention malveillante.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé désigne ici une personne méchante. Le singulier français correspond aux formes singulières de l’hébreu et au parallélisme du verset.
- source_word: לַצַּדִּיק
  choice: contre le juste
  rationale: La préposition marque ici la cible de l’hostilité. « Le juste » rend naturellement le substantif צַדִּיק dans le registre sapientiel et poétique.
- source_word: חֹרֵק
  choice: grince
  rationale: Le verbe décrit le grincement des dents comme manifestation de colère et d’hostilité. « Grincer des dents » est l’expression idiomatique courante en français.
- source_word: עָלָיו
  choice: contre lui
  rationale: La préposition oriente le geste hostile vers le juste. « Contre lui » conserve cette direction sans atténuer l’hostilité.
- source_word: שִׁנָּיו
  choice: des dents
  rationale: Dans l’expression française « grincer des dents », l’article défini rend naturellement la partie du corps possédée, là où l’hébreu emploie le suffixe possessif « ses ».
theological_decisions: []
