id: PSA.37.13
reference: Psalms 37:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲדֹנָ֥/י יִשְׂחַק ל֑/וֹ כִּֽי רָ֝אָ֗ה כִּֽי יָבֹ֥א יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/013.yaml
  text: The Lord laughs at him[b][a], for he sees that his day is coming.
translation:
  language: fr
  text: Le Seigneur se rit de lui[a], car il voit que son jour arrive[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se moque de lui »; le verbe hébreu signifie littéralement « rire » et prend ici, dans le contexte, une nuance de dérision.
    reason: lexical_alternative
  - marker: b
    text: « Son jour » désigne le jour où l'homme mauvais connaîtra la chute ou le jugement.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Rend naturellement le titre divin et exprime la souveraineté de Dieu dans un français biblique actuel et digne.
- source_word: יִשְׂחַק
  choice: se rit
  rationale: Préserve le sens premier de « rire » tout en laissant paraître, dans ce contexte, la nuance de dérision. Cette tournure soutenue reste intelligible et convient au registre poétique.
- source_word: לוֹ
  choice: de lui
  rationale: Avec « se rire », la préposition française « de » désigne idiomatiquement l'homme mauvais comme objet du rire dédaigneux.
- source_word: כִּי
  choice: car
  rationale: Le premier כִּי introduit la raison du rire du Seigneur.
- source_word: רָאָה
  choice: il voit
  rationale: Bien que la forme hébraïque soit un parfait, le présent exprime ici naturellement la perception divine d'une issue imminente, sans remplacer « voir » par l'interprétation « savoir ».
- source_word: כִּי
  choice: que
  rationale: Le second כִּי introduit le contenu de ce que le Seigneur voit.
- source_word: יָבֹא
  choice: arrive
  rationale: Le présent français exprime avec vivacité l'événement futur qui approche, conformément à l'imparfait hébreu.
- source_word: יוֹמוֹ
  choice: son jour
  rationale: Reproduit l'expression hébraïque concise et poétique sans expliciter dans le corps du texte la nature exacte de ce jour.
theological_decisions:
- issue: Nature du rire divin
  choice: Le texte conserve l'image du Seigneur qui rit de l'homme mauvais, avec une nuance contextuelle de dérision face à son jugement imminent.
  alternative: « Le Seigneur se moque de lui » expliciterait directement la dérision.
  rationale: Le verbe hébreu signifie d'abord « rire ». Garder cette image préserve la formulation et la tension du texte sans suggérer que le rire divin serait frivole ou cruel.
- issue: Sens de « son jour »
  choice: L'expression demeure dans le texte principal et une note indique qu'elle désigne le jour de la chute ou du jugement de l'homme mauvais.
  alternative: Traduire directement « le jour de sa chute » ou « le jour fixé pour lui ».
  rationale: L'hébreu dit littéralement « son jour »; l'explicitation en note préserve à la fois la concision poétique et le sens contextuel.
translation_notes:
  register: Français moderne, international et digne, avec une légère élévation poétique. « Se rit de lui » évite la tournure plus familière « rit de lui » et préserve le verbe hébreu, tandis que les notes explicitent la dérision et la portée de « son jour ».
