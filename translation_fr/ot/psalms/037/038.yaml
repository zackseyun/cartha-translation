  naturalness: « Mais les rebelles sont détruits ensemble » est idiomatique en français moderne, garde le parallélisme concis du psaume et exprime plus directement le sort commun des rebelles. « L’avenir des méchants est retranché » demeure une formulation biblique claire et recevable.
