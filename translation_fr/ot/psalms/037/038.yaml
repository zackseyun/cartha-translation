source:
  edition: WLC
  text: וּֽ֭/פֹשְׁעִים נִשְׁמְד֣וּ יַחְדָּ֑ו אַחֲרִ֖ית רְשָׁעִ֣ים נִכְרָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/038.yaml
  text: But transgressors are destroyed together[a]; the future of the wicked is cut off.
translation:
  language: fr
  text: Mais les rebelles sont détruits ensemble ; l’avenir des méchants est retranché.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la fin des méchants est retranchée ». Le mot hébreu peut signifier « avenir », « issue » ou « fin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: Mais les rebelles
  rationale: פֹשְׁעִים désigne ceux qui se révoltent ou transgressent. « Rebelles » est naturel en français et conserve l’idée de rébellion morale ; le waw est rendu par « Mais » pour marquer le contraste avec le sort de l’homme intègre au verset précédent.
- source_word: נִשְׁמְדוּ
  choice: sont détruits
  rationale: Le nifal de שׁמד exprime la destruction ou l’extermination. « Sont détruits » en garde la force sans introduire une affirmation métaphysique supplémentaire.
- source_word: יַחְדָּו
  choice: tous
  rationale: L’adverbe peut signifier « ensemble » ou « tous sans exception ». Dans cette tournure, « tous » exprime naturellement en français leur sort commun.
- source_word: אַחֲרִית
  choice: l’avenir
  rationale: אַחֲרִית peut désigner l’avenir, l’issue ou la fin. Ici, « l’avenir » s’accorde avec le contraste entre les destinées, tout en laissant « la fin » en note comme autre lecture défendable.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: « Méchants » est le terme français courant dans le registre sapiential pour la catégorie morale exprimée par רְשָׁעִים.
- source_word: נִכְרָתָה
  choice: est retranché
  rationale: Le nifal de כרת signifie « être coupé/retranché ». « Est retranché » conserve l’image judiciaire forte et l’usage biblique de l’expression.
theological_decisions:
- issue: Sens de אַחֲרִית dans ce contexte de jugement
  choice: l’avenir des méchants est retranché
  alternative: la fin des méchants est retranchée ; la postérité des méchants est retranchée
  rationale: Le nom hébreu peut désigner l’avenir, l’issue, la fin ou, dans certains contextes, la postérité. Le contexte oppose les destinées respectives ; « avenir » communique cette perspective sans limiter le sens aux descendants. La lecture « fin » est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme poétique est conservé ; « rebelles », « détruits » et « retranché » maintiennent la gravité judiciaire du texte sans surcharge confessionnelle.
