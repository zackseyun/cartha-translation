  text: גּ֣וֹל עַל יְהוָ֣ה דַּרְכֶּ֑/ךָ וּ/בְטַ֥ח עָ֝לָ֗י/ו וְ/ה֣וּא יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: fr
  text: Confie ta voie à Yahweh[a], mets ta confiance en lui, et il agira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Fais rouler ta voie sur Yahweh. » Cette expression signifie confier ou remettre à Yahweh son parcours et ses préoccupations.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il le fera » ou « il mènera cela à bien ». L’hébreu dit simplement « il fera / agira », sans exprimer de complément d’objet.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Remets
  rationale: L’impératif signifie littéralement « roule », mais, dans cette construction avec « sur Yahweh » et « ta voie », il exprime l’idée de confier ou remettre son parcours à Dieu. « Remets » est naturel en français et conserve la force de l’exhortation.
- source_word: עַל
  choice: à
  rationale: La préposition signifie littéralement « sur ». Avec le verbe français « remettre », « à » rend naturellement la relation de transfert, tandis que la métaphore hébraïque est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel, plutôt que remplacé par un titre.
- source_word: דַּרְכֶּךָ
  choice: ta voie
  rationale: « Voie » traduit directement le terme et peut désigner, comme dans la littérature de sagesse, le parcours ou la conduite d’une personne.
- source_word: וּבְטַח
  choice: mets ta confiance
  rationale: Cette formulation idiomatique française exprime clairement l’impératif de se fier à quelqu’un, tout en gardant son caractère personnel.
- source_word: עָלָיו
  choice: en lui
  rationale: Bien que la préposition soit littéralement « sur lui », le français courant dit « mettre sa confiance en lui ».
- source_word: וְהוּא
  choice: et lui, il
  rationale: La dislocation française « lui, il » restitue l’insistance portée par le pronom sujet hébreu explicite.
- source_word: יַעֲשֶׂה
  choice: agira
  rationale: Le verbe peut signifier « faire » ou « agir ». Comme aucun complément d’objet n’est exprimé, « agira » préserve cette ouverture sans ajouter « cela ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom personnel au lieu de lui substituer un titre.
- issue: Objet implicite de יַעֲשֶׂה
  choice: 'laisser le verbe sans objet : « il agira »'
  alternative: « il le fera » ; « il mènera cela à bien »
  rationale: L’hébreu n’énonce aucun objet. Le laisser ouvert évite de préciser la promesse au-delà du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Remets ta voie » conserve le vocabulaire sapientiel sans être obscur. « Et lui, il agira » souligne naturellement le sujet en français et maintient l’indétermination du dernier verbe.
