source:
  edition: WLC
  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: fr
  text: Détourne-toi du mal et fais le bien, et demeure pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, à la lumière du thème récurrent du psaume : « et demeure pour toujours dans le pays » ou « et vis pour toujours en sécurité ». Ici, l’hébreu ne précise pas explicitement « dans le pays ».'
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: Détourne-toi
  rationale: L’impératif exprime le fait de se détourner ou de s’éloigner. « Détourne-toi » est naturel en français et conserve la portée morale et volontaire du verbe.
- source_word: מֵרָע
  choice: du mal
  rationale: La préposition מִן indique ce dont il faut se détourner. Dans ce contexte éthique, « du mal » est la formulation la plus directe.
- source_word: וַעֲשֵׂה טוֹב
  choice: et fais le bien
  rationale: Cette formulation concise rend l’impératif et l’adjectif substantivé, tout en préservant le parallélisme avec « détourne-toi du mal ».
- source_word: וּשְׁכֹן
  choice: et demeure
  rationale: Le verbe signifie habiter, s’établir ou demeurer. « Demeure » garde l’idée de stabilité résidentielle sans ajouter un lieu que l’hébreu ne précise pas.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression désigne une durée indéfinie ou perpétuelle. « Pour toujours » est une formulation actuelle et laisse intacte la concision de l’hébreu.
theological_decisions:
- issue: Sens de l’exhortation ou de la promesse dans וּשְׁכֹן לְעוֹלָם
  choice: Traduire directement par « et demeure pour toujours », sans expliciter de complément de lieu.
  alternative: « et demeure pour toujours dans le pays » ou « et vis pour toujours en sécurité »
  rationale: L’hébreu enchaîne des formes impératives et ne mentionne explicitement ni « le pays » ni la sécurité. Le thème récurrent du psaume permet toutefois ces lectures contextuelles; elles sont donc signalées en note plutôt qu’intégrées au texte.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme impératif est conservé, ainsi que l’ambiguïté de la dernière proposition.
