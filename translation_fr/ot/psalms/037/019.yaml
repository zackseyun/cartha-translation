source:
  edition: WLC
  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: fr
  text: Ils ne seront pas couverts de honte au temps du malheur[a] ; aux jours de famine, ils seront rassasiés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au temps de l’adversité » ou « au temps de la calamité ». Ici, le « malheur » désigne une situation pénible, et non le mal moral.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils seront comblés » ou « ils auront leur content ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: ne seront pas couverts de honte
  rationale: Le verbe בושׁ peut exprimer la honte éprouvée ou le déshonneur résultant d'une attente déçue. Cette formulation française conserve ici la nuance résultative sans réduire le sens à un sentiment intérieur.
- source_word: בְּעֵת רָעָה
  choice: au temps du malheur
  rationale: Dans ce contexte, רָעָה désigne l'adversité ou la détresse, et non le mal moral. « Au temps du malheur » est naturel, digne et suffisamment large.
- source_word: וּבִימֵי רְעָבוֹן
  choice: aux jours de famine
  rationale: La construction hébraïque désigne des périodes marquées par une grave pénurie de nourriture. La formulation conserve l'image temporelle du texte.
- source_word: יִשְׂבָּעוּ
  choice: ils mangeront à leur faim
  rationale: Le verbe שׂבע signifie être rassasié ou avoir suffisamment. Dans le contexte explicite de la famine, cette expression française concrète et idiomatique communique qu'ils auront de quoi se nourrir, sans préciser le moyen de cette provision.
