  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: fr
  text: La loi de son Dieu est dans son cœur[a] ; ses pas ne chancellent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’enseignement de son Dieu est dans son cœur ; ses pas ne trébuchent pas. »'
    reason: Alternative lexicale reflétant les sens possibles de תּוֹרָה et de מעד.
lexical_decisions:
- source_word: תּוֹרַת
  choice: la loi de
  rationale: תּוֹרָה peut désigner la loi, l’instruction ou l’enseignement. Dans ce psaume de sagesse, « loi » conserve le caractère normatif de l’instruction donnée par Dieu, tandis que la note signale l’autre nuance principale.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: 'Le suffixe masculin singulier exprime une relation possessive personnelle : « son Dieu ».'
- source_word: בְּלִבּוֹ
  choice: est dans son cœur
  rationale: Cette expression indique que la loi divine est intériorisée. En hébreu, le cœur englobe notamment la pensée, la volonté et les dispositions profondes.
- source_word: לֹא תִמְעַד
  choice: ne chancellent pas
  rationale: מעד évoque le fait de chanceler, de glisser ou de trébucher. « Chanceler » s’accorde naturellement avec l’image des pas et exprime la stabilité du juste sans rendre la formule trop littérale.
- source_word: אֲשֻׁרָיו
  choice: ses pas
  rationale: Le nom désigne les pas ou la démarche. « Ses pas » est concis et conserve la métaphore du chemin suivi dans la vie.
theological_decisions:
- issue: Sens de תּוֹרָה dans un contexte de sagesse
  choice: « loi » dans le texte principal
  alternative: « enseignement » ou « instruction »
  rationale: « Loi » maintient la force normative et l’arrière-plan de l’alliance, sans exclure le sens plus large d’enseignement divin, explicitement signalé en note.
- issue: Portée de לֹא תִמְעַד
  choice: 'présent de vérité générale : « ne chancellent pas »'
  alternative: 'futur : « ne chancelleront pas »'
  rationale: Le contexte décrit de manière générale la stabilité du juste. Le présent français convient à cette valeur, sans transformer la déclaration en garantie absolue étrangère au registre sapiential.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme et la métaphore de la marche, tout en restant immédiatement compréhensible.
