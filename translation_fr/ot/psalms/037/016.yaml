  text: טוֹב מְ֭עַט לַ/צַּדִּ֑יק מֵ֝/הֲמ֗וֹן רְשָׁעִ֥ים רַבִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/016.yaml
  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
translation:
  language: fr
  text: Mieux vaut le peu du juste que l’abondance de nombreux méchants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: Dans cette comparaison proverbiale, טוֹב a le sens idiomatique de « mieux vaut » plutôt que simplement « est bon ».
- source_word: מְעַט
  choice: le peu
  rationale: Le terme désigne une petite quantité; « le peu » forme en français une opposition naturelle avec « l’abondance ».
- source_word: לַצַּדִּיק
  choice: du juste
  rationale: Le ל peut exprimer ici la possession dans une formulation elliptique. « Le peu du juste » reste concis et conserve le singulier collectif du texte hébreu.
- source_word: מֵהֲמוֹן
  choice: que l’abondance de
  rationale: הָמוֹן peut désigner une abondance, une grande quantité ou une masse. « Abondance » préserve cette largeur sémantique sans réduire nécessairement le propos aux seules richesses matérielles.
- source_word: רְשָׁעִים
  choice: méchants
  rationale: L’adjectif substantivé pluriel désigne des personnes méchantes; cette formulation est courante et digne en français biblique moderne.
- source_word: רַבִּים
  choice: nombreux
  rationale: L’adjectif pluriel se rapporte le plus naturellement à « méchants » et maintient la possibilité syntaxique que le texte parle de nombreux méchants.
theological_decisions:
- issue: Rapport syntaxique de רַבִּים et portée de הָמוֹן
  choice: « l’abondance de nombreux méchants »
  alternative: « la grande abondance des méchants » ou « les richesses des méchants »
  rationale: La formulation principale rattache רַבִּים aux méchants, conformément à l’accord pluriel, tout en conservant le sens large de הָמוֹן. Une note signale l’ellipse et l’autre analyse possible sans réduire le terme aux seuls biens matériels.
translation_notes:
  register: Français international moderne, concis et proverbial. « Mieux vaut » donne une tournure naturelle et mémorable; « juste » et « méchants » conservent le registre moral du psaume sans ajout confessionnel.
