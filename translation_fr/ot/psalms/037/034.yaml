source:
  edition: WLC
  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: fr
  text: Mets ton espérance en Yahweh[a] et suis sa voie. Il t’élèvera pour que tu hérites du pays[b][c] ; quand les méchants seront retranchés, tu le verras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Attends Yahweh » ou « Espère patiemment en Yahweh ». Le verbe hébreu exprime une attente confiante et patiente.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la terre ». Le mot hébreu אָרֶץ peut désigner le pays ou la terre ; « pays » est retenu ici parce que le Psaume 37 emploie à plusieurs reprises le langage de l’héritage lié à l’alliance.'
    reason: alternative_reading
  - marker: c
    text: Voir Matthieu 5.5, où réapparaît la promesse de recevoir la terre — ou le pays — en héritage.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: Mets ton espérance en
  rationale: L’impératif de קוה exprime une attente patiente et confiante dirigée vers Yahweh. « Mets ton espérance en » est naturel en français moderne et conserve la dimension de confiance, tandis que la note signale explicitement celle de l’attente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit comme nom propre afin de préserver le nom divin du texte hébreu plutôt que de lui substituer un titre.
- source_word: שְׁמֹר דַּרְכּוֹ
  choice: suis sa voie
  rationale: שׁמר signifie garder, observer ou respecter. Dans cette construction, « suis sa voie » exprime naturellement l’adhésion fidèle à la conduite voulue par Yahweh sans alourdir le vers.
- source_word: וִירוֹמִמְךָ
  choice: il t’élèvera
  rationale: La forme causative de רום signifie élever ou placer en hauteur. « Il t’élèvera » convient au registre poétique et au thème de la réhabilitation.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: pour que tu hérites du pays
  rationale: ירשׁ peut signifier hériter ou prendre possession. « Hérites » préserve la portée d’héritage, tandis que « pays » rend ici le cadre d’alliance récurrent dans le psaume, sans exclure en note le sens plus large de « terre ».
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: quand les méchants seront retranchés
  rationale: La préposition ב avec l’infinitif construit situe l’action dans le temps. « Seront retranchés » conserve l’image judiciaire forte de כרת au lieu de la généraliser en « seront détruits ».
- source_word: תִּרְאֶה
  choice: tu le verras
  rationale: Le verbe signifie simplement « tu verras ». Le pronom « le » reprend en français l’événement qui précède et rend la phrase idiomatique sans ajouter une nouvelle idée.
theological_decisions:
- issue: Sens de אָרֶץ dans le contexte sapientiel et allianciel du Psaume 37
  choice: pays
  alternative: terre
  rationale: Le psaume reprend à plusieurs reprises le langage de l’héritage promis à Israël, ce qui favorise « pays ». Toutefois, אָרֶץ peut aussi désigner la terre au sens plus large ; cette possibilité demeure explicite dans la note, notamment en raison de l’écho de Matthieu 5.5.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La formulation conserve le parallélisme des impératifs et de la promesse, le nom divin Yahweh, l’image forte de l’élévation et celle des méchants retranchés. Les ambiguïtés de קוה et de אָרֶץ sont maintenues au moyen de notes.
