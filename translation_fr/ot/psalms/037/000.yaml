  source_fidelity: 'La traduction rend correctement la suscription לְדָוִד (« De David ») et les deux impératifs. Toutefois, בַּמְּרֵעִים signifie plus directement « les malfaisants / les méchants » que « à cause de ceux qui font le mal » : la préposition ב ici introduit l’objet ou le sujet occasionnant l’agitation, et « devant les malfaisants » rend plus précisément la tournure sans expliciter indûment le motif. Le second membre est fidèle : קנא exprime ici l’envie, et עֹשֵׂי עַוְלָה, « ceux qui pratiquent l’injustice ».'
  naturalness: « Ne t’irrite pas devant les malfaisants » et « n’envie pas ceux qui pratiquent l’injustice » sont naturels, directs et d’un registre psalmique moderne. « Ne jalouse pas » est possible, mais « n’envie pas » convient mieux ici à la comparaison avec la prospérité apparente des injustes et évite l’ambiguïté française de « jalouser ».
  terminology: « Malfaisants » et « ceux qui pratiquent l’injustice » conservent le parallélisme hébreu et distinguent les deux désignations sans surinterprétation théologique. La note sur le premier impératif doit être ancrée à l’expression traduite, non au groupe nominal suivant.
