base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: fr
  text: De David. Ne t’irrite pas devant les malfaisants[a] ; n’envie pas ceux qui pratiquent l’injustice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne t’échauffe pas devant les malfaisants. » Le verbe hébreu peut évoquer le fait de s’échauffer, de s’agiter ou de s’irriter.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui font l’injustice » ; littéralement : « ceux qui font l’injustice » (ou « l’iniquité »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La formule hébraïque traditionnelle peut indiquer l’auteur, l’appartenance ou le lien avec David; la tournure française concise conserve cette ouverture sans la préciser davantage.
- source_word: אַל תִּתְחַר
  choice: Ne t’irrite pas
  rationale: Le verbe חרה évoque le fait de s’échauffer ou de s’enflammer de colère; « s’irriter » restitue cette image dans un français naturel.
- source_word: בַּמְּרֵעִים
  choice: à cause de ceux qui font le mal
  rationale: Le syntagme désigne les malfaiteurs; la formulation verbale est claire et idiomatique pour un lectorat moderne.
- source_word: אַל תְּקַנֵּא
  choice: ne jalouse pas
  rationale: קנא exprime ici la jalousie ou l’envie dirigée vers les personnes qui prospèrent malgré leur conduite injuste.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: ceux qui commettent l’injustice
  rationale: עַוְלָה désigne l’injustice, l’iniquité ou la conduite fautive; « commettent l’injustice » reste proche de la construction « ceux qui font » tout en étant naturel.
theological_decisions:
- issue: Nature du lien indiqué par לְ dans le titre davidique
  choice: De David
  alternative: Pour David / Au sujet de David
  rationale: Le texte hébreu ne détermine pas à lui seul la nature exacte de ce lien. La formule consacrée « De David » préserve la concision et une part de cette ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier suit les impératifs hébreux. Le parallélisme des deux interdictions est conservé, ainsi que l’ambiguïté sobre de la suscription davidique.
