id: PSA.37.1
reference: Psalms 37:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: fr
  text: De David.[a] Ne t’irrite pas à cause de ceux qui font le mal ; ne porte pas envie à ceux qui commettent l’injustice.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David » ou « Par David ». La suscription hébraïque peut indiquer l’auteur, l’appartenance ou la dédicace.
    reason: ambiguïté de la suscription
  - marker: b
    text: Ou « ceux qui font le mal ». Le terme hébreu peut désigner le tort, l’injustice ou l’iniquité.
    reason: alternative lexicale
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La tournure conserve de façon concise l’ambiguïté de la suscription, qui peut exprimer l’auteur, l’appartenance ou la dédicace.
- source_word: אַל תִּתְחַר
  choice: Ne t’irrite pas
  rationale: Le hitpael de חרה évoque le fait de s’échauffer intérieurement, de s’agiter ou de s’irriter. Cette formulation française est naturelle sans réduire le sens à une simple inquiétude ni l’intensifier jusqu’à la fureur.
- source_word: בַּמְּרֵעִים
  choice: à cause de ceux qui font le mal
  rationale: La préposition בְּ indique ici le motif ou l’occasion de l’irritation. La périphrase rend clairement le participe désignant les malfaisants.
- source_word: אַל תְּקַנֵּא
  choice: ne porte pas envie
  rationale: Dans ce contexte, קנא désigne l’envie suscitée par ceux qui agissent mal plutôt que la jalousie relationnelle. « Porter envie » est idiomatique et dignifié.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: à ceux qui commettent l’injustice
  rationale: La traduction garde la valeur active du participe עֹשֵׂי et rend עַוְלָה par « injustice », qui exprime le tort et l’iniquité sans ajouter une qualification doctrinale.
