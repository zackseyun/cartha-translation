source:
  edition: WLC
  text: חַ֭רְבָּ/ם תָּב֣וֹא בְ/לִבָּ֑/ם וְ֝/קַשְּׁתוֹתָ֗/ם תִּשָּׁבַֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/015.yaml
  text: Their sword will enter their own heart[a], and their bows will be broken.
translation:
  language: fr
  text: Leur épée entrera dans leur propre cœur[a], et leurs arcs seront brisés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans leurs propres cœurs » ; l’hébreu emploie « cœur » au singulier avec un possesseur pluriel, tournure collective courante.
    reason: alternative lexicale et précision grammaticale
lexical_decisions:
- source_word: חַרְבָּם
  choice: leur épée
  rationale: Le nom חֶרֶב est au singulier avec un suffixe de troisième personne du pluriel masculin. Le singulier collectif ou distributif se conserve naturellement en français.
- source_word: תָּבוֹא
  choice: entrera
  rationale: Le qal inaccompli de בוא s’accorde avec le sujet féminin singulier « épée ». Avec בְּ et « cœur », « entrer dans » exprime directement le mouvement de pénétration, tandis que le futur convient à la portée prédictive du vers poétique.
- source_word: בְלִבָּם
  choice: dans leur propre cœur
  rationale: L’hébreu dit littéralement « dans leur cœur ». « Propre » explicite avec naturel en français le retour de l’arme contre ceux qui la portent, déjà impliqué par le contexte, sans modifier le référent.
- source_word: וְקַשְּׁתוֹתָם
  choice: et leurs arcs
  rationale: Le nom est au pluriel avec un suffixe de troisième personne du pluriel masculin ; la conjonction est conservée.
- source_word: תִּשָּׁבַרְנָה
  choice: seront brisés
  rationale: Le nifal inaccompli féminin pluriel de שבר a ici un sens passif. « Seront brisés » est direct et garde une intensité moins interprétative que « seront fracassés ».
theological_decisions:
- issue: Le caractère réflexif du jugement
  choice: « leur propre cœur » rend explicite que leur épée se retourne contre eux
  alternative: « leur cœur », traduction plus strictement littérale
  rationale: Le possessif et le contexte établissent déjà que le cœur appartient aux détenteurs de l’épée. « Propre » clarifie cette ironie rétributive en français sans préciser le mécanisme ni ajouter une doctrine.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve le parallélisme poétique, le singulier collectif « leur épée / leur cœur » et le pluriel explicite « leurs arcs ».
