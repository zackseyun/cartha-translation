source:
  edition: WLC
  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: fr
  text: Considère l’homme intègre[a] et regarde l’homme droit, car l’homme de paix[c] a un avenir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Observe celui qui est intègre et vois celui qui est droit. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « fin » ou « issue » ; certains comprennent ici « postérité ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’homme pacifique » ; le mot traduit par « paix » peut aussi évoquer le bien-être ou la plénitude.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: Observe
  rationale: Dans ce contexte, l’impératif invite à prêter une attention soutenue à une personne et à son sort, plutôt qu’à la garder ou à la protéger. « Observe » conserve la force exhortative et le parallélisme avec « regarde ».
- source_word: תָּם
  choice: celui qui est intègre
  rationale: Le terme évoque l’intégrité et la plénitude morale, non une perfection sans péché. Cette tournure est naturelle en français et respecte l’emploi substantivé de l’adjectif hébreu sans répéter explicitement « homme ».
- source_word: וּרְאֵה
  choice: et regarde
  rationale: Le second impératif forme un parallèle direct avec שְׁמָר. « Regarde » en restitue simplement la force visuelle et poétique.
- source_word: יָשָׁר
  choice: celui qui est droit
  rationale: L’adjectif substantivé désigne une personne caractérisée par la rectitude morale. « Celui qui est droit » est idiomatique et parallèle à « celui qui est intègre ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’exhortation précédente.
- source_word: אַחֲרִית
  choice: un avenir
  rationale: Le mot peut désigner la fin, l’issue ou l’avenir. Dans le contraste sapientiel du psaume, « un avenir » exprime naturellement la perspective favorable sans éliminer les autres nuances, signalées en note.
- source_word: לְאִישׁ
  choice: l’homme
  rationale: Le texte hébreu emploie le nom masculin singulier אִישׁ. « L’homme » en conserve la forme genrée et s’intègre naturellement à l’expression « l’homme de paix ».
- source_word: שָׁלוֹם
  choice: de paix
  rationale: שָׁלוֹם évoque ici la paix, mais peut aussi inclure le bien-être et l’intégrité. « Homme de paix » conserve l’expression concise et sa richesse sémantique.
theological_decisions:
- issue: Forme masculine singulière de אִישׁ dans un contexte sapientiel
  choice: l’homme
  alternative: la personne ; celui qui
  rationale: Le texte emploie explicitement un nom masculin singulier. La traduction le conserve sans nier que la maxime puisse avoir une portée représentative.
- issue: Sens de אַחֲרִית concernant le destin de l’homme de paix
  choice: a un avenir
  alternative: a une fin ; connaîtra une issue ; aura une postérité
  rationale: Le contexte oppose le sort final des personnes droites à celui des transgresseurs. « A un avenir » communique une perspective favorable tout en laissant la note préserver les sens possibles de fin, d’issue ou de postérité.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux impératifs restent directs, et le parallélisme poétique est conservé. Les tournures « celui qui est intègre » et « celui qui est droit » évitent une nominalisation peu naturelle en français, tandis que « l’homme de paix » garde la formulation masculine explicite du dernier syntagme hébreu.
