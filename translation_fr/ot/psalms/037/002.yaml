  text: For they will quickly wither like grass[a], and fade like green herbage.
translation:
  language: fr
  text: Car ils seront vite fauchés comme l’herbe[a], et ils se flétriront comme la verdure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se flétriront vite comme l’herbe… dépériront comme la végétation verte ». Les verbes hébreux appartiennent à un champ d’images de végétation coupée, desséchée ou flétrie; le premier peut aussi être compris dans le sens de se dessécher.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente et conserve naturellement sa valeur explicative.
- source_word: כֶחָצִיר
  choice: comme l’herbe
  rationale: חָצִיר désigne couramment l’herbe ou la végétation herbacée; « l’herbe » rend clairement l’image de fragilité.
- source_word: מְהֵרָה
  choice: vite
  rationale: Exprime la rapidité de leur disparition dans un français actuel et direct.
- source_word: יִמָּלוּ
  choice: se flétriront
  rationale: Dans cette image végétale, le verbe peut évoquer le fait de se faner ou d’être fauché; « se flétriront » préserve naturellement l’idée du dessèchement sans exclure l’autre analyse, signalée en note.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: comme la verdure
  rationale: L’expression évoque la végétation verte et fraîche; « la verdure » est concise, naturelle et évite une répétition pesante d’« herbe ».
- source_word: יִבּוֹלוּן
  choice: ils dépériront
  rationale: Rend la perte de fraîcheur et de vitalité de la végétation tout en maintenant le parallélisme sans répétition exacte.
