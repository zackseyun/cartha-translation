  text: The mouth of the righteous utters wisdom[b][a], and his tongue speaks justice.
translation:
  language: fr
  text: La bouche du juste exprime la sagesse[a], et sa langue prononce le droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « murmure la sagesse » ou « médite la sagesse ». Le verbe hébreu peut désigner une parole à voix basse ou une méditation ; ici, le parallèle avec « sa langue prononce » suggère probablement une expression vocale.
    reason: lexical_alternative
  - marker: b
    text: Ou « la justice », « le jugement » ou « ce qui est juste ». Le terme hébreu peut désigner le droit, la justice, un jugement, une décision judiciaire ou ce qui est juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: La bouche du juste
  rationale: Conserve la construction nominale et le parallélisme poétique. « Le juste » rend naturellement en français le substantif masculin singulier צַדִּיק, dont la portée est représentative.
- source_word: יֶהְגֶּה
  choice: exprime
  rationale: Le verbe הגה peut évoquer le murmure, la récitation à voix basse ou la méditation. Avec « bouche » pour sujet et en parallèle avec « sa langue parle », il désigne probablement ici une expression vocale réfléchie.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Équivalent français direct et courant de חָכְמָה dans la littérature sapientielle.
- source_word: וּלְשׁוֹנוֹ
  choice: et sa langue
  rationale: Maintient l’image corporelle de l’hébreu et son parallélisme avec « la bouche ».
- source_word: תְּדַבֵּר
  choice: parle
  rationale: Rend directement le piel de דבר tout en donnant une formulation française naturelle.
- source_word: מִשְׁפָּט
  choice: avec justice
  rationale: מִשְׁפָּט peut désigner la justice, le jugement, une décision judiciaire ou ce qui est droit. « Parle avec justice » décrit naturellement une parole conforme au droit sans la limiter au cadre judiciaire.
theological_decisions:
- issue: Masculin singulier représentatif dans la poésie sapientielle
  choice: le juste
  alternative: la personne juste
  rationale: L’hébreu emploie un substantif masculin singulier. « Le juste » en conserve la forme grammaticale et la valeur de figure représentative sans ajouter le nom « homme », absent du texte.
- issue: Portée de מִשְׁפָּט
  choice: justice
  alternative: jugement
  rationale: Le contexte caractérise la parole du juste de manière générale. « Justice » préserve cette portée morale et sociale, tandis que « jugement » pourrait suggérer plus étroitement un verdict.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme entre « bouche » et « langue » est conservé, ainsi que l’ambiguïté lexicale de הגה et de מִשְׁפָּט au moyen de notes.
