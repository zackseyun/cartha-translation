  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: fr
  text: Mets ta confiance en Yahweh et fais le bien ; habite le pays et nourris-toi de fidélité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « pratique la fidélité » ; autre possibilité : « jouis de la sécurité ». L’expression hébraïque est difficile et peut évoquer l’image de paître ou de se nourrir de la fidélité, de la fiabilité.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Mets ta confiance
  rationale: L’impératif de בטח exprime le fait de placer sa confiance en quelqu’un. Cette tournure est naturelle en français et conserve la force exhortative de l’hébreu.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב introduit l’objet de la confiance, et le nom divin יהוה est translittéré « Yahweh » conformément à l’orientation du projet.
- source_word: וַעֲשֵׂה טוֹב
  choice: et fais le bien
  rationale: Traduction concise et idiomatique de l’impératif suivi de טוֹב employé substantivement.
- source_word: שְׁכָן אֶרֶץ
  choice: habite le pays
  rationale: שׁכן signifie habiter ou demeurer. Dans le contexte du psaume, אֶרֶץ désigne vraisemblablement le pays plutôt que la terre au sens général.
- source_word: וּרְעֵה
  choice: et nourris-toi de
  rationale: רעה évoque le fait de paître, de faire paître ou de se nourrir. La formulation retenue conserve l’image pastorale et le caractère réfléchi possible de l’impératif, sans effacer la difficulté de l’expression.
- source_word: אֱמוּנָה
  choice: fidélité
  rationale: אֱמוּנָה peut désigner la fidélité, la fiabilité, la fermeté ou la sécurité. « Fidélité » convient au cadre éthique, tandis que les autres possibilités sont signalées en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération rend visible le nom propre présent dans l’hébreu et suit la convention indiquée pour le projet.
- issue: Interprétation de וּרְעֵה אֱמוּנָה
  choice: nourris-toi de fidélité
  alternative: pratique la fidélité ; fais paître la fidélité ; jouis de la sécurité
  rationale: L’expression hébraïque est difficile. Le choix principal conserve l’image de pâturage ou de nourriture au lieu de la remplacer par une interprétation unique ; la note maintient les autres lectures plausibles.
translation_notes:
  register: Français international moderne, sobre et digne. Tutoiement singulier maintenu pour les impératifs hébreux. La ponctuation met en relief les deux exhortations parallèles.
