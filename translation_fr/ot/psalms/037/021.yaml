  text: לֹוֶ֣ה רָ֭שָׁע וְ/לֹ֣א יְשַׁלֵּ֑ם וְ֝/צַדִּ֗יק חוֹנֵ֥ן וְ/נוֹתֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/021.yaml
  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: fr
  text: Le méchant emprunte et ne rembourse pas, mais le juste est généreux[a] et donne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait grâce » ou « se montre bienveillant ». Le verbe hébreu exprime l’idée d’accorder faveur ou grâce; dans ce contexte, il évoque une générosité concrète.
    reason: lexical_alternative
  - marker: b
    text: Ou « prête ». L’hébreu dit simplement « donne »; dans ce contexte, certains comprennent qu’il s’agit de prêter généreusement.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: emprunte
  rationale: Le participe qal de לוה désigne l’action d’emprunter. Le présent français rend naturellement la portée générale et proverbiale du verset.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé désigne ici, au singulier représentatif, celui qui agit avec méchanceté; ce choix conserve le contraste sapientiel avec « le juste ».
- source_word: לֹא יְשַׁלֵּם
  choice: ne rembourse pas
  rationale: Le piel de שלם signifie ici rendre ce qui a été emprunté. « Rembourser » exprime précisément ce sens dans le contexte.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif substantivé s’oppose directement à רָשָׁע. « Le juste » est une formulation biblique claire et naturelle en français moderne.
- source_word: חוֹנֵן
  choice: fait grâce
  rationale: Le participe qal de חנן exprime le fait d’accorder grâce ou faveur. « Fait grâce » préserve cette valeur fondamentale tout en laissant le don qui suit en manifester concrètement la générosité.
- source_word: וְנוֹתֵן
  choice: et donne
  rationale: נתן signifie normalement « donner ». La formulation conserve l’étendue du terme hébreu sans le réduire au sens contextuellement possible de « prêter ».
theological_decisions:
- issue: Singulier masculin représentatif dans le contraste sapientiel
  choice: Conserver « le méchant » et « le juste » au singulier.
  alternative: « Les méchants… les justes » ou « une personne méchante… une personne juste ».
  rationale: L’hébreu emploie deux adjectifs masculins singuliers substantivés pour représenter deux types de conduite. Le singulier maintient la forme et la force du contraste sans limiter son application aux seuls hommes.
- issue: Rapport entre grâce, générosité et prêt
  choice: Traduire חוֹנֵן par « fait grâce » et נתן par « donne », sans préciser davantage la nature du don.
  alternative: « se montre généreux et prête » ou « est généreux et donne ».
  rationale: Le contexte oppose le mauvais emprunteur au juste généreux, mais l’hébreu ne dit pas explicitement que le juste prête. La traduction préserve donc à la fois le vocabulaire de la grâce et l’ambiguïté du geste de donner.
translation_notes:
  register: Français international moderne, concis et digne. La structure antithétique du proverbe et le singulier représentatif sont conservés. « Fait grâce » garde la nuance lexicale de חנן, tandis que les notes signalent des formulations françaises plus immédiatement idiomatiques et l’interprétation possible de « donne » comme « prête ».
