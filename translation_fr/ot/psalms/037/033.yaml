id: PSA.37.33
reference: Psalms 37:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְ֭הוָה לֹא יַעַזְבֶ֣/נּוּ בְ/יָד֑/וֹ וְ/לֹ֥א יַ֝רְשִׁיעֶ֗/נּוּ בְּ/הִשָּׁפְטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: fr
  text: Yahweh ne l’abandonnera pas entre ses mains[a] et ne le déclarera pas coupable quand il passera en jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans sa main », c’est-à-dire sous son pouvoir.
    reason: lexical_alternative
  - marker: b
    text: Ou « quand il sera jugé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: יַעַזְבֶנּוּ
  choice: ne l’abandonnera pas
  rationale: Le verbe עזב peut signifier laisser, délaisser ou abandonner. « Ne l’abandonnera pas » exprime naturellement ici l’idée que Yahweh ne livrera pas le juste au pouvoir du méchant.
- source_word: בְיָדוֹ
  choice: entre ses mains
  rationale: L’hébreu dit littéralement « dans sa main ». L’expression française « entre ses mains » conserve l’image tout en indiquant idiomatiquement le pouvoir ou la domination; le possessif renvoie au méchant du contexte précédent.
- source_word: יַרְשִׁיעֶנּוּ
  choice: ne le déclarera pas coupable
  rationale: 'Le hifil de רשע a ici un sens judiciaire: prononcer la culpabilité. Cette formulation rend ce sens plus précisément que le seul verbe « condamner », qui peut aussi évoquer l’imposition d’une peine.'
- source_word: בְּהִשָּׁפְטוֹ
  choice: quand il passera en jugement
  rationale: La préposition ב suivie de l’infinitif construit nifal de שפט et du suffixe pronominal reçoit ici une valeur temporelle. La tournure française conserve le cadre judiciaire sans préciser indûment le tribunal concerné.
theological_decisions:
- issue: Référents des pronoms
  choice: Les pronoms compléments renvoient au juste, tandis que le possessif dans « entre ses mains » renvoie au méchant.
  alternative: Comprendre l’énoncé de manière plus générale, sans marquer le contraste entre deux référents masculins singuliers.
  rationale: Le contexte immédiat oppose le méchant au juste. Les formes masculines singulières poursuivent naturellement cette opposition, sans qu’il soit nécessaire d’ajouter explicitement « du méchant » dans le corps du verset.
- issue: Portée judiciaire du second membre
  choice: Rendre רשע au sens de « déclarer coupable » et שפט comme le fait de passer en jugement.
  alternative: Traduire plus largement par « ne le tiendra pas pour méchant » ou par « ne le condamnera pas lors de son jugement ».
  rationale: L’association des deux termes relève du langage judiciaire. La traduction maintient cette dimension sans y importer une catégorie doctrinale postérieure ni identifier le tribunal.
translation_notes:
  register: Français international moderne, digne et accessible. « Entre ses mains » est idiomatique tout en préservant l’image hébraïque; « passera en jugement » maintient nettement le registre judiciaire.
