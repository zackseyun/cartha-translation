revisions:
- from: Garde le silence devant Yahweh[a] et attends-le avec patience[b] ; ne brûle pas de colère[c] à cause de celui qui réussit dans sa voie, à cause de l’homme qui met ses intrigues à exécution.
  to: Garde le silence devant Yahweh[a] et attends-le patiemment[b] ; ne t’enflamme pas de colère[c] à cause de celui dont la voie prospère, à cause de l’homme qui met ses manœuvres à exécution.
  rationale: 'La révision élimine un calque français maladroit tout en conservant les images lexicales du texte hébreu : le silence, la voie qui prospère et la colère qui s’enflamme. Elle améliore aussi la précision de la relation entre le prospère et « sa voie », sans modifier le sens ni réduire l’ambiguïté de l’attente exprimée par וְהִתְחוֹלֵל.'
