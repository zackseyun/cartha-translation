  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: fr
  text: Garde le silence devant Yahweh[a] et attends-le patiemment[b] ; ne t’enflamme pas de colère[c] à cause de celui dont la voie prospère, à cause de l’homme qui met ses manœuvres à exécution.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tiens-toi tranquille devant Yahweh ». Le verbe hébreu peut exprimer aussi bien le silence que l’immobilité paisible.
    reason: lexical_alternative
  - marker: b
    text: Ou « attends-le avec un ardent désir ». Le verbe hébreu peut évoquer une attente intense, voire douloureuse ; la traduction traditionnelle « repose-toi en lui » en donne une autre interprétation.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement : « ne t’irrite pas ». L’hébreu parle plus littéralement du fait de s’échauffer ou de s’enflammer de colère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: Garde le silence
  rationale: L’impératif de דמם exprime le silence ou l’immobilité paisible. « Garde le silence » restitue directement l’idée de retenue devant Dieu, tout en restant naturel en français.
- source_word: לַיהוָה
  choice: devant Yahweh
  rationale: Dans cette construction, la préposition ל marque l’orientation vers Yahweh et sa présence. « Devant » convient au contexte d’attente recueillie.
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: et attends-le avec patience
  rationale: La forme hitpolél de חול peut évoquer l’agitation, la souffrance ou une attente intense. Ici, en parallèle avec l’appel au silence, elle désigne vraisemblablement une attente patiente, sans effacer entièrement sa possible intensité, signalée en note.
- source_word: אַל תִּתְחַר
  choice: ne brûle pas de colère
  rationale: חרה emploie l’image de la chaleur qui s’allume pour exprimer la colère. Cette formulation française conserve la métaphore hébraïque, contrairement à un simple « ne t’irrite pas ».
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: à cause de celui qui réussit dans sa voie
  rationale: La préposition ב indique ici le motif de la colère. Le participe מצליח exprime la réussite, tandis que דרכו conserve l’image de la voie, c’est-à-dire du cours de la conduite ou de la vie.
- source_word: בְּאִישׁ
  choice: à cause de l’homme
  rationale: אִישׁ est un nom masculin singulier désignant ici un individu représentatif. « L’homme » conserve cette forme sans la neutraliser.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: qui met ses intrigues à exécution
  rationale: Le participe עֹשֶׂה indique la réalisation effective, et מְזִמּוֹת désigne des desseins calculés, ici négatifs. La formulation rend à la fois le caractère prémédité et le passage à l’acte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre d’alliance plutôt que de le remplacer par un titre.
- issue: Valeur de l’attente exprimée par וְהִתְחוֹלֵל לוֹ
  choice: attends-le avec patience
  alternative: attends-le avec un ardent désir ; demeure en repos en lui
  rationale: Le contexte exhortatif favorise l’idée d’attente patiente, mais la forme verbale peut aussi suggérer une attente intense, voire douloureuse. La note maintient cette tension lexicale.
- issue: Genre grammatical de אִישׁ
  choice: l’homme
  alternative: quelqu’un ; la personne
  rationale: Le substantif hébreu est masculin singulier et présente un individu représentatif. Le rendu retenu respecte cette forme sans lui ajouter une portée doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les images hébraïques du silence, de la voie et de la colère qui brûle. Le parallélisme de la seconde moitié est maintenu par la répétition de « à cause de ».
