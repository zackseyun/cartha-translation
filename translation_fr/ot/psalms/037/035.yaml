  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: fr
  text: J’ai vu un méchant, un homme impitoyable, s’étendre comme un arbre luxuriant du pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. Autre traduction possible : « J’ai vu un méchant, un homme impitoyable, se déployer comme un arbre indigène luxuriant. » Le texte ne mentionne pas explicitement un arbre; l’image d’un arbre vigoureux et natif du pays est généralement comprise.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: J’ai vu
  rationale: Le qal accompli à la première personne du singulier exprime ici le témoignage rétrospectif du psalmiste. Le passé composé est naturel en français moderne et garde un lien avec sa réflexion présente.
- source_word: רָשָׁע
  choice: un méchant
  rationale: Le substantif désigne une personne moralement mauvaise; « un méchant » est une formulation claire et bien établie dans le registre sapientiel.
- source_word: עָרִיץ
  choice: un homme impitoyable
  rationale: Le terme évoque une personne puissante, oppressive et redoutable. « Impitoyable » en rend la dureté sans limiter le sens à la violence physique ni imposer une fonction politique.
- source_word: וּמִתְעָרֶה
  choice: s’étendre
  rationale: Le participe hitpael décrit une expansion vigoureuse. « S’étendre » conserve la nuance réfléchie et convient à l’image végétale sans ajouter explicitement des branches absentes du texte.
- source_word: כְּאֶזְרָח
  choice: comme un arbre … dans son sol natal
  rationale: אֶזְרָח signifie normalement « indigène, natif ». Dans cette comparaison poétique difficile, le contexte suggère un arbre solidement implanté dans son propre terroir; « arbre » et « sol » explicitent cette image probable.
- source_word: רַעֲנָן
  choice: verdoyant
  rationale: L’adjectif décrit ce qui est vert, frais et vigoureux. « Verdoyant » préserve directement l’image végétale tout en suggérant la prospérité.
theological_decisions: []
translation_notes:
