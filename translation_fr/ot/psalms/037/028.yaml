id: PSA.37.28
reference: Psalms 37:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: fr
  text: 'Car Yahweh aime la justice

    et il n’abandonne pas ceux qui lui sont fidèles[a] ;

    ils sont gardés pour toujours[b],

    mais la descendance des méchants sera retranchée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses fidèles », « ses saints » ou « ceux qui lui sont attachés ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se comprendre de manière plus resserrée : « ceux qui lui sont fidèles sont gardés pour toujours ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel de l’hébreu, conformément à l’usage du projet.
- source_word: אֹהֵב
  choice: aime
  rationale: Équivalent direct, naturel et actuel du participe hébreu.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte sapientiel, le terme désigne ce qui est juste et l’ordre moral droit, plutôt qu’un jugement particulier.
- source_word: יַעֲזֹב
  choice: n’abandonne pas
  rationale: Rend clairement le sens de délaisser ou abandonner, avec une tonalité relationnelle naturelle en français moderne.
- source_word: חֲסִידָיו
  choice: ceux qui lui sont fidèles
  rationale: Exprime la loyauté et la piété liées à חֶסֶד sans donner à « saints » un sens ecclésiastique ultérieur.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Rend simplement l’idée de durée indéfinie ou perpétuelle.
- source_word: נִשְׁמָרוּ
  choice: ils sont gardés
  rationale: Préserve la forme passive du nifal et son idée de protection ou de conservation.
- source_word: זֶרַע
  choice: la descendance
  rationale: Le nom collectif désigne ici la postérité des méchants, et non la semence au sens concret.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Formulation collective traditionnelle, claire et adaptée au contraste sapientiel du psaume.
- source_word: נִכְרָת
  choice: sera retranchée
  rationale: Conserve l’image biblique d’être coupé ou exclu, ainsi que sa portée judiciaire, sans la réduire à une paraphrase.
theological_decisions:
- issue: Sens et référent de חֲסִידָיו
  choice: « ceux qui lui sont fidèles » désigne les personnes caractérisées par leur fidélité et leur attachement à Yahweh.
  alternative: « ses fidèles », « ses saints » ou « ceux qui lui sont attachés »
  rationale: La formulation retenue préserve la dimension relationnelle et la loyauté associées à חֶסֶד, tout en évitant de transformer « saints » en catégorie technique postérieure.
- issue: Rapport syntaxique entre les deux propositions centrales
  choice: « il n’abandonne pas ceux qui lui sont fidèles ; ils sont gardés pour toujours » présente deux affirmations complémentaires.
  alternative: 'Rattacher plus étroitement לְעוֹלָם à חֲסִידָיו : « ceux qui lui sont fidèles sont gardés pour toujours » ou comprendre « pour toujours » avec « n’abandonne pas ».'
  rationale: L’ordre des mots et les accents permettent une certaine hésitation dans le découpage. Le point-virgule garde les deux verbes explicites sans résoudre excessivement leur rapport.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par la mise en lignes. « N’abandonne pas » est plus courant aujourd’hui que « ne délaisse pas », tandis que « retranchée » préserve l’image forte de l’hébreu.
