  source_fidelity: Les deux premiers impératifs rendent fidèlement הֶרֶף מֵאַף et וַעֲזֹב חֵמָה. « Ne t’irrite pas » est une traduction naturelle et recevable de אַל תִּתְחַר. La finale doit toutefois conserver plus clairement le sens de « faire le mal » de לְהָרֵעַ, plutôt que « mal faire », qui signifie habituellement faire quelque chose de manière maladroite ou incorrecte.
  naturalness: « Renonce à la colère » et « abandonne la fureur » relèvent d’un français moderne, sobre et poétique. « Cela ne mène qu’à mal faire » est ambigu et peu idiomatique dans le sens visé. « Cela ne conduit qu’à faire le mal » est clair et naturel.
