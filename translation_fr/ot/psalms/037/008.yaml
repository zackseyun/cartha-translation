  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: fr
  text: 'Renonce à la colère et abandonne la fureur ; ne t’irrite pas[a] : cela ne conduit qu’à faire le mal.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne t’échauffe pas » ou « ne t’agite pas ».
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « seulement pour faire le mal ». La construction peut exprimer le but ou le résultat.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Renonce à la colère
  rationale: הֶרֶף exprime ici l’idée de relâcher, de cesser ou de renoncer, tandis que אַף désigne idiomatiquement la colère. Cette formulation française est naturelle et conserve la force de l’impératif.
- source_word: וַעֲזֹב חֵמָה
  choice: et abandonne la fureur
  rationale: עָזַב signifie laisser ou abandonner. חֵמָה évoque une colère ardente ; « fureur » la distingue de אַף et maintient le parallélisme poétique.
- source_word: אַל תִּתְחַר
  choice: ne t’irrite pas
  rationale: La forme verbale peut décrire le fait de s’échauffer, de s’agiter ou de s’irriter. « Ne t’irrite pas » rend clairement l’exhortation en français moderne sans affaiblir sa charge émotionnelle.
- source_word: אַךְ לְהָרֵעַ
  choice: cela ne mène qu’à mal faire
  rationale: אַךְ a ici une valeur restrictive, et l’infinitif avec לְ peut exprimer le but ou le résultat. La formulation retenue présente naturellement l’irritation comme conduisant à une mauvaise action, tout en signalant en note la construction plus littérale.
theological_decisions:
- issue: Portée morale de la proposition finale
  choice: « cela ne mène qu’à mal faire »
  alternative: « seulement pour faire du mal »
  rationale: L’hébreu permet de comprendre l’infinitif comme le but ou comme l’aboutissement de l’irritation. Le texte principal suit la lecture résultative suggérée par le contexte, tandis que la note conserve la lecture plus littérale et potentiellement finale.
translation_notes:
  register: Français international moderne, sobre et poétique. Les deux termes hébreux relatifs à la colère sont distingués par « colère » et « fureur » ; le tutoiement singulier reproduit l’adresse hébraïque.
