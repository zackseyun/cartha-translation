  text: צוֹפֶ֣ה רָ֭שָׁע לַ/צַּדִּ֑יק וּ֝/מְבַקֵּ֗שׁ לַ/הֲמִית/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/032.yaml
  text: The wicked watches the righteous and seeks to put him to death[a][b].
translation:
  language: fr
  text: Le méchant observe le juste[a] et cherche à le tuer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « guette le juste » ou « l’épie ». Le verbe hébreu signifie observer ou surveiller et, dans ce contexte, peut suggérer une intention hostile.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « à le faire mourir ».
    reason: literal_rendering
lexical_decisions:
- source_word: צוֹפֶה
  choice: ép​​ie
  rationale: Le participe de צפה signifie observer ou surveiller. Dans ce contexte hostile, « épie » exprime naturellement en français une observation attentive animée d’une intention malveillante, sans aller jusqu’à expliciter une embuscade.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé au singulier désigne ici, de manière représentative, une personne méchante. « Le méchant » conserve cette formulation caractéristique de la poésie sapientielle.
- source_word: לַצַּדִּיק
  choice: le juste
  rationale: « Le juste » rend la catégorie morale exprimée par צַדִּיק et constitue une formulation naturelle et traditionnelle en français moderne.
- source_word: וּמְבַקֵּשׁ
  choice: et cherche
  rationale: בקש exprime la recherche ou la volonté orientée vers un but. « Cherche à » conserve le sens de base tout en communiquant l’intention hostile.
- source_word: לַהֲמִיתוֹ
  choice: à le faire mourir
  rationale: L’infinitif hiphil de מות a un sens causatif, littéralement « causer sa mort ». « Le faire mourir » préserve cette valeur causative; « le tuer » est une traduction plus directe et naturelle possible.
- source_word: וּ
  choice: et
  rationale: La conjonction relie directement les deux actions participiales parallèles.
theological_decisions: []
