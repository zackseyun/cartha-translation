source:
  edition: WLC
  text: וַֽ/יַּעְזְרֵ֥/ם יְהוָ֗ה וַֽ/יְפַ֫לְּטֵ֥/ם יְפַלְּטֵ֣/ם מֵ֭/רְשָׁעִים וְ/יוֹשִׁיעֵ֑/ם כִּי חָ֥סוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: fr
  text: Yahweh les aide et les délivre[a] ; il les délivre des méchants et les sauve, parce qu’ils cherchent refuge en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les arrache au danger » pour les deux emplois de « délivre » ; l’hébreu répète le même verbe de délivrance pour insister.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils mettent leur confiance en lui » ; l’hébreu évoque plus littéralement le fait de chercher refuge en lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וַיַּעְזְרֵם
  choice: les aide
  rationale: Le verbe עזר signifie « aider, porter secours ». Le présent convient à la portée générale et poétique de cette affirmation finale.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: les délivre ; il les délivre
  rationale: Les deux formes viennent de פלט, qui exprime la délivrance ou le fait d’échapper. La répétition hébraïque est conservée pour maintenir son insistance poétique.
- source_word: מֵרְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne les personnes méchantes sans préciser leur sexe ; « les méchants » est naturel et concis en français.
- source_word: וְיוֹשִׁיעֵם
  choice: et les sauve
  rationale: Le verbe ישׁע appartient au champ du salut et de la délivrance. « Sauve » conserve sa portée forte tout en restant naturel.
- source_word: כִּי
  choice: parce que
  rationale: La conjonction introduit ici le motif de l’intervention salvatrice de Yahweh.
- source_word: חָסוּ בוֹ
  choice: ils cherchent refuge en lui
  rationale: חסה évoque concrètement le fait de se réfugier ou de chercher protection. Cette formulation préserve la métaphore plutôt que de la réduire à la seule idée de confiance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme ; la translittération « Yahweh » préserve le nom divin sans le remplacer par un titre.
- issue: Maintien de la répétition du verbe פלט
  choice: « les délivre ; il les délivre »
  alternative: Fusionner les deux occurrences en une seule proposition
  rationale: La répétition adjacente donne de l’insistance à l’action de délivrer. La conserver respecte la forme poétique et évite d’aplanir le texte.
- issue: Sens de חָסוּ בוֹ
  choice: « ils cherchent refuge en lui »
  alternative: « ils mettent leur confiance en lui »
  rationale: Le sens de confiance est impliqué, mais l’hébreu emploie une image de refuge et de protection qu’il convient de maintenir dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et la répétition de l’hébreu sans devenir artificielle. Le point-virgule marque les deux mouvements du verset.
