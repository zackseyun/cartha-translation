  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: fr
  text: Mais les humbles[a] hériteront du pays[b] et trouveront leur joie dans une paix abondante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les doux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme désigne les personnes humbles, modestes ou socialement faibles. « Les humbles » est naturel en français moderne et conserve la portée éthique du contexte.
- source_word: יִירְשׁוּ
  choice: hériteront
  rationale: Le verbe peut signifier hériter, posséder ou prendre possession. « Hériteront » maintient le futur et la résonance liée au don du pays.
- source_word: אָרֶץ
  choice: du pays
  rationale: Dans ce psaume, les mentions répétées de possession et d'exclusion favorisent le sens de « pays », sans exclure le sens plus large de « terre », signalé en note.
- source_word: וְהִתְעַנְּגוּ
  choice: et trouveront leur joie
  rationale: La forme réfléchie exprime le fait de prendre un vif plaisir. Cette tournure française est naturelle, digne et restitue la nuance réflexive sans lourdeur.
- source_word: עַל
  choice: dans
  rationale: Avec l'idée de joie et un nom abstrait, « dans » rend naturellement en français la relation exprimée par la préposition hébraïque.
- source_word: רֹב
  choice: abondante
  rationale: Le nom hébreu exprime l'abondance ou la profusion. L'adjectif « abondante » donne une formulation française fluide tout en conservant cette idée.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le rendu principal le plus concis; dans ce contexte, il englobe aussi la sécurité, le bien-être et l'épanouissement.
theological_decisions:
- issue: Résonance intertextuelle avec Matthieu 5.5 et la formulation traditionnelle selon laquelle les doux hériteront de la terre
  choice: Traduire directement l'hébreu par « les humbles hériteront du pays », avec « la terre » en note.
  alternative: Les doux hériteront de la terre.
  rationale: Le texte principal privilégie le sens contextuel du texte hébreu. La note conserve toutefois l'autre sens légitime de אֶרֶץ et permet de percevoir la formulation devenue familière dans la réception chrétienne, sans imposer celle-ci au psaume.
translation_notes:
  register: Français international moderne, courant et digne. « Les humbles » évite le caractère potentiellement désuet ou ambigu de « les doux ». « Trouveront leur joie » est plus idiomatique que le calque « se délecteront » tout en conservant l'intensité positive du verbe hébreu.
