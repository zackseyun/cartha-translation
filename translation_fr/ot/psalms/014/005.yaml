- from: Là, ils ont été saisis d’une grande frayeur[a], car Dieu est au milieu de la génération du juste[b].
  to: Là, ils ont été saisis d’une grande frayeur[a], car Dieu est au milieu de la génération des justes[b].
  rationale: La révision remplace le singulier français potentiellement individualisant par le collectif « des justes », qui rend naturellement la portée collective possible du singulier hébreu sans imposer l’identification à un juste particulier. Les deux notes restent ancrées aux éléments textuels pertinents et la note b est harmonisée avec ce choix.
