  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: fr
  text: Là, ils ont été saisis d’une grande frayeur[a], car Dieu est au milieu de la génération des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ont craint une crainte », tournure hébraïque emphatique.'
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « car Dieu est avec la génération des justes » ou « car Dieu est au sein de la génération juste ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe désigne sobrement la scène où la terreur les saisit et conserve la concision poétique de l’hébreu.
- source_word: פָּחֲדוּ פָחַד
  choice: ils ont été saisis d’une grande frayeur
  rationale: La construction intensive, littéralement « ils ont craint une crainte », est rendue par une expression française naturelle qui en conserve la force.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de leur frayeur et convient au registre poétique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le pluriel morphologique renvoie ici, avec un sens singulier, au Dieu d’Israël.
- source_word: בְּדוֹר
  choice: au milieu de la génération
  rationale: La préposition בְּ peut exprimer la présence dans un groupe ou parmi ses membres. « Au milieu de » traduit clairement cette présence sans ajouter explicitement l’idée de soutien.
- source_word: צַדִּיק
  choice: du juste
  rationale: L’adjectif est morphologiquement singulier. La traduction conserve ce singulier et son lien avec « génération », tout en laissant ouverte une possible valeur collective.
theological_decisions:
- issue: Relation de Dieu à la génération du juste dans בְּדוֹר צַדִּיק
  choice: Dieu est au milieu de la génération du juste
  alternative: Dieu est avec la génération des justes
  rationale: « Au milieu de » suit étroitement la valeur locative ou associative de בְּ et préserve l’idée de présence divine sans préciser davantage si elle implique ici solidarité, protection ou simple présence parmi eux.
- issue: Valeur singulière ou collective de צַדִּיק
  choice: du juste
  alternative: des justes / juste
  rationale: Le texte porte un singulier, susceptible de qualifier collectivement une génération ou de signifier « la génération juste ». Le maintien du singulier préserve cette tension grammaticale.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation reste concise; « grande frayeur » restitue l’intensité de la construction hébraïque, tandis que les notes signalent les ambiguïtés réelles de la préposition בְּ et du singulier צַדִּיק.
