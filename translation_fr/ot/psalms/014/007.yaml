  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשׁוּעַ֪ת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב יְ֭הוָה שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָֽאֵל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: fr
  text: Ah ! que le salut d’Israël vienne de Sion ! Lorsque Yahweh rétablira la situation de son peuple[a], Jacob exultera, Israël se réjouira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ramènera les captifs de son peuple ». Littéralement, l’hébreu dit : « fera revenir la captivité de son peuple ». Cette expression signifie souvent que Dieu rétablit la situation d’un peuple ou met fin à son malheur.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! si…
  rationale: Cette tournure hébraïque exprime ici un souhait ardent plutôt qu’une question littérale. « Ah ! si… » restitue naturellement sa valeur optative en français.
- source_word: מִצִּיּוֹן
  choice: de Sion
  rationale: La préposition מִן indique ici la provenance ou l’origine ; « Sion » est la forme française traditionnelle du nom de lieu.
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: le salut d’Israël
  rationale: Le groupe construit désigne le salut ou la délivrance d’Israël. « Salut » conserve la portée large du terme hébreu sans la limiter à un secours particulier.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: Quand Yahweh rétablira la situation de son peuple
  rationale: L’expression idiomatique décrit le renversement de la détresse du peuple et le rétablissement de sa condition. Cette formulation française reste assez large pour ne pas imposer un contexte précis d’exil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver son caractère de nom propre plutôt que de le remplacer par un titre.
- source_word: יָגֵל
  choice: exultera
  rationale: Le verbe exprime une joie vive et débordante ; « exultera » en garde l’intensité dans un registre poétique digne.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom est conservé et sert ici de désignation poétique collective du peuple.
- source_word: יִשְׂמַח
  choice: se réjouira
  rationale: Cette traduction naturelle exprime la joie tout en maintenant une légère distinction avec le verbe plus intense rendu par « exultera ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: La forme française usuelle est conservée ; elle est parallèle à « Jacob » et désigne collectivement le peuple.
theological_decisions:
- issue: Sens de l’expression שׁוּב שְׁבוּת
  choice: rétablira la situation de son peuple
  alternative: ramènera les captifs de son peuple / ramènera la captivité de son peuple
  rationale: L’expression peut évoquer littéralement le retour de captifs, mais elle sert souvent d’idiome pour le rétablissement général d’un peuple ou le renversement de son malheur. Le psaume ne précise pas un exil historique ; le texte principal conserve donc le sens large, tandis que la note signale la lecture plus littérale.
translation_notes:
  register: Français international moderne, poétique et digne. « Ah ! si… » exprime le souhait ardent ; « exultera » maintient l’intensité du premier verbe de joie et le parallélisme avec « se réjouira ».
