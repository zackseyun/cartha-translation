id: PSA.14.3
reference: Psalms 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ/כֹּ֥ל סָר֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/003.yaml
  text: All have turned aside; together they have become corrupt. There is none who does good[a], not even one.
translation:
  language: fr
  text: Tous se sont détournés ; ensemble, ils se sont corrompus[a]. Personne ne fait le bien, pas même un seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont souillés » ou « sont devenus infects ». Le verbe hébreu évoque ce qui s’est gâté ou corrompu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: Tous
  rationale: L’expression désigne ici l’ensemble des personnes visées. « Tous » est naturel et conserve la portée universelle du texte.
- source_word: סָר
  choice: se sont détournés
  rationale: Le verbe סור signifie couramment « se détourner, s’écarter ». Malgré sa forme singulière liée à un sujet collectif, le pluriel est idiomatique en français.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe souligne le caractère collectif de leur corruption sans préciser davantage la manière dont elle se produit.
- source_word: נֶאֱלָחוּ
  choice: se sont corrompus
  rationale: La forme verbale exprime le fait de devenir gâté, souillé ou corrompu. « Se sont corrompus » restitue ce changement d’état dans un français digne et courant.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Personne ne fait le bien
  rationale: La particule de non-existence suivie du participe nie qu’il y ait quelqu’un qui accomplisse le bien. Cette formulation est naturelle et conserve la force de la négation.
- source_word: אֵין גַּם אֶחָד
  choice: pas même un seul
  rationale: 'La combinaison de la négation, de גַּם et de « un » renforce l’affirmation : aucune exception n’est envisagée.'
theological_decisions:
- issue: Portée de l’affirmation universelle sur la corruption humaine
  choice: 'Conserver l’accusation universelle : « Tous », « Personne », « pas même un seul ».'
  alternative: Atténuer le propos en le présentant comme une généralisation concernant beaucoup de personnes.
  rationale: Les termes hébreux sont explicitement globaux et emphatiques. La traduction en maintient la tension rhétorique et théologique sans lui superposer une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme et l’intensification de l’hébreu sont conservés, avec une ponctuation qui rend lisible la progression du verset.
