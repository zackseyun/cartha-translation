source:
  edition: WLC
  text: יְֽהוָ֗ה מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵי אָ֫דָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵשׁ אֶת אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/002.yaml
  text: Yahweh looks down from heaven on the children of man to see whether there is one who has insight[a], one who seeks God.
translation:
  language: fr
  text: Yahweh, du haut des cieux, regarde les êtres humains[a] pour voir s’il en est un qui comprenne, qui cherche Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils d’Adam » ; expression représentative désignant ici les êtres humains en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de le remplacer par un titre.
- source_word: מִשָּׁמַיִם
  choice: du haut des cieux
  rationale: Cette formulation française naturelle conserve à la fois le pluriel hébreu et l’idée d’un regard porté depuis un lieu élevé.
- source_word: הִשְׁקִיף
  choice: regarde
  rationale: Le verbe décrit un regard dirigé depuis une hauteur. Le présent rend naturellement la scène poétique comme une observation actuelle et frappante.
- source_word: בְּנֵי אָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque, littéralement « les fils d’Adam » ou « les fils de l’homme », désigne ici collectivement l’humanité. La traduction choisie transmet clairement cette portée en français moderne, tandis qu’une note conserve l’image littérale.
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: pour voir s’il en est un
  rationale: Cette tournure exprime directement le but du regard et la question implicite introduite par la particule interrogative hébraïque.
- source_word: מַשְׂכִּיל
  choice: qui comprenne
  rationale: Le participe issu de שכל désigne une personne douée de compréhension ou de discernement. « Comprenne » reste sobre et ne réduit pas le terme à la seule intelligence intellectuelle.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: qui cherche Dieu
  rationale: Cette traduction directe conserve le participe actif et son objet sans ajouter de précision théologique absente du texte.
theological_decisions:
- issue: Portée de בְּנֵי אָדָם
  choice: les êtres humains
  alternative: les fils d’Adam
  rationale: Dans ce contexte, l’expression masculine hébraïque est représentative de toute l’humanité. Le texte principal en donne le sens collectif naturel en français, et la note signale sa forme littérale.
- issue: Relation entre מַשְׂכִּיל et דֹּרֵשׁ
  choice: deux descriptions potentiellement coordonnées d’une même personne
  alternative: deux catégories distinctes de personnes
  rationale: La répétition de « qui » reproduit le parallélisme sans trancher davantage que l’hébreu la question de savoir s’il s’agit strictement d’un seul profil ou de deux qualités étroitement associées.
translation_notes:
  register: Français international actuel, sobre et poétique. « Du haut des cieux » maintient l’image spatiale, tandis que « s’il en est un » apporte une dignité littéraire sans archaïsme marqué.
