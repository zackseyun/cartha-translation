  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: fr
  text: 'Au chef de chœur[a]. De David[b].


    L’insensé dit dans son cœur : « Il n’y a pas de Dieu. » Ils sont corrompus, leur conduite est abominable[c] ; personne ne fait le bien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Au directeur de la musique » ; le terme hébreu désigne le responsable de l’exécution musicale, sans que sa fonction exacte soit certaine.'
    reason: lexical_alternative
  - marker: b
    text: « De David » peut aussi signifier « par David », « pour David » ou indiquer une association avec David.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe du singulier (« l’insensé ») au pluriel (« ils »), allant d’un individu représentatif à l’ensemble de ceux qu’il représente.
    reason: source_structure
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Cette formulation française actuelle désigne clairement le responsable de l’exécution musicale, tout en laissant ouverte la fonction précise du terme dans le titre.
- source_word: לְדָוִד
  choice: De David
  rationale: « De David » conserve mieux que « par David » l’ambiguïté de la préposition hébraïque, qui peut exprimer l’auteur, l’association ou la destination.
- source_word: נָבָל
  choice: l’insensé
  rationale: Le mot désigne moins un manque d’intelligence qu’une personne moralement et spirituellement dévoyée. « L’insensé » exprime cette catégorie biblique sans réduire le sens à une déficience intellectuelle.
- source_word: בְּלִבּוֹ
  choice: dans son cœur
  rationale: Le cœur représente ici la pensée et la volonté intérieures. La formulation littérale reste naturelle en français et conserve cette portée anthropologique.
- source_word: אֵין אֱלֹהִים
  choice: Il n’y a pas de Dieu
  rationale: Cette traduction rend directement la négation existentielle de l’hébreu sans la paraphraser comme une simple indifférence pratique envers Dieu.
- source_word: הִשְׁחִיתוּ
  choice: Ils se sont corrompus
  rationale: Le verbe évoque la corruption ou la dégradation morale. Le passé composé rend naturellement en français l’état résultant exprimé dans le contexte.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: ils ont commis des actes abominables
  rationale: Cette formulation idiomatique unit le verbe exprimant ce qui est abominable au nom désignant les actes ou la conduite.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: il n’y en a aucun qui fasse le bien
  rationale: La tournure reste proche de la construction existentielle hébraïque tout en étant claire et digne en français moderne.
theological_decisions:
- issue: Portée de אֵין אֱלֹהִים
  choice: « Il n’y a pas de Dieu » comme négation existentielle explicite.
  alternative: « Dieu ne compte pas » ou « Il n’y a pas de jugement », compris comme athéisme pratique.
  rationale: Même si le contexte dénonce aussi une conduite impie, l’expression hébraïque affirme directement l’absence ou la non-existence de Dieu. La traduction ne remplace donc pas les mots du texte par leur implication possible.
- issue: Passage du singulier נָבָל aux verbes pluriels
  choice: Conserver le passage de « L’insensé » à « Ils ».
  alternative: Uniformiser au singulier (« Il s’est corrompu ») ou au pluriel (« Les insensés disent »).
  rationale: Le texte passe d’un individu représentatif à la catégorie humaine qu’il incarne. Maintenir ce changement préserve le mouvement et la tension du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le titre conserve sa concision traditionnelle. « L’insensé » garde la dimension morale et spirituelle du terme hébreu. Le passage abrupt du singulier au pluriel est volontairement maintenu et expliqué en note.
