id: PSA.14.6
reference: Psalms 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: fr
  text: Vous couvrez de honte le conseil du pauvre[a], parce que Yahweh est son refuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le projet du pauvre » ; עֲצַת עָנִי peut désigner son conseil, son projet ou son dessein.
    reason: alternative lexicale
lexical_decisions:
- source_word: עֲצַת
  choice: le conseil de
  rationale: Le nom construit עֲצַת peut désigner un conseil, un projet ou un dessein. « Conseil » conserve cette amplitude sans réduire le terme à une stratégie précise.
- source_word: עָנִי
  choice: du pauvre
  rationale: עָנִי désigne une personne pauvre, affligée ou opprimée. « Le pauvre » est naturel ici et laisse entendre sa vulnérabilité sociale.
- source_word: תָבִישׁוּ
  choice: vous couvrez de honte
  rationale: Cette forme hiphil à la deuxième personne du pluriel signifie faire honte ou couvrir de honte. La formulation retenue préserve l’adresse au pluriel et la valeur causative.
- source_word: כִּי
  choice: parce que
  rationale: כִּי est compris dans son sens causal, conformément à la relation syntaxique la plus directe entre les deux propositions, sans expliciter davantage la logique de l’accusation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: מַחְסֵהוּ
  choice: son refuge
  rationale: מַחְסֶה désigne un refuge ou un abri, et le suffixe masculin singulier renvoie au pauvre. « Son refuge » conserve clairement la métaphore de protection.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom divin plutôt que de lui substituer un titre.
- issue: Lien logique introduit par כִּי
  choice: parce que
  alternative: mais
  rationale: 'Le texte massorétique emploie כִּי, qui peut exprimer la cause. Cette lecture maintient la tension du texte : les destinataires couvrent de honte le conseil du pauvre précisément alors que Yahweh est son refuge, sans transformer silencieusement la relation en opposition.'
translation_notes:
  register: Français international actuel, sobre et digne. « Vous couvrez de honte » rend la valeur causative tout en conservant la deuxième personne du pluriel ; la légère étrangeté de « le conseil du pauvre » préserve l’ambiguïté de l’hébreu, explicitée en note.
