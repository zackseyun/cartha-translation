revisions:
- from: Tous ceux qui commettent le mal ne comprennent-ils donc rien, eux qui dévorent mon peuple comme on mange du pain[a] et qui n’invoquent pas Yahweh ?
  to: Tous ceux qui font le mal ne savent-ils pas, eux qui dévorent mon peuple comme ils mangent du pain[a] et n’invoquent pas Yahweh ?
  rationale: La révision remplace une formulation qui intensifiait le sens de « savoir » par une question rhétorique française fidèle à l’hébreu. Elle conserve l’unité syntaxique, la métaphore de dévoration, le caractère ordinaire de l’image du pain, et l’invocation de Yahweh, tout en rendant plus nettement le même sujet dans les deux actions de manger.
