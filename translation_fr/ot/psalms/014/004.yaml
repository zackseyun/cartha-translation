source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ כָּל פֹּ֪עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם יְ֝הוָ֗ה לֹ֣א קָרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/004.yaml
  text: Do not all the workers of wickedness know—those who eat up my people as they eat bread[a], and do not call on Yahweh?
translation:
  language: fr
  text: Tous ceux qui font le mal ne savent-ils pas, eux qui dévorent mon peuple comme ils mangent du pain[a] et n’invoquent pas Yahweh ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mangeurs de mon peuple, ils mangent du pain ». Le français explicite par « comme » la comparaison que l’hébreu exprime par juxtaposition.'
    reason: La note signale l’image et l’ajout comparatif nécessaire à une formulation française naturelle, tout en respectant le parallélisme du texte hébreu.
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: ne comprennent-ils donc rien
  rationale: La tournure interrogative הֲלֹא appelle normalement une réponse affirmative. Dans ce contexte, « ne comprennent-ils donc rien » exprime naturellement en français le reproche portant sur l’aveuglement moral des malfaiteurs, sans en faire une simple absence d’information.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: tous ceux qui commettent le mal
  rationale: Cette formulation actuelle et digne restitue le participe « ceux qui font » et la valeur morale de אָוֶן, sans recourir aux termes plus archaïques « ouvriers d’iniquité ».
- source_word: אֹכְלֵי עַמִּי
  choice: eux qui dévorent mon peuple
  rationale: « Dévorent » conserve la métaphore violente de l’action de manger tout en étant plus idiomatique en français que « mangent mon peuple ».
- source_word: אָכְלוּ לֶחֶם
  choice: comme on mange du pain
  rationale: L’hébreu juxtapose littéralement l’action de manger le peuple et celle de manger du pain. L’ajout de « comme » rend explicite la comparaison implicite et « on » souligne son caractère ordinaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de préserver la référence explicite au tétragramme.
- source_word: לֹא קָרָאוּ
  choice: n’invoquent pas
  rationale: Avec le nom divin pour complément, קרא désigne couramment le fait de faire appel à Dieu, notamment dans la prière ou le culte. Le présent convient à cette description générale.
theological_decisions:
- issue: Portée de la question rhétorique
  choice: La question englobe la caractérisation des malfaiteurs qui dévorent le peuple et n’invoquent pas Yahweh.
  alternative: Limiter la question à « ne comprennent-ils donc rien ? », puis présenter les deux actions dans une phrase déclarative distincte.
  rationale: L’hébreu permet une lecture continue de tout le verset comme question rhétorique. La phrase française conserve cette unité sans supprimer l’ambiguïté fondamentale du reproche.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte source emploie directement le nom propre divin. Sa transcription permet de conserver cette distinction par rapport aux titres divins.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Commettent le mal » évite l’archaïsme de « commettent l’iniquité » ; « dévorent » maintient la force poétique de l’image. La syntaxe en une seule question conserve la tension rhétorique du verset.
