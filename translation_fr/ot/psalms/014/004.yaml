review_pass:
  verdict: revise
  source_fidelity: 'La question rhétorique, les malfaiteurs, l’image alimentaire, l’invocation de Yahweh et le nom divin sont bien conservés. Toutefois, « ne comprennent-ils donc rien » va au-delà de יָדְעוּ (« ne savent-ils pas ? ») : « rien » universalise et renforce l’ignorance, tandis que le verbe hébreu exprime d’abord le savoir / la reconnaissance. La comparaison est correctement explicitée, mais « comme ils mangent du pain » préserve mieux le parallèle des sujets que l’impersonnel « comme on mange du pain ».'
  naturalness: La phrase est fluide et relève d’un français moderne soutenu. « Tous ceux qui font le mal » est naturel et direct. « Ne savent-ils pas » rend la formule rhétorique sans alourdissement ni interprétation supplémentaire.
  terminology: « Ceux qui font le mal » restitue naturellement פֹּעֲלֵי אָוֶן sans archaïsme. « Dévorent mon peuple » maintient la violence de la métaphore. « Invoquent Yahweh » convient à קרא avec le nom divin, et « Yahweh » préserve explicitement le tétragramme.
  issues:
  - severity: medium
    issue: « ne comprennent-ils donc rien » surinterprète יָדְעוּ
    rationale: Le texte hébreu demande littéralement si les artisans du mal « ne savent pas ». Le choix de « comprennent » est défendable dans le contexte, mais l’ajout de « rien » transforme le reproche en ignorance totale, nuance non exprimée par le texte source.
  - severity: low
    issue: Le pronom impersonnel « on » atténue le parallélisme verbal
    rationale: Dans la comparaison implicite, les mêmes malfaiteurs sont ceux qui mangent le peuple et qui mangent le pain. « Comme ils mangent du pain » rend ce parallélisme plus explicitement sans ajouter de sens.
  revised_text: Tous ceux qui font le mal ne savent-ils pas, eux qui dévorent mon peuple comme ils mangent du pain[a] et n’invoquent pas Yahweh ?
