source:
  edition: WLC
  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/000.yaml
  text: 'For the choir director[a]. Of David.


    The fool says in his heart, “There is no God.”

    They are corrupt; they do abominable deeds[c][b].

    There is none who does good.'
translation:
  language: fr
  text: 'Au chef de chœur[a]. De David[b].


    L’insensé dit dans son cœur :

    « Il n’y a pas de Dieu. »

    Ils[c] se sont corrompus, ils ont commis des actes abominables ;

    personne ne fait le bien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur de la musique » ou « Au maître de chant ».
    reason: lexical_alternative
  - marker: b
    text: Dans le titre du psaume, « De David » peut aussi signifier « par David » ou « pour David ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe du singulier (« l’insensé ») au pluriel (« ils »), allant d’un individu représentatif à la catégorie de personnes qu’il représente.
    reason: textual_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Rend naturellement le titre fonctionnel hébreu, probablement adressé au responsable de l’exécution musicale, tout en signalant en note d’autres formulations possibles.
- source_word: נָבָל
  choice: L’insensé
  rationale: Désigne ici une personne moralement et spirituellement déraisonnable, plutôt qu’une personne simplement dépourvue d’intelligence.
- source_word: בְּלִבּוֹ
  choice: dans son cœur
  rationale: Conserve l’image hébraïque du cœur comme siège de la pensée, de la volonté et de la conviction intérieure.
- source_word: הִשְׁחִיתוּ
  choice: se sont corrompus
  rationale: Exprime l’altération morale indiquée par le verbe hébreu sans ajouter de cause non précisée.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: ont commis des actes abominables
  rationale: Formulation française naturelle qui préserve le jugement moral très fort du texte sur leur conduite.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: personne ne fait le bien
  rationale: Rend l’affirmation générale et absolue de manière simple et directe.
theological_decisions:
- issue: Portée de « Il n’y a pas de Dieu »
  choice: Conserver l’affirmation directe sans l’expliciter
  alternative: « Dieu n’existe pas » ou « Dieu n’intervient pas »
  rationale: L’hébreu permet une déclaration brève dont la portée exacte ne doit pas être réduite par une paraphrase interprétative.
- issue: Passage du singulier au pluriel
  choice: Maintenir « L’insensé » puis « Ils » et expliquer le changement en note
  alternative: Uniformiser tout le passage au singulier ou au pluriel
  rationale: Le changement grammatical est réel et fait passer de l’individu représentatif au groupe qu’il incarne.
translation_notes:
  register: Français international moderne, sobre et digne. La disposition poétique met en relief la déclaration de l’insensé et la réponse collective du verset. Les images hébraïques usuelles, notamment « dans son cœur », sont conservées lorsqu’elles restent immédiatement compréhensibles.
