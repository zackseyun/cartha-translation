  text: בָּ֘ר֤וּךְ יְהוָ֨ה אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל מֵֽ֭/הָ/עוֹלָם וְ/עַ֥ד הָ/עוֹלָ֗ם אָ֘מֵ֥ן וְ/אָמֵֽן׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: fr
  text: Béni soit Yahweh, le Dieu d’Israël, depuis toujours et pour toujours ! Amen et amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Cette formule française naturelle et digne rend le participe passif employé comme formule liturgique de bénédiction et conserve la valeur doxologique de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Le syntagme construit signifie directement « Dieu d’Israël » ; l’article défini est naturel en français dans cette formule.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: depuis toujours et pour toujours
  rationale: Cette expression idiomatique française rend les deux perspectives de la formule hébraïque — depuis le passé sans limite jusqu’à l’avenir sans limite — sans réduire עוֹלָם à un simple « âge ».
- source_word: אָמֵן וְאָמֵן
  choice: Amen et amen
  rationale: La translittération traditionnelle conserve l’affirmation liturgique, et la répétition explicite en maintient l’insistance.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement et évite de remplacer silencieusement le nom par un titre.
- issue: Portée temporelle de מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: depuis toujours et pour toujours
  alternative: d’éternité en éternité ; depuis l’éternité et jusque dans l’éternité
  rationale: La formule exprime une durée sans bornes orientée du passé vers l’avenir. Le rendu choisi conserve cette totalité temporelle dans un français actuel sans trancher philosophiquement la nature de l’éternité divine.
translation_notes:
  register: Français international moderne, liturgique et digne. La ponctuation exclamative fait entendre la doxologie sans ajouter de contenu ; la répétition finale reste volontairement solennelle.
