id: PSA.41.10
reference: Psalms 41:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: fr
  text: Mais toi, Yahvé, fais-moi grâce et relève-moi, pour que je leur rende la pareille.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et je leur rendrai la pareille ». Le cohortatif hébreu peut exprimer ici le but ou le résultat (« pour que… »), ou une résolution faisant suite aux demandes.
    reason: Ambiguïté grammaticale du cohortatif hébreu.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction jointe au pronom indépendant marque ici le contraste avec les ennemis et l’ami perfide évoqués auparavant. « Mais toi » rend naturellement cette opposition en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est translittéré sous sa forme française usuelle plutôt que remplacé par un titre comme « le Seigneur ».
- source_word: חָנֵּנִי
  choice: fais-moi grâce
  rationale: Le verbe חנן exprime l’octroi bienveillant d’une faveur. Cette formulation conserve la notion de grâce sans la réduire à la seule compassion.
- source_word: וַהֲקִימֵנִי
  choice: et relève-moi
  rationale: Le hiphil de קום signifie littéralement faire se lever ou remettre debout. Dans le contexte de la maladie et de l’oppression, « relève-moi » garde l’image concrète tout en permettant le sens de restauration.
- source_word: וַאֲשַׁלְּמָה
  choice: pour que je leur rende la pareille
  rationale: Le piel de שלם exprime ici l’idée de rendre ou de rétribuer. Après les demandes précédentes, le cohortatif peut indiquer le but ou le résultat; « pour que » rend cette relation, tandis que « rendre la pareille » reste naturel en français.
- source_word: לָהֶם
  choice: leur
  rationale: La préposition ל marque les destinataires de la rétribution; le pronom indirect « leur » convient à l’expression française choisie.
theological_decisions:
- issue: Faut-il atténuer la rétribution demandée par le psalmiste afin d’éviter la portée imprécatoire?
  choice: Conserver « leur rende la pareille »
  alternative: « me défendre contre eux » ou « les traiter comme ils le méritent »
  rationale: Le verbe שלם désigne directement une action de rendre ou de rétribuer. Une formulation adoucie effacerait la tension judiciaire du texte, tandis que « comme ils le méritent » ajouterait une précision absente de l’hébreu.
- issue: Valeur du cohortatif וַאֲשַׁלְּמָה après les deux requêtes
  choice: 'Le rendre comme un but ou un résultat: « pour que je leur rende la pareille »'
  alternative: 'Le comprendre comme une résolution successive: « et je leur rendrai la pareille »'
  rationale: La morphologie permet les deux lectures. Le texte principal adopte la relation finale qui s’enchaîne naturellement avec les impératifs, et la note conserve l’autre possibilité sans trancher artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, direct et digne. « Fais-moi grâce » conserve la tonalité de supplication; « relève-moi » maintient la métaphore concrète. « Rendre la pareille » est courant et intelligible, tout en préservant la portée potentiellement imprécatoire sans préciser la forme de la rétribution.
