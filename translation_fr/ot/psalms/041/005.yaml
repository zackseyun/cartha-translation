  text: אוֹיְבַ֗/י יֹאמְר֣וּ רַ֣ע לִ֑/י מָתַ֥י יָ֝מ֗וּת וְ/אָבַ֥ד שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/005.yaml
  text: 'My enemies say evil against me: “When will he die and his name perish?”[a][b]'
translation:
  language: fr
  text: 'Mes ennemis disent du mal de moi[a] : « Quand mourra-t-il, et quand son nom disparaîtra-t-il[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tiennent contre moi des propos malveillants ». Littéralement, l’hébreu parle de dire « du mal » à l’égard du psalmiste.'
    reason: lexical_alternative
  - marker: b
    text: La disparition de son « nom » peut évoquer la fin de sa réputation ou de son souvenir, et non simplement la disparition du nom prononcé.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹיְבַי
  choice: Mes ennemis
  rationale: Le nom pluriel avec suffixe de première personne signifie directement « mes ennemis » ; cette formulation est naturelle et conserve toute la force d’hostilité.
- source_word: יֹאמְרוּ
  choice: disent
  rationale: L’imparfait hébreu peut ici décrire une conduite présente ou habituelle ; le présent français convient au contexte poétique.
- source_word: רַע לִי
  choice: du mal de moi
  rationale: Cette tournure française naturelle exprime la parole malveillante dirigée contre le psalmiste, tout en conservant le sens large de רַע, « mal ».
- source_word: מָתַי יָמוּת
  choice: Quand mourra-t-il
  rationale: מָתַי introduit une question temporelle et l’imparfait de מות prend naturellement ici une valeur future, sans transformer explicitement la question en souhait.
- source_word: וְאָבַד שְׁמוֹ
  choice: et quand son nom disparaîtra-t-il
  rationale: Le second « quand » et l’inversion verbale sont ajoutés pour produire une coordination interrogative claire en français. « Son nom » reste explicite, tandis que « disparaîtra » rend אבד sans réduire le sens à la seule réputation ou au seul souvenir.
theological_decisions:
- issue: Portée de la disparition du « nom »
  choice: Conserver « son nom » dans le texte principal
  alternative: Expliciter « son souvenir » ou « sa réputation »
  rationale: Le nom peut englober la réputation et la mémoire d’une personne, mais le texte hébreu dit bien « son nom ». Une note préserve cette richesse sans résoudre indûment l’image.
translation_notes:
  register: Français moderne international, naturel et digne. La formulation garde la question hostile sans la transformer en impératif ou en souhait explicite. La répétition de « quand » clarifie en français que les deux verbes relèvent de la même interrogation.
