source:
  edition: WLC
  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: fr
  text: 'Quant à moi, j’ai dit : « Yahweh, fais-moi grâce ! Guéris mon âme[a], car j’ai péché contre toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « guéris ma vie » ou « guéris-moi » ; le mot hébreu traduit par « âme » peut aussi désigner la vie ou la personne elle-même.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant est explicite et légèrement emphatique ; « Quant à moi » restitue naturellement cette mise en relief en français.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: Le qatal à la première personne rapporte ici la prière prononcée par le psalmiste ; le passé composé est naturel en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: חָנֵּנִי
  choice: fais-moi grâce
  rationale: L’impératif de חנן demande faveur et compassion ; cette formulation conserve l’idée de grâce sans la réduire à la seule pitié.
- source_word: רְפָאָה
  choice: guéris
  rationale: L’impératif de רפא signifie directement « guérir » et laisse ouverte la nature physique, intérieure ou globale de la guérison.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » garde la formulation concrète de l’hébreu, tandis qu’une note signale son étendue sémantique.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de la demande ; « car » convient au registre priant et soutenu.
- source_word: חָטָאתִי
  choice: j’ai péché
  rationale: Le passé composé exprime naturellement en français l’acte confessé dont la portée demeure présente.
- source_word: לָךְ
  choice: contre toi
  rationale: Avec le verbe « pécher », la préposition désigne la personne offensée ; « contre toi » rend clairement cette relation.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; sa translittération préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de « guéris mon âme »
  choice: guéris mon âme
  alternative: guéris-moi / guéris ma vie
  rationale: L’hébreu נפש peut viser la vie intérieure, la vie elle-même ou la personne entière. Le texte principal conserve l’expression hébraïque et la note maintient cette amplitude sans imposer une lecture exclusivement physique ou spirituelle.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation exclamative rend les deux impératifs pressants sans ajouter de contenu ; le vocatif « Yahweh » reste sobre.
