id: PSA.41.3
reference: Psalms 41:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְֽהוָ֗ה יִ֭סְעָדֶ/נּוּ עַל עֶ֣רֶשׂ דְּוָ֑י כָּל מִ֝שְׁכָּב֗/וֹ הָפַ֥כְתָּ בְ/חָלְיֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/003.yaml
  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: fr
  text: Yahweh le soutient sur son lit de souffrance ; dans sa maladie, tu refais entièrement son lit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu retournes tout son lit pendant sa maladie ». Le verbe hébreu signifie littéralement « tourner, retourner, changer » ; ici, l’image évoque probablement les soins apportés au malade alité.'
    reason: alternative lexicale et conservation de l’ambiguïté de l’image hébraïque
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans l’hébreu.
- source_word: יִסְעָדֶנּוּ
  choice: le soutient
  rationale: Le verbe סעד exprime le fait de soutenir une personne affaiblie. Le présent français convient à la valeur générale de l’inaccompli dans ce contexte.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: sur son lit de souffrance
  rationale: Cette expression rend naturellement l’image d’un lit où quelqu’un est retenu par la maladie, sans ajouter de précision absente de l’hébreu.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: entièrement son lit
  rationale: Cette formulation conserve la valeur totalisante de כָּל tout en restant idiomatique avec le verbe « refaire ».
- source_word: הָפַכְתָּ
  choice: tu refais
  rationale: הפך signifie littéralement « tourner, retourner, changer ». Dans la scène d’un malade alité, « refaire son lit » exprime naturellement un geste de soin, tout en signalant en note la formulation plus littérale et l’ambiguïté de l’image.
- source_word: בְחָלְיוֹ
  choice: dans sa maladie
  rationale: La préposition ב indique ici la circonstance dans laquelle l’action a lieu.
theological_decisions:
- issue: Changement de personne dans le verset
  choice: Conserver le passage de la troisième personne (« Yahweh le soutient ») à l’adresse directe (« tu refais »).
  alternative: 'Uniformiser à la troisième personne : « Yahweh le soutient… il refait… »'
  rationale: L’hébreu passe réellement de la parole au sujet de Yahweh à une adresse directe à Yahweh. Ce mouvement poétique et priant ne doit pas être aplani.
- issue: Valeur temporelle des deux verbes
  choice: Employer le présent français pour les deux actions.
  alternative: Employer le futur pour יִסְעָדֶנּוּ et le présent ou le passé pour הָפַכְתָּ.
  rationale: Dans ce contexte sapientiel, l’inaccompli peut exprimer une action caractéristique ou assurée, tandis que l’accompli de la seconde proposition présente vivement l’intervention divine. Le présent français permet de les articuler naturellement sans imposer une chronologie étrangère au verset.
translation_notes:
  register: Français moderne, digne et accessible. « Lit de souffrance » est plus naturel à l’échelle internationale que des termes vieillis comme « couche de douleur ». La répétition de « lit » conserve le parallélisme hébreu, et le point-virgule marque le passage à l’adresse directe.
