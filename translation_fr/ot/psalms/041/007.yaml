    issue: Ajout de « qui doit » dans « le mal qui doit m’arriver ».
    rationale: Le texte hébreu dit qu’ils pensent/projettent du mal à son égard ; il n’affirme ni que ce mal arrivera, ni qu’il est inévitable. Cette formulation dépasse la portée du texte source.
