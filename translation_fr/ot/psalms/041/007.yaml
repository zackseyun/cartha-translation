  naturalness: « Ensemble, tous ceux qui me haïssent chuchotent contre moi » est naturel dans un registre biblique moderne et conserve l’ordre emphatique. « Contre moi, ils projettent de me faire du mal » est idiomatique en français tout en gardant la répétition accusatrice de « contre moi ».
  terminology: « Chuchotent » convient à יתלחשו. « Projettent de me faire du mal » rend de manière naturelle חשבו רעה לי, sans surinterpréter le verbe comme une conspiration formelle ni réduire רעה à un malheur prédestiné.
  issues:
