  yaml_path: translation/ot/psalms/041/007.yaml
  text: Together all who hate me whisper against me[b][a]; against me they devise evil for me.
translation:
  language: fr
  text: Ensemble, tous ceux qui me haïssent chuchotent contre moi[a] ; contre moi, ils projettent de me faire du mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à mon sujet », ici et dans la proposition suivante ; la préposition hébraïque peut indiquer soit une direction hostile, soit le sujet des paroles ou des pensées.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils méditent contre moi le mal ». L’hébreu associe un verbe exprimant la pensée ou le projet au mot « mal » ; la formulation peut aussi se comprendre comme un projet de mal contre le psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחַד
  choice: ensemble
  rationale: L’adverbe exprime une action collective et concertée ; « ensemble » est naturel et concis.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte hostile, la préposition עַל a vraisemblablement une valeur adversative, tout en pouvant aussi indiquer le sujet des propos ou des pensées.
- source_word: יִתְלַחֲשׁוּ
  choice: chuchotent
  rationale: La forme réfléchie/réciproque suggère des propos échangés à voix basse ; « chuchotent » garde l’image sans expliciter excessivement une conspiration.
- source_word: כָּל שֹׂנְאַי
  choice: tous ceux qui me haïssent
  rationale: Cette formulation naturelle conserve la force verbale du participe de שׂנא.
- source_word: יַחְשְׁבוּ
  choice: méditent
  rationale: חשב peut signifier penser, calculer ou projeter. Avec רָעָה et dans ce contexte hostile, « méditent » exprime une intention réfléchie sans imposer l’idée plus précise d’un complot formel.
- source_word: רָעָה
  choice: le mal
  rationale: « Le mal » préserve l’étendue morale et nuisible du nom hébreu, qui peut aussi désigner un malheur ou un dommage.
- source_word: לִי
  choice: qui doit m’arriver
  rationale: Le datif לִי désigne la personne visée par le mal projeté. Cette tournure française rend la destination hostile sans produire l’expression peu naturelle « méditer du mal pour moi » ni confondre entièrement לִי avec עָלַי.
