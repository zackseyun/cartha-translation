source:
  edition: WLC
  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: fr
  text: Yahweh le gardera et le maintiendra en vie[a] ; on le dira heureux dans le pays[b]. Ne le livre pas au désir de ses ennemis[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gardera en vie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il sera béni dans le pays ». Le verbe hébreu peut exprimer le fait d’être déclaré heureux ou, plus généralement, d’être béni.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « à l’âme de ses ennemis » ; ici, « âme » peut désigner leur désir ou leur volonté.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: יִשְׁמְרֵהוּ
  choice: le gardera
  rationale: שׁמר signifie garder, protéger ou veiller sur quelqu’un ; « gardera » reste concis et se distingue du verbe suivant.
- source_word: וִיחַיֵּהוּ
  choice: et le maintiendra en vie
  rationale: Le piel de חיה exprime ici le fait de conserver en vie ; cette formulation naturelle rend clairement le sens causatif.
- source_word: יאשר
  choice: il sera déclaré heureux
  rationale: La forme peut exprimer le fait de dire quelqu’un heureux ou de le tenir pour tel. « Déclaré heureux » conserve cette nuance sans imposer l’idée d’une bénédiction directement accordée.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: אֶרֶץ peut désigner la terre, un territoire ou le pays ; dans ce contexte, « dans le pays » est naturel tout en laissant ouverte la portée exacte.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: Puisses-tu ne pas le livrer
  rationale: La deuxième personne et la valeur jussive marquent une prière directement adressée à Yahweh ; « Puisses-tu ne pas » préserve le changement de personne et la nuance de supplication.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: au désir de ses ennemis
  rationale: נֶפֶשׁ désigne ici idiomatiquement le désir, la volonté ou l’appétit, non l’âme au sens immatériel moderne.
theological_decisions:
- issue: Passage d’une déclaration à une prière adressée directement à Yahweh
  choice: 'Les deux premières propositions sont déclaratives, puis la dernière devient une supplication à la deuxième personne : « Puisses-tu ne pas… »'
  alternative: 'Uniformiser à la troisième personne : « il ne le livrera pas… »'
  rationale: תִּתְּנֵהוּ est une forme de deuxième personne masculine singulière. Le changement d’adresse appartient au texte hébreu et ne doit pas être lissé.
- issue: Sens de יאשר
  choice: « il sera déclaré heureux »
  alternative: « il sera béni »
  rationale: Le choix principal conserve la possibilité que d’autres le disent heureux, tandis que l’alternative peut suggérer plus directement une action divine de bénédiction.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation sépare nettement la déclaration de la supplication afin de rendre naturel le brusque passage hébreu de la troisième à la deuxième personne. « Heureux » convient mieux que « bienheureux » au registre courant contemporain.
