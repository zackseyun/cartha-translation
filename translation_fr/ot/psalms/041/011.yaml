source:
  edition: WLC
  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: fr
  text: 'À ceci, je sais que tu prends plaisir en moi : mon ennemi ne pousse pas de cri de victoire contre moi[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne triomphe pas de moi ». Le verbe hébreu évoque plus littéralement le fait de pousser un cri, ici probablement un cri de victoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: À ceci
  rationale: La préposition ב avec le démonstratif introduit l'indice auquel le psalmiste reconnaît la disposition de Dieu. « À ceci » exprime naturellement cette valeur probante en français.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait hébreu exprime ici une connaissance acquise et actuellement assurée par le fait évoqué; le présent français convient au contexte.
- source_word: כִּי חָפַצְתָּ בִּי
  choice: que tu prends plaisir en moi
  rationale: חפץ ב désigne le fait de prendre plaisir à quelqu'un ou de lui être favorable. Cette formulation conserve l'idée de plaisir sans préciser davantage le fondement de l'approbation divine.
- source_word: כִּי
  choice: ':'
  rationale: Le second כִּי introduit l'indice ou la raison de cette certitude. Les deux-points rendent clairement ce rapport sans alourdir la phrase par une répétition de « parce que ».
- source_word: לֹא יָרִיעַ
  choice: ne pousse pas de cri de victoire
  rationale: Le hiphil de רוע évoque ici un cri retentissant, vraisemblablement celui du vainqueur. La traduction garde cette image sonore plutôt que de la réduire au seul verbe « triompher ».
- source_word: אֹיְבִי
  choice: mon ennemi
  rationale: Le singulier et le suffixe de première personne sont conservés.
- source_word: עָלָי
  choice: sur moi
  rationale: Dans le contexte d'un cri victorieux, עַל marque l'exultation exercée aux dépens du psalmiste; « sur moi » conserve au plus près la construction hébraïque.
theological_decisions:
- issue: La faveur divine déduite de l'échec de l'ennemi
  choice: Le psalmiste reconnaît que Dieu prend plaisir en lui au fait que son ennemi ne peut pousser sur lui un cri de victoire.
  alternative: Formuler plus fortement une déclaration générale de justice, d'approbation ou de justification devant Dieu.
  rationale: Le verset relie bien le plaisir de Dieu à l'absence de victoire ennemie, mais il n'en indique pas le fondement théologique. La traduction préserve ce lien sans importer une doctrine plus développée.
translation_notes:
  register: Français moderne, digne et accessible. « Prendre plaisir en moi » est légèrement soutenu mais naturel dans un psaume. L'image concrète du cri de victoire est maintenue, avec une variante plus idiomatique en note.
