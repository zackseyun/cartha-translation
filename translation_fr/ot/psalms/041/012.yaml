id: PSA.41.12
reference: Psalms 41:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: fr
  text: Mais moi, tu m’as soutenu dans mon intégrité[a], et tu m’as placé devant toi[b] pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de mon intégrité »; le terme peut aussi se traduire par « droiture » ou « conduite irréprochable ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « devant ta face », c’est-à-dire « en ta présence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le pronom indépendant, joint à la conjonction, marque ici un contraste avec ce qui précède. « Mais moi » le rend avec concision et naturel.
- source_word: בְּתֻמִּי
  choice: dans mon intégrité
  rationale: Le terme תֹּם/תֻּם évoque l’intégrité, la droiture ou une conduite irréprochable. « Intégrité » conserve l’affirmation morale sans suggérer nécessairement une innocence absolue; la préposition peut aussi recevoir une nuance causale, signalée en note.
- source_word: תָּמַכְתָּ בִּי
  choice: tu m’as soutenu
  rationale: תמך avec ב exprime l’action de soutenir ou de maintenir quelqu’un. « Soutenu » restitue naturellement cette idée en français.
- source_word: וַתַּצִּיבֵנִי
  choice: tu m’as placé
  rationale: La forme causative de נצב signifie placer, faire tenir ou établir. « Placé » reste direct et évite d’ajouter la nuance plus interprétative d’un établissement durable.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: L’expression signifie littéralement « devant ta face » et, idiomatiquement, « en ta présence ». « Devant toi » conserve l’image spatiale tout en restant naturel en français.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: עוֹלָם désigne ici une durée indéfinie et durable. « Pour toujours » est l’équivalent français courant adapté au registre du psaume.
theological_decisions:
- issue: Portée de l’affirmation בְּתֻמִּי concernant l’intégrité du psalmiste
  choice: Le psalmiste affirme son intégrité ou sa droiture, sans que le verset affirme explicitement une absence absolue de péché ni un mérite qui obligerait Dieu.
  alternative: Comprendre le propos comme une revendication d’innocence absolue ou comme l’affirmation que la faveur divine est gagnée par la perfection morale.
  rationale: Le mot hébreu désigne la complétude morale, l’intégrité ou une conduite irréprochable. La traduction maintient cette réelle revendication de droiture sans résoudre au-delà du texte la tension théologique qu’elle comporte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle; « devant toi » préserve l’image source sans employer le calque peu idiomatique « devant ta face » dans le texte principal.
