id: PSA.41.1
reference: Psalms 41:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: fr
  text: Heureux celui qui se soucie du pauvre[a][b] ! Au jour du malheur[c], Yahweh le délivrera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « agit avec sagesse envers le pauvre ». Le verbe hébreu peut exprimer une attention réfléchie qui conduit à agir avec discernement.
    reason: lexical_alternative
  - marker: b
    text: Ou « du faible » ou « du démuni ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « au jour du mal » ; ici, le « mal » désigne le malheur ou la calamité, non le mal moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule française naturelle introduit une béatitude sapientielle et exprime la condition enviable de la personne décrite, sans la réduire à une émotion passagère.
- source_word: מַשְׂכִּיל אֶל
  choice: celui qui se soucie de
  rationale: Le hiphil de שׂכל avec אֶל exprime une attention réfléchie et avisée orientée vers quelqu’un. « Se soucie de » rend naturellement cette sollicitude attentive, tandis que la note conserve explicitement la nuance d’agir avec sagesse.
- source_word: דָּל
  choice: pauvre
  rationale: דָּל peut désigner une personne pauvre, faible ou démunie. « Pauvre » est ici le sens direct le plus courant, les autres nuances étant signalées en note.
- source_word: בְּיוֹם רָעָה
  choice: Au jour du malheur
  rationale: רָעָה désigne ici l’adversité ou la calamité plutôt que le mal moral. « Au jour du malheur » conserve l’image temporelle hébraïque dans un français clair et digne.
- source_word: יְמַלְּטֵהוּ
  choice: le délivrera
  rationale: Le piel de מלט exprime le fait d’arracher quelqu’un au danger. « Délivrera » garde la force de la promesse et le singulier représentatif du texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
theological_decisions:
- issue: Portée du singulier masculin dans la promesse
  choice: Conserver le singulier représentatif avec « celui » et « le »
  alternative: 'Employer un pluriel épicène : « ceux… les »'
  rationale: L’hébreu présente une personne représentative au singulier et reprend celle-ci par un suffixe masculin singulier. Le français maintient ce nombre sans affirmer que la promesse serait réservée aux hommes.
- issue: Nature de la promesse de délivrance
  choice: Traduire directement « Yahweh le délivrera »
  alternative: Atténuer en « Yahweh pourra le délivrer » ou expliciter qu’il s’agit seulement d’un principe général
  rationale: Le verset formule sans réserve une promesse dans le cadre poétique et sapientiel du psaume. La traduction en préserve la force sans en faire explicitement une formule de prospérité absolue ni l’affaiblir par un ajout interprétatif.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure de la béatitude, le singulier représentatif et l’image du « jour du malheur », tout en rendant idiomatiquement l’attention avisée portée à la personne vulnérable.
