  register: Français international moderne, sobre et poétique. Le parallélisme entre la parole trompeuse, l’accumulation intérieure du mal et sa divulgation publique est conservé. La dernière proposition privilégie une expression française naturelle, avec une note signalant le sens littéral et l’ambiguïté de l’objet.
