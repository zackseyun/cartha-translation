  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: fr
  text: Et s’il vient me voir[a], il tient des propos trompeurs ; son cœur amasse le mal en lui-même ; lorsqu’il sort[b], il parle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vient pour voir » ; l’objet « me » est sous-entendu par le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il sort dehors », c’est-à-dire « il va à l’extérieur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il parle ». L’objet n’est pas exprimé en hébreu ; il peut renvoyer au mal conçu intérieurement ou aux propos trompeurs.'
    reason: ambiguity
lexical_decisions:
- source_word: וְאִם בָּא לִרְאוֹת
  choice: Et s’il vient me voir
  rationale: Conserve le lien avec le verset précédent et la valeur conditionnelle. L’objet « me », implicite en hébreu, est fourni par le contexte ; « venir me voir » est naturel en français sans réduire nécessairement la venue à une visite bienveillante.
- source_word: שָׁוְא יְדַבֵּר
  choice: il tient des propos trompeurs
  rationale: שָׁוְא peut évoquer le vide, la fausseté ou la tromperie. Dans le contexte d’un visiteur hostile, cette formulation exprime une parole mensongère ou insincère tout en restant idiomatique.
- source_word: לִבּוֹ
  choice: son cœur
  rationale: Maintient l’image hébraïque du cœur comme siège des pensées, des intentions et de la volonté.
- source_word: יִקְבָּץ אָוֶן לוֹ
  choice: amasse le mal en lui-même
  rationale: « Amasser » rend l’image d’une accumulation intérieure. אָוֶן désigne ici vraisemblablement un mal moral et nuisible, tandis que לוֹ est rendu dans un sens réfléchi sans attribuer artificiellement l’action au cœur comme sujet grammatical.
- source_word: יֵצֵא לַחוּץ
  choice: une fois dehors
  rationale: Rend directement l’idée de sortir et de se trouver à l’extérieur, sans préciser indûment qu’il s’agit de la rue.
- source_word: יְדַבֵּר
  choice: il le répand
  rationale: Le verbe signifie littéralement « il parle ». Ici, le français « répandre » exprime naturellement la divulgation à l’extérieur du mal ou des propos préparés intérieurement ; le pronom « le » laisse à son antécédent une certaine ambiguïté.
