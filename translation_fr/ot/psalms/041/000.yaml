lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, cette forme avec לְ désigne vraisemblablement le responsable de l’exécution musicale. « Au chef de chœur » est une formule française claire, actuelle et consacrée.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme de genre standard dans les suscriptions; « psaume » est ici l’équivalent français le plus précis et naturel.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, לְ peut marquer l’auteur, l’association, l’appartenance ou la dédicace. « de David » conserve mieux cette latitude que des formulations plus explicites.
theological_decisions:
- issue: Interprétation de la suscription davidique
  choice: de David
  alternative: par David ou pour David
  rationale: La relation exprimée par l’hébreu לְדָוִד demeure ouverte. Le texte principal conserve la formulation traditionnelle et souple, tandis que la note signale les principales interprétations possibles sans trancher.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève respecte la forme d’une suscription. Le marqueur [a] est placé après « David », auquel porte la note.
