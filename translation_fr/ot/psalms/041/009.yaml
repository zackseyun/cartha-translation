source:
  edition: WLC
  text: גַּם אִ֤ישׁ שְׁלוֹמִ֨/י אֲשֶׁר בָּטַ֣חְתִּי ב֭/וֹ אוֹכֵ֣ל לַחְמִ֑/י הִגְדִּ֖יל עָלַ֣/י עָקֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/009.yaml
  text: Even my close friend[a], in whom I trusted, who ate my bread[d][c][b], has lifted up his heel against me.
translation:
  language: fr
  text: Même mon ami proche[a], en qui j’avais confiance, qui mangeait mon pain[b], a levé le talon contre moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme de ma paix », expression désignant quelqu’un qui vivait en paix avec moi, c’est-à-dire un ami proche ou un allié de confiance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui partageait mon pain ». L’hébreu dit littéralement « qui mangeait mon pain », image de la communion de table et de la confiance.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « a rendu grand le talon contre moi ». Cette expression hébraïque évoque un acte de trahison ou d’hostilité. Ce verset est cité en Jean 13.18 à propos de la trahison de Jésus par Judas.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Marque ici une addition emphatique : la trahison vient non seulement d’adversaires, mais même d’un proche.'
- source_word: אִישׁ שְׁלוֹמִי
  choice: mon ami proche
  rationale: 'Littéralement « l’homme de ma paix » : expression désignant une personne en paix avec le locuteur, donc un ami proche ou un allié de confiance.'
- source_word: אֲשֶׁר בָּטַחְתִּי בוֹ
  choice: en qui j’avais confiance
  rationale: Conserve la construction personnelle de בטח ב et exprime la confiance placée en cet ami; l’imparfait français convient à l’état antérieur sur lequel tranche la trahison.
- source_word: אוֹכֵל לַחְמִי
  choice: qui mangeait mon pain
  rationale: Préserve l’image concrète du texte hébreu et rend naturellement le participe, avec sa nuance de communion de table et de confiance durable.
- source_word: הִגְדִּיל עָלַי עָקֵב
  choice: a levé le talon contre moi
  rationale: Restitue l’image corporelle et la valeur hostile de l’expression hébraïque sans la réduire à une paraphrase abstraite.
theological_decisions:
- issue: Résonance messianique ou typologique de la trahison, reprise en Jean 13.18
  choice: Traduire d’abord selon la situation propre au psaume et signaler la reprise johannique en note.
  alternative: Formuler le texte principal selon la tradition de citation du Nouveau Testament.
  rationale: Le verset décrit d’abord la trahison subie par le psalmiste. La reprise en Jean est pertinente pour la lecture canonique, mais ne doit pas imposer rétrospectivement une interprétation explicite au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé « j’avais confiance » met en relief la confiance antérieure brisée par l’action accomplie « a levé ». L’image inhabituelle du talon est conservée afin de préserver la force poétique, l’ambiguïté idiomatique et la résonance canonique.
