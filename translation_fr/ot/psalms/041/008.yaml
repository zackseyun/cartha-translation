  text: דְּֽבַר בְּ֭לִיַּעַל יָצ֣וּק בּ֑/וֹ וַ/אֲשֶׁ֥ר שָׁ֝כַ֗ב לֹא יוֹסִ֥יף לָ/קֽוּם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: fr
  text: Un mal destructeur[a] s’est abattu sur lui ; une fois couché, il ne se relèvera plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une affaire infâme pèse sur lui » ou « Une accusation malveillante a été portée contre lui ». L’expression hébraïque est difficile et peut évoquer soit un mal destructeur, soit une accusation pernicieuse.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: une chose malfaisante
  rationale: L’expression condensée peut désigner aussi bien un mal destructeur qu’une accusation pernicieuse. Cette formulation en préserve l’ambiguïté sans faire de « Bélial » un nom propre.
- source_word: יָצוּק
  choice: s’est déversée
  rationale: Le verbe évoque d’abord ce qui est versé ou coulé. Le passé composé convient ici au parfait hébreu et conserve l’image, sans imposer le sens dérivé « s’est attachée ».
- source_word: בּוֹ
  choice: sur lui
  rationale: Avec l’image de quelque chose qui se déverse, « sur lui » est idiomatique et rend naturellement la préposition hébraïque.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: maintenant qu’il est couché
  rationale: La tournure relie son état présent à l’attente malveillante exprimée ensuite. « Est couché » garde l’image littérale, qui peut évoquer l’alitement sans l’expliciter.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: il ne se relèvera plus
  rationale: Cette expression idiomatique signifie qu’il ne se lèvera pas de nouveau, avec la possible implication qu’il ne guérira pas. « Se relèvera » garde cette double portée.
theological_decisions:
- issue: Nature de la « chose malfaisante »
  choice: Préserver l’ambiguïté entre un mal qui frappe la personne et une accusation destructrice portée contre elle.
  alternative: « Une maladie incurable s’est emparée de lui » ou « Une accusation infâme pèse sur lui ».
  rationale: L’hébreu est difficile et ne permet pas de trancher sûrement entre l’affliction et l’accusation. La traduction ne précise donc ni maladie, ni malédiction, ni calomnie.
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve la gravité poétique du verset et son ambiguïté essentielle, tout en évitant un calque inutilement obscur.
