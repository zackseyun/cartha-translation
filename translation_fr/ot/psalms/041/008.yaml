  source_fidelity: 'Le sens fondamental est bien rendu : une réalité maligne atteint l’homme, et son état couché annonce qu’il ne se relèvera pas. Toutefois, « maintenant que » interprète inutilement le lien וַאֲשֶׁר comme une conséquence temporelle explicite, tandis que le parfait שָׁכַב se rend plus sobrement par « une fois couché ».'
  naturalness: '« Une chose malfaisante s’est déversée sur lui » est compréhensible, mais peu naturel en français : « chose » et « se déverser » s’associent maladroitement dans ce contexte. « Un mal destructeur s’est abattu sur lui » est idiomatique, grave et conserve l’indétermination entre une affliction et, par extension explicitée en note, une accusation nuisible.'
  terminology: « Mal destructeur » rend de manière accessible la force négative de דְּבַר בְּלִיַּעַל sans transformer Bélial en nom propre ni préciser indûment une maladie, une malédiction ou une calomnie. « Ne se relèvera plus » rend correctement לֹא יוֹסִיף לָקוּם.
