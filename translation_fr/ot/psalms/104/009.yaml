id: PSA.104.9
reference: Psalms 104:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: fr
  text: Tu as fixé une limite qu’elles ne franchiront pas[a] ; elles ne reviendront pas couvrir la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une frontière qu’elles ne dépasseront pas ».
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire que les eaux ne reviendront pas couvrir la terre.
    reason: cross_reference
lexical_decisions:
- source_word: גְּבוּל
  choice: une limite
  rationale: Le nom désigne une limite fixée. « Limite » est naturel en français et convient à la frontière imposée aux eaux.
- source_word: שַׂמְתָּ
  choice: tu as fixé
  rationale: Le verbe שׂוּם signifie « placer, établir ». Avec « limite », « fixer » forme une expression française idiomatique.
- source_word: בַּל
  choice: ne… pas
  rationale: La particule nie ici les formes verbales qui suivent et exprime la contrainte imposée aux eaux.
- source_word: יַעֲבֹרוּן
  choice: elles ne franchiront pas
  rationale: Le verbe עבר signifie « passer, franchir ». Le futur français rend naturellement la permanence de la limite sans ajouter explicitement une idée d’interdiction.
- source_word: יְשׁוּבוּן
  choice: elles ne reviendront pas
  rationale: Le verbe שוב signifie « revenir, retourner ». Le choix conserve le mouvement de retour exprimé par l’hébreu.
- source_word: לְכַסּוֹת
  choice: couvrir
  rationale: L’infinitif de כסה signifie « couvrir ». Cette traduction reste proche de l’hébreu et préserve l’imagerie cosmique sans expliciter « inonder ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans le cadre cosmique du psaume, « la terre » convient mieux que le sens local possible « le pays ».
theological_decisions:
- issue: Référent des verbes au pluriel
  choice: Le pronom féminin pluriel « elles » renvoie aux eaux du contexte immédiat.
  alternative: On pourrait expliciter « les eaux », ou comprendre plus largement les eaux chaotiques.
  rationale: Le français exige un genre, et « elles » reprend naturellement « les eaux » évoquées dans les versets précédents, tout en évitant une explicitation absente de ce verset.
- issue: Portée temporelle de la contrainte
  choice: Le futur « ne franchiront pas » et « ne reviendront pas » présente la limite comme durable.
  alternative: « Ne peuvent pas franchir » ou « qu’elles ne doivent pas franchir » mettrait davantage l’accent sur la capacité ou l’interdiction.
  rationale: Les imparfaits hébreux sous la négation peuvent exprimer une exclusion durable. Le futur français conserve cette nuance sans trancher entre impossibilité et prohibition.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme hébreu est conservé, avec une ponctuation qui met en évidence les deux propositions négatives.
