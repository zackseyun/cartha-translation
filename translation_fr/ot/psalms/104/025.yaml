revisions:
- from: Voici la mer, immense et vaste[a] ; là se meuvent des êtres sans nombre[b], des créatures vivantes, petites et grandes.
  to: 'Voici la mer, immense et vaste[a] : là grouillent d’innombrables êtres, animaux petits et grands.'
  rationale: 'La révision élimine une redondance française tout en maintenant les deux groupes nominaux du texte hébreu : une multitude d’êtres mobiles et des animaux de petite comme de grande taille. Elle conserve le ton poétique, la présentation déictique et la note nécessaire sur l’idiome « large de mains ».'
