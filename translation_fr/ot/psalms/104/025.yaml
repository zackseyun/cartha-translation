  text: זֶ֤ה הַ/יָּ֥ם גָּדוֹל֮ וּ/רְחַ֪ב יָ֫דָ֥יִם שָֽׁם רֶ֭מֶשׂ וְ/אֵ֣ין מִסְפָּ֑ר חַיּ֥וֹת קְ֝טַנּ֗וֹת עִם גְּדֹלֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/025.yaml
  text: There is the sea[a], great and broad of hands; in it are swarming things without number[c][b], living creatures small along with great.
translation:
  language: fr
  text: 'Voici la mer, immense et vaste[a] : là grouillent d’innombrables êtres, animaux petits et grands.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « large de mains », expression hébraïque évoquant une vaste étendue.'
    reason: cultural_note
lexical_decisions:
- source_word: זֶה הַיָּם
  choice: Voici la mer
  rationale: La tournure déictique attire l’attention sur la mer comme objet d’émerveillement. « Voici » rend naturellement cette présentation en français poétique.
- source_word: גָּדוֹל
  choice: immense
  rationale: Dans ce contexte de dimensions, « immense » exprime la grandeur de la mer avec une élévation poétique naturelle.
- source_word: וּרְחַב יָדַיִם
  choice: et vaste
  rationale: L’expression hébraïque, littéralement « large de mains », désigne une vaste étendue. Une traduction littérale serait obscure en français ; « vaste » en communique clairement le sens.
- source_word: שָׁם
  choice: là
  rationale: L’adverbe renvoie directement à la mer qui vient d’être présentée.
- source_word: רֶמֶשׂ
  choice: se meuvent des êtres
  rationale: Le nom collectif désigne des êtres qui se déplacent, souvent en grand nombre. Cette formulation reste assez large pour les créatures marines sans leur prêter nécessairement l’idée de ramper.
- source_word: וְאֵין מִסְפָּר
  choice: sans nombre
  rationale: Cette expression idiomatique signifie qu’ils sont innombrables et conserve ici une formulation poétique concise.
- source_word: חַיּוֹת
  choice: des créatures vivantes
  rationale: Ce choix rend explicitement la notion d’êtres animés sans la limiter aux animaux terrestres.
- source_word: קְטַנּוֹת עִם גְּדֹלוֹת
  choice: petites et grandes
  rationale: Cette paire contrastée exprime naturellement en français l’inclusion de créatures de toute taille ; la conjonction rend ici le sens associatif de עִם.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La syntaxe demeure simple et orale, tandis que « Voici » et « sans nombre » conservent le relief du psaume. L’idiome hébraïque relatif aux « mains » est rendu selon son sens et signalé en note.
