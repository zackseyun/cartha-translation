  text: All the beasts of the field drink from them[b][a]; the wild donkeys quench their thirst.
translation:
  language: fr
  text: Tous les animaux des champs s’y abreuvent ; les ânes sauvages étanchent leur soif.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: s’y abreuvent
  rationale: 'Le hiphil de שׁקה signifie normalement « donner à boire, abreuver ». Puisque les eaux du verset précédent sont le sujet implicite dans la formulation hébraïque, le français idiomatique adopte le point de vue des animaux : « s’y abreuvent ». Le pronom « y » reprend les cours d’eau ou sources du contexte.'
- source_word: כָּל
  choice: Tous
  rationale: Rend naturellement la portée collective de כָּל devant un groupe nominal pluriel.
- source_word: חַיְתוֹ שָׂדָי
  choice: les animaux des champs
  rationale: La construction désigne les créatures sauvages de la campagne ou des espaces ouverts. « Animaux des champs » est clair, actuel et digne, sans la nuance potentiellement archaïque de « bêtes des champs ».
- source_word: יִשְׁבְּרוּ
  choice: étanchent
  rationale: Avec « soif » comme complément, שׁבר forme une expression signifiant satisfaire ou apaiser la soif ; « étanchent » en donne l’équivalent idiomatique précis en français.
- source_word: פְרָאִים
  choice: les ânes sauvages
  rationale: פרא désigne l’âne sauvage, ou onagre. « Ânes sauvages » est immédiatement compréhensible, tandis qu’« onagres » est plus technique.
- source_word: צְמָאָם
  choice: leur soif
  rationale: Le nom abstrait accompagné du suffixe masculin pluriel se rend directement et naturellement par « leur soif ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, poétique sans archaïsme. Le parallélisme hébreu est conservé en deux membres, avec « s’y abreuvent » puis « étanchent leur soif ». Aucune note n’est nécessaire : « ânes sauvages » transmet clairement le référent, et la reformulation syntaxique du premier membre est exigée par l’usage naturel du français.'
