  text: תְּשַׁלַּ֣ח ר֭וּחֲ/ךָ יִבָּרֵא֑וּ/ן וּ֝/תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: fr
  text: Quand tu envoies ton Esprit[a], ils sont créés[b], et tu renouvelles la face du sol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton souffle » ou « ton vent » ; le mot hébreu רוּחַ peut avoir ces trois sens.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Tu envoies ton Esprit, ils sont créés. » L’hébreu juxtapose les deux propositions.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: tu envoies
  rationale: Le piel de שׁלח signifie « envoyer » ou « faire partir ». « Tu envoies » est direct et naturel en français, sans ajouter de nuance absente du texte.
- source_word: רוּחֲךָ
  choice: ton Esprit
  rationale: רוּחַ peut désigner l’esprit, le souffle ou le vent. Dans ce contexte de création et de renouvellement, « ton Esprit » exprime bien l’action vivifiante de Dieu, tandis qu’une note conserve les autres sens possibles.
- source_word: יִבָּרֵאוּן
  choice: ils sont créés
  rationale: Le niphal de ברא exprime ici le fait d’être créé. Cette traduction directe n’ajoute pas l’idée de création nouvelle, déjà portée par le verbe suivant.
- source_word: וּתְחַדֵּשׁ
  choice: et tu renouvelles
  rationale: Le piel de חדשׁ signifie « renouveler » ou « rendre nouveau ». « Renouveler » convient à l’idée de restauration ou de régénération et maintient la coordination hébraïque.
- source_word: פְּנֵי
  choice: la face de
  rationale: La traduction littérale « la face de » reste intelligible en français et conserve l’image poétique de l’hébreu.
- source_word: אֲדָמָה
  choice: du sol
  rationale: אֲדָמָה désigne ici le sol ou la terre comme milieu terrestre. « Le sol » le distingue du terme cosmique plus large אֶרֶץ et convient au contexte de renouvellement de la création vivante.
theological_decisions:
- issue: Sens de רוּחַ dans un contexte de création
  choice: ton Esprit
  alternative: ton souffle ou ton vent
  rationale: « Esprit » rend l’action divine vivifiante sans être étranger au champ lexical hébreu. La note maintient toutefois l’ambivalence réelle entre esprit, souffle et vent.
- issue: Rapport syntaxique entre l’envoi et la création
  choice: Quand tu envoies… ils sont créés
  alternative: Tu envoies… ils sont créés
  rationale: L’hébreu juxtapose les deux propositions sans conjonction temporelle explicite. « Quand » rend naturellement en français leur rapport étroit, tandis qu’une note conserve la coordination plus formelle et son ambiguïté.
translation_notes:
  register: Français moderne, clair et soutenu. Le tutoiement correspond à l’adresse directe à Dieu. « La face du sol » conserve volontairement l’image poétique hébraïque, malgré la possibilité plus idiomatique de « la surface du sol ».
