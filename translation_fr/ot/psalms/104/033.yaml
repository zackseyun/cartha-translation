source:
  edition: WLC
  text: אָשִׁ֣ירָה לַ/יהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/033.yaml
  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: fr
  text: 'Je chanterai à Yahweh tant que je vivrai ;

    je ferai de la musique pour mon Dieu tant que j’existerai[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tant que je serai encore en vie » ; l’expression hébraïque évoque la continuation de l’existence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: Je chanterai
  rationale: Le cohortatif qal à la première personne exprime ici une intention résolue. Le futur français la rend naturellement.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique le destinataire du chant. « Pour » est idiomatique en français dans ce contexte, et le nom divin est translittéré « Yahweh ».
- source_word: בְּחַיָּי
  choice: tant que je vivrai
  rationale: Littéralement « dans ma vie », l’expression a une valeur temporelle et désigne toute la durée de la vie du psalmiste.
- source_word: אֲזַמְּרָה
  choice: je célébrerai … par la musique
  rationale: Le piel de זמר évoque une louange chantée ou musicale. Cette formulation conserve la nuance musicale tout en distinguant le verbe du simple « chanter » du premier membre.
- source_word: לֵאלֹהַי
  choice: mon Dieu
  rationale: 'Le suffixe de première personne exprime directement la relation possessive : « mon Dieu ».'
- source_word: בְּעוֹדִי
  choice: tant que j’existerai
  rationale: עוֹד avec le suffixe de première personne évoque la continuation de l’existence. « Tant que j’existerai » préserve cette nuance et la variation poétique avec « tant que je vivrai ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu porte le tétragramme. La translittération « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée de בְּעוֹדִי
  choice: tant que j’existerai
  alternative: tant que je serai encore en vie
  rationale: La formulation principale maintient la notion plus large de continuation de l’existence, tandis que la note signale l’interprétation plus strictement liée à la vie.
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme est conservé, avec une variation entre « vivrai » et « existerai » ainsi qu’entre le chant et la célébration musicale.
