id: PSA.104.10
reference: Psalms 104:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַֽ/מְשַׁלֵּ֣חַ מַ֭עְיָנִים בַּ/נְּחָלִ֑ים בֵּ֥ין הָ֝רִ֗ים יְהַלֵּכֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/010.yaml
  text: He sends springs into the valleys[a]; they flow between the mountains.
translation:
  language: fr
  text: Il fait jaillir des sources dans les ravins[a] ; elles coulent entre les montagnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les oueds » ou « dans les vallées » ; le terme hébreu peut désigner des lits de torrents saisonniers, des ravins ou les vallées qui leur sont associées.
    reason: alternative lexicale
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Il fait jaillir
  rationale: Le participe hiphil décrit ici l’action providentielle continue de Dieu. « Il fait jaillir » est naturel en français et convient précisément à l’apparition des sources, tout en rendant la valeur causative.
- source_word: מַעְיָנִים
  choice: des sources
  rationale: מַעְיָן désigne couramment une source ou un point d’émergence de l’eau. « Sources » est clair, actuel et adapté au contexte naturel.
- source_word: בַּנְּחָלִים
  choice: dans les ravins
  rationale: נחל peut désigner un torrent, son lit, un ravin ou une vallée. « Ravins » restitue ici le relief encaissé entre les montagnes sans imposer l’emprunt moins courant « oueds ».
- source_word: בֵּין הָרִים
  choice: entre les montagnes
  rationale: La préposition בֵּין marque directement la position entre les reliefs, et הָרִים désigne naturellement les montagnes dans cette scène de création.
- source_word: יְהַלֵּכוּן
  choice: elles coulent
  rationale: הלך signifie littéralement « aller » ou « marcher » ; avec les eaux des sources comme sujet implicite, « couler » exprime idiomatiquement leur mouvement en français.
theological_decisions:
- issue: Sujet implicite du participe הַמְשַׁלֵּחַ
  choice: « Il » renvoie à Dieu
  alternative: « Celui qui fait jaillir »
  rationale: Le contexte du psaume présente les actions de Dieu dans la création. Une proposition verbale avec « Il » donne en français une phrase naturelle sans ajouter d’identification étrangère au contexte.
- issue: Antécédent du féminin pluriel « elles »
  choice: les sources, comprises comme leurs eaux
  alternative: traduire plus explicitement « leurs eaux coulent »
  rationale: Le verbe hébreu est au masculin pluriel et reprend naturellement מַעְיָנִים. En français, « sources » est féminin ; « elles coulent » conserve la concision et le mouvement poétique du texte.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La formulation garde le parallélisme du verset et signale en note l’étendue sémantique de נחל.
