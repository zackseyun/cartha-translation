  source_fidelity: 'Le sens essentiel est bien rendu : les jeunes lions rugissent en rapport avec la proie et leur nourriture est recherchée auprès de Dieu. Toutefois, לְבַקֵּשׁ (« chercher/demander ») est un infinitif de but ou de résultat lié au rugissement ; une formulation participiale française rend mieux ce lien sans le transformer en une seconde action autonome.'
