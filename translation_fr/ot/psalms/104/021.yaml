  text: The young lions roar for prey, seeking their food from God.
translation:
  language: fr
  text: Les jeunes lions rugissent en quête de proie, cherchant auprès de Dieu leur nourriture.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: Les jeunes lions
  rationale: כְּפִיר désigne un jeune lion; le pluriel défini est rendu naturellement en français.
- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: rugissent après leur proie
  rationale: שׁאג signifie « rugir » et לַטֶּרֶף exprime ici ce vers quoi tend leur rugissement, à savoir la proie.
- source_word: וּלְבַקֵּשׁ מֵאֵל
  choice: et demandent à Dieu
  rationale: בקשׁ avec מִן peut exprimer le fait de demander ou rechercher quelque chose auprès de quelqu’un. « Demandent à Dieu » conserve l’image théologique selon laquelle les animaux dépendent de Dieu.
- source_word: אָכְלָם
  choice: leur nourriture
  rationale: Le nom אֹכֶל avec suffixe pluriel signifie littéralement « leur nourriture ».
theological_decisions:
- issue: La relation entre la chasse des lions et la providence divine
  choice: et demandent à Dieu leur nourriture
  alternative: cherchant auprès de Dieu leur nourriture
  rationale: La coordination de l’hébreu est maintenue sans expliquer comment le rugissement ou la chasse constitue une demande adressée à Dieu; la tension poétique et théologique reste intacte.
translation_notes:
  register: Français moderne, clair et digne. La formulation suit le parallélisme hébreu et conserve la personnification poétique des jeunes lions qui demandent leur nourriture à Dieu.
