- from: Il fait pousser l’herbe pour le bétail et les plantes que l’être humain cultive[a], afin de tirer de la terre sa nourriture[b].
  to: Il fait pousser l’herbe pour le bétail, et les plantes pour le travail de l’être humain[a], pour faire sortir de la terre le pain[b].
  rationale: La révision restitue l’ambiguïté fonctionnelle de לַעֲבֹדַת הָאָדָם sans imposer la seule idée de culture. Elle conserve « pain » comme rendu principal de לֶחֶם, sans attribuer grammaticalement l’action de tirer ou produire à l’être humain. « Pour faire sortir de la terre le pain » garde l’image et la causalité poétiques du texte source, dont le sujet principal demeure Dieu.
