  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: fr
  text: Il fait pousser l’herbe pour le bétail, et les plantes pour le travail de l’être humain[a], pour faire sortir de la terre le pain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le service de l’être humain ». L’expression hébraïque est concise et peut désigner les plantes en rapport avec le travail, le service ou l’usage humain.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu rendu par « pain » peut aussi désigner la nourriture en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: Il fait pousser
  rationale: 'Le participe hiphil de צמח exprime la causalité : Dieu fait croître la végétation. « Il fait pousser » est naturel en français et conserve cette force causative.'
- source_word: חָצִיר
  choice: l’herbe
  rationale: Dans ce contexte, le mot désigne la végétation servant de fourrage aux animaux ; « l’herbe » est précis et courant.
- source_word: לַבְּהֵמָה
  choice: pour le bétail
  rationale: בְּהֵמָה désigne ici collectivement les animaux domestiques, particulièrement ceux qui paissent ; « le bétail » convient à l’image pastorale.
- source_word: וְעֵשֶׂב
  choice: et les plantes
  rationale: עֵשֶׂב a un sens plus large que « herbes » et désigne ici la végétation utile à l’être humain.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: que l’être humain cultive
  rationale: La construction compacte associe la végétation au travail humain. Dans ce contexte agricole et avec la proposition finale qui suit, « que l’être humain cultive » rend naturellement cette relation sans nier la possibilité plus formelle « pour le travail de l’être humain », signalée en note.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: אָדָם est ici générique et représente l’humanité, non un individu masculin déterminé. « L’être humain » exprime exactement cette portée en français moderne.
- source_word: לְהוֹצִיא
  choice: afin de tirer
  rationale: L’infinitif peut exprimer le but ou le résultat. « Afin de tirer » conserve cette relation et s’accorde naturellement avec ce que l’être humain obtient de la terre par son travail.
- source_word: לֶחֶם
  choice: sa nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais peut aussi désigner la nourriture en général. Ici, « nourriture » explicite naturellement le produit des plantes cultivées ; le sens littéral est conservé en note.
- source_word: מִן הָאָרֶץ
  choice: de la terre
  rationale: אֶרֶץ désigne ici le sol ou la terre d’où proviennent les produits agricoles ; « de la terre » garde la portée concrète et poétique.
theological_decisions:
- issue: Sens générique de הָאָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le nom singulier est employé dans un sens représentatif et générique. En français moderne, « l’être humain » préserve ce sens sans donner à tort l’impression qu’il ne s’agit que du sexe masculin.
- issue: Sujet implicite de לְהוֹצִיא
  choice: l’être humain tire sa nourriture de la terre
  alternative: Dieu fait sortir le pain de la terre
  rationale: La syntaxe hébraïque permet une certaine tension quant au rapport exact de l’infinitif avec ce qui précède. Le travail humain est le lien contextuel le plus immédiat, mais l’ensemble du verset affirme que Dieu est celui qui fait croître ; aucune opposition entre action divine et travail humain n’est introduite.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le verset conserve le parallélisme entre la nourriture du bétail et celle des humains. « L’être humain » rend le sens générique de אָדָם ; les notes préservent l’ambiguïté de לַעֲבֹדַת et le sens littéral de לֶחֶם.
