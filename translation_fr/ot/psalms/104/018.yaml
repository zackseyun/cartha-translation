source:
  edition: WLC
  text: הָרִ֣ים הַ֭/גְּבֹהִים לַ/יְּעֵלִ֑ים סְ֝לָעִ֗ים מַחְסֶ֥ה לַֽ/שְׁפַנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/018.yaml
  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: fr
  text: Les hautes montagnes sont pour les bouquetins ; les rochers servent de refuge aux damans.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: les hautes montagnes
  rationale: Rend directement le nom et son adjectif, dans un français naturel, tout en conservant l’image du relief élevé.
- source_word: לַיְּעֵלִים
  choice: pour les bouquetins
  rationale: Le terme désigne des caprinés sauvages des montagnes, couramment identifiés aux bouquetins. « Bouquetins » est précis et bien compris en français moderne.
- source_word: סְלָעִים
  choice: les rochers
  rationale: Traduction large et naturelle des formations rocheuses qui constituent l’habitat décrit.
- source_word: מַחְסֶה
  choice: servent de refuge
  rationale: Le nom hébreu exprime un lieu de protection. L’ajout idiomatique de « servent de » explicite naturellement en français la relation nominale de la proposition sans en modifier le sens.
- source_word: לַשְׁפַנִּים
  choice: aux damans
  rationale: שפן désigne ici le petit mammifère rupicole identifié au daman. Le terme français est zoologiquement exact et évite les équivalents traditionnels trompeurs comme « lapins » ou « blaireaux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et poétique. Le parallélisme entre les deux habitats et les deux espèces est conservé, avec une légère explicitation verbale dans le second membre pour obtenir une phrase française naturelle.
