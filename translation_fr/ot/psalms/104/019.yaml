source:
  edition: WLC
  text: עָשָׂ֣ה יָ֭רֵחַ לְ/מוֹעֲדִ֑ים שֶׁ֝֗מֶשׁ יָדַ֥ע מְבוֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/019.yaml
  text: He made the moon for appointed times[a]; the sun knows its setting.
translation:
  language: fr
  text: Il a fait la lune pour les temps fixés[a] ; le soleil connaît son coucher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les saisons » ou « les temps de fête » ; le terme hébreu peut désigner des temps déterminés, y compris des dates de fêtes.
    reason: alternative lexicale
lexical_decisions:
- source_word: עָשָׂה
  choice: a fait
  rationale: Le qal de עשה signifie couramment « faire ». Cette formulation garde Dieu comme sujet implicite d’après le contexte, sans donner au verbe le sens plus interprétatif d’« établir ».
- source_word: יָרֵחַ
  choice: la lune
  rationale: Traduction directe du nom de l’astre.
- source_word: לְמוֹעֲדִים
  choice: pour marquer les temps fixés
  rationale: מועד peut désigner un temps fixé, une saison ou une date de fête. « Pour marquer les temps fixés » exprime naturellement en français la fonction de la lune tout en conservant l’étendue du terme.
- source_word: שֶׁמֶשׁ
  choice: le soleil
  rationale: Traduction française usuelle.
- source_word: יָדַע
  choice: sait
  rationale: Le sens littéral est « savoir, connaître ». « Sait » préserve la personnification poétique du soleil.
- source_word: מְבוֹאוֹ
  choice: où il se couche
  rationale: מבוא désigne l’entrée ou le fait d’aller vers un lieu ; appliqué au soleil, il évoque idiomatiquement son coucher. La tournure choisie s’accorde naturellement avec « sait » en français.
theological_decisions:
- issue: Portée de מוֹעֲדִים dans le contexte de la création
  choice: « les temps fixés », au sens large
  alternative: « les saisons » ou « les fêtes »
  rationale: Le verset présente l’ordre donné par Dieu aux astres. La lune sert à déterminer des temps établis, ce qui peut inclure les saisons et les dates festives. La traduction principale ne réduit donc pas le terme à un seul de ces domaines.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation « sait où il se couche » conserve la personnification de l’hébreu et reste immédiatement compréhensible.
source_grounding:
  english_pob_role: consult_only
