source:
  edition: WLC
  text: תַּסְתִּ֥יר פָּנֶי/ךָ֮ יִֽבָּהֵ֫ל֥וּ/ן תֹּסֵ֣ף ר֭וּחָ/ם יִגְוָע֑וּ/ן וְֽ/אֶל עֲפָרָ֥/ם יְשׁוּבֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/029.yaml
  text: You hide your face[a], they are terrified; you take away their breath[b], they die and return to their dust.
translation:
  language: fr
  text: 'Tu caches ton visage[a] : ils sont terrifiés ; tu reprends leur souffle[b] : ils meurent et retournent à leur poussière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta présence ». En hébreu, « ton visage » est une expression courante qui peut désigner la présence personnelle ou la faveur.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur esprit ». Le mot hébreu רוּחַ peut signifier « souffle », « vent » ou « esprit » ; ici, le contexte de la mort et du retour à la poussière favorise « souffle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּיר
  choice: tu caches
  rationale: Le hiphil de סתר signifie « cacher, dissimuler ». « Cacher » rend naturellement l’image relationnelle du retrait de la présence favorable de Dieu.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Traduction concrète et littérale de l’expression hébraïque, qui peut aussi désigner la présence ou la faveur personnelle.
- source_word: יִבָּהֵלוּן
  choice: ils sont terrifiés
  rationale: Le niphal de בהל exprime une vive frayeur ou un profond bouleversement ; « terrifiés » en conserve ici l’intensité.
- source_word: תֹּסֵף
  choice: tu leur retires
  rationale: Le qal de אסף peut signifier rassembler, reprendre ou enlever. Avec « souffle » pour objet, « retirer » exprime clairement la cessation de la vie sans ajouter l’idée d’une action violente.
- source_word: רוּחָם
  choice: le souffle
  rationale: רוּחַ peut signifier « souffle », « vent » ou « esprit ». Le contexte immédiat de l’expiration et du retour à la poussière favorise « souffle » ; le pronom hébreu est rendu par « leur » dans la construction verbale française.
- source_word: יִגְוָעוּן
  choice: ils expirent
  rationale: גוע désigne le fait d’expirer, de rendre le dernier souffle. « Ils expirent » maintient le lien poétique avec le souffle retiré.
- source_word: עֲפָרָם
  choice: leur poussière
  rationale: Le possessif est explicitement présent dans l’hébreu. Cette formulation conserve l’écho à la condition mortelle des créatures issues de la poussière.
- source_word: יְשׁוּבוּן
  choice: retournent
  rationale: שוב signifie revenir ou retourner ; « retourner à la poussière » est naturel en français et préserve le mouvement exprimé par le texte.
theological_decisions:
- issue: Sens de רוּחָם dans le contexte de la création et de la mort
  choice: le souffle
  alternative: leur esprit
  rationale: Le parallélisme entre le retrait de la רוּחַ, l’expiration et le retour à la poussière met en avant le souffle vital dont les créatures dépendent. Ce choix n’impose pas une conception particulière d’un esprit immatériel ; la note conserve l’autre sens possible.
- issue: Langage anthropomorphique du visage de Dieu
  choice: ton visage
  alternative: ta présence
  rationale: L’image hébraïque est intelligible et poétiquement forte en français. La conserver évite de remplacer le langage concret du psaume par une abstraction, tandis que la note en indique la portée idiomatique.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme est marqué par les deux-points et le point-virgule. « Expirent » fait écho au « souffle » sans être archaïque ; les images concrètes du « visage » et de « leur poussière » sont préservées.
