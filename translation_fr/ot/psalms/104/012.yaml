  text: עֲ֭לֵי/הֶם עוֹף הַ/שָּׁמַ֣יִם יִשְׁכּ֑וֹן מִ/בֵּ֥ין עֳ֝פָאיִ֗ם יִתְּנוּ קֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/012.yaml
  text: Above them the birds of the heavens dwell[a]; from among the branches they give forth their voice.
translation:
  language: fr
  text: Près d’elles habitent les oiseaux du ciel ; d’entre les branches[a], ils font entendre leur voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’entre le feuillage » ou « d’entre les rameaux ». Le nom hébreu est rare et peut désigner de manière générale des branches feuillues.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Au-dessus d’eux
  rationale: La préposition עַל avec suffixe renvoie aux eaux évoquées précédemment et peut exprimer une position au-dessus d’elles. Cette formulation conserve l’image spatiale du texte sans la réduire à la simple proximité.
- source_word: עוֹף הַשָּׁמַיִם
  choice: les oiseaux du ciel
  rationale: Le collectif עוֹף désigne ici les oiseaux, et « du ciel » rend naturellement en français le complément hébreu tout en gardant sa tonalité poétique.
- source_word: יִשְׁכּוֹן
  choice: demeurent
  rationale: Le verbe שׁכן signifie habiter, séjourner ou demeurer. « Demeurent » conserve l’idée d’habitation sans préciser indûment qu’ils nichent.
- source_word: מִבֵּין
  choice: du milieu de
  rationale: L’expression indique que la voix provient de l’intérieur de la végétation. « Du milieu de » est idiomatique en français et garde cette valeur de provenance.
- source_word: עֳפָאיִם
  choice: branches
  rationale: Ce nom rare semble désigner des branches, des rameaux ou le feuillage. « Branches » donne une image claire dans le contexte, tandis qu’une note préserve l’incertitude lexicale.
- source_word: יִתְּנוּ קוֹל
  choice: ils font entendre leur voix
  rationale: Littéralement, les oiseaux « donnent de la voix ». La formulation retenue restitue l’expression poétique sans interpréter explicitement leur cri comme un chant.
theological_decisions: []
translation_notes:
  register: Français moderne, fluide et poétique. Le parallélisme spatial est conservé, ainsi que l’expression imagée « faire entendre leur voix ». Le marqueur de note est placé après le terme rare qu’il explique.
