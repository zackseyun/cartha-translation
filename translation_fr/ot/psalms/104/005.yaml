  text: יָֽסַד אֶ֭רֶץ עַל מְכוֹנֶ֑י/הָ בַּל תִּ֝מּ֗וֹט עוֹלָ֥ם וָ/עֶֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: fr
  text: Il a fondé la terre sur ses assises[a] ; elle ne vacillera pas, pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur ses fondements » ; l’hébreu emploie une image architecturale pour exprimer la stabilité du monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: a fondé
  rationale: Le verbe évoque l’acte de fonder ou d’établir en posant des fondations ; « a fondé » conserve cette image architecturale en français naturel.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Dans le contexte de cet hymne à la création, le sens global « terre » convient mieux que le sens local « pays ».
- source_word: עַל
  choice: sur
  rationale: La préposition exprime ici le support ou l’emplacement.
- source_word: מְכוֹנֶיהָ
  choice: ses assises
  rationale: Le nom désigne des bases, des fondements ou des supports fixes ; « assises » rend l’image architecturale tout en évitant la répétition de « fondé » et « fondations ».
- source_word: בַּל תִּמּוֹט
  choice: elle ne vacillera jamais
  rationale: Le verbe au niphal exprime le fait d’être ébranlé ou rendu instable ; « vaciller » maintient l’image de stabilité. « Jamais » s’intègre naturellement à la négation renforcée par l’expression temporelle.
- source_word: עוֹלָם וָעֶד
  choice: à tout jamais
  rationale: Cette locution redoublée intensifie l’idée de durée perpétuelle ; « à tout jamais » en restitue la force poétique en français.
theological_decisions:
- issue: Langage cosmologique dans une image poétique de la création
  choice: Conserver l’image architecturale des assises de la terre et de sa stabilité.
  alternative: Il a solidement établi la terre, de sorte qu’elle ne puisse jamais bouger.
  rationale: Le verset emploie un langage poétique et phénoménologique. La traduction préserve cette représentation sans la convertir en formulation scientifique moderne ni l’assujettir à un système doctrinal.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Assises » conserve la métaphore architecturale ; « à tout jamais » rend l’intensification poétique de l’hébreu.
