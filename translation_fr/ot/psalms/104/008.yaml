source:
  edition: WLC
  text: יַעֲל֣וּ הָ֭רִים יֵרְד֣וּ בְקָע֑וֹת אֶל מְ֝ק֗וֹם זֶ֤ה יָסַ֬דְתָּ לָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: fr
  text: Les montagnes s’élevèrent[a], les vallées s’abaissèrent, jusqu’au lieu que tu avais établi pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible de la poésie hébraïque, avec les eaux comme sujet sous-entendu : « Elles montèrent sur les montagnes, descendirent dans les vallées, jusqu’au lieu que tu avais établi pour elles. »'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: s’élevèrent
  rationale: Le qal de עלה exprime un mouvement ascendant. « S’élevèrent » convient naturellement au relief qui surgit, tout en préservant l’image poétique.
- source_word: הָרִים
  choice: les montagnes
  rationale: Le nom masculin pluriel défini est rendu avec l’article, conformément à l’hébreu.
- source_word: יֵרְדוּ
  choice: s’abaissèrent
  rationale: Le qal de ירד exprime un mouvement descendant. Dans la lecture topographique retenue, « s’abaissèrent » forme un parallèle naturel avec « s’élevèrent » sans ajouter l’idée plus forte d’un affaissement.
- source_word: בְקָעוֹת
  choice: les vallées
  rationale: Le pluriel désigne ici les régions basses ou vallées; « les vallées » est clair et naturel en français contemporain.
- source_word: אֶל מְקוֹם
  choice: jusqu’au lieu
  rationale: La préposition אֶל marque la direction vers une destination. « Jusqu’au lieu » rend avec naturel l’aboutissement du mouvement dans ce contexte.
- source_word: זֶה
  choice: que
  rationale: Le démonstratif est intégré idiomatiquement à la proposition relative française « le lieu que… »; le traduire littéralement par « ce lieu-ci » serait lourd et peu naturel.
- source_word: יָסַדְתָּ
  choice: tu avais établi
  rationale: יסד signifie fonder, fixer ou établir. Le plus-que-parfait français indique naturellement que Dieu avait assigné ce lieu avant le mouvement décrit, sans modifier le sens lexical du parfait hébreu.
- source_word: לָהֶם
  choice: pour elles
  rationale: Le suffixe masculin pluriel hébreu renvoie, dans la lecture principale, aux montagnes et aux vallées prises ensemble. En français, l’accord pronominal avec ces deux noms féminins pluriels exige « elles ».
theological_decisions:
- issue: Sujet des verbes dans ce vers poétique
  choice: 'Les montagnes et les vallées sont les sujets respectifs : « Les montagnes s’élevèrent, les vallées s’abaissèrent » pour décrire la mise en place du relief.'
  alternative: Les eaux, sujet implicite tiré du contexte, « montèrent sur les montagnes » puis « descendirent dans les vallées ».
  rationale: La vocalisation et la syntaxe permettent de prendre הָרִים et בְקָעוֹת comme sujets, ce qui donne une image cohérente de l’ordonnancement de la création. Toutefois, puisque le contexte immédiat décrit le retrait des eaux, l’autre analyse demeure véritablement plausible et est conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme « s’élevèrent / s’abaissèrent » restitue la symétrie de l’hébreu, tandis que la note conserve l’ambiguïté syntaxique réelle concernant le sujet des verbes.
