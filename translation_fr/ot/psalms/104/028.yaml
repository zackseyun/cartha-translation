source:
  edition: WLC
  text: תִּתֵּ֣ן לָ֭/הֶם יִלְקֹט֑וּ/ן תִּפְתַּ֥ח יָֽ֝דְ/ךָ֗ יִשְׂבְּע֥וּ/ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: fr
  text: Tu leur donnes, et ils ramassent ; tu ouvres ta main, et ils se rassasient de bonnes choses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ce qui est bon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: Tu leur donnes
  rationale: Le verbe נתן au qal inaccompli, adressé à Dieu, et le complément indirect pronominal sont rendus directement et naturellement.
- source_word: יִלְקֹטוּן
  choice: ils ramassent
  rationale: לקט signifie « ramasser, recueillir ». Le français permet ici l'emploi absolu, l'objet étant compris d'après ce que Dieu donne.
- source_word: תִּפְתַּח יָדְךָ
  choice: tu ouvres ta main
  rationale: La traduction littérale conserve l'image anthropomorphique centrale de la générosité divine.
- source_word: יִשְׂבְּעוּן
  choice: ils se rassasient
  rationale: שׂבע exprime le fait d'avoir suffisamment, d'être rassasié. La forme pronominale est idiomatique et concrète en français.
- source_word: טוֹב
  choice: de bonnes choses
  rationale: טוב est ici substantivé. « De bonnes choses » rend naturellement en français ce bien concret fourni aux créatures, tout en gardant une note sur la formulation plus compacte.
theological_decisions:
- issue: Langage anthropomorphique décrivant la providence divine
  choice: Conserver « tu ouvres ta main »
  alternative: « tu pourvois généreusement »
  rationale: L'image concrète appartient à la poésie et à la théologie du psaume ; une paraphrase abstraite l'affaiblirait.
- issue: Portée de טוֹב
  choice: « de bonnes choses »
  alternative: « de ce qui est bon »
  rationale: Le contexte immédiat concerne la nourriture et les dons de Dieu aux créatures, mais le terme hébreu reste général ; la note préserve une traduction moins concrétisée.
translation_notes:
  register: Français moderne, simple et digne. Le parallélisme poétique est conservé par les deux propositions coordonnées ; « ramassent » reste sans objet exprimé, comme en hébreu, puisque celui-ci se déduit du contexte.
