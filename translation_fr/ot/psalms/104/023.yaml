  text: יֵצֵ֣א אָדָ֣ם לְ/פָעֳל֑/וֹ וְֽ/לַ/עֲבֹ֖דָת֣/וֹ עֲדֵי עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/023.yaml
  text: Man goes out to his work and to his labor until evening[a][b].
translation:
  language: fr
  text: L’être humain sort pour son travail et son labeur jusqu’au soir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu אָדָם est ici un singulier générique qui désigne l’humanité; on peut aussi traduire : « L’homme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵצֵא
  choice: sort
  rationale: Le qal inaccompli décrit ici une action habituelle dans l’ordre quotidien de la création. « Sort » conserve simplement l’idée de mouvement.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le singulier hébreu a ici une valeur générique et représente l’humanité, par contraste avec les animaux évoqués auparavant. « L’être humain » garde le singulier collectif sans limiter le propos aux hommes de sexe masculin.
- source_word: לְפָעֳלוֹ
  choice: pour se rendre à son ouvrage
  rationale: Après le verbe de sortie, לְ exprime le but ou la destination. פֹּעַל désigne l’ouvrage ou l’activité; cette formulation rend à la fois le mouvement et la finalité.
- source_word: וְלַעֲבֹדָתוֹ
  choice: à son travail
  rationale: עֲבֹדָה désigne le travail, le service ou le labeur. « Travail » est naturel dans ce tableau de l’activité humaine quotidienne; le second possessif reflète la structure parallèle de l’hébreu.
- source_word: עֲדֵי עָרֶב
  choice: jusqu’au soir
  rationale: עֲדֵי, forme poétique, marque la limite temporelle; « jusqu’au soir » est idiomatique et précis en français.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le contexte décrit le rythme ordinaire de l’humanité au sein de la création. Le français « l’être humain » exprime clairement cette portée générique, tandis que « l’homme » peut également conserver la forme représentative traditionnelle.
translation_notes:
  register: Français moderne, international et digne. La répétition possessive (« son ouvrage, à son travail ») conserve le parallélisme hébreu, tandis que « se rendre à » explicite naturellement la force directionnelle ou finale de לְ après « sortir ».
