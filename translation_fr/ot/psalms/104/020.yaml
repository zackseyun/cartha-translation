    text: 'Ou : « s’y agitent » ; le verbe hébreu désigne le mouvement des animaux, notamment pendant la nuit, sans impliquer nécessairement qu’ils chassent.'
    reason: lexical_alternative
  revision_rationale: La révision remplace une expression légèrement interprétative de l’action divine par « établis », plus proche de « mettre, placer, établir », et supprime l’idée non marquée d’un commencement du mouvement. Elle restitue aussi explicitement, par « y », la référence à la nuit. Aucune ambiguïté théologique ou lexicale significative n’est tranchée au-delà du texte.
