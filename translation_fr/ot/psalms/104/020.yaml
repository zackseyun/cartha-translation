  text: תָּֽשֶׁת חֹ֭שֶׁךְ וִ֣/יהִי לָ֑יְלָה בּֽ/וֹ תִ֝רְמֹ֗שׂ כָּל חַיְת/וֹ יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/020.yaml
  text: You set darkness[a], and it becomes night; in it all the beasts of the forest creep about.
translation:
  language: fr
  text: Tu établis l’obscurité, et c’est la nuit ; tous les animaux de la forêt s’y déplacent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’y agitent » ; le verbe hébreu désigne le mouvement des animaux, notamment pendant la nuit, sans impliquer nécessairement qu’ils chassent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשֶׁת
  choice: Tu fais venir
  rationale: Le verbe signifie « mettre, placer, établir ». Dans ce contexte, « faire venir l’obscurité » exprime naturellement en français l’action directe de Dieu sans la réduire à une simple permission.
- source_word: חֹשֶׁךְ
  choice: l’obscurité
  rationale: Équivalent courant de חֹשֶׁךְ, désignant ici l’arrivée de l’obscurité dans l’ordre créé.
- source_word: וִיהִי לָיְלָה
  choice: et c’est la nuit
  rationale: 'La tournure rend avec simplicité l’état qui résulte de l’action précédente : lorsque Dieu établit l’obscurité, la nuit est là.'
- source_word: בּוֹ
  choice: alors
  rationale: Le suffixe renvoie à la nuit et signifie littéralement « en elle ». En français, « alors » rend naturellement la valeur temporelle dans ce contexte, sans changer le référent implicite.
- source_word: תִרְמֹשׂ
  choice: se mettent en mouvement
  rationale: רמשׂ désigne le fait de se mouvoir ou de circuler, souvent à propos d’animaux. Cette formulation préserve l’étendue du terme sans imposer l’idée de chasse contenue dans « rôder ».
- source_word: כָּל חַיְתוֹ יָעַר
  choice: tous les animaux de la forêt
  rationale: « Animaux » est naturel, actuel et suffisamment large pour חיה ; le groupe construit désigne collectivement les animaux de la forêt.
theological_decisions:
- issue: L’action divine dans l’ordonnancement de la création
  choice: Dieu fait activement venir l’obscurité, et la nuit en résulte.
  alternative: Dieu permet seulement à l’obscurité et à la nuit de survenir.
  rationale: La deuxième personne masculine singulière attribue directement l’action à Dieu. La traduction maintient cette action sans ajouter de théorie philosophique sur la causalité.
translation_notes:
  register: 'Français international moderne, poétique mais immédiatement compréhensible. Le tutoiement conserve l’adresse directe à Dieu. La ponctuation met en relief la progression : obscurité, nuit, activité des animaux.'
