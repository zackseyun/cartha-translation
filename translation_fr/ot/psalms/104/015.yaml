id: PSA.104.15
reference: Psalms 104:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יַ֤יִן יְשַׂמַּ֬ח לְֽבַב אֱנ֗וֹשׁ לְ/הַצְהִ֣יל פָּנִ֣ים מִ/שָּׁ֑מֶן וְ֝/לֶ֗חֶם לְֽבַב אֱנ֥וֹשׁ יִסְעָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: fr
  text: et le vin réjouit le cœur de l’être humain, faisant resplendir son visage plus que l’huile[a], et le pain soutient le cœur de l’être humain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «faisant resplendir le visage avec l’huile». La préposition hébraïque peut exprimer une comparaison («plus que l’huile») ou indiquer le moyen ou la source («avec/par l’huile»).
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַיִן
  choice: et le vin
  rationale: Le nom désigne ici le vin comme réalité générique; l’article défini est naturel en français.
- source_word: יְשַׂמַּח
  choice: réjouit
  rationale: Le piel de שׂמח exprime le fait de causer la joie; «réjouit» en garde la valeur causative avec concision.
- source_word: לְבַב אֱנוֹשׁ
  choice: le cœur de l’être humain
  rationale: לְבַב désigne le cœur comme siège de la vie intérieure, tandis que אֱנוֹשׁ est ici un singulier représentatif de l’humanité mortelle. Cette formulation française conserve le singulier générique sans suggérer un individu masculin particulier.
- source_word: לְהַצְהִיל פָּנִים
  choice: faisant resplendir son visage
  rationale: L’infinitif hiphil exprime l’action de rendre lumineux ou rayonnant. Le possessif explicite naturellement en français le lien avec l’être humain mentionné juste avant.
- source_word: מִשָּׁמֶן
  choice: plus que l’huile
  rationale: La préposition מִן peut introduire une comparaison; cette lecture rattache l’expression à l’effet du vin, tout en laissant l’autre analyse signalée en note.
- source_word: וְלֶחֶם
  choice: et le pain
  rationale: לֶחֶם désigne littéralement le pain, aliment de base, et ne nécessite pas ici l’élargissement à «nourriture».
- source_word: יִסְעָד
  choice: soutient
  rationale: סעד signifie soutenir, fortifier ou maintenir. «Soutient» conserve l’image hébraïque et convient à l’action nourricière du pain.
theological_decisions:
- issue: Portée du singulier אֱנוֹשׁ
  choice: l’être humain
  alternative: l’homme
  rationale: Le terme vise ici l’humanité en général et non un homme de sexe masculin. «L’être humain» rend clairement cette portée représentative en français moderne sans modifier le référent.
- issue: Rapport syntaxique de מִשָּׁמֶן
  choice: 'comparaison: «plus que l’huile»'
  alternative: 'moyen ou source: «avec/par l’huile»'
  rationale: La préposition מִן permet les deux analyses. La lecture comparative produit une phrase cohérente où le vin fait rayonner le visage davantage que l’huile; l’ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. La répétition de «le cœur de l’être humain» reproduit le parallélisme hébreu; «resplendir» garde la dignité et l’image lumineuse du texte.
