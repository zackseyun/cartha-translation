  variant: modern international French
source:
  edition: WLC
  text: יִ֭שְׂבְּעוּ עֲצֵ֣י יְהוָ֑ה אַֽרְזֵ֥י לְ֝בָנ֗וֹן אֲשֶׁ֣ר נָטָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: fr
  text: 'Les arbres de Yahweh sont rassasiés[a],

    les cèdres du Liban qu’il a plantés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont comblés ». Le verbe hébreu exprime le fait d’être pleinement pourvu, d’avoir tout ce qu’il faut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: sont rassasiés
  rationale: Le qal de שבע exprime ici le fait d’être pleinement pourvu ou repu. « Sont rassasiés » conserve l’image poétique appliquée aux arbres et suggère l’abondance de l’eau fournie par Dieu.
- source_word: עֲצֵי
  choice: les arbres de
  rationale: Le pluriel construit de עֵץ désigne des arbres et introduit la relation avec le nom divin qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de préserver le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אַרְזֵי לְבָנוֹן
  choice: les cèdres du Liban
  rationale: Cette expression précise en apposition quels sont les « arbres de Yahweh » évoqués dans le premier membre.
- source_word: אֲשֶׁר נָטָע
  choice: qu’il a plantés
  rationale: La proposition relative se rapporte aux cèdres. Le sujet implicite du verbe est Yahweh, et le passé composé convient au français moderne pour l’acte créateur antérieur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le nom divin; sa translittération préserve cette donnée sans la remplacer par un titre.
- issue: Métaphore de la satiété appliquée aux arbres
  choice: sont rassasiés
  alternative: sont abreuvés / sont comblés
  rationale: « Rassasiés » maintient la métaphore et la portée plus large du verbe שבע, sans réduire explicitement ce rassasiement au seul fait d’être arrosé, même si le contexte évoque l’eau.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé sur deux lignes; « rassasiés », volontairement imagé pour des arbres, respecte la personnification du texte source.
