id: PSA.104.35
reference: Psalms 104:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִתַּ֤מּוּ חַטָּאִ֨ים מִן הָ/אָ֡רֶץ וּ/רְשָׁעִ֤ים ע֤וֹד אֵינָ֗/ם בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֗ה הַֽלְלוּ יָֽהּ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: fr
  text: Que les pécheurs disparaissent de la terre[a], et que les méchants ne soient plus ! Bénis Yahweh, ô mon âme ! Alléluia ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que les pécheurs cessent d’être sur la terre » ou « arrivent à leur fin, loin de la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'En hébreu : « Louez Yah ! » « Yah » est une forme abrégée de « Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: disparaissent
  rationale: Le qal inaccompli de תמם peut exprimer le fait d'arriver à son terme ou de cesser. Dans ce souhait imprécatoire, « disparaissent de la terre » rend naturellement en français la cessation visée, sans préciser indûment le moyen de cette disparition.
- source_word: חַטָּאִים
  choice: les pécheurs
  rationale: Le terme désigne ici des personnes caractérisées par le péché, et non les péchés comme abstraction.
- source_word: מִן הָאָרֶץ
  choice: de la terre
  rationale: Le cadre cosmique et créationnel du psaume favorise « terre » plutôt que le sens localisé « pays ».
- source_word: וּרְשָׁעִים
  choice: les méchants
  rationale: Rendu substantivé courant qui conserve la désignation morale personnelle de l'hébreu.
- source_word: עוֹד אֵינָם
  choice: ne soient plus
  rationale: Cette tournure française concise restitue la cessation de présence ou d'existence et s'accorde avec la valeur de souhait du premier membre.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Bénis Yahweh, ô mon âme
  rationale: « Bénis » conserve le sens de ברך lorsque Dieu est l'objet ; « ô mon âme » maintient l'adresse à soi-même et le registre poétique du refrain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération représente directement le nom divin plutôt que de lui substituer un titre.
- source_word: הַלְלוּ יָהּ
  choice: Alléluia
  rationale: Forme liturgique traditionnelle et bien comprise en français ; une note en explicite le sens littéral et le nom abrégé Yah.
theological_decisions:
- issue: Le souhait concerne-t-il les péchés ou les pécheurs eux-mêmes ?
  choice: Le texte parle de la disparition des pécheurs et de la fin des méchants.
  alternative: Que les péchés disparaissent de la terre.
  rationale: חַטָּאִים et רְשָׁעִים sont ici des désignations personnelles. La traduction ne transforme donc pas l'imprécation en simple souhait portant sur le péché abstrait ; le subjonctif préserve toutefois sa forme de souhait plutôt que d'en faire un ordre direct.
- issue: Portée exacte de יִתַּמּוּ
  choice: disparaissent
  alternative: arrivent à leur fin / soient anéantis
  rationale: Le verbe indique qu'ils cessent ou arrivent à leur terme, sans imposer à lui seul une description précise du processus. « Disparaissent » maintient cette relative indétermination dans un français naturel.
translation_notes:
  register: Français international moderne, poétique et digne. Le subjonctif « Que… » rend la valeur de souhait ; la ponctuation souligne le passage de l'imprécation à l'exhortation personnelle, puis à l'acclamation liturgique.
