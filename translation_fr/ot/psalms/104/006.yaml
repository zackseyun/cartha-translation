  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: fr
  text: Tu l’as couverte de l’abîme comme d’un vêtement[a] ; les eaux se tenaient au-dessus des montagnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des profondeurs » ou « de l’abîme primordial ».
    reason: Alternative lexicale pour תְּהוֹם, qui peut désigner les eaux profondes ou l’abîme océanique primordial.
lexical_decisions:
- source_word: תְּהוֹם
  choice: l’abîme
  rationale: Le nom désigne ici la masse des eaux profondes, l’abîme océanique. « L’abîme » conserve l’imagerie cosmique sans imposer une interprétation mythologique.
- source_word: כַּ/לְּבוּשׁ
  choice: comme d’un vêtement
  rationale: La préposition כְּ marque la comparaison et לְבוּשׁ désigne un vêtement. Après « couvrir », cette tournure française exprime naturellement l’image du vêtement enveloppant.
- source_word: כִּסִּיתוֹ
  choice: Tu l’avais couverte
  rationale: La forme verbale est à la deuxième personne masculine singulière, avec un suffixe objet masculin singulier. Le pronom « l’ » renvoie à la terre du verset précédent; le participe passé s’accorde donc avec « terre » en français. Le plus-que-parfait rend naturellement l’état primordial évoqué avant la suite narrative des versets 7-9.
- source_word: עַל
  choice: au-dessus de
  rationale: Avec les montagnes, עַל indique que les eaux se trouvent plus haut qu’elles; « au-dessus de » exprime clairement cette relation spatiale.
- source_word: הָרִים
  choice: les montagnes
  rationale: הָרִים désigne normalement les montagnes et maintient l’ampleur de la scène de création.
- source_word: יַעַמְדוּ
  choice: se tenaient
  rationale: עמד signifie littéralement « se tenir, être debout ». Appliqué aux eaux, « se tenaient » préserve l’image vive tout en restant naturel en français.
- source_word: מָיִם
  choice: les eaux
  rationale: « Les eaux » reprend la masse aqueuse introduite par תְּהוֹם et convient au parallélisme poétique.
theological_decisions:
- issue: Personne du verbe et destinataire
  choice: 'Adresse directe à Dieu : « Tu l’avais couverte »'
  alternative: 'Narration à la troisième personne : « Il l’avait couverte »'
  rationale: La morphologie hébraïque est sans ambiguïté à la deuxième personne masculine singulière, et le contexte s’adresse directement au Seigneur. La deuxième personne conserve la structure de louange du psaume.
- issue: Référent du suffixe objet
  choice: Le pronom « l’ » renvoie à la terre mentionnée au verset 5
  alternative: Comprendre implicitement l’ensemble de la création ou le sol ferme
  rationale: Le suffixe masculin singulier reprend naturellement אֶרֶץ, nom grammaticalement masculin en hébreu. En français, ce référent devient le féminin « terre », d’où l’accord « couverte ».
translation_notes:
  register: Français international moderne, poétique et digne. L’imparfait « se tenaient » décrit l’état des eaux, tandis que le plus-que-parfait « avais couverte » situe l’action divine antérieurement à cet état et à leur retrait raconté ensuite.
