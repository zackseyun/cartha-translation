  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: fr
  text: Que la gloire de Yahweh[a] demeure pour toujours ! Que Yahweh se réjouisse de ses œuvres[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu porte ici le nom divin YHWH, traditionnellement rendu par « le Seigneur ».
    reason: nom_divin
  - marker: b
    text: 'Ou : « se réjouisse dans ses œuvres ». La préposition hébraïque peut exprimer une relation légèrement différente.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: יְהִי ... לְעוֹלָם
  choice: demeure pour toujours
  rationale: Le jussif exprime un souhait. « Demeure pour toujours » restitue naturellement en français l’idée que cette gloire soit à jamais, sans la formulation peu idiomatique « soit pour toujours ».
- source_word: כְבוֹד
  choice: gloire
  rationale: « Gloire » est le terme français usuel dans ce contexte doxologique et rend la splendeur et la majesté associées à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie le nom divin YHWH ; « Yahweh » le rend comme nom propre plutôt que de lui substituer un titre.
- source_word: יִשְׂמַח
  choice: se réjouisse
  rationale: La forme verbale, parallèle au souhait de la première proposition, appelle ici le subjonctif français introduit par « que ».
- source_word: בְּמַעֲשָׂיו
  choice: de ses œuvres
  rationale: Dans le contexte du psaume, מַעֲשֶׂה désigne les œuvres créées de Dieu. Après « se réjouir », la préposition française idiomatique est « de ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. La translittération préserve cette donnée tout en signalant en note l’usage traditionnel français.
translation_notes:
  register: Français actuel, digne et poétique. Les deux souhaits parallèles sont rendus par « Que… ! ». « Demeure » évite la raideur de « soit pour toujours » tout en conservant la portée durative de לְעוֹלָם.
