  text: כֻּ֭לָּ/ם אֵלֶ֣י/ךָ יְשַׂבֵּר֑וּ/ן לָ/תֵ֖ת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/027.yaml
  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: fr
  text: Tous attendent de toi[a] que tu leur donnes leur nourriture au moment voulu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tous regardent vers toi avec attente » ou « espèrent en toi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en temps voulu » ou « au moment opportun ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Tous
  rationale: Le terme reprend l’ensemble des créatures évoquées dans le contexte et conserve naturellement en français sa portée collective.
- source_word: אֵלֶיךָ
  choice: sur toi
  rationale: Avec le verbe שׂבר, la préposition marque l’orientation de l’attente vers celui dont les créatures dépendent; « compter sur toi » l’exprime idiomatiquement.
- source_word: יְשַׂבֵּרוּן
  choice: comptent
  rationale: Le piel de שׂבר exprime ici une attente confiante et dépendante. « comptent sur toi » est naturel et laisse les variantes « attendent de toi » et « espèrent en toi » en note.
- source_word: לָתֵת
  choice: pour que tu leur donnes
  rationale: L’infinitif indique ce que les créatures attendent de Dieu; cette tournure française rend clairement la relation syntaxique.
- source_word: אָכְלָם
  choice: leur nourriture
  rationale: Le nom désigne de façon générale ce qui sert de nourriture, ce qui convient à toutes les créatures du contexte.
- source_word: בְּעִתּוֹ
  choice: au moment voulu
  rationale: L’expression désigne le moment approprié ou fixé. « au moment voulu » est actuel et naturel sans préciser indûment qui fixe ce moment.
theological_decisions:
- issue: La providence divine dans la création
  choice: Le verset présente toutes les créatures comme dépendant de Dieu pour leur nourriture.
  alternative: Accentuer explicitement leur confiance en Dieu ou leur attitude d’adoration.
  rationale: Le texte décrit une attente orientée vers Dieu, qui pourvoit à la nourriture, sans ajouter de formulation doctrinale plus forte que l’hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’attente dépendante exprimée par שׂבר et rend בְּעִתּוֹ sans archaïsme ni précision théologique ajoutée.
