source:
  edition: WLC
  text: הַ/מַּבִּ֣יט לָ֭/אָרֶץ וַ/תִּרְעָ֑ד יִגַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/032.yaml
  text: He looks at the earth[a], and it trembles; he touches the mountains, and they smoke.
translation:
  language: fr
  text: Il regarde la terre[a], et elle tremble ; il touche les montagnes, et elles fument.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Celui qui regarde la terre, et elle tremble ; il touche les montagnes, et elles fument. »'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Il regarde
  rationale: Le participe hifil substantivé décrit Dieu comme « celui qui regarde ». En français poétique, « Il regarde » est naturel, direct et conserve l’aspect vivant de la scène.
- source_word: לָאָרֶץ
  choice: la terre
  rationale: אֶרֶץ peut désigner un pays ou la terre. Le cadre cosmique et créationnel du psaume favorise ici « la terre ».
- source_word: וַתִּרְעָד
  choice: et elle tremble
  rationale: Le verbe רעד exprime le tremblement ou l’ébranlement. « Elle tremble » respecte le sujet féminin singulier et préserve la sobriété poétique.
- source_word: יִגַּע
  choice: il touche
  rationale: נגע signifie couramment « toucher ». Ce choix souligne que le simple contact divin suffit à faire fumer les montagnes.
- source_word: בֶּהָרִים
  choice: les montagnes
  rationale: הָרִים désigne normalement les montagnes ; ce terme maintient la force de l’image.
- source_word: וְיֶעֱשָׁנוּ
  choice: et elles fument
  rationale: Le verbe עשׁן signifie « fumer » et son pluriel correspond aux montagnes. La formulation est concise et imagée.
theological_decisions:
- issue: Sujet divin implicite dans la proposition participiale
  choice: Employer « Il », qui renvoie à Dieu dans le contexte.
  alternative: 'Traduire plus formellement : « Celui qui regarde la terre, et elle tremble… »'
  rationale: Le contexte du psaume établit clairement le référent divin. Le pronom donne une phrase française naturelle sans ajouter une précision doctrinale étrangère au texte.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme ainsi que la répétition de « et » sont conservés pour restituer le rythme et l’enchaînement du texte hébreu.
