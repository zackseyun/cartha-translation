  text: where the birds make their nests[a]; the stork has its home in the cypresses.
translation:
  language: fr
  text: Là, les oiseaux font leurs nids ; la cigogne a sa demeure dans les cyprès[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sapins », « genévriers » ou une autre espèce de conifères ; l’espèce exacte désignée par le mot hébreu est incertaine.
