lexical_decisions:
- source_word: אֲשֶׁר שָׁם
  choice: Là
  rationale: La combinaison renvoie aux arbres mentionnés au verset précédent et situe naturellement l’action en français.
- source_word: צִפֳּרִים
  choice: les oiseaux
  rationale: Terme général désignant les oiseaux ; l’article défini convient à cette évocation générique.
- source_word: יְקַנֵּנוּ
  choice: font leurs nids
  rationale: Le verbe קנן signifie « nicher, faire un nid » ; cette formulation est claire et naturelle en français moderne.
- source_word: חֲסִידָה
  choice: la cigogne
  rationale: Identification lexicale usuelle du nom hébreu ; le singulier représentatif est conservé.
- source_word: בְּרוֹשִׁים
  choice: les cyprès
  rationale: Le mot désigne vraisemblablement un conifère, mais l’espèce exacte demeure incertaine ; « cyprès » est une traduction traditionnelle et plausible, avec une note signalant les autres possibilités.
- source_word: בֵּיתָהּ
  choice: a sa demeure
  rationale: Littéralement « sa maison » ; « a sa demeure » exprime naturellement le lieu où vit l’oiseau tout en gardant l’image du texte.
