source:
  edition: WLC
  text: הַ֥/מְקָרֶֽה בַ/מַּ֗יִם עֲֽלִיּ֫וֹתָ֥י/ו הַ/שָּׂם עָבִ֥ים רְכוּב֑/וֹ הַֽ֝/מְהַלֵּ֗ךְ עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/003.yaml
  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: fr
  text: 'lui qui pose sur les eaux les poutres de ses chambres hautes,

    qui fait des nuages son char,

    qui marche sur les ailes du vent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les ailes du souffle » ou « sur les ailes de l’esprit ». Le mot hébreu peut désigner le vent, le souffle ou l’esprit; « vent » est retenu ici en raison des images météorologiques du contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: qui pose … les poutres
  rationale: Le participe de קרה évoque la pose de poutres ou la construction d’un toit. Cette formulation conserve l’image architecturale concrète tout en restant intelligible en français.
- source_word: בַמַּיִם
  choice: sur les eaux
  rationale: La préposition ב peut signifier « dans », « avec » ou, selon la relation spatiale exprimée, « sur ». Dans cette image cosmique de chambres hautes bâties au-dessus des eaux, « sur les eaux » donne le sens poétique le plus naturel sans effacer entièrement l’étrangeté de l’image.
- source_word: עֲלִיּוֹתָיו
  choice: ses chambres hautes
  rationale: עֲלִיּוֹת désigne des pièces situées à l’étage ou en hauteur. « Chambres hautes » préserve ici leur dimension architecturale et cosmique.
- source_word: הַשָּׂם
  choice: qui fait … son char
  rationale: Avec les nuages comme objet et le char comme attribut, « faire de » rend naturellement en français le sens de שׂים, « placer, établir, faire de ».
- source_word: עָבִים
  choice: les nuages
  rationale: Le terme désigne des nuages, souvent épais. Le contexte suffit à évoquer leur masse, sans qu’il soit nécessaire d’ajouter un qualificatif absent de la forme française la plus directe.
- source_word: רְכוּבוֹ
  choice: son char
  rationale: Le nom évoque ce qui sert à chevaucher ou à se déplacer, notamment un char. « Son char » convient à l’image théophanique et demeure clair pour le lecteur moderne.
- source_word: הַמְהַלֵּךְ
  choice: qui marche
  rationale: Le participe de הלך exprime le fait de marcher ou d’aller. « Marche » maintient la personnification poétique vive du texte.
- source_word: כַּנְפֵי
  choice: les ailes
  rationale: כָּנָף peut désigner une aile, un bord ou une extrémité. Associé au vent et au mouvement, « ailes » restitue l’image poétique la plus probable.
- source_word: רוּחַ
  choice: du vent
  rationale: רוּחַ peut signifier vent, souffle ou esprit. L’environnement immédiat — eaux, nuages, char et ailes — favorise ici le phénomène météorologique, tout en justifiant de signaler l’autre possibilité en note.
theological_decisions:
- issue: Sens de רוּחַ dans le dernier membre
  choice: vent
  alternative: souffle ou esprit
  rationale: Les images météorologiques du contexte favorisent « vent ». La polysémie du mot hébreu est néanmoins réelle; la note la préserve sans imposer au verset une référence explicite à l’Esprit divin.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme en trois membres est conservé. « Chambres hautes » et « pose les poutres » maintiennent l’image architecturale sans recourir à un vocabulaire archaïque. Le marqueur de note est placé après « vent », terme auquel porte l’ambiguïté.
