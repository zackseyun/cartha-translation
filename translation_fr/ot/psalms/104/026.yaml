  text: שָׁ֭ם אֳנִיּ֣וֹת יְהַלֵּכ֑וּ/ן לִ֝וְיָתָ֗ן זֶֽה יָצַ֥רְתָּ לְ/שַֽׂחֶק בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/026.yaml
  text: There the ships move about[a], and Leviathan, which you formed to play in it.
translation:
  language: fr
  text: Là circulent les navires, et le Léviathan que tu as façonné pour jouer dans la mer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et le Léviathan que tu as façonné pour que tu joues avec lui ». Certains comprennent que Dieu joue avec le Léviathan, plutôt que le Léviathan joue dans la mer.'
    reason: Lecture alternative du référent de בּוֹ et du sujet implicite de « jouer ».
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: Adverbe de lieu renvoyant à la mer du verset précédent; « Là » est simple et naturel.
- source_word: אֳנִיּוֹת
  choice: les navires
  rationale: Désigne des bâtiments qui vont en mer; l’article défini convient en français pour évoquer cette catégorie dans la mer déjà mentionnée.
- source_word: יְהַלֵּכוּן
  choice: circulent
  rationale: La forme exprime le mouvement habituel des navires; « circulent » restitue ce mouvement sans archaïsme.
- source_word: לִוְיָתָן
  choice: le Léviathan
  rationale: La translittération conserve la désignation poétique et ses échos dans les autres textes bibliques.
- source_word: זֶה
  choice: que
  rationale: Le démonstratif hébreu s’intègre naturellement en français sous la forme d’une proposition relative rattachée au Léviathan.
- source_word: יָצַרְתָּ
  choice: tu as façonné
  rationale: Le verbe יצר évoque l’action de donner forme; « façonné » en garde la nuance concrète.
- source_word: לְשַׂחֶק
  choice: pour jouer
  rationale: L’infinitif exprime ici une activité ludique; « jouer » est clair, vivant et fidèle à l’image poétique.
- source_word: בּוֹ
  choice: dans la mer
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à la mer du contexte. La répétition explicite de « la mer » évite en français l’ambiguïté artificielle de « en elle ».
theological_decisions:
- issue: Référent de בּוֹ après לְשַׂחֶק
  choice: Le Léviathan a été façonné pour jouer dans la mer.
  alternative: Le Léviathan a été façonné pour que Dieu joue avec lui.
  rationale: Le contexte immédiat nomme la mer comme lieu où circulent les navires, ce qui favorise une lecture locative où le Léviathan y joue. La syntaxe et le suffixe permettent toutefois une autre compréhension ancienne, selon laquelle Dieu joue avec le Léviathan; cette ambiguïté réelle est préservée en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. « Circulent » rend le mouvement continu des navires; « façonné » conserve l’image concrète de יצר. La mer est explicitée dans le texte principal pour une lecture française naturelle, tandis que l’autre analyse possible est donnée en note.
