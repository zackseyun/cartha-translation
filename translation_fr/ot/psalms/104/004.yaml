id: PSA.104.4
reference: Psalms 104:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: fr
  text: Il fait de ses messagers des vents[a], de ses serviteurs un feu flamboyant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il fait de ses anges des esprits, de ses serviteurs un feu flamboyant. » Le mot hébreu traduit par « vents » peut aussi signifier « esprits ». Hébreux 1.7 reprend cette lecture traditionnelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׂה
  choice: Il fait de…
  rationale: Le participe décrit ici l’action caractéristique de Dieu. La construction française « faire de X Y » rend naturellement la relation entre les forces créées et leur fonction.
- source_word: מַלְאָכָיו
  choice: ses messagers
  rationale: מַלְאָךְ peut désigner un messager humain ou céleste. « Messagers » conserve cette portée lexicale sans imposer d’emblée « anges ».
- source_word: רוּחוֹת
  choice: des vents
  rationale: רוּחַ peut signifier « vent », « souffle » ou « esprit ». Le contexte cosmique du psaume et le parallélisme avec le feu favorisent ici « vents », tout en laissant l’autre lecture en note.
- source_word: מְשָׁרְתָיו
  choice: ses serviteurs
  rationale: Le terme désigne ceux qui assurent un service. En français courant, « serviteurs » est plus naturel que « ministres » dans cette image poétique et exprime clairement leur fonction au service de Dieu.
- source_word: אֵשׁ לֹהֵט
  choice: des flammes de feu
  rationale: L’expression désigne un feu ardent ou flamboyant. « Flammes de feu » restitue avec vigueur l’image élémentaire et forme un parallélisme naturel avec « vents ».
theological_decisions:
- issue: Le verset décrit-il les vents et les flammes comme agents de Dieu, ou les anges comme des esprits et une flamme de feu ?
  choice: « Il fait des vents ses messagers, des flammes de feu ses serviteurs. »
  alternative: « Il fait de ses anges des esprits, et de ses serviteurs une flamme de feu. »
  rationale: L’ordre et les fonctions syntaxiques de l’hébreu peuvent être compris de plusieurs manières, tandis que מַלְאָךְ et רוּחַ sont eux-mêmes polysémiques. Le contexte de la création dans le Psaume 104 favorise les forces naturelles employées comme agents de Dieu. La note préserve la lecture traditionnelle reprise en Hébreux 1.7.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation concrète suit le contexte cosmique du psaume, tandis que la note conserve l’ambiguïté lexicale et la réception traditionnelle du verset.
