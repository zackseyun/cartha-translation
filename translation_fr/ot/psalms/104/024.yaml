source:
  edition: WLC
  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: fr
  text: Que tes œuvres sont nombreuses, Yahweh ! Tu les as toutes faites avec sagesse ; la terre est pleine de tes créatures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tes biens » ou « de ce qui t’appartient ». Le terme hébreu peut désigner ce que l’on acquiert ou possède ; ici, il peut englober tout ce que Dieu a fait.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: Que… sont nombreuses
  rationale: Cette tournure exclamative française exprime naturellement l’abondance et la multiplicité des œuvres, sans déplacer le sens vers leur seule grandeur.
- source_word: מַעֲשֶׂיךָ
  choice: tes œuvres
  rationale: « Œuvres » rend directement le terme dans ce contexte de création et conserve sa dignité poétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כֻּלָּם
  choice: les… toutes
  rationale: Le pronom reprend « tes œuvres » et garde la portée totalisante de l’hébreu.
- source_word: בְּחָכְמָה
  choice: avec sagesse
  rationale: Cette formulation française naturelle conserve le nom « sagesse » et présente celle-ci comme la manière dont Dieu a créé.
- source_word: עָשִׂיתָ
  choice: tu… as faites
  rationale: Le passé composé exprime naturellement en français l’action créatrice accomplie dont le résultat demeure visible.
- source_word: מָלְאָה הָאָרֶץ
  choice: la terre est pleine de
  rationale: Le parfait hébreu décrit ici un état résultant et présent ; « la terre » convient à la portée universelle de l’hymne de la création.
- source_word: קִנְיָנֶךָ
  choice: tes créatures
  rationale: Dans ce contexte consacré aux êtres et aux choses que Dieu a faits, « créatures » exprime clairement le référent probable. Une note conserve toutefois le sens lexical plus large de ce qui est acquis ou possédé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération le distingue des titres et préserve sa fonction de nom personnel.
- issue: Portée de קִנְיָנֶךָ
  choice: tes créatures
  alternative: tes biens / ce qui t’appartient
  rationale: Le contexte immédiat favorise les choses créées par Dieu, mais le terme hébreu met aussi en jeu l’acquisition ou la possession. La note maintient cette tension lexicale sans alourdir le verset.
translation_notes:
  register: Français international moderne, poétique et digne. L’exclamation « Que… sont nombreuses » est idiomatique, tandis que le parallélisme et la concision du vers hébreu sont préservés.
