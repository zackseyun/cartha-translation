source:
  edition: WLC
  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: fr
  text: Bénis Yahweh[a], ô mon âme ! Yahweh, mon Dieu, tu es très grand ; tu t’es revêtu de splendeur et de majesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom personnel de Dieu, également transcrit « Yahvé » et traditionnellement rendu par « le SEIGNEUR ».'
    reason: Préciser la forme hébraïque et les principaux usages de traduction du nom divin.
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Bénis
  rationale: L’impératif féminin singulier s’adresse à נֶפֶשׁ, nom féminin. « Bénis » conserve l’exhortation cultuelle précise de ברך, plutôt que le sens plus général de « loue ».
- source_word: נַפְשִׁי
  choice: ô mon âme
  rationale: Conserve l’adresse directe du psalmiste à son être intérieur. Le « ô » marque naturellement le vocatif dans un registre poétique digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel représenté par le tétragramme, sans le remplacer par un titre.
- source_word: יְהוָה אֱלֹהַי
  choice: Yahweh, mon Dieu
  rationale: La virgule rend clairement l’apostrophe tout en conservant l’ordre et le lien personnel exprimé par le suffixe possessif.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: tu es infiniment grand
  rationale: Le parfait de גדל a ici une valeur stative dans la louange. « Infiniment grand » exprime avec naturel l’intensification de מְאֹד sans suggérer que Dieu serait devenu grand.
- source_word: הוֹד וְהָדָר
  choice: splendeur et majesté
  rationale: Ce binôme rend les deux termes parallèles de magnificence visible et royale tout en convenant à l’image du vêtement.
- source_word: לָבָשְׁתָּ
  choice: tu t’es revêtu de
  rationale: Préserve l’aspect accompli et la métaphore vestimentaire ; le tour pronominal est idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » préserve le nom personnel et le distingue du titre אֲדֹנָי, sans imposer une lecture confessionnelle particulière.
- issue: Valeur temporelle de גָּדַלְתָּ
  choice: 'présent statif : « tu es infiniment grand »'
  alternative: 'accompli dynamique : « tu es devenu très grand »'
  rationale: Dans cette adresse de louange, le parfait décrit naturellement un état ou une qualité permanente. Le traduire par un devenir risquerait d’introduire une évolution de la grandeur divine que le contexte n’affirme pas.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et orale, tandis que « ô mon âme » et « se revêtir de » maintiennent l’élévation du psaume sans archaïsme excessif.
