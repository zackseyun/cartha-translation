source:
  edition: WLC
  text: תִּזְרַ֣ח הַ֭/שֶּׁמֶשׁ יֵאָסֵפ֑וּ/ן וְ/אֶל מְ֝עוֹנֹתָ֗/ם יִרְבָּצֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/022.yaml
  text: The sun rises[b][a]; they gather themselves and lie down in their dens.
translation:
  language: fr
  text: Le soleil se lève ; ils se retirent[a] et se couchent dans leurs tanières[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils sont rassemblés » ou « ils se regroupent ». Le verbe hébreu peut être compris au passif (« être rassemblés ») ou dans un sens réfléchi ou intransitif (« se retirer »).
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs repaires » ou « leurs demeures ». Le mot hébreu désigne un lieu d’habitation ; le contexte animal favorise « tanières ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרַח
  choice: se lève
  rationale: Le qal inaccompli de זרח, avec « le soleil » pour sujet, décrit ici le lever du soleil. « Se lève » est l’expression française naturelle dans cette séquence temporelle.
- source_word: הַשֶּׁמֶשׁ
  choice: le soleil
  rationale: Traduction directe du nom défini.
- source_word: יֵאָסֵפוּן
  choice: ils se retirent
  rationale: Le nifal de אסף peut exprimer le fait d’être rassemblé ou de se retirer. Dans le contexte des animaux nocturnes qui regagnent leur abri au lever du jour, « se retirent » rend naturellement le mouvement sans introduire un agent extérieur.
- source_word: וְאֶל
  choice: et… dans
  rationale: La préposition אֶל indique littéralement une direction vers les abris. En français, après « se retirent », la position où les animaux se couchent s’exprime naturellement par « dans ».
- source_word: מְעוֹנֹתָם
  choice: leurs tanières
  rationale: מָעוֹן désigne une demeure ou un lieu d’habitation. Dans ce contexte animal, « tanières » est précis, courant et naturel.
- source_word: יִרְבָּצוּן
  choice: se couchent
  rationale: Le qal de רבץ décrit couramment des animaux qui se couchent ou restent tapis. « Se couchent » convient à leur repos diurne dans leurs tanières.
theological_decisions: []
