  text: מִן גַּעֲרָ֣תְ/ךָ֣ יְנוּס֑וּ/ן מִן ק֥וֹל רַֽ֝עַמְ/ךָ֗ יֵחָפֵזֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: fr
  text: À ta réprimande, elles fuient[a] ; au son de ton tonnerre, elles s’éloignent en hâte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elles prennent la fuite ; au son de ton tonnerre, elles se hâtent ».'
    reason: Alternative lexicale pour נוּס et חפז, qui peuvent respectivement exprimer la fuite et un mouvement hâtif.
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: ta réprimande
  rationale: Le nom גְּעָרָה désigne une parole ferme qui réprimande et, ici, manifeste l’autorité de Dieu sur les eaux. « Réprimande » est naturel en français et conserve cette force sans introduire l’idée plus spécifique d’une menace.
- source_word: יְנוּסוּן
  choice: elles s’enfuient
  rationale: Le verbe נוּס signifie « fuir, prendre la fuite ». Le présent de narration convient au tableau poétique du psaume et exprime directement la retraite des eaux.
- source_word: קוֹל
  choice: au grondement de
  rationale: קוֹל peut signifier « voix », « son » ou « bruit ». Avec le tonnerre, « grondement » forme une expression française naturelle et restitue l’image auditive avec vigueur.
- source_word: רַעַמְךָ
  choice: ton tonnerre
  rationale: רַעַם désigne directement le tonnerre. Le possessif maintient l’attribution poétique de cette puissance à Dieu.
- source_word: יֵחָפֵזוּן
  choice: elles se précipitent au loin
  rationale: חפז exprime un mouvement hâtif, parfois marqué par l’alarme. « Se précipitent au loin » rend la rapidité du départ sans imposer explicitement la nuance de panique.
- source_word: מִן ... מִן
  choice: À ... au
  rationale: Bien que מִן signifie fondamentalement « de, depuis », les deux occurrences indiquent ici la cause ou le signal provoquant la fuite. « À » et « au » rendent naturellement en français la réaction immédiate à la réprimande et au tonnerre.
theological_decisions:
- issue: Référent des verbes au pluriel
  choice: Conserver le sujet pronominal « elles », qui renvoie aux eaux du contexte précédent.
  alternative: 'Expliciter : « les eaux s’enfuient »'
  rationale: L’hébreu laisse le sujet implicite et dépend du contexte. Le pronom français respecte cette continuité poétique sans ajouter dans le verset un nom absent de l’original.
- issue: Valeur temporelle des formes verbales poétiques
  choice: 'Présent de narration : « s’enfuient » et « se précipitent »'
  alternative: 'Passé composé ou passé simple : « se sont enfuies » / « s’enfuirent »'
  rationale: Les formes hébraïques peuvent être comprises dans la représentation poétique d’un événement primordial. Le présent rend le tableau vivant et s’accorde naturellement avec la description du contexte, sans trancher excessivement entre récit passé et évocation actuelle.
translation_notes:
  register: 'Français international moderne, poétique et digne. La répétition sonore de « ton tonnerre » est assumée : elle reste claire et reflète directement le possessif hébreu. Le féminin pluriel renvoie naturellement aux « eaux » dans le contexte.'
