  variant: modern international French
source:
  edition: WLC
  text: מַשְׁקֶ֣ה הָ֭רִים מֵ/עֲלִיּוֹתָ֑י/ו מִ/פְּרִ֥י מַ֝עֲשֶׂ֗י/ךָ תִּשְׂבַּ֥ע הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/013.yaml
  text: He waters the mountains from his upper chambers[a]; the earth is satisfied with the fruit of your works.
translation:
  language: fr
  text: Il abreuve les montagnes depuis ses chambres hautes ; la terre se rassasie du fruit de tes œuvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Il abreuve
  rationale: Le participe hiphil de שׁקה exprime l’action causative de donner à boire. En français, « il abreuve » est naturel et permet d’expliciter le sujet divin indiqué par le contexte.
- source_word: הָרִים
  choice: les montagnes
  rationale: « Montagnes » rend le sens courant du terme et conserve l’article défini hébreu.
- source_word: מֵעֲלִיּוֹתָיו
  choice: depuis ses chambres hautes
  rationale: עֲלִיּוֹת désigne des pièces situées en hauteur. Cette formulation maintient l’image architecturale cosmique du psaume ainsi que le possessif de troisième personne.
- source_word: מִפְּרִי
  choice: du fruit de
  rationale: La préposition מִן peut signaler ici la source ou ce qui procure le rassasiement. « Du fruit de » reste proche de la formulation hébraïque sans imposer une distinction artificielle entre source et moyen.
- source_word: מַעֲשֶׂיךָ
  choice: tes œuvres
  rationale: « Œuvres » conserve la portée large du pluriel hébreu et peut désigner ici l’activité créatrice de Dieu.
- source_word: תִּשְׂבַּע
  choice: se rassasie
  rationale: Le verbe שׂבע exprime le fait d’avoir pleinement de quoi se nourrir ou boire. Le présent convient au tableau descriptif du psaume.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Dans ce psaume consacré à la création, « la terre » convient mieux que le sens plus local « le pays ».
theological_decisions:
- issue: Sujet divin implicite du participe
  choice: Il abreuve les montagnes
  alternative: Abreuvant les montagnes
  rationale: Le sujet n’est pas exprimé dans ce verset, mais le contexte précédent désigne Dieu. Le pronom rend la phrase française complète sans introduire de nouvelle affirmation théologique.
- issue: Passage de la troisième à la deuxième personne
  choice: ses chambres hautes… tes œuvres
  alternative: tes chambres hautes… tes œuvres
  rationale: Le texte massorétique passe bien du suffixe de troisième personne dans מֵעֲלִיּוֹתָיו au suffixe de deuxième personne dans מַעֲשֶׂיךָ. Cette variation est conservée plutôt qu’harmonisée.
translation_notes:
  register: Français international moderne, digne et accessible. « Chambres hautes » préserve l’image poétique et architecturale sans archaïsme marqué. Le parallélisme et le changement de personne du texte hébreu sont maintenus.
