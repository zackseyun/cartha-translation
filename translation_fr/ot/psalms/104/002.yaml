source:
  edition: WLC
  text: עֹֽטֶה א֭וֹר כַּ/שַּׂלְמָ֑ה נוֹטֶ֥ה שָׁ֝מַ֗יִם כַּ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/002.yaml
  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: fr
  text: Tu t’enveloppes de lumière comme d’un vêtement, tu déploies les cieux comme une tenture.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une toile de tente ». Le mot hébreu peut désigner une pièce d’étoffe employée comme tenture dans une tente ou dans le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: Il s’enveloppe de
  rationale: Le participe qal décrit Dieu de manière vive et continue. « S’enveloppe de » rend naturellement en français la valeur réfléchie suggérée par l’image, sans répéter prématurément le terme « vêtement ».
- source_word: אוֹר
  choice: lumière
  rationale: Le nom désigne ici la lumière elle-même, présentée métaphoriquement comme ce dont Dieu se couvre; aucune abstraction comme « splendeur » n’est nécessaire.
- source_word: כַּשַּׂלְמָה
  choice: comme d’un vêtement
  rationale: שַׂלְמָה désigne un vêtement ou manteau. « Vêtement » conserve la généralité du terme hébreu et s’intègre à la construction française « s’envelopper de… comme de… ».
- source_word: נוֹטֶה
  choice: il déploie
  rationale: Le participe qal de נטה exprime l’action d’étendre ou de déployer. « Déploie » est naturel pour l’image cosmique et maintient son dynamisme poétique.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel hébreu peut désigner le ciel ou les cieux. « Les cieux » préserve ici le registre élevé et la portée cosmique du psaume.
- source_word: כַּיְרִיעָה
  choice: comme une tenture
  rationale: יְרִיעָה désigne une pièce d’étoffe étendue, notamment une tenture de tente ou du sanctuaire. « Tenture » conserve mieux que « rideau » l’image d’une vaste étoffe déployée; la nuance possible de tente est signalée en note.
theological_decisions:
- issue: Description anthropomorphique de Dieu qui se vêt de lumière et déploie les cieux
  choice: Conserver directement les images poétiques
  alternative: Paraphraser par « la lumière l’entoure » ou « la lumière manifeste sa splendeur »
  rationale: Le texte hébreu dépeint vivement la majesté et l’action créatrice de Dieu. Garder la métaphore respecte sa forme poétique sans y introduire d’explication doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. La structure en deux propositions parallèles conserve le mouvement des participes hébreux. Le pronom de troisième personne suit la syntaxe immédiate de ce fragment hébreu.
