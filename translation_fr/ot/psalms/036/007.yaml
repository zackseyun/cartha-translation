  text: מַה יָּקָ֥ר חַסְדְּ/ךָ֗ אֱלֹ֫הִ֥ים וּ/בְנֵ֥י אָדָ֑ם בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ יֶחֱסָיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/007.yaml
  text: How precious is your steadfast love[b][a], O God! The children of man take refuge in the shadow of your wings.
translation:
  language: fr
  text: Que ton amour fidèle est précieux, ô Dieu ! Les êtres humains[a] trouvent refuge à l’ombre de tes ailes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils des hommes » ; l’expression désigne ici les êtres humains en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יָּקָר
  choice: Combien … est précieux
  rationale: מַה introduit ici une exclamation admirative, et יקר exprime ce qui est de grand prix. Cette tournure conserve naturellement en français la force poétique de l’hébreu.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד associe amour, fidélité, bonté et loyauté relationnelle. « Amour fidèle » en restitue plusieurs dimensions sans réduire le terme à la seule miséricorde.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. « Ô Dieu » rend clairement le vocatif dans un registre poétique digne.
- source_word: וּבְנֵי אָדָם
  choice: Les êtres humains
  rationale: L’expression idiomatique désigne collectivement les humains. Cette formulation moderne et inclusive transmet le référent général sans donner à penser qu’il s’agit uniquement d’hommes ou de descendants particuliers.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: à l’ombre de tes ailes
  rationale: La formulation conserve intacte l’image aviaire de proximité protectrice et correspond à une expression française naturelle.
- source_word: יֶחֱסָיוּן
  choice: trouvent refuge
  rationale: Le verbe חסה exprime le fait de chercher ou de prendre refuge. « Trouvent refuge » est idiomatique dans ce contexte, tout en laissant l’image de protection porter le sens.
theological_decisions:
- issue: Portée de וּבְנֵי אָדָם
  choice: Les êtres humains
  alternative: Les fils d’Adam
  rationale: La construction masculine hébraïque fonctionne comme une désignation collective de l’humanité. Le texte principal privilégie une compréhension immédiate en français, tandis que la note conserve l’idiome hébreu et son lien possible avec Adam.
- issue: Étendue sémantique de חֶסֶד
  choice: amour fidèle
  alternative: bonté ; miséricorde ; fidélité à l’alliance
  rationale: Aucun équivalent français unique ne couvre tout le champ du terme. « Amour fidèle » maintient ensemble l’affection et la constance relationnelle, sans imposer exclusivement un cadre d’alliance.
translation_notes:
  register: Français international moderne, poétique et accessible. L’apostrophe « ô Dieu » et l’image de l’ombre des ailes préservent la dignité du psaume, tandis que « les êtres humains » évite un calque obscur.
