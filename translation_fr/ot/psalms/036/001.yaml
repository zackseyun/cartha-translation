  text: נְאֻֽם פֶּ֣שַׁע לָ֭/רָשָׁע בְּ/קֶ֣רֶב לִבִּ֑/י אֵֽין פַּ֥חַד אֱ֝לֹהִ֗ים לְ/נֶ֣גֶד עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/001.yaml
  text: 'Transgression speaks to the wicked within my heart: there is no fear of God before his eyes[a][b].'
translation:
  language: fr
  text: 'Au fond de mon cœur, la révolte parle au méchant : il n’a aucune crainte de Dieu devant ses yeux[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Au fond de mon cœur, la révolte parle au méchant : aucune crainte de Dieu devant ses yeux. » Le texte hébreu dit bien « mon cœur », lecture difficile que certaines versions anciennes et modernes rendent par « son cœur » ou reformulent ainsi : « J’ai dans mon cœur un message concernant le méchant. »'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: parle
  rationale: Le nom introduit une parole solennelle, souvent un « oracle ». La formulation verbale « parle » reste naturelle en français tout en conservant l’idée d’une parole qui s’impose.
- source_word: פֶּשַׁע
  choice: la révolte
  rationale: Le terme désigne une transgression volontaire, voire une rébellion. « La révolte » préserve ici la personnification et la gravité morale sans suggérer seulement la violation technique d’une règle.
- source_word: לָרָשָׁע
  choice: au méchant
  rationale: Le לְ est compris comme marquant le destinataire de la parole. Le singulier représentatif « le méchant » correspond à la forme hébraïque.
- source_word: בְּקֶרֶב לִבִּי
  choice: Au fond de mon cœur
  rationale: Le texte massorétique porte bien le suffixe de première personne, « mon cœur ». La tournure française exprime naturellement le lieu intérieur de cette perception et maintient la lecture difficile du texte.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: il n’a aucune crainte de Dieu
  rationale: La phrase nominale hébraïque affirme l’absence de crainte révérencielle de Dieu. L’explicitation pronominale française relie naturellement cette affirmation au méchant.
- source_word: לְנֶגֶד עֵינָיו
  choice: devant les yeux
  rationale: Cette expression conserve l’image hébraïque de ce qui se trouve dans le champ de la considération. Le possessif est déjà porté en français par « il n’a » et demeure sémantiquement clair.
theological_decisions:
- issue: Perspective du difficile לִבִּי (« mon cœur »)
  choice: 'Conserver la première personne : « Au fond de mon cœur »'
  alternative: Lire ou reformuler « au fond de son cœur », ou traduire interprétativement « J’ai dans mon cœur un message concernant le méchant »
  rationale: Le texte massorétique vocalisé soutient « mon cœur ». La traduction conserve donc la tension entre la perception intérieure du psalmiste et les « yeux » du méchant, sans corriger silencieusement le texte.
- issue: Personnification de פֶּשַׁע
  choice: « la révolte parle »
  alternative: « un oracle sur la révolte » ou « je comprends que le méchant se révolte »
  rationale: La personnification rend compte de la construction la plus directe, dans laquelle la révolte prononce une parole adressée au méchant, sans réduire l’image à une explication doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. L’ordre initial met en relief « mon cœur » afin d’éviter que ce complément soit spontanément rattaché au méchant, tout en conservant la lecture massorétique et son ambiguïté de perspective.
