id: PSA.36.4
reference: Psalms 36:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: fr
  text: Sur son lit, il médite le mal[a] ; il s’engage dans une voie qui n’est pas bonne ; il ne rejette pas le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il projette l’iniquité ».'
    reason: Alternative lexicale pour אָוֶן et יַחְשֹׁב, qui peuvent mettre davantage l’accent sur l’iniquité et sur une planification délibérée.
lexical_decisions:
- source_word: אָוֶן
  choice: le mal
  rationale: Dans ce contexte, אָוֶן désigne une réalité moralement mauvaise. « Le mal » est naturel en français moderne et convient comme objet de la réflexion délibérée, tout en conservant la possibilité d’une nuance d’iniquité.
- source_word: יַחְשֹׁב
  choice: il médite
  rationale: חשב peut signifier penser, calculer ou projeter. Avec אָוֶן et la mention du lit, « médite » exprime une réflexion entretenue et orientée vers le mal sans imposer l’idée plus précise d’un complot.
- source_word: עַל מִשְׁכָּבוֹ
  choice: sur son lit
  rationale: Rendu locatif direct et idiomatique qui conserve l’image hébraïque.
- source_word: יִתְיַצֵּב
  choice: il s’engage
  rationale: La forme réfléchie exprime le fait de se placer ou de prendre position. Dans la métaphore de la voie, « s’engage » rend naturellement en français la décision délibérée de suivre cette conduite.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: dans une voie qui n’est pas bonne
  rationale: Cette formulation conserve la métaphore de la voie ainsi que la litote hébraïque « pas bonne », sans la réduire à « mauvaise voie ».
- source_word: רָע
  choice: le mal
  rationale: רָע désigne ici le mal moral, objet du verbe מאס. « Le mal » est direct, clair et conforme au registre du psaume.
- source_word: לֹא יִמְאָֽס
  choice: il ne rejette pas
  rationale: מאס peut signifier rejeter, mépriser ou avoir en horreur. « Ne rejette pas » garde l’idée fondamentale de non-répudiation sans accentuer indûment le sentiment de dégoût.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme en trois propositions est conservé, ainsi que la métaphore de la voie et la litote « qui n’est pas bonne ».
