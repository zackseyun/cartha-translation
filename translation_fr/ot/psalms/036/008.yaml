  text: יִ֭רְוְיֻ/ן מִ/דֶּ֣שֶׁן בֵּיתֶ֑/ךָ וְ/נַ֖חַל עֲדָנֶ֣י/ךָ תַשְׁקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/008.yaml
  text: They are filled from the richness of your house[b][a], and you give them drink from the river of your delights.
translation:
  language: fr
  text: Ils se rassasient de l’abondance de ta maison[a], et tu les fais boire au torrent de tes délices[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Ils boivent à satiété de l’abondance de ta maison. »'
    reason: lexical_alternative
  - marker: b
    text: « Tes délices » peuvent aussi se traduire par « tes plaisirs » ; l’hébreu peut également faire écho à Éden.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיֻן
  choice: Ils se rassasient
  rationale: Le qal inaccompli de רוה exprime le fait d’être pleinement abreuvé ou comblé. « Se rassasient » rend naturellement en français cette idée de satiété abondante, sans préciser à tort qu’il s’agit seulement de nourriture.
- source_word: מִדֶּשֶׁן
  choice: des richesses
  rationale: דֶּשֶׁן désigne littéralement la graisse, puis figurativement la richesse et l’abondance. « Richesses » conserve ici la valeur positive de profusion sans produire une image maladroite en français moderne.
- source_word: בֵּיתֶךָ
  choice: de ta maison
  rationale: Le mot signifie simplement « maison ». Cette traduction préserve l’image et n’impose ni « temple », ni « demeure céleste », ni « maisonnée ».
- source_word: וְנַחַל
  choice: au torrent
  rationale: נַחַל peut désigner un cours d’eau, un torrent ou une rivière. « Torrent » évoque un courant abondant et correspond bien à la poésie du verset.
- source_word: עֲדָנֶיךָ
  choice: de tes délices
  rationale: Le terme exprime les délices, les plaisirs ou l’agrément. « Tes délices » conserve le lien lexical possible avec Éden sans l’expliciter dans le corps du texte.
- source_word: תַשְׁקֵם
  choice: tu les fais boire
  rationale: Le hifil de שקה signifie « faire boire » ou « donner à boire ». La formulation retenue rend clairement l’action causative et l’initiative divine.
theological_decisions:
- issue: L’image de la « maison » de Dieu
  choice: Conserver « ta maison » sans en préciser le référent
  alternative: « ton temple », « ta maisonnée » ou « ta demeure »
  rationale: L’hébreu maintient une image poétique assez large. La traduire par « temple » ou par une demeure céleste trancherait une ambiguïté que le texte ne résout pas.
- issue: La possible évocation d’Éden
  choice: Employer « tes délices » dans le texte et signaler l’écho possible en note
  alternative: Traduire explicitement par « ton Éden » ou « tes délices d’Éden »
  rationale: La parenté lexicale avec Éden est suggestive, mais elle ne suffit pas à identifier explicitement le cours d’eau à celui d’Éden.
translation_notes:
  register: Français international moderne, poétique et digne. « Se rassasient » et « torrent » maintiennent l’imagerie d’abondance, tandis que « ta maison » et « tes délices » préservent les ouvertures sémantiques de l’hébreu.
