  register: Français moderne, international et digne. « Ne sont que » exprime naturellement la prédication nominale hébraïque sans ajouter une idée étrangère. La note conserve l’ambiguïté syntaxique entre deux actions coordonnées et la sagesse manifestée dans l’accomplissement du bien.
