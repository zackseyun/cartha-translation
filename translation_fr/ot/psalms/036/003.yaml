  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: fr
  text: Les paroles de sa bouche ne sont que malfaisance et tromperie ; il a cessé d’agir avec sagesse[a] et de faire le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « il a cessé d’être sage en faisant le bien ». Les deux infinitifs hébreux peuvent être compris comme deux compléments parallèles de « il a cessé », ou comme étroitement liés l’un à l’autre.'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: Les paroles de sa bouche
  rationale: Conserve l’image concrète et la construction hébraïque tout en restant naturelle en français.
- source_word: אָוֶן
  choice: malfaisance
  rationale: Dans ce contexte moral, en parallèle avec « tromperie », le terme désigne le caractère mauvais et nuisible de ses propos. « Malfaisance » garde cette portée sans limiter le sens à un acte précis.
- source_word: וּמִרְמָה
  choice: et tromperie
  rationale: Rend le sens courant de מִרְמָה dans un contexte de parole mensongère ou frauduleuse.
- source_word: חָדַל
  choice: il a cessé
  rationale: Reproduit directement l’idée de cessation exprimée par le qal accompli.
- source_word: לְהַשְׂכִּיל
  choice: d’agir avec sagesse
  rationale: Le hiphil de שכל peut exprimer la compréhension ou la conduite avisée ; ici, son association avec l’action bonne favorise le sens pratique.
- source_word: לְהֵיטִיב
  choice: de faire le bien
  rationale: Rend clairement la valeur morale du hiphil de יטב dans un français actuel.
theological_decisions: []
