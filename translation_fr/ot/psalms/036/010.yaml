  text: מְשֹׁ֣ךְ חַ֭סְדְּ/ךָ לְ/יֹדְעֶ֑י/ךָ וְ֝/צִדְקָֽתְ/ךָ֗ לְ/יִשְׁרֵי לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/010.yaml
  text: Continue your steadfast love to those who know you[b][a], and your righteousness to the upright in heart.
translation:
  language: fr
  text: Prolonge[a] ton amour fidèle envers ceux qui te connaissent, et ta justice[b] envers ceux dont le cœur est droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Étends ton amour fidèle » ; littéralement : « Étire ton amour fidèle ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « ta droiture envers ceux dont le cœur est droit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Prolonge
  rationale: L’impératif signifie littéralement « tire, étends ». Avec l’amour fidèle pour objet, « prolonge » exprime naturellement la demande que cet amour continue de se manifester, tout en restant proche de l’image hébraïque.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne ici un amour loyal, durable et relationnel. « Amour fidèle » rend ces dimensions en français actuel sans imposer un vocabulaire confessionnel spécialisé.
- source_word: לְיֹדְעֶיךָ
  choice: envers ceux qui te connaissent
  rationale: Le participe désigne « ceux qui te connaissent », dans un sens relationnel. « Envers » convient aux deux qualités divines demandées pour leurs bénéficiaires.
- source_word: וְצִדְקָתְךָ
  choice: et ta justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou l’action conforme à ce qui est juste. « Justice » est naturel en français et conserve ici la portée morale et relationnelle du terme.
- source_word: לְיִשְׁרֵי לֵב
  choice: envers ceux dont le cœur est droit
  rationale: L’expression hébraïque décrit une intégrité intérieure. Cette formulation française est claire et préserve l’image biblique du cœur.
theological_decisions:
- issue: Rendu parallèle des attributs divins חֶסֶד et צְדָקָה
  choice: « amour fidèle » et « justice »
  alternative: « bonté » ou « fidélité » pour חֶסֶד ; « droiture » pour צְדָקָה
  rationale: Le choix maintient le parallélisme entre l’amour loyal de Dieu et son action juste, sans réduire le second terme à une catégorie uniquement judiciaire ni charger le premier d’une formulation doctrinale particulière.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. Le parallélisme hébraïque est conservé par la répétition de « envers ».
