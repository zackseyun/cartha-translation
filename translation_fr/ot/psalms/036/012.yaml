  text: שָׁ֣ם נָ֭פְלוּ פֹּ֣עֲלֵי אָ֑וֶן דֹּ֝ח֗וּ וְ/לֹא יָ֥כְלוּ קֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/012.yaml
  text: There the workers of wickedness have fallen[b][a]; they are thrust down and cannot rise.
translation:
  language: fr
  text: Là, ceux qui font le mal[a] sont tombés ; ils ont été renversés et ne peuvent se relever[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui accomplissent le mal » ; autre traduction : « les malfaiteurs ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils ont été repoussés et ne peuvent se relever ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: 'L’adverbe est pris dans son sens spatial : il désigne la scène de la chute évoquée dans le contexte.'
- source_word: נָפְלוּ
  choice: sont tombés
  rationale: Le parfait qal exprime une chute accomplie dont le résultat demeure ; le passé composé est naturel en français.
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: Cette formulation actuelle et claire conserve l’idée active de personnes qui accomplissent le mal, sans la lourdeur de « ceux qui pratiquent l’iniquité ».
- source_word: אָוֶן
  choice: le mal
  rationale: Dans ce contexte, le terme qualifie moralement l’activité des personnes visées, tout en restant plus courant que « iniquité ».
- source_word: דֹּחוּ
  choice: ils ont été renversés
  rationale: Le verbe décrit une mise à terre subie et violente. Le passif français préserve cette nuance sans préciser l’agent.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: et ne peuvent plus se relever
  rationale: La formule exprime l’incapacité de se remettre debout après la chute ; « plus » rend naturellement en français le caractère désormais irréversible suggéré par l’enchaînement.
