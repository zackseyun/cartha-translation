  text: כִּֽי הֶחֱלִ֣יק אֵלָ֣י/ו בְּ/עֵינָ֑י/ו לִ/מְצֹ֖א עֲוֺנ֣/וֹ לִ/שְׂנֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: fr
  text: Car il se flatte à ses propres yeux, au point de ne pas reconnaître sa faute et de ne pas la détester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Car il rend les choses lisses pour lui à ses yeux, pour trouver sa faute, pour haïr. » L’hébreu est difficile; le sens semble être que sa complaisance envers lui-même l’empêche de reconnaître et de rejeter sa faute.'
    reason: Signaler la syntaxe incertaine et préserver l’image littérale de « rendre lisse ».
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: הֶחֱלִיק אֵלָיו
  choice: il se flatte
  rationale: Le verbe signifie littéralement « rendre lisse » et, dans cet emploi dirigé vers soi, évoque des paroles flatteuses ou le fait de se donner une vision complaisante de soi-même.
- source_word: בְּעֵינָיו
  choice: à ses propres yeux
  rationale: Rend l’idiome hébreu relatif au jugement que quelqu’un porte sur lui-même.
- source_word: לִמְצֹא
  choice: reconnaître
  rationale: Le sens premier est « trouver »; dans ce contexte moral, « reconnaître » exprime naturellement la prise de conscience de sa faute sans transformer celle-ci en simple découverte intellectuelle.
- source_word: עֲוֺנוֹ
  choice: sa faute
  rationale: עָוֹן peut désigner la faute, l’iniquité ou la culpabilité. « Faute » est clair en français moderne et conserve ici la portée morale du terme.
- source_word: לִשְׂנֹא
  choice: de ne pas la détester
  rationale: Le second infinitif est coordonné selon l’interprétation contextuelle retenue; le pronom renvoie explicitement à la faute.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: au point de ne pas reconnaître sa faute et de ne pas la détester
  rationale: La syntaxe hébraïque est difficile. Cette formulation rend la lecture contextuelle selon laquelle la complaisance envers soi empêche de discerner et de rejeter sa propre faute, tout en signalant l’ambiguïté dans la note.
theological_decisions:
- issue: Sens moral et psychologique de la proposition
  choice: La flatterie de soi empêche le méchant de reconnaître et de détester sa faute.
  alternative: Il se tient des propos flatteurs jusqu’à ce que sa faute soit découverte comme odieuse; ou il rend les choses lisses à ses propres yeux pour trouver sa faute, pour haïr.
  rationale: Le contexte immédiat décrit l’aveuglement intérieur du méchant. La lecture choisie donne un français intelligible sans ériger cette interprétation d’une syntaxe difficile en certitude, puisque la note conserve une traduction plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. « Se flatter à ses propres yeux » conserve l’idiome hébreu; la proposition finale privilégie la clarté tout en laissant l’ambiguïté de l’original visible dans la note.
