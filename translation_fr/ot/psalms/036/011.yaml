  text: אַל תְּ֭בוֹאֵ/נִי רֶ֣גֶל גַּאֲוָ֑ה וְ/יַד רְ֝שָׁעִ֗ים אַל תְּנִדֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/011.yaml
  text: Let not the foot of pride come against me[b][a], and let not the hand of the wicked drive me away.
translation:
  language: fr
  text: 'Que le pied de l’orgueil ne vienne pas jusqu’à moi[a],

    et que la main des méchants ne me chasse pas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne s’avance pas contre moi ». L’hébreu dit littéralement : « que le pied de l’orgueil ne vienne pas à moi ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « ne me fasse pas errer » ou « ne me fasse pas fuir ». Le verbe peut désigner le fait d’être contraint de quitter sa place.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: ne s’avance pas contre moi
  rationale: Le verbe בוא signifie fondamentalement « venir, entrer ». Avec « le pied de l’orgueil » pour sujet, l’expression évoque ici une avancée hostile. « S’avancer contre moi » rend cette force contextuelle tout en conservant l’image du pied.
- source_word: רֶגֶל גַּאֲוָה
  choice: le pied de l’orgueil
  rationale: Cette traduction maintient la construction et l’image poétique de l’hébreu, sans remplacer l’abstraction « orgueil » par une désignation interprétative des orgueilleux.
- source_word: יַד רְשָׁעִים
  choice: la main des méchants
  rationale: « Main » conserve l’image hébraïque de la puissance ou de l’action, tandis que « les méchants » rend naturellement le substantif pluriel sans ajouter une précision de genre absente du sens requis.
- source_word: תְּנִדֵנִי
  choice: ne me chasse pas
  rationale: La forme causative exprime le fait de contraindre quelqu’un à quitter sa place, à errer ou à fuir. « Chasser » transmet clairement ce déplacement forcé dans le parallélisme avec la main hostile.
- source_word: אַל
  choice: Que… ne… pas
  rationale: Cette tournure rend la défense ou la supplication exprimée par אַל avec les formes jussives, dans un français poétique, digne et actuel.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme des images corporelles (« pied » et « main ») ainsi que l’abstraction « orgueil » sont conservés; les verbes sont formulés naturellement sans effacer leur amplitude sémantique.
