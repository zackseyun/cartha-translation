  text: לַ/מְנַצֵּ֬חַ לְ/עֶֽבֶד יְהוָ֬ה לְ/דָוִֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/000.yaml
  text: For the choirmaster[a]. Of David[d][c][b], the servant of Yahweh.
translation:
  language: fr
  text: Au chef de chœur[a]. De David[b], serviteur de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur de la musique ». Le terme hébreu désigne le responsable de l’exécution musicale dans le cadre du culte.
    reason: lexical_alternative
  - marker: b
    text: Ou « Pour David » ou « À David ». Dans les titres des psaumes, la préposition hébraïque peut exprimer diverses formes d’attribution ou d’association; elle n’établit pas à elle seule que David en est l’auteur.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: La formule des titres de psaumes désigne vraisemblablement le responsable de l’exécution musicale. « Chef de chœur » est bref, naturel en français et conserve la fonction liturgique, même si le terme hébreu peut avoir un sens plus large.
- source_word: לְעֶבֶד
  choice: serviteur
  rationale: Dans ce titre, עֶבֶד est une désignation honorifique de David dans sa relation à Dieu. « Serviteur » convient mieux au registre que « esclave », qui mettrait ici l’accent sur un statut social non mis en avant par le texte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », plutôt que remplacé par un titre.
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, la préposition לְ marque une attribution assez large. « De David » préserve mieux cette latitude que « par David », qui affirmerait plus précisément l’auteur.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre.
- issue: Sens de עֶבֶד dans le titre
  choice: serviteur
  alternative: esclave
  rationale: Le mot fonctionne ici comme un titre honorifique lié au service de Dieu; « serviteur » respecte ce registre sans nier que le terme hébreu possède ailleurs une gamme de sens plus large.
- issue: Portée de לְדָוִד
  choice: De David
  alternative: Par David
  rationale: L’hébreu peut signaler l’auteur, l’appartenance, la dédicace ou une association. La formulation retenue ne tranche pas au-delà de ce que permet le titre.
translation_notes:
  register: Titre bref, digne et naturel en français international moderne. L’ordre « De David, serviteur de Yahweh » rend explicitement l’apposition suggérée par l’hébreu tout en évitant la tournure française lourde « du serviteur de Yahweh, de David ». Les ambiguïtés propres aux prépositions du titre sont conservées dans les notes.
