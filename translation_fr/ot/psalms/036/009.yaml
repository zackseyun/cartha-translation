  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: fr
  text: Car auprès de toi est la source de la vie[a] ; dans ta lumière, nous voyons la lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fontaine de vie » ou « la source de vie ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par ta lumière, nous voyons la lumière ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français le fondement de l’affirmation précédente tout en conservant la valeur explicative du lien hébreu.
- source_word: עִמְּךָ
  choice: auprès de toi
  rationale: Rend la proximité exprimée par עִם sans réduire l’image à une simple localisation matérielle ; « avec toi » reste possible, mais est moins idiomatique ici en français.
- source_word: מְקוֹר
  choice: source
  rationale: Désigne une source jaillissante ou l’origine de quelque chose. « Source » est à la fois naturel, concret et apte à porter le sens figuré en français moderne.
- source_word: חַיִּים
  choice: la vie
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, le nom exprime couramment la notion abstraite de vie ; le singulier est idiomatique en français.
- source_word: בְּאוֹרְךָ
  choice: dans ta lumière
  rationale: Conserve l’image spatiale et poétique de la préposition בְ sans en limiter le sens à l’instrumentalité.
- source_word: נִרְאֶה
  choice: nous voyons
  rationale: Rend directement l’imparfait hébreu employé ici pour exprimer une vérité générale.
- source_word: אוֹר
  choice: la lumière
  rationale: La répétition de « lumière » préserve le parallélisme, l’écho lexical et la densité poétique de l’hébreu.
theological_decisions:
- issue: Portée métaphorique des images de la vie et de la lumière divines
  choice: Conserver « la source de la vie » et « dans ta lumière, nous voyons la lumière » sans explicitation doctrinale.
  alternative: Paraphraser par « tu donnes toute vie » ou « grâce à ta vérité, nous comprenons ».
  rationale: 'L’hébreu laisse aux images leur richesse et leur tension : Dieu est associé à l’origine de la vie et à la lumière par laquelle la lumière est perçue. Une paraphrase réduirait indûment cette portée poétique et théologique.'
translation_notes:
  register: Français international moderne, poétique et digne. « Auprès de toi » est naturel dans le registre des Psaumes sans être archaïque. La reprise exacte de « lumière » préserve la forme mémorable du vers hébreu.
