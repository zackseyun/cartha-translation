source:
  edition: WLC
  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: fr
  text: Ta justice est comme les montagnes de Dieu[a] ; tes jugements sont un vaste abîme. Les humains et les animaux, tu les sauves, Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi signifier « des montagnes majestueuses » ou « les plus hautes montagnes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: Ta justice
  rationale: « Justice » exprime naturellement en français ce qui est droit et juste chez Dieu, sans réduire ici le terme à la seule justice judiciaire.
- source_word: כְּהַרְרֵי אֵל
  choice: comme les montagnes de Dieu
  rationale: Cette traduction conserve la construction hébraïque et son image poétique, tout en laissant en note la possibilité d’un superlatif sémitique.
- source_word: מִשְׁפָּטֶךָ
  choice: tes jugements
  rationale: Le pluriel « jugements » préserve la distinction lexicale avec צִדְקָה et peut désigner les décisions ou les actes judiciaires de Dieu.
- source_word: תְּהוֹם רַבָּה
  choice: le vaste abîme
  rationale: Cette expression française rend l’image d’une profondeur immense, probablement celle des eaux profondes, sans la préciser excessivement.
- source_word: אָדָם וּבְהֵמָה
  choice: Humains et animaux
  rationale: אָדָם a ici une portée collective et générique ; « humains » la rend clairement en français moderne. « Animaux » rend בְּהֵמָה de façon large dans ce contraste englobant.
- source_word: תוֹשִׁיעַ
  choice: tu les sauves
  rationale: « Sauver » conserve l’amplitude du verbe, qui peut inclure délivrance et préservation ; le pronom reprend explicitement les deux groupes placés en tête.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Valeur de אֵל dans « montagnes de Dieu »
  choice: Conserver « montagnes de Dieu » dans le texte
  alternative: « montagnes majestueuses » ou « plus hautes montagnes »
  rationale: אֵל peut désigner Dieu littéralement ou contribuer à une expression superlative. Le texte principal garde cette ambiguïté et la note présente l’autre lecture.
- issue: Portée générique de אָדָם
  choice: « Humains »
  alternative: « l’être humain » ou « les hommes »
  rationale: Le mot désigne ici l’humanité en contraste avec les animaux. Le pluriel collectif est actuel, inclusif et fidèle à cette portée générique.
- issue: Rendu du nom divin יְהוָה
  choice: « Yahweh »
  alternative: « le SEIGNEUR »
  rationale: Le texte hébreu emploie le nom divin ; sa translittération maintient sa fonction de nom propre.
translation_notes:
  register: Poésie française actuelle et digne. Le parallélisme entre hauteur et profondeur est conservé. L’ordre final « Humains et animaux » met en relief l’étendue de l’action salvatrice de Dieu, comme en hébreu.
