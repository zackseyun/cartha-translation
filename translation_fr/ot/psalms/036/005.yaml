id: PSA.36.5
reference: Psalms 36:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְ֭הוָה בְּ/הַ/שָּׁמַ֣יִם חַסְדֶּ֑/ךָ אֱ֝מֽוּנָתְ/ךָ֗ עַד שְׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/005.yaml
  text: O Yahweh[a], your steadfast love is in the heavens; your faithfulness reaches to the clouds.
translation:
  language: fr
  text: Yahweh, ton amour fidèle est dans les cieux[a] ; ta fidélité va jusqu’aux nuages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton amour fidèle va jusqu’aux cieux » ; l’hébreu peut exprimer l’étendue plutôt que le simple lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est transcrit « Yahweh », et sa position initiale est comprise comme une adresse directe. Le français n’a pas besoin d’ajouter un équivalent du « O » vocatif.
- source_word: בְּהַשָּׁמַיִם
  choice: est dans les cieux
  rationale: La préposition בְּ est prise dans son sens locatif naturel, « dans », et le pluriel hébreu est conservé par « les cieux ». Le verbe « est » est suppléé pour former une proposition française naturelle.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד exprime ici un amour loyal, durable et relationnel. « Amour fidèle » en rend la force sans imposer explicitement une notion d’alliance absente du terme lui-même dans cette ligne.
- source_word: אֱמוּנָתְךָ
  choice: ta fidélité
  rationale: אֱמוּנָה désigne la fiabilité ou la fidélité ; « fidélité » convient au parallélisme avec l’amour fidèle.
- source_word: עַד
  choice: va jusqu’à
  rationale: עַד marque la limite ou l’étendue. « Va jusqu’à » restitue cette portée en français courant tout en suppléant sobrement le verbe absent en hébreu.
- source_word: שְׁחָקִים
  choice: les nuages
  rationale: שְׁחָקִים peut désigner les nuages ou les hauteurs célestes. « Les nuages » conserve l’image concrète et poétique, en parallèle avec « les cieux ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. La transcription « Yahweh » le distingue d’un titre et préserve sa fonction de nom propre.
- issue: Valeur de בְּ dans בְּהַשָּׁמַיִם
  choice: 'sens locatif : « dans les cieux »'
  alternative: 'sens d’étendue : « jusqu’aux cieux »'
  rationale: Le sens locatif est grammaticalement direct, mais le parallélisme avec עַד (« jusqu’à ») dans le second membre permet aussi une lecture exprimant l’étendue. L’ambiguïté est donc signalée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement reflète l’adresse directe à Dieu. Le parallélisme hébreu est conservé, avec des verbes suppléés uniquement pour obtenir des propositions françaises naturelles.
