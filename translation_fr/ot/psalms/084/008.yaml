base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/008.yaml
  text: O Yahweh God of hosts[a], hear my prayer; give ear, O God of Jacob[b]. Selah
translation:
  language: fr
  text: Yahweh[a], Dieu des armées, écoute ma prière ; prête l’oreille, Dieu de Jacob. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yahweh » translittère le nom divin hébreu ; il est traditionnellement rendu par « le SEIGNEUR » dans de nombreuses traductions françaises.
    reason: alternative_reading
  - marker: b
    text: « Sélah » est un terme liturgique ou musical hébreu dont le sens exact est incertain ; il pourrait signaler une pause ou un interlude.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Dieu des armées
  rationale: Rend naturellement le titre divin tout en conservant l’ampleur de צְבָאוֹת, qui peut évoquer les armées ou puissances célestes sans les préciser explicitement.
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: écoute ma prière
  rationale: Formulation française directe et naturelle pour l’impératif suivi de « ma prière ».
- source_word: הַאֲזִינָה
  choice: prête l’oreille
  rationale: Préserve l’image et le parallélisme poétique avec « écoute », sans confondre les deux verbes hébreux.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Dieu de Jacob
  rationale: Rendu transparent de la construction hébraïque désignant le Dieu lié à Jacob, c’est-à-dire Israël.
- source_word: סֶלָה
  choice: Sélah
  rationale: La translittération conserve ce terme liturgique ou musical dont la fonction exacte demeure incertaine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. « Yahweh » le préserve plutôt que de le remplacer par un titre ou d’adopter une vocalisation traditionnelle moins probable.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: des puissances ; des armées célestes
  rationale: « Des armées » conserve la métaphore et son étendue possible sans déterminer si elle vise exclusivement les forces célestes.
- issue: Traitement de סֶלָה
  choice: Sélah
  alternative: pause ; interlude
  rationale: Son sens précis étant débattu, la translittération évite d’imposer une interprétation incertaine.
translation_notes:
  register: Français international moderne, digne et poétique. Les impératifs « écoute » et « prête l’oreille » maintiennent le parallélisme de la prière hébraïque. Ponctuation expressive sans archaïsme.
