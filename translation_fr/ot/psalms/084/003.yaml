id: PSA.84.3
reference: Psalms 84:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: fr
  text: 'Même le moineau a trouvé une demeure,

    et l’hirondelle un nid pour elle,

    où elle a déposé ses petits[a],

    près de tes autels[b],

    Yahweh des armées[c],

    mon Roi et mon Dieu !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « où elle peut déposer ses petits ». Le verbe hébreu peut décrire soit une action accomplie, soit ce que le nid lui permet de faire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, la construction associe directement les petits aux « autels ». Elle peut aussi se comprendre « à tes autels » ou « sur tes autels » ; « près de » exprime probablement la proximité.
    reason: lexical_alternative
  - marker: c
    text: 'Traduction traditionnelle : « le SEIGNEUR des armées » ou « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Rend la valeur emphatique : même les petits oiseaux trouvent une demeure auprès de Dieu.'
- source_word: צִפּוֹר
  choice: le moineau
  rationale: Le mot peut désigner plus largement un petit oiseau, mais « moineau » est une identification traditionnelle, plausible et naturelle en parallèle avec l’hirondelle.
- source_word: מָצְאָה בַיִת
  choice: a trouvé une demeure
  rationale: Le parfait hébreu présente la découverte comme accomplie ; « demeure » exprime ici un lieu où habiter plutôt qu’un bâtiment humain.
- source_word: דְרוֹר
  choice: l’hirondelle
  rationale: Identification courante de cet oiseau, bien que le martinet soit parfois proposé.
- source_word: קֵן לָהּ
  choice: un nid pour elle
  rationale: Conserve explicitement le datif hébreu, qui exprime l’intérêt ou la possession.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: où elle a déposé ses petits
  rationale: Le verbe signifie mettre ou déposer ; le parfait permet naturellement une action accomplie. « Ses petits » reste exact sans préciser excessivement leur stade de développement.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: près de tes autels
  rationale: La construction hébraïque est très condensée. Le contexte suggère la proximité des autels plutôt que le dépôt littéral des oisillons sur ceux-ci.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת par un terme français transparent qui conserve la force souveraine et militaire du titre.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: mon Roi et mon Dieu
  rationale: Reproduit la confession personnelle et l’adresse directe ; la majuscule à « Roi » marque son emploi comme titre divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve au lieu de lui substituer un titre, sans ajouter d’interprétation confessionnelle.
- issue: Sens spatial de אֶת מִזְבְּחוֹתֶיךָ
  choice: près de tes autels
  alternative: à tes autels / sur tes autels
  rationale: Le rapport syntaxique est compact et peut évoquer le sanctuaire comme lieu de refuge. Le texte principal évite l’image peu vraisemblable d’un nid posé directement sur les autels, tandis que la note maintient l’ambiguïté.
- issue: Valeur du parfait שָׁתָה
  choice: elle a déposé
  alternative: elle peut déposer
  rationale: Le parfait se lit naturellement comme une action accomplie, mais une description de la fonction du nid demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. Les vers brefs suivent le parallélisme hébreu. « Demeure » évite l’anthropomorphisme trop concret de « maison » tout en restant accessible ; « nid pour elle » conserve volontairement la légère insistance de l’original.
