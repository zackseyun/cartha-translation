  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: fr
  text: Heureux ceux qui habitent dans ta maison[a][b] ! Ils te loueront encore. Sélah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’ils sont heureux, ceux qui habitent dans ta maison ! »'
    reason: lexical_alternative
  - marker: b
    text: « Ta maison » désigne probablement le sanctuaire ou le temple de Dieu.
    reason: cultural_note
  - marker: c
    text: « Sélah » est un terme hébreu liturgique ou musical dont le sens demeure incertain ; il est traditionnellement laissé sans traduction.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette forme exclamative introduit une béatitude. « Heureux » est la formulation française naturelle et traditionnelle, sans réduire le propos à un simple état émotionnel.
- source_word: יוֹשְׁבֵי
  choice: ceux qui habitent
  rationale: Le participe de ישׁב désigne ici ceux qui résident ou demeurent dans la maison de Dieu, plutôt que ceux qui y sont simplement assis. Le présent français conserve la valeur durative et générale.
- source_word: בֵיתֶךָ
  choice: ta maison
  rationale: L’hébreu dit littéralement « ta maison ». Dans ce psaume, l’expression renvoie vraisemblablement au sanctuaire de Dieu, mais « maison » préserve l’image poétique sans la préciser davantage que le texte source.
- source_word: עוֹד
  choice: encore
  rationale: L’adverbe peut exprimer la continuité (« toujours, encore ») ou, selon le contexte, la reprise. « Encore » maintient cette souplesse mieux qu’une formulation plus explicative comme « sans cesse ».
- source_word: יְהַלְלוּךָ
  choice: ils te loueront
  rationale: L’imparfait hébreu peut exprimer une action future ou habituelle. Le futur français convient à l’énoncé tout en laissant « encore » porter l’idée de continuité.
- source_word: סֶּלָה
  choice: Sélah
  rationale: Le sens exact de ce terme liturgique ou musical est incertain. Sa translittération évite d’imposer une interprétation telle que « pause » ou « interlude ».
theological_decisions:
- issue: Référent de « ta maison »
  choice: Conserver « ta maison » dans le texte principal.
  alternative: ta demeure sacrée ; ton temple
  rationale: L’expression vise probablement le sanctuaire ou le temple de Dieu, mais la traduction littérale préserve l’image et évite de restreindre indûment le sens.
- issue: Valeur temporelle de יְהַלְלוּךָ avec עוֹד
  choice: « Ils te loueront encore »
  alternative: « Ils te louent sans cesse »
  rationale: La construction peut être comprise comme future ou habituelle. Le futur accompagné de « encore » respecte cette tension sans transformer explicitement l’énoncé en affirmation de louange incessante.
translation_notes:
  register: Français international moderne, simple et digne. La tournure de béatitude reste naturelle, tandis que « maison », « encore » et « Sélah » conservent l’imagerie et les ambiguïtés du texte hébreu.
