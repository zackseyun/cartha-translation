  text: מָ֭גִנֵּ/נוּ רְאֵ֣ה אֱלֹהִ֑ים וְ֝/הַבֵּ֗ט פְּנֵ֣י מְשִׁיחֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: fr
  text: Ô Dieu, regarde notre bouclier[a] et porte ton regard sur le visage de ton oint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre protecteur ». L’hébreu dit littéralement « notre bouclier », une image poétique qui peut désigner soit Dieu comme protecteur, soit le roi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ton oint ». Le mot hébreu est à l’origine du titre « Messie » ; ici, il désigne probablement d’abord le roi davidique, sans exclure une résonance messianique plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: notre bouclier
  rationale: 'Le nom désigne littéralement un bouclier. Conserver l’image concrète préserve l’ambiguïté poétique : il peut s’agir de Dieu comme protecteur ou du roi qui protège le peuple.'
- source_word: רְאֵה
  choice: regarde
  rationale: Dans cette prière, l’impératif demande à Dieu d’accorder une attention favorable, et non de simplement voir. « Regarde » exprime naturellement cette requête en français.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est ici une apostrophe. « Ô Dieu » rend clairement et dignement cette valeur vocative.
- source_word: וְהַבֵּט
  choice: et porte ton regard sur
  rationale: Le verbe exprime un regard dirigé et attentif. Cette formulation française le distingue légèrement du premier impératif tout en maintenant le parallélisme.
- source_word: פְּנֵי
  choice: le visage de
  rationale: Le terme signifie littéralement « visage » et peut avoir une portée relationnelle. L’image hébraïque reste claire en français et mérite d’être conservée.
- source_word: מְשִׁיחֶךָ
  choice: celui que tu as oint
  rationale: Le terme désigne une personne consacrée par l’onction, vraisemblablement le roi davidique dans le contexte immédiat. La formulation évite d’imposer dans le texte principal « Messie » comme titre technique.
theological_decisions:
- issue: Référent de « notre bouclier »
  choice: L’image « notre bouclier » est conservée sans identification explicite.
  alternative: Interpréter le bouclier comme Dieu, le protecteur du peuple, ou comme le roi davidique.
  rationale: L’hébreu permet les deux compréhensions et pourrait rapprocher intentionnellement « notre bouclier » de « celui que tu as oint ». La traduction ne doit pas trancher cette tension.
- issue: Référent de « celui que tu as oint »
  choice: La formulation descriptive reste sans majuscule et renvoie d’abord au roi consacré.
  alternative: « ton Messie » ou « ton oint »
  rationale: Dans le cadre immédiat du psaume, le roi davidique est probablement visé. Toutefois, le mot hébreu est à l’origine du titre « Messie » et peut avoir une résonance messianique plus large, signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’apostrophe « Ô Dieu » maintient le registre de prière. « Porte ton regard sur » rend l’attention soutenue du second impératif sans archaïsme. Les deux marqueurs de note sont placés sur les expressions qu’ils expliquent.
