source:
  edition: WLC
  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: fr
  text: Comme tes demeures sont désirables, Yahvé des armées !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה
  choice: Que… sont
  rationale: מַה introduit ici une exclamation, non une question. La tournure française « Que… sont » en restitue naturellement la force poétique.
- source_word: יְּדִידוֹת
  choice: belles
  rationale: Le terme exprime ce qui est aimé, cher ou agréable. « Belles » rend de façon naturelle et actuelle l’admiration affectueuse du psalmiste, sans réduire le sens à la seule idée d’affection.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: tes demeures
  rationale: « Demeures » conserve le pluriel et l’idée de lieux où Dieu réside. Ce choix évite « tabernacles », qui pourrait restreindre à tort le sens à la tente mosaïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération usuelle en français rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Dans le titre divin, « des armées » conserve l’image des forces placées sous l’autorité de Yahvé, sans en préciser abusivement la nature.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin; sa translittération préserve cette donnée au lieu de la remplacer par un titre.
- issue: Portée du titre יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: Yahvé, maître des armées
  rationale: La formulation retenue garde la concision et l’ambiguïté du titre hébreu, qui peut évoquer les armées célestes, les forces cosmiques ou les armées d’Israël.
translation_notes:
  register: Français actuel, poétique et digne. La tournure exclamative reste simple et accessible; le pluriel de l’hébreu est conservé.
