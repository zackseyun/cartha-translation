  text: יֵ֭לְכוּ מֵ/חַ֣יִל אֶל חָ֑יִל יֵרָאֶ֖ה אֶל אֱלֹהִ֣ים בְּ/צִיּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/007.yaml
  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: fr
  text: Ils vont de force en force[a] ; chacun se présente devant Dieu à Sion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de troupe en troupe » ou « de victoire en victoire » ; le mot hébreu traduit par « force » peut aussi désigner la vaillance ou une armée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « il apparaît à Dieu ». Dans ce contexte, cela signifie probablement « se présenter devant Dieu » ; autre traduction possible : « chacun est vu par Dieu à Sion ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: Ils vont
  rationale: Le qal inaccompli, troisième personne du pluriel, exprime ici la progression des pèlerins. « Ils vont » est naturel et ne précise pas indûment la manière de se déplacer.
- source_word: מֵחַיִל אֶל חָיִל
  choice: de force en force
  rationale: חַיִל peut désigner la force, la vaillance, une troupe ou la victoire. Dans ce contexte de pèlerinage, la formule évoque naturellement une vigueur renouvelée au fil de la marche, tout en conservant la concision de l’hébreu.
- source_word: יֵרָאֶה
  choice: chacun se présente
  rationale: 'Le nifal inaccompli est au singulier après un verbe au pluriel, ce qui permet une lecture distributive : chacun des pèlerins se présente. Dans un contexte cultuel, ראה au nifal peut exprimer le fait de paraître ou de se présenter devant Dieu.'
- source_word: אֶל אֱלֹהִים
  choice: devant Dieu
  rationale: La préposition אֶל signifie littéralement « vers/à », mais avec le verbe « paraître » dans un cadre cultuel, le français idiomatique demande « devant Dieu ».
- source_word: בְצִיּוֹן
  choice: à Sion
  rationale: Pour un lieu où l’on se rend et se présente devant Dieu, « à Sion » est plus naturel en français que « dans Sion », sans changer le référent géographique et cultuel.
theological_decisions:
- issue: Sens cultuel de יֵרָאֶה אֶל אֱלֹהִים
  choice: Les pèlerins se présentent devant Dieu à Sion.
  alternative: Chacun est vu par Dieu à Sion.
  rationale: Le nifal de ראה peut être compris passivement, mais dans le cadre du pèlerinage et du culte, l’expression désigne probablement le fait de paraître ou de se présenter devant Dieu. La note conserve l’autre possibilité grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le parallélisme concis du verset et rend explicitement la valeur distributive du verbe hébreu singulier par « chacun ».
