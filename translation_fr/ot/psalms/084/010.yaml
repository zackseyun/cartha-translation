source:
  edition: WLC
  text: כִּ֤י טֽוֹב י֥וֹם בַּ/חֲצֵרֶ֗י/ךָ מֵ֫/אָ֥לֶף בָּחַ֗רְתִּי הִ֭סְתּוֹפֵף בְּ/בֵ֣ית אֱלֹהַ֑/י מִ֝/דּ֗וּר בְּ/אָהֳלֵי רֶֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: fr
  text: Car un jour dans tes parvis vaut mieux que mille[a]. Je préfère me tenir sur le seuil de la maison de mon Dieu[b] plutôt que d’habiter dans les tentes de la méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit simplement « que mille ». On peut sous-entendre « jours » ou comprendre « mille ailleurs », mais aucun de ces mots ne figure dans le texte.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « J’ai choisi de me tenir sur le seuil de la maison de mon Dieu »; traduction traditionnelle : « être portier dans la maison de mon Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: vaut mieux
  rationale: Avec la comparaison introduite par מִן, « vaut mieux » exprime naturellement en français la valeur supérieure de ce jour, là où une traduction strictement littérale par « est bon » serait maladroite.
- source_word: בַּחֲצֵרֶיךָ
  choice: dans tes parvis
  rationale: « Parvis » rend le pluriel חֲצֵרוֹת dans le cadre du sanctuaire et demeure naturel dans le registre biblique français actuel.
- source_word: מֵאָלֶף
  choice: que mille
  rationale: Le texte hébreu laisse le terme comparé après « mille » sous-entendu. La traduction conserve cette ellipse sans ajouter « jours » ni « ailleurs ».
- source_word: בָּחַרְתִּי
  choice: Je préfère
  rationale: La forme signifie littéralement « j’ai choisi », mais, dans cette construction comparative, elle exprime idiomatiquement une préférence. « Je préfère » restitue cette force en français courant.
- source_word: הִסְתּוֹפֵף
  choice: me tenir sur le seuil
  rationale: Le verbe évoque une place humble au seuil; il ne désigne pas explicitement la fonction de portier. Cette formulation évite d’importer une charge officielle absente du texte.
- source_word: בְּבֵית אֱלֹהַי
  choice: de la maison de mon Dieu
  rationale: « Maison » conserve l’image concrète de בַּיִת sans préciser davantage qu’il s’agit du temple. La tournure avec « seuil » exige naturellement « de » en français.
- source_word: מִדּוּר
  choice: plutôt que d’habiter
  rationale: L’infinitif construit avec מִן poursuit la comparaison. « Plutôt que d’habiter » donne une syntaxe française claire et parallèle à « Je préfère ».
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: dans les tentes de la méchanceté
  rationale: Cette traduction conserve le nom abstrait רֶשַׁע et l’image plurielle des tentes, sans le transformer en désignation personnelle des « méchants ».
theological_decisions:
- issue: Langage du sanctuaire
  choice: tes parvis / la maison de mon Dieu
  alternative: tes cours / le temple de mon Dieu
  rationale: Le verset oppose la proximité du sanctuaire de Dieu à une demeure associée à la méchanceté. « Parvis » et « maison » préservent les images hébraïques sans préciser « temple » au-delà du texte.
- issue: Nature de la place occupée au sanctuaire
  choice: me tenir sur le seuil
  alternative: être portier
  rationale: Le texte souligne vraisemblablement une place modeste à l’entrée de la maison de Dieu, mais n’attribue pas sans ambiguïté une fonction cultuelle officielle. La traduction principale reste donc descriptive.
translation_notes:
  register: Français international moderne, naturel et digne. « Parvis » maintient le contexte du sanctuaire; « vaut mieux » et « je préfère » rendent clairement la comparaison poétique. L’ellipse après « mille » et l’incertitude lexicale autour de הִסְתּוֹפֵף sont conservées et signalées en notes.
