  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: fr
  text: 'Car Yahweh, Dieu, est un soleil et un bouclier ;


    Yahweh accorde faveur et honneur[a].


    Il ne prive d’aucun bien


    ceux qui marchent avec intégrité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « grâce et gloire ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne ici une conduite intègre, entière et droite, sans impliquer nécessairement une perfection sans péché.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: שֶׁמֶשׁ וּמָגֵן
  choice: un soleil et un bouclier
  rationale: Conserve les deux métaphores poétiques, celles de la lumière ou du bienfait et de la protection, sans les expliciter davantage que l’hébreu.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Dieu
  rationale: Rend directement le nom divin יְהוָה par « Yahweh » et maintient אֱלֹהִים en apposition, au plus près de l’expression hébraïque.
- source_word: חֵן
  choice: faveur
  rationale: Exprime ici la bienveillance accordée par Dieu sans imposer les connotations théologiques plus spécialisées que peut porter « grâce ».
- source_word: כָבוֹד
  choice: honneur
  rationale: Dans le contexte de ce que Yahweh accorde, « honneur » rend naturellement la dignité conférée ; « gloire » demeure une possibilité lexicale réelle.
- source_word: יִתֵּן
  choice: accorde
  rationale: Le présent rend la valeur générale ou habituelle de l’imparfait hébreu ; « accorder » convient idiomatiquement à la faveur et à l’honneur.
- source_word: לֹא יִמְנַע טוֹב
  choice: Il ne refuse aucun bien
  rationale: Rend naturellement en français l’idée de ne pas retenir ou priver d’un bien, tout en conservant la portée générale de טוֹב.
- source_word: לַהֹלְכִים
  choice: à ceux qui marchent
  rationale: Préserve la métaphore biblique de la marche comme manière de vivre, qui reste intelligible en français moderne.
- source_word: בְּתָמִים
  choice: dans l’intégrité
  rationale: Rend l’idée de plénitude morale, de droiture et de conduite intègre sans suggérer nécessairement une perfection exempte de tout péché.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; l’Éternel
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le caractère de nom propre plutôt que de le remplacer par un titre.
- issue: Portée morale de בְּתָמִים
  choice: dans l’intégrité
  alternative: de manière irréprochable ; avec droiture
  rationale: Le terme évoque une conduite entière et droite. La formulation retenue évite de résoudre le verset en une affirmation de perfection morale absolue.
- issue: Sens de חֵן וְכָבוֹד
  choice: faveur et honneur
  alternative: grâce et gloire
  rationale: Les deux couples sont lexicalement possibles. Le texte principal privilégie le sens contextuel de bienveillance et de dignité accordées, tandis que la note préserve l’autre traduction traditionnelle.
translation_notes:
  register: Français international moderne, poétique et digne. Les lignes brèves respectent le parallélisme du verset. « Yahweh Dieu » conserve volontairement la construction serrée de l’hébreu ; « marchent » maintient son image éthique traditionnelle.
