  terminology: « Yahweh » rend correctement le tétragramme. « Faveur et honneur » est un choix contextuellement défendable pour חֵן וְכָבוֹד, et la note conserve de façon appropriée l’alternative « grâce et gloire ». « Intégrité » rend bien תָּמִים sans imposer l’idée de perfection morale absolue.
