id: PSA.84.12
reference: Psalms 84:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: fr
  text: Yahweh des armées[a], heureux[b] est l’être humain qui met sa confiance en toi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des puissances ». Le terme hébreu peut évoquer des armées terrestres ou célestes.
    reason: lexical_alternative
  - marker: b
    text: Ou « comblé », « dans une situation enviable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel employé dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette traduction conserve l’image concrète des troupes ou armées attachée au titre divin, sans la remplacer par l’interprétation « Tout-Puissant ».
- source_word: אַשְׁרֵי
  choice: heureux
  rationale: Ce terme introduit une déclaration de bonheur ou de condition enviable. « Heureux » est naturel dans les béatitudes françaises et ne réduit pas l’expression à une émotion passagère.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le singulier désigne ici de manière représentative toute personne qui se confie en Dieu. « L’être humain » garde le singulier et la portée générique du mot hébreu.
- source_word: בֹּטֵחַ
  choice: qui met sa confiance
  rationale: Le participe exprime une attitude caractéristique et durable. Cette tournure rend clairement le sens de confiance plutôt que celui, voisin mais distinct, de recherche d’un refuge.
- source_word: בָּךְ
  choice: en toi
  rationale: Cette expression conserve la préposition et l’adresse directe à Yahweh à la deuxième personne du singulier.
theological_decisions:
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh, le Tout-Puissant
  rationale: « Des armées » préserve l’imagerie du titre hébreu et laisse ouverte l’étendue exacte des armées évoquées, tandis que « le Tout-Puissant » en donnerait une interprétation théologique.
- issue: Portée de אָדָם au singulier
  choice: l’être humain
  alternative: l’homme
  rationale: Dans ce contexte sapientiel, le nom singulier a une portée générique. La traduction retenue exprime cette universalité sans réserver la déclaration au sexe masculin.
translation_notes:
  register: Français international moderne, simple et digne. La tournure exclamative sans verbe après « heureux » reproduit naturellement la formule hébraïque de béatitude; le point d’exclamation en fait entendre la force.
