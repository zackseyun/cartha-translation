  text: 'For the choir director: according to the Gittith[c][b][a]. A psalm of the sons of Korah.'
translation:
  language: fr
  text: Au chef de chœur, sur la Guittith[a]. Psaume des fils de Coré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu Guittith. Ce terme désigne probablement un air, un style musical ou un instrument, mais son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « pour les fils de Coré » : dans les titres des psaumes, la préposition hébraïque peut indiquer l’auteur, l’association ou la destination.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce participe désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est clair, naturel et adapté au cadre cultuel et musical.
- source_word: עַל הַגִּתִּית
  choice: sur la Guittith
  rationale: La préposition introduit ici une indication musicale dont le rapport exact reste incertain. La formulation concise « sur la Guittith » conserve cette indétermination sans préciser à tort s’il s’agit d’un air, d’un style ou d’un instrument.
- source_word: לִבְנֵי קֹרַח
  choice: des fils de Coré
  rationale: Dans les titres, la préposition ל peut exprimer l’auteur, l’association ou la destination. « Des fils de Coré » reste concise et laisse ouverte la nature exacte du lien.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Ce terme désigne un chant destiné à l’accompagnement musical; « psaume » est en français le nom de genre établi et naturel.
