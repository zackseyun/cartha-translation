  text: נִכְסְפָ֬ה וְ/גַם כָּלְתָ֨ה נַפְשִׁ/י֮ לְ/חַצְר֪וֹת יְה֫וָ֥ה לִבִּ֥/י וּ/בְשָׂרִ֑/י יְ֝רַנְּנ֗וּ אֶ֣ל אֵֽל חָֽי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/002.yaml
  text: My soul longs—indeed[a], it even faints—for the courts of Yahweh; my heart and my flesh cry out to the living God.
translation:
  language: fr
  text: Mon âme languit après les parvis de Yahweh, elle en défaille même ; mon cœur et ma chair poussent des cris vers le Dieu vivant.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « poussent des cris de joie ». Le verbe hébreu désigne souvent un cri retentissant de joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְסְפָה
  choice: languit
  rationale: Le verbe exprime un désir profond et persistant. « Languit » rend cette aspiration intense dans un registre poétique encore accessible.
- source_word: וְגַם כָּלְתָה
  choice: elle défaille même
  rationale: וְגַם renforce le second verbe, tandis que כָּלְתָה évoque l’épuisement ou la défaillance sous l’effet du désir. Cette formulation préserve la progression du vers.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: « Mon âme » restitue directement la personne intérieure et conserve son articulation avec « mon cœur et ma chair » dans le second membre.
- source_word: לְחַצְרוֹת
  choice: après les parvis
  rationale: Les « parvis » désignent les cours du sanctuaire. La tournure « languir après » exprime naturellement en français l’objet d’un désir ardent.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve ici le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: לִבִּי וּבְשָׂרִי
  choice: mon cœur et ma chair
  rationale: La traduction littérale préserve le couple hébreu qui embrasse la dimension intérieure et corporelle de la personne.
- source_word: יְרַנְּנוּ
  choice: poussent des cris
  rationale: Le verbe désigne un cri retentissant, souvent joyeux. « Poussent des cris » garde l’intensité vocale sans imposer dans le corps du texte une nuance émotionnelle unique.
- source_word: אֶל אֵל חָי
  choice: vers le Dieu vivant
  rationale: « Vers » rend la direction marquée par אֶל et convient à des cris orientés vers Dieu ; « le Dieu vivant » restitue l’appellation biblique dans son contexte défini.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve sans le remplacer par un titre.
- issue: Nuance de יְרַנְּנוּ
  choice: poussent des cris
  alternative: poussent des cris de joie
  rationale: Le verbe comporte souvent une nuance jubilante, mais le contexte immédiat souligne aussi le désir qui va jusqu’à la défaillance. Le texte principal garde cette tension et la note signale la nuance de joie.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme corporel de l’hébreu est conservé, ainsi que la montée du désir à la défaillance. La ponctuation rend les deux membres du vers sans les surcharger.
