  text: עֹבְרֵ֤י בְּ/עֵ֣מֶק הַ֭/בָּכָא מַעְיָ֣ן יְשִׁית֑וּ/הוּ גַּם בְּ֝רָכ֗וֹת יַעְטֶ֥ה מוֹרֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/006.yaml
  text: As they pass through the Valley of Baca[a], they make it a spring[b]; even the early rain covers it with blessings.
translation:
  language: fr
  text: Lorsqu’ils traversent la vallée de Baca[a], ils en font une source ; la pluie d’automne[b] la couvre elle aussi de bénédictions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Baca peut faire écho au mot hébreu associé aux pleurs ; d’où la traduction possible : « la vallée des Pleurs ».'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu peut désigner la pluie précoce, qui tombe en automne ; il peut aussi signifier « maître » ou « enseignant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבְרֵי בְּעֵמֶק
  choice: Quand ils traversent la vallée
  rationale: Le participe qal pluriel désigne les pèlerins en chemin. Avec עבר, la préposition exprime ici le passage à travers un lieu ; une proposition temporelle est naturelle en français.
- source_word: הַבָּכָא
  choice: Baka
  rationale: Le terme fonctionne vraisemblablement comme un nom de lieu, tout en pouvant évoquer les pleurs. La translittération préserve cette ambiguïté, explicitée en note.
- source_word: מַעְיָן יְשִׁיתוּהוּ
  choice: ils en font un lieu de sources
  rationale: מַעְיָן désigne une source, et שׁית peut signifier établir ou faire devenir. Le pluriel collectif « lieu de sources » rend naturellement en français l’image de la vallée transformée par l’eau.
- source_word: גַּם
  choice: aussi
  rationale: Le terme ajoute une seconde image à la première. « Aussi » conserve cette progression sans imposer une nuance emphatique excessive.
- source_word: בְּרָכוֹת
  choice: de bénédictions
  rationale: La vocalisation massorétique donne naturellement « bénédictions ». Ce choix maintient l’entrelacement poétique entre eau bienfaisante et faveur reçue.
- source_word: יַעְטֶה
  choice: couvre
  rationale: Le verbe exprime l’action de couvrir ou d’envelopper. « Couvre » est clair, actuel et fidèle à la métaphore.
- source_word: מוֹרֶה
  choice: la pluie d’automne
  rationale: Dans ce contexte d’eau et de fécondité, le mot désigne probablement la première pluie de la saison, qui tombe en automne. Son autre sens possible, « maître », est signalé en note.
theological_decisions:
- issue: Interprétation de הַבָּכָא
  choice: Conserver le nom de lieu « Baka » dans le texte
  alternative: la vallée des Pleurs
  rationale: Le mot peut être un toponyme évocateur des pleurs. La translittération évite de trancher une image possiblement intentionnelle, tandis que la note en conserve la portée.
- issue: Sens de מוֹרֶה
  choice: la pluie d’automne
  alternative: le maître
  rationale: L’imagerie immédiate des sources, de la pluie et des bénédictions favorise le sens météorologique. L’ambiguïté lexicale réelle est néanmoins préservée en note.
translation_notes:
  register: Français moderne, international et poétique, avec une syntaxe claire. « Baka » conserve le caractère du toponyme hébreu ; « pluie d’automne » est plus immédiatement intelligible en français international que « pluie précoce ».
