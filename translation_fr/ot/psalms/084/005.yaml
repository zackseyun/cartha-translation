id: PSA.84.5
reference: Psalms 84:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם עֽוֹז ל֥/וֹ בָ֑/ךְ מְ֝סִלּ֗וֹת בִּ/לְבָבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/005.yaml
  text: Blessed is the man whose strength is in you[b][a], in whose heart are the highways.
translation:
  language: fr
  text: Heureux l’homme qui trouve sa force en toi et qui a dans son cœur les grandes routes[a][b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « dans leur cœur » : le suffixe hébreu est pluriel, bien que le verset commence par le singulier « l’homme ».'
    reason: lexical_alternative
  - marker: b
    text: Ces « grandes routes » désignent probablement les chemins du pèlerinage vers la demeure de Dieu, mais le verset ne précise pas leur destination.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule traditionnelle de béatitude exprime une condition enviable et favorisée par Dieu. « Heureux » est naturel en français biblique moderne sans réduire le terme à une émotion passagère.
- source_word: אָדָם
  choice: l’homme
  rationale: Le nom est masculin singulier, mais employé de manière représentative. « L’homme » conserve cette forme et le ton sapiential du verset.
- source_word: עֹז
  choice: sa force
  rationale: Dans ce contexte, le nom désigne la force que l’être humain trouve en Dieu, plutôt qu’une forteresse ou un refuge matériel.
- source_word: לוֹ בָךְ
  choice: qui trouve sa force en toi
  rationale: L’hébreu dit littéralement que la force est « pour lui en toi ». Cette formulation française naturelle maintient Dieu comme lieu ou source de la force sans choisir exclusivement entre ces deux nuances.
- source_word: מְסִלּוֹת
  choice: les grandes routes
  rationale: Le terme désigne des routes aménagées ou surélevées. « Grandes routes » en conserve la force concrète sans ajouter une destination absente du verset.
- source_word: בִּלְבָבָם
  choice: dans son cœur
  rationale: Le texte passe du singulier « homme » à un suffixe pluriel, littéralement « dans leur cœur ». Le corps du texte suit le référent représentatif singulier pour produire un français lisible, tandis qu’une note signale le changement de nombre.
theological_decisions:
- issue: Destination implicite des grandes routes
  choice: Ne pas préciser leur destination dans le texte
  alternative: les routes qui mènent à Sion / les chemins du pèlerinage
  rationale: Le contexte du psaume suggère les routes du pèlerinage vers la demeure de Dieu, mais ni Sion ni une destination ne sont nommées dans ce verset. La traduction ne rend donc pas explicite ce qui reste implicite.
- issue: Masculin générique de אָדָם
  choice: l’homme
  alternative: la personne / l’être humain / celui
  rationale: Le singulier masculin de la source a une portée représentative. « L’homme » garde la forme du texte sans limiter la béatitude aux seuls hommes.
- issue: Passage du singulier au pluriel dans בִּלְבָבָם
  choice: Harmoniser au singulier dans le texte et signaler le pluriel en note
  alternative: et qui ont les grandes routes dans leur cœur
  rationale: Le changement de nombre est réel, mais une reproduction mécanique serait obscure en français. La note préserve cette particularité et l’ambiguïté de la construction hébraïque.
translation_notes:
  register: Français international actuel, poétique et digne. La syntaxe reste simple; « grandes routes » garde l’image concrète de l’hébreu, tandis que les notes rendent compte du changement de nombre et du contexte probable du pèlerinage.
