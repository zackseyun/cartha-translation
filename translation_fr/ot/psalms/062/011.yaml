source:
  edition: WLC
  text: אַחַ֤ת דִּבֶּ֬ר אֱלֹהִ֗ים שְׁתַּֽיִם ז֥וּ שָׁמָ֑עְתִּי כִּ֥י עֹ֝֗ז לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: fr
  text: 'Dieu a dit une chose[a] ; j’en ai entendu deux : la force appartient à Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu a parlé une fois ; deux fois, j’ai entendu cela. » L’expression hébraïque peut se comprendre soit comme une formule numérique (« une chose… deux »), soit de manière adverbiale (« une fois… deux fois »).'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: une chose
  rationale: Le numéral féminin singulier signifie « une ». Avec « deux », il forme vraisemblablement une formule numérique ; « une chose » en restitue naturellement la structure en français.
- source_word: דִּבֶּר
  choice: a dit
  rationale: Le parfait hébreu présente une parole accomplie. « A dit » est naturel en français moderne et conserve le sens général de l’acte de parler.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le terme a ici un sens singulier et désigne Dieu.
- source_word: שְׁתַּיִם
  choice: deux
  rationale: Le numéral est compris comme le second élément de la formule « une chose… deux ». Le pronom « en » reprend naturellement « chose » et évite une répétition lourde.
- source_word: זוּ
  choice: repris implicitement par « en »
  rationale: La forme pronominale renvoie à ce qui est entendu. En français, cette relation s’exprime naturellement par « j’en ai entendu deux ».
- source_word: שָׁמָעְתִּי
  choice: j’en ai entendu
  rationale: Le passé composé convient au parfait hébreu et décrit ce que le psalmiste a reçu de la parole divine.
- source_word: כִּי
  choice: ':'
  rationale: La conjonction introduit ici le contenu entendu. En français, les deux-points rendent cette relation plus naturellement qu’un « que » après la proposition précédente.
- source_word: עֹז
  choice: la force
  rationale: Le nom désigne la force ou la puissance. « Force » est clair, digne et proche de la valeur lexicale du terme.
- source_word: לֵאלֹהִים
  choice: appartient à Dieu
  rationale: La préposition לְ marque ici la possession ou l’attribution ; « appartient à Dieu » l’explicite sans surinterprétation.
theological_decisions:
- issue: Formule numérique « une… deux »
  choice: « Dieu a dit une chose ; j’en ai entendu deux »
  alternative: « Dieu a parlé une fois ; deux fois, je l’ai entendu »
  rationale: L’hébreu permet une lecture par nombres de choses ou par fréquence (« une fois/deux fois »). La formule numérique rend bien la structure sapientielle probable, tandis qu’une note conserve l’autre lecture afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation conserve le parallélisme numérique, et la note signale l’ambiguïté réelle de l’idiome hébreu.
