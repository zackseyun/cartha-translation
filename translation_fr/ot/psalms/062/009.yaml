source:
  edition: WLC
  text: אַ֤ךְ הֶ֥בֶל בְּנֵֽי אָדָם֮ כָּזָ֪ב בְּנֵ֫י אִ֥ישׁ בְּ/מֹאזְנַ֥יִם לַ/עֲל֑וֹת הֵ֝֗מָּה מֵ/הֶ֥בֶל יָֽחַד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: fr
  text: Les fils d’Adam ne sont qu’un souffle ; les fils de l’homme, qu’un mensonge[a]. Sur la balance, ils montent ; tous ensemble, ils sont plus légers qu’un souffle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi comprendre ces deux expressions comme désignant respectivement les gens de condition modeste et ceux de haut rang. L’hébreu dit littéralement « les fils d’Adam » et « les fils de l’homme ».
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: ne… que
  rationale: Dans ce contexte, אַךְ donne à l’affirmation une force restrictive et insistante. La tournure « ne sont qu’un » est naturelle en français et souligne la complète inconsistance des humains.
- source_word: הֶבֶל
  choice: un souffle
  rationale: הֶבֶל évoque ce qui est fugitif, inconsistant ou vain. « Un souffle » conserve l’image concrète et peut être repris à la fin du verset.
- source_word: בְּנֵי אָדָם
  choice: les fils d’Adam
  rationale: Cette traduction conserve la forme hébraïque et distingue אָדָם de אִישׁ dans le membre parallèle, sans imposer dans le texte principal une interprétation fondée sur le rang social.
- source_word: כָּזָב
  choice: un mensonge
  rationale: Le nom désigne le mensonge, la fausseté ou ce qui trompe et n’est pas fiable. « Un mensonge » garde la formulation nominale, brève et tranchante du texte.
- source_word: בְּנֵי אִישׁ
  choice: les fils de l’homme
  rationale: La formulation littérale maintient le parallélisme avec « les fils d’Adam » ainsi que la différence lexicale entre אָדָם et אִישׁ, tout en laissant ouverte la portée exacte de cette paire.
- source_word: בְּמֹאזְנַיִם
  choice: sur la balance
  rationale: Le duel hébreu désigne une balance à deux plateaux. En français moderne, « sur la balance » exprime naturellement l’image de la pesée.
- source_word: לַעֲלוֹת
  choice: ils montent
  rationale: Le verbe עלה signifie monter. Dans l’image de la balance, leur plateau monte parce qu’ils n’ont aucun poids ; la traduction conserve cette image au lieu de la remplacer par une explication.
- source_word: מֵהֶבֶל
  choice: plus légers qu’un souffle
  rationale: Le מִן est comparatif dans ce contexte. L’ajout explicite de « légers » rend intelligible en français le rapport entre la montée du plateau et le souffle, sans abandonner la métaphore.
- source_word: יָחַד
  choice: tous ensemble
  rationale: 'Cette expression fait ressortir la totalité collective : considérés ensemble, ils demeurent sans poids.'
theological_decisions:
- issue: Interprétation de בְּנֵי אָדָם / בְּנֵי אִישׁ
  choice: Conserver dans le texte le parallélisme littéral « les fils d’Adam » / « les fils de l’homme ».
  alternative: « les gens du peuple » / « les grands » ou « les hommes de basse condition » / « les hommes de haut rang »
  rationale: La paire peut évoquer des catégories sociales, mais les mots hébreux désignent littéralement deux groupes formulés comme « fils de… ». Le texte principal préserve donc sa forme et son ambiguïté, tandis que l’interprétation sociale est signalée en note.
translation_notes:
  register: Français moderne, poétique et digne. La tournure « fils d’Adam / fils de l’homme » est volontairement plus littérale que le français courant afin de conserver le parallélisme et l’ambiguïté de l’hébreu. Le vocabulaire concret du souffle et de la balance unifie les deux moitiés du verset.
