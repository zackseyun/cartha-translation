id: PSA.62.12
reference: Psalms 62:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/לְ/ךָֽ אֲדֹנָ֥/י חָ֑סֶד כִּֽי אַתָּ֨ה תְשַׁלֵּ֖ם לְ/אִ֣ישׁ כְּֽ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/012.yaml
  text: And to you[a], O Lord, belongs steadfast love[b], for you repay each man according to his work.
translation:
  language: fr
  text: Et à toi, Seigneur, appartient l’amour fidèle[a], car tu rends à chacun selon ce qu’il a fait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Et à toi, Seigneur, l’amour fidèle. » L’hébreu ne comporte pas de verbe exprimé et place « à toi » en tête pour insister sur le fait que cet amour appartient au Seigneur.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « selon son œuvre » ou « selon son acte ».'
    reason: formal_equivalence
lexical_decisions:
- source_word: וּלְךָ
  choice: Et à toi… appartient
  rationale: La tournure française restitue la proposition nominale hébraïque et son complément antéposé, qui souligne que cet amour appartient au Seigneur.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé ici dans une adresse directe; « Seigneur » est naturel et conforme au registre de la prière.
- source_word: חָסֶד
  choice: amour fidèle
  rationale: Cette expression réunit les dimensions d’amour, de bonté et de loyauté durable portées par חֶסֶד, sans archaïsme.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le fondement ou l’explication de l’affirmation précédente.
- source_word: תְשַׁלֵּם
  choice: tu rends
  rationale: Le piel de שׁלם désigne le fait d’accorder à quelqu’un ce qui lui revient, en bien ou en mal. « Rendre » préserve cette amplitude mieux que « récompenser ».
- source_word: לְאִישׁ
  choice: à chacun
  rationale: Dans ce contexte sentencieux, אִישׁ a une portée distributive et représentative. « À chacun » exprime naturellement en français moderne que toute personne est concernée.
- source_word: כְּמַעֲשֵׂהוּ
  choice: selon ce qu’il a fait
  rationale: Cette formulation française idiomatique conserve l’idée de correspondance entre la conduite de chacun et ce que Dieu lui rend.
theological_decisions:
- issue: Rapport entre l’amour fidèle de Dieu et la rétribution selon les actes
  choice: Maintenir ensemble l’amour fidèle et le fait que Dieu rend à chacun selon ses actes.
  alternative: Réduire חָסֶד à la seule miséricorde ou limiter תְשַׁלֵּם à une récompense positive.
  rationale: Le verset associe lui-même l’amour loyal de Dieu à sa juste rétribution. La traduction ne doit ni atténuer cette tension ni préciser si l’issue est favorable ou défavorable.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe légèrement solennelle « Et à toi… appartient » conserve l’accent de l’hébreu, tandis que « à chacun selon ce qu’il a fait » reste immédiatement compréhensible.
