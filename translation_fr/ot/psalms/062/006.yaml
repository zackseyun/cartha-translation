  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹ֣א אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: fr
  text: 'Lui seul est mon rocher et mon salut, ma forteresse : je ne vacillerai pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Lui seul
  rationale: Dans le contexte du psaume, אַךְ souligne ici l’exclusivité, tandis que הוּא reprend Dieu comme sujet. « Lui seul » rend naturellement en français moderne cette insistance.
- source_word: צוּרִי
  choice: mon rocher
  rationale: צוּר désigne un rocher et sert ici de métaphore de stabilité et de protection. « Mon rocher » conserve l’image poétique et théologique de l’hébreu.
- source_word: וִישׁוּעָתִי
  choice: mon salut
  rationale: יְשׁוּעָה peut évoquer le salut, la délivrance ou la victoire. « Mon salut » préserve ici toute l’ampleur du terme sans le limiter à un secours ponctuel.
- source_word: מִשְׂגַּבִּי
  choice: ma forteresse
  rationale: מִשְׂגָּב désigne un lieu élevé et sûr servant de protection. « Ma forteresse » exprime clairement cette sécurité défensive en français courant.
- source_word: לֹא אֶמּוֹט
  choice: je ne vacillerai pas
  rationale: Le niphal de מוֹט exprime le fait d’être ébranlé, déplacé ou rendu chancelant. « Je ne vacillerai pas » garde l’image de stabilité, de façon concise et naturelle.
theological_decisions:
- issue: Degré de confiance dans la proposition finale
  choice: je ne vacillerai pas
  alternative: je ne serai pas ébranlé
  rationale: L’hébreu exprime une confiance ferme fondée sur Dieu, présenté comme rocher et forteresse. La formulation choisie conserve la métaphore de la stabilité sans expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme nominal de l’hébreu est conservé, ainsi que la progression des images de stabilité, de salut et de protection.
