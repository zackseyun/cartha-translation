    issue: La première variante de note dit « ne devenez pas vains à cause du vol ».
    rationale: « À cause de » introduit une relation causale qui n’est pas celle de בגזל. Pour conserver l’ambiguïté et rester proche de l’hébreu, il faut exprimer « dans le vol » ou, dans une formulation française plus idiomatique pour l’autre sens, « ne tirez pas vanité du vol ».
