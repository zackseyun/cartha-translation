source:
  edition: WLC
  text: אַל תִּבְטְח֣וּ בְ/עֹשֶׁק֮ וּ/בְ/גָזֵ֪ל אַל תֶּ֫הְבָּ֥לוּ חַ֤יִל כִּֽי יָנ֑וּב אַל תָּשִׁ֥יתוּ לֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/010.yaml
  text: Do not trust in oppression[a], and do not put vain hope in robbery; if wealth increases, do not set your heart on it.
translation:
  language: fr
  text: Ne mettez pas votre confiance dans l’oppression[a] ; ne placez pas de vains espoirs dans le vol. Si les richesses augmentent, n’y attachez pas votre cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne soyez pas vains dans le vol », ou « ne tirez pas vanité du vol ». Le verbe hébreu est difficile ; il peut exprimer l’idée d’agir vainement ou de placer son espoir dans ce qui est vide.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: mettez votre confiance
  rationale: Le verbe בטח exprime le fait de se fier à quelque chose ou d’y placer sa confiance. Cette tournure est naturelle en français et convient à l’avertissement.
- source_word: בְעֹשֶׁק
  choice: dans l’oppression
  rationale: עֹשֶׁק désigne l’oppression, l’exploitation ou l’extorsion. « Oppression » conserve ici la portée éthique générale du terme.
- source_word: בְגָזֵל
  choice: dans le vol
  rationale: גָזֵל renvoie à ce qui est pris par force, au pillage ou au vol. « Vol » est clair, direct et suffisamment large en français courant.
- source_word: תֶּהְבָּלוּ
  choice: placez de vains espoirs
  rationale: Ce verbe rare, formé sur הבל, peut évoquer ce qui est vain, vide ou illusoire. Dans le parallélisme, cette formulation rend de façon intelligible l’idée de compter sur une chose sans consistance, tout en signalant l’incertitude en note.
- source_word: חַיִל
  choice: les richesses
  rationale: חַיִל peut signifier force, ressources ou richesse. Avec le verbe « augmenter », le sens matériel est le plus probable; le pluriel « richesses » est idiomatique en français.
- source_word: כִּי יָנוּב
  choice: si les richesses augmentent
  rationale: נוב signifie littéralement pousser ou fructifier, d’où croître ou augmenter. « Si… augmentent » restitue naturellement la nuance conditionnelle dans ce contexte.
- source_word: תָּשִׁיתוּ לֵב
  choice: n’y attachez pas votre cœur
  rationale: L’expression שׁית לב évoque le fait de fixer son cœur, son attention ou son attachement sur quelque chose. « Attacher son cœur » conserve l’image et son ampleur affective et spirituelle.
theological_decisions:
- issue: Sens du deuxième membre du verset
  choice: Un avertissement à ne pas placer d’espoirs illusoires dans le vol
  alternative: « Ne devenez pas vains à cause du vol » ou « ne vous glorifiez pas du vol »
  rationale: La forme verbale est difficile. Le parallélisme avec l’interdiction de se confier dans l’oppression favorise l’idée d’une confiance vaine, mais les autres lectures plausibles sont conservées en note plutôt que supprimées.
- issue: Portée de l’avertissement final sur les richesses
  choice: Même lorsque les richesses augmentent, il ne faut pas y attacher son cœur
  alternative: Limiter l’avertissement final aux seules richesses acquises injustement
  rationale: Le dernier membre peut élargir la mise en garde aux richesses en général. La traduction ne restreint donc pas explicitement son application aux biens mal acquis.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est préservé en trois propositions. « De vains espoirs » maintient la notion de vanité tout en restant naturel; la note conserve les principales lectures possibles du verbe difficile.
