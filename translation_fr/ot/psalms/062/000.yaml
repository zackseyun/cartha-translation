  yaml_path: translation/ot/psalms/062/000.yaml
  text: 'For the choir director: according to Jeduthun[a]. A psalm of David[b].'
translation:
  language: fr
  text: Au directeur de la musique. D’après Yedoutoun[a]. Psaume de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « sur Yedoutoun » ou « pour Yedoutoun » ; l’expression peut désigner un style, un air ou une indication d’exécution musicale associés à Yedoutoun.
    reason: alternative_reading
  - marker: b
    text: Le titre « de David » peut indiquer que David en est l’auteur, que le psaume lui est dédié ou qu’il lui est associé.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au directeur de la musique
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement la personne chargée de diriger l’exécution musicale. Cette formulation est moderne, claire et ne limite pas indûment la fonction à un chœur.
- source_word: עַל
  choice: D’après
  rationale: Dans ce titre musical, la préposition peut renvoyer à un air, à un style ou à une indication d’exécution associés à Yedoutoun. « D’après » conserve mieux cette indétermination qu’une formulation plus précise.
- source_word: יְדוּתוּן
  choice: Yedoutoun
  rationale: Le nom propre hébreu est translittéré selon une forme française lisible. Il peut désigner le musicien lévitique ou une indication musicale associée à son nom.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est l’appellation française usuelle de ce genre poétique et musical dans les titres du psautier.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, la dédicace ou une association. La tournure « de David » maintient cette latitude sans imposer « composé par David ».
theological_decisions:
- issue: Sens de לְדָוִד dans le titre
  choice: de David
  alternative: par David ; pour David
  rationale: La construction hébraïque ne tranche pas nécessairement entre l’attribution d’auteur et une association ou dédicace davidique. La traduction retenue préserve cette ambiguïté.
translation_notes:
  register: Titre bref, digne et naturel en français international moderne. La ponctuation distingue les indications d’exécution et de genre sans ajouter de contenu absent de l’hébreu.
