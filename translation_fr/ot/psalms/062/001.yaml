  text: אַ֣ךְ אֶל אֱ֭לֹהִים דּֽוּמִיָּ֣ה נַפְשִׁ֑/י מִ֝מֶּ֗/נּוּ יְשׁוּעָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: fr
  text: C’est seulement devant Dieu que mon âme est silencieuse[a] ; de lui vient mon salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est seulement Dieu que mon âme attend en silence », ou « C’est seulement en Dieu que mon âme trouve le repos ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: seulement
  rationale: Le terme marque ici principalement l’exclusivité et donne au vers une ouverture brève et appuyée.
- source_word: אֶל
  choice: devant
  rationale: La préposition exprime l’orientation de l’âme vers Dieu. « Devant Dieu » est naturel en français et évoque sa posture en sa présence sans rendre la tournure négative ou étrange.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte singulier des Psaumes, le mot désigne le Dieu d’Israël.
- source_word: דּוּמִיָּה
  choice: demeure silencieuse
  rationale: Le nom évoque le silence, le calme ou la quiétude. Cette formulation conserve l’image première du silence tout en produisant une phrase française naturelle.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Le mot peut désigner la personne, la vie ou l’être intérieur. « Mon âme » convient au registre poétique et préserve l’expression traditionnelle sans réduire sa portée.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: 'La préposition indique la source : le salut vient de Dieu.'
- source_word: יְשׁוּעָתִי
  choice: mon salut
  rationale: Le terme désigne le salut ou la délivrance. « Mon salut » convient au registre du psaume tout en laissant subsister le sens concret de délivrance.
theological_decisions:
- issue: Sens de דּוּמִיָּה נַפְשִׁי
  choice: Une expression de silence confiant devant Dieu
  alternative: Mon âme attend Dieu en silence ; mon âme trouve son repos en Dieu
  rationale: Le nom hébreu peut évoquer le silence, la quiétude ou une attente paisible. Le texte principal conserve l’image lexicale du silence, tandis que la note signale les autres nuances sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, poétique et digne. La structure conserve le parallélisme concis du vers hébreu ; « devant Dieu » rend naturellement l’orientation exprimée par אֶל.
