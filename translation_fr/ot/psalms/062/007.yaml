source:
  edition: WLC
  text: עַל אֱ֭לֹהִים יִשְׁעִ֣/י וּ/כְבוֹדִ֑/י צוּר עֻזִּ֥/י מַ֝חְסִ֗/י בֵּֽ/אלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/007.yaml
  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: fr
  text: De Dieu dépendent mon salut et ma gloire[a] ; le rocher de ma force, mon refuge, est en Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Sur Dieu reposent mon salut et ma gloire. » « Ma gloire » peut aussi se comprendre comme « mon honneur », c’est-à-dire ma dignité ou ma réhabilitation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: dépendent de
  rationale: Dans cette proposition nominale, la préposition exprime que le salut et la gloire du psalmiste reposent sur Dieu. « Dépendent de » rend naturellement cette relation en français sans effacer l’image de fondement.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Équivalent français usuel lorsque אֱלֹהִים désigne le Dieu d’Israël.
- source_word: יִשְׁעִי
  choice: mon salut
  rationale: Le nom issu de ישׁע désigne le secours ou la délivrance ; « salut » conserve ici toute son ampleur poétique et théologique.
- source_word: וּכְבוֹדִי
  choice: et ma gloire
  rationale: כָּבוֹד peut signifier « gloire » ou « honneur ». « Ma gloire » préserve la formulation poétique, tandis qu’une note signale la nuance possible d’honneur ou de dignité.
- source_word: צוּר
  choice: le rocher
  rationale: La métaphore évoque la stabilité et la protection. L’article convient à l’apposition française « le rocher de ma force ».
- source_word: עֻזִּי
  choice: ma force
  rationale: Équivalent direct de עֹז, sans introduire l’image plus précise d’une forteresse.
- source_word: מַחְסִי
  choice: mon refuge
  rationale: Le nom désigne un abri ou un lieu où l’on se réfugie ; « refuge » est clair et naturel dans le registre des Psaumes.
- source_word: בֵּאלֹהִים
  choice: est en Dieu
  rationale: La préposition ב marque ici l’ancrage ou le lieu figuré du refuge. Le verbe « est », absent dans la proposition nominale hébraïque, est ajouté pour obtenir une phrase française complète.
theological_decisions:
- issue: Rapport de la proposition prépositionnelle initiale aux propositions nominales
  choice: Exprimer que le salut et la gloire du psalmiste dépendent de Dieu
  alternative: 'Traduire plus formellement : « Sur Dieu reposent mon salut et ma gloire » ou « Sur Dieu sont mon salut et ma gloire »'
  rationale: L’hébreu ne comporte pas de verbe et laisse la relation sous une forme concise. « Dépendent de Dieu » rend le sens de soutien ou de fondement sans préciser davantage le mécanisme théologique.
- issue: Sens de כְבוֹדִי
  choice: ma gloire
  alternative: mon honneur
  rationale: Les deux sens sont lexicalement possibles. Le texte principal conserve le terme poétique traditionnel, et la note maintient visible la nuance de dignité ou de réhabilitation.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste poétique tout en étant immédiatement intelligible ; elle conserve le parallélisme et les métaphores du rocher et du refuge.
