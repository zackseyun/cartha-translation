id: PSA.62.4
reference: Psalms 62:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: fr
  text: Ils ne complotent que pour le faire tomber de sa position élevée[a] ; ils se plaisent au mensonge. De leur bouche[b], ils bénissent, mais au fond d’eux-mêmes, ils maudissent. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa dignité », « de son élévation » ou « de son éminence ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement « avec sa bouche » ; le sens est probablement collectif : extérieurement, ils bénissent, mais intérieurement, ils maudissent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: ne… que
  rationale: La tournure restrictive française exprime ici que leur unique dessein est de faire tomber l’homme visé.
- source_word: מִשְּׂאֵתוֹ
  choice: de sa position élevée
  rationale: שְׂאֵת peut désigner l’élévation, la dignité ou l’éminence. Cette formulation conserve à la fois l’image verticale et l’idée de rang sans préciser excessivement leur nature.
- source_word: יָעֲצוּ
  choice: complotent
  rationale: Le verbe évoque une délibération ou un projet concerté ; le contexte hostile justifie le terme naturel « complotent ».
- source_word: לְהַדִּיחַ
  choice: pour le faire tomber
  rationale: Le hiphil de נדח exprime l’action de chasser, renverser ou faire déchoir quelqu’un ; associé à une position élevée, « faire tomber » rend clairement l’image.
- source_word: יִרְצוּ כָזָב
  choice: ils se plaisent au mensonge
  rationale: רצה indique ici le plaisir ou la complaisance, tandis que כָזָב désigne le mensonge ou la fausseté.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: De leur bouche, ils bénissent
  rationale: Le texte écrit porte littéralement le singulier « de sa bouche », mais le parallélisme avec « au fond d’eux-mêmes » et le sujet pluriel favorisent un sens collectif. La note conserve la difficulté textuelle.
- source_word: וּבְקִרְבָּם
  choice: au fond d’eux-mêmes
  rationale: L’expression désigne leur intérieur, par opposition aux paroles prononcées extérieurement.
- source_word: יְקַלְלוּ
  choice: ils maudissent
  rationale: Le verbe signifie directement « maudire » et forme une antithèse nette avec « bénir ».
- source_word: סֶלָה
  choice: Sèla
  rationale: Le sens précis de ce terme liturgique ou musical demeure incertain ; une translittération française évite d’imposer une interprétation.
theological_decisions:
- issue: Référent du suffixe masculin singulier et de l’objet de « faire tomber »
  choice: Le verset présente les adversaires cherchant à faire tomber un homme déterminé, vraisemblablement le psalmiste, de sa position élevée.
  alternative: On pourrait rendre le référent de manière plus générique, ou comprendre שְׂאֵת surtout comme sa dignité ou son honneur.
  rationale: Le suffixe hébreu est masculin singulier. « Le » et « sa » préservent ce référent personnel sans lui attribuer une identité théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme entre la bouche et l’intériorité est maintenu, ainsi que l’incertitude lexicale concernant la position ou la dignité de l’homme visé.
