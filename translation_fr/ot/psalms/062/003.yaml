revisions:
- from: Jusqu’à quand vous acharnerez-vous contre un homme ? Vous tous, l’abattrez-vous[a], comme un mur qui penche[b], comme une clôture qui s’écroule ?
  to: Jusqu’à quand vous acharnerez-vous contre un homme, vous tous, pour l’abattre, comme un mur qui penche, comme une clôture renversée ?
  rationale: La révision allège la syntaxe tout en gardant la question unique qui encadre les verbes hébreux. Elle conserve « abattre », qui coordonne la violence exercée contre l’homme et l’imagerie architecturale, mais rend la clôture comme « renversée » afin de refléter plus directement le participe issu de דחה. La note conserve l’alternative littérale sans surdéterminer le sens métaphorique.
