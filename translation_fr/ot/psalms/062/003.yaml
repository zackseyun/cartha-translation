review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement l’attaque violente (תְּהוֹתְתוּ), la cible individuelle masculine (« un homme »), l’insistance collective (« vous tous ») et les images d’un mur incliné et d’une clôture poussée/renversée. Toutefois, « comme une clôture qui s’écroule » transforme plus nettement le participe passif הַדְּחוּיָה (« repoussée / renversée ») en action en cours. « Clôture renversée » est à la fois plus proche du terme hébreu et naturel. La syntaxe de la comparaison demeure ambiguë quant à son référent, comme il convient.
  naturalness: La formulation actuelle est globalement naturelle et de registre approprié, mais « Vous tous, l’abattrez-vous » est une inversion lourde en français moderne. Une phrase interrogative continue rend mieux la portée de la question initiale sans introduire une seconde question artificielle.
  terminology: « S’acharner contre », « un homme » et « abattre » conviennent. « Abattre » est un choix contextuellement défendable pour רצח dans cette image de démolition, à condition de conserver en note la valeur ordinaire, meurtrière, du verbe. « Assassiner » est plus étroit que le champ de רצח; « tuer » est préférable dans la note.
  issues:
  - severity: low
    issue: Syntaxe française de la seconde action
    rationale: « Vous tous, l’abattrez-vous » est grammatical mais pesant. La question hébraïque introduite par « Jusqu’à quand » peut porter sur l’ensemble de l’énoncé; une construction continue est plus idiomatique.
  - severity: low
    issue: Nuance de גָּדֵר הַדְּחוּיָה
    rationale: « Qui s’écroule » explicite un effondrement en cours, alors que le terme décrit plus directement une clôture repoussée ou renversée. « Renversée » préserve mieux l’image sans perdre la lisibilité.
  - severity: low
    issue: Note lexicale sur רצח
    rationale: « Assassiner » peut suggérer préméditation ou meurtre ciblé; « tuer » rend plus largement la valeur usuelle du verbe sans cette précision supplémentaire.
  revised_text: Jusqu’à quand vous acharnerez-vous contre un homme, vous tous, pour l’abattre, comme un mur qui penche, comme une clôture renversée ?
