  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: fr
  text: Jusqu’à quand vous acharnerez-vous contre un homme, vous tous, pour l’abattre, comme un mur qui penche, comme une clôture renversée ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: vous acharnerez-vous contre
  rationale: Ce verbe rare exprime une attaque violente. « S’acharner contre » rend naturellement en français l’hostilité collective et persistante sans préciser indûment la manière de l’assaut.
- source_word: עַל אִישׁ
  choice: contre un homme
  rationale: La préposition עַל marque ici l’hostilité dirigée contre quelqu’un, et אִישׁ désigne au singulier masculin l’homme pris pour cible.
- source_word: תְּרָצְּחוּ
  choice: l’abattrez-vous
  rationale: Le piel de רצח évoque normalement le meurtre, mais le contexte immédiat développe l’image d’un mur et d’une clôture près de s’effondrer. « Abattre » conserve la violence potentiellement meurtrière tout en reliant l’action à cette image structurelle.
- source_word: כֻלְּכֶם
  choice: vous tous
  rationale: La formulation garde l’insistance du pronom pluriel hébreu et souligne que tous les adversaires participent à l’attaque.
- source_word: כְּקִיר נָטוּי
  choice: comme un mur qui penche
  rationale: Cette expression reproduit simplement l’image d’un mur incliné et instable, sans ajouter explicitement qu’il va tomber.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: comme une clôture qui s’écroule
  rationale: Le participe de דחה décrit quelque chose de poussé, écarté ou renversé. « Qui s’écroule » communique en français courant l’image dynamique d’une clôture cédant sous la poussée.
theological_decisions:
- issue: Référent de la comparaison avec le mur et la clôture
  choice: La syntaxe française rattache principalement la comparaison à l’homme attaqué, présenté comme près de s’effondrer.
  alternative: La comparaison peut décrire les assaillants se pressant contre leur victime comme un mur bombé ou incliné.
  rationale: Le contexte et le verbe « abattre » favorisent l’image de la victime fragilisée, mais l’hébreu ne rend pas absolument certain le référent de la comparaison; l’autre lecture est donc signalée.
translation_notes:
  register: Français international moderne, naturel et digne. « S’acharner contre » rend l’assaut persistant; « abattre » maintient volontairement le double registre de la mise à mort et de la démolition. Les deux questions et le parallélisme imagé de la poésie hébraïque sont conservés.
