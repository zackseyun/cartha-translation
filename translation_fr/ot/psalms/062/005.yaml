  text: אַ֣ךְ לֵ֭/אלֹהִים דּ֣וֹמִּי נַפְשִׁ֑/י כִּי מִ֝מֶּ֗/נּוּ תִּקְוָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/005.yaml
  text: For God alone[a], be silent, my soul[c][b], for my hope is from him.
translation:
  language: fr
  text: Mon âme, reste silencieuse devant Dieu seul, car mon espérance vient de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לֵאלֹהִים
  choice: Pour Dieu seul
  rationale: אַךְ marque ici l’exclusivité et porte sur l’orientation vers Dieu. « Pour Dieu seul » conserve cette emphase et la structure hébraïque.
- source_word: דּוֹמִּי
  choice: reste en silence
  rationale: Le verbe דמם exprime le silence ou l’immobilité paisible. La forme pointée est comprise comme une exhortation adressée à l’âme; « reste en silence » est direct et naturel, sans ajouter explicitement l’idée d’attendre.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Cette expression préserve l’image hébraïque dans laquelle le psalmiste s’adresse à lui-même, tout en demeurant familière en français biblique moderne.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’exhortation.
- source_word: מִמֶּנּוּ
  choice: de lui
  rationale: Le pronom renvoie à Dieu et conserve la cohésion du texte sans déplacer vers ce membre de phrase l’exclusivité exprimée par אַךְ.
- source_word: תִּקְוָתִי
  choice: mon espérance
  rationale: תִּקְוָה désigne l’espérance ou l’attente confiante. « Mon espérance » est précis, naturel et digne en français.
theological_decisions:
- issue: Énoncé descriptif ou exhortation adressée à soi-même
  choice: 'Exhortation : « reste en silence, mon âme »'
  alternative: 'Énoncé : « mon âme attend en silence Dieu seul »'
  rationale: La forme massorétique דּוֹמִּי est prise comme un impératif féminin singulier adressé à נַפְשִׁי. L’autre analyse reste possible et est signalée en note afin de préserver l’ambiguïté d’interprétation.
translation_notes:
  register: Français international moderne, sobre et poétique. L’ordre « Pour Dieu seul » maintient l’exclusivité initiale de l’hébreu; « reste en silence » conserve la valeur fondamentale du verbe sans expliciter indûment « attendre ».
