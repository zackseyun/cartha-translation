revisions:
- from: Pour Dieu seul, reste en silence, mon âme[a], car mon espérance vient de lui.
  to: Mon âme, reste silencieuse devant Dieu seul, car mon espérance vient de lui.
  rationale: La révision supprime l’ambiguïté française de « Pour Dieu seul » tout en gardant Dieu comme l’unique orientation de l’exhortation. Elle maintient l’analyse impérative choisie, le vocabulaire sobre du psaume et une note qui signale l’analyse descriptive possible du verbe hébreu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:30:41Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction reconnaît de façon justifiée l’analyse impérative de דּוֹמִּי, adressée à « mon âme », et rend correctement la motivation introduite par כִּי ainsi que l’origine divine de l’espérance. Toutefois, « Pour Dieu seul » en français peut évoquer une action accomplie au bénéfice de Dieu et ne rend pas naturellement l’orientation exprimée par לֵאלֹהִים. « Devant Dieu seul » explicite sobrement cette orientation sans ajouter l’idée d’attente.
  naturalness: « Pour Dieu seul, reste en silence, mon âme » est raide et peut être mal compris en français moderne. L’apostrophe initiale et « reste silencieuse devant Dieu seul » constituent une formulation plus idiomatique, sobre et poétique.
  terminology: « Mon âme », « espérance » et « vient de lui » sont appropriés au registre des Psaumes et fidèles aux termes hébreux. Le rendu « silencieuse » conserve la valeur fondamentale de דמם sans imposer « attendre ».
  issues:
  - severity: medium
    issue: « Pour Dieu seul » est ambigu et peu naturel dans la phrase principale.
    rationale: En français, cette expression se comprend facilement comme « pour le bénéfice de Dieu seul ». Dans le contexte, le complément introduit par ל oriente le silence de l’âme vers Dieu; « devant Dieu seul » rend cette relation de manière intelligible.
  - severity: low
    issue: La note alternative présente « attend en silence Dieu seul », formulation française ambiguë.
    rationale: Sans « devant », « attend Dieu seul » peut signifier que Dieu est l’unique personne attendue plutôt que l’unique destinataire de l’attente silencieuse. La note doit aussi conserver clairement l’alternative entre une exhortation et un énoncé.
  revised_text: Mon âme, reste silencieuse devant Dieu seul, car mon espérance vient de lui.
  revised_footnotes:
  - marker: a
    text: 'Ou : « Mon âme attend en silence devant Dieu seul, car mon espérance vient de lui », si l’on comprend le verbe comme un énoncé descriptif. Le verbe hébreu peut évoquer le fait de garder le silence, de rester tranquille ou d’attendre paisiblement.'
    reason: alternative_reading
  revision_rationale: La révision supprime l’ambiguïté française de « Pour Dieu seul » tout en gardant Dieu comme l’unique orientation de l’exhortation. Elle maintient l’analyse impérative choisie, le vocabulaire sobre du psaume et une note qui signale l’analyse descriptive possible du verbe hébreu.
