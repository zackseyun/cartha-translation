  variant: modern international French
source:
  edition: WLC
  text: בִּטְח֘וּ ב֤/וֹ בְ/כָל עֵ֨ת עָ֗ם שִׁפְכֽוּ לְ/פָנָ֥י/ו לְבַבְ/כֶ֑ם אֱלֹהִ֖ים מַחֲסֶה לָּ֣/נוּ סֶֽלָה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: fr
  text: Mettez en lui votre confiance en tout temps[a], ô peuple[b] ; épanchez vos cœurs devant lui[c]. Dieu est pour nous un refuge. Séla[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « constamment » ; littéralement « à tout moment ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit par « ô peuple » est une adresse directe à la communauté.
    reason: cultural_note
  - marker: c
    text: « Épancher son cœur » est une image hébraïque qui signifie exprimer ouvertement devant Dieu ses pensées, ses désirs et tout ce que l’on porte intérieurement.
    reason: lexical_alternative
  - marker: d
    text: « Séla » est probablement un terme liturgique ou musical, mais son sens précis reste incertain.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: Mettez en lui votre confiance
  rationale: L’impératif pluriel de בטח exprime le fait de se fier à quelqu’un ou de placer sa confiance en lui. Cette formulation est naturelle en français et conserve le complément « en lui ».
- source_word: בְכָל־עֵת
  choice: en tout temps
  rationale: L’expression signifie littéralement « à tout moment » et exhorte à une confiance constante, quelles que soient les circonstances.
- source_word: עָם
  choice: ô peuple
  rationale: Le nom singulier fonctionne ici comme une apostrophe adressée à la communauté. « Ô peuple » rend clairement cette adresse sans préciser indûment une identité nationale.
- source_word: שִׁפְכוּ
  choice: épanchez
  rationale: Le verbe signifie « verser ». Avec le cœur comme objet, « épancher » conserve l’image tout en exprimant naturellement une ouverture entière devant Dieu.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: L’expression signifie littéralement « devant sa face », c’est-à-dire en sa présence. « Devant lui » reste sobre et proche de l’hébreu.
- source_word: לְבַבְכֶם
  choice: vos cœurs
  rationale: Le substantif « cœur » désigne l’être intérieur, notamment les pensées, les volontés et les désirs. Le suffixe pluriel s’adresse à toute la communauté ; le pluriel distributif français « vos cœurs » est naturel.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte exige le sens singulier du terme hébreu courant désignant Dieu.
- source_word: מַחֲסֶה לָּנוּ
  choice: pour nous un refuge
  rationale: מַחֲסֶה désigne un abri protecteur, et לָנוּ indique ici le bénéfice pour la communauté. La formulation préserve explicitement ces deux éléments.
- source_word: סֶלָה
  choice: Séla
  rationale: Le terme est translittéré, car sa fonction exacte, probablement liturgique ou musicale, demeure incertaine.
theological_decisions:
- issue: Portée communautaire de עָם
  choice: 'L’exhortation s’adresse directement à la communauté au singulier : « ô peuple »'
  alternative: « peuples » ou une mention non vocative du peuple
  rationale: Après les impératifs pluriels, עָם se comprend naturellement comme un vocatif singulier. Cette lecture conserve la dimension collective sans transformer le terme en pluriel ni lui donner un sens politique plus étroit.
- issue: Traduction de סֶלָה
  choice: Conserver le terme sous la forme « Séla »
  alternative: « pause », « interlude » ou une autre indication musicale
  rationale: La signification précise du terme n’est pas établie. Le translittérer préserve cette incertitude au lieu d’imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. L’apostrophe poétique « ô peuple » conserve la forme communautaire du texte. « Épanchez vos cœurs » garde la métaphore hébraïque tout en restant idiomatique ; le pluriel français explicite la portée distributive du suffixe pluriel. Le point-virgule articule les deux exhortations, et « Séla » est maintenu sans interprétation.
