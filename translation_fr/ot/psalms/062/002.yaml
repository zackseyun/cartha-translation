  text: He alone is my rock and my salvation[a], my stronghold; I will not be greatly shaken.
translation:
  language: fr
  text: Lui seul est mon rocher et mon salut, ma forteresse ; je ne vacillerai pas beaucoup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne serai pas fortement ébranlé ». L’hébreu ajoute un terme de degré, « beaucoup » ou « grandement », qui atténue légèrement l’affirmation par rapport à une formulation absolue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: seul
  rationale: 'Dans ce contexte, la particule marque l’exclusivité : Dieu est l’unique fondement de la sécurité du psalmiste.'
- source_word: הוּא
  choice: Lui
  rationale: Le pronom masculin singulier renvoie à Dieu. La tournure « Lui seul » rend naturellement en français l’insistance de l’hébreu.
- source_word: צוּרִי
  choice: mon rocher
  rationale: Le terme désigne un rocher ou un escarpement et sert ici de métaphore de stabilité et de protection.
- source_word: וִישׁוּעָתִי
  choice: mon salut
  rationale: Le nom peut désigner le salut ou la délivrance. « Salut » conserve sa portée large tout en convenant au contexte de secours.
- source_word: מִשְׂגַּבִּי
  choice: ma forteresse
  rationale: Le mot évoque un lieu élevé et sûr. « Forteresse » préserve clairement l’image de protection défensive.
- source_word: לֹא אֶמּוֹט
  choice: je ne serai pas ébranlé
  rationale: Le verbe exprime l’idée de chanceler, de vaciller ou d’être ébranlé. Cette formulation est naturelle et maintient la métaphore de la stabilité.
- source_word: רַבָּה
  choice: fortement
  rationale: Employé adverbialement, ce terme précise le degré de l’ébranlement. « Fortement » conserve cette nuance sans rendre l’affirmation absolue.
theological_decisions:
- issue: Degré de sécurité exprimé dans la dernière proposition
  choice: je ne serai pas fortement ébranlé
  alternative: je ne serai pas ébranlé
  rationale: L’hébreu contient רַבָּה, un modificateur de degré. Le conserver respecte la nuance du texte et évite d’harmoniser ce verset avec la formulation absolue d’un verset voisin.
translation_notes:
  register: Français international moderne, digne et accessible. Les métaphores bibliques du rocher et de la forteresse sont conservées. La dernière proposition reste volontairement légèrement inhabituelle afin de préserver le modificateur présent en hébreu.
