source:
  edition: WLC
  text: כִּֽי כְ֭סָלַ/י מָלְא֣וּ נִקְלֶ֑ה וְ/אֵ֥ין מְ֝תֹ֗ם בִּ/בְשָׂרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/007.yaml
  text: For my loins are filled with burning[b][a], and there is no soundness in my flesh.
translation:
  language: fr
  text: Car mes reins[b] sont remplis d’inflammation[a], et il n’y a rien de sain dans ma chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est difficile. Dans ce contexte, il peut désigner une inflammation ou une brûlure ; certains lui donnent plutôt le sens de « chose méprisable » ou « honteuse ».
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner les flancs ou les hanches.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison de la détresse exprimée dans le contexte.
- source_word: כְסָלַי
  choice: mes reins
  rationale: Le terme désigne la région des reins, des flancs ou des hanches. « Mes reins » conserve la référence corporelle concrète sans la préciser abusivement.
- source_word: מָלְאוּ
  choice: sont remplis
  rationale: Reproduit le sens statif ou résultatif du qal de מלא et s’accorde naturellement avec le complément.
- source_word: נִקְלֶה
  choice: une brûlure
  rationale: Le mot est difficile. Dans ce contexte de souffrance physique, il évoque vraisemblablement une sensation de brûlure ou une inflammation; le singulier abstrait évite d’ajouter des « plaies » absentes de l’hébreu.
- source_word: וְאֵין מְתֹם
  choice: et il n’y a rien de sain
  rationale: Expression française naturelle qui rend la négation existentielle et l’absence complète d’intégrité physique.
- source_word: בִּבְשָׂרִי
  choice: dans ma chair
  rationale: Conserve la concrétude corporelle de בשר dans ce contexte littéral de maladie ou de blessure.
theological_decisions:
- issue: Sens de בשרי dans un psaume de souffrance corporelle
  choice: « ma chair » au sens physique
  alternative: « mon corps »
  rationale: Le parallélisme avec les reins et l’absence de santé indique une affection corporelle; rien n’impose ici un sens théologique spécialisé.
- issue: Interprétation de נִקְלֶה
  choice: affection physique exprimée par « une brûlure »
  alternative: « une inflammation », ou le sens abstrait « chose méprisable / honteuse »
  rationale: Le contexte somatique favorise le sens de brûlure ou d’inflammation, mais l’incertitude lexicale doit être signalée plutôt que transformée en diagnostic précis.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de la structure hébraïque. « Rien de sain » est plus idiomatique que « aucune intégrité », tandis que « chair » préserve l’image corporelle du texte.
