id: PSA.38.3
reference: Psalms 38:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: fr
  text: Il n’y a rien de sain dans ma chair à cause de ton indignation[a] ; il n’y a aucun bien-être dans mes os à cause de mon péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta colère » ou « ta fureur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: rien de sain
  rationale: Le nom exprime l’intégrité ou le bon état. Dans cette plainte corporelle, « rien de sain » rend naturellement l’absence totale de santé physique.
- source_word: בִּבְשָׂרִי
  choice: dans ma chair
  rationale: « Chair » conserve l’image corporelle concrète de l’hébreu et convient au registre poétique du psaume.
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans les deux propositions, la préposition introduit clairement la cause.
- source_word: זַעְמֶךָ
  choice: ton indignation
  rationale: Le terme désigne une vive colère. « Indignation » exprime la gravité du déplaisir divin sans lui imposer un sens théologique plus technique.
- source_word: שָׁלוֹם
  choice: bien-être
  rationale: Dans le contexte des os et de la souffrance physique, le mot évoque ici l’intégrité, le bon état ou le bien-être plutôt que la seule absence de conflit.
- source_word: בַּעֲצָמַי
  choice: dans mes os
  rationale: La traduction littérale préserve l’image poétique d’une souffrance qui atteint le psalmiste au plus profond de lui-même.
- source_word: חַטָּאתִי
  choice: mon péché
  rationale: Cette expression directe rend le péché personnel que le psalmiste présente comme cause de sa détresse.
theological_decisions:
- issue: Rapport entre la colère divine, le péché et la souffrance du psalmiste
  choice: Le verset relie directement la détresse corporelle du psalmiste à l’indignation de Dieu et à son propre péché, sans expliquer davantage ce rapport.
  alternative: On peut comprendre ces paroles comme l’expression poétique d’une expérience d’éloignement de Dieu, plutôt que comme une affirmation générale sur la cause de toute souffrance.
  rationale: La traduction maintient les deux relations causales formulées en hébreu, sans les atténuer ni en tirer une doctrine générale de la souffrance.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, de même que les images concrètes de la chair et des os. « Bien-être » est préféré à « paix » dans la seconde proposition, car il est plus idiomatique en français avec « dans mes os » tout en reflétant la portée contextuelle de שָׁלוֹם.
