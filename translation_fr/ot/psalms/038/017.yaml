  text: Car je suis sur le point de tomber, et ma douleur est constamment devant moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְצֶלַע
  choice: sur le point de tomber
  rationale: Dans ce contexte de détresse, l’expression indique que le psalmiste est prêt ou exposé à chanceler et à tomber. Cette formulation française naturelle conserve l’image d’une chute imminente, sans la réduire à une simple faiblesse physique.
- source_word: מַכְאוֹבִי
  choice: ma douleur
  rationale: Le nom peut désigner une douleur ou une souffrance. Le singulier « ma douleur » correspond directement au texte hébreu et laisse ouverte sa dimension physique ou intérieure.
- source_word: נֶגְדִּי תָמִיד
  choice: constamment devant moi
  rationale: Rend l’idée que la douleur demeure continuellement présente face au locuteur, dans une formulation française claire et fidèle.
theological_decisions:
- issue: Nature de la chute évoquée
  choice: tomber
  alternative: chanceler / boiter
  rationale: Le contexte permet une image de défaillance imminente sans préciser exclusivement une chute physique, morale ou spirituelle. « Tomber » préserve cette amplitude et concorde avec la révision auditée.
translation_notes:
  register: Français moderne, sobre et digne. La structure causale et le parallélisme du vers hébreu sont conservés, avec une syntaxe immédiatement compréhensible.
