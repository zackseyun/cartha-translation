  text: וַ/יְנַקְשׁ֤וּ מְבַקְשֵׁ֬י נַפְשִׁ֗/י וְ/דֹרְשֵׁ֣י רָ֭עָתִ/י דִּבְּר֣וּ הַוּ֑וֹת וּ֝/מִרְמ֗וֹת כָּל הַ/יּ֥וֹם יֶהְגּֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: fr
  text: Ceux qui cherchent à m’ôter la vie tendent des pièges[a] ; ceux qui cherchent mon malheur profèrent des paroles destructrices[b] ; tout au long du jour, ils méditent des tromperies[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « posent des lacets ». Le verbe hébreu évoque le fait de piéger ou d’entraver quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Ou « parlent de ruines » ou « disent des choses funestes ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe peut aussi signifier « murmurer » ou « ruminer » ; ici, il évoque une activité continuelle liée à la tromperie.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: tendent des pièges
  rationale: Le verbe נקשׁ évoque l’action de poser un piège ou un lacet. « Tendent des pièges » est naturel en français et conserve l’image d’une embuscade hostile.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ceux qui en veulent à ma vie
  rationale: Dans ce contexte hostile, נֶפֶשׁ désigne la vie de la personne menacée. Cette tournure idiomatique exprime clairement une intention meurtrière sans traduire à tort par « âme ».
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: ceux qui cherchent mon malheur
  rationale: La construction exprime la recherche active du mal ou du tort destiné au psalmiste. « Mon malheur » garde la portée assez large de רָעָה.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: parlent de ruine
  rationale: הַוּוֹת peut désigner des désastres, la ruine ou des actions destructrices. « Parlent de ruine » préserve le lien direct entre la parole et la destruction sans préciser indûment s’il s’agit de menaces ou de projets.
- source_word: וּמִרְמוֹת
  choice: des tromperies
  rationale: Le pluriel hébreu désigne des paroles ou procédés trompeurs. Le pluriel français maintient cette forme et convient comme complément de « murmurent ».
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Formulation française naturelle qui rend l’idée de continuité portée par l’expression temporelle.
- source_word: יֶהְגּוּ
  choice: murmurent
  rationale: הגה peut signifier murmurer, méditer ou ruminer. Avec « tromperies » pour objet, « murmurent » conserve l’idée d’une parole répétée et discrète sans ajouter explicitement celle de comploter.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est maintenu, ainsi que l’ambiguïté de הַוּוֹת et de יֶהְגּוּ. Le point-virgule distingue les trois mouvements du verset sans alourdir la lecture.
