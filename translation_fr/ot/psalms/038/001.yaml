  text: יְֽהוָ֗ה אַל בְּ/קֶצְפְּ/ךָ֥ תוֹכִיחֵ֑/נִי וּֽ/בַ/חֲמָתְ/ךָ֥ תְיַסְּרֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: fr
  text: Yahweh, ne me reprends pas dans ta colère, ne me corrige pas dans ta fureur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin YHWH, conservant ici le nom personnel plutôt que de le remplacer par un titre.
- source_word: אַל
  choice: ne… pas
  rationale: La particule négative introduit une supplication portant sur les deux verbes parallèles.
- source_word: בְּקֶצְפְּךָ
  choice: dans ta colère
  rationale: קֶצֶף désigne la colère ou l’indignation; cette formulation naturelle conserve la préposition hébraïque.
- source_word: תוֹכִיחֵנִי
  choice: me reprends
  rationale: Le hifil de יכח exprime ici l’action de reprendre ou de réprimander; «reprendre» convient au registre de la prière et reste distinct du second verbe.
- source_word: וּבַחֲמָתְךָ
  choice: dans ta fureur
  rationale: חֵמָה évoque une colère intense; «fureur» maintient la progression poétique par rapport à «colère». La coordination est rendue par la juxtaposition négative naturelle en français.
- source_word: תְיַסְּרֵנִי
  choice: me corrige
  rationale: Le piel de יסר peut signifier corriger, discipliner ou châtier. «Corriger» conserve la dimension corrective sans imposer l’idée exclusive d’une punition corporelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme. La transcription «Yahweh» préserve le nom propre tout en évitant de le remplacer silencieusement par un titre.
- issue: Nature de la correction demandée
  choice: reprendre / corriger
  alternative: réprimander / châtier
  rationale: Les deux verbes peuvent comporter une dimension punitive, mais ils désignent aussi la réprimande et la discipline corrective. Le parallélisme est conservé sans préciser au-delà de l’hébreu la forme de cette correction.
translation_notes:
  register: Français moderne, direct et digne. Le vocatif sans «Ô» est naturel aujourd’hui. Le parallélisme hébreu est maintenu par deux propositions négatives équilibrées et par la gradation «colère / fureur».
