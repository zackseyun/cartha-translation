  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: fr
  text: 'Seigneur, tout mon désir[a] est devant toi,

    et mon gémissement[b] ne t’est pas caché.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute mon aspiration ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mon soupir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé ici comme apostrophe directe. « Seigneur » est naturel en français et ne le confond pas avec le nom divin YHWH.
- source_word: נֶגְדְּךָ
  choice: devant toi
  rationale: L’expression indique que le désir du psalmiste se trouve dans la présence et sous le regard de Dieu. « Devant toi » conserve cette image avec naturel.
- source_word: כָל
  choice: tout
  rationale: 'Le mot exprime la totalité : aucune part du désir du psalmiste n’échappe à Dieu.'
- source_word: תַּאֲוָתִי
  choice: mon désir
  rationale: Dans ce contexte de lamentation, le nom désigne un désir profond ou une aspiration, non une convoitise sensuelle. « Mon désir » reste large et fidèle; « toute mon aspiration » est signalé en note.
- source_word: וְאַנְחָתִי
  choice: et mon gémissement
  rationale: Le nom évoque l’expression, audible ou intérieure, d’une profonde détresse. « Gémissement » convient au registre de la lamentation; « soupir » reste une autre possibilité.
- source_word: מִמְּךָ
  choice: ne t’est pas
  rationale: Avec le verbe passif « être caché », le français exprime naturellement la personne à qui rien n’est caché au moyen du pronom indirect « te ».
- source_word: לֹא נִסְתָּרָה
  choice: ne t’est pas caché
  rationale: 'Le nifal décrit ici un état passif : le gémissement n’est pas dissimulé à Dieu. Le présent correspond à la confession immédiate du psaume.'
theological_decisions:
- issue: Apostrophe divine avec אֲדֹנָי plutôt qu’avec le nom divin YHWH
  choice: Seigneur
  alternative: L’ÉTERNEL
  rationale: Le texte source porte אֲדֹנָי, titre de souveraineté, et non le tétragramme YHWH. La traduction ne doit donc pas lui appliquer la convention réservée au nom divin.
translation_notes:
  register: 'Français international moderne, sobre et digne. Le parallélisme poétique est conservé en deux lignes, ainsi que les deux images complémentaires : le désir exposé devant Dieu et le gémissement qui ne lui est pas caché.'
