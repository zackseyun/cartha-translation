id: PSA.38.20
reference: Psalms 38:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מְשַׁלְּמֵ֣י רָ֭עָה תַּ֣חַת טוֹבָ֑ה יִ֝שְׂטְנ֗וּ/נִי תַּ֣חַת רדופ/י טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/020.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: fr
  text: Ceux qui rendent le mal pour le bien s’opposent à moi[a], parce que je poursuis ce qui est bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ils s’opposent à moi en retour de ma poursuite du bien ».'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: Ceux qui rendent
  rationale: Le participe de שלם désigne ceux qui rendent quelque chose en retour. « Rendre le mal pour le bien » est une tournure française naturelle qui conserve cette réciprocité.
- source_word: רָעָה
  choice: le mal
  rationale: « Le mal » préserve la portée morale du terme et son opposition concise avec « le bien ».
- source_word: תַּחַת
  choice: pour / parce que
  rationale: Dans la première occurrence, « pour » exprime naturellement l’échange. Dans la seconde, la relation de rétribution ou de motif est rendue de façon idiomatique par « parce que », tandis que la note conserve une formulation plus littérale.
- source_word: טוֹבָה
  choice: le bien
  rationale: Le nom désigne ici le bien fait ou reçu. « Le bien » maintient l’antithèse avec « le mal » sans préciser indûment s’il s’agit d’un bienfait particulier.
- source_word: יִשְׂטְנוּנִי
  choice: s’opposent à moi
  rationale: Le verbe שטן exprime l’action de se poser en adversaire. Cette traduction évite de restreindre le sens à l’accusation judiciaire ou de l’intensifier en haine.
- source_word: רְדָפִי
  choice: je poursuis
  rationale: L’infinitif construit avec suffixe signifie littéralement « mon fait de poursuivre ». La proposition personnelle est plus naturelle en français tout en gardant l’idée d’une recherche active.
- source_word: טוֹב
  choice: ce qui est bien
  rationale: L’adjectif substantivé désigne ici le bien comme objet de la poursuite. « Ce qui est bien » est clair et naturel en français moderne.
theological_decisions:
- issue: Valeur de la seconde proposition introduite par תַּחַת
  choice: parce que je poursuis ce qui est bien
  alternative: en retour de ma poursuite du bien
  rationale: La formulation causale exprime clairement que l’opposition subie est liée à la poursuite du bien. Comme תַּחַת porte plus littéralement une idée d’échange ou de contrepartie, cette nuance est conservée dans la note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme moral entre « le mal » et « le bien », ainsi que l’ambiguïté de la seconde occurrence de תַּחַת au moyen d’une note.
