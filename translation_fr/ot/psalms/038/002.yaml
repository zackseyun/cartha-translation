source:
  edition: WLC
  text: כִּֽי חִ֭צֶּי/ךָ נִ֣חֲתוּ בִ֑/י וַ/תִּנְחַ֖ת עָלַ֣/י יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/002.yaml
  text: For your arrows have sunk into me[b][a], and your hand has come down on me.
translation:
  language: fr
  text: Car tes flèches se sont enfoncées en moi[a], et ta main[b] s’est abattue sur moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «m’ont transpercé» ou «m’ont frappé». Le verbe hébreu signifie plus littéralement «sont descendues»; ici, il évoque des flèches qui pénètrent dans le psalmiste.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement «ta main». Cette image désigne l’action puissante de Dieu, ici vécue comme une affliction ou une correction.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la cause de la plainte et convient au registre poétique en français.
- source_word: חִצֶּיךָ
  choice: tes flèches
  rationale: Conserve littéralement la métaphore guerrière de l’affliction divine.
- source_word: נִחֲתוּ בִי
  choice: se sont enfoncées en moi
  rationale: Le verbe évoque d’abord un mouvement vers le bas; avec des flèches et בִי, cette formulation naturelle suggère qu’elles pénètrent et restent fichées, sans réduire le sens à «frapper».
- source_word: וַתִּנְחַת עָלַי
  choice: s’est abattue sur moi
  rationale: Rend avec naturel le mouvement descendant et la force pesante de la main, tout en faisant écho au premier verbe hébreu.
- source_word: יָדֶךָ
  choice: ta main
  rationale: Maintient l’image anthropomorphique concrète du texte au lieu de l’expliciter par «puissance» ou «jugement».
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’action divine
  choice: Conserver «ta main»
  alternative: ta puissance; ton jugement
  rationale: Le texte hébreu emploie une image corporelle concrète; la traduire littéralement préserve sa force et évite d’imposer une interprétation doctrinale.
- issue: Nature exacte de l’action des flèches
  choice: «se sont enfoncées en moi»
  alternative: m’ont transpercé; m’ont frappé; sont descendues en moi
  rationale: Le contexte permet l’idée de pénétration, tandis que le verbe lui-même exprime plus directement la descente. Le choix conserve les deux dimensions sans préciser une blessure au-delà du texte.
translation_notes:
  register: Français international moderne, poétique et digne. «S’est abattue» est idiomatique et conserve l’image d’un mouvement descendant avec force; le parallélisme des deux propositions reste net.
