  rationale: La révision remplace une formulation française potentiellement équivoque par l’expression idiomatique « espérer en », fidèle à la valeur de יחל avec לְ. Elle explicite aussi l’apostrophe finale par « ô » et une virgule, sans modifier le sens ni résoudre l’objet implicite de « tu répondras ».
