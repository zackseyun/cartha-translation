  text: כִּֽי לְ/ךָ֣ יְהוָ֣ה הוֹחָ֑לְתִּי אַתָּ֥ה תַ֝עֲנֶ֗ה אֲדֹנָ֥/י אֱלֹהָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/015.yaml
  text: For I wait for you[a], O Yahweh; you will answer[c][b], O Lord my God.
translation:
  language: fr
  text: Car c’est en toi que j’espère[a], Yahweh[b] ; toi, tu répondras[c], ô Seigneur, mon Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu peut aussi se traduire par « j’attends avec espoir » ou « j’ai espéré en toi ».
    reason: lexical_alternative
  - marker: b
    text: « Yahweh » transcrit le nom divin YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: Ou « tu me répondras ». L’hébreu n’exprime pas le complément « me ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le fondement de l’attitude exprimée dans le contexte, sans préciser davantage la nuance causale ou affirmative.
- source_word: לְךָ … הוֹחָלְתִּי
  choice: c’est toi que j’attends
  rationale: Le verbe יחל au hiphil exprime une attente confiante ou l’espérance. La tournure clivée rend naturellement en français la relation marquée par לְךָ et met en relief la personne attendue.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin YHWH plutôt que de le remplacer silencieusement par un titre.
- source_word: אַתָּה תַעֲנֶה
  choice: toi, tu répondras
  rationale: Le pronom indépendant אַתָּה est emphatique ; sa reprise par « toi, tu » conserve cette insistance. Aucun complément d’objet n’étant exprimé en hébreu, la traduction n’ajoute pas « me ».
- source_word: אֲדֹנָי אֱלֹהָי
  choice: Seigneur mon Dieu
  rationale: Rend אֲדֹנָי comme titre divin et conserve explicitement le suffixe possessif de אֱלֹהָי.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le tétragramme comme nom propre. La translittération préserve cette distinction avec le titre אֲדֹנָי, également présent dans le verset.
- issue: Objet implicite de תַעֲנֶה
  choice: tu répondras
  alternative: tu me répondras
  rationale: Le sens contextuel permet de comprendre « me », mais l’hébreu ne l’exprime pas ; le texte principal conserve donc cette absence.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure « c’est toi que… » puis « toi, tu… » restitue l’insistance des pronoms hébreux sans alourdir excessivement le verset.
