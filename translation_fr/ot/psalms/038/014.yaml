  text: וָ/אֱהִ֗י כְּ֭/אִישׁ אֲשֶׁ֣ר לֹא שֹׁמֵ֑עַ וְ/אֵ֥ין בְּ֝/פִ֗י/ו תּוֹכָחֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: fr
  text: 'Et je suis devenu comme un homme qui n’entend pas,

    et qui n’a dans la bouche aucune réplique.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucun argument », « aucune réponse » ou « aucun reproche ». Le mot hébreu peut désigner des paroles de correction ou des réponses destinées à réfuter.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Je suis devenu
  rationale: Le wayyiqtol de היה fait progresser l’énoncé. « Je suis devenu » rend naturellement l’entrée dans la comparaison, sans donner à la conjonction une valeur adversative non explicite.
- source_word: כְּאִישׁ
  choice: comme un homme
  rationale: Rend directement le masculin singulier אִישׁ et conserve la comparaison individuelle du texte.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: qui n’entend pas
  rationale: Le participe de שׁמע peut exprimer le fait d’entendre ou d’écouter. « N’entend pas » est ici la formulation la plus directe et n’ajoute pas une incapacité que l’hébreu n’énonce pas.
- source_word: וְאֵין בְּפִיו
  choice: et qui n’a … à la bouche
  rationale: Cette tournure française naturelle conserve l’image corporelle de ce qui se trouve dans la bouche, tout en rendant l’absence exprimée par אֵין.
- source_word: תּוֹכָחוֹת
  choice: réplique
  rationale: Dans le contexte du silence face à des adversaires, « réplique » exprime une réponse verbale opposée. Le pluriel hébreu peut avoir une valeur collective; le singulier français après « aucune » est idiomatique. Le terme peut aussi désigner des arguments, des réponses ou des reproches, ambiguïté signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est préservé, ainsi que l’image de l’ouïe et de la bouche. Le marqueur de note est placé après la proposition qu’il éclaire.
