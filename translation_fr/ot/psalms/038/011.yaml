source:
  edition: WLC
  text: אֹֽהֲבַ֨/י וְ/רֵעַ֗/י מִ/נֶּ֣גֶד נִגְעִ֣/י יַעֲמֹ֑דוּ וּ֝/קְרוֹבַ֗/י מֵ/רָחֹ֥ק עָמָֽדוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/011.yaml
  text: My loved ones and my friends stand apart from my affliction[c][b][a], and my close kin stand far away.
translation:
  language: fr
  text: Ceux qui m’aiment et mes amis se tiennent à l’écart de mon mal[a], et mes proches se tiennent au loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de ma plaie », « de mon affection » ou « du coup qui m’a frappé ». Le nom hébreu peut désigner un coup, une atteinte corporelle, une maladie ou une plaie. L’expression peut aussi se comprendre : « se tiennent en face de mon mal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֲבַי
  choice: ceux qui m’aiment
  rationale: Le participe substantivé avec suffixe désigne les personnes qui aiment le psalmiste. Cette formulation naturelle évite la connotation principalement romantique de « mes amants ».
- source_word: וְרֵעַי
  choice: et mes amis
  rationale: רֵעַ désigne couramment un ami ou un compagnon ; « amis » convient au parallélisme relationnel.
- source_word: מִנֶּגֶד
  choice: à l’écart de
  rationale: La préposition peut signifier « en face de » ou « vis-à-vis de ». Dans cette scène de mise à distance, « à l’écart de » rend naturellement la position spatiale sans préciser à tort le motif ou l'attitude.
- source_word: נִגְעִי
  choice: mon mal
  rationale: נֶגַע peut désigner un coup, une plaie ou une affection. « Mon mal » conserve en français une portée assez large pour englober la souffrance corporelle décrite dans le psaume.
- source_word: יַעֲמֹדוּ
  choice: se tiennent
  rationale: עמד exprime ici le fait de prendre ou de garder une position ; « se tiennent » restitue directement l’image.
- source_word: וּקְרוֹבַי
  choice: et mes proches
  rationale: קָרוֹב peut désigner les proches, notamment les parents. « Mes proches » garde volontairement cette extension relationnelle sans imposer exclusivement le sens familial.
- source_word: מֵרָחֹק
  choice: au loin
  rationale: L’expression indique clairement la distance ; « au loin » est idiomatique, poétique et concis.
- source_word: עָמָדוּ
  choice: se tiennent
  rationale: Bien que la forme soit un parfait, le parallélisme avec le premier membre permet un présent de tableau en français.
theological_decisions:
- issue: Nature exacte du נֶגַע
  choice: mon mal
  alternative: ma plaie / mon affection / le coup qui m’a frappé
  rationale: Le substantif hébreu demeure polysémique et le contexte ne permet pas de trancher définitivement entre blessure, maladie et atteinte plus générale.
- issue: Identité des קְרוֹבַי
  choice: mes proches
  alternative: mes parents
  rationale: Le terme peut avoir une nuance familiale, mais peut aussi désigner plus largement ceux qui sont proches ; la traduction ne restreint donc pas le groupe.
translation_notes:
  register: Français international moderne, sobre et poétique. Le présent met en scène l’abandon en cours ; la répétition de « se tiennent » conserve celle du verbe hébreu. Le texte évite « amants », potentiellement romantique, et « parents », trop restrictif.
