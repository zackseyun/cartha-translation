  text: הִבְאִ֣ישׁוּ נָ֭מַקּוּ חַבּוּרֹתָ֑/י מִ֝/פְּנֵ֗י אִוַּלְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/005.yaml
  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: fr
  text: Mes plaies empestent et pourrissent à cause de ma folie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mes meurtrissures sont devenues fétides et se décomposent à cause de ma folie. »'
    reason: Alternative lexicale reflétant les sens possibles de חַבּוּרֹתַי, הִבְאִישׁוּ et נָמַקּוּ.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: empestent
  rationale: Le hiphil de באש exprime ici une odeur devenue repoussante. « Empestent » rend avec force et naturel la dimension physique du verbe.
- source_word: נָמַקּוּ
  choice: pourrissent
  rationale: Le verbe évoque la décomposition ou le dépérissement. Appliqué à des plaies, « pourrissent » conserve l’image concrète et dure de l’hébreu.
- source_word: חַבּוּרֹתַי
  choice: mes plaies
  rationale: חַבּוּרָה peut désigner une meurtrissure, une marque de coup ou une plaie. Le contexte d’odeur et de décomposition favorise « plaies », plus naturel ici que « meurtrissures ».
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: La préposition exprime ici la cause. « À cause de » rend clairement ce rapport en français contemporain.
- source_word: אִוַּלְתִּי
  choice: ma folie
  rationale: Le nom désigne une conduite insensée, avec une portée morale possible. « Ma folie » conserve la concision et l’auto-implication du psalmiste sans préciser davantage la nature de sa faute.
theological_decisions:
- issue: Rapport causal entre la souffrance et la folie morale du psalmiste
  choice: à cause de ma folie
  alternative: du fait de mon manque de sagesse
  rationale: Le verset relie explicitement l’état du psalmiste à sa propre folie. La traduction maintient ce lien causal sans en tirer une affirmation générale sur l’origine de toute souffrance.
translation_notes:
  register: Français moderne, direct et digne. « Empestent » et « pourrissent » préservent la crudité sensorielle du texte hébreu sans recourir à un vocabulaire médical ou archaïque.
