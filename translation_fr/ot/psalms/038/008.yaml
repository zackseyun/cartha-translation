  text: I am faint and utterly crushed; I roar because of the groaning of my heart.
translation:
  language: fr
  text: Je suis sans force, complètement brisé ; je rugis à cause du gémissement de mon cœur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּג֣וֹתִי
  choice: Je suis sans force
  rationale: Le verbe פוג exprime ici l’affaiblissement ou la perte de vigueur. « Sans force » restitue naturellement cet état en français sans lui donner artificiellement un sens médical précis.
- source_word: וְנִדְכֵּ֣יתִי עַד־מְאֹ֑ד
  choice: complètement brisé
  rationale: דכא évoque le fait d’être écrasé ou brisé, et עַד־מְאֹד en renforce fortement le degré. Cette formulation conserve l’intensité du texte.
- source_word: שָׁ֝אַ֗גְתִּי
  choice: je rugis
  rationale: שאג désigne un rugissement ou un cri puissant, et non un simple gémissement. Le choix préserve la force de l’image.
- source_word: מִנַּהֲמַ֥ת לִבִּֽי
  choice: à cause des gémissements de mon cœur
  rationale: La préposition מִן reçoit ici naturellement une valeur causale. נהמה désigne un grondement ou gémissement profond, attribué au cœur comme siège de la détresse intérieure.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Le parallélisme progresse de l’épuisement physique et intérieur vers un cri puissant. La répétition sonore implicite entre le rugissement extérieur et le gémissement intérieur est conservée autant que possible.
