- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ dans les titres peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette diversité que « par David » ou « pour David ».
- source_word: לְהַזְכִּיר
  choice: pour faire mémoire
  rationale: L’infinitif hifil de זכר indique ici le but ou la fonction du psaume. « Pour faire mémoire » est naturel dans un titre et évite de préciser indûment qui doit se souvenir ou quelle est exactement la fonction liturgique.
