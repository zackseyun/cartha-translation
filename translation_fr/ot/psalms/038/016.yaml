  to: 'Car je me suis dit : « De peur qu’ils ne se réjouissent à mes dépens, qu’ils ne se vantent contre moi lorsque mon pied chancelle. »'
  rationale: La révision restitue la valeur de crainte de פֶּן par « de peur que » et rend l’auto-exaltation hostile de הגדילו par « se vantent contre moi ». Elle conserve l’image volontairement ouverte du pied qui chancelle et le lien temporel de בְּמוֹט רַגְלִי.
