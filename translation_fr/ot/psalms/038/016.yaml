translation_notes:
  register: Français moderne, courant et digne. Le parallélisme est conservé, ainsi que l'image ambiguë du pied qui chancelle. Le discours direct rend explicitement la pensée formulée par le psalmiste sans introduire d'interprétation confessionnelle.
