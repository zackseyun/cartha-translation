  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: fr
  text: 'Car je me suis dit : « De peur qu’ils ne se réjouissent à mes dépens, qu’ils ne se vantent contre moi lorsque mon pied chancelle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: Sinon
  rationale: Dans ce contexte, la particule exprime la conséquence redoutée qui motive la parole du psalmiste ; « sinon » restitue naturellement ce lien en français.
- source_word: יִשְׂמְחוּ לִי
  choice: ils se réjouiraient à mes dépens
  rationale: Le datif לִי indique ici une joie dirigée contre le psalmiste ; « à mes dépens » rend ce sens sans ajouter explicitement la cause de leur joie.
- source_word: בְּמוֹט רַגְלִי
  choice: quand mon pied chancelle
  rationale: Conserve l'image corporelle du texte hébreu, qui peut évoquer une faiblesse, une chute ou un malheur sans trancher entre ces nuances.
- source_word: עָלַי הִגְדִּילוּ
  choice: ils triomphent de moi
  rationale: La tournure hébraïque décrit des adversaires qui s'élèvent ou se donnent de l'importance contre le psalmiste ; « triomphent de moi » exprime idiomatiquement leur attitude arrogante face à sa faiblesse.
