  text: Je suis courbé, profondément affaissé ; tout le jour, je marche dans la tristesse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la sombreur » ou « dans le deuil » ; le mot hébreu évoque à la fois la noirceur, l’affliction et le deuil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Je suis courbé
  rationale: Le verbe עוה évoque le fait d’être courbé, tordu ou déformé. « Courbé » conserve l’image corporelle tout en exprimant naturellement l’accablement du psalmiste.
- source_word: שַׁחֹתִי עַד מְאֹד
  choice: profondément abattu
  rationale: שׁחח signifie s’abaisser ou être courbé, et עַד מְאֹד renforce fortement cet état. « Profondément abattu » maintient l’intensification et unit l’affaissement physique à la détresse intérieure sans en préciser indûment la cause.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Expression française naturelle et digne qui rend la durée continue indiquée par l’hébreu.
- source_word: קֹדֵר
  choice: dans la tristesse
  rationale: Le participe קֹדֵר peut évoquer une apparence sombre, l’affliction ou le deuil. « Dans la tristesse » convient au contexte de lamentation, tandis qu’une note conserve l’imagerie plus sombre et l’autre possibilité de traduction.
- source_word: הִלָּכְתִּי
  choice: je marche
  rationale: Le verbe הלך signifie ici aller ou marcher dans un certain état. Le présent français rend la situation décrite comme continue dans cette lamentation.
