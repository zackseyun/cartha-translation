  text: אַל תַּֽעַזְבֵ֥/נִי יְהוָ֑ה אֱ֝לֹהַ֗/י אַל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: fr
  text: Ne m’abandonne pas, Yahweh, mon Dieu ; ne sois pas loin de moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: Ne m’abandonne pas
  rationale: La particule négative אַל avec l’imparfait à valeur jussive exprime ici une supplication directe. « Abandonner » rend naturellement עזב et conserve la force du registre de lamentation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: La forme אֱלֹהַי comporte le suffixe de première personne du singulier et signifie directement « mon Dieu ».
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: ne sois pas loin de moi
  rationale: רחק décrit le fait d’être éloigné. Cette formulation garde l’ambiguïté entre distance spatiale et absence ressentie, sans transformer explicitement la demande en « ne t’éloigne pas ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin. « Yahweh » le représente directement et permet de distinguer ce nom d’un titre comme « Seigneur ».
translation_notes:
  register: Prière de lamentation concise, directe et digne. Le parallélisme des deux supplications négatives est conservé, avec un français moderne et accessible.
