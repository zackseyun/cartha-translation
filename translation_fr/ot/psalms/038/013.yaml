  text: וַ/אֲנִ֣י כְ֭/חֵרֵשׁ לֹ֣א אֶשְׁמָ֑ע וּ֝/כְ/אִלֵּ֗ם לֹ֣א יִפְתַּח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/013.yaml
  text: But I[a], like a deaf man, do not hear; and like a mute man[b], I do not open my mouth.
translation:
  language: fr
  text: Mais moi, comme un sourd, je n’entends pas ; et, comme un muet, il n’ouvre pas la bouche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et comme un muet, il n’ouvre pas sa bouche ». L’hébreu passe de la première personne (« je n’entends pas ») à la troisième personne, probablement pour poursuivre la comparaison. On peut aussi comprendre : « et comme un muet, je n’ouvre pas la bouche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom marquent ici le contraste avec les adversaires qui parlent dans le contexte précédent ; « Mais moi » exprime naturellement cette opposition.
- source_word: כְחֵרֵשׁ
  choice: comme un sourd
  rationale: Le préfixe כְּ introduit une comparaison, et חֵרֵשׁ désigne une personne sourde. Cette formulation conserve l’image concrète et le singulier masculin.
- source_word: לֹא אֶשְׁמָע
  choice: je n’entends pas
  rationale: Le verbe שׁמע signifie d’abord « entendre ». Le présent français convient à l’action décrite sans ajouter l’idée d’incapacité contenue dans « je ne peux pas entendre ».
- source_word: וּכְאִלֵּם
  choice: comme un muet
  rationale: אִלֵּם désigne une personne muette. « Un muet » maintient le parallélisme concret avec « un sourd ».
- source_word: לֹא יִפְתַּח פִּיו
  choice: il n’ouvre pas la bouche
  rationale: L’hébreu emploie explicitement la troisième personne (« il… sa bouche »), probablement pour poursuivre la comparaison avec le muet. La traduction conserve ce changement grammatical et l’expression idiomatique.
theological_decisions:
- issue: Changement de la première à la troisième personne dans le second membre
  choice: Conserver « il n’ouvre pas la bouche » dans le texte principal
  alternative: « je n’ouvre pas la bouche »
  rationale: Le texte massorétique porte un verbe à la troisième personne et le suffixe possessif « sa ». Bien que le parallélisme permette de comprendre que le psalmiste décrit sa propre attitude, passer à la première personne supprimerait une particularité réelle de la formulation hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique et les images physiques du texte hébreu sont conservés ; la note rend compte du changement de personne sans le résoudre silencieusement.
