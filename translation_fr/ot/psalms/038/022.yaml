  text: Hurry to help me[a], Lord[b], my salvation.
translation:
  language: fr
  text: Hâte-toi de me secourir, Seigneur, mon salut !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּשָׁה
  choice: Hâte-toi
  rationale: L’impératif exprime une demande pressante. « Hâte-toi » conserve cette urgence dans un français actuel et digne.
- source_word: לְעֶזְרָתִי
  choice: de me secourir
  rationale: Littéralement « pour mon aide ». La tournure verbale est naturelle en français et rend clairement l’appel à l’aide.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin usuel אֲדֹנָי, rendu naturellement par « Seigneur ».
- source_word: תְּשׁוּעָתִי
  choice: toi qui es mon salut
  rationale: Le texte dit littéralement « mon salut ». L’ajout explicatif « toi qui es » fait entendre naturellement en français que le psalmiste désigne le Seigneur comme son salut, sans modifier le sens de l’expression nominale.
theological_decisions:
- issue: Sens de תְּשׁוּעָתִי appliqué à Dieu
  choice: toi qui es mon salut
  alternative: ma délivrance
  rationale: « Mon salut » préserve l’ampleur et la force théologique du nom hébreu, tandis que « ma délivrance » est également possible mais peut évoquer plus étroitement un acte de secours.
- issue: Traduction du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: mon Seigneur
  rationale: Dans cet emploi, אֲדֹנָי fonctionne comme le titre divin établi. « Seigneur » évite de suraccentuer une valeur possessive qui n’est pas mise en avant ici.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la brièveté et l’urgence de la supplication hébraïque, avec une explicitation minimale pour rendre naturelle l’apposition finale.
