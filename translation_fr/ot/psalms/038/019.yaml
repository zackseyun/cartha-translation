  text: וְֽ֭/אֹיְבַ/י חַיִּ֣ים עָצֵ֑מוּ וְ/רַבּ֖וּ שֹׂנְאַ֣/י שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/019.yaml
  text: And my enemies are alive and strong[a], and those who hate me falsely are many.
translation:
  language: fr
  text: Mes ennemis sont vivants et puissants ; nombreux sont ceux qui me haïssent faussement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans raison ». Le mot hébreu signifie littéralement « mensonge » ou « fausseté » et peut indiquer que leur haine est mensongère ou sans fondement.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Le nom désigne des adversaires personnels ; « mes ennemis » est direct et naturel en français.
- source_word: חַיִּים
  choice: sont pleins de vie
  rationale: L’adjectif signifie littéralement « vivants ». Dans ce contexte, « pleins de vie » garde l’image tout en exprimant naturellement la vigueur des ennemis, par contraste avec l’affaiblissement du psalmiste.
- source_word: עָצֵמוּ
  choice: puissants
  rationale: Le verbe exprime le fait de devenir ou d’être fort, puissant. La coordination « pleins de vie et puissants » rend avec concision leur force présente.
- source_word: רַבּוּ
  choice: ils sont nombreux
  rationale: Le verbe signifie devenir nombreux ou se multiplier ; la formulation française exprime ici leur grand nombre sans imposer une progression temporelle.
- source_word: שֹׂנְאַי
  choice: ceux qui me haïssent
  rationale: Le participe substantivé conserve la force verbale de l’hébreu et évite de le confondre avec le premier terme, « ennemis ».
- source_word: שָׁקֶר
  choice: à tort
  rationale: Le nom « mensonge, fausseté », employé adverbialement, peut qualifier cette haine comme fausse, injustifiée ou sans fondement. « À tort » reste naturel et assez ouvert en français.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le parallélisme poétique est conservé ; « pleins de vie » maintient le contraste implicite avec l’état de faiblesse du psalmiste, tandis que la note préserve l’ambiguïté de שָׁקֶר.
