  text: כִּֽי עֲוֺנִ֥/י אַגִּ֑יד אֶ֝דְאַ֗ג מֵֽ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: fr
  text: Car je reconnais ma faute[a] ; je suis inquiet à cause de mon péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je déclare ma faute » ou « je confesse ma faute ». Le verbe hébreu signifie littéralement « faire connaître » ou « déclarer » ; le contexte pénitentiel permet le sens de « reconnaître, confesser ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je suis tourmenté au sujet de mon péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de ce qui précède et conserve naturellement la valeur connective de l’hébreu.
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la faute commise comme la culpabilité qui en découle. « Faute » garde ici le poids moral du terme dans un français actuel.
- source_word: אַגִּיד
  choice: je reconnais
  rationale: Le hifil de נגד signifie littéralement « faire connaître, déclarer ». Avec pour objet la faute personnelle du psalmiste, « reconnaître » exprime naturellement l’aveu sans effacer le sens littéral, signalé en note.
- source_word: אֶדְאַג
  choice: je suis inquiet
  rationale: דאג exprime l’inquiétude, le souci ou le tourment intérieur. Cette formulation est claire et actuelle.
- source_word: מֵחַטָּאתִי
  choice: à cause de mon péché
  rationale: La préposition מִן indique ici vraisemblablement la cause ou l’occasion de l’inquiétude.
- source_word: חַטָּאתִי
  choice: mon péché
  rationale: חַטָּאת est le terme courant pour le péché ; cette traduction est directe et transparente.
theological_decisions:
- issue: Rapport entre l’aveu de la faute et le trouble intérieur dans un psaume pénitentiel
  choice: Le verset présente le psalmiste reconnaissant personnellement sa faute et éprouvant de l’inquiétude à cause de son péché.
  alternative: On peut traduire plus littéralement le premier verbe par « je déclare » ou, selon le contexte pénitentiel, plus explicitement par « je confesse ».
  rationale: L’hébreu dit que le psalmiste fait connaître sa faute et se tourmente à cause de son péché. « Je reconnais » respecte le contexte sans ajouter une doctrine plus développée de la repentance.
translation_notes:
  register: Français international moderne, simple et digne. « Faute » et « péché » maintiennent la distinction lexicale entre עָוֹן et חַטָּאת. Les deux marqueurs de note figurent dans le texte principal.
