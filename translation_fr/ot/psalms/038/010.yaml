  text: לִבִּ֣/י סְ֭חַרְחַר עֲזָבַ֣/נִי כֹחִ֑/י וְֽ/אוֹר עֵינַ֥/י גַּם הֵ֝֗ם אֵ֣ין אִתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/010.yaml
  text: My heart throbs[a]; my strength has left me[b], and the light of my eyes—even they are not with me.
translation:
  language: fr
  text: Mon cœur palpite, ma force m’abandonne ; même la lumière de mes yeux[a] n’est pas avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut désigner soit la vue elle-même, soit l’éclat ou la vitalité qui se lit dans les yeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: mon cœur
  rationale: Dans ce contexte de détresse physique, לֵב désigne naturellement le cœur, siège de la vitalité et des émotions.
- source_word: סְחַרְחַר
  choice: palpite
  rationale: Le terme évoque un mouvement agité ou tournoyant. « Palpite » exprime naturellement en français le dérèglement physique du cœur dans ce contexte, tout en laissant percevoir l’agitation.
- source_word: עֲזָבַנִי כֹחִי
  choice: ma force m’abandonne
  rationale: La tournure rend l’image hébraïque de la force qui quitte le psalmiste, dans un français actuel et poétique, sans ajouter de connotation théologique.
- source_word: וְאוֹר עֵינַי
  choice: la lumière de mes yeux
  rationale: Cette traduction conserve l’image poétique hébraïque et son ambiguïté entre la vue elle-même et l’éclat vital perceptible dans les yeux.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: même la lumière de mes yeux n’est plus avec moi
  rationale: Le français reprend l’accent de גַּם et la formulation imagée « n’est plus avec moi ». L’accord au singulier suit « lumière », tandis que le sens du pluriel hébreu renvoie aux yeux.
