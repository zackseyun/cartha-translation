  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: fr
  text: Car mes fautes[a] ont passé au-dessus de ma tête ; comme un lourd fardeau, elles pèsent trop pour moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma culpabilité » ; le mot hébreu peut désigner à la fois les fautes et la culpabilité qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de la plainte et conserve naturellement la valeur explicative de la particule.
- source_word: עֲוֺנֹתַי
  choice: mes fautes
  rationale: Le terme עָוֹן peut désigner les actes coupables, la culpabilité qui en résulte ou leurs conséquences. « Fautes » exprime ici les offenses morales sans réduire entièrement cette amplitude.
- source_word: עָבְרוּ רֹאשִׁי
  choice: dépassent ma tête
  rationale: Conserve l'image concrète de quelque chose qui monte au-dessus de la tête, probablement comme des eaux débordantes, sans la remplacer par le seul sens abstrait « m'accablent ».
- source_word: כְּמַשָּׂא כָבֵד
  choice: comme un lourd fardeau
  rationale: Rend directement l'image physique d'une charge pesante dans un français poétique et courant.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: elles pèsent trop pour moi
  rationale: Maintient le champ lexical du poids ainsi que l'idée que cette charge excède les forces du locuteur.
theological_decisions:
- issue: Étendue sémantique de עָוֹן dans un contexte pénitentiel
  choice: « mes fautes » dans le texte principal, avec une note signalant « ma culpabilité »
  alternative: « ma culpabilité » dans le texte principal
  rationale: Le pluriel et le contexte permettent de comprendre d'abord les offenses du psalmiste, tandis que le mot hébreu peut aussi inclure l'état de culpabilité ou ses conséquences. La note préserve cette tension sans la trancher artificiellement.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore de la tête dépassée et celle du fardeau sont conservées. Le présent poétique exprime l'état actuel décrit par le psalmiste.
