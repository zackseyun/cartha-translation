source:
  edition: WLC
  text: שְׁלַ֥ח יָדֶ֗י/ךָ מִ/מָּ֫ר֥וֹם פְּצֵ֣/נִי וְ֭/הַצִּילֵ/נִי מִ/מַּ֣יִם רַבִּ֑ים מִ֝/יַּ֗ד בְּנֵ֣י נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: fr
  text: Étends ta main d’en haut ; arrache-moi et délivre-moi des grandes eaux[a], de la main des fils de l’étranger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des eaux nombreuses » ou « des eaux puissantes ». Cette image poétique peut évoquer un danger accablant.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque désignant des étrangers.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  choice: Tends tes mains
  rationale: L’impératif שׁלח associé à « mains » exprime le geste concret d’étendre les mains pour intervenir. יָדֶיךָ est morphologiquement pluriel ; le français conserve donc « tes mains ».
- source_word: מִמָּרוֹם
  choice: depuis les hauteurs
  rationale: מָרוֹם désigne un lieu élevé ou les hauteurs. Cette traduction préserve l’image spatiale sans préciser davantage par « ciel ».
- source_word: פְּצֵנִי
  choice: arrache-moi
  rationale: Le verbe évoque ici le fait de tirer quelqu’un hors d’un danger. « Arrache-moi » convient particulièrement à l’image des eaux et garde la vigueur poétique.
- source_word: וְהַצִּילֵנִי
  choice: et délivre-moi
  rationale: נצל exprime la délivrance hors du danger. « Délivre-moi » maintient le parallélisme avec « arrache-moi » sans confondre les deux verbes.
- source_word: מִמַּיִם רַבִּים
  choice: des grandes eaux
  rationale: La formule signifie littéralement des eaux nombreuses ou grandes. « Grandes eaux » est une expression française poétique, claire et proche de l’image hébraïque.
- source_word: מִיַּד
  choice: de la main de
  rationale: La traduction littérale conserve l’image du pouvoir ou de l’emprise exercée par les adversaires et fait écho aux mains divines au début du verset.
- source_word: בְּנֵי נֵכָר
  choice: fils de l’étranger
  rationale: 'Cette formulation garde l’expression filiale et masculine de l’hébreu, tandis qu’une note en explicite le sens idiomatique : des étrangers.'
theological_decisions:
- issue: Langage anthropomorphique décrivant l’action divine
  choice: 'Conserver l’image concrète : « Tends tes mains depuis les hauteurs »'
  alternative: 'Paraphraser : « Interviens depuis le ciel »'
  rationale: Le texte représente l’intervention salvatrice de Dieu au moyen d’un geste corporel. L’image est intelligible et ne doit pas être remplacée par une abstraction.
- issue: Valeur métaphorique des grandes eaux
  choice: Maintenir l’image dans le texte principal
  alternative: Traduire directement par « d’un immense danger »
  rationale: Les eaux peuvent représenter un péril accablant, mais le verset ne supprime pas l’image poétique. La note signale donc cette portée sans l’imposer comme paraphrase.
- issue: Expression masculine et filiale בְּנֵי נֵכָר
  choice: « fils de l’étranger » dans le texte principal
  alternative: « étrangers »
  rationale: La formulation retenue respecte la forme imagée et genrée de l’hébreu ; la note donne son équivalent idiomatique courant.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, ainsi que les images concrètes des mains et des grandes eaux. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
