  text: מְזָוֵ֣י/נוּ מְלֵאִים֮ מְפִיקִ֥ים מִ/זַּ֗ן אֶ֫ל זַ֥ן צֹאונֵ֣/נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּ/חוּצוֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: fr
  text: Que nos greniers soient pleins et fournissent des produits de toutes sortes[a] ! Que nos troupeaux se multiplient par milliers, par dizaines de milliers, dans nos espaces ouverts[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « d’une sorte à l’autre » ; l’expression évoque une grande diversité de produits.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans nos rues » ou « à nos abords ». Le terme hébreu peut désigner des lieux ouverts à l’intérieur ou à l’extérieur d’une localité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: nos greniers
  rationale: Ce nom rare désigne des lieux où l’on conserve des provisions. « Greniers » est naturel dans ce contexte agricole et évoque clairement le stockage des récoltes.
- source_word: מְלֵאִים
  choice: soient pleins
  rationale: L’adjectif prédicatif signifie « pleins ». Le subjonctif inscrit la proposition dans la série de souhaits ou bénédictions du contexte.
- source_word: מְפִיקִים
  choice: fournissent
  rationale: Le participe exprime l’action de faire sortir ou de produire des provisions. « Fournissent » rend naturellement l’idée d’une réserve abondante mise à disposition.
- source_word: מִזַּן אֶל זַן
  choice: des produits de toute sorte
  rationale: Littéralement « d’une sorte à l’autre », l’expression souligne la diversité des provisions. La formulation retenue explicite ce sens distributif sans préciser indûment la nature exacte des produits.
- source_word: צֹאנֵנוּ
  choice: nos troupeaux
  rationale: Le collectif hébreu désigne le petit bétail, notamment ovins et caprins. « Troupeaux » conserve cette portée collective.
- source_word: מַאֲלִיפוֹת
  choice: se multiplient par milliers
  rationale: La forme issue du terme « millier » décrit une augmentation en milliers. Le français pronominal exprime clairement la croissance du cheptel.
- source_word: מְרֻבָּבוֹת
  choice: par dizaines de milliers
  rationale: Cette forme dérivée de « dix mille » intensifie le membre précédent. La traduction préserve la progression numérique du parallélisme.
- source_word: בְּחוּצוֹתֵינוּ
  choice: dans nos espaces ouverts
  rationale: Le terme peut désigner les rues, les dehors ou des lieux ouverts. « Espaces ouverts » préserve cette largeur sémantique et convient au cadre pastoral sans imposer précisément des champs.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure optative avec « Que… ! » respecte le contexte de souhait ou de bénédiction. « Espaces ouverts » maintient l’ambiguïté du dernier terme hébreu.
