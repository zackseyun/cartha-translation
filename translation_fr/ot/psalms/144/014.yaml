  register: Français moderne, sobre et poétique. La série nominale « aucune… aucune… aucun… » conserve la concision et le parallélisme de l’hébreu. Le rendu principal reste proche du sens lexical dans les deux expressions difficiles, tandis que les notes signalent les principales interprétations contextuelles.
