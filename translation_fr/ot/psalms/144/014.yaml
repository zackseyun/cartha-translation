  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: fr
  text: Nos bœufs sont lourdement chargés[a] ; aucune brèche, aucune sortie[b], aucun cri dans nos places.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nos bœufs sont bien chargés » ; certains comprennent : « Nos vaches sont pleines ». L’hébreu évoque littéralement des animaux chargés, mais peut décrire ici leur fécondité ou l’abondance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « aucun départ », « aucune déportation ». L’expression hébraïque est elliptique et peut désigner une sortie forcée hors de la ville.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: nos bœufs
  rationale: Dans ce contexte de prospérité agricole, le terme désigne probablement les bovins plutôt que des chefs ou des clans. « Bœufs » s'accorde naturellement avec le participe évoquant le port d'une charge.
- source_word: מְסֻבָּלִים
  choice: portent de lourdes charges
  rationale: Le participe passif de סבל signifie littéralement « chargés » ou « portant un fardeau ». Cette traduction conserve le sens lexical sans imposer l'interprétation contextuelle « pleins » ou « portant leurs petits ».
- source_word: אֵין פֶּרֶץ
  choice: aucune brèche
  rationale: פֶּרֶץ désigne une rupture ou une brèche, vraisemblablement dans les défenses de la ville, mais la formulation concise préserve la portée générale de l'hébreu.
- source_word: וְאֵין יוֹצֵאת
  choice: aucune sortie
  rationale: La forme féminine singulière est elliptique et son référent demeure incertain. « Aucune sortie » reproduit la concision et l'ambiguïté de l'hébreu, tout en laissant possibles un départ forcé, une déportation ou une sortie militaire.
- source_word: וְאֵין צְוָחָה
  choice: aucun cri
  rationale: צְוָחָה est un cri, généralement un cri de détresse. Le contexte apporte cette nuance sans qu'il soit nécessaire de l'expliciter dans le texte.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: sur nos places
  rationale: רְחֹבוֹת désigne les espaces publics larges, notamment les places ou grandes rues. « Sur nos places » rend naturellement ici le cadre public de la ville.
