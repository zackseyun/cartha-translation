base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: fr
  text: 'Yahweh, qu’est-ce que l’être humain,

    pour que tu le connaisses,

    le fils de l’homme,

    pour que tu le prennes en considération ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset fait étroitement écho au Psaume 8.5. L’expression « fils de l’homme » désigne ici, de manière générique, l’être humain dans sa fragilité.
    reason: cross_reference_and_lexical_clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit directement le nom divin, employé ici comme vocatif, conformément au texte hébreu.
- source_word: מָה אָדָם
  choice: qu’est-ce que l’être humain
  rationale: La question rhétorique souligne la petitesse de l’humanité. « L’être humain » rend le singulier générique אָדָם en français moderne sans le réduire au sexe masculin.
- source_word: וַתֵּדָעֵהוּ
  choice: pour que tu le connaisses
  rationale: Conserve le sens premier de ידע, tout en exprimant ici la connaissance attentive que Dieu accorde à l’être humain.
- source_word: בֶּן אֱנוֹשׁ
  choice: le fils de l’homme
  rationale: Préserve l’expression poétique hébraïque et son parallélisme avec אָדָם; אֱנוֹשׁ évoque l’être humain mortel et fragile.
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: pour que tu le prennes en considération
  rationale: Rend חשב dans le sens de tenir compte de quelqu’un ou lui accorder son attention, en parallèle avec « connaître ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Portée de אָדָם et de בֶּן אֱנוֹשׁ
  choice: l’être humain ... le fils de l’homme
  alternative: l’homme ... le fils de l’homme
  rationale: Le premier membre explicite la portée générique, tandis que le second conserve l’image poétique au masculin singulier. Dans ce contexte, « fils de l’homme » désigne un être humain mortel, sans imposer un titre messianique.
- issue: Nuance de וַתְּחַשְּׁבֵהוּ
  choice: tu le prennes en considération
  alternative: tu penses à lui
  rationale: Le verbe peut exprimer le fait de penser, compter ou considérer. Le choix retenu garde l’idée de l’attention accordée par Dieu sans préciser indûment sa nature.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébreu est conservé sur deux lignes; « qu’est-ce que » maintient la force de la question rhétorique, et le tutoiement correspond à l’adresse directe du psalmiste à Dieu.
