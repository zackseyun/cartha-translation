  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: fr
  text: Mon amour fidèle et ma forteresse, mon refuge sûr et mon libérateur, mon bouclier, celui en qui je me réfugie, celui qui soumet mon peuple[a] sous mon autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certaines versions anciennes lisent : « des peuples » ; cette lecture correspond aussi au passage parallèle de Psaume 18.48.'
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: mon amour fidèle
  rationale: חֶסֶד exprime ici l’amour loyal et constant de Dieu et fonctionne comme un titre divin. « Amour fidèle » en conserve la dimension relationnelle sans recourir à une formulation archaïque.
- source_word: מְצוּדָתִי
  choice: ma forteresse
  rationale: Le terme désigne un lieu défensif fortifié; « forteresse » restitue naturellement l’image militaire.
- source_word: מִשְׂגַּבִּי
  choice: mon refuge sûr
  rationale: Le mot évoque un lieu élevé et inaccessible qui procure la sécurité. « Refuge sûr » transmet clairement cette fonction protectrice tout en le distinguant de « forteresse ».
- source_word: מְפַלְטִי לִי
  choice: mon libérateur
  rationale: Le participe désigne celui qui fait échapper au danger. Le לִי souligne que Dieu agit en faveur du psalmiste, nuance déjà exprimée naturellement en français par le possessif « mon ».
- source_word: מָגִנִּי
  choice: mon bouclier
  rationale: Traduction directe de la métaphore militaire de protection.
- source_word: וּבוֹ חָסִיתִי
  choice: celui en qui je me réfugie
  rationale: Le verbe חסה signifie chercher refuge. Le présent rend ici la confiance durable exprimée dans cette confession poétique tout en maintenant l’image de protection.
- source_word: הָרוֹדֵד
  choice: celui qui soumet
  rationale: Le participe de רדד exprime l’action de placer sous domination ou autorité; « soumet » convient au contexte royal.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Le texte massorétique vocalisé porte le singulier avec suffixe de première personne, « mon peuple ». Cette leçon est retenue dans le texte principal conformément à la priorité donnée au texte hébreu.
- source_word: תַחְתָּי
  choice: à mon autorité
  rationale: Littéralement « sous moi ». La formulation française explicite naturellement la métaphore spatiale de la subordination politique sans lui ajouter une idée d’oppression.
theological_decisions:
- issue: Faut-il traduire עַמִּי par « mon peuple » ou suivre la lecture plurielle « des peuples » attestée par certaines versions anciennes et parallèle à Psaume 18.48 ?
  choice: mon peuple
  alternative: des peuples
  rationale: La vocalisation massorétique donne clairement « mon peuple ». Elle peut désigner le peuple que Dieu place sous l’autorité royale du psalmiste, sans nécessairement suggérer une oppression. La variante plurielle, ancienne et largement connue, est signalée en note plutôt qu’introduite silencieusement dans le texte.
translation_notes:
  register: Français international moderne, poétique et digne. La série d’images protectrices est conservée, avec des formulations courantes. « À mon autorité » rend idiomatiquement l’hébreu littéral « sous moi ».
