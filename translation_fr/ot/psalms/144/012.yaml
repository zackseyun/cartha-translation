source:
  edition: WLC
  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: fr
  text: Que nos fils soient, dans leur jeunesse, comme des plantes qui ont bien grandi, et nos filles comme des colonnes d’angle sculptées sur le modèle d’un palais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un temple ». Le mot hébreu peut désigner un palais, un temple ou une grande salle.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Que… soient
  rationale: Bien que le mot soit normalement un relatif (« qui, que »), il introduit ici, dans la continuité du contexte, une situation souhaitée. La tournure optative française rend cette fonction sans transformer l’image en affirmation.
- source_word: בָּנֵינוּ / בְּנוֹתֵינוּ
  choice: nos fils / nos filles
  rationale: Les deux termes désignent respectivement les fils et les filles; cette précision maintient le parallélisme du vers.
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: comme des plantes qui ont bien grandi
  rationale: נְטִעִים évoque ce qui est planté, sans imposer l’idée plus étroite de jeunes arbres. Le participe passif מְגֻדָּלִים décrit une croissance menée à maturité ou favorisée avec succès.
- source_word: בִּנְעוּרֵיהֶם
  choice: dans leur jeunesse
  rationale: La préposition situe naturellement cette croissance pendant la jeunesse; la formulation française reste temporelle sans imposer le sens « depuis leur jeunesse ».
- source_word: כְזָוִיּוֹת
  choice: comme des colonnes d’angle
  rationale: Le terme renvoie littéralement aux angles ou éléments d’angle. Dans cette image architecturale, « colonnes d’angle » exprime clairement des éléments saillants et porteurs, tout en évitant « pierres angulaires », plus spécifique.
- source_word: מְחֻטָּבוֹת
  choice: sculptées
  rationale: Le participe décrit des éléments façonnés par la taille. « Sculptées » convient à l’ornementation architecturale évoquée ici.
- source_word: תַּבְנִית
  choice: sur le modèle de
  rationale: Le nom peut désigner une forme, un modèle ou un plan. Cette expression conserve l’idée d’une réalisation conforme à un modèle architectural.
- source_word: הֵיכָל
  choice: un palais
  rationale: Le mot peut désigner un palais, un temple ou une grande salle. Dans ce tableau de prospérité familiale et nationale, « palais » fournit une image architecturale cohérente, tandis que l’autre sens principal est signalé en note.
theological_decisions:
- issue: Référent de הֵיכָל dans l’image architecturale appliquée aux filles
  choice: palais, dans un sens non cultuel
  alternative: temple
  rationale: Le contexte immédiat décrit l’épanouissement de la maisonnée et du peuple, sans indice cultuel explicite. « Palais » évite d’introduire une référence au sanctuaire qui n’est pas requise, mais la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste aisément compréhensible; les images agricole et architecturale ainsi que le parallélisme entre fils et filles sont conservés.
