source:
  edition: WLC
  text: בְּר֣וֹק בָּ֭רָק וּ/תְפִיצֵ֑/ם שְׁלַ֥ח חִ֝צֶּ֗י/ךָ וּ/תְהֻמֵּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/006.yaml
  text: Flash forth lightning and scatter them[a]; send out your arrows and throw them into confusion.
translation:
  language: fr
  text: Fais jaillir l’éclair et disperse-les ; décoche tes flèches et jette-les dans la confusion.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et mets-les en déroute ». Le dernier verbe peut évoquer l’affolement, la confusion ou la défaite au combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוֹק בָּרָק
  choice: Fais jaillir l’éclair
  rationale: Le premier terme est un impératif verbal apparenté au nom qui suit. Cette formulation française restitue la figure étymologique et l’image vive sans ajouter de complément étranger au texte.
- source_word: וּתְפִיצֵם
  choice: et disperse-les
  rationale: Le hifil de פוץ exprime l’action de mettre en dispersion ; « disperse-les» convient au contexte guerrier et au parallélisme.
- source_word: שְׁלַח חִצֶּיךָ
  choice: décoche tes flèches
  rationale: Avec des flèches pour complément, שלח décrit ici leur envoi. « Décoche » est idiomatique, précis et conserve l’image du guerrier divin.
- source_word: וּתְהֻמֵּם
  choice: et jette-les dans la confusion
  rationale: Le verbe המם peut exprimer l’affolement, le désarroi ou la déroute provoqués au combat. Cette tournure conserve sa valeur causative sans réduire le sens à une simple confusion mentale.
theological_decisions:
- issue: Image de Dieu comme guerrier
  choice: Conserver l’appel direct à Dieu, dont l’éclair et les flèches dispersent les ennemis.
  alternative: Atténuer l’image en une demande générale de secours ou de jugement.
  rationale: Les impératifs hébreux et le parallélisme présentent explicitement une scène guerrière poétique ; la traduction ne doit ni l’effacer ni la développer au-delà du texte.
translation_notes:
  register: Français international moderne, poétique et digne. « Fais jaillir » rend naturellement la construction hébraïque בְּרוֹק בָּרָק ; « décoche » est plus idiomatique en français que le calque « envoie tes flèches ». Le pronom « les » garde son référent implicite dans ce verset, comme en hébreu.
