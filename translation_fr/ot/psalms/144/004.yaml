source:
  edition: WLC
  text: אָ֭דָם לַ/הֶ֣בֶל דָּמָ֑ה יָ֝מָ֗י/ו כְּ/צֵ֣ל עוֹבֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/004.yaml
  text: Man is like a breath[b][a]; his days are like a passing shadow.
translation:
  language: fr
  text: L’être humain ressemble à un souffle[a] ; ses jours sont comme une ombre qui passe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi se traduire par « vapeur », « vanité » ou « néant » ; il souligne ici le caractère fugitif et inconsistant de la vie humaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: L’être humain
  rationale: Le nom peut désigner un individu humain ou l’humanité en général. Ici, l’énoncé proverbial porte sur la fragilité humaine en général ; « l’être humain » conserve la valeur générique sans introduire une restriction de sexe.
- source_word: לַהֶבֶל
  choice: à un souffle
  rationale: הֶבֶל désigne concrètement un souffle ou une vapeur, puis, par extension, ce qui est fugitif, inconsistant ou vain. « Un souffle » maintient l’image concrète et la brièveté suggérée par le contexte.
- source_word: דָּמָה
  choice: ressemble à
  rationale: Le verbe exprime la ressemblance ou la comparaison. « Ressemble à » rend directement sa valeur verbale et convient au registre poétique.
- source_word: יָמָיו
  choice: ses jours
  rationale: Le pluriel possessif désigne les jours qui composent la durée de la vie de l’être humain.
- source_word: כְּצֵל
  choice: comme une ombre
  rationale: La préposition comparative et le nom צֵל forment une comparaison explicite, rendue naturellement en français par « comme une ombre ».
- source_word: עוֹבֵר
  choice: qui passe
  rationale: Le participe de עבר évoque une ombre en train de passer. La relative française conserve cette image dynamique sans la réduire au seul adjectif interprétatif « fugitive ».
