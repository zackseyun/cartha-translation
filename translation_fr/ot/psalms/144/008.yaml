  yaml_path: translation/ot/psalms/144/008.yaml
  text: whose mouth speaks emptiness[b][a], and whose right hand is a right hand of falsehood.
translation:
  language: fr
  text: eux dont la bouche profère la fausseté[a], et dont la main droite est une main droite de mensonge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « profère des paroles vaines ». Le terme hébreu peut évoquer le vide, la vanité ou la tromperie.
    reason: lexical_alternative
  - marker: b
    text: La répétition « main droite… main droite » reproduit l’insistance de l’hébreu. La main droite peut symboliser le serment, la puissance ou la fidélité promise ; une « main droite de mensonge » suggère donc la tromperie ou la perfidie.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: eux dont
  rationale: Le relatif reprend les étrangers du verset précédent; « eux dont » permet d’introduire naturellement les deux propositions descriptives en français.
- source_word: פִּיהֶם
  choice: la bouche
  rationale: Le singulier collectif de l’hébreu est conservé dans la tournure distributive « dont la bouche ».
- source_word: דִּבֶּר
  choice: profère
  rationale: Dans cette proposition caractérisante, l’accompli hébreu se rend naturellement par un présent. « Profère » convient à des paroles et garde un registre digne.
- source_word: שָׁוְא
  choice: des paroles vaines
  rationale: שָׁוְא peut exprimer la vanité, le vide ou la fausseté. L’ajout explicatif « paroles », déjà impliqué par « la bouche profère », produit un français naturel tout en maintenant une portée plus large que le seul mensonge.
- source_word: וִימִינָם
  choice: et dont la main droite
  rationale: La répétition de « dont » restitue clairement le parallélisme des deux membres.
- source_word: יְמִין
  choice: une main droite
  rationale: La répétition hébraïque « main droite… main droite » est conservée pour son insistance rhétorique.
- source_word: שָׁקֶר
  choice: trompeuse
  rationale: L’adjectif français exprime naturellement la qualité mensongère ou perfide de cette main droite, sans réduire l’image à une simple affirmation verbale fausse.
theological_decisions:
- issue: Portée symbolique de la « main droite »
  choice: Conserver littéralement l’image et signaler ses associations possibles en note
  alternative: Expliciter dans le texte une fausse prestation de serment ou une conduite perfide
  rationale: Le texte hébreu ne précise pas si l’image vise surtout le serment, la puissance ou la fidélité engagée; l’expliciter dans le corps du verset résoudrait indûment cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et la répétition rhétorique de l’hébreu sont maintenus; « paroles vaines » préserve l’étendue sémantique de שָׁוְא.
