  text: אֱֽלֹהִ֗ים שִׁ֣יר חָ֭דָשׁ אָשִׁ֣ירָה לָּ֑/ךְ בְּ/נֵ֥בֶל עָ֝שׂ֗וֹר אֲזַמְּרָה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/009.yaml
  text: O God[a], I will sing a new song to you; on a ten-stringed harp I will make music to you.
translation:
  language: fr
  text: Ô Dieu, je chanterai pour toi un chant nouveau ; avec un instrument à dix cordes[a], je jouerai pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec une harpe à dix cordes » ou « avec un luth à dix cordes » ; l’instrument ancien désigné par נֵבֶל ne peut être identifié avec certitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est employé comme vocatif dans une adresse directe. « Ô Dieu » restitue naturellement en français le ton solennel et poétique sans ajouter de contenu.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Équivalent direct et idiomatique, qui conserve le motif psalmique du « chant nouveau ».
- source_word: אָשִׁירָה
  choice: je chanterai
  rationale: La forme cohortative exprime ici la résolution ou l’intention du psalmiste ; le futur français la rend avec naturel.
- source_word: לָּךְ
  choice: pour toi
  rationale: Dans le contexte de la louange, « pour toi » désigne naturellement Dieu comme destinataire du chant et de la musique. « À toi » reste possible, mais est moins idiomatique avec « chanter » dans ce sens.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: sur un instrument à dix cordes
  rationale: נֵבֶל désigne un instrument à cordes ancien dont l’identification exacte demeure incertaine. Le rendu générique évite de trancher arbitrairement entre harpe et luth ; « sur » convient à l’exécution instrumentale.
- source_word: אֲזַמְּרָה
  choice: je jouerai
  rationale: Le piel de זמר peut exprimer l’action de faire de la musique ou de célébrer en musique. Puisqu’un instrument est explicitement mentionné, « je jouerai » rend clairement l’exécution musicale sans répéter « chanter ».
