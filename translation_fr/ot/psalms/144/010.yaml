  text: הַ/נּוֹתֵ֥ן תְּשׁוּעָ֗ה לַ/מְּלָ֫כִ֥ים הַ֭/פּוֹצֶה אֶת דָּוִ֥ד עַבְדּ֗/וֹ מֵ/חֶ֥רֶב רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/010.yaml
  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: fr
  text: Celui qui donne le salut aux rois[a], qui délivre David, son serviteur, d’une épée mauvaise[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la délivrance » ou « la victoire ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « d’une épée meurtrière ». Littéralement : « d’une épée mauvaise ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: celui qui donne
  rationale: Le participe qal avec article est substantivé et renvoie à Dieu. « Celui qui donne » conserve cette tournure participiale tout en restant naturel en français.
- source_word: תְּשׁוּעָה
  choice: le salut
  rationale: Le nom peut désigner le salut, la délivrance ou la victoire. « Le salut » maintient sa portée large et théologique, tandis que la note signale les nuances militaires possibles dans ce contexte.
- source_word: לַמְּלָכִים
  choice: aux rois
  rationale: 'La préposition ל marque ici les bénéficiaires de l’action : Dieu donne le salut aux rois.'
- source_word: הַפּוֹצֶה
  choice: qui délivre
  rationale: Dans ce contexte, le participe exprime l’action de tirer quelqu’un d’un danger. « Délivre » fait naturellement écho au salut de la première proposition.
- source_word: אֶת דָּוִד
  choice: David
  rationale: La particule אֶת introduit le complément d’objet direct, et le nom propre reçoit sa forme française usuelle.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: Pour David, עבד est ici une désignation royale et relationnelle devant Dieu. « Serviteur » rend cet emploi sans mettre au premier plan la condition servile que pourrait suggérer « esclave ».
- source_word: מֵחֶרֶב רָעָה
  choice: de l’épée malfaisante
  rationale: La préposition מן exprime l’éloignement du danger. « Malfaisante » conserve à la fois l’idée de mal et celle d’un effet destructeur, avec une note donnant le sens littéral et une autre possibilité contextuelle.
theological_decisions:
- issue: Portée de תְּשׁוּעָה dans un contexte royal et militaire
  choice: le salut
  alternative: la délivrance ; la victoire
  rationale: Le contexte de rois, de David et de l’épée comporte une dimension militaire, mais le terme hébreu possède une portée salvatrice plus large. « Salut » préserve cette ampleur sans exclure la délivrance concrète.
- issue: Désignation de David par עַבְדּוֹ
  choice: son serviteur
  alternative: son esclave
  rationale: Il s’agit ici de la désignation conventionnelle de David dans sa relation à Dieu. « Serviteur » exprime cette dépendance et cette fidélité sans imposer une nuance sociale qui n’est pas au premier plan.
- issue: Valeur de רָעָה appliqué à l’épée
  choice: malfaisante
  alternative: mauvaise ; meurtrière ; funeste
  rationale: L’adjectif peut évoquer aussi bien le mal que le caractère nuisible ou mortel de l’épée. « Malfaisante » maintient cette tension au lieu de réduire le sens à la seule létalité.
translation_notes:
  register: Français international actuel, digne et accessible. La minuscule initiale conserve le caractère syntaxiquement continu du verset. Le parallélisme participial hébreu est rendu par « celui qui… qui… ».
