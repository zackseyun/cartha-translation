  text: פְּצֵ֥/נִי וְ/הַצִּילֵ/נִי֮ מִ/יַּ֪ד בְּֽנֵי נֵ֫כָ֥ר אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: fr
  text: Arrache-moi, délivre-moi de la main des étrangers[a], dont la bouche profère le mensonge[b] et dont la main droite est une main droite trompeuse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « des fils de l’étranger », expression qui désigne des étrangers.'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu rendu par « le mensonge » peut aussi signifier « vanité » ou « vide ».
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu répète « main droite » : « leur main droite est une main droite trompeuse ». La main droite peut symboliser la puissance, l’engagement pris ou l’action.'
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: Arrache-moi
  rationale: L’impératif de פצה avec suffixe de première personne exprime l’action de dégager ou d’arracher quelqu’un au danger. « Arrache-moi » garde la force de la supplication et distingue ce verbe du suivant.
- source_word: וְהַצִּילֵנִי
  choice: délivre-moi
  rationale: Le hiphil impératif de נצל signifie retirer quelqu’un d’un péril, le délivrer. La formulation préserve les deux verbes parallèles sans les confondre.
- source_word: מִיַּד
  choice: de la main
  rationale: L’expression désigne la puissance ou l’emprise de quelqu’un. Conserver « main » maintient l’image hébraïque, naturelle dans un registre biblique français.
- source_word: בְּנֵי נֵכָר
  choice: les étrangers
  rationale: Littéralement « fils de l’étranger/de l’étrange », cette expression idiomatique désigne des étrangers. La traduction directe du sens évite le calque peu naturel « fils d’étrangers ».
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: dont la bouche profère des paroles fausses
  rationale: שָׁוְא peut évoquer la fausseté, la vanité ou le vide. En parallèle avec שֶׁקֶר, « paroles fausses » exprime ici la tromperie tout en signalant qu’il s’agit du contenu proféré par la bouche.
- source_word: וִימִינָם
  choice: et dont la main droite
  rationale: La tournure possessive maintient le parallélisme avec « dont la bouche ».
- source_word: יְמִין שָׁקֶר
  choice: est une main trompeuse
  rationale: La répétition hébraïque de « main droite » est conservée. שֶׁקֶר indique la fausseté ou la tromperie; « trompeuse » produit un français naturel sans supprimer l’emphase de la répétition.
