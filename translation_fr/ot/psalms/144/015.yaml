id: PSA.144.15
reference: Psalms 144:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם שֶׁ/כָּ֣כָה לּ֑/וֹ אַֽשְׁרֵ֥י הָ֝/עָ֗ם שֶׁ/יֲהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: fr
  text: Heureux le peuple pour qui il en est ainsi[a] ! Heureux le peuple qui a Yahvé pour Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Heureux le peuple qui connaît un tel sort ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule de béatitude désigne une condition enviable et comblée, et non une simple émotion passagère. « Heureux » est la tournure française naturelle et consacrée dans ce type d’énoncé.
- source_word: הָעָם
  choice: le peuple
  rationale: עָם désigne ici un groupe humain considéré collectivement. « Le peuple » convient mieux que « la nation », plus politique.
- source_word: שֶׁכָּכָה לּוֹ
  choice: pour qui il en est ainsi
  rationale: Cette formulation restitue sobrement le relatif שֶׁ, l’adverbe כָּכָה (« ainsi ») et la relation exprimée par לּוֹ, tout en renvoyant aux bénédictions décrites dans les versets précédents.
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française courante du nom divin représenté par le tétragramme, plutôt qu’un remplacement par le titre « le Seigneur ».
- source_word: אֱלֹהָיו
  choice: qui a … pour Dieu
  rationale: Le suffixe masculin singulier renvoie collectivement au peuple. La construction française « avoir Yahvé pour Dieu » exprime naturellement cette relation sans en modifier le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Le conserver sous sa forme française usuelle distingue ce nom du titre אֲדֹנָי et évite d’effacer cette particularité du texte.
- issue: Sens de la béatitude אַשְׁרֵי
  choice: Heureux
  alternative: Béni
  rationale: « Heureux » exprime l’état enviable proclamé par la formule hébraïque sans préciser indûment l’agent de la bénédiction. « Béni » pourrait suggérer plus directement une action divine explicite.
translation_notes:
  register: Style poétique, actuel et digne. La répétition de « Heureux le peuple » conserve le parallélisme hébreu, tandis que les deux points d’exclamation rendent naturellement la force des deux proclamations en français.
