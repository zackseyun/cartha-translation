  source_fidelity: 'Le texte traduit fidèlement le parallélisme de l’hébreu : אַשְׁרֵי est bien rendu par la formule de béatitude « Heureux », הָעָם par « le peuple », et שֶׁכָּכָה לּוֹ par l’expression idiomatique « pour qui il en est ainsi ». La seconde ligne, « qui a Yahvé pour Dieu », exprime naturellement la relation possessive de אֱלֹהָיו sans ajouter de contenu. Le nom divin יְהוָה est correctement conservé sous la forme française « Yahvé ».'
