  terminology: « Yahvé » est une translittération française usuelle et appropriée du tétragramme. « Dieu » avec majuscule convient au référent déterminé par Yahvé. « Heureux » rend bien la béatitude sans transformer celle-ci en affirmation explicite d’une bénédiction conférée.
