  text: לְ/דָוִ֨ד בָּ֘ר֤וּךְ יְהוָ֨ה צוּרִ֗/י הַֽ/מְלַמֵּ֣ד יָדַ֣/י לַ/קְרָ֑ב אֶ֝צְבְּעוֹתַ֗/י לַ/מִּלְחָמָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: fr
  text: 'De David[a].


    Béni soit Yahweh, mon rocher,


    lui qui entraîne mes mains pour le combat,


    mes doigts pour la guerre !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David » ou « Par David » dans le titre du psaume ; la préposition hébraïque peut indiquer la paternité, une association ou une dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: Dans le titre du psaume, la préposition לְ peut exprimer l’auteur, l’association ou la destination. « De David » est la formulation française conventionnelle la moins déterminante; une note conserve les autres possibilités.
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif fonctionne ici comme une acclamation liturgique. « Béni soit » en conserve la forme et la dignité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de rendre explicitement le tétragramme du texte hébreu.
- source_word: צוּרִי
  choice: mon rocher
  rationale: Cette traduction garde l’image concrète du rocher et sa portée métaphorique de stabilité et de protection.
- source_word: הַמְלַמֵּד
  choice: lui qui entraîne
  rationale: Dans ce contexte militaire, le verbe « entraîner » exprime naturellement un enseignement pratique qui prépare au combat, tandis que « lui qui » restitue la valeur descriptive du participe.
- source_word: יָדַי לַקְרָב
  choice: mes mains au combat
  rationale: La formulation préserve l’image corporelle et rend la préparation orientée vers le combat dans un français poétique naturel.
- source_word: אֶצְבְּעוֹתַי לַמִּלְחָמָה
  choice: mes doigts à la guerre
  rationale: Le choix conserve le terme précis « doigts », la concision de l’hébreu et le parallélisme avec « mes mains au combat ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. « Yahweh » le conserve comme nom propre sans lui substituer un titre.
- issue: Langage militaire appliqué à Dieu
  choice: Conserver les images explicites du combat et de la guerre
  alternative: Les généraliser en images de force, de courage ou de persévérance
  rationale: L’hébreu présente explicitement Dieu comme celui qui prépare le psalmiste au conflit armé. La traduction ne spiritualise ni n’atténue cette tension historique et théologique.
- issue: Rapport de David au psaume dans le titre
  choice: De David, avec note signalant l’ambiguïté
  alternative: Pour David; Par David
  rationale: La préposition hébraïque permet plusieurs rapports possibles. Le texte retient la formule française traditionnelle sans transformer une possibilité en certitude.
translation_notes:
  register: Français international moderne, digne et poétique. Les deux membres parallèles sont disposés sur des lignes distinctes pour faire ressortir la progression « mains / doigts » et « combat / guerre ». Le vocabulaire militaire reste direct, sans archaïsme ni atténuation.
