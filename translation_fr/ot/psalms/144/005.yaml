source:
  edition: WLC
  text: יְ֭הוָה הַט שָׁמֶ֣י/ךָ וְ/תֵרֵ֑ד גַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: fr
  text: Yahweh, abaisse tes cieux et descends ; touche les montagnes, et qu’elles fument[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et elles fumeront » ; l’hébreu peut présenter la fumée comme la conséquence du toucher de Dieu.'
    reason: ambiguïté syntaxique et modale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit directement plutôt que remplacé par un titre.
- source_word: הַט שָׁמֶיךָ
  choice: abaisse tes cieux
  rationale: L’impératif de נטה évoque ici les cieux que Dieu incline vers le bas. « Abaisse » restitue naturellement en français le mouvement demandé et prépare « descends ».
- source_word: וְתֵרֵד
  choice: et descends
  rationale: Le verbe ירד exprime directement un mouvement vers le bas ; l’impératif français convient à l’adresse faite à Dieu.
- source_word: גַּע בֶּהָרִים
  choice: touche les montagnes
  rationale: נגע signifie couramment « toucher ». Ce choix conserve la force de l’image sans amplifier le geste en « frapper ».
- source_word: וְיֶעֱשָׁנוּ
  choice: et qu’elles fument
  rationale: La forme verbale qui suit les impératifs peut présenter la fumée comme l’effet souhaité du toucher divin. La formulation française garde cette nuance sans exclure une lecture consécutive ou future.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. Sa transcription préserve cette fonction sans lui substituer un titre.
- issue: Rapport entre le toucher divin et la fumée des montagnes
  choice: et qu’elles fument
  alternative: et elles fumeront
  rationale: L’hébreu permet d’entendre la fumée comme effet attendu ou comme conséquence annoncée. Le texte principal conserve la tournure volitive, et la note signale l’autre lecture.
translation_notes:
  register: Poésie élevée mais immédiatement compréhensible. Le tutoiement correspond à l’adresse directe à Dieu. Le parallélisme des impératifs et la vigueur de l’image théophanique sont conservés.
