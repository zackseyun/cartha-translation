  text: לְ/דָוִ֨ד בָּ֘ר֤וּךְ יְהוָ֨ה צוּרִ֗/י הַֽ/מְלַמֵּ֣ד יָדַ֣/י לַ/קְרָ֑ב אֶ֝צְבְּעוֹתַ֗/י לַ/מִּלְחָמָֽה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: fr
  text: 'De David[a].


    Béni soit Yahvé, mon rocher,

    lui qui forme mes mains au combat,

    mes doigts à la guerre !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David » ou « À David » dans le titre du psaume ; la préposition hébraïque peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut signaler l’auteur, l’association ou la dédicace. « De David » convient naturellement comme titre tout en laissant les autres possibilités en note.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui conserve ici sa valeur de nom propre.
- source_word: צוּרִי
  choice: mon rocher
  rationale: Rend directement la métaphore hébraïque du rocher comme image de solidité et de protection.
- source_word: הַמְלַמֵּד
  choice: lui qui forme
  rationale: Le participe exprime une action habituelle d’enseignement ou d’entraînement. « Forme » est naturel en français dans un contexte militaire sans effacer l’idée d’apprentissage.
- source_word: לַקְרָב / לַמִּלְחָמָה
  choice: au combat / à la guerre
  rationale: Conserve le parallélisme hébraïque entre deux termes proches sans les réduire à un seul mot.
theological_decisions:
- issue: Sens de la formule לְדָוִד dans le titre
  choice: « De David » dans le texte, avec une note signalant l’ambiguïté
  alternative: « Pour David » ou « À David »
  rationale: L’hébreu ne permet pas de trancher systématiquement entre attribution, association et dédicace; la traduction ne doit pas imposer une seule compréhension.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme du vers hébreu est conservé sur des lignes distinctes; « Yahvé » maintient le nom divin et « forme » exprime naturellement l’entraînement au combat.
