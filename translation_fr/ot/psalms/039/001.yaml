base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: fr
  text: 'J’ai dit : « Je veillerai sur mes voies pour ne pas pécher par ma langue ; je mettrai une muselière sur ma bouche tant qu’un méchant[a] sera devant moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le méchant » ou « une personne méchante ». L’hébreu est au masculin singulier.
    reason: Le substantif adjectival peut être compris comme indéfini, défini ou représentatif ; la note préserve cette latitude.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: J’ai dit
  rationale: Le qal accompli à la première personne introduit la résolution formulée par le psalmiste. « J’ai dit » reste direct sans expliciter davantage la valeur intérieure possible du verbe.
- source_word: אֶשְׁמְרָה
  choice: je veillerai / je maintiendrai
  rationale: La forme exprime ici une ferme détermination. Le premier emploi se rend naturellement par « je veillerai sur » ; au second, « je maintiendrai » permet de conserver l’image concrète de la muselière dans un français idiomatique.
- source_word: דְרָכַי
  choice: mes voies
  rationale: Le pluriel désigne la conduite ou la manière de vivre. « Mes voies » conserve l’image hébraïque, courante et intelligible dans le registre poétique biblique.
- source_word: מֵחֲטוֹא
  choice: pour ne pas pécher
  rationale: La préposition מן suivie de l’infinitif exprime l’évitement. Cette tournure rend naturellement en français le but préventif de la vigilance.
- source_word: בִּלְשׁוֹנִי
  choice: par ma langue
  rationale: 'Le beth a une valeur instrumentale : la langue est le moyen par lequel le péché pourrait être commis. « Par ma langue » conserve cette relation de manière concise.'
- source_word: לְפִי
  choice: sur ma bouche
  rationale: La préposition désigne ce à quoi le dispositif de retenue est appliqué. Avec « muselière », « sur ma bouche » produit une image claire en français.
- source_word: מַחְסוֹם
  choice: une muselière
  rationale: Le nom désigne un dispositif qui empêche la bouche de s’ouvrir ou de mordre. « Muselière » préserve l’image concrète et énergique de l’hébreu.
- source_word: בְּעוֹד
  choice: tant que
  rationale: L’expression marque la simultanéité ou la durée. « Tant que » convient à la résolution de garder le silence durant toute la présence du méchant.
- source_word: רָשָׁע
  choice: un méchant
  rationale: L’adjectif substantivé est masculin singulier et sans article. « Un méchant » respecte ces traits tout en restant naturel en français.
- source_word: לְנֶגְדִּי
  choice: sera devant moi
  rationale: L’expression signifie littéralement « devant moi », c’est-à-dire en ma présence. Le verbe « sera » est ajouté pour former une proposition française naturelle.
theological_decisions:
- issue: Portée et genre de רָשָׁע
  choice: un méchant
  alternative: le méchant / une personne méchante
  rationale: Le texte emploie un masculin singulier substantivé sans article. « Un méchant » en conserve le nombre et le genre grammatical sans décider si l’individu est précis ou représentatif de toute une catégorie.
translation_notes:
  register: Français international actuel, digne et poétique. Le parallélisme entre la vigilance sur la conduite et la retenue de la bouche est conservé, de même que l’image concrète de la muselière.
