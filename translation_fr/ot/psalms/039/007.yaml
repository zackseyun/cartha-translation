  text: וְ/עַתָּ֣ה מַה קִּוִּ֣יתִי אֲדֹנָ֑/י תּ֝וֹחַלְתִּ֗/י לְ/ךָ֣ הִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/007.yaml
  text: And now[a], Lord, what do I wait for? My hope is in you.
translation:
  language: fr
  text: Et maintenant, Seigneur, qu’est-ce que j’attends[a] ? Mon espérance est en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus formelle : « Et maintenant, Seigneur, qu’ai-je espéré ? Mon espérance est en toi. » Le verbe hébreu קוה peut évoquer à la fois l’attente et l’espérance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien exprimé par וְ et la valeur temporelle de עַתָּה, dans un français naturel.
- source_word: מַה
  choice: qu’est-ce que
  rationale: Introduit naturellement en français la question rhétorique portant sur l’objet de l’attente.
- source_word: קִוִּיתִי
  choice: j’attends
  rationale: Le verbe קוה peut exprimer l’attente confiante aussi bien que l’espérance. Le présent français s’accorde avec « maintenant » et rend l’orientation actuelle du psalmiste, tandis que la note préserve l’autre nuance et la forme accomplie de l’hébreu.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Rend le titre divin usuel par son équivalent français traditionnel et intelligible.
- source_word: תּוֹחַלְתִּי
  choice: Mon espérance
  rationale: Exprime naturellement l’espoir ou l’attente confiante désignés par ce nom.
- source_word: לְךָ הִיא
  choice: est en toi
  rationale: Formulation française idiomatique qui exprime l’orientation de l’espérance vers Dieu et la confiance placée en lui.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: Seigneur
  alternative: mon Seigneur
  rationale: Dans cet emploi, אֲדֹנָי fonctionne comme le titre divin révérenciel habituel. « Seigneur » le traduit sans surinterpréter le suffixe historiquement présent dans la forme.
translation_notes:
  register: Français international moderne, naturel et digne. La question directe conserve la tension entre l’attente et l’espérance du texte hébreu.
