  text: הָשַׁ֣ע מִמֶּ֣/נִּי וְ/אַבְלִ֑יגָה בְּ/טֶ֖רֶם אֵלֵ֣ךְ וְ/אֵינֶֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/013.yaml
  text: Look away from me[a], so that I may smile again before I go and am no more.
translation:
  language: fr
  text: Détourne de moi ton regard[a], afin que je reprenne courage avant que je m’en aille et que je ne sois plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que je reprenne des forces », « afin que je retrouve de la joie » ou « afin que mon visage s’éclaire de nouveau ». Le verbe hébreu évoque un retour de l’éclat, du soulagement, de la joie ou des forces.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשַׁע
  choice: Détourne de moi ton regard
  rationale: L’impératif demande à Dieu de détourner son attention du psalmiste, dans le contexte d’une souffrance ressentie comme venant de sa main. Cette formulation française est naturelle et conserve l’image du regard.
- source_word: מִמֶּנִּי
  choice: de moi
  rationale: La préposition avec suffixe de première personne exprime simplement l’éloignement.
- source_word: וְאַבְלִיגָה
  choice: afin que je retrouve un peu de joie
  rationale: Le verbe בלג peut évoquer le retour de l’éclat, du soulagement, de la bonne humeur ou des forces. La traduction choisie rend naturellement l’idée d’un répit intérieur sans réduire toute la gamme sémantique, signalée en note.
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: Équivalent temporel direct et idiomatique en français moderne.
- source_word: אֵלֵךְ
  choice: je m’en aille
  rationale: Le verbe signifie littéralement « aller ». Ici, il évoque indirectement la mort; conserver cette métaphore respecte la retenue poétique de l’hébreu.
- source_word: וְאֵינֶנִּי
  choice: je ne sois plus
  rationale: Cette expression marque la disparition ou la cessation de la présence, ici dans le contexte de la mort, sans l’expliciter davantage que l’original.
theological_decisions:
- issue: Faut-il expliciter la mort dans אֵלֵךְ וְאֵינֶנִּי ?
  choice: Conserver l’expression indirecte « avant que je m’en aille et que je ne sois plus »
  alternative: « avant que je meure et disparaisse »
  rationale: La mort est clairement sous-entendue, mais l’hébreu emploie une formulation poétique indirecte. La conserver évite d’expliciter ce que le texte laisse voilé.
translation_notes:
  register: Français international moderne, digne et poétique. La formulation préserve l’adresse directe à Dieu, l’image du regard détourné et l’allusion discrète à la mort.
