  text: הָסֵ֣ר מֵ/עָלַ֣/י נִגְעֶ֑/ךָ מִ/תִּגְרַ֥ת יָ֝דְ/ךָ֗ אֲנִ֣י כָלִֽיתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/010.yaml
  text: Remove your plague from me[d][c][b][a]; by the blow of your hand I am consumed.
translation:
  language: fr
  text: Éloigne de moi ton fléau[a] ; sous l’assaut de ta main[b], je me consume[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le coup dont tu me frappes » ou « ton affliction ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sous les coups de ta main » ou « à cause de l’attaque de ta main ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je dépéris » ou « je suis à bout ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: Éloigne
  rationale: L’impératif hiphil exprime une demande directe visant à faire disparaître ou tenir à distance ce qui accable le psalmiste. « Éloigne » est naturel en français et conserve la force de l’impératif.
- source_word: מֵעָלַי
  choice: de moi
  rationale: La forme signifie littéralement « de dessus moi ». En français courant, « de moi » exprime naturellement l’éloignement demandé sans formulation pesante.
- source_word: נִגְעֶךָ
  choice: ton fléau
  rationale: נגע peut désigner un coup, une atteinte ou un fléau. « Ton fléau » conserve l’idée d’une affliction attribuée à l’action divine sans la limiter explicitement à une maladie.
- source_word: מִתִּגְרַת
  choice: sous l’assaut de
  rationale: תגרה évoque la lutte, l’hostilité ou une attaque. « Sous l’assaut de » rend cette pression hostile et s’accorde avec l’image de la main qui agit avec force.
- source_word: יָדְךָ
  choice: ta main
  rationale: L’image anthropomorphique de la main, qui représente ici l’action ou la puissance divine, est conservée plutôt que paraphrasée.
- source_word: אֲנִי כָלִיתִי
  choice: je me consume
  rationale: כלה peut signifier arriver à son terme, être épuisé ou se consumer. « Je me consume » rend l’affaiblissement extrême du psalmiste tout en restant ouvert quant à son issue exacte.
theological_decisions:
- issue: Nature de l’affliction exprimée par נִגְעֶךָ
  choice: Une affliction venant de Dieu, rendue par « ton fléau »
  alternative: « ton coup » ou « l’atteinte qui vient de toi »
  rationale: Le texte attribue directement l’affliction à Dieu, mais n’en précise ni la forme ni la finalité. La traduction ne la réduit donc ni à une maladie déterminée ni à une doctrine particulière du châtiment.
- issue: Valeur de l’image « l’assaut de ta main »
  choice: Conserver ensemble l’idée d’attaque et l’image de la main divine
  alternative: « sous les coups de ta main »
  rationale: Le substantif rare תגרה porte une nuance de lutte ou d’hostilité, tandis que « ta main » désigne l’action divine. La formulation retenue préserve la tension vigoureuse de l’hébreu sans expliquer pourquoi Dieu agit ainsi.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme est conservé par le point-virgule. « Fléau », « assaut » et « main » maintiennent la vigueur poétique et l’attribution directe de l’épreuve à Dieu, tandis que les notes signalent les principales possibilités lexicales sans alourdir le verset.
