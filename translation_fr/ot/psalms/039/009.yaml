  text: I am mute[a]; I do not open my mouth[b], because you have done it.
translation:
  language: fr
  text: Je reste muet[a], je n’ouvre pas la bouche, car c’est toi qui l’as fait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai été réduit au silence » ou « Je garde le silence ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car toi, tu as fait », sans objet exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Je reste muet
  rationale: Le nifal de אלם peut décrire l’état résultant de quelqu’un réduit au silence. « Je reste muet » exprime naturellement en français la posture actuelle du psalmiste sans imposer un agent dans la formulation.
- source_word: לֹא אֶפְתַּח פִּי
  choice: je n’ouvre pas la bouche
  rationale: L’expression hébraïque signifie s’abstenir de parler. La formulation conserve l’image de la bouche et rend l’imparfait comme une attitude présente dans ce contexte.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison du silence. « Car » convient au registre poétique tout en restant courant.
- source_word: אַתָּה
  choice: c’est toi qui
  rationale: Le pronom sujet est explicite et placé avec relief en hébreu. La tournure clivée française restitue cette insistance sans recours typographique.
- source_word: עָשִׂיתָ
  choice: as agi
  rationale: Le verbe עשה est employé sans objet exprimé. « As agi » conserve cette absence et évite d’ajouter un complément, tout en reconnaissant clairement l’action divine.
theological_decisions:
- issue: Objet implicite de עָשִׂיתָ et action divine
  choice: « car c’est toi qui as agi »
  alternative: « car c’est toi qui as fait cela »
  rationale: L’hébreu affirme l’action de Dieu sans en exprimer l’objet. La traduction retenue préserve cette indétermination et la tension du contexte, tandis que l’alternative explicite en français le complément implicite.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme est maintenu, et la tournure « c’est toi qui » rend l’emphase du pronom hébreu. Tous les marqueurs de note figurent dans le texte.
