  text: חַם לִבִּ֨/י בְּ/קִרְבִּ֗/י בַּ/הֲגִיגִ֥/י תִבְעַר אֵ֑שׁ דִּ֝בַּ֗רְתִּי בִּ/לְשֽׁוֹנִ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/003.yaml
  text: 'My heart grew hot within me[a]; as I meditated, the fire burned[b]; then I spoke with my tongue:'
translation:
  language: fr
  text: 'Mon cœur était brûlant au-dedans de moi ; tandis que je méditais, un feu brûlait[a] ; alors j’ai parlé avec ma langue :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un feu s’embrasait » ou « le feu brûlait ». L’image hébraïque progresse de la chaleur intérieure à un feu ardent.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַם לִבִּי
  choice: Mon cœur brûlait
  rationale: Le prédicat חַם décrit la chaleur intérieure du cœur. « Brûlait » est naturel en français et prépare l’intensification de l’image avec le feu, sans réduire le cœur aux seules émotions.
- source_word: בְּקִרְבִּי
  choice: au-dedans de moi
  rationale: Cette formulation idiomatique conserve l’accent mis sur le lieu intérieur.
- source_word: בַּהֲגִיגִי
  choice: tandis que je méditais
  rationale: הֲגִיג peut désigner une réflexion intérieure, une méditation ou un murmure. La valeur temporelle de la préposition convient au déroulement du verset.
- source_word: תִבְעַר אֵשׁ
  choice: un feu s’est embrasé
  rationale: La tournure conserve l’image explicite du feu et rend l’intensification qui va de la chaleur intérieure à l’embrasement.
- source_word: דִּבַּרְתִּי בִּלְשׁוֹנִי
  choice: Alors j’ai parlé
  rationale: « Alors » rend la progression du contexte. En français, « j’ai parlé avec ma langue » serait lourdement redondant ; le verbe « parler » exprime naturellement l’énonciation par la langue.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme et la montée de la chaleur vers le feu puis vers la parole sont préservés. La redondance anatomique de « avec ma langue » n’est pas reproduite, car elle sonne artificielle en français courant.
