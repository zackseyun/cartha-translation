source:
  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: fr
  text: 'Écoute ma prière, Yahweh,

    prête l’oreille à mon cri ;

    ne reste pas sourd à mes larmes[a].


    Car je suis avec toi un étranger,

    un résident comme tous mes pères[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne garde pas le silence devant mes larmes ». Le verbe hébreu peut exprimer le silence ; le contexte de l’écoute permet aussi de comprendre : « ne reste pas sourd ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme tous mes ancêtres ». Littéralement : « comme tous mes pères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Écoute
  rationale: L’impératif qal de שׁמע ouvre une supplication directe. « Écoute » est naturel en français actuel et maintient le parallélisme avec « prête l’oreille ».
- source_word: תְפִלָּתִי
  choice: ma prière
  rationale: Équivalent français direct du nom courant désignant la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de le remplacer par un titre.
- source_word: וְשַׁוְעָתִי
  choice: mon cri
  rationale: שַׁוְעָה désigne un cri, souvent un appel au secours. « Mon cri » reste concis tout en gardant sa force affective.
- source_word: הַאֲזִינָה
  choice: prête l’oreille à
  rationale: L’expression idiomatique française rend l’image auditive du hiphil de אזן et conserve le parallélisme poétique.
- source_word: אֶל דִּמְעָתִי
  choice: à mes larmes
  rationale: Le singulier hébreu a ici une valeur collective ; le pluriel est idiomatique en français et conserve l’image concrète.
- source_word: אַל תֶּחֱרַשׁ
  choice: ne reste pas sourd
  rationale: חרשׁ peut évoquer le silence ou la surdité. Le contexte immédiat, dominé par « écoute » et « prête l’oreille », soutient la formulation auditive sans effacer l’autre possibilité, signalée en note.
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif de la supplication dans un registre poétique français naturel.
- source_word: גֵר
  choice: immigré
  rationale: גֵר désigne une personne venue d’ailleurs qui réside au sein d’une communauté sans y posséder le plein statut d’un autochtone. « Immigré » exprime ce statut plus précisément que le simple « étranger ».
- source_word: עִמָּךְ
  choice: auprès de toi
  rationale: עם signifie normalement « avec ». « Auprès de toi » rend naturellement en français l’idée d’une existence en présence de Dieu ou dans son domaine, sans l’expliciter davantage.
- source_word: תּוֹשָׁב
  choice: résident temporaire
  rationale: תּוֹשָׁב désigne un résident dépourvu du plein statut foncier ou civique. Cette formulation le distingue de גֵר tout en restant compréhensible.
- source_word: כְּכָל אֲבוֹתָי
  choice: comme tous mes pères
  rationale: Rend formellement le pluriel masculin אָבוֹת. « Ancêtres » est une possibilité française plus courante, indiquée en note.
theological_decisions:
- issue: Rendu des deux statuts sociaux גֵר et תּוֹשָׁב
  choice: Les distinguer par « immigré » et « résident temporaire ».
  alternative: « étranger et résident » ou « étranger de passage et hôte »
  rationale: Le verset fonde la demande du psalmiste sur sa condition de non-propriétaire et de personne de passage devant Dieu. Deux expressions distinctes évitent d’aplatir la paire hébraïque, sans transformer cette image en affirmation doctrinale plus précise sur la vie humaine.
- issue: Sens de אַל תֶּחֱרַשׁ
  choice: « ne reste pas sourd » dans le texte
  alternative: « ne garde pas le silence »
  rationale: Le contexte fait appel à l’écoute de Dieu, ce qui favorise le sens auditif. Toutefois, le verbe peut aussi viser le silence ou l’absence de réponse ; la note préserve cette tension.
- issue: Rendu de אֲבוֹתָי
  choice: « mes pères » dans le texte
  alternative: « mes ancêtres »
  rationale: Le texte hébreu emploie explicitement le terme ancestral masculin. Le conserver évite de neutraliser silencieusement sa forme, tandis que la note donne l’équivalent collectif idiomatique.
translation_notes:
  register: Français international moderne, poétique mais directement compréhensible. Les impératifs restent sobres et dignes. « Immigré » est employé dans son sens social concret, non comme catégorie politique contemporaine ; « résident temporaire » maintient la distinction entre les deux termes hébreux.
