  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: fr
  text: Délivre-moi de toutes mes transgressions ; ne fais pas de moi l’opprobre d’un insensé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne fais pas de moi la honte d’un insensé ». L’hébreu peut désigner soit le fait de devenir l’objet de l’opprobre d’un insensé, soit une honte associée à un insensé ou à la folie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: de toutes mes transgressions
  rationale: La combinaison מִן + כָּל exprime ici la délivrance de l’ensemble des fautes du psalmiste. « Transgressions » conserve la portée morale de פֶּשַׁע et sa nuance possible de rébellion contre l’autorité légitime.
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif hiphil de נצל demande d’être arraché ou soustrait à un mal. « Délivre-moi » convient au registre de la prière et reste naturel en français.
- source_word: חֶרְפַּת
  choice: la risée
  rationale: חֶרְפָּה peut désigner l’opprobre, la honte ou les railleries. Avec « faire de moi », « la risée » exprime naturellement en français le fait de devenir l’objet du mépris d’autrui, tout en gardant la dimension publique de la honte.
- source_word: נָבָל
  choice: l’insensé
  rationale: Dans les Psaumes, נָבָל désigne une personne moralement dévoyée et impie, et non quelqu’un qui manque simplement d’intelligence. « L’insensé » est concis, digne et traditionnellement intelligible dans ce contexte.
- source_word: אַל תְּשִׂימֵנִי
  choice: ne fais pas de moi
  rationale: שׂים avec un complément de personne peut signifier faire de quelqu’un quelque chose ou le placer dans une certaine condition. Cette tournure est idiomatique en français.
theological_decisions:
- issue: Sens de la demande concernant la honte devant l’insensé
  choice: Le psalmiste demande à Dieu de ne pas le laisser devenir l’objet des railleries ou de l’opprobre de l’insensé.
  alternative: Le psalmiste demande à ne pas devenir une honte associée à l’insensé ou à la folie.
  rationale: La construction חֶרְפַּת נָבָל permet plusieurs relations entre les deux noms. La lecture où l’insensé inflige ou exprime l’opprobre s’accorde bien avec « ne fais pas de moi », mais l’ambiguïté réelle de l’hébreu est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. « La risée » rend idiomatiquement l’idée d’un opprobre public subi, tandis que la note conserve l’ambiguïté de la construction hébraïque.
