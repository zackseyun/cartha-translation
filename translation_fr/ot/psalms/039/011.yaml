  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: fr
  text: 'Par des réprimandes, tu corriges un homme pour sa faute ;

    comme une mite, tu fais dépérir ce qui lui est précieux[a].

    Oui, tout être humain n’est qu’un souffle[b]. Selah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « tu fais dépérir, comme le ferait une mite, ce qui lui est précieux ». L’expression peut désigner sa beauté ou, plus largement, ses biens les plus chers.'
    reason: Ambiguïté syntaxique et lexicale de כָּעָשׁ חֲמוּדוֹ.
  - marker: b
    text: Le mot hébreu rendu par « souffle » évoque une haleine ou une vapeur passagère ; il est traditionnellement traduit par « vanité ».
    reason: Image et étendue sémantique de הֶבֶל.
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: par des réprimandes
  rationale: Le ב instrumental est rendu par « par » et le pluriel תוֹכָחוֹת par « réprimandes », terme actuel qui conserve l’idée de reproches correctifs.
- source_word: עַל עָוֺן
  choice: pour sa faute
  rationale: עַל exprime ici le motif de la correction, tandis que עָוֺן désigne la faute ou la culpabilité. Le possessif explicite naturellement en français que la faute est celle de l’homme corrigé.
- source_word: יִסַּרְתָּ
  choice: tu corriges
  rationale: Le verbe יסר évoque une correction disciplinaire. « Tu corriges » est naturel et garde sa visée corrective sans employer le terme vieilli « châtier ».
- source_word: אִישׁ
  choice: un homme
  rationale: Le masculin singulier représentatif est conservé ici au plus près de l’hébreu.
- source_word: וַתֶּמֶס
  choice: tu fais dépérir
  rationale: La forme causative de מסס exprime l’action de faire fondre, se dissoudre ou dépérir. Cette formulation convient à l’effet progressif de la teigne.
- source_word: כָּעָשׁ
  choice: comme la teigne
  rationale: עָשׁ désigne l’insecte qui ronge progressivement les matières précieuses, notamment les vêtements ; « teigne » est le terme français idiomatique dans cette image.
- source_word: חֲמוּדוֹ
  choice: ce qu’il a de précieux
  rationale: Le mot peut viser ce qui est désirable, précieux ou beau chez l’homme. Une formulation large préserve cette indétermination.
- source_word: אַךְ
  choice: oui
  rationale: Dans cette conclusion, אַךְ apporte une affirmation appuyée. « Oui » exprime sobrement cette force en français.
- source_word: הֶבֶל
  choice: un souffle
  rationale: הֶבֶל évoque concrètement une haleine ou vapeur fugitive et, par extension, la fragilité et l’inconsistance. « Souffle » garde l’image et son caractère éphémère.
- source_word: כָּל אָדָם
  choice: tout être humain
  rationale: אָדָם a ici une portée collective et générique. « Tout être humain » communique clairement cette universalité en français moderne.
- source_word: סֶלָה
  choice: Pause
  rationale: Le terme liturgique סֶלָה a une fonction exacte incertaine, mais marque vraisemblablement une interruption ou transition musicale. « Pause » en donne prudemment la fonction probable.
theological_decisions:
- issue: Portée anthropologique de אִישׁ et אָדָם
  choice: « un homme » pour אִישׁ et « tout être humain » pour כָּל אָדָם
  alternative: « une personne » et « tout homme »
  rationale: Le premier syntagme conserve la forme masculine singulière de אִישׁ, tandis que le second rend explicitement la portée universelle de אָדָם. Cette distinction suit les sens contextuels sans restreindre l’affirmation finale aux seuls hommes de sexe masculin.
- issue: Nature de la fragilité humaine exprimée par הֶבֶל
  choice: « un souffle »
  alternative: « vanité » ou « vapeur »
  rationale: Le choix maintient l’image concrète d’une réalité fugitive sans réduire le terme à une condamnation morale ni préciser excessivement en quoi consiste l’inconsistance humaine.
- issue: Agent et objet dans l’image de la teigne
  choice: Dieu, comparé à la teigne, fait dépérir ce que l’homme a de précieux
  alternative: Les biens précieux de l’homme dépérissent eux-mêmes comme sous l’action d’une teigne
  rationale: La deuxième personne du verbe וַתֶּמֶס maintient Dieu comme sujet. La comparaison peut néanmoins porter sur la manière dont le bien précieux disparaît ; la note signale cette latitude syntaxique.
translation_notes:
  register: Français international actuel, sobre et poétique. Le tutoiement correspond à l’adresse directe à Dieu. Le parallélisme est conservé sur trois lignes ; « teigne » rend l’image ancienne en français idiomatique, et « Pause » traduit prudemment la fonction probable de סֶלָה sans prétendre en fixer le sens exact.
