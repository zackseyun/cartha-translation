lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est clair, naturel et adapté au contexte cultuel et musical.
- source_word: לִידוּתוּן
  choice: selon Yedoutoun
  rationale: La préposition ל peut exprimer diverses formes de rapport ou de destination. « Selon » laisse ouverte l’idée d’une manière d’exécuter, d’une tradition musicale ou d’une association avec Yedoutoun, sans imposer une interprétation certaine.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Équivalent français traditionnel et naturel du terme désignant ici une composition musicale.
- source_word: לְדָוִד
  choice: de David
  rationale: La tournure « de David » préserve mieux que « par David » la largeur sémantique de la préposition, qui peut signaler l’auteur, l’appartenance, la dédicace ou une autre association.
