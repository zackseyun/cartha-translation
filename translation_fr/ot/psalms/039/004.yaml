source:
  edition: WLC
  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: fr
  text: Fais-moi connaître, Yahweh, ma fin et quelle est la mesure de mes jours, afin que je sache combien je suis éphémère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « combien je suis fragile » ou « combien je suis passager ». L’expression hébraïque est concise et peut souligner la fragilité humaine ou la brièveté de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: Fais-moi connaître
  rationale: L’impératif hifil de ידע avec suffixe de première personne a une valeur causative. « Fais-moi connaître » en conserve la force tout en restant naturel en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: קִצִּי
  choice: ma fin
  rationale: קֵץ désigne couramment une fin ou une limite. Ici, « ma fin » exprime sans surinterprétation le terme de la vie du psalmiste.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: et quelle est la mesure de mes jours
  rationale: Cette formulation conserve l’image concrète de la « mesure » et rend naturellement la construction interrogative hébraïque.
- source_word: אֵדְעָה
  choice: afin que je sache
  rationale: Le cohortatif exprime ici le but ou le résultat souhaité à la suite de la demande précédente.
- source_word: מֶה חָדֵל אָֽנִי
  choice: combien je suis éphémère
  rationale: L’expression concise et difficile évoque, dans le contexte, la brièveté ou la fragilité de l’existence humaine. « Éphémère » conserve l’accent sur le caractère passager de la vie.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Sens de מֶה חָדֵל אָֽנִי
  choice: combien je suis éphémère
  alternative: combien je suis fragile
  rationale: Le contexte immédiat médite sur la mesure et la brièveté des jours, mais l’hébreu peut aussi souligner la fragilité humaine; cette autre nuance est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le parallélisme et l’image de la « mesure » tout en employant une formulation immédiatement compréhensible.
