id: PSA.39.6
reference: Psalms 39:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ בְּ/צֶ֤לֶם יִֽתְהַלֶּךְ אִ֗ישׁ אַךְ הֶ֥בֶל יֶהֱמָי֑וּ/ן יִ֝צְבֹּ֗ר וְֽ/לֹא יֵדַ֥ע מִי אֹסְפָֽ/ם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: fr
  text: Certes, l’homme va et vient comme une ombre[a] ; certes, c’est en vain qu’ils s’agitent[b]. Il amasse des richesses et ne sait pas qui les recueillera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une image », « comme une simple apparence » ou « comme un fantôme ». Le mot hébreu signifie littéralement « image » et évoque ici une existence humaine sans consistance.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte littéralement un verbe au pluriel : « ils s’agitent ». Ce pluriel semble élargir à l’humanité en général le propos formulé d’abord au singulier avec « l’homme ».'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Littéralement « qui les recueillera » : le pronom renvoie aux biens qu’il a accumulés.'
    reason: implicit_referent
lexical_decisions:
- source_word: אַךְ
  choice: certes
  rationale: La particule, répétée dans le verset, souligne avec force le constat du psalmiste. « Certes » en conserve l’insistance et la répétition poétique.
- source_word: בְּצֶלֶם
  choice: comme une ombre
  rationale: צֶלֶם signifie littéralement « image », mais évoque ici une existence sans consistance. « Comme une ombre » rend naturellement cette image de fragilité, tandis qu’une note conserve le sens lexical premier et les autres possibilités.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: l’homme va et vient
  rationale: La forme réfléchie de הלך exprime le fait de circuler ou de se déplacer. « Va et vient » est idiomatique et garde la portée générique du masculin singulier אִישׁ.
- source_word: הֶבֶל
  choice: en vain
  rationale: Dans cette proposition, הֶבֶל qualifie l’agitation comme futile. La locution adverbiale « en vain » convient à la syntaxe française tout en préservant l’idée de vacuité.
- source_word: יֶהֱמָיוּן
  choice: ils s’agitent
  rationale: Le verbe המה évoque l’agitation, le tumulte ou le vacarme. Le pluriel hébreu est conservé malgré le singulier générique qui précède, et cette difficulté est signalée en note.
- source_word: יִצְבֹּר
  choice: il amasse des richesses
  rationale: צבר signifie entasser ou accumuler. L’objet, implicite en hébreu, est explicité par « des richesses » d’après la proposition suivante.
- source_word: וְלֹא יֵדַע
  choice: et ne sait pas
  rationale: Cette formulation reproduit simplement la coordination et la négation de l’hébreu.
- source_word: מִי אֹסְפָם
  choice: qui les recueillera
  rationale: Le suffixe objet est au pluriel et renvoie aux biens accumulés. « Les » préserve ici explicitement ce nombre.
theological_decisions:
- issue: Masculin représentatif dans אִישׁ
  choice: l’homme
  alternative: une personne
  rationale: 'Le masculin singulier de l’hébreu est conservé sans restreindre le propos à un individu particulier : le verset présente la condition humaine sous la figure générique de « l’homme ».'
- issue: Passage du singulier au pluriel
  choice: l’homme… ils s’agitent
  alternative: l’homme… il s’agite
  rationale: Le texte hébreu passe réellement du nom singulier אִישׁ au verbe pluriel יֶהֱמָיוּן. La traduction garde cette tension grammaticale plutôt que de l’harmoniser silencieusement.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est soutenu par la répétition de « certes ». Le passage abrupt du singulier au pluriel est maintenu et expliqué, tandis que les objets implicites sont explicités avec retenue.
