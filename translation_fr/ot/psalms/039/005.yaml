source:
  edition: WLC
  text: הִנֵּ֤ה טְפָח֨וֹת נָ֘תַ֤תָּה יָמַ֗/י וְ/חֶלְדִּ֣/י כְ/אַ֣יִן נֶגְדֶּ֑/ךָ אַ֥ךְ כָּֽל הֶ֥בֶל כָּל אָ֝דָ֗ם נִצָּ֥ב סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: fr
  text: 'Voici, tu as fixé mes jours à quelques largeurs de main,

    et la durée de ma vie est comme un rien devant toi.

    Oui, tout être humain[a], même solidement établi[b],

    n’est qu’un souffle[c]. Sélah[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici le singulier générique « אדם », qui désigne chaque être humain ou l’humanité entière.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « même quand il se tient debout » ou « même établi » ; le terme peut évoquer une personne qui paraît stable et en sécurité.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « une vapeur », « une simple haleine » ou « vanité » ; le mot hébreu évoque ce qui est fugitif et inconsistant.'
    reason: lexical_alternative
  - marker: d
    text: Terme hébreu probablement liturgique ou musical, dont le sens précis est incertain.
    reason: textual_clarity
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque avec dignité l’attention et l’insistance poétiques, sans l’allure trop familière de « regarde ».
- source_word: טְפָחוֹת
  choice: quelques largeurs de main
  rationale: Conserve l’image concrète d’une très petite mesure, employée ici pour exprimer la brièveté des jours.
- source_word: נָתַתָּה
  choice: tu as fait de
  rationale: Dans cette construction, le verbe présente Dieu comme celui qui a déterminé la faible mesure des jours du psalmiste.
- source_word: יָמַי
  choice: mes jours
  rationale: Reproduit l’expression hébraïque courante désignant la durée de la vie.
- source_word: וְחֶלְדִּי
  choice: la durée de ma vie
  rationale: Exprime clairement la période de vie dans ce monde et maintient le parallèle avec « mes jours ».
- source_word: כְאַיִן
  choice: comme un rien
  rationale: Préserve la comparaison et l’idée d’insignifiance presque totale devant Dieu.
- source_word: נֶגְדֶּךָ
  choice: devant toi
  rationale: Rend naturellement la situation en présence de Dieu et, implicitement, selon son appréciation.
- source_word: אַךְ
  choice: Oui
  rationale: Introduit avec force la conclusion générale du psalmiste dans un français poétique actuel.
- source_word: כָּל אָדָם
  choice: tout être humain
  rationale: Le singulier générique désigne ici chaque membre de l’humanité; cette formulation française rend l’inclusion sans restreindre le propos aux hommes de sexe masculin.
- source_word: נִצָּב
  choice: même solidement établi
  rationale: Le participe peut signifier debout, en place ou établi. La tournure concessive fait ressortir le contraste contextuel sans masquer l’ambiguïté, signalée en note.
- source_word: כָּל הֶבֶל
  choice: n’est qu’un souffle
  rationale: « Souffle » conserve l’image concrète de ce qui est fugitif et inconsistant; « ne… que » rend la force restrictive et totalisante de l’énoncé.
- source_word: סֶלָה
  choice: Sélah
  rationale: La translittération traditionnelle est conservée, car le sens précis de ce terme liturgique ou musical demeure incertain.
theological_decisions:
- issue: Portée de אָדָם dans l’affirmation générale
  choice: tout être humain
  alternative: tout homme
  rationale: אָדָם est ici un singulier générique portant sur l’humanité entière. En français moderne, « tout être humain » communique directement cette portée sans introduire de limitation sexuelle.
- issue: Valeur de נִצָּב
  choice: même solidement établi
  alternative: debout / en place
  rationale: Le contexte souligne que la sécurité humaine, même apparente, ne supprime pas la fragilité. La note maintient toutefois le sens plus littéral possible.
- issue: Image de הֶבֶל
  choice: souffle
  alternative: vapeur / vanité
  rationale: « Souffle » garde à la fois le caractère éphémère et l’insubstantialité de l’image, sans réduire le mot à une notion abstraite de futilité.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre « mes jours » et « la durée de ma vie » est conservé, ainsi que l’image corporelle des largeurs de main. Les notes rendent visibles les principales ambiguïtés lexicales sans alourdir le verset.
