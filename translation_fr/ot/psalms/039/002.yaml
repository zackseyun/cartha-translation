  source_fidelity: 'Le verset hébreu est globalement bien représenté : les deux premiers verbes expriment le mutisme et le fait de se taire, et וּכְאֵבִי נֶעְכָּר décrit une douleur intérieure remuée ou intensifiée. Toutefois, « s’est ravivée » suggère plus précisément le retour d’une douleur qui s’était apaisée, nuance qui n’est pas exprimée par נֶעְכָּר. La formulation « à l’égard du bien » rend mal la valeur séparative et elliptique de מִטּוֹב, même si elle tente à juste titre de ne pas trancher son sens.'
  naturalness: Le français est sobre et compréhensible. « Je suis resté muet dans le silence » conserve l’intensification volontaire du parallélisme hébreu et demeure recevable dans un registre poétique. « Je me suis tu loin du bien » ne serait pas idiomatique ; il vaut mieux maintenir une formulation française naturelle et signaler explicitement la difficulté dans la note.
  terminology: '« Muet », « silence » et « douleur » conviennent au registre du psaume. « S’est intensifiée » restitue mieux le mouvement de trouble ou d’accroissement associé à עכר sans introduire l’idée d’un retour. La note doit éviter de qualifier « loin du bien » de traduction littérale : c’est une explicitation française possible, non une équivalence littérale établie.'
