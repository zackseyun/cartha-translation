  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: fr
  text: Je suis resté muet dans le silence ; je me suis tu, même devant le bien[a], et ma douleur s’est intensifiée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu difficile : littéralement, « de bien ». Cette expression peut signifier qu’il s’est tu même au lieu de dire de bonnes paroles, ou qu’il s’est tenu à l’écart de ce qui est bon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Je suis resté muet
  rationale: Le nifal décrit le fait d’être ou de devenir muet, sans préciser clairement si ce silence est volontaire ou subi. Cette formulation conserve cette indétermination.
- source_word: דּוּמִיָּה
  choice: dans le silence
  rationale: Le nom désigne le silence ou l’immobilité silencieuse. La tournure prépositionnelle garde son rôle d’intensification tout en restant naturelle en français.
- source_word: הֶחֱשֵׁיתִי
  choice: je me suis tu
  rationale: Le hifil exprime ici le fait de garder le silence. Le verbe pronominal français distingue légèrement cette proposition de « je suis resté muet » et préserve le parallélisme.
- source_word: מִטּוֹב
  choice: à l’égard du bien
  rationale: La construction compacte avec מִן est difficile. Cette traduction conserve le lien entre le silence et « le bien » sans décider s’il s’agit de ne pas prononcer de bonnes paroles ou de se tenir à l’écart de ce qui est bon.
- source_word: וּכְאֵבִי
  choice: et ma douleur
  rationale: כְּאֵב peut désigner une douleur physique ou intérieure. « Douleur » maintient cette ampleur sémantique.
- source_word: נֶעְכָּר
  choice: s’est ravivée
  rationale: Le nifal de עכר évoque une douleur remuée, troublée ou intensifiée. « S’est ravivée » exprime naturellement en français son regain sous l’effet du silence.
theological_decisions:
- issue: Portée de מִטּוֹב
  choice: Ne pas expliciter dans le texte s’il s’agit de bonnes paroles ou du bien en général
  alternative: « même sans rien dire de bon » ou « loin de ce qui est bon »
  rationale: L’hébreu demeure compact et ambigu ; choisir une seule interprétation supprimerait une tension réelle du texte.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme hébreu entre mutisme et silence est maintenu, tandis que la difficulté de מִטּוֹב est signalée sans être résolue arbitrairement.
