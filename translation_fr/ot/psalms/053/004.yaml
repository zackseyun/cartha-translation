source:
  edition: WLC
  text: הֲ/לֹ֥א יָדְעוּ֮ פֹּ֤עֲלֵ֫י אָ֥וֶן אֹכְלֵ֣י עַ֭מִּ/י אָ֣כְלוּ לֶ֑חֶם אֱ֝לֹהִ֗ים לֹ֣א קָרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: fr
  text: Les artisans du mal[a] ne comprennent-ils donc pas, eux qui dévorent mon peuple[c] comme ils mangent du pain[b] ? Ils n’invoquent pas Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui font le mal ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ceux qui mangent mon peuple ; ils mangent du pain ». L’image suggère qu’ils s’en prennent au peuple avec autant de facilité qu’ils prennent une nourriture ordinaire.'
    reason: lexical_alternative
  - marker: c
    text: L’expression « mon peuple » peut être comprise soit comme une parole de Dieu, soit comme une parole du psalmiste ; ici, l’hébreu ne précise pas qui parle.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: ne comprennent-ils donc pas
  rationale: La particule הֲלֹא introduit une question rhétorique qui appelle une réponse affirmative. Dans ce contexte, « comprendre » exprime naturellement la prise de conscience morale impliquée par ידע, tandis que « donc » renforce sans excès la valeur rhétorique.
- source_word: פֹּעֲלֵי אָוֶן
  choice: les artisans du mal
  rationale: Cette expression conserve l’image de personnes qui produisent ou pratiquent activement le mal. « Artisans du mal » est à la fois imagé, digne et intelligible en français actuel.
- source_word: אֹכְלֵי עַמִּי
  choice: eux qui dévorent mon peuple
  rationale: « Dévorer » rend explicitement la métaphore prédatrice du verbe « manger » tout en restant idiomatique en français.
- source_word: אָכְלוּ לֶחֶם
  choice: comme ils mangent du pain
  rationale: L’hébreu juxtapose le fait de manger le peuple et celui de manger du pain. La tournure comparative exprime naturellement l’idée qu’ils s’en prennent au peuple avec la même facilité qu’ils prennent une nourriture ordinaire.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, la forme désigne le Dieu unique ; « Dieu » est la traduction française normale.
- source_word: לֹא קָרָאוּ
  choice: Ils n’invoquent pas
  rationale: Avec Dieu comme complément, קרא désigne ici l’action de faire appel à lui ou de l’invoquer. Le présent caractérise la conduite habituelle des méchants.
theological_decisions:
- issue: Identité du locuteur dans « mon peuple »
  choice: Conserver « mon peuple » sans préciser qui parle
  alternative: Comprendre cette expression soit comme une parole directe de Dieu, soit comme une parole du psalmiste au nom des fidèles
  rationale: Le suffixe hébreu est bien à la première personne du singulier, mais le vers ne désigne pas explicitement le locuteur. La traduction préserve donc cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde la question rhétorique, l’image forte de la dévoration et l’ambiguïté concernant le locuteur de « mon peuple ».
