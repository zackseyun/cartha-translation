source:
  edition: WLC
  text: כֻּלּ֥/וֹ סָג֮ יַחְדָּ֪ו נֶ֫אֱלָ֥חוּ אֵ֤ין עֹֽשֵׂה ט֑וֹב אֵ֝֗ין גַּם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/003.yaml
  text: All of them have turned aside; together they have become corrupt; there is none who does good[a], not even one.
translation:
  language: fr
  text: Tous se sont détournés ; ensemble, ils se sont corrompus[a]. Personne ne fait le bien, pas même un seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont souillés ». Le verbe hébreu peut évoquer le fait de devenir moralement impur ou dégradé.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלּוֹ
  choice: Tous
  rationale: Le terme désigne collectivement l’ensemble du groupe ; « Tous » restitue cette portée générale avec naturel en français.
- source_word: סָג
  choice: se sont détournés
  rationale: Le verbe exprime l’idée de s’écarter ou de dévier du bon chemin. Cette formulation conserve l’image morale sans la surinterpréter.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe souligne que le constat vaut collectivement pour tous.
- source_word: נֶאֱלָחוּ
  choice: se sont corrompus
  rationale: La forme verbale décrit le fait de devenir moralement souillé, altéré ou corrompu. « Se sont corrompus » exprime clairement ce sens éthique.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Personne ne fait le bien
  rationale: La négation existentielle suivie du participe nie l’existence de quiconque se caractériserait par l’accomplissement du bien. La tournure est naturelle et absolue en français.
- source_word: גַּם אֶחָד
  choice: pas même un seul
  rationale: Cette expression renforce la négation et en préserve l’insistance solennelle.
theological_decisions:
- issue: Portée de l’accusation de corruption humaine dans le psaume
  choice: 'Conserver la formulation universelle du verset : « Tous… Personne… pas même un seul. »'
  alternative: Limiter explicitement l’accusation à la seule catégorie immédiate des malfaiteurs évoqués dans le contexte.
  rationale: L’hébreu emploie des termes exhaustifs. La traduction maintient cette portée telle qu’elle est formulée, sans lui ajouter un système doctrinal qui dépasserait le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que la progression emphatique de « Tous » à « Personne », puis « pas même un seul ».
