  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: fr
  text: Au chef de chœur. Selon Mahalath[a]. Maskil[b] de David[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit peut-être du nom d’un air ou d’un terme musical ou liturgique ; le sens de « Mahalath » est incertain.
    reason: lexical_alternative
  - marker: b
    text: « Maskil » est un terme technique employé dans les titres des psaumes ; il désigne peut-être une composition didactique ou méditative.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu « de David » peut indiquer que David en est l’auteur, ou signaler une association, une dédicace ou l’appartenance à une collection liée à David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. Cette formulation française est claire, usuelle et évite un vocabulaire archaïque.
- source_word: עַל
  choice: Selon
  rationale: Dans ce contexte musical, la préposition peut introduire un air, un mode ou une indication d’exécution. « Selon » conserve cette ouverture sans préciser arbitrairement « sur l’air de ».
- source_word: מָחֲלַת
  choice: Mahalath
  rationale: Le référent demeure incertain et pourrait être le nom d’un air ou un terme musical ou liturgique. La translittération évite la traduction conjecturale « maladie ».
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Il s’agit d’un terme technique des titres de psaumes dont le sens exact est discuté. Le conserver sous forme translittérée évite de trancher entre une composition didactique, méditative ou savante.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance, l’association, la dédicace ou le rattachement à une collection. « De David » préserve naturellement cette ambiguïté en français.
theological_decisions:
- issue: Statut du titre et portée de l’attribution davidique
  choice: Traduire le titre comme partie du texte reçu et rendre לְדָוִד par « de David ».
  alternative: Rendre explicitement « par David » ou traiter le titre comme une indication éditoriale non traduite.
  rationale: Le texte hébreu transmis inclut ce titre. « De David » évite d’affirmer une conception plus précise de l’auteur que ne l’impose la construction hébraïque.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève respecte le caractère formulaire du titre hébreu. Les termes incertains sont translittérés et expliqués en note plutôt que résolus de manière conjecturale.
