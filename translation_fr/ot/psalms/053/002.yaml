id: PSA.53.2
reference: Psalms 53:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: fr
  text: Dieu, du haut des cieux, regarde les êtres humains pour voir s’il y en a un qui comprend, qui cherche Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que la forme hébraïque soit morphologiquement plurielle, elle désigne ici le Dieu unique et commande un sens singulier.
- source_word: מִשָּׁמַיִם
  choice: du haut des cieux
  rationale: Cette expression française naturelle conserve à la fois le pluriel hébreu et l’idée d’un regard porté depuis les hauteurs célestes.
- source_word: הִשְׁקִיף
  choice: regarde
  rationale: Le verbe évoque un regard dirigé depuis un point élevé. Le présent rend naturellement la scène poétique sans exclure la valeur accomplie de la forme hébraïque.
- source_word: בְּנֵי אָדָם
  choice: les êtres humains
  rationale: L’expression hébraïque, littéralement « les fils d’Adam/de l’homme », désigne collectivement l’humanité. « Les êtres humains » en restitue clairement la portée générique en français moderne.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: L’infinitif exprime le but du regard divin.
- source_word: הֲיֵשׁ
  choice: s’il y en a un
  rationale: La construction interrogative existentielle demande si une telle personne existe; cette formulation française est concise et idiomatique.
- source_word: מַשְׂכִּיל
  choice: qui comprend
  rationale: Le participe désigne quelqu’un qui fait preuve de discernement ou d’intelligence pratique; « comprend » préserve cette nuance sans la réduire à l’intelligence intellectuelle.
- source_word: דֹּרֵשׁ
  choice: qui cherche
  rationale: Le participe exprime une disposition active et continue à rechercher Dieu.
theological_decisions:
- issue: Portée de בְּנֵי אָדָם
  choice: les êtres humains
  alternative: les fils d’Adam
  rationale: Le contexte vise collectivement l’humanité. La formulation retenue rend cette portée sans réserver l’énoncé aux hommes de sexe masculin; la traduction plus littérale pourrait suggérer à tort une restriction ou une référence généalogique appuyée.
- issue: Nuance de מַשְׂכִּיל
  choice: qui comprend
  alternative: qui agit avec sagesse
  rationale: Le terme peut associer discernement et conduite avisée. Le contexte met en parallèle la compréhension et la recherche de Dieu; « comprend » conserve la formulation ouverte sans préciser excessivement si l’accent est cognitif ou pratique.
translation_notes:
  register: 'Français international moderne, sobre et poétique. La syntaxe conserve le mouvement du vers hébreu: regard de Dieu depuis les cieux, examen de l’humanité, puis double caractérisation de la personne recherchée.'
