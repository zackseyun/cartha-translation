source:
  edition: WLC
  text: מִ֥י יִתֵּ֣ן מִ/צִּיּוֹן֮ יְשֻׁע֪וֹת יִשְׂרָ֫אֵ֥ל בְּ/שׁ֣וּב אֱ֭לֹהִים שְׁב֣וּת עַמּ֑/וֹ יָגֵ֥ל יַ֝עֲקֹ֗ב יִשְׂמַ֥ח יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: fr
  text: Ah ! si le salut d’Israël venait de Sion ! Quand Dieu relèvera son peuple[a], Jacob exultera, Israël se réjouira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ramènera de captivité son peuple » ou « mettra fin à la captivité de son peuple ». L’expression hébraïque peut désigner plus généralement le rétablissement après une période de détresse, souvent avec l’idée d’un retour de captivité.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah ! si… venait
  rationale: Cette tournure hébraïque exprime ici un souhait ardent plutôt qu’une question littérale. « Ah ! si… » rend naturellement sa valeur optative en français.
- source_word: מִצִּיּוֹן
  choice: de Sion
  rationale: La préposition מִן indique la provenance. « De Sion » est la formulation française la plus naturelle.
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: le salut d’Israël
  rationale: Le pluriel morphologique יְשֻׁעוֹת peut avoir une valeur abstraite ou intensive. Le singulier « le salut » exprime naturellement la délivrance espérée pour Israël.
- source_word: בְּשׁוּב אֱלֹהִים
  choice: Quand Dieu rétablira
  rationale: La construction avec בְּ et l’infinitif marque la circonstance temporelle. Dans l’expression idiomatique qui suit, שוב évoque le rétablissement ou le renversement d’une situation pénible.
- source_word: שְׁבוּת עַמּוֹ
  choice: la situation de son peuple
  rationale: Dans la locution שׁוּב שְׁבוּת, le terme peut désigner le sort ou la condition d’un peuple et, selon le contexte, sa captivité. « Rétablir la situation » conserve le sens général de restauration sans imposer une captivité précise.
- source_word: יָגֵל
  choice: exultera
  rationale: Le verbe exprime une joie vive. « Exultera » maintient cette intensité et se distingue du verbe parallèle suivant.
- source_word: יִשְׂמַח
  choice: se réjouira
  rationale: Ce choix rend la joie exprimée par le second membre tout en préservant la variation lexicale du parallélisme poétique.
theological_decisions:
- issue: Sens de l’expression שׁוּב שְׁבוּת
  choice: rétablira la situation de son peuple
  alternative: ramènera les captifs de son peuple ; mettra fin à la captivité de son peuple
  rationale: L’expression peut évoquer concrètement le retour de captivité, mais elle désigne aussi plus largement le renversement du malheur et le rétablissement. Le texte principal retient le sens large et la note conserve les lectures plus littérales.
- issue: Valeur de יָגֵל et יִשְׂמַח
  choice: 'futurs : « exultera » et « se réjouira »'
  alternative: 'souhait : « que Jacob exulte, qu’Israël se réjouisse »'
  rationale: Après la proposition temporelle « Quand Dieu rétablira… », les deux imparfaits hébreux s’entendent naturellement comme les conséquences futures de cette restauration. Leur proximité avec le souhait initial permet aussi une nuance optative, qui n’est pas explicitement tranchée par la morphologie.
translation_notes:
  register: Français international moderne, digne et poétique. L’ouverture « Ah ! si… » rend le souhait ardent sans reproduire artificiellement l’interrogation idiomatique hébraïque. Le parallélisme entre Jacob et Israël est conservé, avec deux verbes de joie distincts.
