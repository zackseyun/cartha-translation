  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: fr
  text: Là, ils ont été saisis d’une grande peur[a], alors qu’il n’y avait rien à craindre, car Dieu a dispersé les os de celui qui campe contre toi[b]. tu les as couverts de honte[c], car Dieu les a rejetés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils ont craint une crainte ». L’hébreu emploie un verbe et un nom de même racine pour renforcer l’expression.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui campe autour de toi »; dans ce contexte hostile : « ton assiégeant ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu passe brusquement de « Dieu » à un verbe à la deuxième personne, puis revient à « Dieu ». L’identité précise du « tu » — Dieu, Sion ou le peuple — reste discutée; la traduction conserve ce changement sans le résoudre.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe situe brusquement la scène et conserve la force concise de l’hébreu.
- source_word: פָּחֲדוּ פַחַד
  choice: ils ont été saisis d’une grande peur
  rationale: La construction associant un verbe et un nom de même racine intensifie la peur. Cette formulation naturelle en français en rend l’emphase.
- source_word: לֹא הָיָה פַחַד
  choice: alors qu’il n’y avait rien à craindre
  rationale: La proposition nie l’existence d’un motif réel de peur. « Alors que » exprime naturellement le contraste sans déterminer plus précisément la relation logique.
- source_word: פִּזַּר עַצְמוֹת
  choice: a dispersé les os
  rationale: Le piel de פזר évoque une dispersion énergique; l’image concrète des os des ennemis vaincus est maintenue.
- source_word: חֹנָךְ
  choice: celui qui campe contre toi
  rationale: Le participe vient de חנה, « camper ». Le contexte hostile de défaite et d’ossements dispersés justifie « contre », tout en conservant l’image du campement plutôt qu’en la réduisant à « assiégeant ».
- source_word: הֱבִשֹׁתָה
  choice: Tu les as couverts de honte
  rationale: Le hiphil de בוש signifie faire éprouver la honte ou couvrir de honte. Le parfait à la deuxième personne est conservé plutôt que régularisé à la troisième personne.
- source_word: מְאָסָם
  choice: les a rejetés
  rationale: מאס exprime ici le rejet; « rejeter » garde la portée judiciaire ou relationnelle sans accentuer indûment l’idée de mépris.
theological_decisions:
- issue: Changement de personne et identité du « tu »
  choice: Conserver la deuxième personne dans « Tu les as couverts de honte » sans identifier explicitement l’interlocuteur.
  alternative: Régulariser à la troisième personne (« Dieu les a couverts de honte ») ou identifier le « tu » à Dieu, à Sion ou au peuple.
  rationale: Le texte massorétique passe de « Dieu » à un verbe à la deuxième personne, puis revient à « Dieu ». De plus, les formes de deuxième personne dans le verset ne permettent pas de lever simplement toute tension. La traduction préserve donc le changement abrupt et signale l’incertitude en note.
- issue: Valeur de חֹנָךְ
  choice: 'Lire le participe dans un sens hostile : « celui qui campe contre toi ».'
  alternative: « celui qui campe autour de toi » ou « ton assiégeant ».
  rationale: La dispersion des os et le rejet divin indiquent un camp ennemi. La formulation choisie garde néanmoins le sens lexical de « camper ».
translation_notes:
  register: Français international actuel, poétique et digne. Les expressions idiomatiques rendent l’intensité de l’hébreu tout en maintenant l’image des os dispersés et le changement abrupt de personne.
