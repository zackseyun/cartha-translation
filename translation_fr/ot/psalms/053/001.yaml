source:
  edition: WLC
  text: אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽ֝שְׁחִ֗יתוּ וְ/הִֽתְעִ֥יבוּ עָ֝֗וֶל אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/001.yaml
  text: The fool says in his heart[a], “There is no God.” They are corrupt; they commit abominable injustice; there is no one who does good.
translation:
  language: fr
  text: 'L’insensé dit dans son cœur : « Il n’y a pas de Dieu. » Ils sont corrompus ; ils commettent des injustices abominables[a] ; personne ne fait le bien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ont agi d’une manière abominable en commettant l’injustice », ou « ils ont rendu leurs actes abominables ». L’hébreu associe un verbe exprimant l’abomination à un nom signifiant « tort » ou « injustice ».
    reason: Variante lexicale et ambiguïté syntaxique de וְהִתְעִיבוּ עָוֶל.
lexical_decisions:
- source_word: נָבָל
  choice: l’insensé
  rationale: Le terme désigne moins un manque d’intelligence qu’une folie morale et impie. « L’insensé » garde cette portée éthique dans un français actuel et digne.
- source_word: בְּלִבּוֹ
  choice: dans son cœur
  rationale: Cette expression hébraïque renvoie à la pensée intérieure et à la disposition profonde. La formulation conserve l’image anthropologique du texte.
- source_word: אֵין אֱלֹהִים
  choice: Il n’y a pas de Dieu
  rationale: Cette traduction rend directement la négation existentielle formulée dans le cadre théologique d’Israël.
- source_word: הִשְׁחִיתוּ
  choice: Ils se sont corrompus
  rationale: Le verbe au pluriel décrit l’état moral résultant du groupe représenté par l’insensé. Le réfléchi est idiomatique en français sans effacer le passage du singulier au pluriel.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: ils ont commis des injustices abominables
  rationale: La formulation française associe le verbe exprimant ce qui est abominable au nom désignant le tort ou l’injustice, tout en restant naturelle. Une note signale la construction hébraïque inhabituelle.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: personne ne fait le bien
  rationale: Cette tournure française concise rend naturellement l’absence de toute personne faisant le bien exprimée par la construction participiale hébraïque.
theological_decisions:
- issue: Passage du singulier « l’insensé » aux verbes pluriels
  choice: 'Maintenir le singulier dans la première proposition, puis le pluriel : « Ils se sont corrompus… »'
  alternative: Uniformiser au singulier (« Il s’est corrompu… ») ou généraliser dès le début (« Les insensés disent… »).
  rationale: Le texte hébreu passe lui-même d’un représentant singulier à des verbes pluriels, élargissant ainsi le propos à la catégorie qu’il représente. La traduction conserve ce mouvement rhétorique.
- issue: Genre du représentant singulier
  choice: Conserver « son cœur » en référence au nom masculin singulier « l’insensé ».
  alternative: Employer une formulation neutralisée telle que « dans leur cœur » ou « intérieurement ».
  rationale: Le suffixe hébreu est masculin singulier et renvoie au représentant singulier. La formulation française respecte cette structure sans en étendre la portée au-delà du texte.
translation_notes:
  register: Français international moderne, clair et solennel. « L’insensé » conserve la portée morale du terme biblique ; la syntaxe garde le passage rhétorique du singulier au pluriel. Le marqueur de note est placé après l’expression qu’il explique.
