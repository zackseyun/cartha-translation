id: PSA.40.10
reference: Psalms 40:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: fr
  text: Je n’ai pas caché ta justice au fond de mon cœur[a] ; j’ai proclamé ta fidélité et ton salut[b]. Je n’ai pas dissimulé ton amour fidèle[c] ni ta vérité à la grande assemblée[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture ». Le mot hébreu peut désigner la qualité d’être juste ou l’action juste par laquelle Dieu intervient et rétablit.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta délivrance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ton amour lié à l’alliance ». Le terme hébreu exprime un amour loyal, constant et engagé.
    reason: lexical_alternative
  - marker: d
    text: Ou « devant la grande assemblée ». La construction hébraïque peut mettre l’accent soit sur le public auquel la proclamation s’adresse, soit sur ceux auxquels rien n’a été caché.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: ta justice
  rationale: צדקה peut désigner la justice morale de Dieu ou son action juste qui rétablit et délivre. « Justice » est naturel en français et garde cette amplitude contextuelle.
- source_word: כִסִּיתִי
  choice: je n’ai pas caché
  rationale: כסה signifie littéralement « couvrir » ; avec « au fond de mon cœur », « cacher » exprime clairement le fait de garder intérieurement sans proclamer.
- source_word: בְּתוֹךְ לִבִּי
  choice: au fond de mon cœur
  rationale: Cette formulation française naturelle conserve l’image hébraïque de quelque chose retenu dans l’intériorité.
- source_word: אֱמוּנָתְךָ
  choice: ta fidélité
  rationale: אֱמוּנָה désigne ici la fiabilité constante de Dieu plutôt que la croyance subjective.
- source_word: וּתְשׁוּעָתְךָ
  choice: et ton salut
  rationale: תשועה peut désigner le salut, la délivrance ou la victoire. « Salut » conserve sa portée large dans ce contexte.
- source_word: אָמָרְתִּי
  choice: j’ai proclamé
  rationale: Le verbe signifie littéralement « j’ai dit », mais les objets qui suivent et le cadre de l’assemblée indiquent une déclaration publique ; « proclamé » rend naturellement cette force.
- source_word: כִחַדְתִּי
  choice: je n’ai pas dissimulé
  rationale: כחד exprime l’action de cacher ou de retenir. « Dissimuler » maintient le parallèle avec כסה tout en évitant une répétition plate.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חסד associe amour, loyauté et constance, souvent dans un cadre d’alliance. « Amour fidèle » communique ces dimensions sans archaïsme.
- source_word: וַאֲמִתְּךָ
  choice: ni ta vérité
  rationale: אמת peut signifier vérité, fiabilité ou fidélité. « Vérité » maintient une distinction utile avec אֱמוּנָה, déjà rendu par « fidélité ».
- source_word: לְקָהָל רָב
  choice: à la grande assemblée
  rationale: Après un verbe de dissimulation, לְ peut désigner les personnes auxquelles rien n’a été caché ; « à la grande assemblée » s’accorde aussi naturellement avec l’idée de proclamation publique et préserve la souplesse de la construction.
theological_decisions:
- issue: Sens de צְדָקָה appliqué à Dieu
  choice: ta justice
  alternative: ta droiture
  rationale: « Justice » peut évoquer aussi bien la qualité morale de Dieu que son intervention juste, sans restreindre le terme à une notion abstraite.
- issue: Distinction entre אֱמוּנָה et אֱמֶת
  choice: « fidélité » pour אֱמוּנָה et « vérité » pour אֱמֶת
  alternative: Employer deux termes proches relevant tous deux de la fidélité ou de la fiabilité
  rationale: Le texte accumule des attributs apparentés sans les identifier entièrement. Deux rendus distincts préservent cette richesse poétique et théologique.
- issue: Valeur temporelle des formes accomplies
  choice: 'Passé composé : « je n’ai pas caché », « j’ai proclamé », « je n’ai pas dissimulé »'
  alternative: Passé simple ou présent
  rationale: Le passé composé rend en français moderne des actes accomplis présentés comme témoignage, sans imposer une nuance grammaticale plus précise que l’hébreu.
- issue: Rapport de לְקָהָל רָב avec les verbes du verset
  choice: « à la grande assemblée », pouvant se lire avec la proclamation et avec la non-dissimulation
  alternative: « loin de la grande assemblée » ou « devant la grande assemblée »
  rationale: La place finale du syntagme permet une portée sur la déclaration publique comme sur l’absence de dissimulation. La formulation choisie évite de trancher trop fortement ce rattachement.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébraïque est conservé par deux négations encadrant la proclamation centrale. « Au fond de mon cœur » est idiomatique sans effacer l’image du cœur comme intériorité. « Amour fidèle » évite à la fois l’archaïsme de « bienveillance » dans certains usages bibliques et une explicitation confessionnelle excessive.
