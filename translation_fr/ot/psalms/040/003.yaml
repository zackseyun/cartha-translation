  text: וַ/יִּתֵּ֬ן בְּ/פִ֨/י שִׁ֥יר חָדָשׁ֮ תְּהִלָּ֪ה לֵֽ/אלֹ֫הֵ֥י/נוּ יִרְא֣וּ רַבִּ֣ים וְ/יִירָ֑אוּ וְ֝/יִבְטְח֗וּ בַּ/יהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: fr
  text: Il a mis dans ma bouche un chant nouveau, un chant de louange pour notre Dieu. Beaucoup verront, éprouveront de la crainte[a] et mettront leur confiance en Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront saisis de respect ». Le verbe hébreu peut exprimer la peur, la crainte révérencielle ou l’émerveillement.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH », le nom propre du Dieu d’Israël, rendu ici par « Yahweh ».'
    reason: divine_name
lexical_decisions:
- source_word: וַיִּתֵּן בְּפִי
  choice: Il a mis dans ma bouche
  rationale: Dans cette construction, נתן signifie littéralement « donner », mais « mettre dans la bouche » rend naturellement l’expression hébraïque tout en conservant son image concrète.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Rendu direct et idiomatique de l’expression hébraïque; « chant » convient au registre poétique et cultuel.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: un chant de louange pour notre Dieu
  rationale: תְּהִלָּה est en apposition à « un chant nouveau » et en précise la nature. La répétition de « chant » explicite naturellement ce rapport en français.
- source_word: יִרְאוּ רַבִּים
  choice: Beaucoup le verront
  rationale: L’imparfait hébreu a ici une valeur prospective. Le pronom « le » reprend naturellement l’acte divin manifesté par la délivrance et le chant, sans alourdir la phrase.
- source_word: וְיִירָאוּ
  choice: éprouveront de la crainte
  rationale: Le verbe ירא peut exprimer la peur, la crainte révérencielle ou l’émerveillement. « Éprouver de la crainte » préserve cette tension mieux que le seul verbe français « craindre », qui appellerait souvent un complément.
- source_word: וְיִבְטְחוּ בַּיהוָה
  choice: mettront leur confiance en Yahweh
  rationale: 'Cette formulation française rend clairement בטח avec la préposition ב et maintient le mouvement résultatif de la séquence : voir, craindre, faire confiance.'
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le caractère de nom propre de l’alliance sans le remplacer par un titre.
- issue: Nuance de וְיִירָאוּ
  choice: éprouveront de la crainte
  alternative: seront saisis de respect
  rationale: Le choix principal conserve l’éventail de sens entre peur et révérence, ainsi que la tension théologique du texte, tandis que l’alternative résout davantage le terme dans un sens révérenciel.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme verbal est conservé, ainsi que l’image concrète du chant placé dans la bouche. La formulation évite d’atténuer la polysémie théologique de ירא.
