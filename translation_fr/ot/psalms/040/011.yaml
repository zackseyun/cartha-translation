  variant: modern international French
source:
  edition: WLC
  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: fr
  text: Toi, Yahweh, tu ne me priveras pas de ta compassion[b] ; ton amour fidèle et ta fidélité[a] me préserveront sans cesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta vérité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne me prive pas de ta compassion », si l’on comprend le verbe comme une supplication plutôt que comme une affirmation confiante.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel présent dans le texte hébreu, conformément à l’usage du projet.
- source_word: תִכְלָא
  choice: tu ne me refuseras pas
  rationale: Le verbe כלא exprime ici l’idée de retenir ou de ne pas accorder. Le futur français rend naturellement l’imparfait hébreu compris comme une affirmation confiante, tout en laissant l’interprétation exhortative en note.
- source_word: רַחֲמֶיךָ
  choice: ta compassion
  rationale: Le pluriel hébreu désigne les manifestations de la profonde compassion divine ; le singulier collectif est plus idiomatique en français moderne.
- source_word: מִמֶּנִּי
  choice: me
  rationale: Le complément hébreu « de moi » est intégré à la construction française idiomatique « me refuser ».
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: Cette expression rend à la fois la bonté aimante, la constance et la loyauté relationnelle de חֶסֶד, sans introduire un vocabulaire confessionnel technique.
- source_word: אֲמִתְּךָ
  choice: ta fidélité
  rationale: En parallèle avec חֶסֶד et comme sujet d’une action protectrice, אֱמֶת désigne naturellement ici la fiabilité ou la fidélité de Dieu ; « vérité » demeure possible et figure en note.
- source_word: תָּמִיד
  choice: sans cesse
  rationale: Locution française courante qui conserve l’idée de continuité.
- source_word: יִצְּרוּנִי
  choice: me préserveront
  rationale: Le verbe נצר signifie garder, protéger ou préserver. Le pluriel français correspond aux deux sujets coordonnés, l’amour fidèle et la fidélité.
theological_decisions:
- issue: 'Valeur de תִכְלָא : affirmation confiante ou prière'
  choice: 'affirmation confiante au futur : « tu ne me refuseras pas »'
  alternative: 'requête : « ne me refuse pas »'
  rationale: La forme est un inaccompli de deuxième personne masculine singulière, ce qui permet une affirmation tournée vers l’avenir. Dans ce contexte de prière, une nuance volitive reste toutefois possible et est explicitement conservée en note.
- issue: Sens de אֱמֶת dans le parallélisme avec חֶסֶד
  choice: fidélité
  alternative: vérité
  rationale: L’action de préserver le psalmiste met en avant la fiabilité constante de Dieu, mais le sens lexical « vérité » reste authentique et n’est pas écarté.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse disloquée « Toi, Yahweh » conserve l’emphase initiale de l’hébreu. Le parallélisme poétique et la tension entre confiance et supplication sont maintenus.
