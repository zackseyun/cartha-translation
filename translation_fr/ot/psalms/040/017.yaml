id: PSA.40.17
reference: Psalms 40:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: fr
  text: Mais moi, je suis pauvre et démuni ; le Seigneur pense à moi[a]. Tu es mon secours et mon libérateur ; mon Dieu, ne tarde pas !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Seigneur a égard à moi » ou « le Seigneur pensera à moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi, je
  rationale: La conjonction et le pronom indépendant marquent ici le contraste avec le contexte précédent ; cette tournure le rend naturellement en français tout en conservant l’insistance sur le psalmiste.
- source_word: עָנִי
  choice: pauvre
  rationale: En parallèle avec אֶבְיוֹן, le terme décrit une condition humble et affligée ; « pauvre » en donne le sens direct sans effacer la détresse impliquée.
- source_word: וְאֶבְיוֹן
  choice: et démuni
  rationale: « Démuni » distingue ce terme de עָנִי tout en conservant l’idée de besoin et de manque de ressources.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, et non du tétragramme ; « le Seigneur » est sa traduction française naturelle.
- source_word: יַחֲשָׁב לִי
  choice: pense à moi
  rationale: חשב avec ל peut exprimer la pensée, la considération ou l’attention portée à quelqu’un. « Pense à moi » préserve le caractère personnel et la relative indétermination de l’expression.
- source_word: עֶזְרָתִי
  choice: mon secours
  rationale: Le nom désigne l’aide ou le secours. « Mon secours » conserve la formulation nominale et le parallélisme poétique.
- source_word: וּמְפַלְטִי
  choice: et mon libérateur
  rationale: Le participe substantivé désigne celui qui délivre ou met en sécurité ; « libérateur » en garde la force verbale dans un registre digne et actuel.
- source_word: אַתָּה
  choice: Tu es
  rationale: Le pronom hébreu est explicite et emphatique ; le français demande ici l’ajout de la copule.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe possessif marque l’adresse personnelle ; « mon Dieu » restitue directement le vocatif sans ajouter d’interjection.
- source_word: אַל תְּאַחַר
  choice: ne tarde pas
  rationale: La défense exprime une demande urgente d’intervention rapide ; cette formulation est concise et naturelle en français moderne.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur ; mon Seigneur
  rationale: Le texte porte אֲדֹנָי, titre divin signifiant « Seigneur », et non יהוה. La traduction choisie maintient cette distinction.
- issue: Sens de יַחֲשָׁב לִי
  choice: le Seigneur pense à moi
  alternative: le Seigneur a égard à moi ; le Seigneur pensera à moi
  rationale: L’expression peut évoquer la pensée, la considération ou l’attention. Le texte principal conserve son caractère personnel sans préciser indûment le temps ni transformer la pensée en projet providentiel ; la note préserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme bref de la prière et son urgence sont conservés ; le point d’exclamation final rend l’intensité de la supplication sans ajouter de contenu.
