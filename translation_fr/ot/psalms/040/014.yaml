base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/014.yaml
  text: Let those who seek to sweep away my life be put to shame and humiliated together[c][b][a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: fr
  text: Qu’ils soient ensemble couverts de honte et d’humiliation, ceux qui cherchent à m’ôter la vie[a] ! Qu’ils reculent et soient déshonorés, ceux qui prennent plaisir à mon malheur !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ceux qui cherchent ma vie pour la faire disparaître » ; le verbe hébreu peut aussi être traduit par « la détruire » ou « l’anéantir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ וְיַחְפְּרוּ יַחַד
  choice: qu’ils soient tous couverts de honte et d’humiliation
  rationale: Les deux verbes expriment des nuances parallèles de honte et d’abaissement. « Tous » rend naturellement יַחַד dans ce contexte collectif, sans imposer l’idée d’un lieu commun.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ceux qui cherchent à m’ôter la vie
  rationale: נֶפֶשׁ désigne ici la vie ou la personne du psalmiste, et non une âme immatérielle séparée. En contexte hostile, la locution française exprime clairement une intention meurtrière.
- source_word: לִסְפּוֹתָהּ
  choice: à m’ôter la vie
  rationale: Le verbe peut signifier faire disparaître, supprimer ou détruire. La traduction française intègre idiomatiquement le suffixe féminin qui reprend נַפְשִׁי.
- source_word: יִסֹּגוּ אָחוֹר
  choice: qu’ils reculent
  rationale: L’expression hébraïque décrit un mouvement de retrait ou un revers. « Reculer » est concis et naturel en français.
- source_word: וְיִכָּלְמוּ
  choice: et soient déshonorés
  rationale: Le verbe exprime l’opprobre ou la disgrâce et maintient le parallélisme avec les termes de honte du premier membre.
- source_word: חֲפֵצֵי רָעָתִי
  choice: ceux qui prennent plaisir à mon malheur
  rationale: חפץ peut exprimer le plaisir aussi bien que le désir, tandis que רעה désigne ici le mal subi, le malheur ou le tort, plutôt qu’une faute morale du psalmiste.
theological_decisions:
- issue: Force des formes verbales imprécatoires
  choice: Rendre les verbes par « qu’ils soient… / qu’ils reculent… »
  alternative: Les traduire comme de simples futurs déclaratifs
  rationale: Dans le contexte de la prière, ces formes expriment un souhait ou une demande de jugement. Le subjonctif français préserve cette force sans transformer le verset en prédiction catégorique.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé en deux exclamations équilibrées. « M’ôter la vie » privilégie une formulation française naturelle tout en signalant en note l’image et l’ambiguïté lexicales de l’hébreu.
