  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: fr
  text: 'Alors j’ai dit : « Me voici, je suis venu[b] ; dans le rouleau du livre, il est écrit à mon sujet[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour moi » ou « ce qui m’est prescrit ». L’expression hébraïque peut désigner ce qui est écrit au sujet du locuteur ou ce qui est fixé pour lui.
    reason: alternative_reading
  - marker: b
    text: Cité en Hébreux 10.7 en rapport avec le Messie.
    reason: cross_reference
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel et séquentiel qui introduit la réponse du locuteur dans le contexte précédent.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: Rend simplement le parfait à la première personne et introduit naturellement le discours direct.
- source_word: הִנֵּה
  choice: Me voici
  rationale: Dans cette déclaration de présence et de disponibilité, « Me voici » restitue naturellement en français la force déictique et emphatique de הִנֵּה.
- source_word: בָאתִי
  choice: je viens
  rationale: Le parfait exprime ici l’arrivée ou la présentation du locuteur ; le présent français convient à la formule directe « Me voici, je viens ».
- source_word: בִּמְגִלַּת סֵפֶר
  choice: dans le rouleau du livre
  rationale: Conserve l’image concrète du rouleau et la relation du groupe construit hébreu, sans réduire l’expression au seul mot « livre ».
- source_word: כָּתוּב
  choice: il est écrit
  rationale: Le participe passif a ici une valeur prédicative, rendue idiomatiquement par « il est écrit ».
- source_word: עָלָי
  choice: à mon sujet
  rationale: Exprime le sens naturel de ce qui est écrit concernant le locuteur, tout en laissant les autres nuances possibles à la note.
theological_decisions:
- issue: Sens de עָלָי dans un verset repris en Hébreux 10.7
  choice: à mon sujet
  alternative: pour moi ; ce qui m’est prescrit
  rationale: Le texte principal conserve le sens direct « concernant moi » sans y importer d’emblée la lecture christologique ultérieure. La note signale l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. « Me voici, je viens » est plus naturel que le calque « Voici, je suis venu » tout en gardant l’emphase et l’idée de présentation du locuteur. Le marqueur [a] figure dans le texte principal.
