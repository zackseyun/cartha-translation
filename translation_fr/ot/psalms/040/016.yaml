  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: fr
  text: 'Que tous ceux qui te cherchent se réjouissent et soient dans l’allégresse en toi ! Que ceux qui aiment ton salut disent sans cesse : « Que Yahweh soit reconnu comme grand ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que Yahweh soit grand ! » Cette acclamation exprime le souhait que sa grandeur soit reconnue ouvertement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: trouvent en toi leur joie et leur allégresse
  rationale: Les deux imparfaits ont ici une valeur de souhait. Cette formulation française naturelle maintient le binôme poétique et rattache clairement בְּךָ à la joie éprouvée en Dieu.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: tous ceux qui te cherchent
  rationale: Le participe désigne les personnes caractérisées par leur recherche de Dieu ; cette tournure est fidèle et idiomatique.
- source_word: יֹאמְרוּ תָמִיד
  choice: disent sans cesse
  rationale: L’imparfait accompagné de תָמִיד exprime une parole répétée ou continuelle ; « sans cesse » est courant et conserve cette force.
- source_word: יִגְדַּל יְהוָה
  choice: Que Yahweh soit reconnu comme grand !
  rationale: La forme verbale a une valeur jussive. En français, cette acclamation rend le souhait que la grandeur de Yahweh soit publiquement reconnue, sans transformer la phrase en simple affirmation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: ceux qui aiment ton salut
  rationale: Le participe substantivé désigne ceux qui aiment l’œuvre salvatrice de Dieu. « Salut » conserve la portée large du terme, qui peut aussi évoquer une délivrance concrète.
theological_decisions:
- issue: Valeur de תְּשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: Le mot peut désigner aussi bien une délivrance concrète qu’un salut de portée plus large. « Salut » préserve ici cette ampleur théologique sans exclure le secours immédiat.
- issue: Forme de l’acclamation יִגְדַּל יְהוָה
  choice: Que Yahweh soit reconnu comme grand !
  alternative: Que Yahweh soit exalté !
  rationale: Le choix retenu conserve la valeur de souhait et explicite sobrement l’idée d’une grandeur reconnue ; « exalté » pourrait suggérer plus directement l’élévation ou la louange.
translation_notes:
  register: Français moderne, accessible et digne, avec une cadence poétique. Le parallélisme hébreu est conservé sans employer des formulations trop littérales ou archaïques.
