source:
  edition: WLC
  text: רַבּ֤וֹת עָשִׂ֨יתָ אַתָּ֤ה יְהוָ֣ה אֱלֹהַ/י֮ נִֽפְלְאֹתֶ֥י/ךָ וּ/מַחְשְׁבֹתֶ֗י/ךָ אֵ֫לֵ֥י/נוּ אֵ֤ין עֲרֹ֬ךְ אֵלֶ֗י/ךָ אַגִּ֥ידָה וַ/אֲדַבֵּ֑רָה עָ֝צְמ֗וּ מִ/סַּפֵּֽר׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: fr
  text: 'Tu as accompli tant de choses, Yahweh, mon Dieu : tes merveilles et tes projets[a] pour nous ! Nul ne t’est comparable. Je voudrais les proclamer et en parler, mais ils sont trop nombreux pour être dénombrés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes pensées à notre égard ».'
    reason: Alternative lexicale authentique pour מַחְשְׁבוֹת אֵלֵינוּ.
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: Tu as accompli tant de choses
  rationale: Le pluriel רַבּוֹת exprime ici l’abondance des actes de Dieu. « Tant de choses » explicite naturellement l’objet sous-entendu, tandis que le passé composé rend l’accompli hébreu et la portée présente de ces actes.
- source_word: יְהוָה אֱלֹהַי
  choice: Yahweh, mon Dieu
  rationale: Le nom divin est translittéré, et le possessif personnel de אֱלֹהַי est conservé.
- source_word: נִפְלְאֹתֶיךָ
  choice: tes merveilles
  rationale: Le nom désigne les actes extraordinaires de Dieu ; « merveilles » en garde la forme nominale concise.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: et tes projets pour nous
  rationale: מַחְשָׁבוֹת peut désigner des pensées, des intentions ou des projets. Dans ce contexte d’actes divins, « projets » exprime l’orientation intentionnelle sans préciser un système doctrinal ; l’autre sens majeur est signalé en note.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Nul ne t’est comparable
  rationale: Cette tournure rend l’idiome d’incomparabilité de manière naturelle et digne, sans limiter explicitement le domaine de la comparaison.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Je voudrais les proclamer et en parler
  rationale: Les cohortatifs expriment l’élan du psalmiste. Le conditionnel français suggère une intention confrontée à l’impossibilité énoncée ensuite, sans ajouter une proposition conditionnelle explicite absente de l’hébreu.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: elles sont trop nombreuses pour être dénombrées
  rationale: Dans ce contexte, עָצְמוּ indique une quantité considérable, et מִסַּפֵּר marque ce qui dépasse toute possibilité de comptage. « Dénombrées » conserve précisément cette image.
theological_decisions:
- issue: Portée des מַחְשְׁבוֹת de Dieu envers son peuple
  choice: « tes projets pour nous »
  alternative: « tes pensées à notre égard »
  rationale: Le texte affirme l’attention intentionnelle et bienveillante de Dieu sans définir une doctrine particulière de la providence ou de la prédestination. La note maintient l’ambiguïté lexicale réelle.
- issue: Objet de l’incomparabilité
  choice: « Nul ne t’est comparable »
  alternative: « Rien ne peut être comparé à toi »
  rationale: La formulation choisie rapporte naturellement l’incomparabilité à Dieu lui-même, comme le permet אֵלֶיךָ, sans préciser quelles créatures ou réalités sont envisagées.
translation_notes:
  register: Français international moderne, au tutoiement conformément à l’adresse directe du psaume. Le style reste poétique et digne, avec une syntaxe immédiatement compréhensible. Le point d’exclamation souligne l’émerveillement porté par l’ouverture רַבּוֹת.
