  yaml_path: translation/ot/psalms/040/001.yaml
  text: I waited patiently for Yahweh[a], and he turned to me and heard my cry for help.
translation:
  language: fr
  text: J’ai patiemment attendu Yahweh[a] ; il s’est tourné vers moi et a entendu mon appel au secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Attendre, j’ai attendu Yahweh ». Cette tournure hébraïque intensive peut exprimer une attente patiente ou soutenue.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: J’ai attendu […] avec persévérance
  rationale: L’infinitif absolu suivi du verbe conjugué renforce l’action. Cette formulation française naturelle exprime une attente soutenue sans réduire nécessairement le terme à la seule patience ni alourdir le texte par un calque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: וַיֵּט אֵלַי
  choice: il s’est tourné vers moi
  rationale: Le verbe נטה peut signifier « incliner », « tendre » ou « tourner ». Dans cette construction, il décrit Yahweh qui porte son attention vers le psalmiste ; « s’est tourné vers moi » est clair et naturel en français moderne.
- source_word: וַיִּשְׁמַע
  choice: a entendu
  rationale: שׁמע indique ici une écoute attentive de la supplication. « A entendu » conserve la formulation simple du texte tout en laissant le contexte suggérer la réponse divine.
- source_word: שַׁוְעָתִי
  choice: mon appel au secours
  rationale: שַׁוְעָה désigne un cri lancé pour obtenir de l’aide. « Appel au secours » en rend explicitement la détresse et la demande d’intervention.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. La translittération « Yahweh » préserve le caractère de nom propre sans lui substituer un titre, tout en évitant d’imposer une interprétation confessionnelle supplémentaire.
- issue: Portée de l’écoute divine
  choice: a entendu
  alternative: a exaucé
  rationale: Le verbe hébreu signifie littéralement « entendre » et peut, dans ce contexte, impliquer une réponse favorable. La traduction retient « a entendu » pour ne pas expliciter au-delà du verset ce que le contexte laisse entendre.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme bref de la phrase hébraïque est conservé ; l’expression emphatique initiale est rendue idiomatiquement et son relief formel est signalé en note.
