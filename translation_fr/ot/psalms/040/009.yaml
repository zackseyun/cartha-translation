source:
  edition: WLC
  text: בִּשַּׂ֤רְתִּי צֶ֨דֶק בְּ/קָ֘הָ֤ל רָ֗ב הִנֵּ֣ה שְׂ֭פָתַ/י לֹ֣א אֶכְלָ֑א יְ֝הוָ֗ה אַתָּ֥ה יָדָֽעְתָּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/009.yaml
  text: I have proclaimed righteousness in the great assembly[a]; behold, I have not restrained my lips; O Yahweh[b], you know.
translation:
  language: fr
  text: J’ai proclamé la justice[a] dans la grande assemblée ; voici, je n’ai pas gardé mes lèvres closes[b]. Yahweh, toi, tu le sais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture » ou « ce qui est juste ». Le mot hébreu צֶדֶק peut avoir une portée à la fois morale et judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « je ne me suis pas tu » ou « je n’ai pas retenu ma parole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: J’ai proclamé
  rationale: Le piel de בּשׂר exprime ici l’annonce publique d’une nouvelle. « Proclamé » conserve la dimension publique et solennelle sans imposer au verbe une formulation chrétienne ultérieure.
- source_word: צֶדֶק
  choice: la justice
  rationale: צֶדֶק peut désigner la justice, la droiture ou ce qui est juste. « Justice » convient naturellement comme objet de « proclamer » et garde ensemble les dimensions morale et judiciaire.
- source_word: בְּקָהָל רָב
  choice: dans la grande assemblée
  rationale: קָהָל désigne une assemblée réunie, et רָב souligne son importance ou sa taille. La formulation française préserve le cadre public et communautaire.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction d’appel à l’attention de הִנֵּה et son relief poétique.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: je n’ai pas retenu mes lèvres
  rationale: La traduction maintient l’image concrète des « lèvres » et rend כלה par l’idée de retenir ou d’empêcher, c’est-à-dire ne pas garder le silence.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit comme nom propre plutôt que remplacé par un titre.
- source_word: אַתָּה יָדָעְתָּ
  choice: toi, tu le sais
  rationale: Le pronom indépendant אַתָּה reçoit son accent naturel par « toi », tandis que le parfait יָדָעְתָּ exprime ici un savoir établi, rendu idiomatiquement au présent.
theological_decisions:
- issue: Portée de צֶדֶק
  choice: justice
  alternative: droiture
  rationale: Le terme hébreu garde une tension entre conformité morale et ordre juste. Le texte retient « justice » sans exclure « droiture », signalé en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Puisque l’hébreu emploie le tétragramme comme nom personnel dans l’adresse directe, la transcription préserve cette distinction au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe reste proche du parallélisme hébreu ; « voici » conserve l’appel à l’attention, et « toi » rend l’emphase explicite du pronom hébreu.
