  to: J’ai proclamé la justice[a] dans la grande assemblée ; voici, je n’ai pas gardé mes lèvres closes[b]. Yahweh, toi, tu le sais.
  rationale: La révision remplace une tournure calquée et peu idiomatique par « je n’ai pas gardé mes lèvres closes », qui conserve l’imagerie du texte hébreu tout en exprimant clairement le refus de se taire. La note b est mise en cohérence avec ce nouveau rendu.
