source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: fr
  text: Car des maux innombrables[a] m’ont cerné ; mes fautes[b] m’ont rattrapé, et je ne peux voir. Elles sont plus nombreuses que les cheveux de ma tête, et mon cœur m’abandonne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans nombre » ou « trop nombreux pour être comptés ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi être rendu par « mes péchés » ou « ma culpabilité » ; il peut englober à la fois les actes coupables et le poids de la culpabilité.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « mon cœur m’a abandonné ». L’expression peut évoquer une perte de force ou de courage.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la supplication dans le contexte et conserve la valeur explicative de la conjonction.
- source_word: אָפְפוּ עָלַי
  choice: m’ont cerné
  rationale: Rend l’image de maux qui entourent le psalmiste de toutes parts, dans un français actuel et expressif.
- source_word: רָעוֹת
  choice: des maux
  rationale: Le terme peut désigner des maux, des malheurs ou des calamités. « Maux » préserve sa portée générale sans la réduire à la seule détresse intérieure.
- source_word: עַד אֵין מִסְפָּר
  choice: innombrables
  rationale: Expression idiomatique de l’impossibilité de compter ; « innombrables » est concis, naturel et soutenu sans être archaïque.
- source_word: הִשִּׂיגוּנִי
  choice: m’ont rattrapé
  rationale: Conserve l’image de quelque chose qui rejoint le psalmiste et finit par l’atteindre.
- source_word: עֲוֹנֹתַי
  choice: mes fautes
  rationale: Le mot hébreu peut désigner les actes coupables aussi bien que la culpabilité qu’ils entraînent. « Fautes » garde ici la responsabilité morale personnelle sans imposer une interprétation exclusivement juridique.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: et je ne peux voir
  rationale: Suit sobrement l’hébreu sans préciser si l’incapacité de voir est physique, figurée ou due à l’accablement.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Elles sont plus nombreuses que les cheveux de ma tête
  rationale: Dans cette comparaison, le verbe exprime la supériorité numérique. Le féminin pluriel reprend naturellement « mes fautes », le référent immédiat.
- source_word: וְלִבִּי עֲזָבָנִי
  choice: et mon cœur m’abandonne
  rationale: Conserve la métaphore hébraïque sans la réduire explicitement à une perte de courage, de force ou de lucidité.
theological_decisions:
- issue: 'Le sens de עֲוֹנֹתַי : actes coupables personnels ou culpabilité et conséquences qui en découlent'
  choice: mes fautes
  alternative: ma culpabilité ; les conséquences de mes péchés
  rationale: Le possessif désigne le plus naturellement les fautes propres du psalmiste, mais le terme hébreu peut aussi inclure la culpabilité qu’elles font peser sur lui. La traduction maintient la tension entre les maux qui l’assaillent et sa responsabilité morale.
- issue: Le sens de l’incapacité à voir
  choice: je ne peux voir
  alternative: je n’y vois plus clair ; je ne peux les regarder en face
  rationale: L’hébreu ne précise ni la cause ni la nature de cette incapacité. La formulation retenue évite de résoudre cette ambiguïté sur le plan physique, psychologique ou moral.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme poétique est maintenu par deux propositions parallèles, tandis que les formulations littérales « je ne peux voir » et « mon cœur m’abandonne » préservent les ambiguïtés du texte hébreu.
