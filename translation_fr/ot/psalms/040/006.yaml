base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: fr
  text: Tu n’as voulu ni sacrifice ni offrande[a] ; tu m’as ouvert les oreilles[b] ; tu n’as demandé ni holocauste ni sacrifice pour le péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « offrande végétale ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu as creusé pour moi des oreilles », expression qui évoque probablement le fait de rendre capable d’écouter ou d’obéir. La Septante, suivie en Hébreux 10.5, porte : « tu m’as préparé un corps ».'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶבַח
  choice: sacrifice
  rationale: Terme français courant et exact pour désigner ici un sacrifice cultuel.
- source_word: מִנְחָה
  choice: offrande
  rationale: Rend naturellement le terme dans son parallélisme avec « sacrifice », tout en laissant en note son sens cultuel plus précis d’offrande végétale.
- source_word: חָפַצְתָּ
  choice: tu n’as voulu
  rationale: Expression française naturelle qui communique le désir ou le bon plaisir, sans surcharger la nuance affective.
- source_word: אָזְנַיִם
  choice: des oreilles
  rationale: Conserve le nom concret au duel employé dans le texte hébreu.
- source_word: כָּרִיתָ לִּי
  choice: tu as creusé pour moi
  rationale: Préserve l’image frappante du verbe כרה, « creuser », ainsi que la construction « pour moi », sans remplacer silencieusement l’expression hébraïque par son interprétation probable.
- source_word: עוֹלָה
  choice: holocauste
  rationale: Terme français établi pour le sacrifice entièrement brûlé.
- source_word: חֲטָאָה
  choice: sacrifice pour le péché
  rationale: Le contexte sacrificiel appelle le sens cultuel plutôt que le sens abstrait de « péché ».
- source_word: שָׁאָלְתָּ
  choice: tu n’as demandé
  rationale: Rend directement le verbe שאל et maintient le parallélisme avec « tu n’as voulu » sans introduire l’idée plus forte d’exigence.
theological_decisions:
- issue: Rapport entre l’hébreu « tu as creusé pour moi des oreilles » et la citation grecque reprise en Hébreux 10.5
  choice: Conserver dans le texte principal l’image propre au texte hébreu et signaler en note la lecture grecque.
  alternative: « tu m’as ouvert les oreilles » ; « tu m’as préparé un corps »
  rationale: Le psaume est traduit d’abord d’après le texte hébreu. La note rend néanmoins visibles le sens idiomatique probable et la forme transmise par la Septante puis citée dans le Nouveau Testament, sans harmoniser les textes.
translation_notes:
  register: 'Français international moderne, sobre et poétique. Le tour inhabituel « creusé pour moi des oreilles » est volontaire : il conserve l’image hébraïque, tandis que la note en explicite les lectures possibles. Les deux négations coordonnées par « ni… ni… » donnent au verset un rythme naturel sans effacer son parallélisme.'
