source:
  edition: WLC
  text: וַ/יַּעֲלֵ֤/נִי מִ/בּ֥וֹר שָׁאוֹן֮ מִ/טִּ֪יט הַ/יָּ֫וֵ֥ן וַ/יָּ֖קֶם עַל סֶ֥לַע רַגְלַ֗/י כּוֹנֵ֥ן אֲשֻׁרָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: fr
  text: Il m’a fait remonter de la fosse du tumulte[a], de la boue du bourbier ; il a posé mes pieds sur un roc, il a affermi mes pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la fosse du fracas » ou « de la fosse grondante » ; beaucoup de traductions comprennent plus librement « de la fosse de destruction » ou « du gouffre de désolation ».
    reason: Alternative lexicale pour שָׁאוֹן, qui désigne le bruit, le grondement ou le tumulte, mais peut être interprété ici comme une image de destruction.
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Il m’a fait remonter
  rationale: Le hiphil de עלה exprime ici le fait de faire monter ou de ramener vers le haut. « Fait remonter » conserve le mouvement ascendant de la délivrance sans l’abstraire.
- source_word: מִבּוֹר
  choice: de la fosse
  rationale: בּוֹר peut désigner une fosse, une citerne ou un trou servant de cachot. « Fosse » convient à l’image concrète du poème et reste naturel en français.
- source_word: שָׁאוֹן
  choice: tumultueuse
  rationale: שָׁאוֹן évoque d’abord le fracas, le grondement ou le tumulte. L’adjectif français rend naturellement la relation entre les deux noms hébreux, tandis que la note conserve les autres possibilités.
- source_word: מִטִּיט הַיָּוֵן
  choice: de la boue du bourbier
  rationale: טִיט désigne la boue ou l’argile humide, et יָוֵן un bourbier ou une fange. La formulation maintient l’intensification concrète de l’hébreu, même si la répétition sémantique est marquée.
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: il a posé mes pieds sur un roc
  rationale: Le hiphil de קום signifie faire tenir debout, placer ou établir. « Posé mes pieds » est idiomatique et préserve l’opposition entre l’instabilité du bourbier et la solidité du roc.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: il a affermi mes pas
  rationale: כון au polel exprime l’action de rendre ferme ou stable, et אֲשֻׁרָי désigne les pas. Cette tournure concise garde le parallélisme avec les pieds posés sur le roc.
theological_decisions:
- issue: Faut-il interpréter les images comme une délivrance spirituelle ou morale explicite ?
  choice: Conserver les images concrètes de la fosse, de la boue, des pieds, du roc et des pas.
  alternative: Paraphraser le verset comme une délivrance de la destruction ou de la détresse.
  rationale: L’hébreu présente une scène poétique concrète sans préciser la nature exacte de la délivrance. La traduction ne doit pas imposer une interprétation théologique plus étroite.
- issue: Sens de שָׁאוֹן dans l’expression בּוֹר שָׁאוֹן
  choice: « fosse tumultueuse » dans le texte principal.
  alternative: « fosse du fracas », « fosse grondante » ou, de manière plus interprétative, « fosse de destruction ».
  rationale: Le nom renvoie directement au bruit, au grondement ou au tumulte, mais son application exacte à la fosse demeure incertaine. Le texte principal garde cette tension et la note signale les autres lectures.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en deux mouvements conserve le parallélisme hébreu. « Roc » donne une tonalité poétique encore courante, tandis que le point-virgule distingue la remontée hors du danger de l’établissement sur un sol ferme.
