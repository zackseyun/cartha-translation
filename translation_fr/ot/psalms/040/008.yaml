id: PSA.40.8
reference: Psalms 40:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לַֽ/עֲשֽׂוֹת רְצוֹנְ/ךָ֣ אֱלֹהַ֣/י חָפָ֑צְתִּי וְ֝/ת֥וֹרָתְ/ךָ֗ בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: fr
  text: Mon Dieu, je prends plaisir à faire ta volonté, et ta loi[a] est au plus profond de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton enseignement ». Le mot hébreu torah peut désigner plus largement l’enseignement de Dieu, et pas seulement des prescriptions légales.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: à faire
  rationale: 'L’infinitif construit avec ל complète ici le verbe חפץ : le plaisir du psalmiste consiste à accomplir la volonté de Dieu. « Faire » est direct et naturel.'
- source_word: רְצוֹנְךָ
  choice: ta volonté
  rationale: Dans cette construction avec « faire », רָצוֹן désigne naturellement ce que Dieu veut, tout en gardant les nuances possibles de désir et de bon plaisir.
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: 'Le suffixe de première personne exprime l’adresse personnelle : « mon Dieu ».'
- source_word: חָפָצְתִּי
  choice: je prends plaisir
  rationale: חפץ peut exprimer le désir, le plaisir ou les délices. « Je prends plaisir » rend la joie volontaire et durable de faire la volonté divine, sans la réduire à un simple souhait.
- source_word: וְתוֹרָתְךָ
  choice: et ta loi
  rationale: תּוֹרָה peut désigner la loi aussi bien que l’enseignement. « Ta loi » conserve ici la portée scripturaire et celle de l’alliance; la note maintient la nuance plus large d’« enseignement ».
- source_word: בְּתוֹךְ מֵעָי
  choice: au plus profond de moi
  rationale: L’expression signifie littéralement « au milieu de mes entrailles ». Cette formulation française naturelle communique l’intériorité profonde sans introduire le terme hébreu différent qui correspondrait normalement au « cœur ».
theological_decisions:
- issue: Sens de תּוֹרָה dans un contexte de piété intérieure
  choice: loi
  alternative: enseignement
  rationale: « Loi » conserve les résonances de l’alliance et des Écritures présentes dans les Psaumes, tandis que la note signale que תּוֹרָה ne se limite pas à des prescriptions juridiques.
translation_notes:
  register: Français international moderne, simple et digne. L’adresse « Mon Dieu » est placée en tête pour conserver clairement sa fonction vocative. « Au plus profond de moi » rend l’image anthropologique des entrailles comme siège de la vie intérieure sans archaïsme ni surinterprétation.
