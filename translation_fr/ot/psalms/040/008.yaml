  source_fidelity: 'Le texte français rend fidèlement les éléments essentiels de l’hébreu : le plaisir de faire la volonté de Dieu, l’adresse personnelle « mon Dieu », et la Torah située dans l’intériorité du psalmiste. « Au plus profond de moi » transmet de façon idiomatique l’image de בְּתוֹךְ מֵעָי (« au milieu de mes entrailles / de mon être intérieur ») sans la réduire indûment au « cœur ». Le présent français « je prends plaisir » est une restitution naturelle et recevable du parfait hébreu dans l’énoncé poétique.'
