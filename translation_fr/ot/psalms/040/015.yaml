  text: יָ֭שֹׁמּוּ עַל עֵ֣קֶב בָּשְׁתָּ֑/ם הָ/אֹמְרִ֥ים לִ֝֗/י הֶ֘אָ֥ח הֶאָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/015.yaml
  text: Let those who say to me[a], “Aha[b], aha!” be appalled because of their shame.
translation:
  language: fr
  text: 'Que ceux qui me disent : « Ah ! ah ! »[c] soient atterrés[a] à cause de leur honte[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dévastés » ou « frappés de stupeur » ; le verbe hébreu peut exprimer la désolation aussi bien qu’une stupeur horrifiée.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « sur le talon de leur honte » ; l’expression indique ici la cause ou la conséquence.
    reason: lexical_alternative
  - marker: c
    text: Interjection exprimant une joie malveillante ou une moquerie triomphante.
    reason: cultural_clarification
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: qu’ils soient atterrés
  rationale: Le qal imperfectif de שׁמם peut évoquer aussi bien la dévastation que la stupeur horrifiée. « Être atterrés » rend naturellement en français cette idée de choc accablant sans réduire le terme à la seule surprise.
- source_word: עַל עֵקֶב
  choice: à cause de
  rationale: Cette expression, littéralement liée à l’idée de « talon » ou de « suite », marque ici la cause ou la conséquence. « À cause de » en donne clairement le sens contextuel.
- source_word: בָּשְׁתָּם
  choice: leur honte
  rationale: « Honte » traduit directement le terme hébreu et conserve l’idée de déshonneur public.
- source_word: הָאֹמְרִים לִי
  choice: ceux qui me disent
  rationale: L’article suivi du participe a une valeur substantivale ; cette tournure française est naturelle et fidèle.
- source_word: הֶאָח הֶאָח
  choice: Ah ! Ah !
  rationale: Cette interjection exprime ici la jubilation malveillante et la moquerie. La répétition et la ponctuation en préservent la force provocatrice.
