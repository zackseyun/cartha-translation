  variant: modern international French
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הַ/גֶּ֗בֶר אֲשֶׁר שָׂ֣ם יְ֭הֹוָה מִבְטַח֑/וֹ וְֽ/לֹא פָנָ֥ה אֶל רְ֝הָבִ֗ים וְ/שָׂטֵ֥י כָזָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: fr
  text: Heureux[a] l’homme[b] qui a fait de Yahvé sa confiance et ne s’est pas tourné vers les orgueilleux[c] ni vers ceux qui se tournent vers le mensonge[d] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Béni ». La formule hébraïque peut exprimer à la fois le bonheur et la faveur dont quelqu’un jouit.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici un nom masculin singulier avec une portée représentative.
    reason: cultural_note
  - marker: c
    text: Ou « les arrogants ». Le mot hébreu est probablement ici un nom commun, et non le nom propre Rahab.
    reason: lexical_alternative
  - marker: d
    text: Ou « vers la fausseté » ou « vers la tromperie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule de béatitude exprime à la fois le bonheur et la faveur accordée. « Heureux » est la tournure française naturelle et traditionnelle dans les écrits de sagesse, sans réduire le terme à une simple émotion.
- source_word: הַגֶּבֶר
  choice: l’homme
  rationale: Le nom désigne ici un homme au singulier, avec une portée représentative dans une maxime de sagesse. La traduction conserve la forme masculine du texte source.
- source_word: שָׂם יְהוָה מִבְטַחוֹ
  choice: a mis sa confiance en Yahvé
  rationale: Le texte dit littéralement qu’il a placé ou fait de Yahvé sa confiance. Cette formulation française naturelle conserve l’idée d’une confiance délibérément placée en Yahvé.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: פָנָה אֶל
  choice: s’est tourné vers
  rationale: L’expression évoque le fait de se tourner vers quelqu’un pour lui accorder attention, appui ou allégeance; la traduction garde cette image relationnelle.
- source_word: רְהָבִים
  choice: les orgueilleux
  rationale: Dans ce pluriel et ce contexte, le mot désigne probablement des personnes orgueilleuses ou arrogantes, plutôt que Rahab comme nom propre.
- source_word: שָׂטֵי כָזָב
  choice: ceux qui s’égarent dans le mensonge
  rationale: Le participe décrit des personnes qui dévient ou s’écartent, tandis que כָזָב désigne le mensonge, la fausseté ou la tromperie. « S’égarent dans » rend naturellement le mouvement figuré sans préciser davantage sa nature.
theological_decisions:
- issue: Portée du masculin singulier dans la béatitude
  choice: l’homme
  alternative: la personne / celui qui
  rationale: Le masculin singulier hébreu a ici une valeur représentative. Le texte principal en conserve la forme tout en signalant en note que la maxime a une portée générale.
- issue: Interprétation de רְהָבִים
  choice: les orgueilleux
  alternative: Rahab / les arrogants
  rationale: Le pluriel et le parallélisme avec ceux qui s’égarent dans le mensonge favorisent un nom commun désignant des personnes orgueilleuses. La possibilité lexicale est néanmoins signalée sans importer une identification théologique particulière.
- issue: Relation entre שָׂטֵי et כָזָב
  choice: ceux qui s’égarent dans le mensonge
  alternative: ceux qui se détournent vers la fausseté / les partisans du mensonge
  rationale: La construction est concise et permet plusieurs nuances. La traduction maintient l’idée de déviation liée au mensonge sans la définir comme apostasie ni préciser si le mensonge est le but, le domaine ou le moyen de cet égarement.
translation_notes:
  register: Français international moderne, clair et digne, avec la cadence d’une béatitude sapientielle. Le parallélisme hébreu est conservé par la reprise de « vers », tandis que « s’égarent dans le mensonge » rend idiomatiquement la seconde expression sans en supprimer l’ambiguïté.
