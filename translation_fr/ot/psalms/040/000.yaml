  text: For the choirmaster. Of David[a]. A psalm.
translation:
  language: fr
  text: Au chef de chœur. De David[a]. Psaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Par David » ou « Pour David » ; le titre hébreu peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Le terme désigne traditionnellement la personne chargée de diriger l’exécution musicale. « Au chef de chœur » est concis, naturel dans un titre de psaume et rend la préposition ל par une formulation destinataire.
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, la préposition ל peut signaler l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve mieux cette latitude que « Par David ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: מִזְמוֹר est le terme générique courant pour un psaume, avec une connotation musicale. En français, le titre nominal « Psaume » est clair et traditionnel.
theological_decisions:
- issue: Sens de la suscription davidique
  choice: De David
  alternative: Par David ; Pour David
  rationale: L’hébreu ne contraint pas à trancher en faveur d’une attribution stricte de l’auteur. « De David » préserve la portée associative plus large de la formule.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève respecte la forme traditionnelle d’une suscription psalmique sans surinterpréter les prépositions hébraïques.
