  text: רְצֵ֣ה יְ֭הוָה לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: fr
  text: Daigne[a], Yahweh, me délivrer ! Yahweh, hâte-toi[b] de venir à mon aide !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Veuille ». L’hébreu peut aussi exprimer l’idée de prendre plaisir à délivrer.
    reason: lexical_alternative
  - marker: b
    text: Ou « viens vite à mon aide ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: Daigne
  rationale: L’impératif de רצה demande ici à Yahweh d’accorder favorablement son consentement. « Daigne » conserve cette nuance de volonté bienveillante dans un registre de prière digne et compréhensible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: לְהַצִּילֵנִי
  choice: me délivrer
  rationale: Le hifil de נצל avec suffixe de première personne signifie arracher au danger, secourir ou délivrer. « Me délivrer » convient au contexte de supplication sans préciser une forme particulière de salut.
- source_word: לְעֶזְרָתִי
  choice: venir à mon aide
  rationale: Littéralement « pour mon aide ». La tournure française idiomatique « venir à mon aide » exprime naturellement l’assistance sollicitée.
- source_word: חוּשָׁה
  choice: hâte-toi
  rationale: 'L’impératif de חושׁ exprime l’urgence : se hâter, agir rapidement. « Hâte-toi » préserve cette force dans un registre poétique encore courant.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le conserve comme nom propre au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, avec un registre de prière digne. « Daigne » et « hâte-toi » gardent la concision et l’urgence du parallélisme hébreu sans devenir obscurs.
