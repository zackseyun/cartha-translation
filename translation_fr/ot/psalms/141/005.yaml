source:
  edition: WLC
  text: יֶֽהֶלְמֵֽ/נִי צַדִּ֨יק חֶ֡סֶד וְֽ/יוֹכִיחֵ֗/נִי שֶׁ֣מֶן רֹ֭אשׁ אַל יָנִ֣י רֹאשִׁ֑/י כִּי ע֥וֹד וּ֝/תְפִלָּתִ֗/י בְּ/רָעוֹתֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: fr
  text: 'Que le juste me frappe : c’est une bonté[a]. Qu’il me reprenne : c’est de l’huile sur la tête ; que ma tête ne la refuse pas[b]. Car ma prière s’élève encore contre leurs mauvaises actions[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que le juste me frappe avec amour fidèle. » Le mot hébreu peut exprimer la bonté, la fidélité ou l’amour loyal.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu est difficile. On peut aussi comprendre : « que ma tête ne la rejette pas » ou « ne s’y dérobe pas ».'
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition est incertaine. Elle peut aussi signifier : « car ma prière subsiste encore au milieu de leurs malheurs », ou : « même dans leurs malheurs, ma prière est pour eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יֶהֶלְמֵנִי
  choice: Que … me frappe
  rationale: Le verbe הלם désigne un coup porté avec force. « Frappe » conserve l’image concrète, tandis que la tournure avec « que » rend la valeur jussive.
- source_word: צַדִּיק
  choice: le juste
  rationale: L’adjectif masculin singulier substantivé désigne ici un homme juste pris comme figure représentative. « Le juste » est naturel en français biblique actuel sans préciser indûment un individu.
- source_word: חֶסֶד
  choice: une bonté
  rationale: Dans ce contexte interpersonnel, le terme qualifie le coup correctif d’acte bienveillant. « Une bonté » conserve l’idée d’un bienfait concret tout en laissant possible la nuance plus forte d’amour fidèle.
- source_word: וְיוֹכִיחֵנִי
  choice: Qu’il me reprenne
  rationale: Le hiphil de יכח exprime la réprimande ou la correction. « Reprendre » garde la fermeté morale du verbe et convient à un registre digne et courant.
- source_word: שֶׁמֶן רֹאשׁ
  choice: de l’huile sur la tête
  rationale: La formulation maintient l’image d’une huile bénéfique ou honorifique sans l’interpréter nécessairement comme une onction rituelle.
- source_word: אַל יָנִי רֹאשִׁי
  choice: que ma tête ne la refuse pas
  rationale: L’hébreu est difficile. Cette traduction conserve le sujet métaphorique « ma tête » et comprend le pronom implicite comme renvoyant à l’huile, donc à la réprimande salutaire.
- source_word: כִּי עוֹד
  choice: Car … encore
  rationale: Cette formulation exprime à la fois le lien explicatif de כִּי et la continuité marquée par עוֹד.
- source_word: וּתְפִלָּתִי
  choice: ma prière s’élève
  rationale: « Ma prière » rend directement le nom avec suffixe ; « s’élève » fournit en français une prédication naturelle sans déterminer le contenu précis de la prière.
- source_word: בְּרָעוֹתֵיהֶם
  choice: contre leurs mauvaises actions
  rationale: La préposition בְּ et le pluriel רָעוֹת sont difficiles ici. Le choix « contre » suit la lecture adversative suggérée par le contexte, et « mauvaises actions » vise les actes mauvais plutôt que des « maux » ambigus.
theological_decisions:
- issue: Genre grammatical de צַדִּיק
  choice: le juste
  alternative: une personne juste ; un homme juste
  rationale: Le masculin singulier de l’hébreu est conservé par l’expression française traditionnelle et naturelle « le juste », sans neutraliser le genre ni surcharger la phrase.
- issue: Rapport entre חֶסֶד et le coup du juste
  choice: c’est une bonté
  alternative: qu’il me frappe avec amour fidèle ; c’est une marque de fidélité
  rationale: La lecture principale comprend חֶסֶד comme l’évaluation du coup correctif. Une note maintient la possibilité d’y voir la manière dont le coup est donné, avec la nuance d’amour fidèle.
- issue: Sens de la proposition finale
  choice: ma prière s’élève encore contre leurs mauvaises actions
  alternative: ma prière subsiste au milieu de leurs malheurs ; même dans leurs malheurs, ma prière est pour eux
  rationale: La syntaxe permet plusieurs analyses du בְּ et du suffixe. Le texte principal retient la lecture adversative cohérente avec l’opposition contextuelle, tandis que la note signale franchement les autres possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et les images concrètes du coup et de l’huile sont conservés. Les difficultés réelles de l’hébreu sont signalées sans imposer une résolution confessionnelle.
