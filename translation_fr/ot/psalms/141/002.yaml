source:
  edition: WLC
  text: תִּכּ֤וֹן תְּפִלָּתִ֣/י קְטֹ֣רֶת לְ/פָנֶ֑י/ךָ מַֽשְׂאַ֥ת כַּ֝פַּ֗/י מִנְחַת עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: fr
  text: 'Que ma prière soit établie devant toi comme l’encens[a],

    et l’élévation de mes mains comme l’offrande du soir[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soit disposée » ou « soit préparée » devant toi ; l’hébreu exprime le souhait que la prière soit fermement établie en présence de Dieu.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne l’offrande régulièrement présentée le soir ; le terme hébreu peut plus précisément désigner une offrande de céréales.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: soit placée
  rationale: Le niphal de כון exprime ici le souhait que la prière soit disposée de façon ferme devant Dieu. « Soit placée » reste naturel en français et conserve cette idée sans expliciter abusivement « soit agréée ».
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Correspondance directe du nom avec suffixe de première personne du singulier.
- source_word: קְטֹרֶת
  choice: l’encens
  rationale: Terme cultuel usuel désignant l’encens brûlé devant Dieu; la comparaison sacrificielle est maintenue.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Formulation française naturelle qui conserve le langage de présence du texte hébreu.
- source_word: מַשְׂאַת כַּפַּי
  choice: mes mains levées
  rationale: Rend idiomatiquement l’acte d’élever les paumes ou les mains dans la prière, tout en conservant le geste corporel.
- source_word: מִנְחַת עָרֶב
  choice: l’offrande du soir
  rationale: Préserve la référence cultuelle de מִנְחָה sans imposer dans le texte principal le sens plus précis d’offrande de céréales, signalé en note.
theological_decisions:
- issue: Application à la prière d’images liées au culte sacrificiel
  choice: Conserver deux comparaisons explicites entre la prière, les mains levées et les offrandes du sanctuaire.
  alternative: Présenter la prière comme remplaçant le sacrifice ou atténuer la portée cultuelle en simple image poétique.
  rationale: L’hébreu rapproche explicitement la prière de l’encens et le geste des mains de l’offrande du soir, mais il n’affirme pas que la prière remplace les sacrifices.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par deux propositions introduites par « que ». « Mes mains levées » est plus idiomatique que le calque « l’élévation de mes mains », sans effacer le geste de prière.
