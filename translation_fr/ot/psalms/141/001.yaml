  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֣ה קְ֭רָאתִי/ךָ ח֣וּשָׁ/ה לִּ֑/י הַאֲזִ֥ינָ/ה ק֝וֹלִ֗/י בְּ/קָרְאִ/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: fr
  text: 'Psaume de David. Yahweh[a], je t’appelle : viens vite à moi ! Prête l’oreille à ma voix quand je t’appelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ; autre forme : « Yahvé ».'
    reason: Signaler le nom divin hébreu, son rendu traditionnel et une autre translittération française courante.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et exact pour ce genre de composition poétique et musicale dans les suscriptions.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance ou l’association ; « de David » conserve cette relative ambiguïté sans imposer « écrit par David ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin YHWH, préférable ici à la substitution par un titre.
- source_word: קְרָאתִיךָ
  choice: je t’appelle
  rationale: Le parfait hébreu, dans cette supplication immédiate, peut exprimer un appel actuel ; le présent est naturel en français et s’accorde avec la reprise à la fin du verset.
- source_word: חוּשָׁה לִּי
  choice: viens vite à moi
  rationale: Rend clairement l’impératif exprimant l’urgence et le mouvement vers le psalmiste, dans un français actuel et naturel.
- source_word: הַאֲזִינָה
  choice: Prête l’oreille
  rationale: Rend l’idée d’une écoute attentive tout en conservant le registre poétique de la prière.
- source_word: קוֹלִי
  choice: ma voix
  rationale: Correspond au sens direct du nom hébreu sans préciser indûment qu’il s’agit d’un cri.
- source_word: בְּקָרְאִי לָךְ
  choice: quand je t’appelle
  rationale: La construction avec בְּ et l’infinitif construit a ici une valeur temporelle, rendue naturellement par « quand ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte directement le tétragramme. « Yahweh » préserve le nom propre, tandis que la note signale le rendu traditionnel français.
translation_notes:
  register: Français international moderne, digne et poétique. La ponctuation fait ressortir l’urgence de la supplication sans ajouter d’idée absente de l’hébreu.
