id: PSA.141.10
reference: Psalms 141:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִפְּל֣וּ בְ/מַכְמֹרָ֣י/ו רְשָׁעִ֑ים יַ֥חַד אָ֝נֹכִ֗י עַֽד אֶעֱבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/010.yaml
  text: Let the wicked fall into their own nets together[c][b][a], while I pass by.
translation:
  language: fr
  text: Que les méchants tombent tous ensemble dans leurs propres filets[a], tandis que moi, je passe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «dans ses filets». Le suffixe hébreu est masculin singulier, tandis que «filets» est au pluriel; il peut renvoyer collectivement aux pièges tendus par les méchants.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : «jusqu’à ce que je sois passé» ou «jusqu’à ce que je traverse».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: Que … tombent
  rationale: L’imparfait qal à valeur volitive se comprend naturellement comme un souhait ou une prière dans ce contexte.
- source_word: בְמַכְמֹרָיו
  choice: dans leurs propres filets
  rationale: מַכְמֹר désigne un filet ou un piège; la forme suffixée est morphologiquement plurielle («ses filets»). Avec le sujet pluriel «les méchants», le français idiomatique rend ici le sens collectif et réflexif par «leurs propres filets», tout en signalant la forme littérale en note.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce substantif adjectival pluriel désigne les personnes moralement mauvaises sans préciser leur genre.
- source_word: יַחַד
  choice: tous ensemble
  rationale: L’adverbe exprime la collectivité ou la simultanéité; «tous ensemble» rattache clairement cette idée aux méchants.
- source_word: אָנֹכִי
  choice: moi, je
  rationale: Le pronom indépendant est emphatique; «moi, je» préserve le contraste marqué avec les méchants.
- source_word: עַד
  choice: tandis que
  rationale: Le sens premier est «jusqu’à», mais dans cette formulation poétique condensée, «tandis que» exprime naturellement le contraste temporel sans ajouter l’idée de sécurité.
- source_word: אֶעֱבוֹר
  choice: je passe
  rationale: Le verbe עבר signifie passer, traverser ou aller au-delà. «Je passe» conserve ici sa sobriété et n’explicite pas une sécurité seulement implicite.
