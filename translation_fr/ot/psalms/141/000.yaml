base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: fr
  text: 'Psaume de David.


    Yahvé[a], je t’appelle : hâte-toi de venir à moi ! Prête l’oreille à ma voix quand je t’appelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ou « l’Éternel ».
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Psaume de David
  rationale: Rend naturellement le titre hébreu tout en conservant l’ambiguïté possible de la préposition לְ, qui peut indiquer l’auteur, l’appartenance ou le lien avec David.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin YHWH, accompagnée d’une note signalant le rendu traditionnel.
- source_word: חוּשָׁה לִּי
  choice: hâte-toi de venir à moi
  rationale: Reproduit l’appel pressant et l’orientation vers le psalmiste exprimés par l’impératif et לִי, sans réduire la formule au seul sens de « secours-moi ».
- source_word: הַאֲזִינָה קוֹלִי
  choice: Prête l’oreille à ma voix
  rationale: Conserve l’image idiomatique hébraïque de l’oreille attentive dans un français actuel et digne.
theological_decisions:
- issue: Rendu du tétragramme YHWH
  choice: Yahvé dans le texte, avec note
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le nom propre est rendu explicitement sans imposer le substitut liturgique traditionnel ; la note informe le lecteur des autres usages.
- issue: Portée de לְ dans le titre לְדָוִד
  choice: de David
  alternative: pour David / appartenant à David
  rationale: « De David » est la formule française naturelle et maintient une certaine souplesse quant au rapport exact du psaume à David, sans trancher explicitement la question de l’auteur.
translation_notes:
  register: Français moderne international, naturel et digne. L’impératif « hâte-toi » garde l’urgence poétique de l’hébreu, tandis que la répétition de « je t’appelle » respecte celle du texte source.
