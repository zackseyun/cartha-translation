    reason: alternative_reading
  - marker: b
    text: Ou « douces » ou « plaisantes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: ont été précipités
  rationale: Le nifal de שׁמט peut exprimer le fait d’être lâché, jeté en bas ou entraîné dans une chute. « Ont été précipités » rend ici la violence probable de la chute sans ajouter d’agent.
- source_word: בִידֵי סֶלַע
  choice: le long des parois du rocher
  rationale: La locution est obscure. Cette formulation retient l’interprétation spatiale courante et rend naturellement l’image topographique, tout en signalant en note la lecture plus littérale.
- source_word: שֹׁפְטֵיהֶם
  choice: leurs juges
  rationale: Le participe de שׁפט désigne directement ceux qui jugent, même si le terme peut aussi viser des dirigeants.
- source_word: וְשָׁמְעוּ
  choice: et ils ont entendu
  rationale: Le qatal peut recevoir diverses valeurs temporelles en poésie. Le passé composé suit directement la forme accomplie sans imposer une conséquence future.
- source_word: אֲמָרַי
  choice: mes paroles
  rationale: Traduction directe et naturelle du nom pluriel muni du suffixe de première personne.
- source_word: כִּי
  choice: car
  rationale: « Car » conserve la relation explicative ou causale entre l’écoute et le caractère agréable des paroles.
- source_word: נָעֵמוּ
  choice: elles sont agréables
  rationale: Le verbe נעם exprime ce qui est agréable, plaisant ou doux. « Agréables » reste sobre et idiomatique.
theological_decisions:
- issue: Interprétation de l’expression difficile בידי סלע
  choice: 'Lecture spatiale : « le long des parois du rocher »'
  alternative: 'Lecture plus littérale ou instrumentale : « entre les mains du rocher » ; autre formulation topographique : « le long des parois de la falaise »'
  rationale: La syntaxe et l’image sont difficiles. Le texte principal présente une lecture spatiale plausible, tandis que la note conserve l’ambiguïté réelle sans transformer le rocher en métaphore théologique déterminée.
- issue: Valeur temporelle de וְשָׁמְעוּ
  choice: « ils ont entendu »
  alternative: « ils entendent » ou « ils entendront »
  rationale: La forme poétique permet plusieurs nuances temporelles. Le passé composé correspond formellement à l’accompli, mais aucune conséquence doctrinale ne doit être tirée de cette seule décision grammaticale.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase demeure concise ; « précipités » exprime nettement la chute, tandis que les notes préservent l’obscurité topographique et la gamme de sens de נעם.
