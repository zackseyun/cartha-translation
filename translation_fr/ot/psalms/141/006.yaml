base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: fr
  text: 'Leurs juges ont été précipités le long des parois du rocher[a], et ils ont entendu mes paroles, car elles sont agréables[b].


    [a] Ou « le long des parois de la falaise ». L’expression hébraïque est difficile ; traditionnellement, elle a aussi été comprise plus littéralement comme « dans les mains du rocher ».


    [b] Ou « douces » ou « plaisantes ».'
  philosophy: optimal-equivalence
  footnotes:
