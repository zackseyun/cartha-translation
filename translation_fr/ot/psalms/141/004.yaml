  text: אַל תַּט לִבִּ֨/י לְ/דָבָ֪ר רָ֡ע לְ/הִתְע֘וֹלֵ֤ל עֲלִל֨וֹת בְּ/רֶ֗שַׁע אֶת אִישִׁ֥ים פֹּֽעֲלֵי אָ֑וֶן וּ/בַל אֶ֝לְחַ֗ם בְּ/מַנְעַמֵּי/הֶֽם־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: fr
  text: N’incline pas mon cœur vers quoi que ce soit de mauvais[a], pour me livrer à des actes de méchanceté avec des hommes qui font le mal[b] ; et que je ne mange pas de leurs mets raffinés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers une mauvaise affaire » ou « vers une mauvaise parole » ; le mot hébreu peut signifier « chose », « affaire » ou « parole ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « avec des hommes qui accomplissent l’iniquité » ; on pourrait aussi traduire : « avec des malfaiteurs ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de leurs aliments de choix ou de leurs choses agréables ; l’expression peut aussi suggérer une participation à leurs plaisirs coupables.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: incline
  rationale: Le verbe נטה garde ici son image d’une orientation donnée au cœur. « Incline » préserve aussi la demande directement adressée à Dieu.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Dans ce contexte, le cœur désigne la volonté, les désirs et la pensée intérieure. Le terme français conserve naturellement cette image.
- source_word: לְדָבָר רָע
  choice: vers quoi que ce soit de mauvais
  rationale: דבר peut désigner une chose, une affaire ou une parole. Cette formulation française rend la portée générale et indéfinie de l’expression sans la limiter à la parole.
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: pour me livrer à des actes de méchanceté
  rationale: La tournure exprime une participation active à des actions mauvaises. « Se livrer à » rend cet engagement délibéré dans un français naturel.
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: avec des hommes qui font le mal
  rationale: La traduction conserve le substantif masculin pluriel אִישִׁים et décrit ces hommes par leur activité mauvaise, comme le fait l’hébreu.
- source_word: וּבַל אֶלְחַם
  choice: et que je ne mange pas
  rationale: Le verbe לחם signifie ici « manger ». La formulation poursuit naturellement la prière négative du premier membre.
- source_word: בְּמַנְעַמֵּיהֶם
  choice: de leurs mets raffinés
  rationale: Le nom désigne des choses agréables ou délectables, notamment des aliments de choix. « Mets raffinés » maintient l’image concrète du repas tout en laissant ouverte sa portée participative.
theological_decisions:
- issue: Action divine et responsabilité morale dans la demande concernant le cœur
  choice: « N’incline pas mon cœur »
  alternative: « Ne laisse pas mon cœur s’incliner »
  rationale: L’hébreu demande directement à Dieu de ne pas orienter le cœur du psalmiste. La traduction conserve cette tension théologique au lieu de l’atténuer en parlant seulement d’une permission divine.
- issue: Portée possible du repas avec les méchants
  choice: Conserver l’image concrète de manger leurs mets
  alternative: Expliciter une participation à leurs plaisirs coupables
  rationale: Le texte peut évoquer un repas réel et, par implication, la communion avec leurs pratiques. La traduction ne réduit pas cette polyvalence à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme de prière et le parallélisme du verset, tandis que « quoi que ce soit de mauvais » et « se livrer à » évitent des formulations trop littérales ou archaïques.
