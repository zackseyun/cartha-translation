  text: שִׁיתָ֣/ה יְ֭הוָה שָׁמְרָ֣ה לְ/פִ֑/י נִ֝צְּרָ֗/ה עַל דַּ֥ל שְׂפָתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: fr
  text: Place une garde, Yahweh, devant ma bouche ; veille sur la porte de mes lèvres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: Place
  rationale: L’impératif exprime une supplication demandant à Dieu d’établir une garde ; « place » est naturel et conserve l’image concrète.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve ici le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: שָׁמְרָה
  choice: une garde
  rationale: Le substantif désigne une garde ou une surveillance ; avec « place », « une garde » rend concrètement l’idée d’un dispositif empêchant une parole fautive.
- source_word: לְפִי
  choice: devant ma bouche
  rationale: La préposition situe la garde par rapport à la bouche ; « devant » convient naturellement à l’image d’une sentinelle postée à une entrée.
- source_word: נִצְּרָה
  choice: veille
  rationale: L’impératif de נצר appelle à surveiller ou garder ; « veille » forme un parallélisme fluide avec la première proposition.
- source_word: עַל
  choice: sur
  rationale: La préposition marque ici l’objet de la surveillance ; « veiller sur » est idiomatique en français.
- source_word: דַּל שְׂפָתָי
  choice: la porte de mes lèvres
  rationale: '« Porte » conserve la métaphore hébraïque vive : les lèvres sont envisagées comme l’accès par lequel sort la parole.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre, tout en évitant une forme française historiquement moins proche de la vocalisation généralement reconstruite.
translation_notes:
  register: Français international moderne, sobre et adapté à la prière. Le parallélisme hébreu et la métaphore concrète de la porte sont maintenus sans archaïsme.
