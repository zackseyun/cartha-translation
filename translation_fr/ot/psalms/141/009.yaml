source:
  edition: WLC
  text: שָׁמְרֵ֗/נִי מִ֣/ידֵי פַ֭ח יָ֣קְשׁוּ לִ֑/י וּ֝/מֹקְשׁ֗וֹת פֹּ֣עֲלֵי אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/009.yaml
  text: Keep me from the hands of the trap they have set for me[b][a], and from the snares of the workers of wickedness.
translation:
  language: fr
  text: Garde-moi de l’emprise du piège qu’ils m’ont tendu[a], et des traquenards de ceux qui font le mal[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des mains du piège qu’ils m’ont tendu ». En hébreu, la « main » peut représenter le pouvoir ou l’emprise.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de ceux qui commettent l’injustice ». Le mot hébreu peut désigner le mal, l’injustice, le méfait ou le malheur causé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Garde-moi
  rationale: L’impératif de שׁמר exprime ici une demande de protection. « Garde-moi » est direct, naturel et adapté au registre de la prière.
- source_word: מִידֵי
  choice: de l’emprise de
  rationale: Littéralement « des mains de ». Avec un piège comme complément, « de l’emprise de » restitue en français l’idée hébraïque de pouvoir ou de prise tout en conservant la force de l’image.
- source_word: פַח
  choice: piège
  rationale: פח désigne un piège ou un filet. « Piège » convient au contexte et permet de distinguer ce terme du pluriel מֹקְשׁוֹת dans le second membre.
- source_word: יָקְשׁוּ לִי
  choice: qu’ils m’ont tendu
  rationale: Le verbe יקשׁ évoque l’action de poser ou de tendre un piège. Cette formulation est idiomatique en français et garde la référence implicite aux adversaires.
- source_word: וּמֹקְשׁוֹת
  choice: et des traquenards
  rationale: מֹקְשׁוֹת désigne des pièges ou des embûches. « Traquenards » préserve la variation lexicale et le parallélisme poétique sans répéter « piège ».
- source_word: פֹּעֲלֵי אָוֶן
  choice: ceux qui font le mal
  rationale: La formule signifie littéralement « ceux qui accomplissent le mal/l’iniquité ». Le choix retenu est clair, actuel et conserve l’idée d’une pratique active du mal.
