id: PSA.141.7
reference: Psalms 141:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כְּמ֤וֹ פֹלֵ֣חַ וּ/בֹקֵ֣עַ בָּ/אָ֑רֶץ נִפְזְר֥וּ עֲ֝צָמֵ֗י/נוּ לְ/פִ֣י שְׁאֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/007.yaml
  text: As one plows and breaks up the earth[b][a], our bones have been scattered at the mouth of Sheol.
translation:
  language: fr
  text: Comme lorsqu’on laboure et fend la terre,[a] nos os sont dispersés à l’entrée du séjour des morts.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme celui qui fend et ouvre le sol. » Les participes hébreux décrivent vivement l’action et permettent plusieurs choix de verbes agricoles.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à la bouche du Shéol ». Le Shéol est, dans l’hébreu biblique, le séjour des morts; on traduit aussi parfois « la tombe », mais non nécessairement « l’enfer ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּמוֹ
  choice: Comme lorsqu’on
  rationale: Introduit une comparaison et permet de rendre naturellement en français la scène exprimée par les deux participes hébreux.
- source_word: פֹלֵחַ
  choice: laboure
  rationale: Dans ce contexte agricole, le verbe évoque le fait de fendre ou de creuser le sol; « laboure » rend clairement l’image sans en atténuer la force.
- source_word: וּבֹקֵעַ
  choice: et fend
  rationale: Préserve l’idée concrète d’ouvrir ou de fendre la terre et le parallélisme avec le premier verbe.
- source_word: בָּאָרֶץ
  choice: la terre
  rationale: Désigne ici le sol travaillé; « la terre » reste proche de l’hébreu et naturel en français.
- source_word: נִפְזְרוּ
  choice: sont dispersés
  rationale: Le nifal exprime un état passif résultant. Le présent français rend directement l’état saisissant des os épars.
- source_word: עֲצָמֵינוּ
  choice: nos os
  rationale: Traduction directe qui conserve sans l’adoucir l’image macabre du texte.
- source_word: לְפִי
  choice: à l’entrée de
  rationale: Littéralement « à la bouche de ». En français, « à l’entrée de » transmet naturellement l’image spatiale sans produire une formulation inutilement obscure; le sens littéral est signalé en note.
- source_word: שְׁאוֹל
  choice: séjour des morts
  rationale: Expression française claire pour le domaine des morts évoqué par le terme hébreu, sans lui imposer le sens doctrinal plus tardif d’« enfer ».
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol; la tombe; l’enfer
  rationale: « Le séjour des morts » rend intelligible l’ancien concept hébreu sans l’identifier à l’enfer au sens doctrinal ultérieur. « Shéol » préserverait davantage la forme hébraïque, mais serait moins immédiatement accessible.
translation_notes:
  register: Français international moderne, sobre et poétique. La comparaison agricole demeure concrète, tandis que « séjour des morts » privilégie l’intelligibilité sans résoudre abusivement la portée théologique de שְׁאוֹל.
