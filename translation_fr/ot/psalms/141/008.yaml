source:
  edition: WLC
  text: כִּ֤י אֵלֶ֨י/ךָ יְהֹוִ֣ה אֲדֹנָ֣/י עֵינָ֑/י בְּ/כָ֥ה חָ֝סִ֗יתִי אַל תְּעַ֥ר נַפְשִֽׁ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/008.yaml
  text: For my eyes are toward you[a], O Yahweh, my Lord; in you I take refuge[b]; do not pour out my life.
translation:
  language: fr
  text: Car mes yeux sont tournés vers toi, Yahvé, mon Seigneur ; en toi, j’ai trouvé refuge. Ne répands pas ma vie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « ma vie » peut aussi désigner la personne elle-même ou, selon le contexte, l’âme.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi être compris comme « ne me mets pas à nu » ou « ne me laisse pas sans défense » ; il évoque l’idée de vider, de répandre ou d’exposer.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le motif qui fonde la supplication dans le contexte précédent, tout en conservant le lien logique du texte hébreu.
- source_word: אֵלֶיךָ … עֵינַי
  choice: mes yeux sont tournés vers toi
  rationale: Rend naturellement l’image hébraïque d’un regard dirigé vers Dieu, exprimant à la fois l’attention, l’attente et la dépendance.
- source_word: יְהֹוָה
  choice: Yahvé
  rationale: Transcrit le nom divin distinctement du titre אֲדֹנָי qui le suit, afin de préserver la double appellation du texte source.
- source_word: אֲדֹנָי
  choice: mon Seigneur
  rationale: Conserve le titre de souveraineté ainsi que la nuance personnelle exprimée par la forme hébraïque.
- source_word: בְּךָ חָסִיתִי
  choice: en toi, j’ai trouvé refuge
  rationale: Le parfait hébreu présente le recours à Dieu comme une démarche accomplie et une position de confiance qui demeure vraie au moment de la prière.
- source_word: אַל תְּעַר
  choice: ne laisse pas … s’écouler
  rationale: Expression française naturelle qui maintient l’image d’une vie vidée ou répandue, sans trancher silencieusement entre les nuances possibles du verbe hébreu.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Dans cette supplication pour être préservé de la mort, נֶפֶשׁ désigne vraisemblablement la vie ou la personne du psalmiste plutôt qu’une âme immatérielle au sens étroit.
theological_decisions:
- issue: Rendu de l’adresse יְהֹוָה אֲדֹנָי
  choice: Yahvé, mon Seigneur
  alternative: Seigneur DIEU
  rationale: Le choix distingue le nom divin du titre de souveraineté et conserve la relation personnelle exprimée par « mon Seigneur », sans fusionner les deux éléments.
- issue: Sens de נֶפֶשׁ dans une prière de délivrance
  choice: ma vie
  alternative: mon âme
  rationale: Le contexte porte sur la préservation du psalmiste face au danger. « Ma vie » exprime ce sens sans imposer une conception dualiste étrangère au passage.
- issue: Portée de תְּעַר
  choice: ne laisse pas ma vie s’écouler
  alternative: ne me laisse pas sans défense
  rationale: Le texte principal conserve l’image concrète d’une vie qui serait vidée ou répandue. L’autre lecture, fondée sur l’idée de mettre à nu ou d’exposer, reste signalée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La tournure « mes yeux sont tournés vers toi » conserve l’image poétique hébraïque. « Ne laisse pas ma vie s’écouler » privilégie une expression compréhensible tout en maintenant la métaphore et en documentant les autres lectures dans les notes.
