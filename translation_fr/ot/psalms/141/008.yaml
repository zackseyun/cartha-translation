  naturalness: « Car mes yeux sont tournés vers toi, Yahvé, mon Seigneur ; en toi, j’ai trouvé refuge » est naturel, digne et clair en français international. « Ne répands pas ma vie » est une formulation poétique compréhensible et plus nette que « ne laisse pas ma vie s’écouler », lequel évoque plutôt le passage du temps ou une mort graduelle.
