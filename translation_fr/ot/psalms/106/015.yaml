  text: וַ/יִּתֵּ֣ן לָ֭/הֶם שֶׁאֱלָתָ֑/ם וַ/יְשַׁלַּ֖ח רָז֣וֹן בְּ/נַפְשָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/015.yaml
  text: So he gave them what they asked for[c][b][a], but sent leanness into their soul.
translation:
  language: fr
  text: Alors il leur donna ce qu’ils avaient demandé[a], mais il leur envoya le dépérissement[b], jusque dans leur être[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur demande ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’amaigrissement » ou « la maigreur ».'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : néfesh, terme qui peut aussi désigner l’âme, la vie ou la personne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: il leur donna
  rationale: Le verbe נתן signifie directement « donner ». Avec לָהֶם, la tournure française naturelle est « il leur donna ».
- source_word: שֶׁאֱלָתָם
  choice: ce qu’ils avaient demandé
  rationale: שֶׁאֱלָה peut désigner une demande ou la chose demandée. Cette formulation claire conserve ici les deux nuances principales.
- source_word: וַיְשַׁלַּח
  choice: mais il envoya
  rationale: La conjonction hébraïque signifie littéralement « et », mais le contraste entre l’exaucement et le jugement justifie le français adversatif « mais » sans effacer la relation narrative.
- source_word: רָזוֹן
  choice: le dépérissement
  rationale: רָזוֹן évoque la maigreur, l’amaigrissement ou le dépérissement. « Dépérissement » exprime naturellement un affaiblissement qui consume, tout en évitant de préciser à tort une maladie déterminée.
- source_word: בְּנַפְשָׁם
  choice: dans leur être
  rationale: נֶפֶשׁ désigne selon le contexte l’âme, la vie, la personne ou l’être. « Leur être » restitue ici l’atteinte profonde sans imposer la notion moderne d’une âme immatérielle séparée du corps.
theological_decisions:
- issue: Portée de נֶפֶשׁ dans ce contexte de jugement
  choice: dans leur être
  alternative: dans leur âme ; dans leur vie
  rationale: Le mot hébreu englobe la vie et la personne entière. « Être » préserve cette ampleur anthropologique et la gravité du jugement, tandis qu’une note signale les rendus plus littéraux possibles.
- issue: Rapport entre le don accordé et le jugement
  choice: mais
  alternative: et
  rationale: L’hébreu emploie la conjonction narrative ordinaire, susceptible de porter ici une valeur adversative. « Mais » rend le contraste contextuel sans expliquer davantage sa portée théologique.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et poétique. « Dépérissement » est plus naturel aujourd’hui que « maigreur » comme image d’un jugement, tandis que les notes conservent les possibilités lexicales. Tous les marqueurs sont placés immédiatement après les expressions concernées.
