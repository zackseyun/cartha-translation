id: PSA.106.48
reference: Psalms 106:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּר֤וּךְ יְהוָ֨ה אֱלֹהֵ֪י יִשְׂרָאֵ֡ל מִן הָ֤/עוֹלָ֨ם וְ/עַ֬ד הָ/עוֹלָ֗ם וְ/אָמַ֖ר כָּל הָ/עָ֥ם אָמֵ֗ן הַֽלְלוּ יָֽהּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: fr
  text: 'Béni soit Yahweh, le Dieu d’Israël,


    d’éternité en éternité[a] !


    Et que tout le peuple dise : « Amen ! »


    Louez Yah[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis toujours et pour toujours ».'
    reason: lexical_alternative
  - marker: b
    text: Cette expression hébraïque est traditionnellement transcrite « Alléluia » ; elle signifie « Louez Yah ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: La formule participiale de bénédiction a ici une valeur doxologique ; « Béni soit » en restitue naturellement la force liturgique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette expression rend directement la chaîne construite hébraïque dans un français naturel.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: d’éternité en éternité
  rationale: Cette formule française concise conserve la répétition de עוֹלָם et l’étendue temporelle illimitée de la doxologie.
- source_word: וְאָמַר
  choice: Et que … dise
  rationale: Malgré la forme accomplie du verbe, le contexte liturgique lui donne une valeur d’exhortation ou d’appel à la réponse collective.
- source_word: כָּל הָעָם
  choice: tout le peuple
  rationale: Le singulier collectif désigne l’ensemble du peuple réuni.
- source_word: אָמֵן
  choice: Amen
  rationale: La forme liturgique consacrée en français convient à cette réponse communautaire.
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah
  rationale: L’impératif pluriel et la forme courte du nom divin sont tous deux rendus explicitement.
theological_decisions:
- issue: Distinction entre le nom divin יְהוָה et sa forme courte יָהּ
  choice: Rendre יְהוָה par « Yahweh » et יָהּ par « Yah »
  alternative: Rendre les deux formes par « le Seigneur », ou employer « Alléluia » pour הַלְלוּ יָהּ
  rationale: Le texte emploie délibérément deux formes apparentées mais distinctes du nom divin ; les conserver évite de remplacer le nom par un titre et rend visible cette distinction.
- issue: Valeur verbale de וְאָמַר
  choice: 'Comprendre la forme comme une exhortation liturgique : « Et que tout le peuple dise »'
  alternative: 'La lire comme un récit au passé : « Et tout le peuple a dit »'
  rationale: Le contexte doxologique et la réponse « Amen » favorisent l’appel adressé à l’assemblée, sans transformer le verset en narration d’un événement passé.
translation_notes:
  register: Français international moderne, solennel et liturgique sans archaïsme marqué. La mise en lignes souligne les quatre mouvements de la doxologie. Les guillemets français encadrent la réponse de l’assemblée.
