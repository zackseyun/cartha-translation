source:
  edition: WLC
  text: וַ/יֵּרָגְנ֥וּ בְ/אָהֳלֵי/הֶ֑ם לֹ֥א שָׁ֝מְע֗וּ בְּ/ק֣וֹל יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/025.yaml
  text: So they grumbled in their tents[b][a]; they did not listen to the voice of Yahweh.
translation:
  language: fr
  text: Ils ont maugréé dans leurs tentes[a] ; ils n’ont pas écouté la voix de Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « murmuré » ou « protesté ». Le verbe hébreu évoque des plaintes exprimées à voix basse avec mécontentement.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils n’ont pas obéi à Yahweh ». L’expression hébraïque « écouter la voix de » peut aussi avoir le sens de tenir compte de ce qui est dit et d’obéir.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: Ils ont donc maugréé
  rationale: Le verbe רגן exprime des plaintes murmurées et mécontentes. « Maugréer » restitue cette nuance en français actuel et soutenu sans réduire le sens à une plainte formulée ouvertement. « Donc » marque ici la progression narrative portée par le waw.
- source_word: בְאָהֳלֵיהֶם
  choice: dans leurs tentes
  rationale: אֹהֶל désigne concrètement la tente ; l’image convient au cadre du désert et ne doit pas être généralisée en « demeures ».
- source_word: לֹא שָׁמְעוּ
  choice: ils n’ont pas écouté
  rationale: שׁמע avec בְּקוֹל peut signifier écouter, prêter attention ou obéir. « N’ont pas écouté » préserve l’image auditive tout en suggérant le refus d’obéir.
- source_word: בְּקוֹל
  choice: la voix de
  rationale: La tournure « écouter la voix de » reproduit naturellement l’idiome hébreu sans l’expliciter d’emblée par « obéir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle « Yahweh », plutôt que remplacé par un titre.
theological_decisions:
- issue: Portée de l’idiome שׁמע בקול
  choice: écouté la voix de
  alternative: obéi à
  rationale: L’idiome implique l’obéissance, mais la traduction retenue conserve l’expression concrète de l’hébreu et laisse subsister toute sa portée ; une note signale l’autre formulation possible.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte source emploie le nom propre divin ; le conserver évite de le remplacer par un titre.
translation_notes:
  register: Français moderne, international et digne. « Maugréé » conserve la nuance de plainte murmurée ; la syntaxe reste fluide tout en préservant l’idiome hébreu « écouter la voix de ».
