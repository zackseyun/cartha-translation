  text: וַ/תִּבְעַר אֵ֥שׁ בַּ/עֲדָתָ֑/ם לֶ֝הָבָ֗ה תְּלַהֵ֥ט רְשָׁעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/018.yaml
  text: And fire burned among their company[c][b][a]; a flame consumed the wicked.
translation:
  language: fr
  text: Un feu s’alluma au milieu de leur assemblée ; une flamme dévora les méchants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: s’alluma
  rationale: Le verbe בער peut décrire le fait qu’un feu prend ou se met à brûler. « S’alluma » rend naturellement le début de l’incendie dans ce récit.
- source_word: אֵשׁ
  choice: un feu
  rationale: Sens concret et courant du nom hébreu, sans nécessité de le métaphoriser.
- source_word: בַּעֲדָתָם
  choice: au milieu de leur assemblée
  rationale: עֵדָה désigne ici le groupe rassemblé ; « au milieu de » exprime que le feu éclate parmi ses membres, tandis qu’« assemblée » conserve la valeur collective du terme.
- source_word: לֶהָבָה
  choice: une flamme
  rationale: Rend directement le nom hébreu et maintient le parallélisme poétique avec « un feu ».
- source_word: תְּלַהֵט
  choice: dévora
  rationale: La forme intensive de להט évoque une combustion ardente et destructrice. « Dévora » est une image française naturelle appliquée à une flamme et exprime cette force sans ajout explicatif.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rend le substantif pluriel par une désignation morale concise, traditionnelle et non genrée en référence.
theological_decisions:
- issue: Nature et portée du jugement
  choice: Le verset évoque concrètement le feu qui frappe les rebelles qualifiés de méchants au sein de l’assemblée.
  alternative: Comprendre le feu comme une métaphore générale du jugement.
  rationale: Le contexte du psaume rappelle des événements historiques de rébellion et de jugement. La traduction conserve donc l’image concrète sans l’élargir en affirmation doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme « un feu… une flamme… » est conservé, ainsi que la progression entre l’apparition du feu et son effet destructeur.
