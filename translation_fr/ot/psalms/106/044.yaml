id: PSA.106.44
reference: Psalms 106:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: fr
  text: Pourtant, il vit leur détresse quand il entendit leur cri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et il vit la détresse qui pesait sur eux lorsqu’il entendit leur cri. »'
    reason: Alternative plus formelle qui conserve séparément בַּצַּר et לָהֶם ainsi que la valeur simplement connective du waw.
lexical_decisions:
- source_word: וַיַּרְא
  choice: il vit
  rationale: Le verbe ראה signifie directement « voir ». Ici, le contexte implique qu’il remarque leur situation et y prête attention, mais « il vit » conserve sobrement l’expression hébraïque.
- source_word: בַּצַּר לָהֶם
  choice: leur détresse
  rationale: צַר désigne ici la détresse ou l’affliction, et לָהֶם rattache cette détresse aux Israélites. La formulation possessive est naturelle en français.
- source_word: בְּשָׁמְעוֹ
  choice: quand il entendit
  rationale: La préposition בְּ suivie de l’infinitif construit introduit ici une proposition temporelle. « Quand il entendit » rend clairement cette relation.
- source_word: רִנָּתָם
  choice: leur cri
  rationale: רִנָּה peut désigner un cri retentissant, parfois joyeux, mais le contexte de détresse impose ici le sens d’un appel pressant. « Cri » préserve cette valeur sans ajouter l’idée de joie.
- source_word: וַ
  choice: Pourtant
  rationale: Le waw est formellement un connecteur, mais le contexte oppose la réaction miséricordieuse de Dieu à la rébellion et à l’oppression précédemment décrites. « Pourtant » exprime cette nuance adversative sans modifier le contenu.
theological_decisions:
- issue: Valeur discursive de la conjonction initiale dans le passage du jugement à la miséricorde
  choice: Nuance adversative rendue par « Pourtant »
  alternative: Simple liaison par « Et » ou succession par « Alors »
  rationale: Le waw hébreu permet une traduction simplement connective, mais l’enchaînement du psaume souligne que Dieu prête attention à son peuple malgré sa rébellion antérieure. « Pourtant » maintient cette tension entre jugement et miséricorde.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif poétique du psaume; « détresse » et « cri » restent naturels tout en conservant la sobriété de l’hébreu.
