source:
  edition: WLC
  text: לֹֽא הִ֭שְׁמִידוּ אֶת הָֽ/עַמִּ֑ים אֲשֶׁ֤ר אָמַ֖ר יְהוָ֣ה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/034.yaml
  text: They did not destroy the peoples whom Yahweh had told them to destroy[a].
translation:
  language: fr
  text: Ils ne détruisirent pas les peuples que Yahweh leur avait dit de détruire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Ils ne détruisirent pas les peuples que Yahweh leur avait dit. » Le complément « de détruire » est sous-entendu en hébreu et ressort clairement du contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא הִשְׁמִידוּ
  choice: Ils ne détruisirent pas
  rationale: La négation et le hiphil de שׁמד expriment ici le fait de ne pas causer la destruction. Le passé simple convient au registre narratif et poétique du psaume, tandis que « détruire » reste fort sans surinterpréter.
- source_word: אֶת הָעַמִּים
  choice: les peuples
  rationale: Le pluriel עַמִּים désigne plusieurs groupes humains; « les peuples » en conserve directement la valeur, mieux que « les nations » dans ce contexte.
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: que Yahweh leur avait dit de détruire
  rationale: L'hébreu dit littéralement « que Yahweh avait dit à eux » et laisse le contenu de la parole sous-entendu. Le français exige ici un complément plus explicite; « de détruire » reprend naturellement l'action du début du verset sans remplacer אָמַר par le verbe plus fort « ordonner ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver son statut de nom propre dans le texte hébreu.
theological_decisions:
- issue: Complément implicite après « Yahweh leur avait dit »
  choice: de détruire
  alternative: au sujet desquels Yahweh leur avait parlé
  rationale: La construction hébraïque est elliptique. Le verbe initial et le contexte de la désobéissance d'Israël indiquent que l'action commandée est la destruction des peuples. La traduction explicite ce complément pour rendre la phrase française intelligible, tout en signalant l'ellipse dans une note.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple maintient la tonalité littéraire du psaume sans archaïsme marqué. La répétition de « détruire » rend explicite l'ellipse hébraïque et demeure naturelle en français.
