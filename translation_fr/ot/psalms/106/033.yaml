  source_fidelity: 'Le sens général est bien compris : le verset explique la faute de Moïse à Meriba. Toutefois, « aigrirent son esprit » est un calque peu idiomatique en français moderne. « Irritèrent son esprit » rend de façon plus naturelle l’effet causatif ou provocateur de הִמְרוּ, sans réduire « esprit » à une simple humeur. La note b doit aussi corriger le littéral : בִּשְׂפָתָיו signifie « avec/par ses lèvres », non « de ses lèvres ».'
  naturalness: « Car ils irritèrent son esprit » et « il parla avec précipitation » sont sobres, naturels et compatibles avec le registre poétique. « Avec précipitation » rend le caractère irréfléchi de la parole sans introduire un contenu précis.
  terminology: « Esprit » conserve le terme anthropologique hébreu et son référent contextuel, Moïse, sans suggérer le Saint-Esprit. La note précise ce référent contextuel tout en donnant l’alternative lexicale pertinente. Le renvoi à Nombres 20:10 convient.
