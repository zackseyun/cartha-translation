  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: fr
  text: Car ils irritèrent son esprit[a], et il parla avec précipitation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire l’esprit de Moïse, dans le contexte de Meriba. On pourrait aussi traduire : « ils provoquèrent son esprit ». Voir Nombres 20:10.'
    reason: Précise le référent contextuel et signale une possibilité lexicale de הִמְרוּ sans imposer une interprétation théologique.
  - marker: b
    text: 'Littéralement : « il parla avec ses lèvres » ; l’expression souligne sa parole.'
    reason: Conserve l’image concrète de l’hébreu et corrige la valeur de la préposition.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de ce qui précède; « Car » restitue naturellement ce lien causal.
- source_word: הִמְרוּ
  choice: ils aigrirent
  rationale: Avec « son esprit » comme complément, le verbe exprime l’idée de rendre amer, d’irriter ou de provoquer. « Aigrirent » conserve l’image causative et la tension du texte hébreu.
- source_word: אֶת רוּחוֹ
  choice: son esprit
  rationale: Le syntagme désigne ici la disposition intérieure de Moïse. « Son esprit » reste proche de l’anthropologie hébraïque sans préciser excessivement par « humeur » ou « pensée ».
- source_word: וַיְבַטֵּא
  choice: il parla sans réfléchir
  rationale: Le verbe décrit une parole précipitée ou irréfléchie dans ce contexte. Cette formulation actuelle et naturelle rend sa valeur négative sans ajouter le contenu des paroles.
- source_word: בִּשְׂפָתָיו
  choice: il parla
  rationale: L’hébreu dit littéralement « de ses lèvres ». En français courant, l’instrument est implicite dans « parler »; l’image concrète est signalée en note.
theological_decisions:
- issue: Référent de « son » et sujet de « il »
  choice: Les pronoms renvoient à Moïse.
  alternative: Les pronoms pourraient être rapportés collectivement au peuple ou à un autre antécédent.
  rationale: Dans le récit de Meriba évoqué aux versets 32-33, le peuple irrite Moïse et celui-ci prononce des paroles irréfléchies; cette lecture correspond à Nombres 20:10 et n’introduit pas ici une référence au Saint-Esprit.
translation_notes:
  register: Français moderne, sobre et digne. « Aigrirent son esprit » garde l’image hébraïque tout en restant intelligible; « parla sans réfléchir » exprime naturellement le caractère précipité de la parole.
