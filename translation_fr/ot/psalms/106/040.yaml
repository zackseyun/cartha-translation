  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף יְהוָ֣ה בְּ/עַמּ֑/וֹ וַ֝/יְתָעֵ֗ב אֶת נַחֲלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: fr
  text: Alors la colère de Yahweh s’enflamma contre son peuple, et il prit son héritage en horreur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: la colère… s’enflamma
  rationale: L’expression hébraïque associe la colère à une chaleur qui s’allume. Cette formulation française naturelle conserve cette image vive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: בְּעַמּוֹ
  choice: contre son peuple
  rationale: Avec un verbe exprimant la colère, la préposition בְּ désigne ici ceux contre qui elle se dirige.
- source_word: וַיְתָעֵב
  choice: il prit… en horreur
  rationale: Le verbe תעב exprime une vive répulsion. « Prendre en horreur » est fort, digne et idiomatique en français moderne.
- source_word: נַחֲלָתוֹ
  choice: son héritage
  rationale: נַחֲלָה désigne un héritage ou une possession attribuée; appliqué au peuple, « héritage » conserve la portée relationnelle et biblique du terme.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Langage anthropopathique de la colère divine
  choice: la colère de Yahweh s’enflamma
  alternative: Yahweh se mit en colère
  rationale: La traduction conserve l’image hébraïque de la chaleur et la force de la présentation poétique, sans atténuer ni expliquer la tension théologique.
- issue: Israël comme héritage de Yahweh
  choice: son héritage
  alternative: son bien
  rationale: « Héritage » maintient la métaphore du texte, y compris la tension produite lorsque Dieu prend en horreur le peuple ainsi désigné.
translation_notes:
  register: Français international moderne, naturel et solennel. Le parallélisme est préservé, ainsi que la métaphore thermique de la colère et la forte répulsion exprimée dans le second membre.
