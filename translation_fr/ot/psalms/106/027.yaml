source:
  edition: WLC
  text: וּ/לְ/הַפִּ֣יל זַ֭רְעָ/ם בַּ/גּוֹיִ֑ם וּ֝/לְ/זָרוֹתָ֗/ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/027.yaml
  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: fr
  text: 'et de faire tomber leurs descendants parmi les nations[a],

    et de les disperser dans les pays[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur semence » ; autre traduction : « leur descendance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans les terres » ou « à travers les pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: et de faire tomber
  rationale: L’infinitif hiphil de נפל exprime une action causative. « Faire tomber » conserve cette valeur sans préciser indûment s’il s’agit de mort, de défaite ou d’un autre malheur.
- source_word: זַרְעָם
  choice: leur descendance
  rationale: זֶרַע signifie littéralement « semence », mais désigne ici les descendants. « Descendance » est naturel en français moderne et convient au sens collectif.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations étrangères. « Nations » garde le sens courant du terme sans introduire les connotations ultérieures de « païens ».
- source_word: וּלְזָרוֹתָם
  choice: et de les disperser
  rationale: זרה peut signifier « vanner » ou « disperser ». Dans ce contexte de jugement et de déplacement parmi plusieurs territoires, « disperser » exprime clairement le sens contextuel.
- source_word: בָּאֲרָצוֹת
  choice: dans les pays
  rationale: Le pluriel אֲרָצוֹת renvoie à plusieurs terres ou pays. « Dans les pays » est idiomatique en français et laisse ouverte la nuance entre territoires et États.
theological_decisions:
- issue: Nature du jugement annoncé
  choice: Le verset évoque la chute de la descendance et sa dispersion parmi des nations étrangères.
  alternative: « Faire tomber » pourrait être compris plus précisément comme « faire périr » ou « renverser ».
  rationale: Le causatif hébreu de נפל est plus large que la seule mort physique. Le parallélisme avec la dispersion invite à ne pas réduire explicitement le jugement à la mort ou à la défaite militaire.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu et la coordination infinitive avec le contexte précédent sont conservés. « Faire tomber » maintient l’ambiguïté réelle du texte source.
