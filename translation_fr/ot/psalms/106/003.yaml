source:
  edition: WLC
  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: fr
  text: 'Heureux ceux qui respectent le droit,

    qui pratiquent la justice en tout temps.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule exclamative introduit une béatitude. « Heureux » est la tournure française biblique naturelle et digne, sans réduire l’expression à un simple état psychologique.
- source_word: שֹׁמְרֵי
  choice: ceux qui respectent
  rationale: Le participe exprime une conduite habituelle. Avec « le droit », « respecter » rend naturellement l’idée d’observer et de maintenir une norme juste.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte éthique, le terme désigne l’ordre juste ou ce qui est conforme à la justice, plutôt qu’un verdict particulier. « Le droit » permet aussi de le distinguer du terme parallèle צְדָקָה.
- source_word: עֹשֵׂה
  choice: qui pratiquent
  rationale: Le participe singulier a ici une portée générique après l’expression plurielle. Le pluriel français assure l’accord naturel, tandis que « pratiquent » souligne une conduite constante.
- source_word: צְדָקָה
  choice: la justice
  rationale: Le terme désigne ici la conduite droite et juste. « La justice » conserve sa portée morale et théologique tout en formant un parallélisme distinct avec « le droit ».
- source_word: בְּכָל עֵת
  choice: en tout temps
  rationale: Cette expression rend l’idée de continuité ou de constance et conserve la formulation emphatique de l’hébreu dans un registre psalmique naturel.
theological_decisions:
- issue: Rapport entre מִשְׁפָּט et צְדָקָה
  choice: Distinguer les deux termes par « le droit » et « la justice ».
  alternative: Employer « la justice » pour מִשְׁפָּט et « ce qui est juste » ou « la droiture » pour צְדָקָה.
  rationale: Les deux notions se recoupent sans être identiques. La traduction retenue préserve leur parallélisme éthique et leur distinction lexicale, sans leur imposer une séparation doctrinale trop rigide.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes. « Heureux » reprend la forme traditionnelle et naturelle des béatitudes; « respectent le droit » et « pratiquent la justice » expriment une conduite habituelle.
