  text: לִ/רְא֤וֹת בְּ/ט֘וֹבַ֤ת בְּחִירֶ֗י/ךָ לִ֭/שְׂמֹחַ בְּ/שִׂמְחַ֣ת גּוֹיֶ֑/ךָ לְ֝/הִתְהַלֵּ֗ל עִם נַחֲלָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: fr
  text: afin que je voie le bonheur de ceux que tu as choisis, que je me réjouisse de la joie de ta nation[a] et que je me glorifie avec ton héritage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton peuple ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ton patrimoine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִרְאוֹת
  choice: afin que je voie
  rationale: L’infinitif construit avec ל poursuit la demande du verset précédent et en exprime le but; « voir » conserve l’image concrète de l’hébreu.
- source_word: בְּטוֹבַת
  choice: le bonheur de
  rationale: טוֹבָה désigne ici le bien-être et la situation heureuse accordés au peuple. « Bonheur » est naturel en français et plus large que la seule prospérité matérielle.
- source_word: בְּחִירֶיךָ
  choice: ceux que tu as choisis
  rationale: Cette formulation transparente rend le pluriel sans la charge doctrinale que pourrait prendre « tes élus ».
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: que je me réjouisse de la joie de
  rationale: La tournure conserve l’écho étymologique entre le verbe et le nom hébreux tout en restant intelligible en français.
- source_word: גּוֹיֶךָ
  choice: ta nation
  rationale: גּוֹי signifie directement « nation » et souligne ici l’identité collective d’Israël; « ton peuple » demeure une possibilité contextuelle.
- source_word: לְהִתְהַלֵּל
  choice: que je me glorifie
  rationale: Le hitpael de הלל peut exprimer le fait de se glorifier, de tirer fierté ou d’exulter. Dans ce contexte positif, « me glorifie » garde la dignité du registre sans suggérer nécessairement une vantardise condamnable.
- source_word: עִם נַחֲלָתֶךָ
  choice: avec ton héritage
  rationale: עִם marque l’association, tandis que נַחֲלָה est un terme d’alliance désignant le peuple comme héritage ou possession de Dieu.
theological_decisions:
- issue: Rendre les trois désignations d’alliance sans les confondre ni importer un système doctrinal postérieur
  choice: ceux que tu as choisis … ta nation … ton héritage
  alternative: tes élus … ton peuple … ton patrimoine
  rationale: Le texte accumule trois termes distincts pour Israël. La traduction maintient leurs différences et évite « élus » dans le texte principal, terme susceptible de recevoir en français une portée systématique plus étroite.
- issue: Sens positif de לְהִתְהַלֵּל
  choice: que je me glorifie
  alternative: que j’exulte / que je sois fier
  rationale: Le contexte présente une participation joyeuse à l’identité du peuple de Dieu, non une vantardise réprouvée; la formulation conserve néanmoins la tension propre au verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure ternaire et les termes identitaires distincts de l’hébreu sont conservés. Les marqueurs [a] et [b] figurent dans le texte principal.
