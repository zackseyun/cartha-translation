  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: fr
  text: Mais ils se mêlèrent aux nations[a] et apprirent leurs pratiques[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se mêlèrent parmi les nations ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leurs actes » ou « leurs œuvres »; il s’agit ici des manières d’agir habituelles des nations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: ils se mêlèrent
  rationale: Le hitpael de ערב exprime ici le fait de se mêler ou de s’associer à d’autres peuples. « Se mêlèrent » est naturel, concis et conserve la portée sociale du verbe sans expliciter davantage l’assimilation.
- source_word: בַגּוֹיִם
  choice: aux nations
  rationale: גּוֹיִם désigne ici les peuples non israélites environnants. Avec « se mêler », la préposition française « à » donne une formulation idiomatique. « Nations » évite les connotations plus tardives de « païens » ou « Gentils ».
- source_word: וַיִּלְמְדוּ
  choice: apprirent
  rationale: Le qal indique simplement qu’ils apprirent. La tournure active maintient leur responsabilité dans l’adoption de ces comportements.
- source_word: מַעֲשֵׂיהֶם
  choice: leurs pratiques
  rationale: Le terme signifie littéralement « leurs actes » ou « leurs œuvres », mais il désigne ici les manières d’agir habituelles des nations. « Pratiques » rend ce sens clairement sans limiter indûment la référence aux seuls rites religieux.
theological_decisions:
- issue: Portée morale et religieuse de l’association d’Israël avec les nations
  choice: Exprimer une association suivie de l’apprentissage de leurs pratiques, sans ajouter de condamnation explicite.
  alternative: « Ils se souillèrent au contact des nations » ou, à l’inverse, « ils habitèrent parmi les nations ».
  rationale: L’hébreu énonce le mélange et l’apprentissage; le contexte du psaume en donne l’évaluation négative. La traduction ne doit ni accentuer cette condamnation ni neutraliser la responsabilité suggérée par la formulation active.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif poétique du psaume. Les termes « nations » et « pratiques » restent accessibles tout en conservant la sobriété et l’ambiguïté du texte hébreu.
