  yaml_path: translation/ot/psalms/106/014.yaml
  text: But they craved intensely in the wilderness[b][a], and tested God in the wasteland.
translation:
  language: fr
  text: Mais, dans le désert, ils furent saisis d’une convoitise ardente[a] et mirent Dieu à l’épreuve dans la contrée désolée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils désirèrent un désir » ; l’hébreu emploie un verbe et un nom de même racine pour souligner l’intensité de leur désir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le lieu désolé ». Le terme hébreu évoque une étendue déserte et inhabitable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: ils se laissèrent emporter par leurs convoitises
  rationale: Le verbe et son complément de même racine forment une expression emphatique, littéralement « ils convoitèrent une convoitise ». Cette formulation française naturelle conserve l’intensité et la désapprobation implicite sans limiter le sens au domaine sexuel.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici l’espace désertique où Israël séjourne; « désert » est clair, courant et conforme au contexte narratif.
- source_word: וַיְנַסּוּ
  choice: mirent à l’épreuve
  rationale: נסה signifie soumettre à une épreuve ou chercher à éprouver. « Mettre à l’épreuve » rend naturellement l’action provocatrice décrite ici.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, le titre divin אֵל se traduit naturellement et sans surcharge interprétative par « Dieu ».
- source_word: בִּישִׁימוֹן
  choice: dans la terre aride
  rationale: יְשִׁימוֹן évoque un lieu désert, désolé et stérile. « Terre aride » préserve cette nuance tout en distinguant ce terme de מִדְבָּר.
theological_decisions:
- issue: Rendre littéralement ou idiomatiquement l’expression emphatique וַיִּתְאַוּוּ תַאֲוָה
  choice: La rendre idiomatiquement par « ils se laissèrent emporter par leurs convoitises »
  alternative: « ils convoitèrent une convoitise » ou « ils désirèrent intensément »
  rationale: Le tour hébreu intensifie un désir répréhensible. La traduction retenue communique cette force en français actuel sans introduire une connotation exclusivement sexuelle ni atténuer la faute d’Israël.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux propositions est conservé; les deux termes hébreux désignant le milieu désertique sont différenciés en français.
