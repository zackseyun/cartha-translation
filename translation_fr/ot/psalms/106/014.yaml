  source_fidelity: La première proposition rend bien l’intensification produite par le verbe et son accusatif cognat, et les deux désignations hébraïques du désert restent distinguées. Toutefois, « se laissèrent emporter par leurs convoitises » ajoute l’idée qu’ils ont cédé à une impulsion et met le nom au pluriel; le texte hébreu exprime plutôt une convoitise/désir particulièrement intense. « Furent saisis d’une convoitise ardente » restitue naturellement cette force en français, sans spécialiser le désir au domaine sexuel.
  naturalness: Le texte révisé est fluide et digne en français international moderne. « Contrée désolée » rend plus directement la nuance de יְשִׁימוֹן que « terre aride », sans répéter « désert ».
  terminology: « Dieu » convient pour אֵל dans ce contexte. « Mettre Dieu à l’épreuve » est fidèle à נסה et conserve la portée provocatrice sans interprétation doctrinale additionnelle. « Convoitise ardente » exprime l’emphase du tour cognat tout en évitant une lecture exclusivement sexuelle.
