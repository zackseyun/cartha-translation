source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם מִ/יַּ֣ד שׂוֹנֵ֑א וַ֝/יִּגְאָלֵ֗/ם מִ/יַּ֥ד אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: fr
  text: Il les sauva de la main de celui qui les haïssait[a], il les racheta de la main de l’ennemi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de celui qui avait de la haine pour eux ». L’hébreu emploie un singulier, qui peut désigner une puissance ennemie particulière ou représentative.
    reason: ambiguity
  - marker: b
    text: '« Racheta » peut aussi se traduire ici par « délivra » : le verbe hébreu évoque l’intervention de celui qui reprend ou libère quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Il les sauva
  rationale: Le verbe ישׁע exprime ici le fait d’arracher à un danger. « Sauva » est naturel, précis et conserve la portée théologique du terme.
- source_word: מִיַּד
  choice: de la main de
  rationale: L’expression hébraïque désigne le pouvoir ou la domination de quelqu’un. L’image de la main demeure claire et idiomatique en français biblique moderne.
- source_word: שׂוֹנֵא
  choice: celui qui les haïssait
  rationale: Le participe substantivé est au singulier. Cette formulation préserve ce singulier ainsi que la référence aux personnes sauvées, sans l’aplanir en un pluriel.
- source_word: וַיִּגְאָלֵם
  choice: il les racheta
  rationale: Le verbe גאל évoque la délivrance accomplie par l’intervention d’un libérateur qui reprend ou revendique les siens. « Racheta » conserve cette nuance distincte de « sauva ».
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier défini rend directement l’hébreu et maintient le parallélisme avec « celui qui les haïssait ».
theological_decisions:
- issue: Faut-il ramener ישׁע et גאל à une seule idée générique de délivrance ?
  choice: 'Maintenir deux verbes distincts : « sauva » et « racheta »'
  alternative: Traduire les deux verbes par « délivra »
  rationale: L’hébreu associe deux termes proches mais non identiques. Les distinguer respecte le parallélisme poétique et la tension entre sauvetage et rachat, sans préciser indûment le mécanisme de ce dernier.
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient au récit poétique. La répétition de « de la main de » et les deux verbes de délivrance sont conservés pour respecter le parallélisme hébreu.
