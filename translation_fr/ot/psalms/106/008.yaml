id: PSA.106.8
reference: Psalms 106:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם לְמַ֣עַן שְׁמ֑/וֹ לְ֝/הוֹדִ֗יעַ אֶת גְּבוּרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: fr
  text: Pourtant[a], il les sauva à cause de son nom[b], afin de faire connaître sa puissance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et il les sauva » ou « Mais il les sauva ». La conjonction hébraïque peut se traduire de plusieurs manières ; ici, le contexte marque un contraste avec le verset précédent.
    reason: lexical_alternative
  - marker: b
    text: L’expression « à cause de son nom » peut aussi se comprendre comme « pour sa réputation » ; toutefois, en hébreu, le « nom » évoque plus largement l’identité révélée, l’honneur et le caractère de Dieu.
    reason: lexical_alternative
  - marker: c
    text: Ou « sa force ». Le terme hébreu peut aussi évoquer les actes puissants de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Pourtant, il les sauva
  rationale: Le verbe ישׁע signifie « sauver, délivrer ». Le contexte oppose l’intervention de Dieu à la rébellion évoquée au verset précédent ; « pourtant » rend cette valeur adversative sans l’imposer comme seul sens possible de la conjonction hébraïque.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Avec « son nom », לְמַעַן exprime ici le motif de l’action. « À cause de son nom » reste proche de l’hébreu et demeure naturel en français biblique moderne.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: Conserver « nom » maintient toute la portée de l’expression hébraïque, qui englobe la réputation, l’honneur, l’identité révélée et le caractère de Dieu.
- source_word: לְהוֹדִיעַ
  choice: afin de faire connaître
  rationale: 'L’infinitif hiphil de ידע est causatif : « faire connaître ». « Afin de » explicite naturellement en français la relation de but portée par לְ.'
- source_word: אֶת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct en hébreu et n’a pas d’équivalent lexical distinct en français.
- source_word: גְּבוּרָתוֹ
  choice: sa puissance
  rationale: גְּבוּרָה peut désigner la force, la puissance ou les exploits. Dans cette proposition, le nom abstrait « puissance » exprime clairement la capacité souveraine manifestée par le salut.
theological_decisions:
- issue: Sens de « à cause de son nom »
  choice: L’acte sauveur de Dieu a pour motif l’honneur et la révélation de son nom, c’est-à-dire de son identité et de son caractère.
  alternative: Dieu agit uniquement pour préserver sa réputation publique.
  rationale: Le « nom » inclut la réputation, mais ne s’y réduit pas. La formulation littérale préserve la richesse théologique et l’ambiguïté féconde de l’expression hébraïque sans introduire une interprétation confessionnelle particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit poétique rétrospectif du psaume. « Pourtant » rend le contraste contextuel, tandis que la note maintient les autres valeurs possibles de la conjonction. La syntaxe reste concise et parallèle à celle de l’hébreu.
