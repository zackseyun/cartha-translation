source:
  edition: WLC
  text: וַ֭/יִּצָּ֣מְדוּ לְ/בַ֣עַל פְּע֑וֹר וַ֝/יֹּאכְל֗וּ זִבְחֵ֥י מֵתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/028.yaml
  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: fr
  text: Ils se sont attachés au Baal de Péor[a] et ont mangé les sacrifices des morts[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sont liés au Baal de Péor ». Le verbe exprime un attachement étroit.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les sacrifices des morts ». L’expression peut désigner des sacrifices offerts à des idoles sans vie ou des rites associés aux défunts.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: se sont attachés
  rationale: Le verbe צמד exprime une union ou un attachement étroit. La tournure pronominale française restitue naturellement l’engagement volontaire du sujet sans imposer l’image plus précise d’un joug.
- source_word: לְבַעַל פְּעוֹר
  choice: au Baal de Péor
  rationale: Cette formulation désigne la divinité associée à Péor et conserve les noms Baal et Péor. L’article contracté « au » convient à l’expression française « le Baal de Péor ».
- source_word: וַיֹּאכְלוּ
  choice: et ont mangé
  rationale: Le passé composé est naturel dans une narration française moderne et rend simplement l’action successive exprimée par la forme verbale hébraïque.
- source_word: זִבְחֵי
  choice: les sacrifices
  rationale: Le nom désigne des sacrifices ou offrandes sacrificielles. « Les sacrifices » reste proche de la formulation hébraïque sans préciser indûment qu’il s’agit des repas ou des offrandes elles-mêmes.
- source_word: מֵתִים
  choice: des morts
  rationale: Littéralement « des morts ». Cette expression préserve l’ambiguïté entre des idoles ou dieux présentés comme sans vie et des rites liés aux défunts.
theological_decisions:
- issue: Référent de « morts » dans זִבְחֵי מֵתִים
  choice: Conserver « les sacrifices des morts » sans identifier davantage le référent.
  alternative: « les sacrifices offerts aux morts », « les sacrifices des dieux morts » ou « les sacrifices offerts à des idoles sans vie »
  rationale: La construction hébraïque dit littéralement « sacrifices des morts » et ne précise ni la nature exacte du rapport exprimé, ni si les « morts » sont des défunts, des divinités sans vie ou des idoles. Le texte principal maintient donc cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé composé assure une narration naturelle ; « le Baal de Péor » reste clair pour le lecteur courant. La formulation littérale « sacrifices des morts » est maintenue dans le texte afin de ne pas résoudre l’ambiguïté de l’hébreu.
