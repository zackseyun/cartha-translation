source:
  edition: WLC
  text: וַ/יְכַסּוּ מַ֥יִם צָרֵי/הֶ֑ם אֶחָ֥ד מֵ֝/הֶ֗ם לֹ֣א נוֹתָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: fr
  text: Les eaux recouvrirent leurs adversaires[a] ; pas un seul d’entre eux ne resta[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs ennemis ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pas un d’entre eux ne resta » ou « ne fut laissé ».'
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: recouvrirent
  rationale: Le verbe כסה signifie « couvrir, recouvrir ». Dans le contexte de la mer, « recouvrirent » exprime naturellement l’action concrète des eaux sans adopter le sens plus interprétatif de « submergèrent ».
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel hébreu est conservé. L’article défini est naturel en français puisqu’il s’agit des eaux de la mer évoquées dans le contexte.
- source_word: צָרֵיהֶם
  choice: leurs adversaires
  rationale: צָר désigne des personnes hostiles ou des ennemis. « Adversaires » reste proche de cette valeur lexicale sans préciser davantage leur identité.
- source_word: אֶחָד מֵהֶם
  choice: pas un seul d’entre eux
  rationale: Littéralement « un d’entre eux » sous la négation. Cette formulation française exprime clairement et avec force qu’aucun ne fit exception.
- source_word: לֹא נוֹתָר
  choice: ne resta
  rationale: Le nifal de יתר signifie « rester, être laissé ». « Ne resta » conserve cette idée, tandis que « ne survécut » expliciterait davantage que l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif et poétique du psaume. Le parallélisme bref de l’hébreu est préservé, avec une légère explicitation idiomatique (« pas un seul »).
