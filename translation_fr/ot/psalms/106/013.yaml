  text: מִֽ֭הֲרוּ שָׁכְח֣וּ מַעֲשָׂ֑י/ו לֹֽא חִ֝כּ֗וּ לַ/עֲצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/013.yaml
  text: They quickly forgot his works[a]; they did not wait for his counsel.
translation:
  language: fr
  text: Ils oublièrent vite ses œuvres ; ils n’attendirent pas son conseil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son dessein » ou « son projet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִהֲרוּ
  choice: se hâtèrent de
  rationale: Le verbe exprime la hâte plutôt qu’une simple succession temporelle. La tournure française « se hâtèrent de » restitue directement cette nuance et reste naturelle dans un registre poétique digne.
- source_word: שָׁכְחוּ
  choice: oublier
  rationale: Après « se hâtèrent de », l’infinitif français rend naturellement le qatal hébreu dans ce récit poétique.
- source_word: מַעֲשָׂיו
  choice: ses œuvres
  rationale: « Œuvres » conserve la forme concise et le registre biblique de מַעֲשִׂים, en désignant ici les actes accomplis par Dieu.
- source_word: לֹא חִכּוּ
  choice: ils n’attendirent pas
  rationale: Traduction directe et idiomatique de la négation suivie du piel de חכה, « attendre ».
- source_word: לַעֲצָתוֹ
  choice: son conseil
  rationale: עֵצָה peut désigner le conseil, le dessein ou le projet. « Conseil » préserve ici la largeur sémantique et l’idée de direction divine sans réduire le terme à un décret arrêté.
theological_decisions:
- issue: Sens de עֵצָה appliqué à Dieu dans ce contexte
  choice: son conseil
  alternative: son dessein ou son projet
  rationale: « Conseil » maintient la dimension relationnelle de la direction divine tout en laissant ouverte la possibilité d’un dessein. Cette formulation évite de trancher en faveur d’une conception théologique plus étroite.
translation_notes:
  register: Français moderne, soutenu mais accessible. Le parallélisme est conservé, ainsi que la nuance de hâte portée par le premier verbe. Le point-virgule reproduit l’articulation nette des deux membres du vers.
