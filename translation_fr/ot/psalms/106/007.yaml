  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: fr
  text: Nos pères, en Égypte, n’ont pas compris tes actes merveilleux ; ils ne se sont pas souvenus de l’abondance de ton amour fidèle, mais ils se sont révoltés près de la mer — la mer des Roseaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « mer Rouge ». L’hébreu Yam Souf signifie littéralement « mer des Roseaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: Nos pères
  rationale: Rend directement le terme familial masculin « nos pères », qui désigne collectivement les générations précédentes d’Israël.
- source_word: הִשְׂכִּילוּ
  choice: n’ont pas compris
  rationale: Le hiphil de שׂכל exprime ici le manque d’intelligence ou de discernement devant les actes de Dieu ; « comprendre » reste naturel sans expliciter excessivement l’objet de ce discernement.
- source_word: נִפְלְאוֹתֶיךָ
  choice: tes actes merveilleux
  rationale: Le nom désigne les interventions extraordinaires de Dieu plutôt que de simples phénomènes abstraits.
- source_word: רֹב חֲסָדֶיךָ
  choice: l’abondance de ton amour fidèle
  rationale: רֹב marque l’abondance, tandis que חֶסֶד évoque un amour loyal, durable et bienveillant ; cette formulation conserve ces dimensions sans employer un vocabulaire archaïque.
- source_word: וַיַּמְרוּ
  choice: mais ils se sont révoltés
  rationale: מרה signifie se rebeller ou se révolter. « Mais » exprime naturellement le contraste avec les actes merveilleux et l’amour de Dieu mentionnés auparavant.
- source_word: עַל יָם בְּיַם סוּף
  choice: près de la mer, à la mer des Roseaux
  rationale: Les deux groupes prépositionnels sont conservés comme désignation appositive du lieu. « Mer des Roseaux » traduit le plus directement יַם סוּף, tandis que l’appellation traditionnelle est signalée en note.
theological_decisions:
- issue: Sens de חֶסֶד
  choice: amour fidèle
  alternative: bonté ; miséricorde ; amour loyal
  rationale: « Amour fidèle » conserve à la fois la bienveillance et la constance relationnelle ou d’alliance du terme, sans réduire son sens à la seule compassion.
- issue: Toponyme יַם סוּף
  choice: mer des Roseaux
  alternative: mer Rouge
  rationale: Le texte hébreu associe יָם, « mer », à סוּף, « roseaux ». La traduction traditionnelle « mer Rouge » est connue mais ne reproduit pas directement la forme hébraïque ; elle est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation garde le mouvement poétique de la phrase, et la répétition « près de la mer, à la mer… » reflète l’apposition emphatique de l’hébreu malgré sa légère étrangeté en français.
