  text: Ils sacrifièrent leurs fils et leurs filles aux démons.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: Ils sacrifièrent
  rationale: Le verbe זבח désigne ici l’action d’offrir par sacrifice. « Sacrifièrent » est naturel, concis et conserve le sens cultuel.
- source_word: בְּנֵיהֶם
  choice: leurs fils
  rationale: Le pluriel construit de בֵּן désigne précisément les fils; le rendre ainsi préserve la formulation sexuée de l’hébreu.
- source_word: וְאֶת בְּנוֹתֵיהֶם
  choice: et leurs filles
  rationale: בַּת signifie « fille ». La coordination « leurs fils et leurs filles » conserve l’insistance et l’étendue de l’accusation.
- source_word: לַשֵּׁדִים
  choice: aux démons
  rationale: שֵׁדִים désigne des êtres démoniaques. La préposition ל marque ici les destinataires du sacrifice, et l’article contracté est naturellement rendu par « aux ».
theological_decisions:
- issue: Sens de שֵׁדִים
  choice: démons
  alternative: faux dieux ; esprits mauvais
  rationale: « Démons » conserve l’affirmation du texte concernant des êtres spirituels sans réduire le terme à de simples idoles ni ajouter de précisions spéculatives.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif et poétique du psaume; la structure parallèle de l’hébreu est conservée.
