source:
  edition: WLC
  text: וַ/יָּמִ֥ירוּ אֶת כְּבוֹדָ֑/ם בְּ/תַבְנִ֥ית שׁ֝֗וֹר אֹכֵ֥ל עֵֽשֶׂב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/020.yaml
  text: They exchanged their glory for the image of an ox that eats grass[a][b].
translation:
  language: fr
  text: Ils échangèrent leur gloire contre l’image d’un bœuf[a] qui mange de l’herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « taureau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Ils échangèrent
  rationale: 'Le verbe מוּר exprime ici l’échange ou la substitution : Israël abandonne une réalité pour en adopter une autre.'
- source_word: כְּבוֹדָם
  choice: leur gloire
  rationale: Cette traduction conserve l’expression hébraïque, dont Dieu est le référent implicite dans le contexte, sans expliciter celui-ci dans le texte principal.
- source_word: בְּתַבְנִית
  choice: contre l’image d’un
  rationale: תַּבְנִית peut désigner une forme, une représentation ou une image. Avec « échangèrent », « contre l’image d’un » rend naturellement le remplacement idolâtre.
- source_word: שׁוֹר
  choice: bœuf
  rationale: שׁוֹר désigne un bovin et peut se traduire par « bœuf » ou « taureau ». « Bœuf » convient au contraste avec l’animal qui mange de l’herbe, sans introduire le terme hébreu habituel pour « veau ».
- source_word: אֹכֵל עֵשֶׂב
  choice: qui mange de l’herbe
  rationale: La proposition relative rend naturellement le participe hébreu et préserve l’ironie qui souligne la condition animale de l’idole.
theological_decisions:
- issue: Référent de « leur gloire »
  choice: Conserver « leur gloire » dans le texte principal.
  alternative: « leur Dieu glorieux » ou « Dieu »
  rationale: Le contexte désigne Dieu, mais l’hébreu emploie l’expression suggestive « leur gloire ». La conserver maintient son ambiguïté formelle et sa portée théologique.
translation_notes:
  register: 'Français moderne, naturel et digne. Le passé simple convient au registre narratif et poétique du psaume. Une seule note est retenue : en français, une note expliquant « leur Dieu glorieux » risquerait de présenter comme simple sens lexical ce qui relève plutôt du référent contextuel de « leur gloire ».'
