id: PSA.106.2
reference: Psalms 106:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֗י יְ֭מַלֵּל גְּבוּר֣וֹת יְהוָ֑ה יַ֝שְׁמִ֗יעַ כָּל תְּהִלָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: fr
  text: Qui peut raconter les hauts faits de Yahweh et faire entendre toute sa louange[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proclamer toute sa louange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Qui peut
  rationale: Le pronom interrogatif introduit une question rhétorique portant implicitement sur la capacité humaine ; « Qui peut » l’exprime naturellement en français.
- source_word: יְמַלֵּל
  choice: raconter
  rationale: Le piel de מלל désigne ici l’action de dire ou de relater ; « raconter » convient aux actes puissants accomplis par Dieu tout en restant accessible.
- source_word: גְּבוּרוֹת
  choice: hauts faits
  rationale: Le pluriel désigne des manifestations concrètes de puissance. « Hauts faits » rend ce sens avec un registre poétique et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: יַשְׁמִיעַ
  choice: faire entendre
  rationale: Le hiphil de שמע signifie littéralement « faire entendre ». Cette formulation française conserve clairement la valeur causative de l’hébreu.
- source_word: כָּל
  choice: toute
  rationale: Le terme conserve la portée totalisante de l’hébreu et souligne l’impossibilité d’exprimer exhaustivement la louange de Dieu.
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: Le singulier hébreu avec suffixe possessif est maintenu ; en français, « sa louange » peut désigner collectivement tout ce qui proclame combien il est digne d’être loué.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme. La translittération préserve le nom personnel sans lui substituer un titre traditionnel.
- issue: Portée de « toute sa louange »
  choice: Conserver l’expression sans préciser s’il s’agit de toute la louange qui lui est due ou de tous ses sujets de louange
  alternative: tous les motifs de le louer
  rationale: Le singulier collectif hébreu demeure ouvert ; une explicitation résoudrait une nuance que le texte ne tranche pas.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. « Hauts faits » garde la solennité du psaume ; « faire entendre » préserve l’image causative de l’hébreu.
