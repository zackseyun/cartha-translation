  text: They made a calf at Horeb and bowed down to a cast image[a][b].
translation:
  language: fr
  text: Ils fabriquèrent un veau à l’Horeb et se prosternèrent devant une image en métal coulé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une image moulée ». Le terme hébreu désigne une image coulée, habituellement en métal.
    reason: lexical_alternative
  - marker: b
    text: Ce verset rappelle l’épisode du veau à Horeb/Sinaï en Exode 32.
    reason: cross_reference
lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: Ils fabriquèrent
  rationale: Le qal de עשה signifie couramment « faire ». Dans le contexte de la production d’un objet, « fabriquer » est naturel en français et n’ajoute pas l’idée absente du texte qu’ils l’auraient fait expressément pour eux-mêmes.
- source_word: עֵגֶל
  choice: un veau
  rationale: עֵגֶל désigne un veau ou un jeune bovin. « Un veau » conserve le lien avec l’épisode de l’Exode sans ajouter « d’or », détail non exprimé dans ce verset.
- source_word: בְּחֹרֵב
  choice: à l’Horeb
  rationale: La préposition ב marque ici le lieu. « À l’Horeb » est la formulation française consacrée et naturelle pour ce site montagneux.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: et se prosternèrent
  rationale: La forme verbale de שחה exprime l’action de s’incliner ou de se prosterner en hommage. « Se prosternèrent » préserve l’acte physique tout en laissant le contexte manifester sa portée cultuelle.
- source_word: לְמַסֵּכָה
  choice: devant une statue de métal fondu
  rationale: מַסֵּכָה désigne une représentation obtenue par fonte et moulage, généralement en métal. « Statue de métal fondu » rend cette précision concrètement et dans un français courant; la préposition « devant » convient idiomatiquement au geste de prosternation.
theological_decisions:
- issue: Faut-il expliciter que le veau était en or ?
  choice: Conserver « un veau » sans ajouter « d’or ».
  alternative: un veau d’or
  rationale: Même si Exode 32 précise la matière de l’objet, le présent verset dit seulement « un veau » puis le qualifie de représentation fondue. Ajouter « d’or » importerait dans le texte un détail tiré du contexte plus large.
- issue: Faut-il traduire le geste directement par « adorèrent » ?
  choice: se prosternèrent
  alternative: adorèrent
  rationale: Le verbe hébreu nomme d’abord un geste de prosternation, dont la valeur idolâtre ressort clairement du contexte. La traduction retenue évite de remplacer ce geste concret par sa seule interprétation cultuelle.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif poétique du psaume. « Statue » est ici pris au sens large de représentation façonnée; la note conserve la nuance technique du procédé de fonte.
