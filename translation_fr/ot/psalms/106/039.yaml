  yaml_path: translation/ot/psalms/106/039.yaml
  text: So they became unclean by their deeds[a], and they prostituted themselves by their acts.
translation:
  language: fr
  text: Ils se rendirent impurs par leurs œuvres et se prostituèrent par leurs agissements.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils furent infidèles par leurs pratiques ». L’hébreu emploie une image sexuelle pour évoquer l’infidélité morale et religieuse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: se rendirent impurs
  rationale: Le verbe טמא exprime ici l’entrée dans un état d’impureté. La tournure pronominale française préserve la valeur résultative sans introduire d’agent extérieur.
- source_word: בְמַעֲשֵׂיהֶם
  choice: par leurs œuvres
  rationale: מַעֲשֶׂה désigne les œuvres ou les actes; « par » rend naturellement la valeur instrumentale ou causale de בְּ.
- source_word: וַיִּזְנוּ
  choice: se prostituèrent
  rationale: זנה conserve une image sexuelle forte, employée dans ce contexte pour évoquer l’infidélité morale et religieuse. « Se prostituèrent » maintient cette image sans la réduire à une interprétation explicative.
- source_word: בְמַעַלְלֵיהֶם
  choice: par leurs agissements
  rationale: מַעֲלָל désigne des actes ou des pratiques, souvent avec une nuance morale défavorable. « Agissements » restitue cette coloration tout en préservant la variation poétique avec « œuvres ».
theological_decisions:
- issue: Faut-il rendre זנה directement comme une infidélité envers Dieu ou conserver la métaphore sexuelle ?
  choice: 'Conserver dans le texte la métaphore : « se prostituèrent »'
  alternative: « furent infidèles »
  rationale: Le contexte concerne la corruption idolâtre d’Israël, mais l’hébreu exprime cette infidélité au moyen d’une image sexuelle. La traduction conserve donc l’image et laisse la note en préciser la portée morale et religieuse.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif et poétique du psaume. La variation « œuvres / agissements » reflète les deux noms hébreux distincts.
