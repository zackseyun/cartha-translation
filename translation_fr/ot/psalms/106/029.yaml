  text: וַ֭/יַּכְעִיסוּ בְּ/מַֽעַלְלֵי/הֶ֑ם וַ/תִּפְרָץ בָּ֝֗/ם מַגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/029.yaml
  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: fr
  text: Ils provoquèrent sa colère par leurs actes[a], et un fléau éclata parmi eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils l’irritèrent par leurs agissements. » L’objet du verbe n’est pas exprimé en hébreu; le contexte renvoie à Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: Ils l’irritèrent
  rationale: Le hifil de כעס exprime le fait de provoquer l’irritation ou la colère. « Irritèrent » restitue naturellement cette valeur causative en français. Le pronom « l’ » renvoie à Dieu d’après le contexte, bien que l’objet ne soit pas exprimé en hébreu.
- source_word: בְּמַעַלְלֵיהֶם
  choice: par leurs actes
  rationale: מַעֲלָלִים désigne des actes ou des agissements, avec ici une portée morale négative donnée par le contexte. La préposition בְּ indique le moyen.
- source_word: וַתִּפְרָץ
  choice: éclata
  rationale: Le verbe פרץ évoque une irruption soudaine. Avec un fléau pour sujet, « éclata » est idiomatique et conserve cette force d’irruption.
- source_word: בָּם
  choice: parmi eux
  rationale: La préposition בְּ indique ici que le fléau se manifesta au sein du groupe. « Parmi eux » est naturel et évite de préciser indûment « contre eux ».
- source_word: מַגֵּפָה
  choice: un fléau
  rationale: מַגֵּפָה peut désigner une plaie meurtrière ou un fléau frappant en jugement. « Fléau » convient au registre poétique et ne restreint pas nécessairement le sens à une épidémie.
theological_decisions:
- issue: Objet divin implicite du verbe « irritèrent »
  choice: Employer « l’ », compris comme renvoyant à Dieu
  alternative: Traduire « ils provoquèrent la colère » sans objet personnel explicite
  rationale: L’hébreu ne formule pas l’objet, mais le contexte du psaume désigne clairement Dieu comme celui que les actes du peuple irritent. Le pronom rend la phrase française naturelle sans introduire un nom divin absent du verset.
translation_notes:
  register: Français moderne, sobre et poétique. « Irritèrent » et « fléau éclata » gardent la force du texte sans archaïsme marqué; la note signale à la fois une autre formulation possible et l’objet implicite de l’hébreu.
