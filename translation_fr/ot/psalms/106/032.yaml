  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: fr
  text: Ils suscitèrent la colère aux eaux de Meriba[a][b], et il en résulta du mal pour Moïse à cause d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba signifie « querelle » ou « dispute ».
    reason: cultural_note
  - marker: b
    text: 'Ou : « Ils le mirent en colère aux eaux de Meriba. » Dans cette ligne, l’hébreu ne précise pas explicitement qui est l’objet de la provocation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: Ils provoquèrent la colère
  rationale: Le hifil de קצף exprime le fait de susciter la colère. Cette formulation conserve la valeur causative sans préciser qui se met en colère, puisque l’objet n’est pas exprimé dans l’hébreu.
- source_word: עַל
  choice: aux
  rationale: Avec un lieu ou un événement, « aux eaux de Meriba » situe naturellement la provocation en français tout en restant proche de la construction hébraïque.
- source_word: מֵי מְרִיבָה
  choice: les eaux de Meriba
  rationale: Meriba est conservé comme nom propre, tandis que la relation construite est rendue directement par « les eaux de ».
- source_word: וַיֵּרַע
  choice: cela tourna mal
  rationale: Cette tournure française naturelle rend le sens défavorable et quasi impersonnel du verbe sans suggérer que Moïse serait lui-même devenu mauvais.
- source_word: לְמֹשֶׁה
  choice: pour Moïse
  rationale: Le לְ désigne ici la personne touchée par l’issue défavorable; « pour Moïse » convient à l’expression « cela tourna mal ».
- source_word: בַּעֲבוּרָם
  choice: à cause d’eux
  rationale: Dans ce contexte, l’expression indique la cause et relie le sort défavorable de Moïse aux actes du peuple.
theological_decisions:
- issue: Nature du sort défavorable de Moïse
  choice: Le verset affirme que la provocation du peuple eut une issue défavorable pour Moïse, sans en donner ici toute l’explication théologique.
  alternative: Comprendre soit que le verset renvoie principalement à la faute de Moïse à Meriba, soit qu’il souligne uniquement la culpabilité du peuple.
  rationale: L’hébreu dit simplement que cela tourna mal pour Moïse à cause d’eux. La traduction préserve la tension entre la responsabilité du peuple et celle de Moïse, que le contexte plus large permet d’examiner.
translation_notes:
  register: Français international moderne, naturel et digne. « Cela tourna mal pour Moïse » rend l’issue défavorable sans durcir le texte en jugement moral explicite; « provoquèrent la colère » conserve l’ambiguïté sur la personne mise en colère.
