  text: וַ/יִּתֵּ֣ן אוֹתָ֣/ם לְ/רַחֲמִ֑ים לִ֝/פְנֵ֗י כָּל שׁוֹבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/046.yaml
  text: He caused them to receive compassion before all who had taken them captive.
translation:
  language: fr
  text: Il fit en sorte que tous ceux qui les avaient emmenés captifs aient compassion d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן אוֹתָם לְרַחֲמִים
  choice: Il fit en sorte… aient compassion d’eux
  rationale: 'Littéralement, Dieu « les donna aux compassions » : l’expression idiomatique signifie qu’il leur accorda de susciter la compassion. Cette formulation française naturelle conserve la causalité divine.'
- source_word: לִפְנֵי כָּל שׁוֹבֵיהֶם
  choice: tous ceux qui les avaient emmenés captifs
  rationale: לִפְנֵי marque ici la relation avec leurs ravisseurs, et שׁוֹבֵיהֶם désigne ceux qui les avaient capturés ou emmenés en captivité. Le plus-que-parfait situe naturellement cette action avant la compassion évoquée.
theological_decisions:
- issue: Action divine et compassion des ravisseurs
  choice: Dieu fait en sorte que les ravisseurs aient compassion d’eux
  alternative: Il leur accorda de trouver compassion auprès de tous ceux qui les avaient emmenés captifs
  rationale: Le texte attribue à Dieu l’initiative tout en présentant les ravisseurs comme ceux chez qui la compassion se manifeste. La traduction évite d’expliquer davantage le mode de cette action.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « emmenés captifs » rend le contexte d’exil sans alourdir le verset.
