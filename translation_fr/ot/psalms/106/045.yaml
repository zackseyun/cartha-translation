  text: וַ/יִּזְכֹּ֣ר לָ/הֶ֣ם בְּרִית֑/וֹ וַ֝/יִּנָּחֵ֗ם כְּ/רֹ֣ב חסד/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/045.yaml
  text: He remembered his covenant for their sake[a], and relented according to the abundance of his steadfast love.
translation:
  language: fr
  text: Il se souvint de son alliance en leur faveur et revint sur sa décision[a], selon l’abondance de son amour fidèle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se ravisa » ou « eut compassion ». Le verbe hébreu peut exprimer le fait de renoncer à une action projetée, de changer de disposition ou d’être ému de compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Il se souvint
  rationale: 'Dans un contexte d’alliance, זכר désigne plus qu’un simple souvenir mental : Dieu tient compte de son engagement et agit en conséquence. « Se souvint » conserve clairement cette résonance biblique.'
- source_word: לָהֶם
  choice: en leur faveur
  rationale: Le ל pronominal indique ici que Dieu se souvient de l’alliance à l’égard du peuple et pour son bien. « En leur faveur » exprime naturellement cette nuance en français.
- source_word: בְּרִיתוֹ
  choice: de son alliance
  rationale: « Alliance » est le terme français consacré pour בְּרִית et en préserve la portée relationnelle et théologique.
- source_word: וַיִּנָּחֵם
  choice: et revint sur sa décision[a]
  rationale: Le niphal de נחם peut exprimer un changement de conduite, le fait de renoncer à une action projetée ou un mouvement de compassion. « Revint sur sa décision » rend ici le changement réel dans la manière d’agir de Dieu sans effacer la tension anthropopathique du texte.
- source_word: כְּרֹב
  choice: tant … était grand
  rationale: La tournure française exprime idiomatiquement le degré ou la mesure indiqué par כ + רֹב, tout en reliant naturellement ce changement de conduite à la grandeur du חֶסֶד divin.
- source_word: חסדו
  choice: son amour fidèle
  rationale: חֶסֶד désigne un amour bienveillant, constant et loyal, particulièrement dans le cadre de l’alliance. « Amour fidèle » en restitue les dimensions affective et relationnelle dans un français moderne.
theological_decisions:
- issue: Langage anthropopathique appliqué à Dieu dans וַיִּנָּחֵם
  choice: revint sur sa décision
  alternative: se ravisa ; eut compassion
  rationale: La formulation retenue présente, comme l’hébreu, un véritable changement dans les actes de Dieu envers le peuple, sans expliquer à la place du texte comment ce changement s’articule avec les affirmations théologiques sur Dieu. La note conserve les autres nuances lexicales possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en relief « en leur faveur » sans alourdir la phrase. La proposition finale « tant son amour fidèle était grand » rend de façon idiomatique le rapport de mesure exprimé en hébreu.
