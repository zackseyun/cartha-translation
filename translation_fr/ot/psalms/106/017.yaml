  text: תִּפְתַּח אֶ֭רֶץ וַ/תִּבְלַ֣ע דָּתָ֑ן וַ֝/תְּכַ֗ס עַל עֲדַ֥ת אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: fr
  text: La terre s’ouvrit et engloutit Dathan[a], elle recouvrit le groupe d’Abiram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Nombres 16.31-33 pour le récit de ce jugement.
    reason: cross_reference
  - marker: b
    text: Ou « l’assemblée d’Abiram » ou « la communauté d’Abiram ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְתַּח
  choice: s’ouvrit
  rationale: Le qal à valeur narrative décrit ici un événement passé. « S’ouvrit » rend directement le verbe sans ajouter l’idée plus explicite de se fendre.
- source_word: אֶרֶץ
  choice: la terre
  rationale: Dans ce contexte, le mot désigne le sol qui s’ouvre sous les rebelles, et non un territoire.
- source_word: וַתִּבְלַע
  choice: et engloutit
  rationale: Le verbe בלע exprime l’action d’avaler ou d’engloutir. « Engloutit » est naturel et suffisamment évocateur en français.
- source_word: דָּתָן
  choice: Dathan
  rationale: Translittération française traditionnelle du nom propre.
- source_word: וַתְּכַס עַל
  choice: elle recouvrit
  rationale: Le verbe כסה suivi de עַל indique que la terre couvrit le groupe. La répétition du sujet sous forme pronominale assure une syntaxe française claire.
- source_word: עֲדַת
  choice: le groupe de
  rationale: Le nom construit עֵדָה désigne ici la collectivité associée à Abiram. « Groupe » est actuel et évite la coloration ecclésiastique possible de « congrégation ».
- source_word: אֲבִירָם
  choice: Abiram
  rationale: Translittération française traditionnelle du nom propre.
theological_decisions:
- issue: Rapport avec le récit plus développé de Nombres 16
  choice: Traduire uniquement le résumé poétique du psaume, qui nomme Dathan et le groupe d’Abiram.
  alternative: Ajouter les familles, les biens ou d’autres rebelles mentionnés dans Nombres 16.
  rationale: Le texte hébreu du verset ne donne pas ces précisions; les importer résoudrait ou développerait indûment son résumé poétique.
translation_notes:
  register: Français international moderne, sobre et poétique. Le passé simple convient au registre narratif élevé du psaume. « Groupe » reste accessible tout en conservant le caractère collectif de עֵדָה.
