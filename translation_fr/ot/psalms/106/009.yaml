source:
  edition: WLC
  text: וַ/יִּגְעַ֣ר בְּ/יַם ס֭וּף וַֽ/יֶּחֱרָ֑ב וַ/יּוֹלִיכֵ֥/ם בַּ֝/תְּהֹמ֗וֹת כַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/009.yaml
  text: He rebuked the Red Sea[a], and it dried up; he led them through the depths as through the wilderness.
translation:
  language: fr
  text: Il menaça la mer Rouge[a], et elle se dessécha ; il les conduisit à travers les profondeurs comme à travers un désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la mer des Roseaux ». Hébreu : yam souf.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְעַר
  choice: Il menaça
  rationale: Le verbe גער peut signifier « réprimander » ou « menacer ». Dans cette évocation poétique de l’autorité de Dieu sur les eaux, « menaça » conserve la personnification et son énergie, tout en étant plus naturel en français que « réprimanda la mer ».
- source_word: בְּיַם סוּף
  choice: la mer Rouge
  rationale: « Mer Rouge » est le nom traditionnel et immédiatement reconnaissable du lieu de l’exode en français. Le sens littéral possible « mer des Roseaux » est conservé en note.
- source_word: וַיֶּחֱרָב
  choice: elle se dessécha
  rationale: Le verbe חרב exprime ici le fait de devenir sec. Le passé simple convient au récit poétique et le pronom féminin reprend naturellement « la mer ».
- source_word: וַיּוֹלִיכֵם
  choice: il les conduisit
  rationale: La forme causative de הלך indique que Dieu les fit avancer ou les guida. « Conduisit » rend ce sens avec naturel et dignité.
- source_word: בַּתְּהֹמוֹת
  choice: à travers les profondeurs
  rationale: Le pluriel תְּהֹמוֹת désigne les profondeurs aquatiques. « À travers » exprime clairement le déplacement dans ce lieu sans effacer l’image poétique.
- source_word: כַּמִּדְבָּר
  choice: comme à travers un désert
  rationale: La comparaison présente les profondeurs marines comme un espace que l’on peut traverser à pied, à la manière d’un désert. L’article indéfini est idiomatique en français et ne transforme pas nécessairement le terme en référence géographique précise.
theological_decisions:
- issue: Désignation de יַם סוּף dans l’allusion à l’exode
  choice: la mer Rouge
  alternative: la mer des Roseaux
  rationale: « Mer Rouge » permet aux lecteurs francophones d’identifier sans difficulté l’événement de l’exode. Puisque l’analyse lexicale de l’expression hébraïque reste discutée, « mer des Roseaux » est signalé en note plutôt qu’écarté.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé simple correspond au registre narratif du psaume sans être archaïque. « Menaça » maintient la vive personnification des eaux et « profondeurs » préserve l’imagerie cosmique du texte hébreu.
