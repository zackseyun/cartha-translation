  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: fr
  text: Ils ont versé le sang innocent — le sang de leurs fils et de leurs filles, qu’ils ont sacrifiés aux idoles de Canaan — et le pays a été souillé par le sang versé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le pays a été souillé par ces meurtres » ou « par la culpabilité du sang ». L’hébreu emploie ici le pluriel de « sang », qui peut désigner le sang répandu, des meurtres ou la culpabilité qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: Ils ont versé
  rationale: « Verser le sang » restitue l’image concrète du verbe שׁפך tout en exprimant naturellement une mise à mort violente en français.
- source_word: דָם נָקִי
  choice: le sang innocent
  rationale: Cette expression française directe conserve le jugement moral explicite de l’hébreu sur le meurtre de victimes innocentes.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: le sang de leurs fils et de leurs filles
  rationale: La reprise de « sang » respecte l’apposition explicative de l’hébreu et souligne l’identité des victimes.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: qu’ils ont sacrifiés
  rationale: Le verbe זבח a ici son sens cultuel. L’accord au masculin pluriel suit l’ensemble coordonné « fils et filles ».
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: aux idoles de Canaan
  rationale: « Idoles » rend clairement la désignation polémique des objets cultuels; « de Canaan » conserve la relation géographique et culturelle sans la préciser davantage.
- source_word: וַתֶּחֱנַף
  choice: a été souillé
  rationale: Dans ce contexte, חנף décrit la souillure morale et religieuse du pays causée par le sang répandu. « Souillé » est naturel, digne et théologiquement évocateur.
- source_word: הָאָרֶץ
  choice: le pays
  rationale: Le contexte vise le territoire de Canaan plutôt que la terre entière; « pays » évite ici l’ambiguïté cosmique possible de « terre ».
- source_word: בַּדָּמִים
  choice: par le sang versé
  rationale: Le pluriel hébreu דמים peut évoquer le sang répandu, les meurtres ou la culpabilité liée au sang. Cette formulation s’intègre naturellement au verset et garde l’accent répété sur le sang.
theological_decisions:
- issue: Statut moral des victimes offertes en sacrifice
  choice: Leur mise à mort est explicitement qualifiée de versement de sang innocent.
  alternative: Le sang des innocents.
  rationale: La traduction conserve sans atténuation le jugement moral porté par דָם נָקִי, sans ajouter d’explication doctrinale.
- issue: Nature de la souillure du pays
  choice: Le pays a été souillé par le sang versé.
  alternative: Le pays a été souillé par la culpabilité du sang.
  rationale: Le pluriel דמים permet de comprendre soit le sang répandu, soit la culpabilité qui en découle. Le texte principal retient une formulation concrète et naturelle; la note préserve l’autre nuance légitime.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « sang » est volontaire afin de préserver l’insistance de l’hébreu. Les tirets rendent l’apposition explicative sans alourdir la syntaxe.
