source:
  edition: WLC
  text: וַ/יְקַנְא֣וּ לְ֭/מֹשֶׁה בַּֽ/מַּחֲנֶ֑ה לְ֝/אַהֲרֹ֗ן קְד֣וֹשׁ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/016.yaml
  text: They became jealous of Moses in the camp[a], and of Aaron, the holy one of Yahweh.
translation:
  language: fr
  text: Ils devinrent jaloux de Moïse dans le camp, et d’Aaron, le saint de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « consacré à Yahweh » ou « saint pour Yahweh ».'
    reason: La relation entre « saint » et « Yahweh » peut aussi souligner la consécration d’Aaron à Yahweh; cette option ne doit toutefois pas être présentée comme littérale.
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: Ils devinrent jaloux
  rationale: Le verbe קנא exprime ici une jalousie envieuse dirigée contre Moïse et Aaron. « Devinrent jaloux » rend naturellement en français la progression narrative suggérée par le wayyiqtol.
- source_word: לְמֹשֶׁה
  choice: de Moïse
  rationale: Avec קנא, la préposition ל introduit l’objet de la jalousie ; « jaloux de Moïse » est l’expression idiomatique française.
- source_word: בַּמַּחֲנֶה
  choice: dans le camp
  rationale: מַחֲנֶה désigne le camp d’Israël au désert ; la traduction directe et naturelle est « dans le camp ».
- source_word: לְאַהֲרֹן
  choice: et d’Aaron
  rationale: Le second ל est parallèle au premier et introduit le deuxième objet de la jalousie. La reprise de « de » clarifie cette coordination en français.
- source_word: קְדוֹשׁ יְהוָה
  choice: le saint de Yahweh
  rationale: Cette formulation appositionnelle conserve la concision et la tension du texte hébreu, qui présente Aaron comme celui qui est saint, c’est-à-dire spécialement consacré, en relation avec Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Désignation d’Aaron par קְדוֹשׁ יְהוָה
  choice: « le saint de Yahweh »
  alternative: « consacré à Yahweh » ou « saint pour Yahweh »
  rationale: Le choix principal préserve la forme nominale et appositionnelle de l’hébreu sans réduire la sainteté d’Aaron à une simple fonction. La note signale l’autre relation syntaxique possible, celle d’une consécration à Yahweh.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme poétique hébreu et place la note immédiatement après l’expression ambiguë qu’elle explique.
