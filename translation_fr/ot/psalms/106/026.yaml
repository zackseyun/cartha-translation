  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: fr
  text: Alors il leva la main contre eux[a], pour les faire tomber dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « il leva sa main vers eux ». Lever la main peut être un geste de serment, particulièrement dans un contexte de jugement ; on pourrait donc traduire : « il jura qu’il les ferait tomber ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יָדוֹ
  choice: il leva la main
  rationale: La formulation conserve l’image et l’idiome hébreux. Dans ce contexte, le geste est celui d’un serment solennel, explicité par le participe « jurant » afin que le sens soit naturel et compréhensible en français.
- source_word: לָהֶם
  choice: contre eux
  rationale: La préposition signifie littéralement « à/pour eux », mais, avec l’idée du jugement annoncé sous serment, « contre eux » exprime naturellement la portée défavorable du geste.
- source_word: לְהַפִּיל אֹתָם
  choice: de les faire tomber
  rationale: 'L’infinitif hiphil de נפל est causatif : « faire tomber ». Cette traduction en conserve directement la forme et la force.'
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est le terme courant et contextuellement approprié en français pour le מִדְבָּר de l’errance d’Israël.
theological_decisions:
- issue: Valeur idiomatique de « lever la main »
  choice: Conserver l’image dans le texte tout en explicitant sa valeur de serment par « jurant »
  alternative: Alors il jura contre eux de les faire tomber dans le désert
  rationale: Le contexte renvoie vraisemblablement au serment divin de jugement. La formulation retenue préserve néanmoins l’image concrète de l’hébreu sans réduire l’expression au seul verbe « jurer ».
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple, tandis que l’ajout de « jurant » rend perceptible la valeur idiomatique probable du geste sans supprimer l’image hébraïque.
