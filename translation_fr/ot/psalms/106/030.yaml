  text: וַ/יַּעֲמֹ֣ד פִּֽ֭ינְחָס וַ/יְפַלֵּ֑ל וַ֝/תֵּעָצַ֗ר הַ/מַּגֵּפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/030.yaml
  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: fr
  text: Alors Phinéas se leva et intervint[a], et le fléau fut enrayé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « exerça le jugement » ; autre possibilité : « intercéda » ou « pria ». Ici, le verbe hébreu peut avoir une portée judiciaire ou intercessive.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: se leva
  rationale: Dans cette séquence narrative, עמד exprime le fait de se mettre debout pour agir. « Se leva » est naturel en français et rend le caractère décisif de l’action.
- source_word: פִּינְחָס
  choice: Phinéas
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre biblique.
- source_word: וַיְפַלֵּל
  choice: intervint
  rationale: Le verbe peut ici évoquer une intervention à portée judiciaire ou intercessive. « Intervint » conserve cette amplitude sans réduire l’acte à la prière ni en préciser excessivement la forme.
- source_word: וַתֵּעָצַר
  choice: fut enrayé
  rationale: Le niphal de עצר indique que le fléau a été arrêté ou contenu. « Fut enrayé » garde le résultat passif tout en restant idiomatique en français.
- source_word: הַמַּגֵּפָה
  choice: le fléau
  rationale: מגפה désigne ici la calamité mortelle qui frappe le peuple. « Fléau » convient au contexte de Nombres 25 et conserve le registre poétique sans imposer une étiologie médicale précise.
theological_decisions:
- issue: Sens de וַיְפַלֵּל en rapport avec l’acte de Phinéas
  choice: intervint
  alternative: exerça le jugement ; ou intercéda / pria
  rationale: L’allusion à Nombres 25 favorise une intervention décisive de Phinéas, tandis que le verbe peut recevoir une nuance judiciaire ou intercessive. Le texte principal reste donc large, et la note préserve les lectures possibles.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation conserve l’enchaînement narratif et l’ambiguïté du verbe central sans importer une interprétation confessionnelle particulière.
