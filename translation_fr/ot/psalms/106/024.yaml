  yaml_path: translation/ot/psalms/106/024.yaml
  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: fr
  text: Puis ils méprisèrent le pays de délices[a] ; ils ne crurent pas à sa parole[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pays agréable » ou « le pays précieux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ne firent pas confiance à sa parole » ; « sa parole » peut aussi se comprendre ici comme « sa promesse ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: Puis ils méprisèrent
  rationale: Le verbe מאס exprime le rejet ou le mépris. « Méprisèrent » conserve la force du reproche, tandis que « Puis » marque naturellement la progression du récit.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: le pays désirable
  rationale: אֶרֶץ désigne ici le pays promis, et חֶמְדָּה ce qui est désirable, précieux ou source de délices. « Le pays désirable » reste proche de l'hébreu et préserve son évaluation positive.
- source_word: לֹא הֶאֱמִינוּ
  choice: ils ne crurent pas
  rationale: Le hiphil de אמן peut exprimer le fait de croire ou de faire confiance. Avec « parole », « ne crurent pas » restitue directement la formulation sans exclure la nuance de confiance.
- source_word: לִדְבָרוֹ
  choice: à sa parole
  rationale: דָּבָר signifie ici ce que Dieu a dit, avec en contexte une nuance de promesse. « Sa parole » conserve l'étendue sémantique de l'hébreu.
theological_decisions:
- issue: Faut-il expliciter que la parole est la promesse de Dieu concernant le pays ?
  choice: Conserver « sa parole » dans le texte principal.
  alternative: « sa promesse »
  rationale: L'hébreu dit littéralement « sa parole ». Le contexte permet de comprendre une promesse, mais l'expliciter dans le texte principal réduirait une formulation volontairement plus large.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre poétique et narratif du psaume. La formulation conserve la concision et le parallélisme de l'hébreu.
