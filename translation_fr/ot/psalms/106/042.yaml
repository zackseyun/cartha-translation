source:
  edition: WLC
  text: וַ/יִּלְחָצ֥וּ/ם אוֹיְבֵי/הֶ֑ם וַ֝/יִּכָּנְע֗וּ תַּ֣חַת יָדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/042.yaml
  text: Their enemies oppressed them[a], and they were subdued under their hand.
translation:
  language: fr
  text: Leurs ennemis les opprimèrent, et ils furent assujettis à leur pouvoir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sous leur main ».'
    reason: L’expression hébraïque présente la main comme l’image du pouvoir ou de la domination.
lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: les opprimèrent
  rationale: 'Le verbe לחץ au qal, avec un suffixe objet de troisième personne du pluriel, exprime ici une pression hostile et durable : « opprimer » convient au contexte de domination ennemie.'
- source_word: אוֹיְבֵיהֶם
  choice: leurs ennemis
  rationale: Traduction directe et naturelle de אֹיֵב avec le suffixe possessif de troisième personne du pluriel.
- source_word: וַיִּכָּנְעוּ
  choice: furent assujettis
  rationale: Le nifal de כנע indique qu’ils ont été abaissés, soumis ou réduits à l’obéissance. « Furent assujettis » conserve la valeur passive et l’idée de subordination.
- source_word: תַּחַת יָדָם
  choice: à leur pouvoir
  rationale: Littéralement « sous leur main » ; dans cet idiome hébreu, la main représente le pouvoir ou l’autorité exercée sur quelqu’un. La formulation retenue rend clairement ce sens en français moderne.
theological_decisions: []
