source:
  edition: WLC
  text: וַ/תֵּחָ֣שֶׁב ל֭/וֹ לִ/צְדָקָ֑ה לְ/דֹ֥ר וָ֝/דֹ֗ר עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/031.yaml
  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: fr
  text: Cela lui fut compté comme justice, de génération en génération, pour toujours[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « considéré » ou « porté à son compte ». L’hébreu emploie la tournure habituelle indiquant qu’une chose est tenue ou comptée comme justice.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour génération et génération », expression qui désigne la suite de toutes les générations.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: fut compté
  rationale: 'Le nifal de חשׁב exprime ici une évaluation passive : « fut compté », « fut considéré » ou « fut porté à son compte ». « Fut compté » conserve l’image d’imputation sans ajouter d’explication doctrinale.'
- source_word: לוֹ
  choice: lui
  rationale: Le ל avec suffixe désigne la personne au bénéfice de laquelle cette évaluation est faite. Dans la tournure française « cela lui fut compté », « lui » rend directement l’hébreu.
- source_word: לִצְדָקָה
  choice: comme justice
  rationale: Avec חשׁב + ל, cette formulation préserve l’idée que l’acte est tenu pour justice, sans réduire explicitement צְדָקָה à « une bonne action » ni préciser davantage la nature de cette justice.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette expression française naturelle correspond à l’idiome hébreu, littéralement « pour génération et génération », et exprime la continuité à travers les générations successives.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Cette expression rend naturellement la durée indéfinie ou perpétuelle indiquée par l’hébreu עַד עוֹלָם.
theological_decisions:
- issue: Écho à Genèse 15.6 et sens de la justice comptée
  choice: Conserver la formule « lui fut compté comme justice » sans l’expliciter doctrinalement.
  alternative: « fut considéré comme un acte juste » ou « lui fut porté au compte de la justice »
  rationale: L’hébreu reprend la tournure biblique de la justice comptée. La traduction en maintient la résonance et l’ambiguïté sans déterminer si l’accent porte sur l’acte, l’évaluation ou le statut de Phinéas.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple convient au registre narratif et poétique du psaume. La formulation reste proche de l’idiome hébreu tout en étant naturelle en français.
