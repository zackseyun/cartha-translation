reference: Psalms 106:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּתְּנֵ֥/ם בְּ/יַד גּוֹיִ֑ם וַֽ/יִּמְשְׁל֥וּ בָ֝/הֶ֗ם שֹׂנְאֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: fr
  text: Il les livra au pouvoir des nations[a], et ceux qui les haïssaient les dominèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la main des nations ». La « main » représente ici le pouvoir ou l’autorité.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Il les livra
  rationale: Le verbe נתן signifie littéralement « donner », mais, avec « dans la main de », il exprime ici l’idée de livrer quelqu’un au pouvoir d’autrui. « Livra » rend naturellement cet idiome en français sans atténuer l’action divine.
- source_word: בְּיַד גּוֹיִם
  choice: au pouvoir des nations
  rationale: Littéralement « dans la main des nations ». « Au pouvoir des nations » communique clairement le sens de contrôle ou de domination, tandis qu’une note conserve l’image hébraïque.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le terme désigne ici les nations étrangères. « Les nations » est précis et évite la coloration religieuse plus marquée de « les païens » ou « les Gentils ».
- source_word: וַיִּמְשְׁלוּ בָהֶם
  choice: exercèrent leur domination sur eux
  rationale: Le verbe משל signifie « gouverner, dominer ». Dans ce contexte hostile, « exercèrent leur domination » est naturel en français et conserve la force de la relation de pouvoir.
- source_word: שֹׂנְאֵיהֶם
  choice: ceux qui les haïssaient
  rationale: Cette formulation rend directement le participe hébreu, plus précisément que le terme général « leurs ennemis ».
theological_decisions:
- issue: L’action divine dans le jugement d’Israël
  choice: « Il les livra » attribue directement à Dieu l’action de remettre Israël au pouvoir des nations.
  alternative: Formuler le verset comme une simple permission divine.
  rationale: Le sujet implicite du verbe est Dieu, et l’hébreu affirme activement qu’il les a donnés ou livrés. La traduction maintient cette tension théologique sans l’atténuer ni l’amplifier.
translation_notes:
  register: Français moderne, international et digne. Le premier membre privilégie une expression idiomatique claire, accompagnée d’une note qui préserve la métaphore hébraïque. Le second évite le tour peu naturel « dominèrent sur eux » tout en maintenant le sens hostile de משל.
