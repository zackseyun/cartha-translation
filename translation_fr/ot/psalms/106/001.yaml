  text: הַֽלְלוּ יָ֨הּ הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: fr
  text: Louez Yah ! Rendez grâce à Yahweh, car il est bon, car son amour fidèle dure à jamais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel de הלל appelle la communauté à louer, tandis que יָהּ est la forme poétique abrégée du nom divin. La formulation conserve les deux éléments de l’exclamation hébraïque.
- source_word: הוֹד֣וּ
  choice: Célébrez
  rationale: Dans ce contexte liturgique, le hiphil de ידה signifie rendre grâce ou célébrer avec reconnaissance. « Célébrez » est idiomatique avec un complément direct en français et conserve la tonalité psalmique.
- source_word: לַ/יהוָ֣ה
  choice: Yahweh
  rationale: La préposition ל désigne le destinataire de l’action. La syntaxe française de « célébrer » n’exige pas de préposition, et le nom divin est conservé sous la forme Yahweh.
- source_word: כִּי ט֑וֹב
  choice: car il est bon
  rationale: כִּי introduit le motif de l’appel, et l’adjectif prédicatif טוֹב a pour sujet implicite Yahweh ; le pronom et la copule sont nécessaires en français.
- source_word: לְ/עוֹלָ֣ם
  choice: dure toujours
  rationale: L’expression indique une durée sans fin. Le verbe « dure » explicite naturellement en français la relation implicite dans l’hébreu nominal.
- source_word: חַסְדּֽ/וֹ
  choice: son amour fidèle
  rationale: חסד associe amour, loyauté et constance. « Amour fidèle » rend cette richesse de manière claire et actuelle sans réduire le terme à la seule miséricorde.
theological_decisions:
- issue: Forme abrégée du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: La translittération préserve la forme poétique distincte employée dans l’exclamation liturgique et sa relation avec Yahweh.
- issue: Nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » conserve le nom propre et permet de distinguer יהוה du titre אֲדֹנָי.
- issue: Portée de חסד
  choice: amour fidèle
  alternative: bonté / miséricorde / fidélité
  rationale: Le choix conserve ensemble les dimensions affective et loyale du terme, sans imposer ici une définition exclusivement technique ou confessionnelle.
translation_notes:
  register: Français international moderne, digne et liturgique. Le parallélisme des deux propositions introduites par « car » est conservé. « Célébrez Yahweh » évite la tournure moins naturelle « rendez grâce à Yahweh » tout en gardant l’idée de reconnaissance publique.
