source:
  edition: WLC
  text: וַ/יַּעַבְד֥וּ אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּהְי֖וּ לָ/הֶ֣ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/036.yaml
  text: They served their idols[a], and they became a snare to them.
translation:
  language: fr
  text: Ils servirent leurs idoles[a], et celles-ci devinrent pour eux un piège.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils adorèrent leurs idoles, et celles-ci devinrent pour eux un piège. »'
    reason: 'Alternative lexicale pour וַיַּעַבְדוּ : « adorèrent » explicite la portée cultuelle de « servirent ».'
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: Ils servirent
  rationale: Le qal de עבד désigne ici le service religieux rendu à de faux dieux. « Servirent » conserve le lien verbal avec le service cultuel sans expliciter davantage par « adorèrent ».
- source_word: עֲצַבֵּיהֶם
  choice: leurs idoles
  rationale: עֲצַבִּים désigne couramment des idoles dans un contexte polémique. « Idoles » exprime clairement le référent et la valeur négative du terme.
- source_word: וַיִּהְיוּ
  choice: devinrent
  rationale: 'Dans la construction avec לְמוֹקֵשׁ, היה exprime naturellement le résultat : les idoles en vinrent à fonctionner comme un piège.'
- source_word: לָהֶם
  choice: pour eux
  rationale: La préposition ל indique ici la relation et l’effet subi par les Israélites ; « pour eux » est naturel en français avec « devenir un piège ».
- source_word: לְמוֹקֵשׁ
  choice: un piège
  rationale: מוֹקֵשׁ désigne un piège ou un dispositif qui capture, employé ici métaphoriquement. « Piège » est clair et idiomatique en français moderne.
theological_decisions:
- issue: Référent du sujet sous-entendu dans וַיִּהְיוּ (« elles devinrent »)
  choice: Les idoles devinrent un piège pour ceux qui les servaient.
  alternative: Le fait de servir les idoles devint un piège pour eux.
  rationale: L’antécédent pluriel le plus proche et le plus naturel est « leurs idoles ». « Celles-ci » clarifie cette reprise en français sans modifier le sens contextuel.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit rétrospectif du psaume. « Celles-ci » évite l’ambiguïté grammaticale que créerait un simple pronom tout en maintenant les idoles comme antécédent naturel.
