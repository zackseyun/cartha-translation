base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/043.yaml
  text: Many times he delivered them[b][a], but they were rebellious in their counsel, and they were brought low by their iniquity.
translation:
  language: fr
  text: Bien des fois, il les a délivrés, mais eux se sont rebellés dans leurs desseins[a] et ont été humiliés par leur iniquité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans leur conseil » ou « par leurs desseins ». Le mot hébreu peut désigner le conseil, le projet ou le dessein.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ont sombré », « ont dépéri » ou « ont été abaissés ». Le terme hébreu rendu par « iniquité » peut aussi désigner leur culpabilité ou la peine liée à leur faute.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Bien des fois
  rationale: Rend naturellement l’idée d’occurrences nombreuses et répétées, sans réduire l’expression à une simple fréquence vague.
- source_word: יַצִּילֵם
  choice: il les a délivrés
  rationale: Le hiphil de נצל exprime l’action d’arracher au danger ou de délivrer. « Délivrés » convient au registre du psaume sans surcharger le verbe d’un sens doctrinal.
- source_word: וְהֵמָּה
  choice: mais eux
  rationale: Le pronom indépendant est emphatique et marque ici le contraste entre les délivrances répétées de Dieu et la conduite du peuple.
- source_word: יַמְרוּ
  choice: se sont révoltés
  rationale: Le verbe מרה désigne la rébellion ou le refus d’obéir. La formulation verbale restitue directement l’action hébraïque.
- source_word: בַעֲצָתָם
  choice: en suivant leurs propres desseins
  rationale: עֵצָה peut désigner le conseil, le projet ou le dessein. Cette formulation française explicite sobrement la relation entre leur révolte et leurs propres projets, tout en signalant l’éventail lexical en note.
- source_word: וַיָּמֹכּוּ
  choice: se sont enfoncés
  rationale: Le verbe מוך évoque le fait de devenir bas, de sombrer ou de dépérir. « Se sont enfoncés » conserve une image dynamique et n’impose pas un agent extérieur absent du verbe hébreu.
- source_word: בַּעֲוֺנָם
  choice: à cause de leur faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » garde ici la portée morale tout en restant clair en français moderne; la note préserve l’ambiguïté causale et pénale.
theological_decisions:
- issue: Sujet de la délivrance
  choice: Le sujet est rendu par « il » et reste identifié par le contexte.
  alternative: Répéter explicitement « Dieu » ou « le Seigneur ».
  rationale: L’hébreu porte un sujet masculin singulier implicite; le contexte du psaume l’identifie à Dieu. Ne pas ajouter son nom respecte l’économie du verset.
- issue: Nature de la rébellion
  choice: « se sont révoltés »
  alternative: « ont été rebelles »
  rationale: Le verbe hébreu décrit bien un acte ou une conduite de rébellion. La traduction verbale évite de trancher en faveur d’un état psychologique permanent.
- issue: Rapport entre faute et abaissement
  choice: « à cause de leur faute »
  alternative: « dans leur faute » ou « sous le poids de leur culpabilité ».
  rationale: La préposition ב peut avoir une valeur causale, instrumentale ou circonstancielle, tandis que עָוֹן peut viser la faute, la culpabilité ou sa peine. Le texte principal donne le sens causal probable et la note conserve les autres nuances.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsme. La phrase garde le contraste emphatique de « mais eux » et emploie des termes immédiatement compréhensibles. Les notes préservent l’ambiguïté de בַעֲצָתָם, de מוך et de עָוֹן.
