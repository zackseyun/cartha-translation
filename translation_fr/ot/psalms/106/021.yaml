id: PSA.106.21
reference: Psalms 106:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: fr
  text: Ils ont oublié Dieu, leur Sauveur[a], qui avait accompli de grandes choses en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur libérateur ». Le participe hébreu peut présenter Dieu comme celui qui les sauve.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: Ils ont oublié
  rationale: Le qatal qal, 3e personne du pluriel, rapporte ici un acte passé dans le récit historique du psaume. Le passé composé est naturel en français moderne.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל désigne le Dieu d’Israël. « Dieu » est naturel et exact, sans ajouter une insistance explicite sur la puissance.
- source_word: מוֹשִׁיעָם
  choice: leur Sauveur
  rationale: Le participe hiphil de ישׁע avec suffixe de 3e personne du pluriel signifie littéralement « celui qui les sauve » ou « leur sauveur ». Cette formulation concise exprime son rôle caractéristique.
- source_word: עֹשֶׂה
  choice: qui avait accompli
  rationale: Le participe qal qualifie Dieu. Une proposition relative est idiomatique en français, et le plus-que-parfait marque que ces actes avaient précédé l’oubli rapporté.
- source_word: גְדֹלוֹת
  choice: de grandes choses
  rationale: Le pluriel substantivé désigne les actes extraordinaires de Dieu. « De grandes choses » garde l’ampleur sémantique de l’hébreu sans la réduire à une catégorie précise.
- source_word: בְּמִצְרָיִם
  choice: en Égypte
  rationale: La préposition בְּ marque ici le lieu où Dieu a accompli ces actes.
theological_decisions:
- issue: Valeur du titre divin אֵל
  choice: Dieu
  alternative: le Puissant / Dieu puissant
  rationale: Le contexte identifie le Dieu oublié plutôt qu’il ne met explicitement en relief sa puissance. « Dieu » préserve le sens sans importer une emphase supplémentaire.
- issue: Valeur participiale de מוֹשִׁיעָם
  choice: leur Sauveur
  alternative: celui qui les sauvait / leur libérateur
  rationale: « Leur Sauveur » conserve le rôle caractéristique exprimé par le participe. « Libérateur » est possible dans le contexte de l’Exode, mais il est légèrement plus étroit.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au récit rétrospectif, tandis que le plus-que-parfait rend clairement l’antériorité des actes accomplis en Égypte.
