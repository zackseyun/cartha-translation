- from: Il dit qu’il allait les détruire, si Moïse[a], celui qu’il avait choisi, ne s’était pas tenu devant lui dans la brèche pour détourner sa fureur et l’empêcher de les détruire.
  to: Il dit qu’il allait les détruire — si Moïse[a], celui qu’il avait choisi, ne s’était pas tenu dans la brèche devant lui pour détourner sa fureur, afin qu’il ne les détruise pas.
  rationale: La révision ne modifie pas le sens. Elle rend plus visible la valeur contrefactuelle de לוּלֵי et clarifie la proposition finale, tout en conservant l’image de Moïse dans la brèche et le langage explicite de la fureur divine.
