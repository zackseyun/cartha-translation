source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְֽ/הַשְׁמִ֫ידָ֥/ם לוּלֵ֡י מֹ֘שֶׁ֤ה בְחִיר֗/וֹ עָמַ֣ד בַּ/פֶּ֣רֶץ לְ/פָנָ֑י/ו לְ/הָשִׁ֥יב חֲ֝מָת֗/וֹ מֵֽ/הַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: fr
  text: Il dit qu’il allait les détruire — si Moïse[a], celui qu’il avait choisi, ne s’était pas tenu dans la brèche devant lui pour détourner sa fureur, afin qu’il ne les détruise pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image hébraïque est celle d’une personne qui prend position dans la brèche d’un rempart ; elle décrit ici l’intervention de Moïse en faveur du peuple.
    reason: Explication de la métaphore hébraïque conservée dans le texte.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Il dit
  rationale: Le waw consécutif fait progresser le récit. « Il dit » est naturel en français et laisse le contexte exprimer l’enchaînement.
- source_word: לְהַשְׁמִידָם
  choice: qu’il allait les détruire
  rationale: Après le verbe « dire », l’infinitif avec ל exprime ici l’action projetée. Cette tournure française communique clairement l’intention sans renforcer le sens jusqu’à « anéantir ».
- source_word: לוּלֵי
  choice: si … ne … pas
  rationale: La particule introduit une condition contraire aux faits. Avec le plus-que-parfait, la formulation rend nettement le contrefactuel en français.
- source_word: בְחִירוֹ
  choice: celui qu’il avait choisi
  rationale: Cette expression claire et actuelle indique le choix de Moïse par Dieu sans la charge doctrinale que pourrait prendre « son élu ».
- source_word: עָמַד
  choice: ne s’était pas tenu
  rationale: Le plus-que-parfait inscrit le verbe dans la condition irréelle introduite par לוּלֵי et convient à l’image de quelqu’un qui prend position.
- source_word: בַּפֶּרֶץ
  choice: dans la brèche
  rationale: La traduction conserve l’image concrète d’une brèche dans un rempart, employée ici pour l’intervention de Moïse.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Le pronom renvoie naturellement à Dieu. « Devant lui » préserve l’idée de la présence divine et suit étroitement l’hébreu.
- source_word: לְהָשִׁיב
  choice: pour détourner
  rationale: Le hiphil de שוב signifie faire revenir ou repousser. « Détourner » est idiomatique en français avec la fureur tout en conservant l’idée d’en modifier le cours.
- source_word: חֲמָתוֹ
  choice: sa fureur
  rationale: חֵמָה désigne une colère ardente. « Fureur » en garde l’intensité dans ce contexte de jugement divin; « colère » serait également possible.
- source_word: מֵהַשְׁחִית
  choice: et l’empêcher de les détruire
  rationale: La préposition מִן devant l’infinitif exprime l’empêchement. La formulation explicite naturellement en français que la fureur est détournée de l’acte destructeur, sans effacer l’agent divin indiqué par le contexte.
theological_decisions:
- issue: Langage anthropopathique relatif au jugement divin
  choice: Conserver « sa fureur » sans l’atténuer en une abstraction impersonnelle.
  alternative: sa colère; son jugement
  rationale: Le verset présente explicitement la fureur de Dieu comme détournée par l’intervention de Moïse. La traduction maintient cette tension théologique au lieu de l’expliquer ou de l’adoucir.
- issue: Image de l’intercession de Moïse dans la brèche
  choice: Conserver la métaphore « dans la brèche ».
  alternative: s’interposer; intercéder pour eux; se tenir dans l’ouverture
  rationale: L’image du défenseur prenant place dans un rempart ouvert est constitutive de la représentation de Moïse comme médiateur. La note en éclaire le sens sans remplacer la métaphore dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la condition contraire aux faits, la métaphore de la brèche et le langage fort du jugement divin, tout en évitant une syntaxe française artificiellement calquée sur l’hébreu.
