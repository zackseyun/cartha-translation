  text: הוֹשִׁיעֵ֨/נוּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ/קַבְּצֵ/נוּ֮ מִֽן הַ/גּ֫וֹיִ֥ם לְ֭/הֹדוֹת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ לְ֝/הִשְׁתַּבֵּ֗חַ בִּ/תְהִלָּתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: fr
  text: Sauve-nous, Yahweh notre Dieu, et rassemble-nous du milieu des nations, afin que nous rendions grâce à ton saint nom et que nous nous glorifiions de ta louange.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que nous exultions dans ta louange » ou « que nous trouvions notre gloire dans ta louange ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: Sauve-nous
  rationale: L’impératif hiphil de ישׁע avec suffixe de première personne du pluriel exprime un appel direct au salut ou à la délivrance. « Sauve-nous » est naturel, fort et adapté au registre de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », plutôt que par un titre substitutif.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: La forme avec suffixe de première personne du pluriel signifie directement « notre Dieu » et conserve la portée relationnelle de l’invocation.
- source_word: וְקַבְּצֵנוּ
  choice: et rassemble-nous
  rationale: L’impératif piel de קבץ évoque le rassemblement d’un peuple dispersé. « Rassemble-nous » est idiomatique et respecte cette image.
- source_word: מִן הַגּוֹיִם
  choice: du milieu des nations
  rationale: La préposition מן indique ici que le peuple doit être retiré d’entre les nations parmi lesquelles il est dispersé. Cette formulation est plus explicite que « des nations ».
- source_word: לְהוֹדוֹת
  choice: afin que nous célébrions
  rationale: L’infinitif précédé de ל exprime le but. Dans ce contexte cultuel, ידה signifie remercier, louer ou célébrer; « célébrions » s’emploie naturellement avec « ton saint nom » tout en gardant l’idée de reconnaissance.
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: ton saint nom
  rationale: Cette formulation française naturelle préserve l’accent hébreu sur le nom saint de Dieu.
- source_word: לְהִשְׁתַּבֵּחַ
  choice: que nous mettions notre fierté
  rationale: Le hitpael de שׁבח exprime ici le fait de se glorifier, de tirer fierté ou d’exulter. La formulation choisie conserve la force réflexive sans suggérer une vantardise humaine autonome.
- source_word: בִּתְהִלָּתֶךָ
  choice: dans ta louange
  rationale: La préposition ב marque la sphère ou l’objet de cette fierté; « dans ta louange » conserve la construction et le substantif hébreux.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom divin personnel sans le remplacer par un titre.
- issue: Sens de לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: mettre notre fierté dans ta louange
  alternative: nous glorifier de ta louange; exulter dans ta louange
  rationale: L’expression décrit une fierté ou une exultation entièrement centrée sur la louange de Dieu. Le choix maintient la force réflexive et la tension de l’idiome biblique, tandis que la note signale d’autres rendus possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de prière et le parallélisme du verset sont conservés; « Yahweh » maintient le nom divin, et la note préserve l’éventail de sens du dernier membre.
