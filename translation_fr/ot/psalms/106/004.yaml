  text: Remember me[a], O Yahweh, when you show favor to your people[b]; attend to me with your salvation.
translation:
  language: fr
  text: Souviens-toi de moi, Yahweh, quand tu accordes ta faveur à ton peuple[a] ; interviens en ma faveur par ton salut[b].
  philosophy: optimal-equivalence
  footnotes:
