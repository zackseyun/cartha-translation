lexical_decisions:
- source_word: זָכְרֵנִי
  choice: Souviens-toi de moi
  rationale: L’impératif qal de זכר avec suffixe de première personne exprime directement la demande du psalmiste. Cette formulation française est simple, naturelle et fidèle à la force de la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: quand tu accordes ta faveur à ton peuple
  rationale: רָצוֹן désigne ici la faveur ou la bienveillance. La préposition בְּ est comprise dans un sens temporel ou circonstanciel, tout en signalant en note la lecture associative plus formelle.
- source_word: פָּקְדֵנִי
  choice: interviens pour moi
  rationale: Dans une prière, פקד peut désigner le fait de venir vers quelqu’un pour agir en sa faveur. « Interviens pour moi » restitue cette action bienveillante sans suggérer une simple visite physique.
- source_word: בִּישׁוּעָתֶךָ
  choice: par ton salut
  rationale: יְשׁוּעָה garde son sens large de salut ou de délivrance. « Par ton salut » conserve le substantif et comprend la préposition comme indiquant le moyen de l’intervention divine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom personnel divin. La translittération préserve ce nom sans le remplacer par un titre.
- issue: Valeur de בִּרְצוֹן עַמֶּךָ
  choice: 'lecture temporelle ou circonstancielle : « quand tu accordes ta faveur à ton peuple »'
  alternative: 'lecture associative : « avec la faveur que tu accordes à ton peuple »'
  rationale: La construction hébraïque est concise et permet les deux nuances. Le texte principal privilégie une expression française claire, tandis que la note conserve l’autre possibilité.
- issue: Nuance de פָּקְדֵנִי בִּישׁוּעָתֶךָ
  choice: « interviens pour moi par ton salut »
  alternative: « visite-moi avec ton salut »
  rationale: Le choix principal exprime l’intervention salvatrice demandée sans réduire פקד à une présence locative. La note préserve la formulation plus littérale et son image.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la prière est conservé, ainsi que le substantif théologiquement large « salut ». Les notes rendent visibles les deux principales ambiguïtés de la construction hébraïque.
