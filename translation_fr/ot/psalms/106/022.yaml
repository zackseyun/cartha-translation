  language: fr
  text: des merveilles au pays de Cham[a], des actes redoutables sur la mer Rouge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Cham » est ici un nom poétique désignant l’Égypte.
