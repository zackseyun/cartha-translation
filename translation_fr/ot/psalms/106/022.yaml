lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: des merveilles
  rationale: Le pluriel désigne des actes extraordinaires. « Des merveilles » est naturel, poétique et conserve le parallélisme.
- source_word: בְּאֶרֶץ
  choice: au pays de
  rationale: La préposition ב est ici locative. « Au pays de » est l’expression française idiomatique dans ce contexte.
- source_word: חָם
  choice: Cham
  rationale: Le nom propre hébreu est conservé plutôt que remplacé par son référent contextuel, l’Égypte; une note explicite l’allusion poétique.
- source_word: נ֝וֹרָאוֹת
  choice: des actes redoutables
  rationale: Le terme qualifie ce qui suscite crainte et saisissement. « Actes redoutables » rend cette force sans suggérer que ces actes seraient moralement mauvais.
- source_word: עַל
  choice: près de
  rationale: Avec un lieu géographique, עַל peut indiquer la proximité. « Près de » est naturel en français et convient à l’événement évoqué.
- source_word: יַם סוּף
  choice: la mer Rouge
  rationale: La désignation traditionnelle et largement reconnue est retenue dans le texte; la traduction possible « mer des Roseaux » est signalée en note.
