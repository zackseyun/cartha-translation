source:
  edition: WLC
  text: חָטָ֥אנוּ עִם אֲבוֹתֵ֗י/נוּ הֶעֱוִ֥ינוּ הִרְשָֽׁעְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/006.yaml
  text: We have sinned with our fathers[a]; we have done wrong[b]; we have acted wickedly.
translation:
  language: fr
  text: Nous avons péché avec nos pères[a] ; nous avons fait le mal[b] ; nous avons agi avec méchanceté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec nos ancêtres ». L’hébreu dit littéralement « nos pères ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « nous avons commis l’iniquité » ; autre traduction possible : « nous avons agi de manière perverse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: nous avons péché
  rationale: Le qal accompli, première personne du pluriel, exprime une confession collective ; le passé composé est naturel en français et garde la portée actuelle de l’aveu.
- source_word: עִם
  choice: avec
  rationale: La préposition marque l’association et la solidarité avec les générations précédentes, plutôt qu’une simple comparaison.
- source_word: אֲבוֹתֵינוּ
  choice: nos pères
  rationale: Le terme hébreu désigne littéralement « nos pères ». Cette formulation conserve l’image familiale du texte ; « nos ancêtres » reste possible selon le sens.
- source_word: הֶעֱוִינוּ
  choice: nous avons fait le mal
  rationale: Le hiphil accompli de עוה évoque une conduite mauvaise, fautive ou perverse. Cette formulation claire conserve la force morale sans technicité excessive.
- source_word: הִרְשָׁעְנוּ
  choice: nous avons agi avec méchanceté
  rationale: Le hiphil accompli de רשע décrit une conduite coupable ou méchante. La formulation verbale maintient le troisième volet et l’intensification de la confession.
theological_decisions:
- issue: Solidarité collective dans la confession
  choice: « avec nos pères » présente la communauté comme confessant son péché en solidarité avec les générations précédentes.
  alternative: « comme nos pères » mettrait surtout l’accent sur la ressemblance des conduites.
  rationale: עִם signifie naturellement « avec » et non simplement « comme ». La traduction préserve la dimension transgénérationnelle sans en tirer une construction doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La structure ternaire de la confession est conservée, ainsi que sa progression rhétorique. Les points-virgules rendent le parallélisme hébreu sans alourdir la phrase.
