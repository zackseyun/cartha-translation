id: PSA.106.12
reference: Psalms 106:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יַּאֲמִ֥ינוּ בִ/דְבָרָ֑י/ו יָ֝שִׁ֗ירוּ תְּהִלָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/012.yaml
  text: Then they believed his words[a]; they sang his praise.
translation:
  language: fr
  text: Alors ils crurent à ses paroles[a] ; ils chantèrent sa louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ils crurent à ses paroles. » La forme narrative hébraïque peut se traduire par « et » ou, de manière plus explicitement séquentielle, par « alors ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Alors ils crurent
  rationale: Le hiphil de אמן exprime ici le fait de croire ou de mettre sa confiance. Le wayyiqtol fait progresser le récit ; « Alors » en rend naturellement la valeur séquentielle.
- source_word: בִדְבָרָיו
  choice: à ses paroles
  rationale: דבר est au pluriel avec un suffixe masculin singulier. En français, « croire à ses paroles » conserve ce pluriel et exprime naturellement l’adhésion à ce qu’il a dit.
- source_word: יָשִׁירוּ
  choice: ils chantèrent
  rationale: Dans cette séquence narrative, l’imparfait hébreu se rend naturellement par un passé simple, parallèle à « crurent ».
- source_word: תְּהִלָּתוֹ
  choice: sa louange
  rationale: תְּהִלָּה avec le suffixe masculin singulier désigne la louange qui lui revient. « Chanter sa louange » est à la fois proche de la construction hébraïque et idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; le parallélisme concis de l’hébreu est conservé.
