source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: fr
  text: 'Les liens de la mort m’ont encerclé,

    et les angoisses du Shéol[a] m’ont trouvé ;

    j’ai trouvé la détresse et le chagrin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la tombe » ou « le séjour des morts ». Hébreu : « Shéol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: m’ont encerclé
  rationale: Le verbe exprime l’idée d’être entouré de toutes parts. « M’ont encerclé » garde l’image concrète et reste naturel en français moderne.
- source_word: חֶבְלֵי מָוֶת
  choice: les liens de la mort
  rationale: חֶבֶל peut désigner une corde ou un lien. « Les liens de la mort » conserve la métaphore de la puissance qui entrave, sans l’interpréter comme un piège.
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: et les angoisses du shéol
  rationale: מֵצַר évoque l’étroitesse, l’oppression et la détresse. « Angoisses » exprime naturellement cette pression oppressante, tandis que le pluriel hébreu est conservé.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: La translittération préserve la portée du terme hébreu, qui peut désigner le séjour des morts sans se réduire à une tombe individuelle. Une note en donne les principaux équivalents.
- source_word: מְצָאוּנִי
  choice: m’ont trouvé
  rationale: Cette traduction littérale conserve la répétition poétique avec אֶמְצָא, « j’ai trouvé », dans la proposition suivante. L’expression est marquée en français, mais demeure compréhensible dans ce contexte poétique.
- source_word: צָרָה
  choice: la détresse
  rationale: צָרָה désigne une situation de détresse, d’adversité ou de malheur. « Détresse » convient au registre poétique et à l’intensité du contexte.
- source_word: וְיָגוֹן
  choice: et le chagrin
  rationale: יָגוֹן désigne le chagrin ou la douleur morale. « Chagrin » reste clair, digne et distinct de « détresse ».
- source_word: אֶמְצָא
  choice: j’ai trouvé
  rationale: Le même radical verbal apparaît juste auparavant dans « m’ont trouvé ». Le reprendre ici maintient le jeu de répétition de l’hébreu.
theological_decisions:
- issue: Traduction de שְׁאוֹל
  choice: shéol
  alternative: la tombe ; le séjour des morts
  rationale: La translittération évite de réduire le terme à la tombe physique ou d’imposer une conception plus précise de l’au-delà que ne le fait le texte hébreu. La note rend le terme accessible.
translation_notes:
  register: Français moderne, poétique et digne. La formulation volontairement frappante « m’ont trouvé ; j’ai trouvé » reproduit la répétition du radical מצא dans le texte hébreu. Le découpage en trois lignes met en valeur le parallélisme.
