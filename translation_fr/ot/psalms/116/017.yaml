source:
  edition: WLC
  text: לְֽ/ךָ אֶ֭זְבַּח זֶ֣בַח תּוֹדָ֑ה וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/017.yaml
  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: fr
  text: Je t’offrirai un sacrifice d’action de grâce, et j’invoquerai le nom de Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le Seigneur ». D’autres transcriptions comprennent notamment « Yahvé » et « Jéhovah ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ
  choice: Je t’offrirai
  rationale: Le ל préfixé au pronom de deuxième personne désigne Dieu comme destinataire du sacrifice. En français, le pronom indirect « t’ » intégré au verbe est naturel et fidèle.
- source_word: אֶזְבַּח
  choice: offrirai
  rationale: Dans ce contexte cultuel, זבח désigne l’action d’offrir un sacrifice. « Offrirai » exprime clairement cette action sans la réduire à l’abattage de l’animal.
- source_word: זֶבַח תּוֹדָה
  choice: un sacrifice de reconnaissance
  rationale: La construction désigne un sacrifice exprimant la gratitude. « Sacrifice de reconnaissance » conserve à la fois le vocabulaire sacrificiel et la notion d’action de grâce.
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: et j’invoquerai le nom de Yahweh
  rationale: La locution קרא בשם exprime ici l’invocation du nom divin. « Invoquer le nom de » est une tournure française naturelle qui préserve le sens religieux de l’expression.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie directement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente sans lui substituer un titre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin YHWH. La forme « Yahweh » préserve son statut de nom propre, tandis que « le SEIGNEUR » correspond à sa substitution traditionnelle par un titre.
- issue: Sens de זֶבַח תּוֹדָה
  choice: un sacrifice de reconnaissance
  alternative: un sacrifice de louange
  rationale: תּוֹדָה peut évoquer la reconnaissance, l’action de grâce ou la louange. Dans la désignation sacrificielle, « reconnaissance » rend la gratitude sans exclure sa dimension de louange.
translation_notes:
  register: Français moderne, courant et digne. Le futur reprend les deux formes verbales hébraïques parallèles. « Reconnaissance » est accessible tout en conservant la portée cultuelle de l’expression.
