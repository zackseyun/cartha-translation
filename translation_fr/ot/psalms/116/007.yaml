source:
  edition: WLC
  text: שׁוּבִ֣י נַ֭פְשִׁ/י לִ/מְנוּחָ֑יְ/כִי כִּֽי יְ֝הוָ֗ה גָּמַ֥ל עָלָֽיְ/כִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/007.yaml
  text: Return[a], my soul, to your rest, for Yahweh has dealt bountifully with you.
translation:
  language: fr
  text: 'Reviens, mon âme, à ton repos,

    car Yahweh t’a fait du bien[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « a agi généreusement envers toi » ou « t’a comblée de bienfaits ». Le verbe hébreu peut signifier traiter quelqu’un ou lui rendre ce qui lui revient; le contexte lui donne ici un sens favorable.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבִי
  choice: Reviens
  rationale: Impératif qal féminin singulier de שוב, accordé avec « mon âme ». « Reviens » exprime naturellement le retour à un état antérieur de repos sans préciser davantage la nature de ce retour.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפשׁ peut désigner l’âme, la personne ou la vie. Dans cette adresse intérieure, « mon âme » conserve la personnification et le ton poétique du texte.
- source_word: לִמְנוּחָיְכִי
  choice: à ton repos
  rationale: La préposition ל et le nom מנוחה muni du suffixe féminin singulier indiquent le repos auquel l’âme doit revenir. Le pluriel morphologique peut avoir une valeur abstraite ou intensive et se rend naturellement au singulier en français.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison de l’exhortation. « Car » maintient un lien causal clair dans un registre poétique digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: גָּמַל עָלָיְכִי
  choice: t’a fait du bien
  rationale: Avec על, גמל décrit ici la manière favorable dont Yahweh a traité l’âme. Le contexte d’action de grâce impose un sens positif; « t’a fait du bien » est idiomatique et n’efface pas les autres nuances possibles, signalées en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le verset emploie explicitement le tétragramme. Sa transcription préserve le nom divin du texte source plutôt que de lui substituer un titre.
- issue: Valeur positive de גָּמַל
  choice: t’a fait du bien
  alternative: a agi généreusement envers toi
  rationale: Le verbe peut désigner le fait de traiter quelqu’un ou de lui rendre quelque chose, favorablement ou défavorablement. Le contexte de reconnaissance établit ici une action bienfaisante, sans permettre de préciser davantage sa forme.
translation_notes:
  register: Français international moderne, poétique mais accessible. L’apostrophe « mon âme » et le parallélisme sur deux lignes conservent le caractère de l’auto-exhortation. L’accord féminin implicite de l’hébreu est naturellement porté en français par « âme ».
