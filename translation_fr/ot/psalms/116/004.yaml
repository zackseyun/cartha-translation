base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/004.yaml
  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: fr
  text: 'Alors j’ai invoqué le nom du SEIGNEUR : « De grâce, SEIGNEUR, sauve-moi la vie ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: Alors j’ai invoqué le nom du SEIGNEUR
  rationale: L’expression « invoquer le nom de » restitue l’acte d’appeler Dieu à l’aide. Dans le récit poétique du psaume, l’imparfait hébreu peut naturellement être rendu par un passé français. « SEIGNEUR » suit la convention française courante pour le tétragramme.
- source_word: אָנָּה
  choice: De grâce
  rationale: Cette particule introduit une supplication pressante et respectueuse ; « de grâce » conserve sa force sans nécessiter de note.
- source_word: מַלְּטָה
  choice: sauve
  rationale: L’impératif exprime une demande de délivrance immédiate. « Sauve » est direct, naturel et approprié au contexte de danger mortel.
- source_word: נַפְשִׁי
  choice: moi la vie
  rationale: Ici, נֶפֶשׁ désigne la personne vivante ou sa vie menacée, plutôt qu’une « âme » conçue séparément. La tournure idiomatique « sauve-moi la vie » communique ce sens en français courant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: SEIGNEUR
  alternative: Yahvé
  rationale: La graphie en petites capitales correspond à la convention biblique française largement reconnue, sans introduire une prononciation reconstruite dans le corps du texte.
- issue: Sens anthropologique de נַפְשִׁי
  choice: ma vie, exprimé dans « sauve-moi la vie »
  alternative: mon âme
  rationale: Le contexte porte sur la délivrance de la mort. Ce choix évite d’imposer au terme hébreu une distinction ultérieure entre âme et corps.
translation_notes:
  register: Français international moderne, digne et accessible. La supplication conserve sa brièveté et son intensité poétique ; aucune note n’est nécessaire.
