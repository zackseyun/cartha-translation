source:
  edition: WLC
  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: fr
  text: Que rendrai-je à Yahweh pour tous ses bienfaits à mon égard ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que rendrai-je à Yahweh pour tout ce qu’il a fait à mon égard ? » Le terme hébreu peut évoquer des bienfaits, une manière d’agir envers quelqu’un ou une rétribution ; le contexte d’action de grâce favorise ici « bienfaits ».
    reason: alternative lexicale
lexical_decisions:
- source_word: מָה
  choice: Que
  rationale: Le pronom interrogatif introduit directement la question et correspond naturellement à « quoi » comme complément de « rendre ».
- source_word: אָשִׁיב
  choice: rendrai-je
  rationale: Le hifil de שוב signifie fondamentalement « faire revenir, rendre ». Ici, « rendre » conserve cette image tout en exprimant la réponse du psalmiste à la bonté divine, sans renforcer indûment l’idée de remboursement.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire, et le nom divin יהוה est rendu par « Yahweh » afin de préserver le nom personnel présent dans l’hébreu.
- source_word: כָּל
  choice: tous
  rationale: Le quantificateur souligne la totalité des actes bienveillants de Yahweh.
- source_word: תַּגְמוּלֹהִי
  choice: ses bienfaits
  rationale: Le terme issu de גמול peut désigner ce qui est accordé en retour, les façons d’agir envers quelqu’un ou, dans un contexte positif, des bienfaits. Le contexte d’action de grâce favorise « bienfaits ».
- source_word: עָלַי
  choice: à mon égard
  rationale: Avec ce nom, עלי exprime ce que Yahweh a fait envers le psalmiste. « À mon égard » est naturel en français et conserve cette orientation relationnelle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le Tétragramme, nom personnel de Dieu. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Caractère réciproque de la réponse du psalmiste
  choice: rendrai-je
  alternative: pourrai-je rembourser
  rationale: « Rendre » maintient la portée concrète et ouverte du verbe hébreu. « Rembourser » imposerait une logique transactionnelle plus forte et pourrait suggérer que les bienfaits divins sont acquittables.
translation_notes:
  register: Français international moderne, naturel et digne. L’inversion interrogative convient au registre poétique sans être archaïque. La formulation préserve l’ambiguïté du verbe « rendre » et explicite en note l’étendue sémantique de תַּגְמוּלֹהִי.
