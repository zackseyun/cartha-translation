  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: fr
  text: J’accomplirai mes vœux à Yahweh devant tout son peuple[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je m’acquitterai de mes vœux à Yahweh. » Le verbe hébreu peut signifier « payer », au sens d’exécuter ce que l’on a promis par un vœu.'
    reason: lexical_alternative
  - marker: b
    text: La particule hébraïque peut ajouter une nuance d’insistance ou de requête (« je te prie », « donc »); son sens précis dans cette formule poétique est discuté. Elle n’est pas rendue par un mot distinct en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: mes vœux
  rationale: Le pluriel de נֶדֶר avec suffixe de première personne désigne naturellement les engagements solennels pris par le psalmiste, sans préciser qu’il s’agit d’offrandes.
- source_word: לַיהוָה
  choice: envers Yahweh
  rationale: La préposition ל indique ici celui envers qui les vœux ont été faits et doivent être accomplis. « Envers » est idiomatique en français avec « accomplir ses vœux ».
- source_word: אֲשַׁלֵּם
  choice: J’accomplirai
  rationale: Le piel de שׁלם signifie ici s’acquitter de ce qui a été promis. « Accomplir » exprime clairement ce sens en français moderne, tandis que « payer » demeure une possibilité plus littérale.
- source_word: נֶגְדָה
  choice: devant
  rationale: Le terme situe l’accomplissement en présence du peuple et lui donne ainsi un caractère public.
- source_word: נָא
  choice: non représenté par un mot distinct
  rationale: Dans ce contexte poétique, la particule renforce l’énoncé et peut aussi être comprise comme « maintenant » ou « certes ». Un mot explicite alourdirait la phrase française; l’ambiguïté est signalée en note.
- source_word: לְכָל עַמּוֹ
  choice: tout son peuple
  rationale: Avec נֶגְדָה, le syntagme désigne l’ensemble du peuple comme témoin public de l’accomplissement des vœux.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom divin propre. « Yahweh » le représente comme tel plutôt que de lui substituer un titre traditionnel.
translation_notes:
  register: Français international moderne, sobre et digne. « Devant tout son peuple » conserve la concision poétique et le caractère public de la scène. Les deux appels de note figurent explicitement dans le texte.
