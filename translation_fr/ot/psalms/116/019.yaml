  text: בְּ/חַצְר֤וֹת בֵּ֤ית יְהוָ֗ה בְּֽ/ת֘וֹכֵ֤/כִי יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/019.yaml
  text: in the courts of the house of Yahweh[a], in your midst, Jerusalem[b]. Praise Yah!
translation:
  language: fr
  text: dans les parvis de la maison de Yahvé[a], au milieu de toi, Jérusalem. Louez Yah ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans les cours de la maison de Yahvé » ; la maison désigne ici le sanctuaire.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu « Louez Yah » est l’expression à l’origine du mot « Alléluia ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: dans les parvis
  rationale: Le pluriel désigne les espaces clos de l’enceinte du sanctuaire. « Parvis » est naturel en français dans le contexte du temple et conserve l’image spatiale sans expliciter par « temple ».
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: Cette traduction conserve l’expression hébraïque « maison de YHWH » plutôt que de l’interpréter directement comme « temple ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: « Yahvé » est la forme française usuelle du nom divin YHWH et préserve ici un nom propre plutôt que de lui substituer le titre « le Seigneur ».
- source_word: בְּתוֹכֵכִי
  choice: au milieu de toi
  rationale: La forme est à la deuxième personne du féminin singulier et s’adresse directement à Jérusalem personnifiée. Cette formulation reste claire et proche de la structure hébraïque.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française conventionnelle du nom propre.
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel et la forme abrégée du nom divin sont rendus séparément, ce qui fait apparaître le sens de l’expression à l’origine d’« Alléluia ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. La traduction retient le nom divin sous sa forme française courante afin de ne pas le remplacer silencieusement par un titre.
- issue: Traduction de יָהּ dans l’acclamation finale
  choice: Yah
  alternative: le Seigneur / Alléluia
  rationale: Le texte présente la forme courte du nom divin. « Louez Yah ! » en conserve les éléments lexicaux, tandis que la note signale l’expression liturgique française traditionnelle.
translation_notes:
  register: Français moderne, clair et digne. « Parvis » maintient le cadre cultuel sans remplacer l’expression hébraïque « maison de Yahvé » par l’interprétation « temple ». L’adresse directe à Jérusalem et l’acclamation finale sont conservées.
