id: PSA.116.16
reference: Psalms 116:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָֽנָּ֣ה יְהוָה֮ כִּֽי אֲנִ֪י עַ֫בְדֶּ֥/ךָ אֲֽנִי עַ֭בְדְּ/ךָ בֶּן אֲמָתֶ֑/ךָ פִּ֝תַּ֗חְתָּ לְ/מוֹסֵרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/016.yaml
  text: Please[a], Yahweh, for I am your servant; I am your servant, the son of your maidservant[c][b]. You have loosed my bonds.
translation:
  language: fr
  text: De grâce, Yahweh, car je suis ton serviteur ! Je suis ton serviteur, le fils de ta servante. Tu as défait mes liens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָֽנָּה
  choice: De grâce
  rationale: Cette particule introduit un appel pressant. « De grâce » garde la solennité et l’intensité de la supplication sans être obscure en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: car
  rationale: Le mot introduit ici le fondement de l’appel ou de l’affirmation du psalmiste.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: ton serviteur
  rationale: « Serviteur » exprime naturellement ici l’humble appartenance et le service consacré à Dieu, tout en laissant au contexte la nuance de dépendance inhérente au terme hébreu.
- source_word: בֶּן אֲמָתֶךָ
  choice: le fils de ta servante
  rationale: Cette formulation directe conserve la relation filiale et le féminin explicites en hébreu, dans un français naturel et digne.
- source_word: פִּתַּחְתָּ
  choice: tu as défait
  rationale: Le verbe signifie littéralement « ouvrir », mais, appliqué à des liens, il désigne le fait de les dénouer ou de les relâcher. « Défait » préserve l’image concrète.
- source_word: לְמוֹסֵרָי
  choice: mes liens
  rationale: « Liens » rend les entraves évoquées sans préciser indûment leur forme matérielle et s’accorde naturellement avec « défaire ».
theological_decisions:
- issue: Statut du psalmiste devant Dieu
  choice: serviteur
  alternative: esclave
  rationale: Le contexte met en avant l’appartenance humble, durable et dévouée à Yahweh. « Esclave » est lexicalement possible, mais risquerait de dominer le sens en français contemporain.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom personnel divin. Sa translittération le distingue d’un titre et conserve cette donnée du texte source.
- issue: Sens de « fils de ta servante »
  choice: conserver l’expression généalogique sans l’expliciter
  alternative: né dans ton service
  rationale: La formule peut suggérer un statut de service hérité ou enraciné dès la naissance, mais le verset ne développe pas explicitement cette interprétation. La traduction conserve donc la tension de l’image.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « je suis ton serviteur » est conservée pour respecter l’insistance poétique. L’exclamation après la première proposition rend l’appel pressant tout en évitant une construction française suspendue.
