  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: fr
  text: 'J’accomplirai mes vœux à Yahvé,

    en présence de tout son peuple.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Je m’acquitterai de mes vœux à Yahvé. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression signifie « devant tout son peuple » ; il s’agit d’un accomplissement public, sous les yeux de la communauté rassemblée. La particule hébraïque rendue ici de manière implicite est difficile et semble ajouter une insistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: mes vœux
  rationale: Le nom נֶדֶר désigne un vœu ou un engagement solennel. Le pluriel avec suffixe de première personne se rend naturellement par « mes vœux », sans préciser indûment qu’il s’agit d’offrandes.
- source_word: לַיהוָה
  choice: envers Yahvé
  rationale: La préposition ל marque ici celui à qui les vœux sont dus. « Envers Yahvé » s’accorde naturellement avec « accomplir ses vœux » en français et conserve le nom divin.
- source_word: אֲשַׁלֵּם
  choice: J’accomplirai
  rationale: Dans le contexte des vœux, le piel de שׁלם signifie les acquitter ou les accomplir. « Accomplirai » est idiomatique et évite la coloration principalement financière de « paierai ».
- source_word: נֶגְדָה־נָּא
  choice: en présence de
  rationale: נֶגֶד exprime ce qui se fait devant quelqu’un, sous ses yeux. La particule נָא est difficile ici et paraît renforcer l’expression plutôt qu’introduire clairement une idée temporelle.
- source_word: לְכָל עַמּוֹ
  choice: de tout son peuple
  rationale: Avec « en présence de », cette expression indique que l’accomplissement des vœux est public, devant l’ensemble du peuple de Yahvé.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahvé » conserve le nom personnel de Dieu dans une forme française traditionnelle, sans le remplacer par un titre.
- issue: Nature de l’accomplissement des vœux
  choice: accomplirai mes vœux
  alternative: paierai mes vœux
  rationale: Le contexte peut inclure l’offrande promise, mais l’hébreu ne précise pas ici sa forme. La traduction retenue préserve cette amplitude sans réduire l’acte à un paiement monétaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est présenté sur deux lignes. « Yahvé » conserve le nom divin ; « accomplirai » rend naturellement le verbe employé avec les vœux tout en maintenant la possibilité d’une offrande promise.
