id: PSA.116.13
reference: Psalms 116:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כּוֹס יְשׁוּע֥וֹת אֶשָּׂ֑א וּ/בְ/שֵׁ֖ם יְהוָ֣ה אֶקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/013.yaml
  text: I will lift up the cup of salvations[a], and I will call on the name of Yahweh.
translation:
  language: fr
  text: Je lèverai la coupe des délivrances[a] et j’invoquerai le nom de Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « délivrances » ou « actes de salut » au pluriel; il peut s’agir d’un pluriel poétique ou intensif.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: coupe
  rationale: Le nom désigne un récipient pour boire. « Coupe » est le terme français naturel et digne, sans les connotations liturgiques plus marquées de « calice ».
- source_word: יְשׁוּעוֹת
  choice: délivrances
  rationale: Le mot est morphologiquement au pluriel et peut désigner les actes de salut ou de délivrance accordés par Dieu. « Délivrances » conserve ce pluriel poétique plus clairement que « saluts », qui serait ambigu en français courant.
- source_word: אֶשָּׂא
  choice: Je lèverai
  rationale: Avec « coupe », le verbe נשׂא exprime naturellement le geste de lever ou d’élever la coupe; « je lèverai » garde l’image poétique sans surcharge.
- source_word: וּ/בְ/שֵׁם … אֶקְרָא
  choice: et j’invoquerai le nom
  rationale: L’expression קרא בשם désigne ici l’invocation du nom divin. « Invoquer le nom » rend l’idiome hébreu avec naturel et précision en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, ce qui préserve la présence explicite du nom divin dans le texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Yahvé
  rationale: Le texte porte directement le nom divin. « Yahweh » le conserve comme nom propre, tandis que « le SEIGNEUR » lui substituerait un titre; « Yahvé » est une francisation traditionnelle possible.
- issue: Valeur du pluriel יְשׁוּעוֹת
  choice: délivrances
  alternative: salut; délivrance
  rationale: Le pluriel hébreu peut être poétique ou intensif, mais peut aussi évoquer les multiples actes par lesquels Dieu sauve. Le texte français maintient cette tension au lieu de la réduire silencieusement au singulier.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation demeure poétique; le pluriel inhabituel « des délivrances » est volontairement conservé et expliqué en note.
