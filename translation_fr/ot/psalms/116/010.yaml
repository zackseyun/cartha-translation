  text: הֶ֭אֱמַנְתִּי כִּ֣י אֲדַבֵּ֑ר אֲ֝נִ֗י עָנִ֥יתִי מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/010.yaml
  text: 'I believed[b][a], therefore I spoke: “I am greatly afflicted.”'
translation:
  language: fr
  text: 'J’ai cru, c’est pourquoi j’ai parlé[a] : « Je suis profondément affligé. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car je parle ». La particule hébraïque traduite par « c’est pourquoi » peut exprimer plusieurs rapports logiques.
    reason: lexical_alternative
  - marker: b
    text: 'Autre lecture possible : « J’ai cru, même quand je disais : “J’étais profondément affligé.” » La syntaxe hébraïque est condensée et peut être comprise de différentes manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: J’ai cru
  rationale: Le hifil de אמן exprime ici le fait de croire ou de mettre sa confiance. « J’ai cru » est direct, naturel et conserve l’écho traditionnel du verset sans préciser indûment l’objet de cette foi.
- source_word: כִּי
  choice: c’est pourquoi
  rationale: La particule כִּי est polysémique. Dans la lecture retenue, elle relie la foi à la parole comme sa conséquence. Cette valeur est ancienne, mais elle n’est pas imposée par l’hébreu ; d’autres analyses sont donc signalées en note.
- source_word: אֲדַבֵּר
  choice: j’ai parlé
  rationale: La forme inaccomplie peut, en poésie, se comprendre selon le contexte comme une action passée, présente ou projetée. Le passé composé s’accorde ici avec le récit rétrospectif et avec la lecture où la foi conduit à la parole.
- source_word: אֲנִי
  choice: je
  rationale: Le pronom indépendant marque une insistance sur le psalmiste. En français, cette insistance est portée naturellement par la citation complète à la première personne, sans ajouter un « moi » artificiel.
- source_word: עָנִיתִי
  choice: je suis affligé
  rationale: Le verbe décrit le fait d’être accablé, affligé ou abaissé. Le présent convient au contenu cité comme parole prononcée au cœur de la détresse, tandis que la valeur passée possible est indiquée en note.
- source_word: מְאֹד
  choice: profondément
  rationale: L’adverbe intensifie fortement l’affliction. « Profondément » est idiomatique en français actuel et garde un registre digne.
theological_decisions:
- issue: Rapport syntaxique entre la foi, la parole et l’affliction
  choice: La foi est présentée comme conduisant à la parole, et la dernière proposition comme le contenu de cette parole.
  alternative: 'On peut aussi comprendre : « J’ai gardé confiance, même quand je disais : “J’étais profondément affligé.” » ou, plus littéralement, « J’ai cru, car je parle ; moi, j’ai été profondément affligé. »'
  rationale: L’hébreu est très condensé, et כִּי ainsi que la forme אֲדַבֵּר permettent plusieurs articulations. Le texte principal suit une lecture ancienne et intelligible, tandis que les notes maintiennent l’ambiguïté réelle sans en tirer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, sobre et poétique. Le passé composé rend le verset accessible, tandis que « profondément affligé » conserve la gravité du registre biblique.
