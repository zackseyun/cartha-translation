id: PSA.116.8
reference: Psalms 116:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י חִלַּ֥צְתָּ נַפְשִׁ֗/י מִ֫/מָּ֥וֶת אֶת עֵינִ֥/י מִן דִּמְעָ֑ה אֶת רַגְלִ֥/י מִ/דֶּֽחִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: fr
  text: 'Car tu as délivré mon âme de la mort[a],

    mes yeux des larmes,

    et mon pied de la chute[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie » ou « moi-même ». Le mot hébreu peut désigner l’âme, la vie ou la personne.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon pied du faux pas » ou « mes pieds de la chute ». L’hébreu emploie le singulier « mon pied » ; le dernier mot peut évoquer un trébuchement ou une chute.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde l’affirmation du contexte, tout en conservant la liaison explicative du texte hébreu.
- source_word: חִלַּצְתָּ
  choice: tu as délivré
  rationale: Le piel de חלץ exprime ici le fait d’arracher ou de sauver d’un danger. « Délivré » garde une tonalité poétique et convient aux trois compléments coordonnés.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve l’étendue sémantique et la formulation poétique, tandis qu’une note signale les autres lectures possibles.
- source_word: מִמָּוֶת
  choice: de la mort
  rationale: Rend directement la préposition et le nom, avec le sens d’une délivrance hors de la mort.
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: mes yeux des larmes
  rationale: Conserve l’ellipse du verbe et la concision du parallélisme hébreu. Le pluriel « larmes » rend naturellement en français le singulier collectif hébreu.
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: mon pied de la chute
  rationale: Préserve le singulier hébreu רַגְלִי et rend דֶּחִי par un nom pouvant évoquer la perte d’appui et la chute, sans préciser excessivement le degré de l’incident.
theological_decisions:
- issue: Portée anthropologique de נַפְשִׁי
  choice: mon âme
  alternative: ma vie ; moi-même
  rationale: Le contexte de la mort permet de comprendre « ma vie », mais le terme hébreu reste plus large. Le texte principal conserve « mon âme » et la note maintient explicitement l’ambiguïté sans réduire le salut décrit à une seule dimension.
translation_notes:
  register: Français moderne, sobre et poétique. La structure en trois membres et l’ellipse du verbe après le premier membre sont conservées. Le singulier « mon pied » suit l’hébreu, tandis que les notes rendent compte des formulations françaises possibles.
