  text: יָ֭קָר בְּ/עֵינֵ֣י יְהוָ֑ה הַ֝/מָּ֗וְתָ/ה לַ/חֲסִידָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/015.yaml
  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: fr
  text: La mort de ceux qui lui sont fidèles est précieuse aux yeux de Yahvé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La mort de ceux qui lui sont fidèles coûte cher à Yahvé. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression « ceux qui lui sont fidèles » peut aussi se traduire par « ses saints » ou « ceux qui lui sont attachés » ; le terme hébreu désigne des personnes caractérisées par leur loyauté et leur attachement fidèle à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: précieuse
  rationale: L’adjectif peut exprimer ce qui est précieux, de grand prix ou coûteux. « Précieuse » conserve le sens premier et la formulation traditionnelle sans réduire l’idée à un simple sentiment.
- source_word: בְּעֵינֵי
  choice: aux yeux de
  rationale: Cette expression idiomatique indique la manière dont Yahvé considère ou évalue cette mort, tout en conservant l’image hébraïque.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du nom divin préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: הַמָּוְתָה
  choice: la mort
  rationale: Le substantif défini est rendu directement par « la mort » ; la terminaison hébraïque n’en modifie pas sensiblement le sens dans ce contexte.
- source_word: לַחֲסִידָיו
  choice: de ceux qui lui sont fidèles
  rationale: חָסִיד désigne des personnes caractérisées par leur fidélité, leur piété ou leur loyauté envers Dieu. Cette formulation est claire en français moderne et évite les connotations ecclésiastiques possibles de « saints ».
theological_decisions:
- issue: Sens de la valeur attribuée à la mort des fidèles
  choice: La mort des fidèles est précieuse aux yeux de Yahvé, c’est-à-dire qu’elle a pour lui une grande valeur ou importance.
  alternative: La mort de ses fidèles coûte cher à Yahvé ou pèse lourd à ses yeux.
  rationale: יָקָר peut évoquer aussi bien ce qui est précieux que ce qui est coûteux. Le texte principal conserve « précieuse », tandis que la note maintient l’autre nuance sans laisser entendre que Dieu prend plaisir à leur mort.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la phrase est adapté au français courant, tout en conservant l’image « aux yeux de » et l’ambiguïté de יָקָר au moyen d’une note.
