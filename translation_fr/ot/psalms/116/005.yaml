  text: חַנּ֣וּן יְהֹוָ֣ה וְ/צַדִּ֑יק וֵ֖/אלֹהֵ֣י/נוּ מְרַחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/005.yaml
  text: Gracious is Yahweh[a], and righteous[b]; our God is compassionate.
translation:
  language: fr
  text: Yahweh est plein de grâce et juste ; notre Dieu est compatissant.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַנּוּן
  choice: plein de grâce
  rationale: L’adjectif prédicatif décrit la disposition bienveillante de Yahweh. « Plein de grâce » reste naturel en français tout en conservant la nuance de faveur, plutôt que de la réduire à la simple bonté.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Le nom divin est rendu directement par « Yahweh », afin de préserver le nom d’alliance présent dans le texte hébreu.
- source_word: צַדִּיק
  choice: juste
  rationale: Dans ce contexte, « juste » exprime naturellement en français la droiture morale et l’équité attribuées à Yahweh.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le suffixe de première personne du pluriel est conservé, ce qui maintient la confession communautaire et relationnelle du texte.
- source_word: מְרַחֵם
  choice: est compatissant
  rationale: Le participe de רחם dépeint une disposition continue de compassion. La tournure prédicative « est compatissant » restitue clairement et naturellement cette valeur.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Rapport entre justice et compassion divines
  choice: Maintenir les deux affirmations côte à côte
  alternative: Expliciter comment la justice s’accorde avec la compassion
  rationale: L’hébreu affirme simplement que Yahweh est juste et que notre Dieu est compatissant. La traduction préserve cette tension théologique sans ajouter d’explication.
translation_notes:
  register: Français international moderne, digne et accessible. La structure coordonnée de l’hébreu est conservée, avec un point-virgule pour rendre lisible le passage de la première affirmation à « notre Dieu est compatissant ».
