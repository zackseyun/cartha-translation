source:
  edition: WLC
  text: אָ֭הַבְתִּי כִּֽי יִשְׁמַ֥ע יְהוָ֑ה אֶת ק֝וֹלִ֗/י תַּחֲנוּנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/001.yaml
  text: I love that the LORD hears my voice, my pleas for mercy.
translation:
  language: fr
  text: J’aime que le SEIGNEUR écoute ma voix, mes supplications.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « J’aime le SEIGNEUR, car il écoute ma voix, mes supplications. » L’hébreu ne précise pas explicitement l’objet de « j’aime ».'
    reason: Préserver l’ambiguïté syntaxique entre une proposition complétive introduite par « que » et une proposition causale introduite par « car » avec « le SEIGNEUR » comme objet sous-entendu.
lexical_decisions:
- source_word: אָהַבְתִּי
  choice: J’aime
  rationale: Le parfait hébreu exprime ici l’attachement présent du psalmiste. L’objet du verbe n’est pas explicitement formulé, ce qui permet de rattacher la proposition introduite par כִּי à « j’aime ».
- source_word: כִּי
  choice: que
  rationale: Compris comme introduisant le contenu de ce que le psalmiste aime. Une lecture causale, « car », demeure possible et est signalée en note.
- source_word: יִשְׁמַע
  choice: écoute
  rationale: שׁמע signifie entendre ou écouter. « Écoute » rend ici l’attention favorable de Dieu envers la prière, sans ajouter explicitement l’idée d’exaucement.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Le tétragramme est rendu selon la convention française courante par « le SEIGNEUR » en petites capitales typographiques simulées ici par les capitales.
- source_word: תַּחֲנוּנָי
  choice: mes supplications
  rationale: Le terme désigne des appels pressants à la faveur ou à la compassion; « supplications » en conserve la force et le registre priant.
theological_decisions:
- issue: Objet implicite de « j’aime » et fonction de כִּי
  choice: « J’aime que le SEIGNEUR écoute… »
  alternative: « J’aime le SEIGNEUR, car il écoute… »
  rationale: L’hébreu ne formule pas expressément « le SEIGNEUR » comme objet de אָהַבְתִּי; il peut soit faire de la proposition en כִּי le contenu aimé, soit sous-entendre le SEIGNEUR comme objet et comprendre כִּי causalement. Le texte principal suit la première lecture, tandis que la note conserve l’autre sans trancher silencieusement.
translation_notes:
  register: Français international moderne, simple et digne. La juxtaposition « ma voix, mes supplications » conserve le parallélisme resserré de l’hébreu; « écoute » reste naturel dans le contexte de la prière.
