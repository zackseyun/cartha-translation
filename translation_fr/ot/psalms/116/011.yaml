  text: אֲ֭נִי אָמַ֣רְתִּי בְ/חָפְזִ֑/י כָּֽל הָ/אָדָ֥ם כֹּזֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/011.yaml
  text: I said in my alarm[b][a], “Every man is a liar.”
translation:
  language: fr
  text: 'Moi, j’ai dit dans mon affolement[a] : « Tout être humain est menteur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma hâte ». Le mot hébreu peut évoquer la précipitation, l’agitation, l’alarme ou la panique.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout être humain est faux » ou « trompeur ». Le participe hébreu peut désigner celui qui ment ou qui se révèle faux.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, je
  rationale: Le pronom indépendant, normalement facultatif avec le verbe conjugué, marque ici l’insistance; la dislocation « Moi, j’ai » la rend naturellement en français.
- source_word: אָמַרְתִּי
  choice: j’ai dit
  rationale: Équivalent courant et direct du verbe אָמַר, adapté au ton rétrospectif du psaume.
- source_word: בְחָפְזִי
  choice: dans mon affolement
  rationale: Le terme exprime ici une précipitation agitée pouvant aller jusqu’à l’alarme ou la panique; « affolement » restitue cette charge émotionnelle sans la réduire à la simple hâte.
- source_word: כָּל הָאָדָם
  choice: tout être humain
  rationale: אָדָם est employé collectivement et génériquement. « Tout être humain » conserve la portée universelle et reste naturel en français moderne.
- source_word: כֹּזֵב
  choice: est menteur
  rationale: Le participe qualifie la personne par son mensonge ou son manque de fiabilité; « est menteur » garde la force prédicative et morale de l’hébreu.
theological_decisions:
- issue: Portée de l’affirmation sur l’être humain
  choice: Conserver l’énoncé universel sans l’atténuer
  alternative: Paraphraser par « personne n’est digne de confiance »
  rationale: Le texte formule abruptement « tout être humain est menteur » dans le contexte de l’affolement du psalmiste. La traduction préserve cette tension au lieu de transformer l’affirmation en conclusion doctrinale ou de l’adoucir.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise emphatique « Moi, j’ai dit » reflète le pronom hébreu explicite. « Être humain » rend la valeur collective et générique de אָדָם sans introduire une restriction masculine.
