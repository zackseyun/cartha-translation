  text: Yahweh preserves the simple[a]; I was brought low[c][b], and he saved me.
translation:
  language: fr
  text: Yahweh protège les simples[a] ; j’étais faible[b], et il m’a sauvé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les naïfs », « les personnes peu averties ». Le mot hébreu désigne des personnes simples, peu expérimentées ou sans méfiance, pas nécessairement des insensés sur le plan moral.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « j’étais abaissé », « j’étais réduit à peu de chose ». L’hébreu peut évoquer une personne diminuée, faible ou abaissée.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « il m’a délivré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: protège
  rationale: 'Le participe de שׁמר exprime ici une action habituelle ou continue : Yahweh garde et préserve ceux qui sont vulnérables. « Protège » est naturel et direct en français.'
- source_word: פְּתָאיִם
  choice: les gens sans expérience
  rationale: Le terme désigne les personnes simples, naïves ou inexpérimentées, donc facilement exposées, sans impliquer nécessairement une faute morale ni un manque d’intelligence.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Le texte hébreu emploie directement le nom divin יהוה ; « Yahweh » le rend comme nom propre.
- source_word: דַּלּוֹתִי
  choice: j’étais tombé bien bas
  rationale: La forme issue de דלל évoque le fait d’être diminué, affaibli ou réduit à une condition misérable. Cette expression française conserve l’ampleur de l’image sans la limiter à la pauvreté matérielle.
- source_word: וְלִי
  choice: et il m’a
  rationale: Le pronom précédé de ל indique que l’action salvatrice s’exerce en faveur du psalmiste. Cette relation est exprimée naturellement en français par le complément « m’ ».
- source_word: יְהוֹשִׁיעַ
  choice: il m’a sauvé
  rationale: Le hifil de ישׁע signifie sauver ou délivrer. « Il m’a sauvé » rend directement le secours personnel décrit.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset porte le Tétragramme comme nom divin. La translittération « Yahweh » préserve cette fonction de nom propre sans remplacer le terme par un titre.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme est conservé dans une seule phrase rythmée ; le vocabulaire évite que פְּתָאיִם soit compris comme une déficience intellectuelle ou une condamnation morale.
