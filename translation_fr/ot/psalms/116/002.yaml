  yaml_path: translation/ot/psalms/116/002.yaml
  text: Because he has inclined his ear to me[a], I will call on him in my days.
translation:
  language: fr
  text: Car il a incliné son oreille vers moi ; je l’invoquerai tant que je vivrai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et dans mes jours, j’appellerai ». L’expression désigne la durée de la vie du psalmiste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’affirmation précédente. « Car » exprime naturellement ce lien causal dans un registre digne.
- source_word: הִטָּה אָזְנוֹ לִי
  choice: il a tendu l’oreille vers moi
  rationale: Cette formulation conserve l’image hébraïque d’une oreille inclinée dans la direction de celui qui parle, tout en restant claire et idiomatique en français.
- source_word: וּבְיָמַי
  choice: tant que je vivrai
  rationale: Littéralement « et durant mes jours », l’expression désigne ici toute la durée de la vie du psalmiste. La tournure retenue en communique naturellement la portée temporelle.
- source_word: אֶקְרָא
  choice: je l’invoquerai
  rationale: Dans ce contexte de prière, קרא exprime le fait de faire appel à Dieu. Le pronom « l’ » est implicite dans l’hébreu mais se déduit du contexte et rend la phrase naturelle en français.
theological_decisions:
- issue: Objet implicite du verbe אֶקְרָא
  choice: je l’invoquerai
  alternative: j’appellerai
  rationale: L’hébreu ne répète pas explicitement l’objet, mais le contexte immédiat désigne le Seigneur. « Invoquer » rend le sens de l’appel adressé à Dieu sans préciser davantage la nature de cet appel.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme causal est préservé, ainsi que l’image concrète de l’oreille tendue.
