  text: אֶ֭תְהַלֵּךְ לִ/פְנֵ֣י יְהוָ֑ה בְּ֝/אַרְצ֗וֹת הַֽ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: fr
  text: Je marcherai devant Yahweh dans les terres des vivants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vivrai devant Yahweh dans le pays des vivants. » L’expression hébraïque « marcher devant » peut aussi désigner la manière de vivre, et le pluriel « terres » peut être compris plus généralement comme « pays » ou « domaine ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: Je marcherai
  rationale: Le hitpael inaccompli à la première personne du singulier de הלך peut exprimer un mouvement futur ou une manière de vivre. « Je marcherai » conserve l’image concrète et laisse ouverte sa portée existentielle et éthique.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition signifie couramment « devant » au sens spatial ou relationnel. Cette formulation concise peut aussi évoquer une vie menée dans la présence de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּאַרְצוֹת
  choice: sur les terres
  rationale: Le nom est au pluriel. « Sur les terres » respecte cette forme et reste assez large pour désigner le domaine où vivent les humains, sans imposer l’idée de plusieurs territoires politiques.
- source_word: הַחַיִּים
  choice: des vivants
  rationale: La forme désigne « les vivants ». L’expression conserve la force poétique de l’hébreu et son contraste implicite avec le séjour des morts.
theological_decisions:
- issue: Faut-il comprendre le verset comme l’affirmation d’une survie physique ou comme celle d’une conduite vécue en présence de Dieu ?
  choice: Conserver l’image « marcher devant Yahweh » sans la réduire à un seul sens.
  alternative: « Je vivrai devant Yahweh dans le pays des vivants. »
  rationale: L’expression hébraïque peut évoquer à la fois la continuation de la vie après la délivrance et une existence menée sous le regard de Dieu. La traduction maintient cette tension.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe reste simple; l’image hébraïque et le pluriel inhabituel « terres » sont conservés, avec une note pour signaler l’autre compréhension possible.
