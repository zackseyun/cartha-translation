source:
  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָ֗ם לֹ֤א יַחְשֹׁ֬ב יְהוָ֣ה ל֣/וֹ עָוֺ֑ן וְ/אֵ֖ין בְּ/רוּח֣/וֹ רְמִיָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: fr
  text: Heureux l’être humain à qui le SEIGNEUR ne met pas la faute à son compte[a], et dont l’esprit est sans tromperie[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le péché » ou « la culpabilité ». Le mot hébreu peut désigner la faute elle-même, l’état de culpabilité ou ses conséquences.
    reason: lexical_alternative
  - marker: b
    text: Ou « duplicité ». Il s’agit de l’absence de tromperie dans la disposition intérieure.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule exclamative introduit une béatitude. « Heureux » est la tournure française naturelle, actuelle et digne.
- source_word: אָדָם
  choice: l’être humain
  rationale: אָדָם désigne ici un individu humain de manière générique. « L’être humain » conserve le singulier et évite de restreindre à tort la portée aux hommes de sexe masculin.
- source_word: יַחְשֹׁב ... לֹו
  choice: à qui ... ne compte pas
  rationale: Le verbe חשב avec le bénéficiaire exprime ici une opération de compte ou d’imputation. « Compter » garde cette image tout en restant accessible.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La graphie en petites capitales selon l’usage biblique français signale que le texte hébreu porte le nom divin YHWH, tout en respectant la convention révérencielle largement reconnue.
- source_word: עָוֹן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » garde ici la dimension morale sans décider entièrement entre l’acte coupable et la culpabilité qui en résulte.
- source_word: בְּרוּחוֹ
  choice: dont l’esprit
  rationale: Dans ce contexte, רוּחַ renvoie à la disposition intérieure de la personne. La relative française rattache clairement ce membre au même référent.
- source_word: רְמִיָּה
  choice: tromperie
  rationale: Le mot évoque la duplicité ou la fraude. « Tromperie » est moderne et naturel, sans l’archaïsme de « fraude » au sens intérieur ou de certaines tournures traditionnelles.
theological_decisions:
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le nom est singulier et générique, non explicitement masculin quant au sexe. La traduction retenue rend cette portée universelle sans passer au pluriel.
- issue: Métaphore comptable de la non-imputation divine
  choice: ne compte pas la faute
  alternative: n’impute pas la faute / ne porte pas le péché à son compte
  rationale: « Compter » préserve sobrement la métaphore du texte sans lui imposer une formulation technique issue d’un système théologique ultérieur.
- issue: Amplitude sémantique de עָוֹן
  choice: la faute
  alternative: le péché / la culpabilité
  rationale: Le contexte permet d’entendre à la fois l’acte pervers et la culpabilité qui s’y attache. Le texte principal ne tranche pas excessivement, et la note conserve les autres valeurs possibles.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure en deux membres est conservée. « Heureux » maintient le ton de béatitude; l’exclamation finale, implicite dans la formule hébraïque, est rendue par la ponctuation française.
