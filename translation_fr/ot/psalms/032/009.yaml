  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: fr
  text: Ne soyez pas comme le cheval ou le mulet, sans discernement, dont le mors et la bride servent à les maîtriser ; sans cela, ils ne s’approchent pas de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier membre de la phrase est difficile en hébreu. On peut aussi comprendre : « afin qu’ils ne s’approchent pas de toi », c’est-à-dire pour les empêcher de s’approcher ou de se précipiter vers toi.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Ne soyez pas
  rationale: La négation אַל suivie de l’inaccompli exprime une défense. « Ne soyez pas » est direct et naturel en français.
- source_word: כְּסוּס כְּפֶרֶד
  choice: comme le cheval ou le mulet
  rationale: Les deux comparaisons animales sont conservées au singulier générique; « ou » rend naturellement la coordination dans l’exhortation française.
- source_word: אֵין הָבִין
  choice: qui sont dépourvus d’intelligence
  rationale: La formule indique l’absence d’intelligence ou de discernement. Le pluriel français renvoie naturellement aux deux espèces mentionnées.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: par le mors et la bride
  rationale: « Mors et bride » désigne clairement et traditionnellement les moyens employés pour diriger et contenir l’animal.
- source_word: עֶדְיוֹ לִבְלֹם
  choice: il faut les maîtriser
  rationale: Dans ce contexte, עֶדְיוֹ désigne probablement l’équipement posé sur l’animal, tandis que לִבְלֹם exprime l’action de le contenir. Une formulation verbale évite en français l’étrange littéralisme « son ornement » tout en gardant l’image.
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: pour qu’ils s’approchent de toi
  rationale: Le dernier membre est difficile. Cette traduction comprend la contrainte comme nécessaire afin que l’animal s’approche du conducteur; l’autre analyse possible est signalée en note.
theological_decisions:
- issue: Sens de la proposition finale בַּל קְרֹב אֵלֶיךָ
  choice: La contrainte est nécessaire pour que les animaux s’approchent.
  alternative: La contrainte sert à empêcher les animaux de s’approcher ou de se précipiter vers la personne.
  rationale: La syntaxe hébraïque est obscure et permet les deux orientations. Le texte principal retient la lecture contextuellement courante sans supprimer l’autre possibilité.
translation_notes:
  register: Français moderne, international et digne. L’image concrète du mors et de la bride est maintenue. Le passage du singulier hébreu au pluriel français évite une reprise pronominale ambiguë après « le cheval ou le mulet ».
