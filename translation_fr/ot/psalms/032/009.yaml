  naturalness: Le français est globalement naturel et de registre approprié. « Sans discernement » est plus idiomatique et plus précis dans ce contexte que « dépourvus d’intelligence ». La tournure « dont le mors et la bride servent à les maîtriser » garde l’image de l’équipement de l’animal sans l’impersonnel légèrement explicatif « il faut ».
