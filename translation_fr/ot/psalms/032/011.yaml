  text: שִׂמְח֬וּ בַֽ/יהוָ֣ה וְ֭/גִילוּ צַדִּיקִ֑ים וְ֝/הַרְנִ֗ינוּ כָּל יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/011.yaml
  text: Be glad in Yahweh and rejoice[a], you righteous; shout for joy[b], all you upright in heart.
translation:
  language: fr
  text: Réjouissez-vous en Yahweh[a] et soyez dans l’allégresse, vous qui êtes justes ; poussez des cris de joie[b], vous tous qui avez le cœur droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », le nom divin, rendu ici par « Yahweh ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « chantez de joie ». Le verbe hébreu peut désigner un cri vibrant de joie, qu’il soit poussé ou chanté.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Réjouissez-vous
  rationale: L’impératif pluriel de שׂמח appelle à éprouver et manifester de la joie. « Réjouissez-vous » est naturel en français et conserve la force exhortative.
- source_word: בַיהוָה
  choice: en Yahweh
  rationale: 'La préposition ב indique ici la sphère ou l’objet de la joie : celle-ci se trouve « en » Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: וְגִילוּ
  choice: et soyez dans l’allégresse
  rationale: Le verbe גיל évoque une joie vive et exubérante. Cette formulation le distingue de שׂמח tout en restant claire et naturelle.
- source_word: צַדִּיקִים
  choice: vous qui êtes justes
  rationale: Le terme est employé comme une adresse aux destinataires des impératifs. La proposition relative rend cette apostrophe naturellement en français.
- source_word: וְהַרְנִינוּ
  choice: poussez des cris de joie
  rationale: Le hifil impératif pluriel de רנן désigne une expression sonore et éclatante de joie, qui peut être criée ou chantée.
- source_word: כָּל
  choice: vous tous
  rationale: Cette formulation exprime clairement que l’exhortation englobe l’ensemble du groupe désigné.
- source_word: יִשְׁרֵי לֵב
  choice: qui avez le cœur droit
  rationale: L’expression hébraïque décrit une droiture intérieure et morale. « Avoir le cœur droit » conserve l’image du cœur dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin, tandis que « le SEIGNEUR » le remplace traditionnellement par un titre.
- issue: Portée de la justice et de la droiture
  choice: vous qui êtes justes / vous qui avez le cœur droit
  alternative: les justes / les hommes sincères
  rationale: La traduction garde les deux désignations parallèles du texte sans réduire la droiture du cœur à la seule sincérité ni préciser une doctrine particulière de la justice.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et les trois impératifs sont conservés, avec une variation lexicale naturelle. L’expression concrète « le cœur droit » maintient l’image hébraïque.
