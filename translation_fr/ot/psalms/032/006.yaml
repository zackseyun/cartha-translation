id: PSA.32.6
reference: Psalms 32:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַל זֹ֡את יִתְפַּלֵּ֬ל כָּל חָסִ֨יד אֵלֶי/ךָ֮ לְ/עֵ֪ת מְ֫צֹ֥א רַ֗ק לְ֭/שֵׁטֶף מַ֣יִם רַבִּ֑ים אֵ֝לָ֗י/ו לֹ֣א יַגִּֽיעוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/006.yaml
  text: Therefore let every godly one pray to you at a time when you may be found[a]; surely when the great floodwaters come[b], they will not reach him.
translation:
  language: fr
  text: Voilà pourquoi, que tout fidèle t’adresse sa prière au temps où l’on peut te trouver[a] ! Certes, lors du déferlement de grandes eaux[b], elles ne l’atteindront pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au temps de trouver ». Autre traduction possible : « pendant qu’on peut te trouver ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lors du déferlement d’eaux nombreuses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל זֹאת
  choice: Voilà pourquoi
  rationale: Cette formule exprime naturellement en français le lien de conséquence avec la confession et le pardon évoqués auparavant.
- source_word: יִתְפַּלֵּל
  choice: que … prie
  rationale: L’imparfait hébreu reçoit ici une valeur exhortative; la tournure avec « que » conserve cette invitation sans en faire une simple prédiction.
- source_word: כָּל חָסִיד
  choice: tout fidèle
  rationale: חָסִיד désigne une personne attachée à Dieu et caractérisée par la fidélité; « fidèle » est actuel et évite la connotation ecclésiastique de « saint ».
- source_word: אֵלֶיךָ
  choice: te
  rationale: Le pronom marque directement la personne vers qui monte la prière, sans ajouter un nom divin absent de l’hébreu.
- source_word: לְעֵת מְצֹא
  choice: au temps où l’on peut te trouver
  rationale: Cette formulation française rend l’expression elliptique « au temps de trouver » en maintenant l’idée que Dieu est accessible à celui qui le cherche.
- source_word: רַק
  choice: Même si
  rationale: Dans le contexte, la particule introduit avec insistance le contraste entre le danger des eaux et la sécurité du fidèle; cette tournure le rend naturellement en français.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: des eaux abondantes déferlent
  rationale: La formulation conserve l’image poétique d’une masse d’eaux qui se précipite, tout en restant idiomatique en français.
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: elles ne l’atteindront pas
  rationale: Le pluriel renvoie aux eaux et le masculin singulier au fidèle; « atteindre » exprime précisément l’absence de contact menaçant.
theological_decisions:
- issue: Référent et portée de la promesse de protection
  choice: Les eaux menaçantes n’atteignent pas le fidèle qui prie.
  alternative: Les eaux désignent une inondation littérale, ou le pronom renvoie à Dieu.
  rationale: La syntaxe favorise le fidèle comme antécédent de אֵלָיו. La traduction garde intacte l’image des eaux sans décider si elle représente une détresse, un jugement ou un danger concret.
- issue: Sens de לְעֵת מְצֹא
  choice: Le temps où Dieu peut être trouvé.
  alternative: Le temps de trouver, sans complément explicite, ou le temps où le fidèle se trouve dans la détresse.
  rationale: Le contexte de la prière adressée à Dieu soutient le complément implicite « te », mais une note conserve l’ellipse et l’ambiguïté de l’expression hébraïque.
translation_notes:
  register: Français international moderne, digne et poétique. « Tout fidèle » reste accessible sans coloration confessionnelle particulière; l’image du déferlement est conservée plutôt qu’explicitée.
