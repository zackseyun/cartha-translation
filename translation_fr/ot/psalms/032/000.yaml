source:
  edition: WLC
  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: fr
  text: De David. Poème didactique[a]. Heureux celui dont la révolte est enlevée[b], dont le péché est couvert !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu maskil, indication placée en tête du psaume dont le sens précis est incertain; il pourrait s’agir d’une composition didactique ou méditative.
    reason: cultural_note
  - marker: b
    text: Littéralement « levée » ou « portée »; cette image exprime ici le pardon, comme une faute que l’on ôte.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל (maskil)
  choice: Poème didactique
  rationale: Le terme désigne probablement un type de composition destiné à instruire ou à faire réfléchir, mais son sens précis reste incertain; une note préserve cette incertitude.
- source_word: אַשְׁרֵי (’ashrê)
  choice: Heureux celui
  rationale: Formule de félicitation caractéristique des psaumes, rendue naturellement en français.
- source_word: פֶּשַׁע (pesha‘)
  choice: révolte
  rationale: Le mot évoque plus précisément la rébellion ou la rupture d’allégeance que le terme général « faute ».
- source_word: נְשׂוּי (nesouï)
  choice: enlevée
  rationale: Le participe signifie littéralement « levée, portée » et exprime ici le pardon par l’image de la faute ôtée.
- source_word: כְּסוּי חֲטָאָה (kesouï ḥata’ah)
  choice: dont le péché est couvert
  rationale: Conserve l’image hébraïque parallèle de la faute recouverte plutôt que de la remplacer par une seconde occurrence de « pardonné ».
theological_decisions:
- issue: Image du pardon
  choice: Conserver les images « enlevée » et « couvert »
  alternative: Traduire explicitement « pardonnée »
  rationale: L’hébreu emploie deux métaphores distinctes; leur maintien préserve le parallélisme et n’impose pas une explication théologique supplémentaire.
- issue: Portée de « heureux »
  choice: Employer le singulier inclusif « celui »
  alternative: « Heureux l’homme »
  rationale: Le texte vise toute personne dans cette situation; « celui » est naturel, digne et évite de restreindre inutilement la portée.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation conserve le parallélisme du texte hébreu et les deux images concrètes du pardon.
