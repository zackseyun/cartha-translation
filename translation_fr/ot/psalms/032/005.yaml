  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: fr
  text: 'Je t’ai fait connaître mon péché, et je n’ai pas caché ma faute. J’ai dit : « Je confesserai mes transgressions à Yahweh », et toi, tu as pardonné[a] la culpabilité de mon péché. Sélah.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu as porté » ou « tu as soulevé la culpabilité de mon péché ». Le verbe hébreu évoque le fait de soulever ou de porter un fardeau et signifie ici, par extension, « pardonner ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטָּאתִי
  choice: mon péché
  rationale: חַטָּאת désigne couramment le péché ou l’offense; « mon péché » est direct et maintient la distinction avec עָוֹן et פֶּשַׁע.
- source_word: אוֹדִיעֲךָ
  choice: je t’ai fait connaître
  rationale: Le hiphil de ידע signifie « faire connaître »; cette formulation conserve la valeur causative tout en restant naturelle en français.
- source_word: עֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou ses conséquences. « Faute » est ici naturel et garde une nuance distincte de « péché » et de « révoltes ».
- source_word: לֹא כִסִּיתִי
  choice: je n’ai pas caché
  rationale: כסה signifie littéralement « couvrir », mais en français « cacher une faute » exprime naturellement la métaphore de la dissimulation.
- source_word: אוֹדֶה
  choice: je confesserai
  rationale: Avec les révoltes comme objet, le hiphil de ידה signifie reconnaître ou confesser, plutôt que remercier.
- source_word: עֲלֵי פְשָׁעַי
  choice: mes révoltes
  rationale: פֶּשַׁע évoque la transgression comme rébellion. La préposition עַל indique ici ce qui est confessé et n’a pas besoin d’être explicitée en français.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », ce qui préserve le nom divin personnel présent dans le texte.
- source_word: נָשָׂאתָ
  choice: tu as pardonné
  rationale: נשא signifie littéralement lever ou porter; avec la faute pour objet, il exprime idiomatiquement le pardon. L’image concrète est signalée en note.
- source_word: עֲוֺן חַטָּאתִי
  choice: la faute de mon péché
  rationale: Cette formulation conserve la chaîne construite et l’expression hébraïque stratifiée de la culpabilité, sans la réduire simplement à « mon péché ».
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis du terme demeure incertain; la translittération évite d’imposer une interprétation comme « pause » ou « interlude ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme; « Yahweh » conserve le nom personnel sans le remplacer par un titre.
- issue: Métaphore de נָשָׂאתָ עֲוֺן
  choice: tu as pardonné
  alternative: tu as enlevé / tu as porté la faute
  rationale: Dans ce contexte, l’expression signifie idiomatiquement pardonner. La traduction principale communique clairement ce sens, tandis que la note préserve l’image hébraïque et son ambiguïté entre enlever et porter.
translation_notes:
  register: Français international moderne, digne et accessible. Les trois termes hébreux relatifs au mal sont distingués par « péché », « faute » et « révoltes ». Le futur « je confesserai » respecte la forme verbale hébraïque dans le discours rapporté. La ponctuation rend clairement la progression entre reconnaissance, confession et pardon.
