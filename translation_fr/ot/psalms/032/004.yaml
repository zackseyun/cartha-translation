  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: fr
  text: Car, jour et nuit, ta main pesait lourdement sur moi ; ma vigueur[a] s’est transformée en sécheresse estivale. Séla[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ma sève vitale ». Le sens précis du mot traduit par « vigueur » et de l’expression « en sécheresse estivale » est incertain ; on peut aussi comprendre : « sous les sécheresses de l’été ».'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « Séla », terme probablement liturgique ou musical, dont le sens précis est incertain.'
    reason: translation_transparency
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’état décrit au verset précédent, sans renforcer indûment le lien causal.
- source_word: יוֹמָם וָלַיְלָה
  choice: jour et nuit
  rationale: Conserve le mérisme hébreu exprimant une durée continuelle dans une formulation française naturelle.
- source_word: תִּכְבַּד ... יָדֶךָ
  choice: ta main pesait lourdement
  rationale: Préserve l’image concrète du poids de la main divine et la valeur imperfective du verbe dans ce récit au passé.
- source_word: עָלַי
  choice: sur moi
  rationale: Expression française directe qui conserve l’image d’un poids exercé sur le psalmiste.
- source_word: נֶהְפַּךְ
  choice: s’est changée
  rationale: Rend le sens propre de transformation plutôt que d’intégrer par interprétation l’idée d’assèchement dans le verbe lui-même.
- source_word: לְשַׁדִּי
  choice: ma vigueur
  rationale: Le nom rare peut évoquer le suc ou l’humidité vitale du corps ; « vigueur » en transmet naturellement la portée métaphorique sans la réduire à la seule force physique.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: en sécheresse d’été
  rationale: Reproduit de près l’image hébraïque de sécheresses ou d’aridités estivales et s’accorde avec le verbe de transformation.
- source_word: סֶלָה
  choice: Pause
  rationale: Le terme est probablement un repère liturgique ou musical ; « Pause » en donne une fonction plausible, tout en signalant en note que son sens exact demeure incertain.
theological_decisions:
- issue: Action divine dans la souffrance
  choice: La main de Dieu est explicitement décrite comme pesant sur le psalmiste.
  alternative: Comprendre la souffrance comme générale, sans action divine explicite, ou préciser qu’il s’agit d’un châtiment punitif au sens doctrinal fort.
  rationale: Le possessif « ta » attribue clairement l’action à Dieu dans le contexte, mais le verset ne définit pas davantage la nature théologique de cette intervention.
- issue: Nature de l’épuisement du psalmiste
  choice: Conserver l’image corporelle et poétique d’une vigueur transformée en sécheresse.
  alternative: Expliciter une perte purement spirituelle, émotionnelle ou physique.
  rationale: Le mot לְשַׁדִּי et l’image estivale suggèrent un dépérissement vital, mais ne permettent pas d’en limiter avec certitude la portée à une seule dimension.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore concrète de la main pesante est conservée. « Ma vigueur s’est changée en sécheresse d’été » privilégie la forme transformative de l’hébreu tout en restant intelligible ; la note maintient les principales incertitudes lexicales. Tous les marqueurs de note figurent dans le texte.
