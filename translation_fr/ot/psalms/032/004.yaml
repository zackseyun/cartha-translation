  terminology: « Ta main pesait lourdement sur moi » conserve convenablement la métaphore. « Vigueur » est un choix recevable pour לְשַׁדִּי ; la note doit indiquer l’alternative « sève vitale » et l’incertitude de l’expression entière. La translittération usuelle française « Séla » est préférable à une traduction fonctionnelle non certaine.
