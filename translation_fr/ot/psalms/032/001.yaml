source:
  edition: WLC
  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: fr
  text: 'De David. Maskil[a].


    Heureux celui dont la transgression est pardonnée[b],


    dont le péché est couvert !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terme hébreu désignant un type de psaume dont le sens précis est incertain ; peut-être une composition didactique ou méditative.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « levée » ou « emportée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, la préposition לְ devant un nom propre peut indiquer l’auteur, l’appartenance, la destination ou l’association. « De David » reste naturel en français tout en évitant de préciser davantage que l’hébreu.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le sens et la fonction exacts de ce terme de rubrique restent incertains. Sa translittération évite d’imposer dans le texte une interprétation telle que « psaume didactique » ou « méditation ».
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: Cette formule introduit une béatitude. « Heureux » est la tournure française courante, naturelle et solennelle dans ce contexte.
- source_word: נְשׂוּי
  choice: pardonnée
  rationale: Le participe de נשׂא signifie littéralement « levée » ou « emportée »; associé à la révolte, il exprime idiomatiquement le pardon. L’image concrète est signalée en note.
- source_word: פֶּשַׁע
  choice: révolte
  rationale: Le mot désigne une rupture ou une rébellion volontaire, plus forte qu’une simple erreur. « Révolte » conserve cette nuance et se distingue du terme parallèle rendu par « péché ».
- source_word: כְּסוּי
  choice: couvert
  rationale: Le participe passif de כסה signifie directement « couvert ». Cette traduction préserve la métaphore et le parallélisme poétique.
- source_word: חֲטָאָה
  choice: péché
  rationale: Dans son parallélisme avec פֶּשַׁע, le terme désigne ici la faute morale, et non un sacrifice pour le péché.
theological_decisions:
- issue: Sujet représentatif de la béatitude
  choice: Heureux celui…
  alternative: Heureux l’homme… / Heureux ceux…
  rationale: L’hébreu vise une personne au singulier sans exiger un référent masculin. « Celui » conserve ce singulier représentatif sans ajouter une précision de genre.
- issue: Sens de מַשְׂכִּיל dans la suscription
  choice: Conserver « Maskil » dans le texte
  alternative: Psaume didactique / méditation
  rationale: Puisque le genre ou la fonction précise du terme est discuté, la translittération maintient l’incertitude du texte source plutôt que de privilégier une interprétation.
- issue: Rapport entre pardon et couverture du péché
  choice: 'Conserver les deux images parallèles : « pardonnée » et « couvert »'
  alternative: Uniformiser les deux expressions en les rendant par « pardonné »
  rationale: Le vers emploie deux participes distincts. Garder « couvert » dans le second membre préserve la tension métaphorique et le parallélisme sans définir doctrinalement le mécanisme du pardon.
translation_notes:
  register: Français international moderne, poétique et digne. La mise en vers fait ressortir le parallélisme hébreu. « Maskil » est conservé comme terme technique expliqué en note; le point d’exclamation rend la force de la béatitude sans alourdir la phrase.
