  text: Many pains belong to the wicked[b][a], but steadfast love surrounds the one who trusts in Yahweh.
translation:
  language: fr
  text: Nombreuses sont les souffrances[a] du méchant, mais l’amour fidèle[b] entoure celui qui se confie en Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bien des douleurs » ou « bien des chagrins ». Le nom hébreu peut désigner des douleurs, des peines ou des souffrances.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu חֶסֶד peut aussi être rendu, selon le contexte, par « bonté fidèle », « miséricorde » ou « amour d’alliance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים מַכְאוֹבִים לָרָשָׁע
  choice: Le méchant connaît bien des souffrances
  rationale: La tournure hébraïque signifie littéralement que de nombreuses souffrances sont « pour » le méchant. « Connaît bien des souffrances » l’exprime dans un français naturel sans préciser à tort leur cause, tout en conservant l’idée de multiplicité.
- source_word: וְהַבּוֹטֵחַ
  choice: mais […] celui qui met sa confiance
  rationale: Le participe substantivé désigne « celui qui se confie ». « Met sa confiance » est idiomatique en français, et « mais » rend le contraste manifeste entre les deux membres du verset.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב avec בטח exprime ici l’objet de la confiance. Le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans le texte hébreu.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: חֶסֶד évoque un amour loyal, durable et miséricordieux. « Amour fidèle » en restitue l’essentiel dans un français actuel sans imposer ici une formulation exclusivement juridique ou alliance­lle.
- source_word: יְסוֹבְבֶנּוּ
  choice: entoure
  rationale: Le verbe signifie « entourer, encercler ». Le suffixe masculin singulier renvoie à celui qui met sa confiance en Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le distingue d’un simple titre et suit la couche de consultation fournie.
- issue: Portée de רָשָׁע au masculin singulier
  choice: le méchant
  alternative: l’homme méchant
  rationale: Le singulier est représentatif et générique. « Le méchant » conserve cette forme proverbiale sans ajouter une référence particulière au sexe masculin.
- issue: Portée théologique de חֶסֶד
  choice: amour fidèle
  alternative: miséricorde / amour d’alliance
  rationale: Le contexte oppose les souffrances du méchant à la protection accordée à celui qui se confie en Yahweh. « Amour fidèle » préserve à la fois la bienveillance et la constance du terme, sans réduire son sens à la seule compassion ni expliciter une alliance que ce verset ne nomme pas.
translation_notes:
  register: Français international moderne, simple et digne. La structure contrastive du verset est conservée, tandis que la première proposition est légèrement réorganisée pour être idiomatique. « Bien des » exprime naturellement רַבִּים sans alourdir la phrase.
