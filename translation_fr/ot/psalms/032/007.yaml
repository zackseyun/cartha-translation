source:
  edition: WLC
  text: אַתָּ֤ה סֵ֥תֶר לִ/י֮ מִ/צַּ֪ר תִּ֫צְּרֵ֥/נִי רָנֵּ֥י פַלֵּ֑ט תְּס֖וֹבְבֵ֣/נִי סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/007.yaml
  text: You are a hiding place for me[a]; from distress you preserve me; you surround me with shouts of deliverance[b]. Selah
translation:
  language: fr
  text: Tu es pour moi un abri ; tu me gardes de la détresse ; tu m’entoures de cris de délivrance. Sélah[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Sélah » est probablement une indication musicale ou liturgique, mais son sens précis est incertain.
    reason: cultural_note
lexical_decisions:
- source_word: סֵתֶר
  choice: un abri
  rationale: Le nom désigne un lieu où l’on se cache et se trouve protégé. « Abri » restitue naturellement en français l’image du refuge sans l’alourdir.
- source_word: מִצַּר
  choice: de la détresse
  rationale: צַר peut désigner la détresse, l’adversité ou une situation oppressante. « De la détresse » conserve la portée générale du danger sans supposer un ennemi personnel.
- source_word: תִּצְּרֵנִי
  choice: tu me gardes
  rationale: Le verbe נצר signifie garder, protéger ou préserver. « Tu me gardes » est direct et naturel, tout en maintenant le parallélisme avec l’abri.
- source_word: רָנֵּי פַלֵּט
  choice: cris de délivrance
  rationale: רָנֵּי évoque des cris retentissants, souvent joyeux, et פַלֵּט la délivrance ou le secours. Cette expression garde la vigueur et la concision de l’hébreu.
- source_word: תְּסוֹבְבֵנִי
  choice: tu m’entoures
  rationale: Le verbe סבב exprime l’action d’entourer ou d’encercler. La formulation française préserve directement cette image.
- source_word: סֶלָה
  choice: Séla
  rationale: Le sens précis de ce terme demeure incertain ; la translittération évite de lui imposer une interprétation conjecturale.
theological_decisions:
- issue: Nature et origine des « cris de délivrance »
  choice: 'La formule reste ouverte : le psalmiste est entouré de cris associés à la délivrance, sans que leur auteur soit précisé.'
  alternative: « chants de délivrance », « cris annonçant le secours » ou « chants célébrant la délivrance »
  rationale: La construction hébraïque רָנֵּי פַלֵּט est compacte et ambiguë. « Cris de délivrance » n’indique pas si ces cris viennent de Dieu, du psalmiste ou d’une communauté, et ne précise pas s’ils annoncent ou célèbrent le secours.
translation_notes:
  register: Français international moderne, poétique mais accessible. La répétition de « tu » conserve l’adresse directe et le rythme du verset. Le point-virgule maintient les trois propositions parallèles.
