id: PSA.32.3
reference: Psalms 32:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי הֶ֭חֱרַשְׁתִּי בָּל֣וּ עֲצָמָ֑/י בְּ֝/שַׁאֲגָתִ֗/י כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/003.yaml
  text: For when I kept silent[a], my bones wasted away through my groaning all day long.
translation:
  language: fr
  text: Car lorsque je gardais le silence, mes os dépérissaient à force de gémir[a] tout le jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de rugir ». Le mot hébreu peut désigner un cri puissant semblable à un rugissement; ici, il exprime vraisemblablement un gémissement de profonde détresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car lorsque
  rationale: כִּי introduit ici l’explication de l’affirmation précédente, tandis que la proposition temporelle décrit la période de silence. « Car lorsque » exprime naturellement ces deux rapports en français.
- source_word: הֶחֱרַשְׁתִּי
  choice: je gardais le silence
  rationale: Le verbe חרשׁ signifie ici « être silencieux ». L’imparfait français et la locution « garder le silence » rendent l’état prolongé suggéré par le contexte, sans préciser explicitement que ce silence portait sur le péché.
- source_word: בָּלוּ
  choice: dépérissaient
  rationale: בלה évoque l’usure ou le déclin. Appliqué aux os dans ce langage poétique, « dépérissaient » communique une détérioration physique et intérieure sans supprimer l’image corporelle.
- source_word: עֲצָמַי
  choice: mes os
  rationale: La traduction littérale conserve l’image corporelle hébraïque, qui exprime ici l’atteinte profonde de toute la personne.
- source_word: בְּשַׁאֲגָתִי
  choice: à force de gémir[a]
  rationale: שׁאגה désigne proprement un cri puissant, voire un rugissement. Dans ce contexte de détresse, « gémir » est naturel en français; « à force de » rend la circonstance ou le moyen associé à la préposition בְּ. La note conserve l’image plus forte du terme hébreu.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Expression française claire et poétique qui préserve l’idée d’une durée continue.
theological_decisions:
- issue: Faut-il préciser que le silence concerne un péché non confessé ?
  choice: L’objet du silence reste implicite.
  alternative: Car lorsque je gardais le silence sur mon péché…
  rationale: Le contexte permet de comprendre qu’il s’agit du péché, mais ce verset ne l’énonce pas. La traduction préserve donc la concision et l’implicite du texte hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant le parallélisme entre le silence gardé et la plainte continuelle, ainsi que l’image concrète des os qui dépérissent.
