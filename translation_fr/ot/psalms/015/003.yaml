  text: לֹֽא רָגַ֨ל עַל לְשֹׁנ֗/וֹ לֹא עָשָׂ֣ה לְ/רֵעֵ֣/הוּ רָעָ֑ה וְ֝/חֶרְפָּ֗ה לֹא נָשָׂ֥א עַל קְרֹֽב/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: fr
  text: Il ne répand pas de médisances avec sa langue[a], ne fait aucun mal à son prochain[b] et n’accable pas d’opprobre celui qui lui est proche[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne va pas çà et là en colportant des médisances » ou « ne médit pas avec sa langue ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne commet aucun tort envers son ami ou son compagnon ».
    reason: lexical_alternative
  - marker: c
    text: Ou « n’adresse aucun outrage à son proche ». « Celui qui lui est proche » peut désigner un parent, un intime ou une personne de son entourage.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל עַל לְשֹׁנוֹ
  choice: calomnie avec sa langue
  rationale: Dans cette construction, רָגַל évoque le fait de colporter des paroles malveillantes. « Calomnier » exprime clairement la portée éthique, tandis que « avec sa langue » conserve l’image concrète de l’hébreu.
- source_word: עָשָׂה ... רָעָה
  choice: fait ... du mal
  rationale: 'Cette formulation française naturelle conserve le sens large de l’hébreu : commettre envers quelqu’un ce qui est mauvais ou nuisible.'
- source_word: לְרֵעֵהוּ
  choice: à son prochain
  rationale: רֵעַ peut désigner un ami, un compagnon ou un membre de la communauté. « Prochain » garde ici cette portée relationnelle assez large.
- source_word: חֶרְפָּה
  choice: l’opprobre
  rationale: Le terme désigne la honte publique, le mépris ou l’affront infligé à quelqu’un. « Opprobre » préserve à la fois la dimension sociale et la gravité du mot.
- source_word: נָשָׂא ... עַל
  choice: fait peser ... sur
  rationale: L’expression hébraïque signifie littéralement porter ou soulever l’opprobre contre quelqu’un. « Faire peser ... sur » conserve cette image tout en restant idiomatique en français.
- source_word: קְרֹבוֹ
  choice: celui qui lui est proche
  rationale: Le mot désigne une personne proche, qu’il s’agisse d’un parent, d’un intime ou de quelqu’un appartenant à son entourage. Cette traduction évite de limiter indûment le sens à la parenté.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme ternaire est conservé. « Opprobre » relève d’un registre légèrement soutenu, mais rend mieux que « honte » seule la dimension publique de חֶרְפָּה; la note signale aussi la possible valeur verbale de l’expression.
