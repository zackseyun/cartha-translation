id: PSA.15.5
reference: Psalms 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כַּסְפּ֤/וֹ לֹא נָתַ֣ן בְּ/נֶשֶׁךְ֮ וְ/שֹׁ֥חַד עַל נָקִ֗י לֹ֥א לָ֫קָ֥ח עֹֽשֵׂה אֵ֑לֶּה לֹ֖א יִמּ֣וֹט לְ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: fr
  text: Il ne prête pas son argent à intérêt[a] et n’accepte pas de pot-de-vin contre l’innocent. Celui qui fait ces choses ne sera jamais ébranlé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à usure ». Le mot hébreu נֶשֶׁךְ peut désigner l’intérêt exigé sur un prêt.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne vacillera jamais ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: son argent
  rationale: כֶּסֶף désigne littéralement l’argent-métal, mais, dans le contexte d’un prêt avec intérêt, le français courant « argent » exprime clairement le sens économique.
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: prête … à intérêt
  rationale: La tournure hébraïque désigne le fait de remettre de l’argent contre un intérêt. « Prêter à intérêt » est naturel en français moderne et ne limite pas indûment le terme aux seuls taux excessifs.
- source_word: שֹׁחַד
  choice: pot-de-vin
  rationale: שֹׁחַד désigne un paiement corrupteur. « Pot-de-vin » en restitue clairement la portée juridique et morale en français moderne.
- source_word: עַל נָקִי
  choice: contre l’innocent
  rationale: נָקִי désigne une personne exempte de faute. Avec עַל, l’expression indique qu’un pot-de-vin est accepté au détriment d’un innocent, tout en conservant la concision de l’hébreu.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Celui qui fait ces choses
  rationale: Le participe substantivé décrit la personne qui se caractérise par ces actes. Cette formulation conserve le singulier et le pluriel démonstratif du texte hébreu.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: ne sera jamais ébranlé
  rationale: Le niphal de מוֹט évoque le fait de chanceler, d’être déplacé ou ébranlé. Avec la négation et לְעוֹלָם, « jamais » rend idiomatiquement l’idée d’une stabilité durable.
theological_decisions:
- issue: Portée éthique de l’intérêt perçu sur un prêt
  choice: Traduire נֶשֶׁךְ par « intérêt » sans limiter la condamnation aux seuls intérêts excessifs.
  alternative: Traduire par « usure », terme qui évoque souvent aujourd’hui un taux abusif ou illégal.
  rationale: Dans ce contexte éthique, נֶשֶׁךְ peut désigner l’intérêt exigé sur un prêt en général. « Intérêt » préserve cette portée lexicale sans introduire une théorie économique postérieure.
- issue: Nature de la stabilité promise
  choice: Conserver la métaphore « ne sera jamais ébranlé ».
  alternative: Expliciter par « restera toujours en sécurité » ou une autre paraphrase.
  rationale: Le texte affirme une stabilité durable au moyen du verbe מוֹט sans préciser ici toutes ses dimensions matérielles, sociales ou spirituelles. La métaphore laisse subsister cette ampleur.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de l’enchaînement hébreu, tandis que « argent », « prêter à intérêt » et « pot-de-vin » rendent naturellement le cadre économique et judiciaire. La métaphore finale est conservée.
