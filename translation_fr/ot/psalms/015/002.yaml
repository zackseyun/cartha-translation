id: PSA.15.2
reference: Psalms 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹלֵ֣ךְ תָּ֭מִים וּ/פֹעֵ֥ל צֶ֑דֶק וְ/דֹבֵ֥ר אֱ֝מֶ֗ת בִּ/לְבָבֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/002.yaml
  text: He who walks blamelessly[a], and does what is right[b], and speaks truth in his heart.
translation:
  language: fr
  text: Celui qui marche dans l’intégrité[a], qui fait ce qui est juste[b] et qui dit la vérité dans son cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de manière irréprochable ». Le terme hébreu évoque une conduite entière et intègre, pas nécessairement une perfection absolue.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui pratique la justice ». Le nom hébreu peut désigner la justice, la droiture ou ce qui est juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: marche
  rationale: Le participe de הלך évoque ici la manière de vivre. « Marche » conserve la métaphore hébraïque, familière dans le langage biblique français.
- source_word: תָּמִים
  choice: dans l’intégrité
  rationale: Le terme exprime la plénitude et la rectitude de la conduite, sans exiger l’idée de perfection morale absolue. La locution s’intègre naturellement à « marche ».
- source_word: וּפֹעֵל
  choice: qui fait
  rationale: Le participe de פעל désigne l’action ou la pratique. « Fait » est direct et naturel avec « ce qui est juste ».
- source_word: צֶדֶק
  choice: ce qui est juste
  rationale: צדק peut désigner la justice, la droiture ou ce qui est conforme au droit. Cette formulation rend clairement sa portée éthique concrète tout en laissant « justice » comme autre traduction possible.
- source_word: וְדֹבֵר
  choice: qui dit
  rationale: Le participe de דבר signifie parler ou dire. « Dit la vérité » constitue ici une expression française naturelle et conserve le parallélisme verbal.
- source_word: אֱמֶת
  choice: la vérité
  rationale: Avec le verbe « dire », אמת désigne principalement ce qui est vrai, tout en pouvant comporter une nuance de fiabilité ou de fidélité.
- source_word: בִּלְבָבוֹ
  choice: dans son cœur
  rationale: La traduction littérale préserve le cœur comme siège de la vie intérieure et maintient la tension entre vérité intérieure et parole sincère, sans transformer la préposition en « du fond du cœur ».
theological_decisions:
- issue: Singulier masculin à valeur représentative
  choice: Celui qui… son cœur
  alternative: Quiconque… dans son cœur
  rationale: Les participes et le suffixe hébreux sont au masculin singulier et peuvent avoir une portée générale. « Celui qui » en conserve la forme représentative naturelle en français.
- issue: Intégrité morale ou perfection absolue
  choice: marche dans l’intégrité
  alternative: marche irréprochablement
  rationale: תָּמִים décrit ici une conduite entière et droite; « intégrité » évite de faire du verset une affirmation explicite de perfection sans faute.
- issue: Vérité intérieure et parole sincère
  choice: dit la vérité dans son cœur
  alternative: dit la vérité du fond du cœur
  rationale: « Dans son cœur » suit la préposition hébraïque et préserve l’ambiguïté entre la vérité entretenue intérieurement et la sincérité de la parole. « Du fond du cœur » privilégierait la seconde lecture.
translation_notes:
  register: Français international moderne, sobre et poétique. Le triple parallélisme des participes hébreux est rendu par trois propositions relatives. La métaphore de la marche et l’expression « dans son cœur » sont conservées afin de respecter l’imagerie et l’ambiguïté du texte source.
