id: PSA.15.1
reference: Psalms 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/001.yaml
  text: A psalm of David[a]. O Yahweh[b], who may sojourn in your tent? Who may dwell on your holy mountain?
translation:
  language: fr
  text: Psaume de David[a]. Yahweh, qui peut séjourner dans ta tente[b] ? Qui peut demeurer sur ta montagne sainte ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; dans les titres des psaumes, l’hébreu peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
  - marker: b
    text: Ou « sanctuaire » ; l’hébreu dit littéralement « tente », image qui évoque probablement le sanctuaire comme demeure de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et exact pour ce genre de chant cultuel, particulièrement dans une suscription.
- source_word: לְדָוִד
  choice: de David
  rationale: Le français « de David » conserve l’ambiguïté de la préposition hébraïque לְ, qui peut exprimer l’auteur, l’association ou la dédicace.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin représenté par le tétragramme, plutôt que substitution par un titre.
- source_word: יָגוּר
  choice: peut séjourner
  rationale: Le verbe גור évoque le séjour d’un résident temporaire ou d’un hôte; « séjourner » préserve cette nuance et le contraste avec « demeurer ».
- source_word: בְּאָהֳלֶךָ
  choice: dans ta tente
  rationale: « Tente » rend directement אֹהֶל tout en laissant perceptible, dans le contexte, l’évocation du sanctuaire comme demeure de Dieu.
- source_word: יִשְׁכֹּן
  choice: peut demeurer
  rationale: שׁכן désigne le fait d’habiter ou de s’établir; « demeurer » forme un parallèle naturel avec « séjourner ».
- source_word: בְּהַר קָדְשֶׁךָ
  choice: sur ta montagne sainte
  rationale: Rend naturellement le syntagme hébreu et conserve le sens ordinaire de הַר, « montagne », en référence à Sion.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie le nom divin lui-même. « Yahweh » le représente sans lui substituer un titre.
- issue: Rapport exprimé par לְ dans לְדָוִד
  choice: de David
  alternative: par David; pour David
  rationale: « De David » préserve mieux l’indétermination de la suscription quant à l’auteur, à l’association ou à la dédicace.
- issue: Portée cultuelle de la tente
  choice: tente dans le texte, avec note « sanctuaire »
  alternative: tabernacle; sanctuaire
  rationale: Le sens concret de אֹהֶל est conservé sans effacer son évocation probable du sanctuaire divin.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé avec « séjourner » et « demeurer »; l’adresse à Dieu reste directe, sans ajout d’une interjection absente de l’hébreu.
