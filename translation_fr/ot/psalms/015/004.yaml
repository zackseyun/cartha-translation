source:
  edition: WLC
  text: נִבְזֶ֤ה בְּֽ/עֵ֘ינָ֤י/ו נִמְאָ֗ס וְ/אֶת יִרְאֵ֣י יְהוָ֣ה יְכַבֵּ֑ד נִשְׁבַּ֥ע לְ֝/הָרַ֗ע וְ/לֹ֣א יָמִֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/004.yaml
  text: In his eyes a despised person is rejected[a], but he honors those who fear Yahweh[b]; he swears to his own harm and does not change.
translation:
  language: fr
  text: À ses yeux, l’homme méprisable est méprisé[a], mais il honore ceux qui craignent Yahweh ; il jure à son propre détriment et ne change pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À ses yeux, une personne méprisable est rejetée. » La proposition hébraïque est très condensée ; les deux termes expriment le jugement négatif porté sur cette personne.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « il jure pour le mal et ne change pas ». Dans ce contexte, l’expression est généralement comprise ainsi : il tient son serment même lorsque celui-ci lui coûte ou lui porte préjudice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְזֶה
  choice: celui qui est méprisé
  rationale: Le participe passif désigne une personne tenue en mépris. Cette formulation conserve la forme hébraïque sans imposer d’emblée le jugement moral plus fort de « personne méprisable ».
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: Cette expression française naturelle préserve l’image hébraïque d’une appréciation ou d’un jugement personnel.
- source_word: נִמְאָס
  choice: est rejeté
  rationale: Le verbe exprime le rejet de quelqu’un comme indigne ou inacceptable. « Est rejeté » conserve la voix passive et évite de répéter exactement « méprisé ».
- source_word: יִרְאֵי יְהוָה
  choice: ceux qui craignent Yahweh
  rationale: La formulation garde le sens biblique de crainte respectueuse et fidèle, sans l’atténuer en simple respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יְכַבֵּד
  choice: il honore
  rationale: Au piel, כבד signifie ici accorder du poids, de l’estime ou de l’honneur à quelqu’un. « Honore » est précis et idiomatique.
- source_word: נִשְׁבַּע
  choice: il jure
  rationale: Le présent convient à la description générale du caractère de la personne et conserve explicitement l’idée de serment.
- source_word: לְהָרַע
  choice: à son propre détriment
  rationale: L’expression hébraïque est elliptique. Elle est couramment comprise comme un serment qui se révèle coûteux ou dommageable pour celui qui l’a prononcé.
- source_word: יָמִר
  choice: ne se rétracte pas
  rationale: Le hiphil signifie littéralement changer ou substituer. Dans le contexte d’un serment, « ne se rétracte pas » exprime naturellement qu’il ne revient pas sur son engagement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme. « Yahweh » en préserve la fonction de nom personnel sans le remplacer par un titre.
- issue: Sens de la proposition compacte נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: À ses yeux, celui qui est méprisé est rejeté
  alternative: À ses yeux, la personne méprisable est méprisée
  rationale: L’hébreu est très condensé et les deux termes peuvent être compris soit de manière passive, soit comme une évaluation morale. Le texte principal préserve leurs formes passives, tandis que la note signale l’autre lecture reconnue.
- issue: Portée de לְהָרַע dans la formule du serment
  choice: à son propre détriment
  alternative: pour faire du mal
  rationale: La construction est elliptique et pourrait, prise isolément, évoquer le fait de nuire. Dans cette description de fidélité à la parole donnée, elle est généralement comprise comme un serment maintenu même lorsqu’il devient préjudiciable à celui qui l’a fait.
translation_notes:
  register: Français international moderne, sobre et digne. La structure antithétique du verset est conservée. Le texte maintient la concision de l’hébreu tout en rendant explicite, avec « son propre », l’interprétation contextuelle de l’expression elliptique concernant le serment.
