  naturalness: « À ses yeux, l’homme méprisable est méprisé » est sobre, intelligible et d’un registre biblique naturel en français moderne. « Ne change pas » rend plus directement le verbe hébreu que « ne se rétracte pas », sans perdre l’objet implicite (son serment/son engagement).
  terminology: « Yahweh », « ceux qui craignent Yahweh » et « honore » sont cohérents avec le texte source et les choix terminologiques du projet. Aucun terme théologique confessionnel n’est introduit.
