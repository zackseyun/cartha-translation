source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְ֭הֹוָה מִי יָג֣וּר בְּ/אָהֳלֶ֑/ךָ מִֽי יִ֝שְׁכֹּ֗ן בְּ/הַ֣ר קָדְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: fr
  text: 'Psaume de David[a].


    Yahvé, qui peut séjourner dans ta tente[b] ?

    Qui peut demeurer sur ta montagne sainte ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; la suscription hébraïque peut indiquer l’auteur, une association ou une dédicace.
    reason: alternative_reading
  - marker: b
    text: Ou « tabernacle » ; l’hébreu dit littéralement « tente », image qui évoque probablement le sanctuaire comme demeure de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Le terme désigne un chant accompagné de musique et sert couramment de titre à un psaume.
- source_word: לְדָוִד
  choice: de David
  rationale: 'Cette formulation française conserve la concision de la suscription hébraïque, tandis que la note signale son éventail possible : auteur, association ou dédicace.'
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle représente le nom personnel divin exprimé par le tétragramme, plutôt que de le remplacer silencieusement par un titre.
- source_word: יָגוּר
  choice: peut séjourner
  rationale: Le verbe peut évoquer le fait de résider comme hôte ou résident temporaire; « séjourner » préserve cette nuance et le distingue du verbe parallèle suivant.
- source_word: בְּאָהֳלֶךָ
  choice: dans ta tente
  rationale: Traduction concrète et directe de « ta tente », avec une note indiquant l'allusion probable au sanctuaire.
- source_word: יִשְׁכֹּן
  choice: peut demeurer
  rationale: « Demeurer » exprime l'installation ou la résidence durable et maintient le parallélisme sans rendre les deux verbes hébreux de manière identique.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: sur ta montagne sainte
  rationale: La formulation rend directement le lieu sacré appartenant à Dieu, probablement le mont de son sanctuaire.
theological_decisions:
- issue: Représentation du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le texte source emploie un nom propre. Le rendre par « Yahvé » permet au lecteur français de reconnaître cette dimension sans transformer le nom en titre.
- issue: Sens cultuel de la « tente »
  choice: Conserver l’image littérale « tente » et expliquer l’allusion en note
  alternative: tabernacle / sanctuaire
  rationale: L’hébreu dit littéralement « tente ». Le contexte évoque vraisemblablement la demeure cultuelle de Dieu, mais traduire directement par « sanctuaire » supprimerait l’image et résoudrait implicitement sa portée.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux questions parallèles gardent leur rythme poétique, tandis que « séjourner » et « demeurer » reflètent la différence entre les deux verbes hébreux. Le tutoiement correspond à l’adresse directe à Dieu et à la deuxième personne du singulier du texte source.
