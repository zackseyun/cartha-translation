  naturalness: La formulation est naturelle, claire et digne en français international moderne. La disposition en deux lignes reproduit utilement le parallélisme poétique. « Fait connaître » est idiomatique et convient mieux ici qu’une formulation excessivement solennelle ou paraphrastique.
  terminology: « Prescriptions » rend bien le caractère normatif de חֻקִּים; « jugements » maintient à juste titre l’amplitude juridique de מִשְׁפָּטִים sans la réduire à des décisions judiciaires particulières. Les noms propres bibliques Jacob et Israël sont employés selon l’usage français courant. Aucun ancrage de note n’est requis dans le texte français, les ambiguïtés lexicales ayant été conservées par les choix de traduction.
