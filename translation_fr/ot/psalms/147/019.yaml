  variant: modern international French
source:
  edition: WLC
  text: מַגִּ֣יד דבר/ו לְ/יַעֲקֹ֑ב חֻקָּ֥י/ו וּ֝/מִשְׁפָּטָ֗י/ו לְ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/019.yaml
  text: He declares his word to Jacob[b][a], his statutes and his judgments to Israel.
translation:
  language: fr
  text: 'Il fait connaître sa parole à Jacob,

    ses prescriptions et ses jugements à Israël.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַגִּיד
  choice: fait connaître
  rationale: Le participe hiphil de נגד exprime l’action de faire connaître ou d’annoncer. « Fait connaître » est naturel en français et conserve ici la valeur factitive du verbe.
- source_word: דברו
  choice: sa parole
  rationale: דָּבָר peut désigner une parole, un message ou une chose. Dans ce parallélisme avec les prescriptions et les jugements divins, « sa parole » garde la portée large et solennelle de l’hébreu.
- source_word: לְיַעֲקֹב
  choice: à Jacob
  rationale: La préposition ל marque le destinataire. Le nom « Jacob » est conservé tel quel et désigne collectivement le peuple dans le parallélisme poétique avec Israël.
- source_word: חֻקָּיו
  choice: ses prescriptions
  rationale: חֹק désigne ce qui est fixé ou prescrit, notamment une règle ou un statut. « Prescriptions » exprime clairement cette dimension normative en français moderne.
- source_word: וּמִשְׁפָּטָיו
  choice: et ses jugements
  rationale: מִשְׁפָּטִים peut désigner des jugements, décisions judiciaires ou règles de droit. « Jugements » préserve le lien lexical avec l’acte de juger et l’ambiguïté du terme dans son cadre juridique et d’alliance.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: La préposition indique de nouveau le destinataire. « Israël » répond poétiquement à « Jacob » comme autre désignation du peuple de l’alliance.
theological_decisions:
- issue: Sens collectif de Jacob et d’Israël
  choice: Conserver simplement « à Jacob » et « à Israël ».
  alternative: Expliciter « au peuple de Jacob » ou « aux descendants de Jacob » dans le texte.
  rationale: L’hébreu emploie directement les deux noms de l’alliance. Les conserver maintient le parallélisme et évite une explicitation absente du texte source.
- issue: Portée juridique de מִשְׁפָּטִים
  choice: Traduire par « jugements » sans préciser davantage.
  alternative: Employer « règles », « ordonnances » ou « décisions de justice ».
  rationale: Le contexte associe le terme aux prescriptions divines, mais l’hébreu peut évoquer aussi bien les décisions judiciaires que l’ordre juridique établi. « Jugements » préserve cette tension lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébraïque est conservé en deux lignes, sans ajouter « peuple » ni expliciter la relation entre Jacob et Israël.
