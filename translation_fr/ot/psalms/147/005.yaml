  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: fr
  text: Grand est notre Seigneur, et sa puissance est immense ; son intelligence est sans nombre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son intelligence est innombrable ». Littéralement : « il n’y a pas de nombre à son intelligence ».'
    reason: L’expression hébraïque affirme qu’aucun nombre ne peut en rendre compte; la note explicite l’idiome tout en conservant dans le texte l’image numérique.
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grand
  rationale: L’adjectif placé en tête conserve l’ordre hébreu et la force proclamatoire de l’ouverture.
- source_word: אֲדֹנֵינוּ
  choice: notre Seigneur
  rationale: אֲדוֹן est ici un titre accompagné du suffixe « notre », et non le nom divin YHWH. « Seigneur » est son équivalent français usuel et digne.
- source_word: וְרַב כֹּחַ
  choice: immense est sa puissance
  rationale: רַב exprime ici une grandeur considérable, et כֹּחַ la force ou la puissance. Cette formulation naturelle évite de répéter « grand » tout en conservant le parallélisme du verset.
- source_word: לִתְבוּנָתוֹ
  choice: son intelligence
  rationale: תְּבוּנָה désigne l’intelligence, la compréhension ou le discernement. « Intelligence » est clair et suffisamment large dans ce contexte de louange.
- source_word: אֵין מִסְפָּר
  choice: est sans mesure
  rationale: L’expression hébraïque affirme littéralement l’absence de nombre. « Sans mesure » exprime naturellement en français le caractère illimité de l’intelligence divine, tandis que la note conserve l’image numérique.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנֵינוּ
  choice: notre Seigneur
  alternative: notre maître
  rationale: Le texte emploie le titre אֲדוֹן avec le suffixe de première personne du pluriel, et non le nom divin. « Notre Seigneur » préserve la valeur honorifique sans substituer « l’Éternel » ou une autre convention réservée à YHWH.
- issue: Portée de l’intelligence divine dans אֵין מִסְפָּר
  choice: son intelligence est sans mesure
  alternative: son intelligence est sans nombre
  rationale: La formulation retenue préserve l’affirmation d’une intelligence illimitée sans préciser davantage sa nature ni résoudre l’image poétique en une proposition doctrinale plus technique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’inversion « Grand est notre Seigneur » et le parallélisme « immense est sa puissance » maintiennent le ton doxologique et poétique du verset.
