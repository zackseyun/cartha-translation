  text: שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת יְהוָ֑ה הַֽלְלִ֖י אֱלֹהַ֣יִ/ךְ צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: fr
  text: Jérusalem, célèbre Yahweh ! Sion, loue ton Dieu !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: célèbre
  rationale: Impératif féminin singulier adressé à Jérusalem personnifiée. « Célèbre » exprime naturellement l’appel à proclamer la grandeur de Dieu tout en distinguant légèrement ce verbe du parallèle הַֽלְלִי.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre ; la ville est personnifiée comme destinataire de l’impératif féminin.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le marqueur d’objet direct אֶת n’est pas traduit séparément. Le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans l’hébreu.
- source_word: הַֽלְלִי
  choice: loue
  rationale: Impératif féminin singulier de הלל. « Loue » est l’équivalent français courant et convient au parallélisme poétique.
- source_word: אֱלֹהַיִךְ
  choice: ton Dieu
  rationale: 'Le suffixe féminin singulier renvoie à Sion personnifiée. Malgré la morphologie plurielle du nom, le référent est ici singulier : le Dieu d’Israël.'
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle du nom propre, parallèle à « Jérusalem » et sans ajout interprétatif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le Tétragramme. « Yahweh » le traite comme un nom propre et évite de le remplacer silencieusement par un titre ; « Jéhovah » repose sur une vocalisation secondaire.
translation_notes:
  register: Poésie brève, solennelle et directement compréhensible. L’antéposition des vocatifs (« Jérusalem », « Sion ») est naturelle en français et met en valeur le parallélisme. Deux verbes proches, « célèbre » et « loue », rendent les deux impératifs hébreux sans alourdir le verset.
