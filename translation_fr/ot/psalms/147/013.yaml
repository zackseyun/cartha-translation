  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: fr
  text: Car il a renforcé les barres de tes portes ; il a béni tes enfants[a] au milieu de toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes fils ». Le mot hébreu peut désigner les fils en particulier ou, plus largement, les enfants et descendants ; ici, le contexte civique favorise le sens collectif.
    reason: lexical_alternative
  - marker: b
    text: Ou « en ton sein ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de l’appel à louer qui précède ; « Car » conserve ce lien causal et convient au registre poétique.
- source_word: חִזַּק
  choice: a renforcé
  rationale: Le piel accompli exprime l’action de rendre fort ou solide. « A renforcé » restitue directement cette action achevée.
- source_word: בְּרִיחֵי
  choice: les barres
  rationale: Le terme désigne les barres ou verrous qui assuraient la fermeture d’une porte. « Barres » reste précis sans imposer un mécanisme particulier.
- source_word: שְׁעָרָיִךְ
  choice: de tes portes
  rationale: Le pluriel muni d’un suffixe féminin singulier s’adresse à Jérusalem personnifiée. La formulation française conserve cette adresse directe.
- source_word: בֵּרַךְ
  choice: il a béni
  rationale: Le piel accompli de ברך signifie « bénir ». La traduction garde le sens verbal et l’aspect accompli.
- source_word: בָּנַיִךְ
  choice: tes enfants
  rationale: בנים peut désigner spécifiquement des fils ou, collectivement, les enfants et descendants. Dans l’adresse civique à Jérusalem, « tes enfants » exprime naturellement l’ensemble de ses habitants.
- source_word: בְּקִרְבֵּךְ
  choice: en ton sein
  rationale: L’expression signifie littéralement « au milieu de toi ». « En ton sein » conserve la personnification de la ville dans une tournure française naturelle et digne.
theological_decisions:
- issue: Destinataire féminin singulier personnifié
  choice: Maintenir l’adresse directe à la ville par « tes » et « ton ».
  alternative: Nommer explicitement Jérusalem dans le verset.
  rationale: Les suffixes hébreux sont au féminin singulier et renvoient à Jérusalem ou Sion personnifiée ; il n’est pas nécessaire d’ajouter un nom absent du texte.
- issue: Portée de בנים dans le contexte civique
  choice: « tes enfants »
  alternative: « tes fils »
  rationale: Le mot peut être masculin au sens strict ou collectif. Le contexte de la ville personnifiée favorise le sens collectif, tout en laissant l’autre possibilité signalée en note.
translation_notes:
  register: Français international moderne, sobre et poétique. Le tutoiement féminin singulier préserve la personnification de Jérusalem. Le point-virgule reproduit le parallélisme des deux actions divines.
