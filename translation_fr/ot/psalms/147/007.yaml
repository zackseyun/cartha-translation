source:
  edition: WLC
  text: עֱנ֣וּ לַ/יהוָ֣ה בְּ/תוֹדָ֑ה זַמְּר֖וּ לֵ/אלֹהֵ֣י/נוּ בְ/כִנּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: fr
  text: Chantez pour Yahweh avec des actions de grâce[a] ; jouez pour notre Dieu sur la lyre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Répondez à Yahweh avec des actions de grâce ». Le verbe hébreu peut signifier « répondre » ; dans ce contexte, il peut évoquer une réponse chantée.
    reason: lexical_alternative
  - marker: b
    text: Ou « harpe ». Le kinnor était un instrument à cordes, plus précisément une lyre.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: Chantez
  rationale: Le qal de ענה signifie fondamentalement « répondre », mais, dans un contexte musical et en parallèle avec זַמְּרוּ, il évoque ici le chant, probablement un chant responsorial. « Chantez » rend naturellement cet emploi contextuel.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל indique le destinataire du chant, et le nom divin יהוה est transcrit « Yahweh ».
- source_word: בְּתוֹדָה
  choice: avec reconnaissance
  rationale: תּוֹדָה désigne l’action de grâce ou l’expression reconnaissante de la louange. « Avec reconnaissance » conserve cette nuance, tandis que ב exprime ici la manière ou l’accompagnement.
- source_word: זַמְּרוּ
  choice: célébrez
  rationale: זמר désigne le fait de chanter ou de jouer en l’honneur de quelqu’un. « Célébrez » évite une répétition pesante de « chantez » tout en gardant l’idée de louange musicale précisée par l’instrument.
- source_word: לֵאלֹהֵינוּ
  choice: notre Dieu
  rationale: Le possessif pluriel est conservé, et ל présente Dieu comme le destinataire de la célébration.
- source_word: בְכִנּוֹר
  choice: au son de la lyre
  rationale: כִּנּוֹר désigne un instrument ancien à cordes, plus précisément une lyre. « Au son de » exprime naturellement l’accompagnement instrumental marqué par ב.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. La transcription « Yahweh » préserve le nom divin personnel sans le remplacer par un titre.
- issue: Portée de עֱנוּ dans un contexte cultuel
  choice: Chantez
  alternative: Répondez
  rationale: Le sens lexical de « répondre » demeure possible, mais le parallélisme musical favorise l’idée d’entonner un chant ou de chanter en réponse. La note conserve l’ambiguïté sans imposer une forme liturgique précise.
translation_notes:
  register: Français international moderne, naturel et digne. « Reconnaissance » rend explicitement l’action de grâce ; « au son de la lyre » restitue avec fluidité l’accompagnement instrumental. Les deux impératifs parallèles restent distincts sans créer de répétition artificielle.
