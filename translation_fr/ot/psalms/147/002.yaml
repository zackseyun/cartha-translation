source:
  edition: WLC
  text: בּוֹנֵ֣ה יְרוּשָׁלִַ֣ם יְהוָ֑ה נִדְחֵ֖י יִשְׂרָאֵ֣ל יְכַנֵּֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/002.yaml
  text: Yahweh builds Jerusalem[b][a]; he gathers the outcasts of Israel.
translation:
  language: fr
  text: Yahweh bâtit Jérusalem[a] ; il rassemble les dispersés d’Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rebâtit Jérusalem ». Dans ce contexte de restauration, le verbe peut évoquer la reconstruction de la ville, bien que l’hébreu dise simplement « bâtit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les bannis », « ceux qui ont été chassés » ou « les exilés d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  choice: bâtit
  rationale: Le participe qal de בנה présente l’action comme actuelle ou habituelle. « Bâtit » reste proche de l’hébreu, tandis que le contexte permet aussi de comprendre une reconstruction ou une restauration.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom propre.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, conservé comme nom propre plutôt que remplacé par un titre.
- source_word: נִדְחֵי
  choice: les dispersés
  rationale: Le terme désigne ceux qui ont été chassés, repoussés ou dispersés. « Les dispersés » rend naturellement l’idée de personnes éloignées que Dieu rassemble, sans limiter le sens à une déportation officielle.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom propre national.
- source_word: יְכַנֵּס
  choice: il rassemble
  rationale: Le piel inaccompli de כנס signifie réunir ou rassembler. Le présent français convient au parallélisme avec le participe initial et à la portée générale de l’énoncé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le tétragramme. La transcription préserve le nom personnel sans lui substituer un titre.
- issue: Portée restauratrice de בּוֹנֵה
  choice: bâtit
  alternative: rebâtit
  rationale: « Bâtit » traduit directement le verbe sans rendre obligatoire l’idée de reconstruction ; la valeur restauratrice suggérée par le contexte est signalée en note.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La syntaxe est naturelle, tout en conservant le parallélisme des deux propositions hébraïques.
