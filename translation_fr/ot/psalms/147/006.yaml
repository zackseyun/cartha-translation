id: PSA.147.6
reference: Psalms 147:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: fr
  text: Yahweh relève les humbles[a] ; il abaisse les méchants jusqu’à terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soutient les humbles ». Le terme hébreu peut aussi évoquer les personnes affligées ou abaissées.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « jusqu’à la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: relève
  rationale: Le participe exprime l’action de fortifier, soutenir ou remettre debout. « Relève » conserve cette idée de restauration tout en faisant ressortir le contraste vertical avec « abaisse ».
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme peut désigner les humbles, les doux ou les personnes affligées et socialement abaissées. « Les humbles » reste naturel et maintient le contraste éthique et social avec « les méchants ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle plutôt que remplacé par un titre.
- source_word: מַשְׁפִּיל
  choice: abaisse
  rationale: Le causatif de שׁפל signifie rendre bas, rabaisser. « Abaisse » restitue ce sens actif et répond directement à « relève ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Traduction française courante de la catégorie morale désignée par רְשָׁעִים dans les Psaumes.
- source_word: עֲדֵי אָרֶץ
  choice: jusqu’à terre
  rationale: La locution marque l’aboutissement de l’abaissement, littéralement jusqu’à la terre. « Jusqu’à terre » conserve l’image avec une formulation française naturelle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le Tétragramme ; « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Portée de עֲנָוִים
  choice: les humbles
  alternative: les affligés / les opprimés / les doux
  rationale: Le mot associe souvent humilité et condition d’abaissement ou de détresse. Le texte principal retient « les humbles », tandis que la note préserve l’autre nuance sans réduire le groupe à une seule catégorie sociale.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme antithétique est conservé par « relève » et « abaisse », avec une ponctuation qui respecte les deux membres du vers.
