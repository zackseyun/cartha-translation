revisions:
- from: Louez Yah[a] ! Oui, il est bon de célébrer notre Dieu par des chants, car cela est agréable, et la louange lui convient[b].
  to: Louez Yah[a] ! Car il est bon de chanter les louanges de notre Dieu ; car c’est agréable, et la louange est belle[b].
  rationale: La révision retire l’ajout interprétatif « lui », rend plus directement l’infinitif musical hébreu et maintient, dans le texte comme dans la note, la souplesse sémantique de נָאוָה תְהִלָּה. Elle ne modifie ni le sens théologique ni le statut distinct de « Yah ».
