  text: הַ֥לְלוּ יָ֨הּ כִּי ט֭וֹב זַמְּרָ֣ה אֱלֹהֵ֑י/נוּ כִּֽי נָ֝עִים נָאוָ֥ה תְהִלָּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: fr
  text: Louez Yah[a] ! Car il est bon de chanter les louanges de notre Dieu ; car c’est agréable, et la louange est belle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yah », forme abrégée du nom divin ; beaucoup de traductions rendent ce nom par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la louange est séante » ou « la louange est appropriée ». Le terme hébreu peut exprimer ce qui est beau, convenable ou approprié ; la construction peut aussi être rendue par « il convient de louer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louez
  rationale: 'Impératif pluriel de הלל : il ouvre le psaume par un appel direct et collectif à la louange.'
- source_word: יָהּ
  choice: Yah
  rationale: Le texte emploie la forme abrégée du nom divin, distincte du tétragramme complet ; la translittération préserve cette forme et son lien avec « alléluia ».
- source_word: כִּי טוֹב
  choice: Oui, il est bon
  rationale: כִּי peut ici appuyer ou motiver l’exhortation. « Oui » produit un enchaînement français naturel tout en conservant la valeur affirmative de la proposition.
- source_word: זַמְּרָה
  choice: célébrer … par des chants
  rationale: Cette forme liée à זמר désigne la louange chantée ou musicale ; la formulation française exprime à la fois l’action de chanter et sa visée laudative.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom en construction avec le suffixe de première personne du pluriel.
- source_word: נָעִים
  choice: agréable
  rationale: L’adjectif exprime ce qui est plaisant, doux ou délectable, sans imposer un sens exclusivement esthétique.
- source_word: נָאוָה תְהִלָּה
  choice: la louange lui convient
  rationale: נָאוָה évoque ce qui sied, convient ou est approprié. Le pronom « lui » explicite en français que la louange convient à Dieu, compréhension naturelle dans le contexte, tout en signalant en note l’autre construction possible.
theological_decisions:
- issue: Rendu du nom divin abrégé יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: La source porte יָהּ, forme abrégée du nom divin, et non le tétragramme complet. « Yah » préserve cette distinction et le lien liturgique avec « alléluia ».
- issue: Rapport syntaxique de נָאוָה תְהִלָּה
  choice: la louange lui convient
  alternative: la louange est belle / il convient de louer
  rationale: Le groupe peut caractériser la louange comme convenable, belle ou séante. Le rendu choisi est idiomatique et théologiquement sobre, tandis que la note conserve l’ambiguïté lexicale et syntaxique.
translation_notes:
  register: Français international moderne, digne et accessible. L’exclamation restitue l’appel liturgique initial. « Célébrer … par des chants » évite l’expression moins naturelle « chanter des louanges » tout en conservant la dimension musicale. La ponctuation garde le parallélisme sans alourdir le verset.
