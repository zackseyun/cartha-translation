    issue: « espèrent en son amour fidèle »
    rationale: La préposition « en » suggère plus volontiers en français l’idée de mettre sa confiance dans cet amour. L’hébreu הַמְיַחֲלִים לְחַסְדּוֹ présente son hèsèd comme l’objet attendu ou espéré. « espèrent son amour fidèle » conserve cette relation sans lever l’ambiguïté lexicale entre attendre et espérer.
