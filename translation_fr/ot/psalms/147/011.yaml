  text: רוֹצֶ֣ה יְ֭הוָה אֶת יְרֵאָ֑י/ו אֶת הַֽ/מְיַחֲלִ֥ים לְ/חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: fr
  text: 'Yahweh prend plaisir à ceux qui le craignent,

    à ceux qui espèrent[a] son amour fidèle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui attendent son amour fidèle ». Le verbe hébreu peut exprimer à la fois l’attente et l’espérance confiante.
    reason: lexical_alternative
  - marker: b
    text: L’expression « amour fidèle » traduit l’hébreu hèsèd, qui peut désigner l’amour loyal, la bonté et la miséricorde de Yahweh, notamment dans le cadre de son alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: prend plaisir à
  rationale: Le participe de רצה exprime ici l’approbation bienveillante et le plaisir, plutôt qu’une simple volonté. « Prend plaisir à » est naturel et conserve la chaleur relationnelle du contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération « Yahweh » rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: יְרֵאָיו
  choice: ceux qui le craignent
  rationale: Cette formulation idiomatique conserve le langage biblique de la crainte de Dieu et sa tension entre crainte, révérence et fidélité, sans le réduire à un simple respect.
- source_word: הַמְיַחֲלִים
  choice: ceux qui espèrent
  rationale: Le verbe יחל peut évoquer à la fois l’attente et l’espérance. Dans ce contexte, « espèrent » exprime clairement l’attente confiante orientée vers l’amour fidèle de Yahweh.
- source_word: לְחַסְדּוֹ
  choice: en son amour fidèle
  rationale: חסד désigne ici un amour durable, loyal et miséricordieux. « Amour fidèle » est une expression française concise qui en préserve les dimensions affective et relationnelle sans développer excessivement le terme.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le Tétragramme. « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Nuance de la crainte de Dieu
  choice: ceux qui le craignent
  alternative: ceux qui le révèrent
  rationale: Le maintien du verbe « craindre » préserve la tension théologique du texte entre crainte, révérence et confiance, tandis que « révérer » risquerait d’en atténuer une dimension.
- issue: Attente ou espérance exprimée par יחל
  choice: ceux qui espèrent en son amour fidèle
  alternative: ceux qui attendent son amour fidèle
  rationale: « Espèrent » rend naturellement l’orientation confiante vers le חסד de Yahweh; la note conserve la nuance réelle d’attente présente dans le verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur deux lignes. « Prend plaisir à » demeure courant sans être familier; « craignent » maintient volontairement la force et la tension du vocabulaire biblique.
