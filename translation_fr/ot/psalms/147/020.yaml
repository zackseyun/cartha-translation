    issue: Discordance entre « aucune nation » et « elles »
    rationale: Le premier membre emploie un singulier distributif (« aucune nation »), tandis que le second reprend par un pronom pluriel (« elles »). Le texte hébreu peut viser collectivement les nations, mais la formulation française actuelle est heurtée. « Ils n’ont pas connu ses jugements » reprend naturellement les peuples/nations de façon collective, sans modifier le sens.
