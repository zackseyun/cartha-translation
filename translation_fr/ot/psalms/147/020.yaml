  text: לֹ֘א עָ֤שָׂה כֵ֨ן לְ/כָל גּ֗וֹי וּ/מִשְׁפָּטִ֥ים בַּל יְדָע֗וּ/ם הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: fr
  text: Il n’a pas agi ainsi envers aucune nation ; ils n’ont pas connu ses jugements. Louez Yah ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Alléluia ! » L’hébreu halelou-yah signifie littéralement « Louez Yah », avec la forme courte du nom divin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן
  choice: Il n’a agi ainsi
  rationale: Le passé composé rend naturellement en français l’accompli hébreu, tandis que « ainsi » renvoie aux actes privilégiés décrits au verset précédent.
- source_word: לְכָל גּוֹי
  choice: envers aucune nation
  rationale: Sous la portée de la négation, « aucune nation » exprime idiomatiquement le sens de « pas ainsi pour toute nation » ; « envers » convient au verbe « agir ».
- source_word: וּמִשְׁפָּטִים
  choice: quant à ses jugements
  rationale: « Jugements » conserve l’étendue sémantique de מִשְׁפָּטִים sans réduire le terme à de simples lois. Le possessif explicite que ces jugements sont ceux de Dieu, ce que le contexte indique.
- source_word: בַּל יְדָעוּם
  choice: elles ne les ont pas connus
  rationale: Le suffixe objet masculin pluriel est rendu par « les », reprenant « jugements ». Le féminin « elles » reprend naturellement « les nations », collectif implicite après « aucune nation ».
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: L’impératif pluriel est traduit directement et la forme courte du nom divin, יָהּ, est translittérée « Yah » plutôt que développée en « le Seigneur ».
theological_decisions:
- issue: Portée de l’affirmation sur les nations et les jugements divins
  choice: « quant à ses jugements, elles ne les ont pas connus »
  alternative: « et elles n’ont pas connu ses jugements »
  rationale: La dislocation met en évidence l’objet antéposé en hébreu sans préciser si « connaître » signifie recevoir, reconnaître ou comprendre ; l’ambiguïté théologique demeure.
- issue: Rendu de la forme courte du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur / Alléluia
  rationale: Le texte emploie la forme courte יָהּ. La translittération respecte cette forme précise et garde transparent le sens de l’acclamation.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve le parallélisme, l’objet antéposé « ses jugements » et l’acclamation finale, sans expliciter au-delà de l’hébreu la nature de la connaissance refusée aux nations.
