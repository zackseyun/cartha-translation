source:
  edition: WLC
  text: הַֽ/מְכַסֶּ֬ה שָׁמַ֨יִם בְּ/עָבִ֗ים הַ/מֵּכִ֣ין לָ/אָ֣רֶץ מָטָ֑ר הַ/מַּצְמִ֖יחַ הָרִ֣ים חָצִֽיר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/008.yaml
  text: who covers the heavens with clouds[a], who prepares rain for the earth, who makes grass sprout on the mountains.
translation:
  language: fr
  text: lui qui couvre le ciel de nuages, qui prépare la pluie pour la terre, qui fait pousser l’herbe sur les montagnes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: couvre
  rationale: Le participe de כסה exprime l’action de couvrir ou de dissimuler. « Couvre » est direct, naturel et convient à l’image des nuages.
- source_word: שָׁמַיִם
  choice: le ciel
  rationale: Bien que la forme hébraïque soit plurielle, « le ciel » désigne naturellement en français l’étendue où se trouvent les nuages; « les cieux » serait ici plus solennel et moins courant.
- source_word: עָבִים
  choice: nuages
  rationale: Le nom désigne des nuages, éventuellement épais; le contexte n’exige pas d’expliciter leur densité.
- source_word: מֵּכִין
  choice: prépare
  rationale: Le hifil de כון peut signifier préparer, disposer ou établir. Avec la pluie, « prépare » conserve l’idée d’une action divine intentionnelle sans la développer excessivement.
- source_word: לָאָרֶץ
  choice: pour la terre
  rationale: Dans ce contexte cosmique et météorologique, « la terre » convient mieux que le sens local possible « le pays ».
- source_word: מָטָר
  choice: la pluie
  rationale: Équivalent français simple et exact du nom hébreu.
- source_word: מַּצְמִיחַ
  choice: fait pousser
  rationale: Cette tournure rend clairement la valeur causative du hifil de צמח tout en restant idiomatique en français moderne.
- source_word: הָרִים
  choice: les montagnes
  rationale: Le sens ordinaire est « montagnes »; « collines » atténuerait inutilement l’image.
- source_word: חָצִיר
  choice: l’herbe
  rationale: Le mot désigne couramment l’herbe ou la végétation herbacée; « l’herbe » est ici clair et naturel.
theological_decisions:
- issue: L’action divine exprimée par une suite de participes
  choice: Maintien de la séquence relative « lui qui couvre… qui prépare… qui fait pousser… »
  alternative: 'Employer des verbes conjugués indépendants : « Il couvre… il prépare… il fait pousser… »'
  rationale: Les participes hébreux prolongent syntaxiquement le contexte précédent et présentent ces actes comme caractéristiques de l’action constante de Dieu. La répétition de « qui » préserve ce lien poétique.
translation_notes:
  register: Français moderne, international et digne. « Lui qui » permet au fragment de verset de conserver son lien avec le référent divin du contexte précédent. La formulation reste poétique sans archaïsme.
