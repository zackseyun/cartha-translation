base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/003.yaml
  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: fr
  text: Il guérit ceux qui ont le cœur brisé et panse leurs blessures[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs douleurs » ou « leurs maux ». Le terme hébreu peut désigner une douleur, un mal ou une blessure ; « blessures » est retenu parce qu’il s’accorde avec l’image de l’action de panser.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: Il guérit
  rationale: Le participe qal de רפא a ici une valeur descriptive et habituelle dans le contexte de louange. Le présent français rend naturellement cette action caractéristique de Dieu.
- source_word: לִשְׁבוּרֵי לֵב
  choice: ceux qui ont le cœur brisé
  rationale: La construction signifie littéralement « les brisés de cœur ». Cette formulation française actuelle conserve la métaphore tout en restant claire et digne.
- source_word: וּמְחַבֵּשׁ
  choice: et panse
  rationale: Dans un contexte de guérison, חבש évoque l’action de bander ou de soigner une plaie. « Panser » maintient avec concision l’image médicale concrète.
- source_word: לְעַצְּבוֹתָם
  choice: leurs blessures
  rationale: Le nom peut désigner des douleurs, des atteintes ou des blessures. « Blessures » convient particulièrement à l’action de panser, tout en laissant le parallélisme inclure la souffrance intérieure.
theological_decisions:
- issue: Portée de l’image de guérison
  choice: Conserver ensemble la détresse intérieure et l’image concrète du soin des blessures.
  alternative: Réduire le verset soit à une guérison exclusivement spirituelle, soit à une guérison principalement physique.
  rationale: Le parallélisme rapproche le cœur brisé des blessures pansées. La traduction préserve cette tension et ne limite pas la déclaration à un seul domaine.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux qui ont le cœur brisé » est immédiatement compréhensible ; « panse leurs blessures » préserve l’image médicale et le parallélisme poétique.
