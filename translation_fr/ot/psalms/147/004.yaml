  text: מוֹנֶ֣ה מִ֭סְפָּר לַ/כּוֹכָבִ֑ים לְ֝/כֻלָּ֗/ם שֵׁמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: fr
  text: Il compte le nombre des étoiles ; il les appelle toutes par leur nom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה
  choice: compte
  rationale: Le participe de מנה exprime l’action de compter ou de dénombrer. Le présent « compte » rend naturellement la formulation poétique et l’action continue attribuée à Dieu.
- source_word: מִסְפָּר לַכּוֹכָבִים
  choice: le nombre des étoiles
  rationale: מִסְפָּר signifie « nombre, compte » et, dans cette construction avec מנה, souligne le dénombrement exact des étoiles. La tournure retenue reste proche de l’hébreu tout en étant naturelle en français.
- source_word: לְכֻלָּם
  choice: les… toutes
  rationale: 'Cette formulation conserve l’idée exhaustive et distributive : aucune étoile n’est exclue.'
- source_word: שֵׁמוֹת
  choice: par leur nom
  rationale: Bien que le nom hébreu soit au pluriel (« noms »), l’expression française idiomatique « appeler chacun par son nom » permet ici « les appeler toutes par leur nom », qui exprime l’identification individuelle.
- source_word: יִקְרָא
  choice: il… appelle
  rationale: קרא peut signifier appeler, nommer ou convoquer. Avec « noms », « appelle… par leur nom » préserve l’ambiguïté entre le fait de nommer et celui d’appeler personnellement, sans imposer l’idée de simple attribution d’un nom.
theological_decisions:
- issue: Sujet divin implicite
  choice: Employer « Il », renvoyant à Dieu dans le contexte.
  alternative: Répéter explicitement « Dieu » ou « le Seigneur ».
  rationale: L’hébreu n’énonce pas de sujet nominal dans ce verset ; celui-ci se déduit du contexte. Le pronom maintient cette continuité sans ajouter un titre absent du texte.
- issue: Portée de l’appel par le nom
  choice: « il les appelle toutes par leur nom »
  alternative: « il donne un nom à chacune »
  rationale: La solution retenue ne tranche pas indûment entre le fait de nommer chaque étoile et celui de l’appeler ou de la convoquer par son nom.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme des deux propositions est conservé, ainsi que l’insistance sur la totalité des étoiles. Aucun marqueur de note n’est nécessaire.
