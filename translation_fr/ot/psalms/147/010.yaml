source:
  edition: WLC
  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: fr
  text: Il ne prend pas plaisir à la force du cheval ; il ne trouve pas son plaisir dans les jambes de l’homme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבוּרַת הַסּוּס
  choice: la puissance du cheval
  rationale: « Puissance » rend la force ou la vigueur du cheval, ici envisagée comme moyen de puissance humaine, probablement militaire.
- source_word: יֶחְפָּץ
  choice: prend plaisir
  rationale: Rend naturellement le verbe חפץ dans ce contexte, sans réduire son sens à une simple préférence.
- source_word: שׁוֹקֵי הָאִישׁ
  choice: les jambes de l’homme
  rationale: Traduction concrète de שׁוֹקֵי, qui désigne les jambes ou les jarrets, et conservation de l’article défini de הָאִישׁ.
- source_word: יִרְצֶה
  choice: se complaît
  rationale: Exprime l’agrément ou la faveur avec une tournure française digne, tout en maintenant le parallélisme avec « prend plaisir ».
theological_decisions:
- issue: Objet du déplaisir divin
  choice: Conserver les images concrètes du cheval puissant et des jambes humaines
  alternative: Expliciter « la puissance militaire » ou « la force humaine »
  rationale: Le verset évoque ces idées par métonymie, mais ne les nomme pas directement. Les images doivent rester intactes afin de ne pas résoudre l’implicite du texte.
translation_notes:
  register: Français moderne, clair et soutenu. Le parallélisme hébreu est conservé avec deux formulations proches mais non identiques. « L’homme » préserve l’article défini du texte massorétique sans lui attribuer un référent particulier.
