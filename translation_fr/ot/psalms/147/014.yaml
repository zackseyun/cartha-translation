lexical_decisions:
- source_word: הַשָּׂם
  choice: Il établit
  rationale: Le participe de שׂים, qui renvoie à Dieu, est rendu par un présent français naturel. « Établit » conserve l’idée de placer ou d’instaurer.
- source_word: גְּבוּלֵךְ שָׁלוֹם
  choice: la paix à tes frontières
  rationale: Cette formulation française naturelle reste proche de la construction hébraïque, où « paix » suit « tes frontières », sans réduire שָׁלוֹם au seul calme.
- source_word: חֵלֶב חִטִּים
  choice: du meilleur froment
  rationale: 'Littéralement « la graisse du blé » : חֵלֶב désigne ici la part la plus riche ou la meilleure. « Froment » précise qu’il s’agit du blé et convient au registre poétique.'
- source_word: יַשְׂבִּיעֵךְ
  choice: il te rassasie
  rationale: Le hiphil de שׂבע signifie rassasier ou combler. « Rassasie » préserve l’image concrète d’une nourriture donnée en abondance.
