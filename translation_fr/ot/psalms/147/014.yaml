  text: He makes your borders peaceful[a]; he satisfies you with the finest wheat.
translation:
  language: fr
  text: Il établit la paix à tes frontières ; il te rassasie du meilleur blé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la graisse du blé », expression hébraïque désignant le blé de la meilleure qualité.'
