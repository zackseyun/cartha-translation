source:
  edition: WLC
  text: יִשְׁלַ֣ח דְּבָר֣/וֹ וְ/יַמְסֵ֑/ם יַשֵּׁ֥ב ר֝וּח֗/וֹ יִזְּלוּ מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/018.yaml
  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: fr
  text: Il envoie sa parole et les fait fondre ; il fait souffler son vent[a], et les eaux coulent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son souffle » ou « son esprit ». Le mot hébreu peut avoir l’un ou l’autre de ces sens, mais « vent » convient le mieux aux images météorologiques de ce passage.
    reason: Alternative lexicale préservant la polysémie de רוּחַ.
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Il envoie
  rationale: Le qal à l’inaccompli présente ici l’action caractéristique de Dieu. « Envoie » restitue simplement et naturellement la force concrète du verbe.
- source_word: דְּבָרוֹ
  choice: sa parole
  rationale: דָּבָר peut désigner une parole, un message ou un ordre. « Sa parole » préserve l’image poétique de la parole divine agissante sans expliciter excessivement l’idée d’un commandement.
- source_word: וְיַמְסֵם
  choice: et les fait fondre
  rationale: La forme causative avec suffixe masculin pluriel signifie « les fait fondre ». Le pronom renvoie aux réalités gelées évoquées au verset précédent ; le texte ne précise pas ici le nom de son référent.
- source_word: יַשֵּׁב
  choice: il fait souffler
  rationale: La forme causative de נשׁב exprime le fait de provoquer le souffle du vent. Cette tournure française conserve clairement cette valeur causative.
- source_word: רוּחוֹ
  choice: son vent
  rationale: רוּחַ peut signifier « vent », « souffle » ou « esprit ». Dans ce contexte météorologique de fonte et d’écoulement des eaux, « vent » est le sens immédiat le plus naturel, tandis que les autres possibilités sont signalées en note.
- source_word: יִזְּלוּ
  choice: coulent
  rationale: Le verbe décrit l’écoulement d’un liquide. « Coulent » est l’équivalent français le plus large et le plus naturel dans ce contexte.
- source_word: מָיִם
  choice: les eaux
  rationale: Le pluriel poétique « les eaux » correspond au nom hébreu et s’accorde naturellement avec le verbe pluriel.
theological_decisions:
- issue: Sens de רוּחוֹ et rôle de l’action divine
  choice: son vent
  alternative: son souffle ou son esprit
  rationale: 'Le cadre immédiat décrit la maîtrise divine des phénomènes météorologiques : la glace fond, le vent souffle et les eaux coulent. « Vent » convient donc le mieux sans imposer une lecture pneumatologique, mais la polysémie réelle du terme hébreu est conservée en note.'
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la concision et le parallélisme poétiques de l’hébreu. Le pronom « les » reste volontairement implicite quant à son référent, comme dans le texte source.
