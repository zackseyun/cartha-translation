  text: He gives snow like wool[a]; he scatters frost like ashes.
translation:
  language: fr
  text: Il donne la neige comme de la laine ; il répand le givre comme de la cendre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Il donne
  rationale: Le participe qal de נתן décrit ici une action caractéristique et répétée de Dieu. Le présent français est naturel et conserve cette valeur habituelle dans la séquence hymnique.
- source_word: שֶׁלֶג
  choice: la neige
  rationale: Sens lexical courant, sans raison contextuelle de choisir un autre terme.
- source_word: כַּצָּמֶר
  choice: comme de la laine
  rationale: Le כ comparatif introduit une comparaison. Cette formulation française naturelle préserve l’image de la neige blanche et légère semblable à la laine.
- source_word: כְּפוֹר
  choice: le givre
  rationale: Le nom désigne le gel visible déposé en cristaux, souvent rendu par « givre ». Ce choix est précis et courant en français.
- source_word: כָּאֵפֶר
  choice: comme de la cendre
  rationale: Le כ comparatif forme une comparaison avec אֵפֶר. Le singulier massif « de la cendre » est idiomatique en français.
- source_word: יְפַזֵּר
  choice: il répand
  rationale: Le piel imparfait de פזר exprime la dispersion. « Répand » restitue naturellement l’image du givre dispersé sur le sol, tout en conservant la force poétique.
