source:
  edition: WLC
  text: הַ/שֹּׁלֵ֣חַ אִמְרָת֣/וֹ אָ֑רֶץ עַד מְ֝הֵרָ֗ה יָר֥וּץ דְּבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/015.yaml
  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: fr
  text: Il envoie son ordre[a] sur la terre ; sa parole court à toute vitesse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa déclaration » ou « ce qu’il a dit » (אִמְרָתוֹ).
    reason: lexical_alternative
  - marker: b
    text: Ou « rapidement » ou « avec rapidité » ; l’expression hébraïque accentue la vitesse du mouvement.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: Il envoie
  rationale: Le participe décrit ici l’action continue de Dieu. En français, une forme verbale conjuguée s’insère naturellement dans la suite descriptive du psaume.
- source_word: אִמְרָתוֹ
  choice: son ordre
  rationale: Le nom désigne une parole prononcée. Dans ce contexte, « ordre » en exprime la force efficace tout en le distinguant de דְּבָרוֹ dans le second membre.
- source_word: אָרֶץ
  choice: sur la terre
  rationale: « La terre » convient à la portée cosmique du contexte. Avec « envoyer », la tournure « sur la terre » est naturelle et évoque la parole divine qui y est dépêchée.
- source_word: עַד מְהֵרָה
  choice: à toute vitesse
  rationale: Cette expression adverbiale souligne la rapidité du mouvement. « À toute vitesse » en rend la vigueur dans un français naturel et poétique.
- source_word: יָרוּץ
  choice: court
  rationale: Le sens concret de « courir » conserve la personnification poétique de la parole de Dieu.
- source_word: דְּבָרוֹ
  choice: sa parole
  rationale: « Parole » est ici le rendu français le plus naturel. Il préserve le parallélisme avec אִמְרָתוֹ sans confondre entièrement les deux termes.
theological_decisions:
- issue: Nature de la parole divine dans le parallélisme poétique
  choice: Présenter la parole de Dieu comme un ordre efficace, sans ajouter de catégorie doctrinale postérieure.
  alternative: Traduire les deux noms par « parole » ou donner au verset une lecture explicitement christologique.
  rationale: Le verset célèbre l’efficacité de la parole de Dieu dans la création et la providence, mais le texte hébreu n’identifie pas explicitement cette parole au Logos personnel.
translation_notes:
  register: Français international moderne, sobre et poétique. Le rythme binaire et la personnification de la parole sont conservés ; « ordre » et « parole » rendent la variation lexicale de l’hébreu.
