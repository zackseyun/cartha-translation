  text: נוֹתֵ֣ן לִ/בְהֵמָ֣ה לַחְמָ֑/הּ לִ/בְנֵ֥י עֹ֝רֵ֗ב אֲשֶׁ֣ר יִקְרָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: fr
  text: Il donne leur nourriture aux animaux, aux petits des corbeaux qui crient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui appellent » ou « qui crient » ; le texte hébreu ne précise pas à qui ils crient.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן
  choice: Il donne
  rationale: Le participe qal de נתן a ici une valeur habituelle dans le contexte de louange; le présent français est naturel et maintient cette nuance.
- source_word: לִבְהֵמָה
  choice: aux animaux
  rationale: בְּהֵמָה peut désigner une bête ou le bétail; le parallèle avec les corbeaux favorise ici le sens général d’« animaux ».
- source_word: לַחְמָהּ
  choice: leur nourriture
  rationale: לֶחֶם signifie littéralement « pain », mais désigne couramment la nourriture en général. Le suffixe singulier renvoie distributivement au collectif בְּהֵמָה; le pluriel français est donc idiomatique.
- source_word: לִבְנֵי עֹרֵב
  choice: aux petits du corbeau
  rationale: בְּנֵי suivi du nom d’un animal désigne sa progéniture. Cette formulation naturelle conserve aussi le singulier générique de עֹרֵב.
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: qui crient
  rationale: קרא signifie appeler ou crier. Le complément n’étant pas exprimé en hébreu, la traduction ne précise pas vers qui se dirigent leurs cris.
theological_decisions:
- issue: Faut-il préciser que les petits du corbeau crient vers Dieu ?
  choice: 'Laisser le destinataire implicite : « qui crient »'
  alternative: « qui crient vers lui »
  rationale: Même si le contexte présente Dieu comme celui qui les nourrit, le texte hébreu ne nomme pas le destinataire de leurs cris. La traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, simple et digne. « Leur nourriture » rend naturellement la valeur distributive du collectif hébreu; « petits du corbeau » conserve l’image et le singulier générique de la source.
