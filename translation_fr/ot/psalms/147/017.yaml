  yaml_path: translation/ot/psalms/147/017.yaml
  text: He throws down his ice like crumbs[b][a]; who can stand before his cold?
translation:
  language: fr
  text: Il jette sa glace comme des miettes[a] ; qui peut tenir face à son froid[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des bouchées » ou « comme des morceaux ». L’hébreu évoque de petits fragments, probablement des morceaux de pain.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui peut résister à son froid ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: Il jette
  rationale: Le participe hiphil exprime l’action de faire tomber ou de lancer. Le présent convient à la description poétique et « jette » en conserve la vigueur.
- source_word: קַרְחוֹ
  choice: sa glace
  rationale: קֶרַח désigne principalement la glace ou le givre. Ici, l’image de fragments jetés favorise le terme concret « glace ».
- source_word: כְפִתִּים
  choice: comme des miettes
  rationale: פִּתִּים évoque de petits morceaux, notamment des fragments de pain. « Miettes » restitue en français l’image de petits éléments dispersés.
- source_word: לִפְנֵי
  choice: devant
  rationale: La préposition signifie « devant » ou « en présence de » et conserve ici l’image de quelqu’un confronté à la puissance du froid.
- source_word: קָרָתוֹ
  choice: son froid
  rationale: קָרָה désigne le froid, et le suffixe possessif rapporte ce froid à Dieu dans cette évocation de sa maîtrise des éléments.
- source_word: מִי יַעֲמֹד
  choice: qui peut tenir
  rationale: Littéralement, l’expression demande qui se tiendra ou restera debout. « Qui peut tenir » garde cette image tout en exprimant naturellement l’idée de résister ou d’endurer.
