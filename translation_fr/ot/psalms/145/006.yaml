  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: fr
  text: Ils parleront de la puissance de tes œuvres redoutables[a], et moi, je raconterai ta grandeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes œuvres qui inspirent la crainte » ou « tes œuvres impressionnantes ». L’hébreu désigne des œuvres qui suscitent une crainte respectueuse et l’émerveillement.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes grandes œuvres ». Le terme hébreu peut désigner soit la grandeur de Dieu, soit les grandes choses qu’il accomplit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶ/עֱז֣וּז
  choice: la puissance de
  rationale: עֱזוּז exprime la force ou la puissance. La tournure « la puissance de » conserve le rapport construit avec les actes qui suivent et convient au registre poétique.
- source_word: נוֹרְאֹתֶ֣י/ךָ
  choice: tes actes redoutables
  rationale: Le terme désigne des actes qui inspirent crainte, respect et émerveillement. « Redoutables » garde cette intensité sans réduire le sens à de simples prodiges.
- source_word: יֹאמֵ֑רוּ
  choice: On dira
  rationale: L’imparfait hébreu peut exprimer ici une proclamation future ou habituelle. Le sujet n’étant pas explicité dans ce verset, « on » rend naturellement le pluriel indéfini français.
- source_word: ו/גדולתי/ך
  choice: ta grandeur
  rationale: גדלות peut désigner la grandeur comme qualité ou les grandes choses accomplies. « Ta grandeur » préserve ici la formulation abstraite et le parallélisme poétique.
- source_word: אֲסַפְּרֶֽ/נָּה
  choice: je raconterai
  rationale: Au piel, ספר signifie raconter, relater ou proclamer. « Je raconterai » exprime une évocation développée et maintient le contraste entre le pluriel collectif et la première personne.
