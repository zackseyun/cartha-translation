source:
  edition: WLC
  text: תְּהִלָּ֗ה לְ/דָ֫וִ֥ד אֲרוֹמִמְ/ךָ֣ אֱלוֹהַ֣/י הַ/מֶּ֑לֶךְ וַ/אֲבָרֲכָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: fr
  text: Louange de David[a]. Je t’exalterai, mon Dieu, toi qui es le Roi[b], et je bénirai ton nom pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par David ». Dans les titres des psaumes, לְדָוִד peut indiquer l’auteur ou une association avec David.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « mon Dieu et mon Roi ». L’hébreu dit plus littéralement : « mon Dieu, le Roi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִלָּה
  choice: Louange
  rationale: Le nom singulier sert ici de titre au psaume. « Louange » conserve cette fonction et reste naturel en français.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, la préposition לְ peut indiquer l’auteur, l’appartenance ou l’association. « De David » maintient cette souplesse mieux que « par David ».
- source_word: אֲרוֹמִמְךָ
  choice: Je t’exalterai
  rationale: Le verbe רומם exprime l’action d’élever ou d’exalter. Cette formulation garde le registre élevé de la louange tout en restant intelligible.
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: mon Dieu, le Roi
  rationale: Cette apposition conserve l’article défini de הַמֶּלֶךְ et présente Dieu comme le Roi sans ajouter de conjonction ni de possessif absent de l’hébreu.
- source_word: וַאֲבָרֲכָה
  choice: et je bénirai
  rationale: Le verbe ברך, appliqué à Dieu, signifie le bénir dans la louange. Le futur français rend naturellement la résolution exprimée en parallèle avec le premier verbe.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La traduction littérale préserve l’idiome biblique, qui évoque à la fois l’identité révélée et la renommée de Dieu.
- source_word: לְעוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: Cette expression française rend l’intensification de la durée contenue dans la formule hébraïque redoublée.
theological_decisions:
- issue: Rapport entre « mon Dieu » et « le Roi » dans l’adresse directe
  choice: mon Dieu, le Roi
  alternative: mon Dieu et mon Roi
  rationale: L’hébreu place « le Roi » en apposition à « mon Dieu ». La traduction retenue préserve cette structure et l’article défini, tandis que l’alternative ajoute une coordination et un second possessif.
translation_notes:
  register: Français moderne, international et digne. Le rythme bref du titre et le parallélisme des deux résolutions à la première personne sont conservés. L’expression « pour toujours et à jamais » maintient la solennité sans archaïsme marqué.
