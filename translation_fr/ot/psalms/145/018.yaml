  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: fr
  text: Yahweh est proche de tous ceux qui l’invoquent, de tous ceux qui l’invoquent en vérité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sincèrement », « véritablement » ou « fidèlement » pour « en vérité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: est proche
  rationale: L’adjectif prédicatif exprime la proximité et garde ici ses nuances relationnelle et spatiale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin représente directement le tétragramme plutôt que de lui substituer un titre.
- source_word: לְכָל
  choice: de tous
  rationale: Avec « proche », le français idiomatique emploie « proche de »; la répétition de « tous » conserve la portée universelle des deux membres.
- source_word: קֹרְאָיו
  choice: ceux qui font appel à lui
  rationale: Dans ce contexte de prière ou d’invocation, « faire appel à » est naturel en français et représente explicitement le suffixe pronominal.
- source_word: אֲשֶׁר יִקְרָאֻהוּ
  choice: ceux qui font appel à lui
  rationale: La répétition identique préserve le parallélisme poétique et l’intensification du second membre.
- source_word: בֶאֱמֶת
  choice: avec vérité
  rationale: Cette formulation proche de l’hébreu conserve l’éventail sémantique de אֱמֶת — vérité, sincérité et fidélité — sans privilégier silencieusement une seule nuance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée de la proximité divine
  choice: Conserver « tous ceux qui font appel à lui », qualifié par « avec vérité »
  alternative: Limiter implicitement cette promesse aux seuls membres de l’alliance, ou l’étendre à tous sans condition
  rationale: Le verset définit lui-même la portée de l’affirmation et sa qualification; la traduction n’en réduit ni n’en élargit doctrinalement le sens.
- issue: Sens de בֶאֱמֶת
  choice: avec vérité
  alternative: sincèrement / véritablement / fidèlement
  rationale: L’expression hébraïque peut évoquer l’authenticité de l’appel aussi bien que la vérité ou la fidélité; le texte principal maintient cette tension et la note expose les principales possibilités.
translation_notes:
  register: Français moderne, international et digne. La répétition est maintenue pour préserver le parallélisme hébraïque; « faire appel à lui » est courant et convient au contexte d’invocation.
