  yaml_path: translation/ot/psalms/145/012.yaml
  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: fr
  text: pour faire connaître aux fils des hommes[a] ses actes puissants et la gloire de la majesté de son royaume.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aux fils de l’humain ». Cette expression hébraïque désigne ici l’ensemble des êtres humains.'
    reason: Préciser la portée générique de l’expression hébraïque masculine et sa forme littérale, sans laisser entendre qu’elle ne vise que les hommes de sexe masculin.
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: pour faire connaître
  rationale: 'L’infinitif hiphil de ידע exprime ici la causation : « faire connaître ». Cette tournure française est naturelle et conserve cette valeur.'
- source_word: לִבְנֵי הָאָדָם
  choice: aux fils des hommes
  rationale: L’expression hébraïque signifie littéralement « aux fils de l’être humain / de l’homme » et désigne collectivement les êtres humains. La formulation conserve l’image de filiation tout en employant le pluriel français idiomatique « des hommes » ; le sens inclusif est précisé en note.
- source_word: גְּבוּרֹתָיו
  choice: ses actes puissants
  rationale: Le nom גְּבוּרוֹת désigne ici des manifestations concrètes de puissance, et non une puissance purement abstraite.
- source_word: וּכְבוֹד הֲדַר
  choice: et la gloire majestueuse
  rationale: La construction associe כבוד, « gloire », et הדר, « majesté / splendeur ». « Gloire majestueuse » rend les deux éléments sans produire le calque peu naturel « la gloire de la splendeur ».
- source_word: מַלְכוּתוֹ
  choice: de son règne
  rationale: מַלְכוּת peut désigner le royaume, la royauté ou le règne. Ici, « règne » met naturellement en valeur l’exercice de la souveraineté divine et s’accorde bien avec la gloire majestueuse qui le caractérise.
theological_decisions:
- issue: Portée générique de לִבְנֵי הָאָדָם
  choice: Conserver dans le texte l’expression imagée « aux fils des hommes », avec une note explicitant sa portée universelle.
  alternative: « à tous les êtres humains » ou « à l’humanité »
  rationale: L’hébreu emploie une expression masculine représentative, mais son référent est l’humanité entière. La traduction garde l’image source sans laisser entendre que seuls les hommes de sexe masculin sont concernés.
- issue: Sens de מַלְכוּתוֹ
  choice: « son règne »
  alternative: « son royaume » ou « sa royauté »
  rationale: Le terme hébreu permet ces nuances. Le contexte de louange royale n’impose pas de trancher entre domaine et exercice de la souveraineté ; « règne » convient au français tout en préservant la dimension dynamique.
translation_notes:
  register: Français moderne, poétique et digne. La syntaxe infinitive est conservée parce que le verset poursuit la phrase du contexte. « Actes puissants » reste accessible, tandis que « gloire majestueuse » maintient l’élévation propre au psaume.
