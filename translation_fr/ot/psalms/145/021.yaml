  text: תְּהִלַּ֥ת יְהוָ֗ה יְֽדַבֶּ֫ר פִּ֥/י וִ/יבָרֵ֣ךְ כָּל בָּ֭שָׂר שֵׁ֥ם קָדְשׁ֗/וֹ לְ/עוֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/021.yaml
  text: My mouth will speak the praise of Yahweh[a], and all flesh will bless his holy name forever and ever.
translation:
  language: fr
  text: Ma bouche proclamera la louange de Yahweh, et que toute chair[a] bénisse son saint nom à tout jamais !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tous les humains » ou « tout être vivant ». L’hébreu dit littéralement « toute chair », expression poétique qui désigne l’ensemble des êtres mortels. On peut aussi traduire la proposition : « et toute chair bénira son saint nom ».'
    reason: Précision lexicale et préservation de l’ambiguïté entre valeur jussive et valeur future du verbe.
lexical_decisions:
- source_word: תְּהִלַּת
  choice: la louange de
  rationale: Le construit avec יְהוָה désigne la louange adressée à Yahweh ou qui lui revient. Cette formulation conserve clairement le rapport syntaxique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: יְדַבֶּר
  choice: proclamera
  rationale: À la fin du psaume, l’imparfait exprime naturellement l’engagement résolu du psalmiste. « Proclamera » rend דּבר avec naturel et dignité dans ce contexte de louange publique.
- source_word: פִּי
  choice: Ma bouche
  rationale: La traduction concrète du nom muni du suffixe de première personne conserve l’image poétique hébraïque.
- source_word: וִיבָרֵךְ
  choice: et que … bénisse
  rationale: La forme verbale peut être comprise comme un jussif exprimant un souhait ou un appel, notamment avec un sujet universel. Cette lecture préserve une ambiguïté réelle que le simple futur français atténuerait.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: La traduction littérale conserve l’expression poétique hébraïque et son ampleur universelle, qui peut viser tous les mortels, toute l’humanité, voire tout être vivant.
- source_word: שֵׁם קָדְשׁוֹ
  choice: son saint nom
  rationale: Expression française naturelle qui conserve le poids théologique de l’identité et de la réputation divines marquées par la sainteté.
- source_word: לְעוֹלָם וָעֶד
  choice: à tout jamais
  rationale: Cette locution française actuelle et soutenue exprime avec force une durée sans fin et rend l’intensification de la formule hébraïque.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en conserve la fonction de nom propre sans le remplacer par un titre.
- issue: Valeur de וִיבָרֵךְ
  choice: 'souhait ou appel : « que toute chair bénisse »'
  alternative: 'affirmation future : « toute chair bénira »'
  rationale: L’imparfait coordonné permet le futur, mais la troisième personne peut également porter une nuance jussive. Le contexte final de l’hymne se prête à un appel universel à la louange ; la note signale l’autre lecture grammaticale.
translation_notes:
  register: Français international moderne, poétique et digne. « Ma bouche » et « toute chair » maintiennent les images concrètes de l’hébreu ; la syntaxe reste fluide. L’exclamation convient à l’élan conclusif du psaume.
