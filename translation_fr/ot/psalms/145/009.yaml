source:
  edition: WLC
  text: טוֹב יְהוָ֥ה לַ/כֹּ֑ל וְ֝/רַחֲמָ֗י/ו עַל כָּל מַעֲשָֽׂי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: fr
  text: 'Yahweh est bon envers tous,

    et sa compassion s’étend à toutes ses œuvres[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses compassions » ou « ses tendres compassions ». L’hébreu emploie un pluriel, qui peut souligner l’abondance des manifestations de sa compassion.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: bon
  rationale: Rend directement la bonté à la fois morale et bienfaisante exprimée par l’adjectif hébreu, sans la réduire à la seule bienveillance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לַכֹּל
  choice: envers tous
  rationale: Exprime naturellement en français la relation ou l’orientation de la bonté de Yahweh à l’égard de tous, tout en conservant la portée universelle.
- source_word: רַחֲמָיו
  choice: sa compassion
  rationale: Le pluriel hébreu peut désigner l’ensemble abondant des manifestations de compassion. En français actuel, le singulier collectif « compassion » est plus naturel que « compassions ».
- source_word: עַל
  choice: s’étend à
  rationale: Dans ce parallélisme, cette formulation rend idiomatiquement l’idée que la compassion divine repose sur ses œuvres et les englobe.
- source_word: כָּל
  choice: tout
  rationale: Conserve la portée universelle et fonctionne naturellement devant la proposition nominale « ce qu’il a fait ».
- source_word: מַעֲשָׂיו
  choice: ce qu’il a fait
  rationale: Dans le contexte de la bonté envers tous, le syntagme vise probablement l’ensemble des œuvres créées de Dieu. Cette formulation est claire et naturelle sans exclure entièrement le sens plus large de ses œuvres.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le Tétragramme, nom personnel de Dieu. « Yahweh » le préserve au lieu de le remplacer par un titre.
- issue: Portée de « tous » et de « tout ce qu’il a fait »
  choice: Conserver les deux expressions universelles sans restriction
  alternative: Limiter implicitement « tous » aux seuls fidèles ou aux humains
  rationale: Le parallélisme hébreu affirme sans qualification la bonté de Yahweh envers tous et sa compassion envers la totalité de ses œuvres. La traduction ne doit pas réduire cette tension théologique.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé sur deux lignes. « Envers tous » est plus idiomatique que « pour tous » ici, et « sa compassion » évite le pluriel français peu naturel tout en rendant le pluriel intensif ou abondant de l’hébreu.
