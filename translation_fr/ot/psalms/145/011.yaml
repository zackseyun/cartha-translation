  text: כְּב֣וֹד מַלְכוּתְ/ךָ֣ יֹאמֵ֑רוּ וּ/גְבוּרָתְ/ךָ֥ יְדַבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: fr
  text: Ils parleront de la gloire de ton règne[a] et de ta puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ton royaume » ou « de ta royauté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de ta force » ; le terme peut aussi évoquer tes actes puissants.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: gloire
  rationale: « Gloire » rend naturellement l’idée d’honneur, de splendeur et de majesté portée par כָּבוֹד dans ce contexte de louange.
- source_word: מַלְכוּתְךָ
  choice: ton règne
  rationale: מַלְכוּת peut désigner le règne, la royauté ou le royaume. « Ton règne » exprime ici de manière naturelle l’exercice majestueux de la souveraineté divine, sans exclure les autres nuances.
- source_word: יֹאמֵרוּ
  choice: ils diront
  rationale: Le sens courant de אָמַר est « dire ». Le futur français conserve la valeur prospective de l’imparfait hébreu dans ce contexte.
- source_word: גְבוּרָתְךָ
  choice: ta puissance
  rationale: גְּבוּרָה désigne la force ou la puissance, et peut parfois évoquer les actes puissants. « Ta puissance » respecte ici la forme abstraite au singulier.
- source_word: יְדַבֵּרוּ
  choice: parleront de
  rationale: דָּבַר signifie « parler ». La tournure « parler de » est idiomatique en français et maintient le parallélisme avec « diront » sans renforcer indûment l’idée de proclamation.
theological_decisions:
- issue: Sens de מַלְכוּת appliqué à Dieu
  choice: « ton règne »
  alternative: « ton royaume » ou « ta royauté »
  rationale: Le terme hébreu peut viser aussi bien l’exercice de l’autorité royale que le royaume ou la qualité royale. « Règne » convient au contexte sans enfermer le verset dans une conception exclusivement territoriale.
translation_notes:
  register: Français moderne, poétique et digne. La formulation conserve le parallélisme hébreu entre « diront » et « parleront », ainsi que les substantifs abstraits « gloire », « règne » et « puissance ».
