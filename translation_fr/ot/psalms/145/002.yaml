source:
  edition: WLC
  text: בְּ/כָל י֥וֹם אֲבָרֲכֶ֑/ךָּ וַ/אֲהַלְלָ֥ה שִׁ֝מְ/ךָ֗ לְ/עוֹלָ֥ם וָ/עֶֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/002.yaml
  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: fr
  text: Chaque jour[a], je te bénirai, et je louerai ton nom[b] pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tous les jours » ou « Jour après jour ».
    reason: lexical_alternative
  - marker: b
    text: Dans la Bible, le « nom » de Dieu désigne sa personne telle qu’elle se révèle, notamment son caractère et sa renommée.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־יוֹם
  choice: Chaque jour
  rationale: L’expression signifie littéralement « en tout jour » et exprime une action répétée quotidiennement. « Chaque jour » est naturel en français moderne et conserve cette valeur habituelle.
- source_word: אֲבָרֲכֶךָּ
  choice: je te bénirai
  rationale: Le piel de ברך signifie couramment « bénir ». Dans ce contexte de louange et en parallèle avec le verbe suivant, le futur français rend bien la portée déclarative et volontaire de la forme poétique.
- source_word: וַאֲהַלְלָה
  choice: et je louerai
  rationale: Le piel de הלל signifie « louer ». « Je louerai » est clair, naturel et maintient le parallélisme avec « je te bénirai », tout en reflétant la nuance volontaire orientée vers l’avenir.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: La traduction conserve l’image concrète de l’hébreu. Dans le langage biblique, le « nom » de Dieu évoque sa personne telle qu’elle se révèle, son caractère et sa renommée, sans qu’il soit nécessaire de remplacer l’expression par une interprétation.
- source_word: לְעוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: La formule hébraïque redoublée souligne une durée sans fin. L’expression française conserve cette insistance poétique plutôt que de la réduire à un simple « toujours ».
theological_decisions:
- issue: Adresse directe à Dieu sans ajout d’un titre
  choice: te
  alternative: te, ô Dieu ; te, mon Dieu et mon roi
  rationale: Le suffixe hébreu s’adresse directement à Dieu, mais le verset ne répète aucun titre divin. La traduction garde donc la deuxième personne sans importer les mots du verset précédent.
- issue: Langage biblique relatif au « nom »
  choice: ton nom
  alternative: toi ; ta renommée
  rationale: Le texte dit explicitement « ton nom ». Conserver cette formulation préserve sa richesse théologique et poétique sans la réduire à un pronom ni en fixer le sens par une paraphrase.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement convient à l’adresse directe de la prière biblique. La syntaxe parallèle et l’insistance de la formule finale sont conservées.
