source:
  edition: WLC
  text: סוֹמֵ֣ךְ יְ֭הוָה לְ/כָל הַ/נֹּפְלִ֑ים וְ֝/זוֹקֵ֗ף לְ/כָל הַ/כְּפוּפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: fr
  text: Yahweh soutient tous ceux qui tombent[a] et redresse tous ceux qui sont courbés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui sont en train de tomber ». Le participe hébreu peut exprimer une action en cours ou une situation caractéristique.
    reason: alternative lexicale et nuance aspectuelle
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que par un titre de substitution.
- source_word: סוֹמֵךְ
  choice: soutient
  rationale: Le participe exprime l’action continue de soutenir ou de maintenir. « Soutient » est naturel en français moderne et convient à une personne qui tombe.
- source_word: לְכָל
  choice: tous ceux qui
  rationale: La préposition avec כָּל introduit ici l’ensemble des bénéficiaires de chaque action; cette tournure est idiomatique en français.
- source_word: הַנֹּפְלִים
  choice: qui tombent
  rationale: Le participe désigne ceux qui tombent, de façon actuelle ou caractéristique, sans imposer l’idée qu’ils sont déjà tombés.
- source_word: זוֹקֵף
  choice: redresse
  rationale: Le verbe signifie remettre droit ou relever. « Redresse » conserve le contraste imagé avec ceux qui sont courbés.
- source_word: הַכְּפוּפִים
  choice: qui sont courbés
  rationale: Cette formulation préserve l’image d’une personne pliée ou courbée, au sens physique ou figuré, sans préciser abusivement la cause de son état.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de l’état des personnes courbées
  choice: qui sont courbés
  alternative: les opprimés
  rationale: L’hébreu décrit leur posture ou leur condition sans en attribuer explicitement la cause à l’oppression; la traduction maintient donc la portée physique et figurée.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme est conservé par « soutient » et « redresse », ainsi que par la répétition de « tous ceux qui ».
