source:
  edition: WLC
  text: חַנּ֣וּן וְ/רַח֣וּם יְהוָ֑ה אֶ֥רֶךְ אַ֝פַּ֗יִם וּ/גְדָל חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/008.yaml
  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: fr
  text: Yahweh fait grâce et est plein de compassion ; il est lent à la colère et riche en amour fidèle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grand en amour fidèle ». L’expression hébraïque peut souligner soit la grandeur, soit l’abondance de cet amour fidèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: fait grâce
  rationale: Le terme décrit celui qui accorde sa faveur. « Fait grâce » est naturel en français moderne et le distingue de רַחוּם.
- source_word: רַחוּם
  choice: plein de compassion
  rationale: Cette expression rend la compassion profonde évoquée par l’adjectif hébreu sans la confondre avec la grâce exprimée par חַנּוּן.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lent à la colère
  rationale: Cette tournure française établie restitue naturellement l’idiome hébreu, qui décrit la patience face à la provocation.
- source_word: גְדָל
  choice: riche en
  rationale: Devant « amour fidèle », « riche en » exprime naturellement en français la grandeur ou l’abondance indiquée par l’hébreu.
- source_word: חָסֶד
  choice: amour fidèle
  rationale: Cette traduction concise conserve à la fois la dimension d’amour, de bonté loyale et de fidélité durable du terme.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom personnel divin ; « Yahweh » le conserve sans le remplacer par un titre.
- issue: Portée de גְדָל חָסֶד
  choice: riche en amour fidèle
  alternative: grand par son amour fidèle
  rationale: La formulation retenue est idiomatique et peut exprimer l’abondance, tandis que l’autre fait davantage ressortir la grandeur. La note préserve cette nuance réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme descriptif de l’hébreu est conservé, avec un point-virgule pour rendre clairement les deux paires de qualités.
