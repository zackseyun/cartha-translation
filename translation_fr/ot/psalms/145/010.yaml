source:
  edition: WLC
  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: fr
  text: 'Toutes tes œuvres te rendront grâce, Yahvé[a],

    et tes fidèles[b] te béniront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH ; traditionnellement rendu par « le Seigneur ».'
    reason: alternative_reading
  - marker: b
    text: Ou « ceux qui te sont attachés » ou « tes saints ». Le terme hébreu désigne des personnes marquées par la fidélité, la loyauté et l’attachement à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: te rendront grâce
  rationale: Le hiphil de ידה exprime ici l’action de rendre grâce ou de louer. « Te rendront grâce » conserve le complément pronominal et distingue ce verbe de « béniront » dans le second membre.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par la forme française courante du nom divin, plutôt que remplacé par le titre « le Seigneur ».
- source_word: כָּל מַעֲשֶׂיךָ
  choice: Toutes tes œuvres
  rationale: Cette formulation directe conserve la totalité exprimée par כָּל et le sens large de מַעֲשֶׂיךָ, qui peut englober ce que Dieu a fait et accompli.
- source_word: וַחֲסִידֶיךָ
  choice: et tes fidèles
  rationale: חסיד désigne des personnes caractérisées par la fidélité, la loyauté et l’attachement pieux. « Tes fidèles » est naturel en français moderne sans imposer les associations ecclésiastiques possibles de « tes saints ».
- source_word: יְבָרֲכוּכָה
  choice: te béniront
  rationale: Le piel de ברך signifie ici « bénir ». Le suffixe de deuxième personne est explicitement conservé par « te ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. La translittération française « Yahvé » préserve le caractère personnel de ce nom, tandis que « le Seigneur » représente la substitution traditionnelle.
- issue: Portée de חֲסִידֶיךָ
  choice: tes fidèles
  alternative: tes saints / ceux qui te sont attachés
  rationale: Le terme évoque la fidélité et l’attachement loyal envers Dieu. « Tes fidèles » garde cette dimension sans réduire le mot à une catégorie doctrinale ultérieure.
translation_notes:
  register: Français moderne, poétique et digne. Le futur rend la valeur contextuelle des deux imparfaits hébreux et maintient leur parallélisme. L’ordre des mots reste naturel en français tout en conservant les correspondances du distique.
