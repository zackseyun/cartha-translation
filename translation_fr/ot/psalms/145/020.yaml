source:
  edition: WLC
  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: fr
  text: Yahweh garde tous ceux qui l’aiment, mais[a] il détruira tous les méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et tous les méchants » ; la conjonction hébraïque signifie simplement « et », mais elle a ici une valeur contrastive.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: garde
  rationale: Le participe exprime une action constante de protection et de conservation. « Garde » est naturel, digne et conserve la portée assez large de l’hébreu sans réduire le sens à la simple surveillance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par un titre.
- source_word: אֶת כָּל אֹהֲבָיו
  choice: tous ceux qui l’aiment
  rationale: 'Cette proposition relative rend naturellement en français le participe substantivé avec son suffixe pronominal : ceux qui aiment Yahweh.'
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: mais tous les méchants
  rationale: La conjonction וְ signifie formellement « et », mais elle relie ici deux sorts opposés et prend naturellement une valeur contrastive en français.
- source_word: יַשְׁמִיד
  choice: il détruira
  rationale: Le hifil de שׁמד exprime le fait de causer la destruction. « Détruira » est direct et fort sans préciser davantage le mode ou l’étendue de cette destruction.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte explicitement le tétragramme ; sa translittération préserve le nom personnel au lieu de lui substituer un titre.
- issue: Valeur de la conjonction devant le second membre
  choice: 'valeur adversative : « mais »'
  alternative: 'coordination simple : « et »'
  rationale: L’opposition entre garder ceux qui aiment Yahweh et détruire les méchants justifie « mais », tout en signalant en note la forme plus littérale afin de préserver l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise pour respecter le parallélisme antithétique du verset ; « tous ceux qui l’aiment » évite le tour peu idiomatique « tous ses amants ».
