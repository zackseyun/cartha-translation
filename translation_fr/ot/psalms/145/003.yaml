source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד וְ֝/לִ/גְדֻלָּת֗/וֹ אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: fr
  text: Yahweh est grand et très digne de louange ; sa grandeur est insondable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et, quant à sa grandeur, il n’y a pas moyen de la sonder ».'
    reason: La note conserve la structure existentielle et la préposition de l’hébreu, que le texte principal rend par l’expression française idiomatique « est insondable ».
lexical_decisions:
- source_word: גָּדוֹל
  choice: grand
  rationale: L’adjectif placé en tête du verset exprime directement la grandeur et la majesté de Yahweh, sans ajout interprétatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מְהֻלָּל מְאֹד
  choice: mérite d’être grandement loué
  rationale: Cette formulation française naturelle restitue la valeur prédicative du participe passif et l’intensification portée par מְאֹד, sans suggérer seulement qu’une louange est déjà en cours.
- source_word: לִגְדֻלָּתוֹ
  choice: sa grandeur
  rationale: Le nom avec suffixe désigne directement la grandeur de Yahweh ; la tournure française n’a pas besoin de reproduire littéralement la préposition hébraïque.
- source_word: אֵין חֵקֶר
  choice: est insondable
  rationale: Formulation concise et idiomatique indiquant que sa grandeur ne peut être pleinement explorée ou comprise.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie le tétragramme comme nom propre ; « Yahweh » en conserve la fonction et correspond à la translittération savante courante en français.
- issue: Portée de מְהֻלָּל
  choice: mérite d’être grandement loué
  alternative: est grandement loué
  rationale: Le participe peut décrire celui qui est loué, mais dans ce contexte hymnique la formulation retenue exprime naturellement l’appel implicite à la louange, sans en faire une affirmation limitée à une louange déjà accomplie.
translation_notes:
  register: Français international moderne, simple et solennel. Le parallélisme est conservé, tandis que le point-virgule clarifie les deux affirmations sans rompre leur unité poétique.
