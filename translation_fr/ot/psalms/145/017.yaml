source:
  edition: WLC
  text: צַדִּ֣יק יְ֭הוָה בְּ/כָל דְּרָכָ֑י/ו וְ֝/חָסִ֗יד בְּ/כָל מַעֲשָֽׂי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/017.yaml
  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: fr
  text: Yahweh est juste dans toutes ses voies, et fidèle dans toutes ses œuvres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bienveillant » ou « plein de grâce » ; certaines traductions ont ici « saint », selon une tradition textuelle différente du sens « fidèle, constant » du texte massorétique.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel du texte hébreu plutôt que de le remplacer par un titre.
- source_word: צַדִּיק
  choice: juste
  rationale: En français courant et digne, « juste » exprime naturellement la droiture morale et la justice de Yahweh.
- source_word: בְּכָל דְּרָכָיו
  choice: dans toutes ses voies
  rationale: Cette formulation conserve la valeur de sphère de la préposition et la métaphore hébraïque des « voies », tout en restant idiomatique en français biblique moderne.
- source_word: וְחָסִיד
  choice: et fidèle
  rationale: 'חָסִיד qualifie ici celui qui manifeste le חֶסֶד : loyauté, bonté constante et fidélité. « Fidèle » rend bien cette constance sans réduire le terme à une simple bienveillance.'
- source_word: בְּכָל מַעֲשָׂיו
  choice: dans toutes ses œuvres
  rationale: « Œuvres » conserve le parallélisme poétique avec « voies » et désigne l'ensemble des actes de Yahweh.
theological_decisions:
- issue: Sens de חָסִיד appliqué à Yahweh
  choice: fidèle
  alternative: bienveillant, plein de grâce; « saint » selon une autre tradition textuelle
  rationale: Le texte massorétique porte חָסִיד, qui évoque la fidélité bienveillante et constante. « Fidèle » préserve cette dimension relationnelle. La lecture « saint » n'est pas introduite dans le texte principal puisqu'elle reflète une tradition textuelle différente, mais elle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « dans toutes ses voies / dans toutes ses œuvres » et la cadence poétique du verset sont conservés.
