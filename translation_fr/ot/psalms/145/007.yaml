id: PSA.145.7
reference: Psalms 145:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֵ֣כֶר רַב טוּבְ/ךָ֣ יַבִּ֑יעוּ וְ/צִדְקָתְ/ךָ֥ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: fr
  text: Ils feront jaillir le souvenir de ton immense bonté[a], et ils chanteront avec joie ta justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : Ils proclameront le souvenir de ta grande bonté.'
    reason: Variante lexicale plus explicite, qui atténue toutefois l’image de paroles jaillissantes.
  - marker: b
    text: 'Ou : ta droiture.'
    reason: Le mot hébreu peut désigner aussi bien la justice de Dieu que sa droiture morale.
lexical_decisions:
- source_word: זֵכֶר
  choice: le souvenir
  rationale: Le nom désigne le souvenir ou la mention commémorative. Ici, objet d’un verbe de parole abondante, il évoque ce que l’on rappelle publiquement au sujet de la bonté de Dieu.
- source_word: רַב
  choice: immense
  rationale: L’adjectif exprime la grandeur en quantité ou en étendue. « Immense bonté » est une tournure française naturelle qui conserve cette idée d’abondance.
- source_word: טוּבְךָ
  choice: ta bonté
  rationale: Le terme peut désigner la bonté en général ou ses manifestations bienfaisantes. « Bonté » garde cette ampleur sans limiter le sens aux seuls bienfaits matériels.
- source_word: יַבִּיעוּ
  choice: ils feront jaillir
  rationale: La forme causative de נבע évoque ce qui bouillonne ou jaillit. Cette traduction conserve l’image vive d’une louange qui se répand avec abondance.
- source_word: וְצִדְקָתְךָ
  choice: ta justice
  rationale: En français, « justice » peut désigner à la fois la qualité d’être juste et l’action conforme au droit. Il rend ici l’étendue morale du terme, tandis que « droiture » demeure une possibilité légitime.
- source_word: יְרַנֵּנוּ
  choice: ils chanteront avec joie
  rationale: Le verbe exprime une acclamation retentissante et joyeuse, chantée ou criée. Dans le contexte poétique du psaume, « chanter avec joie » est naturel et convient au parallélisme de la louange.
theological_decisions:
- issue: Rendu de צדקה dans un contexte de louange
  choice: ta justice
  alternative: ta droiture
  rationale: Le terme hébreu embrasse la conformité à ce qui est juste, tant dans le caractère que dans les actes de Dieu. « Justice » garde en français une portée assez large; la note conserve « droiture », qui met davantage l’accent sur la qualité morale sans réduire silencieusement la tension sémantique.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux membres est maintenu, ainsi que l’image concrète du jaillissement dans le premier membre. Les pronoms reprennent le groupe évoqué par le contexte du psaume.
