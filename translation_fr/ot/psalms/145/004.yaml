  text: דּ֣וֹר לְ֭/דוֹר יְשַׁבַּ֣ח מַעֲשֶׂ֑י/ךָ וּ/גְב֖וּרֹתֶ֣י/ךָ יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/004.yaml
  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: fr
  text: Une génération célébrera tes œuvres[a] auprès d’une autre, et elles proclameront tes hauts faits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce que tu as fait ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tes actes de puissance » ou « tes exploits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: De génération en génération
  rationale: Cette tournure française naturelle restitue l’idiome hébreu, sa progression à travers les générations et sa concision poétique.
- source_word: יְשַׁבַּח
  choice: on célébrera
  rationale: Le piel de שׁבח exprime une louange appuyée. « Célébrera » convient au registre poétique et évite l’ambiguïté moderne de « louer ».
- source_word: מַעֲשֶׂיךָ
  choice: tes œuvres
  rationale: « Œuvres » conserve la forme nominale et désigne avec dignité ce que Dieu accomplit.
- source_word: וּגְבוּרֹתֶיךָ
  choice: tes hauts faits
  rationale: גְּבוּרוֹת désigne des manifestations remarquables de puissance. « Hauts faits » exprime à la fois leur caractère puissant et mémorable.
- source_word: יַגִּידוּ
  choice: on proclamera
  rationale: Le hiphil de נגד signifie faire connaître ou raconter. « Proclamera » rend ici la déclaration publique dans un registre poétique soutenu.
theological_decisions:
- issue: Sujet humain collectif implicite dans les verbes
  choice: emploi de « on »
  alternative: « une génération » comme sujet explicite des deux verbes
  rationale: L’hébreu ouvre par l’expression concise דּוֹר לְדוֹר et emploie ensuite des verbes au singulier puis au pluriel, ce qui crée une légère variation grammaticale. Le français collectif « on » donne un vers fluide sans préciser indûment si chaque génération parle à la suivante ou si toutes se succèdent dans la louange.
translation_notes:
  register: Français international actuel, poétique et digne. La répétition « génération » préserve l’écho de l’hébreu; « célébrera » et « proclamera » forment un parallélisme naturel. Tous les marqueurs de notes figurent dans le texte.
