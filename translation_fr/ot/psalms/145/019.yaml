source:
  edition: WLC
  text: רְצוֹן יְרֵאָ֥י/ו יַעֲשֶׂ֑ה וְֽ/אֶת שַׁוְעָתָ֥/ם יִ֝שְׁמַ֗ע וְ/יוֹשִׁיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: fr
  text: Il accomplit le désir de ceux qui le craignent ; il entend leur appel au secours et les sauve.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְצוֹן
  choice: le désir
  rationale: Dans ce contexte, le nom désigne ce que souhaitent ceux qui craignent Dieu. « Désir » conserve cette valeur sans la confondre avec la faveur divine.
- source_word: יְרֵאָיו
  choice: ceux qui le craignent
  rationale: Cette formulation naturelle maintient explicitement le langage biblique de la crainte de Dieu, sans l'atténuer en simple respect.
- source_word: יַעֲשֶׂה
  choice: il accomplit
  rationale: Le verbe signifie littéralement « faire ». Avec « désir », « accomplir » exprime idiomatiquement l'idée de donner effet à ce qui est désiré, tout en restant proche de la formulation hébraïque.
- source_word: שַׁוְעָתָם
  choice: leur appel au secours
  rationale: Le terme désigne un cri poussé dans la détresse pour obtenir de l'aide. « Appel au secours » rend clairement cette nuance dans un français courant.
- source_word: יִשְׁמַע
  choice: il entend
  rationale: Le verbe courant « entendre » préserve la forme lexicale ; le contexte indique qu'il s'agit d'une écoute suivie d'une intervention.
- source_word: וְיוֹשִׁיעֵם
  choice: et les sauve
  rationale: Le hifil de יָשַׁע exprime le fait de sauver ou délivrer. « Sauve » garde toute l'étendue du terme sans limiter le secours à un type particulier de délivrance.
theological_decisions:
- issue: Traduction du vocabulaire de la « crainte » appliqué aux fidèles
  choice: ceux qui le craignent
  alternative: ceux qui le révèrent
  rationale: L'hébreu emploie explicitement le vocabulaire de la crainte de Dieu. Le conserver respecte sa portée sapientielle et théologique sans la réduire à une simple déférence.
- issue: Portée du salut exprimé par וְיוֹשִׁיעֵם
  choice: et les sauve
  alternative: et les délivre
  rationale: Le verbe peut viser un secours concret dans la détresse tout en possédant une portée plus large. « Sauve » préserve cette amplitude et ne précise pas indûment la nature du danger.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le parallélisme du verset et emploie un vocabulaire accessible. Aucune note n'est nécessaire, car les principales nuances lexicales se transmettent naturellement dans le texte.
