source:
  edition: WLC
  text: מַֽלְכוּתְ/ךָ֗ מַלְכ֥וּת כָּל עֹֽלָמִ֑ים וּ֝/מֶֽמְשֶׁלְתְּ/ךָ֗ בְּ/כָל דּ֥וֹר וָ/דֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/013.yaml
  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: fr
  text: Ton règne est un règne de tous les temps[a] ; ta domination s’exerce de génération en génération[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ton royaume est un royaume éternel. » L’hébreu dit littéralement : « Ton royaume est un royaume de tous les âges. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans chaque génération et génération ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַֽלְכוּתְךָ
  choice: Ton règne
  rationale: מַלְכוּת peut désigner le royaume, la royauté ou l’exercice du pouvoir royal. « Règne » exprime ici naturellement en français la souveraineté active de Dieu tout en s’accordant avec le parallèle « domination ».
- source_word: מַלְכוּת
  choice: est un règne
  rationale: 'La répétition du nom hébreu est conservée afin de maintenir l’insistance et la structure poétique : « Ton règne est un règne… »'
- source_word: כָּל עֹלָמִים
  choice: pour tous les âges
  rationale: Le pluriel עֹלָמִים évoque la totalité des âges et, par conséquent, une durée sans fin. Cette formulation préserve l’image temporelle du texte plutôt que de la réduire au seul adjectif « éternel ».
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: ta domination
  rationale: מֶמְשָׁלָה désigne l’autorité souveraine ou le pouvoir exercé. « Domination » convient au registre poétique élevé et reste distinct de « règne ».
- source_word: בְּכָל דּוֹר וָדֹר
  choice: de génération en génération
  rationale: Littéralement, l’expression dit « dans toute génération et génération ». La tournure française consacrée exprime clairement la continuité à travers les générations successives.
theological_decisions:
- issue: La durée du règne de Dieu
  choice: Le règne de Dieu embrasse tous les âges et sa domination toutes les générations.
  alternative: Ton règne est un règne éternel, et ta domination subsiste dans toutes les générations.
  rationale: La traduction affirme la permanence universelle du règne divin sans importer de formulation doctrinale ultérieure. Elle conserve la répétition poétique et l’image des âges présente dans l’hébreu.
- issue: Le verbe sous-entendu dans le second membre
  choice: s’exerce
  alternative: 'subsiste ; ou absence de verbe explicite : « ta domination, de génération en génération »'
  rationale: L’hébreu est nominal et ne précise pas le verbe. « S’exerce » rend la relation implicite de façon naturelle en français, sans exclure la nuance de permanence portée par le complément temporel.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « règne » reproduit l’insistance hébraïque ; le point-virgule marque le parallélisme. « S’exerce » explicite sobrement la proposition nominale pour obtenir une phrase française naturelle.
