  verdict: revise
  source_fidelity: Le premier membre conserve correctement la répétition de מַלְכוּת et rend la durée illimitée exprimée par כָּל עֹלָמִים. « Pour tous les âges » peut toutefois se comprendre en français comme « adapté à tous les publics/âges » plutôt que comme une durée. « De tous les temps » exprime sans ambiguïté la portée temporelle. Le second membre rend bien l’idiome בְּכָל־דּוֹר וָדֹר; « s’exerce » est une explicitation française recevable de la proposition nominale hébraïque.
