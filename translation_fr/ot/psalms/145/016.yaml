revisions:
- from: Tu ouvres ta main et tu rassasies tout être vivant selon son désir[a].
  to: Tu ouvres ta main et tu rassasies à souhait tout être vivant[a].
  rationale: La révision rend la construction hébraïque de manière plus directe et idiomatique. «À souhait» exprime la satisfaction pleine associée à רָצוֹן sans ajouter le possessif «son» ni préciser indûment le référent d’un éventuel «bon plaisir». La note conserve les principales lectures lexicales et syntaxiques plausibles.
