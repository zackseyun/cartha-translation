    text: 'Litt. «et tu rassasies tout être vivant [de] désir / à souhait». Le nom hébreu peut évoquer le désir, la faveur ou le bon plaisir. On peut aussi comprendre : «tu combles le désir de tout être vivant» ou «tu rassasies tout être vivant avec faveur».'
    reason: alternative lexicale et syntaxique
