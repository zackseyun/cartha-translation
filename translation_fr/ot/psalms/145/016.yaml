review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu dit littéralement que Dieu ouvre sa main et «rassasie pour/tout vivant רצון». Dans cette construction poétique, רָצוֹן fonctionne naturellement comme complément de manière ou de résultat («à souhait», «pleinement»), tout en pouvant être compris, de façon interprétative, comme le désir de chaque être vivant. «Selon son désir» introduit un possessif et une relation distributive qui ne sont pas exprimés en hébreu.
  naturalness: «Tu ouvres ta main et tu rassasies à souhait tout être vivant» est naturel, concis et poétique en français international moderne. L’expression «à souhait» rend bien la plénitude de la satisfaction sans alourdir le verset.
  terminology: «Main» conserve l’image anthropomorphique du texte. «Rassasies» rend adéquatement le hiphil de שׂבע. «Tout être vivant» conserve la portée universelle de לְכָל־חָי. La note doit présenter les possibilités lexicales de רָצוֹן sans attribuer au texte un «ton» absent.
  issues:
  - severity: medium
    issue: «selon son désir» surinterprète le rapport de רָצוֹן à «tout être vivant».
    rationale: L’hébreu n’emploie pas de suffixe possessif («son désir») et ne formule pas explicitement une mesure distributive («selon»). Cette traduction est possible comme explicitation, mais elle réduit une construction brève et discutée.
  - severity: medium
    issue: La note propose «selon ton bon plaisir».
    rationale: Cette formulation ajoute un possessif divin qui n’est pas présent dans le texte. Si רָצוֹן est compris dans le sens de faveur ou de bon plaisir, il convient de le signaler sans l’attribuer explicitement à Dieu.
  revised_text: Tu ouvres ta main et tu rassasies à souhait tout être vivant[a].
  revised_footnotes:
