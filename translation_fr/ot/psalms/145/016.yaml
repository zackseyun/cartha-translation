  text: פּוֹתֵ֥חַ אֶת יָדֶ֑/ךָ וּ/מַשְׂבִּ֖יעַ לְ/כָל חַ֣י רָצֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: fr
  text: Tu ouvres ta main et tu rassasies à souhait tout être vivant[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. «et tu rassasies tout être vivant [de] désir / à souhait». Le nom hébreu peut évoquer le désir, la faveur ou le bon plaisir. On peut aussi comprendre : «tu combles le désir de tout être vivant» ou «tu rassasies tout être vivant avec faveur».'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: tu ouvres
  rationale: Le participe qal décrit ici l’action habituelle et continue de Dieu; le présent français la rend naturellement.
- source_word: יָדֶךָ
  choice: ta main
  rationale: L’image anthropomorphique concrète est claire en français et conserve la force poétique de l’hébreu.
- source_word: וּמַשְׂבִּיעַ
  choice: et tu rassasies
  rationale: Le hiphil de שׂבע exprime le fait de combler ou de rassasier; «rassasier» convient au contexte où Dieu pourvoit aux besoins des êtres vivants.
- source_word: לְכָל חַי
  choice: tout être vivant
  rationale: חַי est substantivé et désigne largement l’ensemble des êtres animés; cette formulation française garde la portée universelle.
- source_word: רָצוֹן
  choice: selon son désir
  rationale: רָצוֹן peut désigner le désir, la faveur ou le bon plaisir. La construction retenue conserve ici le rapport possible entre le rassasiement et le désir de chaque être vivant sans transformer ce désir en objet direct explicite.
theological_decisions:
- issue: Représentation anthropomorphique de Dieu
  choice: Conserver l’image littérale «ta main».
  alternative: Tu pourvois généreusement
  rationale: Le texte hébreu présente concrètement l’action providentielle de Dieu. Maintenir l’image préserve sa force poétique sans ajouter d’affirmation doctrinale sur la corporalité divine.
- issue: Rapport syntaxique et théologique de רָצוֹן à la provision divine
  choice: «selon son désir», en rapport avec «tout être vivant»
  alternative: «avec faveur» ou «selon ton bon plaisir»
  rationale: Le contexte de la nourriture donnée à toute créature favorise le sens de «désir», mais le nom hébreu reste polysémique; la note conserve les autres lectures plausibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement suit l’adresse directe à Dieu. «Rassasier» restitue l’idée de pleine satisfaction tout en restant naturel dans le contexte de la provision divine.
