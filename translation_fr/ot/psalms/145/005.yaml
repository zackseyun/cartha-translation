  yaml_path: translation/ot/psalms/145/005.yaml
  text: On the glorious splendor of your majesty[a], and on your wondrous works, I will meditate.
translation:
  language: fr
  text: Je méditerai[a] sur la splendeur glorieuse de ta majesté et sur le récit de tes merveilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je parlerai de » ou « Je méditerai à voix haute sur ». Le verbe hébreu peut exprimer la méditation, la réflexion à voix haute ou la parole.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  choice: la splendeur glorieuse de ta majesté
  rationale: Cette formulation restitue l’expression hébraïque cumulative, qui associe splendeur, gloire et majesté, tout en restant naturelle et solennelle en français.
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: et sur tes œuvres merveilleuses
  rationale: Littéralement, le groupe peut évoquer « les paroles » ou « les récits de tes merveilles ». Dans ce contexte, דִּבְרֵי introduit naturellement le sujet dont on médite ou parle, tandis que נִפְלְאוֹת désigne les actes extraordinaires de Dieu. « Œuvres merveilleuses » rend clairement cette portée concrète sans alourdir la phrase.
- source_word: אָשִׂיחָה
  choice: Je méditerai
  rationale: Le verbe שׂיח peut exprimer aussi bien la réflexion intérieure que la parole. « Méditer » convient au mouvement contemplatif du verset, tandis qu’une note conserve sa possible nuance verbale.
