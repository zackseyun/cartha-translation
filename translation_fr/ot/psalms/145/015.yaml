id: PSA.145.15
reference: Psalms 145:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֵֽינֵי כֹ֭ל אֵלֶ֣י/ךָ יְשַׂבֵּ֑רוּ וְ/אַתָּ֤ה נֽוֹתֵן לָ/הֶ֖ם אֶת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: fr
  text: Les yeux de tous se tournent vers toi dans l’attente[a], et tu leur donnes leur nourriture en temps voulu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’attendent », « regardent vers toi avec attente » ou « espèrent en toi ». Le verbe hébreu exprime une attente confiante.
    reason: lexical_alternative
  - marker: b
    text: Ou « au moment opportun », « au temps fixé » ou, plus littéralement, « en son temps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: Les yeux de tous
  rationale: Cette formulation conserve l’image poétique concrète de l’hébreu sans préciser si « tous » désigne les humains, tous les êtres vivants ou l’ensemble des créatures.
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: se tournent vers toi dans l’attente
  rationale: Le verbe יְשַׂבֵּרוּ exprime une attente confiante. La tournure française maintient à la fois l’image des yeux dirigés vers Dieu et la nuance d’attente, sans la réduire à un simple regard.
- source_word: וְאַתָּה
  choice: et tu
  rationale: Le waw relie simplement l’attente de tous à l’action habituelle de Dieu; rien n’impose ici une valeur adversative comme « mais ».
- source_word: נֹתֵן
  choice: donnes
  rationale: Le participe hébreu présente une action caractéristique ou continue. Le présent simple français convient au style proverbial et poétique.
- source_word: אָכְלָם
  choice: leur nourriture
  rationale: Le nom désigne la nourriture au sens général, et non spécifiquement le pain.
- source_word: בְּעִתּוֹ
  choice: en temps voulu
  rationale: Cette expression française naturelle rend l’idée du moment approprié tout en évitant l’ambiguïté maladroite que produirait ici le calque « en son temps ».
theological_decisions:
- issue: Étendue de « tous » dans la providence divine
  choice: Conserver le terme général « tous » sans en expliciter le référent
  alternative: Préciser « tous les humains » ou « toutes les créatures »
  rationale: Le référent demeure implicite dans ce verset. Le contexte évoque largement les êtres vivants, mais la traduction ne doit ni restreindre ni élargir explicitement la portée du texte.
- issue: Nature de l’attente exprimée par יְשַׂבֵּרוּ
  choice: dans l’attente
  alternative: avec espérance; comptent sur toi; attendent de toi
  rationale: « Dans l’attente » garde la nuance d’expectative sans transformer explicitement celle-ci en affirmation doctrinale sur l’espérance, tout en préservant le lien avec l’image des yeux tournés vers Dieu.
translation_notes:
  register: Français international actuel, poétique et digne. La syntaxe reste claire à l’oral comme à l’écrit; « en temps voulu » est idiomatique sans être familière. Les deux notes signalées dans le texte préservent les principales nuances lexicales de l’hébreu.
