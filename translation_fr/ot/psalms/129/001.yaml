source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרַ֑/י יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/001.yaml
  text: A Song of Ascents[a]. Greatly they have afflicted me from my youth—let Israel now say—
translation:
  language: fr
  text: Chant des montées. Ils m’ont durement opprimé depuis ma jeunesse[a] — qu’Israël le dise maintenant —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Bien des fois ils m’ont opprimé depuis ma jeunesse. » L’hébreu רַבַּת peut exprimer aussi bien la répétition que la grande intensité.'
    reason: Alternative lexicale
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Cette formule traditionnelle des Psaumes 120–134 conserve le nom concret « montées » sans imposer l’interprétation plus précise de chant de pèlerinage.
- source_word: רַבַּת
  choice: durement
  rationale: Employé adverbialement, le terme peut exprimer une grande intensité ou la répétition. « Durement » rend naturellement l’intensité en français, tandis que l’autre possibilité est signalée en note.
- source_word: צְרָרוּנִי
  choice: ils m’ont opprimé
  rationale: Le verbe désigne ici les traitements hostiles infligés par des adversaires. « Opprimer » convient à la plainte collective sans préciser indûment la nature de l’hostilité.
- source_word: מִנְּעוּרַי
  choice: depuis ma jeunesse
  rationale: Cette expression française naturelle conserve le point de départ temporel indiqué par l’hébreu.
- source_word: יֹאמַר נָא
  choice: qu’Israël le dise maintenant
  rationale: Le jussif accompagné de נָא constitue ici une exhortation liturgique. « Maintenant » rend sa force discursive sans lui donner le sens poli de « s’il vous plaît ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre désigne collectivement la communauté invitée à reprendre à son compte la plainte à la première personne.
theological_decisions:
- issue: Locuteur collectif et cadre liturgique
  choice: Conserver la première personne singulière, puis l’appel adressé à Israël, de sorte que la communauté soit invitée à reprendre cette plainte.
  alternative: Comprendre le « je » comme un individu dont les paroles seraient ensuite appliquées à Israël.
  rationale: La proposition « qu’Israël le dise maintenant » favorise une identification collective, mais la traduction maintient la tension entre la voix individuelle et la voix communautaire sans la résoudre explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. « Chant des montées » garde la formulation traditionnelle et l’ambiguïté du titre. Les tirets préservent la continuité avec le verset suivant et le caractère d’appel liturgique.
