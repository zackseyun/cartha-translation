  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרַ֑/י יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/000.yaml
  text: 'A Song of Ascents: “Greatly they have afflicted me from my youth”—let Israel now say—[a]'
translation:
  language: fr
  text: Chant des montées. « Dès ma jeunesse, ils m’ont beaucoup opprimé », qu’Israël le dise donc[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dès ma jeunesse, ils m’ont opprimé bien des fois. » Le mot hébreu peut exprimer aussi bien une grande intensité que la répétition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend naturellement le titre hébreu tout en conservant l’image traditionnelle des montées, dont la référence précise reste ouverte.
- source_word: רַבַּת
  choice: beaucoup
  rationale: L’adverbe hébreu peut indiquer une grande intensité ou de nombreuses répétitions. « Beaucoup » conserve en français une part de cette latitude.
- source_word: צְרָרוּנִי
  choice: ils m’ont opprimé
  rationale: Le verbe צרר évoque le fait de serrer, harceler ou traiter en ennemi ; « opprimer » convient au contexte collectif sans préciser abusivement la forme de l’hostilité.
- source_word: מִנְּעוּרַי
  choice: dès ma jeunesse
  rationale: Exprime une oppression commencée dans la jeunesse et prolongée ou répétée depuis lors.
- source_word: יֹאמַר־נָא יִשְׂרָאֵל
  choice: qu’Israël le dise donc
  rationale: Le subjonctif injonctif rend l’appel adressé à Israël ; « donc » transmet ici la particule נָא avec une exhortation naturelle, plutôt qu’une simple indication temporelle.
theological_decisions:
- issue: Identité du locuteur à la première personne
  choice: Conserver « me/ma » et inviter Israël à reprendre cette parole
  alternative: Remplacer directement la première personne par « Israël »
  rationale: Le texte fait entendre une voix à la première personne, puis demande à Israël de la prononcer ; cette structure permet une identification collective sans l’expliciter à la place du texte.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. Les guillemets mettent en relief la déclaration qu’Israël est appelé à reprendre ; l’ordre des propositions reste proche de l’hébreu tout en étant idiomatique.
