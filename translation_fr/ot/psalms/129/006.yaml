source:
  edition: WLC
  text: יִ֭הְיוּ כַּ/חֲצִ֣יר גַּגּ֑וֹת שֶׁ/קַּדְמַ֖ת שָׁלַ֣ף יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: fr
  text: Qu’ils soient comme l’herbe des toits, qui sèche avant qu’on l’arrache.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִהְיוּ
  choice: Qu’ils soient
  rationale: La forme exprime ici un souhait imprécatoire visant ceux qui haïssent Sion, plutôt qu’un simple futur.
- source_word: כַּחֲצִיר
  choice: comme l’herbe
  rationale: « Herbe » rend naturellement חָצִיר et conserve l’image végétale du texte.
- source_word: גַּגּוֹת
  choice: des toits
  rationale: Le pluriel désigne les toits plats où une herbe peu enracinée pouvait pousser ; en français, « l’herbe des toits » exprime cette localisation avec naturel.
- source_word: שֶׁקַּדְמַת
  choice: avant que
  rationale: La construction a une valeur temporelle et indique que le dessèchement précède l’action exprimée ensuite.
- source_word: שָׁלַף
  choice: on l’arrache
  rationale: Le verbe signifie tirer ou extraire. Dans cette image, « arracher » décrit clairement l’action de retirer l’herbe, sans lui attribuer le sens non attesté de « pousser ».
- source_word: יָבֵשׁ
  choice: sèche
  rationale: Le verbe désigne le fait de se dessécher ; « sèche » est simple, concret et poétique en français.
theological_decisions: []
