source:
  edition: WLC
  text: עַל גַּ֭בִּ/י חָרְשׁ֣וּ חֹרְשִׁ֑ים הֶ֝אֱרִ֗יכוּ ל/מענות/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/003.yaml
  text: Plowmen have plowed on my back[a]; they have made their furrows long.
translation:
  language: fr
  text: Des laboureurs ont labouré sur mon dos ; ils ont allongé leurs sillons[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image du labour évoque une oppression cruelle ou de longues blessures infligées au dos.
    reason: clarification_metaphor
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: sur mon dos
  rationale: La préposition עַל exprime ici la surface sur laquelle s’exerce l’action, et גַּבִּי désigne précisément « mon dos ». Ce rendu conserve l’image concrète et violente de l’hébreu.
- source_word: חָרְשׁוּ
  choice: ont labouré
  rationale: Le verbe signifie littéralement « labourer ». Le passé composé convient à une évocation poétique d’actes subis dont les effets restent présents.
- source_word: חֹרְשִׁים
  choice: des laboureurs
  rationale: Le participe est employé comme nom pour désigner ceux qui labourent. « Laboureurs » est concis et maintient la métaphore agricole.
- source_word: הֶאֱרִיכוּ
  choice: ont allongé
  rationale: La forme causative signifie « rendre long, allonger ». Le choix suit directement la structure et le parallélisme du texte hébreu.
- source_word: לְמַעֲנוֹתָם
  choice: leurs sillons
  rationale: Le terme désigne ici les sillons ou raies tracés par le labour. « Sillons » est naturel en français et préserve l’image de longues blessures sur le dos.
theological_decisions:
- issue: Image métaphorique de la souffrance d’Israël
  choice: Conserver littéralement la métaphore du labour sur le dos et des longs sillons.
  alternative: Expliciter l’image par « Ils ont couvert mon dos de longues blessures » ou « Ils m’ont cruellement opprimé ».
  rationale: L’hébreu ne précise pas si l’image renvoie à des coups, à des blessures ou plus largement à l’oppression. Le texte principal garde donc cette tension poétique sans imposer une interprétation.
translation_notes:
  register: Français moderne, sobre et poétique. La répétition « laboureurs ont labouré » reproduit volontairement la figure étymologique de l’hébreu ; elle donne au verset sa force sans rendre explicite ce que la métaphore laisse ouvert.
