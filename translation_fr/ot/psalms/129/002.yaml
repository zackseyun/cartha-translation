  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: fr
  text: Ils m’ont beaucoup[a] opprimé depuis ma jeunesse, pourtant ils ne l’ont pas emporté sur moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À de nombreuses reprises, ils m’ont opprimé depuis ma jeunesse. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils n’ont pas triomphé de moi » ou « ils ne m’ont pas vaincu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: beaucoup
  rationale: Employé adverbialement, le terme exprime ici naturellement l’ampleur ou l’intensité de l’oppression. « Beaucoup » conserve aussi une part de l’ambiguïté entre degré et répétition.
- source_word: צְרָרוּנִי
  choice: ils m’ont opprimé
  rationale: Le verbe צרר décrit une conduite hostile, faite de harcèlement ou d’oppression. « Opprimé » convient au contexte collectif et prolongé sans limiter le sens à une attaque militaire.
- source_word: מִנְּעוּרָי
  choice: depuis ma jeunesse
  rationale: Cette expression temporelle désigne une situation commencée dans la jeunesse et prolongée par la suite; « depuis » l’exprime naturellement en français moderne.
- source_word: גַּם
  choice: pourtant
  rationale: 'Devant la négation, גַּם prend ici une valeur adversative ou concessive: malgré l’oppression, les adversaires n’ont pas réussi.'
- source_word: לֹא יָכְלוּ לִי
  choice: ils ne l’ont pas emporté sur moi
  rationale: יכל construit avec ל exprime l’incapacité à prévaloir contre quelqu’un. Cette tournure française rend clairement l’échec des adversaires sans ajouter l’idée plus définitive de destruction.
