id: PSA.129.8
reference: Psalms 129:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֤א אָֽמְר֨וּ הָ/עֹבְרִ֗ים בִּרְכַּֽת יְהוָ֥ה אֲלֵי/כֶ֑ם בֵּרַ֥כְנוּ אֶ֝תְ/כֶ֗ם בְּ/שֵׁ֣ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: fr
  text: 'et les passants ne disent pas :

    « Que la bénédiction de Yahweh[a] soit sur vous !

    Nous vous bénissons au nom de Yahweh. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR » ou « l’Éternel ».
    reason: Signaler la forme hébraïque et les rendus français traditionnels du nom divin.
lexical_decisions:
- source_word: וְלֹא
  choice: et ... ne ... pas
  rationale: La coordination négative prolonge la description du verset précédent tout en restant naturelle en français.
- source_word: אָמְרוּ
  choice: disent
  rationale: Dans cette description générale à valeur proverbiale, le présent français rend naturellement l’action que les passants n’accomplissent pas.
- source_word: הָעֹבְרִים
  choice: les passants
  rationale: Le participe substantivé avec article désigne une catégorie de personnes ; « les passants » est concis et idiomatique.
- source_word: בִּרְכַּת יְהוָה
  choice: la bénédiction de Yahweh
  rationale: Cette formulation conserve directement le groupe nominal construit de l’hébreu et son langage traditionnel de bénédiction.
- source_word: אֲלֵיכֶם
  choice: soit sur vous
  rationale: L’hébreu n’exprime pas de verbe, mais la formule appelle en français un subjonctif optatif ; « soit sur vous » préserve aussi l’image spatiale.
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: Nous vous bénissons
  rationale: Le parfait hébreu a ici une force performative dans une formule conventionnelle ; le présent français exprime l’acte de bénir au moment où il est prononcé.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: « Au nom de » est la tournure française usuelle pour indiquer l’invocation du nom et l’autorité sous laquelle la bénédiction est donnée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération « Yahweh » conserve le nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Français moderne, clair et digne. La formulation garde le parallélisme poétique, la négation initiale liée au contexte précédent et la structure en deux paroles de bénédiction.
