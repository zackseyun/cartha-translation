  text: with which the reaper has not filled his hand[a], nor the one who gathers sheaves, his arms.
translation:
  language: fr
  text: 'dont le moissonneur ne remplit pas sa main,

    ni celui qui rassemble les gerbes ne remplit son giron[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « son sein » ou « le pli de son vêtement » : l’endroit où l’on tient les tiges rassemblées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁלֹּא
  choice: dont… ne… pas
  rationale: Le relatif négatif renvoie à l’herbe des toits mentionnée au verset précédent. « Dont » exprime naturellement en français le rapport avec ce que les ouvriers ne peuvent en remplir.
- source_word: מִלֵּא
  choice: remplit
  rationale: Le parfait décrit ici le résultat caractéristique de cette herbe sans valeur. Le présent français convient à la comparaison générale et demeure naturel dans le parallélisme.
- source_word: כַפּוֹ
  choice: sa main
  rationale: כַּף désigne littéralement la paume, puis la main. « Sa main » est idiomatique dans la scène de moisson tout en conservant l’image concrète.
- source_word: קוֹצֵר
  choice: le moissonneur
  rationale: Le participe substantivé désigne celui qui coupe la récolte. « Moissonneur » est précis, concis et naturel.
- source_word: וְחִצְנוֹ
  choice: ses bras
  rationale: Le nom peut désigner le sein, le giron ou le pli du vêtement contre le corps où l’on porte les tiges recueillies. « Ses bras » communique clairement l’image fonctionnelle en français moderne, tandis que les possibilités plus littérales sont conservées en note.
- source_word: מְעַמֵּר
  choice: celui qui rassemble les gerbes
  rationale: Le participe désigne la personne qui rassemble la récolte en gerbes ou en tas. Cette formulation explicite l’action sans imposer l’idée plus précise de lier les gerbes.
