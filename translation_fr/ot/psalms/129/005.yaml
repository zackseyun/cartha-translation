  text: יֵ֭בֹשׁוּ וְ/יִסֹּ֣גוּ אָח֑וֹר כֹּ֝֗ל שֹׂנְאֵ֥י צִיּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/005.yaml
  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: fr
  text: Que tous ceux qui haïssent Sion soient couverts de honte et reculent[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tous ceux qui haïssent Sion seront couverts de honte et reculeront. » Les formes verbales hébraïques peuvent aussi être comprises comme l’annonce d’un événement futur plutôt que comme un souhait exprimé dans une prière.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: soient couverts de honte
  rationale: Le verbe בוש exprime ici la honte et la disgrâce. Cette tournure française naturelle rend la portée imprécatoire du contexte sans préciser un agent absent de l’hébreu.
- source_word: וְיִסֹּגוּ
  choice: et reculent
  rationale: Le verbe signifie se retirer, retourner en arrière ou reculer. « Reculent » est idiomatique en français et n’introduit pas une action causative que l’hébreu n’explicite pas.
- source_word: אָחוֹר
  choice: reculent
  rationale: L’adverbe « en arrière » est rendu de façon idiomatique par le verbe « reculer », qui en intègre naturellement le sens en français.
- source_word: כֹּל
  choice: tous ceux
  rationale: Cette expression restitue clairement la totalité visée par כֹּל devant le participe substantivé.
- source_word: שֹׂנְאֵי
  choice: qui détestent
  rationale: Le participe désigne ceux qui éprouvent de la haine. « Qui détestent » est une formulation française courante et directe.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et reconnue du nom צִיּוֹן.
theological_decisions:
- issue: Valeur imprécatoire ou prédictive des formes verbales initiales
  choice: 'Les rendre comme un souhait-prière : « Que… soient… et reculent ! »'
  alternative: 'Les lire comme un futur déclaratif : « Tous ceux qui détestent Sion seront couverts de honte et reculeront. »'
  rationale: Dans ce contexte poétique, les formes yiqtol peuvent exprimer un souhait imprécatoire, mais une lecture au futur reste grammaticalement possible. Le texte principal retient la prière et la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation marque la force du souhait imprécatoire. « Détestent » est préféré à « haïssent » pour sa fluidité courante, tout en conservant l’intensité hostile du participe hébreu.
