source:
  edition: WLC
  text: יְהוָ֥ה צַדִּ֑יק קִ֝צֵּ֗ץ עֲב֣וֹת רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: fr
  text: Yahweh est juste ; il a tranché les cordes[a] des méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les cordages » ou « les grosses cordes ».
    reason: Alternative lexicale pour עֲבוֹת, qui peut désigner des cordes épaisses.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel employé dans le texte hébreu, plutôt que de le remplacer par un titre.
- source_word: צַדִּיק
  choice: juste
  rationale: Dans cette déclaration poétique, l’adjectif qualifie directement Yahweh et exprime à la fois sa droiture morale et la justice de son intervention.
- source_word: קִצֵּץ
  choice: a tranché
  rationale: Le verbe désigne l’action de couper ou de sectionner. « A tranché » rend naturellement l’accompli hébreu et souligne le caractère décisif de la délivrance.
- source_word: עֲבוֹת
  choice: cordes
  rationale: Le nom évoque des cordes, éventuellement épaisses, servant à attacher. « Cordes » conserve clairement l’image concrète sans l’interpréter davantage.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif masculin pluriel est substantivé et désigne collectivement les personnes méchantes, sans qu’il soit nécessaire d’ajouter « hommes ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte explicitement le Tétragramme. La translittération préserve le nom propre de Dieu au lieu de lui substituer un titre.
- issue: Portée de l’image des cordes
  choice: Conserver l’image concrète sans explicitation
  alternative: les liens des méchants
  rationale: Le contexte suggère la libération d’une oppression, mais le verset parle littéralement de cordes. La traduction maintient cette métaphore et laisse au lecteur sa portée poétique.
translation_notes:
  register: Français international moderne, sobre et poétique. La ponctuation met en valeur le rapport entre la justice de Yahweh et son acte de délivrance.
