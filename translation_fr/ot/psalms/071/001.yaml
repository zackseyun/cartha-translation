id: PSA.71.1
reference: Psalms 71:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: fr
  text: En toi, Yahvé, je me suis réfugié ; que jamais je ne sois couvert de honte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/ךָ
  choice: En toi
  rationale: La préposition ב avec le suffixe de deuxième personne introduit ici, de façon métaphorique, celui auprès de qui le psalmiste trouve refuge. « En toi » conserve l’expression hébraïque tout en restant naturelle en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte hébreu emploie le nom divin יהוה. « Yahvé » en donne la forme française courante sans le remplacer par un titre.
- source_word: חָסִיתִי
  choice: je me suis réfugié
  rationale: Le verbe חסה évoque le fait de chercher ou de trouver refuge. Le passé composé rend l’accompli hébreu comme une démarche déjà entreprise et toujours pertinente.
- source_word: אַל אֵבוֹשָׁה
  choice: que […] je ne sois couvert de honte
  rationale: אַל suivi de cette forme verbale exprime une prière négative. « Être couvert de honte » rend la disgrâce publique ou l’échec redouté, plutôt qu’un simple sentiment intérieur de gêne.
- source_word: לְ/עוֹלָם
  choice: jamais
  rationale: Sous la portée de la négation, לְעוֹלָם se rend idiomatiquement par « jamais » en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le verset contient le nom propre divin. Le rendre par « Yahvé » préserve cette distinction sans substituer au nom le titre « Seigneur ».
- issue: Portée de la honte demandée dans la prière
  choice: être couvert de honte
  alternative: avoir honte
  rationale: Dans ce contexte de refuge et de délivrance, la honte peut désigner la disgrâce résultant d’un abandon apparent ou d’une défaite, sans exclure entièrement l’expérience subjective de honte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image du refuge, l’adresse directe à Dieu et le caractère suppliant du second membre.
