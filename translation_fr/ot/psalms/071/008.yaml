base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/008.yaml
  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: fr
  text: Ma bouche sera remplie de ta louange[a], de ta splendeur[b], tout au long du jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Ma bouche est remplie de ta louange » ou « Que ma bouche soit remplie de ta louange ». Dans ce contexte poétique, la forme verbale hébraïque peut avoir une nuance future, présente ou volitive.'
    reason: alternative_reading
  - marker: b
    text: Ou « ta gloire », « ta beauté » ou « ta majesté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלֵא
  choice: sera remplie
  rationale: Le nifal inaccompli de מלא exprime naturellement ici un état à venir ou continu. Le futur français préserve cette valeur sans exclure les nuances présentes ou volitives possibles en poésie.
- source_word: פִי
  choice: ma bouche
  rationale: La traduction concrète conserve l’image hébraïque de la bouche comme organe de la parole et de la louange.
- source_word: תְּהִלָּתֶךָ
  choice: la louange qui t’est due
  rationale: Le suffixe peut désigner la louange adressée à Dieu ou ayant Dieu pour objet. Cette formulation française rend clairement ce rapport sans suggérer que Dieu lui-même prononce la louange.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Expression française naturelle et digne qui conserve la durée continue de la locution hébraïque.
- source_word: תִּפְאַרְתֶּךָ
  choice: ta splendeur
  rationale: תפארת couvre les notions de beauté, gloire, magnificence et majesté. « Splendeur » convient au parallélisme poétique sans réduire l’étendue sémantique au seul terme « gloire ».
theological_decisions:
- issue: Valeur modale ou temporelle de יִמָּלֵא
  choice: 'Déclaration au futur : « sera remplie »'
  alternative: Présent (« est remplie ») ou souhait/prière (« que ma bouche soit remplie »)
  rationale: L’inaccompli hébreu permet plusieurs nuances dans ce contexte poétique. Le futur s’accorde naturellement au mouvement du psaume, tandis qu’une note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise pronominale « elle proclamera » explicite en français la relation elliptique entre « ma bouche » et « ta splendeur », tout en conservant le parallélisme et l’idée d’une louange continue.
