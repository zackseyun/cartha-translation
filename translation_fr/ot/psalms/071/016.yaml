  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: fr
  text: Je viendrai avec les actes puissants du Seigneur Yahweh[a] ; je proclamerai[b] ta justice[c], elle seule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « dans les actes puissants du Seigneur Yahweh ». La préposition hébraïque peut indiquer le moyen ou la sphère dans laquelle le psalmiste vient.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je mentionnerai » ou « je raconterai ». Le verbe hébreu peut exprimer le fait de mentionner, de rappeler ou de proclamer.'
    reason: lexical_alternative
  - marker: c
    text: « Ta justice » peut aussi se comprendre comme « ta droiture » ou, dans ce contexte, « tes actes justes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Je viendrai
  rationale: Le qal inaccompli à la première personne de בוא peut signifier « venir », « aller » ou « entrer ». « Je viendrai » conserve le sens le plus direct sans préciser davantage le mouvement.
- source_word: בִּגְבֻרוֹת
  choice: avec les actes puissants
  rationale: Le pluriel גְּבוּרוֹת désigne ici des manifestations de puissance, donc des actes puissants. « Avec » rend naturellement en français la valeur instrumentale ou concomitante possible de la préposition בְּ, tandis qu’une note conserve l’autre lecture.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation distingue le titre אֲדֹנָי du nom divin יְהוִה et évite l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: אַזְכִּיר
  choice: je proclamerai
  rationale: Le hiphil de זכר peut exprimer l’action de mentionner, rappeler, raconter ou faire connaître. « Proclamer » convient au contexte de déclaration publique, sans exclure les autres nuances signalées en note.
- source_word: צִדְקָתְךָ
  choice: ta justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou les actes justes de Dieu. « Justice » est naturel en français et conserve la portée morale et théologique du terme.
- source_word: לְבַדֶּךָ
  choice: la tienne seule
  rationale: Cette expression souligne ici que la justice évoquée appartient exclusivement à Dieu. La reprise pronominale rend clairement cette relation en français.
theological_decisions:
- issue: Rendu du nom divin יְהוִה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » représente directement le nom divin, tandis que « Seigneur » rend le titre אֲדֹנָי. Ce choix préserve les deux éléments distincts de l’hébreu.
- issue: Portée de צִדְקָתְךָ
  choice: ta justice
  alternative: tes actes justes
  rationale: Le substantif peut désigner aussi bien la qualité de justice de Dieu que ses interventions justes. Le texte principal garde le terme abstrait et la note préserve la lecture concrète.
translation_notes:
  register: Français international moderne, poétique et digne. Le verset conserve la structure en deux propositions et l’insistance finale de l’hébreu, tout en signalant les principales ambiguïtés lexicales.
