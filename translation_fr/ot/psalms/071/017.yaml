source:
  edition: WLC
  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: fr
  text: Ô Dieu, tu m’as enseigné dès ma jeunesse, et jusqu’à présent je proclame tes œuvres merveilleuses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes merveilles » ou « tes actes prodigieux ».
    reason: Alternative lexicale pour נִפְלְאוֹתֶיךָ, qui peut désigner les merveilles elles-mêmes ou les actes extraordinaires accomplis par Dieu.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom divin fonctionne ici comme une apostrophe, ce que confirment les formes à la deuxième personne. « Ô Dieu » marque clairement cette adresse dans un registre digne et naturel.
- source_word: לִמַּדְתַּנִי
  choice: tu m’as enseigné
  rationale: Le piel de למד avec suffixe de première personne signifie « tu m’as enseigné ». Le passé composé exprime une action commencée dans la jeunesse dont les effets demeurent.
- source_word: מִנְּעוּרָי
  choice: dès ma jeunesse
  rationale: La construction מן avec « jeunesse » indique le point de départ. « Dès ma jeunesse » est idiomatique en français et souligne la continuité temporelle.
- source_word: וְעַד הֵנָּה
  choice: et jusqu’à présent
  rationale: L’expression désigne la période qui se prolonge jusqu’au moment où parle le psalmiste. Cette traduction reste proche de l’image temporelle hébraïque.
- source_word: אַגִּיד
  choice: je proclame
  rationale: Le hiphil de נגד peut signifier raconter, annoncer ou proclamer. « Je proclame » convient au témoignage public de louange sans dépasser la force du verbe.
- source_word: נִפְלְאוֹתֶיךָ
  choice: tes œuvres merveilleuses
  rationale: Le pluriel נִפְלָאוֹת désigne les actes extraordinaires de Dieu. « Œuvres merveilleuses » rend explicitement leur caractère actif; « merveilles » demeure possible.
theological_decisions:
- issue: Nature syntaxique de l’adresse à Dieu
  choice: 'Apostrophe directe : « Ô Dieu, tu m’as enseigné… »'
  alternative: Comprendre « Dieu » comme le sujet d’une affirmation à la troisième personne
  rationale: Les verbes et suffixes de deuxième personne indiquent naturellement une prière adressée directement à Dieu. L’apostrophe préserve cette posture sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. « Ô Dieu » conserve la tonalité poétique de l’apostrophe; « jusqu’à présent » et « je proclame » restent clairs pour le lectorat contemporain.
