  source_fidelity: 'Le sens général est fidèle : la langue du psalmiste exprime continuellement la צדקה de Dieu, parce que ses adversaires sont honteux et humiliés. « Justice » est un bon rendu contextuel de צִדְקָתֶךָ, dont la portée n’est pas réduite grâce à la note. Toutefois, « proclamera » est plus fort que le verbe hébreu הגה, qui évoque l’énonciation répétée, le murmure ou la méditation; « parlera de » reproduit plus sobrement le sens retenu par l’audit anglais.'
  naturalness: 'La fin de la phrase actuelle est syntaxiquement lourde : « ils sont couverts de honte, ils sont humiliés, ceux qui cherchent mon malheur » place tardivement le groupe qui désigne les sujets et crée une apposition peu naturelle. En le plaçant avant les verbes, le parallélisme demeure clair et fluide.'
  terminology: « Justice » convient dans le texte principal pour la justice salvatrice ou vindicatrice de Dieu; « droiture » constitue une alternative recevable en note. « Ceux qui cherchent mon malheur » rend correctement le participe hébreu et l’intention hostile continue.
