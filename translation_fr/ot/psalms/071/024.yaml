id: PSA.71.24
reference: Psalms 71:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם לְשׁוֹנִ֗/י כָּל הַ֭/יּוֹם תֶּהְגֶּ֣ה צִדְקָתֶ֑/ךָ כִּי בֹ֥שׁוּ כִֽי חָ֝פְר֗וּ מְבַקְשֵׁ֥י רָעָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/024.yaml
  text: My tongue also will speak of your righteousness all day long[a], for those seeking my harm have been put to shame; they have been disgraced.
translation:
  language: fr
  text: Ma langue aussi parlera de ta justice tout au long du jour[a], car ceux qui cherchent mon malheur sont couverts de honte, ils sont humiliés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture ». Le terme hébreu peut désigner à la fois la droiture et la justice, notamment lorsque Dieu intervient pour sauver et rétablir le droit.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: aussi
  rationale: Marque la continuité avec la louange du verset précédent et inclut la langue parmi les moyens de célébrer Dieu.
- source_word: לְשׁוֹנִי
  choice: Ma langue
  rationale: Conserve l’image poétique concrète du texte hébreu plutôt que de l’abstraire en « ma parole ».
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Expression française naturelle qui maintient l’idée d’une louange soutenue pendant toute la journée.
- source_word: תֶּהְגֶּה
  choice: proclamera
  rationale: Le verbe הגה peut évoquer le murmure, la méditation ou l’énonciation. Avec « ma langue » pour sujet, le contexte favorise ici une expression audible, sans réduire le terme à une simple réflexion intérieure.
- source_word: צִדְקָתֶךָ
  choice: ta justice
  rationale: Dans ce contexte de délivrance et de confusion des adversaires, « justice » exprime naturellement en français la droiture de Dieu manifestée par son intervention salvatrice, tout en restant proche du champ sémantique de צדקה.
- source_word: כִּי ... כִּי
  choice: car ... [coordination sans répétition]
  rationale: Le premier כִּי introduit le motif de la louange. Le second renforce ou relie étroitement les deux verbes de honte; une juxtaposition coordonnée en français préserve le mouvement sans produire un « car » répétitif et maladroit.
- source_word: בֹשׁוּ
  choice: ils sont couverts de honte
  rationale: Rend l’état résultant exprimé par l’accompli hébreu et distingue ce premier terme du verbe suivant.
- source_word: חָפְרוּ
  choice: ils sont humiliés
  rationale: Préserve le parallélisme intensif avec בֹשׁוּ tout en exprimant la nuance de déshonneur et d’abaissement.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: ceux qui cherchent mon malheur
  rationale: Rend le participe comme une intention hostile persistante; « mon malheur » exprime le tort ou la calamité recherchés contre le psalmiste.
theological_decisions:
- issue: Portée de צִדְקָתֶךָ dans un contexte psalmique
  choice: ta justice
  alternative: ta droiture
  rationale: Le terme hébreu embrasse la droiture de Dieu et sa justice qui sauve ou rétablit. Le contexte immédiat, où les ennemis sont confondus, favorise « justice », tandis qu’une note conserve l’autre nuance légitime.
- issue: Valeur de תֶּהְגֶּה avec la langue pour sujet
  choice: proclamera
  alternative: méditera sur
  rationale: La langue comme sujet et le contexte de louange indiquent une expression vocale. La traduction évite néanmoins d’ajouter un contenu doctrinal absent du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le futur soutient la déclaration de louange; la reprise « ils sont... ils sont... » conserve le parallélisme hébreu et met en relief l’issue réservée aux adversaires.
