  text: תְּרַנֵּ֣נָּ֣ה שְׂ֭פָתַ/י כִּ֣י אֲזַמְּרָה לָּ֑/ךְ וְ֝/נַפְשִׁ֗/י אֲשֶׁ֣ר פָּדִֽיתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: fr
  text: Mes lèvres pousseront des cris de joie quand je chanterai tes louanges[a], et mon âme[b], que tu as rachetée[c], poussera elle aussi des cris de joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand je chanterai pour toi » ou « quand je ferai de la musique pour toi » ; le verbe hébreu peut désigner le chant de louange ou la musique qui l’accompagne.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma vie » ou « tout mon être » ; le mot hébreu peut désigner l’âme, la vie ou la personne elle-même.
    reason: lexical_alternative
  - marker: c
    text: Ou « délivrée » ; le verbe hébreu évoque une libération, souvent sous l’image d’un rachat.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: pousseront des cris de joie
  rationale: Le piel de רנן peut évoquer aussi bien un cri joyeux qu’un chant jubilant. Cette formulation conserve l’exubérance vocale sans la réduire au seul chant.
- source_word: שְׂפָתַי
  choice: mes lèvres
  rationale: Le rendu concret préserve l’image poétique de la louange qui sort des lèvres du psalmiste.
- source_word: כִּי
  choice: quand
  rationale: Dans ce contexte, la conjonction peut introduire le moment ou la circonstance où éclate la joie; « quand » donne en français un rapport naturel entre les deux propositions.
- source_word: אֲזַמְּרָה לָּךְ
  choice: je chanterai tes louanges
  rationale: Le piel de זמר désigne couramment la louange musicale adressée à Dieu. Cette expression est naturelle en français et garde l’idée de chant laudatif.
- source_word: וְנַפְשִׁי
  choice: et mon âme
  rationale: נפשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » maintient ici le parallélisme poétique entre l’expression extérieure des lèvres et l’être intérieur.
- source_word: פָּדִיתָ
  choice: tu as rachetée
  rationale: פדה désigne la libération obtenue par rachat ou délivrance. « Racheter » conserve sa portée théologique sans préciser indûment le moyen de cette délivrance.
theological_decisions:
- issue: Sens de פדה dans le contexte de la louange
  choice: rachetée
  alternative: délivrée
  rationale: Le verset fonde la louange sur l’action salvatrice de Dieu. « Rachetée » conserve l’image du rachat et sa résonance biblique, tandis que la note signale le sens plus général possible de délivrance.
translation_notes:
  register: Français international moderne, poétique et digne. Le futur reprend les formes volitives ou prospectives du verset. L’accord féminin de « rachetée » renvoie clairement à « âme ». Les notes préservent l’étendue sémantique de נפשׁ et פדה ainsi que la nuance musicale de זמר.
