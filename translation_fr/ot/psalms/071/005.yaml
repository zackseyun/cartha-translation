  text: כִּֽי אַתָּ֥ה תִקְוָתִ֑/י אֲדֹנָ֥/י יְ֝הוִ֗ה מִבְטַחִ֥/י מִ/נְּעוּרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/005.yaml
  text: For you are my hope[a], Lord Yahweh[c][b], my confidence from my youth.
translation:
  language: fr
  text: Car c’est toi qui es mon espérance, Seigneur Yahweh, ma confiance depuis ma jeunesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou le fondement de l’appel environnant, avec une valeur explicative naturelle en français.
- source_word: אַתָּה
  choice: c’est toi qui
  rationale: La tournure française met en relief le pronom explicite et emphatique de l’hébreu.
- source_word: תִקְוָתִי
  choice: mon espérance
  rationale: Rend directement l’idée d’espoir ou d’attente confiante dans un registre digne et courant.
- source_word: אֲדֹנָי יְהוִה
  choice: Seigneur Yahweh
  rationale: Conserve à la fois le titre אֲדֹנָי et le nom divin יהוה, sans les confondre.
- source_word: מִבְטַחִי
  choice: mon assurance
  rationale: Désigne celui en qui repose la confiance; « assurance » s’accorde naturellement avec « espérance » sans répétition.
- source_word: מִנְּעוּרָי
  choice: depuis ma jeunesse
  rationale: Exprime naturellement en français le point de départ d’une confiance qui se prolonge.
theological_decisions:
- issue: Rendu du nom divin יהוה après אֲדֹנָי
  choice: Seigneur Yahweh
  alternative: Seigneur DIEU
  rationale: Le texte hébreu juxtapose le titre « Seigneur » et le nom divin. « Seigneur Yahweh » rend explicitement les deux éléments et évite de remplacer silencieusement le nom par un titre.
- issue: Portée temporelle de מִנְּעוּרָי
  choice: depuis ma jeunesse
  alternative: dès ma jeunesse
  rationale: « Depuis » suggère naturellement une confiance commencée dans la jeunesse et maintenue jusqu’au présent; « dès » reste possible mais souligne davantage le commencement.
translation_notes:
  register: Français international moderne, naturel et digne. La construction emphatique « c’est toi qui » préserve l’insistance du pronom hébreu; le parallélisme « mon espérance / mon assurance » demeure clair.
