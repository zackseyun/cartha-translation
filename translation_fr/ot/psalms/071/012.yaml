  text: God[a], do not be far from me; my God, hurry to help me.
translation:
  language: fr
  text: Dieu, ne sois pas loin de moi ! Mon Dieu, hâte-toi de me secourir !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom divin est ici employé comme apostrophe. En français moderne, « Ô Dieu » marque clairement l’adresse directe et convient au registre digne de la prière.
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: ne reste pas loin de moi
  rationale: La tournure conserve l’image spatiale et relationnelle de רחק ainsi que la supplication négative exprimée par אַל. « Reste » rend naturellement en français l’idée d’être éloigné, sans suggérer nécessairement un départ.
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Le suffixe de première personne est rendu directement et l’apostrophe répétée est préservée.
- source_word: לְעֶזְרָתִי
  choice: m’aider
  rationale: Cette formulation idiomatique rend « pour mon secours / à mon aide » sans alourdir la phrase.
- source_word: חִישָׁה
  choice: hâte-toi
  rationale: L’impératif exprime l’urgence. « Hâte-toi » reste actuel dans une prière solennelle et évite d’ajouter un verbe de mouvement absent de l’hébreu.
theological_decisions:
- issue: Répétition des titres divins dans l’adresse directe
  choice: Ô Dieu… Mon Dieu
  alternative: Dieu… mon Dieu
  rationale: La traduction maintient les deux apostrophes et la progression vers l’expression personnelle « mon Dieu ». Le « Ô » explicite le premier vocatif sans imposer d’interprétation doctrinale.
- issue: Nature de l’éloignement de Dieu
  choice: ne reste pas loin de moi
  alternative: ne t’éloigne pas de moi
  rationale: L’hébreu peut exprimer l’état ou le fait de devenir distant. « Ne reste pas loin » préserve ici l’ambiguïté relationnelle et spatiale sans présupposer que Dieu est en train de s’éloigner.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme bref de la supplication est conservé, avec une ponctuation qui fait entendre son urgence.
