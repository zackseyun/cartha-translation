review_pass:
  verdict: revise
  source_fidelity: La première demande hébraïque est littéralement une prière pour que Dieu ne soit pas loin du psalmiste. « Ne reste pas loin » peut suggérer indûment que Dieu se trouve déjà loin et qu’il y demeure. « Ne sois pas loin » rend plus directement l’état exprimé, sans lever l’ambiguïté entre distance spatiale et relationnelle. La seconde demande, « hâte-toi de me secourir », restitue fidèlement l’urgence de חִישָׁה et le but « pour mon secours ».
  naturalness: « Dieu, ne sois pas loin de moi ! Mon Dieu, hâte-toi de me secourir ! » est une formulation claire, fluide et digne en français international moderne. L’omission de « Ô », qui est aujourd’hui plus liturgique ou archaïsant, rend l’apostrophe naturelle tout en préservant l’adresse directe.
  terminology: « Dieu » et « mon Dieu » conservent exactement la répétition des titres divins et le suffixe personnel de אֱלֹהַי. « Me secourir » correspond bien à l’idée de secours de לְעֶזְרָתִי sans introduire un déplacement (« viens ») qui n’est pas exprimé.
  issues:
