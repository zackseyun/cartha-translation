    issue: « ne reste pas loin »
    rationale: Cette formulation peut présenter l’éloignement comme une situation déjà établie et durable. « Ne sois pas loin » est plus proche de l’hébreu tout en restant idiomatique.
  - severity: low
    issue: « Ô Dieu »
    rationale: Le vocatif est possible, mais « Ô » donne une coloration plus liturgique et archaïsante que ne le requiert le français international moderne. « Dieu » fonctionne naturellement comme apostrophe.
