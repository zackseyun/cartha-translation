  text: אֱֽלֹהַ֗/י פַּ֭לְּטֵ/נִי מִ/יַּ֣ד רָשָׁ֑ע מִ/כַּ֖ף מְעַוֵּ֣ל וְ/חוֹמֵץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/004.yaml
  text: My God[a], rescue me from the hand of the wicked[c][b], from the grasp of the unjust and violent man.
translation:
  language: fr
  text: Mon Dieu, délivre-moi de la main du méchant, de l’emprise[a] de l’homme injuste et violent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la paume » ; l’expression désigne ici la prise ou le pouvoir de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « oppresseur » ; le terme hébreu peut désigner une personne violente ou oppressive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Forme d’adresse avec suffixe de première personne du singulier ; « Mon Dieu » est naturel, direct et digne en français contemporain.
- source_word: פַּלְּטֵנִי
  choice: délivre-moi
  rationale: L’impératif exprime la demande d’échapper à un danger. « Délivre-moi » conserve la force du verbe tout en restant idiomatique dans un psaume.
- source_word: מִיַּד רָשָׁע
  choice: de la main du méchant
  rationale: La « main » désigne ici le pouvoir ou la domination. L’image hébraïque demeure claire en français, et le singulier substantivé רָשָׁע est rendu par « le méchant ».
- source_word: מִכַּף
  choice: de l’emprise
  rationale: כף signifie littéralement « paume », mais évoque dans ce contexte la prise et le contrôle. « Emprise » transmet naturellement le sens tout en évitant de répéter « main ».
- source_word: מְעַוֵּל
  choice: injuste
  rationale: Le participe désigne celui qui agit avec injustice ou perversité. « Injuste » préserve la nuance morale et juridique.
- source_word: וְחוֹמֵץ
  choice: et violent
  rationale: Le terme décrit celui qui recourt à la violence ou opprime. « Violent » est une correspondance proche et compréhensible, tandis que la note conserve l’autre nuance possible.
