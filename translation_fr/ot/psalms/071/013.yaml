reference: Psalms 71:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ יִכְלוּ֮ שֹׂטְנֵ֪י נַ֫פְשִׁ֥/י יַֽעֲט֣וּ חֶ֭רְפָּה וּ/כְלִמָּ֑ה מְ֝בַקְשֵׁ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: fr
  text: Que ceux qui s’en prennent à ma vie[a] soient couverts de honte et disparaissent[b] ! Que ceux qui cherchent mon malheur soient revêtus d’opprobre et d’humiliation !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à mon être ». Le mot hébreu peut désigner la vie ou la personne elle-même, et pas seulement l’âme au sens immatériel.
    reason: lexical_alternative
  - marker: b
    text: Ou « soient consumés » ou « périssent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: qu’ils soient couverts de honte
  rationale: Dans ce contexte de prière, l’imparfait a une valeur jussive. Cette formulation exprime le souhait imprécatoire et le résultat public de la honte.
- source_word: יִכְלוּ
  choice: disparaissent
  rationale: Le verbe כלה peut évoquer le fait d’être achevé, consumé ou de disparaître. « Disparaissent » reste naturel en français sans préciser indûment le mode de leur fin.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: ceux qui s’en prennent à ma vie
  rationale: Le participe de שטן désigne ceux qui agissent en adversaires. Ici נֶפֶשׁ renvoie vraisemblablement à la vie ou à la personne du psalmiste plutôt qu’à l’âme immatérielle.
- source_word: יַעֲטוּ
  choice: qu’ils soient revêtus de
  rationale: Le verbe עטה conserve l’image concrète de se couvrir ou de se vêtir, appliquée ici au mépris et à l’humiliation.
- source_word: חֶרְפָּה
  choice: mépris
  rationale: Le mot évoque l’opprobre, les outrages et le déshonneur publics. « Mépris » est courant et se distingue du terme suivant.
- source_word: וּכְלִמָּה
  choice: et d’humiliation
  rationale: כְּלִמָּה désigne la honte ou l’humiliation. Ce choix préserve l’intensification synonymique sans répéter « honte ».
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: ceux qui cherchent mon malheur
  rationale: L’expression désigne ceux qui cherchent activement à provoquer le mal ou le tort du psalmiste. « Cherchent mon malheur » est idiomatique et garde cette intention hostile.
theological_decisions:
- issue: Valeur imprécatoire des imparfaits
  choice: Rendre les verbes comme des souhaits ou demandes par « Qu’ils… »
  alternative: 'Les rendre comme de simples futurs prédictifs : « Ils seront… »'
  rationale: Dans cette prière poétique, la série d’imparfaits a vraisemblablement une valeur jussive. La traduction garde ainsi l’appel direct du psalmiste sans le transformer en prédiction détachée.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique, la force imprécatoire et la métaphore du vêtement sont conservés. La ponctuation en deux exclamations rend le mouvement de la prière sans ajouter d’explication au texte.
