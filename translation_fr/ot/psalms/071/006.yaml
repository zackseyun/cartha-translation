  text: עָלֶ֤י/ךָ נִסְמַ֬כְתִּי מִ/בֶּ֗טֶן מִ/מְּעֵ֣י אִ֭מִּ/י אַתָּ֣ה גוֹזִ֑/י בְּ/ךָ֖ תְהִלָּתִ֣/י תָמִֽיד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: fr
  text: Je m’appuie sur toi depuis le ventre maternel ; depuis les entrailles de ma mère, c’est toi qui m’as fait sortir[a]. En toi est sans cesse ma louange.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « depuis le sein de ma mère, c’est toi qui m’as fait sortir ». L’hébreu emploie ici un autre terme que dans la proposition précédente, littéralement « les entrailles de ma mère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: Je m’appuie sur toi
  rationale: Le niphal de סמך avec עַל exprime ici le fait de s’appuyer sur Dieu et de dépendre de lui. Cette formulation conserve l’image concrète tout en étant naturelle en français.
- source_word: מִבֶּטֶן
  choice: depuis le ventre maternel
  rationale: בטן désigne le ventre ou le sein maternel. « Depuis le ventre maternel » préserve l’image de l’origine de la vie sans réduire l’expression à « depuis ma naissance ».
- source_word: מִמְּעֵי אִמִּי
  choice: depuis les entrailles de ma mère
  rationale: מֵעֶה désigne littéralement les parties intérieures ou entrailles. Le choix maintient la variation lexicale avec בטן dans la proposition précédente.
- source_word: אַתָּה גוֹזִי
  choice: c’est toi qui m’as fait sortir
  rationale: Le pronom indépendant אַתָּה est emphatique, rendu par « c’est toi ». Dans ce contexte de naissance, גוֹזִי décrit Dieu comme celui qui a fait sortir le psalmiste du sein maternel, sans imposer le sens théologique plus large de « libérateur ».
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: En toi est sans cesse ma louange
  rationale: La formulation conserve le rapport compact exprimé par בְּךָ, ainsi que le substantif « ma louange » et la continuité marquée par תָמִיד. Son ordre légèrement poétique convient au registre du psaume.
theological_decisions:
- issue: L’action de Dieu dans l’image de la naissance
  choice: Dieu est présenté comme celui qui a fait sortir le psalmiste du sein maternel.
  alternative: Dieu serait seulement celui qui soutient le psalmiste depuis sa naissance.
  rationale: Le contexte et le participe גוֹזִי attribuent naturellement à Dieu une action providentielle lors de la venue au monde. La traduction garde cette image sans lui ajouter une formulation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible tout en conservant les images corporelles et la variation lexicale de l’hébreu.
