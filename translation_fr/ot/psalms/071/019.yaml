id: PSA.71.19
reference: Psalms 71:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: fr
  text: Ta justice[a], ô Dieu, atteint les hauteurs[b], toi qui as accompli de grandes choses. Ô Dieu, qui est comme toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droiture ». Le mot hébreu peut désigner la rectitude ou la justice selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « s’étend jusqu’au ciel ». L’hébreu dit littéralement « jusqu’à la hauteur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/צִדְקָתְ/ךָ
  choice: Ta justice
  rationale: Dans ce contexte de louange, צְדָקָה désigne la rectitude morale de Dieu manifestée dans ses actes. « Justice » est naturel en français et garde à la fois les dimensions morale et judiciaire du terme.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé comme une adresse directe. « Ô Dieu » conserve le ton poétique et solennel sans être obscur.
- source_word: עַד מָרוֹם
  choice: atteint les hauteurs
  rationale: La formule signifie littéralement « jusqu’à la hauteur ». Cette traduction préserve l’image spatiale et l’idée d’une portée immense sans identifier explicitement מָרוֹם au ciel.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: toi qui as accompli de grandes choses
  rationale: אֲשֶׁר introduit une proposition relative. La reprise par « toi » rend clairement en français son lien avec l’adresse à Dieu.
- source_word: גְדֹלוֹת
  choice: de grandes choses
  rationale: L’adjectif féminin pluriel est substantivé. « De grandes choses » en conserve l’ampleur, sans réduire le sens aux seuls exploits ou miracles.
- source_word: מִי כָמוֹךָ
  choice: qui est comme toi ?
  rationale: Cette formulation simple et actuelle préserve la question rhétorique exprimant l’incomparabilité de Dieu.
theological_decisions:
- issue: Sens de צְדָקָה appliqué à Dieu
  choice: justice
  alternative: droiture
  rationale: « Justice » est le terme français le plus naturel ici pour la perfection morale de Dieu et sa manifestation dans ses œuvres. « Droiture » reste possible et mettrait davantage l’accent sur la rectitude, mais serait moins idiomatique dans cette phrase.
- issue: Référent de מָרוֹם
  choice: les hauteurs
  alternative: le ciel
  rationale: Le mot indique la hauteur ou le lieu élevé, sans imposer ici une identification précise avec le ciel. La traduction conserve donc l’indétermination poétique du texte hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure accessible, tandis que « ô Dieu » garde le caractère d’une adresse solennelle. Les deux ambiguïtés lexicales importantes sont conservées en notes.
