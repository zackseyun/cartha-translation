  source_fidelity: 'Le sens fondamental est bien rendu : le psalmiste est devenu, aux yeux de nombreuses personnes, quelque chose de saisissant, et Dieu est son refuge caractérisé par la force. « Présage » préserve utilement l’ambivalence de מוֹפֵת, sans imposer un sens uniquement funeste ou positif. La tournure « pour beaucoup » est possible, mais sa place dans la phrase peut laisser entendre une finalité; l’encadrement par des virgules rend plus nettement la perspective des personnes concernées.'
