  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: fr
  text: Je suis devenu, pour beaucoup, comme un présage[a], mais toi, tu es mon solide refuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prodige », « un signe » ou « un objet d’étonnement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: comme un présage
  rationale: מוֹפֵת désigne un signe, un prodige ou un présage, quelque chose de frappant qui suscite l’étonnement. « Présage » maintient ici une certaine ambiguïté quant au caractère favorable ou inquiétant de ce que représente le psalmiste, tandis que כְּ est rendu par « comme ».
- source_word: הָיִיתִי
  choice: Je suis devenu
  rationale: Le qatal de היה peut décrire un état issu d’une évolution antérieure. « Je suis devenu » exprime naturellement en français la situation présente résultant de l’expérience passée du psalmiste.
- source_word: לְרַבִּים
  choice: pour beaucoup
  rationale: La préposition לְ indique ici les nombreuses personnes aux yeux desquelles le psalmiste est devenu un présage. « Pour beaucoup » est idiomatique et reste proche de la construction hébraïque.
- source_word: מַחֲסִי
  choice: mon refuge
  rationale: מַחֲסֶה désigne un refuge ou un abri protecteur. « Mon refuge » conserve clairement et sobrement la métaphore.
- source_word: עֹז
  choice: puissant
  rationale: עֹז signifie « force, puissance ». La formulation hébraïque, littéralement proche de « mon refuge de force », est rendue idiomatiquement par « mon puissant refuge », sans affaiblir l’idée de protection solide.
theological_decisions:
- issue: Nuance de מוֹפֵת appliqué à la condition publique du psalmiste
  choice: Le psalmiste est présenté comme un signe extraordinaire et saisissant pour beaucoup, sans préciser si celui-ci est surtout inquiétant, merveilleux ou simplement étonnant.
  alternative: Comprendre le psalmiste soit comme un prodige positif, soit comme un avertissement de mauvais augure, soit simplement comme un objet d’étonnement.
  rationale: Le terme hébreu couvre plusieurs nuances. « Présage » préserve la tension du texte, et la note signale des traductions possibles plus familières sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre l’étonnement public suscité par le psalmiste et la protection assurée par Dieu est conservé. « Puissant refuge » évite le calque peu naturel « refuge de force ».
