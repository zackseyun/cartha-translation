  terminology: « Présage » et les alternatives de note (« prodige », « signe », « objet d’étonnement ») couvrent de manière appropriée le champ de מוֹפֵת. « Refuge » rend précisément מַחֲסִי. « Solide » exprime naturellement la notion de force attachée à עֹז sans introduire de précision doctrinale.
