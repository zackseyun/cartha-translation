  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: fr
  text: Même dans ma vieillesse, quand mes cheveux auront blanchi, ô Dieu, ne m’abandonne pas, jusqu’à ce que j’annonce ton bras[a] à la génération qui vient, ta puissance à tous ceux qui viendront[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ton bras » : en hébreu, le bras de Dieu représente sa puissance à l’œuvre.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « à toutes les générations futures ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Même
  rationale: Rend la continuité emphatique de la demande dans un français naturel.
- source_word: עַד זִקְנָה וְשֵׂיבָה
  choice: jusque dans la vieillesse et les cheveux blancs
  rationale: Conserve les deux images concrètes de l’hébreu tout en employant une formulation française intelligible.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Marque l’apostrophe directe et convient au registre digne de la prière.
- source_word: אַל תַּעַזְבֵנִי
  choice: ne m’abandonne pas
  rationale: Traduit directement la demande sans recourir à une tournure archaïque.
- source_word: עַד אַגִּיד
  choice: jusqu’à ce que j’annonce
  rationale: Exprime la durée de l’aide demandée en vue d’un témoignage public.
- source_word: זְרוֹעֲךָ
  choice: ton bras
  rationale: Maintient la métaphore hébraïque du bras comme manifestation active de la puissance divine.
- source_word: לְדוֹר
  choice: à la génération qui vient
  rationale: Désigne naturellement la génération suivante tout en restant proche de l’expression hébraïque.
- source_word: לְכָל יָבוֹא
  choice: à tous ceux qui viendront
  rationale: Préserve le sens collectif et l’orientation vers l’ensemble des personnes à venir.
- source_word: גְּבוּרָתֶךָ
  choice: ta puissance
  rationale: Rend la force ou la vaillance divine sans imposer exclusivement le sens de « hauts faits ».
theological_decisions:
- issue: Faut-il conserver la métaphore du bras de Dieu ou l’expliciter comme puissance ?
  choice: Conserver « ton bras » dans le texte principal.
  alternative: « ta force » ou « ta puissance »
  rationale: L’image corporelle exprime poétiquement l’action efficace de Dieu; la conserver respecte la texture théologique du psaume, tandis que « ta puissance » dans le membre parallèle en éclaire le sens.
- issue: Quelle est l’étendue du public futur dans לְדוֹר ... לְכָל יָבוֹא ?
  choice: Distinguer « la génération qui vient » de « tous ceux qui viendront ».
  alternative: « toutes les générations futures »
  rationale: Cette formulation préserve le mouvement du verset, qui va d’une génération proche à un public futur plus large, sans effacer l’ambiguïté collective de l’hébreu.
translation_notes:
  register: Français international moderne, poétique et digne sans archaïsme excessif. Le parallélisme hébreu et la métaphore du bras sont conservés; les répétitions servent la progression du verset.
