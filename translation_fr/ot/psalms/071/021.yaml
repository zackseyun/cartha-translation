source:
  edition: WLC
  text: תֶּ֤רֶב גְּֽדֻלָּתִ֗/י וְ/תִסֹּ֥ב תְּֽנַחֲמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/021.yaml
  text: May you increase my greatness and comfort me again[a][b][c].
translation:
  language: fr
  text: Puisses-tu accroître ma grandeur[a] et te tourner vers moi pour me consoler[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Tu accroîtras ma grandeur et tu te tourneras vers moi pour me consoler. » En poésie, les imparfaits hébreux peuvent exprimer aussi bien un souhait ou une prière qu’une action future. « Ma grandeur » peut également désigner mon honneur ou ma dignité.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « et tu te tourneras ». L’idée est probablement que Dieu se tourne de nouveau vers le psalmiste afin de le consoler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Puisses-tu accroître
  rationale: Le hifil de רבה signifie « rendre grand, accroître ». L’imparfait de deuxième personne peut ici exprimer un souhait ou une prière, ce que rend naturellement « Puisses-tu ».
- source_word: גְּדֻלָּתִי
  choice: ma grandeur
  rationale: Traduction directe de גְּדֻלָּה, qui peut désigner la grandeur, l’importance, l’honneur ou la dignité. « Ma grandeur » conserve l’amplitude et l’écho lexical de l’hébreu.
- source_word: וְתִסֹּב
  choice: et te tourner vers moi
  rationale: Le qal de סבב signifie littéralement « tourner ». Le complément « vers moi », implicite dans le contexte avant « me consoler », rend en français la direction probable sans effacer l’image hébraïque.
- source_word: תְּנַחֲמֵנִי
  choice: pour me consoler
  rationale: Le piel de נחם signifie ici « consoler, réconforter ». « Consoler » est naturel, digne et précis dans ce contexte de détresse.
theological_decisions:
- issue: Valeur modale des imparfaits hébreux
  choice: 'Les rendre comme une prière ou un souhait : « Puisses-tu accroître… et te tourner… »'
  alternative: 'Les comprendre comme l’expression d’une confiance future : « Tu accroîtras… et tu te tourneras… »'
  rationale: Dans cette poésie adressée directement à Dieu, les imparfaits peuvent avoir une nuance volitive, mais la lecture au futur demeure grammaticalement possible. Une note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La formulation conserve l’image du mouvement exprimée par סבב et l’ambiguïté entre prière et assurance future.
