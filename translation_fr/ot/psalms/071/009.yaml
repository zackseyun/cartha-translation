id: PSA.71.9
reference: Psalms 71:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: fr
  text: Ne me rejette pas[a] au temps de la vieillesse ; quand ma force s’épuise[b], ne m’abandonne pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne me jette pas au loin ». Le verbe hébreu peut évoquer le fait de jeter quelqu’un au loin ou de s’en débarrasser.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « quand ma force arrive à son terme ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ne me délaisse pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: ne me rejette pas
  rationale: Le hifil de שׁלך évoque l’action de jeter au loin ou de se débarrasser de quelqu’un. « Rejeter » conserve ici l’idée d’exclusion tout en restant naturel et digne dans une prière.
- source_word: לְעֵת זִקְנָה
  choice: au temps de la vieillesse
  rationale: Cette formulation rend explicitement עֵת, « temps », et זִקְנָה, « vieillesse », sans réduire l’expression à une simple indication d’âge.
- source_word: כִּכְלוֹת
  choice: quand … s’épuise
  rationale: L’infinitif construit de כלה précédé de כִּ introduit la circonstance temporelle où la force arrive à son terme. « S’épuise » exprime naturellement cette diminution progressive.
- source_word: כֹּחִי
  choice: ma force
  rationale: Le singulier respecte la forme hébraïque et désigne ici la vigueur ou la capacité physique qui décline avec l’âge.
- source_word: תַּעַזְבֵנִי
  choice: ne m’abandonne pas
  rationale: עזב peut signifier laisser ou abandonner. « Abandonner » convient au registre actuel d’une supplication et exprime clairement la crainte d’être laissé sans secours.
- source_word: אַל
  choice: ne … pas
  rationale: Avec l’inaccompli, אַל exprime une défense ou, comme ici, une demande négative pressante adressée à Dieu.
theological_decisions:
- issue: Nature de la supplication liée à la vieillesse et à la présence divine
  choice: Une demande directe pour que Dieu ne rejette ni n’abandonne le psalmiste lorsque sa force décline dans la vieillesse.
  alternative: Une plainte générale au sujet de la souffrance, sans accent particulier sur la vieillesse.
  rationale: Le texte relie explicitement la demande au temps de la vieillesse et à l’épuisement de la force. La traduction garde cette dépendance concrète envers Dieu sans ajouter de conclusion doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, simple et digne. « Au temps de la vieillesse » préserve la nuance temporelle explicite de l’hébreu ; « ma force s’épuise » reste naturel tout en conservant le singulier du texte source.
