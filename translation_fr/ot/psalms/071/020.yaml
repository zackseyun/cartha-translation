source:
  edition: WLC
  text: אֲשֶׁ֤ר הראית/נו צָר֥וֹת רַבּ֗וֹת וְ/רָ֫ע֥וֹת תָּשׁ֥וּב תחיי/נו וּֽ/מִ/תְּהֹמ֥וֹת הָ֝/אָ֗רֶץ תָּשׁ֥וּב תַּעֲלֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: fr
  text: Toi qui nous as fait voir[a] des détresses nombreuses et terribles[b], tu nous rendras de nouveau la vie ; des profondeurs de la terre[d], tu me feras de nouveau remonter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « nous as montré ». Le verbe hébreu est causatif : « nous as fait voir » ou « nous as montré ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « des détresses nombreuses et mauvaises ». Ici, « mauvaises » décrit leur caractère pénible ou désastreux, et non un mal moral.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu passe de « nous » à « me » : « tu nous rendras […] la vie […] tu me feras […] remonter ».'
    reason: textual_note
  - marker: d
    text: Les « profondeurs de la terre » peuvent représenter un abaissement extrême ou une mort imminente, tout en faisant aussi écho à la descente vers le séjour des morts.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Toi qui
  rationale: Introduit une proposition relative ayant Dieu pour antécédent implicite. « Toi qui » est naturel en français et conserve l’adresse directe.
- source_word: הראיתנו
  choice: nous as fait voir
  rationale: Le hifil de ראה a une valeur causative. Cette formulation en maintient explicitement la force, sans décider si Dieu cause directement les détresses ou fait qu’elles soient vécues et constatées.
- source_word: צָרוֹת רַבּוֹת וְרָעוֹת
  choice: des détresses nombreuses et terribles
  rationale: צָרוֹת désigne des situations d’oppression ou d’adversité ; les adjectifs féminins pluriels רַבּוֹת et רָעוֹת les qualifient comme nombreuses et mauvaises ou pénibles. « Terribles » exprime ici le caractère éprouvant, non un mal moral.
- source_word: תָּשׁוּב
  choice: de nouveau
  rationale: Avec les verbes qui suivent, שוב peut marquer la reprise de l’action. La répétition de « de nouveau » dans les deux membres conserve le parallélisme tout en évitant le français peu naturel « tu reviendras nous rendre la vie ».
- source_word: תחיינו
  choice: tu nous rendras la vie
  rationale: Le piel de חיה exprime ici le rétablissement de la vie ou de la vitalité. « Rendre la vie » reste accessible et laisse ouverte la portée littérale ou métaphorique.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: des profondeurs de la terre
  rationale: תְּהֹמוֹת évoque des profondeurs ou des abîmes. La traduction conserve l’image spatiale sans l’identifier explicitement au tombeau ou à la résurrection.
- source_word: תַּעֲלֵנִי
  choice: tu me feras remonter
  rationale: Le hifil de עלה signifie faire monter. Cette formulation maintient l’image d’une remontée depuis les profondeurs.
- source_word: נו ... ני
  choice: nous ... me
  rationale: Le texte massorétique passe de la première personne du pluriel à la première personne du singulier. Ce changement est conservé plutôt que régularisé.
theological_decisions:
- issue: 'La portée de רָעוֹת : mal moral ou détresses éprouvantes'
  choice: « terribles », qualifiant les détresses
  alternative: « mauvaises », « malheurs » ou « calamités »
  rationale: Dans ce contexte, le terme caractérise des expériences douloureuses. Cette traduction n’attribue pas à Dieu la commission d’un mal moral, tout en conservant l’affirmation difficile selon laquelle il a fait voir ces détresses.
- issue: La portée des « profondeurs de la terre »
  choice: Conserver l’image sans l’expliciter
  alternative: « du tombeau » ou une formulation explicitement résurrectionnelle
  rationale: L’image peut évoquer l’abaissement extrême, la proximité de la mort ou les profondeurs associées au séjour des morts. Le texte ne permet pas d’imposer une seule de ces lectures.
- issue: Le double emploi de שוב
  choice: Le rendre deux fois par « de nouveau »
  alternative: « tu reviendras » dans les deux membres
  rationale: Dans cette construction, שוב peut fonctionner avec le verbe suivant pour exprimer une action renouvelée. Ce choix préserve la répétition et n’ajoute pas nécessairement l’idée que Dieu s’était absenté.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. Le parallélisme est maintenu par la répétition de « de nouveau », et le passage de « nous » à « me » reste visible.
