  text: וַ֭/אֲנִי תָּמִ֣יד אֲיַחֵ֑ל וְ֝/הוֹסַפְתִּ֗י עַל כָּל תְּהִלָּתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/014.yaml
  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: fr
  text: Mais moi, j’espère sans cesse, et je multiplierai encore tes louanges.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent à la fois le contraste et l’insistance sur le sujet; « Mais moi » les restitue naturellement.
- source_word: תָּמִיד אֲיַחֵל
  choice: j’espère sans cesse
  rationale: Le piel de יחל exprime l’espérance ou l’attente confiante, tandis que תָּמִיד en souligne la continuité. Le présent français rend ici naturellement une disposition persistante et résolue.
- source_word: וְהוֹסַפְתִּי
  choice: et j’ajouterai encore
  rationale: יסף signifie ajouter ou accroître. « encore » explicite avec sobriété l’idée idiomatique de poursuivre ou d’augmenter la louange.
- source_word: עַל כָּל תְּהִלָּתֶךָ
  choice: à toutes les louanges que je t’adresse
  rationale: עַל après יסף indique ce à quoi quelque chose s’ajoute. Le singulier collectif תְּהִלָּה peut désigner la louange adressée à Dieu; la reformulation française évite l’expression ambiguë « tes louanges », qui pourrait suggérer des louanges prononcées par Dieu.
theological_decisions:
- issue: Sens du suffixe de deuxième personne dans תְּהִלָּתֶךָ
  choice: les louanges que je t’adresse
  alternative: tous tes sujets de louange / tous tes actes dignes de louange
  rationale: Le suffixe peut désigner la louange appartenant à Dieu ou qui lui est due, sans imposer nécessairement le sens plus interprétatif de ses actes dignes de louange. La note conserve cette autre possibilité.
translation_notes:
  register: Français moderne, international et digne. La première proposition reste concise et contrastive. La seconde privilégie une formulation idiomatique tout en signalant en note l’ambiguïté de תְּהִלָּתֶךָ.
