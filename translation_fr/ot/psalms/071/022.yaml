id: PSA.71.22
reference: Psalms 71:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם אֲנִ֤י אוֹדְ/ךָ֣ בִ/כְלִי נֶבֶל֮ אֲמִתְּ/ךָ֪ אֱלֹ֫הָ֥/י אֲזַמְּרָ֣ה לְ/ךָ֣ בְ/כִנּ֑וֹר קְ֝ד֗וֹשׁ יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: fr
  text: Moi aussi, je te louerai au son de la harpe pour ta fidélité[a], mon Dieu ; je jouerai pour toi de la lyre[b], Saint d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour ta vérité ». Le terme hébreu peut exprimer à la fois la vérité et la fidélité.
    reason: lexical_alternative
  - marker: b
    text: La différence exacte entre les deux instruments nommés ici (nével et kinnor) est incertaine ; ils sont traditionnellement rendus par « harpe » et « lyre ».
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: Exprime naturellement en français la continuité et l’accent portés par גַּם avec le pronom indépendant.
- source_word: אוֹדְךָ
  choice: je te louerai
  rationale: Dans ce contexte cultuel et musical, le hiphil de ידה désigne la louange, tout en gardant Dieu comme objet direct.
- source_word: בִכְלִי נֶבֶל
  choice: au son de la harpe
  rationale: נֶבֶל désigne un instrument à cordes dont l’identification exacte reste incertaine ; « harpe » est le terme traditionnel et intelligible. « Au son de » rend idiomatiquement l’accompagnement instrumental.
- source_word: אֲמִתְּךָ
  choice: pour ta fidélité
  rationale: אֱמֶת peut exprimer la vérité ou la fidélité. Ici, la louange de Dieu favorise le sens relationnel de fiabilité fidèle, sans exclure l’autre nuance, signalée en note.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Rend directement la forme possessive et l’adresse à Dieu.
- source_word: אֲזַמְּרָה לְךָ
  choice: je jouerai pour toi
  rationale: Le piel de זמר évoque l’exécution de musique ou le chant de louange. Avec la lyre explicitement mentionnée, « jouerai » donne un français naturel et conserve le parallélisme musical.
- source_word: בְכִנּוֹר
  choice: de la lyre
  rationale: כִּנּוֹר est traditionnellement rendu par « lyre », ce qui permet aussi de distinguer les deux termes instrumentaux hébreux.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Saint d’Israël
  rationale: Conserve le titre divin traditionnel sous forme d’apostrophe, sans ajouter une interjection absente de l’hébreu.
theological_decisions:
- issue: Sens de אֱמֶת appliqué à Dieu dans la louange
  choice: fidélité
  alternative: vérité
  rationale: « Fidélité » met en avant la fiabilité de Dieu dans le contexte de ses actes salvateurs. Comme le mot hébreu peut aussi signifier « vérité », cette ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le futur et le parallélisme des deux propositions sont conservés. « Au son de la harpe » et « jouerai […] de la lyre » évitent une syntaxe calquée tout en maintenant les deux instruments distincts.
