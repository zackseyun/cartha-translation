id: PSA.71.3
reference: Psalms 71:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֱיֵ֤ה לִ֨/י לְ/צ֥וּר מָע֡וֹן לָ/ב֗וֹא תָּמִ֗יד צִוִּ֥יתָ לְ/הוֹשִׁיעֵ֑/נִי כִּֽי סַלְעִ֖/י וּ/מְצוּדָתִ֣/י אָֽתָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: fr
  text: Sois pour moi un rocher qui me serve de refuge[a], où je puisse toujours me rendre ; tu as donné l’ordre de me sauver[b], car tu es mon roc et ma forteresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un rocher, une demeure », c’est-à-dire un rocher qui me serve de demeure.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu as commandé de me sauver » ; ou : « tu as décidé de me sauver ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Sois pour moi
  rationale: L’impératif exprime une demande directe adressée à Dieu. « Sois pour moi » conserve à la fois la force de la prière et la relation de bénéfice marquée par לִי.
- source_word: לְצוּר מָעוֹן
  choice: un rocher où trouver refuge
  rationale: צוּר désigne un rocher ou une masse rocheuse et sert ici de métaphore protectrice. מָעוֹן signifie normalement « demeure » ou « habitation », mais, associé au rocher et à la forteresse, il évoque un lieu protecteur où l’on peut demeurer. La traduction littérale possible est signalée en note.
- source_word: לָבוֹא תָּמִיד
  choice: où je puisse toujours venir
  rationale: L’infinitif בוא évoque le fait de venir ou d’entrer dans ce lieu, et תָּמִיד la continuité. Le subjonctif français convient au caractère suppliant de la demande.
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: tu as donné l’ordre de me sauver
  rationale: Le piel de צוה garde son sens fort de « commander, donner un ordre », tandis que l’infinitif suffixé signifie littéralement « me sauver ». Cette formulation est naturelle en français sans transformer l’ordre divin en simple intention.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande. « Car » convient au registre poétique tout en restant courant.
- source_word: סַלְעִי
  choice: mon roc
  rationale: סלע désigne un roc ou un escarpement rocheux. « Roc » le distingue du צוּר rendu plus haut par « rocher » et conserve l’image de stabilité et de protection.
- source_word: וּמְצוּדָתִי
  choice: et ma forteresse
  rationale: מְצוּדָה désigne une forteresse ou une place forte. « Forteresse » est clair, concret et fidèle à l’image défensive.
theological_decisions:
- issue: Faut-il atténuer צִוִּיתָ לְהוֹשִׁיעֵנִי en exprimant seulement une décision divine, ou conserver la notion explicite d’ordre ?
  choice: tu as donné l’ordre de me sauver
  alternative: tu as décidé de me sauver
  rationale: L’hébreu emploie explicitement le verbe « commander ». La traduction retenue préserve la vigueur de cette affirmation sans préciser à qui l’ordre est adressé ni l’inscrire dans un système doctrinal particulier. La note conserve une lecture contextuelle plus souple.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est préservé, avec « rocher », « roc » et « forteresse ». La ponctuation rend lisibles les trois mouvements du verset sans supprimer l’ambiguïté de la construction hébraïque.
