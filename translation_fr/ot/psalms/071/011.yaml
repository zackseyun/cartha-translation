source:
  edition: WLC
  text: לֵ֭/אמֹר אֱלֹהִ֣ים עֲזָב֑/וֹ רִֽדְפ֥וּ וְ֝/תִפְשׂ֗וּ/הוּ כִּי אֵ֥ין מַצִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/011.yaml
  text: saying[a], “God has forsaken him; pursue and seize him, for there is no one to rescue him.”
translation:
  language: fr
  text: 'Ils disent : « Dieu l’a abandonné[a] ! Poursuivez-le et saisissez-le, car il n’y a personne pour le délivrer. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « délaissé ».'
    reason: Alternative lexicale possible pour עזב, qui peut exprimer le fait de quitter, de délaisser ou d’abandonner.
lexical_decisions:
- source_word: לֵאמֹר
  choice: 'Ils disent :'
  rationale: L’infinitif construit de אמר introduit ici les paroles des adversaires. En français courant, « Ils disent » restitue naturellement cette fonction, le sujet étant fourni par le contexte immédiat du psaume.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le nom désigne ici le Dieu unique, comme le confirme le verbe au singulier.
- source_word: עֲזָבוֹ
  choice: l’a abandonné
  rationale: Le parfait qal avec suffixe exprime une action tenue pour accomplie et toujours pertinente dans la raillerie des ennemis. « Abandonné » est fort, naturel en français moderne et n’affirme pas que leur jugement soit vrai.
- source_word: רִדְפוּ
  choice: Poursuivez-le
  rationale: L’impératif pluriel de רדף commande de se lancer à la poursuite de la personne vulnérable, sans ajouter l’idée plus particulière de persécution.
- source_word: וְתִפְשׂוּהוּ
  choice: et saisissez-le
  rationale: L’impératif pluriel de תפשׂ avec suffixe signifie prendre ou saisir. « Saisissez-le » garde le caractère direct et concret de l’ordre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison donnée pour poursuivre et saisir le psalmiste.
- source_word: אֵין מַצִּיל
  choice: il n’y a personne pour le délivrer
  rationale: אֵין nie l’existence, tandis que le participe hiphil מַצִּיל désigne quelqu’un qui délivre ou arrache au danger. Cette formulation française conserve la référence personnelle à un libérateur absent.
theological_decisions:
- issue: La déclaration des ennemis au sujet de l’abandon par Dieu
  choice: Présenter « Dieu l’a abandonné » explicitement comme une citation des adversaires
  alternative: Formuler la phrase comme une affirmation directe du narrateur
  rationale: Le verset rapporte la raillerie des ennemis ; il ne confirme pas théologiquement que Dieu a réellement abandonné le psalmiste. Les guillemets et l’introduction « Ils disent » préservent cette tension.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs brefs rendent la violence de la parole hostile. « Délivrer » conserve le vocabulaire biblique de la délivrance tout en restant largement compréhensible.
