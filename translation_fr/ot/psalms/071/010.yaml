source:
  edition: WLC
  text: כִּֽי אָמְר֣וּ אוֹיְבַ֣/י לִ֑/י וְ/שֹׁמְרֵ֥י נַ֝פְשִׁ֗/י נוֹעֲצ֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/010.yaml
  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: fr
  text: 'Car mes ennemis parlent contre moi,

    et ceux qui guettent ma vie[a] tiennent conseil ensemble[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «ceux qui sont à l’affût de ma vie» ou «ceux qui en veulent à ma vie».
    reason: lexical_alternative
  - marker: b
    text: Ou «se concertent»; dans ce contexte hostile, le verbe peut aussi se traduire par «complotent».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la supplication précédente et conserve naturellement la valeur explicative de la conjonction.
- source_word: אָמְרוּ
  choice: parlent
  rationale: Dans le discours poétique, l’accompli hébreu peut décrire des paroles hostiles présentes ou persistantes; le présent français convient au contexte.
- source_word: אֹיְבַי לִי
  choice: mes ennemis parlent contre moi
  rationale: «Mes ennemis» rend directement le nom avec suffixe; dans ce contexte hostile, לִי indique que leurs paroles sont dirigées contre le psalmiste.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: et ceux qui guettent ma vie
  rationale: שׁמר désigne ici une surveillance hostile plutôt qu’une garde protectrice, et נֶפֶשׁ renvoie à la vie ou à la personne menacée.
- source_word: נוֹעֲצוּ יַחְדָּו
  choice: tiennent conseil ensemble
  rationale: Cette formulation rend la délibération commune sans imposer dans le texte principal le sens plus fort de «comploter», bien que le contexte soit hostile.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est conservé sur deux lignes. «Guettent ma vie» exprime clairement la menace tout en maintenant l’image de la surveillance, et «tiennent conseil ensemble» préserve la nuance entre simple délibération et complot hostile.
