base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: fr
  text: Dans ta justice[a], délivre-moi et fais-moi échapper ; tends l’oreille vers moi et sauve-moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par ta justice ». Le mot traduit par « justice » peut aussi être rendu par « droiture ».'
    reason: alternative syntaxique et nuance lexicale
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: Dans ta justice
  rationale: La préposition ב peut exprimer le cadre, le fondement ou le moyen. « Dans ta justice » conserve la formulation compacte de l’hébreu et laisse entendre que l’appel repose sur le caractère juste et fidèle de Dieu.
- source_word: תַּצִּילֵנִי
  choice: délivre-moi
  rationale: Le hiphil de נצל désigne couramment l’action d’arracher au danger ou de délivrer. « Délivre-moi » est naturel et direct en français.
- source_word: וּתְפַלְּטֵנִי
  choice: et fais-moi échapper
  rationale: Le piel de פלט exprime le fait de permettre à quelqu’un d’échapper ou de le mettre hors de danger. Cette formulation distingue les deux verbes hébreux sans effacer leur parallélisme.
- source_word: הַטֵּה
  choice: tends
  rationale: Avec « oreille », l’impératif de נטה forme une image d’attention bien rendue en français par l’expression idiomatique « tendre l’oreille ».
- source_word: אָזְנְךָ
  choice: l’oreille
  rationale: Le nom concret est conservé afin de préserver l’image poétique hébraïque.
- source_word: וְהוֹשִׁיעֵנִי
  choice: et sauve-moi
  rationale: Le hiphil de ישׁע signifie sauver ou secourir. « Sauve-moi » maintient à la fois le sens immédiat de délivrance et la portée plus large du verbe.
theological_decisions:
- issue: Sens de צְדָקָה dans l’appel adressé à Dieu
  choice: justice
  alternative: fidélité à ce qui est juste ; « Par ta justice » pour la valeur instrumentale de ב
  rationale: En français moderne, « justice » exprime naturellement la droiture de Dieu dans ce contexte, sans limiter nécessairement le terme à une décision judiciaire. La note préserve l’ambiguïté de la préposition et la richesse morale du nom hébreu.
translation_notes:
  register: Français international moderne, poétique et digne. « Tends l’oreille » conserve l’image hébraïque tout en restant idiomatique ; les trois verbes de salut sont distingués autant que le permet un français naturel.
