id: PSA.71.15
reference: Psalms 71:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: fr
  text: Ma bouche racontera ta justice[a] et ton salut tout au long du jour, car je n’en connais pas le nombre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta droiture » ou « tes actes justes ».
    reason: lexical_alternative
  - marker: b
    text: Le psalmiste présente les manifestations de la justice et du salut de Dieu comme trop nombreuses pour être comptées.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Ma bouche
  rationale: Conserve l’image hébraïque qui met en avant la bouche comme instrument de la louange, plutôt que de simplifier en « je ».
- source_word: יְסַפֵּר
  choice: racontera
  rationale: Le piel de ספר exprime ici l’action de raconter ou d’énumérer les œuvres de Dieu; « racontera » garde aussi un lien naturel avec l’idée de nombre à la fin du verset.
- source_word: צִדְקָתֶךָ
  choice: ta justice
  rationale: « Justice » rend naturellement le nom abstrait צדקה en français et peut inclure à la fois la rectitude de Dieu et son action juste et fidèle, sans réduire le terme aux seuls actes.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Formulation française actuelle exprimant une durée continue pendant toute la journée.
- source_word: תְּשׁוּעָתֶךָ
  choice: ton salut
  rationale: « Salut » est l’équivalent français courant de תשועה et conserve l’ampleur théologique du terme; « délivrance » serait possible mais plus contextuellement restreint.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement la raison de cette proclamation continuelle.
- source_word: לֹא יָדַעְתִּי
  choice: je n’en connais pas
  rationale: Le parfait hébreu exprime ici l’absence présente de connaissance; le présent français communique ce sens avec naturel.
- source_word: סְפֹרוֹת
  choice: le nombre
  rationale: Le pluriel lié à la racine ספר évoque les nombres ou le compte. La tournure idiomatique « je n’en connais pas le nombre » indique que la justice salvatrice de Dieu dépasse toute énumération.
theological_decisions:
- issue: Faut-il comprendre צִדְקָתֶךָ comme un attribut abstrait ou comme les actes justes et sauveurs de Dieu?
  choice: « ta justice » dans le texte principal
  alternative: « tes actes justes » ou « ta droiture »
  rationale: Le singulier abstrait hébreu favorise « justice », tout en permettant que cette justice se manifeste concrètement dans les actes fidèles et sauveurs de Dieu. La note préserve les autres nuances sans trancher excessivement.
- issue: À quoi renvoie l’expression finale concernant le nombre?
  choice: À la justice et au salut de Dieu envisagés dans leurs manifestations innombrables
  alternative: À un « nombre » indéterminé sans explicitation des actes
  rationale: Le contexte et le jeu sur ספר suggèrent que le psalmiste ne peut compter toutes les manifestations de la justice et du salut divins, mais cette explicitation reste en note afin de ne pas ajouter « actes » au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’image concrète de la bouche, le nom abstrait « justice » et le lien lexical entre raconter et compter.
