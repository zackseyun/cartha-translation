  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: fr
  text: En paix, tout à la fois, je me couche et je dors[a], car toi seul, Yahweh[b], tu me fais habiter en sécurité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En paix, ensemble, je me couche et je dors. » L’adverbe hébreu peut signifier « ensemble » ou « tout à la fois »; il associe ici étroitement le fait de se coucher et celui de dormir.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre lecture possible : « car toi, Yahweh, tu me fais habiter seul en sécurité ». Le mot hébreu traduit par « seul » peut décrire la manière dont le psalmiste habite, bien que le texte principal le rattache à Yahweh.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: En paix
  rationale: שָׁלוֹם exprime ici la paix, le bien-être et l’intégrité d’une vie préservée. « En paix » est naturel en français et convient au contraste du psaume entre détresse et repos confiant.
- source_word: יַחְדָּו
  choice: je me couche et je m’endors
  rationale: L’adverbe signifie littéralement « ensemble » ou « tout à la fois ». En français, son effet est rendu idiomatiquement par l’enchaînement étroit des deux verbes; une note conserve les autres possibilités lexicales.
- source_word: אֶשְׁכְּבָה
  choice: je me couche
  rationale: L’imparfait hébreu peut exprimer ici la volonté ou l’assurance. Le présent français convient à une déclaration confiante faite au moment du coucher, sans exclure cette nuance.
- source_word: וְאִישָׁן
  choice: et je m’endors
  rationale: Le qal de ישׁן signifie dormir. « Je m’endors » forme en français une progression naturelle après « je me couche », tout en exprimant le passage effectif au sommeil.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle le psalmiste peut se reposer en paix.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu plutôt que de lui substituer un titre.
- source_word: לְבָדָד
  choice: toi seul
  rationale: L’adverbe « seul » est rattaché dans le texte principal au sujet divin, lecture naturelle qui souligne que Yahweh est l’unique auteur de la sécurité. L’autre rattachement grammatical possible est signalé en note.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: בֶּטַח désigne un état de sûreté ou de confiance. « En sécurité » s’accorde naturellement avec « habiter ».
- source_word: תּוֹשִׁיבֵנִי
  choice: tu me fais habiter
  rationale: Le hiphil de ישׁב est causatif. « Tu me fais habiter » en conserve la force tout en restant clair et naturel.
theological_decisions:
- issue: Rattachement et portée de לְבָדָד
  choice: '« Toi seul » : Yahweh seul fait habiter le psalmiste en sécurité.'
  alternative: '« Tu me fais habiter seul en sécurité » : le psalmiste habite à l’écart ou sans compagnie.'
  rationale: L’ordre des mots et le sens global favorisent le rattachement de « seul » à Yahweh, mais le rattachement à la situation du psalmiste demeure grammaticalement possible; la note préserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le présent donne à la confession un caractère immédiat et confiant. Le nom divin est translittéré « Yahweh ». Les répétitions pronominales de « toi seul » et « tu » conservent l’insistance de l’hébreu sans lourdeur excessive.
