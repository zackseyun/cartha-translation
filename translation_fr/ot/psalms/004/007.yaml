source:
  edition: WLC
  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: fr
  text: Tu as mis dans mon cœur une joie plus grande qu’au temps où leur blé et leur vin nouveau ont augmenté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « depuis le temps où leur blé et leur vin nouveau ont augmenté ». L’hébreu est généralement compris comme une comparaison : la joie donnée par Dieu dépasse celle que procure l’abondance matérielle.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Tu as mis
  rationale: Le qal accompli, 2e personne du masculin singulier, s’adresse à Dieu. « Tu as mis » exprime naturellement en français l’action accomplie dont l’effet demeure.
- source_word: שִׂמְחָה
  choice: joie
  rationale: Le nom désigne la joie ou l’allégresse; « joie » est le terme courant et convient à l’expérience intérieure décrite.
- source_word: בְלִבִּי
  choice: dans mon cœur
  rationale: לֵב désigne ici le cœur comme siège de la vie intérieure; cette formulation reste fidèle et idiomatique.
- source_word: מֵעֵת
  choice: plus de… qu’au temps où
  rationale: La préposition מִן avec עֵת est comprise comme introduisant le terme d’une comparaison. La tournure française rend cette valeur tout en gardant l’image temporelle du texte hébreu.
- source_word: דְּגָנָם
  choice: leur blé
  rationale: דָּגָן désigne les céréales ou le grain. Dans ce contexte poétique de récolte, « blé » est naturel en français, tout en représentant les céréales de façon générique.
- source_word: וְתִירוֹשָׁם
  choice: et leur vin nouveau
  rationale: תִּירוֹשׁ désigne le vin nouveau, produit de la vendange; la traduction conserve l’imagerie agricole.
- source_word: רָבּוּ
  choice: abondent
  rationale: Le verbe רבה signifie devenir nombreux, augmenter. « Abondent » exprime ici naturellement l’accroissement des produits de la récolte.
theological_decisions:
- issue: Syntaxe comparative du verset
  choice: La joie que Dieu met dans le cœur du psalmiste dépasse celle qui accompagne l’abondance du blé et du vin nouveau.
  alternative: « Depuis que leur blé et leur vin nouveau ont augmenté, tu as mis de la joie dans mon cœur. »
  rationale: מֵעֵת est le plus souvent compris comme introduisant le point de comparaison. Cette lecture convient au contraste entre la joie intérieure reçue de Dieu et la prospérité matérielle, sans dissimuler la possibilité d’une lecture temporelle plus littérale.
translation_notes:
  register: Français moderne, international et digne. Tutoiement de Dieu conforme à l’usage biblique français courant. La phrase conserve l’image du cœur, du blé et du vin nouveau, ainsi que l’ambiguïté syntaxique dans une note.
