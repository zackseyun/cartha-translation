  text: רִגְז֗וּ וְֽ/אַל תֶּ֫חֱטָ֥אוּ אִמְר֣וּ בִ֭/לְבַבְ/כֶם עַֽל מִשְׁכַּבְ/כֶ֗ם וְ/דֹ֣מּוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: fr
  text: Tremblez[a], et ne péchez pas ; parlez dans votre cœur, sur votre lit, et gardez le silence[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mettez-vous en colère, mais ne péchez pas. » Le verbe hébreu peut exprimer l’agitation, le tremblement ou la colère.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « restez tranquilles ». Le verbe hébreu peut évoquer aussi bien le silence que l’immobilité.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רִגְזוּ
  choice: Tremblez
  rationale: Le verbe רגז peut exprimer le tremblement, l’agitation ou la colère. « Tremblez » conserve ici l’idée d’un profond bouleversement sans la réduire à la seule colère.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: et ne péchez pas
  rationale: Traduction directe et naturelle de l’interdiction exprimée avec חטא.
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: parlez en votre cœur
  rationale: Cette formulation garde le sens verbal de אמר et l’image hébraïque du cœur comme siège de la réflexion intérieure. Le singulier distributif est naturel en français avec le pronom pluriel « vous ».
- source_word: עַל מִשְׁכַּבְכֶם
  choice: sur votre lit
  rationale: Le singulier distributif français rend naturellement la couche propre à chacun des destinataires.
- source_word: וְדֹמּוּ
  choice: puis gardez le silence
  rationale: דמם peut désigner le silence ou l’immobilité. Dans cette suite d’exhortations à l’examen intérieur, « gardez le silence » est clair et digne, tandis que l’autre nuance est signalée en note.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens exact de ce terme liturgique reste incertain ; sa translittération traditionnelle évite une interprétation conjecturale.
theological_decisions:
- issue: Sens de רגז dans l’exhortation morale
  choice: Appel à trembler ou à être profondément troublé sans pécher
  alternative: « Mettez-vous en colère, mais ne péchez pas »
  rationale: Le champ sémantique de רגז permet les deux lectures. Le contexte d’examen intérieur et de silence favorise « Tremblez », mais la lecture liée à la colère, importante dans l’histoire de la réception, demeure possible et figure donc en note.
- issue: Nature de la parole dans le cœur
  choice: Conserver l’image d’une parole intérieure
  alternative: « Réfléchissez en vous-mêmes » ou « méditez »
  rationale: Le texte emploie explicitement le verbe « dire/parler ». La formulation retenue préserve l’image et son ambiguïté plutôt que d’en imposer une paraphrase interprétative.
translation_notes:
  register: Français international moderne, sobre et poétique. Le verset conserve l’image hébraïque de la parole « en votre cœur » ainsi que le terme liturgique traditionnel « Sélah ». Les singuliers « votre cœur » et « votre lit » ont une valeur distributive naturelle en français.
