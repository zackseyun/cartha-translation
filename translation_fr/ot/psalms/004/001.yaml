id: PSA.4.1
reference: Psalms 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: fr
  text: Quand je t’appelle, réponds-moi, Dieu de ma justice[a] ! Dans la détresse, tu m’as mis au large[b]. Fais-moi grâce et entends ma prière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon Dieu juste » ou « Dieu qui me rend justice ». L’hébreu dit littéralement « Dieu de ma justice ».
    reason: alternative_reading
  - marker: b
    text: 'Ou « tu m’as soulagé ». L’image hébraïque est spatiale : Dieu donne de l’espace au psalmiste au sortir de la détresse, conçue comme un lieu étroit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Quand je t’appelle
  rationale: La préposition ב avec l’infinitif construit et le suffixe de première personne a ici une valeur temporelle. « Appeler » reste proche de קרא sans renforcer inutilement l’émotion comme le ferait « crier vers ».
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Le verbe ענה signifie couramment « répondre » dans ce type d’adresse priante.
- source_word: אֱלֹהֵי צִדְקִי
  choice: Dieu de ma justice
  rationale: 'Cette formulation reproduit la chaîne construite hébraïque et préserve son ouverture : Dieu peut être compris comme la source de la justice du psalmiste ou comme celui qui lui rend justice.'
- source_word: בַּצָּר
  choice: Dans la détresse
  rationale: צַר évoque la détresse et, en arrière-plan, l’étroitesse; ce choix convient au registre poétique et prépare le contraste spatial avec « au large ».
- source_word: הִרְחַבְתָּ לִּי
  choice: tu m’as mis au large
  rationale: Le hiphil de רחב exprime l’action d’élargir ou de donner de l’espace. « Mettre au large » conserve naturellement en français l’image d’une délivrance hors de l’étroitesse.
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: חנן signifie fondamentalement accorder faveur ou grâce; cette traduction est précise et naturelle dans une prière.
- source_word: וּשְׁמַע
  choice: et entends
  rationale: שׁמע signifie « entendre », avec ici la nuance d’une écoute attentive et favorable.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: תְּפִלָּה est le terme ordinaire désignant la prière.
theological_decisions:
- issue: Sens de « Dieu de ma justice »
  choice: Conserver la tournure formelle « Dieu de ma justice » dans le texte principal.
  alternative: « mon Dieu juste » ou « Dieu qui me rend justice »
  rationale: L’état construit hébreu n’impose pas une seule interprétation. La formulation retenue maintient la tension entre Dieu comme source ou fondement de la justice du psalmiste et Dieu comme celui qui le justifie ou lui rend justice.
translation_notes:
  register: Français international moderne, digne et poétique. Le tutoiement correspond à l’adresse directe à Dieu courante dans les traductions bibliques françaises. L’expression « mis au large » conserve le contraste poétique entre l’étroitesse de la détresse et l’espace de la délivrance.
