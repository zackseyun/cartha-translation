id: PSA.4.2
reference: Psalms 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּנֵ֥י אִ֡ישׁ עַד מֶ֬ה כְבוֹדִ֣/י לִ֭/כְלִמָּה תֶּאֱהָב֣וּ/ן רִ֑יק תְּבַקְשׁ֖וּ כָזָ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/002.yaml
  text: Sons of men[a], how long will my honor be turned into shame? Will you love emptiness and seek falsehood? Selah
translation:
  language: fr
  text: Vous, les hommes, jusqu’à quand mon honneur[a] sera-t-il changé en honte ? Aimerez-vous le vide et rechercherez-vous le mensonge ? Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma gloire ». Le mot hébreu peut désigner l’honneur, la gloire ou le poids d’une personne ; ici, il semble évoquer la dignité du psalmiste exposée à la honte publique.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי אִישׁ
  choice: Vous, les hommes
  rationale: L’expression hébraïque, littéralement « fils d’homme(s) », interpelle des adversaires masculins. « Vous, les hommes » conserve l’adresse directe tout en évitant en français moderne le calque peu naturel « fils des hommes ».
- source_word: עַד מֶה
  choice: jusqu’à quand
  rationale: Rend naturellement la question de protestation temporelle propre à la poésie hébraïque.
- source_word: כְבוֹדִי
  choice: mon honneur
  rationale: כָּבוֹד peut désigner la gloire, l’honneur ou le poids social. Dans ce contexte de honte publique, « honneur » exprime clairement la dignité et la réputation du psalmiste sans exclure la nuance de gloire.
- source_word: לִכְלִמָּה
  choice: sera-t-il changé en honte
  rationale: La préposition לְ introduit ici un résultat. Le français exige d’expliciter la relation verbale implicite; le passif évite de préciser plus que l’hébreu l’agent de l’humiliation.
- source_word: תֶּאֱהָבוּן
  choice: aimerez-vous
  rationale: L’imparfait hébreu de deuxième personne du pluriel, dans cette réprimande interrogative, peut exprimer une conduite persistante; le futur interrogatif français en garde la force rhétorique.
- source_word: רִיק
  choice: le vide
  rationale: Le terme évoque ce qui est vide, vain, futile ou sans consistance. « Le vide » préserve l’image et le parallélisme abstrait sans imposer une interprétation plus étroite.
- source_word: תְּבַקְשׁוּ
  choice: rechercherez-vous
  rationale: Rend la quête active exprimée par בקשׁ et forme un parallèle naturel avec « aimerez-vous ».
- source_word: כָזָב
  choice: le mensonge
  rationale: Le singulier abstrait correspond à l’hébreu et maintient le parallélisme avec « le vide »; il peut couvrir aussi bien la fausseté que la tromperie.
- source_word: סֶלָה
  choice: Sèla
  rationale: Translittération française d’un terme liturgique ou musical dont la fonction exacte demeure incertaine.
theological_decisions:
- issue: Référent de « mon honneur »
  choice: La formulation ne précise pas s’il s’agit de la dignité personnelle ou royale du psalmiste, ni d’un honneur reçu de Dieu.
  alternative: « ma gloire » ou « l’honneur que Dieu m’a donné »
  rationale: L’hébreu autorise un sens large d’honneur ou de gloire. Le contexte suggère une dignité publiquement bafouée, mais ne permet pas de réduire le référent à une interprétation théologique particulière.
- issue: Agent de la transformation en honte
  choice: Emploi du passif « sera-t-il changé »
  alternative: « changerez-vous mon honneur en honte »
  rationale: La proposition hébraïque ne comporte pas de verbe explicite. Le passif français exprime le résultat sans attribuer grammaticalement l’action aux interlocuteurs au-delà de ce que dit formellement le texte.
translation_notes:
  register: Français international moderne, poétique et digne. L’adresse « Vous, les hommes » reste directe sans conserver un calque hébraïque artificiel. « Le vide » et « le mensonge » maintiennent le parallélisme abstrait. La graphie « Sèla » signale une translittération adaptée au français sans prétendre déterminer la fonction du terme.
