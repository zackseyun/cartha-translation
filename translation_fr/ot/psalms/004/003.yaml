source:
  edition: WLC
  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: fr
  text: Sachez que Yahweh a mis à part pour lui-même celui qui lui est fidèle[a] ; Yahweh m’entend quand je l’appelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a distingué pour lui-même son fidèle ». Le mot hébreu peut souligner la piété ou la fidélité loyale dans le cadre de l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Yahweh m’entendra quand je l’appellerai ». Le verbe hébreu peut exprimer une réalité habituelle au présent ou une assurance concernant l’avenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: Sachez
  rationale: L’impératif pluriel appelle les destinataires à reconnaître un fait. En français, la conjonction initiale peut rester implicite sans perte de sens.
- source_word: כִּי
  choice: que
  rationale: Introduit naturellement en français le contenu de ce que les destinataires doivent savoir.
- source_word: הִפְלָה
  choice: a mis à part
  rationale: Le hifil de פלא exprime ici le fait de distinguer ou de réserver spécialement quelqu’un, comme l’indique aussi לֹו, « pour lui ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: חָסִיד
  choice: celui qui lui est fidèle
  rationale: חָסִיד désigne une personne caractérisée par la fidélité, notamment dans le cadre de la relation d’alliance. Cette formulation conserve le singulier et reste naturelle en français moderne.
- source_word: לוֹ
  choice: pour lui
  rationale: Rend la préposition et son suffixe sans imposer une réflexivité plus forte que celle explicitement marquée en hébreu ; le référent est Yahweh.
- source_word: יִשְׁמַע
  choice: m’entend
  rationale: L’imparfait hébreu peut exprimer une action habituelle ou assurée. Le présent français traduit ici la confiance actuelle du psalmiste, sans exclure la nuance future signalée en note.
- source_word: בְּקָרְאִי אֵלָיו
  choice: quand je l’appelle
  rationale: L’infinitif construit précédé de בְּ exprime la circonstance temporelle ; le pronom objet rend idiomatiquement en français l’appel adressé à Yahweh.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Sens de חָסִיד
  choice: celui qui lui est fidèle
  alternative: l’homme pieux ; son fidèle ; celui qui est attaché à l’alliance
  rationale: Le terme associe piété et fidélité loyale. Le choix retenu est compréhensible et maintient l’idée relationnelle sans enfermer le mot dans une formulation confessionnelle particulière.
- issue: Valeur temporelle de יִשְׁמַע
  choice: m’entend
  alternative: m’entendra
  rationale: La forme peut décrire une réalité habituelle ou exprimer une assurance tournée vers l’avenir. Le présent convient à la déclaration de confiance, tandis que la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier hébreu est conservé, ainsi que l’ambiguïté entre fidélité, loyauté et piété. La ponctuation fait ressortir les deux affirmations parallèles.
