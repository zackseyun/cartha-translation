  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינ֗וֹת מִזְמ֥וֹר לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/000.yaml
  text: 'For the choirmaster: with stringed instruments. A psalm of David[a].'
translation:
  language: fr
  text: Au chef de chœur, avec instruments à cordes. Psaume de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; l’expression hébraïque peut indiquer l’auteur, l’association ou la dédicace.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les suscriptions des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Chef de chœur » est une formulation française claire, actuelle et adaptée au contexte liturgique.
- source_word: בִּנְגִינוֹת
  choice: avec instruments à cordes
  rationale: Le nom renvoie ici à la musique produite par des instruments à cordes. Cette formulation conserve la valeur de l’indication musicale sans préciser indûment la manière de jouer.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est le terme français consacré et exact pour cette désignation de genre musical et poétique.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut indiquer l’auteur, l’appartenance, l’association ou la dédicace. « De David » maintient en français une certaine largeur de sens sans imposer une interprétation unique.
theological_decisions:
- issue: Nature du lien exprimé par לְדָוִד dans la suscription
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu ne détermine pas à lui seul si David est l’auteur, la personne associée au psaume ou son destinataire. La traduction retenue préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève conserve la forme traditionnelle d’une suscription musicale. Le marqueur [a] est placé immédiatement après « David », son véritable référent.
