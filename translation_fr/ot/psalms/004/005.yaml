id: PSA.4.5
reference: Psalms 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: fr
  text: Offrez des sacrifices de justice[a] et mettez votre confiance en Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des sacrifices justes », ou « des sacrifices offerts avec droiture ».
    reason: Alternative lexicale et interprétative pour la construction זִבְחֵי צֶדֶק.
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Offrez des sacrifices
  rationale: L’impératif pluriel suivi d’un nom de même racine désigne l’action sacrificielle. « Offrez des sacrifices » est naturel en français et conserve le sens cultuel, même si la répétition étymologique de l’hébreu ne peut être reproduite élégamment.
- source_word: צֶדֶק
  choice: de justice
  rationale: Le nom peut exprimer la justice, la droiture ou ce qui est conforme à l’ordre juste. « Sacrifices de justice » préserve la formulation condensée et son ambiguïté entre sacrifices justes, culte conforme et offrande issue d’une conduite droite.
- source_word: וּבִטְחוּ
  choice: et mettez votre confiance
  rationale: L’impératif pluriel de בטח appelle à se fier à quelqu’un. Cette tournure est idiomatique et digne en français, tout en rendant explicitement l’exhortation.
- source_word: אֶל
  choice: en
  rationale: Avec le verbe exprimant la confiance, le français emploie naturellement « confiance en », bien que la préposition hébraïque ait fondamentalement une orientation vers.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » translittère le nom divin plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de זִבְחֵי צֶדֶק
  choice: Conserver « sacrifices de justice », sans préciser si leur justice tient surtout à la disposition morale, à la conformité cultuelle ou aux deux.
  alternative: « sacrifices justes » ou « sacrifices offerts avec droiture »
  rationale: La construction hébraïque permet plusieurs nuances complémentaires. La formulation retenue maintient la tension entre justice éthique et justesse du culte au lieu de trancher.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif pluriel est conservé. « Yahvé » rend explicitement le nom divin.
