  text: רַבִּ֥ים אֹמְרִים֮ מִֽי יַרְאֵ֪/נ֫וּ ט֥וֹב נְֽסָ/ה עָ֭לֵי/נוּ א֨וֹר פָּנֶ֬י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/006.yaml
  text: Many are saying[a], “Who will show us good? Lift up the light of your face upon us[c][b], O Yahweh.”
translation:
  language: fr
  text: 'Beaucoup disent : « Qui nous fera voir le bien[a] ? Élève sur nous la lumière de ton visage[b], Yahvé[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui nous montrera le bien ? » Le verbe hébreu est causatif : « faire voir » ou « montrer ».'
    reason: lexical_alternative
  - marker: b
    text: « La lumière de ton visage » est une image poétique de la faveur et de la présence bienveillante de Dieu.
    reason: lexical_alternative
  - marker: c
    text: Hébreu YHWH, traditionnellement rendu par « le Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Beaucoup disent
  rationale: רַבִּים est employé substantivement, et le participe אֹמְרִים décrit une parole présente ou caractéristique. La formulation française est concise et naturelle.
- source_word: מִי יַרְאֵנוּ טוֹב
  choice: Qui nous fera voir le bien ?
  rationale: Le hiphil de ראה a une valeur causative, « faire voir » ou « montrer ». « Le bien » conserve la portée large de טוֹב sans la réduire au bonheur matériel ou à la prospérité.
- source_word: נְסָה עָלֵינוּ
  choice: Fais lever sur nous
  rationale: L’impératif exprime l’appel à élever ou déployer sur les fidèles la lumière du visage divin. « Fais lever sur nous » conserve l’image poétique et convient à la lumière, sans la paraphraser par « accorde-nous ».
- source_word: אוֹר פָּנֶיךָ
  choice: la lumière de ton visage
  rationale: La traduction garde l’anthropomorphisme hébreu et sa poésie. « Visage » est plus courant aujourd’hui que « face » et n’explicite pas à tort l’image par « faveur » ou « présence ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » transcrit le nom divin YHWH au lieu de lui substituer le titre « le Seigneur ».
theological_decisions:
- issue: Le référent de « le bien »
  choice: Conserver l’expression générale « le bien »
  alternative: le bonheur ; la prospérité ; quelque bien
  rationale: טוֹב demeure volontairement large et peut englober faveur, bonheur et bien-être. Le contexte ne justifie pas de limiter son sens.
- issue: L’image de la lumière du visage divin
  choice: Maintenir « la lumière de ton visage »
  alternative: ta faveur ; la lumière de ta présence
  rationale: L’image associe le visage lumineux de Dieu à sa faveur et à sa présence bienveillante, mais le texte ne remplace pas la métaphore par son interprétation.
- issue: Le nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie le nom propre divin. Sa transcription préserve ce fait textuel sans substituer un titre.
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation maintient la demande adressée à Yahvé à l’intérieur de la parole citée. « Fais lever » conserve l’image hébraïque tout en évoquant naturellement le lever d’une lumière.
