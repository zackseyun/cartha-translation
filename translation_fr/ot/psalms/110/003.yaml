  text: עַמְּ/ךָ֣ נְדָבֹת֮ בְּ/י֪וֹם חֵ֫ילֶ֥/ךָ בְּֽ/הַדְרֵי קֹ֭דֶשׁ מֵ/רֶ֣חֶם מִשְׁחָ֑ר לְ֝/ךָ֗ טַ֣ל יַלְדֻתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: fr
  text: Ton peuple s’offrira de bon gré[a] au jour de ta puissance[b], dans une sainte splendeur[c]. Du sein de l’aurore, à toi appartient la rosée de ta jeunesse[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ton peuple sera des offrandes volontaires ». Le pluriel hébreu « offrandes volontaires » décrit ici poétiquement le peuple qui se présente de son plein gré.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « au jour de ta force » ou « au jour de ton armée ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans une parure sacrée », « dans les splendeurs de la sainteté » ou peut-être « dans des vêtements sacrés ».'
    reason: lexical_alternative
  - marker: d
    text: La fin du verset est difficile. Elle peut aussi signifier que les jeunes hommes du roi viennent à lui, frais ou nombreux comme la rosée née de l’aurore ; elle peut également évoquer la fraîcheur de sa jeunesse.
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: עַם désigne normalement le peuple. Le contexte guerrier lui donne une nuance martiale sans justifier de réduire le terme à « armée » ou « troupes ».
- source_word: נְדָבֹת
  choice: s’offrira de bon gré
  rationale: Le nom pluriel évoque littéralement des offrandes volontaires. Employé avec « ton peuple », il décrit poétiquement une présentation volontaire de soi ; la tournure verbale est naturelle en français.
- source_word: בְּיוֹם חֵילֶךָ
  choice: au jour où tu déploieras ta puissance
  rationale: חַיִל peut désigner la force, la puissance ou l’armée. Cette formulation conserve l’idée d’une manifestation décisive de puissance tout en évitant de trancher en faveur du seul sens militaire.
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: dans une sainte splendeur
  rationale: La phrase peut évoquer la magnificence propre à la sainteté, une parure sacrée ou des vêtements saints. « Sainte splendeur » garde l’image poétique sans la préciser abusivement.
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: du sein de l’aurore
  rationale: La traduction préserve l’image de l’aurore comme matrice ou origine. « Sein » est poétique et naturel ici, tout en correspondant au sens métaphorique de רֶחֶם.
- source_word: לְךָ טַל יַלְדֻתֶיךָ
  choice: à toi appartient la rosée de ta jeunesse
  rationale: L’hébreu est très condensé. La formulation française explicite sobrement la relation possessive suggérée par לְךָ, tout en maintenant l’expression énigmatique « rosée de ta jeunesse ».
theological_decisions:
- issue: 'Sens du dernier membre : « à toi appartient la rosée de ta jeunesse »'
  choice: Conserver l’image poétique sans déterminer si elle désigne la fraîcheur juvénile du roi ou ses jeunes hommes comparés à la rosée.
  alternative: Y voir explicitement un engendrement du roi, ou traduire directement « tes jeunes hommes viennent à toi comme la rosée ».
  rationale: Le texte massorétique est notoirement difficile et comprimé. La traduction principale maintient son ambiguïté et ne lui impose ni une lecture dogmatique ultérieure ni une interprétation militaire exclusive.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe au roi. Les métaphores de l’offrande, de l’aurore et de la rosée sont conservées, tandis que les notes signalent les principales ambiguïtés lexicales et syntaxiques.
