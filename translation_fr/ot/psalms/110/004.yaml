base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: fr
  text: 'Yahweh a juré et ne changera pas d’avis : « Tu es prêtre pour toujours, à la manière de Melchisédek. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible, plus littérale : « selon ma parole / mon décret, Melchisédek ». L’expression hébraïque est difficile ; certains la comprennent comme « à la manière de Melchisédek ».'
    reason: Lecture alternative d’une expression hébraïque syntaxiquement difficile.
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: a juré
  rationale: Le parfait présente un serment divin solennel et accompli. « A juré » est direct, naturel et fidèle à la force du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin de l’hébreu et préserve sa référence d’alliance.
- source_word: וְלֹא יִנָּחֵם
  choice: et ne changera pas d’avis
  rationale: Le niphal de נחם indique ici que Yahweh ne reviendra pas sur son serment. Cette formulation est claire en français moderne, sans suggérer une repentance morale.
- source_word: אַתָּה כֹהֵן
  choice: Tu es prêtre
  rationale: La formulation conserve l’adresse directe et désigne simplement la fonction sacerdotale, sans détermination excessive.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française courante et digne pour une durée permanente dans ce contexte.
- source_word: עַל דִּבְרָתִי
  choice: à la manière de
  rationale: La locution hébraïque est difficile. Dans ce contexte, cette traduction exprime naturellement un modèle sacerdotal associé à Melchisédek, tout en signalant en note la lecture plus littérale.
- source_word: מַלְכִּי־צֶדֶק
  choice: Melchisédek
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
theological_decisions:
- issue: Interprétation de עַל דִּבְרָתִי מַלְכִּי־צֶדֶק
  choice: à la manière de Melchisédek
  alternative: selon ma parole / mon décret, Melchisédek
  rationale: La syntaxe hébraïque demeure difficile et permet plusieurs analyses. Le texte principal retient la compréhension d’un modèle associé à Melchisédek, bien attestée dans la réception ancienne, tandis que la note préserve la possibilité d’une référence à la parole ou au décret divin.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme solennel du serment est conservé, ainsi que l’adresse directe. La note rend visible l’ambiguïté réelle de l’hébreu sans alourdir le verset.
