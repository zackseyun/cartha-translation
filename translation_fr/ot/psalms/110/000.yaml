  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר נְאֻ֤ם יְהוָ֨ה לַֽ/אדֹנִ֗/י שֵׁ֥ב לִֽ/ימִינִ֑/י עַד אָשִׁ֥ית אֹ֝יְבֶ֗י/ךָ הֲדֹ֣ם לְ/רַגְלֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: fr
  text: 'De David[a]. Psaume.


    Déclaration de YHWH à mon seigneur[b] :

    « Assieds-toi à ma droite

    jusqu’à ce que je fasse de tes ennemis

    un marchepied pour tes pieds[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David » ou « Au sujet de David ». La préposition hébraïque peut exprimer l’auteur, l’appartenance, la destination ou le sujet.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu distingue le nom divin YHWH de l’expression « mon seigneur » (adoni).
    reason: lexical_alternative
  - marker: c
    text: L’expression peut être rendue de manière plus interprétative par « sous tes pieds ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד (ləDavid)
  choice: De David
  rationale: La préposition לְ peut indiquer l’auteur, l’appartenance, la destination ou le sujet. « De David » conserve une formulation traditionnelle et concise sans exclure entièrement les autres nuances, signalées en note.
- source_word: נְאֻם (nə’um)
  choice: Déclaration
  rationale: Le nom introduit une parole solennelle, souvent divine. « Déclaration » rend cette force mieux que le simple verbe « dit », tout en restant naturel.
- source_word: יְהוָה (YHWH)
  choice: YHWH
  rationale: La transcription des quatre consonnes préserve le nom divin propre et le distingue explicitement de אֲדֹנִי, « mon seigneur ».
- source_word: לַאדֹנִי (la’doni)
  choice: à mon seigneur
  rationale: Le suffixe de première personne est rendu par « mon », et la minuscule évite d’imposer par la typographie une identification théologique que l’hébreu laisse à l’interprétation.
- source_word: הֲדֹם לְרַגְלֶיךָ (hadom ləraglékha)
  choice: un marchepied pour tes pieds
  rationale: Cette traduction conserve l’image concrète et la construction hébraïque plutôt que de la paraphraser par « sous tes pieds ».
theological_decisions:
- issue: Identité de « mon seigneur »
  choice: Employer « mon seigneur » avec une minuscule
  alternative: « mon Seigneur » avec une majuscule
  rationale: Le texte distingue YHWH de la personne à qui il s’adresse, mais ce verset seul ne précise pas explicitement l’identité de cette personne. La minuscule préserve cette ouverture interprétative.
- issue: Rapport entre le titre et David
  choice: « De David » accompagné d’une note
  alternative: « Pour David » ou « Au sujet de David »
  rationale: La formule hébraïque est brève et sémantiquement ouverte. La traduction principale suit l’usage le plus courant sans transformer une possibilité en certitude absolue.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes fait ressortir le caractère poétique. « YHWH » maintient clairement la distinction lexicale du texte hébreu, tandis que « mon seigneur » reste naturel et n’impose pas une conclusion christologique ou non christologique.
