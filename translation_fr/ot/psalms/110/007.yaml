source:
  edition: WLC
  text: מִ֭/נַּחַל בַּ/דֶּ֣רֶךְ יִשְׁתֶּ֑ה עַל כֵּ֝֗ן יָרִ֥ים רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/007.yaml
  text: He will drink from the brook by the way[b][a]; therefore he will lift up his head.
translation:
  language: fr
  text: Il boira de l’eau du torrent[a] en chemin ; c’est pourquoi il relèvera la tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au ruisseau » ou « dans un oued ». Le mot hébreu peut désigner un torrent, un ruisseau, le lit d’un cours d’eau ou un cours d’eau saisonnier.
    reason: lexical_alternative
  - marker: b
    text: L’expression « relever la tête » peut évoquer un regain de force, l’assurance ou l’élévation.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנַּחַל
  choice: au torrent
  rationale: נחל désigne un torrent, son lit, ou un cours d’eau parfois saisonnier. « Au torrent » restitue naturellement en français l’idée de boire de l’eau provenant du torrent, tout en conservant l’image géographique.
- source_word: בַּדֶּרֶךְ
  choice: en chemin
  rationale: דרך peut désigner le chemin, la route ou le parcours. « En chemin » est idiomatique en français moderne et suggère ici une halte ou un rafraîchissement au cours de la marche.
- source_word: יִשְׁתֶּה
  choice: il boira
  rationale: L’inaccompli hébreu peut exprimer une action future ou habituelle. Le futur convient à la suite des actions royales décrites dans le psaume sans exclure entièrement la portée caractéristique de la scène.
- source_word: עַל־כֵּן
  choice: c’est pourquoi
  rationale: Cette locution introduit normalement une conséquence. « C’est pourquoi » rend clairement le lien entre le fait de boire et le relèvement de la tête.
- source_word: יָרִים רֹאשׁ
  choice: il relèvera la tête
  rationale: La traduction conserve l’image hébraïque, qui peut évoquer le regain de force, l’assurance, la victoire ou l’élévation, sans la réduire à une seule interprétation.
theological_decisions:
- issue: Référent des verbes masculins singuliers dans ce psaume royal
  choice: Conserver le sujet implicite sous la forme « il », sans identifier explicitement son référent.
  alternative: Préciser qu’il s’agit du roi davidique, du roi-prêtre auquel le psaume s’adresse, ou du Messie selon la lecture canonique ultérieure.
  rationale: L’hébreu emploie simplement un sujet masculin singulier. La formulation française maintient cette indétermination et laisse ouvertes les lectures royale et messianique.
- issue: Portée de l’expression « relever la tête »
  choice: Maintenir l’image sans l’expliquer dans le corps du texte.
  alternative: Paraphraser par « reprendra des forces », « sera victorieux » ou « sera exalté ».
  rationale: L’expression poétique peut réunir plusieurs nuances — force renouvelée, assurance, victoire ou exaltation — qu’une paraphrase unique trancherait indûment.
translation_notes:
  register: Français international moderne, poétique et digne. « En chemin » évite le tour moins naturel « sur le chemin », tandis que « relèvera la tête » préserve l’image et son ambiguïté théologique.
