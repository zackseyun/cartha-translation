id: PSA.110.5
reference: Psalms 110:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: fr
  text: Le Seigneur est à ta droite[a] ; il écrasera des rois au jour de sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le seigneur à ta droite » peut désigner le roi ou Messie auquel le psaume s’adresse ; d’autres comprennent ici « le Seigneur » comme Dieu intervenant pour juger.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Le mot est vocalisé אֲדֹנָי (Adonaï), titre rendu naturellement par « le Seigneur ». La majuscule suit l’usage biblique français tout en évitant de le confondre avec le nom divin YHWH, absent de ce verset.
- source_word: עַל
  choice: à
  rationale: Avec « ta droite », la préposition exprime ici la position à côté de quelqu’un ; « à ta droite » est l’expression française naturelle.
- source_word: יְמִינְךָ
  choice: ta droite
  rationale: L’expression hébraïque signifie littéralement « ta main droite ». En français, « à ta droite » conserve clairement l’image de position, de soutien et de puissance.
- source_word: מָחַץ
  choice: il écrasera
  rationale: 'Le verbe désigne une défaite violente et décisive : frapper, broyer ou écraser. Le futur convient à la séquence prophétique de jugement du psaume, bien que la forme hébraïque soit un accompli.'
- source_word: בְּיוֹם
  choice: au jour de
  rationale: Cette formulation garde l’expression temporelle solennelle de l’hébreu et reste idiomatique en français biblique moderne.
- source_word: אַפּוֹ
  choice: sa colère
  rationale: Le nom signifie littéralement « nez » mais désigne idiomatiquement la colère. « Sa colère » est clair, intense et naturel en français contemporain.
- source_word: מְלָכִים
  choice: des rois
  rationale: Le pluriel hébreu désigne directement des rois, cibles du jugement.
theological_decisions:
- issue: Référent du « Seigneur » en Psaumes 110.5
  choice: Conserver le titre « Le Seigneur » sans identifier explicitement son référent.
  alternative: Comprendre soit Dieu agissant dans le jugement, soit le seigneur placé à la droite de l’interlocuteur — le roi ou Messie auquel le psaume s’adresse.
  rationale: L’hébreu emploie אֲדֹנָי et non le nom YHWH. La syntaxe et le contexte permettent des lectures différentes ; le texte principal et la note préservent donc cette tension sans la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au suffixe hébreu singulier. « Au jour de sa colère » conserve la solennité de l’expression source sans archaïsme excessif.
