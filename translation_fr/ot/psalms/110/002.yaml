  text: מַטֵּֽה עֻזְּ/ךָ֗ יִשְׁלַ֣ח יְ֭הוָה מִ/צִּיּ֑וֹן רְ֝דֵ֗ה בְּ/קֶ֣רֶב אֹיְבֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/002.yaml
  text: 'Yahweh sends forth from Zion the scepter of your strength: rule in the midst of your enemies[a][b][c].'
translation:
  language: fr
  text: 'Yahweh envoie[b] de Sion le sceptre[a] de ta puissance : règne au milieu de tes ennemis[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bâton de ta puissance » ou « verge de ta puissance ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « étend »; le verbe peut aussi être rendu au futur : « enverra ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « règne parmi tes ennemis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: sceptre
  rationale: Le nom peut désigner un bâton, une verge ou un sceptre. Dans ce psaume royal, « sceptre » exprime naturellement l’autorité du roi tout en conservant l’image concrète.
- source_word: עֻזְּךָ
  choice: ta puissance
  rationale: עֹז désigne la force ou la puissance. « Ta puissance » s’associe avec naturel au sceptre comme symbole et manifestation de l’autorité puissante du destinataire.
- source_word: יִשְׁלַח
  choice: étend
  rationale: Le verbe signifie d’abord « envoyer » ou « faire partir ». Avec le sceptre pour objet et « de Sion » comme point de départ, « étend » rend naturellement en français l’image d’une autorité dont Yahweh déploie la portée, sans effacer le sens concret d’envoi, signalé en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom propre présent dans l’hébreu.
- source_word: מִצִּיּוֹן
  choice: de Sion
  rationale: Rendu direct du complément indiquant le point de départ, avec maintien du nom propre Sion.
- source_word: רְדֵה
  choice: domine
  rationale: L’impératif de רדה exprime l’exercice de la domination ou du gouvernement. « Domine » conserve la vigueur de l’ordre et convient au registre royal.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Cette locution signifie littéralement « au milieu de » et présente le roi exerçant son autorité alors qu’il est entouré d’ennemis.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Rendu direct du pluriel avec suffixe masculin singulier, correspondant au roi interpellé.
theological_decisions:
- issue: Imagerie royale et portée messianique du Psaume 110
  choice: Conserver le langage royal du texte sans expliciter dans le verset une identification messianique ultérieure.
  alternative: Employer une formulation explicitement messianique ou, à l’inverse, atténuer l’image de l’intronisation royale.
  rationale: L’hébreu présente un souverain auquel Yahweh accorde l’autorité et ordonne de dominer. La formulation retenue laisse subsister à la fois le cadre royal immédiat et la portée messianique reconnue dans la lecture canonique chrétienne, sans résoudre cette tension par surtraduction.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase place « De Sion » en tête pour rendre clairement le point de départ. « Sceptre » maintient l’imagerie royale; « domine » garde la force de l’impératif. Les variantes lexicales authentiques sont indiquées sans alourdir le texte principal.
