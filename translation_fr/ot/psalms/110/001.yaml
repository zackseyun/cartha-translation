  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר נְאֻ֤ם יְהוָ֨ה לַֽ/אדֹנִ֗/י שֵׁ֥ב לִֽ/ימִינִ֑/י עַד אָשִׁ֥ית אֹ֝יְבֶ֗י/ךָ הֲדֹ֣ם לְ/רַגְלֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: fr
  text: 'De David. Psaume. Yahweh déclare à mon seigneur[a] : « Assieds-toi à ma droite jusqu’à ce que je fasse de tes ennemis un marchepied pour tes pieds[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu distingue Yahweh, le nom divin, de « mon seigneur », un titre honorifique. On peut aussi traduire ce dernier par « mon maître ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu porte « un marchepied pour tes pieds ». Certaines traductions rendent l’image de manière plus interprétative : « sous tes pieds ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance ou l’association dans les titres des psaumes. « De David » conserve cette relative ambiguïté tout en étant naturel en français.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Équivalent français standard de cette indication de genre.
- source_word: נְאֻם
  choice: déclare
  rationale: Le nom introduit une parole solennelle, souvent divine. « Déclare » rend mieux cette force oraculaire que le simple « dit », sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans l’hébreu et le distingue du titre אֲדֹנִי.
- source_word: לַאדֹנִי
  choice: à mon seigneur
  rationale: אֲדֹנִי signifie « mon seigneur/maître ». La minuscule évite d’inscrire typographiquement une interprétation christologique ultérieure dans le texte hébreu.
- source_word: שֵׁב
  choice: Assieds-toi
  rationale: Impératif naturel en français du verbe « s’asseoir » ; le contexte de la droite divine communique l’idée d’intronisation.
- source_word: לִימִינִי
  choice: à ma droite
  rationale: Expression française idiomatique qui conserve l’image biblique de la place d’honneur et d’autorité.
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Rend naturellement le marqueur temporel עַד devant une proposition verbale, sans préciser au-delà de l’hébreu ce qui advient ensuite.
- source_word: אָשִׁית
  choice: je fasse de
  rationale: Le verbe signifie « placer/établir ». Avec « marchepied », cette construction française exprime naturellement le résultat visé.
- source_word: אֹיְבֶיךָ
  choice: tes ennemis
  rationale: Traduction directe du nom pluriel muni du suffixe masculin singulier.
- source_word: הֲדֹם
  choice: un marchepied
  rationale: Équivalent courant qui conserve l’image royale de victoire et de soumission.
- source_word: לְרַגְלֶיךָ
  choice: pour tes pieds
  rationale: Conserve la valeur explicite de la préposition לְ plutôt que de l’interpréter directement par « sous ».
theological_decisions:
- issue: Distinction entre יְהוָה et אֲדֹנִי dans un verset à forte portée messianique
  choice: « Yahweh » pour le nom divin et « mon seigneur » pour le titre
  alternative: « Le Seigneur déclare à mon Seigneur »
  rationale: L’hébreu emploie deux termes distincts. Les rendre différemment assure la transparence lexicale et préserve la tension théologique du verset.
- issue: Identification de « mon seigneur »
  choice: Minuscule à « seigneur »
  alternative: « mon Seigneur » avec majuscule
  rationale: Le texte hébreu présente un titre honorifique, non un nom propre. La majuscule imposerait au niveau typographique une identification théologique que le verset ne formule pas explicitement.
- issue: Portée temporelle de עַד
  choice: « jusqu’à ce que » sans inférence supplémentaire
  alternative: Formulation qui laisserait entendre que la session à droite prend nécessairement fin ensuite
  rationale: La conjonction marque la période conduisant à l’action annoncée, mais ne tranche pas à elle seule la question de ce qui suit.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la brièveté solennelle de l’hébreu, le nom divin Yahweh, l’image du marchepied et l’ambiguïté du titre « mon seigneur ». Tous les appels de notes présents dans le texte correspondent aux notes fournies.
