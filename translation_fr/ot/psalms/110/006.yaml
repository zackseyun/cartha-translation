  text: יָדִ֣ין בַּ֭/גּוֹיִם מָלֵ֣א גְוִיּ֑וֹת מָ֥חַץ רֹ֝֗אשׁ עַל אֶ֥רֶץ רַבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: fr
  text: Il jugera parmi les nations ; il les remplira de cadavres[a] ; il écrasera la tête sur une vaste terre[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est concis et n’indique pas explicitement ce qui sera rempli ; on peut traduire simplement : « il remplira de cadavres ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il écrasera un chef » ; le mot hébreu est au singulier et signifie littéralement « tête », mais il peut aussi avoir un sens collectif.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « sur la vaste terre » ; אֶרֶץ peut désigner une terre, un pays ou la terre entière. Une autre compréhension possible est : « le chef d’un vaste pays ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: Il rendra justice
  rationale: Le qal inaccompli de דין exprime ici naturellement une action future. « Rendre justice » conserve la dimension judiciaire sans réduire le verbe au seul châtiment militaire.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne les nations, et בְּ situe ici l'exercice du jugement en leur sein ; « parmi » évite de transformer implicitement la préposition en « contre ».
- source_word: מָלֵא גְוִיּוֹת
  choice: il les remplira de cadavres
  rationale: La proposition hébraïque est très concise et n'exprime pas l'objet de « remplir ». Le pronom « les », renvoyant aux nations ou à leurs territoires, rend la phrase française intelligible tout en signalant cette supplétion en note.
- source_word: גְוִיּוֹת
  choice: cadavres
  rationale: Le mot désigne des corps morts. « Cadavres » restitue sans atténuation l'image violente du champ de bataille.
- source_word: מָחַץ
  choice: il écrasera
  rationale: Le verbe évoque un coup violent qui brise ou écrase ; ce choix est actuel, direct et adapté au contexte guerrier.
- source_word: רֹאשׁ
  choice: la tête
  rationale: Le singulier concret de l'hébreu est conservé, sans décider s'il désigne collectivement des têtes, un chef ou un ennemi suprême.
- source_word: עַל אֶרֶץ רַבָּה
  choice: sur une vaste terre
  rationale: עַל est rendu par « sur », tandis que אֶרֶץ רַבָּה demeure singulier et exprime une grande étendue. Cette formulation préserve la possibilité qu'il s'agisse du lieu de l'action plutôt que du domaine d'un dirigeant.
theological_decisions:
- issue: Référent et portée du singulier רֹאשׁ dans un psaume royal et messianique
  choice: Conserver l'expression concrète au singulier « la tête » sans identifier son référent.
  alternative: « un chef », « des têtes » au sens collectif, ou un ennemi suprême unique
  rationale: Le texte hébreu n'identifie pas explicitement cette « tête ». La traduction préserve donc l'ambiguïté et n'impose aucune lecture christologique ou eschatologique particulière.
- issue: Portée géographique de אֶרֶץ
  choice: Employer « terre » dans le texte, sans expliciter s'il s'agit d'un territoire ou du monde entier.
  alternative: « pays » ou « la terre entière »
  rationale: אֶרֶץ peut désigner une terre, un pays ou la terre au sens large. « Une vaste terre » maintient le singulier et laisse ouverte l'étendue exacte.
- issue: Rapport syntaxique entre רֹאשׁ et עַל אֶרֶץ רַבָּה
  choice: Comprendre עַל אֶרֶץ רַבָּה comme indiquant le lieu ou l'étendue où la tête est écrasée.
  alternative: « le chef d'un vaste pays », en comprenant עַל comme une relation d'autorité
  rationale: La lecture locative suit plus directement la préposition עַל et évite d'introduire « chef » dans le texte principal, mais la syntaxe poétique concise permet aussi une lecture où la tête est celle qui domine un vaste pays.
translation_notes:
  register: Français international moderne, solennel mais direct. Le parallélisme des trois verbes au futur est conservé. L'image guerrière n'est pas adoucie, et les ambiguïtés portant sur l'objet de « remplir », le référent de « tête » et la portée de « terre » sont maintenues ou signalées en notes.
