id: PSA.25.8
reference: Psalms 25:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: טוֹב וְ/יָשָׁ֥ר יְהוָ֑ה עַל כֵּ֤ן יוֹרֶ֖ה חַטָּאִ֣ים בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: fr
  text: 'Yahweh est bon et droit ;

    c’est pourquoi il enseigne aux pécheurs le chemin[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il guide les pécheurs sur le chemin ». Le verbe peut signifier « enseigner », « instruire » ou « diriger ».'
    reason: Alternative lexicale et syntaxique permettant de préserver les nuances pédagogique et directionnelle de ירה avec בַּדָּרֶךְ.
lexical_decisions:
- source_word: טוֹב
  choice: bon
  rationale: L’adjectif exprime ici la bonté morale de Yahweh. « Bon » est direct, naturel et forme un parallèle clair avec « droit ».
- source_word: וְיָשָׁר
  choice: et droit
  rationale: יָשָׁר évoque la rectitude morale. « Droit » conserve cette image et convient au registre poétique du psaume.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette translittération rend le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: La locution introduit la conséquence logique de la bonté et de la droiture de Yahweh ; « c’est pourquoi » est idiomatique en français actuel.
- source_word: יוֹרֶה
  choice: il enseigne
  rationale: Au hiphil, ירה peut signifier enseigner, instruire ou diriger. « Enseigne » convient au contexte sapientiel tout en laissant la note signaler la nuance directionnelle.
- source_word: חַטָּאִים
  choice: aux pécheurs
  rationale: Le substantif pluriel désigne directement ceux qui pèchent. « Pécheurs » préserve sans l’atténuer la catégorie morale du texte.
- source_word: בַּדָּרֶךְ
  choice: le chemin
  rationale: Avec le verbe ירה, le français naturel permet « enseigner le chemin à quelqu’un ». Ce choix conserve la métaphore de la conduite sans ajouter « bon » ou « droit », absents de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Yahvé
  rationale: « Yahweh » conserve le nom personnel présent dans le texte hébreu sans lui substituer un titre.
- issue: Sens de יוֹרֶה ... בַּדָּרֶךְ
  choice: il enseigne aux pécheurs le chemin
  alternative: il guide les pécheurs sur le chemin
  rationale: La formulation principale met en avant la valeur pédagogique de ירה, tandis que l’alternative conserve sa nuance possible de direction. Le texte n’ajoute pas explicitement que ce chemin est « le bon chemin ».
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé sur deux lignes, avec une syntaxe naturelle. Aucun qualificatif interprétatif tel que « bon chemin » n’est ajouté.
