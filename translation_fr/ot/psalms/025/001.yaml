id: PSA.25.1
reference: Psalms 25:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: fr
  text: 'De David.


    Vers toi, Yahweh, j’élève mon âme.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie » ou « tout mon être ». Le mot hébreu traduit par « âme » (néfèsh) peut désigner la personne tout entière, et non seulement sa dimension immatérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, la préposition לְ devant le nom de David marque une relation qui peut évoquer l’auteur, le destinataire ou plus largement une association. « De David » reste naturel en français et préserve mieux cette ambiguïté que « par David » ou « pour David ».
- source_word: אֵלֶיךָ
  choice: Vers toi
  rationale: La préposition אֶל indique ici la direction. Avec « j’élève mon âme », « vers toi » rend naturellement en français le mouvement métaphorique exprimé par l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה. « Yahweh » le transcrit au lieu de lui substituer un titre.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner l’âme, la vie, la personne ou le moi tout entier. « Mon âme » conserve l’image hébraïque et sa portée dévotionnelle, tandis qu’une note signale l’étendue du sens.
- source_word: אֶשָּׂא
  choice: j’élève
  rationale: Cette forme de נָשָׂא signifie « je lève » ou « j’élève ». « J’élève mon âme » restitue l’image de l’hébreu dans un français actuel et digne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le verset emploie le Tétragramme comme nom propre. Le rendre par « Yahweh » préserve le nom personnel présent dans le texte plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et poétique. La formulation conserve le parallélisme implicite et l’image traditionnelle sans archaïsmes. Le titre reste volontairement bref et ambigu.
