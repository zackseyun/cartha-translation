source:
  edition: WLC
  text: דְּרָכֶ֣י/ךָ יְ֭הוָה הוֹדִיעֵ֑/נִי אֹ֖רְחוֹתֶ֣י/ךָ לַמְּדֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/004.yaml
  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: fr
  text: Fais-moi connaître tes voies[a], Yahweh ; enseigne-moi tes sentiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « fais que je connaisse » ; traduction traditionnelle : « montre-moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: tes voies
  rationale: דֶּרֶךְ désigne une voie ou un chemin et, dans ce contexte poétique, peut évoquer la manière d’agir de Dieu. « Tes voies » conserve la métaphore et sa portée théologique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération française usuelle « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: הוֹדִיעֵנִי
  choice: Fais-moi connaître
  rationale: La forme causative de ידע signifie littéralement « fais que je connaisse ». « Fais-moi connaître » en restitue directement le sens dans un français naturel.
- source_word: אֹרְחוֹתֶיךָ
  choice: tes sentiers
  rationale: אֹרַח désigne un sentier ou une piste. « Sentiers » maintient le parallélisme poétique avec « voies » sans confondre les deux termes.
- source_word: לַמְּדֵנִי
  choice: enseigne-moi
  rationale: L’impératif intensif de למד avec suffixe de première personne signifie directement « enseigne-moi ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie ici le nom divin lui-même. « Yahweh » préserve ce nom personnel, tandis que « le SEIGNEUR » correspond à une substitution traditionnelle par un titre.
translation_notes:
  register: Français moderne, digne et accessible. L’impératif « Fais-moi connaître » préserve la valeur causative de l’hébreu ; « voies » et « sentiers » conservent le parallélisme imagé du verset.
