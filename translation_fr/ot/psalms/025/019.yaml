  text: רְאֵֽה אוֹיְבַ֥/י כִּי רָ֑בּוּ וְ/שִׂנְאַ֖ת חָמָ֣ס שְׂנֵאֽוּ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/019.yaml
  text: Look at my enemies[a], for they are many, and they hate me with violent hatred.
translation:
  language: fr
  text: 'Regarde mes ennemis : ils sont nombreux, et ils me haïssent d’une haine violente.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et d’une haine de violence ils me haïssent ». L’expression hébraïque souligne le caractère violent et impitoyable de leur haine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Regarde
  rationale: Impératif masculin singulier de ראה, adressé à Dieu dans la prière. « Regarde » conserve naturellement la force de la supplication.
- source_word: אוֹיְבַי
  choice: mes ennemis
  rationale: Nom avec suffixe de première personne du singulier ; traduction directe, claire et courante.
- source_word: כִּי
  choice: ':'
  rationale: La conjonction introduit ici la raison de la demande. En français, les deux-points rendent cette relation avec plus de naturel qu’un « car » placé immédiatement après l’impératif.
- source_word: רָבּוּ
  choice: ils sont nombreux
  rationale: Le parfait qal de רבה décrit ici le grand nombre des ennemis ; le présent exprime naturellement la situation persistante de la lamentation.
- source_word: וְשִׂנְאַת חָמָס
  choice: d’une haine violente
  rationale: L’expression nominale associe la haine à חָמָס, qui peut évoquer la violence, la brutalité ou l’injustice. Cette formulation préserve le caractère violent de leur haine sans surinterpréter.
- source_word: שְׂנֵאוּנִי
  choice: ils me haïssent
  rationale: Le parfait qal avec suffixe objet de première personne est rendu au présent pour exprimer l’hostilité durable dans ce contexte de lamentation.
