  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: fr
  text: Quel est l’homme qui craint Yahweh ? Il lui enseignera le chemin qu’il doit choisir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chemin qu’il choisit » ou « le chemin qu’il choisira ». L’hébreu permet plusieurs nuances pour le dernier verbe ; selon l’analyse syntaxique, son sujet peut aussi être compris comme Yahweh.
    reason: Ambiguïté lexicale, aspectuelle et syntaxique du verbe יִבְחָר.
lexical_decisions:
- source_word: מִי זֶה
  choice: Qui est
  rationale: L’interrogatif suivi du démonstratif forme ici une question rhétorique idiomatique. « Qui est » en restitue naturellement la force sans traduire lourdement le démonstratif.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le nom hébreu est au masculin singulier et désigne ici un individu représentatif. « L’homme » conserve cette forme générique dans un registre biblique naturel.
- source_word: יְרֵא יְהוָה
  choice: qui craint Yahweh
  rationale: Dans le langage sapientiel et psalmique, ירא exprime une crainte révérencielle. « Craint » préserve à la fois la force du terme et sa portée spirituelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: יוֹרֶנּוּ
  choice: Il lui enseignera
  rationale: Le hiphil de ירה peut signifier enseigner, instruire ou diriger. « Enseignera » est naturel en français et conserve l’idée de transmission et d’orientation; le suffixe objet renvoie à l’homme qui craint Yahweh.
- source_word: בְּדֶרֶךְ
  choice: le chemin
  rationale: דרך désigne aussi bien un chemin qu’une manière de vivre. « Le chemin » maintient cette métaphore sans alourdir la phrase.
- source_word: יִבְחָר
  choice: qu’il doit choisir
  rationale: L’imparfait hébreu autorise plusieurs nuances. Cette formulation exprime ici le choix à faire dans le cadre de l’enseignement reçu, tout en signalant les autres possibilités dans la note.
theological_decisions:
- issue: Identité du sujet de « Il lui enseignera »
  choice: Yahweh est le sujet implicite qui enseigne l’homme qui le craint.
  alternative: Un sujet indéfini enseigne cet homme, ou l’homme s’instruit lui-même.
  rationale: Même si le sujet du verbe n’est pas exprimé, Yahweh, nommé immédiatement auparavant, constitue l’antécédent contextuel le plus naturel. La majuscule à « Il » rend cette lecture claire sans répéter le nom.
- issue: Sujet et nuance du verbe final יִבְחָר
  choice: Le chemin que l’homme doit choisir.
  alternative: Le chemin que l’homme choisit ou choisira; le chemin que Yahweh choisit pour lui.
  rationale: La syntaxe et l’aspect imperfectif permettent plusieurs nuances. Le texte principal retient la lecture exhortative la plus cohérente avec l’enseignement divin, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste proche du parallélisme hébreu, avec un vocabulaire courant. Le nom divin est translittéré « Yahweh » et la métaphore du chemin est conservée.
