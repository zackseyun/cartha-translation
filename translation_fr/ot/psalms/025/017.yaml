  text: צָר֣וֹת לְבָבִ֣/י הִרְחִ֑יבוּ מִ֝/מְּצֽוּקוֹתַ֗/י הוֹצִיאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/017.yaml
  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: fr
  text: Les détresses de mon cœur se sont amplifiées[a] ; fais-moi sortir de mes angoisses[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se sont élargies » ; traduction plus littérale de l’image hébraïque.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des lieux étroits où je suis » ; l’hébreu décrit la détresse comme un espace resserré.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹת
  choice: détresses
  rationale: Le nom désigne des difficultés ou situations éprouvantes. « Détresses » convient au registre poétique et garde le lien sémantique avec l’idée d’oppression du second membre.
- source_word: לְבָבִי
  choice: de mon cœur
  rationale: « Cœur » conserve l’image anthropologique hébraïque de l’être intérieur, siège des pensées et des émotions.
- source_word: הִרְחִיבוּ
  choice: se sont amplifiées
  rationale: Le verbe signifie littéralement « rendre large, élargir ». Avec les détresses pour sujet, « se sont amplifiées » exprime naturellement leur extension sans effacer complètement l’image spatiale.
- source_word: מִמְּצוּקוֹתַי
  choice: de mes angoisses
  rationale: Le terme évoque une situation resserrée, oppressante. « Angoisses » rend cette détresse en français naturel, tandis qu’une note conserve l’image concrète des lieux étroits.
- source_word: הוֹצִיאֵנִי
  choice: fais-moi sortir
  rationale: Cette formulation garde le sens causatif et concret de « faire sortir », plutôt que de le généraliser en « délivre-moi ».
