  text: הַדְרִ֘יכֵ֤/נִי בַ/אֲמִתֶּ֨/ךָ וְֽ/לַמְּדֵ֗/נִי כִּֽי אַ֭תָּה אֱלֹהֵ֣י יִשְׁעִ֑/י אוֹתְ/ךָ֥ קִ֝וִּ֗יתִי כָּל הַ/יּֽוֹם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/005.yaml
  text: Lead me in your truth and teach me[a], for you are the God of my salvation[b]; for you I wait all day long.
translation:
  language: fr
  text: Conduis-moi dans ta vérité[a] et enseigne-moi, car tu es le Dieu de mon salut ; c’est toi que j’attends tout au long du jour[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Conduis-moi par ta fidélité et enseigne-moi. » Le mot hébreu peut signifier « vérité » ou « fidélité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « c’est en toi que j’espère tout au long du jour ». Le verbe hébreu désigne une attente empreinte d’espérance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Conduis-moi
  rationale: L’impératif au hifil de דרך exprime l’idée de diriger quelqu’un sur un chemin. « Conduis-moi » est naturel en français et conserve l’image de la marche.
- source_word: בַאֲמִתֶּךָ
  choice: dans ta vérité
  rationale: אֱמֶת peut désigner la vérité, la fiabilité ou la fidélité. Dans ce contexte de direction et d’enseignement, « dans ta vérité » exprime naturellement le domaine ou la norme selon laquelle le psalmiste demande à être conduit.
- source_word: וְלַמְּדֵנִי
  choice: et enseigne-moi
  rationale: Le piel de למד signifie directement « enseigner ». Cette formulation est claire, courante et fidèle au parallélisme avec la demande d’être conduit.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande. « Car » en restitue sobrement la valeur explicative.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: le Dieu de mon salut
  rationale: Cette traduction conserve la structure nominale du syntagme construit et présente Dieu comme la source du salut ou de la délivrance.
- source_word: אוֹתְךָ קִוִּיתִי
  choice: c’est toi que j’attends
  rationale: קוה évoque une attente confiante et pleine d’espérance. La tournure emphatique « c’est toi que » reflète l’antéposition de אוֹתְךָ et garde Dieu comme objet direct de l’attente.
- source_word: כָּל הַיּוֹם
  choice: tout au long du jour
  rationale: Cette expression française naturelle conserve l’idée d’une attente qui dure pendant toute la journée.
theological_decisions:
- issue: Sens de אֱמֶת dans la demande de direction divine
  choice: vérité
  alternative: fidélité
  rationale: Le rapprochement entre conduire et enseigner favorise ici « vérité », comprise comme ce selon quoi Dieu dirige le psalmiste. « Fidélité » demeure toutefois une possibilité lexicale réelle, signalée en note sans effacer l’ambiguïté.
- issue: Nuance de קוה
  choice: attendre
  alternative: espérer
  rationale: Le verbe associe attente et espérance confiante. « Attendre » préserve l’image verbale concrète, tandis que la note explicite la nuance d’espérance sans imposer une seule valeur.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La formulation garde le parallélisme poétique et met en relief « toi », comme le fait l’ordre des mots hébreu.
