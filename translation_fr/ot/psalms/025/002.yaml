id: PSA.25.2
reference: Psalms 25:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: fr
  text: Mon Dieu, je me confie en toi. Que je ne sois pas couvert de honte[a] ! Que mes ennemis ne jubilent pas à mes dépens[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que je n’aie pas honte ». Le verbe hébreu peut désigner un sentiment intérieur de honte ou le fait d’être publiquement humilié ou déshonoré.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne triomphent pas de moi » ou « ne se réjouissent pas à mon sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Le nom avec suffixe de première personne signifie « mon Dieu » et fonctionne ici comme une adresse directe, sans qu’il soit nécessaire d’ajouter une interjection.
- source_word: בְּךָ בָטַחְתִּי
  choice: je me confie en toi
  rationale: La préposition בְּ introduit l’objet de la confiance. Le parfait exprime ici une confiance établie et actuelle ; le présent français en rend naturellement la portée continue.
- source_word: אַל אֵבוֹשָׁה
  choice: Que je ne sois pas couvert de honte
  rationale: La tournure avec אַל exprime une requête négative. Le verbe בושׁ peut viser aussi bien le sentiment de honte que l’humiliation publique ; dans le contexte des ennemis, le texte principal privilégie cette dernière nuance sans exclure l’autre.
- source_word: אַל יַעַלְצוּ
  choice: Que … ne jubilent pas
  rationale: Le verbe עלץ désigne une joie exultante. « Jubiler » conserve sa force et, avec « à mes dépens », fait entendre la jubilation hostile des ennemis.
- source_word: אֹיְבַי לִי
  choice: mes ennemis … à mes dépens
  rationale: אֹיְבַי signifie directement « mes ennemis ». Après un verbe d’exultation, לִי indique ici la personne aux dépens de laquelle ils jubileraient.
theological_decisions:
- issue: La honte demandée d’être épargnée
  choice: Que je ne sois pas couvert de honte
  alternative: Que je n’aie pas honte
  rationale: Le contexte de confrontation avec les ennemis favorise l’idée d’une humiliation manifeste, tout en maintenant en note la possibilité d’un sentiment intérieur de honte. La traduction ne précise ni le moyen ni la forme de la délivrance attendue.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et immédiatement compréhensible. « Se confier en » convient au registre de la prière ; « jubiler à mes dépens » restitue avec naturel la joie hostile exprimée par le texte hébreu.
