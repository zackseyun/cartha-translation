  text: יַדְרֵ֣ךְ עֲ֭נָוִים בַּ/מִּשְׁפָּ֑ט וִֽ/ילַמֵּ֖ד עֲנָוִ֣ים דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/009.yaml
  text: He guides the humble in justice[b][a], and he teaches the humble his way.
translation:
  language: fr
  text: Il guide les humbles dans la justice[b], et il enseigne aux humbles sa voie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son chemin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le jugement », « selon ce qui est juste » ou « avec droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַדְרֵךְ
  choice: conduit
  rationale: Le hifil de דרך signifie faire marcher, diriger ou guider. « Conduit » est naturel en français et conserve l’idée d’une direction donnée par Dieu.
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme peut désigner les humbles, les doux ou les personnes de condition modeste ou affligées. Dans ce contexte d’instruction divine, « les humbles » exprime clairement une attitude réceptive devant Dieu; la répétition hébraïque est conservée.
- source_word: בַּמִּשְׁפָּט
  choice: selon ce qui est juste
  rationale: מִשְׁפָּט peut signifier jugement, justice ou juste décision. La tournure « selon ce qui est juste » rend naturellement en français l’idée de norme ou d’orientation droite sans réduire le mot à un cadre judiciaire.
- source_word: וִילַמֵּד
  choice: et il enseigne
  rationale: Le piel de למד signifie enseigner ou instruire. « Il enseigne » est simple, courant et fidèle à la valeur factitive/intensive de la forme.
- source_word: דַּרְכּוֹ
  choice: son chemin
  rationale: Le nom est au singulier avec un suffixe masculin singulier. « Son chemin » conserve directement l’image hébraïque d’une voie de conduite appartenant à Dieu.
theological_decisions:
- issue: Sens de עֲנָוִים en rapport avec la direction et l’instruction divines
  choice: les humbles
  alternative: les doux; les petits; les affligés
  rationale: Le contexte du psaume met en avant ceux qui se laissent instruire par le Seigneur. « Les humbles » garde cette dimension morale et spirituelle sans nier la possible connotation sociale de petitesse ou d’affliction.
- issue: Portée de בַּמִּשְׁפָּט
  choice: selon ce qui est juste
  alternative: dans la justice; avec droiture; dans le jugement
  rationale: La préposition ב peut indiquer ici la sphère, la manière ou la norme de la direction divine. La traduction retenue préserve cette souplesse et évite de trancher en faveur d’un jugement strictement judiciaire.
translation_notes:
  register: Français moderne, international et digne. La structure parallèle et la répétition de « les humbles » sont maintenues. « Selon ce qui est juste » privilégie la clarté courante tout en signalant en note les autres nuances possibles de מִשְׁפָּט.
