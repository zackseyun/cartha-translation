  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: fr
  text: Il demeurera dans le bonheur[a], et sa descendance héritera du pays[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « passera la nuit dans le bonheur ». Le verbe hébreu évoque d’abord le fait de loger ou de passer la nuit, et peut, dans ce contexte poétique, suggérer un séjour durable.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de la terre ». Le mot hébreu peut désigner aussi bien un pays que la terre.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: il
  rationale: En hébreu, « son âme » peut désigner la personne elle-même. Le français naturel emploie ici le pronom personnel, sans suggérer que seule une partie immatérielle de l’être est concernée.
- source_word: בְּטוֹב
  choice: dans le bien
  rationale: Cette expression conserve l’ampleur de טוֹב, qui peut évoquer le bien, le bien-être et la prospérité, sans la réduire au seul domaine matériel.
- source_word: תָלִין
  choice: demeurera
  rationale: Le verbe לון signifie d’abord passer la nuit ou loger, puis, par extension, demeurer. « Demeurera » rend naturellement l’idée de séjour durable tout en laissant l’image littérale en note.
- source_word: וְזַרְעוֹ
  choice: et sa descendance
  rationale: זֶרַע désigne ici les descendants. « Sa descendance » est idiomatique, collectif et fidèle au sens familial.
- source_word: יִירַשׁ
  choice: héritera
  rationale: ירשׁ peut signifier hériter ou prendre possession. Avec אֶרֶץ, « héritera » préserve la résonance biblique et covenantale de l’expression.
- source_word: אָרֶץ
  choice: du pays
  rationale: אֶרֶץ peut désigner le pays, la terre ou la terre entière. Avec « hériter », « le pays » exprime le mieux l’arrière-plan territorial probable, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Portée de אָרֶץ avec יִירַשׁ
  choice: du pays
  alternative: de la terre
  rationale: L’expression évoque probablement l’héritage du pays dans le langage de l’alliance. Comme אֶרֶץ peut aussi avoir une portée plus générale, cette ambiguïté réelle est conservée dans une note.
translation_notes:
  register: Français international moderne, sobre et poétique. Le pronom « il » rend idiomatiquement נַפְשׁוֹ, tandis que « dans le bien » conserve la richesse sémantique de l’hébreu. Les deux ambiguïtés principales sont documentées par des notes dont les marqueurs figurent dans le texte.
