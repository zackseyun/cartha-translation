  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: fr
  text: De David. Vers toi, Yahvé, j’élève mon âme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie » ou « tout mon être » ; le mot hébreu traduit par « âme » peut désigner la personne entière, et non seulement sa dimension immatérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: De David
  rationale: La formule brève conserve l’ambiguïté de la préposition לְ, qui peut signaler l’auteur, l’appartenance, la destination ou le lien avec David, sans la résoudre en « psaume de ».
- source_word: אֵלֶיךָ
  choice: Vers toi
  rationale: Rend naturellement la direction exprimée par אֶל avec suffixe de deuxième personne.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre, conformément au texte source.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Conserve l’image traditionnelle et la polysémie de נֶפֶשׁ; une note précise que le terme peut désigner la vie ou la personne entière.
- source_word: אֶשָּׂא
  choice: j’élève
  rationale: Reproduit la métaphore de נשׂא (« lever, élever ») avec un français digne et intelligible.
theological_decisions:
- issue: Portée anthropologique de נֶפֶשׁ
  choice: « mon âme » dans le texte, avec clarification en note
  alternative: « ma vie » ou « tout mon être »
  rationale: Cette solution préserve l’expression hébraïque sans imposer une conception dualiste; la note maintient les autres sens contextuellement possibles.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La ponctuation distingue la suscription de la prière. Le marqueur [a] figure immédiatement après l’expression annotée.
