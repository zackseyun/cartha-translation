source:
  edition: WLC
  text: רְאֵ֣ה עָ֭נְיִ/י וַ/עֲמָלִ֑/י וְ֝/שָׂ֗א לְ/כָל חַטֹּאותָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/018.yaml
  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: fr
  text: Regarde ma détresse et ma peine, et pardonne tous mes péchés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « enlève tous mes péchés ». Le verbe hébreu peut signifier « porter » ou « enlever »; avec les péchés pour complément, il exprime ici le pardon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Regarde
  rationale: L’impératif adressé à Dieu appelle son attention bienveillante. « Regarde » conserve directement la force de la supplication en français courant.
- source_word: עָנְיִי
  choice: ma détresse
  rationale: עֳנִי désigne ici la misère ou l’affliction vécue, sans se limiter à la pauvreté matérielle. « Détresse » convient au contexte de lamentation.
- source_word: וַעֲמָלִי
  choice: et ma peine
  rationale: עָמָל peut évoquer le labeur pénible, la souffrance ou les difficultés. En parallèle avec « détresse », « peine » exprime naturellement le poids douloureux de l’épreuve.
- source_word: וְשָׂא
  choice: et pardonne
  rationale: נשׂא signifie littéralement « soulever, porter, enlever », mais avec les péchés pour complément, il exprime idiomatiquement leur enlèvement, donc le pardon.
- source_word: לְכָל
  choice: tous
  rationale: Dans cette construction idiomatique, le français exprime naturellement la totalité par « tous », sans rendre séparément la préposition לְ.
- source_word: חַטֹּאותָי
  choice: mes péchés
  rationale: Le pluriel חַטֹּאות désigne ici les fautes morales; « péchés » est le terme français clair et usuel dans ce contexte pénitentiel.
theological_decisions:
- issue: Rendu idiomatique de נשׂא avec les péchés comme complément
  choice: pardonne tous mes péchés
  alternative: enlève tous mes péchés
  rationale: Le texte hébreu représente les péchés comme une charge que Dieu enlève. « Pardonne » communique clairement le sens de l’idiome sans ajouter de précision doctrinale, tandis que la note conserve l’image concrète de l’hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La formulation garde le parallélisme entre « détresse » et « peine » ainsi que le ton direct de la supplication.
