source:
  edition: WLC
  text: תֹּם וָ/יֹ֥שֶׁר יִצְּר֑וּ/נִי כִּ֝֗י קִוִּיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: fr
  text: Que l’intégrité et la droiture me gardent[a], car je mets mon espérance en toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’intégrité et la droiture me garderont »; dans ce contexte, le verbe hébreu peut exprimer soit une attente confiante, soit un souhait ou une prière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « car je t’attends »; le verbe hébreu désigne une attente pleine d’espérance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: l’intégrité
  rationale: תֹּם désigne ici la plénitude ou la cohérence morale. « Intégrité » est naturel en français moderne et n’implique pas nécessairement une perfection sans péché.
- source_word: וָיֹשֶׁר
  choice: et la droiture
  rationale: יֹשֶׁר exprime la rectitude morale. « Droiture » conserve le parallélisme poétique avec « intégrité ».
- source_word: יִצְּרוּנִי
  choice: me gardent
  rationale: Le verbe נצר signifie garder, protéger ou préserver. Le yiqtol peut exprimer ici soit un souhait, soit une attente confiante; la tournure « Que… me gardent » rend naturellement la valeur de prière, tandis qu’une note conserve l’autre possibilité.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit le motif de la demande ou de l’attente exprimée dans la première proposition.
- source_word: קִוִּיתִיךָ
  choice: je mets mon espérance en toi
  rationale: קוה associe l’attente à l’espoir confiant. Cette formulation française exprime clairement la confiance orientée vers Dieu; la note signale la traduction plus littérale par l’attente.
theological_decisions:
- issue: Le rôle de l’intégrité et de la droiture dans la préservation du psalmiste
  choice: Conserver ces qualités morales comme sujets du verbe « garder », dans le cadre d’une prière.
  alternative: Reformuler pour faire explicitement de Dieu l’unique agent de la protection, ou présenter ces qualités comme un mérite fondant la délivrance.
  rationale: L’hébreu attribue poétiquement la fonction de garder à l’intégrité et à la droiture, tout en reliant cette demande à l’espérance placée en Dieu. La traduction maintient cette tension sans ajouter une doctrine du mérite ni effacer la portée éthique du texte.
- issue: Valeur modale de יִצְּרוּנִי
  choice: 'Rendre le verbe comme un souhait ou une prière: « Que… me gardent ».'
  alternative: 'Le rendre comme une attente assurée: « L’intégrité et la droiture me garderont ».'
  rationale: Dans ce contexte de prière, le yiqtol permet les deux lectures. Le texte principal privilégie la demande, et la note préserve explicitement la lecture déclarative.
translation_notes:
  register: Français international moderne, naturel et digne. « Que… me gardent » conserve la tonalité de prière; « je mets mon espérance en toi » évite une formulation ambiguë ou peu idiomatique tout en gardant la dimension d’attente confiante.
