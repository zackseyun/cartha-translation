id: PSA.25.7
reference: Psalms 25:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: fr
  text: Ne te souviens pas des péchés de ma jeunesse ni de mes révoltes[a] ; selon ton amour fidèle[b], souviens-toi de moi, à cause de ta bonté, Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « et de mes révoltes » ; après une demande négative, la conjonction hébraïque peut naturellement se rendre par « ni » en français.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu ḥésed désigne un amour empreint de bonté, de loyauté et de fidélité ; autres traductions possibles : « miséricorde » ou « amour d’alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: les péchés de ma jeunesse
  rationale: Le pluriel חַטֹּאות désigne ici des actes concrets, et le complément נְעוּרַי les rattache à la jeunesse du psalmiste. Cette formulation conserve directement ce rapport.
- source_word: וּפְשָׁעַי
  choice: ni de mes révoltes
  rationale: פְּשָׁעִים évoque des transgressions comportant une idée de rébellion. Après la négation, « ni » relie naturellement en français les deux objets de la demande.
- source_word: אַל תִּזְכֹּר
  choice: Ne te souviens pas
  rationale: La forme exprime une requête négative adressée à Dieu. Le verbe « se souvenir » préserve le contraste délibéré avec la requête positive qui suit.
- source_word: כְּחַסְדְּךָ
  choice: selon ton amour fidèle
  rationale: חֶסֶד désigne une bonté aimante, loyale et durable. « Amour fidèle » en restitue l'étendue sans limiter le mot à la seule compassion, tandis que « selon » rend la préposition כְּ.
- source_word: זְכָר לִי אַתָּה
  choice: souviens-toi de moi
  rationale: L'impératif forme le pendant positif de « Ne te souviens pas ». Le pronom אַתָּה apporte une insistance que la tournure impérative française permet de laisser implicite sans perte substantielle.
- source_word: לְמַעַן טוּבְךָ
  choice: à cause de ta bonté
  rationale: לְמַעַן présente ici la bonté propre de Dieu comme le motif de la requête. « À cause de » est naturel en français et maintient cette relation de fondement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui conserve son caractère de nom propre dans le texte hébreu.
theological_decisions:
- issue: Sens judiciaire et relationnel de « se souvenir »
  choice: Conserver le verbe « se souvenir » dans les deux propositions
  alternative: « Ne tiens pas compte… mais accorde-moi ta faveur »
  rationale: Le parallélisme oppose le souvenir des fautes au souvenir favorable de la personne. La traduction conserve cette tension sans expliciter dans le texte ce que le contexte laisse entendre.
- issue: Nuance de חֶסֶד
  choice: amour fidèle
  alternative: miséricorde ; amour d'alliance
  rationale: « Amour fidèle » garde ensemble l'amour et la loyauté durable du terme, sans imposer dans le corps du texte une formulation confessionnelle plus technique.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: La translittération représente le nom personnel présent dans la source et évite de le substituer silencieusement par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement convient à la prière directe des Psaumes. La ponctuation met en relief le contraste entre ne pas se souvenir des fautes et se souvenir du suppliant.
