review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’impératif, les deux pluriels avec suffixe possessif, le nom divin, et la relation causale sont bien rendus. Toutefois, « depuis toujours » tend en français à affirmer une durée sans commencement et réduit l’ambiguïté de מֵעוֹלָם, qui peut aussi renvoyer aux temps anciens. « Elles existent » est également moins idiomatique et ajoute une nuance existentielle inutile : le pronom copulatif suffit.'
  naturalness: « Souviens-toi de tes compassions » et « tes bontés fidèles » sont compréhensibles, mais « tes compassions » est un peu calqué et « bontés fidèles » sonne moins naturel que « tes actes de fidélité », qui conserve le pluriel et exprime clairement les manifestations du חֶסֶד. « Car elles sont depuis les temps anciens » est naturel, sobre et convient au registre psalmique.
  terminology: « Yahweh » respecte le rendu établi du tétragramme. « Actes de fidélité » rend le pluriel de חֲסָדִים sans recourir au singulier collectif français ni à une expression théologiquement surchargée. La note maintient explicitement l’alternative d’une durée éternelle.
  issues:
  - severity: medium
    issue: « depuis toujours » dans le texte principal
    rationale: Cette expression suggère couramment en français une permanence sans commencement et ne préserve pas assez la possibilité contextuelle de « depuis les temps anciens » portée par מֵעוֹלָם.
  - severity: low
    issue: « elles existent »
    rationale: Le verbe ajoute une notion d’existence qui n’est pas nécessaire dans l’énoncé nominal hébreu et produit une formulation française moins fluide.
  - severity: low
    issue: « tes bontés fidèles »
    rationale: La formule est possible, mais elle est moins idiomatique et moins précise que « tes actes de fidélité » pour des manifestations plurielles de חֶסֶד.
  revised_text: Souviens-toi de tes compassions, Yahweh, et de tes actes de fidélité, car ils sont depuis les temps anciens[a].
  revised_footnotes:
