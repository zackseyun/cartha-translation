    text: 'Ou : « car ils sont de toute éternité ». L’expression hébraïque peut désigner un passé très lointain ou une durée éternelle.'
    reason: alternative_reading
  revision_rationale: La révision remplace une expression temporelle qui risquait de privilégier l’éternité par « depuis les temps anciens », tout en conservant l’autre lecture dans la note. Elle rend plus naturellement le pluriel de חֶסֶד et évite l’ajout sémantique de « existent ».
