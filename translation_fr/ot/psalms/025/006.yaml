  rationale: La révision remplace une expression temporelle qui risquait de privilégier l’éternité par « depuis les temps anciens », tout en conservant l’autre lecture dans la note. Elle rend plus naturellement le pluriel de חֶסֶד et évite l’ajout sémantique de « existent ».
