source:
  edition: WLC
  text: זְכֹר רַחֲמֶ֣י/ךָ יְ֭הוָה וַ/חֲסָדֶ֑י/ךָ כִּ֖י מֵ/עוֹלָ֣ם הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: fr
  text: Souviens-toi de tes compassions, Yahweh, et de tes actes de fidélité, car ils sont depuis les temps anciens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car ils sont de toute éternité ». L’expression hébraïque peut désigner un passé très lointain ou une durée éternelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: Impératif qal masculin singulier de זכר ; cette formulation directe est naturelle dans une prière adressée à Dieu.
- source_word: רַחֲמֶיךָ
  choice: tes compassions
  rationale: Le pluriel hébreu désigne la compassion dans ses manifestations ou son abondance ; le pluriel français conserve cette nuance tout en restant digne et intelligible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: וַחֲסָדֶיךָ
  choice: et tes bontés fidèles
  rationale: Le pluriel conserve la forme hébraïque ; « bontés fidèles » exprime les manifestations de la bienveillance loyale et durable évoquée par חֶסֶד.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français le motif de la requête.
- source_word: מֵעוֹלָם
  choice: depuis toujours
  rationale: Expression française naturelle qui maintient l'idée d'une durée remontant au passé indéfini, sans trancher entre haute antiquité et éternité.
- source_word: הֵמָּה
  choice: elles existent
  rationale: Le pronom indépendant masculin pluriel reprend les deux noms pluriels hébreux ; en français, le féminin pluriel s'accorde avec « compassions » et « bontés ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération le distingue d'un simple titre.
- issue: Valeur temporelle de מֵעוֹלָם
  choice: depuis toujours
  alternative: depuis les temps anciens / de toute éternité
  rationale: L'hébreu peut viser soit un passé très lointain, soit une durée éternelle. Le corps du texte conserve cette amplitude, et la note explicite les deux possibilités.
- issue: Pluriel de חֲסָדֶיךָ
  choice: tes bontés fidèles
  alternative: ton amour fidèle
  rationale: Le pluriel français rend le pluriel hébreu et suggère les manifestations répétées de la fidélité bienveillante de Dieu, sans imposer une formulation doctrinale particulière.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et les pluriels hébreux sont conservés sans recourir à des termes archaïques ; l’ambiguïté temporelle de מֵעוֹלָם est signalée en note.
