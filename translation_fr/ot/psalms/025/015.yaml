  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: fr
  text: Mes yeux sont constamment tournés vers Yahweh, car c’est lui qui dégagera[a] mes pieds du filet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il fera sortir mes pieds hors du filet ».'
    reason: La note signale la formulation concrète du verbe hébreu tout en expliquant la traduction française idiomatique « dégagera ».
lexical_decisions:
- source_word: עֵינַי
  choice: Mes yeux
  rationale: Conserve l’image concrète du pluriel hébreu plutôt que de l’interpréter par « mon regard ».
- source_word: תָּמִיד
  choice: constamment
  rationale: Exprime une orientation continue et habituelle dans un français moderne et naturel.
- source_word: אֶל
  choice: tournés vers
  rationale: Avec « mes yeux », cette formulation rend idiomatiquement l’idée d’une attention dirigée vers quelqu’un.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison pour laquelle le psalmiste garde les yeux tournés vers Yahweh.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Rend l’accent porté par le pronom indépendant hébreu sans exagérer son intensité.
- source_word: יוֹצִיא
  choice: dégagera
  rationale: Rend le hiphil de יצא, « faire sortir », tout en conservant naturellement en français l’image d’une extraction hors d’un piège.
- source_word: מֵרֶשֶׁת
  choice: du filet
  rationale: « Filet » est le sens concret du nom hébreu et préserve l’image du piégeage.
- source_word: רַגְלָי
  choice: mes pieds
  rationale: Conserve l’image corporelle précise de l’hébreu et celle de l’enchevêtrement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Valeur temporelle de יוֹצִיא
  choice: 'futur de confiance : « dégagera »'
  alternative: 'présent habituel : « dégage »'
  rationale: L’inaccompli hébreu peut avoir plusieurs nuances; dans ce contexte, le futur exprime naturellement l’attente confiante du psalmiste sans transformer l’action en affirmation générale.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et l’image concrète du filet est conservée.
