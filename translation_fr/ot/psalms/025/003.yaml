id: PSA.25.3
reference: Psalms 25:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֣ם כָּל קֹ֭וֶי/ךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַ/בּוֹגְדִ֥ים רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: fr
  text: Oui, aucun de ceux qui comptent sur toi[a] ne sera couvert de honte ; ceux qui trahissent sans raison[b] seront couverts de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui espèrent en toi » ou « qui t’attendent ». Le verbe hébreu évoque une attente confiante.
    reason: lexical_alternative
  - marker: b
    text: Ou « en vain » ou « pour rien ». Le mot hébreu peut qualifier leur trahison comme dépourvue de motif, ou indiquer qu’elle finira par être vaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Oui
  rationale: En tête de vers, גַּם renforce l’affirmation. « Oui » rend cette valeur emphatique de façon naturelle en français.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: aucun de ceux qui comptent sur toi ne sera couvert de honte
  rationale: La construction hébraïque signifie littéralement que tous ceux qui attendent Dieu ne connaîtront pas la honte. La formulation négative française « aucun… ne » en restitue clairement la portée universelle.
- source_word: קֹוֶיךָ
  choice: ceux qui comptent sur toi
  rationale: Le verbe קוה exprime une attente confiante et pleine d’espérance. « Compter sur toi » communique cette confiance en français courant, tout en laissant en note la traduction plus formelle.
- source_word: לֹא יֵבֹשׁוּ / יֵבֹשׁוּ
  choice: ne sera / seront couverts de honte
  rationale: La répétition de בוש forme un contraste poétique. Répéter « couvert(s) de honte » conserve ce parallélisme et exprime une honte publiquement subie.
- source_word: הַבּוֹגְדִים
  choice: ceux qui trahissent
  rationale: Le participe décrit des personnes qui agissent avec déloyauté. Le verbe « trahir » conserve le caractère actif de l’hébreu dans une formulation accessible.
- source_word: רֵיקָם
  choice: sans raison
  rationale: רֵיקָם peut évoquer ce qui est vain, gratuit ou dépourvu de motif. Ici, « sans raison » rattache naturellement l’adverbe à l’acte de trahison sans effacer l’ambiguïté, signalée en note.
theological_decisions: []
