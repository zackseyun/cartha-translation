  text: פְּדֵ֣ה אֱ֭לֹהִים אֶת יִשְׂרָאֵ֑ל מִ֝/כֹּ֗ל צָֽרוֹתָי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/022.yaml
  text: Redeem Israel[a], O God, from all his troubles.
translation:
  language: fr
  text: Ô Dieu, rachète Israël de toutes ses détresses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּדֵה
  choice: rachète
  rationale: L’impératif de פדה exprime l’action de racheter ou de libérer. « Rachète » conserve la portée forte du terme tout en convenant à une prière adressée à Dieu.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est ici employé en apostrophe après l’impératif ; « Ô Dieu » rend clairement cette adresse directe dans un registre digne.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre désigne ici le peuple d’Israël dans son ensemble.
- source_word: מִכֹּל
  choice: de toutes
  rationale: La préposition מִן associée à כֹּל marque l’éloignement ou la délivrance hors de la totalité des détresses ; « de toutes » est idiomatique en français.
- source_word: צָרוֹתָיו
  choice: ses détresses
  rationale: צָרוֹת désigne des détresses, épreuves ou situations oppressantes. Le possessif français « ses » préserve naturellement le suffixe hébreu de troisième personne du masculin singulier sans imposer en français un genre distinct.
theological_decisions:
- issue: Israël comme collectif singulier
  choice: Conserver le possessif singulier « ses »
  alternative: Expliciter le collectif au pluriel, par exemple « les détresses de son peuple »
  rationale: L’hébreu traite Israël comme un collectif singulier au moyen du suffixe masculin singulier. En français, « ses détresses » reproduit cette relation grammaticale tout en restant naturel ; contrairement à l’anglais, le possessif ne distingue pas ici singulier et pluriel du possesseur, si bien qu’aucune note n’est nécessaire.
translation_notes:
  register: Français moderne, international et digne. La formulation est concise et conserve la structure de la supplication hébraïque. « Détresses » rend la gravité de צָרוֹת plus précisément que le terme plus général « difficultés ».
