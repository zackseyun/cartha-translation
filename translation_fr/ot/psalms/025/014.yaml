  text: The counsel of the LORD is for those who fear him, and his covenant is to make it known to them.
translation:
  language: fr
  text: Le conseil de l’Éternel est pour ceux qui le craignent, et il leur fait connaître son alliance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’intimité de l’Éternel est pour ceux qui le craignent. » Le mot hébreu peut aussi évoquer une confidence ou un conseil confidentiel.'
    reason: Indique les nuances sémantiques de סוֹד sans affaiblir le lien syntaxique naturel entre l’Éternel et l’action de faire connaître son alliance.
lexical_decisions:
- source_word: סוֹד
  choice: secret
  rationale: Le terme désigne une communication confidentielle, un conseil intime ou la proximité d’un cercle de confiance. « Secret » conserve cette image et reste naturel en français.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel du tétragramme, distinct du titre « Seigneur ».
- source_word: לִירֵאָיו
  choice: pour ceux qui le craignent
  rationale: Reproduit le sens relationnel et révérenciel de ירא sans l’atténuer.
- source_word: וּבְרִיתוֹ
  choice: et son alliance
  rationale: Traduction directe de בְּרִית, qui désigne ici l’alliance appartenant à l’Éternel.
- source_word: לְהוֹדִיעָם
  choice: pour la leur faire connaître
  rationale: L’infinitif construit avec ל peut exprimer le but ou le résultat. Le suffixe objet pluriel renvoie à ceux qui le craignent; l’objet sous-entendu de « faire connaître » est vraisemblablement l’alliance.
theological_decisions:
- issue: Rapport syntaxique entre « son alliance » et « pour la leur faire connaître »
  choice: 'Conserver la construction nominale elliptique : « et son alliance, pour la leur faire connaître »'
  alternative: « et il leur fait connaître son alliance »
  rationale: L’hébreu ne contient pas de verbe personnel explicite dans le second membre. La formulation choisie préserve l’ambiguïté et la tension de la construction au lieu de la transformer silencieusement en proposition verbale.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébreu et l’ellipse du second membre sont maintenus autant que le permet une lecture naturelle.
