id: PSA.25.10
reference: Psalms 25:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כָּל אָרְח֣וֹת יְ֭הוָה חֶ֣סֶד וֶ/אֱמֶ֑ת לְ/נֹצְרֵ֥י בְ֝רִית֗/וֹ וְ/עֵדֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: fr
  text: Tous les sentiers de Yahweh sont amour constant et fidélité[a] envers[b] ceux qui gardent son alliance et ses témoignages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vérité ». Dans cette association avec l’amour constant, le mot hébreu évoque souvent la fiabilité et la loyauté plutôt que la seule vérité abstraite.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour ceux qui gardent ». La préposition hébraïque permet de comprendre soit une orientation envers ces personnes, soit ce qui vaut pour elles.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: Tous les sentiers
  rationale: « Tous » exprime la totalité, tandis que « sentiers » conserve l’image concrète des chemins pour parler de la conduite de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom propre du texte hébreu plutôt que de lui substituer un titre.
- source_word: חֶסֶד
  choice: amour constant
  rationale: Le terme désigne un amour bienveillant, loyal et durable. « Amour constant » rend cette richesse sans recourir à une formulation technique.
- source_word: אֱמֶת
  choice: fidélité
  rationale: Dans l’association חֶסֶד וֶאֱמֶת, le mot évoque surtout la fiabilité et la loyauté; « fidélité » convient mieux ici que la seule notion abstraite de vérité.
- source_word: לְנֹצְרֵי
  choice: envers ceux qui gardent
  rationale: La préposition לְ marque la relation aux personnes concernées, et le participe de נצר exprime le fait de conserver et d’observer avec soin.
- source_word: בְרִיתוֹ
  choice: son alliance
  rationale: « Alliance » est le terme français courant et précis dans ce contexte biblique.
- source_word: וְעֵדֹתָיו
  choice: et ses témoignages
  rationale: La traduction formelle conserve le sens de prescriptions divines faisant autorité et témoignant de la volonté de Dieu.
theological_decisions:
- issue: Relation prédicative entre les sentiers de Yahweh et « amour constant et fidélité »
  choice: Les sentiers de Yahweh sont eux-mêmes qualifiés d’amour constant et de fidélité.
  alternative: Les sentiers de Yahweh conduisent à l’amour constant et à la fidélité.
  rationale: La proposition nominale hébraïque attribue le plus naturellement ces qualités aux sentiers de Yahweh; il n’est pas nécessaire d’ajouter l’idée qu’ils y conduisent.
- issue: Portée de la relation avec ceux qui gardent l’alliance
  choice: « envers ceux qui gardent » exprime la relation particulière indiquée par לְ sans expliquer davantage son fondement théologique.
  alternative: « pour ceux qui gardent » peut présenter ces qualités comme ce qu’ils trouvent ou expérimentent dans les sentiers de Yahweh.
  rationale: Le texte associe explicitement cette affirmation aux gardiens de l’alliance et des témoignages, mais ne précise pas ici si leur obéissance constitue une condition, une description du peuple de l’alliance ou le cadre de leur expérience.
translation_notes:
  register: Français international actuel, sobre et poétique. « Sentiers » maintient la métaphore du psaume; « amour constant » évite la lourdeur de « amour fidèle et fidélité ». Le parallélisme hébreu et sa tension covenantale sont conservés sans ajout doctrinal.
