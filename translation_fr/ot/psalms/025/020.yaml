  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: fr
  text: Garde ma vie et délivre-moi ; que je ne sois pas couvert de honte, car je me réfugie en toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Dans cette demande de protection et de délivrance, נֶפֶשׁ désigne la personne vivante, donc la vie du psalmiste, plutôt qu’une « âme » distincte du corps.
- source_word: וְהַצִּילֵנִי
  choice: et délivre-moi
  rationale: Le verbe נצל au causatif exprime ici l’action d’arracher quelqu’un au danger ou de le sauver ; « délivre-moi » convient au registre de la prière.
- source_word: אֵבוֹשׁ
  choice: je ne sois pas couvert de honte
  rationale: בוש peut exprimer la honte publique résultant d’un espoir déçu. Cette formulation naturelle en français conserve l’idée d’une humiliation subie.
- source_word: חָסִיתִי בָךְ
  choice: je me réfugie en toi
  rationale: Le verbe חסה évoque le fait de chercher et de trouver refuge auprès de quelqu’un ; le présent français rend naturellement la confiance actuelle exprimée par l’accompli hébreu.
theological_decisions:
- issue: Portée de נֶפֶשׁ
  choice: ma vie
  alternative: mon âme
  rationale: Le contexte demande la préservation de la personne face au danger. « Ma vie » évite d’introduire une opposition corps-âme absente du verset.
- issue: Valeur de l’accompli חָסִיתִי
  choice: je me réfugie
  alternative: j’ai trouvé refuge
  rationale: L’accompli peut présenter une confiance déjà engagée et toujours valable. Le présent français exprime cette posture continue sans imposer qu’elle appartienne seulement au passé.
translation_notes:
  register: Français moderne, clair et digne, avec le rythme bref d’une supplication. Le tutoiement est conservé pour l’adresse directe à Dieu.
