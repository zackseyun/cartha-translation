source:
  edition: WLC
  text: פְּנֵה אֵלַ֥/י וְ/חָנֵּ֑/נִי כִּֽי יָחִ֖יד וְ/עָנִ֣י אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/016.yaml
  text: Turn to me and be gracious to me[b][a], for I am lonely and afflicted.
translation:
  language: fr
  text: Tourne-toi vers moi et fais-moi grâce, car je suis seul[a] et affligé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « solitaire ». Le mot hébreu peut désigner une personne seule ou isolée.
    reason: lexical_alternative
  - marker: b
    text: Ou « pauvre » ou « opprimé ». Le mot hébreu peut évoquer la pauvreté, l’oppression ou, plus généralement, la détresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Tourne-toi vers moi
  rationale: L’impératif de פנה suivi de אֵלַי exprime un appel à Dieu pour qu’il porte son attention sur le psalmiste. Cette formulation est naturelle en français et conserve l’image d’un mouvement vers lui.
- source_word: וְחָנֵּנִי
  choice: et fais-moi grâce
  rationale: Le verbe חנן demande que Dieu accorde sa faveur. « Fais-moi grâce » préserve cette nuance sans la réduire à la seule compassion.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la supplication; « car » convient au registre de la prière et maintient le lien causal.
- source_word: יָחִיד
  choice: seul
  rationale: Dans cette lamentation, יָחִיד décrit vraisemblablement l’isolement. « Seul » conserve mieux que « solitaire » l’ambiguïté entre situation objective et sentiment de solitude.
- source_word: וְעָנִי
  choice: et affligé
  rationale: עָנִי peut évoquer la pauvreté, l’oppression ou une détresse plus générale. Ici, « affligé » rend largement la souffrance sans la limiter à sa dimension économique.
- source_word: אָנִי
  choice: je suis
  rationale: Le pronom indépendant souligne la situation personnelle du locuteur. En français, la construction attributive exige naturellement « je suis ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme bref de la supplication est conservé, ainsi que l’ambiguïté des deux termes décrivant l’isolement et la détresse du psalmiste.
