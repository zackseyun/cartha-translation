id: PSA.25.11
reference: Psalms 25:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֥ יְהוָ֑ה וְֽ/סָלַחְתָּ֥ לַ֝/עֲוֺנִ֗/י כִּ֣י רַב הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/011.yaml
  text: For the sake of your name[a], O Yahweh, forgive my iniquity[b], for it is great.
translation:
  language: fr
  text: À cause de ton nom[a], Yahweh, pardonne ma faute[b], car elle est grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « à cause de ton nom » : le nom représente ici aussi le caractère, la réputation et l’honneur de Dieu.'
    reason: cultural_note
  - marker: b
    text: Ou « mon iniquité », « ma culpabilité » ou « mon péché ». Le mot hébreu עָוֹן peut désigner la faute commise, la culpabilité ou le poids de ses conséquences.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: À cause de ton nom
  rationale: לְמַעַן introduit ici le motif ou le fondement de la demande. « À cause de ton nom » est naturel en français et conserve l’expression hébraïque concrète, où le nom renvoie aussi à la réputation et au caractère de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre plutôt que remplacé par le titre « le Seigneur ».
- source_word: וְסָלַחְתָּ
  choice: pardonne
  rationale: Dans ce contexte de supplication, le parfait avec waw a une valeur de demande. L’impératif français exprime naturellement cette force pragmatique.
- source_word: לַעֲוֺנִי
  choice: ma faute
  rationale: עָוֹן peut désigner la conduite mauvaise, la culpabilité qu’elle entraîne ou son poids. « Faute » reste courant et moralement marqué sans limiter indûment le terme à un seul aspect.
- source_word: כִּי רַב הוּא
  choice: car elle est grande
  rationale: כִּי introduit le motif de la supplication; רַב, accordé sémantiquement avec le singulier עָוֹן repris par הוּא, indique ici l’ampleur ou la gravité.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le nom divin. La translittération préserve ce nom personnel au lieu de lui substituer un titre.
- issue: Portée sémantique de עָוֹן
  choice: faute
  alternative: iniquité, culpabilité, péché
  rationale: Le mot hébreu peut englober l’acte mauvais, la culpabilité et ses conséquences. Le texte principal retient un terme français courant, tandis que la note maintient l’étendue sémantique.
- issue: Logique de « car elle est grande »
  choice: motif paradoxal de la demande de pardon
  alternative: bien que ma faute soit grande
  rationale: כִּי est conservé dans son sens causal ordinaire. Le psalmiste fait précisément de la gravité de sa faute un motif pour implorer le pardon, sans atténuer cette tension par une lecture concessive.
translation_notes:
  register: Français international moderne, simple et digne. L’adresse directe « Yahweh » est conservée sans interjection ajoutée. « Pardonne » est plus naturel dans une prière actuelle que « veuille pardonner », et « faute » est plus immédiatement accessible que « iniquité ».
