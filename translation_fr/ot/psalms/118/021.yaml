  text: א֭וֹדְ/ךָ כִּ֣י עֲנִיתָ֑/נִי וַ/תְּהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/021.yaml
  text: I will give thanks to you[a], for you answered me and became my salvation.
translation:
  language: fr
  text: Je te rendrai grâce, car tu m’as répondu et tu es devenu mon salut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma délivrance ». Le terme hébreu peut désigner le secours dans une situation concrète aussi bien que le salut au sens large.
    reason: lexical_alternative
lexical_decisions:
- source_word: אודך
  choice: Je te rendrai grâce
  rationale: Le hifil de ידה exprime ici l’action de rendre grâce ou de louer. Le futur français conserve la nuance prospective ou volontaire de l’imparfait hébreu dans ce chant d’action de grâce.
- source_word: כי
  choice: car
  rationale: כי introduit ici la raison de l’action de grâce; « car » exprime clairement et dignement ce lien causal.
- source_word: עניתני
  choice: tu m’as répondu
  rationale: Le verbe relève de ענה II, « répondre », et non de ענה I, « affliger ». Le passé composé convient naturellement en français pour évoquer la réponse reçue.
- source_word: ותהי
  choice: et tu es devenu
  rationale: Le wayyiqtol de היה fait progresser l’action et indique que Dieu est devenu salut pour le psalmiste; « es devenu » en conserve la force verbale, plutôt que de l’aplatir en « tu as été ».
- source_word: לי
  choice: mon
  rationale: Littéralement « pour moi » ou « à moi »; avec « devenir » et « salut », le possessif « mon » constitue en français la formulation la plus naturelle.
- source_word: לישועה
  choice: salut
  rationale: ישועה peut désigner une délivrance concrète aussi bien que le salut au sens large. « Salut » préserve cette ampleur littéraire et théologique sans exclure le secours immédiat.
theological_decisions:
- issue: Rendu de ישועה dans un psaume de délivrance à forte portée théologique
  choice: salut
  alternative: délivrance
  rationale: « Salut » maintient à la fois l’idée du secours vécu et la portée théologique plus large du terme hébreu, sans importer dans le verset un développement doctrinal ultérieur.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à Dieu et le futur « rendrai » conserve la nuance volitive ou prospective de l’hébreu.
