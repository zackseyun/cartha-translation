  text: יֹֽאמְרוּ נָ֥א בֵֽית אַהֲרֹ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/003.yaml
  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: fr
  text: 'Que la maison d’Aaron dise maintenant : « Car son amour fidèle[a] dure pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa fidélité à l’alliance ». Le mot hébreu חֶסֶד peut désigner l’amour loyal, la bonté, la miséricorde ou la fidélité à l’alliance.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Que … dise
  rationale: L’imparfait qal à valeur jussive exprime ici une exhortation liturgique. La tournure française « Que … dise » restitue naturellement cette force.
- source_word: נָא
  choice: maintenant
  rationale: La particule renforce l’appel par une nuance d’insistance ou d’urgence ; « maintenant » convient au contexte d’une convocation publique.
- source_word: בֵית אַהֲרֹן
  choice: la maison d’Aaron
  rationale: L’expression désigne collectivement la lignée ou communauté sacerdotale d’Aaron. Le maintien de l’idiome biblique convient au registre liturgique.
- source_word: כִּי
  choice: non exprimé séparément
  rationale: Dans cette formule, כִּי introduit le contenu de la proclamation. En français, l’ajout de « car » à l’intérieur de la citation serait peu naturel sans proposition antérieure explicite ; la relation reste claire par les deux-points.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: Littéralement « à toujours ». Avec חֶסֶד, une formulation verbale rend l’expression idiomatique et souligne la permanence.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour loyal, bonté et fidélité, souvent dans un cadre d’alliance. « Amour fidèle » en préserve la largeur sémantique dans un français courant et digne.
theological_decisions:
- issue: Traduction de חֶסֶד dans une formule de louange liée à l’alliance
  choice: amour fidèle
  alternative: fidélité à son alliance ; bonté ; miséricorde
  rationale: « Amour fidèle » maintient ensemble les dimensions affective et loyale du terme sans le réduire exclusivement à la miséricorde ni expliciter l’alliance plus que ne le fait le verset.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conserve l’appel liturgique et le parallélisme du psaume, tandis que la note signale l’étendue sémantique de חֶסֶד.
