  text: מִֽן הַ֭/מֵּצַ֥ר קָרָ֣אתִי יָּ֑הּ עָנָ֖/נִי בַ/מֶּרְחָ֣ב יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/005.yaml
  text: Out of my distress I called on Yah[a]; Yah answered me with spaciousness.
translation:
  language: fr
  text: Du fond de la détresse, j’ai appelé Yah[a] ; Yah m’a répondu en me mettant au large.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Du lieu resserré, j’ai appelé Yah ; dans un vaste espace, Yah m’a répondu. » L’hébreu oppose l’image d’un lieu étroit à celle d’un espace ouvert pour évoquer la détresse et la délivrance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַמֵּצַר
  choice: Du fond de la détresse
  rationale: La préposition מִן marque le point de départ, tandis que מֵצַר évoque littéralement un lieu resserré et, par métaphore, la détresse. Cette formulation française exprime naturellement l’épreuve vécue sans effacer entièrement l’idée d’une situation qui enferme.
- source_word: קָרָאתִי
  choice: j’ai appelé
  rationale: Dans ce contexte de prière, קרא désigne l’appel adressé à Dieu. Le nom divin qui suit indique clairement le destinataire, sans qu’il soit nécessaire d’ajouter « au secours ».
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ est la forme poétique abrégée du nom divin. La translittération « Yah » en conserve la forme distincte ainsi que la répétition dans le verset.
- source_word: עָנָנִי
  choice: m’a répondu
  rationale: Le verbe avec son suffixe signifie directement « il m’a répondu » ; cette expression est idiomatique et exacte en français.
- source_word: בַמֶּרְחָב
  choice: en me mettant au large
  rationale: מֶרְחָב désigne un espace vaste, par opposition au lieu resserré évoqué au début. Cette tournure française préserve l’image spatiale tout en communiquant naturellement la délivrance. Le ב peut être compris comme locatif ou comme décrivant la manière ou l’effet de la réponse.
theological_decisions:
- issue: Rendu du nom divin abrégé יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: Le texte emploie deux fois la forme poétique abrégée יָהּ, et non le tétragramme complet. « Yah » respecte cette distinction lexicale et le parallélisme poétique sans imposer une substitution confessionnelle.
- issue: Rapport entre la réponse divine et le « large »
  choice: Yah m’a répondu en me mettant au large
  alternative: Yah m’a répondu depuis un vaste espace
  rationale: La construction hébraïque בַמֶּרְחָב admet plusieurs nuances syntaxiques. Le choix principal comprend le vaste espace comme l’effet libérateur de la réponse, en accord avec le contraste entre resserrement et largeur, tout en signalant en note une traduction plus littérale qui laisse davantage ouverte la valeur de la préposition.
translation_notes:
  register: Français international moderne, sobre et poétique. « Du fond de la détresse » est courant et digne ; « mettre au large » maintient le contraste spatial hébreu sans employer des termes archaïques comme « l’angoisse » au sens étymologique de resserrement.
