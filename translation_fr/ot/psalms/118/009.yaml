  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בִּ/נְדִיבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/009.yaml
  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: fr
  text: Mieux vaut trouver refuge en Yahweh que mettre sa confiance dans les nobles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes ». Le mot hébreu désigne des nobles ou des dirigeants de haut rang; « princes » est la traduction traditionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: L’adjectif prédicatif introduit une comparaison de valeur ou d’avantage; « Mieux vaut » est la tournure française naturelle et concise.
- source_word: לַחֲסוֹת
  choice: trouver refuge
  rationale: L’infinitif de חסה exprime le fait de chercher ou de prendre refuge; « trouver refuge » est idiomatique et conserve l’idée de protection et de confiance.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב indique celui en qui le refuge est recherché; le nom divin יהוה est translittéré « Yahweh ».
- source_word: מִבְּטֹחַ
  choice: que mettre sa confiance
  rationale: מן marque ici la comparaison, et בטח signifie se fier à quelqu’un ou placer en lui sa confiance. Cette formulation s’intègre naturellement à « Mieux vaut ».
- source_word: בִּנְדִיבִים
  choice: dans les nobles
  rationale: נְדִיבִים peut désigner des nobles, des princes ou des personnages éminents. « Nobles » garde la portée générale du terme dans ce contraste avec la confiance en Yahweh.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve ici le nom propre divin plutôt que de le remplacer par un titre.
translation_notes:
  register: Français international moderne, sobre et digne. La structure comparative concise du parallélisme hébreu est conservée, avec une formulation accessible à la lecture publique.
