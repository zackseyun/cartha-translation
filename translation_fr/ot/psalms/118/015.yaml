reference: Psalms 118:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֤וֹל רִנָּ֬ה וִֽ/ישׁוּעָ֗ה בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: fr
  text: 'Des cris de joie et de salut retentissent dans les tentes des justes : « La main droite de Yahweh accomplit des exploits ! »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « victoire » ou « délivrance » au lieu de « salut ».
    reason: lexical_alternative
  - marker: b
    text: 'Expression idiomatique hébraïque : « agit avec vaillance » ; on peut aussi traduire « agit avec puissance » ou « accomplit des actes puissants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רִנָּ֬ה
  choice: Des cris de joie retentissent
  rationale: קוֹל introduit ce qui se fait entendre, et רִנָּה désigne un cri jubilant. Le verbe « retentissent », ajouté naturellement en français, rend la force sonore de l’expression sans réduire celle-ci à une joie intérieure.
- source_word: וִֽישׁוּעָ֗ה
  choice: et de salut
  rationale: יְשׁוּעָה peut désigner le salut, la délivrance ou la victoire. « Salut » conserve l’ampleur du terme, tandis que les autres nuances sont signalées en note.
- source_word: בְּ/אָהֳלֵ֥י צַדִּיקִ֑ים
  choice: dans les tentes des justes
  rationale: La formulation garde l’image concrète des tentes et rend צַדִּיקִים par le substantif français courant « les justes ».
- source_word: יְמִ֥ין יְ֝הוָה
  choice: La main droite de Yahweh
  rationale: La métaphore corporelle exprime la puissance agissante de Dieu. Le nom divin יהוה est translittéré « Yahweh ».
- source_word: עֹ֣שָׂה חָֽיִל
  choice: accomplit des exploits
  rationale: L’expression idiomatique signifie agir avec force ou vaillance et peut évoquer des hauts faits victorieux. « Accomplit des exploits » est naturel, énergique et intelligible en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom d’alliance sans le remplacer par un titre.
- issue: Sens de יְשׁוּעָה dans un psaume de victoire
  choice: salut
  alternative: victoire ; délivrance
  rationale: « Salut » préserve la portée large du terme, qui englobe ici une intervention concrète de Dieu sans imposer exclusivement une lecture militaire.
- issue: Valeur de עֹשָׂה חָיִל
  choice: accomplit des exploits
  alternative: agit avec puissance ; fait preuve de vaillance
  rationale: Le choix restitue la vigueur et la dimension victorieuse de l’idiome tout en laissant la note présenter des équivalents plus formels.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La tournure « retentissent » explicite naturellement l’idée auditive portée par קוֹל. Les images concrètes (« tentes », « main droite ») et le parallélisme exclamatif sont conservés.
