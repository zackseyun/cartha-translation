source:
  edition: WLC
  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: fr
  text: C’est de Yahweh que cela provient[a] ; c’est une merveille à nos yeux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela vient de Yahweh » ou « Cela s’est produit de la part de Yahweh ».'
    reason: La construction hébraïque peut décrire l’origine d’une réalité ou la survenue d’un événement.
  - marker: b
    text: 'Ou : « c’est merveilleux à nos yeux ».'
    reason: Le terme hébreu peut être rendu par un nom (« une merveille ») ou par un adjectif (« merveilleux »).
lexical_decisions:
- source_word: מֵאֵת
  choice: de
  rationale: La préposition composée indique ici la source ou l’origine. « De » l’exprime naturellement en français sans ajouter l’image de la main, absente de la formulation hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: הָיְתָה זֹּאת
  choice: cela est venu
  rationale: La tournure hébraïque signifie littéralement « cela a été / est advenu ». Dans ce contexte, « cela est venu » garde à la fois l’idée d’un fait accompli et celle de son origine en Yahweh.
- source_word: הִיא נִפְלָאת
  choice: c’est une merveille
  rationale: Le pronom indépendant donne du relief à l’affirmation. La construction nominale française rend naturellement le caractère prodigieux exprimé par le nifal de פלא.
- source_word: בְּעֵינֵינוּ
  choice: à nos yeux
  rationale: Cette expression française correspond clairement à l’idiome hébreu et conserve le point de vue collectif des locuteurs.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le Tétragramme, nom personnel divin. Le rendre par « Yahweh » préserve cette donnée sans le remplacer par un titre.
- issue: Agent ou source de l’événement
  choice: C’est de Yahweh que cela est venu
  alternative: C’est Yahweh qui a fait cela
  rationale: L’hébreu marque explicitement la provenance, mais n’emploie pas ici un verbe signifiant « faire ». La traduction retenue évite de préciser davantage que le texte tout en affirmant l’origine divine.
translation_notes:
  register: Français international moderne, simple et digne. La mise en relief « C’est de Yahweh que… » reproduit l’accent placé sur l’origine divine, tandis que « à nos yeux » conserve l’image hébraïque sans paraître archaïque.
