    issue: Aspect verbal de אֲמִילַם
    rationale: Le verbe hébreu est à l’imparfait, non au parfait. Le passé composé « je les ai abattus » présente l’action comme achevée et efface la valeur dynamique/performative que conserve le refrain.
  - severity: low
    issue: Précision lexicale de « abattus »
    rationale: « Abattre » peut convenir dans un contexte hostile, mais ne reflète pas aussi nettement la lecture traditionnelle « couper/retrancher » de מול. Une note doit continuer de signaler que l’étymologie et le sens précis sont discutés.
