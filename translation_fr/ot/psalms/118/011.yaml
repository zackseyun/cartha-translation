  yaml_path: translation/ot/psalms/118/011.yaml
  text: They surrounded me[a], yes, they surrounded me[c][b]; in the name of Yahweh I cut them down.
translation:
  language: fr
  text: Ils m’ont encerclé, oui, ils m’ont encerclé ; au nom de Yahweh, je les taille en pièces.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je les repousse » ou « je les retranche ». Le sens précis du verbe hébreu est discuté ; il exprime une action décisive contre les assaillants.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוּנִי / סְבָבוּנִי
  choice: ils m’ont encerclé
  rationale: Les deux formes viennent de סבב et décrivent un encerclement hostile. La répétition est conservée pour rendre l’insistance poétique de l’hébreu.
- source_word: גַם
  choice: oui
  rationale: Dans cette reprise, גַם renforce l’affirmation plutôt qu’il n’ajoute simplement un élément ; « oui » en restitue naturellement la valeur emphatique.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom de Yahweh
  rationale: La préposition בְּ avec « nom » présente ici le nom divin comme l’autorité invoquée sous laquelle le psalmiste agit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération française usuelle « Yahweh », ce qui préserve le nom propre présent dans le texte hébreu.
- source_word: כִּי
  choice: sans équivalent autonome
  rationale: Dans le refrain poétique, כִּי a vraisemblablement une valeur assertive ou emphatique. Une traduction séparée par « car » alourdirait le français et risquerait d’imposer un rapport causal trop précis.
- source_word: אֲמִילַם
  choice: je les ai abattus
  rationale: La forme, généralement rattachée à מול au hiphil, exprime une action décisive contre les assaillants. « Abattus » conserve la force de l’image sans imposer littéralement l’idée physique de découpage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahweh » le conserve, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
- issue: Sens de אֲמִילַם
  choice: je les ai abattus
  alternative: je les ai repoussés / retranchés
  rationale: Le verbe est lexicalement discuté dans ce refrain. Le texte principal retient une action décisive contre les ennemis, tout en signalant en note des rendus moins spécifiquement létaux.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition hébraïque est maintenue, ainsi que le rythme bref des propositions. Le passé composé donne une narration naturelle en français contemporain.
