source:
  edition: WLC
  text: יְהוָ֣ה לִ֭/י לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה לִ֣/י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/006.yaml
  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
translation:
  language: fr
  text: Yahweh est pour moi ; je n’aurai pas peur. Que peut me faire un être humain[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Que me fera un être humain ? » Le singulier אָדָם désigne ici l’être humain de manière générique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לִי
  choice: est pour moi
  rationale: Dans cette déclaration de confiance, la préposition exprime le soutien et le fait de prendre parti pour quelqu’un.
- source_word: לֹא אִירָא
  choice: je n’aurai pas peur
  rationale: L’imparfait exprime ici une confiance tournée vers l’avenir ou une ferme résolution ; cette formulation est naturelle en français moderne.
- source_word: מַה יַעֲשֶׂה לִי
  choice: Que peut me faire
  rationale: Le texte dit littéralement « Que me fera… ? », mais la tournure avec « peut » restitue naturellement la portée rhétorique de la question.
- source_word: אָדָם
  choice: un être humain
  rationale: Le singulier est générique et désigne ici tout humain, en contraste avec Yahweh ; cette formulation moderne évite de faire croire qu’il s’agit exclusivement d’un homme de sexe masculin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte hébreu emploie le nom divin ; « Yahweh » le conserve comme nom propre sans le remplacer par un titre.
- issue: Portée rhétorique de מַה יַעֲשֶׂה לִי
  choice: Que peut me faire… ?
  alternative: Que me fera… ?
  rationale: « Peut » rend clairement en français la confiance exprimée face aux limites de l’action humaine, tandis qu’une note préserve la forme plus littérale.
- issue: Sens générique de אָדָם
  choice: un être humain
  alternative: l’homme
  rationale: Le mot est au singulier, mais sa référence est générique ; « un être humain » conserve cette portée sans introduire de restriction sexuelle.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme concis est conservé ; « je n’aurai pas peur » est plus idiomatique aujourd’hui que « je ne craindrai pas », sans affaiblir la déclaration de confiance.
