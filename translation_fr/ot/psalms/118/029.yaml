id: PSA.118.29
reference: Psalms 118:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce à Yahweh, car il est bon, car son amour fidèle dure pour toujours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « car pour toujours est son amour fidèle ».'
    reason: L’hébreu ne comporte pas de verbe correspondant explicitement à « dure » ; celui-ci est ajouté pour obtenir une formulation française naturelle.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Rendez grâce
  rationale: L’impératif pluriel hiphil de ידה appelle ici la communauté à exprimer sa reconnaissance et sa louange. « Rendez grâce » convient au refrain liturgique et reste naturel en français biblique moderne.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque le destinataire de l’action, et le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans l’hébreu.
- source_word: כִּי טוֹב
  choice: car il est bon
  rationale: כִּי introduit le motif de l’action de grâce. Le pronom et le verbe sont explicités conformément à l’usage naturel du français.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression indique une durée sans fin. « Pour toujours » conserve simplement la portée temporelle de l’hébreu.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement loyal et fidélité durable. « Amour fidèle » préserve ces dimensions sans imposer un vocabulaire confessionnel particulier.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le Tétragramme. La transcription « Yahweh » maintient sa fonction de nom propre et suit l’orientation fournie, sans le remplacer par un titre.
- issue: Valeur de חֶסֶד
  choice: amour fidèle
  alternative: bonté ; fidélité ; amour constant
  rationale: Le terme réunit plusieurs nuances que ne couvre entièrement aucun équivalent français unique. « Amour fidèle » conserve à la fois la bienveillance et la loyauté, tout en laissant ouverte l’étendue exacte de la notion.
translation_notes:
  register: Français international moderne, digne et liturgique. La répétition de « car » reproduit le parallélisme du verset, tandis que « dure » explicite sobrement la relation prédicative sous-entendue en hébreu.
