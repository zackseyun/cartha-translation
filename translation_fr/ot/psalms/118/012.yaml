source:
  edition: WLC
  text: סַבּ֤וּ/נִי כִ/דְבוֹרִ֗ים דֹּ֭עֲכוּ כְּ/אֵ֣שׁ קוֹצִ֑ים בְּ/שֵׁ֥ם יְ֝הוָ֗ה כִּ֣י אֲמִילַֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/012.yaml
  text: They surrounded me like bees[a]; they went out like a fire among thorns. In the name of Yahweh[b], I surely cut them down.
translation:
  language: fr
  text: Ils m’ont encerclé comme des abeilles ; ils se sont éteints comme un feu de ronces[a]. Au nom de Yahweh, oui, je les ai abattus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon l’analyse de l’expression hébraïque : « ils se sont éteints comme un feu parmi les ronces ». L’image condensée évoque un feu de broussailles épineuses qui flambe vite et s’éteint rapidement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je les ai retranchés ». Le verbe hébreu peut exprimer l’idée de couper, de retrancher ou d’abattre.'
    reason: alternative_reading
lexical_decisions:
- source_word: סַבּוּנִי
  choice: Elles m’ont encerclé
  rationale: Le verbe סבב signifie « entourer, encercler ». « Encerclé » exprime naturellement l’encerclement hostile et permet au pronom féminin de reprendre les nations du contexte.
- source_word: כִדְבוֹרִים
  choice: comme des abeilles
  rationale: La préposition כ introduit une comparaison. Cette formulation conserve l’image vive d’un essaim qui assaille de tous côtés.
- source_word: דֹּעֲכוּ
  choice: elles se sont éteintes
  rationale: דעך désigne l’extinction ou le fait de mourir, notamment pour un feu. Le verbe pronominal français convient à l’image explicitée dans la proposition suivante.
- source_word: כְּאֵשׁ קוֹצִים
  choice: comme un feu d’épines
  rationale: L’expression hébraïque, très condensée, désigne un feu alimenté par des épines, qui flambe vivement mais s’éteint vite. « Feu d’épines » reste proche de la forme hébraïque tout en étant intelligible.
- source_word: בְּשֵׁם יְהוָה
  choice: Au nom de Yahweh
  rationale: La formule exprime l’invocation du nom divin ou l’action accomplie sous son autorité. « Au nom de » est idiomatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom propre « Yahweh », et non remplacé par un titre.
- source_word: כִּי
  choice: oui
  rationale: Ici, כִּי renforce l’affirmation plutôt qu’il n’introduit clairement une cause. « Oui » restitue cette insistance sans alourdir la phrase.
- source_word: אֲמִילַם
  choice: je les ai abattues
  rationale: La forme hiphil de מול peut évoquer le fait de couper ou de retrancher. « Abattues » convient à des ennemis vaincus et maintient une nuance de coupe, sans imposer une précision absente de l’hébreu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme, nom personnel du Dieu d’Israël. Le conserver sous la forme « Yahweh » distingue le nom propre d’un simple titre.
- issue: Portée de l’action accomplie « au nom de Yahweh »
  choice: Formulation laissée ouverte entre invocation et autorité
  alternative: Par le nom de Yahweh
  rationale: La préposition ב peut signaler le moyen, l’autorité ou l’invocation. « Au nom de Yahweh » conserve cette amplitude sans préciser abusivement le mécanisme de la victoire.
translation_notes:
  register: Français international actuel, digne et accessible. La structure parallèle et les images concrètes de l’hébreu sont conservées. Le féminin pluriel renvoie naturellement aux nations mentionnées dans le contexte immédiat.
