  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: fr
  text: Ouvrez-moi les portes de la justice[a] ; j’entrerai par ces portes et je rendrai grâce à Yah[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les portes de la droiture ». Le mot hébreu peut évoquer la justice, la droiture ou ce qui est conforme au droit.
    reason: lexical_alternative
  - marker: b
    text: Ou « je louerai Yah ». Le verbe hébreu peut exprimer l’action de grâce ou la louange selon le contexte.
    reason: lexical_alternative
  - marker: c
    text: « Yah » est la forme abrégée du nom divin ; certaines traductions mettent « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Ouvrez
  rationale: Impératif qal masculin pluriel de פתח, rendu par l’impératif français direct et naturel.
- source_word: לִי
  choice: -moi
  rationale: La préposition ל avec suffixe de première personne peut signifier « à moi » ou « pour moi » ; avec « ouvrir », le pronom conjoint « -moi » est idiomatique.
- source_word: שַׁעֲרֵי צֶדֶק
  choice: les portes de la justice
  rationale: Le pluriel construit désigne des portes déterminées par le contexte. צֶדֶק couvre la justice, la droiture et ce qui est conforme au droit ; « justice » forme en français une expression naturelle sans réduire cette portée morale.
- source_word: אָבֹא בָם
  choice: j’y entrerai
  rationale: L’imparfait qal exprime ici l’action projetée après l’impératif. Le pronom adverbial « y » reprend naturellement les portes comme voie d’entrée, sans reproduire lourdement « par elles ».
- source_word: אוֹדֶה
  choice: je rendrai grâce à
  rationale: Le hiphil de ידה, dans ce contexte liturgique, désigne l’action de remercier ou de célébrer. « Rendre grâce à » conserve directement la nuance d’action de grâce tout en restant digne et courant.
- source_word: יָהּ
  choice: Yah
  rationale: Il s’agit de la forme abrégée du nom divin, distincte du tétragramme complet ; la translittération préserve cette forme précise.
theological_decisions:
- issue: Sens de צֶדֶק
  choice: justice
  alternative: droiture
  rationale: Le terme peut exprimer aussi bien la justice que la droiture. « Justice » convient à l’image des portes tout en laissant la note signaler l’autre nuance légitime.
- issue: Valeur de אוֹדֶה
  choice: je rendrai grâce à
  alternative: je louerai
  rationale: Le verbe peut désigner l’action de grâce ou la louange. Dans la formule adressée à Dieu, « rendre grâce » exprime plus directement sa valeur habituelle sans exclure la dimension de louange.
- issue: Rendu du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie ici la forme abrégée du nom divin ; la translittérer préserve une distinction présente dans le texte source.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure concise « Ouvrez-moi » et la reprise pronominale « j’y entrerai » évitent un calque pesant tout en conservant le mouvement à travers les portes. Les variantes lexicales réelles sont signalées sans trancher davantage que l’hébreu.
