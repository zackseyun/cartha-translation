source:
  edition: WLC
  text: יֹֽאמְרוּ נָ֭א יִרְאֵ֣י יְהוָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/004.yaml
  text: Let those who fear Yahweh now say[a], “His steadfast love endures forever.”
translation:
  language: fr
  text: 'Que ceux qui craignent Yahweh disent donc : « Son amour fidèle[a] dure pour toujours. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa fidélité à l’alliance dure pour toujours ». Le mot hébreu חֶסֶד évoque un amour loyal et fidèle, souvent lié à l’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Que ... le disent
  rationale: L’imparfait à valeur jussive exprime ici une invitation liturgique. La tournure française « Que ... le disent » en restitue naturellement la force exhortative.
- source_word: נָא
  choice: donc
  rationale: La particule renforce l’appel à prendre la parole. Dans ce refrain, « donc » rend cette insistance avec naturel, sans suggérer la politesse de « s’il vous plaît » ni imposer une valeur strictement temporelle.
- source_word: יִרְאֵי יְהוָה
  choice: ceux qui craignent Yahweh
  rationale: Cette expression désigne ceux qui vivent dans la crainte révérencielle de Yahweh. « Craignent » conserve le champ sémantique biblique, plus large que le seul respect.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: כִּי
  choice: le
  rationale: כִּי introduit ici le contenu de la proclamation. En français, le pronom « le » après « disent » annonce naturellement la citation sans ajouter un « car » ambigu.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression signifie « à jamais ». Avec חֶסֶד, le verbe explicité « dure » donne une phrase française claire tout en conservant l’idée de permanence.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe amour, loyauté et fidélité durable, souvent dans un cadre d’alliance. « Amour fidèle » en exprime les dimensions principales sans le réduire à la seule bonté ou miséricorde.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. Le transcrire préserve cette donnée au lieu de lui substituer un titre.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à l’alliance
  rationale: « Amour fidèle » conserve à la fois l’affection bienveillante et la loyauté durable. L’alternative met plus explicitement en avant l’alliance, mais risque de préciser davantage que ne le fait ce verset isolément.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le caractère liturgique de l’exhortation et du refrain, tout en évitant des tournures inutilement archaïques.
