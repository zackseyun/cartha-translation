  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: fr
  text: Rendez grâce à Yahweh[a], car il est bon, car son amour fidèle est éternel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte YHWH, nom divin traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « son amour d’alliance est éternel ». Le mot hébreu חֶסֶד évoque un amour bienveillant, loyal et durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Louez
  rationale: L’impératif pluriel de ידה au hifil exprime ici l’action de célébrer Dieu avec reconnaissance. « Louez » convient naturellement à ce refrain liturgique; « rendez grâce » reste une traduction possible.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: Le texte porte directement le nom divin יהוה. La translittération « Yahweh » le distingue d’un titre comme « le Seigneur ».
- source_word: כִּי טוֹב
  choice: car il est bon
  rationale: כִּי introduit le motif de l’appel à la louange, et טוֹב affirme simplement et largement la bonté de Dieu.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression signifie littéralement « à jamais ». L’ajout idiomatique de « dure » produit en français une proposition naturelle sans modifier le sens.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד associe bonté, attachement durable et fidélité relationnelle, souvent dans un cadre d’alliance. « Amour fidèle » conserve ces dimensions sans réduire le terme à la seule miséricorde.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. « Yahweh » le rend explicitement, tandis qu’une note signale la convention traditionnelle.
- issue: Portée de חֶסֶד
  choice: amour fidèle
  alternative: fidélité à son alliance
  rationale: « Amour fidèle » garde ensemble l’affection, la bonté et la constance du terme. La traduction plus explicite « fidélité à son alliance » est possible, mais elle précise davantage que ne le fait ce verset isolé.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « car » conserve le parallélisme et la cadence du refrain hébreu. « Louez » privilégie la force liturgique de הוֹדוּ; « rendez grâce » demeure possible.
