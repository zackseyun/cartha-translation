source:
  edition: WLC
  text: עָזִּ֣/י וְ/זִמְרָ֣ת יָ֑הּ וַֽ/יְהִי לִ֝֗/י לִֽ/ישׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/014.yaml
  text: Yah is my strength and song[a], and he has become my salvation.
translation:
  language: fr
  text: Yah[a] est ma force et mon chant, et il est devenu mon salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici « Yah », forme abrégée du nom divin, et non la forme complète rendue ailleurs par « le SEIGNEUR ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזִּי
  choice: ma force
  rationale: עֹז désigne couramment la force ou la puissance. « Ma force » est naturel en français et convient au parallélisme poétique.
- source_word: וְזִמְרָת
  choice: et mon chant
  rationale: זִמְרָה désigne ici le chant, dans la formule poétique également attestée en Exode 15.2 et Ésaïe 12.2. En français, le possessif est repris pour exprimer clairement la relation sous-entendue par la formule hébraïque.
- source_word: יָהּ
  choice: Yah
  rationale: Le texte porte la forme abrégée du nom divin, יָהּ, et non le tétragramme complet. La translittération « Yah » préserve cette distinction.
- source_word: וַיְהִי
  choice: il est devenu
  rationale: La forme verbale exprime un résultat accompli. « Il est devenu » conserve cette dynamique, contrairement à une simple copule comme « il est ».
- source_word: לִי
  choice: mon
  rationale: Littéralement « pour moi » ou « à moi » ; dans cette construction, le possessif français rend naturellement l’appropriation personnelle.
- source_word: לִישׁוּעָה
  choice: salut
  rationale: יְשׁוּעָה peut désigner le salut, la délivrance ou la victoire. « Salut » garde la portée large du terme tout en convenant au contexte de délivrance.
theological_decisions:
- issue: Représentation de la forme abrégée du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: « Yah » reproduit la forme poétique abrégée réellement présente dans le texte hébreu et évite de l’assimiler silencieusement au tétragramme complet.
translation_notes:
  register: Français international moderne, simple et digne. « Chant » est préféré à « cantique », plus marqué par le registre religieux traditionnel. Le parallélisme bref de l’hébreu est conservé.
