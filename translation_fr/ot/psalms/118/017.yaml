  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: fr
  text: Je ne mourrai pas, mais je vivrai et je raconterai les actes de Yah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yah » est la forme poétique abrégée du nom divin en hébreu ; beaucoup de traductions rendent ce nom plus généralement par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: Je ne mourrai pas
  rationale: La négation לֹא porte directement sur l’imparfait qal à la première personne אָמוּת. Le futur français exprime ici la déclaration confiante du psalmiste.
- source_word: כִּי אֶחְיֶה
  choice: mais je vivrai
  rationale: Dans ce parallélisme antithétique, כִּי introduit naturellement le contraste avec « je ne mourrai pas ». « Mais » rend ce mouvement plus clairement en français que le causal « car », tout en maintenant l’opposition poétique.
- source_word: וַאֲסַפֵּר
  choice: et je raconterai
  rationale: Le piel de ספר signifie raconter, relater ou proclamer. « Raconterai » conserve l’idée de faire connaître par le récit les actions divines.
- source_word: מַעֲשֵׂי
  choice: les œuvres
  rationale: Le pluriel construit de מַעֲשֶׂה désigne les actions ou réalisations de Dieu. « Œuvres » est naturel dans ce registre, digne et suffisamment large pour ne pas préciser indûment la nature de ces actes.
- source_word: יָהּ
  choice: Yah
  rationale: יָהּ est la forme poétique abrégée du nom divin. La translittération « Yah » préserve cette forme particulière au lieu de la normaliser en un titre.
theological_decisions:
- issue: Rendu du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie la forme poétique abrégée יָהּ, et non le tétragramme complet יְהוָה. « Yah » respecte cette distinction formelle; une note indique le rendu traditionnel plus général.
translation_notes:
  register: Français international moderne, simple et digne. La répétition des futurs maintient la force de la déclaration et le contraste poétique de l’hébreu.
