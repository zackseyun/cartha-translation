  text: יֹֽאמַר נָ֥א יִשְׂרָאֵ֑ל כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/002.yaml
  text: Let Israel now say[b][a], “His steadfast love endures forever.”
translation:
  language: fr
  text: 'Qu’Israël le dise maintenant[a] : « Son amour fidèle dure pour toujours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’Israël dise donc ». La particule hébraïque ajoute ici de l’insistance à l’exhortation.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « Car son amour fidèle est pour toujours » ou « que son amour fidèle est pour toujours ». La particule hébraïque peut introduire le contenu de la proclamation ou avoir une nuance causale. Le mot traduit par « amour fidèle » peut également évoquer la bonté, la miséricorde et l’amour loyal manifesté dans une relation d’alliance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמַר
  choice: Qu’… le dise
  rationale: L’imparfait à valeur jussive exprime ici une exhortation collective. « Qu’Israël le dise » est naturel en français et le pronom « le » annonce la confession citée.
- source_word: נָא
  choice: maintenant
  rationale: La particule renforce l’appel et lui donne un caractère pressant ; « maintenant » convient au cadre liturgique sans introduire la politesse suggérée par « s’il vous plaît ».
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française usuelle et désigne collectivement le peuple.
- source_word: כִּי
  choice: Oui
  rationale: Dans le refrain, כִּי peut introduire le contenu de la proclamation, tout en gardant une nuance affirmative ou causale. « Oui » rend bien l’acclamation en français ; les autres analyses sont signalées en note.
- source_word: לְעוֹלָם
  choice: dure pour toujours
  rationale: L’expression indique une durée sans fin. Avec חֶסֶד, la formulation verbale « dure pour toujours » produit un refrain français naturel.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד évoque ici un amour bienveillant, constant et loyal, notamment dans la relation d’alliance. « Amour fidèle » en conserve l’essentiel dans un français moderne et accessible.
theological_decisions:
- issue: Traduction de חֶסֶד dans un refrain célébrant la fidélité de Dieu
  choice: amour fidèle
  alternative: bonté ; amour d’alliance ; miséricorde
  rationale: « Amour fidèle » exprime à la fois la bienveillance et la constance relationnelle du terme sans réduire celui-ci à la seule compassion ni expliciter davantage que l’hébreu la notion d’alliance.
- issue: Fonction de כִּי dans la confession
  choice: 'particule affirmative introduisant la citation : « Oui »'
  alternative: 'conjonction causale : « car » ; introducteur de contenu : « que »'
  rationale: La syntaxe du refrain permet plusieurs nuances. Le texte principal adopte une acclamation française naturelle, tandis que la note préserve l’ambiguïté réelle entre affirmation, cause et contenu cité.
translation_notes:
  register: Français international moderne, digne et adapté à une proclamation liturgique. Le tour « Qu’Israël le dise maintenant » conserve l’exhortation, et la citation brève garde le rythme du refrain hébreu.
