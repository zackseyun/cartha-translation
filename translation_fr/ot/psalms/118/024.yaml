source:
  edition: WLC
  text: זֶה הַ֭/יּוֹם עָשָׂ֣ה יְהוָ֑ה נָגִ֖ילָה וְ/נִשְׂמְחָ֣ה בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/024.yaml
  text: This is the day that Yahweh has made; let us rejoice and be glad in it.
translation:
  language: fr
  text: C’est le jour que Yahweh a fait ; réjouissons-nous et soyons dans la joie en ce jour !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: Voici le jour
  rationale: Le démonstratif זֶה avec le nom défini הַיּוֹם désigne avec insistance le jour présent. « Voici le jour » est naturel et solennel en français, tout en conservant cette valeur déictique.
- source_word: עָשָׂה
  choice: a fait
  rationale: Le qal accompli de עשה décrit l’action accomplie de Yahweh. « A fait » reste proche du sens large du verbe et convient à « jour » comme complément.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre, afin de préserver le nom divin présent dans l’hébreu.
- source_word: נָגִילָה
  choice: réjouissons-nous
  rationale: La forme cohortative à la première personne du pluriel exprime une exhortation collective. L’impératif français à la première personne du pluriel en restitue naturellement la force.
- source_word: וְנִשְׂמְחָה
  choice: et soyons dans l’allégresse
  rationale: Le second cohortatif est coordonné au premier. Cette formulation préserve le parallélisme ainsi qu’une nuance distincte, sans simplement répéter « réjouissons-nous ».
- source_word: בּוֹ
  choice: en ce jour
  rationale: Le suffixe masculin singulier renvoie le plus naturellement à הַיּוֹם, « le jour ». La reprise explicite évite en français l’expression peu naturelle « en lui » et conserve le référent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve sa fonction de nom propre sans lui substituer un titre.
- issue: Référent de בּוֹ
  choice: en ce jour
  alternative: en lui
  rationale: Le pronom suffixe peut être masculin en hébreu, mais son antécédent contextuel immédiat et naturel est « le jour ». Le français explicite ce référent sans introduire une lecture christologique ou personnelle absente de la formulation immédiate.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref et exhortatif du verset est conservé ; le point d’exclamation rend l’élan des deux cohortatifs sans ajouter de contenu.
