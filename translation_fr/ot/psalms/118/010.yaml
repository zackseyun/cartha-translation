  text: All the nations surrounded me; in the name of the LORD, I surely cut them off.
translation:
  language: fr
  text: Toutes les nations m’ont entouré ; au nom du SEIGNEUR, oui, je les retranche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Toutes les nations
  rationale: Rend directement l’expression universelle hébraïque sans ajouter « païennes », terme qui introduirait une nuance absente du texte.
- source_word: סְבָבוּנִי
  choice: m’encerclaient
  rationale: Le verbe סבב avec suffixe de première personne décrit ici des peuples entourant le psalmiste de manière hostile ; l’imparfait français convient au tableau narratif.
- source_word: בְּשֵׁם יְהוָה
  choice: au nom du SEIGNEUR
  rationale: Expression idiomatique fidèle indiquant que l’action est accomplie en invoquant l’autorité et l’aide de YHWH ; « SEIGNEUR » suit la convention française traditionnelle pour le tétragramme.
- source_word: כִּי
  choice: oui
  rationale: Dans ce refrain, כִּי renforce l’affirmation plutôt qu’il n’introduit clairement une cause ; « oui » conserve cette valeur emphatique en français naturel.
- source_word: אֲמִילַם
  choice: je les taille en pièces
  rationale: La forme issue de מול évoque littéralement l’action de couper ou retrancher. Dans ce contexte de combat, cette formulation conserve l’image tranchante et la déclaration énergique, sans employer le peu naturel « je les circoncis ».
theological_decisions:
- issue: Valeur temporelle et modale de אֲמִילַם
  choice: je les taille en pièces
  alternative: je les taillerai en pièces
  rationale: L’imparfait hébreu peut exprimer une action en cours, répétée ou assurée. Le présent français garde la vigueur du refrain et laisse ouverte la tension entre récit du combat et assurance de victoire.
translation_notes:
  register: Français moderne, rythmé et solennel. Le parallélisme et l’intensification du second membre sont conservés ; aucune précision doctrinale extérieure au texte n’est ajoutée.
