source:
  edition: WLC
  text: אֵלִ֣/י אַתָּ֣ה וְ/אוֹדֶ֑/ךָּ אֱ֝לֹהַ֗/י אֲרוֹמְמֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: fr
  text: Tu es mon Dieu, et je te rendrai grâce[a] ; mon Dieu, je t’exalterai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te louerai » ; dans les psaumes, le verbe peut exprimer à la fois l’action de grâce et la louange.
    reason: lexical_alternative
  - marker: b
    text: Ou « je te célébrerai ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי
  choice: mon Dieu
  rationale: אֵל avec le suffixe de première personne du singulier signifie ici « mon Dieu » dans une adresse directe. Cette formulation est naturelle en français et convient au parallélisme poétique.
- source_word: אַתָּה
  choice: tu es
  rationale: Le pronom indépendant forme avec אֵלִי une proposition nominale, littéralement « mon Dieu, toi ». En français, « Tu es mon Dieu » en restitue clairement le sens et l’accent.
- source_word: וְאוֹדֶךָ
  choice: et je te rendrai grâce
  rationale: La forme hifil de ידה désigne couramment l’action de rendre grâce dans les psaumes, tout en pouvant inclure une nuance de louange. « Je te rendrai grâce » conserve aussi explicitement l’objet à la deuxième personne.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Cette seconde adresse divine est parallèle à אֵלִי. Répéter « mon Dieu » préserve le parallélisme et l’expression personnelle du texte hébreu.
- source_word: אֲרוֹמְמֶךָ
  choice: je t’exalterai
  rationale: Le verbe רום exprime ici l’idée d’élever ou d’exalter dans un contexte de louange. « Exalter » garde la métaphore et demeure digne et idiomatique en français.
theological_decisions:
- issue: Rendu des titres divins אֵלִי et אֱלֹהַי
  choice: mon Dieu… mon Dieu
  alternative: mon Dieu puissant… mon Dieu ; mon Dieu… mon Puissant
  rationale: Les deux formes sont des adresses directes au Dieu d’Israël. Les rendre de la même manière respecte leur parallélisme et évite d’introduire une distinction théologique que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’adresse directe à Dieu dans le registre biblique français. Le futur préserve la valeur volitive ou déclarative des formes verbales hébraïques sans trancher davantage leur nuance.
