source:
  edition: WLC
  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: fr
  text: Voici la porte de Yahweh[a] ; les justes entreront par elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la porte pour Yahweh » ou « la porte qui mène à Yahweh ». La préposition hébraïque peut exprimer l’appartenance, la relation ou la direction ; « de Yahweh » paraît ici convenir le mieux au contexte.
    reason: alternative lexicale et ambiguïté de la préposition hébraïque
lexical_decisions:
- source_word: זֶה
  choice: Voici
  rationale: Le démonstratif identifie la porte montrée. « Voici » rend cette désignation directe de façon naturelle et solennelle en français.
- source_word: הַשַּׁעַר
  choice: la porte
  rationale: שַׁעַר désigne concrètement une porte ou un portail ; « porte » conserve l’image et convient au contexte cultuel et processionnel.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: La préposition ל peut exprimer l’appartenance, la relation ou la destination. Ici, « de Yahweh » exprime naturellement une porte qui lui appartient ou qui lui est associée, sans effacer les autres possibilités signalées en note.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L’adjectif substantivé au pluriel désigne les personnes caractérisées par la justice. « Les justes » est idiomatique, concis et fidèle.
- source_word: יָבֹאוּ
  choice: entreront
  rationale: L’imparfait qal de בוא peut ici exprimer l’avenir ou une certitude modale. Avec une porte, « entreront » est précis et naturel.
- source_word: בוֹ
  choice: par elle
  rationale: La préposition ב avec une porte indique le passage par celle-ci. « Par elle » est idiomatique en français et reprend correctement le féminin « porte ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » conserve le nom divin personnel sans substituer un titre.
- issue: Portée de la préposition ל dans לַיהוָה
  choice: de Yahweh
  alternative: pour Yahweh ; qui mène à Yahweh
  rationale: La construction peut marquer l’appartenance ou la relation, mais aussi la destination. « De Yahweh » convient le mieux au contexte immédiat tout en laissant l’ambiguïté authentique visible dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » garde la force démonstrative du verset ; le point-virgule préserve le parallélisme entre l’identification de la porte et l’entrée des justes.
