id: PSA.118.16
reference: Psalms 118:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְמִ֣ין יְ֭הוָה רוֹמֵמָ֑ה יְמִ֥ין יְ֝הוָה עֹ֣שָׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/016.yaml
  text: The right hand of Yahweh is exalted[b][a]; the right hand of Yahweh does valiantly.
translation:
  language: fr
  text: La main droite de Yahweh est élevée[a] ; la main droite de Yahweh accomplit des exploits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’élève », « est exaltée » ou « triomphe ». Le verbe hébreu évoque l’élévation et peut, dans ce contexte, suggérer le triomphe.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fait vaillance » ; on peut aussi traduire « déploie sa puissance », « agit puissamment » ou « remporte la victoire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמִין
  choice: main droite
  rationale: Le nom désigne littéralement la main droite ou le côté droit. « Main droite » conserve l’image poétique qui évoque ici la puissance et l’intervention victorieuse de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: רוֹמֵמָה
  choice: est élevée
  rationale: Cette forme exprime le fait d’être en hauteur ou exalté. « Est élevée » respecte son accord avec « main droite », son caractère statif et le parallélisme poétique, sans imposer l’interprétation plus explicite « triomphe ».
- source_word: עֹשָׂה חָיִל
  choice: accomplit des exploits
  rationale: L’expression idiomatique associe le verbe « faire, agir » à un nom évoquant force, vaillance et capacité. « Accomplit des exploits » rend naturellement en français une action puissante et victorieuse.
theological_decisions:
- issue: Langage anthropomorphique décrivant l’action divine
  choice: Conserver littéralement l’image de la « main droite » comme expression de la puissance et de l’intervention victorieuse de Yahweh.
  alternative: La puissance de Yahweh est exaltée ; Yahweh agit avec puissance.
  rationale: L’image concrète appartient pleinement à la poésie hébraïque et possède de nombreux échos bibliques. La remplacer par une abstraction affaiblirait le texte.
- issue: Portée de רוֹמֵמָה
  choice: Traduire par « est élevée » et signaler les nuances possibles en note.
  alternative: « s’élève », « est exaltée » ou « triomphe »
  rationale: Le contexte célèbre la victoire, mais le verbe conserve une image de hauteur ou d’élévation. La traduction principale préserve cette tension sans réduire le mot au seul sens de triomphe.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition de « la main droite de Yahweh » reproduit le parallélisme emphatique de l’hébreu. « Accomplit des exploits » rend l’idiome de façon naturelle sans effacer sa tonalité victorieuse.
