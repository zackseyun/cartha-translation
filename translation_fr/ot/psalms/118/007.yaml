  text: Yahweh is among my helpers[b][a]; I myself will look on my haters.
translation:
  language: fr
  text: Yahweh est parmi ceux qui m’aident[a] ; moi, je regarderai ceux qui me haïssent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh est pour moi, parmi ceux qui m’aident. » La construction hébraïque peut souligner que Yahweh se tient aux côtés de ceux qui aident le psalmiste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je verrai ceux qui me haïssent », voire « je contemplerai la défaite de ceux qui me haïssent ». L’expression hébraïque peut évoquer le fait d’assister à la chute de ses adversaires, sans la mentionner explicitement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est rendu par sa translittération usuelle en français, plutôt que remplacé par un titre.
- source_word: לִי בְּעֹזְרָי
  choice: est parmi ceux qui m’aident
  rationale: Cette formulation conserve le pluriel de עֹזְרָי et la construction avec בְּ, tout en donnant un français naturel. Le rapport exprimé par לִי demeure perceptible dans « m’aident » et l’autre analyse possible est signalée en note.
- source_word: וַאֲנִי
  choice: moi, je
  rationale: La dislocation française rend naturellement la présence du pronom indépendant et son relief, sans emphase excessive.
- source_word: אֶרְאֶה בְשֹׂנְאָי
  choice: je regarderai ceux qui me haïssent
  rationale: « Regarder » avec son objet préserve autant que possible l’image hébraïque sans expliciter dans le texte principal le malheur ou la défaite des adversaires.
- source_word: שֹׂנְאָי
  choice: ceux qui me haïssent
  rationale: Cette expression est plus naturelle en français moderne que « mes haineux » et reste plus précise que le terme général « mes ennemis ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin. Sa translittération préserve ce nom au lieu de lui substituer un titre.
- issue: Portée de la vision des adversaires
  choice: Ne pas préciser leur défaite dans le texte principal
  alternative: je verrai la défaite de ceux qui me haïssent
  rationale: L’idiome peut suggérer que le psalmiste assistera à leur chute, mais le complément précis de la vision n’est pas exprimé dans l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. « Moi, je » restitue naturellement le relief du pronom hébreu. La proposition finale reste volontairement proche et légèrement ouverte afin de préserver l’implicite de l’idiome.
