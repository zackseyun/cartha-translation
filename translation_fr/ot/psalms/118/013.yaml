source:
  edition: WLC
  text: דַּחֹ֣ה דְחִיתַ֣/נִי לִ/נְפֹּ֑ל וַ֖/יהוָ֣ה עֲזָרָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/013.yaml
  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: fr
  text: Tu m’as poussé avec violence pour me faire tomber[a], mais[b] Yahweh m’a secouru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Poussant, tu m’as poussé », tournure emphatique qui peut aussi se rendre par « tu m’as poussé de toutes tes forces ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « et Yahweh m’a secouru ». La conjonction hébraïque signifie aussi simplement « et », bien que le contexte favorise ici le sens contrastif « mais ».'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: Tu m’as poussé avec violence
  rationale: L’infinitif absolu suivi du verbe conjugué forme une tournure emphatique. « Avec violence » en restitue naturellement l’intensité en français sans reproduire lourdement la répétition hébraïque.
- source_word: לִנְפֹּל
  choice: pour me faire tomber
  rationale: L’infinitif construit avec ל peut exprimer le but ou le résultat visé. Cette formulation française reste naturelle et conserve l’idée que la poussée devait provoquer la chute.
- source_word: וַיהוָה
  choice: mais Yahweh
  rationale: La conjonction ו signifie fondamentalement « et », mais le contexte oppose nettement l’agression à l’intervention de Yahweh ; « mais » rend cette valeur contrastive.
- source_word: עֲזָרָנִי
  choice: m’a secouru
  rationale: Le verbe עזר signifie aider ou porter secours. « M’a secouru » convient au contexte de danger immédiat et demeure direct et courant.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom divin יהוה. La translittération « Yahweh » conserve le nom propre plutôt que de lui substituer un titre.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit la deuxième personne masculine singulière de l’hébreu. La formulation conserve l’intensité de l’attaque et le contraste avec le secours divin.
