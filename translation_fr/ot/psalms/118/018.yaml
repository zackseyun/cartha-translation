  text: יַסֹּ֣ר יִסְּרַ֣/נִּי יָּ֑הּ וְ֝/לַ/מָּ֗וֶת לֹ֣א נְתָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/018.yaml
  text: Yah has surely disciplined me[a], but he has not given me over to death.
translation:
  language: fr
  text: Yah[a] m’a bel et bien corrigé, mais il ne m’a pas livré à la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le SEIGNEUR ». « Yah » est la forme poétique abrégée du nom divin en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: m’a bel et bien corrigé
  rationale: L’infinitif absolu placé devant le verbe conjugué renforce l’affirmation. « Bel et bien » restitue cette insistance en français naturel, tandis que « corrigé » conserve la nuance éducative de יסר sans lui donner un sens exclusivement punitif.
- source_word: יָּהּ
  choice: Yah
  rationale: Il s’agit de la forme poétique abrégée du nom divin. La translittération « Yah » préserve cette particularité du texte hébreu.
- source_word: וְלַמָּוֶת לֹא נְתָנָנִי
  choice: mais il ne m’a pas livré à la mort
  rationale: Dans ce contexte négatif, וְ introduit un contraste avec la correction évoquée auparavant. נתן avec un complément personnel et לַמָּוֶת exprime l’idée de livrer quelqu’un à la mort.
theological_decisions:
- issue: Traduction de la forme courte du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: « Yah » maintient la distinction lexicale entre cette forme poétique courte et le tétragramme complet. La note fournit la traduction traditionnelle sans imposer une interprétation doctrinale.
translation_notes:
  register: Français moderne, courant et digne. « Bel et bien » rend l’emphase hébraïque sans lourdeur; « livré à la mort » conserve l’image de la remise au pouvoir de la mort.
