  yaml_path: translation/ot/psalms/118/025.yaml
  text: Please, LORD, save us! Please, LORD, grant us success[a]!
translation:
  language: fr
  text: De grâce, SEIGNEUR, sauve-nous ! De grâce, SEIGNEUR, fais-nous réussir[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En hébreu, les impératifs n’ont pas de complément exprimé ; « nous » est ajouté d’après le contexte de la prière communautaire.
    reason: implicit_object
lexical_decisions:
- source_word: אָנָּא … נָּא
  choice: De grâce
  rationale: Rend l’insistance suppliante de la particule hébraïque sans lui donner à tort un sens temporel comme « maintenant ».
- source_word: יְהוָה
  choice: SEIGNEUR
  rationale: Convention française digne et courante pour représenter le nom divin YHWH.
- source_word: הוֹשִׁיעָה
  choice: sauve-nous
  rationale: L’impératif signifie « sauve »; « nous » explicite l’objet implicite suggéré par le cadre communautaire du psaume.
- source_word: הַצְלִיחָה
  choice: accorde-nous la réussite
  rationale: Exprime l’idée causative de faire réussir ou prospérer, avec le même objet communautaire implicite que dans le premier membre.
theological_decisions:
- issue: Objet non exprimé des deux impératifs
  choice: Fournir « nous » dans les deux membres et signaler cet ajout par une note
  alternative: Traduire littéralement « sauve » et « accorde la réussite » sans objet
  rationale: Le contexte est une prière communautaire; l’ajout produit un français naturel tout en préservant la transparence sur ce que l’hébreu laisse implicite.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « De grâce, SEIGNEUR » conserve le parallélisme et l’intensité de la supplication hébraïque.
