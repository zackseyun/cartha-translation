source:
  edition: WLC
  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/008.yaml
  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: fr
  text: Mieux vaut trouver refuge en Yahweh que mettre sa confiance dans l’être humain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’humanité » ou « dans les humains » ; l’hébreu emploie un terme générique singulier désignant l’être humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Mieux vaut
  rationale: L’adjectif prédicatif introduit une comparaison. « Mieux vaut » est la tournure française naturelle et concise correspondante.
- source_word: לַחֲסוֹת
  choice: trouver refuge
  rationale: Le verbe חסה évoque le fait de chercher ou trouver protection auprès de quelqu’un. « Trouver refuge » conserve l’image concrète d’un abri protecteur.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition désigne celui auprès de qui le refuge est trouvé; le nom divin יהוה est translittéré « Yahweh ».
- source_word: מִבְּטֹחַ
  choice: que mettre sa confiance
  rationale: La préposition מן avec l’infinitif marque ici la comparaison. « Mettre sa confiance » rend naturellement le sens de בטח et maintient le parallélisme avec « trouver refuge ».
- source_word: בָּאָדָם
  choice: dans l’être humain
  rationale: אָדָם est ici un singulier générique désignant l’humanité ou les humains en contraste avec Yahweh. « L’être humain » préserve le singulier générique sans donner au français moderne un sens exclusivement masculin.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom divin plutôt que de le remplacer par un titre.
- issue: Portée générique de אָדָם
  choice: l’être humain
  alternative: l’homme
  rationale: Le nom singulier a ici une valeur générique et oppose la confiance placée en Dieu à celle placée dans les humains. « L’être humain » exprime cette portée en français moderne tout en conservant le singulier.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure comparative et le contraste entre refuge en Yahweh et confiance humaine sont conservés.
