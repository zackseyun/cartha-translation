  terminology: « L’Éternel » est un rendu français établi et acceptable de יהוה dans ce registre. « Dieu », « sacrifice de la fête », « cordes » et « cornes de l’autel » sont exacts et cohérents avec le vocabulaire cultuel. Le choix interprétatif « sacrifice de la fête » reste explicitement signalé comme tel par la note.
