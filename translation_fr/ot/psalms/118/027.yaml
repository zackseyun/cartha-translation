source:
  edition: WLC
  text: אֵ֤ל יְהוָה֮ וַ/יָּ֪אֶר לָ֥/נוּ אִסְרוּ חַ֥ג בַּ/עֲבֹתִ֑ים עַד קַ֝רְנ֗וֹת הַ/מִּזְבֵּֽחַ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/027.yaml
  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: fr
  text: L’Éternel est Dieu, et il nous a éclairés.[a] Attachez le sacrifice de la fête[b] avec des cordes,[c] jusqu’aux cornes de l’autel.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a brillé sur nous ». Le verbe hébreu peut évoquer soit la lumière que Dieu donne, soit sa faveur qui rayonne sur son peuple.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Attachez la fête ». Ici, « fête » peut désigner par association le sacrifice offert à cette occasion. D’autres comprennent qu’il s’agit de la fête elle-même ou de son cortège.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « avec de grosses cordes ». Certains proposent « avec des branches », mais le sens « cordes » est lexicalement plus probable.'
    reason: lexical_alternative
  - marker: d
    text: L’expression « jusqu’aux cornes de l’autel » est difficile à interpréter. Elle peut signifier que le sacrifice doit être attaché aux cornes de l’autel ou conduit jusque-là.
    reason: translation_clarity
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: L’Éternel est Dieu
  rationale: La proposition nominale identifie YHWH comme Dieu. « L’Éternel » est la forme française traditionnelle et intelligible pour le tétragramme, tandis que אֵל est rendu comme nom attribut.
- source_word: וַיָּאֶר לָנוּ
  choice: et il nous a donné la lumière
  rationale: Le hifil de אור signifie couramment « donner de la lumière, éclairer ». Cette formulation conserve la valeur causative tout en laissant ouverte l’idée de lumière concrète ou de faveur divine.
- source_word: אִסְרוּ
  choice: Attachez
  rationale: L’impératif pluriel de אסר signifie « attacher, lier ». « Attachez » convient naturellement à un sacrifice et à des cordes.
- source_word: חַג
  choice: le sacrifice de la fête
  rationale: חַג désigne normalement une fête, mais le verbe « attacher » et la mention de l’autel favorisent ici un emploi métonymique désignant le sacrifice offert lors de la fête.
- source_word: בַּעֲבֹתִים
  choice: avec des cordes
  rationale: Le terme désigne le plus naturellement des cordes ou des liens épais. « Cordes » rend le sens lexical sans imposer l’interprétation moins probable « branches ».
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: jusqu’aux cornes de l’autel
  rationale: « Jusqu’aux » reproduit la valeur de עַד. Les « cornes » sont les saillies situées aux angles de l’autel.
theological_decisions:
- issue: Référent cultuel de חַג dans l’ordre d’attacher
  choice: le sacrifice de la fête
  alternative: la fête ; le cortège de la fête
  rationale: Le cadre cultuel, l’action d’attacher et la mention de l’autel rendent probable une référence métonymique à la victime sacrificielle. Une note conserve toutefois l’ambiguïté réelle du texte hébreu.
- issue: Sens de la lumière donnée par Dieu
  choice: il nous a donné la lumière
  alternative: il a fait briller sa lumière sur nous
  rationale: La traduction retenue préserve la forme causative sans déterminer si la lumière est littérale, salvatrice ou une image de la faveur divine.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe demeure proche de l’hébreu, tandis que les notes signalent les principales ambiguïtés lexicales et cultuelles sans les résoudre abusivement.
