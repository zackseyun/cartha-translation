  text: אֶ֭בֶן מָאֲס֣וּ הַ/בּוֹנִ֑ים הָ֝יְתָ֗ה לְ/רֹ֣אשׁ פִּנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/022.yaml
  text: The stone the builders rejected has become the cornerstone[a][b].
translation:
  language: fr
  text: La pierre que les bâtisseurs ont rejetée est devenue la pierre d’angle[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la tête de l’angle ».'
    reason: lexical_alternative
  - marker: b
    text: Ce verset est repris dans le Nouveau Testament à propos du Messie, le Christ (par exemple en Matthieu 21.42 ; Actes 4.11 ; 1 Pierre 2.7).
    reason: cross_reference
lexical_decisions:
- source_word: אֶבֶן
  choice: pierre
  rationale: Le nom courant désigne une pierre. « Pierre » conserve naturellement la métaphore architecturale sans préciser indûment sa taille ni sa fonction.
- source_word: מָאֲסוּ
  choice: ont rejetée
  rationale: Le verbe מאס exprime ici un rejet délibéré. L’accord du participe passé avec « pierre », antéposé comme complément d’objet direct, respecte la syntaxe française.
- source_word: הַבּוֹנִים
  choice: les bâtisseurs
  rationale: Le participe substantivé désigne ceux qui bâtissent. « Les bâtisseurs » est actuel, clair et légèrement plus idiomatique dans ce contexte métaphorique que « ceux qui construisent ».
- source_word: הָיְתָה
  choice: est devenue
  rationale: Le parfait hébreu présente le renversement comme accompli, avec un état résultant. Le passé composé français rend naturellement cette valeur.
- source_word: לְרֹאשׁ פִּנָּה
  choice: la pierre d’angle
  rationale: L’expression signifie littéralement « tête de l’angle ». « Pierre d’angle » est l’équivalent architectural français traditionnel et intelligible, tout en évitant de trancher entre diverses identifications techniques possibles de cette pierre.
theological_decisions:
- issue: Usage messianique ou christologique ultérieur du verset
  choice: Conserver dans le texte principal la métaphore architecturale et son renversement, sans expliciter une identification messianique.
  alternative: Introduire directement dans le verset une lecture christologique fondée sur ses citations dans le Nouveau Testament.
  rationale: Le texte hébreu ne nomme pas le Messie. La traduction préserve donc son sens propre et son ouverture, tandis qu’une note signale honnêtement sa réception dans le Nouveau Testament.
translation_notes:
  register: Français international moderne, naturel et digne. « Bâtisseurs » maintient la force de la métaphore ; « pierre d’angle » conserve l’expression architecturale reçue sans surinterprétation technique ou doctrinale.
