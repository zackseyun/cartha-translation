source:
  edition: WLC
  text: בָּר֣וּךְ הַ֭/בָּא בְּ/שֵׁ֣ם יְהוָ֑ה בֵּ֝רַֽכְנוּ/כֶ֗ם מִ/בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: fr
  text: Béni soit celui qui vient au nom de Yahweh[a] ! Nous vous[b] bénissons de la maison de Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « au nom de » peut aussi évoquer l’autorité de Yahweh ou le fait de venir comme son représentant.
    reason: lexical_alternative
  - marker: b
    text: Le pronom « vous » est pluriel en hébreu.
    reason: grammatical_clarification
  - marker: c
    text: Ce verset est repris dans le Nouveau Testament à propos de l’entrée de Jésus à Jérusalem (Matthieu 21.9 ; Marc 11.9 ; Luc 19.38 ; Jean 12.13). La traduction conserve ici la formulation du psaume sans y intégrer explicitement cette application ultérieure.
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: La forme passive exprime ici une formule de bénédiction. « Béni soit » est naturel en français liturgique et laisse entendre une proclamation ou un souhait sans trancher excessivement entre les deux.
- source_word: הַבָּא
  choice: celui qui vient
  rationale: Le participe substantivé masculin singulier signifie littéralement « celui qui vient ». Cette formulation française est idiomatique et conserve le genre grammatical du texte hébreu.
- source_word: בְּשֵׁם
  choice: au nom de
  rationale: Cette expression transparente conserve la formulation hébraïque tout en permettant les nuances d’autorité, de représentation ou d’invocation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: בֵּרַכְנוּכֶם
  choice: Nous vous bénissons
  rationale: Le parfait avec suffixe de deuxième personne masculine plurielle peut avoir ici une valeur performative dans un cadre liturgique. Le présent français rend naturellement cette bénédiction prononcée.
- source_word: מִבֵּית
  choice: depuis la maison de
  rationale: « Depuis » exprime clairement le lieu d’où la bénédiction est prononcée, tandis que « maison » préserve l’expression hébraïque sans expliciter « temple » dans le corps du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le nom divin. Sa transcription préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Référence immédiate ou messianique de « celui qui vient »
  choice: Conserver une formule générale de bénédiction dans le texte principal
  alternative: Rendre explicitement la formule comme un titre messianique
  rationale: Dans le psaume, la formulation peut accueillir celui qui arrive au nom de Yahweh. Son application ultérieure à Jésus dans le Nouveau Testament ne doit pas être importée dans la traduction du texte hébreu, même si celle-ci reste pleinement compatible avec cette lecture.
- issue: Nombre du destinataire dans בֵּרַכְנוּכֶם
  choice: Signaler en note que « vous » est pluriel
  alternative: Expliciter dans le texte par « vous tous »
  rationale: Le suffixe hébreu est pluriel, mais « vous » suffit naturellement en français. La note préserve l’information grammaticale sans alourdir la formule liturgique.
translation_notes:
  register: Français moderne, digne et liturgique sans archaïsme marqué. « Béni soit » conserve la force traditionnelle de l’acclamation ; « celui qui vient » suit précisément le participe masculin singulier. La ponctuation distingue l’acclamation initiale de la bénédiction collective prononcée depuis la maison de Yahweh.
