id: PSA.91.3
reference: Psalms 91:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: fr
  text: Car c’est lui qui te délivrera du piège de l’oiseleur, de la peste dévastatrice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du fléau destructeur » ou « de la peste qui cause la ruine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement de l’assurance exprimée dans le contexte précédent. « Car » en conserve clairement la valeur explicative.
- source_word: הוּא
  choice: c’est lui qui
  rationale: Le pronom indépendant met le sujet en relief. La tournure française « c’est lui qui » rend cette insistance sans lourdeur.
- source_word: יַצִּילְךָ
  choice: te délivrera
  rationale: Le hiphil de נצל exprime l’action d’arracher ou de sauver quelqu’un d’un danger. « Te délivrera » convient au registre poétique et à la promesse de protection.
- source_word: מִפַּח
  choice: du piège
  rationale: פַּח désigne un piège ou un lacet. « Piège » est précis, naturel en français moderne et ne précise pas indûment la forme du dispositif.
- source_word: יָקוּשׁ
  choice: de l’oiseleur
  rationale: Le terme désigne celui qui tend des pièges, notamment aux oiseaux. « Oiseleur » est concis, exact et bien établi dans ce contexte poétique.
- source_word: מִדֶּבֶר
  choice: de la peste
  rationale: דֶּבֶר désigne fréquemment une épidémie meurtrière ou un fléau. « Peste » garde la gravité concrète du terme sans le réduire nécessairement à une maladie moderne précise.
- source_word: הַוּוֹת
  choice: dévastatrice
  rationale: Le mot évoque les ravages, la ruine ou la destruction. L’adjectif « dévastatrice » s’accorde naturellement avec « peste » tout en préservant cette force.
theological_decisions:
- issue: Nature des dangers évoqués
  choice: Conserver les images concrètes du piège et de la peste sans décider si elles doivent aussi être comprises symboliquement.
  alternative: Limiter le verset soit à des dangers physiques strictement littéraux, soit à des dangers spirituels entièrement métaphoriques.
  rationale: L’hébreu nomme des menaces concrètes, tandis que la poésie permet qu’elles représentent plus largement les dangers dont Dieu délivre. La traduction ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Oiseleur » conserve la concision et la couleur poétique du texte; le reste de la formulation demeure immédiatement accessible.
