  text: כִּ֤י בִ֣/י חָ֭שַׁק וַ/אֲפַלְּטֵ֑/הוּ אֲ֝שַׂגְּבֵ֗/הוּ כִּֽי יָדַ֥ע שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/014.yaml
  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: fr
  text: Puisqu’il s’attache à moi[a], je le délivrerai ; je le mettrai à l’abri, sur les hauteurs[b], puisqu’il connaît mon nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « puisqu’il m’aime » ou « puisqu’il a tourné vers moi toute son affection ». Le verbe hébreu exprime un attachement profond et ferme.
    reason: lexical_alternative
  - marker: b
    text: Ou « je le placerai sur les hauteurs » ou « je le protégerai ». Le verbe hébreu évoque le fait de placer quelqu’un dans un lieu élevé et inaccessible, donc sûr.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: puisque
  rationale: Aux deux occurrences, la conjonction introduit la raison de l’action divine. « Puisque » exprime naturellement cette valeur causale en français.
- source_word: בִי חָשַׁק
  choice: il s’attache à moi
  rationale: Le verbe חָשַׁק avec la préposition ב exprime un attachement fort orienté vers Dieu. Cette formulation préserve à la fois l’affection et l’idée d’un lien ferme.
- source_word: וַאֲפַלְּטֵהוּ
  choice: je le délivrerai
  rationale: Le verbe פלט au piel annonce ici l’intervention de Dieu pour tirer quelqu’un du danger. « Délivrer » est clair, digne et courant dans ce contexte.
- source_word: אֲשַׂגְּבֵהוּ
  choice: je le mettrai en sécurité, bien en haut
  rationale: Le verbe שׂגב évoque une position élevée et inaccessible, donc sûre. La traduction conserve l’image spatiale tout en rendant explicite sa portée protectrice.
- source_word: יָדַע
  choice: connaît
  rationale: Le qatal motive la promesse divine et désigne une connaissance personnelle de Dieu. Le présent français convient à cet état durable sans en préciser excessivement la nature.
- source_word: שְׁמִי
  choice: mon nom
  rationale: La formulation littérale préserve l’expression hébraïque, qui peut englober l’identité et le caractère révélé de Dieu sans les développer dans le texte.
theological_decisions:
- issue: Langage d’attachement à Dieu
  choice: « il s’attache à moi »
  alternative: « il m’aime » ou « il a mis en moi toute son affection »
  rationale: Le choix retenu garde l’image d’un lien fort et ne réduit pas חָשַׁק au seul sentiment amoureux ou affectif.
- issue: Métaphore protectrice de אֲשַׂגְּבֵהוּ
  choice: « je le mettrai en sécurité, bien en haut »
  alternative: « je le protégerai » ou « je l’élèverai »
  rationale: Cette formulation maintient la sécurité procurée par une hauteur inaccessible, sans confondre cette image avec une exaltation de statut.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme causal est conservé par la répétition de « puisqu’il », et l’image de la hauteur protectrice reste perceptible sans tournure archaïque.
