id: PSA.91.9
reference: Psalms 91:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: fr
  text: Car toi, Yahvé, tu es mon refuge[a] ; tu as fait du Très-Haut ta demeure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation courante de l’hébreu difficile : « Car tu as dit : “Yahvé est mon refuge”, et tu as fait du Très-Haut ta demeure. »'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement de la protection annoncée dans le contexte ; « car » conserve la valeur causale avec un registre poétique naturel.
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom indépendant de deuxième personne du masculin singulier est rendu explicitement pour préserver son caractère emphatique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre, dans la forme française courante.
- source_word: מַחְסִי
  choice: mon refuge
  rationale: מַחְסֶה désigne un lieu où l’on cherche protection ; « refuge » convient au vocabulaire de protection des Psaumes.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Rend le titre divin par sa formulation française traditionnelle et immédiatement compréhensible.
- source_word: שַׂמְתָּ
  choice: tu as fait
  rationale: Le qal accompli de שׂים peut exprimer ici le fait de choisir ou d’établir quelque chose comme demeure ; cette tournure s’accorde naturellement avec le complément.
- source_word: מְעוֹנֶךָ
  choice: ta demeure
  rationale: מָעוֹן signifie « demeure, habitation » ; « demeure » est concis, actuel et distinct de « refuge ».
theological_decisions:
- issue: Syntaxe du locuteur et du destinataire en Psaumes 91.9
  choice: 'Adresse directe : « Car toi, Yahvé, tu es mon refuge ; tu as fait du Très-Haut ta demeure. »'
  alternative: '« Car tu as dit : “Yahvé est mon refuge”, et tu as fait du Très-Haut ta demeure. »'
  rationale: Le texte massorétique ne comporte aucun verbe correspondant à « tu as dit » et passe de « mon refuge » à « ta demeure ». Le texte principal conserve cette formulation resserrée sans ajouter de verbe, tandis que la construction courante avec « tu as dit » est signalée en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et poétique. Le point-virgule clarifie les deux membres de la phrase sans résoudre la difficulté syntaxique de l’hébreu.
