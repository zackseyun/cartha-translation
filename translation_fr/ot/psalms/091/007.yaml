  text: יִפֹּ֤ל מִ/צִּדְּ/ךָ֨ אֶ֗לֶף וּ/רְבָבָ֥ה מִ/ימִינֶ֑/ךָ אֵ֝לֶ֗י/ךָ לֹ֣א יִגָּֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/007.yaml
  text: A thousand may fall at your side[a], and ten thousand at your right hand[b], but it will not come near you.
translation:
  language: fr
  text: 'Mille peuvent tomber à tes côtés, et dix mille à ta droite[a] : cela ne s’approchera pas de toi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Mille tomberont à tes côtés, et dix mille à ta droite. » Dans ce contexte poétique, les formes verbales hébraïques peuvent exprimer le futur ou une possibilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « [il] ne s’approchera pas de toi ». Le sujet n’est pas exprimé en hébreu ; le contexte suggère la menace ou le fléau évoqué dans le psaume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפֹּל
  choice: peuvent tomber
  rationale: L’imparfait qal de נפל peut avoir ici une valeur modale ou future. « Peuvent tomber » conserve la possibilité évoquée dans cette affirmation poétique sans imposer une prédiction strictement déterministe.
- source_word: מִצִּדְּךָ
  choice: à tes côtés
  rationale: La préposition מִן exprime ici la position par rapport à la personne auprès de laquelle on tombe. « À tes côtés » est l’expression française naturelle tout en maintenant l’image spatiale.
- source_word: אֶלֶף
  choice: mille
  rationale: Le nombre cardinal est rendu directement afin de préserver le parallélisme et la progression numérique du vers.
- source_word: וּרְבָבָה
  choice: et dix mille
  rationale: רְבָבָה désigne couramment dix mille, ou par extension une multitude. Le nombre précis préserve ici l’intensification poétique après « mille ».
- source_word: מִימִינֶךָ
  choice: à ta droite
  rationale: La tournure française restitue naturellement la relation spatiale exprimée par l’hébreu et maintient le parallélisme avec « à tes côtés ».
- source_word: אֵלֶיךָ
  choice: de toi
  rationale: Avec נגשׁ, אֶל indique un mouvement en direction de quelqu’un. Dans « s’approcher de toi », le français emploie naturellement la préposition « de ».
- source_word: לֹא יִגָּשׁ
  choice: cela ne s’approchera pas
  rationale: Le verbe signifie « s’approcher » et son sujet n’est pas exprimé. Le démonstratif neutre « cela » permet de renvoyer à la menace présente dans le contexte sans la définir plus précisément que le texte hébreu.
theological_decisions:
- issue: Sujet implicite de la dernière proposition
  choice: Employer le pronom neutre « cela », renvoyant de manière non spécifique à la menace ou au fléau du contexte.
  alternative: Nommer explicitement « le malheur », « le fléau » ou « la peste ».
  rationale: L’hébreu ne nomme pas le sujet du verbe יִגָּשׁ. Le français exige normalement un sujet explicite ; « cela » produit une phrase naturelle tout en évitant de réduire l’ambiguïté contextuelle à une menace déterminée.
- issue: Valeur des imparfaits hébreux
  choice: Rendre le premier par une modalité (« peuvent tomber ») et le dernier par le futur (« ne s’approchera pas »).
  alternative: 'Rendre les deux comme des futurs : « tomberont » et « ne s’approchera pas ».'
  rationale: Dans ce contexte poétique, le premier imparfait peut présenter une éventualité extrême autour du destinataire, tandis que le dernier énonce l’assurance centrale. Une note conserve explicitement la lecture future possible du premier.
translation_notes:
  register: Français international actuel, simple et digne. Le parallélisme numérique et spatial est conservé. « À tes côtés » privilégie l’idiome français naturel, tandis que « à ta droite » maintient l’image hébraïque. Les notes signalent les deux principales ambiguïtés sans imposer une lecture confessionnelle.
