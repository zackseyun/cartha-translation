  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: fr
  text: Tu fouleras le lion et le cobra[a] ; tu piétineras le jeune lion et le serpent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « l’aspic ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le dragon ». Le terme hébreu peut désigner ailleurs un grand reptile ou une créature marine ; ici, « serpent » convient bien à la série d’animaux terrestres dangereux.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל
  choice: sur
  rationale: Préposition spatiale introduisant les animaux foulés aux pieds ; « sur » est l’équivalent français naturel avec « marcher ».
- source_word: שַׁחַל
  choice: lion
  rationale: Terme poétique désignant le lion ; le nom simple reste clair et digne sans ajouter une nuance de férocité qui n’a pas besoin d’être explicitée.
- source_word: פֶתֶן
  choice: cobra
  rationale: Désigne un serpent venimeux, traditionnellement rendu par « aspic ». « Cobra » est plus immédiatement compréhensible en français moderne tout en conservant l’image d’un serpent mortel.
- source_word: תִּדְרֹךְ
  choice: tu marcheras
  rationale: Imparfait qal, deuxième personne masculine singulière, de דרך, au sens de fouler ou marcher sur. La formulation est naturelle et garde le parallélisme poétique.
- source_word: תִּרְמֹס
  choice: tu piétineras
  rationale: Imparfait qal, deuxième personne masculine singulière, de רמס. « Piétiner » marque une action plus énergique que « marcher sur » et rend l’intensification du second membre.
- source_word: כְּפִיר
  choice: jeune lion
  rationale: Désigne habituellement un lion jeune et vigoureux plutôt qu’un tout petit lionceau.
- source_word: תַנִּין
  choice: serpent
  rationale: Le mot peut désigner selon les contextes un grand reptile, un monstre marin ou un dragon. Dans cette série d’animaux terrestres dangereux, « serpent » s’intègre le mieux au parallélisme, sans effacer l’autre possibilité, signalée en note.
theological_decisions:
- issue: Faut-il rendre תַנִּין par une désignation zoologique (« serpent ») ou par l’image traditionnelle et symbolique du « dragon » ?
  choice: serpent
  alternative: dragon
  rationale: Le contexte associe le terme au lion, au cobra et au jeune lion, ce qui favorise ici la lecture zoologique. La possibilité « dragon », ancienne et porteuse d’une résonance symbolique, demeure authentique et est donc conservée en note plutôt qu’exclue.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé grâce à « marcheras » puis « piétineras », ce dernier verbe renforçant le premier. Le tutoiement correspond à la deuxième personne masculine singulière de l’hébreu.
