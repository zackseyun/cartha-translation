id: PSA.91.15
reference: Psalms 91:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: fr
  text: Il fera appel à moi, et je lui répondrai ; je suis avec lui dans la détresse ; je le délivrerai[a] et je l’honorerai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je le secourrai ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je le glorifierai ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Il fera appel à moi
  rationale: Le verbe קרא avec Dieu comme objet exprime ici l’appel ou l’invocation. « Faire appel à moi » est naturel en français moderne et convient au contexte de la prière.
- source_word: וְאֶעֱנֵהוּ
  choice: et je lui répondrai
  rationale: ענה signifie directement « répondre ». Cette formulation conserve le lien clair entre l’appel de l’être humain et la réponse divine.
- source_word: עִמּוֹ אָנֹכִי
  choice: je suis avec lui
  rationale: La proposition hébraïque affirme la présence divine, avec une certaine emphase due à l’ordre des mots. Le présent français restitue naturellement cette affirmation sans ajouter d’intensif absent du texte.
- source_word: בְצָרָה
  choice: dans la détresse
  rationale: צָרָה désigne une situation de détresse, d’angoisse ou d’adversité. « Dans la détresse » est clair, digne et suffisamment fort.
- source_word: אֲחַלְּצֵהוּ
  choice: je le délivrerai
  rationale: Au piel, חלץ peut exprimer le fait d’arracher quelqu’un au danger, de le secourir ou de le délivrer. « Délivrer » garde l’idée d’une intervention active sans préciser un danger particulier que le texte ne nomme pas.
- source_word: וַאֲכַבְּדֵהוּ
  choice: et je l’honorerai
  rationale: Le piel de כבד peut signifier « honorer » ou « glorifier ». Puisque le bénéficiaire est ici la personne protégée, « honorer » est la formulation française la plus naturelle, tandis que l’autre possibilité est conservée en note.
theological_decisions:
- issue: Présentation des promesses divines sans ajouter de conditions
  choice: 'Conserver la succession directe : réponse, présence, délivrance et honneur'
  alternative: Expliciter une condition de fidélité préalable
  rationale: Ce verset énonce les actions de Dieu envers celui qui l’appelle sans formuler ici de condition supplémentaire. La traduction n’ajoute donc aucun cadre doctrinal absent de l’hébreu.
- issue: Valeur de la présence divine dans la détresse
  choice: « je suis avec lui dans la détresse »
  alternative: « je serai avec lui dans la détresse »
  rationale: La proposition nominale hébraïque affirme littéralement la présence de Dieu. Le présent préserve cette force immédiate, même si le contexte de promesses permettrait aussi un futur en français.
translation_notes:
  register: Français international moderne, accessible et digne. Le rythme en quatre affirmations est maintenu au moyen de points-virgules. Les marqueurs de notes sont placés immédiatement après les termes auxquels leurs variantes se rapportent.
