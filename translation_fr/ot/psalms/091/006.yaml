  text: מִ֭/דֶּבֶר בָּ/אֹ֣פֶל יַהֲלֹ֑ךְ מִ֝/קֶּ֗טֶב יָשׁ֥וּד צָהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/006.yaml
  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: fr
  text: ni la peste qui marche dans l’obscurité[a], ni le fléau qui ravage en plein midi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épidémie qui marche dans les ténèbres » ; le terme rendu par « peste » peut aussi désigner une épidémie. Le terme rendu par « fléau » peut désigner la destruction ou un fléau meurtrier.
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: peste
  rationale: Le terme désigne couramment une peste ou une épidémie meurtrière. « Peste » est clair, actuel et convient au parallélisme poétique.
- source_word: בָּאֹפֶל
  choice: dans l’obscurité
  rationale: אֹפֶל évoque l’obscurité profonde ou les ténèbres. Cette formulation conserve l’image sans la préciser excessivement.
- source_word: יַהֲלֹךְ
  choice: rôde
  rationale: Le verbe signifie littéralement « marcher, aller ». « Rôde » rend naturellement en français la personnification d’une menace qui se déplace dans l’obscurité.
- source_word: קֶּטֶב
  choice: fléau
  rationale: Le mot peut évoquer la destruction, la ruine ou un fléau meurtrier, peut-être pestilentiel. « Fléau » préserve cette amplitude et forme un parallèle naturel avec « peste ».
- source_word: יָשׁוּד
  choice: ravage
  rationale: Le verbe exprime une action dévastatrice. « Ravage » est vif, naturel et restitue la force destructive du terme.
- source_word: צָהֳרָיִם
  choice: en plein midi
  rationale: Le nom signifie « midi ». « En plein midi » souligne avec naturel le contraste poétique entre l’obscurité et la pleine lumière du milieu du jour.
- source_word: מִן
  choice: ni
  rationale: La préposition signifie littéralement « de, loin de », mais elle poursuit ici l’énumération des dangers dont le fidèle n’a pas à craindre. « Ni » assure en français la continuité syntaxique avec le verset précédent.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La personnification poétique est conservée par « rôde » et « ravage ». « Fléau » maintient l’ambiguïté de קֶטֶב au lieu de le limiter avec certitude à une maladie.
