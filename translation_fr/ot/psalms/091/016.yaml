  text: אֹ֣רֶךְ יָ֭מִים אַשְׂבִּיעֵ֑/הוּ וְ֝/אַרְאֵ֗/הוּ בִּֽ/ישׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/016.yaml
  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: fr
  text: Je le rassasierai de longs jours[a] et je lui ferai voir mon salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « d’une longue vie ». Littéralement : « de longueur de jours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: de longs jours
  rationale: Cette formulation conserve l’image hébraïque de la « longueur des jours » tout en restant naturelle et digne en français. « D’une longue vie » serait plus explicite, mais atténuerait la texture de l’expression source.
- source_word: אַשְׂבִּיעֵהוּ
  choice: Je le rassasierai
  rationale: Le hiphil de שׂבע exprime le fait de combler ou de rassasier quelqu’un. « Rassasier » préserve l’image forte du texte et convient au complément « de longs jours ».
- source_word: וְאַרְאֵהוּ
  choice: et je lui ferai voir
  rationale: Le hiphil de ראה signifie « faire voir » ou « montrer ». Cette traduction conserve explicitement la valeur causative du verbe et l’action divine.
- source_word: בִּישׁוּעָתִי
  choice: mon salut
  rationale: יְשׁוּעָה peut désigner aussi bien la délivrance face au danger que le salut dans un sens plus large. « Mon salut » conserve cette amplitude sémantique.
theological_decisions:
- issue: Portée de יְשׁוּעָה dans la conclusion d’un psaume de protection
  choice: mon salut
  alternative: ma délivrance
  rationale: Dans ce contexte, le mot peut évoquer un secours concret, sans exclure une portée théologique plus vaste. « Mon salut » maintient cette tension au lieu de la restreindre à une délivrance temporelle.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme est conservé, ainsi que l’image concrète de satiété appliquée à la durée des jours.
