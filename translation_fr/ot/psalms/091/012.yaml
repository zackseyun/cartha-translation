source:
  edition: WLC
  text: עַל כַּפַּ֥יִם יִשָּׂא֑וּ/נְ/ךָ פֶּן תִּגֹּ֖ף בָּ/אֶ֣בֶן רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/012.yaml
  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: fr
  text: Ils te porteront sur leurs mains[a], de peur que ton pied ne heurte une pierre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur leurs paumes ». Le verbe peut aussi se traduire par « ils te soulèveront » ou « ils te soutiendront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: sur leurs mains
  rationale: La préposition עַל et le duel כַּפַּיִם expriment l’image d’une personne portée sur les paumes ou les mains. « Sur leurs mains » est naturel en français et conserve l’image concrète.
- source_word: יִשָּׂאוּנְךָ
  choice: ils te porteront
  rationale: Le verbe נָשָׂא peut signifier « soulever », « porter » ou « emporter ». Ici, « porter » rend clairement l’action protectrice sans ajouter un mouvement ascendant non exigé par le texte.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: פֶּן introduit une conséquence que l’action précédente vise à éviter. La tournure française « de peur que… ne » préserve cette valeur préventive avec un registre digne et courant.
- source_word: תִּגֹּף
  choice: heurte
  rationale: Le verbe נָגַף décrit ici le choc du pied contre une pierre. « Heurte » conserve cette idée sans transformer explicitement le choc en trébuchement ou en chute.
- source_word: בָּאֶבֶן
  choice: une pierre
  rationale: Avec נָגַף, la préposition ב marque ce contre quoi le pied vient buter. En français, le verbe « heurter » prend directement son complément; le nom a ici un sens indéfini.
- source_word: רַגְלֶךָ
  choice: ton pied
  rationale: Le substantif hébreu est au singulier avec un suffixe masculin singulier. Le français emploie naturellement le singulier dans cette expression.
theological_decisions:
- issue: Formulation traditionnelle ou idiome français moderne
  choice: Ils te porteront sur leurs mains
  alternative: Ils te soulèveront sur leurs paumes
  rationale: La formulation choisie traduit directement l’image protectrice de l’hébreu dans un français moderne, sans archaïsme et sans imposer au verbe une nuance ascendante qui demeure seulement possible.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « de peur que… ne » garde la valeur négative de פֶּן; le « ne » est ici explétif et n’ajoute pas une seconde négation.
