source:
  edition: WLC
  text: כִּ֣י מַ֭לְאָכָי/ו יְצַוֶּה לָּ֑/ךְ לִ֝/שְׁמָרְ/ךָ֗ בְּ/כָל דְּרָכֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/011.yaml
  text: For he will command his angels concerning you[b][a], to guard you in all your ways.
translation:
  language: fr
  text: Car il donnera à ses anges l’ordre de veiller sur toi[a], afin qu’ils te gardent[b] dans toutes tes voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «pour toi». La construction hébraïque peut marquer aussi bien la personne concernée que celle au bénéfice de laquelle l’ordre est donné.
    reason: lexical_alternative
  - marker: b
    text: Ou «de te protéger». Le verbe hébreu peut aussi être rendu par «garder» ou «veiller sur».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’assurance exprimée précédemment et convient au mouvement poétique du psaume.
- source_word: מַלְאָכָיו
  choice: ses anges
  rationale: Le contexte évoque des êtres célestes chargés de protéger; «anges» est donc plus naturel ici que le sens général «messagers».
- source_word: יְצַוֶּה
  choice: il donnera ordre
  rationale: Le piel exprime le fait de donner un ordre. Cette tournure est naturelle en français et conserve la force du verbe hébreu.
- source_word: לָּךְ
  choice: à ton sujet
  rationale: Avec צוה, le complément désigne ici la personne concernée par l’ordre, plutôt que son destinataire. «Pour toi» reste possible et met davantage en relief le bénéfice.
- source_word: לִשְׁמָרְךָ
  choice: de te garder
  rationale: שׁמר exprime l’action de garder, protéger ou veiller sur quelqu’un; «garder» reste proche de la forme hébraïque et convient au contexte protecteur.
- source_word: בְּכָל
  choice: sur tous
  rationale: Avec «chemins», la préposition française «sur» rend idiomatiquement la sphère dans laquelle s’exerce la protection, tandis que «tous» conserve la portée exhaustive.
- source_word: דְּרָכֶיךָ
  choice: tes chemins
  rationale: Préserve l’image hébraïque, susceptible de désigner aussi bien les déplacements concrets que le cours de la vie.
theological_decisions:
- issue: Référent du sujet implicite du verbe masculin singulier
  choice: Dieu est celui qui donne ordre à ses anges.
  alternative: Laisser le pronom «il» sans expliciter son antécédent dans ce verset isolé.
  rationale: Dans le contexte du psaume, le sujet renvoie naturellement au Seigneur, protecteur de la personne interpellée. La traduction conserve toutefois le pronom du texte hébreu plutôt que d’insérer explicitement «Dieu».
translation_notes:
  register: Français moderne, naturel et digne. Le tutoiement correspond à la deuxième personne du singulier de l’hébreu. «Donnera ordre» évite la tournure moins idiomatique «commandera à ses anges à ton sujet», tandis que «tes chemins» maintient la métaphore poétique et son amplitude.
