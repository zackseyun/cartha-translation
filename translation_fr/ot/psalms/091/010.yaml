id: PSA.91.10
reference: Psalms 91:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תְאֻנֶּ֣ה אֵלֶ֣י/ךָ רָעָ֑ה וְ֝/נֶ֗גַע לֹא יִקְרַ֥ב בְּ/אָהֳלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/010.yaml
  text: No harm will happen to you[b][a], and no plague will come near your tent.
translation:
  language: fr
  text: Aucun mal ne t’arrivera[a], et aucun fléau n’approchera de ta tente[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aucun malheur ne te frappera. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ton habitation ». La « tente » peut désigner plus largement le foyer ou le lieu où l’on demeure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאֻנֶּה
  choice: n’arrivera
  rationale: Le verbe אנה exprime ici ce qui arrive ou échoit à quelqu’un. « Arriver » est naturel en français moderne et s’accorde bien avec « mal ».
- source_word: רָעָה
  choice: mal
  rationale: Dans ce contexte de protection, le terme désigne un malheur ou un dommage subi, sans devoir être limité au mal moral. « Mal » conserve utilement cette ampleur.
- source_word: נֶגַע
  choice: fléau
  rationale: נגע peut désigner une atteinte, une plaie ou un fléau. « Fléau » convient au contexte des menaces mortelles du psaume tout en maintenant une certaine largeur sémantique.
- source_word: יִקְרַב
  choice: n’approchera
  rationale: Cette formulation rend directement le qal de קרב et préserve l’image spatiale de la menace qui ne vient pas à proximité.
- source_word: אָהֳלֶךָ
  choice: ta tente
  rationale: Le sens concret est « tente ». Cette image hébraïque est conservée dans le texte, avec une note indiquant son emploi possible au sens plus large d’habitation.
- source_word: אֵלֶיךָ
  choice: t’arrivera
  rationale: La préposition אֶל marque ici la direction vers le destinataire. En français, le pronom indirect intégré à « arriver » rend naturellement cette relation.
theological_decisions:
- issue: Nature de la protection promise
  choice: Conserver l’affirmation poétique directe de la protection divine.
  alternative: Préciser qu’il s’agit soit d’une garantie absolue contre toute souffrance physique, soit d’une protection uniquement spirituelle.
  rationale: L’hébreu formule une promesse sans développer ses limites ni résoudre la tension biblique plus large concernant la souffrance. La traduction ne doit pas ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est préservé, ainsi que l’image concrète de la tente. « Mal » et « fléau » maintiennent la portée poétique sans surinterprétation.
