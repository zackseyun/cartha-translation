id: PSA.91.5
reference: Psalms 91:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: fr
  text: Tu ne craindras ni la terreur de la nuit[a], ni la flèche qui vole de jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’effroi de la nuit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: tu ne craindras
  rationale: Le qal inaccompli à la 2e personne masculine singulière avec לֹא exprime ici naturellement une assurance tournée vers l’avenir, plutôt qu’un ordre explicite.
- source_word: פַּחַד
  choice: la terreur
  rationale: Le nom désigne une frayeur intense ou ce qui inspire l’effroi; « terreur » conserve la force concrète de la menace.
- source_word: לָיְלָה
  choice: de la nuit
  rationale: Cette formulation française naturelle préserve le parallélisme poétique entre la nuit et le jour.
- source_word: חֵץ
  choice: la flèche
  rationale: Le sens ordinaire est celui d’une flèche; l’image concrète doit être conservée même si elle peut évoquer plus largement un danger.
- source_word: יָעוּף
  choice: qui vole
  rationale: Le qal inaccompli de עוּף signifie « voler » et forme naturellement une relative qualifiant la flèche.
- source_word: יוֹמָם
  choice: en plein jour
  rationale: L’adverbe signifie « de jour »; « en plein jour » est idiomatique et fait nettement ressortir le contraste poétique avec la nuit.
- source_word: מִן ... מִן
  choice: ni ... ni
  rationale: Après « craindre », le français n’a pas besoin de reproduire littéralement les deux prépositions; la coordination négative rend clairement les deux objets de la crainte.
theological_decisions:
- issue: Faut-il rendre le verset comme un ordre ou comme une promesse?
  choice: 'Assurance : « Tu ne craindras »'
  alternative: 'Ordre : « Ne crains pas »'
  rationale: לֹא suivi de l’inaccompli se lit le plus naturellement ici comme une assurance concernant la personne placée sous la protection de Dieu. La formulation conserve toutefois la proximité sémantique avec une exhortation sans transformer explicitement le texte en impératif.
translation_notes:
  register: Français moderne, international et digne. Le futur « tu ne craindras » préserve la valeur d’assurance du texte hébreu. « En plein jour » rend le contraste nocturne/diurne avec naturel, sans expliciter la nature éventuellement métaphorique des menaces.
