  text: בְּ/אֶבְרָת֨/וֹ יָ֣סֶךְ לָ֭/ךְ וְ/תַֽחַת כְּנָפָ֣י/ו תֶּחְסֶ֑ה צִנָּ֖ה וְֽ/סֹחֵרָ֣ה אֲמִתּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: fr
  text: Il te couvrira de ses plumes, et sous ses ailes tu trouveras refuge. Sa fidélité est un bouclier et une cuirasse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Sa vérité est un bouclier et une cuirasse. » Le second terme hébreu, rendu par « cuirasse », est rare et son sens précis est incertain; on le traduit aussi par « rempart » ou « petit bouclier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: De ses plumes
  rationale: אֶבְרָה désigne le plumage ou les grandes plumes d’un oiseau. « Plumes » conserve l’image aviaire dans un français naturel; « pennes » serait plus précis, mais peu courant.
- source_word: יָסֶךְ
  choice: il te couvrira
  rationale: Le hifil de סכך exprime l’action de couvrir et, par là, de protéger. « Couvrira » reste proche de l’image de l’oiseau.
- source_word: לָךְ
  choice: te
  rationale: Le pronom hébreu est au féminin singulier, mais l’identité de la personne interpellée n’étant pas explicitée dans ce verset, le français ne marque pas ici son genre.
- source_word: כְּנָפָיו
  choice: ses ailes
  rationale: כָּנָף signifie naturellement « aile » dans cette métaphore aviaire.
- source_word: תֶּחְסֶה
  choice: tu trouveras refuge
  rationale: חסה signifie se réfugier ou chercher refuge. Cette formulation est idiomatique et exprime la sécurité obtenue sans effacer l’idée de refuge.
- source_word: צִנָּה
  choice: un grand bouclier
  rationale: צִנָּה désigne souvent un grand bouclier couvrant largement le corps. L’adjectif restitue cette nuance lexicale.
- source_word: וְסֹחֵרָה
  choice: et une protection
  rationale: סֹחֵרָה est rare et son sens exact est incertain. « Protection » rend prudemment l’idée probable d’une défense qui entoure, sans imposer un objet militaire précis.
- source_word: אֲמִתּוֹ
  choice: Sa fidélité
  rationale: אֱמֶת peut désigner la vérité, la fidélité ou la fiabilité. Dans cette image de protection, « fidélité » met naturellement en avant le caractère sûr et constant de Dieu, tout en laissant l’autre sens en note.
theological_decisions:
- issue: Sens de אֲמִתּוֹ dans la métaphore protectrice
  choice: Sa fidélité
  alternative: Sa vérité
  rationale: Les deux sens sont possibles. « Fidélité » convient au thème de la confiance et de la protection, sans ajouter de précision doctrinale étrangère au texte; « vérité » est conservé en note.
- issue: Sens du rare סֹחֵרָה
  choice: une protection
  alternative: un rempart ou un petit bouclier
  rationale: Le terme semble évoquer une défense entourante, mais l’objet exact demeure discuté. Une formulation générale dans le texte, accompagnée d’une note, préserve cette incertitude.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le tutoiement conserve l’adresse directe du psaume. Les deux images successives — l’oiseau protecteur puis l’équipement défensif — restent nettement perceptibles.
