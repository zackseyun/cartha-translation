  text: אֹמַ֗ר לַֽ֭/יהוָה מַחְסִ֣/י וּ/מְצוּדָתִ֑/י אֱ֝לֹהַ֗/י אֶבְטַח בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: fr
  text: 'Je dirai à Yahvé[a] : « Mon refuge et ma forteresse, mon Dieu ; je mettrai ma confiance en lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, le nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Je dis
  rationale: L’imparfait qal à la première personne peut avoir une valeur présente ou future. Ici, la déclaration poétique de confiance se rend naturellement au présent, sans imposer une nuance de futur.
- source_word: לַיהוָה
  choice: à Yahvé
  rationale: 'La préposition ל marque le destinataire de la déclaration : le psalmiste s’adresse à Yahvé.'
- source_word: יהוה
  choice: Yahvé
  rationale: Le tétragramme est rendu comme un nom propre, conformément à sa fonction dans le texte hébreu; une note signale la convention traditionnelle « le SEIGNEUR ».
- source_word: מַחְסִי
  choice: mon refuge
  rationale: מַחְסֶה désigne un lieu où l’on trouve protection; « refuge » conserve clairement cette image.
- source_word: וּמְצוּדָתִי
  choice: et ma forteresse
  rationale: מְצוּדָה désigne une place forte; « forteresse » préserve l’image défensive et s’accorde naturellement avec « refuge ».
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Le suffixe de première personne exprime directement la relation personnelle affirmée par le psalmiste.
- source_word: אֶבְטַח
  choice: je mets ma confiance
  rationale: L’imparfait qal de בטח exprime ici une confiance actuelle et continue. Cette tournure est idiomatique en français et conserve l’idée d’un appui confiant.
- source_word: בּוֹ
  choice: en qui
  rationale: La préposition ב avec le suffixe masculin singulier signifie littéralement « en lui »; rattaché à « mon Dieu », le relatif « en qui » est naturel en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme comme nom divin. « Yahvé » en préserve la fonction de nom propre, tandis que la note indique la traduction traditionnelle afin de ne pas masquer cette autre convention largement reçue.
- issue: Valeur temporelle de אֶבְטַח
  choice: 'présent : « je mets ma confiance »'
  alternative: 'futur : « je mettrai ma confiance »'
  rationale: La forme verbale permet les deux nuances, mais le contexte immédiat favorise une confession présente et habituelle. Le choix n’ajoute donc ni promesse future exclusive ni nuance doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure nominale « Mon refuge et ma forteresse » conserve la vigueur poétique de l’hébreu; l’exclamation française rend naturellement la confession adressée directement à Dieu.
