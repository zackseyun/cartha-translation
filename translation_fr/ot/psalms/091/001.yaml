id: PSA.91.1
reference: Psalms 91:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: fr
  text: Celui qui demeure dans l’abri du Très-Haut passera la nuit à l’ombre du Tout-Puissant[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quiconque demeure ». L’hébreu est grammaticalement au masculin singulier, mais peut avoir une portée représentative.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le lieu secret du Très-Haut » ou « dans la cachette du Très-Haut ».
    reason: lexical_alternative
  - marker: c
    text: Ou « demeurera » ou « logera ». Le verbe hébreu évoque le fait de passer la nuit et, par extension, celui de rester.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Celui qui demeure
  rationale: Le participe substantivé désigne une personne caractérisée par une résidence durable. « Demeure » exprime mieux cette continuité que le sens plus littéral « est assis ».
- source_word: בְּסֵתֶר
  choice: dans l’abri
  rationale: סֵתֶר désigne un lieu caché ou protégé. « Abri » restitue naturellement en français l’idée de refuge et de protection, sans donner au passage une coloration ésotérique.
- source_word: עֶלְיוֹן
  choice: du Très-Haut
  rationale: Titre divin qui exprime la suprématie. « Le Très-Haut » est une formulation française consacrée, claire et fidèle.
- source_word: בְּצֵל
  choice: à l’ombre
  rationale: L’expression française idiomatique « à l’ombre de » rend l’hébreu בְּצֵל tout en conservant l’image de proximité protectrice.
- source_word: שַׁדַּי
  choice: du Tout-Puissant
  rationale: « Le Tout-Puissant » traduit le titre divin שַׁדַּי de manière transparente pour le lectorat moderne, plutôt que de le translittérer.
- source_word: יִתְלוֹנָן
  choice: passera la nuit
  rationale: Le verbe לון évoque concrètement le fait de loger ou de passer la nuit, avec le sens étendu de rester. Cette traduction préserve l’image concrète et la tension avec l’idée plus durable exprimée par « demeure ».
theological_decisions:
- issue: Valeur représentative du participant masculin singulier
  choice: Celui qui demeure
  alternative: Quiconque demeure
  rationale: L’hébreu emploie un participe masculin singulier substantivé qui peut représenter toute personne concernée. « Celui qui » conserve la forme masculine singulière sans exclure sa portée représentative.
- issue: Traduction du titre divin שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: La traduction du titre en communique immédiatement le sens traditionnel de puissance divine, tandis que la translittération serait moins transparente et ferait davantage penser à un nom propre.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme demeure/passera la nuit conserve à la fois la continuité du premier membre et l’image concrète du second. Les titres divins suivent l’usage biblique français courant.
