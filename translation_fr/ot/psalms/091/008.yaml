source:
  edition: WLC
  text: רַ֭ק בְּ/עֵינֶ֣י/ךָ תַבִּ֑יט וְ/שִׁלֻּמַ֖ת רְשָׁעִ֣ים תִּרְאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: fr
  text: Tu ne feras que regarder de tes propres yeux et tu verras la rétribution des méchants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est rendu aux méchants » ou « le châtiment des méchants ».
    reason: Alternative lexicale destinée à conserver l’étendue de sens de שִׁלֻּמַת.
lexical_decisions:
- source_word: רַק
  choice: ne… que
  rationale: 'Cette tournure marque naturellement en français la limitation : la personne interpellée sera témoin de ce sort sans le subir.'
- source_word: בְּעֵינֶיךָ
  choice: de tes propres yeux
  rationale: Expression française naturelle qui conserve l’image hébraïque de la vue personnelle et directe.
- source_word: תַבִּיט
  choice: regarder
  rationale: Le hifil de נבט exprime ici l’action de porter le regard; « regarder » est clair, actuel et non affecté.
- source_word: וְשִׁלֻּמַת
  choice: la rétribution
  rationale: Le nom désigne ce qui est rendu en retour. « Rétribution » préserve la portée morale et judiciaire sans réduire d’emblée le terme au seul châtiment.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Rendu traditionnel et intelligible du substantif pluriel, qui conserve la catégorie morale du texte.
- source_word: תִּרְאֶה
  choice: tu verras
  rationale: Le qal de ראה signifie simplement « voir »; la traduction maintient sa coordination avec le premier verbe.
theological_decisions:
- issue: Nature du sort réservé aux méchants
  choice: la rétribution des méchants
  alternative: le châtiment des méchants
  rationale: Le verset annonce que la personne interpellée verra ce qui revient aux méchants. Le nom hébreu évoque une juste contrepartie sans préciser exclusivement la forme pénale qu’elle prend.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à la deuxième personne masculine singulière de l’hébreu. « De tes propres yeux » rend l’image de façon idiomatique, tandis que « ne… que » maintient l’idée que le destinataire observe sans subir le sort décrit.
