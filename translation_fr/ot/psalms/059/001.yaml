source:
  edition: WLC
  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י אֱלֹהָ֑/י מִּ/מִתְקוֹמְמַ֥/י תְּשַׂגְּבֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/001.yaml
  text: Deliver me from my enemies[a], my God[b]; set me on high above those who rise up against me.
translation:
  language: fr
  text: Délivre-moi de mes ennemis, mon Dieu ; mets-moi hors d’atteinte de ceux qui se dressent contre moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « place-moi en hauteur, à l’abri de ceux qui se dressent contre moi ». Le verbe hébreu évoque le fait d’être placé dans un lieu élevé et inaccessible, et donc protégé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif hiphil de נצל avec suffixe de première personne exprime l’action d’arracher quelqu’un au danger ou de l’en délivrer. « Délivre-moi » convient au registre de la prière sans ajouter de connotation étrangère au contexte.
- source_word: מֵאֹיְבַי
  choice: de mes ennemis
  rationale: אֹיֵב est le terme courant pour « ennemi », et מִן indique ici l’éloignement ou la délivrance hors de leur pouvoir.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: L’adresse directe avec suffixe possessif de première personne est rendue simplement et naturellement.
- source_word: מִּמִתְקוֹמְמַי
  choice: de ceux qui se dressent contre moi
  rationale: La forme participiale de קום désigne ceux qui se lèvent ou se dressent contre le psalmiste ; cette formulation conserve l’image et l’hostilité délibérée.
- source_word: תְּשַׂגְּבֵנִי
  choice: mets-moi hors d’atteinte
  rationale: Le piel de שׂגב évoque le fait de placer en hauteur, donc dans un lieu inaccessible et protégé. « Mets-moi hors d’atteinte » exprime naturellement en français la fonction protectrice de cette image.
theological_decisions:
- issue: Adresse divine אֱלֹהָי
  choice: mon Dieu
  alternative: ô mon Dieu
  rationale: Le possessif personnel est conservé sans amplification ; l’interjection « ô » n’est pas nécessaire pour rendre le vocatif en français moderne.
- issue: Métaphore de protection dans תְּשַׂגְּבֵנִי
  choice: mets-moi hors d’atteinte
  alternative: place-moi en hauteur
  rationale: Le choix principal communique l’inaccessibilité protectrice impliquée par la hauteur. L’alternative conserve plus littéralement l’image spatiale, mais elle est moins idiomatique et moins immédiatement claire en français.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme de la supplication est conservé, tandis que « hors d’atteinte » rend clairement la métaphore hébraïque d’une hauteur inaccessible.
