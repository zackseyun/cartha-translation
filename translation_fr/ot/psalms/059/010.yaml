id: PSA.59.10
reference: Psalms 59:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱלֹהֵ֣י חסד/ו יְקַדְּמֵ֑/נִי אֱ֝לֹהִ֗ים יַרְאֵ֥/נִי בְ/שֹׁרְרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/010.yaml
  text: The God of his steadfast love will go before me[b][a]; God will let me look on my enemies.
translation:
  language: fr
  text: Le Dieu de son amour fidèle[a] ira devant moi[b] ; Dieu me donnera de voir mes ennemis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « amour fidèle » traduit l’hébreu ḥésèd, qui peut désigner un amour loyal et durable, la bonté ou la miséricorde.
    reason: lexical_alternative
  - marker: b
    text: 'Selon une autre vocalisation ou tradition de lecture : « Mon Dieu, dans son amour fidèle, ira devant moi » ou « Mon Dieu d’amour fidèle ira devant moi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: Le Dieu de
  rationale: La forme construite d’אֱלֹהִים introduit le nom qui suit. « Le Dieu de » conserve ce rapport grammatical, même si l’expression obtenue reste inhabituelle en français.
- source_word: חסד/ו (חַסְדּוֹ)
  choice: son amour fidèle
  rationale: חֶסֶד désigne souvent un amour loyal, durable et miséricordieux. « Amour fidèle » exprime ces dimensions sans imposer dans le texte une interprétation confessionnelle particulière ; le suffixe masculin singulier est rendu par « son ».
- source_word: יְקַדְּמֵנִי
  choice: ira devant moi
  rationale: Au piel, קדם peut signifier venir à la rencontre de quelqu’un, le devancer ou aller devant lui. « Ira devant moi » conserve l’idée d’une intervention divine qui précède le psalmiste.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: La répétition du nom divin dans l’hébreu est maintenue plutôt que remplacée par un pronom.
- source_word: יַרְאֵנִי
  choice: me donnera de voir
  rationale: 'Le hifil de ראה a une valeur causative ou permissive : « faire voir » ou « laisser voir ». « Me donnera de voir » est naturel en français et préserve cette nuance sans ajouter explicitement l’idée de victoire.'
- source_word: בְשֹׁרְרָי
  choice: mes ennemis
  rationale: Le terme désigne ceux qui manifestent de l’hostilité envers le psalmiste. « Mes ennemis » est ici l’équivalent français le plus clair et le plus direct.
theological_decisions:
- issue: Suffixe pronominal de חַסְדּוֹ et analyse de אֱלֹהֵי
  choice: Le Dieu de son amour fidèle
  alternative: 'Mon Dieu, dans son amour fidèle, ira devant moi ; ou : Mon Dieu d’amour fidèle ira devant moi.'
  rationale: Le texte massorétique fourni porte un suffixe de troisième personne masculine singulière, « son », et אֱלֹהֵי peut être compris comme une forme construite. La formulation principale suit donc directement le WLC, malgré son caractère inhabituel. Une autre vocalisation ou tradition de lecture, largement attestée, comprend plutôt « mon Dieu » ; cette possibilité importante est conservée en note.
- issue: Portée de יַרְאֵנִי בְשֹׁרְרָי
  choice: Dieu me donnera de voir mes ennemis
  alternative: 'Dieu me fera voir ce qu’il adviendra de mes ennemis ; ou : Dieu me donnera de triompher sous les yeux de mes ennemis.'
  rationale: Dans ce contexte, l’expression peut suggérer que le psalmiste verra le sort ou la défaite de ses adversaires. Le texte principal n’explicite toutefois ni leur défaite ni le triomphe du psalmiste, afin de ne pas résoudre une implication que l’hébreu laisse sous-entendue.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure inhabituelle « Le Dieu de son amour fidèle » est conservée parce qu’elle reflète la forme du texte massorétique fourni ; la note signale les lectures concurrentes. Le rythme en deux membres et la répétition de « Dieu » reproduisent la structure poétique hébraïque.
