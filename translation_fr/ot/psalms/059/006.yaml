  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: fr
  text: Ils reviennent le soir ; ils grondent comme des chiens[a] et font le tour de la ville[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils hurlent » ; litt. « comme un chien », le singulier ayant une valeur générique. Le verbe hébreu peut désigner un bruit animal fort.
    reason: lexical_alternative
  - marker: b
    text: Ou « parcourent la ville » ou « rôdent dans la ville ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: ils reviennent
  rationale: Le qal inaccompli de שוב exprime directement l’idée de revenir; le présent français convient à cette description poétique répétée.
- source_word: לָעֶרֶב
  choice: le soir
  rationale: La préposition ל marque ici le moment; « le soir » est la tournure française la plus naturelle.
- source_word: יֶהֱמוּ
  choice: ils grondent
  rationale: Le verbe המה désigne un bruit fort ou animal. Avec l’image des chiens, « grondent » conserve la menace sans préciser indûment qu’il s’agit d’aboiements ou de hurlements.
- source_word: כַכָּלֶב
  choice: comme des chiens
  rationale: Le singulier hébreu a ici une valeur générique; le pluriel est naturel en français avec le sujet pluriel et évoque le groupe ennemi.
- source_word: וִיסוֹבְבוּ
  choice: et parcourent
  rationale: Le verbe סבב signifie tourner, circuler ou faire le tour. « Parcourent » rend ici leur déplacement à travers la ville sans ajouter explicitement la nuance prédatrice de « rôder ».
- source_word: עִיר
  choice: la ville
  rationale: Même sans article en hébreu poétique, le contexte désigne une ville déterminée; l’article défini est donc idiomatique en français.
