  text: הִנֵּ֤ה יַבִּ֘יע֤וּ/ן בְּ/פִי/הֶ֗ם חֲ֭רָבוֹת בְּ/שִׂפְתוֹתֵי/הֶ֑ם כִּי מִ֥י שֹׁמֵֽעַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/007.yaml
  text: Look[a], they pour out from their mouths; swords are on their lips, for they say[b], “Who hears?”
translation:
  language: fr
  text: 'Les voici[a] : leur bouche déborde ; des épées sont sur leurs lèvres, car ils disent[b] : « Qui entend ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les voilà qui font jaillir de leur bouche… » Le verbe hébreu évoque ce qui bouillonne, jaillit ou se déverse ; son contenu n’est pas précisé.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit simplement : « Qui entend ? » Le complément n’est pas exprimé, ce qui laisse leur prétention arrogante volontairement ouverte.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voyez
  rationale: Particule qui attire vivement l’attention. « Voyez » conserve sa force déictique dans un français actuel et digne.
- source_word: יַבִּיעוּן
  choice: ils déversent leurs paroles
  rationale: Le hifil de נבע évoque ce qui jaillit ou se répand abondamment. Le complément « leurs paroles », implicite dans le contexte, rend l’image intelligible en français sans rattacher à tort « épées » à ce verbe.
- source_word: בְּפִיהֶם
  choice: de leur bouche
  rationale: Avec l’image d’un flot verbal, la préposition בְּ est rendue naturellement par l’idée de provenance ; celle-ci est intégrée à la formulation française « déversent leurs paroles » et explicitée dans la note.
- source_word: חֲרָבוֹת
  choice: des épées
  rationale: Le nom désigne normalement des épées. La métaphore de paroles violentes et meurtrières est conservée plutôt qu’interprétée.
- source_word: בְּשִׂפְתוֹתֵיהֶם
  choice: sur leurs lèvres
  rationale: Expression française naturelle qui préserve le parallélisme corporel et l’image de paroles comparées à des armes.
- source_word: כִּי
  choice: car ils disent
  rationale: « Car » marque la motivation ou l’explication. « Ils disent » est ajouté pour introduire clairement la question qui exprime leur attitude, sans en préciser l’objet absent.
- source_word: מִי שֹׁמֵעַ
  choice: Qui entend ?
  rationale: La formulation brève reflète le participe hébreu et maintient l’objet sous-entendu, ainsi que la force provocante de la question.
theological_decisions:
- issue: Objet implicite du verbe « entendre »
  choice: « Qui entend ? » sans complément
  alternative: « Qui nous entend ? » ou « Qui entend cela ? »
  rationale: L’hébreu ne précise aucun objet. La formulation ouverte préserve l’arrogance ambiguë des locuteurs, qui agissent comme si personne — éventuellement Dieu lui-même — n’entendait, sans expliciter ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, poétique et digne. La métaphore des épées est maintenue. « Leurs paroles » explicite sobrement le contenu verbal nécessaire à l’idiome français, tandis que la note conserve l’image concrète du jaillissement depuis la bouche.
