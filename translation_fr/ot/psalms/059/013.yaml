  text: כַּלֵּ֥ה בְ/חֵמָה֮ כַּלֵּ֪ה וְֽ/אֵ֫ינֵ֥/מוֹ וְֽ/יֵדְע֗וּ כִּֽי אֱ֭לֹהִים מֹשֵׁ֣ל בְּ/יַעֲקֹ֑ב לְ/אַפְסֵ֖י הָ/אָ֣רֶץ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: fr
  text: Anéantis-les dans ta fureur[a] ; anéantis-les jusqu’à ce qu’ils ne soient plus, afin qu’ils sachent que Dieu règne en Jacob jusqu’aux extrémités de la terre[b]. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Détruis-les dans ta fureur ; détruis-les, et qu’ils ne soient plus. » L’hébreu peut être rendu de façon plus abrupte et plus littérale.'
    reason: lexical_alternative
  - marker: b
    text: « En Jacob » présente le règne de Dieu dans sa relation avec Jacob, c’est-à-dire Israël ; certains traduisent « sur Jacob ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: Anéantis-les
  rationale: L’impératif intensif de כלה demande de mener les ennemis à leur fin, donc de les détruire entièrement. « Anéantis-les » restitue cette force en français courant et permet de conserver la répétition emphatique.
- source_word: בְחֵמָה
  choice: dans ta fureur
  rationale: חֵמָה désigne une colère ardente. « Dans ta fureur » conserve l’intensité et la valeur modale de la préposition ; le possessif explicite naturellement en français que cette fureur est celle de Dieu invoqué.
- source_word: וְאֵינֵמוֹ
  choice: jusqu’à ce qu’ils ne soient plus
  rationale: L’expression signifie littéralement « et ils ne sont plus ». Après le double impératif, cette formulation française exprime naturellement l’aboutissement demandé sans en atténuer la violence.
- source_word: וְיֵדְעוּ
  choice: afin qu’ils sachent
  rationale: Le waw suivi de l’imparfait peut exprimer ici le résultat ou le but de la demande précédente. Cette traduction conserve aussi la tension du texte entre leur disparition demandée et la connaissance qui doit en résulter.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte psalmique, le terme désigne le Dieu d’Israël ; « Dieu » est son équivalent français direct.
- source_word: מֹשֵׁל
  choice: règne
  rationale: Le participe exprime une domination continue. « Règne » est naturel dans un psaume et rend clairement l’exercice durable de la souveraineté divine.
- source_word: בְּיַעֲקֹב
  choice: en Jacob
  rationale: La préposition signifie d’abord « en/dans ». Le nom « Jacob » est conservé comme désignation du peuple d’Israël, sans résoudre dans le corps du texte la portée précise de la relation.
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: jusqu’aux extrémités de la terre
  rationale: Cette expression idiomatique désigne les confins du monde. La formulation française est à la fois fidèle, claire et traditionnelle sans être archaïque.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens exact de ce terme liturgique ou musical demeure incertain ; il est donc translittéré plutôt que traduit de manière conjecturale.
theological_decisions:
- issue: La demande de destruction totale adressée contre les ennemis
  choice: Conserver sans l’atténuer la double demande de les anéantir jusqu’à ce qu’ils ne soient plus.
  alternative: Paraphraser la demande comme une simple neutralisation ou une limitation de leur pouvoir.
  rationale: La répétition de l’impératif et la formule « ils ne soient plus » expriment explicitement une destruction complète. La traduction ne doit pas adoucir cette imprécation.
- issue: La tension entre la disparition des ennemis et leur connaissance de la souveraineté divine
  choice: Traduire « afin qu’ils sachent » sans expliquer comment ceux qui ne sont plus peuvent savoir.
  alternative: Remplacer le sujet par « tous » ou « les nations » afin de supprimer la difficulté logique.
  rationale: Le texte hébreu maintient le même pluriel sans expliciter le rapport logique. La traduction préserve cette tension et laisse au lecteur l’ambiguïté du résultat visé.
- issue: La portée particulière et universelle du règne de Dieu
  choice: Maintenir ensemble « en Jacob » et « jusqu’aux extrémités de la terre ».
  alternative: Traduire uniquement par un règne sur Israël ou, inversement, effacer Jacob au profit d’une affirmation seulement universelle.
  rationale: Le verset associe la relation particulière de Dieu avec Jacob à une reconnaissance qui atteint les confins de la terre ; aucun de ces deux pôles ne doit être absorbé par l’autre.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition impérative et la dureté de l’imprécation sont conservées. « Sélah » est translittéré avec l’accentuation française usuelle. Les deux notes signalées [a] et [b] figurent bien dans le texte principal.
