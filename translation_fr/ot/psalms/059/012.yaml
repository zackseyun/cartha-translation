base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: fr
  text: 'Le péché de leur bouche, la parole de leurs lèvres : qu’ils soient pris au piège par leur orgueil, à cause de la malédiction et du mensonge qu’ils profèrent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַטַּאת
  choice: péché
  rationale: Le nom désigne ici la faute morale manifestée par leurs paroles, et non une offrande rituelle.
- source_word: פִּימוֹ
  choice: leur bouche
  rationale: Le singulier avec suffixe pluriel a une valeur collective et maintient l’image poétique de la bouche en parallèle avec les lèvres.
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: la parole de leurs lèvres
  rationale: Cette formulation conserve le singulier et l’image corporelle du texte hébreu, tout en restant compréhensible en français poétique.
- source_word: וְיִלָּכְדוּ
  choice: qu’ils soient pris au piège
  rationale: Dans cette prière imprécatoire, l’inaccompli niphal a une valeur jussive. « Pris au piège » exprime clairement l’idée d’être pris.
- source_word: בִגְאוֹנָם
  choice: dans leur orgueil
  rationale: Le nom désigne ici l’arrogance ou l’élévation orgueilleuse. La traduction conserve la préposition hébraïque sans trancher entièrement entre sphère et cause.
- source_word: וּמֵאָלָה וּמִכַּחַשׁ
  choice: à cause des malédictions et des mensonges
  rationale: La préposition מן est comprise comme causale. Les pluriels français rendent naturellement les singuliers hébreux employés collectivement pour caractériser leurs propos.
- source_word: יְסַפֵּרוּ
  choice: qu’ils profèrent
  rationale: Dans ce contexte, ספר désigne ce qu’ils disent ou débitent. « Profèrent » convient aux malédictions comme aux mensonges et garde un registre digne.
theological_decisions:
- issue: Rapport syntaxique entre חַטַּאת פִּימוֹ דְּבַר שְׂפָתֵימוֹ et וְיִלָּכְדוּ
  choice: 'Lire le premier groupe comme une proposition nominale : « Le péché de leur bouche, c’est la parole de leurs lèvres »'
  alternative: 'Rattacher le groupe à l’imprécation : « Pour le péché de leur bouche, pour la parole de leurs lèvres, qu’ils soient pris… »'
  rationale: La syntaxe poétique permet les deux analyses. Le texte principal suit la lecture propositionnelle attestée par l’accentuation et la structure parallèle, tandis qu’une note préserve l’autre possibilité sans modifier la portée théologique.
translation_notes:
  register: Français moderne, international et poétique. Les images de la bouche et des lèvres sont conservées. « Pris au piège » et « profèrent » donnent une formulation naturelle et digne, sans effacer l’ambiguïté syntaxique du premier hémistiche.
