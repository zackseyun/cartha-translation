  text: בְּֽלִי עָ֭וֺן יְרוּצ֣וּ/ן וְ/יִכּוֹנָ֑נוּ ע֖וּרָ/ה לִ/קְרָאתִ֣/י וּ/רְאֵה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/004.yaml
  text: Without guilt[a], they run and set themselves in place; awake to meet me and see.
translation:
  language: fr
  text: Sans faute de ma part, ils courent et se mettent en position[a]. Réveille-toi, viens à ma rencontre et vois !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et se préparent » ou « et s’établissent fermement ».'
    reason: Le verbe hébreu peut décrire le fait de prendre position, de s’affermir ou de se préparer à agir.
lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: Sans faute de ma part
  rationale: La tournure exprime l’absence de culpabilité. Dans le contexte, le psalmiste nie avoir commis une faute qui justifierait l’attaque; « de ma part » explicite en français naturel la relation laissée implicite en hébreu.
- source_word: יְרוּצוּן
  choice: ils accourent
  rationale: Le verbe רוץ évoque la course ou l’empressement. « Accourent » conserve le mouvement vif et convient à des adversaires qui convergent vers le psalmiste.
- source_word: וְיִכּוֹנָנוּ
  choice: et se mettent en position
  rationale: La forme de כון peut exprimer le fait de s’établir, de prendre position ou de se préparer. Cette formulation garde l’image concrète sans préciser indûment la nature de leur action.
- source_word: עוּרָה
  choice: Réveille-toi
  rationale: L’impératif conserve l’image anthropomorphique audacieuse de la prière, où le psalmiste appelle Dieu à passer de l’inaction apparente à l’intervention.
- source_word: לִקְרָאתִי
  choice: viens à ma rencontre
  rationale: L’expression signifie littéralement aller à la rencontre de quelqu’un. L’ajout de « viens » rend l’impératif idiomatique en français tout en préservant l’image.
- source_word: וּרְאֵה
  choice: et vois
  rationale: Cette traduction directe maintient la brièveté et l’enchaînement des impératifs hébreux.
theological_decisions:
- issue: Impératif anthropomorphique adressé à Dieu
  choice: Réveille-toi
  alternative: Lève-toi / Entre en action
  rationale: Le texte présente poétiquement Dieu comme devant se réveiller. Garder cette métaphore préserve la force et la tension théologique de la lamentation sans affirmer que Dieu dort littéralement.
- issue: Identification de la personne sans faute
  choice: de ma part
  alternative: Sans faute, ils accourent
  rationale: Le contexte immédiat présente l’innocence du psalmiste comme la raison pour laquelle l’attaque est injustifiée. L’explicitation évite que le français attribue naturellement l’absence de faute aux assaillants, tout en ne définissant pas cette innocence comme absolue.
translation_notes:
  register: Français international moderne, poétique et direct. Le rythme bref des impératifs est conservé; « accourent » et « se mettent en position » rendent concrètement l’élan et la préparation des adversaires.
