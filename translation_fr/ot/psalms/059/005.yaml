id: PSA.59.5
reference: Psalms 59:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: fr
  text: Mais toi, Yahvé, Dieu des armées, Dieu d’Israël, réveille-toi pour demander des comptes à toutes les nations[a] ! Ne fais grâce[b] à aucun de ceux qui agissent avec perfidie dans le mal. Sélah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour intervenir contre toutes les nations » ou « pour punir toutes les nations ». Le verbe hébreu peut signifier « visiter », « intervenir », « demander des comptes » ou « punir », selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’aie pitié d’aucun ». Le verbe hébreu signifie littéralement « faire grâce » ou « montrer de la faveur ».
    reason: lexical_alternative
  - marker: c
    text: « Sélah » est probablement une indication musicale ou liturgique, mais son sens précis demeure incertain.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue du titre « Seigneur ».
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Dieu des armées
  rationale: Rend concrètement צְבָאוֹת sans limiter explicitement le titre aux seules armées terrestres ou célestes.
- source_word: הָקִיצָה
  choice: réveille-toi
  rationale: Conserve la métaphore audacieuse de l’impératif hébreu dans un français actuel.
- source_word: לִפְקֹד
  choice: pour demander des comptes à
  rationale: Exprime ici la portée judiciaire de פקד tout en évitant de réduire son sens au seul châtiment.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: Préserve le sens collectif et politique de גּוֹיִם sans introduire la distinction théologique plus tardive portée par « païens ».
- source_word: אַל תָּחֹן
  choice: Ne fais grâce à aucun
  rationale: Reproduit le champ lexical de חנן, « faire grâce, accorder sa faveur », et maintient la vigueur imprécatoire.
- source_word: בֹּגְדֵי אָוֶן
  choice: ces traîtres malfaisants
  rationale: Rend à la fois la déloyauté exprimée par בגד et le mal associé à אָוֶן dans une formulation française naturelle.
- source_word: סֶלָה
  choice: Sélah
  rationale: Transcription conservée puisque la fonction exacte de cette notation reste incertaine.
theological_decisions:
- issue: Portée de כָּל הַגּוֹיִם dans cette demande de jugement
  choice: toutes les nations
  alternative: tous les païens
  rationale: « Nations » garde la portée collective du texte sans importer une opposition religieuse ou ethnique plus étroite.
- issue: Force judiciaire de פקד
  choice: demander des comptes à
  alternative: punir
  rationale: Le contexte appelle une intervention judiciaire, mais le verbe possède une gamme de sens plus large que « punir » ; la formulation retenue maintient cette tension.
translation_notes:
  register: Français international moderne, solennel mais direct. La syntaxe vocative et l’image du réveil divin sont conservées. « Dieu des armées » maintient la force du titre hébreu ; « demander des comptes » préserve la dimension judiciaire sans éliminer la polysémie de פקד.
