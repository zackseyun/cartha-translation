source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אָֽרְב֡וּ לְ/נַפְשִׁ֗/י יָג֣וּרוּ עָלַ֣/י עַזִ֑ים לֹא פִשְׁעִ֖/י וְ/לֹא חַטָּאתִ֣/י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/003.yaml
  text: For look, they lie in wait for my life; fierce men gather against me, for no transgression or sin of mine, O LORD.
translation:
  language: fr
  text: 'Car voici : ils guettent ma vie ; des hommes redoutables se rassemblent contre moi, sans aucune transgression ni aucun péché de ma part, ô Éternel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: voici
  rationale: Conserve le marqueur hébreu d’attention dans une tournure française naturelle et solennelle.
- source_word: אָרְבוּ לְנַפְשִׁי
  choice: ils guettent ma vie
  rationale: Exprime l’idée d’être à l’affût pour attenter à la personne du psalmiste ; « vie » convient ici à נֶפֶשׁ dans ce contexte.
- source_word: יָגוּרוּ עָלַי
  choice: se liguent contre moi
  rationale: Le verbe peut évoquer le fait de se rassembler ou de s’attrouper avec hostilité ; « se liguent » rend clairement cette action concertée.
- source_word: עַזִּים
  choice: des hommes puissants
  rationale: Le terme désigne ici des adversaires forts ou redoutables ; « puissants » préserve ce sens sans ajouter explicitement la férocité.
- source_word: פִשְׁעִי
  choice: j’aie commis de révolte
  rationale: פֶּשַׁע désigne une transgression comprise comme rébellion ; la formulation verbale est idiomatique en français.
- source_word: חַטָּאתִי
  choice: péché
  rationale: Rend le terme courant pour la faute ou le péché, distinct de la révolte mentionnée auparavant.
- source_word: יְהוָה
  choice: Éternel
  rationale: Suit la convention française traditionnelle qui représente le tétragramme par « Éternel » tout en le distinguant d’un simple titre.
theological_decisions:
- issue: Portée de la protestation d’innocence
  choice: sans que j’aie commis de révolte ni de péché
  alternative: bien que je n’aie commis ni transgression ni péché
  rationale: La traduction limite naturellement l’affirmation aux accusations et à l’hostilité décrites dans le verset, sans en faire une revendication abstraite d’impeccabilité.
- issue: Valeur de לֹא devant les deux noms
  choice: sans que j’aie commis
  alternative: à cause d’aucune révolte ni d’aucun péché de ma part
  rationale: 'Cette formulation conserve le lien causal ou circonstanciel implicite : les ennemis agissent sans faute correspondante de la part du psalmiste.'
translation_notes:
  register: Français moderne, digne et accessible. La ponctuation après « voici » garde la force présentative de l’hébreu. « Se liguent » restitue l’hostilité collective sans lourdeur, et l’apostrophe finale conserve la tension de la prière.
