  text: הֵ֭מָּה ינועו/ן לֶ/אֱכֹ֑ל אִם לֹ֥א יִ֝שְׂבְּע֗וּ וַ/יָּלִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/015.yaml
  text: They wander about for food[a]; if they are not satisfied[b], they spend the night.
translation:
  language: fr
  text: Eux, ils errent à la recherche de nourriture ; s’ils ne sont pas rassasiés, ils passent la nuit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils grondent ». La forme hébraïque peut être comprise comme « ils passent la nuit » ou être rattachée à un verbe signifiant « murmurer, gronder ». Cette seconde lecture s’accorde avec l’image des chiens qui parcourt le psaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Eux, ils
  rationale: Le pronom indépendant masculin pluriel marque ici une légère emphase ou un contraste. La dislocation « Eux, ils » la rend naturellement en français.
- source_word: ינועון
  choice: errent
  rationale: Le verbe נוּעַ décrit un mouvement de côté et d’autre. « Errent » convient à la recherche agitée de nourriture sans introduire l’idée d’ivresse.
- source_word: לֶאֱכֹל
  choice: à la recherche de nourriture
  rationale: L’infinitif avec לְ exprime le but, littéralement « pour manger ». Cette formulation française explicite naturellement le but du déplacement sans modifier l’image.
- source_word: אִם לֹא
  choice: s’ils ne sont pas
  rationale: La construction est rendue comme une condition négative directe, sans la transformer en affirmation emphatique.
- source_word: יִשְׂבְּעוּ
  choice: rassasiés
  rationale: שׂבע désigne le fait d’avoir mangé à satiété. « Rassasiés » conserve précisément l’image de la faim.
- source_word: וַיָּלִינוּ
  choice: ils passent la nuit
  rationale: Cette lecture rattache la forme à לוּן/לִין, « passer la nuit, loger ». Une autre analyse lexicale, favorisée par l’image des chiens dans le contexte, comprend « ils grondent » ; l’ambiguïté est signalée en note.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et accessible. « Eux, ils » conserve l’emphase du pronom hébreu ; « à la recherche de nourriture » restitue idiomatiquement le but. La ponctuation maintient le lien conditionnel tout en laissant subsister l’ambiguïté lexicale du dernier verbe.
