base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/000.yaml
  text: 'For the choir director: “Do Not Destroy.” Of David[a]. A miktam, when Saul sent men[d][c][b], and they watched the house to kill him.'
translation:
  language: fr
  text: Au chef de chœur. Sur « Ne détruis pas ». De David[a]. Miktam[b]. Lorsque Saül envoya des hommes[c], ils surveillèrent la maison pour le tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour David ». La formule hébraïque peut indiquer l’auteur, l’appartenance, l’association ou la destination.
    reason: lexical_alternative
  - marker: b
    text: Le sens du mot « miktam » est incertain ; il est donc transcrit plutôt que traduit.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « Lorsque Saül envoya, ils surveillèrent la maison pour le tuer. » L’hébreu ne précise pas « des hommes », mais le verbe au pluriel indique que Saül avait envoyé plusieurs agents.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Formule de suscription adressée au responsable musical; cette tournure est claire et usuelle en français biblique moderne.
- source_word: אַל־תַּשְׁחֵת
  choice: Sur « Ne détruis pas »
  rationale: Il s’agit vraisemblablement du nom d’un air ou d’une indication musicale; « Sur » signale cette fonction sans la tenir pour certaine.
- source_word: לְדָוִד
  choice: De David
  rationale: Conserve l’ambiguïté du לְ de suscription, qui peut exprimer l’auteur, l’appartenance, l’association ou la destination.
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Le sens précis du terme est incertain; la translittération évite une traduction conjecturale.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: Lorsque Saül envoya des hommes
  rationale: Le complément « des hommes » n’est pas exprimé, mais il est naturellement inféré du verbe pluriel qui suit.
- source_word: וַיִּשְׁמְרוּ
  choice: et qu’ils surveillèrent
  rationale: Dans ce contexte hostile, שׁמר désigne la mise sous surveillance plutôt qu’une garde protectrice.
- source_word: אֶת־הַבַּיִת
  choice: la maison
  rationale: Rend littéralement le syntagme défini sans ajouter le possessif « sa », seulement implicite dans le contexte.
- source_word: לַהֲמִיתוֹ
  choice: pour le faire mourir
  rationale: Rend l’infinitif de but et son suffixe masculin singulier dans un registre digne et naturel.
theological_decisions:
- issue: Rapport de David au psaume
  choice: De David
  alternative: Par David / Pour David
  rationale: La formulation retenue préserve l’ambiguïté de la préposition hébraïque plutôt que d’affirmer exclusivement l’auteur ou le destinataire.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation segmente les indications de la suscription. Les termes techniques ou ambigus sont conservés ou explicités en note sans surinterprétation.
