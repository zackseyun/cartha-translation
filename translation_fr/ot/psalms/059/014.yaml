  text: וְ/יָשׁ֣וּבוּ לָ֭/עֶרֶב יֶהֱמ֥וּ כַ/כָּ֗לֶב וִ/יס֥וֹבְבוּ עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/014.yaml
  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: fr
  text: Ils reviennent le soir ; ils grondent comme des chiens[a] et rôdent autour de la ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils hurlent comme des chiens ». Le verbe hébreu peut désigner divers bruits puissants, notamment un cri ou un grondement animal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: Ils reviennent
  rationale: Le verbe שׁוב exprime le retour. Le présent français rend naturellement l’action habituelle ou répétée décrite ici.
- source_word: לָעֶרֶב
  choice: le soir
  rationale: עֶרֶב désigne le soir. La tournure « le soir » est naturelle en français et conserve le cadre temporel.
- source_word: יֶהֱמוּ
  choice: ils grondent
  rationale: Le verbe המה peut désigner un bruit puissant ou animal. « Grondent » convient à l’image canine sans préciser excessivement la nature du cri.
- source_word: כַכָּלֶב
  choice: comme des chiens
  rationale: Le singulier hébreu est générique dans la comparaison. Le pluriel est plus idiomatique en français avec le sujet pluriel « ils ».
- source_word: וִיסוֹבְבוּ
  choice: et rôdent autour
  rationale: סבב signifie tourner ou circuler autour. Dans cette image d’ennemis comparés à des chiens, « rôdent autour » exprime naturellement leur déplacement menaçant sans ajouter une action distincte.
- source_word: עִיר
  choice: de la ville
  rationale: Bien que l’hébreu n’emploie pas l’article, le contexte renvoie à la ville connue où se déroule la scène ; l’article défini est idiomatique en français.
