  text: עֻ֭זּ/וֹ אֵלֶ֣י/ךָ אֶשְׁמֹ֑רָה כִּֽי אֱ֝לֹהִ֗ים מִשְׂגַּבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: fr
  text: Sa force[a]… je resterai aux aguets, tourné vers toi[b], car Dieu est ma forteresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, selon le texte hébreu massorétique : « sa force ». La phrase est difficile. Une lecture traditionnelle courante comprend plutôt : « Ô ma force ». Certains proposent aussi, par rapprochement avec le verset 18 : « Ô ma force, je chanterai pour toi ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je veillerai vers toi », « je t’attendrai »; le verbe évoque le fait de garder, de surveiller ou d’attendre avec vigilance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: Sa force
  rationale: Le texte massorétique fourni porte un suffixe masculin singulier de troisième personne (« sa force »). La formulation demeure abrupte en hébreu; la traduction conserve donc cette difficulté au lieu de la remplacer silencieusement par la lecture vocative traditionnelle.
- source_word: אֵלֶיךָ
  choice: tourné vers toi
  rationale: La préposition אֶל exprime ici l’orientation vers Dieu. « Tourné vers toi » rend cette direction en français naturel avec le verbe « rester aux aguets ».
- source_word: אֶשְׁמֹרָה
  choice: je resterai aux aguets
  rationale: Le verbe שׁמר peut signifier garder, surveiller ou attendre avec vigilance. Cette expression conserve l’idée de veille attentive et la nuance volitive ou future de la forme hébraïque.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de cette vigilance confiante.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le terme désigne ici le Dieu d’Israël et commande un sens singulier.
- source_word: מִשְׂגַּבִּי
  choice: ma forteresse
  rationale: מִשְׂגָּב désigne un lieu élevé et sûr qui protège. « Forteresse » restitue clairement cette image défensive en français moderne.
theological_decisions:
- issue: 'Faut-il comprendre עֻזּוֹ comme « sa force » ou comme une invocation: « Ô ma force »?'
  choice: Le texte principal conserve « Sa force », conformément à la vocalisation et au suffixe du texte hébreu fourni.
  alternative: '« Ô ma force, je resterai aux aguets, tourné vers toi »; selon une autre reconstruction: « Ô ma force, je chanterai pour toi ».'
  rationale: La lecture vocative s’accorde bien avec le contexte et avec une formulation proche à la fin du psaume, mais elle ne correspond pas directement à la forme massorétique fournie. La note préserve cette lecture traditionnelle sans effacer la difficulté textuelle.
- issue: La veille désigne-t-elle la surveillance, l’attente ou l’espérance?
  choice: « je resterai aux aguets » maintient l’image concrète d’une vigilance continue.
  alternative: « je veillerai », « je t’attendrai » ou « je guetterai ton intervention ».
  rationale: Le contexte peut suggérer une attente confiante de Dieu, mais le verbe hébreu n’explicite pas à lui seul l’objet attendu. La traduction évite de résoudre cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et poétique. Les points de suspension signalent l’articulation abrupte du texte hébreu sans prétendre en fixer le sens. « Rester aux aguets » est idiomatique tout en conservant l’image de vigilance; « forteresse » maintient l’image d’un refuge élevé et sûr.
