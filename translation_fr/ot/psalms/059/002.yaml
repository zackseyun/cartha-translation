  text: הַ֭צִּילֵ/נִי מִ/פֹּ֣עֲלֵי אָ֑וֶן וּֽ/מֵ/אַנְשֵׁ֥י דָ֝מִ֗ים הוֹשִׁיעֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/002.yaml
  text: Deliver me from workers of wickedness[b][a], and save me from men of blood.
translation:
  language: fr
  text: Délivre-moi de ceux qui font le mal, et sauve-moi des hommes de sang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, l’hébreu parle d’« hommes de sang » ; l’expression peut désigner des hommes sanguinaires ou coupables d’avoir versé le sang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif de נצל exprime ici l’appel à être soustrait à un danger. « Délivre-moi » est naturel, digne et maintient la distinction avec הוֹשִׁיעֵנִי dans le second membre.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: de ceux qui font le mal
  rationale: Cette formulation rend le participe פעל (« faire, accomplir ») et le sens moral de אָוֶן sans la lourdeur de « ceux qui œuvrent à l’iniquité ». Elle reste plus proche de la construction hébraïque que le simple substantif « malfaiteurs ».
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: et des hommes de sang
  rationale: La tournure conserve l’expression hébraïque littérale, où le pluriel דָמִים évoque le sang versé, le meurtre ou la culpabilité liée au sang. Une note en explicite la portée idiomatique.
- source_word: הוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: L’impératif de ישׁע désigne le salut ou la délivrance. « Sauve-moi » convient à la menace immédiate et préserve le vocabulaire large du texte sans préciser indûment la nature du secours.
theological_decisions:
- issue: Valeur de l’expression אַנְשֵׁי דָמִים
  choice: hommes de sang
  alternative: hommes sanguinaires ; hommes coupables de meurtre
  rationale: Le texte principal préserve l’image forte et l’expression masculine de l’hébreu. La note indique ses principales valeurs possibles sans trancher entre soif de violence et culpabilité pour du sang versé.
- issue: Portée morale de אָוֶן
  choice: le mal
  alternative: l’iniquité ; le méfait ; le malheur
  rationale: Dans son parallélisme avec les « hommes de sang », אָוֶן désigne vraisemblablement une conduite mauvaise. « Le mal » rend ce sens moral tout en évitant de restreindre le terme à une catégorie théologique plus précise.
translation_notes:
  register: Français international moderne, simple et solennel. Le parallélisme de la supplication et la distinction entre « délivre-moi » et « sauve-moi » sont conservés. L’expression hébraïque « hommes de sang » est maintenue dans le texte et éclairée en note.
