source:
  edition: WLC
  text: אַל תַּהַרְגֵ֤/ם פֶּֽן יִשְׁכְּח֬וּ עַמִּ֗/י הֲנִיעֵ֣/מוֹ בְ֭/חֵילְ/ךָ וְ/הוֹרִידֵ֑/מוֹ מָֽגִנֵּ֣/נוּ אֲדֹנָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/011.yaml
  text: Do not kill them[a], lest my people forget; make them wander by your power and bring them down[b], O Lord our shield.
translation:
  language: fr
  text: Ne les tue pas, de peur que mon peuple n’oublie. Fais-les errer[a] par ta puissance[b] et abaisse-les, Seigneur, notre bouclier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fais-les chanceler » ou « ébranle-les » ; le verbe hébreu peut exprimer un mouvement continuel ou l’instabilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « par ta force » ; le mot hébreu peut désigner la force, la puissance ou des forces militaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּהַרְגֵמוֹ
  choice: Ne les tue pas
  rationale: La particule négative avec la forme verbale exprime une interdiction; « tuer » rend directement et naturellement הרג.
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: de peur que mon peuple n’oublie
  rationale: פֶּן introduit le résultat redouté. La tournure française avec « ne » explétif est naturelle et n’exprime pas ici une négation autonome.
- source_word: הֲנִיעֵמוֹ
  choice: Fais-les errer
  rationale: La forme causative peut évoquer un déplacement continuel ou une instabilité. « Fais-les errer » convient au contraste avec une mise à mort immédiate, sans effacer les autres possibilités lexicales.
- source_word: בְחֵילְךָ
  choice: par ta puissance
  rationale: חַיִל peut désigner la force, la puissance ou des forces militaires; dans cette adresse à Dieu, « puissance » rend naturellement la valeur instrumentale.
- source_word: וְהוֹרִידֵמוֹ
  choice: et précipite-les
  rationale: Le causatif de ירד signifie faire descendre ou abaisser. « Précipite-les » conserve ici l’image dynamique de leur chute sans expliciter indûment sa modalité.
- source_word: מָגִנֵּנוּ אֲדֹנָי
  choice: Seigneur, notre bouclier
  rationale: אֲדֹנָי est un titre divin employé en apostrophe, tandis que « bouclier » préserve la métaphore concrète du texte hébreu.
theological_decisions:
- issue: Nature du jugement demandé
  choice: Le psalmiste demande que les ennemis ne soient pas tués immédiatement, mais qu’ils subissent un jugement prolongé et mémorable.
  alternative: Le texte peut demander plus généralement qu’ils soient ébranlés ou rendus instables, sans nécessairement évoquer une errance.
  rationale: La succession « ne les tue pas… fais-les errer… précipite-les » oppose la mort immédiate à une humiliation visible, tout en laissant ouverte la nuance exacte de הֲנִיעֵמוֹ.
translation_notes:
  register: Français international moderne, digne et accessible. L’impératif direct conserve la vigueur de la prière; « notre bouclier » maintient l’image traditionnelle sans l’aplanir en « protecteur ».
