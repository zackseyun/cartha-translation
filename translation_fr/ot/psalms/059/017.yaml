  text: עֻ֭זִּ/י אֵלֶ֣י/ךָ אֲזַמֵּ֑רָה כִּֽי אֱלֹהִ֥ים מִ֝שְׂגַּבִּ֗/י אֱלֹהֵ֥י חַסְדִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: fr
  text: 'Ô ma force, je chanterai tes louanges, car Dieu est ma forteresse, le Dieu de mon amour fidèle[a].


    [a] On peut aussi comprendre : « mon Dieu bienveillant » ou « le Dieu qui me témoigne un amour fidèle ». L’hébreu dit littéralement : « le Dieu de mon amour fidèle ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « mon Dieu bienveillant » ou « le Dieu qui me témoigne un amour fidèle ». L’hébreu dit littéralement : « le Dieu de mon amour fidèle ».'
    reason: Signaler les principales interprétations de la construction hébraïque condensée אֱלֹהֵי חַסְדִּי.
lexical_decisions:
- source_word: עֻזִּי
  choice: Ô ma force
  rationale: Le nom signifie « force, puissance » avec le suffixe « ma ». Dans ce contexte poétique, il sert d’adresse directe à Dieu ; « Ô » rend clairement ce vocatif en français.
- source_word: אֵלֶיךָ אֲזַמֵּרָה
  choice: je chanterai tes louanges
  rationale: Le piel de זמר désigne couramment le chant de louange. La tournure française avec le possessif rend naturellement l’orientation vers Dieu exprimée par אֵלֶיךָ.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de la louange et « car » conserve ce lien causal dans un registre poétique naturel.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Bien que sa forme soit morphologiquement plurielle, le mot désigne ici le Dieu d’Israël au singulier.
- source_word: מִשְׂגַּבִּי
  choice: ma forteresse
  rationale: Le terme évoque un lieu élevé et sûr qui protège. « Forteresse » exprime concrètement cette sécurité défensive en français.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: le Dieu de mon amour fidèle
  rationale: Cette formulation suit la chaîne construite hébraïque, littéralement « le Dieu de mon ḥésed », et conserve sa densité ainsi que son ambiguïté. « Amour fidèle » exprime la loyauté durable associée à חֶסֶד sans imposer une seule relation grammaticale.
theological_decisions:
- issue: Rapport de חַסְדִּי à Dieu
  choice: Conserver dans le texte « le Dieu de mon amour fidèle »
  alternative: « mon Dieu bienveillant » ou « le Dieu qui me témoigne un amour fidèle »
  rationale: L’expression hébraïque condensée peut caractériser Dieu comme source ou manifestation de l’amour fidèle, ou maintenir une relation génitivale moins explicitée. Le texte principal garde cette tension, tandis que la note présente des compréhensions naturelles sans en imposer une.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocatif « Ô ma force » conserve l’adresse lyrique ; le reste privilégie une syntaxe fluide tout en maintenant l’ambiguïté théologique de la dernière expression.
