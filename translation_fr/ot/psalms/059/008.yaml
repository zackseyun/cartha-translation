source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: fr
  text: Mais toi, Yahweh, tu ris d’eux ; tu te moques de toutes les nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque ici un contraste avec les adversaires décrits auparavant. « Mais toi » exprime naturellement ce tournant rhétorique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: תִּשְׂחַק לָ/מוֹ
  choice: tu ris d’eux
  rationale: Le verbe signifie concrètement « rire », et la préposition avec suffixe désigne ceux vers qui ce rire est dirigé. « Rire d’eux » est l’expression française naturelle.
- source_word: תִּלְעַג
  choice: tu te moques
  rationale: Le verbe exprime la moquerie ou la dérision. « Se moquer de » est clair, actuel et suffisamment vigoureux.
- source_word: לְ/כָל גּוֹיִם
  choice: de toutes les nations
  rationale: גּוֹיִם désigne ici les nations ou peuples, sans imposer le sens technique ultérieur de « païens ». La préposition est régie en français par « se moquer de ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le nom divin. « Yahweh » en préserve la valeur de nom propre sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des deux propositions est conservé, ainsi que l’image anthropomorphique du rire divin, sans l’atténuer ni l’expliquer.
