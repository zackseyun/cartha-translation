source:
  edition: WLC
  text: וַ/אֲנִ֤י אָשִׁ֣יר עֻזֶּ/ךָ֮ וַ/אֲרַנֵּ֥ן לַ/בֹּ֗קֶר חַ֫סְדֶּ֥/ךָ כִּֽי הָיִ֣יתָ מִשְׂגָּ֣ב לִ֑/י וּ֝/מָנ֗וֹס בְּ/י֣וֹם צַר לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: fr
  text: Mais moi, je chanterai ta force ; le matin, j’acclamerai ton amour fidèle[a], car tu as été pour moi une forteresse, un refuge au jour de ma détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je pousserai des cris de joie pour ton amour fidèle ». Le verbe peut désigner aussi bien un chant qu’une acclamation joyeuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le pronom indépendant, joint à la conjonction, marque le contraste avec les ennemis évoqués auparavant.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: je chanterai ta force
  rationale: Le verbe exprime ici la résolution du psalmiste, et עֹז désigne la puissance protectrice de Dieu.
- source_word: וַאֲרַנֵּן
  choice: j’acclamerai
  rationale: Le verbe רנן évoque une expression vocale sonore et joyeuse ; « acclamer » en restitue l’intensité sans répéter simplement « chanter ».
- source_word: לַבֹּקֶר
  choice: dès le matin
  rationale: La locution a une valeur temporelle et s’inscrit dans le contraste contextuel avec la nuit.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne un amour loyal, durable et engagé ; cette formulation naturelle en français en préserve les principales nuances.
- source_word: הָיִיתָ מִשְׂגָּב לִי
  choice: tu as été pour moi une forteresse
  rationale: Le parfait rappelle une protection éprouvée, tandis que מִשְׂגָּב représente un lieu élevé et sûr.
- source_word: וּמָנוֹס
  choice: un refuge
  rationale: מָנוֹס est un lieu où l’on fuit pour trouver la sécurité ; « refuge » est précis et idiomatique.
- source_word: בְּיוֹם צַר לִי
  choice: au jour de ma détresse
  rationale: Cette formulation conserve l’image temporelle et le caractère personnel de l’adversité.
theological_decisions:
- issue: Traduction de חֶסֶד dans le contexte de la délivrance divine
  choice: ton amour fidèle
  alternative: ta bonté fidèle ; ton amour d’alliance ; ta miséricorde
  rationale: « Amour fidèle » exprime la loyauté durable et la bienveillance de Dieu sans limiter le terme à une formulation confessionnelle particulière.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme est conservé, avec une ponctuation qui clarifie les deux motifs de louange et les deux images de protection.
