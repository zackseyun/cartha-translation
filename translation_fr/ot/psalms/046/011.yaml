  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: fr
  text: Yahweh des armées est avec nous ; le Dieu de Jacob est pour nous une forteresse[a]. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un refuge sûr » ou « une haute forteresse ». Le mot hébreu désigne un lieu élevé et protégé.
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est un terme hébreu probablement liturgique ou musical, dont le sens précis reste incertain.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: le maître des armées
  rationale: Dans l’expression יְהוָה צְבָאוֹת, le pluriel désigne des armées ou troupes, avec de possibles connotations célestes. Cette formulation française naturelle exprime l’autorité de Yahweh sur elles sans limiter leur référent.
- source_word: עִמָּנוּ
  choice: est avec nous
  rationale: Rend directement la préposition עִם avec le suffixe de première personne du pluriel ; le verbe « est » explicite la proposition nominale en français.
- source_word: מִשְׂגָּב
  choice: une forteresse
  rationale: Le terme évoque un lieu élevé, sûr et fortifié ; « forteresse » conserve l’image concrète de protection.
- source_word: לָנוּ
  choice: pour nous
  rationale: 'Le ל marque ici l’intérêt ou l’avantage : Dieu est une forteresse en notre faveur.'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: le Dieu de Jacob
  rationale: Rend naturellement l’état construit et conserve l’identification biblique et historique.
- source_word: סֶלָה
  choice: Sèlah
  rationale: La fonction exacte de ce terme liturgique ou musical demeure incertaine ; sa transcription évite de trancher abusivement.
theological_decisions:
- issue: Rendu de יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  alternative: Yahweh des armées ; le SEIGNEUR des armées
  rationale: Le choix conserve le nom divin et la portée militaire de צְבָאוֹת. « Le maître des armées » est idiomatique en français et indique un rapport d’autorité que l’expression hébraïque implique, tout en laissant ouverte la question de savoir s’il s’agit d’armées terrestres, célestes ou des deux.
- issue: Image de מִשְׂגָּב
  choice: une forteresse pour nous
  alternative: un refuge pour nous ; une haute retraite pour nous
  rationale: « Forteresse » préserve mieux que le terme plus général « refuge » l’idée d’une protection forte, possiblement située en hauteur, sans surcharger le texte.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. La ponctuation met en relief les deux propositions parallèles. « Sèlah » reçoit l’accent grave pour guider la prononciation française, tout en restant une transcription.
