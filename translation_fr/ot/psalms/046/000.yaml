  yaml_path: translation/ot/psalms/046/000.yaml
  text: For the choir director. Of the sons of Korah. According to Alamoth[a]. A song.
translation:
  language: fr
  text: Au chef de chœur. Des fils de Coré. Sur Alamoth[a]. Un chant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « pour des voix de jeunes femmes », c’est-à-dire pour des voix féminines ou aiguës ; le terme hébreu « Alamoth » est probablement une indication musicale ou le nom d’un air.'
    reason: Le sens de ce terme musical hébreu est incertain.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. Cette formulation est claire et usuelle en français moderne.
- source_word: לִבְנֵי קֹרַח
  choice: Des fils de Coré
  rationale: Dans un titre, la préposition hébraïque peut exprimer l’appartenance, l’attribution ou la destination. « Des fils de Coré » conserve cette relative ambiguïté sans préciser s’ils en sont les auteurs ou les exécutants.
- source_word: עַל
  choice: Sur
  rationale: Dans les indications musicales, cette préposition peut introduire un air, un mode ou une manière d’exécuter le psaume. « Sur » est une formulation française concise et traditionnelle qui ne tranche pas entre ces possibilités.
- source_word: עֲלָמוֹת
  choice: Alamoth
  rationale: 'Le sens technique du terme est incertain : il peut désigner un air, une indication musicale ou des voix de jeunes femmes, éventuellement aiguës. La translittération évite de résoudre artificiellement cette incertitude.'
- source_word: שִׁיר
  choice: Un chant
  rationale: Le nom indique le genre de la composition. « Un chant » en donne une formulation française naturelle et fidèle.
