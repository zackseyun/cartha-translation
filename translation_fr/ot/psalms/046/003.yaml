  text: Its waters roar and foam; the mountains quake at its swelling[a]. Selah
translation:
  language: fr
  text: Ses eaux grondent et écument ; les montagnes tremblent à son gonflement[a]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à son orgueil » ou « à son soulèvement ». Le nom hébreu peut désigner l’élévation, l’orgueil ou le gonflement ; dans ce contexte, le sens physique est probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶהֱמוּ
  choice: grondent
  rationale: Le verbe המה évoque un bruit puissant et tumultueux. « Gronder » convient naturellement aux eaux agitées et conserve la force sonore de l’hébreu.
- source_word: יֶחְמְרוּ
  choice: bouillonnent
  rationale: Dans ce contexte, חמר décrit vraisemblablement des eaux qui s’agitent, écument ou deviennent tumultueuses. « Bouillonnent » offre en français une image vive et naturelle sans imposer l’idée littérale d’ébullition.
- source_word: מֵימָיו
  choice: ses eaux
  rationale: Le suffixe masculin singulier renvoie à la réalité aquatique évoquée au verset précédent. « Ses eaux » maintient le rapport possessif, avec un antécédent poétique implicite.
- source_word: יִרְעֲשׁוּ
  choice: tremblent
  rationale: רעשׁ désigne une violente secousse. Appliqué aux montagnes, « tremblent » est idiomatique et restitue clairement l’ébranlement.
- source_word: הָרִים
  choice: les montagnes
  rationale: L’article hébreu est conservé ; les montagnes appartiennent à la scène cosmique décrite par le poème.
- source_word: בְּגַאֲוָתוֹ
  choice: devant leur déchaînement
  rationale: גאוה peut exprimer l’élévation, l’orgueil ou, pour des eaux, la montée et la violence tumultueuse. « Déchaînement » rend naturellement ici la force physique des eaux, tout en laissant en note les autres nuances possibles. Le possessif français est mis au pluriel pour reprendre « les eaux ».
- source_word: סֶלָה
  choice: Sélah
  rationale: Ce terme liturgique ou musical de sens incertain est translittéré plutôt que traduit, afin de ne pas lui attribuer une valeur trop précise.
