    issue: Nuance de הָמוּ affaiblie
    rationale: « S’agitaient » exprime l’agitation, mais non le tumulte sonore ou le grondement inhérent à הָמוּ. « Ont grondé » conserve les deux dimensions de manière poétique et intelligible.
  - severity: low
    issue: Aspect verbal français non uniforme
    rationale: Le projet emploie l’imparfait pour les deux premiers verbes puis le passé composé pour les deux suivants, alors que les quatre verbes hébreux sont à l’accompli. Une série cohérente de passés composés évite de suggérer sans nécessité un arrière-plan duratif distinct.
  - severity: low
    issue: Portée incomplète de la note alternative
    rationale: La note anglaise d’audit donne une alternative pour les deux premiers membres (« Nations were in tumult, kingdoms were shaken »), tandis que la note française ne porte que sur les nations. La note révisée restitue le parallélisme complet.
