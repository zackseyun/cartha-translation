source:
  edition: WLC
  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: fr
  text: Les nations ont grondé[a], les royaumes ont vacillé ; il a fait entendre sa voix, la terre a fondu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les nations étaient en tumulte, les royaumes furent ébranlés. »'
    reason: 'Alternative lexicale : « étaient en tumulte » explicite l’agitation bruyante de הָמוּ, et « furent ébranlés » rend la nuance possible de perte de stabilité de מָטוּ.'
lexical_decisions:
- source_word: הָמוּ
  choice: s’agitaient
  rationale: Le verbe exprime à la fois le tumulte sonore et l’agitation. « S’agitaient » conserve cette ampleur sans réduire le sens à la seule hostilité ; la note signale une formulation plus explicitement sonore.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le terme désigne ici des peuples constitués en entités collectives et répond au parallèle « les royaumes ». « Les nations » est naturel et n’introduit pas une opposition entre Juifs et non-Juifs.
- source_word: מָטוּ
  choice: vacillaient
  rationale: Le verbe évoque la perte de stabilité, sans imposer l’idée d’une chute déjà achevée. « Vacillaient » convient au parallélisme poétique et reste idiomatique.
- source_word: מַמְלָכוֹת
  choice: les royaumes
  rationale: Équivalent direct et courant pour les domaines politiques gouvernés par un roi.
- source_word: נָתַן בְּקוֹלוֹ
  choice: il a fait entendre sa voix
  rationale: Littéralement, « il a donné sa voix ». La formulation française garde l’idée d’une intervention vocale puissante sans suggérer seulement une hausse de volume.
- source_word: תָּמוּג
  choice: a fondu
  rationale: Le verbe décrit ce qui fond, se dissout ou perd sa fermeté. « A fondu » préserve l’image saisissante du texte plutôt que de la remplacer par une simple secousse.
- source_word: אָרֶץ
  choice: la terre
  rationale: La portée universelle du contexte, avec les nations et les royaumes, favorise « la terre » plutôt que « le pays ».
theological_decisions:
- issue: Sujet implicite de נָתַן
  choice: « il », renvoyant à Dieu d’après le contexte
  alternative: Expliciter « Dieu » ou « le Seigneur »
  rationale: L’hébreu porte un sujet masculin singulier implicite sans nom divin dans ce verset. Le pronom préserve cette concision et laisse le contexte identifier le sujet.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique sobre. L’imparfait rend l’agitation en cours des nations et des royaumes, tandis que le passé composé marque l’intervention divine et son effet. La métaphore forte « la terre a fondu » est conservée.
