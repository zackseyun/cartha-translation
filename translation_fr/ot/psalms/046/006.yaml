revisions:
- from: Les nations s’agitaient[a], les royaumes vacillaient ; il a fait entendre sa voix, la terre a fondu.
  to: Les nations ont grondé[a], les royaumes ont vacillé ; il a fait entendre sa voix, la terre a fondu.
  rationale: La révision rétablit la composante sonore et tumultueuse de הָמוּ par « ont grondé », harmonise la représentation française des accomplis hébreux et étend la note alternative aux deux éléments du parallélisme. Elle conserve l’image forte de la terre qui fond, le sujet divin implicite et l’absence de toute précision doctrinale ajoutée.
