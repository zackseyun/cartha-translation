base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/005.yaml
  text: God is within her[a]; she will not be moved[c][b]. God will help her when morning dawns.
translation:
  language: fr
  text: Dieu est au milieu d’elle[a] ; elle ne sera pas ébranlée[b]. Dieu lui viendra en aide au point du jour[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en elle ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « elle ne chancellera pas » ou « elle ne vacillera pas ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « au tournant du matin » ; c’est-à-dire au point du jour ou quand le matin paraît.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte du psaume, cette forme désigne clairement le Dieu unique d’Israël.
- source_word: בְּקִרְבָּהּ
  choice: au milieu d’elle
  rationale: L’expression indique la présence de Dieu à l’intérieur de la ville et conserve le pronom féminin qui renvoie au contexte précédent.
- source_word: בַּל תִּמּוֹט
  choice: elle ne sera pas ébranlée
  rationale: Le nifal de מוט exprime l’idée de chanceler ou d’être ébranlé. Cette formulation française est naturelle et préserve l’image de stabilité.
- source_word: יַעְזְרֶהָ
  choice: Dieu lui viendra en aide
  rationale: L’imparfait exprime ici une intervention assurée. « Viendra en aide » rend clairement et naturellement cette action.
- source_word: לִפְנוֹת בֹּקֶר
  choice: dès l’aube
  rationale: L’expression désigne le moment où le matin paraît, c’est-à-dire le point du jour. « Dès l’aube » est idiomatique sans ajouter d’interprétation étrangère.
theological_decisions:
- issue: Référent des pronoms féminins singuliers
  choice: Les pronoms renvoient à la ville de Dieu, mentionnée dans le contexte immédiat.
  alternative: Ils pourraient, par extension, désigner la communauté du peuple de Dieu.
  rationale: La grammaire féminine singulière renvoie le plus naturellement à la ville. La traduction garde les pronoms plutôt que d’insérer un nom interprétatif.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en deux phrases conserve le parallélisme du verset, tandis que les notes signalent les principales possibilités lexicales sans surcharger le texte.
