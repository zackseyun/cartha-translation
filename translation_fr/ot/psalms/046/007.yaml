  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: fr
  text: Yahweh des armées est avec nous ; le Dieu de Jacob est pour nous une forteresse. Séla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel exprimé par le tétragramme, au lieu de le remplacer par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend de façon transparente le pluriel hébreu et conserve la portée militaire ou céleste du titre divin.
- source_word: עִמָּנוּ
  choice: est avec nous
  rationale: Exprime directement la présence solidaire et protectrice indiquée par la préposition avec le suffixe de première personne du pluriel.
- source_word: מִשְׂגָּב
  choice: forteresse
  rationale: Évoque naturellement en français un lieu élevé, sûr et défensif, sans réduire le terme à la seule idée abstraite de refuge.
- source_word: לָנוּ
  choice: pour nous
  rationale: Rend la relation de bénéfice marquée par la préposition ל et son suffixe.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: le Dieu de Jacob
  rationale: Traduction directe de la chaîne construite, qui maintient le lien ancestral et historique avec Jacob.
- source_word: סֶלָה
  choice: Séla
  rationale: La fonction exacte de ce terme liturgique ou musical étant incertaine, une translittération évite une interprétation indûment précise.
theological_decisions:
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur de l’univers / l’Éternel des armées
  rationale: Le texte porte explicitement le nom divin יְהוָה. « Yahweh » le conserve comme nom propre, tandis que « des armées » maintient l’image plurielle de צְבָאוֹת sans la résoudre exclusivement en armées humaines, célestes ou cosmiques.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. Le parallélisme hébreu est conservé, avec une ponctuation claire. « Séla » est accentué selon l’usage français.
