  text: אֱלֹהִ֣ים לָ֭/נוּ מַחֲסֶ֣ה וָ/עֹ֑ז עֶזְרָ֥ה בְ֝/צָר֗וֹת נִמְצָ֥א מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/001.yaml
  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: fr
  text: Dieu est pour nous un refuge et une force, un secours pleinement disponible dans la détresse.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un secours dans les détresses, trouvé extrêmement ». La formule hébraïque est condensée et peut évoquer un secours qui se révèle pleinement disponible dans la détresse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Malgré sa forme morphologiquement plurielle, le mot désigne ici, avec un sens singulier, le Dieu d’Israël.
- source_word: לָנוּ
  choice: pour nous
  rationale: Cette formulation rend directement la préposition לְ avec le suffixe de première personne du pluriel et reste naturelle en français.
- source_word: מַחֲסֶה
  choice: un refuge
  rationale: « Refuge » exprime avec concision un lieu de protection et conserve l’image du texte hébreu.
- source_word: וָעֹז
  choice: et une force
  rationale: עֹז désigne ici la force ou la puissance. « Une force » maintient le parallélisme nominal avec « un refuge ».
- source_word: עֶזְרָה
  choice: un secours
  rationale: « Secours » convient au registre poétique et désigne à la fois l’aide apportée et celui qui vient en aide.
- source_word: בְצָרוֹת
  choice: dans la détresse
  rationale: Le pluriel hébreu désigne des situations de détresse. Le singulier collectif français est plus idiomatique tout en couvrant ces temps d’épreuve.
- source_word: נִמְצָא מְאֹד
  choice: toujours présent
  rationale: Littéralement « trouvé beaucoup/extrêmement », cette expression comprimée indique que Dieu se laisse réellement trouver comme secours. « Toujours présent » communique cette disponibilité en français naturel sans développer davantage l’image.
theological_decisions:
- issue: Sens et rattachement de נִמְצָא מְאֹד dans la proposition finale
  choice: un secours toujours présent dans la détresse
  alternative: un secours dans les détresses, trouvé en abondance
  rationale: La syntaxe hébraïque est concise et peut souligner soit que Dieu est aisément trouvé, soit qu’il se révèle pleinement disponible. Le texte principal donne le sens idiomatique sans préciser le mode de l’intervention divine; la note conserve la forme plus littérale et l’ambiguïté de rattachement.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase reste brève et mémorisable; « détresse » au singulier collectif évite le tour peu naturel « dans les détresses ». Le rendu idiomatique de la dernière proposition est accompagné d’une note qui expose la formulation hébraïque comprimée.
