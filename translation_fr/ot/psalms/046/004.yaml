  text: נָהָ֗ר פְּלָגָ֗י/ו יְשַׂמְּח֥וּ עִיר אֱלֹהִ֑ים קְ֝דֹ֗שׁ מִשְׁכְּנֵ֥י עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/004.yaml
  text: A river—its streams make glad the city of God[b][a], the holy dwelling place of the Most High.
translation:
  language: fr
  text: Un fleuve[a] — ses bras réjouissent la cité de Dieu, le lieu saint où demeure le Très-Haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Il y a un fleuve dont les bras réjouissent la cité de Dieu. » L’hébreu commence par une phrase nominale : « Un fleuve — ses bras… »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le lieu saint des demeures du Très-Haut ». Le mot hébreu correspondant à « demeures » est au pluriel ; il peut évoquer les espaces sacrés ou, collectivement, la demeure de Dieu. Le texte français l’explicite par « le lieu saint où demeure le Très-Haut ».'
    reason: alternative_reading
lexical_decisions:
- source_word: נָהָר
  choice: Un fleuve
  rationale: Le nom est sans article et ouvre une phrase nominale poétique. « Un fleuve » en reproduit directement la forme, tandis que la note signale une formulation française plus explicitée.
- source_word: פְּלָגָיו
  choice: ses bras
  rationale: Le pluriel muni du suffixe renvoie au fleuve. En français, les « bras » d’un fleuve désignent naturellement ses ramifications ou ses différents cours.
- source_word: יְשַׂמְּחוּ
  choice: réjouissent
  rationale: 'Le piel exprime ici l’effet causé par les bras du fleuve : ils apportent la joie. « Réjouissent » conserve cette valeur causative dans un registre poétique naturel.'
- source_word: עִיר אֱלֹהִים
  choice: la cité de Dieu
  rationale: Cette expression rend directement la chaîne construite. « Cité » convient au registre poétique sans être archaïque.
- source_word: קְדֹשׁ
  choice: le lieu saint
  rationale: Le masculin singulier peut fonctionner substantivement et désigner le lieu sacré. Cette lecture respecte l’apposition poétique après « la cité de Dieu » sans faire artificiellement de l’adjectif l’épithète d’un pluriel.
- source_word: מִשְׁכְּנֵי
  choice: où demeure
  rationale: Le texte hébreu emploie littéralement le pluriel « demeures de ». La proposition relative exprime naturellement en français que la cité est le lieu de la présence du Très-Haut, tandis qu’une note conserve la transparence sur le pluriel hébreu.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Titre divin traditionnel, clair et toujours courant, qui rend la notion de suprême élévation.
theological_decisions:
- issue: Valeur du pluriel מִשְׁכְּנֵי et son rapport avec קְדֹשׁ
  choice: Rendre idiomatiquement l’ensemble par « le lieu saint où demeure le Très-Haut », avec une note sur le pluriel hébreu
  alternative: « le lieu saint des demeures du Très-Haut » ou « les saintes demeures du Très-Haut »
  rationale: La première solution de rechange est peu naturelle en français, et la seconde ferait de קְדֹשׁ, singulier masculin, l’épithète directe d’un nom pluriel. Le texte principal conserve l’idée de la présence divine sans décider si le pluriel désigne plusieurs espaces sacrés, l’ensemble du sanctuaire ou un pluriel d’intensité; la note maintient l’ambiguïté de la forme source.
translation_notes:
  register: Français international moderne, poétique et digne. Le tiret maintient l’ouverture abrupte de l’hébreu; « bras » donne une image fluviale immédiatement compréhensible. La formulation évite aussi bien l’archaïsme « tabernacles » qu’une syntaxe française artificielle.
