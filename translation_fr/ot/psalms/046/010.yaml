source:
  edition: WLC
  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: fr
  text: Cessez[a], et sachez que moi, je suis Dieu ! Je serai exalté[b] parmi les nations, je serai exalté sur la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Relâchez » ou « Lâchez prise » ; l’impératif hébreu peut signifier cesser, se relâcher ou desserrer son emprise.
    reason: lexical_alternative
  - marker: b
    text: Ou « Je suis exalté » ; la forme hébraïque peut avoir ici une valeur présente ou future.
    reason: alternative_reading
  - marker: c
    text: « Terre » peut aussi se traduire par « pays », mais la portée générale du psaume favorise ici le sens mondial.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Cessez
  rationale: L’impératif de רפה peut exprimer l’idée de relâcher, de lâcher prise ou de cesser. « Cessez » conserve ici la force du commandement sans le réduire à une invitation à la méditation intérieure.
- source_word: וּדְעוּ
  choice: et sachez
  rationale: ידע signifie fondamentalement « savoir, connaître » et peut impliquer ici la reconnaissance. « Sachez » garde la formulation directe de l’impératif et laisse cette nuance ouverte.
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce qu’il faut savoir ; « que » est la construction française naturelle.
- source_word: אָנֹכִי אֱלֹהִים
  choice: que moi, je suis Dieu
  rationale: Le pronom אָנֹכִי est exprimé devant « Dieu » et porte une certaine insistance. « Moi, je » la rend naturellement en français sans ajouter d’intensificateur absent du texte.
- source_word: אָרוּם
  choice: Je serai exalté
  rationale: L’imparfait hébreu de רום peut avoir ici une valeur future ou exprimer une réalité assurée. Le futur français convient au mouvement de la déclaration, tandis qu’une note préserve l’autre lecture possible.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne ici les nations ou peuples. « Parmi les nations » est naturel et respecte la portée universelle du psaume.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut signifier « terre » ou « pays ». Le parallélisme avec « les nations » favorise ici le sens mondial, et « sur la terre » est l’expression française idiomatique.
theological_decisions:
- issue: Portée de l’impératif הַרְפּוּ
  choice: Un ordre de cesser ou de relâcher, rendu par « Cessez »
  alternative: « Tenez-vous tranquilles », compris surtout comme un appel au calme intérieur, ou « Lâchez prise »
  rationale: Dans le contexte des conflits et de la souveraineté divine, le verbe appelle probablement à mettre fin à l’agitation ou à la résistance. « Cessez » préserve cette portée large sans exclure l’apaisement intérieur.
- issue: Valeur temporelle de אָרוּם
  choice: 'Futur assuré : « Je serai exalté »'
  alternative: 'Présent : « Je suis exalté »'
  rationale: La forme hébraïque permet de comprendre soit l’exaltation certaine à venir, soit l’affirmation d’une réalité présente. Le futur s’intègre bien au contexte, mais l’ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. « Cessez » évite de réduire le verset à une formule de recueillement privé ; « moi, je » rend l’emphase du pronom hébreu. Le parallélisme des deux propositions finales est conservé.
