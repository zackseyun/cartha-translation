  text: עַל כֵּ֣ן לֹא נִ֭ירָא בְּ/הָמִ֣יר אָ֑רֶץ וּ/בְ/מ֥וֹט הָ֝רִ֗ים בְּ/לֵ֣ב יַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: fr
  text: C’est pourquoi nous ne craindrons pas, même si la terre change[a], même si les montagnes chancellent au cœur des mers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « même si la terre est bouleversée ». Le verbe hébreu peut désigner un changement ou un échange ; ici, le contexte évoque la déstabilisation de la terre.
    reason: lexical_alternative
  - marker: b
    text: Ou « même si les montagnes sont ébranlées au cœur des mers ». Le verbe hébreu peut exprimer le vacillement, l’ébranlement ou le déplacement.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: 'Cette locution exprime naturellement la conséquence tirée de la confession du verset précédent : Dieu est refuge et force.'
- source_word: לֹא נִירָא
  choice: nous ne craindrons pas
  rationale: L’imparfait hébreu exprime ici une confiance résolue face à une éventualité future; le futur français conserve bien cette nuance.
- source_word: בְּהָמִיר אָרֶץ
  choice: même si la terre change
  rationale: La construction infinitive avec בְּ présente la circonstance envisagée. « Change » reste proche du sens de מוּר sans préciser à tort la nature exacte du bouleversement.
- source_word: וּבְמוֹט הָרִים
  choice: même si les montagnes chancellent
  rationale: מוֹט évoque la perte de stabilité, le vacillement ou le déplacement. « Chancellent » garde l’image poétique sans imposer un mode précis d’effondrement.
- source_word: בְּלֵב יַמִּים
  choice: au cœur des mers
  rationale: La traduction conserve la métaphore spatiale de לֵב (« cœur ») ainsi que le pluriel explicite יַמִּים (« mers »).
theological_decisions: []
