  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: fr
  text: Il fait cesser les guerres jusqu’aux confins de la terre ; il brise l’arc et taille la lance en pièces[b] ; il brûle les chariots[a] au feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les chars de guerre ». Le mot hébreu désigne plus littéralement des « chariots » ou des « charrettes », mais le contexte militaire peut expliquer la traduction traditionnelle « chars de guerre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tranche la lance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: fait cesser les guerres
  rationale: Le participe causatif (hifil) de שׁבת exprime le fait de provoquer la cessation. « Fait cesser » en conserve clairement la valeur causative.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: jusqu’aux confins de la terre
  rationale: Cette tournure française naturelle rend l’idée d’une extension jusqu’à la limite de la terre, sans réduire la portée collective de l’expression hébraïque.
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: il brise l’arc
  rationale: Le singulier générique désigne cette catégorie d’arme, et le piel de שׁבר exprime sa destruction par rupture.
- source_word: וְקִצֵּץ חֲנִית
  choice: et taille la lance en pièces
  rationale: קצץ signifie couper ou retrancher. Avec une lance comme objet, « taille … en pièces » exprime naturellement en français la mise hors d’usage de l’arme, sans préciser arbitrairement qu’elle est coupée exactement en deux.
- source_word: עֲגָלוֹת
  choice: les chariots
  rationale: Le nom désigne ordinairement des chariots ou véhicules à roues, et non le terme hébreu habituel pour les chars de guerre. « Chariots » garde ce sens lexical dans le contexte militaire.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: il brûle par le feu
  rationale: La formulation conserve la mention explicite du feu dans l’hébreu tout en restant intelligible en français.
theological_decisions:
- issue: Interprétation de עֲגָלוֹת dans un contexte militaire
  choice: chariots
  alternative: chars de guerre
  rationale: Le contexte est militaire, mais le mot hébreu n’est pas le terme ordinaire pour les chars de guerre. Le texte principal retient donc le sens lexical direct, tandis que la note signale l’interprétation traditionnelle possible.
- issue: Étendue du sens de וְקִצֵּץ appliqué à la lance
  choice: taille la lance en pièces
  alternative: tranche la lance
  rationale: Le verbe évoque une action de couper sans indiquer explicitement le nombre de morceaux. La traduction principale rend la destruction de l’arme sans introduire la précision non exprimée « en deux » ; la note conserve une formulation plus sobre.
