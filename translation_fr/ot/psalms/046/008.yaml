source:
  edition: WLC
  text: לְֽכוּ חֲ֭זוּ מִפְעֲל֣וֹת יְהוָ֑ה אֲשֶׁר שָׂ֖ם שַׁמּ֣וֹת בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/008.yaml
  text: Come, see the works of the LORD, who has set desolations in the earth.
translation:
  language: fr
  text: Venez, voyez les œuvres du SEIGNEUR, les ravages qu’il a produits sur la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכוּ חֲזוּ
  choice: Venez, voyez
  rationale: L’impératif לְכוּ fonctionne ici comme une invitation à s’approcher; « Venez, voyez » est naturel en français et conserve les deux impératifs.
- source_word: מִפְעֲלוֹת
  choice: les œuvres
  rationale: « Œuvres » rend le terme désignant les actes accomplis par le SEIGNEUR dans un registre digne et courant.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: La convention typographique française « le SEIGNEUR » représente le tétragramme sans introduire une vocalisation disputée.
- source_word: שַׁמּוֹת
  choice: les ravages
  rationale: Le pluriel évoque des dévastations ou désolations concrètes; « ravages » est plus naturel ici que « désolations » tout en gardant la force du terme.
- source_word: שָׂם
  choice: qu’il a produits
  rationale: Dans ce contexte, שׂים signifie qu’il a fait advenir ou établi ces ravages; « produits » garde l’attribution explicite sans ajouter l’idée plus précise de destruction exprimée par un autre verbe.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: La préposition et le nom peuvent viser la terre entière ou le pays; « sur la terre » préserve la portée large du contexte et correspond à l’expression française naturelle.
theological_decisions:
- issue: Attribution des ravages au SEIGNEUR
  choice: les ravages qu’il a produits
  alternative: les ravages qu’il a fait cesser
  rationale: Le texte massorétique vocalise שַׁמּוֹת, « ravages/désolations », comme objet de שָׂם; il attribue donc leur établissement au SEIGNEUR. La traduction ne réinterprète pas le verset à partir du verset suivant.
translation_notes:
  register: Français international moderne, direct et solennel. L’invitation conserve sa vigueur impérative; aucun archaïsme ni explicitation doctrinale n’est ajouté.
