source:
  edition: WLC
  text: כַּ/שֶּׁ֤מֶן הַ/טּ֨וֹב עַל הָ/רֹ֗אשׁ יֹרֵ֗ד עַֽל הַ/זָּקָ֥ן זְקַֽן אַהֲרֹ֑ן שֶׁ֝/יֹּרֵ֗ד עַל פִּ֥י מִדּוֹתָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: fr
  text: C’est comme l’huile excellente[a] sur la tête, qui descend sur la barbe, sur la barbe d’Aaron, qui descend sur le col de ses vêtements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’huile bonne ». On peut aussi comprendre : « l’huile précieuse » ou « l’huile fine ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la bouche de ses vêtements » ; l’expression peut désigner leur ouverture supérieure ou leur bord.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן
  choice: C’est comme l’huile
  rationale: Le préfixe כְּ marque une comparaison. « C’est comme » relie naturellement cette image à l’affirmation du verset précédent.
- source_word: הַטּוֹב
  choice: excellente
  rationale: טוֹב signifie fondamentalement « bon » et, appliqué à une huile, en souligne ici la qualité. « Excellente » est plus idiomatique en français que « la bonne huile », tout en évitant de surcharger le terme.
- source_word: יֹרֵד / שֶׁיֹּרֵד
  choice: qui descend / et qui descend
  rationale: Le verbe ירד décrit littéralement le mouvement descendant de l’huile. La répétition française conserve l’insistance et le rythme de l’hébreu.
- source_word: הַזָּקָן / זְקַן אַהֲרֹן
  choice: la barbe / la barbe d’Aaron
  rationale: La répétition explicite de « barbe » reproduit la structure poétique hébraïque au lieu de la lisser.
- source_word: פִּי מִדּוֹתָיו
  choice: au col de ses vêtements
  rationale: פִּי, littéralement « bouche de », désigne ici l’ouverture ou le bord des vêtements; « col » exprime naturellement en français l’ouverture supérieure vers laquelle descend l’huile. מִדּוֹת désigne dans ce contexte les vêtements d’Aaron.
theological_decisions:
- issue: Portée de l’image de l’huile sur Aaron
  choice: Conserver l’image d’une huile abondante descendant sur Aaron sans expliciter sa signification doctrinale dans le texte.
  alternative: Traduire explicitement « l’huile d’onction sacerdotale ».
  rationale: Le contexte évoque vraisemblablement l’onction d’Aaron, mais le verset formule une comparaison poétique et ne nomme pas explicitement l’huile d’onction. La traduction laisse donc l’allusion intacte sans lui imposer une interprétation.
translation_notes:
  register: Français moderne, international et poétique. La répétition de « descend » et de « barbe » est maintenue pour respecter le mouvement et l’insistance du texte hébreu. « Jusqu’au » rend explicite en français le terme atteint par la descente, sans modifier l’image.
