source:
  edition: WLC
  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: fr
  text: 'comme la rosée de l’Hermon, qui descend sur les montagnes de Sion. Car c’est là que Yahweh a ordonné la bénédiction : la vie pour toujours.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la bénédiction, la vie pour toujours » ; cette juxtaposition peut aussi se lire comme une formule finale distincte.'
    reason: ambiguïté syntaxique et poétique
lexical_decisions:
- source_word: כְּ/טַל חֶרְמוֹן
  choice: comme la rosée de l’Hermon
  rationale: Le préfixe כְּ marque la comparaison et טַל signifie « rosée ». La tournure française conserve simplement l’image poétique et le nom propre.
- source_word: שֶׁ/יֹּרֵד
  choice: qui descend
  rationale: Le verbe ירד exprime un mouvement vers le bas. « Descend » reste naturel avec la rosée et reproduit plus directement le mouvement du texte hébreu.
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: sur les montagnes de Sion
  rationale: הַרְרֵי est un pluriel construit. « Montagnes » conserve ce pluriel au lieu de l’aplanir en un singulier ou en « collines ».
- source_word: כִּי שָׁם
  choice: Car c’est là que
  rationale: כִּי introduit ici le fondement de l’affirmation précédente, tandis que שָׁם demeure « là ». La formulation française est fluide sans expliciter davantage le lieu visé.
- source_word: צִוָּה
  choice: a ordonné
  rationale: צוה exprime un acte d’autorité, « commander, ordonner ». Dans ce contexte, « a ordonné » convient mieux que le calque moins naturel « a commandé la bénédiction » et évite l’interprétation plus libre « a accordé ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à la forme personnelle du tétragramme dans le texte source.
- source_word: אֶת הַ/בְּרָכָה
  choice: la bénédiction
  rationale: Le substantif défini est rendu directement, l’indicateur d’objet אֶת n’ayant pas d’équivalent lexical en français.
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: la vie pour toujours
  rationale: חַיִּים désigne la vie, et עַד הָעוֹלָם en exprime la durée indéfinie ou perpétuelle. Cette formulation est actuelle, claire et digne.
theological_decisions:
- issue: Rapport entre la formule finale et « la bénédiction »
  choice: Présenter « la vie pour toujours » comme une apposition explicative au moyen de deux-points.
  alternative: 'Conserver la juxtaposition plus abrupte : « la bénédiction, la vie pour toujours » ; ou lire la formule comme une proposition ou une exclamation distincte.'
  rationale: La suite hébraïque compacte permet naturellement de comprendre que la vie durable précise le contenu ou la nature de la bénédiction. Les deux-points rendent ce rapport intelligible en français, tandis qu’une note conserve la juxtaposition formelle possible.
- issue: Référent de « là »
  choice: Conserver le simple adverbe « là » sans en préciser le référent.
  alternative: Expliciter « à Sion » ou « parmi les frères qui vivent dans l’unité ».
  rationale: Le texte hébreu ne donne que שָׁם, « là ». Une explicitation trancherait une référence que la poésie laisse concise et potentiellement riche.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le verset conserve le pluriel « montagnes », le nom divin « Yahweh » et l’indétermination de « là ». La ponctuation explicite la lecture appositionnelle sans masquer l’autre possibilité, signalée en note.
