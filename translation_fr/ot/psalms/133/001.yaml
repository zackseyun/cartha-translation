  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד הִנֵּ֣ה מַה טּ֭וֹב וּ/מַה נָּעִ֑ים שֶׁ֖בֶת אַחִ֣ים גַּם יָֽחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: fr
  text: 'Cantique des montées[a]. De David[b].


    Voyez comme il est bon, comme il est agréable que des frères[c] habitent ensemble[d] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression peut aussi se rendre par « chant des ascensions » ou, de manière plus interprétative, « chant de pèlerinage ».
    reason: lexical_alternative
  - marker: b
    text: Ou « par David » ou « pour David » ; la préposition hébraïque peut exprimer l’auteur, l’association ou la dédicace.
    reason: source_ambiguity
  - marker: c
    text: Le mot hébreu peut désigner des frères au sens propre ou, plus largement, des membres d’une même parenté ou communauté.
    reason: lexical_scope
  - marker: d
    text: L’expression hébraïque souligne le fait d’être ensemble ; on pourrait aussi traduire « tous ensemble ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cantique des montées
  rationale: Cette formule traditionnelle des Psaumes 120 à 134 rend le nom מַעֲלוֹת sans imposer une interprétation précise du cadre historique, comme le ferait « chant de pèlerinage ».
- source_word: לְדָוִד
  choice: De David
  rationale: Dans les titres des psaumes, la préposition לְ peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve mieux cette ouverture que « par David » ou « pour David ».
- source_word: הִנֵּה
  choice: Voyez
  rationale: L’impératif français attire naturellement l’attention et exprime l’admiration portée par הִנֵּה, tout en restant actuel et digne.
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: comme il est bon et agréable
  rationale: « Comme » rend ici la valeur exclamative de מַה devant les adjectifs. La coordination reste fluide en français sans devoir répéter le verbe.
- source_word: שֶׁבֶת
  choice: d’habiter
  rationale: L’infinitif construit de יׁשב désigne l’action ou l’état de demeurer. Après « il est bon et agréable pour », l’infinitif français en restitue naturellement la valeur.
- source_word: אַחִים
  choice: des frères
  rationale: Le masculin pluriel hébreu désigne des frères au sens propre, mais peut aussi s’étendre aux membres d’une même parenté ou communauté. Le texte principal conserve le terme concret et la note signale son extension possible.
- source_word: גַּם יָחַד
  choice: ensemble
  rationale: יָחַד signifie directement « ensemble » et גַּם renforce ici l’idée de communauté. Le français « ensemble » restitue le sens sans ajouter explicitement la notion interprétative d’« unité ».
theological_decisions:
- issue: Portée de אַחִים (« frères »)
  choice: Conserver « frères » dans le texte principal, avec une note sur son sens communautaire possible.
  alternative: Traduire par « membres d’une même famille », « proches » ou « membres du peuple ».
  rationale: Le mot peut viser des frères biologiques ou, plus largement, des membres apparentés du peuple de l’alliance. Le traduire par « frères » préserve cette image et évite de fixer indûment la portée du verset.
- issue: Force de גַּם יָחַד
  choice: Traduire par « ensemble » et signaler en note la nuance d’insistance.
  alternative: Traduire par « dans l’unité » ou « tous ensemble ».
  rationale: « Dans l’unité » explicite une harmonie que le contexte suggère, mais que le lexème יָחַד n’énonce pas à lui seul. « Ensemble » reste au plus près du texte, tandis que la note conserve l’effet emphatique de גַּם.
translation_notes:
  register: Français international moderne, poétique et digne. « Voyez » maintient l’appel admiratif sans l’archaïsme de « Voici » employé isolément. La formulation garde le parallélisme « bon et agréable » et évite de transformer l’idée d’être ensemble en affirmation doctrinale plus précise.
