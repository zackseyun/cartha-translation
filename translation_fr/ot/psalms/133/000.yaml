  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד הִנֵּ֣ה מַה טּ֭וֹב וּ/מַה נָּעִ֑ים שֶׁ֖בֶת אַחִ֣ים גַּם יָֽחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/000.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is for brothers to dwell together.
translation:
  language: fr
  text: 'Chant des montées. De David.


    Voyez comme il est bon et agréable que des frères habitent ensemble[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre : « que des frères vivent unis ». Le mot « frères » peut désigner des frères au sens propre ou, plus largement, des membres d’une même famille ou communauté. L’expression hébraïque finale souligne leur vie commune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend formellement le titre hébreu tout en conservant son ambiguïté quant aux montées ou pèlerinages visés.
- source_word: הִנֵּה
  choice: Voyez
  rationale: Interpellation française naturelle qui attire l’attention, comme l’impératif de présentation hébreu.
- source_word: אַחִים
  choice: des frères
  rationale: Correspond au sens direct du terme, qui peut désigner des frères au sens propre ou, plus largement, des membres apparentés ou de la communauté.
- source_word: גַּם יָחַד
  choice: aussi ensemble
  rationale: Conserve, malgré une légère insistance inhabituelle en français, la particule גַּם et l’idée de réunion exprimée par יָחַד, sans réduire d’emblée la formule à la seule notion interprétative d’unité.
theological_decisions:
- issue: Étendue du mot « frères »
  choice: Conserver « frères » dans le texte
  alternative: « membres d’une même famille » ou « proches »
  rationale: Le terme hébreu permet un sens littéral comme communautaire; le texte principal garde l’image et la note explicite son amplitude sans imposer une lecture confessionnelle.
- issue: Nature de la vie commune
  choice: « habitent aussi ensemble »
  alternative: « vivent dans l’unité »
  rationale: La traduction retenue préserve le sens spatial et relationnel de שׁבת et יחד, ainsi que l’emphase de גם, sans transformer explicitement la réunion en harmonie morale.
translation_notes:
  register: Français moderne, digne et accessible. Le titre traditionnel est rendu littéralement. L’exclamation restitue le caractère admiratif du verset; la formulation légèrement marquée « aussi ensemble » vise à préserver l’emphase et l’ambiguïté de l’hébreu.
