  text: מִזְמ֡וֹר שִׁיר חֲנֻכַּ֖ת הַ/בַּ֣יִת לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/000.yaml
  text: A psalm[a]. A song for the dedication of the house[b]. Of David.
translation:
  language: fr
  text: Psaume. Chant pour la dédicace de la maison[a]. De David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple » ou « du palais » ; l’hébreu dit simplement « de la maison ».
    reason: alternative_reading
  - marker: b
    text: Ou « par David » ou « pour David ».
    reason: ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme usuel et naturel en français pour ce genre de composition, avec sa dimension musicale.
- source_word: שִׁיר
  choice: Chant
  rationale: Conserve le second terme de genre distinct de « Psaume », sans fondre les deux désignations.
- source_word: חֲנֻכַּת
  choice: pour la dédicace
  rationale: Rend le nom « dédicace » et comprend le titre comme indiquant l’occasion ou l’usage du chant.
- source_word: הַבַּיִת
  choice: la maison
  rationale: Préserve le sens générique de l’hébreu et ne précise pas s’il s’agit du temple, du palais ou d’une autre maison.
- source_word: לְדָוִד
  choice: De David
  rationale: Formule française traditionnelle qui maintient mieux que « par David » l’ambiguïté entre auteur, appartenance, association ou destination.
theological_decisions:
- issue: Référent de « la maison »
  choice: la maison
  alternative: le temple ; le palais de David
  rationale: Le substantif hébreu בַּיִת est large et le titre ne permet pas d’identifier sûrement son référent ; la traduction conserve donc cette ouverture.
- issue: Portée de לְדָוִד
  choice: De David
  alternative: par David ; pour David ; appartenant à David
  rationale: La préposition peut exprimer plusieurs rapports dans les titres des psaumes ; « De David » évite de trancher exclusivement en faveur de l’auteur.
translation_notes:
  register: Français moderne, sobre et digne. La ponctuation en phrases nominales brèves présente clairement les éléments successifs du titre hébreu.
