id: PSA.30.1
reference: Psalms 30:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲרוֹמִמְ/ךָ֣ יְ֭הוָה כִּ֣י דִלִּיתָ֑/נִי וְ/לֹא שִׂמַּ֖חְתָּ אֹיְבַ֣/י לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: fr
  text: 'Je t’exalterai, Yahweh,

    car tu m’as hissé[a]

    et tu n’as pas laissé mes ennemis se réjouir à mes dépens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu m’as remonté » ; le verbe hébreu évoque littéralement l’action de tirer quelque chose vers le haut, comme on remonte un objet d’un puits.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Je t’exalterai
  rationale: Le verbe רום, dans cette forme intensive, exprime l’action d’élever ou d’exalter dans la louange. « Je t’exalterai » conserve la métaphore verticale et convient à une adresse cultuelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que par un titre de substitution.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la louange. « Car » est naturel dans le registre poétique et explicite le lien causal.
- source_word: דִלִּיתָנִי
  choice: tu m’as hissé[a]
  rationale: Le verbe דלה évoque concrètement l’action de tirer quelque chose vers le haut, notamment hors d’un puits. « Hissé » préserve cette image verticale sans ajouter explicitement un lieu absent de l’hébreu.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: et tu n’as pas laissé … se réjouir
  rationale: 'La tournure française exprime naturellement la valeur causative du verbe : Yahweh n’a pas donné aux ennemis l’occasion de se réjouir.'
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Traduction directe et idiomatique du nom pluriel avec suffixe possessif.
- source_word: לִי
  choice: à mes dépens
  rationale: La préposition indique ici que la joie des ennemis aurait eu lieu au détriment du psalmiste. Cette expression rend clairement l’idée de triomphe hostile.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin. « Yahweh » le préserve au lieu de lui substituer un titre.
translation_notes:
  register: Français international moderne, poétique et digne. La disposition en trois lignes souligne le mouvement de la louange, son motif, puis l’échec du triomphe ennemi.
