source:
  edition: WLC
  text: מַה בֶּ֥צַע בְּ/דָמִ/י֮ בְּ/רִדְתִּ֪/י אֶ֫ל שָׁ֥חַת הֲ/יוֹדְ/ךָ֥ עָפָ֑ר הֲ/יַגִּ֥יד אֲמִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/009.yaml
  text: What profit is there in my blood[c][b][a], in my going down to the pit? Will the dust praise you? Will it declare your faithfulness?
translation:
  language: fr
  text: Quel profit y a-t-il à ce que mon sang soit versé[a], à ce que je descende dans la fosse[b] ? La poussière te louera-t-elle ? Proclamera-t-elle ta fidélité[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « dans ma mort ». Littéralement : « dans mon sang ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la tombe ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ta vérité ». Le terme hébreu peut exprimer la vérité aussi bien que la fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Quel profit y a-t-il
  rationale: Cette formulation restitue directement la question rhétorique portant sur l’avantage ou le bénéfice qui résulterait de la mort du psalmiste.
- source_word: בְּדָמִי
  choice: dans mon sang
  rationale: Le rendu littéral conserve l’image concrète du sang, qui évoque ici la mort ou le sang versé sans réduire d’emblée l’ambiguïté poétique.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: dans ma descente vers la fosse
  rationale: La formulation nominale française garde le parallélisme avec « dans mon sang » et l’image d’un mouvement descendant vers le domaine de la mort.
- source_word: שָׁחַת
  choice: la fosse
  rationale: « Fosse » préserve la métaphore spatiale de l’hébreu et s’accorde avec l’idée de descente; « tombe » demeure une possibilité plus interprétative.
- source_word: הֲיוֹדְךָ עָפָר
  choice: La poussière te louera-t-elle
  rationale: Dans les Psaumes, ידה adressé à Dieu désigne naturellement la louange. « La poussière » est maintenue comme image de la condition mortelle et comme désignation poétique du mort.
- source_word: הֲיַגִּיד
  choice: Proclamera-t-elle
  rationale: « Proclamer » exprime une déclaration publique et convient au registre poétique de la louange.
- source_word: אֲמִתֶּךָ
  choice: ta fidélité
  rationale: Le nom אֱמֶת peut désigner la vérité, la sûreté ou la fidélité. Ici, « fidélité » exprime naturellement la constance de Dieu célébrée par le psalmiste, tout en signalant l’autre sens possible en note.
theological_decisions:
- issue: Faut-il expliciter la mort ou conserver les images concrètes du texte ?
  choice: Conserver « mon sang », « la fosse » et « la poussière » dans le texte principal.
  alternative: Traduire de façon interprétative par « ma mort », « la tombe » et « les morts ».
  rationale: L’argument du verset est que la mort du psalmiste mettrait fin à sa louange, mais l’hébreu l’exprime par des images concrètes. Les préserver maintient la force poétique et évite de résoudre silencieusement leur portée.
- issue: Sens de אֲמִתֶּךָ
  choice: ta fidélité
  alternative: ta vérité
  rationale: Dans cette prière, « fidélité » convient à la proclamation du caractère fiable de Dieu; toutefois, le terme hébreu peut aussi signifier « vérité », possibilité conservée en note.
translation_notes:
  register: Français moderne, digne et poétique. Le parallélisme des deux groupes introduits par « dans » ainsi que les images concrètes de la mortalité sont conservés, tout en restant compréhensibles pour un lectorat général.
