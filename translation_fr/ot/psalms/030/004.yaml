source:
  edition: WLC
  text: זַמְּר֣וּ לַ/יהוָ֣ה חֲסִידָ֑י/ו וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: fr
  text: Chantez pour Yahweh, vous qui lui êtes fidèles, et rendez grâce en souvenir de sa sainteté[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au souvenir de sa sainteté » ; autre traduction possible : « à la mention de sa sainteté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Chantez
  rationale: Le piel impératif pluriel de זמר désigne ici le chant musical de louange. En français, « Chantez pour Yahweh » exprime naturellement cette action cultuelle sans alourdir la phrase.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל marque le destinataire de la louange. Le nom divin יהוה est translittéré « Yahweh », conformément au choix de préserver le nom propre dans le texte.
- source_word: חֲסִידָיו
  choice: vous qui lui êtes fidèles
  rationale: חסיד désigne ceux qui manifestent fidélité, attachement loyal ou piété envers Dieu. La tournure explicite le vocatif et évite la coloration ecclésiastique que pourrait prendre « saints ».
- source_word: וְהוֹדוּ
  choice: et célébrez
  rationale: Le hiphil de ידה, dans un contexte de louange, peut signifier remercier, louer ou célébrer. Avec זֵכֶר קָדְשׁוֹ, « célébrez » donne une construction française naturelle tout en gardant la portée doxologique.
- source_word: לְזֵכֶר קָדְשׁוֹ
  choice: son saint nom
  rationale: Littéralement, l’expression évoque « le souvenir/la mention de sa sainteté ». Dans l’usage biblique, זֵכֶר peut désigner le nom mémorable par lequel Dieu est invoqué. « Son saint nom » rend idiomatiquement cette valeur, tandis qu’une note conserve la formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve ici le caractère de nom propre sans recourir à une substitution traditionnelle.
- issue: Sens de זֵכֶר קָדְשׁוֹ
  choice: son saint nom
  alternative: le souvenir de sa sainteté
  rationale: « Son saint nom » est naturel en français et correspond à la valeur liturgique possible de זֵכֶר, la mention ou le nom mémorable de Dieu. La formulation littérale demeure cependant possible et est signalée en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsme. Le parallélisme des deux impératifs est conservé, et le vocatif est rendu explicitement.
