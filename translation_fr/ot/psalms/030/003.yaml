source:
  edition: WLC
  text: יְֽהוָ֗ה הֶֽעֱלִ֣יתָ מִן שְׁא֣וֹל נַפְשִׁ֑/י חִ֝יִּיתַ֗/נִי מ/יורדי בֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: fr
  text: Yahweh, tu as fait remonter mon âme[a] du séjour des morts[b] ; tu m’as gardé en vie, loin de ceux qui descendent dans la fosse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma vie », ou simplement « moi ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « du Shéol », terme hébreu désignant le domaine des morts ; autre traduction possible : « de la tombe ».'
    reason: lexical_alternative
  - marker: c
    text: 'On peut aussi comprendre : « tu m’as rendu la vie, loin de ceux qui descendent dans la fosse », ou : « tu m’as gardé en vie, afin que je ne descende pas dans la fosse ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Conserve le nom divin personnel sous une forme française courante, plutôt que de lui substituer un titre.
- source_word: הֶעֱלִיתָ
  choice: tu as fait remonter
  rationale: Rend le causatif hébreu et maintient l’image verticale d’une remontée hors du domaine des morts.
- source_word: מִן שְׁאוֹל
  choice: du séjour des morts
  rationale: Exprime naturellement en français le domaine des morts désigné par Shéol, sans le réduire à une tombe individuelle ni l’identifier à l’enfer.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Préserve l’expression poétique hébraïque, tout en signalant en note que le mot peut ici désigner la vie ou la personne.
- source_word: חִיִּיתַנִי
  choice: tu m’as gardé en vie
  rationale: Rend l’idée de préservation ou de restauration de la vie sans imposer explicitement une résurrection.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: parmi ceux qui descendent dans la fosse
  rationale: Suit la lecture massorétique et conserve l’image de la séparation d’avec le groupe de ceux qui descendent vers la mort; d’autres analyses syntaxiques sont indiquées en note.
- source_word: בּוֹר
  choice: la fosse
  rationale: Conserve l’image poétique du puits ou de la fosse associés à la mort, sans l’aplatir en « tombe ».
theological_decisions:
- issue: La portée des images du séjour des morts et de la fosse
  choice: Conserver les images hébraïques de délivrance hors du domaine de la mort sans parler explicitement de résurrection.
  alternative: Traduire par « tu m’as ressuscité d’entre les morts » ou réduire Shéol à « la tombe ».
  rationale: Le verset peut évoquer une délivrance de la mort ou d’un danger mortel; il ne précise pas suffisamment la nature de l’événement pour imposer une doctrine plus développée.
- issue: La syntaxe de חִיִּיתַנִי מִיּוֹרְדֵי בוֹר
  choice: « tu m’as gardé en vie parmi ceux qui descendent dans la fosse »
  alternative: « tu m’as rendu la vie, loin de ceux qui descendent dans la fosse » ou « tu m’as gardé en vie, afin que je ne descende pas dans la fosse »
  rationale: La construction hébraïque admet plusieurs compréhensions proches. Le texte principal suit une lecture de préservation au milieu ou hors du nombre des mourants, tandis que la note maintient les autres possibilités.
translation_notes:
  register: Français moderne, digne et poétique. Le tutoiement convient à l’adresse directe à Dieu dans le registre biblique français. « Séjour des morts » privilégie l’intelligibilité immédiate, tandis que la note conserve le terme source « Shéol ».
