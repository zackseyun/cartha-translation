  text: יְֽהוָ֗ה בִּ/רְצוֹנְ/ךָ֮ הֶעֱמַ֪דְתָּה לְֽ/הַרְרִ֫/י עֹ֥ז הִסְתַּ֥רְתָּ פָנֶ֗י/ךָ הָיִ֥יתִי נִבְהָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/007.yaml
  text: O Yahweh[a], by your favor you made my mountain stand strong; when you hid your face, I was dismayed.
translation:
  language: fr
  text: Yahweh, par ta faveur, tu as affermi ma montagne[a] ; tu as caché ta face, et j’ai été bouleversé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as établi la force pour ma montagne ». La formulation hébraïque est compacte et peut aussi évoquer une prospérité ou une stabilité assurée.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré directement. En français, l’adresse directe demeure naturelle sans ajouter « ô », absent du texte hébreu.
- source_word: בִּרְצוֹנְךָ
  choice: par ta faveur
  rationale: רָצוֹן désigne ici la faveur ou la bienveillance ; la préposition בְּ a vraisemblablement une valeur instrumentale.
- source_word: הֶעֱמַדְתָּה
  choice: tu avais affermi
  rationale: Le hiphil de עמד signifie faire tenir ou établir. « Affermir » rend naturellement l’idée de stabilité et l’antériorité contextuelle par rapport au trouble qui suit.
- source_word: לְהַרְרִי עֹז
  choice: ma montagne
  rationale: La formulation hébraïque est compacte et difficile. Le texte principal conserve l’image explicite de la montagne, tandis que la note présente une construction plus formelle avec « force ».
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: tu as caché ta face
  rationale: La traduction conserve l’image hébraïque traditionnelle du retrait de la présence ou de la faveur divine, sans l’expliciter dans le texte.
- source_word: נִבְהָל
  choice: j’ai été bouleversé
  rationale: Le niphal de בהל exprime l’effroi, le désarroi ou une profonde perturbation. « Bouleversé » convient au contexte sans imposer le degré maximal de terreur.
theological_decisions:
- issue: Rendu du nom divin
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme יהוה ; sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Interprétation de « ma montagne »
  choice: Conserver l’image de la montagne dans le texte principal
  alternative: Interpréter comme ma prospérité, ma sécurité ou ma forteresse
  rationale: L’hébreu mentionne une montagne et peut évoquer métaphoriquement la stabilité ou la prospérité. Le maintien de l’image évite de résoudre une ambiguïté poétique réelle.
- issue: Rapport entre הַרְרִי et עֹז
  choice: « tu avais affermi ma montagne » avec une note sur « tu avais établi la force pour ma montagne »
  alternative: « tu avais donné de la force à ma montagne »
  rationale: La syntaxe est exceptionnellement compacte. Le texte principal privilégie un français poétique naturel, tandis que la note préserve l’autre analyse possible de עֹז comme substantif.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé, de même que l’image biblique de la face cachée. Le plus-que-parfait marque naturellement que l’affermissement précédait le retrait de la faveur divine.
