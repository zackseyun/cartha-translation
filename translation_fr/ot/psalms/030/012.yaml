  yaml_path: translation/ot/psalms/030/012.yaml
  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: fr
  text: afin que ma gloire[a] chante tes louanges et ne se taise pas. Yahweh, mon Dieu, je te rendrai grâce pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que tout mon être chante tes louanges ». L’hébreu dit littéralement « ma gloire », expression poétique qui peut désigner l’être intérieur du psalmiste ou sa langue.
    reason: Alternative lexicale pour l’expression poétique כָבוֹד.
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit ici le but ou le résultat, avec une tournure naturelle et digne en français.
- source_word: יְזַמֶּרְךָ
  choice: te chante des louanges
  rationale: Le piel de זמר exprime le chant ou la musique de louange adressée à Dieu.
- source_word: כָבוֹד
  choice: ma gloire
  rationale: Conserve la métaphore littérale et l’ambiguïté poétique de l’hébreu; le possessif est implicite dans le contexte.
- source_word: וְלֹא יִדֹּם
  choice: et ne reste pas silencieuse
  rationale: Dans son opposition au chant, דמם désigne naturellement le fait de garder le silence; l’accord reprend «ma gloire».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de le remplacer par un titre.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Rend directement la forme possessive employée comme apostrophe.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Exprime de façon idiomatique la durée indéfinie et durable de la reconnaissance promise.
- source_word: אוֹדֶךָּ
  choice: je te célébrerai
  rationale: Le hiphil de ידה peut exprimer l’action de rendre grâce ou de louer; «célébrer» convient au parallélisme avec le chant de louange sans réduire le verbe au seul remerciement.
theological_decisions:
- issue: Interprétation de כָבוֹד comme sujet de la louange
  choice: Conserver «ma gloire» dans le texte principal
  alternative: «tout mon être» ou «ma langue»
  rationale: Le nom hébreu signifie littéralement «gloire» ou «honneur», mais son référent poétique est discuté. La traduction maintient donc la métaphore et signale l’interprétation dans la note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend visible le nom personnel présent dans le texte hébreu, sans lui substituer un titre.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure claire à l’oral; «ma gloire» est volontairement conservé pour respecter l’image et l’ambiguïté du texte source.
