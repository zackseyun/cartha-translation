  yaml_path: translation/ot/psalms/030/008.yaml
  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: fr
  text: Vers toi, SEIGNEUR, je crie ; mon Seigneur, je te demande grâce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Vers toi
  rationale: Reproduit l’orientation explicite de la prière et conserve la mise en relief initiale.
- source_word: יְהוָה
  choice: SEIGNEUR
  rationale: Rend le nom divin par la convention française en petites capitales, tout en le distinguant du titre אֲדֹנָי qui suit.
- source_word: אֶקְרָא
  choice: je crie
  rationale: Dans ce contexte de supplication, le verbe קרא exprime l’appel pressant adressé à Dieu ; « je crie » est naturel et garde cette intensité.
- source_word: אֲדֹנָי
  choice: mon Seigneur
  rationale: Conserve la forme traditionnelle et la valeur personnelle du titre hébreu, ainsi que sa distinction d’avec le nom divin יהוה.
- source_word: אֶתְחַנָּן
  choice: je te demande grâce
  rationale: Le hitpael de חנן désigne une supplication visant à obtenir faveur ou grâce ; cette formulation rend le contenu du verbe sans l’alourdir.
theological_decisions:
- issue: Distinction entre יהוה et אֲדֹנָי
  choice: SEIGNEUR / mon Seigneur
  alternative: l’Éternel / le Seigneur
  rationale: La typographie et le possessif permettent de préserver la différence entre le nom divin et le titre sans introduire une interprétation théologique supplémentaire.
translation_notes:
  register: Formulation poétique, actuelle et digne. Le parallélisme hébreu est conservé, avec une seconde proposition légèrement restructurée pour rester idiomatique en français.
