source:
  edition: WLC
  text: שְׁמַע יְהוָ֥ה וְ/חָנֵּ֑/נִי יְ֝הוָה הֱֽיֵה עֹזֵ֥ר לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: fr
  text: Écoute, Yahweh, et fais-moi grâce[a] ; Yahweh, sois mon secours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prends pitié de moi ». Le verbe hébreu peut désigner la faveur accordée avec grâce ou la compassion sollicitée dans un appel au secours divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Écoute
  rationale: Impératif de שׁמע. « Écoute » exprime naturellement une supplication adressée à Dieu sans ajouter le pronom objet que l’hébreu laisse implicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: וְחָנֵּנִי
  choice: et fais-moi grâce
  rationale: L’impératif de חנן avec suffixe de première personne demande l’octroi bienveillant de la faveur divine. « Fais-moi grâce » en conserve le sens central, tandis que « prends pitié de moi » reste possible dans ce contexte.
- source_word: הֱיֵה עֹזֵר לִי
  choice: sois mon secours
  rationale: הֱיֵה est un impératif de היה, suivi du participe de עזר et de לִי. « Sois mon secours » rend la demande directe dans un français naturel et digne, tout en exprimant que Yahweh est celui qui apporte son aide.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. La forme « Yahweh » préserve le nom personnel divin et correspond à sa transcription française courante.
- issue: Nuance de חנן dans la supplication
  choice: fais-moi grâce
  alternative: prends pitié de moi
  rationale: Le verbe peut évoquer aussi bien la faveur accordée gratuitement que la compassion. Le texte principal retient la valeur lexicale de grâce sans exclure la nuance de pitié, signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « Yahweh » et la structure brève de la supplication sont conservées.
