  text: וַ֭/אֲנִי אָמַ֣רְתִּי בְ/שַׁלְוִ֑/י בַּל אֶמּ֥וֹט לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/006.yaml
  text: As for me[a], I said in my prosperity[b], “I will never be shaken.”
translation:
  language: fr
  text: 'Quant à moi, j’ai dit dans ma tranquillité[a] : « Je ne serai jamais ébranlé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans mon aisance » ou « dans ma sécurité ». Le terme hébreu évoque un bien-être paisible et sûr, pas seulement la prospérité matérielle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Je ne serai pas ébranlé à jamais. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Quant à moi
  rationale: Le pronom indépendant met le locuteur en relief; « Quant à moi » rend naturellement cette insistance en français.
- source_word: אָמַרְתִּי
  choice: je disais
  rationale: Dans ce retour rétrospectif sur une conviction durable, l’imparfait français est naturel, sans imposer un plus-que-parfait que la forme hébraïque n’exige pas.
- source_word: בְשַׁלְוִי
  choice: dans ma tranquillité
  rationale: שַׁלְוָה désigne le calme, l’aisance ou un bien-être assuré. « Tranquillité » préserve cette largeur de sens sans réduire le terme à la prospérité matérielle.
- source_word: בַּל ... לְעוֹלָם
  choice: jamais
  rationale: La négation poétique associée à « pour toujours » forme ici une négation temporelle absolue, que « jamais » exprime naturellement.
- source_word: אֶמּוֹט
  choice: je serai ébranlé
  rationale: Le niphal de מוט évoque la perte de stabilité. « Être ébranlé » conserve la métaphore et convient au registre poétique.
