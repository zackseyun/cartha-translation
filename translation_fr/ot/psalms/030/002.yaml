  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: fr
  text: Yahweh, mon Dieu[a], j’ai crié vers toi[b], et tu m’as guéri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », traditionnellement rendu par « le Seigneur » ou « l’Éternel ». La forme « Jéhovah » est également employée.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je t’ai appelé au secours ».'
    reason: lexical_alternative
  - marker: c
    text: « Tu m’as guéri » peut désigner une guérison physique ou, dans ce contexte, un rétablissement ou une délivrance plus générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin YHWH, qui conserve dans le texte le nom propre employé en hébreu.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Le suffixe de première personne du singulier exprime directement « mon Dieu »; l’ensemble forme une adresse à Dieu.
- source_word: שִׁוַּעְתִּי
  choice: j’ai crié
  rationale: Le verbe désigne un cri pressant, souvent un appel au secours. « J’ai crié » en garde l’intensité sans expliciter davantage que l’hébreu.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition אֶל marque ici la direction de l’appel. « Vers toi » est naturel en français et maintient cette orientation.
- source_word: וַתִּרְפָּאֵנִי
  choice: et tu m’as guéri
  rationale: Le verbe רפא signifie « guérir ». Cette formulation directe laisse ouverte la possibilité d’une guérison physique ou d’un rétablissement plus général selon le contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu porte le Tétragramme comme nom divin. « Yahweh » le représente explicitement sans le remplacer par un titre.
- issue: Portée de la guérison exprimée par רפא
  choice: tu m’as guéri
  alternative: tu m’as rétabli; tu m’as rendu la santé
  rationale: « Guéri » correspond au sens lexical premier tout en préservant l’ouverture du contexte entre guérison corporelle et restauration ou délivrance plus large.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe brève conserve le parallélisme de l’hébreu; « Yahweh » est maintenu comme vocatif sans interjection ajoutée.
