  text: הָפַ֣כְתָּ מִסְפְּדִ/י֮ לְ/מָח֪וֹל לִ֥/י פִּתַּ֥חְתָּ שַׂקִּ֑/י וַֽ/תְּאַזְּרֵ֥/נִי שִׂמְחָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/011.yaml
  text: You turned my mourning into dancing for me; you untied my sackcloth and clothed me with joy.
translation:
  language: fr
  text: Tu as changé mon deuil en danse pour moi ; tu as délié mon sac et tu m’as ceint de joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: mon deuil
  rationale: Le nom désigne la lamentation ou le deuil ; « mon deuil » exprime naturellement en français l’état et ses manifestations.
- source_word: לְמָחוֹל לִי
  choice: en danse pour moi
  rationale: מָחוֹל désigne la danse, et le לִי distinct est conservé par « pour moi » plutôt que supprimé comme redondant.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: tu as dénoué mon vêtement de deuil
  rationale: Le verbe signifie ouvrir ou défaire ; le sac étant porté en signe de deuil, « vêtement de deuil » communique sa fonction sans suggérer un simple sac contenant des objets.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: tu m’as revêtu de joie
  rationale: Le verbe évoque le fait de ceindre ou d’équiper quelqu’un. « Revêtu » conserve l’image vestimentaire et forme un contraste naturel avec le vêtement de deuil.
