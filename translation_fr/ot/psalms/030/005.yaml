source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: fr
  text: Car sa colère ne dure qu’un instant ; sa faveur, c’est la vie[a]. Le soir, les pleurs s’installent pour la nuit, mais au matin éclate un cri de joie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « sa faveur dure toute une vie ». L’hébreu dit littéralement : « la vie dans sa faveur » et peut exprimer soit la vie associée à sa faveur, soit la durée de cette faveur.'
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: 'Ou : « un chant de joie ». Le mot hébreu désigne une expression audible de joie, cri ou chant.'
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui fonde l’appel à louer du contexte précédent.
- source_word: רֶגַע בְּאַפּוֹ
  choice: sa colère ne dure qu’un instant
  rationale: Explicite naturellement en français la relation prédicative de la proposition nominale hébraïque, tout en conservant l’idée de très brève durée.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: sa faveur donne la vie
  rationale: Rend de façon naturelle la proposition nominale « vie dans sa faveur », sans effacer l’autre lecture possible, temporelle, signalée en note.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: Le soir, les pleurs viennent passer la nuit
  rationale: Conserve la personnification des pleurs et le sens concret du verbe לין, « passer la nuit, loger ».
- source_word: רִנָּה
  choice: un cri de joie
  rationale: Préserve la dimension vocale du nom hébreu, qui peut désigner une acclamation ou un chant joyeux.
theological_decisions:
- issue: Référent des suffixes dans « sa colère » et « sa faveur »
  choice: Les pronoms renvoient à l’Éternel mentionné dans le contexte du psaume.
  alternative: Laisser le référent entièrement implicite.
  rationale: Le contexte identifie clairement Dieu comme référent ; la traduction garde ensemble la réalité de sa colère, sa brièveté et le caractère vivifiant de sa faveur, sans développement doctrinal ajouté.
- issue: Relation entre חַיִּים et בִּרְצוֹנוֹ
  choice: « sa faveur donne la vie »
  alternative: « sa faveur dure toute une vie »
  rationale: L’hébreu très condensé permet de comprendre חַיִּים comme « vie » ou, dans le parallélisme temporel avec « un instant », comme « toute une vie ». La traduction principale suit la première lecture et la note préserve la seconde.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme entre le soir et le matin est maintenu, ainsi que la personnification des pleurs et de la joie.
