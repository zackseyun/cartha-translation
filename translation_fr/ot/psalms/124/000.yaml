source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/000.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: fr
  text: 'Chant des montées. De David.


    Si Yahvé n’avait pas été pour nous[a] — qu’Israël le dise donc —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « n’avait pas été de notre côté » ou « n’avait pas été avec nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend le titre traditionnel tout en conservant l’image volontairement ouverte des « montées », qui peut évoquer des pèlerinages vers Jérusalem ou une progression.
- source_word: לְדָוִד
  choice: De David
  rationale: Conserve la relation concise et ambiguë exprimée par la préposition hébraïque, sans préciser s’il s’agit de l’auteur, du dédicataire ou d’une association.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français le nom divin personnel plutôt que de le remplacer silencieusement par un titre.
- source_word: לוּלֵי יְהוָה שֶׁהָיָה לָנוּ
  choice: Si Yahvé n’avait pas été pour nous
  rationale: Suit de près la construction conditionnelle hébraïque et laisse la phrase en suspens, comme dans la source; une tournure française plus idiomatique est signalée en note.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: qu’Israël le dise donc
  rationale: « donc » restitue ici la nuance exhortative ou insistante de נָא, tandis que « le » renvoie à la déclaration que le peuple est invité à reprendre.
theological_decisions:
- issue: Relation de Yahvé avec Israël dans שֶׁהָיָה לָנוּ
  choice: été pour nous
  alternative: été de notre côté / été avec nous
  rationale: La formulation principale préserve la sobriété et la relative ambiguïté de l’hébreu; la note fournit l’équivalent idiomatique sans imposer une interprétation plus précise.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. Les tirets conservent l’élan suspendu de la proposition conditionnelle, dont la suite vient au verset suivant. Le titre est distingué du corps du psaume par un saut de ligne.
