  text: then they would have swallowed us alive when their anger burned against us[a][b].
translation:
  language: fr
  text: alors ils nous auraient engloutis vivants lorsque leur colère s’enflammait contre nous[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils nous engloutirent », si l’on comprend la forme verbale comme un simple passé ; le contexte plus large (vv. 2–5) favorise toutefois le sens contrefactuel « ils nous auraient engloutis ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « lorsque leur nez s’enflammait contre nous », expression hébraïque qui désigne la colère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: alors
  rationale: L’adverbe temporel introduit ici la conséquence dans la séquence contrefactuelle des versets 2 à 5 ; « alors » est naturel et concis.
- source_word: חַיִּים
  choice: vivants
  rationale: Employé adverbialement, le terme signifie « en vie » ; « engloutis vivants » conserve la force de l’image hébraïque.
- source_word: בְּלָעוּנוּ
  choice: ils nous auraient engloutis
  rationale: Dans ce contexte conditionnel irréel, l’accompli hébreu se rend naturellement par le conditionnel passé français. « Engloutir » préserve l’image concrète d’une dévoration totale.
- source_word: בַּחֲרוֹת
  choice: quand … s’est enflammée
  rationale: L’infinitif construit précédé de ב exprime la circonstance temporelle et évoque littéralement le fait de brûler ; cette formulation conserve l’image du feu.
- source_word: אַפָּם
  choice: leur colère
  rationale: Même si אַף désigne littéralement le nez, le mot exprime idiomatiquement la colère dans ce contexte.
- source_word: בָּנוּ
  choice: contre nous
  rationale: Avec un verbe de colère, la préposition ב marque ici la personne visée par l’hostilité.
