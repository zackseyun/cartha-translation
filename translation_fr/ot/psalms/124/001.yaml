id: PSA.124.1
reference: Psalms 124:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: fr
  text: 'Chant des montées. De David.


    Si Yahweh n’avait pas été pour nous[a] — qu’Israël le dise donc —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement : « Si Yahweh n’avait pas été de notre côté. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend littéralement le titre traditionnel tout en conservant sa possible nuance de pèlerinage ou d’usage liturgique, sans la préciser indûment.
- source_word: לְדָוִד
  choice: De David
  rationale: La préposition לְ peut exprimer l’auteur, l’association ou la dédicace. « De David » préserve mieux cette ambiguïté que « par David » ou « pour David ».
- source_word: לוּלֵי
  choice: Si … n’avait pas été
  rationale: Exprime naturellement en français la condition irréelle introduite ici, dont la conséquence se poursuit au verset suivant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme et préserve sa référence personnelle et alliancielle.
- source_word: שֶׁהָיָה לָנוּ
  choice: avait été pour nous
  rationale: Reste proche de l’hébreu et exprime le soutien de Yahweh sans expliciter davantage l’image; la tournure française plus idiomatique figure en note.
- source_word: יֹאמַר נָא
  choice: qu’Israël le dise donc
  rationale: Le jussif accompagné de נָא constitue une exhortation insistante. « Donc » restitue ici cette force mieux qu’un « maintenant » temporel.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle du nom du peuple interpellé collectivement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom divin; sa transcription évite de le remplacer par un titre.
- issue: Sens de l’expression שֶׁהָיָה לָנוּ
  choice: avait été pour nous
  alternative: avait été de notre côté
  rationale: Le texte principal conserve la formulation ouverte et proche de l’hébreu, tandis que la note indique le sens idiomatique de soutien sans l’imposer comme unique formulation.
translation_notes:
  register: Français international actuel, sobre et liturgique. Le titre et la mention davidique restent concis. Les tirets signalent que la condition demeure en suspens jusqu’au verset suivant.
