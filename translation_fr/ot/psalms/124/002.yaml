source:
  edition: WLC
  text: לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ בְּ/ק֖וּם עָלֵ֣י/נוּ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/002.yaml
  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: fr
  text: Si Yahweh n’avait pas été pour nous quand des hommes se sont dressés contre nous—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si Yahweh n’avait pas été à nos côtés quand l’homme s’est dressé contre nous. » Le mot hébreu rendu par « des hommes » est au singulier et peut avoir un sens collectif.'
    reason: Alternative lexicale et précision sur le nombre grammatical de אָדָם.
lexical_decisions:
- source_word: לוּלֵי
  choice: Si ... n’avait pas
  rationale: Introduit une condition irréelle portant sur le passé; en français, « si ... n’avait pas » prépare naturellement la conséquence exprimée au verset suivant.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: שֶׁהָיָה לָנוּ
  choice: avait été pour nous
  rationale: Conserve au plus près la tournure hébraïque tout en exprimant le soutien de Yahweh; « avait été à nos côtés » est une formulation française plus explicite, signalée en note.
- source_word: בְּקוּם עָלֵינוּ
  choice: quand ... se sont dressés contre nous
  rationale: La préposition ב avec l’infinitif marque ici le temps, et קום suivi de על décrit une opposition hostile.
- source_word: אָדָם
  choice: des hommes
  rationale: Le singulier hébreu a ici une valeur collective et désigne les agresseurs humains; le pluriel indéfini est naturel en français et convient à l’accord verbal.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le nom propre divin; sa transcription préserve cette donnée sans la remplacer par un titre.
- issue: Sens de שֶׁהָיָה לָנוּ
  choice: avait été pour nous
  alternative: avait été à nos côtés
  rationale: La formulation retenue préserve la relative indétermination de לָנוּ entre soutien, faveur et présence aux côtés du peuple; l’alternative plus idiomatique est donnée en note.
translation_notes:
  register: Français moderne, sobre et poétique. Le tiret final maintient la proposition en suspens, puisque sa conséquence vient au verset suivant.
