source:
  edition: WLC
  text: נַפְשֵׁ֗/נוּ כְּ/צִפּ֥וֹר נִמְלְטָה֮ מִ/פַּ֪ח י֫וֹקְשִׁ֥ים הַ/פַּ֥ח נִשְׁבָּ֗ר וַ/אֲנַ֥חְנוּ נִמְלָֽטְנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: fr
  text: Notre vie[a] s’est échappée comme un oiseau du piège des oiseleurs[b] ; le piège est brisé, et nous nous sommes échappés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « notre âme ». Le mot hébreu peut aussi désigner la vie ou la personne tout entière.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ceux qui posent des pièges ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: notre vie
  rationale: נֶפֶשׁ désigne ici la vie menacée, voire la personne tout entière. « Notre vie » conserve le singulier collectif de l’hébreu sans suggérer nécessairement une âme séparée du corps.
- source_word: כְּצִפּוֹר
  choice: comme un oiseau
  rationale: צִפּוֹר est un terme générique désignant un oiseau, souvent petit ; rien n’impose l’espèce précise du moineau.
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: s’est échappée / nous nous sommes échappés
  rationale: Le nifal de מלט exprime ici le fait d’échapper au danger. La répétition française reproduit la reprise du même verbe hébreu.
- source_word: פַּח
  choice: piège
  rationale: פַּח désigne un piège ou un collet, notamment pour les oiseaux. « Piège » est clair en français moderne et se prête naturellement au verbe « se briser ».
- source_word: יוֹקְשִׁים
  choice: oiseleurs
  rationale: Le participe désigne ceux qui posent des pièges. Dans l’image immédiate d’un oiseau capturé, « oiseleurs » est précis et conserve le registre poétique, bien qu’il soit littéraire.
- source_word: נִשְׁבָּר
  choice: s’est brisé
  rationale: Cette forme passive ou résultative indique que le piège a été rompu. Le passé composé exprime naturellement l’événement accompli et son résultat présent.
