translation:
  language: fr
  text: alors les eaux déchaînées nous auraient submergés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les eaux arrogantes auraient passé sur nous ». L’adjectif hébreu peut signifier « orgueilleux », « insolent » ou « présomptueux » ; il personnifie ici les eaux comme une force violente et dominatrice.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: alors
  rationale: Adverbe temporel qui poursuit la conséquence irréelle amorcée dans les versets précédents.
- source_word: עָבַר עַל
  choice: auraient submergés
  rationale: Littéralement « seraient passées sur » ; avec les eaux pour sujet, « submerger » restitue naturellement en français l’image d’une crue qui passe par-dessus les personnes.
- source_word: נַפְשֵׁנוּ
  choice: nous
  rationale: נפש désigne ici la personne ou la vie collective. Le français idiomatique emploie naturellement « nous », tandis que « notre âme » risquerait de suggérer une distinction anthropologique absente du contexte.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel français conserve le pluriel hébreu et le registre poétique du psaume.
- source_word: הַזֵּידוֹנִים
  choice: déchaînées
  rationale: L’adjectif évoque littéralement l’orgueil, l’insolence ou la présomption. Appliqué métaphoriquement aux eaux, « déchaînées » exprime leur violence dominatrice sans effacer l’alternative plus littérale, signalée en note.
