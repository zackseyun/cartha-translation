source:
  edition: WLC
  text: אֲ֭זַי הַ/מַּ֣יִם שְׁטָפ֑וּ/נוּ נַ֗֜חְלָ/ה עָבַ֥ר עַל נַפְשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/004.yaml
  text: then the waters would have swept us away[a]; the stream would have passed over our soul.
translation:
  language: fr
  text: alors les eaux nous auraient emportés ; le torrent serait passé sur nous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « sur notre âme ». Ici, le mot hébreu rendu par « âme » peut désigner la personne entière ou sa vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲזַי
  choice: alors
  rationale: Adverbe temporel qui prolonge naturellement en français la séquence contrefactuelle du verset précédent.
- source_word: הַמַּיִם
  choice: les eaux
  rationale: Le pluriel défini conserve l’image poétique de masses d’eau menaçantes.
- source_word: שְׁטָפוּנוּ
  choice: nous auraient emportés
  rationale: Le verbe évoque des eaux qui submergent et entraînent. Le conditionnel passé exprime en français le contrefactuel implicite dans le contexte.
- source_word: נַחְלָה
  choice: le torrent
  rationale: Dans cette scène d’eaux destructrices, « torrent » restitue mieux la violence du cours d’eau que le terme plus calme « ruisseau ».
- source_word: עָבַר עַל
  choice: serait passé sur
  rationale: Cette formulation garde le sens fondamental de mouvement au-dessus ou par-dessus sans ajouter l’idée d’engloutissement au second membre.
- source_word: נַפְשֵׁנוּ
  choice: nous
  rationale: Ici, נֶפֶשׁ désigne la personne ou la vie entière plutôt qu’une composante immatérielle distincte. « Nous » rend naturellement cet emploi en français, tandis que la note conserve l’image hébraïque.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans une évocation poétique du danger
  choice: nous
  alternative: notre âme / notre vie
  rationale: Le mot vise ici les personnes elles-mêmes, dont la vie était menacée, sans imposer une anthropologie technique. La traduction principale évite donc une lecture dualiste indue, et la note signale la formulation littérale ainsi que son amplitude sémantique.
translation_notes:
  register: Français international moderne, poétique et digne. Le conditionnel passé maintient le lien contrefactuel avec le contexte ; le parallélisme et l’imagerie des eaux sont conservés.
