  text: עֶ֭זְרֵ/נוּ בְּ/שֵׁ֣ם יְהוָ֑ה עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/008.yaml
  text: Our help is in the name of Yahweh[a], maker of heaven and earth.
translation:
  language: fr
  text: Notre secours est dans le nom de Yahvé[a], qui fait le ciel et la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH » ; traditionnellement rendu par « le SEIGNEUR ».'
    reason: Préciser la forme du texte source et signaler la traduction traditionnelle.
lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: Notre secours
  rationale: Le nom עֵזֶר avec le suffixe de première personne du pluriel désigne ici l’aide ou le secours, non une personne appelée « notre aide ».
- source_word: בְּשֵׁם
  choice: est dans le nom de
  rationale: Cette formulation conserve la valeur de בְּ exprimant le fondement ou la sphère de la confiance et de l’invocation, tout en restant naturelle dans un registre biblique français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle « Yahvé » rend le nom divin YHWH plutôt que de lui substituer un titre.
- source_word: עֹשֵׂה
  choice: lui qui a fait
  rationale: Le participe qal caractérise Yahvé comme celui qui fait ou a fait. En français courant, la relative met clairement en valeur son œuvre créatrice sans imposer le titre « Créateur ».
- source_word: שָׁמַיִם וָאָרֶץ
  choice: le ciel et la terre
  rationale: Cette expression traditionnelle et naturelle conserve le mérisme hébreu désignant l’ensemble de la création.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le Tétragramme. « Yahvé » en donne la forme française conventionnelle, tandis que « le SEIGNEUR » relève de la tradition de substitution par un titre.
- issue: Valeur temporelle du participe עֹשֵׂה
  choice: lui qui a fait
  alternative: qui fait / auteur du ciel et de la terre
  rationale: Le participe peut présenter une caractéristique durable, mais l’acte créateur est rendu naturellement en français par le passé composé. La relative évite d’en faire artificiellement un titre formel.
translation_notes:
  register: Français international moderne, simple et digne. « Notre secours » garde la tournure liturgique traditionnelle; « lui qui a fait » reste accessible et restitue la caractérisation participiale de Yahvé.
