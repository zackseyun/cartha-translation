  text: בָּר֥וּךְ יְהוָ֑ה שֶׁ/לֹּ֥א נְתָנָ֥/נוּ טֶ֝֗רֶף לְ/שִׁנֵּי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/006.yaml
  text: Blessed be Yahweh[a], who has not given us as prey to their teeth.
translation:
  language: fr
  text: Béni soit Yahweh[a], qui ne nous a pas donnés comme proie à leurs dents !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Béni est Yahweh ». La formule hébraïque peut être comprise dans les deux sens, mais « Béni soit Yahweh » en restitue mieux ici la force doxologique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif sert ici de formule doxologique. « Béni soit » restitue naturellement en français la force liturgique de l’exclamation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: שֶׁלֹּא
  choice: qui ne… pas
  rationale: La proposition relative rattache directement le motif de la bénédiction à l’action de Yahweh.
- source_word: נְתָנָנוּ
  choice: ne nous a pas donnés
  rationale: Le passé composé exprime un acte de délivrance accompli dont les effets demeurent, tout en conservant le sens de base du verbe « donner ».
- source_word: טֶרֶף
  choice: en proie
  rationale: Avec la mention des dents, le nom évoque clairement une proie animale ; cette image vive est préservée.
- source_word: לְשִׁנֵּיהֶם
  choice: à leurs dents
  rationale: Cette formulation garde l’image concrète des ennemis assimilés à des bêtes prédatrices, sans l’expliciter davantage que l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le tétragramme comme nom propre. « Yahweh » préserve ce nom personnel plutôt que de le remplacer par un titre.
- issue: Valeur de la formule בָּרוּךְ יְהוָה
  choice: Béni soit Yahweh
  alternative: Béni est Yahweh
  rationale: Les deux lectures sont grammaticalement possibles, mais le subjonctif français rend mieux la portée doxologique et exclamative du contexte sans nier la valeur descriptive possible.
translation_notes:
  register: Français moderne, digne et liturgique, avec une syntaxe simple. Le point d’exclamation, cohérent avec la formule de bénédiction, rend explicite la tonalité exclamative sans modifier le contenu propositionnel.
