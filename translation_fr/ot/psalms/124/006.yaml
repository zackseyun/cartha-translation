  verdict: revise
  source_fidelity: 'Le sens du texte hébreu est bien rendu : la formule de bénédiction, le nom Yahweh, la négation, l’acte achevé de délivrance et l’image prédatrice des « dents » sont tous conservés. Toutefois, « donnés en proie à leurs dents » est moins idiomatique et rend moins nettement le rapport de comparaison implicite dans טֶרֶף (« comme proie »).'
