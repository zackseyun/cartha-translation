  text: הַפְלֵ֣ה חֲ֭סָדֶי/ךָ מוֹשִׁ֣יעַ חוֹסִ֑ים מִ֝/מִּתְקוֹמְמִ֗ים בִּֽ/ימִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: fr
  text: Montre de façon merveilleuse ton amour fidèle[a], toi qui sauves par ta main droite ceux qui se réfugient loin de ceux qui se dressent contre eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Rends merveilleux ton amour fidèle. » L’impératif hébreu peut demander de montrer quelque chose comme extraordinaire ou de le rendre distinct et merveilleux.'
    reason: lexical_alternative
  - marker: b
    text: 'La fin du verset peut aussi se comprendre ainsi : « toi qui sauves ceux qui, à ta droite, se réfugient loin de ceux qui se dressent contre eux ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Déploie merveilleusement
  rationale: L’impératif hifil de פלא demande à Dieu de manifester son amour d’une manière extraordinaire. Cette formulation reste naturelle en français tout en conservant l’idée de merveille.
- source_word: חֲסָדֶיךָ
  choice: ton amour fidèle
  rationale: חסד associe amour, fidélité et loyauté dans la relation d’alliance. « Amour fidèle » en exprime le poids sans recourir à un terme archaïque ou trop technique.
- source_word: מוֹשִׁיעַ
  choice: toi qui sauves
  rationale: Le participe désigne directement Dieu comme celui qui sauve. La tournure vocative française est claire et naturelle.
- source_word: חוֹסִים
  choice: ceux qui cherchent refuge
  rationale: Le verbe חסה évoque concrètement le fait de se réfugier sous une protection, plutôt que la seule notion abstraite de confiance.
- source_word: מִמִּתְקוֹמְמִים
  choice: contre leurs assaillants
  rationale: Le participe de קום décrit ceux qui se dressent avec hostilité. « Assaillants » restitue cette opposition de façon concise; le pronom « leurs » explicite le rapport laissé implicite en hébreu.
- source_word: בִּימִינֶךָ
  choice: par ta main droite
  rationale: 'La préposition ב peut marquer ici le moyen: Dieu sauve par sa main droite, image traditionnelle de sa puissance agissante.'
theological_decisions:
- issue: Rattachement syntaxique de בִּימִינֶךָ (« par/à ta main droite »)
  choice: 'Rattaché à l’action de sauver: « toi qui sauves par ta main droite »'
  alternative: 'Rattaché à ceux qui cherchent refuge: « ceux qui cherchent refuge à ta droite »'
  rationale: La position finale du syntagme prépositionnel permet les deux rattachements. Le texte principal retient la main droite comme moyen du salut, lecture cohérente dans ce contexte, tandis que la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse directe « toi qui sauves » évite un vocatif artificiel, tandis que « amour fidèle » conserve la densité relationnelle et théologique de חסד.
