  text: בָּ֘חַ֤נְתָּ לִבִּ֨/י פָּ֘קַ֤דְתָּ לַּ֗יְלָה צְרַפְתַּ֥/נִי בַל תִּמְצָ֑א זַ֝מֹּתִ֗י בַּל יַעֲבָר פִּֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: fr
  text: Tu as examiné mon cœur, tu es venu me voir la nuit ; tu m’as éprouvé sans rien trouver[a]. J’ai résolu que ma bouche ne dépassera pas les limites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu du dernier membre est concis et sa construction est discutée. Il peut se rendre plus près des mots : « J’ai résolu ; ma bouche ne passera pas au-delà. » Le complément de « passera » n’est pas exprimé ; le sens peut concerner le fait de dépasser les limites dans ses paroles.'
    reason: Ambiguïté syntaxique et solution lexicale concernant זַמֹּתִי et בַל יַעֲבָר פִּי.
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: as examiné
  rationale: Le verbe exprime l’examen ou la mise à l’épreuve du caractère intérieur ; « examiner » convient naturellement avec « mon cœur ».
- source_word: לִבִּי
  choice: mon cœur
  rationale: « Cœur » conserve l’anthropologie hébraïque, où il désigne la personne intérieure, notamment ses pensées et ses intentions.
- source_word: פָּקַדְתָּ
  choice: m’as visité
  rationale: פקד peut signifier visiter, s’occuper de ou inspecter. « Visiter » préserve l’image hébraïque tout en laissant le contexte d’examen préciser le sens.
- source_word: לַּיְלָה
  choice: pendant la nuit
  rationale: L’accusatif a une valeur adverbiale. Cette formulation est naturelle en français moderne et conserve l’indication temporelle.
- source_word: צְרַפְתַּנִי
  choice: m’as éprouvé
  rationale: Le verbe évoque littéralement l’affinage des métaux et, par métaphore, la mise à l’épreuve d’une personne. « Éprouver » garde cette force dans un registre digne.
- source_word: בַל תִּמְצָא
  choice: sans rien trouver
  rationale: L’objet de « trouver » n’est pas exprimé dans l’hébreu. La traduction conserve cette absence sans ajouter « de mal » ou « en moi ».
- source_word: זַמֹּתִי
  choice: J’ai résolu
  rationale: La forme est comprise comme un verbe de זמם, « projeter, décider ». « J’ai résolu » exprime une décision ferme sans préciser davantage son contenu.
- source_word: בַל יַעֲבָר פִּי
  choice: que ma bouche ne franchirait pas les limites
  rationale: עבר signifie littéralement « passer, franchir ». Avec « ma bouche », l’expression évoque le fait de dépasser les limites en parole ; la formulation française maintient l’image plutôt que de la remplacer par « pécher ».
theological_decisions:
- issue: Interprétation du dernier membre du verset
  choice: « J’ai résolu que ma bouche ne franchirait pas les limites. »
  alternative: « Ce que j’ai projeté, ma bouche ne le dépassera pas » ou « ma bouche ne transgresse pas ».
  rationale: L’hébreu est concis et syntaxiquement difficile. Comprendre זַמֹּתִי verbalement comme une résolution, puis la proposition suivante comme son contenu, donne un sens cohérent tout en signalant en note que d’autres constructions restent possibles.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsmes. Le parallélisme des trois actions divines est conservé. « Visité » maintient l’idiome source, tandis que « franchir les limites » préserve l’image de עבר et la tension du dernier membre.
