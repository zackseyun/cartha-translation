id: PSA.17.2
reference: Psalms 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֭/לְּ/פָנֶי/ךָ מִשְׁפָּטִ֣/י יֵצֵ֑א עֵ֝ינֶ֗י/ךָ תֶּחֱזֶ֥ינָה מֵישָׁרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: fr
  text: Que mon jugement sorte de devant toi[a] ; que tes yeux voient ce qui est droit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que ma justification vienne de ta présence. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « l’équité » ou « ce qui est juste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: de devant toi
  rationale: Conserve l’image spatiale et judiciaire d’une décision qui émane de la présence de Dieu. « De ta présence » est plus naturel, mais légèrement moins concret.
- source_word: מִשְׁפָּטִי
  choice: mon jugement
  rationale: Le nom peut désigner le jugement, la décision judiciaire, la cause ou la justification du psalmiste. « Mon jugement » reste proche de l’hébreu sans imposer d’emblée une issue favorable.
- source_word: יֵצֵא
  choice: sorte
  rationale: Rend directement le mouvement exprimé par יצא et s’accorde avec le point d’origine, « de devant toi ».
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: Maintient l’expression anthropomorphique concrète de l’hébreu plutôt que de la réduire au simple pronom « tu ».
- source_word: תֶּחֱזֶינָה
  choice: voient
  rationale: Expression claire et actuelle de l’acte de regarder ou de discerner attentivement dans ce contexte.
- source_word: מֵישָׁרִים
  choice: ce qui est droit
  rationale: Rend le sens moral et judiciaire de droiture, de rectitude ou d’équité dans un français naturel.
theological_decisions:
- issue: 'Valeur des imparfaits hébreux : demande ou affirmation'
  choice: 'Demande : « Que mon jugement sorte… ; que tes yeux voient… »'
  alternative: 'Affirmation ou futur : « Mon jugement sortira… ; tes yeux verront… »'
  rationale: Dans le contexte de la prière, les imparfaits se comprennent naturellement comme des souhaits ou des requêtes, tout en laissant en note la possibilité grammaticale d’une affirmation au futur.
translation_notes:
  register: Français moderne, digne et poétique. La formulation « de devant toi » est volontairement plus littérale que l’usage courant afin de préserver l’image de la décision émanant de la face ou de la présence divine.
