  text: לִ/פְעֻלּ֣וֹת אָ֭דָם בִּ/דְבַ֣ר שְׂפָתֶ֑י/ךָ אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: fr
  text: Pour ce qui est des actions humaines, par la parole de tes lèvres, je me suis gardé des sentiers de l’homme violent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai observé les sentiers de l’homme violent ». Le verbe hébreu peut signifier « garder », « observer » ou « veiller sur » ; le contexte favorise l’idée de se tenir éloigné de ces sentiers.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: Pour ce qui est des actions humaines
  rationale: Le ל préfixé introduit ici le domaine considéré. « Actions humaines » rend le singulier collectif אָדָם sans suggérer un individu précis et reste naturel en français moderne.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: par la parole de tes lèvres
  rationale: « Par » exprime la valeur instrumentale probable de בְּ, tandis que « la parole de tes lèvres » conserve l’image poétique hébraïque de la parole divine.
- source_word: שָׁמַרְתִּי
  choice: je me suis gardé de
  rationale: Dans ce contexte de revendication d’intégrité, le verbe שׁמר se comprend vraisemblablement comme l’action de se préserver ou de se tenir à l’écart. La note maintient l’autre lecture possible, « observer ».
- source_word: אָרְחוֹת
  choice: les sentiers
  rationale: « Sentiers » préserve la métaphore concrète d’une conduite ou d’un mode de vie et convient au registre poétique.
- source_word: פָּרִיץ
  choice: l’homme violent
  rationale: Le nom singulier désigne une personne violente ou brutale. Cette formulation conserve le singulier hébreu et évite d’affaiblir le sens en simple « transgresseur ».
theological_decisions:
- issue: Sens de la proposition avec שָׁמַרְתִּי
  choice: Le psalmiste affirme que la parole de Dieu lui a permis de se garder des voies violentes.
  alternative: Le psalmiste affirme avoir observé les sentiers de l’homme violent.
  rationale: שׁמר peut signifier « garder », « observer » ou « veiller sur ». La revendication d’intégrité dans le contexte et le complément « par la parole de tes lèvres » favorisent l’idée d’évitement, mais l’ambiguïté lexicale réelle est signalée en note.
translation_notes:
  register: Français international actuel, digne et poétique. L’image anthropomorphique « tes lèvres » et la métaphore des « sentiers » sont conservées. Le marqueur de note est placé après la proposition concernée.
