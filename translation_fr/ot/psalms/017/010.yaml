  text: Ils ferment leur cœur[a] ; leur bouche parle avec arrogance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils ferment leur graisse ». Cette image désigne probablement un cœur devenu insensible ou replié sur lui-même ; on pourrait aussi traduire : « leur cœur endurci ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: leur cœur engraissé
  rationale: L’hébreu dit littéralement « leur graisse », sans nom exprimé. Dans ce contexte poétique, la graisse évoque probablement un intérieur devenu insensible ou satisfait de lui-même. « Cœur » explicite avec prudence l’objet sous-entendu, tandis que « engraissé » conserve l’image concrète.
- source_word: סָּגְרוּ
  choice: ont fermé
  rationale: Le verbe signifie « fermer ». Le passé composé rend naturellement en français l’accompli hébreu tout en décrivant leur état présent.
- source_word: פִּימוֹ
  choice: de leur bouche
  rationale: La forme hébraïque est au singulier avec un suffixe pluriel. Le singulier collectif « leur bouche » reste naturel en français et suit de près la forme source.
- source_word: דִּבְּרוּ
  choice: ils parlent
  rationale: Dans cette description poétique, l’accompli peut exprimer une conduite caractéristique. Le présent français convient à cette valeur descriptive.
- source_word: בְגֵאוּת
  choice: avec arrogance
  rationale: Le nom désigne l’orgueil ou l’arrogance. La tournure adverbiale « avec arrogance » est claire, actuelle et conserve la force morale négative.
