  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/000.yaml
  text: A prayer of David. Hear righteousness[a], Yahweh; pay attention to my cry; give ear to my prayer from lips without deceit.
translation:
  language: fr
  text: Prière de David. Écoute, YHWH, ma juste cause[a] ; sois attentif à mon cri ; prête l’oreille à ma prière, qui ne vient pas de lèvres trompeuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice » ou « ce qui est juste ». Le mot hébreu peut désigner la justice, la droiture ou une cause juste ; ici, il renvoie probablement à la cause légitime du psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Prière de David
  rationale: Le titre hébreu désigne une prière associée à David ; le génitif français conserve naturellement l’ambiguïté possible de לְ.
- source_word: צֶדֶק
  choice: ma juste cause
  rationale: Dans cet appel adressé à Dieu, le terme désigne vraisemblablement la cause juste du psalmiste. L’ajout contextuel de « ma » rend le référent naturel en français sans effacer l’autre lecture, signalée en note.
- source_word: יְהוָה
  choice: YHWH
  rationale: La translittération consonantique distingue le nom divin du titre « Seigneur » sans imposer une vocalisation incertaine.
- source_word: רִנָּתִי
  choice: mon cri
  rationale: Dans ce contexte de supplication, le nom désigne un cri pressant plutôt qu’un chant joyeux.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: qui ne vient pas de lèvres trompeuses
  rationale: Cette formulation française rattache naturellement l’expression finale à la prière tout en conservant l’image hébraïque des lèvres et l’affirmation d’absence de tromperie.
theological_decisions:
- issue: Sens de צֶדֶק dans l’appel initial
  choice: ma juste cause
  alternative: la justice / ce qui est juste
  rationale: Le contexte judiciaire et les demandes d’écoute favorisent l’idée d’une cause légitime, mais la polysémie morale et judiciaire du mot hébreu est conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. Les impératifs parallèles gardent le rythme de la supplication hébraïque ; « YHWH » préserve le nom divin, et l’image concrète des « lèvres trompeuses » est maintenue.
