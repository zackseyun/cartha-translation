  text: des méchants qui me ravagent, de mes ennemis qui en veulent à ma vie, qui m’entourent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי
  choice: des
  rationale: Dans la continuité syntaxique de la demande du verset précédent, « des » exprime naturellement en français la menace dont le psalmiste demande à être préservé, sans calquer le littéral « de devant ».
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Le substantif pluriel désigne des personnes moralement coupables. « Les méchants » conserve cette catégorie éthique sans préciser un genre absent de l’hébreu.
- source_word: זוּ
  choice: qui
  rationale: Le pronom relatif relie « les méchants » au verbe suivant ; « qui » est la formulation française naturelle.
- source_word: שַׁדּוּנִי
  choice: me ravagent
  rationale: Le verbe שׁדד évoque une action violente qui dévaste ou ruine. « Me ravagent » en garde la force sans imposer l’idée d’un anéantissement total.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Rend directement le nom pluriel avec son suffixe possessif de première personne.
- source_word: בְּנֶפֶשׁ
  choice: mortels
  rationale: Dans ce contexte, l’expression caractérise vraisemblablement des ennemis qui menacent la vie du psalmiste. « Ennemis mortels » est idiomatique, tandis qu’une note conserve l’ambiguïté de נֶפֶשׁ.
- source_word: יַקִּיפוּ עָלָי
  choice: qui m’encerclent
  rationale: Le verbe avec עַל décrit des adversaires qui entourent le psalmiste. « M’encerclent » restitue clairement cette image hostile.
theological_decisions:
- issue: Portée de בְּנֶפֶשׁ
  choice: mes ennemis mortels
  alternative: mes ennemis qui en veulent à ma vie
  rationale: Le texte peut soit qualifier l’hostilité comme mortelle, soit indiquer plus explicitement que les ennemis cherchent à prendre la vie du psalmiste. Le texte principal reste naturel et concis, et la note signale l’autre lecture sans trancher abusivement.
translation_notes:
  register: Français moderne, sobre et poétique. Le verset demeure une continuation syntaxique du verset précédent ; l’ouverture par « des » respecte cette dépendance plutôt que d’ajouter une proposition absente de l’hébreu.
