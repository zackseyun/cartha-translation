source:
  edition: WLC
  text: קוּמָ֤/ה יְהוָ֗ה קַדְּמָ֣/ה פָ֭נָי/ו הַכְרִיעֵ֑/הוּ פַּלְּטָ֥/ה נַ֝פְשִׁ֗/י מֵ/רָשָׁ֥ע חַרְבֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/013.yaml
  text: Rise up[a], O Yahweh; confront him, bring him low[b]; deliver my life from the wicked by your sword.
translation:
  language: fr
  text: Lève-toi, Yahvé ! Affronte-le, fais-le plier ; sauve ma vie[a] du méchant par ton épée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu néfesh peut aussi se traduire par « âme » ou « personne » ; ici, il désigne vraisemblablement la vie menacée.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « sauve ma vie du méchant, ton épée », le méchant étant alors présenté comme un instrument dans la main de Yahvé.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: L’impératif de קום exprime un appel pressant à l’intervention divine. « Lève-toi » est naturel en français moderne et conserve la vigueur de l’image.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » rend le nom divin יהוה comme nom propre plutôt que de lui substituer un titre.
- source_word: קַדְּמָה פָנָיו
  choice: Affronte-le
  rationale: L’expression signifie littéralement aller au-devant de sa face. Dans ce contexte hostile, « affronte-le » en restitue clairement et naturellement la portée.
- source_word: הַכְרִיעֵהוּ
  choice: fais-le plier
  rationale: La forme causative de כרע évoque le fait de contraindre l’adversaire à s’incliner, à ployer ou à tomber. « Fais-le plier » garde cette image sans préciser indûment s’il doit être renversé ou seulement soumis.
- source_word: פַּלְּטָה
  choice: sauve
  rationale: L’impératif de פלט demande une délivrance face à un danger concret. Avec « ma vie », « sauve » est plus idiomatique en français actuel que « délivre » tout en conservant le sens.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: נפש peut désigner l’âme, la personne ou la vie. Ici, la menace mortelle rend « ma vie » particulièrement approprié, sans introduire une distinction abstraite entre corps et âme.
- source_word: מֵרָשָׁע
  choice: du méchant
  rationale: Le singulier hébreu désigne ici l’adversaire impie mentionné par les pronoms au singulier. La formulation française conserve cette indétermination sans ajouter « homme ».
- source_word: חַרְבֶּךָ
  choice: par ton épée
  rationale: Le syntagme signifie littéralement « ton épée ». Dans la lecture principale, il indique le moyen par lequel Yahvé sauve le psalmiste et maintient l’image guerrière.
theological_decisions:
- issue: Rapport syntaxique entre « ton épée » et « le méchant »
  choice: 'Lecture instrumentale : Yahvé sauve le psalmiste au moyen de son épée.'
  alternative: 'Lecture appositionnelle : le méchant est lui-même « ton épée », c’est-à-dire un instrument dans la main de Yahvé.'
  rationale: La suite hébraïque מֵרָשָׁע חַרְבֶּךָ est condensée et autorise les deux analyses. Le contexte d’un appel à l’intervention divine favorise la lecture instrumentale dans le texte principal, mais l’autre lecture porte une tension réelle concernant l’action souveraine de Dieu et doit être conservée en note.
translation_notes:
  register: Français moderne, international et digne, avec des impératifs brefs qui conservent l’urgence de la prière. « Yahvé » rend explicitement le nom divin. La ponctuation maintient le rythme poétique en trois appels successifs.
