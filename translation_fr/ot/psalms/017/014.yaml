id: PSA.17.14
reference: Psalms 17:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִֽ/מְתִ֥ים יָדְ/ךָ֨ יְהוָ֡ה מִֽ/מְתִ֬ים מֵ/חֶ֗לֶד חֶלְקָ֥/ם בַּֽ/חַיִּים֮ ו/צפינ/ך תְּמַלֵּ֪א בִ֫טְנָ֥/ם יִשְׂבְּע֥וּ בָנִ֑ים וְ/הִנִּ֥יחוּ יִ֝תְרָ֗/ם לְ/עוֹלְלֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: fr
  text: 'des hommes, par ta main[a], Yahweh,

    des hommes de ce monde,

    dont la part est dans cette vie.

    Tu remplis leur ventre de ton trésor tenu en réserve ;

    ils sont comblés de fils[b]

    et laissent leur surplus à leurs enfants[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hommes — par ta main, Yahweh » ou « des hommes de ta main ». La syntaxe hébraïque est condensée et peut être comprise de plusieurs manières.
    reason: alternative_reading
  - marker: b
    text: 'Autre compréhension possible : « leurs fils sont rassasiés ».'
    reason: alternative_reading
  - marker: c
    text: L’hébreu désigne plus précisément leurs petits enfants, c’est-à-dire leurs enfants en bas âge.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: des hommes
  rationale: Dans le contexte, le groupe désigne les adversaires humains et reprend implicitement la demande de délivrance du verset précédent. « Des mortels » serait possible, mais « des hommes » conserve mieux le parallélisme et la forme masculine plurielle.
- source_word: יָדְךָ
  choice: par ta main
  rationale: Cette lecture comprend la main de Dieu comme l’agent ou le moyen de la délivrance demandée. La syntaxe hébraïque reste cependant très condensée, d’où une note signalant d’autres rattachements possibles.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver sa valeur de nom propre plutôt que de le remplacer par un titre.
- source_word: מֵחֶלֶד
  choice: de ce monde
  rationale: חֶלֶד désigne ici la sphère passagère de l’existence humaine. Le démonstratif « ce » rend naturellement en français le rapport au monde présent sans développer une doctrine que le verset n’explicite pas.
- source_word: חֶלְקָם בַּחַיִּים
  choice: dont la part est dans cette vie
  rationale: Cette formulation exprime la prospérité qui leur échoit dans l’existence présente, tout en évitant d’ajouter une affirmation explicite sur leur sort futur.
- source_word: וּצְפוּנְךָ
  choice: ton trésor tenu en réserve
  rationale: Le terme évoque ce qui est caché ou mis en réserve. « Trésor tenu en réserve » maintient cette image sans réduire nécessairement le don à de l’argent.
- source_word: תְּמַלֵּא בִטְנָם
  choice: Tu remplis leur ventre
  rationale: « Ventre » conserve l’image corporelle concrète de בֶּטֶן et convient au contexte de rassasiement et d’abondance.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: ils sont comblés de fils
  rationale: Cette lecture prend les hommes comme sujet du verbe et les fils comme ce qui les comble, signe traditionnel de prospérité. « Comblés » est plus naturel ici que « rassasiés » en français, tandis qu’une note conserve l’autre analyse syntaxique possible.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: et laissent leur surplus
  rationale: יֶתֶר désigne ce qui reste, l’excédent ou le surplus. « Surplus » maintient le lien avec l’abondance décrite sans préciser qu’il s’agit uniquement de richesse monétaire.
- source_word: לְעוֹלְלֵיהֶם
  choice: à leurs enfants
  rationale: Le mot vise plus précisément de petits enfants. « Leurs enfants » est fluide dans le contexte d’une transmission, tandis que la nuance d’âge est conservée en note.
theological_decisions:
- issue: Rapport des adversaires à la main souveraine de Dieu
  choice: « des hommes, par ta main » présente la main de Dieu comme le moyen de la délivrance, sans définir les hommes eux-mêmes comme des instruments divins.
  alternative: « des hommes de ta main » ou « des hommes — par ta main, Yahweh »
  rationale: La syntaxe hébraïque est comprimée et admet plusieurs rattachements. Le texte principal suit une lecture cohérente avec la demande du verset précédent, et la note préserve l’ambiguïté réelle.
- issue: Prospérité temporelle des adversaires
  choice: « dont la part est dans cette vie » situe leur lot dans l’existence présente.
  alternative: « dont la part est parmi les vivants » ou « dont la part est la vie »
  rationale: Le contexte suggère un contraste temporel, mais le verset ne formule pas à lui seul une doctrine complète du jugement futur. La traduction maintient ce contraste sans le développer.
- issue: Sens de « ils sont comblés de fils »
  choice: Les hommes prospères sont comblés par une nombreuse descendance masculine.
  alternative: « leurs fils sont rassasiés »
  rationale: La construction permet de comprendre בָנִים soit comme complément, soit comme sujet postposé. Le texte principal retient une lecture ancienne et contextuellement cohérente, tout en donnant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, digne et lisible. La construction initiale demeure volontairement liée au verset précédent, comme en hébreu. Les images concrètes du ventre, de la part et du surplus sont conservées, tandis que les ambiguïtés syntaxiques significatives sont signalées en notes.
