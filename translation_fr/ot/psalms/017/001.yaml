id: PSA.17.1
reference: Psalms 17:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּפִלָּ֗ה לְ/דָ֫וִ֥ד שִׁמְעָ֤/ה יְהוָ֨ה צֶ֗דֶק הַקְשִׁ֥יבָ/ה רִנָּתִ֗/י הַאֲזִ֥ינָ/ה תְפִלָּתִ֑/י בְּ֝/לֹ֗א שִׂפְתֵ֥י מִרְמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: fr
  text: Prière de David. Écoute, Yahweh, une juste cause[a] ; sois attentif à mon cri ; prête l’oreille à ma prière, qui ne vient pas de lèvres trompeuses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice », c’est-à-dire ce qui est droit ou juste. Le mot hébreu peut désigner la justice, la droiture ou une cause juste ; ici, il renvoie probablement au bon droit du psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Prière de David
  rationale: La formule de suscription présente le psaume. Avec un nom de personne, לְ indique ici le plus naturellement l’auteur ou l’association.
- source_word: שִׁמְעָה
  choice: Écoute
  rationale: L’impératif conserve la demande directe et s’intègre à la série de verbes exprimant l’écoute attentive.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: צֶדֶק
  choice: une juste cause
  rationale: Objet direct de « Écoute », le terme désigne vraisemblablement ici la cause juste ou le bon droit du psalmiste, sans exclure son sens plus abstrait de justice.
- source_word: הַקְשִׁיבָה
  choice: sois attentif à
  rationale: Le hifil impératif de קשׁב appelle une écoute délibérée et attentive ; cette formulation est naturelle en français actuel.
- source_word: רִנָּתִי
  choice: mon cri
  rationale: Dans cette prière de supplication, le nom désigne un cri pressant plutôt qu’un cri de joie.
- source_word: הַאֲזִינָה
  choice: prête l’oreille à
  rationale: Cette expression conserve l’image auditive de l’hébreu tout en gardant un registre poétique intelligible.
- source_word: תְפִלָּתִי
  choice: ma prière
  rationale: Le choix direct maintient le lien lexical avec la suscription תְּפִלָּה.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: qui ne vient pas de lèvres trompeuses
  rationale: La proposition rattache clairement le groupe prépositionnel à la prière et exprime naturellement en français qu’elle procède de lèvres exemptes de tromperie.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Portée de צֶדֶק
  choice: une juste cause
  alternative: la justice
  rationale: Dans la construction « écouter + צֶדֶק », le mot paraît désigner le bon droit ou la cause juste du suppliant. Une note conserve toutefois l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsme marqué. Le parallélisme des trois appels à l’écoute est conservé par « Écoute », « sois attentif » et « prête l’oreille ».
