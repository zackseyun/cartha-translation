  text: דִּמְיֹנ֗/וֹ כְּ֭/אַרְיֵה יִכְס֣וֹף לִ/טְר֑וֹף וְ֝/כִ/כְפִ֗יר יֹשֵׁ֥ב בְּ/מִסְתָּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/012.yaml
  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: fr
  text: Il est comme un lion avide de déchirer[a], comme un jeune lion se tenant dans des lieux cachés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe signifie « déchirer »; son objet n’est pas exprimé dans le texte hébreu.
    reason: translation_clarity
  - marker: b
    text: 'Littéralement : « assis dans des lieux cachés ». Le contexte peut évoquer un lion à l’affût.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: Il est comme
  rationale: Le nom signifie littéralement « sa ressemblance », mais la tournure française directe exprime naturellement la comparaison sans la lourdeur de « sa ressemblance est comme ».
- source_word: כְּאַרְיֵה
  choice: comme un lion
  rationale: Le préfixe comparatif כְּ est rendu par « comme », et אַרְיֵה désigne le lion.
- source_word: יִכְסוֹף
  choice: avide de
  rationale: Le verbe exprime un désir intense. Dans cette scène de prédation, « avide de » restitue cette force de façon concise et naturelle.
- source_word: לִטְרוֹף
  choice: déchirer sa proie
  rationale: Le verbe évoque l’action d’un prédateur qui saisit et déchire. « Sa proie » est explicité en français pour compléter naturellement le verbe transitif, sans changer l’image.
- source_word: וְכִכְפִיר
  choice: comme un jeune lion
  rationale: כְּפִיר désigne un jeune lion. La seconde comparaison prolonge le parallélisme; la conjonction n’a pas besoin d’être rendue séparément en français.
- source_word: יֹשֵׁב
  choice: tapi
  rationale: Le participe signifie littéralement « assis » ou « demeurant », mais, associé aux cachettes et à l’image du lion, il décrit une posture d’affût. « Tapi » rend naturellement cette implication contextuelle.
- source_word: בְּמִסְתָּרִים
  choice: dans des cachettes
  rationale: Le pluriel désigne des lieux cachés ou dissimulés. « Dans des cachettes » conserve ce pluriel et convient à la scène d’embuscade.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La comparaison directe évite un calque nominal lourd; « avide » conserve l’intensité du désir, tandis que « tapi » rend clairement la scène d’embuscade sans effacer le sens littéral, indiqué en note.
