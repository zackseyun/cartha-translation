base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: fr
  text: Quant à moi, dans la justice, je contemplerai ton visage ; quand je m’éveillerai[a], je serai rassasié de ta ressemblance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cet éveil peut désigner le réveil ordinaire après le sommeil, ou évoquer un éveil lors de la réhabilitation finale ou de la résurrection.
    reason: alternative_reading
  - marker: b
    text: Ou « de ta forme » ou « de ton image ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: dans la justice
  rationale: Cette formulation conserve la concision de l’hébreu et ne tranche pas entre l’intégrité du psalmiste, la justice accordée par Dieu et la juste réhabilitation.
- source_word: אֶחֱזֶה
  choice: je contemplerai
  rationale: Le verbe חזה évoque ici une vision attentive plutôt qu’un simple regard ; « contempler » en restitue la portée poétique sans archaïsme.
- source_word: פָנֶיךָ
  choice: ton visage
  rationale: Le choix maintient l’image concrète de l’hébreu, plutôt que de l’expliciter par « ta présence ».
- source_word: אֶשְׂבְּעָה
  choice: je me rassasierai
  rationale: Le verbe שׂבע signifie être rassasié ou pleinement comblé. La tournure pronominale française garde l’image forte et poétique du texte.
- source_word: בְּהָקִיץ
  choice: quand je m’éveillerai
  rationale: La proposition temporelle rend naturellement l’infinitif hébreu avec בְּ tout en laissant ouverte la nature de cet éveil.
- source_word: תְּמוּנָתֶךָ
  choice: ton image
  rationale: תְּמוּנָה peut désigner une image, une ressemblance ou une forme. « Ton image » est naturel en français et conserve le caractère concret, sans réduire le mot à une forme physique précisément définie.
theological_decisions:
- issue: La nature de l’éveil exprimé par בְּהָקִיץ
  choice: Le texte dit simplement « quand je m’éveillerai » sans préciser de quel éveil il s’agit.
  alternative: Un réveil ordinaire après le sommeil, ou un éveil lié à la réhabilitation finale ou à la résurrection.
  rationale: L’hébreu ne détermine pas explicitement la nature de l’éveil. La traduction préserve donc cette tension interprétative au lieu d’imposer une lecture eschatologique ou quotidienne.
- issue: Le sens de בְּצֶדֶק
  choice: « dans la justice »
  alternative: « parce que je suis juste », « lorsque justice me sera rendue » ou « avec droiture »
  rationale: La construction hébraïque reste compacte et ne précise pas explicitement à qui appartient la justice ni si elle désigne l’intégrité, la juste réhabilitation ou une condition accordée par Dieu.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. « Quant à moi » marque le contraste porté par אֲנִי ; le parallélisme et les images concrètes du visage, de l’éveil et du rassasiement sont conservés.
