id: PSA.17.6
reference: Psalms 17:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִֽי קְרָאתִ֣י/ךָ כִֽי תַעֲנֵ֣/נִי אֵ֑ל הַֽט אָזְנְ/ךָ֥ לִ֝֗/י שְׁמַ֣ע אִמְרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/006.yaml
  text: I call on you[a], for you answer me, O God; incline your ear to me[b]; hear my words.
translation:
  language: fr
  text: Je t’invoque[a], car tu me réponds, ô Dieu ; tends l’oreille vers moi[b], écoute ce que je dis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Je t’ai invoqué, parce que tu me répondras, ô Dieu. » Dans cette prière poétique, les formes verbales hébraïques peuvent recevoir une nuance passée, présente ou de futur exprimé avec assurance.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « incline ton oreille vers moi ». Cette expression hébraïque demande à Dieu d’écouter attentivement.'
    reason: cultural_note
lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Je t’invoque
  rationale: Le parfait qal à la première personne avec suffixe de deuxième personne peut, dans la prière poétique, évoquer un appel déjà lancé, présent ou assuré. « Je t’invoque » exprime naturellement ici l’appel direct adressé à Dieu sans réduire cette latitude temporelle.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’invocation. « Car » en conserve la valeur causale et la concision poétique.
- source_word: תַעֲנֵנִי
  choice: tu me réponds
  rationale: L’imparfait à la deuxième personne avec suffixe de première personne exprime ici la confiance en la réponse de Dieu. Le présent français garde cette assurance sans imposer exclusivement un sens futur.
- source_word: אֵל
  choice: ô Dieu
  rationale: Le nom est employé comme vocatif. « Ô Dieu » rend clairement l’adresse directe dans un registre de prière digne.
- source_word: הַט אָזְנְךָ לִי
  choice: tends l’oreille vers moi
  rationale: L’impératif hiphil de נטה associé à « oreille » forme une image demandant une écoute attentive. Cette tournure française conserve la métaphore tout en restant compréhensible.
- source_word: שְׁמַע
  choice: écoute
  rationale: L’impératif qal appelle directement Dieu à prêter attention. « Écoute » est plus idiomatique en français moderne que « entends » dans cette demande.
- source_word: אִמְרָתִי
  choice: ce que je dis
  rationale: Le substantif singulier désigne la parole prononcée ou le propos du psalmiste. « Ce que je dis » restitue naturellement en français cette idée collective sans introduire artificiellement une parole unique et isolée.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’adresse directe et la métaphore de l’écoute, tandis que les notes signalent l’ambiguïté temporelle réelle de l’hébreu et le sens de son idiome.
