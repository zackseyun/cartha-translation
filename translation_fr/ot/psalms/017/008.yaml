source:
  edition: WLC
  text: שָׁ֭מְרֵ/נִי כְּ/אִישׁ֣וֹן בַּת עָ֑יִן בְּ/צֵ֥ל כְּ֝נָפֶ֗י/ךָ תַּסְתִּירֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/008.yaml
  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: fr
  text: Garde-moi comme la pupille de l’œil[a] ; cache-moi à l’ombre de tes ailes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « comme la prunelle de l’œil ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Garde-moi
  rationale: Le verbe שׁמר exprime ici une demande de garde et de protection. « Garde-moi » est direct, naturel et conserve la force de l’impératif hébreu.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: comme la pupille de l’œil
  rationale: L’expression désigne la pupille, partie sensible que l’on protège spontanément. Cette formulation restitue clairement l’image hébraïque en français moderne sans se limiter à son étymologie imagée.
- source_word: בְּצֵל
  choice: à l’ombre
  rationale: צֵל signifie « ombre » ou « abri ombragé ». « À l’ombre » est idiomatique en français et s’accorde naturellement avec l’image protectrice des ailes.
- source_word: כְּנָפֶיךָ
  choice: de tes ailes
  rationale: כָּנָף signifie « aile ». Le maintien de cette image concrète préserve la poésie et la métaphore de la protection divine.
- source_word: תַּסְתִּירֵנִי
  choice: cache-moi
  rationale: La forme causative de סתר signifie « cacher, dissimuler ». « Cache-moi » traduit directement le verbe tout en conservant son sens protecteur dans le contexte.
theological_decisions:
- issue: Traduction de l’image protectrice liée à l’œil
  choice: Rendre l’expression par « comme la pupille de l’œil » dans le texte principal.
  alternative: « comme la prunelle de l’œil »
  rationale: « Pupille » communique immédiatement le référent concret de l’hébreu, tandis que la formulation traditionnelle « prunelle » est conservée en note. L’image évoque une protection attentive sans ajouter d’interprétation doctrinale.
- issue: Maintien de l’image des ailes
  choice: Conserver littéralement « tes ailes ».
  alternative: Expliciter par « ta protection » ou « tes soins ».
  rationale: Le texte hébreu emploie une métaphore corporelle et poétique. La conserver respecte la texture du psaume et laisse intacte sa portée théologique sans la paraphraser.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux demandes est maintenu, ainsi que les images concrètes de l’œil, de l’ombre et des ailes.
