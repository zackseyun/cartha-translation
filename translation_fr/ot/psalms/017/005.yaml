  yaml_path: translation/ot/psalms/017/005.yaml
  text: My steps have held fast in your paths[b][a]; my feet have not slipped.
translation:
  language: fr
  text: Affermis mes pas dans tes sentiers, pour que mes pieds ne glissent pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּמֹךְ
  choice: se sont maintenus
  rationale: Le verbe תמך exprime l’idée de tenir fermement ou de soutenir. Avec « mes pas » comme sujet, « se sont maintenus » rend naturellement une affirmation de stabilité, tout en signalant en note la lecture possible comme demande adressée à Dieu.
- source_word: אֲשֻׁרַי
  choice: mes pas
  rationale: Le nom désigne les pas ou la marche. « Mes pas » conserve l’image concrète du cheminement et convient au parallélisme poétique.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: dans tes sentiers
  rationale: מַעְגָּל désigne une piste, un sentier ou un chemin tracé. « Dans tes sentiers » respecte la préposition hébraïque et reste naturel en français poétique.
- source_word: בַּל
  choice: ne… pas
  rationale: Cette particule négative poétique est rendue directement par la négation française courante.
- source_word: נָמֹטּוּ
  choice: n’ont pas glissé
  rationale: Le verbe מוט peut évoquer le fait de vaciller, de chanceler ou de glisser. Avec « mes pieds », « glisser » exprime clairement la perte d’appui envisagée.
- source_word: פְעָמָי
  choice: mes pieds
  rationale: Le terme peut désigner les pas, les foulées ou, par métonymie, les pieds. « Mes pieds » est idiomatique avec « glisser » et évite une répétition lourde de « mes pas ».
theological_decisions:
- issue: 'Valeur de תָּמֹךְ : demande ou affirmation'
  choice: 'Affirmation : « Mes pas se sont maintenus »'
  alternative: 'Demande : « Soutiens mes pas »'
  rationale: La forme hébraïque et la syntaxe poétique permettent de comprendre soit une prière demandant à Dieu d’affermir les pas du psalmiste, soit une affirmation de sa fermeté. Le parallélisme avec « mes pieds n’ont pas glissé » favorise l’affirmation dans le texte principal, sans exclure l’autre lecture.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme de la marche est conservé par « mes pas » et « mes pieds », tandis que la note maintient l’ambiguïté grammaticale réelle de l’hébreu.
