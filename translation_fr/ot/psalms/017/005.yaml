review_pass:
  verdict: revise
  source_fidelity: 'La forme massorétique תָּמֹךְ est un impératif masculin singulier : le texte principal doit donc exprimer une demande adressée à Dieu (« Affermis » / « Soutiens »), plutôt qu’une affirmation réflexive au passé. La seconde proposition évoque le non-vacillement des pas; « ne glissent pas » est une restitution naturelle dans l’image de la marche.'
  naturalness: « Mes pas se sont maintenus dans tes sentiers » est compréhensible, mais peu idiomatique et affaiblit l’action de Dieu exprimée par l’impératif. « Affermis mes pas dans tes sentiers, pour que mes pieds ne glissent pas » est naturel, sobre et poétique en français moderne.
  terminology: « Affermis » rend bien תמך dans une prière, sans ajouter de portée doctrinale. « Sentiers » convient à מַעְגְּלוֹת; « mes pas » puis « mes pieds » préserve le parallélisme sans répétition maladroite.
  issues:
  - severity: high
    issue: Le texte principal transforme l’impératif hébreu en affirmation au passé.
    rationale: תָּמֹךְ est formellement un impératif (« soutiens/affermis »). « Mes pas se sont maintenus » ne rend ni le mode ni l’agent implicite, Dieu.
  - severity: medium
    issue: La note présente la demande comme une simple alternative alors qu’elle correspond à la morphologie massorétique.
    rationale: La lecture affirmative peut être signalée comme possibilité interprétative ou textuelle, mais le texte principal doit privilégier l’impératif attesté.
  revised_text: Affermis mes pas dans tes sentiers, pour que mes pieds ne glissent pas.
  revised_footnotes:
  - marker: a
    text: 'Ou, selon une compréhension affirmative : « Mes pas tiennent fermement dans tes sentiers ; mes pieds ne glissent pas. »'
    reason: alternative_reading
  revision_rationale: La révision restitue l’impératif hébreu dans le texte principal et conserve en note l’interprétation affirmative signalée par la tradition de traduction. « Pour que » explicite en français le rapport entre la demande d’affermissement et le non-vacillement, sans modifier l’image ni le sens du parallélisme.
