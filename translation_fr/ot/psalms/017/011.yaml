  text: אַ֭שֻּׁרֵי/נוּ עַתָּ֣ה סבבו/ני עֵינֵי/הֶ֥ם יָ֝שִׁ֗יתוּ לִ/נְט֥וֹת בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/011.yaml
  text: They have now surrounded our steps[c][b][a]; they set their eyes to cast us down to the ground.
translation:
  language: fr
  text: Sur nos pas, ils m’encerclent maintenant[a] ; ils ont les yeux fixés pour me jeter à terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe ici de « nos pas » à « ils m’encerclent ». On peut aussi comprendre : « Maintenant, ils encerclent nos pas. »'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Littéralement, l’expression peut se rendre : « pour faire pencher vers la terre » ; l’objet n’est pas exprimé en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: sur nos pas
  rationale: Le nom désigne les pas ou les traces. La tournure prépositionnelle française permet de le rattacher à la poursuite sans en faire artificiellement l’objet direct du verbe.
- source_word: עַתָּה
  choice: maintenant
  rationale: Cet adverbe situe la menace dans la crise présente.
- source_word: סבבוני
  choice: ils m’encerclent
  rationale: Le verbe exprime l’action d’entourer, et son suffixe est explicitement à la première personne du singulier. La traduction conserve donc le passage de « nos » à « me ».
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: ils fixent les yeux
  rationale: Cette expression naturelle en français garde l’image concrète des yeux dirigés avec une intention hostile.
- source_word: לִנְטוֹת
  choice: pour me jeter
  rationale: Dans ce contexte hostile, l’infinitif de נטה peut évoquer l’action de faire pencher ou tomber quelqu’un. « Jeter » rend clairement le mouvement vers le sol, tout en signalant en note une lecture plus littérale.
- source_word: בָּאָרֶץ
  choice: à terre
  rationale: Ici, אֶרֶץ désigne vraisemblablement le sol plutôt que le pays. « À terre » est idiomatique et correspond à l’image d’un homme abattu.
theological_decisions:
- issue: Passage du collectif au singulier
  choice: Conserver « nos pas » puis « m’encerclent »
  alternative: Harmoniser en « ils encerclent nos pas » ou « ils nous encerclent »
  rationale: Le texte massorétique passe réellement de la première personne du pluriel au suffixe singulier. Cette tension poétique ou textuelle ne doit pas être effacée sans indication.
- issue: Objet implicite de לנטות
  choice: Expliciter « me » dans « pour me jeter à terre »
  alternative: Traduire « pour incliner vers la terre » sans objet exprimé
  rationale: Le contexte et le singulier précédent rendent naturel le renvoi au psalmiste, mais l’hébreu ne formule pas cet objet explicitement ; la note préserve cette ambiguïté.
translation_notes:
  register: Français moderne, sobre et poétique. Le rythme en deux propositions conserve le parallélisme, tandis que les notes rendent visibles le changement de nombre grammatical et l’ambiguïté du dernier infinitif.
