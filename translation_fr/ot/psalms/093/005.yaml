  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: fr
  text: Tes témoignages sont tout à fait dignes de confiance ; la sainteté convient à ta maison, Yahweh, pour de longs jours[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une longueur de jours » ; cette expression peut signifier « pour toujours » ou « à jamais ».'
    reason: Précision sur l’idiome hébreu et son autre traduction possible.
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: tes témoignages
  rationale: Le terme désigne ici les attestations ou déclarations divines, notamment dans le cadre de l’alliance. « Témoignages » conserve sa portée sans le réduire à des prescriptions juridiques.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: sont tout à fait dignes de confiance
  rationale: Le niphal de אמן exprime la fermeté et la fiabilité ; מְאֹד renforce nettement cette qualité. Cette formulation est naturelle en français moderne.
- source_word: לְבֵיתְךָ
  choice: à ta maison
  rationale: « Maison » garde l’image hébraïque tout en laissant entendre, dans le contexte, le sanctuaire de Dieu.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: la sainteté convient
  rationale: נַאֲוָה exprime ce qui est approprié ou séant, et קֹדֶשׁ désigne ici la sainteté comme qualité propre à la maison de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: לְאֹרֶךְ יָמִים
  choice: pour toute la durée des jours
  rationale: La traduction conserve l’image hébraïque de la « longueur des jours » tout en l’exprimant dans un français intelligible ; l’idiome évoque une durée sans fin.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette donnée au lieu de lui substituer un titre.
- issue: Portée temporelle de לְאֹרֶךְ יָמִים
  choice: pour toute la durée des jours
  alternative: pour toujours / à jamais
  rationale: Le texte principal maintient l’image concrète et la légère ouverture de l’expression hébraïque, tandis que la note indique son sens idiomatique probable.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé au moyen du point-virgule, et le vocabulaire cultuel reste explicite sans ajouter d’interprétation confessionnelle.
