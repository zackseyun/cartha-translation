base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/003.yaml
  text: The rivers have lifted up[a], O Yahweh; the rivers have lifted up their voice[b]; the rivers lift up their pounding waves.
translation:
  language: fr
  text: 'Les fleuves ont élevé, ô Yahweh,

    les fleuves ont élevé leur voix ;

    les fleuves élèvent leur fracas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « leur déferlement », « leurs brisants ». Le dernier mot hébreu est rare et évoque le choc ou le fracas puissant des eaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: se sont soulevés / ont élevé / soulèvent
  rationale: Le verbe נשׂא signifie fondamentalement « lever, élever, porter ». La formulation varie selon son complément en français tout en conservant la triple reprise et la progression des deux accomplis vers l’inaccompli final, rendu par un présent vivant.
- source_word: נְהָרוֹת
  choice: fleuves
  rationale: Le nom désigne ordinairement des cours d’eau, notamment des fleuves ou des rivières. « Fleuves » garde le sens lexical direct et convient au registre poétique, sans imposer d’emblée l’interprétation des eaux chaotiques.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre. Sa place entre virgules fait entendre l’adresse directe.
- source_word: קוֹלָם
  choice: leur voix
  rationale: קוֹל peut signifier « voix », « son » ou « bruit ». « Leur voix » maintient la personnification poétique des fleuves.
- source_word: דָּכְיָם
  choice: leurs flots fracassants
  rationale: Ce nom rare évoque le pilonnement ou le fracas des eaux, voire leurs vagues déferlantes. « Flots fracassants » rend à la fois l’image aquatique et sa force sonore sans prétendre supprimer l’incertitude lexicale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh, en adresse directe
  alternative: le SEIGNEUR ; l’Éternel ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve ici le nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international actuel, poétique mais immédiatement compréhensible. La répétition de « les fleuves » et du verbe « élever/soulever » reproduit l’insistance et la montée du vers hébreu. Les retours à la ligne rendent le parallélisme ternaire.
