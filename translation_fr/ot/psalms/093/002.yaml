  text: נָכ֣וֹן כִּסְאֲ/ךָ֣ מֵ/אָ֑ז מֵֽ/עוֹלָ֣ם אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: fr
  text: Ton trône est établi depuis les temps anciens[a] ; toi, tu es de toute éternité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ton trône est ferme depuis longtemps ; toi, tu es de toute éternité. »'
    reason: Alternative lexicale pour נָכוֹן et formulation temporelle plus générale pour מֵאָז, sans confondre l’ancienneté du trône avec l’éternité de Dieu.
lexical_decisions:
- source_word: נָכוֹן
  choice: est solidement établi
  rationale: La forme exprime l’état ferme et stable du trône. « Est solidement établi » rend ce sens statif sans suggérer nécessairement un acte ponctuel d’établissement.
- source_word: כִּסְאֲךָ
  choice: ton trône
  rationale: כִּסֵּא désigne normalement le trône, et le suffixe de deuxième personne masculine singulière est rendu par « ton ».
- source_word: מֵאָז
  choice: depuis les temps anciens
  rationale: Dans ce contexte poétique, l’expression renvoie à une antiquité reculée plutôt qu’à un moment récent déterminé.
- source_word: מֵעוֹלָם
  choice: de toute éternité
  rationale: Appliqué à Dieu, עוֹלָם évoque ici une durée sans commencement perceptible. L’expression française est naturelle, digne et maintient la portée théologique du vers.
- source_word: אָתָּה
  choice: toi, tu es
  rationale: Le pronom indépendant est prédicatif avec l’expression temporelle qui précède. La reprise « toi, tu » marque l’insistance présente dans l’hébreu et donne une phrase française complète.
theological_decisions:
- issue: Le langage temporel concernant l’existence de Dieu
  choice: toi, tu es de toute éternité
  alternative: tu existes depuis toujours
  rationale: La formulation retenue affirme l’antériorité illimitée de Dieu sans ajouter de terminologie métaphysique étrangère au texte. Elle conserve aussi la tension poétique entre l’ancienneté du trône et l’éternité de Dieu.
translation_notes:
  register: Français international moderne, poétique et digne. « Solidement établi » exprime la stabilité du trône ; « de toute éternité » garde la solennité du parallélisme sans archaïsme excessif.
