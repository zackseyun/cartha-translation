id: PSA.93.1
reference: Psalms 93:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: fr
  text: Yahvé règne[a] ; il est revêtu de majesté. Yahvé s’est revêtu ; il s’est ceint de force. Oui, le monde est affermi ; il ne vacillera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahvé est devenu roi ». Le verbe hébreu peut évoquer l’accession à la royauté, mais il proclame probablement ici son règne présent.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française usuelle du nom divin, qui préserve le nom personnel du texte hébreu plutôt que de le remplacer par un titre.
- source_word: מָלָךְ
  choice: règne
  rationale: Dans ce psaume royal, le parfait hébreu proclame naturellement en français la royauté présente de Yahvé, sans imposer l’idée d’un commencement ponctuel.
- source_word: גֵּאוּת
  choice: majesté
  rationale: À propos de Yahvé, le terme exprime son élévation et sa grandeur royale, non un orgueil condamnable.
- source_word: לָבֵשׁ
  choice: est revêtu
  rationale: Cette formulation conserve l’image du vêtement et la répétition poétique du verbe.
- source_word: עֹז
  choice: force
  rationale: Équivalent direct et naturel qui convient à l’image royale et guerrière du verset.
- source_word: הִתְאַזָּר
  choice: il s’en est ceint
  rationale: Le verbe réfléchi décrit l’action de se ceindre ; le pronom « en » renvoie à la force mentionnée juste avant et conserve l’image sans lourdeur.
- source_word: אַף
  choice: Oui
  rationale: La particule introduit ici une affirmation emphatique reliant le règne de Yahvé à la stabilité du monde.
- source_word: תִּכּוֹן
  choice: est solidement établi
  rationale: Le niphal exprime le fait d’être fixé ou affermi ; « solidement » rend explicitement cette stabilité.
- source_word: תֵּבֵל
  choice: le monde
  rationale: Le terme désigne le monde ordonné et habité ; « le monde » est concis et naturel en français.
- source_word: בַּל תִּמּוֹט
  choice: il ne vacillera pas
  rationale: Cette formulation exprime la stabilité face à tout ébranlement tout en restant idiomatique et poétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin lui-même. La forme « Yahvé », bien établie en français, le préserve au lieu de lui substituer un titre.
- issue: Valeur aspectuelle de מָלָךְ
  choice: 'présent : « règne »'
  alternative: 'ingressif : « est devenu roi »'
  rationale: Le contexte proclame surtout la royauté actuelle de Yahvé. Une lecture ingressive reste grammaticalement possible et est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et poétique. Les parallélismes et les métaphores vestimentaires de l’hébreu sont conservés, avec une ponctuation qui facilite la lecture à voix haute.
