revisions:
- from: Plus puissant que le fracas des eaux immenses, plus puissant que les déferlantes de la mer[a], Yahvé[b] est puissant dans les hauteurs.
  to: Plus puissant que le grondement des grandes eaux, que les puissants flots de la mer, Yahvé est puissant dans les hauteurs.[a]
  rationale: La révision maintient la comparaison poétique et la répétition lexicale de « puissant », mais rattache explicitement la force des eaux aux « puissants flots de la mer », conformément à la syntaxe et au parallélisme hébreux. Elle remplace « eaux immenses » par l'idiome plus proche « grandes eaux » et supprime une note alternative qui ne constitue pas une option syntaxique suffisamment solide pour guider le lecteur.
