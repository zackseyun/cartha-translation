source:
  edition: WLC
  text: מִ/קֹּל֨וֹת מַ֤יִם רַבִּ֗ים אַדִּירִ֣ים מִשְׁבְּרֵי יָ֑ם אַדִּ֖יר בַּ/מָּר֣וֹם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: fr
  text: Plus puissant que le grondement des grandes eaux, que les puissants flots de la mer, Yahvé est puissant dans les hauteurs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: rendu du nom divin
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: plus puissant que le fracas
  rationale: La préposition מִן a ici une valeur comparative. קוֹל désigne le son ou la voix ; appliqué aux eaux, « fracas » restitue naturellement leur bruit imposant.
- source_word: מַיִם רַבִּים
  choice: des eaux immenses
  rationale: L’expression désigne des eaux vastes et puissantes. « Immenses » communique en français courant leur ampleur sans réduire רַבִּים à un simple dénombrement.
- source_word: אַדִּירִים
  choice: puissantes (exprimé par « plus puissant que les déferlantes »)
  rationale: L’adjectif évoque force, grandeur et majesté. La tournure comparative répétée en français intègre cette qualification et maintient le parallélisme poétique.
- source_word: מִשְׁבְּרֵי יָם
  choice: les déferlantes de la mer
  rationale: מִשְׁבָּר désigne les vagues qui se brisent avec force. « Déferlantes » est précis, naturel et conserve l’image dynamique.
- source_word: אַדִּיר
  choice: puissant
  rationale: Le terme affirme la supériorité souveraine de Yahvé. « Puissant » garde le lien lexical avec אַדִּירִים et convient à la comparaison avec la force des eaux.
- source_word: בַּמָּרוֹם
  choice: dans les hauteurs
  rationale: Cette expression préserve l’idée d’élévation et d’exaltation sans préciser davantage le lieu comme le ferait « au ciel ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: La traduction emploie la forme française courante du nom divin plutôt qu’un titre substitutif.
theological_decisions:
- issue: Valeur comparative des groupes introduits par מִן
  choice: Yahvé est présenté comme plus puissant que les eaux et les déferlantes.
  alternative: Lire d’abord une exclamation autonome sur la puissance des eaux, puis affirmer séparément que Yahvé est puissant dans les hauteurs.
  rationale: La répétition de מִן et le parallélisme poétique favorisent la comparaison, tout en laissant l’autre analyse signalée en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin ; « Yahvé » le représente directement en français, tandis que « le SEIGNEUR » relève de la tradition de substitution.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « plus puissant » rend explicite le parallélisme comparatif de l’hébreu ; « fracas » et « déferlantes » conservent l’intensité sonore et visuelle du verset.
