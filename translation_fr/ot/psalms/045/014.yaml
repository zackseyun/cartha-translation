  text: לִ/רְקָמוֹת֮ תּוּבַ֪ל לַ֫/מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶי/הָ רֵעוֹתֶ֑י/הָ מ֖וּבָא֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: fr
  text: Vêtue de broderies, elle est conduite vers le roi[a] ; derrière elle, des vierges, ses compagnes[b], te sont amenées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parée de broderies, elle est amenée au roi. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu désigne plus précisément des jeunes femmes non mariées, vierges.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, le pronom hébreu s’adresse à une femme au singulier : le discours semble donc se tourner directement vers la mariée. Certaines traductions lissent ce changement en rapportant la fin du vers au roi.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: Vêtue de broderies
  rationale: Le pluriel רְקָמוֹת désigne des ouvrages textiles brodés ou bigarrés. La formulation française explicite naturellement le vêtement sous-entendu par le contexte nuptial.
- source_word: תּוּבַל
  choice: elle est conduite
  rationale: Le hophal de יבל exprime le fait d’être menée ou amenée. « Est conduite » convient à la solennité d’un cortège tout en gardant la voix passive.
- source_word: לַמֶּלֶךְ
  choice: vers le roi
  rationale: La préposition ל marque ici le mouvement en direction du roi ; « vers » rend clairement cette progression.
- source_word: בְּתוּלוֹת
  choice: des vierges
  rationale: בְּתוּלוֹת désigne plus précisément des jeunes femmes non mariées, vierges, ici membres du cortège nuptial.
- source_word: אַחֲרֶיהָ
  choice: derrière elle
  rationale: Dans le cadre d’une procession, cette expression spatiale rend naturellement l’idée de celles qui viennent après la jeune femme.
- source_word: רֵעוֹתֶיהָ
  choice: ses compagnes
  rationale: Le terme désigne des compagnes ou amies sans préciser formellement leur fonction ; « compagnes » préserve cette sobriété.
- source_word: מוּבָאוֹת
  choice: sont amenées
  rationale: Le participe hophal féminin pluriel de בוא exprime l’action passive d’être amenées. Cette formulation évite de répéter « conduites » tout en conservant le mouvement cérémoniel.
- source_word: לָךְ
  choice: te
  rationale: Le suffixe est à la deuxième personne du féminin singulier. « Te sont amenées » conserve l’adresse directe à la mariée et le changement de personne du texte massorétique.
theological_decisions:
- issue: Changement de destinataire dans le pronom final לָךְ
  choice: 'Conserver la deuxième personne du féminin singulier : « te sont amenées »'
  alternative: Lisser le passage en « sont amenées au roi » ou « sont amenées avec elle »
  rationale: Le texte massorétique passe de la description de la mariée à une adresse directe qui lui est faite. Garder ce changement préserve la tension poétique sans corriger ni harmoniser le texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme suit le cortège nuptial, et l’ordre final place « te » avant le verbe afin de conserver sans lourdeur le brusque passage à l’adresse directe.
