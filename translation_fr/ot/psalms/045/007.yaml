  text: אָהַ֣בְתָּ צֶּדֶק֮ וַ/תִּשְׂנָ֫א רֶ֥שַׁע עַל כֵּ֤ן מְשָׁחֲ/ךָ֡ אֱלֹהִ֣ים אֱ֭לֹהֶי/ךָ שֶׁ֥מֶן שָׂשׂ֗וֹן מֵֽ/חֲבֵרֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: fr
  text: Tu as aimé la justice et haï la méchanceté ; c’est pourquoi Dieu, ton Dieu,[a] t’a oint d’une huile de joie, plus que tes compagnons.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « C’est pourquoi, ô Dieu, ton Dieu t’a oint d’une huile de joie, plus que tes compagnons. » Le premier mot traduit par « Dieu » peut être compris comme une apostrophe plutôt que comme le sujet du verbe.'
    reason: alternative_reading
  - marker: b
    text: Ce verset est cité en Hébreux 1.9.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Tu as aimé
  rationale: Le qal accompli à la deuxième personne du masculin singulier est rendu au passé composé, qui conserve l’aspect accompli tout en convenant à une qualité durable mise en avant dans l’adresse poétique.
- source_word: צֶּדֶק
  choice: la justice
  rationale: Le terme désigne ce qui est droit et juste. « Justice » exprime naturellement en français le caractère moral et royal du contraste avec la méchanceté.
- source_word: וַתִּשְׂנָא
  choice: et détesté
  rationale: La coordination avec le premier verbe est conservée. L’auxiliaire et le pronom ne sont pas répétés, conformément à l’usage naturel du français.
- source_word: רֶשַׁע
  choice: la méchanceté
  rationale: Le nom évoque le mal moral et la conduite coupable. « Méchanceté » maintient le contraste éthique avec « justice » sans réduire le terme à un acte isolé.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution rend clairement et naturellement la relation de conséquence introduite par l’expression hébraïque.
- source_word: מְשָׁחֲךָ
  choice: t’a oint
  rationale: Le verbe משׁח désigne l’action d’oindre, notamment dans un cadre royal ou de consécration. « Oindre » conserve cette image et sa portée sans l’expliciter au-delà du texte.
- source_word: אֱלֹהִים אֱלֹהֶיךָ
  choice: Dieu, ton Dieu
  rationale: Le premier אֱלֹהִים est compris dans le texte principal comme sujet du verbe, et אֱלֹהֶיךָ comme apposition qui le précise. L’autre analyse syntaxique est signalée en note.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: une huile de joie
  rationale: La construction associe l’huile à la joie ou à la célébration. « Huile de joie » reste claire, poétique et proche de l’image hébraïque.
- source_word: מֵחֲבֵרֶיךָ
  choice: plus que tes compagnons
  rationale: La préposition מִן marque ici la comparaison. « Plus que » rend sans ambiguïté le degré supérieur par rapport aux compagnons du destinataire.
theological_decisions:
- issue: Fonction syntaxique et portée théologique du premier אֱלֹהִים
  choice: 'Le premier אֱלֹהִים est pris comme sujet : « Dieu, ton Dieu, t’a oint »'
  alternative: 'Le prendre comme vocatif : « C’est pourquoi, ô Dieu, ton Dieu t’a oint »'
  rationale: Les deux analyses sont possibles dans la poésie hébraïque, notamment en lien avec le verset précédent. Le texte principal retient l’analyse qui s’insère le plus directement dans la proposition verbale, tandis que la note préserve l’autre lecture et la tension théologique qu’elle comporte.
translation_notes:
  register: Français international moderne, clair et digne, avec une syntaxe poétique sobre. Le terme traditionnel « oint » est maintenu parce qu’il exprime précisément l’image royale et cultuelle du verbe hébreu ; la variante syntaxique importante est conservée en note plutôt que tranchée implicitement.
