  text: וְ/יִתְאָ֣ו הַ/מֶּ֣לֶךְ יָפְיֵ֑/ךְ כִּי ה֥וּא אֲ֝דֹנַ֗יִ/ךְ וְ/הִשְׁתַּֽחֲוִי לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/011.yaml
  text: and the king will desire your beauty[a], for he is your lord[b]; bow down to him.
translation:
  language: fr
  text: Et le roi désirera ta beauté[a], car il est ton seigneur ; prosterne-toi devant lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La forme hébraïque peut aussi exprimer un souhait ou une exhortation : « que le roi désire ta beauté » ou « puisse le roi désirer ta beauté ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « rends-lui hommage ». Le verbe peut désigner le fait de se prosterner avec révérence devant un supérieur, dans un contexte royal ou religieux. Certains traduisent aussi « adore-le ».
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: Alors … désirera
  rationale: L’imparfait hébreu à valeur inaccomplie est rendu comme un futur simple, lecture qui convient naturellement à la suite poétique. La conjonction est exprimée par « Alors » pour assurer un enchaînement français fluide, sans surcharger le verset d’un « et » initial.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le nom défini est rendu directement.
- source_word: יָפְיֵךְ
  choice: ta beauté
  rationale: Le substantif avec suffixe féminin singulier désigne directement la beauté de la destinataire.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de l’énoncé ou de l’exhortation qui précède.
- source_word: הוּא
  choice: il
  rationale: Le pronom indépendant est conservé, conformément à son caractère explicite et emphatique en hébreu.
- source_word: אֲדֹנַיִךְ
  choice: ton seigneur
  rationale: Le terme אָדוֹן avec suffixe féminin singulier désigne le roi comme seigneur de la femme. La minuscule évite de l’identifier automatiquement au nom ou à un titre divin.
- source_word: וְהִשְׁתַּחֲוִי
  choice: prosterne-toi
  rationale: L’impératif exprime l’action de s’incliner profondément devant un supérieur. « Se prosterner » conserve le geste et son respect sans imposer une interprétation exclusivement cultuelle.
- source_word: לוֹ
  choice: devant lui
  rationale: Avec le verbe français « se prosterner », « devant lui » est la tournure idiomatique correspondant à la préposition hébraïque et à son suffixe masculin singulier.
theological_decisions:
- issue: 'La force modale de וְיִתְאָו : futur ou souhait/exhortation'
  choice: le roi désirera
  alternative: que le roi désire / puisse le roi désirer
  rationale: La forme peut être comprise comme une déclaration future, mais le contexte d’exhortations adressées à la mariée permet aussi une nuance volitive. Le texte principal retient le futur sans supprimer l’autre possibilité, signalée en note.
- issue: Le caractère royal ou religieux de וְהִשְׁתַּחֲוִי לוֹ
  choice: prosterne-toi devant lui
  alternative: rends-lui hommage / adore-le
  rationale: Le verbe peut désigner la prosternation devant Dieu ou devant un supérieur humain. Dans ce psaume royal et nuptial, une formulation gestuelle préserve cette tension sans imposer une lecture exclusivement religieuse ou purement protocolaire.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond aux formes féminines singulières de l’hébreu. « Seigneur » reste en minuscule, tandis que « prosterne-toi » conserve l’ambiguïté entre hommage royal et révérence religieuse.
