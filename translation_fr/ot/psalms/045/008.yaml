  text: מֹר וַ/אֲהָל֣וֹת קְ֭צִיעוֹת כָּל בִּגְדֹתֶ֑י/ךָ מִֽן הֵ֥יכְלֵי שֵׁ֝֗ן מִנִּ֥י שִׂמְּחֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/008.yaml
  text: All your garments are fragrant with myrrh[a], aloes, and cassia; from ivory palaces[e][d][c][b], stringed instruments have made you glad.
translation:
  language: fr
  text: Tous tes vêtements exhalent la myrrhe, l’aloès[b] et la casse. Des palais d’ivoire, on t’a réjoui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu ne précise pas qui ou ce qui réjouit le roi. On a notamment proposé la musique, des musiciens ou, selon une interprétation traditionnelle, des instruments à cordes. La tournure peut aussi se comprendre : « sortant des palais d’ivoire, ils t’ont réjoui » ou « à cause des palais d’ivoire, ils t’ont réjoui ».'
    reason: alternative_reading
  - marker: b
    text: Il s’agit ici d’un bois odorant, probablement le bois d’agar, et non de la plante succulente aujourd’hui appelée aloès.
    reason: lexical_clarification
lexical_decisions:
- source_word: מֹר
  choice: myrrhe
  rationale: Nom français courant et traditionnel de cette résine aromatique.
- source_word: וַאֲהָלוֹת
  choice: l’aloès
  rationale: Équivalent biblique établi pour un bois odorant employé comme parfum, et non pour la plante succulente moderne; une note précise ce sens.
- source_word: קְצִיעוֹת
  choice: la casse
  rationale: Désigne la casse aromatique, une écorce parfumée apparentée à la cannelle.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: Tous tes vêtements exhalent
  rationale: La proposition hébraïque est sans verbe et juxtapose les aromates aux vêtements. « Exhalent » exprime naturellement en français que les vêtements sont imprégnés de ces parfums sans laisser entendre qu’ils sont faits d’aromates.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: Depuis des palais d’ivoire
  rationale: Dans le cadre royal du psaume, הֵיכָל désigne naturellement un palais ou une grande demeure; שֵׁן, littéralement « dent », désigne ici l’ivoire.
- source_word: מִנִּי
  choice: depuis
  rationale: Le sens précis de la préposition est difficile. La traduction la rattache au lieu d’où vient la réjouissance, sans surcharger le texte.
- source_word: שִׂמְּחוּךָ
  choice: on te réjouit
  rationale: Le piel parfait signifie « ils t’ont réjoui / rendu joyeux ». L’emploi français de « on » évite d’inventer un sujet précis là où l’hébreu n’en nomme aucun.
theological_decisions:
- issue: Cadre royal et éventuelle lecture messianique du Psaume 45
  choice: Traduire le décor immédiat d’une célébration royale sans ajouter de désignation messianique.
  alternative: Formuler le verset en fonction d’une lecture messianique ou typologique ultérieure.
  rationale: Le verset décrit directement les parfums, le luxe palatial et la joie d’un personnage royal. Une lecture canonique ultérieure ne doit pas être introduite dans les mots lorsque l’hébreu ne l’explicite pas.
- issue: Sujet non exprimé de שִׂמְּחוּךָ
  choice: Employer l’indéfini « on » et signaler l’ambiguïté en note.
  alternative: Introduire « des instruments à cordes », « la musique » ou « des musiciens » dans le texte principal.
  rationale: La forme verbale porte un sujet pluriel, mais aucun nom correspondant n’est exprimé. Le traduire par un sujet déterminé résoudrait indûment une difficulté réelle du texte.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. « Exhalent » conserve la dignité du chant sans archaïsme. L’indéfini « on » est volontairement employé pour préserver l’absence de sujet explicite dans l’hébreu; la note expose les principales possibilités sans en imposer une.
