source:
  edition: WLC
  text: רָ֘חַ֤שׁ לִבִּ֨/י דָּ֘בָ֤ר ט֗וֹב אֹמֵ֣ר אָ֭נִי מַעֲשַׂ֣/י לְ/מֶ֑לֶךְ לְ֝שׁוֹנִ֗/י עֵ֤ט סוֹפֵ֬ר מָהִֽיר׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/001.yaml
  text: My heart overflows with a good word[a]; I say[c][b], “My work is for the king.” My tongue is the pen of a skillful scribe.
translation:
  language: fr
  text: 'Mon cœur bouillonne d’une belle parole[a] ; je dis : « Mon œuvre est pour le roi[b]. » Ma langue est la plume d’un scribe habile[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un thème agréable » ou « d’un noble sujet ». L’expression hébraïque peut désigner soit les paroles elles-mêmes, soit le sujet exprimé.
    reason: lexical_alternative
  - marker: b
    text: Ou « au sujet du roi » ou « au roi ». La préposition peut indiquer la dédicace, le sujet ou le destinataire.
    reason: lexical_alternative
  - marker: c
    text: Ou « d’un scribe prompt » ou « d’un scribe rapide ». L’adjectif hébreu peut évoquer la rapidité ou l’aisance d’un scribe exercé, aussi bien que son habileté.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָחַשׁ
  choice: déborde
  rationale: Le verbe évoque ce qui s’agite intérieurement ou jaillit en bouillonnant. « Déborde » restitue naturellement l’image de paroles qui montent du cœur.
- source_word: לִבִּי
  choice: mon cœur
  rationale: Le terme désigne ici le siège de la pensée et de l’émotion ; l’image hébraïque reste claire en français.
- source_word: דָּבָר טוֹב
  choice: de belles paroles
  rationale: דָּבָר peut désigner une parole aussi bien qu’un sujet ou une chose. Dans ce contexte poétique, le pluriel français est idiomatique, tandis que la note conserve l’ambiguïté entre les mots prononcés et le thème traité.
- source_word: אֹמֵר אֲנִי
  choice: je dis
  rationale: Traduction simple qui n’impose pas l’idée plus précise de récitation ou de déclamation.
- source_word: מַעֲשַׂי
  choice: mon œuvre
  rationale: Dans ce cadre littéraire, le mot peut désigner ce que le poète a produit. « Œuvre » garde une certaine largeur de sens tout en convenant à une composition poétique.
- source_word: לְמֶלֶךְ
  choice: pour le roi
  rationale: La préposition לְ peut marquer la destination, le rapport ou l’adresse. « Pour le roi » exprime naturellement la dédicace possible sans exclure les autres lectures, indiquées en note.
- source_word: לְשׁוֹנִי
  choice: ma langue
  rationale: La métaphore corporelle du texte hébreu est poétique et immédiatement compréhensible en français.
- source_word: עֵט
  choice: plume
  rationale: « Plume » est le terme français traditionnel et naturel dans la métaphore de l’écriture, sans recourir au mot historiquement plus technique « stylet ».
- source_word: סוֹפֵר
  choice: scribe
  rationale: Le mot conserve le cadre ancien et le sens d’un professionnel exercé dans l’écriture.
- source_word: מָהִיר
  choice: habile
  rationale: L’adjectif peut souligner la rapidité, la disponibilité ou l’aisance acquise. « Habile » exprime bien la maîtrise fluide du scribe, tandis que les autres nuances sont conservées en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La structure en trois propositions et les métaphores du cœur, de la langue et de la plume sont conservées. « Belles paroles » évite la raideur de « une bonne parole », tandis que la note signale le singulier et l’étendue sémantique de l’hébreu.
