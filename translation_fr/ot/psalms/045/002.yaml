  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: fr
  text: Tu es plus beau que les fils des hommes[a] ; la grâce est répandue sur tes lèvres[b] ; c’est pourquoi Dieu t’a béni pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Expression poétique désignant les autres êtres humains ; on pourrait aussi traduire : « le plus beau des hommes ».'
    reason: cultural_note
  - marker: b
    text: Le mot hébreu peut aussi signifier « faveur », « charme » ou « bienveillance » ; ici, il évoque notamment le caractère gracieux des paroles.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: Tu es plus beau
  rationale: La forme poétique intensive de יפה exprime une beauté remarquable ou supérieure. « Plus beau » conserve la comparaison introduite par מִן et convient au destinataire masculin.
- source_word: מִבְּנֵי אָדָם
  choice: que les fils des hommes
  rationale: L’expression signifie littéralement « que les fils de l’homme/des humains ». Le tour poétique masculin est conservé puisque le psaume s’adresse à un roi, tout en étant expliqué en note.
- source_word: הוּצַק
  choice: est répandue
  rationale: Le passif de יצק garde l’image de quelque chose versé avec abondance. « Est répandue » est naturel en français poétique et n’explicite pas davantage l’aspect accompli.
- source_word: חֵן
  choice: la grâce
  rationale: חֵן peut désigner la grâce, la faveur, le charme ou le caractère gracieux. En rapport avec les lèvres, « grâce » préserve à la fois l’élégance et la bienveillance de la parole.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: sur tes lèvres
  rationale: « Sur tes lèvres » rend naturellement en français l’image de la grâce répandue, même si la préposition hébraïque ב peut aussi être comprise comme « dans » ou « avec ».
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Ce connecteur exprime une conséquence ou un motif. « C’est pourquoi » est clair, soutenu sans être archaïque, et conserve le lien logique du vers.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: Dieu t’a béni
  rationale: 'Le parfait avec suffixe de deuxième personne se lit naturellement avec אֱלֹהִים comme sujet : « Dieu t’a béni ». Le passé composé exprime en français l’acte accompli et son effet durable.'
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Cette expression rend clairement la durée indéfinie et durable de לְעוֹלָם dans un registre moderne et digne.
theological_decisions:
- issue: Fonction syntaxique de אֱלֹהִים dans la dernière proposition
  choice: 'אֱלֹהִים est le sujet : « Dieu t’a béni pour toujours »'
  alternative: 'Lire אֱלֹהִים comme un vocatif : « ô Dieu », avec un sujet implicite ou une formulation influencée par le verset suivant'
  rationale: Dans ce vers pris en lui-même, la syntaxe la plus directe fait de אֱלֹהִים le sujet de בֵּרַכְךָ. Cette traduction n’ajoute pas les mots du verset suivant et ne force aucune interprétation christologique, tout en laissant au psaume sa portée théologique propre.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe au roi et à l’usage habituel des psaumes. La structure en trois propositions séparées par des points-virgules reproduit le mouvement du vers hébreu sans raideur excessive.
