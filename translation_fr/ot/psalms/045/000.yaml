base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/000.yaml
  text: 'For the choirmaster: according to “Lilies.” Of the sons of Korah[a]. A Maskil[c][b]. A song of loves.'
translation:
  language: fr
  text: Au chef de chœur. Sur « Les Lis »[a]. Des fils de Coré. Maskil[b]. Chant des amours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu shoshannim, littéralement « les lis »; il s’agit probablement du nom d’un air ou d’une indication musicale.
    reason: lexical_alternative
  - marker: b
    text: Maskil est un terme technique employé dans les titres de certains psaumes; il peut désigner une composition méditative ou didactique.
    reason: lexical_alternative
  - marker: c
    text: Ou « chant d’amour ». L’hébreu dit littéralement « chant des amours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale; cette formulation française est naturelle et garde la fonction liturgique.
- source_word: עַל שֹׁשַׁנִּים
  choice: Sur « Les Lis »
  rationale: עַל introduit ici vraisemblablement un air, un mode d’exécution ou un accompagnement. « Les Lis » traduit le sens lexical tout en signalant par les guillemets qu’il s’agit probablement d’un titre technique.
- source_word: לִבְנֵי קֹרַח
  choice: Des fils de Coré
  rationale: La préposition ל peut indiquer l’appartenance, l’attribution, la destination ou l’auteur; « Des fils de Coré » conserve cette relative indétermination.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le sens précis de ce terme technique des titres de psaumes demeure incertain; la translittération évite de trancher entre composition méditative et didactique.
- source_word: שִׁיר יְדִידֹת
  choice: Chant des amours
  rationale: Cette traduction garde le pluriel inhabituel de יְדִידֹת et sa coloration poétique, sans réduire d’emblée l’expression à « chant d’amour ».
