id: PSA.45.16
reference: Psalms 45:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: fr
  text: Tes fils prendront la place de tes pères ; tu les établiras princes sur toute la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tout le pays ». Le mot hébreu אֶרֶץ peut désigner soit la terre, soit un pays ou territoire, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: prendront la place de
  rationale: Dans ce contexte, תַּחַת exprime la succession dynastique plutôt qu’une position spatiale. Cette tournure est naturelle en français et conserve l’idée de remplacement.
- source_word: אֲבֹתֶיךָ
  choice: tes pères
  rationale: Le terme signifie littéralement « tes pères ». Ce choix préserve le vocabulaire familial et la portée dynastique, tandis que « ancêtres » expliciterait davantage.
- source_word: יִהְיוּ בָנֶיךָ
  choice: tes fils prendront
  rationale: Le verbe הָיָה signifie ici « être », mais, combiné à תַּחַת, le français idiomatique exprime la succession par « prendre la place de ». « Fils » maintient le masculin pluriel et le contexte des héritiers royaux.
- source_word: תְּשִׁיתֵמוֹ
  choice: tu les établiras
  rationale: Le verbe שׁית signifie « placer, mettre ». Avec un titre de gouvernement, « établir » rend naturellement l’acte d’installer dans une fonction sans surinterprétation.
- source_word: לְשָׂרִים
  choice: princes
  rationale: שָׂרִים peut désigner des princes, chefs ou dirigeants. « Princes » convient au cadre royal et garde le registre élevé du psaume.
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un territoire. La portée royale expansive du psaume favorise « toute la terre », tout en laissant « tout le pays » comme possibilité signalée en note.
theological_decisions:
- issue: Portée de הָאָרֶץ dans le contexte royal, éventuellement lu comme messianique
  choice: toute la terre
  alternative: tout le pays
  rationale: L’hébreu permet les deux lectures. La formulation universelle s’accorde avec l’ampleur du langage royal du psaume sans imposer une interprétation doctrinale ultérieure ; l’autre possibilité est conservée en note.
translation_notes:
  register: Français moderne, clair et digne. La première proposition adopte une formulation idiomatique qui restitue la succession dynastique ; la seconde conserve le registre royal. Le tutoiement correspond aux formes hébraïques singulières adressées au roi.
