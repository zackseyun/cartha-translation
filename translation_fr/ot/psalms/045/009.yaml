  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: fr
  text: Des filles de rois sont parmi tes femmes honorées[a] ; à ta droite se tient la reine, parée de l’or d’Ophir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi tes êtres précieux », « parmi tes nobles dames » ou « au milieu de tes splendeurs » ; l’expression hébraïque est difficile.
    reason: lexical_alternative
  - marker: b
    text: L’« or d’Ophir » désigne un or fin associé à Ophir, un lieu renommé dans l’Ancien Testament pour sa richesse et son or.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: Des filles de rois
  rationale: Rend directement le groupe construit hébreu et conserve l’image de la cour royale ; « des princesses » serait plus idiomatique, mais moins transparent.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: parmi tes femmes honorées
  rationale: L’expression est difficile. Le contexte des femmes de rang royal favorise une référence personnelle à des femmes distinguées, tout en laissant les autres possibilités en note.
- source_word: נִצְּבָה
  choice: se tient
  rationale: Le niphal décrit ici la position occupée dans la scène de cour ; le présent français convient au tableau poétique.
- source_word: שֵׁגַל
  choice: la reine
  rationale: Le nom désigne la reine ou épouse royale. « La reine » est naturel, actuel et suffisamment précis dans ce contexte.
- source_word: לִימִינְךָ
  choice: à ta droite
  rationale: Expression française naturelle qui conserve la place d’honneur indiquée par l’hébreu.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: parée de l’or d’Ophir
  rationale: כֶּתֶם désigne un or fin ; la préposition évoque ici vraisemblablement la parure. « Parée de » explicite légèrement l’image sans préciser la forme des bijoux ou du vêtement.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement conserve l’adresse royale au singulier. La syntaxe reste proche de l’hébreu, tandis que « parée de » rend naturelle en français l’image de la reine ornée d’or.
