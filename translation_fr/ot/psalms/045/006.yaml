base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: fr
  text: Ton trône, ô Dieu, subsiste pour toujours et à jamais[a] ; le sceptre de ton royaume est un sceptre de droiture[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ton trône est Dieu pour toujours et à jamais », ou : « Ton trône divin subsiste pour toujours et à jamais. » La syntaxe hébraïque est discutée ; le texte principal suit la lecture vocative.'
    reason: alternative_reading
  - marker: b
    text: 'Ou, en conservant l’ordre des mots hébreux : « un sceptre de droiture est le sceptre de ton royaume ».'
    reason: alternative_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: ton trône
  rationale: כִּסֵּא désigne ici le trône, siège de l’autorité royale ; « trône » est le terme français naturel et précis dans ce psaume royal.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le texte principal retient la lecture vocative, syntaxiquement naturelle dans cette adresse directe, tout en signalant en note les autres analyses sérieusement proposées.
- source_word: עוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: Cette formule rend le redoublement emphatique exprimant une durée sans fin et conserve la solennité poétique de l’hébreu.
- source_word: שֵׁבֶט
  choice: sceptre
  rationale: Dans ce contexte royal, שֵׁבֶט désigne l’insigne du pouvoir souverain plutôt qu’un bâton ordinaire.
- source_word: מִישֹׁר
  choice: droiture
  rationale: מִישֹׁר évoque ce qui est droit au sens moral, avec une nuance possible d’équité ; « droiture » préserve cette portée sans la limiter au domaine judiciaire.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: le sceptre de ton royaume
  rationale: Cette formulation conserve le rapport construit entre le sceptre et la royauté, tout en restant naturelle en français.
theological_decisions:
- issue: Valeur syntaxique et théologique de אֱלֹהִים dans le premier membre
  choice: 'Vocatif : « Ton trône, ô Dieu, subsiste pour toujours et à jamais »'
  alternative: « Ton trône est Dieu pour toujours et à jamais » ou « Ton trône divin subsiste pour toujours et à jamais »
  rationale: La lecture vocative est la plus directe dans le contexte d’une adresse et correspond à une réception ancienne importante. Puisque la syntaxe hébraïque fait néanmoins l’objet d’un débat réel, les autres lectures sont conservées en note plutôt que supprimées.
- issue: Identification du sujet dans la seconde proposition nominale
  choice: « le sceptre de ton royaume est un sceptre de droiture »
  alternative: « un sceptre de droiture est le sceptre de ton royaume »
  rationale: Le groupe défini שֵׁבֶט מַלְכוּתֶךָ est naturellement compris comme sujet, tandis que שֵׁבֶט מִישֹׁר fonctionne comme prédicat ; l’ordre français choisi clarifie cette structure sans changer le sens.
translation_notes:
  register: Français international moderne, digne et poétique. Le vocatif « ô Dieu » conserve la solennité de l’adresse sans archaïsme excessif. « Subsiste » fournit un verbe naturel à la proposition nominale hébraïque, tandis que les notes préservent ses ambiguïtés authentiques.
