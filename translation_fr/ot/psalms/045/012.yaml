id: PSA.45.12
reference: Psalms 45:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בַֽת צֹ֨ר בְּ֭/מִנְחָה פָּנַ֥יִ/ךְ יְחַלּ֗וּ עֲשִׁ֣ירֵי עָֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/012.yaml
  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: fr
  text: Et la fille de Tyr, avec un présent[a], et les riches du peuple rechercheront ta faveur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande » ou « un tribut ». Le mot hébreu מִנְחָה peut désigner un présent, un tribut ou une offrande selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ton visage ». Cette expression hébraïque signifie implorer quelqu’un ou rechercher sa faveur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: Et la fille de Tyr
  rationale: La conjonction וּ poursuit la description. L’expression « fille de Tyr » personnifie naturellement la ville ou sa population, sans expliciter davantage le référent.
- source_word: בְּמִנְחָה
  choice: avec un présent
  rationale: מִנְחָה peut désigner un don, un tribut ou une offrande. Dans ce cadre royal, « présent » convient à un don diplomatique tout en évitant une coloration exclusivement cultuelle.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: rechercheront ta faveur
  rationale: Littéralement, la construction évoque le fait d’implorer ou d’adoucir « ton visage ». « Rechercher ta faveur » rend clairement l’idiome et conserve le féminin singulier de la destinataire.
- source_word: עֲשִׁירֵי עָם
  choice: les riches du peuple
  rationale: Le groupe construit désigne les personnes riches ou influentes d’un peuple. La formulation française reste concise et ne précise pas une identité collective que l’hébreu laisse indéterminée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Présent » convient au contexte royal sans imposer une lecture cultuelle ; « rechercheront ta faveur » traduit naturellement l’idiome hébreu. Les marqueurs de notes suivent l’élément précis qu’ils expliquent.
