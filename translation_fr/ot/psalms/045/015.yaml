source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: fr
  text: Elles seront conduites dans la joie et l’allégresse[a] ; elles entreront dans le palais[b] du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Elles seront amenées avec joie et exultation. »'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut signifier « palais », « grande salle » ou, dans d’autres contextes, « temple » ; ici, « palais » convient le mieux au cadre d’un mariage royal.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: elles seront conduites
  rationale: Le hophal imparfait, 3e personne du féminin pluriel, de יבל exprime l’action passive d’être conduit ou amené. « Conduites » conserve la nuance de procession suggérée par le contexte nuptial.
- source_word: בִּשְׂמָחֹת
  choice: dans la joie
  rationale: La préposition ב avec le pluriel de שׂמחה indique ici la manière ou l’accompagnement. Le singulier collectif « dans la joie » est naturel en français et rend l’atmosphère festive sans reproduire mécaniquement le pluriel hébreu.
- source_word: וָגִיל
  choice: et l’allégresse
  rationale: גיל désigne une joie vive, exultante. « Allégresse » distingue ce terme du précédent tout en conservant le parallélisme célébratif.
- source_word: תְּבֹאֶינָה
  choice: elles entreront
  rationale: Dans le contexte d’un déplacement vers l’intérieur d’un édifice, le qal imparfait féminin pluriel de בוא signifie naturellement « entrer ».
- source_word: בְּהֵיכַל
  choice: dans le palais
  rationale: היכל peut désigner un palais, une grande salle ou un temple. Le cadre immédiat d’un mariage royal favorise ici « palais ».
- source_word: מֶלֶךְ
  choice: du roi
  rationale: Bien que le nom hébreu soit sans article, la construction et le contexte renvoient au roi précis célébré dans le psaume ; « du roi » est donc idiomatique en français.
theological_decisions:
- issue: Référent des verbes au féminin pluriel
  choice: Le pronom « elles » laisse le référent implicite, conformément à l’hébreu, tout en s’accordant avec les femmes du cortège nuptial mentionnées dans le contexte.
  alternative: Préciser « les jeunes filles » ou « les compagnes de la mariée ».
  rationale: Le verset prolonge l’image de la procession nuptiale, mais ne nomme pas lui-même le sujet. La traduction évite donc de préciser davantage que la grammaire et le contexte immédiat.
- issue: Sens de הֵיכָל
  choice: palais
  alternative: temple ou grande salle
  rationale: Le sens royal et nuptial du psaume rend « palais » le plus probable, sans nier l’étendue sémantique du terme hébreu, signalée en note.
translation_notes:
  register: Français international moderne, digne et fluide. « Allégresse » reste courant dans un registre soutenu accessible et permet de distinguer les deux termes hébreux exprimant la joie. Le féminin pluriel explicite la forme verbale sans identifier excessivement les participantes.
