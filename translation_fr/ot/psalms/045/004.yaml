  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: fr
  text: Dans ta majesté, chevauche en vainqueur pour la cause de la vérité, de l’humilité et de la justice[a] ; ta main droite t’enseignera des exploits redoutables[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour la cause de la vérité et d’une justice humble ». L’expression hébraïque est condensée ; les termes rendus par « humilité » et « justice » peuvent aussi être compris comme étroitement liés.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ta main droite te montrera des choses redoutables ». Dans le contexte des impératifs précédents, le verbe peut aussi être compris comme une exhortation : « que ta main droite t’enseigne ».'
    reason: lexical_and_modal_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: Dans ta majesté
  rationale: הָדָר désigne la majesté, la splendeur ou la dignité. La préposition « dans » rend naturellement en français la manière majestueuse dont le roi s’avance, tandis que le ו initial sert de liaison poétique.
- source_word: צְלַח רְכַב
  choice: chevauche en vainqueur
  rationale: צְלַח exprime ici la réussite ou l’avance victorieuse, et רְכַב commande de chevaucher. La formulation française unit naturellement les deux impératifs sans perdre l’image royale et guerrière.
- source_word: עַל דְּבַר אֱמֶת
  choice: pour la cause de la vérité
  rationale: דָּבָר peut désigner une parole, une affaire ou une cause. Avec עַל dans ce contexte royal, l’expression évoque une action menée en faveur de la vérité.
- source_word: וְעַנְוָה צֶדֶק
  choice: de l’humilité et de la justice
  rationale: עַנְוָה désigne l’humilité ou la douceur, et צֶדֶק la justice ou la droiture. La coordination explicite respecte les deux notions, tandis qu’une note conserve l’ambiguïté de leur relation syntaxique très condensée.
- source_word: וְתוֹרְךָ
  choice: que … t’enseigne
  rationale: La forme hiphil de ירה signifie « enseigner », « instruire » ou « montrer ». Le tour français au subjonctif s’accorde avec la série d’exhortations, sans exclure la lecture prédictive signalée en note.
- source_word: נוֹרָאוֹת
  choice: des exploits redoutables
  rationale: Le terme désigne des réalités qui inspirent crainte et respect. « Exploits redoutables » convient au contexte guerrier et évite le sens moderne négatif de « choses terribles ».
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: L’image concrète de la main droite, symbole de force et d’adresse victorieuse, est conservée littéralement.
theological_decisions:
- issue: Imagerie du roi guerrier et lecture messianique ultérieure
  choice: Conserver l’adresse immédiate au roi et son imagerie guerrière sans expliciter un référent messianique dans le verset.
  alternative: Introduire dans la traduction une identification messianique directe.
  rationale: Le texte hébreu s’adresse poétiquement au roi. Cette traduction respecte ce cadre littéraire tout en laissant ouverte son interprétation canonique ultérieure.
- issue: Relation syntaxique entre עַנְוָה et צֶדֶק
  choice: 'Traduire les deux termes comme une série coordonnée : « l’humilité et la justice ».'
  alternative: « l’humble justice » ou « l’humilité de la justice ».
  rationale: L’hébreu est très condensé et permet plusieurs relations entre les deux substantifs. La coordination évite de transformer en qualification certaine ce qui reste ambigu, et l’autre possibilité est conservée en note.
- issue: Valeur modale de וְתוֹרְךָ
  choice: Employer l’exhortation « que ta main droite t’enseigne ».
  alternative: « ta main droite t’enseignera » ou « te montrera ».
  rationale: Dans la suite des impératifs, une valeur exhortative est naturelle, mais la morphologie peut aussi être comprise comme une annonce. La note préserve cette possibilité.
translation_notes:
  register: Français international actuel, poétique et digne. « Chevauche en vainqueur » conserve l’élan royal sans archaïsme excessif ; « exploits redoutables » rend l’idée d’actes inspirant à la fois crainte et admiration.
