id: PSA.45.17
reference: Psalms 45:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַזְכִּ֣ירָה שִׁ֭מְ/ךָ בְּ/כָל דֹּ֣ר וָ/דֹ֑ר עַל כֵּ֥ן עַמִּ֥ים יְ֝הוֹדֻ֗/ךָ לְ/עֹלָ֥ם וָ/עֶֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/017.yaml
  text: I will cause your name to be remembered in every generation[b][a]; therefore the peoples will praise you forever and ever.
translation:
  language: fr
  text: Je perpétuerai le souvenir de ton nom à chaque génération[a] ; c’est pourquoi les peuples te loueront[b] pour toujours et à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je mentionnerai ton nom » ou « Je ferai que l’on se souvienne de ton nom ». Le verbe hébreu est à une forme causative et suggère une commémoration active.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « te rendront grâce ». Le verbe hébreu peut exprimer la louange ou l’action de grâce, notamment dans le culte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Je perpétuerai le souvenir de
  rationale: 'La forme causative de זכר exprime ici une commémoration active : le locuteur fera en sorte que le nom demeure dans la mémoire collective. Cette formulation française en restitue naturellement la force sans la réduire à un souvenir privé.'
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Traduction directe de « ton nom », qui peut englober ici l’identité, la renommée et la mémoire attachées à la personne.
- source_word: בְּכָל דֹּר וָדֹר
  choice: à chaque génération
  rationale: Littéralement « dans toute génération et génération » ; l’expression hébraïque distribue l’action sur la succession entière des générations.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Cette locution marque naturellement en français la conséquence annoncée par le texte hébreu.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel hébreu désigne plusieurs peuples ; « les peuples » conserve cette portée collective sans imposer « les nations ».
- source_word: יְהוֹדֻךָ
  choice: te loueront
  rationale: Dans les Psaumes, le hiphil de ידה exprime couramment la louange, tout en pouvant aussi comporter la nuance d’action de grâce.
- source_word: לְעוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: La formule redoublée intensifie l’idée de durée perpétuelle ; cette expression française en conserve l’emphase poétique.
theological_decisions:
- issue: Référent des pronoms de deuxième personne dans ce psaume royal nuptial
  choice: Conserver l’adresse directe « ton/te » sans préciser davantage le référent
  alternative: Comprendre l’adresse comme visant le roi davidique ou, dans une lecture typologique et messianique, le Messie
  rationale: Le verset s’adresse directement à une personne et annonce une louange durable, mais il ne tranche pas lui-même entre les différents niveaux de lecture. La traduction préserve donc cette ouverture théologique.
translation_notes:
  register: Français international moderne, poétique et digne. « Je perpétuerai le souvenir » rend la valeur causative dans une tournure naturelle ; « à chaque génération » reste clair pour un large lectorat. Le tutoiement conserve l’adresse poétique directe du texte hébreu.
