  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: fr
  text: La fille du roi est toute resplendissante au-dedans[a] ; son vêtement est orné d’un ouvrage d’or[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La fille du roi est toute resplendissante à l’intérieur. » « Au-dedans » peut évoquer sa beauté intérieure ou indiquer qu’elle se trouve à l’intérieur du palais ou d’une chambre.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « son vêtement est tissé d’or », « orné de broderies d’or » ou « garni de sertissures d’or ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: toute resplendissante
  rationale: כָּל intensifie ici כְּבוּדָּה, qui exprime la gloire ou la splendeur. « Toute resplendissante » rend naturellement cette intensité dans le cadre nuptial et royal.
- source_word: בַת מֶלֶךְ
  choice: la fille du roi
  rationale: Cette formulation conserve l’expression hébraïque et son cadre de cour, sans la réduire au titre interprétatif « princesse ».
- source_word: פְּנִימָה
  choice: au-dedans
  rationale: L’adverbe peut désigner l’intérieur d’un lieu, probablement le palais ou une chambre, mais peut aussi être compris comme une référence à l’intériorité. « Au-dedans » maintient cette ambiguïté.
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: fait de broderies d’or
  rationale: מִשְׁבְּצוֹת désigne un travail ouvragé, possiblement brodé, tissé, quadrillé ou serti. Dans le contexte d’un vêtement, « broderies d’or » est naturel sans exclure les autres nuances, signalées en note.
- source_word: לְבוּשָׁהּ
  choice: son vêtement
  rationale: Le terme désigne ce qu’elle porte. Le singulier français « vêtement » correspond à la forme hébraïque et convient au contexte cérémoniel.
