reference: Psalms 45:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חִצֶּ֗י/ךָ שְׁנ֫וּנִ֥ים עַ֭מִּים תַּחְתֶּ֣י/ךָ יִפְּל֑וּ בְּ֝/לֵ֗ב אוֹיְבֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/005.yaml
  text: Your arrows are sharp[a]; peoples fall beneath you; they are in the heart of the king’s enemies.
translation:
  language: fr
  text: Tes flèches sont acérées[a] ; des peuples tombent sous toi ; elles atteignent le cœur des ennemis du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Tes flèches sont acérées — des peuples tombent sous toi — dans le cœur des ennemis du roi. » L’hébreu est très condensé et poétique.'
    reason: La syntaxe hébraïque laisse implicite le lien verbal entre les flèches et le cœur des ennemis ; la note préserve cette formulation et son ambiguïté.
lexical_decisions:
- source_word: חִצֶּיךָ
  choice: tes flèches
  rationale: Le pluriel de חֵץ avec suffixe de deuxième personne masculine du singulier signifie directement « tes flèches » ; c’est l’équivalent français courant et naturel.
- source_word: שְׁנוּנִים
  choice: sont acérées
  rationale: Cette forme adjectivale ou participiale évoque des flèches aiguisées, donc tranchantes ou pénétrantes. « Acérées » convient au registre poétique et martial.
- source_word: עַמִּים
  choice: des peuples
  rationale: Le pluriel de עַם désigne ici plusieurs peuples ou groupes humains. « Des peuples » conserve cette pluralité sans imposer la notion politique moderne de nations.
- source_word: תַּחְתֶּיךָ
  choice: sous toi
  rationale: La préposition signifie littéralement « sous » ou « au-dessous de », avec un suffixe de deuxième personne. Cette formulation conserve l’image de soumission et de défaite, malgré son caractère poétique inhabituel en français.
- source_word: יִפְּלוּ
  choice: tombent
  rationale: L’imparfait hébreu peut exprimer ici une action à venir ou une scène présentée avec vivacité. Le présent français rend bien l’immédiateté poétique.
- source_word: בְּלֵב
  choice: atteignent le cœur
  rationale: L’hébreu dit littéralement « dans le cœur », sans répéter de verbe. « Atteignent le cœur » explicite avec retenue le rapport elliptique entre les flèches et le cœur, tout en signalant dans la note la syntaxe littérale.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: des ennemis du roi
  rationale: La chaîne construite signifie littéralement « les ennemis du roi ». Le maintien de « du roi » évite d’harmoniser le texte avec la deuxième personne.
theological_decisions:
- issue: Identité du « roi » dans un psaume royal susceptible d’une lecture messianique
  choice: Conserver simplement « le roi » dans la traduction.
  alternative: Identifier explicitement le roi au Messie ou remplacer l’expression par « tes ennemis ».
  rationale: L’hébreu dit « le roi ». La traduction préserve le sens historique et poétique immédiat ainsi que l’ouverture à une lecture messianique, sans imposer cette interprétation dans le verset.
translation_notes:
  register: Français international moderne, digne et poétique. Le texte principal explicite minimalement la dernière proposition pour rester intelligible, tandis que la note donne la construction hébraïque très condensée. Le point-virgule maintient le rythme en trois segments du vers hébreu.
