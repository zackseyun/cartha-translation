id: PSA.45.10
reference: Psalms 45:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְעִי בַ֣ת וּ֭/רְאִי וְ/הַטִּ֣י אָזְנֵ֑/ךְ וְ/שִׁכְחִ֥י עַ֝מֵּ֗/ךְ וּ/בֵ֥ית אָבִֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/010.yaml
  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: fr
  text: Écoute[a], fille, et regarde ; tends l’oreille, et oublie ton peuple et la maison de ton père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Entends, fille, et vois. »'
    reason: Alternative lexicale permettant de rendre plus formellement שׁמע et ראה, au prix d’une expression française moins naturelle dans ce contexte.
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Écoute
  rationale: Impératif féminin singulier de שׁמע. « Écoute » exprime naturellement en français moderne une audition attentive, tout en laissant « Entends » comme possibilité lexicale.
- source_word: בַת
  choice: fille
  rationale: Terme d’adresse direct à la destinataire féminine. « Fille » conserve la sobriété de l’hébreu sans ajouter un possessif absent du texte source.
- source_word: וּרְאִי
  choice: et regarde
  rationale: Impératif féminin singulier de ראה. « Regarde » s’intègre naturellement à cette suite d’appels à l’attention ; « vois » demeure une traduction plus formelle possible.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: tends l’oreille
  rationale: Cette expression française courante conserve l’image hébraïque de l’oreille inclinée pour écouter attentivement.
- source_word: וְשִׁכְחִי
  choice: et oublie
  rationale: L’impératif de שכח signifie directement « oublier ». La traduction ne l’atténue pas en « laisse derrière toi » et préserve la force de l’exhortation.
- source_word: עַמֵּךְ
  choice: ton peuple
  rationale: עם désigne ici le groupe humain auquel appartient la destinataire ; « ton peuple » en donne l’équivalent direct.
- source_word: וּבֵית אָבִיךְ
  choice: et la maison de ton père
  rationale: La formulation garde l’expression hébraïque, qui peut évoquer à la fois la famille, la maisonnée et le foyer paternel.
theological_decisions:
- issue: Portée de l’exhortation adressée à la fiancée
  choice: Une exhortation directe à réorienter son appartenance première de son peuple et de sa famille paternelle vers le mariage royal.
  alternative: Un appel général, de type sapientiel, à être attentive, sans accent particulier sur un changement d’allégeance.
  rationale: La progression des impératifs aboutit à « oublie ton peuple et la maison de ton père », ce qui indique naturellement une réorientation relationnelle décisive dans le cadre nuptial du psaume. La traduction en conserve la force sans lui imposer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, sobre et digne. « Tends l’oreille » préserve l’image poétique tout en restant immédiatement compréhensible. Le vocatif « fille » est volontairement maintenu sans « ô » ni possessif ajouté.
