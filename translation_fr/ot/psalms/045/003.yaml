  text: Strap your sword on your thigh[a], mighty warrior[b], in your splendor and your majesty.
translation:
  language: fr
  text: Ceins ton épée à ta cuisse, vaillant guerrier, dans ta splendeur et ta majesté.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲגוֹר
  choice: Ceins
  rationale: L’impératif de חגר signifie attacher autour de soi ou ceindre. « Ceins » conserve l’image concrète du port de l’épée et convient au registre poétique, tout en restant intelligible en français moderne.
- source_word: חַרְבְּךָ
  choice: ton épée
  rationale: Complément direct muni du suffixe masculin singulier de deuxième personne ; le sens est direct et non ambigu.
- source_word: עַל יָרֵךְ
  choice: à ta cuisse
  rationale: La préposition et le nom décrivent concrètement l’endroit où l’épée est portée. « À ta cuisse » est idiomatique en français tout en restant proche de l’image hébraïque.
- source_word: גִּבּוֹר
  choice: vaillant guerrier
  rationale: Employé ici comme vocatif, גִּבּוֹר désigne un homme fort ou un héros de guerre. « Vaillant guerrier » explicite naturellement le cadre martial sans ajouter d’identification théologique.
- source_word: הוֹדְךָ
  choice: ta splendeur
  rationale: Dans ce contexte royal et poétique, הוֹד évoque l’éclat et la magnificence. « Splendeur » préserve cette valeur et se distingue du terme parallèle.
- source_word: וַהֲדָרֶךָ
  choice: et ta majesté
  rationale: הדר exprime la majesté, la magnificence ou la dignité. « Majesté » convient au contexte royal et maintient le parallélisme avec « splendeur ».
theological_decisions:
- issue: Adresse royale et portée messianique du Psaume 45
  choice: Présenter une adresse directe à un guerrier royal sans l’identifier explicitement comme le Messie.
  alternative: Rendre explicite une lecture typologique ou messianique à la lumière de la réception canonique ultérieure.
  rationale: Le verset hébreu s’adresse immédiatement à une figure royale et guerrière, mais ne la nomme pas explicitement comme le Messie. La traduction conserve ce sens immédiat et laisse ouverte la portée théologique plus large.
- issue: Rapport syntaxique de הוֹדְךָ וַהֲדָרֶךָ avec l’impératif
  choice: « dans ta splendeur et ta majesté », rattaché à l’action commandée.
  alternative: 'Comprendre les deux noms en apposition : « ta splendeur et ta majesté », ou comme une caractérisation plus libre du guerrier.'
  rationale: L’ajout de « dans » donne en français un lien naturel avec l’impératif et reflète une lecture plausible de la construction poétique, sans effacer entièrement sa concision.
translation_notes:
  register: Français international moderne, digne et poétique. « Ceins » est légèrement soutenu, mais précis, bref et traditionnellement compréhensible dans un contexte biblique ; le reste de la phrase demeure courant. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
