id: PSA.148.1
reference: Psalms 148:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְל֣וּ אֶת יְ֭הוָה מִן הַ/שָּׁמַ֑יִם הַֽ֝לְל֗וּ/הוּ בַּ/מְּרוֹמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/001.yaml
  text: Praise Yah! Praise Yahweh from the heavens[a]; praise him in the heights.
translation:
  language: fr
  text: Louez Yah ![a] Louez Yahweh depuis les cieux ; louez-le dans les hauteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu : hallelou-Yah, littéralement « Louez Yah » ; cette formule est à l’origine du mot « alléluia ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ
  choice: Louez
  rationale: 'Impératif masculin pluriel du piel de הלל : il s’agit d’un appel direct et collectif à louer. « Louez » est clair, naturel et fidèle.'
- source_word: יָ֨הּ
  choice: Yah
  rationale: Forme poétique abrégée du nom divin, distincte du יְהוָה qui suit. La conserver fait entendre la formule hébraïque à l’origine d’« alléluia ».
- source_word: יְ֭הוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin dans cette édition ; elle préserve aussi la distinction voulue entre la forme courte « Yah » et la forme complète.
- source_word: מִן הַ/שָּׁמַ֑יִם
  choice: depuis les cieux
  rationale: מִן exprime ici le point de départ de la louange, et שׁמים est au pluriel. « Depuis les cieux » conserve ces deux traits sans réduire l’expression au singulier.
- source_word: הַֽ֝לְל֗וּ/הוּ
  choice: louez-le
  rationale: Le suffixe pronominal masculin singulier renvoie à Yahweh. Le pronom français maintient cette cohésion sans répéter inutilement le nom.
- source_word: בַּ/מְּרוֹמִֽים
  choice: dans les hauteurs
  rationale: מְרוֹמִים désigne les régions élevées ou les hauteurs. Cette formulation garde l’image spatiale sans préciser abusivement « les plus hauts cieux ».
theological_decisions:
- issue: Rendu conjoint de יָהּ et de יְהוָה
  choice: Rendre יָהּ par « Yah » et יְהוָה par « Yahweh »
  alternative: Rendre les deux formes par « le Seigneur », ou employer « Alléluia » pour la première
  rationale: L’hébreu emploie successivement la forme courte et la forme complète du nom divin. Deux rendus distincts préservent ce contraste textuel et ne masquent pas le nom propre.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif pluriel conserve la portée collective de l’appel. Le parallélisme poétique est maintenu, ainsi que la distinction entre « les cieux » et « les hauteurs ».
