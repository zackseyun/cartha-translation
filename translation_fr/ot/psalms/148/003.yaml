  text: הַֽ֭לְלוּ/הוּ שֶׁ֣מֶשׁ וְ/יָרֵ֑חַ הַ֝לְל֗וּ/הוּ כָּל כּ֥וֹכְבֵי אֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: fr
  text: Louez-le, soleil et lune ! Louez-le, vous toutes, étoiles lumineuses !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Louez-le
  rationale: L’impératif masculin pluriel de הלל avec suffixe de troisième personne masculin singulier appelle directement les astres à louer Dieu; la répétition est conservée.
- source_word: שֶׁמֶשׁ
  choice: soleil
  rationale: Sens lexical courant, naturel dans l’adresse poétique.
- source_word: וְיָרֵחַ
  choice: et lune
  rationale: Le sens usuel et la conjonction hébraïque sont conservés.
- source_word: כָּל
  choice: vous toutes
  rationale: Le quantificateur englobe l’ensemble des étoiles; «toutes» s’accorde avec le nom féminin pluriel, tandis que «vous» rend explicite et naturel le discours direct en français.
- source_word: כּוֹכְבֵי אוֹר
  choice: étoiles lumineuses
  rationale: Le syntagme construit signifie littéralement «étoiles de lumière». «Étoiles lumineuses» en exprime naturellement le sens en français sans perdre l’image de la lumière.
theological_decisions:
- issue: Personnification des corps célestes dans la louange
  choice: Conserver les impératifs adressés directement au soleil, à la lune et aux étoiles.
  alternative: Transformer l’appel en affirmation selon laquelle les astres manifestent la louange de Dieu.
  rationale: L’hébreu emploie des impératifs à la deuxième personne du pluriel. L’adresse directe préserve la poésie et la vision du psaume, où toute la création est appelée à louer Dieu.
translation_notes:
  register: Français moderne, clair et digne. Les points d’exclamation rendent l’élan exhortatif du parallélisme hébreu. Aucun marqueur de note n’est requis, puisque la formulation naturelle «étoiles lumineuses» restitue directement כּוֹכְבֵי אוֹר.
