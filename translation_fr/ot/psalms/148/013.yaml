  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: fr
  text: Qu’ils louent le nom de Yahweh, car son nom seul est élevé ; sa majesté est au-dessus de la terre et du ciel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa splendeur » ou « sa gloire », au lieu de « sa majesté ».
    reason: Alternative lexicale pour הוֹדוֹ.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Qu’ils louent
  rationale: L’imparfait à valeur jussive prolonge ici l’appel hymnique à la louange ; cette tournure en restitue naturellement la force exhortative.
- source_word: שֵׁם
  choice: nom
  rationale: Le terme est conservé littéralement, avec sa portée possible d’identité révélée et de réputation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’appel à la louange.
- source_word: נִשְׂגָּב
  choice: est élevé
  rationale: Cette formulation exprime l’élévation et la grandeur du nom sans ajouter une interprétation étrangère au texte.
- source_word: שְׁמוֹ לְבַדּוֹ
  choice: son nom seul
  rationale: Cette formulation maintient l’accent explicite de l’hébreu sur le nom et la valeur exclusive de לְבַדּוֹ.
- source_word: הוֹדוֹ
  choice: sa majesté
  rationale: הוֹד désigne la majesté, la splendeur ou l’éclat glorieux ; « majesté » convient au contexte hymnique tout en restant accessible.
- source_word: עַל
  choice: domine
  rationale: Dans cette proposition nominale, la préposition exprime une position supérieure ; « domine » donne en français naturel le sens poétique de « se tient au-dessus de » sans nécessairement impliquer une action de gouvernement.
- source_word: אֶרֶץ וְשָׁמַיִם
  choice: la terre et le ciel
  rationale: L’ordre hébreu est conservé, et la paire désigne l’ensemble de la création.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Portée de הוֹד
  choice: majesté
  alternative: splendeur ; gloire
  rationale: Le mot admet ces nuances proches. Le texte principal choisit « majesté », tandis que la note conserve les autres possibilités lexicales sans trancher davantage.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle et l’ordre « la terre et le ciel » sont préservés. Le marqueur de note est placé immédiatement après la proposition concernée.
