  text: Louez-le, cieux très hauts, et vous, eaux qui êtes au-dessus des cieux !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Louez-le
  rationale: L’impératif masculin pluriel de הלל, avec suffixe pronominal masculin singulier, appelle plusieurs destinataires à louer Dieu. « Louez-le » en donne une expression française directe et naturelle.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: cieux les plus élevés
  rationale: La construction littérale « cieux des cieux » a ici une valeur intensive ou superlative. « Cieux les plus élevés » en transmet clairement le sens en français moderne.
- source_word: וְהַמַּיִם
  choice: et vous, eaux
  rationale: Les eaux sont coordonnées aux cieux comme destinataires de l’impératif. L’ajout de « vous » explicite en français cette adresse directe sans modifier son référent.
- source_word: אֲשֶׁר מֵעַל הַשָּׁמָיִם
  choice: qui êtes au-dessus des cieux
  rationale: La proposition relative qualifie les eaux. La deuxième personne s’accorde avec leur fonction de destinataires de l’appel, tandis que « au-dessus » conserve le sens spatial de מֵעַל.
theological_decisions:
- issue: L’image cosmologique des eaux au-dessus des cieux
  choice: Conserver telle quelle l’image ancienne des eaux situées au-dessus des cieux.
  alternative: Réinterpréter ces eaux comme les nuages, l’humidité atmosphérique ou une réalité purement métaphorique.
  rationale: Le psaume convoque poétiquement les diverses parties de la création. La traduction doit préserver l’image cosmologique du texte sans l’adapter à des catégories scientifiques ultérieures.
translation_notes:
  register: Français moderne, digne et poétique. L’impératif reste direct; le vocatif « et vous, eaux » rend explicite la personnification déjà portée par la syntaxe hébraïque.
