id: PSA.148.14
reference: Psalms 148:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֤רֶם קֶ֨רֶן לְ/עַמּ֡/וֹ תְּהִלָּ֤ה לְֽ/כָל חֲסִידָ֗י/ו לִ/בְנֵ֣י יִ֭שְׂרָאֵל עַֽם קְרֹב֗/וֹ הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: fr
  text: Il a élevé une corne pour son peuple[a], une louange pour tous ses fidèles, pour les fils d’Israël[b], le peuple qui lui est proche. Louez Yah ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La « corne » est, dans la poésie hébraïque, une image de force, de dignité ou de puissance élevée. La suite peut aussi se comprendre ainsi : « Il a élevé une corne pour son peuple — motif de louange pour tous ses fidèles. » La syntaxe hébraïque est condensée.'
    reason: cultural_note_and_alternative_reading
  - marker: b
    text: Ou « les enfants d’Israël ». L’hébreu dit littéralement « les fils d’Israël » et emploie cette expression comme désignation collective.
    reason: lexical_alternative
  - marker: c
    text: « Louez Yah » donne le sens de l’expression liturgique « Alléluia ». Yah est une forme courte du nom divin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  choice: il a élevé
  rationale: Le verbe רום signifie « élever, exalter ». Le passé composé convient ici au bilan célébratif de ce que Dieu a accompli.
- source_word: קֶרֶן
  choice: une corne
  rationale: La métaphore hébraïque désigne la force, la dignité ou la puissance élevée. La conserver respecte l’image poétique sans la réduire à une seule interprétation.
- source_word: לְעַמּוֹ
  choice: pour son peuple
  rationale: La préposition לְ exprime ici le bénéficiaire, et עַם désigne le peuple dans sa relation à Dieu.
- source_word: תְּהִלָּה
  choice: une louange
  rationale: Le nom signifie directement « louange ». La formulation conserve la syntaxe condensée, qui permet de le rattacher à la corne élevée ou au résultat de l’action divine.
- source_word: לְכָל חֲסִידָיו
  choice: pour tous ses fidèles
  rationale: חֲסִידִים désigne des personnes caractérisées par la fidélité et l’attachement à Dieu. « Fidèles » est naturel en français moderne et évite les connotations ecclésiastiques possibles de « saints ».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: pour les fils d’Israël
  rationale: Cette traduction suit la forme littérale masculine plurielle בְּנֵי tout en conservant l’expression collective du texte hébreu.
- source_word: עַם קְרֹבוֹ
  choice: le peuple qui lui est proche
  rationale: קָרוֹב exprime la proximité avec Dieu, vraisemblablement relationnelle et cultuelle. La traduction maintient cette image sans l’expliciter par « choisi » ou « bien-aimé ».
- source_word: הַלְלוּ יָהּ
  choice: Louez Yah !
  rationale: La traduction rend explicitement l’impératif הַלְלוּ et la forme courte du nom divin יָהּ, plutôt que de laisser l’expression liturgique non traduite.
theological_decisions:
- issue: Sens métaphorique de קֶרֶן
  choice: une corne
  alternative: une force ; une puissance
  rationale: Le maintien de la métaphore préserve la richesse poétique et théologique de l’hébreu sans imposer une interprétation unique.
- issue: Rapport syntaxique de תְּהִלָּה avec la proposition précédente
  choice: 'juxtaposition : « une louange pour tous ses fidèles »'
  alternative: comprendre que l’élévation de la corne devient un motif de louange, ou que la corne elle-même constitue une gloire pour les fidèles
  rationale: La syntaxe hébraïque est condensée. La juxtaposition française conserve cette ouverture plutôt que de trancher silencieusement entre une valeur appositionnelle et une valeur résultative.
- issue: Portée de בְנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: les enfants d’Israël ; le peuple d’Israël
  rationale: La forme masculine du texte est conservée dans cette désignation collective traditionnelle, sans limiter nécessairement le référent aux seuls hommes.
- issue: Rendu de יָהּ
  choice: Yah
  alternative: le Seigneur ; Alléluia
  rationale: Le texte emploie précisément la forme courte du nom divin. « Yah » en préserve la forme, tandis que « Louez » traduit le contenu de l’acclamation.
translation_notes:
  register: Français international moderne, sobre et poétique. Le rythme par appositions reproduit la densité du vers hébreu. La métaphore de la corne et la proximité du peuple avec Dieu sont conservées sans paraphrase doctrinale.
