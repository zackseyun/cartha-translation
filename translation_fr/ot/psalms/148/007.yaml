  text: הַֽלְל֣וּ אֶת יְ֭הוָה מִן הָ/אָ֑רֶץ תַּ֝נִּינִ֗ים וְ/כָל תְּהֹמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/007.yaml
  text: Praise Yahweh from the earth[b][a], sea creatures and all deeps.
translation:
  language: fr
  text: Louez Yahweh depuis la terre, monstres marins[a] et toutes les profondeurs[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « créatures marines » ou « dragons » ; le terme hébreu peut désigner des créatures redoutables, souvent associées à la mer.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes les eaux profondes » ; l’hébreu évoque ici les eaux des profondeurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Louez
  rationale: Impératif pluriel de הלל; « Louez » est l’appel direct et naturel propre au style des psaumes.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle en français du nom divin, qui conserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: מִן הָאָרֶץ
  choice: depuis la terre
  rationale: Dans le cadre cosmique du psaume, אֶרֶץ désigne le domaine terrestre, en contraste avec les cieux des versets précédents. « Depuis » rend clairement le point de départ de la louange.
- source_word: תַּנִּינִים
  choice: monstres marins
  rationale: Le terme peut désigner de grandes créatures redoutables, serpentines ou marines. « Monstres marins » préserve mieux cette force lexicale que le terme plus générique « créatures marines », sans imposer l’idée moderne de dragons.
- source_word: תְּהֹמוֹת
  choice: eaux profondes
  rationale: Le pluriel de תְּהוֹם évoque les masses d’eaux profondes ou les profondeurs aquatiques. Cette formulation est naturelle en français et maintient l’imagerie cosmique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » en conserve la fonction de nom propre au lieu de le remplacer par un titre.
- issue: Nature des תַּנִּינִים
  choice: monstres marins
  alternative: créatures marines
  rationale: Le mot peut évoquer des êtres marins redoutables ou monstrueux. Le contexte les présente néanmoins comme des créatures appelées à louer Yahweh, sans trancher davantage leur caractère zoologique ou imagé.
translation_notes:
  register: Français moderne, poétique et digne. L’apostrophe « et vous toutes » clarifie naturellement que les créatures et les eaux sont directement convoquées à la louange, comme l’indique la structure hébraïque. Les marqueurs suivent immédiatement les expressions concernées.
