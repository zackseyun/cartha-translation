source:
  edition: WLC
  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: fr
  text: Louez-le, vous tous, ses anges ! Louez-le, toute son armée céleste !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: Louez-le
  rationale: L’impératif pluriel de הלל, accompagné du suffixe masculin singulier, appelle directement plusieurs êtres à louer Dieu. « Louez-le » est naturel, actuel et conserve la force impérative.
- source_word: כָל
  choice: vous tous / vous toutes
  rationale: Dans cette adresse directe, cette tournure rend explicitement la totalité des deux groupes tout en restant idiomatique en français.
- source_word: מַלְאָכָיו
  choice: ses anges
  rationale: Dans ce contexte de louange céleste, מַלְאָכִים désigne des êtres célestes plutôt que des messagers humains. « Anges » est le terme français courant et précis.
- source_word: צְבָאוֹ
  choice: ses armées
  rationale: צָבָא peut désigner une armée ou une multitude organisée. « Armées » préserve l’image collective et potentiellement militaire du terme hébreu, tandis qu’une note signale les autres formulations possibles dans ce contexte céleste.
theological_decisions:
- issue: Référent des suffixes pronominaux (« le », « ses »)
  choice: Les pronoms renvoient à Dieu, le SEIGNEUR loué dans l’ensemble du psaume.
  alternative: Répéter explicitement « le SEIGNEUR » dans ce verset.
  rationale: Le verset 1 établit déjà le référent, et le verset 2 poursuit l’appel à le louer. Garder les pronoms respecte la cohésion et la concision du texte hébreu sans ajouter d’explication doctrinale.
- issue: Identification de צְבָאוֹ
  choice: « ses armées », avec une note indiquant le sens céleste possible
  alternative: « toute son armée céleste » ou « toutes ses troupes »
  rationale: Le parallélisme avec « ses anges » favorise une référence aux êtres célestes, mais le lexème conserve une imagerie d’armée que la traduction principale ne doit pas effacer.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « Louez-le » reproduit le parallélisme hébreu; « vous tous / vous toutes » souligne l’adresse directe et la totalité de chaque groupe.
