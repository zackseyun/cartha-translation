lexical_decisions:
- source_word: הֶהָרִים
  choice: les montagnes
  rationale: Le nom désigne les montagnes; l’article hébreu est naturellement rendu ici dans l’énumération poétique.
- source_word: וְכָל גְּבָעוֹת
  choice: et toutes les collines
  rationale: כָּל suivi d’un pluriel a ici le sens de « toutes », tandis que גְּבָעוֹת désigne des hauteurs moins élevées que les montagnes.
- source_word: עֵץ פְּרִי
  choice: les arbres fruitiers[a]
  rationale: Littéralement « arbre de fruit », cette expression au singulier fonctionne collectivement; « les arbres fruitiers » est l’équivalent français courant.
- source_word: וְכָל אֲרָזִים
  choice: et tous les cèdres
  rationale: אֲרָזִים désigne les cèdres; « tous » conserve la portée de כָּל et le parallélisme de la liste.
theological_decisions: []
