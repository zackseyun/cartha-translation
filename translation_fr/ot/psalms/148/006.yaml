  text: וַ/יַּעֲמִידֵ֣/ם לָ/עַ֣ד לְ/עוֹלָ֑ם חָק נָ֝תַ֗ן וְ/לֹ֣א יַעֲבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: fr
  text: Il les a établis pour toujours, à jamais ; il a donné un décret[a] qui ne disparaîtra pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « il a donné un décret, et ils ne le dépasseront pas » ou « nul ne le dépassera ». La proposition finale de l’hébreu est ambiguë.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: Il les a établis
  rationale: Le hifil de עמד, accompagné du suffixe de troisième personne du pluriel, exprime ici l’action de faire subsister ou d’établir. « Établir » convient naturellement à la stabilité de l’ordre créé.
- source_word: לָעַד לְעוֹלָם
  choice: pour toujours, à jamais
  rationale: Les deux expressions temporelles se renforcent mutuellement. Cette formulation conserve l’insistance de l’hébreu dans un français naturel et solennel.
- source_word: חָק
  choice: un décret
  rationale: חק peut désigner une prescription, une limite fixée ou un ordre établi. « Décret » exprime l’autorité de l’ordre donné par Dieu sans réduire le terme à une loi civile.
- source_word: נָתַן
  choice: il a donné
  rationale: Le verbe נתן signifie couramment « donner ». Employé avec חק, il décrit directement le fait de donner ou d’établir un décret.
- source_word: וְלֹא יַעֲבוֹר
  choice: et il ne passera pas
  rationale: עבר peut signifier passer, franchir une limite ou transgresser. La traduction principale rattache le verbe au décret, tout en laissant la note signaler les autres analyses possibles.
theological_decisions:
- issue: Sujet et sens de וְלֹא יַעֲבוֹר
  choice: 'Le décret est compris comme sujet : « et il ne passera pas »'
  alternative: « et ils ne le dépasseront pas » ou « nul ne le dépassera »
  rationale: Le sujet du verbe masculin singulier et son éventuel complément ne sont pas explicités. Le décret, nom masculin singulier immédiatement antérieur, peut être le sujet ; mais le contexte permet aussi de comprendre que les êtres créés ne franchissent pas la limite fixée. La note préserve cette ambiguïté réelle.
translation_notes:
  register: Français moderne, international et digne. La reprise pronominale « il » reste naturelle après « un décret » ; la note explicite les autres lectures que la syntaxe hébraïque permet.
