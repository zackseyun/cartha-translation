  text: les jeunes hommes et les jeunes femmes[a], les hommes âgés avec les garçons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vierges ». Le terme hébreu peut désigner spécifiquement des vierges ou de jeunes femmes non mariées.
