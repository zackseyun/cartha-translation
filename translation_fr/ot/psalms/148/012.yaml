lexical_decisions:
- source_word: בַּחוּרִים
  choice: jeunes hommes
  rationale: Le nom désigne de jeunes adultes de sexe masculin, souvent dans la force de l’âge. « Jeunes hommes » est naturel et préserve la référence masculine.
- source_word: וְגַם
  choice: et
  rationale: Dans cette énumération poétique condensée, « et » exprime naturellement la coordination additive sans alourdir le rythme.
- source_word: בְּתוּלוֹת
  choice: jeunes femmes
  rationale: Le terme peut désigner spécifiquement des vierges ou de jeunes femmes non mariées, mais le contexte énumère surtout des groupes selon l’âge et le sexe. L’autre sens est signalé en note.
- source_word: זְקֵנִים
  choice: vieillards
  rationale: Dans cette série de groupes d’âge, le mot désigne vraisemblablement des hommes âgés plutôt que des anciens investis d’une fonction. « Vieillards » conserve cette valeur masculine et liée à l’âge.
- source_word: עִם
  choice: avec
  rationale: Cette préposition concise préserve le regroupement poétique des hommes âgés et des garçons.
- source_word: נְעָרִים
  choice: garçons
  rationale: Le terme désigne ici de jeunes personnes de sexe masculin et forme un contraste avec les jeunes hommes adultes du premier groupe. Son étendue d’âge plus large est indiquée en note.
