lexical_decisions:
- source_word: הַחַיָּה
  choice: animaux sauvages
  rationale: חַיָּה désigne ici les animaux sauvages, par contraste avec בְּהֵמָה, qui renvoie aux animaux domestiques.
- source_word: וְכָל בְּהֵמָה
  choice: et tout le bétail
  rationale: « Tout le bétail » rend כָּל et exprime naturellement en français moderne la catégorie des animaux domestiques, distincte des animaux sauvages.
- source_word: רֶמֶשׂ
  choice: bêtes qui rampent
  rationale: Cette formulation rend la vaste catégorie des petites créatures qui se déplacent en rampant, sans lui donner une précision zoologique absente de l’hébreu.
- source_word: וְצִפּוֹר כָּנָף
  choice: et oiseaux ailés
  rationale: « Oiseaux ailés » conserve l’image explicite de l’aile dans l’expression hébraïque, tout en restant concise et intelligible.
