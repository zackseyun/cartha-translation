  text: fire and hail[a], snow and vapor, stormy wind doing his word[c][b],
translation:
  language: fr
  text: feu et grêle, neige et vapeur[a], vent de tempête qui accomplit sa parole[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fumée » ou « brume ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qui exécute son ordre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשׁ וּבָרָד
  choice: feu et grêle
  rationale: Les deux noms désignent directement le feu et la grêle; la coordination hébraïque est conservée naturellement.
- source_word: שֶׁלֶג וְקִיטוֹר
  choice: neige et vapeur
  rationale: שֶׁלֶג signifie « neige ». קִיטוֹר peut désigner de la vapeur, de la fumée ou une brume; « vapeur » convient à cette énumération de phénomènes naturels tout en restant assez large.
- source_word: רוּחַ סְעָרָה
  choice: vent de tempête
  rationale: 'Cette formulation naturelle rend les deux éléments de l’expression: le vent et son caractère tempétueux.'
- source_word: עֹשָׂה דְבָרוֹ
  choice: qui accomplit sa parole
  rationale: Le participe exprime une action caractéristique ou continue. « Accomplir sa parole » est naturel en français, reste proche des mots hébreux et suggère, sans l’imposer dans le texte, l’exécution d’un ordre divin.
theological_decisions:
- issue: Référent du suffixe masculin singulier dans דְבָרוֹ
  choice: « sa parole », où « sa » renvoie à Dieu
  alternative: « son ordre »
  rationale: Dans le contexte du psaume, les éléments créés sont appelés à louer Dieu et le vent exécute ce qu’il a déclaré. Le français ne marque pas typographiquement les pronoms possessifs divins.
- issue: Valeur de דָּבָר dans l’expression עשה דברו
  choice: « accomplit sa parole »
  alternative: « exécute son ordre »
  rationale: « Parole » conserve la portée lexicale de דָּבָר et la tension poétique entre déclaration et commandement; la note explicite le sens fonctionnel possible.
translation_notes:
  register: Français international moderne, poétique et digne. L’énumération concise de l’hébreu est conservée; la relative rend clairement et naturellement le participe hébreu.
