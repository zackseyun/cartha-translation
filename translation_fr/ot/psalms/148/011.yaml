lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: rois de la terre
  rationale: Le construit pluriel désigne les rois appartenant au monde terrestre. Sans article, cette formulation s’intègre naturellement à l’énumération poétique commencée dans les versets précédents.
- source_word: וְכָל לְאֻמִּים
  choice: et vous, tous les peuples
  rationale: « Peuples » rend לְאֻמִּים sans évoquer exclusivement les États-nations modernes. L’ajout de « vous » explicite en français l’adresse à ces groupes, régie par l’impératif « louez » du contexte, sans modifier le référent.
- source_word: שָׂרִים
  choice: princes
  rationale: Le terme désigne des dirigeants ou hauts dignitaires. « Princes » conserve le registre élevé et poétique, sans exiger ici une filiation royale précise.
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: et vous, tous les juges de la terre
  rationale: שֹׁפְטֵי est rendu directement par « juges ». « Tous » préserve la portée globale de כָל, et « vous » maintient clairement la série des destinataires de l’appel à louer.
- source_word: אֶרֶץ / אָרֶץ
  choice: la terre
  rationale: Le cadre universel et cosmique du psaume favorise « terre » plutôt que le sens local possible « pays ».
theological_decisions:
- issue: Portée de אֶרֶץ dans l’appel universel à la louange
  choice: la terre
  alternative: le pays
  rationale: Le psaume convoque l’ensemble de la création; le sens universel convient donc mieux, tout en signalant en note la possibilité lexicale d’une lecture locale.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe conserve la structure d’une énumération dépendant de l’appel à louer formulé dans le contexte. La reprise de « vous » rend cette adresse naturelle et immédiatement compréhensible en français.
