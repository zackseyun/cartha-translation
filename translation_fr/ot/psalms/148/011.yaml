  text: kings of the earth and all peoples[a], princes and all judges of the earth[b],
translation:
  language: fr
  text: rois de la terre et tous les peuples[a], princes et tous les juges de la terre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toutes les nations ».
