  text: יְֽ֭הַֽלְלוּ אֶת שֵׁ֣ם יְהוָ֑ה כִּ֤י ה֭וּא צִוָּ֣ה וְ/נִבְרָֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/005.yaml
  text: Let them praise the name of Yahweh[a], for he commanded, and they were created.
translation:
  language: fr
  text: Qu’ils louent le nom de Yahweh[a], car il a commandé, et ils ont été créés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH ». Traditionnellement rendu par « le SEIGNEUR » ; autre forme : « Yahvé ».'
    reason: Signaler la forme hébraïque du nom divin et les principales conventions françaises de traduction ou de transcription.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Qu’ils louent
  rationale: Le piel inaccompli à valeur jussive exprime ici une exhortation adressée aux réalités célestes mentionnées dans le contexte. « Qu’ils louent » rend naturellement cette valeur en français.
- source_word: אֶת שֵׁם
  choice: le nom de
  rationale: Cette formulation conserve l’expression biblique qui associe le nom à l’identité révélée et à la renommée de Dieu, sans la paraphraser.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel à la louange. « Car » est concis et convient au registre poétique.
- source_word: הוּא
  choice: il
  rationale: Le pronom explicite renvoie à Yahweh. Le français demande ici un pronom sujet, sans qu’il soit nécessaire d’ajouter une valeur emphatique comme « lui-même ».
- source_word: צִוָּה
  choice: a commandé
  rationale: Le verbe désigne l’acte de donner un ordre. Le passé composé est naturel en français moderne et maintient le rapport entre le commandement divin et la création.
- source_word: וְנִבְרָאוּ
  choice: et ils ont été créés
  rationale: Le nifal accompli pluriel de ברא est rendu au passif, ce qui respecte la forme hébraïque et conserve explicitement le motif de la création.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel, tandis que « le SEIGNEUR » représente la substitution traditionnelle signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste proche de l’hébreu tout en étant naturelle ; la virgule avant « et » marque la succession solennelle des deux actes.
