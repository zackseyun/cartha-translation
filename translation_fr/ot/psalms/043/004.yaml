id: PSA.43.4
reference: Psalms 43:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָב֤וֹאָה אֶל מִזְבַּ֬ח אֱלֹהִ֗ים אֶל אֵל֮ שִׂמְחַ֪ת גִּ֫ילִ֥/י וְ/אוֹדְ/ךָ֥ בְ/כִנּ֗וֹר אֱלֹהִ֥ים אֱלֹהָֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/004.yaml
  text: Then I will go to the altar of God[a], to God, the joy of my rejoicing; and I will praise you with the lyre, O God[b], my God.
translation:
  language: fr
  text: Alors j’irai vers l’autel de Dieu, vers Dieu, la joie de mon allégresse[a] ; et je te louerai avec la lyre[b], ô Dieu, mon Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus idiomatiquement : « ma joie la plus vive ». Littéralement, l’hébreu dit « la joie de mon allégresse » et redouble ainsi le vocabulaire de la joie pour l’intensifier.'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle possible : « la harpe ». Le kinnor était un ancien instrument à cordes, probablement plus proche d’une lyre.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: Alors j’irai
  rationale: La forme volitive à la première personne, dans la suite des demandes précédentes, exprime ici un résultat attendu ou une résolution. « Alors j’irai » rend naturellement cette progression en français.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: vers l’autel de Dieu
  rationale: Cette formulation traduit directement la chaîne construite hébraïque et conserve la solennité du mouvement vers le lieu du culte.
- source_word: אֶל אֵל
  choice: vers Dieu
  rationale: אֵל est ici un titre divin parallèle à אֱלֹהִים. « Dieu » identifie clairement le même référent sans imposer une distinction absente du contexte.
- source_word: שִׂמְחַת גִּילִי
  choice: la joie de mon allégresse
  rationale: L’hébreu associe deux termes proches désignant la joie afin de produire une intensification poétique. Cette traduction en préserve le redoublement sans le réduire à un simple superlatif.
- source_word: וְאוֹדְךָ
  choice: et je te louerai
  rationale: Dans ce contexte de culte accompagné d’un instrument, le hiphil de ידה désigne naturellement la louange publique adressée à Dieu, tout en pouvant ailleurs signifier « rendre grâce ».
- source_word: בְכִנּוֹר
  choice: avec la lyre
  rationale: Le כִּנּוֹר était un ancien instrument à cordes qui correspond vraisemblablement davantage à une lyre qu’à la harpe moderne.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: ô Dieu, mon Dieu
  rationale: La tournure française avec « ô » marque clairement l’apostrophe et conserve à la fois la répétition et l’expression d’une relation personnelle.
theological_decisions:
- issue: Traduction des titres divins répétés אֱלֹהִים et אֵל
  choice: Traduire les deux par « Dieu » tout en conservant leur répétition.
  alternative: Différencier אֵל par « Dieu puissant » ou le transcrire « El ».
  rationale: Le parallélisme poétique multiplie ici les désignations du même Dieu sans établir entre elles une distinction doctrinale. Une traduction uniforme préserve le référent et évite d’ajouter une nuance théologique non exigée par le texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le redoublement inhabituel « la joie de mon allégresse » est conservé pour rendre la force poétique de l’hébreu, avec une formulation plus idiomatique proposée en note. La ponctuation met en relief le mouvement vers l’autel, puis l’adresse personnelle à Dieu.
