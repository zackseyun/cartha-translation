id: PSA.43.1
reference: Psalms 43:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שָׁפְטֵ֤/נִי אֱלֹהִ֨ים וְ/רִ֘יבָ֤/ה רִיבִ֗/י מִ/גּ֥וֹי לֹא חָסִ֑יד מֵ֤/אִישׁ מִרְמָ֖ה וְ/עַוְלָ֣ה תְפַלְּטֵֽ/נִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/001.yaml
  text: Vindicate me[a], O God, and plead my cause against an unfaithful nation; deliver me from the deceitful and unjust man.
translation:
  language: fr
  text: Rends-moi justice, ô Dieu, et défends ma cause contre une nation infidèle[a] ! Délivre-moi de l’homme trompeur et injuste !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « impie » ; littéralement : « qui n’est pas fidèle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Rends-moi justice
  rationale: Dans cette supplication, l’impératif de שׁפט demande à Dieu de prononcer un jugement favorable. « Rends-moi justice » exprime naturellement en français cette portée judiciaire sans suggérer une simple évaluation morale.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le vocatif « ô Dieu » convient à l’adresse directe et au registre digne de la prière.
- source_word: וְרִיבָה רִיבִי
  choice: et défends ma cause
  rationale: 'Le verbe ריב accompagné du nom apparenté ריב constitue une tournure judiciaire : le psalmiste demande à Dieu de prendre en charge son procès. « Défends ma cause » conserve cette image en français courant.'
- source_word: מִגּוֹי לֹא חָסִיד
  choice: contre une nation infidèle
  rationale: Dans le cadre judiciaire, מִן désigne ici la partie adverse, d’où « contre ». La négation de חָסִיד indique l’absence de fidélité ou de loyauté; « infidèle » préserve cette dimension relationnelle, tandis qu’une note signale l’autre compréhension possible.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: de l’homme trompeur et injuste
  rationale: Les noms abstraits מִרְמָה et עַוְלָה caractérisent l’homme par la tromperie et l’injustice. Le singulier de איש est conservé.
- source_word: תְפַלְּטֵנִי
  choice: Délivre-moi
  rationale: Le piel de פלט exprime l’action de faire échapper quelqu’un au danger. « Délivre-moi » est clair, digne et approprié au langage de la supplication.
theological_decisions:
- issue: Sens de חָסִיד dans l’expression négative לֹא חָסִיד
  choice: infidèle
  alternative: sans fidélité / impie
  rationale: חָסִיד désigne une personne marquée par la fidélité, la loyauté ou l’attachement pieux. Sa négation peut donc viser l’infidélité plutôt que seulement l’impiété générale. Le texte principal retient la dimension relationnelle, et la note conserve l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme judiciaire est maintenu par « rends-moi justice » et « défends ma cause ». Les impératifs et le singulier « l’homme » sont conservés.
