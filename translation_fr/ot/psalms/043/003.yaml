source:
  edition: WLC
  text: שְׁלַח אוֹרְ/ךָ֣ וַ֭/אֲמִתְּ/ךָ הֵ֣מָּה יַנְח֑וּ/נִי יְבִיא֥וּ/נִי אֶל הַֽר קָ֝דְשְׁ/ךָ֗ וְ/אֶל מִשְׁכְּנוֹתֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/003.yaml
  text: Send out your light and your truth[a]; let them lead me[b]; let them bring me to your holy mountain and to your dwelling places.
translation:
  language: fr
  text: 'Envoie ta lumière et ta vérité[a] : qu’elles me guident, qu’elles m’amènent à ta montagne sainte et à tes demeures[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ta fidélité » : le terme hébreu peut exprimer la vérité, la fiabilité ou la fidélité.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie ici un pluriel ; traduction traditionnelle : « tes tabernacles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: Envoie
  rationale: Impératif masculin singulier de שלח. « Envoie » exprime naturellement en français l’appel à faire venir la lumière et la vérité auprès du psalmiste.
- source_word: אוֹרְךָ
  choice: ta lumière
  rationale: Le sens concret de אוֹר est conservé, sans expliciter dans le texte principal ses connotations possibles de direction ou de salut.
- source_word: אֲמִתְּךָ
  choice: ta vérité
  rationale: אֱמֶת peut désigner la vérité, la fiabilité ou la fidélité. « Vérité » en est ici le rendu direct tout en laissant une note signaler l’autre nuance importante.
- source_word: הֵמָּה יַנְחוּנִי
  choice: qu’elles me guident
  rationale: Le pronom indépendant et le verbe pluriel personnifient la lumière et la vérité. Le subjonctif français rend bien la valeur volitive qui suit l’impératif.
- source_word: יְבִיאוּנִי
  choice: qu’elles me conduisent vers
  rationale: Le hiphil de בוא signifie faire venir ou amener. Dans ce mouvement vers la présence divine, « conduire vers » est idiomatique et maintient le parallélisme avec « guider ».
- source_word: הַר קָדְשְׁךָ
  choice: ta montagne sainte
  rationale: Rendu idiomatique de la construction « montagne de ta sainteté », sans identifier explicitement le lieu à Sion dans le texte principal.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: les lieux où tu demeures
  rationale: Cette formulation moderne rend le pluriel de מִשְׁכָּן et son idée d’habitation, sans employer le terme traditionnel mais aujourd’hui spécialisé « tabernacles ».
theological_decisions:
- issue: Interprétation de la lumière et de la vérité comme attributs abstraits ou agents personnifiés
  choice: 'Conserver la personnification par le pluriel : « qu’elles me guident, qu’elles me conduisent »'
  alternative: Paraphraser comme la direction salvatrice donnée par Dieu
  rationale: L’hébreu reprend explicitement « ta lumière et ta vérité » par un pronom et des verbes au pluriel. La personnification poétique doit donc rester visible.
- issue: Identification de la montagne et des demeures à Sion et au sanctuaire
  choice: Garder « ta montagne sainte » et « les lieux où tu demeures »
  alternative: Préciser « Sion » ou « ton Temple »
  rationale: Même si Sion et le sanctuaire sont probablement visés, le texte hébreu emploie des expressions poétiques plus larges, qu’il convient de ne pas surinterpréter.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. Le parallélisme verbal et la personnification de la lumière et de la vérité sont préservés; le vocabulaire cultuel archaïque est évité dans le texte principal.
