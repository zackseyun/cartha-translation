  naturalness: La formulation est naturelle et poétique en français moderne. « Tes demeures » est à la fois idiomatique, digne et plus concis que « les lieux où tu demeures ».
  terminology: « Ta lumière », « ta vérité », « ta montagne sainte » et « tes demeures » respectent le lexique hébreu sans imposer l’identification à Sion ou au temple. La note sur אֱמֶת préserve justement l’alternative « fidélité »; celle sur le pluriel de מִשְׁכָּן reste appropriée.
