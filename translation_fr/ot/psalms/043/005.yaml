  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וּֽ/מַה תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֣וֹד אוֹדֶ֑/נּוּ יְשׁוּעֹ֥ת פָּ֝נַ֗/י וֵֽ/אלֹהָֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: fr
  text: Pourquoi es-tu abattue[a], mon âme, et pourquoi t’agites-tu au-dedans de moi ? Espère en Dieu, car je le louerai encore, lui qui est le salut de mon visage et mon Dieu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « courbée » ou « affaissée ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « les saluts de mon visage et mon Dieu ». Cette expression peut présenter Dieu comme celui dont le secours relève ou restaure le visage abattu du psalmiste.
    reason: source_clarification
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: es-tu abattue
  rationale: Le verbe décrit le fait d’être courbé ou affaissé et, dans cette adresse à soi-même, exprime naturellement l’abattement sans effacer l’image sous-jacente.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: Dans ce contexte, נֶפֶשׁ désigne l’être intérieur. « Mon âme » conserve l’adresse poétique traditionnelle tout en restant compréhensible en français moderne.
- source_word: תֶּהֱמִי
  choice: t’agites-tu
  rationale: Le verbe évoque le tumulte, le grondement ou l’agitation. La forme pronominale rend clairement le trouble intérieur.
- source_word: עָלָי
  choice: au-dedans de moi
  rationale: Littéralement « sur moi », l’expression décrit ici une agitation qui se produit dans l’intériorité du psalmiste; cette tournure française en transmet le sens contextuel.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Espère en Dieu
  rationale: L’impératif appelle à attendre Dieu avec confiance. « Espère en Dieu » est concis, naturel et fidèle à cette attente confiante.
- source_word: עוֹד אוֹדֶנּוּ
  choice: je le louerai encore
  rationale: עוֹד oriente vers une louange à venir malgré la détresse présente, tandis que ידה au hiphil désigne ici la louange ou l’action de grâce.
- source_word: יְשׁוּעֹת פָּנַי
  choice: le salut de mon visage
  rationale: Cette formulation conserve l’image concrète et inhabituelle de l’hébreu, où le salut divin est lié au visage abattu du psalmiste, sans réduire silencieusement l’expression à une interprétation unique.
- source_word: וֵאלֹהָי
  choice: et mon Dieu
  rationale: La traduction maintient la coordination simple de l’hébreu et l’identification personnelle finale.
theological_decisions:
- issue: Sens de יְשׁוּעֹת פָּנַי
  choice: le salut de mon visage
  alternative: celui qui relève mon visage; le secours de mon visage
  rationale: L’expression massorétique est dense et inhabituelle. La traduction principale en préserve la tension et l’image au lieu d’introduire directement l’idée interprétative de « relever » le visage. La note explique le sens probable sans en faire l’unique lecture.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse du psalmiste à sa propre âme. La formulation finale demeure volontairement proche de l’image hébraïque, malgré son caractère inhabituel.
