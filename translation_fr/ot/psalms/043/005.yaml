  terminology: « Mon âme », « Espère en Dieu », « louerai encore » et « mon Dieu » conviennent au registre psalmique moderne. « Le salut de mon visage » demeure volontairement insolite, mais la note l’explique sans imposer une interprétation confessionnelle.
