  verdict: revise
  source_fidelity: Le texte rend correctement l’adresse à l’âme, l’abattement, l’agitation intérieure, l’appel à espérer, la louange future et la conclusion massorétique difficile. « Salut » au singulier peut représenter le pluriel intensif יְשׁוּעוֹת. La note conserve utilement le littéral pluriel et indique prudemment le sens possible.
