source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה אֱלֹהֵ֣י מָֽעוּזִּ/י֮ לָ/מָ֪ה זְנַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֶתְהַלֵּ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: fr
  text: Car c’est toi, le Dieu qui est mon refuge[a] ; pourquoi m’as-tu rejeté ? Pourquoi marcherais-je dans la tristesse[b], sous l’oppression de l’ennemi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Dieu qui est ma forteresse » ou « le Dieu qui est ma force ». Le nom hébreu peut désigner un refuge, une place forte ou une force protectrice selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sombre » ou « assombri ». Le terme évoque un état de tristesse ou de deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement de l’appel du psalmiste et conserve clairement la valeur causale dans l’enchaînement argumentatif.
- source_word: אַתָּה אֱלֹהֵי מָעוּזִּי
  choice: c’est toi, le Dieu qui est mon refuge
  rationale: La tournure disloquée rend l’emphase portée par אַתָּה, tandis que « refuge » exprime naturellement la protection associée à מָעוֹז et évite l’ambiguïté française de « Dieu de mon refuge ».
- source_word: לָמָה
  choice: pourquoi
  rationale: La répétition de l’interrogatif est maintenue afin de préserver la force poétique et plaintive.
- source_word: זְנַחְתָּנִי
  choice: m’as-tu rejeté
  rationale: « Rejeter » restitue la gravité de זנח sans renforcer le sens jusqu’à l’abandon définitif.
- source_word: קֹדֵר
  choice: dans le deuil
  rationale: Le terme évoque littéralement un état sombre, associé ici à l’affliction ou au deuil ; cette formulation en communique le sens idiomatique.
- source_word: אֶתְהַלֵּךְ
  choice: dois-je aller
  rationale: La forme décrit une marche ou une conduite qui se prolonge. Dans cette question de lamentation, « dois-je » exprime naturellement la situation subie sans affirmer une obligation théologique.
- source_word: בְּלַחַץ
  choice: sous l’oppression
  rationale: « Sous » rend la circonstance accablante exprimée par la préposition בְּ, et « oppression » correspond au sens contextuel de לַחַץ.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier désigne l’adversaire connu ou représentatif et se rend naturellement avec l’article défini.
theological_decisions:
- issue: Langage de rejet divin dans la lamentation
  choice: pourquoi m’as-tu rejeté ?
  alternative: pourquoi m’as-tu abandonné ? / pourquoi m’as-tu repoussé ?
  rationale: La plainte directe du psalmiste et la tension créée par son sentiment de rejet sont conservées, sans les atténuer ni les interpréter comme un abandon définitif.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition de « pourquoi » conserve le parallélisme de la lamentation. Les images de protection, de deuil et d’oppression restent concrètes, et l’emphase du pronom אַתָּה est rendue par « c’est toi ».
