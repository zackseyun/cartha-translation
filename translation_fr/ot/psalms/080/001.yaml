id: PSA.80.1
reference: Psalms 80:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: fr
  text: 'Berger d’Israël, prête l’oreille,

    toi qui conduis Joseph[a] comme un troupeau !


    Toi qui sièges parmi les chérubins[b],

    resplendis !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Joseph » désigne probablement le peuple d’Israël, en particulier les tribus du Nord, mais l’hébreu conserve le nom propre.
    reason: cultural_note
  - marker: b
    text: 'Littéralement, l’hébreu dit : « toi qui sièges, [avec] les chérubins »; il ne précise pas la relation spatiale. On peut aussi comprendre « entre les chérubins » ou « sur les chérubins ». L’expression évoque la présence royale de Dieu associée à l’arche.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעֵה
  choice: Berger
  rationale: Participe qal employé comme titre divin et comme apostrophe. « Berger » conserve directement l’image pastorale.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Nom propre conservé selon sa forme française usuelle.
- source_word: הַאֲזִינָה
  choice: prête l’oreille
  rationale: L’impératif exprime une écoute attentive. « Prête l’oreille » garde le relief poétique et solennel de l’hébreu.
- source_word: נֹהֵג
  choice: conduis
  rationale: Dans l’image pastorale, le participe décrit celui qui mène activement le troupeau. « Conduis » est naturel en français et évite la rudesse possible de « pousses ».
- source_word: כַּצֹּאן
  choice: comme un troupeau
  rationale: צאן est un nom collectif désignant le petit bétail; « un troupeau » en restitue naturellement le sens collectif.
- source_word: יוֹסֵף
  choice: Joseph
  rationale: Le nom propre est conservé plutôt que remplacé par une interprétation telle que « les tribus du Nord » ou « Israël ».
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: toi qui sièges au-dessus des chérubins
  rationale: Dans ce contexte royal et cultuel, ישב évoque Dieu siégeant sur son trône. « Au-dessus » rend l’image traditionnelle sans faire du verbe une simple indication de résidence; une note signale l’indétermination de la relation spatiale en hébreu.
- source_word: הוֹפִיעָה
  choice: manifeste ta splendeur
  rationale: L’impératif hiphil exprime une apparition rayonnante ou glorieuse. Cette formulation française conserve à la fois l’idée de manifestation et celle d’éclat.
theological_decisions:
- issue: L’image de Dieu siégeant avec les chérubins
  choice: toi qui sièges au-dessus des chérubins
  alternative: toi qui sièges entre les chérubins; toi qui sièges sur les chérubins
  rationale: Le langage évoque la présence royale de Dieu associée à l’arche, mais l’hébreu ne précise pas par une préposition si Dieu siège sur, entre ou au-dessus des chérubins. Le texte retient une formulation française idiomatique et la note préserve l’ambiguïté.
- issue: La portée du nom « Joseph »
  choice: conserver « Joseph »
  alternative: expliciter « le peuple d’Israël » ou « les tribus du Nord »
  rationale: Le nom peut désigner par métonymie Israël, particulièrement les tribus du Nord, mais le texte hébreu maintient le nom personnel et ne tranche pas explicitement son extension.
translation_notes:
  register: Français poétique, actuel et digne. Les deux appels parallèles sont disposés en quatre lignes pour rendre la structure du verset. « Prête l’oreille » maintient le registre élevé sans archaïsme excessif, tandis que « manifeste ta splendeur » explicite sobrement la dimension rayonnante de l’apparition divine.
