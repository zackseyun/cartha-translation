source:
  edition: WLC
  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: fr
  text: Alors nous ne nous détournerons pas de toi. Fais-nous vivre[a], et nous invoquerons ton nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ranime-nous » ou « garde-nous en vie ».'
    reason: Le verbe hébreu peut désigner le fait de donner ou rendre la vie, de ranimer, ou de maintenir en vie.
lexical_decisions:
- source_word: וְלֹא
  choice: Alors… ne… plus
  rationale: La conjonction introduit ici naturellement la conséquence de la demande précédente. « Alors » exprime ce rapport, tandis que « ne… plus » rend en français idiomatique l'engagement à ne pas recommencer à se détourner.
- source_word: נָסוֹג
  choice: nous détournerons
  rationale: Le verbe désigne un mouvement de recul ou de retrait. Avec « de toi », « se détourner de » est naturel en français et conserve l'idée d'abandon de la fidélité sans recourir au terme plus doctrinal « apostasier ».
- source_word: מִמֶּךָּ
  choice: de toi
  rationale: La préposition מן avec le suffixe de deuxième personne marque l'éloignement et se rend directement par « de toi » après « se détourner ».
- source_word: תְּחַיֵּנוּ
  choice: Fais-nous vivre
  rationale: Le piel de חיה peut signifier donner ou rendre la vie, ranimer, ou maintenir en vie. « Fais-nous vivre » conserve cette amplitude sémantique sans limiter la demande à un réveil spirituel ou à la seule survie physique.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: et nous invoquerons ton nom
  rationale: קרא avec בשם exprime ici l'action d'appeler le nom de Dieu, c'est-à-dire de l'invoquer. Cette formulation française est claire, digne et adaptée au contexte de prière.
theological_decisions:
- issue: Portée de la demande de vie
  choice: Une prière demandant à Dieu de donner ou de rendre la vie au peuple
  alternative: « Ranime-nous » ou « garde-nous en vie »
  rationale: Le champ sémantique de חיה permet l'idée de restauration aussi bien que celle de conservation de la vie. Le texte principal maintient volontairement cette tension.
- issue: Nature du retournement
  choice: « ne nous détournerons plus de toi »
  alternative: « ne reculerons pas loin de toi »
  rationale: La formulation retenue fait entendre la fidélité relationnelle impliquée par le contexte, sans préciser si le recul est principalement cultuel, moral ou politique.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation en deux phrases allège la structure sans rompre le lien logique; « invoquerons » conserve le registre de la prière biblique tout en restant compréhensible.
