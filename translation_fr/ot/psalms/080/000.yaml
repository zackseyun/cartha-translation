lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Formule de suscription adressée vraisemblablement au responsable de l’exécution musicale; cette tournure est claire et naturelle en français.
- source_word: אֶל
  choice: Sur
  rationale: Dans les suscriptions, la préposition peut introduire un air ou une indication d’exécution. « Sur » conserve cette fonction sans la préciser indûment.
- source_word: שֹׁשַׁנִּים
  choice: « Les Lis »
  rationale: Il s’agit probablement du nom d’un air ou d’une désignation musicale; les guillemets et la majuscule signalent cette valeur possible.
- source_word: עֵדוּת
  choice: Témoignage
  rationale: Le terme peut être une indication liturgique ou musicale distincte. Une traduction directe préserve l’incertitude de sa fonction exacte.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: 'Cette attribution traditionnelle laisse ouverte la relation précise avec Asaph: auteur, destinataire, association ou appartenance à une collection.'
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Équivalent français usuel du genre désignant une composition chantée avec accompagnement musical.
