  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/006.yaml
  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: fr
  text: Tu fais de nous un sujet de dispute pour nos voisins, et nos ennemis se moquent d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens suggéré par le contexte : « se moquent de nous ». Le pronom hébreu signifie littéralement « d’eux » et peut renvoyer aux voisins.'
    reason: Préserver l’ambiguïté entre le référent grammatical le plus proche et la cible de la moquerie suggérée par le contexte.
lexical_decisions:
- source_word: מָדוֹן
  choice: un sujet de dispute
  rationale: Le nom désigne une querelle ou une discorde. Dans cette construction, « un sujet de dispute » exprime naturellement en français que le peuple devient l’objet autour duquel les voisins se querellent.
- source_word: לִשְׁכֵנֵינוּ
  choice: pour nos voisins
  rationale: La préposition ל est rendue sans surinterpréter la nature exacte de la dispute; « nos voisins » conserve le sens relationnel direct de שְׁכֵנֵינוּ.
- source_word: יִלְעֲגוּ
  choice: se moquent
  rationale: Le verbe לעג exprime la raillerie ou la dérision; « se moquent » est actuel, clair et fidèle.
- source_word: לָמוֹ
  choice: d’eux
  rationale: Cette forme pronominale poétique est à la troisième personne du pluriel et renvoie le plus naturellement au groupe pluriel précédemment mentionné, « nos voisins », même si le contexte peut inciter à comprendre que la raillerie vise le peuple.
theological_decisions:
- issue: Référent de לָמוֹ
  choice: d’eux, avec une note signalant l’autre compréhension contextuelle
  alternative: de nous
  rationale: La morphologie hébraïque indique la troisième personne (« eux »), tandis que le mouvement du psaume rend « nous » contextuellement plausible. Le texte principal respecte la forme grammaticale sans supprimer la tension interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La formulation reste accessible tout en conservant l’étrangeté significative du pronom final.
