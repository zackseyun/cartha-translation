  text: יְכַרְסְמֶ֣/נָּֽה חֲזִ֣יר מִ/יָּ֑ וְ/זִ֖יז שָׂדַ֣י יִרְעֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/013.yaml
  text: A boar from the forest tears it down[b][a], and the wild animals of the field feed on it.
translation:
  language: fr
  text: Le sanglier de la forêt la ravage[a], et les animaux des champs s’en nourrissent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ronge » ou « la dépouille »; le verbe hébreu rare décrit une consommation qui détruit.
    reason: lexical_alternative
  - marker: b
    text: Ou « les bêtes des champs paissent sur elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: la ravage
  rationale: Le verbe rare כרסם évoque une consommation destructrice, comme lorsqu’un animal ronge ou dépouille une plante. « La ravage » exprime naturellement en français les dégâts infligés à la vigne sans réduire le sens au simple fait de manger.
- source_word: חֲזִיר
  choice: le sanglier
  rationale: חֲזִיר désigne un porc; la provenance « de la forêt » indique ici l’animal sauvage. « Sanglier » est précis et naturel.
- source_word: מִיָּעַר
  choice: de la forêt
  rationale: La préposition מִן indique la provenance. « De la forêt » restitue sobrement cette relation.
- source_word: זִיז שָׂדַי
  choice: les animaux sauvages des champs
  rationale: זִיז est un nom rare désignant des créatures vivantes ou mouvantes, ici dans un cadre sauvage. L’expression française choisie est claire et idiomatique, tout en conservant l’image des animaux des espaces ouverts.
- source_word: יִרְעֶנָּה
  choice: s’en nourrissent
  rationale: Le verbe רעה signifie couramment paître ou se nourrir. Avec son suffixe féminin renvoyant à la vigne, « s’en nourrissent » rend naturellement l’action sans préciser indûment la manière de manger.
