  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: fr
  text: Tu as dégagé le terrain devant elle[a] ; elle a pris racine[b] et rempli le pays[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu lui as préparé de la place ». Le verbe hébreu peut évoquer l’action de faire de la place ou de préparer le terrain devant la vigne.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « elle a fait prendre racine à ses racines », expression hébraïque indiquant qu’elle s’est solidement établie.'
    reason: lexical_alternative
  - marker: c
    text: Ou « la terre », selon que le terme hébreu est compris dans un sens local ou plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Tu as dégagé le terrain devant elle
  rationale: Le piel de פנה avec לְפָנֶיהָ exprime ici l’action de libérer ou préparer l’espace devant la vigne. « Dégagé le terrain » rend naturellement l’image agricole, tandis que « elle » reprend la vigne, nom féminin en français comme en hébreu.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: elle a pris racine
  rationale: Littéralement, la construction dit qu’elle « a enraciné ses racines ». L’expression française « prendre racine » restitue l’idée d’un établissement ferme sans ajouter l’intensité absente du texte.
- source_word: וַתְּמַלֵּא אָרֶץ
  choice: et rempli le pays
  rationale: מלא signifie « remplir ». Dans le contexte de la vigne représentant Israël et de son expansion territoriale, « le pays » est le sens contextuel le plus probable de אֶרֶץ, tout en laissant en note l’autre portée possible.
theological_decisions:
- issue: Référent de la vigne
  choice: Conserver la métaphore et le pronom féminin sans expliciter Israël dans le verset
  alternative: Remplacer la vigne par « Israël »
  rationale: Le contexte identifie la vigne à Israël, mais ce verset poursuit directement l’image agricole. L’expliciter dans le texte supprimerait un élément poétique présent dans l’hébreu.
- issue: Portée de אָרֶץ
  choice: le pays
  alternative: la terre
  rationale: Le cadre historique et territorial favorise « le pays », mais le mot hébreu peut avoir une portée plus large ; cette ambiguïté lexicale est donc signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en relief la succession des actions. Le féminin « elle » maintient clairement la référence à la vigne du contexte précédent.
