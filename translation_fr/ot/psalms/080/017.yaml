id: PSA.80.17
reference: Psalms 80:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּֽהִי יָ֭דְ/ךָ עַל אִ֣ישׁ יְמִינֶ֑/ךָ עַל בֶּן אָ֝דָ֗ם אִמַּ֥צְתָּ לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/017.yaml
  text: Let your hand be upon the man of your right hand[b][a], upon the son of man whom you have made strong for yourself.
translation:
  language: fr
  text: Que ta main soit sur l’homme de ta droite[a], sur le fils de l’homme[b] que tu as fortifié pour toi-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme qui est à ta droite ». L’expression hébraïque peut désigner celui que Dieu favorise, soutient ou place à sa droite.
    reason: lexical_alternative
  - marker: b
    text: « Fils de l’homme » peut simplement signifier « être humain », tout en pouvant aussi avoir ici une résonance royale ou messianique.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: Que … soit
  rationale: Le jussif de היה exprime ici un souhait ou une prière ; cette tournure française en conserve naturellement la force.
- source_word: יָדְךָ
  choice: ta main
  rationale: Conserve l’image concrète de la main, qui peut évoquer le soutien et la puissance sans les expliciter à la place du texte.
- source_word: עַל
  choice: sur
  rationale: Équivalent naturel qui garde l’image de la main posée ou agissant en faveur de quelqu’un.
- source_word: אִישׁ יְמִינֶךָ
  choice: l’homme de ta droite
  rationale: 'Cette formulation assez formelle préserve l’étrangeté et l’ambiguïté de l’expression hébraïque : l’homme associé à la droite de Dieu, favorisé ou soutenu par elle. « L’homme qui est à ta droite » reste possible.'
- source_word: בֶּן אָדָם
  choice: le fils de l’homme
  rationale: Conserve le singulier masculin et l’expression littéraire, sans décider si elle désigne simplement un être humain ou porte ici une résonance royale ou messianique.
- source_word: אִמַּצְתָּ
  choice: tu as fortifié
  rationale: Le piel de אמץ indique que Dieu a rendu cet homme fort ou ferme ; « fortifié » exprime clairement ce sens causatif et accompli.
- source_word: לָּךְ
  choice: pour toi-même
  rationale: Rend la relation ou la destination exprimée par la préposition suffixée, avec sa possible nuance d’appartenance ou de dessein divin.
theological_decisions:
- issue: Faut-il présenter « l’homme de ta droite » et « le fils de l’homme » comme un titre messianique explicite ?
  choice: Maintenir une formulation poétique sans majuscules titulaires ni précision messianique.
  alternative: Rendre explicitement par une désignation du Messie, ou comprendre le personnage comme une représentation collective d’Israël.
  rationale: Le contexte peut recevoir des lectures collective, royale ou messianique, mais l’hébreu du verset ne tranche pas explicitement entre elles. La traduction préserve donc cette tension.
translation_notes:
  register: Français moderne, digne et poétique. Le tutoiement correspond à l’adresse directe à Dieu. La syntaxe conserve le parallélisme hébraïque et ses ambiguïtés essentielles.
