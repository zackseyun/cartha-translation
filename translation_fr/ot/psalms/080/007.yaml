source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/007.yaml
  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: fr
  text: Dieu des armées[a], ramène-nous[b] ; fais briller ton visage[c], et nous serons sauvés[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque peut désigner les armées terrestres ou célestes et, plus largement, les puissances placées sous le commandement de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « rétablis-nous » ou « fais-nous revenir ». Le verbe hébreu peut exprimer aussi bien le retour que le rétablissement.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ton visage ». Cette image évoque la présence favorable de Dieu.
    reason: lexical_alternative
  - marker: d
    text: Ou « nous serons délivrés ». Le terme hébreu peut désigner largement le secours, la délivrance ou le salut.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est ici employé comme une adresse directe au Dieu d’Israël. En français, « Dieu » suffit sans particule vocative.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette expression conserve l’image du titre hébreu sans limiter explicitement les armées aux forces humaines ou célestes.
- source_word: הֲשִׁיבֵנוּ
  choice: ramène-nous
  rationale: La forme causative de שוב signifie faire revenir ou rétablir. « Ramène-nous » garde au premier plan l’idée de retour tout en permettant un sens géographique, spirituel ou relationnel.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: fais briller ton visage sur nous
  rationale: La forme causative de אור appelle « fais briller ». L’ajout idiomatique « sur nous » rend naturelle en français l’image du visage divin qui rayonne favorablement, sans remplacer l’image concrète du texte.
- source_word: וְנִוָּשֵׁעָה
  choice: et nous serons sauvés
  rationale: La forme passive de ישׁע exprime ici le salut ou la délivrance qui résultera de l’intervention favorable de Dieu. « Sauvés » en maintient toute l’étendue.
theological_decisions:
- issue: Portée du titre אֱלֹהִים צְבָאוֹת
  choice: Dieu des armées
  alternative: Dieu de l’univers ; Dieu des armées célestes
  rationale: « Des armées » préserve l’image et l’amplitude du titre hébreu. « Célestes » en restreindrait le référent, tandis que « de l’univers » expliciterait la souveraineté divine mais effacerait la métaphore militaire.
- issue: Nature du retour demandé par הֲשִׁיבֵנוּ
  choice: ramène-nous
  alternative: rétablis-nous ; fais-nous revenir
  rationale: Le contexte ne précise pas si le retour est territorial, spirituel ou lié au rétablissement de la faveur divine. La formulation choisie conserve cette ouverture.
- issue: Portée du salut en וְנִוָּשֵׁעָה
  choice: nous serons sauvés
  alternative: nous serons délivrés
  rationale: Le verbe peut désigner largement le secours, la délivrance ou le salut. « Sauvés » conserve sa résonance théologique sans exclure une délivrance historique concrète.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve les images bibliques du titre divin et du visage qui brille, tandis que les notes signalent leurs nuances sans résoudre les ambiguïtés du texte hébreu.
