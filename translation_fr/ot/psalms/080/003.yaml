  text: אֱלֹהִ֥ים הֲשִׁיבֵ֑/נוּ וְ/הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/003.yaml
  text: God[a], restore us, and make your face shine[c][b], that we may be saved.
translation:
  language: fr
  text: Dieu, ramène-nous[a], fais briller ton visage[b], et nous serons sauvés[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fais-nous revenir » ou « rétablis-nous ». Le verbe hébreu peut signifier faire revenir quelqu’un.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fais briller ton visage », image de la faveur et de la présence divines ; voir la bénédiction sacerdotale en Nombres 6.25.
    reason: cross_reference
  - marker: c
    text: Ou « afin que nous soyons sauvés ». La forme hébraïque peut exprimer soit le résultat demandé dans la prière, soit l’assurance de ce résultat.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le pluriel morphologique désigne ici, au singulier, le Dieu d’Israël. « Dieu » convient naturellement à l’adresse directe sans qu’il soit nécessaire d’ajouter « ô ».
- source_word: הֲשִׁיבֵנוּ
  choice: ramène-nous
  rationale: 'Le hifil de שוב a une valeur causative : faire revenir ou ramener. « Ramène-nous » conserve cette image, tout en pouvant évoquer à la fois le retour vers Dieu et le rétablissement du peuple.'
- source_word: וְהָאֵר פָּנֶיךָ
  choice: Fais briller ton visage sur nous
  rationale: Le hifil impératif de אור signifie « faire briller ». Le maintien de « visage » préserve l’image hébraïque de la présence et de la faveur divines. « Sur nous » explicite en français la direction naturellement impliquée par cette expression idiomatique et son écho sacerdotal.
- source_word: וְנִוָּשֵׁעָה
  choice: et nous serons sauvés
  rationale: La forme nifal à nuance volitive peut exprimer le résultat souhaité des impératifs précédents. La coordination française conserve l’ambiguïté entre espérance confiante et conséquence demandée; une note signale la lecture finale possible.
theological_decisions:
- issue: Nuance volitive du dernier verbe après les impératifs
  choice: « et nous serons sauvés »
  alternative: « afin que nous soyons sauvés »
  rationale: La forme hébraïque peut s’entendre comme le résultat recherché ou comme l’affirmation confiante de ce résultat. Le texte principal garde une coordination proche de l’hébreu, tandis que la note préserve explicitement la lecture de but.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le tutoiement correspond à l’adresse biblique à Dieu. L’impératif et l’image du visage lumineux sont conservés; la ponctuation souligne la prière sans ajouter d’interjection absente de l’hébreu.
