review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu présente deux participes féminins singuliers (« brûlée par le feu, coupée »), puis un verbe au pluriel, « ils périssent ». Le projet rend correctement les participes et conserve l’image de la face, mais transforme injustement le pluriel final en singulier (« elle périt »).
  naturalness: « Sous la menace de ta face » est peu idiomatique en français et altère légèrement le sens de גַּעֲרָה, qui est une réprimande, un blâme ou une injonction sévère, non la menace elle-même. « À la réprimande de ta face » reste proche de l’hébreu mais sonne raide; « Devant ta réprimande, ils périssent » est naturel tout en gardant l’image dans une note.
  terminology: « Brûlée par le feu, coupée » convient au registre poétique. « Réprimande » rend plus exactement גַּעֲרָה que « menace ». Le pluriel de יֹאבֵדוּ doit être maintenu sans identifier doctrinalement son référent; une note peut signaler l’ambiguïté et le décalage avec les participes féminins.
  issues:
  - severity: medium
    issue: Nombre du verbe final modifié
    rationale: יֹאבֵדוּ est un pluriel (« ils périssent »). Le singulier collectif « elle périt » lisse une particularité textuelle et tranche sans nécessité le référent du pluriel.
  - severity: medium
    issue: « sous la menace de ta face »
    rationale: Cette formulation est inhabituelle en français et « menace » ne rend pas avec précision גַּעֲרָה (« réprimande », « blâme sévère »). La préposition « sous » déplace aussi la relation exprimée par מִן, ici causalement ou à l’approche/devant la réprimande.
  revised_text: Brûlée par le feu, coupée — devant ta réprimande, ils périssent.[a]
  revised_footnotes:
