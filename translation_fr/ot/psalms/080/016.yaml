  text: שְׂרֻפָ֣ה בָ/אֵ֣שׁ כְּסוּחָ֑ה מִ/גַּעֲרַ֖ת פָּנֶ֣י/ךָ יֹאבֵֽדוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: fr
  text: Brûlée par le feu, coupée — devant ta réprimande, ils périssent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit « ils périssent », au pluriel, après deux formes féminines singulières (« brûlée », « coupée »). Le pluriel peut viser les éléments de la vigne figurée ou des personnes liées à elle; le texte ne le précise pas.
    reason: Préserve et explique le changement de nombre du texte source sans imposer un référent interprétatif.
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: Brûlée par le feu
  rationale: Le participe passif féminin singulier renvoie naturellement à la vigne évoquée dans le contexte et conserve la formulation concise de l’hébreu.
- source_word: כְּסוּחָה
  choice: coupée
  rationale: Le terme désigne ce qui a été tranché ou abattu. « Coupée » reste simple et laisse le contexte préciser qu’il s’agit de la vigne.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: sous la menace de ta face
  rationale: « Menace » exprime la réprimande puissante portée par גְּעָרָה, tandis que « ta face » conserve l’image hébraïque plutôt que de l’aplanir en « ta présence » ou « ton regard ».
- source_word: יֹאבֵדוּ
  choice: elle périt
  rationale: Le verbe est formellement au pluriel (« ils périssent »), mais le français reprend naturellement le référent collectif féminin, la vigne. Cette adaptation évite un pluriel sans antécédent explicite dans le verset isolé.
theological_decisions:
- issue: Image de la face divine
  choice: ta face
  alternative: ta présence / ton regard
  rationale: La traduction maintient l’anthropomorphisme biblique et ne précise pas davantage la manière dont s’exerce le jugement divin.
- issue: Nombre grammatical du dernier verbe
  choice: elle périt
  alternative: ils périssent
  rationale: Le pluriel hébreu peut viser les éléments de la vigne ou ses responsables, mais leur identité demeure implicite. Le singulier collectif produit un français intelligible tout en maintenant la vigne comme référent immédiat.
translation_notes:
  register: Formulation poétique, concise et solennelle en français moderne. Le tiret reproduit l’enchaînement abrupt des deux participes vers la cause du dépérissement.
