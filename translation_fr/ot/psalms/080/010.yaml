  text: כָּסּ֣וּ הָרִ֣ים צִלָּ֑/הּ וַ֝/עֲנָפֶ֗י/הָ אַֽרְזֵי אֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/010.yaml
  text: The mountains were covered by its shade[a], and its branches were like the cedars of God.
translation:
  language: fr
  text: Les montagnes étaient couvertes de son ombre, et ses branches couvraient les cèdres de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de puissants cèdres ». L’expression hébraïque « cèdres de Dieu » peut exprimer la grandeur ou la majesté.
    reason: Alternative lexicale liée à la valeur possiblement superlative de אַרְזֵי אֵל.
lexical_decisions:
- source_word: כָּסּוּ
  choice: étaient couvertes
  rationale: Le qal accompli 3e personne du pluriel de כסה a pour sujet « les montagnes »; en français, la tournure passive rend naturellement l’idée qu’elles étaient recouvertes par l’ombre de la vigne.
- source_word: הָרִים
  choice: les montagnes
  rationale: Traduction directe du nom pluriel défini.
- source_word: צִלָּהּ
  choice: son ombre
  rationale: צל peut désigner l’ombre ou l’ombrage. « Son ombre » est idiomatique en français et conserve l’image de la vigne qui s’étend sur les montagnes.
- source_word: וַעֲנָפֶיהָ
  choice: et ses branches
  rationale: ענף désigne les branches ou les rameaux; « branches » est clair, courant et fidèle à l’image végétale.
- source_word: אַרְזֵי אֵל
  choice: les cèdres de Dieu
  rationale: 'La formulation littérale maintient le génitif hébreu et son ambiguïté: elle peut évoquer les cèdres majestueux appartenant à Dieu ou constituer une tournure superlative signifiant « des cèdres imposants ».'
theological_decisions:
- issue: Interprétation de אֵל dans l’expression אַרְזֵי אֵל
  choice: Conserver « les cèdres de Dieu » dans le texte principal.
  alternative: « les cèdres les plus imposants » ou « de puissants cèdres »
  rationale: L’hébreu emploie explicitement le nom divin אֵל, mais ce type de construction peut aussi exprimer un degré exceptionnel. La traduction littérale préserve cette tension sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du parallélisme poétique hébreu; « ombre » et « branches » sont immédiatement compréhensibles. Le marqueur de note est placé après l’expression ambiguë qu’il explique.
