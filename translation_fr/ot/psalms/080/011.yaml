  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: fr
  text: Elle déployait ses branches[a] jusqu’à la mer, et ses jeunes pousses vers le Fleuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « branches » est inhabituel ici et peut désigner plus largement la ramure ou la croissance déployée de la vigne.
    reason: lexical_alternative
  - marker: b
    text: « Le Fleuve » désigne probablement l’Euphrate, évoquant l’étendue idéale du territoire d’Israël, de la mer jusqu’au Fleuve.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: elle étendait
  rationale: Le piel de שלח décrit ici la vigne qui déploie sa croissance. « Étendait » rend naturellement l’image et la portée spatiale indiquée par עַד.
- source_word: קְצִירֶהָ
  choice: ses branches
  rationale: Ce terme rare dans ce contexte semble désigner ce que la vigne déploie, probablement ses branches ou, plus généralement, sa ramure. « Branches » est clair, courant et convient au parallélisme.
- source_word: עַד יָם
  choice: jusqu’à la mer
  rationale: עַד exprime ici l’étendue atteinte. Dans l’évocation territoriale du psaume, la mer est vraisemblablement la Méditerranée.
- source_word: וְאֶל נָהָר
  choice: jusqu’au Fleuve
  rationale: Dans les formules territoriales bibliques, « le Fleuve » désigne vraisemblablement l’Euphrate. La majuscule signale ce référent géographique probable sans l’inscrire explicitement dans le corps du verset.
- source_word: יוֹנְקוֹתֶיהָ
  choice: ses jeunes pousses
  rationale: Le nom évoque une croissance nouvelle issue de la vigne. « Jeunes pousses » est naturel en français moderne et distingue ce terme de « branches » dans le premier membre.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. L’imparfait maintient la continuité narrative avec l’image de la vigne développée dans le contexte. La répétition de « jusqu’à » explicite le parallélisme spatial, tandis que « Fleuve » conserve l’allusion géographique probable.
