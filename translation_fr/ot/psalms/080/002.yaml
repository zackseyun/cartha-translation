id: PSA.80.2
reference: Psalms 80:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/פְנֵ֤י אֶפְרַ֨יִם וּ/בִנְיָ֘מִ֤ן וּ/מְנַשֶּׁ֗ה עוֹרְרָ֥/ה אֶת גְּבֽוּרָתֶ֑/ךָ וּ/לְכָ֖/ה לִ/ישֻׁעָ֣תָ/ה לָּֽ/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/002.yaml
  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: fr
  text: Devant Éphraïm, Benjamin et Manassé, réveille ta puissance[b] et viens nous sauver[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « va pour notre salut ». Le verbe hébreu signifie littéralement « aller » ou « marcher », mais il exprime ici un appel à l’intervention de Dieu en faveur de son peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta force » ou « ta vaillance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: Devant
  rationale: Le sens spatial convient à l’image de Dieu qui se manifeste ou marche devant ces tribus. « Devant » reste simple et proche de l’hébreu.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Éphraïm, Benjamin et Manassé
  rationale: Les noms des tribus sont translittérés selon leur forme française usuelle. La coordination répétée de l’hébreu est naturellement rendue par une énumération française.
- source_word: עוֹרְרָה
  choice: réveille
  rationale: L’impératif appelle Dieu à mettre sa puissance en action. « Réveille » conserve la métaphore de l’hébreu sans l’expliciter davantage.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: ta puissance
  rationale: גְּבוּרָה désigne la force ou la puissance agissante. « Ta puissance » est naturel, digne et adapté à cette prière.
- source_word: וּלְכָה
  choice: et viens
  rationale: Bien que le verbe הלך signifie littéralement « aller, marcher », l’appel adressé à Dieu demande ici son intervention auprès du peuple; « viens » exprime naturellement ce mouvement vers les suppliants.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: nous sauver
  rationale: 'La construction exprime le but de la venue demandée: le salut ou la délivrance du peuple. La formulation verbale est idiomatique en français et conserve la force de la supplication.'
theological_decisions:
- issue: Nature de l’action divine demandée dans la prière
  choice: Un appel direct à Dieu pour qu’il mette sa puissance en action et vienne sauver son peuple.
  alternative: « Réveille ta force et va pour notre salut. »
  rationale: Le verset est une supplication. La traduction conserve son urgence et l’image de la puissance divine éveillée, sans ajouter d’explication doctrinale ni effacer la nuance de mouvement du texte hébreu.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. « Réveille ta puissance » maintient la métaphore hébraïque, tandis que « viens nous sauver » donne une formulation française naturelle à la demande finale.
