id: PSA.80.4
reference: Psalms 80:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהִ֣ים צְבָא֑וֹת עַד מָתַ֥י עָ֝שַׁ֗נְתָּ בִּ/תְפִלַּ֥ת עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: fr
  text: Yahweh, Dieu des armées, jusqu’à quand fumeras-tu de colère contre la prière de ton peuple[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « fumer contre la prière de ton peuple ». La fumée évoque ici la colère qui s’élève ou éclate.
    reason: Précise l’image littérale portée par le verbe hébreu et l’explicitation « de colère » dans le texte.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Dieu des armées
  rationale: Rend le titre divin de manière claire et actuelle, sans préciser indûment s’il s’agit d’armées terrestres ou célestes.
- source_word: עַד מָתַי
  choice: jusqu’à quand
  rationale: Formule française naturelle de lamentation, qui conserve l’urgence de la question hébraïque.
- source_word: עָשַׁנְתָּ
  choice: fumeras-tu de colère
  rationale: Conserve l’image concrète de la fumée tout en explicitant en français son sens idiomatique de colère.
- source_word: בִּתְפִלַּת
  choice: contre la prière
  rationale: Interprète la préposition בְּ dans son rapport adversatif avec le verbe évoquant la colère.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: Conserve le sens collectif et relationnel de l’expression hébraïque.
theological_decisions:
- issue: Rendu du titre יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Yahweh, Dieu des armées
  alternative: Yahweh, Dieu de l’univers
  rationale: Le choix maintient le nom divin et la portée militaire ou cosmique de צְבָאוֹת sans réduire celle-ci à une seule interprétation.
- issue: Maintien de la métaphore de la fumée associée à la colère divine
  choice: fumeras-tu de colère contre la prière
  alternative: seras-tu irrité contre la prière
  rationale: 'La formulation française reste intelligible tout en préservant l’image anthropomorphique forte et la tension de la plainte : même la prière du peuple rencontre la colère divine.'
translation_notes:
  register: Français moderne, digne et poétique. « Fumer de colère » est une tournure expressive compréhensible qui conserve l’image hébraïque; « Dieu des armées » maintient le titre traditionnel sans en restreindre la portée.
