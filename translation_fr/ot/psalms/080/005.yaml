  text: הֶ֭אֱכַלְתָּ/ם לֶ֣חֶם דִּמְעָ֑ה וַ֝/תַּשְׁקֵ֗/מוֹ בִּ/דְמָע֥וֹת שָׁלִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/005.yaml
  text: You have fed them bread of tears[a], and given them tears to drink in full measure.
translation:
  language: fr
  text: Tu leur as donné à manger du pain de larmes, et tu leur as fait boire des larmes en abondance.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le dernier terme hébreu peut être compris comme « par une mesure de trois » ou « en triple mesure »; il semble désigner une grande quantité, mais son sens précis reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Tu leur as donné pour nourriture
  rationale: Le hiphil de אכל avec suffixe de troisième personne du pluriel exprime l’action de faire manger ou de nourrir. Cette formulation française est naturelle et conserve la valeur causative.
- source_word: לֶחֶם דִּמְעָה
  choice: un pain de larmes
  rationale: La traduction garde l’image concrète du « pain » et son association directe aux larmes, sans la réduire à une nourriture prise dans les pleurs.
- source_word: וַתַּשְׁקֵמוֹ
  choice: et tu leur as fait boire
  rationale: Le hiphil de שקה signifie « donner à boire » ou « faire boire ». « Faire boire » préserve ici clairement la valeur causative et le parallélisme avec la nourriture.
- source_word: בִּדְמָעוֹת
  choice: des larmes
  rationale: Avec le verbe « boire », la préposition hébraïque introduit la substance donnée à boire; le français emploie naturellement le complément direct.
- source_word: שָׁלִישׁ
  choice: à pleine mesure
  rationale: Le terme désigne ici une mesure obscure, probablement importante. Cette traduction communique l’abondance sans prétendre identifier avec certitude une unité technique.
