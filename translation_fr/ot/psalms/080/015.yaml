source:
  edition: WLC
  text: וְ֭/כַנָּה אֲשֶׁר נָטְעָ֣ה יְמִינֶ֑/ךָ וְ/עַל בֵּ֝֗ן אִמַּ֥צְתָּה לָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/015.yaml
  text: and the stock that your right hand planted[b][a], and the son whom you made strong for yourself—
translation:
  language: fr
  text: 'et la souche[a] que ta main droite a plantée,

    et le fils[b] que tu as rendu fort pour toi-même —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rejeton », « le rameau » ou « le porte-greffe ». Le terme hébreu est rare et s’inscrit ici dans l’image de la vigne.
    reason: lexical_alternative
  - marker: b
    text: Ou « le rameau ». L’hébreu dit « fils », mais certains comprennent ce mot métaphoriquement dans l’image de la vigne, ou comme une désignation collective d’Israël.
    reason: alternative_reading
lexical_decisions:
- source_word: כַנָּה
  choice: souche
  rationale: Ce nom rare appartient ici à l’image de la vigne. « Souche » conserve la métaphore végétale sans préciser indûment s’il s’agit d’un rejeton ou d’un rameau.
- source_word: נָטְעָה
  choice: a plantée
  rationale: Le verbe signifie couramment « planter » et prolonge directement l’image viticole du psaume.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: La formulation concrète de l’hébreu est conservée afin de maintenir l’image de l’action puissante de Dieu.
- source_word: וְעַל
  choice: et
  rationale: Dans cette construction parallèle, le français coordonne naturellement les deux compléments par « et », sans alourdir la phrase avec une préposition supplémentaire.
- source_word: בֵּן
  choice: fils
  rationale: Le sens lexical direct est « fils ». Ce choix préserve la personnification et la possible portée collective sans transformer explicitement le terme en élément botanique.
- source_word: אִמַּצְתָּה
  choice: as rendu fort
  rationale: Cette forme causative exprime l’action de fortifier ou de rendre ferme. « Rendu fort » conserve clairement cette valeur.
- source_word: לָּךְ
  choice: pour toi-même
  rationale: Cette expression rend la relation d’intérêt ou de destination marquée par le pronom et souligne que l’action répond au dessein propre de Dieu.
theological_decisions:
- issue: Identité du « fils » dans la métaphore de la vigne
  choice: Conserver « le fils » sans préciser son identité dans le texte principal.
  alternative: « le rameau », une désignation collective d’Israël, ou une lecture typologique ou messianique explicite.
  rationale: Le contexte immédiat présente Israël sous l’image d’une vigne, mais l’hébreu emploie bien le mot « fils ». La traduction maintient donc la tension entre métaphore végétale, personnification collective et lectures théologiques possibles, sans en imposer une.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé sur deux lignes, ainsi que le tiret final signalant la continuité de la supplication.
