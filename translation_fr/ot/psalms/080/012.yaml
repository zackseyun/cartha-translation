id: PSA.80.12
reference: Psalms 80:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ֭/מָּה פָּרַ֣צְתָּ גְדֵרֶ֑י/הָ וְ֝/אָר֗וּ/הָ כָּל עֹ֥בְרֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: fr
  text: Pourquoi as-tu ouvert des brèches dans ses clôtures[a], si bien que tous les passants en cueillent les fruits[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ses murs » ou « dans ses haies » ; l’hébreu désigne l’enceinte qui protège une vigne.
    reason: lexical_alternative
  - marker: b
    text: Ou « la dépouillent » ; le verbe hébreu évoque le fait de cueillir ce que porte la vigne.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: L’adverbe interrogatif introduit une plainte adressée directement à Dieu ; « Pourquoi » est l’équivalent français naturel.
- source_word: פָּרַצְתָּ
  choice: as-tu ouvert des brèches
  rationale: Le verbe פרץ signifie percer ou faire une brèche. Dans le contexte d’une vigne protégée, cette formulation exprime la suppression de l’enceinte sans évoquer à tort la destruction de murailles urbaines.
- source_word: גְדֵרֶיהָ
  choice: ses clôtures
  rationale: גדר désigne l’enceinte protectrice d’une vigne, qui pouvait être une clôture, un mur ou une haie. « Clôtures » conserve cette image sans préciser indûment sa construction.
- source_word: וְאָרוּהָ
  choice: en cueillent les fruits
  rationale: Le verbe ארה évoque l’action de cueillir ou de dépouiller une plante de ses produits. « Les fruits » explicite en français l’objet implicite, tandis que le pronom « en » renvoie à la vigne du contexte.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: tous les passants
  rationale: Expression idiomatique et concise pour « tous ceux qui passent par le chemin », adaptée au registre poétique moderne.
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Conserver le renvoi à la vigne par « ses » et « en »
  alternative: Remplacer directement la vigne par Israël
  rationale: Le contexte immédiat représente Israël sous l’image d’une vigne. Maintenir cette métaphore préserve la tension poétique et évite de transformer l’image en explication.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure interrogative conserve la plainte du texte, et l’image viticole reste explicite grâce aux clôtures et à la cueillette.
