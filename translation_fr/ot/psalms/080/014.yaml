id: PSA.80.14
reference: Psalms 80:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֱלֹהִ֣ים צְבָאוֹת֮ שֽׁ֫וּב נָ֥א הַבֵּ֣ט מִ/שָּׁמַ֣יִם וּ/רְאֵ֑ה וּ֝/פְקֹ֗ד גֶּ֣פֶן זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: fr
  text: Dieu des armées, reviens, je t’en prie ! Du ciel, regarde et vois ; prends soin de cette vigne[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « interviens en faveur de cette vigne » ou « visite cette vigne ». Le verbe hébreu peut signifier « visiter », « s’occuper de », « prendre soin de » ou « inspecter » ; ici, il s’agit d’intervenir pour le bien de la vigne.
    reason: alternative lexicale
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Dieu des armées
  rationale: Cette expression conserve l’image de Dieu commandant les armées célestes et évite de la remplacer par le titre plus interprétatif « Dieu tout-puissant ».
- source_word: שׁוּב נָא
  choice: reviens, je t’en prie
  rationale: שׁוּב exprime ici le retour de Dieu vers son peuple, tandis que נָא marque une supplication ; « je t’en prie » rend naturellement cette nuance en français.
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: Du ciel, regarde
  rationale: La formulation garde l’origine céleste du regard sans devoir ajouter explicitement « en bas », déjà impliqué par le contexte spatial.
- source_word: וּרְאֵה
  choice: et vois
  rationale: L’impératif simple est conservé ainsi que la succession poétique des verbes de perception.
- source_word: וּפְקֹד
  choice: prends soin de
  rationale: Dans cette supplication, פקד demande une intervention favorable. « Prends soin de » est clair en français moderne tout en laissant en note l’éventail possible du verbe.
- source_word: גֶּפֶן זֹאת
  choice: cette vigne
  rationale: Le nom désigne une vigne au singulier, et non un vignoble ; cette traduction préserve précisément la métaphore d’Israël développée dans le psaume.
theological_decisions:
- issue: Traduction du titre divin
  choice: Dieu des armées
  alternative: Dieu tout-puissant
  rationale: Le titre hébreu évoque directement les armées ou puissances placées sous le commandement de Dieu. La traduction retenue préserve cette image sans lui substituer un titre théologique plus général.
- issue: Sens de l’intervention divine demandée
  choice: prends soin de cette vigne
  alternative: visite cette vigne
  rationale: Le contexte appelle une intervention bienveillante en faveur de la vigne représentant le peuple. « Prends soin de » exprime ce sens sans faire de la « visite » une simple présence ni préciser davantage la forme de l’intervention.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe et les impératifs conservent l’intensité de la supplication ; le point d’exclamation marque la prière pressante sans alourdir la syntaxe.
