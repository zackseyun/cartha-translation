id: PSA.80.8
reference: Psalms 80:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גֶּ֭פֶן מִ/מִּצְרַ֣יִם תַּסִּ֑יעַ תְּגָרֵ֥שׁ גּ֝וֹיִ֗ם וַ/תִּטָּעֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/008.yaml
  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: fr
  text: Tu as fait sortir d’Égypte une vigne[a][b] ; tu as chassé des nations et tu l’as plantée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as fait partir d’Égypte une vigne », ou « tu as arraché d’Égypte une vigne pour la transplanter ». Le verbe hébreu peut évoquer un départ provoqué, un enlèvement ou une transplantation.
    reason: lexical_alternative
  - marker: b
    text: La vigne représente Israël.
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  choice: une vigne
  rationale: Le nom désigne la vigne. L’article indéfini convient naturellement en français et maintient sans l’expliciter la métaphore qui représente Israël.
- source_word: מִמִּצְרַיִם
  choice: d’Égypte
  rationale: La préposition indique la provenance. Avec « faire sortir », « d’Égypte » exprime naturellement l’origine et évoque l’Exode.
- source_word: תַּסִּיעַ
  choice: tu as fait sortir
  rationale: Le hiphil de נסע peut exprimer l’action de faire partir, d’enlever ou de transplanter. Dans l’image de la vigne et de l’Exode, « faire sortir » rend clairement le déplacement sans effacer entièrement la possibilité d’un déracinement, signalée en note.
- source_word: תְּגָרֵשׁ
  choice: tu as chassé
  rationale: Le piel de גרש signifie chasser ou expulser. « Chasser » est ici direct, vigoureux et idiomatique.
- source_word: גּוֹיִם
  choice: des nations
  rationale: Dans le contexte de la prise du pays, « nations » restitue le sens sans introduire la connotation plus tardive de « païens » ou de « non-Juifs ».
- source_word: וַתִּטָּעֶהָ
  choice: et tu l’as plantée
  rationale: Le suffixe renvoie à « vigne », nom féminin en hébreu comme en français. L’accord féminin est donc naturel et conserve l’image végétale.
theological_decisions:
- issue: Identification métaphorique de la vigne
  choice: Conserver « une vigne » dans le texte principal et préciser en note qu’elle représente Israël.
  alternative: Remplacer la métaphore par « Israël ».
  rationale: L’hébreu exprime l’identité d’Israël au moyen d’une métaphore. La rendre explicite dans le texte principal substituerait une interprétation à l’image poétique.
- issue: Portée du verbe תַּסִּיעַ
  choice: Employer « tu as fait sortir » tout en présentant les autres nuances en note.
  alternative: « tu as fait partir », « tu as enlevé » ou « tu as arraché pour transplanter ».
  rationale: Le verbe peut évoquer à la fois le départ et l’enlèvement d’une plante. Le contexte associe l’Exode à la transplantation de la vigne ; la note préserve cette tension lexicale.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme verbal est conservé, ainsi que la métaphore agricole filée. Le passé composé donne une narration naturelle en français actuel.
