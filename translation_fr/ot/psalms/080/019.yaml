source:
  edition: WLC
  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: fr
  text: Yahweh, Dieu des armées, rétablis-nous[a] ! Fais briller ton visage sur nous, et nous serons sauvés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fais-nous revenir »; ou : « ramène-nous ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que nous soyons sauvés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel et préserve son caractère d’alliance, conformément au texte hébreu.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Titre divin en apposition à Yahweh dans la formule d’adresse.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend concrètement le pluriel צבאות, qui désigne les armées ou puissances placées sous le commandement divin; « des puissances » serait plus interprétatif.
- source_word: הֲשִׁיבֵנוּ
  choice: rétablis-nous
  rationale: Le hiphil impératif de שוב peut signifier faire revenir ou restaurer. Dans le refrain du psaume, « rétablis-nous » exprime naturellement la restauration du peuple sans exclure l’idée de retour.
- source_word: הָאֵר פָּנֶיךָ
  choice: fais briller ton visage sur nous
  rationale: Préserve le causatif de אור ainsi que l’image hébraïque concrète du visage divin rayonnant de faveur; « sur nous » explicite en français la relation implicite dans l’idiome.
- source_word: וְנִוָּשֵׁעָה
  choice: et nous serons sauvés
  rationale: Le cohortatif niphal peut exprimer le résultat attendu après les impératifs. Cette formulation conserve la coordination hébraïque et la certitude confiante, tout en laissant possible une nuance de but.
theological_decisions:
- issue: Formule divine יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Yahweh, Dieu des armées
  alternative: Yahweh, Dieu des puissances
  rationale: Le nom personnel est conservé, et צְבָאוֹת est rendu sans réduire nécessairement le titre aux seules armées humaines.
- issue: Valeur de וְנִוָּשֵׁעָה
  choice: et nous serons sauvés
  alternative: afin que nous soyons sauvés
  rationale: La conjonction suivie du cohortatif permet une lecture de conséquence ou de but. Le texte principal suit la coordination formelle; la note préserve la lecture finale.
translation_notes:
  register: Français international moderne, solennel mais direct. L’adresse omet « Ô », peu naturelle dans l’usage courant, tout en conservant la dignité poétique. Le parallélisme bref du refrain est maintenu.
