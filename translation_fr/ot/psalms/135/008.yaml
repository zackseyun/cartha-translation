  text: who struck down the firstborn of Egypt[b][a], from man to beast.
translation:
  language: fr
  text: lui qui frappa les premiers-nés d’Égypte, de l’être humain jusqu’à l’animal[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « de l’être humain jusqu’à l’animal », expression qui inclut les humains et les animaux.
