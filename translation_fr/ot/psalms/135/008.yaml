translation_notes:
  register: Français international actuel, digne et lisible. Le passé simple convient au registre poétique du psaume. La tournure « lui qui » assure la continuité syntaxique avec le verset précédent; les notes conservent à la fois la forme concise de l’hébreu et son sens contextuel.
