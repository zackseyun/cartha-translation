lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: lui qui frappa
  rationale: La particule relative suivie du hifil accompli de נכה poursuit la description du Seigneur au verset précédent. « Frappa » conserve la formulation hébraïque; dans le contexte de la mort des premiers-nés, son sens létal est clair et peut être précisé en note.
- source_word: בְּכוֹרֵי מִצְרָיִם
  choice: les premiers-nés d’Égypte
  rationale: Le pluriel construit de בכור désigne collectivement les êtres ayant le statut de premiers-nés; « d’Égypte » reproduit naturellement le complément formé par le nom propre.
- source_word: מֵ/אָדָם עַד בְּהֵמָה
  choice: depuis les humains jusqu’aux animaux
  rationale: La construction מִן…עַד exprime une étendue inclusive. En français moderne, « les humains » s’oppose clairement et naturellement aux « animaux », tandis que בְּהֵמָה désigne ici la catégorie animale dans son ensemble.
