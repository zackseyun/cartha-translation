base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: fr
  text: Louez Yah[a] ! Louez le nom de Yahweh[b] ! Louez, serviteurs de Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yah » est la forme poétique abrégée du nom divin ; l’expression hébraïque correspond au mot « Alléluia », littéralement « Louez Yah ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici la forme complète du nom divin, distincte de la forme abrégée « Yah » au début du verset. Elle est transcrite « Yahweh ».
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ
  choice: Louez
  rationale: Impératif pluriel du piel de הלל. « Louez » rend directement et naturellement l’appel collectif à célébrer Dieu, tout en conservant sa triple répétition.
- source_word: יָהּ
  choice: Yah
  rationale: Forme poétique abrégée du nom divin. La transcription « Yah » maintient la distinction voulue avec la forme complète יְהוָה employée ensuite et rend perceptible l’origine de « Alléluia ».
- source_word: אֶת שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: Cette formulation conserve le nom comme objet explicite de la louange et suit clairement la construction hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, choisie ici pour représenter le nom propre divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Dans cette interpellation liturgique, « serviteurs » exprime naturellement la relation de service et d’appartenance sans mettre au premier plan la condition servile que pourrait suggérer « esclaves ».
theological_decisions:
- issue: Distinction entre les formes divines יָהּ et יְהוָה
  choice: Traduire יָהּ par « Yah » et יְהוָה par « Yahweh ».
  alternative: Rendre les deux formes par « le Seigneur », ou uniformiser les deux sous « Yahweh ».
  rationale: L’hébreu emploie intentionnellement, dans le même verset, la forme poétique abrégée puis le tétragramme complet. Les distinguer préserve cette donnée textuelle sans transformer le nom divin en titre.
- issue: Objet du troisième impératif הַלְלוּ
  choice: 'Ne pas ajouter de complément : « Louez, serviteurs de Yahweh ! »'
  alternative: 'Ajouter « le » ou « Yahweh » : « Louez-le » ou « Louez Yahweh ».'
  rationale: Le texte hébreu ne donne aucun objet après le troisième impératif ; les mots qui suivent désignent les personnes interpellées. La tournure française, légèrement solennelle mais intelligible, préserve cette structure.
translation_notes:
  register: Français international moderne, clair et solennel. La triple répétition de « Louez » reproduit l’insistance liturgique de l’hébreu. Le troisième impératif reste sans objet exprimé, comme dans le texte source.
