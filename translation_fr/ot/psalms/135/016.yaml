  text: פֶּֽה לָ֭/הֶם וְ/לֹ֣א יְדַבֵּ֑רוּ עֵינַ֥יִם לָ֝/הֶ֗ם וְ/לֹ֣א יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/016.yaml
  text: They have mouths[a], but do not speak; they have eyes, but do not see.
translation:
  language: fr
  text: Ils ont une bouche[a], mais ne parlent pas ; ils ont des yeux, mais ne voient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Une bouche est à eux… des yeux sont à eux », tournure hébraïque exprimant la possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה
  choice: une bouche
  rationale: 'Le nom hébreu est au singulier et s’emploie ici distributivement avec le pronom pluriel : les idoles ont chacune une bouche. Le français naturel permet de conserver ce singulier distributif.'
- source_word: לָהֶם
  choice: ils ont
  rationale: La construction hébraïque avec ל, littéralement « à eux », exprime ici la possession ; « ils ont » est son équivalent français idiomatique.
- source_word: יְדַבֵּרוּ
  choice: ne parlent pas
  rationale: Le piel de דבר signifie « parler ». La négation simple est conservée sans la transformer en modalité explicite (« ne peuvent pas »).
- source_word: עֵינַיִם
  choice: des yeux
  rationale: Rendu direct du duel/pluriel hébreu dans une construction possessive française naturelle.
- source_word: יִרְאוּ
  choice: ne voient pas
  rationale: Le qal de ראה signifie couramment « voir ». Le français maintient la négation simple du texte hébreu plutôt que d’expliciter une incapacité.
theological_decisions:
- issue: Description anthropomorphique des idoles
  choice: Conserver l’image concrète d’organes qui n’exercent pas leur fonction, sans ajouter d’explication sur l’impuissance des idoles.
  alternative: « Ils ont une bouche, mais ne peuvent pas parler ; ils ont des yeux, mais ne peuvent pas voir. »
  rationale: L’hébreu affirme qu’elles ne parlent ni ne voient, sans employer de verbe modal. La formulation retenue préserve la sobriété et la force polémique du texte.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme hébreu est conservé, avec une ponctuation qui met nettement en relief les deux contrastes.
