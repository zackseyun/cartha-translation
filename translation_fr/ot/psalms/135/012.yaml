  text: וְ/נָתַ֣ן אַרְצָ֣/ם נַחֲלָ֑ה נַ֝חֲלָ֗ה לְ/יִשְׂרָאֵ֥ל עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
translation:
  language: fr
  text: Il a donné leur pays en héritage[a], en héritage à Israël, son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme patrimoine »; l’hébreu répète « héritage » pour insister.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Il a donné
  rationale: Le verbe au qatal précédé de וְ poursuit ici l’évocation des actes de Dieu. Le sujet « Il » est tiré du contexte; l’absence de « Et » donne en français une entrée plus naturelle sans altérer la séquence.
- source_word: אַרְצָם
  choice: leur pays
  rationale: אֶרֶץ peut désigner une terre, un pays ou un territoire. Ici, le suffixe renvoie aux rois et peuples vaincus mentionnés dans le contexte; « leur pays » est naturel et précis.
- source_word: נַחֲלָה
  choice: en héritage
  rationale: Le premier emploi exprime ce à quoi le pays est destiné lorsqu’il est donné. « En héritage » conserve la notion d’attribution durable et la portée d’allotissement attachée au terme.
- source_word: נַחֲלָה
  choice: en héritage
  rationale: Le second emploi répète exactement le nom hébreu à des fins d’insistance. La même expression française est donc reprise plutôt que lissée.
- source_word: לְיִשְׂרָאֵל
  choice: à Israël
  rationale: La préposition לְ marque ici le destinataire ou bénéficiaire du don; « à Israël » est la formulation directe.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: עַם désigne ici le peuple appartenant à Dieu. « Son peuple » rend simplement cette relation sans ajout doctrinal.
theological_decisions:
- issue: Répétition poétique de נַחֲלָה
  choice: Conserver dans le texte la répétition « en héritage, en héritage »
  alternative: Ne garder qu’une occurrence pour alléger le français
  rationale: La répétition est présente dans l’hébreu et souligne le don du pays à Israël. La préserver maintient l’insistance poétique et la tension théologique du texte sans la développer par une interprétation ajoutée.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition inhabituelle est volontairement conservée pour refléter la forme poétique hébraïque.
