lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: Maison d’Israël
  rationale: Rend littéralement le groupe construit et conserve la désignation collective ainsi que le parallélisme avec « maison d’Aaron ».
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: Impératif pluriel de ברך. « Bénissez » garde le sens doxologique précis et l’adresse aux groupes nommés.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française traditionnelle du tétragramme, qui préserve ici le nom divin plutôt que de le remplacer par un titre.
- source_word: בֵּית אַהֲרֹן
  choice: Maison d’Aaron
  rationale: Conserve la formulation hébraïque et son parallélisme; elle désigne collectivement la lignée sacerdotale d’Aaron sans explicitation excessive.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahvé » est une forme française courante qui conserve le caractère de nom propre; la note signale l’usage traditionnel de « le SEIGNEUR ».
