  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יַאֲזִ֑ינוּ אַ֝֗ף אֵין יֶשׁ ר֥וּחַ בְּ/פִי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: fr
  text: Ils ont des oreilles, mais ils n’entendent pas ; il n’y a même pas de souffle dans leur bouche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esprit » pour « souffle » (hébreu רוּחַ) ; ici, le contexte des idoles sans vie et l’expression « dans leur bouche » favorisent « souffle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: Ils ont des oreilles
  rationale: La construction hébraïque nominale avec לָהֶם exprime naturellement la possession ; cette formulation française conserve l’image corporelle.
- source_word: וְלֹא יַאֲזִינוּ
  choice: mais ils n’entendent pas
  rationale: Le français « mais » explicite le contraste entre la présence d’oreilles et l’incapacité d’entendre. Le hiphil de אזן peut signifier écouter ou prêter l’oreille ; « entendre » convient au parallélisme des facultés sensorielles.
- source_word: אַף
  choice: bien plus
  rationale: La particule marque ici une progression emphatique vers l’absence totale de vie, plutôt qu’une simple addition.
- source_word: אֵין יֶשׁ
  choice: il n’y a aucun
  rationale: Cette tournure rend idiomatiquement la négation existentielle renforcée en français.
- source_word: רוּחַ
  choice: souffle
  rationale: Le contexte des idoles inertes et la localisation « dans leur bouche » favorisent le sens concret de souffle, tout en signalant en note l’autre sens possible, « esprit ».
- source_word: בְּפִיהֶם
  choice: dans leur bouche
  rationale: Le suffixe pluriel renvoie collectivement aux idoles ; en français, le singulier distributif « leur bouche » est naturel et conserve l’image de chacune d’elles.
theological_decisions:
- issue: Sens de רוּחַ dans la polémique contre les idoles
  choice: souffle
  alternative: esprit
  rationale: Le verset décrit des organes qui ne fonctionnent pas et culmine dans l’absence de souffle vital. « Souffle » maintient cette image concrète sans exclure ni dissimuler la polysémie du terme hébreu, indiquée en note.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple et orale sans être familière. « Bien plus » rend la progression emphatique de אַף. Le marqueur de note [a] est placé après la proposition contenant le terme concerné.
