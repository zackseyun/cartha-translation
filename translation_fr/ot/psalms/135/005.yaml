  text: כִּ֤י אֲנִ֣י יָ֭דַעְתִּי כִּי גָד֣וֹל יְהוָ֑ה וַ֝/אֲדֹנֵ֗י/נוּ מִ/כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: fr
  text: Car je sais que Yahweh[a] est grand et que notre Seigneur est au-dessus de tous les dieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yahweh » rend le nom divin YHWH ; « notre Seigneur » traduit ensuite un autre mot hébreu, qui signifie « notre seigneur » ou « notre maître ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « plus grand que tous les dieux ». La tournure comparative hébraïque lit littéralement « de tous les dieux » et exprime ici la supériorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La première conjonction introduit la raison de la louange exprimée dans le contexte; « Car » en restitue naturellement la valeur explicative.
- source_word: יָדַעְתִּי
  choice: je sais
  rationale: Le parfait hébreu exprime ici un savoir acquis et assuré dont le résultat demeure; le présent français est donc naturel.
- source_word: כִּי
  choice: que
  rationale: La seconde occurrence introduit le contenu de ce que le psalmiste sait.
- source_word: גָדוֹל
  choice: grand
  rationale: L’adjectif affirme directement la grandeur de Yahweh, tandis que la proposition suivante précise sa supériorité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel et le distingue du titre אֲדֹנֵינוּ employé ensuite.
- source_word: אֲדֹנֵינוּ
  choice: notre Seigneur
  rationale: Le nom signifie « seigneur » ou « maître » avec le suffixe de première personne du pluriel; « notre Seigneur » conserve la dignité du titre.
- source_word: מִכָּל
  choice: au-dessus de tous
  rationale: La préposition מִן marque ici une comparaison de supériorité; cette formulation est idiomatique en français.
- source_word: אֱלֹהִים
  choice: les dieux
  rationale: Le pluriel est conservé sans trancher davantage l’identité ou le statut ontologique de ceux qu’il désigne.
theological_decisions:
- issue: Distinction entre le nom divin יְהוָה et le titre אֲדֹנֵינוּ
  choice: « Yahweh » puis « notre Seigneur »
  alternative: « le SEIGNEUR » puis « notre Seigneur »
  rationale: Le texte hébreu emploie d’abord le nom personnel YHWH, puis un titre différent; la traduction maintient clairement cette distinction.
- issue: Sens de אֱלֹהִים dans la comparaison finale
  choice: « tous les dieux »
  alternative: « tous les êtres divins »
  rationale: « Dieux » est l’équivalent direct et préserve la tension polémique du texte sans préciser si ces dieux sont tenus pour réels, subordonnés ou seulement prétendus.
- issue: Portée comparative de מִכָּל
  choice: « au-dessus de tous les dieux »
  alternative: « plus grand que tous les dieux »
  rationale: Les deux formulations expriment la supériorité; « au-dessus de » conserve une nuance plus large que la seule grandeur et reste naturelle en français.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure explicative du verset, distingue le nom divin du titre « notre Seigneur » et maintient le pluriel « dieux » sans en résoudre la portée théologique.
