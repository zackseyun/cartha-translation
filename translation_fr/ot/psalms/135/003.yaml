source:
  edition: WLC
  text: הַֽ֭לְלוּ יָהּ כִּי ט֣וֹב יְהוָ֑ה זַמְּר֥וּ לִ֝/שְׁמ֗/וֹ כִּ֣י נָעִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: fr
  text: Louez Yah[a], car Yahvé est bon ; chantez en l’honneur de son nom, car il est agréable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yah », forme abrégée du nom divin, distincte de « Yahvé » dans la proposition suivante.'
    reason: lexical_alternative
  - marker: b
    text: Le sujet de l’adjectif est implicite. Il peut désigner Yahvé, son nom ou le chant de louange ; « agréable » peut aussi se traduire par « doux » ou « beau » selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Louez
  rationale: 'Impératif pluriel de הלל : « Louez » rend naturellement l’appel liturgique adressé à la communauté.'
- source_word: יָהּ
  choice: Yah
  rationale: Cette forme abrégée du nom divin est conservée et distinguée du tétragramme יְהוָה qui suit.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de chacune des deux exhortations.
- source_word: טוֹב
  choice: bon
  rationale: Équivalent direct qui garde toute l’ampleur morale et bienfaisante du terme hébreu.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui préserve ici sa distinction d’avec le titre « le Seigneur » et d’avec la forme courte « Yah ».
- source_word: זַמְּרוּ
  choice: Chantez en l’honneur de
  rationale: Le verbe désigne un chant musical de louange ; cette tournure est naturelle en français et s’accorde avec le complément « son nom ».
- source_word: לִשְׁמוֹ
  choice: de son nom
  rationale: Avec « chanter en l’honneur de », cette formulation rend idiomatiquement la louange dirigée vers le nom, c’est-à-dire l’identité et la renommée révélées de Dieu.
- source_word: נָעִים
  choice: agréable
  rationale: Le mot signifie ce qui est plaisant, doux ou beau ; « agréable » demeure assez ouvert pour ne pas trancher son référent implicite.
theological_decisions:
- issue: Distinction entre יָהּ et יְהוָה
  choice: Rendre les deux formes par « Yah » et « Yahvé »
  alternative: Rendre les deux par « le Seigneur »
  rationale: L’hébreu emploie successivement la forme courte et la forme complète du nom divin ; les différencier respecte cette particularité du texte.
- issue: Référent implicite de נָעִים
  choice: « car cela est agréable », avec une note signalant l’ambiguïté
  alternative: « car il est agréable » ou rattacher explicitement l’adjectif au nom ou au chant de louange
  rationale: L’hébreu ne donne pas de sujet explicite. Le français exigeant davantage de précision, « cela » renvoie naturellement à l’acte de chanter, tandis que la note conserve l’autre lecture possible, où l’adjectif qualifie Yahvé.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsme. La ponctuation exclamative restitue l’élan des impératifs. Les noms divins restent distincts, et la note préserve l’ambiguïté syntaxique du dernier membre.
