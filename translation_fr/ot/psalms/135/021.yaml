  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: fr
  text: 'Béni soit Yahweh de Sion,

    lui qui habite à Jérusalem !

    Alléluia[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu : « Louez Yah ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif appartient ici à une formule liturgique de bénédiction. « Béni soit » en conserve la force doxologique en français naturel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du tétragramme, qui préserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מִצִּיּוֹן
  choice: depuis Sion
  rationale: La préposition מִן exprime normalement la provenance. « Depuis Sion » indique ici que la bénédiction s’élève de Sion, sans la réduire à une simple localisation.
- source_word: שֹׁכֵן
  choice: lui qui habite
  rationale: Le participe qal de שכן signifie « habiter, demeurer ». La tournure appositive « lui qui habite » restitue clairement son rapport à Yahweh sans ajouter l’idée non explicite d’un trône.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française consacrée du nom de lieu.
- source_word: הַלְלוּ יָהּ
  choice: Alléluia !
  rationale: Cette forme liturgique établie en français reprend l’expression hébraïque formée d’un impératif pluriel, « louez », et de la forme brève du nom divin, « Yah » ; le sens littéral est donné en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel et évite de le remplacer silencieusement par un titre.
- issue: Rapport syntaxique de שֹׁכֵן יְרוּשָׁלִָם
  choice: lui qui habite à Jérusalem
  alternative: demeurant à Jérusalem
  rationale: Le participe est compris comme une apposition à Yahweh. « Lui qui habite » rend ce rapport explicite tout en maintenant le sens simple du verbe.
translation_notes:
  register: Registre liturgique, poétique et accessible. L’inversion « Béni soit » conserve la solennité de la formule hébraïque ; la disposition en trois lignes fait ressortir la bénédiction finale et l’acclamation.
