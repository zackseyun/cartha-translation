  text: to Sihon king of the Amorites, and to Og king of Bashan, and to all the kingdoms of Canaan.
translation:
  language: fr
  text: Sihôn, roi des Amorites, et Og, roi du Bashân, et tous les royaumes de Canaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/סִיחוֹן
  choice: Sihôn
  rationale: Le לְ appartient à la construction verbale commencée au verset précédent (« il frappa ») et marque ici l’objet direct selon un usage hébreu possible. Le rendre par « à Sihôn » produirait en français un fragment trompeur; le nom est donc présenté comme premier élément de la liste des rois frappés.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: roi des Amorites
  rationale: Le gentilé articulé désigne le peuple amorite; le pluriel français est l’expression naturelle correspondante.
- source_word: וּ/לְ/עוֹג
  choice: Og
  rationale: La conjonction est rendue par la juxtaposition coordonnée de la liste, et le לְ relève de la même construction que pour Sihôn. Le nom propre suit l’usage français courant.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: roi du Bashân
  rationale: Le groupe construit désigne le souverain du territoire de Bashân. L’accent circonflexe reflète une graphie française biblique claire et courante.
- source_word: וּ/לְ/כֹל
  choice: et tous
  rationale: La conjonction est explicitement rendue par « et »; le לְ marque de nouveau les éléments régis par le verbe du verset précédent, tandis que כֹל est rendu par « tous ».
- source_word: מַמְלְכוֹת
  choice: royaumes
  rationale: Le terme désigne ici des entités politiques gouvernées par des rois; « royaumes » est précis et idiomatique.
- source_word: כְּנָעַן
  choice: Canaan
  rationale: Le nom géographique est rendu selon sa forme française traditionnelle et largement reconnue.
