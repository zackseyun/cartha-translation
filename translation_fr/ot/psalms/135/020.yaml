  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: fr
  text: Maison de Lévi[a], bénissez Yahweh ; vous qui craignez Yahweh[b], bénissez Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Maison de Lévi » ; cette expression désigne collectivement la lignée ou la communauté des lévites.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « ceux qui craignent Yahweh ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: Maison de Lévi
  rationale: La construction hébraïque signifie littéralement « maison de Lévi ». Dans la série liturgique des versets voisins, elle désigne collectivement la lignée ou la communauté lévitique et conserve le parallélisme avec les maisons d’Israël et d’Aaron.
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: L’impératif pluriel de ברך peut, en contexte cultuel, se rapprocher de « louez », mais « bénissez » en est l’équivalent lexical direct et préserve le refrain liturgique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh » plutôt que par un titre substitutif.
- source_word: יִרְאֵי יְהוָה
  choice: vous qui craignez Yahweh
  rationale: Le participe construit désigne ceux qui se caractérisent par la crainte de Yahweh. La formulation avec « vous » s’accorde naturellement avec l’impératif d’adresse directe, tout en laissant en note la lecture nominale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte directement le tétragramme ; employer « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens cultuel de ברך appliqué à Dieu
  choice: bénissez
  alternative: louez
  rationale: « Bénissez » maintient le sens lexical et la tension propre à l’appel biblique à bénir Dieu, sans l’aplanir en simple louange.
translation_notes:
  register: Français international moderne, digne et liturgique. L’impératif pluriel « bénissez » et la répétition de « Yahweh » reproduisent la structure solennelle du texte hébreu.
