  yaml_path: translation/ot/psalms/135/004.yaml
  text: For Yah has chosen Jacob for himself[a], Israel as his treasured possession.
translation:
  language: fr
  text: Car Yah[a] s’est choisi Jacob, Israël comme son bien précieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yah » est la forme courte du nom divin en hébreu.
    reason: Précise la forme particulière du nom divin employée dans le texte source.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le motif de la louange ou de l’exhortation précédente; « Car » est naturel et concis dans ce contexte poétique.
- source_word: בָּחַר לּוֹ
  choice: s’est choisi
  rationale: Le verbe exprime le choix, et לּוֹ indique que ce choix est fait pour soi-même. La tournure pronominale française rend naturellement cette nuance d’appartenance particulière.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Forme française usuelle; dans le parallélisme, le nom désigne le peuple d’Israël.
- source_word: יָהּ
  choice: Yah
  rationale: Reproduit directement la forme courte du nom divin présente dans le texte hébreu, sans la confondre avec le tétragramme complet.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Forme française usuelle, parallèle à « Jacob » et désignant le peuple choisi.
- source_word: לִסְגֻלָּתוֹ
  choice: pour bien précieux
  rationale: סְגֻלָּה désigne un bien personnel particulièrement estimé. « Bien précieux » exprime à la fois la valeur et l’appartenance, tandis que « pour » conserve la relation marquée par לְ.
theological_decisions:
- issue: Rendu de la forme courte du nom divin יָהּ
  choice: Yah
  alternative: le Seigneur
  rationale: Le texte porte explicitement יָהּ, forme courte du nom divin. La translittération préserve cette particularité lexicale et poétique sans imposer un remplacement traditionnel.
- issue: Nature du choix d’Israël
  choice: « s’est choisi Jacob, Israël pour bien précieux »
  alternative: « a choisi Jacob pour lui-même, Israël comme son bien précieux »
  rationale: Le français pronominal exprime l’idée que Dieu choisit le peuple pour lui-même, sans préciser au-delà du texte la portée théologique de ce choix.
translation_notes:
  register: Style poétique sobre, digne et actuel. Le parallélisme entre « Jacob » et « Israël » est conservé, ainsi que la brièveté de l’hébreu.
