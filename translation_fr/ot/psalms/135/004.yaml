- from: Car Yah s’est choisi Jacob[a], Israël pour bien précieux.
  to: Car Yah[a] s’est choisi Jacob, Israël comme son bien précieux.
  rationale: La révision restitue explicitement la possession marquée par le suffixe hébreu dans « son bien précieux », sans surinterpréter la préposition לְ. Elle conserve le choix réfléchi (« s’est choisi »), le parallélisme entre Jacob et Israël, ainsi que la concision poétique. L’appel de note est déplacé auprès de « Yah », le terme qu’elle explique.
