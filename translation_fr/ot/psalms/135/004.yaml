    issue: Possession divine insuffisamment exprimée dans « Israël pour bien précieux ».
    rationale: Le suffixe -וֹ dans לִסְגֻלָּתוֹ signifie « son bien/sa possession précieuse ». L’ajout de « son » restitue cette relation essentielle et rend la formule française plus naturelle.
  - severity: low
    issue: L’appel de note est placé après « Jacob » plutôt qu’après « Yah ».
    rationale: La note explique « Yah »; son ancre doit suivre ce mot afin d’éviter toute ambiguïté de référence.
  revised_text: Car Yah[a] s’est choisi Jacob, Israël comme son bien précieux.
