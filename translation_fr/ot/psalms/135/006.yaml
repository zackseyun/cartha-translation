source:
  edition: WLC
  text: כֹּ֤ל אֲשֶׁר חָפֵ֥ץ יְהוָ֗ה עָ֫שָׂ֥ה בַּ/שָּׁמַ֥יִם וּ/בָ/אָ֑רֶץ בַּ֝/יַּמִּ֗ים וְ/כָל תְּהוֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: fr
  text: Tout ce que Yahweh désire, il l’accomplit[a], dans les cieux et sur la terre, dans les mers et dans tous les abîmes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout ce que Yahweh a désiré, il l’a fait. »'
    reason: Le parfait hébreu peut aussi être compris comme renvoyant à ce que Yahweh a accompli.
  - marker: b
    text: Les « abîmes » peuvent désigner les eaux profondes ou les profondeurs de l’océan.
    reason: La portée de תְּהוֹמוֹת est large et peut évoquer les profondeurs aqueuses ou abyssales.
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Tout ce que
  rationale: Cette tournure rend naturellement la portée totale de l’expression hébraïque et conserve la structure de la proposition.
- source_word: חָפֵץ
  choice: désire
  rationale: Le verbe exprime le désir, le plaisir ou la volonté. « Désire » préserve cette amplitude sans suggérer arbitrairement le caprice.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: עָשָׂה
  choice: il l’accomplit
  rationale: Le parfait peut présenter ce que Yahweh a fait ou, dans cette affirmation générale, ce qu’il accomplit effectivement. Le présent français exprime ici la vérité générale, tandis que « accomplit » rend le caractère effectif de l’action.
- source_word: בַּשָּׁמַיִם
  choice: dans les cieux
  rationale: Le pluriel hébreu est conservé; cette formulation reste naturelle en français biblique moderne et forme un ensemble cosmique avec « sur la terre ».
- source_word: וּבָאָרֶץ
  choice: et sur la terre
  rationale: « Sur la terre » est l’expression française idiomatique dans le couple « cieux et terre ».
- source_word: בַּיַּמִּים
  choice: dans les mers
  rationale: Le pluriel du texte est maintenu et désigne l’ensemble des grandes étendues d’eau.
- source_word: וְכָל תְּהוֹמוֹת
  choice: et dans tous les abîmes
  rationale: תְּהוֹמוֹת désigne les profondeurs, notamment les profondeurs aqueuses. « Abîmes » conserve la dimension poétique et cosmique sans en limiter indûment le référent.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel sans lui substituer un titre.
- issue: Valeur aspectuelle de עָשָׂה
  choice: 'présent de vérité générale : « il l’accomplit »'
  alternative: 'passé composé : « il l’a accompli »'
  rationale: Dans le contexte, l’énoncé proclame la souveraineté effective de Yahweh comme vérité générale. La note conserve l’autre lecture possible du parfait hébreu.
- issue: Nuance de חָפֵץ
  choice: « désire »
  alternative: « veut » / « prend plaisir à »
  rationale: « Désire » laisse subsister la gamme sémantique du verbe entre désir, plaisir et volonté, sans renforcer le texte par une formulation doctrinale plus déterministe.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme cosmique est conservé, ainsi que le pluriel « les cieux ». « Accomplit » évite une tournure familière tout en exprimant l’efficacité de l’action.
