source:
  edition: WLC
  text: שֶׁ֣֭/עֹֽמְדִים בְּ/בֵ֣ית יְהוָ֑ה בְּ֝/חַצְר֗וֹת בֵּ֣ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/002.yaml
  text: who stand in the house of Yahweh[b][a], in the courts of the house of our God.
translation:
  language: fr
  text: vous qui vous tenez dans la maison de Yahweh[a], dans les parvis[b] de la maison de notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, la « maison de Yahweh » désigne le temple avec son enceinte.
    reason: cultural_note
  - marker: b
    text: 'Ou : « les cours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: vous qui vous tenez
  rationale: La particule relative suivie du participe poursuit l’interpellation du verset précédent. « Vous qui vous tenez » exprime naturellement en français la présence habituelle ou continue des serviteurs dans le sanctuaire.
- source_word: בְּבֵית
  choice: dans la maison de
  rationale: Le sens littéral de בַּיִת est « maison ». Dans ce contexte, le mot désigne le temple et son enceinte, mais conserver « maison » respecte l’expression hébraïque et le parallélisme du vers.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin יהוה est rendu par sa translittération usuelle en français, plutôt que remplacé par un titre.
- source_word: בְּחַצְרוֹת
  choice: dans les parvis
  rationale: Au pluriel, חָצֵר désigne ici les espaces ouverts de l’enceinte du temple. « Parvis » est idiomatique dans ce contexte cultuel tout en conservant le pluriel.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: la maison de notre Dieu
  rationale: Cette traduction directe préserve la répétition de « maison », le parallélisme poétique et le possessif communautaire.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le conserve explicitement sans lui substituer un titre.
- issue: Portée de « maison » dans le contexte du temple
  choice: Conserver « maison » dans le texte et préciser son référent en note
  alternative: Traduire directement par « temple »
  rationale: « Maison » préserve la métaphore et la répétition hébraïques, tandis que la note évite de laisser croire qu’il s’agit d’une habitation ordinaire.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « vous qui vous tenez » rattache clairement ce vers à l’adresse commencée au verset précédent. « Parvis » convient au cadre du temple sans rendre le texte inutilement technique.
