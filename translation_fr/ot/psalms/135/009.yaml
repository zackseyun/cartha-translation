base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: fr
  text: Il a envoyé des signes et des prodiges au milieu de toi, Égypte[a], contre Pharaon et contre tous ses serviteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu s’adresse directement à l’Égypte au féminin singulier et personnifie ainsi le pays. On pourrait aussi traduire : « en ton sein, Égypte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sur Pharaon et sur tous ses serviteurs ». Ici, la préposition indique vraisemblablement ceux que frappent les signes et les prodiges. Le terme traduit par « serviteurs » peut aussi désigner des fonctionnaires ou des esclaves selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: Il a envoyé
  rationale: Le qal accompli à la 3e personne du masculin singulier renvoie à Dieu, sujet implicite d’après le contexte. « Envoyer » rend simplement et naturellement le verbe.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: des signes et des prodiges
  rationale: Cette paire de termes est fréquente dans le récit de l’Exode. « Signes et prodiges » conserve l’association hébraïque sans réduire les événements à de simples symboles ni en préciser excessivement la nature.
- source_word: בְּתוֹכֵכִי מִצְרָיִם
  choice: au milieu de toi, Égypte
  rationale: Le suffixe féminin singulier s’adresse directement à l’Égypte personnifiée. Cette formulation préserve cette adresse, ainsi que le sens spatial de בְּתוֹךְ.
- source_word: בְּפַרְעֹה
  choice: contre le pharaon
  rationale: Dans ce contexte, la préposition בְּ désigne la cible et l’effet hostile des signes et des prodiges. « Contre » est naturel en français, tout en signalant en note le rendu plus littéral.
- source_word: וּבְכָל עֲבָדָיו
  choice: et tous ses serviteurs
  rationale: עֲבָדִים peut désigner des serviteurs, des esclaves ou des agents officiels. « Serviteurs » conserve ici la portée générale du terme dans l’entourage royal.
