source:
  edition: WLC
  text: עֲצַבֵּ֣י הַ֭/גּוֹיִם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/015.yaml
  text: The idols of the nations are silver and gold[b][a], the work of human hands.
translation:
  language: fr
  text: Les idoles des nations sont d’argent et d’or, œuvre de mains humaines.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: les idoles
  rationale: Dans ce contexte polémique contre les objets d’un faux culte, le terme désigne des idoles plutôt que de simples images.
- source_word: הַגּוֹיִם
  choice: des nations
  rationale: Le nom désigne ici les peuples ou nations autres qu’Israël; « des nations » est naturel et fidèle au contexte du psaume.
- source_word: כֶּסֶף וְזָהָב
  choice: d’argent et d’or
  rationale: Cette formulation française exprime directement les matériaux dont les idoles sont faites.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: œuvre de mains humaines
  rationale: La tournure conserve l’image concrète des mains et souligne que ces idoles sont de fabrication humaine, par contraste avec le Dieu vivant.
theological_decisions:
- issue: Sens générique de אָדָם
  choice: humaines
  alternative: d’un homme
  rationale: אָדָם désigne ici l’être humain en général, non un homme de sexe masculin; « mains humaines » rend naturellement cette portée collective sans atténuer le contraste théologique.
translation_notes:
  register: Français moderne, sobre et poétique. La syntaxe nominale resserrée « œuvre de mains humaines » préserve le parallélisme et la force polémique de l’hébreu.
