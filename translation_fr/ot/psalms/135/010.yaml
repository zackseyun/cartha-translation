  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: lui qui a frappé
  rationale: La particule relative שֶׁ rattache le verset à l’antécédent du verset précédent. « Lui qui » rend ce lien clairement en français, tandis que « a frappé » traduit נכה sans ajouter l’idée explicite d’un anéantissement.
- source_word: גּוֹיִם רַבִּים
  choice: de nombreuses nations
  rationale: גּוֹיִם désigne ici des nations dans un contexte historique et militaire, et רַבִּים en indique le grand nombre. Cette formulation est naturelle en français moderne.
- source_word: וְהָרַג
  choice: et tué
  rationale: הרג signifie tuer ou faire périr. L’ellipse de l’auxiliaire après « a frappé » est idiomatique et conserve le parallélisme poétique.
- source_word: מְלָכִים עֲצוּמִים
  choice: des rois puissants
  rationale: מְלָכִים signifie « rois » et עֲצוּמִים souligne leur force ou leur puissance. « Puissants » est précis, actuel et digne.
theological_decisions:
- issue: Continuité de la proposition relative avec le verset précédent
  choice: Commencer par « lui qui » et conserver une proposition dépendante.
  alternative: 'Formuler une phrase indépendante : « Il a frappé de nombreuses nations… »'
  rationale: Le שֶׁ préfixé marque explicitement une proposition relative poursuivant la description du Seigneur commencée au verset précédent. Le français « lui qui » préserve cette continuité syntaxique et rhétorique.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le découpage en deux lignes conserve le parallélisme de la poésie hébraïque.
