source:
  edition: WLC
  text: כִּֽי יָדִ֣ין יְהוָ֣ה עַמּ֑/וֹ וְ/עַל עֲ֝בָדָ֗י/ו יִתְנֶחָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/014.yaml
  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: fr
  text: Car Yahvé fera droit à son peuple[a] et aura compassion de ses serviteurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jugera son peuple ». Le verbe hébreu peut signifier « juger » ; ici, il désigne probablement un jugement rendu en faveur du peuple.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se ravisera au sujet de ses serviteurs ». Le verbe hébreu peut aussi exprimer le fait de se raviser ou d’être ému de compassion.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: יָדִין
  choice: fera droit à
  rationale: Le verbe peut signifier « juger », mais ici, comme dans le parallèle étroit de Deutéronome 32.36 et en association avec la compassion divine, il désigne vraisemblablement un jugement rendu en faveur du peuple. « Faire droit à » exprime naturellement cette idée tout en conservant le cadre judiciaire.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Restitue en français la valeur de nom propre du tétragramme plutôt que de lui substituer un titre.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Rend directement la désignation collective et relationnelle du texte hébreu.
- source_word: וְעַל
  choice: et … de
  rationale: Avec יִתְנֶחָם, la préposition introduit ceux envers qui s’exerce la compassion ou au sujet desquels Dieu se ravise; sa valeur est intégrée idiomatiquement à la construction française.
- source_word: עֲבָדָיו
  choice: ses serviteurs
  rationale: Dans ce contexte psalmique, « serviteurs » rend naturellement le statut des personnes attachées au service de Yahvé, sans mettre au premier plan la notion d’esclavage.
- source_word: יִתְנֶחָם
  choice: aura compassion
  rationale: Le nifal de נחם peut évoquer le fait de se raviser, de renoncer à une action ou d’être ému de pitié. Ici, « aura compassion » exprime clairement le mouvement favorable de Dieu envers ses serviteurs; une note conserve l’autre nuance réelle du verbe.
theological_decisions:
- issue: Langage anthropopathique appliqué à Dieu dans יִתְנֶחָם
  choice: aura compassion
  alternative: renoncera à sévir contre ses serviteurs / se ravisera au sujet de ses serviteurs
  rationale: La traduction principale communique la miséricorde divine dans un français naturel sans suggérer un repentir moral. La note maintient toutefois la tension du verbe hébreu, qui peut décrire le fait de revenir sur une action envisagée ou entreprise.
- issue: Valeur judiciaire de יָדִין
  choice: fera droit à son peuple
  alternative: jugera son peuple
  rationale: Le contexte et le parallèle de Deutéronome 32.36 favorisent un jugement en faveur du peuple. La note conserve le sens lexical plus général sans transformer l’interprétation contextuelle en certitude absolue.
translation_notes:
  register: Français international moderne, naturel et digne. « Faire droit à » maintient l’image judiciaire tout en exprimant l’orientation favorable du jugement; « avoir compassion » est clair pour un large lectorat. Les variantes sont signalées sans imposer une résolution doctrinale.
