  text: יְ֭הוָה שִׁמְ/ךָ֣ לְ/עוֹלָ֑ם יְ֝הוָ֗ה זִכְרְ/ךָ֥ לְ/דֹר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/013.yaml
  text: Yahweh, your name endures forever; Yahweh, your renown[a] endures from generation to generation.
translation:
  language: fr
  text: Yahweh, ton nom demeure pour toujours ; Yahweh, ton souvenir[a] demeure de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton renom » ou « ton mémorial ».
    reason: Alternatives lexicales pour זִכְרְךָ, qui peut désigner le souvenir perpétué, le renom ou un mémorial.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh », conformément à l’adresse directe du texte hébreu.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Cette traduction conserve la portée du terme hébreu, qui peut évoquer à la fois le nom divin et ce qu’il représente.
- source_word: לְעוֹלָם
  choice: demeure pour toujours
  rationale: La proposition hébraïque est sans verbe exprimé. « Demeure » rend naturellement en français l’idée de continuité impliquée par l’expression temporelle.
- source_word: זִכְרְךָ
  choice: ta mémoire
  rationale: Le nom hébreu désigne ce qui perpétue le souvenir de Yahweh, avec des nuances possibles de souvenir, de mémorial ou de renom. « Ta mémoire » préserve cette amplitude et le parallélisme avec « ton nom ».
- source_word: לְדֹר וָדֹר
  choice: demeure de génération en génération
  rationale: La reprise de « demeure » explicite la seconde proposition sans verbe et maintient le parallélisme poétique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. Le rendre par « Yahweh » conserve sa fonction de nom personnel sans substituer un titre.
- issue: Sens de זִכְרְךָ
  choice: ta mémoire
  alternative: le souvenir de toi ; ton renom ; ton mémorial
  rationale: Le contexte associe ce terme au nom de Yahweh et à sa permanence au fil des générations. « Ta mémoire » garde ouverte la tension entre souvenir durable, réputation et mémorial, sans réduire le mot à une seule nuance.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « Yahweh » et de « demeure » conserve le parallélisme des deux propositions hébraïques ; aucun vocatif artificiel n’est ajouté.
