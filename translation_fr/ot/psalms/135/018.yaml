source:
  edition: WLC
  text: כְּ֭מוֹ/הֶם יִהְי֣וּ עֹשֵׂי/הֶ֑ם כֹּ֭ל אֲשֶׁר בֹּטֵ֣חַ בָּ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/018.yaml
  text: Those who make them will become like them[a], everyone who trusts in them.
translation:
  language: fr
  text: Ceux qui les fabriquent deviendront comme elles, de même que tous ceux qui se confient en elles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront comme elles ». Le verbe hébreu peut se rendre soit par « seront », soit par « deviendront » ; le texte retient ici le sens résultatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: comme elles
  rationale: La préposition comparative avec suffixe renvoie aux idoles évoquées précédemment. Le féminin « elles » reprend naturellement « idoles » en français.
- source_word: יִהְי֣וּ
  choice: deviendront
  rationale: Le verbe היה peut exprimer l’état (« seront ») ou l’entrée dans un état (« deviendront »). Ici, « deviendront » met en relief la portée résultative du contexte sans définir la nature précise de cette ressemblance.
- source_word: עֹשֵׂי/הֶם
  choice: ceux qui les fabriquent
  rationale: Le participe de עשה désigne les personnes qui font les idoles. « Fabriquent » est naturel et précis pour des objets façonnés.
- source_word: כֹּל אֲשֶׁר
  choice: tous ceux qui
  rationale: Cette formulation conserve la portée universelle de l’expression hébraïque et s’intègre naturellement à la proposition.
- source_word: בֹּטֵחַ בָּ/הֶם
  choice: mettent leur confiance en elles
  rationale: בטח avec son complément signifie se confier en quelqu’un ou quelque chose. Cette expression française rend clairement la confiance mal placée dans les idoles.
theological_decisions:
- issue: Portée de la ressemblance avec les idoles
  choice: Le texte affirme que ceux qui fabriquent les idoles et se confient en elles deviendront comme elles, sans préciser en quoi consiste exactement cette ressemblance.
  alternative: Ils deviennent insensibles spirituellement, impuissants ou privés de vie comme les idoles.
  rationale: L’hébreu affirme la ressemblance mais n’en explicite ni le mécanisme ni toutes les dimensions; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi que » relie le second groupe au premier sans suggérer qu’il s’agit nécessairement de personnes distinctes. Le féminin des pronoms suppose le référent contextuel « idoles ».
