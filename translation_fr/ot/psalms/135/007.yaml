  variant: modern international French
source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: fr
  text: Il fait monter les nuages[a] des extrémités de la terre ; il produit les éclairs pour la pluie[b] ; il fait sortir le vent de ses réserves[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les vapeurs » ou « les brumes ». Le mot hébreu peut désigner ce qui s’élève dans l’atmosphère.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec la pluie ». La préposition hébraïque peut exprimer ici la destination ou, plus largement, le rapport entre les éclairs et la pluie.
    reason: lexical_alternative
  - marker: c
    text: Ou « de ses trésors ». L’image est celle de lieux où Dieu garde les vents et d’où il les fait sortir.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: fait monter
  rationale: Le participe hiphil de עלה exprime une action causative. « Fait monter » est naturel en français et conserve cette valeur.
- source_word: נְשִׂאִים
  choice: nuages
  rationale: Le terme peut désigner des vapeurs ou des brumes qui s’élèvent, mais le contexte météorologique — pluie, éclairs et vent — favorise « nuages ».
- source_word: מִקְצֵה הָאָרֶץ
  choice: des extrémités de la terre
  rationale: Bien que l’hébreu emploie « extrémité » au singulier, l’expression a ici une portée collective. Le pluriel français rend naturellement l’idée des confins de la terre.
- source_word: בְּרָקִים
  choice: les éclairs
  rationale: Le pluriel hébreu est rendu directement par le pluriel français courant « les éclairs ».
- source_word: לַמָּטָר
  choice: pour la pluie
  rationale: La préposition ל peut exprimer une destination, un rapport ou une association. « Pour la pluie » suit de près la formulation hébraïque sans trancher entièrement la nature du rapport.
- source_word: עָשָׂה
  choice: produit
  rationale: Dans cette description hymnique de l’action caractéristique de Dieu, l’accompli hébreu prend une valeur générale. « Produit » convient au présent et évite la répétition de « fait ».
- source_word: מוֹצֵא
  choice: fait sortir
  rationale: Le participe hiphil de יצא est causatif. « Fait sortir » conserve clairement cette nuance ainsi que l’image d’un vent libéré d’un lieu de stockage.
- source_word: רוּחַ
  choice: vent
  rationale: La suite consacrée aux nuages, à la pluie et aux éclairs impose ici le sens météorologique de רוּחַ.
- source_word: מֵאֹצְרוֹתָיו
  choice: de ses réserves
  rationale: אֹצָר désigne un lieu où quelque chose est conservé, ou un trésor. « Réserves » transmet en français actuel l’image poétique de vents gardés puis relâchés par Dieu.
theological_decisions:
- issue: Présent poétique ou narration au passé
  choice: Employer le présent pour décrire l’action souveraine et caractéristique de Dieu dans la création.
  alternative: Employer le passé, notamment « il a produit », en suivant plus littéralement la forme accomplie עָשָׂה.
  rationale: Le contexte hymnique célèbre la maîtrise constante de Dieu sur les phénomènes naturels. Le présent harmonise le verbe accompli avec les participes voisins et rend la portée générale du verset.
- issue: Rapport entre les éclairs et la pluie
  choice: Conserver la formulation « pour la pluie », proche de l’hébreu et ouverte quant au rapport exact.
  alternative: Traduire « avec la pluie » pour expliciter leur association dans l’orage.
  rationale: La préposition ל n’impose pas ici une seule analyse. La traduction principale préserve la tension de l’expression, tandis que la note signale une lecture relationnelle possible.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Les trois propositions parallèles et le présent hymnique sont conservés. La ponctuation en points-virgules reflète le rythme ternaire de l’hébreu.
