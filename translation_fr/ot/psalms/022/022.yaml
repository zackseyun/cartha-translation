  text: אֲסַפְּרָ֣ה שִׁמְ/ךָ֣ לְ/אֶחָ֑/י בְּ/ת֖וֹךְ קָהָ֣ל אֲהַלְלֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: fr
  text: Je proclamerai ton nom à mes frères[a] ; au milieu de l’assemblée, je te louerai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à mes frères et sœurs », si cette désignation familiale est comprise ici de manière inclusive ; le texte hébreu dit littéralement « à mes frères ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Je proclamerai
  rationale: Le piel de ספר exprime ici l’action de raconter ou de faire connaître publiquement. « Proclamerai » convient au témoignage public mis en parallèle avec la louange, sans surinterpréter le verbe.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Cette formulation conserve l’expression hébraïque, où le « nom » renvoie à l’identité révélée, au caractère et à la réputation de Dieu.
- source_word: לְאֶחָי
  choice: à mes frères
  rationale: L’hébreu emploie explicitement un nom masculin pluriel muni du suffixe de première personne. « Mes frères » en respecte la forme et la métaphore familiale ; l’éventuelle portée inclusive est signalée en note.
- source_word: בְּתוֹךְ
  choice: au milieu de
  rationale: Ce choix conserve l’image spatiale et publique de celui qui loue Dieu au sein du rassemblement.
- source_word: קָהָל
  choice: l’assemblée
  rationale: קָהָל désigne un groupe réuni. « Assemblée » est clair en français actuel et évite d’introduire trop fortement des connotations ecclésiastiques postérieures.
- source_word: אֲהַלְלֶךָּ
  choice: je te louerai
  rationale: Le piel de הלל signifie directement « louer ». Le pronom « te » restitue le suffixe objet sans ajouter l’idée de chant, qui n’est pas explicite.
theological_decisions:
- issue: Terme de parenté masculin dans un contexte de culte communautaire
  choice: à mes frères
  alternative: à mes frères et sœurs
  rationale: Le texte hébreu porte un masculin pluriel. La traduction principale en conserve la forme, tandis qu’une note reconnaît que, dans ce contexte communautaire, le groupe visé peut être compris comme incluant aussi les femmes.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur exprime la résolution du locuteur ; « proclamerai » et « assemblée » maintiennent le caractère public et poétique du verset. Le tutoiement correspond à l’adresse directe à Dieu et assure une formulation fluide.
