  text: כַּ/מַּ֥יִם נִשְׁפַּכְתִּי֮ וְ/הִתְפָּֽרְד֗וּ כָּֽל עַצְמ֫וֹתָ֥/י הָיָ֣ה לִ֭בִּ/י כַּ/דּוֹנָ֑ג נָ֝מֵ֗ס בְּ/ת֣וֹךְ מֵעָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: fr
  text: 'Je me répands comme de l’eau,

    et tous mes os se disloquent.

    Mon cœur est devenu comme de la cire :

    il fond au milieu de mes entrailles.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dedans de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: comme de l’eau
  rationale: Le préfixe כְּ marque une comparaison. « Comme de l’eau » conserve directement l’image poétique en français naturel.
- source_word: נִשְׁפַּכְתִּי
  choice: je suis répandu
  rationale: Le nifal de שׁפך présente le locuteur comme entièrement déversé ou vidé. Le présent rend le caractère immédiat et saisissant de son état.
- source_word: וְהִתְפָּרְדוּ
  choice: se disloquent
  rationale: Le hitpael de פרד exprime la séparation des éléments les uns d’avec les autres. Appliqué aux os, « se disloquent » restitue naturellement l’image corporelle sans préciser davantage le mécanisme.
- source_word: כָּל עַצְמוֹתַי
  choice: tous mes os
  rationale: Traduction directe qui conserve la totalité et l’imagerie corporelle concrète du texte hébreu.
- source_word: הָיָה לִבִּי
  choice: mon cœur est devenu
  rationale: Cette formulation exprime le passage à un nouvel état plutôt qu’une simple qualité permanente.
- source_word: כַּדּוֹנָג
  choice: comme de la cire
  rationale: דוֹנָג désigne la cire ; la comparaison est conservée sans explicitation interprétative.
- source_word: נָמֵס
  choice: il fond
  rationale: Le verbe מסס signifie fondre ou se dissoudre. « Il fond » prolonge clairement l’image de la cire et maintient la scène au présent poétique.
- source_word: בְּתוֹךְ מֵעָי
  choice: au milieu de mes entrailles
  rationale: Cette traduction conserve l’expression viscérale du texte, où מֵעִים désigne les parties intérieures du corps, tout en restant intelligible en français moderne.
theological_decisions:
- issue: Expression anthropologique de la détresse intérieure
  choice: au milieu de mes entrailles
  alternative: au-dedans de moi
  rationale: L’hébreu emploie un terme corporel et viscéral plutôt qu’une catégorie abstraite ou purement spirituelle. Le texte principal préserve cette anthropologie concrète ; la note propose une formulation française plus idiomatique.
translation_notes:
  register: Français moderne, poétique et digne. Les lignes suivent le parallélisme du verset. « Se disloquent » communique la séparation des os sans ajouter explicitement la notion d’articulations, absente du lexème hébreu. Le terme « entrailles » maintient l’intensité corporelle de l’original.
