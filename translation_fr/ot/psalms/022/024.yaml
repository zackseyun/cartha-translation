id: PSA.22.24
reference: Psalms 22:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: fr
  text: Car il n’a ni méprisé ni eu en horreur la souffrance de l’affligé[a] ; il ne lui a pas caché son visage. Quand l’affligé a crié vers lui, il l’a entendu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la misère du pauvre » ou « l’humiliation de l’affligé ».
    reason: Alternative lexicale reflétant l’étendue sémantique de עֱנוּת et עָנִי.
lexical_decisions:
- source_word: בָזָה
  choice: méprisé
  rationale: Le verbe exprime le fait de traiter avec dédain. « Méprisé » est naturel en français et forme une progression avec le verbe suivant.
- source_word: שִׁקַּץ
  choice: eu en horreur
  rationale: Ce verbe, plus fort que le précédent, évoque une profonde répulsion. « Eu en horreur » conserve cette intensification sans suggérer simplement un refus.
- source_word: עֱנוּת
  choice: souffrance
  rationale: Le nom désigne un état d’affliction, de misère ou d’humiliation. « Souffrance » est clair et idiomatique, tout en laissant ouvertes les dimensions physique, sociale et intérieure.
- source_word: עָנִי
  choice: l’affligé
  rationale: Le terme peut désigner le pauvre, le malheureux ou l’opprimé. Dans le contexte de ce psaume, « l’affligé » maintient le lien avec la souffrance sans réduire le sens à la pauvreté économique.
- source_word: הִסְתִּיר פָּנָיו
  choice: caché son visage
  rationale: Cette expression hébraïque évoque le retrait de l’attention ou de la faveur divine. La conservation de l’image biblique reste intelligible en français.
- source_word: מִמֶּנּוּ
  choice: ne lui a pas
  rationale: Le pronom singulier renvoie naturellement à l’affligé et maintient la cohésion du texte.
- source_word: בְשַׁוְּעוֹ
  choice: Quand l’affligé a crié
  rationale: La forme exprime un cri pressant, notamment un appel au secours. La reprise explicite de « l’affligé » évite l’ambiguïté que produirait en français une succession de pronoms masculins.
- source_word: אֵלָיו
  choice: vers lui
  rationale: Le pronom renvoie à Dieu dans le contexte. « Vers lui » respecte la formulation pronominale du texte hébreu sans ajouter un titre divin absent du verset.
- source_word: שָׁמֵעַ
  choice: il l’a entendu
  rationale: Le verbe signifie fondamentalement « entendre ». Cette traduction n’ajoute pas l’idée d’une réponse explicite, même si l’écoute favorable est suggérée par le contexte.
theological_decisions:
- issue: Référent de l’affligé
  choice: Le singulier est conservé de manière à pouvoir désigner le souffrant du psaume tout en exprimant une vérité plus générale sur l’attention de Dieu envers l’affligé.
  alternative: Comprendre le terme soit comme une référence exclusivement messianique, soit comme une affirmation purement générale concernant toute personne pauvre.
  rationale: Les formes singulières s’accordent à la fois avec l’expérience personnelle exprimée dans le psaume et avec une portée plus large. La traduction ne tranche pas artificiellement entre ces lectures.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme et l’image du visage caché sont conservés. La répétition de « l’affligé » apporte la clarté référentielle nécessaire en français sans modifier le sens.
