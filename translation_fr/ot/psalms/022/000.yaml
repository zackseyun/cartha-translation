  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: fr
  text: Au chef de chœur. Sur « La Biche de l’aurore »[a]. Psaume de David[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne probablement une mélodie ou un cadre musical. On pourrait aussi traduire son titre par « La Biche du matin ».
    reason: lexical_alternative
  - marker: b
    text: « De David » peut indiquer l’auteur, l’appartenance à David, une association avec lui ou une dédicace; l’hébreu ne précise pas davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. Cette formulation est concise, naturelle en français et conserve la fonction cultuelle et musicale.
- source_word: עַל
  choice: Sur
  rationale: Dans une indication musicale, עַל peut introduire une mélodie, un mode ou une consigne d’exécution. « Sur » est la formule française habituelle pour introduire un air, tout en évitant de préciser davantage que l’hébreu.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: « La Biche de l’aurore »
  rationale: Le syntagme est probablement le titre d’une mélodie ou d’un cadre musical. « Biche » rend le nom féminin singulier de façon naturelle et digne; les guillemets signalent un titre.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Le nom désigne un chant, notamment avec accompagnement musical; « psaume » est ici le terme français standard.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut marquer l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve cette latitude mieux que « par David » ou « pour David ».
theological_decisions:
- issue: Interprétation de אַיֶּלֶת הַשַּׁחַר
  choice: Le traiter comme un titre musical dans la suscription
  alternative: Le comprendre comme un intitulé symbolique ou thématique lié au contenu du psaume
  rationale: Après עַל dans une suscription, l’expression fonctionne le plus naturellement comme une indication de mélodie ou d’exécution. La présenter comme un titre n’impose pas d’interprétation symbolique.
- issue: Valeur de לְדָוִד
  choice: Employer la formulation large « de David »
  alternative: Préciser « par David » pour l’attribution d’auteur ou « pour David » pour la dédicace
  rationale: La construction hébraïque ne tranche pas à elle seule entre ces rapports. La traduction conserve donc cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation segmente les indications de la suscription; les guillemets français identifient le titre musical présumé. Tous les marqueurs de notes sont placés immédiatement après l’expression concernée.
