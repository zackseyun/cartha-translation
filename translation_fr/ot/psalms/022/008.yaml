source:
  edition: WLC
  text: גֹּ֣ל אֶל יְהוָ֣ה יְפַלְּטֵ֑/הוּ יַ֝צִּילֵ֗/הוּ כִּ֘י חָ֥פֵֽץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/008.yaml
  text: “Commit yourself to Yahweh; let him rescue him; let him deliver him[a], since he delights in him!”
translation:
  language: fr
  text: « Confie-toi à Yahvé[a] ! Qu’il le mette à l’abri ! Qu’il le délivre, puisqu’il prend plaisir en lui ! »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Roule vers Yahvé. » Cette expression signifie remettre à Dieu sa personne ou sa cause, s’en remettre à lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: Confie-toi
  rationale: L’impératif signifie littéralement « roule », mais, dans cette tournure avec la direction vers Yahvé, il exprime l’idée de remettre sa personne ou sa cause à Dieu. « Confie-toi » rend naturellement l’expression sans effacer l’image originale, signalée en note.
- source_word: אֶל
  choice: à
  rationale: La préposition exprime ici la direction vers Yahvé. Avec « se confier », le français idiomatique demande « à ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le tétragramme est rendu par le nom divin « Yahvé », plutôt que remplacé par un titre.
- source_word: יְפַלְּטֵהוּ
  choice: qu’il le mette à l’abri
  rationale: Le piel de פלט exprime le fait de faire échapper ou de mettre en sûreté. Cette formulation distingue le premier verbe du parallèle נצל tout en restant claire en français.
- source_word: יַצִּילֵהוּ
  choice: qu’il le délivre
  rationale: Le hiphil de נצל signifie couramment arracher au danger ou délivrer. « Délivrer » conserve la force du second membre du parallélisme.
- source_word: כִּי
  choice: puisque
  rationale: La conjonction introduit la raison invoquée dans la raillerie.
- source_word: חָפֵץ בּוֹ
  choice: prend plaisir en lui
  rationale: חפץ avec ב exprime le plaisir ou la faveur accordée à quelqu’un. Cette traduction conserve la nuance relationnelle et reste volontairement ouverte quant à l’identité grammaticale du sujet.
theological_decisions:
- issue: Raillerie citée et changement de personne grammaticale
  choice: Conserver « Confie-toi » à la deuxième personne, puis « qu’il le mette… qu’il le délivre » à la troisième personne.
  alternative: Harmoniser la phrase en paraphrasant « Confiez-le à Yahvé » ou « Il s’en est remis à Yahvé ».
  rationale: Le texte massorétique porte un impératif sans complément explicite, suivi de suffixes masculins singuliers à la troisième personne. Le passage de la deuxième à la troisième personne peut refléter la vivacité de la raillerie. La traduction préserve cette tension au lieu d’ajouter un objet absent ou de transformer l’impératif en constat.
- issue: Référent de « il » dans « puisqu’il prend plaisir en lui »
  choice: Maintenir les pronoms sans expliciter « Yahvé » ni « cet homme ».
  alternative: Traduire « puisque Yahvé prend plaisir en lui » pour lever l’ambiguïté.
  rationale: Le contexte rend probable que Yahvé soit le sujet et l’affligé l’objet, mais l’hébreu les exprime seulement par les formes verbales et pronominales. L’explicitation n’est pas nécessaire dans le texte principal.
translation_notes:
  register: Français international actuel, digne et oralement naturel. Les impératifs et les exclamations conservent le ton de raillerie. « Mettre à l’abri » et « délivrer » maintiennent la distinction entre les deux verbes parallèles.
