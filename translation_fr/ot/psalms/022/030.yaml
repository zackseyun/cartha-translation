id: PSA.22.30
reference: Psalms 22:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זֶ֥רַע יַֽעַבְדֶ֑/נּוּ יְסֻפַּ֖ר לַֽ/אדֹנָ֣/י לַ/דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/030.yaml
  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: fr
  text: Une descendance le servira ; on parlera du Seigneur à la génération à venir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la génération » ; il peut s’agir de la génération suivante ou d’une génération déterminée par le contexte.'
    reason: L’hébreu ne comporte pas d’équivalent explicite de « à venir » et garde une certaine indétermination.
lexical_decisions:
- source_word: זֶרַע
  choice: une descendance
  rationale: Le nom collectif désigne ici les descendants ou la postérité. « Descendance » conserve la valeur collective sans l’étrangeté, en français, de « une semence ».
- source_word: יַעַבְדֶנּוּ
  choice: le servira
  rationale: Le suffixe masculin singulier renvoie naturellement à Dieu dans le contexte immédiat ; le futur rend l’inaccompli hébreu.
- source_word: יְסֻפַּר
  choice: on parlera
  rationale: Le pual exprime une proclamation ou un récit transmis. La tournure impersonnelle française restitue le passif sans imposer un sujet absent de l’hébreu.
- source_word: לַאדֹנָי
  choice: du Seigneur
  rationale: 'La préposition ל peut ici introduire le contenu ou l’objet du récit : on parlera au sujet du Seigneur. La traduction évite de lire « au Seigneur », peu probable dans ce contexte.'
- source_word: לַדּוֹר
  choice: à la génération à venir
  rationale: Littéralement « à la génération ». Le contexte de transmission à la postérité permet d’expliciter qu’il s’agit de la génération suivante, tout en signalant cette explicitation par une note.
theological_decisions:
- issue: Référent du pronom dans « le servira »
  choice: Dieu / le Seigneur
  alternative: Le personnage affligé du psaume
  rationale: Dans le contexte proche, le service cultuel et la mention explicite du Seigneur favorisent le référent divin, sans ajouter son nom dans le corps du verset.
- issue: Sens de la préposition ל devant אֲדֹנָי
  choice: au sujet du Seigneur
  alternative: au Seigneur
  rationale: Le parallèle avec la proclamation destinée à une génération favorise le Seigneur comme contenu du récit plutôt que comme destinataire.
translation_notes:
  register: Français international moderne, simple et digne. « Une descendance » reste proche de l’image collective hébraïque, tandis que « on parlera » produit une phrase naturelle sans effacer l’impersonnalité du verbe passif.
