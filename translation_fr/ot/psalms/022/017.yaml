source:
  edition: WLC
  text: אֲסַפֵּ֥ר כָּל עַצְמוֹתָ֑/י הֵ֥מָּה יַ֝בִּ֗יטוּ יִרְאוּ בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/017.yaml
  text: I can count all my bones[a]; they look[b], they stare at me.
translation:
  language: fr
  text: Je peux compter tous mes os[a] ; eux, ils me regardent, ils me dévisagent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je compte tous mes os. » Le verbe hébreu peut signifier « compter » ou « raconter », mais son complément, « tous mes os », favorise ici l’idée de les compter un à un.'
    reason: lexical_alternative
  - marker: b
    text: 'Les deux verbes hébreux liés à la vue sont juxtaposés pour produire une insistance : « ils regardent, ils voient » ou « ils regardent, ils fixent les yeux sur moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲסַפֵּר
  choice: Je peux compter
  rationale: Le piel de ספר peut signifier « compter » ou « raconter ». Avec « tous mes os » comme complément, le sens d’un dénombrement ressort nettement ; « je peux compter » exprime naturellement en français que les os sont devenus visibles ou perceptibles un à un.
- source_word: כָּל
  choice: tous
  rationale: Ce choix direct conserve l’idée de totalité exprimée par l’hébreu.
- source_word: עַצְמוֹתַי
  choice: mes os
  rationale: La traduction littérale garde l’image physique saisissante sans en expliciter abusivement la cause.
- source_word: הֵמָּה
  choice: eux, ils
  rationale: La dislocation française rend l’insistance du pronom indépendant hébreu tout en restant naturelle.
- source_word: יַבִּיטוּ
  choice: regardent
  rationale: Le verbe désigne un regard dirigé et attentif. « Regarder » convient au registre moderne et prépare l’intensification du verbe suivant.
- source_word: יִרְאוּ
  choice: dévisagent
  rationale: Dans cette paire de verbes de vision, « dévisager » restitue l’insistance du second terme et la contemplation appuyée des spectateurs, sans ajouter explicitement une intention hostile.
- source_word: בִי
  choice: me
  rationale: Avec « regarder » et « dévisager », le pronom objet direct est la tournure française idiomatique correspondant ici à la préposition hébraïque.
theological_decisions:
- issue: Usage messianique dans la tradition chrétienne
  choice: Traduire selon le sens poétique du texte hébreu, comme l’expression d’une souffrance corporelle visible sous le regard de spectateurs.
  alternative: Employer une formulation davantage marquée par une lecture explicite de la crucifixion.
  rationale: Le psaume 22 joue un rôle majeur dans l’interprétation chrétienne, mais ce verset doit conserver son image propre sans ajout christologique. Les liens canoniques peuvent se dégager du contexte plutôt que d’une formulation importée.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule maintient les deux mouvements du verset ; « eux, ils » conserve l’emphase hébraïque, tandis que « me regardent, me dévisagent » rend le parallélisme intensif sans archaïsme.
