base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: fr
  text: Tous les gens prospères[a] de la terre mangeront et se prosterneront ; devant lui, tous ceux qui descendent dans la poussière[b] s’agenouilleront, même celui qui n’a pas pu se maintenir en vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tous les gras de la terre ». L’expression désigne probablement les personnes prospères ou bien nourries.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous ceux qui descendent vers la poussière ». La poussière est ici une image hébraïque de la mortalité et de la mort.'
    reason: lexical_alternative
  - marker: c
    text: 'La dernière proposition hébraïque est difficile. Littéralement : « et sa vie, il ne l’a pas maintenue en vie » ; elle est souvent comprise comme désignant celui qui n’a pas pu se maintenir lui-même en vie.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: mangeront
  rationale: Le parfait qal peut avoir ici une portée future dans cette vision poétique, en coordination avec les actions d’hommage qui suivent.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: se prosterneront
  rationale: Le verbe exprime l’action de s’incliner ou de se prosterner, souvent en signe d’adoration ; ce choix conserve l’image corporelle sans expliciter davantage sa portée cultuelle.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: tous les gens prospères de la terre
  rationale: L’expression désigne littéralement les « gras » de la terre, c’est-à-dire les personnes bien nourries et prospères. Cette formulation française restitue naturellement le sens social de l’image.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: Équivalent français direct et naturel, qui peut indiquer aussi bien la position que l’hommage rendu en sa présence.
- source_word: יִכְרְעוּ
  choice: s’agenouilleront
  rationale: Le verbe כרע évoque précisément le fait de plier les genoux ; la traduction préserve cette image distincte de la prosternation.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: tous ceux qui descendent vers la poussière
  rationale: La formulation garde l’image hébraïque de la poussière associée à la mortalité et à la mort, sans la remplacer directement par « tombe ».
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: même celui qui ne peut se maintenir en vie
  rationale: La proposition est syntaxiquement difficile. Cette traduction exprime l’interprétation courante d’une personne incapable de préserver sa propre vie, tout en signalant l’incertitude dans une note.
theological_decisions:
- issue: Interprétation de la proposition finale וְנַפְשׁוֹ לֹא חִיָּה
  choice: Elle désigne celui qui ne peut se maintenir en vie, ce qui étend l’hommage aux mortels proches de la mort.
  alternative: « et il n’a pas conservé sa vie » ou « et sa vie n’a pas été conservée »
  rationale: L’hébreu est condensé et discuté. Le contexte met en contraste les gens prospères et ceux qui descendent vers la poussière ; la traduction retenue suit ce mouvement sans transformer l’ambiguïté grammaticale en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme corporel entre « se prosterner » et « s’agenouiller » est conservé, ainsi que l’image poétique de la poussière. Les notes suivent l’ordre des marqueurs dans le texte.
