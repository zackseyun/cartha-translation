  source_fidelity: 'Le sens général et le parallélisme sont bien rendus : les prospères mangent et se prosternent, tandis que ceux qui vont vers la poussière s’agenouillent devant lui. La proposition finale est notoirement elliptique et difficile. « ne peut » atténue toutefois la valeur du parfait hébreu et s’éloigne de l’interprétation prudente attestée par l’audit anglais (« could not »). « n’a pas pu se maintenir en vie » rend plus exactement cette lecture sans prétendre résoudre la syntaxe hébraïque.'
  naturalness: Le français est moderne, digne et fluide. « Tous les gens prospères » est naturel dans un registre accessible. Le déplacement du marqueur a immédiatement après « prospères » rend son rattachement lexical plus clair. « Dans la poussière » est une destination plus directe et idiomatique ici que « vers la poussière ».
  terminology: « Se prosterner » et « s’agenouiller » conservent utilement la distinction entre les deux verbes hébreux. « Poussière » préserve l’image de mortalité sans la réduire à la tombe. La note finale maintient explicitement le caractère discuté de la construction et ne lui impose pas de portée doctrinale.
