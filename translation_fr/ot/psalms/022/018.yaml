  text: They divide my garments among themselves[a], and for my clothing they cast lots.
translation:
  language: fr
  text: Ils se partagent mes vêtements[a] et tirent au sort mon vêtement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette ligne trouve un écho dans les récits évangéliques de la crucifixion de Jésus ; voir Matthieu 27.35 ; Marc 15.24 ; Luc 23.34 ; Jean 19.24.
    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: ils se partagent
  rationale: Le piel inaccompli décrit ici, dans une scène poétique vive, la répartition des vêtements entre plusieurs personnes. « Se partagent » exprime naturellement en français la distribution au sein du groupe.
- source_word: בְגָדַי
  choice: mes vêtements
  rationale: בגד désigne couramment des vêtements. Ce choix est naturel, digne et suffisamment général.
- source_word: לָהֶם
  choice: se
  rationale: Le complément לָהֶם signifie littéralement « pour eux ». Intégré au verbe pronominal « se partager », il rend idiomatiquement l’idée qu’ils répartissent les vêtements entre eux.
- source_word: לְבוּשִׁי
  choice: mon habit
  rationale: לבוש peut désigner un vêtement ou l’habillement. Le singulier « mon habit » respecte la forme hébraïque et maintient une distinction lexicale avec « mes vêtements », sans préciser indûment qu’il s’agit d’une robe ou d’une tunique.
- source_word: יַפִּילוּ גוֹרָל
  choice: tirent au sort
  rationale: L’expression hébraïque signifie littéralement « faire tomber un lot ». « Tirer au sort » est l’idiome français courant correspondant, tout en conservant l’idée d’une attribution décidée par le sort.
theological_decisions:
- issue: Résonance messianique et reprise dans le Nouveau Testament
  choice: Traduire directement la scène poétique du texte hébreu, sans introduire dans le verset un vocabulaire explicite de crucifixion.
  alternative: Formuler le verset de manière à mettre au premier plan son accomplissement lors de la crucifixion de Jésus.
  rationale: Le verset est repris dans les récits de la Passion, mais la traduction doit d’abord rendre l’hébreu. La note signale le lien canonique sans modifier le sens lexical du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique est préservé grâce à la distinction entre « mes vêtements » et « mon habit ». Le présent rend la vivacité de la scène.
