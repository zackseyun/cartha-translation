  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: fr
  text: Les affligés[a] mangeront et seront rassasiés[b] ; ceux qui le cherchent loueront Yahweh. Que votre cœur vive à jamais[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les humbles », « les pauvres » ou « les doux ».
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte du psaume, ce repas peut évoquer un festin sacrificiel ou lié à l’accomplissement d’un vœu, mais le verset ne le précise pas.
    reason: cultural_note
  - marker: c
    text: 'L’hébreu dit littéralement « votre cœur » : « cœur » est au singulier, probablement avec un sens collectif, tandis que « votre » s’adresse à plusieurs personnes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: les affligés
  rationale: Le terme peut désigner les humbles, les pauvres, les doux ou ceux qui ont été abaissés par l’épreuve. Dans le mouvement de ce psaume, « les affligés » rend bien leur situation de détresse suivie du secours de Dieu, sans réduire le mot à une qualité morale.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: mangeront et seront rassasiés
  rationale: Les imparfaits décrivent ici naturellement le résultat à venir de la délivrance. « Être rassasié » conserve le sens concret d’une nourriture pleinement suffisante.
- source_word: יְהַלְלוּ
  choice: loueront
  rationale: Le piel exprime la louange adressée à Dieu en réponse à son intervention.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: דֹּרְשָׁיו
  choice: ceux qui le cherchent
  rationale: Cette formulation française naturelle rend le participe et son suffixe, lequel renvoie à Yahweh, tout en exprimant une orientation continue vers Dieu.
- source_word: יְחִי
  choice: Que … vive
  rationale: 'La forme verbale a ici une valeur jussive : elle exprime un souhait ou une bénédiction plutôt qu’une simple prédiction.'
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: L’hébreu emploie « cœur » au singulier avec un suffixe de deuxième personne du pluriel. Le singulier collectif est conservé afin de respecter la forme et de représenter la vie intérieure de la communauté interpellée.
- source_word: לָעַד
  choice: à jamais
  rationale: Cette expression française actuelle et digne rend la durée indéfinie exprimée par l’hébreu.
theological_decisions:
- issue: Changement d’adresse dans la dernière proposition
  choice: Conserver l’adresse directe à la deuxième personne du pluriel sous la forme collective « votre cœur »
  alternative: « Que vos cœurs vivent à jamais » ou « Leur cœur vivra à jamais »
  rationale: Le suffixe hébreu est pluriel, tandis que le nom « cœur » est singulier. La traduction garde à la fois l’adresse directe à la communauté des adorateurs et le singulier collectif du texte.
- issue: Nature du repas
  choice: Traduire littéralement l’action de manger et d’être rassasié
  alternative: Préciser dans le texte qu’il s’agit d’un repas sacrificiel ou votif
  rationale: Le contexte du psaume peut évoquer un repas lié à un sacrifice d’accomplissement de vœu, mais ce verset ne le dit pas explicitement. Cette possibilité est donc signalée en note sans être imposée au texte.
translation_notes:
  register: Français international moderne, clair et digne. Le futur exprime l’issue de la délivrance ; la dernière phrase garde la tonalité de bénédiction. Le nom divin « Yahweh » et le singulier collectif « votre cœur » préservent des traits significatifs de l’hébreu.
