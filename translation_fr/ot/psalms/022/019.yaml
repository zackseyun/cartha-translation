source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: fr
  text: 'Mais toi, Yahweh, ne sois pas loin !

    Ma force[a], hâte-toi de me secourir !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon secours ». Le mot hébreu, rare, a aussi été rattaché au terme désignant une biche, mais ce sens paraît moins probable ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque ici un contraste appuyé avec la détresse décrite auparavant. « Mais toi » rend naturellement cette opposition.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אַל־תִּרְחָק
  choice: ne reste pas loin
  rationale: Le verbe signifie « être loin, distant ». Cette formulation française conserve la supplication directe sans suggérer nécessairement que Yahweh serait en train de s’éloigner.
- source_word: אֱיָלוּתִי
  choice: ma force
  rationale: Dans ce contexte, le mot est le mieux compris comme une désignation de la force ou de la puissance que Dieu procure, bien que sa forme rare permette d’autres analyses.
- source_word: לְעֶזְרָתִי
  choice: me secourir
  rationale: La tournure hébraïque signifie littéralement « pour mon secours ». L’infinitif français exprime naturellement le but de l’action urgente demandée.
- source_word: חוּשָׁה
  choice: hâte-toi
  rationale: L’impératif exprime l’urgence. « Hâte-toi » convient au registre poétique et digne du psaume tout en restant immédiatement compréhensible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le nom divin. Le conserver sous la forme « Yahweh » distingue le nom propre d’un simple titre.
- issue: Sens de l’appellation אֱיָלוּתִי
  choice: ma force
  alternative: mon secours ; ma biche
  rationale: Le contexte d’un appel urgent au secours favorise le sens abstrait « ma force ». Une note conserve toutefois l’incertitude liée à ce terme rare sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux exclamations reproduisent l’intensité de la supplication. « Hâte-toi » a été retenu plutôt que « dépêche-toi », trop familier dans ce contexte.
