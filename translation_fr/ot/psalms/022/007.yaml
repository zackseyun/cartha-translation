lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Tous ceux qui me voient
  rationale: Le quantificateur כָּל et le participe substantivé רֹאַי sont rendus par une proposition relative naturelle en français, sans réduire l’universalité exprimée.
- source_word: יַלְעִגוּ לִי
  choice: se moquent de moi
  rationale: Le verbe exprime ici une dérision dirigée contre le psalmiste ; cette formulation est claire, actuelle et fidèle.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: ils font la moue
  rationale: L’expression hébraïque, littéralement liée à l’ouverture ou au mouvement des lèvres, désigne vraisemblablement une mimique méprisante. « Faire la moue » restitue naturellement en français le geste facial de dédain, tandis que la note conserve l’image littérale et son incertitude.
- source_word: יָנִיעוּ רֹאשׁ
  choice: ils hochent la tête
  rationale: Cette expression rend le geste visible de dérision sans lui attribuer le sens moderne d’un assentiment ; la note précise sa valeur méprisante dans ce contexte.
theological_decisions:
- issue: Lecture messianique dans l’interprétation chrétienne ultérieure
  choice: Traduire d’abord le verset dans son contexte psalmique, comme la parole du psalmiste souffrant, sans ajouter de formulation explicitement christologique.
  alternative: Rendre le texte de manière à mettre directement en avant son écho dans les récits évangéliques de la Passion.
  rationale: La traduction doit refléter le texte hébreu lui-même. La note peut signaler l’écho ultérieur sans l’introduire dans le corps du verset.
translation_notes:
  register: Français international moderne, simple et digne. « Faire la moue » privilégie l’intelligibilité tout en conservant dans la note l’image corporelle de l’hébreu et son ambiguïté lexicale.
