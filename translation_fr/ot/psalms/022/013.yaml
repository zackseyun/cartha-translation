  text: פָּצ֣וּ עָלַ֣/י פִּי/הֶ֑ם אַ֝רְיֵ֗ה טֹרֵ֥ף וְ/שֹׁאֵֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/013.yaml
  text: They open their mouth against me like a tearing and roaring lion[a].
translation:
  language: fr
  text: Ils ouvrent grand la bouche contre moi, comme un lion qui déchire et rugit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils ouvrent grand la bouche contre moi : un lion qui déchire et rugit. » En hébreu, l’image du lion est formulée de manière condensée, sans terme explicite correspondant à « comme ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצ֣וּ
  choice: Ils ouvrent grand
  rationale: Le verbe פצה signifie ouvrir largement. Le présent de narration rend ici la vivacité du parfait poétique, tandis que « grand » exprime naturellement en français l’idée d’ouverture béante.
- source_word: עָלַי
  choice: contre moi
  rationale: Dans ce contexte hostile, עַל indique une direction menaçante; « contre moi » en restitue clairement la force adversative.
- source_word: פִּיהֶם
  choice: la bouche
  rationale: L’hébreu emploie le singulier avec un suffixe pluriel. Le français peut conserver ce singulier distributif après « ils » sans obscurcir le sens.
- source_word: אַרְיֵה
  choice: comme un lion
  rationale: Aucune particule comparative n’est exprimée, mais l’apposition compacte fonctionne comme une image comparative. « Comme » rend cette relation explicite et naturelle en français.
- source_word: טֹרֵף
  choice: qui déchire
  rationale: Le participe qal de טרף décrit l’action violente du lion qui met sa proie en pièces. La proposition relative rattache clairement l’action au lion.
- source_word: וְשֹׁאֵג
  choice: et rugit
  rationale: שׁאג est le verbe courant pour le rugissement du lion. Le présent coordonné à « déchire » restitue les deux participes hébreux.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Ouvrent grand la bouche » conserve l’image concrète et menaçante; la relative évite l’ambiguïté d’un rattachement des actions aux assaillants plutôt qu’au lion.
