  text: אֱֽלֹהַ֗/י אֶקְרָ֣א י֭וֹמָם וְ/לֹ֣א תַעֲנֶ֑ה וְ֝/לַ֗יְלָה וְֽ/לֹא דֽוּמִיָּ֥ה לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: fr
  text: Mon Dieu, je crie le jour, mais tu ne réponds pas ; la nuit, je ne trouve pas le silence.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la nuit, je n’ai aucun repos ». L’hébreu dit littéralement : « et la nuit, pas de silence pour moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Le nom porte le suffixe de première personne du singulier et fonctionne ici comme une adresse directe.
- source_word: אֶקְרָא
  choice: je crie
  rationale: Dans cette plainte, קרא exprime un appel pressant adressé à Dieu ; « je crie » rend cette intensité sans ajout.
- source_word: יוֹמָם
  choice: le jour
  rationale: Emploi adverbial, mis en parallèle avec « la nuit » ; cette tournure est naturelle en français poétique courant.
- source_word: וְלֹא תַעֲנֶה
  choice: mais tu ne réponds pas
  rationale: 'Le « mais » explicite la valeur adversative naturelle de la plainte : le psalmiste crie, sans recevoir de réponse.'
- source_word: וְלַיְלָה
  choice: la nuit
  rationale: Conserve le parallélisme temporel avec « le jour » sans alourdir la phrase.
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: je ne garde pas le silence
  rationale: דומיה désigne le silence ou la quiétude. Dans la construction elliptique « pas de silence pour moi », cette formulation française conserve l’image et peut exprimer que la plainte se poursuit pendant la nuit.
theological_decisions:
- issue: Sens de la proposition finale וְלֹא דֽוּמִיָּה לִי
  choice: Le psalmiste ne garde pas le silence pendant la nuit.
  alternative: Je n’ai aucun repos / il n’y a pas de silence pour moi.
  rationale: Le nom דומיה signifie d’abord « silence, quiétude ». Le contexte immédiat du cri de jour comme de nuit permet de comprendre que le psalmiste ne cesse pas de crier. Comme l’hébreu reste elliptique et peut aussi évoquer l’absence de repos, une note conserve cette ambiguïté.
translation_notes:
  register: Français moderne, sobre et digne. Le point-virgule fait ressortir le parallélisme entre le jour et la nuit. Le tutoiement correspond à l’adresse directe habituelle de la prière biblique en français.
