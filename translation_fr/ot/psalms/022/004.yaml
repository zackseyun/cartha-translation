  text: בְּ֭/ךָ בָּטְח֣וּ אֲבֹתֵ֑י/נוּ בָּ֝טְח֗וּ וַֽ/תְּפַלְּטֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/004.yaml
  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: fr
  text: En toi nos pères ont mis leur confiance ; ils ont mis leur confiance, et tu les as délivrés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּךָ
  choice: En toi
  rationale: La préposition ב avec le suffixe de deuxième personne marque ici l’objet de la confiance. « En toi » est naturel en français et n’ajoute pas l’idée d’exclusivité absente du texte.
- source_word: בָּטְחוּ
  choice: ont mis leur confiance
  rationale: Le verbe בטח exprime une confiance assurée ou le fait de s’appuyer sur quelqu’un. Cette tournure française conserve clairement l’orientation personnelle de la confiance.
- source_word: אֲבֹתֵינוּ
  choice: nos pères
  rationale: Le terme hébreu est explicitement masculin et signifie littéralement « nos pères ». Dans ce contexte historique, il désigne les pères des générations passées, sans qu’il soit nécessaire de le neutraliser en « ancêtres ».
- source_word: בָּטְחוּ
  choice: ils ont mis leur confiance
  rationale: La répétition du même verbe est maintenue, puisqu’elle donne au verset son insistance poétique.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: et tu les as délivrés
  rationale: Le verbe פלט signifie délivrer, sauver ou faire échapper. « Délivrés » convient au registre des psaumes tout en laissant ouverte la forme précise du secours.
theological_decisions:
- issue: Portée historique de אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: « Nos pères » rend directement le substantif masculin hébreu et conserve le langage intergénérationnel du psaume. « Nos ancêtres » exprimerait bien la portée collective, mais rendrait moins visible la formulation de la source.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme et la répétition de בטח sont conservés. Le passé composé rend naturellement en français l’action passée rappelée comme pertinente dans la prière présente.
