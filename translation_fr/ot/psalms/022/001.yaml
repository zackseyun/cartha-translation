base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: fr
  text: Mon Dieu, mon Dieu, pourquoi m’as-tu abandonné ? Les paroles de mon rugissement[a] sont loin de ma délivrance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les paroles de mon gémissement » ou « de mon cri ». L’hébreu emploie littéralement l’image vigoureuse d’un rugissement pour exprimer une détresse intense.
    reason: lexical_alternative
  - marker: b
    text: 'La construction hébraïque est condensée. On peut aussi comprendre ce membre comme la continuation de la question : « Pourquoi es-tu si loin, sans me délivrer, malgré mes rugissements ? » Cette interprétation explicite des éléments implicites. « Ma délivrance » peut également se traduire par « mon salut » ou « mon secours ».'
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: אֵלִי אֵלִי
  choice: Mon Dieu, mon Dieu
  rationale: La répétition et le possessif expriment directement l’invocation angoissée, sans ajouter d’explication.
- source_word: לָמָה
  choice: pourquoi
  rationale: Équivalent français naturel de l’interrogation portant sur la raison.
- source_word: עֲזַבְתָּנִי
  choice: m’as-tu abandonné
  rationale: « Abandonner » rend clairement le fait de laisser ou de délaisser quelqu’un et convient au français moderne tout en gardant la gravité de la plainte.
- source_word: רָחוֹק
  choice: sont loin de
  rationale: Cette formulation conserve l’image de la distance et permet de reproduire, sans la résoudre, la construction condensée de l’hébreu.
- source_word: מִישׁוּעָתִי
  choice: ma délivrance
  rationale: Dans cette plainte, le terme désigne concrètement le secours ou la délivrance espérée, sans imposer un sens doctrinal plus étroit.
- source_word: דִּבְרֵי שַׁאֲגָתִי
  choice: les paroles de mon rugissement
  rationale: La formulation garde à la fois le pluriel « paroles » et l’image forte du rugissement, employée ici pour une clameur de détresse.
theological_decisions:
- issue: Sens de יְשׁוּעָה dans un psaume à forte portée messianique
  choice: ma délivrance
  alternative: mon salut ; mon secours
  rationale: « Délivrance » convient au besoin immédiat de sauvetage exprimé par le psalmiste et n’importe pas dans le verset un sens doctrinal que le contexte n’exige pas.
- issue: Construction syntaxique du dernier membre
  choice: Les paroles de mon rugissement sont loin de ma délivrance
  alternative: Tu es loin de me délivrer, loin des paroles de mon rugissement
  rationale: L’hébreu est très condensé et permet diverses analyses. Le texte principal suit au plus près l’ordre et les rapports grammaticaux visibles, tandis que la note signale la lecture qui comprend Dieu comme sujet implicite. Cette ambiguïté ne doit pas être tranchée silencieusement.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le second membre demeure volontairement saisissant et légèrement inhabituel afin de préserver la syntaxe condensée et l’image forte de l’hébreu ; les lectures plus fluides sont données en note.
