  text: סְ֭בָבוּ/נִי פָּרִ֣ים רַבִּ֑ים אַבִּירֵ֖י בָשָׁ֣ן כִּתְּרֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/012.yaml
  text: Many bulls surround me[a]; mighty bulls of Bashan encircle me.
translation:
  language: fr
  text: De nombreux taureaux m’entourent ; de puissants taureaux du Bashân[a] m’encerclent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Bashân était une région située à l’est du Jourdain, réputée pour ses pâturages et son bétail robuste et bien nourri ; l’expression évoque des adversaires puissants et menaçants.
    reason: cultural_note
lexical_decisions:
- source_word: סְבָבוּנִי
  choice: m’entourent
  rationale: Le verbe סבב signifie « entourer, tourner autour ». Le présent français rend avec force la situation où le psalmiste se trouve déjà cerné, sans alourdir le vers poétique.
- source_word: פָּרִים רַבִּים
  choice: de nombreux taureaux
  rationale: פָּרִים désigne des taureaux ou de jeunes taureaux, et רַבִּים indique leur grand nombre. « De nombreux taureaux » est naturel et conserve l’image menaçante.
- source_word: אַבִּירֵי
  choice: de puissants taureaux
  rationale: אַבִּירֵי désigne ici des êtres puissants ou robustes. Le nom « taureaux » est repris pour rendre explicite l’apposition tout en maintenant l’image bovine du premier membre.
- source_word: בָשָׁן
  choice: Bashân
  rationale: Le nom propre est conservé sous une forme française qui reflète la translittération de l’hébreu. La note explique l’association culturelle du lieu avec un bétail robuste.
- source_word: כִּתְּרוּנִי
  choice: m’encerclent
  rationale: Le verbe כתר signifie ici « entourer, encercler ». « M’encerclent » préserve le parallélisme avec « m’entourent » sans répétition identique.
theological_decisions:
- issue: Image animale désignant des adversaires hostiles
  choice: Conserver directement la métaphore des « taureaux ».
  alternative: Remplacer l’image par « ennemis » ou « adversaires ».
  rationale: L’hébreu présente les opposants au moyen d’une image animale saisissante. La conserver respecte la poésie et n’impose pas dans le texte principal une interprétation explicative.
- issue: Valeur temporelle des verbes à l’accompli
  choice: 'Employer le présent poétique : « m’entourent », « m’encerclent ».'
  alternative: 'Employer le passé composé : « m’ont entouré », « m’ont encerclé ».'
  rationale: Les formes hébraïques décrivent le psalmiste comme déjà cerné, mais le présent français exprime naturellement cette situation actuelle et vive sans nier l’aspect accompli du danger.
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme hébreu est conservé par les verbes proches « entourent » et « encerclent », tandis que la métaphore demeure intacte.
