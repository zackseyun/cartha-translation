id: PSA.22.20
reference: Psalms 22:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַצִּ֣ילָ/ה מֵ/חֶ֣רֶב נַפְשִׁ֑/י מִ/יַּד כֶּ֝֗לֶב יְחִידָתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/020.yaml
  text: Deliver my life from the sword[c][b][a], my only one from the power of the dog.
translation:
  language: fr
  text: Délivre ma vie[a] de l’épée, ma seule vie[b] du pouvoir[c] du chien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon âme ». Le mot hébreu peut désigner l’âme, la personne elle-même ou la vie, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « mon unique » ; on peut aussi comprendre « ma vie précieuse ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « de la main » ; cette expression hébraïque désigne ici le pouvoir ou l’emprise.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילָה
  choice: Délivre
  rationale: L’impératif de נצל exprime ici un appel direct et pressant au secours. « Délivre » convient au registre de la prière de lamentation sans ajouter de précision absente de l’hébreu.
- source_word: מֵחֶרֶב
  choice: de l’épée
  rationale: La préposition מן indique l’éloignement d’un danger. L’article générique de « l’épée » présente l’arme comme une menace mortelle, sans supposer une épée déterminée.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Dans cette supplication face à un péril mortel, נֶפֶשׁ désigne naturellement la vie ou la personne vivante plutôt qu’une âme immatérielle distincte du corps.
- source_word: מִיַּד
  choice: du pouvoir
  rationale: Littéralement « de la main », l’expression désigne couramment le pouvoir, l’emprise ou la domination. « Du pouvoir » en communique clairement le sens idiomatique.
- source_word: כֶּלֶב
  choice: du chien
  rationale: Le singulier hébreu et son image saisissante sont conservés. Le texte peut évoquer métaphoriquement un ennemi, mais la traduction ne l’explicite pas.
- source_word: יְחִידָתִי
  choice: ma seule vie
  rationale: Le substantif féminin signifie littéralement « mon unique » ou « ma seule ». En parallèle avec נַפְשִׁי, l’ajout explicite de « vie » rend le référent intelligible en français tout en conservant l’idée d’unicité.
theological_decisions:
- issue: Sens anthropologique de נַפְשִׁי dans une lamentation
  choice: « ma vie »
  alternative: « mon âme »
  rationale: Le contexte est celui d’une délivrance face à la mort. « Ma vie » respecte le sens concret du terme sans imposer une conception dualiste du rapport entre corps et âme.
- issue: Référent et nuance de יְחִידָתִי
  choice: « ma seule vie »
  alternative: « mon unique », « ma vie précieuse »
  rationale: La formulation retenue conserve l’unicité exprimée par l’hébreu et le parallélisme avec « ma vie ». « Précieuse » exprimerait bien une nuance possible, mais la rendrait plus explicite que le texte source.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle du vers hébreu est maintenue. La répétition de « vie » clarifie en français le référent implicite de יְחִידָתִי, tandis que les notes préservent les principales possibilités lexicales.
