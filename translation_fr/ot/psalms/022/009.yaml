  text: כִּֽי אַתָּ֣ה גֹחִ֣/י מִ/בָּ֑טֶן מַ֝בְטִיחִ֗/י עַל שְׁדֵ֥י אִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: fr
  text: Car c’est toi qui m’as fait sortir du ventre maternel, qui m’as donné confiance au sein de ma mère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui m’as mis en sécurité au sein de ma mère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui soutient l’appel précédent et conserve le mouvement argumentatif du psaume.
- source_word: אַתָּה
  choice: c’est toi
  rationale: 'La tournure détachée rend l’insistance du pronom hébreu explicite : Dieu lui-même est l’auteur de cette action.'
- source_word: גֹחִי
  choice: qui m’as fait sortir
  rationale: Dans le contexte de la naissance, le participe désigne celui qui fait sortir l’enfant; cette formulation garde l’image concrète sans lui substituer l’idée plus interprétative de délivrance.
- source_word: מִבָּטֶן
  choice: du ventre maternel
  rationale: Rend naturellement en français le lieu d’où l’enfant est tiré tout en explicitant sobrement le contexte de l’accouchement.
- source_word: מַבְטִיחִי
  choice: qui m’as donné confiance
  rationale: Le hiphil de בטח peut exprimer le fait de donner confiance ou de mettre en sécurité. « Donné confiance » préserve ici le sens causatif et la tension théologique du texte.
- source_word: עַל
  choice: sur
  rationale: Reproduit l’image concrète exprimée par la préposition hébraïque, malgré une formulation française légèrement marquée.
- source_word: שְׁדֵי אִמִּי
  choice: les seins de ma mère
  rationale: Traduction précise et non euphémisée de l’image de l’allaitement, avec conservation du possessif.
theological_decisions:
- issue: מַבְטִיחִי désigne-t-il la confiance du nourrisson ou la sécurité que Dieu lui procure ?
  choice: qui m’as donné confiance
  alternative: qui m’as gardé en sécurité
  rationale: Le causatif hébreu permet les deux compréhensions. Le texte principal conserve la notion lexicale de confiance sans préciser le degré de conscience du nourrisson; la note signale la lecture axée sur la sécurité afin de ne pas résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, digne et direct. « C’est toi » marque l’emphase; « ventre maternel » est naturel dans un contexte de naissance; l’expression concrète « les seins de ma mère » respecte l’hébreu.
