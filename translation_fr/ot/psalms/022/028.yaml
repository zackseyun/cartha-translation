id: PSA.22.28
reference: Psalms 22:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: fr
  text: Car la royauté[a] appartient à Yahweh[b], et il gouverne les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le royaume » ou « le règne ». Le nom hébreu peut désigner la royauté, le règne ou le royaume.
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de ce qui précède et conserve naturellement la valeur causale de la conjonction.
- source_word: לַיהוָה
  choice: appartient à Yahweh
  rationale: La préposition ל exprime ici la possession; la tournure française « appartient à » rend clairement cette relation.
- source_word: הַמְּלוּכָה
  choice: la royauté
  rationale: Le nom désigne d’abord la qualité, l’autorité ou l’exercice royal. « Royauté » préserve cette nuance sans réduire le terme à un territoire.
- source_word: וּמֹשֵׁל
  choice: et il gouverne
  rationale: Le participe qal exprime une réalité durable ou générale. Le présent français en rend naturellement la portée.
- source_word: בַּגּוֹיִם
  choice: les nations
  rationale: Avec le verbe משל, la préposition ב marque le domaine ou l’objet du gouvernement; « gouverner les nations » est idiomatique en français et גּוֹיִם désigne ici l’ensemble des nations.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend visible le nom divin présent dans le texte hébreu; une note signale la traduction traditionnelle.
- issue: Nuance de מְלוּכָה
  choice: la royauté appartient à Yahweh
  alternative: le royaume appartient à Yahweh; le règne appartient à Yahweh
  rationale: Le terme peut désigner la royauté, le règne ou le royaume. « Royauté » maintient la portée abstraite du pouvoir royal tout en laissant les autres nuances en note.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et poétique; « gouverne les nations » évite une tournure lourde tout en conservant l’idée de souveraineté universelle.
