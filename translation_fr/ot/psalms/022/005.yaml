  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: fr
  text: Vers toi ils ont crié, et ils ont été délivrés[a] ; en toi ils ont mis leur confiance, et ils n’ont pas été couverts de honte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ont échappé » ou « ils ont été secourus ». Le verbe hébreu peut désigner le fait d’échapper ou d’être délivré ; ici, il évoque le secours qui suit leur cri vers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils n’ont pas eu honte » ou « ils n’ont pas été déçus ». L’expression hébraïque peut évoquer le déshonneur subi lorsque la confiance placée en quelqu’un se révèle vaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: Vers toi
  rationale: La préposition אֶל avec le suffixe de deuxième personne indique la direction de l’appel. Placé en tête, « Vers toi » conserve l’accent du texte hébreu.
- source_word: זָעֲקוּ
  choice: ils ont crié
  rationale: זעק désigne ici un cri pressant adressé à Dieu pour obtenir du secours. Avec « vers toi », « ont crié » est naturel en français et garde la force de l’appel.
- source_word: וְנִמְלָטוּ
  choice: et ils ont été délivrés
  rationale: Le nifal de מלט peut exprimer le fait d’échapper ou d’être délivré. Dans le contexte d’un cri adressé à Dieu, la formulation passive rend bien le secours reçu sans préciser davantage le moyen de la délivrance.
- source_word: בְּךָ בָטְחוּ
  choice: en toi ils ont mis leur confiance
  rationale: Avec בטח, בְּ introduit l’objet de la confiance. Cette tournure française est claire, naturelle et conserve la reprise emphatique de « toi ».
- source_word: וְלֹא בֹשׁוּ
  choice: et ils n’ont pas été couverts de honte
  rationale: בוש peut décrire la honte ou le déshonneur résultant d’une confiance déçue. « Être couverts de honte » préserve la dimension publique et résultative mieux que le seul sentiment d’avoir honte.
theological_decisions:
- issue: Nature de la délivrance exprimée par נִמְלָטוּ
  choice: une délivrance reçue après l’appel adressé à Dieu
  alternative: une simple fuite ou le fait d’échapper, sans mise en relief du secours divin
  rationale: L’enchaînement entre le cri vers Dieu et l’issue favorable suggère un secours reçu. Le passif « ont été délivrés » respecte cette logique sans ajouter explicitement un agent que la forme verbale ne nomme pas.
- issue: Portée de בֹשׁוּ dans le contexte de la confiance
  choice: ne pas être couverts de honte
  alternative: ne pas avoir honte ; ne pas être déçus
  rationale: La traduction retenue garde à la fois la dimension d’honneur et de honte et l’idée que la confiance placée en Dieu n’aboutit pas au déshonneur. Elle évite de réduire le terme à une émotion intérieure ou à une simple déception.
translation_notes:
  register: Français international moderne, poétique mais accessible. L’ordre initial « Vers toi » et la reprise « en toi » conservent le parallélisme et l’accent du vers hébreu. Le passé composé rend le récit rétrospectif de manière naturelle sans archaïsme.
