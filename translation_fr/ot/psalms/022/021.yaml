id: PSA.22.21
reference: Psalms 22:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֭וֹשִׁיעֵ/נִי מִ/פִּ֣י אַרְיֵ֑ה וּ/מִ/קַּרְנֵ֖י רֵמִ֣ים עֲנִיתָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: fr
  text: Sauve-moi de la gueule du lion et des cornes des bœufs sauvages[a] — tu m’as répondu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « taureaux sauvages » ou « aurochs » ; l’hébreu désigne un puissant bovidé sauvage.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition peut se comprendre comme la déclaration soudaine d’une prière exaucée : « tu m’as répondu ». Elle marque le passage de la supplication à la confiance.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Sauve-moi
  rationale: L’impératif hiphil de ישׁע avec suffixe de première personne exprime un appel direct et pressant à la délivrance. « Sauve-moi » est naturel, ample et bien établi en français biblique moderne.
- source_word: מִפִּי
  choice: de la gueule de
  rationale: Le terme hébreu signifie littéralement « de la bouche de ». Pour un lion, « gueule » est l’équivalent français concret et idiomatique, sans affaiblir l’image.
- source_word: אַרְיֵה
  choice: du lion
  rationale: Le singulier sans article désigne ici le lion de manière générique dans une image poétique; l’article défini est naturel en français.
- source_word: וּמִקַּרְנֵי
  choice: et des cornes de
  rationale: La conjonction et la préposition prolongent directement la demande par une seconde image de danger. « Cornes » conserve l’image concrète du texte.
- source_word: רֵמִים
  choice: bœufs sauvages
  rationale: רְאֵם désigne un bovidé sauvage puissant, probablement l’aurochs. « Bœufs sauvages » reste compréhensible tout en évitant la traduction traditionnelle erronée par « licornes ».
- source_word: עֲנִיתָנִי
  choice: tu m’as répondu
  rationale: Le parfait qal à la deuxième personne masculine du singulier avec suffixe de première personne signifie normalement « tu m’as répondu ». Le passé composé exprime naturellement en français le résultat présent de cette réponse et préserve le brusque tournant du verset.
theological_decisions:
- issue: Faut-il comprendre עֲנִיתָנִי comme la poursuite de la supplication ou comme l’affirmation soudaine d’une prière exaucée ?
  choice: 'Affirmation : « tu m’as répondu »'
  alternative: 'Rattacher implicitement le verbe à la supplication, par exemple : « réponds-moi, loin des cornes des bœufs sauvages »'
  rationale: La forme hébraïque est un parfait, non un impératif. La déclaration abrupte d’une réponse divine correspond au tournant littéraire du psaume et prépare la proclamation du verset suivant, sans effacer la tension syntaxique.
translation_notes:
  register: Français international moderne, naturel et digne. « Gueule » est le terme courant précis pour la bouche d’un fauve; « bœufs sauvages » privilégie l’accessibilité, tandis que les variantes zoologiques sont signalées en note. Le tiret met en relief le changement abrupt de la supplication à l’assurance.
