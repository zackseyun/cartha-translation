source:
  edition: WLC
  text: יָ֭בֹאוּ וְ/יַגִּ֣ידוּ צִדְקָת֑/וֹ לְ/עַ֥ם נ֝וֹלָ֗ד כִּ֣י עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/031.yaml
  text: They will come and declare his righteousness to a people yet to be born[c][b][a], that he has done it.
translation:
  language: fr
  text: 'Ils viendront proclamer sa justice[a] à un peuple encore à naître[b] : « Il l’a fait. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ». Le mot hébreu peut englober la justice de Dieu ainsi que son action juste et salvatrice.
    reason: lexical_alternative
  - marker: b
    text: Ou « qui naîtra ».
    reason: lexical_alternative
  - marker: c
    text: Ou « car il l’a fait ». La brève proposition finale en hébreu peut exprimer soit le contenu de la proclamation, soit la raison de proclamer.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Ils viendront
  rationale: Le qal inaccompli, troisième personne du pluriel, exprime ici une action future. Cette formulation simple conserve l’orientation vers les générations à venir.
- source_word: וְיַגִּידוּ
  choice: proclamer
  rationale: Le hifil de נגד signifie faire connaître, annoncer. « Proclamer » convient au caractère public et solennel du témoignage dans ce psaume.
- source_word: צִדְקָתוֹ
  choice: sa justice
  rationale: צדקה peut désigner la rectitude de Dieu ainsi que son action juste et salvatrice. En français, « justice » préserve mieux cette amplitude que des formulations plus spécialisées.
- source_word: לְעַם נוֹלָד
  choice: à un peuple encore à naître
  rationale: לְ indique le destinataire de la proclamation et le participe passif נוֹלָד qualifie un peuple futur. « Encore à naître » rend naturellement cette valeur prospective.
- source_word: כִּי
  choice: introduit le contenu après les deux-points
  rationale: כִּי peut introduire ici ce qui sera proclamé. Les deux-points et la citation rendent cette relation naturellement en français, tout en signalant en note la lecture causale possible.
- source_word: עָשָׂה
  choice: Il l’a fait
  rationale: Le qal accompli de עשה signifie « faire, agir ». L’objet n’est pas exprimé en hébreu ; le pronom français « l’ » le laisse indéterminé tout en conservant la brièveté et la force conclusive de l’original.
theological_decisions:
- issue: Portée de צִדְקָתוֹ
  choice: sa justice
  alternative: sa droiture ; son action juste et salvatrice
  rationale: Le terme hébreu ne se limite ni à une qualité morale abstraite ni à une seule action de salut. « Justice » maintient cette largeur sémantique, et la note explicite les nuances possibles.
- issue: Fonction de כִּי עָשָׂה
  choice: 'contenu de la proclamation : « Il l’a fait »'
  alternative: 'cause de la proclamation : « car il l’a fait »'
  rationale: La proposition hébraïque est très concise et peut indiquer soit le contenu annoncé, soit sa raison. Le texte principal retient la première analyse, bien adaptée au mouvement du verset, sans éliminer la seconde.
translation_notes:
  register: Français international moderne, clair et digne. « Proclamer » garde le ton public du psaume ; la citation finale conserve son effet bref et culminant.
