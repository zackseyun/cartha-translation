source:
  edition: WLC
  text: עָ֭לֶי/ךָ הָשְׁלַ֣כְתִּי מֵ/רָ֑חֶם מִ/בֶּ֥טֶן אִ֝מִּ֗/י אֵ֣לִ/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: fr
  text: Sur toi j’ai été jeté dès le sein maternel ; depuis le ventre de ma mère, tu es mon Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis le sein de ma mère, tu es mon Dieu ». Le mot hébreu traduit ici par « ventre » peut aussi désigner le sein maternel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: Sur toi
  rationale: La préposition עַל avec suffixe exprime ici l’appui ou la remise à quelqu’un. « Sur toi » conserve l’image concrète et poétique.
- source_word: הָשְׁלַכְתִּי
  choice: j’ai été jeté
  rationale: La forme passive du verbe שלך évoque littéralement le fait d’être jeté ou déposé. Cette traduction préserve l’image vive sans expliciter davantage l’idée de confiance ou de prise en charge.
- source_word: מֵרָחֶם
  choice: dès le sein maternel
  rationale: רֶחֶם désigne le sein maternel. « Dès » rend naturellement en français le point de départ temporel indiqué par מִן dans ce contexte.
- source_word: מִבֶּטֶן אִמִּי
  choice: depuis le ventre de ma mère
  rationale: בֶּטֶן peut désigner le ventre ou le sein. « Ventre de ma mère » conserve la variation lexicale du texte hébreu après רֶחֶם, tout en restant clair dans ce vers poétique.
- source_word: אֵלִי
  choice: mon Dieu
  rationale: אֵל avec le suffixe de première personne signifie directement « mon Dieu » et exprime la relation personnelle du psalmiste à Dieu.
- source_word: אָתָּה
  choice: tu es
  rationale: 'La proposition hébraïque est sans verbe exprimé : littéralement, « mon Dieu, toi ». Le présent français respecte cette indétermination temporelle mieux qu’un passé composé ou un imparfait.'
theological_decisions:
- issue: Valeur temporelle de la proposition nominale finale אֵלִי אָתָּה
  choice: tu es mon Dieu
  alternative: tu as été mon Dieu / tu es mon Dieu depuis lors
  rationale: L’hébreu ne marque aucun temps verbal. Le contexte peut suggérer une relation continue depuis la naissance, mais le présent préserve l’ambiguïté grammaticale et évite de rendre explicite ce qui demeure implicite.
translation_notes:
  register: Français moderne, poétique et digne. La formulation conserve le parallélisme ainsi que la distinction entre רֶחֶם (« sein maternel ») et בֶּטֶן (« ventre »). Le présent de la dernière proposition respecte l’absence de verbe temporel en hébreu.
