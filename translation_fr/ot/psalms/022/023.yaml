id: PSA.22.23
reference: Psalms 22:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִרְאֵ֤י יְהוָ֨ה הַֽלְל֗וּ/הוּ כָּל זֶ֣רַע יַעֲקֹ֣ב כַּבְּד֑וּ/הוּ וְ/ג֥וּרוּ מִ֝מֶּ֗/נּוּ כָּל זֶ֥רַע יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/023.yaml
  text: You who fear Yahweh[a], praise him! All offspring of Jacob, honor him! Stand in awe of him, all offspring of Israel!
translation:
  language: fr
  text: 'Vous qui craignez Yahweh, louez-le !

    Vous tous, descendants de Jacob, honorez-le !

    Tremblez devant lui[a], vous tous, descendants d’Israël !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Redoutez-le ». Le verbe hébreu exprime ici une crainte profonde et révérencielle.'
    reason: alternative lexicale
lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: Vous qui craignez Yahweh
  rationale: Le groupe construit désigne ceux qui se caractérisent par leur crainte de Yahweh. Les impératifs qui suivent montrent qu’il s’agit d’une interpellation directe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הַלְלוּהוּ
  choice: louez-le
  rationale: L’impératif pluriel muni d’un suffixe masculin singulier signifie littéralement « louez-le » et renvoie à Yahweh.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: vous tous, descendants de Jacob
  rationale: זֶרַע a ici un sens collectif. Cette formulation française naturelle conserve l’idée de totalité ainsi que la valeur d’interpellation de l’impératif pluriel.
- source_word: כַּבְּדֻהוּ
  choice: honorez-le
  rationale: Le piel impératif de כבד appelle à accorder à Dieu l’honneur qui lui revient, sans ajouter la nuance plus interprétative de « glorifier ».
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: Tremblez devant lui
  rationale: גור exprime ici une crainte révérencielle intense. « Tremblez devant lui » garde cette force et la tension entre louange et crainte, tandis que « devant lui » est idiomatique en français avec ce verbe.
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: vous tous, descendants d’Israël
  rationale: La formulation parallèle à « descendants de Jacob » rend le sens collectif de זֶרַע, la totalité du groupe et l’adresse directe.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Nuance de וְגוּרוּ מִמֶּנּוּ
  choice: Tremblez devant lui
  alternative: Craignez-le / redoutez-le / révérez-le
  rationale: La formulation retenue exprime la crainte révérencielle et son intensité sans la réduire à un simple synonyme de la première proposition. La note conserve une autre traduction possible.
translation_notes:
  register: Français international moderne, direct et digne. Les trois impératifs et le parallélisme entre Jacob et Israël sont conservés. « Descendants » est plus idiomatique que « postérité » ou « semence » dans ce contexte d’interpellation.
