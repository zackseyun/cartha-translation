  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: fr
  text: De toi vient ma louange dans la grande assemblée ; j’accomplirai mes vœux devant ceux qui le craignent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: De toi vient
  rationale: La préposition composée avec le suffixe de deuxième personne indique la source ou l’origine. « De toi vient » rend ce rapport avec naturel en français.
- source_word: תְהִלָּתִי
  choice: ma louange
  rationale: Le nom désigne la louange ou l’action de grâce. « Ma louange » reste direct et n’ajoute aucune nuance sacrificielle absente du terme.
- source_word: בְּקָהָל רָב
  choice: dans la grande assemblée
  rationale: קָהָל désigne une communauté réunie, et רָב qualifie ici son importance ou sa taille. « Grande assemblée » convient au cadre public de la louange.
- source_word: נְדָרַי
  choice: mes vœux
  rationale: Le pluriel désigne les engagements solennels pris envers Dieu. « Mes vœux » est précis et idiomatique.
- source_word: אֲשַׁלֵּם
  choice: j’accomplirai
  rationale: Au piel, שׁלם signifie payer, acquitter ou exécuter. Avec « vœux », « accomplir » exprime clairement en français moderne le fait d’honorer ce qui a été promis.
- source_word: נֶגֶד
  choice: devant
  rationale: La préposition marque la présence ou la visibilité. « Devant » est concis et naturel.
- source_word: יְרֵאָיו
  choice: ceux qui le craignent
  rationale: Le participe avec suffixe masculin singulier de troisième personne signifie littéralement « ceux qui le craignent ». Cette formulation conserve le vocabulaire biblique de la crainte révérencielle ainsi que le changement pronominal du texte hébreu.
theological_decisions:
- issue: Passage de la deuxième personne (« toi ») à la troisième personne (« le »)
  choice: 'Conserver le changement du texte massorétique : « De toi… ceux qui le craignent »'
  alternative: 'Harmoniser à la deuxième personne : « ceux qui te craignent »'
  rationale: L’hébreu passe explicitement de l’adresse directe à une référence à Dieu à la troisième personne. La traduction préserve cette variation stylistique et la légère tension qu’elle produit, sans harmonisation.
translation_notes:
  register: Français international moderne, poétique et digne. « Accomplirai mes vœux » est plus naturel aujourd’hui que « paierai mes vœux », tout en conservant le sens d’exécution fidèle d’un engagement.
