  text: Yet you are holy[a], enthroned on the praises of Israel.
translation:
  language: fr
  text: Pourtant, tu es saint, toi qui sièges parmi les louanges d’Israël.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « siégeant, louanges d’Israël ». Le rapport spatial n’est pas exprimé en hébreu. On peut aussi comprendre : « toi qui demeures dans les louanges d’Israël » ou « toi qui trônes sur les louanges d’Israël ».'
    reason: Alternative lexicale et ambiguïté de l’image poétique hébraïque.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Pourtant, tu
  rationale: La conjonction suivie du pronom indépendant marque ici le contraste avec la plainte précédente. « Pourtant » exprime naturellement cette valeur adversative, tandis que « tu » conserve l’adresse explicite.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: « Saint » est le terme français courant et théologiquement adéquat pour exprimer la sainteté de Dieu sans la réduire à la seule idée de séparation.
- source_word: יֹשֵׁב
  choice: toi qui sièges
  rationale: Le participe signifie littéralement « être assis » et peut aussi évoquer la demeure. Appliqué à Dieu dans ce contexte poétique, « siéger » conserve à la fois la posture et la nuance royale sans imposer explicitement le mot « trône ».
- source_word: תְּהִלּוֹת
  choice: louanges
  rationale: Le pluriel français préserve le pluriel hébreu et désigne les expressions répétées de la louange.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est rendu selon l’usage français standard.
theological_decisions:
- issue: Sens de יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Dieu est présenté comme siégeant au milieu des louanges d’Israël, dans une image poétique à tonalité royale.
  alternative: Dieu demeure dans les louanges d’Israël; ou il siège sur les louanges d’Israël.
  rationale: L’hébreu associe directement le participe « siégeant/demeurant » aux « louanges d’Israël », mais la relation spatiale exacte reste implicite. « Au milieu de » rend l’image intelligible en français tout en laissant la note signaler les autres nuances possibles.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe des psaumes. La formulation reste claire à l’oral et conserve l’image hébraïque ainsi que son ambiguïté spatiale.
