source:
  edition: WLC
  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: fr
  text: Mais moi, je suis un ver et non un homme, objet de mépris pour les humains[a], méprisé par le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « opprobre des humains » ; l’expression hébraïque peut aussi se comprendre comme « objet de mépris pour les humains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָנֹכִי
  choice: Mais moi
  rationale: Le pronom אָנֹכִי est emphatique, et la conjonction marque ici un contraste net avec la confiance exprimée auparavant.
- source_word: תוֹלַעַת
  choice: un ver
  rationale: Ce terme désigne un ver ou une larve et exprime ici, par métaphore, un abaissement extrême, sans qu’il soit nécessaire de préciser l’espèce.
- source_word: וְ/לֹא אִישׁ
  choice: et non un homme
  rationale: La formulation conserve le contraste abrupt entre le ver et l’être humain ainsi que le singulier du texte hébreu.
- source_word: חֶרְפַּת אָדָם
  choice: objet de mépris pour les humains
  rationale: Le nom חֶרְפָּה peut désigner l’opprobre, la honte ou l’objet des railleries. Cette formulation française rend clairement le locuteur comme cible du mépris, tandis que אָדָם a ici une portée collective.
- source_word: וּ/בְזוּי
  choice: dédaigné
  rationale: Le participe passif exprime le fait d’être tenu en mépris. « Dédaigné » reste direct et évite de répéter « mépris ».
- source_word: עָם
  choice: le peuple
  rationale: Le nom collectif עָם désigne le peuple ou la collectivité et forme un parallèle avec « les humains ».
theological_decisions:
- issue: Lecture messianique ou typologique dans l’interprétation chrétienne
  choice: Traduire selon le sens poétique hébreu d’humiliation, sans ajouter de formulation explicitement christologique.
  alternative: Employer une formulation interprétative qui mettrait au premier plan l’accomplissement christologique.
  rationale: Le psaume possède une portée christologique dans le Nouveau Testament et la tradition chrétienne, mais ce verset exprime directement l’humiliation du locuteur. La traduction doit préserver cette voix et laisser les liens canoniques ressortir du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. « Mais moi » maintient l’emphase, tandis que « objet de mépris » préserve la construction nominale de l’hébreu sans produire une tournure obscure en français.
