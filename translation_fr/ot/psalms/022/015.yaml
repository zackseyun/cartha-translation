source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: fr
  text: Ma force s’est desséchée comme un tesson[a], et ma langue colle à mes mâchoires ; tu me couches dans la poussière de la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme de la poterie ». Le mot hébreu peut désigner un tesson ou, plus largement, de la poterie. Le terme hébreu traduit par « mâchoires » plus loin dans le verset est rare ; il pourrait désigner une autre partie de la bouche, comme le palais.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: s’est desséchée
  rationale: Le verbe exprime le dessèchement ou le dépérissement. Le passé composé décrit naturellement en français l’état désormais atteint dans cette lamentation.
- source_word: כַּחֶרֶשׂ
  choice: comme un tesson
  rationale: חֶרֶשׂ désigne couramment un fragment de poterie. « Tesson » conserve l’image concrète de quelque chose de sec, dur et cassant.
- source_word: כֹּחִי
  choice: ma force
  rationale: כֹּחַ renvoie ici à la force physique ou à la vitalité du souffrant.
- source_word: וּלְשׁוֹנִי
  choice: et ma langue
  rationale: Traduction anatomique directe, naturelle et fidèle.
- source_word: מֻדְבָּק
  choice: colle
  rationale: Le participe passif décrit la langue attachée ou collée à une partie de la bouche ; cette tournure est idiomatique en français moderne.
- source_word: מַלְקוֹחָי
  choice: à mes mâchoires
  rationale: Le terme rare et incertain semble désigner une partie de la bouche, probablement les mâchoires. L’incertitude lexicale est signalée en note.
- source_word: וְלַעֲפַר
  choice: dans la poussière
  rationale: La préposition ל peut marquer la direction ou le placement. Avec « coucher », « dans la poussière » rend naturellement l’aboutissement exprimé.
- source_word: מָוֶת
  choice: de la mort
  rationale: La construction « la poussière de la mort » préserve l’expression poétique sans la réduire à une référence explicite à la tombe.
- source_word: תִּשְׁפְּתֵנִי
  choice: tu me couches
  rationale: La forme verbale signifie mettre ou placer et s’adresse directement à un « tu ». « Coucher » convient au placement dans la poussière et garde la force de l’image.
theological_decisions:
- issue: L’agent de la proposition finale
  choice: 'Adresse directe à Dieu : « tu me couches dans la poussière de la mort »'
  alternative: 'Formulation impersonnelle ou résultative : « je suis couché dans la poussière de la mort »'
  rationale: L’hébreu porte un verbe à la deuxième personne masculine du singulier avec un objet à la première personne. La traduction conserve donc l’adresse directe ainsi que la tension théologique par laquelle le souffrant attribue son extrême détresse à l’action de Dieu, sans expliquer le rapport entre cette action et celle d’éventuels adversaires humains.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en trois membres est conservé, avec un vocabulaire concret. « Tesson » reste accessible tout en maintenant l’image traditionnelle ; la note rend visibles les deux incertitudes lexicales du verset.
