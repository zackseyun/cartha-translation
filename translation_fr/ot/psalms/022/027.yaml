id: PSA.22.27
reference: Psalms 22:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִזְכְּר֤וּ וְ/יָשֻׁ֣בוּ אֶל יְ֭הוָה כָּל אַפְסֵי אָ֑רֶץ וְ/יִֽשְׁתַּחֲו֥וּ לְ֝/פָנֶ֗י/ךָ כָּֽל מִשְׁפְּח֥וֹת גּוֹיִֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: fr
  text: Tous les confins de la terre se souviendront et reviendront à Yahweh[a] ; toutes les familles des nations se prosterneront devant toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le SEIGNEUR » est une autre manière traditionnelle de rendre le nom divin YHWH.
    reason: alternative_reading
  - marker: b
    text: Ou « t’adoreront ». Le verbe hébreu signifie littéralement s’incliner ou se prosterner, souvent comme acte d’adoration.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: se souviendront
  rationale: Le qal inaccompli de זכר a ici une valeur prospective. « Se souviendront » rend directement le verbe tout en conservant l’absence de complément explicite en hébreu.
- source_word: וְיָשֻׁבוּ
  choice: et reviendront
  rationale: שוב signifie revenir ou retourner. Avec אֶל יְהוָה, « reviendront à Yahweh » préserve l’idée de mouvement vers Dieu sans expliciter davantage la notion possible de repentance.
- source_word: אֶל יְהוָה
  choice: à Yahweh
  rationale: אֶל exprime la direction, et le nom divin יהוה est translittéré « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: tous les confins de la terre
  rationale: L’expression désigne les extrémités ou régions les plus lointaines de la terre. « Tous les confins de la terre » est naturel en français biblique moderne et maintient la portée géographique universelle.
- source_word: וְיִשְׁתַּחֲווּ
  choice: se prosterneront
  rationale: Le verbe décrit l’action de s’incliner profondément ou de se prosterner en signe d’hommage ou d’adoration. « Se prosterneront » conserve l’image corporelle sans réduire le sens au seul concept abstrait d’adoration.
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Littéralement « devant ta face » ; « devant toi » est l’équivalent idiomatique moderne et conserve l’adresse directe à Dieu au masculin singulier.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: toutes les familles des nations
  rationale: מִשְׁפְּחוֹת désigne des familles ou groupes familiaux, tandis que גּוֹיִם désigne ici les nations au sens large. Cette formulation reste proche de l’hébreu et accessible.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » conserve le nom propre, tandis que « le SEIGNEUR » représente la tradition de substitution à la lecture.
- issue: Portée cultuelle de וְיִשְׁתַּחֲווּ
  choice: se prosterneront
  alternative: t’adoreront
  rationale: Le verbe exprime concrètement la prosternation, souvent accomplie comme acte d’adoration. Le choix principal préserve à la fois l’image physique et sa portée religieuse implicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur restitue la valeur prospective des inaccomplis hébreux. « Confins » conserve l’image poétique sans archaïsme excessif ; le point-virgule fait ressortir le parallélisme des deux propositions.
