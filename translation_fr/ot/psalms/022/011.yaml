source:
  edition: WLC
  text: אַל תִּרְחַ֣ק מִ֭מֶּ/נִּי כִּי צָרָ֣ה קְרוֹבָ֑ה כִּי אֵ֥ין עוֹזֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/011.yaml
  text: Do not be far from me[a], for trouble is near, for there is no helper.
translation:
  language: fr
  text: Ne sois pas loin de moi, car la détresse[a] est proche, car il n’y a personne pour m’aider.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le malheur ». Le nom hébreu peut désigner la détresse, le malheur ou l’adversité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: Ne sois pas loin de moi
  rationale: La tournure conserve la métaphore spatiale de רחק avec מן et la force suppliante de la négation, sans renforcer le sens jusqu’à « ne m’abandonne pas ».
- source_word: כִּי
  choice: car
  rationale: Dans ses deux occurrences, כִּי introduit le motif de la supplication. La répétition de « car » respecte la structure poétique hébraïque.
- source_word: צָרָה קְרוֹבָה
  choice: la détresse est proche
  rationale: צָרָה désigne une situation de détresse, de malheur ou d’adversité, tandis que קְרוֹבָה exprime sa proximité immédiate. Cette formulation reste naturelle et concise en français.
- source_word: כִּי אֵין עוֹזֵר
  choice: car il n’y a personne pour m’aider
  rationale: אֵין exprime l’absence, et le participe substantivé עוֹזֵר désigne une personne qui aide. La formulation française préserve ce sens personnel plutôt que de rendre le terme par l’abstrait « secours ».
theological_decisions:
- issue: Langage de la distance divine dans la lamentation
  choice: Ne sois pas loin de moi
  alternative: Ne m’abandonne pas
  rationale: L’hébreu emploie une image spatiale. « Ne m’abandonne pas » affirmerait plus explicitement une rupture relationnelle que ne le fait le texte; la traduction retenue préserve la tension de la plainte.
translation_notes:
  register: Français moderne, sobre et digne. La répétition de « car » est maintenue afin de refléter le mouvement de la poésie hébraïque.
