source:
  edition: WLC
  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: fr
  text: Car des chiens m’ont entouré ; une bande de malfaiteurs m’a encerclé ; comme un lion, mes mains et mes pieds.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu massorétique porte ici une expression difficile : « comme un lion, mes mains et mes pieds ». Certains manuscrits de la mer Morte, la Septante et de nombreuses traductions reflètent plutôt une lecture telle que : « ils ont transpercé mes mains et mes pieds » ou « ils ont creusé mes mains et mes pieds ».'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication ou le fondement de la plainte, avec une valeur causale naturelle en français.
- source_word: סְבָבוּנִי
  choice: m’ont entouré
  rationale: Rend directement le verbe סבב et présente l’action accomplie dans son effet actuel.
- source_word: כְּלָבִים
  choice: des chiens
  rationale: Conserve l’image littérale et hostile du texte hébreu sans l’expliciter à la place du lecteur.
- source_word: עֲדַת מְרֵעִים
  choice: une bande de malfaiteurs
  rationale: « Bande » désigne naturellement en français un groupe hostile ; « malfaiteurs » rend ceux qui font le mal sans limiter le sens à une catégorie juridique précise.
- source_word: הִקִּיפוּנִי
  choice: m’a encerclé
  rationale: Conserve le parallélisme avec le premier verbe tout en employant un terme distinct ; le singulier s’accorde avec le nom collectif « bande ».
- source_word: כָּאֲרִי
  choice: comme un lion
  rationale: Suit le texte massorétique vocalisé, malgré sa syntaxe difficile, au lieu de substituer dans le corps du texte une variante plus fluide.
- source_word: יָדַי וְרַגְלָי
  choice: mes mains et mes pieds
  rationale: Traduction directe des parties du corps, maintenues dans la construction nominale difficile de l’hébreu.
theological_decisions:
- issue: Lecture contestée de כָּאֲרִי face à la variante ancienne comprise comme un verbe (« ils ont transpercé/creusé »)
  choice: Le texte principal suit la lecture massorétique « comme un lion » et en conserve la formulation elliptique.
  alternative: « Ils ont transpercé mes mains et mes pieds » ou « ils ont creusé mes mains et mes pieds ».
  rationale: La lecture massorétique est attestée mais syntaxiquement difficile. La remplacer silencieusement pourrait résoudre indûment une tension textuelle importante et favoriser une interprétation théologique particulière. La variante ancienne est donc signalée en note avec sa portée textuelle, sans être supprimée.
translation_notes:
  register: Français moderne, international et digne. Le rythme en trois membres est conservé. La dernière proposition demeure volontairement elliptique afin de refléter la difficulté réelle du texte massorétique ; la note donne les principales variantes anciennes sans trancher silencieusement.
