id: PSA.51.19
reference: Psalms 51:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: fr
  text: Dans ta bienveillance[a], fais du bien à Sion ; bâtis[b] les murailles de Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ta faveur » ou « selon ta volonté ».
    reason: lexical_alternative
  - marker: b
    text: Ou « rebâtis », si le contexte envisagé est celui d’une restauration.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: fais du bien
  rationale: L’impératif hiphil de יטב demande à Dieu d’agir en faveur de Sion. « Fais du bien » reste direct, naturel et proche de la formulation hébraïque sans préciser excessivement la forme de la bénédiction.
- source_word: בִּרְצוֹנְךָ
  choice: dans ta bienveillance
  rationale: רָצוֹן peut exprimer la faveur, la bonne volonté ou la volonté. « Dans ta bienveillance » met ici en relief la disposition favorable de Dieu, tout en laissant la note signaler les autres nuances possibles.
- source_word: אֶת צִיּוֹן
  choice: à Sion
  rationale: Avec l’expression française « faire du bien », la préposition « à » rend naturellement Sion comme bénéficiaire de l’action demandée.
- source_word: תִּבְנֶה
  choice: bâtis
  rationale: L’imparfait qal a ici une valeur de demande à la suite de l’impératif. « Bâtis » conserve l’image concrète et n’impose pas le sens historiquement plus précis de « rebâtis ».
- source_word: חוֹמוֹת
  choice: les murailles
  rationale: Le pluriel חוֹמוֹת désigne les murs défensifs d’une ville. « Murailles » est plus précis que le terme général « murs » dans ce contexte urbain.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Rapport entre la faveur divine et la restauration de Sion
  choice: Le verset est rendu comme une prière demandant que la bienveillance de Dieu se traduise par un bien concret pour Sion et par l’édification des murailles de Jérusalem.
  alternative: « Selon ta volonté, fais du bien à Sion », avec un sens principalement volitif.
  rationale: Le nom רָצוֹן peut évoquer à la fois la faveur et la volonté. Le texte principal exprime la faveur divine sans éliminer la nuance volitive, conservée dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la prière est conservé. « Murailles » rend explicitement les fortifications urbaines, tandis que les notes préservent les ambiguïtés lexicales de רָצוֹן et de la possible portée restauratrice de בנה.
