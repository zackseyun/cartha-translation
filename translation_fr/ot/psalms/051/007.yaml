  source_fidelity: 'Le sens central est bien rendu : Dieu désire la vérité dans l’intériorité humaine et fait connaître la sagesse dans ce qui est caché. Toutefois, « Oui » est une introduction peu idiomatique pour הֵן dans ce contexte, et « dans le secret » peut se comprendre en français comme « secrètement », plutôt que comme le domaine intérieur/caché évoqué par l’hébreu.'
  naturalness: La phrase est globalement fluide et poétique. « Certes » convient mieux au ton assertif du psaume. « Au plus profond de moi » est naturel en français moderne et rend l’intériorité impliquée par le parallélisme; « dans ce qui est caché » évite l’ambiguïté adverbiale de « dans le secret ».
  terminology: « Vérité », « désires », « sagesse » et « tu me fais connaître » sont justes. La formulation causative « tu me fais connaître » reflète adéquatement le hiphil תוֹדִיעֵנִי, sans imposer le sens plus interprétatif de « tu m’enseignes ».
