  text: הֵן אֱ֭מֶת חָפַ֣צְתָּ בַ/טֻּח֑וֹת וּ֝/בְ/סָתֻ֗ם חָכְמָ֥ה תוֹדִיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: fr
  text: Certes[a], tu désires la vérité au plus profond de moi[b] ; dans ce qui est caché[c], tu me fais connaître la sagesse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici » ou « Oui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans les parties intérieures » ; le terme hébreu poétique peut désigner l’être intérieur.'
    reason: lexical_clarification
  - marker: c
    text: 'Ou : « dans le secret » ou « dans la partie cachée » ; l’expression hébraïque ne précise pas davantage le lieu évoqué.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: Introduit ici une affirmation appuyée. « Oui » conserve cette force emphatique dans un français poétique naturel ; « voici » serait possible, mais suggérerait davantage qu’on attire l’attention sur une chose visible.
- source_word: אֱמֶת
  choice: vérité
  rationale: Le terme peut aussi évoquer la fidélité ou la fiabilité. Dans ce contexte, « vérité » exprime bien la droiture et l’authenticité intérieures sans restreindre le sens à une catégorie doctrinale.
- source_word: חָפַצְתָּ
  choice: tu désires
  rationale: Le verbe signifie désirer ou prendre plaisir à quelque chose. « Tu désires » rend clairement l’attente morale exprimée ici, tout en laissant « tu prends plaisir à » comme possibilité.
- source_word: בַטֻּחוֹת
  choice: dans les profondeurs de l’être
  rationale: Le mot poétique désigne les parties intérieures ou cachées de la personne. Cette formulation conserve l’image spatiale tout en restant compréhensible en français moderne.
- source_word: וּבְסָתֻם
  choice: dans le secret
  rationale: L’expression renvoie à ce qui est fermé, caché ou secret. « Dans le secret » préserve sa concision et son parallélisme avec les profondeurs intérieures, sans préciser abusivement le référent.
- source_word: חָכְמָה
  choice: la sagesse
  rationale: Rendu usuel et direct ; il s’agit ici de la sagesse que Dieu communique au plus profond de la personne.
- source_word: תוֹדִיעֵנִי
  choice: tu me fais connaître
  rationale: La forme causative du verbe « connaître » signifie littéralement faire connaître. Ce rendu conserve cette nuance ; « tu m’enseignes » serait plus idiomatique, mais légèrement moins formel.
theological_decisions:
- issue: Nature de la vérité intérieure recherchée par Dieu
  choice: Présenter le verset comme l’affirmation que Dieu désire la vérité au plus profond de la personne et lui communique intérieurement la sagesse.
  alternative: Comprendre « vérité » plus précisément comme fidélité à l’alliance, ou lire le verset avant tout en termes de connaissance psychologique de soi.
  rationale: Le parallélisme hébreu associe la vérité intérieure à la sagesse communiquée dans le secret. La traduction maintient cette portée morale et spirituelle sans lui imposer une systématisation doctrinale.
- issue: Référent du « secret »
  choice: Conserver l’expression ouverte « dans le secret ».
  alternative: Expliciter « au plus secret de moi-même » ou « dans la partie cachée de l’être ».
  rationale: L’hébreu est elliptique et ne nomme pas précisément le lieu caché. Le texte français préserve cette ambiguïté poétique.
translation_notes:
  register: Français international moderne, poétique et digne. Le point-virgule fait ressortir le parallélisme des deux membres. Les formulations « profondeurs de l’être » et « dans le secret » conservent les images intérieures de l’hébreu sans lourdeur anatomique ni explicitation doctrinale.
