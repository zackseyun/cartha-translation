  - severity: medium
    issue: Ambiguïté de « dans le secret »
    rationale: En français, cette expression peut qualifier l’action (« secrètement »). Le syntagme hébreu désigne plutôt ce qui est caché; « dans ce qui est caché » maintient l’image et l’ouverture du référent.
  - severity: low
