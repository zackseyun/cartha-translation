  source_fidelity: Le singulier hébreu זֶבַח est mieux conservé par « au sacrifice » et par la reprise pronominale singulière « je l’offrirais ». La seconde proposition est juxtaposée au résultat conditionnel implicite ; le « et » ajouté avant « l’holocauste » ne correspond pas à la structure du texte, où le waw porte sur « je l’offrirais ».
