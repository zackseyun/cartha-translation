source:
  edition: WLC
  text: כִּ֤י לֹא תַחְפֹּ֣ץ זֶ֣בַח וְ/אֶתֵּ֑נָה ע֝וֹלָ֗ה לֹ֣א תִרְצֶֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/017.yaml
  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: fr
  text: Car tu ne prends pas plaisir au sacrifice[a] — autrement, je l’offrirais — ; l’holocauste ne t’est pas agréable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car tu ne désires pas de sacrifice ; autrement, je l’offrirais. »'
    reason: La valeur de חפץ peut être rendue par « désirer », et l’enchaînement hébreu permet cette traduction plus formelle.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison de l’affirmation précédente; « Car » convient au mouvement argumentatif et au registre poétique.
- source_word: לֹא תַחְפֹּץ
  choice: tu ne prends pas plaisir
  rationale: חפץ exprime ici le plaisir ou l’attrait, et non la simple volonté; cette formulation naturelle conserve cette nuance affective.
- source_word: זֶבַח
  choice: aux sacrifices
  rationale: זבח est le terme cultuel courant pour un sacrifice. Le pluriel générique est idiomatique en français et ne change pas la portée du singulier hébreu.
- source_word: וְאֶתֵּנָה
  choice: autrement, j’en offrirais
  rationale: 'Dans le contexte, la coordination a une valeur conditionnelle ou résultative implicite: si Dieu y prenait plaisir, le psalmiste offrirait un sacrifice. « En » reprend naturellement le nom précédent.'
- source_word: עוֹלָה
  choice: l’holocauste
  rationale: עולה désigne l’offrande entièrement consumée; « holocauste » est le terme cultuel français établi.
- source_word: לֹא תִרְצֶה
  choice: ne t’est pas agréable
  rationale: רצה indique ici l’accueil favorable ou le plaisir. Cette formulation préserve une légère distinction avec חפץ sans réduire le sens à une simple acceptation rituelle.
theological_decisions:
- issue: Portée du refus des sacrifices
  choice: Conserver l’énoncé direct selon lequel Dieu ne prend pas plaisir aux sacrifices dans la situation pénitentielle du psalmiste.
  alternative: Interpréter le verset comme une abolition universelle de tout culte sacrificiel.
  rationale: Le texte ne précise pas à lui seul toute la portée doctrinale du refus. La traduction maintient donc la tension du psaume sans ajouter « en eux-mêmes », ni transformer l’affirmation en rejet catégorique de tout sacrifice.
translation_notes:
  register: Français international moderne, poétique et digne. Les tirets rendent lisible la proposition conditionnelle implicite sans alourdir la syntaxe; le parallélisme entre « sacrifices » et « holocauste » est conservé.
