  terminology: « Sacrifice » rend adéquatement זֶבַח, et « holocauste » demeure le terme biblique français établi pour עוֹלָה. « Ne t’est pas agréable » rend naturellement le favorable regard exprimé par רצה, sans effacer la nuance distincte de חפץ.
