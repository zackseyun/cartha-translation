source:
  edition: WLC
  text: אָ֤ז תַּחְפֹּ֣ץ זִבְחֵי צֶ֭דֶק עוֹלָ֣ה וְ/כָלִ֑יל אָ֤ז יַעֲל֖וּ עַל מִזְבַּחֲ/ךָ֣ פָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/020.yaml
  text: Then you will delight in righteous sacrifices[a], in burnt offerings and whole burnt offerings[c][b]; then bulls will be offered on your altar.
translation:
  language: fr
  text: Alors tu prendras plaisir à des sacrifices de justice[a], à l’holocauste et au sacrifice entièrement consumé[b] ; alors des taureaux seront offerts sur ton autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « sacrifices justes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le second terme hébreu souligne qu’il est consumé en entier. On peut aussi comprendre l’ensemble : « à l’holocauste entièrement consumé ».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: tu prendras plaisir à
  rationale: Le verbe חפץ exprime ici le plaisir ou l’agrément de Dieu ; cette formulation française est naturelle et conserve cette nuance.
- source_word: זִבְחֵי צֶדֶק
  choice: sacrifices offerts avec justice
  rationale: Le groupe construit peut se comprendre comme des « sacrifices de justice ». La formulation retenue garde le lien avec la justice tout en évitant de laisser entendre que les victimes elles-mêmes seraient moralement justes.
- source_word: עוֹלָה
  choice: holocauste
  rationale: Terme sacrificiel français consacré pour l’offrande entièrement brûlée sur l’autel.
- source_word: וְכָלִיל
  choice: et sacrifice entièrement consumé
  rationale: כָלִיל souligne la totalité de la combustion. Une expression distincte maintient la juxtaposition hébraïque sans décider qu’il s’agit nécessairement d’une simple apposition à עוֹלָה.
- source_word: יַעֲלוּ
  choice: on offrira
  rationale: Le hiphil de עלה, dans ce contexte sacrificiel, signifie faire monter la victime sur l’autel, donc l’offrir. Le sujet indéfini français rend naturellement la forme verbale plurielle sans sujet humain explicite.
- source_word: מִזְבַּחֲךָ
  choice: ton autel
  rationale: Équivalent direct du nom avec suffixe de deuxième personne, dans l’adresse à Dieu.
- source_word: פָרִים
  choice: des taureaux
  rationale: פָרִים désigne directement des taureaux employés ici comme victimes sacrificielles.
- source_word: אָז ... אָז
  choice: Alors… alors
  rationale: La répétition conserve la structure hébraïque et marque la conséquence ainsi que la succession.
theological_decisions:
- issue: Rapport entre les sacrifices acceptés ici et la priorité donnée auparavant à un cœur brisé et contrit
  choice: Conserver le langage sacrificiel concret comme expression d’un culte redevenu agréable à Dieu.
  alternative: Interpréter les sacrifices uniquement comme une métaphore de la justice intérieure, ou présenter le verset comme un ajout liturgique ultérieur.
  rationale: Le texte affirme positivement l’agrément des sacrifices sans expliquer explicitement leur rapport aux versets précédents. La traduction préserve cette tension et n’impose ni harmonisation doctrinale ni hypothèse rédactionnelle.
- issue: Rapport syntaxique entre עוֹלָה et כָלִיל
  choice: 'Rendre les deux termes de façon coordonnée et distincte : « à l’holocauste et au sacrifice entièrement consumé »'
  alternative: 'Les fondre en une seule expression : « à l’holocauste entièrement consumé »'
  rationale: La coordination hébraïque autorise une lecture appositionnelle ou emphatique, mais peut aussi présenter deux désignations rapprochées. Le texte principal maintient la distinction formelle ; la note signale l’autre analyse.
translation_notes:
  register: Français moderne, digne et accessible. « Holocauste » est conservé comme terme cultuel biblique précis ; « sacrifice entièrement consumé » en explicite le terme voisin. La répétition « alors… alors » reproduit l’insistance du texte hébreu.
