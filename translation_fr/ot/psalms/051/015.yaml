source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: fr
  text: Délivre-moi de la culpabilité liée au sang versé[a], ô Dieu, Dieu de mon salut, et ma langue célébrera avec joie ta justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sang versé ». Littéralement « des sangs » ; l’expression hébraïque désigne souvent le sang versé et la culpabilité qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Ou « ta droiture ». Le terme hébreu peut évoquer à la fois la rectitude morale et la justice de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif de נצל avec suffixe de première personne exprime une supplication pressante. « Délivre-moi » est naturel, digne et ne précise pas indûment le moyen du secours.
- source_word: מִדָּמִים
  choice: du sang versé
  rationale: Le pluriel דמים, littéralement « des sangs », désigne souvent le sang répandu et, selon le contexte, la culpabilité qui en découle. « Du sang versé » reste idiomatique en français et préserve une part de cette ambiguïté.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom est employé en apostrophe. La particule « ô » marque clairement l’adresse directe et convient au registre poétique.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: Dieu de mon salut
  rationale: Cette traduction conserve la construction hébraïque et le terme théologique large תְּשׁוּעָה, qui peut évoquer le salut ou la délivrance.
- source_word: תְּרַנֵּן
  choice: célébrera avec joie
  rationale: Le verbe רנן exprime une proclamation chantée ou un cri joyeux. Avec « ma langue » comme sujet, « célébrera avec joie » restitue naturellement l’idée d’une louange vocale exultante.
- source_word: לְשׁוֹנִי
  choice: ma langue
  rationale: Le maintien de l’image concrète de la langue préserve la formulation poétique de l’hébreu.
- source_word: צִדְקָתֶךָ
  choice: ta justice
  rationale: צדקה recouvre la rectitude, la justice et l’action juste de Dieu. En français biblique moderne, « ta justice » conserve mieux cette amplitude que « ta droiture », sans préciser qu’il s’agit exclusivement d’une justice punitive ou salvatrice.
theological_decisions:
- issue: Sens du pluriel דמים dans la confession
  choice: du sang versé
  alternative: de la culpabilité liée au sang versé
  rationale: Le contexte pénitentiel permet de comprendre une culpabilité pour homicide, mais l’expression hébraïque nomme d’abord les « sangs ». Le texte principal conserve l’image du sang répandu, tandis que la note explicite la dimension possible de culpabilité sans l’imposer entièrement.
- issue: Nuance de צִדְקָתֶךָ
  choice: ta justice
  alternative: ta droiture
  rationale: Le terme peut désigner à la fois la rectitude morale et la justice de Dieu, y compris dans son action salvatrice. « Justice » est suffisamment large en français, et la note maintient l’autre nuance possible.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe conserve l’apostrophe répétée « ô Dieu, Dieu de mon salut » et l’image de la langue, tout en évitant un calque obscur de l’hébreu « des sangs ».
