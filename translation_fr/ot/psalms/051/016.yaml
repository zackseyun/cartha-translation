source:
  edition: WLC
  text: אֲ֭דֹנָ/י שְׂפָתַ֣/י תִּפְתָּ֑ח וּ֝/פִ֗/י יַגִּ֥יד תְּהִלָּתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/016.yaml
  text: Lord, open my lips, and my mouth will declare your praise.
translation:
  language: fr
  text: Seigneur, ouvre mes lèvres, et ma bouche proclamera ta louange.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Titre divin employé en apostrophe. « Seigneur » est la formulation française naturelle et distingue ce titre du nom divin YHWH.
- source_word: שְׂפָתַי
  choice: mes lèvres
  rationale: Le terme concret au pluriel, avec suffixe de première personne, conserve l’image corporelle de la parole rendue possible par Dieu.
- source_word: תִּפְתָּח
  choice: ouvre
  rationale: L’imparfait qal de פתח a ici, dans la prière, une valeur de requête; l’impératif français l’exprime naturellement.
- source_word: וּפִי
  choice: et ma bouche
  rationale: Cette traduction directe préserve la coordination et le parallélisme entre les lèvres et la bouche, sans expliciter un lien consécutif seulement implicite.
- source_word: יַגִּיד
  choice: proclamera
  rationale: Le hiphil de נגד signifie faire connaître ou déclarer. « Proclamera » convient au contexte de louange et rend la valeur prospective résultant de la requête.
- source_word: תְּהִלָּתֶךָ
  choice: ta louange
  rationale: Le nom avec suffixe de deuxième personne se rend idiomatiquement par « ta louange », c’est-à-dire la louange adressée à Dieu ou célébrant Dieu, sans lever davantage cette souplesse.
theological_decisions:
- issue: Traduction du titre divin dans l’apostrophe
  choice: Seigneur
  alternative: mon Seigneur
  rationale: אֲדֹנָי fonctionne ici comme titre divin révérenciel. « Seigneur » est naturel en français dans une adresse directe et n’ajoute pas le possessif « mon », bien que la forme hébraïque soit historiquement liée à cette morphologie.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme poétique est conservé; « proclamera » donne à la seconde proposition sa portée de résultat sans ajouter explicitement « alors ».
