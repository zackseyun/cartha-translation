source:
  edition: WLC
  text: הֵן בְּ/עָו֥וֹן חוֹלָ֑לְתִּי וּ֝/בְ/חֵ֗טְא יֶֽחֱמַ֥תְ/נִי אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: fr
  text: Oui, je suis né dans l’iniquité[a], et ma mère m’a conçu dans le péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « j’ai été mis au monde ».
    reason: lexical_alternative
  - marker: b
    text: Ce verset est souvent compris soit comme une confession de l’état pécheur du psalmiste dès sa conception, soit comme une expression poétique appuyée de repentance. L’hébreu ne tranche pas entièrement la question et n’affirme pas explicitement que l’acte de sa mère était lui-même pécheur.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule introduit ici une affirmation appuyée. « Oui » en restitue naturellement la force en français poétique moderne, sans l’archaïsme de « Voici » dans cet emploi.
- source_word: בְּעָוֹן
  choice: dans la faute
  rationale: « Faute » exprime ici la réalité morale de עָוֹן tout en conservant la préposition et sans trancher entre culpabilité, perversité et condition marquée par le mal.
- source_word: חוֹלָלְתִּי
  choice: je suis né
  rationale: Dans ce contexte et en parallèle avec la conception, le verbe désigne la mise au monde. « Je suis né » est clair, naturel et fidèle en français contemporain.
- source_word: וּבְחֵטְא
  choice: et dans le péché
  rationale: Cette formulation conserve la préposition hébraïque et le parallélisme avec « dans la faute », sans ajouter d’explication doctrinale.
- source_word: יֶחֱמַתְנִי
  choice: m’a conçu
  rationale: Le verbe est compris ici au sens de concevoir, ce qui correspond au parallélisme entre conception et naissance.
- source_word: אִמִּי
  choice: ma mère
  rationale: Traduction directe du nom avec son suffixe possessif.
theological_decisions:
- issue: Rapport entre le péché, la conception et la naissance du psalmiste
  choice: Conserver l’association directe, mais non explicitée, entre son existence dès la conception et la naissance, d’une part, et la faute et le péché, d’autre part.
  alternative: Comprendre le verset comme une affirmation doctrinale précise de la faute originelle, comme une accusation visant l’acte de la mère, ou comme une simple hyperbole pénitentielle.
  rationale: L’hébreu associe nettement la conception et la naissance du psalmiste à עָוֹן et חֵטְא, mais ne précise ni le mécanisme ni le cadre doctrinal. La traduction et la note préservent donc cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. « Oui » marque l’insistance initiale sans archaïsme. Le parallélisme « dans la faute / dans le péché » maintient la densité et l’ambiguïté théologique de l’hébreu.
