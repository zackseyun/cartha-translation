source:
  edition: WLC
  text: תְּחַטְּאֵ֣/נִי בְ/אֵז֣וֹב וְ/אֶטְהָ֑ר תְּ֝כַבְּסֵ֗/נִי וּ/מִ/שֶּׁ֥לֶג אַלְבִּֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/008.yaml
  text: Purify me with hyssop[a], and I will be clean; wash me, and I will be whiter than snow.
translation:
  language: fr
  text: Purifie-moi avec l’hysope[a], et je serai pur ; lave-moi, et je serai plus blanc que la neige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Enlève mon péché avec l’hysope ». Le verbe hébreu appartient au vocabulaire du péché et de la purification ; associé à l’hysope, il évoque une purification rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Purifie-moi
  rationale: 'Le piel de חטא a ici un sens purgatif : il s’agit d’enlever le péché ou l’impureté, et non de « faire pécher ». « Purifie-moi » est naturel en français et conserve la portée rituelle et morale du verbe.'
- source_word: בְאֵזוֹב
  choice: avec l’hysope
  rationale: La préposition instrumentale et le nom désignent l’hysope employée dans les rites bibliques de purification. Cette formulation directe préserve l’image cultuelle.
- source_word: וְאֶטְהָר
  choice: et je serai pur
  rationale: טהר exprime l’état de pureté ou de propreté, notamment rituelle. « Pur » reprend naturellement le champ lexical de « purifie-moi » et convient à la dimension morale de la prière.
- source_word: תְּכַבְּסֵנִי
  choice: lave-moi
  rationale: כבס désigne proprement le lavage, notamment celui des vêtements, mais s’applique ici métaphoriquement au psalmiste. « Lave-moi » conserve cette image concrète sans lourdeur.
- source_word: וּמִשֶּׁלֶג
  choice: que la neige
  rationale: 'La préposition מן porte ici une valeur comparative : la blancheur obtenue surpassera celle de la neige.'
- source_word: אַלְבִּין
  choice: je serai plus blanc
  rationale: Le hiphil de לבן exprime ici le résultat de devenir blanc. Avec la construction comparative, « je serai plus blanc que la neige » rend clairement et poétiquement le sens.
theological_decisions:
- issue: Application d’une image de purification rituelle au péché moral
  choice: Conserver explicitement « l’hysope » et le vocabulaire de la purification.
  alternative: Rendre la demande par une formule générale telle que « enlève mon péché » ou « pardonne-moi ».
  rationale: Le texte mobilise les rites de purification d’Israël pour exprimer la restauration intérieure demandée par le psalmiste. Maintenir cette image préserve le lien théologique suggéré par le texte sans lui ajouter une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif « Purifie-moi » reste accessible tout en préservant le langage cultuel ; le parallélisme entre purification, lavage, pureté et blancheur est maintenu.
