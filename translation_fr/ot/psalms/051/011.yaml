id: PSA.51.11
reference: Psalms 51:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֵ֣ב טָ֭הוֹר בְּרָא לִ֣/י אֱלֹהִ֑ים וְ/ר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: fr
  text: Ô Dieu, crée en moi un cœur pur[a] et renouvelle au fond de moi un esprit ferme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un cœur sans souillure ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un esprit constant »; l’hébreu évoque quelque chose de ferme, stable ou bien établi.
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: un cœur pur
  rationale: « Cœur » conserve l’image hébraïque de la personne intérieure — pensée, volonté et affections — tandis que « pur » exprime naturellement en français la pureté morale et cultuelle recherchée dans le psaume.
- source_word: בְּרָא
  choice: crée
  rationale: Le verbe hébreu désigne de façon marquée l’action créatrice de Dieu; « crée » en garde la force dans cette demande de transformation intérieure.
- source_word: לִי
  choice: en moi
  rationale: Bien que la construction puisse se comprendre littéralement comme « pour moi », « crée en moi un cœur » est l’expression française naturelle et rend clairement le caractère intérieur de la transformation.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le vocatif convient à cette prière directe et maintient son registre poétique sans archaïsme excessif.
- source_word: רוּחַ נָכוֹן
  choice: un esprit ferme
  rationale: « Esprit » préserve l’ampleur de רוּחַ et son parallélisme avec « cœur ». « Ferme » traduit l’idée de stabilité, de solidité ou de disposition bien établie portée par נָכוֹן.
- source_word: חַדֵּשׁ
  choice: renouvelle
  rationale: « Renouvelle » rend l’appel à une restauration et à une revitalisation intérieures, sans limiter le sens à un simple retour à un état antérieur.
- source_word: בְּקִרְבִּי
  choice: au fond de moi
  rationale: Cette expression française naturelle rend l’intériorité appuyée de l’hébreu, littéralement « en mon sein / dans mon intérieur ».
theological_decisions:
- issue: Sens de נָכוֹן dans l’expression רוּחַ נָכוֹן
  choice: un esprit ferme
  alternative: un esprit droit; un esprit constant
  rationale: Le terme hébreu évoque principalement ce qui est affermi, stable ou solidement établi. « Ferme » conserve cette idée sans réduire le verset à la seule rectitude morale ni préciser excessivement la nature de l’esprit demandé.
translation_notes:
  register: Français international moderne, poétique et digne. L’inversion vocative « Ô Dieu » garde le ton de la prière; « au fond de moi » exprime naturellement l’intériorité sans recourir à une formulation archaïque.
