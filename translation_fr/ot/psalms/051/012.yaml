source:
  edition: WLC
  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: fr
  text: Ne me rejette pas loin de ta présence, et ne me retire pas ton Esprit saint[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton esprit saint » ; plus littéralement, « l’esprit de ta sainteté ».
    reason: Variante lexicale préservant la construction littérale et l’ambiguïté de רוּחַ קָדְשְׁךָ.
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: Ne me rejette pas
  rationale: Le hifil de שלך exprime ici l’action de jeter ou rejeter quelqu’un. « Rejeter » conserve la force de la supplication tout en restant naturel en français.
- source_word: מִלְּפָנֶיךָ
  choice: loin de ta présence
  rationale: L’expression renvoie littéralement à ce qui est « devant ta face », mais « ta présence » en restitue naturellement le sens relationnel. « Loin de » rend la séparation impliquée par la préposition מן après « rejeter ».
- source_word: רוּחַ קָדְשְׁךָ
  choice: ton Esprit saint
  rationale: La construction signifie littéralement « l’esprit de ta sainteté » et peut aussi se rendre par « ton esprit saint ». « Ton Esprit saint » désigne naturellement en français l’Esprit qui appartient à Dieu, sans ajouter d’explication au texte.
- source_word: תִּקַּח
  choice: ne me retire pas
  rationale: לקח signifie fondamentalement « prendre ». Avec מִמֶּנִּי, « retirer à quelqu’un » est une formulation française directe et idiomatique qui conserve l’idée de privation.
- source_word: מִמֶּנִּי
  choice: me… pas
  rationale: Le complément français de « retirer quelque chose à quelqu’un » rend idiomatiquement l’hébreu « de moi », au moyen du pronom indirect « me ».
theological_decisions:
- issue: Majuscule dans רוּחַ קָדְשְׁךָ
  choice: ton Esprit saint
  alternative: ton esprit saint ; l’esprit de ta sainteté
  rationale: L’hébreu désigne l’esprit propre à Dieu, mais sa construction ne tranche pas à elle seule toutes les questions de conceptualisation ultérieure. La majuscule indique le référent divin selon l’usage français, tandis que la note conserve les lectures lexicalement possibles.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux interdictions est conservé, avec une syntaxe naturelle de prière.
