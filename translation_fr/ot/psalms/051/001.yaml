source:
  edition: WLC
  text: בְּֽ/בוֹא אֵ֭לָי/ו נָתָ֣ן הַ/נָּבִ֑יא כַּֽ/אֲשֶׁר בָּ֝֗א אֶל בַּת שָֽׁבַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/001.yaml
  text: when Nathan the prophet came to him[a], after he had gone in to Bathsheba.
translation:
  language: fr
  text: quand le prophète Nathan vint auprès de lui, après qu’il fut allé vers Bethsabée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque « aller vers une femme » est ici un euphémisme désignant des relations sexuelles.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: quand … vint
  rationale: La préposition ב avec l’infinitif construit de בוא introduit ici une proposition temporelle. « Quand … vint » est naturel en français et convient au style d’une suscription.
- source_word: אֵלָיו
  choice: le trouver
  rationale: Dans « vint le trouver », cette tournure française rend naturellement le mouvement vers lui exprimé par אֶל et le suffixe de troisième personne du masculin singulier.
- source_word: נָתָן
  choice: Nathan
  rationale: Forme française usuelle de ce nom propre.
- source_word: הַנָּבִיא
  choice: le prophète
  rationale: Rend directement le titre défini et la fonction de Nathan.
- source_word: כַּאֲשֶׁר
  choice: après que
  rationale: Dans ce contexte, « après que » exprime clairement la succession entre l’acte de David et la venue de Nathan, sans confondre les deux moments.
- source_word: בָּא אֶל
  choice: fut allé vers
  rationale: בוא avec אֶל suivi du nom d’une femme peut constituer un euphémisme désignant des relations sexuelles. Le texte conserve l’expression voilée, expliquée en note, plutôt que d’en expliciter le sens dans le corps du verset.
- source_word: בַּת שָׁבַע
  choice: Bethsabée
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
theological_decisions:
- issue: Degré d’explicitation de l’expression בָּא אֶל בַּת שָׁבַע
  choice: Conserver dans le texte l’euphémisme « allé vers Bethsabée » et en expliquer le sens en note.
  alternative: Traduire explicitement « eut des relations sexuelles avec Bethsabée ».
  rationale: L’hébreu emploie une expression euphémique. La conserver respecte le registre et la formulation du texte source, tandis que la note évite toute obscurité pour le lecteur moderne.
translation_notes:
  register: Français moderne, digne et fluide. Le passé simple convient à la formulation brève et littéraire de la suscription. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
