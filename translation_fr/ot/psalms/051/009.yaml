source:
  edition: WLC
  text: תַּ֭שְׁמִיעֵ/נִי שָׂשׂ֣וֹן וְ/שִׂמְחָ֑ה תָּ֝גֵ֗לְנָה עֲצָמ֥וֹת דִּכִּֽיתָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: fr
  text: Fais-moi entendre la joie et l’allégresse[a] ; que les os[b] que tu as broyés[c] exultent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Laisse-moi entendre la joie et l’allégresse ».
    reason: Variante idiomatique possible pour rendre la demande exprimée par la forme causative hébraïque.
  - marker: b
    text: Littéralement « les os » ; le contexte indique qu’il s’agit des os du psalmiste.
    reason: L’hébreu n’emploie pas ici de suffixe possessif explicite.
  - marker: c
    text: Ou « que tu as brisés ».
    reason: Le verbe hébreu peut évoquer le fait d’écraser ou de briser.
lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Fais-moi entendre
  rationale: 'Le hiphil de שׁמע avec suffixe de première personne est causatif : « fais-moi entendre ». Cette formulation française demeure naturelle dans une prière et conserve explicitement la causalité du verbe hébreu.'
- source_word: שָׂשׂוֹן
  choice: la joie
  rationale: Le nom exprime la joie ou l’exultation. « Joie » est clair, courant et convient au parallélisme poétique.
- source_word: וְשִׂמְחָה
  choice: et l’allégresse
  rationale: Le terme désigne la joie, la réjouissance ou l’allégresse. « Allégresse » maintient la paire de quasi-synonymes sans répéter « joie ».
- source_word: תָּגֵלְנָה
  choice: que ... exultent
  rationale: L’imparfait qal à la troisième personne féminine plurielle peut prendre ici une valeur volitive. « Que ... exultent » rend à la fois le souhait priant et l’intensité poétique de גיל.
- source_word: עֲצָמוֹת
  choice: les os
  rationale: L’hébreu dit littéralement « les os », sans suffixe possessif. Le texte principal conserve cette forme, même si le contexte désigne les os du psalmiste.
- source_word: דִּכִּיתָ
  choice: tu as broyés
  rationale: Le verbe דכה évoque l’action d’écraser ou de briser. « Broyés » conserve la force de l’image et la deuxième personne du singulier qui attribue directement l’action à Dieu.
theological_decisions:
- issue: L’épreuve est directement attribuée à Dieu
  choice: « les os que tu as broyés »
  alternative: « les os qui ont été broyés » ou « les os que tu as brisés »
  rationale: Le parfait hébreu à la deuxième personne masculine du singulier s’adresse directement à Dieu et lui attribue l’action. La traduction préserve cette tension théologique au lieu d’atténuer cette causalité.
translation_notes:
  register: Français international moderne, poétique et digne. « Allégresse » et « exultent » gardent l’intensité lyrique du verset tout en restant compréhensibles ; la syntaxe causative et l’image forte des os broyés restent proches de l’hébreu.
