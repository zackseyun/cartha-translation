base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: fr
  text: Contre toi — toi seul — j’ai péché[a] ; j’ai fait ce qui est mal à tes yeux, afin que tu sois reconnu juste dans ce que tu dis et sans reproche quand tu juges[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Contre toi seul j’ai péché. » La formulation hébraïque souligne que Dieu est l’ultime personne offensée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que tu sois reconnu juste dans tes paroles et irréprochable quand tu juges ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Contre toi — toi seul —
  rationale: Dans cette confession, la préposition לְ désigne la personne offensée. Les tirets rendent l’insistance de לְבַדְּךָ sans atténuer l’affirmation absolue de l’hébreu.
- source_word: חָטָאתִי
  choice: j’ai péché
  rationale: Le parfait exprime ici une confession portant sur un acte accompli ; le passé composé est naturel en français contemporain.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: j’ai fait ce qui est mal à tes yeux
  rationale: « Ce qui est mal » rend l’adjectif substantivé, tandis que « à tes yeux » conserve l’image hébraïque de l’évaluation divine.
- source_word: לְמַעַן
  choice: afin que
  rationale: Cette locution conserve la relation de but ou de résultat exprimée par l’hébreu, sans trancher entièrement entre ces deux nuances.
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: tu sois reconnu juste dans ce que tu dis
  rationale: צדק exprime le fait d’être dans son droit ou reconnu juste. « Dans ce que tu dis » rend naturellement le nom singulier דָּבָר sans perdre la portée judiciaire.
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: sans reproche quand tu juges
  rationale: זכה évoque la pureté ou l’absence de faute, en parallèle avec צדק. La proposition temporelle rend naturellement בְּ suivi de la forme verbale « juger ».
theological_decisions:
- issue: L’affirmation « contre toi — toi seul » malgré les personnes humaines lésées
  choice: Conserver sans l’atténuer la formulation absolue dirigée vers Dieu
  alternative: « contre toi avant tout » ou « surtout contre toi »
  rationale: Le texte hébreu présente Dieu comme l’ultime offensé et ne comporte aucun terme signifiant « avant tout ». La traduction préserve donc cette tension théologique.
- issue: La portée judiciaire de la dernière proposition
  choice: « reconnu juste » et « sans reproche »
  alternative: « justifié » et « pur », ou « déclaré juste » et « irréprochable dans ton jugement »
  rationale: Ces termes préservent le parallélisme judiciaire et moral sans suggérer que Dieu aurait besoin d’être pardonné ou rendu juste.
- issue: La valeur de לְמַעַן
  choice: « afin que »
  alternative: « de sorte que »
  rationale: La construction peut exprimer le but ou le résultat. « Afin que » maintient la formulation forte du texte sans expliquer comment la faute humaine se rapporte à la reconnaissance de la justice divine.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief « toi seul » ; le vocabulaire conserve les images et la tension judiciaire de l’hébreu sans tournure confessionnelle propre à une tradition particulière.
