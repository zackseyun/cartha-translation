  verdict: revise
  source_fidelity: 'Le texte principal rend fidèlement l’hébreu : « Contre toi — toi seul » conserve l’insistance de לְךָ לְבַדְּךָ ; les parfaits sont naturellement rendus par le passé composé. « Ce qui est mal à tes yeux » est précis. La finale « afin que tu sois reconnu juste dans ce que tu dis et sans reproche quand tu juges » préserve la valeur de but/résultat de לְמַעַן ainsi que le parallélisme entre צדק et זכה. « Quand tu juges » correspond directement à בְּשָׁפְטֶךָ.'
  naturalness: Français moderne, clair et digne. Les tirets autour de « toi seul » soulignent bien l’emphase sans nuire à la fluidité. « Sans reproche quand tu juges » est naturel et évite de faire de « ton jugement » un objet qui serait lui-même sans reproche.
  terminology: « Péché », « mal », « juste » et « sans reproche » conviennent au registre biblique international sans surcharge confessionnelle. La note b doit toutefois s’aligner sur la construction temporelle de l’hébreu et sur l’alternative anglaise auditée (« pure when you judge »), plutôt que de déplacer le sens vers « dans ton jugement ».
