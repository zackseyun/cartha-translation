source:
  edition: WLC
  text: אֲלַמְּדָ֣ה פֹשְׁעִ֣ים דְּרָכֶ֑י/ךָ וְ֝/חַטָּאִ֗ים אֵלֶ֥י/ךָ יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: fr
  text: J’enseignerai tes voies à ceux qui se révoltent, et les pécheurs reviendront à toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tourneront vers toi » ou « retourneront à toi ». Le verbe hébreu peut exprimer aussi bien le fait de se tourner que celui de revenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: J’enseignerai
  rationale: Le hiphil inaccompli à valeur cohortative exprime ici, à la suite de la restauration demandée, une résolution ou un résultat attendu. Le futur français rend naturellement cette nuance volitive.
- source_word: פֹשְׁעִים
  choice: ceux qui se révoltent
  rationale: Le terme désigne ceux qui transgressent par rébellion. Cette formulation moderne conserve la force volontaire et relationnelle de פשע, tout en étant plus immédiatement compréhensible que « transgresseurs ».
- source_word: דְּרָכֶיךָ
  choice: tes voies
  rationale: Le pluriel désigne les manières d’agir, les orientations ou les prescriptions de Dieu. « Tes voies » préserve la métaphore hébraïque et sa résonance biblique.
- source_word: חַטָּאִים
  choice: les pécheurs
  rationale: Rendu français standard, concis et naturel, qui maintient la catégorie morale en parallèle avec ceux qui se révoltent.
- source_word: אֵלֶיךָ
  choice: à toi
  rationale: La préposition indique le mouvement vers Dieu. « À toi » reste sobre et laisse au verbe שוב la charge sémantique du retour ou du changement d’orientation.
- source_word: יָשׁוּבוּ
  choice: reviendront
  rationale: שוב peut signifier se tourner, revenir ou retourner. Dans le contexte pénitentiel du psaume, « reviendront » exprime naturellement la restauration d’une relation, sans réduire le terme à une formulation doctrinale technique.
theological_decisions:
- issue: Portée du langage de repentance dans שוב
  choice: reviendront à toi
  alternative: se tourneront vers toi / retourneront à toi
  rationale: L’hébreu permet à la fois l’idée de se tourner vers Dieu et celle de revenir à lui. Le texte principal retient la nuance relationnelle de retour, tandis que la note conserve explicitement l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux qui se révoltent » explicite sans affaiblir פֹשְׁעִים; « tes voies » conserve la métaphore traditionnelle. Le marqueur de note est placé après la proposition concernée.
