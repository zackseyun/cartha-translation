    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement la personne qui dirige ou supervise l’exécution musicale. « Chef de chœur » est concis, naturel et digne. La préposition « à » rend ici le préfixe לְ sans exclure entièrement une destination ou une attribution fonctionnelle.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Il s’agit du terme générique habituel pour un psaume, probablement lié à une exécution avec accompagnement musical. « Psaume » est le rendu français établi et précis.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, לְ suivi d’un nom propre peut signaler l’auteur, l’appartenance, l’association ou la destination. « De David » préserve mieux cette latitude que « par David ».
theological_decisions:
- issue: Interprétation de la suscription davidique
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu ne définit pas nécessairement une seule relation précise entre David et le psaume. Le rendu retenu conserve cette ambiguïté réelle sans nier la possibilité d’une attribution d’auteur.
translation_notes:
  register: Français international moderne, naturel et digne. Forme brève adaptée à une suscription psalmique ; maintien de l’ambiguïté du לְ hébreu dans les deux expressions.
