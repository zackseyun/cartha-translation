  text: זִֽבְחֵ֣י אֱלֹהִים֮ ר֪וּחַ נִשְׁבָּ֫רָ֥ה לֵב נִשְׁבָּ֥ר וְ/נִדְכֶּ֑ה אֱ֝לֹהִ֗ים לֹ֣א תִבְזֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: fr
  text: Les sacrifices de Dieu, c’est un esprit brisé[a] ; un cœur brisé et écrasé[b], ô Dieu, tu ne le mépriseras pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un esprit contrit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un cœur brisé et contrit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: Les sacrifices de Dieu
  rationale: La chaîne construite signifie littéralement « les sacrifices de Dieu ». Dans le contexte, elle peut désigner les sacrifices que Dieu désire ou agrée, mais la formulation retenue préserve l’expression hébraïque et sa portée métaphorique.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: un esprit brisé
  rationale: רוּחַ signifie ici « esprit », et le participe niphal de שבר exprime l’état de ce qui est brisé. « Esprit brisé » conserve l’image concrète sans expliciter à sa place la contrition.
- source_word: לֵב נִשְׁבָּר
  choice: un cœur brisé
  rationale: Traduction directe de לֵב, « cœur », et du participe de שבר, « brisé » ; la répétition de « brisé » reproduit celle de l’hébreu.
- source_word: וְנִדְכֶּה
  choice: et écrasé
  rationale: Le participe tiré de דכה évoque ce qui est écrasé ou broyé. « Écrasé » maintient la force concrète de l’image et le parallélisme avec « brisé ».
- source_word: אֱלֹהִים
  choice: Dieu / ô Dieu
  rationale: « Dieu » est le rendu normal de אֱלֹהִים. La seconde occurrence est un vocatif ; « ô Dieu » le signale naturellement dans un registre poétique digne.
- source_word: לֹא תִבְזֶה
  choice: tu ne le mépriseras pas
  rationale: בזה signifie « mépriser, traiter avec dédain ». Le futur français rend ici l’inaccompli hébreu comme une assurance adressée à Dieu ; le pronom « le » reprend naturellement « un cœur ».
theological_decisions:
- issue: Sens métaphorique du sacrifice dans un contexte de repentance
  choice: Le texte présente l’esprit brisé et le cœur brisé et écrasé comme les sacrifices de Dieu.
  alternative: Comprendre que le verset abolit tout sacrifice extérieur, ou qu’il ne décrit qu’une détresse émotionnelle sans repentance.
  rationale: La formulation hébraïque identifie les « sacrifices de Dieu » à une disposition intérieure. Elle donne la priorité à une repentance sincère sur un rite vide, sans formuler à elle seule une abolition générale du système sacrificiel. La traduction laisse subsister cette tension.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure présentative « c’est » permet de conserver le pluriel hébreu « les sacrifices » suivi de la réalité intérieure singulière. Les images répétées de la rupture et de l’écrasement sont maintenues sans paraphrase doctrinale.
