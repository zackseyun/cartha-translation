id: PSA.51.10
reference: Psalms 51:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַסְתֵּ֣ר פָּ֭נֶי/ךָ מֵ/חֲטָאָ֑/י וְֽ/כָל עֲוֺ֖נֹתַ֣/י מְחֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: fr
  text: 'Détourne ton visage de mes péchés,

    et efface toutes mes fautes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu traduit par « fautes » peut aussi désigner la culpabilité qui résulte de ces fautes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Détourne
  rationale: L’impératif hiphil de סתר signifie littéralement « cache ». Dans cette construction avec « ton visage de mes péchés », « détourne » exprime naturellement en français la demande que Dieu cesse de porter son attention sur eux, tout en maintenant l’image concrète du visage.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: פנים désigne littéralement le visage et, par extension, l’attention ou la présence personnelle. « Ton visage » conserve l’anthropomorphisme hébreu plutôt que de le remplacer par une interprétation abstraite.
- source_word: מֵחֲטָאָי
  choice: de mes péchés
  rationale: חטא désigne ici les péchés ou offenses. « Mes péchés » est direct, courant et respecte la construction avec la préposition מִן.
- source_word: וְכָל
  choice: et toutes
  rationale: Le syntagme coordonne la seconde demande à la première et souligne la totalité.
- source_word: עֲוֺנֹתַי
  choice: mes fautes
  rationale: עָוֹן peut désigner les actes fautifs aussi bien que la culpabilité qui en découle. « Fautes » maintient une distinction naturelle avec « péchés », sans imposer une nuance doctrinale technique; la possibilité de comprendre « culpabilité » est signalée en note.
- source_word: מְחֵה
  choice: efface
  rationale: L’impératif de מחה évoque le fait d’essuyer, d’effacer ou de supprimer. « Efface » est naturel en français et préserve l’image d’une faute retirée comme une inscription.
theological_decisions:
- issue: Maintien des deux termes hébreux relatifs au péché
  choice: Traduire חטא par « péchés » et עָוֹן par « fautes »
  alternative: Employer « péchés » dans les deux membres, ou rendre עָוֹן par « culpabilité »
  rationale: Le parallélisme emploie deux mots distincts. Les rendre par deux termes français proches respecte la variation poétique, tandis que la note préserve l’ambiguïté de עָוֹן entre faute et culpabilité.
translation_notes:
  register: Français moderne, simple et digne. « Détourne ton visage » garde l’image hébraïque tout en évitant la tournure peu naturelle « cache ton visage de ». Le tutoiement convient à l’adresse directe de la prière poétique.
