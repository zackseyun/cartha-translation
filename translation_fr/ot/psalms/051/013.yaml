source:
  edition: WLC
  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: fr
  text: Rends-moi la joie de ton salut[a], et qu’un esprit volontaire[b] me soutienne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ta délivrance ».
    reason: lexical_alternative
  - marker: b
    text: Ou « généreux » ou « noble ».
    reason: lexical_alternative
  - marker: c
    text: Ou « m’affermisse » ou « me maintienne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Rends-moi
  rationale: Le hifil impératif de שוב demande à Dieu de faire revenir une réalité autrefois connue. « Rends-moi » est naturel en français et exprime clairement cette restauration.
- source_word: לִּי
  choice: -moi
  rationale: Le suffixe de première personne désigne le bénéficiaire; il est rendu idiomatiquement par le pronom conjoint dans « Rends-moi ».
- source_word: שְׂשׂוֹן
  choice: la joie
  rationale: Le nom désigne la joie, l’allégresse ou la jubilation. « La joie » est ici la formulation moderne la plus simple et la plus ample.
- source_word: יִשְׁעֶךָ
  choice: de ton salut
  rationale: Le terme peut évoquer le salut ou la délivrance. « Ton salut » conserve toute l’ampleur de l’intervention salvatrice de Dieu dans ce psaume pénitentiel.
- source_word: וְרוּחַ
  choice: et qu’un esprit
  rationale: Dans ce contexte intérieur et moral, רוּחַ désigne un esprit plutôt que le vent ou le souffle. L’article indéfini respecte l’absence de détermination explicite en hébreu.
- source_word: נְדִיבָה
  choice: bien disposé
  rationale: L’adjectif peut signifier disposé, généreux ou noble. « Bien disposé » exprime en français actuel une volonté prête et libre, sans préciser abusivement s’il s’agit de l’esprit humain renouvelé ou de l’Esprit donné par Dieu.
- source_word: תִסְמְכֵנִי
  choice: me soutienne
  rationale: L’imparfait à valeur volitive prolonge la supplication initiale. « Me soutienne » rend naturellement l’idée de soutenir, d’affermir ou de maintenir.
theological_decisions:
- issue: Portée de « ton salut » dans un psaume pénitentiel
  choice: ton salut
  alternative: ta délivrance
  rationale: « Salut » préserve la portée spirituelle et existentielle du terme sans l’enfermer dans une délivrance uniquement temporelle ni y importer une doctrine postérieure précise.
- issue: Identité et qualité de l’« esprit bien disposé »
  choice: un esprit bien disposé
  alternative: un esprit généreux; un esprit noble
  rationale: Le texte ne précise pas explicitement s’il s’agit de l’esprit du psalmiste renouvelé ou d’un esprit venant de Dieu. La traduction maintient cette ouverture, tandis que la note conserve les autres sens possibles de l’adjectif.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le parallélisme de la prière hébraïque. « Bien disposé » évite l’expression moins naturelle « esprit volontaire » tout en gardant l’idée d’une disposition intérieure libre et prête.
