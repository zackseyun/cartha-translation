id: PSA.51.2
reference: Psalms 51:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָנֵּ֣/נִי אֱלֹהִ֣ים כְּ/חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ מְחֵ֣ה פְשָׁעָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/002.yaml
  text: Be gracious to me[a], God, according to your steadfast love; according to your abundant mercies[c][b], blot out my transgressions.
translation:
  language: fr
  text: Fais-moi grâce[a], ô Dieu, selon ton amour fidèle[b] ; selon ton immense compassion[c], efface mes révoltes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aie pitié de moi ». Le verbe hébreu demande ici la faveur de Dieu ; le texte principal le distingue des termes traduits ensuite par « amour fidèle » et « compassion ».
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne un amour loyal, constant et engagé.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « selon la grandeur » ou « selon la multitude de tes compassions ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: L’impératif de חנן demande à Dieu d’accorder sa faveur. Cette formulation garde ce verbe distinct de חֶסֶד et de רַחֲמִים, employés ensuite.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Il s’agit d’une adresse directe. La particule « ô » marque naturellement l’apostrophe dans un registre poétique digne.
- source_word: כְּחַסְדֶּךָ
  choice: selon ton amour fidèle
  rationale: חֶסֶד évoque un amour loyal, constant et engagé. « Amour fidèle » est clair en français moderne et évite le jargon tout en conservant cette dimension de fidélité.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: selon ton immense compassion
  rationale: רֹב exprime la grandeur ou l’abondance, tandis que רַחֲמִים désigne une profonde compassion. Le singulier collectif « compassion » est plus naturel en français que le calque pluriel « compassions ».
- source_word: מְחֵה
  choice: efface
  rationale: מחה signifie essuyer, supprimer ou effacer. « Efface » conserve naturellement en français l’image de la suppression d’une faute ou de sa trace.
- source_word: פְשָׁעַי
  choice: mes révoltes
  rationale: פֶּשַׁע désigne une transgression conçue comme une rébellion contre l’autorité. « Révoltes » conserve cette force, que « fautes » atténuerait.
theological_decisions:
- issue: Rendu des termes apparentés חנן, חסד et רחמים
  choice: 'Employer trois expressions distinctes : « Fais-moi grâce », « amour fidèle » et « compassion ».'
  alternative: Employer « pitié » ou « miséricorde » pour plusieurs, voire pour les trois termes.
  rationale: L’hébreu accumule des notions proches sans les confondre. Les différencier préserve la richesse poétique et théologique de la supplication.
- issue: Portée de פְשָׁעַי
  choice: « mes révoltes »
  alternative: « mes transgressions » ou « mes fautes »
  rationale: Le choix retenu fait entendre la dimension de rébellion inhérente à פשע, sans réduire le terme à une infraction abstraite ni l’affaiblir en simple erreur.
translation_notes:
  register: Français international moderne, poétique et accessible. L’apostrophe « ô Dieu » convient à la prière sans rendre l’ensemble archaïque. Le parallélisme des deux groupes introduits par « selon » est conservé, tandis que « immense compassion » évite un pluriel peu idiomatique en français.
