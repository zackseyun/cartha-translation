  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: fr
  text: 'Car je connais mes transgressions,

    et mon péché est constamment devant moi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication de la supplication dans le contexte. « Car » conserve cette valeur explicative dans un registre naturel et digne.
- source_word: פְשָׁעַי
  choice: mes transgressions
  rationale: Le terme désigne des actes de révolte ou de rupture envers Dieu. « Transgressions » en préserve la gravité morale et maintient la distinction avec חַטָּאתִי.
- source_word: אֲנִי אֵדָע
  choice: je connais
  rationale: Le verbe exprime ici une connaissance personnelle et consciente de ses fautes. « Je connais » reste direct, sans ajouter l’idée plus volontaire d’un aveu explicite.
- source_word: וְחַטָּאתִי
  choice: et mon péché
  rationale: Dans ce contexte confessionnel, חַטָּאת désigne le péché et non un sacrifice pour le péché. Le singulier hébreu est conservé.
- source_word: נֶגְדִּי
  choice: devant moi
  rationale: Cette expression naturelle conserve l’image de quelque chose placé sous les yeux ou présent à la conscience.
- source_word: תָמִיד
  choice: constamment
  rationale: Rend la persistance continue exprimée par l’hébreu, avec une formulation courante en français moderne.
theological_decisions:
- issue: Rapport entre « transgressions » et « péché »
  choice: Conserver deux termes distincts
  alternative: Uniformiser en employant deux fois « péchés »
  rationale: L’hébreu emploie deux mots apparentés mais distincts. Les différencier préserve la texture poétique et la portée confessionnelle du verset sans imposer une distinction doctrinale excessive.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est préservé en deux lignes, avec un vocabulaire confessionnel compréhensible et sans paraphrase doctrinale.
