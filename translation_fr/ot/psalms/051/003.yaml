source:
  edition: WLC
  text: הרבה כַּבְּסֵ֣/נִי מֵ/עֲוֺנִ֑/י וּֽ/מֵ/חַטָּאתִ֥/י טַהֲרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: fr
  text: Lave-moi complètement de ma faute[a], et purifie-moi de mon péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma culpabilité » ou « de mon tort » ; le mot hébreu peut désigner la faute elle-même aussi bien que la culpabilité qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: complètement
  rationale: L’adverbe intensifie l’impératif qui suit. « Complètement » exprime naturellement en français l’ampleur et l’intensité du lavage, sans introduire explicitement une répétition que l’hébreu n’impose pas.
- source_word: כַּבְּסֵנִי
  choice: Lave-moi
  rationale: Le verbe כבס désigne notamment le lavage des vêtements. « Lave-moi » reste naturel tout en conservant cette image concrète de purification.
- source_word: מֵעֲוֺנִי
  choice: de ma faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. « Ma faute » garde ici une portée morale assez large et convient au parallèle avec « mon péché ».
- source_word: וּמֵחַטָּאתִי
  choice: et … de mon péché
  rationale: חַטָּאת désigne directement le péché dans ce contexte pénitentiel. Le maintien d’un terme distinct de עָוֹן respecte le parallélisme hébreu.
- source_word: טַהֲרֵנִי
  choice: purifie-moi
  rationale: טהר signifie rendre pur ou propre et peut porter des résonances à la fois morales et rituelles. « Purifie-moi » rend cette amplitude avec naturel et dignité.
theological_decisions:
- issue: Rendu des termes pénitentiels עָוֹן et חַטָּאת
  choice: 'Employer deux termes distincts : « faute » et « péché ».'
  alternative: Traduire עָוֹן par « culpabilité » ou rendre les deux termes de façon plus générique.
  rationale: Les deux mots hébreux sont apparentés sans être identiques. Préserver leur distinction maintient la texture poétique et l’ambiguïté de עָוֹן, qui peut viser aussi bien l’acte fautif que la culpabilité qu’il entraîne.
translation_notes:
  register: 'Français international moderne, naturel et digne. La formulation conserve les deux images hébraïques complémentaires : laver et purifier.'
