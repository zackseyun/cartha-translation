review_pass:
  verdict: revise
  source_fidelity: Le sens global et le parallélisme sont bien rendus. Toutefois, « sous une tente » déplace la préposition ב (« dans ») et restreint inutilement סֻכָּה à une tente; « dans un abri » rend mieux le lieu protecteur. « Dans le secret de ta présence » est possible, mais « l’abri de ta présence » exprime plus directement la fonction protectrice de סֵתֶר dans le contexte.
  naturalness: Le français est poétique et accessible. « Dans l’abri de ta présence » et « dans un abri » sont plus naturels et cohérents dans le parallélisme que les formulations actuelles. La répétition de « caches » correspond à l’imagerie rapprochée des deux verbes hébreux et reste stylistiquement acceptable en poésie.
  terminology: « Intrigues humaines » préserve prudemment l’incertitude de רֻכְסֵי אִישׁ. « Querelles des langues » maintient l’image littérale et expressive de לְשֹׁנוֹת; la note explicative en précise le sens hostile. Aucun enjeu doctrinal n’est introduit.
  issues:
  - severity: medium
    issue: « sous une tente » pour בְּסֻכָּה
    rationale: La préposition indique ici la localisation (« dans »), non une position sous un objet. סֻכָּה désigne un abri, une hutte ou une cabane; « tente » est possible dans certains contextes, mais est moins précis ici et « sous » modifie l’image source.
  - severity: low
    issue: « dans le secret de ta présence »
    rationale: Le rendu est défendable, mais « secret » peut évoquer avant tout la confidentialité. Dans ce contexte de protection, « abri » reflète plus directement le sens de סֵתֶר et répond au second hémistiche.
  revised_text: Tu les caches dans l’abri de ta présence, loin des intrigues humaines[a] ; tu les caches dans un abri, loin des querelles des langues[b].
