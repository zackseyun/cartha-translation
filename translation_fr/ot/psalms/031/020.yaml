source:
  edition: WLC
  text: תַּסְתִּירֵ֤/ם בְּ/סֵ֥תֶר פָּנֶי/ךָ֮ מֵֽ/רֻכְסֵ֫י אִ֥ישׁ תִּצְפְּנֵ֥/ם בְּ/סֻכָּ֗ה מֵ/רִ֥יב לְשֹׁנֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: fr
  text: Tu les caches dans l’abri de ta présence, loin des intrigues humaines[a] ; tu les caches dans un abri, loin des querelles des langues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « loin des complots des hommes ». Le mot hébreu est rare et peut évoquer des machinations ou des coalitions hostiles.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « loin des querelles des langues », image des paroles hostiles ou calomnieuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: tu les caches
  rationale: Le hiphil de סתר exprime l’action de cacher ou de tenir caché ; cette formulation naturelle maintient l’image de la protection divine.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: dans le secret de ta présence
  rationale: סֵתֶר désigne un lieu secret ou caché, et פָּנִים peut exprimer la présence. La traduction conserve à la fois le secret protecteur et la proximité de Dieu.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: loin des intrigues humaines
  rationale: רֻכְסֵי est rare et difficile ; il semble désigner des machinations, complots ou regroupements hostiles. « Intrigues » préserve cette indétermination générale, tandis que « humaines » rend ici le singulier représentatif אִישׁ en français idiomatique.
- source_word: תִּצְפְּנֵם
  choice: tu les mets à l’abri
  rationale: צפן signifie cacher, mettre en réserve ou préserver. Dans ce contexte protecteur, « mettre à l’abri » est naturel et évite une répétition plate de « cacher ».
- source_word: בְּסֻכָּה
  choice: sous une tente
  rationale: סֻכָּה désigne concrètement une hutte, une cabane ou un abri de branchages. « Tente » maintient une image concrète et poétique, sans introduire le terme cultuel « tabernacle ».
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: loin des querelles des langues
  rationale: רִיב signifie querelle, dispute ou conflit, et לְשֹׁנוֹת est littéralement « langues ». Le rendu conserve la métaphore vive des paroles hostiles.
theological_decisions:
- issue: Portée anthropologique de אִישׁ
  choice: humaines
  alternative: d’un homme
  rationale: Le masculin singulier est représentatif et renvoie ici aux machinations provenant des êtres humains. Le français « intrigues humaines » exprime cette portée générique sans attribuer le danger à un individu précis.
- issue: Sens de פָּנֶיךָ
  choice: ta présence
  alternative: ton visage
  rationale: « Visage » est le sens concret, mais dans cette construction la présence personnelle et protectrice de Dieu est vraisemblablement visée. « Présence » transmet cet emploi sans supprimer l’image du lieu secret.
translation_notes:
  register: Français international actuel, poétique et digne. Le parallélisme des deux propositions et la métaphore des « langues » sont conservés ; les termes rares ou ambigus sont signalés en notes.
