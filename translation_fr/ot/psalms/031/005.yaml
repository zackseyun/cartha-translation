id: PSA.31.5
reference: Psalms 31:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: fr
  text: Entre tes mains, je remets mon esprit ; tu m’as racheté, ô Yahweh, Dieu de vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dieu fidèle ». Le mot hébreu peut évoquer la vérité, la fiabilité ou la fidélité.
    reason: Alternative lexicale préservant l’étendue sémantique de אֱמֶת.
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: Entre tes mains
  rationale: Avec un verbe exprimant la remise confiante, cette tournure idiomatique française rend naturellement l’idée de placer quelque chose sous la garde et la protection de quelqu’un. Le français emploie normalement le pluriel dans cette expression, bien que l’hébreu ait le singulier « ta main ».
- source_word: אַפְקִיד
  choice: je remets
  rationale: Le hiphil de פקד exprime ici l’action de confier quelque chose à la garde d’un autre. « Je remets » est naturel, solennel et convient particulièrement à l’expression française « remettre entre les mains ».
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ peut désigner le souffle, l’esprit ou le principe de vie. Dans cette prière de confiance, « mon esprit » préserve l’ampleur personnelle et théologique du terme sans le réduire au seul souffle physique.
- source_word: פָּדִיתָה
  choice: tu m’as racheté
  rationale: Le parfait de פדה décrit une délivrance accomplie dont l’effet demeure. Le passé composé français rend bien cette portée, et « racheter » conserve les résonances de délivrance et de rédemption.
- source_word: יְהוָה
  choice: ô Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre. « ô » marque clairement l’apostrophe sans alourdir la phrase.
- source_word: אֵל אֱמֶת
  choice: Dieu de vérité
  rationale: Cette traduction reproduit directement la construction hébraïque et maintient la dimension de vérité, tout en signalant en note la nuance également possible de fidélité et de fiabilité.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: ô Yahweh
  alternative: ô Éternel / ô Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. Sa translittération préserve cette fonction de nom personnel plutôt que de lui substituer un titre.
- issue: Nuance de אֱמֶת dans אֵל אֱמֶת
  choice: Dieu de vérité
  alternative: Dieu fidèle
  rationale: אֱמֶת peut exprimer la vérité, la fiabilité ou la fidélité. Le texte principal conserve la forme nominale transparente « de vérité », tandis que la note préserve l’autre nuance contextuellement forte sans trancher artificiellement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le parallélisme de la prière et son ton solennel sans archaïsme. « Entre tes mains » privilégie l’idiome français courant malgré le singulier morphologique de l’hébreu.
