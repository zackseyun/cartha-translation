id: PSA.31.9
reference: Psalms 31:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י צַ֫ר לִ֥/י עָשְׁשָׁ֖ה בְ/כַ֥עַס עֵינִ֗/י נַפְשִׁ֥/י וּ/בִטְנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/009.yaml
  text: Be gracious to me[a], O Yahweh, for I am in distress[c][b]; my eye has wasted away with grief—my soul and my belly as well.
translation:
  language: fr
  text: Fais-moi grâce, Yahweh, car je suis dans la détresse ! Mon œil se consume de chagrin[a], mon âme[b] et mon ventre[c] aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon œil s’affaiblit de dépit » ou « mon œil défaille de douleur ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu peut aussi signifier « ma vie » ou « tout mon être ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « mon ventre » ; le terme peut désigner plus largement les entrailles ou l’intérieur du corps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Fais-moi grâce
  rationale: L’impératif de חנן exprime un appel à la faveur bienveillante. Cette formulation reste proche de l’hébreu tout en étant naturelle dans une prière en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כִּי צַר לִי
  choice: car je suis dans la détresse
  rationale: כִּי introduit le motif de la supplication, et צַר לִי décrit l’état personnel d’oppression ou de détresse du psalmiste.
- source_word: עָשְׁשָׁה
  choice: se consume
  rationale: Le verbe évoque le dépérissement, l’affaiblissement ou la défaillance. « Se consume » communique cette dégradation progressive dans un registre poétique naturel.
- source_word: בְכַעַס
  choice: de chagrin
  rationale: כעס peut désigner l’irritation, le dépit ou l’affliction. Dans cette plainte, « chagrin » rend naturellement la souffrance intérieure sans exclure les autres nuances.
- source_word: עֵינִי
  choice: mon œil
  rationale: Le singulier hébreu est conservé et convient au langage poétique français.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » préserve ici l’ampleur anthropologique et poétique du terme.
- source_word: וּבִטְנִי
  choice: et mon ventre aussi
  rationale: בטן désigne littéralement le ventre et, par extension, l’intérieur du corps ou les entrailles. Le rendu direct conserve l’image corporelle de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le Tétragramme. « Yahweh » préserve le nom personnel sans lui substituer un titre traditionnel.
- issue: Portée anthropologique de נַפְשִׁי
  choice: mon âme
  alternative: ma vie / tout mon être
  rationale: Le terme demeure polysémique. « Mon âme » conserve la tension entre vie, personne et intériorité sans imposer une définition doctrinale étroite.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste claire pour la lecture publique. Le singulier « mon œil » et l’image concrète du « ventre » maintiennent la forme et l’anthropologie corporelle de l’hébreu.
