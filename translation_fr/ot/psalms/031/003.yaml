base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: fr
  text: Car[a] tu es mon rocher et ma forteresse[b] ; à cause de ton nom, tu me conduiras et me guideras[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Parce que tu es mon rocher et ma forteresse ». Le mot hébreu peut introduire une raison ou une explication.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma place forte ».
    reason: lexical_alternative
  - marker: c
    text: 'Les deux verbes hébreux sont très proches par le sens. On pourrait aussi comprendre cette phrase comme une demande : « conduis-moi et guide-moi ».'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici le fondement de la demande exprimée dans le contexte. « Car » maintient le lien logique tout en convenant au mouvement poétique.
- source_word: סַלְעִי
  choice: mon rocher
  rationale: Le nom désigne un rocher ou un escarpement et sert ici de métaphore d’un refuge sûr. « Mon rocher » est naturel, clair et conserve l’image hébraïque.
- source_word: מְצוּדָתִי
  choice: ma forteresse
  rationale: Le terme désigne un lieu fortifié ou un refuge défensif. « Ma forteresse » restitue directement cette image et forme un parallélisme naturel avec « mon rocher ».
- source_word: אָתָּה
  choice: tu es
  rationale: Le pronom indépendant est emphatique en hébreu. Le français explicite la copule tout en gardant l’identification directe et personnelle.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: à cause de ton nom
  rationale: Cette formulation conserve l’appel au nom de Dieu comme fondement de son action, sans réduire le nom à la seule réputation ni développer l’expression au-delà du texte.
- source_word: תַּנְחֵנִי
  choice: tu me conduiras
  rationale: Le verbe à la forme causative exprime l’action de mener ou de guider. Le futur traduit ici l’attente confiante qui découle de la confession précédente.
- source_word: וּתְנַהֲלֵנִי
  choice: et me guideras
  rationale: Le verbe évoque le fait de mener avec direction et soin. « Guider » le distingue légèrement du verbe précédent tout en préservant leur parallélisme synonymique.
theological_decisions:
- issue: Sens de « à cause de ton nom »
  choice: La conduite divine est demandée sur le fondement du nom de Dieu, qui évoque son identité révélée, son honneur et sa fidélité, sans explicitation ajoutée dans le verset.
  alternative: Limiter le « nom » à la réputation de Dieu devant les autres.
  rationale: L’expression hébraïque garde une portée riche. La traduction conserve l’idiome et sa tension théologique au lieu de l’interpréter étroitement.
- issue: Valeur des verbes à l’inaccompli
  choice: 'Futur de confiance : « tu me conduiras et me guideras ».'
  alternative: 'Prière à l’impératif : « conduis-moi et guide-moi » ; ou présent : « tu me conduis et me guides ».'
  rationale: Dans cette prière, les inaccomplis peuvent exprimer une attente assurée fondée sur « tu es mon rocher et ma forteresse ». Le futur français rend naturellement cette confiance, tout en signalant l’autre lecture possible en note.
translation_notes:
  register: Français international moderne, poétique et digne. Les métaphores concrètes sont conservées. « Conduire » et « guider » maintiennent le parallélisme sans fusionner les deux verbes hébreux.
