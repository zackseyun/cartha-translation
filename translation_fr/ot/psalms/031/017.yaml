source:
  edition: WLC
  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: fr
  text: Yahweh, que je ne sois pas déshonoré, car je t’invoque ; que les méchants soient déshonorés, qu’ils se taisent dans le séjour des morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le terme hébreu est « Shéol ». La préposition peut aussi suggérer une direction : « qu’ils descendent en silence au séjour des morts ». Le verbe hébreu peut évoquer le silence ou l’immobilité ; on peut aussi comprendre : « qu’ils restent immobiles dans le séjour des morts ». Le Shéol désigne le domaine des morts, pas nécessairement l’enfer.'
    reason: Préserver l’ambiguïté de יִדְּמוּ, la valeur possible de la préposition ל et la portée propre du terme שְׁאוֹל, sans qualifier incorrectement « dans » de traduction littérale.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin du texte hébreu et conserve l’interpellation directe sans ajouter un « ô » peu naturel en français courant.
- source_word: אַל אֵבוֹשָׁה
  choice: que je ne sois pas couvert de honte
  rationale: Rend la prière négative exprimée par אַל et le résultat de honte ou de déshonneur porté par בושׁ.
- source_word: כִּי קְרָאתִיךָ
  choice: car je t’invoque
  rationale: כִּי introduit le motif de la demande, tandis que קרא avec Dieu pour objet exprime ici l’invocation; le présent convient à la situation de prière sans nier la forme accomplie de l’hébreu.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: que les méchants soient couverts de honte
  rationale: Conserve la valeur optative ou imprécatoire et reprend le même vocabulaire que dans le premier membre afin de préserver le parallélisme.
- source_word: יִדְּמוּ
  choice: qu’ils se taisent
  rationale: Rend directement l’idée de devenir silencieux ou immobile, sans introduire la nuance causative de « qu’ils soient réduits au silence » ni trancher en faveur de « périr ».
- source_word: לִשְׁאוֹל
  choice: dans le séjour des morts
  rationale: Exprime en français clair le shéol, domaine des morts, sans l’assimiler à l’enfer; la préposition est comprise comme situant leur silence dans ce domaine.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de שְׁאוֹל
  choice: le séjour des morts
  alternative: le Shéol
  rationale: Cette formulation reste intelligible pour un lectorat francophone international et désigne le domaine des morts sans importer la notion ultérieure d’enfer; la translittération demeure signalée en note.
- issue: Portée de יִדְּמוּ
  choice: qu’ils se taisent
  alternative: qu’ils restent immobiles / qu’ils descendent en silence
  rationale: Le verbe permet les idées voisines de silence et d’immobilité. Le texte principal conserve la formulation la moins interprétative, tandis que la note maintient les autres lectures possibles.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme autour de la honte est conservé; la ponctuation exclamative restitue la vigueur de la supplication et de l’imprécation.
