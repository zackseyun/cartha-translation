  text: תּוֹצִיאֵ֗/נִי מֵ/רֶ֣שֶׁת ז֭וּ טָ֣מְנוּ לִ֑/י כִּֽי אַ֝תָּה מָֽעוּזִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: fr
  text: Fais-moi sortir du filet qu’ils ont caché pour moi[a], car tu es ma forteresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du filet qu’ils ont dissimulé pour moi ». Le texte hébreu parle littéralement d’un filet caché ; dans ce contexte, il s’agit d’un piège.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Fais-moi sortir
  rationale: Le hiphil de יצא exprime ici l’action de faire sortir. Cette formulation française conserve nettement la valeur causative sans ajouter l’idée plus interprétative de délivrance.
- source_word: מֵרֶשֶׁת
  choice: du filet
  rationale: רֶשֶׁת désigne concrètement un filet, employé ici comme image d’un piège. « Filet » préserve cette image plutôt que de la remplacer par son sens figuré.
- source_word: זוּ
  choice: que
  rationale: זוּ peut avoir ici une valeur relative ou démonstrative. La construction « du filet qu’ils ont caché » est naturelle en français et respecte la lecture relative du texte hébreu.
- source_word: טָמְנוּ לִי
  choice: qu’ils ont caché pour moi
  rationale: טמן signifie cacher ou dissimuler. La traduction conserve ce choix lexical inhabituel mais intelligible; « tendu contre moi » expliciterait davantage l’usage hostile du filet.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison qui fonde la demande. « Car » convient au registre poétique et exprime clairement ce lien.
- source_word: מָעוּזִּי
  choice: mon refuge fortifié
  rationale: מָעוֹז associe force, protection et lieu sûr. « Refuge fortifié » rend cette double dimension plus naturellement en français moderne que le calque « place forte » dans cette adresse à Dieu.
theological_decisions:
- issue: Métaphore protectrice appliquée à Dieu
  choice: tu es mon refuge fortifié
  alternative: tu es ma forteresse
  rationale: Le texte présente Dieu comme source ou lieu de force protectrice. « Refuge fortifié » maintient la métaphore sans la réduire à la seule idée d’abri; « forteresse » est également possible, mais concrétise davantage l’image.
translation_notes:
  register: Français international moderne, poétique et digne. Le vers conserve l’image concrète du filet caché ainsi que la relation causale entre la supplication et la confiance en Dieu.
