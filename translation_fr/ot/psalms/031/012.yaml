  text: נִ֭שְׁכַּחְתִּי כְּ/מֵ֣ת מִ/לֵּ֑ב הָ֝יִ֗יתִי כִּ/כְלִ֥י אֹבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/012.yaml
  text: I am forgotten like a dead man[a], out of mind[b]; I have become like a vessel that is lost.
translation:
  language: fr
  text: Je suis oublié comme un mort, effacé des mémoires[a] ; je suis devenu comme un objet perdu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du cœur ». Dans cet idiome hébreu, le cœur est le siège de la pensée et du souvenir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme un récipient qui dépérit » ou « comme un objet en ruine ». Le mot hébreu peut désigner divers objets ou récipients, et le dernier terme peut signifier perdu, dépérissant ou ruiné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Je suis oublié
  rationale: 'Le nifal accompli à la première personne exprime ici l’état résultant du psalmiste : il se trouve oublié. Le présent français rend naturellement cet état.'
- source_word: כְּמֵת
  choice: comme un mort
  rationale: La préposition כְּ marque la comparaison et מֵת est singulier. « Comme un mort » conserve l’image personnelle et reste naturel en français.
- source_word: מִלֵּב
  choice: effacé des mémoires
  rationale: Littéralement « loin du cœur » ou « ôté du cœur » ; לֵב désigne ici le siège de la pensée et du souvenir. La formulation choisie transmet clairement l’idée sans imposer le sens affectif moderne de « cœur ».
- source_word: הָיִיתִי
  choice: je suis devenu
  rationale: L’accompli de היה introduit un état auquel le psalmiste est arrivé. Le passé composé souligne son résultat présent.
- source_word: כִּכְלִי
  choice: comme un objet
  rationale: כְּלִי peut désigner un récipient, un ustensile ou, plus largement, un objet. « Objet » préserve cette largeur sémantique et évite de préciser indûment sa nature.
- source_word: אֹבֵד
  choice: perdu
  rationale: Le participe de אבד peut signifier perdu, en voie de disparition ou ruiné. « Perdu » conserve l’ambiguïté entre un objet égaré et un objet voué à la perte.
theological_decisions: []
