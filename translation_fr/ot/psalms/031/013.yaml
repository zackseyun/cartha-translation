    issue: Le présent « j’entends » ne reflète pas adéquatement le parfait hébreu.
    rationale: Le parfait שָׁמַעְתִּי rapporte ce que le psalmiste a entendu ; le passé composé français conserve cette valeur sans interpréter le temps comme une perception répétée actuelle.
  - severity: medium
    issue: Les guillemets font de « La terreur est partout ! » le contenu explicite des propos entendus.
    rationale: La construction hébraïque juxtapose « la rumeur/le discours de beaucoup » et « terreur de tous côtés » sans marquer de discours direct. Il convient de préserver cette concision et cette ambiguïté.
  - severity: low
    issue: L’ancre de la note est placée après « vie », alors que la note concerne le premier groupe lexical.
    rationale: La placer immédiatement après « beaucoup » rend son rattachement clair.
