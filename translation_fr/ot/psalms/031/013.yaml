base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: fr
  text: Car j’ai entendu les murmures de beaucoup[a] — terreur de tous côtés ! — quand ils se concertent ensemble contre moi, projetant de m’ôter la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les calomnies de beaucoup ». Le nom hébreu peut désigner des murmures, des rumeurs ou des paroles diffamatoires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la détresse exprimée dans le contexte, sans préciser davantage la nuance causale.
- source_word: שָׁמַעְתִּי
  choice: j’entends
  rationale: Le parfait hébreu décrit ici une perception dont l’effet demeure présent ; le présent français rend naturellement cette expérience actuelle et répétée.
- source_word: דִּבַּת רַבִּים
  choice: les propos malveillants de beaucoup
  rationale: דִּבָּה peut désigner des rumeurs, des murmures ou des paroles diffamatoires. Cette formulation conserve l’hostilité du contexte sans réduire le terme à une seule catégorie de parole.
- source_word: מָגוֹר מִסָּבִיב
  choice: La terreur est partout !
  rationale: Rend avec naturel la formule compacte évoquant une menace terrifiante de tous côtés. Les guillemets permettent de la comprendre comme le contenu des propos entendus, tout en laissant perceptible son caractère d’exclamation.
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: quand ils se concertent contre moi
  rationale: Exprime la consultation coordonnée et hostile indiquée par le verbe, יַחַד et עָלַי.
- source_word: לָקַחַת נַפְשִׁי זָמָמוּ
  choice: ils projettent de m’ôter la vie
  rationale: נֶפֶשׁ désigne ici la vie de la personne ; זָמַם indique un projet délibéré et hostile. L’ordre français clarifie la relation entre le projet et son but.
