revisions:
- from: Car j’entends les propos malveillants de beaucoup — « La terreur est partout ! » — quand ils se concertent contre moi ; ils projettent de m’ôter la vie.[a]
  to: Car j’ai entendu les murmures de beaucoup[a] — terreur de tous côtés ! — quand ils se concertent ensemble contre moi, projetant de m’ôter la vie.
  rationale: La révision rétablit la valeur accomplie de « j’ai entendu », évite de transformer la formule centrale en citation explicite, et déplace l’ancre de note auprès du mot qu’elle explique. Elle conserve la menace coordonnée et le projet de tuer sans ajouter d’interprétation doctrinale ou historique.
