  verdict: revise
  source_fidelity: Le parfait שָׁמַעְתִּי est mieux rendu par « j’ai entendu » que par un présent. La formule מָגוֹר מִסָּבִיב est une exclamation ou une notation poétique autonome ; la présenter explicitement entre guillemets comme le contenu des propos entendus ajoute une relation syntaxique que l’hébreu ne marque pas. « Se concertent ensemble contre moi » rend la consultation coordonnée et hostile, et « m’ôter la vie » rend correctement לָקַחַת נַפְשִׁי.
  naturalness: Le texte révisé demeure fluide en français international moderne. Les tirets encadrent la formule brève et frappante sans lui imposer le statut de discours direct. « Murmures » est idiomatique dans ce contexte et la note maintient l’éventail sémantique pertinent.
  terminology: « Murmures » correspond à la valeur possible de דִּבָּה tout en évitant de fixer d’emblée le sens à « calomnies ». « Terreur de tous côtés » conserve l’imagerie de menace environnante et le rythme de la formule hébraïque. « Vie » est préférable à « âme » ici, puisque נֶפֶשׁ désigne la vie de la personne.
  issues:
