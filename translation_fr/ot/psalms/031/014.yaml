  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: fr
  text: 'Mais moi, je mets ma confiance en toi, Yahweh ; je dis : « Tu es mon Dieu. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Mais moi, j’ai mis ma confiance en toi, Yahweh ; j’ai dit : “Tu es mon Dieu.” » Les formes hébraïques peuvent exprimer des actes accomplis ou une confiance et une confession établies qui demeurent actuelles.'
    reason: alternative temporelle des formes verbales hébraïques
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction suivie du pronom indépendant marque à la fois le contraste avec ce qui précède et l’insistance sur le psalmiste. « Mais moi » restitue naturellement ces deux valeurs en français.
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: je mets ma confiance en toi
  rationale: Avec בָּטַח, la préposition עַל désigne celui sur qui repose la confiance. Cette formulation française exprime clairement une confiance actuelle et active, tout en laissant la note signaler la valeur perfective possible du qatal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: אָמַרְתִּי
  choice: je dis
  rationale: Dans cette déclaration de confiance, le présent français rend l’aveu actuel du psalmiste ; la forme hébraïque qatal permet aussi une traduction au passé composé, indiquée en note.
- source_word: אֱלֹהַי אָתָּה
  choice: Tu es mon Dieu
  rationale: Le suffixe de première personne donne « mon Dieu », tandis que le pronom indépendant אַתָּה porte une insistance naturellement conservée par « Tu es ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie explicitement le tétragramme. « Yahweh » conserve le caractère de nom propre sans le remplacer par le titre « Seigneur ».
- issue: Valeur temporelle des formes בָטַחְתִּי et אָמַרְתִּי
  choice: 'présent : « je mets ma confiance… je dis »'
  alternative: 'passé composé : « j’ai mis ma confiance… j’ai dit »'
  rationale: Le contexte de prière permet de comprendre les formes qatal comme exprimant une confiance et une confession établies qui demeurent actuelles. La traduction principale privilégie donc l’immédiateté, sans écarter la lecture perfective signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. « Mais moi » conserve le contraste emphatique ; « mettre sa confiance en » est idiomatique et accessible. Le parallélisme bref de la prière est préservé.
