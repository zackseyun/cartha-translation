id: PSA.31.18
reference: Psalms 31:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: fr
  text: Que les lèvres mensongères soient réduites au silence[a], elles qui parlent avec insolence contre le juste[b], avec orgueil et mépris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soient frappées de mutisme » ; le verbe hébreu peut évoquer le fait de devenir silencieux ou d’être rendu muet.
    reason: lexical_alternative
  - marker: b
    text: Ou « une personne juste » ; le singulier hébreu peut désigner un individu ou avoir une valeur représentative.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: Que ... soient réduites au silence
  rationale: Le nifal imparfait à valeur jussive exprime ici un souhait imprécatoire. Cette tournure française rend naturellement l'idée de devenir silencieux ou d'être contraint au silence.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: les lèvres mensongères
  rationale: L'expression construite signifie littéralement « lèvres de mensonge » ; « lèvres mensongères » est idiomatique et conserve la personnification.
- source_word: הַדֹּבְרוֹת
  choice: elles qui parlent
  rationale: Le participe féminin pluriel s'accorde avec « lèvres » et les caractérise. La reprise pronominale produit une phrase française claire.
- source_word: עַל צַדִּיק
  choice: contre le juste
  rationale: Le substantif adjectival singulier désigne une personne juste, possiblement de manière représentative. « Le juste » préserve le singulier et ne précise pas davantage l'identité.
- source_word: עָתָק
  choice: avec insolence
  rationale: Le nom évoque l'insolence ou l'arrogance de la parole. La locution adverbiale « avec insolence » s'intègre naturellement au verbe et se distingue de l'orgueil mentionné ensuite.
- source_word: בְּגַאֲוָה
  choice: avec orgueil
  rationale: La préposition et le nom indiquent la manière ou l'attitude ; « avec orgueil » en conserve directement le sens.
- source_word: וָבוּז
  choice: et mépris
  rationale: Le nom désigne le mépris ou le dédain ; « mépris » forme avec « orgueil » une paire naturelle et fidèle.
theological_decisions:
- issue: Portée du singulier צַדִּיק
  choice: le juste
  alternative: un juste / une personne juste
  rationale: Le texte peut viser un individu précis ou employer le singulier de façon représentative. La traduction retient le défini sans déterminer davantage la portée.
translation_notes:
  register: Français moderne, digne et accessible. La personnification des lèvres et l'accumulation « insolence, orgueil et mépris » sont conservées, tout en évitant une répétition trop étroite entre « arrogance » et « orgueil ».
