id: PSA.31.23
reference: Psalms 31:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶֽהֱב֥וּ אֶת יְהוָ֗ה כָּֽל חֲסִ֫ידָ֥י/ו אֱ֭מוּנִים נֹצֵ֣ר יְהוָ֑ה וּ/מְשַׁלֵּ֥ם עַל יֶ֝֗תֶר עֹשֵׂ֥ה גַאֲוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: fr
  text: Aimez l’Éternel, vous tous qui lui êtes fidèles[a] ! L’Éternel protège les fidèles et rétribue abondamment[b] celui qui agit avec orgueil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous tous, ses saints » ou « vous tous qui lui êtes attachés ». Le terme hébreu désigne ceux qui se caractérisent par leur loyauté envers l’Éternel.
    reason: lexical_alternative
  - marker: b
    text: Ou « rétribue pleinement » ou « rend abondamment ». L’expression hébraïque souligne l’ampleur de la rétribution.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Aimez
  rationale: Impératif qal masculin pluriel de אהב ; « Aimez » rend directement l’exhortation adressée à la communauté.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français traditionnel et intelligible du tétragramme, employé ici comme nom divin plutôt que comme simple titre.
- source_word: כָּל חֲסִידָיו
  choice: vous tous qui lui êtes fidèles
  rationale: חסיד désigne ici ceux qui se caractérisent par leur loyauté envers Dieu. Cette formulation naturelle conserve la relation exprimée par le suffixe « ses » sans les connotations ecclésiastiques possibles de « saints ».
- source_word: אֱמוּנִים
  choice: les fidèles
  rationale: L’adjectif pluriel substantivé évoque des personnes fiables et fidèles ; la formulation concise convient au parallélisme du verset.
- source_word: נֹצֵר
  choice: protège
  rationale: Le participe de נצר exprime l’action de garder soigneusement. « Protège » est naturel en français et correspond au thème de la sauvegarde divine dans le psaume.
- source_word: וּמְשַׁלֵּם עַל יֶתֶר
  choice: mais il paie largement de retour
  rationale: שלם au piel exprime la rétribution, et עַל יֶתֶר en renforce l’ampleur. « Payer de retour » garde l’idée de rendre à quelqu’un selon ses actes, tandis que « largement » préserve l’intensification.
- source_word: עֹשֵׂה גַאֲוָה
  choice: celui qui agit avec orgueil
  rationale: Expression littéralement proche de « celui qui fait l’orgueil » ; cette tournure française rend naturellement une conduite caractérisée par l’arrogance.
theological_decisions:
- issue: Identité des חֲסִידָיו
  choice: vous tous qui lui êtes fidèles
  alternative: vous tous, ses saints ; vous tous qui lui êtes attachés
  rationale: Le choix met en avant la loyauté relationnelle et éthique sans importer un sens ecclésiastique ultérieur du mot « saints ».
- issue: Contraste entre protection et rétribution
  choice: L’Éternel protège les fidèles, mais il paie largement de retour celui qui agit avec orgueil
  alternative: L’Éternel garde ceux qui sont dignes de confiance et rend abondamment à celui qui agit avec orgueil
  rationale: Le texte juxtapose la sauvegarde des fidèles et la rétribution de l’orgueilleux. « Mais » explicite le contraste contextuel porté par la coordination hébraïque sans atténuer ni la protection ni le jugement.
- issue: Nature de la rétribution divine
  choice: paie largement de retour
  alternative: rétribue pleinement ; rend au-delà de toute mesure
  rationale: La formulation conserve l’ambivalence formelle du verbe de rétribution tout en laissant le contexte négatif de l’orgueil déterminer qu’il s’agit ici d’un jugement.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’adresse directe « vous tous qui lui êtes fidèles » est fluide à l’oral comme à l’écrit. « Paie largement de retour » maintient l’image de la rétribution et le contraste solennel du verset.
