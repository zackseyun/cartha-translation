id: PSA.31.10
reference: Psalms 31:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י כָל֪וּ בְ/יָג֡וֹן חַיַּ/י֮ וּ/שְׁנוֹתַ֪/י בַּ/אֲנָ֫חָ֥ה כָּשַׁ֣ל בַּ/עֲוֺנִ֣/י כֹחִ֑/י וַ/עֲצָמַ֥/י עָשֵֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: fr
  text: 'Car ma vie se consume dans le chagrin,

    et mes années dans les gémissements ;

    ma force chancelle[a] à cause de ma faute[b],

    et mes os dépérissent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « défaille » ; le verbe hébreu signifie littéralement « trébucher » ou « chanceler », ici au sens figuré.
    reason: lexical_alternative
  - marker: b
    text: Ou « ma culpabilité » ou « les conséquences de ma faute » ; le mot hébreu peut désigner la faute, la culpabilité ou ses conséquences.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la plainte précédente et conserve la valeur causale du terme hébreu.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: ma vie se consume dans le chagrin
  rationale: « Se consume » exprime l’épuisement progressif indiqué par כלה, tandis que « chagrin » rend naturellement יָגוֹן.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: et mes années dans les gémissements
  rationale: אֲנָחָה peut désigner soupirs ou gémissements ; ce dernier terme convient à l’intensité de la lamentation.
- source_word: כָּשַׁל ... כֹחִי
  choice: ma force chancelle
  rationale: Conserve l’image vive du verbe hébreu, qui signifie trébucher, chanceler ou défaillir, tout en restant intelligible en français.
- source_word: בַּעֲוֺנִי
  choice: à cause de ma faute
  rationale: La préposition reçoit ici un sens causal probable. « Faute » garde la dimension morale de עָוֹן sans préciser indûment s’il s’agit de l’acte, de la culpabilité ou de ses conséquences.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: et mes os dépérissent
  rationale: Préserve l’image corporelle des os qui s’affaiblissent et se dégradent.
theological_decisions:
- issue: Portée de עָוֹן dans l’aveu du psalmiste
  choice: ma faute
  alternative: ma culpabilité ; les conséquences de ma faute
  rationale: Le nom hébreu peut désigner la faute commise, la culpabilité qui en résulte ou ses conséquences. Le texte principal conserve le sens moral central, et la note maintient ouverte cette tension sans affirmer un mécanisme précis de châtiment.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé en quatre lignes, avec un vocabulaire courant et sans explicitation doctrinale ajoutée.
