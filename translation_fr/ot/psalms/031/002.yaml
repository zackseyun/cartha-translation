id: PSA.31.2
reference: Psalms 31:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַטֵּ֤ה אֵלַ֨/י אָזְנְ/ךָ֮ מְהֵרָ֪ה הַצִּ֫ילֵ֥/נִי הֱיֵ֤ה לִ֨/י לְֽ/צוּר מָ֭עוֹז לְ/בֵ֥ית מְצוּד֗וֹת לְ/הוֹשִׁיעֵֽ/נִי׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/002.yaml
  text: Incline your ear to me[a]; quickly rescue me. Be for me a rock of refuge[b], a fortified house to save me.
translation:
  language: fr
  text: Penche vers moi ton oreille ; délivre-moi vite ! Sois pour moi un rocher protecteur[a], une maison fortifiée[b], pour me sauver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un puissant rocher » ou « un rocher-refuge ». Le groupe hébreu associe le « rocher » à un nom désignant une protection solide ou une place forte.
    reason: lexical_alternative
  - marker: b
    text: Ou « une forteresse » ou, plus littéralement, « une maison de places fortes ». L’hébreu conserve l’image de la maison tout en la présentant comme fortement défendue.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: Penche vers moi ton oreille
  rationale: L’expression conserve l’image concrète de Dieu qui incline son oreille vers le psalmiste, tout en restant compréhensible en français moderne.
- source_word: מְהֵרָה הַצִּילֵנִי
  choice: délivre-moi vite
  rationale: מְהֵרָה exprime l’urgence, tandis que נצל désigne ici l’action d’arracher quelqu’un au danger. La formulation est directe et naturelle.
- source_word: הֱיֵה לִי
  choice: Sois pour moi
  rationale: Cette tournure rend simplement l’impératif de היה avec le pronom datif et préserve sa portée relationnelle.
- source_word: לְצוּר מָעוֹז
  choice: un rocher protecteur
  rationale: צוּר désigne le rocher et מָעוֹז un lieu ou un moyen de protection. Le choix conserve l’image du rocher tout en exprimant sa fonction de refuge.
- source_word: לְבֵית מְצוּדוֹת
  choice: une maison fortifiée
  rationale: La traduction maintient l’image explicite de la maison et rend le pluriel מְצוּדוֹת par l’idée de puissantes fortifications, sans produire une expression française artificielle.
- source_word: לְהוֹשִׁיעֵנִי
  choice: pour me sauver
  rationale: L’infinitif de ישׁע exprime ici le but. « Sauver » le distingue légèrement du précédent « délivrer », conformément à la variation lexicale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Les impératifs brefs rendent l’urgence de la prière. Les images concrètes de l’oreille, du rocher et de la maison sont conservées.
