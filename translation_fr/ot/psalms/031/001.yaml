base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: fr
  text: En toi, Yahweh, j’ai trouvé refuge ; que jamais je ne sois déshonoré ! Dans ta justice[a], délivre-moi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dans ta droiture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: En toi
  rationale: Conserve l’image hébraïque du refuge et introduit naturellement celui auprès de qui le psalmiste cherche protection.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: חָסִיתִי
  choice: j’ai trouvé refuge
  rationale: Le parfait exprime un recours établi ; cette formulation garde l’image concrète de l’abri tout en étant naturelle en français.
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: que jamais je ne sois couvert de honte
  rationale: Rend la supplication négative, la portée absolue de לְעוֹלָם et la honte publique ou le déshonneur impliqués par בוש.
- source_word: בְּצִדְקָתְךָ
  choice: Dans ta justice
  rationale: Préserve la construction hébraïque et l’idée que l’action salvatrice de Dieu repose sur sa conformité à ce qui est droit ; « fidélité à ce qui est juste » constitue une nuance contextuelle possible.
- source_word: פַלְּטֵנִי
  choice: délivre-moi
  rationale: Rend avec concision l’impératif intensif appelant une intervention active pour arracher le psalmiste au danger.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin ; sa transcription préserve cette distinction sans le remplacer par un titre.
- issue: Sens de צְדָקָה appliqué à l’action salvatrice de Dieu
  choice: justice
  alternative: fidélité à ce qui est juste
  rationale: « Justice » conserve la notion large de conformité de Dieu à ce qui est droit, sans réduire le terme à la seule justice judiciaire ni imposer une définition confessionnelle.
translation_notes:
  register: Français moderne, digne et direct, avec parallélisme poétique. L’interjection archaïsante « ô » est omise, puisque l’adresse directe est claire. La ponctuation souligne les deux demandes sans alourdir le verset.
