    rationale: צדקה peut désigner la justice, la droiture ou la righteousness selon le contexte, mais la formulation proposée est explicative et interprétative. Elle ne correspond pas non plus à l’alternative documentée dans la piste d’audit anglaise (« justice » pour « righteousness »).
  - severity: low
