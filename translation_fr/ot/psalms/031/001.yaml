review_pass:
  verdict: revise
  source_fidelity: Le rendu conserve correctement l’adresse à Yahweh, l’image du refuge, la prière négative avec sa portée durable, et l’appel à la délivrance fondé sur la צדקה divine. « Couvert de honte » ajoute toutefois l’image de « couvrir », absente de בוש, tandis que la note proposée ne constitue pas une alternative lexicale suffisamment directe à « justice ».
  naturalness: Le français est globalement moderne, fluide et d’un registre poétique approprié. « Que jamais je ne sois déshonoré » exprime plus directement et naturellement l’issue publique de honte/déshonneur que le texte cherche à éviter, sans introduire une métaphore supplémentaire.
  terminology: « Yahweh », « refuge », « justice » et « délivre-moi » sont appropriés. Pour צדקתך, « justice » est une option lexicale valable; « droiture » peut être signalé comme alternative sans imposer une interprétation doctrinale ni paraphraser le terme.
