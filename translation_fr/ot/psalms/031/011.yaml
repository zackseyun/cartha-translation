source:
  edition: WLC
  text: מִ/כָּל צֹרְרַ֨/י הָיִ֪יתִי חֶרְפָּ֡ה וְ/לִ/שֲׁכֵנַ֨/י מְאֹד֮ וּ/פַ֪חַד לִֽ/מְיֻדָּ֫עָ֥/י רֹאַ֥/י בַּ/ח֑וּץ נָדְד֥וּ מִמֶּֽ/נִּי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: fr
  text: À cause de tous mes adversaires, je suis devenu un objet de mépris[a], surtout pour mes voisins, et un sujet d’effroi pour mes connaissances. Ceux qui me voient dans la rue[b] s’enfuient loin de moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « De la part de tous mes adversaires, je suis devenu un objet de mépris » ; certains comprennent la première expression comme une comparaison : « plus que tous mes adversaires ».'
    reason: alternative_reading
  - marker: b
    text: Littéralement « dehors » ; il s’agit ici du fait d’être vu en public.
    reason: cultural_note
  - marker: c
    text: Ou « s’éloignent de moi » ou « s’écartent de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: À cause de tous mes adversaires
  rationale: La préposition מִן peut ici exprimer la cause ou la source. La formulation retenue rend naturellement en français l’idée que les adversaires sont à l’origine de son humiliation, tout en signalant en note les autres analyses possibles.
- source_word: הָיִיתִי חֶרְפָּה
  choice: je suis devenu un objet de mépris
  rationale: La construction avec היה décrit un état résultant qui se prolonge. « Objet de mépris » exprime le fait d’être exposé à la honte et aux railleries sans réduire חֶרְפָּה à un simple sentiment intérieur.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: surtout pour mes voisins
  rationale: מְאֹד intensifie ici la réaction des voisins. « Surtout » est une formulation française naturelle qui marque que l’opprobre est particulièrement vif auprès des personnes vivant à proximité.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: et un sujet d’effroi pour mes connaissances
  rationale: פַּחַד désigne la peur ou l’effroi, tandis que מְיֻדָּעַ désigne une personne connue ou familière, sans impliquer nécessairement une amitié intime.
- source_word: רֹאַי בַּחוּץ
  choice: Ceux qui me voient dans la rue
  rationale: Le participe suffixé signifie « ceux qui me voient ». בַּחוּץ signifie littéralement « dehors », mais évoque ici l’espace public ; « dans la rue » communique clairement cette dimension sociale.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: s’enfuient loin de moi
  rationale: נָדַד peut signifier errer, s’éloigner ou fuir. Dans ce contexte de peur et d’évitement public, « s’enfuient loin de moi » restitue la réaction vive, tout en conservant les possibilités moins fortes en note.
theological_decisions: []
translation_notes:
  register: 'Français international actuel, naturel et digne. Le verset conserve le mouvement du texte hébreu : humiliation sociale, peur des connaissances, puis évitement dans l’espace public. Les termes courants « objet de mépris », « sujet d’effroi » et « dans la rue » privilégient la clarté sans effacer les ambiguïtés signalées en notes.'
