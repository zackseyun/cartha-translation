  yaml_path: translation/ot/psalms/031/016.yaml
  text: Make your face shine on your servant[a]; save me in your steadfast love.
translation:
  language: fr
  text: Fais briller ton visage sur ton serviteur ; sauve-moi par ton amour fidèle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon ton amour fidèle » ou « dans ton amour fidèle ». La préposition hébraïque peut prendre ici plusieurs sens très proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִירָה
  choice: Fais briller
  rationale: L’impératif hiphil de אור a ici une valeur causative. « Fais briller » conserve cette force tout en restant naturel en français.
- source_word: פָנֶיךָ
  choice: ton visage
  rationale: Le sens concret de « visage » est maintenu afin de préserver l’image hébraïque du regard favorable de Dieu, plutôt que de l’aplanir en « présence ».
- source_word: עַל
  choice: sur
  rationale: La préposition indique que la faveur divine se porte vers le serviteur. « Sur » conserve directement l’image de la lumière du visage qui rayonne sur lui.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans le langage de la prière adressée à Dieu, « serviteur » rend naturellement la relation exprimée par עבד sans mettre au premier plan les connotations modernes de l’esclavage.
- source_word: הוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: L’impératif de ישׁע avec suffixe de première personne demande une délivrance. « Sauve-moi » en exprime le sens central et garde à la fois la portée immédiate et la résonance théologique du terme.
- source_word: בְחַסְדֶּךָ
  choice: par ton amour fidèle
  rationale: « Amour fidèle » exprime la loyauté relationnelle durable de חסד. « Par » comprend le préfixe ב dans un sens instrumental naturel en français, sans exclure les nuances voisines indiquées en note.
theological_decisions:
- issue: Traduction de חסד
  choice: amour fidèle
  alternative: bonté ; fidélité ; miséricorde
  rationale: « Amour fidèle » préserve ensemble la bienveillance et la loyauté durable du terme, sans le réduire au seul sentiment ni imposer une formulation confessionnelle particulière.
- issue: Valeur de la préposition ב devant חסד
  choice: par
  alternative: selon ; dans
  rationale: Le sens instrumental convient bien à la demande de salut et donne un français naturel. La préposition hébraïque permet toutefois des nuances étroitement liées, conservées dans la note.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse personnelle de la prière. L’image concrète « fais briller ton visage » est volontairement conservée comme idiome biblique transparent.
