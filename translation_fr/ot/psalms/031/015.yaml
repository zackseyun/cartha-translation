source:
  edition: WLC
  text: בְּ/יָדְ/ךָ֥ עִתֹּתָ֑/י הַצִּ֘ילֵ֤/נִי מִ/יַּד א֝וֹיְבַ֗/י וּ/מֵ/רֹדְפָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/015.yaml
  text: My times are in your hand[a]; rescue me from the hand of my enemies and from my pursuers.
translation:
  language: fr
  text: Mes temps sont dans ta main[a] ; délivre-moi de la main de mes ennemis et de ceux qui me poursuivent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les temps qui me sont fixés » ou « les circonstances de ma vie ». L’expression hébraïque « mes temps » peut désigner largement les périodes et les événements de la vie d’une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: dans ta main
  rationale: Cette formulation conserve l’image hébraïque de la main comme expression de pouvoir et de maîtrise, ainsi que son écho avec « de la main de mes ennemis ».
- source_word: עִתֹּתָי
  choice: mes temps
  rationale: Le pluriel peut désigner les périodes, les moments et les événements qui composent la vie du psalmiste. « Mes temps » en préserve la largeur poétique sans la réduire à « mon destin » ni aux seules circonstances.
- source_word: הַצִּילֵנִי
  choice: délivre-moi
  rationale: Le verbe exprime ici l’action de soustraire quelqu’un à un danger concret. « Délivre-moi » est clair, digne et adapté au contexte d’ennemis qui poursuivent le psalmiste.
- source_word: מִיַּד
  choice: de la main de
  rationale: Le maintien de la métaphore fait ressortir le contraste poétique entre la main de Dieu, où sont les temps du psalmiste, et la main de ses ennemis, dont il demande à être délivré.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Équivalent français direct et naturel du terme désignant les adversaires hostiles.
- source_word: וּמֵרֹדְפָי
  choice: et de ceux qui me poursuivent
  rationale: Cette tournure naturelle rend la forme participiale et conserve l’image concrète de personnes lancées à la poursuite du psalmiste, sans introduire la nuance plus spécialisée de « persécuteurs ».
theological_decisions:
- issue: Portée interprétative de « mes temps »
  choice: Une désignation large des périodes, moments et événements de la vie du psalmiste placés sous l’autorité de Dieu
  alternative: « mon destin », « les temps qui me sont fixés » ou « mes circonstances »
  rationale: L’hébreu reste poétiquement ouvert. Le texte français conserve cette tension au lieu de la résoudre en faveur d’un destin strictement fixé, de moments seulement assignés d’avance ou de simples circonstances.
translation_notes:
  register: Français international moderne, poétique et digne. La tournure inhabituelle mais intelligible « mes temps » est maintenue afin de préserver l’ampleur du terme hébreu et le parallélisme fondé sur l’image répétée de la main.
