id: PSA.31.24
reference: Psalms 31:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חִ֭זְקוּ וְ/יַאֲמֵ֣ץ לְבַבְ/כֶ֑ם כָּל הַ֝/מְיַחֲלִ֗ים לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: fr
  text: Soyez forts, et que votre cœur prenne courage, vous tous qui espérez[a] en Yahvé !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui attendez Yahvé avec confiance ». Le participe hébreu peut exprimer à la fois l’attente et l’espérance.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Soyez forts
  rationale: L’impératif qal pluriel de חזק appelle directement les destinataires à faire preuve de force. « Soyez forts » est bref, naturel et conserve pleinement la valeur exhortative.
- source_word: וְיַאֲמֵץ
  choice: et que … prenne courage
  rationale: L’imparfait hiphil de אמץ prend ici une valeur jussive à la suite de l’impératif. « Que votre cœur prenne courage » rend naturellement en français l’exhortation portant sur le cœur, sans répéter « fort ».
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: לֵבָב désigne ici la personne intérieure, notamment le siège de la volonté et du courage. « Votre cœur » conserve l’image poétique hébraïque et reste transparent en français.
- source_word: כָּל
  choice: vous tous
  rationale: Le quantificateur englobe l’ensemble du groupe interpellé. La tournure « vous tous qui… » est idiomatique en français.
- source_word: הַמְיַחֲלִים
  choice: qui espérez
  rationale: Le participe de יחל exprime une attente confiante et peut se traduire par « espérer » ou « attendre ». « Espérez » communique clairement l’attente confiante envers Dieu; l’autre nuance est conservée en note.
- source_word: לַיהוָה
  choice: en Yahvé
  rationale: Avec יחל, la préposition ל introduit celui vers qui se porte l’attente confiante. En français, « espérer en Yahvé » est la construction naturelle correspondant au sens retenu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » le rend comme nom propre et évite de le remplacer silencieusement par un titre.
- issue: Nuance de l’attente exprimée par יחל
  choice: espérer en Yahvé
  alternative: attendre Yahvé / attendre avec confiance Yahvé
  rationale: Le verbe associe attente et espérance confiante. Le texte principal retient une formulation française naturelle sans exclure l’autre nuance, explicitement signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La formulation conserve la succession des deux exhortations et l’image biblique du cœur, tout en évitant une répétition lourde de « fort ».
