id: PSA.31.22
reference: Psalms 31:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: fr
  text: 'Quant à moi, j’ai dit dans mon affolement[a] : « Je suis retranché de ta vue[b]. » Pourtant, tu as entendu la voix de mes supplications quand j’ai crié vers toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma précipitation ». Le terme hébreu peut évoquer la hâte, l’agitation ou la panique.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « de devant tes yeux ».
    reason: literal_rendering
lexical_decisions:
- source_word: בְחָפְזִי
  choice: dans mon affolement
  rationale: Le terme peut évoquer la précipitation, l’agitation ou la panique. Dans ce contexte de détresse, « affolement » exprime naturellement l’état intérieur du psalmiste sans le réduire à la seule hâte.
- source_word: נִגְרַזְתִּי
  choice: Je suis retranché
  rationale: Le niphal de גזר exprime ici le fait d’être coupé ou écarté. Le présent conserve la vivacité de la parole citée et la perception immédiate du psalmiste.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: de ta vue
  rationale: L’expression signifie littéralement « de devant tes yeux ». « De ta vue » en restitue l’idée en français naturel, tandis que la note conserve l’image concrète de l’hébreu.
- source_word: אָכֵן
  choice: Pourtant
  rationale: Dans le contexte, le mot marque le contraste décisif entre le sentiment d’être exclu du regard de Dieu et le fait que Dieu a réellement entendu.
- source_word: קוֹל תַּחֲנוּנַי
  choice: la voix de mes supplications
  rationale: Cette formulation conserve les deux éléments de l’hébreu, la voix et les demandes instantes de faveur ou de compassion, dans un registre digne et intelligible.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: quand j’ai crié vers toi
  rationale: Le verbe désigne un cri adressé à quelqu’un pour obtenir du secours. En français, le contexte rend suffisamment présente cette nuance sans ajout explicatif dans le texte.
theological_decisions:
- issue: Sentiment d’abandon divin et réalité de l’écoute divine
  choice: Conserver la perception du psalmiste (« Je suis retranché de ta vue »), puis la réalité qui la contredit (« Pourtant, tu as entendu »).
  alternative: 'Interpréter plus directement : « Je pensais que tu m’avais rejeté. »'
  rationale: L’hébreu décrit une expérience de détresse relationnelle sans affirmer explicitement un rejet doctrinal de la part de Dieu. La traduction maintient donc la tension entre la perception humaine et la réponse divine.
translation_notes:
  register: Français international actuel, naturel et digne. « Affolement » rend la détresse émotionnelle du contexte; « supplications » maintient le registre poétique de la prière sans archaïsme excessif.
