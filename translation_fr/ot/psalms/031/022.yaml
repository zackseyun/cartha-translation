  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : parole personnelle formulée dans la détresse, sentiment immédiat d’être retranché hors du regard divin, puis contraste avec l’écoute effective de Dieu. Les temps français (« j’ai dit », « je suis retranché », « tu as entendu ») préservent bien la vivacité du discours rapporté et l’opposition marquée par אָכֵן.'
