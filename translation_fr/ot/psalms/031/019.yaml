    issue: Ajout de « tous » dans « sous les yeux de tous les humains »
    rationale: בְּנֵי אָדָם désigne collectivement les humains, mais n’exprime pas explicitement « tous ». Il convient de ne pas ajouter cette totalité.
  - severity: low
    issue: Présent « tu déploies » pour le parfait פָּעַלְתָּ
    rationale: Le présent français peut être défendable dans une poésie liturgique, mais le parallèle avec « tu as mise en réserve » et les parfaits hébreux est mieux préservé par un parfait.
