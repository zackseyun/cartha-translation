source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: fr
  text: 'Que ta bonté est grande !


    Tu l’as mise en réserve pour ceux qui te craignent,


    et tu l’as accomplie pour ceux qui trouvent refuge en toi,


    sous les yeux des êtres humains[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant les fils d’homme » ; cette expression hébraïque désigne ici les êtres humains collectivement.'
    reason: Précise la forme littérale de בְּנֵי אָדָם et sa portée collective, sans ajouter une notion de totalité.
lexical_decisions:
- source_word: מָה רַב
  choice: Combien est grande
  rationale: La tournure exclamative מָה avec רַב exprime l’émerveillement devant l’ampleur; cette formulation est naturelle et digne en français.
- source_word: טוּבְךָ
  choice: ta bonté
  rationale: טוּב peut désigner la bonté ou les bienfaits. « Ta bonté » conserve ici toute sa portée morale et bienfaisante.
- source_word: צָפַנְתָּ
  choice: tu tiens en réserve
  rationale: Le verbe évoque ce qui est mis de côté et conservé en réserve; cette traduction préserve l’image sans suggérer seulement la dissimulation.
- source_word: לִירֵאֶיךָ
  choice: pour ceux qui te craignent
  rationale: La formule désigne ceux qui vivent dans la crainte révérencielle de Dieu; « te craignent » conserve le langage biblique et sa tension entre respect et crainte.
- source_word: פָּעַלְתָּ
  choice: tu déploies
  rationale: פעל indique que Dieu produit ou accomplit concrètement cette bonté. « Déploies » exprime sa manifestation active et convient au contexte public signalé par נֶגֶד.
- source_word: לַחֹסִים בָּךְ
  choice: envers ceux qui trouvent refuge en toi
  rationale: חסה porte l’image concrète de la recherche d’un abri; « trouvent refuge en toi » est idiomatique et conserve cette métaphore.
- source_word: נֶגֶד
  choice: sous les yeux de
  rationale: Dans ce contexte, נֶגֶד marque la visibilité publique. « Sous les yeux de » rend ce sens plus naturellement que le calque « devant ».
- source_word: בְּנֵי אָדָם
  choice: tous les humains
  rationale: L’expression hébraïque littérale « fils d’Adam/de l’homme » est une désignation collective des êtres humains. « Tous les humains » en communique clairement la valeur représentative en français actuel.
theological_decisions:
- issue: Portée de בְּנֵי אָדָם
  choice: tous les humains
  alternative: les fils d’Adam / les êtres humains
  rationale: Il s’agit d’une expression anthropologique collective, non d’une restriction aux hommes de sexe masculin. La traduction principale en donne le sens, tandis que la note préserve la forme hébraïque.
- issue: Rattachement de נֶגֶד בְּנֵי אָדָם
  choice: la bonté est déployée publiquement sous les yeux des humains
  alternative: ceux qui se réfugient en Dieu le font devant les humains
  rationale: La syntaxe permet une certaine proximité avec « ceux qui trouvent refuge », mais le mouvement parallèle « tenue en réserve » / « accomplie » favorise l’idée que Dieu manifeste publiquement sa bonté. La formulation conserve néanmoins la continuité de la proposition sans sur-explication.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme du vers hébreu est conservé sur quatre lignes; le tutoiement correspond à l’adresse directe du psaume. L’exclamation finale restitue la force de מָה רַב.
