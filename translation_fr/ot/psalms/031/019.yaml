revisions:
- from: 'Combien est grande ta bonté,

    que tu tiens en réserve pour ceux qui te craignent,

    que tu déploies envers ceux qui trouvent refuge en toi,

    sous les yeux de tous les humains[a] !'
  to: 'Que ta bonté est grande !


    Tu l’as mise en réserve pour ceux qui te craignent,


    et tu l’as accomplie pour ceux qui trouvent refuge en toi,


    sous les yeux des êtres humains[a] !'
  rationale: La révision supprime l’ajout interprétatif « tous », restitue plus nettement les parfaits hébreux parallèles et améliore l’idiomaticité de l’exclamation française. Elle conserve l’ambiguïté syntaxique de נֶגֶד בְּנֵי אָדָם, tout en laissant « sous les yeux » suivre la proposition entière, comme dans le texte hébreu.
