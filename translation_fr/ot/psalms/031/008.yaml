  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: fr
  text: et tu ne m’as pas livré au pouvoir de l’ennemi[a] ; tu as placé mes pieds au large[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « dans la main de l’ennemi ».
    reason: lexical_alternative
  - marker: b
    text: L’image d’un espace vaste évoque la liberté, la sécurité et la délivrance loin de l’enfermement ou de la détresse.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: tu ne m’as pas livré
  rationale: Le hiphil de סגר signifie ici remettre quelqu’un au pouvoir d’un autre. « Livré » est naturel, précis et convient au registre poétique.
- source_word: בְּיַד
  choice: au pouvoir de
  rationale: Littéralement « dans la main de », l’expression hébraïque désigne le fait d’être sous l’autorité ou à la merci de quelqu’un. « Au pouvoir de » en restitue clairement le sens en français moderne.
- source_word: אוֹיֵב
  choice: l’ennemi
  rationale: Le singulier sans article a ici une valeur générique ou collective. « L’ennemi » est idiomatique dans le langage des psaumes.
- source_word: הֶעֱמַדְתָּ
  choice: tu as placé
  rationale: Le hiphil de עמד exprime l’action de faire tenir debout ou de placer. « Placé » rend cette action délibérée sans lourdeur.
- source_word: בַמֶּרְחָב
  choice: au large
  rationale: מֶרְחָב évoque un espace vaste et ouvert, opposé à l’enfermement et à la détresse. « Au large » conserve cette image de liberté et de sécurité dans un français poétique naturel.
- source_word: רַגְלָי
  choice: mes pieds
  rationale: Le pluriel hébreu est conservé et suggère une position stable ainsi qu’une liberté de mouvement.
- source_word: וְלֹא
  choice: et… ne… pas
  rationale: La coordination simple avec la ligne précédente est conservée sans introduire une opposition plus forte que celle du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et poétique. Le tour « au large » préserve la métaphore spatiale hébraïque tout en restant naturel ; la note explicite sa portée sans réduire l’image à une seule interprétation.
