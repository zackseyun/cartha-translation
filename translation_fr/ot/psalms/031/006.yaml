  text: שָׂנֵ֗אתִי הַ/שֹּׁמְרִ֥ים הַבְלֵי שָׁ֑וְא וַ֝/אֲנִ֗י אֶל יְהוָ֥ה בָּטָֽחְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/006.yaml
  text: I hate those who keep worthless idols[a], but as for me, I trust in Yahweh.
translation:
  language: fr
  text: Je hais ceux qui s’attachent à des idoles sans valeur[a] ; quant à moi, je mets ma confiance en Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui gardent » ou « observent des vanités mensongères ». L’expression peut aussi désigner des réalités vaines ou illusoires.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Je hais
  rationale: Le qal accompli à la première personne du singulier exprime ici une attitude ferme et durable ; le présent français la rend naturellement.
- source_word: הַשֹּׁמְרִים
  choice: ceux qui s’attachent à
  rationale: Le participe de שׁמר signifie littéralement « ceux qui gardent/observent ». Avec des objets de confiance vains, « s’attachent à » restitue l’idée d’une adhésion persistante sans imposer le seul sens matériel de garder.
- source_word: הַבְלֵי שָׁוְא
  choice: des idoles sans valeur
  rationale: L’expression associe les idées de souffle, vide, inutilité et tromperie. Dans le contraste avec la confiance placée en Yahvé, elle désigne vraisemblablement de faux objets de culte ou de confiance ; la note conserve la formulation plus littérale et son ambiguïté.
- source_word: וַאֲנִי
  choice: quant à moi
  rationale: Le pronom exprimé marque un contraste appuyé avec le groupe mentionné dans la première proposition.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: je mets ma confiance en Yahvé
  rationale: Bien que אֶל signifie « vers », le français emploie idiomatiquement « mettre sa confiance en ». L’accompli exprime ici une confiance établie et actuelle.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » transcrit le nom divin au lieu de le remplacer par un titre.
theological_decisions:
- issue: Référent de הַבְלֵי שָׁוְא
  choice: des idoles sans valeur
  alternative: des vanités trompeuses / des choses vaines et illusoires
  rationale: Le contexte oppose ces réalités à Yahvé comme objet de confiance, ce qui favorise le sens idolâtre. La note signale toutefois que l’hébreu reste plus imagé et moins explicite.
translation_notes:
  register: Français moderne, digne et accessible. « Je hais » conserve la vigueur du texte ; « quant à moi » fait ressortir son contraste. Le point-virgule respecte l’articulation poétique des deux propositions.
