id: PSA.31.7
reference: Psalms 31:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָגִ֥ילָה וְ/אֶשְׂמְחָ֗ה בְּ/חַ֫סְדֶּ֥/ךָ אֲשֶׁ֣ר רָ֭אִיתָ אֶת עָנְיִ֑/י יָ֝דַ֗עְתָּ בְּ/צָר֥וֹת נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/007.yaml
  text: I will rejoice and be glad in your steadfast love[a], because you have seen my affliction; you have known the distresses of my soul.
translation:
  language: fr
  text: Je veux exulter et me réjouir de ton amour fidèle, car tu as vu ma détresse ; tu as connu les angoisses de mon âme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les angoisses de ma vie » ou « les détresses de tout mon être ». Le mot hébreu néfesh peut désigner l’âme, la vie ou la personne elle-même selon le contexte.
    reason: Alternative lexicale pour le terme polysémique נֶפֶשׁ.
lexical_decisions:
- source_word: אָגִילָה
  choice: Je veux exulter
  rationale: Le cohortatif qal à la première personne exprime ici une résolution joyeuse. « Je veux exulter » conserve cette nuance volitive et la force poétique du verbe גיל.
- source_word: וְאֶשְׂמְחָה
  choice: et me réjouir
  rationale: Le second cohortatif, issu de שמח, renforce le premier verbe. Cette formulation préserve le parallélisme sans répétition maladroite.
- source_word: בְּחַסְדֶּךָ
  choice: de ton amour fidèle
  rationale: חסד désigne un amour loyal, constant et engagé. « Amour fidèle » rend naturellement en français sa richesse relationnelle, tandis que la préposition « de » convient à la construction française « se réjouir de ».
- source_word: אֲשֶׁר
  choice: car
  rationale: Dans ce contexte, la particule introduit le motif de la joie. « Car » restitue clairement cette valeur causale dans un registre poétique digne.
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: tu as vu ma détresse
  rationale: Le verbe « voir » conserve l'image hébraïque d'une attention directe, et « détresse » rend ici la souffrance ou l'affliction exprimée par עֳנִי.
- source_word: יָדַעְתָּ
  choice: tu as connu
  rationale: ידע peut exprimer la connaissance, la reconnaissance et l'attention personnelle. « Tu as connu » en préserve l'étendue sans expliciter abusivement la manière dont Dieu a pris connaissance de cette souffrance.
- source_word: בְּצָרוֹת נַפְשִׁי
  choice: les angoisses de mon âme
  rationale: Le pluriel צָרוֹת évoque des situations oppressantes ou des angoisses. נֶפֶשׁ peut désigner l'âme, la vie ou la personne elle-même ; « mon âme » conserve ici la profondeur personnelle et poétique de l'expression, avec une note signalant l'ambiguïté.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans la plainte du psalmiste
  choice: âme
  alternative: vie ; être tout entier
  rationale: « Âme » convient au langage poétique de la plainte et garde la portée intérieure de l'expression, sans imposer nécessairement un dualisme technique entre corps et âme. La note préserve les autres sens contextuellement possibles.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux cohortatifs sont rendus comme une résolution personnelle ; le parallélisme verbal et le pluriel des détresses sont conservés.
