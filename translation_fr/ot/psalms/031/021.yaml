source:
  edition: WLC
  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: fr
  text: Béni soit Yahvé, car il m’a merveilleusement témoigné son amour fidèle dans une ville assiégée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une ville fortifiée » ; l’expression hébraïque peut désigner soit une ville assiégée, soit une ville fortifiée.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif ouvre une exclamation de louange; « Béni soit » en conserve naturellement la force doxologique en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin exprimé directement dans l’hébreu, plutôt que de le remplacer par un titre.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la bénédiction dans un registre soutenu mais courant.
- source_word: הִפְלִיא
  choice: a manifesté … de façon merveilleuse
  rationale: Le hifil de פלא exprime ici une manifestation extraordinaire; cette formulation s’accorde naturellement avec חַסְדּוֹ sans réduire le verbe à une simple intensification.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חסד associe amour, loyauté et constance relationnelle; « amour fidèle » restitue ces dimensions dans un français actuel et intelligible.
- source_word: לִי
  choice: envers moi
  rationale: Indique le bénéficiaire personnel de l’amour manifesté et s’intègre idiomatiquement au verbe français.
- source_word: בְּעִיר מָצוֹר
  choice: dans une ville assiégée
  rationale: מָצוֹר peut évoquer un siège ou une place fortifiée. Le sens « assiégée » convient au contexte de détresse, tandis que l’autre possibilité est conservée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre; la translittération préserve cette référence explicite sans lui substituer un titre.
- issue: Sens de בְּעִיר מָצוֹר
  choice: dans une ville assiégée
  alternative: dans une ville fortifiée
  rationale: La construction hébraïque demeure lexicalement ambiguë. Le texte principal retient le sens contextuellement plausible de siège, et la note préserve explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure doxologique « Béni soit Yahvé » conserve la solennité du psaume; « amour fidèle » évite à la fois l’archaïsme et une précision doctrinale excessive.
