lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Le terme désigne vraisemblablement la personne chargée de diriger l’exécution musicale. « Au chef de chœur » est concis, naturel dans un titre de psaume et rend le préfixe ל comme l’indication d’un destinataire.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et exact pour ce genre de chant, probablement accompagné d’instruments.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, לְ peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « de David » conserve mieux cette latitude que « par David » ou « pour David ».
theological_decisions:
- issue: Nuance du titre davidique
  choice: de David
  alternative: par David ; pour David
  rationale: L’hébreu ne précise pas nécessairement la nature exacte du lien avec David. La formulation retenue préserve cette ambiguïté au lieu d’imposer l’idée d’auteur.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation suit le style bref d’une suscription liturgique et place l’appel de note immédiatement après « David », auquel il se rapporte.
