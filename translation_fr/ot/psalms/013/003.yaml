id: PSA.13.3
reference: Psalms 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַבִּ֣יטָֽ/ה עֲ֭נֵ/נִי יְהוָ֣ה אֱלֹהָ֑/י הָאִ֥ירָ/ה עֵ֝ינַ֗/י פֶּן אִישַׁ֥ן הַ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/003.yaml
  text: Look and answer me[a], O Yahweh my God; give light to my eyes[b], lest I sleep the sleep of death.
translation:
  language: fr
  text: Regarde-moi et réponds-moi, Yahweh, mon Dieu ! Éclaire mes yeux[a], de peur que je ne dorme du sommeil de la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fais briller mes yeux ». L’image hébraïque peut évoquer une vitalité, une lucidité ou une espérance renouvelées.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « de peur que je ne dorme la mort » ; la formulation traditionnelle est « de peur que je ne dorme du sommeil de la mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטָה
  choice: Regarde
  rationale: L’impératif appelle Yahweh à porter son regard attentif sur le psalmiste. « Regarde » reste direct, naturel et concret.
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Dans le contexte de la prière, ענה signifie couramment « répondre ». Cette formulation conserve l’appel personnel sans préciser d’avance la forme de la réponse.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהָי
  choice: mon Dieu
  rationale: Rend directement la forme possessive et la dimension personnelle de l’invocation.
- source_word: הָאִירָה
  choice: Éclaire
  rationale: Le causatif de אור exprime l’action de faire briller ou de donner de la lumière. « Éclaire » est naturel en français et conserve l’image sans la réduire à une explication intellectuelle.
- source_word: עֵינַי
  choice: mes yeux
  rationale: La traduction littérale maintient l’image corporelle hébraïque, susceptible d’évoquer la vitalité, la lucidité ou l’espérance retrouvées.
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Cette tournure française introduit naturellement le résultat redouté et convient au registre solennel de la prière poétique.
- source_word: אִישַׁן
  choice: je ne m’endorme
  rationale: Le verbe exprime ici l’issue redoutée après פֶּן. Le pronominal « s’endormir » est idiomatique en français et conserve la métaphore du sommeil.
- source_word: הַמָּוֶת
  choice: dans la mort
  rationale: Cette formulation suit de près l’expression hébraïque condensée et maintient l’association métaphorique entre sommeil et mort sans ajouter un second nom « sommeil ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. La translittération préserve le nom divin personnel au lieu de lui substituer un titre.
- issue: Image « éclaire mes yeux »
  choice: Conserver la métaphore
  alternative: Rends-moi des forces / redonne-moi espoir
  rationale: L’image peut évoquer la vitalité, la clarté ou l’espérance. La conserver évite d’imposer une seule interprétation.
- issue: Construction אִישַׁן הַמָּוֶת
  choice: je ne m’endorme dans la mort
  alternative: je ne dorme du sommeil de la mort
  rationale: L’hébreu est concis et peut se comprendre littéralement comme « que je ne dorme la mort ». Le choix retenu conserve le lien entre sommeil et mort sans ajouter le substantif « sommeil » absent de la proposition hébraïque.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif et l’exclamation rendent l’intensité de la supplication. Les métaphores des yeux éclairés et de la mort comme sommeil sont maintenues sans paraphrase confessionnelle.
