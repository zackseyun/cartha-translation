  text: Au chef de chœur. Psaume de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David »; dans les titres des psaumes, l’hébreu peut indiquer l’auteur ou un autre lien avec David.
