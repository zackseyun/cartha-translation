lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Chef de chœur » est clair, actuel et adapté au contexte liturgique; le préfixe ל est rendu naturellement par « au ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme de genre courant pour une composition chantée avec accompagnement musical; « psaume » est la désignation française consacrée et exacte dans ce contexte.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, ל peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » reste naturel tout en conservant davantage cette latitude que « écrit par David ».
theological_decisions:
- issue: Valeur de לְדָוִד dans le titre
  choice: de David
  alternative: par David; pour David
  rationale: L’hébreu permet plusieurs rapports à David, dont l’attribution d’auteur, l’association ou la destination. La formulation retenue évite de trancher au-delà de ce qu’indique le titre.
translation_notes:
  register: Titre bref, digne et idiomatique en français international moderne. L’article est omis devant « Psaume », conformément à l’usage naturel des suscriptions bibliques françaises.
