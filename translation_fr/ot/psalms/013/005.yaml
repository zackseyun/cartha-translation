id: PSA.13.5
reference: Psalms 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: fr
  text: Mais moi, j’ai mis ma confiance dans ton amour fidèle ; mon cœur se réjouira de ton salut[a]. Je chanterai pour Yahweh, car il m’a comblé de bienfaits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrance ». Le terme hébreu peut désigner le secours apporté dans une détresse présente aussi bien que le salut dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent ensemble un contraste appuyé avec la plainte précédente. « Mais moi » restitue cette opposition avec naturel.
- source_word: בְּחַסְדְּךָ
  choice: dans ton amour fidèle
  rationale: חֶסֶד désigne ici un amour bienveillant, durable et loyal, souvent lié à l’alliance. « Amour fidèle » en préserve à la fois la dimension affective et la constance.
- source_word: בָטַחְתִּי
  choice: j’ai mis ma confiance
  rationale: Le parfait exprime une confiance établie dont l’effet demeure. Cette formulation française rend clairement l’acte accompli et sa pertinence présente.
- source_word: יָגֵל
  choice: se réjouira
  rationale: L’imparfait hébreu envisage ici la joie à venir en réponse au secours attendu de Dieu.
- source_word: לִבִּי
  choice: mon cœur
  rationale: La traduction directe conserve l’image hébraïque du cœur comme siège de la vie intérieure.
- source_word: בִּישׁוּעָתֶךָ
  choice: de ton salut
  rationale: יְשׁוּעָה peut désigner aussi bien une délivrance concrète qu’un salut de portée plus large. « Salut » maintient cette amplitude, tandis que la préposition française « de » exprime naturellement la cause de la joie.
- source_word: אָשִׁירָה
  choice: Je chanterai
  rationale: La forme cohortative exprime la résolution du psalmiste ; le futur français en rend naturellement l’intention ferme.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition indique le destinataire du chant, et le nom divin יהוה est translittéré « Yahweh » afin de préserver le nom propre présent dans le texte.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison du chant. « Car » convient au registre poétique tout en restant courant.
- source_word: גָמַל עָלָי
  choice: il m’a comblé de bienfaits
  rationale: L’expression décrit la manière généreuse et bénéfique dont Dieu a agi envers le psalmiste. Cette tournure est naturelle en français et évite l’idée trop transactionnelle de récompense.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le Tétragramme. « Yahweh » conserve ici le nom propre de Dieu plutôt que de le remplacer par un titre.
- issue: Portée de יְשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: Le mot hébreu peut évoquer le secours dans la détresse présente comme le salut dans un sens plus large. Le texte retient « salut » sans exclure le sens concret, signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne, avec une légère tenue poétique. Le parallélisme et la progression de la confiance vers la joie puis le chant sont préservés.
