source:
  edition: WLC
  text: פֶּן יֹאמַ֣ר אֹיְבִ֣/י יְכָלְתִּ֑י/ו צָרַ֥/י יָ֝גִ֗ילוּ כִּ֣י אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/004.yaml
  text: lest my enemy say[b][a], “I have overcome him,” and my adversaries rejoice because I am shaken.
translation:
  language: fr
  text: 'de peur que mon ennemi ne dise : « J’ai eu le dessus sur lui[a] ! » et que mes adversaires ne se réjouissent parce que je chancelle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « J’ai prévalu contre lui » ou « Je l’ai vaincu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quand je chancelle » ; le verbe peut aussi se traduire par « je vacille » ou « je suis ébranlé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: de peur que… ne
  rationale: Introduit ce que le psalmiste demande à Dieu d’empêcher. Cette tournure exprime naturellement en français soutenu mais actuel une conséquence redoutée, sans donner au « ne » une valeur négative autonome.
- source_word: יֹאמַר
  choice: dise
  rationale: Rend directement le verbe courant « dire » qui introduit ici un discours rapporté au style direct.
- source_word: אֹיְבִי
  choice: mon ennemi
  rationale: Respecte le nom au singulier avec suffixe de première personne.
- source_word: יְכָלְתִּיו
  choice: Je l’ai emporté sur lui
  rationale: Le verbe יכל peut exprimer le fait de pouvoir, de prévaloir ou de vaincre. « L’emporter sur lui » convient à la vantardise de l’ennemi sans préciser une défaite totale.
- source_word: צָרַי
  choice: mes adversaires
  rationale: Conserve le pluriel et distingue ce groupe de « mon ennemi » au singulier dans la proposition précédente.
- source_word: יָגִילוּ
  choice: se réjouissent
  rationale: Exprime la joie manifeste et triomphante des adversaires dans un français naturel.
- source_word: כִּי
  choice: parce que
  rationale: 'Retient la lecture causale : l’instabilité du psalmiste constitue la raison de la joie de ses adversaires. Le contexte permet aussi une nuance temporelle, signalée en note.'
- source_word: אֶמּוֹט
  choice: je chancelle
  rationale: Le niphal de מוט décrit une perte de stabilité ou un ébranlement. « Chanceler » préserve l’image sans imposer une chute déjà accomplie.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La construction répétée « de peur que… ne… et que… ne » relie les deux conséquences redoutées ; le « ne » y est explétif. Le choix de « chancelle » maintient l’image concrète et existentielle de l’instabilité.
