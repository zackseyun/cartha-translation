source:
  edition: WLC
  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: fr
  text: Jusqu’à quand devrai-je former des projets au fond de moi-même[a], le chagrin au cœur tout le jour ? Jusqu’à quand mon ennemi s’élèvera-t-il au-dessus de moi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jusqu’à quand mettrai-je en moi-même des conseils ? » Le texte évoque une délibération intérieure, peut-être la recherche répétée de plans ou de solutions.
    reason: lexical_alternative
  - marker: b
    text: Ou « prendra-t-il le dessus sur moi ? » ou « triomphera-t-il de moi ? » L’hébreu dit plus littéralement « s’élèvera-t-il au-dessus de moi ? ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Jusqu’à quand
  rationale: Cette formule répétée exprime naturellement en français la durée devenue insupportable de la plainte.
- source_word: אָשִׁית עֵצוֹת
  choice: devrai-je former des projets
  rationale: Le verbe signifie littéralement « mettre, placer » et le nom pluriel peut désigner des conseils, des desseins ou des projets. La formulation retenue exprime l’effort répété de chercher intérieurement une issue sans rendre le français artificiel.
- source_word: בְּנַפְשִׁי
  choice: au fond de moi-même
  rationale: Dans ce contexte, נֶפֶשׁ désigne la personne intérieure. Cette expression française en transmet le sens sans imposer une distinction moderne entre âme et corps.
- source_word: יָגוֹן בִּלְבָבִי
  choice: le chagrin au cœur
  rationale: La tournure française est naturelle et poétique, tout en conservant l’image du cœur comme siège de l’expérience intérieure.
- source_word: יוֹמָם
  choice: tout le jour
  rationale: Cette expression conserve la nuance temporelle diurne et soutenue du terme hébreu, dans un registre poétique actuel.
- source_word: יָרוּם ... עָלָי
  choice: s’élèvera-t-il au-dessus de moi
  rationale: Le choix conserve la métaphore verticale du verbe רום et de la préposition עַל, plutôt que de la remplacer directement par l’idée interprétative de victoire.
- source_word: אֹיְבִי
  choice: mon ennemi
  rationale: Équivalent français direct du nom singulier muni du suffixe de première personne.
theological_decisions: []
