id: PSA.13.1
reference: Psalms 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד אָ֣נָה יְ֭הוָה תִּשְׁכָּחֵ֣/נִי נֶ֑צַח עַד אָ֓נָה תַּסְתִּ֖יר אֶת פָּנֶ֣י/ךָ מִמֶּֽ/נִּי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/001.yaml
  text: How long[a], O Yahweh, will you forget me forever? How long will you hide your face from me?
translation:
  language: fr
  text: Jusqu’à quand, Yahweh, m’oublieras-tu pour toujours ? Jusqu’à quand me cacheras-tu ton visage[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ton visage ». Dans la langue biblique, cacher son visage peut signifier retirer sa présence ou sa faveur.
    reason: Explication de l’idiome hébreu et de ses principales nuances.
lexical_decisions:
- source_word: עַד־אָנָה
  choice: Jusqu’à quand
  rationale: Expression interrogative naturelle en français pour une durée ressentie comme excessive; sa répétition conserve l’insistance de la plainte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française usuelle du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: תִּשְׁכָּחֵנִי
  choice: m’oublieras-tu
  rationale: Le qal inaccompli de שׁכח avec suffixe objet signifie directement « oublier »; le futur interrogatif convient au mouvement de la plainte.
- source_word: נֶצַח
  choice: Pour toujours ?
  rationale: 'Rendu comme une question brève et détachée afin de préserver sa portée potentiellement ambiguë et la force émotionnelle de l’hébreu: le psalmiste demande si cet oubli durera indéfiniment.'
- source_word: תַּסְתִּיר
  choice: me cacheras-tu
  rationale: Le hiphil de סתר avec « ton visage » exprime l’action de cacher ou dérober le visage; cette tournure reste naturelle en français poétique.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Conserve l’image concrète du texte hébreu, sans la réduire dans le corps du verset à son sens figuré de présence ou de faveur.
- source_word: מִמֶּנִּי
  choice: me
  rationale: 'Le pronom français placé avant « cacher » rend idiomatiquement l’idée de séparation exprimée par מִן: « cacher ton visage à/de moi ».'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte porte le nom divin; le translittérer préserve sa fonction de nom propre sans le remplacer par un titre.
- issue: Sens de l’expression « cacher ton visage »
  choice: Conserver « ton visage » dans le texte principal
  alternative: cacher ta présence / retirer ta faveur
  rationale: L’image hébraïque peut évoquer le retrait de la présence ou de la faveur divine, mais la formulation concrète maintient la poésie et évite de trancher entre ces nuances.
- issue: Rapport syntaxique de נֶצַח (« pour toujours »)
  choice: 'Le détacher en question elliptique: « Pour toujours ? »'
  alternative: « m’oublieras-tu pour toujours ? » ou rattachement à la question précédente
  rationale: La position et la portée de נֶצַח produisent une tension rhétorique. La question détachée exprime clairement la plainte sans affirmer que Dieu oublie effectivement pour l’éternité.
translation_notes:
  register: Français moderne, international et digne. La répétition de « Jusqu’à quand » et la question brève « Pour toujours ? » gardent le rythme pressant de la lamentation. L’inversion interrogative soutient le registre poétique sans archaïsme marqué.
