source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: fr
  text: C’est pourquoi les méchants ne pourront pas se tenir debout au jugement[a], ni les pécheurs dans l’assemblée des justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le jugement ». L’hébreu peut évoquer largement le fait d’être mis en jugement, dans l’ordre présent comme lors du jugement final.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans la communauté des justes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette expression introduit la conclusion logique tirée du sort des méchants décrit au verset précédent.
- source_word: יָקֻמוּ
  choice: ne tiendront pas
  rationale: Le verbe קום signifie littéralement « se lever, se tenir debout ». Dans ce contexte judiciaire, « ne tiendront pas » conserve l’image hébraïque et suggère l’incapacité à subsister face au jugement sans en préciser excessivement la portée.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce terme courant de la littérature sapientielle désigne une catégorie morale; « les méchants » en est l’équivalent français direct et naturel.
- source_word: בַּמִּשְׁפָּט
  choice: lors du jugement
  rationale: מִשְׁפָּט peut désigner le jugement, la justice ou une décision judiciaire. « Lors du jugement » rend naturellement la scène judiciaire tout en laissant ouverte la question de son caractère présent ou final.
- source_word: חַטָּאִים
  choice: les pécheurs
  rationale: Le terme désigne des personnes caractérisées par le péché. « Les pécheurs » conserve le parallélisme avec « les méchants ».
- source_word: בַּעֲדַת
  choice: dans l’assemblée de
  rationale: עֵדָה désigne une communauté réunie. « Assemblée » est clair en français moderne et conserve la dimension collective du terme.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: « Les justes » est l’équivalent français biblique, concis et naturel, de cette catégorie morale et relationnelle.
theological_decisions:
- issue: Portée du « jugement »
  choice: Formulation générique « lors du jugement », sans préciser s’il s’agit d’un jugement historique, d’une mise en jugement générale ou du jugement final.
  alternative: Comprendre exclusivement le jugement eschatologique final, ou exclusivement une procédure judiciaire dans l’ordre présent.
  rationale: L’hébreu autorise une portée judiciaire large, et le contexte sapientiel peut faire résonner à la fois la rétribution présente et le jugement ultime. La traduction ne tranche pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme poétique, l’image de personnes qui ne peuvent « tenir » face au jugement et l’ambiguïté temporelle de מִשְׁפָּט.
