id: PSA.1.3
reference: Psalms 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: fr
  text: Il sera comme un arbre planté au bord de cours d’eau, qui donne son fruit en sa saison et dont la feuille ne se flétrit pas. Dans tout ce qu’il fait, il réussit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tout ce qu’il fait réussit. » L’hébreu peut aussi faire de « tout ce qu’il fait » le sujet du dernier verbe.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Il sera
  rationale: Le parfait avec waw prend ici une valeur résultative ou future dans la continuité du portrait de l’homme heureux. « Il sera » rend naturellement cette progression.
- source_word: כְּעֵץ
  choice: comme un arbre
  rationale: Le préfixe כְּ introduit une comparaison, rendue directement et naturellement en français.
- source_word: שָׁתוּל
  choice: planté
  rationale: Le participe passif décrit un arbre établi intentionnellement en un lieu. « Planté » est clair et fidèle sans imposer l’idée plus précise d’une transplantation.
- source_word: עַל פַלְגֵי מָיִם
  choice: au bord de cours d’eau
  rationale: פַלְגֵי désigne des bras, canaux ou cours d’eau. Cette formulation française conserve l’image d’un approvisionnement abondant et régulier sans déterminer s’il s’agit de canaux artificiels ou de ruisseaux naturels.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le relatif renvoie à l’arbre et introduit ses caractéristiques.
- source_word: פִּרְיוֹ יִתֵּן
  choice: donne son fruit
  rationale: Cette traduction suit de près l’expression hébraïque tout en restant idiomatique dans le registre poétique.
- source_word: בְּעִתּוֹ
  choice: en sa saison
  rationale: La formule exprime le moment approprié à la production du fruit et maintient l’image agricole.
- source_word: וְעָלֵהוּ
  choice: et dont la feuille
  rationale: Le singulier collectif hébreu est conservé. La construction avec « dont » relie clairement la feuille à l’arbre en français.
- source_word: לֹא יִבּוֹל
  choice: ne se flétrit pas
  rationale: Le verbe décrit le flétrissement ou le dépérissement de la végétation. « Se flétrir » est précis et naturel ici.
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה
  choice: Dans tout ce qu’il fait
  rationale: Cette formulation conserve la portée globale de כֹל et permet de comprendre l’homme comme sujet repris du dernier verbe, tout en signalant l’autre analyse dans la note.
- source_word: יַצְלִיחַ
  choice: il réussit
  rationale: Le hiphil de צלח exprime ici la réussite ou la prospérité. « Il réussit » garde le personnage principal comme sujet et évite de réduire le sens à la seule prospérité matérielle.
theological_decisions:
- issue: Sujet du dernier verbe יַצְלִיחַ
  choice: '« Dans tout ce qu’il fait, il réussit » : l’homme est compris comme sujet repris du verbe.'
  alternative: '« Tout ce qu’il fait réussit » : l’ensemble de ses actions est compris comme sujet.'
  rationale: La syntaxe hébraïque permet les deux analyses. Le texte principal maintient le regard sur l’homme décrit dans le psaume, tandis que la note préserve l’autre lecture plausible sans résoudre artificiellement l’ambiguïté.
translation_notes:
  register: Français moderne, international et dignifié. La syntaxe reste accessible, avec une légère élévation poétique dans « en sa saison ». Le singulier « la feuille » reproduit l’image collective de l’hébreu, et « cours d’eau » évite de trancher entre canaux aménagés et ruisseaux naturels.
