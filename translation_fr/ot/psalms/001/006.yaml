id: PSA.1.6
reference: Psalms 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: fr
  text: Car Yahvé connaît le chemin des justes[a], mais le chemin des méchants périra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veille sur ». Ici, « connaître » peut impliquer la sollicitude ou l’approbation, et non une simple connaissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde le contraste précédent et conserve naturellement la valeur explicative de la conjonction.
- source_word: יֹדֵעַ
  choice: connaît
  rationale: Rend directement le verbe ידע tout en laissant ouverte sa portée relationnelle, qui peut inclure sollicitude et approbation.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit en français le nom divin יהוה et préserve sa référence personnelle et covenantale.
- source_word: דֶּרֶךְ
  choice: chemin
  rationale: Désigne à la fois la manière de vivre et la destinée qui en résulte; la répétition maintient le parallélisme hébreu.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: L'adjectif pluriel substantivé désigne naturellement en français ceux qui vivent conformément à la justice.
- source_word: וְ
  choice: mais
  rationale: Bien que la conjonction signifie formellement « et », le parallélisme exprime ici un contraste net entre les deux chemins.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Rend la catégorie morale exprimée par l'adjectif pluriel substantivé dans le langage sapientiel.
- source_word: תֹּאבֵד
  choice: mène à la perdition
  rationale: Le verbe אבד signifie périr ou disparaître. Avec « chemin » pour sujet, cette formulation française naturelle exprime l'issue funeste du parcours sans introduire un agent destructeur.
theological_decisions:
- issue: Portée de la « connaissance » de Yahvé
  choice: Le texte principal conserve « connaît », avec une note signalant la dimension possible de sollicitude et d'approbation.
  alternative: Yahvé veille sur le chemin des justes.
  rationale: Le verbe hébreu peut désigner davantage qu'une simple connaissance intellectuelle dans un contexte relationnel, mais traduire directement par « veille sur » trancherait une nuance que le texte laisse implicite.
- issue: Destin du chemin des méchants
  choice: « mène à la perdition » exprime la disparition ou la ruine du chemin comme son aboutissement.
  alternative: « périra » reproduirait plus formellement le verbe appliqué au chemin.
  rationale: Le sujet grammatical demeure le chemin; la formulation choisie évite toutefois en français l'image peu naturelle d'un chemin qui « périt », sans préciser au-delà du texte la nature exacte de la perdition.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « chemin » préserve le parallélisme du verset; « Yahvé » rend explicitement le nom divin.
