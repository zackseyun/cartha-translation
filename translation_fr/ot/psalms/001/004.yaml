  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: fr
  text: 'Il n’en va pas ainsi des méchants : ils sont plutôt comme la paille que le vent emporte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « disperse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Il n’en va pas ainsi
  rationale: Cette tournure conserve la négation abrupte et le contraste elliptique avec le juste du verset précédent, tout en étant naturelle en français moderne.
- source_word: הָרְשָׁעִים
  choice: des méchants
  rationale: « Les méchants » est le rendu courant en littérature sapientielle pour les personnes caractérisées par leur conduite mauvaise, sans réduire le terme à une culpabilité juridique.
- source_word: כִּי אִם
  choice: plutôt
  rationale: 'Le groupe introduit une forte opposition corrective : contrairement au juste comparable à un arbre, les méchants ressemblent à la paille.'
- source_word: כַּמֹּץ
  choice: comme la paille
  rationale: מֹץ désigne les résidus légers séparés du grain lors du vannage. En français biblique courant, « la paille » exprime naturellement cette image agricole; « la menue paille » serait plus précis mais moins actuel.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif français introduit simplement la proposition décrivant ce que le vent fait à la paille.
- source_word: תִּדְּפֶנּוּ
  choice: emporte
  rationale: Le verbe נדף évoque ce qui est chassé ou entraîné par le vent. « Emporte » restitue cette action avec naturel et vigueur en français.
- source_word: רוּחַ
  choice: le vent
  rationale: Dans l’image concrète du vannage, le sens requis est « vent », et non « souffle » ou « esprit ».
