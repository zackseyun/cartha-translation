  text: כִּ֤י אִ֥ם בְּ/תוֹרַ֥ת יְהוָ֗ה חֶ֫פְצ֥/וֹ וּֽ/בְ/תוֹרָת֥/וֹ יֶהְגֶּ֗ה יוֹמָ֥ם וָ/לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: fr
  text: Mais il prend plaisir à la loi de Yahweh[a], et il médite[b] sur sa loi jour et nuit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’enseignement de Yahweh » .
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu peut aussi évoquer le fait de murmurer ou de réciter à voix basse en méditant.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: Après les négations du verset 1, la locution introduit un contraste exclusif. « Mais » est naturel en français et maintient l’opposition.
- source_word: בְּתוֹרַת
  choice: à la loi de
  rationale: תּוֹרָה peut désigner plus largement une instruction, mais « loi » conserve ici la portée scripturaire et liée à l’alliance; l’autre sens est signalé en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: חֶפְצוֹ
  choice: il prend plaisir
  rationale: Cette tournure française exprime naturellement l’attachement affectif et le plaisir évoqués par חֵפֶץ.
- source_word: וּבְתוֹרָתוֹ
  choice: et il médite sa loi
  rationale: Le suffixe renvoie le plus naturellement à Yahweh. « Sa loi » reprend le nom comme l’hébreu, tandis que la syntaxe française n’exige pas de rendre séparément la préposition בְּ devant « méditer ».
- source_word: יֶהְגֶּה
  choice: il médite
  rationale: Le verbe désigne ici une réflexion soutenue, tout en pouvant évoquer une récitation à voix basse; cette nuance est conservée en note.
- source_word: יוֹמָם וָלָיְלָה
  choice: jour et nuit
  rationale: Cette expression directe préserve le mérisme hébreu et son rythme poétique.
theological_decisions:
- issue: Sens de תּוֹרָה dans un psaume de sagesse
  choice: loi
  alternative: enseignement
  rationale: « Loi » conserve la dimension scripturaire et liée à l’alliance sans exclure le sens plus large d’enseignement, indiqué en note.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La transcription préserve dans le texte le nom personnel divin employé en hébreu.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le contraste avec le verset précédent, la répétition de « loi » et le rythme « jour et nuit ».
