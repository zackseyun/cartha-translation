source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: fr
  text: 'Heureux l’homme[a]

    qui ne marche pas selon le conseil des méchants,

    qui ne se tient pas sur le chemin des pécheurs

    et qui ne s’assied pas au siège des moqueurs[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu traduit par « l’homme » est masculin singulier, mais il représente ici de façon générale la personne juste exemplaire, et non uniquement les hommes.
    reason: cultural_note
  - marker: b
    text: 'Ou : « dans l’assemblée des moqueurs ». Le terme hébreu désigne un siège, un lieu où l’on s’assied, ou par extension un cercle réuni.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule hébraïque introduit une béatitude et déclare la condition enviable et favorisée de la personne décrite. « Heureux » est naturel en français biblique moderne sans se limiter ici à une émotion passagère.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le nom hébreu est masculin singulier et présente ici une figure exemplaire à portée générale. Le français conserve cette forme tout en précisant sa portée dans une note.
- source_word: הָלַךְ בַּעֲצַת
  choice: suit les conseils
  rationale: Cette formulation française naturelle exprime le fait de régler sa conduite sur les conseils reçus. Le déplacement concret de « marcher » reste perceptible dans la progression poétique grâce à « chemin », « s’arrête » et « s’assied ».
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Rend directement les personnes caractérisées par leur conduite coupable, sans ajouter une nuance religieuse plus étroite.
- source_word: דֶרֶךְ חַטָּאִים
  choice: le chemin des pécheurs
  rationale: Conserve l’image sapientielle du chemin, qui peut désigner à la fois une voie et une manière de vivre.
- source_word: עָמָד
  choice: s’arrête
  rationale: Dans le contexte d’un chemin, le verbe décrit naturellement le fait de s’y tenir ou de s’y arrêter et marque une progression vers une association plus stable.
- source_word: מוֹשַׁב לֵצִים
  choice: parmi les moqueurs
  rationale: מוֹשָׁב peut désigner un siège, un lieu où l’on s’assied ou un groupe assemblé. « Parmi » rend naturellement en français l’intégration au cercle des moqueurs sans imposer l’image peu idiomatique de « siège des moqueurs ».
- source_word: יָשָׁב
  choice: s’assied
  rationale: Préserve l’image concrète qui clôt la progression allant du mouvement à l’arrêt, puis à l’installation.
theological_decisions:
- issue: Masculin singulier générique dans la littérature de sagesse
  choice: l’homme
  alternative: la personne ; celui
  rationale: Le texte hébreu emploie un nom masculin singulier pour présenter la figure exemplaire du juste. La traduction maintient cette forme grammaticale tout en signalant que la portée n’est pas limitée aux hommes.
- issue: Nature de la béatitude אַשְׁרֵי
  choice: Heureux
  alternative: Béni ; Quel bonheur pour
  rationale: « Heureux » correspond à la formule française traditionnelle et naturelle de béatitude. Il décrit ici une condition profondément favorable, et non un simple sentiment subjectif.
- issue: Sens de מוֹשַׁב
  choice: parmi les moqueurs
  alternative: sur le siège des moqueurs ; dans l’assemblée des moqueurs
  rationale: Le nom permet une image de siège ou le sens d’un lieu ou cercle où l’on demeure. « Parmi » préserve l’idée centrale d’une association installée tout en gardant l’ambiguïté précise dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Les trois propositions parallèles et la progression de l’engagement — suivre, s’arrêter, s’asseoir — sont conservées. « Moqueurs » est plus courant aujourd’hui que « railleurs » et correspond au vocabulaire de la sagesse.
