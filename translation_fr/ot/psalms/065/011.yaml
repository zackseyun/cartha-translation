  text: עִ֭טַּרְתָּ שְׁנַ֣ת טוֹבָתֶ֑/ךָ וּ֝/מַעְגָּלֶ֗י/ךָ יִרְעֲפ֥וּ/ן דָּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/011.yaml
  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: fr
  text: Tu couronnes l’année de ta bonté, et tes sentiers[a] ruissellent d’abondance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes traces » ; le terme hébreu peut évoquer le parcours de Dieu, qui laisse derrière lui la fertilité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « graisse », image hébraïque de richesse, de fertilité et de provision généreuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Tu couronnes
  rationale: Le verbe signifie couronner, entourer ou orner. « Tu couronnes » conserve la métaphore vive de l’hébreu; le présent poétique est naturel en français dans ce contexte de louange.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: l’année de tes bienfaits
  rationale: La construction hébraïque peut se comprendre littéralement comme « l’année de ta bonté ». « De tes bienfaits » exprime naturellement en français la bonté généreuse de Dieu dans ce contexte de fécondité agricole, sans réduire l’image à la seule récolte.
- source_word: וּמַעְגָּלֶיךָ
  choice: et tes chemins
  rationale: מַעְגָּל désigne un chemin, une piste, une trace ou un parcours. « Tes chemins » reste clair et digne, tout en laissant percevoir l’image du passage de Dieu à travers le pays.
- source_word: יִרְעֲפוּן
  choice: ruissellent
  rationale: Le verbe évoque ce qui dégoutte, distille ou coule en abondance. « Ruissellent » restitue l’image concrète dans un français poétique et actuel.
- source_word: דָּשֶׁן
  choice: d’abondance
  rationale: Le nom désigne littéralement la graisse, puis, par image, la richesse, la fertilité et une provision généreuse. « Abondance » communique clairement ce sens dérivé en français moderne.
theological_decisions:
- issue: Préserver l’image de la bénédiction divine sans la réduire à une explication agricole
  choice: Maintenir l’image de Dieu qui couronne l’année et dont les chemins ruissellent d’abondance
  alternative: 'Paraphraser: « Tu bénis abondamment l’année et donnes une récolte généreuse »'
  rationale: Le texte attribue à Dieu la fertilité et la profusion, mais le fait au moyen d’images poétiques. Les conserver respecte le sens du texte et sa tension entre la bonté divine en général et ses effets concrets sur la terre.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement suit l’adresse directe à Dieu. « Ruissellent d’abondance » garde la force de l’image tout en évitant le littéralisme potentiellement trompeur de « graisse ».
