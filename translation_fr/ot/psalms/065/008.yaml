id: PSA.65.8
reference: Psalms 65:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּ֤ירְא֨וּ יֹשְׁבֵ֣י קְ֭צָוֺת מֵ/אוֹתֹתֶ֑י/ךָ מ֤וֹצָֽאֵי בֹ֖קֶר וָ/עֶ֣רֶב תַּרְנִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/008.yaml
  text: Those who dwell at the ends of the earth fear because of your signs[b][a]; you make the dawn and the evening shout for joy.
translation:
  language: fr
  text: Aux extrémités du monde, les habitants sont saisis de crainte devant tes signes[a] ; tu fais crier de joie les lieux d’où paraissent le matin et le soir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éprouvent de la crainte à cause de tes signes ». Le verbe hébreu peut exprimer la peur, l’effroi ou une crainte révérencielle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « les sorties du matin et du soir ». Cette expression poétique peut désigner l’aube et le crépuscule, ou les lieux d’où ils semblent surgir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: sont saisis de crainte
  rationale: Le verbe ירא peut exprimer la peur, l’effroi ou une crainte révérencielle. Cette formulation française conserve cette amplitude sans réduire la réaction à la terreur ni à la seule admiration religieuse.
- source_word: יֹשְׁבֵי קְצָוֺת
  choice: les habitants des terres lointaines
  rationale: L’expression désigne littéralement ceux qui habitent les extrémités, c’est-à-dire les régions les plus reculées du monde. La formulation choisie est naturelle en français moderne.
- source_word: מֵאוֹתֹתֶיךָ
  choice: devant tes signes
  rationale: Après un verbe de crainte, מִן peut marquer la cause. « Devant » exprime ici la réaction provoquée par les signes de Dieu tout en restant idiomatique.
- source_word: אוֹתֹתֶיךָ
  choice: tes signes
  rationale: אוֹת désigne directement un signe manifestant ou attestant la puissance divine. « Prodiges » accentuerait davantage le caractère merveilleux.
- source_word: מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: les lieux d’où paraissent le matin et le soir
  rationale: מוֹצָאֵי signifie littéralement « sorties » ou « lieux d’émergence ». La traduction conserve l’image spatiale et poétique, susceptible d’évoquer les horizons où apparaissent matin et soir.
- source_word: תַּרְנִין
  choice: tu fais crier de joie
  rationale: La forme causative du verbe רנן signifie faire pousser des cris joyeux ou faire chanter de joie. Cette traduction garde le causatif et la vigueur de l’image.
theological_decisions:
- issue: Nature de la réaction aux signes de Dieu
  choice: « sont saisis de crainte » sans préciser s’il s’agit de peur ou de révérence
  alternative: « sont remplis d’admiration » ou « sont terrifiés »
  rationale: Le verbe hébreu peut désigner aussi bien l’effroi que la crainte révérencielle ; la traduction préserve cette tension.
- issue: Interprétation de מוֹצָאֵי בֹקֶר וָעֶרֶב
  choice: conserver l’image des lieux d’où paraissent le matin et le soir
  alternative: « l’aube et le crépuscule » comme simple mérisme temporel
  rationale: Le substantif מוֹצָאֵי garde une dimension d’émergence ou de sortie. La formulation retenue évite de trancher entièrement entre horizons géographiques et moments de la journée.
translation_notes:
  register: Français international moderne, poétique et digne. « Terres lointaines » rend naturellement l’idée des extrémités du monde ; « crier de joie » conserve la personnification vigoureuse du texte hébreu.
