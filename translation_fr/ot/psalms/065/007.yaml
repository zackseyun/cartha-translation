  text: מַשְׁבִּ֤יחַ שְׁא֣וֹן יַ֭מִּים שְׁא֥וֹן גַּלֵּי/הֶ֗ם וַ/הֲמ֥וֹן לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/007.yaml
  text: stilling the roar of the seas[a], the roar of their waves[b], and the tumult of the peoples.
translation:
  language: fr
  text: lui qui apaise[a] le fracas des mers, le fracas de leurs vagues, et le tumulte[b] des peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « calme » ou « réduit au silence » au lieu de « apaise ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’agitation bruyante des peuples »; le terme hébreu peut désigner une commotion sonore et, dans certains contextes, une multitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: apaise
  rationale: Le participe hiphil exprime ici l’action de faire cesser ou retomber le bruit. « apaise » est naturel en français, convient aux mers comme aux peuples et maintient la forme descriptive en continuité avec le contexte.
- source_word: שְׁאוֹן
  choice: fracas
  rationale: Le nom évoque un bruit puissant et tumultueux. « fracas » restitue l’image sonore des mers et des vagues; sa répétition préserve celle de l’hébreu.
- source_word: יַמִּים
  choice: les mers
  rationale: Le pluriel hébreu est conservé et évoque poétiquement l’ensemble des grandes étendues d’eau.
- source_word: גַּלֵּיהֶם
  choice: leurs vagues
  rationale: Le suffixe masculin pluriel renvoie naturellement aux « mers » et conserve le lien pronominal de l’hébreu.
- source_word: הֲמוֹן
  choice: tumulte
  rationale: Dans le parallélisme avec le fracas des mers, le terme désigne surtout une agitation bruyante, tout en pouvant aussi évoquer une multitude.
- source_word: לְאֻמִּים
  choice: des peuples
  rationale: « peuples » rend le pluriel collectif sans imposer l’idée moderne d’États-nations.
theological_decisions:
- issue: Portée du parallèle entre le désordre naturel et l’agitation humaine
  choice: Dieu apaise à la fois le fracas des mers et le tumulte des peuples.
  alternative: Comprendre le verset soit comme limité aux phénomènes naturels, soit comme une affirmation politique plus précise sur la soumission des nations.
  rationale: Le parallélisme hébreu associe explicitement les mers, leurs vagues et les peuples. La formulation conserve cette ampleur poétique sans lui imposer un cadre politique ou eschatologique particulier.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise exacte de « le fracas » reproduit la répétition hébraïque; « lui qui apaise » conserve la valeur participiale et le lien syntaxique avec le contexte du psaume.
