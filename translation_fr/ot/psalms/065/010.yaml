source:
  edition: WLC
  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: fr
  text: Tu abreuves ses sillons, tu aplanis ses billons. Par des averses, tu l’ameublis ; tu bénis sa végétation.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּלָמֶיהָ
  choice: ses sillons
  rationale: Le nom désigne les sillons d’un champ ; le possessif renvoie à la terre évoquée dans le contexte.
- source_word: רַוֵּה
  choice: tu abreuves
  rationale: L’impératif poétique employé avec une valeur descriptive exprime une irrigation généreuse ; « abreuver » est naturel en français pour une terre ou des sillons.
- source_word: נַחֵת גְּדוּדֶיהָ
  choice: tu aplanis ses mottes
  rationale: נחת peut évoquer l’action d’abaisser ou de faire se tasser, tandis que גְּדוּדִים désigne ici vraisemblablement les reliefs ou mottes entre les sillons. La traduction restitue l’image agricole sans reprendre le sens militaire courant du nom.
- source_word: בִּרְבִיבִים
  choice: par des pluies abondantes
  rationale: Le terme désigne des ondées ou averses abondantes qui imbibent le sol.
- source_word: תְּמֹגְגֶנָּה
  choice: tu détrempes la terre
  rationale: La forme exprime le fait de faire fondre, se dissoudre ou s’amollir ; dans ce contexte, elle décrit le sol rendu meuble et gorgé d’eau. « La terre » explicite le pronom féminin dont l’antécédent contextuel est le sol.
- source_word: צִמְחָהּ
  choice: ce qu’elle fait pousser
  rationale: Le nom peut désigner la pousse, la végétation ou la production du sol. Cette formulation conserve à la fois l’idée de croissance et celle du produit de la terre.
- source_word: תְּבָרֵךְ
  choice: tu bénis
  rationale: Traduction directe du verbe ברך, qui attribue à Dieu la prospérité de la croissance.
theological_decisions:
- issue: La bénédiction divine et les processus agricoles
  choice: Conserver l’action directe de Dieu dans chaque proposition
  alternative: Présenter seulement les pluies comme causes naturelles
  rationale: Le verset attribue explicitement à Dieu l’irrigation, l’assouplissement du sol et la bénédiction de sa croissance, sans opposer action divine et moyens naturels.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme hébreu est conservé en quatre propositions. « Mottes » rend concrètement les reliefs du terrain, et « détrempes » traduit l’assouplissement du sol par l’eau sans suggérer sa destruction.
