- from: Tu abreuves ses sillons, tu aplanis ses mottes. Par des pluies abondantes, tu détrempes la terre ; tu bénis ce qu’elle fait pousser.
  to: Tu abreuves ses sillons, tu aplanis ses billons. Par des averses, tu l’ameublis ; tu bénis sa végétation.
  rationale: La révision conserve les quatre actions divines et le parallélisme du texte hébreu. Elle remplace une formulation susceptible de décrire un sol excessivement imbibé par le sens contextuel d’un sol rendu meuble par les pluies, et précise l’image des reliefs labourés.
