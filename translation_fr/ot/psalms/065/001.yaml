  source_fidelity: 'Le texte principal conserve les éléments essentiels de l’hébreu : l’ellipse poétique associant « silence » et « louange », l’adresse à Dieu, le cadre de Sion et l’accomplissement futur d’un vœu. Toutefois, « envers toi un vœu sera accompli » ne rend pas naturellement en français la relation exprimée par לְךָ et affaiblit la lisibilité de la seconde proposition.'
