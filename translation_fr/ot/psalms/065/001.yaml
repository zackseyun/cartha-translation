  text: לְ/ךָ֤ דֻֽמִיָּ֬ה תְהִלָּ֓ה אֱלֹ֘הִ֥ים בְּ/צִיּ֑וֹן וּ֝/לְ/ךָ֗ יְשֻׁלַּם נֶֽדֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/001.yaml
  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: fr
  text: Pour toi, le silence est une louange, ô Dieu, dans Sion[a], et un vœu sera accompli pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La louange t’attend dans le silence, ô Dieu, dans Sion », ou : « À toi appartient la louange silencieuse, ô Dieu, dans Sion. » L’expression hébraïque est elliptique et peut être comprise de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: le silence
  rationale: Le nom désigne couramment le silence ou le calme. Le conserver comme substantif préserve l’expression saisissante et condensée de l’hébreu.
- source_word: תְהִלָּה
  choice: louange
  rationale: C’est le sens ordinaire du terme. La proposition sans verbe rapproche directement « silence » et « louange ».
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Pour toi, le silence est louange
  rationale: Cette formulation maintient les deux substantifs et la force paradoxale du texte sans ajouter un verbe tel que « attend », absent du texte consonantique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: La forme désigne ici le Dieu unique d’Israël.
- source_word: בְּצִיּוֹן
  choice: dans Sion
  rationale: La préposition בְּ a ici son sens locatif naturel. « Dans Sion » conserve directement cette valeur.
- source_word: יְשֻׁלַּם
  choice: sera accompli
  rationale: Le pual de שלם indique que le vœu sera acquitté ou mené à son accomplissement. En français, « accomplir un vœu » exprime naturellement l’exécution de ce qui a été promis.
- source_word: נֶדֶר
  choice: un vœu
  rationale: Le terme désigne une promesse solennelle faite à Dieu; « vœu » en est l’équivalent français direct.
theological_decisions:
- issue: Interprétation de l’expression elliptique לְךָ דֻמִיָּה תְהִלָּה
  choice: Le silence lui-même est présenté comme une louange adressée à Dieu.
  alternative: « La louange t’attend dans le silence, ô Dieu, dans Sion » ou « À toi appartient la louange silencieuse, ô Dieu, dans Sion ».
  rationale: L’hébreu ne comporte aucun verbe explicite et admet plusieurs analyses. La traduction principale conserve la tension poétique au lieu de la résoudre par une paraphrase interprétative.
translation_notes:
  register: Français moderne, international et digne. La formulation conserve la concision et le paradoxe de l’hébreu. L’apostrophe « ô Dieu » maintient le registre poétique biblique sans archaïsme excessif.
