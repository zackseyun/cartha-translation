  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: fr
  text: Au chef de chœur[a]. Psaume de David[b] ; chant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au directeur musical ». Le sens précis du terme hébreu employé dans les titres des psaumes est incertain.
    reason: alternative_reading
  - marker: b
    text: L’expression hébraïque traduite par « de David » peut indiquer l’auteur, l’appartenance, la dédicace ou une association avec David.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, ce terme désigne conventionnellement la personne chargée de diriger l’exécution musicale. « Chef de chœur » est une formulation française naturelle, tandis que la préposition ל est rendue par « au ».
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Ce nom est le terme habituel pour une composition chantée avec accompagnement musical et, dans ce titre, « psaume » en est l’équivalent français établi.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, la préposition ל peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » conserve mieux cette latitude que « par David » ou « pour David ».
- source_word: שִׁיר
  choice: chant
  rationale: Ce terme est distinct de מִזְמוֹר. Le rendre séparément par « chant » préserve les deux désignations présentes dans le titre hébreu.
theological_decisions:
- issue: Rapport du psaume à David
  choice: de David
  alternative: par David / pour David
  rationale: Le titre hébreu ne détermine pas à lui seul si David est l’auteur, le destinataire ou la figure à laquelle le psaume est associé ; la traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la brièveté nominale du titre hébreu ainsi que la distinction entre « psaume » et « chant ». Le point-virgule relie les deux désignations sans les confondre.
