id: PSA.65.2
reference: Psalms 65:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שֹׁמֵ֥עַ תְּפִלָּ֑ה עָ֝דֶ֗י/ךָ כָּל בָּשָׂ֥ר יָבֹֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/002.yaml
  text: O you who hear prayer[a], to you all flesh will come.
translation:
  language: fr
  text: Toi qui écoutes la prière, toute chair[a] viendra à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « tous les êtres humains » ou « l’humanité entière ». Littéralement : « toute chair », expression poétique désignant ici l’ensemble de l’humanité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: qui écoutes
  rationale: Le participe qal, employé comme désignation vocative de Dieu, se rend naturellement en français par une proposition relative tout en conservant l’idée d’une écoute constante.
- source_word: תְּפִלָּה
  choice: la prière
  rationale: 'Le singulier a ici une valeur générique : il désigne la prière comme réalité ou pratique, et non une prière particulière.'
- source_word: עָדֶיךָ
  choice: à toi
  rationale: Avec le verbe de mouvement qui suit, cette expression indique la direction vers le destinataire.
- source_word: כָּל בָּשָׂר
  choice: toute chair
  rationale: Cette expression poétique désigne l’ensemble des êtres humains. La formulation littérale reste intelligible en français biblique et préserve l’ampleur ainsi que l’image du texte hébreu.
- source_word: יָבֹאוּ
  choice: viendra
  rationale: L’imparfait hébreu exprime ici une venue envisagée dans l’avenir. En français, le sujet collectif singulier « toute chair » commande le singulier « viendra ».
theological_decisions:
- issue: Portée de כָּל בָּשָׂר
  choice: Portée universelle exprimée par « toute chair »
  alternative: « tous les êtres humains » ou « l’humanité entière »
  rationale: L’expression vise largement l’humanité qui vient à Dieu. La conserver évite de réduire cette portée universelle et maintient la force poétique de l’hébreu.
translation_notes:
  register: Français moderne, sobre et poétique. L’apostrophe « Toi qui… » restitue le vocatif hébreu; « toute chair » conserve une tournure biblique encore compréhensible, explicitée en note.
