  text: who establishes the mountains by his power[a], being girded with might.
translation:
  language: fr
  text: 'lui qui affermit les montagnes par sa puissance,

    ceint de force.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui qui affermit les montagnes par sa force, ceint de puissance » parmi d’autres combinaisons possibles de ces deux termes proches.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵכִין
  choice: affermit
  rationale: Le participe hiphil de כון exprime le fait de rendre ferme ou stable. « Affermit » convient naturellement aux montagnes et conserve l’idée d’une action caractéristique de Dieu sans préciser indûment le mode de leur création.
- source_word: הָרִים
  choice: les montagnes
  rationale: הָרִים désigne directement les montagnes; l’article est rendu naturellement en français.
- source_word: בְּכֹחוֹ
  choice: par sa puissance
  rationale: כֹּחַ peut signifier force ou puissance. « Par sa puissance » rend ici le beth instrumental et indique le moyen par lequel Dieu affermit les montagnes.
- source_word: נֶאְזָר
  choice: ceint
  rationale: Le participe niphal de אזר décrit celui qui est ceint ou équipé. « Ceint » conserve l’image corporelle et poétique sans la réduire à une qualité abstraite.
- source_word: בִּגְבוּרָה
  choice: de force
  rationale: גְּבוּרָה désigne la force ou la puissance. Après « ceint », « de force » est idiomatique et préserve la métaphore tout en évitant de répéter « puissance ».
theological_decisions:
- issue: Rapport entre les deux participes
  choice: 'Conserver deux descriptions participiales de Dieu : « lui qui affermit… ceint… »'
  alternative: 'Employer deux propositions relatives : « lui qui affermit… qui est ceint… »'
  rationale: L’hébreu enchaîne deux participes décrivant l’action caractéristique de Dieu et sa puissance. La formulation française retenue maintient cette continuité poétique sans imposer une relation logique supplémentaire.
- issue: Métaphore de la force divine
  choice: Préserver l’image « ceint de force »
  alternative: Expliciter par « armé de puissance » ou abstraire par « plein de force »
  rationale: Le texte présente la puissance divine au moyen de l’image de la ceinture. La conserver respecte la poésie et évite une interprétation doctrinale plus précise que l’hébreu.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. « Ceint » est un terme littéraire encore intelligible, retenu pour préserver la métaphore hébraïque; le parallélisme « puissance / force » distingue les deux noms hébreux sans exagérer leur différence sémantique.
