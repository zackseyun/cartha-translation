source:
  edition: WLC
  text: לָבְשׁ֬וּ כָרִ֨ים הַ/צֹּ֗אן וַ/עֲמָקִ֥ים יַֽעַטְפוּ בָ֑ר יִ֝תְרוֹעֲע֗וּ אַף יָשִֽׁירוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/013.yaml
  text: The pastures are clothed with flocks[a], and the valleys wrap themselves in grain; they shout for joy, yes[b], they sing.
translation:
  language: fr
  text: 'Les prairies se revêtent de troupeaux[a],

    et les vallées se couvrent de céréales ;

    ils poussent des cris de joie, oui, ils chantent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les pâturages se revêtent de troupeaux ». Dans ce contexte, le nom hébreu peut désigner des prairies ou des pâturages.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָבְשׁוּ
  choice: se revêtent
  rationale: Le verbe signifie littéralement « se vêtir, revêtir ». La forme pronominale conserve naturellement en français la métaphore active du paysage qui prend les troupeaux pour vêtement.
- source_word: כָרִים
  choice: pâturages
  rationale: Dans le parallélisme avec les vallées et en association avec le petit bétail, le terme désigne ici vraisemblablement des terres de pâture ou des prairies plutôt que des béliers.
- source_word: הַצֹּאן
  choice: troupeaux
  rationale: Le nom collectif désigne le petit bétail, notamment les moutons et les chèvres. Le pluriel français convient à l’image de pâturages couverts de troupeaux.
- source_word: וַעֲמָקִים
  choice: et les vallées
  rationale: Équivalent direct et naturel du pluriel hébreu, qui maintient le parallélisme du paysage.
- source_word: יַעַטְפוּ
  choice: se couvrent
  rationale: Le verbe exprime l’action d’envelopper ou de couvrir. « Se couvrent » préserve la personnification active tout en restant idiomatique en français.
- source_word: בָר
  choice: blé
  rationale: Le terme désigne du grain ou des céréales. « Blé » est ici un terme poétique courant en français, sans imposer nécessairement une espèce botanique précise dans l’usage littéraire.
- source_word: יִתְרוֹעֲעוּ
  choice: ils poussent des cris de joie
  rationale: Le verbe évoque un cri retentissant, ici manifestement joyeux d’après le contexte hymnique et son parallélisme avec le chant.
- source_word: אַף
  choice: oui
  rationale: La particule renforce et prolonge la première proposition ; « oui » rend avec naturel cette progression emphatique.
- source_word: יָשִׁירוּ
  choice: ils chantent
  rationale: Traduction simple du verbe « chanter », qui garde la force du parallélisme culminant après les cris de joie.
theological_decisions: []
