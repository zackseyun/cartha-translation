language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פָּקַ֥דְתָּ הָ/אָ֨רֶץ וַ/תְּשֹׁ֪קְקֶ֡/הָ רַבַּ֬ת תַּעְשְׁרֶ֗/נָּה פֶּ֣לֶג אֱ֭לֹהִים מָ֣לֵא מָ֑יִם תָּכִ֥ין דְּ֝גָנָ֗/ם כִּי כֵ֥ן תְּכִינֶֽ/הָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: fr
  text: 'Tu prends soin de la terre et tu l’abreuves ;

    tu l’enrichis abondamment.

    Le ruisseau de Dieu[a] est plein d’eau.

    Tu prépares leur grain[b],

    car c’est ainsi que tu prépares la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cours d’eau de Dieu » ou « le canal de Dieu ». Cette expression poétique peut évoquer la source céleste de la pluie et de la fécondité.
    reason: lexical_alternative
  - marker: b
    text: Ou « tu leur fournis du grain » ou « tu établis leur grain ». Le verbe hébreu peut signifier « préparer », « rendre prêt » ou « établir » ; le possessif pluriel ne renvoie pas grammaticalement à « la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: tu prends soin de
  rationale: Le verbe פקד peut exprimer une visite ou une intervention attentive. Dans ce contexte de fertilité bienfaisante, « prendre soin de » restitue naturellement en français moderne l’attention active de Dieu, sans suggérer une simple visite passagère.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: tu l’abreuves
  rationale: Dans ce contexte agricole, le verbe décrit l’apport d’eau à la terre. « Abreuver » conserve l’image poétique et exprime plus vivement qu’un simple « arroser » une irrigation abondante.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: tu l’enrichis abondamment
  rationale: רבת renforce la forme causative de עשר, « rendre riche ». Cette formulation française rend à la fois l’intensification et l’action féconde exercée sur la terre.
- source_word: פֶּלֶג אֱלֹהִים
  choice: le ruisseau de Dieu
  rationale: פלג désigne un cours d’eau, un ruisseau ou un canal. « Le ruisseau de Dieu » préserve la construction hébraïque élevée et son évocation possible d’une réserve céleste dispensant pluie et fécondité.
- source_word: מָלֵא מָיִם
  choice: est plein d’eau
  rationale: Traduction directe et naturelle de la proposition nominale, qui maintient l’image d’une eau disponible en abondance.
- source_word: תָּכִין דְּגָנָם
  choice: tu prépares leur grain
  rationale: Le hiphil de כון peut signifier « préparer », « disposer » ou « établir ». « Préparer » convient à la provision agricole et maintient le lien lexical avec le verbe répété à la fin. Le possessif pluriel « leur » respecte le suffixe masculin pluriel inexpliqué du texte.
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: car c’est ainsi que tu prépares la terre
  rationale: Le suffixe féminin singulier renvoie naturellement à « la terre ». La répétition de « préparer » conserve celle de כון dans l’hébreu, tandis que la reprise explicite de « la terre » clarifie le référent en français.
theological_decisions:
- issue: Référent du suffixe pluriel dans דְּגָנָם (« leur grain »)
  choice: Conserver le possessif pluriel « leur » sans identifier explicitement ses référents.
  alternative: Traduire « tu prépares le grain pour eux » ou neutraliser le suffixe par « tu prépares le grain de la terre ».
  rationale: Le suffixe est masculin pluriel et ne peut donc pas reprendre grammaticalement le nom féminin singulier « terre ». Il vise vraisemblablement les humains qui bénéficient de la récolte, mais le texte ne les nomme pas. « Leur grain » préserve cette distinction et cette légère indétermination.
- issue: Sens de l’expression פֶּלֶג אֱלֹהִים
  choice: Rendre littéralement « le ruisseau de Dieu ».
  alternative: Comprendre l’expression comme un superlatif, « un ruisseau immense », ou expliciter « le cours d’eau céleste ».
  rationale: La construction peut évoquer poétiquement une source divine ou céleste de pluie et de fécondité. La traduction littérale maintient l’image et sa portée théologique sans trancher entre possession, origine et intensification.
translation_notes:
  register: Français international moderne, poétique et digne. Les lignes brèves conservent le parallélisme du verset. « Prendre soin de » évite le sens touristique que pourrait prendre aujourd’hui « visiter la terre », tandis que « abreuver » maintient une image agricole expressive. Les deux occurrences de « préparer » reproduisent délibérément la répétition hébraïque.
