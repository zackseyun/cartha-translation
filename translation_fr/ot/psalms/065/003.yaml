  text: דִּבְרֵ֣י עֲ֭וֺנֹת גָּ֣בְרוּ מֶ֑נִּ/י פְּ֝שָׁעֵ֗י/נוּ אַתָּ֥ה תְכַפְּרֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/003.yaml
  text: Words of iniquity have prevailed against me[b][a]; our transgressions—you will atone for them.
translation:
  language: fr
  text: 'Les fautes m’accablent[a] ;

    nos transgressions, toi, tu les effaces[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est condensé. On peut aussi comprendre : « Des paroles d’iniquité ont eu raison de moi », « Les affaires liées aux fautes sont trop fortes pour moi » ou « Le poids des fautes m’accable ».'
    reason: lexical_alternative
  - marker: b
    text: Litt. « tu fais l’expiation pour elles ». Selon la nuance retenue, le verbe peut aussi être rendu par « tu les purifies » ; il désigne l’action qui traite et ôte la faute.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: les fautes
  rationale: 'L’expression hébraïque est condensée : דִּבְרֵי peut désigner des paroles, des faits ou des affaires, tandis que עֲוֺנֹת peut évoquer les fautes, la culpabilité ou leurs conséquences. « Les fautes » exprime naturellement en français l’idée centrale sans trancher en faveur de la seule parole ou du seul châtiment ; une note conserve les autres possibilités.'
- source_word: גָּבְרוּ מֶנִּי
  choice: m’accablent
  rationale: Le verbe גבר exprime ce qui devient fort ou l’emporte sur quelqu’un. « M’accablent » restitue en français courant l’image de fautes devenues trop puissantes pour le locuteur.
- source_word: פְּשָׁעֵינוּ
  choice: nos transgressions
  rationale: פֶּשַׁע désigne une faute qui franchit une limite et peut comporter l’idée de rébellion. « Transgressions » en conserve la gravité morale tout en restant intelligible.
- source_word: אַתָּה
  choice: toi, tu
  rationale: Le pronom indépendant est emphatique. Sa reprise par « toi, tu » rend cette insistance naturelle en français et marque le contraste entre l’impuissance humaine et l’action divine.
- source_word: תְכַפְּרֵם
  choice: tu les expies
  rationale: Au piel, כפר désigne ici l’action de faire expiation pour les transgressions et ainsi de traiter ou d’ôter leur culpabilité. « Expier » conserve cette portée cultuelle et théologique avec concision.
theological_decisions:
- issue: Sens de כפר appliqué aux transgressions
  choice: tu les expies
  alternative: tu les couvres / tu les effaces / tu fais l’expiation pour elles
  rationale: « Expier » préserve la force cultuelle du verbe sans préciser un mécanisme doctrinal particulier. « Couvrir » risquerait d’évoquer une simple dissimulation, tandis qu’« effacer » atténuerait la notion d’expiation.
- issue: Passage du singulier « moi » au pluriel « nos »
  choice: maintien du changement de personne
  alternative: harmoniser en « nous » ou en « mes »
  rationale: Le texte hébreu passe réellement de la détresse individuelle du locuteur à la confession collective. Cette tension doit être conservée plutôt que corrigée.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme en deux lignes et l’emphase « toi, tu » reproduisent le mouvement du vers hébreu. « M’accablent » privilégie une formulation idiomatique tout en signalant en note la compression du texte source.
