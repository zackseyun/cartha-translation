source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: fr
  text: Heureux celui que tu choisis et fais approcher pour qu’il demeure dans tes cours ![a] Nous serons comblés des bienfaits de ta maison et de la sainteté de ton temple.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Heureux celui que tu choisis et fais approcher : il demeurera dans tes cours ! »'
    reason: La forme verbale hébraïque peut être comprise comme une proposition indépendante exprimant le résultat, plutôt que comme une proposition de but.
  - marker: b
    text: « Bienfaits » traduit un terme qui peut aussi signifier « bonté », « bonnes choses » ou « abondance ». L’expression « la sainteté de ton temple » peut aussi être comprise comme « le lieu saint de ton temple » ou « ton saint temple ».
    reason: Le mot hébreu טוּב a une valeur qualitative et concrète; la construction קְדֹשׁ הֵיכָלֶךָ est concise et admet plusieurs analyses grammaticales.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux celui
  rationale: La formule exclamative introduit une béatitude. « Heureux celui » est naturel en français biblique moderne sans réduire le terme à une simple émotion passagère.
- source_word: תִּבְחַר
  choice: que tu choisis
  rationale: Le verbe exprime simplement l’acte de choisir ; cette formulation conserve l’initiative divine sans introduire un vocabulaire doctrinal plus spécialisé.
- source_word: וּתְקָרֵב
  choice: et que tu fais approcher
  rationale: La forme causative indique que Dieu fait venir la personne près de lui. « Fais approcher » en conserve explicitement la valeur causative.
- source_word: יִשְׁכֹּן
  choice: pour qu’il demeure
  rationale: L’imparfait à la troisième personne peut indiquer le but ou le résultat des verbes précédents. La proposition finale est claire et préserve cette relation syntaxique.
- source_word: חֲצֵרֶיךָ
  choice: dans tes cours
  rationale: Dans le contexte du sanctuaire, le terme désigne les cours ou espaces extérieurs du temple ; « cours » garde cette image cultuelle concrète.
- source_word: נִשְׂבְּעָה
  choice: Nous serons rassasiés
  rationale: La forme cohortative peut exprimer une attente confiante ou une volonté. Le futur français rend naturellement cette assurance tout en gardant le passage du singulier au pluriel.
- source_word: בְּטוּב
  choice: des biens
  rationale: טוּב peut désigner la bonté, les bonnes choses ou l’abondance bienfaisante. « Des biens » convient au verbe « rassasier » et maintient le sens concret possible.
- source_word: בֵּיתֶךָ
  choice: de ta maison
  rationale: En parallèle avec le temple et ses cours, « maison » désigne ici la maison de Dieu, tout en reproduisant l’image hébraïque.
- source_word: קְדֹשׁ
  choice: de la sainteté
  rationale: Le substantif peut être compris en apposition ou comme qualification sacrée du temple. « De la sainteté » suit la relation proposée par le texte massorétique sans remplacer l’expression par une interprétation spatiale.
- source_word: הֵיכָלֶךָ
  choice: de ton temple
  rationale: Bien que le mot puisse aussi signifier « palais », le cadre cultuel et le parallélisme avec la maison et les cours indiquent ici le temple.
theological_decisions:
- issue: Choix divin et accès à la présence de Dieu
  choice: Le texte attribue à Dieu le choix et l’action de faire approcher la personne.
  alternative: Préciser une doctrine particulière de l’élection, ou limiter explicitement ce choix à une fonction liturgique.
  rationale: L’hébreu affirme clairement l’initiative divine, mais ne développe pas ici son étendue doctrinale. La traduction conserve donc cette tension sans la résoudre.
- issue: Langage de l’accès au temple
  choice: Les images concrètes de « cours », « maison » et « temple » sont maintenues.
  alternative: Les spiritualiser en parlant exclusivement de la présence ou de la demeure de Dieu.
  rationale: Le verset est ancré dans le culte d’Israël ; conserver son cadre matériel laisse au lecteur la possibilité d’en discerner les implications théologiques sans les imposer dans la traduction.
- issue: Valeur de קְדֹשׁ הֵיכָלֶךָ
  choice: « de la sainteté de ton temple »
  alternative: « du lieu saint de ton temple » ou « de ton saint temple »
  rationale: La construction est concise et peut être comprise de plusieurs façons. Le choix retenu garde la notion abstraite de sainteté et le parallélisme avec les biens de la maison, tandis que la note signale une lecture adjectivale naturelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la béatitude est conservé, ainsi que le passage significatif du singulier (« celui ») au pluriel (« nous »). Les termes cultuels restent concrets. Tous les appels de note figurent dans le texte.
