id: PSA.65.5
reference: Psalms 65:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: fr
  text: Par des actes redoutables, tu nous réponds avec justice[a], Dieu de notre salut, toi en qui se confient tous ceux qui vivent aux extrémités de la terre et dans les mers lointaines[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu nous réponds selon la justice » ou « avec droiture ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie ici le singulier « mer », qui peut avoir un sens collectif.
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: des actes redoutables
  rationale: Le substantif elliptique issu de ירא désigne des réalités qui inspirent crainte et admiration. « Actes redoutables » reste naturel en français et convient aux interventions salvatrices de Dieu.
- source_word: בְּצֶ֣דֶק
  choice: avec justice
  rationale: La préposition בְּ exprime ici vraisemblablement la manière. « Avec justice » rend צֶדֶק sans restreindre le propos à la seule conformité morale; « selon la justice » demeure possible.
- source_word: תַּ֭עֲנֵנוּ
  choice: tu nous réponds
  rationale: Le qal de ענה signifie « répondre », et le suffixe est à la première personne du pluriel.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: Dieu de notre salut
  rationale: Cette formulation conserve le rapport construit de l’hébreu et la portée large de יֶשַׁע, qui évoque salut et délivrance.
- source_word: מִבְטָ֥ח
  choice: la confiance
  rationale: מִבְטָח désigne ce en quoi l’on place sa confiance. En apposition à Dieu, « la confiance » préserve cette valeur, malgré une légère abstraction en français.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: de toutes les extrémités de la terre
  rationale: Expression hébraïque conventionnelle désignant les régions les plus reculées du monde.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: et des mers lointaines
  rationale: Bien que יָם soit morphologiquement singulier, l’adjectif pluriel רְחֹקִים permet de comprendre le nom collectivement. Le pluriel français exprime naturellement les régions maritimes éloignées.
theological_decisions:
- issue: Portée de צֶדֶק dans la réponse divine
  choice: avec justice
  alternative: selon la justice; avec droiture
  rationale: צֶדֶק peut évoquer à la fois la justice et la droiture fidèle de Dieu. Le texte principal retient « justice », terme français idiomatique qui ne tranche pas artificiellement entre jugement équitable et fidélité morale; la note signale une autre construction possible.
- issue: Fonction de מִבְטָח appliqué à Dieu
  choice: toi qui es la confiance
  alternative: toi en qui se confient; le refuge
  rationale: La formulation nominale conserve l’affirmation hébraïque selon laquelle Dieu est l’objet de la confiance universelle, sans introduire la notion plus spécifique de refuge.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. « Ô » est omis pour éviter une solennité vieillie; l’apposition est clarifiée par « toi qui es ». Tous les marqueurs de notes figurent dans le texte.
