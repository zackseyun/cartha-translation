source:
  edition: WLC
  text: יִ֭רְעֲפוּ נְא֣וֹת מִדְבָּ֑ר וְ֝/גִ֗יל גְּבָע֥וֹת תַּחְגֹּֽרְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/012.yaml
  text: The pastures of the wilderness drip[b][a], and the hills gird themselves with rejoicing.
translation:
  language: fr
  text: 'Les pâturages du désert ruissellent[a],

    et les collines se ceignent d’allégresse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dégouttent » ; le verbe hébreu peut évoquer une humidité abondante qui goutte, se distille ou se déverse.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: ruissellent
  rationale: Le verbe רָעַף évoque une eau abondante qui goutte, se distille ou se déverse. « Ruissellent » conserve l’image vive de l’humidité répandue tout en restant naturel en français.
- source_word: נְאוֹת
  choice: pâturages
  rationale: נָוֶה peut désigner un lieu de séjour ou une terre de pâture ; dans ce tableau de fécondité, « pâturages » convient au parallélisme paysager.
- source_word: מִדְבָּר
  choice: désert
  rationale: מִדְבָּר désigne une région non cultivée, souvent une steppe plutôt qu’un désert de sable. « Désert », au sens biblique de terre sauvage, garde la force poétique du contraste avec les pâturages ruisselants.
- source_word: גִיל
  choice: allégresse
  rationale: גִיל exprime une joie vive et exultante. « Allégresse » s’accorde naturellement avec la personnification poétique des collines.
- source_word: גְּבָעוֹת
  choice: les collines
  rationale: Traduction directe du pluriel féminin, qui préserve l’image du paysage.
- source_word: תַּחְגֹּרְנָה
  choice: se ceignent
  rationale: חָגַר signifie littéralement « ceindre, attacher autour de soi ». « Se ceignent » maintient la métaphore vestimentaire sans l’expliciter.
theological_decisions: []
translation_notes:
  register: Français poétique, actuel et digne. « Les pâturages du désert » conserve le contraste de l’hébreu, tandis que « se ceignent d’allégresse » préserve sa personnification et sa métaphore concrète.
