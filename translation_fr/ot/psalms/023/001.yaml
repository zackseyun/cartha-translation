id: PSA.23.1
reference: Psalms 23:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: fr
  text: 'Psaume de David[a].


    Yahvé[b] est mon berger : je ne manquerai de rien[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David »; dans cette suscription, l’hébreu לְדָוִד peut indiquer l’auteur, la dédicace, l’appartenance ou une association.
    reason: alternative_reading
  - marker: b
    text: L’hébreu porte YHWH, le nom divin traditionnellement rendu « le SEIGNEUR » dans de nombreuses traductions françaises.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « je ne manquerai pas »; le verbe exprime le fait d’être dépourvu de ce qui est nécessaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme de suscription désignant un chant accompagné de musique; « psaume » est l’équivalent français courant et précis dans ce contexte.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance, la dédicace ou une association. « De David » conserve mieux cette amplitude que « par David » ou « pour David ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin YHWH, préférable ici à la substitution par un titre.
- source_word: רֹעִי
  choice: mon berger
  rationale: Le mot issu de רעה désigne celui qui fait paître et prend soin d’un troupeau; « mon berger » restitue naturellement la métaphore personnelle.
- source_word: לֹא אֶחְסָר
  choice: je ne manquerai de rien
  rationale: Le verbe חסר signifie « manquer, être dépourvu ». La tournure française exprime clairement et naturellement la valeur du verbe à l’inaccompli sans confondre manque et désir.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie directement le nom propre YHWH. Le rendre par « Yahvé » préserve cette fonction de nom personnel, tandis que « le SEIGNEUR » reflète la substitution traditionnelle à la lecture.
- issue: Portée de la suscription לְדָוִד
  choice: de David
  alternative: par David / pour David
  rationale: La construction hébraïque ne tranche pas à elle seule entre auteur, dédicataire, appartenance et association. « De David » laisse subsister cette ambiguïté.
- issue: Valeur temporelle de אֶחְסָר
  choice: je ne manquerai de rien
  alternative: je ne manque de rien
  rationale: L’inaccompli peut être compris avec une orientation future ou une portée générale. Le futur français convient au contexte de confiance, sans exclure l’idée d’une assurance durable.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve l’image traditionnelle du berger, emploie le nom divin sous sa forme française courante et privilégie une syntaxe immédiatement compréhensible.
