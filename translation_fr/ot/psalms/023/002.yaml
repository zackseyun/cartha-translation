  text: בִּ/נְא֣וֹת דֶּ֭שֶׁא יַרְבִּיצֵ֑/נִי עַל מֵ֖י מְנֻח֣וֹת יְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: fr
  text: Dans des pâturages d’herbe fraîche, il me fait coucher ; près des eaux qui procurent le repos[a], il me conduit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « près des eaux paisibles » ou « près des eaux tranquilles ». Littéralement, l’hébreu parle d’« eaux de repos » et souligne le repos ou la quiétude associés à ces eaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: dans des pâturages d’herbe fraîche
  rationale: נְאוֹת désigne ici des lieux de pâture ou de repos pour les troupeaux, et דֶּשֶׁא la végétation fraîche. Cette formulation conserve l’image pastorale et le sens concret sans réduire celui-ci à la seule couleur verte.
- source_word: יַרְבִּיצֵנִי
  choice: il me fait coucher
  rationale: Le hifil de רבץ exprime l’action de faire se coucher. La traduction conserve cette valeur causative et l’image concrète de la brebis, plutôt que de la remplacer par l’idée abstraite de repos.
- source_word: עַל מֵי מְנֻחוֹת
  choice: près des eaux qui procurent le repos
  rationale: Dans ce contexte, עַל indique la proximité. מְנֻחוֹת évoque le repos ou la quiétude, et non nécessairement l’immobilité de l’eau. La formulation française explicite naturellement ce rapport tout en gardant « eaux », au pluriel, comme en hébreu.
- source_word: יְנַהֲלֵנִי
  choice: il me conduit
  rationale: Le piel de נהל signifie conduire ou guider, souvent avec sollicitude. « Il me conduit » reste sobre et préserve l’image du berger.
theological_decisions:
- issue: Traduction traditionnelle « eaux paisibles/tranquilles » ou expression centrée sur le repos
  choice: des eaux qui procurent le repos
  alternative: des eaux paisibles ; des eaux tranquilles
  rationale: Le nom hébreu מְנֻחוֹת met directement l’accent sur le repos ou la quiétude, sans affirmer explicitement que l’eau est immobile. Le texte principal rend ce lien sémantique, tandis que la note conserve les formulations traditionnelles plausibles.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le parallélisme des deux propositions est conservé, ainsi que l’imagerie concrète du berger. Le point-virgule reflète leur étroite correspondance.
