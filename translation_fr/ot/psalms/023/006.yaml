  text: אַ֤ךְ ט֤וֹב וָ/חֶ֣סֶד יִ֭רְדְּפוּ/נִי כָּל יְמֵ֣י חַיָּ֑/י וְ/שַׁבְתִּ֥י בְּ/בֵית יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/006.yaml
  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: fr
  text: Oui, le bonheur et l’amour fidèle me poursuivront tous les jours de ma vie[a], et j’habiterai dans la maison de Yahweh[b] pour de longs jours[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « me suivront ». Le verbe hébreu signifie plus vivement « poursuivre » : le bonheur et l’amour fidèle de Dieu sont représentés comme se lançant activement à la poursuite du psalmiste.'
    reason: lexical_alternative
  - marker: b
    text: Ou « je retournerai dans la maison de Yahweh ». La vocalisation massorétique soutient « j’habiterai », mais « je retournerai » est une lecture ancienne.
    reason: alternative_reading
  - marker: c
    text: Ou « pour toujours ». L’hébreu dit littéralement « pour une longueur de jours », expression qui évoque une durée prolongée.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: Dans cette conclusion, la particule exprime une affirmation confiante plutôt qu’une restriction. « Oui » est naturel en français et donne au vers le ton assuré de l’hébreu.
- source_word: טוֹב
  choice: le bonheur
  rationale: Ici, l’adjectif substantivé désigne le bien dispensé par Dieu. « Le bonheur », en binôme avec « l’amour fidèle », convient au registre poétique du psaume sans réduire le terme à une qualité abstraite.
- source_word: חֶסֶד
  choice: l’amour fidèle
  rationale: Cette expression rend l’idée d’un amour loyal, constant et durable, sans employer un archaïsme ni expliciter davantage que le texte la dimension d’alliance.
- source_word: יִרְדְּפוּנִי
  choice: me poursuivront
  rationale: Le verbe signifie vivement « poursuivre ». Ce choix conserve le renversement poétique par lequel ce sont désormais les bienfaits divins, et non des ennemis, qui poursuivent le psalmiste.
- source_word: כָּל יְמֵי חַיָּי
  choice: tous les jours de ma vie
  rationale: Traduction directe et idiomatique qui conserve l’étendue temporelle et la portée personnelle de l’expression hébraïque.
- source_word: וְשַׁבְתִּי
  choice: j’habiterai
  rationale: La vocalisation massorétique rattache naturellement la forme à ישׁב, « habiter, demeurer ». « J’habiterai » convient au complément « dans la maison de Yahweh » ; l’autre lecture ancienne, « je retournerai », est signalée en note.
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Cette formulation préserve l’image concrète de la demeure ou du sanctuaire divin et rend le tétragramme par le nom propre « Yahweh ».
- source_word: לְאֹרֶךְ יָמִים
  choice: pour de longs jours
  rationale: Cette tournure française conserve l’image hébraïque de la longueur des jours et son caractère ouvert, sans imposer dans le texte principal le sens plus explicite « pour toujours ».
theological_decisions:
- issue: Durée exprimée par לְאֹרֶךְ יָמִים
  choice: pour de longs jours
  alternative: pour toujours
  rationale: L’expression peut évoquer une communion durable, voire sans fin, et elle est souvent traduite « pour toujours ». Le texte principal garde toutefois l’image temporelle hébraïque sans trancher sa portée maximale ; la lecture plus forte figure en note.
- issue: Sens de וְשַׁבְתִּי
  choice: j’habiterai
  alternative: je retournerai
  rationale: La vocalisation massorétique soutient le sens « j’habiterai ». La lecture « je retournerai », bien attestée dans l’histoire de la traduction et porteuse d’une autre image, est conservée en note plutôt qu’écartée silencieusement.
translation_notes:
  register: Français international moderne, poétique et digne, mais immédiatement intelligible. Le parallélisme nominal « le bonheur et l’amour fidèle » et le verbe énergique « poursuivre » préservent la force de l’image hébraïque. « Yahweh » transcrit le nom divin conformément à la couche de consultation fournie.
