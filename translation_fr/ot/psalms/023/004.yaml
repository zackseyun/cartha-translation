  terminology: « Bâton » pour שֵׁבֶט et « houlette » pour מִשְׁעֶנֶת sont contextuellement défendables dans l’imagerie du berger. « Profondes ténèbres » est un bon choix non confessionnel pour צַלְמָוֶת; la note rend compte sobrement des connotations mortelles et de l’alternative traditionnelle. Aucun terme théologique n’est surinterprété.
