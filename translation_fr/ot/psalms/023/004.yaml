id: PSA.23.4
reference: Psalms 23:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: fr
  text: Même si je marche dans la vallée des profondes ténèbres[a], je ne crains aucun mal, car tu es avec moi ; ton bâton et ta houlette — ce sont eux qui me réconfortent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la vallée de l’ombre de la mort ». Le terme hébreu peut désigner de profondes ténèbres, avec de possibles connotations de mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כִּי
  choice: Même si
  rationale: Introduit naturellement en français une proposition concessive, tout en gardant la force de l’hébreu.
- source_word: אֵלֵךְ
  choice: je marche
  rationale: Rend l’imparfait hébreu dans son sens vivant et général, et maintient l’image du cheminement.
- source_word: בְּגֵיא
  choice: dans la vallée
  rationale: « Vallée » est naturel et suffisamment large ; avec « marcher », « dans » exprime ici le parcours au cœur de ce lieu.
- source_word: צַלְמָוֶת
  choice: profondes ténèbres
  rationale: Rend le sens probable d’une obscurité très profonde sans réduire le mot à la mort, dont la connotation possible est signalée en note.
- source_word: לֹא אִירָא רָע
  choice: je ne crains aucun mal
  rationale: Préserve l’étendue de רָע, qui peut évoquer le mal, le malheur, le danger ou le dommage.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: car tu es avec moi
  rationale: Exprime clairement la raison de l’assurance du psalmiste dans un registre poétique digne.
- source_word: שִׁבְטְךָ
  choice: ton bâton
  rationale: Dans l’image pastorale, le terme désigne l’instrument du berger servant notamment à protéger et à diriger.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: ta houlette
  rationale: « Houlette » distingue naturellement en français le second instrument pastoral du bâton, tout en conservant l’image traditionnelle du berger.
- source_word: הֵמָּה
  choice: ce sont eux qui
  rationale: Rend explicitement l’insistance du pronom indépendant hébreu sur les deux instruments.
- source_word: יְנַחֲמֻנִי
  choice: me réconfortent
  rationale: Exprime à la fois la consolation et l’assurance que donnent la présence et la protection du berger.
theological_decisions:
- issue: Sens de צַלְמָוֶת dans une expression traditionnellement associée à la mort
  choice: profondes ténèbres
  alternative: ombre de la mort
  rationale: Le texte principal retient le sens lexical large d’une obscurité profonde, sans effacer les résonances de mort que porte peut-être le terme et que conserve la note.
translation_notes:
  register: Français moderne, international et poétique, avec un rythme adapté à la récitation. « Houlette » est légèrement littéraire, mais reste largement intelligible et préserve clairement la scène pastorale ainsi que la distinction entre les deux instruments.
