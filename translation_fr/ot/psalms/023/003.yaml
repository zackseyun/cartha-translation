id: PSA.23.3
reference: Psalms 23:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: fr
  text: Il restaure mon âme[a] ; il me conduit sur des sentiers de justice[b], à cause de son nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il ranime ma vie », « il me redonne des forces » ou « il me ramène ». Le mot hébreu rendu par « mon âme » peut désigner la personne entière ou la vie, et pas seulement la dimension immatérielle de l’être humain.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur de justes sentiers », « sur des sentiers droits » ou « sur des chemins de droiture ».
    reason: lexical_alternative
  - marker: c
    text: Le « nom » représente ici le caractère, l’honneur et la réputation de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner la vie, la personne entière ou l’être intérieur. « Mon âme » conserve la force poétique traditionnelle, tandis que la note prévient une lecture limitée à une partie immatérielle de l’être humain.
- source_word: יְשׁוֹבֵב
  choice: il restaure
  rationale: La forme issue de שׁוב peut exprimer l’idée de ramener, rétablir ou ranimer. « Restaure » reste naturel en français et préserve cette amplitude sémantique.
- source_word: יַנְחֵנִי
  choice: il me conduit
  rationale: Le hiphil de נחה signifie couramment conduire ou guider. « Conduit » s’accorde avec l’image du berger qui mène son troupeau.
- source_word: בְמַעְגְּלֵי
  choice: sur des sentiers
  rationale: מַעְגָּל désigne une piste, une voie ou un sentier. « Sur des sentiers » rend naturellement en français l’image concrète du déplacement.
- source_word: צֶדֶק
  choice: de justice
  rationale: צֶדֶק couvre la justice, la droiture et ce qui est juste. « Justice » est une formulation française idiomatique qui maintient la portée morale du terme sans exclure le sens de chemins justes ou droits.
- source_word: לְמַעַן
  choice: à cause de
  rationale: לְמַעַן peut exprimer le but ou le motif. « À cause de son nom » indique ici que la conduite divine est liée à ce que représente son nom, tout en laissant la note en expliciter la portée.
- source_word: שְׁמוֹ
  choice: son nom
  rationale: שֵׁם signifie littéralement « nom » et peut englober la réputation, le caractère et la renommée. Le maintien de « nom » préserve l’expression biblique et sa richesse théologique.
theological_decisions:
- issue: Sens de « restaure mon âme »
  choice: Une restauration ou une revivification de la vie et de la personne entière, formulée par l’expression poétique « mon âme ».
  alternative: « Il ranime ma vie », « il me redonne des forces » ou « il me ramène ».
  rationale: Le terme נֶפֶשׁ est plus large que la seule âme immatérielle, et le verbe שׁוב permet à la fois les nuances de restauration, de retour et de reprise de vie. La traduction conserve cette tension plutôt que de la réduire.
- issue: Sens de « sentiers de justice »
  choice: Des voies conformes à ce qui est juste et droit sous la conduite de Dieu.
  alternative: « De justes sentiers », « des sentiers droits » ou « des chemins de droiture ».
  rationale: צֶדֶק peut évoquer la justice, la droiture ou le caractère correct des voies. « Sentiers de justice » garde la dimension éthique sans exclure l’idée concrète de bons chemins.
- issue: Portée de « à cause de son nom »
  choice: Dieu agit en considération de son nom, c’est-à-dire de son caractère et de sa réputation.
  alternative: « Pour l’honneur de son nom » ou « afin d’être fidèle à son nom ».
  rationale: L’expression hébraïque rattache l’action de Dieu à son nom sans préciser davantage le rapport exact. La traduction littérale conserve cette densité, et la note fournit le contexte culturel.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique simple. « Âme », « sentiers de justice » et « son nom » conservent les images et la densité du texte hébreu ; les notes clarifient leur champ de sens sans imposer une interprétation confessionnelle.
