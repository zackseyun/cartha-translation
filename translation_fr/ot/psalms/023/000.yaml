source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: fr
  text: 'Psaume de David[a].


    Yahvé[b] est mon berger ; je ne manquerai de rien[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David », « pour David » ou « concernant David » ; la formule hébraïque לְדָוִד peut indiquer l’auteur, une dédicace ou une association.
    reason: alternative_reading
  - marker: b
    text: Hébreu YHWH, traditionnellement rendu par « le SEIGNEUR » ou « l’Éternel » dans de nombreuses traductions françaises.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, « je ne manquerai pas » ; dans ce contexte, le sens est qu’aucun nécessaire ne fera défaut.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Le terme désigne un chant accompagné de musique et correspond naturellement au titre traditionnel et courant « psaume ».
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française usuelle représente le nom divin YHWH plutôt que de le remplacer silencieusement par un titre.
- source_word: רֹעִי
  choice: mon berger
  rationale: Le substantif avec suffixe possessif signifie littéralement « mon berger » et conserve l’image pastorale du texte hébreu.
- source_word: לֹא אֶחְסָר
  choice: je ne manquerai de rien
  rationale: Le verbe חסר exprime le fait de manquer de quelque chose. L’ajout idiomatique de « rien » rend en français le sens absolu de la proposition sans le réduire aux seuls besoins matériels.
theological_decisions:
- issue: Rapport exprimé par לְ dans לְדָוִד
  choice: de David
  alternative: par David ; pour David ; concernant David
  rationale: « De David » est une formulation française concise qui peut garder une certaine souplesse, tandis que la note signale explicitement que la préposition hébraïque n’établit pas à elle seule une attribution d’auteur certaine.
- issue: Représentation du tétragramme
  choice: Yahvé
  alternative: le SEIGNEUR ; l’Éternel
  rationale: Employer le nom propre préserve la distinction entre YHWH et les titres divins ; la note indique toutefois l’usage traditionnel français.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation distingue la suscription du corps du psaume. « Je ne manquerai de rien » est idiomatique et immédiatement compréhensible, tout en restant proche de l’hébreu.
