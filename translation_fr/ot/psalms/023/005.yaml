  variant: modern international French
source:
  edition: WLC
  text: תַּעֲרֹ֬ךְ לְ/פָנַ֨/י שֻׁלְחָ֗ן נֶ֥גֶד צֹרְרָ֑/י דִּשַּׁ֖נְתָּ בַ/שֶּׁ֥מֶן רֹ֝אשִׁ֗/י כּוֹסִ֥/י רְוָיָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: fr
  text: 'Tu dresses devant moi une table,

    sous les yeux de mes ennemis ;

    tu oins ma tête d’huile[a],

    ma coupe déborde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « rendre riche, abondant » ; dans ce contexte d’hospitalité, il évoque le fait de traiter généreusement ou de rafraîchir abondamment avec de l’huile.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: Tu dresses
  rationale: Le verbe ערך signifie disposer ou préparer avec ordre. En français, « dresser une table » rend naturellement l’action concrète tout en conservant l’image du repas.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Rend directement la relation spatiale et personnelle exprimée par la préposition.
- source_word: שֻׁלְחָן
  choice: une table
  rationale: Le nom désigne une table, ici dans une scène de repas et d’hospitalité.
- source_word: נֶגֶד צֹרְרָי
  choice: sous les yeux de mes ennemis
  rationale: נֶגֶד indique que les adversaires sont présents, en face et témoins de la scène. Cette expression française actuelle conserve cette proximité visuelle et rhétorique.
- source_word: דִּשַּׁנְתָּ
  choice: tu verses une huile abondante
  rationale: Le verbe דשׁן évoque littéralement le fait de rendre gras, riche ou luxuriant. La formulation choisie garde l’action concrète liée à l’huile et exprime l’abondance, sans réduire le vers à une onction cultuelle ou royale.
- source_word: בַשֶּׁמֶן רֹאשִׁי
  choice: sur ma tête
  rationale: Avec la mention explicite de l’huile dans la proposition, cette formulation préserve le geste d’hospitalité dirigé vers la tête.
- source_word: כּוֹסִי רְוָיָה
  choice: ma coupe déborde
  rationale: רְוָיָה exprime la saturation ou la plénitude abondante. La tournure verbale est naturelle en français et maintient l’image de la surabondance.
theological_decisions:
- issue: Image de l’huile dans דִּשַּׁנְתָּ בַשֶּׁמֶן רֹאשִׁי
  choice: tu verses une huile abondante sur ma tête
  alternative: tu oins d’huile ma tête
  rationale: Le contexte immédiat est celui d’un repas offert par un hôte. La traduction conserve le geste concret et la nuance de traitement généreux portée par דשׁן, sans imposer une interprétation sacramentelle, sacerdotale ou royale. Une note signale la traduction traditionnelle possible.
- issue: Valeur temporelle et aspectuelle
  choice: 'présent français : « Tu dresses… tu verses… déborde »'
  alternative: 'futur ou accompli : « Tu dresseras… tu as versé… »'
  rationale: Dans ce poème, les formes hébraïques se prêtent à une description vive de la sollicitude actuelle et continue de Dieu. Le présent français garde cette immédiateté sans trancher excessivement la question aspectuelle.
- issue: Présence des ennemis
  choice: sous les yeux de mes ennemis
  alternative: en présence de mes ennemis
  rationale: La traduction exprime que les adversaires restent témoins de l’accueil et de l’honneur accordés au psalmiste, sans préciser au-delà du texte s’ils sont vaincus, invités ou simplement tenus à distance.
translation_notes:
  register: Français international moderne, poétique et digne. « Dresser une table » et « sous les yeux de » sont idiomatiques sans être familiers. Les trois lignes conservent l’imagerie cohérente de l’hospitalité et de l’abondance.
