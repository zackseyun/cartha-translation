  text: בְּ/י֥וֹם צָרָתִ/י֮ אֲדֹנָ֪/י דָּ֫רָ֥שְׁתִּי יָדִ֤/י לַ֣יְלָה נִ֭גְּרָה וְ/לֹ֣א תָפ֑וּג מֵאֲנָ֖ה הִנָּחֵ֣ם נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/002.yaml
  text: In the day of my distress I sought the Lord[a]; my hand was stretched out in the night and did not grow numb; my soul refused to be comforted.
translation:
  language: fr
  text: Au jour de ma détresse, j’ai cherché le Seigneur ; durant la nuit, ma main est restée tendue sans se relâcher[a] ; mon âme a refusé d’être consolée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma main coulait durant la nuit et ne se relâchait pas ». L’image hébraïque est difficile ; le texte principal la comprend comme une main maintenue tendue dans une prière persistante.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: Au jour de ma détresse
  rationale: Cette formulation conserve l’expression temporelle et le ton poétique de l’hébreu, tout en restant claire en français moderne.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre אֲדֹנָי, et non du nom divin YHWH ; « le Seigneur » est donc la traduction française naturelle du titre.
- source_word: דָּרָשְׁתִּי
  choice: j’ai cherché
  rationale: Dans ce contexte, דרשׁ exprime le fait de chercher Dieu, notamment en se tournant vers lui dans la prière.
- source_word: יָדִי
  choice: ma main
  rationale: Le singulier de l’hébreu est maintenu, malgré le caractère inhabituel de l’image.
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: durant la nuit, ma main est restée tendue sans se relâcher
  rationale: Le verbe נגר évoque littéralement ce qui coule ou se répand, mais associé à « ma main », il semble décrire une main continuellement tendue, probablement dans la prière. תָפוּג indique qu’elle ne faiblit ni ne se relâche. Une note préserve l’image hébraïque difficile.
- source_word: מֵאֲנָה הִנָּחֵם נַפְשִׁי
  choice: mon âme a refusé d’être consolée
  rationale: La traduction garde la personnification et la profondeur intérieure de נַפְשִׁי, ainsi que la construction passive de הִנָּחֵם.
theological_decisions:
- issue: Traduction de אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le mot est un titre divin et non le tétragramme. L’article défini donne ici une formulation française naturelle sans confondre אֲדֹנָי avec YHWH.
- issue: Interprétation de la main durant la nuit
  choice: une main restée tendue sans se relâcher
  alternative: une main qui coulait sans interruption
  rationale: Le contexte de recherche du Seigneur favorise l’image d’une prière persistante, mais l’hébreu reste difficile ; la possibilité d’une image plus littérale de flux est donc explicitement conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe demeure proche du parallélisme hébreu, tandis que « est restée tendue » rend intelligible une image dont le sens littéral est signalé en note.
