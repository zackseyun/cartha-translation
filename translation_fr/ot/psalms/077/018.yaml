  text: ק֤וֹל רַעַמְ/ךָ֨ בַּ/גַּלְגַּ֗ל הֵאִ֣ירוּ בְרָקִ֣ים תֵּבֵ֑ל רָגְזָ֖ה וַ/תִּרְעַ֣שׁ הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/018.yaml
  text: The sound of your thunder was in the whirlwind[a]; lightning lit up the world; the earth trembled and quaked.
translation:
  language: fr
  text: Le grondement de ton tonnerre a retenti dans le tourbillon[a] ; les éclairs ont illuminé le monde ; la terre a tremblé et a été secouée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la roue » ; le mot hébreu évoque probablement ici une tempête tournoyante, d’où « dans le tourbillon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  choice: Le fracas de ton tonnerre
  rationale: קוֹל peut désigner la voix ou le son. Avec le tonnerre, « fracas » exprime naturellement en français sa manifestation sonore, tandis que le suffixe de deuxième personne est conservé par « ton ».
- source_word: בַּגַּלְגַּל
  choice: dans le tourbillon
  rationale: גַּלְגַּל désigne littéralement une roue ou ce qui tourne. Dans ce contexte de tonnerre et d’éclairs, le mot évoque vraisemblablement un tourbillon orageux, sans que l’image de rotation soit entièrement certaine.
- source_word: הֵאִירוּ בְרָקִים
  choice: les éclairs illuminaient
  rationale: Le hiphil de אור signifie « donner de la lumière, illuminer ». Le pluriel בְרָקִים est naturellement rendu par « les éclairs ».
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne le monde terrestre, souvent envisagé comme le monde habité. « Le monde » est ici concis et naturel.
- source_word: רָגְזָה
  choice: tremblait
  rationale: Le verbe exprime le tremblement ou l’agitation. « Tremblait » convient à la réaction de la terre dans cette théophanie.
- source_word: וַתִּרְעַשׁ
  choice: et était ébranlée
  rationale: רעש signifie trembler ou être secoué. Une formulation distincte de « tremblait » préserve l’intensification poétique produite par les deux verbes hébreux.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le cadre cosmique de la scène favorise « la terre » plutôt que le sens local possible de « pays ».
