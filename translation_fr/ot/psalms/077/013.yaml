base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/013.yaml
  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: fr
  text: Ô Dieu, ta voie est sainte[a] ; quel dieu est grand comme Dieu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta voie est dans le sanctuaire ». L’hébreu peut désigner soit la sainteté, soit le lieu saint.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le suffixe de deuxième personne dans « ta voie » favorise une adresse directe. En français, « Ô Dieu » exprime clairement le vocatif implicite.
- source_word: בַּקֹּדֶשׁ
  choice: dans la sainteté
  rationale: קֹדֶשׁ peut désigner la sainteté ou le sanctuaire. « Dans la sainteté » conserve ici le sens abstrait sans exclure l'autre lecture, signalée en note.
- source_word: דַּרְכֶּךָ
  choice: ta voie
  rationale: « Voie » rend naturellement דֶּרֶךְ et peut désigner aussi bien la manière d'agir de Dieu que le cours de son action.
- source_word: מִי אֵל גָּדוֹל
  choice: quel dieu est grand
  rationale: La tournure interrogative française rend la comparaison rhétorique de l'hébreu tout en gardant אֵל comme nom commun.
- source_word: כֵּאלֹהִים
  choice: comme Dieu
  rationale: Le préfixe כְּ marque la comparaison, et אֱלֹהִים désigne ici le Dieu unique dans le contexte.
theological_decisions:
- issue: Sens de בַּקֹּדֶשׁ
  choice: La voie de Dieu se situe dans la sainteté ou se caractérise par elle.
  alternative: La voie de Dieu est dans le sanctuaire.
  rationale: L'hébreu permet un sens abstrait ou locatif et cultuel. Le texte principal retient « sainteté », tandis que la note préserve explicitement la lecture « sanctuaire ».
translation_notes:
  register: Français moderne, digne et accessible. Le vocatif « Ô Dieu » clarifie l'adresse directe ; la question finale conserve la concision et la force rhétorique de l'hébreu.
