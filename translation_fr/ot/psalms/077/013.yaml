  terminology: « Dieu », « voie », « saint(e) » et « sanctuaire » conviennent au registre biblique moderne. « Quel dieu est grand comme Dieu ? » est fidèle mais légèrement lourd; « Quel dieu est grand comme toi ? » serait plus fluide mais remplacerait le nom divin final du texte hébreu par un pronom. On conserve donc « comme Dieu » pour une équivalence plus étroite.
