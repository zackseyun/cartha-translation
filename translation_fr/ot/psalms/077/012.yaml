  text: I will meditate on all your work[a], and I will ponder your deeds.
translation:
  language: fr
  text: Je méditerai sur toute ton œuvre et je réfléchirai[a] à tes actes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je parlerai de tes actes ». Le verbe hébreu peut désigner aussi bien la réflexion ou la méditation que le fait de parler ou de discourir ; ici, le parallélisme favorise le sens contemplatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: Je méditerai
  rationale: Le qal à la première personne du singulier de הגה exprime ici une réflexion attentive. Dans ce contexte poétique, la forme s’accorde naturellement avec une résolution tournée vers l’avenir.
- source_word: בְכָל־פָעֳלֶךָ
  choice: sur toute ton œuvre
  rationale: Avec un verbe de réflexion, בְּ introduit l’objet de la méditation. Le singulier פֹּעַל peut désigner collectivement l’ensemble de l’activité de Dieu ; « œuvre » conserve aussi la variation poétique avec le pluriel du second membre.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: à tes actes
  rationale: עֲלִילוֹת désigne des actes ou des actions. « Tes actes » est clair et fidèle sans ajouter l’idée interprétative de puissance.
- source_word: אָשִׂיחָה
  choice: je réfléchirai
  rationale: שיח peut évoquer la méditation intérieure ou la parole. « Réfléchirai » convient au parallélisme contemplatif tout en évitant de répéter « méditerai ».
