  text: לַ/מְנַצֵּ֥חַ עַֽל ידיתון לְ/אָסָ֥ף מִזְמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: fr
  text: Au chef de chœur, selon Yedoutoun[a]. Psaume d’Asaph[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Selon Yedoutoun » peut désigner un air, un style musical, un ensemble ou le groupe associé à Yedoutoun.
    reason: cultural_note
  - marker: b
    text: 'Ou : « Psaume pour Asaph ». La préposition hébraïque peut indiquer l’auteur, l’appartenance, l’association ou la destination.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. Cette formulation est claire, actuelle et digne.
- source_word: עַל
  choice: selon
  rationale: Dans un titre musical, la préposition peut introduire une indication d’air, de style, d’ensemble ou de tradition d’exécution; « selon » conserve cette ouverture.
- source_word: יְדוּתוּן
  choice: Yedoutoun
  rationale: Le nom propre hébreu est translittéré sous une forme usuelle et prononçable en français.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: Dans les titres des psaumes, la préposition peut signaler l’auteur, l’appartenance, l’association ou la destination. « d’Asaph » reste concise sans trancher entièrement entre ces rapports.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: « Psaume » est le terme français établi pour ce genre de chant accompagné.
theological_decisions:
- issue: Rapport entre le psaume et Asaph
  choice: Psaume d’Asaph
  alternative: Psaume pour Asaph
  rationale: Le לְ hébreu ne précise pas à lui seul s’il s’agit d’auteur, d’association, d’appartenance ou de destination. Le texte principal emploie la formulation française traditionnelle et naturelle, tandis qu’une note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et liturgiquement digne. Le titre reste concis; les ambiguïtés propres aux indications musicales et au lien avec Asaph sont conservées en notes.
