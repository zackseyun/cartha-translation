lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: tu as racheté
  rationale: Le verbe גאל exprime ici l’action de libérer ou de délivrer en tant que rédempteur. « Racheter » conserve cette forte portée biblique sans réduire le sens à une délivrance générique.
- source_word: בִּזְרוֹעַ
  choice: par ton bras
  rationale: La préposition a une valeur instrumentale, et « bras » préserve l’image hébraïque de la puissance divine en action.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: Traduction directe du nom עַם avec le suffixe de deuxième personne du masculin singulier.
- source_word: בְּנֵי
  choice: les fils de
  rationale: « Fils » rend formellement le terme hébreu dans cette désignation généalogique et nationale, sans expliciter davantage sa portée.
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: Jacob et Joseph
  rationale: Les deux noms sont conservés sans décider si Joseph représente certaines tribus ou s’il participe à une désignation poétique de tout Israël.
- source_word: סֶלָה
  choice: Pause
  rationale: Le mot est probablement une indication musicale ou liturgique. « Pause » en donne une représentation française intelligible tout en signalant en note que son sens exact demeure incertain.
theological_decisions:
- issue: Portée de « les fils de Jacob et de Joseph »
  choice: Conserver les deux noms sans en résoudre la fonction représentative.
  alternative: Traduire explicitement par « les descendants d’Israël », ou identifier Joseph aux tribus d’Éphraïm et de Manassé ou au royaume du Nord.
  rationale: L’hébreu juxtapose Jacob et Joseph sans expliquer précisément leur portée. La formulation retenue préserve cette ambiguïté historique et poétique.
translation_notes:
  register: Français moderne, sobre et poétique. L’image biblique du bras est conservée. « Pause » est placé comme indication finale autonome, sans ponctuation superflue après celle-ci.
