  text: Tu as racheté ton peuple par ton bras[a], les fils de Jacob et de Joseph[b]. Selah[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivré ». Le « bras » représente ici la puissance de Dieu à l’œuvre.
    reason: lexical_alternative
  - marker: b
    text: « Les fils de Jacob et de Joseph » est peut-être une manière poétique de désigner Israël, Joseph pouvant mettre particulièrement en relief les tribus issues de lui.
