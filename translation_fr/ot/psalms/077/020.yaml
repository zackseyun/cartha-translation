source:
  edition: WLC
  text: נָחִ֣יתָ כַ/צֹּ֣אן עַמֶּ֑/ךָ בְּֽ/יַד מֹשֶׁ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/020.yaml
  text: You led your people like a flock by the hand of Moses and Aaron[a][b].
translation:
  language: fr
  text: Tu as conduit ton peuple comme un troupeau[a], par la main de Moïse et d’Aaron[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme des brebis ». Le mot hébreu צאן est un terme collectif qui désigne un troupeau de petit bétail, notamment des moutons ou des chèvres.'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque signifie littéralement « par la main de Moïse et d’Aaron » ; elle indique ici leur rôle d’intermédiaires ou de conducteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחִיתָ
  choice: Tu as conduit
  rationale: Le verbe s’adresse directement à Dieu à la deuxième personne du masculin singulier et exprime l’action de mener ou de guider. « Tu as conduit » est naturel en français et s’accorde avec l’image pastorale qui suit.
- source_word: כַצֹּאן
  choice: comme un troupeau
  rationale: Le préfixe כ marque la comparaison. צאן est un nom collectif désignant le petit bétail, surtout les moutons et les chèvres ; « comme un troupeau » conserve l’image collective.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: עם désigne ici le peuple appartenant à Dieu, dans son cadre historique et relationnel. « Ton peuple » est la formulation française la plus directe.
- source_word: בְּיַד
  choice: par la main de
  rationale: La construction ב + יָד exprime l’intermédiaire ou l’agent. La traduction conserve l’image hébraïque de la main tout en indiquant que Moïse et Aaron sont les agents humains de la conduite divine.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Moïse et Aaron
  rationale: Les noms propres suivent leurs formes françaises traditionnelles et largement reconnues.
theological_decisions:
- issue: Rôle de Dieu, de Moïse et d’Aaron dans la conduite du peuple
  choice: Dieu est celui qui conduit son peuple ; Moïse et Aaron sont les intermédiaires humains par lesquels il le fait.
  alternative: Comprendre Moïse et Aaron comme de simples personnages accompagnant l’action, sans fonction d’intermédiaires.
  rationale: Le verbe à la deuxième personne s’adresse à Dieu comme acteur principal, tandis que l’expression בְּיַד introduit Moïse et Aaron comme agents ou intermédiaires. La traduction maintient ces deux dimensions sans les confondre.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement rend l’adresse directe à Dieu. « Par la main de » conserve volontairement l’image hébraïque, avec une note qui en explicite la valeur idiomatique.
