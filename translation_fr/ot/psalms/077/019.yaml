  text: בַּ/יָּ֤ם דַּרְכֶּ֗/ךָ ו/שבילי/ך בְּ/מַ֣יִם רַבִּ֑ים וְ֝/עִקְּבוֹתֶ֗י/ךָ לֹ֣א נֹדָֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: fr
  text: Ton chemin passait par la mer[a], tes sentiers par les grandes eaux, et tes traces n’ont pas été connues[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était dans la mer » et, dans la suite du verset, « dans les grandes eaux ». La préposition hébraïque peut marquer le lieu, mais elle peut aussi présenter les eaux comme l’espace par lequel passe le chemin.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tes traces n’ont pas été connues ». On peut aussi comprendre : « tes empreintes n’ont pas été vues » ou « tes pas n’ont pas été repérés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: par la mer
  rationale: La préposition בְּ peut désigner le lieu (« dans ») ou le parcours. Avec « chemin », « par la mer » exprime naturellement en français un itinéraire au milieu de la mer tout en conservant la concision poétique.
- source_word: דַּרְכֶּךָ
  choice: ton chemin
  rationale: דֶּרֶךְ désigne un chemin ou une voie. « Ton chemin » conserve ici à la fois l’image concrète du passage et sa portée plus large.
- source_word: שביליך
  choice: tes sentiers
  rationale: שְׁבִיל désigne un sentier ou une piste. « Sentiers » maintient le parallélisme avec « chemin » sans confondre ce terme avec les traces du dernier membre.
- source_word: בְּמַיִם רַבִּים
  choice: par les eaux profondes
  rationale: מַיִם רַבִּים peut désigner des eaux nombreuses, abondantes ou vastes. En français biblique naturel, « les eaux profondes » évoque leur immensité et leur puissance sans alourdir le vers.
- source_word: עִקְּבוֹתֶיךָ
  choice: tes traces
  rationale: Le nom peut désigner des empreintes, des pas ou des traces. « Traces » convient particulièrement à l’idée qu’aucun vestige du passage ne pouvait être identifié.
- source_word: לֹא נֹדָעוּ
  choice: n’ont pas été reconnues
  rationale: Le nifal de ידע signifie littéralement « ne furent pas connues ». « N’ont pas été reconnues » reste proche de cette formulation et laisse ouverte la nuance entre invisibilité, absence d’identification et impossibilité de suivre ces traces.
theological_decisions:
- issue: Degré d’explicitation de l’évocation de l’Exode
  choice: Conserver l’image poétique du chemin de Dieu par la mer sans nommer explicitement la traversée de la mer.
  alternative: Identifier directement dans le texte la traversée accomplie lors de l’Exode.
  rationale: Le contexte évoque la délivrance à travers les eaux, mais le verset formule cette action poétiquement. Maintenir l’image préserve la tension entre l’intervention réelle de Dieu et le caractère insaisissable de ses traces.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé, avec une syntaxe fluide et sans explicitation confessionnelle.
