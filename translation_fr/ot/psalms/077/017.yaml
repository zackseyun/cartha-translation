  text: זֹ֤רְמוּ מַ֨יִם עָב֗וֹת ק֭וֹל נָתְנ֣וּ שְׁחָקִ֑ים אַף חֲ֝צָצֶ֗י/ךָ יִתְהַלָּֽכוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/017.yaml
  text: The clouds poured out water; the skies gave forth a sound; indeed[a], your arrows moved about.
translation:
  language: fr
  text: Les nuages déversèrent de l’eau ; les cieux firent entendre leur voix ; même tes flèches[a] allaient et venaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes éclairs allaient et venaient ». L’hébreu dit « tes flèches » ; dans ce contexte de manifestation divine au sein de l’orage, l’image évoque probablement les éclairs.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרְמוּ
  choice: déversèrent
  rationale: Le verbe exprime un écoulement abondant ou jaillissant. « Déversèrent » rend naturellement la force de l’image avec les eaux comme complément.
- source_word: מַיִם
  choice: leurs eaux
  rationale: Le pluriel « eaux » convient au registre poétique français et le possessif explicite la relation naturelle avec les nuages sans modifier le sens.
- source_word: עָבוֹת
  choice: les nuages
  rationale: Le nom désigne des masses nuageuses épaisses. « Les nuages » est clair et naturel, tandis que le contexte d’orage suggère déjà leur densité.
- source_word: קוֹל נָתְנוּ
  choice: firent entendre leur voix
  rationale: L’expression signifie littéralement « donnèrent une voix/un son ». Cette formulation française conserve la personnification poétique sans remplacer explicitement la voix par le tonnerre.
- source_word: שְׁחָקִים
  choice: les cieux
  rationale: Le terme peut désigner le ciel ou les nuées. « Les cieux » maintient la distinction poétique avec עָבוֹת, rendu par « les nuages ».
- source_word: אַף
  choice: aussi
  rationale: La particule ajoute ici un élément avec une nuance d’insistance. « Aussi » s’intègre naturellement à la progression du vers.
- source_word: חֲצָצֶיךָ
  choice: tes flèches
  rationale: Le mot désigne proprement des flèches, probablement comme image des éclairs dans cette manifestation divine au sein de l’orage. Le texte principal conserve l’image hébraïque et la note en indique le sens possible.
- source_word: יִתְהַלָּכוּ
  choice: allaient en tous sens
  rationale: La forme exprime un mouvement répété ou dans diverses directions. Cette traduction reste compatible aussi bien avec l’image des flèches qu’avec celle des éclairs.
theological_decisions:
- issue: 'Imagerie de la manifestation divine : flèches littérales ou métaphore des éclairs'
  choice: Conserver « tes flèches » dans le texte principal, en laissant le contexte d’orage évoquer les éclairs.
  alternative: Traduire directement par « tes éclairs ».
  rationale: Le terme hébreu signifie proprement « flèches ». Le contexte météorologique favorise une lecture métaphorique, mais la conserver en note évite de résoudre dans le texte une image poétique que l’hébreu maintient.
translation_notes:
  register: Français moderne, poétique et digne. Le passé simple soutient le registre psalmique sans archaïsme marqué ; « firent entendre leur voix » conserve la personnification, et « allaient en tous sens » reste immédiatement compréhensible.
