revisions:
- from: Les nuages déversèrent leurs eaux ; les cieux firent entendre leur voix ; tes flèches[a] aussi allaient en tous sens.
  to: Les nuages déversèrent de l’eau ; les cieux firent entendre leur voix ; même tes flèches[a] allaient et venaient.
  rationale: La révision retire un possessif non exprimé, restitue l’emphase de אַף par « même » et rend le mouvement des flèches de façon moins directive. Elle maintient l’ambiguïté poétique entre flèches et éclairs, l’interprétation météorologique restant dans la note.
