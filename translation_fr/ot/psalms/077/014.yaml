source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: fr
  text: Tu es le Dieu qui accomplit des merveilles ; tu as fait connaître ta puissance parmi les peuples[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les nations ». Le mot hébreu peut désigner des peuples ou des nations.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: le Dieu
  rationale: 'L’article défini donne à l’expression une valeur emphatique et identificatrice : « C’est toi, le Dieu… »'
- source_word: עֹשֵׂה פֶלֶא
  choice: qui accomplit des merveilles
  rationale: Le participe exprime une action caractéristique. Le singulier פֶלֶא peut avoir une valeur collective ; le pluriel français « des merveilles » rend naturellement l’ensemble des actes extraordinaires de Dieu.
- source_word: הוֹדַעְתָּ
  choice: tu as fait connaître
  rationale: 'Le hifil de ידע est causatif : « faire connaître ». Le passé composé convient au rappel poétique d’un acte accompli dont la manifestation demeure pertinente.'
- source_word: בָעַמִּים
  choice: parmi les peuples
  rationale: La préposition ב est rendue directement par « parmi », et עַמִּים par « peuples », terme large qui n’impose pas une lecture géopolitique.
- source_word: עֻזֶּךָ
  choice: ta puissance
  rationale: עֹז désigne la force, la puissance ou la vigueur. « Puissance » s’accorde naturellement avec la manifestation publique des actes divins.
theological_decisions:
- issue: Portée de la manifestation divine dans בָעַמִּים
  choice: parmi les peuples
  alternative: parmi les nations ; aux peuples
  rationale: Cette formulation conserve la portée collective et publique du texte ainsi que la valeur locative de la préposition, sans préciser davantage le cadre théologique.
translation_notes:
  register: Français moderne, international et digne. La tournure disloquée « C’est toi, le Dieu… » restitue l’emphase du pronom initial. « Accomplit des merveilles » reste poétique sans être archaïque.
