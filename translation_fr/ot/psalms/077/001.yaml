  text: קוֹלִ֣/י אֶל אֱלֹהִ֣ים וְ/אֶצְעָ֑קָה קוֹלִ֥/י אֶל אֱ֝לֹהִ֗ים וְ/הַאֲזִ֥ין אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/001.yaml
  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: fr
  text: Ma voix s’élève vers Dieu, et je crie ; ma voix s’élève vers Dieu, et il tend l’oreille vers moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « afin qu’il tende l’oreille vers moi » ou « qu’il tende l’oreille vers moi » ; la forme verbale hébraïque peut ici être comprise comme exprimant le but ou le souhait.'
    reason: ambiguïté grammaticale
lexical_decisions:
- source_word: קוֹלִי
  choice: j’élève ma voix
  rationale: Le texte dit littéralement « ma voix » et le répète. En français, « j’élève ma voix » exprime naturellement l’élan implicite vers Dieu tout en conservant l’image et la répétition poétique.
- source_word: אֶל אֱלֹהִים
  choice: vers Dieu
  rationale: La préposition אֶל marque ici la direction de la voix; « vers Dieu » rend clairement ce mouvement en français.
- source_word: וְאֶצְעָקָה
  choice: et je crie
  rationale: Le verbe צעק exprime un cri intense, souvent un appel au secours. Le présent convient à l’expression poétique vive du verset.
- source_word: וְהַאֲזִין אֵלָי
  choice: et il m’écoute
  rationale: Le verbe אזן désigne une écoute attentive. « Il m’écoute » est naturel en français et garde Dieu comme sujet selon la lecture déclarative traditionnelle, sans alourdir la phrase.
theological_decisions:
- issue: Valeur de la dernière proposition
  choice: Le psalmiste affirme que Dieu l’écoute.
  alternative: « pour qu’il m’écoute » ou « qu’il m’écoute »
  rationale: La construction hébraïque permet une lecture déclarative, mais sa forme poétique peut aussi exprimer le but ou le souhait. La traduction principale suit la lecture déclarative, tandis que la note préserve l’autre possibilité sans trancher une tension réelle du texte.
translation_notes:
  register: Français moderne, digne et accessible. La répétition exacte de « j’élève ma voix vers Dieu » restitue le parallélisme insistant de l’hébreu; le point-virgule marque les deux membres du verset.
