  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: fr
  text: Je me souviendrai des hauts faits de Yah[a] ; car je me rappellerai tes merveilles d’autrefois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je raconterai les hauts faits de Yah ». Le verbe peut aussi évoquer le fait de mentionner ou de rappeler à voix haute.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes merveilles des temps anciens » ou « tes merveilles d’il y a longtemps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Je me souviendrai
  rationale: Le hiphil de זכר peut signifier « faire mémoire », « mentionner » ou « raconter ». Ici, le parallélisme avec אֶזְכְּרָה favorise l’idée d’un acte délibéré de remémoration, tout en laissant en note la possibilité d’une évocation à voix haute.
- source_word: מַעַלְלֵי
  choice: hauts faits
  rationale: מַעֲלָלִים désigne des actions ou des œuvres. « Hauts faits » convient au contexte des actes remarquables de Dieu et maintient un registre poétique digne sans être archaïque.
- source_word: יָהּ
  choice: Yah
  rationale: Le texte emploie la forme poétique abrégée du nom divin, יָהּ, et non le tétragramme complet יהוה. « Yah » préserve cette distinction.
- source_word: כִּי
  choice: oui
  rationale: Dans ce parallélisme poétique, כִּי peut avoir une valeur emphatique plutôt que strictement causale. « Oui » exprime la résolution renouvelée du psalmiste sans imposer un lien logique absent du contexte immédiat.
- source_word: אֶזְכְּרָה
  choice: je me rappellerai
  rationale: Cette forme à nuance volitive exprime une ferme résolution à se souvenir. « Je me rappellerai » est naturel en français et la variation verbale évite une répétition lourde tout en conservant le parallélisme.
- source_word: מִקֶּדֶם
  choice: d’autrefois
  rationale: L’expression renvoie aux temps anciens ou passés. « D’autrefois » est idiomatique, poétique et n’implique pas nécessairement le commencement absolu.
- source_word: פִּלְאֶךָ
  choice: tes merveilles
  rationale: Le nom פלא désigne un prodige ou un acte merveilleux. Le pluriel français rend naturellement la valeur collective dans ce contexte et correspond au parallélisme avec les hauts faits.
theological_decisions:
- issue: Traduction de la forme poétique abrégée du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: La forme source est יָהּ et non יהוה. La translittération « Yah » conserve la distinction voulue par le texte hébreu sans assimiler silencieusement les deux formes.
- issue: Valeur de כִּי entre les deux propositions
  choice: oui
  alternative: car
  rationale: כִּי peut introduire une explication ou marquer une insistance. Le parallélisme et la répétition de זכר favorisent ici une reprise emphatique, mais la lecture causale reste grammaticalement possible.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est maintenu par les deux verbes de mémoire, avec une variation française naturelle. Le point-virgule marque les deux membres du vers.
