id: PSA.77.7
reference: Psalms 77:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: fr
  text: Le Seigneur rejettera-t-il[a] pour toujours et ne se montrera-t-il plus jamais favorable ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « repoussera-t-il » ou « abandonnera-t-il ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: pour toujours
  rationale: La particule interrogative הַ introduit une question rhétorique, tandis que לְעוֹלָמִים exprime une durée sans fin. « Pour toujours » est l’équivalent français naturel et conserve la portée angoissée de la question.
- source_word: יִזְנַח
  choice: rejettera-t-il
  rationale: Le verbe זנח signifie rejeter, repousser ou abandonner. « Rejeter » est clair et actuel, tout en gardant l’idée d’une rupture relationnelle.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: אֲדֹנָי est ici le titre divin Adonaï, et non le nom divin YHWH. « Le Seigneur » traduit naturellement ce titre en français.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: et ne ... plus jamais
  rationale: La construction négative avec יסף et עוֹד indique que l’action ne se reproduirait ou ne se poursuivrait plus. « Ne… plus jamais » en restitue la force dans un français idiomatique.
- source_word: לִרְצוֹת
  choice: se montrera ... favorable
  rationale: Dans ce contexte, רצה exprime une disposition favorable ou bienveillante. « Se montrer favorable » rend cette nuance relationnelle sans réduire le sens au simple fait d’éprouver du plaisir.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Adonaï
  rationale: Le texte emploie un titre divin plutôt que le nom propre YHWH. Traduire ce titre par « le Seigneur » est naturel en français et évite de le confondre avec le tétragramme.
- issue: Portée de la question sur le rejet divin
  choice: Conserver la formulation interrogative sans la résoudre
  alternative: Transformer la question en affirmation implicite que Dieu ne rejettera pas pour toujours
  rationale: Le verset exprime l’angoisse du psalmiste sous forme de question rhétorique. La traduction préserve cette tension théologique au lieu d’ajouter explicitement une réponse absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion interrogative maintient le ton poétique et solennel du psaume sans archaïsme; « plus jamais » restitue avec force la combinaison négative de יסף et עוֹד.
