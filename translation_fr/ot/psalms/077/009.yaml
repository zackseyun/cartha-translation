source:
  edition: WLC
  text: הֲ/שָׁכַ֣ח חַנּ֣וֹת אֵ֑ל אִם קָפַ֥ץ בְּ֝/אַ֗ף רַחֲמָ֥י/ו סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: fr
  text: Dieu a-t-il oublié de faire grâce ? A-t-il, dans sa colère, retenu ses compassions ? Sélah.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dieu a-t-il oublié d’accorder sa faveur ? Ou bien a-t-il, dans sa colère, fermé ses compassions ? »'
    reason: lexical_alternative
  - marker: b
    text: « Sélah » est probablement une indication liturgique ou musicale ; son sens précis reste incertain.
    reason: cultural_note
lexical_decisions:
- source_word: הֲ/שָׁכַח
  choice: a-t-il oublié
  rationale: La particule interrogative הֲ et le verbe שׁכח introduisent une question rhétorique. « A-t-il oublié » est naturel en français et conserve l’expression angoissée de la lamentation.
- source_word: חַנּוֹת
  choice: de faire grâce
  rationale: L’infinitif de חנן exprime l’action d’accorder grâce ou faveur. « Faire grâce » préserve ce champ lexical tout en restant clair et digne en français moderne.
- source_word: אֵל
  choice: Dieu
  rationale: אֵל est ici un titre divin courant. « Dieu » est la traduction française directe et idiomatique.
- source_word: אִם
  choice: a-t-il
  rationale: Après la première interrogation, אִם introduit une seconde question parallèle. Une nouvelle tournure interrogative est naturelle en français ; la nuance alternative « ou bien » est signalée en note.
- source_word: קָפַץ
  choice: a-t-il fermé son cœur à
  rationale: קָפַץ évoque l’action de fermer ou de retenir. Appliqué à la compassion, « fermer son cœur à » conserve l’image concrète sans produire la tournure peu naturelle « fermer sa compassion ».
- source_word: בְּ/אַף
  choice: dans sa colère
  rationale: אַף signifie littéralement « nez », puis par extension « colère ». « Dans sa colère » rend clairement le sens contextuel.
- source_word: רַחֲמָיו
  choice: la compassion
  rationale: Le pluriel morphologique רַחֲמָיו fonctionne ici comme un collectif abstrait désignant la compassion ou les marques de miséricorde de Dieu. L’appartenance est déjà portée en français par « son cœur » ; une traduction plus formelle figure en note.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis du terme reste incertain. Sa translittération, adaptée à l’orthographe française, évite une traduction conjecturale.
theological_decisions:
- issue: Questions rhétoriques ou affirmations
  choice: Deux questions rhétoriques exprimant la détresse du psalmiste
  alternative: Des affirmations telles que « Dieu a oublié… »
  rationale: La particule interrogative et le parallélisme poétique favorisent deux questions. Les transformer en affirmations durcirait la plainte et supprimerait une tension voulue du texte.
- issue: Image de Dieu fermant ses compassions
  choice: 'Conserver l’image sous une forme française idiomatique : « fermé son cœur à la compassion »'
  alternative: Interpréter directement par « retenu sa miséricorde »
  rationale: La formulation choisie maintient la force concrète du verbe קָפַץ sans décider que la compassion divine aurait cessé d’exister ; elle exprime la perception angoissée du psalmiste.
translation_notes:
  register: Français moderne international, naturel et digne. Les deux interrogations et leur tension théologique sont conservées. « Faire grâce » maintient le vocabulaire biblique sans archaïsme marqué ; « fermer son cœur à la compassion » transpose idiomatiquement la métaphore hébraïque.
