  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: fr
  text: Je me souviens, la nuit, de mon chant[a] ; je médite dans mon cœur[b], et mon esprit[c] cherche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ma mélodie » ou « de ma musique ».
    reason: lexical_alternative
  - marker: b
    text: Ou « je m’entretiens avec mon cœur » ; le verbe hébreu peut évoquer aussi bien la méditation intérieure qu’un entretien réfléchi.
    reason: lexical_alternative
  - marker: c
    text: Ou « mon être intérieur » ; ici, l’« esprit » désigne le moi profond du psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Je me souviens
  rationale: L’imparfait hébreu peut avoir une valeur présente, future ou volitive. Dans cette évocation introspective, le présent exprime naturellement le souvenir qui occupe le psalmiste.
- source_word: נְגִינָתִי
  choice: de mon chant
  rationale: נְגִינָה peut désigner un chant, une mélodie ou de la musique instrumentale. « Mon chant » convient au contexte poétique sans exclure la dimension musicale.
- source_word: בַּלָּיְלָה
  choice: pendant la nuit
  rationale: Cette formulation restitue la valeur temporelle de la préposition et conserve l’atmosphère nocturne du verset.
- source_word: עִם לְבָבִי
  choice: avec mon cœur
  rationale: Le rendu conserve la préposition עִם (« avec ») et la personnification du cœur comme partenaire de la réflexion, malgré une tournure volontairement poétique en français.
- source_word: אָשִׂיחָה
  choice: je médite
  rationale: Le verbe שׂיח peut évoquer la méditation, la réflexion ou un entretien intérieur. « Je médite » correspond ici au mouvement introspectif tout en laissant l’alternative en note.
- source_word: וַיְחַפֵּשׂ
  choice: cherche
  rationale: Le verbe חפשׂ exprime une recherche attentive ou un examen. Le présent maintient la progression réflexive du passage, et l’absence de complément préserve celle du texte hébreu.
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ désigne ici le moi intérieur du psalmiste plutôt que le vent ou le souffle. « Esprit » préserve l’étendue anthropologique du terme.
theological_decisions:
- issue: Rapport entre le cœur, l’esprit et le moi du psalmiste
  choice: Conserver « mon cœur » et « mon esprit » comme deux expressions distinctes du monde intérieur
  alternative: Les fondre en « moi-même » ou « mon être intérieur »
  rationale: Le parallélisme hébreu distingue לֵבָב et רוּחַ sans nécessairement définir deux composantes séparées de la personne. La traduction maintient cette tension poétique sans imposer une anthropologie systématique.
translation_notes:
  register: 'Français moderne, sobre et poétique. La tournure « je médite avec mon cœur » conserve délibérément l’image et la préposition hébraïques ; la note signale l’autre lecture naturelle, celle d’un entretien intérieur. La ponctuation fait ressortir les trois mouvements parallèles : souvenir, méditation et recherche.'
