source:
  edition: WLC
  text: הֶ/אָפֵ֣ס לָ/נֶ֣צַח חַסְדּ֑/וֹ גָּ֥מַר אֹ֝֗מֶר לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: fr
  text: Son amour fidèle a-t-il cessé pour toujours ? Sa promesse a-t-elle pris fin de génération en génération[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Sa parole a-t-elle pris fin de génération en génération ? »
    reason: 'Alternative lexicale : אֹמֶר signifie littéralement « parole » ou « déclaration », même si « promesse » paraît probable dans ce contexte.'
lexical_decisions:
- source_word: הֶאָפֵס
  choice: a-t-il cessé
  rationale: Le parfait précédé de l’interrogatif demande si quelque chose a entièrement cessé ou disparu. « A-t-il cessé » est naturel en français et conserve la force angoissée de la question.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Cette expression temporelle désigne une durée sans fin ou permanente. « Pour toujours » est clair, courant et fidèle au caractère radical de la lamentation.
- source_word: חַסְדּוֹ
  choice: son amour fidèle
  rationale: חֶסֶד exprime ici l’amour loyal, constant et engagé de Dieu. « Amour fidèle » rend ces dimensions sans archaïsme ni terminologie confessionnelle trop spécialisée.
- source_word: גָּמַר
  choice: a-t-elle pris fin
  rationale: Le verbe évoque l’achèvement ou la cessation. « Prendre fin » convient naturellement à une promesse et maintient l’idée redoutée de son interruption.
- source_word: אֹמֶר
  choice: sa promesse
  rationale: Le nom signifie littéralement « parole » ou « déclaration », mais, dans ce parallèle sur la fidélité divine, il désigne probablement une parole donnée. « Promesse » explicite ce sens contextuel, tandis que « parole » est conservé en note.
- source_word: לְדֹר וָדֹר
  choice: pour toutes les générations
  rationale: L’expression idiomatique évoque la succession continue des générations. Cette formulation française naturelle préserve la portée durable de la question sans suggérer une cessation répétée à chaque génération.
theological_decisions:
- issue: Faut-il rendre אֹמֶר formellement par « parole » ou contextuellement par « promesse » ?
  choice: promesse
  alternative: parole
  rationale: Dans le parallélisme avec l’amour fidèle de Dieu, le terme paraît désigner sa parole donnée plutôt qu’une parole quelconque. « Promesse » exprime ce sens probable, mais la note maintient l’alternative plus littérale afin de ne pas supprimer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux questions parallèles gardent la tension de la lamentation sans affirmer que l’amour ou la parole de Dieu ont réellement cessé.
