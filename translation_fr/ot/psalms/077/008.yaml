  source_fidelity: 'Le premier membre rend fidèlement הֶאָפֵס ... חַסְדּוֹ : « Son amour fidèle a-t-il cessé pour toujours ? » conserve l''interrogation, la cessation redoutée et la permanence exprimée par לָנֶצַח. Le second membre rend correctement גָּמַר par « a-t-elle pris fin ». « Promesse » est une explicitation contextuellement plausible d’אֹמֶר, dont l’alternative plus littérale est à juste titre donnée en note.'
  naturalness: Le français est globalement naturel, sobre et adapté au registre poétique de la lamentation. Toutefois, « pour toutes les générations » peut se comprendre comme une portée universelle (« pour l’ensemble des générations ») plutôt que comme la durée successive exprimée par לְדֹר וָדֹר. « De génération en génération » est l’équivalent idiomatique français le plus direct et conserve le mouvement répétitif de l’hébreu.
  terminology: « Amour fidèle » rend bien חֶסֶד sans imposer une terminologie confessionnelle. « Promesse » est recevable, à condition de maintenir la note pour « parole », ce que fait la révision.
