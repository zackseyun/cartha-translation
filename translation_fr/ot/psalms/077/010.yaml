    rationale: La note actuelle ajoute « Voici ce qui me fait souffrir », alors que l’alternative concerne surtout la lecture de שְׁנוֹת comme « changement » et sa relation à « la droite du Très-Haut ». Une note plus directe préserve mieux les deux analyses.
