  text: וָ֭/אֹמַר חַלּ֣וֹתִ/י הִ֑יא שְׁ֝נ֗וֹת יְמִ֣ין עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/010.yaml
  text: 'Then I said[b][a], “This is my grief: the years of the right hand of the Most High.”'
translation:
  language: fr
  text: 'Alors j’ai dit : « C’est là mon mal[a] : les années de la droite du Très-Haut[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ma faiblesse » ou « ma maladie ». Le mot hébreu est difficile et peut désigner une affliction, une faiblesse ou une maladie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le changement de la droite du Très-Haut ». Certains comprennent l’hébreu comme disant que la droite du Très-Haut a changé, plutôt que comme « les années de sa droite ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: Alors j’ai dit
  rationale: Le wayyiqtol introduit une nouvelle étape dans la réflexion du psalmiste; « Alors » exprime naturellement cette progression.
- source_word: חַלּוֹתִי
  choice: mon mal
  rationale: Le terme difficile peut évoquer l’affliction, la faiblesse ou la maladie. « Mon mal » conserve cette amplitude sans préciser indûment s’il s’agit de souffrance physique ou morale.
- source_word: הִיא
  choice: Voici
  rationale: Le pronom féminin désigne la situation que le psalmiste identifie. « Voici » produit en français une formulation elliptique et poétique proche de l’hébreu.
- source_word: שְׁנוֹת
  choice: les années où … agissait
  rationale: Le nom se comprend le plus naturellement comme « années ». L’ajout syntaxique de « où … agissait » rend intelligible en français la relation condensée entre les années et la droite divine, tout en maintenant l’autre analyse, « changement », en note.
- source_word: יְמִין
  choice: la droite
  rationale: « La droite » est une expression biblique française naturelle qui garde l’image de la puissance et de l’action salvatrice de Dieu.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Titre divin consacré en français, fidèle à l’idée d’élévation suprême.
theological_decisions:
- issue: Interprétation de la proposition « שְׁנוֹת יְמִין עֶלְיוֹן »
  choice: les années où la droite du Très-Haut agissait
  alternative: le changement de la droite du Très-Haut
  rationale: La lecture de שְׁנוֹת comme « années » est morphologiquement directe, mais la construction hébraïque demeure très condensée. La note conserve l’analyse concurrente selon laquelle le psalmiste déplorerait un changement dans l’action puissante de Dieu.
- issue: Nature de l’état exprimé par חַלּוֹתִי
  choice: mon mal
  alternative: ma faiblesse; ma maladie
  rationale: Le contexte de lamentation favorise une désignation générale de l’affliction. Le choix évite de déterminer sans certitude si celle-ci est physique, morale ou spirituelle.
translation_notes:
  register: Français international moderne, digne et poétique. « La droite » et « le Très-Haut » conservent l’imagerie et le titre divin bibliques sans archaïsme excessif. Les deux notes sont appelées dans le texte et rendent visibles les principales ambiguïtés lexicales et syntaxiques.
