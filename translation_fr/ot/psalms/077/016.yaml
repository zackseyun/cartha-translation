source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: fr
  text: 'Les eaux t’ont vu, ô Dieu,

    les eaux t’ont vu et ont frémi[a] ;

    même les profondeurs[b] ont tremblé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont tordues de douleur », « ont été saisies d’angoisse » ou « ont tremblé ». Le verbe hébreu peut évoquer des secousses convulsives ou les douleurs de l’enfantement.
    reason: lexical_alternative
  - marker: b
    text: Ou « les eaux profondes » ou « les abîmes ». Le mot hébreu désigne les profondeurs des eaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: t’ont vu
  rationale: Le qal accompli de ראה avec suffixe de deuxième personne du masculin singulier signifie directement « t’ont vu ». La répétition est conservée pour respecter l’insistance poétique.
- source_word: מַיִם
  choice: les eaux
  rationale: « Les eaux » rend naturellement le pluriel hébreu et sa personnification dans ce contexte cosmique. Le terme est répété comme dans le parallélisme hébreu.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom a ici une valeur vocative. « Ô Dieu » marque clairement l’adresse directe dans un registre poétique digne.
- source_word: יָחִילוּ
  choice: ont frémi
  rationale: Le verbe חול/חיל peut évoquer le frémissement, les convulsions ou les douleurs de l’enfantement. « Ont frémi » reste naturel en français tout en exprimant l’agitation physique des eaux.
- source_word: אַף
  choice: même
  rationale: 'La particule renforce la progression : non seulement les eaux, mais même les profondeurs réagissent à la présence de Dieu.'
- source_word: יִרְגְּזוּ
  choice: ont tremblé
  rationale: רגז exprime couramment le tremblement ou l’ébranlement. « Ont tremblé » est clair et maintient une légère distinction avec « ont frémi ».
- source_word: תְהֹמוֹת
  choice: les profondeurs
  rationale: Le pluriel de תהום désigne les eaux profondes ou les profondeurs océaniques. « Les profondeurs » est actuel et conserve l’imagerie cosmique sans ajouter d’interprétation.
theological_decisions:
- issue: Personnification des eaux cosmiques devant Dieu
  choice: Conserver les eaux et les profondeurs comme des réalités personnifiées qui réagissent à la présence de Dieu.
  alternative: Limiter explicitement le verset au passage de la mer Rouge, ou le présenter comme un combat contre des puissances marines mythiques.
  rationale: Le texte poétique représente la création elle-même saisie devant Dieu. La traduction préserve cette image et laisse ouvertes ses associations historiques ou cosmologiques sans les imposer.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et la répétition de l’hébreu sont conservés. « Ô Dieu » explicite le vocatif, tandis que « frémi » et « tremblé » maintiennent la progression sans uniformiser les deux verbes.
