  text: אֶזְכְּרָ֣ה אֱלֹהִ֣ים וְ/אֶֽהֱמָיָ֑ה אָשִׂ֓יחָה וְ/תִתְעַטֵּ֖ף רוּחִ֣/י סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: fr
  text: Je me souviens de Dieu et je gémis ; je médite[a], et mon esprit défaille[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me plains ». Le verbe hébreu peut désigner une méditation intérieure ou l’expression d’une plainte.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon esprit est accablé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: Je me souviens
  rationale: La forme imperfective à nuance possiblement volitive peut exprimer une action présente, future ou souhaitée. Dans cette plainte, le présent rend naturellement l’action intérieure en cours sans éliminer entièrement sa portée poétique.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, le mot désigne au singulier le Dieu d’Israël.
- source_word: וְאֶהֱמָיָה
  choice: et je gémis
  rationale: Le verbe המה évoque une agitation audible ou une plainte. « Je gémis » convient au contexte de détresse et reste naturel en français.
- source_word: אָשִׂיחָה
  choice: je médite
  rationale: Dans la poésie de lamentation, שיח peut désigner la réflexion, la méditation ou l’expression d’une plainte. « Je médite » préserve ici le mouvement intérieur, tandis qu’une note signale l’autre possibilité.
- source_word: וְתִתְעַטֵּף
  choice: défaille
  rationale: Le hitpael de עטף peut exprimer l’affaiblissement ou le fait d’être accablé. « Mon esprit défaille » rend de manière concise et idiomatique cet effondrement intérieur.
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ peut signifier le vent, le souffle ou l’esprit. Ici, « mon esprit » désigne le for intérieur du psalmiste plutôt que sa seule respiration.
- source_word: סֶלָה
  choice: Sélah
  rationale: La fonction précise de ce terme liturgique ou musical demeure incertaine ; il est donc translittéré plutôt que traduit conjecturalement.
