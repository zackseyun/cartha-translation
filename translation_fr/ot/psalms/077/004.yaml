  text: אָ֭חַזְתָּ שְׁמֻר֣וֹת עֵינָ֑/י נִ֝פְעַ֗מְתִּי וְ/לֹ֣א אֲדַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/004.yaml
  text: You have held my eyelids open[b][a]; I am troubled and cannot speak.
translation:
  language: fr
  text: Tu as tenu mes paupières ouvertes[a] ; je suis bouleversé[b] et ne peux pas parler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Tu as tenu les veilles de mes yeux. » Cette expression hébraïque difficile semble désigner ce qui empêche les yeux du psalmiste de se fermer pour dormir.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je suis agité » ; « je suis profondément troublé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Tu tiens
  rationale: Le qal accompli, 2e personne masculine singulière, s’adresse à Dieu. En français, le présent rend naturellement l’état qui résulte de son action et s’intègre à l’image des paupières maintenues ouvertes.
- source_word: שְׁמֻרוֹת עֵינָי
  choice: mes paupières ouvertes
  rationale: L’expression signifie littéralement « les veilles/gardes de mes yeux ». Dans ce contexte d’insomnie, elle désigne vraisemblablement ce qui empêche les yeux de se fermer. La formulation française exprime clairement l’image sans masquer le caractère difficile de l’hébreu, signalé en note.
- source_word: נִפְעַמְתִּי
  choice: je suis bouleversé
  rationale: Le nifal exprime ici une profonde agitation intérieure. « Bouleversé » reste assez large pour ne pas préciser indûment s’il s’agit de détresse, d’agitation ou de désarroi.
- source_word: וְלֹא אֲדַבֵּר
  choice: et ne peux pas parler
  rationale: La forme signifie littéralement « et je ne parle pas », mais le contexte suggère que le trouble rend le psalmiste incapable de parler plutôt qu’il ne choisit de garder le silence.
theological_decisions:
- issue: L’action divine dans l’insomnie du psalmiste
  choice: 'Conserver Dieu comme sujet direct : « Tu tiens mes paupières ouvertes »'
  alternative: 'Formulation impersonnelle : « Mes paupières restent ouvertes »'
  rationale: La deuxième personne du verbe attribue explicitement l’action à Dieu. La traduction préserve cette tension théologique sans l’atténuer.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle à Dieu habituelle dans les psaumes. Le rythme en deux propositions conserve la progression de l’insomnie vers le bouleversement, puis l’impossibilité de parler.
