  source_fidelity: La traduction rend bien l’adresse directe à Dieu, l’image de l’insomnie, l’agitation du psalmiste et l’incapacité de parler. Toutefois, « Tu tiens » neutralise l’accompli hébreu אָחַזְתָּ (« tu as tenu / maintenu »). Un passé composé conserve mieux l’aspect de l’action accomplie dont l’état présent résulte.
  naturalness: La formulation est claire et digne en français moderne. « Tu as tenu mes paupières ouvertes » reste naturelle dans le registre poétique du psaume; « je suis bouleversé et ne peux pas parler » est idiomatique.
  terminology: « Paupières » exprime de manière naturelle l’interprétation usuelle de l’expression difficile שְׁמֻרוֹת עֵינָי. La note doit toutefois présenter cette interprétation comme probable, sans affirmer que l’expression « signifie » exclusivement cela. « Bouleversé » rend de façon recevable l’agitation du nifal נִפְעַמְתִּי, et la note conserve des possibilités voisines.
