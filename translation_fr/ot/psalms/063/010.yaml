  text: יַגִּירֻ֥/הוּ עַל יְדֵי חָ֑רֶב מְנָ֖ת שֻׁעָלִ֣ים יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/010.yaml
  text: They will be given over to the power of the sword[b][a]; they will become a portion for foxes.
translation:
  language: fr
  text: Ils seront livrés au pouvoir de l’épée[a] ; ils deviendront la part des renards[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Ils le répandront par le moyen de l’épée. » L’hébreu emploie ici un verbe actif au pluriel avec un objet singulier (« le »), puis un verbe au pluriel (« ils deviendront ») dans la proposition suivante.'
    reason: ambiguïté grammaticale et rendu littéral
  - marker: b
    text: 'Ou : « des chacals ». Le mot hébreu peut désigner des renards, mais certains y comprennent un terme plus large pour des canidés, dans ce contexte de mort et de désolation.'
    reason: alternative lexicale
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: ils seront livrés
  rationale: La forme hébraïque évoque littéralement le fait de faire couler ou de répandre « lui », mais, dans ce contexte de mort violente, elle exprime que les ennemis seront abandonnés au sort que leur réserve l’épée. Le passif français rend clairement les victimes comme sujet logique des deux propositions, tandis que la note conserve l’image et l’irrégularité de nombre de l’hébreu.
- source_word: עַל יְדֵי חָרֶב
  choice: au pouvoir de l’épée
  rationale: L’expression idiomatique désigne ici l’action ou la puissance meurtrière de l’épée, non des « mains » au sens propre.
- source_word: מְנָת
  choice: la part
  rationale: מְנָת désigne une part ou un lot attribué. « La part des renards » est naturel en français et conserve l’image poétique de corps devenant leur nourriture.
- source_word: שֻׁעָלִים
  choice: renards
  rationale: « Renards » est le sens lexical courant de שֻׁעָלִים. La possibilité de comprendre un canidé plus largement, notamment les chacals dans un contexte de cadavres et de désolation, est signalée en note.
- source_word: יִהְיוּ
  choice: ils deviendront
  rationale: Le verbe היה peut signifier « être » ou « devenir » ; ici, « deviendront » souligne l’état résultant de leur mort violente.
theological_decisions:
- issue: Passage du singulier objet au pluriel sujet dans le texte hébreu
  choice: Employer « ils » dans les deux propositions pour désigner clairement les ennemis voués à la mort
  alternative: « On le répandra sous les coups de l’épée ; ils deviendront… »
  rationale: L’hébreu présente d’abord un suffixe objet masculin singulier (« lui »), puis un verbe au pluriel (« ils deviendront »). Le contexte vise les adversaires au pluriel. La traduction principale reste intelligible sans effacer la difficulté textuelle, explicitement conservée dans la note.
translation_notes:
  register: Français international moderne, poétique et digne. « Au pouvoir de l’épée » garde la personnification de l’hébreu tout en restant idiomatique ; le point-virgule maintient le parallélisme des deux propositions.
