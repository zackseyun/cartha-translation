  text: אֱלֹהִ֤ים אֵלִ֥/י אַתָּ֗ה אֲֽשַׁחֲ֫רֶ֥/ךָּ צָמְאָ֬ה לְ/ךָ֨ נַפְשִׁ֗/י כָּמַ֣הּ לְ/ךָ֣ בְשָׂרִ֑/י בְּ/אֶֽרֶץ צִיָּ֖ה וְ/עָיֵ֣ף בְּלִי מָֽיִם׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: fr
  text: Dieu, tu es mon Dieu ; dès l’aube, je te cherche.[a] Mon âme a soif de toi et ma chair languit après toi, dans une terre aride et épuisée, sans eau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te cherche de bonne heure » ; le verbe hébreu évoque littéralement une recherche dès l’aube et peut aussi suggérer une recherche empressée.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « Mon âme a soif de toi et ma chair languit après toi dans une terre aride et épuisée, sans eau », en rattachant plus étroitement le dernier complément à la seconde proposition.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom de forme plurielle désigne ici le Dieu unique. « Dieu » conserve l’adresse directe sans ajouter l’interjection absente de l’hébreu.
- source_word: אֵלִי אַתָּה
  choice: tu es mon Dieu
  rationale: L’expression rend le titre divin avec le suffixe de première personne et maintient l’accent porté par le pronom indépendant.
- source_word: אֲשַׁחֲרֶךָּ
  choice: dès l’aube, je te cherche
  rationale: Le piel de שׁחר évoque une recherche entreprise de bonne heure, à l’aube. Cette formulation préserve l’image temporelle tout en restant naturelle en français.
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Mon âme a soif de toi
  rationale: « A soif de » rend directement le verbe, tandis que « mon âme » préserve le parallélisme poétique avec « ma chair » sans imposer une anthropologie systématique.
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: ma chair languit après toi
  rationale: Le verbe exprime un désir intense, voire défaillant. « Languit après toi » maintient cette force et « chair » conserve le terme corporel concret en parallèle avec « âme ».
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: dans une terre aride et épuisée
  rationale: « Aride » exprime la sécheresse de צִיָּה ; « épuisée » conserve la personnification poétique portée par עָיֵף, plutôt que de la normaliser en « desséchée ».
- source_word: בְּלִי מָיִם
  choice: sans eau
  rationale: Rendu concis et littéral de la locution privative.
theological_decisions:
- issue: Portée anthropologique du couple נֶפֶשׁ / בָּשָׂר
  choice: Conserver « mon âme » et « ma chair » comme deux dimensions poétiques de la personne entière.
  alternative: Rendre « tout mon être » et « mon corps ».
  rationale: Le parallélisme hébreu articule l’intériorité et l’existence corporelle sans nécessairement enseigner un dualisme rigide. Les deux termes concrets préservent cette tension.
- issue: Portée de « dans une terre aride et épuisée »
  choice: La ponctuation rattache le cadre désertique à l’ensemble de la soif et du désir exprimés.
  alternative: Rattacher explicitement le complément à la seule proposition « ma chair languit après toi ».
  rationale: L’ordre hébreu permet une proximité particulière avec la seconde proposition, mais le cadre peut naturellement embrasser tout le mouvement poétique. Une note signale l’autre lecture possible.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe des psaumes. « Languit après toi » est légèrement soutenu, mais reste intelligible et restitue la forte aspiration du verbe hébreu. Les marqueurs [a] et [b] figurent tous deux dans le texte.
