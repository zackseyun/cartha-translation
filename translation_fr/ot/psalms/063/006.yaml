  yaml_path: translation/ot/psalms/063/006.yaml
  text: When I remember you on my bed, I meditate on you in the night watches.
translation:
  language: fr
  text: Quand je me souviens de toi sur mon lit, je médite sur toi pendant les veilles de la nuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם זְכַרְתִּיךָ
  choice: Quand je me souviens de toi
  rationale: Dans ce contexte poétique, אִם introduit une situation temporelle ou répétée plutôt qu’une condition incertaine; « quand » restitue naturellement ce sens, tout en gardant le présent français adapté à la méditation habituelle.
- source_word: יְצוּעָי
  choice: mon lit
  rationale: Le nom désigne la couche ou le lit; « mon lit » est clair, courant et fidèle au contexte nocturne.
- source_word: בְּאַשְׁמֻרוֹת
  choice: pendant les veilles de la nuit
  rationale: Les אַשְׁמֻרוֹת sont les périodes en lesquelles la nuit était divisée; l’ajout explicatif « de la nuit » est exigé par le contexte et produit une expression française intelligible.
- source_word: אֶהְגֶּה בָּךְ
  choice: je médite sur toi
  rationale: הגה peut évoquer une réflexion soutenue, parfois murmurée; « méditer sur » rend ici le sens intérieur sans ajouter l’idée de parole à voix basse, non explicitée dans le verset.
