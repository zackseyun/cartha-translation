  verdict: revise
  source_fidelity: Le texte principal restitue bien les deux propositions, l’image de la main droite et le soutien divin. « Mon âme s’attache à toi » est un français naturel pour דָּבְקָה ... אַחֲרֶיךָ, mais il neutralise nécessairement dans le corps du texte la valeur spatiale/dynamique de « après/derrière toi » ; une note est donc appropriée.
