  yaml_path: translation/ot/psalms/063/008.yaml
  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: fr
  text: Mon âme s’attache à toi[a] ; ta main droite me soutient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon âme s’attache après toi ». La préposition hébraïque signifie « après » ou « derrière » et peut évoquer à la fois un profond attachement et le fait de suivre de près.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: s’attache
  rationale: Le verbe דבק exprime l’idée d’adhérer fermement, de rester étroitement attaché. Le présent français rend naturellement l’état durable exprimé ici par l’accompli hébreu.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפשׁ peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » convient au registre poétique et dévotionnel sans imposer une définition technique de l’être humain.
- source_word: אַחֲרֶיךָ
  choice: à toi
  rationale: Après דבק, le français idiomatique demande « s’attacher à ». La nuance littérale de poursuite ou de proximité contenue dans אַחֲרֵי est signalée en note afin de ne pas la perdre.
- source_word: בִּי
  choice: me
  rationale: La préposition ב avec le suffixe de première personne fonctionne ici comme complément du verbe תמך ; « me soutient » restitue naturellement le sens en français.
- source_word: תָּמְכָה
  choice: soutient
  rationale: תמך signifie soutenir, maintenir ou affermir. Le présent exprime clairement le soutien actuel décrit par la forme accomplie hébraïque.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: Traduction directe de l’image concrète hébraïque, qui évoque la force et la protection sans les substituer à la métaphore.
theological_decisions:
- issue: Portée anthropologique de נַפְשִׁי
  choice: mon âme
  alternative: moi-même / ma vie
  rationale: « Mon âme » conserve la densité personnelle et spirituelle du langage poétique, sans faire du terme une affirmation doctrinale technique sur la composition de l’être humain.
- issue: Image anthropomorphique de la main droite de Dieu
  choice: ta main droite
  alternative: ta puissance / ta force
  rationale: Le texte emploie une image corporelle concrète. La conserver évite de remplacer la métaphore biblique par son interprétation abstraite.
- issue: Relation entre דבק et אַחֲרֵי
  choice: s’attache à toi
  alternative: s’attache à ta suite / te suit de près
  rationale: Le texte associe l’attachement ferme à l’idée d’être après ou derrière Dieu. Le corps du verset privilégie un français naturel, tandis que la note préserve l’image spatiale et dynamique de l’hébreu.
translation_notes:
  register: Français moderne, sobre et poétique. Le parallélisme est conservé, ainsi que l’image biblique de la « main droite ». L’espace avant le point-virgule suit la typographie française.
