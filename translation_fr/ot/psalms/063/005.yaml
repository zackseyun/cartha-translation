  text: כְּמ֤וֹ חֵ֣לֶב וָ֭/דֶשֶׁן תִּשְׂבַּ֣ע נַפְשִׁ֑/י וְ/שִׂפְתֵ֥י רְ֝נָנ֗וֹת יְהַלֶּל פִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: fr
  text: Mon âme est rassasiée comme de mets gras et abondants[a], et ma bouche te loue, des cris de joie sur les lèvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, avec une valeur future possible de l’inaccompli : « Mon âme sera rassasiée comme de mets gras et abondants. » Les termes hébreux évoquent littéralement la graisse et la richesse ou l’abondance.'
    reason: Distingue l’alternative de temps de l’explication lexicale de l’image alimentaire.
  - marker: b
    text: 'Littéralement : « avec des lèvres de cris de joie » ; ou : « avec des lèvres d’acclamations ».'
    reason: Préserve l’image concrète des lèvres et la portée de רְנָנוֹת, qui peut désigner des cris, des acclamations ou des chants de joie.
lexical_decisions:
- source_word: כְּמוֹ
  choice: comme de
  rationale: Introduit la comparaison avec la nourriture; cette tournure est naturelle en français après « se rassasie ».
- source_word: חֵלֶב וָדֶשֶׁן
  choice: de mets gras et abondants
  rationale: חֵלֶב désigne concrètement la graisse et évoque ici une nourriture de choix; דֶּשֶׁן exprime la richesse et l’abondance. La formulation française conserve l’image alimentaire sans produire un doublet obscur.
- source_word: תִּשְׂבַּע
  choice: se rassasie
  rationale: L’inaccompli hébreu peut avoir une valeur présente, habituelle ou future en poésie. Le présent exprime naturellement ici l’expérience vécue du psalmiste, tandis qu’une note signale la lecture future.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner la personne, la vie ou l’âme. « Mon âme » convient au désir intérieur exprimé dans le psaume et préserve son langage poétique.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: avec des lèvres qui chantent de joie
  rationale: Le syntagme signifie littéralement « des lèvres de cris de joie ». Cette formulation garde l’image des lèvres et rend clairement la louange vocale en français actuel.
- source_word: יְהַלֶּל פִּי
  choice: ma bouche te loue
  rationale: Le sujet est « ma bouche ». L’objet « te » n’est pas exprimé dans le texte hébreu, mais il est clairement sous-entendu par l’adresse directe à Dieu dans le contexte.
theological_decisions:
- issue: Objet implicite de la louange
  choice: « ma bouche te loue »
  alternative: « ma bouche loue »
  rationale: L’hébreu n’énonce pas l’objet, mais le contexte d’adresse directe à Dieu l’identifie sans ambiguïté. L’ajout du pronom rend la phrase idiomatique en français sans introduire de contenu doctrinal.
- issue: Valeur des inaccomplis poétiques
  choice: 'Présent : « se rassasie », « loue »'
  alternative: 'Futur : « se rassasiera », « louera »'
  rationale: L’inaccompli hébreu permet une nuance présente, habituelle ou future. Le présent s’accorde avec l’expérience actuelle de satisfaction et de louange; la possibilité du futur est conservée en note.
translation_notes:
  register: 'Français international moderne, poétique et digne. La traduction privilégie une équivalence optimale : elle conserve les images corporelles de l’âme, des lèvres et de la bouche, tout en rendant l’image alimentaire intelligible et naturelle.'
