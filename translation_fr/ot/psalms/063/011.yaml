source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: fr
  text: Mais le roi se réjouira en Dieu ; quiconque jure par lui[a] se glorifiera[b], car la bouche de ceux qui profèrent le mensonge sera fermée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « lui » renvoie le plus naturellement à Dieu ; grammaticalement, il pourrait aussi renvoyer au roi.
    reason: ambiguity
  - marker: b
    text: 'Ou : « se vantera » ; le verbe hébreu peut exprimer le fait de se glorifier, de tirer fierté ou de se vanter.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « car la bouche de ceux qui profèrent le mensonge sera fermée » ; l’hébreu emploie « bouche » au singulier dans un sens collectif.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Mais le roi
  rationale: La conjonction ו peut signifier « et », mais elle introduit ici un contraste avec le sort des ennemis au verset précédent ; « mais » rend naturellement cette progression.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: se réjouira en Dieu
  rationale: Le qal inaccompli de שׂמח exprime ici une joie à venir, et la préposition ב marque Dieu comme objet ou fondement de cette joie.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: quiconque jure par lui
  rationale: כָּל suivi du participe a une valeur distributive. Avec le verbe « jurer », בּוֹ désigne celui qui est invoqué dans le serment ; le pronom renvoie le plus naturellement à Dieu.
- source_word: יִתְהַלֵּל
  choice: s’en glorifiera
  rationale: Le hitpael de הלל peut exprimer le fait de se glorifier ou de se vanter. « S’en glorifiera » conserve la portée positive que le contexte permet tout en restant proche de l’image hébraïque.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de la confiance exprimée auparavant.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: la bouche de ceux qui profèrent le mensonge sera fermée
  rationale: Le niphal de סכר signifie « être fermé ». Le singulier « la bouche » conserve l’image collective de l’hébreu, tandis que « ceux qui profèrent le mensonge » rend la construction participiale sans la réduire au simple substantif « menteurs ».
theological_decisions:
- issue: Identité du « roi »
  choice: Conserver simplement « le roi ».
  alternative: Préciser qu’il s’agit de David ou du roi messianique.
  rationale: Le verset dit « le roi » sans préciser davantage son identité. La traduction n’impose donc ni une identification historique ni une lecture messianique.
- issue: Référent du pronom dans « jure par lui »
  choice: Comprendre que le pronom renvoie à Dieu, tout en signalant l’ambiguïté grammaticale.
  alternative: Comprendre que le pronom renvoie au roi.
  rationale: Dieu est l’antécédent explicite le plus proche, et jurer par Dieu est une expression biblique courante. Cependant, le genre masculin du pronom permet grammaticalement de le rattacher au roi ; la note préserve cette possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le contraste initial, le singulier collectif « la bouche » et l’ambiguïté grammaticale du pronom, sans ajouter d’identification doctrinale du roi.
