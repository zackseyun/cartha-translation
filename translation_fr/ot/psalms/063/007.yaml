source:
  edition: WLC
  text: כִּֽי הָיִ֣יתָ עֶזְרָ֣תָ/ה לִּ֑/י וּ/בְ/צֵ֖ל כְּנָפֶ֣י/ךָ אֲרַנֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: fr
  text: Car tu as été mon secours, et à l’ombre de tes ailes je crie de joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je chante de joie ». Le verbe hébreu peut désigner aussi bien un cri de joie retentissant qu’un chant joyeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la réponse du psalmiste et conserve naturellement le lien causal avec le contexte.
- source_word: הָיִיתָ
  choice: tu as été
  rationale: Le qatal évoque l’aide déjà éprouvée de Dieu, avec une portée présente; le passé composé convient naturellement en français.
- source_word: עֶזְרָתָה לִּי
  choice: mon secours
  rationale: Rend de façon idiomatique l’aide accordée personnellement au psalmiste, dans un registre poétique et accessible.
- source_word: וּבְצֵל
  choice: et à l’ombre
  rationale: Conserve l’image biblique concrète de l’ombre protectrice sans l’aplatir en une explication abstraite.
- source_word: כְּנָפֶיךָ
  choice: de tes ailes
  rationale: Préserve littéralement la métaphore familière des ailes divines qui offrent abri et protection.
- source_word: אֲרַנֵּן
  choice: je crie de joie
  rationale: Le piel de רנן désigne une expression vocale retentissante et joyeuse, qui peut être un cri aussi bien qu’un chant.
theological_decisions:
- issue: Métaphore de la protection divine
  choice: Conserver littéralement « à l’ombre de tes ailes ».
  alternative: Expliciter par « sous ta protection ».
  rationale: L’image poétique exprime l’abri offert par Dieu sans imposer une interprétation doctrinale plus étroite.
- issue: Nature de l’expression joyeuse
  choice: « je crie de joie » dans le texte, avec « je chante de joie » en note.
  alternative: « je chante de joie » dans le texte.
  rationale: Le verbe hébreu permet les deux nuances; le texte retient la force du cri retentissant, tandis que la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français moderne, international et digne. La formulation demeure concise et poétique; « secours » garde le relief du langage des psaumes tout en restant largement compréhensible.
