source:
  edition: WLC
  text: כִּי ט֣וֹב חַ֭סְדְּ/ךָ מֵֽ/חַיִּ֗ים שְׂפָתַ֥/י יְשַׁבְּחֽוּ/נְךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/003.yaml
  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: fr
  text: Car ton amour fidèle vaut mieux que la vie ; mes lèvres te loueront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison de la louange qui suit.
- source_word: טוֹב … מֵחַיִּים
  choice: vaut mieux que la vie
  rationale: La préposition comparative מִן donne ici à טוֹב le sens de « meilleur que ». « Vaut mieux que » rend la comparaison dans un français naturel et digne.
- source_word: חַסְדְּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne un amour bienveillant, loyal et constant, souvent situé dans le cadre d’une alliance. « Amour fidèle » en conserve l’affection et la fidélité sans surinterpréter le terme.
- source_word: מֵחַיִּים
  choice: que la vie
  rationale: Bien que חַיִּים ait une forme plurielle, le mot désigne idiomatiquement la vie ; le singulier français convient donc.
- source_word: שְׂפָתַי
  choice: mes lèvres
  rationale: Conserve l’image corporelle et poétique concrète de l’hébreu.
- source_word: יְשַׁבְּחוּנְךָ
  choice: te loueront
  rationale: Le piel de שׁבח signifie louer ou célébrer. Le futur français respecte la forme verbale et reste naturel dans ce contexte.
theological_decisions:
- issue: Rendu de חֶסֶד dans un contexte de louange
  choice: amour fidèle
  alternative: bonté fidèle ; amour d’alliance ; miséricorde
  rationale: « Amour fidèle » exprime à la fois la bienveillance et la loyauté durable associées à חֶסֶד, sans réduire le mot à la seule miséricorde ni rendre explicite un cadre d’alliance que le verset laisse implicite.
translation_notes:
  register: Français international moderne, poétique et accessible. La formulation conserve le parallélisme, l’image des lèvres et le lien causal marqué par כִּי.
