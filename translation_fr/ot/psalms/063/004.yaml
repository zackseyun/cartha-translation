id: PSA.63.4
reference: Psalms 63:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: fr
  text: Ainsi je te bénirai tant que je vivrai[a] ; en ton nom, je lèverai les mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je te louerai ». L’hébreu dit plus littéralement « je te bénirai ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: L’adverbe relie cet engagement d’adoration à ce qui précède et exprime naturellement la conséquence, sans alourdir la phrase.
- source_word: אֲבָרֶכְךָ
  choice: je te bénirai
  rationale: Le piel de ברך signifie ici « bénir ». Même adressé à Dieu, ce rendu demeure naturel en français biblique actuel et conserve plus directement le langage du texte que « louer ».
- source_word: בְחַיָּי
  choice: tant que je vivrai
  rationale: 'Littéralement « dans ma vie », l’expression a ici une valeur durative : pendant toute la vie du psalmiste.'
- source_word: בְּשִׁמְךָ
  choice: en ton nom
  rationale: 'Cette formulation idiomatique conserve l’éventail possible de la préposition ב : sphère, fondement ou invocation du nom divin.'
- source_word: אֶשָּׂא
  choice: je lèverai
  rationale: נשא signifie « lever, élever » ; avec les mains, le verbe décrit un geste reconnu de prière ou de louange.
- source_word: כַפָּי
  choice: les mains
  rationale: כף désigne plus précisément les paumes, mais l’expression française naturelle pour ce geste est « lever les mains ». Le possessif est déjà clair grâce au sujet et à la construction française.
theological_decisions:
- issue: Le langage d’adoration adressé à Dieu avec ברך
  choice: Conserver « je te bénirai » dans le texte principal.
  alternative: « je te louerai »
  rationale: Le verbe hébreu est explicitement ברך. « Bénir » préserve la formulation et la tension du texte, tandis que « louer » en explicite le sens contextuel mais est plus interprétatif.
translation_notes:
  register: Français international moderne, digne et fluide. « Ainsi » garde le lien logique avec le verset précédent ; l’inversion légère après le point-virgule met en relief « en ton nom » sans produire un registre archaïque.
