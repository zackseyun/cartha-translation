source:
  edition: WLC
  text: כֵּ֭ן בַּ/קֹּ֣דֶשׁ חֲזִיתִ֑י/ךָ לִ/רְא֥וֹת עֻ֝זְּ/ךָ֗ וּ/כְבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/002.yaml
  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: fr
  text: Ainsi, dans le sanctuaire, je t’ai contemplé[a], pour voir ta puissance et ta gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Ainsi, dans le lieu saint, je t’ai vu. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Ainsi
  rationale: L’adverbe relie naturellement cette évocation à la soif de Dieu exprimée auparavant, sans préciser outre mesure le rapport logique.
- source_word: בַּקֹּדֶשׁ
  choice: dans le sanctuaire
  rationale: Dans ce contexte de culte, קֹדֶשׁ désigne très probablement le lieu saint plutôt que la sainteté au sens abstrait.
- source_word: חֲזִיתִיךָ
  choice: je t’ai contemplé
  rationale: חזה exprime ici une perception attentive ou contemplative; « contemplé » garde cette nuance tout en restant digne et naturel.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: L’infinitif peut exprimer le but; cette formulation simple préserve le mouvement du texte vers la puissance et la gloire divines.
- source_word: עֻזְּךָ
  choice: ta puissance
  rationale: עֹז désigne la force ou la puissance; « puissance » convient naturellement à Dieu et à son association avec la gloire.
- source_word: וּכְבוֹדֶךָ
  choice: et ta gloire
  rationale: Pour Dieu, כָּבוֹד évoque sa majesté manifeste; « gloire » en est l’équivalent français établi et précis.
theological_decisions:
- issue: Nature de la vision de Dieu dans le sanctuaire
  choice: Conserver l’affirmation directe selon laquelle le psalmiste a contemplé Dieu, sans définir la nature exacte de cette expérience.
  alternative: Comprendre le verset comme le simple souvenir d’une expérience cultuelle, ou comme une vision mystique de Dieu.
  rationale: L’hébreu dit directement « je t’ai contemplé », puis précise « pour voir ta puissance et ta gloire ». La traduction maintient cette tension poétique et théologique sans prétendre qu’il s’agit d’une vision immédiate de l’essence divine.
translation_notes:
  register: Français international moderne, poétique et digne. « Sanctuaire » conserve le cadre cultuel; « contemplé » rend la perception soutenue suggérée par חזה sans archaïsme prononcé.
