  text: וְ/הֵ֗מָּה לְ֭/שׁוֹאָה יְבַקְשׁ֣וּ נַפְשִׁ֑/י יָ֝בֹ֗אוּ בְּֽ/תַחְתִּיּ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/009.yaml
  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: fr
  text: Mais eux, qui cherchent à détruire ma vie, iront dans les profondeurs de la terre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans les parties inférieures de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Mais eux
  rationale: Le pronom est emphatique, et la conjonction marque ici naturellement le contraste avec la confiance exprimée au verset précédent.
- source_word: לְשׁוֹאָה יְבַקְשׁוּ נַפְשִׁי
  choice: qui cherchent à détruire ma vie
  rationale: נֶפֶשׁ désigne ici la vie du psalmiste, tandis que שׁוֹאָה exprime la ruine ou la destruction recherchée. Cette formulation restitue clairement l’intention hostile dans un français naturel.
- source_word: יָבֹאוּ
  choice: iront
  rationale: Le verbe signifie formellement « venir/entrer », mais « aller » convient mieux en français avec cette destination et conserve l’idée de mouvement.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: dans les profondeurs de la terre
  rationale: Cette expression préserve l’image poétique des régions profondes ou inférieures de la terre sans la réduire à une doctrine précise de l’au-delà.
theological_decisions:
- issue: Sens de l’entrée dans « les profondeurs de la terre »
  choice: Conserver une image poétique pouvant évoquer la mort, la tombe ou l’abaissement sous le jugement
  alternative: Traduire explicitement par « le séjour des morts » ou, plus spatialement, par « les parties inférieures de la terre »
  rationale: L’hébreu permet plusieurs nuances. La traduction maintient cette tension et n’impose pas une conception technique de l’au-delà.
translation_notes:
  register: Français moderne, courant et digne. « Mais eux » conserve l’emphase du pronom hébreu; « cherchent à détruire ma vie » privilégie une formulation idiomatique sans spiritualiser נֶפֶשׁ en « âme ».
