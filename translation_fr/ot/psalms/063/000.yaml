id: PSA.63.0
reference: Psalms 63:0
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד בִּ֝/הְיוֹת֗/וֹ בְּ/מִדְבַּ֥ר יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/000.yaml
  text: A psalm of David[a], when he was in the wilderness[b] of Judah.
translation:
  language: fr
  text: Psaume de David[a], lorsqu’il était dans le désert[b] de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David ». Dans les titres des psaumes, l’hébreu traduit par « de David » peut indiquer l’auteur, la destination, l’appartenance ou une association.
    reason: alternative_reading
  - marker: b
    text: Ou « dans la région sauvage de Juda ». Le terme hébreu peut désigner un désert, une steppe ou, plus largement, une région sauvage peu habitée.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme technique fréquent dans les titres liturgiques du Psautier. « Psaume » est à la fois exact, traditionnel et immédiatement compréhensible en français.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition לְ peut exprimer l’auteur, l’appartenance, la destination ou une association. « De David » conserve mieux cette amplitude que « par David » ou « pour David ».
- source_word: בִּהְיוֹתוֹ
  choice: lorsqu’il était
  rationale: La préposition בְּ suivie de l’infinitif construit de היה et du suffixe pronominal forme une proposition temporelle. « Lorsqu’il était » est naturel et soutenu sans être archaïque.
- source_word: בְּמִדְבַּר
  choice: dans le désert
  rationale: מִדְבָּר peut désigner un désert, une steppe ou une région sauvage peu habitée. « Désert » convient au nom géographique usuel « désert de Juda », tandis qu’une note signale l’étendue sémantique du terme.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française établie du nom du territoire ou de la région.
theological_decisions:
- issue: Sens du titre davidique
  choice: Conserver la formulation ambiguë « de David ».
  alternative: « par David » ou « pour David »
  rationale: Le titre hébreu n’impose pas à lui seul une interprétation unique en matière d’auteur, de destination, d’appartenance ou d’association. La traduction ne tranche donc pas au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le titre reste bref comme en hébreu; « lorsqu’il était » rend clairement la relation temporelle, et les notes préservent les ambiguïtés lexicales réelles.
