id: PSA.102.15
reference: Psalms 102:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: fr
  text: 'Alors[a], les nations craindront[b] le nom de Yahweh,

    et tous les rois de la terre craindront ta gloire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et les nations craindront ». La conjonction hébraïque peut se traduire simplement par « et »; « alors » explicite ici le rapport de conséquence avec le contexte précédent.
    reason: lexical_alternative
  - marker: b
    text: Ou « révéreront ». Le verbe hébreu peut désigner une crainte mêlée de profond respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Alors ... craindront
  rationale: Le qal inaccompli, troisième personne du pluriel, de ירא exprime ici la crainte, avec une nuance possible de profond respect. Le futur convient au contexte, et « alors » explicite la valeur consécutive probable du waw.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le nom désigne les nations ou les peuples. « Les nations » est naturel dans le registre des Psaumes et n’introduit pas la distinction plus tardive que pourrait suggérer « les païens ».
- source_word: אֶת שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: La formulation conserve le mot « nom », qui peut évoquer l’identité révélée et la renommée sans les réduire à une paraphrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, « Yahweh », plutôt que remplacé par un titre.
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: et tous les rois de la terre
  rationale: כָל suivi d’un pluriel construit se rend naturellement par « tous les rois », tandis que « de la terre » préserve l’expression hébraïque.
- source_word: אֶת כְּבוֹדֶךָ
  choice: ta gloire
  rationale: כבוד désigne ici la gloire, l’honneur ou la majesté. « Gloire » convient au contexte poétique et théologique, et le suffixe de deuxième personne du masculin singulier est conservé par « ta ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie directement le tétragramme. La translittération « Yahweh » préserve le nom divin au lieu de lui substituer un titre.
- issue: Sens de ירא appliqué aux nations et aux rois
  choice: craindront
  alternative: révéreront
  rationale: « Craindront » maintient la tension sémantique entre peur et respect révérenciel présente dans le verbe hébreu; une note signale l’autre nuance possible.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La répétition de « craindront » dans le second membre rend explicite l’ellipse verbale de l’hébreu et assure une lecture naturelle, tout en conservant le parallélisme poétique.
