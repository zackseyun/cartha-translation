id: PSA.102.22
reference: Psalms 102:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/הִקָּבֵ֣ץ עַמִּ֣ים יַחְדָּ֑ו וּ֝/מַמְלָכ֗וֹת לַ/עֲבֹ֥ד אֶת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/022.yaml
  text: when peoples gather together[a], and kingdoms[c][b], to serve Yahweh—
translation:
  language: fr
  text: lorsque les peuples et les royaumes se rassembleront tous ensemble[a] pour servir[b] Yahweh —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « lorsque les peuples et les royaumes seront rassemblés tous ensemble »; la forme hébraïque permet de mettre davantage en relief le fait d’être rassemblés.'
    reason: lexical_alternative
  - marker: b
    text: Lorsque Dieu est l’objet du verbe, « servir » peut aussi avoir le sens de « rendre un culte à ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: lorsque … se rassembleront
  rationale: La préposition בְּ suivie de l’infinitif construit niphal exprime ici le temps. La tournure pronominale française rend naturellement l’idée du rassemblement sans imposer explicitement un agent.
- source_word: עַמִּים
  choice: les peuples
  rationale: « Peuples » conserve le pluriel collectif et distingue mieux les groupes humains que le singulier « peuple ».
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Cette expression restitue l’insistance de l’adverbe hébreu sur le rassemblement commun.
- source_word: וּ/מַמְלָכוֹת
  choice: et les royaumes
  rationale: « Royaumes » est l’équivalent direct de מַמְלָכוֹת. En français, sa coordination avec « peuples » comme sujet de « se rassembleront » exprime clairement le sens de la construction hébraïque.
- source_word: לַ/עֲבֹד
  choice: pour servir
  rationale: « Servir » conserve l’étendue du verbe עבד; lorsque Dieu en est l’objet, ce service comprend aussi le culte.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom propre présent dans le texte hébreu; la particule d’objet direct אֶת n’est pas traduite.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le tétragramme; « Yahweh » le rend comme un nom propre sans le remplacer par un titre.
- issue: Portée cultuelle du verbe עבד
  choice: servir
  alternative: rendre un culte à
  rationale: Le contexte autorise le sens cultuel, mais le verbe hébreu garde une portée plus large. Le texte principal retient donc « servir » et signale l’autre possibilité en note.
translation_notes:
  register: Français international moderne, soutenu mais courant. La coordination des deux sujets évite une formulation artificielle, tandis que « tous ensemble » maintient l’accent de יַחְדָּו. Le tiret final conserve le caractère syntaxiquement ouvert du verset dans son contexte.
