  source_fidelity: Le texte rend correctement la construction temporelle בְּ + infinitif construit niphal par « lorsque », les deux substantifs coordonnés comme participants au rassemblement, et יַחְדָּו par l’intensif « tous ensemble ». « Pour servir Yahweh » restitue avec justesse לַעֲבֹד אֶת־יְהוָה, sans réduire indûment עבד au seul culte. Le futur français est recevable dans le mouvement prospectif du contexte du psaume et ne crée pas de contresens.
