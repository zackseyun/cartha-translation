  text: יָ֭מַ/י כְּ/צֵ֣ל נָט֑וּי וַ֝/אֲנִ֗י כָּ/עֵ֥שֶׂב אִיבָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/011.yaml
  text: My days are like a lengthening shadow[a], and I wither away like grass.
translation:
  language: fr
  text: Mes jours sont comme une ombre qui s’allonge[a], et moi, je me dessèche comme l’herbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une ombre étirée ». L’image hébraïque évoque probablement une ombre du soir qui s’allonge, suggérant le déclin et le caractère passager de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: Mes jours
  rationale: Rend littéralement le pluriel avec suffixe de première personne et conserve l’image hébraïque des jours comme durée de vie.
- source_word: כְּצֵל
  choice: comme une ombre
  rationale: Le préfixe כ marque la comparaison, et « ombre » est le sens courant de צֵל.
- source_word: נָטוּי
  choice: qui s’allonge
  rationale: Le participe de נטה signifie « étendu, allongé ». Avec « ombre », cette formulation française évoque naturellement l’ombre qui s’allonge vers le soir, tout en laissant explicite l’image plutôt que son interprétation.
- source_word: וַאֲנִי
  choice: et moi, je
  rationale: Conserve la conjonction simple et le pronom emphatique sans renforcer arbitrairement le lien en opposition avec « mais ».
- source_word: כָּעֵשֶׂב
  choice: comme l’herbe
  rationale: « Herbe » est l’équivalent français naturel de עֵשֶׂב dans cette image poétique de fragilité.
- source_word: אִיבָשׁ
  choice: je me dessèche
  rationale: Le verbe יבשׁ exprime le fait de sécher ou de se flétrir. « Je me dessèche » conserve la forme verbale à la première personne et s’accorde naturellement avec l’image de l’herbe.
