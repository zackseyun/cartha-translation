id: PSA.102.14
reference: Psalms 102:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי רָצ֣וּ עֲ֭בָדֶי/ךָ אֶת אֲבָנֶ֑י/הָ וְֽ/אֶת עֲפָרָ֥/הּ יְחֹנֵֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/014.yaml
  text: For your servants delight in her stones and show favor to her dust[a].
translation:
  language: fr
  text: Car tes serviteurs prennent plaisir à ses pierres et ont compassion de sa poussière.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car tes serviteurs chérissent ses pierres et prennent en pitié sa poussière. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison qui soutient l’espérance exprimée dans le contexte précédent.
- source_word: רָצוּ
  choice: prennent plaisir à
  rationale: Rend le regard favorable et l’attachement affectueux des serviteurs envers les pierres de Sion, sans réduire le verbe à une simple préférence.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans l’adresse à Dieu propre aux Psaumes, « serviteurs » est le terme français naturel et digne.
- source_word: אֶת אֲבָנֶיהָ
  choice: ses pierres
  rationale: Le possessif français renvoie à Sion, nom féminin, et conserve ainsi naturellement la personnification hébraïque.
- source_word: וְאֶת עֲפָרָהּ
  choice: et sa poussière
  rationale: Conserve l’image littérale de la poussière, qui évoque aussi les décombres de la ville ruinée.
- source_word: יְחֹנֵנוּ
  choice: ont compassion de
  rationale: Le verbe חנן peut exprimer faveur, grâce ou compassion. « Ont compassion de » est naturel avec « poussière » et traduit ici l’attachement douloureux aux ruines.
theological_decisions:
- issue: Personnification féminine de Sion/Jérusalem
  choice: Possessifs féminins « ses » et « sa », renvoyant à Sion
  alternative: Une formulation explicitement impersonnelle renvoyant au lieu
  rationale: Les suffixes hébreux sont féminins et renvoient à Sion; le français préserve cette référence par le genre du nom, même si « ses » ne marque pas visiblement le féminin.
- issue: Portée de יְחֹנֵנוּ
  choice: « ont compassion de »
  alternative: « chérissent » ou « accordent leur faveur à »
  rationale: La traduction garde la nuance de compassion ou de faveur sans résoudre excessivement l’image poétique des serviteurs émus même par la poussière de Sion.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple; « poussière » conserve l’image concrète du texte hébreu, tandis que la note signale les principales nuances possibles des deux verbes.
