  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: fr
  text: Mon cœur est frappé comme l’herbe et desséché, car j’oublie[a] de manger mon pain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car j’ai oublié de manger mon pain » ; le parfait hébreu peut décrire soit une détresse qui se poursuit, soit une action accomplie dont l’effet demeure.'
    reason: lexical_alternative
  - marker: b
    text: « Mon pain » peut aussi désigner plus généralement « ma nourriture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: est abattu
  rationale: Le passif de נכה exprime le fait d’être frappé ou abattu. « Est abattu » conserve cette force passive tout en s’intégrant naturellement à l’image de l’herbe.
- source_word: כָעֵשֶׂב
  choice: comme l’herbe
  rationale: עֵשֶׂב désigne couramment l’herbe ou la végétation. « Comme l’herbe » rend directement la comparaison et son évocation de fragilité.
- source_word: וַיִּבַשׁ
  choice: et desséché
  rationale: יבש signifie devenir sec ou se dessécher. Le participe adjectival coordonné décrit en français l’état présent du cœur et prolonge l’image de l’herbe privée de vitalité.
- source_word: לִבִּי
  choice: mon cœur
  rationale: לֵב désigne ici le centre de la vie intérieure. « Mon cœur » conserve le terme anthropologique et poétique du texte hébreu.
- source_word: כִּי
  choice: car
  rationale: כִּי introduit ici la raison ou la manifestation de la détresse. « Car » convient au registre poétique et garde ce lien logique.
- source_word: שָׁכַחְתִּי
  choice: j’oublie
  rationale: Le parfait hébreu peut décrire une action accomplie ou, dans ce contexte de détresse persistante, une réalité actuelle. Le présent français exprime naturellement cette situation continue sans exclure son effet présent.
- source_word: מֵאֲכֹל
  choice: de manger
  rationale: La construction signifie littéralement « loin de manger » après le verbe oublier; en français idiomatique, on dit « oublier de manger ».
- source_word: לַחְמִי
  choice: mon pain
  rationale: לֶחֶם signifie littéralement « pain » et peut, par extension, désigner la nourriture. « Mon pain » préserve l’image concrète du texte.
