  text: From the sound of my groaning[b][a], my bones cling to my flesh.
translation:
  language: fr
  text: À cause de mes gémissements[a], mes os s’attachent à ma chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au bruit de mes gémissements ». La préposition hébraïque peut aussi évoquer la provenance ou le son des gémissements.
    reason: lexical_alternative
  - marker: b
    text: Ou « à ma peau ». Dans ce contexte d’amaigrissement extrême, le mot hébreu traduit par « chair » peut désigner la peau.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: Au bruit de
  rationale: Cette formulation conserve קוֹל (« bruit, son, voix ») et laisse percevoir le lien entre les gémissements audibles et l’état physique du psalmiste, sans réduire d’emblée la préposition מִן à une seule valeur.
- source_word: אַנְחָתִי
  choice: mes gémissements
  rationale: Le nom désigne les soupirs ou gémissements provoqués par la détresse. « Gémissements » restitue ici l’intensité de la plainte.
- source_word: דָּבְקָה
  choice: collent
  rationale: Le verbe דבק signifie « s’attacher, adhérer, coller ». « Collent » rend directement l’image physique de l’extrême amaigrissement en français courant.
- source_word: עַצְמִי
  choice: mes os
  rationale: Bien que la forme hébraïque soit morphologiquement au singulier, עֶצֶם peut avoir un sens collectif. Le pluriel est naturel en français dans cette description du corps.
- source_word: לִבְשָׂרִי
  choice: à ma chair
  rationale: « Chair » correspond au sens premier et concret de בָּשָׂר et préserve l’image hébraïque sans la remplacer silencieusement par une interprétation contextuelle.
