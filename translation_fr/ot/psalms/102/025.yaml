  text: לְ֭/פָנִים הָ/אָ֣רֶץ יָסַ֑דְתָּ וּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: fr
  text: Autrefois, tu as fondé la terre[a], et les cieux sont l’œuvre de tes mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Autrefois, tu as posé les fondations de la terre. »'
    reason: Variante lexicale qui conserve l’image architecturale de יסד (« poser les fondations ») tout en gardant la valeur temporelle de לְפָנִים.
lexical_decisions:
- source_word: לְפָנִים
  choice: Autrefois
  rationale: Cet adverbe temporel signifie « autrefois, jadis, depuis longtemps ». « Autrefois » est naturel et digne en français, tout en conservant l’antériorité indéterminée de l’hébreu.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallélisme avec « les cieux » indique ici le sens cosmique de אֶרֶץ plutôt que celui, local, de « pays ».
- source_word: יָסַדְתָּ
  choice: tu as fondé
  rationale: Le verbe יסד évoque l’action de fonder ou de poser des fondations. « Tu as fondé » reste concis et préserve cette image sans développer excessivement le texte.
- source_word: וּמַעֲשֵׂה יָדֶיךָ
  choice: et les cieux sont l’œuvre de tes mains
  rationale: La proposition nominale hébraïque exige naturellement l’ajout de « sont » en français. « L’œuvre de tes mains » conserve l’image anthropomorphique du travail créateur.
- source_word: שָׁמָיִם
  choice: les cieux
  rationale: Le pluriel traditionnel « les cieux » convient au registre poétique et répond à « la terre » dans le parallélisme cosmique.
theological_decisions:
- issue: L’attribution directe de la création à Dieu
  choice: 'Conserver l’adresse directe à la deuxième personne : Dieu a fondé la terre, et les cieux sont l’œuvre de ses mains.'
  alternative: Atténuer l’image en disant que Dieu a simplement établi l’ordre du monde.
  rationale: L’hébreu attribue explicitement à Dieu la fondation de la terre et la fabrication des cieux. La traduction maintient cette affirmation ainsi que l’image des « mains », sans la rationaliser.
translation_notes:
  register: Français moderne, poétique et accessible. « Autrefois » garde une dignité sobre; « les cieux » et « l’œuvre de tes mains » préservent le parallélisme et l’imagerie du texte hébreu.
