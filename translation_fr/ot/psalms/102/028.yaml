source:
  edition: WLC
  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: fr
  text: Les enfants de tes serviteurs demeureront, et leur descendance sera établie devant toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Les enfants de
  rationale: Le pluriel construit de בֵּן peut désigner les enfants ou descendants; « enfants de » est naturel en français et n’exclut pas inutilement les filles.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans cette adresse à Dieu, « serviteurs » rend naturellement עֶבֶד sans mettre au premier plan la nuance possible d’esclavage.
- source_word: יִשְׁכּוֹנוּ
  choice: habiteront là
  rationale: Le verbe שכן signifie habiter, demeurer ou résider. « Là » explicite sobrement la continuité du lieu évoqué, sans ajouter la notion de sécurité absente du verbe lui-même.
- source_word: וְזַרְעָם
  choice: et leur descendance
  rationale: זֶרַע désigne collectivement la postérité; « descendance » est idiomatique, inclusif et convient au parallélisme avec « enfants ».
- source_word: לְפָנֶיךָ
  choice: devant toi
  rationale: Rend directement l’expression « devant ta face », avec sa possible nuance de présence divine.
- source_word: יִכּוֹן
  choice: sera affermie
  rationale: Le niphal de כון exprime le fait d’être établi, rendu ferme ou assuré; « sera affermie » conserve cette valeur passive et le parallèle de stabilité.
theological_decisions:
- issue: Portée covenantale ou eschatologique de la promesse
  choice: Conserver une affirmation générale de continuité et de stabilité de la descendance des serviteurs de Dieu en sa présence.
  alternative: Préciser qu’il s’agit explicitement d’Israël, d’une alliance particulière ou du salut eschatologique.
  rationale: Le verset ne définit pas lui-même le cadre doctrinal précis de cette promesse; la traduction ne doit donc pas le lui imposer.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est conservé. « Habiteront là » évite d’ajouter « en sécurité », nuance contextuellement possible mais non exprimée lexicalement par יִשְׁכּוֹנוּ.
