  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : בְּנֵי (« enfants »), עֲבָדֶיךָ (« tes serviteurs »), זַרְעָם (« leur descendance ») et לְפָנֶיךָ (« devant toi ») sont fidèles. Toutefois, « là » n’a aucun correspondant dans l’hébreu et introduit un lieu déictique que le verset ne précise pas. Le niphal יִכּוֹן exprime l’idée d’être établi ou rendu ferme.'
  naturalness: La formulation est claire et de registre digne. « Demeureront » convient bien à la poésie des psaumes et évite l’ajout de « là ». « Sera établie » est plus idiomatique en français moderne que « sera affermie », tout en conservant la valeur passive de stabilité.
  terminology: « Serviteurs » est approprié dans l’adresse à Dieu. « Enfants » préserve la portée inclusive et collective de בְּנֵי; « descendance » rend naturellement le collectif זֶרַע. Aucune précision doctrinale ou eschatologique ne doit être ajoutée.
