translation:
  language: fr
  text: Car il a regardé du haut de son saint lieu ; le SEIGNEUR a regardé du ciel vers la terre,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁקִיף
  choice: a regardé d’en haut
  rationale: Le verbe désigne un regard porté vers le bas depuis un point élevé ; cette formulation française exprime naturellement cette orientation.
- source_word: מִמְּרוֹם קָדְשׁוֹ
  choice: depuis son lieu saint
  rationale: Cette expression conserve l’idée d’un emplacement élevé et sacré sans préciser davantage sa nature ; « d’en haut » rend explicitement la hauteur portée par מָרוֹם.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rendu français conventionnel du tétragramme, en petites capitales typographiques simulées par les capitales.
- source_word: הִבִּיט
  choice: a observé
  rationale: Ce choix rend le second verbe de perception avec une nuance distincte, tout en préservant le parallélisme avec « a regardé ».
- source_word: מִשָּׁמַיִם אֶל אֶרֶץ
  choice: la terre depuis le ciel
  rationale: Ordre français naturel qui conserve le point de départ céleste et l’objet terrestre du regard.
theological_decisions:
- issue: Nature précise du « lieu saint »
  choice: Ne pas l’identifier explicitement au sanctuaire terrestre ni à une demeure céleste.
  alternative: « du haut de sa sainte demeure » ou « du haut de son sanctuaire »
  rationale: L’hébreu associe hauteur et sainteté, mais ne nomme pas ici une demeure ou un sanctuaire ; la traduction évite de trancher cette ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme poétique est conservé par deux verbes de regard distincts et par la reprise du mouvement allant du ciel vers la terre.
