id: PSA.102.2
reference: Psalms 102:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ בְּ/י֪וֹם צַ֫ר לִ֥/י הַטֵּֽה אֵלַ֥/י אָזְנֶ֑/ךָ בְּ/י֥וֹם אֶ֝קְרָ֗א מַהֵ֥ר עֲנֵֽ/נִי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: fr
  text: Ne me cache pas ton visage au jour de ma détresse[a] ; tends l’oreille vers moi. Le jour où je t’appelle, réponds-moi vite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « au jour où il y a détresse pour moi ». « Ton visage » peut aussi désigner ici la présence favorable de Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « hâte-toi de me répondre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Ne me cache pas
  rationale: La particule négative avec le verbe exprime ici une supplication pressante. Cette formulation française conserve directement l’image hébraïque.
- source_word: פָּנֶיךָ
  choice: ton visage
  rationale: Le sens concret est « ton visage » ; dans cette prière, l’expression peut aussi évoquer la présence favorable de Dieu. L’image poétique est préservée dans le texte.
- source_word: בְּיוֹם צַר לִי
  choice: au jour de ma détresse
  rationale: La tournure rend le sens personnel de l’hébreu, littéralement « au jour où il y a détresse pour moi », tout en gardant la structure temporelle répétée.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: tends l’oreille vers moi
  rationale: Cette expression française naturelle conserve l’image anthropomorphique de l’oreille orientée vers celui qui prie.
- source_word: בְּיוֹם אֶקְרָא
  choice: Le jour où je t’appelle
  rationale: La formulation maintient la répétition de « jour » et explicite naturellement en français que l’appel s’adresse à Dieu.
- source_word: מַהֵר עֲנֵנִי
  choice: réponds-moi vite
  rationale: מַהֵר exprime l’urgence et peut être compris adverbialement (« vite ») ou comme une exhortation à se hâter ; la traduction est concise et naturelle.
theological_decisions:
- issue: Langage anthropomorphique appliqué à Dieu
  choice: Conserver « ton visage » et « l’oreille » dans le texte principal
  alternative: Interpréter par « ta présence » et « écoute-moi »
  rationale: Les images corporelles expriment la faveur et l’attention divines sans imposer l’idée d’une corporéité de Dieu ; les conserver respecte la force poétique de l’hébreu.
- issue: Répétition de la formule temporelle בְּיוֹם
  choice: Conserver « au jour » puis « le jour où »
  alternative: Fondre les deux expressions en « quand je suis dans la détresse » et « quand je t’appelle »
  rationale: La répétition contribue à la structure et à l’urgence du verset, tout en restant intelligible en français moderne.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe traditionnelle à Dieu. La formulation conserve les images concrètes et la répétition poétique de l’hébreu sans devenir artificielle.
