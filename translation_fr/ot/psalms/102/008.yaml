  yaml_path: translation/ot/psalms/102/008.yaml
  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: fr
  text: Tout le jour, mes ennemis m’insultent ; ceux qui se moquent de moi jurent par moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jurent contre moi » ou « se servent de moi comme formule de malédiction dans leurs serments ». L’expression hébraïque est difficile ; elle peut signifier que le nom ou le sort du psalmiste est devenu un exemple invoqué dans des serments hostiles.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Tout le jour
  rationale: Expression temporelle qui indique une action continuelle durant la journée ; cette formulation est naturelle et digne en français.
- source_word: חֵרְפוּנִי
  choice: m’insultent
  rationale: Le verbe חרף exprime ici l’outrage verbal et le mépris. « M’insultent » rend clairement ce sens en français moderne.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Rend directement le nom avec son suffixe possessif.
- source_word: מְהוֹלָלַי
  choice: ceux qui se moquent de moi
  rationale: La forme est difficile, mais le contexte favorise l’idée de personnes qui tournent le psalmiste en dérision.
- source_word: בִּי נִשְׁבָּעוּ
  choice: jurent par moi
  rationale: Avec נשבע, la préposition ב marque normalement ce par quoi l’on jure. La traduction conserve la construction et son ambiguïté, tandis que la note précise sa possible valeur hostile.
