source:
  edition: WLC
  text: פָּ֭נָה אֶל תְּפִלַּ֣ת הָ/עַרְעָ֑ר וְ/לֹֽא בָ֝זָ֗ה אֶת תְּפִלָּתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/017.yaml
  text: He turned to the prayer of the destitute and did not despise their prayer[a].
translation:
  language: fr
  text: 'Il s’est tourné vers la prière de ceux qui sont démunis[a],

    et il n’a pas méprisé leur prière.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ceux qui sont sans ressources », « de ceux qui sont sans défense ». Dans d’autres contextes, le terme hébreu peut désigner un arbrisseau du désert, ce qui peut évoquer ici une personne dépouillée de tout ou isolée.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנָה
  choice: s’est tourné vers
  rationale: Conserve l’image concrète du verbe hébreu « se tourner vers » tout en exprimant naturellement l’attention accordée à la prière.
- source_word: תְּפִלַּת
  choice: la prière de
  rationale: Rend directement la forme construite et permet de préserver la répétition de « prière » dans les deux membres du verset.
- source_word: הָעַרְעָר
  choice: ceux qui sont démunis
  rationale: Dans ce contexte, le terme désigne des êtres humains privés de ressources ou laissés sans soutien, comme le confirme le suffixe pluriel de « leur prière ». Le pluriel explicite rend en français la valeur collective probable du singulier hébreu.
- source_word: בָזָה
  choice: méprisé
  rationale: Correspond au sens de traiter avec dédain ou de tenir pour négligeable, sans l’affaiblir en simple refus.
- source_word: תְּפִלָּתָם
  choice: leur prière
  rationale: Respecte le suffixe pluriel et le nom singulier hébreu, tout en reproduisant la répétition lexicale du texte source.
theological_decisions:
- issue: Sens anthropologique de עַרְעָר
  choice: des personnes démunies
  alternative: une personne solitaire, ou des personnes comparées à un arbrisseau du désert
  rationale: La mention de « leur prière » impose ici un référent humain, collectif ou représentatif. Le texte principal exprime donc leur condition sans transformer l’image lexicale possible en affirmation explicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé rend le qatal dans le cadre narratif ou déclaratif du psaume. La mise en deux lignes reflète le parallélisme hébreu, et la répétition de « prière » est volontairement conservée.
