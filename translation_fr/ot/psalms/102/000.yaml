id: PSA.102.0
reference: Psalms 102:0
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: fr
  text: Prière d’un affligé, lorsqu’il défaille[a] et répand sa plainte[b] devant Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lorsqu’il est accablé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa méditation » ou « sa lamentation ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Prière
  rationale: L’ouverture nominale convient au style concis d’un titre de psaume; le français n’exige pas ici d’article.
- source_word: לְעָנִי
  choice: d’un affligé
  rationale: Le lamed marque la relation dans le titre (« de/pour »), et עָנִי désigne une personne affligée, opprimée ou pauvre. « Un affligé » garde le singulier sans réduire le terme à la pauvreté économique.
- source_word: כִי
  choice: lorsque
  rationale: כִּי introduit ici la circonstance temporelle dans laquelle la prière est prononcée.
- source_word: יַעֲטֹף
  choice: il défaille
  rationale: Le verbe peut évoquer la faiblesse, la défaillance ou le fait d’être accablé. « Défaille » rend naturellement l’affaiblissement sans exclure l’autre nuance.
- source_word: וְלִפְנֵי יְהוָה
  choice: devant Yahweh
  rationale: לִפְנֵי signifie « devant, en présence de »; le tétragramme est transcrit « Yahweh ».
- source_word: יִשְׁפֹּךְ
  choice: répand
  rationale: Le verbe conserve la métaphore biblique consistant à verser ou répandre devant Dieu ce qui habite intérieurement la personne.
- source_word: שִׂיחוֹ
  choice: sa plainte
  rationale: Dans ce contexte de détresse et de prière, « plainte » exprime bien la valeur lamentative de שִׂיחַ, tout en signalant en note ses autres nuances possibles.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre et suit la couche de consultation anglaise mise à jour.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde la brièveté d’une suscription de psaume, avec des notes pour préserver l’étendue sémantique des deux termes ambigus.
