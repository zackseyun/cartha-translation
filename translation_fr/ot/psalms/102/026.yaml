  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: fr
  text: Eux périront, mais toi, tu subsisteras[a]. Tous s’useront comme un vêtement ; comme un habit, tu les changeras[b], et ils passeront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu te tiendras debout ». Ici, le verbe exprime une permanence durable, par contraste avec ce qui périt.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu les remplaceras ». Le verbe hébreu peut signifier changer ou remplacer, dans le prolongement de l’image du vêtement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה יֹאבֵדוּ
  choice: Eux, ils périront
  rationale: Le pronom indépendant est mis en relief et établit le contraste avec « toi » ; « périront » rend directement אבד sans imposer l’idée d’anéantissement.
- source_word: וְאַתָּה תַעֲמֹד
  choice: mais toi, tu subsisteras
  rationale: La conjonction prend ici une valeur adversative. « Subsisteras » exprime naturellement la permanence indiquée par le sens littéral « te tiendras debout ».
- source_word: וְכֻלָּם כַּבֶּגֶד יִבְלוּ
  choice: Tous s’useront comme un vêtement
  rationale: בלה désigne l’usure, particulièrement appropriée à un vêtement ; « tous » reprend l’ensemble de la création évoquée dans le contexte.
- source_word: כַּלְּבוּשׁ תַּחֲלִיפֵם
  choice: comme un habit, tu les changeras
  rationale: Le hiphil de חלף peut signifier changer ou remplacer. « Changer » maintient l’image de quelqu’un qui change de vêtements et conserve l’ambiguïté quant au remplacement.
- source_word: וְיַחֲלֹפוּ
  choice: et ils passeront
  rationale: Le qal de חלף peut évoquer le fait de passer, de disparaître ou de changer ; « passeront » garde le parallélisme avec leur caractère transitoire sans préciser excessivement le processus.
theological_decisions:
- issue: Permanence divine opposée au caractère transitoire de la création
  choice: « mais toi, tu subsisteras »
  alternative: « mais toi, tu resteras debout »
  rationale: Le texte oppose la disparition et l’usure de la création à la permanence de Dieu. « Subsisteras » transmet cette force contextuelle sans ajouter un vocabulaire doctrinal ultérieur.
- issue: Nature du changement de la création
  choice: « tu les changeras »
  alternative: « tu les remplaceras »
  rationale: Le choix conserve l’image vestimentaire et l’ouverture sémantique de חלף, sans décider si le verset décrit une transformation ou un remplacement.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise disloquée « Eux, ils… mais toi, tu… » reproduit l’accent contrastif des pronoms hébreux. « Vêtement » puis « habit » préserve la variation lexicale du texte source.
