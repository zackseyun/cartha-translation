  text: מִ/פְּנֵֽי זַֽעַמְ/ךָ֥ וְ/קִצְפֶּ֑/ךָ כִּ֥י נְ֝שָׂאתַ֗/נִי וַ/תַּשְׁלִיכֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/010.yaml
  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: fr
  text: à cause de ton indignation et de ta fureur, car tu m’as soulevé et m’as jeté.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu m’as porté et m’as jeté ».'
    reason: Le verbe נשׂא peut aussi signifier « porter »; cette variante préserve l’ambiguïté lexicale sans ajouter une idée de distance ou de rejet abstrait.
lexical_decisions:
- source_word: מִפְּנֵי
  choice: à cause de
  rationale: Dans cette construction suivie de termes exprimant la colère divine, l’expression a une valeur causale plutôt que spatiale.
- source_word: זַעַמְךָ
  choice: ton indignation
  rationale: « Indignation » exprime une colère intense et conserve un registre poétique digne, tout en distinguant ce terme du suivant.
- source_word: וְקִצְפֶּךָ
  choice: et ta fureur
  rationale: « Fureur » rend l’intensité de קֶצֶף et préserve le parallélisme de deux termes proches sans les confondre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici l’explication de la situation décrite et se rend naturellement par « car ».
- source_word: נְשָׂאתַנִי
  choice: tu m’as soulevé
  rationale: Le verbe נשׂא peut signifier lever, porter ou emporter. « Soulevé » préserve l’image concrète qui prépare le geste de jeter.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: puis jeté au loin
  rationale: Le verbe שׁלך désigne l’action de jeter. « Au loin » exprime ici l’éloignement ou le rejet sans ajouter l’idée plus précise de jeter à terre; « puis » rend naturellement la succession imagée des deux gestes.
theological_decisions:
- issue: Représentation de la colère divine
  choice: Conserver deux termes distincts, « indignation » et « fureur », sans atténuer leur intensité.
  alternative: Réunir les deux termes sous le seul mot « colère » ou en adoucir la portée.
  rationale: L’hébreu emploie deux mots voisins mais distincts pour la colère de Dieu. La traduction maintient ce parallélisme et la tension théologique du verset sans lui ajouter d’explication doctrinale.
translation_notes:
  register: Français international actuel, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu. La formulation conserve l’image vive de quelqu’un que l’on soulève avant de le jeter au loin.
