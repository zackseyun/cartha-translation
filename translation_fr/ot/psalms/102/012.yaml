id: PSA.102.12
reference: Psalms 102:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה לְ/עוֹלָ֣ם תֵּשֵׁ֑ב וְ֝/זִכְרְ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: fr
  text: Mais toi, Yahvé, tu sièges[a] pour toujours, et ton souvenir[b] subsiste de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu demeures ». Le verbe hébreu signifie littéralement « s’asseoir » ; il peut aussi exprimer le fait de demeurer ou, dans un contexte royal, de siéger sur un trône.
    reason: lexical_alternative
  - marker: b
    text: Ou « la mémoire de toi », « ton mémorial » ou « ton renom ». Le nom hébreu peut désigner le souvenir, la commémoration ou une renommée durable.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque ici un contraste fort avec la fragilité évoquée auparavant ; « Mais toi » l’exprime naturellement en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme « Yahvé » rend directement le nom divin יהוה dans un français courant et digne, sans lui substituer un titre.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression indique ici une durée sans fin et contraste avec le caractère passager de la vie humaine.
- source_word: תֵּשֵׁב
  choice: tu sièges
  rationale: Le verbe signifie littéralement « s’asseoir » et peut, avec Dieu pour sujet, évoquer le fait de siéger comme roi. « Tu sièges » conserve cette image sans expliciter excessivement la royauté.
- source_word: וְזִכְרְךָ
  choice: ton souvenir
  rationale: Le nom peut désigner le souvenir, la commémoration ou le renom. « Ton souvenir » préserve le champ lexical de la mémoire et l’ambiguïté du terme.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette tournure française idiomatique exprime la continuité à travers les générations successives.
theological_decisions:
- issue: Permanence divine et possible image royale dans תֵּשֵׁב
  choice: tu sièges pour toujours
  alternative: tu demeures pour toujours
  rationale: « Tu sièges » maintient le sens concret du verbe et sa possible portée royale, tandis que la note signale le sens plus général de permanence sans trancher silencieusement.
- issue: Portée de זִכְרְךָ
  choice: ton souvenir subsiste
  alternative: ton renom demeure
  rationale: « Souvenir » conserve l’ambiguïté entre mémoire, commémoration et réputation. « Subsiste » fournit en français le prédicat que la proposition nominale hébraïque laisse implicite.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. La formulation reste proche de la structure hébraïque tout en ajoutant « subsiste », nécessaire à une phrase française naturelle.
