source:
  edition: WLC
  text: וְ/אַתָּה ה֑וּא וּ֝/שְׁנוֹתֶ֗י/ךָ לֹ֣א יִתָּֽמּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/027.yaml
  text: But you are the same[a], and your years will not come to an end.
translation:
  language: fr
  text: Mais toi, tu es le même[a], et tes années ne prendront pas fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tu es lui ». Cette expression peut signifier : « tu es le même »; dans ce contexte, elle affirme que tu demeures inchangé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque ici le contraste avec l’ordre créé, qui périt et change. « Mais toi » rend naturellement cette valeur adversative en français.
- source_word: הוּא
  choice: tu restes le même
  rationale: Littéralement « tu es lui ». Dans ce contexte, la formule exprime la permanence de l’identité de Dieu face aux changements de la création. « Tu restes le même » est naturel et conserve cette portée sans recourir à un vocabulaire philosophique ajouté.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: et tes années
  rationale: שָׁנָה désigne ici les années au sens temporel; le suffixe de deuxième personne du masculin singulier donne simplement « tes années ».
- source_word: לֹא
  choice: ne… pas
  rationale: La négation porte sur le verbe à l’inaccompli; associée au futur français, elle exprime que les années de Dieu n’auront pas de terme.
- source_word: יִתָּמּוּ
  choice: prendront fin
  rationale: Le verbe תמם signifie ici parvenir à son terme, s’achever. « Ne prendront pas fin » est une formulation française claire et naturelle qui préserve l’idée de durée sans fin.
theological_decisions:
- issue: Rendu de la formule « tu es lui » et son rapport à la permanence divine
  choice: tu restes le même
  alternative: tu es lui; tu es le même
  rationale: L’hébreu affirme l’identité durable de Dieu en contraste avec la création changeante. « Tu restes le même » communique cette force contextuelle, tandis que la note conserve la formulation littérale et signale l’ambiguïté possible.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise « toi, tu » souligne le contraste porté par le pronom hébreu indépendant. Le futur « ne prendront pas fin » convient à l’affirmation de durée illimitée.
