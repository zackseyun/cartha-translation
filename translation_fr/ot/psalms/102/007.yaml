  text: שָׁקַ֥דְתִּי וָ/אֶֽהְיֶ֑ה כְּ֝/צִפּ֗וֹר בּוֹדֵ֥ד עַל גָּֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/007.yaml
  text: I lie awake and am like a solitary bird on a rooftop[a].
translation:
  language: fr
  text: Je reste éveillé et je suis comme un oiseau solitaire sur un toit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un moineau seul sur un toit ». Le mot hébreu צִפּוֹר désigne généralement un oiseau, bien que « moineau » soit une traduction traditionnelle plus spécifique.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Je reste éveillé
  rationale: Le verbe שׁקד peut exprimer la vigilance ou le fait de rester éveillé. Dans cette lamentation, « je reste éveillé » rend naturellement l'insomnie sans suggérer une garde active.
- source_word: וָאֶהְיֶה
  choice: pareil à
  rationale: La forme de היה prolonge ici la description du psalmiste. La tournure française « pareil à » exprime naturellement l'état comparé sans imposer un changement d'état absent du contexte immédiat.
- source_word: כְּצִפּוֹר
  choice: à un oiseau
  rationale: צִפּוֹר est un terme générique désignant un oiseau, souvent de petite taille, mais pas nécessairement un moineau. « Oiseau » en préserve l'étendue lexicale.
- source_word: בּוֹדֵד
  choice: solitaire
  rationale: בּוֹדֵד désigne ce qui est seul ou isolé. « Solitaire » convient au registre poétique sans ajouter explicitement le sentiment de solitude que comporterait « esseulé ».
- source_word: עַל גָּג
  choice: sur un toit
  rationale: La locution signifie littéralement « sur un toit ». Cette formulation est claire et idiomatique en français tout en conservant l'image d'isolement exposé.
theological_decisions: []
