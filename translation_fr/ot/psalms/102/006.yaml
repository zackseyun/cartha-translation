  text: I am like a desert owl[b][a]; I have become like an owl among the ruins.
translation:
  language: fr
  text: Je ressemble au hibou du désert[a] ; je suis devenu comme une chouette[b] parmi les ruines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au pélican du désert ». L’identification de l’oiseau désigné par le mot hébreu קָאַת est incertaine ; les traductions traditionnelles emploient souvent « pélican ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme une petite chouette dans les ruines ». L’espèce exacte désignée par le mot hébreu כּוֹס est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: Je ressemble
  rationale: Le qal de דמה exprime ici la ressemblance. Le parfait peut décrire un état présent ; « Je ressemble » est naturel et maintient le parallélisme sans imposer une transformation.
- source_word: לִקְאַת
  choice: au hibou
  rationale: קָאַת est un nom d’oiseau incertain. « Hibou » convient à l’image d’un oiseau solitaire dans un lieu désolé, tandis que la variante traditionnelle « pélican » est signalée en note.
- source_word: מִדְבָּר
  choice: du désert
  rationale: מִדְבָּר désigne une étendue inculte ou sauvage. « Désert » est concis et s’accorde avec l’imagerie de désolation.
- source_word: הָיִיתִי
  choice: je suis devenu comme
  rationale: Le parfait de היה peut exprimer l’entrée dans un état qui perdure. Cette formulation conserve la nuance résultative possible et la variation du second membre.
- source_word: כְּכוֹס
  choice: comme une chouette
  rationale: כּוֹס est ici un nom d’oiseau, dont l’espèce précise demeure incertaine. « Chouette » garde l’image générale d’un oiseau nocturne et solitaire sans prétendre identifier l’espèce.
- source_word: חֳרָבוֹת
  choice: parmi les ruines
  rationale: Le pluriel désigne des ruines ou des lieux dévastés. « Parmi les ruines » rend naturellement le cadre spatial en français.
