source:
  edition: WLC
  text: יְ֭הוָה שִׁמְעָ֣/ה תְפִלָּתִ֑/י וְ֝/שַׁוְעָתִ֗/י אֵלֶ֥י/ךָ תָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/001.yaml
  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: fr
  text: Yahweh[a], écoute ma prière, et que mon cri parvienne jusqu’à toi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « YHWH », traditionnellement rendu par « le SEIGNEUR ». On trouve aussi les formes « Yahweh » et « Jéhovah ».'
    reason: Signaler la forme hébraïque du nom divin et ses principaux rendus.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération courante « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: שִׁמְעָה
  choice: écoute
  rationale: L’impératif qal exprime une demande directe. « Écoute » est naturel en français dans une prière adressée à Dieu.
- source_word: תְפִלָּתִי
  choice: ma prière
  rationale: Équivalent direct et usuel de תְּפִלָּה, adapté au registre des psaumes.
- source_word: וְשַׁוְעָתִי
  choice: et mon cri
  rationale: שַׁוְעָה désigne un cri, souvent un appel au secours. « Mon cri » en garde la concision et l’intensité sans expliciter ce qui reste implicite.
- source_word: אֵלֶיךָ
  choice: jusqu’à toi
  rationale: La préposition אֶל marque ici la direction. Avec le verbe « parvenir », « jusqu’à toi » restitue naturellement en français l’idée d’un cri qui vient auprès de Dieu.
- source_word: תָבֹוא
  choice: que … parvienne
  rationale: L’imparfait qal a ici une valeur volitive. « Que … parvienne » rend cette nuance et exprime idiomatiquement en français le mouvement du cri vers son destinataire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. La forme « Yahweh » préserve le nom personnel tout en signalant en note le rendu traditionnel français.
translation_notes:
  register: Français moderne, digne et direct. L’apostrophe initiale évite le « Ô » aujourd’hui très soutenu, tandis que l’exclamation finale conserve l’intensité suppliante du verset.
