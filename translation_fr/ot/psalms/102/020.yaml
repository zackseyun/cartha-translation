  text: לִ֭/שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר לְ֝/פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/020.yaml
  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: fr
  text: 'pour entendre les gémissements du prisonnier,

    pour libérer les fils de la mort[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la mort »; c’est-à-dire ceux qui sont voués à mourir ou condamnés à mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: pour entendre
  rationale: L’infinitif construit avec ל exprime ici le but ou le résultat dans la phrase plus large; « pour entendre » conserve directement cette relation et le parallélisme des deux infinitifs.
- source_word: אֶנְקַת
  choice: les gémissements de
  rationale: Le nom désigne les plaintes profondes suscitées par la détresse; « gémissements » en restitue naturellement l’intensité.
- source_word: אָסִיר
  choice: du prisonnier
  rationale: Le terme désigne une personne liée ou emprisonnée. « Prisonnier » est clair et garde le singulier collectif de l’hébreu.
- source_word: לְפַתֵּחַ
  choice: pour libérer
  rationale: Le verbe signifie littéralement « ouvrir », mais appliqué ici à des personnes vouées à la mort, il évoque l’ouverture de leur lieu de détention, donc leur libération.
- source_word: בְּנֵי תְמוּתָה
  choice: les fils de la mort
  rationale: Cette traduction conserve l’image forte et l’ambiguïté de l’expression hébraïque, tandis que la note en explicite le sens idiomatique probable.
theological_decisions:
- issue: Portée de l’expression בְּנֵי תְמוּתָה
  choice: Conserver « les fils de la mort » dans le texte
  alternative: « ceux qui sont voués à la mort » ou « les condamnés à mort »
  rationale: L’hébreu peut désigner des personnes destinées à mourir ou condamnées à mort, sans préciser à lui seul la nature exacte de leur situation. Garder l’image dans le texte évite de trancher silencieusement.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme est maintenu par la répétition de « pour ». L’image hébraïque inhabituelle « fils de la mort » est conservée afin de préserver la force poétique et l’ambiguïté du texte source.
