source:
  edition: WLC
  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: fr
  text: Ceci sera écrit pour une génération à venir, et un peuple qui sera créé louera Yah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yah » est la forme courte et poétique du nom divin en hébreu ; de nombreuses traductions rendent ici « le SEIGNEUR ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: sera écrit
  rationale: 'Le nifal inaccompli de כתב exprime ici naturellement un passif orienté vers l’avenir : le témoignage sera mis par écrit pour des lecteurs futurs.'
- source_word: זֹאת
  choice: Ceci
  rationale: Le démonstratif renvoie à ce qui précède sans imposer un nom interprétatif tel que « récit » ou « prière ».
- source_word: לְדוֹר אַחֲרוֹן
  choice: pour une génération à venir
  rationale: דור signifie « génération » et אחרון désigne ici une génération postérieure ou future, sans imposer le sens eschatologique de « dernière génération ».
- source_word: וְעַם
  choice: et un peuple
  rationale: עם signifie couramment « peuple » ; l’absence d’article favorise ici une formulation indéfinie.
- source_word: נִבְרָא
  choice: qui sera créé
  rationale: Le participe passif de ברא, mis en parallèle avec la génération à venir, reçoit une portée prospective. Cette formulation conserve explicitement l’idée de création.
- source_word: יְהַלֶּל
  choice: louera
  rationale: Le piel inaccompli de הלל signifie « louer ». Le futur s’accorde avec l’orientation temporelle de l’ensemble du verset.
- source_word: יָהּ
  choice: Yah
  rationale: Il s’agit de la forme courte et poétique du nom divin, distincte dans le texte hébreu de la forme complète יהוה.
theological_decisions:
- issue: Traduction du nom divin יָהּ
  choice: Yah
  alternative: le SEIGNEUR
  rationale: Conserver « Yah » respecte la forme courte particulière employée dans le texte hébreu et évite d’effacer cette distinction lexicale et poétique.
translation_notes:
  register: Français international actuel, clair et digne. La syntaxe reste proche du parallélisme hébreu tout en étant naturelle ; « qui sera créé » préserve l’image théologique de la création sans préciser davantage l’identité de ce peuple.
