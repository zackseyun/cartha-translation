  text: כִּֽי בָנָ֣ה יְהוָ֣ה צִיּ֑וֹן נִ֝רְאָ֗ה בִּ/כְבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: fr
  text: Car Yahweh a bâti Sion ; il est apparu dans sa gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il s’est montré dans sa gloire » ou « il a été vu dans sa gloire ». Le verbe hébreu peut désigner soit une apparition, soit le fait d’être vu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le fondement ou l’explication de ce qui précède, tout en convenant au registre poétique.
- source_word: בָנָה
  choice: a bâti
  rationale: Le qatal présente l’action comme accomplie. « A bâti » reste proche de l’hébreu sans ajouter explicitement l’idée de reconstruction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Conserve la forme française traditionnelle du nom propre, sans l’élargir à Jérusalem ou au peuple de Dieu.
- source_word: נִרְאָה
  choice: est apparu
  rationale: Le nifal de ראה peut exprimer soit l’apparition, soit le fait d’être vu. Le texte principal retient la manifestation divine, tandis que la note préserve l’autre analyse.
- source_word: בִּכְבוֹדוֹ
  choice: dans sa gloire
  rationale: Rend directement la manière ou la sphère de la manifestation de Yahweh, avec la portée de כָּבוֹד.
theological_decisions:
- issue: Sens de נִרְאָה dans la manifestation divine
  choice: il est apparu dans sa gloire
  alternative: il s’est montré dans sa gloire ; il a été vu dans sa gloire
  rationale: Le nifal permet une lecture d’apparition ou une lecture passive. La première donne un français naturel dans le texte principal, mais la note maintient l’ambiguïté réelle.
translation_notes:
  register: Français international actuel, poétique et digne. La structure en deux propositions et le nom divin Yahweh sont conservés ; le point-virgule met en relief le lien entre l’édification de Sion et la manifestation divine.
