  text: לְ/סַפֵּ֣ר בְּ֭/צִיּוֹן שֵׁ֣ם יְהוָ֑ה וּ֝/תְהִלָּת֗/וֹ בִּ/ירוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/021.yaml
  text: to declare the name of Yahweh in Zion[a], and his praise in Jerusalem,
translation:
  language: fr
  text: 'pour proclamer à Sion le nom de Yahweh,

    et sa louange à Jérusalem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסַפֵּר
  choice: pour proclamer
  rationale: L’infinitif construit précédé de לְ exprime ici le but ou le résultat. Au piel, ספר signifie « raconter, faire connaître » ; avec le nom divin pour complément, « proclamer » rend naturellement la dimension publique de l’action.
- source_word: בְּצִיּוֹן
  choice: dans Sion
  rationale: La préposition בְּ désigne ici le lieu où a lieu la proclamation ; « dans Sion » conserve le nom propre traditionnel.
- source_word: שֵׁם יְהוָה
  choice: le nom de Yahweh
  rationale: La traduction directe conserve la richesse de שֵׁם, qui peut évoquer à la fois le nom révélé, l’identité et la réputation. Le tétragramme est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: וּתְהִלָּתוֹ
  choice: et sa louange
  rationale: 'תְּהִלָּה signifie « louange » et le suffixe masculin singulier se rend directement par « sa ». Cette formulation préserve l’ellipse hébraïque : il peut s’agir de la louange adressée à Yahweh ou de ce qui est proclamé à sa louange.'
- source_word: בִּירוּשָׁלִָם
  choice: dans Jérusalem
  rationale: La préposition בְּ indique le lieu. « Jérusalem » est la forme française usuelle du nom propre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. La translittération « Yahweh » conserve le nom personnel au lieu de lui substituer un titre.
- issue: Sens de וּתְהִלָּתוֹ
  choice: sa louange
  alternative: la louange qui lui est due
  rationale: « Sa louange » suit formellement le suffixe hébreu et maintient l’ambiguïté entre la louange adressée à Dieu et la proclamation de ce qui fait sa gloire, sans explicitation doctrinale.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. Le parallélisme « dans Sion / dans Jérusalem » et « le nom de Yahweh / sa louange » est conservé. La minuscule initiale reflète le fait que le verset poursuit syntaxiquement la proposition précédente.
