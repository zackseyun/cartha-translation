  text: He afflicted my strength on the way[b][a]; he shortened my days.
translation:
  language: fr
  text: Il a affaibli sa force en chemin[a][b] ; il a abrégé mes jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « sa force » ; en raison du contexte à la première personne, beaucoup comprennent « ma force ».
    reason: alternative_reading
  - marker: b
    text: Ou « au cours de la vie » ; littéralement « sur le chemin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עִנָּה
  choice: a affaibli
  rationale: Au piel, le verbe peut signifier « affliger », « humilier » ou « affaiblir ». Avec « force » comme complément, « affaiblir » exprime naturellement le sens en français sans effacer la vigueur du verbe.
- source_word: בַדֶּרֶךְ
  choice: en chemin
  rationale: Cette expression conserve l’image concrète de la « voie » ou du « chemin », tout en restant naturelle en français ; elle peut aussi évoquer métaphoriquement le cours de la vie.
- source_word: כחו
  choice: sa force
  rationale: La forme transmise dans la source fournie porte un suffixe masculin de troisième personne, d’où « sa force ». Le passage immédiat étant à la première personne, la lecture « ma force » est signalée en note plutôt qu’introduite silencieusement.
- source_word: קִצַּר
  choice: a abrégé
  rationale: Le verbe signifie rendre plus court ou écourter. « Abréger mes jours » est une expression française claire et digne qui convient au parallélisme poétique.
- source_word: יָמָי
  choice: mes jours
  rationale: Le nom porte un suffixe de première personne et désigne ici les jours de la vie du psalmiste.
theological_decisions:
- issue: Changement de personne entre « sa force » et « mes jours »
  choice: Conserver « sa force » dans le premier membre et « mes jours » dans le second.
  alternative: 'Harmoniser à la première personne : « Il a affaibli ma force en chemin ; il a abrégé mes jours. »'
  rationale: Le texte hébreu fourni présente une tension réelle entre le suffixe de troisième personne attaché à « force » et celui de première personne attaché à « jours ». La traduction conserve cette difficulté textuelle dans le corps du verset et indique en note la lecture attendue d’après le contexte.
translation_notes:
  register: Français international moderne, poétique et digne. « En chemin » préserve l’image hébraïque sans lourdeur. Le changement abrupt de personne est volontairement maintenu afin de ne pas harmoniser le texte source.
