  text: כִּֽי כָל֣וּ בְ/עָשָׁ֣ן יָמָ֑/י וְ֝/עַצְמוֹתַ֗/י כְּ/מוֹ קֵ֥ד נִחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/003.yaml
  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: fr
  text: 'Car mes jours s’évanouissent comme la fumée,

    et mes os brûlent comme un brasier[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mes os sont brûlés comme un tison », « comme un four » ou « comme un foyer ». Le terme hébreu désignant l’objet ou le lieu de combustion est rare ; l’image exacte est donc incertaine, mais elle évoque clairement une chaleur intense.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la cause ou le fondement de la plainte, tout en conservant le lien avec le contexte précédent dans un français poétique naturel.
- source_word: כָלוּ
  choice: s’évanouissent
  rationale: Le verbe exprime l’idée d’arriver à son terme, de se consumer ou de disparaître. Avec l’image de la fumée, « s’évanouissent » rend naturellement la dissipation des jours.
- source_word: בְעָשָׁן
  choice: comme la fumée
  rationale: Bien que la préposition signifie normalement « dans », le contexte suggère une comparaison avec la fumée qui se dissipe. Cette formulation rend clairement l’image en français.
- source_word: יָמָי
  choice: mes jours
  rationale: Traduction directe qui préserve le caractère personnel de la plainte.
- source_word: וְעַצְמוֹתַי
  choice: et mes os
  rationale: Conserve l’image corporelle hébraïque d’une souffrance profonde.
- source_word: כְּמוֹ
  choice: comme
  rationale: Équivalent comparatif courant et naturel en français.
- source_word: קֵד
  choice: un brasier
  rationale: Le nom rare désigne vraisemblablement un objet ou un lieu où brûle un feu. « Brasier » exprime une chaleur intense et forme une comparaison naturelle, mais le référent précis demeure incertain et est signalé en note.
- source_word: נִחָרוּ
  choice: brûlent
  rationale: Le verbe évoque le fait d’être brûlé, échauffé ou desséché par le feu. « Brûlent » reste vif et concis sans préciser indûment le degré de combustion.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. Le parallélisme et les images corporelles du texte hébreu sont conservés, tandis que la rareté de קֵד est explicitée sans trancher abusivement entre ses référents possibles.
