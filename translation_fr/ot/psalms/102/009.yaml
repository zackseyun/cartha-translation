  text: For I have eaten ashes like bread[a], and mixed my drink with weeping.
translation:
  language: fr
  text: 'Car j’ai mangé de la cendre comme du pain,

    et j’ai mêlé ma boisson à mes pleurs.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mêlé ma boisson à mes larmes ». Litt. « avec des pleurs »; le terme hébreu désigne l’action de pleurer et peut aussi être rendu plus concrètement par « larmes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la cause ou le fondement de la plainte et s’intègre naturellement au mouvement poétique.
- source_word: אֵפֶר
  choice: de la cendre
  rationale: Désigne la cendre associée ici au deuil, à l’humiliation et à la détresse; le singulier collectif est idiomatique en français.
- source_word: כַּלֶּחֶם
  choice: comme du pain
  rationale: Le préfixe כְּ marque une comparaison; cette formulation conserve simplement l’image hébraïque.
- source_word: אָכָלְתִּי
  choice: j’ai mangé
  rationale: Le passé composé rend naturellement en français actuel l’accompli à la première personne dans cette plainte.
- source_word: שִׁקֻּוַי
  choice: ma boisson
  rationale: Le mot désigne ici ce que boit le psalmiste, sans indice imposant le sens cultuel de « libation ».
- source_word: בִּבְכִי
  choice: à mes pleurs
  rationale: בְּכִי signifie littéralement « pleurs » ou « action de pleurer ». La préposition exprime ici ce avec quoi la boisson est mêlée; « à mes pleurs » est idiomatique en français tout en préservant l’abstraction du terme hébreu.
- source_word: מָסָכְתִּי
  choice: mêlé
  rationale: Le verbe exprime le mélange de liquides. « Mêler ma boisson à mes pleurs » est naturel et conserve l’image sans la préciser excessivement.
