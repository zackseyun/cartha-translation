  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: fr
  text: 'Je dis : « Mon Dieu, ne m’emporte pas au milieu de mes jours[a] ! Tes années durent de génération en génération[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, plus littérale : « ne me fais pas monter au milieu de mes jours » ; littéralement, « à la moitié de mes jours ». Le verbe hébreu signifie « faire monter », mais évoque probablement ici une vie interrompue prématurément.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « à travers toutes les générations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: Je dis
  rationale: L’imparfait hébreu à la première personne peut ici introduire la supplication dans un présent vivant. « J’ai dit » demeure grammaticalement possible, mais le présent convient au caractère immédiat de la prière.
- source_word: אֵלִי
  choice: Mon Dieu
  rationale: Le nom אֵל avec le suffixe de première personne signifie « mon Dieu » et fonctionne ici comme une interpellation.
- source_word: אַל
  choice: ne… pas
  rationale: Cette particule négative accompagnant une forme volitive exprime une défense ou, comme ici, une supplication.
- source_word: תַּעֲלֵנִי
  choice: ne m’emporte pas
  rationale: La forme causative du verbe עלה signifie littéralement « faire monter ». Dans le contexte d’une vie interrompue, « emporter » exprime naturellement en français l’idée probable d’une mort prématurée sans expliciter davantage l’image.
- source_word: בַּחֲצִי יָמָי
  choice: au milieu de mes jours
  rationale: Cette formulation conserve la métaphore hébraïque, littéralement « à la moitié de mes jours », tout en restant naturelle en français.
- source_word: בְּדוֹר דּוֹרִים
  choice: de génération en génération
  rationale: L’expression hébraïque désigne la continuité à travers les générations successives. La tournure française retenue est idiomatique et préserve cette portée temporelle.
- source_word: שְׁנוֹתֶיךָ
  choice: tes années
  rationale: Traduction directe du nom pluriel muni du suffixe de deuxième personne ; les années de Dieu contrastent avec les jours écourtés du psalmiste.
theological_decisions:
- issue: Image idiomatique de la mort dans la supplication
  choice: « ne m’emporte pas »
  alternative: « ne me fais pas monter » ou « ne m’enlève pas »
  rationale: Le contraste entre la brièveté de la vie du psalmiste et la durée de Dieu indique probablement une demande de ne pas mourir prématurément. « Emporter » communique ce sens en français sans ajouter d’explication doctrinale.
- issue: Durée divine exprimée par les générations humaines
  choice: « Tes années vont de génération en génération »
  alternative: « Tes années subsistent à travers toutes les générations »
  rationale: La phrase hébraïque est nominale et met en regard les années de Dieu et la succession des générations. Le verbe français « vont » rend cette continuité sans transformer l’énoncé en formulation doctrinale plus précise que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent « Je dis » donne à la prière son immédiateté ; l’exclamation après la supplication rend sa force sans surcharger le verset. La construction « tes années vont… » restitue en français la proposition nominale hébraïque.
