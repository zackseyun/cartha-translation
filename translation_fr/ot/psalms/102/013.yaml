source:
  edition: WLC
  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: fr
  text: Toi, tu te lèveras et tu auras compassion de Sion, car il est temps de lui accorder ta faveur[a], car le moment fixé est arrivé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de lui faire grâce » ou « d’être bienveillant envers elle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le temps déterminé est arrivé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה תָקוּם
  choice: Toi, tu te lèveras
  rationale: Le pronom indépendant אַתָּה met le sujet en relief, tandis que l’imparfait qal תָקוּם exprime ici l’action attendue de Dieu. La formulation conserve à la fois l’emphase et l’image vive du fait de se lever.
- source_word: תְּרַחֵם
  choice: tu auras compassion
  rationale: Le piel de רחם désigne l’exercice de la compassion ou de la miséricorde. « Avoir compassion » est naturel en français moderne et garde la dimension affective du terme.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom propre est translittéré plutôt que remplacé par une interprétation comme « Jérusalem » ou « le peuple de Dieu ».
- source_word: כִּי
  choice: car
  rationale: Dans les deux occurrences, la conjonction introduit le motif de l’affirmation précédente. La répétition de « car » respecte la structure explicative de l’hébreu.
- source_word: עֵת לְחֶנְנָהּ
  choice: il est temps de lui témoigner ta faveur
  rationale: עֵת indique le temps ou le moment, et l’infinitif חנן avec suffixe féminin renvoie à Sion. « Témoigner ta faveur » rend l’idée d’agir avec grâce ou bienveillance sans imposer une nuance de pardon absente du contexte immédiat.
- source_word: בָא מוֹעֵד
  choice: le moment fixé est arrivé
  rationale: Le parfait בָא présente comme accomplie l’arrivée du מוֹעֵד, un temps déterminé ou fixé. « Est arrivé » exprime cette arrivée avec sa pertinence présente.
theological_decisions:
- issue: Faut-il rendre Sion concrètement ou l’interpréter ?
  choice: Conserver « Sion » comme objet nommé de la compassion divine.
  alternative: « Jérusalem » ou « le peuple de Dieu ».
  rationale: L’hébreu nomme directement Sion. Ses résonances théologiques plus larges doivent découler du contexte plutôt qu’être intégrées dans la traduction.
- issue: Portée de חנן envers Sion
  choice: Rendre le verbe par « lui témoigner ta faveur ».
  alternative: « lui faire grâce » ou « user de grâce envers elle ».
  rationale: Le verbe exprime la faveur bienveillante de Dieu. La traduction retenue préserve cette idée sans préciser indûment qu’il s’agirait du pardon d’une faute.
translation_notes:
  register: Français international moderne, courant et digne. L’emphase de אַתָּה est conservée par « Toi, tu », et la répétition des deux כִּי par deux occurrences de « car », malgré une légère lourdeur stylistique, afin de préserver la progression de l’hébreu.
