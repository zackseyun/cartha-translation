id: PSA.134.3
reference: Psalms 134:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֣ יְ֭הוָה מִ/צִּיּ֑וֹן עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: fr
  text: Que Yahweh te bénisse de Sion[a], lui qui a fait le ciel et la terre[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Yahweh te bénira de Sion » ou « Yahweh te bénisse de Sion ». Dans ce contexte de bénédiction, la formulation d’un souhait paraît la plus naturelle.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « faisant le ciel et la terre » ; le participe hébreu présente Yahweh comme le créateur de toutes choses. Autre traduction possible : « créateur du ciel et de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Que … te bénisse
  rationale: Dans la bénédiction qui clôt le psaume, l’inaccompli piel exprime naturellement un souhait. La tournure française avec « que » en restitue la valeur optative sans la transformer en prédiction.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: מִצִּיּוֹן
  choice: de Sion
  rationale: La préposition מִן indique ici la provenance de la bénédiction. « De Sion » est naturel en français et conserve cette image.
- source_word: עֹשֵׂה
  choice: lui qui a fait
  rationale: Le participe qal désigne Yahweh comme l’auteur de la création. Une proposition relative appositive est plus naturelle en français qu’un calque tel que « faisant ».
- source_word: שָׁמַיִם וָאָרֶץ
  choice: le ciel et la terre
  rationale: Cette paire forme un mérisme qui désigne l’ensemble de la création. Le singulier idiomatique « le ciel et la terre » convient au français moderne.
theological_decisions:
- issue: Valeur de l’inaccompli יְבָרֶכְךָ dans une bénédiction
  choice: 'Souhait : « Que Yahweh te bénisse »'
  alternative: 'Prédiction : « Yahweh te bénira »'
  rationale: Le cadre liturgique et la position finale du verset favorisent une bénédiction formulée comme un souhait, tout en signalant en note les autres valeurs grammaticalement possibles.
- issue: Relation de עֹשֵׂה avec Yahweh
  choice: 'Apposition relative : « lui qui a fait le ciel et la terre »'
  alternative: 'Titre nominal : « créateur du ciel et de la terre »'
  rationale: Le participe identifie le Dieu qui bénit comme l’auteur de toute la création. La relative conserve cette fonction sans ajouter de contenu doctrinal.
translation_notes:
  register: Français moderne, digne et accessible. La tournure optative « Que … te bénisse » garde le caractère solennel de la bénédiction, tandis que « lui qui a fait » rattache clairement l’apposition à Yahweh.
