source:
  edition: WLC
  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: fr
  text: Cantique des montées. Voici[a], bénissez Yahweh, vous tous, serviteurs de Yahweh, qui vous tenez dans la maison de Yahweh[b] pendant la nuit !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Regardez » ou « Voyez » : la particule introduit ici un appel à l’attention.'
    reason: lexical_alternative
  - marker: b
    text: La « maison de Yahweh » désigne ici le sanctuaire du temple.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Cantique des montées
  rationale: Conserve le titre traditionnel de cette collection de psaumes et rend formellement le pluriel מַעֲלוֹת sans imposer l’interprétation plus précise de « chant de pèlerinage ».
- source_word: הִנֵּה
  choice: Voici
  rationale: Rend la particule qui attire l’attention dans un registre poétique, actuel et digne.
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: Préserve le sens liturgique courant de ברך et sa portée plus large que « louez ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: כָּל עַבְדֵי יְהוָה
  choice: vous tous, serviteurs de Yahweh
  rationale: L’impératif indique une adresse directe ; « serviteurs » convient au contexte du sanctuaire sans durcir inutilement le terme en « esclaves ».
- source_word: הָעֹמְדִים
  choice: qui vous tenez
  rationale: Conserve l’image concrète de personnes qui se tiennent dans le sanctuaire, sans expliciter par l’interprétation « qui officiez ».
- source_word: בְּבֵית יְהוָה
  choice: dans la maison de Yahweh
  rationale: Préserve l’expression hébraïque littérale ; le contexte permet de comprendre qu’il s’agit du sanctuaire.
- source_word: בַּלֵּילוֹת
  choice: pendant la nuit
  rationale: Rend idiomatiquement en français le pluriel hébreu à valeur temporelle, tout en indiquant le service nocturne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme ; « Yahweh » en conserve la référence nominale sans la remplacer par un titre.
- issue: Sens de עֹמְדִים dans le contexte cultuel
  choice: qui vous tenez
  alternative: qui officiez
  rationale: Le sens concret est maintenu afin de ne pas transformer implicitement tous les serviteurs mentionnés en une catégorie sacerdotale explicitement désignée.
translation_notes:
  register: Français international moderne, poétique et liturgique sans archaïsmes marqués. L’exclamation finale restitue la vigueur de l’appel impératif. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
