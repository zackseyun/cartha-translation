source:
  edition: WLC
  text: שְׂאֽוּ יְדֵ/כֶ֥ם קֹ֑דֶשׁ וּ֝/בָרֲכוּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: fr
  text: Levez les mains vers le lieu saint[a] et bénissez Yahweh !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le sanctuaire » ou « dans la sainteté ». Le mot hébreu קֹדֶשׁ peut désigner soit la sainteté, soit un lieu saint.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: Levez
  rationale: Impératif masculin pluriel de נשׂא. « Levez » exprime naturellement en français l’action physique demandée.
- source_word: יְדֵיכֶם
  choice: les mains
  rationale: Le français emploie normalement l’article défini avec une partie du corps lorsque le possesseur est déjà indiqué par le sujet verbal ; le sens reste « vos mains ».
- source_word: קֹדֶשׁ
  choice: vers le lieu saint
  rationale: Dans le cadre cultuel du psaume, le nom קֹדֶשׁ peut vraisemblablement désigner le sanctuaire comme direction du geste. L’absence de préposition en hébreu laisse toutefois possibles une lecture locative ou une référence à la sainteté, conservées en note.
- source_word: וּבָרֲכוּ
  choice: et bénissez
  rationale: Impératif pluriel de ברך. « Bénissez » garde le verbe biblique usuel lorsque des adorateurs s’adressent à Dieu, sans le réduire au seul sens de « louez ».
- source_word: אֶת
  choice: '[marque de l’objet direct, non traduite]'
  rationale: Cette particule hébraïque marque l’objet direct défini et n’a pas d’équivalent lexical à rendre en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom propre hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Sens de קֹדֶשׁ après « levez les mains »
  choice: 'Lecture directionnelle : « vers le lieu saint »'
  alternative: « dans le sanctuaire » ou « dans la sainteté »
  rationale: Le contexte des serviteurs officiant dans la maison de Yahweh favorise une référence au sanctuaire, mais la syntaxe sans préposition ne tranche pas nettement entre direction, lieu et qualité sainte. La note maintient cette tension interprétative.
translation_notes:
  register: Français international moderne, simple et digne. « Levez les mains » est plus idiomatique que « levez vos mains ». Le point d’exclamation convient à la double exhortation poétique.
