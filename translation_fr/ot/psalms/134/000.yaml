  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: fr
  text: Chant des montées. Voici, bénissez l’Éternel, vous tous, serviteurs de l’Éternel, qui vous tenez dans la maison de l’Éternel pendant les nuits !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend formellement le titre hébreu traditionnel tout en conservant son ambiguïté quant aux montées, aux degrés ou aux pèlerinages vers Jérusalem.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la particule d’appel à l’attention qui introduit l’exhortation.
- source_word: בָּרֲכוּ
  choice: bénissez
  rationale: Impératif pluriel direct, adressé à tous les serviteurs de l’Éternel.
- source_word: עֹמְדִים
  choice: qui vous tenez
  rationale: Exprime la posture ou la présence de service sans préciser davantage une fonction cultuelle implicite.
- source_word: בַּלֵּילוֹת
  choice: pendant les nuits
  rationale: Le pluriel hébreu est maintenu; l’expression peut désigner le service nocturne habituel plutôt qu’une seule nuit.
theological_decisions:
- issue: Sens de « bénir » Dieu
  choice: bénissez l’Éternel
  alternative: louez l’Éternel
  rationale: Le verbe hébreu est conservé sans réduire son champ sémantique à la seule louange.
- issue: Référent de « maison de l’Éternel »
  choice: maison de l’Éternel
  alternative: temple de l’Éternel
  rationale: La formulation source est préservée; dans ce contexte, elle désigne le sanctuaire du temple, sans que cette explicitation remplace le texte.
translation_notes:
  register: Français moderne, digne et directement compréhensible. Le tétragramme est rendu par « l’Éternel », selon l’usage biblique français courant. La répétition de « l’Éternel » et le pluriel inhabituel « pendant les nuits » sont conservés pour refléter la forme hébraïque.
