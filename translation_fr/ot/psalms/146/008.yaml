  text: יְהוָ֤ה פֹּ֘קֵ֤חַ עִוְרִ֗ים יְ֭הוָה זֹקֵ֣ף כְּפוּפִ֑ים יְ֝הוָ֗ה אֹהֵ֥ב צַדִּיקִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: fr
  text: Yahweh ouvre les yeux des aveugles[a] ; Yahweh relève ceux qui sont courbés ; Yahweh aime les justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rend la vue aux aveugles ». L’hébreu dit littéralement qu’il « ouvre les aveugles », c’est-à-dire qu’il leur ouvre les yeux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin plutôt que par un titre de substitution.
- source_word: פֹּקֵחַ עִוְרִים
  choice: ouvre les yeux des aveugles
  rationale: L’hébreu dit littéralement « ouvre les aveugles » ; l’ajout explicatif de « les yeux » conserve l’image concrète tout en donnant une formulation française naturelle.
- source_word: זֹקֵף
  choice: relève
  rationale: Le verbe évoque l’action de redresser ou de remettre debout ; « relève » convient au complément « ceux qui sont courbés » et garde la portée physique ou figurée.
- source_word: כְּפוּפִים
  choice: ceux qui sont courbés
  rationale: Cette formulation préserve l’image de personnes pliées ou accablées sans limiter le sens à une condition exclusivement physique.
- source_word: אֹהֵב
  choice: aime
  rationale: Le présent simple rend directement le participe prédicatif hébreu.
- source_word: צַדִּיקִים
  choice: les justes
  rationale: « Les justes » est une désignation substantivée naturelle en français biblique moderne et rend la notion de personnes conformes à la justice.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Portée de כְּפוּפִים
  choice: ceux qui sont courbés
  alternative: ceux qui sont accablés
  rationale: Le choix retenu maintient la métaphore et laisse ouverte une lecture physique aussi bien que sociale ou intérieure, sans résoudre une ambiguïté réelle du texte.
translation_notes:
  register: Français international moderne, clair et digne. La triple répétition de « Yahweh » et le parallélisme des trois propositions sont conservés.
