id: PSA.146.3
reference: Psalms 146:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּבְטְח֥וּ בִ/נְדִיבִ֑ים בְּ/בֶן אָדָ֓ם שֶׁ֤/אֵֽין ל֥/וֹ תְשׁוּעָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: fr
  text: Ne mettez pas votre confiance dans les puissants[a], ni dans un être humain[b], qui ne peut apporter le salut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les princes » ou « les nobles ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un fils d’homme » ; ici, l’expression désigne un être humain mortel, et non un titre messianique.
    reason: source_idiom
  - marker: c
    text: Ou « la délivrance » ou « le secours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: Ne mettez pas votre confiance
  rationale: La particule négative avec l’inaccompli exprime ici une interdiction. Cette formulation française rend naturellement le verbe בטח, « avoir confiance, se fier à ».
- source_word: בִנְדִיבִים
  choice: dans les puissants
  rationale: Le terme désigne des nobles, des princes ou des personnages éminents. « Les puissants » exprime clairement leur rang et leur influence sans restreindre indûment le sens à des fils de roi.
- source_word: בְּבֶן אָדָם
  choice: dans un être humain
  rationale: L’expression signifie littéralement « dans un fils d’homme », idiome hébreu désignant ici un humain mortel. La traduction choisie évite en français une lecture messianique étrangère au contexte.
- source_word: שֶׁאֵין לוֹ תְשׁוּעָה
  choice: qui ne peut apporter le salut
  rationale: La tournure existentielle hébraïque affirme qu’aucun salut ne se trouve auprès de l’être humain mentionné. La formulation française communique naturellement son incapacité à sauver, tout en conservant le substantif théologiquement chargé « salut ».
theological_decisions:
- issue: Sens de « fils d’homme »
  choice: Un être humain mortel, et non un titre messianique
  alternative: Conserver littéralement « un fils d’homme »
  rationale: Le parallélisme avec les puissants et le contraste avec Dieu portent sur l’impuissance de tout humain mortel. En français, la formulation littérale risquerait d’évoquer à tort un titre christologique.
- issue: Portée de תְשׁוּעָה
  choice: salut
  alternative: délivrance ou secours
  rationale: Le mot peut désigner le salut, la délivrance ou le secours. « Salut » préserve sa portée large dans le contraste entre la faiblesse humaine et la puissance salvatrice de Dieu, sans exclure une délivrance concrète.
translation_notes:
  register: Français international moderne, clair et digne. « Les puissants » garde la dimension sociale et politique de נְדִיבִים ; « un être humain » rend immédiatement intelligible l’idiome hébreu. La phrase conserve le parallélisme tout en employant une syntaxe française naturelle.
