source:
  edition: WLC
  text: תֵּצֵ֣א ר֭וּח/וֹ יָשֻׁ֣ב לְ/אַדְמָת֑/וֹ בַּ/יּ֥וֹם הַ֝/ה֗וּא אָבְד֥וּ עֶשְׁתֹּנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: fr
  text: Son souffle s’en va[a] ; il retourne à sa terre ; ce jour-là, ses projets disparaissent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son esprit s’en va ». Le mot hébreu רוּחַ peut signifier « souffle » ou « esprit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא
  choice: s’en va
  rationale: Le verbe יצא signifie concrètement « sortir ». Dans ce contexte de mort, « s’en va » exprime naturellement le départ du souffle vital sans préciser davantage ce qui advient après la mort.
- source_word: רוּחוֹ
  choice: son souffle
  rationale: רוּחַ peut désigner le souffle ou l’esprit. Ici, le retour de l’être humain à la terre favorise l’image concrète du souffle vital ; l’autre sens possible est conservé en note.
- source_word: יָשֻׁב
  choice: il retourne
  rationale: Le verbe שוב signifie « revenir, retourner ». Le sujet est naturellement l’être humain, qui retourne à la terre.
- source_word: לְאַדְמָתוֹ
  choice: à la terre dont il vient
  rationale: אֲדָמָה désigne le sol ou la terre. Le suffixe possessif est rendu idiomatiquement en français par « dont il vient », qui évoque l’appartenance de l’être humain à la terre sans introduire le mot « poussière », absent du verset.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Formulation française naturelle qui conserve la désignation temporelle précise de l’hébreu.
- source_word: אָבְדוּ
  choice: disparaissent
  rationale: אבד exprime ici la perte ou la cessation. « Disparaissent » indique clairement que les projets humains cessent avec la mort, sans suggérer nécessairement une destruction violente.
- source_word: עֶשְׁתֹּנֹתָיו
  choice: ses projets
  rationale: Ce nom rare peut désigner des pensées, des intentions ou des desseins. « Projets » convient au contexte, où l’impuissance des entreprises humaines fonde l’avertissement contre la confiance placée dans les mortels.
theological_decisions:
- issue: Nuance anthropologique de רוּחוֹ dans le contexte de la mort
  choice: « son souffle » dans le texte principal
  alternative: « son esprit »
  rationale: « Souffle » maintient l’image concrète de la vie qui cesse et évite d’imposer au verset une doctrine précise sur l’état intermédiaire. La note conserve l’autre sens réel du terme hébreu.
- issue: Sens du retour à לְאַדְמָתוֹ
  choice: « à la terre dont il vient »
  alternative: « à sa terre »
  rationale: La formulation retenue rend le possessif d’une manière intelligible en français et suggère le lien constitutif entre l’humain et la terre, sans substituer « poussière » au nom hébreu.
translation_notes:
  register: 'Français international moderne, sobre et digne. Le rythme ternaire et les points-virgules préservent la progression du verset : départ du souffle, retour à la terre, disparition des projets.'
