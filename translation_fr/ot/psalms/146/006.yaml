id: PSA.146.6
reference: Psalms 146:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֹשֶׂ֤ה שָׁ֘מַ֤יִם וָ/אָ֗רֶץ אֶת הַ/יָּ֥ם וְ/אֶת כָּל אֲשֶׁר בָּ֑/ם הַ/שֹּׁמֵ֖ר אֱמֶ֣ת לְ/עוֹלָֽם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/006.yaml
  text: who made heaven and earth[a], the sea and all that is in them, who keeps faith forever,
translation:
  language: fr
  text: lui qui a fait le ciel et la terre, la mer et tout ce qui s’y trouve, lui qui demeure fidèle[a] pour toujours,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui garde la vérité pour toujours ». Le mot hébreu peut désigner la vérité ou la fidélité; ici, la fidélité durable paraît mieux convenir au contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: lui qui a fait
  rationale: Le participe qal décrit le Seigneur mentionné au verset précédent. Le passé composé renvoie naturellement à l’acte créateur, tandis que « lui qui » maintient la fonction descriptive du participe.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: le ciel et la terre
  rationale: Cette formule française courante conserve le mérisme désignant l’ensemble de la création. « Les cieux et la terre » serait plus formel, mais moins naturel ici.
- source_word: אֶת הַיָּם
  choice: la mer
  rationale: Le singulier défini de l’hébreu est conservé et correspond à la formule traditionnelle ciel–terre–mer.
- source_word: וְאֶת כָּל אֲשֶׁר בָּם
  choice: et tout ce qui s’y trouve
  rationale: Cette formulation rend clairement la totalité de ce que renferment le ciel, la terre et la mer, sans lourdeur.
- source_word: הַשֹּׁמֵר אֱמֶת
  choice: lui qui demeure fidèle
  rationale: Avec לְעוֹלָם, l’expression souligne la fiabilité constante de Dieu. La tournure idiomatique française rend le sens relationnel de שׁמר אֱמת, tandis que l’autre sens possible, « vérité », est conservé en note.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression moderne et naturelle qui rend la durée sans fin indiquée par l’hébreu.
theological_decisions:
- issue: Sens de אֱמֶת appliqué au caractère de Dieu
  choice: fidèle
  alternative: vérité
  rationale: Dans l’association avec שׁמר et « pour toujours », le mot évoque surtout la fiabilité durable de Dieu. La traduction principale exprime cette fidélité sans la limiter à une formulation doctrinale particulière; le sens lexical « vérité » reste signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « lui qui » maintient le mouvement descriptif des deux participes hébreux et rattache clairement le verset au Seigneur mentionné auparavant.
