source:
  edition: WLC
  text: הַֽלְלוּ יָ֡הּ הַלְלִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/001.yaml
  text: Praise Yah! Praise Yahweh[a], my soul!
translation:
  language: fr
  text: Louez Yah ! Mon âme, loue Yahweh ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de l’ouverture signifie littéralement : « Louez Yah ! » Cette expression est traditionnellement transcrite « Alléluia ! »'
    reason: alternative lexicale traditionnelle
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Louez
  rationale: Impératif masculin pluriel de הלל, qui lance un appel collectif. « Louez » en conserve directement la force exhortative et marque le pluriel en français.
- source_word: יָהּ
  choice: Yah
  rationale: Forme poétique abrégée du nom divin, conservée comme nom propre plutôt qu’intégrée à la translittération « Alléluia ».
- source_word: הַלְלִי
  choice: loue
  rationale: Impératif féminin singulier de הלל, accordé avec נֶפֶשׁ et adressé directement par le psalmiste à son âme. Le singulier français « loue » préserve cette auto-exhortation.
- source_word: נַפְשִׁי
  choice: Mon âme
  rationale: Dans cette adresse à soi-même, « mon âme » est naturel, digne et maintient la dimension intérieure de נֶפֶשׁ sans la réduire à la seule notion de vie.
- source_word: אֶת
  choice: (non traduit séparément)
  rationale: Marqueur de l’objet direct, représenté en français par la construction verbale normale.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom divin personnel, sans le remplacer par le titre « le Seigneur ».
theological_decisions:
- issue: Rendu conjoint de יָהּ et de יְהוָה
  choice: Traduire יָהּ par « Yah » et יְהוָה par « Yahweh »
  alternative: Employer « Alléluia » au début et « le Seigneur » ensuite
  rationale: L’hébreu emploie deux formes apparentées mais distinctes du nom divin. Les conserver rend visible cette distinction et évite de substituer un titre au tétragramme.
translation_notes:
  register: Français international moderne, simple et solennel. L’inversion naturelle « Mon âme, loue Yahweh ! » rend clairement l’adresse directe et l’impératif singulier, tandis que « Louez » garde l’appel collectif initial.
