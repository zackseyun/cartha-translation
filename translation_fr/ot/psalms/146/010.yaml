source:
  edition: WLC
  text: יִמְלֹ֤ךְ יְהוָ֨ה לְ/עוֹלָ֗ם אֱלֹהַ֣יִ/ךְ צִ֭יּוֹן לְ/דֹ֥ר וָ/דֹ֗ר הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: fr
  text: Yahweh régnera pour toujours — ton Dieu, Sion, de génération en génération. Alléluia ![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Louez Yah ! » « Yah » est une forme abrégée du nom Yahweh ; l’expression est ici translittérée par « Alléluia ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְלֹךְ
  choice: régnera
  rationale: L’imparfait qal de מלך peut exprimer une action future ou durable. Dans cette proclamation hymnique, « régnera » rend naturellement l’affirmation tournée vers l’avenir, sans nier la royauté présente de Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre tel que « le Seigneur », afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Dans ce contexte de louange, לְעוֹלָם exprime une durée sans limite. « Pour toujours » est idiomatique en français moderne.
- source_word: אֱלֹהַיִךְ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne féminin singulier renvoie à Sion, personnifiée et directement interpellée.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom propre est conservé sous sa forme française traditionnelle. Sa position indique ici une apostrophe, que la ponctuation française permet de rendre sans ajouter « ô ».
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette expression idiomatique décrit la continuité au fil des générations successives, tout en conservant la répétition de l’hébreu.
- source_word: הַלְלוּ יָהּ
  choice: Alléluia !
  rationale: « Alléluia » est la forme liturgique française établie issue de l’expression hébraïque. Une note en explicite le sens littéral et le nom divin abrégé.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. La translittération préserve le nom personnel au lieu de lui substituer un titre, sans importer une interprétation confessionnelle.
- issue: Valeur temporelle de יִמְלֹךְ
  choice: régnera
  alternative: règne
  rationale: La forme verbale permet une nuance future ou durative. Le futur convient à l’affirmation de la royauté perpétuelle dans ce contexte, tout en laissant intacte l’idée que cette royauté se prolonge sans fin.
- issue: Rendu de הַלְלוּ יָהּ
  choice: Alléluia !
  alternative: Louez Yah !
  rationale: La translittération consacrée reste naturelle dans un psaume français, tandis que la note rend explicite le sens de l’impératif et la forme abrégée du nom divin.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le tiret met en relief l’apostrophe à Sion sans recourir au vocatif plus soutenu « ô Sion ». La cadence répétitive de « de génération en génération » conserve le caractère hymnique du verset.
