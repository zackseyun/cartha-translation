  text: אַשְׁרֵ֗י שֶׁ֤/אֵ֣ל יַעֲקֹ֣ב בְּ/עֶזְר֑/וֹ שִׂ֝בְר֗/וֹ עַל יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: fr
  text: Heureux celui qui a pour secours le Dieu de Jacob[a] et dont l’espoir repose sur Yahvé, son Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui dont le secours est le Dieu de Jacob ».'
    reason: La construction hébraïque peut être rendue plus littéralement par une proposition nominale, même si « avoir pour secours » est plus naturel en français.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux
  rationale: La formule française traditionnelle et naturelle des béatitudes exprime une condition digne d’envie, et non une simple émotion passagère.
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: celui qui a pour secours le Dieu de Jacob
  rationale: 'Cette formulation française rend naturellement la relation exprimée par la construction hébraïque : le Dieu de Jacob est le secours de cette personne, tout en conservant le titre historique et relationnel « Dieu de Jacob ».'
- source_word: שִׂבְרוֹ
  choice: dont l’espoir
  rationale: Le nom désigne l’attente confiante ou l’espoir. « Espoir » convient au registre poétique et au contexte de dépendance envers Dieu.
- source_word: עַל
  choice: repose sur
  rationale: Avec l’espoir, la préposition indique l’objet sur lequel celui-ci s’appuie. « Repose sur » garde cette image de dépendance tout en restant idiomatique en français.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française courante du nom divin préserve ici le nom personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: Le suffixe masculin singulier renvoie à la personne déclarée heureuse et exprime sa relation personnelle avec Dieu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahvé » conserve le nom propre dans une forme française reconnue, sans le remplacer par un titre.
- issue: Sujet implicite de la béatitude
  choice: celui
  alternative: l’homme
  rationale: L’hébreu ne contient pas le nom « homme ». « Celui » respecte le singulier implicite sans ajouter une désignation absente du texte.
- issue: Rapport entre le Dieu de Jacob et le secours
  choice: qui a pour secours le Dieu de Jacob
  alternative: dont le secours est le Dieu de Jacob
  rationale: Le choix principal est plus naturel en français, tandis que l’alternative, signalée en note, reflète plus directement la structure nominale et son ambiguïté d’expression.
translation_notes:
  register: Français international moderne, poétique et digne. « Heureux » maintient la tonalité des béatitudes; la reprise « celui dont » clarifie le parallélisme sans introduire un sujet nouveau.
