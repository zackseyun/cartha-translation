id: PSA.146.9
reference: Psalms 146:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֤ה שֹׁ֘מֵ֤ר אֶת גֵּרִ֗ים יָת֣וֹם וְ/אַלְמָנָ֣ה יְעוֹדֵ֑ד וְ/דֶ֖רֶךְ רְשָׁעִ֣ים יְעַוֵּֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: fr
  text: Yahweh veille sur les étrangers[a] ; il soutient l’orphelin et la veuve, mais il rend tortueux le chemin des méchants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les résidents étrangers » ; le mot hébreu désigne des personnes non originaires du pays qui vivent au sein de la population.
    reason: lexical_alternative
  - marker: b
    text: Ou « il fait dévier le chemin des méchants » ; le verbe peut aussi suggérer qu’il fait échouer leur entreprise ou mène leur chemin à la ruine.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: שֹׁמֵר
  choice: veille sur
  rationale: Le participe exprime une protection attentive et continue ; « veille sur » est naturel en français moderne et conserve cette idée.
- source_word: גֵּרִים
  choice: les étrangers
  rationale: Le terme désigne ici des personnes non originaires du pays qui résident au sein de la communauté, souvent dans une situation de vulnérabilité. « Étrangers » reste clair et léger, avec une note qui précise la nuance résidentielle.
- source_word: יָתוֹם וְאַלְמָנָה
  choice: l’orphelin et la veuve
  rationale: Les singuliers collectifs hébreux désignent deux catégories emblématiques de personnes vulnérables ; la formulation française conserve le parallélisme poétique.
- source_word: יְעוֹדֵד
  choice: soutient
  rationale: Le verbe évoque l’action de fortifier ou de maintenir une personne vulnérable. « Soutient » rend ce sens sans surinterprétation.
- source_word: דֶרֶךְ רְשָׁעִים
  choice: le chemin des méchants
  rationale: « Chemin » conserve la métaphore biblique du cours de la vie ou de la conduite, tandis que « les méchants » rend l’adjectif substantivé collectif.
- source_word: יְעַוֵּת
  choice: rend tortueux
  rationale: Cette expression conserve l’image fondamentale du verbe, celle de courber, fausser ou rendre sinueux, sans la réduire explicitement à la ruine.
theological_decisions:
- issue: La manière dont le dernier membre décrit le jugement divin
  choice: mais il rend tortueux le chemin des méchants
  alternative: mais il mène à la ruine le chemin des méchants
  rationale: 'Le verbe hébreu exprime d’abord l’idée de tordre ou de rendre tortueux. La traduction maintient cette métaphore et sa tension : Yahweh contrarie ou fausse la voie des méchants, sans préciser davantage le résultat final.'
translation_notes:
  register: Français international moderne, digne et poétique. La structure en trois membres et le contraste introduit par « mais » sont conservés. Les termes choisis restent accessibles tout en maintenant la métaphore ouverte du dernier verbe.
