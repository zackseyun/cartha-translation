  text: who executes justice for the oppressed[a], who gives bread to the hungry[b]. Yahweh frees the prisoners.
translation:
  language: fr
  text: lui qui rend justice aux opprimés[a], qui donne du pain aux affamés. Yahweh libère les prisonniers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fait droit aux opprimés ».'
