lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: rend justice
  rationale: L’expression française naturelle « rendre justice » traduit la collocation hébraïque et présente cette action comme une caractéristique constante de Dieu.
- source_word: לָעֲשׁוּקִים
  choice: aux opprimés
  rationale: Le participe passif substantivé désigne les personnes qui subissent l’oppression; cette formulation est concise et conserve la portée sociale du texte.
- source_word: נֹתֵן
  choice: donne
  rationale: Le participe exprime une action caractéristique; « donne » en conserve le sens simple et direct.
- source_word: לֶחֶם
  choice: du pain
  rationale: Le mot hébreu désigne précisément le pain, même s’il peut aussi représenter la nourriture en général.
- source_word: לָרְעֵבִים
  choice: aux affamés
  rationale: L’adjectif substantivé désigne ceux qui ont faim; « aux affamés » convient naturellement avec « donne du pain ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מַתִּיר
  choice: libère
  rationale: Le verbe signifie délier ou relâcher; « libère » exprime clairement le résultat dans ce contexte.
- source_word: אֲסוּרִים
  choice: les prisonniers
  rationale: Le participe passif désigne littéralement des personnes liées; dans ce contexte, « les prisonniers » est une formulation française directe, tandis que la note conserve l’image plus large.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre du Dieu d’Israël; sa translittération le distingue d’un simple titre.
- issue: Portée de אֲסוּרִים
  choice: les prisonniers
  alternative: ceux qui sont liés
  rationale: Le contexte permet une référence concrète aux prisonniers, mais le mot hébreu garde l’image plus générale de personnes liées; cette possibilité est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les participes hébreux sont rendus par des présents qui décrivent les actions caractéristiques de Dieu. Le début « lui qui » maintient le lien syntaxique avec le verset précédent.
