  text: עֹשֶׂ֤ה מִשְׁפָּ֨ט לָ/עֲשׁוּקִ֗ים נֹתֵ֣ן לֶ֭חֶם לָ/רְעֵבִ֑ים יְ֝הוָ֗ה מַתִּ֥יר אֲסוּרִֽים׀׃
