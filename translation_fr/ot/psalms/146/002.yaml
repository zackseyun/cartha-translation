  text: אֲהַלְלָ֣ה יְהוָ֣ה בְּ/חַיָּ֑/י אֲזַמְּרָ֖ה לֵֽ/אלֹהַ֣/י בְּ/עוֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/002.yaml
  text: I will praise Yahweh all my life[a]; I will sing praises to my God as long as I live.
translation:
  language: fr
  text: Je louerai Yahweh toute ma vie[a] ; je chanterai les louanges de mon Dieu tant que je serai en vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ma vie » ; dans le second membre, « dans ma continuation » ou « aussi longtemps que j’existe ». Les deux expressions indiquent la durée de la vie du psalmiste.'
    reason: Précision sur les expressions temporelles hébraïques et leur parallélisme poétique.
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Je louerai
  rationale: Le cohortatif/imparfait à la première personne exprime ici une résolution volontaire tournée vers l’avenir. « Je louerai » la rend sans ajouter une idée de continuité absente du verbe lui-même.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération restitue le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: בְּחַיָּי
  choice: toute ma vie
  rationale: Littéralement « dans ma vie », l’expression indique ici la durée entière de la vie du psalmiste ; « toute ma vie » est idiomatique en français moderne.
- source_word: אֲזַמְּרָה
  choice: je chanterai les louanges
  rationale: Le verbe זמר désigne un chant, souvent musical, adressé à Dieu. Cette formulation conserve à la fois l’acte de chanter et sa fonction laudative.
- source_word: לֵאלֹהַי
  choice: de mon Dieu
  rationale: Après « chanter les louanges », le complément naturel en français se construit avec « de », tout en conservant Dieu comme destinataire de la louange.
- source_word: בְּעוֹדִי
  choice: tant que j’existerai
  rationale: L’expression renvoie à la continuation de l’existence. Ce choix conserve la nuance plus littérale de עוד et évite de répéter exactement l’idée de « vie » du premier membre.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin sans le remplacer par un titre, tandis que « Jéhovah » repose sur une vocalisation traditionnelle plus tardive.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est maintenu avec deux formulations temporelles distinctes ; le point-virgule souligne l’équilibre des deux membres.
