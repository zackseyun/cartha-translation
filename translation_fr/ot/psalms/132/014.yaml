  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : « Voici » pour זֹאת dans son emploi déictique, « mon lieu de repos » pour מְנוּחָתִי, « pour toujours » pour עֲדֵי־עַד, « ici j’habiterai » pour פֹּה אֵשֵׁב, et « car » pour כִּי. « Je l’ai désirée » reflète correctement le verbe אוה et conserve, par l’accord du participe, le suffixe féminin singulier de אִוִּתִיהָ. La note présente de façon juste l’incertitude de référent entre Sion personnifiée et le lieu de repos.'
