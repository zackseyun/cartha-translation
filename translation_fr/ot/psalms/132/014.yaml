source:
  edition: WLC
  text: זֹאת מְנוּחָתִ֥/י עֲדֵי עַ֑ד פֹּֽה אֵ֝שֵׁ֗ב כִּ֣י אִוִּתִֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: fr
  text: Voici mon lieu de repos pour toujours ; ici j’habiterai, car je l’ai désirée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car j’ai désiré ce lieu », si le suffixe féminin renvoie au lieu de repos plutôt qu’à Sion personnifiée.'
    reason: Ambiguïté du référent du suffixe féminin singulier.
lexical_decisions:
- source_word: זֹאת
  choice: Voici
  rationale: Le démonstratif féminin désigne Sion ou le lieu de repos évoqué dans le contexte. « Voici » conserve la force déictique tout en restant naturel en français.
- source_word: מְנוּחָתִי
  choice: mon lieu de repos
  rationale: Dans ce contexte nettement locatif, מְנוּחָה désigne plus probablement un lieu où l’on demeure en repos qu’un état abstrait.
- source_word: עֲדֵי עַד
  choice: pour toujours
  rationale: Cette expression idiomatique marque une durée perpétuelle ; « pour toujours » en restitue naturellement la portée.
- source_word: פֹּה
  choice: ici
  rationale: L’adverbe locatif est rendu directement et conserve l’immédiateté de l’hébreu.
- source_word: אֵשֵׁב
  choice: j’habiterai
  rationale: ישׁב peut signifier « s’asseoir », mais exprime ici l’établissement durable de Dieu à Sion. « Habiter » convient au parallèle avec « lieu de repos ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici la raison de l’établissement divin à Sion.
- source_word: אִוִּתִיהָ
  choice: je l’ai désirée
  rationale: Le verbe exprime le désir ou l’aspiration. L’accord féminin de « désirée » préserve le suffixe féminin singulier, qui renvoie très naturellement à Sion personnifiée.
theological_decisions:
- issue: Référent et genre du suffixe féminin singulier dans אִוִּתִיהָ
  choice: « je l’ai désirée », en comprenant Sion comme personnifiée
  alternative: « j’ai désiré ce lieu », si le suffixe renvoie au lieu de repos sans personnification
  rationale: Sion est fréquemment personnifiée au féminin dans la poésie hébraïque. La traduction principale conserve ce trait grammatical et poétique, tandis qu’une note signale l’autre référent possible sans trancher au-delà des données du texte.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la répétition locative entre « Voici » et « ici », ainsi que la personnification féminine possible de Sion.
