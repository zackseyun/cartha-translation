  yaml_path: translation/ot/psalms/132/017.yaml
  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: fr
  text: Là, je ferai germer une corne pour David[a] ; j’ai préparé une lampe pour celui que j’ai oint[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La « corne » est, dans la Bible hébraïque, une image de la force ou de la puissance royale. On pourrait aussi traduire : « je ferai croître une corne pour David ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour mon oint », voire « pour mon Messie ». Dans le contexte, l’expression désigne d’abord le roi de la lignée de David, tout en pouvant avoir une portée messianique plus large.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe renvoie à Sion, dans le contexte immédiat, et maintient l’accent spatial.
- source_word: אַצְמִיחַ
  choice: je ferai germer
  rationale: Le hiphil de צמח exprime la causation. « Faire germer » conserve l’image végétale sans adopter l’interprétation plus explicite « susciter ».
- source_word: קֶרֶן
  choice: une corne
  rationale: Le sens concret est conservé afin de préserver l’image hébraïque de la force et de la puissance royale.
- source_word: לְדָוִד
  choice: pour David
  rationale: Cette traduction directe respecte la préposition ל et laisse au contexte le soin d’évoquer la dynastie davidique.
- source_word: עָרַכְתִּי
  choice: j’ai préparé
  rationale: Le qal parfait de ערך peut signifier mettre en ordre ou préparer. « Préparer » est naturel avec « lampe » et respecte l’aspect accompli de la forme hébraïque.
- source_word: נֵר
  choice: une lampe
  rationale: Le terme concret est maintenu plutôt que d’expliciter son possible symbolisme dynastique.
- source_word: לִמְשִׁיחִי
  choice: pour celui que j’ai oint
  rationale: Cette formulation française exprime naturellement le sens de « mon oint » tout en évitant de transformer d’emblée le mot en titre technique.
theological_decisions:
- issue: Interprétation de מְשִׁיחִי dans le contexte royal davidique
  choice: celui que j’ai oint
  alternative: mon Messie
  rationale: Le référent immédiat est le roi davidique consacré par Dieu. La traduction principale préserve ce sens lexical et contextuel, tandis que la note signale la portée messianique possible sans la rendre obligatoire.
translation_notes:
  register: Français international moderne, digne et accessible. Les images concrètes de la corne, de la germination et de la lampe sont conservées ; une formulation verbale naturelle rend le possessif de « mon oint ».
