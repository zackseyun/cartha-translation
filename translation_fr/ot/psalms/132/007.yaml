  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: fr
  text: Entrons dans ses demeures[a] ; prosternons-nous devant son marchepied[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans sa demeure ». L’hébreu porte une forme plurielle, qui peut désigner l’ensemble ou les différentes parties d’un même sanctuaire.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le marchepied de ses pieds » ; l’expression française usuelle est « son marchepied ».'
    reason: literal_rendering
lexical_decisions:
- source_word: נָבוֹאָה
  choice: Entrons
  rationale: Le cohortatif qal à la première personne du pluriel exprime ici une exhortation. « Entrons » rend naturellement le mouvement vers l’intérieur suggéré par בוא et par la préposition qui suit.
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: dans ses demeures
  rationale: Le nom hébreu est au pluriel avec un suffixe masculin singulier. « Demeures » conserve ce pluriel et reste plus courant et plus large que « tabernacles ».
- source_word: נִשְׁתַּחֲוֶה
  choice: prosternons-nous
  rationale: Le verbe désigne l’action de s’incliner profondément en signe de révérence. « Prosternons-nous » conserve la posture concrète sans la réduire au sens plus général d’« adorer ».
- source_word: לַהֲדֹם
  choice: devant le marchepied
  rationale: הֲדֹם désigne un marchepied. Dans ce contexte de prosternation, « devant » exprime naturellement la relation spatiale portée par la préposition ל.
- source_word: רַגְלָיו
  choice: de ses pieds
  rationale: Le complément est explicite dans l’hébreu. Le conserver maintient l’image complète, malgré une légère redondance naturelle à la poésie biblique.
theological_decisions:
- issue: Référent des pronoms possessifs
  choice: Conserver simplement « ses » sans expliciter le référent.
  alternative: Identifier explicitement le Seigneur, l’arche ou le lieu de repos choisi.
  rationale: Le contexte entrelace la demeure du Seigneur, l’arche et Sion, tandis que le verset ne nomme pas le référent. La traduction préserve cette ambiguïté littéraire et théologique.
translation_notes:
  register: Français international moderne, digne et exhortatif. Le parallélisme des deux cohortatifs est rendu par deux impératifs à la première personne du pluriel. Le pluriel « demeures » et l’image hébraïque complète du marchepied ont été conservés dans le texte principal.
