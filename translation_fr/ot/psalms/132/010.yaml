  text: בַּ֭/עֲבוּר דָּוִ֣ד עַבְדֶּ֑/ךָ אַל תָּ֝שֵׁ֗ב פְּנֵ֣י מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
translation:
  language: fr
  text: À cause de David, ton serviteur, ne détourne pas ton visage de ton oint.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « ne rejette pas ton oint ». « Ton oint » peut aussi être rendu par « ton Messie », notamment à la lumière du contexte davidique et messianique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: À cause de
  rationale: L’expression introduit ici le motif sur lequel repose la supplication. « À cause de » est naturel en français et indique que David sert de fondement à l’appel.
- source_word: דָּוִד
  choice: David
  rationale: Le nom propre est rendu selon sa forme française traditionnelle.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans ce contexte royal et d’alliance, « serviteur » exprime naturellement la soumission et le service sans mettre au premier plan la condition d’esclave.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: ne repousse pas
  rationale: L’expression hébraïque signifie littéralement « ne détourne pas la face de ». En français, « ne repousse pas » restitue clairement le sens idiomatique de refus, tandis que l’image concrète est conservée en note.
- source_word: מְשִׁיחֶךָ
  choice: ton oint
  rationale: « Oint » conserve le titre royal hébreu et sa résonance messianique sans identifier explicitement ici le personnage au Messie.
theological_decisions:
- issue: Faut-il rendre מְשִׁיחֶךָ comme un titre messianique explicite ?
  choice: ton oint
  alternative: ton Messie
  rationale: Le contexte immédiat vise le roi davidique. « Ton oint » préserve à la fois ce sens royal et la portée messianique possible, sans résoudre la tension canonique dans le texte principal.
translation_notes:
  register: Français moderne, sobre et digne. Le tutoiement correspond à l’adresse directe à Dieu. La formulation privilégie une expression idiomatique claire tout en conservant en note l’image hébraïque et l’alternative messianique.
