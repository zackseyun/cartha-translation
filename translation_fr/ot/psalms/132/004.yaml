  text: je ne donnerai pas de sommeil à mes yeux[a], ni d’assoupissement à mes paupières—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « si je donne du sommeil à mes yeux, de l’assoupissement à mes paupières ». Il s’agit d’une formule de serment elliptique qui signifie : « je ne donnerai pas… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: je ne… pas
  rationale: 'Dans cette formule de serment elliptique, אִם n’introduit pas une simple condition : il sous-entend une imprécation et exprime ici une résolution négative. La négation française en restitue naturellement la force.'
- source_word: אֶתֵּן
  choice: je donnerai
  rationale: 'Le verbe נתן signifie couramment « donner ». Avec la force négative de la formule de serment, il exprime l’engagement : « je ne donnerai pas ».'
- source_word: שְׁנַת
  choice: sommeil
  rationale: Le nom désigne le sommeil. Ce choix est naturel en français et conserve l’image hébraïque consistant à donner du sommeil à ses yeux.
- source_word: לְעֵינָי
  choice: à mes yeux
  rationale: La préposition ל marque ici le destinataire avec נתן. « À mes yeux » respecte la construction et l’image du texte source.
- source_word: לְעַפְעַפַּי
  choice: à mes paupières
  rationale: עפעף désigne la paupière. Le choix préserve le parallélisme corporel avec « mes yeux ».
- source_word: תְּנוּמָה
  choice: assoupissement
  rationale: Le terme désigne un sommeil léger ou une somnolence. « Assoupissement » le distingue de שְׁנַת (« sommeil ») tout en conservant la variation poétique du parallélisme.
