base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: fr
  text: Je couvrirai ses ennemis de honte, mais sa couronne fleurira sur lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son diadème s’épanouira sur lui ». Le verbe hébreu évoque ce qui pousse ou fleurit, et le nom peut désigner une couronne royale ou un diadème.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Le nom pluriel avec suffixe masculin singulier signifie directement « ses ennemis ».
- source_word: אַלְבִּישׁ
  choice: Je couvrirai
  rationale: Le hiphil de לבשׁ signifie littéralement « vêtir ». « Couvrir de honte » conserve l’image du vêtement sous une forme naturelle en français moderne.
- source_word: בֹּשֶׁת
  choice: de honte
  rationale: Le nom exprime la honte ou l’opprobre ; « de honte » forme avec « couvrir » une tournure française claire et idiomatique.
- source_word: וְעָלָיו
  choice: mais sur lui
  rationale: La conjonction introduit ici un contraste entre le sort des ennemis et celui du roi ; « sur lui » préserve l’image spatiale de l’hébreu.
- source_word: יָצִיץ
  choice: fleurira
  rationale: Le verbe évoque ce qui pousse, bourgeonne ou fleurit. « Fleurira » conserve cette métaphore végétale inhabituelle sans la réduire à la seule idée de prospérité.
- source_word: נִזְרוֹ
  choice: sa couronne
  rationale: נֵזֶר peut désigner un diadème, une couronne ou la consécration. Dans le cadre royal du psaume, « couronne » est naturel, tout en laissant la variante « diadème » en note.
theological_decisions:
- issue: Portée royale de נִזְרוֹ dans un psaume davidique
  choice: sa couronne
  alternative: sa consécration
  rationale: Le contexte de la promesse faite à David favorise l’image royale, sans imposer dans la traduction une identification messianique plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme contrasté et les deux images concrètes — être couvert de honte et la couronne qui fleurit — sont conservés.
