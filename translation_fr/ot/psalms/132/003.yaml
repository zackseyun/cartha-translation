  text: אִם אָ֭בֹא בְּ/אֹ֣הֶל בֵּיתִ֑/י אִם אֶ֝עֱלֶ֗ה עַל עֶ֥רֶשׂ יְצוּעָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: fr
  text: 'Non, je n’entrerai pas dans la tente de ma maison[a] ;

    non, je ne monterai pas sur le lit de ma couche[b] —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie ici une formule de serment répétant « si » : littéralement, « Si j’entre… si je monte… » Dans ce contexte, elle signifie que l’auteur s’engage solennellement à ne pas le faire.'
    reason: lexical_alternative
  - marker: b
    text: Ou « le lit de mon lieu de repos ». L’hébreu associe deux termes de sens voisin désignant l’endroit où l’on s’allonge.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: non, je ne… pas
  rationale: Dans la formule de serment commencée au verset précédent, אִם introduit une action que le locuteur s’engage à ne pas accomplir. La négation renforcée restitue naturellement cette valeur en français, tandis que la note conserve la forme hébraïque littérale.
- source_word: אָבֹא
  choice: j’entrerai
  rationale: Le qal inaccompli à la première personne exprime ici l’action future visée par le vœu. « Entrer » convient au complément désignant une habitation.
- source_word: בְּאֹהֶל בֵּיתִי
  choice: dans la tente de ma maison
  rationale: Cette formulation garde les deux images concrètes, « tente » et « maison », ainsi que leur relation syntaxique, sans les réduire au seul terme moderne « chez moi ».
- source_word: אֶעֱלֶה עַל
  choice: je monterai sur
  rationale: La traduction conserve le mouvement spatial de עלה et la préposition עַל. Dans ce contexte, il s’agit de prendre place sur le lit.
- source_word: עֶרֶשׂ יְצוּעָי
  choice: le lit de ma couche
  rationale: Les deux noms proches désignent un meuble ou un lieu où l’on s’allonge. Cette expression conserve leur redoublement poétique plutôt que de les fondre en un seul mot.
theological_decisions: []
translation_notes:
  register: Français moderne, solennel et poétique. La répétition de « non » rend la force du serment sans reproduire de façon obscure le « si » idiomatique de l’hébreu. Le tiret final signale que la phrase et le vœu se poursuivent aux versets suivants.
