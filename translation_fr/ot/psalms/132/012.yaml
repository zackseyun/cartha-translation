  source_fidelity: 'Le texte français suit fidèlement le WLC : la condition réelle introduite par אִם est conservée, de même que « tes fils », « mon alliance », le singulier massorétique « mon témoignage », l’enseignement divin qui s’y rapporte, l’addition de « eux aussi », et la durée « pour toujours ». « Siégeront sur ton trône » rend adéquatement l’image d’intronisation de יֵשְׁבוּ לְכִסֵּא לָךְ. La traduction ne reprend pas à tort le pluriel « testimonies » de la piste anglaise, lequel ne correspond pas à la forme singulière vocalisée du WLC.'
