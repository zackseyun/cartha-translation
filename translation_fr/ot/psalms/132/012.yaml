source:
  edition: WLC
  text: אִֽם יִשְׁמְר֬וּ בָנֶ֨י/ךָ בְּרִיתִ/י֮ וְ/עֵדֹתִ֥/י ז֗וֹ אֲלַ֫מְּדֵ֥/ם גַּם בְּנֵי/הֶ֥ם עֲדֵי עַ֑ד יֵ֝שְׁב֗וּ לְ/כִסֵּא לָֽ/ךְ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: fr
  text: 'Si tes fils gardent mon alliance

    et mon témoignage[a], que je leur enseignerai,

    alors leurs fils, eux aussi,

    siégeront pour toujours sur ton trône.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon décret » ou « ma prescription ».
    reason: Le nom עֵדוּת peut désigner le témoignage divin, notamment sous la forme d’une exigence, d’un décret ou d’une prescription d’alliance.
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit une condition réelle, sans laisser entendre qu’elle sera nécessairement remplie.
- source_word: יִשְׁמְרוּ
  choice: gardent
  rationale: Avec « alliance » et « témoignage », le verbe exprime l’idée de respecter fidèlement et de mettre en pratique.
- source_word: בָנֶיךָ
  choice: tes fils
  rationale: Le terme hébreu est masculin pluriel et vise ici les héritiers royaux de David.
- source_word: בְּרִיתִי
  choice: mon alliance
  rationale: Équivalent français courant et précis de בְּרִית dans ce contexte.
- source_word: וְעֵדֹתִי
  choice: et mon témoignage
  rationale: La forme massorétique est singulière, comme le confirme le relatif singulier זוֹ. « Témoignage » conserve le vocabulaire propre au texte, même si le mot désigne ici une instruction normative de Dieu.
- source_word: זוֹ אֲלַמְּדֵם
  choice: que je leur enseignerai
  rationale: Le relatif se rapporte naturellement à « mon témoignage »; le futur convient au cadre conditionnel et au caractère prospectif de l’enseignement divin.
- source_word: גַּם בְּנֵיהֶם
  choice: alors leurs fils, eux aussi
  rationale: « Eux aussi » rend la valeur additive de גַּם, tandis que « alors » explicite naturellement en français la conséquence de la condition sans en modifier la logique.
- source_word: עֲדֵי עַד
  choice: pour toujours
  rationale: Expression française naturelle de la durée indéfinie ou perpétuelle indiquée par l’idiome hébreu.
- source_word: יֵשְׁבוּ לְכִסֵּא לָךְ
  choice: siégeront sur ton trône
  rationale: « Siéger » rend avec naturel la portée royale de יָשַׁב associé au trône, sans ajouter « régner » au texte.
theological_decisions:
- issue: Caractère conditionnel de la promesse dynastique
  choice: La permanence des fils de David sur son trône est présentée ici comme dépendant de leur fidélité à l’alliance et à l’enseignement divin.
  alternative: Comprendre la condition comme purement rhétorique ou comme n’affectant pas réellement la promesse.
  rationale: La construction introduite par אִם énonce explicitement une condition. La traduction maintient cette tension sans l’harmoniser avec d’autres formulations de la promesse faite à David.
translation_notes:
  register: Français moderne, digne et direct. Le tutoiement correspond à l’adresse faite à David. La disposition en lignes reflète le parallélisme poétique. Le singulier « mon témoignage » suit la vocalisation du WLC et l’accord de זוֹ, plutôt que le pluriel de la couche anglaise de consultation.
