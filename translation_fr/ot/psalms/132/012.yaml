  terminology: « Alliance » est le terme juste pour בְּרִית. « Témoignage » préserve utilement la distinction lexicale d’avec « alliance » et correspond au singulier עֵדוּת ; la note signale sobrement les valeurs normatives possibles sans imposer une interprétation. Le choix de « fils » respecte le masculin pluriel et le contexte dynastique.
