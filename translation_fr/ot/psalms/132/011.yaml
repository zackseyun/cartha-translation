source:
  edition: WLC
  text: נִשְׁבַּֽע יְהוָ֨ה לְ/דָוִ֡ד אֱמֶת֮ לֹֽא יָשׁ֪וּב מִ֫מֶּ֥/נָּה מִ/פְּרִ֥י בִטְנְ/ךָ֑ אָ֝שִׁ֗ית לְ/כִסֵּא לָֽ/ךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: fr
  text: 'Yahweh a fait à David un serment sûr[a] ; il ne se rétractera pas : « C’est un de tes propres descendants[b] que je placerai sur ton trône. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une parole vraie » ou « la vérité ». Le mot hébreu traduit par « sûr » souligne la certitude du serment.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « du fruit de ton ventre ». Il s’agit d’un descendant issu de David. Comparer 2 Samuel 7.12 et Actes 2.30.
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: a fait… un serment
  rationale: Le nifal de שבע exprime ici l’action de prêter serment. Cette tournure est naturelle en français et conserve la force solennelle de l’affirmation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La transcription du nom divin préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: אֱמֶת
  choice: sûr
  rationale: Littéralement « vérité », ce terme souligne ici le caractère certain et fiable du serment. « Un serment sûr » rend cette fonction en français courant.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: il ne se rétractera pas
  rationale: שוב avec מן évoque le fait de revenir sur une parole ou de s’en détourner. « Se rétracter » exprime clairement ici l’irrévocabilité du serment.
- source_word: מִפְּרִי בִטְנְךָ
  choice: un de tes propres descendants
  rationale: L’expression concrète « du fruit de ton ventre » désigne un descendant biologique de David. La formulation retenue communique naturellement cet idiome en français, tandis que la note en conserve l’image littérale.
- source_word: אָשִׁית
  choice: je placerai
  rationale: שׁית signifie mettre, placer ou établir. « Placer » convient à l’intronisation sans ajouter explicitement l’idée d’une nomination.
- source_word: לְכִסֵּא לָךְ
  choice: sur ton trône
  rationale: Dans ce contexte dynastique, la combinaison de לְכִסֵּא et לָךְ désigne naturellement le trône de David. Cette formulation est idiomatique et fidèle au sens contextuel.
theological_decisions:
- issue: Portée dynastique et messianique de la promesse faite à David
  choice: Présenter la promesse comme concernant un descendant physique de David sans expliciter son accomplissement messianique dans le corps du verset.
  alternative: Employer une formulation directement messianique.
  rationale: Le verset énonce d’abord la promesse dynastique faite à David. Son développement messianique dans la lecture canonique ne doit pas être introduit dans la traduction elle-même.
translation_notes:
  register: Français moderne, clair et digne. « Se rétractera » rend idiomatiquement le retrait d’un engagement, et « un de tes propres descendants » évite en français actuel l’étrangeté anatomique de l’expression hébraïque tout en maintenant son sens grâce à la note.
