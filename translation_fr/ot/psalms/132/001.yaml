  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/001.yaml
  text: A Song of Ascents[a]. Remember, O Yahweh[b], for David all his affliction.
translation:
  language: fr
  text: Chant des montées. Souviens-toi, Yahweh, de David[a], de toute son affliction[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La préposition hébraïque peut aussi exprimer l’idée de « en faveur de David » ou de « au sujet de David ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes ses épreuves », « toutes ses peines » ou « tout son abaissement ». Le terme hébreu peut désigner la souffrance, les difficultés ou l’humiliation.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend directement le titre de la collection, littéralement lié à des « montées », sans préciser leur cadre historique incertain.
- source_word: זְכוֹר
  choice: souviens-toi
  rationale: L’impératif conserve la forme brève de la prière et laisse au contexte la portée favorable et active du souvenir demandé à Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לְדָוִד
  choice: de David
  rationale: Avec « se souvenir », cette formulation est naturelle en français et permet de ne pas trancher entièrement entre la référence à David et l’idée d’agir en sa faveur.
- source_word: כָּל עֻנּוֹתוֹ
  choice: toutes ses épreuves
  rationale: « Épreuves » couvre naturellement les peines, difficultés et abaissements que peut désigner le terme hébreu, tandis que le pluriel français rend la totalité exprimée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le tétragramme comme nom propre ; sa transcription préserve cette donnée sans le remplacer par un titre.
- issue: Rapport de לְדָוִד au verbe « se souvenir »
  choice: souviens-toi de David
  alternative: souviens-toi, en faveur de David
  rationale: 'Le choix principal reste fluide en français et conserve une certaine ouverture : la prière peut viser David lui-même en relation avec toutes ses épreuves, tandis que la note signale explicitement la nuance bénéficiaire possible.'
- issue: Portée de עֻנּוֹתוֹ
  choice: toutes ses épreuves
  alternative: toute son affliction
  rationale: Le mot peut englober souffrance, difficultés et humiliation. « Épreuves » maintient cette largeur sémantique sans réduire le passage à l’ascèse ou à la honte.
translation_notes:
  register: Français international moderne, sobre et digne. L’apostrophe et l’exclamation restituent le ton pressant de la prière sans emphase archaïque. « Chant des montées » conserve le titre traditionnel tout en restant transparent.
