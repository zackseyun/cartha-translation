  text: אֲשֶׁ֣ר נִ֭שְׁבַּע לַ/יהוָ֑ה נָ֝דַ֗ר לַ/אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/002.yaml
  text: who swore to Yahweh and vowed to the Mighty One of Jacob:[a]
translation:
  language: fr
  text: 'qui prêta serment à Yahweh

    et fit un vœu au Puissant de Jacob :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: lui qui
  rationale: Le relatif renvoie à David au verset précédent. « Lui qui » assure en français la continuité d’un fragment de phrase cité isolément.
- source_word: נִשְׁבַּע
  choice: fit un serment
  rationale: Le nifal de שׁבע signifie « jurer, prêter serment ». Cette formulation naturelle conserve ici le caractère solennel de l’acte.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל désigne celui envers qui le serment est prononcé, et le tétragramme est rendu comme nom propre.
- source_word: נָדַר
  choice: fit un vœu
  rationale: נדר désigne l’action de faire un vœu. La formulation maintient le parallélisme avec « fit un serment » sans confondre les deux actes.
- source_word: לַאֲבִיר יַעֲקֹב
  choice: au Puissant de Jacob
  rationale: אֲבִיר est un titre divin signifiant « Puissant » ou « Fort »; le complément « de Jacob » est conservé directement.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le présente comme nom propre sans substituer un titre; la vocalisation exacte du nom ancien demeure toutefois incertaine.
- issue: Sens du titre אֲבִיר יַעֲקֹב
  choice: le Puissant de Jacob
  alternative: le Fort de Jacob
  rationale: « Le Puissant » restitue le titre divin dans un registre digne et naturel, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme hébreu est conservé sur deux lignes. Le deux-points final maintient la continuité syntaxique avec le verset suivant.
