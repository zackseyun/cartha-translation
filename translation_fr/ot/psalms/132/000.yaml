  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: fr
  text: Chant des montées. Souviens-toi, Yahvé, de David[a], de toute sa souffrance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur de David » ou « au sujet de David ». Plus littéralement, « pour David » ; la préposition hébraïque peut exprimer ici l’intérêt de David ou ce qui le concerne.
    reason: lexical_alternative
  - marker: b
    text: Ou « son affliction », « ses épreuves » ou « son humiliation ». Le terme hébreu peut désigner la souffrance, les difficultés ou le fait d’être abaissé.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Chant des montées
  rationale: Rend naturellement le titre traditionnel tout en conservant l’image hébraïque des « montées », dont la référence précise n’est pas explicitée.
- source_word: לְדָוִד
  choice: en faveur de David
  rationale: La préposition לְ peut ici indiquer que la demande est faite en faveur de David; une note conserve l’autre lecture possible, plus générale.
- source_word: עֻנּוֹתוֹ
  choice: ses souffrances
  rationale: 'Le nom désigne ce que David a subi: affliction, épreuves ou humiliation. « Souffrances » est clair et suffisamment large en français moderne.'
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Portée de לְדָוִד dans la prière
  choice: en faveur de David
  alternative: au sujet de David / pour David
  rationale: La formulation retenue suit de près la relation marquée par la préposition sans préciser si le souvenir demandé concerne David lui-même ou agit en sa faveur; la note signale cette latitude.
- issue: Nature de עֻנּוֹתוֹ
  choice: souffrances
  alternative: épreuves / humiliation
  rationale: Le terme peut évoquer aussi bien les difficultés subies que l’abaissement; aucun sens théologique plus étroit n’est imposé.
translation_notes:
  register: Français international moderne, sobre et digne. « Souviens-toi » conserve l’adresse directe de la prière; « Chant des montées » maintient le titre hébraïque traditionnel sans en résoudre l’interprétation.
