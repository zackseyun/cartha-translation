  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: fr
  text: Je revêtirai ses prêtres de salut, et ses fidèles pousseront de grands cris de joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie un infinitif absolu suivi d’un verbe conjugué de la même racine pour renforcer l’idée : « ils pousseront assurément des cris de joie » ; le verbe peut aussi évoquer le chant de joie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: ses prêtres
  rationale: Le nom porte un suffixe féminin singulier renvoyant à Sion, personnifiée au féminin dans le contexte. « Ses prêtres » est naturel en français et conserve cette relation.
- source_word: אַלְבִּישׁ
  choice: Je revêtirai
  rationale: Le hiphil de לבשׁ signifie « faire porter, revêtir ». « Revêtir » préserve la métaphore et convient au registre poétique.
- source_word: יֶשַׁע
  choice: de salut
  rationale: יֶשַׁע peut désigner le salut, la délivrance ou la victoire. « Salut » conserve ici l'étendue du terme et s'intègre naturellement à l'image du vêtement.
- source_word: חֲסִידֶיהָ
  choice: ses fidèles
  rationale: חָסִיד désigne des personnes caractérisées par la fidélité, la loyauté d'alliance et l'attachement à Dieu. « Fidèles » est actuel et accessible, sans les connotations ecclésiastiques que pourrait prendre « saints ».
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: pousseront de grands cris de joie
  rationale: L'infinitif absolu suivi du verbe conjugué intensifie l'action. Cette formulation française exprime une joie forte et audible sans reproduire maladroitement la répétition hébraïque.
theological_decisions:
- issue: Sens de חֲסִידֶיהָ dans le contexte de l'alliance et du culte
  choice: ses fidèles
  alternative: ses saints ; ceux qui lui sont attachés
  rationale: « Ses fidèles » rend la loyauté et la piété liées à l'alliance, tout en évitant d'importer une conception confessionnelle ultérieure de la sainteté.
translation_notes:
  register: Français international moderne, poétique et digne. « Revêtirai » maintient l'image biblique; « pousseront de grands cris de joie » restitue l'intensification hébraïque de façon idiomatique.
