source:
  edition: WLC
  text: עַד אֶמְצָ֣א מָ֭קוֹם לַ/יהוָ֑ה מִ֝שְׁכָּנ֗וֹת לַ/אֲבִ֥יר יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/005.yaml
  text: until I find a place for Yahweh[a], a dwelling place for the Mighty One of Jacob.
translation:
  language: fr
  text: 'jusqu’à ce que je trouve un lieu pour Yahweh,

    des demeures pour le Puissant de Jacob.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Introduit le terme de l’engagement formulé dans les versets précédents et appelle naturellement le subjonctif en français.
- source_word: אֶמְצָא
  choice: je trouve
  rationale: L’imparfait qal à la première personne exprime ici l’action future visée par le serment; après « jusqu’à ce que », le présent du subjonctif français convient.
- source_word: מָקוֹם
  choice: un lieu
  rationale: Rend le sens général d’un emplacement destiné à Yahweh sans préciser indûment qu’il s’agit déjà d’un sanctuaire.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition ל indique la destination, et le nom divin est translittéré afin de représenter explicitement le tétragramme.
- source_word: מִשְׁכָּנוֹת
  choice: des demeures
  rationale: Le pluriel hébreu est conservé; « demeures » est actuel et digne, sans la connotation historique plus étroite de « tabernacles ».
- source_word: לַאֲבִיר יַעֲקֹב
  choice: pour le Puissant de Jacob
  rationale: Conserve le titre divin אביר et son complément, avec une formulation française traditionnelle mais intelligible.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte explicitement le tétragramme; « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Nombre de מִשְׁכָּנוֹת
  choice: des demeures
  alternative: une demeure
  rationale: Bien que le contexte puisse viser un lieu cultuel unique et que certaines traductions lissent le sens au singulier, la forme hébraïque est plurielle; le texte français préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme entre « un lieu » et « des demeures » est maintenu, y compris le passage du singulier au pluriel dans l’hébreu.
