  text: כִּֽי בָחַ֣ר יְהוָ֣ה בְּ/צִיּ֑וֹן אִ֝וָּ֗/הּ לְ/מוֹשָׁ֥ב לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/013.yaml
  text: For Yahweh has chosen Zion[a]; he has desired it for his dwelling place.
translation:
  language: fr
  text: Car Yahweh a choisi Sion ; il l’a désirée pour en faire sa demeure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et conserve naturellement le lien logique en français.
- source_word: בָחַר
  choice: a choisi
  rationale: Rend le verbe « choisir » comme une action accomplie dont la portée demeure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme.
- source_word: בְּצִיּוֹן
  choice: Sion
  rationale: Avec בחר, la préposition introduit l’objet choisi ; « choisir Sion » est l’expression française naturelle.
- source_word: אִוָּהּ
  choice: il l’a désirée
  rationale: Préserve le sens de désir et le suffixe féminin renvoyant à Sion, naturellement féminin en français.
- source_word: לְמוֹשָׁב לוֹ
  choice: pour en faire sa demeure
  rationale: Exprime idiomatiquement la destination de Sion comme lieu où Yahweh veut habiter, tout en rendant la valeur d’intérêt personnel de לוֹ.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le nom divin ; sa transcription préserve le nom personnel plutôt que de le remplacer par un titre.
- issue: Référent féminin du suffixe dans אִוָּהּ
  choice: l’a désirée
  alternative: a désiré y établir sa demeure
  rationale: En français, « Sion » est féminin ; le pronom féminin conserve donc sans lourdeur la référence grammaticale et l’éventuelle nuance poétique de personnification.
translation_notes:
  register: Français international moderne, clair et digne. La formulation demeure poétique sans archaïsme. Aucun appel de note n’est nécessaire, puisque le genre féminin de Sion et du pronom est naturel en français.
