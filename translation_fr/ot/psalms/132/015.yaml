source:
  edition: WLC
  text: צֵ֭ידָ/הּ בָּרֵ֣ךְ אֲבָרֵ֑ךְ אֶ֝בְיוֹנֶ֗י/הָ אַשְׂבִּ֥יעַֽ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/015.yaml
  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: fr
  text: Je bénirai abondamment ses provisions[a] ; je rassasierai ses pauvres de pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa nourriture » ou « ses vivres » ; le terme hébreu peut désigner les réserves de nourriture d’une ville.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֵידָהּ
  choice: ses provisions
  rationale: Le nom צֵיד peut désigner des vivres ou des réserves de nourriture. « Provisions » convient au contexte de Sion et évite l’idée trompeuse de gibier.
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: Je bénirai abondamment
  rationale: L’infinitif absolu suivi du verbe conjugué intensifie l’action. « Abondamment » exprime naturellement cette insistance en français.
- source_word: אֶבְיוֹנֶיהָ
  choice: les pauvres qui vivent en elle
  rationale: אֶבְיוֹן désigne les pauvres ou les nécessiteux. Cette formulation rend clairement le suffixe féminin renvoyant à Sion sans employer le peu naturel « ses pauvres ».
- source_word: אַשְׂבִּיעַ
  choice: je rassasierai
  rationale: Le hiphil de שׂבע signifie faire en sorte que quelqu’un soit rassasié. « Rassasier » restitue l’idée de pleine satisfaction.
- source_word: לָחֶם
  choice: de pain
  rationale: Le texte hébreu nomme précisément le pain ; le conserver maintient l’image concrète.
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Les suffixes renvoient à Sion, personnifiée comme une femme.
  alternative: Ils pourraient plus généralement renvoyer au lieu où demeure le SEIGNEUR.
  rationale: Dans le contexte immédiat de Psaumes 132.13-14, le féminin singulier renvoie le plus naturellement à Sion. La formulation française conserve ce référent sans ajouter de précision doctrinale.
translation_notes:
  register: Français moderne, international et digne. La syntaxe parallèle reste poétique et claire ; « les pauvres qui vivent en elle » explicite avec naturel le suffixe féminin hébreu.
