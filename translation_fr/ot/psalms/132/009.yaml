id: PSA.132.9
reference: Psalms 132:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּהֲנֶ֥י/ךָ יִלְבְּשׁוּ צֶ֑דֶק וַ/חֲסִידֶ֥י/ךָ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: fr
  text: Que tes prêtres soient revêtus de justice[a], et que ceux qui te sont fidèles[b] poussent des cris de joie[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de droiture ». Le mot hébreu peut évoquer à la fois la rectitude morale et la justice.
    reason: lexical_alternative
  - marker: b
    text: Ou « tes fidèles », « ceux qui te sont attachés » ou « tes saints ». Le terme hébreu désigne des personnes marquées par la fidélité et le dévouement.
    reason: lexical_alternative
  - marker: c
    text: Ou « chantent de joie ». Le verbe hébreu désigne une expression vocale éclatante de joie.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: tes prêtres
  rationale: כֹּהֵן désigne directement le prêtre; ce choix préserve le cadre cultuel et le suffixe de deuxième personne du masculin singulier.
- source_word: יִלְבְּשׁוּ
  choice: soient revêtus
  rationale: Le verbe לבשׁ exprime l'action de vêtir ou de porter un vêtement. La tournure « soient revêtus de » conserve la métaphore vestimentaire et convient à une prière.
- source_word: צֶדֶק
  choice: justice
  rationale: צֶדֶק recouvre la justice, la droiture et la conformité à ce qui est juste. « Justice » est naturel ici tout en laissant « droiture » comme autre rendu possible.
- source_word: וַחֲסִידֶיךָ
  choice: ceux qui te sont fidèles
  rationale: חָסִיד désigne des personnes caractérisées par la fidélité et l'attachement loyal. Cette formulation française actuelle évite les connotations ecclésiastiques possibles de « saints ».
- source_word: יְרַנֵּנוּ
  choice: poussent des cris de joie
  rationale: Le piel de רנן exprime une réjouissance vocale éclatante; cette formulation en restitue l'intensité sans limiter nécessairement l'action au chant.
theological_decisions:
- issue: Valeur volitive des imparfaits dans le contexte de prière
  choice: Formuler un souhait ou une demande avec « Que… »
  alternative: « Tes prêtres seront revêtus… et ceux qui te sont fidèles pousseront des cris de joie. »
  rationale: Dans le contexte du psaume, les imparfaits ont vraisemblablement une valeur de demande plutôt que de simple prédiction. La construction française « Que… » rend naturellement cette nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme, la métaphore du vêtement et la force de la prière; elle évite un vocabulaire confessionnel marqué.
