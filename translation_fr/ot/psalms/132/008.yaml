source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: fr
  text: Lève-toi, Yahweh, vers ton lieu de repos[a], toi et l’arche de ta force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers ton repos ». Le mot hébreu peut désigner le repos lui-même ou un lieu de repos ; ici, il évoque probablement le lieu où Yahweh établit sa présence.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’arche de ta puissance » ; l’expression peut aussi désigner l’arche qui manifeste la puissance de Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: Impératif de קום adressé à Yahweh. « Lève-toi » conserve la forme d’appel liturgique et peut évoquer aussi bien l’action que la prise de place, sans préciser davantage.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לִמְנוּחָתֶךָ
  choice: viens à ton lieu de repos
  rationale: מְנוּחָה peut désigner le repos ou un lieu de repos. Dans le contexte de l’arche et du sanctuaire, le sens local est vraisemblable. « Viens à » rend naturellement en français la direction exprimée par ל après l’appel « Lève-toi ».
- source_word: אַתָּה
  choice: toi
  rationale: Le pronom indépendant est conservé pour rendre l’insistance et la coordination explicite avec l’arche.
- source_word: וַאֲרוֹן
  choice: et l’arche
  rationale: Dans ce contexte cultuel, אֲרוֹן désigne l’arche associée à la présence de Yahweh; « arche » est le terme français établi.
- source_word: עֻזֶּךָ
  choice: de ta force
  rationale: 'La formulation compacte rend directement le syntagme hébreu et préserve son ambiguïté: l’arche est associée à la force de Yahweh sans que la nature exacte de cette relation soit explicitée.'
theological_decisions:
- issue: Rendu du nom divin YHWH
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le nom propre יהוה. Sa translittération préserve cette donnée du texte source et évite de remplacer le nom par un titre.
- issue: Sens de « l’arche de ta force »
  choice: Conserver le complément « de ta force »
  alternative: ton arche puissante / l’arche qui manifeste ta puissance
  rationale: Le génitif hébreu est dense et peut signaler l’association de l’arche avec la présence puissante de Yahweh. Une paraphrase préciserait une relation que le verset laisse implicite.
translation_notes:
  register: Français international actuel, sobre et liturgique. « Viens à » évite une tournure littérale peu naturelle après « Lève-toi », tandis que « toi et l’arche de ta force » conserve le parallélisme compact et l’étrangeté poétique de l’hébreu.
