  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: fr
  text: Voici, nous avons entendu parler d’elle à Éphrata ; nous l’avons trouvée dans les champs de Jaar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Voyez
  rationale: Marque naturellement en français moderne l’appel à l’attention exprimé par l’hébreu, sans l’archaïsme de « Voici que ».
- source_word: שְׁמַעֲנוּהָ
  choice: nous avons entendu parler d’elle
  rationale: Le verbe « entendre » avec ce complément signifie ici apprendre quelque chose à son sujet. Le pronom féminin conserve le suffixe féminin hébreu sans nommer explicitement son référent.
- source_word: בְאֶפְרָתָה
  choice: à Éphrata
  rationale: Transcription usuelle du nom de lieu, avec la préposition française naturelle pour un lieu.
- source_word: מְצָאנוּהָ
  choice: nous l’avons trouvée
  rationale: Rend directement le verbe « trouver » et maintient l’accord féminin du suffixe hébreu.
- source_word: בִּשְׂדֵי יָעַר
  choice: dans les champs de Yaar
  rationale: Conserve « Yaar » comme désignation géographique et traduit שְׂדֵי par « champs », sans expliciter davantage l’identification du lieu.
theological_decisions:
- issue: Référent du pronom féminin
  choice: Conserver « elle / l’… trouvée » sans ajouter « l’arche »
  alternative: Expliciter « l’arche »
  rationale: Le contexte suggère fortement l’arche, mais le verset hébreu ne la nomme pas ici. Le pronom préserve donc l’implicite et la continuité poétique du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voyez » sert d’appel collectif à l’attention. La ponctuation conserve le parallélisme des deux propositions.
