source:
  edition: WLC
  text: עַד מָתַ֥י תִּשְׁפְּטוּ עָ֑וֶל וּ/פְנֵ֥י רְ֝שָׁעִ֗ים תִּשְׂאוּ סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/002.yaml
  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: fr
  text: Jusqu’à quand jugerez-vous avec injustice et ferez-vous preuve de partialité envers les méchants[a] ? Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « relèverez-vous le visage des méchants », expression hébraïque qui signifie leur accorder une faveur ou faire preuve de partialité envers eux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Jusqu’à quand
  rationale: Cette locution interrogative introduit un reproche concernant une conduite qui se prolonge ; « Jusqu’à quand » en conserve naturellement la force en français.
- source_word: תִּשְׁפְּטוּ עָוֶל
  choice: jugerez-vous avec injustice
  rationale: Le nom עָוֶל qualifie ici la manière de juger. « Avec injustice » préserve à la fois la forme nominale et le cadre judiciaire sans suggérer que l’injustice serait l’objet du jugement.
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: et ferez-vous preuve de partialité envers les méchants
  rationale: L’expression littérale « relever/porter le visage » est un idiome désignant le fait d’accorder une faveur. Dans ce contexte judiciaire, « faire preuve de partialité envers » en exprime clairement la portée.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce terme désigne des personnes moralement coupables. « Les méchants » conserve la catégorie éthique du texte sans la réduire à une culpabilité strictement juridique.
- source_word: סֶלָה
  choice: Sélah
  rationale: La fonction exacte de ce terme musical ou liturgique demeure incertaine ; sa translittération évite d’imposer une interprétation comme « pause » ou « interlude ».
theological_decisions:
- issue: La faveur accordée aux méchants dans l’exercice du jugement
  choice: faire preuve de partialité envers les méchants
  alternative: favoriser les méchants
  rationale: La formulation retenue rend explicite la corruption judiciaire dénoncée par l’idiome hébreu, sans ajouter de précision doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, clair et digne. Le futur interrogatif porte naturellement le reproche prolongé de l’hébreu. « Sélah » est conservé comme terme translittéré en raison de son sens incertain.
