  text: שִׁפְטוּ דַ֥ל וְ/יָת֑וֹם עָנִ֖י וָ/רָ֣שׁ הַצְדִּֽיקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: fr
  text: Rendez justice au faible et à l’orphelin ; faites droit au malheureux et au pauvre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ (šipṭû)
  choice: Rendez justice
  rationale: L’impératif de שׁפט appelle ici les responsables à exercer le jugement en faveur des personnes vulnérables ; « rendre justice » est naturel en français et conserve la portée judiciaire du verbe.
- source_word: דַל (dal)
  choice: faible
  rationale: Le terme désigne une personne de condition fragile ou démunie. « Faible » conserve cette largeur de sens sans le réduire uniquement à la pauvreté matérielle.
- source_word: יָתוֹם (yātôm)
  choice: orphelin
  rationale: Équivalent français direct du terme hébreu désignant l’enfant privé de protection parentale, souvent spécialement de père dans le contexte ancien.
- source_word: עָנִי (ʿānî)
  choice: malheureux
  rationale: Le mot peut évoquer l’affliction, l’humiliation ou la pauvreté. « Malheureux » met ici en avant la détresse tout en le distinguant de רָשׁ, rendu par « pauvre ».
- source_word: רָשׁ (rāš)
  choice: pauvre
  rationale: Le terme désigne clairement une personne indigente ou dépourvue de ressources.
- source_word: הַצְדִּיקוּ (haṣdîqû)
  choice: faites droit
  rationale: La forme causative de צדק signifie reconnaître ou établir le bon droit de quelqu’un, le déclarer dans son droit. « Faites droit » exprime cette idée juridique sans suggérer qu’on rend moralement juste la personne.
theological_decisions:
- issue: Sens de הַצְדִּיקוּ appliqué aux affligés et aux pauvres
  choice: faites droit
  alternative: justifiez / déclarez justes
  rationale: Dans ce cadre judiciaire, l’ordre porte sur la reconnaissance et la défense de leur juste cause, non sur une transformation morale ou sur une doctrine technique de la justification. La formulation française préserve le cadre du tribunal.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme hébreu est conservé par deux impératifs coordonnés et par les deux couples de personnes vulnérables.
