id: PSA.82.1
reference: Psalms 82:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: fr
  text: Psaume d’Asaph. Dieu se tient dans l’assemblée divine ; au milieu des dieux[a], il juge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « êtres divins ». Certains comprennent ici « les dieux » comme désignant des juges ou des dirigeants humains.
    reason: Signaler une autre traduction possible du terme אֱלֹהִים et préserver l’interprétation humaine traditionnelle sans l’imposer au texte principal.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme conventionnel et précis pour désigner ce genre poétique et cultuel dans un titre de psaume.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: Dans les titres des psaumes, la préposition לְ peut exprimer l’attribution, l’appartenance ou l’association ; « d’Asaph » reste naturel sans préciser davantage le lien.
- source_word: אֱלֹהִים (première occurrence)
  choice: Dieu
  rationale: Le participe singulier נִצָּב et le verbe singulier יִשְׁפֹּט indiquent que le Dieu d’Israël est ici le sujet singulier.
- source_word: נִצָּב
  choice: se tient
  rationale: Le participe présente Dieu debout ou prenant place dans une scène judiciaire ; « se tient » conserve cette image avec naturel.
- source_word: בַּעֲדַת אֵל
  choice: dans l’assemblée divine
  rationale: עֵדָה désigne un groupe assemblé, et אֵל qualifie ici vraisemblablement cette assemblée comme divine. La formulation demeure idiomatique sans imposer le terme plus interprétatif de « conseil ».
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Cette expression conserve l’image spatiale de Dieu présent parmi ceux qu’il juge.
- source_word: אֱלֹהִים (seconde occurrence)
  choice: les dieux
  rationale: Le contexte distingue Dieu, sujet singulier, d’un groupe pluriel au milieu duquel il juge. « Les dieux » rend directement le terme hébreu, tandis qu’une note signale les principales compréhensions possibles.
- source_word: יִשְׁפֹּט
  choice: il juge
  rationale: Le verbe שׁפט a ici une valeur judiciaire ; « il juge » est direct, concis et fidèle à la scène.
theological_decisions:
- issue: Référent de la seconde occurrence d’אֱלֹהִים
  choice: « les dieux », compris dans le contexte comme les membres d’une assemblée divine soumis au jugement de Dieu
  alternative: « les êtres divins » ; ou, selon une autre interprétation, des juges ou dirigeants humains
  rationale: La syntaxe oppose le premier אֱלֹהִים, sujet singulier, à un groupe au milieu duquel Dieu juge. Le cadre de l’« assemblée divine » favorise une scène céleste, mais le texte permet une discussion sur l’identité exacte du groupe ; la traduction et la note préservent cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. Le point-virgule conserve le parallélisme des deux propositions. Le marqueur [a] est placé après « dieux », expression à laquelle la note se rapporte.
