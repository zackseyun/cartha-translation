id: PSA.82.7
reference: Psalms 82:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֭כֵן כְּ/אָדָ֣ם תְּמוּת֑וּ/ן וּ/כְ/אַחַ֖ד הַ/שָּׂרִ֣ים תִּפֹּֽלוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: fr
  text: Pourtant, vous mourrez comme les humains[a] et vous tomberez comme l’un des princes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme Adam », si l’expression fait allusion au premier homme plutôt qu’à l’humanité en général.
    reason: alternative_reading
  - marker: b
    text: Ou « dirigeants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Pourtant
  rationale: Marque le contraste appuyé entre le statut élevé affirmé au verset précédent et la sentence de mortalité.
- source_word: כְּאָדָם
  choice: comme les humains
  rationale: אָדָם désigne ici naturellement l’humanité mortelle. Le pluriel générique est idiomatique en français, tandis que la possible allusion à Adam est conservée en note.
- source_word: תְּמוּתוּן
  choice: vous mourrez
  rationale: L’imparfait hébreu à la deuxième personne du pluriel exprime ici l’avenir annoncé dans une sentence de jugement.
- source_word: וּכְאַחַד
  choice: et comme l’un des
  rationale: Rend naturellement la comparaison avec un membre d’un groupe.
- source_word: הַשָּׂרִים
  choice: princes
  rationale: שָׂרִים peut désigner des princes, des dirigeants ou de hauts responsables; « princes » conserve son sens traditionnel de personnages exerçant une haute autorité.
- source_word: תִּפֹּלוּ
  choice: vous tomberez
  rationale: Préserve la métaphore de la chute ou de la déchéance sous le jugement.
theological_decisions:
- issue: Sens de אָדָם dans כְּאָדָם
  choice: Référence générique aux humains dans le texte principal
  alternative: Allusion au premier homme, Adam
  rationale: Le contexte oppose le titre élevé des personnes interpellées à leur mortalité humaine. L’ambiguïté lexicale permettant une allusion à Adam reste toutefois réelle et est signalée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. « Pourtant » exprime nettement le renversement; « les humains » évite un masculin générique inutile tout en rendant la valeur collective de אָדָם.
