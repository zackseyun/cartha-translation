id: PSA.82.8
reference: Psalms 82:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: fr
  text: Lève-toi, ô Dieu ! Juge la terre, car c’est toi qui recevras en héritage toutes les nations.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car tu prendras possession de toutes les nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: L’impératif de קום appelle Dieu à intervenir. « Lève-toi » est direct, naturel en français actuel et conserve l’urgence de la prière.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Les impératifs et le pronom au singulier montrent que Dieu est directement interpellé. « ô Dieu » convient au registre digne de la prière sans être obscur.
- source_word: שָׁפְטָה
  choice: Juge
  rationale: Le verbe שׁפט possède ici une portée à la fois judiciaire et royale. « Juge » conserve cette amplitude sans réduire le sens à « gouverne » ou à « rends justice ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallèle avec « toutes les nations » indique une portée universelle plutôt que le sens local de « pays ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande. « Car » exprime clairement ce rapport logique dans un registre soutenu mais courant.
- source_word: אַתָּה
  choice: c’est toi qui
  rationale: La tournure clivée rend l’emphase du pronom hébreu explicite et naturelle en français.
- source_word: תִנְחַל
  choice: recevras en héritage
  rationale: Le verbe נחל évoque l’acquisition ou la possession comme héritage. Cette formulation préserve cette nuance tout en restant plus naturelle ici que « hériteras toutes les nations ».
- source_word: בְּכָל הַגּוֹיִם
  choice: toutes les nations
  rationale: Avec נחל, la préposition introduit idiomatiquement le domaine ou l’objet de la possession. Le français omet donc la préposition et conserve la portée universelle du groupe nominal.
theological_decisions:
- issue: Sens de la relation de Dieu aux nations dans תִנְחַל בְּכָל הַגּוֹיִם
  choice: c’est toi qui recevras en héritage toutes les nations
  alternative: car toutes les nations t’appartiennent / car tu prendras possession de toutes les nations
  rationale: Le futur hébreu fonde l’appel au jugement sur la souveraineté universelle de Dieu. « Recevoir en héritage » maintient l’image biblique de l’héritage et sa tension lorsqu’elle est appliquée à Dieu, sans la remplacer par une simple affirmation abstraite de propriété.
translation_notes:
  register: Français international moderne, clair et digne. Le vocatif « ô Dieu » garde la solennité de la prière, tandis que « Lève-toi » et « Juge » rendent avec force les deux impératifs. La ponctuation met en relief l’appel urgent sans ajouter de contenu.
