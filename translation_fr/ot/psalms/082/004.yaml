  text: פַּלְּטוּ דַ֥ל וְ/אֶבְי֑וֹן מִ/יַּ֖ד רְשָׁעִ֣ים הַצִּֽילוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/004.yaml
  text: Rescue the poor and needy[a]; deliver them from the hand of the wicked.
translation:
  language: fr
  text: Délivrez le faible et le nécessiteux[a] ; arrachez-les de la main des méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pauvre et le nécessiteux ». Le mot hébreu דַּל peut désigner une personne pauvre ou faible, en insistant sur sa vulnérabilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Délivrez
  rationale: L’impératif pluriel de פלט appelle une intervention active pour mettre les personnes vulnérables en sûreté. « Délivrez » est naturel, digne et conserve la force de l’ordre.
- source_word: דַל
  choice: le faible
  rationale: דַּל peut désigner une personne pauvre, faible ou socialement démunie. Avec אֶבְיוֹן, « le faible » évite une répétition sémantique et met en relief la vulnérabilité, tout en conservant en note l’autre sens possible.
- source_word: אֶבְיוֹן
  choice: le nécessiteux
  rationale: אֶבְיוֹן désigne celui qui manque du nécessaire ou vit dans le dénuement. « Le nécessiteux » préserve cette nuance socioéconomique et convient au registre poétique.
- source_word: מִיַּד
  choice: à la main de
  rationale: La locution hébraïque exprime la délivrance hors du pouvoir ou de l’emprise de quelqu’un. Le français « arracher à la main de » maintient l’image concrète de la source.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Le pluriel substantivé désigne ceux qui agissent avec culpabilité et injustice. « Les méchants » conserve la portée morale sans ajouter de précision absente de l’hébreu.
- source_word: הַצִּילוּ
  choice: arrachez-les
  rationale: L’impératif pluriel de נצל évoque le fait de soustraire quelqu’un à un danger ou à une puissance hostile. « Arrachez-les » distingue ce second ordre du premier et exprime avec force l’intervention demandée.
theological_decisions:
- issue: Préservation des deux impératifs parallèles
  choice: 'Deux commandements coordonnés : « Délivrez… ; arrachez-les… »'
  alternative: 'Fondre les deux propositions en un seul commandement : « Délivrez le faible et le nécessiteux de la main des méchants. »'
  rationale: L’hébreu emploie deux impératifs qui se renforcent mutuellement. Les conserver maintient le parallélisme poétique et l’urgence morale sans réduire la tension du texte.
- issue: Portée de דַל
  choice: « le faible », avec « le pauvre » en note
  alternative: « le pauvre » dans le texte principal
  rationale: Le terme peut renvoyer aussi bien à la faiblesse et à l’impuissance sociale qu’à la pauvreté. Le contexte judiciaire permet les deux lectures ; la note préserve explicitement cette ambiguïté lexicale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébraïque est conservé par deux impératifs distincts, et l’image de la « main » est maintenue sans explicitation interprétative.
