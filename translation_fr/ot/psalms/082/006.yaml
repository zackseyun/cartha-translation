  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: fr
  text: 'J’ai dit : « Vous êtes des dieux, et vous êtes tous des fils du Très-Haut. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: des dieux
  rationale: Le pluriel prédicatif « des dieux » rend directement le terme hébreu dans cette adresse, sans préciser davantage l’identité des destinataires.
- source_word: וּבְנֵי עֶלְיוֹן
  choice: vous êtes tous des fils du Très-Haut
  rationale: La copule est naturellement reprise en français. « Fils du Très-Haut » conserve l’expression relationnelle hébraïque et le titre divin.
- source_word: כֻּלְכֶם
  choice: tous
  rationale: Placée avec le second membre, cette formulation indique sans ambiguïté que l’ensemble des destinataires est visé.
theological_decisions:
- issue: Identité et statut des personnes appelées אֱלֹהִים
  choice: Conserver « des dieux » sans explication dans le verset
  alternative: Interpréter comme « des juges » ou « des êtres divins »
  rationale: Le mot hébreu est réellement polysémique, et le contexte a donné lieu à plusieurs lectures. Traduire littéralement préserve cette tension au lieu d’imposer une interprétation.
- issue: Relation exprimée par « fils du Très-Haut »
  choice: Conserver la métaphore filiale
  alternative: Paraphraser par « appartenant au Très-Haut » ou « êtres célestes »
  rationale: La formulation hébraïque est théologiquement chargée mais non explicitée ici; elle doit donc rester ouverte.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme hébreu est préservé, avec répétition de « vous êtes » pour une syntaxe française naturelle et pour relier clairement « tous » au second prédicat.
