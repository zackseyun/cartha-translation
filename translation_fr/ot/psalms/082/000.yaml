  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/000.yaml
  text: A psalm of Asaph[a]. God stands in the assembly of God; in the midst of the gods he judges.
translation:
  language: fr
  text: Psaume d’Asaph. Dieu se tient dans l’assemblée de Dieu ; au milieu des dieux[a], il juge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des êtres divins ». Certains comprennent ici « les dieux » comme des juges ou des dirigeants humains.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Psaume d’Asaph
  rationale: Rend naturellement la suscription hébraïque tout en conservant l’ambiguïté possible de la préposition לְ, qui peut indiquer l’auteur, l’appartenance ou l’association.
- source_word: נִצָּב
  choice: se tient
  rationale: Exprime la posture solennelle et active du verbe hébreu sans ajouter l’idée de simple présence.
- source_word: בַּעֲדַת אֵל
  choice: dans l’assemblée de Dieu
  rationale: Suit de près la construction hébraïque et conserve le parallélisme ainsi que la tension créée par les emplois voisins des termes divins.
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: au milieu des dieux
  rationale: Le pluriel convient au contexte immédiat, mais son référent demeure discuté ; la note signale les principales possibilités sans les trancher.
- source_word: יִשְׁפֹּט
  choice: il juge
  rationale: Rend directement l’imparfait hébreu dans cette scène présentée comme actuelle, avec Dieu pour sujet.
theological_decisions:
- issue: Identité des אֱלֹהִים parmi lesquels Dieu juge
  choice: les dieux
  alternative: les êtres divins ; les juges ou dirigeants humains
  rationale: Le texte emploie אֱלֹהִים au pluriel dans un cadre d’assemblée. La traduction principale reste transparente, tandis que la note préserve l’ambiguïté ontologique et interprétative.
- issue: Nature de l’assemblée désignée par עֲדַת אֵל
  choice: l’assemblée de Dieu
  alternative: l’assemblée divine
  rationale: La formulation retenue reflète plus formellement le syntagme hébreu et évite de définir d’avance l’assemblée comme céleste ou humaine.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition de « Dieu » et « dieux » est volontaire afin de refléter le jeu lexical de l’hébreu. Le marqueur de note est placé après l’expression qu’il explique.
