id: PSA.82.5
reference: Psalms 82:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: fr
  text: Ils ne savent pas et ne comprennent pas ; ils vont et viennent dans les ténèbres. Tous les fondements de la terre[a] chancellent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays », si אָרֶץ est compris dans un sens plus local.
    reason: alternative_reading
  - marker: b
    text: Ou « sont ébranlés », « vacillent » ou « cèdent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: ils ne savent pas
  rationale: Le qal de ידע signifie couramment « savoir, connaître ». Ici, le parfait décrit naturellement un état présent d’ignorance, en parallèle avec le verbe suivant.
- source_word: וְלֹא יָבִינוּ
  choice: et ne comprennent pas
  rationale: Le hiphil de בין peut signifier « comprendre » ou « discerner ». « Comprendre » est naturel en français moderne et maintient le parallélisme avec « savoir ».
- source_word: בַּחֲשֵׁכָה
  choice: dans les ténèbres
  rationale: Cette formulation conserve l’image du texte hébreu dans un registre poétique et digne, sans préciser si l’obscurité est intellectuelle, morale ou spirituelle.
- source_word: יִתְהַלָּכוּ
  choice: ils vont et viennent
  rationale: Le hitpael de הלך peut évoquer un déplacement continu ou habituel. « Vont et viennent » rend cette nuance mieux que le simple « marchent », sans imposer explicitement l’idée d’errance.
- source_word: יִמּוֹטוּ
  choice: chancellent
  rationale: Le niphal de מוט exprime l’ébranlement, l’instabilité ou le fait de céder. « Chancellent » restitue vivement l’instabilité des fondements sans affirmer leur effondrement complet.
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: tous les fondements de la terre
  rationale: מוֹסְדֵי désigne des fondements ou assises. Dans cette image poétique à portée générale, « terre » rend bien אָרֶץ, tout en signalant en note la possibilité plus locale de « pays ».
theological_decisions:
- issue: Portée de אָרֶץ et image de la déstabilisation
  choice: la terre, avec une portée mondiale ou cosmique
  alternative: le pays, dans un sens plus local
  rationale: Le contexte du psaume relie l’injustice à l’ébranlement de l’ordre établi. « Terre » préserve la vaste portée possible de l’image, sans expliciter davantage sa signification théologique.
translation_notes:
  register: Français international moderne, poétique et accessible. Le parallélisme des deux premières propositions est conservé, ainsi que l’image non explicitée des ténèbres et des fondements instables.
