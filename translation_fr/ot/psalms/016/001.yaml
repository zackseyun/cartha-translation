id: PSA.16.1
reference: Psalms 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִכְתָּ֥ם לְ/דָוִ֑ד שָֽׁמְרֵ֥/נִי אֵ֝֗ל כִּֽי חָסִ֥יתִי בָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/001.yaml
  text: A miktam of David. Preserve me[a], O God, for I take refuge in you.
translation:
  language: fr
  text: Miktam[a] de David. Garde-moi, ô Dieu, car je trouve refuge en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : miktam, terme au sens incertain placé en tête de certains psaumes; il pourrait désigner un type de composition. Certains traduisent « psaume », « chant d’or » ou « inscription ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: Miktam
  rationale: Le sens de ce terme placé en tête du psaume demeure incertain. Sa translittération préserve la forme hébraïque sans imposer une interprétation conjecturale.
- source_word: לְדָוִד
  choice: de David
  rationale: Dans les titres des psaumes, la préposition לְ peut exprimer l’auteur, l’appartenance, l’association ou la dédicace. « de David » reste naturel en français tout en évitant de préciser excessivement ce rapport.
- source_word: שָׁמְרֵנִי
  choice: Garde-moi
  rationale: L’impératif de שׁמר demande à Dieu d’assurer la garde et la protection du psalmiste. « Garde-moi » est direct, digne et suffisamment large pour ne pas limiter la demande à un seul type de danger.
- source_word: אֵל
  choice: ô Dieu
  rationale: אֵל est ici un titre divin employé en apostrophe. « ô Dieu » restitue clairement cette adresse directe dans un registre de prière.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de la demande. « car » exprime avec concision ce lien causal.
- source_word: חָסִיתִי
  choice: je trouve refuge
  rationale: Le verbe חסה évoque le fait de chercher ou de trouver abri auprès de quelqu’un. Le présent français exprime ici une confiance établie et conserve l’image concrète du refuge, sans la réduire au simple verbe « faire confiance ».
- source_word: בָךְ
  choice: en toi
  rationale: Avec חסה, la préposition בְּ désigne celui auprès de qui l’on se réfugie. « en toi » est l’équivalent français naturel et traditionnel de cette relation.
theological_decisions:
- issue: Sens du titre מִכְתָּם
  choice: Translittérer par « Miktam » sans lui attribuer un sens certain.
  alternative: Traduire par un terme générique comme « psaume », ou par une interprétation telle que « chant d’or » ou « inscription ».
  rationale: L’étymologie et la fonction précise de מִכְתָּם sont discutées. La translittération maintient cette incertitude réelle au lieu de transformer une hypothèse lexicale en affirmation.
translation_notes:
  register: Français international moderne, simple et digne. « Garde-moi » convient à une supplication directe; « je trouve refuge en toi » conserve l’image hébraïque de l’abri tout en exprimant naturellement une confiance durable.
