  text: Miktam[a] de David. Garde-moi, ô Dieu, car je me réfugie en toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu miktam, terme employé dans le titre de certains psaumes et dont le sens est incertain; il peut désigner un type de composition. Certains traduisent « psaume » ou « chant d’or ».
