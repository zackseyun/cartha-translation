lexical_decisions:
- source_word: מִכְתָּם (miktam)
  choice: Miktam
  rationale: Terme technique figurant dans le titre de plusieurs psaumes et dont le sens demeure incertain; la translittération préserve cette incertitude sans imposer une interprétation.
- source_word: שָׁמְרֵנִי (shomreni)
  choice: Garde-moi
  rationale: Rend directement l’impératif du verbe שׁמר, qui exprime ici la protection et la préservation.
- source_word: חָסִיתִי בָךְ (ḥasiti vak)
  choice: je me réfugie en toi
  rationale: Le verbe חסה désigne l’action de chercher refuge ou protection; le présent français exprime naturellement la confiance actuelle du psalmiste, sans exclure l’aspect accompli de la forme hébraïque.
theological_decisions:
- issue: Désignation divine אֵל (’El)
  choice: ô Dieu
  alternative: Dieu
  rationale: « Dieu » correspond au nom divin générique אֵל; « ô » marque naturellement l’adresse directe en français, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le terme énigmatique du titre et le parallélisme concis de l’hébreu.
