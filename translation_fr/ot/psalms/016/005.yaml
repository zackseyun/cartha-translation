source:
  edition: WLC
  text: יְֽהוָ֗ה מְנָת חֶלְקִ֥/י וְ/כוֹסִ֑/י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: fr
  text: Yahvé est la part de mon héritage et ma coupe[a] ; c’est toi qui assures mon lot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahvé est ma part et ma coupe ». L’hébreu enchaîne plusieurs images d’attribution — « part », « héritage », « lot » — dans un espace très bref.'
    reason: Alternative lexicale et clarification de l’image poétique.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt que son remplacement par le titre « le Seigneur ».
- source_word: מְנָת חֶלְקִי
  choice: la part de mon héritage
  rationale: Cette formulation conserve la relation entre les deux termes hébreux étroitement associés et fait entendre l’image d’une part attribuée en héritage.
- source_word: וְכוֹסִי
  choice: et ma coupe
  rationale: La traduction garde l’image biblique concrète de la coupe, sans l’expliciter dans le corps du texte comme expérience ou destinée attribuée.
- source_word: אַתָּה
  choice: c’est toi
  rationale: La tournure emphatique rend la présence explicite du pronom hébreu.
- source_word: תּוֹמִיךְ
  choice: assures
  rationale: Le verbe exprime ici l’action de soutenir, maintenir ou garantir ce qui revient au psalmiste ; « assures » est naturel en français avec « lot » et conserve cette amplitude.
- source_word: גּוֹרָלִי
  choice: mon lot
  rationale: « Lot » préserve l’image de l’attribution par tirage et son lien avec le vocabulaire de la part et de l’héritage.
theological_decisions:
- issue: Yahvé lui-même comme part attribuée au psalmiste
  choice: Conserver les images successives de la part, de l’héritage, de la coupe et du lot.
  alternative: Simplifier en « Yahvé est ma part et ma coupe » ou interpréter le lot comme la destinée.
  rationale: L’hébreu superpose plusieurs images d’attribution. Les maintenir laisse subsister la densité poétique et théologique selon laquelle Yahvé est lui-même l’héritage du psalmiste tout en assurant ce qui lui est attribué.
translation_notes:
  register: Français international moderne, poétique et digne. « C’est toi » marque l’insistance du pronom hébreu ; « assures mon lot » reste intelligible sans effacer l’image de l’attribution.
