source:
  edition: WLC
  text: כִּ֤י לֹא תַעֲזֹ֣ב נַפְשִׁ֣/י לִ/שְׁא֑וֹל לֹֽא תִתֵּ֥ן חֲ֝סִידְ/ךָ֗ לִ/רְא֥וֹת שָֽׁחַת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/010.yaml
  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: fr
  text: Car tu n’abandonneras pas mon âme au shéol ; tu ne laisseras pas ton fidèle[a] voir la fosse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton saint ». Le mot hébreu peut désigner quelqu’un de fidèle, loyal, pieux ou saint.
    reason: lexical_alternative
  - marker: b
    text: Ou « la corruption ». La Septante et la citation de ce verset dans le Nouveau Testament emploient une formulation qui met l’accent sur la corruption.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la confiance exprimée auparavant et convient au mouvement poétique du psaume.
- source_word: תַעֲזֹב
  choice: tu n’abandonneras pas
  rationale: Le verbe peut signifier « laisser », « délaisser » ou « abandonner » ; « abandonner » exprime ici le fait de ne pas livrer le psalmiste au pouvoir de la mort.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נפש peut désigner l’âme, la vie ou la personne elle-même. « Mon âme » conserve l’image hébraïque et son parallélisme, sans exclure le sens plus large de « ma vie » ou « moi-même ».
- source_word: לִשְׁאוֹל
  choice: au shéol
  rationale: Le shéol est, dans le monde conceptuel hébraïque, le séjour des morts plutôt qu’une simple tombe. La translittération préserve cette notion particulière.
- source_word: תִתֵּן
  choice: tu ne laisseras pas
  rationale: Bien que נתן signifie littéralement « donner », suivi ici d’un infinitif il prend naturellement le sens de « permettre » ou « laisser ».
- source_word: חֲסִידְךָ
  choice: ton fidèle
  rationale: חסיד désigne une personne caractérisée par la fidélité, la loyauté ou la piété. « Ton fidèle » rend sa dimension relationnelle sans imposer un sens théologique plus technique.
- source_word: לִרְאוֹת
  choice: voir
  rationale: Conserve l’idiome hébraïque, dans lequel « voir » peut aussi impliquer le fait de subir ou de connaître une réalité.
- source_word: שָׁחַת
  choice: la fosse
  rationale: En parallèle avec le shéol, « la fosse » est un sens direct et contextuellement naturel de שחת, tout en laissant l’autre lecture ancienne en note.
theological_decisions:
- issue: Portée messianique du verset dans son emploi ultérieur dans le Nouveau Testament
  choice: Traduire d’abord le sens lexical immédiat du texte hébreu, avec « ton fidèle » et « la fosse ».
  alternative: Employer « ton saint » et « la décomposition » afin de faire ressortir plus directement la lecture christologique transmise par la Septante et les citations apostoliques.
  rationale: Le texte principal doit refléter l’hébreu du psaume sans y intégrer d’avance son application néotestamentaire. Les variantes à forte résonance christologique sont néanmoins signalées en notes afin de préserver la tension interprétative.
translation_notes:
  register: Français international moderne, sobre et poétique. « Shéol » conserve le terme culturel hébreu ; la syntaxe parallèle et l’expression « voir la fosse » maintiennent la forme imagée du verset tout en restant intelligibles.
