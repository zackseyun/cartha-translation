source:
  edition: WLC
  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: fr
  text: Tu me fais connaître le chemin de la vie[a] ; en ta présence, il y a une plénitude de joies[b] ; à ta droite, il y a des délices pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Tu me feras connaître le chemin de la vie. »'
    reason: ambiguïté de la valeur présente ou future de l’inaccompli hébreu
  - marker: b
    text: L’hébreu mentionne littéralement « ta face » ; cette expression désigne ici la présence immédiate.
    reason: transparence lexicale et image hébraïque
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Tu me fais connaître
  rationale: Le hifil de ידע avec suffixe de première personne signifie « faire connaître à quelqu’un ». Le présent exprime ici naturellement la confiance poétique, sans effacer la possible nuance future signalée en note.
- source_word: אֹרַח חַיִּים
  choice: le chemin de la vie
  rationale: אֹרַח désigne un chemin ou une voie, au sens propre ou figuré, et חַיִּים fonctionne couramment comme le nom abstrait « vie » malgré sa forme plurielle.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: une plénitude de joies
  rationale: שֹׂבַע évoque la plénitude, l’abondance ou la satiété. Le pluriel « joies » conserve la forme et la richesse expressive de שְׂמָחוֹת.
- source_word: אֶת־פָּנֶיךָ
  choice: en ta présence
  rationale: L’expression liée à la « face » de Dieu désigne idiomatiquement sa présence immédiate. Le français naturel est retenu dans le texte, tandis que l’image littérale est indiquée en note.
- source_word: נְעִמוֹת
  choice: des délices
  rationale: Le terme substantivé désigne des choses agréables, des plaisirs ou des délices. « Délices » convient au registre poétique et au parallélisme avec les joies.
- source_word: בִּימִינְךָ
  choice: à ta droite
  rationale: Cette expression spatiale rend directement l’image hébraïque de la proximité privilégiée auprès de Dieu.
- source_word: נֶצַח
  choice: pour toujours
  rationale: Dans ce contexte, נֶצַח exprime une durée sans fin ; « pour toujours » est clair et naturel en français moderne.
theological_decisions:
- issue: Valeur temporelle de l’inaccompli תּוֹדִיעֵנִי
  choice: 'présent de confiance : « Tu me fais connaître »'
  alternative: 'futur : « Tu me feras connaître »'
  rationale: La forme peut évoquer soit une action actuelle caractéristique, soit une assurance tournée vers l’avenir. Le présent suit la confiance poétique du verset, et la note maintient l’autre possibilité.
- issue: Rendu de l’expression אֶת־פָּנֶיךָ
  choice: « en ta présence »
  alternative: « devant ta face » / « auprès de ta face »
  rationale: La formulation idiomatique communique clairement le sens en français actuel sans transformer la présence divine en notion abstraite ; la note préserve l’image concrète de la face.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des trois membres est conservé ; le dernier garde l’ellipse verbale de l’hébreu, naturelle en poésie française.
