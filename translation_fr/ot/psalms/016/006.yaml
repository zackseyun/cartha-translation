source:
  edition: WLC
  text: חֲבָלִ֣ים נָֽפְלוּ לִ֭/י בַּ/נְּעִמִ֑ים אַף נַ֝חֲלָ֗ת שָֽׁפְרָ֥ה עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/006.yaml
  text: The boundary lines have fallen for me in pleasant places[a]; indeed[b], my inheritance is beautiful to me.
translation:
  language: fr
  text: Les lignes de partage me sont échues dans des lieux agréables[a] ; oui, mon héritage m’est agréable[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Les cordes d’arpentage me sont échues dans des lieux agréables ». L’hébreu évoque les cordes ou les lignes qui délimitaient une part attribuée.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon héritage est beau pour moi » ou « mon héritage me plaît ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבָלִים
  choice: lignes de partage
  rationale: Dans le contexte du partage d’un territoire, le terme désigne les cordeaux servant à mesurer, les limites qu’ils tracent ou, par métonymie, les portions attribuées. « Lignes de partage » conserve l’image concrète tout en la rendant compréhensible.
- source_word: נָפְלוּ
  choice: sont tombées
  rationale: Le verbe signifie littéralement « tomber » et évoque ici le résultat d’un partage par attribution. La traduction garde cette image hébraïque plutôt que de l’expliciter par « ont été attribuées ».
- source_word: לִי
  choice: pour moi
  rationale: Le datif exprime ici l’intérêt ou l’avantage du psalmiste.
- source_word: בַּנְּעִמִים
  choice: en des lieux agréables
  rationale: Le pluriel substantivé de נעים évoque ce qui est agréable ou délicieux. Dans la métaphore territoriale, une expression locative convient naturellement.
- source_word: אַף
  choice: oui
  rationale: La particule renforce et confirme la première proposition. « Oui » en restitue sobrement la valeur emphatique.
- source_word: נַחֲלָת
  choice: mon héritage
  rationale: Le mot appartient au vocabulaire de l’héritage et de la part attribuée. Le possessif est requis par le contexte et par la relation personnelle exprimée dans la suite.
- source_word: שָׁפְרָה
  choice: est beau
  rationale: Le verbe exprime la beauté, l’agrément ou la qualité favorable. Le parfait a ici une valeur stative, naturellement rendue au présent.
- source_word: עָלָי
  choice: à mes yeux
  rationale: Littéralement « sur moi », la préposition exprime ici le jugement ou l’appréciation personnelle. « À mes yeux » donne un français naturel sans effacer cette dimension subjective.
theological_decisions:
- issue: L’image du partage territorial comme expression de la part reçue de Dieu
  choice: Conserver les lignes de partage et l’héritage comme images concrètes
  alternative: Remplacer l’image par une formulation générale sur les bienfaits ou la belle part reçue
  rationale: Le vocabulaire fait écho au partage d’un territoire et, dans le contexte immédiat, à l’Éternel comme part du psalmiste. Maintenir l’image préserve cette richesse théologique sans imposer une interprétation supplémentaire.
translation_notes:
  register: Français moderne, digne et accessible. La formulation conserve volontairement l’image ancienne des lignes qui « tombent » lors d’une attribution, tandis que les notes en éclairent le sens sans l’aplanir.
