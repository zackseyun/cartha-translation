  source_fidelity: 'Le sens fondamental est bien rendu : les lignes/cordes liées au partage d’une terre, une attribution favorable, puis l’héritage apprécié par le psalmiste. Toutefois, « sont tombées pour moi en des lieux » reproduit trop littéralement une tournure hébraïque et ne sonne pas naturellement en français. « À mes yeux » introduit plus explicitement l’idée d’un jugement visuel/cognitif que ne le fait la préposition עָלַי dans cette expression.'
