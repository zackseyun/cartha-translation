  to: Les lignes de partage me sont échues dans des lieux agréables[a] ; oui, mon héritage m’est agréable[b].
  rationale: La révision remplace un calque peu idiomatique par « me sont échues », expression française usuelle pour une part attribuée. Elle conserve les termes concrets « lignes de partage » et « héritage », ainsi que l’emphase de אַף par « oui ». Le second membre adopte « m’est agréable », formulation française naturelle qui rend la valeur favorable de שָׁפְרָה עָלָי sans ajouter de nuance interprétative.
