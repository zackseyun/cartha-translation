id: PSA.16.4
reference: Psalms 16:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: fr
  text: Les souffrances se multiplieront pour ceux qui courent après un autre dieu[a]. Je ne verserai pas leurs libations de sang[b] et je ne mettrai pas leurs noms sur mes lèvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs idoles se multiplieront ». Le terme hébreu peut être associé aux idoles dans certains contextes, mais « souffrances » convient mieux ici.
    reason: alternative_reading
  - marker: b
    text: Ou « avec du sang ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: se multiplieront
  rationale: Le qal inaccompli de רבה exprime l’accroissement; le futur convient ici à l’énoncé poétique d’une conséquence.
- source_word: עַצְּבוֹתָם
  choice: Les souffrances … pour ceux
  rationale: Le terme désigne naturellement les douleurs ou les peines. La construction française explicite les personnes auxquelles elles appartiennent sans changer le sens.
- source_word: אַחֵר
  choice: un autre dieu
  rationale: אַחֵר signifie « un autre ». Le contexte cultuel permet d’expliciter le référent sous-entendu, « dieu ».
- source_word: מָהָרוּ
  choice: qui courent après
  rationale: מהר exprime l’empressement. « Courir après » rend en français actuel la poursuite ardente d’un autre dieu.
- source_word: בַּל
  choice: ne … pas
  rationale: La particule négative poétique est rendue par la négation française ordinaire dans les deux propositions.
- source_word: אַסִּיךְ
  choice: Je ne verserai pas
  rationale: Le hiphil de נסך évoque l’action de verser une offrande liquide; « verser » conserve directement cette image cultuelle.
- source_word: נִסְכֵּיהֶם
  choice: leurs libations
  rationale: « Libations » est le terme français précis et encore compréhensible pour des offrandes liquides rituelles.
- source_word: מִדָּם
  choice: de sang
  rationale: La préposition מן peut indiquer la matière ou la provenance; « libations de sang » conserve l’image saisissante du texte.
- source_word: אֶשָּׂא
  choice: je ne mettrai pas
  rationale: נשא, avec « noms » et « sur mes lèvres », signifie les prononcer ou les mentionner. « Mettre sur mes lèvres » conserve l’image hébraïque dans un français naturel.
- source_word: שְׁמוֹתָם
  choice: leurs noms
  rationale: Le pronom peut renvoyer aux autres dieux ou aux personnes qui les poursuivent; le français conserve cette ambiguïté référentielle.
- source_word: עַל שְׂפָתָי
  choice: sur mes lèvres
  rationale: Cette expression garde l’image poétique et désigne naturellement le fait de prononcer ou de mentionner.
theological_decisions:
- issue: Référent sous-entendu après « un autre »
  choice: un autre dieu
  alternative: un autre
  rationale: Les libations et le refus de prononcer les noms situent le verset dans le contexte du culte rendu à d’autres divinités. L’ajout de « dieu » explicite le référent sans introduire une affirmation doctrinale étrangère.
- issue: Sens de עַצְּבוֹתָם
  choice: souffrances
  alternative: idoles
  rationale: 'Dans cette syntaxe, le premier membre exprime le plus naturellement la conséquence subie par ceux qui poursuivent un autre dieu: leurs souffrances augmentent. Le sens possible lié aux idoles est signalé en note.'
- issue: Référent de « leurs noms »
  choice: ambiguïté conservée
  alternative: les noms des autres dieux seulement
  rationale: Le suffixe hébreu ne tranche pas explicitement entre les divinités évoquées et leurs adeptes. La formulation française ne résout donc pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Libations » conserve la précision cultuelle; la structure parallèle et les images des noms placés sur les lèvres sont maintenues.
