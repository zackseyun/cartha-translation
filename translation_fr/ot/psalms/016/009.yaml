  text: Therefore my heart is glad[a], and my glory rejoices[b]; even my flesh will dwell securely.
translation:
  language: fr
  text: C’est pourquoi mon cœur se réjouit, et ma gloire[a] exulte ; même ma chair demeurera en sécurité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon honneur », « tout mon être ». Certains comprennent ici « ma gloire » comme une manière de désigner la personne elle-même, tandis que des interprètes anciens l’ont mise en rapport avec la langue.
    reason: lexical_alternative
  - marker: b
    text: Ou « reposera en sûreté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence logique de la confiance exprimée dans les versets précédents, dans un français naturel et soutenu.
- source_word: שָׂמַח לִבִּי
  choice: mon cœur se réjouit
  rationale: Conserve l’image hébraïque du cœur comme siège de la vie intérieure et rend naturellement l’état de joie exprimé par le verbe.
- source_word: וַיָּגֶל
  choice: exulte
  rationale: Exprime une joie vive et forme une progression poétique par rapport à « se réjouit ».
- source_word: כְּבוֹדִי
  choice: ma gloire
  rationale: Rend littéralement le nom hébreu et préserve son ambiguïté poétique ainsi que son lien intertextuel, sans imposer l’interprétation « langue » ou « être tout entier ».
- source_word: אַף בְּשָׂרִי
  choice: même ma chair
  rationale: « Même » restitue l’extension emphatique à la dimension corporelle, tandis que « chair » conserve l’image concrète de l’hébreu.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: demeurera en sécurité
  rationale: Rend directement l’idée d’habiter ou de rester dans un état de sûreté, tout en gardant la valeur future du verbe.
theological_decisions:
- issue: Sens de כְּבוֹדִי dans un passage repris ultérieurement dans le Nouveau Testament
  choice: ma gloire
  alternative: mon honneur ; tout mon être ; ma langue
  rationale: Le sens littéral reste intelligible en français et maintient la tension de l’expression hébraïque. La note signale les principales lectures idiomatiques sans en privilégier une dans le texte.
- issue: Rendu de בְּשָׂרִי
  choice: ma chair
  alternative: mon corps
  rationale: « Chair » désigne ici la dimension physique de la personne, sans connotation de nature pécheresse. Ce choix préserve l’image hébraïque et la continuité intertextuelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme entre « mon cœur se réjouit » et « ma gloire exulte » est conservé, de même que la progression de la joie intérieure vers la sécurité corporelle.
