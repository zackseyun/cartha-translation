  text: לִ֭/קְדוֹשִׁים אֲשֶׁר בָּ/אָ֣רֶץ הֵ֑מָּה וְ֝/אַדִּירֵ֗י כָּל חֶפְצִ/י בָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: fr
  text: Quant aux saints qui sont dans le pays[a][b], ce sont les nobles[c] en qui je trouve toute ma joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les personnes saintes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sur la terre ».
    reason: lexical_alternative
  - marker: c
    text: Ou « les êtres excellents » ou « les êtres majestueux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: Quant aux êtres saints
  rationale: Le ל préfixé est compris ici comme un marqueur thématique (« quant à »), lecture qui convient au contexte tout en reconnaissant que sa fonction est difficile. « Êtres saints » conserve la valeur substantivée de l’adjectif sans recourir au terme plus chargé de tradition « saints » employé seul.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: qui sont dans le pays
  rationale: אֶרֶץ peut désigner le pays ou la terre. « Dans le pays » rend naturellement la présence de personnes au sein du territoire, tandis qu’une note préserve l’autre possibilité.
- source_word: הֵמָּה
  choice: ce sont
  rationale: Le pronom indépendant est rendu explicitement afin de préserver son effet emphatique et de former une phrase française claire.
- source_word: וְאַדִּירֵי
  choice: les êtres nobles
  rationale: אַדִּיר peut évoquer la noblesse, la majesté, l’excellence ou la puissance. Ici, « nobles » exprime la dignité accordée à ces personnes sans leur attribuer nécessairement une puissance militaire.
- source_word: כָּל חֶפְצִי
  choice: toute ma joie
  rationale: חֵפֶץ désigne le plaisir, le désir ou ce en quoi l’on prend plaisir. La tournure française « trouver toute sa joie en quelqu’un » exprime naturellement cette affection.
- source_word: בָם
  choice: en qui
  rationale: La préposition ב est conservée, et le pronom relatif personnel « qui » convient à des êtres personnels sans trancher davantage leur identité.
theological_decisions:
- issue: Identité des « êtres saints »
  choice: La formulation évoque principalement des personnes consacrées à Dieu présentes dans le pays.
  alternative: Des êtres saints célestes, ou des personnes consacrées au sens général.
  rationale: La précision « qui sont dans le pays » favorise une référence terrestre, mais la traduction ne remplace pas l’expression hébraïque par une désignation ecclésiale technique et conserve ainsi une part de son ouverture.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme et l’emphase du pronom hébreu sont maintenus par « Quant à… ce sont… ». L’expression « êtres saints » évite que « saints » soit automatiquement compris dans un sens ecclésial ultérieur.
