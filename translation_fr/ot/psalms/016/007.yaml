source:
  edition: WLC
  text: אֲבָרֵ֗ךְ אֶת יְ֭הוָה אֲשֶׁ֣ר יְעָצָ֑/נִי אַף לֵ֝יל֗וֹת יִסְּר֥וּ/נִי כִלְיוֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/007.yaml
  text: I will bless Yahweh[a], who counsels me; even at night my inner being instructs me.
translation:
  language: fr
  text: Je bénirai Yahweh, qui me conseille ; même la nuit, mon être intérieur m’instruit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mes reins m’instruisent ». En hébreu, les reins peuvent représenter le tréfonds de la personne, notamment la conscience et les émotions profondes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Je bénirai
  rationale: Le piel de ברך signifie ici « bénir », au sens de dire du bien de Dieu et de le louer. Le futur français exprime naturellement la résolution portée par l’inaccompli hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel du texte hébreu au lieu de lui substituer un titre.
- source_word: אֲשֶׁר יְעָצָנִי
  choice: qui me conseille
  rationale: Le relatif אֲשֶׁר introduit une proposition décrivant Yahweh, et יעץ désigne le fait de conseiller. Le présent convient à une action caractéristique.
- source_word: אַף לֵילוֹת
  choice: même la nuit
  rationale: אַף a ici une valeur additive et intensive. Le pluriel hébreu « nuits » évoque le temps nocturne de manière répétée ou générale ; le singulier français est plus idiomatique.
- source_word: יִסְּרוּנִי
  choice: m’instruit
  rationale: יסר peut signifier instruire, reprendre ou corriger. « Instruire » conserve ici la nuance de formation intérieure sans imposer l’idée plus forte d’un châtiment.
- source_word: כִלְיוֹתָי
  choice: mon être intérieur
  rationale: Littéralement « mes reins », expression hébraïque désignant le tréfonds de la personne, notamment la conscience et les émotions profondes. « Mon être intérieur » en communique le sens sans introduire une autre métaphore corporelle.
theological_decisions:
- issue: Métaphore anthropologique de כִלְיוֹתָי
  choice: mon être intérieur
  alternative: mes reins ; mon cœur ; mon esprit
  rationale: « Mes reins » serait aujourd’hui compris surtout au sens anatomique, tandis que « mon cœur » et « mon esprit » remplaceraient l’image hébraïque par des catégories plus étroites. La formulation retenue exprime le siège intérieur de la réflexion et de la conscience sans trancher davantage.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et proche du parallélisme hébreu. Le point-virgule distingue les deux membres sans rompre leur lien.
