id: PSA.16.8
reference: Psalms 16:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁוִּ֬יתִי יְהוָ֣ה לְ/נֶגְדִּ֣/י תָמִ֑יד כִּ֥י מִֽ֝/ימִינִ֗/י בַּל אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: fr
  text: Je garde sans cesse Yahvé[a] devant moi ; puisqu’il est à ma droite, je ne chancellerai pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hébreu YHWH, le nom divin, ici transcrit « Yahvé ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « je ne serai pas ébranlé ». Le verbe hébreu peut évoquer le fait de vaciller ou d’être déplacé d’une position stable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: Je garde
  rationale: Le piel de שׁוה signifie ici placer ou tenir devant soi. « Je garde » rend en français naturel la décision établie exprimée par l’accompli ainsi que sa portée continue, précisée par תָמִיד.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du tétragramme, qui conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: לְנֶגְדִּי
  choice: devant moi
  rationale: נגד avec le suffixe de première personne désigne ce qui demeure en présence ou sous le regard du locuteur ; « devant moi » conserve l’image spatiale et relationnelle.
- source_word: תָמִיד
  choice: sans cesse
  rationale: Exprime une continuité durable. « Sans cesse » est actuel, naturel et adapté au registre poétique.
- source_word: כִּי
  choice: puisque
  rationale: Introduit ici le motif de l’assurance du psalmiste. « Puisque » conserve clairement cette valeur causale.
- source_word: מִימִינִי
  choice: à ma droite
  rationale: Rend directement l’image hébraïque de la présence protectrice et du soutien à la droite du psalmiste.
- source_word: בַּל אֶמּוֹט
  choice: je ne chancellerai pas
  rationale: Le verbe מוט évoque le fait de vaciller, chanceler ou perdre une position stable. Cette formulation conserve l’image tout en restant naturelle en français moderne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie le nom propre divin. « Yahvé » le représente directement en français, sans le remplacer silencieusement par un titre.
- issue: Nature de la stabilité promise dans בַּל אֶמּוֹט
  choice: je ne chancellerai pas
  alternative: je ne serai pas ébranlé
  rationale: Le choix retenu maintient l’image de la perte d’équilibre sans décider si elle est physique, émotionnelle ou circonstancielle ; l’autre rendu exprime plus nettement l’effet subi.
translation_notes:
  register: Français international moderne, sobre et poétique. « Je garde sans cesse » exprime une orientation délibérée et durable sans alourdir la phrase ; le parallélisme causal et l’image de la droite sont conservés.
