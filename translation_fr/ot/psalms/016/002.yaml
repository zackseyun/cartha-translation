  yaml_path: translation/ot/psalms/016/002.yaml
  text: I said to Yahweh[a], “You are my Lord; I have no good apart from you.”
translation:
  language: fr
  text: 'J’ai dit à Yahweh : « Tu es mon Seigneur ; je n’ai aucun bien en dehors de toi. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus proche de l’hébreu : « Mon bien n’est pas au-delà de toi. » La construction est elliptique ; elle peut exprimer que le bien du psalmiste ne se trouve pas hors de Yahweh.'
    reason: alternative lexicale et conservation de l’ambiguïté de l’expression hébraïque
lexical_decisions:
- source_word: אָמַרְתְּ
  choice: J’ai dit
  rationale: Bien que la forme massorétique soit formellement une 2e personne du féminin singulier, le contexte présente le psalmiste parlant à la première personne ; les versions anciennes soutiennent cette compréhension.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire de la parole, et le tétragramme est translittéré « Yahweh ».
- source_word: אֲדֹנָי אָתָּה
  choice: Tu es mon Seigneur
  rationale: Le suffixe de première personne donne « mon Seigneur » ; le pronom indépendant explicite אָתָּה est rendu naturellement par « tu es ».
- source_word: טוֹבָתִי
  choice: aucun bien
  rationale: Le nom désigne ce qui est bon, le bien ou le bonheur du locuteur ; « bien » conserve cette ampleur sans suggérer sa vertu morale.
- source_word: בַּל עָלֶיךָ
  choice: en dehors de toi
  rationale: Dans cette construction poétique compacte, l’expression indique que le bien du psalmiste ne se trouve pas hors de Dieu ; la note conserve la formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le SEIGNEUR
  rationale: La translittération préserve le nom divin personnel présent dans le texte hébreu sans le remplacer par un titre.
- issue: Sens de טוֹבָתִי בַּל עָלֶיךָ
  choice: je n’ai aucun bien en dehors de toi
  alternative: mon bien ne va pas au-delà de toi
  rationale: Le texte hébreu est elliptique et permet plusieurs nuances. Le texte principal exprime naturellement en français la dépendance du psalmiste envers Dieu, tandis que la note garde la tournure formelle sans prétendre lever entièrement l’ambiguïté.
translation_notes:
  register: Français international moderne, simple et digne. Le passé composé convient à une confession directe actuelle ; « Seigneur » reste un titre respectueux, distinct du nom propre « Yahweh ».
