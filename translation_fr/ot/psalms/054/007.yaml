source:
  edition: WLC
  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: fr
  text: Je t’offrirai un sacrifice volontaire[a] ; je rendrai grâce à ton nom, Yahvé[b], car il est bon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu peut aussi se comprendre de manière plus adverbiale : « je t’offrirai volontairement un sacrifice » ou « je t’offrirai de bon cœur un sacrifice ».'
    reason: lexical_alternative
  - marker: b
    text: Hébreu YHWH, nom divin traditionnellement rendu par « le Seigneur » ; également transcrit « Yahweh ».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit simplement « car [il est] bon ». Cela peut se rapporter au nom de Yahvé ou directement à Yahvé ; טוֹב peut aussi avoir ici le sens de « agréable ».
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: un sacrifice volontaire
  rationale: Le nom נְדָבָה désigne ici une offrande faite volontairement. Avec le verbe זבח, « sacrifice volontaire » conserve le cadre cultuel tout en restant naturel en français.
- source_word: אֶזְבְּחָה
  choice: je t’offrirai un sacrifice
  rationale: Le verbe זבח signifie sacrifier ou offrir un sacrifice. La tournure française explicite naturellement l’acte sacrificiel et son destinataire.
- source_word: לָּךְ
  choice: t’
  rationale: 'La préposition ל marque ici le destinataire du sacrifice : « à toi », rendu naturellement par « je t’offrirai ».'
- source_word: אוֹדֶה
  choice: je rendrai grâce
  rationale: À la forme hiphil, ידה exprime l’action de remercier ou de louer. « Rendre grâce » maintient la dimension de reconnaissance et convient à l’objet « ton nom ».
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: L’hébreu mentionne explicitement le nom de Dieu, expression qui évoque sa personne révélée, son caractère et sa renommée.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française usuelle « Yahvé » translittère le tétragramme divin au lieu de le remplacer par le titre traditionnel « le Seigneur ».
- source_word: כִּי טוֹב
  choice: car il est bon
  rationale: L’hébreu ne donne pas de sujet explicite à l’adjectif טוֹב. En français, « il » peut grammaticalement renvoyer au « nom » ou être compris comme renvoyant à Yahvé, ce qui préserve utilement l’ambiguïté du texte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin. Sa translittération préserve cette donnée, tandis que « le Seigneur » lui substituerait un titre.
- issue: Référent implicite de טוֹב
  choice: car il est bon, formulation laissant le référent ouvert
  alternative: car ton nom est bon / car Yahvé est bon
  rationale: L’hébreu signifie littéralement « car [il est] bon » sans sujet exprimé. Le contexte permet de comprendre soit que le nom est bon, soit que Yahvé est bon ; la formulation française conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Sacrifice volontaire » garde le sens cultuel sans lourdeur ; « rendre grâce » conserve la tonalité de prière. La formulation finale maintient l’absence de sujet explicite et l’ambiguïté théologique de l’hébreu.
