source:
  edition: WLC
  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: fr
  text: Car il m’a délivré de toute détresse, et mon œil a vu mes ennemis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon œil a regardé mes ennemis ». Le contexte peut laisser entendre que le psalmiste a été justifié face à eux ou qu’il a vu leur défaite, sans toutefois l’affirmer explicitement.
    reason: Alternative lexicale et implication contextuelle laissée ouverte par l’hébreu.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de la louange et de l’offrande évoquées auparavant. « Car » conserve clairement cette valeur explicative.
- source_word: מִכָּל צָרָה
  choice: de toute détresse
  rationale: La préposition מִן avec כָּל exprime une délivrance hors de la totalité des situations pénibles. « Toute détresse » est naturel en français et rend bien la portée générale de צָרָה.
- source_word: הִצִּילָנִי
  choice: il m’a délivré
  rationale: Le hiphil de נצל signifie couramment délivrer ou arracher au danger. Le passé composé exprime un acte accompli dont le psalmiste témoigne dans le présent.
- source_word: וּבְאֹיְבַי
  choice: et … mes ennemis
  rationale: Avec ראה, la préposition ב introduit ce sur quoi se porte le regard. Le français n’exige pas ici de préposition devant le complément de « voir ».
- source_word: רָאֲתָה עֵינִי
  choice: mon œil a vu
  rationale: Cette formulation conserve l’image hébraïque dans laquelle « mon œil » est le sujet. Elle reste compréhensible en français tout en évitant d’ajouter explicitement l’idée de défaite ou de triomphe.
theological_decisions:
- issue: Ce que signifie le regard du psalmiste sur ses ennemis
  choice: Dire simplement que son œil a vu ses ennemis, sans préciser leur sort.
  alternative: « mon œil a vu la chute de mes ennemis » ou « j’ai contemplé avec triomphe mes ennemis »
  rationale: Le contexte peut suggérer la justification du psalmiste ou la défaite de ses adversaires, mais le texte hébreu ne mentionne explicitement ni chute, ni vengeance, ni triomphe. La traduction préserve donc cette tension.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe explicative avec « Car » suit le mouvement du psaume. L’expression imagée « mon œil a vu » est volontairement conservée malgré son caractère légèrement marqué en français.
