  naturalness: Le français est sobre, intelligible et d’un registre approprié à un psaume. « Mon œil a vu mes ennemis » est une tournure poétique légèrement marquée, mais elle est recevable et sert l’équivalence optimale en préservant l’image du texte source.
  terminology: « Délivré », « détresse » et « ennemis » sont exacts, naturels et cohérents avec le registre biblique moderne. Aucun terme théologique ne force une interprétation confessionnelle.
