  text: בְּ/ב֣וֹא הַ֭/זִּיפִים וַ/יֹּאמְר֣וּ לְ/שָׁא֑וּל הֲ/לֹ֥א דָ֝וִ֗ד מִסְתַּתֵּ֥ר עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/001.yaml
  text: when the Ziphites came and said to Saul[a], “Is not David hiding among us?”
translation:
  language: fr
  text: 'quand les Ziphites vinrent dire à Saül : « David ne se cache-t-il pas parmi nous[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec nous ». L’hébreu dit littéralement « avec nous », mais « parmi nous » exprime ici que David se cache sur le territoire ou au sein de la population des Ziphites.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: quand … vinrent
  rationale: La préposition בְּ suivie de l’infinitif construit de בוא introduit ici une proposition temporelle ; cette tournure est naturelle en français.
- source_word: הַזִּיפִים
  choice: les Ziphites
  rationale: Ce pluriel gentilé désigne les habitants de Ziph ; « Ziphites » est la désignation française usuelle et concise.
- source_word: וַיֹּאמְרוּ
  choice: dire
  rationale: Dans la construction « vinrent dire », l’infinitif français exprime naturellement la succession narrative portée par le wayyiqtol, sans alourdir la phrase.
- source_word: לְשָׁאוּל
  choice: à Saül
  rationale: La préposition לְ marque ici le destinataire ; « Saül » est la forme française traditionnelle du nom.
- source_word: הֲלֹא
  choice: ne … pas ?
  rationale: La particule introduit une question rhétorique qui attend une réponse affirmative ; la forme interrogative négative en préserve la force.
- source_word: דָוִד
  choice: David
  rationale: Forme française usuelle du nom propre.
- source_word: מִסְתַּתֵּר
  choice: se cache
  rationale: Le participe hitpael de סתר décrit une action réflexive en cours ; le présent français convient à la parole directe et reste naturel.
- source_word: עִמָּנוּ
  choice: parmi nous
  rationale: Le sens littéral est « avec nous », mais, dans le contexte d’une personne cachée dans le territoire ou au sein du groupe des locuteurs, « parmi nous » exprime plus naturellement l’idée.
