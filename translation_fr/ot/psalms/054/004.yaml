  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: fr
  text: 'Car des étrangers se sont dressés contre moi[a],

    et des hommes violents[b] ont cherché à prendre ma vie[c] ;

    ils ne placent pas Dieu devant eux.

    Sélah[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des gens qui me sont étrangers ». Le mot hébreu peut désigner des personnes étrangères, extérieures ou devenues étrangères au psalmiste.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des hommes impitoyables » ou « des tyrans ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « ont cherché mon âme ». Ici, « âme » désigne la vie du psalmiste.'
    reason: lexical_alternative
  - marker: d
    text: Terme probablement liturgique ou musical, dont le sens précis est incertain.
    reason: textual_or_liturgical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel lancé dans le contexte immédiat et conserve la valeur causale de la conjonction.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne des personnes étrangères, extérieures ou devenues étrangères au locuteur. « Des étrangers » préserve cette latitude sans imposer une origine ethnique étrangère.
- source_word: קָמוּ עָלַי
  choice: se sont dressés contre moi
  rationale: Cette tournure française restitue naturellement l’image du relèvement ainsi que le sens d’hostilité porté par l’expression hébraïque.
- source_word: עָרִיצִים
  choice: des hommes violents
  rationale: Le mot qualifie des personnes brutales, impitoyables et oppressives. « Hommes violents » exprime clairement la menace et correspond au pluriel masculin du texte.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: cherchent à prendre ma vie
  rationale: Dans ce contexte de menace, נֶפֶשׁ désigne la vie du psalmiste. La formulation rend l’intention meurtrière sans introduire une opposition entre corps et âme.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: ils ne placent pas Dieu devant eux
  rationale: Conserve la métaphore hébraïque de Dieu placé devant le regard ou dans l’horizon moral, sans la réduire à une simple affirmation d’incroyance.
- source_word: סֶלָה
  choice: Sèla
  rationale: Translittération française traditionnelle d’un terme liturgique ou musical dont la fonction précise demeure incertaine.
theological_decisions:
- issue: Sens anthropologique de נֶפֶשׁ dans un contexte de menace
  choice: vie
  alternative: âme
  rationale: Les adversaires cherchent à tuer le psalmiste ; « vie » rend donc ici le sens concret du mot sans importer une conception particulière de la distinction entre corps et âme.
- issue: Portée de l’absence de Dieu « devant eux »
  choice: 'Conserver la métaphore : « ils ne placent pas Dieu devant eux »'
  alternative: « Ils ne tiennent aucun compte de Dieu »
  rationale: 'La traduction littéraire préserve l’image et son ampleur théologique : ces adversaires agissent sans garder Dieu dans leur champ de considération, sans que le texte précise davantage leur croyance ou leur motivation.'
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le rythme en quatre lignes convient à la poésie du psaume. « Se sont dressés contre moi » et « placer Dieu devant eux » maintiennent les images hébraïques, tandis que « prendre ma vie » rend idiomatiquement le sens contextuel de נֶפֶשׁ.
