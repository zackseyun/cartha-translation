id: PSA.54.6
reference: Psalms 54:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ישוב הָ֭/רַע לְ/שֹׁרְרָ֑/י בַּ֝/אֲמִתְּ/ךָ֗ הַצְמִיתֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/006.yaml
  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: fr
  text: Que le mal retombe sur mes adversaires[a] ! Dans ta fidélité[b], anéantis-les !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le mal retombera sur mes adversaires; dans ta fidélité, anéantis-les. » Le premier verbe peut être compris comme une affirmation plutôt que comme un souhait.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « dans ta vérité ». Le mot hébreu peut exprimer la vérité, la fiabilité ou la fidélité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: Que ... retombe
  rationale: L’imparfait qal peut être indicatif (« retombera ») ou volitif. Dans cette prière, l’impératif qui suit favorise la valeur de souhait; « retombe » exprime naturellement l’idée d’un mal qui revient sur ses auteurs.
- source_word: הָרַע
  choice: le mal
  rationale: רַע peut désigner le mal moral, le malheur ou le tort. « Le mal » conserve la brièveté et l’amplitude du terme hébreu.
- source_word: לְשֹׁרְרָי
  choice: sur mes adversaires
  rationale: Le terme désigne ceux qui s’opposent avec hostilité au psalmiste. « Adversaires » reste précis sans imposer un cadre exclusivement militaire.
- source_word: בַּאֲמִתְּךָ
  choice: Dans ta fidélité
  rationale: אֱמֶת recouvre la vérité, la fiabilité et la fidélité. Ici, « fidélité » exprime la constance fiable de Dieu, tandis que « dans » garde au plus près la préposition hébraïque.
- source_word: הַצְמִיתֵם
  choice: anéantis-les
  rationale: Impératif hiphil de צמת avec suffixe pluriel, exprimant l’action de détruire ou de faire disparaître. « Anéantis-les » restitue directement la force implacable de la demande.
theological_decisions:
- issue: Force imprécatoire du verset
  choice: Présenter la première proposition comme un souhait adressé à Dieu, puis conserver l’impératif explicite.
  alternative: « Le mal retombera sur mes adversaires; dans ta fidélité, tu les anéantiras. »
  rationale: Le contexte de prière et l’impératif final soutiennent une lecture volitive, sans effacer la possibilité grammaticale d’une déclaration; celle-ci est signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. La tournure « Que ... retombe » conserve la prière imprécatoire; « anéantis-les » assume sans l’atténuer la violence du verbe hébreu. Les deux marqueurs de note figurent dans le texte.
