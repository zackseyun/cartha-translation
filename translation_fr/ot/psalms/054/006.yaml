  source_fidelity: « Que le mal retombe » rend de façon fidèle la lecture volitive possible de יָשׁוּב, tout en laissant l’indicatif possible signalé en note. « Le mal », « mes adversaires », « dans ta fidélité » et « anéantis-les » correspondent respectivement à הָרַע, לְשֹׁרְרָי, בַּאֲמִתְּךָ et à l’impératif hiphil הַצְמִיתֵם. La force imprécatoire et l’adresse directe à Dieu sont conservées.
  naturalness: Le français est moderne, clair et soutenu sans archaïsme. La construction « Que le mal retombe sur… ! » convient à une prière solennelle, et « Dans ta fidélité » reste naturel dans ce registre.
  terminology: « Fidélité » est un bon choix contextuel pour אֱמֶת, sans exclure son sens de « vérité », correctement conservé en note. « Anéantis-les » transmet la force de destruction du verbe צמת sans atténuation doctrinale ou euphémisante.
