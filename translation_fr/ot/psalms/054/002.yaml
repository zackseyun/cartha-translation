source:
  edition: WLC
  text: אֱ֭לֹהִים בְּ/שִׁמְ/ךָ֣ הוֹשִׁיעֵ֑/נִי וּ/בִ/גְבוּרָתְ/ךָ֥ תְדִינֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/002.yaml
  text: God[a], save me by your name, and vindicate me by your might.
translation:
  language: fr
  text: 'Dieu, sauve-moi par ton nom,

    et rends-moi justice par ta puissance.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « juge-moi » ou « défends ma cause ». Le verbe hébreu peut désigner l’acte de juger, mais il semble ici exprimer une demande de justice ou de réhabilitation.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le contexte de prière indique une adresse directe. « Ô Dieu » serait possible en français, mais ajouterait une interjection absente de l’hébreu.
- source_word: בְּשִׁמְךָ
  choice: par ton nom
  rationale: La préposition ב est comprise dans un sens instrumental. Le « nom » représente le caractère révélé, la réputation et l’identité de Dieu; la formulation compacte de l’hébreu est ainsi conservée.
- source_word: הוֹשִׁיעֵנִי
  choice: sauve-moi
  rationale: Le hiphil de ישׁע exprime ici une demande de secours ou de salut. « Sauve-moi » est direct, naturel et conserve l’étendue du sens.
- source_word: וּבִגְבוּרָתְךָ
  choice: par ta puissance
  rationale: גְּבוּרָה désigne la force ou la puissance efficace. « Puissance » convient au registre poétique et maintient le parallélisme instrumental avec « par ton nom ».
- source_word: תְדִינֵנִי
  choice: rends-moi justice
  rationale: Le verbe דִּין appartient au domaine judiciaire. Dans cette supplication, il demande vraisemblablement une intervention favorable de Dieu qui fasse droit au psalmiste, tout en laissant la note signaler les autres nuances possibles.
theological_decisions:
- issue: Sens de la demande judiciaire adressée à Dieu
  choice: rends-moi justice
  alternative: juge-moi; défends ma cause
  rationale: Le contexte appelle non une simple évaluation neutre, mais l’exercice favorable de la justice divine contre des adversaires. « Rends-moi justice » exprime ce sens sans introduire de catégorie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Le vers est présenté en deux lignes pour faire ressortir le parallélisme hébreu. « Par ton nom » et « par ta puissance » conservent la symétrie et la valeur instrumentale des deux prépositions.
