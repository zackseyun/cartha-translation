id: PSA.54.5
reference: Psalms 54:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֣ה אֱ֭לֹהִים עֹזֵ֣ר לִ֑/י אֲ֝דֹנָ֗/י בְּֽ/סֹמְכֵ֥י נַפְשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/005.yaml
  text: Behold[a], God is my helper[b]; the Lord is among those who sustain my life.
translation:
  language: fr
  text: Voici, Dieu est celui qui m’aide ; le Seigneur est parmi ceux qui soutiennent ma vie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Seigneur soutient ma vie » ou « le Seigneur est celui qui soutient ma vie ». L’expression hébraïque rendue par « parmi ceux qui soutiennent ma vie » est syntaxiquement difficile ; certaines traductions comprennent que le Seigneur lui-même est directement celui qui soutient.'
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu נֶפֶשׁ (néfesh) peut désigner, selon le contexte, la vie, la personne ou l’âme.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Particule qui attire l’attention et introduit une affirmation emphatique ; « Voici » conserve la force poétique et le registre élevé.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Désignation courante de Dieu, employée ici au singulier comme sujet.
- source_word: עֹזֵר לִי
  choice: est celui qui m’aide
  rationale: Le participe qal de עזר avec לִי présente Dieu comme l’agent personnel qui vient en aide au psalmiste. Cette formulation est plus naturelle en français moderne que « est mon aide ».
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Titre divin, rendu selon son sens de souveraineté sans le confondre avec le nom divin YHWH.
- source_word: בְּסֹמְכֵי
  choice: est parmi ceux qui soutiennent
  rationale: La construction avec בְּ et le participe pluriel construit est difficile. La traduction retient le sens associatif possible de בְּ et préserve explicitement le pluriel du texte hébreu.
- source_word: נַפְשִׁי
  choice: ma vie
  rationale: Dans ce contexte de secours et de préservation face au danger, נֶפֶשׁ désigne vraisemblablement la vie ou la personne du psalmiste plutôt qu’une âme immatérielle au sens étroit.
theological_decisions:
- issue: Rapport entre le Seigneur et « ceux qui soutiennent »
  choice: le Seigneur est parmi ceux qui soutiennent ma vie
  alternative: le Seigneur soutient ma vie / le Seigneur est celui qui soutient ma vie
  rationale: La syntaxe hébraïque est difficile. Le texte principal conserve la lecture associative et le pluriel, sans résoudre silencieusement la tension en faisant du Seigneur l’unique sujet direct de « soutenir ».
- issue: Sens de נַפְשִׁי
  choice: ma vie
  alternative: mon âme / ma personne
  rationale: « Ma vie » convient au contexte de préservation et évite d’imposer au terme hébreu une dichotomie anthropologique plus étroite.
- issue: Traduction du titre אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: Il s’agit ici d’un titre divin. L’article donne une formulation française naturelle tout en maintenant sa portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient l’élan poétique ; « est celui qui m’aide » évite le tour peu idiomatique « est mon aide ». La seconde proposition demeure volontairement proche de la construction difficile de l’hébreu.
