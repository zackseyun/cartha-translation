  text: God[a], hear my prayer; give ear to the words of my mouth.
translation:
  language: fr
  text: Dieu, entends ma prière ; prête l’oreille aux paroles de ma bouche.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est employé comme vocatif dans une adresse directe. En français moderne, « Dieu » suffit sans ajouter « ô », qui donnerait un ton plus archaïque.
- source_word: שְׁמַע
  choice: entends
  rationale: L’impératif demande une écoute attentive et favorable. « Entends » conserve l’idiome traditionnel de la prière et le parallélisme auditif du verset.
- source_word: תְּפִלָּתִי
  choice: ma prière
  rationale: Le nom désigne normalement une prière ; ce choix est direct, naturel et adapté au contexte psalmique.
- source_word: הַאֲזִינָה
  choice: prête l’oreille
  rationale: L’impératif exprime l’action d’écouter attentivement. « Prête l’oreille » conserve l’image concrète de l’hébreu tout en restant idiomatique en français.
- source_word: לְאִמְרֵי
  choice: aux paroles
  rationale: Le pluriel construit désigne ici les paroles prononcées. La préposition est naturellement rendue par « à » après « prêter l’oreille ».
- source_word: פִי
  choice: de ma bouche
  rationale: La traduction littérale préserve l’expression poétique concrète de l’hébreu plutôt que de la paraphraser par « que je prononce ».
