  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: fr
  text: Au chef de chœur, avec instruments à cordes. Maskil[b] de David[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; dans ce titre, la construction hébraïque peut indiquer l’auteur, la dédicace, l’appartenance ou une association.
    reason: alternative_reading
  - marker: b
    text: « Maskil » est un terme technique hébreu employé dans les titres de certains psaumes. Il désigne probablement un type de composition ou d’exécution, mais son sens précis reste incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne vraisemblablement le responsable de l’exécution musicale. « Chef de chœur » est une formulation française courante qui conserve cette fonction liturgique et musicale.
- source_word: בִּנְגִינֹת
  choice: avec instruments à cordes
  rationale: Le terme renvoie ici à un accompagnement par des instruments à cordes. « Avec » rend naturellement la notation d’exécution sans préciser indûment la manière de jouer.
- source_word: מַשְׂכִּיל
  choice: Maskil
  rationale: Le sens exact de ce terme technique employé dans les titres de psaumes demeure incertain. Sa translittération évite de choisir arbitrairement entre les idées d’instruction, de méditation, d’habileté ou de genre musical.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut signaler l’auteur, le destinataire, l’appartenance ou une association. La formule française « de David » préserve mieux cette ouverture que « par David » ou « pour David ».
theological_decisions:
- issue: Interprétation de la mention davidique
  choice: de David
  alternative: par David ; pour David
  rationale: Les titres des psaumes peuvent indiquer l’auteur, une dédicace, l’appartenance à une collection ou une autre forme d’association. Le texte ne tranche donc pas plus précisément.
translation_notes:
  register: Français international moderne, sobre et digne. Le titre conserve la concision du texte hébreu. Les marqueurs [b] et [a] sont placés immédiatement après les expressions qu’ils expliquent.
