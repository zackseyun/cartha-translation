source:
  edition: WLC
  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: fr
  text: Chantez les louanges de Yahweh, qui demeure à Sion[a] ; proclamez ses hauts faits parmi les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui siège à Sion » ; l’expression peut évoquer sa royauté.'
    reason: alternative_reading
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Chantez les louanges
  rationale: L’impératif pluriel de זמר appelle à célébrer Dieu par le chant ; cette formulation exprime naturellement en français la dimension musicale et laudative.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: Le tétragramme est rendu par « Yahweh », afin de conserver le nom divin présent dans le texte hébreu. Avec « chanter les louanges », le complément introduit par « de » est idiomatique en français.
- source_word: יֹשֵׁב צִיּוֹן
  choice: qui demeure à Sion
  rationale: Le participe יֹשֵׁב peut évoquer le fait d’habiter ou d’être assis sur un trône. « demeure » exprime clairement la présence divine sans imposer le sens royal possible, signalé en note.
- source_word: הַגִּידוּ
  choice: proclamez
  rationale: Le hiphil impératif de נגד désigne ici l’annonce publique ; « proclamez » convient au registre poétique et à l’appel adressé à la communauté.
- source_word: בָעַמִּים
  choice: parmi les peuples
  rationale: La préposition ב est naturellement rendue par « parmi », et le pluriel « peuples » conserve la portée collective de עַמִּים sans la réduire à des États politiques.
- source_word: עֲלִילוֹתָיו
  choice: ses hauts faits
  rationale: עֲלִילוֹת désigne des actions marquantes. « hauts faits » restitue cette valeur dans un français biblique actuel et digne, sans préciser indûment leur nature.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. La translittération « Yahweh » préserve le caractère propre du nom d’alliance sans lui substituer un titre.
- issue: Nuance de יֹשֵׁב צִיּוֹן
  choice: qui demeure à Sion
  alternative: qui siège à Sion
  rationale: Le participe permet à la fois une lecture résidentielle, exprimant la présence de Dieu, et une lecture royale. Le texte principal retient le sens non surdéterminé, tandis que la note conserve la nuance d’intronisation.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux impératifs pluriels est conservé. « Sion » garde la forme traditionnelle française, et le point-virgule marque les deux membres de l’appel.
