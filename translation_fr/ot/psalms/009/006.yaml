source:
  edition: WLC
  text: הָֽ/אוֹיֵ֨ב תַּ֥מּוּ חֳרָב֗וֹת לָ֫/נֶ֥צַח וְ/עָרִ֥ים נָתַ֑שְׁתָּ אָבַ֖ד זִכְרָ֣/ם הֵֽמָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: fr
  text: L’ennemi a pris fin ; ses ruines sont à jamais achevées[a]. Tu as déraciné des villes ; leur souvenir même a péri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ô ennemi, les destructions ont pris fin pour toujours. » Le début du texte hébreu peut être compris comme une apostrophe plutôt que comme une phrase dont « l’ennemi » est le sujet.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָאוֹיֵב
  choice: L’ennemi
  rationale: L’article défini favorise une lecture où « l’ennemi » est le sujet. La lecture comme apostrophe reste toutefois possible et est signalée en note.
- source_word: תַּמּוּ חֳרָבוֹת לָנֶצַח
  choice: a disparu, laissant des ruines pour toujours
  rationale: Cette formulation française naturelle rend l’achèvement exprimé par תמם et rattache les ruines durables à la disparition de l’ennemi, tout en évitant l’expression peu idiomatique « a pris fin en ruines ».
- source_word: נָתַשְׁתָּ
  choice: tu as déraciné
  rationale: Le verbe נתשׁ évoque un arrachement complet ; « déraciné » conserve cette métaphore vigoureuse appliquée aux villes.
- source_word: אָבַד זִכְרָם הֵמָּה
  choice: jusqu’à leur souvenir s’est effacé
  rationale: '« S’est effacé » exprime naturellement la disparition du souvenir. « Jusqu’à » restitue idiomatiquement l’emphase du pronom final הֵמָּה : même leur souvenir a disparu.'
theological_decisions:
- issue: Analyse syntaxique de la proposition initiale
  choice: 'Déclaration au sujet de l’ennemi : « L’ennemi a disparu… »'
  alternative: 'Apostrophe : « Ô ennemi, les destructions ont pris fin pour toujours. »'
  rationale: Le texte hébreu permet les deux analyses. La lecture avec « l’ennemi » comme sujet s’intègre bien à l’annonce du jugement, mais l’ambiguïté réelle est conservée dans une note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme et la force imagée de « déraciné » sont préservés sans calque syntaxique de l’hébreu.
