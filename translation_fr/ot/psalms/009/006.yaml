revisions:
- from: L’ennemi a disparu, laissant des ruines pour toujours[a] ; tu as déraciné des villes ; jusqu’à leur souvenir s’est effacé.
  to: L’ennemi a pris fin ; ses ruines sont à jamais achevées[a]. Tu as déraciné des villes ; leur souvenir même a péri.
  rationale: La révision restitue plus nettement, dans la lecture principale, l’achèvement définitif des ruines plutôt que de présenter celles-ci comme ce que l’ennemi laisse derrière lui. Elle corrige aussi la dernière proposition et rend l’emphase du pronom final par « leur souvenir même ». La ponctuation en deux propositions reflète l’ellipse et la densité poétique sans prétendre résoudre davantage la syntaxe disputée, qui demeure signalée en note.
