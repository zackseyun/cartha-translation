source:
  edition: WLC
  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: fr
  text: Lève-toi, Yahweh ! Que l’être humain[a] ne triomphe pas ! Que les nations soient jugées devant toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mortel » ; l’hébreu enosh peut souligner la fragilité ou la mortalité humaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: Impératif de קום adressé à Dieu. « Lève-toi » est naturel en français moderne et exprime l’appel pressant à l’intervention divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que substitution par un titre.
- source_word: אַל יָעֹז
  choice: Que … ne triomphe pas
  rationale: La négation אַל avec la forme verbale exprime ici une prière pressante. Dans ce contexte, « triompher » rend idiomatiquement l’idée de se montrer fort ou de l’emporter.
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: Le nom singulier peut désigner l’humain de manière représentative tout en évoquant sa faiblesse et sa mortalité. « L’être humain » conserve le singulier sans employer « homme » dans un sens potentiellement ambigu en français moderne.
- source_word: יִשָּׁפְטוּ
  choice: soient jugées
  rationale: 'La forme nifal à valeur jussive est comprise au passif : les nations doivent comparaître sous le jugement divin.'
- source_word: גּוֹיִם
  choice: les nations
  rationale: Équivalent français courant de גּוֹיִם dans les Psaumes, désignant collectivement les peuples.
- source_word: עַל־פָּנֶיךָ
  choice: devant toi
  rationale: Expression française idiomatique qui garde l’idée d’être dans la présence de Dieu, ici en vue du jugement.
theological_decisions:
- issue: Nuance anthropologique de אֱנוֹשׁ
  choice: l’être humain
  alternative: le mortel
  rationale: Le terme désigne l’humain et peut souligner sa fragilité ou sa mortalité. Le texte principal reste naturel et représentatif, sans supprimer cette nuance lexicale.
- issue: Sens judiciaire de יִשָּׁפְטוּ
  choice: soient jugées
  alternative: comparaissent en jugement
  rationale: Le passif concis préserve l’idée que les nations sont soumises au jugement de Dieu, sans préciser davantage le déroulement judiciaire.
translation_notes:
  register: Français international moderne, digne et direct. Les trois propositions exclamatives rendent l’intensité de la supplication poétique. Aucun archaïsme ni marque confessionnelle ajoutée.
