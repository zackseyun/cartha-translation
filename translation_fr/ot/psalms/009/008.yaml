  text: וְ/ה֗וּא יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק יָדִ֥ין לְ֝אֻמִּ֗ים בְּ/מֵישָׁרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/008.yaml
  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: fr
  text: Et lui jugera le monde[a] avec justice ; il jugera les peuples avec équité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde habité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec droiture » ou « avec impartialité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Et lui, il
  rationale: Le waw poursuit le discours, tandis que le pronom exprimé met légèrement le sujet en relief. Cette tournure française conserve les deux nuances sans emphase excessive.
- source_word: יִשְׁפֹּט
  choice: jugera
  rationale: שׁפט désigne ici l’exercice du jugement. Le futur convient à la valeur prospective du yiqtol dans ce contexte poétique, sans exclure une action caractéristique.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תבל désigne couramment le monde habité, voire l’ensemble du monde humain. « Le monde » est naturel et conserve la portée universelle.
- source_word: בְּצֶדֶק
  choice: avec justice
  rationale: צדק indique la norme ou la manière juste du jugement. « Avec justice » garde la forme nominale et son poids moral tout en restant idiomatique en français.
- source_word: יָדִין
  choice: jugera
  rationale: דין signifie rendre justice ou juger. La répétition française reflète le parallélisme judiciaire de l’hébreu plutôt que de l’élargir explicitement à « gouverner ».
- source_word: לְאֻמִּים
  choice: les peuples
  rationale: לאמים désigne des peuples ou des nations. « Les peuples » évite l’association trop étroite avec les États-nations modernes.
- source_word: בְּמֵישָׁרִים
  choice: avec équité
  rationale: מישרים évoque la droiture et l’impartialité. « Avec équité » exprime avec précision un jugement impartial dans un registre digne et accessible.
theological_decisions:
- issue: Le jugement divin universel
  choice: Présenter l’action comme un jugement futur de Dieu sur le monde et les peuples, exercé avec justice et équité.
  alternative: Comprendre les yiqtol comme décrivant principalement son gouvernement judiciaire habituel et présent.
  rationale: Les formes verbales poétiques peuvent être prospectives ou caractériser une action. Le futur respecte le mouvement contextuel sans préciser s’il s’agit exclusivement du jugement final.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé par la répétition de « jugera » ; « justice » et « équité » rendent distinctement les deux substantifs hébreux.
