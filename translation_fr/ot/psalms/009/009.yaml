  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: fr
  text: Et Yahweh sera une forteresse[a] pour l’opprimé[b], une forteresse aux temps de détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un refuge », « un refuge élevé » : le mot hébreu évoque un lieu élevé et sûr où l’on est protégé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou « pour celui qui est écrasé », « pour celui qui est accablé ». On peut aussi traduire le début : « Que Yahweh soit… »'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: Et … sera
  rationale: La forme peut, selon le contexte poétique, être comprise comme une affirmation au futur ou comme un souhait. Ici, la lecture déclarative s’accorde au mouvement de louange du contexte; l’ambiguïté est signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend directement le nom divin יהוה au lieu de lui substituer un titre.
- source_word: מִשְׂגָּב
  choice: forteresse
  rationale: Le terme désigne un lieu élevé, inaccessible et protecteur. « Forteresse » rend clairement cette image défensive; sa répétition conserve l’insistance poétique.
- source_word: לַדָּךְ
  choice: pour l’opprimé
  rationale: דך désigne ici la personne accablée, écrasée ou tenue sous oppression. Le singulier générique de l’hébreu est conservé.
- source_word: לְעִתּוֹת
  choice: aux temps de
  rationale: Le pluriel עִתּוֹת avec ל exprime les diverses périodes ou occasions où survient la détresse.
- source_word: בַּצָּרָה
  choice: détresse
  rationale: צָרָה évoque une situation d’angoisse, d’adversité ou de péril; « détresse » est précis et naturel dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération le distingue du titre אֲדֹנָי et préserve cette donnée du texte source.
- issue: Valeur de וִיהִי
  choice: Et Yahweh sera
  alternative: Que Yahweh soit
  rationale: La forme verbale admet une lecture déclarative au futur ainsi qu’une nuance volitive possible. Le contexte immédiat favorise ici l’affirmation, sans éliminer l’autre lecture, indiquée en note.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition de « une forteresse » reproduit celle de l’hébreu. « Aux temps de détresse » conserve le pluriel temporel et la formulation concise du verset.
