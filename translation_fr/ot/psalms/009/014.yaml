  text: so that I may recount all your praises in the gates of Daughter Zion[a]; I will rejoice in your salvation.
translation:
  language: fr
  text: afin que je proclame toutes tes louanges aux portes de la fille de Sion ; je me réjouirai de ton salut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délivrance ». Le terme hébreu peut désigner aussi bien le secours qui arrache à un danger présent que le salut dans un sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat et conserve naturellement cette valeur en français moderne.
- source_word: אֲסַפְּרָה
  choice: je raconte
  rationale: Le piel de ספר exprime ici l’action de raconter ou de proclamer publiquement les motifs de louange.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: toutes tes louanges
  rationale: Respecte le quantificateur et le pluriel hébreux, qui peuvent désigner les paroles de louange ou les actes dignes de louange de Dieu.
- source_word: בְּשַׁעֲרֵי
  choice: aux portes de
  rationale: La préposition ב peut signifier « dans » ou « à » ; « aux portes » est idiomatique en français et évoque le lieu public de rassemblement.
- source_word: בַת צִיּוֹן
  choice: la fille de Sion
  rationale: Conserve la personnification poétique hébraïque de Sion/Jérusalem dans une formulation française intelligible.
- source_word: אָגִילָה
  choice: je me réjouirai
  rationale: Exprime clairement la joie exultante portée par גיל, dans un registre digne et courant.
- source_word: בִּישׁוּעָתֶךָ
  choice: de ton salut
  rationale: « Salut » conserve l’ampleur du terme ישועה tout en pouvant désigner ici une délivrance concrète ; la préposition française « de » rend idiomatiquement le motif de la joie.
theological_decisions:
- issue: Sens de ישועה
  choice: salut
  alternative: délivrance
  rationale: Le contexte peut viser le secours face aux ennemis, mais « salut » préserve aussi la portée plus large du terme sans exclure ce sens concret. L’alternative est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe poétique reste proche de l’hébreu sans devenir obscure ; « la fille de Sion » maintient la personnification traditionnelle.
