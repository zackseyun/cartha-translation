lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: Je veux me réjouir
  rationale: Le verbe שׂמח exprime la joie. La tournure « je veux » restitue ici la nuance volitive de la forme hébraïque à valeur cohortative, plus précisément qu’un simple futur.
- source_word: וְאֶעֶלְצָה
  choice: et exulter
  rationale: Le verbe עלץ désigne une joie intense et débordante. « Exulter » conserve cette intensification tout en distinguant le second verbe du premier.
- source_word: בָךְ
  choice: en toi
  rationale: La préposition ב marque naturellement ici la personne en qui la joie trouve son objet et son lieu ; « en toi » préserve la formulation concise de l’hébreu.
- source_word: אֲזַמְּרָה
  choice: je veux célébrer … par mes chants
  rationale: Le piel de זמר signifie chanter ou faire de la musique en signe de louange. Cette formulation française exprime naturellement l’action de louer en chantant et conserve la nuance volitive.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Le terme hébreu est conservé sans explicitation interprétative ; dans ce contexte, le nom représente la personne de Dieu telle qu’elle se fait connaître.
- source_word: עֶלְיוֹן
  choice: Très-Haut
  rationale: L’adjectif substantivé sert de titre divin et fonctionne ici comme une adresse directe. La majuscule et la ponctuation en signalent l’emploi comme titre.
theological_decisions:
- issue: Rendu du titre divin עֶלְיוֹן
  choice: Très-Haut
  alternative: ô Très-Haut ; le Très-Haut
  rationale: Le mot fonctionne vraisemblablement comme un titre divin en apostrophe. « Très-Haut » préserve le titre sans ajouter d’article ni développer son sens.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, ainsi que la différence d’intensité entre les deux verbes de joie. Les formes hébraïques à nuance cohortative sont rendues par « je veux », qui exprime une résolution volontaire plutôt qu’une simple prédiction.
