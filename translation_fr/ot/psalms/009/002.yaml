  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: fr
  text: Je me réjouirai et j’exulterai en toi[a] ; je célébrerai ton nom par mes chants, Très-Haut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je serai dans la joie et je me réjouirai en toi. »'
