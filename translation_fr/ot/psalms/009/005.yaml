  text: גָּעַ֣רְתָּ ג֭וֹיִם אִבַּ֣דְתָּ רָשָׁ֑ע שְׁמָ֥/ם מָ֝חִ֗יתָ לְ/עוֹלָ֥ם וָ/עֶֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/005.yaml
  text: You rebuked nations[a]; you destroyed the wicked[b]; you blotted out their name forever and ever.
translation:
  language: fr
  text: Tu as réprimandé les nations ; tu as fait périr les méchants[a] ; tu as effacé leur nom[b] pour toujours, à jamais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le méchant » ; le singulier hébreu peut désigner un individu ou avoir un sens générique et collectif.
    reason: alternative_reading
  - marker: b
    text: Littéralement « leur nom » ; dans ce contexte, l’expression implique la disparition de leur souvenir ou de leur renommée.
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: tu as réprimandé
  rationale: Le verbe exprime une réprimande ferme et efficace. « Réprimandé » conserve l’action verbale directe sans en expliciter davantage le résultat.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Dans ce contexte de jugement, le terme désigne les peuples constitués en nations. « Nations » est naturel et n’importe pas une opposition religieuse ultérieure.
- source_word: אִבַּדְתָּ
  choice: tu as fait périr
  rationale: La forme intensive et causative signifie causer la perte ou la disparition. « Fait périr » rend clairement cette valeur tout en convenant à une personne ou à une collectivité.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le mot est morphologiquement singulier et peut désigner soit un individu, soit le représentant générique ou collectif des méchants. Le singulier français préserve cette ambiguïté mieux qu’un pluriel explicite.
- source_word: שְׁמָם
  choice: leur nom
  rationale: Traduction formelle du nom accompagné du suffixe pluriel. Ici, le « nom » comprend la mémoire ou la renommée, mais cette implication ne doit pas remplacer l’image dans le texte principal.
- source_word: מָחִיתָ
  choice: tu as effacé
  rationale: Le verbe évoque l’action d’essuyer ou de supprimer entièrement. Avec « leur nom », « effacé » restitue naturellement la métaphore en français.
- source_word: לְעוֹלָם וָעֶד
  choice: pour toujours, à jamais
  rationale: La formule redoublée intensifie la durée. Cette tournure française conserve l’emphase sans être artificielle.
theological_decisions:
- issue: Sens collectif ou individuel de רָשָׁע
  choice: « le méchant », singulier générique ou collectif possible
  alternative: « les méchants » ou « le méchant » compris comme un individu précis
  rationale: Le singulier hébreu permet une lecture individuelle aussi bien que générique ou collective. Le contexte des nations et le suffixe pluriel de « leur nom » favorisent le collectif, mais le texte français garde le singulier afin de ne pas éliminer l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation maintient les trois actes parallèles. « Pour toujours, à jamais » rend l’intensification poétique de la formule hébraïque.
