source:
  edition: WLC
  text: בְּ/שׁוּב אוֹיְבַ֥/י אָח֑וֹר יִכָּשְׁל֥וּ וְ֝/יֹאבְד֗וּ מִ/פָּנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/003.yaml
  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: fr
  text: Quand mes ennemis reculent, ils trébuchent et périssent devant toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de ta présence » ; littéralement « de devant ta face » ou « de devant ta présence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: Quand ... reculent
  rationale: La préposition ב suivie de l’infinitif construit de שׁוב introduit une proposition temporelle. « Quand… reculent » est naturel en français et rend ici le mouvement de retraite.
- source_word: אוֹיְבַי
  choice: mes ennemis
  rationale: Le nom אוֹיֵב avec le suffixe de première personne du singulier signifie directement « mes ennemis ».
- source_word: אָחוֹר
  choice: reculent
  rationale: אָחוֹר précise le retour vers l’arrière. En français, le verbe « reculer » exprime idiomatiquement l’ensemble שׁוב אָחוֹר sans lourdeur.
- source_word: יִכָּשְׁלוּ
  choice: ils trébuchent
  rationale: Le niphal de כשל évoque le fait de trébucher ou de chanceler. « Trébuchent » conserve cette image sans anticiper la destruction exprimée ensuite.
- source_word: וְיֹאבְדוּ
  choice: et périssent
  rationale: Au qal, אבד peut signifier « périr » ou « être détruit ». « Périssent » respecte la forme verbale et le parallélisme poétique sans préciser indûment le mode de leur fin.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: L’expression signifie littéralement « de devant ta face/présence ». « Devant toi » en restitue naturellement la portée spatiale et relationnelle, tandis que la note conserve l’autre nuance possible.
theological_decisions:
- issue: L’action divine dans la chute des ennemis
  choice: Le verset présente les ennemis qui trébuchent et périssent devant Dieu, sans préciser davantage le mécanisme de leur chute.
  alternative: Comprendre qu’ils périssent à cause de la présence de Dieu, ou qu’ils sont directement détruits par lui.
  rationale: L’hébreu מִפָּנֶיךָ permet une nuance spatiale (« devant toi ») aussi bien que causale (« à cause de ta présence »). Le texte principal préserve cette tension et la note signale explicitement l’autre lecture.
translation_notes:
  register: Français moderne, clair et digne. Le présent poétique conserve l’aspect non spécifié des imparfaits hébreux. « Reculent » évite la tournure moins naturelle « retournent en arrière ».
