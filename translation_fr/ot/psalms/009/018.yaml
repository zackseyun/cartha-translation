id: PSA.9.18
reference: Psalms 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: fr
  text: Car le nécessiteux ne sera pas oublié pour toujours ; l’espoir des affligés[a] ne disparaîtra pas à jamais.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des humbles » ou « des doux » ; le mot hébreu peut évoquer à la fois l’affliction et l’humilité.
    reason: lexical_alternative
  - marker: b
    text: La poésie hébraïque emploie ici deux expressions presque synonymes, « pour toujours » et « à jamais », pour souligner que les personnes dans le besoin ne seront pas abandonnées définitivement.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Conserve la valeur explicative ou justificative du lien avec la supplication précédente, dans un français naturel et soutenu.
- source_word: לֹא
  choice: ne… pas / ne… pas
  rationale: La négation porte explicitement sur le premier membre et est reprise en français dans le second membre elliptique pour en rendre clairement le sens.
- source_word: לָנֶצַח
  choice: pour toujours
  rationale: Expression temporelle naturelle qui indique une durée sans fin ou, dans ce contexte négatif, l’absence d’un abandon définitif.
- source_word: יִשָּׁכַח
  choice: sera oublié
  rationale: Le nifal de שכח est rendu au passif, sans ajouter Dieu comme sujet explicite.
- source_word: אֶבְיוֹן
  choice: le nécessiteux
  rationale: Désigne celui qui manque du nécessaire et se trouve vulnérable ; le singulier collectif de l’hébreu est conservé.
- source_word: תִּקְוַת
  choice: l’espoir des
  rationale: Le construit hébreu relie l’espoir au groupe désigné par le mot suivant.
- source_word: ענוים
  choice: les affligés
  rationale: Dans le parallélisme avec אֶבְיוֹן, le terme met vraisemblablement en avant la condition d’oppression ou de souffrance, tout en gardant aussi les nuances possibles d’humilité et de douceur en note.
- source_word: תֹּאבַד
  choice: ne disparaîtra pas
  rationale: Le qal de אבד peut signifier périr, se perdre ou disparaître. Appliqué à l’espoir, « disparaître » est idiomatique et conserve l’idée de cessation sans suggérer que l’espoir est un être vivant.
- source_word: לָעַד
  choice: à jamais
  rationale: Rend le quasi-synonyme poétique de לָנֶצַח tout en évitant une répétition lourde et en préservant le parallélisme temporel.
theological_decisions:
- issue: Sujet implicite de « sera oublié »
  choice: Maintenir le passif sans nommer explicitement Dieu.
  alternative: « Dieu n’oubliera pas pour toujours le nécessiteux. »
  rationale: L’hébreu emploie une forme passive. Le contexte implique l’action de Dieu, mais la traduction n’ajoute pas un sujet absent du texte.
- issue: Sens de ענוים
  choice: « les affligés »
  alternative: « les humbles » ou « les doux »
  rationale: Le parallélisme avec « le nécessiteux » favorise ici la nuance sociale de personnes accablées ou opprimées, sans exclure la dimension d’humilité signalée en note.
- issue: Portée de la négation dans le second membre
  choice: Répéter explicitement « ne… pas » en français.
  alternative: Traduire littéralement sans négation exprimée dans le second membre.
  rationale: La poésie hébraïque laisse la négation du premier membre régir par ellipse le second. Sa répétition en français évite un contresens tout en conservant l’assurance théologique du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébraïque est conservé, avec une légère variation idiomatique entre « pour toujours » et « à jamais ». Le passif maintient la discrétion du texte sur le sujet grammatical, et les notes préservent l’ambiguïté lexicale de ענוים.
