  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: fr
  text: 'Car celui qui demande compte du sang versé se souvient d’eux ;

    il n’oublie pas le cri des affligés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des pauvres ». Le terme hébreu peut désigner les pauvres, les affligés, les humbles ou les opprimés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui appuie l’affirmation précédente et convient au mouvement explicatif du psaume.
- source_word: דֹרֵשׁ דָּמִים
  choice: celui qui demande compte du sang versé
  rationale: L’expression présente Dieu comme celui qui enquête sur le sang répandu et en demande réparation. Cette formulation française exprime la responsabilité judiciaire sans suggérer le rôle technique du « vengeur du sang ».
- source_word: אוֹתָם
  choice: d’eux
  rationale: Le pronom objet pluriel est conservé et renvoie au groupe des personnes éprouvées mentionné dans le second membre du verset.
- source_word: זָכָר
  choice: se souvient
  rationale: Bien que la forme hébraïque soit un accompli, le parallélisme poétique exprime ici une action caractéristique et durable de Dieu ; le présent est naturel en français.
- source_word: לֹא שָׁכַח
  choice: il n’oublie pas
  rationale: Le présent rend l’affirmation générale et continue qui répond en parallèle à « se souvient ».
- source_word: צַעֲקַת
  choice: le cri
  rationale: Rend directement l’appel poussé dans la détresse, sans le réduire à une requête formelle.
- source_word: עניים
  choice: des malheureux
  rationale: Le terme peut désigner les pauvres, les affligés, les humbles ou les opprimés. « Malheureux » garde ici un sens assez large pour inclure ceux qui souffrent de la violence et réclament justice.
theological_decisions:
- issue: La justice divine impliquée par דֹרֵשׁ דָּמִים
  choice: Dieu demande compte du sang injustement versé.
  alternative: Dieu remarque simplement le sang versé, ou cherche littéralement du sang.
  rationale: L’idiome exprime la mise en cause du meurtre et la justice exercée contre le coupable, non une simple observation ni un désir littéral de sang. La traduction évite toutefois de préciser un mécanisme juridique que le texte ne nomme pas.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme est conservé, de même que l’anticipation poétique du pronom « eux » avant la mention des « malheureux ».
