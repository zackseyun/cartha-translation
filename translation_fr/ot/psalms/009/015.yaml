source:
  edition: WLC
  text: טָבְע֣וּ ג֭וֹיִם בְּ/שַׁ֣חַת עָשׂ֑וּ בְּ/רֶֽשֶׁת ז֥וּ טָ֝מָ֗נוּ נִלְכְּדָ֥ה רַגְלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/015.yaml
  text: The nations have sunk into the pit they made; in the net they hid[a], their own foot has been caught.
translation:
  language: fr
  text: Les nations se sont enfoncées dans la fosse qu’elles ont faite ; dans le filet qu’elles ont dissimulé, leur pied s’est pris[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte « leur pied » au singulier, probablement comme singulier collectif désignant les nations.
    reason: lexical_alternative
lexical_decisions:
- source_word: טָבְעוּ
  choice: se sont enfoncées
  rationale: Le qal accompli exprime l’idée de s’enfoncer ou de sombrer. « Se sont enfoncées » conserve l’image concrète d’une chute dans une fosse et reste naturel en français.
- source_word: גּוֹיִם
  choice: les nations
  rationale: Le terme désigne couramment les nations ou les peuples ; ici, « les nations » convient au sens collectif et au contexte hostile du psaume.
- source_word: בְּשַׁחַת
  choice: dans la fosse
  rationale: שַׁחַת désigne ici une fosse, possiblement creusée comme piège. « Dans » rend simplement la préposition tout en laissant le verbe exprimer le mouvement d’enfoncement.
- source_word: עָשׂוּ
  choice: qu’elles ont creusée
  rationale: Le verbe signifie littéralement « faire ». Avec « fosse », le français idiomatique dit « creuser une fosse » ; ce choix conserve l’idée qu’elles ont elles-mêmes préparé ce qui cause leur perte.
- source_word: בְּרֶשֶׁת
  choice: dans le filet
  rationale: רֶשֶׁת signifie « filet ». La tournure locative convient au parallèle avec la fosse et au verbe passif de capture.
- source_word: זוּ
  choice: que
  rationale: La particule relative relie « filet » à l’action de le dissimuler ; le pronom relatif français « que » en donne directement le sens.
- source_word: טָמָנוּ
  choice: ont dissimulé
  rationale: Le verbe signifie cacher ou enfouir, notamment un piège. « Dissimuler » est naturel pour un filet posé secrètement et conserve l’idée de son caractère caché.
- source_word: נִלְכְּדָה
  choice: s’est pris
  rationale: Le niphal exprime le fait d’être capturé. En français, « le pied s’est pris dans le filet » restitue naturellement ce sens sans effacer l’image.
- source_word: רַגְלָם
  choice: leur pied
  rationale: L’hébreu emploie le singulier « leur pied », probablement avec une valeur collective. Le singulier est conservé afin de respecter l’image et la forme du texte source.
