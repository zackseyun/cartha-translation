  text: יָשׁ֣וּבוּ רְשָׁעִ֣ים לִ/שְׁא֑וֹלָ/ה כָּל גּ֝וֹיִ֗ם שְׁכֵחֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: fr
  text: Les méchants retourneront au shéol[a][b] — toutes les nations qui oublient Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reviendront au shéol ». Le verbe hébreu peut signifier « retourner » ou « revenir ».
    reason: lexical_alternative
  - marker: b
    text: Le shéol est le terme hébreu désignant le séjour des morts ; son sens ne correspond pas exactement à la notion ultérieure, plus précise, d’enfer.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: retourneront
  rationale: Le qal inaccompli, 3e personne du pluriel, de שׁוב peut signifier « retourner » ou « revenir ». « Retourneront » conserve l’idée de mouvement vers le shéol sans réduire le verbe à une simple métaphore de destruction.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Traduction française courante et concise du substantif pluriel désignant des personnes moralement mauvaises.
- source_word: לִשְׁאוֹלָה
  choice: au shéol
  rationale: La translittération préserve la notion hébraïque du séjour des morts et évite aussi bien « tombeau », trop étroit, qu’« enfer », théologiquement plus spécifique.
- source_word: כָּל גּוֹיִם
  choice: toutes les nations
  rationale: Rend naturellement la totalité exprimée par כָּל et le pluriel גּוֹיִם, sans introduire une opposition entre Juifs et non-Juifs qui n’est pas explicitée ici.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: qui oublient Dieu
  rationale: La proposition relative rend naturellement le participe construit et en conserve la valeur caractéristique ou continue.
theological_decisions:
- issue: Sens de שְׁאוֹל dans un contexte de jugement
  choice: Conserver « shéol » par translittération.
  alternative: « le séjour des morts », « la tombe » ou « l’enfer »
  rationale: Même dans ce contexte de jugement, le terme hébreu désigne le domaine des morts sans imposer à lui seul la notion ultérieure et plus précise d’enfer. La translittération préserve cette tension.
- issue: Valeur de יָשׁוּבוּ
  choice: « retourneront »
  alternative: « reviendront » ou « se tourneront vers »
  rationale: Le verbe permet l’idée de retour ou de mouvement en arrière. Le texte ne précise pas pourquoi il s’agit d’un « retour »; la traduction maintient cette formulation potentiellement énigmatique plutôt que de l’expliquer.
translation_notes:
  register: Français international moderne, sobre et digne. « Shéol » est conservé comme terme biblique expliqué en note. Le tiret met en apposition le second membre du vers sans trancher davantage sa relation syntaxique avec le premier.
