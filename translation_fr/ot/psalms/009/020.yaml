  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: fr
  text: Mets-les dans la crainte, SEIGNEUR ! Que les peuples sachent qu’ils ne sont que des mortels. Sélah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה ... מוֹרָה לָהֶם
  choice: Mets en eux la crainte
  rationale: La tournure conserve l’impératif « mettre/placer » ainsi que l’idée que la crainte pénètre les destinataires. מוֹרָה est compris ici comme une forme de « crainte, terreur », sens adapté au contexte.
- source_word: יְהוָה
  choice: SEIGNEUR
  rationale: La petite capitale signale le nom divin YHWH tout en suivant une convention française largement intelligible.
- source_word: גּוֹיִם
  choice: les peuples
  rationale: « Peuples » rend naturellement les groupes humains visés et permet de conserver ensuite le pronom masculin du texte sans personnifier grammaticalement des nations féminines.
- source_word: אֱנוֹשׁ הֵמָּה
  choice: ils ne sont que des mortels
  rationale: אֱנוֹשׁ souligne ici la faiblesse et la mortalité humaines; « des mortels » exprime cette nuance mieux que le simple terme générique « hommes ».
- source_word: סֶּלָה
  choice: Sèla
  rationale: Le terme liturgique ou musical demeure d’interprétation incertaine; une translittération évite de lui imposer la valeur précise de « pause ».
theological_decisions:
- issue: Nature de la « crainte » demandée à Dieu
  choice: 'Conserver la demande directe : « Mets en eux la crainte »'
  alternative: Atténuer en « Qu’ils te révèrent » ou préciser « terrifie-les »
  rationale: Le texte demande à Dieu de placer la crainte ou la terreur en eux sans préciser qu’il s’agit exclusivement de révérence cultuelle ni imposer le degré extrême suggéré par « terrifier ».
translation_notes:
  register: Français international actuel, sobre et solennel. La syntaxe reste directe et poétique; « Sèla » préserve l’incertitude du terme final.
