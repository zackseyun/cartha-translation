  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: fr
  text: Mais Yahweh siège pour toujours[a] ; il a établi son trône pour juger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « est assis » ; dans ce contexte, il s’agit de la posture d’un roi qui règne et juge.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il a préparé son trône pour le jugement » ; ou : « il a établi son trône pour rendre justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Mais Yahweh
  rationale: 'La conjonction reçoit ici une valeur adversative : la permanence du règne de Yahweh contraste avec la disparition des méchants évoquée auparavant. Le nom divin est translittéré « Yahweh ».'
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française naturelle qui conserve l’idée de durée perpétuelle.
- source_word: יֵשֵׁב
  choice: siège
  rationale: Le verbe signifie littéralement « s’assied/est assis ». Dans le contexte royal et judiciaire du trône, « siège » rend naturellement cette posture sans devoir ajouter « sur son trône » avant que celui-ci soit mentionné.
- source_word: כּוֹנֵן
  choice: a affermi
  rationale: Le polel exprime l’action de rendre ferme ou d’établir solidement. « A affermi » préserve cette nuance tout en restant idiomatique.
- source_word: לַמִּשְׁפָּט
  choice: pour juger
  rationale: La construction indique la finalité judiciaire du trône. La formulation verbale est naturelle en français et conserve ici le sens concret d’exercice du jugement.
- source_word: כִּסְאוֹ
  choice: son trône
  rationale: Rend directement le nom avec son suffixe possessif.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Portée royale de יֵשֵׁב
  choice: siège
  alternative: est assis sur son trône
  rationale: « Siège » suggère en français l’exercice royal ou judiciaire, tandis que la mention explicite du trône dans le second membre confirme l’image sans qu’il soit nécessaire de la développer dans le premier.
- issue: Valeur de מִשְׁפָּט
  choice: juger
  alternative: rendre justice
  rationale: Le terme peut désigner le jugement ou la justice. « Juger » maintient la scène judiciaire concrète, tandis que « rendre justice » exprime une autre nuance légitime.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme est conservé, avec une formulation concise adaptée à la poésie biblique.
