id: PSA.9.1
reference: Psalms 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: fr
  text: Je rendrai grâce à Yahweh de tout mon cœur ; je raconterai toutes tes merveilles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tes œuvres merveilleuses ».'
    reason: Alternative lexicale reflétant la valeur d’actes extraordinaires possible pour נִפְלְאוֹתֶיךָ.
lexical_decisions:
- source_word: אוֹדֶה
  choice: Je rendrai grâce
  rationale: Le hiphil de ידה exprime ici l’action de remercier ou de louer Dieu dans le cadre du culte. « Rendre grâce » conserve la dimension de gratitude tout en restant naturel et digne en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par le titre « le Seigneur ».
- source_word: בְּכָל לִבִּי
  choice: de tout mon cœur
  rationale: Cette expression française naturelle restitue l’idée hébraïque d’un engagement intérieur entier et sans réserve.
- source_word: אֲסַפְּרָה
  choice: je raconterai
  rationale: Le verbe ספר désigne le fait de raconter ou d’exposer les actes accomplis. « Raconter » convient au témoignage public du psalmiste et reste accessible en français moderne.
- source_word: כָּל
  choice: tout / toutes
  rationale: 'La totalité exprimée par כָל est conservée dans les deux membres du verset : « tout mon cœur » et « toutes tes merveilles ».'
- source_word: נִפְלְאוֹתֶיךָ
  choice: tes merveilles
  rationale: Le terme issu de פלא désigne des réalités ou des actes extraordinaires qui suscitent l’émerveillement, souvent les interventions de Dieu. « Tes merveilles » préserve la formulation concise et l’ambiguïté entre les actes merveilleux et leurs manifestations.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: L’hébreu emploie directement le tétragramme. La forme « Yahweh » conserve le nom personnel au lieu de lui substituer un titre, sans introduire d’interprétation confessionnelle.
- issue: Portée de נִפְלְאוֹתֶיךָ
  choice: tes merveilles
  alternative: tes œuvres merveilleuses
  rationale: Le nom hébreu peut évoquer aussi bien les merveilles elles-mêmes que les actes extraordinaires de Dieu. Le texte principal garde cette concision et la note signale la lecture explicitement orientée vers les œuvres.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux engagements à la première personne et la répétition de l’idée de totalité sont conservés.
