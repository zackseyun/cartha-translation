source:
  edition: WLC
  text: נ֤וֹדַ֨ע יְהוָה֮ מִשְׁפָּ֪ט עָ֫שָׂ֥ה בְּ/פֹ֣עַל כַּ֭פָּי/ו נוֹקֵ֣שׁ רָשָׁ֑ע הִגָּי֥וֹן סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: fr
  text: 'Yahweh s’est fait connaître[a] : il a rendu justice. Le méchant est pris au piège par l’œuvre de ses propres mains. Higgaïôn[b]. Séla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Yahweh est connu : il a rendu justice. » L’hébreu נודע peut décrire un état passif (« est connu ») ou avoir un sens résultatif (« s’est fait connaître »).'
    reason: alternative_reading
  - marker: b
    text: « Higgaïôn » est probablement un terme musical ou liturgique ; il pourrait aussi signifier « méditation » ou désigner une musique retentissante.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדַע
  choice: s’est fait connaître
  rationale: Le nifal de ידע peut exprimer ici un état passif ou une manifestation ayant un résultat présent. « S’est fait connaître » relie naturellement la révélation de Yahweh à son acte judiciaire, tout en signalant l’autre lecture en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom propre du texte hébreu plutôt que de le remplacer par un titre.
- source_word: מִשְׁפָּט עָשָׂה
  choice: il a exercé le jugement
  rationale: Cette formulation française rend l’action judiciaire accomplie sans élargir le sens à une notion générale de justice.
- source_word: בְּפֹעַל כַּפָּיו
  choice: par l’œuvre de ses propres mains
  rationale: 'La préposition indique le moyen ou la circonstance : les actes mêmes du méchant deviennent l’instrument de sa chute. « Propres » explicite la valeur du possessif en français.'
- source_word: נוֹקֵשׁ
  choice: s’est pris au piège
  rationale: Cette expression conserve la métaphore du piège et rend naturellement en français la forme hébraïque dans son contexte résultatif.
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif substantivé singulier désigne ici une figure représentative; « le méchant » en préserve la concision.
- source_word: הִגָּיוֹן
  choice: Higgaïôn
  rationale: Le terme est probablement une indication musicale ou liturgique, mais son sens exact reste incertain; la translittération évite de trancher arbitrairement.
- source_word: סֶלָה
  choice: Séla
  rationale: Le terme, sans doute liturgique ou musical, demeure d’interprétation incertaine et est donc translittéré.
theological_decisions:
- issue: La manifestation de Yahweh par le jugement
  choice: Yahweh s’est fait connaître en exerçant le jugement, sans développer cette affirmation au-delà du verset.
  alternative: « Yahweh est connu » pourrait exprimer plus directement un état passif général ou résultant.
  rationale: L’hébreu associe étroitement le fait que Yahweh est connu à l’acte judiciaire qu’il accomplit. Le texte principal exprime la manifestation divine, tandis que la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation souligne le lien entre la manifestation de Yahweh et son jugement. Les termes liturgiques incertains sont translittérés avec des accents facilitant une prononciation française.
