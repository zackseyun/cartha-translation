  to: 'Yahweh s’est fait connaître[a] : il a rendu justice. Le méchant est pris au piège par l’œuvre de ses propres mains. Higgaïôn[b]. Séla.'
  rationale: La révision remplace une tournure pronominale active par un passif correspondant à la forme et au sens contextuel de נוֹקֵשׁ. Elle remplace aussi « a exercé le jugement », grammaticalement possible mais peu idiomatique, par « a rendu justice », expression française naturelle pour l’action judiciaire accomplie. Les notes continuent de préserver les ambiguïtés pertinentes.
