id: PSA.9.4
reference: Psalms 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: fr
  text: Car tu as défendu mon droit et ma cause[a] ; tu as siégé sur le trône en jugeant avec justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as rendu mon jugement et statué sur ma cause ». Les deux mots hébreux appartiennent au vocabulaire juridique et expriment ici la reconnaissance du bon droit du psalmiste.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange précédente et conserve clairement le lien causal.
- source_word: עָשִׂיתָ
  choice: tu as défendu
  rationale: Avec les deux termes juridiques qui suivent, le verbe signifie ici faire valoir ou soutenir le bon droit de quelqu’un ; « défendre » rend naturellement cette valeur judiciaire.
- source_word: מִשְׁפָּטִי
  choice: mon droit
  rationale: Dans ce contexte judiciaire, מִשְׁפָּט désigne le droit ou la juste revendication du psalmiste plutôt que la justice comme qualité abstraite.
- source_word: וְדִינִי
  choice: et ma cause
  rationale: דִּין désigne ici une cause ou une affaire soumise au jugement ; ce choix maintient le parallélisme sans confondre les deux termes.
- source_word: יָשַׁבְתָּ
  choice: tu as siégé
  rationale: Le verbe évoque le fait de prendre place comme roi et juge ; « siéger » convient naturellement au cadre judiciaire.
- source_word: לְכִסֵּא
  choice: sur le trône
  rationale: La préposition et le nom expriment la position du juge royal assis sur son trône.
- source_word: שׁוֹפֵט
  choice: en jugeant
  rationale: Le participe décrit l’activité exercée par Dieu tandis qu’il siège ; la tournure française conserve cette valeur verbale.
- source_word: צֶדֶק
  choice: avec justice
  rationale: Le nom « justice » est employé avec une valeur adverbiale et qualifie la manière de juger, sans transformer silencieusement le substantif hébreu en adjectif.
theological_decisions:
- issue: Image de Dieu comme juge
  choice: Dieu siège sur le trône et défend le droit ainsi que la cause du psalmiste.
  alternative: Dieu agit plus généralement en faveur du psalmiste.
  rationale: L’association des termes juridiques מִשְׁפָּט et דִּין avec le trône et l’acte de juger impose une scène judiciaire explicite, sans exiger une élaboration doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image judiciaire structurante du verset. « Siéger » est plus idiomatique en français que le calque « s’asseoir » dans ce contexte royal et judiciaire.
