source:
  edition: WLC
  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: fr
  text: Et ceux qui connaissent ton nom[a] mettront leur confiance en toi, car tu n’as pas abandonné ceux qui te cherchent, Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans la Bible, connaître le « nom » de Dieu signifie connaître son caractère révélé et sa réputation, et non simplement savoir comment il s’appelle.
    reason: cultural_note
  - marker: b
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ». Ou : « tu n’as pas délaissé ceux qui te cherchent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: mettront leur confiance en toi
  rationale: Le qal inaccompli de בטח avec ב exprime une confiance assurée placée en quelqu’un. Le futur français convient au contexte poétique; la coordination initiale est naturellement portée par l’enchaînement du verset.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: ceux qui connaissent ton nom
  rationale: Le participe désigne un groupe caractérisé par cette connaissance. La formulation littérale conserve la portée relationnelle et révélatrice du « nom ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de la confiance exprimée dans la première proposition.
- source_word: לֹא עָזַבְתָּ
  choice: tu n’abandonnes pas
  rationale: Le parfait hébreu présente le fait établi que Dieu n’a pas délaissé les siens. Le présent français exprime naturellement cette fidélité attestée et durable, sans la limiter au passé.
- source_word: דֹּרְשֶׁיךָ
  choice: ceux qui te cherchent
  rationale: דרש appliqué à Dieu désigne le fait de se tourner vers lui et de le rechercher, notamment dans la prière et l’attachement fidèle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre plutôt que remplacé par un titre; « Yahweh » est une transcription française courante.
theological_decisions:
- issue: Portée du « nom » divin
  choice: conserver « ton nom » dans le texte et en expliquer la portée en note
  alternative: développer dans le texte par « qui connaissent qui tu es »
  rationale: Le mot שֵׁם évoque ici le caractère révélé et la réputation de Dieu, mais l’expression biblique « connaître ton nom » mérite d’être conservée afin de ne pas réduire sa richesse.
- issue: Valeur temporelle de לֹא עָזַבְתָּ
  choice: « tu n’abandonnes pas »
  alternative: « tu n’as pas abandonné »
  rationale: Le parfait renvoie à une fidélité démontrée; le présent français met en relief sa validité durable. La note signale la traduction plus formellement temporelle.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le nom divin. Sa transcription préserve cette distinction, tandis qu’une note rappelle le rendu traditionnel français.
translation_notes:
  register: Français international moderne, poétique et digne. « Mettront leur confiance en toi » explicite l’idiome de בטח sans archaïsme. L’ordre final « Yahweh » respecte l’interpellation placée à la fin du vers hébreu.
