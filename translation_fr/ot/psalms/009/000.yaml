  text: 'For the choirmaster: according to “Death of the Son.”[a] A psalm of David.'
translation:
  language: fr
  text: Au chef de chœur. Sur « La mort du fils ».[a] Psaume de David.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque עַלְמוּת לַבֵּן (transcrite « Alamoth-Labben ») est incertaine. Il s’agit probablement d’une indication musicale ou du titre d’un air ; traditionnellement, elle a aussi été laissée sans traduction, comme s’il s’agissait d’un nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, cette forme introduite par ל désigne vraisemblablement une instruction destinée au responsable de l’exécution musicale. « Chef de chœur » est clair, naturel et conserve le cadre liturgique.
- source_word: עַלְמוּת לַבֵּן
  choice: sur « Mort du fils »
  rationale: L’expression est très incertaine, mais elle semble fonctionner comme une indication musicale ou le titre d’un air. « Sur » rend cette fonction, tandis que les guillemets signalent un titre possible; la note préserve l’incertitude et la possibilité d’une translittération.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Le nom désigne régulièrement un chant psalmique, notamment dans les suscriptions. « Psaume » est le terme français courant et approprié au genre.
- source_word: לְדָוִד
  choice: de David
  rationale: Le ל peut exprimer l’auteur, l’appartenance, l’association ou la destination. « De David » maintient mieux cette latitude que « écrit par David ».
