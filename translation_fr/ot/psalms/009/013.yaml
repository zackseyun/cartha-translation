  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: fr
  text: Fais-moi grâce[a], Yahweh ! Vois la détresse que m’infligent ceux qui me détestent, toi qui me relèves des portes de la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aie pitié de moi. »'
    reason: lexical_alternative
  - marker: b
    text: « Les portes de la mort » sont une image hébraïque évoquant le seuil de la mort ou son pouvoir.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Fais-moi grâce
  rationale: L’impératif de חנן avec suffixe de première personne exprime une demande de faveur bienveillante. « Fais-moi grâce » est direct, naturel dans une prière et moins interprétatif que « Aie pitié de moi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la transcription du nom divin plutôt que par un titre de substitution.
- source_word: רְאֵה
  choice: Vois
  rationale: L’impératif de ראה appelle directement l’attention de Dieu ; « Vois » en conserve la simplicité et la force.
- source_word: עָנְיִי
  choice: la détresse
  rationale: עֳנִי peut désigner l’affliction, la misère ou la souffrance. « Détresse » convient ici au malheur causé par des adversaires sans en préciser indûment la nature.
- source_word: מִשֹּׂנְאַי
  choice: que m’infligent ceux qui me détestent
  rationale: La préposition מִן indique vraisemblablement l’origine de la détresse. Cette formulation explicite en français le rapport compact de l’hébreu sans ajouter une nouvelle action.
- source_word: מְרוֹמְמִי
  choice: toi qui me fais remonter
  rationale: Le participe polel de רום avec suffixe de première personne désigne Yahweh comme celui qui élève le psalmiste. « Fais remonter » s’accorde naturellement avec l’image d’une délivrance hors des portes de la mort.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: des portes de la mort
  rationale: La traduction conserve l’image hébraïque du seuil ou du domaine de la mort, sans introduire le Shéol, absent du texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin ; sa transcription préserve le caractère personnel du nom au lieu de lui substituer un titre.
- issue: Lien syntaxique de מִשֹּׂנְאַי (« de ceux qui me détestent »)
  choice: 'Le groupe indique la source de la détresse : « la détresse que m’infligent ceux qui me détestent »'
  alternative: 'Comprendre le groupe plus librement : « vois ma détresse ; [vois] ceux qui me détestent »'
  rationale: Le rattachement à « ma détresse » suit le plus naturellement l’ordre et la syntaxe de l’hébreu, sans sous-entendre un second impératif.
- issue: Valeur de מְרוֹמְמִי
  choice: 'Adresse en apposition à Yahweh : « toi qui me fais remonter »'
  alternative: 'Description substantivée : « celui qui me relève »'
  rationale: Le participe avec suffixe peut fonctionner comme une apposition vocative. La formulation retenue conserve ce lien direct dans la prière.
translation_notes:
  register: Français international moderne, digne et accessible. L’exclamation après l’invocation rend l’appel pressant sans alourdir la phrase. « Ceux qui me détestent » est plus courant que « ceux qui me haïssent », tandis que « les portes de la mort » conserve l’image poétique de l’hébreu.
