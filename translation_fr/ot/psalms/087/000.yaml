  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/000.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. Its foundation is in the holy mountains.
translation:
  language: fr
  text: Des fils de Coré[a]. Psaume, chant. Son fondement[b] est sur les montagnes saintes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Pour les fils de Coré » : l’expression peut indiquer une attribution ou une association, sans nécessairement préciser qui a composé le psaume.'
    reason: lexical_alternative
  - marker: b
    text: Le pronom renvoie probablement à Sion ou à Jérusalem, sans que ce nom soit exprimé ici en hébreu.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: Des fils de Coré
  rationale: La préposition לְ peut signaler l’auteur, le destinataire ou plus largement l’association. La formulation française traditionnelle et concise est conservée, avec une note qui maintient cette ambiguïté.
- source_word: מִזְמוֹר שִׁיר
  choice: Psaume, chant
  rationale: Les deux désignations poétiques sont rendues séparément sans transformer leur juxtaposition en une distinction absente de l’hébreu.
- source_word: יְסוּדָתוֹ
  choice: Sa fondation
  rationale: Le singulier et le suffixe masculin de l’hébreu sont conservés. Le référent n’étant pas exprimé, la traduction n’insère pas explicitement Sion ou Jérusalem.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: sur les montagnes saintes
  rationale: « Sur » exprime naturellement le lieu où repose une fondation; « montagnes saintes » conserve le pluriel et la qualification cultuelle de l’hébreu.
theological_decisions:
- issue: Référent du suffixe dans « sa fondation »
  choice: Maintenir le pronom sans nommer son référent
  alternative: « La fondation de Sion est sur les montagnes saintes »
  rationale: Sion ou Jérusalem est vraisemblablement sous-entendue par le contexte, mais n’est pas nommée dans ce verset. L’expliciter dans le texte lèverait une ambiguïté réelle.
- issue: Rapport des fils de Coré au psaume
  choice: Employer « Des fils de Coré »
  alternative: « Pour les fils de Coré »
  rationale: La préposition hébraïque permet plusieurs rapports, notamment l’attribution et l’association. La note signale l’autre possibilité sans imposer une théorie de l’auteur.
translation_notes:
  register: Français moderne, sobre et liturgiquement digne. La structure brève de la suscription hébraïque est préservée, ainsi que l’ambiguïté du suffixe et de la préposition initiale.
