  text: אַזְכִּ֤יר רַ֥הַב וּ/בָבֶ֗ל לְֽ/יֹ֫דְעָ֥/י הִנֵּ֤ה פְלֶ֣שֶׁת וְ/צ֣וֹר עִם כּ֑וּשׁ זֶ֝֗ה יֻלַּד שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: fr
  text: 'Je mentionnerai Rahab[a] et Babylone parmi ceux qui me connaissent[b] ; voici la Philistie et Tyr, avec Koush : celui-ci est né là[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab est un nom poétique désignant l’Égypte.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « à ceux qui me connaissent ». La préposition hébraïque peut aussi se comprendre ainsi.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire, d’après le contexte du psaume, à Sion.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Je compterai
  rationale: Le hiphil de זכר peut signifier « mentionner » ou « faire mémoire de ». Dans ce contexte de reconnaissance et d’inscription parmi des peuples, « compter » rend naturellement en français l’idée de nommer comme appartenant à un groupe, sans imposer le sens technique d’« inscrire ».
- source_word: רַהַב
  choice: Rahab
  rationale: Rahab est ici un nom poétique de l’Égypte. Le nom hébreu est conservé dans le texte, et son référent est expliqué en note.
- source_word: וּבָבֶל
  choice: et Babylone
  rationale: Forme française usuelle de ce nom de lieu.
- source_word: לְיֹדְעָי
  choice: parmi ceux qui me connaissent
  rationale: La construction poétique avec לְ peut désigner l’inclusion parmi ceux qui reconnaissent le locuteur, mais peut aussi se comprendre comme « à ceux qui me connaissent » ; cette autre analyse est signalée en note.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la fonction d’attirer l’attention tout en restant naturel dans un registre poétique français.
- source_word: פְלֶשֶׁת
  choice: la Philistie
  rationale: L’hébreu désigne le territoire, et non explicitement ses habitants.
- source_word: וְצוֹר
  choice: et Tyr
  rationale: Forme française usuelle du nom de la ville.
- source_word: עִם כּוּשׁ
  choice: avec Koush
  rationale: עִם exprime l’accompagnement ou l’association. « Avec » est direct et naturel.
- source_word: כּוּשׁ
  choice: Koush
  rationale: La translittération évite l’assimilation géographique potentiellement trompeuse avec l’Éthiopie moderne.
- source_word: זֶה
  choice: celui-ci
  rationale: Le démonstratif masculin singulier est conservé sans ajouter « homme ». Il peut avoir une portée distributive à propos d’un représentant des peuples énumérés.
- source_word: יֻלַּד שָׁם
  choice: est né là
  rationale: Le passif de ילד suivi de שָׁם exprime simplement la naissance en ce lieu. Le passé composé convient à la déclaration poétique en français.
theological_decisions:
- issue: Identité du locuteur dans « ceux qui me connaissent »
  choice: Conserver la première personne sans identifier explicitement le locuteur.
  alternative: Le locuteur est le Seigneur ; ou Sion personnifiée.
  rationale: Le vers ne nomme pas explicitement le locuteur. La formulation française maintient donc l’ambiguïté littéraire et théologique de l’hébreu.
- issue: Référent de « là »
  choice: Conserver l’adverbe et préciser seulement en note son référent contextuel probable.
  alternative: Remplacer « là » par « à Sion » ou « dans la ville de Dieu ».
  rationale: Dans le contexte du psaume, « là » renvoie à Sion, mais le texte hébreu garde un simple adverbe. La traduction ne substitue pas une interprétation au texte.
translation_notes:
  register: Français international moderne, poétique et digne. Les noms propres suivent les formes françaises usuelles ou une translittération transparente. La ponctuation conserve la progression de l’énumération et de la déclaration finale.
