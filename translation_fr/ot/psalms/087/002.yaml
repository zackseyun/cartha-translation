id: PSA.87.2
reference: Psalms 87:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: fr
  text: Yahvé aime les portes de Sion plus que toutes les demeures de Jacob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahvé aime les portes de Sion par-dessus toutes les demeures de Jacob. »'
    reason: Variante lexicale permettant de rendre autrement la valeur comparative de מִכֹּל.
lexical_decisions:
- source_word: אֹהֵב
  choice: aime
  rationale: Le participe qal de אהב a ici une valeur verbale générale, avec Yahvé pour sujet. « aime » exprime naturellement cette réalité durable sans en accentuer artificiellement l’intensité.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Cette forme française courante restitue le nom divin plutôt que de lui substituer le titre « le Seigneur ».
- source_word: שַׁעֲרֵי
  choice: les portes de
  rationale: Le pluriel construit désigne littéralement les portes de Sion. Même si les portes peuvent représenter la ville entière, l’image concrète du texte est conservée.
- source_word: צִיּוֹן
  choice: Sion
  rationale: « Sion » est la forme traditionnelle et courante du nom propre en français.
- source_word: מִכֹּל
  choice: plus que toutes
  rationale: Après un verbe exprimant une préférence, מִן avec כֹּל marque naturellement la comparaison. Cette formulation rend explicite la prédilection accordée à Sion.
- source_word: מִשְׁכְּנוֹת
  choice: les demeures
  rationale: Le pluriel de מִשְׁכָּן désigne ici des lieux d’habitation. « demeures » est clair, digne et évite la connotation cultuelle trompeuse de « tabernacles ».
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est conservé, même s’il désigne collectivement le peuple ou le territoire d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » préserve en français sa fonction de nom personnel, tandis que « le Seigneur » lui substituerait un titre.
- issue: Valeur comparative de מִכֹּל
  choice: plus que toutes les demeures de Jacob
  alternative: par-dessus toutes les demeures de Jacob
  rationale: Le contexte exprime le choix préférentiel de Sion parmi les lieux associés à Jacob. « plus que » est la formulation française la plus directe, sans développer la portée théologique de cette préférence.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le parallélisme poétique, l’image concrète des portes et le nom de Jacob, sans expliciter davantage leur portée collective.
