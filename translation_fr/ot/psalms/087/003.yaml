  yaml_path: translation/ot/psalms/087/003.yaml
  text: Glorious things are spoken of you[a], city of God. Selah
translation:
  language: fr
  text: Des choses glorieuses sont dites à ton sujet[a], cité de Dieu. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en toi ». La préposition hébraïque peut ici indiquer soit le sujet des paroles, soit le lieu où elles sont prononcées; le contexte favorise « à ton sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Des choses glorieuses
  rationale: Le terme, dérivé de כבד et employé substantivement au féminin pluriel, désigne ici des réalités honorables, splendides ou de grand poids. « Des choses glorieuses » convient au contexte de louange et au registre poétique.
- source_word: מְדֻבָּר
  choice: sont dites
  rationale: Le participe pual de דבר exprime ce qui est dit ou proclamé. L’accord au pluriel avec נִכְבָּדוֹת donne naturellement « sont dites » en français.
- source_word: בָּךְ
  choice: à ton sujet
  rationale: Avec le verbe de parole, la préposition ב peut désigner ce dont on parle, mais elle peut aussi se comprendre localement. « À ton sujet » rend clairement le sens contextuel de paroles louangeuses concernant Sion, tout en signalant l’autre lecture en note.
- source_word: עִיר הָאֱלֹהִים
  choice: cité de Dieu
  rationale: La chaîne construite signifie « cité de Dieu ». « Cité » maintient le registre poétique et l’expression fonctionne ici comme une apostrophe en apposition au pronom de deuxième personne.
- source_word: סֶלָה
  choice: Sélah
  rationale: La fonction exacte de ce terme liturgique ou musical demeure incertaine; il est donc translittéré plutôt qu’interprété.
