source:
  edition: WLC
  text: וּֽ/לֲ/צִיּ֨וֹן יֵאָמַ֗ר אִ֣ישׁ וְ֭/אִישׁ יֻלַּד בָּ֑/הּ וְ/ה֖וּא יְכוֹנְנֶ֣/הָ עֶלְיֽוֹן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/005.yaml
  text: And of Zion it will be said[a], “This one and that one were born in her,” and the Most High himself will establish her.
translation:
  language: fr
  text: 'Et l’on dira de Sion : « Celui-ci comme celui-là[a] est né en elle », et le Très-Haut lui-même l’affermira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Homme après homme est né en elle. » L’hébreu répète le mot « homme » pour exprimer une idée distributive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: Et l’on dira de Sion
  rationale: La préposition ל introduit ici le thème; « de Sion » est naturel en français, tandis que ו maintient la continuité poétique par « Et ».
- source_word: יֵאָמַר
  choice: l’on dira
  rationale: Le niphal inaccompli peut s’exprimer par une tournure impersonnelle au futur; « l’on dira » est plus idiomatique que le passif en français.
- source_word: אִישׁ וְאִישׁ
  choice: Celui-ci comme celui-là
  rationale: La répétition a une valeur distributive et désigne les personnes individuellement; cette formule conserve cette portée sans introduire inutilement le genre masculin dans la traduction.
- source_word: יֻלַּד בָּהּ
  choice: est né en elle
  rationale: Le verbe hébreu est au singulier, en accord avec l’expression distributive; « en elle » conserve la personnification féminine de Sion.
- source_word: וְהוּא
  choice: et ... lui-même
  rationale: Le pronom indépendant est emphatique; « lui-même » rend cette insistance en français.
- source_word: יְכוֹנְנֶהָ
  choice: l’affermira
  rationale: Le verbe כון exprime ici l’idée de rendre ferme, stable et assuré; « affermira » convient au contexte poétique et conserve le pronom féminin renvoyant à Sion.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: « Le Très-Haut » est le titre divin français traditionnel, clair et actuel.
theological_decisions:
- issue: Référent du pronom emphatique וְהוּא associé à עֶלְיוֹן
  choice: « le Très-Haut lui-même » désigne Dieu comme celui qui affermit Sion
  alternative: « et lui, le Très-Haut, l’affermira »
  rationale: Cette formulation préserve l’emphase hébraïque et attribue l’action au Très-Haut sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La personnification de Sion est maintenue par « en elle » et « l’affermira »; le rythme poétique et l’ambiguïté distributive de l’hébreu sont préservés.
