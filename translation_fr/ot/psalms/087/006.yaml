  text: יְֽהוָ֗ה יִ֭סְפֹּר בִּ/כְת֣וֹב עַמִּ֑ים זֶ֖ה יֻלַּד שָׁ֣ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: fr
  text: 'Yahweh dénombrera, lorsqu’il inscrira les peuples : « Celui-ci est né là[a]. » Sélah'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon le contexte, « en elle », c’est-à-dire en Sion, mentionnée dans les versets environnants.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: יִסְפֹּר
  choice: comptera
  rationale: Conserve le sens premier du qal de ספר, « compter, dénombrer », tandis que la proposition suivante précise le contexte d’inscription.
- source_word: בִּכְתוֹב
  choice: lorsqu’il inscrira
  rationale: La préposition ב avec l’infinitif construit a ici une valeur temporelle. « Inscrire » rend naturellement l’idée d’enregistrement dans un registre.
- source_word: עַמִּים
  choice: les peuples
  rationale: Rend le pluriel sans réduire le terme aux seules entités politiques que pourrait suggérer « nations ».
- source_word: זֶה
  choice: Celui-ci
  rationale: Représente le démonstratif masculin singulier sans ajouter un nom absent de l’hébreu.
- source_word: יֻלַּד
  choice: est né
  rationale: Rend directement le passif de ילד. Le passé composé convient naturellement à la déclaration consignée dans le registre.
- source_word: שָׁם
  choice: là-bas
  rationale: Préserve la forme adverbiale hébraïque et son renvoi contextuel à Sion, sans remplacer l’adverbe par un complément explicite.
- source_word: סֶלָה
  choice: Sélah
  rationale: Translittère le terme liturgique ou musical dont la portée exacte demeure incertaine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le nom personnel est conservé sous une translittération largement reconnue, plutôt que remplacé par un titre.
- issue: Explicitation du lieu désigné par שָׁם
  choice: là-bas
  alternative: en elle / à Sion
  rationale: Le contexte désigne Sion, mais l’hébreu emploie simplement un adverbe. La traduction maintient cette formulation et réserve l’explicitation à une note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image du dénombrement et de l’inscription dans un registre, ainsi que l’ambiguïté référentielle de l’adverbe שָׁם.
