  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/001.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
translation:
  language: fr
  text: 'Des fils de Coré[a] : psaume, chant. Son fondement est dans les montagnes saintes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour les fils de Coré » ; la tournure peut indiquer une destination ou une association plutôt qu’une attribution directe.
    reason: lexical_alternative
  - marker: b
    text: Le possesseur n’est pas nommé en hébreu. « Son » peut renvoyer à Dieu ou, implicitement, à Sion ou Jérusalem.
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: Des fils de Coré
  rationale: Dans les titres de psaumes, le préfixe ל peut marquer l’attribution ou l’association. « Des fils de Coré » est concis et laisse ouverte la question d’une composition par eux ou destinée à leur groupe.
- source_word: מִזְמוֹר שִׁיר
  choice: Psaume, chant
  rationale: Les deux désignations de genre sont conservées sans les fondre en une seule. « Psaume » et « chant » sont les équivalents français usuels et directs.
- source_word: יְסוּדָתוֹ
  choice: Son fondement
  rationale: Le nom désigne un fondement, et le suffixe pronominal masculin singulier n’a pas d’antécédent explicite dans ce verset. En français, « son » conserve naturellement l’ambiguïté entre Dieu et un lieu implicite tel que Sion.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: sur les montagnes saintes
  rationale: La préposition ב peut exprimer la localisation « dans » ou « sur ». Avec des montagnes comme lieu d’assise d’un fondement, « sur » est le tour français le plus naturel. קֹדֶשׁ qualifie ici les montagnes comme saintes.
theological_decisions:
- issue: Référent du suffixe dans יְסוּדָתוֹ
  choice: Conserver « Son fondement » sans nommer le possesseur.
  alternative: « Le fondement de Sion » ou « Il l’a fondée »
  rationale: L’hébreu ne donne aucun antécédent explicite dans le verset. La formulation retenue préserve donc la tension entre une référence possible à Dieu et une référence implicite à Sion ou Jérusalem.
translation_notes:
  register: Français moderne, sobre et poétique. Le titre garde ses deux termes de genre, tandis que la ponctuation les relie naturellement. « Son fondement » maintient l’ambiguïté du texte source sans explicitation confessionnelle.
