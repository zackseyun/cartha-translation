  text: וְ/שָׁרִ֥ים כְּ/חֹלְלִ֑ים כָּֽל מַעְיָנַ֥/י בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/007.yaml
  text: Singers and dancers alike say[b][a], “All my springs are in you.”
translation:
  language: fr
  text: 'Chanteurs comme danseurs[a] :

    « Toutes mes sources sont en toi. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « joueurs de flûte » au lieu de « danseurs ». Le terme hébreu est traditionnellement compris comme désignant ceux qui dansent ou tournoient, mais un sens lié à un instrument de musique a aussi été proposé.
    reason: lexical_alternative
  - marker: b
    text: « Toutes mes sources sont en toi » est une image poétique; elle peut évoquer toutes les sources de vie du locuteur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁרִים
  choice: Chanteurs
  rationale: Le participe est compris à partir du verbe שׁיר, « chanter ». La lecture « princes », possible avec les mêmes consonnes dans d’autres contextes, convient moins bien au parallèle avec les danseurs.
- source_word: כְּחֹלְלִים
  choice: et danseurs
  rationale: Le terme est vraisemblablement rattaché au sens « danser, tournoyer ». Dans cette formulation poétique très condensée, la préposition כְּ associe les danseurs aux chanteurs; « et danseurs » exprime naturellement en français leur participation commune. La possibilité « joueurs de flûte » est signalée en note.
- source_word: כָּל
  choice: Toutes
  rationale: Le féminin pluriel s’accorde en français avec « sources » et rend la totalité exprimée par כָּל.
- source_word: מַעְיָנַי
  choice: mes sources
  rationale: מַעְיָן désigne une source ou une fontaine. « Sources » conserve à la fois l’image concrète de l’eau jaillissante et sa portée métaphorique, sans imposer une interprétation.
- source_word: בָּךְ
  choice: sont en toi
  rationale: La préposition בְּ est rendue par « en ». Le pronom féminin singulier s’adresse à Sion; le verbe « sont », sous-entendu dans la phrase nominale hébraïque, est nécessaire en français.
theological_decisions:
- issue: Portée métaphorique de « mes sources » dans l’adresse à Sion
  choice: 'Conserver l’image : « Toutes mes sources sont en toi. »'
  alternative: « Toutes les sources de ma vie viennent de toi » ou « Toutes mes bénédictions sont en toi »
  rationale: Le verset présente Sion comme lieu d’appartenance et source de vie, mais ne précise pas la portée exacte de l’image. La traduction conserve donc sa tension poétique et théologique sans la transformer en explication doctrinale.
- issue: Verbe de parole absent dans l’hébreu
  choice: Ajouter « disent ensemble » pour rendre intelligible le lien entre les groupes et la déclaration qui suit
  alternative: 'Conserver une juxtaposition sans verbe : « Chanteurs et danseurs : Toutes mes sources sont en toi »'
  rationale: L’hébreu est extrêmement condensé et ne comporte pas de verbe explicite de parole. L’ajout contextuel donne une phrase française naturelle, tandis que « ensemble » rend l’association des deux groupes sans attribuer un contenu doctrinal supplémentaire.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste concise; « disent ensemble » explicite sobrement la relation implicite dans l’hébreu. Les notes préservent les principales ambiguïtés lexicales et métaphoriques.
