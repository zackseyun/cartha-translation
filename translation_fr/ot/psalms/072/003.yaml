id: PSA.72.3
reference: Psalms 72:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשְׂא֤וּ הָרִ֓ים שָׁ֘ל֥וֹם לָ/עָ֑ם וּ֝/גְבָע֗וֹת בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/003.yaml
  text: May the mountains bring peace to the people[a], and the hills[c][b], in righteousness.
translation:
  language: fr
  text: 'Que les montagnes apportent la paix au peuple[a],

    et les collines, par la justice[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour le peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans la justice ». Le mot traduit par « justice » peut aussi désigner la droiture.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: apportent
  rationale: Le verbe נָשָׂא signifie littéralement « porter » ou « soulever ». Avec les montagnes pour sujet et la paix pour objet, « apportent » exprime naturellement en français l’image poétique. L’imparfait hébreu est rendu comme un souhait par « Que… » dans le contexte de prière du psaume.
- source_word: הָרִים
  choice: les montagnes
  rationale: Traduction directe du pluriel défini, conservant le premier terme du parallélisme poétique.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: שָׁלוֹם englobe la paix, le bien-être et la prospérité. « La paix » demeure ici le choix le plus clair, sans exclure les nuances plus larges du terme hébreu.
- source_word: לָעָם
  choice: au peuple
  rationale: La préposition ל peut marquer la destination ou le bénéficiaire. « Au peuple » convient à l’image d’une paix apportée jusqu’à lui ; « pour le peuple » reste possible.
- source_word: וּגְבָעוֹת
  choice: et les collines
  rationale: Le terme parallèle à « montagnes » est conservé, ainsi que la conjonction explicite.
- source_word: בִּצְדָקָה
  choice: par la justice
  rationale: La préposition ב peut indiquer le moyen ou la manière. « Par la justice » donne une syntaxe française naturelle tout en maintenant le lien étroit entre paix et justice. Une note conserve la possibilité plus formelle « dans la justice » et la nuance de « droiture » portée par צְדָקָה.
theological_decisions:
- issue: Valeur de l’imparfait dans une prière royale
  choice: 'Souhait ou requête : « Que les montagnes apportent »'
  alternative: 'Annonce au futur : « Les montagnes apporteront »'
  rationale: Dans le cadre de la prière ou bénédiction du Psaume 72, l’imparfait exprime plus probablement un souhait qu’une simple prédiction.
- issue: Fonction de בִּצְדָקָה dans le second membre
  choice: 'Complément de moyen ou de manière : « par la justice »'
  alternative: 'Objet parallèle sous-entendu : « les collines apportent la justice »'
  rationale: Le ב prépositionnel est explicitement présent dans le texte massorétique. Le conserver comme préposition évite de transformer sans nécessité « justice » en objet direct, tout en laissant ouverte la relation elliptique avec le verbe du premier membre.
translation_notes:
  register: Français international moderne, poétique et digne. L’ellipse du second membre est conservée afin de respecter la concision et l’ambiguïté syntaxique de l’hébreu ; la ponctuation permet de la lire naturellement.
