source:
  edition: WLC
  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: fr
  text: Devant lui, les habitants du désert se prosterneront[a], et ses ennemis lécheront la poussière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « les tribus du désert ». Le terme hébreu peut désigner les habitants des régions désertiques; dans certains contextes, il désigne des créatures du désert.'
    reason: alternative lexicale
lexical_decisions:
- source_word: לְפָנָיו
  choice: Devant lui
  rationale: Cette expression rend naturellement l’idée de présence et de soumission face au roi.
- source_word: יִכְרְעוּ
  choice: se prosterneront
  rationale: Le verbe désigne le fait de s’agenouiller ou de s’incliner; « se prosterner » convient au contexte de soumission royale.
- source_word: צִיִּים
  choice: les habitants du désert
  rationale: Le terme est difficile et peut désigner des êtres vivant dans les régions désertiques. Le parallélisme avec « ses ennemis » favorise ici un référent humain, sans préciser indûment une ethnie ou un mode de vie.
- source_word: וְאֹיְבָיו
  choice: et ses ennemis
  rationale: Équivalent direct et naturel du nom avec suffixe possessif masculin singulier.
- source_word: עָפָר
  choice: la poussière
  rationale: Ce choix conserve l’image concrète d’humiliation et de défaite totale.
- source_word: יְלַחֵכוּ
  choice: lécheront
  rationale: La traduction directe préserve la vigueur de la métaphore poétique.
theological_decisions:
- issue: Nature de l’image de soumission
  choice: Conserver l’image poétique de la prosternation et de la poussière léchée.
  alternative: Paraphraser en termes abstraits de défaite ou de soumission politique.
  rationale: Le texte évoque la conquête et l’humiliation devant le roi au moyen d’images conventionnelles, sans imposer que chaque geste soit compris comme une description littérale.
translation_notes:
  register: Français international moderne, clair et digne. « Se prosterner » maintient le registre royal et poétique, tandis que « lécher la poussière » conserve l’image vive de l’hébreu.
