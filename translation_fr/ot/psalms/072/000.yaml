  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: fr
  text: 'De Salomon.[a]


    Ô Dieu, donne au roi tes jugements,

    et au fils du roi ta justice.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour Salomon » ou « À Salomon » dans la suscription.
    reason: alternative_reading
  - marker: b
    text: « Ta justice » peut aussi se traduire par « ton équité » ou « ta droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  choice: tes jugements
  rationale: Le pluriel hébreu est conservé. Ici, il désigne la capacité ou les décisions justes venant de Dieu, confiées au roi.
- source_word: צִדְקָתְךָ
  choice: ta justice
  rationale: « Justice » rend naturellement צְדָקָה dans ce contexte royal, tout en conservant l'idée de droiture conforme à Dieu.
- source_word: לִשְׁלֹמֹה
  choice: De Salomon
  rationale: La préposition ל dans les suscriptions peut signaler l'auteur, le destinataire ou le sujet; la formulation principale traditionnelle reste concise, et l'ambiguïté est indiquée en note.
theological_decisions:
- issue: Rapport entre la justice divine et l'exercice royal
  choice: « donne au roi tes jugements… ta justice »
  alternative: « donne au roi ton droit… ton équité »
  rationale: La traduction garde le parallélisme et présente la justice du roi comme reçue de Dieu, sans préciser davantage la nature de cette transmission.
translation_notes:
  register: Français moderne, digne et accessible. Le vocatif « Ô Dieu » convient au registre poétique du psaume. Le parallélisme hébreu et le pluriel « tes jugements » sont conservés.
