id: PSA.72.10
reference: Psalms 72:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: fr
  text: Que les rois de Tarsis et des îles apportent un tribut ! Que les rois de Saba et de Seba présentent des présents !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַרְשִׁישׁ
  choice: Tarsis
  rationale: Translittération française traditionnelle du nom propre, sans préciser une localisation qui demeure discutée.
- source_word: אִיִּים
  choice: îles
  rationale: Le terme désigne couramment des îles ou des régions côtières. « Îles » conserve ici l’image géographique concrète et le parallélisme avec Tarsis.
- source_word: מִנְחָה
  choice: tribut
  rationale: Dans un contexte royal et international, le don apporté au roi a valeur de tribut, plutôt que de simple offrande cultuelle.
- source_word: יָשִׁיבוּ
  choice: apportent
  rationale: Le verbe signifie littéralement « ramener/rendre »; avec « tribut », le français naturel demande « apporter », sans imposer l’idée qu’un tribut antérieur serait restitué.
- source_word: שְׁבָא
  choice: Saba
  rationale: Forme française conventionnelle du royaume associé au sud de l’Arabie.
- source_word: סְבָא
  choice: Seba
  rationale: Translittération qui maintient la distinction du texte hébreu entre Sheba/Saba et Seba.
- source_word: אֶשְׁכָּר
  choice: présents
  rationale: Désigne des dons ou cadeaux remis à un souverain; « présents » convient au registre royal et évite de confondre avec le tribut du premier hémistiche.
- source_word: יַקְרִיבוּ
  choice: présentent
  rationale: Le verbe peut signifier « faire approcher » ou « offrir ». « Présenter » rend naturellement l’action d’apporter des dons devant le roi, sans lui donner nécessairement un sens sacrificiel.
theological_decisions:
- issue: Valeur modale des formes verbales dans une prière royale
  choice: Que… apportent / Que… présentent
  alternative: Les rois… apporteront / présenteront
  rationale: Le contexte du psaume soutient des souhaits ou requêtes adressés à Dieu. Le subjonctif français préserve cette valeur sans transformer la parole en prédiction catégorique.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme poétique est conservé; les deux types de dons sont distingués par « tribut » et « présents ».
