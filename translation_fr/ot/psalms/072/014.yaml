  text: מִ/תּ֣וֹךְ וּ֭/מֵ/חָמָס יִגְאַ֣ל נַפְשָׁ֑/ם וְ/יֵיקַ֖ר דָּמָ֣/ם בְּ/עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/014.yaml
  text: From oppression and violence he will redeem their life[b][a], and their blood will be precious in his eyes.
translation:
  language: fr
  text: Il les délivrera[a] de l’oppression et de la violence, et leur sang sera précieux à ses yeux.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte hébreu a « leur vie » (au singulier collectif) ; le mot peut aussi désigner la personne, l’être ou l’âme, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Le singulier « il/ses » renvoie le plus naturellement au roi dans le contexte du psaume, tout en faisant écho à la manière dont Dieu lui-même délivre les opprimés et prend soin d’eux.
    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ וּמֵחָמָס
  choice: de l’oppression et de la violence
  rationale: מִתּוֹךְ exprime ici la délivrance hors d’une situation oppressive, tandis que חָמָס désigne la violence ou l’injustice brutale. En français, un seul « de » régit naturellement les deux termes.
- source_word: יִגְאַל
  choice: il délivrera
  rationale: Le verbe גאל évoque l’action de reprendre, racheter ou délivrer en qualité de défenseur. « Délivrera » est naturel dans ce contexte et conserve l’idée d’une intervention libératrice, sans suggérer nécessairement un paiement.
- source_word: נַפְשָׁם
  choice: les
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l’être lui-même. Le pronom objet « les » rend naturellement en français le sens personnel et collectif du terme dans ce contexte.
- source_word: וְיֵיקַר
  choice: aura du prix
  rationale: Le verbe יקר exprime ce qui est précieux ou tenu en haute valeur. « Aura du prix » garde cette idée dans une tournure française digne et idiomatique.
- source_word: דָּמָם
  choice: leur sang
  rationale: La traduction concrète préserve l’image hébraïque du sang versé et affirme que leur vie n’est ni négligeable ni sacrifiable.
- source_word: בְּעֵינָיו
  choice: à ses yeux
  rationale: Cette expression française correspond directement à l’idiome hébreu et indique son appréciation ou son regard.
theological_decisions:
- issue: Référent du sujet et du possessif au singulier
  choice: Les formes « il » et « ses » sont conservées sans nommer explicitement leur référent; dans le contexte immédiat, elles poursuivent le portrait du roi.
  alternative: Y voir une référence directe à Dieu, celui qui délivre et tient la vie des opprimés pour précieuse.
  rationale: Les formes hébraïques au singulier s’accordent naturellement avec le roi qui est le sujet du psaume, mais son action fait écho à la sollicitude rédemptrice de Dieu. La traduction ne tranche pas au-delà du texte.
translation_notes:
  register: Français international moderne, fluide et digne. « Il les délivrera » évite le tour peu naturel « il délivrera leur vie » tout en signalant celui-ci en note. « Aura du prix à ses yeux » conserve l’image et la valeur théologique du texte sans surinterprétation.
