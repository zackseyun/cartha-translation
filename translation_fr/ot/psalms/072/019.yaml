  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: fr
  text: Que son nom glorieux soit béni pour toujours[a], et que sa gloire remplisse toute la terre[b] ! Amen et amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le nom de sa gloire ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la terre entière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Que … soit béni
  rationale: Le participe passif prend ici, dans cette doxologie, la valeur d’un souhait ou d’une bénédiction. Cette tournure française en conserve naturellement la force liturgique.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: son nom glorieux
  rationale: La chaîne construite signifie littéralement « le nom de sa gloire ». « Son nom glorieux » est naturel en français et rend le nom caractérisé par la gloire sans alourdir le texte.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Expression française courante et digne qui communique ici la durée perpétuelle.
- source_word: וְיִמָּלֵא
  choice: et que … remplisse
  rationale: L’imparfait nifal est compris comme jussif dans cette formule doxologique. En présence de la marque du complément d’objet אֶת, la gloire est présentée comme remplissant la terre; la tournure avec « que » conserve la valeur de souhait.
- source_word: כְבוֹדוֹ
  choice: sa gloire
  rationale: « Gloire » convient au contexte doxologique et cosmique tout en préservant le champ biblique habituel de כבוד.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: toute la terre
  rationale: Le syntagme désigne ici la terre dans sa totalité. « Toute la terre » est idiomatique et conserve la portée universelle du verset.
- source_word: אָמֵן וְאָמֵן
  choice: Amen et amen
  rationale: La translittération traditionnelle préserve la double affirmation liturgique et sa cadence solennelle.
theological_decisions:
- issue: Portée de הָאָרֶץ
  choice: la terre entière, au sens universel
  alternative: tout le pays, dans un sens localisé
  rationale: Le sommet doxologique du psaume et l’image de la gloire divine remplissant la totalité désignée favorisent la portée cosmique, sans restreindre l’expression au pays d’Israël.
translation_notes:
  register: Français international moderne, solennel et accessible. La structure en deux souhaits coordonnés conserve la cadence doxologique de l’hébreu. Les points d’exclamation marquent la bénédiction et la prière sans modifier leur contenu.
