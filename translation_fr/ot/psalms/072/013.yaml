  text: יָ֭חֹס עַל דַּ֣ל וְ/אֶבְי֑וֹן וְ/נַפְשׁ֖וֹת אֶבְיוֹנִ֣ים יוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/013.yaml
  text: He will have compassion on the poor and needy[a], and he will save the lives of the needy.
translation:
  language: fr
  text: Il aura compassion du faible et du démuni, et il sauvera la vie[a] des démunis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : les âmes. Le mot hébreu peut désigner la vie, l’être, la personne ou l’âme selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחֹס
  choice: aura compassion
  rationale: Dans ce contexte, le verbe exprime la pitié ou la sollicitude envers des personnes vulnérables. « Aura compassion » convient au registre poétique et au parallèle avec l’action de sauver.
- source_word: דַּל
  choice: faible
  rationale: Le terme peut désigner une personne pauvre, faible ou socialement sans pouvoir. « Faible » préserve sa distinction avec אֶבְיוֹן.
- source_word: אֶבְיוֹן / אֶבְיוֹנִים
  choice: démuni / démunis
  rationale: Le mot désigne ceux qui sont dans le besoin. « Démuni » est naturel en français moderne et maintient la nuance par rapport à דַּל.
- source_word: נַפְשׁוֹת
  choice: la vie
  rationale: נֶפֶשׁ désigne souvent la vie, la personne ou l’être lui-même. En français, le singulier collectif « la vie des démunis » est plus idiomatique que « les vies » et s’accorde avec le contexte de délivrance concrète.
- source_word: יוֹשִׁיעַ
  choice: il sauvera
  rationale: Le hiphil de ישׁע signifie sauver ou délivrer. « Sauvera » rend directement le verbe et conserve ses résonances bibliques sans exclure ici un secours concret.
theological_decisions:
- issue: Sens anthropologique de נַפְשׁוֹת
  choice: la vie des démunis
  alternative: les âmes des démunis ; les personnes démunies
  rationale: Le contexte de protection royale favorise le sens de « vie ». La note conserve toutefois la possibilité lexicale d’« âme », sans imposer au texte une distinction doctrinale entre corps et âme.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est préservé par la distinction entre « faible » et « démuni », tandis que « la vie des démunis » privilégie une formulation française naturelle.
