  yaml_path: translation/ot/psalms/072/002.yaml
  text: May he judge your people with righteousness[b][a], and your afflicted ones with justice.
translation:
  language: fr
  text: Qu’il juge[a] ton peuple avec justice, et tes affligés[b] avec équité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il jugera ton peuple avec justice. » L’imparfait hébreu peut exprimer ici soit un souhait, soit une action future.'
    reason: alternative_reading
  - marker: b
    text: Le terme hébreu peut aussi se traduire par « tes pauvres », « tes nécessiteux » ou « tes opprimés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדִין
  choice: Qu’il juge
  rationale: L’imparfait qal à la 3e personne du masculin singulier peut avoir ici une valeur volitive ou future. Dans le cadre de la prière royale du psaume, « Qu’il juge » rend naturellement la demande, sans effacer l’autre lecture possible, signalée en note.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: Le nom עַם avec suffixe de 2e personne du masculin singulier signifie directement « ton peuple » et conserve sa valeur collective.
- source_word: בְצֶדֶק
  choice: avec justice
  rationale: צֶדֶק exprime ici la conformité à ce qui est droit dans l’exercice du jugement. « Avec justice » est naturel en français moderne et convient au rôle royal.
- source_word: וַעֲנִיֶּיךָ
  choice: et tes malheureux
  rationale: עָנִי peut désigner les pauvres, les affligés ou les opprimés. « Les malheureux » garde une portée assez large, sans limiter le terme à la pauvreté économique.
- source_word: בְמִשְׁפָּט
  choice: avec équité
  rationale: מִשְׁפָּט désigne ici un jugement juste, le droit appliqué. « Avec équité » évite une répétition lourde de « justice » tout en conservant le parallélisme sémantique.
theological_decisions:
- issue: Valeur volitive ou prédictive de יָדִין dans la prière royale
  choice: Qu’il juge
  alternative: Il jugera
  rationale: Le début du Psaume 72 a la forme d’une prière adressée à Dieu en faveur du roi, ce qui favorise la nuance de souhait ou de demande. La valeur future demeure grammaticalement possible et est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme hébreu est maintenu par « justice » et « équité », tandis que les notes préservent l’ambiguïté verbale et l’étendue sémantique de עָנִי.
