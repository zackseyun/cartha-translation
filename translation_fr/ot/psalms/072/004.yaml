source:
  edition: WLC
  text: יִשְׁפֹּ֤ט עֲֽנִיֵּי עָ֗ם י֭וֹשִׁיעַ לִ/בְנֵ֣י אֶבְי֑וֹן וִֽ/ידַכֵּ֣א עוֹשֵֽׁק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/004.yaml
  text: May he judge the poor of the people[a], save the children of the needy, and crush the oppressor.
translation:
  language: fr
  text: Qu’il rende justice aux pauvres du peuple[a], qu’il sauve les enfants des démunis et qu’il écrase l’oppresseur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il rendra justice aux pauvres du peuple, sauvera les enfants des démunis et écrasera l’oppresseur. » Dans ce contexte, les verbes hébreux à l’inaccompli peuvent exprimer soit l’avenir, soit une prière ou un souhait.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Qu’il rende justice
  rationale: Le qal inaccompli de שׁפט peut exprimer ici soit l’avenir, soit un souhait. « Rendre justice » communique naturellement en français l’exercice favorable de la justice royale envers les pauvres, sans suggérer qu’ils sont les accusés.
- source_word: עֲנִיֵּי עָם
  choice: aux pauvres du peuple
  rationale: עֲנִיִּים désigne les pauvres, les affligés ou les opprimés. Le parallélisme avec les démunis favorise ici le sens socioéconomique, tandis que « du peuple » conserve la relation construite de l’hébreu.
- source_word: יוֹשִׁיעַ
  choice: qu’il sauve
  rationale: Le hiphil de ישׁע exprime l’action de sauver ou de délivrer. « Sauver » garde toute la force du secours sans préciser indûment le moyen employé.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: les enfants des démunis
  rationale: בני a ici une portée collective et ne se limite pas aux garçons. Le singulier collectif אֶבְיוֹן est rendu naturellement par le pluriel français « des démunis », qui préserve aussi une nuance distincte de « pauvres ».
- source_word: וִידַכֵּא
  choice: et qu’il écrase
  rationale: Dans ce contexte, דכא évoque le fait de broyer ou d’abattre. « Écraser » conserve la vigueur de l’image et le contraste entre la délivrance des faibles et le jugement de leur oppresseur.
- source_word: עוֹשֵׁק
  choice: l’oppresseur
  rationale: Le participe de עשׁק désigne celui qui opprime, exploite ou extorque. « L’oppresseur » est concis, courant et rend bien cette caractérisation habituelle.
theological_decisions:
- issue: Valeur modale des verbes inaccomplis dans l’ensemble du verset
  choice: Formulation optative sous forme de prière (« Qu’il… »)
  alternative: Futur simple (« Il rendra justice…, sauvera… et écrasera… »)
  rationale: Le cadre de prière royale du psaume permet de comprendre les inaccomplis comme des souhaits ou des demandes. La note conserve toutefois la lecture future également permise par l’hébreu, sans transformer l’ambiguïté en prédiction certaine.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme ternaire et le parallélisme sont maintenus. « Rendre justice » évite l’ambiguïté française de « juger les pauvres », qui pourrait laisser entendre une condamnation, tout en exprimant la fonction judiciaire du roi.
