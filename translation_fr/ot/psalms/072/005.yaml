  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: fr
  text: Qu’ils te craignent[b] aussi longtemps que dure le soleil, et tant que subsiste la lune[a], de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec le soleil et devant la lune » ; ces expressions poétiques évoquent une durée aussi longue que celle du soleil et de la lune.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « Ils te craindront […] de génération en génération. » La forme hébraïque peut exprimer soit un souhait, soit une affirmation concernant l’avenir.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Qu’ils te craignent
  rationale: Le verbe ירא signifie « craindre » ou « révérer ». La tournure française conserve le noyau lexical et rend ici la valeur probablement volitive de la forme hébraïque, sans exclure une lecture au futur.
- source_word: עִם שָׁמֶשׁ
  choice: aussi longtemps que dure le soleil
  rationale: Littéralement « avec le soleil » ; dans ce parallélisme poétique, l’expression marque la durée. Cette formulation explicite naturellement l’idiome en français.
- source_word: וְלִפְנֵי יָרֵחַ
  choice: et tant que subsiste la lune
  rationale: לִפְנֵי signifie littéralement « devant/en présence de ». En parallèle avec « avec le soleil », la formule exprime ici une durée liée à la permanence de la lune ; une traduction idiomatique évite l’obscur « devant la lune ».
- source_word: דּוֹר דּוֹרִים
  choice: de génération en génération
  rationale: La construction singulier-pluriel souligne la succession continue des générations. La locution française est naturelle, poétique et garde cette force répétitive.
theological_decisions:
- issue: Référent de « te » et nature de la crainte dans un psaume royal
  choice: Conserver l’adresse directe « te » et le verbe « craindre », sans préciser si le destinataire est le roi, le souverain davidique idéal ou Dieu dans le cadre de la royauté.
  alternative: Traduire explicitement par « qu’ils révèrent le roi » ou « qu’ils craignent Dieu ».
  rationale: L’hébreu laisse le destinataire dans l’adresse directe et permet plusieurs niveaux de lecture dans le contexte royal. La traduction ne tranche pas une tension que le texte conserve.
- issue: Valeur modale de יִירָאוּךָ
  choice: 'Lire la forme comme un souhait ou une prière : « Qu’ils te craignent » ; signaler l’indicatif futur en note.'
  alternative: « Ils te craindront »
  rationale: Le contexte permet une nuance volitive, mais la morphologie peut aussi porter une assertion tournée vers l’avenir. La note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme solaire et lunaire est rendu de manière idiomatique, tandis que les formulations hébraïques littérales sont conservées en note. Tous les marqueurs de notes figurent dans le texte.
