  text: יִֽפְרַח בְּ/יָמָ֥י/ו צַדִּ֑יק וְ/רֹ֥ב שָׁ֝ל֗וֹם עַד בְּלִ֥י יָרֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: fr
  text: De son temps, le juste[a] fleurira, et la paix[b] abondera jusqu’à ce qu’il n’y ait plus de lune[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le juste » peut désigner collectivement les personnes justes ou un juste en particulier, peut-être le roi lui-même.
    reason: alternative_reading
  - marker: b
    text: Le mot hébreu traduit par « paix » peut aussi évoquer le bien-être, l’intégrité ou la prospérité.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « jusqu’à ce qu’il n’y ait plus de lune » ; image poétique exprimant une très longue durée ou une durée sans fin.'
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: fleurira
  rationale: Le verbe פרח évoque le fait de bourgeonner, de fleurir et, au sens figuré, de prospérer. « Fleurira » conserve l’image végétale de l’hébreu tout en restant naturel en français.
- source_word: בְּיָמָיו
  choice: De son temps
  rationale: Cette expression française rend naturellement l’hébreu « en ses jours » et désigne la période où vit ou règne le personnage évoqué, sans expliciter davantage que le texte source.
- source_word: צַדִּיק
  choice: le juste
  rationale: Le singulier hébreu est conservé. En français, « le juste » peut avoir une valeur collective ou désigner un individu, ce qui préserve l’ambiguïté du texte.
- source_word: וְרֹב שָׁלוֹם
  choice: et la paix abondera
  rationale: L’hébreu présente une proposition nominale, littéralement « et abondance de paix ». L’ajout du verbe « abondera » produit une phrase française fluide tout en gardant l’idée d’une paix abondante.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le sens principal dans ce contexte royal, tandis que la note conserve les nuances plus larges de bien-être, d’intégrité et de prospérité.
- source_word: עַד בְּלִי יָרֵחַ
  choice: jusqu’à ce qu’il n’y ait plus de lune
  rationale: Cette formulation reste proche de l’expression hébraïque et maintient son image poétique d’une durée extrême ou sans fin.
theological_decisions:
- issue: Portée de צַדִּיק dans un psaume royal
  choice: Conserver le singulier générique « le juste »
  alternative: « Les justes », au sens collectif, ou « le juste » comme individu particulier, éventuellement le roi
  rationale: Le substantif adjectival singulier peut représenter collectivement les personnes justes, mais peut aussi viser un individu. Le français permet de préserver cette tension sans imposer une identification messianique précise.
translation_notes:
  register: Français international moderne, poétique et digne. « De son temps » évite le calque peu naturel « en ses jours ». « Fleurira » maintient la métaphore végétale, et la syntaxe demeure accessible à un lectorat général.
