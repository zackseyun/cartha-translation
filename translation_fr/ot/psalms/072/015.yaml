source:
  edition: WLC
  text: וִ/יחִ֗י וְ/יִתֶּן ל/וֹ֮ מִ/זְּהַ֪ב שְׁ֫בָ֥א וְ/יִתְפַּלֵּ֣ל בַּעֲד֣/וֹ תָמִ֑יד כָּל הַ֝/יּ֗וֹם יְבָרֲכֶֽ/נְהֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: fr
  text: Qu’il vive ! Qu’on lui donne de l’or de Saba[a] ! Qu’on prie sans cesse pour lui[b] ; tout le jour, qu’on le bénisse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et qu’il lui donne de l’or de Saba ». Le verbe hébreu est actif, mais le sujet qui donne n’est pas précisé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, plus littéralement : « et qu’il prie pour lui ». Ici encore, le sujet n’est pas identifié. Il en va de même dans la dernière proposition : « qu’il le bénisse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Qu’il vive !
  rationale: Le jussif qal exprime ici un souhait ou une bénédiction. Cette formulation française en garde clairement la valeur volitive.
- source_word: וְיִתֶּן לוֹ
  choice: Qu’on lui donne
  rationale: Le verbe hébreu est actif à la troisième personne masculine du singulier, mais son sujet n’est pas nommé. Le pronom indéfini « on » conserve naturellement cette indétermination en français.
- source_word: מִזְּהַב שְׁבָא
  choice: de l’or de Saba
  rationale: La préposition מִן marque ici la provenance ou la part prélevée ; « de l’or de Saba » est naturel et conserve l’association géographique.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: Qu’on prie ... pour lui
  rationale: Le hitpael de פלל suivi de בְּעַד signifie prier pour quelqu’un ou en sa faveur. « On » évite d’attribuer la prière à un sujet précis absent du texte.
- source_word: תָמִיד
  choice: sans cesse
  rationale: L’expression rend l’idée de continuité portée par תָמִיד dans un français poétique courant.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Cette formulation concise conserve le parallélisme poétique et l’étendue temporelle de l’expression hébraïque.
- source_word: יְבָרֲכֶנְהוּ
  choice: qu’on le bénisse
  rationale: Le piel à la troisième personne masculine du singulier avec suffixe objet signifie littéralement « qu’il le bénisse », mais le sujet n’est pas identifié. Le français indéfini « on » préserve cette ouverture.
theological_decisions:
- issue: Référent des souhaits royaux dans le Psaume 72
  choice: Conserver la forme d’une prière ou d’un souhait en faveur du roi sans expliciter une lecture messianique dans le verset.
  alternative: Présenter directement ces paroles comme une prophétie concernant le Messie.
  rationale: Le sens immédiat est celui de souhaits adressés au roi davidique. Cette traduction ne ferme toutefois pas la possibilité d’une lecture canonique ou messianique plus large.
translation_notes:
  register: Français international moderne, digne et poétique. Les exclamations rendent la succession des souhaits jussifs ; l’emploi de « on » maintient l’indétermination des sujets sans alourdir le verset.
