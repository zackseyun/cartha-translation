source:
  edition: WLC
  text: יְהִ֤י שְׁמ֨/וֹ לְֽ/עוֹלָ֗ם לִ/פְנֵי שֶׁמֶשׁ֮ ינין שְׁ֫מ֥/וֹ וְ/יִתְבָּ֥רְכוּ ב֑/וֹ כָּל גּוֹיִ֥ם יְאַשְּׁרֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: fr
  text: Que son nom subsiste pour toujours ! Devant le soleil[a], que son nom se perpétue[b] ! Que toutes les nations soient bénies en lui[c] ! Qu’elles le disent heureux !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « aussi longtemps que le soleil ». L’hébreu dit plus littéralement : « devant le soleil ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu est rare ; il peut aussi évoquer le fait de fleurir, de croître ou de se propager.
    reason: lexical_alternative
  - marker: c
    text: Ou « Que toutes les nations se bénissent par lui ». La forme verbale hébraïque peut être comprise dans un sens réfléchi.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Que son nom subsiste pour toujours
  rationale: Le jussif exprime un souhait ou une prière. « Subsiste » rend naturellement la durée associée au nom sans réduire celui-ci à la seule réputation.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: Devant le soleil
  rationale: Cette formulation conserve l’image hébraïque et son ambiguïté poétique; le sens temporel probable est indiqué en note.
- source_word: ינין שְׁמוֹ
  choice: que son nom se perpétue
  rationale: Le verbe rare ינין peut évoquer la continuité, la croissance ou la propagation. « Se perpétue » convient au sujet « son nom » tout en laissant entendre sa transmission.
- source_word: וְיִתְבָּרְכוּ בוֹ כָּל גּוֹיִם
  choice: Que toutes les nations soient bénies en lui
  rationale: Le hitpael peut recevoir un sens passif ou réfléchi. La formulation retenue préserve l’écho des promesses patriarcales sans exclure l’autre analyse.
- source_word: יְאַשְּׁרוּהוּ
  choice: Qu’elles le déclarent heureux
  rationale: Le piel de אשר signifie déclarer ou considérer quelqu’un heureux, bienheureux. « Déclarent heureux » est précis, actuel et distinct de ברך, employé juste avant.
theological_decisions:
- issue: Portée royale et messianique
  choice: Conserver le référent royal immédiat ainsi que la résonance messianique possible, sans identification explicite.
  alternative: Limiter le verset au roi historique, ou en faire une prophétie exclusivement messianique.
  rationale: Le langage universel du psaume dépasse la simple louange politique, mais le verset lui-même ne nomme pas directement le Messie. « Toutes les nations soient bénies en lui » maintient cette tension et l’écho de la promesse faite aux patriarches.
- issue: Sens de la bénédiction des nations
  choice: Employer la lecture passive « soient bénies en lui » dans le texte.
  alternative: « Se bénissent par lui » selon une compréhension réfléchie du hitpael.
  rationale: Les deux analyses sont grammaticalement défendables. Le texte principal adopte une formulation française naturelle qui garde la portée théologique de la bénédiction, tandis que la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, poétique et digne. Les quatre propositions optatives sont rendues par « Que… ! ». « Devant le soleil » conserve l’image inhabituelle de l’original; les notes signalent les principales ambiguïtés lexicales et grammaticales.
