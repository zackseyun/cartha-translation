id: PSA.72.11
reference: Psalms 72:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יִשְׁתַּחֲווּ ל֥/וֹ כָל מְלָכִ֑ים כָּל גּוֹיִ֥ם יַֽעַבְדֽוּ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/011.yaml
  text: May all kings bow down before him[a]; may all nations serve him.
translation:
  language: fr
  text: Que tous les rois se prosternent devant lui[a], que toutes les nations le servent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adorent » ; les verbes hébreux traduits par « se prosternent » et « servent » peuvent évoquer aussi bien l’hommage royal que le culte.
    reason: alternative lexicale et préservation de l’ambiguïté théologique
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: Que ... se prosternent
  rationale: Le verbe שׁחה désigne le fait de s’incliner profondément ou de se prosterner. Dans ce psaume royal, « se prosterner » conserve à la fois le geste physique et l’hommage, sans imposer un sens exclusivement cultuel. La forme imperfective est rendue ici par un souhait.
- source_word: לוֹ
  choice: devant lui
  rationale: Avec le verbe « se prosterner », « devant lui » est l’expression française naturelle pour indiquer la personne à qui l’hommage est rendu.
- source_word: כָל מְלָכִים
  choice: tous les rois
  rationale: Traduction directe qui préserve la portée universelle de la soumission royale.
- source_word: כָל גּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici les nations du monde, en parallèle avec « tous les rois ». « Nations » convient mieux que « païens » ou « non-Juifs », qui ajouteraient une nuance étrangère au contexte.
- source_word: יַעַבְדוּהוּ
  choice: que ... le servent
  rationale: עבד signifie fondamentalement « servir » et peut, selon le contexte, inclure le service religieux. « Le servent » maintient cette amplitude politique et religieuse sans la réduire explicitement au culte.
theological_decisions:
- issue: Faut-il employer explicitement le vocabulaire de l’adoration à propos du roi ?
  choice: Conserver le langage plus large de la prosternation et du service.
  alternative: « l’adorent » pour l’un des verbes ou pour les deux
  rationale: Le psaume royal peut viser immédiatement le roi davidique tout en recevant une lecture messianique. Traduire directement par « adorer » trancherait une ambiguïté que l’hébreu laisse ouverte entre hommage royal et culte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme est conservé, avec deux propositions exprimant un souhait. « Se prosternent » reste accessible tout en gardant la force concrète du geste hébreu.
