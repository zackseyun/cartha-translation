  text: יֵ֭רֵד כְּ/מָטָ֣ר עַל גֵּ֑ז כִּ֝/רְבִיבִ֗ים זַרְזִ֥יף אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: fr
  text: Qu’il descende[a] comme la pluie sur l’herbe fauchée[b], comme des averses qui arrosent la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il descendra comme la pluie… » L’imparfait hébreu peut exprimer ici soit un souhait ou une prière, soit une description future.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sur l’herbe coupée ». Certains comprennent ici « sur une toison ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le pays » ou « le sol ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: Qu’il descende
  rationale: L’imparfait de ירד peut exprimer ici un souhait dans le cadre de la prière royale. « Descendre » conserve directement le mouvement de l’hébreu et convient au registre poétique français.
- source_word: כְּמָטָר
  choice: comme la pluie
  rationale: Le préfixe comparatif כ et מָטָר donnent naturellement « comme la pluie ».
- source_word: עַל
  choice: sur
  rationale: Équivalent français direct et idiomatique dans cette image.
- source_word: גֵּז
  choice: l’herbe fauchée
  rationale: Le nom désigne ce qui est coupé ou tondu. Avec la pluie et la terre, l’image agricole de l’herbe fauchée est la plus naturelle, sans exclure entièrement l’interprétation « toison ».
- source_word: כִּרְבִיבִים
  choice: comme des averses
  rationale: רְבִיבִים désigne des pluies ou averses abondantes. « Des averses » maintient le parallélisme sans expliciter excessivement leur intensité.
- source_word: זַרְזִיף
  choice: qui arrosent
  rationale: Cette forme rare évoque l’écoulement ou le ruissellement de la pluie. Une proposition verbale rend l’image avec naturel en français.
- source_word: אָרֶץ
  choice: la terre
  rationale: אָרֶץ peut désigner la terre, le pays ou le sol. « La terre » garde ici l’ampleur et la cadence poétiques.
theological_decisions:
- issue: Valeur de l’imparfait dans le contexte d’une prière royale
  choice: 'Souhait ou prière : « Qu’il descende »'
  alternative: 'Annonce future : « Il descendra »'
  rationale: Le psaume 72 comporte des demandes et des bénédictions en faveur du roi ; l’imparfait se lit donc naturellement comme un souhait. Une note conserve toutefois la possibilité grammaticale d’une description future.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est maintenu, ainsi que l’ambiguïté entre souhait et futur au moyen d’une note.
