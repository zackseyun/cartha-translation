source:
  edition: WLC
  text: כָּלּ֥וּ תְפִלּ֑וֹת דָּ֝וִ֗ד בֶּן יִשָֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: fr
  text: Les prières de David, fils de Jessé, sont terminées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont achevées » ou « ont pris fin ».
    reason: Alternative lexicale pour כָּלּוּ, dont la nuance d’achèvement peut être rendue de plusieurs manières naturelles en français.
lexical_decisions:
- source_word: כָּלּוּ
  choice: sont terminées
  rationale: Le pual accompli, 3e personne du pluriel, de כלה exprime ici l’achèvement, avec « les prières » pour sujet grammatical. « Sont terminées » est naturel et concis en français tout en conservant la valeur conclusive de l’hébreu.
- source_word: תְפִלּוֹת
  choice: Les prières
  rationale: Pluriel courant de תְּפִלָּה. « Prières » en donne le sens lexical direct et convient à la fonction conclusive probable de cette phrase.
- source_word: דָּוִד
  choice: David
  rationale: Forme française traditionnelle et usuelle de ce nom propre biblique.
- source_word: בֶּן יִשָׁי
  choice: fils de Jessé
  rationale: La chaîne construite identifie David par sa filiation. « Fils de Jessé » est la formulation française naturelle et transparente.
theological_decisions:
- issue: 'Fonction du verset : colophon ou note éditoriale, plutôt que partie intégrante de la prière du psaume'
  choice: Traduire comme une déclaration simple marquant la fin des prières de David
  alternative: Le présenter explicitement comme une note éditoriale ajoutée ultérieurement
  rationale: L’hébreu énonce simplement que les prières de David sont achevées, sans préciser l’histoire rédactionnelle de cette phrase. La traduction en restitue donc le sens direct sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. La virgule autour de l’apposition « fils de Jessé » favorise une lecture naturelle. La formulation conserve le caractère bref et conclusif de l’hébreu.
