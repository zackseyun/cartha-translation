  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: fr
  text: Qu’il y ait du grain en abondance dans le pays[a] ! Sur les sommets des montagnes, que son fruit ondule comme le Liban, et que les habitants de la ville fleurissent comme l’herbe de la terre !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’il y ait une poignée de grain dans le pays. » L’expression hébraïque est rare et peut évoquer soit une petite quantité rendue extraordinairement féconde, soit une profusion de grain.'
    reason: Lecture alternative d’une expression hébraïque rare et discutée.
lexical_decisions:
- source_word: יְהִי
  choice: Qu’il y ait
  rationale: Le jussif de היה exprime ici un souhait ou une prière ; cette tournure en restitue naturellement la valeur optative.
- source_word: פִסַּת
  choice: en abondance
  rationale: Ce nom rare est de sens discuté. Dans ce contexte de fécondité extraordinaire, « en abondance » convient à l’image générale, tandis que le sens possible « une poignée » est signalé en note.
- source_word: בַּר
  choice: du grain
  rationale: Le mot désigne ici les céréales ou leur produit de manière collective ; « grain » reste général et naturel.
- source_word: בָּאָרֶץ
  choice: dans le pays
  rationale: Dans cette prière royale, le terme vise naturellement le territoire qui bénéficie du règne, sans exclure la portée plus large possible de « terre ».
- source_word: בְּרֹאשׁ הָרִים
  choice: au sommet des montagnes
  rationale: Rendu direct de l’expression hébraïque, qui souligne une fertilité jusque dans les lieux les moins propices.
- source_word: יִרְעַשׁ
  choice: ondule
  rationale: Le verbe évoque un mouvement, une agitation ou un frémissement. Appliqué au produit des champs, « ondule » exprime naturellement son mouvement visible sans effacer l’image.
- source_word: כַּלְּבָנוֹן
  choice: comme le Liban
  rationale: La comparaison géographique est conservée telle quelle, avec ses connotations de grandeur et de végétation luxuriante.
- source_word: פִּרְיוֹ
  choice: son fruit
  rationale: Le suffixe masculin singulier renvoie naturellement au grain pris collectivement ; le singulier de l’hébreu est conservé.
- source_word: וְיָצִיצוּ מֵעִיר
  choice: que les habitants des villes fleurissent
  rationale: Le verbe pluriel signifie « fleurir » ou « germer », mais son sujet n’est pas exprimé. La mention de la ville permet de comprendre ses habitants ; le pluriel français rend naturellement la valeur représentative du singulier hébreu.
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: comme l’herbe de la terre
  rationale: La formulation conserve la comparaison végétale qui évoque une croissance nombreuse et vigoureuse.
theological_decisions:
- issue: Sens de l’expression rare פִסַּת בַּר
  choice: du grain en abondance
  alternative: une poignée de grain
  rationale: Le contexte prie pour une prospérité débordante et décrit un fruit qui ondule comme le Liban. Toutefois, le sens traditionnel « une poignée » demeure lexicalement possible et pourrait souligner qu’une petite quantité devient extraordinairement féconde ; cette tension est donc conservée en note.
- issue: Sujet implicite de וְיָצִיצוּ
  choice: les habitants des villes
  alternative: ils
  rationale: L’hébreu n’énonce pas le sujet du verbe pluriel. Le contexte urbain suggère les habitants ; les expliciter produit un français intelligible tout en maintenant la métaphore selon laquelle ils « fleurissent ».
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les exclamations rendent le mouvement de souhait ou de prière du verset. La métaphore végétale appliquée aux habitants est volontairement préservée.
