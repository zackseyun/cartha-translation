id: PSA.72.1
reference: Psalms 72:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/שְׁלֹמֹ֨ה אֱֽלֹהִ֗ים מִ֭שְׁפָּטֶי/ךָ לְ/מֶ֣לֶךְ תֵּ֑ן וְ/צִדְקָתְ/ךָ֥ לְ/בֶן מֶֽלֶךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: fr
  text: 'De Salomon[a].


    Ô Dieu, donne au roi tes jugements,

    et ta justice au fils du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour Salomon » ou « À Salomon » dans la suscription.
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: De Salomon
  rationale: Dans une suscription de psaume, le préfixe ל peut exprimer l’auteur, la destination, la dédicace ou une association. « De Salomon » est naturel en français tout en laissant les autres rapports possibles en note.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est ici employé comme apostrophe dans une prière ; « Ô Dieu » rend explicitement ce vocatif dans un registre digne et actuel.
- source_word: מִשְׁפָּטֶיךָ
  choice: tes jugements
  rationale: Le pluriel hébreu peut désigner les décisions judiciaires, la capacité de juger ou l’exercice de la justice. « Tes jugements » en conserve la forme concrète et plurielle.
- source_word: לְמֶלֶךְ
  choice: au roi
  rationale: Le syntagme indique simplement le bénéficiaire de ce que Dieu est prié de donner.
- source_word: תֵּן
  choice: donne
  rationale: L’impératif demande directement à Dieu d’accorder quelque chose ; « donne » est l’équivalent français le plus simple et le plus direct.
- source_word: וְצִדְקָתְךָ
  choice: et ta justice
  rationale: צְדָקָה couvre ici la droiture conforme à la volonté de Dieu et son expression dans un gouvernement juste. « Justice » convient naturellement au contexte royal et judiciaire sans exclure la dimension morale.
- source_word: לְבֶן־מֶלֶךְ
  choice: au fils du roi
  rationale: Cette traduction suit littéralement le groupe construit et maintient ouverte l’identité précise du fils royal ainsi que son rapport au roi du premier membre.
theological_decisions:
- issue: Identité du « roi » et du « fils du roi »
  choice: Conserver sans précision interprétative les désignations royales du texte hébreu.
  alternative: Identifier explicitement le roi à Salomon, à un roi davidique idéal ou au Messie.
  rationale: Le verset peut s’inscrire dans une prière historique pour Salomon tout en portant une portée dynastique ou messianique plus large. La traduction ne tranche pas ce que le texte laisse ouvert.
translation_notes:
  register: Français international moderne, simple et solennel. Le parallélisme poétique est conservé sur deux lignes. « Justice » est retenu pour צְדָקָה, tandis que « jugements » préserve le pluriel distinct de מִשְׁפָּטִים.
