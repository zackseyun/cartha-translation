  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: fr
  text: Béni soit Yahweh Dieu, le Dieu d’Israël, qui seul accomplit des merveilles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Loué soit Yahweh Dieu, le Dieu d’Israël, qui accomplit à lui seul des merveilles. »'
    reason: 'Variante lexicale et syntaxique : בָּרוּךְ peut recevoir une nuance de louange dans la formule doxologique, et לְבַדּוֹ peut se rendre par « à lui seul ».'
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Béni soit
  rationale: Le participe passif ouvre une formule doxologique. « Béni soit » est une tournure française consacrée, naturelle et fidèle à sa valeur liturgique et performative.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est en apposition à Yahweh; la traduction directe « Yahweh Dieu » conserve cette construction, même si elle est moins courante en français que « Yahweh, le Dieu ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Cette traduction directe de la chaîne construite exprime l’identité et la relation particulière indiquées par l’hébreu.
- source_word: עֹשֵׂה
  choice: qui ... accomplit
  rationale: Le participe qal décrit une activité caractéristique de Dieu. « Accomplir des merveilles » est idiomatique en français et convient à des actes divins extraordinaires.
- source_word: נִפְלָאוֹת
  choice: des merveilles
  rationale: Le pluriel désigne des actes extraordinaires et admirables; « merveilles » est clair, digne et usuel dans ce contexte.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: Placée avec le sujet dans la relative, cette formulation conserve l’exclusivité de l’action sans préciser davantage si l’accent porte sur l’unicité ou sur l’absence d’assistance.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte porte directement le tétragramme. La translittération préserve le nom personnel plutôt que de lui substituer un titre traditionnel.
- issue: Portée de לְבַדּוֹ dans l’action divine
  choice: qui seul accomplit des merveilles
  alternative: qui accomplit des merveilles à lui seul
  rationale: « Seul » maintient l’affirmation d’exclusivité et l’ambiguïté possible entre l’unicité de l’auteur de ces actes et l’idée qu’il les accomplit sans aide.
- issue: Relation entre יְהוָה et אֱלֹהִים
  choice: Yahweh Dieu
  alternative: Yahweh, le Dieu
  rationale: L’apposition hébraïque est conservée au plus près. L’alternative est plus explicitement déterminée en français, mais ajoute un article absent de la première apposition.
translation_notes:
  register: Français international moderne, au registre digne et liturgique. La formule « Béni soit » garde la solennité de la doxologie, tandis que « accomplit des merveilles » reste naturelle et accessible.
