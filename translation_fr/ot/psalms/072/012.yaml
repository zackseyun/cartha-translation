id: PSA.72.12
reference: Psalms 72:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: fr
  text: Car il délivre le démuni qui crie au secours, et le pauvre qui n’a personne pour l’aider.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’affligé » pour « le pauvre » (עָנִי), le terme pouvant souligner l’oppression ou la détresse autant que la pauvreté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la louange précédente adressée au roi et rend naturellement la valeur causale du terme.
- source_word: יַצִּיל
  choice: il délivre
  rationale: Le hifil de נצל exprime l’action d’arracher quelqu’un au danger ou à la détresse; « délivre » conserve ce sens sans imposer une lecture exclusivement spirituelle.
- source_word: אֶבְיוֹן
  choice: le démuni
  rationale: Désigne une personne dans le besoin et dépendante de l’aide d’autrui. « Démuni » permet aussi de le distinguer du terme parallèle עָנִי.
- source_word: מְשַׁוֵּעַ
  choice: qui crie au secours
  rationale: Le participe décrit le démuni en train d’appeler à l’aide; cette formulation française est naturelle et conserve la valeur descriptive du participe.
- source_word: וְעָנִי
  choice: et le pauvre
  rationale: עָנִי peut désigner une personne pauvre, affligée ou opprimée. Dans ce parallélisme avec אֶבְיוֹן, la pauvreté est saillante, tout en signalant en note la nuance possible d’affliction.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: qui n’a personne pour l’aider
  rationale: Rend clairement l’absence totale de soutien, dans un français courant, tout en conservant le lien avec le pauvre.
theological_decisions:
- issue: Référent de « il »
  choice: Maintien du pronom masculin singulier sans identification ajoutée; dans le contexte, il renvoie à la figure royale célébrée dans le psaume.
  alternative: Préciser qu’il s’agit d’un roi juste générique ou du roi messianique.
  rationale: Le verbe hébreu est simplement à la troisième personne du masculin singulier. Le verset n’identifie pas davantage le référent; la traduction préserve donc l’ouverture du texte entre son cadre royal et ses lectures messianiques possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Démuni » et « pauvre » préservent la distinction entre les deux termes hébreux parallèles. La syntaxe reste concise et poétique.
