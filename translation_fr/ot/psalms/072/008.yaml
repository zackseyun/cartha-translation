source:
  edition: WLC
  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: fr
  text: Qu’il domine d’une mer à l’autre, et du Fleuve jusqu’aux extrémités de la terre.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il dominera d’une mer à l’autre, et du Fleuve jusqu’aux extrémités de la terre. »'
    reason: alternative_reading
  - marker: b
    text: Le « Fleuve » désigne probablement l’Euphrate, frontière géographique courante dans la Bible.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Qu’il domine
  rationale: Le verbe רדה signifie « dominer, exercer son autorité ». Dans le contexte de prière royale, le français « Qu’il domine » rend naturellement la valeur jussive tout en conservant la portée forte du terme.
- source_word: מִיָּם עַד יָם
  choice: d’une mer à l’autre
  rationale: Cette formulation française naturelle conserve le mérisme hébreu et l’ampleur géographique sans identifier des mers précises.
- source_word: וּמִנָּהָר
  choice: et du Fleuve
  rationale: L’emploi absolu de נהר renvoie vraisemblablement à l’Euphrate. La majuscule signale ce nom géographique traditionnel sans ajouter explicitement « Euphrate » au texte.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: jusqu’aux extrémités de la terre
  rationale: « Extrémités » traduit précisément אַפְסֵי et préserve l’image poétique ainsi que l’étendue universelle de la domination évoquée.
theological_decisions:
- issue: Valeur de l’imparfait à nuance jussive dans un psaume royal
  choice: 'Lecture optative : « Qu’il domine »'
  alternative: 'Lecture prédictive : « Il dominera »'
  rationale: Le contexte de prière en faveur du roi soutient une valeur de souhait. La note conserve toutefois la lecture prédictive possible, sans trancher la tension entre requête royale et portée prophétique.
translation_notes:
  register: Français international moderne, digne et poétique. « Dominer » garde la force de רדה; « régner » serait plus fluide mais légèrement moins précis. Les notes sont placées après l’ensemble du verset afin de ne pas interrompre son parallélisme.
