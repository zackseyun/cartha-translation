  text: תִּדְבַּ֥ק לְשׁוֹנִ֨/י לְ/חִכִּ/י֮ אִם לֹ֪א אֶ֫זְכְּרֵ֥/כִי אִם לֹ֣א אַ֭עֲלֶה אֶת יְרוּשָׁלִַ֑ם עַ֝֗ל רֹ֣אשׁ שִׂמְחָתִֽ/י־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: fr
  text: Que ma langue colle à mon palais si je ne me souviens pas de toi, si je ne place pas Jérusalem au-dessus de ma plus grande joie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si je ne fais pas monter Jérusalem sur la tête de ma joie » ; autrement dit : « si je ne mets pas Jérusalem au premier rang de ma joie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: Que… reste collée
  rationale: Le verbe דבק signifie « s’attacher, adhérer, rester collé ». Dans cette formule d’auto-imprécation, « Que… reste collée » rend naturellement la valeur jussive du contexte et conserve l’image physique.
- source_word: לְשׁוֹנִי
  choice: ma langue
  rationale: Le terme anatomique est rendu directement, car l’impossibilité de parler fait partie intégrante de l’image.
- source_word: לְחִכִּי
  choice: à mon palais
  rationale: חֵךְ désigne le palais. Cette formulation française est précise, naturelle et conserve l’image corporelle sans périphrase.
- source_word: אִם לֹא
  choice: si je ne
  rationale: La construction introduit les conditions liées à l’auto-malédiction. Le français « si je ne » en préserve clairement la structure répétée.
- source_word: אֶזְכְּרֵכִי
  choice: je ne me souviens pas de toi
  rationale: זכר signifie « se souvenir ». Le suffixe féminin singulier renvoie naturellement à Jérusalem, directement interpellée.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: je ne place pas Jérusalem
  rationale: Le hiphil de עלה signifie littéralement « faire monter »; avec עַל רֹאשׁ, il exprime ici l’idée d’accorder le rang supérieur. « Placer » rend ce classement sans ajouter une connotation cultuelle absente du texte.
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: au-dessus de ma plus grande joie
  rationale: Littéralement « sur la tête de ma joie », expression indiquant la primauté. Cette traduction conserve la comparaison et exprime en français courant que Jérusalem doit passer avant même la joie la plus élevée.
theological_decisions:
- issue: Référent du suffixe féminin singulier dans אֶזְכְּרֵכִי
  choice: Jérusalem, personnifiée et directement interpellée
  alternative: Sion ou la ville comprise plus largement dans l’adresse poétique
  rationale: Le contexte immédiat et le genre grammatical soutiennent Jérusalem comme référent, tout en laissant intacte l’équivalence poétique avec Sion dans le psaume.
- issue: Sens de l’élévation de Jérusalem
  choice: Lui accorder la priorité sur toute joie personnelle
  alternative: Exalter ou célébrer Jérusalem comme la joie suprême
  rationale: La tournure hébraïque exprime le rang ou la primauté. « Placer… au-dessus » préserve cette idée sans décider si l’action désigne principalement une préférence intérieure ou une célébration verbale.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « si je ne » et l’image concrète de la langue collée au palais sont conservées. Le seul appel de note est placé à la fin du membre de phrase qu’il éclaire.
