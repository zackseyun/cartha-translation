  yaml_path: translation/ot/psalms/137/002.yaml
  text: On the poplars in its midst we hung our lyres[a][b].
translation:
  language: fr
  text: Aux peupliers qui sont au milieu d’elle, nous avons suspendu nos lyres[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saules ». Le terme hébreu désigne peut-être des arbres du type saule ou peuplier ; « saules » est la traduction traditionnelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « nos harpes ». Le mot hébreu kinnor désigne un ancien instrument à cordes, probablement une lyre.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Aux
  rationale: Avec un nom d’arbre au pluriel, « aux peupliers » exprime naturellement en français l’idée de suspendre les instruments à leurs branches.
- source_word: עֲרָבִים
  choice: peupliers
  rationale: Le terme hébreu peut désigner des arbres du type saule ou peuplier. « Peupliers » convient probablement au cadre mésopotamien, tandis que l’équivalent traditionnel « saules » est conservé en note.
- source_word: בְּתוֹכָהּ
  choice: en son milieu
  rationale: Le suffixe féminin singulier renvoie naturellement au lieu évoqué dans le contexte, Babylone. Cette formulation conserve la référence implicite sans ajouter « ville » ou « pays ».
- source_word: תָּלִינוּ
  choice: nous avons suspendu
  rationale: Le verbe signifie « suspendre, accrocher ». « Suspendu » rend clairement l’action appliquée aux instruments et garde une tonalité poétique digne.
- source_word: כִּנֹּרוֹתֵינוּ
  choice: nos lyres
  rationale: Le kinnor est un ancien instrument à cordes, probablement une lyre. « Harpes », terme traditionnel mais moins précis, figure en note.
