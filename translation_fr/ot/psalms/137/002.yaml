  source_fidelity: 'Le sens lexical est globalement fidèle : עֲרָבִים est rendu prudemment par « peupliers » avec « saules » en variante, בְּתוֹכָהּ conserve sans la préciser la référence féminine à Babylone, et כִּנּוֹרוֹת est justement rendu par « lyres ». Toutefois, « Aux peupliers, en son milieu » affaiblit la relation syntaxique entre les arbres et « en son milieu » et sonne comme une juxtaposition ambiguë, plutôt que comme « sur les arbres qui étaient au milieu d’elle ».'
