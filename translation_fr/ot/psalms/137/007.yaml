  text: זְכֹ֤ר יְהוָ֨ה לִ/בְנֵ֬י אֱד֗וֹם אֵת֮ י֤וֹם יְֽרוּשָׁ֫לִָ֥ם הָ֭/אֹ֣מְרִים עָ֤רוּ עָ֑רוּ עַ֝֗ד הַ/יְס֥וֹד בָּֽ/הּ׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/007.yaml
  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: fr
  text: 'Souviens-toi, Yahweh, des fils d’Édom, de ce qu’ils disaient au jour de Jérusalem[a] : « Mettez-la à nu, mettez-la à nu[b], jusqu’à ses fondations ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le jour de Jérusalem ». Dans ce contexte, l’expression renvoie au jour de sa calamité.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « Dépouillez-la entièrement » ou « Rasez-la ». Le verbe hébreu évoque le fait de découvrir ou de mettre complètement à nu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Souviens-toi
  rationale: L’impératif masculin singulier s’adresse à Yahweh. « Souviens-toi » est naturel dans une lamentation où le souvenir demandé implique une intervention judiciaire.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: לִבְנֵי אֱדוֹם
  choice: des fils d’Édom
  rationale: Cette formulation conserve l’expression familiale et nationale de l’hébreu. Avec « souviens-toi », le français exige naturellement « de » ; le contexte imprécatoire indique que ce souvenir leur est défavorable sans qu’il soit nécessaire d’ajouter une accusation absente du texte.
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: au jour de Jérusalem
  rationale: L’expression hébraïque, très concise, désigne le jour de la catastrophe de Jérusalem. La traduction maintient cette concision et place l’explicitation en note.
- source_word: הָאֹמְרִים
  choice: eux qui disaient
  rationale: Le participe décrit les fils d’Édom par leur cri durant l’événement ; « eux qui disaient » en garde la valeur descriptive et continue.
- source_word: עָרוּ עָרוּ
  choice: Mettez-la à nu, mettez-la à nu
  rationale: Le verbe répété évoque l’action de découvrir ou de dépouiller entièrement. Cette tournure française reste vive et naturelle, sans réduire d’emblée l’image au seul fait de raser.
- source_word: עַד הַיְסוֹד בָּהּ
  choice: jusqu’à ses fondations
  rationale: Le pluriel idiomatique français exprime clairement une destruction poussée jusqu’au niveau des fondations, bien que le nom hébreu soit au singulier.
theological_decisions:
- issue: Sens judiciaire de l’appel au souvenir
  choice: « Souviens-toi […] des fils d’Édom » laisse le contexte exprimer que le souvenir demandé leur est défavorable.
  alternative: « Souviens-toi […] contre les fils d’Édom »
  rationale: La préposition ל peut prendre ici une nuance adversative, mais son calque avec « contre » serait peu naturel en français. La parole hostile citée immédiatement après conserve la tension imprécatoire sans explicitation excessive.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa translittération le distingue d’un titre et suit directement la forme hébraïque.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition impérative et la violence de l’image sont conservées ; l’expression hébraïque concise « jour de Jérusalem » demeure dans le texte avec une note explicative.
