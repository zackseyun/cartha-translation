  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: fr
  text: Heureux celui qui saisit tes tout-petits et les fracasse contre le rocher[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes nourrissons ». Le terme hébreu désigne de très jeunes enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Heureux celui
  rationale: La formule hébraïque exprime une proclamation solennelle de bonheur ou de condition enviable. « Heureux celui » est la tournure traditionnelle et naturelle des béatitudes en français, sans atténuer la tension du contexte.
- source_word: שֶׁיֹּאחֵז
  choice: qui saisit
  rationale: « Saisit » rend l’action énergique et directe du verbe, plus nettement que « prend ».
- source_word: וְנִפֵּץ
  choice: et les fracasse
  rationale: Le verbe désigne une mise en pièces par un choc violent. « Fracasse » restitue sans euphémisme la brutalité de l’image et appelle naturellement le complément « contre le rocher ».
- source_word: עֹלָלַיִךְ
  choice: tes tout-petits
  rationale: Le nom vise de très jeunes enfants. « Tout-petits » est idiomatique en français et conserve à la fois la référence à leur jeune âge et la charge pathétique; « nourrissons » serait potentiellement trop étroit.
- source_word: אֶל הַסָּלַע
  choice: contre le rocher
  rationale: Dans ce contexte de choc, la préposition se rend naturellement par « contre ». « Rocher » est un équivalent courant de סֶלַע et convient à l’image concrète.
theological_decisions:
- issue: Force éthique et théologique de אַשְׁרֵי dans une imprécation
  choice: Conserver directement la béatitude « Heureux celui » sans l’adoucir ni ajouter de jugement explicatif.
  alternative: « Favorisé soit celui » ou une paraphrase qui prendrait ses distances avec la violence.
  rationale: Le texte proclame sans détour le bonheur de l’agent de la rétribution contre Babylone. La traduction doit préserver cette tension rhétorique et théologique, sans transformer le verset en approbation abstraite de la cruauté ni résoudre la difficulté à la place du lecteur.
translation_notes:
  register: Français international moderne, direct et digne. La formulation garde le parallélisme compact et la violence explicite de l’hébreu. Le point d’exclamation rend la force exclamative de la formule אַשְׁרֵי.
