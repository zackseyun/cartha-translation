source:
  edition: WLC
  text: בַּת בָּבֶ֗ל הַ/שְּׁד֫וּדָ֥ה אַשְׁרֵ֥י שֶׁ/יְשַׁלֶּם לָ֑/ךְ אֶת גְּ֝מוּלֵ֗/ךְ שֶׁ/גָּמַ֥לְתְּ לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/008.yaml
  text: Daughter Babylon[a], devastated one[b], blessed is the one who repays you with the recompense you dealt to us.
translation:
  language: fr
  text: Fille de Babylone[a], la dévastée[b], heureux celui qui te rendra ce que tu nous as fait !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fille Babylone ». L’expression hébraïque personnifie la ville et le peuple de Babylone sous les traits d’une fille.
    reason: lexical_alternative
  - marker: b
    text: Ou « détruite » ou « pillée » ; le terme hébreu peut désigner une dévastation déjà subie ou une ruine à venir.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת בָּבֶל
  choice: Fille de Babylone
  rationale: Cette expression construite personnifie Babylone comme une fille-ville. « Fille de Babylone » conserve l’image poétique hébraïque tout en étant idiomatique en français.
- source_word: הַשְּׁדוּדָה
  choice: vouée à la dévastation
  rationale: Le participe passif de שׁדד peut évoquer une ville dévastée ou destinée à l’être. Dans ce contexte, l’expression retient la portée probable de jugement à venir sans masquer l’ambiguïté, signalée en note.
- source_word: אַשְׁרֵי
  choice: heureux celui
  rationale: Formule de béatitude courante dans les Psaumes. « Heureux » est naturel, solennel et conforme à l’usage biblique français moderne.
- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: qui te rendra
  rationale: Le verbe שׁלם exprime ici l’idée de rétribution ou de remboursement. Avec son complément, « rendre le mal » communique clairement la réciprocité judiciaire.
- source_word: אֶת גְּמוּלֵךְ
  choice: le mal
  rationale: גְּמוּל désigne ce qui est rendu en retour, la rétribution. « Le mal » explicite naturellement en français la nature de l’acte rappelé par la proposition suivante, sans ajouter une catégorie doctrinale.
- source_word: שֶׁגָּמַלְתְּ לָנוּ
  choice: que tu nous as fait
  rationale: גמל signifie ici agir envers quelqu’un, avec une valeur négative imposée par le contexte. Cette tournure française est naturelle et préserve le rapport de réciprocité avec גְּמוּל.
theological_decisions:
- issue: Béatitude imprécatoire prononcée sur celui qui châtiera Babylone
  choice: Conserver directement la formule « heureux celui » et la rétribution en nature.
  alternative: Transformer la formule en simple prédiction ou atténuer la violence de la rétribution.
  rationale: L’hébreu énonce véritablement une béatitude sur celui qui rend à Babylone ce qu’elle a fait. La traduction maintient cette tension morale et théologique sans la résoudre ni l’édulcorer.
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation exclamative restitue la force de la béatitude imprécatoire. La formulation reste accessible tout en conservant la personnification de Babylone et l’ambiguïté temporelle du participe.
