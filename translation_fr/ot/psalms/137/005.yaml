  text: אִֽם אֶשְׁכָּחֵ֥/ךְ יְֽרוּשָׁלִָ֗ם תִּשְׁכַּ֥ח יְמִינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/005.yaml
  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: fr
  text: Si je t’oublie, Jérusalem, que ma main droite oublie[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « que ma main droite perde son habileté ». L’hébreu est elliptique; ce sens plus développé est déduit du contexte et retenu par certaines traductions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Introduit une condition à valeur de serment; « Si » en conserve directement la forme et la force.
- source_word: אֶשְׁכָּחֵךְ
  choice: je t’oublie
  rationale: Qal inaccompli, première personne du singulier, avec suffixe féminin singulier renvoyant à Jérusalem; le tutoiement maintient l’adresse directe.
- source_word: יְרוּשָׁלִָם
  choice: Jérusalem
  rationale: Le nom propre est rendu sous sa forme française usuelle et placé en apostrophe.
- source_word: תִּשְׁכַּח
  choice: que … oublie
  rationale: L’inaccompli à valeur jussive exprime ici une imprécation contre soi-même; la tournure « que » restitue naturellement cette valeur en français.
- source_word: יְמִינִי
  choice: ma main droite
  rationale: יָמִין désigne couramment la main droite; le contexte peut suggérer son habileté, sans que celle-ci soit explicitement nommée dans l’hébreu.
theological_decisions:
- issue: Imprécation elliptique dans le second membre
  choice: que ma main droite oublie
  alternative: que ma main droite perde son habileté
  rationale: Le texte massorétique dit littéralement que la main droite « oublie », sans complément exprimé. Le texte principal préserve cette ellipse et sa tension, tandis que la note donne le sens explicité que suggère le contexte.
translation_notes:
  register: Français moderne, international et digne. La construction brève conserve le parallélisme, l’apostrophe à Jérusalem et la solennité du serment imprécatoire.
