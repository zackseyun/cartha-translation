source:
  edition: WLC
  text: עַ֥ל נַהֲר֨וֹת בָּבֶ֗ל שָׁ֣ם יָ֭שַׁבְנוּ גַּם בָּכִ֑ינוּ בְּ֝/זָכְרֵ֗/נוּ אֶת צִיּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: fr
  text: Au bord des fleuves de Babylone[a], là, nous nous sommes assis[b] ; nous avons aussi pleuré en nous souvenant de Sion.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au bord des cours d’eau de Babylone ».
    reason: lexical_alternative
  - marker: b
    text: Ou « là, nous étions assis et nous pleurions en nous souvenant de Sion ». Le verbe hébreu peut évoquer l’action de s’asseoir ou l’état d’être assis ; il comporte aussi une particule additive (« aussi » ou « même ») avant « nous avons pleuré ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: Au bord de
  rationale: Avec un lieu associé à des cours d’eau, la préposition situe les exilés près de ceux-ci. « Au bord de » est naturel en français et rend concrètement la scène sans suggérer qu’ils se trouvaient sur l’eau.
- source_word: נַהֲרוֹת
  choice: fleuves
  rationale: Le pluriel de נָהָר désigne normalement des fleuves ou de grands cours d’eau. « Fleuves » conserve le sens principal et le registre poétique traditionnel, tandis que la note signale une possibilité plus générale.
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom de lieu.
- source_word: שָׁם
  choice: là
  rationale: 'L’adverbe est conservé afin de préserver l’insistance spatiale du texte : les exilés étaient là, à Babylone, loin de Sion.'
- source_word: יָשַׁבְנוּ
  choice: nous étions assis
  rationale: Le qal accompli de ישׁב peut signifier « s’asseoir », « être assis » ou « habiter ». Dans cette scène de lamentation, « nous étions assis » décrit naturellement leur posture sans imposer l’idée d’une installation durable.
- source_word: גַּם
  choice: aussi
  rationale: « Aussi » conserve la valeur additive de גַּם, même si le lien exact avec l’action précédente demeure légèrement inhabituel en français, comme en hébreu.
- source_word: בָּכִינוּ
  choice: nous avons pleuré
  rationale: Le verbe exprime les pleurs. Le passé composé est clair et digne en français moderne, et distingue cette action du cadre descriptif « nous étions assis ».
- source_word: בְּזָכְרֵנוּ
  choice: en nous souvenant
  rationale: La préposition בְּ devant l’infinitif construit permet ici une relation temporelle ou circonstancielle. « En nous souvenant » préserve cette souplesse sans trancher strictement entre simultanéité et cause.
- source_word: אֶת צִיּוֹן
  choice: Sion
  rationale: La marque de l’objet direct אֶת n’est pas traduite. Le nom « Sion » est conservé plutôt que remplacé par « Jérusalem », afin de préserver la désignation précise et sa portée poétique.
theological_decisions:
- issue: Rendu de צִיּוֹן
  choice: Sion
  alternative: Jérusalem
  rationale: Le texte nomme expressément Sion. Garder ce nom préserve sa résonance géographique, poétique et théologique sans réduire le référent à une simple équivalence explicative.
- issue: Rapport entre le souvenir de Sion et les pleurs
  choice: en nous souvenant de Sion
  alternative: quand nous nous souvenions de Sion / parce que nous nous souvenions de Sion
  rationale: La construction hébraïque peut être comprise temporellement ou avec une nuance causale. Le gérondif français maintient cette tension au lieu de préciser une relation que le texte ne fixe pas entièrement.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition spatiale « Au bord… là » est volontaire, car elle reflète l’insistance de l’hébreu. Le point-virgule rend lisible l’enchaînement tout en conservant la particule additive « aussi ».
