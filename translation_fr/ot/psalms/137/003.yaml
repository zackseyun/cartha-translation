  text: כִּ֤י שָׁ֨ם שְֽׁאֵל֪וּ/נוּ שׁוֹבֵ֡י/נוּ דִּבְרֵי שִׁ֭יר וְ/תוֹלָלֵ֣י/נוּ שִׂמְחָ֑ה שִׁ֥ירוּ לָ֝֗/נוּ מִ/שִּׁ֥יר צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: fr
  text: 'Car là, ceux qui nous avaient emmenés en captivité nous demandaient des chants, et nos tourmenteurs[a], de la joie : « Chantez-nous l’un des chants de Sion ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos moqueurs » ; le terme hébreu est rare et peut souligner soit les mauvais traitements infligés, soit la dérision.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de ce qui précède et conserve la valeur causale ou explicative de la particule.
- source_word: שָׁם
  choice: là
  rationale: Renvoie simplement au lieu de l’exil, Babylone, dans le contexte.
- source_word: שְׁאֵלוּנוּ
  choice: nous demandaient
  rationale: Rend naturellement la demande adressée aux exilés; l’imparfait convient à la scène remémorée et à l’action présentée dans sa durée.
- source_word: שׁוֹבֵינוּ
  choice: ceux qui nous avaient emmenés captifs
  rationale: Exprime explicitement l’idée de capture sans employer « ravisseurs », qui évoquerait trop facilement un enlèvement au sens moderne.
- source_word: דִּבְרֵי שִׁיר
  choice: des paroles de chant
  rationale: Conserve l’expression hébraïque littérale et son accent sur une prestation chantée avec des paroles, malgré une formulation légèrement poétique en français.
- source_word: וְתוֹלָלֵינוּ
  choice: et nos tourmenteurs
  rationale: Le terme rare peut désigner ceux qui maltraitent ou ceux qui tournent en dérision. « Tourmenteurs » convient au contexte d’oppression sans exclure la cruauté moqueuse; l’incertitude est signalée en note.
- source_word: שִׂמְחָה
  choice: de la joie
  rationale: Garde le substantif abstrait hébreu et fait entendre que les oppresseurs réclament un divertissement joyeux.
- source_word: שִׁירוּ לָנוּ
  choice: Chantez-nous
  rationale: Formulation française idiomatique de l’impératif pluriel avec ל, indiquant une prestation destinée aux auditeurs.
- source_word: מִשִּׁיר צִיּוֹן
  choice: un des chants de Sion
  rationale: 'Rend la valeur partitive de מִן : il s’agit de choisir un chant dans le répertoire associé à Sion.'
