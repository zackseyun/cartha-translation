id: PSA.137.4
reference: Psalms 137:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: fr
  text: Comment pourrions-nous chanter le chant de Yahweh sur une terre étrangère ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte « le chant de YHWH » ; traduction traditionnelle : « le chant du SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: Ou « dans un pays étranger ». L’hébreu dit plus concrètement « sur une terre [ou un sol] étrangère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment pourrions-nous
  rationale: L’adverbe interrogatif introduit ici une question rhétorique portant sur la possibilité ou la convenance. Cette formulation rend naturellement la plainte en français moderne sans trancher entre incapacité et refus moral.
- source_word: נָשִׁיר
  choice: chanter
  rationale: Imparfait qal, première personne du pluriel, intégré à la tournure française « pourrions-nous chanter ».
- source_word: אֶת
  choice: '[marqueur de l’objet direct, non traduit]'
  rationale: Ce marqueur grammatical hébreu n’a pas d’équivalent lexical à rendre en français.
- source_word: שִׁיר
  choice: le chant
  rationale: Le nom en construction avec le nom divin désigne ici « le chant de Yahweh ». « Chant » convient au contexte cultuel et poétique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le texte porte le nom divin YHWH. La translittération « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- source_word: עַל
  choice: sur
  rationale: La préposition signifie concrètement « sur » et conserve l’image spatiale du texte hébreu.
- source_word: אַדְמַת
  choice: une terre
  rationale: Le terme désigne le sol ou la terre. « Terre » est naturel en français tout en gardant l’image concrète du lieu où se trouvent les exilés.
- source_word: נֵכָר
  choice: étrangère
  rationale: Le mot qualifie ce qui appartient à un autre peuple ou pays. « Étrangère » exprime clairement cette altérité dans le contexte de l’exil.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie directement le Tétragramme. « Yahweh » conserve le nom propre présent dans le texte, tandis que « le SEIGNEUR » représente la substitution traditionnelle par un titre.
- issue: Portée de la question rhétorique
  choice: Comment pourrions-nous chanter
  alternative: Comment chanterions-nous
  rationale: La formulation retenue laisse subsister la tension entre impossibilité ressentie et inconvenance de chanter dans l’exil, sans transformer la question en interdiction doctrinale explicite.
translation_notes:
  register: Français international moderne, sobre et poétique. « Pourrions-nous » restitue la force plaintive de la question rhétorique ; « sur une terre étrangère » conserve l’image concrète de l’hébreu tout en restant idiomatique.
