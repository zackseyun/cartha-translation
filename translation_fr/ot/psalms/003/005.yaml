id: PSA.3.5
reference: Psalms 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֥י שָׁכַ֗בְתִּי וָֽ/אִ֫ישָׁ֥נָ/ה הֱקִיצ֑וֹתִי כִּ֖י יְהוָ֣ה יִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/005.yaml
  text: I lay down and slept[a]; I awoke[b], because Yahweh sustains me.
translation:
  language: fr
  text: Je me suis couché et je me suis endormi ; je me suis réveillé, car Yahweh me soutient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « me maintient » ou « me soutiendra ».'
    reason: Le verbe peut exprimer le fait de soutenir ou de maintenir, et sa forme peut aussi recevoir une nuance future.
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: Je me suis couché
  rationale: Le verbe שׁכב exprime ici l’action de se coucher. Le passé composé est naturel en français actuel et ouvre clairement la suite des actions.
- source_word: וָאִישָׁנָה
  choice: et je me suis endormi
  rationale: Issu de ישׁן, « dormir ». Dans cette séquence, « je me suis endormi » rend naturellement l’entrée dans le sommeil après le fait de s’être couché, sans alourdir le vers.
- source_word: הֱקִיצוֹתִי
  choice: je me suis réveillé
  rationale: 'Le verbe קיץ signifie « s’éveiller, se réveiller ». La forme est comprise comme intransitive : le psalmiste constate qu’il s’est réveillé.'
- source_word: כִּי
  choice: car
  rationale: כִּי introduit la raison de ce réveil en sécurité. « Car » conserve le lien causal tout en convenant au registre poétique et digne du psaume.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que remplacé par un titre.
- source_word: יִסְמְכֵנִי
  choice: me soutient
  rationale: Le verbe סמך signifie « soutenir, maintenir, appuyer ». Le présent français rend bien l’action divine continue sur laquelle repose la sécurité du psalmiste.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom propre au lieu de lui substituer un titre.
- issue: Valeur temporelle de יִסְמְכֵנִי
  choice: me soutient
  alternative: me soutiendra
  rationale: L’imparfait hébreu peut orienter vers une action continue ou future. Dans ce contexte, le présent français exprime le soutien durable qui explique le réveil, sans exclure sa continuation.
translation_notes:
  register: Français international moderne, simple et digne. La succession des trois actions est conservée, avec un rythme bref. Le passé composé assure une expression naturelle, tandis que « car » maintient la tonalité poétique.
