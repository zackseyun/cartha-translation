reference: Psalms 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: fr
  text: Lève-toi, Yahweh ! Sauve-moi, mon Dieu ! Car tu as frappé tous mes ennemis à la joue[a], tu as brisé les dents des méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la mâchoire ». Le mot hébreu peut désigner la joue ou la mâchoire.
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: Impératif de קום adressé à Dieu. « Lève-toi » est naturel en français moderne et conserve l’appel énergique à l’intervention divine.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, qui préserve ici le nom personnel plutôt que de lui substituer un titre.
- source_word: הוֹשִׁיעֵנִי
  choice: Sauve-moi
  rationale: Le hiphil impératif de ישׁע avec suffixe de première personne exprime directement une demande de salut ou de délivrance; « Sauve-moi » en garde toute l’ampleur.
- source_word: אֱלֹהַי
  choice: mon Dieu
  rationale: Rend directement la forme possessive et préserve le caractère personnel de l’appel.
- source_word: כִּי
  choice: Car
  rationale: Introduit le fondement explicatif ou causal de la demande.
- source_word: הִכִּיתָ
  choice: tu as frappé
  rationale: Le parfait hébreu est rendu comme une action accomplie, lecture directe de l’aspect verbal dans ce contexte poétique.
- source_word: אֶת כָּל אֹיְבַי
  choice: tous mes ennemis
  rationale: Rendu transparent du complément d’objet, sans atténuer l’opposition exprimée.
- source_word: לֶחִי
  choice: à la joue
  rationale: לֶחִי peut désigner la joue ou la mâchoire. « Frapper à la joue » est une formulation française naturelle qui conserve l’image d’humiliation et de défaite.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: les dents des méchants
  rationale: Conserve l’image corporelle concrète; le pluriel substantivé רְשָׁעִים est naturellement rendu par « les méchants ».
- source_word: שִׁבַּרְתָּ
  choice: tu as brisé
  rationale: Rend le parfait hébreu comme une action accomplie et maintient le parallélisme avec « tu as frappé ».
theological_decisions:
- issue: Valeur des parfaits hébreux הִכִּיתָ et שִׁבַּרְתָּ dans une prière poétique
  choice: 'Passé composé : « tu as frappé… tu as brisé »'
  alternative: 'Présent de valeur habituelle ou certaine : « tu frappes… tu brises »'
  rationale: Les parfaits peuvent évoquer des actes accomplis, tout en servant poétiquement à exprimer une intervention tenue pour certaine. Le passé composé suit leur forme aspectuelle la plus directe sans exclure la confiance du psalmiste.
- issue: Imagerie violente dirigée contre les ennemis
  choice: Conserver les images de la joue frappée et des dents brisées
  alternative: Paraphraser par une défaite abstraite
  rationale: Le texte hébreu emploie une imagerie corporelle vive évoquant l’humiliation et la mise hors d’état de nuire; l’atténuer ferait perdre une dimension essentielle du verset.
translation_notes:
  register: Français international moderne, direct et digne. Les exclamations rendent l’intensité des deux impératifs. Le nom divin est transcrit « Yahweh ». L’image poétique concrète est conservée sans archaïsme.
