  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: fr
  text: De ma voix, je crie vers Yahweh, et il me répond[a] depuis sa montagne sainte[b]. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, au passé : « il m’a répondu ». Dans ce contexte, le verbe hébreu peut aussi se traduire au passé.'
    reason: alternative_reading
  - marker: b
    text: 'On traduit traditionnellement aussi : « depuis sa colline sainte ». Le mot hébreu signifie plus fondamentalement « montagne » et désigne probablement Sion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: À voix haute
  rationale: Le nom קוֹל avec le suffixe de première personne signifie littéralement « ma voix ». La tournure adverbiale « à voix haute » exprime naturellement en français le moyen et le caractère audible de l’appel, tout en conservant sa mise en relief au début du vers.
- source_word: אֶל
  choice: vers
  rationale: La préposition indique ici la direction de l’appel adressé à Dieu. « Vers » restitue cette orientation dans un français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, sans lui substituer un titre.
- source_word: אֶקְרָא
  choice: je crie
  rationale: Dans un contexte de détresse et de prière, קרא peut signifier appeler ou crier. « Je crie » convient au contexte du psaume et s’accorde naturellement avec « à voix haute ».
- source_word: וַיַּעֲנֵנִי
  choice: et il me répond
  rationale: Le présent rend l’action avec vivacité et peut exprimer l’assurance caractéristique du psalmiste. La forme hébraïque permet aussi une traduction au passé, signalée en note.
- source_word: מֵהַר קָדְשׁוֹ
  choice: depuis sa montagne sainte
  rationale: הַר désigne fondamentalement une montagne. « Depuis » indique que la réponse vient de ce lieu; l’expression évoque probablement Sion sans l’expliciter dans le texte.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis de ce terme liturgique ou musical demeure incertain; sa translittération évite de lui imposer une interprétation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte hébreu emploie directement le nom divin. Le conserver sous la forme « Yahweh » préserve le nom propre plutôt que de le remplacer par un titre.
- issue: Valeur temporelle de וַיַּעֲנֵנִי dans la poésie
  choice: 'présent : « il me répond »'
  alternative: 'passé : « il m’a répondu »'
  rationale: Le présent maintient l’immédiateté et l’assurance exprimées dans le psaume, tandis que la morphologie hébraïque rend également défendable une lecture passée. Cette ambiguïté est conservée en note.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre initial met en relief l’appel audible du psalmiste. « Yahweh » conserve le nom divin; « Sélah » reste translittéré en raison de son sens incertain.
