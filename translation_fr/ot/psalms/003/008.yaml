  text: Salvation belongs to Yahweh[a]; your blessing be on your people[b]. Selah
translation:
  language: fr
  text: Le salut appartient à Yahweh ; ta bénédiction sur ton peuple[a]. Sélah[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition hébraïque est sans verbe et peut se comprendre comme une affirmation (« ta bénédiction est sur ton peuple ») ou comme une prière (« que ta bénédiction soit sur ton peuple »).
    reason: alternative_reading
  - marker: b
    text: « Sélah » est probablement une indication liturgique ou musicale ; son sens précis est incertain.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: appartient à Yahweh
  rationale: Le préfixe ל indique ici la possession ou l’attribution dans une proposition sans verbe. « Appartient à Yahweh » exprime naturellement que le salut vient de lui et lui revient, tout en conservant le nom divin.
- source_word: הַיְשׁוּעָה
  choice: le salut
  rationale: Le nom désigne la délivrance ou le secours victorieux. « Salut » convient au contexte immédiat et garde sa portée théologique plus large sans paraphrase excessive.
- source_word: עַל
  choice: sur
  rationale: La préposition présente la bénédiction comme reposant sur le peuple. « Sur » est la formulation française la plus directe.
- source_word: עַמְּךָ
  choice: ton peuple
  rationale: עַם désigne ici le peuple dans sa relation communautaire avec Dieu. « Ton peuple » préserve ce lien.
- source_word: בִרְכָתֶךָ
  choice: ta bénédiction
  rationale: Le terme signifie directement « bénédiction ». Ce choix est plus fidèle et plus ample que « faveur ».
- source_word: סֶּלָה
  choice: Sélah
  rationale: Le sens précis du terme demeure incertain ; il s’agit probablement d’une indication liturgique ou musicale. La translittération évite une traduction conjecturale.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Valeur de la seconde proposition sans verbe
  choice: que ta bénédiction repose sur ton peuple
  alternative: ta bénédiction repose sur ton peuple
  rationale: L’hébreu permet de comprendre la proposition soit comme une prière, soit comme une affirmation. Le contexte psalmique favorise ici la lecture comme souhait ou demande, tandis que l’autre lecture est signalée en note afin de préserver l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La première proposition suit de près la structure possessive de l’hébreu. Dans la seconde, « repose sur » rend l’image associée à עַל de manière naturelle ; la note maintient l’ambiguïté entre déclaration et prière.
