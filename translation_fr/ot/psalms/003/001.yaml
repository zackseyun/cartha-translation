lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: מָה רַבּוּ
  choice: qu’ils sont nombreux
  rationale: מָה a ici une valeur exclamative et רַבּוּ souligne le grand nombre des adversaires.
- source_word: צָרָי
  choice: mes adversaires
  rationale: Le terme désigne ceux qui s’opposent activement au psalmiste, sans imposer un contexte exclusivement militaire.
- source_word: רַבִּים קָמִים עָלָי
  choice: Ils sont nombreux à se dresser contre moi
  rationale: Cette formulation naturelle conserve l’insistance de רַבִּים et rend le participe קָמִים avec sa nuance d’opposition en cours.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin ; sa translittération préserve cette distinction au lieu de lui substituer un titre.
translation_notes:
  register: Français moderne, digne et direct. La reprise de « nombreux » reproduit l’insistance de l’hébreu sans alourdir la phrase.
