  text: רַבִּים֮ אֹמְרִ֪ים לְ/נַ֫פְשִׁ֥/י אֵ֤ין יְֽשׁוּעָ֓תָ/ה לּ֬/וֹ בֵֽ/אלֹהִ֬ים סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/002.yaml
  text: Many are saying of me[c][b][a], “There is no salvation for him in God.” Selah
translation:
  language: fr
  text: 'Beaucoup disent à mon sujet[a] : « Il n’y a pour lui aucun salut auprès de Dieu. » Sèla[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à mon âme » ; l’expression hébraïque signifie ici « à mon sujet » ou « de moi ».'
    reason: lexical_alternative
  - marker: c
    text: « Sèla » est probablement un terme musical ou liturgique, mais son sens précis demeure incertain.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: Beaucoup
  rationale: L’adjectif est employé comme substantif et désigne un grand nombre de personnes. « Beaucoup » en conserve la force indéfinie avec naturel et concision.
- source_word: אֹמְרִים
  choice: disent
  rationale: Le participe hébreu peut exprimer une action en cours ou répétée. En français, le présent « disent » rend naturellement cette valeur dans le contexte.
- source_word: לְנַפְשִׁי
  choice: à mon sujet
  rationale: Littéralement « à mon âme », l’expression emploie נֶפֶשׁ pour désigner la personne elle-même. « À mon sujet » transmet clairement l’idée sans suggérer à tort une distinction entre l’âme et la personne.
- source_word: אֵין
  choice: Il n’y a pas de
  rationale: Cette tournure rend directement et idiomatiquement la négation existentielle hébraïque.
- source_word: יְשׁוּעָתָה
  choice: salut
  rationale: Le nom désigne le secours qui sauve ou la délivrance. « Salut » conserve à la fois le sens concret de sauvetage dans ce psaume et la portée théologique plus large du terme.
- source_word: לּוֹ
  choice: pour lui
  rationale: Le suffixe renvoie au psalmiste, dont les adversaires parlent à la troisième personne. « Pour lui » est l’équivalent français le plus direct.
- source_word: בֵאלֹהִים
  choice: en Dieu
  rationale: La traduction garde la préposition hébraïque au plus près et préserve la formulation selon laquelle aucun salut ne se trouverait en Dieu pour le psalmiste, sans l’expliciter par « venant de Dieu ».
- source_word: סֶלָה
  choice: Sèla
  rationale: Le sens exact de ce terme étant incertain, il est translittéré plutôt que remplacé par une interprétation conjecturale telle que « pause » ou « interlude ».
theological_decisions:
- issue: Rendre יְשׁוּעָה par un terme général de délivrance ou par « salut »
  choice: salut
  alternative: délivrance
  rationale: Dans le contexte, le mot évoque un secours concret accordé par Dieu, mais « salut » en conserve aussi la résonance théologique sans dépasser ce que dit le texte. L’alternative est signalée en note.
- issue: Traduire לְנַפְשִׁי littéralement ou comme une expression désignant la personne
  choice: à mon sujet
  alternative: à mon âme
  rationale: Ici, נֶפֶשׁ désigne la personne elle-même. Une traduction strictement littérale serait obscure en français moderne et pourrait introduire une nuance psychologique ou anthropologique absente du contexte.
- issue: Interpréter la relation exprimée par בֵאלֹהִים
  choice: en Dieu
  alternative: venant de Dieu
  rationale: « En Dieu » préserve la forme et la tension de l’hébreu. « Venant de Dieu » serait plus explicite en français, mais déterminerait plus étroitement le sens de la préposition.
translation_notes:
  register: Français international moderne, clair et digne. Le vers conserve la déclaration accusatrice sous forme de citation directe. « En Dieu » reste volontairement proche de l’hébreu afin de ne pas réduire l’ambiguïté de la préposition, tandis que les expressions potentiellement opaques sont expliquées en notes.
