  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: fr
  text: Je ne craindrai pas des myriades de gens qui se sont postés tout autour de moi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui se sont rangés contre moi de tous côtés ».'
    reason: Le groupe סָבִיב שָׁתוּ עָלָי peut mettre l’accent soit sur l’encerclement spatial, soit plus explicitement sur la position hostile prise contre le psalmiste.
lexical_decisions:
- source_word: לֹא אִירָא
  choice: Je ne craindrai pas
  rationale: L’imparfait hébreu à la première personne peut exprimer ici l’avenir ou une ferme résolution; le futur français rend naturellement cette assurance.
- source_word: מֵרִבְבוֹת עָם
  choice: les myriades de gens
  rationale: רְבָבוֹת évoque des nombres immenses tout en conservant l’image numérique de «myriades». עָם désigne ici une multitude humaine plutôt qu’un État-nation; «gens» convient à ce collectif hostile.
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le relatif introduit la proposition décrivant cette multitude humaine.
- source_word: סָבִיב שָׁתוּ
  choice: se sont postés tout autour
  rationale: Le verbe signifie «mettre, placer»; dans cette scène d’encerclement, la tournure pronominale «se sont postés» exprime naturellement le positionnement des adversaires. סָבִיב indique qu’ils entourent le psalmiste de tous côtés.
- source_word: עָלָי
  choice: de moi
  rationale: Combiné à סָבִיב et au verbe de positionnement, le pronom complète naturellement «tout autour de moi»; la valeur hostile possible de עַל est conservée en note.
