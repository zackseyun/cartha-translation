id: PSA.3.3
reference: Psalms 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: fr
  text: Mais toi, Yahweh, tu es un bouclier autour de moi[a], ma gloire et celui qui relève ma tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un bouclier pour moi » ou « un bouclier en ma faveur » ; la préposition hébraïque peut exprimer une protection accordée à quelqu’un, bien qu’ici elle évoque probablement un bouclier protecteur qui l’entoure.
    reason: lexical_alternative
  - marker: b
    text: « Relever ma tête » est une image hébraïque qui peut évoquer le rétablissement de la dignité, de la confiance ou de l’honneur d’une personne.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi
  rationale: La conjonction jointe au pronom indépendant marque ici un contraste appuyé avec les nombreux adversaires évoqués auparavant. « Mais toi » rend naturellement cette opposition et conserve l’emphase sur « toi ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin, plutôt que remplacé par un titre.
- source_word: מָגֵן
  choice: un bouclier
  rationale: Le nom désigne un bouclier défensif. Dans cette construction attributive, le français demande naturellement l’article indéfini.
- source_word: בַּעֲדִי
  choice: autour de moi
  rationale: La préposition peut signifier « pour moi » ou « en ma faveur », mais, associée au bouclier, elle évoque probablement une protection qui entoure le psalmiste. La note conserve les autres possibilités.
- source_word: כְּבוֹדִי
  choice: ma gloire
  rationale: 'Cette traduction préserve l’expression hébraïque concise ainsi que sa richesse poétique : Yahweh est la gloire, l’honneur et la dignité du psalmiste.'
- source_word: וּ/מֵרִים
  choice: et celui qui relève
  rationale: Le participe présente une action caractéristique ou continue. « Celui qui relève » en conserve la force tout en restant naturel en français.
- source_word: רֹאשִׁי
  choice: ma tête
  rationale: La traduction littérale maintient l’image concrète de l’hébreu, dont les implications sont précisées en note sans réduire le sens à une seule interprétation.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » préserve le nom personnel de Dieu au lieu de lui substituer un titre.
- issue: Interprétation de l’expression « relever ma tête »
  choice: Conserver l’image littérale dans le texte principal
  alternative: me rend ma dignité / me redonne courage / me réhabilite
  rationale: L’image hébraïque peut évoquer la dignité restaurée, la confiance ou la réhabilitation. La conserver évite de trancher entre ces nuances.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et accessible, tout en conservant le parallélisme nominal et l’image concrète de l’hébreu.
