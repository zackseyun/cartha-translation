  text: מִזְמ֥וֹר לְ/דָוִ֑ד בְּ֝/בָרְח֗/וֹ מִ/פְּנֵ֤י אַבְשָׁל֬וֹם בְּנֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/000.yaml
  text: A psalm of David[a], when he fled from Absalom his son.
translation:
  language: fr
  text: Psaume de David[a], lorsqu’il fuyait devant son fils Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par David » ou « pour David » ; le titre hébreu peut indiquer l’auteur, la dédicace, l’appartenance ou une association.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et précis en français pour cette désignation de genre placée en tête d’une composition poétique et musicale.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition ל peut exprimer l’auteur, l’appartenance, la dédicace ou l’association. « de David » conserve mieux cette latitude que « par David » ou « pour David ».
- source_word: בְּבָרְחוֹ
  choice: lorsqu’il s’enfuit
  rationale: La préposition ב avec l’infinitif construit et son suffixe a ici une valeur temporelle, rendue naturellement en français par « lorsqu’il s’enfuit ».
- source_word: מִפְּנֵי
  choice: loin de
  rationale: L’expression signifie littéralement « de devant » ou « de la présence de » et, avec le verbe fuir, indique qu’on s’éloigne de quelqu’un. « loin de » exprime cet éloignement en français naturel.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Transcription française traditionnelle et largement reconnue du nom propre.
- source_word: בְּנוֹ
  choice: son fils
  rationale: Rend directement le nom avec suffixe masculin singulier et maintient l’accent sur le lien familial.
theological_decisions:
- issue: Portée de la suscription davidique
  choice: Conserver la formulation ambiguë « de David ».
  alternative: « par David » ou « pour David »
  rationale: Dans les titres des psaumes, לְדָוִד peut signaler l’auteur, la dédicace, l’appartenance ou une association. L’hébreu n’impose pas ici une seule de ces possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. Le titre reste concis ; « lorsqu’il s’enfuit loin de » rend naturellement la circonstance historique sans reproduire servilement l’idiome hébreu « de devant ».
