  text: 'Qu’ils reculent à cause de leur honte, ceux qui disent : « Ah ! Ah ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Qu’ils reculent
  rationale: Le qal inaccompli à valeur volitive ou imprécatoire appelle ici un souhait. « Reculent » exprime naturellement en français le mouvement de retraite sans introduire le passif absent de la forme hébraïque.
- source_word: עַל עֵקֶב
  choice: à cause de
  rationale: Cette locution exprime ici la cause ou la conséquence. « À cause de » restitue clairement l’idiome sans conserver artificiellement l’image lexicale du talon.
- source_word: בָּשְׁתָּם
  choice: leur honte
  rationale: Le terme appartient au champ de la honte et du déshonneur. « Leur honte » est concis, fidèle et laisse ouverte la nuance entre sentiment de honte et situation honteuse.
- source_word: הָאֹמְרִים
  choice: ceux qui disent
  rationale: Le participe substantivé désigne le groupe caractérisé par cette parole. La formulation française est directe et naturelle.
- source_word: הֶאָח הֶאָח
  choice: Ah ! Ah !
  rationale: L’interjection répétée exprime la jubilation malveillante ou la moquerie. « Ah ! Ah ! » demeure idiomatique en français et préserve la répétition emphatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La tournure optative « Qu’ils… » conserve la force imprécatoire du verset; la répétition de l’interjection est maintenue.
