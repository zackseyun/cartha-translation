  text: אֱלֹהִ֥ים לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָֽׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/001.yaml
  text: O God[a], deliver me; O Yahweh, hurry to help me.
translation:
  language: fr
  text: Ô Dieu, hâte-toi de me délivrer ! Yahvé, hâte-toi de venir à mon aide !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est employé comme une invocation directe. « Ô » restitue naturellement la tonalité de la prière poétique en français.
- source_word: לְהַצִּילֵנִי
  choice: délivre-moi
  rationale: La forme causative du verbe נצל exprime l’action d’arracher quelqu’un au danger. « Délivre-moi » conserve cette portée sans la limiter au salut éternel.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte hébreu porte le nom divin personnel, et non un titre. « Yahvé » en est une transcription française courante.
- source_word: לְעֶזְרָתִי
  choice: venir à mon aide
  rationale: La préposition לְ jointe au nom עֶזְרָה évoque une intervention orientée vers le secours du psalmiste. Cette expression est idiomatique et naturelle en français.
- source_word: חוּשָׁה
  choice: hâte-toi
  rationale: L’impératif exprime une demande pressante d’intervention. « Hâte-toi » garde l’urgence et la dignité poétique de l’appel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur / l’Éternel
  rationale: Le recours à une transcription maintient dans le texte le nom personnel présent en hébreu, tandis que les traductions par un titre relèvent d’une tradition de substitution. Une note signale cette tradition sans effacer la forme source.
translation_notes:
  register: Français moderne, clair et digne, avec une syntaxe brève qui respecte l’urgence de la supplication hébraïque. « Ô » et « hâte-toi » maintiennent le registre poétique sans rendre le verset difficile à comprendre.
