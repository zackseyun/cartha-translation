  yaml_path: translation/ot/psalms/070/000.yaml
  text: For the choirmaster. Of David. For remembrance[a].
translation:
  language: fr
  text: Au chef de chœur. De David. Pour faire mémoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pour servir de mémorial », « Pour rappeler » ; il s’agit peut-être d’une indication liturgique liée au souvenir.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Au » rend naturellement le préfixe ל et la destination de la pièce.
- source_word: לְדָוִד
  choice: De David
  rationale: Le préfixe ל peut signaler l’auteur, l’appartenance, l’association ou la dédicace. « De David » conserve mieux cette polyvalence que « par David » ou « pour David ».
- source_word: לְהַזְכִּיר
  choice: Pour faire mémoire
  rationale: L’infinitif hiphil de זכר signifie faire se souvenir ou rappeler. Dans ce titre, cette formule concise garde la valeur de but sans préciser qui doit se souvenir ni imposer une interprétation cultuelle.
theological_decisions:
- issue: Fonction de לְהַזְכִּיר dans le titre
  choice: Formule de but rendue de façon neutre par « Pour faire mémoire »
  alternative: Pour servir de mémorial ; pour rappeler à Dieu ; pour que l’adorateur se souvienne
  rationale: L’hébreu ne dit pas de qui ni de quoi il faut se souvenir. La traduction maintient cette indétermination et la possible fonction liturgique de la formule.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme bref et segmenté d’un titre psalmique est conservé. Le marqueur [a] est placé après la formule qu’il explique.
