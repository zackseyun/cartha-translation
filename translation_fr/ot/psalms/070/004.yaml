  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל אֱלֹהִ֑ים אֹ֝הֲבֵ֗י יְשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/004.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: fr
  text: 'Que tous ceux qui te cherchent exultent et se réjouissent en toi ! Que ceux qui aiment ton salut[a] disent sans cesse : « Que Dieu soit exalté ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta délivrance ». Le mot hébreu peut désigner le secours qui arrache à la détresse ou, plus largement, le salut.
    reason: lexical_alternative
  - marker: b
    text: Ou « Que Dieu soit reconnu comme grand ! » ou « Que Dieu soit grand ! » L’hébreu exprime un souhait ou une acclamation proclamant la grandeur de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: se réjouissent et soient dans l’allégresse
  rationale: Les deux verbes expriment une joie vive. Cette formulation naturelle conserve leur parallélisme sans les rendre par un même terme.
- source_word: בְּךָ
  choice: en toi
  rationale: La préposition peut désigner la sphère ou le fondement de la joie. « En toi » préserve l’expression dévotionnelle et son orientation vers Dieu.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: tous ceux qui te cherchent
  rationale: Le participe précédé de כָּל désigne l’ensemble des personnes caractérisées par leur recherche de Dieu.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: disent sans cesse
  rationale: L’imparfait accompagné de תָמִיד exprime une parole répétée ou continue; « sans cesse » est idiomatique en français actuel.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Que Dieu soit exalté !
  rationale: L’imparfait a ici une valeur volitive ou acclamative. La formulation retenue conserve cette force plutôt que d’en faire une simple affirmation.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: ceux qui aiment ton salut
  rationale: יְשׁוּעָה peut évoquer aussi bien la délivrance concrète que le salut au sens large. « Salut » conserve cette ampleur sémantique.
theological_decisions:
- issue: Sens de יְשׁוּעָה
  choice: salut
  alternative: délivrance
  rationale: Le mot peut désigner le secours face à la détresse ou le salut plus largement. Le texte principal garde la portée étendue de « salut », tandis que la note signale le sens concret possible.
- issue: Force volitive de יִגְדַּל אֱלֹהִים
  choice: Que Dieu soit exalté !
  alternative: Que Dieu soit reconnu comme grand ! / Que Dieu soit grand !
  rationale: La proposition fonctionne comme un souhait ou une acclamation répétée, et non comme une simple déclaration. « Soit exalté » rend naturellement cette portée en français, sans prétendre que Dieu devient intrinsèquement plus grand.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs volitifs sont rendus par « Que… », et les deux termes hébreux de joie restent distincts. Les marqueurs de notes [a] et [b] figurent dans le texte principal.
