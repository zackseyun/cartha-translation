source:
  edition: WLC
  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֱלֹהִ֪ים חֽוּשָׁ֫/ה לִּ֥/י עֶזְרִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה יְ֝הוָ֗ה אַל תְּאַחַֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: fr
  text: Mais moi, je suis pauvre et démuni. Ô Dieu, viens vite à moi[a] ! Tu es mon secours et mon libérateur. Yahweh[b], ne tarde pas !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « hâte-toi pour moi ».'
    reason: La préposition hébraïque ל peut présenter le psalmiste comme celui vers qui Dieu doit venir en hâte ou comme le bénéficiaire de son intervention urgente.
  - marker: b
    text: 'Hébreu : YHWH, le nom divin, souvent rendu par « le SEIGNEUR » dans les traductions françaises.'
    reason: La note indique la forme présente dans la source et une convention de traduction française largement répandue.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le waw suivi du pronom indépendant marque ici le contraste entre les demandes précédentes et la situation personnelle du psalmiste.
- source_word: עָנִי וְאֶבְיוֹן
  choice: pauvre et démuni
  rationale: Cette paire traditionnelle décrit une personne humble ou affligée qui manque de ressources et a besoin d’aide. « Pauvre et démuni » conserve les deux aspects sans réduire le premier terme à l’humilité spirituelle.
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom est employé comme apostrophe dans cette prière pressante ; « Ô » rend clairement le vocatif en français.
- source_word: חוּשָׁה לִי
  choice: hâte-toi vers moi
  rationale: L’impératif exprime l’urgence, et לִי peut désigner le psalmiste comme but du mouvement ou bénéficiaire de l’action. « Vers moi » conserve le sens directionnel le plus probable.
- source_word: עֶזְרִי
  choice: mon secours
  rationale: Le nom עֵזֶר désigne l’aide ou le secours plutôt que nécessairement la personne qui aide.
- source_word: וּמְפַלְטִי
  choice: et mon libérateur
  rationale: La forme issue de פלט désigne celui qui fait échapper au danger. « Libérateur » est concis, digne et naturel dans le registre des psaumes.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le texte hébreu emploie le nom divin YHWH. « Yahvé » est sa transcription française traditionnelle et permet de le distinguer du titre אֲדֹנָי, « Seigneur ».
- source_word: אַל תְּאַחַר
  choice: ne tarde pas
  rationale: 'La défense exprime une demande urgente : le psalmiste supplie Dieu de ne pas différer son intervention.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin, non un titre. Le corps du texte le transcrit afin de préserver cette distinction, tandis qu’une note signale la convention française courante qui le remplace par « le SEIGNEUR ».
- issue: Nature de la pauvreté du psalmiste
  choice: pauvre et démuni
  alternative: affligé et nécessiteux
  rationale: Les termes peuvent englober détresse sociale, vulnérabilité et affliction. La traduction choisie conserve la condition de besoin sans la spiritualiser exclusivement ni exclure la détresse plus générale.
translation_notes:
  register: Français international actuel, au registre digne et priant. L’apostrophe « Ô Dieu » et l’impératif « hâte-toi » préservent l’intensité poétique sans recourir à des tournures inutilement archaïques.
