    issue: Formulation française peu idiomatique de l’impératif avec « vers moi »
    rationale: En français, « se hâter vers quelqu’un » est possible mais raide dans une prière. Le contexte de secours permet « viens vite à moi », qui rend l’urgence de חוּשָׁה et l’orientation de לִי sans ajouter un élément théologique.
  - severity: low
    issue: Translittération du nom divin non alignée sur l’audit POB
    rationale: Le brouillon emploie « Yahvé », graphie française recevable, tandis que l’audit anglais et sa décision terminologique retiennent « Yahweh ». Employer « Yahweh » assure la cohérence éditoriale internationale tout en restant intelligible en français.
