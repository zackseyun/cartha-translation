id: PSA.70.2
reference: Psalms 70:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יֵבֹ֣שׁוּ וְ/יַחְפְּרוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָ֭חוֹר וְ/יִכָּלְמ֑וּ חֲ֝פֵצֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/070/002.yaml
  text: Let those who seek my life be put to shame and confounded[a]; let those who delight in my harm turn back and be disgraced.
translation:
  language: fr
  text: Que ceux qui en veulent à ma vie soient couverts de honte et de confusion[a] ! Que ceux qui prennent plaisir à mon malheur reculent et soient déshonorés !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soient honteux et humiliés ». Les deux verbes hébreux voisins renforcent l’idée de honte et de déconvenue.'
    reason: alternative lexicale
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: soient couverts de honte
  rationale: Le verbe בוש exprime l’expérience de la honte ou le fait d’être publiquement déconsidéré. Cette tournure française naturelle conserve ici la valeur de souhait imprécatoire.
- source_word: וְיַחְפְּרוּ
  choice: et de confusion
  rationale: חפר désigne ici l’humiliation ou la confusion. Le nom coordonné à « honte » maintient le renforcement produit par les deux verbes hébreux sans lourdeur excessive.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ceux qui en veulent à ma vie
  rationale: Dans ce contexte hostile, נפש désigne la vie ou la personne elle-même. L’expression idiomatique « en vouloir à ma vie » indique clairement une menace mortelle tout en gardant « vie ».
- source_word: יִסֹּגוּ אָחוֹר
  choice: reculent
  rationale: סוג avec אָחוֹר évoque le mouvement de retrait. « Reculent » est concis, naturel et conserve l’image spatiale.
- source_word: וְיִכָּלְמוּ
  choice: et soient déshonorés
  rationale: כלם appartient au champ de la honte et de l’opprobre. « Déshonorés » préserve sa dimension sociale et évite de répéter exactement « honte ».
- source_word: חֲפֵצֵי רָעָתִי
  choice: ceux qui prennent plaisir à mon malheur
  rationale: חפץ peut exprimer le plaisir aussi bien que le désir, tandis que רעה désigne ici le malheur qui atteint le psalmiste, non sa faute morale. Cette traduction conserve la malveillance volontaire de ses adversaires.
theological_decisions:
- issue: Valeur imprécatoire des formes verbales
  choice: Les rendre comme des souhaits ou demandes au subjonctif introduits par « Que… »
  alternative: 'Les rendre comme de simples futurs : « Ils seront… »'
  rationale: Dans cette prière psalmique, les imparfaits ont une valeur volitive ou jussive. Le français « Que… » exprime la demande sans transformer celle-ci en prédiction certaine.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique et la tension imprécatoire sont conservés; le point d’exclamation rend naturellement la force de la prière.
