source:
  edition: WLC
  text: כִּ֤י אֵ֖ין חַרְצֻבּ֥וֹת לְ/מוֹתָ֗/ם וּ/בָרִ֥יא אוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: fr
  text: Car ils n’ont pas de tourments à l’heure de leur mort[a], et leur corps est robuste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à leur mort ». Le rapport précis exprimé par la préposition hébraïque est incertain.'
    reason: Préserver l’ambiguïté de לְמוֹתָם et signaler la compréhension traditionnelle reprise par la version anglaise.
  - marker: b
    text: 'Le dernier membre de la phrase est difficile en hébreu. On peut aussi comprendre : « leur vigueur est intacte ».'
    reason: Le sens exact de אוּלָם et sa relation avec בָרִיא restent incertains.
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: tourments
  rationale: Ce terme rare peut désigner des liens ou, au sens figuré, des douleurs et des souffrances. « Tourments » garde une portée assez large et convient au contexte.
- source_word: לְמוֹתָם
  choice: quand vient leur mort
  rationale: La préposition לְ peut ici situer les tourments par rapport à leur mort. Cette formulation française exprime naturellement l’idée d’une mort sans agonie, sans exclure l’autre compréhension traditionnelle signalée en note.
- source_word: וּבָרִיא אוּלָם
  choice: et leur corps est bien nourri
  rationale: בָּרִיא évoque ce qui est gras, bien portant ou prospère, tandis que אוּלָם est un terme difficile généralement compris ici comme le corps ou la vigueur physique. La traduction restitue l’image de bonne condition physique sans employer une formulation française péjorative.
theological_decisions:
- issue: Nature apparente de la prospérité des méchants
  choice: Conserver l’affirmation provocante selon laquelle ils ne connaissent pas de tourments à l’approche de la mort.
  alternative: Atténuer l’énoncé en le présentant explicitement comme une simple impression du psalmiste.
  rationale: Le verset expose sans correction immédiate la perception qui nourrit la crise du psalmiste; l’interprétation théologique vient dans la suite du psaume.
translation_notes:
  register: Français international moderne, simple et digne. « Quand vient leur mort » évite une tournure trop technique; « bien nourri » conserve l’image antique de l’embonpoint comme signe de prospérité, tandis que les notes rendent visibles les deux principales incertitudes du texte hébreu.
