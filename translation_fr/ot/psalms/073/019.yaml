review_pass:
  verdict: revise
  source_fidelity: 'La première proposition rend bien la valeur exclamative de אֵיךְ et la soudaineté de כְרָגַע. Toutefois, « un lieu dévasté » introduit indûment une catégorie spatiale : les personnes évoquées ne deviennent pas un lieu. « Réduits à la désolation » rend le résultat de לְשַׁמָּה sans cette restriction. « Ils ont péri, consumés par les terreurs » préserve le parallélisme intensif de סָפוּ / תַמּוּ et la relation causale exprimée par מִן.'
  naturalness: Le français est globalement fluide et d’un registre poétique soutenu. La formulation révisée est plus idiomatique que l’image de personnes devenant « un lieu dévasté » et conserve la concision du verset.
  terminology: « Désolation » convient dans un texte poétique et biblique pour exprimer à la fois la ruine et, en note, la nuance d’horreur ou de stupeur. « Terreurs » rend sobrement בַּלָּהוֹת sans imposer une interprétation précise de leur nature.
  issues:
  - severity: medium
    issue: « un lieu dévasté »
    rationale: Cette expression transforme les sujets humains du verset en un emplacement géographique. L’hébreu לְשַׁמָּה désigne l’état ou le résultat de désolation, avec une possible nuance d’objet d’horreur, mais ne requiert pas « lieu ».
  - severity: low
    issue: Rendu actif « les terreurs les ont anéantis »
    rationale: Le sens causal est défendable, mais « consumés par les terreurs » reproduit plus directement la construction finale et maintient mieux le parallélisme passif/résultatif.
