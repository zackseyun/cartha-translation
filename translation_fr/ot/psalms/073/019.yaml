  text: אֵ֤יךְ הָי֣וּ לְ/שַׁמָּ֣ה כְ/רָ֑גַע סָ֥פוּ תַ֝֗מּוּ מִן בַּלָּהֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/019.yaml
  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: fr
  text: Comme ils ont été réduits, en un instant, à la désolation[a] ! Ils ont péri, consumés par les terreurs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un objet d’épouvante » ; le mot peut désigner une ruine dont la vue provoque l’effroi ou la stupeur.
    reason: lexical_alternative
  - marker: b
    text: Ou « Ils ont disparu ; les terreurs les ont anéantis. »
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Comme
  rationale: Introduit ici une exclamation devant un renversement saisissant, et non une question demandant une information.
- source_word: הָיוּ לְשַׁמָּה
  choice: ils sont devenus […] un lieu dévasté
  rationale: Le verbe avec לְשַׁמָּה exprime le passage à un état de dévastation. Cette formulation conserve le mouvement résultatif et l’image concrète.
- source_word: כְרָגַע
  choice: en un instant
  rationale: Rend naturellement la soudaineté et l’extrême brièveté exprimées par la locution hébraïque.
- source_word: סָפוּ
  choice: Ils ont disparu
  rationale: Le verbe indique qu’ils ont pris fin ou péri, sans préciser davantage la manière.
- source_word: תַמּוּ
  choice: les ont anéantis
  rationale: Exprime l’achèvement total et renforce le verbe précédent dans le parallélisme.
- source_word: מִן בַּלָּהוֹת
  choice: les terreurs les ont anéantis
  rationale: מִן peut indiquer ici la cause efficace de leur fin. La tournure active est idiomatique en français tout en conservant les terreurs comme agent causal.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure exclamative et le parallélisme poétique sont préservés ; « un lieu dévasté » évite le caractère peu naturel de « une désolation » en français courant.
