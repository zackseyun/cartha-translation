revisions:
- from: Comme ils sont devenus, en un instant, un lieu dévasté[a] ! Ils ont disparu ; les terreurs les ont anéantis[b].
  to: Comme ils ont été réduits, en un instant, à la désolation[a] ! Ils ont péri, consumés par les terreurs[b].
  rationale: La révision retire le glissement sémantique de « lieu » tout en conservant l’exclamation, l’instantanéité et les deux verbes hébreux en parallélisme. Les notes maintiennent les alternatives lexicales sans résoudre de manière excessive la nuance de שַׁמָּה ni la relation de מִן aux terreurs.
