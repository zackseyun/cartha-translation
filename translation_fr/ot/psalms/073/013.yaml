id: PSA.73.13
reference: Psalms 73:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַךְ רִ֭יק זִכִּ֣יתִי לְבָבִ֑/י וָ/אֶרְחַ֖ץ בְּ/נִקָּי֣וֹן כַּפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/013.yaml
  text: Surely in vain I have kept my heart pure[b][a], and washed my hands in innocence.
translation:
  language: fr
  text: 'Oui, c’est en vain[a] que j’ai gardé mon cœur pur

    et lavé mes mains dans l’innocence[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour rien ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « lavé mes mains dans la pureté ». Cette image évoque ici l’innocence morale, et non un simple lavage physique.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule introduit avec emphase la conclusion amère du psalmiste. « Oui » restitue naturellement cette force affirmative et réfléchie sans lui donner un sens restrictif.
- source_word: רִיק
  choice: en vain
  rationale: Le terme exprime ici l’inutilité apparente ou l’absence de résultat. « En vain » est idiomatique en français et convient au contexte de plainte.
- source_word: זִכִּיתִי
  choice: j’ai gardé … pur
  rationale: Le verbe peut exprimer le fait de rendre pur ou de maintenir dans la pureté. Avec « mon cœur », cette formulation française naturelle conserve le sens moral et la portée actuelle de l’accompli.
- source_word: לְבָבִי
  choice: mon cœur
  rationale: Dans ce contexte poétique, le cœur désigne le centre intérieur, moral et volontaire de la personne. Le terme français garde cette richesse sans paraphrase explicative.
- source_word: וָאֶרְחַץ
  choice: et lavé
  rationale: Le verbe signifie « laver » et poursuit l’action parallèle de la première proposition. L’ellipse de « j’ai » est naturelle en français tout en maintenant le parallélisme.
- source_word: בְּנִקָּיוֹן
  choice: dans l’innocence
  rationale: Le nom évoque à la fois propreté, pureté et innocence. Dans l’image des mains lavées, « dans l’innocence » préserve sa valeur morale sans exclure l’arrière-plan concret ou rituel.
- source_word: כַּפָּי
  choice: mes mains
  rationale: Bien que le mot désigne littéralement les paumes, « mes mains » est l’équivalent idiomatique français dans cette image d’innocence.
theological_decisions:
- issue: Portée morale ou rituelle de l’image de purification
  choice: Conserver l’image du lavage des mains tout en faisant ressortir son sens moral d’innocence.
  alternative: Comprendre principalement le langage comme une référence à la pureté rituelle.
  rationale: Le parallélisme entre le cœur et les mains, ainsi que le contexte de la plainte, oriente vers l’intégrité morale, mais la traduction garde l’image concrète et ne supprime pas entièrement sa résonance rituelle.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé sur deux lignes. « Oui » marque la conclusion emphatique, tandis que la tournure « c’est en vain que » rend la plainte naturelle en français.
