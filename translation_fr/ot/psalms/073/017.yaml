  text: עַד אָ֭בוֹא אֶל מִקְדְּשֵׁי אֵ֑ל אָ֝בִ֗ינָה לְ/אַחֲרִיתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/017.yaml
  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
translation:
  language: fr
  text: jusqu’à ce que j’entre dans les sanctuaires de Dieu[a] ; alors j’ai compris leur fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire de Dieu ». L’hébreu emploie un pluriel, « sanctuaires », qui peut désigner collectivement les espaces sacrés de Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur sort final » ou « leur issue ». L’hébreu évoque leur destinée finale ou leur issue ultime.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Introduit le moment décisif jusqu’auquel dure la perplexité du psalmiste.
- source_word: אָבוֹא
  choice: j’entre
  rationale: Après עַד, le verbe désigne l’entrée qui marque le tournant du récit. Le présent du subjonctif est requis en français après « jusqu’à ce que ».
- source_word: אֶל
  choice: dans
  rationale: Avec « entrer », « dans » exprime naturellement le mouvement vers l’intérieur du lieu sacré.
- source_word: מִקְדְּשֵׁי אֵל
  choice: les sanctuaires de Dieu
  rationale: Le nom hébreu est au pluriel construit. Le pluriel est conservé pour respecter la forme du texte source, tout en pouvant désigner collectivement les espaces sacrés de Dieu.
- source_word: אֵל
  choice: Dieu
  rationale: Dans ce contexte, אֵל est une désignation divine rendue naturellement par « Dieu ».
- source_word: אָבִינָה
  choice: alors j’ai compris
  rationale: Le verbe exprime l’acquisition du discernement. « Alors » explicite sobrement la succession impliquée par les propositions.
- source_word: לְאַחֲרִיתָם
  choice: leur fin
  rationale: אַחֲרִית désigne ici la fin, l’issue ultime ou le destin final des personnes évoquées. « Leur fin » demeure concise et conserve la gravité de l’expression.
theological_decisions:
- issue: Faut-il rendre מִקְדְּשֵׁי par un singulier traditionnel ou conserver le pluriel hébreu ?
  choice: les sanctuaires de Dieu
  alternative: le sanctuaire de Dieu
  rationale: Le texte principal conserve le pluriel morphologique sans imposer une interprétation particulière. Celui-ci peut désigner collectivement l’ensemble des espaces sacrés.
- issue: Portée de אַחֲרִיתָם
  choice: leur fin
  alternative: leur sort final / leur issue
  rationale: La traduction maintient l’ouverture entre la fin historique, l’issue ultime et le destin final, sans préciser davantage que l’hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le pluriel inhabituel « sanctuaires » est maintenu par fidélité au texte hébreu et expliqué en note.
