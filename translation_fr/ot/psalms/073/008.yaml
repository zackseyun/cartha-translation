  text: יָמִ֤יקוּ וִ/ידַבְּר֣וּ בְ/רָ֣ע עֹ֑שֶׁק מִ/מָּר֥וֹם יְדַבֵּֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/008.yaml
  text: They scoff and speak with malice[a]; from on high they speak oppression.
translation:
  language: fr
  text: Ils se moquent et tiennent des propos oppressifs avec méchanceté[a] ; ils parlent avec hauteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils raillent et tiennent des propos mauvais au sujet de l’oppression ; ils parlent d’en haut. » Le sens du premier verbe hébreu est difficile. « D’en haut » peut aussi exprimer une manière arrogante (« avec hauteur ») plutôt qu’une position.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: Ils se moquent
  rationale: Le hifil de מוק est difficile ici. Dans le contexte de paroles arrogantes, « se moquent » exprime le mépris hostile tout en évitant le sens plus conjectural « sont corrompus ».
- source_word: וִידַבְּרוּ
  choice: et parlent
  rationale: La conjonction suivie de l’imparfait poursuit la description du comportement des méchants ; le français omet naturellement la répétition du sujet.
- source_word: בְרָע
  choice: avec méchanceté
  rationale: La construction ב + רַע décrit la manière ou le contenu de leurs paroles. « Avec méchanceté » garde la portée morale du terme sans préciser excessivement s’il s’agit de malveillance intérieure ou de propos mauvais.
- source_word: עֹשֶׁק
  choice: oppression
  rationale: Le nom désigne couramment l’oppression ou l’exploitation. « Oppression » en conserve la portée sociale et éthique sans la réduire à l’extorsion financière.
- source_word: מִמָּרוֹם
  choice: de haut
  rationale: Littéralement « depuis une hauteur / d’en haut ». Ici, l’expression peut évoquer une position élevée ou, plus probablement, une manière hautaine ; « de haut » préserve cette ambiguïté en français.
- source_word: יְדַבֵּרוּ
  choice: ils parlent
  rationale: La répétition du verbe est conservée afin de respecter l’insistance et la structure parallèle de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La répétition de « parlent » suit l’insistance de l’hébreu. « De haut » reste idiomatique tout en maintenant l’ambiguïté entre position élevée et attitude hautaine.
