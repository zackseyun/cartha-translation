id: PSA.73.28
reference: Psalms 73:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אֲנִ֤י קִֽרֲבַ֥ת אֱלֹהִ֗ים לִ֫/י ט֥וֹב שַׁתִּ֤י בַּ/אדֹנָ֣/י יְהֹוִ֣ה מַחְסִ֑/י לְ֝/סַפֵּ֗ר כָּל מַלְאֲכוֹתֶֽי/ךָ׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/028.yaml
  text: But as for me[a], the nearness of God is good for me; I have made the Lord GOD my refuge, so that I may tell of all your works.
translation:
  language: fr
  text: Mais pour moi, la proximité de Dieu est bonne pour moi[a] ; j’ai fait du Seigneur Yahweh mon refuge, afin de raconter toutes tes œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « M’approcher de Dieu est bon pour moi ». Le nom hébreu peut désigner la proximité relationnelle avec Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais pour moi
  rationale: La conjonction et le pronom indépendant marquent le contraste emphatique avec le sort des méchants décrit auparavant.
- source_word: קִרֲבַת אֱלֹהִים
  choice: la proximité de Dieu
  rationale: Cette formulation nominale reste proche de l’hébreu et conserve l’ambiguïté entre la proximité de Dieu et la proximité auprès de Dieu.
- source_word: לִי טוֹב
  choice: est mon bien
  rationale: Le datif personnel et l’adjectif expriment ici ce qui constitue le bien du psalmiste ; cette tournure française est concise, digne et cohérente avec la construction nominale.
- source_word: שַׁתִּי
  choice: j’ai fait de
  rationale: Dans l’expression avec « mon refuge », le verbe indique un choix délibéré et une confiance placée en Dieu.
- source_word: בַּאדֹנָי יְהוִה
  choice: du Seigneur Yahweh
  rationale: Le titre אֲדֹנָי est rendu par « Seigneur » et le nom divin יהוה par « Yahweh », ce qui distingue les deux éléments du syntagme hébreu.
- source_word: מַחְסִי
  choice: mon refuge
  rationale: « Refuge » rend directement מַחְסֶה et convient au langage poétique des Psaumes.
- source_word: לְסַפֵּר
  choice: afin de raconter
  rationale: L’infinitif précédé de ל peut exprimer le but ; « raconter » traduit l’idée d’énumérer ou de proclamer ce que Dieu a accompli.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: toutes tes œuvres
  rationale: La traduction conserve le quantificateur et rend מְלָאכָה par son équivalent direct dans ce contexte des actions de Dieu.
theological_decisions:
- issue: Rendu du nom divin יהוה dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Yahweh » préserve le nom divin explicite et évite en français la répétition « Seigneur SEIGNEUR », tandis que « Seigneur » rend le titre אֲדֹנָי.
- issue: Sens de קִרֲבַת אֱלֹהִים
  choice: la proximité de Dieu
  alternative: m’approcher de Dieu
  rationale: La formulation nominale préserve la tension du génitif hébreu, qui peut évoquer aussi bien la proximité de Dieu que le fait d’être ou de venir près de lui ; l’autre lecture est signalée en note.
- issue: Relation exprimée par לְסַפֵּר
  choice: afin de raconter
  alternative: et je raconterai
  rationale: Le ל attaché à l’infinitif se lit naturellement comme l’expression d’un but, sans imposer une nouvelle proposition indépendante.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe nominale du premier membre est conservée afin de respecter la poésie et l’ambiguïté de l’hébreu ; le tutoiement correspond à l’adresse directe à Dieu dans le dernier membre.
