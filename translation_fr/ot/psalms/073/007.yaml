  text: יָ֭צָא מֵ/חֵ֣לֶב עֵינֵ֑/מוֹ עָ֝בְר֗וּ מַשְׂכִּיּ֥וֹת לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/007.yaml
  text: Their eyes bulge out from fatness[a]; the imaginations of their heart overflow.
translation:
  language: fr
  text: Leurs yeux font saillie à force d’embonpoint[a] ; les imaginations de leur cœur débordent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Leurs yeux font saillie à cause de la graisse ; les pensées ou les projets de leur cœur dépassent toute mesure. »'
    reason: 'La formulation hébraïque est très condensée : le verbe « sortir » peut décrire des yeux saillants, et « imaginations » ainsi que « dépasser » admettent plusieurs nuances.'
lexical_decisions:
- source_word: יָצָא
  choice: ressortent
  rationale: Le verbe signifie littéralement « sortir ». Avec « yeux » comme sujet, « ressortent » conserve l’image concrète d’yeux qui font saillie tout en restant naturel en français.
- source_word: מֵחֵלֶב
  choice: de la graisse
  rationale: Le nom désigne littéralement la graisse et évoque ici l’embonpoint ou la prospérité excessive. La traduction maintient l’image corporelle sans la réduire à la seule richesse.
- source_word: עֵינֵימוֹ
  choice: leurs yeux
  rationale: Le pluriel muni du suffixe de troisième personne du masculin pluriel se rend directement par « leurs yeux ».
- source_word: עָבְרוּ
  choice: débordent
  rationale: Le verbe signifie « passer, franchir, dépasser ». « Débordent » exprime ici l’idée d’un excès qui franchit les limites et convient au parallélisme poétique.
- source_word: מַשְׂכִּיּוֹת
  choice: imaginations
  rationale: Le terme peut désigner des images, des conceptions, des pensées ou des projets. « Imaginations » préserve la dimension intérieure sans préciser indûment s’il s’agit de fantasmes, d’images ou de desseins.
- source_word: לֵבָב
  choice: leur cœur
  rationale: Le cœur est ici le siège collectif de la pensée et du désir. Le singulier collectif de l’hébreu est conservé.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La traduction conserve les deux images d’excès du texte hébreu ainsi que l’ambiguïté de מַשְׂכִּיּוֹת, sans transformer explicitement la graisse en richesse.
