review_pass:
  verdict: revise
  source_fidelity: 'La seconde proposition rend de façon défendable l’idée de dépassement/excès d’« imaginations » (מַשְׂכִּיּוֹת) du cœur. En revanche, « ressortent de la graisse » suggère que les yeux émergent matériellement de la graisse, ce qui n’est ni idiomatique en français ni une bonne restitution de l’image : le texte décrit des yeux qui font saillie en raison de l’embonpoint/de la graisse.'
  naturalness: « Leurs yeux ressortent de la graisse » est maladroit et prête à une lecture concrète involontaire. « Font saillie à force d’embonpoint » est naturel, conserve l’image corporelle et le ton poétique. « Les imaginations de leur cœur débordent » reste possible dans un registre biblique moderne, même si la formule est volontairement condensée comme l’hébreu.
  terminology: « Embonpoint » rend ici la graisse corporelle sans réduire l’image à la richesse. « Imaginations » maintient utilement l’indétermination de מַשְׂכִּיּוֹת entre pensées, conceptions et projets. « Cœur » conserve le terme anthropologique hébreu sans imposer une interprétation doctrinale.
  issues:
