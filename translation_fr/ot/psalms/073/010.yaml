  text: לָ/כֵ֤ן ישיב עַמּ֣/וֹ הֲלֹ֑ם וּ/מֵ֥י מָ֝לֵ֗א יִמָּ֥צוּ לָֽ/מוֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/010.yaml
  text: Therefore his people turn back here[c][b][a], and waters of fullness are drained by them.
translation:
  language: fr
  text: C’est pourquoi son peuple revient ici[a], et des eaux abondantes[b] sont épuisées par eux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est pourquoi il ramène son peuple ici ». Le verbe peut se comprendre au sens intransitif (« revenir ») ou transitif (« ramener »).
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des eaux de plénitude » ; l’expression désigne probablement des eaux abondantes, mais l’image reste difficile.
    reason: lexical_alternative
  - marker: c
    text: Ou « des eaux à pleine mesure sont pressées jusqu’à la dernière goutte pour eux ». Le verbe et le pronom final sont difficiles à interpréter ; la ligne peut évoquer une part abondante qui leur est accordée plutôt que des eaux épuisées par eux.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque clairement la conséquence découlant de la description précédente, dans un français naturel.
- source_word: ישיב
  choice: revient
  rationale: Le hiphil de שוב peut être compris ici avec un sens intransitif (« revenir ») ou transitif (« ramener »). Le sens intransitif donne une proposition lisible sans introduire de complément non exprimé.
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Reproduit le syntagme avec suffixe masculin singulier tout en laissant indéterminé l’antécédent de « son ».
- source_word: הֲלֹם
  choice: ici
  rationale: Rend simplement l’adverbe de lieu, qui peut exprimer la position ou le mouvement vers ce lieu.
- source_word: וּמֵי מָלֵא
  choice: et des eaux en abondance
  rationale: Exprime en français courant l’image littérale difficile d’« eaux de plénitude » ou d’« eaux pleines », sans en préciser abusivement le sens.
- source_word: יִמָּצוּ
  choice: sont épuisées
  rationale: Le niphal de מצה évoque ce qui est vidé, drainé ou pressé jusqu’au bout. « Sont épuisées » conserve la voix passive et l’idée d’un contenu entièrement retiré.
- source_word: לָמוֹ
  choice: par eux
  rationale: Avec le passif, cette lecture donne au pronom une valeur d’agent, mais la valeur bénéficiaire « pour eux » demeure possible et est signalée en note.
theological_decisions:
- issue: Référent du possessif dans « son peuple »
  choice: Le référent reste indéterminé dans le texte principal.
  alternative: Il peut s’agir du peuple de l’impie ou du peuple de Dieu.
  rationale: Le suffixe hébreu n’identifie pas explicitement son antécédent, et la syntaxe du verset est obscure. La traduction ne tranche donc pas une ambiguïté susceptible d’influer sur l’interprétation.
translation_notes:
  register: Français international moderne, poétique mais accessible. La formulation conserve volontairement l’étrangeté de la seconde proposition et les ambiguïtés syntaxiques de l’hébreu.
