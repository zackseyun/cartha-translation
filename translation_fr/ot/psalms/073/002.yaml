  text: וַ/אֲנִ֗י כִּ֭/מְעַט נטוי רַגְלָ֑/י כְּ֝/אַ֗יִן שפכה אֲשֻׁרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/002.yaml
  text: But as for me[a], my feet had almost stumbled; my steps had nearly slipped.
translation:
  language: fr
  text: Mais moi, mes pieds ont failli fléchir ; mes pas ont presque glissé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Mais moi, mes pieds ont presque dévié ; mes pas ont failli glisser. » Les deux lignes hébraïques emploient des images proches et en partie superposées d’une perte de stabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: La conjonction et le pronom indépendant marquent à la fois le contraste avec ce qui précède et l’insistance sur le psalmiste.
- source_word: כִּמְעַט
  choice: j’ai bien failli
  rationale: Cette tournure française naturelle exprime un événement qui a été sur le point de se produire et renforce ici l’idée de quasi-chute.
- source_word: נטוי
  choice: trébucher
  rationale: Dans l’image des pieds qui perdent leur stabilité, « trébucher » rend naturellement l’idée de vaciller ou dévier sans préciser au-delà de l’hébreu la nature de la crise.
- source_word: רַגְלָי
  choice: '[sujet implicite de] j’ai… trébucher'
  rationale: Le français idiomatique exprime ici l’image corporelle par le verbe « trébucher » appliqué au locuteur ; la variante en note restitue explicitement « mes pieds ».
- source_word: כְּאַיִן
  choice: presque
  rationale: Dans cet emploi adverbial, l’expression signifie que le résultat a été évité de très peu.
- source_word: שפכה
  choice: ont glissé
  rationale: Le sens premier de « se répandre » ou « être versé » forme ici, avec « pas », une image de perte d’appui que « glisser » rend clairement.
- source_word: אֲשֻׁרָי
  choice: mes pas
  rationale: « Mes pas » conserve l’image concrète de la démarche et, sans l’expliciter, sa portée possible pour la conduite de la vie.
theological_decisions:
- issue: Nature de l’instabilité évoquée
  choice: Conserver l’image de la quasi-chute et des pas qui glissent sans l’expliquer.
  alternative: Traduire explicitement par « j’ai presque perdu la foi » ou « je me suis presque égaré ».
  rationale: Le verset peut évoquer une crise spirituelle ou morale, mais il ne la définit pas directement. Garder la métaphore préserve cette ouverture et la tension théologique du psaume.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au récit personnel dans l’usage courant ; le parallélisme poétique et l’image des pas sont maintenus.
