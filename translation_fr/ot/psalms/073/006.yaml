  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: fr
  text: C’est pourquoi l’orgueil est leur collier[a] ; la violence les enveloppe comme un vêtement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est pourquoi l’orgueil les pare comme un collier ; la violence les drape comme un vêtement. »'
    reason: Alternative lexicale et syntaxique conservant la valeur imagée possible de עֲנָקַתְמוֹ et יַעֲטָף.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque la conséquence de la description précédente et maintient clairement le lien logique.
- source_word: עֲנָקַתְמוֹ
  choice: est leur collier
  rationale: Le terme évoque un ornement porté au cou ; cette formulation concise conserve l’image et le parallélisme.
- source_word: גַאֲוָה
  choice: l’orgueil
  rationale: Dans ce contexte moral négatif, le nom désigne l’élévation arrogante de soi ; « orgueil » est naturel et traditionnel sans surinterprétation.
- source_word: יַעֲטָף
  choice: les enveloppe
  rationale: Le verbe exprime l’action d’envelopper ou de recouvrir et soutient l’image vestimentaire de façon naturelle.
- source_word: שִׁית
  choice: comme un vêtement
  rationale: Le nom désigne ici un vêtement ou une enveloppe ; « comme » explicite en français la comparaison implicite portée par l’image.
- source_word: חָמָס
  choice: la violence
  rationale: Traduction directe du terme, qui peut inclure l’injustice brutale mais désigne nettement ici la violence.
- source_word: לָמוֹ
  choice: les
  rationale: Le pronom renvoie aux méchants décrits dans le contexte ; le français l’intègre naturellement comme complément de « enveloppe ».
