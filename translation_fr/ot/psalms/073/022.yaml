source:
  edition: WLC
  text: וַ/אֲנִי בַ֭עַר וְ/לֹ֣א אֵדָ֑ע בְּ֝הֵמ֗וֹת הָיִ֥יתִי עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/022.yaml
  text: Then I was senseless and did not know[a]; I was like a beast before you.
translation:
  language: fr
  text: Et moi, j’étais alors dépourvu d’intelligence et je ne comprenais pas ; j’étais comme une bête[a] auprès de toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie le pluriel « bêtes », probablement avec une valeur collective ou intensive : « comme une bête » ou « pareil à une bête ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַאֲנִי
  choice: Alors, moi
  rationale: Le waw relie cet aveu à la prise de conscience exprimée auparavant. « Alors » rend cette progression réflexive, tandis que « moi » conserve l’insistance portée par le pronom hébreu.
- source_word: בַּעַר
  choice: dépourvu d’intelligence
  rationale: Le terme décrit quelqu’un d’obtus, presque bestial, plutôt qu’une simple ignorance. Cette formulation reste forte, naturelle et digne, sans la brutalité moderne de « stupide ».
- source_word: וְלֹא אֵדָע
  choice: et je ne comprenais pas
  rationale: ידע signifie fondamentalement « savoir, connaître », mais, dans ce parallèle avec le manque d’intelligence, « comprendre » exprime naturellement en français l’incapacité reconnue par le psalmiste.
- source_word: בְּהֵמוֹת
  choice: comme une bête
  rationale: La forme est morphologiquement plurielle, mais elle peut avoir une valeur collective ou intensive. Le singulier comparatif rend naturellement en français l’image d’un comportement sans intelligence.
- source_word: הָיִיתִי
  choice: j’étais
  rationale: La forme verbale décrit ici l’état antérieur du psalmiste, sans imposer l’idée d’un changement exprimée par « je suis devenu ».
- source_word: עִמָּךְ
  choice: auprès de toi
  rationale: La préposition signifie normalement « avec ». « Auprès de toi » préserve l’idée de proximité ou de relation avec Dieu tout en étant plus idiomatique ici que « avec toi » et moins interprétatif que « devant toi ».
theological_decisions:
- issue: Portée de l’image animale dans l’aveu du psalmiste
  choice: 'Une comparaison exprimant son manque d’intelligence : « j’étais comme une bête auprès de toi »'
  alternative: Une formulation plus littérale, « j’étais des bêtes avec toi », ou plus interprétative, « j’étais devant toi comme un animal privé de raison »
  rationale: Le verset confesse l’aveuglement du psalmiste sans formuler une doctrine générale sur la nature humaine. La traduction garde la force humiliante de l’image sans l’expliquer excessivement.
- issue: Sens relationnel ou spatial de עִמָּךְ
  choice: auprès de toi
  alternative: avec toi ; devant toi
  rationale: Le sens ordinaire de la préposition est « avec ». « Auprès de toi » laisse entendre que cet état existait jusque dans la proximité de Dieu, sans trancher en faveur de la seule idée de comparution « devant » lui.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme de l’hébreu et la vigueur de l’auto-accusation, tout en évitant les tournures archaïques ou inutilement insultantes.
