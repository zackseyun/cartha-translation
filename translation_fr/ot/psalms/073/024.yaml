  text: בַּ/עֲצָתְ/ךָ֥ תַנְחֵ֑/נִי וְ֝/אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: fr
  text: Tu me conduis par ton conseil, puis tu me prendras dans la gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puis tu me prendras avec honneur ». L’hébreu est concis : la relation de « gloire » avec les autres mots de la phrase est discutée.'
    reason: La construction hébraïque de אַחַר כָּבוֹד תִּקָּחֵנִי permet de comprendre כָּבוֹד comme « gloire » ou « honneur »; la note conserve cette ambiguïté sans suraffirmer une analyse syntaxique contestée.
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: par ton conseil
  rationale: 'Le nom עֵצָה désigne le conseil ou le dessein, et la préposition בְּ exprime ici naturellement le moyen : Dieu conduit le psalmiste par son conseil.'
- source_word: תַנְחֵנִי
  choice: tu me conduis
  rationale: Le hiphil de נחה signifie conduire ou guider. « Tu me conduis » est naturel en français et conserve l’image d’une direction donnée par Dieu.
- source_word: וְאַחַר
  choice: puis
  rationale: אַחַר a ici une valeur temporelle. « Puis » rend clairement la succession sans préciser davantage le moment.
- source_word: כָּבוֹד
  choice: la gloire
  rationale: כָּבוֹד peut signifier gloire ou honneur. « La gloire » préserve la portée élevée et possiblement eschatologique du passage.
- source_word: תִּקָּחֵנִי
  choice: tu me prendras
  rationale: לקח signifie prendre et peut, selon le contexte, évoquer le fait d’accueillir ou de recueillir. « Tu me prendras » reste proche du verbe hébreu sans imposer une interprétation plus précise.
theological_decisions:
- issue: Sens de אַחַר כָּבוֹד תִּקָּחֵנִי
  choice: « puis tu me prendras dans la gloire »
  alternative: « puis tu me prendras avec honneur »
  rationale: La syntaxe hébraïque est concise et permet de comprendre כָּבוֹד comme la destination ou l’état glorieux dans lequel Dieu prend le psalmiste, mais aussi comme la manière honorable dont il le prend. Le texte principal adopte une formulation française naturelle à portée eschatologique ouverte, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français moderne, digne et accessible. La formulation reste proche de l’image hébraïque tout en signalant en note l’ambiguïté de la dernière proposition.
