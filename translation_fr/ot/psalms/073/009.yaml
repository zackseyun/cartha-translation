  text: They set their mouth against the heavens[b][a], and their tongue struts through the earth.
translation:
  language: fr
  text: Ils dressent leur bouche contre les cieux[a], et leur langue parcourt la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils placent leur bouche dans les cieux ». La préposition hébraïque signifie littéralement « dans » ; dans le contexte, elle peut évoquer des paroles lancées avec défi contre les cieux.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « marche dans la terre » ou « va dans la terre » ; avec ce verbe de mouvement, le sens peut être « parcourt la terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁתּוּ
  choice: dirigent
  rationale: Le verbe signifie fondamentalement « placer, mettre ». Avec « bouche » et dans ce contexte de parole arrogante, « dirigent » produit en français une expression naturelle sans attribuer au verbe seul toute la nuance d’hostilité.
- source_word: בַשָּׁמַיִם
  choice: contre les cieux
  rationale: La préposition signifie littéralement « dans », mais le contexte permet de comprendre que la parole est dirigée avec défi vers le domaine céleste. Le pluriel « les cieux » conserve la forme et la portée poétique de l’hébreu.
- source_word: פִּיהֶם
  choice: leur bouche
  rationale: Le singulier hébreu a une valeur collective avec un possesseur pluriel. Le français peut conserver ce singulier, qui maintient aussi le parallélisme avec « leur langue ».
- source_word: וּלְשׁוֹנָם
  choice: et leur langue
  rationale: Le singulier représentatif est conservé afin de préserver l’image poétique et le parallélisme du vers.
- source_word: תִּהֲלַךְ
  choice: parcourt
  rationale: Le verbe signifie littéralement « marcher, aller ». Avec « la terre », « parcourt » rend naturellement l’idée d’un déplacement étendu, sans rendre explicite une nuance d’arrogance qui provient surtout du contexte.
- source_word: בָּאָרֶץ
  choice: la terre
  rationale: Le contraste avec « les cieux » favorise « la terre » plutôt que « le pays » et suggère une portée cosmique.
theological_decisions: []
translation_notes:
  register: Français moderne, poétique et digne. La formulation conserve les images corporelles de la bouche et de la langue ainsi que le contraste entre les cieux et la terre, tout en signalant l’ambiguïté de la préposition hébraïque.
