  text: בַּ/עֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑/מוֹ וְ/עִם אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: fr
  text: Ils ne connaissent pas les peines des mortels[a], et avec les humains ils ne sont pas frappés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils n’ont pas part au dur labeur des mortels et, avec les humains, ils ne sont pas affligés. »'
    reason: La valeur de עָמָל va de « labeur » à « peine, souffrance », et les deux membres peuvent être rendus de façon plus littérale.
lexical_decisions:
- source_word: בַּעֲמַל
  choice: les peines
  rationale: עָמָל peut désigner la peine, la souffrance ou le labeur. « Les peines » exprime ici les épreuves qui accablent ordinairement les humains, tout en restant naturel en français.
- source_word: אֱנוֹשׁ
  choice: des mortels
  rationale: אֱנוֹשׁ évoque souvent l’être humain dans sa faiblesse et sa mortalité. « Des mortels » conserve cette nuance.
- source_word: אֵינֵמוֹ
  choice: ils ne connaissent pas
  rationale: La tournure existentielle négative indique que ces peines ne sont pas leur lot. « Ils ne connaissent pas » rend cet idiome naturellement sans signifier une simple ignorance intellectuelle.
- source_word: וְעִם
  choice: comme les autres
  rationale: Littéralement « avec », la préposition associe ici les personnes visées au sort commun de l’humanité. « Comme les autres » explicite naturellement la comparaison implicite en français.
- source_word: אָדָם
  choice: humains
  rationale: אָדָם désigne ici collectivement l’humanité. « Les autres humains » est inclusif, courant et permet de distinguer ce terme d’אֱנוֹשׁ dans le premier membre.
- source_word: יְנֻגָּעוּ
  choice: ne sont pas frappés
  rationale: La forme passive de נגע signifie être atteint, frappé ou affligé. « Frappés » conserve l’image et la force du terme sans imposer le sens plus spécifique de « tourmentés » ou « frappés d’une plaie ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et poétique, avec un parallélisme fluide. « Les mortels » préserve la fragilité suggérée par אֱנוֹשׁ ; « les autres humains » restitue la portée collective d’אָדָם sans employer le générique masculin « l’homme ».
