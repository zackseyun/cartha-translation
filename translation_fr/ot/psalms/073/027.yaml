id: PSA.73.27
reference: Psalms 73:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי הִנֵּ֣ה רְחֵקֶ֣י/ךָ יֹאבֵ֑דוּ הִ֝צְמַ֗תָּה כָּל זוֹנֶ֥ה מִמֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/027.yaml
  text: For behold[a], those far from you will perish; you destroy all who are unfaithful to you.
translation:
  language: fr
  text: 'Car voici : ceux qui sont loin de toi périront ; tu anéantis tous ceux qui te sont infidèles[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tous ceux qui se prostituent en se détournant de toi » ; l’hébreu emploie l’image de la prostitution pour parler de l’infidélité envers Dieu.'
    reason: alternative lexicale et préservation de la métaphore hébraïque
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: « Car » conserve la fonction explicative de כִּי dans le contexte, tandis que « voici » rend l’insistance déictique et solennelle de הִנֵּה.
- source_word: רְחֵקֶיךָ
  choice: ceux qui sont loin de toi
  rationale: Cette formulation naturelle conserve l’idée relationnelle de personnes caractérisées par leur éloignement de Dieu, sans transformer cet état en mouvement explicite.
- source_word: יֹאבֵדוּ
  choice: périront
  rationale: Le verbe אבד exprime ici la ruine ou la disparition ; « périront » en garde la force et correspond au futur hébreu.
- source_word: הִצְמַתָּה
  choice: tu anéantis
  rationale: Le hiphil de צמת signifie faire disparaître ou mettre fin à. Le présent français rend ici la valeur certaine et générale du parfait poétique tout en maintenant le parallélisme.
- source_word: כָּל זוֹנֶה מִמֶּךָּ
  choice: tous ceux qui te sont infidèles
  rationale: Le participe זנה, construit avec מִן, emploie l’image de la prostitution pour désigner l’infidélité spirituelle envers Dieu. La formulation principale communique clairement ce sens, tandis que la note conserve l’image hébraïque.
theological_decisions:
- issue: Portée métaphorique de זנה appliqué à la relation avec Dieu
  choice: Rendre dans le texte l’infidélité envers Dieu et signaler l’image de la prostitution en note
  alternative: « tous ceux qui se prostituent en se détournant de toi »
  rationale: Le contexte oppose l’éloignement de Dieu à la proximité avec lui. זנה désigne donc ici l’infidélité spirituelle ou relationnelle, sans imposer à lui seul une terminologie confessionnelle plus précise ; la note permet néanmoins de préserver la vigueur de la métaphore originale.
translation_notes:
  register: Français international moderne, sobre et poétique. « Car voici » garde la solennité du vers sans archaïsme marqué ; « anéantis » restitue la force du second hémistiche.
