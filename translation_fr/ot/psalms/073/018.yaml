source:
  edition: WLC
  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: fr
  text: Oui, tu les places sur un terrain glissant[a] ; tu les précipites dans la ruine[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans des endroits lisses ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans les ruines » ou « dans la désolation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: La particule introduit ici avec force la certitude à laquelle le psalmiste vient de parvenir, plutôt qu’une restriction.
- source_word: בַּחֲלָקוֹת
  choice: sur un terrain glissant
  rationale: Le nom désigne littéralement des endroits lisses ; dans ce contexte de chute imminente, l’image naturelle en français est celle d’un terrain glissant.
- source_word: תָּשִׁית לָמוֹ
  choice: tu les places
  rationale: Cette formulation conserve l’action directe de Dieu exprimée par le verbe à la deuxième personne et son objet pluriel.
- source_word: הִפַּלְתָּם
  choice: tu les précipites
  rationale: Le hiphil de נפל exprime une action causative, « faire tomber ». « Précipiter » restitue cette causalité et s’accorde naturellement avec l’image de la chute.
- source_word: לְמַשּׁוּאוֹת
  choice: dans la ruine
  rationale: Le pluriel hébreu peut évoquer ruines, désolations ou désastre. Le singulier collectif « la ruine » est idiomatique et conserve l’idée du résultat destructeur.
theological_decisions:
- issue: L’action divine dans la chute des méchants
  choice: « tu les places… tu les précipites »
  alternative: Une formulation qui attribuerait leur chute aux seules circonstances
  rationale: Les deux verbes hébreux s’adressent directement à Dieu et lui attribuent le placement comme la chute. La traduction maintient cette affirmation sans en atténuer la tension théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement suit l’adresse directe à Dieu dans le psaume. Le parallélisme et l’image concrète de la chute sont conservés.
