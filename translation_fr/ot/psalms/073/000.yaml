  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: fr
  text: 'Psaume d’Asaph.


    Vraiment, Dieu est bon envers Israël,

    envers ceux qui ont le cœur pur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Psaume d’Asaph
  rationale: Rend la suscription de manière française, naturelle et traditionnelle. La préposition לְ peut indiquer l’auteur, l’appartenance, la destination ou l’association, ambiguïté que la tournure française ne tranche pas entièrement.
- source_word: אַךְ
  choice: Oui
  rationale: Dans ce contexte initial, la particule exprime une affirmation forte (« oui », « vraiment », « certes »), plutôt qu’une restriction.
- source_word: טוֹב לְיִשְׂרָאֵל אֱלֹהִים
  choice: Dieu est bon pour Israël
  rationale: Suit l’ordre syntaxique naturel en français tout en conservant Israël comme bénéficiaire explicite de la bonté divine.
- source_word: לְבָרֵי לֵבָב
  choice: pour ceux qui ont le cœur pur
  rationale: Expression idiomatique claire qui conserve l’image biblique du cœur comme centre intérieur de la personne.
theological_decisions:
- issue: Lien entre « Israël » et « ceux qui ont le cœur pur »
  choice: Conserver les deux groupes en apposition sans les identifier explicitement ni les opposer
  alternative: Traduire « Dieu est bon pour Israël, c’est-à-dire pour ceux qui ont le cœur pur »
  rationale: L’hébreu juxtapose les deux expressions. La traduction préserve cette relation sans imposer une interprétation théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La mise en vers distingue la suscription du corps du psaume. « Oui » restitue la force affirmative de אַךְ sans lourdeur archaïsante.
