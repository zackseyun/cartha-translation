  text: כִּ֭י יִתְחַמֵּ֣ץ לְבָבִ֑/י וְ֝/כִלְיוֹתַ֗/י אֶשְׁתּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/021.yaml
  text: For my heart was embittered[a], and my kidneys were pierced.
translation:
  language: fr
  text: Car mon cœur s’aigrissait, et je me sentais transpercé aux reins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « aux reins » ; en hébreu, les « reins » peuvent désigner le tréfonds de l’être, notamment les émotions profondes.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication de l’aveu du psalmiste dans le contexte précédent.
- source_word: יִתְחַמֵּץ
  choice: s’aigrissait
  rationale: Le hitpael de חמץ évoque le fait de devenir aigre intérieurement; cette formulation conserve l’image tout en exprimant une amertume croissante.
- source_word: לְבָבִי
  choice: mon cœur
  rationale: Conserve le terme anthropologique hébreu courant pour le siège de la pensée, de la volonté et des émotions.
- source_word: וְכִלְיוֹתַי
  choice: mes reins
  rationale: Rend concrètement כִּלְיָה, qui désigne littéralement les reins et, par image, le tréfonds de l’être; une note explicite l’usage hébreu.
- source_word: אֶשְׁתּוֹנָן
  choice: étaient transpercés
  rationale: Ce verbe rare décrit une atteinte aiguë comparable à une perforation; l’accord avec «mes reins» suit la syntaxe de la proposition hébraïque.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. «S’aigrissait» maintient la métaphore hébraïque sans l’aplatir en simple tristesse; «reins» préserve l’image corporelle ancienne, éclairée par la note.
