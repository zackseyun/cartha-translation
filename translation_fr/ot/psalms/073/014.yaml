  text: וָ/אֱהִ֣י נָ֭גוּעַ כָּל הַ/יּ֑וֹם וְ֝/תוֹכַחְתִּ֗/י לַ/בְּקָרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/014.yaml
  text: For I was afflicted all day long[b][a], and chastened every morning.
translation:
  language: fr
  text: Car, tout le jour, j’ai été frappé[a], et chaque matin j’ai subi une correction[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « atteint » ou « affligé ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et ma correction [était] les matins ». Le sens est celui d’une correction ou d’une discipline subie de façon répétée, chaque matin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: j’ai été
  rationale: Le waw poursuit l’explication du verset précédent. « Oui » marque ici naturellement cette continuité emphatique sans imposer une causalité plus nette que l’hébreu.
- source_word: נָגוּעַ
  choice: frappé
  rationale: Le participe passif de נגע évoque le fait d’être atteint ou frappé. « Frappé » conserve l’image et reste assez large pour ne pas réduire la souffrance à une maladie.
- source_word: כָּל הַיּוֹם
  choice: tout le jour
  rationale: Cette expression rend la durée entière et répétée de l’épreuve, dans un registre français naturel et digne.
- source_word: וְתוֹכַחְתִּי
  choice: et j’ai reçu ma correction
  rationale: Littéralement, le texte porte le nom « ma correction/réprimande ». La formulation verbale française exprime naturellement la correction subie tout en maintenant le lien lexical avec le nom hébreu.
- source_word: לַבְּקָרִים
  choice: chaque matin
  rationale: Le pluriel hébreu a ici une valeur distributive et indique une expérience qui se renouvelle matin après matin.
theological_decisions:
- issue: Nature de la souffrance décrite
  choice: Une affliction et une correction générales, sans préciser leur cause ou leur forme
  alternative: Une maladie, une plaie physique ou une réprimande seulement verbale
  rationale: Les termes hébreux peuvent évoquer le fait d’être frappé et corrigé, mais ne permettent pas de limiter avec certitude l’expérience à une maladie, à une punition particulière ou à des paroles de reproche.
translation_notes:
  register: Français international moderne, sobre et poétique. « Frappé » préserve la force de l’image hébraïque ; « reçu ma correction » évite le caractère vieilli de « châtié » tout en conservant l’idée large de discipline.
