id: PSA.73.11
reference: Psalms 73:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְֽ/אָמְר֗וּ אֵיכָ֥ה יָדַֽע אֵ֑ל וְ/יֵ֖שׁ דֵּעָ֣ה בְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: fr
  text: 'Et ils disent[a] : « Comment Dieu saurait-il ? Le Très-Haut a-t-il connaissance[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et ils ont dit », si l’accompli hébreu désigne ici une parole passée plutôt qu’une attitude habituelle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « y a-t-il connaissance dans le Très-Haut ? » La question porte sur la connaissance que possède le Très-Haut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Et ils disent
  rationale: Dans ce portrait poétique, l’accompli hébreu peut décrire une parole habituelle ou caractéristique. Le présent français rend naturellement cette valeur, tout en signalant en note la lecture au passé.
- source_word: אֵיכָה יָדַע אֵל
  choice: Comment Dieu saurait-il ?
  rationale: אֵיכָה signifie « comment ? ». Le conditionnel français exprime idiomatiquement la question rhétorique et sceptique, sans ajouter une impossibilité explicite.
- source_word: וְיֵשׁ דֵּעָה
  choice: a-t-il connaissance ?
  rationale: La tournure interrogative rend l’expression existentielle hébraïque. « Avoir connaissance » est naturel en français et conserve le lien lexical avec « saurait ».
- source_word: בְעֶלְיוֹן
  choice: Le Très-Haut a-t-il connaissance
  rationale: Le sens possessif impliqué par l’expression littérale « [y a-t-il] connaissance dans le Très-Haut » est rendu en français courant, tandis que la formulation hébraïque est indiquée en note.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Titre divin français établi, qui exprime la suprématie de Dieu sans transformer le titre en nom propre distinct.
theological_decisions:
- issue: Portée du doute exprimé par les impies
  choice: Deux questions rhétoriques qui mettent en doute la connaissance de Dieu
  alternative: Une affirmation suivie d’une question
  rationale: Le parallélisme et le contexte favorisent deux interrogations sceptiques. La traduction préserve cette provocation sans préciser si elle nie l’omniscience ou seulement l’attention de Dieu aux affaires humaines.
- issue: Rendu du titre divin עֶלְיוֹן
  choice: le Très-Haut
  alternative: le Souverain
  rationale: « Le Très-Haut » est le titre traditionnel et transparent qui conserve l’idée d’élévation et de suprématie présente dans l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La formulation interrogative reste vive et naturelle. Le conditionnel « saurait-il » porte le scepticisme rhétorique sans introduire une négation catégorique absente de l’hébreu.
