source:
  edition: WLC
  text: הִנֵּה אֵ֥לֶּה רְשָׁעִ֑ים וְ/שַׁלְוֵ֥י ע֝וֹלָ֗ם הִשְׂגּוּ חָֽיִל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/012.yaml
  text: Behold[a], these are the wicked, always at ease[b]; they increase in wealth.
translation:
  language: fr
  text: 'Voilà les méchants : toujours tranquilles[a], ils accroissent[b] leur richesse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tranquilles pour toujours » ou « toujours en sécurité ». L’hébreu évoque une tranquillité ou une sécurité durable.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils ont acquis des richesses » ou « ils ont accru leurs biens ». Le verbe peut souligner soit l’acquisition, soit l’augmentation des ressources.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voilà
  rationale: Introduit avec force le constat du psalmiste tout en restant naturel et digne en français moderne.
- source_word: אֵלֶּה
  choice: les
  rationale: Avec « voilà », le démonstratif hébreu est rendu idiomatiquement par la présentation « voilà les méchants ».
- source_word: רְשָׁעִים
  choice: méchants
  rationale: Désigne ici la catégorie morale des personnes opposées à la justice; ce terme est courant dans le langage des Psaumes.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: toujours tranquilles
  rationale: La construction associe l'idée de tranquillité ou de sécurité à celle de durée; cette formulation exprime leur aisance persistante sans imposer une éternité métaphysique.
- source_word: הִשְׂגּוּ
  choice: ils accroissent
  rationale: Le verbe peut exprimer le fait d'atteindre, d'acquérir ou d'augmenter. Dans ce contexte de prospérité, « accroissent » conserve l'idée d'une richesse qui s'accumule.
- source_word: חָיִל
  choice: richesse
  rationale: Parmi les sens possibles de force, ressources ou biens, le contexte privilégie nettement la prospérité matérielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et poétique. « Voilà » garde l'effet démonstratif de הִנֵּה sans l'archaïsme de « voici donc »; le parallélisme concis convient au registre des Psaumes.
