  text: כִּֽי קִ֭נֵּאתִי בַּֽ/הוֹלְלִ֑ים שְׁל֖וֹם רְשָׁעִ֣ים אֶרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/003.yaml
  text: For I was envious of the arrogant when I saw the peace of the wicked[a].
translation:
  language: fr
  text: Car j’enviais les arrogants en voyant la prospérité des méchants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et conserve la valeur explicative ou causale de la conjonction.
- source_word: קִנֵּאתִי
  choice: j’enviais
  rationale: Exprime naturellement en français l’envie éprouvée par le psalmiste, sans la nuance possessive que peut suggérer « jaloux ».
- source_word: בַּהוֹלְלִים
  choice: les arrogants
  rationale: Le terme désigne ici des personnes présomptueuses ou vantardes; « arrogants » rend clairement leur attitude morale dans un français courant et digne.
- source_word: שְׁלוֹם
  choice: la prospérité
  rationale: Dans ce contexte, שָׁלוֹם désigne le bien-être, l’aisance et la réussite apparente des méchants plutôt que la seule absence de conflit.
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: Rend la catégorie morale habituelle du terme dans les psaumes et les écrits de sagesse.
- source_word: אֶרְאֶה
  choice: en voyant
  rationale: L’imparfait hébreu indique ici la circonstance qui provoquait l’envie; le gérondif français exprime naturellement ce rapport sans surdéterminer l’aspect verbal.
theological_decisions: []
