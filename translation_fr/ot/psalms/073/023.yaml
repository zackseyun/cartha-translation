  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: fr
  text: Pourtant, je suis toujours avec toi ; tu m’as pris par la main droite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as tenu ma main droite ». Le verbe hébreu peut souligner l’acte de saisir ou la prise qui en résulte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mais moi
  rationale: Le waw introduit ici un contraste avec l’égarement et l’amertume évoqués juste avant ; « Mais moi » rend naturellement cette opposition.
- source_word: תָמִיד
  choice: toujours
  rationale: Le terme exprime une continuité durable ; « toujours » est simple, naturel et fidèle au registre poétique.
- source_word: עִמָּךְ
  choice: avec toi
  rationale: La préposition exprime directement l’accompagnement ou la proximité.
- source_word: אָחַזְתָּ
  choice: tu m’as saisi
  rationale: Le verbe signifie prendre ou tenir fermement. La formulation conserve l’acte de saisir sans exclure le soutien qui en résulte.
- source_word: בְּיַד יְמִינִי
  choice: par la main droite
  rationale: La préposition בְּ avec אָחַז marque la partie par laquelle la personne est saisie. Cette tournure française conserve l’image concrète de la main droite.
theological_decisions:
- issue: Valeur aspectuelle et portée du soutien divin
  choice: tu m’as saisi par la main droite
  alternative: tu me tiens par la main droite
  rationale: L’accompli hébreu présente l’action comme réalisée, tandis que le contexte peut laisser entendre ses effets durables. Le passé composé respecte cette valeur sans réduire l’image à un état purement présent.
translation_notes:
  register: Français moderne, sobre et poétique. Le tutoiement correspond à l’adresse directe à Dieu. La traduction maintient le contraste initial et l’image concrète de la saisie par la main droite.
