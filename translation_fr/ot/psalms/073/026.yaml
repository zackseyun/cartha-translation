source:
  edition: WLC
  text: כָּלָ֥ה שְׁאֵרִ֗/י וּ/לְבָ֫בִ֥/י צוּר לְבָבִ֥/י וְ/חֶלְקִ֗/י אֱלֹהִ֥ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: fr
  text: Ma chair et mon cœur peuvent défaillir[a], mais Dieu est le rocher de mon cœur[b] et ma part pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ma chair et mon cœur défaillissent »; le verbe hébreu peut exprimer une défaillance présente ou, plus largement, le fait de dépérir ou de parvenir à son terme.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la force de mon cœur ». L’hébreu dit plus littéralement : « le rocher de mon cœur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: peuvent défaillir
  rationale: Le verbe exprime l’idée de s’épuiser, dépérir, prendre fin ou défaillir. Cette formulation française naturelle rend ici la fragilité de l’être humain sans imposer que la défaillance soit déjà entièrement accomplie; la note conserve l’autre lecture aspectuelle possible.
- source_word: שְׁאֵרִי
  choice: ma chair
  rationale: Associé à « mon cœur », le terme désigne ici la dimension corporelle du psalmiste. « Ma chair » conserve l’image biblique sans la réduire au seul sens moderne de « corps ».
- source_word: לְבָבִי
  choice: mon cœur
  rationale: Le mot désigne l’être intérieur, notamment la pensée et la volonté. « Cœur » est transparent en français biblique moderne, et sa répétition préserve l’insistance poétique de l’hébreu.
- source_word: צוּר
  choice: le rocher
  rationale: Le terme signifie concrètement « rocher » et présente Dieu comme stabilité et sécurité. Conserver la métaphore évite de la réduire à la seule idée abstraite de force.
- source_word: חֶלְקִי
  choice: ma part
  rationale: Le mot évoque la part attribuée à quelqu’un, avec une possible résonance d’héritage. « Ma part » est naturel en français et maintient la confession selon laquelle Dieu lui-même est le bien durable du psalmiste.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans cette confession, le terme désigne le Dieu d’Israël; « Dieu » est la traduction française directe et naturelle.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: L’expression marque une permanence sans fin. « Pour toujours » est une formulation claire, actuelle et adaptée au registre poétique.
theological_decisions:
- issue: Portée anthropologique de « ma chair et mon cœur »
  choice: Ma chair et mon cœur peuvent défaillir
  alternative: Mon corps et mon esprit peuvent défaillir
  rationale: La traduction retenue conserve les catégories imagées du texte et son contraste entre la fragilité corporelle et intérieure de l’être humain, d’une part, et la permanence de Dieu, d’autre part. Elle évite d’importer une opposition moderne rigide entre corps et esprit.
- issue: Métaphore appliquée à Dieu dans צוּר
  choice: Dieu est le rocher de mon cœur
  alternative: Dieu est la force de mon cœur
  rationale: L’hébreu emploie l’image concrète du rocher. La conserver maintient sa richesse — stabilité, sécurité et fermeté — sans résoudre la métaphore en une seule qualité abstraite.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple et accessible; les images bibliques de la chair, du cœur, du rocher et de la part sont conservées. Les deux notes signalent l’ambiguïté aspectuelle du premier verbe et la possibilité d’expliciter la métaphore du rocher.
