  text: וָֽ֭/אֲחַשְּׁבָ/ה לָ/דַ֣עַת זֹ֑את עָמָ֖ל היא בְ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/016.yaml
  text: But when I thought to understand this[a], it was trouble in my eyes.
translation:
  language: fr
  text: Mais quand j’ai cherché à comprendre cela, cela m’a paru pénible[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais quand j’ai réfléchi pour connaître cela, c’était un labeur à mes yeux. »'
    reason: La formulation alternative conserve plus littéralement les sens possibles de חשׁב (« réfléchir »), ידע (« connaître »), עָמָל (« labeur ») et l’image de בְּעֵינַי (« à mes yeux »).
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: Mais quand j’ai cherché
  rationale: Le verbe חשׁב exprime ici la réflexion ou la considération orientée vers un but, avec לָדַעַת. « J’ai cherché » rend naturellement en français l’effort intellectuel impliqué; le waw reçoit une valeur adversative selon le contexte.
- source_word: לָדַעַת
  choice: à comprendre
  rationale: ידע signifie fondamentalement « savoir, connaître », mais désigne ici le fait de saisir intellectuellement la question évoquée; « comprendre » convient donc mieux au contexte.
- source_word: זֹאת
  choice: cela
  rationale: Le démonstratif renvoie à la difficulté exposée dans les versets précédents sans en préciser davantage l’objet.
- source_word: עָמָל
  choice: pénible
  rationale: Le nom עָמָל peut évoquer le labeur, la peine ou une difficulté accablante. La formulation adjectivale « pénible » restitue idiomatiquement en français le poids de cet effort mental.
- source_word: הִיא בְעֵינָי
  choice: cela m’a paru
  rationale: Littéralement « elle était à mes yeux ». « M’a paru » transpose en français courant cet idiome d’appréciation personnelle tout en conservant le point de vue du psalmiste.
theological_decisions: []
