id: PSA.73.1
reference: Psalms 73:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אַ֤ךְ ט֭וֹב לְ/יִשְׂרָאֵ֥ל אֱלֹהִ֗ים לְ/בָרֵ֥י לֵבָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/001.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to those pure in heart.
translation:
  language: fr
  text: Psaume d’Asaph. Oui, Dieu est bon pour Israël, pour ceux qui ont le cœur pur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour les cœurs purs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme traditionnel et exact pour ce type de chant accompagné, particulièrement dans un titre psalmique.
- source_word: לְאָסָף
  choice: d’Asaph
  rationale: Le ל préfixé peut exprimer l’auteur, l’appartenance, l’association ou la destination. « d’Asaph » reste naturel en français sans trancher entièrement entre ces nuances.
- source_word: אַךְ
  choice: Oui
  rationale: Ici, la particule introduit avec force la conviction fondamentale du psaume. « Oui » rend cette affirmation de manière naturelle et digne; « vraiment » demeure possible.
- source_word: טוֹב
  choice: bon
  rationale: « Bon » conserve la portée large du terme hébreu, qui peut désigner à la fois le caractère bienveillant de Dieu et son action bénéfique.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: La préposition ל indique ici la relation ou le bénéfice. En français, « Dieu est bon pour Israël » est idiomatique et fidèle.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Le nom est ici singulier par le sens et désigne le Dieu d’Israël.
- source_word: לְבָרֵי לֵבָב
  choice: pour ceux qui ont le cœur pur
  rationale: Cette formulation naturelle exprime la pureté intérieure évoquée par בָרֵי לֵבָב et maintient le parallélisme avec « pour Israël ».
theological_decisions:
- issue: Rapport entre « Israël » et « ceux qui ont le cœur pur »
  choice: Conserver les deux groupes prépositionnels successifs, permettant de lire le second comme une précision du premier.
  alternative: Comprendre les expressions comme désignant deux groupes coordonnés et distincts.
  rationale: La syntaxe et le parallélisme favorisent une apposition ou une spécification, mais la ponctuation française ne doit pas imposer une conclusion théologique plus étroite que l’hébreu.
translation_notes:
  register: Français moderne, international et digne. Le titre reste sobre. « Oui » donne à אַךְ sa force affirmative sans archaïsme, et la répétition de « pour » reflète les deux syntagmes hébreux en לְ.
