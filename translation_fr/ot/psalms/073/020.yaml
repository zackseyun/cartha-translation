id: PSA.73.20
reference: Psalms 73:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כַּ/חֲל֥וֹם מֵ/הָקִ֑יץ אֲ֝דֹנָ/י בָּ/עִ֤יר צַלְמָ֬/ם תִּבְזֶֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/020.yaml
  text: Like a dream when one awakes[a], Lord, when you rouse yourself, you will despise their image.
translation:
  language: fr
  text: Comme un rêve au réveil, Seigneur, quand tu t’éveilleras[a], tu mépriseras leur image.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « dans la ville, tu mépriseras leur image ». Les consonnes hébraïques permettent cette lecture, mais le contexte favorise nettement le sens « quand tu t’éveilleras » ou « quand tu te mettras en mouvement ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Comme un rêve
  rationale: Le préfixe כַּ־ introduit une comparaison, et חֲלוֹם signifie « rêve ». Cette formulation française restitue directement la comparaison poétique.
- source_word: מֵהָקִיץ
  choice: au réveil
  rationale: La forme vient du verbe « s’éveiller » ; la préposition מִן peut ici exprimer le moment où le rêve cesse. « Au réveil » est naturel et concis en français.
- source_word: אֲדֹנָי
  choice: Seigneur
  rationale: Il s’agit du titre divin employé comme apostrophe. « Seigneur » est la traduction française courante et digne.
- source_word: בָּעִיר
  choice: quand tu t’éveilleras
  rationale: La lecture verbale liée à l’idée de s’éveiller ou de se mettre en mouvement convient au parallélisme avec le réveil qui dissipe le rêve. Le futur français s’accorde avec la proposition principale.
- source_word: צַלְמָם
  choice: leur image
  rationale: צֶלֶם désigne une image, une forme ou une apparence. « Leur image » préserve le terme concret et l’ambiguïté poétique quant au caractère fugitif de leur présence.
- source_word: תִּבְזֶה
  choice: tu mépriseras
  rationale: Le verbe בזה signifie « mépriser, traiter avec dédain ». L’inaccompli prend ici naturellement une valeur future après la proposition temporelle.
theological_decisions:
- issue: Interprétation de בָּעִיר
  choice: 'Lecture verbale : « quand tu t’éveilleras »'
  alternative: 'Lecture nominale et locative : « dans la ville »'
  rationale: Le contexte immédiat compare le sort des méchants à un rêve qui disparaît au réveil. La lecture verbale prolonge ce parallélisme sans ajouter de précision théologique étrangère au texte ; la lecture locative possible d’après les consonnes est signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase reste concise et conserve l’image du rêve ainsi que l’adresse directe à Dieu.
