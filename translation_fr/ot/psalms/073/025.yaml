source:
  edition: WLC
  text: מִי לִ֥/י בַ/שָּׁמָ֑יִם וְ֝/עִמְּ/ךָ֗ לֹא חָפַ֥צְתִּי בָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: fr
  text: Qui ai-je au ciel, sinon toi ? Et sur la terre, je ne désire rien en dehors de toi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Et avec toi, je n’ai rien désiré sur la terre. » L’hébreu est elliptique ; dans ce parallélisme, le sens paraît être qu’en dehors de Dieu, le psalmiste ne désire rien sur terre.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Qui ai-je
  rationale: La tournure hébraïque signifie littéralement « qui [est] pour moi ? ». « Qui ai-je » exprime naturellement en français cette relation personnelle, dans le cadre d’une question rhétorique.
- source_word: בַשָּׁמַיִם
  choice: au ciel
  rationale: Le pluriel hébreu désigne ici le domaine céleste. « Au ciel » est idiomatique en français et forme un contraste net avec « sur la terre ».
- source_word: וְעִמְּךָ
  choice: en dehors de toi
  rationale: L’expression signifie littéralement « et avec toi ». Dans le parallélisme poétique, elle marque vraisemblablement l’exclusivité, rendue naturellement par « en dehors de toi », tout en signalant la formulation littérale en note.
- source_word: לֹא חָפַצְתִּי
  choice: je ne désire rien
  rationale: Le verbe חפץ peut exprimer le désir, le plaisir ou l’attachement. Ici, « désirer » convient au contexte. L’accompli hébreu décrit une disposition établie, que le présent français rend avec naturel.
- source_word: בָאָרֶץ
  choice: sur la terre
  rationale: L’expression désigne le domaine terrestre, en opposition au ciel. « Sur la terre » est la formulation française habituelle.
theological_decisions:
- issue: Sens du second membre elliptique
  choice: Le psalmiste affirme qu’en dehors de Dieu, rien sur terre ne fait l’objet de son désir ultime.
  alternative: « Et avec toi, je n’ai rien désiré sur la terre. »
  rationale: L’hébreu est elliptique et dit littéralement « et avec toi, je n’ai pas désiré sur la terre ». Le parallélisme soutient une affirmation d’exclusivité, mais la note conserve la formulation plus littérale afin de ne pas effacer l’ambiguïté syntaxique.
- issue: Complément implicite du premier membre
  choice: « sinon toi »
  alternative: « Qui ai-je pour moi au ciel ? »
  rationale: Le texte hébreu ne comporte pas de mot explicite signifiant « sinon », mais la présence de Dieu est sous-entendue par le second membre. Cet ajout rend en français la force rhétorique et exclusive de la question sans transformer son orientation théologique.
translation_notes:
  register: Français moderne, international et digne. Le rythme bref conserve le parallélisme entre le ciel et la terre. La formulation principale privilégie la clarté, tandis que la note préserve l’ellipse et l’ambiguïté de l’hébreu.
