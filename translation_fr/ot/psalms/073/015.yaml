  naturalness: Le français est moderne, clair et d’un registre convenant à un psaume. La syntaxe conditionnelle et le futur dans le discours rapporté direct sont naturels. L’expression « génération de tes enfants » est légèrement marquée, mais elle reflète justement la formulation hébraïque et reste intelligible.
