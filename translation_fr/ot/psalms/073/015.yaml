id: PSA.73.15
reference: Psalms 73:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: fr
  text: 'Si j’avais dit : « Je parlerai ainsi », j’aurais alors trahi la génération de tes enfants.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Si j’avais dit
  rationale: Le parfait dans cette construction conditionnelle exprime ici une hypothèse irréelle envisagée rétrospectivement ; le plus-que-parfait français la rend naturellement.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Je parlerai ainsi
  rationale: ספר peut signifier raconter ou déclarer ; avec כְמוֹ, il s’agit ici d’exprimer publiquement la perspective exposée auparavant. « Parler ainsi » reste naturel et suffisamment large.
- source_word: הִנֵּה
  choice: alors
  rationale: Dans l’apodose, הִנֵּה souligne la conséquence dont le psalmiste prend conscience. « Alors » restitue cette mise en relief dans un français courant sans l’archaïsme de « voici ».
- source_word: דּוֹר
  choice: la génération
  rationale: Rendu formel qui conserve la dimension collective et intergénérationnelle du terme hébreu.
- source_word: בָּנֶיךָ
  choice: tes enfants
  rationale: Le masculin pluriel désigne ici collectivement les membres du peuple appartenant à Dieu ; « enfants » transmet cette portée représentative.
- source_word: בָגָדְתִּי
  choice: j’aurais trahi
  rationale: בגד exprime une conduite déloyale ou perfide. « Trahir » rend avec concision sa force relationnelle, tandis que le conditionnel passé correspond à l’hypothèse irréelle.
theological_decisions:
- issue: Référent et portée de « tes enfants »
  choice: Le psalmiste s’adresse à Dieu et désigne collectivement son peuple par « tes enfants ».
  alternative: « tes fils », rendu plus formellement masculin.
  rationale: Le suffixe de deuxième personne masculine singulière renvoie naturellement à Dieu. Dans ce contexte, « enfants » évite de restreindre sans raison la communauté aux hommes.
- issue: Nature de la trahison envisagée
  choice: 'La formulation demeure générale : parler ainsi aurait constitué une déloyauté envers la communauté de Dieu.'
  alternative: Préciser qu’il aurait fait trébucher ou trompé la communauté.
  rationale: Le texte dit בגד, « agir avec déloyauté/trahir », sans expliciter l’effet précis de ses paroles ; la traduction ne doit pas ajouter une conséquence particulière.
translation_notes:
  register: Français moderne, digne et direct. La tournure « parler ainsi » renvoie aux propos sceptiques du contexte. « Alors » intègre naturellement la fonction emphatique de הִנֵּה, tandis que « génération de tes enfants » conserve l’expression hébraïque inhabituelle plutôt que de la lisser en « tes enfants » seulement.
