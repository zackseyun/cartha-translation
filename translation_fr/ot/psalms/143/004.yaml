lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: défaille
  rationale: Le hitpael de עטף, dans les lamentations, exprime l'affaiblissement intérieur ou l'accablement. « Défaille » est naturel, digne et conserve l'image d'une force intérieure qui cède.
- source_word: עָלַי
  choice: en moi
  rationale: La préposition signifie littéralement « sur moi », mais, associée à l'esprit du psalmiste, elle décrit ici son état intérieur. « En moi » rend ce sens idiomatiquement et s'accorde avec le parallélisme de בְּתוֹכִי.
- source_word: רוּחִי
  choice: mon esprit
  rationale: רוּחַ désigne ici la vie intérieure du psalmiste, non simplement son souffle ni l'Esprit saint. « Mon esprit » préserve le parallélisme avec « mon cœur ».
- source_word: בְּתוֹכִי
  choice: au-dedans de moi
  rationale: L'expression marque explicitement l'intériorité. Cette formulation naturelle évite de répéter exactement « en moi » tout en conservant l'insistance poétique.
- source_word: יִשְׁתּוֹמֵם
  choice: est frappé de stupeur
  rationale: Le verbe שמם peut évoquer la désolation, la consternation ou la stupeur. « Est frappé de stupeur » conserve la force du bouleversement sans trancher en faveur de la seule désolation affective.
- source_word: לִבִּי
  choice: mon cœur
  rationale: לֵב désigne la personne intérieure, siège de la pensée et des émotions. « Mon cœur » est l'équivalent français courant et poétique.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme intérieur entre « mon esprit » et « mon cœur » est maintenu, ainsi que l'ambiguïté du premier verbe entre défaillance et accablement.
