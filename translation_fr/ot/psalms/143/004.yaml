  yaml_path: translation/ot/psalms/143/004.yaml
  text: And my spirit grows faint within me[a]; my heart is appalled within me.
translation:
  language: fr
  text: Et mon esprit défaille en moi[a] ; au-dedans de moi, mon cœur est frappé de stupeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon esprit est accablé en moi. »'
