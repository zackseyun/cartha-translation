  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: fr
  text: Fais-moi entendre au matin ton amour fidèle[a], car je mets ma confiance en toi. Fais-moi connaître le chemin que je dois suivre[b], car c’est vers toi que j’élève mon âme[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Fais-moi entendre le matin ton amour fidèle. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le chemin que j’irai » ; on peut aussi comprendre : « le chemin que je suivrai ».'
    reason: lexical_alternative
  - marker: c
    text: « Élever son âme » est une expression hébraïque qui évoque le fait de se confier à Dieu et d’orienter vers lui tout son être intérieur.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: Fais-moi entendre
  rationale: Le hiphil impératif de שׁמע avec suffixe de première personne signifie littéralement « fais-moi entendre ». Cette formulation naturelle en français conserve la force causative et la demande adressée à Dieu.
- source_word: בַבֹּקֶר
  choice: dès le matin
  rationale: Le syntagme situe la demande au matin. « Dès le matin » exprime naturellement en français l’attente matinale sans introduire l’idée répétitive de « chaque matin ».
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חסד désigne ici l’amour loyal et durable de Dieu. « Amour fidèle » rend à la fois l’affection et la constance, sans imposer explicitement une terminologie confessionnelle d’alliance.
- source_word: כִּי
  choice: car
  rationale: Dans ses deux emplois, כִּי introduit la raison de la demande. « Car » convient au registre poétique et priant.
- source_word: בְךָ בָטָחְתִּי
  choice: je mets ma confiance en toi
  rationale: Le parfait exprime une confiance établie et actuelle. Cette tournure idiomatique française garde l’idée d’un appui personnel placé en Dieu.
- source_word: הוֹדִיעֵנִי
  choice: Fais-moi connaître
  rationale: Le hiphil impératif de ידע signifie « fais connaître » ou « donne de connaître ». Le choix reste proche de la forme causative hébraïque.
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: le chemin que je dois suivre
  rationale: Littéralement, le texte parle du « chemin que j’irai ». Dans cette prière de direction, « que je dois suivre » rend clairement la portée contextuelle tout en signalant en note la formulation plus littérale.
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition indique une orientation en direction de Dieu. « Vers toi » s’accorde particulièrement bien avec l’image d’élever son âme.
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: j’élève mon âme
  rationale: La métaphore hébraïque est conservée. Elle peut évoquer l’abandon confiant, l’élan intérieur et l’orientation de toute la personne vers Dieu sans être réduite à une seule interprétation.
theological_decisions:
- issue: Sens de חסד dans une prière adressée à Dieu
  choice: ton amour fidèle
  alternative: ta bonté ; ton amour d’alliance ; ta fidélité bienveillante
  rationale: « Amour fidèle » conserve la richesse relationnelle et la constance de חסד sans réduire le terme à la seule compassion ni expliciter davantage que le texte la notion d’alliance.
- issue: Métaphore נָשָׂאתִי נַפְשִׁי
  choice: c’est vers toi que j’élève mon âme
  alternative: je me confie à toi ; je tourne tout mon être vers toi
  rationale: 'Le maintien de la métaphore préserve sa densité poétique et théologique ainsi que son ambiguïté féconde : confiance, désir, prière et orientation de la personne peuvent toutes être présentes.'
- issue: Portée de דֶּרֶךְ זוּ אֵלֵךְ
  choice: le chemin que je dois suivre
  alternative: le chemin où j’irai ; le chemin que je suivrai
  rationale: Le contexte est une demande de conduite divine. « Dois suivre » rend cette portée en français courant, tandis qu’une note conserve la formulation plus littérale et son ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme de la prière, les impératifs causatifs et la métaphore finale. « Âme » est retenu pour préserver l’image poétique, avec une note qui en éclaire la portée sans la refermer.
