  text: הַצִּילֵ֖/נִי מֵ/אֹיְבַ֥/י יְהוָ֗ה אֵלֶ֥י/ךָ כִסִּֽתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: fr
  text: Délivre-moi de mes ennemis, Yahweh ! Auprès de toi, je me suis réfugié[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, « vers toi, je me suis caché » ou « auprès de toi, je me suis mis à l’abri ». La formulation hébraïque évoque la recherche d’une protection auprès de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Délivre-moi
  rationale: L’impératif hiphil de נצל, avec suffixe de première personne, exprime une demande directe de délivrance. « Délivre-moi » convient au registre de la prière psalmique.
- source_word: מֵאֹיְבַי
  choice: de mes ennemis
  rationale: La préposition מִן marque ici l’éloignement ou la délivrance hors de l’emprise de quelqu’un, et le pluriel אֹיְבַי signifie directement « mes ennemis ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- source_word: אֵלֶיךָ
  choice: Auprès de toi
  rationale: אֶל signifie normalement « vers » ou « à ». Avec le verbe suivant dans ce contexte de protection, « auprès de toi » rend naturellement l’idée de chercher un abri auprès de Dieu tout en conservant l’orientation vers lui.
- source_word: כִסִּתִי
  choice: je cherche refuge
  rationale: La forme vient de כסה, « couvrir, cacher ». Dans ce contexte, l’expression évoque le fait de se mettre à l’abri auprès de Dieu. Le présent français exprime naturellement la démarche actuelle du psalmiste sans imposer une chronologie trop précise à l’accompli hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer silencieusement par un titre.
- issue: Sens de אֵלֶיךָ כִסִּתִי
  choice: Auprès de toi, je cherche refuge
  alternative: Vers toi, je me suis caché
  rationale: L’hébreu conserve l’image de se cacher ou de se mettre à couvert, mais sa formulation est inhabituelle. Le texte principal en donne le sens contextuel de protection, tandis que la note préserve l’image et l’ambiguïté lexicales.
translation_notes:
  register: Français international moderne, sobre et digne. L’exclamation après l’invocation maintient le caractère pressant de la supplication. La tournure « Auprès de toi » garde en tête de proposition l’accent du texte hébreu sur Dieu comme lieu de refuge.
