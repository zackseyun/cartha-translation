id: PSA.143.11
reference: Psalms 143:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: fr
  text: À cause de ton nom, Yahweh, garde-moi en vie[a] ; dans ta justice[b], fais-moi sortir de la détresse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fais-moi vivre » ou « ranime-moi ». Le verbe hébreu peut exprimer le maintien en vie, le don de la vie ou le retour des forces.
    reason: lexical_alternative
  - marker: b
    text: Ou « par ta justice » ou « dans ta droiture ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « fais sortir mon âme de la détresse » ; dans cet idiome hébreu, « mon âme » peut désigner « moi » ou « ma vie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: À cause de ton nom
  rationale: לְמַעַן exprime ici le motif de la requête. « À cause de ton nom » garde l’appel biblique à la réputation et à l’honneur révélés de Dieu, dans un français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: תְּחַיֵּנִי
  choice: garde-moi en vie
  rationale: Le piel de חיה peut signifier maintenir en vie, faire vivre ou ranimer. Dans cette lamentation et parallèlement à la sortie de la détresse, « garde-moi en vie » exprime clairement la préservation demandée sans imposer l’idée d’une résurrection.
- source_word: בְּצִדְקָתְךָ
  choice: dans ta justice
  rationale: La préposition ב est conservée par « dans », tandis que צדקה désigne ici la rectitude juste de Dieu sur laquelle repose l’appel du psalmiste. En français courant, « justice » convient mieux que « droiture » dans cette formule.
- source_word: תוֹצִיא מִצָּרָה
  choice: fais-moi sortir de la détresse
  rationale: Le hiphil de יצא est causatif, « faire sortir ». נֶפֶשׁ avec le suffixe de première personne désigne ici la personne elle-même ; « moi » rend naturellement l’idiome hébreu sans spiritualiser le sens.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le Tétragramme comme nom propre. La translittération préserve cette donnée plutôt que de remplacer le nom par un titre.
- issue: Portée de צדקה
  choice: justice
  alternative: droiture
  rationale: Le terme peut mettre en avant la rectitude, la justice et la fidélité de Dieu. « Justice » conserve cette ampleur sans ajouter explicitement une qualification confessionnelle.
- issue: Sens de נַפְשִׁי
  choice: moi
  alternative: mon âme / ma vie
  rationale: נפשׁ désigne fréquemment la personne ou la vie dans l’anthropologie hébraïque. Ici, complément de « faire sortir de la détresse », il équivaut naturellement à « moi » ; les autres possibilités sont signalées en note.
translation_notes:
  register: Français international moderne, poétique mais direct. L’impératif « garde-moi en vie » est immédiatement compréhensible ; « fais-moi sortir de la détresse » conserve l’image concrète de l’hébreu. L’apostrophe ne requiert pas de « ô », aujourd’hui marqué comme archaïque.
