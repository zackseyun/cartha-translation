  text: I spread out my hands to you; my soul is like a weary land for you[a]. Selah
translation:
  language: fr
  text: J’étends mes mains vers toi ; mon âme est pour toi comme une terre épuisée[a]. Sélah
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon âme est pour toi comme une terre desséchée ». L’adjectif hébreu signifie littéralement « fatiguée », « épuisée » ou « défaillante » ; dans cette comparaison, il évoque probablement une terre assoiffée.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Je tends
  rationale: Le qal de פרשׂ décrit ici le déploiement des mains dans un geste de prière ou de supplication. « Je tends » est naturel en français et conserve ce geste concret.
- source_word: יָדַי
  choice: les mains
  rationale: La forme avec suffixe de première personne désigne les deux mains. En français, « je tends les mains » exprime naturellement la possession sans exiger « mes ».
- source_word: אֵלֶיךָ
  choice: vers toi
  rationale: La préposition אֶל indique l'orientation vers le destinataire ; « vers toi » rend clairement la direction du geste.
- source_word: נַפְשִׁי
  choice: mon âme
  rationale: נֶפֶשׁ peut désigner la vie, la personne ou l'être intérieur. Dans ce contexte de prière et de désir, « mon âme » préserve la portée affective et spirituelle sans la préciser excessivement.
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: comme une terre épuisée
  rationale: עֲיֵפָה signifie littéralement « fatiguée, épuisée, défaillante ». Appliqué à une terre, le mot évoque probablement une terre desséchée et assoiffée ; « épuisée » conserve néanmoins l'image hébraïque inhabituelle.
- source_word: לְךָ
  choice: devant toi
  rationale: Le לְךָ est bref et elliptique. « Devant toi » garde l'orientation de l'âme vers Dieu tout en produisant une phrase française intelligible, sans expliciter indûment l'idée de soif ou de désir.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens exact du terme liturgique est incertain ; sa translittération préserve cette incertitude plutôt que d'imposer une interprétation.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme poétique et l'image concrète de la supplication sont maintenus. L'étrangeté expressive de la « terre épuisée » est conservée dans le texte, tandis que le sens probable de terre desséchée est signalé en note.
