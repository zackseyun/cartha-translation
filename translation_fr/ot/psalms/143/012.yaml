source:
  edition: WLC
  text: וּֽ/בְ/חַסְדְּ/ךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥/י וְֽ֭/הַאֲבַדְתָּ כָּל צֹרֲרֵ֣י נַפְשִׁ֑/י כִּ֝֗י אֲנִ֣י עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: fr
  text: Et, dans ton amour fidèle, tu anéantiras mes ennemis[a] ; tu feras périr tous ceux qui me persécutent[b], car je suis ton serviteur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ton amour fidèle » ; la préposition hébraïque peut présenter cet amour comme le moyen de l’action aussi bien que comme son cadre ou son fondement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les adversaires de mon âme » ; le mot hébreu peut aussi désigner « ma vie » ou simplement « moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: Et dans ton amour fidèle
  rationale: חֶסֶד exprime ici l’amour loyal, durable et bienveillant de Dieu. « Amour fidèle » en restitue naturellement la dimension relationnelle et la constance. La préposition בְּ est rendue par « dans », qui peut indiquer le cadre ou le fondement de l’action, sans exclure une nuance instrumentale.
- source_word: תַּצְמִית
  choice: tu réduiras … au silence
  rationale: Le hiphil de צמת signifie faire cesser, supprimer ou anéantir. « Réduire au silence » conserve l’image verbale et évite de confondre ce verbe avec אבד dans le membre parallèle, tout en gardant la force du jugement demandé.
- source_word: אֹיְבַי
  choice: mes ennemis
  rationale: Équivalent direct et naturel du pluriel muni du suffixe de première personne.
- source_word: וְהַאֲבַדְתָּ
  choice: tu feras disparaître
  rationale: Le hiphil de אבד signifie faire périr ou détruire. « Faire disparaître » est fort et idiomatique, tout en maintenant la variation lexicale du parallélisme hébreu.
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: tous ceux qui s’acharnent contre moi
  rationale: צֹרֲרֵי désigne ceux qui manifestent une hostilité pressante. La tournure verbale est naturelle en français. נַפְשִׁי peut désigner l’âme, la vie ou la personne elle-même ; « contre moi » rend ici ce sens global sans imposer une anthropologie dualiste.
- source_word: כִּי
  choice: car
  rationale: Introduit le motif de l’attente exprimée et convient au registre poétique de la prière.
- source_word: עַבְדֶּךָ
  choice: ton serviteur
  rationale: Dans une prière adressée à Dieu, עֶבֶד exprime l’appartenance humble et le service. « Serviteur » est exact dans ce contexte sans importer inutilement le cadre social de l’esclavage.
theological_decisions:
- issue: Violence imprécatoire envers les ennemis
  choice: Conserver la demande directe d’une intervention divine qui fasse cesser et disparaître les ennemis.
  alternative: Atténuer les verbes en traduisant par « vaincre » ou « repousser ».
  rationale: Les deux verbes hébreux sont vigoureux et évoquent la suppression ou la destruction. La traduction ne doit pas neutraliser la tension théologique de cette prière de jugement.
- issue: Sens de נַפְשִׁי
  choice: Traduire dans le texte par « moi », avec une note signalant « mon âme » et « ma vie ».
  alternative: Traduire littéralement par « mon âme ».
  rationale: Dans ce contexte, נֶפֶשׁ peut désigner la personne entière ou sa vie. « Moi » est naturel et évite de fixer le texte dans une lecture dualiste, tandis que la note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international actuel, digne et poétique. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. Le parallélisme est conservé avec deux expressions fortes mais distinctes, sans atténuer la demande de jugement.
