id: PSA.143.5
reference: Psalms 143:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זָ֘כַ֤רְתִּי יָמִ֨ים מִ/קֶּ֗דֶם הָגִ֥יתִי בְ/כָל פָּעֳלֶ֑/ךָ בְּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ אֲשׂוֹחֵֽחַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/005.yaml
  text: I remember the days of old[a]; I meditate on all your work[b]; I muse on the work of your hands.
translation:
  language: fr
  text: Je me souviens des jours d’autrefois[a] ; je médite sur tout ce que tu as fait ; je réfléchis à l’œuvre de tes mains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je me suis souvenu des jours d’autrefois. » Le parfait hébreu peut ici être rendu par un passé ou par un présent exprimant l’acte actuel de se remémorer.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je médite sur l’œuvre de tes mains ». Le verbe hébreu peut aussi évoquer le fait de parler ou de reprendre à voix haute, mais le contexte favorise ici la réflexion intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכַרְתִּי
  choice: Je me souviens
  rationale: Le parfait qal à la 1re personne peut évoquer un souvenir rappelé dans le passé ou l’acte présent de se remémorer. Ici, le présent français exprime naturellement la réflexion actuelle du psalmiste.
- source_word: יָמִים מִקֶּדֶם
  choice: les jours d’autrefois
  rationale: Cette expression désigne les temps anciens. « Les jours d’autrefois » est courant, poétique et digne sans être archaïque.
- source_word: הָגִיתִי
  choice: je médite
  rationale: Le verbe הגה exprime ici l’action de méditer ou de ruminer intérieurement. « Je médite » convient au contexte contemplatif.
- source_word: בְּכָל פָּעֳלֶךָ
  choice: sur tout ce que tu as fait
  rationale: Cette formulation rend naturellement le collectif singulier פֹּעַל avec כָּל et désigne l’ensemble de l’activité ou des œuvres de Dieu.
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: à l’œuvre de tes mains
  rationale: La traduction conserve l’image concrète et anthropomorphique des mains, sans la réduire à une explication abstraite.
- source_word: אֲשׂוֹחֵחַ
  choice: je réfléchis
  rationale: שׂיח peut signifier méditer, réfléchir ou parler. En parallèle avec הָגִיתִי et suivi d’un complément introduit par בְּ, le sens de réflexion intérieure est le plus probable ; « je réfléchis » évite une répétition plate de « je médite ».
theological_decisions:
- issue: Portée de « l’œuvre de tes mains »
  choice: Conserver l’expression imagée sans préciser s’il s’agit de la création, des actes historiques de Dieu ou des deux.
  alternative: Expliciter par « ce que tes mains ont créé » ou « tes interventions ».
  rationale: Le texte hébreu reste général ; une précision limiterait indûment la portée théologique de la méditation du psalmiste.
translation_notes:
  register: Français international moderne, poétique et accessible. Le parallélisme est conservé en distinguant « je médite » de « je réfléchis », tandis que l’image biblique « l’œuvre de tes mains » demeure intacte.
