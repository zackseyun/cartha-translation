base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/000.yaml
  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: fr
  text: Psaume de David. Éternel, écoute ma prière, prête l’oreille à mes supplications ! Dans ta fidélité et dans ta justice[a], réponds-moi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par ta fidélité et par ta justice ». « Justice » peut aussi se rendre par « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme français usuel et précis pour un chant accompagné, employé ici dans le titre.
- source_word: יְהוָה
  choice: Éternel
  rationale: Rendu français traditionnel du nom divin, clairement distinct du titre « Seigneur ».
- source_word: תַּחֲנוּנַי
  choice: mes supplications
  rationale: Exprime les appels insistants à la faveur ou à la compassion contenus dans le terme hébreu.
- source_word: בֶּאֱמֻנָתְךָ
  choice: Dans ta fidélité
  rationale: Préserve la construction prépositionnelle et présente la fidélité divine comme la sphère ou le fondement de la réponse demandée.
- source_word: בְּצִדְקָתֶךָ
  choice: dans ta justice
  rationale: « Justice » rend naturellement צְדָקָה dans ce contexte tout en conservant sa dimension de droiture et de juste action.
theological_decisions:
- issue: Rapport entre la réponse demandée et les attributs divins introduits par בְּ
  choice: « Dans ta fidélité… dans ta justice »
  alternative: « À cause de ta fidélité… selon ta justice »
  rationale: La formulation retenue conserve l’ambiguïté de la préposition hébraïque, qui peut indiquer la sphère, la norme ou le fondement de l’action divine, sans imposer une lecture doctrinale unique.
translation_notes:
  register: Français moderne, digne et directement intelligible. L’impératif « prête l’oreille » garde l’image poétique hébraïque. La répétition de « réponds-moi » explicite naturellement en français le verbe hébreu qui gouverne les deux compléments parallèles, sans modifier leur relation.
