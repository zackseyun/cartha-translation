  source_fidelity: La structure de la supplication, l’urgence de מַהֵר, le nom Yahweh, l’image du visage caché et la comparaison avec ceux qui descendent dans la fosse sont correctement rendus. Toutefois, dans ce contexte, רוּחִי désigne plus naturellement l’esprit/la force intérieure défaillante que le souffle physiologique. « Mon souffle s’épuise » restreint inutilement la portée du terme.
  naturalness: Le français est globalement fluide et d’un registre de prière moderne et digne. « Mon esprit est à bout » est plus idiomatique et rend mieux l’accablement exprimé par l’hébreu. « Ne me cache pas ton visage » est une conservation acceptable et intelligible de l’image hébraïque.
