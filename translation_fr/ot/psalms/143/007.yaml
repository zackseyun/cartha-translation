source:
  edition: WLC
  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: fr
  text: 'Réponds-moi vite, Yahweh : mon esprit est à bout. Ne me cache pas ton visage, sinon je deviendrai semblable à ceux qui descendent dans la fosse[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la tombe ». En hébreu, « la fosse » est une image poétique de la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר עֲנֵנִי
  choice: Réponds-moi vite
  rationale: L’impératif מַהֵר donne à la supplication un caractère urgent et fonctionne ici adverbialement avec « réponds-moi ». Cette formulation est directe et naturelle en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: כָּלְתָה רוּחִי
  choice: mon souffle s’épuise
  rationale: כָּלְתָה exprime l’épuisement ou l’arrivée au terme. רוּחַ peut désigner le souffle, l’esprit ou la force intérieure ; « souffle » conserve ici le lien avec la vie qui décline sans exclure la détresse intérieure.
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Ne me cache pas ton visage
  rationale: La formulation garde l’image hébraïque du visage caché, qui évoque le retrait de la présence ou de la faveur divine.
- source_word: וְנִמְשַׁלְתִּי
  choice: sinon je deviendrai semblable
  rationale: Après l’interdiction, le waw introduit la conséquence redoutée. Le niphal exprime le fait de devenir ou d’être rendu comparable à d’autres.
- source_word: יֹרְדֵי בוֹר
  choice: ceux qui descendent dans la fosse
  rationale: La traduction préserve l’image poétique hébraïque de la descente dans la fosse, associée à la mort, sans la réduire dans le corps du texte à « tombe » ou à une conception précise du séjour des morts.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte le nom propre divin. Sa translittération préserve cette donnée plutôt que de lui substituer un titre.
- issue: Portée de רוּחִי
  choice: mon souffle
  alternative: mon esprit
  rationale: Le terme peut évoquer le souffle vital comme l’être intérieur. Dans ce contexte de mort imminente, « souffle » est naturel et conserve la dimension vitale, tout en laissant subsister la détresse psychique.
- issue: Sens de « la fosse »
  choice: Conserver l’image de la fosse
  alternative: la tombe ; le séjour des morts
  rationale: L’image renvoie poétiquement à la mort sans imposer une définition doctrinale détaillée de l’état des morts.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond à l’adresse personnelle à Dieu dans le psaume. Le rythme bref conserve l’urgence de la prière, tandis que les images hébraïques du visage caché et de la fosse sont maintenues.
