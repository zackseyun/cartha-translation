id: PSA.143.3
reference: Psalms 143:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֥י רָ֘דַ֤ף אוֹיֵ֨ב נַפְשִׁ֗/י דִּכָּ֣א לָ֭/אָרֶץ חַיָּתִ֑/י הוֹשִׁיבַ֥/נִי בְ֝/מַחֲשַׁכִּ֗ים כְּ/מֵתֵ֥י עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: fr
  text: Car un ennemi me poursuit[a] ; il a écrasé ma vie contre terre ; il m’a fait demeurer dans des lieux obscurs, comme ceux qui sont morts depuis longtemps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « poursuit mon âme » ; en poésie hébraïque, « mon âme » peut désigner la personne elle-même.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme les morts d’autrefois ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la supplication exprimée dans le contexte et conserve la valeur causale de la conjonction.
- source_word: רָדַף אוֹיֵב נַפְשִׁי
  choice: un ennemi me poursuit
  rationale: « Poursuivre » restitue l’image immédiate de la traque. Le pronom « me » rend naturellement en français l’expression hébraïque « mon âme », qui désigne ici la personne tout entière, tandis que « ma vie » est conservé pour חַיָּתִי dans le membre suivant.
- source_word: דִּכָּא לָאָרֶץ חַיָּתִי
  choice: il a écrasé ma vie contre terre
  rationale: « Écraser » préserve la violence de l’image ; « contre terre » exprime naturellement le mouvement d’abaissement contenu dans לָאָרֶץ.
- source_word: הוֹשִׁיבַנִי בְמַחֲשַׁכִּים
  choice: il m’a fait demeurer dans des lieux obscurs
  rationale: La tournure causative rend le hifil de ישׁב, et « des lieux obscurs » conserve la forme plurielle de מַחֲשַׁכִּים sans réduire l’expression à une abstraction.
- source_word: כְּמֵתֵי עוֹלָם
  choice: comme ceux qui sont morts depuis longtemps
  rationale: Cette formulation naturelle fait ressortir ici la valeur temporelle ancienne ou reculée de עוֹלָם, tout en évitant de trancher en faveur du sens potentiellement trompeur « morts pour toujours ».
theological_decisions:
- issue: Valeur temporelle de עוֹלָם dans כְּמֵתֵי עוֹלָם
  choice: depuis longtemps
  alternative: d’autrefois ; pour toujours
  rationale: Dans ce contexte funèbre, l’expression évoque probablement ceux qui sont morts depuis un temps immémorial. La note maintient visible l’autre formulation temporelle possible sans introduire une conclusion doctrinale sur l’état des morts.
translation_notes:
  register: Français international moderne, poétique et digne. Les temps du passé présentent les actes hostiles comme accomplis et lourds de conséquences présentes ; le présent « me poursuit » garde vive l’expérience continue de la traque.
