id: PSA.143.1
reference: Psalms 143:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: fr
  text: 'Psaume de David[a].


    Yahweh, écoute ma prière,

    prête l’oreille à mes supplications.

    Dans ta fidélité, réponds-moi[b],

    dans ta justice[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « psaume pour David » ou « psaume appartenant à David » ; l’expression hébraïque peut indiquer l’auteur, l’association ou la dédicace.
    reason: ambiguïté grammaticale du titre
  - marker: b
    text: Ou « Par ta fidélité, réponds-moi » ; l’hébreu peut présenter la fidélité de Dieu comme le fondement ou le moyen de sa réponse.
    reason: alternative syntaxique et sémantique
  - marker: c
    text: Ou « dans ta droiture » ou « par ta justice ».
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: Terme consacré et exact pour désigner ce genre poétique dans les titres des psaumes.
- source_word: לְדָוִד
  choice: de David
  rationale: La préposition hébraïque peut exprimer l’auteur, l’appartenance ou la dédicace. « De David » conserve mieux cette ouverture que « par David » ou « pour David ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin personnel présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: שְׁמַע תְּפִלָּתִי
  choice: écoute ma prière
  rationale: Rend directement l’impératif et son complément dans un français naturel de prière.
- source_word: הַאֲזִינָה אֶל־תַּחֲנוּנַי
  choice: prête l’oreille à mes supplications
  rationale: Préserve le parallélisme poétique et exprime des demandes insistantes de faveur ou de compassion.
- source_word: בֶּאֱמֻנָתְךָ
  choice: Dans ta fidélité
  rationale: אֱמוּנָה désigne ici la fiabilité ou la fidélité de Dieu. « Dans » maintient la formulation poétique sans trancher entièrement entre manière et fondement.
- source_word: עֲנֵנִי
  choice: réponds-moi
  rationale: Équivalent direct du verbe courant employé lorsqu’une personne demande à Dieu de répondre à sa prière.
- source_word: בְּצִדְקָתֶךָ
  choice: dans ta justice
  rationale: צְדָקָה désigne la conformité à ce qui est droit et juste. En français actuel, « justice » convient naturellement à l’appel adressé à Dieu, tandis que « droiture » reste possible.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme, nom personnel divin. Sa transcription préserve cette donnée plutôt que de la remplacer par un titre.
- issue: Portée des expressions introduites par בְּ
  choice: dans ta fidélité… dans ta justice
  alternative: par ta fidélité… par ta justice
  rationale: La préposition peut présenter la fidélité et la justice comme la sphère, la manière ou le fondement de la réponse divine. Le texte principal conserve une formulation proche de l’hébreu et la note signale la lecture instrumentale.
- issue: Sens de צְדָקָה appliqué à Dieu
  choice: justice
  alternative: droiture
  rationale: Le terme peut évoquer à la fois le caractère droit de Dieu et son action juste. « Justice » conserve cette tension sans imposer ici une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif « écoute » reste direct, tandis que « prête l’oreille » maintient le parallélisme intensif de l’hébreu. « Supplications » est soutenu mais largement intelligible dans un contexte de prière.
