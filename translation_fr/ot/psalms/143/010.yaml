  text: לַמְּדֵ֤/נִי לַֽ/עֲשׂ֣וֹת רְצוֹנֶ/ךָ֮ כִּֽי אַתָּ֪ה אֱל֫וֹהָ֥/י רוּחֲ/ךָ֥ טוֹבָ֑ה תַּ֝נְחֵ֗/נִי בְּ/אֶ֣רֶץ מִישֽׁוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: fr
  text: Enseigne-moi à faire ta volonté, car tu es mon Dieu. Que ton bon Esprit[a] me conduise sur une terre plane.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton bon esprit ». L’hébreu ne distingue pas les majuscules des minuscules ; l’expression peut donc désigner l’Esprit de Dieu ou, plus généralement, son esprit ou sa disposition bienveillante.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: Apprends-moi
  rationale: Le piel impératif de למד avec suffixe de première personne signifie « enseigne-moi » ou « apprends-moi ». « Apprends-moi » est direct, naturel et approprié à une prière.
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  choice: à faire ta volonté
  rationale: L’infinitif עשה exprime ce que le psalmiste demande à apprendre, et רצון désigne ici ce que Dieu veut ou désire. Cette formulation reste proche de l’hébreu tout en étant idiomatique en français.
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: car tu es mon Dieu
  rationale: כִּי introduit le motif de la demande. « Car » conserve clairement ce rapport causal dans un registre de prière digne.
- source_word: רוּחֲךָ טוֹבָה
  choice: ton bon Esprit
  rationale: רוּחַ signifie « souffle », « esprit » ou « Esprit » ; avec le suffixe, il s’agit de l’esprit de Dieu ou de son Esprit. טובָה signifie « bon ». La majuscule retient la lecture personnelle traditionnelle sans masquer l’autre possibilité, signalée en note.
- source_word: תַּנְחֵנִי
  choice: me conduise
  rationale: Le hiphil de נחה signifie « conduire » ou « guider ». La tournure « Que… me conduise » rend naturellement la valeur de souhait ou de demande.
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: sur un terrain uni
  rationale: מִישׁוֹר évoque un lieu plat, égal ou droit. « Sur un terrain uni » conserve l’image spatiale d’un cheminement sans obstacle et reste naturel en français.
theological_decisions:
- issue: Faut-il écrire « esprit » ou « Esprit » pour רוּחֲךָ ?
  choice: ton bon Esprit
  alternative: ton bon esprit
  rationale: Puisque le psalmiste s’adresse à Dieu et parle de « ton esprit », la lecture comme désignation de l’Esprit de Dieu est naturelle. Toutefois, l’hébreu ne connaît pas la distinction typographique entre minuscule et majuscule ; la note préserve donc la possibilité d’un sens plus général, comme l’esprit ou la disposition bienveillante de Dieu.
- issue: Sens concret ou figuré de בְּאֶרֶץ מִישׁוֹר
  choice: sur un terrain uni
  alternative: dans un pays de droiture
  rationale: 'Le sens spatial offre l’image la plus immédiate : Dieu guide le priant sur un terrain sûr et sans obstacle. Le nom peut aussi évoquer la rectitude, mais traduire directement par « droiture » résoudrait une métaphore que l’hébreu laisse ouverte.'
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. « Terrain uni » maintient l’image poétique sans employer une tournure vieillie ou artificielle.
