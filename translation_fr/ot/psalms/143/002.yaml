source:
  edition: WLC
  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: fr
  text: Et n’entre pas en jugement avec ton serviteur, car aucun être vivant ne peut être juste devant toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car aucun être vivant ne pourra être déclaré juste devant toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַל
  choice: Et ne… pas
  rationale: La conjonction וְ poursuit la supplication du verset précédent; « Et » maintient cet enchaînement sans imposer un contraste.
- source_word: תָּב֣וֹא בְ֭/מִשְׁפָּט
  choice: entre… en jugement
  rationale: L’expression hébraïque relève du langage judiciaire. « Entrer en jugement avec » est une tournure française naturelle et digne qui conserve la métaphore du procès.
- source_word: אֶת עַבְדֶּ֑/ךָ
  choice: avec ton serviteur
  rationale: Après l’expression idiomatique française, אֶת est rendu par « avec ». « Serviteur » convient au registre de la prière et au rapport exprimé ici, sans accentuer indûment la nuance d’esclavage possible dans עֶבֶד.
- source_word: כִּ֤י
  choice: car
  rationale: Introduit le motif de la supplication de façon concise et naturelle.
- source_word: לֹֽא יִצְדַּ֖ק
  choice: ne sera reconnu juste
  rationale: Dans ce cadre judiciaire, le qal de צדק exprime le fait d’être trouvé ou déclaré dans son droit. Cette formulation française conserve à la fois la dimension forensicque et la notion de justice, sans importer une formulation doctrinale technique.
- source_word: לְ/פָנֶ֣י/ךָ
  choice: devant toi
  rationale: Équivalent idiomatique de la comparution et de l’évaluation en présence de Dieu.
- source_word: כָל חָֽי
  choice: aucun vivant
  rationale: Sous la négation, l’expression littérale « tout vivant » prend un sens universel négatif. « Aucun vivant » en garde la brièveté et l’ampleur poétiques.
theological_decisions:
- issue: Nuance judiciaire ou morale de יִצְדַּק devant le jugement divin
  choice: « aucun vivant ne sera reconnu juste devant toi »
  alternative: « aucun vivant n’est juste devant toi »
  rationale: Le contexte immédiat est explicitement judiciaire; « sera reconnu juste » fait entendre cette dimension sans réduire le verset à une terminologie doctrinale ultérieure. La variante en note préserve la lecture stative et morale également permise par le verbe.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement correspond à l’adresse directe à Dieu dans le psaume. La tournure judiciaire est conservée, tandis que la note maintient l’ambiguïté réelle de יִצְדַּק.
