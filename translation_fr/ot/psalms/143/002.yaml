revisions:
- from: Et n’entre pas en jugement avec ton serviteur, car aucun vivant ne sera reconnu juste devant toi.[a]
  to: Et n’entre pas en jugement avec ton serviteur, car aucun être vivant ne peut être juste devant toi.[a]
