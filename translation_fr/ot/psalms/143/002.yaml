    text: 'Ou : « car aucun être vivant ne pourra être déclaré juste devant toi ».'
    reason: lexical_alternative
  revision_rationale: La révision conserve le cadre judiciaire et la portée universelle du texte hébreu, tout en évitant d’ajouter au texte principal l’idée spécifique d’une reconnaissance officielle. Le présent modal « ne peut être juste » exprime bien la généralité de l’inaccompli négatif; la note conserve explicitement l’interprétation forensique forte.
