review_pass:
  verdict: revise
  source_fidelity: La tournure « n’entre pas en jugement avec ton serviteur » rend fidèlement l’expression judiciaire hébraïque. Toutefois, l’inaccompli יִצְדַּק, dans ce contexte, se rend plus naturellement par un présent gnomique en français (« ne peut être juste / ne sera pas juste ») que par « sera reconnu juste », qui ajoute explicitement l’idée de reconnaissance ou de déclaration. La nuance forensique doit être conservée sans la surtraduire.
  naturalness: Le texte est globalement naturel, poétique et adapté à une prière. « Aucun vivant » est compréhensible mais un peu elliptique; « aucun être vivant » est plus idiomatique en français international tout en gardant la portée universelle. « Ne peut être juste devant toi » est une formulation française nette et conserve la portée de l’inaccompli sous négation.
  terminology: « Serviteur », « jugement » et « devant toi » conviennent au registre psalmique. « Juste » rend correctement צדק sans imposer de système doctrinal. La note doit présenter l’alternative forensique (« ne pourra être déclaré juste »), plutôt que de faire de la lecture stative une alternative alors qu’elle devient le texte principal.
  issues:
  - severity: medium
    issue: « sera reconnu juste » explicite excessivement le mécanisme de reconnaissance judiciaire.
    rationale: יִצְדַּק peut avoir une nuance forensique (« être dans son droit », « être justifié »), mais le verbe ne contient pas en lui-même le verbe français « reconnaître ». Cette explicitation réduit l’ambiguïté entre état de justice et acquittement/vindication.
  - severity: low
    issue: « aucun vivant » est moins idiomatique que « aucun être vivant ».
    rationale: Les deux sont possibles, mais « aucun être vivant » est plus naturel en français moderne international et rend clairement כָּל־חָי sous la négation.
  revised_text: Et n’entre pas en jugement avec ton serviteur, car aucun être vivant ne peut être juste devant toi.[a]
  revised_footnotes:
