id: PSA.97.10
reference: Psalms 97:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: fr
  text: Vous qui aimez Yahweh, détestez le mal ! Il garde la vie de ses fidèles[a] ; il les délivre de la main des méchants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’âme de ceux qui lui sont attachés ». Le mot hébreu peut désigner la vie, la personne ou l’âme, et le terme traduit par « fidèles » peut aussi se rendre par « saints » ou « personnes pieuses ».
    reason: Alternative lexicale préservant l’étendue sémantique de נַפְשׁוֹת et חֲסִידָיו.
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Vous qui aimez Yahweh
  rationale: Le participe construit désigne ceux qui aiment Yahweh. La tournure vocative rend clairement l’adresse en français naturel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: שִׂנְאוּ רָע
  choice: détestez le mal
  rationale: L’impératif masculin pluriel exprime un ordre direct. « Détester » est idiomatique en français contemporain et garde la force du verbe hébreu, tandis que « le mal » préserve la portée générale de רָע.
- source_word: שֹׁמֵר
  choice: Il garde
  rationale: Le participe présente l’action protectrice habituelle de Yahweh. « Garde » conserve l’image et convient au contexte de délivrance.
- source_word: נַפְשׁוֹת
  choice: la vie
  rationale: Dans ce contexte de protection contre les méchants, נֶפֶשׁ désigne la vie ou la personne plutôt qu’une âme immatérielle. Le singulier collectif français s’accorde naturellement avec « ses fidèles ».
- source_word: חֲסִידָיו
  choice: ses fidèles
  rationale: Le terme désigne ceux qui se caractérisent par leur piété et leur loyauté envers Dieu. « Ses fidèles » est clair, relationnel et dépourvu de jargon confessionnel.
- source_word: מִיַּד רְשָׁעִים
  choice: de la main des méchants
  rationale: Cette formulation conserve l’image hébraïque de la main comme pouvoir ou emprise tout en restant intelligible en français.
- source_word: יַצִּילֵם
  choice: il les délivre
  rationale: Le hiphil de נצל exprime une action de délivrer ou d’arracher au danger. « Délivre » s’associe naturellement à « de la main des méchants ».
theological_decisions:
- issue: Sens de נַפְשׁוֹת dans le contexte
  choice: la vie
  alternative: les âmes ; les personnes
  rationale: La protection et la délivrance face aux méchants favorisent ici le sens concret de vie ou de personne. Cette traduction n’impose pas au verset une anthropologie particulière.
- issue: Rendu de חֲסִידָיו
  choice: ses fidèles
  alternative: ses saints ; ceux qui lui sont attachés
  rationale: « Ses fidèles » communique l’attachement pieux et loyal à Dieu sans réduire le mot à une catégorie ecclésiastique ultérieure.
translation_notes:
  register: Français international moderne, naturel et digne. L’exclamation souligne la force de l’impératif sans ajouter de contenu. Le parallélisme protecteur entre « garde » et « délivre » est conservé.
