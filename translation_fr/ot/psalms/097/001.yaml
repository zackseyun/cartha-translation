id: PSA.97.1
reference: Psalms 97:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: fr
  text: Yahweh règne ! Que la terre exulte, que les nombreuses régions côtières[a] se réjouissent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « îles ». Le terme hébreu peut désigner des îles ou des régions côtières maritimes, notamment lointaines.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve le nom personnel présent dans le texte hébreu, au lieu de le remplacer par un titre.
- source_word: מָלָךְ
  choice: règne
  rationale: Le parfait peut exprimer l’accession à la royauté ou l’état royal qui en résulte. Ici, « règne » proclame naturellement la souveraineté actuelle de Yahweh sans imposer le sens plus étroit de « est devenu roi ».
- source_word: תָּגֵל
  choice: Que … exulte
  rationale: L’imparfait a ici une valeur exhortative, bien rendue en français par « Que… ». « Exulte » convient au registre poétique et exprime une joie éclatante.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallélisme avec les nombreuses régions maritimes indique une portée universelle plutôt que la seule terre d’Israël.
- source_word: יִשְׂמְחוּ
  choice: que … se réjouissent
  rationale: Comme le verbe précédent, cet imparfait est compris comme une exhortation. La variation entre « exulte » et « se réjouissent » restitue naturellement le parallélisme poétique.
- source_word: אִיִּים
  choice: régions côtières
  rationale: Le terme peut désigner des îles ou des territoires maritimes lointains. « Régions côtières » conserve cette portée géographique large, tandis que l’autre sens est signalé en note.
- source_word: רַבִּים
  choice: nombreuses
  rationale: Cet adjectif quantitatif modifie directement les régions côtières et se traduit simplement et naturellement ainsi.
theological_decisions:
- issue: Portée de la proclamation de la royauté de Yahweh
  choice: Une proclamation universelle du règne actuel de Yahweh
  alternative: Une affirmation limitée à la terre d’Israël, ou une formule d’intronisation signifiant « Yahweh est devenu roi »
  rationale: Le parallélisme entre « la terre » et les nombreuses régions côtières favorise une portée mondiale. « Règne » maintient la réalité présente de la royauté divine sans exclure totalement la nuance d’intronisation possible dans la forme hébraïque.
translation_notes:
  register: Français international moderne, poétique et digne. Les deux propositions introduites par « Que » rendent la force exhortative des imparfaits hébreux; le point d’exclamation souligne la proclamation initiale sans alourdir le verset.
