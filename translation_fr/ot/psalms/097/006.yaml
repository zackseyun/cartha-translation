id: PSA.97.6
reference: Psalms 97:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: fr
  text: Les cieux proclament sa justice[a], et tous les peuples voient sa gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ». Le terme hébreu peut exprimer aussi bien la droiture morale que la justice.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: proclament
  rationale: Le hifil de נגד exprime le fait de faire connaître ou de déclarer. « Proclament » convient au parallélisme poétique et à la portée publique de l’annonce.
- source_word: הַשָּׁמַיִם
  choice: les cieux
  rationale: Dans ce cadre cosmique et théophanique, « les cieux » conserve le registre élevé et la personnification poétique de la création.
- source_word: צִדְקוֹ
  choice: sa justice
  rationale: צֶדֶק peut désigner à la fois la conformité morale au bien et l’exercice juste du jugement. En français moderne, « justice » couvre naturellement ces dimensions dans ce contexte, tandis que « droiture » reste une autre traduction possible.
- source_word: וְרָאוּ
  choice: et … voient
  rationale: Bien que la forme hébraïque soit un accompli, le présent restitue ici la vivacité et la portée générale de l’énoncé poétique.
- source_word: כָל הָעַמִּים
  choice: tous les peuples
  rationale: Cette traduction rend directement le pluriel עַמִּים et préserve la portée universelle sans introduire la nuance politique de « nations ».
- source_word: כְּבוֹדוֹ
  choice: sa gloire
  rationale: Pour Dieu, כָּבוֹד évoque couramment sa majesté manifestée. « Gloire » est ici naturel, digne et bien établi.
theological_decisions:
- issue: Portée de l’attribut divin צִדְקוֹ
  choice: sa justice
  alternative: sa droiture
  rationale: L’hébreu réunit des nuances éthiques et judiciaires. « Justice » convient bien au français courant et biblique, mais la note maintient « droiture » afin de ne pas réduire le terme à sa seule dimension judiciaire.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu est conservé dans une phrase concise, avec le présent pour exprimer la proclamation et la vision comme réalités vives.
