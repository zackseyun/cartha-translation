source:
  edition: WLC
  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: fr
  text: 'Qu’ils soient couverts de honte, tous ceux qui servent des images sculptées,

    ceux qui se vantent de leurs idoles !

    Prosternez-vous devant lui, tous les dieux[a] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous les êtres célestes » ou « tous les anges ». L’hébreu dit littéralement « tous les dieux » ; il peut s’agir d’une allusion polémique aux dieux des nations ou des êtres célestes qui se tiennent devant le SEIGNEUR.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: Qu’ils soient couverts de honte
  rationale: Le verbe בוש exprime la honte ou le déshonneur. Cette tournure française rend ici la valeur volitive possible de l’inaccompli et l’idée d’une humiliation manifeste, sans exclure la nuance « qu’ils aient honte ».
- source_word: עֹבְדֵי
  choice: ceux qui servent
  rationale: Le participe de עבד désigne ceux qui rendent un service, ici de nature cultuelle. « Servent » conserve ce sens lexical tout en laissant le contexte indiquer qu’il s’agit d’un culte.
- source_word: פֶסֶל
  choice: des images sculptées
  rationale: פֶסֶל désigne une représentation façonnée, notamment par sculpture. Ce choix est plus précis que le terme général « idoles » et reste naturel en français moderne.
- source_word: הַמִּתְהַלְלִים
  choice: ceux qui se vantent
  rationale: La forme hitpael de הלל exprime ici le fait de tirer gloire ou fierté de quelque chose. « Se vantent » est idiomatique et respecte la construction participiale.
- source_word: בָּאֱלִילִים
  choice: de leurs idoles
  rationale: אֱלִילִים désigne des idoles avec une connotation possible de nullité ou d’inanité. En français, « se vanter de leurs idoles » rend naturellement la préposition ב et explicite seulement la relation d’appartenance impliquée par le groupe concerné, sans ajouter le qualificatif interprétatif « vaines ».
- source_word: הִשְׁתַּחֲווּ
  choice: Prosternez-vous
  rationale: L’impératif de שׁחה évoque l’action de s’incliner profondément en signe d’hommage ou d’adoration. « Prosternez-vous » conserve à la fois le geste concret et sa portée cultuelle.
- source_word: לוֹ
  choice: devant lui
  rationale: Bien que ל signifie littéralement « à lui », « se prosterner devant lui » est la formulation française naturelle pour exprimer l’hommage adressé à quelqu’un.
- source_word: כָּל אֱלֹהִים
  choice: tous les dieux
  rationale: Le pluriel אֱלֹהִים est rendu littéralement afin de préserver la formulation poétique et la tension entre une référence polémique aux divinités des nations et une possible référence aux êtres célestes.
theological_decisions:
- issue: Référent de כָּל אֱלֹהִים
  choice: tous les dieux
  alternative: tous les êtres célestes ; tous les anges
  rationale: Le texte hébreu porte littéralement « tous les dieux ». Le contexte peut viser polémiquement les divinités des nations ou désigner les êtres célestes qui entourent le SEIGNEUR, comme dans certaines traditions anciennes. Le texte principal conserve donc la formulation hébraïque, et la note présente les autres compréhensions sans trancher la tension théologique.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux premiers segments est conservé, ainsi que l’impératif abrupt du dernier. « Images sculptées » évite l’archaïsme de « images taillées », tandis que « prosternez-vous » garde la solennité cultuelle du verbe hébreu.
