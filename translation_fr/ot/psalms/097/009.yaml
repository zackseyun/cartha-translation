id: PSA.97.9
reference: Psalms 97:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי אַתָּ֤ה יְהוָ֗ה עֶלְי֥וֹן עַל כָּל הָ/אָ֑רֶץ מְאֹ֥ד נַ֝עֲלֵ֗יתָ עַל כָּל אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/009.yaml
  text: For you[a], O Yahweh, are Most High over all the earth; you are exalted far above all gods.
translation:
  language: fr
  text: Car toi, Yahweh, tu es le Très-Haut sur toute la terre ; tu es élevé bien au-dessus de tous les dieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tous les êtres divins » ou « de tous les êtres célestes ». Le mot hébreu ʾelohim peut désigner des dieux, des êtres divins ou des puissances célestes selon le contexte.
    reason: Alternative lexicale préservant l’ambiguïté du terme hébreu.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’affirmation précédente et convient au mouvement argumentatif du psaume.
- source_word: אַתָּה
  choice: toi… tu
  rationale: Le pronom explicite est conservé sous une forme française naturelle afin de rendre l’insistance portée sur Yahweh lui-même.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de le remplacer par un titre.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Rend le rang suprême exprimé par l’hébreu tout en conservant sa résonance de titre divin.
- source_word: עַל כָּל הָאָרֶץ
  choice: sur toute la terre
  rationale: Exprime la suprématie de Yahweh sur le monde entier dans un français idiomatique.
- source_word: מְאֹד
  choice: bien au-dessus
  rationale: L’adverbe intensifie l’élévation ; « bien au-dessus » en restitue naturellement la force dans cette construction comparative.
- source_word: נַעֲלֵיתָ
  choice: tu es élevé
  rationale: 'Rend la valeur passive et résultative du verbe : Yahweh se trouve dans une position d’élévation suprême.'
- source_word: עַל כָּל אֱלֹהִים
  choice: au-dessus de tous les dieux
  rationale: Conserve le pluriel lexical et la portée polémique du texte sans déterminer prématurément la nature exacte de ses référents.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: La translittération « Yahweh » préserve le nom personnel révélé dans le texte hébreu plutôt que de lui substituer un titre.
- issue: Sens de אֱלֹהִים dans le dernier membre
  choice: dieux
  alternative: êtres divins ; êtres célestes
  rationale: « Dieux » maintient le sens pluriel direct et la tension théologique du psaume, qui affirme la suprématie de Yahweh sans préciser si les référents sont des divinités rivales, des idoles ou des êtres célestes.
translation_notes:
  register: Français international moderne, poétique et digne. La reprise « toi… tu » conserve l’emphase hébraïque sans produire une tournure artificielle. Le point-virgule respecte le parallélisme des deux membres.
