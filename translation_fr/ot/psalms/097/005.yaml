source:
  edition: WLC
  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: fr
  text: Les montagnes fondent comme la cire devant Yahvé[a], devant le Seigneur de toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « de devant la face (ou la présence) de Yahvé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: les montagnes
  rationale: Le nom pluriel défini désigne les montagnes dans l’image poétique de la création ébranlée.
- source_word: כַּדּוֹנַג
  choice: comme la cire
  rationale: Le préfixe comparatif כ est rendu naturellement par « comme », tout en conservant la comparaison.
- source_word: נָמַסּוּ
  choice: fondent
  rationale: Le verbe exprime l’action de fondre ou de se dissoudre. Le présent français restitue la force vive de ce parfait poétique dans la description théophanique.
- source_word: מִלִּפְנֵי
  choice: devant
  rationale: L’expression signifie littéralement « de devant la face/présence de » ; « devant » est idiomatique et garde l’idée de la présence divine.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » représente le tétragramme comme nom propre plutôt que de lui substituer un titre.
- source_word: אֲדוֹן
  choice: Seigneur
  rationale: Ce titre signifie « seigneur, maître » ; « Seigneur » convient au registre poétique élevé et reste distinct du nom divin précédent.
- source_word: כָּל הָאָרֶץ
  choice: de toute la terre
  rationale: Cette formulation conserve le rapport de complément avec « Seigneur » et la portée universelle de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR ; Yahweh
  rationale: Le texte porte directement le tétragramme. « Yahvé », forme bien établie en français, préserve ici le nom propre et le distingue du titre אֲדוֹן dans le second membre.
- issue: Valeur aspectuelle de נָמַסּוּ en poésie
  choice: présent « fondent »
  alternative: passé « ont fondu »
  rationale: Le parfait hébreu peut donner une représentation vive et saisissante. Le présent français exprime cette scène théophanique sans imposer une chronologie révolue.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « devant » reproduit le parallélisme hébreu ; « Yahvé » et « Seigneur » maintiennent la distinction entre le nom divin et le titre.
