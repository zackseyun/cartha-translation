  text: שִׂמְח֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה וְ֝/הוֹד֗וּ לְ/זֵ֣כֶר קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/012.yaml
  text: Rejoice in Yahweh[a], you righteous ones[b], and give thanks at the remembrance of his holiness.
translation:
  language: fr
  text: Vous les justes, réjouissez-vous en Yahweh et rendez grâce en souvenir[a] de sa sainteté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’évocation de sa sainteté » ou « à la mention de sa sainteté ». Le mot hébreu זֵכֶר peut désigner le souvenir, le mémorial ou la mention.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: réjouissez-vous
  rationale: L’impératif pluriel de שׂמח appelle à manifester de la joie ; « réjouissez-vous » en conserve clairement la force.
- source_word: צַדִּיקִים
  choice: vous qui êtes justes
  rationale: Le pluriel fonctionne comme une interpellation. Cette formulation française rend explicite l’adresse directe sans réduire le terme à une notion abstraite.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition בְּ présente Yahweh comme celui en qui ou à cause de qui les justes se réjouissent ; « en » préserve cette formulation concise.
- source_word: יהוה
  choice: Yahweh
  rationale: Transcription du nom divin exprimé directement par le tétragramme dans le texte hébreu.
- source_word: וְהוֹדוּ
  choice: et rendez grâce
  rationale: Dans ce contexte psalmique, le hifil impératif pluriel de ידה exprime la reconnaissance et la louange ; « rendez grâce » est naturel et digne en français.
- source_word: לְזֵכֶר
  choice: quand vous évoquez
  rationale: זֵכֶר peut désigner le souvenir, la mémoire ou la mention. La tournure verbale française évite l’impression funéraire que pourrait produire « à la mémoire de », tout en conservant l’idée d’une sainteté rappelée ou proclamée.
- source_word: קָדְשׁוֹ
  choice: sa sainteté
  rationale: Le nom קֹדֶשׁ avec suffixe signifie littéralement « sa sainteté ». Le texte ne contient pas le mot « nom » ; celui-ci n’est donc pas ajouté.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin. Sa transcription préserve le caractère personnel et alliance­nel du nom sans le remplacer par un titre.
- issue: Faut-il ajouter « nom » à קָדְשׁוֹ ?
  choice: sa sainteté
  alternative: son saint nom
  rationale: Bien que « son saint nom » reflète une expression psalmique apparentée et soit traditionnel dans certaines versions, le mot שֵׁם (« nom ») est absent ici. Le texte principal conserve donc la formulation hébraïque.
- issue: Sens de לְזֵכֶר
  choice: quand vous évoquez
  alternative: à la mémoire de / à la mention de
  rationale: 'Le substantif זֵכֶר permet plusieurs nuances proches : souvenir, mémoire et mention. Le rendu choisi reste naturel en français, tandis que la note maintient l’ambiguïté lexicale.'
translation_notes:
  register: Français international moderne, clair et digne. L’adresse « Vous qui êtes justes » rend le vocatif intelligible ; « rendez grâce » maintient le registre psalmique. La formulation évite d’ajouter « nom », absent de l’hébreu, et la note conserve l’étendue de sens de זֵכֶר.
