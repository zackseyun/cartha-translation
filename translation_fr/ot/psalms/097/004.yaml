  text: הֵאִ֣ירוּ בְרָקָ֣י/ו תֵּבֵ֑ל רָאֲתָ֖ה וַ/תָּחֵ֣ל הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/004.yaml
  text: His lightning lights up the world[a]; the earth sees and trembles.
translation:
  language: fr
  text: Ses éclairs illuminent le monde ; la terre voit et tremble[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « frémit » ou « est ébranlée ». Le verbe hébreu peut exprimer le tremblement, les convulsions ou les douleurs de l’enfantement.'
    reason: alternative lexicale
lexical_decisions:
- source_word: הֵאִירוּ
  choice: illuminent
  rationale: Le hifil exprime ici le fait de répandre ou de faire paraître la lumière. « Illuminent » restitue naturellement ce sens causatif avec les éclairs pour sujet.
- source_word: בְרָקָיו
  choice: ses éclairs
  rationale: Le pluriel muni du suffixe masculin singulier désigne les éclairs de Dieu. Le français emploie naturellement le pluriel « éclairs ».
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne couramment le monde, notamment dans son étendue habitée. « Le monde » maintient la distinction poétique avec הָאָרֶץ, rendu ensuite par « la terre ».
- source_word: רָאֲתָה
  choice: voit
  rationale: Bien que la forme soit un accompli, le présent rend la vivacité de la scène poétique. L'emploi absolu « la terre voit » préserve l'absence de complément explicite dans l'hébreu.
- source_word: וַתָּחֵל
  choice: et tremble
  rationale: Le verbe חול/חיל peut évoquer le tremblement, le frémissement, les convulsions ou les douleurs. « Tremble » convient au contexte théophanique sans réduire l'image à un phénomène strictement sismique.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: En parallèle avec « le monde » et dans ce contexte cosmique, הָאָרֶץ désigne ici la terre entière plutôt qu'un territoire particulier.
theological_decisions:
- issue: Portée cosmique de la manifestation divine
  choice: « le monde » et « la terre » sont conservés comme termes distincts et complémentaires
  alternative: Comprendre הָאָרֶץ comme « le pays » dans un sens local
  rationale: Le parallélisme et le contexte de théophanie favorisent une portée universelle, sans qu'il soit nécessaire d'ajouter une précision doctrinale.
- issue: Objet de la vision de la terre
  choice: Maintenir l'expression absolue « la terre voit »
  alternative: Expliciter « la terre le voit » ou « la terre voit cela »
  rationale: L'hébreu ne donne aucun complément explicite à רָאֲתָה. La formulation poétique française conserve cette indétermination au lieu d'identifier silencieusement l'objet vu.
translation_notes:
  register: Français international moderne, poétique et digne. Le présent donne à la scène sa force immédiate ; le parallélisme bref de l'hébreu est conservé.
