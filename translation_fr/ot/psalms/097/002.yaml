source:
  edition: WLC
  text: עָנָ֣ן וַ/עֲרָפֶ֣ל סְבִיבָ֑י/ו צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: fr
  text: Nuée et épaisse obscurité l’entourent[a] ; justice et droit sont le fondement de son trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Un nuage et l’obscurité l’environnent. »'
    reason: Alternative lexicale et poétique pour עָנָן, עֲרָפֶל et סְבִיבָיו.
lexical_decisions:
- source_word: עָנָן
  choice: nuée
  rationale: Le nom hébreu est singulier et collectif. « Nuée » conserve cette forme poétique et convient au contexte d’une manifestation divine.
- source_word: וַעֲרָפֶל
  choice: et épaisse obscurité
  rationale: עֲרָפֶל évoque une obscurité dense ou une nuée sombre. « Épaisse obscurité » préserve la force de l’image sans l’expliquer.
- source_word: סְבִיבָיו
  choice: l’entourent
  rationale: Cette formulation française naturelle rend littéralement l’idée de ce qui se trouve autour de lui; le pluriel verbal s’accorde avec les deux éléments coordonnés.
- source_word: צֶדֶק
  choice: justice
  rationale: צֶדֶק exprime ici la rectitude conforme au bien. « Justice » est idiomatique en français et demeure distinct, dans la paire, de l’exercice concret du droit.
- source_word: וּמִשְׁפָּט
  choice: et droit
  rationale: מִשְׁפָּט peut désigner le jugement, la justice rendue ou l’ordre juridique. « Droit » évite la répétition de « justice » et maintient la distinction poétique avec צֶדֶק.
- source_word: מְכוֹן
  choice: le fondement
  rationale: Le terme désigne une base ferme ou un lieu établi. « Fondement » restitue précisément la métaphore du trône.
- source_word: כִּסְאוֹ
  choice: de son trône
  rationale: Cette construction possessive rend naturellement la chaîne construite hébraïque מְכוֹן כִּסְאוֹ.
theological_decisions:
- issue: Imagerie théophanique de la présence divine voilée
  choice: Conserver la nuée et l’épaisse obscurité autour de Dieu sans atténuer l’image.
  alternative: Expliciter ces images comme des symboles de majesté ou de mystère.
  rationale: Le texte associe manifestation et dissimulation divines. La traduction préserve cette tension sans imposer une interprétation abstraite.
translation_notes:
  register: Français moderne, digne et poétique. « Nuée » est légèrement soutenu mais courant dans un contexte biblique; « justice et droit » forme une paire naturelle qui préserve la distinction des deux termes hébreux.
