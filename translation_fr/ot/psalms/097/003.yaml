id: PSA.97.3
reference: Psalms 97:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: fr
  text: Un feu avance devant lui et embrase ses adversaires tout autour[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses ennemis ».
    reason: Alternative lexicale pour צָרָיו.
lexical_decisions:
- source_word: אֵשׁ
  choice: Un feu
  rationale: Le nom désigne le feu. En poésie hébraïque, l’absence d’article permet ici « un feu », formulation naturelle qui présente le feu théophanique sans ajouter un article défini absent du verset.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: L’expression formée avec « face, présence » signifie idiomatiquement « devant lui » et conserve le pronom du texte hébreu.
- source_word: תֵּלֵךְ
  choice: avance
  rationale: הלך signifie couramment « aller, marcher ». Avec le feu pour sujet, « avance » rend naturellement le mouvement vers l’avant sans donner au feu une démarche trop humaine.
- source_word: וּתְלַהֵט
  choice: embrase
  rationale: La forme verbale exprime l’action ardente du feu. « Embrase » garde la force de l’image sans imposer explicitement l’idée d’une destruction totale.
- source_word: סָבִיב
  choice: tout autour
  rationale: L’adverbe indique ce qui se produit aux alentours, de tous côtés. « Tout autour » en restitue la portée dans un français poétique et actuel.
- source_word: צָרָיו
  choice: ses adversaires
  rationale: Le terme désigne ceux qui s’opposent à lui ou lui sont hostiles. « Adversaires » conserve cette nuance; « ennemis » reste une traduction possible.
theological_decisions:
- issue: Référent des suffixes masculins singuliers à la troisième personne dans le contexte théophanique du psaume 97
  choice: Conserver « lui » et « ses » sans remplacer les pronoms par le nom divin.
  alternative: Un feu avance devant le SEIGNEUR et embrase ses adversaires tout autour.
  rationale: L’hébreu emploie des suffixes pronominaux dont l’antécédent ressort du contexte. Garder les pronoms respecte la formulation du verset et son mouvement poétique sans explicitation ajoutée.
- issue: Degré de destruction exprimé par וּתְלַהֵט
  choice: « embrase », sans préciser que les adversaires sont entièrement consumés.
  alternative: « consume » ou « réduit en cendres » ses adversaires.
  rationale: Le verbe évoque une flamme intense, mais le verset ne marque pas sans ambiguïté l’achèvement total de la destruction. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. La syntaxe reste concise, les pronoms du texte source sont maintenus, et aucune identification explicite absente de ce verset n’est ajoutée.
