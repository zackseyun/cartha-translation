source:
  edition: WLC
  text: א֭וֹר זָרֻ֣עַ לַ/צַּדִּ֑יק וּֽ/לְ/יִשְׁרֵי לֵ֥ב שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/011.yaml
  text: Light is sown for the righteous[a], and joy for the upright in heart.
translation:
  language: fr
  text: La lumière est semée pour le juste[a], et la joie pour ceux dont le cœur est droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « La lumière est répandue / plantée pour le juste. » L’hébreu conserve une métaphore agricole : la lumière est représentée comme quelque chose que l’on sème.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: La lumière
  rationale: Le nom désigne ici métaphoriquement une réalité favorable, possiblement la délivrance, le bonheur ou la faveur. La traduction conserve l’image ouverte du texte hébreu.
- source_word: זָרֻעַ
  choice: est semée
  rationale: Le participe passif de זרע signifie littéralement « semée ». Cette formulation préserve la métaphore agricole, inhabituelle mais intelligible en français.
- source_word: לַצַּדִּיק
  choice: pour le juste
  rationale: La préposition ל exprime ici l’avantage ou la destination. Le singulier générique « le juste » correspond à la forme hébraïque et reste naturel dans ce registre poétique.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: et la joie pour ceux dont le cœur est droit
  rationale: Le pluriel hébreu désigne les personnes intérieurement droites. Cette formulation française actuelle préserve le cœur comme siège de la disposition morale et rend clairement le parallélisme elliptique.
- source_word: שִׂמְחָה
  choice: la joie
  rationale: « Joie » est le terme français le plus direct et naturel, en parallèle avec « lumière ».
theological_decisions:
- issue: Sens métaphorique de la lumière semée
  choice: Conserver « La lumière est semée » sans expliciter la nature de cette lumière.
  alternative: « La délivrance est préparée » ou « le bonheur est réservé » pour le juste.
  rationale: Le texte poétique ne réduit pas la lumière à une seule réalité théologique. Garder la métaphore préserve son amplitude ainsi que la tension entre une bénédiction déjà semée et son éventuelle manifestation future.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste simple; l’image agricole frappante de l’hébreu est volontairement conservée. Le second membre explicite naturellement l’ellipse verbale tout en maintenant le parallélisme.
