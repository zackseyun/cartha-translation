source:
  edition: WLC
  text: שָׁמְעָ֬ה וַ/תִּשְׂמַ֨ח צִיּ֗וֹן וַ֭/תָּגֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְמַ֖עַן מִשְׁפָּטֶ֣י/ךָ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/008.yaml
  text: Zion heard and rejoiced[a], and the daughters of Judah exulted because of your judgments, O Yahweh.
translation:
  language: fr
  text: Sion a entendu et s’est réjouie ; les filles de Juda[a] ont exulté à cause de tes jugements, ô Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les villes de Juda » ou « les localités de Juda ». L’hébreu dit littéralement « les filles de Juda », expression poétique qui peut désigner les communautés de Juda.
    reason: alternative lexicale
lexical_decisions:
- source_word: שָׁמְעָה
  choice: a entendu
  rationale: Le qal accompli, troisième personne du féminin singulier, a Sion pour sujet. Le passé composé rend naturellement en français l’action accomplie dans cette séquence poétique.
- source_word: וַתִּשְׂמַח
  choice: et s’est réjouie
  rationale: Le verbe שׂמח exprime la joie. Le féminin respecte le sujet « Sion » et « se réjouir » conserve un registre poétique naturel.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom propre est conservé sous sa forme française traditionnelle, sans remplacer explicitement Sion par Jérusalem ou par son peuple.
- source_word: וַתָּגֵלְנָה
  choice: ont exulté
  rationale: גיל évoque une joie vive. « Exulter » distingue ce verbe de שׂמח tout en reflétant son intensité.
- source_word: בְּנוֹת יְהוּדָה
  choice: les filles de Juda
  rationale: La traduction littérale préserve l’image poétique et l’ambiguïté de l’hébreu ; le sens géographique possible est signalé en note.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Dans ce contexte, la locution introduit la raison de la joie. « À cause de » exprime clairement cette valeur causale.
- source_word: מִשְׁפָּטֶיךָ
  choice: tes jugements
  rationale: מִשְׁפָּט peut désigner des décisions ou des actes judiciaires. « Jugements » demeure proche de l’hébreu et convient au contexte du règne juste de Dieu.
- source_word: יְהוָה
  choice: ô Yahweh
  rationale: Le tétragramme est rendu par le nom personnel « Yahweh ». La particule vocative « ô » reflète l’adresse directe et convient au registre poétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: ô Yahweh
  alternative: ô Éternel / Seigneur
  rationale: Le texte emploie directement le tétragramme. Garder « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Interprétation de בְּנוֹת יְהוּדָה
  choice: les filles de Juda
  alternative: les villes de Juda / les localités de Juda
  rationale: L’expression signifie littéralement « filles de Juda », mais peut désigner poétiquement les communautés de Juda. Le texte principal conserve l’image et la note présente l’interprétation géographique sans trancher silencieusement.
translation_notes:
  register: Français international actuel, digne et poétique. Le parallélisme entre la joie de Sion et celle des filles de Juda est conservé, de même que la différence d’intensité entre « se réjouir » et « exulter ».
