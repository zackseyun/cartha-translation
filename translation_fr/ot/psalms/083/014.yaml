  yaml_path: translation/ot/psalms/083/014.yaml
  text: As fire burns a forest[a], and as a flame sets the mountains ablaze,
translation:
  language: fr
  text: 'Comme un feu qui brûle une forêt,

    et comme une flamme qui embrase les montagnes,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאֵשׁ
  choice: Comme un feu
  rationale: Le préfixe comparatif כ introduit une comparaison. « Comme un feu » est naturel en français et conserve l’image poétique.
- source_word: תִּבְעַר
  choice: qui brûle
  rationale: Le qal de בער décrit ici l’action du feu sur la forêt. « Brûle » en donne le sens direct sans ajouter l’idée plus forte de destruction totale.
- source_word: יָעַר
  choice: une forêt
  rationale: Le nom désigne une forêt ou une région boisée. L’article indéfini convient à la portée générale de la comparaison en français.
- source_word: וּכְלֶהָבָה
  choice: comme une flamme
  rationale: לֶהָבָה signifie « flamme »; la seconde comparaison parallèle est conservée avec une formulation française fluide.
- source_word: תְּלַהֵט
  choice: qui embrase
  rationale: Le piel de להט exprime une combustion intense. « Embrase » restitue cette force et s’emploie naturellement avec « les montagnes ».
- source_word: הָרִים
  choice: les montagnes
  rationale: Le nom signifie « montagnes » et porte l’article défini en hébreu, rendu ici par « les ».
