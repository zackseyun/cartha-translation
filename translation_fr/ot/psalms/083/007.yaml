- source_word: וְעַמּוֹן
  choice: Ammon
  rationale: Forme française traditionnelle et courante de ce nom de peuple ou de territoire.
- source_word: וַעֲמָלֵק
  choice: Amalec
  rationale: Forme française traditionnelle du nom national hébreu.
- source_word: פְּלֶשֶׁת
  choice: la Philistie
  rationale: Le terme hébreu désigne formellement le pays ou la région, plutôt que ses habitants de manière explicite.
- source_word: עִם
  choice: avec
  rationale: Préposition simple qui rattache les habitants de Tyr au dernier élément de l’énumération.
- source_word: יֹשְׁבֵי צֽוֹר
  choice: les habitants de Tyr
  rationale: Rendu naturel et précis de la construction signifiant littéralement « ceux qui habitent Tyr ».
- source_word: צֽוֹר
  choice: Tyr
  rationale: Forme française consacrée du nom de lieu hébreu.
