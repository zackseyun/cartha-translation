  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: fr
  text: Qu’ils sachent que toi seul, dont le nom est Yahweh, es le Très-Haut sur toute la terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Qu’ils sachent
  rationale: Dans le contexte de prière et de demande qui précède, l’imparfait qal avec waw exprime naturellement un souhait ou une demande en français.
- source_word: כִּי
  choice: que
  rationale: Introduit le contenu de ce qu’ils doivent savoir.
- source_word: אַתָּה ... לְבַדֶּךָ
  choice: toi seul ... tu es
  rationale: Préserve l’insistance de l’hébreu sur l’unicité du destinataire, avec une reprise pronominale naturelle en français.
- source_word: שִׁמְךָ יְהוָה
  choice: dont le nom est Yahweh
  rationale: Rend l’apposition hébraïque par une relative claire, tout en conservant directement le nom divin.
- source_word: עֶלְיוֹן
  choice: le Très-Haut
  rationale: Titre divin établi en français, exprimant la suprématie.
- source_word: עַל כָּל הָאָרֶץ
  choice: sur toute la terre
  rationale: עַל marque ici la souveraineté, et הָאָרֶץ a une portée universelle dans ce contexte.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le caractère de nom propre sans le remplacer par un titre.
- issue: Portée de לְבַדֶּךָ
  choice: toi seul ... tu es le Très-Haut
  alternative: toi seul, dont le nom est Yahweh
  rationale: Le placement conserve la tension syntaxique de l’hébreu tout en faisant porter clairement l’exclusivité sur l’affirmation de la suprématie divine.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « toi seul ... tu es » restitue l’emphase hébraïque et reste naturelle dans un registre biblique courant.
