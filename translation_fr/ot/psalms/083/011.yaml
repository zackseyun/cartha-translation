source:
  edition: WLC
  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: fr
  text: Fais que leurs nobles soient comme Oreb et Zeeb[a], et que tous leurs princes soient comme Zébach et Tsalmunna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oreb et Zeeb étaient des chefs madianites vaincus en Juges 7.25 ; Zébach et Tsalmunna étaient des rois madianites vaincus en Juges 8.5–21.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Traite … comme
  rationale: L’impératif adressé à Dieu signifie ici « faire de leurs chefs ce qui est arrivé à… ». En français, « traite … comme » exprime naturellement cette comparaison dans le contexte d’une prière de jugement.
- source_word: נְדִיבֵמוֹ
  choice: leurs nobles
  rationale: נָדִיב désigne ici les personnages éminents ou nobles de l’ennemi; ce choix maintient la distinction avec נְסִיכֵמוֹ.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: comme Oreb et Zeeb
  rationale: Les noms propres renvoient aux chefs madianites de Juges 7. La préposition comparative répétée en hébreu peut être rendue une seule fois devant les deux noms en français.
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: comme Zébah et Tsalmunna
  rationale: Les noms propres renvoient aux rois madianites de Juges 8. La graphie choisie suit une translittération française lisible, avec la comparaison portée sur les deux noms.
- source_word: כָּל
  choice: tous
  rationale: Le terme exprime explicitement la totalité et doit être conservé.
- source_word: נְסִיכֵמוֹ
  choice: leurs princes
  rationale: נָסִיךְ désigne des princes ou dirigeants. « Princes » conserve le registre politique élevé et le parallélisme sans confondre le terme avec « nobles ».
theological_decisions:
- issue: Allusion historique dans la prière de jugement
  choice: Le verset demande que les dirigeants ennemis connaissent le même sort que les chefs madianites nommés.
  alternative: Les noms pourraient être compris seulement comme des exemples génériques d’ennemis vaincus.
  rationale: La mention précise d’Oreb, Zeeb, Zébah et Tsalmunna renvoie aux défaites racontées en Juges 7–8. La traduction garde l’allusion et la force de la prière sans en atténuer la tension ni ajouter d’explication au corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Traite … comme » évite le calque peu idiomatique « fais leurs nobles comme » tout en conservant l’appel explicite au sort des anciens ennemis. Le marqueur [a] figure dans le texte principal.
