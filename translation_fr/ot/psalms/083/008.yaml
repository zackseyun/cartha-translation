  yaml_path: translation/ot/psalms/083/008.yaml
  text: Even Assyria joined with them[a]; they became an arm for the sons of Lot[b]. Selah
translation:
  language: fr
  text: Même l’Assyrie s’est jointe à eux ; ils ont servi de bras[a] aux fils de Lot[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement « ils ont été un bras » : le bras représente ici la force ou le soutien, probablement militaire.'
    reason: lexical_alternative
  - marker: b
    text: Les « fils de Lot » désignent les peuples descendants de Lot, notamment Moab et Ammon.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: Dans ce contexte, גַּם souligne que l’Assyrie elle-même s’ajoute à la coalition ; « même » rend cette valeur emphatique.
- source_word: אַשּׁוּר
  choice: l’Assyrie
  rationale: Le contexte désigne la puissance politique et son peuple ; « l’Assyrie » est la forme courante en français moderne.
- source_word: נִלְוָה עִמָּם
  choice: s’est jointe à eux
  rationale: Cette formulation naturelle conserve l’idée fondamentale d’un rattachement à la coalition sans expliciter davantage la nature de l’alliance.
- source_word: הָיוּ זְרוֹעַ
  choice: ils ont servi de bras
  rationale: Le pluriel de הָיוּ est conservé par « ils », tandis que « bras » maintient la métaphore hébraïque de la force ou du soutien militaire. « Ont servi de » exprime naturellement en français la fonction indiquée par le prédicat.
- source_word: לִבְנֵי לוֹט
  choice: aux fils de Lot
  rationale: La traduction directe préserve l’expression familiale hébraïque, qui désigne collectivement les peuples issus de Lot.
- source_word: סֶלָה
  choice: Sèla
  rationale: Le sens précis du terme restant incertain, il est translittéré plutôt que traduit ; l’accent facilite la prononciation française.
theological_decisions:
- issue: Référent du pluriel הָיוּ après le singulier collectif אַשּׁוּר
  choice: Conserver le passage du singulier « l’Assyrie » au pluriel « ils »
  alternative: « elle a servi de bras » ou « les Assyriens ont servi de bras »
  rationale: L’hébreu passe explicitement du verbe singulier נִלְוָה au pluriel הָיוּ. La traduction maintient cette tension grammaticale et référentielle au lieu de la résoudre silencieusement.
translation_notes:
  register: Français moderne, courant et digne. La métaphore concrète du « bras » et l’expression généalogique « fils de Lot » sont maintenues. « Sèla » est translittéré en raison de son sens incertain.
