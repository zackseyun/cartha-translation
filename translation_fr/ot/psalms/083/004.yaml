review_pass:
  verdict: revise
  source_fidelity: Le projet d’éliminer Israël de son existence nationale est bien compris. Toutefois, « en tant que nation » peut en français qualifier la manière dont les ennemis agissent ou dont Israël disparaît, plutôt que le résultat visé par מִגּוֹי (« qu’ils ne soient plus une nation »). La reformulation proposée explicite sans ajouter de sens cette portée résultative. « Ne soit plus mentionné » rend naturellement le niphal de זכר dans ce contexte et conserve la forme passive.
  naturalness: « Allons » est l’introduction exhortative la plus idiomatique en français moderne pour לְכוּ dans une proposition collective. La phrase révisée est fluide et conserve un registre sobre et digne.
  terminology: « Nation » conserve la valeur collective de גּוֹי. « Le nom d’Israël » préserve la construction et l’expression biblique. Aucun terme théologique spécialisé ne requiert de note.
  issues:
  - severity: medium
    issue: Portée ambiguë de « en tant que nation »
    rationale: Cette expression peut être lue comme un complément de manière (« les faire disparaître comme nation ») plutôt que comme l’objectif de les priver de leur statut d’entité nationale. Le texte hébreu vise leur disparition de l’existence nationale.
  - severity: low
    issue: « Venez » est moins idiomatique dans cet appel à l’action
    rationale: Bien que possible littéralement, « Allons » rend plus spontanément en français l’impératif exhortatif collectif לְכוּ.
  revised_text: 'Ils disent : « Allons, faisons en sorte qu’ils ne soient plus une nation, afin que le nom d’Israël ne soit plus mentionné. »'
  revised_footnotes: []
  revision_rationale: La révision rend explicitement la conséquence nationale exprimée par מִגּוֹי, sans imposer une interprétation doctrinale ni renforcer le degré de destruction. Elle améliore aussi l’idiomaticité de l’exhortation initiale et emploie « mentionné », sens contextuellement naturel de זכר au passif.
