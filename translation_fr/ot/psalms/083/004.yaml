  text: אָמְר֗וּ לְ֭כוּ וְ/נַכְחִידֵ֣/ם מִ/גּ֑וֹי וְ/לֹֽא יִזָּכֵ֖ר שֵֽׁם יִשְׂרָאֵ֣ל עֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/004.yaml
  text: They say[a], “Come, let us wipe them out as a nation, so that the name of Israel will be remembered no more.”
translation:
  language: fr
  text: 'Ils disent : « Allons, faisons en sorte qu’ils ne soient plus une nation, afin que le nom d’Israël ne soit plus mentionné. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְרוּ
  choice: Ils disent
  rationale: Le parfait qal peut décrire une parole prononcée, mais le présent de narration rend ici avec naturel et vivacité le projet hostile exposé dans le psaume.
- source_word: לְכוּ
  choice: Venez
  rationale: L’impératif de הלך fonctionne comme une exhortation collective. « Venez » introduit naturellement en français la proposition des conspirateurs.
- source_word: וְנַכְחִידֵם
  choice: faisons-les disparaître
  rationale: Le hiphil à valeur cohortative de כחד exprime l’action de faire disparaître ou d’exterminer. Ce choix reste énergique tout en s’articulant naturellement avec מִגּוֹי.
- source_word: מִגּוֹי
  choice: en tant que nation
  rationale: 'La préposition מִן avec גּוֹי indique ici la suppression de l’existence nationale d’Israël : le but est qu’il cesse d’exister comme peuple constitué.'
- source_word: וְלֹא יִזָּכֵר
  choice: afin que … ne soit plus jamais évoqué
  rationale: Le niphal de זכר peut signifier « être rappelé », « être mentionné » ou « être évoqué ». « Afin que » explicite la finalité suggérée par le contexte, tandis que le passif est conservé.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: le nom d’Israël
  rationale: Cette traduction directe de la chaîne construite préserve l’expression biblique du nom comme désignation et identité du peuple.
- source_word: עוֹד
  choice: ne … plus jamais
  rationale: Dans une proposition négative, עוֹד signifie « plus », « désormais plus » ou « encore ». « Plus jamais » rend ici la visée définitive des ennemis.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, clair et digne. La citation conserve le parallélisme de l’objectif ennemi : abolir Israël comme nation puis effacer jusqu’à son nom. Aucune note n’est nécessaire, car « en tant que nation » exprime directement la portée contextuelle de מִגּוֹי.'
