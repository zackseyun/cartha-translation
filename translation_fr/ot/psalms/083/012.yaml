  yaml_path: translation/ot/psalms/083/012.yaml
  text: who said[a], “Let us take possession for ourselves of the pastures of God.”
translation:
  language: fr
  text: 'ceux qui ont dit : « Prenons possession des pâturages de Dieu pour nous-mêmes ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: eux qui ont dit
  rationale: Le relatif renvoie aux ennemis mentionnés dans le contexte précédent. « Eux qui ont dit » forme en français un raccord naturel avec le verset antérieur, tandis que le passé composé rend clairement leur parole rapportée.
- source_word: נִירֲשָׁה
  choice: Prenons possession
  rationale: Le verbe ירשׁ peut signifier hériter, prendre possession ou déposséder. Dans ce contexte hostile, « prendre possession » exprime la visée d’appropriation sans ajouter explicitement l’idée de dépossession.
- source_word: לָּנוּ
  choice: pour nous-mêmes
  rationale: Le lamed accompagné du pronom de première personne du pluriel indique ici l’intérêt et l’appropriation; cette formulation en fait ressortir la force intéressée.
- source_word: נְאוֹת
  choice: pâturages
  rationale: Le nom peut désigner des pâturages, des demeures ou des lieux d’habitation. « Pâturages » conserve l’image concrète de terres désirables, tout en laissant les autres sens dans la note.
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans le contexte du psaume, le terme désigne le Dieu d’Israël et appelle donc le singulier.
theological_decisions:
- issue: Sens de נְאוֹת אֱלֹהִים
  choice: les pâturages de Dieu
  alternative: les demeures de Dieu / les lieux où Dieu réside
  rationale: L’expression peut évoquer les terres appartenant à Dieu et à son peuple ou, plus directement, ses lieux de résidence. Le texte principal garde l’image pastorale concrète sans limiter le sens au sanctuaire; la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif « Prenons possession » restitue naturellement le cohortatif hébreu; l’exclamation rend la vigueur de la déclaration hostile.
