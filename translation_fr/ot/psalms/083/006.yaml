lexical_decisions:
- source_word: אָהֳלֵי
  choice: les tentes de
  rationale: Pluriel construit de אֹהֶל, « tente ». L’image concrète est conservée, même si elle désigne probablement par métonymie les groupes associés à Édom.
- source_word: אֱדוֹם
  choice: Édom
  rationale: Nom propre du territoire ou du peuple, conservé sous sa forme usuelle en français.
- source_word: יִשְׁמְעֵאלִים
  choice: les Ismaélites
  rationale: Nom collectif pluriel dérivé d’Ismaël ; « Ismaélites » est la désignation française courante.
- source_word: מוֹאָב
  choice: Moab
  rationale: Le texte hébreu emploie le nom propre plutôt qu’un gentilé ; la formulation concise de la liste est maintenue.
- source_word: הַגְרִים
  choice: les Hagaréniens
  rationale: Gentilé désignant un groupe associé à Hagar ; « Hagaréniens » est une forme française biblique reconnue, tandis que « Hagrites » reflète plus directement la forme consonantique.
