  text: O God[a], do not be silent; do not be still[b], O God.
translation:
  language: fr
  text: Ô Dieu[a], ne reste pas silencieux ! Ne te tais pas et ne reste pas tranquille, ô Dieu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie deux titres divins différents dans ce verset : אֱלֹהִים (Elohim, « Dieu ») au début et אֵל (El, « Dieu », pouvant aussi évoquer « le Puissant ») à la fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Ô Dieu
  rationale: Le nom divin est employé comme apostrophe dans cette prière. « Ô Dieu » restitue naturellement cette adresse solennelle en français.
- source_word: אַל דֳּמִי לָךְ
  choice: ne garde pas le silence
  rationale: Cette expression demande à Dieu de ne pas demeurer silencieux. La tournure française est naturelle et conserve l’urgence de la supplication.
- source_word: אַל תֶּחֱרַשׁ
  choice: ne sois pas sourd
  rationale: Le verbe חרש peut évoquer la surdité aussi bien que le silence. « Ne sois pas sourd » préserve la distinction avec la proposition précédente et exprime l’apparente absence de réponse, sans masquer l’autre sens possible, signalé en note.
- source_word: וְאַל תִּשְׁקֹט
  choice: et ne reste pas tranquille
  rationale: שׁקט exprime le calme, la tranquillité ou l’absence d’agitation. Cette formulation maintient le troisième membre de la supplication et laisse entendre, sans l’expliciter excessivement, l’appel à intervenir.
- source_word: אֵל
  choice: ô Dieu
  rationale: Ce second titre divin clôt le verset en apostrophe. Le rendre également par « Dieu » est naturel en français, tandis qu’une note conserve la distinction lexicale de l’hébreu.
theological_decisions:
- issue: Distinction entre les titres divins אֱלֹהִים et אֵל
  choice: Les deux sont rendus par « Dieu », avec une note sur leur distinction.
  alternative: Rendre אֵל par « Puissant » ou « Dieu puissant ».
  rationale: Le contexte ne requiert pas d’expliciter dans le texte une nuance de puissance qui risquerait de surinterpréter אֵל. La note permet néanmoins de respecter la variation hébraïque.
- issue: Ambiguïté de תֶּחֱרַשׁ entre surdité et silence
  choice: « ne sois pas sourd » dans le texte, avec « ne reste pas silencieux » en note
  alternative: « ne reste pas silencieux »
  rationale: La lecture retenue préserve la variation lexicale et la progression poétique des trois demandes. La note maintient l’ambiguïté réelle du verbe sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme en trois supplications conserve l’insistance de l’hébreu. « Ne reste pas tranquille » demeure volontairement moins explicite que « ne reste pas inactif », afin de ne pas réduire la portée de שׁקט.
