  text: נִשְׁמְד֥וּ בְֽ/עֵין דֹּ֑אר הָ֥יוּ דֹּ֝֗מֶן לָ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/010.yaml
  text: They were destroyed at En-dor[b][a]; they became dung for the ground.
translation:
  language: fr
  text: Ils furent détruits à En-Dor[a] ; ils devinrent du fumier pour le sol[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans En-Dor » ou « près d’En-Dor ». La préposition hébraïque permet plusieurs nuances de lieu avec ce nom.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils furent du fumier sur le sol ». L’hébreu dit littéralement « ils devinrent du fumier pour le sol », image de cadavres réduits à servir d’engrais.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: furent anéantis
  rationale: Le nifal accompli de שׁמד exprime une destruction complète subie. « Furent anéantis » restitue avec naturel la force du verbe et sa valeur passive, sans ajouter de moyen ni d’agent.
- source_word: בְעֵין דֹּאר
  choice: à En-Dor
  rationale: 'La préposition בְּ devant le toponyme עֵין דֹּאר a ici une valeur locative. « À En-Dor » reste idiomatique en français tout en laissant ouverte la nuance précise : dans la localité ou à proximité.'
- source_word: הָיוּ
  choice: devinrent
  rationale: Dans cette construction avec un nom attribut, היה peut indiquer l’entrée dans un état ou le résultat atteint. « Devinrent » rend cette nuance résultative.
- source_word: דֹּמֶן
  choice: du fumier
  rationale: דֹּמֶן désigne des excréments ou du fumier. « Fumier » conserve l’image concrète et humiliante tout en s’accordant naturellement avec « pour le sol ».
- source_word: לָאֲדָמָה
  choice: pour le sol
  rationale: אֲדָמָה désigne ici le sol ou la terre cultivable, et לְ marque le rapport ou la destination. « Pour le sol » suit de près l’image hébraïque de corps devenus fumier destiné à la terre.
