  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: fr
  text: Traite-les comme Madian[a], comme Sisera, comme Yabin, au torrent du Qishon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Fais-leur comme à Madian, comme à Sisera, comme à Yabin, au torrent du Qishon. »'
