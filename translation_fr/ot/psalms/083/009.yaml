lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Traite-les
  rationale: L’impératif de עשה suivi de ל exprime ici la manière dont Dieu doit agir envers les ennemis. « Traite-les » rend naturellement en français la construction et son sens contextuel, sans expliciter indûment « détruis-les ».
- source_word: כְּמִדְיָן
  choice: comme Madian
  rationale: 'Le כ comparatif introduit le précédent historique. La formulation conserve l’ellipse de l’hébreu, dont le sens est : agir envers eux comme envers Madian.'
- source_word: כְּסִיסְרָא
  choice: comme Sisera
  rationale: La répétition de « comme » respecte le parallélisme serré de l’hébreu et renvoie à la défaite historique de Sisera.
- source_word: כְיָבִין
  choice: comme Yabîn
  rationale: Le nom propre est translittéré selon une forme française proche de l’hébreu יָבִין, et la structure parallèle est maintenue.
- source_word: בְּנַחַל קִישׁוֹן
  choice: au torrent du Qishôn
  rationale: נחל désigne ici un cours d’eau pouvant devenir torrentiel. « Torrent » est l’appellation française naturelle dans ce contexte historique; « au » rend la localisation, et Qishôn translittère le nom hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. « Traite-les » évite une tournure française obscure tout en préservant l’ellipse comparative de l’hébreu. Les noms sont rendus sous des formes translittérées proches de l’hébreu.
