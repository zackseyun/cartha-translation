  text: עַֽל עַ֭מְּ/ךָ יַעֲרִ֣ימוּ ס֑וֹד וְ֝/יִתְיָעֲצ֗וּ עַל צְפוּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/003.yaml
  text: They make crafty plans against your people[a], and they consult together against your treasured ones.
translation:
  language: fr
  text: 'Ils ourdissent des complots contre ton peuple,

    et se concertent contre ceux que tu gardes cachés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « tes cachés », c’est-à-dire « ceux qui sont cachés à toi ». L’hébreu peut aussi évoquer ceux que Dieu garde en sécurité ou qui lui sont précieux comme un trésor.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרִימוּ
  choice: ils trament avec ruse
  rationale: Le hiphil de ערם exprime ici une action menée avec habileté et ruse. « Trament avec ruse » rend naturellement en français la manœuvre hostile suggérée par le contexte.
- source_word: סוֹד
  choice: des complots
  rationale: סוֹד peut désigner une délibération confidentielle, un conseil secret ou le projet qui en résulte. Avec le verbe de ruse et l’hostilité du contexte, « complots » exprime clairement le sens sans alourdir la phrase.
- source_word: וְיִתְיָעֲצוּ
  choice: et se concertent
  rationale: La forme hitpael de יעץ indique une consultation réciproque. « Se concertent » en conserve le caractère collectif sans imposer à lui seul le sens plus fort de « conspirent ».
- source_word: צְפוּנֶיךָ
  choice: ceux que tu gardes à l’abri
  rationale: Le terme dérivé de צפן peut désigner ceux qui sont cachés, mis en réserve ou gardés en sécurité. Cette formulation française fait ressortir l’idée de protection tout en laissant la note signaler les autres nuances lexicales.
- source_word: עַל עַמְּךָ
  choice: contre ton peuple
  rationale: Dans ce contexte d’hostilité, עַל marque l’opposition et se traduit naturellement par « contre ».
theological_decisions:
- issue: Nuance de צְפוּנֶיךָ appliqué au peuple de Dieu
  choice: ceux que tu gardes à l’abri
  alternative: ceux que tu tiens cachés ; ceux qui te sont précieux
  rationale: L’hébreu peut mettre l’accent sur le fait d’être caché, conservé en sûreté ou précieux comme un trésor. Le texte principal exprime la protection sans exclure la valeur affective ou l’idée de mise à l’écart, toutes deux signalées en note.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme des deux propositions est conservé ; « trament » et « se concertent » rendent la progression entre projet secret et délibération commune.
