  source_fidelity: Le premier membre exprime bien l'action rusée et la délibération secrète dirigée contre le peuple de Dieu. Pour צְפוּנֶיךָ, le texte hébreu désigne littéralement « tes cachés » / « ceux qui sont cachés à toi », avec des nuances possibles de protection ou de préciosité ; il ne dit pas littéralement « ceux que tu tiens cachés ».
  naturalness: « Ils trament avec ruse des complots » est compréhensible, mais la juxtaposition de « trament », « avec ruse » et « complots » est redondante. « Ils ourdissent des complots » est plus idiomatique et conserve la ruse hostile. « Ceux que tu gardes cachés » est naturel dans le registre poétique moderne.
