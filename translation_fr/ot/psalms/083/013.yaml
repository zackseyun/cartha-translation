  text: אֱֽלֹהַ֗/י שִׁיתֵ֥/מוֹ כַ/גַּלְגַּ֑ל כְּ֝/קַ֗שׁ לִ/פְנֵי רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/013.yaml
  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: fr
  text: Mon Dieu, rends-les comme un tourbillon[a], comme de la paille[b] devant le vent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une roue » ou « comme quelque chose qui roule ». Le mot hébreu גַּלְגַּל peut désigner une roue ou une chose qui roule ou tourbillonne.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu קַשׁ peut aussi désigner la paille sèche ou le chaume.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Mon Dieu
  rationale: Le nom porte le suffixe de première personne du singulier et sert ici d’adresse directe. « Mon Dieu » est naturel et n’ajoute aucune interjection absente de l’hébreu.
- source_word: שִׁיתֵמוֹ
  choice: rends-les pareils à
  rationale: Dans ce contexte, l’impératif de שׁית introduit deux comparaisons. Cette formulation exprime naturellement en français la demande de les faire devenir comme les réalités évoquées.
- source_word: כַגַּלְגַּל
  choice: pareils à un tourbillon
  rationale: גַּלְגַּל peut désigner une roue ou quelque chose qui roule ou tourbillonne. « Un tourbillon » conserve l’image du mouvement et s’accorde avec celle de la paille poussée par le vent, sans ajouter explicitement la poussière, absente du texte hébreu.
- source_word: כְּקַשׁ
  choice: à de la paille
  rationale: קַשׁ désigne de la paille ou du chaume. « Paille » convient mieux en français à l’image d’une matière légère chassée par le vent.
- source_word: לִפְנֵי רוּחַ
  choice: chassée par le vent
  rationale: L’expression signifie littéralement « devant le vent » et décrit ici ce que le vent pousse devant lui. La formulation retenue rend cette image de façon claire et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe conserve l’adresse directe de la prière et le parallélisme des deux images, tout en rendant idiomatiquement l’expression hébraïque « devant le vent ».
