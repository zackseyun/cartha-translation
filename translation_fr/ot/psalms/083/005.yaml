id: PSA.83.5
reference: Psalms 83:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י נוֹעֲצ֣וּ לֵ֣ב יַחְדָּ֑ו עָ֝לֶ֗י/ךָ בְּרִ֣ית יִכְרֹֽתוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/005.yaml
  text: For they have conspired together with one heart[b][a]; against you they make a covenant.
translation:
  language: fr
  text: Car ils se concertent d’un même cœur[a] ; contre toi, ils concluent une alliance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils conspirent d’un même cœur ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils coupent une alliance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel du psalmiste et conserve naturellement la valeur explicative de la conjonction.
- source_word: נוֹעֲצוּ
  choice: ils se concertent
  rationale: Le niphal de יעץ exprime ici une délibération commune. « Se concertent » rend cette réciprocité et convient au contexte hostile sans inscrire toute la nuance de conspiration dans le seul verbe.
- source_word: לֵב יַחְדָּו
  choice: d’un même cœur
  rationale: Cette expression conserve l’image hébraïque du cœur comme siège de la volonté et exprime l’unité d’intention portée par יַחְדָּו.
- source_word: עָלֶיךָ
  choice: contre toi
  rationale: Dans ce contexte de projets hostiles et d’alliance, la préposition עַל a une valeur adversative.
- source_word: בְּרִית יִכְרֹתוּ
  choice: ils concluent une alliance
  rationale: « Conclure une alliance » est l’équivalent idiomatique français de l’expression hébraïque littérale « couper une alliance » et préserve le caractère formel et contraignant de בְּרִית.
theological_decisions:
- issue: Nature de l’accord dirigé contre Dieu
  choice: contre toi, ils concluent une alliance
  alternative: contre toi, ils forment une coalition
  rationale: « Alliance » conserve la portée formelle de בְּרִית et présente sans l’atténuer l’union des adversaires contre Dieu. L’antéposition de « contre toi » maintient aussi l’accent de l’hébreu.
- issue: Degré d’hostilité exprimé par נוֹעֲצוּ
  choice: ils se concertent
  alternative: ils conspirent
  rationale: Le verbe désigne d’abord une consultation ou une délibération commune ; l’hostilité ressort clairement de « contre toi ». La variante en note explicite la nuance de conspiration permise par le contexte sans la rendre obligatoire lexicalement.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme du verset, l’image du « même cœur » et la mise en relief de « contre toi », tout en employant l’expression française naturelle « conclure une alliance ».
