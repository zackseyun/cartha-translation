  text: יֵבֹ֖שׁוּ וְ/יִבָּהֲל֥וּ עֲדֵי עַ֗ד וְֽ/יַחְפְּר֥וּ וְ/יֹאבֵֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/017.yaml
  text: Let them be put to shame and be terrified forever[a]; let them be disgraced and perish.
translation:
  language: fr
  text: Qu’ils soient couverts de honte et saisis d’épouvante pour toujours[a] ! Qu’ils soient humiliés et qu’ils périssent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’ils aient honte et soient terrifiés pour toujours… qu’ils soient humiliés » ; l’hébreu emploie deux termes voisins pour la honte (בוש et חפר), avec des nuances légèrement différentes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: qu’ils soient couverts de honte
  rationale: Le qal inaccompli à valeur optative ou imprécatoire exprime ici le souhait de voir les ennemis subir la honte. Cette formulation française conserve la dimension résultative sans réduire le terme au seul sentiment intérieur.
- source_word: וְיִבָּהֲלוּ
  choice: et saisis d’épouvante
  rationale: Le nifal de בהל évoque le trouble intense, l’effroi ou la consternation. « Saisis d’épouvante » restitue cette intensité dans un français naturel et soutenu.
- source_word: עֲדֵי עַד
  choice: pour toujours
  rationale: Cette locution renforcée exprime une durée indéfinie ou perpétuelle. « Pour toujours » est son équivalent français courant.
- source_word: וְיַחְפְּרוּ
  choice: qu’ils soient humiliés
  rationale: חפר appartient ici au champ de la honte et de l’humiliation. « Humiliés » le distingue de בוש tout en maintenant le parallélisme sémantique.
- source_word: וְיֹאבֵדוּ
  choice: et qu’ils périssent
  rationale: Le qal de אבד signifie couramment périr ou disparaître. « Périssent » garde la portée générale du verbe sans préciser indûment le mode de destruction.
theological_decisions:
- issue: Valeur imprécatoire des inaccomplis
  choice: Les rendre par des subjonctifs optatifs introduits par « qu’ils »
  alternative: « Ils seront couverts de honte… ils périront »
  rationale: Dans le contexte, ces formes expriment une prière ou un souhait dirigé contre les ennemis plutôt qu’une simple prédiction. Le subjonctif français en « qu’ils » en conserve clairement la force imprécatoire.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux phrases exclamatives rendent la vigueur de l’imprécation, tandis que « couverts de honte » et « humiliés » préservent la proximité sans confondre les deux termes hébreux.
