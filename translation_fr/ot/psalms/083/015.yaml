source:
  edition: WLC
  text: כֵּ֭ן תִּרְדְּפֵ֣/ם בְּ/סַעֲרֶ֑/ךָ וּ/בְ/סוּפָתְ/ךָ֥ תְבַהֲלֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/015.yaml
  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: fr
  text: 'Poursuis-les ainsi dans ta tempête,

    et épouvante-les dans ton tourbillon.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: ainsi
  rationale: « Ainsi » exprime naturellement le rapport de manière avec les images du verset précédent, sans réduire le terme à une simple conséquence.
- source_word: תִּרְדְּפֵם
  choice: poursuis-les
  rationale: Le verbe רדף signifie couramment poursuivre ou pourchasser. « Poursuis-les » convient au contexte guerrier et poétique tout en restant digne.
- source_word: בְּסַעֲרֶךָ
  choice: dans ta tempête
  rationale: סַעַר désigne une violente tempête. La préposition ב peut indiquer ici le milieu dans lequel s'accomplit la poursuite; « dans » produit en français une image naturelle, sans exclure la nuance instrumentale.
- source_word: וּבְסוּפָתְךָ
  choice: dans ton tourbillon
  rationale: סוּפָה peut désigner une tempête violente ou un tourbillon. « Tourbillon » distingue les deux termes poétiques parallèles et rend la force destructrice de l'image.
- source_word: תְבַהֲלֵם
  choice: épouvante-les
  rationale: Au piel, בהל signifie provoquer l'effroi, la panique ou la consternation. « Épouvante-les » conserve l'intensité causative et le registre poétique de la supplication.
theological_decisions:
- issue: Action divine dans une prière imprécatoire
  choice: 'Conserver la demande directe adressée à Dieu : « Poursuis-les… épouvante-les »'
  alternative: « Puisses-tu les poursuivre… et les épouvanter »
  rationale: Dans ce contexte de prière, les inaccomplis hébreux ont une valeur volitive proche de l'impératif. La formulation directe préserve l'appel du psalmiste au jugement divin sans l'atténuer ni le transformer en prédiction.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est conservé par « tempête / tourbillon » et par deux impératifs directs. Aucun marqueur de note n'est nécessaire, puisque la variation lexicale est rendue dans le texte principal.
