  text: מַלֵּ֣א פְנֵי/הֶ֣ם קָל֑וֹן וִֽ/יבַקְשׁ֖וּ שִׁמְ/ךָ֣ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/016.yaml
  text: Fill their faces with shame[a], that they may seek your name, O Yahweh.
translation:
  language: fr
  text: Couvre leurs visages de honte, afin qu’ils recherchent ton nom[a], Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et qu’ils recherchent ton nom » ; le verbe hébreu peut marquer une simple continuation, bien qu’il exprime probablement ici le but ou le résultat.'
    reason: alternative lexicale et syntaxique
lexical_decisions:
- source_word: מַלֵּא פְנֵיהֶם קָלוֹן
  choice: Couvre leur visage de honte
  rationale: L’impératif piel de מלא signifie littéralement « remplis ». En français, « remplir leur visage de honte » serait peu naturel ; « couvrir leur visage de honte » conserve l’image visible de l’opprobre et rend idiomatiquement l’expression hébraïque.
- source_word: קָלוֹן
  choice: honte
  rationale: Le nom désigne la honte, l’opprobre ou le déshonneur. « Honte » est direct, courant et laisse ouverte la dimension intérieure aussi bien que publique.
- source_word: וִיבַקְשׁוּ
  choice: afin qu’ils recherchent
  rationale: Après un impératif, l’imparfait précédé de ו peut exprimer le but ou le résultat. « Afin que » rend ici cette valeur probable sans faire de la recherche de Dieu un résultat garanti.
- source_word: שִׁמְךָ
  choice: ton nom
  rationale: Traduction directe qui préserve la portée biblique du nom comme identité révélée et réputation de Dieu, sans l’expliciter abusivement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom divin personnel plutôt que de lui substituer un titre.
theological_decisions:
- issue: Finalité de la honte demandée à Dieu
  choice: La honte est présentée comme visant à les amener à rechercher le nom de Yahweh.
  alternative: « et qu’ils recherchent ton nom » ou « alors ils rechercheront ton nom »
  rationale: La construction hébraïque permet une simple continuation, mais après l’impératif elle porte probablement une nuance de but ou de résultat. La traduction conserve ainsi la tension entre jugement et recherche de Dieu sans affirmer une repentance certaine.
translation_notes:
  register: Français moderne, international et digne. « Couvre leur visage de honte » évite le calque peu idiomatique « remplis leur visage de honte » tout en maintenant l’image hébraïque ; « rechercher » convient au registre poétique et à la quête de Dieu.
