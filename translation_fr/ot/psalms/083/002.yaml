  text: כִּֽי הִנֵּ֣ה א֭וֹיְבֶי/ךָ יֶהֱמָי֑וּ/ן וּ֝/מְשַׂנְאֶ֗י/ךָ נָ֣שְׂאוּ רֹֽאשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/002.yaml
  text: For look, your enemies are in an uproar, and those who hate you have lifted up their heads.
translation:
  language: fr
  text: 'Car voici : tes ennemis grondent, et ceux qui te haïssent ont levé la tête.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי introduit ici la raison de l’appel précédent, tandis que הִנֵּה attire l’attention sur la menace présente. « Car voici » conserve ces deux fonctions dans un registre poétique digne.
- source_word: יֶהֱמָיוּן
  choice: grondent
  rationale: Le verbe הָמָה évoque un bruit tumultueux ou une agitation bruyante. « Grondent » exprime à la fois le vacarme et la menace sans préciser indûment la nature du tumulte.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: relèvent la tête
  rationale: L’expression idiomatique signifie adopter une posture hardie, arrogante ou provocatrice. La formulation française garde l’image concrète de l’hébreu et sa portée ouverte.
theological_decisions:
- issue: Nature de l’hostilité envers Dieu
  choice: Conserver les formulations directes « tes ennemis » et « ceux qui te haïssent ».
  alternative: Paraphraser comme des adversaires du peuple de Dieu.
  rationale: Le texte hébreu adresse explicitement ces termes à Dieu. La traduction ne déplace pas l’objet de l’hostilité et préserve la tension théologique du verset.
translation_notes:
  register: Français international moderne, poétique et accessible. Le parallélisme hébreu est conservé, ainsi que l’image corporelle finale.
