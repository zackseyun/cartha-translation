source:
  edition: WLC
  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: fr
  text: 'Il se dit en lui-même[a] : « Dieu a oublié ; il a caché son visage ; jamais il ne verra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il s’est dit en lui-même : Dieu oublie ; il cache son visage ; il ne verra jamais. » Dans la poésie hébraïque, les verbes au parfait peuvent ici se comprendre avec une valeur présente, passée ou résultative.'
    reason: alternative lexicale et temporelle
lexical_decisions:
- source_word: אָמַר בְּלִבּוֹ
  choice: Il se dit en lui-même
  rationale: Le parfait qal peut avoir ici une valeur présente ou générale dans la description du méchant. L’expression française naturelle « se dire en lui-même » rend clairement la pensée intérieure tout en conservant l’image du for intérieur.
- source_word: שָׁכַח
  choice: a oublié
  rationale: Le verbe signifie « oublier ». Le passé composé présente l’oubli supposé comme un fait accompli dont les effets se prolongent.
- source_word: אֵל
  choice: Dieu
  rationale: Le nom singulier désigne ici le Dieu dont parle le psaume ; « Dieu » est la traduction française directe et usuelle.
- source_word: הִסְתִּיר פָּנָיו
  choice: il a caché son visage
  rationale: La formulation conserve l’image anthropomorphique hébraïque, qui évoque le retrait de l’attention ou de la faveur divine sans réduire l’expression à une seule interprétation.
- source_word: בַּל רָאָה לָנֶצַח
  choice: jamais il ne verra
  rationale: בַּל associé à לָנֶצַח exprime une négation durable, rendue naturellement par « jamais ». « Voir » préserve le sens premier de ראה tout en laissant entendre, dans le contexte, remarquer et intervenir.
theological_decisions:
- issue: 'Langage anthropomorphique : Dieu cache son visage'
  choice: Conserver « il a caché son visage »
  alternative: « il s’est détourné » ou « il a retiré son attention »
  rationale: L’hébreu emploie une image concrète. La préserver maintient la texture théologique du texte et évite d’imposer une explication unique.
- issue: Temporalité des parfaits hébreux dans la poésie
  choice: Présent pour l’acte de se parler, passé composé pour les actes attribués à Dieu
  alternative: 'Tout rendre au passé ou au présent : « Il s’est dit… Dieu oublie… il cache… »'
  rationale: La suite choisie exprime naturellement en français une pensée habituelle portant sur des actes tenus pour accomplis, tout en signalant en note l’ambiguïté réelle des formes hébraïques.
translation_notes:
  register: Français moderne, international et digne. La ponctuation fait entendre le monologue intérieur. L’image biblique du visage caché est conservée, et « jamais il ne verra » maintient l’ordre emphatique ainsi que la tension du propos.
