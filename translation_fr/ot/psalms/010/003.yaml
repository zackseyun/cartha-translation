translation:
  language: fr
  text: Car le méchant se vante de ses propres désirs ; l’homme avide bénit, et il méprise le Seigneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sens de l’hébreu est incertain. Le verbe traduit par « bénit » n’a pas de complément explicite. On peut aussi comprendre : « se félicite », « bénit l’homme avide », ou, si « bénir » est employé par euphémisme, « maudit et méprise le Seigneur ».'
    reason: La syntaxe de וּבֹצֵעַ בֵּרֵךְ נִאֵץ יְהוָה, ainsi que le sujet, le complément et la nuance de בֵּרֵךְ, sont discutés. La note préserve les principales analyses sans lever l’ambiguïté dans le texte.
lexical_decisions:
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: les désirs de son cœur
  rationale: Littéralement « le désir de son âme » ; en français courant, « cœur » exprime naturellement le siège des désirs, et le pluriel rend l’idée sans lourdeur.
- source_word: בֹצֵעַ
  choice: l’homme avide
  rationale: Le participe désigne celui qui recherche un gain, souvent injuste ; « l’homme avide » reste naturel tout en conservant la portée morale.
- source_word: בֵּרֵךְ
  choice: bénit
  rationale: Le texte massorétique porte le verbe « bénir ». Son complément ou sa valeur exacte demeure incertain dans cette construction ; la traduction ne lui ajoute donc pas « se » dans le corps du texte.
- source_word: נִאֵץ
  choice: méprise
  rationale: Le verbe exprime le rejet outrageant ou le mépris ; « méprise » convient au parallélisme et au registre du psaume.
- source_word: יְהוָה
  choice: le Seigneur
  rationale: Rendu français traditionnel et intelligible du tétragramme, avec une majuscule distinctive au titre.
theological_decisions:
- issue: Relation syntaxique entre « bénit » et « méprise le Seigneur »
  choice: Conserver les deux verbes coordonnés sans préciser explicitement l’objet de « bénit »
  alternative: « se félicite » / « bénit celui qui est avide » / « renie et méprise le Seigneur »
  rationale: L’hébreu est difficile et admet plusieurs analyses. Ajouter « lui-même » résout une ambiguïté que le texte massorétique ne tranche pas explicitement. La note signale les principales possibilités sans imposer une lecture doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. Le point-virgule fait ressortir le parallélisme. « Des désirs de son cœur » évite le calque peu naturel « désir de son âme », tandis que la note préserve l’ambiguïté réelle de la seconde proposition.
