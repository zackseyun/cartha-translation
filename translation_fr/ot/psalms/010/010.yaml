translation:
  language: fr
  text: Il s’accroupit et se courbe[a] ; les sans-défense tombent[b] par sa puissance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu au début du verset est difficile. On peut aussi traduire : « Il s’abaisse, il se courbe » ; le premier verbe peut également être compris au sens de « être écrasé ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe hébreu est au singulier et peut se comprendre : « il tombe ». Le contexte favorise cependant la lecture : « les sans-défense tombent ».'
    reason: alternative_reading
  - marker: c
    text: 'Traduction plus littérale possible : « par ses puissants ». L’expression peut aussi être comprise : « par sa force » ou « par sa puissance » ; peut-être, dans l’image d’un prédateur, « dans ses puissantes griffes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/דכה
  choice: Il s’accroupit
  rationale: La forme hébraïque est difficile. Dans le contexte de chasse et d’embuscade des versets voisins, elle décrit probablement la posture basse du méchant plutôt que le fait d’être lui-même écrasé.
- source_word: יָשֹׁחַ
  choice: et se courbe
  rationale: Le verbe exprime l’action de s’abaisser, de se courber ou de s’affaisser. « Se courbe » conserve l’image physique sans préciser davantage le geste.
- source_word: וְ/נָפַ֥ל … חלכאים
  choice: ceux qui sont sans défense tombent
  rationale: Bien que le verbe soit morphologiquement au masculin singulier, la syntaxe très condensée permet de comprendre le nom collectif final comme son sujet logique. Cette lecture s’accorde avec le contexte, où le méchant prend les personnes vulnérables au piège.
- source_word: בַּ֝/עֲצוּמָ֗י/ו
  choice: sous sa puissance
  rationale: La forme plurielle signifie littéralement quelque chose comme « par/sous ses puissants ». Ici, elle peut désigner de manière intensive ou abstraite la force du méchant. « Sous sa puissance » donne en français un sens naturel tout en laissant les autres analyses en note.
- source_word: חלכאים
  choice: ceux qui sont sans défense
  rationale: Le terme désigne des personnes faibles, malheureuses ou vulnérables. Cette expression met clairement en relief leur incapacité à résister au prédateur.
