source:
  edition: WLC
  text: תַּאֲוַ֬ת עֲנָוִ֣ים שָׁמַ֣עְתָּ יְהוָ֑ה תָּכִ֥ין לִ֝בָּ֗/ם תַּקְשִׁ֥יב אָזְנֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/017.yaml
  text: O Yahweh[a], you have heard the desire of the humble; you will prepare their heart[b]; your ear will listen.
translation:
  language: fr
  text: Yahweh, tu as entendu le désir des humbles[a] ; tu affermiras leur cœur[b] ; tu tendras l’oreille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les affligés » ou « les doux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « tu prépareras leur cœur » ou « tu rendras leur cœur ferme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: le désir
  rationale: Le nom désigne le désir ou l’aspiration. « Désir » reste sobre, naturel et adapté au contexte de prière.
- source_word: עֲנָוִים
  choice: des humbles
  rationale: Le terme peut désigner les humbles, les doux ou les affligés. « Humbles » conserve l’idée de petitesse et laisse ouverte la dimension d’oppression présente dans le psaume.
- source_word: שָׁמַעְתָּ
  choice: tu as entendu
  rationale: Le parfait exprime ici une action accomplie dont la portée demeure actuelle dans la prière.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom propre présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: תָּכִין
  choice: tu affermiras
  rationale: Le hiphil de כון peut signifier préparer, établir ou rendre ferme. Avec « cœur », « affermir » restitue naturellement l’idée de rendre stable et résolu.
- source_word: לִבָּם
  choice: leur cœur
  rationale: L’image biblique du cœur est conservée sans la réduire à l’intelligence, aux émotions ou à la volonté.
- source_word: תַּקְשִׁיב
  choice: sera attentive
  rationale: Le verbe exprime une écoute soutenue et attentive. Avec « ton oreille » comme sujet, « sera attentive » est idiomatique en français tout en conservant l’image concrète.
- source_word: אָזְנֶךָ
  choice: ton oreille
  rationale: La formulation garde l’anthropomorphisme poétique du texte hébreu au lieu de l’aplanir en simple « tu écouteras ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme ; la translittération préserve le nom personnel sans lui substituer un titre.
- issue: Sens de עֲנָוִים dans le contexte
  choice: les humbles
  alternative: les affligés / les doux
  rationale: Le contexte vise des personnes opprimées, tandis que le mot peut aussi exprimer l’humilité ou la douceur. Le choix principal préserve cette tension et la note signale les autres nuances.
- issue: Sens de תָּכִין appliqué au cœur
  choice: tu affermiras
  alternative: tu prépareras / tu établiras
  rationale: La racine permet plusieurs nuances proches. « Affermir » convient au cœur comme siège de la disposition intérieure, sans exclure les sens de préparer ou d’établir, indiqués en note.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement adressé à Dieu. Le parallélisme poétique et l’image concrète de l’oreille sont conservés. La ponctuation en trois membres reflète la progression du vers hébreu.
