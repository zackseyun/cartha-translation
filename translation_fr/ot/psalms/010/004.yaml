source:
  edition: WLC
  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: fr
  text: 'Dans son arrogance[a], le méchant ne cherche pas Dieu ; toute sa pensée se résume à ceci : « Il n’y a pas de Dieu. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans la hauteur de son nez » ou « de son visage » ; expression évoquant une attitude hautaine.'
    reason: cultural_note
  - marker: b
    text: 'Autre traduction possible : « Dieu n’est dans aucune de ses pensées. » L’hébreu peut décrire l’absence de Dieu dans toute sa réflexion plutôt que citer directement sa pensée.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: le méchant
  rationale: L’adjectif masculin singulier est employé comme substantif. « Le méchant » conserve à la fois le portrait individuel et sa portée représentative.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: Dans l’orgueil de son visage
  rationale: גֹבַהּ évoque la hauteur et אַף le nez ou le visage. L’expression décrit vraisemblablement une attitude hautaine ; cette formulation préserve l’image concrète de l’hébreu, expliquée en note.
- source_word: בַּל יִדְרֹשׁ
  choice: ne cherche pas Dieu
  rationale: בַּל nie ici de façon caractéristique l’action de דרשׁ, « chercher, consulter, s’enquérir ». Bien que l’objet ne soit pas exprimé, Dieu est naturellement sous-entendu par la proposition suivante ; l’explicitation rend la phrase française naturelle.
- source_word: אֵין אֱלֹהִים
  choice: Il n’y a pas de Dieu
  rationale: L’expression porte une négation existentielle et peut être comprise comme le contenu de la pensée du méchant.
- source_word: כָּל מְזִמּוֹתָיו
  choice: toute sa pensée se résume à ceci
  rationale: מְזִמּוֹתָיו peut désigner ses pensées, projets ou desseins. Le singulier collectif français « toute sa pensée » exprime l’ensemble de son orientation mentale sans accentuer indûment l’idée de complot.
theological_decisions:
- issue: Rapport syntaxique de la proposition finale
  choice: La proposition « Il n’y a pas de Dieu » exprime le contenu ou l’orientation générale de la pensée du méchant.
  alternative: « Dieu n’est dans aucune de ses pensées. »
  rationale: L’ordre des mots permet de lire אֵין אֱלֹהִים comme le contenu de כָּל מְזִמּוֹתָיו, mais l’hébreu peut aussi signifier que Dieu est absent de toutes ses pensées. La traduction principale suit la première analyse et la note conserve l’autre.
- issue: Objet implicite de « chercher »
  choice: Expliciter « Dieu » en français.
  alternative: 'Laisser le verbe sans objet : « il ne cherche pas » ou traduire « il ne s’en soucie pas ».'
  rationale: Le texte hébreu n’exprime aucun objet, mais le contexte immédiat désigne Dieu. L’explicitation évite en français une tournure incomplète tout en restant transparente quant au référent.
translation_notes:
  register: Français moderne, digne et accessible. La traduction conserve l’image hébraïque inhabituelle du visage hautain tout en l’éclairant par une note. La seconde note maintient l’ambiguïté syntaxique et théologique du dernier membre.
