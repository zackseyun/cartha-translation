  text: אָלָ֤ה פִּ֣י/הוּ מָ֭לֵא וּ/מִרְמ֣וֹת וָ/תֹ֑ךְ תַּ֥חַת לְ֝שׁוֹנ֗/וֹ עָמָ֥ל וָ/אָֽוֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/007.yaml
  text: His mouth is full of cursing and deceit and oppression[b][a]; under his tongue are trouble and wickedness.
translation:
  language: fr
  text: Sa bouche est pleine de malédictions[a], de tromperie et d’oppression; sous sa langue se trouvent le malheur et l’injustice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de malédiction »; le nom hébreu peut aussi désigner un serment dans certains contextes, mais il évoque ici plus probablement des imprécations.
    reason: lexical_alternative
  - marker: b
    text: Ou « le méfait et le mal »; les deux mots hébreux peuvent aussi évoquer la peine, le tort, la malfaisance ou l’iniquité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: malédictions
  rationale: Dans ce contexte de paroles hostiles, le nom désigne plus naturellement des imprécations que le serment neutre. Le pluriel français exprime idiomatiquement l’abondance évoquée par « sa bouche est pleine ».
- source_word: פִּיהוּ
  choice: sa bouche
  rationale: La traduction directe conserve l’image hébraïque de la bouche comme source de la parole.
- source_word: מָלֵא
  choice: est pleine de
  rationale: Cette tournure française naturelle préserve l’idée d’abondance exprimée par l’hébreu.
- source_word: מִרְמוֹת
  choice: tromperie
  rationale: Le terme évoque la duplicité, la fraude ou des procédés trompeurs; « tromperie » convient au contexte de parole nuisible.
- source_word: תֹךְ
  choice: oppression
  rationale: Dans ce contexte, le mot désigne un tort exercé contre autrui, pouvant relever de la violence ou de l’exploitation; « oppression » en restitue la portée sociale.
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: sous sa langue
  rationale: La formulation littérale conserve la métaphore saisissante de paroles ou d’intentions mauvaises tenues prêtes ou dissimulées.
- source_word: עָמָל
  choice: malheur
  rationale: Ici, le nom ne désigne vraisemblablement pas le travail ordinaire, mais la peine, le tort ou le malheur produit; « malheur » préserve une partie de cette amplitude.
- source_word: אָוֶן
  choice: injustice
  rationale: Le terme désigne le mal, la faute ou l’iniquité. « Injustice » exprime clairement le caractère moralement mauvais de ce qui est associé à sa parole.
theological_decisions: []
