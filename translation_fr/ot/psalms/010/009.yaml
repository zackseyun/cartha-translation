base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: fr
  text: Il est à l’affût dans une cachette[a], comme un lion dans son fourré[b] ; il est à l’affût pour saisir le pauvre ; il saisit le pauvre en l’entraînant dans son filet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en secret » ou « dans un lieu caché ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans sa cache » ; le terme hébreu peut désigner un abri, une cache ou un couvert de végétation.
    reason: lexical_alternative
  - marker: c
    text: Ou « en le tirant dans son filet » ou « au moyen de son filet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: se tient en embuscade
  rationale: Le verbe ארב décrit l’action de guetter en vue d’une attaque. Cette tournure française, répétée comme en hébreu, exprime clairement la préméditation et l’image prédatrice.
- source_word: בַּמִּסְתָּר
  choice: dans un lieu caché
  rationale: מִסְתָּר peut désigner un endroit dissimulé ou le secret. « Dans un lieu caché » conserve ici la valeur spatiale suggérée par la scène d’embuscade.
- source_word: כְּאַרְיֵה
  choice: comme un lion
  rationale: Traduction directe de la comparaison, qui maintient l’image de la prédation.
- source_word: בְסֻכֹּה
  choice: dans son fourré
  rationale: סֻכָּה peut désigner un abri, une cache ou un couvert de végétation. Dans cette comparaison avec un lion à l’affût, « fourré » évoque naturellement une cache sans imposer le sens plus spécialisé de « tanière ».
- source_word: לַחֲטוֹף / יַחְטֹף
  choice: pour saisir / il saisit
  rationale: חטף exprime une capture soudaine et violente. La répétition du même verbe français reproduit l’insistance poétique de l’hébreu.
- source_word: עָנִי
  choice: le pauvre
  rationale: עָנִי peut désigner une personne pauvre, affligée ou vulnérable. Dans le contexte d’oppression sociale du psaume, « le pauvre » est direct et naturel tout en gardant l’idée de vulnérabilité.
- source_word: בְּמָשְׁכוֹ בְרִשְׁתּוֹ
  choice: en l’entraînant dans son filet
  rationale: Le ב attaché à l’infinitif peut indiquer le moyen ou une circonstance concomitante, tandis que celui devant « filet » peut se comprendre comme « dans » ou « au moyen de ». La formulation retenue rend naturellement la capture sans masquer les autres analyses possibles, signalées en note.
