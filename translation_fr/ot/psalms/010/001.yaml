id: PSA.10.1
reference: Psalms 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: fr
  text: Pourquoi, Yahweh, te tiens-tu à distance ? Pourquoi te caches-tu[a] dans les moments de détresse ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te dérobes-tu » ; le verbe peut exprimer le fait de se dissimuler ou de se soustraire au regard.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: Pourquoi
  rationale: L’adverbe interrogatif ouvre une plainte directe. « Pourquoi » en conserve la simplicité et la force émotionnelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme un nom propre, conformément au texte hébreu, plutôt que remplacé par un titre.
- source_word: תַּעֲמֹד
  choice: te tiens-tu
  rationale: Le qal de עמד signifie littéralement « se tenir ». Cette formulation préserve l’image spatiale et relationnelle sans la réduire à l’inaction.
- source_word: בְּרָחוֹק
  choice: à distance
  rationale: Cette expression française naturelle conserve l’image de l’éloignement apparent de Dieu.
- source_word: תַּעְלִים
  choice: te caches-tu
  rationale: Le hiphil de עלם exprime ici le fait de se rendre caché ou de se dérober au regard. « Te caches-tu » est direct et idiomatique.
- source_word: לְעִתּוֹת
  choice: dans les moments
  rationale: Le pluriel de עת a une valeur temporelle. « Dans les moments » rend ce sens en français moderne et naturel.
- source_word: בַּצָּרָה
  choice: de détresse
  rationale: צָרָה désigne la détresse, l’adversité ou une situation oppressante. « Détresse » convient au ton intense de la lamentation sans préciser indûment sa cause.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le verset emploie directement le tétragramme. « Yahweh » préserve le nom personnel au lieu de lui substituer un titre.
- issue: Répétition de l’interrogatif dans le second membre
  choice: Répéter explicitement « Pourquoi »
  alternative: « tu te caches dans les moments de détresse » sans second interrogatif
  rationale: L’hébreu n’énonce לָמָה qu’au début du verset, mais le parallélisme poétique étend naturellement la question au second membre. La répétition explicite produit en français une plainte claire sans supprimer l’ambiguïté lexicale du verbe.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve le tutoiement de l’adresse à Dieu, l’image spatiale de son éloignement et la structure interrogative parallèle du verset.
