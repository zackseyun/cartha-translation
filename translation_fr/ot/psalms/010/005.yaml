id: PSA.10.5
reference: Psalms 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: fr
  text: Ses voies réussissent en tout temps[a] ; tes jugements sont trop élevés pour qu’il les voie. Quant à tous ses adversaires, il souffle sur eux avec mépris[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ses voies sont fermes en tout temps. » Le verbe hébreu est difficile ; il a aussi été rapproché de l’idée de se tordre ou d’être en travail, mais le contexte favorise celle d’un succès ou d’une sécurité qui se prolonge.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il souffle sur eux ». Cette image vive exprime le mépris.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: réussissent
  rationale: Le verbe est difficile ici. Dans le contexte, il décrit le succès continu ou l’assurance apparente du méchant ; « réussissent » s’accorde avec sa suffisance et son mépris dans la suite du verset.
- source_word: דרכ/ו (דַּרְכּוֹ)
  choice: ses voies
  rationale: L’expression désigne sa conduite ou le cours de sa vie. « Ses voies » conserve l’image hébraïque tout en restant idiomatique en français biblique moderne.
- source_word: בְּכָל־עֵת
  choice: en tout temps
  rationale: Cette formulation rend l’idée de continuité avec concision et dignité.
- source_word: מָרוֹם מִשְׁפָּטֶיךָ מִנֶּגְדּוֹ
  choice: tes jugements sont trop élevés pour qu’il les voie
  rationale: La traduction conserve la métaphore spatiale de jugements placés en hauteur tout en exprimant leur éloignement effectif de la vue ou de la considération du méchant.
- source_word: כָּל־צוֹרְרָיו
  choice: tous ses adversaires
  rationale: « Adversaires » rend le terme désignant ceux qui s’opposent à lui et convient au registre poétique.
- source_word: יָפִיחַ בָּהֶם
  choice: il souffle sur eux avec mépris
  rationale: Le verbe évoque une expiration dirigée contre les adversaires, geste de dédain. Cette formulation garde l’image corporelle tout en en rendant clairement la portée.
theological_decisions:
- issue: Sens de יָחִילוּ et condition apparente du méchant
  choice: Ses voies réussissent continuellement.
  alternative: Ses voies sont fermes ou assurées en tout temps ; plus littéralement, le verbe pourrait être rattaché à l’idée de se tordre ou d’être en travail.
  rationale: Le psaume déplore le succès apparent et l’arrogance du méchant. Le sens de réussite correspond le mieux aux jugements divins qu’il ne perçoit pas et au mépris qu’il affiche envers ses adversaires.
- issue: Rapport du méchant aux jugements divins
  choice: Les jugements de Dieu sont présentés comme trop élevés pour être vus par lui.
  alternative: Les jugements de Dieu sont simplement « en haut » ou « loin de lui », ce qui peut suggérer qu’il n’en tient aucun compte.
  rationale: La formulation préserve à la fois l’image de hauteur et l’ambiguïté entre incapacité à percevoir les jugements et refus pratique de les considérer.
translation_notes:
  register: Français international moderne, poétique et digne. Le texte conserve « ses voies » et la hauteur des jugements comme images bibliques, tout en explicitant naturellement leur sens. Les deux difficultés lexicales principales sont signalées en notes.
