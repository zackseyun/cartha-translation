  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: fr
  text: 'Pourquoi le méchant méprise-t-il Dieu ? Il se dit en lui-même : « Tu ne demanderas pas de comptes. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִאֵץ
  choice: méprise
  rationale: Le verbe exprime ici le mépris insolent envers Dieu; « méprise » est naturel et conserve la force morale du terme.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Désigne une personne moralement coupable ou impie; la formulation substantivée est claire en français biblique moderne.
- source_word: בְּלִבּוֹ
  choice: en lui-même
  rationale: Le « cœur » hébreu est le siège de la pensée intérieure; cette formulation française rend naturellement le monologue intérieur sans modifier le sens.
- source_word: לֹא תִּדְרֹשׁ
  choice: Tu ne demanderas pas de comptes
  rationale: Dans ce contexte, דרשׁ évoque l'intervention de Dieu pour rechercher la faute et en demander compte; cette traduction explicite l'idée judiciaire sans préciser indûment la forme du jugement.
theological_decisions:
- issue: Référent du verbe à la deuxième personne
  choice: 'Conserver l''adresse directe à Dieu : « Tu ne demanderas pas de comptes »'
  alternative: « Il ne demandera pas de comptes »
  rationale: Le texte massorétique porte explicitement une deuxième personne masculine singulière; le méchant formule intérieurement son défi à Dieu.
- issue: Portée de דרשׁ
  choice: Rendre l'idée de reddition de comptes
  alternative: « Tu ne rechercheras pas » ou « Tu n'interviendras pas »
  rationale: La notion de recherche ou d'enquête demeure en arrière-plan, mais le contexte de l'impunité supposée favorise la reddition de comptes, sans définir une doctrine particulière du jugement.
translation_notes:
  register: Français international moderne, simple et digne. La question rhétorique et le discours intérieur sont conservés; aucune note n'est nécessaire.
