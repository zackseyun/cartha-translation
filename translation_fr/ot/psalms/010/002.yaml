source:
  edition: WLC
  text: בְּ/גַאֲוַ֣ת רָ֭שָׁע יִדְלַ֣ק עָנִ֑י יִתָּפְשׂ֓וּ בִּ/מְזִמּ֖וֹת ז֣וּ חָשָֽׁבוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: fr
  text: Dans son orgueil, le méchant poursuit le pauvre avec acharnement[a] ; qu’ils soient pris dans les complots qu’ils ont conçus[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Dans l’orgueil du méchant, le pauvre est poursuivi avec acharnement. » La construction hébraïque est très resserrée et permet de comprendre le méchant comme l’auteur de la poursuite et le pauvre comme sa victime.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils sont pris dans les complots qu’ils ont conçus ». La forme hébraïque peut exprimer soit un souhait, soit un constat.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: Dans son orgueil
  rationale: Le בְּ peut exprimer le cadre, la manière ou la cause. « Dans son orgueil » conserve la concision hébraïque et relie naturellement l’orgueil du méchant à son action.
- source_word: רָשָׁע
  choice: le méchant
  rationale: Le substantif singulier désigne ici un type humain représentatif. Le singulier français garde cette valeur générique.
- source_word: יִדְלַק
  choice: poursuit … avec acharnement
  rationale: דלק peut évoquer le fait de brûler ou de poursuivre de près. Dans ce contexte hostile, il désigne une poursuite intense ; « avec acharnement » en restitue la force sans introduire une image peu naturelle en français.
- source_word: עָנִי
  choice: le pauvre
  rationale: עָנִי désigne une personne pauvre, affligée ou opprimée. « Le pauvre » préserve le singulier et convient au contexte d’oppression.
- source_word: יִתָּפְשׂוּ
  choice: qu’ils soient pris
  rationale: Le nifal imparfait est compris comme un souhait ou une prière à valeur jussive contre les méchants. Le pluriel « ils » respecte le changement de nombre du texte hébreu.
- source_word: בִּמְזִמּוֹת
  choice: dans les complots
  rationale: מְזִמּוֹת désigne ici des projets malveillants ou des machinations. « Complot » rend clairement leur caractère hostile, tandis que « dans » conserve l’image d’un piège constitué par leurs propres plans.
- source_word: זוּ
  choice: qu’
  rationale: זוּ fonctionne comme particule relative ; le relatif français introduit explicitement la proposition qui qualifie les complots.
- source_word: חָשָׁבוּ
  choice: ils ont conçus
  rationale: חשב exprime ici une élaboration réfléchie. « Concevoir » convient à des complots délibérément préparés.
theological_decisions:
- issue: Syntaxe du premier membre
  choice: Le méchant est présenté comme celui qui poursuit le pauvre.
  alternative: « Dans l’orgueil du méchant, le pauvre est poursuivi avec acharnement. »
  rationale: La formulation hébraïque est très resserrée. La lecture active donne à רָשָׁע le rôle d’agent et à עָנִי celui de victime, ce qui convient au contexte, mais la construction peut aussi être rendue passivement ; cette ambiguïté est signalée en note.
- issue: Valeur du second imparfait
  choice: 'Souhait imprécatoire : « qu’ils soient pris »'
  alternative: 'Constat : « ils sont pris » ou « ils seront pris »'
  rationale: L’imparfait nifal peut porter une nuance jussive dans le discours de prière. Cette lecture exprime l’appel à une juste rétribution, sans masquer la possibilité grammaticale d’une affirmation descriptive.
translation_notes:
  register: Français international moderne, naturel et digne. « Avec acharnement » rend l’intensité de דלק ; « complots » garde la portée malveillante de מְזִמּוֹת. Le passage du singulier « le méchant » au pluriel « ils », présent dans l’hébreu, est conservé plutôt que lissé.
