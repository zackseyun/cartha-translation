source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: fr
  text: Tu as vu, car tu regardes la peine et le chagrin afin de les prendre en main[a]. Le malheureux s’en remet à toi[b] ; tu as été l’aide de l’orphelin[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour donner dans ta main » ou « entre tes mains ». L’expression peut signifier que Dieu prend lui-même l’affaire en charge afin d’agir.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Le malheureux te remet sa cause ». L’hébreu peut évoquer soit la personne qui se confie à Dieu, soit son affaire qu’elle lui abandonne.'
    reason: alternative_reading
  - marker: c
    text: Le mot hébreu peut aussi être rendu par « enfant privé de père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Tu as bien vu
  rationale: Le qal accompli à la 2e personne masculine singulière affirme que Dieu a effectivement vu. « Bien » rend l’insistance naturelle en français sans changer l’aspect verbal.
- source_word: עָמָל
  choice: la peine
  rationale: Dans une plainte psalmique, le mot désigne la peine, l’affliction ou le mal accablant, plutôt qu’un simple travail.
- source_word: כַעַס
  choice: le chagrin
  rationale: Associé à עָמָל, le terme évoque ici la douleur ou l’affliction causée, sans l’identifier trop vite à la colère de Dieu.
- source_word: תַּבִּיט
  choice: tu observes
  rationale: Le hiphil de נבט exprime un regard attentif. « Observer » est actuel et suggère davantage qu’une perception passive.
- source_word: לָתֵת בְּיָדֶךָ
  choice: pour prendre l’affaire en main
  rationale: Littéralement, l’expression parle de mettre ou donner dans la main de Dieu. L’idiome français retenu communique naturellement l’idée d’une intervention, tandis que la note conserve la forme et l’ambiguïté de l’hébreu.
- source_word: עָלֶיךָ יַעֲזֹב
  choice: s’en remet à toi
  rationale: La construction exprime le fait de se confier à Dieu ou de lui remettre sa cause, non un abandon négatif.
- source_word: חֵלֶכָה
  choice: le malheureux
  rationale: Ce terme rare désigne une personne vulnérable, infortunée ou démunie. « Le malheureux » reste naturel et assez large.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: Le mot désigne particulièrement celui qui est privé de père. « Orphelin » est le terme français courant, avec une précision en note.
- source_word: עוֹזֵר
  choice: le secours
  rationale: Le participe présente Dieu comme celui qui aide. « Le secours de l’orphelin » est une formulation personnelle, concise et digne.
theological_decisions:
- issue: Le regard de Dieu implique-t-il seulement la connaissance ou aussi l’intervention ?
  choice: Dieu observe la souffrance afin de prendre l’affaire en main.
  alternative: Dieu regarde la peine et le chagrin pour les mettre dans sa main.
  rationale: L’infinitif לָתֵת בְּיָדֶךָ oriente le regard divin vers une prise en charge, mais le texte ne précise pas la forme de l’intervention. La note maintient le caractère imagé de l’expression.
- issue: Que remet à Dieu la personne vulnérable ?
  choice: Le malheureux s’en remet lui-même à Dieu.
  alternative: Le malheureux remet sa cause à Dieu.
  rationale: L’hébreu permet de comprendre soit la personne, soit sa cause comme implicitement confiée à Dieu. Le corps du texte exprime la dépendance personnelle, et la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. L’adresse emphatique à Dieu est conservée par « car toi, tu observes ». Les idiomes français « prendre l’affaire en main » et « s’en remettre à » rendent le mouvement du texte clairement, tandis que les notes signalent les formulations plus littérales et les ambiguïtés réelles.
