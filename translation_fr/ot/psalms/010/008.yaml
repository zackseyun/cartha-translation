  text: יֵשֵׁ֤ב בְּ/מַאְרַ֬ב חֲצֵרִ֗ים בַּֽ֭/מִּסְתָּרִים יַהֲרֹ֣ג נָקִ֑י עֵ֝ינָ֗י/ו לְֽ/חֵלְכָ֥ה יִצְפֹּֽנוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/008.yaml
  text: He sits in ambush in the villages[a]; in the hiding places he murders the innocent[b]; his eyes watch for the helpless.
translation:
  language: fr
  text: Il se tient en embuscade dans les villages[a] ; dans des lieux cachés, il assassine l’innocent ; ses yeux guettent l’homme sans défense[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les localités » ; le mot hébreu peut aussi désigner des cours ou des enceintes, sens moins probable ici.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « épient le malheureux ». La dernière proposition est difficile : le verbe hébreu se rapporte plus littéralement au fait de se cacher ou de rôder, mais, avec « ses yeux », il évoque une surveillance furtive visant une personne vulnérable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב בְּמַאְרַב
  choice: Il se tient en embuscade
  rationale: Le verbe signifie littéralement « s’asseoir, demeurer », mais, joint à « embuscade », il décrit ici une posture durable d’attente hostile. « Se tient en embuscade » conserve l’image tout en restant naturel en français.
- source_word: חֲצֵרִים
  choice: dans les villages
  rationale: Le nom peut désigner des villages, des établissements ou des espaces clos. Dans ce contexte de prédation, « villages » est le sens le plus probable ; la préposition hébraïque est rendue directement par « dans ».
- source_word: בַּמִּסְתָּרִים
  choice: dans des lieux cachés
  rationale: Le pluriel désigne des endroits dissimulés. Cette formulation garde l’image concrète des cachettes sans alourdir la phrase.
- source_word: יַהֲרֹג נָקִי
  choice: il assassine l’innocent
  rationale: Le verbe signifie « tuer » ; le contexte d’une attaque préméditée contre un innocent justifie « assassine », qui exprime naturellement le caractère criminel de l’acte.
- source_word: עֵינָיו לְחֵלְכָה יִצְפֹּנוּ
  choice: ses yeux guettent l’homme sans défense
  rationale: 'La tournure est difficile : le verbe évoque littéralement l’action de se cacher ou de rôder, mais, avec « ses yeux », il exprime une surveillance furtive. Le terme rare חֵלְכָה désigne ici une victime vulnérable ; « l’homme sans défense » rend clairement cette idée sans préciser indûment sa condition sociale.'
