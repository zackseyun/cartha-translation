  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: fr
  text: Lève-toi, Yahweh ! Ô Dieu, lève ta main ! N’oublie pas les affligés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les pauvres », « les humbles » ou « les opprimés ». Le terme hébreu peut désigner, de manière générale, ceux qui sont abaissés et vulnérables.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Lève-toi
  rationale: Impératif de קום adressé à Dieu. « Lève-toi » exprime naturellement en français moderne l’appel pressant à intervenir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin יהוה, conservant ici le nom propre plutôt que de lui substituer un titre.
- source_word: אֵל
  choice: Ô Dieu
  rationale: Vocatif en parallèle avec יהוה. La particule « Ô » rend clairement l’adresse poétique et solennelle.
- source_word: נְשָׂא יָדֶךָ
  choice: lève ta main
  rationale: Le verbe impératif et l’image concrète de la main sont conservés sans expliciter l’action divine attendue.
- source_word: אַל תִּשְׁכַּח
  choice: N’oublie pas
  rationale: Rend directement la défense hébraïque, tout en préservant la force de la supplication.
- source_word: עניים
  choice: les malheureux
  rationale: Dans le contexte du psaume, le terme désigne des personnes abaissées et vulnérables. « Les malheureux » couvre assez largement leur détresse sans la limiter à la pauvreté économique.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le Tétragramme comme nom propre. « Yahweh » le représente directement sans le remplacer par un titre.
- issue: Sens de עניים
  choice: les malheureux
  alternative: les pauvres ; les humbles ; les opprimés
  rationale: Le mot peut désigner ceux qui sont pauvres, affligés, abaissés ou opprimés. Le contexte met l’accent sur leur vulnérabilité face aux méchants, mais le français ne doit pas réduire cette polysémie à une seule cause de détresse.
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs brefs et l’image anthropomorphique de la main préservent l’urgence et la force poétique de la prière.
