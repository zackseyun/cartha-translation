id: PSA.10.18
reference: Psalms 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִ/שְׁפֹּ֥ט יָת֗וֹם וָ֫/דָ֥ךְ בַּל יוֹסִ֥יף ע֑וֹד לַ/עֲרֹ֥ץ אֱ֝נ֗וֹשׁ מִן הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/018.yaml
  text: to give justice to the fatherless and the oppressed[c][b][a], so that man from the earth may terrify no more.
translation:
  language: fr
  text: pour rendre justice à l’orphelin[a] et à l’opprimé[b], afin que l’être humain venu de la terre[c] ne continue plus à semer la terreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à celui qui est privé de père ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à l’accablé » ou « à l’affligé ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « l’être humain de la terre »; on peut aussi comprendre « l’être humain du pays ». Le terme traduit par « être humain » souligne souvent la condition mortelle et fragile.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: rendre justice
  rationale: Dans le prolongement du verset précédent, l’infinitif exprime le but ou le résultat de l’écoute de Dieu. « Rendre justice » conserve la portée judiciaire tout en exprimant naturellement l’intervention en faveur des personnes vulnérables.
- source_word: יָתוֹם
  choice: l’orphelin
  rationale: « Orphelin » est le terme courant et précis en français pour cette catégorie sociale vulnérable; l’hébreu peut plus spécifiquement désigner une personne privée de père.
- source_word: דַּךְ
  choice: l’opprimé
  rationale: Le mot désigne une personne écrasée, abaissée ou affligée. « L’opprimé » restitue clairement sa dimension sociale et existentielle sans imposer une image physique.
- source_word: בַּל יוֹסִיף עוֹד
  choice: ne continue plus à
  rationale: 'L’ensemble exprime la cessation définitive de l’action: elle ne doit plus se poursuivre. Cette tournure est idiomatique en français et conserve la valeur de but ou de résultat.'
- source_word: לַעֲרֹץ
  choice: semer la terreur
  rationale: Le verbe évoque le fait de terrifier ou d’inspirer l’effroi. « Semer la terreur » rend cette force en français naturel, sans le confondre avec le terme déjà traduit par « opprimé ».
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: אֱנוֹשׁ désigne ici l’humain dans sa faiblesse mortelle. « L’être humain » conserve la valeur générique du singulier sans suggérer exclusivement un individu masculin.
- source_word: מִן הָאָרֶץ
  choice: venu de la terre
  rationale: La formulation garde l’image hébraïque d’un humain issu de la terre et souligne son caractère terrestre et mortel. « Terre » peut aussi être compris comme « pays », ambiguïté signalée en note.
theological_decisions:
- issue: Valeur générique et mortelle de אֱנוֹשׁ
  choice: l’être humain venu de la terre
  alternative: l’homme issu de la terre; le mortel venu de la terre
  rationale: Le singulier hébreu représente l’humain en général et met en relief sa fragilité face à Dieu. La traduction évite de restreindre indûment le référent aux hommes de sexe masculin tout en conservant le contraste entre Dieu et l’être terrestre.
- issue: Portée de מִן הָאָרֶץ
  choice: venu de la terre
  alternative: du pays; issu du sol
  rationale: Le contexte permet d’entendre soit l’origine terrestre du mortel, soit un humain appartenant au pays. Le texte principal conserve l’image la plus directe sans transformer cette nuance en affirmation doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure infinitive est maintenue parce que le verset achève la phrase commencée auparavant. « Semer la terreur » est idiomatique tout en conservant la force du verbe hébreu.
