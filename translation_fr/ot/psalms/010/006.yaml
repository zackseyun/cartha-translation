  text: אָמַ֣ר בְּ֭/לִבּ/וֹ בַּל אֶמּ֑וֹט לְ/דֹ֥ר וָ֝/דֹ֗ר אֲשֶׁ֣ר לֹֽא בְ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: fr
  text: 'Il se dit en lui-même : « Je ne chancellerai pas[a] ; de génération en génération, je ne connaîtrai pas le malheur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne serai pas ébranlé » ; le verbe hébreu peut signifier chanceler, vaciller ou être déplacé.'
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est elliptique en hébreu. On pourrait aussi comprendre : « de génération en génération, moi qui ne suis pas dans le malheur », ou : « jamais je ne rencontrerai le malheur ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר בְּלִבּוֹ
  choice: Il se dit en lui-même
  rationale: L’expression hébraïque décrit une parole intérieure. Cette formulation française naturelle conserve l’idée de réflexion intime sans donner au « cœur » un sens anatomique.
- source_word: בַּל אֶמּוֹט
  choice: Je ne chancellerai pas
  rationale: Le verbe מוט au niphal évoque le fait de chanceler, vaciller ou être ébranlé. « Chanceler » conserve l’image d’une stabilité que le méchant croit inébranlable.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Formule française courante et proche de l’expression hébraïque, indiquant une continuité indéfinie au fil des générations.
- source_word: אֲשֶׁר לֹא בְרָע
  choice: je ne connaîtrai pas le malheur
  rationale: La proposition hébraïque est elliptique. Cette formulation explicite sobrement la poursuite de la vantardise à la première personne et rend רָע ici par le malheur ou l’adversité.
theological_decisions:
- issue: Ellipse de la proposition finale et identité de son sujet
  choice: 'La proposition poursuit la parole intérieure à la première personne : « je ne connaîtrai pas le malheur »'
  alternative: « [moi] qui ne suis pas dans le malheur » ou « jamais je ne rencontrerai le malheur »
  rationale: Le contexte favorise la continuation de la prétention du méchant à une sécurité durable, mais la syntaxe hébraïque reste elliptique ; la note préserve donc les autres analyses possibles.
translation_notes:
  register: Français international moderne, naturel et digne. « Il se dit en lui-même » rend clairement la parole intérieure ; « chancellerai » maintient la métaphore poétique, et la note finale conserve l’ambiguïté réelle de l’hébreu.
