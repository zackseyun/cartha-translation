  text: שְׁ֭בֹר זְר֣וֹעַ רָשָׁ֑ע וָ֝/רָ֗ע תִּֽדְרוֹשׁ רִשְׁע֥/וֹ בַל תִּמְצָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/015.yaml
  text: Break the arm of the wicked and evil man[a]; seek out his wickedness until you find none.
translation:
  language: fr
  text: Brise le bras du méchant et du malfaiteur[a] ; recherche sa méchanceté jusqu’à ce que tu n’en trouves plus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Brise le bras du méchant et de l’homme mauvais. » L’hébreu emploie deux qualificatifs substantivés parallèles; le second peut aussi être rendu par « le mauvais » ou « le malfaiteur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « recherche sa méchanceté : tu ne trouveras pas ». Le lien exact entre les deux propositions reste implicite en hébreu.'
    reason: source_ambiguity
lexical_decisions:
- source_word: שְׁבֹר
  choice: Brise
  rationale: Impératif adressé à Dieu. « Brise » rend directement la force de la demande sans intensifier indûment le verbe.
- source_word: זְרוֹעַ
  choice: le bras
  rationale: Le terme désigne littéralement le bras et, dans ce contexte, évoque la puissance d’agir du méchant. L’image poétique concrète est conservée.
- source_word: רָשָׁע
  choice: du méchant
  rationale: L’adjectif substantivé désigne ici une personne méchante au singulier représentatif.
- source_word: וָרָע
  choice: et du malfaiteur
  rationale: Le second qualificatif est rendu comme un substantif parallèle à « méchant ». « Malfaiteur » exprime naturellement en français celui qui fait le mal, tout en évitant la tournure moins idiomatique « l’homme mauvais ».
- source_word: תִּדְרוֹשׁ
  choice: recherche
  rationale: Le verbe signifie chercher, examiner ou réclamer des comptes selon le contexte. « Recherche » préserve ici l’image verbale de l’enquête divine sans effacer sa portée judiciaire.
- source_word: רִשְׁעוֹ
  choice: sa méchanceté
  rationale: Le nom reprend la racine de רָשָׁע et désigne la conduite coupable ou la méchanceté de l’individu.
- source_word: בַל תִּמְצָא
  choice: jusqu’à ce que tu n’en trouves plus
  rationale: 'Cette formulation française exprime le résultat souhaité de la recherche : le mal a été entièrement traité et il n’en reste plus à trouver. Le pronom « en » reprend « méchanceté ».'
theological_decisions:
- issue: Sens métaphorique du « bras » du méchant
  choice: Conserver l’image concrète du bras
  alternative: Traduire par « puissance » ou « force »
  rationale: La prière demande à Dieu de neutraliser la capacité de nuire de l’oppresseur. Garder « bras » respecte l’image poétique hébraïque sans en imposer une explication dans le texte.
- issue: Rapport entre la recherche divine et la proposition finale בַל תִּמְצָא
  choice: « jusqu’à ce que tu n’en trouves plus »
  alternative: « afin que tu n’en trouves plus » ou « tu n’en trouveras pas »
  rationale: L’hébreu est concis et le rapport logique peut être compris comme un résultat ou un terme recherché. La traduction retenue exprime l’éradication complète du mal sans affirmer davantage que le texte.
- issue: Identification de וָרָע
  choice: 'Le comprendre comme un second qualificatif substantivé : « le malfaiteur »'
  alternative: Le comprendre comme « le mal » ou rattacher autrement le terme à la proposition suivante
  rationale: Le parallélisme avec רָשָׁע favorise la lecture personnelle, mais la forme hébraïque permet une autre compréhension, signalée en note.
translation_notes:
  register: Français international moderne, poétique et digne. L’impératif direct et l’image du bras sont maintenus. « Malfaiteur » est courant et naturel, tandis que les notes conservent les ambiguïtés lexicales et syntaxiques de l’hébreu.
