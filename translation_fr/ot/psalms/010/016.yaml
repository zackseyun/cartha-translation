source:
  edition: WLC
  text: יְהוָ֣ה מֶ֭לֶךְ עוֹלָ֣ם וָ/עֶ֑ד אָבְד֥וּ ג֝וֹיִ֗ם מֵֽ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/016.yaml
  text: Yahweh is King forever and ever[a]; nations have perished from his land.
translation:
  language: fr
  text: Yahweh est roi pour toujours et à jamais ; les nations ont disparu de son pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sa terre ». Le nom hébreu peut désigner soit un pays, soit la terre entière, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: מֶלֶךְ
  choice: est roi
  rationale: Conserve la valeur nominale du prédicat hébreu tout en donnant une phrase française naturelle.
- source_word: עוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: Rend l'expression redoublée qui souligne la durée sans fin.
- source_word: אָבְדוּ
  choice: ont disparu
  rationale: Le passé composé exprime l'état de fait accompli du qatal ; « disparaître » conserve la portée possible du verbe sans imposer explicitement un passif tel que « ont été détruites ».
- source_word: גּוֹיִם
  choice: les nations
  rationale: Désigne ici des peuples étrangers sans introduire la connotation religieuse plus particulière de « païens ».
- source_word: מֵאַרְצוֹ
  choice: de son pays
  rationale: Le sens territorial de אֶרֶץ convient au contexte immédiat, tandis que le sens universel « terre » demeure possible et est signalé en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel au lieu de le remplacer par un titre.
- issue: Portée de אַרְצוֹ
  choice: son pays
  alternative: sa terre
  rationale: Le contexte permet une lecture territoriale concrète, mais le nom hébreu peut aussi désigner toute la terre ; la note maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation relie les deux affirmations sans expliciter un rapport logique absent de l'hébreu.
