  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : la corrélation בין « comme » et « ainsi », les deux accomplis, les deux mentions de la ville, le titre « Yahweh des armées », et l’affermissement durable de la ville sont bien rendus. Toutefois, le plus-que-parfait « avions entendu » introduit une antériorité que les deux parfaits hébreux parallèles ne marquent pas nécessairement. Le passé composé aux deux membres préserve mieux ce parallélisme sans exclure que ce qui a été entendu précède l’expérience de la vision.'
  naturalness: La formulation révisée est plus directe et naturelle en français international moderne. Elle conserve une tonalité poétique sobre sans l’inversion quelque peu soutenue « ainsi l’avons-nous vu ».
  terminology: « Yahweh des armées », « notre Dieu », « pour toujours » et « Sélah » conviennent. « Affermira » rend bien l’idée de rendre ferme ou stable. En français, l’élision dans « l’affermira » ne permet pas de signaler le féminin, contrairement au suffixe hébreu.
