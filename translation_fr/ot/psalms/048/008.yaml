  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: fr
  text: Comme nous l’avons entendu, ainsi nous l’avons vu dans la ville de Yahweh des armées, dans la ville de notre Dieu. Dieu l’affermira[a] pour toujours. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le suffixe hébreu est féminin et renvoie à la ville, nom féminin. L’élision française dans « l’affermira » ne marque pas ce genre. On pourrait aussi traduire : « Dieu rendra cette ville inébranlable pour toujours. »'
    reason: Précise le référent du suffixe féminin hébreu et indique que le pronom français élidé ne conserve pas formellement cette marque de genre.
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Comme… ainsi…
  rationale: Conserve la corrélation comparative de l’hébreu entre ce qui avait été entendu et ce qui a été constaté.
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: nous l’avions entendu… nous l’avons vu
  rationale: Le plus-que-parfait suivi du passé composé exprime naturellement en français le rapport antérieur reçu puis confirmé par l’expérience, sans modifier le parallélisme.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et rend צְבָאוֹת par un terme français courant qui garde l’idée des armées ou puissances placées sous son commandement.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom en état construit avec le suffixe de première personne du pluriel.
- source_word: יְכוֹנְנֶהָ
  choice: l’affermira
  rationale: Le verbe כון exprime l’action de rendre ferme ou stable. Le pronom féminin élidé renvoie naturellement à « ville » en français.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Expression française claire et idiomatique de la durée indéfinie ou perpétuelle.
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis du terme liturgique ou musical reste incertain; sa translittération évite une interprétation non assurée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette distinction au lieu de lui substituer un titre.
- issue: Référent du suffixe féminin dans יְכוֹנְנֶהָ
  choice: « l’ » renvoie à la ville
  alternative: répéter « cette ville »
  rationale: Le suffixe féminin singulier renvoie le plus naturellement à עִיר, « ville ». Le pronom français conserve ce lien grammatical sans imposer une personnification plus marquée que l’hébreu.
translation_notes:
  register: Français moderne, digne et légèrement poétique. L’inversion « ainsi l’avons-nous vu » maintient le parallélisme hébreu sans lourdeur excessive; « Sélah » est conservé comme terme non traduit.
