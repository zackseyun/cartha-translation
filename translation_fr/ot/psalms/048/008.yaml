  - severity: low
    issue: 'Asymétrie des temps : « nous l’avions entendu » / « nous l’avons vu ».'
    rationale: Les deux verbes hébreux sont des parfaits coordonnés et parallèles. Un passé composé dans les deux propositions est plus fidèle à cette symétrie et plus neutre quant à l’antériorité.
