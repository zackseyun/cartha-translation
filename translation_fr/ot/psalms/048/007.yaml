  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: fr
  text: Par un vent d’est, tu brises les navires de Tarsis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « les navires à destination de Tarsis » ou « les navires de type Tarsis »; cette expression peut désigner de grands navires marchands associés à Tarsis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רוּחַ קָדִים
  choice: Par un vent d’est
  rationale: רוּחַ désigne ici le vent, comme l’indiquent קָדִים et l’image maritime. La préposition בְּ est comprise dans son sens instrumental. « Vent d’est » est naturel en français et évoque le vent oriental destructeur.
- source_word: תְּשַׁבֵּר
  choice: tu brises
  rationale: Le piel de שׁבר exprime une action énergique de rupture. « Briser » conserve cette force tout en restant naturel et digne; la deuxième personne masculine singulière maintient l’adresse directe à Dieu.
- source_word: אֳנִיּוֹת
  choice: les navires
  rationale: Le nom pluriel désigne des bateaux de mer. « Navires » convient mieux que « bateaux » au contexte maritime et commercial; l’article défini rend naturellement en français l’expression associée au nom propre.
- source_word: תַּרְשִׁישׁ
  choice: Tarsis
  rationale: Le nom propre est rendu selon sa forme française traditionnelle. L’expression peut désigner des navires liés à Tarsis, destinés à Tarsis, ou une catégorie de grands navires marchands; le texte principal en préserve la concision.
theological_decisions:
- issue: Référent de la deuxième personne dans תְּשַׁבֵּר
  choice: Adresse directe à Dieu (« tu brises »)
  alternative: Formulation impersonnelle ou constat général
  rationale: La forme verbale est à la deuxième personne masculine singulière et, dans le contexte du psaume, s’adresse naturellement à Dieu. Cette traduction conserve la force poétique sans expliciter davantage le sujet.
translation_notes:
  register: Français international moderne, poétique et accessible. « Par » marque clairement le moyen; « vent d’est » est idiomatique. « Brises » garde l’intensité du verbe hébreu sans employer un terme excessivement familier.
