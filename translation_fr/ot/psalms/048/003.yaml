  yaml_path: translation/ot/psalms/048/003.yaml
  text: God is known in her citadels as a stronghold[a][b].
translation:
  language: fr
  text: Dans ses citadelles[a], Dieu est connu comme une forteresse[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ses palais ». Le terme hébreu peut désigner de grandes résidences ou des bâtiments fortifiés ; ici, le contexte de la sécurité de la ville favorise « citadelles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un refuge » ou « comme une place forte ». Le mot hébreu évoque un lieu élevé offrant protection et sécurité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Dieu
  rationale: Dans ce contexte, la forme plurielle sert de titre singulier au Dieu d’Israël.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: dans ses citadelles
  rationale: Le nom peut désigner des palais ou des constructions fortifiées. Dans le contexte de la sécurité de Sion, « citadelles » conserve à la fois l’idée de grandeur et celle de défense. Le possessif féminin renvoie à la ville.
- source_word: נוֹדַע
  choice: est reconnu
  rationale: Le niphal de ידע peut exprimer un état passif, « être connu ». « Est reconnu » produit ici une formulation française naturelle sans imposer le sens réfléchi « se fait connaître ».
- source_word: לְמִשְׂגָּב
  choice: comme une forteresse
  rationale: מִשְׂגָּב désigne un lieu élevé et sûr, donc un refuge ou une place forte. « Forteresse » maintient l’image de protection défensive et s’accorde avec le contexte urbain.
theological_decisions:
- issue: Référent du suffixe féminin dans « ses citadelles »
  choice: Le suffixe renvoie à Sion, la ville célébrée dans le psaume.
  alternative: Il pourrait renvoyer plus généralement au pays ou à la communauté.
  rationale: Le contexte immédiat est centré sur le mont Sion et la ville de Dieu; la ville personnifiée est donc le référent le plus probable.
- issue: Nuance de נוֹדַע appliqué à Dieu
  choice: Maintenir le sens statif ou passif avec « est reconnu ».
  alternative: « se fait connaître » ou « s’est fait connaître »
  rationale: La forme hébraïque permet une lecture passive ou stative. La traduction choisie évite d’ajouter sans nécessité une nuance explicitement réflexive, tout en restant idiomatique en français.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste concise, tandis que « est reconnu » rend la valeur stative du verbe de façon plus naturelle que le calque « est connu ».
