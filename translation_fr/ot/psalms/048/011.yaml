id: PSA.48.11
reference: Psalms 48:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשְׂמַ֤ח הַר צִיּ֗וֹן תָּ֭גֵלְנָה בְּנ֣וֹת יְהוּדָ֑ה לְ֝מַ֗עַן מִשְׁפָּטֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/011.yaml
  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: fr
  text: Que le mont Sion se réjouisse[a], que les filles de Juda exultent à cause de tes jugements !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les villes ou les villages de Juda », car « filles » peut désigner poétiquement des localités dépendantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: Que… se réjouisse
  rationale: L’imparfait qal peut avoir ici une valeur jussive dans le contexte poétique ; cette tournure exprime naturellement l’invitation à la joie.
- source_word: הַר צִיּוֹן
  choice: le mont Sion
  rationale: Équivalent français courant qui conserve l’image topographique et le nom propre.
- source_word: תָּגֵלְנָה
  choice: que… exultent
  rationale: Le verbe גיל exprime une joie vive. « Exultent » distingue ce second verbe de שׂמח tout en gardant le parallélisme poétique.
- source_word: בְּנוֹת יְהוּדָה
  choice: les filles de Juda
  rationale: La formulation littérale préserve l’image poétique hébraïque ; elle peut désigner les localités de Juda, possibilité signalée en note.
- source_word: לְמַעַן
  choice: à cause de
  rationale: Dans ce contexte, la locution introduit le motif de la joie.
- source_word: מִשְׁפָּטֶיךָ
  choice: tes jugements
  rationale: Le terme peut désigner des décisions judiciaires, la justice ou des ordonnances. Ici, le contexte célèbre surtout les actes par lesquels Dieu exerce son jugement.
theological_decisions:
- issue: Sens de מִשְׁפָּטֶיךָ dans le contexte
  choice: tes jugements
  alternative: ta justice ; tes ordonnances
  rationale: Le contexte du psaume met en avant les interventions décisives de Dieu comme roi et juge. « Jugements » conserve cette portée sans réduire le mot aux lois révélées ni l’identifier uniquement à une notion abstraite de justice.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme hébraïque est conservé par deux subjonctifs exhortatifs, avec une variation lexicale naturelle entre « se réjouisse » et « exultent ».
