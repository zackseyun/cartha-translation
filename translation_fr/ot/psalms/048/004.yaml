  text: כִּֽי הִנֵּ֣ה הַ֭/מְּלָכִים נֽוֹעֲד֑וּ עָבְר֥וּ יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/004.yaml
  text: For look, the kings assembled; they passed by together.
translation:
  language: fr
  text: 'Car voici : les rois se sont réunis ; ils sont passés ensemble.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: 'כִּי introduit ici l’explication ou la scène qui justifie le contexte, tandis que הִנֵּה attire vivement l’attention : « Car voici » conserve ces deux fonctions dans un français digne et naturel.'
- source_word: נוֹעֲדוּ
  choice: s’étaient donné rendez-vous
  rationale: Le nifal de יָעַד peut désigner le fait de se réunir à un moment ou en un lieu convenu. Cette formulation exprime une convergence concertée sans préciser un dessein que le verset ne nomme pas.
- source_word: עָבְרוּ יַחְדָּו
  choice: ils s’avançaient ensemble
  rationale: עָבַר signifie fondamentalement passer, traverser ou avancer. Dans cette scène de rois en mouvement, « s’avançaient » est idiomatique et conserve l’idée d’un déplacement collectif, sans imposer une destination.
theological_decisions:
- issue: Nature de l’action concertée des rois
  choice: Ne pas expliciter une attaque ni une alliance hostile
  alternative: « les rois s’étaient ligués » ou « marchaient contre elle »
  rationale: Le contexte peut suggérer une coalition ennemie, mais le verset dit seulement qu’ils se sont réunis et ont avancé ensemble. La traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le deux-points après « voici » rend l’effet de présentation de הִנֵּה ; l’imparfait narratif décrit la scène évoquée, tandis que le plus-que-parfait marque la réunion préalable.
