  text: יְפֵ֥ה נוֹף֮ מְשׂ֪וֹשׂ כָּל הָ֫/אָ֥רֶץ הַר צִ֭יּוֹן יַרְכְּתֵ֣י צָפ֑וֹן קִ֝רְיַ֗ת מֶ֣לֶךְ רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: fr
  text: Le mont Sion, aux confins du nord[a], cité du grand Roi, est beau par son élévation, joie de toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les versants septentrionaux » ; littéralement, « dans les parties reculées du nord ». L’expression peut aussi évoquer Tsaphôn et l’imagerie ancienne de la montagne divine qui lui est associée.
    reason: 'יַרְכְּתֵי צָפוֹן est ambigu : l’expression peut décrire une situation topographique ou faire allusion à l’imagerie de Tsaphôn.'
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: Beau par son élévation
  rationale: L’expression décrit la beauté du mont Sion en lien avec sa hauteur ou sa situation élevée. Cette formulation reste naturelle tout en conservant l’incertitude propre au nom נוֹף.
- source_word: מְשׂוֹשׂ כָּל הָאָרֶץ
  choice: joie de toute la terre
  rationale: מְשׂוֹשׂ désigne ce qui procure joie ou allégresse. « Toute la terre » respecte la portée potentiellement universelle de הָאָרֶץ plutôt que de la limiter au pays.
- source_word: הַר צִיּוֹן
  choice: le mont Sion
  rationale: Forme française courante et immédiatement compréhensible du nom géographique.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: aux confins du nord
  rationale: יַרְכְּתֵי évoque les parties reculées ou extrêmes, tandis que צָפוֹן peut signifier le nord ou renvoyer à Tsaphôn. La formulation principale préserve l’image spatiale sans trancher l’éventuelle allusion mythopoétique.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: la cité du grand Roi
  rationale: La chaîne construite désigne la cité appartenant au grand roi. La majuscule à « Roi » signale le référent divin suggéré par le contexte, sans ajouter son nom au texte.
theological_decisions:
- issue: Sens de יַרְכְּתֵי צָפוֹן appliqué au mont Sion
  choice: aux confins du nord
  alternative: sur les versants septentrionaux ; aux confins de Tsaphôn
  rationale: L’hébreu permet une lecture topographique aussi bien qu’une évocation de Tsaphôn, montagne divine dans l’imaginaire ancien. Le texte principal conserve cette tension et la note rend les principales possibilités explicites.
- issue: Référent de מֶלֶךְ רָב
  choice: le grand Roi
  alternative: un grand roi
  rationale: Dans ce psaume, la cité est présentée comme celle du Dieu souverain. L’article défini et la majuscule rendent ce sens contextuel sans explicitation doctrinale supplémentaire.
translation_notes:
  register: Français international actuel, poétique mais accessible. L’ordre appositionnel et les virgules conservent la densité du vers hébreu ; « cité » maintient un registre digne sans être archaïque.
