lexical_decisions:
- source_word: שִׁיר
  choice: chant
  rationale: Terme hébreu courant désignant un chant. Dans un titre de psaume, « chant » est naturel et conserve la désignation distincte de מִזְמוֹר.
- source_word: מִזְמוֹר
  choice: psaume
  rationale: Dans les suscriptions, ce terme constitue le nom de genre traditionnel et exact; il reste distinct de שִׁיר.
- source_word: לִבְנֵי
  choice: des fils de
  rationale: La préposition ל peut exprimer l’auteur, l’association, la destination ou le cadre d’exécution. « des » est concis et laisse le rapport relativement ouvert; une note signale l’autre traduction directe possible.
- source_word: קֹרַח
  choice: Coré
  rationale: « Coré » est la forme française biblique conventionnelle du nom propre.
theological_decisions:
- issue: Fonction de la formule לִבְנֵי קֹרַח dans la suscription
  choice: des fils de Coré
  alternative: pour les fils de Coré
  rationale: La préposition hébraïque ל est polysémique dans les titres des psaumes. Le texte principal retient la tournure française traditionnelle et peu déterminée, sans imposer exclusivement l’idée d’auteur; la note conserve la lecture de destination.
translation_notes:
  register: Français international moderne, concis et digne. La double désignation hébraïque est préservée par « Chant, psaume ». Le marqueur est placé sur « des », qui traduit la préposition ambiguë.
