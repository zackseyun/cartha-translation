source:
  edition: WLC
  text: שִׁ֤יתוּ לִבְּ/כֶ֨ם לְֽ/חֵילָ֗/ה פַּסְּג֥וּ אַרְמְנוֹתֶ֑י/הָ לְמַ֥עַן תְּ֝סַפְּר֗וּ לְ/ד֣וֹר אַחֲרֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/013.yaml
  text: Set your heart on her rampart[a]; pass through her citadels[b], so that you may tell the next generation.
translation:
  language: fr
  text: Portez votre attention sur son rempart[a], parcourez ses citadelles[b], afin d’en faire le récit à la génération suivante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son mur extérieur ». Le terme hébreu désigne de manière générale un ouvrage défensif de la ville.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses palais ». Le terme hébreu peut désigner des bâtiments palatiaux ou des places fortes ; le contexte, consacré à l’examen des défenses de la ville, favorise ici « citadelles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Portez votre attention
  rationale: L’expression signifie littéralement « placez votre cœur » et invite ici à examiner attentivement les fortifications. La formulation choisie restitue en français moderne la valeur cognitive du « cœur » dans cet idiome hébreu sans suggérer un attachement affectif.
- source_word: לְחֵילָה
  choice: sur son rempart
  rationale: Dans la description d’une ville, חֵיל désigne un ouvrage défensif, probablement un rempart ou un mur extérieur. « Rempart » est précis, naturel et convient au singulier collectif.
- source_word: פַּסְּגוּ
  choice: parcourez
  rationale: Ce verbe rare, à l’impératif pluriel, évoque ici le fait de passer parmi les édifices de la ville pour les observer. « Parcourez » conserve cette dimension concrète sans exclure l’idée d’inspection.
- source_word: אַרְמְנוֹתֶיהָ
  choice: ses citadelles
  rationale: אַרְמוֹן peut désigner un palais ou un édifice fortifié. Dans ce contexte centré sur les défenses de Sion, « citadelles » convient bien, tandis que l’autre sens est signalé en note.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: afin d’en faire le récit
  rationale: לְמַעַן introduit le but, et le piel de ספר signifie raconter ou relater. Le pronom « en » renvoie naturellement à ce qui vient d’être observé.
- source_word: לְדוֹר אַחֲרוֹן
  choice: à la génération suivante
  rationale: L’expression désigne une génération ultérieure ou à venir. « La génération suivante » exprime clairement la transmission du témoignage.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La tournure idiomatique « Portez votre attention » rend la fonction de l’expression hébraïque littérale « placez votre cœur » ; « parcourez » maintient à la fois le mouvement concret et l’examen attentif suggérés par le contexte.
