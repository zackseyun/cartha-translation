  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: fr
  text: Faites le tour de Sion, faites-en le tour ; comptez ses tours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹבּוּ
  choice: Faites le tour
  rationale: L’impératif pluriel de סבב appelle à se déplacer autour de la ville. « Faites le tour » est naturel en français moderne et conserve l’action spatiale concrète.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Le nom propre est rendu par sa forme française traditionnelle. L’hébreu porte simplement « Sion », sans « mont ».
- source_word: וְהַקִּיפוּהָ
  choice: contournez-la
  rationale: L’impératif pluriel avec suffixe féminin demande de faire le tour de Sion. « Contournez-la » maintient la seconde injonction et la référence féminine sans suggérer nécessairement une action hostile.
- source_word: סִפְרוּ
  choice: comptez
  rationale: Dans ce contexte d’observation des ouvrages de la ville, le verbe désigne leur dénombrement concret.
- source_word: מִגְדָּלֶיהָ
  choice: ses tours
  rationale: Le nom pluriel avec suffixe de troisième personne féminin renvoie à Sion. En français, « ses tours » exprime naturellement cette relation sans imposer un pronom genré peu idiomatique.
theological_decisions: []
translation_notes:
  register: Français moderne, direct et digne. Les trois impératifs pluriels sont conservés. La répétition de deux verbes de mouvement autour de Sion est maintenue plutôt que lissée, tandis que la personnification féminine est portée naturellement par le pronom « la ».
