source:
  edition: WLC
  text: דִּמִּ֣ינוּ אֱלֹהִ֣ים חַסְדֶּ֑/ךָ בְּ֝/קֶ֗רֶב הֵיכָלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/009.yaml
  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: fr
  text: Nous avons médité[a] sur ton amour fidèle, ô Dieu, au milieu de ton temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réfléchi à » ou « considéré attentivement ». Le verbe hébreu peut exprimer l’idée de considérer attentivement ou de méditer.
    reason: alternative lexicale
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: Nous avons médité
  rationale: Le piel accompli à la première personne du pluriel exprime ici une réflexion attentive. « Méditer sur » est naturel dans un contexte de prière et respecte mieux le sens contextuel que « comparer ».
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le nom fonctionne comme une apostrophe. « Ô Dieu » rend clairement cette adresse directe et conserve le registre poétique de la prière.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חֶסֶד désigne ici l’amour loyal, constant et relationnel de Dieu. « Amour fidèle » en restitue la richesse sans le réduire à la seule miséricorde ni employer une formulation technique.
- source_word: בְּקֶרֶב
  choice: au milieu de
  rationale: Cette expression garde le sens spatial d’une présence à l’intérieur du lieu, dans une formulation française claire et digne.
- source_word: הֵיכָלֶךָ
  choice: ton temple
  rationale: Bien que הֵיכָל puisse aussi signifier « palais », le cadre cultuel du psaume favorise nettement « temple ».
theological_decisions:
- issue: Portée de חֶסֶד dans la description de Dieu
  choice: amour fidèle
  alternative: bonté ; miséricorde ; amour d’alliance
  rationale: « Amour fidèle » maintient ensemble l’affection, la loyauté et la constance associées au terme hébreu, sans en limiter le sens ni expliciter dans le texte une théologie de l’alliance seulement implicite.
- issue: Fonction de אֱלֹהִים
  choice: 'Apostrophe directe : « ô Dieu »'
  alternative: 'Référence non vocative : « Dieu »'
  rationale: La syntaxe et le caractère priant du verset invitent à comprendre le nom comme une adresse directe ; la ponctuation française rend cette lecture explicite sans ajouter de contenu.
translation_notes:
  register: Français international moderne, poétique et digne. Le passé composé reflète l’accompli hébreu, tandis que « médité sur » demeure accessible. L’apostrophe « ô Dieu » conserve le ton liturgique sans archaïsme excessif.
