  source_fidelity: 'Le texte rend fidèlement la chaîne verbale de l’hébreu : vision, stupeur, effroi/désarroi, puis départ précipité. « Ils ont vu » traduit simplement רָאוּ ; « et alors » rend de manière recevable la liaison כֵּן ; « stupéfaits » couvre bien תָּמָהוּ. « Saisis d’épouvante » restitue avec une intensité défendable נִבְהֲלוּ dans ce contexte. « Se sont enfuis précipitamment » exprime l’empressement contraint de נֶחְפָּזוּ et reste cohérent avec la lecture contextuelle et l’audit anglais (« fled in haste »).'
