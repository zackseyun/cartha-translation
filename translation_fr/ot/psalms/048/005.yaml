  yaml_path: translation/ot/psalms/048/005.yaml
  text: They saw[a], and so they were astonished; they were terrified; they fled in haste.
translation:
  language: fr
  text: Ils ont vu, et alors ils ont été stupéfaits ; saisis d’épouvante, ils se sont enfuis précipitamment.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵמָּה
  choice: Ils
  rationale: Le pronom indépendant masculin pluriel est emphatique en hébreu, mais le français naturel exprime ici adéquatement le sujet par « Ils », le contexte portant l’accent.
- source_word: רָאוּ
  choice: ont vu
  rationale: Le qal accompli de ראה est le verbe courant signifiant « voir » ; « ont vu » est direct et naturel.
- source_word: כֵּן
  choice: et alors
  rationale: La particule relie la vision à la réaction qui suit. « Et alors » conserve cette progression sans imposer un rapport causal plus précis que l’hébreu.
- source_word: תָּמָהוּ
  choice: ont été stupéfaits
  rationale: Le qal accompli de תמה exprime la stupeur ou l’étonnement. « Stupéfaits » convient à la réaction soudaine sans préciser indûment s’il s’agit d’admiration ou d’horreur.
- source_word: נִבְהֲלוּ
  choice: saisis d’épouvante
  rationale: Le nifal accompli de בהל indique qu’ils sont bouleversés, alarmés ou terrifiés. Dans cette séquence croissante, « saisis d’épouvante » restitue bien l’intensité.
- source_word: נֶחְפָּזוּ
  choice: se sont enfuis précipitamment
  rationale: Le nifal accompli de חפז évoque un mouvement hâtif sous la pression. « Se sont enfuis précipitamment » rend à la fois la fuite suggérée par le contexte et l’idée explicite d’urgence, sans ajouter directement « en panique ».
