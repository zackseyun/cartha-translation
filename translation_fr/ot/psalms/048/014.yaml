  text: כִּ֤י זֶ֨ה אֱלֹהִ֣ים אֱ֭לֹהֵי/נוּ עוֹלָ֣ם וָ/עֶ֑ד ה֖וּא יְנַהֲגֵ֣/נוּ עַל מֽוּת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: fr
  text: Car ce Dieu est notre Dieu pour toujours et à jamais ; il nous conduira jusqu’à la mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque finale est difficile. Le texte massorétique se comprend naturellement « jusqu’à la mort » ; certaines versions anciennes et d’autres analyses la comprennent plutôt dans le sens de « pour toujours ».
    reason: Signaler l’incertitude textuelle et interprétative de עַל־מוּת, tout en donnant dans le texte la lecture la plus directe de la forme massorétique.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: Car ce Dieu
  rationale: Reproduit naturellement la construction hébraïque qui désigne le Dieu célébré dans le psaume et motive l’exhortation précédente.
- source_word: עוֹלָם וָעֶד
  choice: pour toujours et à jamais
  rationale: Conserve le redoublement emphatique de durée de l’hébreu dans une formulation française courante et solennelle.
- source_word: יְנַהֲגֵנוּ
  choice: il nous conduira
  rationale: Le verbe נהג exprime ici l’action de mener ou guider ; « conduira » convient au contexte et au registre.
- source_word: עַל־מוּת
  choice: au-delà de la mort
  rationale: Lecture possible de l’expression difficile עלמות/על־מות, comprise comme indiquant une conduite qui franchit la limite de la mort, conformément à la division massorétique donnée.
theological_decisions:
- issue: Portée de la conduite divine par rapport à la mort
  choice: au-delà de la mort
  alternative: jusqu’à la mort / pour toujours
  rationale: L’expression finale est textuellement difficile. La traduction retenue suit la vocalisation et la séparation du WLC ainsi que le sens contextuel adopté par la couche anglaise auditée, sans expliciter davantage la nature de l’espérance après la mort.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et l’emphase temporelle sont préservés ; la ponctuation distingue les deux affirmations du verset.
