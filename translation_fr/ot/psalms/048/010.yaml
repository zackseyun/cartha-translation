  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: fr
  text: Comme ton nom, ô Dieu, ainsi ta louange[a] s’étend jusqu’aux extrémités de la terre ; ta main droite est pleine de justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta louange est sur les extrémités de la terre ». La préposition hébraïque signifie littéralement « sur » ou « au-dessus de ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « droiture ». Le mot hébreu peut exprimer aussi bien la droiture que la justice.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשִׁמְךָ
  choice: Comme ton nom
  rationale: Le préfixe כ marque la comparaison et forme avec כֵּן la structure poétique « comme… ainsi… ». Le terme concret « nom » est conservé, tout en pouvant évoquer la renommée.
- source_word: אֱלֹהִים
  choice: ô Dieu
  rationale: Le contexte indique une apostrophe directe ; « ô Dieu » en restitue naturellement la valeur vocative dans un registre poétique digne.
- source_word: כֵּן
  choice: ainsi
  rationale: « Ainsi » répond au « comme » initial et préserve le parallélisme comparatif de l’hébreu.
- source_word: תְּהִלָּתְךָ
  choice: ta louange
  rationale: Le nom désigne directement la louange, avec ici une possible connotation de renommée ; la traduction concrète demeure la plus proche du texte.
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: s’étend jusqu’aux extrémités de la terre
  rationale: עַל signifie littéralement « sur/au-dessus de », mais, avec les extrémités de la terre, il exprime naturellement l’étendue spatiale. La formulation française évite l’ambiguïté peu naturelle de « ta louange est sur ».
- source_word: צֶדֶק
  choice: justice
  rationale: צֶדֶק recouvre la rectitude morale et la justice exercée. En français moderne, « justice » convient naturellement à la main agissante de Dieu, tandis que « droiture » reste une possibilité légitime signalée en note.
- source_word: מָלְאָה
  choice: est pleine de
  rationale: Le parfait décrit un état résultant et la tournure « est pleine de » restitue directement et naturellement l’image.
- source_word: יְמִינֶךָ
  choice: ta main droite
  rationale: La traduction littérale conserve l’image biblique de la puissance et de l’action sans l’expliciter dans le texte.
theological_decisions:
- issue: Portée de צֶדֶק dans la description de la main droite de Dieu
  choice: justice
  alternative: droiture
  rationale: Le mot hébreu peut désigner aussi bien la conformité morale que l’exercice juste du jugement. « Justice » est idiomatique dans ce contexte d’action divine, mais la note maintient la nuance possible de « droiture » sans réduire la tension sémantique.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement suit l’adresse directe à Dieu. La structure comparative « Comme… ainsi… » conserve le parallélisme hébreu, tandis que « s’étend jusqu’aux » rend la relation spatiale dans un français naturel.
