id: PSA.48.1
reference: Psalms 48:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גָּ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד בְּ/עִ֥יר אֱ֝לֹהֵ֗י/נוּ הַר קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/001.yaml
  text: Great is Yahweh[a], and greatly to be praised, in the city of our God, his holy mountain.
translation:
  language: fr
  text: 'Grand est Yahweh, et hautement loué[a],

    dans la ville de notre Dieu, sa montagne sainte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et digne de grandes louanges ». Le participe passif hébreu peut désigner celui qui est loué ou, selon une expression plus idiomatique, celui qui mérite la louange.'
    reason: alternative lexicale
lexical_decisions:
- source_word: גָּדוֹל
  choice: Grand
  rationale: L’adjectif en tête de verset a une valeur prédicative. « Grand est Yahweh » conserve l’ordre emphatique et la tonalité poétique de l’hébreu sans réduire la grandeur à la seule puissance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que par un titre de substitution.
- source_word: וּמְהֻלָּל מְאֹד
  choice: et hautement loué
  rationale: Le participe passif de הלל est rendu directement par « loué », tandis que מְאֹד est exprimé par « hautement ». Une note signale l’autre valeur naturelle, « digne de grandes louanges ».
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: dans la ville de notre Dieu
  rationale: La préposition בְּ est locative, et le rapport construit est naturellement rendu par « la ville de notre Dieu ».
- source_word: הַר קָדְשׁוֹ
  choice: sa montagne sainte
  rationale: La formulation française rend clairement le nom suivi du terme de sainteté et du suffixe possessif. L’expression apposée identifie la ville comme la montagne sainte de Dieu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR / Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur du participe passif מְהֻלָּל
  choice: hautement loué
  alternative: digne de grandes louanges
  rationale: Le participe peut décrire Dieu comme effectivement loué ou, dans ce contexte hymnique, comme méritant la louange. Le texte retient la forme passive la plus proche et la note maintient l’autre nuance.
translation_notes:
  register: Style poétique, digne et accessible. L’inversion « Grand est Yahweh » conserve l’emphase de l’ouverture hébraïque. Le vers est disposé en deux lignes pour faire ressortir son parallélisme, sans ajouter de ponctuation interprétative forte.
