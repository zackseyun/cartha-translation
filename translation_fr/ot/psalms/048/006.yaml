  text: Trembling seized them there[a], anguish like a woman in labor.
translation:
  language: fr
  text: Là, un tremblement les a saisis[a], une douleur comme celle d’une femme qui accouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des convulsions comme celles d’une femme qui accouche » ; le nom hébreu חִיל peut souligner les douleurs convulsives elles-mêmes aussi bien que la souffrance qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְעָדָה
  choice: un tremblement
  rationale: Le nom désigne l’action de trembler ou un frisson violent. « Un tremblement » conserve l’image concrète et fonctionne naturellement comme sujet.
- source_word: אֲחָזָתַם
  choice: les a saisis
  rationale: Le verbe אחז signifie saisir ou empoigner. Cette formulation exprime la force soudaine qui s’empare d’eux et respecte l’accord du verbe hébreu avec רְעָדָה.
- source_word: שָׁם
  choice: Là
  rationale: L’adverbe situe vivement la scène. Sa place initiale donne une tournure française naturelle tout en conservant son relief.
- source_word: חִיל
  choice: une douleur
  rationale: Le nom peut évoquer la douleur, l’angoisse ou les contorsions, notamment celles de l’accouchement. « Une douleur » garde ici les dimensions physique et affective sans trancher excessivement.
- source_word: כַּיּוֹלֵדָה
  choice: comme celle d’une femme qui accouche
  rationale: La comparaison renvoie à une femme en train d’enfanter. Cette formulation actuelle et digne explicite que « celle » reprend la douleur.
