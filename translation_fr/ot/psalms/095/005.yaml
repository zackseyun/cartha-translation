source:
  edition: WLC
  text: אֲשֶׁר ל֣/וֹ הַ֭/יָּם וְ/ה֣וּא עָשָׂ֑/הוּ וְ֝/יַבֶּ֗שֶׁת יָדָ֥י/ו יָצָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: fr
  text: La mer est à lui[a], car il l’a faite[b], et ses mains ont façonné la terre ferme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « La mer lui appartient » ; l’hébreu dit littéralement : « à qui est la mer ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « et il l’a faite » ; la conjonction hébraïque signifie formellement « et », mais elle a probablement ici une valeur causale.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: À lui est
  rationale: La construction relative avec לְ exprime ici la possession. « À lui est la mer » conserve de près la tournure hébraïque tout en restant intelligible et solennelle en français.
- source_word: הַיָּם
  choice: la mer
  rationale: « Mer » est l’équivalent courant du nom hébreu; « océan » serait plus interprétatif.
- source_word: וְהוּא
  choice: car c’est lui qui
  rationale: La conjonction וְ est formellement « et », mais le lien avec l’affirmation précédente est vraisemblablement causal. La tournure emphatique rend aussi le pronom explicite הוּא.
- source_word: עָשָׂהוּ
  choice: l’a faite
  rationale: Le suffixe masculin singulier reprend הַיָּם, masculin en hébreu; le pronom français s’accorde naturellement avec « mer », féminin. עשה signifie ici « faire ».
- source_word: וְיַבֶּשֶׁת
  choice: et la terre ferme
  rationale: יַבֶּשֶׁת désigne la terre sèche par contraste avec la mer. « Terre ferme » exprime naturellement ce contraste en français.
- source_word: יָדָיו
  choice: ses mains
  rationale: L’image anthropomorphique explicite du texte hébreu est conservée plutôt que réduite à « il » ou remplacée par « sa puissance ».
- source_word: יָצָרוּ
  choice: ont façonné
  rationale: יצר évoque l’action de donner forme. « Façonner » préserve la nuance et la variation lexicale par rapport à עשה, rendu par « faire ».
theological_decisions:
- issue: Langage anthropomorphique appliqué à l’action divine
  choice: Conserver « ses mains ont façonné »
  alternative: « il a façonné » ou « sa puissance a façonné »
  rationale: Le texte attribue explicitement l’action aux « mains » de Dieu. Garder cette image respecte la poésie sans imposer une reformulation doctrinale.
- issue: Distinction entre les verbes de création עשה et יצר
  choice: 'Employer deux verbes différents : « faire » et « façonner »'
  alternative: Rendre les deux verbes de la même manière
  rationale: Cette distinction reproduit la variation lexicale et le parallélisme poétique sans postuler une différence théologique plus précise que celle du texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe légèrement élevée « À lui est la mer » conserve la force possessive et la couleur poétique de l’hébreu; les notes proposent les formulations plus idiomatiques ou plus formelles possibles.
