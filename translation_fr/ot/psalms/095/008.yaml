source:
  edition: WLC
  text: אַל תַּקְשׁ֣וּ לְ֭בַבְ/כֶם כִּ/מְרִיבָ֑ה כְּ/י֥וֹם מַ֝סָּ֗ה בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: fr
  text: N’endurcissez pas votre cœur comme à Meriba[a][c], comme au jour de Massa[b][c] dans le désert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meriba signifie « querelle » ou « dispute ».
    reason: lexical_alternative
  - marker: b
    text: Massa signifie « mise à l’épreuve ».
    reason: lexical_alternative
  - marker: c
    text: Voir Exode 17.7 et Nombres 20.13 pour les événements du désert auxquels ce verset fait allusion.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: N’endurcissez pas
  rationale: La particule négative avec la forme verbale exprime une interdiction; « endurcir » rend directement le hifil de קשׁה et convient naturellement avec « cœur ».
- source_word: לְבַבְכֶם
  choice: votre cœur
  rationale: Le nom hébreu est au singulier avec un suffixe de deuxième personne du pluriel. Le singulier collectif français conserve cette forme et l’adresse au groupe.
- source_word: כִּמְרִיבָה
  choice: comme à Meriba
  rationale: Meriba est ici compris comme le nom du lieu lié à l’épisode du désert, sans effacer son sens lexical de « querelle », indiqué en note.
- source_word: כְּיוֹם מַסָּה
  choice: comme au jour de Massa
  rationale: Cette formulation suit de près la comparaison temporelle hébraïque et conserve Massa comme nom historique tout en évitant d’ajouter une préposition locative absente de l’expression.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: « Désert » est la désignation française courante et naturelle du cadre de l’Exode évoqué par מִדְבָּר.
theological_decisions:
- issue: Faut-il rendre מְרִיבָה et מַסָּה comme des noms communs ou comme des noms historiques?
  choice: Conserver les noms propres « Meriba » et « Massa ».
  alternative: « comme lors de la querelle, comme au jour de l’épreuve dans le désert »
  rationale: Le contexte renvoie à des événements précis du séjour au désert. Les noms propres préservent ce lien intertextuel, tandis que les notes donnent leur valeur lexicale sans imposer une paraphrase dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le singulier collectif « votre cœur » reflète la forme hébraïque tout en s’adressant à l’ensemble de la communauté. Les graphies françaises traditionnelles « Meriba » et « Massa » sont retenues.
