  text: נְקַדְּמָ֣ה פָנָ֣י/ו בְּ/תוֹדָ֑ה בִּ֝/זְמִר֗וֹת נָרִ֥יעַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/002.yaml
  text: Let us come before his face with thanksgiving[a]; let us shout joyfully to him with songs.
translation:
  language: fr
  text: Venons devant lui avec reconnaissance[a] ; acclamons-le avec des chants !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « devant sa face ». En hébreu, « la face » désigne souvent la présence personnelle de quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְקַדְּמָה
  choice: Allons à sa rencontre
  rationale: Le hiphil cohortatif à la première personne du pluriel exprime une exhortation. « Aller à sa rencontre » rend naturellement le mouvement vers quelqu’un et s’accorde avec פָנָיו.
- source_word: פָנָיו
  choice: sa rencontre
  rationale: Littéralement « sa face » ; dans cette construction, l’expression désigne le fait de se présenter personnellement devant lui. Le français « aller à sa rencontre » restitue l’idiome sans formulation artificielle.
- source_word: בְּתוֹדָה
  choice: avec reconnaissance
  rationale: תּוֹדָה peut désigner la reconnaissance, la louange ou une offrande de reconnaissance. Le parallélisme avec les chants favorise ici l’expression de gratitude et de louange plutôt que l’offrande sacrificielle.
- source_word: בִּזְמִרוֹת
  choice: par nos chants
  rationale: זְמִרוֹת désigne des chants, souvent de louange. « Chants » reste large et naturel ; le possessif explicite en français le chant produit par l’assemblée sans modifier le sens.
- source_word: נָרִיעַ
  choice: acclamons-le
  rationale: Le hiphil cohortatif exprime un cri collectif, sonore et joyeux. « Acclamer » communique en français moderne la force vocale et la joie festive avec concision.
- source_word: לוֹ
  choice: -le
  rationale: Le pronom complément de « acclamons » rend la direction de l’acclamation vers lui exprimée par לֹו.
theological_decisions: []
translation_notes:
  register: Français moderne, collectif, exhortatif et liturgique. Le parallélisme des deux cohortatifs est conservé par « Allons… ; acclamons… ». La ponctuation finale souligne l’élan joyeux du verset.
