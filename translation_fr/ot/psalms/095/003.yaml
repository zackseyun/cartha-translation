  text: כִּ֤י אֵ֣ל גָּד֣וֹל יְהוָ֑ה וּ/מֶ֥לֶךְ גָּ֝ד֗וֹל עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: fr
  text: Car Yahweh est un grand Dieu et un grand roi au-dessus de tous les dieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au-dessus de tous les êtres divins ». Selon le contexte, le mot hébreu אֱלֹהִים peut désigner des dieux, des êtres divins ou des êtres célestes.'
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à l’adoration qui précède et conserve clairement la valeur causale.
- source_word: אֵל
  choice: Dieu
  rationale: Désigne ici directement Yahweh comme Dieu; la majuscule convient en français lorsqu’il s’agit du Dieu d’Israël.
- source_word: גָּדוֹל
  choice: grand
  rationale: Exprime la grandeur et la prééminence; la répétition de « grand » préserve le parallélisme hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de le remplacer par un titre.
- source_word: וּמֶלֶךְ
  choice: un grand roi
  rationale: Le second prédicat est coordonné au premier; la répétition de « grand » restitue le parallélisme avec naturel.
- source_word: עַל
  choice: au-dessus de
  rationale: Dans ce contexte comparatif, exprime nettement la suprématie de Yahweh.
- source_word: כָּל אֱלֹהִים
  choice: tous les dieux
  rationale: Conserve le sens direct et la tension du pluriel אֱלֹהִים sans décider si les référents sont des idoles, de faux dieux ou des êtres spirituels.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte le tétragramme; « Yahweh » préserve le nom personnel plutôt que de lui substituer un titre.
- issue: Sens de אֱלֹהִים dans l’expression de suprématie
  choice: dieux
  alternative: êtres divins; êtres célestes
  rationale: « Dieux » préserve la formulation et la tension théologique de l’hébreu sans préciser indûment la nature des référents.
translation_notes:
  register: Français international moderne, sobre et digne. La structure brève et le parallélisme sont conservés; « roi » reste en minuscule conformément à l’usage français courant.
