  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: fr
  text: Venez, prosternons-nous et courbons-nous ; agenouillons-nous devant Yahweh, notre créateur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּאוּ
  choice: Venez
  rationale: L’impératif pluriel ouvre une invitation collective. « Venez » est naturel en français et convient au ton liturgique.
- source_word: נִשְׁתַּחֲוֶה
  choice: prosternons-nous
  rationale: Le verbe désigne le fait de se courber profondément ou de se prosterner, souvent comme acte d’adoration. « Prosternons-nous » conserve ici le geste corporel et sa portée cultuelle.
- source_word: וְנִכְרָעָה
  choice: et inclinons-nous
  rationale: Le verbe exprime l’abaissement du corps, le fait de se courber. Cette formulation le distingue du verbe suivant tout en préservant l’enchaînement des gestes d’humilité.
- source_word: נִבְרְכָה
  choice: mettons-nous à genoux
  rationale: La forme nifal de ברך signifie ici « s’agenouiller », et non « bénir », sens normalement porté par une autre conjugaison du verbe. Le parallélisme des postures confirme cette lecture.
- source_word: לִפְנֵי
  choice: devant
  rationale: Équivalent français direct et idiomatique, exprimant la présence de Yahweh devant qui l’assemblée s’agenouille.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu.
- source_word: עֹשֵׂנוּ
  choice: celui qui nous a faits
  rationale: Le participe avec suffixe de première personne du pluriel désigne littéralement « celui qui nous fait/a faits ». Cette tournure française naturelle conserve le lien verbal direct entre le Créateur et son peuple.
theological_decisions:
- issue: Sens de נִבְרְכָה dans ce contexte
  choice: mettons-nous à genoux
  alternative: bénissons / célébrons
  rationale: Bien que la racine ברך puisse signifier « bénir » au piel, la forme nifal employée ici exprime l’agenouillement. Traduire par « bénissons » effacerait la distinction morphologique et romprait la série cohérente de gestes corporels.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte source emploie le nom divin lui-même, non un titre. « Yahweh » préserve cette donnée sans lui substituer une désignation traditionnelle.
translation_notes:
  register: Français international moderne, digne et liturgique. Les cohortatifs hébreux sont rendus par des impératifs à la première personne du pluriel. La succession « prosternons-nous », « inclinons-nous », « mettons-nous à genoux » maintient l’accumulation poétique des postures sans les confondre.
