  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ מֶחְקְרֵי אָ֑רֶץ וְ/תוֹעֲפ֖וֹת הָרִ֣ים לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/004.yaml
  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: fr
  text: Dans sa main sont les profondeurs de la terre[a], et les hauteurs des montagnes sont à lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les lieux profonds de la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les sommets des montagnes lui appartiennent ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: Dans sa main
  rationale: La tournure conserve l’image concrète de la main, qui exprime ici la possession et la souveraineté. Le relatif hébreu rattache ce verset au précédent ; en français, la proposition peut naturellement commencer ainsi tout en gardant ce lien dans le contexte.
- source_word: מֶחְקְרֵי
  choice: les profondeurs
  rationale: Le terme désigne des lieux difficiles à sonder ou inaccessibles. « Profondeurs » rend clairement cette idée et forme un contraste poétique naturel avec les hauteurs des montagnes.
- source_word: אָרֶץ
  choice: de la terre
  rationale: Dans ce contexte cosmique, « terre » convient mieux que « pays » et exprime l’étendue de la souveraineté divine sur la création.
- source_word: וְתוֹעֲפוֹת
  choice: et les hauteurs
  rationale: Le mot évoque des élévations ou des sommets. « Hauteurs » préserve le parallélisme avec « profondeurs » sans préciser excessivement l’image.
- source_word: הָרִים
  choice: des montagnes
  rationale: Cette expression naturelle en français garde la portée générale de l’hébreu.
- source_word: לוֹ
  choice: sont à lui
  rationale: Cette formulation brève conserve l’accent hébreu sur l’appartenance et le parallélisme poétique.
theological_decisions:
- issue: Portée de la souveraineté divine dans l’image de la création
  choice: 'Une affirmation cosmique : les profondeurs de la terre comme les hauteurs des montagnes appartiennent au Seigneur.'
  alternative: Une description plus locale du pays d’Israël et de son relief.
  rationale: L’appel universel à l’adoration dans le psaume et le contraste entre profondeurs et hauteurs indiquent que le verset célèbre la souveraineté du Seigneur sur toute la création.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe concise maintient l’image de la main ainsi que le contraste vertical entre les profondeurs et les hauteurs.
