source:
  edition: WLC
  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: fr
  text: Venez, chantons avec joie à Yahweh[a] ; acclamons le rocher de notre salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Yahweh ». Le nom divin יהוה est traditionnellement rendu par « le Seigneur » ou « l’Éternel ».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Venez
  rationale: L’impératif pluriel de הלך sert ici d’invitation pressante. « Venez » en restitue naturellement la valeur exhortative en français.
- source_word: נְרַנְּנָה
  choice: chantons avec joie
  rationale: Le cohortatif de רנן exprime une louange vocale et jubilante. Cette formulation conserve à la fois le chant et l’allégresse.
- source_word: לַיהוָה
  choice: pour Yahweh
  rationale: La préposition désigne celui à qui s’adresse la louange. « Pour » est idiomatique avec « chanter » en français, tandis que « Yahweh » rend directement le nom divin.
- source_word: נָרִיעָה
  choice: acclamons
  rationale: Le cohortatif désigne un cri sonore, notamment dans la louange ou le triomphe. « Acclamons » exprime de façon concise et naturelle cette manifestation publique.
- source_word: לְצוּר
  choice: le rocher
  rationale: צוּר signifie littéralement « rocher » et constitue ici une métaphore divine de solidité, de protection et de force.
- source_word: יִשְׁעֵנוּ
  choice: de notre salut
  rationale: Le nom יֵשַׁע muni du suffixe de première personne du pluriel est conservé sous une forme nominale, sans réduire le sens à une seule délivrance particulière.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahweh » préserve le nom divin plutôt que de lui substituer un titre, tout en signalant en note l’usage traditionnel français.
translation_notes:
  register: Français international actuel, sobre et adapté à la récitation communautaire. Le parallélisme entre « chantons » et « acclamons » est maintenu, ainsi que la métaphore nominale du « rocher de notre salut ».
