  text: אֲשֶׁר נִשְׁבַּ֥עְתִּי בְ/אַפִּ֑/י אִם יְ֝בֹא֗וּ/ן אֶל מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/011.yaml
  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: fr
  text: 'C’est pourquoi, dans ma colère, j’ai juré : « Ils n’entreront pas[a] dans mon repos[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « s’ils entrent dans mon repos » ; il s’agit d’une formule de serment signifiant : « ils n’entreront pas dans mon repos ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « mon lieu de repos ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: C’est pourquoi
  rationale: Dans le contexte, le terme relie ce serment à la rébellion évoquée précédemment et en présente la conséquence. « C’est pourquoi » rend clairement ce lien en français actuel.
- source_word: נִשְׁבַּעְתִּי
  choice: j’ai juré
  rationale: Le niphal de שבע signifie couramment « jurer, prêter serment ». « J’ai juré » est direct, naturel et fidèle.
- source_word: בְאַפִּי
  choice: dans ma colère
  rationale: אַף désigne littéralement le nez, mais exprime idiomatiquement la colère. La traduction retient le sens de l’expression hébraïque plutôt que son image anatomique.
- source_word: אִם
  choice: ils n’entreront pas
  rationale: Après un verbe de serment, אִם introduit ici une formule elliptique qui équivaut à une forte négation. Le français doit expliciter cette valeur pour être intelligible.
- source_word: יְבֹאוּן אֶל
  choice: entreront dans
  rationale: Le verbe בוא suivi de אֶל exprime ici l’entrée dans un lieu ou un état. « Entrer dans » est l’équivalent français naturel.
- source_word: מְנוּחָתִי
  choice: mon repos
  rationale: מְנוּחָה peut désigner le repos ou le lieu où l’on se repose. « Mon repos » conserve la concision et l’ambiguïté féconde du texte sans réduire le sens à un lieu précis.
theological_decisions:
- issue: Formule de serment elliptique introduite par אִם
  choice: 'Expliciter la négation : « Ils n’entreront pas »'
  alternative: 'Traduire littéralement : « s’ils entrent dans mon repos »'
  rationale: Dans cette construction de serment, la proposition conditionnelle reste volontairement inachevée et exprime une négation solennelle. L’explicitation transmet sa valeur réelle en français sans ajouter une conclusion théologique étrangère au texte.
- issue: Portée de מְנוּחָה
  choice: mon repos
  alternative: mon lieu de repos
  rationale: Le mot peut évoquer à la fois l’état de repos et un lieu de repos. La formulation retenue préserve cette amplitude sémantique ainsi que la tension théologique du passage.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe solennelle du serment est conservée sans archaïsme ; « colère » est préféré à « courroux », et « mon repos » maintient l’ambiguïté du substantif hébreu.
