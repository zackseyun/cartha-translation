source:
  edition: WLC
  text: אֲשֶׁ֣ר נִ֭סּוּ/נִי אֲבוֹתֵי/כֶ֑ם בְּ֝חָנ֗וּ/נִי גַּם רָא֥וּ פָעֳלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/009.yaml
  text: where your fathers tested me and tried me[b][a], though they had seen my work.
translation:
  language: fr
  text: où vos pères m’ont mis à l’épreuve et m’ont éprouvé[a], bien qu’ils aient vu mon œuvre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « où vos pères m’ont mis à l’épreuve; ils m’ont éprouvé et ont aussi vu mon œuvre ». L’hébreu peut se comprendre de manière plus additive, tandis que le texte principal exprime le sens concessif probable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: où
  rationale: Le relatif renvoie naturellement au lieu évoqué au verset précédent; « où » conserve ce lien locatif.
- source_word: נִסּוּנִי
  choice: m’ont mis à l’épreuve
  rationale: Cette expression rend naturellement l’action consistant à soumettre Dieu à une épreuve, avec sa portée provocatrice.
- source_word: אֲבוֹתֵיכֶם
  choice: vos pères
  rationale: Rend littéralement le masculin hébreu et préserve la rhétorique d’alliance adressée à la communauté.
- source_word: בְּחָנוּנִי
  choice: m’ont éprouvé
  rationale: Maintient le parallélisme avec le premier verbe tout en évitant une répétition identique; le sens est celui de mettre Dieu à l’essai.
- source_word: גַּם
  choice: bien que
  rationale: 'Le contexte favorise une relation concessive: ils ont mis Dieu à l’épreuve malgré ce qu’ils avaient vu. Une note conserve la lecture additive plus littérale.'
- source_word: רָאוּ
  choice: ils aient vu
  rationale: Le subjonctif passé est requis après « bien que » et situe la vision de l’œuvre divine par rapport à leur mise à l’épreuve.
- source_word: פָעֳלִי
  choice: mon œuvre
  rationale: Le singulier collectif correspond au travail ou à l’action de Dieu, notamment à ses actes puissants dans le désert.
theological_decisions:
- issue: Valeur concessive de la proposition finale
  choice: bien qu’ils aient vu mon œuvre
  alternative: ils m’ont éprouvé et ils ont aussi vu mon œuvre
  rationale: גַּם signifie ordinairement « aussi » ou « même », mais le contexte permet une valeur concessive. Celle-ci exprime clairement qu’ils ont éprouvé Dieu malgré ses actes déjà observés, sans éliminer la lecture plus littérale, signalée en note.
- issue: Traduction de אֲבוֹתֵיכֶם
  choice: vos pères
  alternative: vos ancêtres
  rationale: Le texte hébreu emploie un nom masculin signifiant littéralement « vos pères »; cette formulation conserve la forme et la force rhétorique du texte.
translation_notes:
  register: Français moderne, digne et poétique. « Mettre à l’épreuve » et « éprouver » rendent les deux verbes parallèles sans lourdeur excessive; « mon œuvre » conserve le singulier collectif de l’hébreu.
