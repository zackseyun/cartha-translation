  text: אַרְבָּ֘עִ֤ים שָׁנָ֨ה אָ֘ק֤וּט בְּ/ד֗וֹר וָ/אֹמַ֗ר עַ֤ם תֹּעֵ֣י לֵבָ֣ב הֵ֑ם וְ֝/הֵ֗ם לֹא יָדְע֥וּ דְרָכָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: fr
  text: 'Pendant quarante ans, j’ai eu en horreur cette génération[a], et j’ai dit : « C’est un peuple dont le cœur s’égare ; ils n’ont pas connu mes voies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je me suis lassé de cette génération » ou « cette génération m’a affligé ». Le verbe hébreu peut exprimer l’aversion, la lassitude ou l’affliction.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Pendant quarante ans
  rationale: Cette formulation française exprime naturellement la durée placée en tête de la phrase hébraïque.
- source_word: אָקוּט
  choice: j’ai eu en horreur
  rationale: Le verbe קוט peut exprimer une forte aversion, la lassitude ou l’affliction. « Avoir en horreur » conserve ici la vigueur du jugement sans ajouter une catégorie doctrinale.
- source_word: בְּדוֹר
  choice: cette génération
  rationale: La préposition marque la personne ou le groupe envers lequel s’exerce cette réaction. « Cette génération » identifie naturellement, dans le contexte, la génération du désert.
- source_word: וָאֹמַר
  choice: et j’ai dit
  rationale: Le passé composé rend naturellement en français la succession narrative exprimée par la forme hébraïque.
- source_word: עַם תֹּעֵי לֵבָב
  choice: C’est un peuple dont le cœur s’égare
  rationale: Le participe indique une disposition persistante, tandis que לֵבָב désigne le centre intérieur de la volonté et de la pensée. La formulation conserve l’image de l’égarement du cœur.
- source_word: לֹא יָדְעוּ דְרָכָי
  choice: ils ne connaissent pas mes voies
  rationale: Le présent français exprime bien le constat durable qui résulte de leur conduite. « Voies » préserve la métaphore hébraïque des manières d’agir et des chemins de Dieu.
theological_decisions:
- issue: Intensité de l’attitude divine exprimée par קוט
  choice: 'Une forte aversion : « j’ai eu en horreur »'
  alternative: « j’ai été affligé par » ou « je me suis lassé de »
  rationale: Le champ sémantique permet aussi l’affliction ou la lassitude, mais le contexte de rébellion persistante autorise une expression forte. La note conserve l’ambiguïté lexicale réelle.
- issue: Portée temporelle de לֹא יָדְעוּ דְרָכָי
  choice: 'Un constat durable au présent : « ils ne connaissent pas mes voies »'
  alternative: 'Un constat passé : « ils n’ont pas connu mes voies »'
  rationale: La forme accomplie hébraïque peut désigner leur échec constaté, tandis que le contexte proverbial et accusatoire permet en français un présent caractérisant leur état. Le choix évite une tournure française moins naturelle tout en gardant l’idée d’un refus établi.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche de l’hébreu sans être calquée ; le parallélisme et la métaphore du cœur et des voies sont conservés.
