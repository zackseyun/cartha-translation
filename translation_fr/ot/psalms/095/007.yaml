  naturalness: La version révisée reste idiomatique en français international moderne tout en gardant le parallélisme pastoral et le ton élevé du psaume. « Le peuple de son pâturage, le troupeau que sa main conduit » est clair et naturel dans ce registre.
  terminology: « Dieu », « pâturage », « troupeau », « main » et « voix » préservent les images et termes essentiels. La note doit conserver l’alternative optative de אִם; « si seulement vous écoutiez sa voix ! » exprime plus naturellement en français un souhait que « puissiez-vous écouter ».
  issues:
