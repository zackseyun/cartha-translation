base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/007.yaml
  text: For he is our God[a], and we are the people of his pasture, and the sheep of his hand. Today, if you hear his voice—
translation:
  language: fr
  text: Car il est notre Dieu, et nous sommes le peuple de son pâturage, le troupeau que sa main conduit. Aujourd’hui, si vous écoutez sa voix[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aujourd’hui, si seulement vous écoutiez sa voix ! » La particule hébraïque peut introduire ici un souhait pressant plutôt qu’une simple condition.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’appel à l’adoration qui précède.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Rend directement le nom avec son suffixe possessif.
- source_word: עַם מַרְעִיתוֹ
  choice: le peuple dont il prend soin comme un berger
  rationale: Le nom מַרְעִית peut désigner le pâturage ou l’action pastorale. Cette formulation naturelle conserve explicitement l’image du berger.
- source_word: צֹאן יָדוֹ
  choice: le troupeau qu’il conduit de sa main
  rationale: Rend l’image littérale du troupeau et de la main tout en exprimant naturellement la direction et la protection suggérées par la construction.
- source_word: הַיּוֹם
  choice: Aujourd’hui
  rationale: Conserve le pivot rhétorique qui ouvre l’exhortation développée au verset suivant.
- source_word: אִם
  choice: si
  rationale: Préserve la lecture conditionnelle la plus directe, sans exclure la nuance optative signalée en note.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: vous écoutez sa voix
  rationale: « Écouter » rend ici שׁמע plus naturellement que le simple fait d’entendre et laisse au contexte l’implication d’obéissance.
theological_decisions:
- issue: Valeur de הַיּוֹם אִם בְּקֹלוֹ תִשְׁמָעוּ
  choice: « Aujourd’hui, si vous écoutez sa voix… »
  alternative: « Aujourd’hui, puissiez-vous écouter sa voix ! »
  rationale: אִם introduit naturellement la condition liée à l’interdiction du verset suivant, mais peut aussi prendre dans ce contexte poétique une force de souhait ou d’exhortation. La note maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. L’image pastorale est explicitée sans vocabulaire confessionnel spécialisé; la suspension finale marque que la phrase se poursuit au verset suivant.
