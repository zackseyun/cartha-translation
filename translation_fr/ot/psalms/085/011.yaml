  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: fr
  text: La vérité germera de la terre[a], et la justice[b] regardera du haut des cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La fidélité germera de la terre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: la vérité
  rationale: Le nom peut désigner la vérité, la fidélité ou la fiabilité. « La vérité » nomme naturellement la qualité abstraite mise en parallèle avec la justice, tandis que « la fidélité » reste une possibilité réelle signalée en note.
- source_word: מֵאֶרֶץ
  choice: de la terre
  rationale: אֶרֶץ peut désigner la terre ou le pays. L’opposition verticale avec « des cieux » favorise ici « la terre ».
- source_word: תִּצְמָח
  choice: germera
  rationale: Le verbe évoque la pousse d’une plante. « Germera » conserve cette image agricole avec concision et naturel en français poétique.
- source_word: צֶדֶק
  choice: la justice
  rationale: צֶדֶק recouvre la justice, la droiture et la conformité à ce qui est juste. « La justice » est ici naturel pour cette qualité personnifiée, sans exclure la nuance de droiture préservée en note.
- source_word: מִשָּׁמַיִם
  choice: du haut des cieux
  rationale: Le pluriel « les cieux » conserve la forme hébraïque et, avec « du haut », rend explicite le mouvement du regard depuis le domaine céleste vers la terre.
- source_word: נִשְׁקָף
  choice: regardera du haut
  rationale: Le nifal de שׁקף exprime le fait de regarder depuis un point élevé ou à travers une ouverture. Cette formulation préserve la direction et la personnification de la justice.
theological_decisions:
- issue: Sens de צֶדֶק dans le parallèle poétique
  choice: la justice
  alternative: la droiture
  rationale: Le terme hébreu peut désigner tant la justice que la droiture morale. Le texte principal retient l’expression française la plus naturelle pour une qualité agissante, et la note maintient l’autre nuance sans trancher abusivement.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure en deux membres et le contraste terre–cieux sont conservés; les deux qualités abstraites restent personnifiées.
