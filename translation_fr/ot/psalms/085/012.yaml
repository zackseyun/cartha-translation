id: PSA.85.12
reference: Psalms 85:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: fr
  text: Oui, Yahweh donnera ce qui est bon[a], et notre terre donnera sa récolte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bien » ou « de bonnes choses ». L’expression hébraïque est large et peut englober ici tant le bien moral que les biens matériels.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Oui
  rationale: Dans ce contexte poétique, גַּם renforce l’assurance exprimée plutôt qu’il ne marque une simple addition. « Oui » rend naturellement cette valeur emphatique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par le nom divin « Yahweh », conformément à sa fonction de nom propre dans le texte hébreu.
- source_word: יִתֵּן
  choice: donnera
  rationale: L’imparfait hébreu a ici une valeur future dans la suite des promesses du psaume.
- source_word: הַטּוֹב
  choice: ce qui est bon
  rationale: Cette formulation conserve l’étendue de l’expression hébraïque, qui peut désigner le bien de manière générale ou des biens concrets, sans la limiter aux seules bénédictions matérielles.
- source_word: וְאַרְצֵנוּ
  choice: et notre terre
  rationale: Dans le contexte agricole, אֶרֶץ désigne la terre appartenant au peuple; « notre terre » est clair et naturel.
- source_word: תִּתֵּן
  choice: donnera
  rationale: La répétition du verbe « donner » préserve le parallélisme hébreu entre l’action de Yahweh et celle de la terre, tout en restant idiomatique en français.
- source_word: יְבוּלָהּ
  choice: sa récolte
  rationale: יְבוּל désigne le produit ou rendement de la terre. « Sa récolte » exprime clairement l’image agricole dans un français courant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme comme nom propre. « Yahweh » le préserve au lieu de lui substituer un titre.
- issue: Portée de הַטּוֹב
  choice: ce qui est bon
  alternative: le bien / de bonnes choses
  rationale: L’expression hébraïque demeure large et peut inclure le bien matériel aussi bien que le bien dans un sens plus général; la traduction n’enferme donc pas le verset dans une seule lecture.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme du verbe נתן est conservé par la répétition de « donnera »; l’emphase initiale est rendue par « Oui ».
