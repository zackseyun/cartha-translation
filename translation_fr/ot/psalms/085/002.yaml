  text: נָ֭שָׂאתָ עֲוֺ֣ן עַמֶּ֑/ךָ כִּסִּ֖יתָ כָל חַטָּאתָ֣/ם סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/002.yaml
  text: You forgave the iniquity of your people[a]; you covered all their sin[b]. Selah
translation:
  language: fr
  text: Tu as pardonné la faute de ton peuple[a] ; tu as couvert tout son péché[b]. Sélah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Tu as porté » ou « Tu as emporté la faute de ton peuple. » L’expression hébraïque évoque le pardon par l’image d’une faute que l’on soulève ou emporte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tous leurs péchés ». L’hébreu emploie un nom singulier avec un suffixe pluriel ; on peut le comprendre collectivement (« son péché », celui du peuple) ou distributivement (« leurs péchés »).'
    reason: alternative_reading
lexical_decisions:
- source_word: נָשָׂאתָ
  choice: tu as pardonné
  rationale: Le verbe signifie littéralement « lever, porter, emporter », mais avec עָוֹן il forme ici une expression idiomatique désignant le pardon ou l’enlèvement de la faute. « Pardonné » en communique clairement le sens en français actuel, tandis que la note conserve l’image hébraïque.
- source_word: עֲוֺן
  choice: la faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. Dans cette expression de pardon, « faute » garde la portée morale du terme sans suggérer trop étroitement le seul sentiment de culpabilité.
- source_word: עַמֶּךָ
  choice: ton peuple
  rationale: עַם désigne naturellement le peuple dans ce contexte collectif et relationnel.
- source_word: כִּסִּיתָ
  choice: tu as couvert
  rationale: La traduction littérale préserve l’image poétique de la faute recouverte, image qui exprime ici le pardon sans l’expliciter davantage.
- source_word: כָל
  choice: tout
  rationale: כָל signifie « tout » ou « chaque » ; devant le singulier collectif, « tout » est la formulation française naturelle.
- source_word: חַטָּאתָם
  choice: son péché
  rationale: Le nom est au singulier avec un suffixe pluriel et désigne collectivement le péché du peuple. En français, « son » s’accorde grammaticalement avec l’antécédent singulier « peuple » ; la note signale la possibilité distributive « tous leurs péchés ».
- source_word: סֶלָה
  choice: Sélah
  rationale: Le sens précis du terme est incertain ; sa translittération évite d’imposer une interprétation telle que « pause » ou « interlude ».
theological_decisions:
- issue: Traduction de l’expression נָשָׂא עָוֹן
  choice: Tu as pardonné la faute de ton peuple
  alternative: Tu as porté la faute de ton peuple ; tu as emporté la culpabilité de ton peuple
  rationale: Dans ce contexte, l’expression hébraïque indique le pardon et l’enlèvement de la faute. Le texte principal donne ce sens idiomatique en français naturel, tandis que la note préserve l’image sous-jacente sans déterminer plus précisément son mécanisme théologique.
- issue: Singulier collectif ou pluriel pour חַטָּאתָם
  choice: tout son péché
  alternative: tous leurs péchés
  rationale: Le singulier collectif respecte la forme hébraïque et le parallélisme poétique. Le pluriel distributif reste une traduction légitime et figure donc en note.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement convient à l’adresse directe à Dieu dans le psautier. « Sélah » est conservé comme terme translittéré traditionnel, avec accent français.
