source:
  edition: WLC
  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: fr
  text: Yahweh, tu as été favorable à ta terre ; tu as changé le sort de Jacob[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu as ramené les captifs de Jacob » ou « tu as mis fin à la captivité de Jacob ». L’expression hébraïque peut désigner le retour d’exil ou, plus largement, un renversement favorable de la situation.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: tu as accordé ta faveur
  rationale: Le qal de רצה exprime ici la bienveillance ou la faveur. Cette formulation est naturelle en français actuel et garde Dieu comme auteur du bienfait.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: אַרְצֶךָ
  choice: ton pays
  rationale: אֶרֶץ désigne ici le territoire appartenant à Yahweh dans sa relation avec son peuple. « Pays » est naturel en français et ne suppose pas nécessairement un État moderne.
- source_word: שַׁבְתָּ
  choice: tu as rétabli
  rationale: Avec שְׁבוּת, שוב forme une expression de restauration ou de retournement favorable de la situation.
- source_word: שבות
  choice: la situation
  rationale: Dans l’expression שׁוּב שְׁבוּת, le nom peut évoquer une restauration générale aussi bien qu’un retour de captivité. « Rétabli la situation » rend le sens idiomatique sans le limiter à l’exil.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom poétique et collectif du peuple est conservé tel quel plutôt que remplacé par « Israël ».
theological_decisions:
- issue: Sens de l’expression שׁוּב שְׁבוּת יַעֲקֹב
  choice: tu as rétabli la situation de Jacob
  alternative: tu as ramené les captifs de Jacob / tu as mis fin à la captivité de Jacob
  rationale: L’expression peut désigner un renversement favorable de la situation en général ou, plus précisément, le retour d’exil. Le texte principal conserve le sens large, tandis que la note maintient la lecture liée à la captivité.
translation_notes:
  register: Français moderne, sobre et poétique. Le tutoiement convient à l’adresse directe à Dieu dans le psaume. La ponctuation garde l’invocation « Yahweh » intégrée naturellement à la phrase.
