source:
  edition: WLC
  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: fr
  text: J’écouterai ce que dira Dieu, Yahweh, car il parlera de paix à son peuple et à ses fidèles[a] ; mais qu’ils ne retournent pas à la folie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui lui sont attachés » ou « à ses saints ».
    reason: lexical_alternative
  - marker: b
    text: Ou « et qu’ils ne retournent pas à la folie ». Une interprétation moins probable donne au dernier mot le sens de « confiance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: J’écouterai
  rationale: Le cohortatif exprime ici la résolution ou l’intention du psalmiste. « J’écouterai » rend cette détermination dans un français naturel.
- source_word: מַה יְדַבֵּר
  choice: ce que dira
  rationale: L’imparfait hébreu vise la parole que Dieu va prononcer. En français, « dira » est plus idiomatique que « parlera » dans cette proposition, tout en conservant l’orientation vers l’avenir.
- source_word: הָאֵל יְהוָה
  choice: Dieu, Yahweh
  rationale: Cette formulation conserve à la fois אֵל, « Dieu », et le nom divin יהוה, sans les fondre en un seul titre.
- source_word: כִּי יְדַבֵּר שָׁלוֹם
  choice: car il parlera de paix
  rationale: '« Car » marque le motif de l’écoute, tandis que « parlera de paix » préserve l’image hébraïque et la portée large de שָׁלוֹם : paix, bien-être et harmonie restaurée.'
- source_word: עַמּוֹ
  choice: son peuple
  rationale: Traduction directe et naturelle du nom collectif avec suffixe possessif.
- source_word: חֲסִידָיו
  choice: ses fidèles
  rationale: Le terme désigne ceux qui se caractérisent par leur attachement loyal et pieux envers Dieu. « Fidèles » est actuel et évite de donner à « saints » un sens ecclésiastique technique.
- source_word: וְאַל יָשׁוּבוּ
  choice: mais qu’ils ne retournent pas
  rationale: אַל suivi de l’imparfait a une force prohibitive ou jussive. « Mais » fait ressortir le contraste entre la paix annoncée et l’avertissement qui suit.
- source_word: לְכִסְלָה
  choice: à la folie
  rationale: Le nom désigne normalement la folie ou la conduite insensée. Cette lecture convient à l’avertissement contre une rechute, même si une interprétation minoritaire propose « confiance ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom divin et le distingue du titre « Dieu » qui le précède.
- issue: Sens de חֲסִידָיו
  choice: ses fidèles
  alternative: ses saints ; ceux qui lui sont attachés
  rationale: « Fidèles » conserve la dimension relationnelle, éthique et liée à la loyauté envers Dieu, sans imposer une définition confessionnelle ultérieure de la sainteté.
- issue: Force de la proposition finale
  choice: 'une exhortation : « mais qu’ils ne retournent pas à la folie »'
  alternative: 'une affirmation : « et ils ne retourneront pas à la folie »'
  rationale: 'La construction אַל avec l’imparfait favorise nettement l’interdiction ou l’exhortation. Elle maintient la tension du verset : Dieu annonce la paix, mais son peuple ne doit pas retomber dans une conduite insensée.'
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression du texte hébreu et sa tension entre promesse de paix et avertissement. La ponctuation autour de « Dieu, Yahweh » maintient les deux désignations sans produire le tour peu naturel « le Dieu Yahweh ».
