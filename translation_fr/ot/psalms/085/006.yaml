source:
  edition: WLC
  text: הֲֽ/לֹא אַ֭תָּה תָּשׁ֣וּב תְּחַיֵּ֑/נוּ וְ֝/עַמְּ/ךָ֗ יִשְׂמְחוּ בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: fr
  text: Ne reviendras-tu pas[a] nous rendre la vie[b], afin que ton peuple se réjouisse en toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne te tourneras-tu pas de nouveau ». Le verbe hébreu peut désigner un retour ou un changement de direction ; ici, il évoque probablement le fait que Dieu se tourne de nouveau avec faveur vers son peuple.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous faire vivre de nouveau » ou « nous ranimer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Ne… pas ?
  rationale: Cette tournure conserve la question rhétorique, qui exprime ici une attente confiante d’une réponse positive.
- source_word: תָּשׁוּב
  choice: reviendras-tu
  rationale: Le verbe שׁוב signifie couramment « revenir » ou « retourner ». « Reviendras-tu » préserve l’image sans préciser explicitement que Dieu revient vers son peuple ou lui accorde de nouveau sa faveur.
- source_word: תְּחַיֵּנוּ
  choice: nous rendre la vie
  rationale: La forme intensive causative de חיה signifie « faire vivre » ou « redonner la vie ». Cette expression naturelle garde ouverte la portée physique, spirituelle et communautaire de la restauration demandée.
- source_word: וְעַמְּךָ
  choice: afin que ton peuple
  rationale: Dans ce contexte, la conjonction introduit naturellement le résultat ou le but de la demande. « Ton peuple » conserve le langage relationnel et collectif du texte.
- source_word: יִשְׂמְחוּ
  choice: se réjouisse
  rationale: L’imparfait hébreu, dans cette proposition liée à la demande, exprime le résultat espéré. Le subjonctif français convient au ton de prière.
- source_word: בָךְ
  choice: en toi
  rationale: Avec le verbe « se réjouir », la préposition ב désigne ici l’objet ou la sphère de la joie. « En toi » garde Dieu lui-même au centre de cette joie.
theological_decisions:
- issue: Faut-il expliciter que Dieu revient vers son peuple avec faveur ?
  choice: Le texte principal garde simplement « reviendras-tu »
  alternative: « reviendras-tu vers nous » ou « nous accorderas-tu de nouveau ta faveur »
  rationale: L’idée d’un retour favorable de Dieu est probable dans le contexte, mais ni « vers nous » ni « faveur » ne sont explicitement exprimés en hébreu. La traduction préserve donc l’image et son ouverture.
- issue: La vie rendue désigne-t-elle uniquement un renouveau spirituel ?
  choice: « nous rendre la vie » sans en restreindre le sens
  alternative: « nous renouveler spirituellement » ou « restaurer notre vie nationale »
  rationale: La prière concerne la restauration collective après le jugement, mais l’expression hébraïque reste large. La traduction ne la réduit donc ni au domaine spirituel ni au domaine politique.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est conservée, de même que l’ambiguïté du « retour » de Dieu et l’ampleur de la restauration exprimée par « rendre la vie ».
