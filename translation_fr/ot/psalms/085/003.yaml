source:
  edition: WLC
  text: אָסַ֥פְתָּ כָל עֶבְרָתֶ֑/ךָ הֱ֝שִׁיב֗וֹתָ מֵ/חֲר֥וֹן אַפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/003.yaml
  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: fr
  text: Tu as retiré toute ta fureur ; tu t’es détourné de l’ardeur de ta colère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu as retiré toute ta fureur ; tu as fait reculer l’ardeur de ta colère. »'
    reason: Alternative de rendu pour le hiphil de שוב, qui évoque l’idée de faire revenir ou de détourner, sans imposer une interprétation doctrinale.
lexical_decisions:
- source_word: אָסַפְתָּ
  choice: tu as retiré
  rationale: Dans ce contexte, אסף exprime le retrait ou l’enlèvement de la fureur. « Retiré » est naturel en français et convient mieux ici que le calque concret « rassemblé ».
- source_word: כָל
  choice: toute
  rationale: Le quantificateur souligne le caractère complet du retrait.
- source_word: עֶבְרָתֶךָ
  choice: ta fureur
  rationale: עֶבְרָה désigne une colère intense. « Fureur » conserve cette force et distingue le terme de אַף dans le second membre.
- source_word: הֱשִׁיבוֹתָ
  choice: tu es revenu de
  rationale: Le hiphil de שוב avec מִן peut exprimer le fait de revenir ou de se détourner de quelque chose. Cette formulation conserve l’image verbale hébraïque sans introduire l’idée plus interprétative de repentir.
- source_word: מֵחֲרוֹן
  choice: de l’ardeur
  rationale: חָרוֹן évoque une chaleur brûlante et intensifie la colère. « Ardeur » préserve la métaphore thermique dans une expression française digne et intelligible.
- source_word: אַפֶּךָ
  choice: de ta colère
  rationale: אַף signifie littéralement « nez », puis, par métonymie, « colère ». Le sens figuré est requis ici, tandis que l’image de chaleur demeure portée par « ardeur ».
theological_decisions:
- issue: Langage anthropomorphique décrivant la colère divine
  choice: Conserver la métaphore thermique dans « l’ardeur de ta colère » et rendre שוב sans parler de repentir.
  alternative: tu t’es détourné de ta colère ardente
  rationale: L’hébreu présente la colère divine avec une image vive de chaleur. La traduction ne l’atténue pas, mais évite aussi d’ajouter une notion théologique de repentir absente du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme est maintenu, ainsi que la distinction entre עֶבְרָה (« fureur ») et אַף (« colère »).
