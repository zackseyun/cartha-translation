- source_word: לַמְנַצֵּחַ
  choice: Au chef de chœur
  rationale: Dans les titres des psaumes, le terme désigne conventionnellement le responsable de l’exécution musicale. « Chef de chœur » est clair et courant en français; la préposition ל est rendue par « au ».
- source_word: לִבְנֵי
  choice: Des fils de
  rationale: La préposition ל peut exprimer l’appartenance, l’association, la destination ou l’attribution. « Des fils de » reste naturel tout en évitant de trancher entièrement entre ces nuances.
- source_word: קֹרַח
  choice: Coré
  rationale: La forme française traditionnelle et largement reconnue du nom biblique est retenue.
- source_word: מִזְמוֹר
  choice: Psaume
  rationale: מִזְמוֹר est le terme générique habituel pour un psaume, probablement associé à un accompagnement musical. Dans un titre français, « Psaume » convient sans article.
