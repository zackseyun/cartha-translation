  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: fr
  text: L’amour fidèle et la vérité se sont rencontrés[a] ; la justice[b] et la paix se sont embrassées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité » pour « la vérité » (אֱמֶת).
    reason: lexical_alternative
  - marker: b
    text: Ou « la droiture » pour « la justice » (צֶדֶק).
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: amour fidèle
  rationale: Cette expression française naturelle rend la loyauté durable et relationnelle de חֶסֶד sans la réduire à la seule miséricorde.
- source_word: אֱמֶת
  choice: vérité
  rationale: אֱמֶת peut désigner la vérité, la fidélité ou la fiabilité. « Vérité » préserve ici l’ampleur sémantique du terme ; « fidélité » reste possible et figure en note.
- source_word: נִפְגָּשׁוּ
  choice: se sont rencontrés
  rationale: Le niphal parfait pluriel de פגש décrit une rencontre. Le passé composé convient au caractère accompli de la scène poétique et conserve la personnification.
- source_word: צֶדֶק
  choice: justice
  rationale: צֶדֶק recouvre la justice et la droiture. Dans le français contemporain, « justice » est clair et naturel pour cette qualité morale personnifiée ; « droiture » est signalé comme possibilité.
- source_word: שָׁלוֹם
  choice: paix
  rationale: « Paix » est le rendu français le plus reconnaissable de שָׁלוֹם dans ce contexte, tout en laissant résonner ses nuances de bien-être et d’intégrité.
- source_word: נָשָׁקוּ
  choice: se sont embrassées
  rationale: Le verbe נשק signifie « embrasser/donner un baiser ». « Se sont embrassées » conserve l’image réciproque de la personnification et sonne avec dignité en français moderne.
theological_decisions:
- issue: Personnification des qualités relationnelles et morales
  choice: Conserver littéralement la rencontre et l’embrassement des qualités personnifiées.
  alternative: Paraphraser par « s’accordent harmonieusement » ou « sont réconciliées ».
  rationale: L’hébreu présente ces qualités comme des agents. Maintenir cette image préserve la poésie et la tension théologique sans imposer une synthèse doctrinale explicite.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu et la personnification sont conservés ; l’accord grammatical suit les noms français.
