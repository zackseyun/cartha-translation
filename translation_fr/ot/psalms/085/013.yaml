  text: La justice marchera devant lui et fera de ses pas un chemin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק
  choice: la justice
  rationale: Correspondance naturelle et directe qui conserve ici la personnification du texte hébreu.
- source_word: לְפָנָיו יְהַלֵּךְ
  choice: marchera devant lui
  rationale: Rend littéralement le mouvement de la justice précédant Dieu, sans expliciter davantage le référent du pronom.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: et préparera le chemin pour ses pas
  rationale: Le syntagme hébreu est difficile, mais évoque l'établissement ou la disposition d'un chemin en vue de ses pas. « Préparera » produit un français naturel tout en conservant l'image.
theological_decisions:
- issue: Référent du pronom masculin singulier « lui / ses »
  choice: Conserver les pronoms sans nommer Dieu
  alternative: Remplacer les pronoms par « Dieu » ou « le Seigneur »
  rationale: Le contexte permet d'identifier le référent, mais le verset hébreu emploie des suffixes pronominaux; les expliciter supprimerait une caractéristique authentique du texte.
- issue: Sujet de וְיָשֵׂם
  choice: Comprendre « la justice » comme sujet continu
  alternative: Comprendre Dieu comme sujet implicite
  rationale: La continuité syntaxique favorise le maintien du sujet « la justice », même si la formulation hébraïque demeure condensée.
translation_notes:
  register: Français moderne, clair et digne. La personnification de la justice et l'ambiguïté pronominale sont conservées; la dernière proposition est formulée idiomatiquement sans imposer une lecture confessionnelle.
