  text: הַרְאֵ֣/נוּ יְהוָ֣ה חַסְדֶּ֑/ךָ וְ֝/יֶשְׁעֲ/ךָ֗ תִּתֶּן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: fr
  text: Fais-nous voir, Yahweh, ton amour fidèle, et donne-nous ton salut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: Fais-nous voir
  rationale: Le hiphil impératif de ראה avec suffixe de première personne du pluriel signifie littéralement « fais-nous voir ». Cette formulation reste naturelle en français et conserve la valeur causative du verbe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: חַסְדֶּךָ
  choice: ton amour fidèle
  rationale: חסד désigne ici un amour loyal, constant et bienveillant. « Amour fidèle » exprime naturellement en français cette fidélité relationnelle sans réduire le terme à la seule miséricorde.
- source_word: וְיֶשְׁעֲךָ
  choice: et ton salut
  rationale: ישע peut désigner le salut ou la délivrance. « Salut » convient au registre de la prière et garde la portée large de l'intervention salvatrice de Dieu.
- source_word: תִּתֶּן לָנוּ
  choice: donne-nous
  rationale: נתן avec לָנוּ signifie directement « donne-nous ». L'impératif français coordonné à « fais-nous voir » rend clairement la demande et demeure digne et courant.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer silencieusement par un titre.
translation_notes:
  register: Prière concise, directe et digne. Le tutoiement correspond aux formes hébraïques de deuxième personne du singulier. « Fais-nous voir » conserve davantage la structure causative de l'hébreu que « montre-nous », tout en restant compréhensible en français moderne.
