source:
  edition: WLC
  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: fr
  text: Seras-tu en colère contre nous pour toujours ? Prolongeras-tu ta colère de génération en génération ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Étendras-tu ta colère ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: pour toujours
  rationale: L’interrogatif הַ joint à לְעוֹלָם forme ici une question rhétorique. « Pour toujours » est naturel en français et conserve la portée temporelle indéfinie.
- source_word: תֶּאֱנַף
  choice: seras-tu en colère
  rationale: Le verbe אנף exprime la colère. Cette formulation directe préserve l’image anthropopathique sans en renforcer ni en atténuer l’intensité.
- source_word: בָּנוּ
  choice: contre nous
  rationale: Avec אנף, la préposition ב marque l’objet de la colère. En français moderne, « en colère contre nous » est la construction idiomatique attendue.
- source_word: תִּמְשֹׁךְ
  choice: prolongeras-tu
  rationale: משך signifie littéralement « tirer, étendre ». Avec « colère », il exprime sa prolongation dans le temps ; « prolonger » restitue naturellement cet emploi.
- source_word: אַפְּךָ
  choice: ta colère
  rationale: אַף signifie littéralement « nez », puis, par métonymie, « colère ». Le sens idiomatique est explicite dans ce contexte.
- source_word: לְדֹר וָדֹר
  choice: de génération en génération
  rationale: Cette expression distributive désigne la succession des générations. La tournure française consacrée en conserve la continuité temporelle.
theological_decisions:
- issue: Langage anthropopathique concernant la colère divine
  choice: Conserver explicitement « colère »
  alternative: Employer « mécontentement » ou reformuler en termes d’opposition
  rationale: L’hébreu nomme directement la colère de Dieu. La conserver respecte la tension théologique et la force de la lamentation sans l’atténuer.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme des deux questions est préservé. « Contre nous » est idiomatique en français et rend directement la valeur de בָּנוּ ; aucune note distincte n’est nécessaire à ce sujet.
