  text: שׁ֭וּבֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ וְ/הָפֵ֖ר כַּֽעַסְ/ךָ֣ עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: fr
  text: Rétablis-nous[a], Dieu de notre salut, et mets fin à ta colère contre nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Fais-nous revenir, Dieu de notre salut. » Le verbe hébreu signifie plus littéralement « faire revenir » ou « ramener ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: Rétablis-nous
  rationale: L’impératif hifil de שוב avec le suffixe de première personne du pluriel signifie littéralement « fais-nous revenir ». Dans le contexte du psaume, « Rétablis-nous » exprime naturellement la demande d’un retour à la faveur et au bien-être accordés par Dieu, sans exclure l’idée de retour présente dans l’hébreu.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Dieu de notre salut
  rationale: Cette traduction conserve la construction génitive de l’hébreu et souligne que le salut vient de Dieu. « Délivrance » serait également possible, mais « salut » convient au registre et à l’ampleur du contexte.
- source_word: וְהָפֵר
  choice: et mets fin à
  rationale: Le hifil impératif de פרר peut signifier « briser », « annuler » ou « faire cesser ». Avec la colère pour complément, « mets fin à » rend clairement et naturellement la demande de faire cesser cette colère.
- source_word: כַּעַסְךָ
  choice: ta colère
  rationale: Le nom désigne la colère, l’irritation ou le dépit. « Ta colère » est ici le choix français le plus direct et le plus naturel.
- source_word: עִמָּנוּ
  choice: contre nous
  rationale: La préposition signifie ordinairement « avec nous », mais, associée ici à la colère divine, elle indique la colère exercée ou maintenue à l’égard du peuple. « Contre nous » restitue ce rapport idiomatiquement en français.
theological_decisions:
- issue: La demande initiale désigne-t-elle surtout la conversion du peuple ou son rétablissement par Dieu ?
  choice: Rétablis-nous
  alternative: Fais-nous revenir
  rationale: Le contexte évoque le renouvellement de la faveur divine après la colère, ce qui appuie « Rétablis-nous ». La note maintient toutefois le sens verbal plus littéral et la tension concernant l’initiative divine dans le retour du peuple.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et poétique, avec un vocabulaire biblique accessible. Le tutoiement correspond à l’adresse directe à Dieu et à l’usage courant dans les traductions françaises contemporaines.
