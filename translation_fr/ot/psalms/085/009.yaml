id: PSA.85.9
reference: Psalms 85:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: fr
  text: Oui, son salut est proche de ceux qui le craignent, afin que la gloire demeure dans notre pays.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La gloire » peut désigner la présence manifeste de Dieu ou l’honneur rétabli dans le pays.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Oui
  rationale: Ici, la particule exprime une affirmation appuyée plutôt qu’une restriction. « Oui » rend naturellement cette insistance en français poétique.
- source_word: קָרוֹב
  choice: est proche de
  rationale: L’adjectif exprime la proximité; « être proche de » est la tournure française naturelle.
- source_word: לִירֵאָיו
  choice: ceux qui le craignent
  rationale: Cette formulation conserve le sens religieux et relationnel de ירא sans le réduire au simple respect.
- source_word: יִשְׁעוֹ
  choice: son salut
  rationale: « Salut » garde à la fois l’idée de délivrance et la portée théologique du nom hébreu, ainsi que le possessif.
- source_word: לִשְׁכֹּן
  choice: afin que … demeure
  rationale: L’infinitif avec ל peut marquer le but ou le résultat. « Afin que » exprime cette relation sans préciser davantage, tandis que « demeure » convient à la présence durable évoquée.
- source_word: כָּבוֹד
  choice: la gloire
  rationale: « Gloire » conserve la force poétique et l’ouverture du terme, qui peut évoquer la présence manifeste de Dieu ou l’honneur rétabli.
- source_word: בְּאַרְצֵנוּ
  choice: dans notre pays
  rationale: Dans ce contexte, אֶרֶץ désigne le territoire du peuple. « Notre pays » est clair et naturel en français international.
theological_decisions:
- issue: Référent de כָּבוֹד (« gloire »)
  choice: Le texte dit simplement « la gloire », sans en préciser le référent.
  alternative: La présence glorieuse de Dieu, ou l’honneur rendu au pays.
  rationale: L’hébreu reste évocateur et ouvert. La traduction préserve cette ambiguïté théologique au lieu de la résoudre.
translation_notes:
  register: Français moderne, digne et accessible. La formulation garde le parallélisme poétique et l’ambiguïté de « gloire ». « Pays » est préféré à « terre » pour éviter que le lecteur comprenne ici l’ensemble du monde.
