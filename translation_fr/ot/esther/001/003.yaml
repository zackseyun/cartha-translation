  text: בִּ/שְׁנַ֤ת שָׁלוֹשׁ֙ לְ/מָלְכ֔/וֹ עָשָׂ֣ה מִשְׁתֶּ֔ה לְ/כָל שָׂרָ֖י/ו וַ/עֲבָדָ֑י/ו חֵ֣יל פָּרַ֣ס וּ/מָדַ֗י הַֽ/פַּרְתְּמִ֛ים וְ/שָׂרֵ֥י הַ/מְּדִינ֖וֹת לְ/פָנָֽי/ו־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: fr
  text: La troisième année de son règne, il donna un banquet[a] à tous ses hauts fonctionnaires et serviteurs — l’armée de Perse et de Médie[b], les nobles[c] et les hauts fonctionnaires des provinces — devant lui[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne un festin marqué notamment par la consommation de vin et les réjouissances.
    reason: lexical_alternative
  - marker: b
    text: Ou « la puissance de Perse et de Médie »; le mot hébreu peut désigner une armée, des forces ou la puissance.
    reason: lexical_alternative
  - marker: c
    text: Le terme employé est un titre d’origine perse désignant de hauts dignitaires.
    reason: historical_context
  - marker: d
    text: C’est-à-dire en sa présence.
    reason: idiom_clarification
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: La troisième année de son règne
  rationale: Cette formulation française naturelle conserve précisément le repère chronologique et comprend מָלְכוֹ comme la période durant laquelle le roi exerce son pouvoir.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: il donna un banquet
  rationale: Avec מִשְׁתֶּה, עָשָׂה signifie idiomatiquement organiser ou donner un banquet. « Donner un banquet » convient au cadre royal et reste accessible.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: à tous ses hauts fonctionnaires et serviteurs
  rationale: שָׂרִים désigne ici des personnages investis d’autorité; « hauts fonctionnaires » exprime leur rang sans leur attribuer un titre trop précis. Dans ce contexte de cour, עֲבָדִים désigne les serviteurs ou agents du roi.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: l’armée de Perse et de Médie
  rationale: חֵיל peut désigner l’armée, les forces ou la puissance. « L’armée » rend directement le sens militaire probable, tandis qu’une note conserve l’autre possibilité lexicale.
- source_word: הַפַּרְתְּמִים
  choice: les nobles
  rationale: Ce terme d’origine perse désigne des dignitaires de haut rang; « nobles » est concis, clair et adapté au contexte de cour.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: et les hauts fonctionnaires des provinces
  rationale: Le choix reprend de façon cohérente le sens de שָׂרֵי sans préciser indûment qu’il s’agissait nécessairement de gouverneurs.
- source_word: לְפָנָיו
  choice: étaient devant lui
  rationale: La tournure explicite en français la présence des groupes énumérés auprès du roi tout en conservant l’image formelle de la cour contenue dans l’hébreu.
