revisions:
- from: Il envoya des lettres dans toutes les provinces du roi[a], à chaque province dans son écriture et à chaque peuple dans sa langue[b], pour que tout homme exerce l’autorité dans sa maison[c] et parle la langue de son peuple[d].
  to: Il envoya des lettres à toutes les provinces du roi[a], à chaque province selon son écriture et à chaque peuple selon sa langue[b], afin que tout homme exerce l’autorité dans sa maison[c] et parle la langue de son peuple[d].
  rationale: La révision remplace « dans » par « à » pour les destinataires des lettres et par « selon » pour l’adaptation aux écritures et aux langues, conformément aux prépositions et à la formule distributive de l’hébreu. Elle conserve le sens direct de la clause finale tout en reformulant sa note de manière plus prudente et plus étroitement liée au texte source.
