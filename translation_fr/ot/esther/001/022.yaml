  text: וַ/יִּשְׁלַ֤ח סְפָרִים֙ אֶל כָּל מְדִינ֣וֹת הַ/מֶּ֔לֶךְ אֶל מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/אֶל עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ לִ/הְי֤וֹת כָּל אִישׁ֙ שֹׂרֵ֣ר בְּ/בֵית֔/וֹ וּ/מְדַבֵּ֖ר כִּ/לְשׁ֥וֹן עַמּֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: fr
  text: Il envoya des lettres à toutes les provinces du roi[a], à chaque province selon son écriture et à chaque peuple selon sa langue[b], afin que tout homme exerce l’autorité dans sa maison[c] et parle la langue de son peuple[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à toutes les provinces royales ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu souligne que le décret fut envoyé à chaque province selon son écriture et à chaque peuple selon sa langue.
    reason: cultural_note
  - marker: c
    text: Ou « afin que tout mari exerce l’autorité dans sa maison ». L’hébreu dit « tout homme »; dans ce contexte, le décret concerne l’autorité au sein du foyer et du mariage.
    reason: lexical_alternative
  - marker: d
    text: L’hébreu dit littéralement « et parlant selon la langue de son peuple ». La portée précise de cette dernière clause inhabituelle est discutée; elle est couramment comprise comme exigeant que chaque homme parle la langue de son propre peuple.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: Il envoya des lettres
  rationale: Le wayyiqtol poursuit le récit au passé. Dans ce contexte administratif royal, סְפָרִים désigne des communications écrites officielles; « lettres » reste naturel et fidèle.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: toutes les provinces du roi
  rationale: Le groupe construit désigne les provinces relevant du royaume du roi. Cette formulation suit de près l’hébreu tout en étant idiomatique en français.
- source_word: אֶל מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: à chaque province dans son écriture
  rationale: La répétition du singulier a une valeur distributive. כְּתָב désigne ici le système d’écriture ou la graphie propre à chaque province; « écriture » est plus naturel que « alphabet » et n’en réduit pas indûment le sens.
- source_word: וְאֶל עַם וָעָם כִּלְשׁוֹנוֹ
  choice: et à chaque peuple dans sa langue
  rationale: La construction distributive vise chacun des groupes ethnolinguistiques de l’empire. « Peuple » et « langue » rendent directement עַם et לָשׁוֹן.
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר בְּבֵיתוֹ
  choice: pour que tout homme exerce l’autorité dans sa maison
  rationale: L’infinitif introduit le contenu ou le but du décret. Le participe שֹׂרֵר exprime l’exercice de la domination ou de l’autorité; la formulation choisie évite le caractère potentiellement statique de « soit maître ».
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: et parle la langue de son peuple
  rationale: Le participe coordonné poursuit le contenu du décret. La formulation française exprime le sens linguistique le plus direct tout en signalant en note l’incertitude d’interprétation de cette clause inhabituelle.
