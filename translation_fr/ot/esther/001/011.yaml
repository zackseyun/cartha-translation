  text: לְ֠/הָבִיא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ בְּ/כֶ֣תֶר מַלְכ֑וּת לְ/הַרְא֨וֹת הָֽ/עַמִּ֤ים וְ/הַ/שָּׂרִים֙ אֶת יָפְיָ֔/הּ כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: fr
  text: d’amener la reine Vashti devant le roi avec la couronne royale[a], afin de montrer aux peuples et aux hauts fonctionnaires sa beauté, car elle était belle à voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « portant la couronne royale ». La préposition hébraïque peut être rendue par « avec » ; « portant » explicite l’idée que Vashti devait paraître parée de la couronne.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: d’amener
  rationale: L’infinitif causatif de בוא exprime le fait de faire venir Vashti auprès du roi. « Amener » rend naturellement ce mouvement causé.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: la reine Vashti
  rationale: Cette formulation française naturelle conserve le nom propre et le titre royal en apposition.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: Rend directement l’idée de présence exprimée par לִפְנֵי, sans remplacer le titre par le nom du roi.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: avec la couronne royale
  rationale: « Avec » conserve la valeur circonstancielle assez ouverte de la préposition ב, sans expliciter dans le corps du texte que la reine la portait.
- source_word: לְהַרְאוֹת
  choice: afin de montrer
  rationale: Le hiphil de ראה signifie « faire voir, montrer » ; « afin de » exprime clairement la visée de l’ordre.
- source_word: הָעַמִּים
  choice: les peuples
  rationale: Le pluriel hébreu est conservé et convient au contexte d’un empire composé de nombreux peuples.
- source_word: וְהַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: שָׂרִים désigne ici les dignitaires ou responsables de haut rang ; cette expression moderne évite le sens dynastique que pourrait suggérer « princes ».
- source_word: יָפְיָהּ
  choice: sa beauté
  rationale: Rend directement le nom abstrait accompagné du suffixe féminin singulier.
- source_word: כִּי טוֹבַת מַרְאֶה הִיא
  choice: car elle était belle à voir
  rationale: Cette tournure française naturelle restitue l’explication et l’idiome hébreu littéralement proche de « bonne d’apparence ».
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le pluriel « peuples » et l’ambiguïté légère de « avec la couronne royale », tout en employant « hauts fonctionnaires » pour désigner naturellement les dignitaires de l’empire.
