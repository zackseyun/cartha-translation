id: EST.1.20
reference: Esther 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: fr
  text: Quand le décret[a] que le roi promulguera sera connu dans tout son royaume — car il est vaste —, toutes les femmes témoigneront du respect[b] à leur mari, du plus grand au plus petit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’édit ». Le terme hébreu désigne ici une proclamation royale officielle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « donneront de l’honneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: Quand … sera connu
  rationale: Le nifal de שׁמע exprime ici qu’une proclamation parvient à la connaissance du royaume. La tournure avec « quand » rend naturellement la circonstance qui précède le résultat annoncé.
- source_word: פִּתְגָם
  choice: décret
  rationale: Dans le cadre de la cour perse, le terme désigne une décision royale officielle. « Décret » est précis, actuel et solennel.
- source_word: אֲשֶׁר יַעֲשֶׂה
  choice: que le roi promulguera
  rationale: Littéralement, le roi « fera » le décret; en français administratif naturel, il le « promulguera ». Ce choix explicite l’acte officiel sans modifier son sens.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: dans tout son royaume
  rationale: Cette expression indique que la proclamation sera connue dans l’ensemble du territoire soumis au roi.
- source_word: כִּי רַבָּה הִיא
  choice: car il est vaste
  rationale: Le féminin singulier renvoie au royaume (מַלְכוּת, féminin en hébreu). « Vaste » rend ici l’idée d’étendue plutôt qu’une grandeur qualitative.
- source_word: וְכָל הַנָּשִׁים
  choice: toutes les femmes
  rationale: La traduction conserve le pluriel générique du texte; la mention de leur mari précise qu’il s’agit des femmes mariées dans ce contexte.
- source_word: יִתְּנוּ יְקָר
  choice: témoigneront du respect
  rationale: L’expression signifie littéralement « donneront de l’honneur ». « Témoigner du respect » en rend le sens idiomatique dans un français moderne et naturel.
- source_word: לְבַעְלֵיהֶן
  choice: à leur mari
  rationale: בעל peut désigner un maître ou un propriétaire, mais, dans ce contexte domestique, il désigne clairement le mari. Le singulier distributif français est naturel après « toutes les femmes ».
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: du plus grand au plus petit
  rationale: Cette formule englobe tous les rangs sociaux. Le superlatif français exprime naturellement cette totalité sans préciser davantage le critère de grandeur.
theological_decisions: []
