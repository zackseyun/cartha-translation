  terminology: « Banquet » rend bien מִשְׁתֶּה dans ce contexte, sans effacer entièrement sa possible connotation de boisson, signalée en note. « Citadelle », « cour », et « palais royal » sont des choix recevables. La note sur בִּיתַן conserve à juste titre les possibilités « pavillon » et « bâtiment ».
