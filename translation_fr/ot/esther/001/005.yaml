  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: fr
  text: Au terme de ces jours, le roi offrit à tous les gens qui se trouvaient dans la citadelle de Suse[a], du plus grand au plus petit[b], un banquet[c] de sept jours, dans la cour du jardin du palais royal[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Suse, la citadelle ».
    reason: lexical_alternative
  - marker: b
    text: Cette expression signifie que les personnes de tout rang étaient incluses.
    reason: idiom_clarification
  - marker: c
    text: Le mot hébreu désigne un festin, souvent associé à la consommation de vin.
    reason: lexical_clarification
  - marker: d
    text: Le terme peut aussi être rendu par « pavillon » ou « bâtiment ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: Au terme de ces jours
  rationale: La préposition בְּ avec l’infinitif construit de מלא exprime ici le moment où la période précédente arrive à son terme. Cette formulation française est naturelle et conserve le renvoi à « ces jours ».
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: offrit ... un banquet
  rationale: Avec מִשְׁתֶּה, le verbe עשה signifie idiomatiquement organiser ou donner un festin. « Offrit un banquet » convient au cadre royal sans traduire mécaniquement par « fit ».
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: à tous ceux qui se trouvaient
  rationale: Dans ce contexte, עָם désigne largement la population présente, tandis que le participe niphal de מצא indique les personnes qui se trouvaient sur place. La formulation évite de suggérer un groupe ethnique précis.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: à Suse, la citadelle
  rationale: בִּירָה désigne la citadelle ou l’acropole fortifiée. L’apposition reproduit la structure hébraïque tout en restant claire en français.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: du grand au petit
  rationale: La traduction garde l’idiome hébreu, qui inclut les personnes de tout rang, sans réduire son sens à une seule hiérarchie explicitée.
- source_word: שִׁבְעַת יָמִים
  choice: de sept jours
  rationale: Le complément indique directement la durée du banquet.
- source_word: בַּחֲצַר גִּנַּת
  choice: dans la cour du jardin
  rationale: La chaîne construite décrit une cour associée au jardin. La formulation conserve cette relation spatiale sans l’expliciter davantage.
- source_word: בִּיתַן הַמֶּלֶךְ
  choice: du palais royal
  rationale: בִּיתַן, emprunt d’origine perse, peut désigner un palais, un bâtiment ou un pavillon. « Palais » convient le mieux au cadre royal, tout en signalant l’incertitude en note.
