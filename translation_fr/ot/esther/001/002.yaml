  text: In those days[a], when King Ahasuerus sat on his royal throne, which was in Susa the citadel,
translation:
  language: fr
  text: En ces jours-là, lorsque le roi Assuérus était assis sur son trône royal, qui se trouvait à Suse[a], la citadelle,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre transcription : Shushan.'
    reason: Indique une translittération courante du nom hébreu שׁוּשַׁן derrière la forme française usuelle « Suse ».
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Formule narrative temporelle naturelle en français, qui conserve la valeur démonstrative de l’hébreu.
- source_word: כְּשֶׁבֶת
  choice: lorsque ... siégeait
  rationale: La préposition כ avec l’infinitif construit introduit ici une proposition temporelle. « Siégeait » convient au contexte royal et exprime l’occupation du trône sans lourdeur.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: le roi Assuérus
  rationale: Ordre idiomatique du titre et du nom en français ; « Assuérus » est la forme française biblique courante du nom.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: sur son trône royal
  rationale: Expression concise et naturelle pour « sur le trône de sa royauté/son royaume », tout en conservant le possessif du texte hébreu.
- source_word: אֲשֶׁר
  choice: qui se trouvait
  rationale: Rend explicitement la proposition relative rattachée au trône, sans supprimer la structure du texte source.
- source_word: בְּשׁוּשַׁן
  choice: à Suse
  rationale: « Suse » est la forme française moderne et usuelle du nom de lieu ; la préposition « à » est idiomatique avec un nom de ville.
- source_word: הַבִּירָה
  choice: la citadelle
  rationale: Le terme désigne ici le complexe royal fortifié ou la citadelle, sens plus précis que « capitale » et plus adapté que le seul « forteresse ».
