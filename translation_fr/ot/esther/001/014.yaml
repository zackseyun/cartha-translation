source:
  edition: WLC
  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: fr
  text: Les plus proches de lui étaient Karshena, Shétar, Admata, Tarsis, Mérès, Marsena et Memoukân, les sept hauts fonctionnaires de Perse et de Médie qui voyaient le visage du roi[a] et siégeaient au premier rang dans le royaume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voyaient le visage du roi ». Il s’agit d’une expression de cour désignant ceux qui avaient un accès direct auprès du roi.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « occupaient les plus hautes fonctions dans le royaume ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: Les plus proches de lui étaient
  rationale: Bien que קָרוֹב soit morphologiquement au singulier, l’expression introduit collectivement une liste de sept dignitaires. Le pluriel donne en français un sens naturel et fidèle au contexte.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Karshena, Shétar, Admata, Tarsis, Mérès, Marsena et Memoukân
  rationale: Les noms propres sont translittérés sous des formes lisibles en français, avec « Tarsis », forme française traditionnelle de תַרְשִׁישׁ.
- source_word: שִׁבְעַת שָׂרֵי
  choice: les sept hauts fonctionnaires
  rationale: שָׂרִים désigne ici des dignitaires de rang élevé. « Hauts fonctionnaires » exprime clairement leur fonction politique sans suggérer nécessairement des princes de sang.
- source_word: פָּרַס וּמָדַי
  choice: de Perse et de Médie
  rationale: Cette formulation conserve les noms géopolitiques des deux composantes de l’empire et suit l’usage français courant.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: qui voyaient le visage du roi
  rationale: La traduction garde l’image concrète de l’hébreu et son expression de cour, tandis que la note en explicite le sens institutionnel.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: et siégeaient au premier rang dans le royaume
  rationale: « Siégeaient au premier rang » conserve la métaphore de la place occupée tout en indiquant naturellement la prééminence de ces dignitaires dans l’administration royale.
