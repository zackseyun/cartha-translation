  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: fr
  text: '« Si le roi le juge bon[a], qu’un décret royal soit promulgué de sa part et inscrit dans les lois de Perse et de Médie, afin qu’il ne puisse être révoqué[b] : Vashti ne devra pas se présenter devant le roi Assuérus, et le roi donnera sa dignité royale[c] à une autre femme, meilleure qu’elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « S’il plaît au roi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’il ne puisse être modifié » ou « transgressé ». L’expression hébraïque souligne la force juridique immuable du décret.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « sa royauté »; dans ce contexte, il s’agit de sa dignité ou de sa fonction de reine.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette formulation française naturelle conserve le caractère déférent de la proposition faite au roi et le sens de l’idiome avec טוֹב.
- source_word: יֵצֵא דְבַר־מַלְכוּת מִלְּפָנָיו
  choice: qu’un décret royal soit promulgué de sa part
  rationale: דְבַר־מַלְכוּת désigne une décision officielle du souverain. « De sa part » rend naturellement l’idée d’un acte émanant de la présence et de l’autorité royales.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: et inscrit dans les lois de Perse et de Médie
  rationale: Le passif indique l’intégration formelle du décret au corpus juridique; l’ordre hébreu Perse–Médie est conservé.
- source_word: וְלֹא יַעֲבוֹר
  choice: afin qu’il ne puisse être révoqué
  rationale: Dans ce contexte juridique, l’expression indique que le décret ne peut être annulé ou écarté. La note préserve les autres nuances possibles du verbe.
- source_word: אֲשֶׁר לֹא־תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Vashti ne devra plus se présenter devant le roi Assuérus
  rationale: « Se présenter devant » exprime naturellement la venue officielle en présence du roi. « Ne devra plus » marque l’interdiction désormais permanente sans suggérer qu’elle ne s’était jamais présentée auparavant.
- source_word: וּמַלְכוּתָהּ
  choice: sa dignité royale
  rationale: Ici, מַלְכוּת désigne le rang ou la fonction royale de Vashti, et non un territoire. « Dignité royale » reste clair et soutenu.
- source_word: לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: à une autre femme, meilleure qu’elle
  rationale: רְעוּתָהּ désigne ici une autre femme appelée à remplacer Vashti. Le comparatif « meilleure qu’elle » conserve l’évaluation générale du texte sans en préciser le critère.
