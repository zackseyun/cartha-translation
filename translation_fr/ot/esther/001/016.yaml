  text: וַ/יֹּ֣אמֶר מומכן לִ/פְנֵ֤י הַ/מֶּ֨לֶךְ֙ וְ/הַ/שָּׂרִ֔ים לֹ֤א עַל הַ/מֶּ֨לֶךְ֙ לְ/בַדּ֔/וֹ עָוְתָ֖ה וַשְׁתִּ֣י הַ/מַּלְכָּ֑ה כִּ֤י עַל כָּל הַ/שָּׂרִים֙ וְ/עַל כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֕ר בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: fr
  text: 'Alors Memoukân dit devant le roi et les hauts fonctionnaires : « Ce n’est pas seulement envers le roi que la reine Vashti a mal agi, mais envers tous les hauts fonctionnaires[a] et tous les peuples qui se trouvent dans toutes les provinces du roi Assuérus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dignitaires ».
    reason: Alternative lexicale pour שָׂרִים, qui peut désigner les grands personnages ou dignitaires de la cour.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette progression en français.
- source_word: מומכן
  choice: Memoukân
  rationale: Translittération française du nom propre hébreu, avec accent indiquant la syllabe finale.
- source_word: לִפְנֵי
  choice: devant
  rationale: Le terme indique que Memoukân parle en présence du roi et des hauts fonctionnaires ; « devant » est concis et idiomatique.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: Dans le cadre de la cour perse, שָׂרִים désigne des personnages de haut rang investis d’une autorité officielle. Cette expression moderne évite le sens dynastique que « princes » pourrait suggérer.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ
  choice: Ce n’est pas seulement envers le roi
  rationale: Cette tournure française conserve la construction contrastive « non seulement… mais… » et rend la relation exprimée par עַל sans réduire la faute à une simple offense personnelle.
- source_word: עָוְתָה
  choice: a mal agi
  rationale: Le verbe exprime une conduite mauvaise ou injuste. « A mal agi » garde sa portée morale sans préciser indûment la nature exacte de la faute.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: la reine Vashti
  rationale: L’ordre titre-nom est naturel en français et transmet le même sens que l’ordre hébreu « Vashti, la reine ».
- source_word: כִּי
  choice: mais
  rationale: 'Après la négation restrictive, כִּי introduit ici l’élargissement correctif : pas seulement envers le roi, mais envers les autres groupes cités.'
- source_word: עַל כָּל הַשָּׂרִים וְעַל כָּל הָעַמִּים
  choice: envers tous les hauts fonctionnaires et tous les peuples
  rationale: « Envers » reprend la relation de la faute à ses destinataires. « Tous les peuples » respecte le pluriel hébreu et convient au caractère multiethnique de l’empire.
- source_word: אֲשֶׁר בְּכָל מְדִינוֹת
  choice: qui se trouvent dans toutes les provinces
  rationale: La relative situe les groupes mentionnés à travers l’ensemble des circonscriptions de l’empire.
- source_word: מְדִינוֹת
  choice: provinces
  rationale: Terme français courant pour les circonscriptions administratives de l’Empire perse dans Esther.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: Forme française traditionnelle et largement reconnue du nom royal dans le livre d’Esther.
theological_decisions: []
