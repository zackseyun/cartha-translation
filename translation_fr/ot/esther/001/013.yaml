- from: Alors le roi consulta les sages qui connaissaient les temps, car les affaires du roi étaient ainsi portées devant tous ceux qui connaissaient la loi et le droit.
  to: Alors le roi dit aux sages qui connaissaient les temps — car c’était ainsi que le roi procédait devant tous ceux qui connaissaient la loi et le droit —
