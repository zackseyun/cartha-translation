base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: fr
  text: 'Car l’affaire de la reine se répandra parmi toutes les femmes, au point qu’elles regarderont leurs maris avec mépris, en disant : « Le roi Assuérus a dit de faire venir devant lui la reine Vashti, mais elle n’est pas venue. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: ce qui s’est passé avec la reine
  rationale: דָּבָר peut désigner une parole, une affaire ou un fait. Ici, l’expression renvoie à l’incident impliquant la reine; cette formulation française naturelle conserve cette largeur de sens sans réduire le terme à sa seule conduite.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: sera connu de toutes les femmes
  rationale: Littéralement, l’affaire « sortira vers/sur toutes les femmes »; l’idée contextuelle est qu’elle se répandra et parviendra à leur connaissance.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: les amènera à mépriser leur mari
  rationale: L’infinitif exprime ici le résultat redouté. בַּעְלֵיהֶן désigne les maris, et בְּעֵינֵיהֶן, littéralement « à leurs yeux », est idiomatiquement inclus dans « mépriser ».
- source_word: אָמַר לְהָבִיא
  choice: a dit qu’on fasse venir
  rationale: Préserve le verbe אָמַר, « dire », sans le renforcer en « ordonner », tout en rendant naturellement en français la construction infinitive causative « faire venir ».
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: Forme française traditionnelle et largement reconnue du nom royal dans Esther.
theological_decisions:
- issue: Portée du discours de Memoukân
  choice: Présenter ses paroles comme sa prédiction politique, sans les approuver comme vérité normative.
  alternative: Formuler la conséquence comme un enseignement universel sur les rapports conjugaux.
  rationale: Le verset rapporte l’argument d’un conseiller dans un récit; il ne marque pas explicitement une approbation divine ou morale de cet argument.
translation_notes:
  register: Français moderne, clair et digne. La citation directe est conservée. Le singulier collectif « leur mari » est idiomatique en français et correspond à la distribution du pluriel hébreu.
