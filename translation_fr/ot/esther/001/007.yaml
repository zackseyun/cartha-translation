  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: fr
  text: On servait à boire dans des coupes en or, des coupes toutes différentes les unes des autres, et du vin royal était servi en abondance, selon la générosité du roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְלֵי זָהָב
  choice: des coupes en or
  rationale: Dans le contexte d’un banquet où l’on sert des boissons, le terme général כְּלִי désigne naturellement des récipients à boire; « coupes » est idiomatique et précis en français.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: toutes différentes les unes des autres
  rationale: Cette formulation rend naturellement l’idée distributive selon laquelle les récipients variaient d’une pièce à l’autre.
- source_word: יֵין מַלְכוּת
  choice: le vin royal
  rationale: Rend directement le syntagme hébreu, qui désigne le vin appartenant au roi ou fourni par la maison royale, sans préciser davantage.
- source_word: רָב
  choice: coulait en abondance
  rationale: Le sens premier est « abondant »; avec le vin servi lors d’un banquet, cette tournure française exprime clairement sa grande disponibilité sans suggérer qu’il soit littéralement répandu.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: à la mesure de la générosité du roi
  rationale: L’expression idiomatique évoque les moyens, la munificence ou la largesse du roi. La traduction conserve l’image de la mesure tout en explicitant son sens contextuel.
