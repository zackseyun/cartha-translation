  text: בַּ/יּוֹם֙ הַ/שְּׁבִיעִ֔י כְּ/ט֥וֹב לֵב הַ/מֶּ֖לֶךְ בַּ/יָּ֑יִן אָמַ֡ר לִ֠/מְהוּמָן בִּזְּתָ֨א חַרְבוֹנָ֜א בִּגְתָ֤א וַ/אֲבַגְתָא֙ זֵתַ֣ר וְ/כַרְכַּ֔ס שִׁבְעַת֙ הַ/סָּ֣רִיסִ֔ים הַ/מְשָׁ֣רְתִ֔ים אֶת פְּנֵ֖י הַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: fr
  text: Le septième jour, alors que le cœur du roi était joyeux sous l’effet du vin[a], celui-ci s’adressa à Mehouman, Bizta, Harbona, Bigta, Abagta, Zétar et Karkas, les sept eunuques[b] qui servaient en présence du roi Ahasuérus —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque dit littéralement que le cœur du roi était joyeux sous l’effet du vin. Elle n’affirme pas explicitement qu’il était ivre.
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « eunuques » peut aussi désigner, selon le contexte, des hauts fonctionnaires de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Le septième jour
  rationale: Rend directement l’indication temporelle sans ajouter « de la fête », absent de ce verset.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: alors que le vin avait mis le cœur du roi en joie
  rationale: Conserve l’image hébraïque du cœur réjoui sous l’effet du vin, sans affirmer explicitement que le roi était ivre.
- source_word: אָמַר לִ
  choice: celui-ci s’adressa à
  rationale: Le verbe courant « dire » introduit ici les destinataires d’un ordre dont le contenu vient au verset suivant. « S’adressa à » est naturel en français et évite d’anticiper cet ordre.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: Mehouman, Bizta, Harbona, Bigta, Abagta, Zétar et Karkas
  rationale: Transcription française lisible des sept noms propres, proche de leurs formes hébraïques.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: les sept eunuques
  rationale: « Eunuques » retient le sens lexical direct de סָרִיס dans un cadre de cour royale, tout en signalant en note son extension possible.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: qui servaient en présence de
  rationale: Rend à la fois le service personnel et l’expression idiomatique « devant la face de », adaptée au contexte de la cour.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: le roi Ahasuérus
  rationale: Suit l’ordre idiomatique français du titre et du nom, avec la forme française traditionnelle Ahasuérus.
