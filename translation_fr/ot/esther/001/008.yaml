translation_notes:
  register: Français international moderne, naturel et digne. La tournure « On buvait » évite le peu idiomatique « la consommation de boisson »; « prescrit » maintient le registre administratif de la cour. Les notes conservent les principales possibilités lexicales et la forme distributive de l’hébreu.
