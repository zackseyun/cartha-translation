  to: 'On buvait selon la règle[a] : personne n’y était contraint[b], car le roi avait prescrit à tous les responsables de sa maison d’agir selon le désir de chacun[c].'
  rationale: La traduction est conservée à l’exception de « volonté », remplacé par « désir » pour refléter plus directement la préférence individuelle, et des notes b et c, corrigées afin de décrire fidèlement la forme hébraïque. Les ancres de notes restent placées sur les éléments qu’elles expliquent.
