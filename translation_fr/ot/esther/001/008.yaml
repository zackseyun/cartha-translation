  text: וְ/הַ/שְּׁתִיָּ֥ה כַ/דָּ֖ת אֵ֣ין אֹנֵ֑ס כִּי כֵ֣ן יִסַּ֣ד הַ/מֶּ֗לֶךְ עַ֚ל כָּל רַ֣ב בֵּית֔/וֹ לַ/עֲשׂ֖וֹת כִּ/רְצ֥וֹן אִישׁ וָ/אִֽישׁ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: fr
  text: 'On buvait selon la règle[a] : personne n’y était contraint[b], car le roi avait prescrit à tous les responsables de sa maison d’agir selon le désir de chacun[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon la loi » ou « selon le règlement » ; le terme hébreu peut désigner une loi, un décret ou une règle officielle.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « il n’y avait pas de contrainte » ; personne n’était forcé à boire.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu répète « homme » : une expression distributive signifiant chaque individu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: On buvait
  rationale: Le nom désigne ici l’activité de boire pendant le banquet. La tournure verbale est plus naturelle en français moderne tout en conservant ce sens précis.
- source_word: כַדָּת
  choice: selon la règle
  rationale: דָּת peut désigner une loi, un décret ou une règle officielle. Dans ce contexte de banquet, « règle » exprime naturellement la disposition établie, sans exclure son caractère officiel.
- source_word: אֵין אֹנֵס
  choice: personne n’y était contraint
  rationale: La formule affirme l’absence de coercition. Cette formulation française explicite naturellement que personne n’était forcé à boire.
- source_word: כִּי כֵן
  choice: car
  rationale: La conjonction introduit la raison de l’absence de contrainte; « car » restitue clairement ce lien en français.
- source_word: יִסַּד
  choice: avait prescrit
  rationale: Le verbe signifie fondamentalement établir ou fixer. Dans ce contexte administratif, « prescrire » rend l’idée d’une directive royale établie.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: à tous les responsables de sa maison
  rationale: רַב désigne ici une personne ayant autorité ou responsabilité dans la maison royale. « Responsables » est clair et actuel, tandis que « sa maison » conserve l’expression hébraïque.
- source_word: לַעֲשׂוֹת
  choice: d’agir
  rationale: L’infinitif « faire » prend ici le sens de se comporter ou de procéder conformément à la volonté des convives; « agir » est idiomatique dans cette construction.
- source_word: כִּרְצוֹן אִישׁ וָאִישׁ
  choice: selon la volonté de chacun
  rationale: רָצוֹן exprime ce que chacun veut ou préfère, et la répétition אִישׁ וָאִישׁ a une valeur distributive. « De chacun » restitue cette individualisation sans lourdeur.
