source:
  edition: WLC
  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: fr
  text: Des tentures de coton blanc et bleu[a] étaient retenues par des cordons de fin lin et de pourpre, fixés à des anneaux d’argent[b] et à des colonnes de marbre. Des divans[c] d’or et d’argent reposaient sur un dallage d’albâtre, de marbre, de nacre et de pierres précieuses[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme traduit par « bleu » peut désigner une teinte bleu-violet obtenue avec une teinture de grand prix.
    reason: lexical_alternative
  - marker: b
    text: Ou « cylindres d’argent » ou « tringles d’argent »; le terme hébreu désigne quelque chose d’arrondi ou d’enroulé, et la forme exacte de ces pièces est incertaine.
    reason: lexical_alternative
  - marker: c
    text: Il s’agit de divans sur lesquels les convives s’allongeaient pendant le repas, et non de lits ordinaires.
    reason: cultural_note
  - marker: d
    text: L’identification précise des matériaux du dallage est incertaine. Les termes hébreux ont aussi été rendus notamment par « porphyre », « marbre blanc » ou « pierre sombre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: tentures de coton blanc et bleu
  rationale: Dans ce décor palatial, חוּר est compris comme la couleur blanche, כַּרְפַּס comme un tissu de coton et תְכֵלֶת comme un bleu prestigieux, peut-être tirant sur le violet. « Tentures » explicite naturellement la fonction décorative de ces textiles.
- source_word: אָחוּז
  choice: étaient retenues
  rationale: Le participe passif décrit la manière dont les tentures étaient maintenues; « retenues » convient au dispositif de cordons et d’attaches.
- source_word: חַבְלֵי בּוּץ וְאַרְגָּמָן
  choice: cordons de fin lin et de pourpre
  rationale: בּוּץ désigne un lin fin et אַרְגָּמָן la pourpre, couleur ou matière textile luxueuse. La formulation conserve la coordination concise de l’hébreu sans préciser indûment la composition exacte des cordons pourpres.
- source_word: גְּלִילֵי כֶסֶף
  choice: anneaux d’argent
  rationale: Le mot évoque des objets arrondis ou roulés. Des anneaux constituent une identification contextuellement plausible pour la fixation des tentures, mais l’objet exact reste incertain et fait l’objet d’une note.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: colonnes de marbre
  rationale: Ici שֵׁשׁ désigne vraisemblablement une pierre blanche plutôt que du lin. « Marbre » est naturel en contexte architectural, bien que l’identification minérale ne soit pas absolument certaine.
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: divans d’or et d’argent
  rationale: Dans le cadre d’un banquet, מִטּוֹת désigne les sièges sur lesquels on s’allongeait plutôt que des lits destinés au sommeil. « Divans » rend cet usage de façon concise en français.
- source_word: רִצְפַת
  choice: dallage
  rationale: Le terme désigne la surface construite du sol. « Dallage » convient à une liste de pierres sans imposer l’idée plus précise d’une mosaïque.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: albâtre, marbre, nacre et pierres précieuses
  rationale: Ces identifications courantes donnent un sens intelligible à la liste des matériaux luxueux, mais plusieurs termes rares demeurent incertains; cette incertitude est signalée en note.
theological_decisions: []
