id: EST.1.12
reference: Esther 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: fr
  text: Mais la reine Vashti refusa de venir sur l’ordre du roi, transmis par l’intermédiaire des eunuques[a]. Le roi entra dans une violente colère, et sa fureur brûla en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main des eunuques »; cette expression signifie que l’ordre fut transmis par leur intermédiaire.'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu emploie l’image d’une fureur qui brûle en lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: refusa
  rationale: Le verbe מאן exprime un refus net ou une volonté de ne pas obéir; « refusa » en conserve directement la force.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: la reine Vashti
  rationale: Cette formulation française naturelle maintient à la fois le titre et le nom propre.
- source_word: לָבוֹא
  choice: de venir
  rationale: בוא signifie couramment « venir » ou « entrer »; le contexte d’une convocation royale favorise « venir ».
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: sur l’ordre du roi
  rationale: דבר désigne ici la parole royale comprise comme un ordre; « sur l’ordre » est clair et idiomatique en français.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: transmis par l’intermédiaire des eunuques
  rationale: L’expression « par la main de » marque ici l’intermédiaire chargé de transmettre l’ordre. La traduction explicite cet idiome sans supprimer la mention des eunuques de cour.
- source_word: וַיִּקְצֹף ... מְאֹד
  choice: entra dans une violente colère
  rationale: Cette tournure restitue le déclenchement narratif de la colère et l’intensification exprimée par מְאֹד dans un français naturel.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: sa fureur brûla en lui
  rationale: La formulation conserve l’image hébraïque du feu et rend בוֹ par son sens interne, « en lui ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination hébraïque est légèrement restructurée en deux phrases pour une lecture naturelle, tout en maintenant la progression et l’image finale.
