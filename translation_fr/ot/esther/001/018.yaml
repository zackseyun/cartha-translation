base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: fr
  text: Aujourd’hui même, les femmes de haut rang de Perse et de Médie qui auront entendu parler de l’affaire de la reine[a] diront la même chose à tous les hauts fonctionnaires du roi. Et il y aura bien assez de mépris et de colère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut aussi signifier « ce qu’a dit la reine » ou « la parole de la reine ». Le terme peut désigner aussi bien ses propos que l’affaire la concernant.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition est elliptique en hébreu : littéralement, « et assez de mépris et de colère ». Les mots « il y aura » sont ajoutés pour la clarté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: Dès aujourd’hui
  rationale: L’expression marque l’immédiateté. « Dès aujourd’hui » s’intègre naturellement à la prédiction et évite une tournure française pesante.
- source_word: תֹּאמַרְנָה
  choice: en diront autant
  rationale: Le verbe signifie littéralement « diront ». Dans le contexte, l’objet implicite est une parole comparable à celle de la reine; « en diront autant » explicite sobrement cette relation sans déterminer les mots exacts.
- source_word: שָׂרוֹת
  choice: les femmes de haut rang
  rationale: Le terme désigne des femmes appartenant aux milieux dirigeants. Cette formulation évite de laisser entendre qu’elles seraient nécessairement des filles de roi, comme pourrait le faire « princesses ».
- source_word: פָּרַס וּמָדַי
  choice: de Perse et de Médie
  rationale: Les noms géographiques français usuels rendent clairement l’appartenance de ces femmes aux deux peuples ou territoires.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: qui auront entendu parler
  rationale: Le parfait hébreu se place dans une prédiction et présente l’audition comme antérieure à leur future réaction. Le futur antérieur rend clairement ce rapport temporel en français.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: parler de l’affaire de la reine
  rationale: דָּבָר peut désigner une parole, un fait ou une affaire. Ici, il peut s’agir de ce que la reine a dit ou de ce qui s’est passé à son sujet; « l’affaire de la reine » conserve cette largeur de sens.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: à tous les hauts fonctionnaires du roi
  rationale: שָׂרִים désigne ici les hommes occupant les plus hautes fonctions du royaume. « Hauts fonctionnaires » est moderne et n’implique pas une filiation royale.
- source_word: וּכְדַי
  choice: Et il y aura bien assez
  rationale: La proposition hébraïque est elliptique, littéralement « et assez de… ». La copule est ajoutée pour produire une phrase française claire; « bien assez » exprime la notion d’abondance nuisible.
- source_word: בִּזָּיוֹן וָקָצֶף
  choice: de mépris et de colère
  rationale: « Mépris » rend l’attitude déshonorante, tandis que « colère » restitue קֶצֶף avec force dans un français actuel sans la coloration parfois archaïque de « courroux ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Femmes de haut rang » et « hauts fonctionnaires » préservent le cadre de cour sans employer « princesses » ni « princes », qui pourraient suggérer à tort une ascendance royale. La syntaxe prédictive est rendue par le futur antérieur puis le futur simple.
