  text: בְּ/הַרְאֹת֗/וֹ אֶת עֹ֨שֶׁר֙ כְּב֣וֹד מַלְכוּת֔/וֹ וְ/אֶ֨ת יְקָ֔ר תִּפְאֶ֖רֶת גְּדוּלָּת֑/וֹ יָמִ֣ים רַבִּ֔ים שְׁמוֹנִ֥ים וּ/מְאַ֖ת יֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/004.yaml
  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: fr
  text: tandis qu’il exposait, durant de nombreux jours — cent quatre-vingts jours —, les richesses de la gloire de son royaume et l’éclat précieux de la splendeur de sa grandeur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: Il déploya ainsi
  rationale: L’infinitif construit avec préposition exprime ici une action concomitante au festin du verset précédent. « Déployer » rend naturellement l’idée de montrer avec ostentation, sans ajouter explicitement une intention absente du texte.
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: la richesse et la gloire de son royaume
  rationale: La chaîne nominale hébraïque, très dense, associe la richesse au כָּבוֹד du royaume. La coordination française conserve les deux notions sans produire la tournure obscure « la richesse de la gloire ».
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: l’éclat et la splendeur de sa grandeur
  rationale: יְקָר évoque ce qui est précieux, prestigieux ou éclatant, tandis que תִּפְאֶרֶת désigne la splendeur. La formulation garde l’accumulation emphatique de l’hébreu tout en restant idiomatique.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: pendant de nombreux jours — cent quatre-vingts jours —
  rationale: La reprise explicative du nombre précise « de nombreux jours ». Les tirets reproduisent cette apposition avec clarté en français.
