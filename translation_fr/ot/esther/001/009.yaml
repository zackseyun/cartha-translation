  text: גַּ֚ם וַשְׁתִּ֣י הַ/מַּלְכָּ֔ה עָשְׂתָ֖ה מִשְׁתֵּ֣ה נָשִׁ֑ים בֵּ֚ית הַ/מַּלְכ֔וּת אֲשֶׁ֖ר לַ/מֶּ֥לֶךְ אֲחַשְׁוֵרֽוֹשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/009.yaml
  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: fr
  text: La reine Vashti donna, elle aussi, un banquet pour les femmes dans la demeure royale qui appartenait au roi Assuérus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dans le palais»; littéralement «dans la maison de la royauté».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: elle aussi
  rationale: Marque l’ajout au banquet du roi décrit précédemment; placé après le sujet, ce tour est naturel en français.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: la reine Vashti
  rationale: Le titre précédé de l’article et le nom propre sont rendus dans l’ordre idiomatique français. «Vashti» suit la translittération française traditionnelle.
- source_word: עָשְׂתָה
  choice: donna
  rationale: Le verbe signifie littéralement «fit», mais «donner un banquet» exprime naturellement l’action en français sans l’expliciter davantage.
- source_word: מִשְׁתֵּה
  choice: un banquet
  rationale: Le nom désigne un festin, souvent associé à la consommation de vin; «banquet» convient au cadre royal et reste compréhensible aujourd’hui.
- source_word: נָשִׁים
  choice: pour les femmes
  rationale: Le pluriel désigne les participantes auxquelles le banquet était destiné.
- source_word: בֵּית הַמַּלְכוּת
  choice: la demeure royale
  rationale: Conserve l’image de la «maison» tout en indiquant clairement une résidence royale; «palais» serait possible, mais plus interprétatif.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: qui appartenait au roi Assuérus
  rationale: Rend explicitement et naturellement la construction relative possessive de l’hébreu.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: Forme française traditionnelle et largement reconnue du nom royal dans le livre d’Esther.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. «Demeure royale» préserve davantage la formulation hébraïque que «palais», tandis que «banquet» restitue naturellement מִשְׁתֵּה dans ce contexte royal.
