base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: fr
  text: « D’après la loi, que faut-il faire de la reine Vashti, parce qu’elle n’a pas exécuté l’ordre du roi Assuérus, transmis par l’intermédiaire des eunuques[a][b] ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main des eunuques »; on peut aussi traduire : « transmis par les eunuques ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner plus largement des fonctionnaires de cour, bien que « eunuques » en soit ici la traduction la plus directe.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדָת
  choice: D’après la loi
  rationale: Dans Esther, דָּת désigne couramment la loi ou la règle officielle du cadre perse. Cette formulation conserve la portée juridique de la question.
- source_word: מַה לַּעֲשׂוֹת
  choice: que faut-il faire
  rationale: L’infinitif exprime ici une délibération sur la mesure à prendre; cette tournure est naturelle en français tout en maintenant le ton impersonnel.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: faire de la reine Vashti
  rationale: Avec עשה, la préposition introduit la personne concernée par le traitement envisagé. « Faire de » est idiomatique en français et n’ajoute pas explicitement une nuance hostile.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: puisqu’elle n’a pas exécuté
  rationale: La locution donne le motif de la mesure envisagée. « Exécuter » convient à un ordre et reste proche de l’idée de faire, sans remplacer celle-ci par une formulation explicitement centrée sur l’obéissance.
- source_word: מַאֲמַר
  choice: l’ordre
  rationale: Dans ce contexte royal, מַאֲמַר est une parole investie d’autorité; « ordre » en restitue naturellement la force.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: le roi Assuérus
  rationale: Le titre est traduit et le nom est rendu selon sa forme française traditionnelle et intelligible.
- source_word: בְּיַד הַסָּרִיסִים
  choice: transmis par l’intermédiaire des eunuques
  rationale: Littéralement « par la main des eunuques », l’expression indique ici la médiation ou l’agence. La formulation française explicite naturellement cette fonction sans perdre le référent direct סָרִיסִים.
