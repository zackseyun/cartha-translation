  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: fr
  text: Il arriva, au temps d’Assuérus — cet Assuérus qui régnait de l’Inde jusqu’à Koush[a] sur cent vingt-sept provinces —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Éthiopie ». Koush est le nom antique d’une région située au sud de l’Égypte ; il ne correspond pas exactement à l’Éthiopie moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Au temps de
  rationale: La formule ouvre le récit et situe les événements. En français, son association avec בִּימֵי se rend naturellement et dignement par « Au temps de », sans ajouter un « maintenant » absent du texte.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Expression temporelle narrative courante, plus naturelle ici que le calque « dans les jours de ».
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: Translittération française traditionnelle de la forme hébraïque, préférée à l’identification historique interprétative « Xerxès ».
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: cet Assuérus
  rationale: Le démonstratif et la répétition du nom précisent de quel Assuérus il s’agit; « cet Assuérus » conserve clairement cette fonction identificatrice.
- source_word: הַמֹּלֵךְ
  choice: qui régnait
  rationale: Le participe caractérise Assuérus par l’étendue de son règne; une relative à l’imparfait est idiomatique en français narratif.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: de l’Inde jusqu’à Koush
  rationale: הֹדּוּ désigne conventionnellement l’Inde. « Koush » préserve le nom régional antique sans l’assimiler de façon trompeuse à l’État moderne d’Éthiopie.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: cent vingt-sept
  rationale: Formulation numérique française standard correspondant au total hébreu.
- source_word: מְדִינָה
  choice: provinces
  rationale: Dans le contexte administratif de l’Empire perse, « provinces » est le terme français établi et immédiatement compréhensible.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase reste ouverte par un tiret final, puisque le verset hébreu introduit la suite du récit. Le nom « Assuérus » suit la forme biblique française usuelle; aucune note « Xerxès » n’est ajoutée, car cette identification historique n’est pas nécessaire à la compréhension du verset.
