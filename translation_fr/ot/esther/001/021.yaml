base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: fr
  text: La proposition parut bonne au roi et aux hauts fonctionnaires, et le roi fit ce que Memucan avait dit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « selon la parole de Memucan » ; ou « conformément à l’avis de Memucan ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי
  choice: La proposition parut bonne
  rationale: L’expression idiomatique signifie que la chose fut jugée favorablement. « Parut bonne » conserve l’image évaluative de l’hébreu, tandis que « proposition » explicite naturellement que הַדָּבָר renvoie à ce que Memoukân vient de proposer.
- source_word: וְהַשָּׂרִים
  choice: et aux hauts fonctionnaires
  rationale: שָׂרִים désigne ici les principaux dignitaires de la cour. « Hauts fonctionnaires » est moderne, clair et adapté au contexte impérial, sans suggérer nécessairement des princes de sang.
- source_word: וַיַּעַשׂ הַמֶּלֶךְ
  choice: le roi agit
  rationale: Le verbe עָשָׂה signifie faire ou agir. « Agit » donne en français une construction naturelle avec « conformément à » sans préciser au-delà du texte la forme d’exécution.
- source_word: כִּדְבַר מְמוּכָן
  choice: conformément aux paroles de Memoukân
  rationale: La formulation garde le sens littéral de דָּבָר comme parole ou déclaration, tout en exprimant naturellement que le roi se conforma à ce que Memoukân avait dit.
- source_word: מְמוּכָן
  choice: Memoukân
  rationale: Translittération française claire du nom hébreu, avec accent circonflexe pour guider la prononciation de la dernière syllabe.
