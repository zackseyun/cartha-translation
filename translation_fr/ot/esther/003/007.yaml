base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: fr
  text: Dans le premier mois, c’est-à-dire le mois de Nisan, dans la douzième année du roi Assuérus, on jeta le Pour — c’est-à-dire le sort — devant Haman, de jour en jour et de mois en mois, jusqu’au douzième mois, c’est-à-dire le mois d’Adar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « de jour en jour et de mois en mois, douze, c’est-à-dire le mois d’Adar ». La formulation hébraïque est concise; dans le contexte, elle conduit au douzième mois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Au premier mois
  rationale: Expression temporelle naturelle qui conserve le cadre calendaire de l’hébreu.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: c’est-à-dire au mois de Nisan
  rationale: Le pronom et l’apposition précisent le nom du mois; « c’est-à-dire » rend clairement cette explication.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: dans la douzième année du roi Assuérus
  rationale: Formulation française idiomatique de la datation selon l’année de règne.
- source_word: הִפִּיל פּוּר
  choice: on jeta ... le Pour
  rationale: Le verbe désigne l’action de jeter le sort. Le pronom indéfini évite d’ajouter un sujet absent de l’hébreu, tout en restant naturel en français.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: le Pour — c’est-à-dire le sort —
  rationale: Le terme d’emprunt perse est conservé puis expliqué, comme dans le texte source, ce qui maintient aussi son lien avec le nom de la fête des Pourim.
- source_word: לִפְנֵי הָמָן
  choice: devant Haman
  rationale: Rend directement l’idée de présence exprimée par לִפְנֵי sans préciser davantage la scène.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: pour chaque jour et pour chaque mois
  rationale: Cette formulation exprime naturellement en français l’examen successif des jours et des mois, sans suggérer nécessairement que l’opération dura effectivement toute l’année.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: jusqu’au douzième mois, c’est-à-dire le mois d’Adar
  rationale: Le contexte permet de comprendre le nombre comme l’aboutissement de la séquence calendaire; l’ajout de « jusqu’au » explicite ce lien tout en signalant en note la forme plus littérale.
