  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הָמָ֔ן הַ/כֶּ֖סֶף נָת֣וּן לָ֑/ךְ וְ/הָ/עָ֕ם לַ/עֲשׂ֥וֹת בּ֖/וֹ כַּ/טּ֥וֹב בְּ/עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: fr
  text: 'Alors le roi dit à Haman : « L’argent t’est donné, ainsi que ce peuple, pour que tu en fasses ce qui te semblera bon. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors … dit
  rationale: Le waw consécutif fait avancer le récit ; « Alors » marque naturellement la succession en français.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Le texte hébreu emploie le titre défini, qu’il convient de conserver sans lui substituer le nom du souverain.
- source_word: לְהָמָן
  choice: à Haman
  rationale: La préposition introduit le destinataire de la parole ; « Haman » est la forme française usuelle du nom.
- source_word: הַכֶּסֶף
  choice: L’argent
  rationale: כֶּסֶף désigne littéralement l’argent métal et, couramment, l’argent comme moyen de paiement. Dans ce contexte financier, le français « l’argent » conserve naturellement les deux résonances sans nécessiter de note.
- source_word: נָתוּן לָךְ
  choice: t’est donné
  rationale: La construction participiale passive présente l’argent comme remis ou laissé à la disposition d’Haman ; la formulation française reste proche de la forme hébraïque.
- source_word: וְהָעָם
  choice: ainsi que ce peuple
  rationale: La conjonction ajoute le peuple à ce qui est livré à Haman. Le démonstratif français rend naturellement le groupe déjà visé dans le contexte, sans résoudre davantage l’identité collective.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: pour que tu en fasses
  rationale: L’infinitif exprime le but ou la latitude accordée à Haman. Le pronom hébreu est au singulier et reprend le nom collectif « peuple » ; « en » permet de préserver cette reprise sans imposer artificiellement un pluriel.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: ce qui te semblera bon
  rationale: L’expression idiomatique signifie ce qui paraît bon ou acceptable à quelqu’un. Cette formulation moderne restitue le jugement subjectif sans calquer lourdement « à tes yeux ».
