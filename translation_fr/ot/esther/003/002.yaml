  variant: modern international French
source:
  edition: WLC
  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: fr
  text: Tous les serviteurs du roi qui se trouvaient à la porte du roi s’inclinaient et se prosternaient devant Haman[a], car le roi avait donné cet ordre à son sujet[b]. Mais Mardochée refusait de s’incliner et de se prosterner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendaient hommage à Haman ». Le verbe hébreu peut aussi être traduit par « adorer » lorsque celui devant qui l’on se prosterne est divin.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « car le roi le lui avait ordonné ». Le pronom peut grammaticalement désigner la personne à qui l’ordre avait été donné, mais il est plus probablement compris ici comme renvoyant à Haman : l’ordre concernait l’honneur qui devait lui être rendu.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: serviteurs
  rationale: Dans le cadre de la cour royale, « serviteurs du roi » désigne naturellement le personnel attaché au roi sans préciser excessivement leur statut comme le ferait « esclaves », ni le restreindre aux seuls « fonctionnaires ».
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: à la porte du roi
  rationale: Cette formulation conserve le lieu concret, qui était aussi un espace public et administratif lié aux affaires royales.
- source_word: כֹּרְעִים
  choice: s’inclinaient
  rationale: Le participe exprime ici une conduite habituelle ou répétée. « S’inclinaient » rend le geste d’abaissement sans le limiter à la position à genoux.
- source_word: וּמִשְׁתַּחֲוִים
  choice: se prosternaient
  rationale: Le verbe peut désigner la prosternation, l’hommage ou l’adoration selon le contexte. Devant Haman, « se prosternaient » préserve le geste et son ambiguïté potentielle sans imposer explicitement une adoration religieuse.
- source_word: לְהָמָן
  choice: devant Haman
  rationale: En français, « se prosterner devant quelqu’un » est la tournure idiomatique correspondant à l’objet de l’hommage.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: car le roi avait donné cet ordre à son sujet
  rationale: 'Le pronom לוֹ est compris de préférence comme renvoyant à Haman : l’ordre royal concernait l’honneur qui devait lui être rendu. La note conserve l’autre analyse grammaticale possible.'
- source_word: וּמָרְדֳּכַי
  choice: Mais Mardochée
  rationale: La conjonction introduit un contraste net entre la conduite générale des serviteurs et celle de Mardochée ; « mais » rend naturellement cette valeur discursive.
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: refusait de s’incliner et de se prosterner
  rationale: Les imparfaits décrivent une attitude persistante et volontaire. « Refusait de » exprime clairement cette conduite habituelle, tout en maintenant les deux gestes du texte hébreu.
theological_decisions:
- issue: Faut-il rendre הִשְׁתַּחֲוָה par un terme explicitement religieux comme « adorer » ?
  choice: « se prosterner »
  alternative: « adorer » ou « rendre hommage »
  rationale: Le verbe hébreu peut s’employer pour l’adoration de Dieu comme pour l’hommage rendu à un être humain. Puisque Haman en est ici l’objet, « se prosterner » conserve le geste d’obéissance cérémonielle et la tension éventuelle du récit sans affirmer que les serviteurs lui rendaient un culte.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif oppose la pratique habituelle des serviteurs au refus persistant de Mardochée. « Porte du roi » conserve l’image concrète et la répétition de l’hébreu. Les deux verbes gestuels sont maintenus, sans vocabulaire explicitement cultuel dans le corps du texte.
