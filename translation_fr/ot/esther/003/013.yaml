  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: fr
  text: Des lettres furent envoyées par l’intermédiaire des courriers dans toutes les provinces du roi[a], afin d’exterminer, de tuer et de faire périr tous les Juifs[b], jeunes et vieux, enfants et femmes[c], en un seul jour, le treizième jour du douzième mois, c’est-à-dire le mois d’adar, et de piller leurs biens[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par la main des coureurs » ; il s’agit des courriers royaux.'
    reason: lexical_alternative
  - marker: b
    text: Les trois verbes « exterminer, tuer et faire périr » forment en hébreu une accumulation délibérée qui intensifie la violence totale du décret.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « depuis le jeune homme jusqu’au vieillard, enfants et femmes » ; les formes au singulier ont ici une valeur distributive.'
    reason: lexical_alternative
  - marker: d
    text: 'Autre traduction : « saisir leurs biens comme butin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: Des lettres furent envoyées
  rationale: Le passif hébreu et son sujet sont rendus directement; « lettres » convient au contexte administratif perse sans préciser excessivement le type de document.
- source_word: בְּיַד הָרָצִים
  choice: par l’intermédiaire des courriers
  rationale: Rend naturellement l’instrumentalité de l’expression littérale « par la main des coureurs » et identifie leur fonction officielle.
- source_word: אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: dans toutes les provinces du roi
  rationale: En français, « envoyées dans » exprime naturellement la destination des lettres tout en conservant l’étendue totale du décret.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: il fallait exterminer, tuer et faire périr
  rationale: La formulation fait dépendre les trois infinitifs du contenu prescriptif des lettres et conserve l’accumulation volontaire de trois verbes violents.
- source_word: אֶת כָּל הַיְּהוּדִים
  choice: tous les Juifs
  rationale: Traduction directe qui maintient la portée totalisante de כָּל.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: jeunes et vieux
  rationale: Expression distributive française naturelle couvrant tous les âges; le contexte mentionne ensuite explicitement enfants et femmes.
- source_word: טַף וְנָשִׁים
  choice: enfants et femmes
  rationale: טַף désigne ici les petits ou les enfants; cette traduction claire souligne que les non-combattants sont inclus.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: « Un seul » fait ressortir la concentration temporelle voulue par l’hébreu.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: le treizième jour du douzième mois, c’est-à-dire le mois d’adar
  rationale: Rend clairement la formule de datation et son explication appositionnelle.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: livrer leurs biens au pillage
  rationale: Expression française idiomatique qui conserve à la fois les biens visés et leur mise à disposition comme butin.
