id: EST.3.15
reference: Esther 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: fr
  text: Les courriers partirent en toute hâte sur l’ordre du roi, et le décret[a] fut promulgué à Suse, la citadelle. Le roi et Haman s’assirent pour boire, mais la ville de Suse fut plongée dans la confusion[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fut donné ». Dans ce contexte administratif perse, le mot hébreu peut aussi être traduit par « loi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « fut déconcertée » ou « fut bouleversée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: les courriers
  rationale: Dans le contexte administratif perse, le terme désigne les porteurs des dépêches royales. « Courriers » exprime naturellement leur fonction officielle.
- source_word: דְחוּפִים
  choice: partirent en toute hâte
  rationale: Le participe indique que les courriers sont poussés à agir avec urgence. Cette formulation française rend l’empressement sans alourdir la phrase.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: sur l’ordre du roi
  rationale: דבר désigne ici la parole royale ayant valeur de commandement, et non une simple déclaration.
- source_word: הַדָּת
  choice: le décret
  rationale: Dans le cadre administratif du livre d’Esther, דָּת désigne une décision officielle ayant force de loi. « Décret » convient mieux ici que le terme plus général « loi ».
- source_word: נִתְּנָה
  choice: fut promulgué
  rationale: Le verbe signifie littéralement « fut donné », mais, appliqué à un décret, il décrit sa publication officielle. « Fut promulgué » rend clairement cette valeur administrative.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Suse, la citadelle
  rationale: בִּירָה désigne la citadelle ou le complexe fortifié royal. L’apposition conserve la structure du texte hébreu.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: s’assirent pour boire
  rationale: Traduction directe de l’expression hébraïque, qui préserve le contraste saisissant entre l’édit meurtrier et l’attitude du roi et d’Haman.
- source_word: נָבוֹכָה
  choice: fut plongée dans la confusion
  rationale: Le verbe au niphal décrit un état de désarroi, de perplexité ou d’agitation. Cette formulation exprime à la fois le résultat subi et le trouble collectif.
- source_word: וְ
  choice: mais
  rationale: La conjonction signifie formellement « et », mais elle introduit ici un contraste narratif entre le roi et Haman qui boivent et la ville désemparée.
theological_decisions: []
