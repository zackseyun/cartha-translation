  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: fr
  text: 'Alors Haman dit au roi Assuérus : « Il y a un certain peuple, dispersé et séparé parmi les peuples dans toutes les provinces de ton royaume. Leurs lois sont différentes de celles de tout autre peuple, et ils n’observent pas les lois du roi. Il n’est donc pas dans l’intérêt du roi de les laisser tranquilles[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de les laisser subsister » ou « de les tolérer ». Le verbe hébreu peut signifier laisser quelqu’un en paix ou lui permettre de demeurer sans être inquiété.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: Il y a un certain peuple
  rationale: Cette formulation rend l’existence d’un peuple unique sans faire de אֶחָד un simple chiffre. « Un certain peuple » restitue aussi le ton volontairement vague et insinuant de Haman.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: dispersé et séparé
  rationale: Les deux participes sont conservés. « Dispersé » exprime la répartition géographique, tandis que « séparé » maintient l’idée de mise à part sans préciser abusivement s’il s’agit d’une séparation sociale ou interne.
- source_word: בֵּין הָעַמִּים
  choice: parmi les peuples
  rationale: Dans le cadre de l’Empire perse, le pluriel désigne les divers groupes de population plutôt que des États-nations au sens moderne.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: dans toutes les provinces de ton royaume
  rationale: מְדִינוֹת désigne régulièrement dans Esther les circonscriptions administratives de l’empire.
- source_word: דָתֵיהֶם שֹׁנוֹת מִכָּל עָם
  choice: Leurs lois sont différentes de celles de tout autre peuple
  rationale: « Lois » conserve la portée juridique de דָּת et le parallèle avec les lois royales. « Celles de » explicite naturellement en français que la comparaison porte sur les lois.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: et ils n’observent pas les lois du roi
  rationale: Avec les lois pour complément, עָשָׂה signifie les mettre en pratique ou les respecter. « Observer » est naturel et garde la tonalité juridique de l’accusation.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: Il n’est donc pas dans l’intérêt du roi
  rationale: L’expression porte sur l’avantage ou le bénéfice du roi. « Dans l’intérêt du roi » rend clairement l’argument pragmatique de Haman; « donc » exprime le lien logique implicite avec les accusations précédentes.
- source_word: לְהַנִּיחָם
  choice: de les laisser tranquilles
  rationale: Le hiphil de נוח peut signifier laisser quelqu’un en paix, le laisser subsister ou le tolérer. « Laisser tranquilles » conserve l’idée de ne pas intervenir contre eux sans préciser excessivement la mesure envisagée.
