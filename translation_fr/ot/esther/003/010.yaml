id: EST.3.10
reference: Esther 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּ֧סַר הַ/מֶּ֛לֶךְ אֶת טַבַּעְתּ֖/וֹ מֵ/עַ֣ל יָד֑/וֹ וַֽ/יִּתְּנָ֗/הּ לְ/הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י צֹרֵ֥ר הַ/יְּהוּדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: fr
  text: Alors le roi retira de sa main son anneau-sceau et le donna à Haman, fils de Hammedata, l’Agaguite, l’ennemi des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le mot hébreu יְהוּדִים peut désigner plus largement le peuple juif ou, selon le contexte, les gens de Juda ou de Judée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: retira
  rationale: Le verbe signifie enlever ou ôter. « Retira » exprime naturellement en français le geste d’enlever l’anneau de sa main.
- source_word: טַבַּעְתּוֹ
  choice: son anneau-sceau
  rationale: Dans ce contexte royal, l’anneau porte le sceau officiel et sert à conférer l’autorité; « anneau-sceau » rend cette fonction sans développement interprétatif.
- source_word: מֵעַל יָדוֹ
  choice: de sa main
  rationale: Rend directement l’image hébraïque et précise d’où le roi retire l’anneau.
- source_word: וַיִּתְּנָהּ
  choice: le donna
  rationale: Traduction simple de נתן; le pronom français masculin reprend naturellement « anneau-sceau », malgré le suffixe féminin hébreu accordé avec טַבַּעַת.
- source_word: לְהָמָן
  choice: à Haman
  rationale: Translittération française usuelle du nom propre.
- source_word: בֶּן הַמְּדָתָא
  choice: fils de Hammedata
  rationale: Le patronyme est rendu littéralement et le nom est translittéré selon l’usage français.
- source_word: הָאֲגָגִי
  choice: l’Agaguite
  rationale: Conserve la désignation d’origine ou de lignée, ainsi que sa résonance narrative, sans préciser au-delà de l’hébreu.
- source_word: צֹרֵר
  choice: l’ennemi
  rationale: Le participe désigne celui qui manifeste une hostilité active; « ennemi » est naturel, clair et vigoureux en contexte.
- source_word: הַיְּהוּדִים
  choice: des Juifs
  rationale: Dans Esther, le terme désigne ici le peuple identifié et visé par Haman; « Juifs » convient mieux que la seule idée d’habitants de Juda ou de Judée.
- source_word: וַ
  choice: Alors
  rationale: Le waw poursuit le récit avec une nuance de conséquence par rapport au verset précédent; « Alors » marque naturellement cet enchaînement.
theological_decisions: []
