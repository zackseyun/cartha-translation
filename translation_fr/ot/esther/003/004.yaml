base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: fr
  text: Lorsqu’ils lui parlaient jour après jour et qu’il ne les écoutait pas, ils en informèrent Haman pour voir si les paroles de Mardochée tiendraient[a], car il leur avait dit qu’il était juif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « si l’explication de Mardochée tiendrait ». L’hébreu dit littéralement « si les paroles de Mardochée tiendraient » : il peut s’agir soit de la raison qu’il avait donnée pour ne pas se prosterner, soit de la capacité de sa position à résister aux pressions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: Comme ils lui parlaient
  rationale: La formule narrative וַיְהִי suivie de ב et de l’infinitif marque ici le cadre temporel. « Comme ils lui parlaient » rend naturellement la simultanéité et la répétition sans reproduire lourdement « il arriva que ».
- source_word: יוֹם וָיוֹם
  choice: jour après jour
  rationale: L’expression idiomatique indique une action quotidienne répétée et persistante.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: et qu’il ne les écoutait pas
  rationale: שׁמע avec אֶל signifie écouter ou prêter attention. L’imparfait français convient à ce refus répété dans la durée.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: ils en informèrent Haman
  rationale: Le hiphil de נגד signifie faire savoir, informer ou rapporter. Le pronom « en » renvoie naturellement à la conduite et aux propos de Mardochée.
- source_word: לִרְאוֹת
  choice: pour voir
  rationale: L’infinitif exprime le but de leur démarche.
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: si les paroles de Mardochée tiendraient
  rationale: La traduction conserve la métaphore de עמד, « tenir, subsister », ainsi que l’ambiguïté de דְּבָרִים, qui peut désigner ses paroles, son explication ou la position qu’il a déclarée.
- source_word: כִּי הִגִּיד לָהֶם
  choice: car il leur avait dit
  rationale: כִּי introduit la raison du signalement à Haman. Le plus-que-parfait indique que Mardochée leur avait déjà révélé son identité.
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: qu’il était juif
  rationale: יְהוּדִי désigne ici l’identité ethnoreligieuse de Mardochée. En français moderne, l’attribut adjectival « juif » est naturel et fidèle.
