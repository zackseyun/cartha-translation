  text: אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִכָּתֵ֖ב לְ/אַבְּדָ֑/ם וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים כִּכַּר כֶּ֗סֶף אֶשְׁקוֹל֙ עַל יְדֵי֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה לְ/הָבִ֖יא אֶל גִּנְזֵ֥י הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: fr
  text: Si le roi le juge bon[a], qu’on écrive de les détruire. Je pèserai alors dix mille talents d’argent[b] et les remettrai à ceux qui accomplissent le travail[c], pour qu’ils les apportent dans les trésors du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si cela plaît au roi ».'
    reason: lexical_alternative
  - marker: b
    text: Le « talent » était une unité de poids. Dix mille talents d’argent représentaient une quantité extrêmement importante de métal précieux, et non un nombre de pièces de monnaie.
    reason: cultural_note
  - marker: c
    text: 'L’expression hébraïque peut aussi se traduire : « par l’intermédiaire de ceux qui accomplissent le travail ». Le texte ne précise pas l’identité exacte de ces personnes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette formulation française naturelle exprime l’approbation royale tout en restant proche de l’idiome hébreu. L’alternative « Si cela plaît au roi » est signalée en note.
- source_word: יִכָּתֵב
  choice: qu’on écrive
  rationale: Le niphal signifie littéralement « qu’il soit écrit ». La tournure impersonnelle française conserve l’acte d’écrire sans expliciter davantage le décret officiel sous-entendu par le contexte.
- source_word: לְאַבְּדָם
  choice: qu’ils soient exterminés
  rationale: L’infinitif avec suffixe exprime ici le contenu de l’écrit. « Exterminés » rend clairement l’intention de destruction totale dans un français digne et actuel.
- source_word: וַעֲשֶׂרֶת אֲלָפִים כִּכַּר כֶּסֶף
  choice: alors dix mille talents d’argent
  rationale: Le nombre et l’unité pondérale sont conservés sans conversion moderne incertaine. Dans la continuité française, « alors » exprime naturellement l’enchaînement de la proposition.
- source_word: אֶשְׁקוֹל
  choice: Je pèserai
  rationale: Le verbe שקל désigne concrètement l’action de peser le métal précieux; cette image est préservée plutôt que remplacée par le seul verbe « payer ».
- source_word: עַל יְדֵי עֹשֵׂי הַמְּלָאכָה
  choice: les remettrai à ceux qui sont chargés de cette affaire
  rationale: L’expression עַל יְדֵי peut évoquer la remise entre les mains de personnes ou leur rôle d’intermédiaires. Cette traduction française conserve les deux dimensions sans identifier trop précisément ces personnes comme des fonctionnaires.
- source_word: לְהָבִיא
  choice: afin qu’ils les apportent
  rationale: L’infinitif exprime le but. Le pronom « les » reprend naturellement les talents d’argent en français.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: les trésors du roi
  rationale: Le pluriel hébreu est conservé. « Trésors » désigne ici les lieux ou réserves où sont déposées les richesses royales.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le texte garde le vocabulaire concret de l’écriture, de la pesée et des trésors royaux, tout en rendant idiomatiquement la remise de l’argent aux agents chargés de l’affaire. Les ambiguïtés relatives à la formule de cour et au rôle exact des exécutants sont préservées dans les notes.
