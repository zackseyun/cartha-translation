  revision_rationale: La révision place « conformément à tout ce qu’Haman avait ordonné » en incise afin de rattacher clairement cette expression à la rédaction, non aux destinataires. « Pour chaque province/peuple » rend la portée distributive des compléments hébreux sans alourdir le français. « Cela » évite d’introduire un nom précis, tel qu’« édit », absent du texte source.
