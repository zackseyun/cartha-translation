  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: fr
  text: Alors, le treizième jour du premier mois, les scribes du roi furent convoqués, et l’on écrivit, conformément à tout ce qu’Haman avait ordonné, aux satrapes du roi, aux gouverneurs de chaque province et aux responsables de chaque peuple, pour chaque province selon son écriture[a] et pour chaque peuple selon sa langue. Cela fut écrit au nom du roi Assuérus et scellé au moyen de l’anneau à cachet du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon son système d’écriture ».'
    reason: Précise que l’« écriture » peut désigner ici les caractères ou le système graphique propre à chaque province.
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: on convoqua les scribes du roi
  rationale: Le nifal exprime ici la convocation des scribes. La tournure impersonnelle française conserve le sens passif tout en restant naturelle et adaptée au cadre administratif.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: le treizième jour du premier mois
  rationale: Cette formulation française naturelle réunit les deux indications temporelles sans ajouter le nom du mois, absent de l’hébreu.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: l’on écrivit tout ce qu’Haman avait ordonné
  rationale: Le verbe hébreu est passif et sans objet explicite; la tournure impersonnelle évite d’introduire « décret » ou « édit ». « Tout ce que » rend directement כְּכָל אֲשֶׁר.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: les satrapes du roi
  rationale: « Satrapes » est le titre administratif perse précis et établi en français.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: les gouverneurs de chaque province
  rationale: La répétition distributive de מְדִינָה est rendue idiomatiquement par « chaque province »; « gouverneurs » distingue cette fonction de celle des satrapes.
- source_word: שָׂרֵי עַם וָעָם
  choice: les hauts fonctionnaires de chaque peuple
  rationale: Dans cette énumération bureaucratique, שָׂרִים désigne des responsables officiels. « Hauts fonctionnaires » préserve leur rang sans employer le plus monarchique « princes ».
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: à chaque province selon son écriture
  rationale: כְּתָב peut désigner l’écriture ou le système graphique. « Selon son écriture » reste proche du texte et conserve cette légère amplitude de sens.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: à chaque peuple selon sa langue
  rationale: La formulation rend fidèlement la construction distributive et le sens linguistique de לָשׁוֹן.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ נִכְתָּב
  choice: Le texte fut écrit au nom du roi Assuérus
  rationale: Le français exige ici un sujet explicite; « le texte » reprend sans le définir davantage ce qui vient d’être écrit. « Assuérus » est la forme française traditionnelle et intelligible du nom.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: scellé avec l’anneau à cachet du roi
  rationale: « Anneau à cachet » exprime clairement la fonction sigillaire de טַבַּעַת dans un français moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. La syntaxe administrative de l’hébreu est clarifiée sans introduire explicitement un « édit » absent du texte. Les répétitions distributives sont rendues par « chaque », et le vocabulaire impérial demeure précis.
