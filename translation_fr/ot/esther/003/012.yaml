  terminology: « Satrapes », « gouverneurs », « Assuérus » et « anneau à cachet » conviennent. « Responsables » est plus sobre et moins interprétatif que « hauts fonctionnaires » pour שָׂרֵי. « Écriture » conserve utilement l’amplitude de כְּתָב, explicitée par la note.
