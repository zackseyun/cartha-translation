revisions:
- from: 'Alors, le treizième jour du premier mois, on convoqua les scribes du roi, et l’on écrivit tout ce qu’Haman avait ordonné aux satrapes du roi, aux gouverneurs de chaque province et aux hauts fonctionnaires de chaque peuple : à chaque province selon son écriture[a] et à chaque peuple selon sa langue. Le texte fut écrit au nom du roi Assuérus et scellé avec l’anneau à cachet du roi.'
  to: Alors, le treizième jour du premier mois, les scribes du roi furent convoqués, et l’on écrivit, conformément à tout ce qu’Haman avait ordonné, aux satrapes du roi, aux gouverneurs de chaque province et aux responsables de chaque peuple, pour chaque province selon son écriture[a] et pour chaque peuple selon sa langue. Cela fut écrit au nom du roi Assuérus et scellé au moyen de l’anneau à cachet du roi.
  rationale: La révision place « conformément à tout ce qu’Haman avait ordonné » en incise afin de rattacher clairement cette expression à la rédaction, non aux destinataires. « Pour chaque province/peuple » rend la portée distributive des compléments hébreux sans alourdir le français. « Cela » évite d’introduire un nom précis, tel qu’« édit », absent du texte source.
