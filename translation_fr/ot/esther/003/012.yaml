  - severity: low
    issue: « Hauts fonctionnaires » est plus spécifique que le terme source
    rationale: שָׂרִים désigne des chefs, responsables ou officiels ; leur rang élevé n’est pas explicitement précisé.
  revised_text: Alors, le treizième jour du premier mois, les scribes du roi furent convoqués, et l’on écrivit, conformément à tout ce qu’Haman avait ordonné, aux satrapes du roi, aux gouverneurs de chaque province et aux responsables de chaque peuple, pour chaque province selon son écriture[a] et pour chaque peuple selon sa langue. Cela fut écrit au nom du roi Assuérus et scellé au moyen de l’anneau à cachet du roi.
  revised_footnotes:
