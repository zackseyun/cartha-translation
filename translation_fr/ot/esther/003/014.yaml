review_pass:
  verdict: revise
  source_fidelity: 'Le sens administratif est globalement bien rendu : il s’agit de la diffusion officielle d’une copie d’un écrit doté de force de loi, dans toutes les provinces, à l’intention de tous les peuples afin qu’ils se tiennent prêts pour le jour fixé. Toutefois, « document » est un peu trop générique dans ce contexte ; l’écrit est clairement un édit/décret officiel.'
  naturalness: « Publiée comme loi » est compréhensible, mais « promulguée comme loi » rend plus naturellement en français le caractère officiel et juridiquement contraignant de l’acte. La phrase révisée conserve un registre administratif clair et moderne.
  terminology: « Édit » convient au cadre impérial et administratif de l’Esther et explicite légitimement la fonction de הַכְּתָב dans cette construction. « Peuples » conserve la référence aux diverses populations de l’empire. « Ce jour-là » est une adaptation française naturelle du démonstratif, renvoyant au jour déterminé par l’édit.
  issues:
