    issue: « document » est trop indéterminé dans le contexte immédiat.
    rationale: הַכְּתָב signifie littéralement l’écrit/document, mais, avec פַּתְשֶׁגֶן et l’expression « donné comme loi », il désigne un acte officiel ; « édit » est plus fidèle à sa fonction administrative.
  - severity: low
    issue: La formulation « publiée comme loi » est légèrement moins idiomatique et moins précise que « promulguée comme loi ».
    rationale: Le verbe « promulguer » exprime en français l’acte de publication officielle qui confère ou atteste la force légale, ce qui correspond bien à לְהִנָּתֵן דָּת.
  revised_text: Une copie de l’édit devait être promulguée comme loi dans chaque province[a] et portée à la connaissance de tous les peuples, afin qu’ils soient prêts pour ce jour-là.
