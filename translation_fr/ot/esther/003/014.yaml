  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָֽ/עַמִּ֑ים לִ/הְי֥וֹת עֲתִדִ֖ים לַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: fr
  text: Une copie de l’édit devait être promulguée comme loi dans chaque province[a] et portée à la connaissance de tous les peuples, afin qu’ils soient prêts pour ce jour-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète le mot « province » pour insister sur le fait que toutes sont concernées.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: une copie du document
  rationale: Le mot d’emprunt persan פַּתְשֶׁגֶן désigne la copie ou transcription d’un acte officiel, tandis que הַכְּתָב désigne ici le document écrit.
- source_word: לְהִנָּתֵן דָּת
  choice: devait être publiée comme loi
  rationale: La construction passive exprime la promulgation officielle du document, et דָּת souligne sa force légale.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: dans chaque province
  rationale: La répétition distributive hébraïque est rendue par la tournure française naturelle « chaque province »; une note signale son insistance.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: portée à la connaissance de tous les peuples
  rationale: גָּלוּי indique une communication publique; « peuples » convient aux diverses populations de l’empire.
- source_word: לִהְיוֹת עֲתִדִים
  choice: afin qu’ils soient prêts
  rationale: 'L’infinitif suivi de l’adjectif exprime ici le but: les peuples doivent se tenir prêts.'
- source_word: לַיּוֹם הַזֶּה
  choice: pour ce jour-là
  rationale: Littéralement « pour ce jour »; en français narratif, « ce jour-là » renvoie naturellement au jour précis fixé par l’édit.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le registre administratif du passage sans reproduire mécaniquement la répétition distributive hébraïque.
