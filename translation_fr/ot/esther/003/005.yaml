  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: fr
  text: Quand Haman vit que Mardochée ne s’inclinait pas et ne se prosternait pas devant lui[a], il fut rempli de fureur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne s’inclinait pas et ne lui rendait pas hommage ». L’hébreu emploie deux verbes proches mais distincts pour désigner des gestes de déférence.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Quand Haman vit
  rationale: Le waw consécutif fait progresser le récit; « Quand … vit » rend naturellement ici la relation temporelle avec la réaction qui suit.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: que Mardochée ne … pas
  rationale: אֵין suivi de participes exprime des actions duratives niées; la tournure française les présente naturellement à l’imparfait.
- source_word: כֹּרֵעַ
  choice: ne s’inclinait pas
  rationale: כרע désigne le fait de plier le genou ou de s’incliner. « S’incliner » convient au contexte d’obéissance de cour sans préciser indûment qu’il s’agenouillait.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: et ne se prosternait pas
  rationale: השתחוה évoque couramment une prosternation ou un geste d’hommage. « Se prosterner » préserve le sens corporel plus marqué et distingue ce verbe de כרע.
- source_word: לוֹ
  choice: devant lui
  rationale: Bien que le pronom signifie littéralement « à lui », « devant lui » est la construction française naturelle avec « se prosterner » et exprime la direction du geste.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: il fut rempli de fureur
  rationale: Cette formulation conserve l’image hébraïque du remplissage. « Fureur » exprime une colère intense dans un français actuel et digne.
- source_word: חֵמָה
  choice: fureur
  rationale: Dans ce contexte narratif, « fureur » traduit la violence de la colère d’Haman sans donner au terme une connotation exclusivement théologique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait rend les deux participes hébreux comme des comportements persistants observés par Haman; la répétition du nom est évitée dans la seconde proposition, conformément à l’usage naturel du français.
