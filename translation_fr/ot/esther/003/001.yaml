  variant: modern international French
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: fr
  text: Après ces événements[a], le roi Assuérus éleva en dignité Haman, fils de Hammedata, l’Agaguite[b]. Il lui accorda un rang supérieur et plaça son siège[c] au-dessus de celui de tous les hauts fonctionnaires qui étaient à son service.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Après ces choses » : l’expression hébraïque peut désigner les faits qui viennent d’être racontés.'
    reason: lexical_alternative
  - marker: b
    text: « L’Agaguite » conserve la désignation hébraïque, qui peut signaler une ascendance ou une association liée à Agag.
    reason: cultural_note
  - marker: c
    text: Ou « son trône » ; le terme hébreu peut désigner un siège d’autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: Cette formule temporelle introduit naturellement un nouveau développement du récit. « Événements » restitue ici le sens contextuel de דְּבָרִים dans un français courant.
- source_word: גִּדַּל
  choice: éleva en dignité
  rationale: Dans le contexte de la cour, le verbe désigne une élévation de statut. Cette formulation conserve l’image d’élévation tout en indiquant clairement une promotion officielle.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: le roi Assuérus
  rationale: Ordre naturel du titre et du nom en français, avec la forme française traditionnelle du nom.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: Haman, fils de Hammedata
  rationale: Les noms propres et le patronyme sont explicitement conservés selon les conventions françaises de translittération.
- source_word: הָאֲגָגִי
  choice: l’Agaguite
  rationale: Cette désignation gentilice ou clanique conserve le lien formel avec Agag sans préciser davantage une relation historique incertaine.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: Il lui accorda un rang supérieur
  rationale: Le second verbe prolonge l’idée d’élévation sans être absorbé par גִּדַּל. La formulation française rend clairement la préséance honorifique et administrative.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: plaça son siège
  rationale: כִּסֵּא peut désigner un trône ou un siège officiel. « Siège » convient à la position d’un haut dignitaire et évite de faire de Haman un roi.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: au-dessus de celui de tous les hauts fonctionnaires
  rationale: La comparaison des sièges exprime une supériorité de rang. « Hauts fonctionnaires » rend clairement שָׂרִים dans le cadre de la cour perse.
- source_word: אֲשֶׁר אִתּוֹ
  choice: qui étaient à son service
  rationale: Le pronom renvoie le plus naturellement au roi. Cette expression idiomatique explicite l’appartenance des fonctionnaires à sa cour sans modifier le sens.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition hébraïque des verbes d’élévation est préservée par deux formulations distinctes. « Siège » est retenu dans le texte principal pour la dignité officielle de Haman, tandis que « trône » figure en note comme possibilité lexicale.
