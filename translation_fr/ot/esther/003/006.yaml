  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: fr
  text: Mais il estima indigne de lui de porter la main sur Mardochée seul, car on lui avait appris à quel peuple Mardochée appartenait[a]. Aman chercha donc à exterminer tous les Juifs dans tout le royaume d’Assuérus, le peuple de Mardochée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le peuple de Mardochée », c’est-à-dire le peuple auquel Mardochée appartenait.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: il estima indigne de lui
  rationale: Cette formulation française naturelle exprime le mépris et l’idée qu’une action limitée à Mardochée était, aux yeux d’Aman, indigne de son ambition vengeresse.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: porter la main sur
  rationale: L’expression conserve l’image concrète de la main tout en signifiant naturellement une action violente contre quelqu’un.
- source_word: לְבַדּוֹ
  choice: seul
  rationale: Le terme marque le contraste entre Mardochée pris isolément et l’ensemble de son peuple désormais visé.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: car on lui avait appris
  rationale: Le plus-que-parfait respecte l’antériorité de l’information reçue; le sujet indéfini hébreu se rend naturellement par « on ».
- source_word: אֶת עַם מָרְדֳּכָי
  choice: à quel peuple Mardochée appartenait
  rationale: Cette formulation explicite en français moderne le sens ethnique de l’expression littérale « le peuple de Mardochée ».
- source_word: וַיְבַקֵּשׁ
  choice: chercha donc
  rationale: Le verbe exprime une volonté délibérée et un projet poursuivi, sans affirmer encore sa réalisation; « donc » rend le lien narratif avec le motif précédent.
- source_word: לְהַשְׁמִיד
  choice: à exterminer
  rationale: Dans le contexte d’un projet visant tous les Juifs du royaume, « exterminer » communique clairement la destruction collective totale envisagée.
- source_word: כָּל הַיְּהוּדִים
  choice: tous les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif de la diaspora perse, et non simplement les habitants de Juda.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: établis dans tout le royaume d’Assuérus
  rationale: Cette tournure idiomatique indique que les Juifs concernés étaient dispersés à travers l’ensemble du royaume.
- source_word: עַם מָרְדֳּכָי
  choice: le peuple de Mardochée
  rationale: La reprise littérale en apposition préserve la répétition rhétorique de l’hébreu et identifie le groupe visé à cause de Mardochée.
theological_decisions: []
