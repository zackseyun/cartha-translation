  yaml_path: translation/ot/esther/003/003.yaml
  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: fr
  text: 'Alors les serviteurs du roi qui se trouvaient à la porte du roi dirent à Mardochée : « Pourquoi enfreins-tu l’ordre du roi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors … dirent
  rationale: Le wayyiqtol fait progresser le récit. « Alors » exprime naturellement cette succession en français, et le passé simple convient au registre narratif.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: les serviteurs du roi
  rationale: עֶבֶד désigne ici des serviteurs attachés à la cour. « Serviteurs » conserve le terme hébreu sans préciser indûment qu’ils seraient esclaves ou hauts fonctionnaires.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: qui se trouvaient à la porte du roi
  rationale: La proposition les identifie par leur emplacement. « À la porte du roi » est naturel en français et conserve la répétition de « roi » présente dans l’hébreu.
- source_word: לְמָרְדֳּכָי
  choice: à Mardochée
  rationale: Le lamed introduit le destinataire de leurs paroles; « Mardochée » est la forme française traditionnelle du nom.
- source_word: מַדּוּעַ אַתָּה
  choice: Pourquoi …-tu
  rationale: L’interrogatif demande directement la raison de la conduite de Mardochée; le tutoiement correspond au masculin singulier explicite אַתָּה.
- source_word: עוֹבֵר אֵת
  choice: enfreins-tu
  rationale: Dans cette construction avec « l’ordre du roi », עבר signifie franchir la limite imposée, donc violer ou transgresser. « Enfreindre » rend ce sens avec précision dans un français moderne et digne.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: l’ordre du roi
  rationale: מִצְוָה signifie « commandement, ordre ». Dans un contexte royal plutôt que cultuel, « ordre » est idiomatique et évite une connotation religieuse injustifiée.
