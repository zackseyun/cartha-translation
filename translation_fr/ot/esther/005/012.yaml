- from: 'Puis Haman ajouta : « La reine Esther n’a fait venir personne d’autre que moi avec le roi au banquet qu’elle avait préparé. Et demain encore, je suis invité par elle avec le roi. »'
  to: 'Puis Haman dit : « De fait, la reine Esther n’a fait venir au banquet qu’elle avait préparé, avec le roi, personne d’autre que moi. Et demain encore, je suis invité par elle avec le roi. »'
  rationale: Révision limitée visant à restituer l’emphase initiale, à éviter une amplification par « ajouta » et surtout à lever l’ambiguïté syntaxique concernant la présence conjointe de Haman et du roi. Le sens, le registre et l’absence de note du projet sont conservés.
