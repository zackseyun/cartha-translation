base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: fr
  text: 'Puis Haman dit : « De fait, la reine Esther n’a fait venir au banquet qu’elle avait préparé, avec le roi, personne d’autre que moi. Et demain encore, je suis invité par elle avec le roi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Puis Haman ajouta
  rationale: Le waw narratif fait progresser le récit. Dans ce contexte, où Haman poursuit son discours, « ajouta » est naturel en français et rend la continuité de sa prise de parole.
- source_word: אַף לֹא
  choice: n’a fait venir personne d’autre
  rationale: La tournure négative avec l’idée d’exclusivité souligne avec emphase que personne d’autre n’a été admis; la formulation française fait ressortir la vantardise de Haman.
- source_word: הֵבִיאָה
  choice: a fait venir
  rationale: Le hiphil signifie littéralement « faire venir ». Cette traduction conserve l’image concrète de l’hébreu tout en convenant au contexte d’un banquet.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: la reine Esther
  rationale: Ordre usuel du titre et du nom en français moderne.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: au banquet
  rationale: מִשְׁתֶּה désigne un festin ou banquet, souvent associé au vin; « banquet » convient au cadre royal.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: qu’elle avait préparé
  rationale: Le verbe signifie littéralement « faire ». Pour un banquet, « préparer » est idiomatique; le plus-que-parfait situe naturellement cette préparation avant le récit de Haman.
- source_word: כִּי אִם אוֹתִי
  choice: personne d’autre que moi
  rationale: La construction exprime l’exception et l’exclusivité; cette tournure est claire et idiomatique en français.
- source_word: וְגַם לְמָחָר
  choice: Et demain encore
  rationale: « encore » rend la valeur additive de גַם et fait ressortir la satisfaction de Haman d’être convié une nouvelle fois.
- source_word: קָרוּא לָהּ
  choice: je suis invité par elle
  rationale: קָרוּא signifie littéralement « appelé », mais dans le contexte d’un repas il a le sens idiomatique d’« invité »; לָהּ désigne celle qui lance l’invitation.
- source_word: עִם הַמֶּלֶךְ
  choice: avec le roi
  rationale: Rend directement la présence conjointe de Haman et du roi, sans ajouter une nuance absente du texte.
