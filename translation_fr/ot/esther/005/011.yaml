    rationale: Le mot désigne des responsables ou dignitaires, sans que l’adjectif « hauts » soit explicitement présent. « Dignitaires » est à la fois naturel et moins interprétatif.
  - severity: low
    issue: « leur parla de » pour וַיְסַפֵּר
    rationale: La formulation est possible, mais le verbe hébreu marque un récit ou une relation détaillée. « Leur fit le récit de » reflète mieux cette nuance.
