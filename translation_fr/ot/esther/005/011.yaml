source:
  edition: WLC
  text: וַ/יְסַפֵּ֨ר לָ/הֶ֥ם הָמָ֛ן אֶת כְּב֥וֹד עָשְׁר֖/וֹ וְ/רֹ֣ב בָּנָ֑י/ו וְ/אֵת֩ כָּל אֲשֶׁ֨ר גִּדְּל֤/וֹ הַ/מֶּ֨לֶךְ֙ וְ/אֵ֣ת אֲשֶׁ֣ר נִשְּׂא֔/וֹ עַל הַ/שָּׂרִ֖ים וְ/עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: fr
  text: Haman leur fit le récit de l’éclat de sa fortune[a], de ses nombreux fils[b], de tout ce que le roi avait fait pour l’élever en dignité[c], et de la manière dont il l’avait élevé au-dessus des dignitaires et des serviteurs du roi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la splendeur de ses richesses ». L’expression hébraïque souligne le caractère impressionnant de la fortune d’Haman.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit précisément « fils », et non « enfants ».
    reason: lexical_clarification
  - marker: c
    text: 'Littéralement : « pour le rendre grand » ; on pourrait aussi traduire : « pour le promouvoir ».'
    reason: lexical_alternative
  - marker: d
    text: Ou « l’avait placé à un rang supérieur à celui des dignitaires et des serviteurs du roi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: leur parla de
  rationale: Le verbe ספר au wayyiqtol introduit ici le récit détaillé et vantard d’Haman. « Leur parla de » est naturel en français et convient à l’énumération qui suit.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: l’éclat de sa richesse
  rationale: כָּבוֹד peut exprimer la gloire, l’honneur ou la splendeur. Associé à la richesse, il souligne son caractère impressionnant et ostentatoire ; « l’éclat » rend cette nuance dans un français courant et digne.
- source_word: רֹב בָּנָיו
  choice: ses nombreux fils
  rationale: רֹב indique le grand nombre ou l’abondance, et בָּנִים désigne précisément les fils. Cette formulation conserve les deux éléments sans lourdeur.
- source_word: גִּדְּלוֹ
  choice: avait fait pour le rendre puissant
  rationale: Le piel de גדל signifie ici rendre grand, élever ou promouvoir. « Rendre puissant » exprime l’importance politique conférée à Haman tout en maintenant l’action du roi.
- source_word: נִשְּׂאוֹ עַל
  choice: l’avait élevé au-dessus de
  rationale: נשא avec עַל marque ici une élévation de rang par rapport à d’autres. « Élevé au-dessus de » conserve clairement cette hiérarchie.
- source_word: הַשָּׂרִים
  choice: les hauts fonctionnaires
  rationale: שָׂרִים désigne des dirigeants, dignitaires ou fonctionnaires. Dans le cadre de la cour perse, « hauts fonctionnaires » est clair et n’implique pas nécessairement une noblesse héréditaire.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: les serviteurs du roi
  rationale: L’expression désigne les personnes au service du roi. La traduction littérale convient au contexte de cour sans imposer ici le sens plus étroit d’esclaves.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, naturel et digne. La phrase garde la progression du discours vantard d’Haman : richesse, descendance nombreuse, grandeur reçue du roi, puis supériorité hiérarchique. « Hauts fonctionnaires » situe clairement les שָׂרִים dans l’administration royale perse.'
