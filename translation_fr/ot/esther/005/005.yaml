  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַהֲרוּ֙ אֶת הָמָ֔ן לַ/עֲשׂ֖וֹת אֶת דְּבַ֣ר אֶסְתֵּ֑ר וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ וְ/הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: fr
  text: 'Alors le roi dit : « Faites vite venir Haman, afin de répondre à la demande d’Esther[a]. » Le roi et Haman vinrent donc au banquet qu’Esther avait préparé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « afin de faire la parole d’Esther ». Le mot hébreu rendu par « parole » peut désigner ce qu’elle a demandé ou indiqué.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת הָמָן
  choice: Faites vite venir Haman
  rationale: L’impératif pluriel s’adresse vraisemblablement aux serviteurs et exige une action prompte concernant Haman. Cette formulation française explicite naturellement le déplacement sous-entendu sans affaiblir l’urgence.
- source_word: לַעֲשׂוֹת אֶת דְּבַר אֶסְתֵּר
  choice: afin que la parole d’Esther soit exécutée
  rationale: La formulation conserve le terme דָּבָר (« parole », mais aussi « demande » ou « affaire ») ainsi que l’idée de sa mise à exécution, sans réduire silencieusement son champ de sens à la seule notion de demande.
- source_word: וַיָּבֹא
  choice: vinrent
  rationale: Le verbe בוא peut se rendre par « venir » ou « aller » selon le point de vue. « Vinrent au banquet » suit ici naturellement la perspective narrative et convient au pluriel composé « le roi et Haman ».
- source_word: הַמִּשְׁתֶּה
  choice: le banquet
  rationale: מִשְׁתֶּה désigne un festin, souvent associé à la boisson. « Banquet » est actuel, digne et adapté au cadre royal.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: qu’Esther avait préparé
  rationale: Avec un banquet, עשה signifie naturellement « préparer » ou « organiser ». Le plus-que-parfait marque que la préparation précède l’arrivée des convives.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Faites vite venir » convient à un ordre royal adressé à plusieurs serviteurs. Le maintien de « parole » dans le texte principal préserve la formulation hébraïque, tandis que la note en précise le sens idiomatique possible.
