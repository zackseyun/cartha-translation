  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: fr
  text: « Si j’ai trouvé grâce aux yeux du roi[a], et s’il plaît au roi d’accorder ma requête et d’exaucer ma demande, que le roi et Haman viennent au banquet que je préparerai pour eux. Demain, je ferai selon la parole du roi[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus idiomatique : « Si j’ai obtenu la faveur du roi. »'
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est elliptique. Elle signifie probablement qu’Esther donnera suite à la parole du roi en lui faisant connaître sa requête le lendemain.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: j’ai trouvé grâce aux yeux de
  rationale: Conserve l’image de l’idiome hébreu tout en restant compréhensible en français. Dans ce contexte de cour, « grâce » désigne l’accueil favorable du roi, non une notion théologique technique.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: s’il plaît au roi
  rationale: Équivalent français naturel et digne de la formule de déférence exprimant ce qui paraît bon ou agréable au roi.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: d’accorder ma requête
  rationale: Rend naturellement l’idée littérale de « donner ma requête » dans le registre d’une demande adressée au souverain.
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: et d’exaucer ma demande
  rationale: Le verbe hébreu signifie littéralement « faire »; « exaucer » est idiomatique avec une demande et maintient la variation entre les deux expressions parallèles.
- source_word: שְׁאֵלָתִי / בַּקָּשָׁתִי
  choice: requête / demande
  rationale: Deux termes français distincts reflètent les deux noms hébreux apparentés et le parallélisme formel du discours d’Esther.
- source_word: יָבֹא
  choice: que ... viennent
  rationale: L’imparfait hébreu a ici une valeur jussive; cette tournure exprime en français une invitation respectueuse.
- source_word: הַמִּשְׁתֶּה
  choice: le banquet
  rationale: Le mot désigne un festin, souvent associé au vin; « banquet » convient au cadre royal sans surcharger la traduction.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: que je préparerai pour eux
  rationale: Avec un banquet, le verbe général « faire » se rend naturellement par « préparer » en français.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: Demain, je ferai selon la parole du roi
  rationale: Cette formulation proche de l’hébreu préserve l’ellipse et son ouverture, sans préciser indûment qu’Esther « répondra » ou révélera alors sa requête.
