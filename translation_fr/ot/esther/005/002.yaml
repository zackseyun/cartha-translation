source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/רְא֨וֹת הַ/מֶּ֜לֶךְ אֶת אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה עֹמֶ֨דֶת֙ בֶּֽ/חָצֵ֔ר נָשְׂאָ֥ה חֵ֖ן בְּ/עֵינָ֑י/ו וַ/יּ֨וֹשֶׁט הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֗ר אֶת שַׁרְבִ֤יט הַ/זָּהָב֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/תִּקְרַ֣ב אֶסְתֵּ֔ר וַ/תִּגַּ֖ע בְּ/רֹ֥אשׁ הַ/שַּׁרְבִֽיט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: fr
  text: Lorsque le roi vit la reine Esther debout dans la cour[a], elle trouva grâce à ses yeux[b]. Alors le roi tendit à Esther le sceptre d’or qu’il tenait à la main. Esther s’approcha et toucha l’extrémité du sceptre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la cour intérieure » ; le mot hébreu peut désigner une cour ou une cour intérieure selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Expression hébraïque signifiant qu’elle reçut un regard favorable de sa part.
    reason: idiom_explanation
  - marker: c
    text: 'Littéralement : « la tête du sceptre » ; on peut aussi traduire « le haut du sceptre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Lorsque … vit
  rationale: La construction introduit une proposition temporelle. « Lorsque » rend naturellement l’enchaînement narratif sans reproduire lourdement « et il arriva que ».
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: la reine Esther
  rationale: Le français place naturellement le titre avant le nom. Cette formulation actuelle et digne conserve pleinement l’apposition hébraïque.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: debout dans la cour
  rationale: Le participe décrit la posture d’Esther. Dans le contexte du palais, « cour » désigne naturellement l’espace intérieur ou la cour du palais, tout en laissant ouverte la nuance de « cour intérieure » donnée par le contexte précédent.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: elle trouva grâce à ses yeux
  rationale: Cette tournure française conserve l’image hébraïque du regard favorable et reste compréhensible dans un registre biblique moderne.
- source_word: וַיּוֹשֶׁט
  choice: tendit
  rationale: Le verbe exprime le geste consistant à étendre un objet vers quelqu’un. « Tendit » est précis et naturel en français.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: le sceptre d’or
  rationale: « Sceptre d’or » est la désignation française idiomatique de cet emblème royal.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: qu’il tenait à la main
  rationale: L’hébreu dit littéralement que le sceptre était « dans sa main ». La formulation choisie exprime clairement et naturellement cette relation en français.
- source_word: וַתִּקְרַב
  choice: Esther s’approcha
  rationale: Le verbe indique qu’Esther réduit la distance en réponse au geste royal. « S’approcha » rend ce mouvement sans ajout interprétatif.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: toucha l’extrémité du sceptre
  rationale: רֹאשׁ signifie littéralement « tête », mais appliqué à un objet allongé il désigne son haut ou son extrémité. « Extrémité » est naturel sans supposer que le sceptre se terminait en pointe.
