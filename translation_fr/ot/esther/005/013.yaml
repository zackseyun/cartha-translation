  yaml_path: translation/ot/esther/005/013.yaml
  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: fr
  text: Pourtant, tout cela ne vaut rien pour moi chaque fois que je vois Mardochée, le Juif, assis à la porte du roi[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et tout cela n’a aucune valeur pour moi chaque fois que je vois Mardochée, le Juif, assis à la porte du roi. »'
    reason: lexical_alternative
  - marker: b
    text: « Le Juif » peut aussi se traduire par « le Judéen » ; ici, l’expression souligne très probablement l’identité juive de Mardochée dans le contexte de la cour perse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: Pourtant, tout cela
  rationale: La conjonction וְ peut signifier simplement « et », mais elle introduit ici un contraste avec l’énumération précédente des honneurs d’Haman. « Pourtant » rend naturellement cette valeur adversative, tandis que « tout cela » conserve כָל זֶה.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: ne vaut rien pour moi
  rationale: L’expression nie la valeur ou l’avantage que tout cela représente aux yeux d’Haman. Cette formulation française est idiomatique et garde la force de son mécontentement sans ajouter l’idée plus interprétative de satisfaction.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: chaque fois que
  rationale: La locution signifie littéralement « à tout moment où » et présente une situation répétée. « Chaque fois que » exprime clairement cette répétition en français moderne.
- source_word: רֹאֶה
  choice: je vois
  rationale: Le participe accompagné du pronom אֲנִי exprime ici une action répétée ou continue dans la proposition temporelle.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom propre biblique.
- source_word: הַיְּהוּדִי
  choice: le Juif
  rationale: Dans le cadre perse du livre d’Esther, le terme désigne très probablement l’identité ethnique de Mardochée. « Judéen » demeure lexicalement possible et est signalé en note.
- source_word: יוֹשֵׁב
  choice: assis
  rationale: Le participe décrit directement la posture de Mardochée à la porte du roi; « assis » conserve l’image concrète du texte.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: à la porte du roi
  rationale: L’expression désigne l’espace de la porte lié au palais et à l’administration royale. « À la porte du roi » est naturel en français et reste proche de la formulation hébraïque.
