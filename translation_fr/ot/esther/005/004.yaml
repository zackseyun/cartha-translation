  text: וַ/תֹּ֣אמֶר אֶסְתֵּ֔ר אִם עַל הַ/מֶּ֖לֶךְ ט֑וֹב יָב֨וֹא הַ/מֶּ֤לֶךְ וְ/הָמָן֙ הַ/יּ֔וֹם אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשִׂ֥יתִי לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: fr
  text: 'Esther répondit : « Si le roi le juge bon, que le roi et Haman viennent aujourd’hui au banquet que j’ai préparé pour lui.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que j’ai fait pour lui ». Le pronom singulier « lui » désigne vraisemblablement le roi, bien qu’Haman soit lui aussi invité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette tournure française naturelle conserve le caractère déférent de la formule de cour et reste proche de l’idée hébraïque de ce qui est « bon » aux yeux du roi.
- source_word: יָבוֹא
  choice: que ... viennent
  rationale: L’imparfait hébreu a ici une valeur volitive dans une invitation respectueuse. Le français emploie naturellement le subjonctif après « que »; le pluriel est requis puisque le sujet coordonné est « le roi et Haman ».
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: le roi et Haman
  rationale: La traduction maintient le titre répété dans l’hébreu sans ajouter le nom personnel du roi.
- source_word: הַיּוֹם
  choice: aujourd’hui
  rationale: Équivalent moderne et direct qui conserve l’immédiateté temporelle de l’invitation.
- source_word: הַמִּשְׁתֶּה
  choice: au banquet
  rationale: « Banquet » convient au cadre royal et rend naturellement מִשְׁתֶּה, repas festif où la consommation de vin peut être sous-entendue sans devoir être explicitée.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: que j’ai préparé pour lui
  rationale: Avec un banquet, « préparer » est plus idiomatique que « faire ». Le singulier « lui » préserve le pronom hébreu, qui renvoie très probablement au roi malgré l’invitation adressée aussi à Haman.
