  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: fr
  text: 'Alors Esther répondit : « Voici ma requête et ma demande : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן
  choice: Alors … répondit
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, et « répondit » conserve le sens courant de ענה dans l’introduction d’une prise de parole.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: וַתֹּאמַר
  choice: intégré à la ponctuation après « répondit »
  rationale: 'La formule hébraïque littérale « répondit et dit » est idiomatique en hébreu mais lourde en français moderne. Les deux verbes introduisent ensemble la réponse directe; les rendre par « répondit : » en préserve naturellement la fonction discursive.'
- source_word: שְׁאֵלָתִי
  choice: ma requête
  rationale: Dans ce contexte d’appel formel adressé au roi, le nom désigne ce qu’Esther sollicite plutôt qu’une simple question. « Requête » convient au registre de cour et garde une nuance plus formelle que le second terme.
- source_word: וּבַקָּשָׁתִי
  choice: et ma demande
  rationale: « Demande » exprime clairement l’appel d’Esther tout en maintenant la paire de quasi-synonymes et une légère distinction avec « requête ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et naturel. La formule hébraïque redondante d’introduction à la parole est rendue idiomatiquement, tandis que la paire formelle « requête et demande » est conservée. « Voici » prépare la formulation annoncée au verset suivant et rend naturelle en français la phrase nominale hébraïque.
