  source_fidelity: 'Le texte rend fidèlement la progression narrative (« Alors »), l’introduction de parole par ענה et la paire nominale שְׁאֵלָתִי / בַּקָּשָׁתִי. « Requête et demande » conserve utilement le parallélisme de deux quasi-synonymes dans le contexte d’un appel formel au roi. L’omission de l’équivalent distinct de « et dit » est acceptable en français moderne : « répondit : » remplit naturellement la fonction de la formule hébraïque « répondit et dit ».'
