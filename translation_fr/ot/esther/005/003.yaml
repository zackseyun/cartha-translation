base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: fr
  text: 'Alors le roi lui dit : « Qu’y a-t-il, reine Esther[a] ? Quelle est ta demande[b] ? Jusqu’à la moitié du royaume, elle te sera accordée[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’est-ce qui te préoccupe, reine Esther ? » L’expression hébraïque signifie littéralement : « Quoi pour toi ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « requête ».'
    reason: lexical_alternative
  - marker: c
    text: Il s’agit d’une formule royale conventionnelle exprimant une grande générosité, et non nécessairement d’une offre littérale de partager le royaume.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהּ הַמֶּלֶךְ
  choice: Alors le roi lui dit
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque naturellement la succession, tandis que « lui dit » rend explicitement לָהּ.
- source_word: מַה לָּךְ
  choice: Qu’y a-t-il
  rationale: Cette tournure française naturelle conserve l’ouverture de l’expression hébraïque « quoi pour toi ? » sans imposer l’idée qu’Esther est troublée.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: reine Esther
  rationale: En français moderne, le titre précède naturellement le nom propre dans cette apostrophe.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Quelle est ta demande ?
  rationale: בַּקָּשָׁה désigne une demande ou requête. « Demande » est clair et courant, tout en convenant au contexte royal.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Jusqu’à la moitié du royaume
  rationale: La formulation préserve l’étendue exprimée par עַד et la tournure royale emphatique.
- source_word: וְיִנָּתֵן לָךְ
  choice: elle te sera accordée
  rationale: Le nifal exprime ici une promesse passive. Le pronom féminin renvoie naturellement en français à la demande, objet implicite de ce qui sera accordé.
