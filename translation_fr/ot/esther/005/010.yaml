  text: וַ/יִּתְאַפַּ֣ק הָמָ֔ן וַ/יָּב֖וֹא אֶל בֵּית֑/וֹ וַ/יִּשְׁלַ֛ח וַ/יָּבֵ֥א אֶת אֹהֲבָ֖י/ו וְ/אֶת זֶ֥רֶשׁ אִשְׁתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/010.yaml
  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: fr
  text: Mais Haman se maîtrisa[a] et alla chez lui[b]. Puis il envoya chercher ses amis et Zéresh, sa femme, et les fit venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se contint » ou « se retint ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « alla à sa maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: se maîtrisa
  rationale: Le hitpael de אפק exprime ici la maîtrise de soi face à la colère évoquée au verset précédent. « Se maîtrisa » est naturel en français et conserve le sens réfléchi.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: rentra chez lui
  rationale: L’expression décrit le déplacement de Haman vers sa propre maison. « Rentra chez lui » rend naturellement le mouvement en français; « alla chez lui » reste possible si l’on veut suivre plus littéralement la forme hébraïque.
- source_word: וַיִּשְׁלַח
  choice: envoya chercher
  rationale: Le verbe « envoya », suivi du causatif « fit venir », implique qu’Haman dépêcha quelqu’un pour convoquer les personnes nommées. Le français idiomatique réunit les deux actions dans « envoya chercher ».
- source_word: וַיָּבֵא
  choice: chercher
  rationale: Le hiphil de בוא signifie « faire venir ». Avec וַיִּשְׁלַח, la tournure française « envoya chercher » exprime clairement cette causalité sans alourdir la phrase.
- source_word: אֹהֲבָיו
  choice: ses amis
  rationale: Dans cet emploi nominal au pluriel, le terme désigne les proches ou amis d’Haman plutôt que, littéralement, « ceux qui l’aimaient ».
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: sa femme Zéresh
  rationale: Cette disposition est la plus naturelle en français moderne, tout en conservant l’identification explicite de Zéresh comme épouse d’Haman.
- source_word: וַ
  choice: Mais / Puis
  rationale: 'Le premier waw prend une valeur adversative en contexte: malgré sa colère, Haman se maîtrise. Le waw suivant poursuit la séquence narrative et se rend naturellement par « Puis ».'
theological_decisions: []
