source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ לְ/אֶסְתֵּר֙ בְּ/מִשְׁתֵּ֣ה הַ/יַּ֔יִן מַה שְּׁאֵלָתֵ֖/ךְ וְ/יִנָּ֣תֵֽן לָ֑/ךְ וּ/מַה בַּקָּשָׁתֵ֛/ךְ עַד חֲצִ֥י הַ/מַּלְכ֖וּת וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: fr
  text: 'Au cours du banquet où l’on buvait du vin, le roi dit à Esther : « Quelle est ta requête ? Elle te sera accordée[a]. Quelle est ta demande ? Même jusqu’à la moitié du royaume[b], ce sera fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « elle te sera donnée ».'
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « jusqu’à la moitié du royaume » ; il ne précise pas « de mon royaume ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: Au cours du banquet où l’on buvait du vin
  rationale: Cette formulation naturelle en français conserve à la fois l’idée du banquet exprimée par מִשְׁתֶּה et la mention explicite du vin.
- source_word: שְּׁאֵלָתֵךְ
  choice: ta requête
  rationale: Dans ce contexte royal, le terme désigne ce qu’Esther sollicite, et non une simple question. « Requête » convient au registre de la cour et permet de le distinguer légèrement de בַּקָּשָׁה.
- source_word: וְיִנָּתֵן לָךְ
  choice: Elle te sera accordée
  rationale: Le passif de נתן exprime ici l’assurance que la requête sera donnée ou agréée. « Accordée » rend naturellement cette formule en français.
- source_word: בַּקָּשָׁתֵךְ
  choice: ta demande
  rationale: « Demande » rend le souhait présenté au roi tout en préservant une légère variation lexicale par rapport à « requête ».
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Même jusqu’à la moitié du royaume
  rationale: La formulation conserve l’hyperbole royale ainsi que l’absence, dans l’hébreu, d’un possessif équivalant à « mon ».
- source_word: וְתֵעָשׂ
  choice: ce sera fait
  rationale: Cette tournure concise conserve l’expression impersonnelle et l’assurance royale que la demande sera exécutée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement correspond à l’adresse directe du roi à Esther. La répétition rhétorique entre « requête » et « demande » est préservée, ainsi que la formulation hyperbolique et l’absence de possessif devant « royaume ».
