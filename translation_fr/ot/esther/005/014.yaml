base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: fr
  text: 'Alors Zéresh, sa femme, et tous ses amis lui dirent : « Qu’on dresse une potence[a] haute de cinquante coudées[b]. Au matin, dis au roi d’y faire pendre Mardochée[c]. Puis va avec le roi au banquet, en te réjouissant. » Cette proposition plut à Haman, et il fit dresser la potence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pieu » ou « un poteau ». Le mot hébreu עֵץ peut désigner du bois, un arbre ou une structure de bois destinée à l’exécution ; sa forme exacte reste incertaine.
    reason: lexical_alternative
  - marker: b
    text: Cinquante coudées correspondent à environ 23 mètres.
    reason: cultural_note
  - marker: c
    text: Ou « d’y suspendre Mardochée » ou « d’y empaler Mardochée ». L’expression hébraïque peut évoquer la suspension ou l’exposition d’une personne sur une structure de bois ; la méthode exacte d’exécution est discutée.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: ses amis
  rationale: Le participe signifie littéralement « ceux qui l’aiment », mais désigne ici naturellement les proches ou compagnons d’Haman.
- source_word: יַעֲשׂוּ עֵץ
  choice: Qu’on dresse une potence
  rationale: Le pluriel sans sujet exprimé se rend naturellement en français par « qu’on ». « Dresser » convient à l’installation d’une haute structure de bois, tandis que « potence » exprime sa fonction dans le récit sans prétendre en préciser entièrement la forme.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: haute de cinquante coudées
  rationale: L’unité ancienne est conservée dans le texte, avec une équivalence moderne en note.
- source_word: וּבַבֹּקֶר
  choice: Demain matin
  rationale: Littéralement « au matin » ; dans la progression narrative, il s’agit du lendemain matin. Cette formulation est idiomatique et temporellement claire en français.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: dis au roi
  rationale: Rend directement l’impératif hébreu sans transformer explicitement la parole en demande, même si une autorisation royale est impliquée par le contexte.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: d’y faire pendre Mardochée
  rationale: Le pluriel à agents non précisés se rend naturellement par une construction factitive. La possibilité d’une mise au poteau ou d’un empalement est conservée en note.
- source_word: וּבֹא עִם־הַמֶּלֶךְ אֶל־הַמִּשְׁתֶּה שָׂמֵחַ
  choice: Puis accompagne joyeusement le roi au banquet
  rationale: Cette tournure française exprime le fait d’aller avec le roi et rend la valeur adverbiale de שָׂמֵחַ.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: Cette proposition plut à Haman
  rationale: Rend clairement l’idiome hébreu selon lequel la chose parut bonne ou agréable à Haman.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: il fit dresser la potence
  rationale: La forme hébraïque signifie littéralement qu’il la fit ou la fabriqua ; en français narratif, le factitif indique naturellement qu’Haman en ordonna la construction sans surdéterminer son intervention personnelle.
