  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: fr
  text: Ce jour-là, Haman sortit joyeux, le cœur content. Mais lorsqu’il vit Mardochée à la porte du roi et constata que celui-ci ne se levait pas et ne tremblait pas devant lui[a], Haman fut rempli de fureur contre Mardochée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne se levait pas et ne manifestait aucune crainte devant lui ».'
    reason: La portée de זוע peut être physique (« trembler », « s’agiter ») ou décrire une manifestation de crainte; la variante préserve cette ambiguïté lexicale.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: joyeux, le cœur content
  rationale: Cette formulation naturelle conserve les deux éléments de l’expression hébraïque et décrit l’état d’allégresse d’Haman sans lourdeur littérale.
- source_word: בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Rend directement la précision temporelle de l’hébreu dans un français courant.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: à la porte du roi
  rationale: Dans ce contexte, « porte » désigne l’entrée ou le complexe administratif royal; la préposition « à » est idiomatique en français tout en laissant ouverte l’étendue exacte du lieu.
- source_word: וְלֹא קָם
  choice: ne se levait pas
  rationale: Le verbe désigne ici le geste de se lever par déférence; l’imparfait s’intègre à la perception de la conduite de Mardochée.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: ne tremblait pas devant lui
  rationale: זוע peut exprimer le tremblement, l’agitation ou la peur. Le texte principal conserve l’image forte du tremblement, tandis que la note signale l’autre nuance contextuelle possible.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: fut rempli de fureur
  rationale: Préserve la construction hébraïque et exprime l’intensité de חֵמָה dans un registre digne et actuel.
- source_word: עַל מָרְדֳּכַי
  choice: contre Mardochée
  rationale: Avec un terme de colère, עַל marque naturellement la cible de l’hostilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Mardochée » suit la forme française traditionnelle du nom. La répétition des noms, caractéristique du récit hébreu, est partiellement allégée par « celui-ci » sans obscurcir les référents.
