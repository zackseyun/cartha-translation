translation_notes:
  register: Français international moderne, narratif et digne. La traduction conserve les repères spatiaux répétés du texte hébreu, tout en variant prudemment « palais », « résidence » et « bâtiment » pour rendre les différentes occurrences de בַּיִת sans obscurité ni archaïsme.
