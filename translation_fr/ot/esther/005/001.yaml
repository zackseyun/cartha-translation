source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/תִּלְבַּ֤שׁ אֶסְתֵּר֙ מַלְכ֔וּת וַֽ/תַּעֲמֹ֞ד בַּ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/פְּנִימִ֔ית נֹ֖כַח בֵּ֣ית הַ/מֶּ֑לֶךְ וְ֠/הַ/מֶּלֶךְ יוֹשֵׁ֞ב עַל כִּסֵּ֤א מַלְכוּת/וֹ֙ בְּ/בֵ֣ית הַ/מַּלְכ֔וּת נֹ֖כַח פֶּ֥תַח הַ/בָּֽיִת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: fr
  text: Le troisième jour, Esther revêtit ses vêtements royaux[a] et se tint dans la cour intérieure du palais du roi, en face de la résidence du roi, tandis que le roi était assis sur son trône royal, dans le palais royal[b], en face de l’entrée du palais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « revêtit la royauté », c’est-à-dire une tenue ou des insignes royaux.'
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu traduit ici par « palais » signifie littéralement « maison » et peut désigner un palais dans ce contexte royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Le troisième jour
  rationale: La formule narrative introduit la nouvelle étape du récit. En français moderne, le complément temporel suffit sans ajouter une formule archaïque telle que « il arriva que ».
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: Esther revêtit ses vêtements royaux
  rationale: Littéralement, Esther « revêtit la royauté » ; dans ce contexte, l’expression désigne sa tenue ou ses insignes royaux. « Vêtements royaux » rend naturellement ce sens concret tout en laissant l’expression littérale en note.
- source_word: וַתַּעֲמֹד
  choice: se tint
  rationale: Le verbe indique qu’Esther prit position et resta debout. « Se tint » convient au registre narratif et à la solennité de la scène.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: dans la cour intérieure du palais du roi
  rationale: Dans ce cadre de cour royale, בֵּית désigne l’ensemble palatial. « Palais du roi » est clair et idiomatique.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: en face de la résidence du roi
  rationale: נֹכַח exprime une orientation spatiale, « en face de ». « Résidence » distingue ici le bâtiment proprement dit de l’ensemble du palais sans imposer une identification plus précise.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: Le roi était assis
  rationale: Cette proposition décrit la situation simultanée. Une nouvelle phrase donne un français fluide tout en conservant la relation narrative.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: sur son trône royal
  rationale: La construction désigne naturellement le trône qui appartient à la dignité royale du roi.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: dans le palais royal
  rationale: Littéralement « dans la maison de la royauté ». Dans le contexte, « palais royal » transmet le sens institutionnel et architectural sans l’étrangeté de « maison royale ».
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: en face de l’entrée du bâtiment
  rationale: La formulation garde l’orientation spatiale répétée par נֹכַח. « Bâtiment » rend ici הַבָּיִת sans répéter artificiellement « palais » et sans préciser au-delà du texte.
