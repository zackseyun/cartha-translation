revisions:
- from: Le troisième jour, Esther revêtit ses vêtements royaux[a] et se tint dans la cour intérieure du palais du roi, en face de la résidence du roi. Le roi était assis sur son trône royal, dans le palais royal[b], en face de l’entrée du bâtiment.
  to: Le troisième jour, Esther revêtit ses vêtements royaux[a] et se tint dans la cour intérieure du palais du roi, en face de la résidence du roi, tandis que le roi était assis sur son trône royal, dans le palais royal[b], en face de l’entrée du palais.
  rationale: La révision rétablit dans une même phrase la concomitance narrative de l’action d’Esther et de la position du roi. Elle remplace aussi « bâtiment », terme français vague, par « palais », qui convient au référent royal sans prétendre préciser davantage l’architecture.
