  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ וְ/הָמָ֔ן לִ/שְׁתּ֖וֹת עִם אֶסְתֵּ֥ר הַ/מַּלְכָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/001.yaml
  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: fr
  text: Le roi et Haman vinrent alors boire avec la reine Esther[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « avec Esther, la reine » ou « avec Esther la reine ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: vinrent
  rationale: Le wayyiqtol de בוא fait progresser le récit. Le pluriel français s’impose avec le sujet composé « le roi et Haman » ; « vinrent » rend le déplacement sans ajouter l’idée plus précise d’entrer.
- source_word: הַמֶּלֶךְ
  choice: le roi
  rationale: Traduction directe et naturelle du nom défini ; le contexte a déjà identifié le roi.
- source_word: וְהָמָן
  choice: et Haman
  rationale: Le nom propre est transcrit selon l’usage français, et la conjonction relie simplement les deux participants.
- source_word: לִשְׁתּוֹת
  choice: boire
  rationale: L’infinitif de שׁתה signifie « boire ». Le contexte est celui d’un banquet, mais l’hébreu ne précise ici ni le vin ni l’action plus générale de festoyer.
- source_word: עִם
  choice: avec
  rationale: Équivalent français direct de la préposition d’accompagnement.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הַמַּלְכָּה
  choice: la reine Esther
  rationale: L’hébreu appositionnel signifie littéralement « Esther, la reine ». En français courant, le titre placé avant le nom est plus naturel et ne change pas le sens.
- source_word: וַ
  choice: donc
  rationale: Le waw narratif marque ici la progression de l’action. « Donc », placé naturellement après le verbe conjugué, relie ce verset à l’invitation et au banquet annoncés précédemment.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Le passé simple convient au registre dignifié du récit biblique. La formulation conserve le verbe précis « boire » plutôt que d’expliciter « boire du vin » ou de généraliser en « festoyer ».
