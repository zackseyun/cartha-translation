  yaml_path: translation/ot/esther/007/006.yaml
  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: fr
  text: 'Esther répondit : « Un adversaire, un ennemi : ce méchant Haman ! » Alors Haman fut saisi de terreur devant le roi et la reine.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: L’homme qui nous opprime et nous traite en ennemi
  rationale: La tournure hébraïque accumule אִישׁ (« homme »), צַר (« adversaire », « oppresseur ») et אוֹיֵב (« ennemi »). Cette formulation française conserve les deux qualifications sans produire l’expression peu naturelle « un homme hostile et ennemi » ; le pronom « nous » s’appuie sur la question du roi au verset précédent et sur le danger visant Esther et son peuple.
- source_word: הָמָן הָרָע הַזֶּה
  choice: c’est Haman, ce méchant !
  rationale: La construction déictique et emphatique identifie directement Haman. « Ce méchant » restitue הָרָע הַזֶּה dans un français naturel et accusateur.
- source_word: נִבְעַת
  choice: fut saisi de terreur
  rationale: Le verbe exprime un effroi soudain et intense ; cette locution garde son caractère passif et dramatique.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: devant le roi et la reine
  rationale: Traduction directe de l’expression de présence ; dans ce contexte, la terreur d’Haman se manifeste face aux souverains.
