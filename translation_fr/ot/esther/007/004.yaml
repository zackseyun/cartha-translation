base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: fr
  text: Car nous avons été vendus, moi et mon peuple, pour être exterminés, tués et anéantis. Si nous avions seulement été vendus comme esclaves, hommes et femmes, je me serais tue, car l’adversaire ne saurait compenser le préjudice causé au roi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car notre détresse ne justifierait pas que l’on dérange le roi ». La fin de la phrase hébraïque est difficile; elle peut évoquer un dommage, un tort ou une perte pour le roi.'
    reason: ambiguïté textuelle et lexicale
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: nous avons été vendus
  rationale: Le passif de מכר signifie naturellement « être vendu ». Cette formulation conserve la métaphore commerciale et prépare le contraste avec la vente en esclavage.
- source_word: עַמִּי
  choice: mon peuple
  rationale: עַם désigne ici le peuple auquel Esther appartient; « mon peuple » exprime naturellement son identification avec lui.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: pour être exterminés, tués et anéantis
  rationale: La traduction maintient l’accumulation de trois infinitifs presque synonymes et sa force rhétorique, tout en exprimant en français le sort imposé aux victimes.
- source_word: וְאִלּוּ
  choice: Si nous avions seulement été
  rationale: La tournure introduit une hypothèse contraire aux faits et oppose l’esclavage au projet d’extermination. « Seulement » rend la nuance de contraste sans banaliser l’esclavage.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: comme esclaves, hommes et femmes
  rationale: Le couple hébreu distingue les esclaves masculins et féminins. Cette formulation française conserve cette distinction ainsi que la réalité de l’asservissement, sans employer le terme adouci « serviteurs ».
- source_word: הֶחֱרַשְׁתִּי
  choice: je me serais tue
  rationale: Dans cette proposition hypothétique, le parfait a une valeur conditionnelle passée. L’accord féminin convient à Esther, qui parle.
- source_word: הַצָּר
  choice: l’adversaire
  rationale: Le nom désigne celui qui manifeste son hostilité ou cause la détresse. « L’adversaire » convient au cadre de la cour et renvoie à Haman sans explicitation ajoutée.
- source_word: שֹׁוֶה
  choice: ne pourrait compenser
  rationale: Le verbe exprime l’idée d’équivalence ou de valeur correspondante. Dans cette phrase difficile, « ne pourrait compenser » donne un sens français cohérent tout en maintenant le rapport entre l’adversaire et le préjudice royal.
- source_word: בְּנֵזֶק הַמֶּלֶךְ
  choice: le préjudice subi par le roi
  rationale: נזק peut désigner un dommage, une perte ou un tort. « Préjudice » laisse ouverte la nature financière, politique ou personnelle de l’atteinte portée au roi.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La structure en trois termes est conservée pour rendre l’intensité de la supplication d’Esther. La formulation « esclaves, hommes et femmes » évite d’atténuer la servitude tout en restant naturelle.
