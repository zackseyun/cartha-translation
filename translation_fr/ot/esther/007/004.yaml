revisions:
- from: Car nous avons été vendus, moi et mon peuple, pour être exterminés, tués et anéantis. Si nous avions seulement été vendus comme esclaves, hommes et femmes, je me serais tue, car l’adversaire ne pourrait compenser le préjudice subi par le roi.[a]
  to: Car nous avons été vendus, moi et mon peuple, pour être exterminés, tués et anéantis. Si nous avions seulement été vendus comme esclaves, hommes et femmes, je me serais tue, car l’adversaire ne saurait compenser le préjudice causé au roi.[a]
  rationale: La seule correction nécessaire remplace le conditionnel « ne pourrait » par « ne saurait », afin de ne pas ajouter une valeur conditionnelle au participe hébreu. La note existante est maintenue, car elle signale de façon équilibrée la difficulté de la clause finale et ses sens possibles.
