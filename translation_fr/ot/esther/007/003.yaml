base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: fr
  text: 'Alors la reine Esther répondit : « Si j’ai trouvé grâce à tes yeux, ô roi, et si le roi le juge bon, que la vie me soit accordée à ma demande, et mon peuple à ma requête. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן אֶסְתֵּר הַמַּלְכָּה וַתֹּאמַר
  choice: Alors la reine Esther répondit
  rationale: Le doublet hébreu « répondit et dit » est une formule narrative. En français moderne, « répondit » en exprime naturellement la fonction sans lourdeur, tandis que « la reine Esther » conserve le titre en apposition.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Si j’ai trouvé grâce à tes yeux
  rationale: Cette formulation conserve l’image et la politesse de la formule hébraïque de cour. « Grâce » est ici compris au sens de faveur, courant dans le registre biblique français.
- source_word: הַמֶּלֶךְ
  choice: ô roi
  rationale: Le nom fonctionne comme un vocatif respectueux. « Ô roi » maintient la solennité de la parole de cour sans ajouter « mon », absent de l’hébreu.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: et si le roi le juge bon
  rationale: Équivalent français naturel de l’idiome littéral « si cela est bon pour le roi », exprimant l’approbation souveraine.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: que la vie me soit accordée
  rationale: Le passif restitue le niphal de נתן, tandis que נֶפֶשׁ désigne ici la vie menacée d’Esther plutôt qu’une âme immatérielle. L’article défini évite en français la tournure peu naturelle « que ma vie me soit accordée ».
- source_word: בִּשְׁאֵלָתִי
  choice: à ma demande
  rationale: שְׁאֵלָה désigne la demande présentée par Esther; la préposition ב marque ici le cadre ou l’objet de sa pétition.
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: et mon peuple à ma requête
  rationale: La traduction conserve le parallélisme elliptique de l’hébreu ainsi que la variation entre שְׁאֵלָה et בַּקָּשָׁה par « demande » et « requête ».
