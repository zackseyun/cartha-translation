  text: וַ/יֹּ֨אמֶר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וַ/יֹּ֖אמֶר לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֑ה מִ֣י ה֥וּא זֶה֙ וְ/אֵֽי זֶ֣ה ה֔וּא אֲשֶׁר מְלָא֥/וֹ לִבּ֖/וֹ לַ/עֲשׂ֥וֹת כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: fr
  text: 'Alors le roi Assuérus prit la parole et demanda à la reine Esther : « Qui est-il et où est-il[a], celui qui a osé[b] agir ainsi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, moins probablement : « et lequel est-ce ? », si la question vise à identifier la personne plutôt qu’à demander où elle se trouve.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « qui a rempli son cœur pour agir ainsi », expression idiomatique signifiant « qui a osé » ou « qui a eu la présomption » d’agir ainsi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ וַיֹּאמֶר
  choice: Alors le roi Assuérus prit la parole et demanda
  rationale: La succession narrative est rendue par « Alors ». La répétition de וַיֹּאמֶר est représentée naturellement par « prit la parole et demanda », sans l’aplatir ni produire une répétition maladroite en français.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: à la reine Esther
  rationale: Cette formulation française naturelle conserve le nom propre et le titre royal exprimés dans l’apposition hébraïque.
- source_word: מִי הוּא זֶה
  choice: Qui est-il
  rationale: La question emphatique porte sur l’identité de l’auteur; aucun nom comme « homme » n’est ajouté au texte.
- source_word: וְאֵי זֶה הוּא
  choice: et où est-il
  rationale: אֵי a normalement un sens locatif. Dans le contexte, le roi demande à la fois l’identité du coupable et où il se trouve; l’autre analyse possible est signalée en note.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: celui qui a osé
  rationale: L’expression hébraïque, littéralement liée au fait de « remplir son cœur », est idiomatique et désigne l’audace ou la présomption d’entreprendre l’acte. « A osé » en communique clairement le sens en français moderne.
- source_word: לַעֲשׂוֹת כֵּן
  choice: agir ainsi
  rationale: כֵּן renvoie au projet qui vient d’être dénoncé. « Agir ainsi » est idiomatique et garde ce renvoi contextuel.
