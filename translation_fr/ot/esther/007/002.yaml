base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: fr
  text: 'Le deuxième jour, au banquet du vin[a], le roi dit encore à Esther : « Quelle est ta requête, reine Esther ? Elle te sera accordée. Quelle est ta demande ? Fût-ce jusqu’à la moitié du royaume[b], elle sera exaucée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au cours du festin du vin ».'
    reason: lexical_alternative
  - marker: b
    text: La formule « jusqu’à la moitié du royaume » est une offre royale conventionnelle qui exprime une faveur exceptionnelle ; elle ne propose pas nécessairement un partage littéral du royaume.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: Le deuxième jour encore
  rationale: גַּם marque ici la reprise de la scène et de la question royale lors du second jour; « encore » exprime naturellement cette continuité sans transformer « le deuxième jour » en « le lendemain ».
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: pendant le banquet où l’on buvait du vin
  rationale: Cette formulation française actuelle conserve la mention explicite du vin et rend naturellement le cadre du מִשְׁתֶּה, un banquet associé à la consommation de vin.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: Quelle est ta requête
  rationale: « Requête » garde la tonalité officielle d’une demande adressée au roi.
- source_word: וְתִנָּתֵן לָךְ
  choice: Elle te sera accordée
  rationale: Le sens littéral est « elle te sera donnée »; dans le contexte d’une requête royale, « accordée » en exprime clairement et naturellement la force.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Quelle est ta demande
  rationale: « Demande » reflète la variation lexicale de l’hébreu après שְׁאֵלָה, sans imposer une distinction sémantique trop forte entre les deux termes.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Même jusqu’à la moitié du royaume
  rationale: La traduction conserve עַד, « jusqu’à », ainsi que « du royaume », sans ajouter le possessif « mon » absent de l’hébreu.
- source_word: וְתֵעָשׂ
  choice: ce sera fait
  rationale: Cette tournure rend la forme passive et la promesse que la demande sera exécutée.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: reine Esther
  rationale: L’ordre titre-nom est naturel en français et conserve la valeur honorifique de l’expression hébraïque.
