  source_fidelity: Le sens est globalement fidèle, mais « pendant le banquet où l’on buvait du vin » explicite inutilement l’action de boire là où l’hébreu désigne plus directement le « banquet du vin ». La forme finale féminine renvoie naturellement à la demande et peut être rendue plus explicitement.
  naturalness: « Le deuxième jour encore » et surtout « Même jusqu’à la moitié du royaume, ce sera fait » sont compréhensibles, mais peu idiomatiques en français moderne. Une formulation plus fluide conserve la solennité royale sans modifier le sens.
  terminology: « Requête », « demande », « accordée » et « reine Esther » conviennent au registre de cour et préservent la variation hébraïque entre les deux termes pour la demande. « Exaucée » convient pour la seconde promesse, dont le verbe hébreu est féminin et se rapporte à la demande.
