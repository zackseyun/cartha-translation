    rationale: « Même jusqu’à la moitié du royaume, ce sera fait » est peu naturel en français. « Fût-ce jusqu’à la moitié du royaume, elle sera exaucée » rend clairement la promesse relative à la demande, tout en conservant la portée hyperbolique.
