  terminology: Les noms Harbona, Haman et Mardochée sont cohérents avec l’usage biblique français. « Eunuques » est défendable dans ce contexte de cour, sans exclure que le terme puisse parfois viser des officiers. « Gibet » est un terme français plus naturel que « potence » ici, mais la note maintient que le mot hébreu désigne littéralement un arbre ou une pièce de bois et ne précise pas la structure.
