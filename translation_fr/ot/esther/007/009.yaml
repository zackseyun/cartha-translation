  source_fidelity: 'Le projet rend fidèlement les principaux éléments du texte hébreu : Harbona, les eunuques devant le roi, la structure préparée pour Mardochée, sa hauteur et l''ordre royal. « Potence » et « Pendez-le » sont des rendus recevables à condition que l''ambiguïté de עֵץ et de תלה soit explicitée en note.'
