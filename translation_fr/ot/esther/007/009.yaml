  text: וַ/יֹּ֣אמֶר חַ֠רְבוֹנָה אֶחָ֨ד מִן הַ/סָּרִיסִ֜ים לִ/פְנֵ֣י הַ/מֶּ֗לֶךְ גַּ֣ם הִנֵּה הָ/עֵ֣ץ אֲשֶׁר עָשָׂ֪ה הָמָ֟ן לְֽ/מָרְדֳּכַ֞י אֲשֶׁ֧ר דִּבֶּר ט֣וֹב עַל הַ/מֶּ֗לֶךְ עֹמֵד֙ בְּ/בֵ֣ית הָמָ֔ן גָּבֹ֖הַּ חֲמִשִּׁ֣ים אַמָּ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ תְּלֻ֥/הוּ עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: fr
  text: 'Alors Harbona, l’un des eunuques qui se tenaient devant le roi, dit : « Il y a aussi le gibet[a] que Haman a fait pour Mardochée, qui a parlé dans l’intérêt du roi[b] : il se dresse dans la maison de Haman et mesure cinquante coudées de haut. » Le roi dit : « Pendez-le dessus[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « le bois » ou « l’arbre » ; il s’agit ici d’une structure destinée à l’exécution.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui a parlé en faveur du roi » ou « qui a dit du bien concernant le roi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, selon l’interprétation de la structure et du supplice antiques : « Empalez-le dessus ». Le vocabulaire hébreu peut désigner plus largement la suspension ou l’exposition de quelqu’un sur une structure de bois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Harbona
  rationale: Translittération française usuelle du nom propre hébreu.
- source_word: הַסָּרִיסִים
  choice: eunuques
  rationale: Dans le contexte de la cour perse, le sens concret « eunuques » est plus direct que le sens élargi « fonctionnaires de cour ».
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: qui se tenaient devant le roi
  rationale: Rend naturellement l’idée de service et de présence auprès du roi, sans réduire l’expression à une simple localisation.
- source_word: גַּם הִנֵּה
  choice: Voici aussi
  rationale: Conserve à la fois la valeur additive de גַּם et la force déictique de הִנֵּה dans un français actuel et digne.
- source_word: הָעֵץ
  choice: la potence
  rationale: Le mot signifie littéralement « arbre » ou « bois », mais désigne ici la structure d’exécution préparée par Haman. « Potence » est clair en français, tandis qu’une note préserve l’étendue sémantique de l’hébreu.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: a faite pour Mardochée
  rationale: Suit simplement le verbe « faire » et conserve la destination hostile exprimée par la préposition.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: a parlé pour le bien du roi
  rationale: Reste proche de l’expression hébraïque tout en évoquant naturellement les paroles de Mardochée qui avaient servi les intérêts du roi.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: elle se dresse chez Haman
  rationale: Le présent « se dresse » restitue la vivacité du participe et « chez Haman » situe la structure sur sa propriété ou à sa résidence sans précision excessive.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: mesure cinquante coudées de haut
  rationale: Conserve l’unité ancienne et exprime naturellement la hauteur en français.
- source_word: תְּלֻהוּ עָלָיו
  choice: Pendez-le dessus
  rationale: Rend directement l’impératif et son renvoi à la structure; une note signale que le procédé antique précis peut aussi être compris comme une exposition ou un empalement sur un dispositif de bois.
theological_decisions:
- issue: Nature exacte du supplice et de la structure d’exécution
  choice: « potence » et « Pendez-le » dans le texte, avec une note d’ambiguïté
  alternative: « poteau » et « Empalez-le »
  rationale: L’hébreu ne décrit pas avec précision un gibet de type moderne. Le rendu principal demeure intelligible et traditionnel, tandis que la note évite de trancher abusivement la question historique.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici aussi » maintient l’effet d’annonce de l’hébreu; « se dresse » conserve son relief visuel. La formulation évite de moderniser les coudées et préserve en note l’incertitude sur la structure et le mode précis d’exécution.
