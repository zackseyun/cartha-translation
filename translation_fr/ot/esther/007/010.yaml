  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: fr
  text: Ils suspendirent Haman au poteau qu’il avait préparé pour Mardochée[a], et la colère du roi s’apaisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils pendirent Haman au bois [ou à l’arbre] qu’il avait préparé pour Mardochée. » Le mot hébreu עֵץ peut désigner un « arbre », du « bois » ou un « poteau », et le verbe signifie plus largement « suspendre ». La méthode exacte d’exécution reste discutée ; il peut aussi s’agir d’un empalement sur un poteau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: Ils pendirent
  rationale: Le verbe תלה signifie suspendre ou pendre. « Pendirent » restitue directement le sens courant sans trancher définitivement la forme précise de l’exécution, signalée en note.
- source_word: הָמָן
  choice: Haman
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: עַל הָעֵץ
  choice: au bois
  rationale: עֵץ peut désigner un arbre, du bois ou un poteau de bois. « Au bois » conserve mieux que « potence » l’étendue lexicale et l’ambiguïté concrète de l’hébreu, tout en restant intelligible dans le contexte.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: qu’il avait préparé pour Mardochée
  rationale: 'Cette formulation naturelle rend הכין, « préparer, disposer », et préserve l’ironie narrative : Haman subit le sort qu’il destinait à Mardochée.'
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: la fureur du roi
  rationale: חֵמָה évoque une colère ardente et intense. « Fureur » en conserve la force dans un français actuel et digne.
- source_word: שָׁכָכָה
  choice: retomba
  rationale: Le verbe שׁכך signifie s’apaiser, diminuer ou retomber. En français, une colère ou une fureur « retombe » naturellement.
