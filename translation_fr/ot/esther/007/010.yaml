revisions:
- from: Ils pendirent donc Haman au bois qu’il avait préparé pour Mardochée[a]. Alors, la fureur du roi retomba.
  to: Ils suspendirent Haman au poteau qu’il avait préparé pour Mardochée[a], et la colère du roi s’apaisa.
  rationale: La révision remplace l’expression peu idiomatique « au bois » par « au poteau » et « pendirent » par « suspendirent », afin d’obtenir un français moderne tout en ne fixant pas indûment le dispositif ni le mode d’exécution. La note conserve les sens lexicaux alternatifs et l’incertitude historique. « La colère du roi s’apaisa » rend naturellement שָׁכָכָה sans réduire l’intensité de חֵמָה.
  reviewer_model: gpt-5.6-terra
