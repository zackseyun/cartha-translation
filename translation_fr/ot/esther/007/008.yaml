base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: fr
  text: 'Le roi revint du jardin du palais dans la salle du festin arrosé de vin. Haman se jetait sur le divan où se trouvait Esther. Alors le roi dit : « Veut-il même faire violence à la reine en ma présence, dans cette maison ? » À peine cette parole était-elle sortie de la bouche du roi qu’on couvrit le visage d’Haman.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: la salle du festin arrosé de vin
  rationale: Littéralement « maison du festin de vin » ; « salle » convient au lieu intérieur du banquet, et « festin arrosé de vin » restitue naturellement la caractérisation hébraïque.
- source_word: נֹפֵל עַל הַמִּטָּה
  choice: s’était jeté sur le divan
  rationale: Le participe נֹפֵל décrit Haman prostré ou se jetant sur le divan pour supplier Esther. Le plus-que-parfait situe naturellement cette action au moment où le roi rentre, sans suggérer une chute accidentelle.
- source_word: לִכְבּוֹשׁ
  choice: faire violence à
  rationale: Le verbe signifie ici maîtriser ou soumettre par la force, avec une implication sexuelle dans l’accusation du roi. « Faire violence à » préserve la gravité et une part de l’ambiguïté sans préciser davantage que l’hébreu.
- source_word: עִמִּי בַּבָּיִת
  choice: chez moi, sous mes yeux
  rationale: Littéralement « avec moi dans la maison ». En contexte, l’expression souligne la présence du roi dans sa propre demeure ; la formulation française rend cette indignation idiomatiquement.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: qu’on couvrit le visage d’Haman
  rationale: La forme hébraïque est littéralement « le visage d’Haman fut couvert » ou « ils couvrirent ». L’indéfini « on » rend naturellement l’action des serviteurs implicites.
theological_decisions:
- issue: Nature exacte de l’accusation portée contre Haman
  choice: « faire violence à la reine »
  alternative: « agresser la reine » ou « violer la reine »
  rationale: Le texte présente l’interprétation indignée du roi, non une description objective de l’intention d’Haman. La traduction choisie conserve la possible connotation sexuelle de כבש sans transformer l’accusation en qualification plus précise que le texte source.
translation_notes:
  register: Français moderne, narratif et digne. Le contraste entre la supplication désespérée d’Haman et l’interprétation du roi reste net. La phrase finale est rendue par une tournure temporelle vive qui traduit l’immédiateté de l’hébreu.
