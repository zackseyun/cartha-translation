revisions:
- from: 'Le roi revint du jardin du palais dans la salle du festin arrosé de vin. Haman s’était jeté sur le divan où se trouvait Esther. Alors le roi dit : « Va-t-il même faire violence à la reine chez moi, sous mes yeux ? » À peine cette parole était-elle sortie de la bouche du roi qu’on couvrit le visage d’Haman.'
  to: 'Le roi revint du jardin du palais dans la salle du festin arrosé de vin. Haman se jetait sur le divan où se trouvait Esther. Alors le roi dit : « Veut-il même faire violence à la reine en ma présence, dans cette maison ? » À peine cette parole était-elle sortie de la bouche du roi qu’on couvrit le visage d’Haman.'
  rationale: La révision aligne l’aspect verbal sur le participe hébreu et retire l’explicitation non nécessaire « sous mes yeux ». Le verbe « veut-il » rend l’interrogation accusatrice du roi sans décider si l’intention imputée à Haman est strictement sexuelle ou plus largement violente.
