revisions:
- from: Alors le roi se leva, furieux, quitta le banquet où l’on buvait du vin et se rendit dans le jardin du palais[a]. Haman, lui, resta pour supplier la reine Esther de lui laisser la vie, car il voyait que le roi avait résolu de causer sa perte[b].
  to: Alors le roi se leva, furieux, quitta le banquet où l’on buvait du vin et se rendit dans le jardin du palais[a]. Haman, lui, resta pour supplier la reine Esther de lui laisser la vie, car il voyait que le malheur qui le menaçait était désormais décidé par le roi[b].
  rationale: 'La révision de la dernière proposition préserve l’ambiguïté et la structure sémantique de l’hébreu : le malheur est arrêté contre Haman et procède de la décision royale. Elle évite d’expliciter une causalité que le verset ne formule pas directement, tout en gardant un français moderne et clair.'
