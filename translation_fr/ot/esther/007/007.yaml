    text: Ou « le jardin du pavillon ». Le terme hébreu peut désigner un pavillon, un palais ou l’ensemble palatial.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « car il voyait que le malheur contre lui était décidé de la part du roi ».'
    reason: lexical_alternative
  revision_rationale: 'La révision de la dernière proposition préserve l’ambiguïté et la structure sémantique de l’hébreu : le malheur est arrêté contre Haman et procède de la décision royale. Elle évite d’expliciter une causalité que le verset ne formule pas directement, tout en gardant un français moderne et clair.'
