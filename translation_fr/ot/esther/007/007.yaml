  text: וְ/הַ/מֶּ֜לֶךְ קָ֤ם בַּ/חֲמָת/וֹ֙ מִ/מִּשְׁתֵּ֣ה הַ/יַּ֔יִן אֶל גִּנַּ֖ת הַ/בִּיתָ֑ן וְ/הָמָ֣ן עָמַ֗ד לְ/בַקֵּ֤שׁ עַל נַפְשׁ/וֹ֙ מֵֽ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה כִּ֣י רָאָ֔ה כִּֽי כָלְתָ֥ה אֵלָ֛י/ו הָ/רָעָ֖ה מֵ/אֵ֥ת הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: fr
  text: Alors le roi se leva, furieux, quitta le banquet où l’on buvait du vin et se rendit dans le jardin du palais[a]. Haman, lui, resta pour supplier la reine Esther de lui laisser la vie, car il voyait que le malheur qui le menaçait était désormais décidé par le roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jardin du pavillon ». Le terme hébreu peut désigner un pavillon, un palais ou l’ensemble palatial.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « car il voyait que le malheur contre lui était décidé de la part du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: furieux
  rationale: Le nom חֵמָה exprime une colère ardente et intense. La tournure « se leva, furieux » est naturelle en français et conserve cette force.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: quitta le banquet où l’on buvait du vin
  rationale: מִשְׁתֶּה désigne un festin, souvent marqué par la consommation de vin dans Esther. Cette formulation explicite naturellement la valeur du syntagme hébreu sans suggérer un banquet composé de vin.
- source_word: גִּנַּת הַבִּיתָן
  choice: le jardin du palais
  rationale: גִּנָּה signifie « jardin » et בִּיתָן peut désigner un palais, un pavillon ou l’ensemble palatial. « Jardin du palais » est clair dans le cadre de la cour perse, tandis qu’une note conserve l’autre possibilité.
- source_word: עָמַד
  choice: resta
  rationale: Le verbe signifie littéralement « se tint, se leva », mais il marque ici le contraste entre le roi qui sort et Haman qui demeure afin de supplier Esther.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: pour supplier… de lui laisser la vie
  rationale: L’expression idiomatique décrit une supplication visant à sauver sa propre vie. Cette traduction rend clairement l’enjeu et le désespoir d’Haman.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: la reine Esther
  rationale: Le titre placé avant le nom correspond à l’usage naturel du français et préserve tout le contenu référentiel.
- source_word: כִּי רָאָה
  choice: car il voyait
  rationale: כִּי introduit la raison de la supplication d’Haman. L’imparfait rend sa perception de la situation au cours de la scène.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה
  choice: avait résolu de causer sa perte
  rationale: כלה indique ici que le malheur visant Haman est arrêté ou irrévocablement décidé. La formulation française exprime cette finalité tout en rattachant clairement la décision au roi.
- source_word: הָרָעָה
  choice: sa perte
  rationale: רָעָה peut signifier mal, malheur, désastre ou calamité. Dans ce contexte, il s’agit du sort funeste désormais décidé contre Haman; « sa perte » est idiomatique sans préciser encore la forme exacte du châtiment.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: le roi avait résolu
  rationale: מֵאֵת marque la source. La restructuration active rend naturellement en français que le sort funeste procède de la décision royale.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La traduction privilégie une équivalence optimale : elle conserve l’intensité de la colère royale, le contraste entre le départ du roi et le maintien d’Haman, ainsi que la décision désormais arrêtée contre celui-ci, tout en rendant les idiomes hébreux de façon immédiatement compréhensible.'
