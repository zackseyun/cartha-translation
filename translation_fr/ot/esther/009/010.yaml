  text: עֲ֠שֶׂרֶת בְּנֵ֨י הָמָ֧ן בֶּֽן הַמְּדָ֛תָא צֹרֵ֥ר הַ/יְּהוּדִ֖ים הָרָ֑גוּ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/010.yaml
  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: fr
  text: Ils tuèrent les dix fils d’Haman, fils de Hammedatha, l’ennemi des Juifs, mais ils ne mirent pas la main sur le butin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: les dix fils d’Haman
  rationale: Le nombre est à l’état construit avec « fils d’Haman »; l’article défini convient naturellement en français puisque les dix fils viennent d’être nommés.
- source_word: בֶּן הַמְּדָתָא
  choice: fils de Hammedata
  rationale: Cette apposition généalogique identifie Haman; le nom propre est translittéré sous la forme française Hammedata.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: l’ennemi des Juifs
  rationale: צֹרֵר désigne ici celui qui se montre hostile aux Juifs; « ennemi » est précis, naturel et actuel.
- source_word: הָרָגוּ
  choice: Ils tuèrent
  rationale: Le verbe הרג exprime directement la mise à mort. « Tuèrent » restitue le sens avec un registre narratif digne et courant.
- source_word: וּבַבִּזָּה
  choice: mais ... sur le butin
  rationale: בִּזָּה désigne les biens pris à l’ennemi. « Butin » est l’équivalent français naturel; le waw est rendu par « mais » afin d’exprimer le contraste contextuel entre la mise à mort et le refus de s’emparer des biens.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: ils ne portèrent pas la main
  rationale: 'La formulation conserve l’image concrète de l’idiome hébreu tout en étant intelligible en français: ils ne touchèrent pas au butin pour se l’approprier.'
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition syntaxique maladroite qu’aurait produite un calque de l’ordre hébreu est évitée, tandis que l’apposition sur Haman et l’image de la main sont conservées. La note anglaise « Or ‘spoil.’ » était rattachée à tort à Hammedatha; aucune note n’est nécessaire en français, « butin » couvrant clairement le terme hébreu.
