  - severity: low
    issue: Expression française « porter la main sur le butin »
    rationale: Elle est possible, mais moins idiomatique dans ce contexte que « mettre la main sur le butin ». Cette dernière restitue naturellement l’idiome hébreu de ne pas étendre/envoyer sa main pour s’approprier le butin.
