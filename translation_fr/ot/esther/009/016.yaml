source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: fr
  text: Le reste des Juifs qui se trouvaient dans les provinces du roi se rassemblèrent, prirent position pour défendre leur vie[a], obtinrent du répit face à leurs ennemis et tuèrent soixante-quinze mille de ceux qui les haïssaient ; mais ils ne mirent pas la main sur le butin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « prirent position pour leur vie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le butin de guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: Le reste des Juifs
  rationale: « Le reste » marque naturellement le contraste avec les Juifs de Suse mentionnés auparavant; dans Esther, « les Juifs » désigne ici le groupe ethnoreligieux.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: qui se trouvaient dans les provinces du roi
  rationale: מְדִינוֹת désigne les provinces administratives de l’empire; cette formulation est claire et idiomatique en français.
- source_word: נִקְהֲלוּ
  choice: se rassemblèrent
  rationale: Le verbe exprime le rassemblement collectif des Juifs en réaction au décret royal; la forme pronominale française en conserve bien la nuance.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: prirent position pour défendre leur vie
  rationale: Littéralement, l’expression évoque le fait de « se tenir pour/sur leur vie ». La formulation française conserve l’image d’une prise de position tout en explicitant son sens défensif.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: obtinrent du répit face à leurs ennemis
  rationale: נוּחַ indique ici le repos ou le soulagement obtenu à l’égard des ennemis; « du répit » convient au contexte de conflit.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: Ils tuèrent ... de ceux qui les haïssaient
  rationale: La formulation rend directement l’action meurtrière sans l’atténuer; « ceux qui les haïssaient » traduit le participe substantivé שֹׂנְאֵיהֶם.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: soixante-quinze mille
  rationale: Le nombre est remis dans l’ordre naturel du français moderne.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: mais ils ne mirent pas la main sur le butin
  rationale: « Mettre la main sur » rend naturellement l’idiome hébreu signifiant saisir ou prendre, tandis que « mais » exprime le contraste contextuel.
theological_decisions:
- issue: Cadre moral de l’action des Juifs
  choice: prirent position pour défendre leur vie
  alternative: prirent position pour leur vie; défendirent leur vie
  rationale: L’hébreu relie explicitement leur action à la préservation de leur vie. La traduction maintient donc le cadre d’autodéfense du récit sans minimiser les morts rapportées.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit. La syntaxe a été divisée en deux phrases pour rester claire sans effacer l’enchaînement des actions dans l’hébreu.
