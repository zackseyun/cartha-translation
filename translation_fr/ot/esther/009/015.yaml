  text: וַ/יִּֽקָּהֲל֞וּ ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן גַּ֠ם בְּ/י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וַ/יַּֽהַרְג֣וּ בְ/שׁוּשָׁ֔ן שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: fr
  text: Les Juifs qui étaient à Suse se rassemblèrent aussi le quatorzième jour du mois d’adar et ils tuèrent trois cents hommes à Suse ; mais ils ne mirent pas la main sur le butin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils n’étendirent pas la main sur le butin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: se rassemblèrent
  rationale: Le verbe קהל exprime ici le fait de se réunir en groupe dans un but commun. La forme pronominale française restitue naturellement ce mouvement collectif.
- source_word: הַיְּהוּדִים
  choice: Les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif de la diaspora perse, et non simplement les habitants de la Judée.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: qui étaient à Suse
  rationale: La proposition relative identifie les Juifs présents dans la ville. « Suse » est la forme française usuelle du toponyme.
- source_word: גַּם
  choice: aussi
  rationale: L’adverbe marque l’ajout de ce rassemblement et de cette action aux événements précédents.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: le quatorzième jour du mois d’adar
  rationale: Cette formulation conserve l’expression calendaire complète de l’hébreu dans un français naturel.
- source_word: וַיַּהַרְגוּ
  choice: Ils tuèrent
  rationale: הרג est le verbe courant signifiant tuer. « Tuèrent » est direct, moderne et sans euphémisme.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: trois cents hommes
  rationale: Le nom masculin אִישׁ suit le nombre et désigne ici des hommes; la traduction en maintient la précision.
- source_word: וּבַבִּזָּה
  choice: mais … sur le butin
  rationale: בִּזָּה désigne les biens pris à l’ennemi. Le contexte donne à la conjonction une valeur de contraste, rendue par « mais ».
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: ne mirent pas la main
  rationale: L’expression française « mettre la main sur » rend naturellement l’idiome hébreu et indique qu’ils ne se sont pas emparés du butin.
