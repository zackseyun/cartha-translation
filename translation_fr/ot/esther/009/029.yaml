  to: Alors la reine Esther, fille d’Abihaïl, et Mardochée le Juif écrivirent avec pleine autorité[a] pour confirmer cette seconde lettre de Pourim.
  rationale: La révision corrige l’alternative de note qui ajoutait « nécessaire » et adopte une formulation française plus naturelle pour la valeur officielle de כָּל־תֹּקֶף. Elle ne modifie ni l’identification des personnes ni le sens de la lettre confirmée.
