base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: fr
  text: Alors la reine Esther, fille d’Abihaïl, et Mardochée le Juif écrivirent avec pleine autorité[a] pour confirmer cette seconde lettre de Pourim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec toute autorité » ou « avec pleine force ». L’expression hébraïque souligne la force officielle de la lettre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Alors … écrivirent
  rationale: Le waw consécutif fait progresser le récit. Bien que le verbe hébreu soit au féminin singulier, le sujet exprimé associe Esther et Mardochée ; le pluriel est nécessaire en français courant.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: la reine Esther
  rationale: Cette formulation française naturelle conserve à la fois le titre royal et le nom d’Esther.
- source_word: בַת אֲבִיחַיִל
  choice: fille d’Abihaïl
  rationale: L’expression généalogique est rendue directement et reste intégrée à l’identification solennelle d’Esther.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: et Mardochée le Juif
  rationale: « Le Juif » rend ici la désignation ethnique habituelle dans le livre d’Esther ; « le Judéen » serait possible, mais risquerait de donner un sens surtout géographique.
- source_word: אֶת כָּל תֹּקֶף
  choice: de toute leur autorité
  rationale: תֹּקֶף évoque la force, la puissance ou l’autorité. Dans le contexte d’une lettre officielle, « autorité » exprime clairement sa force institutionnelle, tandis que la note conserve les autres nuances possibles.
- source_word: לְקַיֵּם
  choice: pour confirmer
  rationale: L’infinitif indique le but de l’acte d’écrire. « Confirmer » convient à une lettre officielle qui valide ou maintient une disposition déjà établie.
- source_word: אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: cette seconde lettre de Pourim
  rationale: La formulation suit de près le groupe nominal hébreu tout en restant naturelle en français et indique qu’il s’agit d’une deuxième lettre concernant Pourim.
