source:
  edition: WLC
  text: וְ/כָל שָׂרֵ֨י הַ/מְּדִינ֜וֹת וְ/הָ/אֲחַשְׁדַּרְפְּנִ֣ים וְ/הַ/פַּח֗וֹת וְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁ֣ר לַ/מֶּ֔לֶךְ מְנַשְּׂאִ֖ים אֶת הַ/יְּהוּדִ֑ים כִּֽי נָפַ֥ל פַּֽחַד מָרְדֳּכַ֖י עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: fr
  text: Tous les hauts fonctionnaires des provinces, les satrapes, les gouverneurs et ceux qui étaient chargés des affaires du roi soutenaient[a] les Juifs, car la crainte de Mardochée était tombée sur eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aidaient » ou « favorisaient » les Juifs ; le verbe hébreu peut aussi évoquer l’action de les élever.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: les hauts fonctionnaires des provinces
  rationale: שָׂרִים désigne ici des dirigeants ou responsables administratifs. « Hauts fonctionnaires » convient à l’énumération des autorités provinciales et se distingue des titres précis qui suivent.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: les satrapes
  rationale: Ce terme administratif d’origine perse désigne les satrapes et préserve avec précision le cadre historique.
- source_word: פַּחוֹת
  choice: les gouverneurs
  rationale: Titre administratif régional distinct de celui de satrape ; « gouverneurs » est son équivalent français courant et clair.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: ceux qui étaient chargés des affaires du roi
  rationale: Littéralement, « ceux qui faisaient le travail appartenant au roi ». La formulation retenue exprime naturellement en français les fonctions de ces agents royaux sans les réduire à une catégorie administrative trop précise.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: soutenaient les Juifs
  rationale: La forme causative de נָשָׂא peut évoquer l’action de soulever, d’élever ou de soutenir. Dans ce contexte, « soutenaient » rend une aide concrète ou un appui favorable sans imposer l’idée d’une exaltation sociale.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appui apporté aux Juifs. « Car » relie naturellement les deux propositions dans ce registre narratif.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: la crainte de Mardochée était tombée sur eux
  rationale: Cette traduction conserve l’image hébraïque vive d’une crainte qui « tombe sur » des personnes, ainsi que l’aspect accompli du verbe dans le contexte.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom hébreu.
theological_decisions: []
