  text: כַּ/יָּמִ֗ים אֲשֶׁר נָ֨חוּ בָ/הֶ֤ם הַ/יְּהוּדִים֙ מֵ/א֣וֹיְבֵי/הֶ֔ם וְ/הַ/חֹ֗דֶשׁ אֲשֶׁר֩ נֶהְפַּ֨ךְ לָ/הֶ֤ם מִ/יָּגוֹן֙ לְ/שִׂמְחָ֔ה וּ/מֵ/אֵ֖בֶל לְ/י֣וֹם ט֑וֹב לַ/עֲשׂ֣וֹת אוֹתָ֗/ם יְמֵי֙ מִשְׁתֶּ֣ה וְ/שִׂמְחָ֔ה וּ/מִשְׁל֤וֹחַ מָנוֹת֙ אִ֣ישׁ לְ/רֵעֵ֔/הוּ וּ/מַתָּנ֖וֹת לָֽ/אֶבְיוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: fr
  text: comme les jours où les Juifs avaient obtenu du répit de la part de leurs ennemis, et comme le mois qui, pour eux, avait changé le chagrin en joie et le deuil en jour de fête[a], afin d’en faire des jours de festin et de joie, d’envoi de portions[b], chacun à son prochain[c], et de dons aux pauvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en un bon jour » ; l’expression désigne ici un jour de fête ou de célébration.'
    reason: lexical_alternative
  - marker: b
    text: Il s’agissait vraisemblablement de portions de nourriture envoyées comme cadeaux de fête.
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « un homme à son prochain » ; cette expression distributive signifie que chacun faisait parvenir une portion à son prochain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ מֵאֹיְבֵיהֶם
  choice: avaient trouvé du répit loin de leurs ennemis
  rationale: Le verbe נוח exprime ici le repos ou le soulagement obtenu après la menace. « Trouver du répit » est naturel en français et מִן marque l’éloignement ou la délivrance par rapport aux ennemis.
- source_word: נֶהְפַּךְ לָהֶם
  choice: pour eux, avait changé
  rationale: Le nifal de הפך décrit un renversement subi. La tournure française maintient l’idée que leur situation s’est inversée, sans préciser explicitement l’agent.
- source_word: מִיָּגוֹן לְשִׂמְחָה
  choice: le chagrin en joie
  rationale: « Chagrin » et « joie » rendent clairement le contraste affectif entre יָגוֹן et שִׂמְחָה.
- source_word: וּמֵאֵבֶל לְיוֹם טוֹב
  choice: et le deuil en jour de fête
  rationale: אֵבֶל désigne le deuil, tandis que יוֹם טוֹב signifie littéralement « bon jour » et prend ici, dans le contexte des réjouissances, le sens naturel de jour festif.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: afin de faire de ces jours
  rationale: L’infinitif exprime le but de l’institution commémorative. La répétition de « jours » explicite en français le référent du pronom hébreu sans modifier le sens.
- source_word: יְמֵי מִשְׁתֶּה וְשִׂמְחָה
  choice: des jours de festin et de joie
  rationale: מִשְׁתֶּה désigne un banquet ou un festin, souvent associé à la boisson. « Festin » conserve la dimension collective et festive sans mettre indûment l’accent sur l’alcool.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: où l’on s’enverrait des parts
  rationale: מָנוֹת désigne des portions ou parts, vraisemblablement de nourriture. « Des parts » reste proche du texte, tandis que la note précise la pratique probable.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: les uns aux autres
  rationale: L’expression hébraïque littéralement masculine est distributive et décrit un échange mutuel. « Les uns aux autres » en restitue naturellement la fonction en français sans exclure artificiellement les femmes de la célébration.
- source_word: וּמַתָּנוֹת לָאֶבְיוֹנִים
  choice: et où l’on ferait des dons aux pauvres
  rationale: אֶבְיוֹנִים désigne les personnes pauvres ou nécessiteuses. « Dons aux pauvres » est concis, courant et conserve l’accent social du verset.
theological_decisions:
- issue: Portée de l’expression distributive אִישׁ לְרֵעֵהוּ
  choice: les uns aux autres
  alternative: chacun à son prochain
  rationale: Bien que la formulation hébraïque soit littéralement « un homme à son prochain », elle fonctionne ici comme une expression distributive de réciprocité. La traduction retenue transmet cette portée collective sans ajouter de restriction de genre absente de la pratique décrite.
translation_notes:
  register: Français international moderne, digne et accessible. La longue structure syntaxique de l’hébreu est conservée comme continuation du contexte précédent, tout en étant allégée par des propositions relatives. Les termes festifs restent concrets sans archaïsme.
