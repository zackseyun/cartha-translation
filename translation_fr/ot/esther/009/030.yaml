id: EST.9.30
reference: Esther 9:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: fr
  text: Il envoya des lettres à tous les Juifs des cent vingt-sept provinces du royaume d’Assuérus[a], avec des paroles de paix et de vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Assuérus est la forme française du nom royal hébreu; certains l’identifient historiquement à Xerxès Ier.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « des paroles de paix et de vérité ». Ici, « vérité » peut aussi évoquer la fidélité ou la fiabilité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Il envoya
  rationale: Le wayyiqtol fait progresser le récit. En français, le passé simple convient au registre narratif et le pronom renvoie naturellement au sujet indiqué par le contexte.
- source_word: סְפָרִים
  choice: des lettres
  rationale: Dans ce contexte administratif perse, le terme désigne des communications écrites envoyées à travers l’empire.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: à tous les Juifs
  rationale: La formulation rend directement la portée collective de l’hébreu.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: des cent vingt-sept provinces
  rationale: Le second אֶל précise ici l’étendue géographique des destinataires; cette tournure française évite de faire des provinces elles-mêmes les destinataires.
- source_word: מְדִינָה
  choice: provinces
  rationale: Le mot désigne les divisions administratives de l’Empire perse; « provinces » est clair et usuel.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: du royaume d’Assuérus
  rationale: Cette traduction suit directement la chaîne construite hébraïque sans ajouter le titre « roi », absent ici.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: La forme française traditionnelle translittère le nom hébreu sans imposer son identification historique avec Xerxès Ier.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: avec des paroles de paix et de vérité
  rationale: « Paroles » conserve l’expression concrète de l’hébreu, tandis que « avec » l’intègre naturellement à la syntaxe française. אֱמֶת est rendu directement par « vérité », sans exclure les nuances de fidélité ou de fiabilité.
