  text: וְ/קִבֵּל֙ הַ/יְּהוּדִ֔ים אֵ֥ת אֲשֶׁר הֵחֵ֖לּוּ לַ/עֲשׂ֑וֹת וְ/אֵ֛ת אֲשֶׁר כָּתַ֥ב מָרְדֳּכַ֖י אֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/023.yaml
  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: fr
  text: Les Juifs acceptèrent ce qu’ils avaient commencé à faire[a], ainsi que ce que Mardochée leur avait écrit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prirent sur eux [cette pratique] ». Le verbe hébreu peut exprimer l’idée d’accepter ou de prendre sur soi une pratique ou une obligation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: acceptèrent
  rationale: Le verbe קבל exprime ici l’acceptation ou la prise en charge d’une pratique. « Acceptèrent » conserve cette nuance sans rendre l’action trop passive ni trop volontariste.
- source_word: הַיְּהוּדִים
  choice: les Juifs
  rationale: Désignation directe et naturelle du groupe avec l’article défini.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: de continuer ce qu’ils avaient commencé à faire
  rationale: Dans ce contexte, l’objet accepté est la poursuite d’une pratique déjà commencée. « Continuer » explicite naturellement en français la valeur contextuelle sans changer le référent de l’expression hébraïque.
- source_word: וְאֵת אֲשֶׁר
  choice: ainsi que ce que
  rationale: Cette formulation relie clairement le second objet au verbe « acceptèrent » tout en conservant le parallélisme des deux propositions relatives.
- source_word: כָּתַב
  choice: avait écrit
  rationale: Le plus-que-parfait indique naturellement que l’écrit de Mardochée précède l’acceptation rapportée dans ce verset.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: אֲלֵיהֶם
  choice: leur
  rationale: Le pronom français avec « écrire » rend idiomatiquement la direction du message exprimée par אֶל.
