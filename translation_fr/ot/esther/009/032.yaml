  text: וּ/מַאֲמַ֣ר אֶסְתֵּ֔ר קִיַּ֕ם דִּבְרֵ֥י הַ/פֻּרִ֖ים הָ/אֵ֑לֶּה וְ/נִכְתָּ֖ב בַּ/סֵּֽפֶר׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: fr
  text: L’ordre d’Esther confirma les dispositions[a] concernant ces Pourim, et cela fut écrit dans le livre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les paroles concernant ces Pourim ». Le mot hébreu traduit par « dispositions » peut aussi désigner des paroles, des affaires ou des mesures officielles.
    reason: lexical_alternative
  - marker: b
    text: Ou « et cela fut consigné dans le livre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: ordre
  rationale: Dans ce contexte officiel, le terme désigne la directive faisant autorité d’Esther, et non une simple parole. « Ordre » en exprime clairement la force sans préciser davantage sa forme juridique.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Le nom propre est conservé sous sa forme française traditionnelle.
- source_word: קִיַּם
  choice: confirma
  rationale: Le verbe signifie faire tenir, établir ou confirmer. « Confirma » convient au contexte de ratification des pratiques de Pourim tout en restant proche de la formulation hébraïque.
- source_word: דִּבְרֵי
  choice: les dispositions
  rationale: Le nom דָּבָר peut désigner des paroles, mais aussi des affaires ou des mesures officielles. Ici, « dispositions » exprime naturellement le contenu normatif relatif à Pourim.
- source_word: הַפֻּרִים הָאֵלֶּה
  choice: ces Pourim
  rationale: Le nom traditionnel de la fête est conservé, avec le démonstratif pluriel de l’hébreu. Cette formulation maintient la particularité du texte sans la remplacer par une explication absente du verset.
- source_word: וְנִכְתָּב
  choice: et cela fut écrit
  rationale: La forme passive est rendue directement. Le pronom « cela » laisse ouverte l’étendue exacte de ce qui fut écrit, comme dans le texte hébreu.
- source_word: בַּסֵּפֶר
  choice: dans le livre
  rationale: סֵפֶר peut désigner un livre, un rouleau ou un registre. « Le livre » est l’équivalent direct et n’identifie pas abusivement le document.
