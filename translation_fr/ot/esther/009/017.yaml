  text: on the thirteenth day of the month of Adar[a], and resting on the fourteenth day of it[b], and making it a day of feasting and gladness.
translation:
  language: fr
  text: Le treizième jour du mois d’Adar, ils se reposèrent le quatorzième jour de ce mois et en firent un jour de festin et de joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: le treizième jour du mois d’Adar
  rationale: La préposition ב marque ici le temps, et le nombre cardinal hébreu a une fonction ordinale dans cette formule de datation.
- source_word: וְנוֹחַ
  choice: puis ils se reposèrent
  rationale: L’infinitif absolu poursuit la séquence narrative et peut être rendu naturellement par un verbe conjugué; נוח exprime ici la cessation des combats plutôt que le sommeil.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: le quatorzième jour de ce même mois
  rationale: Le pronom בּוֹ renvoie au mois d’Adar; cette formulation explicite son référent sans ajouter d’information étrangère au texte.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: et en firent
  rationale: L’infinitif absolu coordonné est rendu par un verbe conjugué en français afin de poursuivre clairement la narration; «en» reprend le jour mentionné.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: un jour de festin et de joie
  rationale: מִשְׁתֶּה désigne un festin ou banquet, souvent accompagné de boisson, tandis que שִׂמְחָה exprime la joie festive.
