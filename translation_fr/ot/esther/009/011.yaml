  text: בַּ/יּ֣וֹם הַ/ה֗וּא בָּ֣א מִסְפַּ֧ר הַֽ/הֲרוּגִ֛ים בְּ/שׁוּשַׁ֥ן הַ/בִּירָ֖ה לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/011.yaml
  text: On that day the number of those killed in Susa the citadel came before the king.
translation:
  language: fr
  text: Ce jour-là, le nombre des personnes tuées dans Suse, la citadelle, parvint au roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: parvint
  rationale: Rend naturellement le verbe « venir » dans le sens où une information arrive jusqu’au roi, sans ajouter explicitement l’idée passive « fut communiqué ».
- source_word: הַהֲרוּגִים
  choice: des personnes tuées
  rationale: Exprime le participe passif pluriel de façon claire et inclusive, sans préciser davantage l’identité des morts.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Suse, la citadelle
  rationale: Conserve la désignation géographique et administrative du texte hébreu; « citadelle » convient au terme בִּירָה dans le contexte d’Esther.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: au roi
  rationale: Dans cette tournure, l’expression littérale « devant le roi » indique que le renseignement lui parvient; « au roi » est idiomatique en français.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La formulation reste proche de la syntaxe hébraïque tout en évitant le calque peu naturel « vint devant le roi ».
