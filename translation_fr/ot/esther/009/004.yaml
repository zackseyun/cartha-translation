source:
  edition: WLC
  text: כִּֽי גָ֤דוֹל מָרְדֳּכַי֙ בְּ/בֵ֣ית הַ/מֶּ֔לֶךְ וְ/שָׁמְע֖/וֹ הוֹלֵ֣ךְ בְּ/כָל הַ/מְּדִינ֑וֹת כִּֽי הָ/אִ֥ישׁ מָרְדֳּכַ֖י הוֹלֵ֥ךְ וְ/גָדֽוֹל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: fr
  text: En effet, Mardochée occupait une place importante dans la maison du roi[a], et sa renommée se répandait dans toutes les provinces, car cet homme, Mardochée, devenait de plus en plus important[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la cour du roi » ou « dans le palais royal ».'
    reason: L’expression hébraïque signifie littéralement « dans la maison du roi » et peut évoquer aussi bien le palais que la cour royale.
  - marker: b
    text: 'Littéralement : « allait et grandissait », expression hébraïque indiquant une progression continuelle.'
    reason: La note signale l’idiome source que rend l’expression naturelle « devenait de plus en plus important ».
lexical_decisions:
- source_word: כִּי
  choice: En effet / car
  rationale: Les deux occurrences introduisent une explication. La variation « En effet / car » rend ce lien logique naturellement en français sans effacer la répétition du raisonnement.
- source_word: גָדוֹל
  choice: occupait une place importante
  rationale: Dans le cadre royal, l’adjectif exprime la grandeur de rang ou d’influence. Cette formulation française évite de réduire le sens à la seule puissance politique.
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: dans la maison du roi
  rationale: La traduction conserve l’image hébraïque, qui peut désigner le palais ou, par extension, l’administration et la cour royales.
- source_word: שָׁמְעוֹ
  choice: sa renommée
  rationale: Le nom peut désigner ce qu’on entend dire de quelqu’un, sa réputation ou sa renommée. Dans ce contexte de prestige croissant, « renommée » est naturel tout en restant assez large.
- source_word: הוֹלֵךְ
  choice: se répandait
  rationale: Avec la renommée pour sujet, le participe décrit sa diffusion continue à travers les provinces.
- source_word: בְּכָל הַמְּדִינוֹת
  choice: dans toutes les provinces
  rationale: « Provinces » correspond au contexte administratif perse du livre d’Esther, et la préposition française exprime ici une diffusion dans l’ensemble du territoire.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: cet homme, Mardochée
  rationale: Cette tournure conserve l’insistance inhabituelle de l’hébreu sur la personne de Mardochée, sans employer le calque peu naturel « l’homme Mardochée ».
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: devenait de plus en plus important
  rationale: L’expression hébraïque marque une progression continue. La formulation française restitue clairement l’accroissement de rang, de prestige et d’influence.
theological_decisions: []
