source:
  edition: WLC
  text: לְ/קַיֵּם֮ עֲלֵי/הֶם֒ לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וְ/אֵ֛ת יוֹם חֲמִשָּׁ֥ה עָשָׂ֖ר בּ֑/וֹ בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: fr
  text: pour leur prescrire de célébrer le quatorzième jour du mois d’Adar et le quinzième jour du même mois, année après année[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « chaque année et année » ; la répétition hébraïque souligne que cette célébration doit avoir lieu tous les ans.'
    reason: La note signale la tournure distributive emphatique de l’hébreu, rendue idiomatiquement dans le texte.
lexical_decisions:
- source_word: לְקַיֵּם עֲלֵיהֶם
  choice: pour leur prescrire
  rationale: Dans ce contexte administratif, le piel de קום avec עַל exprime l’établissement ou la confirmation d’une obligation qui s’impose à la communauté. « Leur prescrire » rend cette force de manière naturelle, sans la lourdeur du littéral « établir sur eux ».
- source_word: לִהְיוֹת עֹשִׂים
  choice: de célébrer
  rationale: Littéralement « être en train de faire » ; appliqué à des jours commémoratifs, le français idiomatique emploie « célébrer ». Ce choix exprime la pratique annuelle sans ajouter de contenu rituel.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: le quatorzième jour du mois d’Adar
  rationale: Rendu français standard et fidèle de la formule calendaire hébraïque.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: et le quinzième jour du même mois
  rationale: Le pronom בּוֹ renvoie au mois d’Adar. La reprise « du même mois » est plus claire et naturelle en français que « en lui ».
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: année après année
  rationale: La répétition hébraïque de « année » a une valeur distributive et souligne la régularité annuelle. « Année après année » en conserve l’insistance dans un français naturel.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le verset demeure une proposition infinitive dépendant du contexte précédent, d’où l’initiale en minuscule et la virgule finale. « Prescrire » conserve la portée normative du courrier de Mardochée, tandis que « célébrer » convient naturellement à l’observance de jours commémoratifs.
