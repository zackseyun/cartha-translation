    rationale: La note explique le verbe תלה et doit donc être ancrée immédiatement après son rendu.
  - severity: low
    issue: « l’on pendit » emploie une active impersonnelle
    rationale: Le texte hébreu emploie un passif (« furent pendus »). Le passif français conserve mieux cette présentation sans nuire à la fluidité.
