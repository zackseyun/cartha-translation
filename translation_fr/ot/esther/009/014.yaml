- from: Le roi ordonna donc que cela soit fait ainsi. Un décret fut publié à Suse, et l’on pendit les dix fils d’Haman[a].
  to: Le roi dit qu’il fallait faire ainsi. Un décret fut publié à Suse, et les dix fils d’Haman furent pendus[a].
  rationale: La révision ramène le premier verbe à la valeur lexicale de אמר sans effacer la portée contextuelle de l'autorisation royale. Elle conserve le passif du texte source pour les fils d’Haman, déplace l'appel de note sur le mot concerné et reformule la variante pour préserver sobrement l'ambiguïté historique de תלה.
