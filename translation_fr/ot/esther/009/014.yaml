review_pass:
  verdict: revise
  source_fidelity: « Le roi ordonna » renforce indûment וַיֹּאמֶר (« le roi dit »). Dans ce contexte, la parole royale autorise bien l'action, mais le verbe hébreu ne formule pas explicitement un ordre. La forme passive « furent pendus » rend plus directement תָּלוּ que l'impersonnel actif « l’on pendit ».
  naturalness: Le passé simple et « Un décret fut publié à Suse » conviennent à un récit biblique moderne et soutenu. « Le roi dit qu’il fallait faire ainsi » est idiomatique, conserve la formulation non technique du verbe hébreu et exprime naturellement l'autorisation demandée.
  terminology: « Suse » et « Haman » sont les formes françaises usuelles. « Décret » rend bien דָּת dans ce contexte administratif. « Pendus » demeure une traduction recevable de תלה, à condition que la note liée au terme préserve l'incertitude quant au mode exact de mise à mort ou d'exposition.
