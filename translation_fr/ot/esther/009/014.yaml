  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/הֵֽעָשׂ֣וֹת כֵּ֔ן וַ/תִּנָּתֵ֥ן דָּ֖ת בְּ/שׁוּשָׁ֑ן וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן תָּלֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: fr
  text: Le roi dit qu’il fallait faire ainsi. Un décret fut publié à Suse, et les dix fils d’Haman furent pendus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent empalés ». Le verbe hébreu peut désigner des corps suspendus à un pieu ou à un poteau, et pas nécessairement une pendaison par le cou au sens moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Le roi ordonna
  rationale: אמר signifie normalement « dire », mais, avec l’infinitif לְהֵעָשׂוֹת dans ce contexte royal, la parole autorise et prescrit l’exécution de la demande. « Ordonna » rend naturellement cette valeur contextuelle sans ajouter de contenu au décret.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: que cela soit fait ainsi
  rationale: La tournure conserve le sens passif de l’infinitif de עשה et rend directement כֵּן par « ainsi ».
- source_word: וַתִּנָּתֵן דָּת
  choice: Un décret fut publié
  rationale: Littéralement, un décret « fut donné ». « Fut publié » exprime en français courant l’acte administratif de promulgation impliqué par l’expression.
- source_word: בְּשׁוּשָׁן
  choice: à Suse
  rationale: « Suse » est la forme française conventionnelle du nom de la ville; la préposition locative se rend naturellement par « à ».
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: les dix fils d’Haman
  rationale: Rend directement la chaîne construite hébraïque, avec les déterminants requis en français.
- source_word: תָּלוּ
  choice: l’on pendit
  rationale: תלה désigne le fait de suspendre à un bois, un poteau ou une potence; « pendit » est la formulation narrative traditionnelle et concise, tandis qu’une note préserve l’incertitude sur la méthode précise.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. Le passé simple convient au récit biblique écrit. « Le roi ordonna » rend la force performative de sa parole dans ce contexte, tandis que la note maintient l’ambiguïté historique de תלה.
