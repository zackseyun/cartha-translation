  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: fr
  text: Car Haman, fils de Hammedata, l’Agaguite, ennemi de tous les Juifs, avait comploté contre les Juifs pour les faire périr. Il avait jeté le Pour — c’est-à-dire le sort[a] — afin de les plonger dans la confusion[b] et de les faire périr.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « Pour » vient d’une langue étrangère et le texte lui-même l’explique par « le sort ». Le conserver fait ressortir son lien avec le nom « Pourim » dans le passage environnant.
    reason: cultural_note
  - marker: b
    text: Ou « les frapper de panique » ; le verbe hébreu peut aussi exprimer l’idée de bouleverser ou de dérouter. Certains proposent « les écraser ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’observance évoquée dans le contexte. « Car » restitue clairement ce lien logique.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: Haman, fils de Hammedata, l’Agaguite
  rationale: Les noms sont translittérés selon les usages français courants, et « l’Agaguite » conserve la désignation d’origine ou d’appartenance sans l’interpréter davantage.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: ennemi de tous les Juifs
  rationale: Le participe désigne celui qui agit en adversaire ou en oppresseur ; « ennemi » est naturel et garde toute la force hostile de l’expression.
- source_word: חָשַׁב עַל הַיְּהוּדִים
  choice: avait comploté contre les Juifs
  rationale: Le verbe suivi de la préposition exprime ici un projet hostile et prémédité, bien rendu par « comploter contre ».
- source_word: לְאַבְּדָם
  choice: pour les faire périr
  rationale: La forme causative exprime le fait de causer leur perte. « Faire périr » est idiomatique, fort et légèrement plus proche de la valeur du verbe que le simple « tuer ».
- source_word: וְהִפִּיל פּוּר
  choice: Il avait jeté le Pour
  rationale: Le terme d’emprunt פּוּר est conservé afin de préserver son lien explicite avec le nom de la fête des Pourim. Une nouvelle proposition évite une phrase française excessivement chargée.
- source_word: הוּא הַגּוֹרָל
  choice: c’est-à-dire le sort
  rationale: L’apposition hébraïque explique le mot étranger « Pour » ; « le sort » est l’équivalent français usuel de גּוֹרָל dans ce contexte.
- source_word: לְהֻמָּם
  choice: afin de les plonger dans la confusion
  rationale: Le verbe peut évoquer le bouleversement, la panique ou la confusion. Cette formulation conserve la valeur déstabilisatrice du terme sans trancher en faveur du sens contesté « écraser ».
- source_word: וּלְאַבְּדָם
  choice: et de les faire périr
  rationale: La répétition de la formule précédente est maintenue, comme dans l’hébreu, pour conserver l’insistance sur le dessein destructeur d’Haman.
theological_decisions: []
