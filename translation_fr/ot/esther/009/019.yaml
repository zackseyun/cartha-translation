  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: fr
  text: C’est pourquoi les Juifs qui habitent dans les villes sans murailles font du quatorzième jour du mois d’Adar un jour de joie, de festin et de fête, où chacun envoie des portions[b] à son prochain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Les « portions » étaient probablement des portions de nourriture ou des présents destinés au festin.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution exprime la conséquence tirée du récit précédent et constitue un enchaînement naturel en français moderne.
- source_word: הַיְּהוּדִים
  choice: les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif dispersé dans l’Empire perse, et non simplement les habitants de Juda.
- source_word: הפרוזים
  choice: des villages
  rationale: Le mot désigne les habitants d’agglomérations ouvertes, dépourvues de murailles, par contraste avec ceux de Suse; « des villages » est idiomatique, tandis que la nuance littérale est signalée en note.
- source_word: הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: ceux qui habitent dans les localités rurales
  rationale: La proposition précise l’identité du groupe précédent. « Localités rurales » évite une répétition pesante et communique naturellement le cadre géographique, sans effacer la nuance des villes non fortifiées donnée en note.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: font du quatorzième jour
  rationale: Avec un jour comme complément, עשה signifie le célébrer ou l’observer. La construction française « faire de… un jour de… » conserve la forme et le sens du texte hébreu.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: du mois d’Adar
  rationale: Cette formulation française standard rend fidèlement la date hébraïque.
- source_word: שִׂמְחָה
  choice: joie
  rationale: « Joie » rend clairement et dignement le sentiment festif exprimé par le substantif.
- source_word: וּמִשְׁתֶּה
  choice: festin
  rationale: Le terme désigne un banquet festif, souvent accompagné de boisson; « festin » conserve cette dimension sans préciser davantage que la source.
- source_word: וְיוֹם טוֹב
  choice: un jour de fête
  rationale: L’expression idiomatique hébraïque désigne une journée festive. « Jour de fête » convient mieux au contexte ancien que le français moderne « jour férié ».
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: où chacun envoie des portions
  rationale: La formulation garde le sens général de « portions » sans imposer dans le texte qu’il s’agit de nourriture, tout en rendant l’enchaînement naturel en français; la note explique l’usage probable.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: chacun … à son prochain
  rationale: « Chacun » rend la valeur distributive de אִישׁ, et « son prochain » traduit רֵעֵהוּ comme un autre membre de la communauté sans alourdir la phrase.
theological_decisions:
- issue: Expression distributive masculine אִישׁ לְרֵעֵהוּ
  choice: chacun … à son prochain
  alternative: chaque homme à son prochain; les uns aux autres
  rationale: En français, « chacun » conserve le singulier distributif et son référent humain sans affirmer que seuls les hommes participent à cette pratique communautaire. « Son prochain » maintient également la forme singulière du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure causale et festive de l’hébreu, tout en explicitant en notes les nuances géographiques et culturelles qui ne peuvent être entièrement portées par une formulation fluide.
