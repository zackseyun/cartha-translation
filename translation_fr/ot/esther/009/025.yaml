base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: fr
  text: Mais lorsqu’elle se présenta devant le roi, celui-ci ordonna par écrit[a] que le mauvais dessein qu’Haman avait conçu contre les Juifs retombe sur sa propre tête. On le pendit, ainsi que ses fils, à la potence[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, la formulation hébraïque peut se rendre par « il dit avec le document » ou « il dit dans le document »; elle évoque ici une décision royale mise par écrit.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi évoquer le fait de suspendre ou d’empaler quelqu’un, et le mot traduit par « potence » signifie littéralement « arbre » ou « bois »; il peut désigner un pieu ou un poteau de bois.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: lorsqu’elle se présenta
  rationale: Le suffixe féminin singulier renvoie le plus naturellement à Esther dans le contexte. « Se présenta » exprime idiomatiquement sa venue dans la présence royale.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: Expression française naturelle correspondant à l’idée de paraître en présence du roi.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: celui-ci ordonna par écrit
  rationale: La formule hébraïque, littéralement proche de « il dit avec le document », est condensée. Le contexte indique une décision royale consignée dans un écrit; « celui-ci » identifie clairement le roi sans effacer l’ambiguïté lexicale signalée en note.
- source_word: יָשׁוּב
  choice: retombe
  rationale: Le verbe décrit le retournement du projet contre son auteur. Le présent après « ordonna que » est naturel en français et conserve l’image de la rétribution.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה
  choice: le projet criminel
  rationale: מַחֲשָׁבָה désigne ici un dessein élaboré, et הָרָעָה sa nature malfaisante. « Projet criminel » est clair, actuel et digne.
- source_word: אֲשֶׁר חָשַׁב
  choice: qu’Haman avait conçu
  rationale: « Avait conçu » maintient le lien lexical avec le projet. Le nom d’Haman explicite naturellement l’antécédent masculin dans cette phrase récapitulative.
- source_word: עַל הַיְּהוּדִים
  choice: contre les Juifs
  rationale: La préposition עַל exprime ici l’hostilité dirigée contre les Juifs.
- source_word: עַל רֹאשׁוֹ
  choice: sur sa propre tête
  rationale: Cette formulation conserve l’image hébraïque de la rétribution qui revient sur l’auteur du mal.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו
  choice: On le pendit alors, ainsi que ses fils
  rationale: תלה signifie suspendre et peut, dans ce contexte, décrire une pendaison ou une exposition sur un pieu. La traduction traditionnelle « pendit » reste naturelle, tandis que l’incertitude sur le procédé est conservée en note.
- source_word: עַל הָעֵץ
  choice: à la potence
  rationale: עֵץ signifie littéralement arbre ou bois et désigne ici la structure d’exécution. « Potence » convient au contexte français, sans prétendre que sa forme correspondait nécessairement à une potence moderne; cette réserve figure en note.
