  to: Mais lorsqu’elle se présenta devant le roi, celui-ci ordonna par écrit[a] que le mauvais dessein qu’Haman avait conçu contre les Juifs retombe sur sa propre tête. On le pendit, ainsi que ses fils, à la potence[b].
