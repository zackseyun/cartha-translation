  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: fr
  text: Mais les Juifs qui étaient à Suse se rassemblèrent le treizième et le quatorzième jour du mois. Ils se reposèrent le quinzième jour du mois et en firent un jour de festin et de joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Mais les Juifs qui étaient à Suse
  rationale: Le waw marque ici le contraste avec les Juifs des provinces mentionnés au verset précédent. « Suse » est la forme française usuelle du nom de la ville.
- source_word: נִקְהֲלוּ
  choice: se rassemblèrent
  rationale: Le niphal de קהל exprime ici le fait de se réunir, sans préciser davantage le motif.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: le treizième et le quatorzième jour du mois
  rationale: Le pronom hébreu renvoie au mois connu par le contexte. L'explicitation « du mois » donne un français clair tout en conservant la succession des deux dates.
- source_word: וְנוֹחַ
  choice: Ils se reposèrent
  rationale: Le verbe נוח indique la cessation des combats et le repos qui s'ensuit.
- source_word: בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: le quinzième jour
  rationale: Le mois reste implicite en français après sa mention dans la phrase précédente, comme il l'est en hébreu par renvoi contextuel.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: et en firent
  rationale: Cette tournure rend naturellement l'idée qu'ils firent de cette date un jour caractérisé de la manière indiquée ensuite.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: un jour de festin et de joie
  rationale: מִשְׁתֶּה désigne un festin ou banquet, souvent associé à la boisson, tandis que שִׂמְחָה exprime la joie festive.
