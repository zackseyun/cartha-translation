  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מָרְדֳּכַ֔י אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֲשֶׁר֙ בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ הַ/קְּרוֹבִ֖ים וְ/הָ/רְחוֹקִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: fr
  text: Mardochée mit alors ces choses[a] par écrit et envoya des lettres à tous les Juifs qui se trouvaient dans toutes les provinces du roi Assuérus, qu’ils soient proches ou éloignés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces paroles ». Le terme hébreu peut désigner aussi bien les faits qui viennent d’être racontés que les paroles par lesquelles Mardochée les a consignés.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: mit alors … par écrit
  rationale: Le verbe כתב signifie écrire. « Mettre par écrit » est naturel en français dans ce contexte et exprime clairement que Mardochée consigne ce qui vient d’être raconté; « alors » rend la progression narrative du waw consécutif.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ces choses
  rationale: דְּבָרִים peut désigner des choses, des faits ou des paroles. « Ces choses » conserve la référence large aux événements racontés sans exclure les paroles mises par écrit; l’autre sens est signalé en note.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: envoya des lettres
  rationale: Dans ce contexte administratif, סְפָרִים désigne des communications écrites. « Lettres » est l’équivalent français courant et approprié.
- source_word: כָּל הַיְּהוּדִים
  choice: tous les Juifs
  rationale: Rendu direct de l’expression qui désigne l’ensemble des Juifs concernés dans l’empire.
- source_word: בְּכָל מְדִינוֹת
  choice: dans toutes les provinces
  rationale: מְדִינוֹת désigne ici les circonscriptions administratives de l’empire; « provinces » est le terme français précis et usuel.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: du roi Assuérus
  rationale: Rendu français naturel de la chaîne construite, avec la forme française traditionnelle et reconnaissable du nom royal.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: qu’ils soient proches ou éloignés
  rationale: Les adjectifs masculins pluriels se rapportent aux Juifs et forment un mérisme englobant ceux qui vivent à proximité comme à grande distance.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La formulation reste proche de la syntaxe narrative hébraïque tout en évitant une tournure peu naturelle comme « écrivit ces choses ». Le pronom « ils » dans la dernière proposition indique que la proximité ou l’éloignement qualifie les Juifs, conformément à l’accord grammatical hébreu.
