lexical_decisions:
- source_word: וְ/אֵת
  choice: ainsi que …, … et …
  rationale: La conjonction וְ jointe à la marque de l’objet direct אֵת introduit chacun des noms dans une liste qui se poursuit depuis le verset précédent. En français, la marque de l’objet direct ne se traduit pas; « ainsi que » signale naturellement la continuité, et le dernier « et » respecte l’usage français dans une énumération.
- source_word: פּוֹרָתָא
  choice: Porata
  rationale: Nom propre translittéré sous une forme française simple et proche du texte hébreu.
- source_word: אֲדַלְיָא
  choice: Adalia
  rationale: Nom propre translittéré sous sa forme française usuelle.
- source_word: אֲרִידָתָא
  choice: Aridata
  rationale: Nom propre translittéré sous une forme française simple et proche du texte hébreu.
