source:
  edition: WLC
  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: fr
  text: Ces jours sont commémorés et observés dans chaque génération, dans chaque famille, dans chaque province et dans chaque ville[a]. Ces jours de Pourim ne disparaîtront pas du milieu des Juifs, et leur souvenir ne s’éteindra pas parmi leurs descendants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « de génération en génération, famille par famille, province par province et ville par ville ». L’hébreu répète les noms au singulier pour exprimer une portée distributive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: seront commémorés
  rationale: Le niphal de זכר indique que ces jours sont gardés en mémoire. « Commémorés » rend naturellement en français la mémoire collective et régulière d’une fête.
- source_word: וְנַעֲשִׂים
  choice: et observés
  rationale: Le verbe signifie littéralement « faits », mais désigne ici la mise en pratique de la fête. « Observés » conserve cette dimension sans préciser excessivement la forme de la célébration.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: dans chaque génération
  rationale: La répétition du singulier a une valeur distributive et vise toutes les générations successives.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: dans chaque famille
  rationale: La formulation française exprime clairement la valeur distributive de la répétition hébraïque.
- source_word: מְדִינָה וּמְדִינָה
  choice: dans chaque province
  rationale: Dans Esther, מְדִינָה désigne normalement une province administrative de l’Empire perse.
- source_word: וְעִיר וָעִיר
  choice: et dans chaque ville
  rationale: « Chaque ville » restitue naturellement la portée distributive de la construction hébraïque.
- source_word: יְמֵי הַפּוּרִים
  choice: jours de Pourim
  rationale: « Pourim » est la forme française établie du nom de la fête, et « jours de Pourim » conserve la construction hébraïque.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: ne disparaîtront pas du milieu des Juifs
  rationale: Avec מִתּוֹךְ, עבר évoque ici le fait de disparaître de la vie ou de la pratique de la communauté. Cette traduction garde l’image tout en restant idiomatique.
- source_word: וְזִכְרָם
  choice: et leur souvenir
  rationale: Le suffixe renvoie aux jours de Pourim. « Leur souvenir » convient au contexte commémoratif et sonne plus naturel en français que « leur remembrance ».
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: ne s’éteindra pas parmi leurs descendants
  rationale: יסוף exprime la cessation, tandis que זֶרַע désigne ici la postérité. « Ne s’éteindra pas » rend de façon naturelle et solennelle la permanence de ce souvenir.
- source_word: זַרְעָם
  choice: leurs descendants
  rationale: Dans ce contexte, le mot désigne la postérité des Juifs plutôt qu’une semence au sens propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le futur rend la portée normative et prospective du passage. « Commémorés et observés » distingue la mémoire des jours de leur mise en pratique, tandis que la note conserve la forme distributive marquée de l’hébreu.
