lexical_decisions:
- source_word: וְאֵת
  choice: '[non traduit séparément ; rendu par la ponctuation et la coordination de l’énumération]'
  rationale: אֵת marque le complément d’objet direct défini. Sa répétition avec וְ structure ici une liste qui dépend du verbe « tuèrent » au verset précédent ; le français ne traduit normalement pas ce marqueur.
- source_word: פַּרְשַׁנְדָּתָא
  choice: Parshandata
  rationale: Nom propre probablement d’origine perse, translittéré sous une forme naturelle en français ; le ת est rendu par « t », sans graphie anglaise « th ».
- source_word: דַּלְפוֹן
  choice: Dalfôn
  rationale: Nom propre translittéré en français. L’accent circonflexe distingue la voyelle longue sans reproduire une graphie anglaise.
- source_word: אַסְפָּתָא
  choice: Aspata
  rationale: Nom propre probablement d’origine perse, translittéré sous une forme naturelle en français ; le ת est rendu par « t ».
