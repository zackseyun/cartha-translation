  text: וַ/תֹּ֤אמֶר אֶסְתֵּר֙ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִנָּתֵ֣ן גַּם מָחָ֗ר לַ/יְּהוּדִים֙ אֲשֶׁ֣ר בְּ/שׁוּשָׁ֔ן לַ/עֲשׂ֖וֹת כְּ/דָ֣ת הַ/יּ֑וֹם וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן יִתְל֥וּ עַל הָ/עֵֽץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: fr
  text: 'Esther dit : « Si le roi le juge bon, qu’il soit accordé aux Juifs qui sont à Suse d’agir encore demain selon le décret d’aujourd’hui, et que les dix fils d’Haman soient pendus au poteau[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « suspendus à la structure en bois ». L’hébreu dit littéralement « à l’arbre/au bois » et peut désigner un arbre, un poteau ou une potence. Les fils d’Haman avaient déjà été tués (verset 10); il s’agit donc probablement ici d’exposer leurs corps.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette formule de cour exprime l’approbation ou le bon plaisir du roi, et non un jugement moral. Cette traduction est naturelle et digne en français moderne.
- source_word: יִנָּתֵן
  choice: qu’il soit accordé
  rationale: Le passif à valeur jussive présente la demande comme une autorisation officielle sollicitée du roi.
- source_word: גַּם מָחָר
  choice: encore demain
  rationale: La formule prolonge au lendemain l’autorisation valable ce jour-là; « encore demain » l’exprime naturellement.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: aux Juifs qui sont à Suse
  rationale: Le datif désigne les bénéficiaires de l’autorisation, tandis que la proposition relative suit clairement la structure hébraïque.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: d’agir encore demain selon le décret d’aujourd’hui
  rationale: Le verbe est maintenu dans sa généralité et דָּת désigne ici un décret officiel dans le cadre de la cour perse.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: les dix fils d’Haman
  rationale: Cette tournure rend directement et naturellement la chaîne construite hébraïque.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: soient pendus au poteau
  rationale: תלה signifie « pendre/suspendre », tandis que עֵץ peut désigner un arbre, du bois ou une structure en bois. « Poteau » évite d’imposer la forme précise de « potence » et convient à une exposition de corps déjà morts, comme l’indique le contexte immédiat.
theological_decisions:
- issue: La demande visant les dix fils d’Haman peut concerner l’exposition de leurs cadavres plutôt qu’une nouvelle exécution.
  choice: « soient pendus au poteau » sans ajouter « exécutés »
  alternative: « soient mis à mort et pendus à la potence »
  rationale: Esther 9:10 indique qu’ils ont déjà été tués. Le texte hébreu demande ici qu’ils soient pendus ou exposés sur la structure; il ne faut donc pas transformer implicitement cette action en seconde mise à mort.
translation_notes:
  register: Français international moderne, clair et digne. La formule de cour reste respectueuse sans archaïsme. La traduction conserve la généralité de « faire/agir » et l’ambiguïté matérielle de la structure en bois, explicitée en note.
