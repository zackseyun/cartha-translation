  yaml_path: translation/ot/esther/009/006.yaml
  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: fr
  text: À Suse, dans la citadelle[a], les Juifs tuèrent et firent périr cinq cents hommes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « forteresse ». Le terme hébreu peut désigner une citadelle ou un ensemble palatial fortifié.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: À Suse
  rationale: Le waw relie ce verset au récit précédent, mais il n’est pas nécessaire de le rendre explicitement en français. « À Suse » exprime naturellement la localisation.
- source_word: הַ/בִּירָה
  choice: dans la citadelle
  rationale: בִּירָה désigne ici le secteur fortifié, probablement l’acropole ou l’ensemble palatial fortifié de Suse. « Citadelle » conserve cette portée sans réduire le terme au seul palais royal.
- source_word: הָרְגוּ
  choice: tuèrent
  rationale: Le verbe הרג signifie directement « tuer ». Le passé simple convient au registre narratif soutenu et actuel de la traduction biblique.
- source_word: הַ/יְּהוּדִים
  choice: les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif; « les Juifs » est la formulation française usuelle et contextuellement juste.
- source_word: וְ/אַבֵּד
  choice: et firent périr
  rationale: Le piel de אבד exprime le fait de causer la perte ou la destruction. « Firent périr » préserve le second verbe hébreu sans produire l’association peu naturelle « tuèrent et détruisirent » appliquée à des hommes.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: cinq cents hommes
  rationale: L’expression hébraïque compte explicitement cinq cents hommes. La traduction conserve ce référent masculin plutôt que de le neutraliser en « personnes ».
