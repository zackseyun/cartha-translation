source:
  edition: WLC
  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: fr
  text: Les Juifs se rassemblèrent dans leurs villes, dans toutes les provinces du roi Assuérus, pour porter la main sur ceux qui cherchaient à leur faire du mal[a]. Personne ne put leur résister[b], car la peur qu’ils inspiraient s’était emparée de tous les peuples[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour attaquer ceux qui cherchaient à leur faire du mal » ; l’expression hébraïque signifie littéralement « étendre la main contre ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « personne ne se tint devant eux ».'
    reason: lexical_alternative
  - marker: c
    text: Le terme « peuples » désigne probablement les différents groupes ethniques ou populations de l’empire, et non une seule nation.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: se rassemblèrent
  rationale: Le nifal de קהל exprime ici le fait de se réunir; le verbe pronominal français rend naturellement cette action collective.
- source_word: בְּעָרֵיהֶם
  choice: dans leurs villes
  rationale: עִיר désigne couramment une ville; le suffixe possessif et la valeur locative sont conservés.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: dans toutes les provinces du roi Assuérus
  rationale: מְדִינוֹת désigne les circonscriptions administratives de l’Empire perse; « dans toutes » restitue directement la portée distributive.
- source_word: לִשְׁלֹחַ יָד
  choice: pour porter la main sur
  rationale: Cette expression conserve l’image de l’idiome hébreu tout en signalant en français une action hostile; une formulation plus explicite est indiquée en note.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: ceux qui cherchaient à leur faire du mal
  rationale: La formulation rend le participe actif et רָעָה dans son sens contextuel de mal ou de tort recherché contre eux.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Personne ne put leur résister
  rationale: Littéralement, aucun homme ne se tint devant eux; dans ce contexte conflictuel, l’expression signifie que personne ne réussit à leur tenir tête ou à leur résister.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: car la peur qu’ils inspiraient s’était emparée
  rationale: Le suffixe de פַּחְדָּם indique la peur éprouvée à leur égard. « S’était emparée » transpose naturellement en français l’image hébraïque d’une peur qui tombe sur quelqu’un.
- source_word: עַל כָּל הָעַמִּים
  choice: de tous les peuples
  rationale: Le pluriel עַמִּים renvoie aux divers peuples ou groupes de population de l’empire, et non à une seule nation.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: Forme française traditionnelle et largement reconnue du nom royal dans le livre d’Esther.
theological_decisions: []
