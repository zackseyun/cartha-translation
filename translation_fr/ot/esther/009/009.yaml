lexical_decisions:
- source_word: פַּרְמַשְׁתָּא
  choice: Parmachta
  rationale: Nom propre translittéré selon des conventions françaises lisibles, où « ch » représente le son de la lettre hébraïque shin.
- source_word: אֲרִיסַי
  choice: Arisaï
  rationale: Nom propre translittéré directement; le tréma indique que « aï » se prononce en deux voyelles.
- source_word: אֲרִדַי
  choice: Aridaï
  rationale: Nom propre translittéré directement; le tréma préserve la distinction des voyelles finales.
- source_word: וַיְזָתָא
  choice: Vaïzata
  rationale: Nom propre translittéré dans une forme naturelle en français, avec « V » pour le waw initial et un tréma pour éviter la lecture de « ai » comme une seule voyelle.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: liste séparée par des virgules, avec « et » devant le dernier nom
  rationale: La répétition hébraïque de la conjonction et du marqueur d’objet introduit chaque élément de la liste; la ponctuation française et un dernier « et » en rendent naturellement la fonction.
