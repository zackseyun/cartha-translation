revisions:
- from: les Juifs établirent et acceptèrent, pour eux-mêmes, pour leurs descendants et pour tous ceux qui se joindraient à eux[a], l’obligation — sans jamais y manquer[b] — de célébrer ces deux jours conformément à ce qui avait été écrit à leur sujet et au temps fixé pour eux, année après année.
  to: Les Juifs instituèrent et acceptèrent pour eux-mêmes, pour leur descendance et pour tous ceux qui se joignaient à eux[a] l’obligation d’observer ces deux jours selon ce qui était écrit pour eux et au moment qui leur était fixé, année après année, sans jamais y manquer[b].
  rationale: La révision élimine l’interprétation restrictive « à leur sujet » et l’antériorité ajoutée par le plus-que-parfait, tout en conservant l’ambiguïté du renvoi à l’écrit prescrit. Elle rend la clause de continuité directement dans la phrase et emploie « observer », terme français naturel pour l’accomplissement régulier de jours fixés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:53:48Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien la double action d’instituer et d’accepter, l’extension à la descendance et aux personnes associées aux Juifs, ainsi que la répétition annuelle. Toutefois, « ce qui avait été écrit à leur sujet » interprète trop précisément le suffixe de כִּכְתָבָם et introduit un antériorité que l’hébreu n’exprime pas. Une formulation plus neutre préserve mieux la référence à la prescription écrite.
  naturalness: Le français est globalement naturel et de registre approprié. La phrase révisée conserve une syntaxe juridique claire tout en évitant l’incise entre tirets, qui alourdissait la construction de l’obligation.
  terminology: « instituer et accepter », « descendance », « se joindre », « observer » et « année après année » conviennent au contexte. « Observer » restitue plus exactement l’idée de pratique prescrite que « célébrer », sans exclure le caractère festif du contexte.
  issues:
  - severity: medium
    issue: « conformément à ce qui avait été écrit à leur sujet »
    rationale: Le suffixe de כִּכְתָבָם renvoie à leur écrit/prescription écrite, non nécessairement à un texte écrit « à leur sujet ». Le plus-que-parfait « avait été écrit » ajoute aussi une nuance temporelle absente de l’hébreu.
  - severity: low
    issue: Incise « — sans jamais y manquer — »
    rationale: Le sens est juste, mais l’incise dissocie inutilement la clause de non-lapsus de l’obligation d’observer. Une intégration directe est plus fluide.
