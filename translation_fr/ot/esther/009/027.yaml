base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: fr
  text: Les Juifs instituèrent et acceptèrent pour eux-mêmes, pour leur descendance et pour tous ceux qui se joignaient à eux[a] l’obligation d’observer ces deux jours selon ce qui était écrit pour eux et au moment qui leur était fixé, année après année, sans jamais y manquer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui s’attachaient à eux ». L’hébreu désigne ceux qui se joignent aux Juifs ou s’associent à eux.
    reason: lexical_alternative
  - marker: b
    text: Ou « sans que cela passe » ou « sans que cela soit négligé ». La clause signifie que cette observance ne devait pas cesser ni être omise.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ וְקִבֵּל
  choice: établirent et acceptèrent
  rationale: Le premier verbe exprime l’établissement ferme d’une pratique; le second, son acceptation comme engagement. La coordination conserve la formulation à deux verbes du texte hébreu.
- source_word: עֲלֵיהֶם
  choice: pour eux-mêmes
  rationale: Cette tournure française exprime naturellement la prise en charge personnelle d’une obligation, sans reproduire servilement l’hébreu «sur eux».
- source_word: זַרְעָם
  choice: leurs descendants
  rationale: Dans ce contexte générationnel, «descendants» rend clairement le sens collectif de זֶרַע sans le littéralisme de «semence».
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: tous ceux qui se joindraient à eux
  rationale: Le participe de לוה désigne les personnes qui s’attachent ou se joignent aux Juifs. Le conditionnel marque naturellement en français l’extension durable de l’engagement aux personnes qui les rejoindraient.
- source_word: וְלֹא יַעֲבוֹר
  choice: sans jamais y manquer
  rationale: Dans ce contexte, l’expression idiomatique indique que l’observance ne doit ni cesser ni être omise. Cette formulation française conserve l’idée de non-interruption.
- source_word: לִהְיוֹת עֹשִׂים
  choice: de célébrer
  rationale: Littéralement «être en train de faire», l’expression désigne ici l’observance régulière de jours de fête. «Célébrer» est naturel dans ce contexte, tout en restant centré sur la pratique prescrite.
- source_word: כִּכְתָבָם
  choice: conformément à ce qui avait été écrit à leur sujet
  rationale: La formulation maintient la référence à une prescription écrite sans identifier plus précisément que l’hébreu le document ou la portée exacte du suffixe.
- source_word: וְכִזְמַנָּם
  choice: au temps fixé pour eux
  rationale: זְמָן désigne un temps déterminé ou fixé. Le singulier collectif convient à la période assignée aux deux jours et conserve le suffixe hébreu.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: année après année
  rationale: Cette expression restitue la répétition annuelle soulignée par le redoublement hébreu.
theological_decisions: []
