  register: Français international moderne, digne et accessible. La phrase conserve le caractère juridique et collectif de l’engagement, tout en réorganisant légèrement la syntaxe pour qu’elle soit naturelle en français. Les tirets délimitent l’idée de non-interruption sans la dissocier de l’obligation principale.
