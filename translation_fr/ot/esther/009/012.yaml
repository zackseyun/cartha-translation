revisions:
- from: 'Alors le roi dit à la reine Esther : « Dans la citadelle de Suse, les Juifs ont tué et fait périr cinq cents hommes, ainsi que les dix fils d’Haman. Qu’auront-ils fait dans le reste des provinces du roi[a] ? Quelle est maintenant ta requête ? Elle te sera accordée. Quelle autre demande veux-tu présenter ? Elle sera exaucée. »'
  to: 'Alors le roi dit à la reine Esther : « Dans la citadelle de Suse, les Juifs ont tué et fait périr cinq cents hommes, ainsi que les dix fils d’Haman. Qu’ont-ils donc fait dans le reste des provinces du roi[a] ? Quelle est maintenant ta requête ? Elle te sera accordée. Quelle est encore ta demande ? Elle sera faite. »'
  rationale: La révision maintient le sens et la dignité du texte tout en supprimant l’ajout « veux-tu présenter ». Elle rend la question inférentielle de façon moins marquée et préserve le parallélisme entre les deux demandes et les deux promesses royales.
