base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: fr
  text: 'Alors le roi dit à la reine Esther : « Dans la citadelle de Suse, les Juifs ont tué et fait périr cinq cents hommes, ainsi que les dix fils d’Haman. Qu’ont-ils donc fait dans le reste des provinces du roi[a] ? Quelle est maintenant ta requête ? Elle te sera accordée. Quelle est encore ta demande ? Elle sera faite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « Qu’ont-ils fait dans le reste des provinces du roi ? » Le mot « donc » exprime l’inférence que le roi paraît tirer du bilan reçu à Suse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: Dans la citadelle de Suse
  rationale: בִּירָה désigne ici le complexe royal fortifié. « Citadelle » convient au cadre perse et la tournure française est naturelle.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: ont tué et fait périr
  rationale: Les deux verbes sont conservés afin de rendre la force cumulative de l’hébreu. « Faire périr » exprime אבד sans imposer la nuance plus absolue d’« exterminer ».
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: cinq cents hommes
  rationale: אִישׁ, employé distributivement après le nombre, désigne directement des hommes dans ce contexte de violence armée.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: ainsi que les dix fils d’Haman
  rationale: « Ainsi que » marque clairement l’ajout du second complément d’objet tout en restant fluide.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: dans le reste des provinces du roi
  rationale: « Provinces » correspond au cadre administratif perse, et « le reste » rend שְׁאָר de manière directe.
- source_word: מֶה עָשׂוּ
  choice: Qu’auront-ils fait
  rationale: Le futur antérieur français exprime naturellement l’inférence du roi à partir des événements de Suse, tout en laissant subsister la forme interrogative.
- source_word: שְּׁאֵלָתֵךְ
  choice: ta requête
  rationale: Dans Esther, le terme désigne une requête formelle adressée au roi. « Requête » maintient le registre de cour.
- source_word: וְיִנָּתֵן לָךְ
  choice: Elle te sera accordée
  rationale: Le passif de נתן signifie idiomatiquement qu’une requête sera accordée.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: Quelle autre demande veux-tu présenter ?
  rationale: « Autre demande » rend l’idée d’une demande supplémentaire portée par עוֹד; « veux-tu présenter » explicite légèrement l’expression française sans modifier l’offre royale.
- source_word: וְתֵעָשׂ
  choice: Elle sera exaucée
  rationale: Dans le contexte d’une demande royale, « exaucée » rend naturellement l’idée qu’elle sera mise à exécution, tout en variant par rapport à « accordée ».
