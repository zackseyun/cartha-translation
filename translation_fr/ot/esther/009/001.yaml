  to: 'Au douzième mois, c’est-à-dire au mois d’Adar, le treizième jour de ce mois, le moment était venu d’exécuter la parole du roi et son décret. Ce jour-là, les ennemis des Juifs avaient espéré dominer les Juifs, mais la situation s’inversa[a] : ce furent les Juifs eux-mêmes qui dominèrent ceux qui les haïssaient.'
