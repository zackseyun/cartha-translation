  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: fr
  text: 'Au douzième mois, c’est-à-dire au mois d’Adar, le treizième jour de ce mois, le moment était venu d’exécuter la parole du roi et son décret. Ce jour-là, les ennemis des Juifs avaient espéré dominer les Juifs, mais la situation s’inversa[a] : ce furent les Juifs eux-mêmes qui dominèrent ceux qui les haïssaient.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout fut renversé » ou « ce fut l’inverse ».'
    reason: La formule hébraïque וְנַהֲפוֹךְ הוּא exprime un retournement de situation et peut recevoir plusieurs formulations françaises proches.
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: Au douzième mois
  rationale: Rend naturellement l’indication temporelle; le ו initial assure la continuité narrative sans exiger un connecteur français explicite.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: c’est-à-dire au mois d’Adar
  rationale: Restitue l’apposition explicative qui identifie le douzième mois.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: le treizième jour du mois
  rationale: Explicite en français naturel le référent du suffixe בּוֹ, à savoir le mois.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: le moment était venu d’exécuter la parole du roi et son décret
  rationale: Préserve l’idée littérale d’arrivée du moment fixé et distingue דְּבַר, « parole », de דָת, « décret ».
- source_word: שִׂבְּרוּ
  choice: avaient espéré
  rationale: Le verbe exprime ici une attente confiante ou un espoir, démenti par le retournement qui suit.
- source_word: לִשְׁלֹט בָּהֶם
  choice: prendre le dessus sur eux
  rationale: Exprime idiomatiquement l’exercice de la maîtrise dans ce contexte conflictuel, sans suggérer nécessairement un gouvernement durable.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: mais la situation s’inversa
  rationale: Rend clairement la formule de renversement tout en conservant son effet narratif abrupt.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: ce furent les Juifs eux-mêmes qui prirent le dessus
  rationale: La tournure clivée et « eux-mêmes » reproduisent l’insistance de הֵמָּה et le contraste avec l’attente des ennemis.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: sur ceux qui les haïssaient
  rationale: Conserve la valeur verbale du participe hébreu plutôt que de l’aplatir en simple synonyme d’« ennemis ».
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue phrase hébraïque est divisée en deux phrases pour assurer la lisibilité, tout en maintenant la répétition du jour décisif, le contraste entre « ennemis » et « ceux qui les haïssaient », ainsi que l’emphase portée sur les Juifs eux-mêmes.
