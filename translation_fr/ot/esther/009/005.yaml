  text: וַ/יַּכּ֤וּ הַ/יְּהוּדִים֙ בְּ/כָל אֹ֣יְבֵי/הֶ֔ם מַכַּת חֶ֥רֶב וְ/הֶ֖רֶג וְ/אַבְדָ֑ן וַ/יַּֽעֲשׂ֥וּ בְ/שֹׂנְאֵי/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: fr
  text: Les Juifs frappèrent tous leurs ennemis à coups d’épée, dans le massacre et la destruction; ils traitèrent ceux qui les haïssaient comme ils l’entendaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « selon leur volonté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: frappèrent
  rationale: Le verbe נכה signifie largement « frapper »; ce choix conserve l’action verbale sans la réduire d’emblée à « tuer », puisque la suite en précise la violence meurtrière.
- source_word: הַיְּהוּדִים
  choice: les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif dans le contexte de la diaspora perse; « les Juifs » est la désignation française naturelle et précise.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: tous leurs ennemis
  rationale: Cette formulation rend naturellement la portée totale de כָל et le sens de אֹיֵב.
- source_word: מַכַּת חֶרֶב
  choice: à coups d’épée
  rationale: Cette expression française conserve l’image concrète du « coup de l’épée » tout en restant naturelle.
- source_word: וְהֶרֶג
  choice: les massacrant
  rationale: Le nom הֶרֶג évoque une tuerie ou un massacre. La forme participiale permet de restituer naturellement en français l’accumulation hébraïque.
- source_word: וְאַבְדָן
  choice: les vouant à la destruction
  rationale: אַבְדָן désigne la destruction ou la perte. Cette formulation garde la force du terme sans imposer l’idée plus absolue d’une annihilation totale.
- source_word: וַיַּעֲשׂוּ בְשֹׂנְאֵיהֶם
  choice: ils traitèrent ceux qui les haïssaient
  rationale: « Traiter » exprime idiomatiquement l’action exercée envers quelqu’un, tandis que « ceux qui les haïssaient » préserve la distinction lexicale avec « ennemis » au début du verset.
- source_word: כִּרְצוֹנָם
  choice: comme bon leur semblait
  rationale: Cette locution française actuelle et digne rend idiomatiquement « selon leur volonté/désir » et exprime leur liberté d’action.
theological_decisions:
- issue: Rendre une description de violence guerrière sans l’atténuer ni l’amplifier
  choice: Conserver explicitement les coups d’épée, le massacre et la destruction
  alternative: Employer un terme général comme « vainquirent », ou accentuer le texte par « exterminèrent tous »
  rationale: L’hébreu accumule trois expressions violentes. La traduction en maintient la dureté, sans aller au-delà des données lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. La structure a été légèrement idiomatisée pour que l’accumulation nominale hébraïque reste forte sans devenir artificielle en français; le point-virgule clarifie les deux propositions coordonnées.
