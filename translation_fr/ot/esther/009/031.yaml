  text: לְ/קַיֵּ֡ם אֵת יְמֵי֩ הַ/פֻּרִ֨ים הָ/אֵ֜לֶּה בִּ/זְמַנֵּי/הֶ֗ם כַּ/אֲשֶׁר֩ קִיַּ֨ם עֲלֵי/הֶ֜ם מָרְדֳּכַ֤י הַ/יְּהוּדִי֙ וְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וְ/כַ/אֲשֶׁ֛ר קִיְּמ֥וּ עַל נַפְשָׁ֖/ם וְ/עַל זַרְעָ֑/ם דִּבְרֵ֥י הַ/צֹּמ֖וֹת וְ/זַעֲקָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: fr
  text: afin d’établir ces jours de Pourim aux dates fixées[a], comme Mardochée le Juif et la reine Esther les avaient établis pour eux, et comme ils s’étaient eux-mêmes imposé, ainsi qu’à leurs descendants, les dispositions relatives aux jeûnes et à leur cri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confirmer ». Le verbe hébreu répété dans ce verset peut évoquer aussi bien l’établissement que la confirmation officielle de cette observance.
    reason: lexical_alternative
  - marker: b
    text: Ou « leur supplication » ou « leur plainte ». Le mot hébreu désigne un cri pressant, ici probablement le cri collectif associé aux jeûnes.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: afin de confirmer
  rationale: Le piel de קום exprime ici l’idée de rendre ferme ou de ratifier officiellement. « Confirmer » convient au contexte où l’observance est fixée par écrit, sans réduire le sens au simple fait de célébrer.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: ces jours des Pourim
  rationale: Cette formulation conserve le démonstratif et le pluriel du nom de la fête, conformément à l’usage traditionnel français.
- source_word: בִּזְמַנֵּיהֶם
  choice: aux dates qui leur sont fixées
  rationale: זְמָן désigne ici un moment déterminé. « Dates » est naturel en français pour une célébration annuelle, tandis que « qui leur sont fixées » rend la valeur programmée du terme.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: comme ... l’avaient prescrit à leur intention
  rationale: La construction avec עַל présente une décision rendue contraignante pour la communauté. « Prescrit à leur intention » en transmet la portée normative sans accentuer indûment l’idée de coercition.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mardochée le Juif
  rationale: « Mardochée » est la forme française biblique courante, et « le Juif » rend ici naturellement la désignation ethnique.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: la reine Esther
  rationale: L’apposition hébraïque est rendue dans l’ordre idiomatique du français, sans perte de sens.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: et comme ils s’y étaient eux-mêmes engagés, pour eux et pour leurs descendants
  rationale: Avec נֶפֶשׁ et עַל, קים exprime ici un engagement assumé. Le pronom « s’y » reprend l’ensemble des dispositions mentionnées ensuite, tandis que « descendants » exprime clairement le sens collectif de זֶרַע.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: en ce qui concerne les jeûnes et leur cri
  rationale: דִּבְרֵי peut introduire les affaires ou dispositions relatives à quelque chose. זַעֲקָה désigne un cri intense, probablement collectif et lié aux jeûnes; « cri » en maintient l’indétermination plutôt que de préciser « prière » ou « lamentation ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure administrative du texte hébreu tout en variant les rendus du verbe קים selon ses constructions. L’expression « leur cri » préserve volontairement l’ambiguïté entre plainte, supplication et lamentation.
