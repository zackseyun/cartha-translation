revisions:
- from: afin de confirmer ces jours des Pourim aux dates qui leur sont fixées[a], comme Mardochée le Juif et la reine Esther l’avaient prescrit à leur intention, et comme ils s’y étaient eux-mêmes engagés, pour eux et pour leurs descendants, en ce qui concerne les jeûnes et leur cri[b].
  to: afin d’établir ces jours de Pourim aux dates fixées[a], comme Mardochée le Juif et la reine Esther les avaient établis pour eux, et comme ils s’étaient eux-mêmes imposé, ainsi qu’à leurs descendants, les dispositions relatives aux jeûnes et à leur cri[b].
  rationale: La révision conserve le sens formel et administratif de קים, mais corrige la portée de la construction avec עַל et rend plus explicitement l’obligation assumée par la communauté et sa descendance. Elle emploie aussi les tournures françaises plus naturelles « jours de Pourim » et « aux dates fixées ».
