source:
  edition: WLC
  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: fr
  text: C’est pourquoi ils appelèrent ces jours Pourim[a], d’après le nom de Pour. C’est pourquoi, à cause de tout ce qui était écrit dans cette lettre, de ce qu’ils avaient vu à ce sujet et de ce qui leur était arrivé[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « d’après Pour » ; littéralement : « d’après le nom de Pour ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de ce qui était venu sur eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ
  choice: ils appelèrent
  rationale: Le qal accompli à la 3e personne du pluriel exprime ici l’attribution d’un nom. « Ils appelèrent » conserve le sujet pluriel indéterminé et reste proche de l’hébreu.
- source_word: לַיָּמִים הָאֵלֶּה
  choice: ces jours
  rationale: Le démonstratif désigne les jours de fête précis dont parle le contexte.
- source_word: פוּרִים
  choice: Pourim
  rationale: Transcription française usuelle du nom propre de la fête, dérivé de פּוּר.
- source_word: עַל שֵׁם הַפּוּר
  choice: d’après le nom de Pour
  rationale: Cette formulation conserve explicitement l’idée de « nom » et le lien étymologique établi par l’hébreu.
- source_word: הַפּוּר
  choice: Pour
  rationale: La transcription maintient le jeu étymologique avec « Pourim » ; le sens de « sort » est donné par le contexte antérieur.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: La même expression ouvre les deux propositions. Sa répétition est maintenue afin de préserver la structure causale du texte.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: à cause de tout ce qui était écrit dans cette lettre
  rationale: Cette tournure française naturelle rend le sens de « toutes les paroles de cette lettre » sans reproduire une expression maladroite.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: de ce qu’ils avaient vu à ce sujet
  rationale: « Vu » conserve le verbe hébreu, tandis que « à ce sujet » rend idiomatiquement עַל כָּכָה.
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: de ce qui leur était arrivé
  rationale: Dans ce contexte rétrospectif, הִגִּיעַ אֲלֵיהֶם peut désigner ce qui leur est advenu. La formulation reste naturelle tout en signalant en note la lecture plus littérale.
