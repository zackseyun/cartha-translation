  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: fr
  text: Une copie de l’édit devait être publiée dans chaque province comme loi[a] et rendue publique à tous les peuples[b], afin que les Juifs soient prêts pour ce jour[c] à se venger de leurs ennemis[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu répète littéralement « province et province », tournure distributive qui signifie « dans chacune des provinces ».
    reason: lexical_alternative
  - marker: b
    text: Ou « publiée » ou « affichée ouvertement ».
    reason: lexical_alternative
  - marker: c
    text: 'L’expression renvoie à la date fixée par l’édit. On pourrait aussi traduire : « pour ce jour-là ».'
    reason: lexical_alternative
  - marker: d
    text: Le verbe signifie « se venger » ou « exercer sa vengeance ». Traduire par « se défendre » serait plus interprétatif.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן
  choice: une copie
  rationale: Cet emprunt au perse désigne la copie ou la transcription d’un document officiel.
- source_word: הַכְּתָב
  choice: du document
  rationale: Littéralement « de l’écrit » ; dans ce cadre administratif royal, « document » est naturel et suffisamment précis.
- source_word: לְהִנָּתֵן דָּת
  choice: devait être promulguée comme loi
  rationale: L’expression décrit l’acte officiel par lequel le texte reçoit valeur légale dans chaque province.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: dans chaque province
  rationale: La répétition hébraïque exprime une distribution exhaustive ; le français courant rend naturellement cet idiome par « chaque province ».
- source_word: גָּלוּי
  choice: rendue publique
  rationale: Le terme signifie que la copie est ouverte, manifeste ou publiée ; « rendue publique » convient au contexte d’un édit.
- source_word: לְכָל הָעַמִּים
  choice: à tous les peuples
  rationale: Le pluriel renvoie aux divers groupes ethniques de l’Empire perse ; « peuples » préserve cette nuance.
- source_word: וְלִהְיוֹת
  choice: afin que … soient
  rationale: Cette tournure restitue clairement en français la valeur de but de l’infinitif hébreu.
- source_word: הַיְּהוּדִים
  choice: les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif de la diaspora perse, et non seulement les habitants de la Judée.
- source_word: עֲתוּדִים
  choice: prêts
  rationale: L’adjectif signifie « prêts » ou « préparés » ; « prêts » est direct et idiomatique.
- source_word: לַיּוֹם הַזֶּה
  choice: pour ce jour
  rationale: Cette traduction conserve le démonstratif et la préposition du texte hébreu, en renvoyant à la date fixée par l’édit.
- source_word: לְהִנָּקֵם
  choice: à se venger
  rationale: Le nifal de נקם signifie se venger ou tirer vengeance ; cette formulation conserve la force du verbe sans la réduire à la seule défense.
- source_word: מֵאֹיְבֵיהֶם
  choice: de leurs ennemis
  rationale: En français, « se venger de » est la construction idiomatique correspondant à l’expression hébraïque.
theological_decisions:
- issue: Risque d’atténuer le langage de vengeance
  choice: à se venger de leurs ennemis
  alternative: à se défendre contre leurs ennemis
  rationale: Même si le contexte plus large comprend l’idée de protection, le verbe נקם exprime ici la vengeance. La traduction ne doit pas en atténuer la portée.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe administrative reste perceptible sans reproduire de façon artificielle la répétition distributive hébraïque. Le vocabulaire de vengeance est maintenu explicitement.
