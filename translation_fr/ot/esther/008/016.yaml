  text: לַ/יְּהוּדִ֕ים הָֽיְתָ֥ה אוֹרָ֖ה וְ/שִׂמְחָ֑ה וְ/שָׂשֹׂ֖ן וִ/יקָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: fr
  text: Pour les Juifs, il y eut lumière, joie, allégresse et honneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Juifs eurent lumière, joie, allégresse et honneur. » La construction hébraïque peut se rendre soit de manière existentielle (« il y eut pour les Juifs »), soit de manière possessive (« ils eurent »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Pour les Juifs
  rationale: Le préfixe ל peut ici marquer le bénéficiaire ou la possession. « Pour les Juifs » conserve naturellement la construction hébraïque sans imposer la reformulation possessive.
- source_word: הָיְתָה
  choice: ce fut
  rationale: Avec le groupe initial « Pour les Juifs », « ce fut » rend de façon concise et digne la valeur existentielle de היה, tout en restant idiomatique en français.
- source_word: אוֹרָה
  choice: lumière
  rationale: Le terme désigne la lumière, employée ici comme image du salut et du bien-être. « Lumière » préserve cette image sans l'expliciter.
- source_word: שִׂמְחָה
  choice: joie
  rationale: « Joie » est l'équivalent français courant et naturel de ce nom. La proximité sémantique avec שָׂשׂוֹן est conservée par une accumulation de termes distincts.
- source_word: שָׂשׂוֹן
  choice: allégresse
  rationale: Le mot exprime une joie vive et jubilante. « Allégresse » le distingue de שִׂמְחָה tout en reproduisant l'intensification poétique de l'hébreu.
- source_word: יְקָר
  choice: honneur
  rationale: Dans ce contexte, le nom évoque la dignité et l'estime accordées aux Juifs après le renversement de leur situation. « Honneur » rend clairement cette dimension sociale.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La série nominale conserve le rythme cumulatif de l’hébreu ainsi que la distinction entre deux termes proches désignant la joie.
