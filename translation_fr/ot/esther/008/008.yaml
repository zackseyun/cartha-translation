  text: וְ֠/אַתֶּם כִּתְב֨וּ עַל הַ/יְּהוּדִ֜ים כַּ/טּ֤וֹב בְּ/עֵֽינֵי/כֶם֙ בְּ/שֵׁ֣ם הַ/מֶּ֔לֶךְ וְ/חִתְמ֖וּ בְּ/טַבַּ֣עַת הַ/מֶּ֑לֶךְ כִּֽי כְתָ֞ב אֲשֶׁר נִכְתָּ֣ב בְּ/שֵׁם הַ/מֶּ֗לֶךְ וְ/נַחְתּ֛וֹם בְּ/טַבַּ֥עַת הַ/מֶּ֖לֶךְ אֵ֥ין לְ/הָשִֽׁיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: fr
  text: Mais vous, rédigez au sujet des Juifs ce qui vous semblera bon[a], au nom du roi, et scellez-le avec l’anneau-sceau du roi. Car un écrit rédigé au nom du roi et scellé avec l’anneau-sceau du roi ne peut être révoqué[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui est bon à vos yeux »; autrement dit : « ce que vous jugerez bon » ou « comme bon vous semblera ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne peut être annulé » ou « ne peut être rapporté ». L’expression hébraïque signifie littéralement qu’il est impossible de le faire revenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Mais vous
  rationale: La conjonction et le pronom explicite marquent ici un contraste avec l’impossibilité d’annuler l’édit précédent; « Mais vous » le rend naturellement.
- source_word: כִּתְבוּ
  choice: écrivez
  rationale: L’impératif pluriel exprime directement l’autorisation royale sous forme d’ordre, sans ajouter un verbe modal absent de l’hébreu.
- source_word: עַל הַיְּהוּדִים
  choice: au sujet des Juifs
  rationale: Cette formulation conserve le sens général de la préposition, qui présente les Juifs comme l’objet du document, sans préciser davantage que l’hébreu.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: ce qui vous paraîtra bon
  rationale: Cette expression française actuelle transmet l’idée de ce qui convient selon leur jugement; l’image hébraïque des yeux est signalée en note.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: au nom du roi
  rationale: Formule française usuelle qui conserve la notion du nom et implique l’autorité royale.
- source_word: וְחִתְמוּ בְּטַבַּעַת הַמֶּלֶךְ
  choice: et scellez le document avec l’anneau royal
  rationale: « Anneau royal » désigne clairement l’anneau servant à apposer le sceau; « le document » explicite l’objet sous-entendu du verbe.
- source_word: כְתָב
  choice: un écrit
  rationale: Le terme reste aussi général que le nom hébreu, sans le restreindre à « décret » ou « édit ».
- source_word: אֵין לְהָשִׁיב
  choice: ne peut être révoqué
  rationale: Dans ce contexte juridique et administratif, « révoqué » exprime précisément l’impossibilité de rappeler ou d’annuler l’acte royal.
