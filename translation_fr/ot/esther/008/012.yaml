  text: בְּ/י֣וֹם אֶחָ֔ד בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: fr
  text: en un seul jour, dans toutes les provinces du roi Assuérus, le treizième jour du douzième mois, c’est-à-dire le mois d’Adar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: La préposition בְּ est temporelle. « En un seul jour » restitue le numéral אֶחָד et souligne naturellement que l’action devait avoir lieu le même jour, sans ajouter d’idée étrangère au texte.
- source_word: בְּכָל מְדִינוֹת
  choice: dans toutes les provinces
  rationale: מְדִינוֹת désigne les circonscriptions administratives de l’empire ; cette formulation française est directe et naturelle.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: du roi Assuérus
  rationale: Le groupe construit indique l’appartenance des provinces. « Assuérus » est la forme française traditionnelle et largement reconnue du nom.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: le treizième jour
  rationale: Le cardinal hébreu sert ici à exprimer une date ; l’ajout explicite de « jour » donne en français une formule claire et idiomatique.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: du douzième mois
  rationale: La construction précise le mois auquel appartient ce jour. L’ordinal convient à la manière française d’énumérer les mois.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: c’est-à-dire le mois d’Adar
  rationale: 'הוּא a ici une valeur explicative et appositionnelle : le nom « Adar » identifie le douzième mois.'
