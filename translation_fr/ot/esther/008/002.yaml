  text: וַ/יָּ֨סַר הַ/מֶּ֜לֶךְ אֶת טַבַּעְתּ֗/וֹ אֲשֶׁ֤ר הֶֽעֱבִיר֙ מֵֽ/הָמָ֔ן וַֽ/יִּתְּנָ֖/הּ לְ/מָרְדֳּכָ֑י וַ/תָּ֧שֶׂם אֶסְתֵּ֛ר אֶֽת מָרְדֳּכַ֖י עַל בֵּ֥ית הָמָֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: fr
  text: Alors le roi retira son anneau royal[a], qu’il avait repris à Haman, et le donna à Mardochée. Esther établit Mardochée à la tête des biens de Haman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « son anneau »; il s’agit de l’anneau qui servait à sceller les décrets au nom du roi.
    reason: clarification_contextuelle
  - marker: b
    text: Littéralement « de la maison de Haman ». L’expression peut désigner sa maison, sa maisonnée ou son domaine.
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיָּסַר
  choice: retira
  rationale: Le hiphil de סור exprime ici le fait d’enlever ou de retirer l’anneau; « retira » est naturel en français et convient au geste du roi.
- source_word: טַבַּעְתּוֹ
  choice: son anneau royal
  rationale: טבעת désigne un anneau, mais le contexte de la cour perse montre qu’il sert à sceller et à conférer l’autorité du roi. « Anneau royal » exprime cette fonction sans imposer une description matérielle trop précise.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: qu’il avait repris à Haman
  rationale: Le hiphil de עבר peut signifier enlever, retirer ou transférer. « Repris à Haman » rend clairement la confiscation antérieure et prépare la remise de l’anneau à Mardochée.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: et le donna à Mardochée
  rationale: נתן signifie couramment « donner »; le pronom féminin hébreu renvoie à l’anneau, masculin en français.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: Esther établit Mardochée à la tête de
  rationale: שׂום avec על indique ici qu’une personne reçoit la responsabilité ou l’administration de quelque chose. Cette formulation est idiomatique et conserve le sens administratif.
- source_word: בֵּית הָמָן
  choice: des biens de Haman
  rationale: בית peut désigner la maison, la maisonnée ou le patrimoine. Dans le contexte immédiat du transfert à Esther de ce qui appartenait à Haman, « biens » exprime naturellement le domaine placé sous l’administration de Mardochée, tandis qu’une note préserve les autres nuances.
