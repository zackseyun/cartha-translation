  to: que le roi a accordé aux Juifs de chaque ville de se rassembler et de tenir ferme pour défendre leur vie, d’exterminer, de tuer et de faire périr toute force armée de tout peuple ou de toute province qui les attaquerait[a], y compris les enfants et les femmes[b], et de s’emparer de leurs biens comme butin.
