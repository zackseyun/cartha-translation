source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: fr
  text: que le roi a accordé aux Juifs de chaque ville de se rassembler et de tenir ferme pour défendre leur vie, d’exterminer, de tuer et de faire périr toute force armée de tout peuple ou de toute province qui les attaquerait[a], y compris les enfants et les femmes[b], et de s’emparer de leurs biens comme butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui leur serait hostile ». Le participe hébreu peut désigner ceux qui se comportent en ennemis envers eux ; « qui les attaquerait » explicite cette hostilité dans le contexte du décret.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « enfants et femmes ». Le texte du décret les inclut explicitement dans le groupe ennemi décrit.'
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: Le roi autorisait
  rationale: Dans le contexte du décret, נָתַן exprime l’octroi officiel d’un droit. « Autorisait » rend naturellement cette valeur administrative en français.
- source_word: בְּכָל עִיר וָעִיר
  choice: de chaque ville
  rationale: La répétition distributive hébraïque souligne que l’autorisation vaut dans toutes les villes; « chaque ville » en restitue naturellement la portée.
- source_word: לְהִקָּהֵל
  choice: à se rassembler
  rationale: Le nifal exprime le fait de se réunir collectivement; « se rassembler » est précis et courant.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: et à tenir ferme pour défendre leur vie
  rationale: Cette formulation conserve l’image concrète de « tenir ferme » tout en explicitant en français la finalité vitale de l’expression hébraïque.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: à exterminer, à tuer et à faire périr
  rationale: Les trois verbes cumulatifs sont tous conservés, sans atténuer la violence juridique du décret ni les fondre en un seul terme.
- source_word: כָּל חֵיל
  choice: toute force armée
  rationale: Dans ce contexte, חֵיל désigne une force combattante plutôt que la richesse ou la puissance au sens abstrait.
- source_word: עַם וּמְדִינָה
  choice: de tout peuple ou de toute province
  rationale: La formulation française exprime la portée indéfinie et générale du couple ethnique et administratif.
- source_word: הַצָּרִים אֹתָם
  choice: qui les attaquerait
  rationale: Le participe désigne ceux qui agissent en adversaires. Dans le cadre défensif du décret, « attaquerait » rend concrètement cette hostilité tout en laissant la référence prospective.
- source_word: טַף וְנָשִׁים
  choice: y compris les enfants et les femmes
  rationale: טַף désigne les enfants ou personnes à charge. « Y compris » rattache explicitement ce groupe à la force ennemie visée, selon la lecture syntaxique retenue, sans supprimer la difficulté morale du texte.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: et à s’emparer de leurs biens comme butin
  rationale: Cette expression rend à la fois l’action de piller et le statut des biens saisis, sans la tautologie peu naturelle de « piller leur butin ».
theological_decisions:
- issue: La violence dans le décret royal
  choice: Rendre directement les trois verbes de destruction tout en maintenant le cadre défensif.
  alternative: Atténuer le texte par « vaincre » ou résumer par « se défendre contre leurs assaillants ».
  rationale: L’hébreu formule explicitement une autorisation de tuer, de détruire et de piller. La traduction ne doit ni adoucir cette violence ni perdre l’indication contextuelle selon laquelle elle répond à une attaque.
- issue: La portée de « enfants et femmes »
  choice: Les présenter comme inclus dans le groupe ennemi visé, sans masquer la tension éthique.
  alternative: Omettre la formule, la rendre vague ou l’interpréter comme visant un groupe distinct.
  rationale: La syntaxe rattache le plus naturellement ces mots à la force ennemie mentionnée. La traduction les conserve donc explicitement, sans chercher à résoudre la difficulté morale du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la cadence juridique du décret, le triple vocabulaire de destruction et la tension éthique du texte, tout en évitant les archaïsmes.
