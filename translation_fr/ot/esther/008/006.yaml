  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: fr
  text: Car comment pourrais-je supporter de voir le malheur qui frappera mon peuple ? Et comment pourrais-je supporter de voir la destruction de ma parenté[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux de ma naissance » ou « mon peuple d’origine ». Le terme hébreu peut désigner les personnes auxquelles on est lié par la naissance ou la parenté; selon le contexte, il peut aussi renvoyer au lieu d’origine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui motive la supplication d’Esther dans le contexte précédent.
- source_word: אֵיכָכָה אוּכַל
  choice: comment pourrais-je supporter
  rationale: La tournure interrogative exprime ici l’impossibilité affective de rester témoin de la catastrophe, plutôt qu’une simple incapacité physique.
- source_word: וְרָאִיתִי
  choice: de voir
  rationale: Après « supporter », l’infinitif donne en français une formulation naturelle tout en conservant l’idée d’assister personnellement aux événements.
- source_word: בָּרָעָה
  choice: le malheur
  rationale: Dans ce contexte, רָעָה désigne la calamité qui menace le peuple et non le mal au sens moral.
- source_word: אֲשֶׁר יִמְצָא
  choice: qui frappera
  rationale: Littéralement, le malheur « trouvera » le peuple ; « frappera » restitue naturellement l’idiome hébreu désignant ce qui survient à quelqu’un.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rend directement l’identification d’Esther à son peuple.
- source_word: בְּאָבְדַן
  choice: la destruction
  rationale: Le nom dérivé de אבד évoque la perte, la disparition ou la destruction ; ce choix reste large sans renforcer indûment le terme.
- source_word: מוֹלַדְתִּי
  choice: ceux de ma naissance
  rationale: Cette formulation conserve l’association du mot avec la naissance et son sens collectif de parenté ou de peuple d’origine, sans le réduire au lieu natal.
theological_decisions:
- issue: Portée de מוֹלַדְתִּי
  choice: ceux de ma naissance
  alternative: ma parenté ; mon peuple d’origine ; mon lieu natal
  rationale: Le contexte vise vraisemblablement les personnes auxquelles Esther est liée par la naissance, mais le terme peut aussi évoquer l’origine ou le lieu natal. Le texte et la note préservent cette latitude.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « comment pourrais-je supporter de voir » reproduit l’insistance rhétorique de l’hébreu. « Ceux de ma naissance » est volontairement moins idiomatique que « ma parenté », afin de préserver dans le texte la nuance lexicale du terme hébreu, explicitée en note.
