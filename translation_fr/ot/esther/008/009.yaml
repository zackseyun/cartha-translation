translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue énumération administrative est conservée, avec une ponctuation qui en facilite la lecture. « Koush » suit la graphie française usuelle du nom ancien; « Mardochée » et « Sivan » suivent les formes françaises établies.
