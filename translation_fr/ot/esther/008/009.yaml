  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: fr
  text: 'À ce moment-là, les scribes du roi furent convoqués : le vingt-troisième jour du troisième mois, c’est-à-dire le mois de Sivan. On écrivit, conformément à tout ce que Mardochée avait ordonné, aux Juifs, aux satrapes, aux gouverneurs et aux fonctionnaires des provinces, de l’Inde à Koush[a], soit cent vingt-sept provinces, à chaque province selon son écriture, à chaque peuple selon sa langue, et aux Juifs selon leur écriture et leur langue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’Inde jusqu’en Éthiopie ». L’hébreu emploie le nom géographique ancien « Koush ».
    reason: Indique l’équivalent traditionnel tout en évitant d’assimiler sans nuance Koush aux frontières de l’Éthiopie moderne.
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: on convoqua les secrétaires du roi
  rationale: Le niphal exprime ici la convocation des agents royaux. La tournure impersonnelle française est naturelle et conserve le cadre officiel. « Secrétaires » désigne clairement les scribes chargés de rédiger les actes administratifs.
- source_word: בָּעֵת הַהִיא
  choice: À ce moment-là
  rationale: Rend explicitement l’indication temporelle sans la redoubler par un « alors » supplémentaire.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: le vingt-troisième jour du troisième mois, c’est-à-dire le mois de Sivan
  rationale: Formulation française fluide qui conserve la date, l’identification du troisième mois et le nom hébreu Sivan.
- source_word: וַיִּכָּתֵב
  choice: On écrivit
  rationale: Le passif impersonnel hébreu ne nomme pas les rédacteurs. « On écrivit » évite d’introduire artificiellement un objet tel que « décret » ou « lettre ».
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: conformément à tout ce que Mardochée avait ordonné
  rationale: « Tout ce que » préserve la portée globale de כְּכָל, tandis que « conformément à » exprime la fidélité aux instructions sans forcer l’adverbe « exactement ».
- source_word: הָאֲחַשְׁדַּרְפְּנִים וְהַפַּחוֹת וְשָׂרֵי הַמְּדִינוֹת
  choice: les satrapes, les gouverneurs et les hauts fonctionnaires des provinces
  rationale: Ces équivalents distinguent les trois catégories administratives. « Hauts fonctionnaires » rend שָׂרֵי dans son contexte impérial sans suggérer une dignité royale.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: de l’Inde jusqu’à Koush
  rationale: « Inde » est l’identification conventionnelle de הֹדּוּ. La translittération « Koush » préserve le nom géographique ancien sans l’assimiler sans réserve à l’Éthiopie moderne.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: à chaque province selon son écriture, à chaque peuple selon sa langue
  rationale: La répétition distributive hébraïque est rendue par « chaque ». « Écriture » désigne ici le système graphique employé, distinct de la langue.
- source_word: וְאֶל הַיְּהוּדִים כִּכְתָבָם וְכִלְשׁוֹנָם
  choice: et aux Juifs selon leur écriture et leur langue
  rationale: La coordination est conservée sans ajouter « aussi », qui n’est pas lexicalement explicite, tout en maintenant les Juifs comme destinataires expressément distingués.
