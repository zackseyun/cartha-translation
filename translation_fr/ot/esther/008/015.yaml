revisions:
- from: Mardochée sortit de la présence du roi, vêtu d’un habit royal bleu pourpre[a] et blanc, portant une grande couronne d’or et un manteau de fin lin et de pourpre[b]. La ville de Suse poussa des cris de joie et se réjouit.
  to: Mardochée sortit de la présence du roi, vêtu d’un habit royal bleu[a] et blanc, portant une grande couronne d’or et un manteau de lin fin et de pourpre[b]. La ville de Suse poussa des cris et se réjouit.
  rationale: La révision remplace une expression de couleur peu idiomatique par « bleu », tout en conservant en note la nuance possible de la teinture hébraïque. Elle normalise aussi « lin fin ». Les deux verbes finaux restent distincts, conformément à l’hébreu, sans ajouter explicitement la notion de joie au premier cri.
