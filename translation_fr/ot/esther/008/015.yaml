  text: וּ/מָרְדֳּכַ֞י יָצָ֣א מִ/לִּ/פְנֵ֣י הַ/מֶּ֗לֶךְ בִּ/לְב֤וּשׁ מַלְכוּת֙ תְּכֵ֣לֶת וָ/ח֔וּר וַ/עֲטֶ֤רֶת זָהָב֙ גְּדוֹלָ֔ה וְ/תַכְרִ֥יךְ בּ֖וּץ וְ/אַרְגָּמָ֑ן וְ/הָ/עִ֣יר שׁוּשָׁ֔ן צָהֲלָ֖ה וְ/שָׂמֵֽחָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: fr
  text: Mardochée sortit de la présence du roi, vêtu d’un habit royal bleu[a] et blanc, portant une grande couronne d’or et un manteau de lin fin et de pourpre[b]. La ville de Suse poussa des cris et se réjouit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu désigne une teinture prestigieuse qui peut tirer vers le bleu violacé.
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « manteau » peut désigner un vêtement enveloppant ou une pièce d’étoffe drapée.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: sortit de la présence du roi
  rationale: Cette formulation naturelle conserve à la fois le mouvement de sortie et la nuance de l’expression de cour «de devant le roi».
- source_word: לְבוּשׁ מַלְכוּת
  choice: vêtu d’un habit royal
  rationale: Le syntagme désigne une tenue liée à la royauté; «habit royal» est clair, digne et compatible avec les couleurs qui suivent.
- source_word: תְּכֵלֶת
  choice: bleu pourpre
  rationale: Le terme désigne une teinture prestigieuse dont la nuance pouvait aller du bleu au bleu violacé; «bleu pourpre» préserve cette réalité chromatique sans la réduire au bleu moderne.
- source_word: חוּר
  choice: blanc
  rationale: Dans cette association de couleurs, le mot désigne le blanc ou une étoffe blanche; le simple adjectif «blanc» convient naturellement.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: une grande couronne d’or
  rationale: La traduction rend directement le couvre-chef, sa grandeur et sa matière, sans préciser une forme que l’hébreu ne donne pas.
- source_word: תַכְרִיךְ
  choice: un manteau
  rationale: Le nom désigne un vêtement enveloppant; «manteau» exprime mieux cette forme que le terme plus général «robe» en français moderne.
- source_word: בּוּץ
  choice: fin lin
  rationale: Le mot désigne une étoffe de lin luxueuse; «fin lin» en conserve la qualité.
- source_word: אַרְגָּמָן
  choice: pourpre
  rationale: Le terme désigne une teinture ou une étoffe pourpre prestigieuse, associée au rang élevé.
- source_word: הָעִיר שׁוּשָׁן
  choice: la ville de Suse
  rationale: C’est l’expression française moderne et naturelle pour identifier la ville nommée dans le texte.
- source_word: צָהֲלָה
  choice: poussa des cris de joie
  rationale: Le verbe évoque une manifestation sonore et joyeuse; cette formulation distingue cette acclamation publique du verbe de joie qui suit.
- source_word: שָׂמֵחָה
  choice: se réjouit
  rationale: Cette traduction directe conserve la seconde action et le parallélisme verbal du texte hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve l’accumulation solennelle des insignes royaux, tout en évitant des archaïsmes comme «vêtement de byssus». Les deux verbes décrivant la réaction de Suse restent distincts.
