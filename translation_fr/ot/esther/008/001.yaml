base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: fr
  text: Ce jour-là, le roi Assuérus donna à la reine Esther la maison d’Haman, l’ennemi des Juifs. Mardochée vint auprès du roi, car Esther lui avait révélé quel lien l’unissait à elle.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qu’il était pour elle »; Mardochée était son cousin et son tuteur (voir 2.7, 15).'
    reason: La tournure hébraïque reste générale; la note donne le littéral et situe sobrement la relation établie plus tôt dans le récit.
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: tous les biens d’Haman
  rationale: Ici, « maison » désigne vraisemblablement l’ensemble des biens et du domaine d’Haman, désormais confisqués et remis à Esther; cette formulation rend naturellement la portée métonymique en français.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: l’ennemi des Juifs
  rationale: צֹרֵר qualifie Haman comme adversaire ou persécuteur des Juifs; « ennemi » est direct, naturel et conforme au contexte.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: fut admis en présence du roi
  rationale: 'L’expression indique plus qu’un simple déplacement: Mardochée obtient désormais accès à la présence royale, ce que le passif français exprime clairement.'
- source_word: מַה הוּא לָהּ
  choice: quel lien l’unissait à elle
  rationale: L’hébreu dit littéralement « ce qu’il était pour elle » et vise leur relation familiale; cette formulation française préserve une certaine indétermination sans paraître maladroite.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. « Assuérus » et « Mardochée » suivent les formes françaises bibliques usuelles. La répétition du titre royal est conservée, tandis que les expressions idiomatiques hébraïques sont rendues dans un français naturel.
