revisions:
- from: Ce jour-là, le roi Assuérus donna à la reine Esther tous les biens d’Haman, l’ennemi des Juifs. Mardochée fut admis en présence du roi, car Esther lui avait révélé quel lien l’unissait à elle.[a]
  to: Ce jour-là, le roi Assuérus donna à la reine Esther la maison d’Haman, l’ennemi des Juifs. Mardochée vint auprès du roi, car Esther lui avait révélé quel lien l’unissait à elle.[a]
  rationale: La révision conserve la métonymie et l’absence d’exhaustivité de « la maison d’Haman », rend le verbe narratif actif de l’hébreu, et précise la note sans surdéfinir le statut de Mardochée.
