    issue: « tous les biens d’Haman »
    rationale: Le déterminant « tous » n’est pas présent dans l’hébreu et transforme « la maison d’Haman » en une affirmation exhaustive sur ses possessions.
  - severity: low
    issue: 'Note : « père adoptif »'
    rationale: Esther 2 indique que Mardochée a élevé Esther; « tuteur » est une formulation plus exacte et moins institutionnellement spécifique.
