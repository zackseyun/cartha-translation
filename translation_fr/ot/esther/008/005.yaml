  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: fr
  text: 'Elle dit : « Si le roi le juge bon, si j’ai trouvé grâce devant lui, si la chose paraît convenable au roi et si je suis agréable à ses yeux, qu’on écrive pour annuler[a] les lettres issues du projet de Haman[b], fils de Hammedata, l’Agaguite, qu’il avait écrites afin de faire périr les Juifs qui se trouvent dans toutes les provinces du roi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « retirer » ou « renverser » les lettres. Le verbe hébreu signifie littéralement « faire revenir » et peut, dans ce contexte administratif, désigner l’annulation ou la révocation d’un écrit officiel.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les lettres, le projet de Haman ». La formulation française exprime le lien étroit entre les lettres et le projet de Haman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Si le roi le juge bon
  rationale: Cette formulation rend naturellement en français la formule de déférence employée à la cour, sans la réduire au simple plaisir personnel du roi.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: j’ai trouvé grâce devant lui
  rationale: « Trouver grâce devant » conserve l’image hébraïque tout en restant une expression française claire dans le cadre d’une requête royale.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: si la chose paraît convenable au roi
  rationale: כָשֵׁר exprime ici ce qui est approprié ou recevable. « La chose » reste proche de דָּבָר, tandis que « paraît convenable » produit une tournure française naturelle.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: si je suis agréable à ses yeux
  rationale: La traduction conserve l’idiome visuel et distingue cette approbation personnelle de la faveur déjà mentionnée.
- source_word: יִכָּתֵב
  choice: qu’on écrive
  rationale: Le français emploie naturellement le pronom indéfini pour rendre ce passif de requête, sans ajouter explicitement un ordre ou un décret absent de l’hébreu.
- source_word: לְהָשִׁיב
  choice: révoquer
  rationale: Dans ce contexte administratif, « révoquer » exprime l’annulation demandée des lettres officielles. Une note préserve le sens plus littéral de retour ou de renversement.
- source_word: הַסְּפָרִים
  choice: les lettres
  rationale: Dans Esther, le terme désigne les communications royales écrites envoyées dans les provinces ; « lettres » est précis et usuel.
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: conçues par Haman
  rationale: Cette formulation relie naturellement en français les lettres au projet élaboré par Haman. La note donne la construction hébraïque plus littérale et en maintient la nuance.
- source_word: לְאַבֵּד
  choice: faire périr
  rationale: La forme causative exprime le fait de provoquer la disparition ou la mort. « Faire périr » conserve cette valeur et le registre solennel du récit.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: les Juifs qui se trouvent dans toutes les provinces du roi
  rationale: La traduction conserve la proposition relative et l’étendue de la menace à l’ensemble des provinces royales.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les quatre conditions de la requête sont conservées, ainsi que le parallélisme entre la faveur accordée à Esther et le fait qu’elle soit agréable aux yeux du roi. La répétition de « lettres » à la fin clarifie l’antécédent de la proposition relative sans modifier le sens.
