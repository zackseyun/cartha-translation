base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: fr
  text: Les courriers, montés sur les coursiers royaux[a], partirent en toute hâte, pressés par l’ordre du roi. Le décret fut publié à Suse, la citadelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les termes hébreux désignant les montures sont rares, et leur identification précise est incertaine.
    reason: lexical_uncertainty
lexical_decisions:
- source_word: הָרָצִים
  choice: les courriers
  rationale: Dans le contexte de l’administration perse, le terme désigne les porteurs officiels des dépêches royales plutôt que de simples coureurs.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: montés sur les coursiers royaux
  rationale: La construction décrit les montures du service royal. Les deux termes désignant les animaux sont rares, et l’identification précise du second demeure incertaine; « coursiers royaux » rend naturellement leur fonction sans imposer une espèce ou une race précise.
- source_word: יָצְאוּ מְבֹהָלִים וּדְחוּפִים
  choice: partirent en toute hâte, pressés
  rationale: Les deux participes expriment à la fois l’urgence du départ et la pression exercée sur les courriers; cette formulation française conserve cette intensification.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: par l’ordre du roi
  rationale: דבר a ici le sens administratif d’un ordre faisant autorité, et la préposition indique ce qui pousse les courriers à agir.
- source_word: וְהַדָּת נִתְּנָה
  choice: Le décret fut aussi publié
  rationale: Dans Esther, דת désigne couramment un décret impérial; נתן, dans ce contexte administratif, évoque sa promulgation ou sa publication officielle. « aussi » rend la coordination narrative sans surcharger la phrase.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: à Suse, la citadelle
  rationale: Cette formulation conserve l’apposition hébraïque et le sens de la résidence fortifiée royale.
