  text: Then the king held out the golden scepter to Esther[a], and Esther rose and stood before the king.
translation:
  language: fr
  text: Alors le roi tendit à Esther le sceptre d’or, et Esther se leva et se tint devant le roi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: tendit
  rationale: Le verbe désigne le geste d’étendre ou de présenter un objet vers quelqu’un. « Tendit » est naturel en français et convient au geste royal du sceptre.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: le sceptre d’or
  rationale: Cette expression désigne le sceptre royal fait d’or ou caractérisé par l’or. « Le sceptre d’or » est idiomatique et digne en français.
- source_word: וַתָּקָם
  choice: se leva
  rationale: Le verbe signifie se lever. Cette formulation conserve la distinction avec le verbe suivant, qui exprime le fait de se tenir debout.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: se tint devant le roi
  rationale: La tournure rend naturellement l’idée de se tenir en présence du roi tout en préservant le cadre formel de la cour.
- source_word: וַ
  choice: Alors
  rationale: Le waw consécutif fait progresser le récit. « Alors » marque clairement la succession des actions en français moderne.
- source_word: לְאֶסְתֵּר
  choice: à Esther
  rationale: La préposition indique la personne vers laquelle le roi tend le sceptre; « à Esther » est la formulation française naturelle dans cette construction.
