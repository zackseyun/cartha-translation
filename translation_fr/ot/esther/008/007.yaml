base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: fr
  text: 'Alors le roi Assuérus dit à la reine Esther et à Mardochée le Juif : « Voici, j’ai donné à Esther la maison d’Haman, et lui, on l’a pendu au gibet[a] parce qu’il a levé la main contre les Juifs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur le bois » ou « sur l’arbre ». Il s’agit ici de la structure d’exécution utilisée pour Haman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors ... dit
  rationale: Le waw consécutif fait progresser le récit ; « Alors » exprime naturellement cette succession en français.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: le roi Assuérus
  rationale: Cette tournure respecte l’usage français pour le titre royal et la forme française traditionnelle du nom.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: à la reine Esther
  rationale: Ordre naturel en français moderne, tout en conservant explicitement le titre royal.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: et à Mardochée le Juif
  rationale: « Le Juif » rend l’appartenance ethnique indiquée par le texte et convient au contexte du livre d’Esther.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » garde la force présentative et emphatique de l’hébreu dans un registre digne et actuel.
- source_word: בֵית הָמָן
  choice: les biens d’Haman
  rationale: בֵית peut désigner ici non seulement la maison matérielle, mais l’ensemble du domaine ou des possessions d’Haman, remis à Esther selon le contexte immédiat.
- source_word: נָתַתִּי
  choice: j’ai donné
  rationale: Le passé composé exprime une action accomplie dont le résultat demeure pertinent.
- source_word: וְאֹתוֹ תָּלוּ
  choice: et lui, on l’a pendu
  rationale: La construction avec « on » reproduit naturellement en français l’agent indéfini du pluriel hébreu ; le pronom détaché conserve l’emphase sur Haman.
- source_word: עַל הָעֵץ
  choice: au bois
  rationale: Le mot עֵץ signifie littéralement « arbre » ou « bois ». « Au bois » conserve l’image et l’ambiguïté de la structure d’exécution, précisées en note.
- source_word: עַל אֲשֶׁר
  choice: parce que
  rationale: La locution introduit ici la raison de l’exécution.
- source_word: שָׁלַח יָדוֹ
  choice: il avait porté la main contre
  rationale: Cette expression française conserve l’image corporelle de l’idiome hébreu tout en indiquant une action hostile.
- source_word: ביהודיים
  choice: les Juifs
  rationale: Rendu ethnique conventionnel et contextuellement approprié dans Esther.
theological_decisions: []
