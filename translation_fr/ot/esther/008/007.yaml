revisions:
- from: 'Alors le roi Assuérus dit à la reine Esther et à Mardochée le Juif : « Voici, j’ai donné à Esther les biens d’Haman, et lui, on l’a pendu au bois[a] parce qu’il avait porté la main contre les Juifs. »'
  to: 'Alors le roi Assuérus dit à la reine Esther et à Mardochée le Juif : « Voici, j’ai donné à Esther la maison d’Haman, et lui, on l’a pendu au gibet[a] parce qu’il a levé la main contre les Juifs. »'
  rationale: La révision améliore l’idiomaticité du français tout en restant fidèle au texte hébreu. « La maison d’Haman » conserve le singulier et l’ouverture sémantique de בֵּית. « Au gibet » rend le sens contextuel de עֵץ dans Esther, tandis que la note préserve le libellé littéral et l’incertitude sur la forme exacte de la structure. L’idiome « lever la main contre » exprime l’hostilité sans ajouter de détail doctrinal ou historique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:53:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : le roi s’adresse à Esther et à Mardochée, attribue à Esther la « maison » d’Haman et donne le motif de l’exécution. Toutefois, « les biens d’Haman » explicite et pluralise un terme que l’hébreu exprime au singulier (« maison »), tandis que « au bois » n’est pas une formulation naturelle en français moderne pour une structure d’exécution.'
  naturalness: « On l’a pendu au bois » sonne archaïque et peu idiomatique en français international moderne. « Au gibet » est naturel dans ce contexte; la note maintient le sens littéral de עֵץ et évite de surdéterminer précisément le type de structure. « Il a levé la main contre » rend l’idiome hébreu de façon plus fluide que « il avait porté la main contre ».
  terminology: Assuérus, Esther, Mardochée et « le Juif / les Juifs » sont appropriés. « La maison d’Haman » préserve la formulation-source, tout en pouvant désigner sa maisonnée ou son domaine selon le contexte.
  issues:
  - severity: medium
    issue: « au bois »
    rationale: Bien que proche du littéral, cette expression est peu naturelle en français moderne et ne désigne pas clairement une structure d’exécution. « Au gibet » transmet le sens contextuel; une note conserve l’alternative littérale « arbre/bois ».
  - severity: low
    issue: « les biens d’Haman »
    rationale: Le pluriel interprète « maison » comme l’ensemble des possessions. « La maison d’Haman » est plus proche du singulier hébreu et laisse au contexte sa portée de maisonnée, résidence ou domaine.
  - severity: low
    issue: « il avait porté la main contre »
    rationale: La tournure est moins naturelle et le plus-que-parfait n’est pas nécessaire. « Il a levé la main contre » rend clairement l’idiome hostile sans préciser davantage la nature de l’action.
