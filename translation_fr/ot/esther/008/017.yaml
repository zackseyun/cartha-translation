  text: וּ/בְ/כָל מְדִינָ֨ה וּ/מְדִינָ֜ה וּ/בְ/כָל עִ֣יר וָ/עִ֗יר מְקוֹם֙ אֲשֶׁ֨ר דְּבַר הַ/מֶּ֤לֶךְ וְ/דָת/וֹ֙ מַגִּ֔יעַ שִׂמְחָ֤ה וְ/שָׂשׂוֹן֙ לַ/יְּהוּדִ֔ים מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וְ/רַבִּ֞ים מֵֽ/עַמֵּ֤י הָ/אָ֨רֶץ֙ מִֽתְיַהֲדִ֔ים כִּֽי נָפַ֥ל פַּֽחַד הַ/יְּהוּדִ֖ים עֲלֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: fr
  text: Dans chaque province et chaque ville, partout où parvenaient la parole du roi et son décret, il y avait pour les Juifs joie et allégresse, festin et jour de fête. Beaucoup, parmi les peuples du pays, devenaient juifs[a], car la peur des Juifs s’était emparée d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : adoptaient les pratiques juives ; le sens précis du terme hébreu est incertain.'
    reason: Le verbe מִתְיַהֲדִים peut désigner l’adoption de l’identité, de la religion ou des usages des Juifs, sans permettre de préciser davantage.
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: chaque province et chaque ville
  rationale: Le redoublement distributif hébreu signifie « chaque province » et « chaque ville » ; cette formulation en restitue naturellement la portée en français.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: la parole du roi et son décret
  rationale: « Parole » conserve דָּבָר, tandis que « décret » rend דָּת dans son sens administratif perse.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: festin et jour de fête
  rationale: מִשְׁתֶּה désigne un banquet ou festin, et יוֹם טוֹב un jour festif, non simplement une « bonne journée ».
- source_word: מִתְיַהֲדִים
  choice: se faisaient juifs
  rationale: Le participe hitpael exprime ici le fait d’adopter l’identité ou les pratiques juives ; la formulation préserve la nuance processuelle sans préciser abusivement la nature exacte de cette démarche.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: la peur des Juifs s’était emparée d’eux
  rationale: 'Cette expression française idiomatique rend l’image hébraïque d’une peur « tombée sur » eux, tout en conservant le génitif potentiellement objectif : la peur inspirée par les Juifs.'
theological_decisions:
- issue: Nature de l’action exprimée par מִתְיַהֲדִים
  choice: se faisaient juifs
  alternative: se convertissaient au judaïsme / se déclaraient juifs
  rationale: Le verbe n’indique pas avec certitude une conversion religieuse formalisée ni une simple déclaration opportuniste. La traduction choisie maintient cette ambiguïté historique et théologique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe distributive hébraïque est rendue idiomatiquement, tandis que l’ambiguïté du verbe relatif au fait de devenir juif est conservée et signalée en note.
