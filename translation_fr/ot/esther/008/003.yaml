base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: fr
  text: Puis Esther parla de nouveau devant le roi. Elle tomba à ses pieds, pleura et le supplia de faire disparaître[a] le mal d’Haman l’Agaguite ainsi que le projet qu’il avait conçu contre les Juifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’écarter » ou « de faire passer » ; le verbe hébreu évoque l’action de faire passer le mal et le projet d’Haman, de les enlever ou de les rendre sans effet.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר
  choice: Puis Esther parla de nouveau
  rationale: La construction יסף suivie d’un autre verbe exprime ici la répétition ou la continuation. « Parla de nouveau » restitue ce sens naturellement sans calquer « ajouta ».
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: devant le roi
  rationale: L’expression désigne la présence du roi et conserve la solennité de la scène de cour.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: Elle tomba à ses pieds
  rationale: Cette formulation française naturelle exprime la prosternation physique et l’attitude de supplication.
- source_word: וַתֵּבְךְּ
  choice: pleura
  rationale: Le verbe בכה désigne le fait de pleurer; le passé simple convient au registre narratif.
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: le supplia
  rationale: Le hitpael de חנן exprime une demande pressante de faveur ou de compassion. « Supplia » en restitue l’intensité.
- source_word: לְהַעֲבִיר
  choice: de faire disparaître
  rationale: Le hiphil de עבר signifie faire passer, enlever ou écarter. « Faire disparaître » conserve l’image dynamique du texte tout en restant idiomatique.
- source_word: אֶת רָעַת הָמָן
  choice: le mal d’Haman
  rationale: רָעָה peut désigner le mal, la méchanceté ou le dommage. « Le mal d’Haman » préserve sa portée morale et le distingue du « projet » mentionné ensuite.
- source_word: הָאֲגָגִי
  choice: l’Agaguite
  rationale: Ce titre gentilice ou dynastique identifie Haman; la forme française traditionnelle et transparente est retenue.
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: ainsi que le projet qu’il avait conçu
  rationale: Le rapprochement étymologique du nom et du verbe souligne le caractère délibéré du dessein. La formulation française évite une répétition maladroite tout en conservant cette idée.
- source_word: עַל הַיְּהוּדִים
  choice: contre les Juifs
  rationale: Dans ce contexte hostile, עַל indique que le projet visait les Juifs.
