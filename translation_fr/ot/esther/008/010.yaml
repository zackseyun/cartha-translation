translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement réorganisée afin d’expliciter « les lettres » comme objet de « scella » et de les reprendre naturellement par un pronom. La formulation principale reste lisible sans masquer l’incertitude des termes hippologiques persans ou hébreux rares, signalée en note.
