base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: fr
  text: Il écrivit au nom du roi Assuérus, scella avec l’anneau du roi et envoya des lettres par des courriers à cheval, montés sur des chevaux de race royaux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les termes hébreux désignant les chevaux sont rares et difficiles à interpréter. Plus littéralement, on peut lire : « montés sur les rekesh, les ahashteranim, fils des ramakim ». Ils peuvent désigner des montures de race liées au service royal ; les traductions proposées comprennent aussi des chevaux de relais ou des animaux issus d’un élevage royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Il écrivit
  rationale: Le wayyiqtol poursuit la trame narrative ; le passé simple convient au registre narratif français.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: au nom du roi Assuérus
  rationale: L’expression indique que l’auteur agit sous l’autorité officielle du roi.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: scella les lettres avec l’anneau royal
  rationale: Le complément d’objet est implicite en hébreu et se comprend d’après « les lettres » dans la proposition suivante. « Anneau royal » désigne naturellement l’anneau servant à imprimer le sceau.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: et les envoya
  rationale: סְפָרִים désigne ici des lettres ou documents officiels ; le pronom reprend « les lettres », explicité dans la proposition précédente pour produire une phrase française fluide.
- source_word: בְּיַד הָרָצִים בַּסּוּסִים
  choice: par des coursiers à cheval
  rationale: בְּיַד marque ici l’intermédiaire ; les רָצִים sont des messagers officiels, montés dans ce contexte.
- source_word: רֹכְבֵי הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: montés sur des chevaux de race issus des haras royaux
  rationale: Les trois termes désignant ou qualifiant les chevaux sont rares et leur sens précis est incertain. Cette formulation exprime prudemment des montures sélectionnées liées au service royal, tandis que la note conserve la difficulté lexicale.
