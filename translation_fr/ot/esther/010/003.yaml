id: EST.10.3
reference: Esther 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: fr
  text: Car Mardochée, le Juif, occupait le second rang après le roi Assuérus. Il était un homme important parmi les Juifs et estimé par la plupart de ses frères[a][b] ; il recherchait le bien de son peuple et adressait des paroles de paix à toute sa descendance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par un grand nombre de ses frères » ; le terme hébreu peut désigner soit une majorité, soit une multitude.
    reason: lexical_alternative
  - marker: b
    text: Ici, « ses frères » désigne probablement les autres Juifs, ses compatriotes, et non pas seulement ses frères biologiques.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « toute sa semence » ; le terme hébreu est un nom collectif désignant la descendance ou la postérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui conclut le récit et relie ce verset à ce qui précède.
- source_word: הַיְּהוּדִי
  choice: le Juif
  rationale: Désigne l’identité ethnoreligieuse de Mardochée dans le cadre perse ; « le Judéen » serait possible, mais moins naturel ici.
- source_word: מִשְׁנֶה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: occupait le second rang après le roi Assuérus
  rationale: Exprime son rang immédiatement inférieur à celui du roi sans lui attribuer un titre administratif précis absent de l’hébreu.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: Il était un homme important parmi les Juifs
  rationale: Rend naturellement en français la grandeur sociale et l’éminence de Mardochée au sein du peuple juif.
- source_word: וְרָצוּי
  choice: estimé
  rationale: Le terme exprime l’approbation ou l’accueil favorable dont il bénéficiait.
- source_word: לְרֹב אֶחָיו
  choice: par la plupart de ses frères
  rationale: רֹב peut désigner une majorité ou une multitude. Le texte principal retient le sens courant de majorité, tout en signalant l’autre possibilité en note.
- source_word: אֶחָיו
  choice: ses frères
  rationale: Conserve l’image familiale de l’hébreu ; dans le contexte, le mot désigne vraisemblablement les membres de son peuple plutôt que ses seuls frères biologiques.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: il recherchait le bien de son peuple
  rationale: Reproduit l’idée d’une poursuite active de ce qui est bénéfique à son peuple.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: et adressait des paroles de paix
  rationale: Formulation française naturelle qui conserve l’acte de parler et la richesse de שָׁלוֹם, évocateur de paix et de bien-être.
- source_word: לְכָל זַרְעוֹ
  choice: à toute sa descendance
  rationale: זֶרַע est un nom collectif désignant la postérité ou les descendants ; le singulier collectif français préserve cet emploi.
