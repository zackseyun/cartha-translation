  text: וְ/כָל מַעֲשֵׂ֤ה תָקְפּ/וֹ֙ וּ/גְב֣וּרָת֔/וֹ וּ/פָרָשַׁת֙ גְּדֻלַּ֣ת מָרְדֳּכַ֔י אֲשֶׁ֥ר גִּדְּל֖/וֹ הַ/מֶּ֑לֶךְ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֨פֶר֙ דִּבְרֵ֣י הַ/יָּמִ֔ים לְ/מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: fr
  text: Tous les actes de sa puissance et de sa force, ainsi que le récit détaillé de la grandeur de Mardochée et de la manière dont le roi l’avait élevé, ne sont-ils pas écrits dans le livre des annales des rois de Médie et de Perse ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעֲשֵׂה
  choice: actes
  rationale: Terme large désignant ce qui a été accompli ; « actes » convient au style récapitulatif des annales royales.
- source_word: תָקְפּוֹ וּגְבוּרָתוֹ
  choice: sa puissance et sa force
  rationale: Le binôme évoque la puissance effective et la vigueur du roi. Cette formulation française conserve les deux termes sans les réduire à une seule idée.
- source_word: וּפָרָשַׁת
  choice: le récit détaillé
  rationale: Le nom désigne un exposé ou compte rendu développé ; « récit détaillé » est naturel dans le contexte d'une chronique officielle.
- source_word: גְּדֻלַּת מָרְדֳּכַי אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: la grandeur à laquelle le roi éleva Mardochée
  rationale: La formulation garde le lien relatif du texte hébreu et exprime l'élévation de Mardochée en dignité sans réduire explicitement celle-ci à une simple promotion administrative.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: ne sont-ils pas écrits
  rationale: Conserve la question rhétorique et la formule historiographique biblique.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: le livre des annales
  rationale: Dans ce titre documentaire, « annales » rend clairement l'idée de registres chronologiques officiels et évite une confusion avec le livre biblique des Chroniques.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: des rois de Médie et de Perse
  rationale: Le français idiomatique emploie « des » pour désigner les annales appartenant aux règnes de ces souverains ou les concernant.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase unique et la question rhétorique de l'hébreu sont conservées. Aucune note n'est nécessaire ; la note anglaise fournie semble décalée, car elle propose une variante portant sur le titre des annales tout en étant placée après « might ».
