id: EST.10.1
reference: Esther 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ הַ/מֶּ֨לֶךְ אחשרש מַ֛ס עַל הָ/אָ֖רֶץ וְ/אִיֵּ֥י הַ/יָּֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: fr
  text: Le roi Assuérus imposa un tribut au pays et aux îles de la mer[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux régions côtières ». Le terme hébreu peut désigner des îles ou des territoires côtiers.
    reason: lexical_alternative
  - marker: b
    text: Ou « une taxe » ou « un prélèvement ». Dans certains contextes, le mot hébreu peut aussi désigner du travail forcé ou une corvée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: imposa
  rationale: Dans la construction שׂוּם מַס עַל, le verbe exprime l’action d’imposer ou de lever un tribut, et non simplement de « placer ».
- source_word: הַמֶּלֶךְ אחשרש
  choice: Le roi Assuérus
  rationale: Cette formulation respecte l’article hébreu et correspond à l’usage naturel du français pour un titre suivi d’un nom propre.
- source_word: מַס
  choice: un tribut
  rationale: Le mot peut désigner un tribut, une taxe ou une corvée. L’étendue géographique mentionnée favorise ici le sens fiscal et impérial de « tribut », tout en laissant l’autre possibilité en note.
- source_word: הָאָרֶץ
  choice: au pays
  rationale: Dans ce contexte impérial, le terme désigne le territoire continental ou le pays soumis au roi plutôt que la terre entière.
- source_word: וְאִיֵּי הַיָּם
  choice: et aux îles de la mer
  rationale: La traduction conserve l’expression géographique hébraïque et sa portée maritime; « régions côtières » demeure une possibilité lexicale signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation reste proche de l’hébreu tout en étant naturelle en français.
