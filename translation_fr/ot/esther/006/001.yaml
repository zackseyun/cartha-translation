source:
  edition: WLC
  text: בַּ/לַּ֣יְלָה הַ/ה֔וּא נָדְדָ֖ה שְׁנַ֣ת הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר לְ/הָבִ֞יא אֶת סֵ֤פֶר הַ/זִּכְרֹנוֹת֙ דִּבְרֵ֣י הַ/יָּמִ֔ים וַ/יִּהְי֥וּ נִקְרָאִ֖ים לִ/פְנֵ֥י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: fr
  text: Cette nuit-là, le roi ne parvenait pas à dormir[a]. Il ordonna donc qu’on lui apporte le livre des souvenirs, c’est-à-dire les annales[b], et on les lut devant lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le sommeil du roi s’enfuit » ou « erra ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le livre des mémoires, les chroniques ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Cette nuit-là
  rationale: Expression temporelle naturelle en français, qui conserve la précision du démonstratif hébreu.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: le roi ne parvenait pas à dormir
  rationale: Restitue clairement l’effet de l’expression imagée « le sommeil du roi s’enfuit », tout en restant idiomatique en français.
- source_word: וַיֹּאמֶר לְהָבִיא
  choice: Il ordonna donc qu’on lui apporte
  rationale: Le verbe « dire » introduit ici une directive. La tournure choisie explicite naturellement cet acte de parole et les serviteurs implicites.
- source_word: סֵפֶר הַזִּכְרֹנוֹת
  choice: le livre des souvenirs
  rationale: Conserve le lien lexical avec la mémoire et la commémoration, sans réduire d’emblée l’expression à un simple registre administratif.
- source_word: דִּבְרֵי הַיָּמִים
  choice: les annales
  rationale: Désigne les événements consignés jour après jour dans les archives royales; « annales » est précis et naturel dans ce contexte.
- source_word: וַיִּהְיוּ נִקְרָאִים לִפְנֵי הַמֶּלֶךְ
  choice: et on les lut devant lui
  rationale: Le pronom pluriel reprend les annales ou documents; la tournure impersonnelle française rend naturellement le passif hébreu et « devant lui » exprime la lecture en présence du roi.
