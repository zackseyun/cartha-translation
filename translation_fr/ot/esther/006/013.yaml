base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: fr
  text: 'Haman raconta à Zéresh, sa femme, et à tous ses amis tout ce qui lui était arrivé. Alors ses sages et Zéresh, sa femme, lui dirent : « Si Mardochée, devant qui tu as commencé à tomber, est issu de la lignée des Juifs[a], tu ne pourras pas l’emporter sur lui, car tu tomberas bel et bien devant lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « est de la semence des Juifs » ; autrement dit, « est d’ascendance juive ».'
    reason: Le mot hébreu זֶרַע signifie littéralement « semence », mais désigne ici la descendance ou la lignée.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: raconta
  rationale: Le verbe introduit le récit fait par Haman des événements précédents ; « raconta » exprime naturellement cette idée en français.
- source_word: אֹהֲבָיו
  choice: tous ses amis
  rationale: Littéralement, le terme désigne ceux qui l’aiment ; dans ce contexte social et politique, « amis » est l’équivalent français le plus naturel.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: tout ce qui lui était arrivé
  rationale: Le plus-que-parfait situe clairement ces faits avant le récit qu’en fait Haman.
- source_word: חֲכָמָיו
  choice: ses sages
  rationale: « Sages » conserve le sens lexical du terme tout en pouvant désigner des hommes qui exercent une fonction de conseil dans le cadre de la cour perse.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: est issu de la lignée des Juifs
  rationale: זֶרַע signifie littéralement « semence », mais désigne ici l’ascendance. « Lignée » conserve l’image généalogique sans produire une formulation artificielle en français.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: devant qui tu as commencé à tomber
  rationale: Cette formulation conserve à la fois l’idée d’un commencement et la répétition rhétorique de « tomber » avec la proposition finale.
- source_word: לֹא תוּכַל לוֹ
  choice: tu ne pourras pas l’emporter sur lui
  rationale: La construction exprime ici l’incapacité à vaincre ou à prévaloir contre Mardochée ; « l’emporter sur lui » est idiomatique et précis.
- source_word: נָפוֹל תִּפּוֹל
  choice: tu tomberas bel et bien
  rationale: L’infinitif absolu suivi du verbe conjugué renforce la certitude de la chute ; « bel et bien » rend cette insistance en français courant et digne.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: La traduction littérale et concise préserve la répétition et l’idée de défaite face à Mardochée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La répétition de « tomber » ainsi que la formulation « devant lui » sont maintenues pour préserver la force rhétorique de l’hébreu.
