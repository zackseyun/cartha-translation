    issue: « avait dénoncé Bigtana et Téresh » est trop spécifique
    rationale: הִגִּיד עַל introduit le sujet du rapport de Mardochée; le texte ne qualifie pas explicitement son acte de dénonciation. « Avait rapporté au sujet de » préserve le sens sans surinterprétation.
  - severity: low
    issue: L’ancre et le contenu de la note b ne correspondent pas exactement à l’ambiguïté lexicale signalée
    rationale: L’alternative porte d’abord sur סָרִיס (« eunuques » ou « fonctionnaires/officiers royaux »), non sur « seuil ». L’ancre est donc placée après « eunuques » et la note est resserrée.
