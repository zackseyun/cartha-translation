base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: fr
  text: On trouva écrit que Mardochée avait rapporté au sujet de Bigtana et Téresh[a], deux des eunuques[b] du roi, parmi les gardiens du seuil, qui avaient cherché à porter la main sur le roi Assuérus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bigtana correspond à la forme hébraïque employée dans ce verset ; ailleurs, le nom apparaît sous la forme Bigtân.
    reason: alternative_reading
  - marker: b
    text: Ou « fonctionnaires du roi » ; le terme hébreu peut désigner précisément des eunuques ou, plus largement, des officiers de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: On trouva écrit
  rationale: Cette tournure impersonnelle conserve la construction passive et l’idée que l’information fut découverte dans les archives, tout en restant naturelle dans un récit français soutenu.
- source_word: הִגִּיד עַל
  choice: avait dénoncé
  rationale: Dans le contexte d’un complot signalé à la cour, « dénoncer » exprime naturellement le fait de révéler les agissements de personnes impliquées. Le plus neutre « avait fait un rapport au sujet de » reste possible, mais serait plus lourd.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Bigtana et Téresh
  rationale: « Bigtana » suit la forme hébraïque propre à ce verset; l’accent de « Téresh » guide la prononciation française.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: deux des eunuques du roi
  rationale: סָרִיס désigne souvent un eunuque dans un cadre royal, tout en pouvant avoir le sens plus large de haut fonctionnaire; cette possibilité est signalée en note.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: qui gardaient le seuil
  rationale: La relative française indique naturellement leur appartenance au groupe des gardiens. « Seuil » conserve l’image concrète de סַף, qui désigne ici l’accès royal.
- source_word: בִּקְשׁוּ לִשְׁלֹחַ יָד
  choice: avaient cherché à porter la main sur
  rationale: Cette expression conserve à la fois le verbe de recherche ou d’intention et l’idiome hébreu hostile, sans préciser au-delà du texte s’il s’agissait d’attaquer ou de tuer.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: sur le roi Assuérus
  rationale: La préposition « sur » s’accorde avec l’expression française « porter la main sur »; « Assuérus » est la forme française traditionnelle et reconnaissable du nom.
