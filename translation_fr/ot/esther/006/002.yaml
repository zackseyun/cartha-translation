revisions:
- from: On trouva écrit que Mardochée avait dénoncé Bigtana et Téresh[a], deux des eunuques du roi qui gardaient le seuil[b] et qui avaient cherché à porter la main sur le roi Assuérus.
  to: On trouva écrit que Mardochée avait rapporté au sujet de Bigtana et Téresh[a], deux des eunuques[b] du roi, parmi les gardiens du seuil, qui avaient cherché à porter la main sur le roi Assuérus.
  rationale: La révision remplace « dénoncé » par une expression neutre correspondant au verbe hébreu « faire savoir/rapporter », rend la relation partitive avec les gardiens du seuil, et corrige le placement ainsi que la portée de la note lexicale sur « eunuques ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:50:07Z'
review_pass:
