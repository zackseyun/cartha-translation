  source_fidelity: « Avait dénoncé » interprète הִגִּיד עַל de façon plus accusatrice que nécessaire. Le verbe signifie que Mardochée avait fait connaître ou rapporté une affaire concernant les deux hommes. La formulation révisée conserve cette neutralité. « Parmi les gardiens du seuil » rend explicitement la valeur partitive de מִשֹּׁמְרֵי הַסַּף.
  naturalness: La phrase révisée demeure fluide en français narratif moderne. L’apposition « parmi les gardiens du seuil » évite de faire de la fonction de gardien une relative potentiellement ambiguë et reflète clairement leur appartenance à ce groupe.
  terminology: « Eunuques » est un rendu défendable de סָרִיס dans ce contexte de cour, avec une note qui préserve le sens plus large possible d’officiers royaux. « Assuérus », « Mardochée », « Bigtana » et « Téresh » sont maintenus; la note sur Bigtana rend compte de la variation graphique hébraïque.
  issues:
