base_translation:
  language: en
  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: fr
  text: 'Haman dit au roi : « Un homme[a] que le roi désire honorer… »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme ». L’hébreu porte un nom masculin singulier sans article ; selon le contexte, il peut désigner l’homme dont le roi vient de parler.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: dit
  rationale: Le verbe introduit la parole de Haman et fait avancer le récit. En français, « dit » est naturel et reste proche de la forme hébraïque, sans expliciter davantage par « répondit ».
- source_word: הָמָן
  choice: Haman
  rationale: Le nom propre est conservé sous sa forme française traditionnelle.
- source_word: אֶל הַמֶּלֶךְ
  choice: au roi
  rationale: Cette tournure rend naturellement en français le destinataire de la parole et conserve le titre défini.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le nom est masculin singulier. Bien qu’il puisse être indéfini en hébreu, « l’homme » convient mieux à l’enchaînement du dialogue, où il désigne l’homme évoqué dans la question du roi.
- source_word: אֲשֶׁר
  choice: que
  rationale: Le pronom relatif français introduit naturellement la proposition dont « l’homme » est le complément d’objet.
- source_word: חָפֵץ
  choice: prend plaisir
  rationale: Le verbe exprime le plaisir ou la satisfaction, et non une simple volonté. « Prend plaisir » préserve cette nuance en français courant et digne.
- source_word: בִּיקָרוֹ
  choice: à honorer
  rationale: Le nom יְקָר désigne ici l’honneur ou la distinction accordée à quelqu’un. La formulation verbale « honorer » est idiomatique en français et convient au contexte de cour.
