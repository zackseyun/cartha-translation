    issue: « l’homme » rend défini un nom hébreu sans article.
    rationale: Bien que le contexte renvoie à l’homme de la question royale précédente, l’hébreu conserve ici la formulation indéfinie אִישׁ. « Un homme » préserve cette donnée et l’ouverture générique de la réplique de Haman.
  - severity: low
    issue: « Pour l’homme » introduit un élément de cadrage absent du texte source.
    rationale: La construction nominale hébraïque peut être rendue directement par « Un homme que… »; cette solution évite d’ajouter « pour » tout en conservant la phrase inachevée.
  - severity: low
    issue: « prend plaisir à honorer » est moins idiomatique dans ce contexte.
    rationale: La formule peut suggérer le plaisir éprouvé dans l’acte même d’honorer. « désire honorer » exprime plus naturellement le vouloir favorable de חָפֵץ dans une demande de distinction royale.
