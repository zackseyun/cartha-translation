  text: וַ/יָּ֥שָׁב מָרְדֳּכַ֖י אֶל שַׁ֣עַר הַ/מֶּ֑לֶךְ וְ/הָמָן֙ נִדְחַ֣ף אֶל בֵּית֔/וֹ אָבֵ֖ל וַ/חֲפ֥וּי רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/012.yaml
  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: fr
  text: Puis Mardochée retourna à la porte du roi, tandis qu’Haman regagna précipitamment sa maison[a], en deuil et la tête couverte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut poussé vers sa maison », pour conserver la valeur passive possible du verbe hébreu.
    reason: lexical_alternative
  - marker: b
    text: Se couvrir la tête était un signe culturel de chagrin, d’humiliation ou de deuil.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: retourna
  rationale: Le verbe שׁוּב, dans cette forme narrative, indique que Mardochée revient au lieu où il se tenait auparavant.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: la porte du roi
  rationale: Cette chaîne construite désigne la porte liée au roi ou au complexe palatial; la formulation retenue est claire et concorde avec le registre narratif.
- source_word: נִדְחַף
  choice: regagna précipitamment
  rationale: Le niphal de דחף peut évoquer le fait d’être poussé ou entraîné. Dans le contexte, cette formulation française exprime le départ pressé d’Haman sans introduire explicitement un agent absent du texte.
- source_word: בֵּיתוֹ
  choice: sa maison
  rationale: Traduction directe du nom avec suffixe possessif, dans un registre narratif courant et digne.
- source_word: אָבֵל
  choice: en deuil
  rationale: L’adjectif décrit l’état d’affliction d’Haman; « en deuil » rend naturellement cet état sans en préciser indûment la cause.
- source_word: חֲפוּי רֹאשׁ
  choice: la tête couverte
  rationale: La traduction conserve l’image concrète de l’hébreu, liée culturellement au deuil, à l’humiliation ou à la honte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste entre le retour de Mardochée à sa place et la retraite humiliante d’Haman, ainsi que l’image concrète de la tête couverte.
