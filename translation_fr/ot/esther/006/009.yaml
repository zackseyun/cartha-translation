    issue: « sur la place de la ville » ne rend pas explicitement le déplacement à travers l’espace public.
    rationale: La préposition בְּ avec רְחוֹב, dans le contexte de la procession, appelle naturellement une formulation comme « à travers la place de la ville ». Cette solution est à la fois plus fidèle au mouvement décrit et plus idiomatique.
