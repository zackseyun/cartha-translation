base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: fr
  text: 'Que l’on confie le vêtement et le cheval à l’un des hauts dignitaires du roi. Qu’on revête alors l’homme que le roi désire honorer, qu’on le fasse monter sur le cheval à travers la place de la ville et que l’on proclame devant lui : « Voici ce que l’on fait pour l’homme que le roi désire honorer ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: hauts dignitaires
  rationale: Le terme désigne les grands personnages ou nobles de l’administration royale perse ; « hauts dignitaires » est naturel en français et conserve leur rang élevé.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: désire honorer
  rationale: Cette formulation rend l’idée que le roi prend plaisir ou trouve bon d’accorder de l’honneur à cet homme, sans alourdir la phrase.
- source_word: בִּרְחוֹב הָעִיר
  choice: sur la place de la ville
  rationale: רְחוֹב désigne ici un espace public large et ouvert, vraisemblablement une place plutôt qu’une rue au sens moderne.
- source_word: וְהִרְכִּיבֻהוּ
  choice: qu’on le fasse monter
  rationale: Le causatif hébreu signifie faire monter quelqu’un ou le faire chevaucher ; cette traduction évite de suggérer qu’il est simplement conduit à pied.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: que l’on proclame devant lui
  rationale: La proclamation précède l’homme honoré au cours de la procession ; « devant lui » préserve sobrement la formulation spatiale de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Les impératifs hébreux de proposition sont rendus par des tournures au subjonctif avec « que l’on / qu’on ». La répétition finale de « l’homme que le roi désire honorer » est maintenue pour préserver l’effet rhétorique.
