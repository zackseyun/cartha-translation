base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: fr
  text: Qu’on apporte un vêtement royal que le roi a porté, ainsi qu’un cheval que le roi a monté et sur la tête duquel on a posé une couronne royale[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et sur la tête duquel une couronne royale a été posée ». Le pronom renvoie le plus naturellement au cheval, mais certains comprennent qu’il renvoie au roi.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Qu’on apporte
  rationale: Le hiphil inaccompli à valeur volitive exprime ici une instruction. « Qu’on apporte » rend cette nuance naturellement en français.
- source_word: לְבוּשׁ מַלְכוּת
  choice: un vêtement royal
  rationale: L’expression désigne un habit associé à la royauté. « Vêtement royal » reste naturel tout en évitant de préciser sans nécessité qu’il s’agit d’une robe au sens moderne.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: que le roi a porté
  rationale: La proposition relative indique que le roi a effectivement porté ce vêtement. Le passé composé convient à la pertinence actuelle de cet usage antérieur.
- source_word: וְסוּס
  choice: ainsi qu’un cheval
  rationale: Le nom sans article introduit le second objet demandé. « Ainsi qu’ » relie clairement les deux éléments en français.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: que le roi a monté
  rationale: En français, « monter un cheval » exprime naturellement l’idée portée par le verbe et la préposition hébraïques.
- source_word: וַאֲשֶׁר נִתַּן
  choice: et sur la tête duquel on a posé
  rationale: La tournure française active à sujet indéfini rend naturellement le passif hébreu et rattache la proposition relative au cheval.
- source_word: כֶּתֶר מַלְכוּת
  choice: une couronne royale
  rationale: L’expression désigne une couronne liée à la royauté. L’article indéfini respecte l’absence d’article en hébreu.
- source_word: בְּרֹאשׁוֹ
  choice: sur la tête duquel
  rationale: Le suffixe masculin singulier renvoie le plus naturellement au cheval, antécédent immédiat, tout en conservant dans une note l’autre compréhension attestée.
