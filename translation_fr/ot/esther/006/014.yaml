  text: עוֹדָ/ם֙ מְדַבְּרִ֣ים עִמּ֔/וֹ וְ/סָרִיסֵ֥י הַ/מֶּ֖לֶךְ הִגִּ֑יעוּ וַ/יַּבְהִ֨לוּ֙ לְ/הָבִ֣יא אֶת הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: fr
  text: Alors qu’ils parlaient encore avec lui, les eunuques du roi[a] arrivèrent et se dépêchèrent[b] de conduire Haman au banquet qu’Esther avait préparé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les fonctionnaires du roi » : le terme hébreu peut désigner aussi bien des fonctionnaires de cour que des eunuques.'
    reason: lexical_alternative
  - marker: b
    text: Ou « s’empressèrent »; le verbe hébreu exprime ici une action menée avec une grande rapidité.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים
  choice: Alors qu’ils parlaient encore
  rationale: L’adverbe joint au participe présente une action toujours en cours; cette tournure française restitue naturellement la simultanéité.
- source_word: עִמּוֹ
  choice: avec lui
  rationale: La préposition עִם signifie normalement « avec »; ce choix préserve la relation exprimée par l’hébreu.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: les eunuques du roi
  rationale: סָרִיס peut désigner un eunuque ou, plus largement, un fonctionnaire de cour. « Eunuques » conserve ici le sens concret et courant, tandis qu’une note signale l’autre possibilité.
- source_word: הִגִּיעוּ
  choice: arrivèrent
  rationale: Le verbe indique qu’ils parvinrent sur les lieux; le passé simple convient au déroulement narratif.
- source_word: וַיְבַהֲלוּ
  choice: se dépêchèrent
  rationale: Dans cette construction avec un infinitif, le hiphil de בהל exprime surtout l’empressement et la rapidité, sans exiger l’idée de panique.
- source_word: לְהָבִיא אֶת הָמָן
  choice: de conduire Haman
  rationale: Le hiphil de בוא signifie faire venir ou amener. Pour une personne menée vers un banquet, « conduire » est idiomatique en français et exprime clairement le déplacement voulu.
- source_word: הַמִּשְׁתֶּה
  choice: au banquet
  rationale: מִשְׁתֶּה désigne un festin, souvent associé au vin; « banquet » convient au cadre royal du livre d’Esther.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: qu’Esther avait préparé
  rationale: Bien que עשה signifie littéralement « faire », on « prépare » naturellement un banquet en français. Le plus-que-parfait indique que celui-ci était déjà organisé.
