  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: fr
  text: 'Les serviteurs du roi lui dirent : « Voici, Haman se tient dans la cour[a]. » Le roi dit : « Qu’il entre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la cour intérieure ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: les serviteurs du roi
  rationale: Dans le cadre de la cour royale, נַעַר désigne ici des personnes au service du roi. « Serviteurs » exprime leur fonction sans affirmer qu’ils sont jeunes.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » attire immédiatement l’attention sur la présence d’Haman, tout en gardant un registre naturel et digne.
- source_word: עֹמֵד
  choice: se tient
  rationale: Le participe décrit la position actuelle d’Haman. « Se tient » reste proche de l’hébreu et évite d’ajouter l’idée interprétative qu’il attend.
- source_word: בֶּחָצֵר
  choice: dans la cour
  rationale: חָצֵר désigne une cour ou cour intérieure délimitée. En français, « cour » est le terme naturel dans le contexte d’un palais.
- source_word: יָבֹא
  choice: Qu’il entre
  rationale: Cette formulation rend la valeur directive ou permissive de l’imparfait à nuance jussive et le mouvement vers la présence du roi.
- source_word: הָמָן
  choice: Haman
  rationale: Le nom propre suit sa forme française conventionnelle.
