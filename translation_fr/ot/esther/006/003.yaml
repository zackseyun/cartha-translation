  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מַֽה נַּעֲשָׂ֞ה יְקָ֧ר וּ/גְדוּלָּ֛ה לְ/מָרְדֳּכַ֖י עַל זֶ֑ה וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ מְשָׁ֣רְתָ֔י/ו לֹא נַעֲשָׂ֥ה עִמּ֖/וֹ דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: fr
  text: 'Le roi demanda alors : « Quels honneurs et quelle distinction a-t-on accordés à Mardochée pour cela ? »[a] Les jeunes gens du roi qui le servaient répondirent : « On n’a rien fait pour lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quel honneur et quelle grandeur a-t-on accordés à Mardochée à cause de cela ? »'
    reason: Cette alternative conserve les noms au singulier et rend explicitement la valeur causale de עַל זֶה, sans prétendre à une littéralité formelle supérieure.
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: quels… a-t-on accordés
  rationale: La forme passive de עשה demande ce qui a été fait. La tournure active indéfinie avec « on » est naturelle en français et s’emploie bien avec « honneurs » et « distinction ».
- source_word: יְקָר
  choice: honneurs
  rationale: Dans ce cadre royal, le nom désigne l’honneur publiquement rendu à quelqu’un. Le pluriel idiomatique français convient aux marques d’honneur accordées.
- source_word: וּגְדוּלָּה
  choice: distinction
  rationale: Associé à יְקָר, le terme évoque ici une élévation ou une reconnaissance publique. « Distinction » exprime plus naturellement en français un statut conféré, tandis que « grandeur » est conservé dans la note comme équivalent plus formel.
- source_word: לְמָרְדֳּכַי
  choice: à Mardochée
  rationale: La préposition ל marque ici le bénéficiaire; « accorder à » rend naturellement cette relation.
- source_word: עַל זֶה
  choice: pour cela
  rationale: L’expression renvoie à l’acte de Mardochée relaté auparavant et en indique le motif.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: les jeunes gens du roi
  rationale: Cette traduction conserve le sens concret de נְעָרִים sans l’assimiler entièrement à la fonction de service, exprimée ensuite.
- source_word: מְשָׁרְתָיו
  choice: qui le servaient
  rationale: Le participe de שרת désigne ceux qui assuraient le service personnel du roi; cette relative est claire et naturelle.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: On n’a rien fait pour lui
  rationale: Cette tournure idiomatique exprime qu’aucune mesure n’avait été prise en faveur de Mardochée, tout en gardant le verbe « faire » du texte source.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Demanda alors » rend la progression du récit; « répondirent » explicite naturellement la fonction du second verbe de parole sans modifier le contenu.
