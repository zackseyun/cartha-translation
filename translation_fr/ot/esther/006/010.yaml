  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/הָמָ֗ן מַ֠הֵר קַ֣ח אֶת הַ/לְּב֤וּשׁ וְ/אֶת הַ/סּוּס֙ כַּ/אֲשֶׁ֣ר דִּבַּ֔רְתָּ וַֽ/עֲשֵׂה כֵן֙ לְ/מָרְדֳּכַ֣י הַ/יְּהוּדִ֔י הַ/יּוֹשֵׁ֖ב בְּ/שַׁ֣עַר הַ/מֶּ֑לֶךְ אַל תַּפֵּ֣ל דָּבָ֔ר מִ/כֹּ֖ל אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: fr
  text: 'Alors le roi dit à Haman : « Vite, prends le vêtement et le cheval, comme tu l’as dit, et fais ainsi pour Mardochée, le Juif[a], qui se tient à la porte du roi. N’omets rien de tout ce que tu as dit[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « le Judéen » ; ici, le terme désigne surtout l’identité juive de Mardochée dans le récit.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Ne laisse tomber aucune chose de tout ce que tu as dit », expression qui signifie qu’il ne faut rien omettre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Vite
  rationale: L’impératif exprime l’urgence. « Vite » introduit naturellement en français moderne la suite d’ordres directs.
- source_word: קַח
  choice: prends
  rationale: Rend directement l’impératif de לקח sans ajouter l’idée d’aller chercher, absente du verbe lui-même.
- source_word: הַלְּבוּשׁ
  choice: le vêtement
  rationale: Le terme désigne ici le vêtement royal évoqué au verset précédent. « Vêtement » reste proche du mot hébreu sans préciser indûment sa forme.
- source_word: הַסּוּס
  choice: le cheval
  rationale: Le nom signifie simplement « le cheval » ; son caractère royal ressort du contexte plutôt que d’un qualificatif explicite dans ce verset.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: comme tu l’as dit
  rationale: Cette formulation conserve le renvoi explicite du roi aux propres paroles d’Haman et reste naturelle en français.
- source_word: וַעֲשֵׂה כֵן
  choice: et fais ainsi
  rationale: Rend de façon concise l’impératif et l’adverbe, tout en gardant le lien avec les instructions précédentes.
- source_word: לְמָרְדֳּכַי
  choice: pour Mardochée
  rationale: 'La préposition a ici un sens bénéficiaire : les honneurs doivent être accomplis en faveur de Mardochée.'
- source_word: הַיְּהוּדִי
  choice: le Juif
  rationale: Dans le récit d’Esther, le terme désigne le plus naturellement l’identité juive de Mardochée, tout en pouvant historiquement évoquer une origine judéenne.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: qui est assis à la porte du roi
  rationale: La proposition participiale décrit la place habituelle et reconnue de Mardochée ; cette traduction conserve l’image concrète du texte.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: N’omets rien de tout ce que tu as dit
  rationale: L’expression signifie littéralement ne laisser tomber aucune chose, mais fonctionne ici comme un idiome ordonnant de ne rien omettre.
theological_decisions:
- issue: Sens de הַיְּהוּדִי
  choice: le Juif
  alternative: le Judéen
  rationale: « Le Juif » correspond le mieux à la fonction identitaire du terme dans Esther, tandis qu’une note conserve l’autre nuance possible sans réduire le mot à une simple provenance géographique.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « dit » est conservée afin de souligner que le roi impose à Haman d’exécuter exactement sa propre proposition. Les impératifs brefs rendent l’urgence et l’autorité du roi.
