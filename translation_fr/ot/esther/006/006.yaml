base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: fr
  text: 'Haman entra, et le roi lui dit : « Que faut-il faire pour l’homme que le roi désire honorer ? » Haman se dit en lui-même[a] : « Qui le roi désirerait-il honorer plus que moi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Haman dit dans son cœur ».'
    reason: L’expression hébraïque conserve l’image du cœur comme lieu du discours intérieur.
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: Haman entra
  rationale: Le wayyiqtol fait progresser le récit. « Entra » exprime naturellement l’entrée d’Haman auprès du roi sans alourdir la phrase par un connecteur.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: et le roi lui dit
  rationale: Le verbe אָמַר signifie normalement « dire » ; la formulation française reste idiomatique même si les paroles prennent la forme d’une question.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: Que faut-il faire pour l’homme
  rationale: « Que faut-il faire » restitue la valeur circonstancielle de l’infinitif, tandis que « pour l’homme » rend naturellement l’expression hébraïque dans ce contexte.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: que le roi désire honorer
  rationale: חָפֵץ exprime ici la volonté accompagnée de plaisir ou de faveur, et יְקָר désigne l’honneur conféré. Cette formulation française est naturelle et conserve le motif de l’honneur royal.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Haman se dit en lui-même[a]
  rationale: L’expression désigne un discours intérieur. « Se dit en lui-même » est claire en français moderne, tandis que la note conserve l’image littérale du cœur.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: Qui le roi pourrait-il désirer honorer
  rationale: La tournure interrogative et modale rend l’inférence rhétorique d’Haman. La répétition de « désirer honorer » maintient le lien lexical avec la question du roi.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: plus que moi
  rationale: Cette comparaison rend directement et naturellement l’assurance égocentrique d’Haman.
theological_decisions: []
