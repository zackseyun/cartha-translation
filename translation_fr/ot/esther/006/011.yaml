  to: 'Haman prit donc le vêtement et le cheval, revêtit Mardochée, le fit passer à cheval[a] par la place de la ville et proclama devant lui : « Voilà ce que l’on fera pour l’homme qu’il plaît au roi d’honorer ! »'
