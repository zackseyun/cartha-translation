  text: וַ/יִּקַּ֤ח הָמָן֙ אֶת הַ/לְּב֣וּשׁ וְ/אֶת הַ/סּ֔וּס וַ/יַּלְבֵּ֖שׁ אֶֽת מָרְדֳּכָ֑י וַ/יַּרְכִּיבֵ֨/הוּ֙ בִּ/רְח֣וֹב הָ/עִ֔יר וַ/יִּקְרָ֣א לְ/פָנָ֔י/ו כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר הַ/מֶּ֖לֶךְ חָפֵ֥ץ בִּ/יקָרֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: fr
  text: 'Haman prit donc le vêtement et le cheval, revêtit Mardochée, le fit passer à cheval[a] par la place de la ville et proclama devant lui : « Voilà ce que l’on fera pour l’homme qu’il plaît au roi d’honorer ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le fit monter à cheval » ou « le fit aller à cheval ». Le verbe hébreu est causatif : Haman fit faire à Mardochée cette procession publique à cheval.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: le vêtement
  rationale: Le nom défini renvoie au vêtement royal mentionné dans le contexte immédiat. « Vêtement » reste naturel en français et n’impose pas la forme plus précise d’une robe.
- source_word: הַסּוּס
  choice: le cheval
  rationale: L’hébreu porte simplement le nom défini « le cheval » ; son caractère royal ressort déjà du contexte et n’a pas besoin d’être ajouté ici.
- source_word: וַיַּלְבֵּשׁ אֶת־מָרְדֳּכָי
  choice: revêtit Mardochée
  rationale: La forme causative de לבש signifie faire porter un vêtement à quelqu’un. « Revêtit » rend cette action directement dans un registre narratif digne.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: le fit avancer à cheval
  rationale: La forme causative de רכב indique qu’Haman fit aller Mardochée à cheval. Cette formulation exprime le déplacement public sans préciser au-delà de l’hébreu si Haman tenait lui-même la monture.
- source_word: בִּרְחוֹב הָעִיר
  choice: sur la place de la ville
  rationale: רְחוֹב désigne couramment un vaste espace public ou une place urbaine, plutôt qu’une rue ordinaire.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: et proclama devant lui
  rationale: קרא désigne ici la proclamation publique d’un héraut. « Devant lui » conserve l’indication spatiale sans déterminer inutilement la manière exacte dont se déroulait le cortège.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Voilà ce que l’on fera
  rationale: Cette tournure française garde la portée démonstrative, le passif indéfini et la valeur prospective ou normative de la formule hébraïque.
- source_word: לָאִישׁ
  choice: pour l’homme
  rationale: Le singulier masculin défini correspond à la formule de cour répétée dans le passage.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: qu’il plaît au roi d’honorer
  rationale: Cette expression rend à la fois le bon plaisir exprimé par חפץ et l’honneur conféré exprimé par יקר, dans une formulation française concise et idiomatique.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La coordination reste fluide tout en suivant la succession rapide des actions hébraïques. La formulation évite d’ajouter qu’Haman conduisait personnellement le cheval, détail que le verbe causatif n’explicite pas.
