  text: וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ מִ֣י בֶ/חָצֵ֑ר וְ/הָמָ֣ן בָּ֗א לַ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/חִ֣יצוֹנָ֔ה לֵ/אמֹ֣ר לַ/מֶּ֔לֶךְ לִ/תְלוֹת֙ אֶֽת מָרְדֳּכַ֔י עַל הָ/עֵ֖ץ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: fr
  text: 'Le roi demanda : « Qui est dans la cour ? » Or Haman était arrivé dans la cour extérieure du palais royal pour demander au roi de faire pendre Mardochée au poteau[a] qu’il avait préparé pour lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu עֵץ signifie littéralement « arbre » ou « bois ». Il désigne ici la structure d’exécution préparée par Haman ; sa forme exacte et le mode précis d’exécution ne sont pas indiqués.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: dans la cour / dans la cour
  rationale: חָצֵר désigne une cour fermée. « Cour » est naturel dans le cadre du palais, et la répétition du terme hébreu est conservée.
- source_word: וְהָמָן בָּא
  choice: Or Haman était arrivé
  rationale: La proposition fournit l’arrière-plan de la question du roi. Le plus-que-parfait exprime naturellement en français l’arrivée antérieure d’Haman, tandis que « Or » marque le changement de perspective sans forcer la chronologie.
- source_word: בֵּית הַמֶּלֶךְ
  choice: du palais royal
  rationale: Littéralement « maison du roi » ; dans ce contexte, « palais royal » est l’équivalent français naturel et évite une compréhension domestique.
- source_word: הַחִיצוֹנָה
  choice: extérieure
  rationale: L’adjectif distingue cette cour d’une cour intérieure ; « extérieure » est précis et idiomatique.
- source_word: לֵאמֹר לַמֶּלֶךְ לִתְלוֹת
  choice: pour demander au roi de faire pendre
  rationale: 'La construction exprime le but de la venue d’Haman : parler au roi afin d’obtenir l’exécution de Mardochée. « Demander… de faire pendre » rend explicitement et naturellement cette intention sans suggérer qu’Haman allait agir sans autorisation.'
- source_word: הָעֵץ
  choice: le poteau
  rationale: עֵץ signifie littéralement « arbre » ou « bois » et peut ici désigner une structure d’exécution. « Poteau » préserve mieux que « potence » l’indétermination de la forme et la possibilité d’un supplice par exposition ou empalement.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: qu’il avait préparé pour lui
  rationale: Le pronom renvoie le plus naturellement à Mardochée dans le contexte. Le plus-que-parfait situe la préparation avant la scène présente.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve la répétition de « cour » et emploie « poteau » afin de ne pas préciser au-delà de l’hébreu la nature de la structure d’exécution.
