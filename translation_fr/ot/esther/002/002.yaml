  text: וַ/יֹּאמְר֥וּ נַעֲרֵֽי הַ/מֶּ֖לֶךְ מְשָׁרְתָ֑י/ו יְבַקְשׁ֥וּ לַ/מֶּ֛לֶךְ נְעָר֥וֹת בְּתוּל֖וֹת טוֹב֥וֹת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: fr
  text: 'Alors les jeunes hommes du roi qui le servaient dirent : « Qu’on recherche pour le roi de jeunes femmes vierges et belles[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de jeunes femmes, vierges, belles d’apparence » ou « de belle apparence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Alors ... dirent
  rationale: Le waw consécutif fait avancer le récit. « Alors » exprime naturellement cette progression en français.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: les jeunes hommes du roi
  rationale: נַעַר peut désigner un jeune homme ou un serviteur. Puisque מְשָׁרְתָיו précise déjà leur fonction de service, « jeunes hommes » conserve la distinction lexicale.
- source_word: מְשָׁרְתָיו
  choice: qui le servaient
  rationale: Le participe de שׁרת décrit ceux qui assurent le service personnel du roi. La proposition relative est naturelle en français.
- source_word: יְבַקְשׁוּ
  choice: Qu’on recherche
  rationale: La forme hébraïque est active, littéralement « qu’ils recherchent », mais le pronom indéfini « on » rend naturellement la proposition sans préciser davantage les agents implicites.
- source_word: לַמֶּלֶךְ
  choice: pour le roi
  rationale: Cette formulation simple rend le datif d’intérêt ou de destination sans surinterprétation.
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: de jeunes femmes vierges
  rationale: « Jeunes femmes » rend נְעָרוֹת sans suggérer des enfants, tandis que « vierges » conserve le sens précis de בְּתוּלוֹת.
- source_word: טוֹבוֹת מַרְאֶה
  choice: belles
  rationale: L’expression signifie littéralement « bonnes d’apparence » et désigne ici la beauté physique. « Belles » est idiomatique, sobre et exact en français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le texte distingue les « jeunes hommes » de leur fonction de service et évite le terme potentiellement infantilisant « jeunes filles ». Le tour « qu’on recherche » reste proche de l’actif hébreu tout en étant naturel.
