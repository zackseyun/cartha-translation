  terminology: « Vierges » préserve le sens lexical spécifique de בְּתוּלוֹת. « Jeunes femmes » évite à juste titre l’infantilisation que pourrait entraîner « jeunes filles ». « Belles » est une équivalence française concise et naturelle de l’expression hébraïque « bonnes d’apparence ».
