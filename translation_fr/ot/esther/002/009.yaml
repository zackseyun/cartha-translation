base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: fr
  text: La jeune femme lui plut et gagna sa faveur. Il s’empressa de lui fournir ses soins de beauté et ses rations, ainsi que sept jeunes femmes du palais royal, appropriées pour lui être données. Puis il l’installa, elle et ses jeunes femmes, au meilleur endroit de la maison des femmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les meilleurs appartements de la maison des femmes ». L’expression désigne un emplacement privilégié dans les quartiers réservés aux femmes du roi, souvent appelés le harem.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici une jeune personne de sexe féminin. « Jeune femme » est naturel en français moderne et évite aussi bien la nuance enfantine possible de « jeune fille » que l’archaïsme de « jeune fille vierge » ou « demoiselle ».
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: lui plut
  rationale: L’expression signifie littéralement « fut bonne à ses yeux ». « Lui plut » en restitue naturellement le sens sans ajouter de nuance romantique ou sexuelle.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: gagna sa faveur
  rationale: Dans ce contexte de cour, חֶסֶד désigne l’accueil favorable et la bienveillance dont elle devient l’objet. Cette formulation française est claire et idiomatique.
- source_word: וַיְבַהֵל ... לָתֵת לָהּ
  choice: il s’empressa de lui donner
  rationale: Le verbe בהל exprime ici la hâte avec laquelle l’homme fait fournir les traitements et les portions.
- source_word: תַּמְרוּקֶיהָ
  choice: ses soins de beauté
  rationale: Le terme renvoie aux préparations ou traitements cosmétiques du processus décrit en Esther 2. « Soins de beauté » est compréhensible sans réduire le mot à de simples produits.
- source_word: מָנוֹתֶיהָ
  choice: ses rations
  rationale: מָנוֹת désigne des portions attribuées, vraisemblablement alimentaires dans ce cadre palatial. « Rations » rend explicitement cette allocation sans la surinterpréter.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת לָתֶת לָהּ
  choice: sept jeunes femmes ... qui étaient aptes à être mises à son service
  rationale: La formulation conserve l’idée que ces jeunes femmes étaient jugées appropriées pour lui être attribuées, tout en explicitant naturellement en français leur fonction contextuelle de servantes.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: du palais royal
  rationale: בֵּית הַמֶּלֶךְ est littéralement « maison du roi », mais désigne naturellement ici le palais et son personnel.
- source_word: וַיְשַׁנֶּהָ ... לְטוֹב בֵּית הַנָּשִׁים
  choice: il l’installa ... dans le meilleur endroit de la maison des femmes
  rationale: Dans ce contexte, שנה indique un changement de situation ou d’emplacement. La traduction rend le déplacement vers une partie supérieure des quartiers féminins sans affirmer une promotion institutionnelle formelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Maison des femmes » conserve l’expression institutionnelle du texte hébreu; la note précise le cadre palatial sans imposer « harem » dans le texte principal. Le marqueur de note est placé sur la proposition qu’il explique.
