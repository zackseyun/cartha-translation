  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: fr
  text: Jour après jour, Mardochée allait et venait devant la cour de la maison des femmes, pour savoir comment se portait Esther et ce qu’on ferait d’elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל יוֹם וָיוֹם
  choice: Jour après jour
  rationale: L’expression distributive insiste sur la régularité quotidienne; cette tournure française naturelle en conserve l’emphase.
- source_word: מִתְהַלֵּךְ
  choice: allait et venait
  rationale: La forme suggère un déplacement répété; «allait et venait» rend naturellement cette activité habituelle.
- source_word: חֲצַר בֵּית הַנָּשִׁים
  choice: la cour de la maison des femmes
  rationale: Traduction formelle qui conserve les deux éléments architecturaux et l’appellation du lieu.
- source_word: לָדַעַת אֶת שְׁלוֹם אֶסְתֵּר
  choice: pour savoir comment se portait Esther
  rationale: Littéralement, il s’agit de connaître le «bien-être» ou l’«état» d’Esther; la formulation choisie est idiomatique et précise en français.
- source_word: וּמַה יֵּעָשֶׂה בָּהּ
  choice: et ce qui lui arriverait
  rationale: Littéralement «ce qui serait fait à son égard/avec elle»; l’expression française conserve l’indétermination quant à ce qui l’attend.
