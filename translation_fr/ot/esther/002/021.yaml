  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מָרְדֳּכַ֖י יֹשֵׁ֣ב בְּ/שַֽׁעַר הַ/מֶּ֑לֶךְ קָצַף֩ בִּגְתָ֨ן וָ/תֶ֜רֶשׁ שְׁנֵֽי סָרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ מִ/שֹּׁמְרֵ֣י הַ/סַּ֔ף וַ/יְבַקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵֽרֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: fr
  text: En ces jours-là, tandis que Mardochée était assis à la porte du roi, Bigtân et Téresh, deux eunuques du roi[a] qui comptaient parmi les gardiens du seuil, se mirent en colère et cherchèrent à porter la main sur le roi Assuérus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «des officiers de la cour du roi»; le terme hébreu peut désigner plus largement des officiers de la cour, bien qu’«eunuques» soit probable dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement «étendre la main contre»; c’est-à-dire attaquer le roi ou chercher à l’assassiner.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: En ces jours-là
  rationale: Cette formule narrative situe les événements dans une période générale sans en préciser davantage la durée.
- source_word: יֹשֵׁב
  choice: était assis
  rationale: Le participe décrit ici une situation en cours; dans le contexte de la porte royale, le sens concret «être assis» convient mieux que «habiter».
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: à la porte du roi
  rationale: L’expression désigne la porte et l’espace administratif qui lui est associé; cette formulation est naturelle en français tout en conservant l’image du texte.
- source_word: קָצַף
  choice: se mirent en colère
  rationale: Bien que le verbe hébreu soit morphologiquement au singulier avant le sujet composé, il s’applique à Bigtân et Téresh. La traduction garde une intensité sobre, sans amplifier en «furent pris de fureur».
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: eunuques du roi
  rationale: סָרִיס peut désigner des eunuques ou, plus largement, des officiers de cour. Dans ce cadre royal, «eunuques» est le sens concret le plus probable; l’autre possibilité est signalée en note.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: qui comptaient parmi les gardiens du seuil
  rationale: Le מִן indique leur appartenance au groupe chargé de garder le seuil. Cette tournure conserve l’image concrète du seuil tout en exprimant clairement leur fonction.
- source_word: וַיְבַקְשׁוּ
  choice: cherchèrent
  rationale: Le verbe exprime ici une intention hostile. «Cherchèrent» reste proche de l’hébreu sans préciser indûment s’il s’agissait déjà d’un complot organisé ou d’une tentative effective.
- source_word: לִשְׁלֹחַ יָד
  choice: porter la main sur
  rationale: Cette expression française conserve l’image corporelle de l’idiome hébreu et laisse ouverte la forme exacte de la violence envisagée; la note en explicite la portée probable.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Assuérus
  rationale: La forme française traditionnelle «Assuérus» représente le nom hébreu sans le remplacer par son identification historique courante, Xerxès.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les noms suivent les formes françaises bibliques usuelles. La syntaxe reste fluide tout en conservant les images du «seuil» et de la «main», ainsi que l’ambiguïté de l’intention exprimée par וַיְבַקְשׁוּ.
