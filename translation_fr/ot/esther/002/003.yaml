source:
  edition: WLC
  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: fr
  text: Que le roi nomme des fonctionnaires dans toutes les provinces de son royaume, et qu’ils rassemblent toutes les jeunes filles vierges et belles à Suse, la citadelle, dans la maison des femmes[a], sous la responsabilité de Hégaï, l’eunuque du roi chargé des femmes. Qu’on leur fournisse leurs produits de beauté[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le harem ». L’hébreu dit plus littéralement « dans la maison des femmes ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Qu’on leur dispense leurs soins de beauté ». Le terme hébreu peut désigner des préparations cosmétiques ou, plus largement, des soins destinés à embellir.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד / פְּקִידִים
  choice: nomme des fonctionnaires
  rationale: Le hifil de פקד exprime ici la nomination d’agents royaux à une tâche administrative. « Fonctionnaires » évite la possible connotation militaire d’« officiers ».
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: les provinces de son royaume
  rationale: Formulation naturelle correspondant au vocabulaire administratif impérial récurrent dans Esther.
- source_word: וְיִקְבְּצוּ
  choice: qu’ils rassemblent
  rationale: Le subjonctif poursuit la proposition à valeur jussive; « rassembler » rend le fait de réunir et d’acheminer les jeunes filles.
- source_word: כָּל נַעֲרָה בְתוּלָה טוֹבַת מַרְאֶה
  choice: toutes les jeunes filles vierges et belles
  rationale: 'La traduction conserve les trois éléments du texte hébreu : jeunesse, virginité et beauté visible, dans un français fluide.'
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Suse, la citadelle
  rationale: הַבִּירָה désigne ici la citadelle ou le complexe royal fortifié de Suse.
- source_word: בֵּית הַנָּשִׁים
  choice: la maison des femmes
  rationale: Traduction transparente de l’expression hébraïque, qui évite d’introduire directement le terme plus interprétatif « harem ».
- source_word: אֶל יַד הֵגֶא
  choice: sous la responsabilité de Hégaï
  rationale: L’expression idiomatique « à la main de » indique l’autorité, la garde ou la responsabilité confiée à Hégaï.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: l’eunuque du roi
  rationale: « Eunuque » est le sens lexical premier et convient particulièrement au contexte des quartiers réservés aux femmes, tout en reconnaissant que le mot peut parfois désigner plus largement un haut fonctionnaire.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: chargé des femmes
  rationale: Cette formulation actuelle et digne exprime la fonction de surveillance et de responsabilité sans la raideur de « gardien des femmes ».
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: Qu’on leur fournisse leurs produits de beauté
  rationale: Le tour verbal exprime la fourniture des préparations destinées à embellir; « produits de beauté » est naturel et laisse en note la nuance possible de soins.
theological_decisions: []
