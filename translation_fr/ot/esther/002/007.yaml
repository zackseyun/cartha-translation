  to: Il élevait Hadassa, c’est-à-dire Esther, fille de son oncle[a], car elle n’avait ni père ni mère. La jeune femme avait une belle silhouette et une belle apparence. À la mort de son père et de sa mère, Mardochée la prit pour sa propre fille[b].
