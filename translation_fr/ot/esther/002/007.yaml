  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: fr
  text: Il élevait Hadassa, c’est-à-dire Esther, fille de son oncle[a], car elle n’avait ni père ni mère. La jeune femme avait une belle silhouette et une belle apparence. À la mort de son père et de sa mère, Mardochée la prit pour sa propre fille[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Autrement dit, sa cousine.
    reason: La formulation hébraïque dit littéralement « fille de son oncle » ; le lien familial qui en résulte est celui de cousine.
  - marker: b
    text: 'Ou : « Mardochée l’adopta comme sa fille. » L’hébreu dit plus littéralement qu’il la « prit pour lui comme fille ».'
    reason: « Adopta » peut résumer le sens, mais peut suggérer une procédure juridique formelle que l’hébreu n’explicite pas.
lexical_decisions:
- source_word: אֹמֵן
  choice: élevait
  rationale: Le participe décrit le rôle durable de Mardochée, qui prenait soin d’Esther et assurait son éducation. « Élevait » est naturel en français moderne et reste moins juridique que « était son tuteur ».
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Hadassa, c’est-à-dire Esther
  rationale: Le pronom appositif identifie une seule personne portant deux noms. « C’est-à-dire » rend explicitement et naturellement cette identification.
- source_word: בַּת דֹּדוֹ
  choice: fille de son oncle
  rationale: Cette formulation conserve l’expression familiale précise de l’hébreu au lieu de la réduire au terme dérivé « cousine ».
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: car elle n’avait ni père ni mère
  rationale: La traduction reproduit l’affirmation explicite du texte sans la remplacer par le terme interprétatif « orpheline ».
- source_word: הַנַּעֲרָה
  choice: La jeune femme
  rationale: Dans le contexte, « jeune femme » convient mieux que « jeune fille », potentiellement trop juvénile, et évite le registre vieilli de « jeune vierge ».
- source_word: יְפַת תֹּאַר
  choice: avait une belle silhouette
  rationale: L’expression évoque la beauté de la forme ou de la figure. « Belle silhouette » est idiomatique et garde cette dimension physique.
- source_word: טוֹבַת מַרְאֶה
  choice: était belle à voir
  rationale: Cette expression rend l’aspect agréable à la vue tout en maintenant le parallélisme avec la beauté de la silhouette, sans préciser indûment qu’il s’agit seulement du visage.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: À la mort de son père et de sa mère
  rationale: La construction situe la prise en charge d’Esther au moment ou à la suite de la mort de ses parents.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: Mardochée l’avait prise chez lui comme sa propre fille
  rationale: La formulation exprime naturellement l’idée littérale de la prendre pour lui comme fille, sans importer la catégorie juridique moderne d’une adoption officielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les temps du passé présentent d’abord la situation durable, puis l’événement antérieur expliquant la relation entre Esther et Mardochée. Les deux expressions décrivant sa beauté restent distinctes sans lourdeur littérale.
