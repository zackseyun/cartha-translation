  text: אֵ֣ין אֶסְתֵּ֗ר מַגֶּ֤דֶת מֽוֹלַדְתָּ/הּ֙ וְ/אֶת עַמָּ֔/הּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה עָלֶ֖י/הָ מָרְדֳּכָ֑י וְ/אֶת מַאֲמַ֤ר מָרְדֳּכַי֙ אֶסְתֵּ֣ר עֹשָׂ֔ה כַּ/אֲשֶׁ֛ר הָיְתָ֥ה בְ/אָמְנָ֖ה אִתּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: fr
  text: Esther ne révélait ni ses origines ni son peuple[a], comme Mardochée le lui avait ordonné. Elle continuait à faire ce que Mardochée lui disait, comme lorsqu’elle était sous sa tutelle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son ascendance » ou « sa parenté ». Le terme hébreu peut désigner la naissance, la lignée ou le groupe familial.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme lorsqu’il l’élevait ». L’hébreu renvoie à la période où Mardochée prenait soin d’Esther et assurait son éducation.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין אֶסְתֵּר מַגֶּדֶת
  choice: Esther ne révélait
  rationale: La négation אֵין avec le participe מַגֶּדֶת décrit ici une situation qui se prolonge dans le cadre du récit. L’imparfait français rend naturellement cette continuité sans imposer un plus-que-parfait.
- source_word: מוֹלַדְתָּהּ
  choice: ses origines
  rationale: Le nom peut désigner la naissance, l’ascendance ou le groupe familial. « Ses origines » est clair en français moderne et conserve cette amplitude sémantique.
- source_word: עַמָּהּ
  choice: son peuple
  rationale: עַם désigne ici le peuple auquel Esther appartient, c’est-à-dire son identité collective ou nationale, sans nécessiter une terminologie ethnique moderne.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: comme Mardochée le lui avait ordonné
  rationale: צוה exprime un ordre plutôt qu’un simple conseil. Le plus-que-parfait situe cet ordre avant la conduite décrite.
- source_word: וְאֶת מַאֲמַר מָרְדֳּכַי אֶסְתֵּר עֹשָׂה
  choice: Elle continuait à faire ce que Mardochée lui disait
  rationale: מַאֲמַר peut signifier parole, propos ou commandement, tandis que le participe עֹשָׂה suggère une conduite habituelle ou continue. Cette formulation évite une répétition lourde d’« ordre » tout en conservant la durée.
- source_word: כַּאֲשֶׁר הָיְתָה בְאָמְנָה אִתּוֹ
  choice: comme lorsqu’elle était sous sa tutelle
  rationale: La forme liée à אמן évoque l’éducation et la prise en charge d’Esther par Mardochée. « Sous sa tutelle » rend de manière concise cette relation de gardien et d’éducateur.
