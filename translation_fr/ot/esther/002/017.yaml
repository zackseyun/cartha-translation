base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: fr
  text: Le roi aima Esther plus que toutes les femmes, et elle obtint auprès de lui plus de faveur et de bienveillance[a] que toutes les vierges[b]. Alors il posa la couronne royale sur sa tête et la fit reine à la place de Vashti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « elle porta faveur et bienveillance devant lui ».
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu rendu par « vierges » est plus précis que celui rendu plus haut par « femmes » ; la distinction du texte est conservée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: aima
  rationale: Le verbe אהב exprime directement l’amour ou l’affection. Le passé simple convient au récit et évite de réduire ce sentiment à une simple préférence.
- source_word: מִכָּל הַנָּשִׁים
  choice: plus que toutes les autres femmes
  rationale: La construction comparative מן + כל est rendue explicitement. « Femmes » traduit le terme général נָשִׁים et conserve sa différence avec בְּתוּלוֹת dans la proposition suivante.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד לְפָנָיו
  choice: elle obtint auprès de lui plus de faveur et de bienveillance
  rationale: « Obtint auprès de lui » rend naturellement l’idiome hébreu sans effacer sa dimension relationnelle. « Faveur » et « bienveillance » distinguent les deux noms חֵן et חֶסֶד; dans ce contexte, חֶסֶד désigne une disposition bienveillante plutôt qu’une fidélité d’alliance.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: que toutes les autres vierges
  rationale: בְּתוּלוֹת est plus précis que le terme précédent pour « femmes ». « Vierges » maintient cette distinction lexicale présente dans l’hébreu.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: Il posa donc la couronne royale
  rationale: « Couronne royale » rend naturellement le littéral « couronne de royauté ». « Posa » conserve le geste concret décrit par שׂים.
- source_word: וַיַּמְלִיכֶהָ
  choice: la fit reine
  rationale: Le hifil de מלך signifie établir quelqu’un comme roi ou reine, ou le faire régner. Dans ce contexte, « la fit reine » est la formulation française la plus claire.
- source_word: תַּחַת וַשְׁתִּי
  choice: à la place de Vashti
  rationale: Dans un contexte de remplacement ou de succession, תַּחַת signifie « à la place de ».
