base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: fr
  text: Que la jeune femme qui plaira au roi devienne reine à la place de Vashti[a]. Cette proposition plut au roi[b], et il fit ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qu’elle règne à la place de Vashti ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Cette affaire parut bonne au roi » ; littéralement : « Cette chose fut bonne aux yeux du roi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici une personne de sexe féminin encore jeune. « Jeune femme » est naturel en français moderne et évite tant la nuance potentiellement trop juvénile de « jeune fille » que le caractère archaïque de « jeune fille vierge » ou « demoiselle ».
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: qui plaira au roi
  rationale: L’expression idiomatique signifie être bonne ou agréable au jugement de quelqu’un. « Plaire au roi » restitue naturellement ce sens et le futur français convient à la sélection envisagée.
- source_word: תִּמְלֹךְ
  choice: devienne reine
  rationale: Le verbe מלך signifie littéralement « régner ». Dans le contexte du remplacement de Vashti, « devienne reine » exprime clairement et naturellement en français la fonction royale que la jeune femme recevra, sans suggérer ici une analyse particulière de l’étendue de son autorité.
- source_word: תַּחַת וַשְׁתִּי
  choice: à la place de Vashti
  rationale: תַּחַת marque ici la substitution. « À la place de » est une formulation française directe et idiomatique.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: Cette proposition plut au roi
  rationale: דָּבָר désigne dans ce contexte la mesure qui vient d’être proposée. « Cette proposition » rend le référent explicite, tandis que « plut au roi » reproduit naturellement l’idiome répété.
- source_word: וַיַּעַשׂ כֵּן
  choice: et il fit ainsi
  rationale: La formule narrative indique que le roi mit la proposition à exécution. « Il fit ainsi » reste proche de l’hébreu tout en étant clair et digne en français.
