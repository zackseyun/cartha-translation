  text: וּ/בְ/הַגִּ֣יעַ תֹּר אֶסְתֵּ֣ר בַּת אֲבִיחַ֣יִל דֹּ֣ד מָרְדֳּכַ֡י אֲשֶׁר֩ לָקַֽח ל֨/וֹ לְ/בַ֜ת לָ/ב֣וֹא אֶל הַ/מֶּ֗לֶךְ לֹ֤א בִקְשָׁה֙ דָּבָ֔ר כִּ֠י אִ֣ם אֶת אֲשֶׁ֥ר יֹאמַ֛ר הֵגַ֥י סְרִיס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וַ/תְּהִ֤י אֶסְתֵּר֙ נֹשֵׂ֣את חֵ֔ן בְּ/עֵינֵ֖י כָּל רֹאֶֽי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: fr
  text: Quand vint le tour d’Esther, fille d’Abihaïl, l’oncle de Mardochée, qui l’avait prise pour fille[a], de se présenter devant le roi, elle ne demanda rien d’autre que ce que lui indiquerait Hégaï, l’eunuque[b] du roi chargé de la garde des femmes. Esther gagnait la faveur de tous ceux qui la voyaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’avait adoptée comme sa fille ». L’expression hébraïque indique que Mardochée l’avait accueillie et prise en charge comme sa fille, sans préciser de procédure juridique.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner plus largement un haut fonctionnaire de la cour, mais le contexte des appartements réservés aux femmes favorise ici le sens précis d’« eunuque ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Quand vint le tour
  rationale: La construction introduit une proposition temporelle, et תֹּר désigne ici le tour assigné à Esther dans l’ordre de présentation au roi.
- source_word: דֹּד מָרְדֳּכַי
  choice: l’oncle de Mardochée
  rationale: Dans ce contexte familial, דֹּד désigne l’oncle de Mardochée; l’apposition se rapporte à Abihaïl.
- source_word: לָקַח לוֹ לְבַת
  choice: l’avait prise pour fille
  rationale: Cette formulation conserve l’idiome hébreu et exprime la prise en charge filiale sans affirmer l’existence d’une procédure juridique formelle d’adoption.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: de se présenter devant le roi
  rationale: Cette expression française naturelle rend l’entrée en présence du roi tout en maintenant la discrétion du récit quant au contexte intime.
- source_word: לֹא בִקְשָׁה דָּבָר כִּי אִם
  choice: elle ne demanda rien d’autre que
  rationale: 'La tournure rend clairement la construction exceptive: Esther ne réclame que ce qu’Hégaï lui recommande.'
- source_word: אֲשֶׁר יֹאמַר
  choice: ce que lui recommanda
  rationale: Dans le contexte des préparatifs, le verbe de parole exprime ce qu’Hégaï juge approprié; «recommanda» explicite sobrement cette fonction contextuelle.
- source_word: סְרִיס
  choice: eunuque
  rationale: Le sens précis convient au cadre des appartements réservés aux femmes, tout en signalant en note le sens plus large possible de fonctionnaire royal.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: chargé des femmes
  rationale: La formulation décrit clairement et sans lourdeur la responsabilité d’Hégaï à l’égard des femmes du palais.
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן
  choice: Esther gagnait la faveur
  rationale: L’imparfait restitue le développement narratif, tandis que «gagner la faveur» rend naturellement l’idiome hébreu.
- source_word: בְּעֵינֵי כָּל רֹאֶיהָ
  choice: de tous ceux qui la voyaient
  rationale: Le français exprime naturellement la faveur reçue auprès de l’ensemble de ceux qui voyaient Esther, sans reproduire mécaniquement l’idiome «aux yeux de».
