  naturalness: Le français est globalement naturel et de registre narratif soutenu. « Chargé des femmes » est moins idiomatique et moins précis que « chargé de la garde des femmes ». Le déplacement de l’appel de note a rend son ancrage non ambigu.
  terminology: Les noms Abihaïl, Mardochée et Hégaï sont cohérents. « Eunuque » est le sens premier approprié de סָרִיס dans ce contexte, avec une note qui conserve l’alternative lexicale. « Prise pour fille » préserve utilement l’absence de précision juridique.
