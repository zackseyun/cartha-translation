  to: Quand vint le tour d’Esther, fille d’Abihaïl, l’oncle de Mardochée, qui l’avait prise pour fille[a], de se présenter devant le roi, elle ne demanda rien d’autre que ce que lui indiquerait Hégaï, l’eunuque[b] du roi chargé de la garde des femmes. Esther gagnait la faveur de tous ceux qui la voyaient.
