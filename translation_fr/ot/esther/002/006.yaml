  text: אֲשֶׁ֤ר הָגְלָה֙ מִ/יר֣וּשָׁלַ֔יִם עִם הַ/גֹּלָה֙ אֲשֶׁ֣ר הָגְלְתָ֔ה עִ֖ם יְכָנְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: fr
  text: qui avait été déporté de Jérusalem avec les exilés qui avaient été déportés avec Jékonias, roi de Juda[a], par Nabuchodonosor, roi de Babylone.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui » peut renvoyer à Qish, ancêtre de Mardochée, plutôt qu’à Mardochée lui-même, puisque la déportation de Jékonias avait eu lieu plusieurs générations auparavant.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: qui
  rationale: Le pronom relatif personnel reprend naturellement Mardochée dans le fil immédiat du texte, tout en laissant l’autre rattachement possible en note.
- source_word: הָגְלָה
  choice: avait été déporté
  rationale: Le passif français exprime clairement l’exil forcé et convient au contexte causatif/passif de גלה.
- source_word: מִירוּשָׁלַיִם
  choice: de Jérusalem
  rationale: Rendu direct de la préposition et du nom de lieu.
- source_word: עִם הַגֹּלָה
  choice: avec les exilés
  rationale: Le collectif désigne ici le groupe des personnes emmenées en exil; « les exilés » est concret et naturel en français moderne.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: qui avaient été déportés
  rationale: Le singulier féminin hébreu s’accorde avec le nom collectif; le pluriel français reprend naturellement « les exilés ».
- source_word: יְכָנְיָה
  choice: Jékonias
  rationale: Translittération française traditionnelle et directe de la forme hébraïque présente dans ce verset, sans harmonisation avec un autre nom royal.
- source_word: מֶלֶךְ יְהוּדָה
  choice: roi de Juda
  rationale: Rendu français standard de l’état construit.
- source_word: אֲשֶׁר הֶגְלָה
  choice: ceux que … avait déportés
  rationale: Le relatif reprend le groupe des exilés et nomme Nabuchodonosor comme agent; la répétition de « déporter » reflète celle de la racine גלה.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nabuchodonosor
  rationale: Forme française conventionnelle et largement reconnue du nom du roi babylonien.
- source_word: מֶלֶךְ בָּבֶל
  choice: roi de Babylone
  rationale: Rendu français standard de l’état construit.
theological_decisions:
- issue: Antécédent de la proposition relative en Esther 2.6
  choice: Dans le texte principal, « qui » se rattache à Mardochée.
  alternative: La proposition peut se rattacher à Qich, ancêtre de Mardochée, puisque la déportation de Jékonias avait eu lieu plusieurs générations auparavant.
  rationale: Mardochée est l’antécédent personnel le plus immédiat dans le déroulement syntaxique, mais la difficulté chronologique rend plausible le rattachement à Qich. La note conserve cette ambiguïté au lieu de la trancher silencieusement.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « déporté(s) » est volontaire afin de refléter l’insistance lexicale de l’hébreu. « Ceux que » évite que le dernier relatif paraisse désigner seulement Jékonias, tout en restant naturel.
