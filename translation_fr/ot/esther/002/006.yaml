- from: qui avait été déporté de Jérusalem avec les exilés qui avaient été déportés avec Jékonias, roi de Juda[a], ceux que Nabuchodonosor, roi de Babylone, avait déportés.
  to: qui avait été déporté de Jérusalem avec les exilés qui avaient été déportés avec Jékonias, roi de Juda[a], par Nabuchodonosor, roi de Babylone.
  rationale: La révision supprime la reprise française maladroite « ceux que » et rattache sans ambiguïté Nabuchodonosor à l’action de déporter les exilés. Elle préserve la répétition lexicale de la déportation, le caractère collectif de הַגּוֹלָה rendu par « les exilés », ainsi que l’ambiguïté historiquement significative concernant l’antécédent initial de « qui », maintenue en note.
