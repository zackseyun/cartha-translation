  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: fr
  text: Lorsque les vierges furent rassemblées une seconde fois[a], Mardochée était assis à la porte du roi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau ». L’hébreu dit littéralement « une seconde fois ».
    reason: lexical_alternative
  - marker: b
    text: La « porte du roi » désigne probablement l’espace de la porte du palais royal, lieu associé au service officiel et à l’administration.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: Lorsque ... furent rassemblées
  rationale: La préposition avec l’infinitif construit niphal introduit une proposition temporelle et exprime un rassemblement subi. « Lorsque » et le passif rendent naturellement ces deux éléments en français.
- source_word: בְּתוּלוֹת
  choice: les jeunes filles vierges
  rationale: Le terme désigne ici des jeunes femmes en précisant leur virginité. Cette formulation française explicite le sens sans employer le substantif « vierges », qui pourrait sonner réducteur ou marqué dans le français courant.
- source_word: שֵׁנִית
  choice: pour la seconde fois
  rationale: L’adverbe signifie littéralement « une seconde fois » ou « de nouveau ». La formulation retenue préserve explicitement l’idée d’un deuxième rassemblement.
- source_word: וּמָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et largement reconnue du nom hébreu.
- source_word: יֹשֵׁב
  choice: siégeait
  rationale: Le participe qal décrit une situation durable. Dans le contexte de la porte royale, « siégeait » conserve cette valeur tout en pouvant évoquer, sans l’imposer, une présence liée aux affaires officielles.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: à la porte du roi
  rationale: La préposition situe Mardochée dans l’espace de la porte du complexe royal. « À la porte du roi » est naturel et laisse la note préciser la portée institutionnelle possible du lieu.
