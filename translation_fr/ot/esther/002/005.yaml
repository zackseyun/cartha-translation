base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: fr
  text: Il y avait à Suse-la-citadelle[a] un homme juif[b] nommé Mardochée, fils de Jaïr, fils de Shimeï, fils de Qish[c], de la tribu de Benjamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la citadelle de Suse ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un homme judéen ».'
    reason: lexical_alternative
  - marker: c
    text: Dans les généalogies, le mot hébreu traduit par « fils de » peut aussi désigner un descendant plus éloigné.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: un homme juif
  rationale: יְהוּדִי peut désigner un Juif par son appartenance au peuple ou un Judéen par son origine. Dans le contexte diasporique du livre d’Esther, « homme juif » exprime naturellement l’identité collective sans suggérer qu’il réside en Juda.
- source_word: הָיָה
  choice: Il y avait
  rationale: La tournure existentielle introduit un nouveau personnage et correspond naturellement à l’emploi narratif de הָיָה.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: à Suse, la citadelle
  rationale: Cette formulation conserve l’apposition hébraïque entre le nom de lieu et הַבִּירָה, terme désignant ici la ville fortifiée ou le complexe royal fortifié. Une note signale l’autre analyse syntaxique possible.
- source_word: וּשְׁמוֹ
  choice: nommé
  rationale: Le français narratif « nommé » rend avec naturel l’expression littérale « et son nom était », sans perte de contenu.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et toujours courante du nom biblique.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: fils de Yaïr, fils de Shimeï, fils de Qish
  rationale: La répétition de « fils de » reproduit la structure généalogique. בֶּן peut toutefois indiquer une ascendance plus éloignée, ce que précise la note.
- source_word: אִישׁ יְמִינִי
  choice: de la tribu de Benjamin
  rationale: La locution indique l’appartenance tribale de manière claire et actuelle en français; elle évite le rare « Benjaminite » tout en conservant exactement le sens.
