  text: וַ/תִּלָּקַ֨ח אֶסְתֵּ֜ר אֶל הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרוֹשׁ֙ אֶל בֵּ֣ית מַלְכוּת֔/וֹ בַּ/חֹ֥דֶשׁ הָ/עֲשִׂירִ֖י הוּא חֹ֣דֶשׁ טֵבֵ֑ת בִּ/שְׁנַת שֶׁ֖בַע לְ/מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: fr
  text: Esther fut conduite auprès du roi Assuérus[a], dans son palais royal, au dixième mois, qui est le mois de Tébeth[b], la septième année de son règne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut emmenée auprès du roi Assuérus ». Le verbe hébreu est au passif et souligne qu’Esther subit l’action.
    reason: lexical_alternative
  - marker: b
    text: En hébreu, « le mois de Tébeth », nom babylonien du dixième mois.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: fut donc conduite
  rationale: 'Le nifal exprime ici le passif : Esther subit l’action plutôt qu’elle ne la prend elle-même. « Fut conduite » est naturel en français et conserve cette perspective; « donc » marque la progression narrative du wayyiqtol.'
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: auprès du roi Assuérus
  rationale: אֶל indique le mouvement vers le roi. « Auprès du roi » convient naturellement à une présentation à la cour, sans ajouter l’idée plus précise d’une audience formelle.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: dans son palais royal
  rationale: Littéralement « vers/dans la maison de sa royauté ». Dans ce contexte, l’expression désigne la résidence royale; « palais royal » est clair et idiomatique, et « dans » rend l’entrée dans le lieu.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: au dixième mois
  rationale: Rendu temporel direct et idiomatique de l’expression hébraïque.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: qui est le mois de Tébeth
  rationale: Conserve la tournure explicative qui associe le numéro du mois à son nom.
- source_word: טֵבֵת
  choice: Tébeth
  rationale: Translittération française traditionnelle et intelligible du nom hébreu du mois.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: la septième année de son règne
  rationale: Formule française naturelle pour dater un événement selon les années de règne d’un souverain.
theological_decisions: []
