source:
  edition: WLC
  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: fr
  text: Après ces événements, lorsque la colère du roi Assuérus se fut apaisée, il se souvint de Vashti, de ce qu’elle avait fait et de ce qui avait été décrété contre elle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Après ces événements
  rationale: Cette formule temporelle introduit la scène suivante. « Après ces événements » restitue naturellement le sens de l’expression hébraïque en français moderne.
- source_word: כְּשֹׁךְ
  choice: lorsque ... se fut apaisée
  rationale: L’infinitif construit de שכך exprime l’apaisement ou la diminution. Le passé antérieur marque naturellement l’antériorité par rapport au souvenir du roi.
- source_word: חֲמַת
  choice: la colère
  rationale: חֵמָה désigne une vive colère. « Colère » est clair et digne sans donner au récit une tonalité artificiellement archaïque.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: le roi Assuérus
  rationale: Cette construction est idiomatique en français et conserve à la fois le titre royal et la forme française traditionnelle du nom.
- source_word: זָכַר
  choice: il se souvint
  rationale: Le verbe signifie se souvenir ou rappeler à sa mémoire. Le passé simple convient au déroulement narratif.
- source_word: אֶת וַשְׁתִּי
  choice: de Vashti
  rationale: Après « se souvenir », le français exige la préposition « de » ; le marqueur hébreu de l’objet direct n’est pas traduit.
- source_word: וְאֵת אֲשֶׁר עָשָׂתָה
  choice: de ce qu’elle avait fait
  rationale: La relative est rendue naturellement, et le plus-que-parfait situe l’acte avant le moment où le roi s’en souvient.
- source_word: וְאֵת אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: de ce qui avait été décrété contre elle
  rationale: Le passif נִגְזַר évoque une décision officielle. « Décrété contre elle » conserve la force juridique et la portée défavorable de עָלֶיהָ.
