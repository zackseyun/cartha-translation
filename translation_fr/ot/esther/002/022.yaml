base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: fr
  text: L’affaire parvint à la connaissance de Mardochée[a]. Il en informa la reine Esther[b], et Esther en informa le roi au nom de Mardochée[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut portée à la connaissance de Mardochée ». La forme passive hébraïque peut souligner soit que Mardochée apprit l’affaire, soit que quelqu’un la lui fit connaître.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Esther, la reine ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de la part de Mardochée ». L’expression indique qu’Esther présenta le renseignement comme venant de Mardochée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: parvint à la connaissance
  rationale: Le nifal de ידע présente l’information comme devenant connue de Mardochée sans préciser qui la lui communiqua. Cette tournure française conserve ce caractère passif ou inchoatif.
- source_word: הַדָּבָר
  choice: l’affaire
  rationale: דבר désigne ici ce qui vient d’être révélé, c’est-à-dire le complot contre le roi. « L’affaire » reste assez général tout en étant naturel dans ce contexte.
- source_word: וַיַּגֵּד
  choice: il en informa
  rationale: Le hifil de נגד signifie annoncer, raconter ou rapporter. « En informa » exprime clairement que Mardochée transmet à Esther ce qu’il a appris.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: la reine Esther
  rationale: L’hébreu dit littéralement « Esther, la reine ». L’ordre « la reine Esther » est idiomatique en français moderne et conserve son titre.
- source_word: וַתֹּאמֶר
  choice: Esther en informa
  rationale: אמר signifie couramment « dire ». Dans ce contexte de transmission d’un renseignement, « en informa » est naturel et rend explicitement l’objet déjà mentionné sans ajouter de contenu.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: au nom de Mardochée
  rationale: La locution בשם signifie littéralement « au nom de ». Ici, elle indique qu’Esther attribue à Mardochée l’origine du renseignement, sans qu’il soit nécessaire de préciser davantage la nature de cette représentation.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation conserve l’absence d’agent dans la première proposition et maintient l’attribution explicite du rapport à Mardochée.
