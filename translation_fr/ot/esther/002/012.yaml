revisions:
- from: 'Quand venait le tour de chaque jeune femme d’aller auprès du roi Assuérus, après avoir suivi pendant douze mois le traitement prescrit aux femmes — car c’est ainsi que s’accomplissait la durée de leurs soins de beauté : six mois avec de l’huile de myrrhe, puis six mois avec des parfums et des produits de beauté pour femmes —'
  to: 'Quand venait le tour de chaque jeune femme d’aller auprès du roi Assuérus, après avoir été soumise pendant douze mois au règlement applicable aux femmes — car c’est ainsi que s’achevaient les jours de leurs soins de beauté : six mois avec de l’huile de myrrhe, puis six mois avec des parfums et des produits de beauté pour femmes —'
  rationale: Révision limitée afin de distinguer clairement la règle prescrite (דָּת) des soins qu’elle encadre et de rendre plus directement l’achèvement des « jours » de soins. La retenue de « aller auprès du roi » et la phrase suspendue en fin de verset sont préservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:54Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : le tour assigné à chaque jeune femme, son entrée auprès du roi, les douze mois prescrits et la répartition en deux périodes de six mois sont tous conservés. Toutefois, « le traitement prescrit aux femmes » tend à identifier la « règle/ordonnance » (דָּת) aux soins eux-mêmes, alors que le texte présente cette règle comme le cadre auquel la jeune femme était soumise. « La durée ... s’accomplissait » est aussi moins direct que l’hébreu, qui dit que les jours de leurs soins arrivaient à leur terme.'
  naturalness: Le français est globalement sobre et lisible. « Après avoir été soumise pendant douze mois au règlement applicable aux femmes » rend plus naturellement la construction et sa relation au contexte. « Les jours de leurs soins de beauté s’achevaient » est idiomatique tout en respectant l’expression temporelle hébraïque.
  terminology: « Assuérus », « huile de myrrhe », « parfums » et « produits de beauté pour femmes » conviennent au français biblique moderne. « Règlement applicable aux femmes » conserve la portée normative de דָּת sans imposer une interprétation plus précise. Aucun nom ni terme théologique ne requiert de note.
  issues:
  - severity: low
    issue: « traitement prescrit aux femmes » pour כְּדָת הַנָּשִׁים
    rationale: דָּת désigne d’abord une loi, règle ou ordonnance. Dans le verset, les soins détaillés sont ce qui se déroule selon cette règle, plutôt que le sens lexical premier de דָּת lui-même.
  - severity: low
    issue: « s’accomplissait la durée de leurs soins de beauté »
    rationale: La tournure est un peu lourde et transforme les « jours » explicitement mentionnés en une abstraction. Une formulation avec « les jours ... s’achevaient » est à la fois plus naturelle et plus proche du texte source.
  revised_text: 'Quand venait le tour de chaque jeune femme d’aller auprès du roi Assuérus, après avoir été soumise pendant douze mois au règlement applicable aux femmes — car c’est ainsi que s’achevaient les jours de leurs soins de beauté : six mois avec de l’huile de myrrhe, puis six mois avec des parfums et des produits de beauté pour femmes —'
  revised_footnotes: []
  revision_rationale: Révision limitée afin de distinguer clairement la règle prescrite (דָּת) des soins qu’elle encadre et de rendre plus directement l’achèvement des « jours » de soins. La retenue de « aller auprès du roi » et la phrase suspendue en fin de verset sont préservées.
