  text: וּ/בְ/הַגִּ֡יעַ תֹּר֩ נַעֲרָ֨ה וְ/נַעֲרָ֜ה לָ/ב֣וֹא אֶל הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֗וֹשׁ מִ/קֵּץ֩ הֱי֨וֹת לָ֜/הּ כְּ/דָ֤ת הַ/נָּשִׁים֙ שְׁנֵ֣ים עָשָׂ֣ר חֹ֔דֶשׁ כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י מְרוּקֵי/הֶ֑ן שִׁשָּׁ֤ה חֳדָשִׁים֙ בְּ/שֶׁ֣מֶן הַ/מֹּ֔ר וְ/שִׁשָּׁ֤ה חֳדָשִׁים֙ בַּ/בְּשָׂמִ֔ים וּ/בְ/תַמְרוּקֵ֖י הַ/נָּשִֽׁים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: fr
  text: 'Quand venait le tour de chaque jeune femme d’aller auprès du roi Assuérus, après avoir été soumise pendant douze mois au règlement applicable aux femmes — car c’est ainsi que s’achevaient les jours de leurs soins de beauté : six mois avec de l’huile de myrrhe, puis six mois avec des parfums et des produits de beauté pour femmes —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר
  choice: le tour
  rationale: Rend directement l’idée du moment assigné à chacune dans une succession.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: d’aller auprès du roi
  rationale: Expression française naturelle qui préserve le mouvement vers le roi sans expliciter davantage la nature de la rencontre.
- source_word: כְּדָת הַנָּשִׁים
  choice: le traitement prescrit aux femmes
  rationale: דָּת désigne ici une règle ou prescription; dans ce contexte, elle organise la période de préparation cosmétique.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: la durée de leurs soins de beauté
  rationale: Le pluriel «jours» exprime la durée; מְרוּקִים renvoie aux soins de purification ou d’embellissement, ici précisés par les huiles, parfums et produits.
- source_word: שֶׁמֶן הַמֹּר
  choice: de l’huile de myrrhe
  rationale: Équivalent lexical direct et usuel.
- source_word: בְּשָׂמִים
  choice: des parfums
  rationale: Terme courant pour des substances aromatiques; le contexte cosmétique favorise «parfums» plutôt que «épices».
- source_word: תַמְרוּקֵי הַנָּשִׁים
  choice: des produits de beauté pour femmes
  rationale: Rend concrètement des préparations ou cosmétiques destinés aux femmes, sans réduire le terme à un produit moderne précis.
theological_decisions:
- issue: Sens de «venir/entrer auprès du roi»
  choice: d’aller auprès du roi
  alternative: d’entrer chez le roi
  rationale: La formulation retenue conserve la retenue du texte hébreu et n’ajoute aucune explicitation sexuelle, tout en restant intelligible dans le contexte narratif.
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase demeure suspendue par un tiret final, conformément à la syntaxe du verset, qui se poursuit au verset suivant. «Assuérus» est la forme française biblique courante du nom royal.
