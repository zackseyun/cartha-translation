    rationale: Le texte hébreu dit simplement qu’Esther « fut prise/emménée » après avoir évoqué le rassemblement de nombreuses jeunes femmes. Le contexte peut suggérer qu’elle fait partie de ce groupe, mais le mot « aussi » n’est pas exprimé. Le supprimer préserve plus exactement la sobriété du texte source.
