base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: fr
  text: Lorsque l’ordre du roi et son décret furent connus, et que de nombreuses jeunes femmes furent rassemblées à Suse, la citadelle, sous la responsabilité de Hégaï[a], Esther fut emmenée dans la maison du roi[b] et confiée à Hégaï, le gardien des femmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à la main de Hégaï » ; autre traduction possible : « sous la garde de Hégaï ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans le palais royal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: ordre
  rationale: Dans son association avec le décret royal, le terme désigne ici une directive officielle; « ordre » est naturel et précis en français.
- source_word: דָת
  choice: décret
  rationale: Dans le contexte de la cour perse, le mot renvoie à une décision officielle promulguée par le roi.
- source_word: נְעָרוֹת רַבּוֹת
  choice: de nombreuses jeunes femmes
  rationale: Cette formulation exprime leur jeune âge sans employer « jeunes filles », qui pourrait suggérer un âge trop bas, ni introduire ici la notion de virginité.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Suse, la citadelle
  rationale: « Citadelle » désigne adéquatement le complexe royal fortifié et conserve la construction appositive de l’hébreu.
- source_word: אֶל יַד
  choice: sous la responsabilité de / confiée à
  rationale: L’expression signifie littéralement « à la main de » et indique l’autorité ou la garde exercée par Hégaï; la variation évite une répétition lourde en français.
- source_word: וַתִּלָּקַח
  choice: fut emmenée
  rationale: Le passif maintient l’absence d’initiative d’Esther et une possible contrainte sans renforcer celle-ci jusqu’à « fut saisie ».
- source_word: בֵּית הַמֶּלֶךְ
  choice: la maison du roi
  rationale: Le rendu reste proche de l’hébreu tout en pouvant désigner, dans ce contexte, le palais ou l’ensemble résidentiel royal.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: le gardien des femmes
  rationale: Le participe désigne celui qui garde les femmes ou en a la charge; « gardien » conserve cette dimension d’autorité sans la présenter comme nécessairement bienveillante.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: Lorsque… furent connus, et que… furent rassemblées
  rationale: La construction temporelle coordonnée reproduit le déroulement narratif, tandis que « furent connus » rend idiomatiquement le fait que l’ordre et le décret ont été entendus ou rendus publics.
