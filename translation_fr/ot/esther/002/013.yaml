  naturalness: Français moderne, clair et narratif. « Et voici comment » introduit très naturellement la procédure; « jeune femme », « auprès du roi » et les imparfaits conviennent au registre. La phrase est fluide sans effacer les repères spatiaux du texte.
  terminology: Les choix « maison des femmes » et « maison du roi » conservent volontairement la formulation hébraïque sans imposer le terme interprétatif « harem » ou « palais ». La note culturelle explique sobrement le premier syntagme. Aucun terme théologique ou nom propre ne demande d’ajustement.
