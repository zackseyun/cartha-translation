  text: וּ/בָ/זֶ֕ה הַֽ/נַּעֲרָ֖ה בָּאָ֣ה אֶל הַ/מֶּ֑לֶךְ אֵת֩ כָּל אֲשֶׁ֨ר תֹּאמַ֜ר יִנָּ֤תֵֽן לָ/הּ֙ לָ/ב֣וֹא עִמָּ֔/הּ מִ/בֵּ֥ית הַ/נָּשִׁ֖ים עַד בֵּ֥ית הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: fr
  text: 'Et voici comment la jeune femme se rendait auprès du roi : tout ce qu’elle demandait[a] lui était donné pour qu’elle l’emporte avec elle de la maison des femmes[b] jusqu’à la maison du roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qu’elle disait »; dans ce contexte, il s’agit de tout ce qu’elle demandait à emporter.'
    reason: lexical_alternative
  - marker: b
    text: La « maison des femmes » désigne les appartements réservés aux femmes.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָזֶה
  choice: Et voici comment
  rationale: L’expression introduit la procédure qui vient d’être décrite. « Et voici comment » rend naturellement cette transition en français.
- source_word: הַנַּעֲרָה
  choice: la jeune femme
  rationale: נַעֲרָה désigne ici une jeune personne de sexe féminin. « Jeune femme » est moderne et digne, sans la nuance potentiellement trop enfantine de « jeune fille ».
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: se rendait auprès du roi
  rationale: Le verbe בוא avec אֶל indique qu’elle allait vers le roi. L’imparfait français exprime ici la procédure habituelle décrite dans le récit.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: tout ce qu’elle demandait
  rationale: Littéralement, l’hébreu dit « tout ce qu’elle disait », mais le contexte indique ce qu’elle demandait à emporter. Une note conserve la formulation littérale.
- source_word: יִנָּתֵן לָהּ
  choice: lui était donné
  rationale: Le niphal de נתן est passif. Dans cette description procédurale, l’imparfait français rend la valeur habituelle de l’inaccompli hébreu.
- source_word: לָבוֹא עִמָּהּ
  choice: pour qu’elle l’emporte avec elle
  rationale: L’infinitif de בוא accompagné de עִם exprime que les objets accordés allaient avec elle. Cette formulation explicite naturellement en français le complément sous-entendu.
- source_word: מִבֵּית הַנָּשִׁים
  choice: de la maison des femmes
  rationale: Cette traduction formelle préserve l’expression hébraïque sans introduire le terme culturellement chargé « harem »; une note en précise le référent.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: jusqu’à la maison du roi
  rationale: עַד exprime la limite du trajet, et בֵּית הַמֶּלֶךְ signifie littéralement « maison du roi ». Cette formulation conserve les deux éléments de l’hébreu.
