source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: fr
  text: Le soir, elle entrait auprès du roi[a], et le matin, elle retournait dans la seconde maison des femmes[b], sous la responsabilité de Shaashgaz, l’eunuque du roi chargé de garder les concubines. Elle ne retournait plus auprès du roi, à moins que le roi ne prenne plaisir à elle et qu’elle ne soit appelée par son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Entrer auprès du roi » est une expression qui désigne l’entrée dans ses appartements ou en sa présence; dans ce contexte, elle implique une relation sexuelle sans l’énoncer explicitement.
    reason: cultural_note
  - marker: b
    text: Ou, de manière plus interprétative, « le second harem ». L’hébreu dit littéralement « la seconde maison des femmes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֶרֶב הִיא בָאָה
  choice: Le soir, elle entrait auprès du roi
  rationale: Le verbe בוא signifie littéralement « venir/entrer ». Le complément « auprès du roi », repris explicitement dans la suite du verset, est fourni pour rendre le mouvement compréhensible en français tout en maintenant l’implicite de l’hébreu.
- source_word: וּבַבֹּקֶר הִיא שָׁבָה
  choice: et le matin, elle retournait
  rationale: L’imparfait français exprime naturellement la procédure habituelle décrite dans ce passage; la conjonction simple est conservée sans ajouter de contraste.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: la seconde maison des femmes
  rationale: Cette formulation proche de l’hébreu préserve la distinction avec les premiers appartements des femmes sans imposer « harem » dans le texte principal.
- source_word: אֶל יַד שַׁעֲשְׁגַז
  choice: sous la responsabilité de Shaashgaz
  rationale: L’expression idiomatique « à la main de » indique ici la garde ou l’autorité administrative d’une personne.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: l’eunuque du roi
  rationale: Dans ce contexte de cour et de surveillance des femmes, « eunuque » est le sens spécifique le plus probable de סריס.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: chargé de garder les concubines
  rationale: Le participe שֹׁמֵר désigne celui qui garde ou a la charge de quelqu’un; cette tournure est naturelle en français moderne.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: Elle ne retournait plus auprès du roi
  rationale: La formulation rend le sens de nouvelle entrée en présence du roi et עוֹד (« encore/de nouveau »), sans expliciter davantage la dimension sexuelle implicite.
- source_word: כִּי אִם
  choice: à moins que
  rationale: Cette locution introduit l’unique exception à la règle énoncée.
- source_word: חָפֵץ בָּהּ
  choice: le roi ne prenne plaisir en elle
  rationale: חפץ ב exprime le plaisir, l’agrément ou le désir. La formulation retenue conserve cette amplitude et la tension du contexte sans réduire le sens au seul désir sexuel.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: et qu’elle ne soit appelée par son nom
  rationale: La tournure passive et la mention explicite du nom sont conservées.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait présente la procédure répétée applicable à chaque jeune femme. Les formulations littérales porteuses d’ambiguïté sont maintenues lorsque le français reste intelligible.
