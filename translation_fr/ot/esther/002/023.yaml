base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: fr
  text: Après enquête, l’affaire fut confirmée. Les deux hommes furent pendus à un arbre[a], et cela fut consigné dans le livre des annales en présence du roi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « sur un arbre ». Le terme hébreu peut aussi désigner du bois ou une structure en bois. Il peut donc s’agir d’une pendaison, d’une suspension publique ou d’un empalement; l’hébreu ne précise pas la méthode exacte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר וַיִּמָּצֵא
  choice: Après enquête, l’affaire fut confirmée
  rationale: La tournure rend le passif de בקש comme une enquête officielle et וַיִּמָּצֵא comme la confirmation du complot signalé, dans un français naturel sans ajouter que l’accusation était vraie.
- source_word: וַיִּתָּלוּ שְׁנֵיהֶם
  choice: Tous les deux furent pendus
  rationale: תלה indique qu’on suspend ou pend quelqu’un, sans préciser à lui seul la méthode perse exacte; שְׁנֵיהֶם souligne que les deux conspirateurs subirent le même sort.
- source_word: עַל עֵץ
  choice: à un poteau
  rationale: עֵץ peut désigner un arbre, du bois ou une structure en bois. Dans ce contexte d’exécution perse, « poteau » est naturel en français tout en laissant en note l’alternative plus littérale.
- source_word: וַיִּכָּתֵב
  choice: cela fut consigné
  rationale: Le passif de כתב signifie que l’événement fut mis par écrit; « consigné » convient au contexte d’un registre officiel.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: dans le livre des annales
  rationale: L’expression désigne le registre chronologique officiel de la cour; « livre des annales » est clair, digne et proche de la forme hébraïque.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: en présence du roi
  rationale: Cette formulation conserve le sens spatial et officiel de לִפְנֵי sans décider si le roi observait directement la rédaction ou en supervisait formellement l’enregistrement.
