base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: fr
  text: 'Puis le roi donna un grand banquet à tous ses hauts fonctionnaires et à ses serviteurs : le banquet d’Esther. Il accorda un allègement aux provinces[a] et distribua des présents selon la générosité du roi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accorda du repos aux provinces », « décréta un jour de fête pour les provinces » ou « accorda une remise aux provinces ». Le terme hébreu peut désigner le repos, un soulagement ou une remise.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon la main du roi », expression qui évoque une générosité ou une mesure correspondant aux moyens d’un roi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: un grand banquet
  rationale: מִשְׁתֶּה désigne un festin, souvent associé à la boisson; « banquet » convient au cadre royal, et גָדוֹל signifie « grand ».
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: à tous ses hauts fonctionnaires et à ses serviteurs
  rationale: Dans le contexte de la cour perse, שָׂרִים désigne les dignitaires ou hauts responsables; עֲבָדִים garde ici son sens large de serviteurs du roi.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: le banquet d’Esther
  rationale: Cette construction rattache le banquet à Esther sans préciser davantage s’il était donné en son honneur ou seulement associé à elle.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: Il accorda un allègement aux provinces
  rationale: הֲנָחָה peut exprimer le repos, le soulagement ou une remise. « Allègement » préserve cette latitude, notamment la possibilité d’une remise fiscale, sans l’imposer.
- source_word: מַשְׂאֵת
  choice: des présents
  rationale: Dans ce cadre, le mot désigne vraisemblablement des dons ou largesses distribués par le roi; « présents » convient au registre de cour.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: avec une générosité digne d’un roi
  rationale: Littéralement « selon la main du roi »; l’expression évoque une mesure correspondant aux moyens ou à la munificence royale.
- source_word: וַיַּעַשׂ
  choice: donna
  rationale: Bien que le verbe signifie littéralement « faire », « donner un banquet » est une tournure française naturelle pour l’organisation d’un tel événement.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation en deux phrases allège la longue coordination hébraïque. « Hauts fonctionnaires » explicite le cadre administratif royal sans introduire un titre technique incertain; les notes conservent les ambiguïtés de הֲנָחָה et de l’idiome כְּיַד הַמֶּלֶךְ.
