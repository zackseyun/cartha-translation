source:
  edition: WLC
  text: לֹא הִגִּ֣ידָה אֶסְתֵּ֔ר אֶת עַמָּ֖/הּ וְ/אֶת מֽוֹלַדְתָּ֑/הּ כִּ֧י מָרְדֳּכַ֛י צִוָּ֥ה עָלֶ֖י/הָ אֲשֶׁ֥ר לֹא תַגִּֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: fr
  text: Esther n’avait révélé ni son peuple ni ses origines[a], car Mardochée lui avait ordonné de ne pas les révéler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa parenté » ou « son ascendance ». Le terme hébreu peut désigner les liens familiaux, la lignée ou le lieu d’origine ; ici, il renvoie vraisemblablement aux origines familiales d’Esther.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: n’avait révélé
  rationale: Le hifil de נגד signifie « faire connaître, déclarer ». « Révéler » convient au contexte où Esther garde son identité secrète. Le plus-que-parfait exprime naturellement l’arrière-plan narratif.
- source_word: עַמָּהּ
  choice: son peuple
  rationale: עַם désigne ici le groupe ethnique ou national auquel Esther appartient. « Son peuple » conserve cette portée collective sans la réduire à la citoyenneté.
- source_word: מוֹלַדְתָּהּ
  choice: ses origines
  rationale: מוֹלֶדֶת peut désigner la parenté, l’ascendance ou le lieu d’origine. Associé à « son peuple », « ses origines » rend naturellement en français la provenance familiale d’Esther tout en préservant l’étendue sémantique du terme.
- source_word: צִוָּה עָלֶיהָ
  choice: lui avait ordonné
  rationale: צוה exprime un ordre, et non un simple conseil. La construction avec על est rendue idiomatiquement par le complément indirect « lui ».
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: de ne pas les révéler
  rationale: La proposition indique le contenu de l’ordre de Mardochée. Le pronom pluriel « les » reprend naturellement les deux éléments coordonnés, « son peuple » et « ses origines », tandis que la répétition de « révéler » fait écho au même verbe hébreu.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: מָרְדֳּכַי
  choice: Mardochée
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La construction « ni… ni… » rend clairement la double négation implicite avec les deux compléments. « Ses origines » est plus idiomatique que « sa lignée familiale » et maintient l’ambiguïté lexicale grâce à la note.
