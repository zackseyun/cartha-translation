source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: fr
  text: 'Tous les serviteurs du roi et les habitants des provinces royales savent que tout homme ou toute femme qui se présente devant le roi dans la cour intérieure sans avoir été convoqué[a] est soumis à une seule loi : la mise à mort, sauf la personne à qui le roi tend le sceptre d’or, et qui vivra. Quant à moi, voilà trente jours que je n’ai pas été convoquée pour me présenter devant le roi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans avoir été appelé ». Le verbe hébreu au passif peut se traduire plus littéralement ainsi, mais « convoqué » exprime mieux le protocole officiel de la cour.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: les serviteurs du roi
  rationale: Le terme désigne largement ceux qui sont au service du roi dans le contexte de la cour perse; « serviteurs » conserve cette ampleur sans imposer le statut d’esclaves.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: et les habitants des provinces royales
  rationale: עַם renvoie ici à la population de l’empire au-delà du personnel de cour; « habitants » est naturel en français et « provinces royales » exprime leur appartenance au royaume.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: tout homme ou toute femme
  rationale: Cette formulation garde la mention explicite des deux sexes et la portée distributive de l’hébreu.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: se présente devant le roi, dans la cour intérieure
  rationale: Le mouvement décrit est une approche du roi dans l’espace réservé de la cour intérieure; la formulation française rend clairement les deux éléments.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: sans avoir été convoqué
  rationale: Le passif de קרא désigne ici une convocation officielle à la présence royale; « convoqué » convient au protocole de cour.
- source_word: אַחַת דָּתוֹ לְהָמִית
  choice: 'tombe sous une seule loi : la mise à mort'
  rationale: La traduction conserve l’expression hébraïque « une seule loi » tout en explicitant naturellement en français son unique sanction légale.
- source_word: לְבַד מֵאֲשֶׁר
  choice: La seule exception est la personne à qui
  rationale: Cette tournure marque nettement l’exclusivité de l’exception sans alourdir la syntaxe.
- source_word: יוֹשִׁיט לוֹ
  choice: tend
  rationale: Le verbe décrit le geste concret par lequel le roi étend son sceptre vers la personne; « tend » est précis et idiomatique.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: le sceptre d’or
  rationale: Expression française courante et digne pour l’emblème de la faveur royale.
- source_word: וְחָיָה
  choice: elle aura la vie
  rationale: Cette formulation conserve le résultat direct du geste royal et s’accorde naturellement avec l’antécédent épicène « la personne ».
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: voilà trente jours que
  rationale: Tournure française naturelle exprimant la durée écoulée jusqu’au moment où Esther parle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation maintient la solennité du protocole royal et la structure juridique de l’avertissement, tout en évitant une syntaxe trop calquée sur l’hébreu. Le féminin « convoquée » dans la dernière phrase reflète Esther comme locutrice.
