revisions:
- from: Mardochée lui raconta tout ce qui lui était arrivé, ainsi que le montant précis de la somme d’argent[a] qu’Haman avait dit qu’il verserait dans les trésors du roi afin de faire disparaître les Juifs.
  to: Mardochée lui raconta tout ce qui lui était arrivé, ainsi que la somme précise d’argent[a] qu’Haman avait dit qu’il pèserait pour les trésors du roi, en vue d’exterminer les Juifs.
  rationale: La révision restitue l’image du paiement pesé, maintient le pluriel « trésors » et rend sans euphémisme la finalité destructrice du projet. La note conserve les principales possibilités lexicales de פָּרָשַׁת הַכֶּסֶף.
