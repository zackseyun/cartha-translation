  text: וַ/יַּגֶּד ל֣/וֹ מָרְדֳּכַ֔י אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וְ/אֵ֣ת פָּרָשַׁ֣ת הַ/כֶּ֗סֶף אֲשֶׁ֨ר אָמַ֤ר הָמָן֙ לִ֠/שְׁקוֹל עַל גִּנְזֵ֥י הַ/מֶּ֛לֶךְ ב/יהודיים לְ/אַבְּדָֽ/ם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: fr
  text: Mardochée lui raconta tout ce qui lui était arrivé, ainsi que la somme précise d’argent[a] qu’Haman avait dit qu’il pèserait pour les trésors du roi, en vue d’exterminer les Juifs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le relevé détaillé de l’argent » ou « la somme d’argent ». L’expression hébraïque désigne la somme déterminée qu’Haman proposait de verser.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד
  choice: raconta
  rationale: Le hiphil de נגד signifie « faire connaître, raconter ». « Raconta » convient naturellement au récit transmis à Hathak.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: tout ce qui lui était arrivé
  rationale: Cette formulation rend explicitement le suffixe pronominal de קָרָהוּ et respecte l’antériorité des événements dans le récit.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: le montant précis de la somme d’argent
  rationale: פָּרָשָׁה peut désigner une indication détaillée, une spécification ou une somme déterminée. Dans ce contexte financier, la formulation retenue exprime clairement la somme précise proposée par Haman tout en signalant en note les autres analyses possibles.
- source_word: אָמַר ... לִשְׁקוֹל
  choice: avait dit qu’il verserait
  rationale: L’hébreu dit littéralement qu’Haman « avait dit de peser ». En français courant, « avait dit qu’il verserait » conserve l’idée d’une déclaration au sujet du paiement sans produire une tournure artificielle.
- source_word: לִשְׁקוֹל
  choice: verserait
  rationale: L’argent se mesurait au poids, mais le verbe désigne ici concrètement le paiement destiné aux trésors royaux. « Verser » communique naturellement cette fonction en français moderne.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: dans les trésors du roi
  rationale: Le pluriel גִּנְזֵי est conservé, et « dans » exprime la destination du versement au sein des réserves royales.
- source_word: ביהודיים לְאַבְּדָם
  choice: afin de faire disparaître les Juifs
  rationale: Le piel de אבד exprime ici la destruction des Juifs. « Faire disparaître » rend la visée meurtrière dans une langue naturelle et reprend le vocabulaire du décret dans son contexte narratif.
