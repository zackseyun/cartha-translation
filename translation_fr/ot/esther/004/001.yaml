base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: fr
  text: Quand Mardochée apprit tout ce qui avait été fait, il déchira ses vêtements, se revêtit d’un sac et de cendre. Puis il sortit au milieu de la ville et poussa un grand cri amer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cria un grand cri amer ». L’hébreu emploie un verbe et un nom de même racine pour renforcer l’expression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַע
  choice: apprit
  rationale: Dans ce contexte narratif, le verbe indique que Mardochée prend connaissance de ce qui a été fait. « Apprit » exprime naturellement cette nuance en français.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: tout ce qui avait été fait
  rationale: Cette formulation conserve le passif hébreu et l’antériorité de l’action dans le récit.
- source_word: וַיִּקְרַע ... אֶת בְּגָדָיו
  choice: il déchira ses vêtements
  rationale: Traduction directe et actuelle du geste traditionnel de deuil.
- source_word: שַׂק וָאֵפֶר
  choice: revêtit une toile de sac et se couvrit de cendre
  rationale: « Toile de sac » désigne clairement l’étoffe grossière portée en signe de deuil. La coordination hébraïque est rendue par deux verbes naturels en français, sans perdre les deux signes de deuil.
- source_word: בְּתוֹךְ הָעִיר
  choice: au milieu de la ville
  rationale: La traduction conserve la valeur spatiale de בְּתוֹךְ sans préciser de façon interprétative qu’il s’agirait du centre-ville.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: poussa un grand cri amer
  rationale: Cette expression française naturelle conserve l’intensité de la construction hébraïque avec verbe et nom apparentés, ainsi que les qualificatifs « grand » et « amer ».
- source_word: וַ
  choice: Puis
  rationale: Dans la chaîne narrative, « Puis » marque naturellement la progression vers l’action suivante.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La répétition hébraïque du nom de Mardochée n’est pas reproduite, car le pronom maintient sans ambiguïté le même sujet et évite une lourdeur en français. Le marqueur de note est placé après l’expression qu’il explique.
