  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: fr
  text: Alors Esther parla à Hathac et lui ordonna de se rendre auprès de Mardochée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu dit : « Alors Esther dit à Hathac et lui ordonna vers Mardochée. » La construction est elliptique : elle implique qu’Esther chargea Hathac de se rendre auprès de Mardochée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors Esther parla
  rationale: Le waw consécutif fait progresser le récit, rendu ici par « Alors ». Le verbe אמר signifie couramment « dire », mais « parler à » convient naturellement devant le complément introduit par ל.
- source_word: לַהֲתָךְ
  choice: à Hatak
  rationale: La préposition ל introduit le destinataire des paroles d’Esther. Le nom propre est transcrit selon une forme française usuelle.
- source_word: וַתְּצַוֵּהוּ
  choice: et lui ordonna
  rationale: Le piel de צוה exprime un ordre ou une instruction ferme. Le pronom suffixe renvoie à Hatak.
- source_word: אֶל
  choice: de se rendre auprès de
  rationale: La préposition marque la direction vers Mardochée. Après « ordonna », l’ajout contextuel « de se rendre » produit un français idiomatique tout en explicitant le déplacement sous-entendu.
- source_word: מָרְדֳּכָי
  choice: Mardochée
  rationale: Forme française traditionnelle et largement reconnue de ce nom propre.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Se rendre auprès de » explicite sobrement le mouvement sous-entendu par l’hébreu sans ajouter le contenu du message.
