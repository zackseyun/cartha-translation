  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: fr
  text: Mardochée partit donc et fit tout ce qu’Esther lui avait ordonné.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « poursuivit son chemin » ou « passa ». Le verbe hébreu signifie littéralement « passer, traverser », mais il désigne probablement ici le départ de Mardochée pour exécuter les instructions d’Esther.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: partit
  rationale: Le verbe עבר signifie littéralement « passer, traverser », mais, dans ce contexte narratif, il indique vraisemblablement que Mardochée s’en va afin d’exécuter les instructions d’Esther. « Partit » est naturel en français et évite de suggérer un franchissement précis absent du contexte.
- source_word: וַיַּעַשׂ
  choice: fit
  rationale: Le verbe courant עשה signifie « faire ». « Fit » conserve la simplicité du récit et s’emploie naturellement avec « tout ce que ».
- source_word: כְּכֹל אֲשֶׁר
  choice: tout ce que
  rationale: La construction exprime à la fois la totalité et la conformité aux instructions. En français, « fit tout ce que » rend naturellement ces deux aspects sans alourdir la phrase.
- source_word: צִוְּתָה
  choice: avait ordonné
  rationale: צוה signifie « commander, ordonner ». Le plus-que-parfait situe clairement l’ordre d’Esther avant son exécution par Mardochée. « Ordonner » convient au contexte d’une instruction impérative.
- source_word: עָלָיו
  choice: lui
  rationale: Avec צוה, la préposition על désigne ici la personne à qui l’ordre est donné. Le pronom indirect « lui » est l’équivalent idiomatique en français dans la construction « ordonner quelque chose à quelqu’un ».
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
