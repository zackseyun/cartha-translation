  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: fr
  text: Car si tu gardes le silence en ce temps-ci, le soulagement et la délivrance se lèveront d’un autre lieu pour les Juifs, mais toi et la maison de ton père, vous périrez. Et qui sait si ce n’est pas pour un temps comme celui-ci que tu es parvenue à la dignité royale ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Car si
  rationale: La tournure conserve à la fois le lien explicatif avec le verset précédent et la condition introduite ici.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: tu continues à garder le silence
  rationale: L’infinitif absolu renforce le verbe. Cette formulation naturelle exprime le maintien délibéré du silence sans le surcharger.
- source_word: בָּעֵת הַזֹּאת
  choice: en ce moment
  rationale: L’expression désigne la crise présente; « en ce moment » est courant, précis et solennel sans archaïsme.
- source_word: רֶוַח וְהַצָּלָה
  choice: le soulagement et la délivrance
  rationale: « Soulagement » rend l’idée de répit, tandis que « délivrance » exprime le sauvetage face à la destruction, sans imposer ici un sens sotériologique technique.
- source_word: יַעֲמוֹד
  choice: surgiront
  rationale: Le verbe signifie littéralement « se tenir, se lever »; dans ce contexte, il évoque l’apparition effective d’un secours. « Surgiront » garde cette image dans un français naturel.
- source_word: לַיְּהוּדִים
  choice: pour les Juifs
  rationale: Dans Esther, le terme désigne le peuple juif vivant dans l’Empire perse; « les Juifs » est clair et usuel.
- source_word: מִמָּקוֹם אַחֵר
  choice: d’un autre lieu
  rationale: La formulation conserve l’indétermination du texte hébreu et n’explicite pas la source du secours.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: mais toi et la maison de ton père
  rationale: « Maison de ton père » garde l’expression hébraïque de parenté et sa dimension familiale et dynastique, tout en restant compréhensible.
- source_word: תֹּאבֵדוּ
  choice: vous périrez
  rationale: Le verbe peut évoquer la mort comme la ruine; « périrez » en préserve l’étendue et la gravité.
- source_word: וּמִי יוֹדֵעַ
  choice: Et qui sait
  rationale: Cette expression idiomatique introduit une possibilité sans la transformer en certitude.
- source_word: אִם לְעֵת כָּזֹאת הִגַּעַתְּ לַמַּלְכוּת
  choice: si tu n’as pas accédé à la royauté pour un temps comme celui-ci
  rationale: « Accéder à la royauté » exprime naturellement l’arrivée d’Esther à sa position royale. Après « qui sait si », la négation française est idiomatique et présente une possibilité envisagée, sans nier le fait; la formulation garde le lien possible entre sa position et le moment présent.
theological_decisions:
- issue: Providence implicite dans « d’un autre lieu » et « pour un temps comme celui-ci »
  choice: Conserver les formulations indirectes sans nommer Dieu dans le texte
  alternative: Expliciter que le secours viendra de Dieu ou qualifier le moment de providentiel
  rationale: Le verset suggère fortement la providence divine, mais ne nomme pas Dieu. La traduction maintient cette tension et cette discrétion théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de Mardochée à Esther. La syntaxe conserve la progression solennelle de l’avertissement, tout en évitant les tournures archaïques.
