  yaml_path: translation/ot/esther/004/013.yaml
  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: fr
  text: 'Mardochée fit répondre à Esther : « Ne t’imagine pas que tu échapperas, seule parmi tous les Juifs, dans le palais royal. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב אֶל־אֶסְתֵּר
  choice: Mardochée fit répondre à Esther
  rationale: La tournure hébraïque emploie « dire » avec l’infinitif « répondre ». En contexte, le message passe par des intermédiaires ; « fit répondre » restitue naturellement cette transmission sans ajouter un pronom absent du verset.
- source_word: אַל־תְּדַמִּי בְנַפְשֵׁךְ
  choice: Ne t’imagine pas
  rationale: Expression idiomatique signifiant « ne pense pas en toi-même » ; cette formulation française est directe et naturelle.
- source_word: לְהִמָּלֵט
  choice: tu échapperas au danger
  rationale: Le verbe signifie se sauver, s’échapper ou être délivré. « Échapper au danger » rend explicite l’objet implicite fourni par le contexte immédiat, sans préciser artificiellement le mode de délivrance.
- source_word: בֵּית הַמֶּלֶךְ
  choice: parce que tu vis dans le palais royal
  rationale: Littéralement « dans la maison du roi ». Ici, l’expression désigne le palais et implique que la position d’Esther en son sein ne la protégera pas ; la relation circonstancielle est rendue naturellement en français.
- source_word: מִכָּל־הַיְּהוּדִים
  choice: seule parmi tous les Juifs
  rationale: 'La préposition מן peut porter ici une valeur comparative ou séparative : Esther ne doit pas croire qu’elle échappera à la différence de tous les autres Juifs. La formulation française préserve ce contraste.'
theological_decisions:
- issue: Nature de l’évasion envisagée
  choice: échapper au danger
  alternative: être sauvée
  rationale: « Être sauvée » pourrait recevoir une coloration théologique plus forte que ne l’exige le contexte. Le passage parle d’abord d’échapper au décret meurtrier.
- issue: Protection liée au palais
  choice: parce que tu vis dans le palais royal
  alternative: dans le palais royal
  rationale: Le texte met en cause la fausse sécurité qu’Esther pourrait tirer de sa présence au palais. La formulation explicite cette logique contextuelle sans introduire une doctrine particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Palais royal » est plus idiomatique que « maison du roi » dans ce contexte. Le discours direct conserve le tutoiement attendu entre Mardochée et Esther.
