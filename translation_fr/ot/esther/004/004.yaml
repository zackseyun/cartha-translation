source:
  edition: WLC
  text: וַ֠/תָּבוֹאינָה נַעֲר֨וֹת אֶסְתֵּ֤ר וְ/סָרִיסֶ֨י/הָ֙ וַ/יַּגִּ֣ידוּ לָ֔/הּ וַ/תִּתְחַלְחַ֥ל הַ/מַּלְכָּ֖ה מְאֹ֑ד וַ/תִּשְׁלַ֨ח בְּגָדִ֜ים לְ/הַלְבִּ֣ישׁ אֶֽת מָרְדֳּכַ֗י וּ/לְ/הָסִ֥יר שַׂקּ֛/וֹ מֵ/עָלָ֖י/ו וְ/לֹ֥א קִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: fr
  text: Les jeunes femmes[a] d’Esther et ses eunuques[b] vinrent lui rapporter cela, et la reine fut profondément bouleversée. Elle envoya des vêtements pour en revêtir Mardochée et lui enlever son sac[c], mais il refusa de les accepter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les servantes » d’Esther.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « eunuques » peut, dans certains contextes, désigner plus largement des fonctionnaires de la cour ; dans le palais d’Esther, son sens plus précis est vraisemblable.
    reason: cultural_note
  - marker: c
    text: Le sac était un vêtement d’étoffe grossière porté en signe de deuil, d’affliction ou d’humiliation.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת
  choice: jeunes femmes
  rationale: Le terme désigne ici les jeunes femmes attachées au service d’Esther. « Jeunes femmes » reste proche de l’hébreu, tandis que la note précise leur fonction dans le palais.
- source_word: וְסָרִיסֶיהָ
  choice: et ses eunuques
  rationale: Dans le cadre de la cour perse, le sens concret « eunuques » est historiquement et lexicalement bien fondé, même si le mot peut parfois désigner plus largement des fonctionnaires de cour.
- source_word: וַיַּגִּידוּ לָהּ
  choice: vinrent lui rapporter cela
  rationale: Cette formulation restitue à la fois le déplacement exprimé dans la séquence narrative et l’acte d’informer Esther. « Cela » reprend naturellement la situation décrite au verset précédent.
- source_word: וַתִּתְחַלְחַל
  choice: fut profondément bouleversée
  rationale: Le verbe exprime une agitation intense, voire un tremblement. Cette traduction française naturelle conserve la force émotionnelle sans imposer une manifestation exclusivement physique.
- source_word: הַמַּלְכָּה
  choice: la reine
  rationale: Le titre défini renvoie à Esther dans sa fonction royale.
- source_word: בְּגָדִים
  choice: des vêtements
  rationale: « Vêtements » est clair, actuel et adapté au contexte, sans la coloration vieillie que pourrait avoir « habits » dans certains usages.
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: pour en revêtir Mardochée
  rationale: La tournure exprime nettement le but de l’envoi et le pronom « en » renvoie aux vêtements. « Revêtir » convient au registre narratif digne sans être obscur.
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: et lui enlever son sac
  rationale: La formulation conserve l’action concrète d’ôter à Mardochée le vêtement de deuil. Le parallélisme avec « pour en revêtir » demeure naturel en français.
- source_word: שַׂקּוֹ
  choice: son sac
  rationale: « Sac » est le terme biblique français usuel pour le vêtement grossier porté en signe de deuil ou d’humiliation. Une note en explique le sens culturel afin d’éviter la confusion avec un contenant.
- source_word: וְלֹא קִבֵּל
  choice: mais il refusa de les accepter
  rationale: L’objet implicite est naturellement compris comme les vêtements envoyés. « Refusa » rend la non-acceptation volontaire suggérée par le contexte, et « les » explicite l’objet en français.
