  text: וַ/יָּב֕וֹא עַ֖ד לִ/פְנֵ֣י שַֽׁעַר הַ/מֶּ֑לֶךְ כִּ֣י אֵ֥ין לָ/ב֛וֹא אֶל שַׁ֥עַר הַ/מֶּ֖לֶךְ בִּ/לְב֥וּשׁ שָֽׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/002.yaml
  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: fr
  text: Il alla jusque devant la porte du roi[a], car personne ne pouvait entrer par la porte du roi vêtu de toile de sac[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à l’endroit situé devant la porte du roi » ou « jusque devant la porte du roi ». L’hébreu souligne qu’il ne s’avança que jusqu’au point qui se trouvait devant elle.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « car il n’était pas possible d’entrer par la porte du roi avec un vêtement de toile de sac ». Dans ce contexte, cette impossibilité implique que l’accès en tenue de deuil était interdit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Il alla
  rationale: Le wayyiqtol de בוא décrit ici le déplacement de Mardochée vers la porte. « Il alla » convient naturellement au point de vue narratif français.
- source_word: עַד לִפְנֵי
  choice: jusqu’en face de
  rationale: עַד marque la limite atteinte, tandis que לִפְנֵי situe Mardochée devant la porte sans indiquer qu’il y entre. Cette tournure préserve les deux éléments dans un français naturel.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: la porte du roi
  rationale: Cette traduction directe du groupe construit convient au cadre de la cour royale et reste claire en français moderne.
- source_word: כִּי אֵין לָבוֹא
  choice: car personne ne pouvait franchir
  rationale: אֵין avec l’infinitif exprime ici une impossibilité pratique ou une interdiction. La formulation impersonnelle avec « personne » communique clairement cette valeur sans préciser une règle absente du texte.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: franchir la porte du roi
  rationale: אֶל peut marquer le mouvement vers l’intérieur. Dans ce contexte, « franchir la porte » exprime idiomatiquement le fait d’entrer dans l’enceinte par cette porte.
- source_word: בִּלְבוּשׁ שָׂק
  choice: vêtu de toile de sac
  rationale: L’expression signifie littéralement « dans un vêtement de toile de sac ». La traduction retenue désigne clairement la tenue de deuil sans suggérer que Mardochée portait un sac ordinaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Toile de sac » conserve l’image culturelle de la tenue de deuil; « franchir » évite une répétition maladroite de « entrer dans la porte ».
