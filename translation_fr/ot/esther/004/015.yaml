  text: 'Alors Esther dit de répondre à Mardochée[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « Esther dit de faire revenir à Mardochée. » Le verbe peut désigner le fait de faire parvenir une réponse; l’objet n’est pas exprimé en hébreu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Alors Esther leur ordonna
  rationale: Le waw consécutif fait avancer le récit. Avec l’infinitif לְהָשִׁיב, le verbe אמר exprime ici une consigne; « ordonna » rend naturellement en français le fait qu’Esther fait transmettre une réponse, tandis que « alors » marque la progression narrative.
- source_word: אֶסְתֵּר
  choice: Esther
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: לְהָשִׁיב
  choice: de répondre
  rationale: L’infinitif hiphil de שוב signifie littéralement « faire revenir » et, dans ce contexte de communication, « faire parvenir une réponse ». « Répondre » en donne le sens idiomatique avec concision.
- source_word: אֶל
  choice: à
  rationale: La préposition indique le destinataire de la réponse; « répondre à Mardochée » est la construction française naturelle.
- source_word: מָרְדֳּכָי
  choice: Mardochée
  rationale: Le nom propre est rendu selon sa forme française biblique traditionnelle et encore courante.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le pronom « leur », implicite dans la construction hébraïque et fourni par le contexte, explicite les messagers chargés de transmettre la réponse. Le deux-points convient puisque les paroles d’Esther suivent au verset suivant.
