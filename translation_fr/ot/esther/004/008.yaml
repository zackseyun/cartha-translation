source:
  edition: WLC
  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: fr
  text: Il lui remit aussi une copie[a] du texte du décret qui avait été promulgué à Suse en vue de leur extermination, afin de la montrer à Esther, de lui en expliquer le contenu et de lui enjoindre d’aller auprès du roi, d’implorer sa faveur et de plaider devant lui en faveur de son peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme d’origine perse traduit par « copie » peut aussi désigner le texte d’un document officiel.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: une copie du décret écrit
  rationale: Le terme d’origine perse peut désigner le texte ou la copie d’un document officiel. « Copie » convient à l’objet matériel remis à Hathak, tandis que la note conserve l’autre possibilité.
- source_word: הַדָּת
  choice: décret
  rationale: Dans le cadre administratif perse du livre d’Esther, le mot désigne ici une décision royale officiellement promulguée plutôt qu’une loi générale.
- source_word: נִתַּן בְּשׁוּשָׁן
  choice: avait été publié à Suse
  rationale: Le passif de נתן prend ici un sens administratif de promulgation. Le plus-que-parfait français situe naturellement cette publication avant la remise de la copie.
- source_word: לְהַשְׁמִידָם
  choice: en vue de leur extermination
  rationale: L’infinitif exprime la finalité meurtrière du décret. « Extermination » rend clairement la destruction collective projetée.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: afin qu’il la montre à Esther et lui en explique le contenu
  rationale: Le français explicite la copie comme objet de « montrer » et le document comme contenu à faire connaître, sans ajouter de nouvelle information.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: Il le chargea aussi de lui ordonner
  rationale: La syntaxe indique que Mardochée donne à Hathak la mission de transmettre à Esther un ordre. « Ordonner » préserve la force de צוה, sans attribuer à Mardochée une autorité royale.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: d’aller auprès du roi
  rationale: Cette formulation française naturelle exprime l’accès à la présence royale sans surcharger le texte d’une explication du protocole de cour.
- source_word: לְהִתְחַנֶּן לוֹ
  choice: d’implorer sa faveur
  rationale: Le verbe au hitpael exprime une supplication pressante visant à obtenir grâce ou faveur.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: et de plaider devant lui en faveur de son peuple
  rationale: La tournure rend naturellement l’idiome de cour « demander devant lui » et la préposition על comme action entreprise en faveur du peuple d’Esther.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. La longue chaîne d’infinitifs hébraïque est répartie en deux phrases pour assurer la clarté des rapports syntaxiques, notamment le fait que Mardochée charge Hathak de transmettre l’ordre à Esther. Le référent collectif de « leur extermination » demeure implicite comme dans le texte source et se comprend dans le contexte immédiat.
