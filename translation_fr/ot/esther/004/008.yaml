  to: Il lui remit aussi une copie[a] du texte du décret qui avait été promulgué à Suse en vue de leur extermination, afin de la montrer à Esther, de lui en expliquer le contenu et de lui enjoindre d’aller auprès du roi, d’implorer sa faveur et de plaider devant lui en faveur de son peuple.
