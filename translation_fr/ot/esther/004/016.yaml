revisions:
- from: Va, rassemble tous les Juifs qui se trouvent à Suse et jeûnez pour moi[a]. Ne mangez ni ne buvez pendant trois jours, nuit et jour. Moi aussi, je jeûnerai de la même manière avec mes jeunes servantes[b]. Après cela, j’irai trouver le roi, bien que ce soit contraire à la loi[c]. Et si je dois périr, je périrai[d].
  to: Va, rassemble tous les Juifs qui se trouvent à Suse et jeûnez pour moi[a]. Ne mangez ni ne buvez pendant trois jours, nuit et jour. Moi et mes jeunes servantes, nous jeûnerons aussi de la même manière[b]. Après cela, j’irai trouver le roi, bien que ce soit contraire à la loi[c]. Si je péris, je péris[d].
  rationale: La révision retire l’ajout interprétatif « dois » et restitue la formule finale dans sa brièveté répétitive. Elle exprime aussi explicitement, dans une syntaxe française naturelle, qu’Esther et ses servantes jeûneront ensemble. Les autres choix et les ancres de notes sont conservés.
