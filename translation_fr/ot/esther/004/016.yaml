source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: fr
  text: Va, rassemble tous les Juifs qui se trouvent à Suse et jeûnez pour moi[a]. Ne mangez ni ne buvez pendant trois jours, nuit et jour. Moi et mes jeunes servantes, nous jeûnerons aussi de la même manière[b]. Après cela, j’irai trouver le roi, bien que ce soit contraire à la loi[c]. Si je péris, je péris[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jeûnez à mon intention » ou « en ma faveur ».'
    reason: La préposition hébraïque indique que le jeûne concerne Esther, sans préciser davantage le rapport.
  - marker: b
    text: 'Ou : « mes jeunes femmes » ou « mes suivantes ».'
    reason: Le nom hébreu peut désigner des jeunes femmes, notamment des servantes ou des femmes attachées à son service.
  - marker: c
    text: 'Littéralement : « bien que ce ne soit pas conforme à la loi ».'
    reason: La note conserve la forme plus proche de l’expression hébraïque כַדָּת.
  - marker: d
    text: 'Ou : « et quand je périrai, je périrai ». La formule hébraïque, brève et insistante, exprime l’acceptation résolue du risque.'
    reason: La syntaxe permet une nuance conditionnelle ou plus fataliste qu’il convient de ne pas effacer.
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Va, rassemble
  rationale: Les deux impératifs adressés à Mardochée sont rendus directement et naturellement.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: tous les Juifs qui se trouvent à Suse
  rationale: « Qui se trouvent » conserve la nuance du participe hébreu tout en restant idiomatique en français; « Suse » est la forme française courante.
- source_word: וְצוּמוּ עָלַי
  choice: et jeûnez pour moi
  rationale: La préposition עַל situe le jeûne en rapport avec Esther et sa situation; « pour moi » est clair sans préciser davantage la nature de cette relation.
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ
  choice: Ne mangez ni ne buvez
  rationale: La construction française « ni… ni… » restitue les deux interdictions répétées avec concision.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: pendant trois jours, nuit et jour
  rationale: Cette formulation respecte l’ordre hébreu et souligne le caractère continu du jeûne sans expliciter un calcul chronologique absent du texte.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: Moi aussi… avec mes jeunes servantes
  rationale: נַעֲרוֹת désigne ici vraisemblablement les jeunes femmes attachées au service d’Esther. « Jeunes servantes » exprime à la fois l’âge suggéré et leur fonction, sans archaïsme.
- source_word: אָצוּם כֵּן
  choice: je jeûnerai de la même manière
  rationale: Le singulier hébreu porte grammaticalement sur Esther, tandis que la mention de ses servantes les associe au jeûne; la formulation française garde cette structure.
- source_word: וּבְכֵן
  choice: Après cela
  rationale: L’expression marque ici la transition consécutive entre le jeûne et la démarche auprès du roi.
- source_word: אָבוֹא אֶל הַמֶּלֶךְ
  choice: j’irai trouver le roi
  rationale: Cette expression française rend naturellement l’idée d’aller auprès du roi, sans ajouter la notion d’audience au texte.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: bien que ce soit contraire à la loi
  rationale: Le contexte donne à la proposition une valeur concessive; « contraire à la loi » rend clairement לֹא כַדָּת.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: Et si je dois périr, je périrai
  rationale: Cette formulation conserve la répétition emphatique et l’acceptation résolue du risque, tout en signalant l’ambiguïté de la tournure dans une note.
theological_decisions:
- issue: Nature du jeûne demandé par Esther
  choice: Ne pas ajouter de mention explicite de prière ou de Dieu
  alternative: « jeûnez et priez pour moi »
  rationale: Le texte hébreu ne mentionne ni la prière ni Dieu dans ce verset; les ajouter importerait une interprétation théologique plausible mais non exprimée.
- issue: Degré de certitude dans la formule finale
  choice: « si je dois périr » avec note sur d’autres lectures
  alternative: « quand je périrai »
  rationale: La construction hébraïque est concise et peut exprimer soit l’éventualité acceptée, soit une perspective plus sombre. Le texte principal reste naturel et la note préserve cette tension.
translation_notes:
  register: Français international moderne, digne et direct. Les impératifs gardent la force de l’appel d’Esther; la phrase finale demeure brève et solennelle. Les termes archaïques comme « chambrières » ont été évités.
