  text: And they told Mordecai Esther’s words[a].
translation:
  language: fr
  text: Ils rapportèrent à Mardochée les paroles d’Esther[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message d’Esther » ou « la réponse d’Esther ».
    reason: alternative lexicale
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: On rapporta
  rationale: Le hiphil wayyiqtol de נגד fait avancer le récit et a pour sujet un pluriel non précisé. En français, le pronom indéfini « on » rend naturellement ce sujet, tandis que « rapporta » convient à la transmission du message d’Esther à Mardochée.
- source_word: לְמָרְדֳּכָי
  choice: à Mardochée
  rationale: La préposition לְ marque ici le destinataire. « Mardochée » est la forme française traditionnelle et courante du nom.
- source_word: אֵת
  choice: '[non traduit séparément]'
  rationale: Cette particule marque le complément d’objet direct en hébreu et n’a pas d’équivalent lexical autonome en français.
- source_word: דִּבְרֵי
  choice: les paroles
  rationale: Le pluriel construit de דָּבָר peut désigner des paroles, un message ou une réponse. « Les paroles » reste proche de la forme hébraïque et conserve la référence au contenu exprimé par Esther.
- source_word: אֶסְתֵּר
  choice: d’Esther
  rationale: Le rapport construit avec דִּבְרֵי est naturellement exprimé par « les paroles d’Esther ».
