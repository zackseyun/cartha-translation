    text: 'Littéralement : « la toile de sac et la cendre étaient étendues pour beaucoup ». L’hébreu est très concis ; l’expression peut aussi indiquer que beaucoup faisaient usage de la toile de sac et de la cendre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: Dans chaque province
  rationale: La répétition distributive hébraïque « province et province » signifie naturellement « chaque province » en français.
- source_word: מְקוֹם אֲשֶׁר
  choice: partout où
  rationale: Cette tournure restitue clairement la portée distributive du syntagme hébreu.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: la parole du roi et son décret
  rationale: « Parole » conserve le sens large de דָּבָר, tandis que « décret » rend la force juridique de דָּת dans le cadre perse.
- source_word: מַגִּיעַ
  choice: parvenaient
  rationale: Le verbe décrit la diffusion de la parole et du décret royaux jusque dans les provinces ; l'accord au pluriel est naturel avec les deux sujets coordonnés en français.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: les Juifs étaient plongés dans un grand deuil
  rationale: Cette formulation française exprime naturellement que les Juifs éprouvaient et manifestaient un deuil intense.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: avec jeûnes, pleurs et lamentations
  rationale: Les trois noms précisent les manifestations du deuil. Le pluriel français convient à ces pratiques répétées dans de nombreuses provinces.
- source_word: שַׂק וָאֵפֶר
  choice: la toile de sac et la cendre
  rationale: Cette expression conserve les signes concrets et traditionnels du deuil biblique ; « toile de sac » est plus transparent en français moderne que le seul mot « sac ».
- source_word: יֻצַּע לָרַבִּים
  choice: beaucoup se couchaient sur
  rationale: Le Hophal de יצע évoque ce qui est étendu pour servir de couche, et לָרַבִּים désigne vraisemblablement les nombreuses personnes concernées. La tournure rend l'image intelligible sans la réduire au simple port d'un vêtement.
