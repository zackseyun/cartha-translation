  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: fr
  text: Dans chaque province, partout où la parole du roi et son décret parvenaient, il y avait chez les Juifs un grand deuil, avec jeûne, pleurs et lamentations ; la toile de sac et la cendre étaient étendues pour beaucoup.[a]
  philosophy: optimal-equivalence
  footnotes:
