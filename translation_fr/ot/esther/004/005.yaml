  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Esther fait venir Hathak, serviteur royal affecté auprès d’elle, et le charge d’une enquête liée à Mardochée. Toutefois, « lui ordonna de se renseigner au sujet de Mardochée » rattache directement l’enquête à Mardochée, alors que l’hébreu distingue la commission « au sujet de Mardochée » du but : savoir ce qu’était cette situation et pour quelle raison elle existait.'
  naturalness: Le français est fluide et de registre narratif approprié. Une légère réorganisation permet de conserver plus nettement la construction et la portée des deux questions sans alourdir la phrase.
  terminology: « Eunuques » est un rendu principal défendable de סָרִיס, et la note préserve correctement l’alternative « fonctionnaires de la cour ». « Hathak », « Mardochée » et « chargé de la servir » conviennent au français biblique international moderne.
  issues:
