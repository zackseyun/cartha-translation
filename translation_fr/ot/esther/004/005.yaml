base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: fr
  text: Alors Esther appela Hathak[a], l’un des eunuques du roi que celui-ci avait chargé de la servir, et lui donna des ordres au sujet de Mardochée, afin de savoir ce qu’il en était et pourquoi il en était ainsi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’un des fonctionnaires de la cour du roi ». Le terme hébreu peut désigner précisément un eunuque ou, dans certains contextes, plus généralement un haut fonctionnaire royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: Alors Esther appela
  rationale: Le wayyiqtol fait progresser le récit. « Alors » marque naturellement la succession, tandis que « appela » exprime ici le fait de faire venir quelqu’un.
- source_word: לַהֲתָךְ
  choice: Hathak
  rationale: Le nom propre est translittéré sous une forme claire et usuelle en français.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: l’un des eunuques du roi
  rationale: סָרִיס désigne couramment un eunuque dans un cadre royal, bien qu’il puisse aussi avoir le sens plus général de haut fonctionnaire ou d’officier de cour. Le sens concret est retenu dans le texte et l’autre possibilité est signalée en note.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: que celui-ci avait chargé de la servir
  rationale: Le roi est le sujet implicite le plus naturel. Cette formulation rend idiomatiquement l’idée d’une affectation officielle au service personnel d’Esther.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: et lui ordonna de se renseigner au sujet de Mardochée
  rationale: צוה conserve sa force d’ordre, tandis que עַל introduit la personne concernée par la mission. L’ajout explicite de « se renseigner » anticipe naturellement en français l’infinitif de but qui suit.
- source_word: לָדַעַת
  choice: afin de savoir
  rationale: L’infinitif exprime le but de la mission confiée à Hathak.
- source_word: מַה זֶּה וְעַל מַה זֶּה
  choice: ce qui se passait et pourquoi
  rationale: 'Cette tournure française naturelle conserve les deux volets de la question : la nature de la situation, puis sa raison, sans préciser davantage que l’hébreu.'
