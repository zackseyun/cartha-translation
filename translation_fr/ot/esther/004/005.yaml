    issue: Rattachement imprécis de « au sujet de Mardochée »
    rationale: Dans « lui ordonna de se renseigner au sujet de Mardochée », le complément semble définir l’objet immédiat du renseignement. Le texte source place plutôt « au sujet de Mardochée » avec l’ordre donné à Hathak, puis exprime séparément le but de savoir ce qu’était la situation et pourquoi elle était ainsi.
