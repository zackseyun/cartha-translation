  text: וַ/יָּב֖וֹא הֲתָ֑ךְ וַ/יַּגֵּ֣ד לְ/אֶסְתֵּ֔ר אֵ֖ת דִּבְרֵ֥י מָרְדֳּכָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/009.yaml
  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: fr
  text: Hatak revint et rapporta à Esther les paroles de Mardochée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le message de Mardochée » ou « ce que Mardochée avait dit ». L’hébreu dit littéralement « les paroles de Mardochée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: revint
  rationale: Le verbe בוא signifie « venir/aller, arriver ». Dans le contexte, Hatak retourne auprès d’Esther après avoir rencontré Mardochée ; « revint » rend naturellement ce mouvement en français.
- source_word: הֲתָךְ
  choice: Hatak
  rationale: Nom propre translittéré selon une forme française claire et proche de l’hébreu.
- source_word: וַיַּגֵּד
  choice: rapporta
  rationale: Le hifil de נגד signifie « faire connaître, raconter, rapporter ». « Rapporta » convient au rôle de messager d’Hatak et au contexte narratif.
- source_word: לְאֶסְתֵּר
  choice: à Esther
  rationale: Le préfixe לְ marque ici la destinataire de ce qui est rapporté.
- source_word: אֵת
  choice: '[non traduit séparément]'
  rationale: Marqueur hébreu du complément d’objet direct défini, représenté par la syntaxe française.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: Le pluriel construit de דָּבָר signifie littéralement « les paroles de ». Cette formulation reste naturelle en français tout en préservant la forme de l’hébreu.
- source_word: מָרְדֳּכָי
  choice: Mardochée
  rationale: Forme française traditionnelle et largement reconnue du nom propre hébreu.
