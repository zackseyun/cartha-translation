lexical_decisions:
- source_word: וַיֵּצֵא
  choice: sortit donc
  rationale: Le wayyiqtol de יצא exprime l’action narrative passée et conserve ici l’idée de sortir; « donc » marque naturellement la suite du récit.
- source_word: הֲתָךְ
  choice: Hatak
  rationale: Translittération française claire du nom propre hébreu.
- source_word: אֶל מָרְדֳּכָי
  choice: pour aller trouver Mardochée
  rationale: Dans ce contexte de déplacement et de mission, cette formulation française rend naturellement אֶל, sans changer la destination personnelle indiquée par le texte.
- source_word: אֶל רְחוֹב הָעִיר
  choice: sur la place de la ville
  rationale: רְחוֹב désigne ici un large espace public urbain, mieux rendu en français moderne par « place » que par « rue ».
- source_word: אֲשֶׁר לִפְנֵי
  choice: située devant
  rationale: Cette formulation rattache clairement la proposition relative à la place et rend le rapport spatial de לִפְנֵי.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: la porte du roi
  rationale: Le syntagme construit est possessif; « porte du roi » est naturel et cohérent avec ce lieu récurrent du livre d’Esther.
