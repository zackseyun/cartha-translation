source:
  edition: WLC
  text: כִּ֠י בְּ/טֶ֨רֶם יֵדַ֥ע הַ/נַּ֛עַר מָאֹ֥ס בָּ/רָ֖ע וּ/בָחֹ֣ר בַּ/טּ֑וֹב תֵּעָזֵ֤ב הָ/אֲדָמָה֙ אֲשֶׁ֣ר אַתָּ֣ה קָ֔ץ מִ/פְּנֵ֖י שְׁנֵ֥י מְלָכֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/016.yaml
  text: For before the boy knows to refuse the evil and choose the good[b][a], the land before whose two kings you dread will be forsaken.
translation:
  language: fr
  text: Car, avant que le garçon sache rejeter le mal et choisir le bien, le pays que tu redoutes à cause de ses deux rois[b] sera abandonné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera délaissé » ou « sera déserté ». La forme passive hébraïque peut évoquer un pays laissé vide ou abandonné.
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « qui te fait horreur à cause de ses deux rois » ou « devant les deux rois duquel tu es saisi d’effroi ». Le verbe hébreu peut exprimer la répulsion ; dans ce contexte, celle-ci est vraisemblablement liée à la peur inspirée par les deux rois.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: Introduit naturellement en français la limite temporelle antérieure à l’acquisition du discernement par le garçon.
- source_word: הַנַּעַר
  choice: le garçon
  rationale: Le nom peut désigner un enfant ou un jeune homme. Ici, le contexte d’un discernement non encore acquis favorise « garçon », qui conserve aussi le masculin singulier sans préciser l’identité de l’enfant.
- source_word: יֵדַע ... מָאֹס ... וּבָחֹר
  choice: sache rejeter ... et choisir
  rationale: La construction exprime un discernement ou une capacité acquis. « Sache » suivi des infinitifs est naturel en français et reste proche de la séquence hébraïque.
- source_word: מָאֹס
  choice: rejeter
  rationale: Dans ce couple antithétique, le verbe exprime le refus de ce qui est mauvais plutôt qu’un simple sentiment de mépris.
- source_word: בָּרָע ... בַּטּוֹב
  choice: le mal ... le bien
  rationale: Les articles et l’opposition morale de l’hébreu sont rendus par les expressions françaises usuelles « le mal » et « le bien ».
- source_word: תֵּעָזֵב
  choice: sera abandonné
  rationale: Le niphal appelle une traduction passive. « Sera abandonné » peut évoquer un pays délaissé ou déserté sans préciser l’agent.
- source_word: הָאֲדָמָה
  choice: le pays
  rationale: Le contexte politique et la mention des rois indiquent un territoire plutôt que le sol matériel.
- source_word: אֲשֶׁר אַתָּה קָץ מִפְּנֵי שְׁנֵי מְלָכֶיהָ
  choice: que tu redoutes à cause de ses deux rois
  rationale: Cette formulation conserve le lien causal porté par מִפְּנֵי et rend קוץ selon la crainte mêlée de répulsion suscitée ici par les deux rois menaçants.
theological_decisions:
- issue: Identité et fonction du « garçon »
  choice: Traduire simplement par « le garçon », sans identifier explicitement celui-ci.
  alternative: Identifier le garçon soit exclusivement à un enfant-signe de l’époque, soit directement à Emmanuel dans une lecture messianique.
  rationale: Le verset emploie seulement le nom commun הַנַּעַר. Une formulation neutre préserve la tension entre les lectures historiques, typologiques et messianiques sans en imposer une.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est naturelle tout en conservant la relation temporelle, l’opposition morale et le passif prophétique du texte hébreu.
