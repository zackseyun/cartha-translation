  text: וַ/יּ֣וֹסֶף יְהוָ֔ה דַּבֵּ֥ר אֶל אָחָ֖ז לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/010.yaml
  text: And Yahweh continued to speak to Ahaz[a], saying,
translation:
  language: fr
  text: 'Yahweh parla encore à Achaz :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: de nouveau
  rationale: 'La construction יָסַף suivie d’un infinitif exprime ici la répétition de l’action : Yahweh prend de nouveau la parole. Cette formulation est naturelle en français et convient au contexte, où commence une nouvelle intervention divine.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération « Yahweh », afin de conserver le nom divin plutôt que de lui substituer un titre.
- source_word: דַּבֵּר
  choice: parla
  rationale: Avec וַיּוֹסֶף, l’infinitif absolu fonctionne dans l’expression idiomatique signifiant « parla de nouveau » ou « continua de parler ».
- source_word: אֶל
  choice: à
  rationale: La préposition indique le destinataire de la parole ; « parler à Ahaz » est la tournure française normale.
- source_word: אָחָז
  choice: Ahaz
  rationale: Le nom propre est conservé sous sa forme française biblique courante.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Le marqueur hébreu introduit les paroles qui suivent. En français moderne, les deux-points remplissent naturellement cette fonction sans ajouter le lourd « en disant ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie explicitement le nom divin. « Yahweh » en préserve la valeur de nom propre, tandis que « le Seigneur » lui substituerait un titre.
- issue: Rapport avec la prise de parole précédente
  choice: parla de nouveau
  alternative: continua de parler
  rationale: L’idiome peut exprimer soit la reprise, soit la continuation. Dans ce contexte, « de nouveau » rend clairement la nouvelle intervention introduite au verset 10 sans nier la continuité du discours.
translation_notes:
  register: 'Français moderne, sobre et digne. La syntaxe narrative est allégée : לֵאמֹר est rendu par deux-points, usage idiomatique courant avant une citation directe.'
