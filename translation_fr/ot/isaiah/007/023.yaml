id: ISA.7.23
reference: Isaiah 7:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִֽהְיֶ֣ה כָל מָק֗וֹם אֲשֶׁ֧ר יִֽהְיֶה שָּׁ֛ם אֶ֥לֶף גֶּ֖פֶן בְּ/אֶ֣לֶף כָּ֑סֶף לַ/שָּׁמִ֥יר וְ/לַ/שַּׁ֖יִת יִֽהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/023.yaml
  text: And in that day[b][a], every place where there were a thousand vines worth a thousand pieces of silver will become briars and thorns.
translation:
  language: fr
  text: En ce jour-là, tout endroit où se trouvaient mille ceps de vigne[a], valant mille pièces d’argent[b], sera couvert de ronces et d’épines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «où se trouveront mille ceps de vigne». La forme verbale hébraïque peut être traduite au futur, mais le contexte semble opposer la valeur antérieure de ces terres à leur désolation future.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement: «pour mille d’argent». Le verset ne précise pas l’unité monétaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: La formule prophétique temporelle est rendue de façon naturelle et solennelle en français; la valeur future de וְהָיָה est portée par le prédicat final.
- source_word: כָל מָקוֹם
  choice: tout endroit
  rationale: Rend directement la valeur distributive de l’expression hébraïque dans un français courant.
- source_word: אֲשֶׁר יִהְיֶה שָׁם
  choice: où se trouvaient
  rationale: L’imparfait français exprime l’état antérieur que le contexte oppose à la désolation future, tout en évitant la tournure moins naturelle «où il y avait» devant le groupe nominal.
- source_word: אֶלֶף גֶּפֶן
  choice: mille ceps de vigne
  rationale: «Ceps de vigne» désigne clairement les plants individuels, plutôt que des vignobles entiers.
- source_word: בְּאֶלֶף כָּסֶף
  choice: valant mille pièces d’argent
  rationale: La préposition indique ici une estimation ou un prix. «Pièces d’argent» conserve le sens monétaire sans préciser une unité absente du texte.
- source_word: לַשָּׁמִיר וְלַשַּׁיִת
  choice: couvert de ronces et d’épines
  rationale: Cette formulation naturelle communique que les terrains cultivés seront envahis par une végétation épineuse; les termes botaniques hébreux restent génériques et difficiles à distinguer exactement.
- source_word: יִהְיֶה
  choice: sera couvert
  rationale: Le futur exprime le résultat annoncé. «Sera couvert» explicite avec mesure l’état concret impliqué par la construction hébraïque «sera pour les ronces et les épines».
theological_decisions:
- issue: Valeur temporelle de יִהְיֶה dans la proposition relative
  choice: où se trouvaient
  alternative: où se trouveront
  rationale: Le contexte décrit le passage de terrains viticoles précieux à leur désolation future. La forme hébraïque peut toutefois recevoir une traduction future, possibilité conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. «En ce jour-là» maintient le registre prophétique traditionnel sans archaïsme; «ceps de vigne» et «pièces d’argent» privilégient la précision tout en évitant une technicité ou une unité monétaire non exprimée.
