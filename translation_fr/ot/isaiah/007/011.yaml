  source_fidelity: La traduction actuelle introduit « le séjour des morts » (Shéol), mais le texte massorétique porte שְׁאָלָה, forme liée au verbe « demander », et non שְׁאוֹלָה (« vers le Shéol »). Elle transforme aussi les impératifs de la seconde partie en une simple description du signe. La révision conserve l’insistance sur une demande poussée aux extrêmes, sans identifier l’extrême inférieur au séjour des morts ni l’extrême supérieur au ciel.
  naturalness: « Demande pour toi-même » est compréhensible, mais « Demande pour toi » est plus naturel en français moderne tout en gardant la nuance personnelle. La reprise de « demande-le » rend avec clarté la construction emphatique et impérative de l’hébreu.
  terminology: « Yahweh » et « ton Dieu » rendent correctement יהוה et אֱלֹהֶיךָ. « Profondeurs » et « hauteurs » évitent des explicitations interprétatives non présentes dans le texte vocalisé.
