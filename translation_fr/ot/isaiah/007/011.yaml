  - severity: medium
    issue: « le ciel » explicite excessivement « vers le haut ».
    rationale: לְמָעְלָה signifie « vers le haut / dans les hauteurs »; le ciel n’est pas nommé. Une note peut signaler le caractère extrême de l’expression, sans substituer « ciel » au texte.
  - severity: medium
    issue: La seconde moitié perd la force directive des impératifs.
    rationale: « qu’il soit » décrit le signe, tandis que l’hébreu enchaîne des formes impératives invitant Achaz à porter sa demande aux extrêmes.
