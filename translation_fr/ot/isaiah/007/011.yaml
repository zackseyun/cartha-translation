  text: שְׁאַל לְ/ךָ֣ א֔וֹת מֵ/עִ֖ם יְהוָ֣ה אֱלֹהֶ֑י/ךָ הַעְמֵ֣ק שְׁאָ֔לָה א֖וֹ הַגְבֵּ֥הַּ לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/011.yaml
  text: 'Ask for yourself a sign from Yahweh your God: make it as deep as Sheol or as high as heaven[a].'
translation:
  language: fr
  text: 'Demande pour toi un signe de la part de Yahweh, ton Dieu : demande-le dans les profondeurs ou dans les hauteurs[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « rends profonde la demande, ou élève-la vers le haut ». La formulation exprime une demande portée aux extrêmes; elle ne nomme explicitement ni le séjour des morts ni le ciel.'
    reason: Précise la construction impérative et évite les explicitations interprétatives de « séjour des morts » et de « ciel ».
lexical_decisions:
- source_word: שְׁאַל לְךָ
  choice: Demande pour toi-même
  rationale: L’impératif masculin singulier s’adresse directement à Ahaz, et לְךָ ajoute une insistance personnelle que « pour toi-même » conserve naturellement.
- source_word: אוֹת
  choice: un signe
  rationale: Dans ce contexte prophétique, אוֹת désigne un signe donné par Dieu pour confirmer sa parole.
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: venant de Yahweh, ton Dieu
  rationale: מֵעִם indique ici la provenance. « Venant de » exprime clairement que Yahweh est la source du signe, tandis que le nom divin est transcrit « Yahweh ».
- source_word: הַעְמֵק שְׁאָלָה
  choice: qu’il soit aussi profond que le séjour des morts
  rationale: L’expression fixe l’extrême inférieur permis pour le signe. « Le séjour des morts » rend le shéol de manière compréhensible en français courant sans l’identifier plus précisément à une doctrine ultérieure.
- source_word: הַגְבֵּהַּ לְמָעְלָה
  choice: aussi haut que le ciel
  rationale: Le texte dit littéralement de le faire monter « vers le haut ». Dans le parallélisme avec le séjour des morts, « le ciel » explicite naturellement l’extrême supérieur implicite; la formulation littérale est signalée en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie le nom propre divin; sa transcription préserve cette valeur plutôt que de lui substituer un titre.
- issue: Interprétation des extrêmes de profondeur et de hauteur
  choice: aussi profond que le séjour des morts ou aussi haut que le ciel
  alternative: fais-le descendre profondément vers le séjour des morts ou monter très haut
  rationale: Le parallélisme autorise un signe situé entre les extrêmes inférieur et supérieur. La traduction choisie communique ce mérisme avec clarté tout en signalant en note que « ciel » est implicite.
translation_notes:
  register: Français international moderne, simple et digne. « Pour toi-même » garde l’insistance personnelle; « venant de » exprime la provenance marquée par מֵעִם. La note maintient la transparence sur l’explicitation de « ciel ».
