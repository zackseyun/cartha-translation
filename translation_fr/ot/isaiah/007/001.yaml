id: ISA.7.1
reference: Isaiah 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יְהִ֡י בִּ/ימֵ֣י אָ֠חָז בֶּן יוֹתָ֨ם בֶּן עֻזִּיָּ֜הוּ מֶ֣לֶךְ יְהוּדָ֗ה עָלָ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֤הוּ מֶֽלֶךְ יִשְׂרָאֵל֙ יְר֣וּשָׁלִַ֔ם לַ/מִּלְחָמָ֖ה עָלֶ֑י/הָ וְ/לֹ֥א יָכֹ֖ל לְ/הִלָּחֵ֥ם עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/001.yaml
  text: And it happened in the days of Ahaz son of Jotham[a], son of Uzziah, king of Judah, that Rezin king of Aram and Pekah son of Remaliah, king of Israel, went up to Jerusalem to wage war against it[b], but they were not able to fight against it.
translation:
  language: fr
  text: Il arriva, au temps d’Achaz, fils de Jotham, fils d’Ozias, roi de Juda, que Retsîn, roi d’Aram[a], et Péqah, fils de Remalia, roi d’Israël, montèrent à Jérusalem pour lui faire la guerre, mais il[b] ne put combattre contre elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Aram »; traduction traditionnelle : « Syrie ».'
    reason: alternative_reading
  - marker: b
    text: 'Le verbe hébreu est au singulier (« il ne put »), bien que Retsîn et Péqah viennent d’être nommés ensemble; certaines traductions mettent le pluriel : « ils ne purent ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Il arriva
  rationale: Introduit naturellement en français moderne un épisode historique tout en conservant la formule narrative hébraïque.
- source_word: בִּימֵי
  choice: au temps de
  rationale: Rend l’expression temporelle hébraïque dans un français courant et digne, sans l’archaïsme relatif de « aux jours de ».
- source_word: אָחָז ... יוֹתָם ... עֻזִּיָּהוּ
  choice: Achaz, fils de Jotham, fils d’Ozias
  rationale: Emploie les formes françaises bibliques reconnaissables et conserve toute la filiation.
- source_word: עָלָה ... יְרוּשָׁלִַם
  choice: montèrent à Jérusalem
  rationale: Conserve le mouvement exprimé par עלה; le contexte et la proposition de but rendent claire l’intention militaire.
- source_word: אֲרָם
  choice: Aram
  rationale: Reproduit directement le nom ethnogéographique hébreu plutôt que de lui substituer le terme traditionnel « Syrie ».
- source_word: לַמִּלְחָמָה עָלֶיהָ
  choice: pour lui faire la guerre
  rationale: Exprime naturellement en français le but militaire et la relation hostile marquée par על.
- source_word: וְלֹא יָכֹל
  choice: mais il ne put
  rationale: Préserve le singulier du texte massorétique malgré les deux rois nommés comme sujets, sans résoudre silencieusement cette tension grammaticale.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: combattre contre elle
  rationale: Rend directement le sens militaire de לחם et reprend Jérusalem au féminin, conformément à l’usage français.
theological_decisions:
- issue: Identification d’Aram
  choice: Aram
  alternative: Syrie
  rationale: « Aram » suit le terme historique du texte hébreu et évite d’introduire le nom géopolitique plus tardif traditionnellement employé.
- issue: Singulier de יָכֹל après les deux rois coordonnés
  choice: mais il ne put
  alternative: mais ils ne purent
  rationale: 'Le singulier massorétique est maintenu afin de préserver l’ambiguïté: il peut viser l’un des rois, notamment le sujet principal ou le plus proche, ou refléter une construction collective. La traduction ne l’harmonise pas au pluriel.'
translation_notes:
  register: Français international moderne, narratif et digne. Les formes traditionnelles françaises des noms propres facilitent la lecture. Le tour « combattre contre elle » reste légèrement formel afin de suivre précisément le texte, tandis que les notes signalent les deux points susceptibles d’être autrement rendus.
