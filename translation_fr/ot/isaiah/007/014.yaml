review_pass:
  verdict: revise
  source_fidelity: La forme massorétique וְקָרָאת est le plus directement un verbe à la 2e personne féminine du singulier (« tu donneras/appelleras »), non une 3e personne féminine (« elle donnera »). Le texte principal doit donc conserver cette personne, même si le changement d’adresse est abrupt. Pour הָרָה וְיֹלֶדֶת, « est enceinte et va mettre au monde » rend plus naturellement en français l’état présent suivi du participe à valeur imminente, sans suggérer qu’elle accouche simultanément tout en étant enceinte.
  naturalness: « Va mettre au monde » est idiomatique et évite la difficulté de « est enceinte et met au monde ». « Donner le nom » est une expression française naturelle. L’ancrage de la note sur la personne verbale doit se trouver au verbe concerné.
  terminology: « Le Seigneur », « signe », « la jeune femme » et « Emmanuel » sont appropriés. La note sur « la vierge » préserve correctement la réception grecque et matthéenne sans faire de cette lecture le sens lexical imposé de עַלְמָה.
  issues:
  - severity: high
    issue: La proposition principale rend וְקָרָאת par « elle lui donnera le nom ».
    rationale: Dans le texte massorétique fourni, וְקָרָאת se lit le plus directement comme une 2e personne féminine singulière. « Elle » ne correspond pas à cette forme et ne doit pas être retenu comme lecture principale.
  - severity: medium
    issue: « Est enceinte et met au monde » juxtapose en français deux actions difficilement simultanées.
    rationale: Le participe hébreu peut exprimer une action imminente; « va mettre au monde » conserve cette ouverture aspectuelle dans un français plus cohérent.
  - severity: low
    issue: La note textuelle est ancrée sur « Emmanuel » plutôt que sur l’acte de nommer.
    rationale: L’ancre doit signaler précisément l’élément affecté par la variante de personne grammaticale.
