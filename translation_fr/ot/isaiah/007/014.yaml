revisions:
- from: 'C’est pourquoi le Seigneur lui-même vous donnera un signe : voici, la jeune femme[a] est enceinte et met au monde un fils[b] ; elle lui donnera le nom d’Emmanuel[c][d].'
  to: 'C’est pourquoi le Seigneur lui-même vous donnera un signe : voici, la jeune femme[a] est enceinte et va mettre au monde un fils[b] ; tu lui donneras[c] le nom d’Emmanuel[d].'
  rationale: La révision corrige la personne grammaticale du verbe massorétique וְקָרָאת et replace la note de variante à l’endroit concerné. Elle remplace aussi le présent « met au monde » par une tournure française exprimant naturellement l’imminence compatible avec le participe hébreu. Les autres choix lexicaux et les notes de réception sont conservés dans leur orientation non confessionnelle.
