language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ֠/כֵן יִתֵּ֨ן אֲדֹנָ֥/י ה֛וּא לָ/כֶ֖ם א֑וֹת הִנֵּ֣ה הָ/עַלְמָ֗ה הָרָה֙ וְ/יֹלֶ֣דֶת בֵּ֔ן וְ/קָרָ֥את שְׁמ֖/וֹ עִמָּ֥נוּ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/014.yaml
  text: 'Therefore the Lord himself will give you a sign: behold[a], the young woman is pregnant and is bearing a son[d][c][b], and she will call his name Immanuel.'
translation:
  language: fr
  text: 'C’est pourquoi le Seigneur lui-même vous donnera un signe : voici, la jeune femme[a] est enceinte et va mettre au monde un fils[b] ; tu lui donneras[c] le nom d’Emmanuel[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vierge ». Le mot hébreu עַלְמָה désigne une jeune femme ; la Septante grecque le traduit ici par un terme souvent compris au sens de « vierge », et Matthieu 1.23 cite le verset sous cette forme.
    reason: alternative_reading
  - marker: b
    text: 'Traduction traditionnelle : « concevra et enfantera un fils ». Plus littéralement, l’hébreu présente la femme comme enceinte et sur le point de mettre au monde un fils.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou « elle lui donnera le nom ». Le texte massorétique se lit le plus directement « tu lui donneras le nom » ; certaines traditions textuelles reflètent une autre personne grammaticale. Matthieu 1.23 porte : « on l’appellera Emmanuel ».'
    reason: textual_variant
  - marker: d
    text: Emmanuel signifie « Dieu avec nous ».
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Ce connecteur introduit la conséquence du refus d’Ahaz et s’intègre naturellement au registre prophétique.
- source_word: אֲדֹנָי הוּא
  choice: le Seigneur lui-même
  rationale: אֲדֹנָי est rendu conventionnellement par « le Seigneur », tandis que le pronom indépendant הוּא apporte l’insistance exprimée par « lui-même ».
- source_word: לָכֶם
  choice: vous
  rationale: Le pronom hébreu est au pluriel et vise Ahaz ainsi que la maison de David ; le français « vous » conserve cette possibilité sans l’expliciter artificiellement.
- source_word: אוֹת
  choice: un signe
  rationale: Rendu courant d’un signe donné par Dieu comme confirmation ou présage.
- source_word: הִנֵּה
  choice: voici
  rationale: « Voici » conserve la force déictique et solennelle du terme tout en restant naturel en français moderne.
- source_word: הָעַלְמָה
  choice: la jeune femme
  rationale: עַלְמָה désigne une jeune femme en âge de se marier sans exprimer lexicalement, à lui seul, la virginité. La traduction traditionnelle « la vierge » est signalée en note en raison de la Septante et de Matthieu 1.23.
- source_word: הָרָה
  choice: est enceinte
  rationale: La forme décrit un état présent ; « est enceinte » la rend clairement sans la transformer en futur.
- source_word: וְיֹלֶדֶת
  choice: et met au monde
  rationale: Le participe féminin présente l’action comme en cours ou imminente. Cette formulation française conserve cette tension mieux qu’un simple futur, malgré une légère compression idiomatique.
- source_word: בֵּן
  choice: un fils
  rationale: Rendu direct et idiomatique du nom hébreu.
- source_word: וְקָרָאת שְׁמוֹ
  choice: elle lui donnera le nom
  rationale: Le texte massorétique porte une forme féminine singulière, dont le sujet naturel est la jeune femme. « Donner le nom » rend en français actuel l’expression hébraïque littérale « appeler son nom ».
- source_word: עִמָּנוּ אֵל
  choice: Emmanuel
  rationale: La forme française traditionnelle du nom est conservée ; sa signification est donnée en note.
theological_decisions:
- issue: Sens de הָעַלְמָה dans une prophétie reçue comme messianique
  choice: la jeune femme
  alternative: la vierge
  rationale: Le texte principal suit d’abord la portée lexicale de l’hébreu, qui ne précise pas explicitement la virginité. La note conserve néanmoins la lecture de la Septante et son emploi en Matthieu 1.23, sans confondre les données des différentes formes textuelles.
- issue: Valeur temporelle de הָרָה וְיֹלֶדֶת
  choice: est enceinte et met au monde
  alternative: concevra et enfantera
  rationale: L’hébreu associe un adjectif exprimant l’état de grossesse à un participe. Le présent français reflète cette présentation tout en laissant au contexte la relation exacte entre état actuel, imminence et accomplissement futur.
- issue: Personne qui donne son nom à l’enfant
  choice: elle lui donnera le nom
  alternative: tu lui donneras le nom ; on lui donnera le nom
  rationale: La vocalisation massorétique donnée se lit le plus directement comme un féminin singulier. D’autres traditions anciennes reflètent une autre personne ou une formulation indéfinie ; la note maintient cette variation visible.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la solennité prophétique ; « elle lui donnera le nom » évite le calque peu naturel « elle appellera son nom ». Le texte conserve l’état présent de la grossesse et la tension aspectuelle du participe hébreu, les lectures traditionnelles étant exposées en notes.
