  text: נַעֲלֶ֤ה בִֽ/יהוּדָה֙ וּ/נְקִיצֶ֔/נָּה וְ/נַבְקִעֶ֖/נָּה אֵלֵ֑י/נוּ וְ/נַמְלִ֥יךְ מֶ֨לֶךְ֙ בְּ/תוֹכָ֔/הּ אֵ֖ת בֶּן טָֽבְאַֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/006.yaml
  text: Let us go up against Judah[a], and terrify her, and break her open for ourselves[b], and make the son of Tabeel king in her midst.
translation:
  language: fr
  text: Montons contre Juda, semons-y la panique[a], ouvrons-nous une brèche en elle[b] et établissons comme roi en son sein le fils de Tabéel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « inspirons-lui l’effroi », « tourmentons-la » ou « harcelons-la ». Le verbe hébreu est difficile ; le texte retient ici l’idée de provoquer la peur ou la panique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « fendons-la pour nous » ; « pratiquons-y une brèche pour nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲלֶה בִיהוּדָה
  choice: Montons contre Juda
  rationale: Dans ce contexte militaire, עלה avec la préposition ב exprime une marche hostile contre un territoire. « Monter contre » conserve l’image hébraïque tout en restant idiomatique en français biblique moderne.
- source_word: וּנְקִיצֶנָּה
  choice: semons-y la panique
  rationale: La forme causative de קוץ est difficile ici. Dans le contexte d’une invasion, elle évoque vraisemblablement la peur ou l’affolement provoqués chez Juda. Cette formulation naturelle conserve cette valeur sans prétendre lever entièrement l’incertitude lexicale.
- source_word: וְנַבְקִעֶנָּה אֵלֵינוּ
  choice: ouvrons-nous une brèche en elle
  rationale: בקע signifie fendre, ouvrir ou pratiquer une brèche. Le pronom réfléchi « nous » rend la valeur d’intérêt ou d’appropriation de אֵלֵינוּ, tandis que « en elle » maintient la personnification féminine de Juda.
- source_word: וְנַמְלִיךְ מֶלֶךְ
  choice: établissons comme roi
  rationale: Le hiphil de מלך signifie faire régner quelqu’un ou l’installer comme roi. « Établir comme roi » est clair et naturel en français.
- source_word: בְּתוֹכָהּ
  choice: en son sein
  rationale: Le suffixe féminin renvoie à Juda personnifiée. « En son sein » préserve ce trait avec une formulation française digne et naturelle.
- source_word: בֶּן טָבְאַל
  choice: le fils de Tabéel
  rationale: בֶּן est pris comme le nom commun « fils », suivi du nom propre טָבְאַל, translittéré « Tabéel ».
theological_decisions:
- issue: Personnification féminine de Juda
  choice: Maintenir la référence féminine par « en elle » et « en son sein »
  alternative: Employer des formes impersonnelles telles que « y » ou « en son milieu » partout
  rationale: Les suffixes hébreux sont féminins et présentent Juda comme une entité personnifiée. La traduction conserve ce trait grammatical et littéraire sans lui ajouter de portée doctrinale.
translation_notes:
  register: Français international actuel, soutenu sans archaïsme. L’impératif de projet collectif est rendu par des subjonctifs exhortatifs à la première personne du pluriel. La personnification féminine de Juda est conservée, tandis que les deux difficultés lexicales principales sont signalées en notes.
