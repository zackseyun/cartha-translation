  source_fidelity: Le texte rend fidèlement חֶמְאָה וּדְבַשׁ (« lait caillé et miel »), le futur de יֹאכֵל, ainsi que le parallélisme moral « rejeter le mal et choisir le bien ». « Quand il saura » est une restitution temporelle idiomatique et prudente de לְדַעְתּוֹ, sans imposer une relation causale entre le régime alimentaire et le discernement.
