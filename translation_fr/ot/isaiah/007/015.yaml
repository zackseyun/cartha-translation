id: ISA.7.15
reference: Isaiah 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֶמְאָ֥ה וּ/דְבַ֖שׁ יֹאכֵ֑ל לְ/דַעְתּ֛/וֹ מָא֥וֹס בָּ/רָ֖ע וּ/בָח֥וֹר בַּ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/015.yaml
  text: He will eat curds and honey by the time he knows to refuse the evil and choose the good[a][b].
translation:
  language: fr
  text: Il mangera du lait caillé et du miel quand il saura rejeter le mal et choisir le bien[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’il sache rejeter le mal et choisir le bien ». L’expression hébraïque peut indiquer la période durant laquelle cette alimentation se poursuit.'
    reason: alternative_reading
  - marker: b
    text: Le terme traduit par « lait caillé » peut aussi désigner du beurre ou de la crème, plus généralement un produit laitier épais.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: lait caillé
  rationale: Le nom désigne un produit laitier épais ou fermenté, sans correspondre nécessairement au beurre moderne. « Lait caillé » est clair en français et convient à son association avec le miel.
- source_word: וּדְבַשׁ
  choice: et du miel
  rationale: Traduction usuelle de דבש, avec maintien simple de la coordination.
- source_word: יֹאכֵל
  choice: il mangera
  rationale: Dans le contexte prophétique concernant l’enfant, l’inaccompli hébreu se rend naturellement par le futur.
- source_word: לְדַעְתּוֹ
  choice: quand il saura
  rationale: La préposition ל avec l’infinitif construit et le suffixe reçoit ici une valeur temporelle. Cette formulation française reste naturelle sans faire de l’alimentation la cause du discernement.
- source_word: מָאוֹס
  choice: rejeter
  rationale: Dans l’opposition morale avec « choisir », le verbe exprime le refus résolu du mal plutôt qu’un simple sentiment de mépris.
- source_word: בָּרָע
  choice: le mal
  rationale: L’article hébreu est conservé dans l’expression française courante, en parallèle avec « le bien ».
- source_word: וּבָחוֹר
  choice: et choisir
  rationale: « Choisir » rend directement l’infinitif, parallèle à « rejeter ».
- source_word: בַּטּוֹב
  choice: le bien
  rationale: La forme définie est conservée et équilibre « le mal » dans l’opposition morale.
theological_decisions:
- issue: Valeur temporelle de לְדַעְתּוֹ par rapport à l’alimentation de l’enfant et à son discernement moral
  choice: « quand il saura rejeter le mal et choisir le bien »
  alternative: « jusqu’à ce qu’il sache » ou « au moment où il saura »; une lecture finale, « afin qu’il sache », est aussi grammaticalement envisageable mais moins probable ici.
  rationale: La construction admet une lecture temporelle naturelle dans ce contexte. « Quand » préserve le lien chronologique sans affirmer que les aliments produisent le discernement moral ni préciser excessivement un terme temporel.
translation_notes:
  register: Français international moderne, simple et digne. « Lait caillé » est plus immédiatement intelligible que « caillé » employé seul; « rejeter le mal et choisir le bien » conserve le parallélisme moral de l’hébreu.
