  text: וְ/הָיָ֗ה מֵ/רֹ֛ב עֲשׂ֥וֹת חָלָ֖ב יֹאכַ֣ל חֶמְאָ֑ה כִּֽי חֶמְאָ֤ה וּ/דְבַשׁ֙ יֹאכֵ֔ל כָּל הַ/נּוֹתָ֖ר בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/022.yaml
  text: And it will happen that because of the abundance of milk he gives[a], he will eat curds; for everyone left in the midst of the land will eat curds and honey.
translation:
  language: fr
  text: Il arrivera que, à cause de l’abondance du lait produit, il mangera du lait caillé[a] ; car tous ceux qui resteront au milieu du pays mangeront du lait caillé et du miel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du beurre ». Le terme hébreu peut désigner plus largement un produit laitier caillé ou épaissi, et non uniquement le beurre au sens moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Comme… il mangera
  rationale: La tournure française exprime naturellement la situation future annoncée par la formule hébraïque, sans alourdir le verset par un calque tel que « il arrivera que ».
- source_word: מֵרֹב עֲשׂוֹת חָלָב
  choice: Comme le lait sera produit en abondance
  rationale: Cette formulation rend la valeur causale de מֵרֹב et le sens de production de עֲשׂוֹת חָלָב, tout en évitant d’ajouter un sujet explicite que l’hébreu ne nomme pas ici.
- source_word: יֹאכַל חֶמְאָה
  choice: il mangera du lait caillé
  rationale: חֶמְאָה désigne ici vraisemblablement un produit laitier épaissi ou caillé plutôt que nécessairement le beurre moderne.
- source_word: כִּי
  choice: car
  rationale: Le mot introduit l’explication qui élargit à tous les survivants la situation d’abord décrite au singulier.
- source_word: כָּל הַנּוֹתָר
  choice: tous ceux qui resteront
  rationale: Le participe substantivé désigne l’ensemble des personnes qui subsisteront dans le pays.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au milieu du pays
  rationale: Cette expression conserve la nuance spatiale de בְּקֶרֶב, plus précise qu’un simple « dans le pays ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation impersonnelle « le lait sera produit » préserve l’absence de sujet explicite dans l’expression hébraïque et évite de préciser indûment quels animaux produisent le lait.
