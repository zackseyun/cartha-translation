  register: Français international moderne, sobre et imagé. « Se poser » maintient le lien contextuel avec les mouches et les abeilles sans rendre explicite un référent que le verset laisse sous-entendu. Les deux expressions hébraïques incertaines sont traduites lisiblement, avec leurs principales alternatives en notes.
