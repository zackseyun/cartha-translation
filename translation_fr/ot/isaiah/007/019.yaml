base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/019.yaml
  text: And they will all come and settle in the steep ravines[a], in the clefts of the rocks, in all the thornbushes[c][b], and in all the watering places.
translation:
  language: fr
  text: Ils viendront tous se poser dans les ravins escarpés[a], dans les fentes des rochers, dans tous les buissons épineux et dans tous les pâturages[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile; on l’a aussi comprise comme « les vallées désolées » ou « les ravins abrupts ».
    reason: lexical_alternative
  - marker: b
    text: Le dernier terme hébreu est rare et incertain; il peut aussi désigner des points d’eau ou des prairies.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ וְנָחוּ כֻלָּם
  choice: Ils viendront tous se poser
  rationale: La suite prophétique reçoit ici une valeur future. נוח évoque le fait de venir au repos ou de se poser; dans le contexte des mouches et des abeilles du verset précédent, « se poser » rend naturellement l’image sans effacer le sens de repos ou d’installation.
- source_word: בְּנַחֲלֵי הַבַּתּוֹת
  choice: dans les ravins escarpés
  rationale: נַחֲלֵי désigne des vallées encaissées, des oueds ou des ravins. הַבַּתּוֹת est difficile; « escarpés » exprime prudemment l’idée d’un terrain abrupt suggérée par plusieurs analyses, tandis qu’une note conserve l’incertitude.
- source_word: וּבִנְקִיקֵי הַסְּלָעִים
  choice: dans les fentes des rochers
  rationale: נְקִיקִים désigne des fissures ou fentes, et סְּלָעִים des rochers; cette formulation est concrète, fidèle et naturelle en français.
- source_word: וּבְכֹל הַנַּעֲצוּצִים
  choice: dans tous les buissons épineux
  rationale: Le substantif désigne une végétation épineuse. « Buissons épineux » est clair pour un lectorat moderne et convient à des essaims qui viennent se poser.
- source_word: וּבְכֹל הַנַּהֲלֹלִים
  choice: dans tous les pâturages
  rationale: Le terme est rare et de sens incertain. « Pâturages » correspond à une compréhension lexicale plausible et forme un contraste naturel avec les lieux rocheux et épineux; les autres possibilités sont signalées en note.
