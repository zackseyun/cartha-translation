source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶֽל יְשַׁעְיָהוּ֒ צֵא נָא֙ לִ/קְרַ֣את אָחָ֔ז אַתָּ֕ה וּ/שְׁאָ֖ר יָשׁ֣וּב בְּנֶ֑/ךָ אֶל קְצֵ֗ה תְּעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה אֶל מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/003.yaml
  text: Then Yahweh said to Isaiah[a], “Go out now to meet Ahaz, you and Shear-jashub your son, at the end of the conduit of the upper pool[b], on the road to the launderer’s field.”
translation:
  language: fr
  text: 'Yahweh dit à Ésaïe : « Sors donc à la rencontre d’Ahaz, toi et ton fils Shéar-Yashoub[a], au bout du canal du bassin supérieur, sur la route du champ du blanchisseur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Shéar-Yashoub signifie « Un reste reviendra ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du champ du foulon ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de préserver le nom divin plutôt que de lui substituer un titre.
- source_word: צֵא נָא
  choice: Sors maintenant
  rationale: L’impératif צֵא signifie « sors »; נָא ajoute ici une nuance d’insistance que « maintenant » exprime naturellement.
- source_word: לִקְרַאת
  choice: à la rencontre de
  rationale: 'La construction exprime le but du déplacement : Ésaïe doit sortir pour rencontrer Ahaz.'
- source_word: אַתָּה וּשְׁאָר יָשׁוּב בְּנֶךָ
  choice: toi et ton fils Shéar-Yashoub
  rationale: La syntaxe identifie Shéar-Yashoub comme le fils d’Ésaïe; l’ordre est adapté au français naturel.
- source_word: שְׁאָר יָשׁוּב
  choice: Shéar-Yashoub
  rationale: Le nom propre est translittéré dans le texte, tandis que sa signification, importante dans le contexte d’Ésaïe, est donnée en note.
- source_word: קְצֵה
  choice: à l’extrémité de
  rationale: Dans cette indication topographique introduite par אֶל, le terme désigne le point d’arrivée situé au bout du canal.
- source_word: תְּעָלַת
  choice: canal
  rationale: Le mot désigne un conduit ou canal aménagé pour l’eau; « canal » est clair et naturel en français moderne.
- source_word: הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: du réservoir supérieur
  rationale: בְּרֵכָה peut désigner un bassin ou réservoir; « réservoir » convient au contexte des installations hydrauliques et « supérieur » préserve l’indication topographique.
- source_word: מְסִלַּת
  choice: sur la route de
  rationale: Le nom désigne une voie ou chaussée; « sur la route de » rend naturellement la localisation.
- source_word: שְׂדֵה כוֹבֵס
  choice: du champ du blanchisseur
  rationale: כּוֹבֵס désigne celui qui lave ou nettoie les étoffes. « Blanchisseur » est compréhensible en français actuel; la note conserve l’autre terme traditionnel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte hébreu emploie directement le tétragramme. La translittération « Yahweh » préserve le nom personnel sans le remplacer par un titre.
translation_notes:
  register: Français international moderne, naturel et digne. Les indications topographiques restent concrètes; le nom symbolique du fils est translittéré dans le texte et expliqué en note.
