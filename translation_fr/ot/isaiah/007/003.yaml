  terminology: « Yahweh », « Ésaïe », « Ahaz », « Shéar-Yashoub », « canal » et « blanchisseur » conviennent au français international moderne. La note sur le nom conserve utilement sa portée lexicale sans traduire le nom dans le corps du texte. « Foulon » est une alternative traditionnelle valable.
  issues:
