source:
  edition: WLC
  text: כִּ֣י רֹ֤אשׁ אֲרָם֙ דַּמֶּ֔שֶׂק וְ/רֹ֥אשׁ דַּמֶּ֖שֶׂק רְצִ֑ין וּ/בְ/ע֗וֹד שִׁשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה יֵחַ֥ת אֶפְרַ֖יִם מֵ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/008.yaml
  text: For the head of Aram is Damascus[a], and the head of Damascus is Rezin; and within sixty-five years Ephraim will be shattered from being a people.
translation:
  language: fr
  text: Car la tête d’Aram est Damas, et la tête de Damas est Retsîn ; dans soixante-cinq ans, Éphraïm sera brisé au point de ne plus être un peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Éphraïm sera brisé et cessera d’être un peuple. »'
    reason: La construction מֵעָם après יֵחַת peut être rendue par une coordination française plutôt que par l’expression du résultat « au point de ne plus être ».
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’avertissement précédent; « car » conserve ce lien logique dans un français naturel et soutenu.
- source_word: רֹאשׁ
  choice: tête
  rationale: Le sens métaphorique de « tête » est conservé afin de respecter le parallélisme entre la ville dominante d’Aram et le roi qui domine Damas; « capitale » ne conviendrait pas à la seconde proposition.
- source_word: אֲרָם
  choice: Aram
  rationale: La translittération du nom hébreu évite l’anachronisme possible de « Syrie » et préserve la désignation historique du texte.
- source_word: דַּמֶּשֶׂק
  choice: Damas
  rationale: Forme française courante du nom de lieu.
- source_word: רְצִין
  choice: Retsîn
  rationale: Translittération française claire du nom propre hébreu.
- source_word: וּבְעוֹד
  choice: Mais dans
  rationale: La construction indique un délai encore à courir jusqu’à l’événement. « Dans » l’exprime naturellement; « mais » rend ici la progression contrastive portée par le waw dans le contexte.
- source_word: שִׁשִּׁים וְחָמֵשׁ שָׁנָה
  choice: soixante-cinq ans
  rationale: Formulation numérique normale en français contemporain.
- source_word: יֵחַת
  choice: sera brisé
  rationale: Le niphal de חתת annonce l’effondrement décisif d’Éphraïm comme entité nationale. « Sera brisé » reste proche de l’image hébraïque sans la surinterpréter.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom employé dans le texte est maintenu plutôt que remplacé par une explication telle que « le royaume du Nord ».
- source_word: מֵעָם
  choice: et cessera d’être un peuple
  rationale: Cette tournure française exprime naturellement la séparation d’avec le statut de peuple impliquée par מִן, tout en gardant la portée nationale de עַם.
theological_decisions:
- issue: Portée syntaxique de מֵעָם après יֵחַת
  choice: « sera brisé et cessera d’être un peuple »
  alternative: « sera brisé, de sorte qu’il ne sera plus un peuple »
  rationale: L’hébreu peut décrire la perte du statut de peuple par séparation ou présenter plus explicitement son résultat. Le texte principal privilégie une formulation française concise, tandis que la note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme et la métaphore répétée de la « tête » sont conservés. La ponctuation en deux phrases évite une période trop lourde tout en maintenant le lien argumentatif.
