  revision_rationale: La révision supprime l’opposition non marquée par « mais », maintient le parallélisme métaphorique et formule la perte du statut de peuple comme résultat de l’effondrement annoncé. La note est repositionnée après la proposition concernée et offre désormais une véritable variante de formulation française.
