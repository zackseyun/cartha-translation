revisions:
- from: Car la tête d’Aram, c’est Damas, et la tête de Damas, c’est Retsîn. Mais dans soixante-cinq ans, Éphraïm sera brisé et cessera d’être un peuple.[a]
  to: Car la tête d’Aram est Damas, et la tête de Damas est Retsîn ; dans soixante-cinq ans, Éphraïm sera brisé au point de ne plus être un peuple.[a]
  rationale: La révision supprime l’opposition non marquée par « mais », maintient le parallélisme métaphorique et formule la perte du statut de peuple comme résultat de l’effondrement annoncé. La note est repositionnée après la proposition concernée et offre désormais une véritable variante de formulation française.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement le parallélisme « tête d’Aram / tête de Damas » et conserve à juste titre les noms Aram, Damas, Retsîn et Éphraïm. Toutefois, le waw avant בְּעוֹד est additif dans ce verset, non contrastif : « Mais » ajoute une opposition absente du texte. La formulation révisée rend le délai et l’issue de מֵעָם sans surinterprétation.'
  naturalness: « La tête d’Aram est Damas » conserve la métaphore tout en restant naturel dans un registre biblique moderne. « Dans soixante-cinq ans » est idiomatique. « Au point de ne plus être un peuple » explicite naturellement en français le résultat national exprimé par la construction hébraïque.
  terminology: « Aram », « Damas », « Retsîn » et « Éphraïm » sont appropriés en français international. « Tête » doit être maintenu plutôt que « capitale », car le second membre désigne une personne. « Brisé » convient au niphal de חתת.
  issues:
  - severity: medium
    issue: « Mais » devant « dans soixante-cinq ans »
    rationale: Le texte hébreu porte un waw de coordination (וּבְעוֹד), sans marqueur explicite d’opposition. « Mais » impose un contraste que ni le texte source ni la traduction anglaise n’expriment.
  - severity: low
    issue: La note ne préserve pas une alternative distincte du texte principal
    rationale: Le texte principal « cessera d’être un peuple » et la note « ne sera plus un peuple » sont presque synonymes. Une note utile doit présenter une formulation syntaxiquement différente et clairement identifiée comme telle.
  revised_text: Car la tête d’Aram est Damas, et la tête de Damas est Retsîn ; dans soixante-cinq ans, Éphraïm sera brisé au point de ne plus être un peuple.[a]
