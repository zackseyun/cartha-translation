base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/017.yaml
  text: Yahweh will bring upon you[a], upon your people[b], and upon your father's house days unlike any that have not come since the day Ephraim turned away from Judah—namely, the king of Assyria.
translation:
  language: fr
  text: Yahweh fera venir sur toi, sur ton peuple et sur la maison de ton père[a] des jours comme il n’en est pas venu depuis le jour où Éphraïm s’est détourné de Juda — le roi d’Assyrie.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la maison de ton père » peut désigner plus précisément la lignée ancestrale ou la maison royale d’Achaz.
    reason: cultural_note
  - marker: b
    text: 'La fin de la phrase est abrupte en hébreu. On peut comprendre : « c’est-à-dire le roi d’Assyrie » ou « en faisant venir le roi d’Assyrie ».'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: יָבִיא
  choice: fera venir
  rationale: Le hiphil de בוא a un sens causatif. « Fera venir » le restitue directement et convient aussi bien aux « jours » qu’au « roi d’Assyrie » placé à la fin de la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin préserve ici le nom propre exprimé par le tétragramme, plutôt que de le remplacer par un titre.
- source_word: עָלֶיךָ ... וְעַל עַמְּךָ ... וְעַל בֵּית אָבִיךָ
  choice: sur toi, sur ton peuple et sur la maison de ton père
  rationale: La répétition de עַל est rendue par « sur », avec une cadence solennelle. « Maison de ton père » conserve l’expression sociale et familiale hébraïque sans la réduire d’emblée à la seule dynastie royale.
- source_word: יָמִים אֲשֶׁר לֹא בָאוּ
  choice: des jours comme il n’en était pas venu
  rationale: Cette tournure française naturelle maintient explicitement la négation hébraïque et exprime le caractère sans précédent des jours annoncés.
- source_word: לְמִיּוֹם סוּר אֶפְרַיִם מֵעַל יְהוּדָה
  choice: depuis le jour où Éphraïm s’est détourné de Juda
  rationale: סור signifie se détourner, s’écarter ou se séparer. « S’est détourné » reste proche du lexème sans expliciter excessivement la rupture politique entre les royaumes.
- source_word: אֵת מֶלֶךְ אַשּׁוּר
  choice: — le roi d’Assyrie
  rationale: Le groupe final est conservé sous une forme abrupte, comme en hébreu. Le tiret permet de le lire comme la précision culminante de la calamité annoncée sans ajouter dans le texte principal un lien explicatif absent de la formulation source.
theological_decisions:
- issue: Rapport syntaxique entre les « jours » annoncés et « le roi d’Assyrie »
  choice: 'Conserver l’apposition abrupte au moyen d’un tiret : « — le roi d’Assyrie »'
  alternative: 'Expliciter : « c’est-à-dire le roi d’Assyrie » ou « en faisant venir le roi d’Assyrie »'
  rationale: Le roi d’Assyrie apparaît comme le point culminant et l’instrument concret du malheur annoncé, mais la syntaxe hébraïque demeure abrupte. La formulation retenue préserve cette tension au lieu d’imposer une seule explicitation.
- issue: Portée du jugement
  choice: Le malheur atteint personnellement Achaz, son peuple et sa maison paternelle ou royale
  alternative: Limiter l’annonce au royaume de Juda pris collectivement
  rationale: Les trois compléments distincts du texte hébreu doivent rester visibles; ils donnent à l’annonce une portée personnelle, nationale et familiale ou dynastique.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est préservée par la triple construction avec « sur » et par le tiret final. La tournure « comme il n’en était pas venu » évite le contresens d’une double négation française tout en maintenant le לֹא hébreu.
