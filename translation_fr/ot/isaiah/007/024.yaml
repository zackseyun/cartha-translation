  yaml_path: translation/ot/isaiah/007/024.yaml
  text: One will come there with arrows and with a bow[b][a], because all the land will become briers and thorns.
translation:
  language: fr
  text: On y viendra avec des flèches et un arc[a], car tout le pays ne sera plus que ronces et épines[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il y viendra avec des flèches et un arc » ; le verbe hébreu est à la troisième personne du masculin singulier et peut être compris dans un sens générique.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car tout le pays sera ronces et épines ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחִצִּים וּבַקֶּשֶׁת
  choice: avec des flèches et un arc
  rationale: Le ב instrumental indique l’équipement emporté. En français courant, les articles indéfinis rendent naturellement cette association d’armes servant à la chasse ou à la protection.
- source_word: יָבוֹא
  choice: on y viendra
  rationale: Le verbe est au masculin singulier, mais peut avoir une valeur générique. Le pronom « on » conserve cette indétermination sans imposer un homme précis.
- source_word: שָׁמָּה
  choice: y
  rationale: Avec le verbe « venir », le pronom adverbial « y » exprime naturellement le sens de « là, à cet endroit ».
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison pour laquelle il faudra venir armé. « Car » convient au registre prophétique tout en restant clair.
- source_word: שָׁמִיר וָשַׁיִת
  choice: ronces et épines
  rationale: Cette paire récurrente chez Ésaïe décrit une végétation épineuse envahissante, signe d’abandon et de désolation; l’ordre hébreu est conservé.
- source_word: תִּהְיֶה
  choice: sera couvert de
  rationale: Le verbe signifie littéralement « sera ». Dans ce contexte, « sera couvert de » exprime naturellement en français que toute la région sera envahie par cette végétation, sans changer l’état résultant décrit.
- source_word: כָל הָאָרֶץ
  choice: tout le pays
  rationale: Dans ce contexte, אֶרֶץ désigne le pays ou la région touchée par le jugement, non la planète entière. « Tout le pays » préserve la portée globale dans ce cadre local.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « on y viendra » rend la valeur générique possible du singulier hébreu; la formulation principale explicite légèrement l’idée d’un pays envahi par la végétation, tandis que la note conserve la structure littérale.
