  text: וְ/הָיָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא יְחַיֶּה אִ֛ישׁ עֶגְלַ֥ת בָּקָ֖ר וּ/שְׁתֵּי צֹֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/021.yaml
  text: And in that day a man will keep alive a young cow and two sheep[a][b].
translation:
  language: fr
  text: En ce jour-là, un homme gardera en vie une jeune vache[a] et deux bêtes de petit bétail[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une génisse ». L’expression hébraïque désigne une jeune femelle bovine.
    reason: lexical_alternative
  - marker: b
    text: Le mot hébreu צֹאן est un terme collectif désignant le petit bétail, notamment les moutons et les chèvres.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: La formule prophétique annonce ce qui se produira au moment indiqué. En français, la tournure concise « En ce jour-là » restitue naturellement la valeur future portée par l’ensemble de la phrase sans ajouter le lourd « il arrivera que ».
- source_word: יְחַיֶּה
  choice: gardera en vie
  rationale: Le piel de חיה signifie ici maintenir ou conserver en vie. « Gardera en vie » préserve ce sens concret, plutôt que de suggérer principalement l’élevage ou la reproduction.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est un singulier masculin et présente ici un individu représentatif; « un homme » en conserve directement la forme.
- source_word: עֶגְלַת בָּקָר
  choice: une jeune vache
  rationale: La construction désigne une jeune femelle bovine. « Jeune vache » est immédiatement compréhensible, tandis que « génisse », plus précis, est moins courant.
- source_word: וּשְׁתֵּי צֹאן
  choice: et deux bêtes de petit bétail
  rationale: צֹאן est un collectif qui peut englober les moutons et les chèvres. « Bêtes de petit bétail » conserve cette extension sémantique sans choisir arbitrairement une espèce.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et digne. La formulation reste concrète et accessible; « petit bétail » est retenu comme terme agricole courant afin de préserver l’imprécision réelle du collectif hébreu.
