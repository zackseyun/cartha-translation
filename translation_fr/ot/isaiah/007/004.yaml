  text: וְ/אָמַרְתָּ֣ אֵ֠לָי/ו הִשָּׁמֵ֨ר וְ/הַשְׁקֵ֜ט אַל תִּירָ֗א וּ/לְבָבְ/ךָ֙ אַל יֵרַ֔ךְ מִ/שְּׁנֵ֨י זַנְב֧וֹת הָ/אוּדִ֛ים הָ/עֲשֵׁנִ֖ים הָ/אֵ֑לֶּה בָּ/חֳרִי אַ֛ף רְצִ֥ין וַ/אֲרָ֖ם וּ/בֶן רְמַלְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/004.yaml
  text: and say to him[a], ‘Be careful and stay calm. Do not fear, and do not let your heart be faint because of these two smoldering stubs of firebrands—because of the burning anger of Rezin and Aram, and the son of Remaliah.’
translation:
  language: fr
  text: 'et tu lui diras : « Sois vigilant et garde ton calme. N’aie pas peur, et que ton cœur ne faiblisse pas à cause de ces deux extrémités de tisons fumants[a], à cause de la colère ardente de Retsîn et d’Aram, et du fils de Remalia. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les deux queues de ces tisons fumants ». L’image présente Retsîn et le fils de Remalia comme les extrémités de morceaux de bois partiellement consumés, qui fument encore mais sont près de s’éteindre.'
    reason: Précision sur la métaphore littérale et sa portée.
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Sois vigilant
  rationale: L’impératif nifal appelle ici Achaz à rester attentif et sur ses gardes. « Sois vigilant » est naturel et conserve la force de l’exhortation.
- source_word: וְהַשְׁקֵט
  choice: garde ton calme
  rationale: Le verbe שׁקט évoque le fait de demeurer tranquille, sans agitation. Dans ce contexte de menace politique, « garde ton calme » exprime clairement le sens visé.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Cette tournure française courante rend directement l’interdiction exprimée par l’hébreu, sans perdre la dignité du registre.
- source_word: וּלְבָבְךָ אַל יֵרַךְ
  choice: que ton cœur ne faiblisse pas
  rationale: L’expression hébraïque associe le cœur à l’idée de devenir mou ou faible, donc de perdre courage. La formulation française préserve l’image du cœur et son sens idiomatique.
- source_word: מִשְּׁנֵי זַנְבוֹת הָאוּדִים הָעֲשֵׁנִים הָאֵלֶּה
  choice: devant ces deux bouts de tisons fumants
  rationale: « Bouts » rend le sens métaphorique de זנבות, littéralement « queues », tandis que « tisons fumants » conserve l’image de morceaux de bois brûlés qui fument encore mais sont près de s’éteindre.
- source_word: בָּחֳרִי אַף
  choice: devant la colère ardente
  rationale: Cette expression rend l’idiome de la chaleur ou de l’embrasement de la colère et maintient le lien imagé avec les tisons fumants.
- source_word: רְצִין וַאֲרָם וּבֶן רְמַלְיָהוּ
  choice: de Retsîn et d’Aram, et du fils de Remalia
  rationale: La formulation conserve l’association inhabituelle de Retsîn avec Aram et maintient la désignation indirecte de Péqah comme « fils de Remalia », sans expliciter ce que le texte laisse implicite.
theological_decisions:
- issue: Conserver l’image des ennemis comme des menaces presque éteintes
  choice: Maintien de la métaphore « deux bouts de tisons fumants » dans le texte principal
  alternative: Paraphraser par « deux menaces sur le point de disparaître »
  rationale: 'L’image porte l’ironie prophétique : ces ennemis paraissent redoutables, mais Dieu les présente comme des restes de bois brûlé proches de l’extinction. La conserver évite d’aplatir la portée rhétorique et théologique.'
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe au roi Achaz. La métaphore prophétique est conservée, avec une note expliquant le terme littéral « queues ».
