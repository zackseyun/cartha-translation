  variant: modern international French
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָחָ֑ז לֹא אֶשְׁאַ֥ל וְ/לֹֽא אֲנַסֶּ֖ה אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/012.yaml
  text: But Ahaz said[a], “I will not ask[b], and I will not test Yahweh.”
translation:
  language: fr
  text: 'Mais Ahaz répondit : « Je ne demanderai pas, et je ne mettrai pas Yahweh à l’épreuve. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Mais … répondit
  rationale: La forme narrative fait progresser le récit; « mais » exprime ici l’opposition à l’invitation du verset précédent. Dans un dialogue, « répondit » est plus naturel en français que le littéral « dit ».
- source_word: אָחָז
  choice: Ahaz
  rationale: Translittération française usuelle du nom propre.
- source_word: לֹא אֶשְׁאַל
  choice: Je ne demanderai rien
  rationale: שׁאל signifie « demander ». L’ajout idiomatique de « rien » rend la construction française naturelle dans le contexte où Ahaz refuse de demander un signe.
- source_word: וְלֹא אֲנַסֶּה
  choice: et je ne mettrai … à l’épreuve
  rationale: Au piel, נסה signifie « éprouver, mettre à l’épreuve ». Cette formulation française est précise et évite l’ambiguïté moderne de « tenter », qui peut évoquer l’incitation au mal.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: La marque de l’objet direct אֶת n’est pas traduite; le tétragramme est rendu par sa forme courante « Yahweh », afin de conserver le nom divin présent dans l’hébreu.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Sens de אֲנַסֶּה appliqué à Dieu
  choice: mettre à l’épreuve
  alternative: éprouver; tenter
  rationale: « Mettre à l’épreuve » conserve le sens du verbe et l’écho à l’interdiction biblique d’éprouver Dieu, sans suggérer qu’Ahaz chercherait à l’inciter au mal.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination simple et la formulation directe conservent le caractère apparemment pieux du refus d’Ahaz sans en expliciter ici l’ironie contextuelle.
