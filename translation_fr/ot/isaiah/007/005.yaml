  yaml_path: translation/ot/isaiah/007/005.yaml
  text: Because Aram has planned evil against you, along with Ephraim and the son of Remaliah, saying,
translation:
  language: fr
  text: 'Parce qu’Aram a projeté du mal contre toi, avec Éphraïm et le fils de Remalia, en disant :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן כִּי
  choice: Parce que
  rationale: Introduit naturellement en français la cause donnée par le texte hébreu, dans la continuité syntaxique des versets voisins.
- source_word: יָעַץ עָלֶיךָ ... רָעָה
  choice: a projeté du mal contre toi
  rationale: Conserve l’idée de concevoir délibérément un dessein nuisible contre quelqu’un, sans préciser davantage la forme du mal.
- source_word: אֲרָם
  choice: Aram
  rationale: Reprend le nom géographique et politique hébreu plutôt que de le remplacer par une désignation interprétative.
- source_word: אֶפְרַיִם וּבֶן רְמַלְיָהוּ
  choice: avec Éphraïm et le fils de Remalia
  rationale: Le sujet grammatical principal est Aram; cette formulation française conserve l’association d’Éphraïm et du fils de Remalia au projet sans aplanir la syntaxe en sujet composé.
- source_word: לֵאמֹר
  choice: 'en disant :'
  rationale: Rend la formule introductive du discours direct et prépare la citation du verset suivant.
theological_decisions:
- issue: Identification du « fils de Remalia »
  choice: Conserver la désignation « le fils de Remalia »
  alternative: Remplacer ou expliciter par « Péqah »
  rationale: Le texte source emploie délibérément le patronyme; le conserver évite d’ajouter une identification absente de ce verset et respecte sa portée rhétorique possible.
translation_notes:
  register: Français international moderne, sobre et digne. « Projeter du mal » maintient le caractère intentionnel du complot tout en restant accessible. La phrase demeure ouverte, conformément au texte hébreu qui introduit les paroles rapportées au verset suivant.
