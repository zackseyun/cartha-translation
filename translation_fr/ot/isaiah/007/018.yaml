id: ISA.7.18
reference: Isaiah 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִשְׁרֹ֤ק יְהוָה֙ לַ/זְּב֔וּב אֲשֶׁ֥ר בִּ/קְצֵ֖ה יְאֹרֵ֣י מִצְרָ֑יִם וְ/לַ֨/דְּבוֹרָ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ אַשּֽׁוּר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/018.yaml
  text: And in that day Yahweh will whistle for the fly that is at the far end of the streams of Egypt[b][a], and for the bee that is in the land of Assyria.
translation:
  language: fr
  text: Ce jour-là, Yahweh sifflera[a] pour appeler la mouche qui se trouve à l’extrémité des cours d’eau d’Égypte[b], et l’abeille qui se trouve au pays d’Assyrie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « émettra un sifflement pour appeler ». Le verbe hébreu désigne un son aigu servant à appeler ou à donner un signal.
    reason: lexical_alternative
  - marker: b
    text: Les « cours d’eau d’Égypte » peuvent désigner plus précisément les bras du Nil ou les canaux d’Égypte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Cette formulation française naturelle rend l’introduction prophétique et sa perspective future sans conserver inutilement le tour hébreu littéral « il arrivera ».
- source_word: יִשְׁרֹק
  choice: sifflera pour appeler
  rationale: Le verbe désigne un son aigu servant à appeler ou à donner un signal. Cette expression rend clairement la fonction d’appel tout en conservant l’image concrète du sifflement.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération préserve le nom divin personnel au lieu de lui substituer un titre.
- source_word: לַזְּבוּב
  choice: la mouche
  rationale: Le singulier imagé de l’hébreu est maintenu, en parallèle avec « l’abeille ».
- source_word: אֲשֶׁר בִּקְצֵה יְאֹרֵי מִצְרָיִם
  choice: qui se trouve à l’extrémité des cours d’eau d’Égypte
  rationale: « À l’extrémité » conserve l’idée de limite ou d’éloignement, tandis que « cours d’eau » laisse ouverte la référence précise aux bras du Nil ou aux canaux.
- source_word: וְלַדְּבוֹרָה
  choice: et l’abeille
  rationale: Le singulier emblématique est conservé afin de respecter le parallélisme hébreu avec « la mouche ».
- source_word: אֲשֶׁר בְּאֶרֶץ אַשּׁוּר
  choice: qui se trouve au pays d’Assyrie
  rationale: « Au pays d’Assyrie » rend explicitement אֶרֶץ tout en restant naturel en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur / Jéhovah
  rationale: Le choix conserve le nom propre présent dans le texte hébreu plutôt que de le remplacer par un titre.
- issue: Nature des images de la mouche et de l’abeille
  choice: Conserver les images sans identifier explicitement leurs référents politiques ou militaires
  alternative: Remplacer ou compléter les images par une identification explicite de l’Égypte et de l’Assyrie comme puissances militaires
  rationale: Le contexte suggère des puissances étrangères, mais le verset lui-même les présente sous forme d’images. Les conserver respecte l’ambiguïté et la force rhétorique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite l’archaïsme « il arrivera en ce jour-là », conserve les deux images au singulier et explicite seulement la fonction d’appel du sifflement, déjà portée par la construction hébraïque.
