  text: כֹּ֥ה אָמַ֖ר אֲדֹנָ֣/י יְהוִ֑ה לֹ֥א תָק֖וּם וְ/לֹ֥א תִֽהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/007.yaml
  text: 'Thus says the Lord GOD: It shall not stand[a], and it shall not come to pass.'
translation:
  language: fr
  text: 'Voici ce que dit le Seigneur Yahweh :

    « Cela ne tiendra pas,

    et cela n’arrivera pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Cela ne tiendra pas, et cela ne sera pas. » La seconde proposition signifie que le projet ne se réalisera pas.'
    reason: alternative lexicale et explicitation de l’idiome
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Cette formulation française naturelle conserve la force présentative de כֹּה et rend le parfait אָמַר par le présent conventionnel de la formule prophétique.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: « Seigneur » traduit אֲדֹנָי, tandis que « Yahweh » représente distinctement le nom divin יהוה et évite « le Seigneur Seigneur ».
- source_word: לֹא תָקוּם
  choice: Cela ne tiendra pas
  rationale: Le verbe קום signifie littéralement se lever ou tenir; dans le contexte, le sujet implicite est le projet hostile évoqué au verset précédent. « Ne tiendra pas » préserve l’image hébraïque tout en étant idiomatique en français.
- source_word: וְלֹא תִהְיֶה
  choice: et cela n’arrivera pas
  rationale: Littéralement « et cela ne sera pas »; appliqué au projet annoncé, היה exprime ici sa non-réalisation. « N’arrivera pas » est clair et actuel.
theological_decisions:
- issue: Rendu du titre divin composé אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix distingue les deux éléments du titre et transmet explicitement le nom divin sans confondre אֲדֹנָי et יהוה.
- issue: Sujet implicite des deux verbes négatifs
  choice: « Cela », renvoyant au projet hostile du contexte
  alternative: Répéter explicitement « ce projet »
  rationale: Le pronom respecte l’implicite du texte hébreu et son lien contextuel sans ajouter un nom absent du verset.
translation_notes:
  register: Français international moderne, digne et direct. La formule prophétique reste solennelle sans archaïsme; le parallélisme hébreu est conservé sur deux lignes.
