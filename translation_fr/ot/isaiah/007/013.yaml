source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר שִׁמְעוּ נָ֖א בֵּ֣ית דָּוִ֑ד הַ/מְעַ֤ט מִ/כֶּם֙ הַלְא֣וֹת אֲנָשִׁ֔ים כִּ֥י תַלְא֖וּ גַּ֥ם אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/013.yaml
  text: And he said[a], “Listen, please, house of David! Is it too little for you to weary men[b], that you also weary my God?”
translation:
  language: fr
  text: 'Alors il dit : « Écoutez donc, maison de David ! Ne vous suffit-il pas de fatiguer les hommes ? Faut-il encore que vous fatiguiez aussi mon Dieu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Alors il dit
  rationale: Le wayyiqtol introduit la prise de parole d’Ésaïe dans le fil narratif. « Alors il dit » est naturel en français et marque la progression sans la surinterpréter.
- source_word: שִׁמְעוּ נָא
  choice: Écoutez donc
  rationale: L’impératif pluriel s’adresse collectivement à la maison de David. La particule נָא donne ici une nuance d’insistance que « donc » rend naturellement dans cette réprimande solennelle.
- source_word: בֵּית דָּוִד
  choice: maison de David
  rationale: L’expression désigne la dynastie ou la collectivité davidique, et non simplement un foyer ou un bâtiment.
- source_word: הַמְעַט מִכֶּם
  choice: Ne vous suffit-il pas
  rationale: 'Cette formulation française rend la question rhétorique hébraïque : l’action déjà commise devrait être plus que suffisante, sans qu’on y ajoute une offense plus grave.'
- source_word: הַלְאוֹת … תַלְאוּ
  choice: de lasser … vous lassiez
  rationale: La répétition de la même racine hébraïque est conservée. « Lasser » exprime le fait d’éprouver ou d’épuiser la patience et convient à la fois aux humains et à Dieu dans cette parole rhétorique.
- source_word: אֲנָשִׁים
  choice: les hommes
  rationale: Le masculin pluriel est conservé, tout en laissant apparaître le contraste entre les êtres humains et Dieu. Dans ce registre biblique, « les hommes » peut désigner les humains.
- source_word: כִּי
  choice: pour que
  rationale: 'Dans la question rhétorique, כִּי introduit ici l’aggravation ou la conséquence : à l’action de lasser les hommes s’ajoute celle de lasser Dieu.'
- source_word: תַלְאוּ גַּם
  choice: vous lassiez aussi
  rationale: « Aussi » conserve la force additive de גַּם et souligne l’escalade entre les hommes et Dieu.
- source_word: אֶת אֱלֹהָי
  choice: mon Dieu
  rationale: Le suffixe possessif de première personne est explicite et exprime la position personnelle et prophétique d’Ésaïe face à la maison de David.
theological_decisions:
- issue: Portée de אֲנָשִׁים
  choice: les hommes
  alternative: les humains / les gens
  rationale: « Les hommes » maintient la forme masculine du texte et le contraste rhétorique avec Dieu, sans imposer que seuls des adultes de sexe masculin soient nécessairement visés.
- issue: Possessif dans אֱלֹהָי
  choice: mon Dieu
  alternative: Dieu
  rationale: Le possessif appartient au texte hébreu et préserve la tension entre la maison de David interpellée et la confession personnelle du prophète.
- issue: Langage appliqué à Dieu dans תַלְאוּ
  choice: vous lassiez aussi mon Dieu
  alternative: vous mettiez aussi la patience de mon Dieu à l’épreuve
  rationale: La traduction conserve la répétition audacieuse du même verbe pour les hommes et pour Dieu, sans expliquer ni atténuer la formulation théologique du texte.
translation_notes:
  register: Français moderne, soutenu mais accessible. La répétition « lasser… lassiez » préserve l’effet rhétorique de l’hébreu. « Écoutez donc » convient mieux ici à une interpellation ferme que le poli « écoutez, s’il vous plaît ».
