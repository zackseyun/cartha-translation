revisions:
- from: 'Alors il dit : « Écoutez donc, maison de David ! Ne vous suffit-il pas de lasser les hommes, pour que vous lassiez aussi mon Dieu ? »'
  to: 'Alors il dit : « Écoutez donc, maison de David ! Ne vous suffit-il pas de fatiguer les hommes ? Faut-il encore que vous fatiguiez aussi mon Dieu ? »'
  rationale: La correction supprime l’ambiguïté de but créée par « pour que » et restitue, dans un français moderne et soutenu, les deux volets de la question rhétorique. La répétition de la racine לאה est maintenue par « fatiguer », de même que « aussi » et « mon Dieu ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:07Z'
review_pass:
  verdict: revise
  source_fidelity: La structure rhétorique de l’hébreu oppose le fait de fatiguer des humains au fait de fatiguer aussi « mon Dieu », et répète le même verbe. Le possessif « mon » et l’additif « aussi » sont correctement conservés. Toutefois, « Ne vous suffit-il pas…, pour que… ? » peut faire entendre en français un rapport de but ou de conséquence qui n’est pas celui de la question rhétorique hébraïque.
  naturalness: « Alors il dit », « Écoutez donc » et « maison de David » conviennent au registre. La reformulation en deux questions rend plus naturellement en français moderne l’escalade rhétorique sans introduire une finalité par « pour que ». « Fatiguer » est ici plus idiomatique que « lasser » pour des personnes et conserve la répétition voulue.
  terminology: « Maison de David » garde la portée dynastique/corporative; « les hommes » rend le pluriel masculin אַנָשִׁים dans son contraste avec Dieu sans exiger que le référent soit exclusivement masculin. « Mon Dieu » traduit explicitement אֱלֹהָי. Aucun terme doctrinal n’est surinterprété.
  issues:
  - severity: medium
    issue: Lien syntaxique « pour que vous lassiez aussi mon Dieu »
    rationale: En français, « pour que » exprime normalement le but, et peut également suggérer une conséquence construite de manière maladroite. Le כִּי hébreu introduit ici l’extension scandaleuse de la conduite reprochée, non son objectif. Une seconde question rhétorique restitue cette relation avec netteté.
  revised_text: 'Alors il dit : « Écoutez donc, maison de David ! Ne vous suffit-il pas de fatiguer les hommes ? Faut-il encore que vous fatiguiez aussi mon Dieu ? »'
  revised_footnotes: []
  revision_rationale: La correction supprime l’ambiguïté de but créée par « pour que » et restitue, dans un français moderne et soutenu, les deux volets de la question rhétorique. La répétition de la racine לאה est maintenue par « fatiguer », de même que « aussi » et « mon Dieu ».
