id: ISA.7.25
reference: Isaiah 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/כֹ֣ל הֶ/הָרִ֗ים אֲשֶׁ֤ר בַּ/מַּעְדֵּר֙ יֵעָ֣דֵר֔וּ/ן לֹֽא תָב֣וֹא שָׁ֔מָּ/ה יִרְאַ֖ת שָׁמִ֣יר וָ/שָׁ֑יִת וְ/הָיָה֙ לְ/מִשְׁלַ֣ח שׁ֔וֹר וּ/לְ/מִרְמַ֖ס שֶֽׂה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/025.yaml
  text: And as for all the hills that used to be hoed with a hoe[a], you will not go there for fear of briers and thorns[d][c][b]; they will become a place for the sending out of oxen and for the trampling of sheep.
translation:
  language: fr
  text: Quant à toutes les collines que l’on cultivait à la houe[a], tu n’y iras pas, par crainte des ronces et des épines[b] ; elles deviendront un lieu où l’on lâchera les bœufs[c] et que piétinera le petit bétail[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que l’on travaillait à la houe ». En hébreu, le nom de l’outil et le verbe sont de la même famille.'
    reason: lexical_alternative
  - marker: b
    text: 'Le « tu » peut avoir ici une portée générale : « on n’y ira pas ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un lieu où les bœufs seront laissés en liberté » ; de manière plus interprétative : « un pâturage pour les bœufs ».'
    reason: lexical_alternative
  - marker: d
    text: L’hébreu שֶׂה peut désigner un mouton ou une chèvre, et plus largement une tête de petit bétail.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל הֶהָרִים
  choice: Quant à toutes les collines
  rationale: La tournure marque le léger changement de thème introduit par וְכֹל. Dans ce contexte agricole, « collines » convient mieux que « montagnes ».
- source_word: אֲשֶׁר בַּמַּעְדֵּר יֵעָדֵרוּן
  choice: que l’on cultivait à la houe
  rationale: מַעְדֵּר désigne une houe ou un outil analogue, et le verbe apparenté évoque le travail du sol. L’imparfait français exprime naturellement l’état cultivé antérieur, opposé à la désolation annoncée.
- source_word: לֹא תָבוֹא שָׁמָּה
  choice: tu n’y iras pas
  rationale: La deuxième personne masculine singulière est conservée, tout en pouvant avoir une portée générique. « Aller » est idiomatique en français avec « y ».
- source_word: יִרְאַת שָׁמִיר וָשַׁיִת
  choice: par crainte des ronces et des épines
  rationale: La construction exprime le motif de l’évitement. Le couple désigne une végétation épineuse envahissante associée à la désolation.
- source_word: וְהָיָה
  choice: elles deviendront
  rationale: Bien que la forme hébraïque soit au singulier, elle reprend collectivement le terrain constitué par toutes les collines. Le pluriel français rattache clairement la proposition à « collines ».
- source_word: לְמִשְׁלַח שׁוֹר
  choice: un lieu où l’on lâchera les bœufs
  rationale: מִשְׁלַח évoque l’action d’envoyer ou de laisser aller. Cette formulation garde l’image concrète des bovins lâchés sur le terrain sans réduire d’emblée le sens à « pâturage ».
- source_word: וּלְמִרְמַס שֶׂה
  choice: que piétinera le petit bétail
  rationale: מִרְמַס désigne le piétinement, tandis que שֶׂה peut désigner une tête de petit bétail, ovine ou caprine. « Petit bétail » préserve cette extension sémantique.
theological_decisions: []
