  text: וַ/יֻּגַּ֗ד לְ/בֵ֤ית דָּוִד֙ לֵ/אמֹ֔ר נָ֥חָֽה אֲרָ֖ם עַל אֶפְרָ֑יִם וַ/יָּ֤נַע לְבָב/וֹ֙ וּ/לְבַ֣ב עַמּ֔/וֹ כְּ/נ֥וֹעַ עֲצֵי יַ֖עַר מִ/פְּנֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/002.yaml
  text: And it was reported to the house of David, saying, “Aram has settled on Ephraim.” And his heart and the heart of his people shook, as the trees of the forest shake before the wind.
translation:
  language: fr
  text: 'On informa la maison de David en ces termes : « Aram s’est établi sur Éphraïm. » Alors le cœur d’Ahaz et celui de son peuple se mirent à trembler comme les arbres de la forêt tremblent sous le vent.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבֵית דָּוִד
  choice: la maison de David
  rationale: Conserve l’expression dynastique hébraïque, qui désigne ici le roi appartenant à la lignée de David et sa cour.
- source_word: נָחָה אֲרָם עַל אֶפְרָיִם
  choice: Aram s’est établi sur Éphraïm
  rationale: Reproduit au plus près l’image inhabituelle du verbe נוח avec עַל, sans remplacer explicitement cette formulation par « s’est allié à », interprétation probable mais plus explicative.
- source_word: וַיָּנַע
  choice: se mirent à trembler
  rationale: Exprime le mouvement provoqué par la peur et prépare naturellement la comparaison avec les arbres agités par le vent.
- source_word: לְבָבוֹ
  choice: le cœur d’Ahaz
  rationale: Explicite en français le référent masculin singulier fourni par le contexte immédiat, afin d’éviter un pronom possessif ambigu.
- source_word: מִפְּנֵי רוּחַ
  choice: sous le vent
  rationale: Formulation française naturelle qui rend la cause du mouvement des arbres; littéralement, « devant le vent ».
theological_decisions:
- issue: Sens politique de « Aram s’est établi sur Éphraïm »
  choice: Conserver l’image « s’est établi sur »
  alternative: « Aram s’est allié à Éphraïm »
  rationale: Le contexte indique une coalition, mais le tour hébreu reste imagé et potentiellement militaire. La traduction ne tranche donc pas davantage que la source.
translation_notes:
  register: Français moderne, digne et narratif. L’inversion lourde « il fut rapporté » est évitée, tandis que « maison de David » et l’image de l’établissement sur Éphraïm sont conservées pour respecter la texture du texte source.
