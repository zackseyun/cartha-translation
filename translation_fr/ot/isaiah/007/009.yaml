  text: וְ/רֹ֤אשׁ אֶפְרַ֨יִם֙ שֹׁמְר֔וֹן וְ/רֹ֥אשׁ שֹׁמְר֖וֹן בֶּן רְמַלְיָ֑הוּ אִ֚ם לֹ֣א תַאֲמִ֔ינוּ כִּ֖י לֹ֥א תֵאָמֵֽנוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/009.yaml
  text: And the head of Ephraim is Samaria[a], and the head of Samaria is the son of Remaliah. If you do not believe[b], surely you will not be established.
translation:
  language: fr
  text: La tête d’Éphraïm, c’est Samarie, et la tête de Samarie, c’est le fils de Remalia. Si vous ne croyez pas, vous ne resterez pas fermes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'En hébreu, « croyez » et « resterez fermes » viennent de la même racine, ce qui associe le fait de croire ou de faire confiance à celui de demeurer ferme. On peut aussi traduire : « Si vous n’avez pas confiance, vous ne serez pas affermis. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: tête
  rationale: 'Conserve la métaphore politique et le parallélisme hébreu : Samarie est la « tête » d’Éphraïm, et le fils de Remalia celle de Samarie.'
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Maintient le nom employé par l’hébreu pour désigner ici le royaume du Nord, sans explicitation interprétative dans le texte.
- source_word: שֹׁמְרוֹן
  choice: Samarie
  rationale: Forme française usuelle du nom de la ville, capitale d’Éphraïm dans ce contexte.
- source_word: בֶּן רְמַלְיָהוּ
  choice: le fils de Remalia
  rationale: Préserve la désignation patronymique délibérée d’Ésaïe au lieu d’introduire le nom personnel Péqah.
- source_word: תַאֲמִינוּ
  choice: croyez
  rationale: Rend le hiphil de אמן par un verbe français naturel qui peut exprimer la confiance accordée à Dieu ou à sa parole, sans ajouter un objet absent de l’hébreu.
- source_word: כִּי
  choice: non rendu séparément
  rationale: Dans l’apodose négative, sa force affirmative ou emphatique est portée naturellement en français par l’énoncé direct « vous ne tiendrez pas ferme » ; « sûrement » alourdirait la phrase.
- source_word: תֵאָמֵנוּ
  choice: tiendrez ferme
  rationale: Rend le niphal de אמן dans son sens de demeurer stable ou assuré. Le français ne permet pas de reproduire exactement la parenté morphologique avec « croyez » ; une note signale le jeu de mots.
theological_decisions:
- issue: Jeu de mots sur les deux formes de la racine אמן
  choice: Si vous ne croyez pas, vous ne tiendrez pas ferme.
  alternative: Si vous n’avez pas confiance, vous ne serez pas affermis.
  rationale: La formulation distingue la confiance demandée de la stabilité qui en résulte, tout en conservant la tension concise de l’avertissement. Elle n’introduit ni objet explicite de la foi ni catégorie doctrinale ultérieure.
translation_notes:
  register: 'Français moderne, clair et digne. La construction « c’est » restitue naturellement les deux propositions nominales hébraïques et leur parallélisme. Le tutoiement est évité : les verbes hébreux sont au pluriel et s’adressent collectivement au roi et à son entourage ou au peuple représenté par lui.'
