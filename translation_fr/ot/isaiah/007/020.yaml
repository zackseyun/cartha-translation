base_translation:
  language: en
  yaml_path: translation/ot/isaiah/007/020.yaml
  text: In that day the Lord will shave with a hired razor from beyond the River—with the king of Assyria—the head and the hair of the feet[a], and it will also sweep away the beard.
translation:
  language: fr
  text: En ce jour-là, le Seigneur rasera, avec un rasoir loué au-delà du Fleuve — le roi d’Assyrie —, la tête et les poils des jambes[a] ; ce rasoir enlèvera même la barbe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les poils des pieds ». Le mot peut ici désigner les jambes ou servir d’euphémisme pour les parties génitales, ce qui accentuerait l’humiliation totale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגַלַּח
  choice: rasera
  rationale: Le piel de גלח désigne l’action de raser ou de couper les cheveux et les poils. « Rasera » conserve directement l’image.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, rendu naturellement par « le Seigneur ».
- source_word: בְּתַעַר הַשְּׂכִירָה
  choice: avec un rasoir loué
  rationale: תער signifie « rasoir » et שׂכירה « loué » ou « pris à gages ». La formulation maintient la métaphore d’Assyrie comme instrument engagé par Dieu.
- source_word: בְּעֶבְרֵי נָהָר
  choice: au-delà du Fleuve
  rationale: L’expression désigne les régions situées de l’autre côté du Fleuve, ici l’Euphrate. La majuscule signale ce référent géographique traditionnel sans l’ajouter explicitement au texte.
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: avec le roi d’Assyrie
  rationale: 'Le beth a une valeur instrumentale et explicative : le roi d’Assyrie est le rasoir dont le Seigneur se sert. La répétition de « avec » préserve cette syntaxe et l’identification métaphorique.'
- source_word: הָרֹאשׁ
  choice: la tête
  rationale: Rendu anatomique direct, cohérent avec l’image du rasage.
- source_word: שַׂעַר הָרַגְלָיִם
  choice: les poils des jambes
  rationale: רַגְלַיִם signifie littéralement « pieds », mais peut englober les jambes ou servir d’euphémisme pour les parties génitales. « Jambes » donne en français une image anatomique intelligible sans trancher silencieusement la possible valeur euphémistique, signalée en note.
- source_word: וְגַם אֶת הַזָּקָן
  choice: aussi la barbe
  rationale: גם marque l’ajout et éventuellement l’emphase. « Aussi » préserve l’accumulation des parties rasées.
- source_word: תִּסְפֶּה
  choice: il enlèvera
  rationale: Le verbe ספה peut signifier enlever, faire disparaître ou balayer. Son sujet grammatical est probablement le rasoir, féminin en hébreu ; en français, « rasoir » étant masculin, « il enlèvera » respecte naturellement cet accord tout en conservant l’image.
theological_decisions:
- issue: Interprétation de la métaphore du rasage
  choice: Le Seigneur emploie le roi d’Assyrie comme instrument d’un jugement humiliant.
  alternative: Une simple image de conquête militaire, sans insistance particulière sur l’humiliation.
  rationale: Le rasage de la tête, du bas du corps et de la barbe évoque un dépouillement complet et déshonorant. La syntaxe présente le roi d’Assyrie comme le « rasoir loué » manié par le Seigneur.
- issue: Sujet de תִּסְפֶּה
  choice: Le rasoir enlève aussi la barbe, rendu par le pronom « il » conformément au genre français de « rasoir ».
  alternative: Le Seigneur enlève aussi la barbe.
  rationale: La forme verbale féminine singulière s’accorde le plus naturellement avec תַּעַר, nom féminin en hébreu. Le français impose toutefois un pronom masculin pour « rasoir ».
translation_notes:
  register: Français moderne, international et digne. La ponctuation en incise explicite l’identification du « rasoir loué » avec le roi d’Assyrie tout en préservant la métaphore et la tension syntaxique de l’hébreu.
