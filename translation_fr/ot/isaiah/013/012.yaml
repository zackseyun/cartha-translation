id: ISA.13.12
reference: Isaiah 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אוֹקִ֥יר אֱנ֖וֹשׁ מִ/פָּ֑ז וְ/אָדָ֖ם מִ/כֶּ֥תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/012.yaml
  text: I will make mortal man rarer than fine gold[a], and mankind than the gold of Ophir.
translation:
  language: fr
  text: Je rendrai l’être humain plus rare que l’or fin[a], et les hommes plus rares que l’or d’Ophir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je rendrai l’être humain plus précieux que l’or fin. » Le verbe hébreu peut mettre l’accent sur la valeur; dans ce contexte, il évoque probablement une extrême rareté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹקִיר
  choice: Je rendrai … plus rare
  rationale: Le hifil de יקר exprime ce qui devient précieux ou de grand prix. Dans ce contexte de jugement, la comparaison avec l’or évoque concrètement l’extrême rareté des survivants; « plus rare » rend naturellement cet effet sans éliminer l’idée de valeur, signalée en note.
- source_word: אֱנוֹשׁ
  choice: l’être humain
  rationale: אֱנוֹשׁ désigne ici l’humain fragile et mortel. « L’être humain » est générique, naturel en français moderne et conserve l’accent anthropologique du terme, même si la nuance de mortalité n’est pas explicitée.
- source_word: מִפָּז
  choice: que l’or fin
  rationale: פָּז désigne un or de grande qualité, pur ou raffiné. « Or fin » est l’expression française idiomatique correspondante.
- source_word: וְאָדָם
  choice: et les hommes
  rationale: אָדָם a ici une valeur collective et générique, en parallélisme avec אֱנוֹשׁ. « Les hommes » désigne l’humanité dans un registre biblique digne tout en permettant de répéter naturellement l’idée comparative sous-entendue.
- source_word: מִכֶּתֶם אוֹפִיר
  choice: que l’or d’Ophir
  rationale: כֶּתֶם désigne de l’or précieux, et Ophir est réputé pour son or. « L’or d’Ophir » préserve clairement l’allusion géographique et la valeur exceptionnelle du métal.
theological_decisions:
- issue: Sens de יקר dans l’annonce du jugement
  choice: plus rare
  alternative: plus précieux
  rationale: Le verbe permet une lecture axée sur la valeur, mais le contexte de destruction fait surtout comprendre que les êtres humains deviendront extrêmement peu nombreux. La note conserve explicitement l’autre nuance lexicale.
- issue: Portée générique de אֱנוֹשׁ et אָדָם
  choice: l’être humain … les hommes
  alternative: le mortel … l’humanité
  rationale: Les deux termes renvoient aux humains en général. Cette formulation française maintient le parallélisme avec une variation lexicale, sans restreindre le propos aux seuls individus masculins.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « plus rares » dans le second membre explicite l’ellipse hébraïque et rend le parallélisme naturel en français. Le nom propre « Ophir » est conservé.
