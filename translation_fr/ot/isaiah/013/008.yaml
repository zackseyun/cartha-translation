  text: They will be dismayed; pains and labor pangs will seize them[a]. They will writhe like a woman giving birth. Each man will stare at his neighbor; their faces will be faces of flame.
translation:
  language: fr
  text: Ils seront épouvantés ; des douleurs et des douleurs de l’enfantement les saisiront. Ils se tordront comme une femme qui accouche. Chacun regardera son prochain avec stupeur ; leurs visages seront des visages de flammes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leurs visages seront en feu ». L’hébreu dit littéralement : « des visages de flammes sont leurs visages », image vive qui peut évoquer des visages embrasés ou l’effroi rendu visible sur leurs traits.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְהָלוּ
  choice: Ils seront saisis d’épouvante
  rationale: Le niphal de בהל exprime l’effroi soudain, la consternation ou la panique. Cette formulation française conserve le caractère subi et soudain sans réduire le verbe à une simple surprise.
- source_word: צִירִים וַחֲבָלִים
  choice: douleurs et souffrances
  rationale: Les deux noms désignent des douleurs aiguës, avec une forte évocation des douleurs de l’accouchement, rendue explicite dans la proposition suivante. Le binôme français maintient l’intensification sans imposer aux deux termes une distinction lexicale trop précise.
- source_word: יֹאחֵזוּן
  choice: les empoigneront
  rationale: Le verbe אחז signifie saisir ou agripper. « Empoigneront » restitue vigoureusement l’image des douleurs qui prennent possession d’eux.
- source_word: כַּיּוֹלֵדָה יְחִילוּן
  choice: Ils se tordront comme une femme qui accouche
  rationale: Le participe יולדה désigne une femme en train d’accoucher, tandis que יחילון évoque ici les mouvements convulsifs causés par la douleur. La traduction est actuelle, claire et corporelle.
- source_word: אִישׁ אֶל־רֵעֵהוּ יִתְמָהוּ
  choice: Chacun regardera l’autre avec stupeur
  rationale: La tournure distributive signifie littéralement « un homme vers son prochain ». Le verbe תמה exprime un regard frappé de stupeur. La formulation française naturelle conserve la réciprocité et l’étonnement horrifié.
- source_word: פְּנֵי לְהָבִים פְּנֵיהֶם
  choice: leurs visages seront des visages de flammes
  rationale: Cette traduction garde la répétition et la métaphore saisissante de l’hébreu, sans trancher entre rougeur ardente, éclat terrifiant ou autre manifestation visible de l’épouvante.
