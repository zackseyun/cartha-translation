  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ/צְבִ֣י מֻדָּ֔ח וּ/כְ/צֹ֖אן וְ/אֵ֣ין מְקַבֵּ֑ץ אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ אֶל אַרְצ֖/וֹ יָנֽוּסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/014.yaml
  text: And it will be like a hunted gazelle[a], and like sheep with no one to gather them; each man will turn to his own people[b], and each will flee to his own land.
translation:
  language: fr
  text: Ce sera alors comme une gazelle chassée[a], comme des moutons que personne ne rassemble. Chacun[b] se tournera vers son peuple, chacun fuira vers son pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une gazelle pourchassée » ou « chassée au loin »; le participe hébreu peut décrire ce qui est repoussé ou poursuivi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un homme », employé ici dans un sens distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ce sera alors
  rationale: Dans le contexte de l’oracle, la forme de היה introduit un état à venir. La tournure impersonnelle française conserve la référence peu explicite du sujet hébreu sans en imposer un.
- source_word: כִּצְבִי מֻדָּח
  choice: comme une gazelle chassée
  rationale: צְבִי désigne naturellement une gazelle. Le participe passif מֻדָּח évoque un animal chassé, pourchassé ou repoussé; « chassée » garde en français cette amplitude de sens.
- source_word: וּכְצֹאן וְאֵין מְקַבֵּץ
  choice: comme des moutons que personne ne rassemble
  rationale: צֹאן est un terme collectif pour le petit bétail, ici rendu par « moutons » en raison de l’image du rassemblement. La relative exprime naturellement l’absence de toute personne qui les regroupe.
- source_word: אִישׁ אֶל עַמּוֹ יִפְנוּ
  choice: Chacun se tournera vers son peuple
  rationale: אִישׁ a ici une valeur distributive, confirmée par le verbe pluriel. « Chacun » rend cette distribution sans alourdir la phrase, tandis que « son peuple » conserve le sens de עַם.
- source_word: וְאִישׁ אֶל אַרְצוֹ יָנוּסוּ
  choice: chacun fuira vers son pays
  rationale: נוּס signifie « fuir ». Dans ce contexte de retour des étrangers vers leur territoire d’origine, « pays » exprime naturellement le sens de אֶרֶץ.
theological_decisions:
- issue: Valeur distributive du nom masculin אִישׁ
  choice: Traduire les deux occurrences par « chacun »
  alternative: « chaque homme » ou « chacun des hommes »
  rationale: Le masculin singulier hébreu fonctionne ici de manière distributive plutôt que comme une insistance sur le sexe des personnes. « Chacun » reste grammaticalement masculin en français, conserve la distribution individuelle et évite d’ajouter une restriction que le contexte n’explicite pas.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et imagée; la tournure impersonnelle initiale préserve l’indétermination du sujet hébreu, et la répétition de « chacun » reproduit le parallélisme distributif.
