  source_fidelity: 'Le sens global est fidèlement rendu : les trois violences annoncées sont conservées, ainsi que « sous leurs yeux ». Toutefois, עֹלְלֵיהֶם désigne des enfants très jeunes et « petits enfants » est plus immédiatement clair que « tout-petits » dans ce contexte. Le terme נְשֵׁיהֶם a ici le sens spécifique de « leurs épouses ». La forme consonantique transmise est תשגלנה (ketiv), tandis que le qere est traditionnellement lu avec une autre forme ; l’affirmation selon laquelle « le qere » serait תשגלנה est donc inexacte, même si le rendu explicite de l’agression sexuelle demeure justifié par le contexte et la tradition textuelle.'
  naturalness: La phrase est sobre, actuelle et syntaxiquement naturelle. « Seront mis en pièces » rend plus nettement l’idée de violence destructrice de יְרֻטְּשׁוּ que « seront fracassés », qui peut être moins idiomatique avec des personnes. « Épouses » évite l’ambiguïté possible de « leurs femmes » en français international.
  terminology: '« Violées » est un rendu moderne, explicite et non euphémistique de la violence sexuelle visée. « Épouses » reflète précisément le possessif conjugal de נְשֵׁיהֶם. Aucun appel de note n’est nécessaire : une note ne résoudrait pas un problème de traduction dans ce verset, et le texte français préserve déjà le sens sans imposer d’interprétation doctrinale.'
