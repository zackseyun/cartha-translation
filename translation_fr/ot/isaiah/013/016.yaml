  yaml_path: translation/ot/isaiah/013/016.yaml
  text: Their infants will be dashed to pieces before their eyes; their houses will be plundered[a], and their wives raped.
translation:
  language: fr
  text: Leurs petits enfants seront mis en pièces sous leurs yeux ; leurs maisons seront pillées et leurs épouses violées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלְלֵיהֶם
  choice: leurs tout-petits
  rationale: עֹלֵל désigne de très jeunes enfants. « Tout-petits » exprime naturellement leur jeune âge et leur vulnérabilité sans limiter nécessairement le terme aux nourrissons.
- source_word: יְרֻטְּשׁוּ
  choice: seront fracassés
  rationale: Le passif de רטש décrit une mise en pièces violente. « Seront fracassés » conserve la brutalité de l’image dans un français actuel et direct.
- source_word: לְעֵינֵיהֶם
  choice: sous leurs yeux
  rationale: Cette locution signifie que l’acte se déroule en leur présence et à leur vue. « Sous leurs yeux » est l’équivalent idiomatique naturel en français.
- source_word: יִשַּׁסּוּ
  choice: seront pillées
  rationale: Le verbe désigne l’action de dépouiller ou de piller. Avec « maisons » comme sujet, le passif français rend naturellement la forme et le sens du texte.
- source_word: בָּתֵּיהֶם
  choice: leurs maisons
  rationale: « Maisons » est l’équivalent concret et direct de בַּיִת dans ce contexte de pillage guerrier.
- source_word: וּנְשֵׁיהֶם
  choice: leurs femmes
  rationale: Dans cette construction avec suffixe possessif, נָשִׁים désigne naturellement leurs épouses. En français, « leurs femmes » garde ce sens conjugal dans une formulation courante.
- source_word: תשגלנה
  choice: violées
  rationale: Le qere massorétique emploie un terme cru désignant ici une agression sexuelle. « Violées » en donne le sens explicite sans euphémisme ni archaïsme.
theological_decisions:
- issue: Rendu du terme d’agression sexuelle dans un oracle de jugement
  choice: leurs femmes violées
  alternative: leurs femmes déshonorées
  rationale: Le texte hébreu décrit brutalement une violence sexuelle de guerre. Le choix principal ne l’atténue pas par un euphémisme et ne résout aucune tension théologique au-delà de ce qu’affirme le passage.
- issue: Choix entre le ketiv et le qere massorétiques
  choice: suivre le qere תשגלנה, « violées »
  alternative: suivre le ketiv consonantique tel qu’écrit
  rationale: La tradition massorétique signale ici une lecture orale explicite et crue. Celle-ci correspond au contexte parallèle de pillage et de violence de guerre, tout en préservant le sens transmis par le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation reste directe afin de ne pas édulcorer la violence de l’oracle ; elle évite toutefois les tournures archaïques. Aucun appel de note n’est nécessaire.
