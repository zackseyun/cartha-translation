source:
  edition: WLC
  text: עַל כֵּ֖ן כָּל יָדַ֣יִם תִּרְפֶּ֑ינָה וְ/כָל לְבַ֥ב אֱנ֖וֹשׁ יִמָּס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/007.yaml
  text: Therefore all hands will grow weak[a], and every human heart will melt.
translation:
  language: fr
  text: C’est pourquoi toutes les mains faibliront, et tout cœur humain[a] fondra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout cœur mortel ». Le mot hébreu אֱנוֹשׁ désigne ici l’être humain en général, souvent avec une nuance de fragilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Cette locution introduit la conséquence de l’annonce précédente. « C’est pourquoi » en conserve clairement la valeur logique et résultative.
- source_word: כָּל יָדַיִם
  choice: toutes les mains
  rationale: Le pluriel collectif hébreu est maintenu afin de préserver l’image concrète des mains qui perdent leur force et leur capacité d’agir.
- source_word: תִּרְפֶּינָה
  choice: faibliront
  rationale: Le verbe רפה exprime le relâchement ou la perte de force. « Faibliront » est naturel en français moderne et convient à l’image des mains défaillantes.
- source_word: וְכָל לְבַב אֱנוֹשׁ
  choice: et tout cœur humain
  rationale: לְבַב désigne ici le cœur comme siège du courage et de la résolution. אֱנוֹשׁ renvoie de manière générique à l’être humain, avec une nuance de fragilité; « tout cœur humain » évite une référence exclusivement masculine.
- source_word: יִמָּס
  choice: fondra
  rationale: Le verbe signifie littéralement « fondre » et décrit métaphoriquement l’effondrement du courage sous l’effet de la peur. Le maintien de cette image respecte la vigueur poétique de l’hébreu.
theological_decisions:
- issue: Traduction générique de אֱנוֹשׁ
  choice: humain
  alternative: mortel; homme
  rationale: Dans ce contexte, le terme représente tout être humain plutôt qu’un individu masculin. « Humain » préserve cette portée générique; « mortel » rendrait plus explicitement la nuance de fragilité, mais serait légèrement plus interprétatif.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme, les images corporelles des mains et du cœur, ainsi que la métaphore du cœur qui fond.
