source:
  edition: WLC
  text: כָּל הַ/נִּמְצָ֖א יִדָּקֵ֑ר וְ/כָל הַ/נִּסְפֶּ֖ה יִפּ֥וֹל בֶּ/חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/015.yaml
  text: Everyone who is found will be pierced through[a], and everyone who is caught will fall by the sword.
translation:
  language: fr
  text: Quiconque sera trouvé sera transpercé, et quiconque sera emporté[a] tombera par l’épée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera pris ». Le participe hébreu peut désigner plus largement quelqu’un qui est emporté ou entraîné dans la destruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנִּמְצָא
  choice: quiconque sera trouvé
  rationale: כָּל est distributif devant le participe niphal substantivé de מצא. « Quiconque sera trouvé » conserve la portée universelle et le passif, dans un français naturel et solennel.
- source_word: יִדָּקֵר
  choice: sera transpercé
  rationale: Le niphal imperfectif de דקר décrit le fait d’être percé par une arme. « Sera transpercé » restitue la violence du terme sans ajouter un instrument absent de cette proposition.
- source_word: וְכָל הַנִּסְפֶּה
  choice: et quiconque sera emporté
  rationale: Le participe niphal de ספה peut évoquer celui qui est emporté, balayé ou entraîné dans la destruction. « Sera emporté » préserve mieux cette amplitude que le sens contextuel plus étroit de « sera pris ».
- source_word: יִפּוֹל
  choice: tombera
  rationale: Le qal imperfectif de נפל signifie littéralement « tomber »; dans ce contexte guerrier, la mort est précisée par le complément « par l’épée ».
- source_word: בֶּחָרֶב
  choice: par l’épée
  rationale: La préposition ב marque ici le moyen; l’expression est un idiome courant de mort violente à la guerre. « Par l’épée » reste clair et formel en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme distributif est rendu par la répétition de « quiconque ». Le futur convient à l’annonce prophétique et aux formes verbales hébraïques dans ce contexte.
