  text: אֲנִ֥י צִוֵּ֖יתִי לִ/מְקֻדָּשָׁ֑/י גַּ֣ם קָרָ֤אתִי גִבּוֹרַ/י֙ לְ/אַפִּ֔/י עַלִּיזֵ֖י גַּאֲוָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/003.yaml
  text: I myself have commanded my consecrated ones; I have also summoned my warriors for my anger[a], my proudly exulting ones.
translation:
  language: fr
  text: Moi, j’ai donné mes ordres à ceux que j’ai consacrés ; j’ai aussi convoqué mes guerriers pour manifester ma colère, ceux qui exultent de ma grandeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui se réjouissent de ma majesté » ; ou : « ceux qui exultent de mon triomphe ».'
    reason: La construction hébraïque est condensée, et גַּאֲוָה peut désigner la grandeur, la majesté, l’élévation ou le triomphe.
lexical_decisions:
- source_word: אֲנִי
  choice: Moi, j’ai
  rationale: Le pronom indépendant renforce le sujet déjà exprimé par le verbe. La dislocation « Moi, j’ai » rend cette insistance de façon naturelle en français.
- source_word: צִוֵּיתִי
  choice: j’ai donné mes ordres
  rationale: Le piel de צוה exprime ici l’ordre ou la mission confiée. Cette formulation convient au rassemblement militaire annoncé dans le contexte.
- source_word: לִמְקֻדָּשָׁי
  choice: à ceux que j’ai consacrés
  rationale: Le participe passif de קדשׁ désigne ceux qui ont été mis à part pour l’action de Dieu. « Consacrés » conserve le vocabulaire cultuel sans affirmer qu’ils seraient moralement saints.
- source_word: גַּם קָרָאתִי
  choice: j’ai aussi convoqué
  rationale: קרא signifie appeler, mais « convoquer » exprime naturellement ici l’appel à se rassembler en vue d’une intervention.
- source_word: גִּבּוֹרַי
  choice: mes vaillants
  rationale: גבור désigne des hommes puissants ou valeureux, souvent des guerriers. « Mes vaillants » conserve cette nuance martiale sans réduire entièrement le terme à une catégorie professionnelle.
- source_word: לְאַפִּי
  choice: pour exécuter ma colère
  rationale: אַף désigne idiomatiquement la colère. Le complément introduit par ל indique ici le but ou la destination de leur convocation ; « exécuter » explicite avec mesure leur rôle d’agents du jugement.
- source_word: עַלִּיזֵי גַּאֲוָתִי
  choice: ceux qui exultent de ma grandeur
  rationale: La construction condensée associe l’exultation à la גאוה de Dieu, terme pouvant évoquer grandeur, majesté, élévation ou triomphe. Le texte principal garde cette relation sans en fixer trop étroitement la nuance.
theological_decisions:
- issue: Le sens de « ceux que j’ai consacrés »
  choice: Des agents que Dieu a mis à part pour accomplir son jugement
  alternative: Des êtres moralement saints, éventuellement angéliques
  rationale: Le contexte immédiat décrit le rassemblement de forces contre Babylone. La consécration indique donc d’abord une affectation à une mission, non un jugement sur la qualité morale de ces agents.
- issue: La construction עַלִּיזֵי גַּאֲוָתִי
  choice: Ceux qui exultent de la grandeur de Dieu
  alternative: Ceux qui se réjouissent de sa majesté, ceux qui exultent de son triomphe, ou ses fiers exultants
  rationale: L’hébreu est bref et sémantiquement ouvert. « Grandeur » maintient la possibilité de la majesté comme celle de l’exaltation triomphante, tandis que la note signale les principales autres lectures.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme en deux propositions conserve la solennité de l’oracle. « Mes vaillants » garde la coloration militaire tout en restant plus proche de la portée de גבור que le seul mot « guerriers ».
