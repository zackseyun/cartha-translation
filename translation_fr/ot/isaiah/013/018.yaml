id: ISA.13.18
reference: Isaiah 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/קְשָׁת֖וֹת נְעָרִ֣ים תְּרַטַּ֑שְׁנָה וּ/פְרִי בֶ֨טֶן֙ לֹ֣א יְרַחֵ֔מוּ עַל בָּנִ֖ים לֹֽא תָח֥וּס עֵינָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/018.yaml
  text: And their bows will dash young men to pieces[a]; they will show no compassion on the fruit of the womb[b]; their eyes will not spare children.
translation:
  language: fr
  text: Leurs arcs[a] mettront les jeunes gens en pièces ; ils n’auront aucune compassion pour le fruit du ventre ; leur regard n’épargnera pas les enfants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Leurs archers mettront les jeunes gens en pièces ». Le mot hébreu désigne normalement les arcs, mais peut être compris ici par métonymie comme désignant les archers.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les fils » ; le terme est probablement employé ici au sens plus large d’« enfants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשָׁתוֹת
  choice: arcs
  rationale: 'Le nom désigne normalement des « arcs ». L’accord du verbe au féminin pluriel appuie cette lecture instrumentale, tout en laissant possible une compréhension métonymique : « archers ».'
- source_word: נְעָרִים
  choice: jeunes gens
  rationale: Le terme peut désigner des garçons, des adolescents ou de jeunes hommes. « Jeunes gens » conserve cette relative largeur dans le contexte de violence guerrière.
- source_word: תְּרַטַּשְׁנָה
  choice: mettront … en pièces
  rationale: Le piel de רטש exprime une action violente consistant à fracasser ou mettre en pièces ; cette formulation française en garde la brutalité.
- source_word: פְרִי בֶטֶן
  choice: le fruit du ventre maternel
  rationale: La traduction maintient l’image hébraïque désignant la progéniture issue du ventre, sans la réduire explicitement aux seuls enfants à naître.
- source_word: יְרַחֵמוּ
  choice: n’auront aucune compassion
  rationale: רחם exprime la compassion ou la pitié. Cette tournure est naturelle en français moderne et restitue sa dimension affective.
- source_word: בָּנִים
  choice: enfants
  rationale: Bien que le nom signifie formellement « fils », il peut désigner les enfants ou la descendance en général ; le parallélisme avec « fruit du ventre maternel » favorise ici le sens générique.
- source_word: תָחוּס עֵינָם
  choice: leur regard n’épargnera pas
  rationale: Littéralement, « leur œil n’épargnera pas ». « Leur regard » conserve l’image hébraïque tout en donnant une expression idiomatique et digne en français.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La violence explicite de l’hébreu est conservée sans amplification. « Fruit du ventre maternel » préserve l’image sémitique, tandis que « leur regard » rend naturellement l’idiome littéral « leur œil ».
