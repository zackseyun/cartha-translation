    issue: « envoyée par le Tout-Puissant » renforce la relation exprimée par מִן.
    rationale: Le texte dit littéralement que la dévastation vient « de » Shaddaï. « Envoyée par » introduit plus spécifiquement l’idée d’une mission ou d’un envoi. « Venant du » conserve la provenance sans cette précision ajoutée.
  - severity: low
    issue: Le présent « Il vient » ne reflète pas aussi directement le yiqtol que le futur.
    rationale: Un présent prophétique est possible en français, mais « il viendra » préserve plus nettement la valeur prospective de יָבֹוא dans cette annonce de jugement imminent.
  revised_text: Poussez des cris de détresse[a], car le jour de Yahweh est proche ! Il viendra comme une dévastation venant du Tout-Puissant[b].
