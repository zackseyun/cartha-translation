source:
  edition: WLC
  text: הֵילִ֕ילוּ כִּ֥י קָר֖וֹב י֣וֹם יְהוָ֑ה כְּ/שֹׁ֖ד מִ/שַּׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/006.yaml
  text: Wail[a], for the day of Yahweh is near[b]; it will come like destruction from the Almighty.
translation:
  language: fr
  text: Poussez des cris de détresse[a], car le jour de Yahweh est proche ! Il viendra comme une dévastation venant du Tout-Puissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Hurlez ! » Le verbe hébreu désigne un cri puissant de douleur ou d’effroi.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu fait résonner deux mots proches : « dévastation » (shod) et « Tout-Puissant » (Shaddaï).'
    reason: wordplay
lexical_decisions:
- source_word: הֵילִילוּ
  choice: Poussez des cris de détresse
  rationale: L’impératif pluriel de ילל appelle un cri intense de douleur ou d’effroi. Cette formulation est naturelle en français moderne et conserve la dimension publique et sonore du verbe.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel initial; « car » convient au style prophétique concis.
- source_word: קָרוֹב
  choice: est proche
  rationale: L’adjectif prédicatif exprime l’imminence du jour annoncé.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Cette formulation conserve l’expression prophétique désignant le moment décisif de l’intervention de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre afin de préserver le nom divin présent dans le texte hébreu.
- source_word: כְּשֹׁד
  choice: comme une dévastation
  rationale: Dans ce contexte de jugement, שֹׁד désigne une destruction violente; « dévastation » est idiomatique et évocateur en français.
- source_word: מִשַּׁדַּי
  choice: envoyée par le Tout-Puissant
  rationale: La préposition מִן indique la provenance. « Envoyée par » explicite naturellement en français que la dévastation vient du Tout-Puissant, sans changer la relation sémantique.
- source_word: שַׁדַּי
  choice: le Tout-Puissant
  rationale: Le titre divin est traduit par son équivalent français traditionnel et intelligible.
- source_word: יָבֹוא
  choice: Il vient
  rationale: Le masculin singulier peut reprendre « le jour » ou annoncer l’événement menaçant. Le présent prophétique français exprime vivement son imminence tout en laissant le référent dans une certaine mesure ouvert.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme; « Yahweh » conserve ici le nom propre plutôt que de lui substituer un titre.
- issue: Traduction du titre שַׁדַּי
  choice: le Tout-Puissant
  alternative: Shaddaï
  rationale: Il s’agit d’un titre divin, traduit pour en communiquer le sens au lecteur français. Le jeu sonore hébreu avec שֹׁד ne peut être reproduit naturellement et est signalé en note.
- issue: Référent de יָבֹוא
  choice: Il vient
  alternative: elle viendra; cela viendra
  rationale: Le verbe masculin peut avoir pour référent le « jour » ou, plus largement, l’événement annoncé. « Il vient » reprend naturellement « le jour » sans développer davantage l’ambiguïté.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’exclamation restitue l’urgence prophétique. « Poussez des cris de détresse » évite le caractère potentiellement animal de « hurlez » dans le texte principal, tout en le conservant comme possibilité en note.
