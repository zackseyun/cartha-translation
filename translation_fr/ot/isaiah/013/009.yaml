source:
  edition: WLC
  text: הִנֵּ֤ה יוֹם יְהוָה֙ בָּ֔א אַכְזָרִ֥י וְ/עֶבְרָ֖ה וַ/חֲר֣וֹן אָ֑ף לָ/שׂ֤וּם הָ/אָ֨רֶץ֙ לְ/שַׁמָּ֔ה וְ/חַטָּאֶ֖י/הָ יַשְׁמִ֥יד מִמֶּֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/009.yaml
  text: Behold[a], the day of Yahweh is coming—cruel, with wrath and fierce anger—to make the land a desolation[d][c][b], and he will destroy its sinners from it.
translation:
  language: fr
  text: 'Voici[a] : le jour de Yahweh arrive, cruel, avec fureur et une ardente colère, pour faire de la terre[b] une désolation ; il en détruira les pécheurs[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Regardez ! »'
    reason: Alternative idiomatique pour la particule démonstrative הִנֵּה.
  - marker: b
    text: Le mot hébreu peut désigner « la terre » au sens large ou « le pays » concerné.
    reason: Préserver l’étendue sémantique de אֶרֶץ sans trancher silencieusement la portée géographique.
  - marker: c
    text: 'En hébreu, le verbe est au masculin singulier : son sujet peut être compris comme le jour de Yahweh ou, implicitement, Yahweh lui-même.'
    reason: Signaler l’ambiguïté grammaticale réelle du sujet de יַשְׁמִיד.
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » conserve la force démonstrative et solennelle de l’annonce prophétique tout en restant naturel en français moderne.
- source_word: יוֹם יְהוָה
  choice: le jour de Yahweh
  rationale: Cette formulation préserve l’expression prophétique consacrée et rend directement le nom divin יהוה par « Yahweh ».
- source_word: בָּא
  choice: arrive
  rationale: Le parfait hébreu présente ici comme certaine et imminente la venue du jour annoncé ; le présent français en restitue la vivacité.
- source_word: אַכְזָרִי
  choice: cruel
  rationale: Rendu direct de l’adjectif, qui caractérise ce jour comme impitoyable dans l’exercice du jugement.
- source_word: וְעֶבְרָה
  choice: plein de fureur
  rationale: « Fureur » exprime l’intensité de עֶבְרָה ; « plein de » relie naturellement ce substantif à l’adjectif précédent sans effacer l’accumulation des termes de colère.
- source_word: וַחֲרוֹן אָף
  choice: et d’une ardente colère
  rationale: L’expression hébraïque évoque littéralement l’embrasement de la colère ; « ardente colère » en garde l’image et l’intensité dans un français idiomatique.
- source_word: לָשׂוּם
  choice: pour réduire
  rationale: L’infinitif exprime le but de la venue. « Réduire… à » rend naturellement l’idée de faire passer la terre à un état de désolation.
- source_word: הָאָרֶץ
  choice: la terre
  rationale: « Terre » conserve en français une partie de l’amplitude de אֶרֶץ, qui peut viser le pays concerné ou la terre dans un sens plus large.
- source_word: לְשַׁמָּה
  choice: à la désolation
  rationale: « Désolation » exprime l’état de ruine et de dévastation sans réduire le terme à une seule réalité matérielle.
- source_word: וְחַטָּאֶיהָ
  choice: les pécheurs
  rationale: Le complément pronominal lié à la terre est repris par « en » dans la proposition, ce qui donne en français « les pécheurs qui s’y trouvent » de manière concise.
- source_word: יַשְׁמִיד
  choice: anéantir
  rationale: Le hifil de שׁמד désigne une destruction décisive ; « anéantir » en restitue la force sans préciser indûment le moyen.
- source_word: מִמֶּנָּה
  choice: en
  rationale: Le pronom adverbial « en » reprend naturellement « la terre » et exprime l’élimination de ses pécheurs hors d’elle.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » représente le nom propre présent dans le texte hébreu et évite de le remplacer silencieusement par un titre.
- issue: Sujet implicite de יַשְׁמִיד
  choice: Construction infinitive coordonnée laissant le sujet dépendre du « jour de Yahweh »
  alternative: « et il en anéantira les pécheurs », où « il » pourrait explicitement renvoyer à Yahweh ou au jour
  rationale: Le verbe hébreu masculin singulier peut grammaticalement avoir pour sujet le jour, tandis que Yahweh demeure l’agent théologique possible du jugement. La formulation « pour… et… » préserve cette tension sans imposer un référent personnel explicite.
translation_notes:
  register: Français international moderne, solennel et prophétique sans archaïsmes. L’accumulation « fureur… ardente colère » maintient l’intensité rhétorique de l’hébreu. La syntaxe infinitive évite de résoudre artificiellement l’ambiguïté portant sur l’agent de l’anéantissement.
