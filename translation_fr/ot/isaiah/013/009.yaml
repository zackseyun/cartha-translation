  naturalness: Le français est globalement naturel et de registre prophétique moderne. « Cruel, avec fureur et une ardente colère » est plus direct et plus proche de la juxtaposition hébraïque que « cruel, plein de fureur ». Une seconde proposition avec « il » rend aussi la phrase plus nette sans lever l’ambiguïté référentielle.
  terminology: « Yahweh », « le jour de Yahweh », « terre », « désolation » et « pécheurs » conviennent. « Détruira » rend שׁמד avec vigueur sans renforcer inutilement le verbe comme pourrait le faire « anéantir ».
