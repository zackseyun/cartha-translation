  variant: modern international French
source:
  edition: WLC
  text: מַשָּׂ֖א בָּבֶ֑ל אֲשֶׁ֣ר חָזָ֔ה יְשַׁעְיָ֖הוּ בֶּן אָמֽוֹץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/001.yaml
  text: The oracle concerning Babylon[a], which Isaiah son of Amoz saw.
translation:
  language: fr
  text: Proclamation au sujet de Babylone[a], qu’Ésaïe, fils d’Amots, a vue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fardeau de Babylone » ou « Sentence contre Babylone ». Le mot hébreu מַשָּׂא sert de titre à un message prophétique lourd de conséquences, souvent porteur de jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans les titres prophétiques, le terme désigne un message solennel et lourd de conséquences, souvent lié au jugement. « Proclamation » est naturel en français moderne sans imposer l’image potentiellement trompeuse d’un « fardeau ».
- source_word: בָּבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom de lieu.
- source_word: אֲשֶׁר
  choice: que
  rationale: Introduit naturellement en français la proposition relative qui qualifie la proclamation.
- source_word: חָזָה
  choice: a vue
  rationale: Conserve le verbe concret « voir » employé pour la perception prophétique, sans expliciter davantage que l’hébreu la manière dont le message a été reçu.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française biblique courante du nom du prophète.
- source_word: בֶּן
  choice: fils de
  rationale: Rend directement la formule généalogique hébraïque.
- source_word: אָמֽוֹץ
  choice: Amots
  rationale: Transcription française courante du nom personnel, distinct d’Amos.
theological_decisions:
- issue: Sens du titre prophétique מַשָּׂא
  choice: Proclamation au sujet de Babylone
  alternative: Fardeau de Babylone ; sentence contre Babylone
  rationale: « Au sujet de » préserve l’étendue possible du rapport avec Babylone sans transformer d’emblée le titre en condamnation explicite, même si le contexte annonce un jugement. La note conserve le sens littéral traditionnel et l’autre lecture contextuelle.
- issue: Valeur visionnaire de חָזָה
  choice: a vue
  alternative: a reçue en vision
  rationale: 'La traduction garde la métaphore visuelle du texte source et sa tension naturelle : le prophète « voit » une proclamation, sans que la traduction précise le mode de révélation.'
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve le caractère formel d’un titre prophétique tout en restant immédiatement compréhensible.
