source:
  edition: WLC
  text: הִנְ/נִ֛י מֵעִ֥יר עֲלֵי/הֶ֖ם אֶת מָדָ֑י אֲשֶׁר כֶּ֨סֶף֙ לֹ֣א יַחְשֹׁ֔בוּ וְ/זָהָ֖ב לֹ֥א יַחְפְּצוּ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/017.yaml
  text: Behold[a], I am stirring up the Medes against them, who do not value silver and do not delight in gold.
translation:
  language: fr
  text: Voici, je suscite contre eux les Mèdes, qui ne font aucun cas de l’argent et ne prennent aucun plaisir à l’or.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Voici, je
  rationale: La formule attire solennellement l’attention sur l’intervention divine annoncée. « Voici » conserve la force prophétique tout en restant naturel en français biblique moderne.
- source_word: מֵעִיר
  choice: je suscite
  rationale: Le participe hiphil de עור exprime l’action de faire se lever ou d’éveiller à l’action. « Je suscite » rend bien l’idée que Dieu met les Mèdes en mouvement, avec une valeur présente ou imminente.
- source_word: עֲלֵיהֶם
  choice: contre eux
  rationale: Dans ce contexte militaire, la préposition על marque l’hostilité et se traduit naturellement par « contre ».
- source_word: אֶת מָדָי
  choice: les Mèdes
  rationale: מָדַי désigne ici le peuple mède engagé dans l’action militaire, et non simplement son territoire.
- source_word: כֶּסֶף לֹא יַחְשֹׁבוּ
  choice: qui ne font aucun cas de l’argent
  rationale: חשב signifie ici considérer, estimer ou tenir pour précieux. « Ne font aucun cas de l’argent » exprime clairement leur indifférence à son égard sans réduire le verbe à une simple activité mentale.
- source_word: וְזָהָב לֹא יַחְפְּצוּ בוֹ
  choice: et ne prennent aucun plaisir à l’or
  rationale: חפץ peut exprimer le plaisir, l’attrait ou le désir. Cette formulation conserve sa nuance affective et représente naturellement le complément pronominal בוֹ.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient le ton solennel de l’annonce prophétique; « ne font aucun cas » et « ne prennent aucun plaisir » préservent les deux nuances lexicales distinctes du parallélisme hébreu.
