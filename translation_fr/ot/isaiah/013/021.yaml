base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/021.yaml
  text: But desert creatures will lie down there[a], and their houses will be full of owls; ostriches will dwell there[b], and wild goats will dance there.
translation:
  language: fr
  text: Mais les bêtes du désert s’y coucheront ; les maisons de la ville seront pleines de hiboux[a]. Les autruches y habiteront, et les boucs sauvages[b] y danseront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « créatures hurlantes » ou « chacals » ; le sens du terme hébreu אֹחִים est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « démons-boucs » ou « satyres » ; le terme hébreu שְׂעִירִים peut désigner des boucs velus et, dans certains contextes, avoir des connotations mythiques ou démoniaques.
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: se coucheront
  rationale: Le verbe רבץ décrit couramment des animaux qui se couchent ou s’installent en un lieu ; cette formulation conserve l’image concrète.
- source_word: צִיִּים
  choice: bêtes du désert
  rationale: Le terme désigne de façon générale des êtres associés aux régions arides et aux ruines, sans permettre d’identifier avec certitude une espèce précise.
- source_word: וּמָלְאוּ בָתֵּיהֶם
  choice: leurs maisons seront pleines de
  rationale: Cette tournure rend directement le possessif et l’idée que les maisons abandonnées sont désormais occupées par des animaux.
- source_word: אֹחִים
  choice: hiboux
  rationale: Le sens zoologique exact est incertain. « Hiboux » appartient à la tradition de traduction et convient à la scène de désolation, tandis qu’une note signale les autres possibilités.
- source_word: וְשָׁכְנוּ
  choice: y habiteront
  rationale: Le verbe שׁכן exprime le fait de demeurer ou de s’établir ; « habiteront » est naturel en français tout en gardant l’idée d’une occupation durable.
- source_word: בְּנוֹת יַעֲנָה
  choice: autruches
  rationale: L’expression hébraïque, littéralement « filles de l’autruche », fonctionne comme une désignation zoologique idiomatique ; le nom courant de l’animal convient en français.
- source_word: וּשְׂעִירִים
  choice: boucs sauvages
  rationale: Le sens premier renvoie à des êtres velus ou à des boucs. Cette traduction évite d’imposer une interprétation démonologique, tout en conservant celle-ci en note.
- source_word: יְרַקְּדוּ
  choice: danseront
  rationale: Le verbe רקד peut signifier danser, bondir ou sautiller. « Danseront » préserve la force poétique et l’étrangeté de l’image.
theological_decisions:
- issue: Faut-il comprendre שְׂעִירִים comme des animaux réels ou comme des êtres démoniaques ?
  choice: « boucs sauvages » dans le texte principal
  alternative: « démons-boucs » ou « satyres »
  rationale: Le mot peut recevoir des connotations mythiques ou démoniaques dans certains contextes, mais son sens lexical de base demeure lié aux boucs ou aux êtres velus. Le contexte n’impose pas de trancher en faveur d’une lecture pleinement démonologique ; l’autre lecture est donc signalée en note.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe poétique claire. Le vocabulaire reste concret et accessible ; les incertitudes zoologiques et la possible dimension démonologique sont conservées dans les notes plutôt que résolues dans le texte principal.
