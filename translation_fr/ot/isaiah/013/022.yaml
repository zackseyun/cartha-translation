base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/022.yaml
  text: Hyenas will cry out in her palaces[a], and jackals in her luxurious halls. Her time is near to come[c][b], and her days will not be prolonged.
translation:
  language: fr
  text: 'Les bêtes sauvages pousseront leurs cris dans ses palais[a][b],

    et les chacals dans ses demeures somptueuses.

    Son heure est proche d’arriver[c],

    et ses jours ne se prolongeront pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu désigne des animaux sauvages dont l’espèce exacte est incertaine; on propose notamment « hyènes » ou « chacals ».
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu est difficile et peut se comprendre littéralement comme « dans ses veuves ». Le contexte et le parallélisme favorisent toutefois le sens « dans ses palais », souvent rattaché à une autre lecture du mot.
    reason: textual_note
  - marker: c
    text: Babylone est personnifiée comme une femme, d’où « son heure » et « ses jours ».
    reason: cultural_note
lexical_decisions:
- source_word: וְעָנָה
  choice: pousseront leurs cris
  rationale: Le verbe signifie normalement « répondre », mais, avec des animaux dans une scène de désolation, il évoque leurs cris. Cette formulation française restitue naturellement l’image sonore sans préciser à l’excès le type de cri.
- source_word: אִיִּים
  choice: bêtes sauvages
  rationale: L’identification zoologique exacte est incertaine. Le choix d’un terme générique préserve cette incertitude, tandis que les principales possibilités sont signalées en note.
- source_word: בְּאַלְמנוֹתָיו
  choice: dans ses palais
  rationale: La forme massorétique est difficile et, prise littéralement, paraît signifier « dans ses veuves ». Le parallélisme avec les demeures somptueuses et le contexte de la ville dévastée favorisent le sens architectural traditionnel, probablement lié à une lecture « palais ».
- source_word: וְתַנִּים
  choice: et les chacals
  rationale: Dans les descriptions prophétiques de lieux dévastés, תַנִּים désigne vraisemblablement des chacals plutôt que des dragons ou des créatures marines.
- source_word: בְּהֵיכְלֵי עֹנֶג
  choice: dans ses demeures somptueuses
  rationale: הֵיכָל désigne un vaste édifice, souvent un palais, et עֹנֶג évoque l’agrément et le luxe. « Demeures somptueuses » rend clairement le contraste entre l’opulence passée et l’abandon futur.
- source_word: וְקָרוֹב לָבוֹא עִתָּהּ
  choice: Son heure est proche, elle arrive
  rationale: La tournure conserve la brièveté et l’imminence de l’hébreu. Le féminin renvoie à Babylone personnifiée.
- source_word: וְיָמֶיהָ לֹא יִמָּשֵׁכוּ
  choice: et ses jours ne se prolongeront pas
  rationale: La formulation suit de près l’image hébraïque de jours qui ne seront pas étendus, tout en restant idiomatique en français.
