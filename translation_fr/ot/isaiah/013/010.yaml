source:
  edition: WLC
  text: כִּֽי כוֹכְבֵ֤י הַ/שָּׁמַ֨יִם֙ וּ/כְסִ֣ילֵי/הֶ֔ם לֹ֥א יָהֵ֖לּוּ אוֹרָ֑/ם חָשַׁ֤ךְ הַ/שֶּׁ֨מֶשׁ֙ בְּ/צֵאת֔/וֹ וְ/יָרֵ֖חַ לֹֽא יַגִּ֥יהַ אוֹרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/010.yaml
  text: For the stars of the heavens and their constellations will not give their light; the sun is darkened at its rising[a], and the moon will not make its light shine.
translation:
  language: fr
  text: Car les étoiles du ciel et leurs constellations[a] ne répandront pas leur lumière ; le soleil s’obscurcit à son lever, et la lune ne fera pas luire sa lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leurs Orions ». Le terme hébreu peut désigner spécifiquement Orion, mais peut aussi avoir ici, au pluriel, le sens plus large de « constellations ».'
    reason: Alternative lexicale liée à la portée de כְּסִיל au pluriel.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication du jugement annoncé précédemment ; « Car » conserve clairement ce lien logique.
- source_word: כֹוכְבֵי הַשָּׁמַיִם
  choice: les étoiles du ciel
  rationale: Rendu direct et naturel du groupe construit hébreu, dans un registre prophétique soutenu.
- source_word: וּכְסִילֵיהֶם
  choice: et leurs constellations[a]
  rationale: כְּסִיל peut désigner spécifiquement Orion, mais son pluriel muni du suffixe « leurs » favorise ici un sens collectif plus large ; la note conserve l’autre possibilité.
- source_word: לֹא יָהֵלּוּ אוֹרָם
  choice: ne répandront pas leur lumière
  rationale: Cette formulation française exprime naturellement l’émission de lumière portée par la forme causative, sans lourdeur.
- source_word: חָשַׁךְ הַשֶּׁמֶשׁ בְּצֵאתוֹ
  choice: le soleil s’obscurcit dès son lever
  rationale: Le parfait hébreu est maintenu comme parfait prophétique vivement présenté au présent ; « dès son lever » rend idiomatiquement בְּצֵאתוֹ.
- source_word: וְיָרֵחַ לֹא יַגִּיהַ אוֹרוֹ
  choice: et la lune ne fera pas luire sa lumière
  rationale: « Faire luire » préserve la valeur causative du hifil de נגה tout en gardant une diction poétique et intelligible.
theological_decisions:
- issue: Nature de l’obscurcissement cosmique
  choice: Conserver directement les images cosmiques du texte sans les interpréter dans la traduction.
  alternative: Les expliciter soit comme un bouleversement astronomique littéral, soit comme une image de la chute de puissances terrestres.
  rationale: L’hébreu emploie une imagerie cosmique de jugement et de dé-création ; la traduction doit en préserver la force ainsi que l’ouverture interprétative.
- issue: Valeur temporelle de חָשַׁךְ
  choice: 'Présent prophétique : « s’obscurcit ».'
  alternative: 'Futur : « s’obscurcira » ou « sera obscurci ».'
  rationale: Le parfait, au milieu d’une annonce prophétique, peut présenter l’événement futur avec une vive certitude ; le présent français maintient cette tension plutôt que d’uniformiser tous les verbes au futur.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme poétique repose sur trois astres ou ensembles célestes parallèles. « Répandre leur lumière » est idiomatique, tandis que « faire luire » garde une légère élévation adaptée à l’oracle prophétique.
