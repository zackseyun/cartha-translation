revisions:
- from: Car les étoiles du ciel et leurs constellations[a] ne répandront pas leur lumière ; le soleil s’obscurcit dès son lever, et la lune ne fera pas luire sa lumière.
  to: Car les étoiles du ciel et leurs constellations[a] ne répandront pas leur lumière ; le soleil s’obscurcit à son lever, et la lune ne fera pas luire sa lumière.
  rationale: La révision supprime la nuance additionnelle de durée introduite par « dès » et reformule la note afin de maintenir l’ambiguïté de כְּסִילֵיהֶם sans trancher entre « Orions » et « constellations ». Le présent prophétique « s’obscurcit » est conservé, de même que le registre poétique et la structure du verset.
