  text: עַל כֵּן֙ שָׁמַ֣יִם אַרְגִּ֔יז וְ/תִרְעַ֥שׁ הָ/אָ֖רֶץ מִ/מְּקוֹמָ֑/הּ בְּ/עֶבְרַת֙ יְהוָ֣ה צְבָא֔וֹת וּ/בְ/י֖וֹם חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/013.yaml
  text: Therefore I will make the heavens tremble[a], and the earth will shake from its place, at the fury of Yahweh of Armies, in the day of his burning anger.
translation:
  language: fr
  text: 'C’est pourquoi je ferai trembler les cieux,

    et la terre sera ébranlée de sa place,

    sous la fureur de Yahweh des armées[a],

    au jour de son ardente colère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une formulation traditionnelle : « l’Éternel des armées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence de l’annonce de jugement qui précède.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Conserve la portée cosmique et le registre élevé du pluriel hébreu.
- source_word: אַרְגִּיז
  choice: je ferai trembler
  rationale: Rend la valeur causative du hiphil de רגז et identifie clairement Yahweh comme l’auteur du bouleversement.
- source_word: וְתִרְעַשׁ
  choice: et la terre sera ébranlée
  rationale: Exprime la violente secousse décrite par רעשׁ tout en maintenant la distinction avec « ferai trembler ».
- source_word: הָאָרֶץ
  choice: la terre
  rationale: Le parallélisme avec les cieux indique ici l’ensemble cosmique plutôt qu’un territoire particulier.
- source_word: מִמְּקוֹמָהּ
  choice: hors de sa place
  rationale: Rend directement l’idée d’un déplacement à partir de la place propre de la terre.
- source_word: בְּעֶבְרַת
  choice: sous la fureur de
  rationale: Communique l’intensité débordante de עֶבְרָה et convient à la relation causale ou circonstancielle exprimée par בְּ.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Transcrit le nom divin et traduit צְבָאוֹת de manière transparente, en conservant la force martiale du titre.
- source_word: וּבְיוֹם
  choice: au jour de
  rationale: Préserve l’expression temporelle prophétique dans un français naturel et digne.
- source_word: חֲרוֹן אַפּוֹ
  choice: son ardente colère
  rationale: Conserve l’image hébraïque de la chaleur de la colère sans lourdeur littérale.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte directement le tétragramme; « Yahweh » préserve sa fonction de nom propre sans le remplacer par un titre.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh des puissances / le Seigneur des armées
  rationale: « des armées » rend le sens concret de צְבָאוֹת et sa force dans cet oracle de jugement; la note signale une autre formulation française traditionnelle.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme cosmique et l’image de la colère ardente sont conservés; la syntaxe reste proche de l’hébreu sans devenir artificielle.
