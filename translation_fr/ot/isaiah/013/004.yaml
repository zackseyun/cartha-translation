id: ISA.13.4
reference: Isaiah 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֥וֹל הָמ֛וֹן בֶּֽ/הָרִ֖ים דְּמ֣וּת עַם רָ֑ב ק֠וֹל שְׁא֞וֹן מַמְלְכ֤וֹת גּוֹיִם֙ נֶֽאֱסָפִ֔ים יְהוָ֣ה צְבָא֔וֹת מְפַקֵּ֖ד צְבָ֥א מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/004.yaml
  text: The sound of a multitude in the mountains[a], like a great people! The sound of an uproar of kingdoms[b], of nations gathered together! Yahweh of hosts is mustering an army for battle.
translation:
  language: fr
  text: Le bruit d’une foule dans les montagnes[a], comme celui d’un peuple nombreux ! Le tumulte de royaumes, de nations rassemblées[b] ! Yahweh des armées mobilise une armée pour le combat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur les montagnes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Le fracas de royaumes, de nations qui se rassemblent ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וֹל
  choice: Le bruit de / Le fracas de
  rationale: קוֹל désigne un son, une voix ou un bruit. Ici, le contexte militaire appelle « bruit »; dans le second membre, « fracas » rend naturellement l’intensité produite avec שְׁאוֹן, tout en maintenant la reprise rhétorique.
- source_word: הָמ֛וֹן
  choice: une foule
  rationale: הָמוֹן peut désigner une multitude ou son tumulte. Puisque קוֹל exprime déjà l’élément sonore et que la comparaison évoque un peuple nombreux, « foule » met en avant la masse humaine.
- source_word: בֶּֽהָרִ֖ים
  choice: dans les montagnes
  rationale: La préposition ב est ici naturellement locative. « Dans les montagnes » conserve le relief de la scène; « sur les montagnes » demeure possible et figure en note.
- source_word: דְּמ֣וּת
  choice: comme celui de
  rationale: Le nom signifie formellement « ressemblance », mais il introduit ici une comparaison. « Comme celui de » relie clairement le bruit à celui d’un peuple nombreux.
- source_word: עַם רָ֑ב
  choice: un peuple nombreux
  rationale: רַב qualifie ici vraisemblablement l’importance numérique du peuple. « Nombreux » est plus clair en français moderne que « grand », qui pourrait suggérer surtout le prestige.
- source_word: שְׁא֞וֹן
  choice: fracas
  rationale: שְׁאוֹן évoque un tumulte sonore, un grondement ou une forte agitation. « Fracas » convient au rassemblement martial décrit.
- source_word: מַמְלְכ֤וֹת גּוֹיִם֙
  choice: de royaumes, de nations
  rationale: La juxtaposition peut être comprise comme une accumulation appositionnelle. La répétition de « de » préserve les deux désignations politiques sans réduire l’une à l’autre.
- source_word: נֶֽאֱסָפִ֔ים
  choice: rassemblées
  rationale: Le participe niphal de אסף peut décrire des nations déjà rassemblées ou en train de se rassembler. Le texte principal retient l’état résultant; la valeur progressive est signalée en note.
- source_word: יְהוָ֣ה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle « Yahweh », afin de conserver le nom propre divin plutôt que de lui substituer un titre.
- source_word: צְבָא֔וֹת
  choice: des armées
  rationale: Dans le titre divin יְהוָה צְבָאוֹת, « des armées » est intelligible en français moderne et conserve l’image de puissances rangées, sans préciser si elles sont célestes ou terrestres.
- source_word: מְפַקֵּ֖ד
  choice: mobilise
  rationale: פקד possède un large éventail de sens, dont compter, inspecter et passer en revue. Avec « armée pour le combat », il désigne ici l’action de réunir et préparer les forces; « mobilise » rend ce sens militaire avec naturel.
- source_word: צְבָ֥א מִלְחָמָֽה
  choice: une armée pour le combat
  rationale: L’expression désigne une force armée destinée à la guerre. « Une armée pour le combat » reste proche de la formulation hébraïque tout en étant idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve sa fonction de nom personnel sans remplacer celui-ci par un titre ni adopter la forme hybride traditionnelle « Jéhovah ».
- issue: Portée de צְבָאוֹת dans le titre divin
  choice: des armées
  alternative: des puissances célestes; de l’univers
  rationale: Le terme peut englober différentes armées ou puissances. La traduction générale « des armées » maintient cette ouverture et évite d’identifier exclusivement les forces comme célestes, d’autant que le contexte immédiat parle aussi d’une armée humaine.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les deux exclamations nominales conservent l’urgence auditive et le parallélisme de l’hébreu. « Peuple nombreux » clarifie la valeur quantitative de רַב, tandis que « mobilise » exprime de façon naturelle la préparation militaire.
