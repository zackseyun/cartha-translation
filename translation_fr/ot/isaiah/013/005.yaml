id: ISA.13.5
reference: Isaiah 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּאִ֛ים מֵ/אֶ֥רֶץ מֶרְחָ֖ק מִ/קְצֵ֣ה הַ/שָּׁמָ֑יִם יְהוָה֙ וּ/כְלֵ֣י זַעְמ֔/וֹ לְ/חַבֵּ֖ל כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/005.yaml
  text: They are coming from a distant land[c][b][a], from the end of the heavens— Yahweh and the weapons of his wrath— to destroy the whole earth.
translation:
  language: fr
  text: 'Ils viennent d’un pays lointain, de l’extrémité des cieux[a] : Yahweh et les armes de sa colère[b], pour dévaster toute la terre[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des confins des cieux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les instruments de sa colère ».
    reason: lexical_alternative
  - marker: c
    text: « Toute la terre » peut aussi se traduire par « tout le pays » ; l’imagerie cosmique du verset favorise ici le sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִים
  choice: Ils viennent
  rationale: Le participe masculin pluriel présente leur arrivée de manière vive. Le français fournit naturellement le pronom « ils » à partir du contexte.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: d’un pays lointain
  rationale: אֶרֶץ désigne ici un pays ou territoire, tandis que מֶרְחָק exprime l’éloignement. Cette formulation est naturelle en français moderne.
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: de l’extrémité des cieux
  rationale: קָצֶה signifie « extrémité, bout, limite ». « Les cieux » conserve la forme et l’ampleur cosmique de l’expression hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: וּכְלֵי זַעְמוֹ
  choice: et les armes de sa colère
  rationale: כְּלִי peut désigner un instrument, un objet ou une arme. Dans ce contexte militaire de jugement, « armes » convient, tandis que « colère » rend directement זַעַם.
- source_word: לְחַבֵּל
  choice: pour dévaster
  rationale: L’infinitif exprime le but. « Dévaster » restitue l’idée de ruine infligée sans imposer nécessairement l’anéantissement absolu.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: אֶרֶץ peut signifier « terre » ou « pays ». L’imagerie cosmique favorise ici « terre », tout en laissant l’autre possibilité en note.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom divin lui-même. « Yahweh » en préserve la fonction de nom propre sans lui substituer un titre.
- issue: Portée de כָּל הָאָרֶץ
  choice: toute la terre
  alternative: tout le pays
  rationale: La mention de « l’extrémité des cieux » favorise une portée cosmique, mais le sens territorial demeure lexicalement possible et est signalé en note.
- issue: Fonction de וּכְלֵי זַעְמוֹ
  choice: les armes de sa colère
  alternative: les instruments de sa colère
  rationale: Le contexte décrit les forces convoquées pour le jugement comme les moyens d’action de Yahweh. « Armes » exprime le cadre militaire sans préciser leur identité au-delà du texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation met en apposition « Yahweh et les armes de sa colère » comme sujet explicité après l’annonce de leur venue. Tous les marqueurs de notes figurent dans le texte.
