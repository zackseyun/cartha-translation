source:
  edition: WLC
  text: וּ/פָקַדְתִּ֤י עַל תֵּבֵל֙ רָעָ֔ה וְ/עַל רְשָׁעִ֖ים עֲוֺנָ֑/ם וְ/הִשְׁבַּתִּי֙ גְּא֣וֹן זֵדִ֔ים וְ/גַאֲוַ֥ת עָרִיצִ֖ים אַשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/011.yaml
  text: And I will punish the world for its evil[a], and the wicked for their iniquity; I will put an end to the pride of the arrogant[b], and I will humble the haughtiness of the ruthless.
translation:
  language: fr
  text: Je punirai le monde pour le mal qu’il commet[a], et les méchants pour leur faute. Je mettrai fin à l’orgueil des arrogants et j’abaisserai l’arrogance des gens impitoyables[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le monde habité ». Le terme hébreu rendu par « monde » désigne souvent le monde habité.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’abaisserai l’orgueil des gens impitoyables ». L’hébreu emploie dans ces deux propositions parallèles deux expressions très proches pour désigner l’élévation orgueilleuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Je punirai
  rationale: Avec עַל et, comme objets, le mal et les méchants, פקד exprime ici une intervention punitive ou une demande de comptes. « Je punirai » restitue directement cette force judiciaire en français courant.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תבל désigne couramment le monde habité. « Le monde » est naturel en français et conserve la portée universelle du propos sans la réduire à un seul pays.
- source_word: רָעָה
  choice: le mal qu’il commet
  rationale: Le parallélisme avec « les méchants » et « leur faute » indique ici le mal moral plutôt que le malheur. La relative explicite en français le rapport elliptique entre le monde et son mal sans faire du monde une simple abstraction.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce substantif pluriel désigne ceux qui agissent avec méchanceté ou culpabilité. « Les méchants » en conserve la formulation concise et collective.
- source_word: עֲוֺנָם
  choice: leur faute
  rationale: עָוֹן peut désigner la faute, la culpabilité ou sa peine. Dans ce contexte, il s’agit de l’acte moral qui appelle le jugement. « Faute » maintient ce sens sans déterminer plus précisément que l’hébreu le rapport entre iniquité et culpabilité.
- source_word: וְהִשְׁבַּתִּי
  choice: Je mettrai fin à
  rationale: La forme causative de שׁבת signifie faire cesser. Cette expression française en rend clairement la force.
- source_word: גְּאוֹן
  choice: l’orgueil
  rationale: Bien que גאון puisse parfois avoir un sens positif, son association avec זדים lui donne ici le sens négatif d’une exaltation orgueilleuse.
- source_word: זֵדִים
  choice: des arrogants
  rationale: זדים désigne des personnes présomptueuses, insolentes ou arrogantes. « Les arrogants » convient au parallélisme avec « orgueil ».
- source_word: וְגַאֲוַת
  choice: la fierté
  rationale: גאוה exprime une hauteur ou une élévation orgueilleuse. « Fierté » évite de répéter exactement « orgueil » tout en maintenant le parallélisme de deux termes proches.
- source_word: עָרִיצִים
  choice: des êtres impitoyables
  rationale: עריצים désigne des personnes violentes, oppressives ou redoutables. « Êtres impitoyables » préserve cette caractérisation morale sans les limiter à des dirigeants politiques.
- source_word: אַשְׁפִּיל
  choice: j’abaisserai
  rationale: La forme causative de שׁפל signifie rendre bas ou rabaisser. « J’abaisserai » conserve concrètement l’image de l’élévation orgueilleuse ramenée vers le bas.
theological_decisions:
- issue: Portée du jugement divin exprimée par תֵּבֵל
  choice: Le jugement vise « le monde », compris comme le monde habité et son ordre humain.
  alternative: Limiter la référence au pays ou à Babylone seule, celle-ci représentant éventuellement le monde.
  rationale: Même si Ésaïe 13 est un oracle contre Babylone, תבל et les expressions morales universelles de ce verset ont une portée plus large. La traduction conserve cette tension entre le cadre babylonien et l’horizon mondial au lieu de la résoudre.
- issue: Nature de רָעָה
  choice: Le terme désigne ici le mal moral commis par le monde.
  alternative: Le comprendre comme le malheur ou le désastre infligé au monde.
  rationale: Le parallélisme avec les méchants et leur faute favorise nettement le sens moral, sans transformer le jugement annoncé en simple description d’une catastrophe.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme binaire et le parallélisme du verset sont conservés. « J’abaisserai » maintient l’image verticale de l’hébreu; « orgueil » et « fierté » rendent deux quasi-synonymes sans les confondre entièrement.
