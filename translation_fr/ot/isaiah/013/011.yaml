  naturalness: La phrase est claire et conserve le parallélisme. La révision améliore l’idiomaticité de la dernière expression et emploie « arrogance », terme sans ambiguïté positive, pour le second quasi-synonyme hébreu.
  terminology: « Le monde », « mal », « méchants », « faute », « orgueil » et « abaisserai » sont des choix appropriés. « Arrogance » rend mieux l’élévation orgueilleuse négative que « fierté »; « gens impitoyables » exprime naturellement le caractère violent et oppressif de עָרִיצִים sans le réduire à une fonction politique.
