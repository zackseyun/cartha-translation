reference: Isaiah 13:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא תֵשֵׁ֣ב לָ/נֶ֔צַח וְ/לֹ֥א תִשְׁכֹּ֖ן עַד דּ֣וֹר וָ/ד֑וֹר וְ/לֹֽא יַהֵ֥ל שָׁם֙ עֲרָבִ֔י וְ/רֹעִ֖ים לֹא יַרְבִּ֥צוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/020.yaml
  text: It will never be inhabited[a], and it will not be dwelt in from generation to generation; no Arab will pitch his tent there, and shepherds will not make their flocks lie down there.
translation:
  language: fr
  text: Elle ne sera plus jamais habitée, et elle restera sans habitants de génération en génération. Aucun Arabe[a] n’y dressera sa tente, et les bergers n’y feront pas coucher leurs troupeaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Aucun nomade du désert ». Le terme hébreu peut désigner précisément un Arabe ou, plus largement dans ce contexte, un nomade vivant dans le désert.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵשֵׁב
  choice: sera … habitée
  rationale: Avec Babylone, une ville, comme sujet implicite, le verbe « s’asseoir, demeurer » exprime idiomatiquement le fait d’être habitée. La tournure passive est naturelle en français.
- source_word: לָנֶצַח
  choice: plus jamais
  rationale: Après la négation, « plus jamais » rend naturellement l’idée de perpétuité tout en soulignant la cessation définitive de l’habitation.
- source_word: תִשְׁכֹּן
  choice: personne n’y demeurera
  rationale: Le verbe signifie « demeurer, s’établir ». La formulation impersonnelle française maintient l’idée locative et distingue ce membre de « sera habitée ».
- source_word: עַד דּוֹר וָדוֹר
  choice: de génération en génération
  rationale: Cette expression hébraïque décrit une continuité à travers les générations successives.
- source_word: יַהֵל
  choice: dressera sa tente
  rationale: La forme verbale désigne ici l’action de camper sous une tente ; cette traduction conserve l’image concrète.
- source_word: עֲרָבִי
  choice: Arabe
  rationale: Le nom désigne normalement un Arabe ou un habitant de l’Arabie. Le sens contextuel plus large de nomade du désert est signalé en note.
- source_word: רֹעִים
  choice: bergers
  rationale: Le participe désigne ceux qui font paître et gardent les troupeaux.
- source_word: יַרְבִּצוּ
  choice: feront … coucher leurs troupeaux
  rationale: La forme causative signifie « faire coucher, faire reposer ». L’objet implicite, les troupeaux, est explicité d’après le contexte pastoral.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme hébreu entre les deux verbes de résidence est conservé sans produire une répétition artificielle ; l’image pastorale reste explicite.
