source:
  edition: WLC
  text: עַ֤ל הַר נִשְׁפֶּה֙ שְֽׂאוּ נֵ֔ס הָרִ֥ימוּ ק֖וֹל לָ/הֶ֑ם הָנִ֣יפוּ יָ֔ד וְ/יָבֹ֖אוּ פִּתְחֵ֥י נְדִיבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/002.yaml
  text: On a bare mountain raise a signal[a]; lift up the voice to them; wave the hand[c][b], that they may enter the gates of the nobles.
translation:
  language: fr
  text: Sur une montagne dénudée, dressez un signal[a] ; élevez la voix vers eux ; agitez la main[b], afin qu’ils entrent par les portes des nobles[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une bannière » ou « un étendard ». Le mot hébreu désigne souvent un signe élevé servant au rassemblement ou à la direction des troupes.
    reason: lexical_alternative
  - marker: b
    text: Ou « faites signe de la main ». Le geste sert probablement à appeler les forces assaillantes ou à leur indiquer d’avancer.
    reason: lexical_alternative
  - marker: c
    text: Ou « des princes ». Le terme hébreu peut désigner des nobles, des princes ou d’autres personnages de haut rang.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁפֶּה
  choice: dénudée
  rationale: Le terme décrit une montagne dépouillée de sa couverture végétale ou dégagée. « Dénudée » conserve l’image d’une hauteur exposée et convient au registre prophétique.
- source_word: נֵס
  choice: signal
  rationale: Dans ce contexte militaire, le mot désigne un signe élevé servant à rassembler ou à diriger des troupes. « Signal » exprime clairement sa fonction sans imposer l’idée d’une étoffe.
- source_word: הָרִימוּ קוֹל
  choice: élevez la voix
  rationale: Cette formulation française naturelle garde l’image de l’expression hébraïque plutôt que de la réduire au seul verbe « criez ».
- source_word: לָהֶם
  choice: vers eux
  rationale: La préposition indique le plus naturellement la direction de l’appel. « Vers eux » évite de préciser indûment s’il est favorable ou hostile.
- source_word: הָנִיפוּ יָד
  choice: faites signe de la main
  rationale: Le geste de la main sert vraisemblablement à appeler ou à diriger les forces. Cette expression reste concrète tout en rendant sa fonction probable en français courant.
- source_word: וְיָבֹאוּ
  choice: afin qu’ils entrent
  rationale: Après la série d’impératifs, la forme verbale peut exprimer le but ou le résultat. « Entrent » s’accorde naturellement avec les portes qui suivent.
- source_word: פִּתְחֵי
  choice: les portes
  rationale: Le pluriel construit désigne des points d’entrée ; dans le cadre d’une ville ou d’une place forte, « portes » est le terme français le plus idiomatique.
- source_word: נְדִיבִים
  choice: des nobles
  rationale: Le mot peut désigner des personnages éminents ou de haut rang. « Nobles » reste plus large que « princes » et préserve ainsi l’étendue sémantique de l’hébreu.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La série d’impératifs conserve le rythme énergique de l’hébreu. La formulation garde l’ambiguïté du destinataire de l’appel et ne précise pas davantage l’identité des « nobles ».
