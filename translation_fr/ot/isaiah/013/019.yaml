id: ISA.13.19
reference: Isaiah 13:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיְתָ֤ה בָבֶל֙ צְבִ֣י מַמְלָכ֔וֹת תִּפְאֶ֖רֶת גְּא֣וֹן כַּשְׂדִּ֑ים כְּ/מַהְפֵּכַ֣ת אֱלֹהִ֔ים אֶת סְדֹ֖ם וְ/אֶת עֲמֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/013/019.yaml
  text: And Babylon[a], the beauty of kingdoms, the glory of the Chaldeans’ pride, will be like God’s overthrow of Sodom and Gomorrah.
translation:
  language: fr
  text: Et Babylone, joyau des royaumes, éclat de l’orgueil des Chaldéens[a], connaîtra un bouleversement semblable à celui que Dieu a infligé à Sodome et à Gomorrhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « éclat de la majesté des Chaldéens ». Le mot hébreu peut désigner leur grandeur avec une nuance neutre, plutôt que leur orgueil.
    reason: alternative lexicale authentique pour גְּאוֹן
lexical_decisions:
- source_word: וְהָיְתָה
  choice: subira
  rationale: Dans ce discours prophétique, le parfait précédé de la conjonction a une valeur future. Avec la comparaison qui suit, « subira » exprime naturellement le sort futur de Babylone.
- source_word: בָבֶל
  choice: Babylone
  rationale: Forme française usuelle du nom de la ville.
- source_word: צְבִי מַמְלָכוֹת
  choice: joyau des royaumes
  rationale: צְבִי évoque ici la beauté ou la splendeur. L’expression idiomatique « joyau des royaumes » conserve la valeur éminente de l’apposition sans alourdir le vers poétique.
- source_word: תִּפְאֶרֶת גְּאוֹן כַּשְׂדִּים
  choice: éclat de l’orgueil des Chaldéens
  rationale: « Éclat » rend תִּפְאֶרֶת tout en se distinguant de צְבִי. « Orgueil » retient la nuance négative probable de גְּאוֹן dans cet oracle de jugement, tandis que la note conserve l’autre lecture possible.
- source_word: כַּשְׂדִּים
  choice: Chaldéens
  rationale: Conserve le gentilé historique du texte hébreu plutôt que de le généraliser en « Babyloniens ».
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: subira le même bouleversement que … lorsque Dieu les a renversées
  rationale: כְּ marque la comparaison et מַהְפֵּכָה une catastrophe ou un renversement. La formulation française explicite naturellement Dieu comme agent sans ajouter de contenu.
- source_word: אֶת סְדֹם וְאֶת עֲמֹרָה
  choice: Sodome et Gomorrhe
  rationale: Formes françaises conventionnelles des deux noms propres; les marques hébraïques de l’objet direct ne sont pas rendues séparément.
theological_decisions:
- issue: Sens de גְּאוֹן dans l’oracle de jugement
  choice: orgueil
  alternative: majesté, grandeur
  rationale: Dans Ésaïe et dans les contextes de jugement prophétique, le terme porte souvent une nuance négative. « Orgueil » maintient cette portée morale, tandis qu’une note signale honnêtement que le mot peut aussi désigner la majesté ou la grandeur.
- issue: Agent du renversement de Sodome et Gomorrhe
  choice: Dieu est explicitement l’agent
  alternative: une tournure nominale telle que « le bouleversement divin de Sodome et Gomorrhe »
  rationale: Le syntagme hébreu associe directement אֱלֹהִים au renversement. La proposition française rend cette relation avec clarté sans préciser au-delà du texte la manière du jugement.
translation_notes:
  register: Français international moderne, poétique et digne. « Joyau des royaumes » offre une formulation naturelle de la prééminence de Babylone; « bouleversement » puis « renversées » préservent l’image de מַהְפֵּכָה tout en évitant une construction nominale peu naturelle.
