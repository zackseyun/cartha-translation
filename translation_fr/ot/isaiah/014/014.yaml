source:
  edition: WLC
  text: אֶעֱלֶ֖ה עַל בָּ֣מֳתֵי עָ֑ב אֶדַּמֶּ֖ה לְ/עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/014.yaml
  text: I will ascend above the heights of the clouds[a]; I will make myself like the Most High.
translation:
  language: fr
  text: Je monterai au-dessus des hauteurs des nuages ; je me rendrai semblable au Très-Haut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: Je monterai
  rationale: Le qal inaccompli à la première personne du singulier de עלה exprime un mouvement vers le haut. « Monter » est naturel en français et convient au mouvement d’élévation revendiqué dans ce contexte.
- source_word: עַל
  choice: au-dessus de
  rationale: Avec le verbe de montée et « les hauteurs des nuages », la préposition indique ici une élévation qui dépasse ces hauteurs plutôt qu’une simple position sur elles.
- source_word: בָּמֳתֵי עָב
  choice: les hauteurs des nuages
  rationale: Le pluriel construit de בָּמָה avec עָב évoque les hauteurs ou les sommets des nuages. Cette formulation conserve l’image hébraïque dans un français clair.
- source_word: אֶדַּמֶּה
  choice: je me rendrai semblable à
  rationale: 'La forme hitpael de דמה porte une nuance réfléchie : le locuteur prétend se rendre comparable à quelqu’un. « Je me rendrai semblable à » préserve cette nuance sans réduire le sens au simple état « je serai comme ».'
- source_word: לְעֶלְיוֹן
  choice: au Très-Haut
  rationale: עֶלְיוֹן fonctionne ici comme un titre divin. « Le Très-Haut » est l’équivalent français établi et maintient la force théologique de la prétention exprimée.
theological_decisions:
- issue: Interprétation de עֶלְיוֹן comme titre divin
  choice: le Très-Haut
  alternative: le plus haut
  rationale: Dans cette déclaration d’auto-exaltation, le terme désigne Dieu sous son titre de « Très-Haut ». Cette traduction conserve la portée du texte sans préciser davantage l’identité du locuteur ni importer une interprétation doctrinale ultérieure.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme des deux déclarations à la première personne est conservé, ainsi que la progression de l’ascension vers la prétention à la ressemblance divine.
