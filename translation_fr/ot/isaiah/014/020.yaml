source:
  edition: WLC
  text: לֹֽא תֵחַ֤ד אִתָּ/ם֙ בִּ/קְבוּרָ֔ה כִּֽי אַרְצְ/ךָ֥ שִׁחַ֖תָּ עַמְּ/ךָ֣ הָרָ֑גְתָּ לֹֽא יִקָּרֵ֥א לְ/עוֹלָ֖ם זֶ֥רַע מְרֵעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/020.yaml
  text: You will not be joined with them in burial[a], because you have destroyed your land; you have slain your people. The offspring of evildoers will never be named.
translation:
  language: fr
  text: Tu ne seras pas enseveli avec eux, car tu as détruit ton pays ; tu as tué ton peuple. La descendance des malfaiteurs[a] ne sera jamais nommée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la postérité de ceux qui font le mal » ou « les descendants des méchants ».
    reason: Alternative lexicale reflétant l’étendue sémantique du collectif זֶרַע et de מְרֵעִים.
lexical_decisions:
- source_word: תֵחַד אִתָּם בִּקְבוּרָה
  choice: tu ne seras pas réuni à eux dans la sépulture
  rationale: Le verbe יחד exprime ici le fait d’être joint ou réuni à d’autres. La tournure française conserve l’exclusion du souverain de la sépulture accordée aux autres, sans préciser indûment un tombeau particulier.
- source_word: אַרְצְךָ
  choice: ton pays
  rationale: Dans ce contexte royal et politique, אֶרֶץ désigne le territoire gouverné. « Ton pays » est plus naturel en français actuel que « ta terre » et rend clairement cette portée.
- source_word: שִׁחַתָּ
  choice: tu as détruit
  rationale: Le piel de שׁחת exprime la destruction ou la ruine. « Détruit » garde la force de l’accusation prophétique.
- source_word: עַמְּךָ הָרָגְתָּ
  choice: tu as tué ton peuple
  rationale: Cette formulation directe respecte le sens ordinaire de הרג sans ajouter la qualification juridique impliquée par « assassiner ».
- source_word: לֹא יִקָּרֵא לְעוֹלָם
  choice: ne sera jamais nommée
  rationale: Le niphal de קרא signifie ici « être appelé » ou « être nommé ». « Ne sera jamais nommée » préserve l’idée d’un effacement durable sans la réduire à la simple absence de mention.
- source_word: זֶרַע מְרֵעִים
  choice: la descendance des malfaiteurs
  rationale: זֶרַע est un collectif pouvant désigner la postérité ou les descendants, tandis que מְרֵעִים est un pluriel désignant ceux qui font le mal. Cette traduction reste naturelle et conserve la portée collective et générique de l’hébreu.
theological_decisions:
- issue: 'La portée de זֶרַע מְרֵעִים : dynastie particulière du tyran ou descendance des malfaiteurs en général'
  choice: la descendance des malfaiteurs
  alternative: la descendance de ce malfaiteur ; les descendants du méchant
  rationale: L’hébreu emploie le pluriel « malfaiteurs » et formule donc l’expression de manière générique. Le contexte permet de l’appliquer à la lignée du souverain condamné, mais la traduction ne restreint pas explicitement le sens à lui seul.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme accusateur est marqué par le point-virgule. « Sépulture » maintient un registre prophétique soutenu sans employer le terme archaïque « sépulcre ».
