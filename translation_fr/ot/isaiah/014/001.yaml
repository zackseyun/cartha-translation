id: ISA.14.1
reference: Isaiah 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי֩ יְרַחֵ֨ם יְהוָ֜ה אֶֽת יַעֲקֹ֗ב וּ/בָחַ֥ר עוֹד֙ בְּ/יִשְׂרָאֵ֔ל וְ/הִנִּיחָ֖/ם עַל אַדְמָתָ֑/ם וְ/נִלְוָ֤ה הַ/גֵּר֙ עֲלֵי/הֶ֔ם וְ/נִסְפְּח֖וּ עַל בֵּ֥ית יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/001.yaml
  text: For Yahweh will have compassion on Jacob and will again choose Israel[a], and he will settle them on their own land. The foreigner will join them[b], and they will attach themselves to the house of Jacob.
translation:
  language: fr
  text: Car Yahvé aura compassion de Jacob, il choisira de nouveau Israël et les établira sur leur terre. Les étrangers se joindront à eux[a] et s’attacheront à la maison de Jacob[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les résidents étrangers » ou « les immigrés ». Le terme hébreu désigne souvent des personnes non autochtones qui résident parmi un autre peuple, et non de simples étrangers de passage.
    reason: Précision lexicale sur גֵּר et sur sa valeur collective dans ce contexte.
  - marker: b
    text: Ou « seront rattachés à la maison de Jacob ».
    reason: Le niphal de ספח peut aussi être compris avec une nuance passive.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici le fondement de l’annonce précédente et assure naturellement la continuité du discours.
- source_word: יְרַחֵם
  choice: aura compassion
  rationale: Rend la sollicitude et la miséricorde exprimées par le piel de רחם dans un français actuel et digne.
- source_word: יְהוָה
  choice: l’Éternel
  rationale: Rendu français biblique courant du tétragramme, qui maintient la référence au nom divin sans adopter une vocalisation française incertaine.
- source_word: וּבָחַר עוֹד בְּיִשְׂרָאֵל
  choice: il choisira de nouveau Israël
  rationale: עוד marque le renouvellement de l’acte de choisir dans le contexte de restauration, sans faire de cette élection un acte initial.
- source_word: וְהִנִּיחָם
  choice: les établira
  rationale: Le hiphil exprime ici le fait de faire reposer ou d’installer le peuple sur sa terre; « établira » convient au contexte du retour tout en gardant l’idée d’une installation durable.
- source_word: עַל אַדְמָתָם
  choice: sur leur terre
  rationale: Rend directement le nom אדמה et son suffixe possessif, sans ajouter à « leur » l’insistance absente du texte.
- source_word: הַגֵּר
  choice: l’immigré
  rationale: גֵּר désigne normalement un non-autochtone qui séjourne ou réside au sein d’un autre peuple; « immigré » exprime mieux ce statut durable que le terme très général « étranger ».
- source_word: וְנִלְוָה ... עֲלֵיהֶם
  choice: se joindra à eux
  rationale: Rend de façon idiomatique le niphal de לוה et la relation d’association indiquée par la préposition.
- source_word: וְנִסְפְּחוּ עַל בֵּית יַעֲקֹב
  choice: ils seront rattachés à la maison de Jacob
  rationale: Le niphal de ספח peut être passif ou médio-réfléchi. Le passif français préserve cette nuance sans déterminer explicitement l’agent du rattachement.
theological_decisions:
- issue: Portée du nouveau choix d’Israël
  choice: « il choisira de nouveau Israël »
  alternative: « il préférera encore Israël » ou une formulation explicitement politique ou eschatologique
  rationale: La traduction conserve l’idée d’un renouvellement de la faveur et de l’élection dans un contexte de restauration, sans préciser si sa portée est exclusivement nationale, politique ou eschatologique.
- issue: Identité et statut de הַגֵּר
  choice: « l’immigré »
  alternative: « l’étranger », « le résident étranger » ou « l’hôte étranger »
  rationale: Le mot vise un non-Israélite établi parmi un autre peuple plutôt qu’un simple voyageur. Le choix reste toutefois général et n’impose pas une catégorie juridique ultérieure.
- issue: Valeur du niphal וְנִסְפְּחוּ
  choice: « ils seront rattachés »
  alternative: « ils se rattacheront »
  rationale: La forme hébraïque admet une lecture passive ou médio-réfléchie. Le texte principal garde le passif formel, tandis que la note signale l’autre possibilité.
translation_notes:
  register: Français international moderne, sobre et digne. « Maison de Jacob » conserve l’image familiale et collective de l’hébreu. Les deux appels de note figurent dans le texte à l’endroit correspondant.
