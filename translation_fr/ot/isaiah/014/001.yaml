revisions:
- from: Car l’Éternel aura compassion de Jacob, il choisira de nouveau Israël et les établira sur leur terre. L’immigré se joindra à eux[a], et ils seront rattachés à la maison de Jacob[b].
  to: Car Yahvé aura compassion de Jacob, il choisira de nouveau Israël et les établira sur leur terre. Les étrangers se joindront à eux[a] et s’attacheront à la maison de Jacob[b].
  rationale: La révision rend explicitement le nom divin, remplace un terme français potentiellement administratif par un terme principal plus large et naturel, résout la discordance singulier/pluriel issue du singulier collectif hébreu, et choisit dans le texte principal la lecture associative la plus idiomatique de נספחו. Les notes conservent les alternatives lexicales et grammaticales pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : compassion envers Jacob, nouveau choix d’Israël, établissement sur leur terre et adjonction des non-Israélites à la maison de Jacob. Toutefois, « l’Éternel » substitue un titre au nom divin explicite יהוה; « Yahvé » le rend plus directement. La tournure « ils seront rattachés » est possible, mais moins naturelle et moins proche de la valeur associative de נספחו que « s’attacheront ».'
  naturalness: Le français est globalement sobre et clair. « L’immigré ... et ils » crée cependant une discordance de nombre perceptible. Le singulier collectif hébreu peut être rendu naturellement par « les étrangers » dans cette construction, sans modifier le sens. « Étranger » est plus idiomatique et moins chargé de connotations administratives contemporaines que « immigré »; la note précisera le statut résidentiel possible.
  terminology: « Yahvé », « Jacob », « Israël », « terre » et « maison de Jacob » conviennent au registre biblique moderne. « Les étrangers » conserve l’ouverture lexicale de גֵּר, tandis que la note indique « résident étranger » et « immigré » comme précisions possibles.
  issues:
  - severity: medium
    issue: Le nom divin יהוה est rendu par « l’Éternel ».
    rationale: « L’Éternel » est un titre interprétatif traditionnel, alors que l’hébreu emploie le tétragramme. « Yahvé » préserve plus directement le nom propre et s’aligne sur la décision de l’audit anglais (« Yahweh »).
  - severity: medium
    issue: « L’immigré se joindra à eux, et ils seront rattachés » présente une discordance de nombre et une formulation peu fluide.
    rationale: Le singulier הַגֵּר est collectif, mais le verbe final est au pluriel. « Les étrangers se joindront à eux et s’attacheront à la maison de Jacob » rend naturellement cette valeur collective et l’association exprimée par les deux verbes.
  - severity: low
    issue: « Ils seront rattachés » affaiblit la nuance d’adhésion/association de נספחו.
    rationale: Le niphal peut recevoir une nuance médio-réfléchie dans ce contexte. « S’attacheront » est idiomatique, reste non doctrinal et correspond mieux à la relation volontairement exprimée par le parallèle avec « se joindront ».
  revised_text: Car Yahvé aura compassion de Jacob, il choisira de nouveau Israël et les établira sur leur terre. Les étrangers se joindront à eux[a] et s’attacheront à la maison de Jacob[b].
  revised_footnotes:
  - marker: a
    text: Ou « les résidents étrangers » ou « les immigrés ». Le terme hébreu désigne souvent des personnes non autochtones qui résident parmi un autre peuple, et non de simples étrangers de passage.
    reason: Précision lexicale sur גֵּר et sur sa valeur collective dans ce contexte.
  - marker: b
    text: Ou « seront rattachés à la maison de Jacob ».
    reason: Le niphal de ספח peut aussi être compris avec une nuance passive.
  revision_rationale: La révision rend explicitement le nom divin, remplace un terme français potentiellement administratif par un terme principal plus large et naturel, résout la discordance singulier/pluriel issue du singulier collectif hébreu, et choisit dans le texte principal la lecture associative la plus idiomatique de נספחו. Les notes conservent les alternatives lexicales et grammaticales pertinentes.
