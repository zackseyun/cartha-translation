id: ISA.14.12
reference: Isaiah 14:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֵ֛יךְ נָפַ֥לְתָּ מִ/שָּׁמַ֖יִם הֵילֵ֣ל בֶּן שָׁ֑חַר נִגְדַּ֣עְתָּ לָ/אָ֔רֶץ חוֹלֵ֖שׁ עַל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/012.yaml
  text: How you have fallen from heaven[a], shining one, son of dawn! You have been cut down to the earth, you who subdued the nations.
translation:
  language: fr
  text: Comment es-tu tombé du ciel, astre brillant[a], fils de l’aurore ! Tu as été abattu à terre, toi qui terrassais les nations !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu הֵילֵל est traditionnellement rendu par « Lucifer » dans certaines traductions anciennes. Il désigne plus littéralement une figure céleste brillante, souvent comprise comme l’étoile du matin.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Comment
  rationale: Introduit l’exclamation étonnée et moqueuse de la lamentation sans ajouter explicitement « hélas ».
- source_word: נָפַלְתָּ מִשָּׁמַיִם
  choice: es-tu tombé du ciel
  rationale: Le passé composé rend naturellement en français l’accompli hébreu et conserve le contraste entre le ciel et la terre.
- source_word: הֵילֵל
  choice: astre brillant
  rationale: Rend la figure céleste lumineuse sans transformer le terme en nom propre ni imposer une identification astronomique absolument certaine.
- source_word: בֶּן־שָׁחַר
  choice: fils de l’aurore
  rationale: Conserve l’image poétique et la personnification de l’hébreu dans un français digne et intelligible.
- source_word: נִגְדַּעְתָּ לָאָרֶץ
  choice: Tu as été abattu à terre
  rationale: « Abattu » garde l’image d’une chose coupée ou renversée ainsi que la valeur passive; « à terre » est idiomatique et maintient l’opposition avec le ciel.
- source_word: חוֹלֵשׁ עַל־גּוֹיִם
  choice: toi qui terrassais les nations
  rationale: Le participe décrit l’action caractéristique passée du souverain; « terrasser » exprime sa domination destructrice tout en faisant écho à sa propre chute.
theological_decisions:
- issue: Faut-il rendre הֵילֵל par le nom traditionnel « Lucifer » ?
  choice: Traduction descriptive « astre brillant » dans le texte principal
  alternative: Lucifer; étoile du matin; astre du jour
  rationale: Dans ce contexte, le mot hébreu fonctionne comme une désignation poétique d’une figure céleste brillante, non comme un nom propre incontestable. La traduction descriptive respecte la primauté du texte hébreu et laisse ouverte la portée de l’image.
translation_notes:
  register: Poésie élevée mais actuelle. L’inversion « es-tu tombé » et l’apostrophe « fils de l’aurore » conservent la vigueur du chant satirique. Le marqueur [a] suit l’expression entière afin que la note éclaire à la fois le terme hébreu et son imagerie céleste.
