source:
  edition: WLC
  text: וְ/אַתָּ֞ה אָמַ֤רְתָּ בִֽ/לְבָבְ/ךָ֙ הַ/שָּׁמַ֣יִם אֶֽעֱלֶ֔ה מִ/מַּ֥עַל לְ/כֽוֹכְבֵי אֵ֖ל אָרִ֣ים כִּסְאִ֑/י וְ/אֵשֵׁ֥ב בְּ/הַר מוֹעֵ֖ד בְּ/יַרְכְּתֵ֥י צָפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/013.yaml
  text: But you said in your heart[a], ‘I will ascend to the heavens; I will raise my throne above the stars of God, and I will sit on the mount of assembly in the far reaches of the north.’
translation:
  language: fr
  text: 'Mais toi, tu as dit dans ton cœur : « Je monterai aux cieux, j’élèverai mon trône au-dessus des étoiles de Dieu ; je siégerai sur la montagne de l’assemblée, aux confins du nord[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « aux confins de Tsaphôn », si « Tsaphôn » fait ici allusion à la montagne cosmique connue dans les traditions de l’ancien Proche-Orient.'
    reason: Lecture alternative préservant la possibilité que צָפוֹן soit un nom propre plutôt que la simple désignation du nord, tout en rendant יַרְכְּתֵי par « aux confins ».
lexical_decisions:
- source_word: וְאַתָּה
  choice: Mais toi
  rationale: Dans ce contexte, la conjonction et le pronom marquent un contraste. « Mais toi » rend naturellement cette valeur adversative tout en conservant l’insistance portée par le pronom.
- source_word: אָמַרְתָּ בִלְבָבְךָ
  choice: tu as dit dans ton cœur
  rationale: L’expression hébraïque désigne une parole intérieure. La formulation française reste claire et conserve l’image biblique du cœur comme siège de la pensée et de la volonté.
- source_word: הַשָּׁמַיִם אֶעֱלֶה
  choice: Je monterai aux cieux
  rationale: « Aux cieux » rend la forme hébraïque et le mouvement ascendant dans un français naturel et solennel, adapté à cette déclaration orgueilleuse.
- source_word: מִמַּעַל לְכוֹכְבֵי אֵל
  choice: au-dessus des étoiles de Dieu
  rationale: La traduction conserve l’image littérale, susceptible d’évoquer aussi bien les astres que des êtres célestes, sans trancher cette ambiguïté.
- source_word: אָרִים כִּסְאִי
  choice: j’élèverai mon trône
  rationale: Le hifil de רום exprime l’action d’élever ou d’exalter. « J’élèverai » restitue à la fois le mouvement et la prétention à l’exaltation.
- source_word: וְאֵשֵׁב
  choice: je siégerai
  rationale: ישב peut signifier s’asseoir, demeurer ou siéger. Dans le contexte du trône, « siégerai » rend naturellement l’image royale sans expliciter davantage le symbole.
- source_word: בְּהַר מוֹעֵד
  choice: sur la montagne de l’assemblée
  rationale: מוֹעֵד désigne ici vraisemblablement une assemblée fixée ou convoquée. Cette formulation préserve le cadre cosmique possible sans l’assimiler à la « tente de la rencontre ».
- source_word: בְּיַרְכְּתֵי צָפוֹן
  choice: aux confins du nord
  rationale: יַרְכְּתֵי évoque des extrémités ou des régions reculées. « Aux confins du nord » est idiomatique et conserve l’imagerie géographique ou cosmique ; la possibilité que צָפוֹן soit le nom Tsaphôn est signalée en note.
theological_decisions:
- issue: Allusion possible à la montagne cosmique dans צָפוֹן
  choice: Traduire צָפוֹן par « le nord » dans le texte principal.
  alternative: Lire le nom propre « Tsaphôn » et comprendre une allusion à la montagne cosmique connue dans les traditions de l’ancien Proche-Orient.
  rationale: צָפוֹן signifie ordinairement « nord », sens immédiatement accessible. Le contexte de la « montagne de l’assemblée » permet toutefois une allusion à Tsaphôn ; la note préserve cette possibilité sans l’imposer.
- issue: Sens symbolique des « étoiles de Dieu »
  choice: Conserver littéralement « les étoiles de Dieu ».
  alternative: Expliciter par « les êtres célestes » ou réduire l’expression à « les étoiles ».
  rationale: L’expression peut désigner les astres tout en évoquant des êtres ou des puissances célestes. La traduction ne résout pas une image que l’hébreu laisse ouverte.
translation_notes:
  register: Français international actuel, digne et accessible. Le rythme de la déclaration est conservé par une succession de verbes au futur. « Aux cieux », « j’élèverai » et « je siégerai » maintiennent la solennité poétique sans archaïsme marqué.
