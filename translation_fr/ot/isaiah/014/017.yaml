  source_fidelity: 'Le sens contextuel de la dernière proposition (« ne laissait pas ses prisonniers rentrer chez eux ») est bien attesté par l’expression elliptique לא פתח ביתה אסיריו. Toutefois, la note actuelle donne une prétendue formulation littérale inexacte : l’hébreu ne dit pas « vers la maison à ses prisonniers ». Il convient de présenter avec prudence l’image d’« ouvrir » et la direction « vers la maison / chez soi », sans imposer une syntaxe française artificielle.'
  naturalness: La phrase est naturelle et le recours à l’imparfait convient à la caractérisation rhétorique du tyran dans la série relative. « Faisait du monde un désert » est toutefois plus idiomatique que « réduisait le monde en désert » tout en rendant fidèlement la construction hébraïque.
  terminology: « Monde », « désert », « villes » et « prisonniers » sont justes et de registre moderne soutenu. La traduction principale peut exprimer le sens contextuel de la libération refusée, à condition que la note conserve l’imagerie lexicale d’« ouvrir » et signale l’ellipse.
