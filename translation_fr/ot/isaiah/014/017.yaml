  text: שָׂ֥ם תֵּבֵ֛ל כַּ/מִּדְבָּ֖ר וְ/עָרָ֣י/ו הָרָ֑ס אֲסִירָ֖י/ו לֹא פָ֥תַח בָּֽיְתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/017.yaml
  text: who made the world like a wilderness and tore down its cities[a], who did not open the house for his prisoners?
translation:
  language: fr
  text: qui faisait du monde un désert et détruisait ses villes, qui ne laissait pas ses prisonniers rentrer chez eux[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, l’hébreu associe « ouvrir » à « vers la maison / chez soi » dans une expression elliptique. Le sens peut être : « ne libérait pas ses prisonniers pour qu’ils rentrent chez eux » ou « ne leur ouvrait pas le chemin du retour ».'
    reason: La note conserve l’image verbale d’« ouvrir », rend la valeur directionnelle de ביתה et présente les interprétations contextuelles sans attribuer à l’hébreu une construction française inexistante.
lexical_decisions:
- source_word: שָׂם
  choice: réduisait
  rationale: Dans la tournure « réduire en désert », le verbe exprime naturellement en français le résultat dévastateur de שׂים sans ajouter une causalité étrangère au contexte.
- source_word: תֵּבֵל
  choice: le monde
  rationale: תֵּבֵל désigne couramment le monde habité. « Le monde » est clair, actuel et conserve l’ampleur du propos.
- source_word: כַּמִּדְבָּר
  choice: en désert
  rationale: Le כ marque ici le résultat envisagé par comparaison. La locution française « réduire en désert » restitue naturellement l’image d’une région rendue désolée, sans la limiter à un désert de sable.
- source_word: וְעָרָיו
  choice: et ses villes
  rationale: 'Le français « ses » conserve opportunément l’ambiguïté du suffixe masculin singulier : les villes peuvent être comprises comme celles du domaine dévasté ou comme celles placées sous l’autorité du tyran.'
- source_word: הָרָס
  choice: démolissait
  rationale: הרס évoque l’action d’abattre ou de mettre à bas. « Démolissait » garde la force concrète du verbe avec les villes pour objet.
- source_word: אֲסִירָיו
  choice: ses prisonniers
  rationale: אֲסִיר désigne une personne détenue ou liée. « Prisonniers » est le terme français contemporain le plus direct dans ce contexte.
- source_word: לֹא פָתַח
  choice: ne laissait pas
  rationale: פתח signifie littéralement « ouvrir », mais avec les prisonniers et la direction indiquée par בָּיְתָה, la clause paraît exprimer le refus de leur ouvrir la possibilité du retour. La formulation idiomatique est retenue dans le texte, tandis que la note signale la forme littérale.
- source_word: בָּיְתָה
  choice: rentrer chez eux
  rationale: Le ה directionnel attaché à בַּיִת indique un mouvement vers la maison, d’où le sens contextuel « chez eux » ou « à la maison ». « Rentrer chez eux » exprime clairement cette direction en français.
