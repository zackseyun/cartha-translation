- from: Préparez le massacre de ses fils à cause de la faute de leurs pères[a], de peur qu’ils ne se dressent, ne prennent possession du pays[b] et ne remplissent la face du monde de villes[c].
  to: Préparez un massacre pour ses fils, à cause de la faute de leurs pères[a], de peur qu’ils ne se dressent, ne prennent possession du pays[b] et ne remplissent la face du monde de villes[c].
  rationale: 'La seule correction nécessaire est syntaxique : remplacer « le massacre de ses fils » par « un massacre pour ses fils ». Cela rend le complément לְבָנָיו de façon non ambiguë et restitue l’absence d’article du nom hébreu. Le reste du texte et les notes conservent de manière adéquate les ambiguïtés lexicales de עָוֹן et ירש ainsi que l’image difficile de la face du monde remplie de villes.'
