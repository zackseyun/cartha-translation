  text: הָכִ֧ינוּ לְ/בָנָ֛י/ו מַטְבֵּ֖חַ בַּ/עֲוֺ֣ן אֲבוֹתָ֑/ם בַּל יָקֻ֨מוּ֙ וְ/יָ֣רְשׁוּ אָ֔רֶץ וּ/מָלְא֥וּ פְנֵֽי תֵבֵ֖ל עָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/021.yaml
  text: Prepare slaughter for his sons because of the guilt of their fathers[a], lest they rise up and possess the land[c][b], and fill the face of the world with cities.
translation:
  language: fr
  text: Préparez un massacre pour ses fils, à cause de la faute de leurs pères[a], de peur qu’ils ne se dressent, ne prennent possession du pays[b] et ne remplissent la face du monde de villes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de la culpabilité de leurs pères » ou « à cause de l’iniquité de leurs pères » ; le mot hébreu peut désigner la faute, la culpabilité ou le châtiment qui en résulte.
    reason: lexical_alternative
  - marker: b
    text: Ou « n’héritent du pays » ; le verbe hébreu peut signifier « hériter », « prendre possession » ou « posséder ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « ne remplissent la face du monde de villes ».
    reason: literal_rendering
lexical_decisions:
- source_word: הָכִינוּ
  choice: Préparez
  rationale: L’impératif pluriel hiphil de כון ordonne de rendre quelque chose prêt. « Préparez » en conserve directement la force.
- source_word: לְבָנָיו
  choice: de ses fils
  rationale: בנים avec le suffixe masculin singulier signifie littéralement « ses fils ». Avec « massacre », la construction française naturelle est « le massacre de ses fils ».
- source_word: מַטְבֵּחַ
  choice: le massacre
  rationale: Le nom désigne une tuerie ou un abattage violent. « Massacre » restitue ici la gravité du jugement sans imposer l’idée plus précise d’un lieu d’exécution.
- source_word: בַּעֲוֺן אֲבוֹתָם
  choice: à cause de la faute de leurs pères
  rationale: עָוֹן peut désigner la faute, la culpabilité ou les conséquences de la faute. « Faute » garde la dimension morale tout en laissant ouverte la nuance exacte; בּ est rendu causalement.
- source_word: בַּל יָקֻמוּ
  choice: de peur qu’ils ne se dressent
  rationale: בַּל introduit ici un but ou résultat négatif. « Se dressent » conserve l’image de קום et convient à une accession à la puissance ou à l’action.
- source_word: וְיָרְשׁוּ אָרֶץ
  choice: ne prennent possession du pays
  rationale: ירש peut signifier hériter, prendre possession ou posséder. « Prendre possession » convient au contexte d’expansion politique; « pays » maintient la distinction entre אָרֶץ et תֵבֵל, « monde », dans le membre suivant.
- source_word: וּמָלְאוּ פְנֵי תֵבֵל
  choice: ne remplissent la face du monde
  rationale: La formulation conserve l’image hébraïque de la « face » du monde tout en restant intelligible en français.
- source_word: עָרִים
  choice: de villes
  rationale: Le texte massorétique porte le pluriel de « ville ». Malgré l’expression inhabituelle, cette leçon est traduite sans conjecture.
theological_decisions:
- issue: Le jugement des fils en lien avec la faute de leurs pères
  choice: Conserver explicitement le lien causal formulé par le verset
  alternative: Préciser que les fils ne sont jugés que s’ils reproduisent les fautes de leurs pères, ou comprendre עָוֹן uniquement comme le châtiment de la faute
  rationale: L’hébreu relie directement le massacre des fils à l עָוֹן de leurs pères. La traduction préserve cette tension théologique sans l’atténuer ni l’harmoniser avec d’autres textes.
- issue: Portée de אָרֶץ face à תֵבֵל
  choice: « pays » puis « monde »
  alternative: « terre » puis « monde »
  rationale: Cette distinction rend les deux termes hébreux distincts et permet de lire d’abord la prise d’un territoire, puis une extension à l’ensemble du monde habité, sans trancher plus précisément la portée géographique.
translation_notes:
  register: Français international moderne, digne et direct. Le subjonctif après « de peur que » exprime naturellement la visée négative de בַּל. L’expression inhabituelle « la face du monde de villes » est maintenue afin de respecter l’image et la difficulté du texte hébreu.
