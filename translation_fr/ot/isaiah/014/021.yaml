    issue: Ambiguïté de « le massacre de ses fils »
    rationale: En français, le complément en « de » peut être compris comme un génitif subjectif (« le massacre commis par ses fils ») aussi bien que comme l’objet du massacre. L’hébreu emploie לְבָנָיו, « pour/à l’intention de ses fils », dans un ordre de mise à mort. « Un massacre pour ses fils » rend explicitement la relation sans introduire une interprétation doctrinale ou historique.
