  text: נָ֥חָה שָׁקְטָ֖ה כָּל הָ/אָ֑רֶץ פָּצְח֖וּ רִנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/007.yaml
  text: All the earth is at rest and quiet[a]; they break out in singing.
translation:
  language: fr
  text: Toute la terre est en repos et tranquille[a] ; ils éclatent en cris de joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toute la terre a trouvé le repos et le calme ; ils éclatent en cris de joie. »'
    reason: 'Alternative aspectuelle et lexicale : les parfaits hébreux peuvent souligner l’entrée dans l’état de repos ; « calme » est une autre manière de rendre שָׁקְטָה.'
lexical_decisions:
- source_word: נָחָה
  choice: se repose
  rationale: Le parfait qal décrit ici l’état de repos qui résulte de la chute de l’oppresseur. Le présent français convient au tableau vivant du contexte.
- source_word: שָׁקְטָה
  choice: tranquille
  rationale: Associé à נָחָה, le verbe exprime le calme et l’absence de trouble. L’adjectif détaché « tranquille » rend naturellement cette seconde nuance sans alourdir la phrase.
- source_word: כָּל הָאָרֶץ
  choice: Toute la terre
  rationale: אָרֶץ peut désigner la terre ou un pays. La portée générale du chant satirique et כָּל favorisent ici « toute la terre », tout en conservant l’ampleur de l’hébreu.
- source_word: פָּצְחוּ
  choice: tous éclatent
  rationale: Le verbe évoque le déclenchement soudain et sonore d’un cri ou d’un chant. « Éclater en chants » restitue cette force expressive ; « tous » rend naturel en français le passage hébreu du sujet singulier collectif au verbe pluriel.
- source_word: רִנָּה
  choice: en chants de joie
  rationale: Le nom désigne un cri retentissant, souvent joyeux. « Chants de joie » explicite sobrement cette nuance positive dans une expression française courante.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le balancement poétique est conservé, ainsi que le passage du singulier collectif (« toute la terre ») au pluriel des êtres qui chantent.
