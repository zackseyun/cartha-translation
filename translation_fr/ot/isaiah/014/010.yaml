  text: כֻּלָּ֣/ם יַֽעֲנ֔וּ וְ/יֹאמְר֖וּ אֵלֶ֑י/ךָ גַּם אַתָּ֛ה חֻלֵּ֥יתָ כָמ֖וֹ/נוּ אֵלֵ֥י/נוּ נִמְשָֽׁלְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/010.yaml
  text: All of them will answer and say to you[a], ‘You too have become weak like us[b]; you have become like us.’
translation:
  language: fr
  text: 'Tous répondront et te diront : « Toi aussi, tu as été affaibli[a] comme nous ; tu es devenu semblable à nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es devenu faible comme nous » ; le verbe peut aussi être compris au sens de « tu as été rendu faible ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu as été comparé à nous » ou « tu es devenu notre égal ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Tous
  rationale: Le terme avec suffixe masculin pluriel désigne collectivement tous les défunts ou rois du contexte. « Tous » conserve sa force totalisante avec naturel.
- source_word: יַעֲנוּ וְיֹאמְרוּ אֵלֶיךָ
  choice: répondront et te diront
  rationale: Cette formulation reproduit les deux verbes de parole et rend naturellement en français le complément אֵלֶיךָ (« à toi »).
- source_word: גַּם אַתָּה
  choice: Toi aussi
  rationale: L’expression souligne avec ironie que le roi déchu partage désormais la condition de ceux qui parlent.
- source_word: חֻלֵּיתָ
  choice: tu as été affaibli
  rationale: Le pual de חלה exprime ici l’affaiblissement ou la perte de vigueur, plutôt qu’une maladie précise. Le passif préserve la forme verbale sans déterminer explicitement l’agent.
- source_word: כָמוֹנוּ
  choice: comme nous
  rationale: Comparaison directe et idiomatique, fidèle à l’hébreu.
- source_word: אֵלֵינוּ נִמְשָׁלְתָּ
  choice: Tu es devenu semblable à nous
  rationale: נמשל peut exprimer le fait d’être comparable ou semblable. Cette formulation naturelle conserve l’idée de la nouvelle condition du roi sans imposer la nuance plus étroite d’égalité.
theological_decisions:
- issue: Nature de la raillerie dans le séjour des morts
  choice: Présenter les morts comme prononçant poétiquement une raillerie sur la perte de puissance du roi et son assimilation à leur condition.
  alternative: Expliciter une doctrine de l’état intermédiaire ou accentuer une lecture mythologique des ombres.
  rationale: Le verset met en scène une parole poétique de dérision. La traduction en préserve l’image et la tension sans en tirer des affirmations doctrinales qui dépassent le texte.
translation_notes:
  register: Français international actuel, digne et accessible. Les exclamations font ressortir la raillerie poétique sans ajouter de contenu. Les deux propositions proches ont été maintenues afin de préserver le parallélisme et l’insistance de l’hébreu.
