id: ISA.14.22
reference: Isaiah 14:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/קַמְתִּ֣י עֲלֵי/הֶ֔ם נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת וְ/הִכְרַתִּ֨י לְ/בָבֶ֜ל שֵׁ֥ם וּ/שְׁאָ֛ר וְ/נִ֥ין וָ/נֶ֖כֶד נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/022.yaml
  text: And I will rise up against them[a], declares Yahweh of Armies, and I will cut off from Babylon name and remnant, offspring and posterity[b], declares Yahweh.
translation:
  language: fr
  text: Je me dresserai contre eux, déclare Yahweh, le maître des armées[a], et je retrancherai de Babylone nom et reste, descendance et postérité[b], déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Yahweh des armées »; traditionnellement : « le SEIGNEUR des armées » ou « le SEIGNEUR des puissances » selon les versions.'
    reason: lexical_alternative
  - marker: b
    text: L’expression cumulative « nom et reste, descendance et postérité » annonce la disparition de la mémoire de Babylone, de ses survivants et de toute continuité de sa lignée.
    reason: cultural_note
lexical_decisions:
- source_word: וְקַמְתִּי עֲלֵיהֶם
  choice: Je me dresserai contre eux
  rationale: Le parfait qal avec waw prend ici une valeur future dans le discours prophétique. « Se dresser contre » conserve l’image d’une intervention hostile et judiciaire.
- source_word: נְאֻם
  choice: déclare
  rationale: Dans cette formule prophétique, « déclare » exprime naturellement l’autorité solennelle de l’énoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend explicitement le nom divin présent dans le texte hébreu.
- source_word: צְבָאוֹת
  choice: le maître des armées
  rationale: Cette formulation française naturelle traduit le commandement exercé sur les armées célestes et terrestres, tout en conservant la force martiale du titre.
- source_word: וְהִכְרַתִּי לְבָבֶל
  choice: je retrancherai de Babylone
  rationale: Le hiphil de כרת exprime ici la suppression ou l’extermination. Après ce verbe, לְ a un sens privatif bien rendu par « de Babylone ».
- source_word: שֵׁם וּשְׁאָר
  choice: nom et reste
  rationale: 'La traduction littérale conserve la brièveté et l’ampleur de la formule : identité ou mémoire, ainsi que tout élément survivant.'
- source_word: נִין וָנֶכֶד
  choice: descendance et postérité
  rationale: Les deux termes associés couvrent la continuité familiale à travers les générations sans limiter le second à un degré généalogique précis.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: « Yahweh » préserve le caractère propre du nom d’alliance au lieu de le remplacer par un titre.
- issue: Rendu du titre יְהוָה צְבָאוֹת
  choice: Yahweh, le maître des armées
  alternative: Yahweh des armées / le SEIGNEUR des armées
  rationale: « Le maître des armées » est idiomatique en français moderne et rend explicite l’idée de commandement sans neutraliser la dimension militaire et judiciaire.
- issue: Portée de la série שֵׁם וּשְׁאָר וְנִין וָנֶכֶד
  choice: conserver les quatre éléments
  alternative: paraphraser comme l’anéantissement total de Babylone et de sa lignée
  rationale: La conservation de la série respecte la rhétorique cumulative du texte; une note en explicite la portée globale sans résoudre la formulation dans le corps du verset.
translation_notes:
  register: Français international moderne, solennel et accessible. Le rythme prophétique, la répétition finale de « déclare Yahweh » et la série nominale concise sont maintenus.
