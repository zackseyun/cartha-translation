source:
  edition: WLC
  text: זֹ֛את הָ/עֵצָ֥ה הַ/יְּעוּצָ֖ה עַל כָּל הָ/אָ֑רֶץ וְ/זֹ֛את הַ/יָּ֥ד הַ/נְּטוּיָ֖ה עַל כָּל הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/026.yaml
  text: This is the plan that is planned against all the earth[a], and this is the hand that is stretched out against all the nations.
translation:
  language: fr
  text: Voici le projet conçu contre toute la terre[a], et voici la main étendue contre toutes les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout le pays », si le terme désigne ici une région plutôt que la terre entière.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הָעֵצָה הַיְעוּצָה
  choice: Voici le projet conçu
  rationale: Cette formulation française naturelle conserve le lien lexical et rhétorique entre עֵצָה et le participe passif de יעץ, sans la lourdeur de « le plan planifié ».
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte de jugement, la préposition indique l’orientation hostile du projet et de la main.
- source_word: כָּל הָאָרֶץ
  choice: toute la terre
  rationale: אֶרֶץ peut désigner la terre entière ou un territoire. Le parallèle avec « toutes les nations » favorise ici une portée universelle, tout en signalant l’autre possibilité en note.
- source_word: וְזֹאת הַיָּד הַנְּטוּיָה
  choice: et voici la main étendue
  rationale: « Main » préserve l’image biblique de la puissance en action, et « étendue » rend naturellement le participe passif נְטוּיָה.
- source_word: כָּל הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici collectivement les nations, sans imposer l’opposition plus spécifique suggérée par « païens » ou « non-Juifs ».
theological_decisions:
- issue: Portée de הָאָרֶץ dans cet oracle de jugement
  choice: 'portée universelle : « toute la terre »'
  alternative: 'portée régionale : « tout le pays »'
  rationale: Le parallélisme avec « toutes les nations » soutient une portée mondiale, mais le sens territorial demeure lexicalement possible et est donc conservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle « Voici… et voici… » est conservée. « Projet conçu » maintient l’écho étymologique de l’hébreu dans une formulation française plus idiomatique que « plan planifié ».
