  variant: modern international French
source:
  edition: WLC
  text: הֵילִ֤ילִֽי שַׁ֨עַר֙ זַֽעֲקִי עִ֔יר נָמ֖וֹג פְּלֶ֣שֶׁת כֻּלֵּ֑/ךְ כִּ֤י מִ/צָּפוֹן֙ עָשָׁ֣ן בָּ֔א וְ/אֵ֥ין בּוֹדֵ֖ד בְּ/מוֹעָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/031.yaml
  text: Wail[a], O gate! Cry out, O city! Melt away, all of you, Philistia! For smoke comes from the north[c][b], and there is no straggler in his ranks.
translation:
  language: fr
  text: Gémis[a], porte ! Pousse des cris, ville ! Fonds[b], Philistie tout entière ! Car une fumée vient du nord, et personne ne traîne dans ses rangs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Lamente-toi » ; le verbe hébreu désigne un cri de lamentation ou de détresse.
    reason: lexical_alternative
  - marker: b
    text: Ou « effondre-toi de peur ». Le verbe hébreu peut évoquer la dissolution, l’abattement ou la perte de courage.
    reason: lexical_alternative
  - marker: c
    text: Ou « personne ne manque à la place qui lui est assignée ». La proposition hébraïque finale est difficile ; elle peut présenter les troupes de l’envahisseur comme entièrement rassemblées et bien ordonnées.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  choice: Hurle
  rationale: L’impératif exprime un cri intense de lamentation et de détresse. « Hurle » en conserve la vigueur, tandis que la note signale une formulation moins imagée.
- source_word: שַׁעַר
  choice: porte
  rationale: La porte de la ville est directement interpellée et représente aussi, par métonymie, la vie publique et les défenses de la cité.
- source_word: זַעֲקִי
  choice: Pousse des cris
  rationale: Cette expression française naturelle rend l’appel urgent à élever un cri de détresse et maintient le parallélisme avec « Hurle ».
- source_word: עִיר
  choice: ville
  rationale: Le nom est employé comme vocatif, en parallèle avec « porte ». En français, l’adresse directe se comprend sans ajouter « ô ».
- source_word: נָמוֹג
  choice: Défaille
  rationale: Le verbe évoque le fait de fondre, de perdre toute consistance ou tout courage. « Défaille » rend l’effondrement collectif sans en préciser excessivement la nature.
- source_word: פְּלֶשֶׁת כֻּלֵּךְ
  choice: tout entière, Philistie
  rationale: La Philistie est interpellée comme une entité collective féminine. « Tout entière » restitue le suffixe indiquant la totalité.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison du cri de détresse dans un registre prophétique naturel et digne.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Le syntagme indique directement la provenance de la menace.
- source_word: עָשָׁן
  choice: une fumée
  rationale: Le sens concret « fumée » est conservé sans expliciter s’il s’agit de destructions ou d’une image de l’armée en marche.
- source_word: בָּא
  choice: vient
  rationale: Le parfait hébreu reçoit ici une valeur présente et imminente dans le discours prophétique.
- source_word: וְאֵין בּוֹדֵד
  choice: et personne ne traîne
  rationale: Dans l’image militaire, בּוֹדֵד désigne vraisemblablement quelqu’un qui se trouve isolé du groupe ou reste en arrière. La formulation française exprime l’absence de retardataire.
- source_word: בְּמוֹעָדָיו
  choice: dans ses rangs
  rationale: Dans ce contexte d’invasion, le terme peut désigner les emplacements ou formations assignés. « Dans ses rangs » donne un sens militaire cohérent, tout en laissant la lecture plus littérale en note.
theological_decisions:
- issue: Sens de וְאֵין בּוֹדֵד בְּמוֹעָדָיו
  choice: La proposition décrit une force envahissante ordonnée, sans personne qui traîne dans ses rangs.
  alternative: « Personne ne manque à la place qui lui est assignée » ou, plus littéralement, « il n’y a pas d’isolé dans ses lieux ou temps fixés ».
  rationale: La fumée venant du nord suggère une armée ou une puissance destructrice en marche. Le sens militaire convient bien au contexte, mais le terme מוֹעֵד conserve une ambiguïté réelle entre rendez-vous, temps fixé, lieu assigné et formation.
translation_notes:
  register: Français international moderne, direct et solennel. Les vocatifs sont rendus sans « ô », aujourd’hui plus marqué, et les impératifs brefs préservent le rythme de l’oracle. L’image de la fumée demeure volontairement inexpliquée dans le corps du texte.
