id: ISA.14.32
reference: Isaiah 14:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מַֽה יַּעֲנֶ֖ה מַלְאֲכֵי ג֑וֹי כִּ֤י יְהוָה֙ יִסַּ֣ד צִיּ֔וֹן וּ/בָ֥/הּ יֶחֱס֖וּ עֲנִיֵּ֥י עַמּֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/032.yaml
  text: And what will one answer the messengers of the nation? That Yahweh has founded Zion[b][a], and in her the afflicted of his people will find refuge.
translation:
  language: fr
  text: Et que répondra-t-on aux messagers de la nation[a] ? Que Yahweh a fondé Sion, et qu’en elle les affligés[b] de son peuple trouveront refuge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux envoyés de la nation ». Le terme hébreu peut désigner des représentants ou des envoyés diplomatiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « les pauvres de son peuple » ou « les humbles de son peuple ». Le mot hébreu peut évoquer la pauvreté, l’affliction ou l’humilité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַה יַעֲנֶה
  choice: Et que répondra-t-on
  rationale: Le waw maintient le lien avec le contexte précédent, tandis que la tournure impersonnelle française rend naturellement le verbe à sujet générique sans imposer un référent précis.
- source_word: מַלְאֲכֵי גוֹי
  choice: aux messagers de cette nation
  rationale: מַלְאָךְ peut désigner ici des envoyés diplomatiques. Le démonstratif « cette » exprime le caractère contextuellement déterminé de גוֹי sans préciser davantage son identité.
- source_word: כִּי
  choice: Que
  rationale: La conjonction introduit ici le contenu de la réponse attendue plutôt qu’une cause explicite.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, qui préserve le nom personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: יִסַּד
  choice: a fondé
  rationale: Le verbe exprime l’action de fonder ou d’établir, avec une possible image architecturale. Le passé composé présente cette fondation comme accomplie et toujours pertinente.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom de lieu.
- source_word: וּבָהּ
  choice: et qu’en elle
  rationale: Le suffixe féminin singulier renvoie à Sion et conserve la personnification de la ville. La répétition de « que » rend clairement la coordination des deux éléments de la réponse.
- source_word: יֶחֱסוּ
  choice: trouveront refuge
  rationale: Cette expression française naturelle rend l’idée de se réfugier ou de bénéficier d’un abri, sans faire de Sion l’agent du salut.
- source_word: עֲנִיֵּי עַמּוֹ
  choice: les affligés de son peuple
  rationale: עָנִי peut désigner des personnes pauvres, opprimées, éprouvées ou humbles. « Affligés » convient au contexte de vulnérabilité tout en laissant les autres nuances en note.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le Tétragramme. « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Personnification de Sion dans le suffixe féminin
  choice: en elle
  alternative: en son sein ; là
  rationale: Le féminin hébreu renvoie à Sion. « En elle » conserve sobrement l’image de la ville personnifiée sans lui ajouter une interprétation théologique.
- issue: Portée sémantique de עֲנִיֵּי
  choice: les affligés
  alternative: les pauvres ; les humbles
  rationale: Le contexte évoque des membres vulnérables du peuple qui cherchent refuge, mais le terme peut aussi comporter une nuance économique ou sociale. La note maintient cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative impersonnelle évite d’ajouter un sujet absent de l’hébreu. Les notes préservent les principales ambiguïtés lexicales sans alourdir le verset.
