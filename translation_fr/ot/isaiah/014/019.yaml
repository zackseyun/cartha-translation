  text: וְ/אַתָּ֞ה הָשְׁלַ֤כְתָּ מִֽ/קִּבְרְ/ךָ֙ כְּ/נֵ֣צֶר נִתְעָ֔ב לְב֥וּשׁ הֲרֻגִ֖ים מְטֹ֣עֲנֵי חָ֑רֶב יוֹרְדֵ֥י אֶל אַבְנֵי ב֖וֹר כְּ/פֶ֥גֶר מוּבָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/019.yaml
  text: But you are cast out from your grave like a despised branch[a], clothed with the slain, those pierced by the sword, who go down to the stones of the pit[c][b], like a trampled corpse.
translation:
  language: fr
  text: Mais toi, tu as été jeté loin de ta tombe, comme un rameau que l’on a en horreur[a], couvert de morts, de ceux que l’épée a transpercés[b] et qui descendent jusqu’aux pierres de la fosse[c], comme un cadavre piétiné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un rejeton abhorré » ou « une pousse détestée ». Le mot hébreu peut désigner une pousse, un rejeton ou un rameau; il s’agit ici de quelque chose que l’on rejette.
    reason: lexical_alternative
  - marker: b
    text: Ou « de ceux que l’épée a frappés de part en part ». L’expression hébraïque est difficile; elle désigne vraisemblablement les morts au combat.
    reason: lexical_alternative
  - marker: c
    text: Dans ce langage poétique, « la fosse » évoque la tombe ou le séjour des morts; ses « pierres » peuvent faire penser à une sépulture aménagée avec des pierres.
    reason: cultural_note
lexical_decisions:
- source_word: הָשְׁלַכְתָּ מִקִּבְרְךָ
  choice: tu as été rejeté loin de ton tombeau
  rationale: 'Le hophal exprime un état résultant passif : le destinataire a été jeté à l’écart et privé d’une sépulture convenable. « Tombeau » convient ici au lieu d’inhumation royal.'
- source_word: כְּנֵצֶר נִתְעָב
  choice: comme un rameau que l’on a en horreur
  rationale: נֵצֶר désigne une pousse ou un rameau, tandis que נִתְעָב marque une répulsion forte. Cette formulation conserve l’image végétale sans importer ici la portée messianique possible du mot dans un autre contexte.
- source_word: לְבוּשׁ הֲרֻגִים
  choice: couvert de morts
  rationale: Littéralement, l’expression évoque le fait d’être « vêtu » des tués. « Couvert de morts » rend naturellement l’image macabre en français sans supposer qu’il porte leurs vêtements.
- source_word: מְטֹעֲנֵי חָרֶב
  choice: de ceux que l’épée a transpercés
  rationale: L’expression hébraïque est difficile, mais le contexte désigne les victimes du combat frappées ou traversées par l’épée. La traduction retient ce sens probable tout en signalant l’incertitude en note.
- source_word: יוֹרְדֵי אֶל אַבְנֵי בוֹר
  choice: qui descendent jusqu’aux pierres de la fosse
  rationale: La formulation conserve l’étrange image concrète des « pierres de la fosse » au lieu de la réduire simplement à la tombe.
- source_word: כְּפֶגֶר מוּבָס
  choice: comme un cadavre piétiné
  rationale: פֶגֶר désigne un corps mort, et מוּבָס un corps foulé aux pieds. « Cadavre piétiné » est précis, sobre et vigoureux.
theological_decisions:
- issue: Résonance messianique possible de נֵצֶר
  choice: rameau
  alternative: rejeton / pousse
  rationale: Même si נֵצֶר peut avoir ailleurs une résonance messianique, notamment en Ésaïe 11.1, le contexte immédiat décrit ici l’humiliation d’un souverain privé de sépulture. « Rameau » préserve la métaphore sans imposer une association théologique étrangère au verset.
translation_notes:
  register: Français international moderne, digne et lisible. Le tutoiement maintient l’adresse directe et méprisante du chant satirique. La syntaxe garde l’accumulation poétique de l’hébreu, tandis que les notes préservent ses difficultés lexicales et son image funéraire inhabituelle.
