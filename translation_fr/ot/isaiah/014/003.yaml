source:
  edition: WLC
  text: וְ/הָיָ֗ה בְּ/י֨וֹם הָנִ֤יחַ יְהוָה֙ לְ/ךָ֔ מֵֽ/עָצְבְּ/ךָ֖ וּ/מֵ/רָגְזֶ֑/ךָ וּ/מִן הָ/עֲבֹדָ֥ה הַ/קָּשָׁ֖ה אֲשֶׁ֥ר עֻבַּד בָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/003.yaml
  text: And it shall be[a], in the day when Yahweh gives you rest from your pain and your turmoil, and from the hard service with which you were made to serve[b],
translation:
  language: fr
  text: Alors, le jour où Yahweh t’accordera du repos en te délivrant de ta souffrance[a], de ton agitation et du dur labeur qui t’était imposé[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ta peine » ou « ton chagrin ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le dur labeur auquel tu étais astreint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors
  rationale: Introduit naturellement en français la circonstance future annoncée par la formule prophétique, tout en reliant ce verset au contexte précédent.
- source_word: בְּיוֹם
  choice: le jour où
  rationale: Rend directement l’expression temporelle hébraïque dans un français courant et digne.
- source_word: הָנִיחַ ... לְךָ
  choice: t’accordera du repos
  rationale: 'Conserve le sens causatif du hiphil de נוח : Yahweh procure ou accorde le repos au destinataire.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, au lieu de le remplacer par un titre.
- source_word: מֵעָצְבְּךָ
  choice: après ta souffrance
  rationale: עצב peut désigner la douleur, la peine ou le chagrin. « Souffrance » garde ici une portée assez large; « après » exprime idiomatiquement le repos accordé au sortir de cette affliction.
- source_word: וּמֵרָגְזֶךָ
  choice: ton trouble
  rationale: רגז évoque l’agitation, l’inquiétude ou le bouleversement; « trouble » préserve cette amplitude sans limiter le terme à une émotion précise.
- source_word: הָעֲבֹדָה הַקָּשָׁה
  choice: le dur labeur
  rationale: Exprime un travail pénible et oppressif sans préciser au-delà du texte la forme juridique de la servitude.
- source_word: אֲשֶׁר עֻבַּד בָּךְ
  choice: auquel tu étais astreint
  rationale: 'Rend le passif coercitif de עבד avec ב : ce labeur était exigé du destinataire. La formulation reste naturelle en français.'
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie explicitement le tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature du dur service
  choice: dur labeur auquel tu étais astreint
  alternative: dure servitude à laquelle tu étais soumis
  rationale: Le contexte indique une contrainte oppressive, mais « labeur » évite de définir plus précisément que l’hébreu le statut social ou juridique du destinataire.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase demeure ouverte par une virgule, puisque le verset se poursuit syntaxiquement au verset suivant. Le tutoiement singulier reproduit l’adresse hébraïque sans marquer en français la variation de genre grammatical du texte consonantique.
