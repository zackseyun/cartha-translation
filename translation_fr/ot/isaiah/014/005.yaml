  text: Yahweh has broken the staff of the wicked[a], the scepter of rulers,
translation:
  language: fr
  text: Yahweh a brisé le bâton des méchants, le sceptre des dirigeants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁבַר
  choice: a brisé
  rationale: Le qal accompli exprime une action achevée. Le passé composé convient naturellement au contexte et garde l’idée d’un acte dont l’effet demeure.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin, plutôt que substitution par un titre.
- source_word: מַטֵּה
  choice: bâton
  rationale: Le terme désigne un bâton ou une verge. « Bâton » reste concret et permet de le distinguer du terme parallèle rendu par « sceptre ».
- source_word: רְשָׁעִים
  choice: des méchants
  rationale: L’adjectif substantivé pluriel désigne collectivement les personnes méchantes sans précision de genre ajoutée.
- source_word: שֵׁבֶט
  choice: sceptre
  rationale: Dans ce parallélisme lié à l’exercice du pouvoir, « sceptre » exprime naturellement l’instrument ou l’emblème de l’autorité.
- source_word: מֹשְׁלִים
  choice: des dirigeants
  rationale: Le participe qal pluriel signifie ceux qui exercent le pouvoir. « Dirigeants » est direct et n’ajoute pas la nuance interprétative de « tyrans ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » conserve le nom personnel plutôt que de lui substituer un titre.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme poétique est conservé par « bâton » et « sceptre », tandis que les deux groupes humains restent distincts comme dans l’hébreu.
