id: ISA.14.8
reference: Isaiah 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גַּם בְּרוֹשִׁ֛ים שָׂמְח֥וּ לְ/ךָ֖ אַרְזֵ֣י לְבָנ֑וֹן מֵ/אָ֣ז שָׁכַ֔בְתָּ לֹֽא יַעֲלֶ֥ה הַ/כֹּרֵ֖ת עָלֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/008.yaml
  text: 'Even the cypresses rejoice over you[a], the cedars of Lebanon: ‘Since you have lain down, no woodcutter comes up against us.’'
translation:
  language: fr
  text: 'Même les cyprès[a] se réjouissent à ton sujet, ainsi que les cèdres du Liban : « Depuis que tu es couché, aucun bûcheron ne monte contre nous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « genévriers » ou « sapins »; l’espèce exacte désignée par le terme hébreu est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Même
  rationale: 'Marque ici une extension emphatique : jusque dans le monde des arbres, la chute du tyran provoque de la joie.'
- source_word: בְּרוֹשִׁים
  choice: cyprès
  rationale: Le terme désigne un conifère dont l’espèce exacte reste incertaine. « Cyprès » est un choix courant et convient au cadre forestier du Liban; l’incertitude botanique est signalée en note.
- source_word: שָׂמְחוּ לְךָ
  choice: se réjouissent à ton sujet
  rationale: La construction avec ל peut indiquer que la personne est l’objet ou l’occasion de la joie. Cette formulation française conserve cette latitude sans rendre la joie favorable au destinataire.
- source_word: אַרְזֵי לְבָנוֹן
  choice: les cèdres du Liban
  rationale: Rend directement et naturellement la construction hébraïque bien connue.
- source_word: מֵאָז
  choice: Depuis que
  rationale: Indique le point de départ temporel de la situation nouvelle décrite par les arbres.
- source_word: שָׁכַבְתָּ
  choice: tu es couché
  rationale: Préserve l’image hébraïque du fait de se coucher, qui évoque ici la mort ou la chute sans l’expliciter entièrement.
- source_word: לֹא יַעֲלֶה
  choice: aucun … ne monte
  rationale: Exprime la situation qui prévaut depuis la chute du roi tout en conservant le mouvement vers les forêts d’altitude suggéré par le verbe.
- source_word: הַכֹּרֵת
  choice: bûcheron
  rationale: Dans cette image sylvestre, le participe désigne celui qui abat ou coupe les arbres; « bûcheron » est clair et idiomatique.
- source_word: עָלֵינוּ
  choice: contre nous
  rationale: Traduit la direction hostile du mouvement vers les arbres et convient naturellement à la personnification.
theological_decisions:
- issue: Portée figurée de la joie des arbres
  choice: Les arbres sont personnifiés dans le chant satirique dirigé contre le roi déchu.
  alternative: Comprendre seulement une diminution littérale de l’exploitation forestière.
  rationale: Le contexte poétique personnifie les arbres. La traduction maintient cette image sans la réduire à une explication prosaïque.
- issue: Sens contextuel de שָׁכַבְתָּ
  choice: Conserver la métaphore « tu es couché ».
  alternative: Traduire explicitement par « tu es mort » ou « tu as été abattu ».
  rationale: La formulation retenue préserve l’ambiguïté poétique entre le repos, la mort et la chute du souverain.
translation_notes:
  register: Français moderne, digne et poétique. La syntaxe reste simple; le discours direct et la personnification sont conservés. « Se réjouissent à ton sujet » évite l’ambiguïté potentiellement positive de « se réjouissent pour toi ».
