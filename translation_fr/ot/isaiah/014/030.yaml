  text: וְ/רָעוּ֙ בְּכוֹרֵ֣י דַלִּ֔ים וְ/אֶבְיוֹנִ֖ים לָ/בֶ֣טַח יִרְבָּ֑צוּ וְ/הֵמַתִּ֤י בָֽ/רָעָב֙ שָׁרְשֵׁ֔/ךְ וּ/שְׁאֵרִיתֵ֖/ךְ יַהֲרֹֽג׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/030.yaml
  text: The firstborn of the poor will graze[a], and the needy will lie down in safety; and I will kill your root with famine[b], and it will slay your remnant.
translation:
  language: fr
  text: Les premiers-nés des pauvres paîtront[a], et les nécessiteux se coucheront en sécurité. Je ferai mourir ta racine par la famine, et il tuera ce qui restera de toi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les plus pauvres des pauvres ». L’hébreu dit littéralement « les premiers-nés des pauvres », expression qui peut avoir une valeur intensive.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu a littéralement : « il tuera ton reste ». Le sujet n’est pas précisé ; il peut s’agir de la famine personnifiée, de Dieu comme agent implicite ou d’un agent indéterminé.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָעוּ
  choice: paîtront
  rationale: Le qal de רעה désigne ici l’action de paître. « Paîtront » conserve l’image pastorale, reprise par « se coucheront ».
- source_word: בְּכוֹרֵי דַלִּים
  choice: les premiers-nés des pauvres
  rationale: La formulation traduit littéralement l’hébreu. Une valeur intensive, « les plus pauvres des pauvres », reste possible et figure en note.
- source_word: דַלִּים
  choice: les pauvres
  rationale: דל désigne couramment les personnes pauvres, faibles ou de condition modeste; « les pauvres » convient directement au contexte.
- source_word: וְאֶבְיוֹנִים
  choice: les nécessiteux
  rationale: אביון souligne le dénuement et le besoin. « Les nécessiteux » le distingue de דלים tout en restant intelligible.
- source_word: לָבֶטַח
  choice: en sécurité
  rationale: L’expression indique une situation de sûreté et s’associe naturellement en français au verbe « se coucher ».
- source_word: יִרְבָּצוּ
  choice: se coucheront
  rationale: רבץ évoque souvent des animaux qui se couchent. Ce choix maintient l’imagerie pastorale du verset.
- source_word: וְהֵמַתִּי
  choice: je ferai mourir
  rationale: Le hifil de מות signifie littéralement « faire mourir ». Cette formulation française conserve la valeur causative sans atténuer le jugement.
- source_word: בָרָעָב
  choice: par la famine
  rationale: La préposition ב marque ici le moyen ou l’instrument; « par la famine » est naturel en français.
- source_word: שָׁרְשֵׁךְ
  choice: ta racine
  rationale: שורש signifie « racine » et fonctionne métaphoriquement pour la source ou le fondement du peuple interpellé. L’image est conservée.
- source_word: וּשְׁאֵרִיתֵךְ
  choice: ce qui restera de toi
  rationale: שארית désigne le reste, les survivants. Cette formulation est naturelle et évite que « ton reste » soit compris comme un simple résidu abstrait.
- source_word: יַהֲרֹג
  choice: elle tuera
  rationale: Le verbe est à la troisième personne masculine singulière, mais son sujet n’est pas exprimé. En français, « elle » renvoie naturellement à « la famine », tout en signalant en note que l’hébreu laisse l’agent ambigu.
theological_decisions:
- issue: Sujet ambigu du dernier verbe au singulier
  choice: Comprendre « la famine » comme le sujet repris par « elle »
  alternative: Comprendre Dieu comme sujet implicite (« je tuerai »), ou laisser l’agent indéterminé
  rationale: Après « je ferai mourir », l’hébreu passe à une troisième personne masculine singulière sans sujet explicite. Le contexte permet de reprendre la famine personnifiée, mais cette identification n’est pas certaine; la note préserve donc l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme prophétique et l’imagerie pastorale. Le féminin « elle » est imposé en français si « la famine » est prise comme antécédent; la note documente le masculin grammatical et l’ambiguïté de l’hébreu.
