  text: וּ/לְקָח֣וּ/ם עַמִּים֮ וֶ/הֱבִיא֣וּ/ם אֶל מְקוֹמָ/ם֒ וְ/הִֽתְנַחֲל֣וּ/ם בֵּֽית יִשְׂרָאֵ֗ל עַ֚ל אַדְמַ֣ת יְהוָ֔ה לַ/עֲבָדִ֖ים וְ/לִ/שְׁפָח֑וֹת וְ/הָיוּ֙ שֹׁבִ֣ים לְ/שֹֽׁבֵי/הֶ֔ם וְ/רָד֖וּ בְּ/נֹגְשֵׂי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/002.yaml
  text: Peoples will take them and bring them to their place[a], and the house of Israel will possess them on the land of Yahweh as male servants and female servants. They will become captors of their captors[d][c][b], and they will rule over their oppressors.
translation:
  language: fr
  text: Des peuples les prendront et les amèneront chez eux[a]. La maison d’Israël les possédera, sur la terre de Yahweh[c], comme esclaves, hommes et femmes[d]. Ils feront prisonniers ceux qui les ont faits prisonniers[e], et ils domineront leurs oppresseurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers leur lieu ».'
    reason: clarification
  - marker: c
    text: « Yahweh » transcrit le nom divin יהוה.
    reason: name_explanation
  - marker: d
    text: L’hébreu emploie deux termes distincts et mentionne explicitement les esclaves des deux sexes.
    reason: source_form
  - marker: e
    text: 'L’hébreu répète la même racine pour souligner le renversement : ils captureront ceux qui les avaient capturés.'
    reason: wordplay
lexical_decisions:
- source_word: וּלְקָחוּם עַמִּים
  choice: Des peuples les prendront
  rationale: Le qal de לקח signifie couramment « prendre ». « Des peuples » rend le pluriel עַמִּים sans suggérer nécessairement des États-nations modernes.
- source_word: וֶהֱבִיאוּם אֶל־מְקוֹמָם
  choice: et les amèneront chez eux
  rationale: הביא signifie « amener, faire venir ». Dans ce contexte de retour, « chez eux » exprime naturellement le littéral « à leur lieu », tout en conservant le suffixe pluriel.
- source_word: וְהִתְנַחֲלוּם
  choice: les prendra en possession
  rationale: Le hitpael de נחל avec suffixe objet évoque ici l’acquisition comme possession ou héritage. La formulation française garde l’objet humain explicite et le lien avec le statut servile qui suit.
- source_word: בֵּית יִשְׂרָאֵל
  choice: La maison d’Israël
  rationale: Cette expression collective traditionnelle préserve la formulation nationale et familiale de l’hébreu.
- source_word: עַל אַדְמַת יְהוָה
  choice: sur la terre de Yahweh
  rationale: אַדְמָה désigne la terre ou le sol, et la préposition עַל est rendue par « sur ». Le nom divin יהוה est translittéré « Yahweh » plutôt que remplacé par un titre.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: comme esclaves, hommes et femmes
  rationale: Le contexte indique un statut d’asservissement, que « esclaves » rend sans euphémisme. Comme « esclave » est épicène en français, « hommes et femmes » restitue la distinction explicite entre עֲבָדִים et שְׁפָחוֹת.
- source_word: וְהָיוּ שֹׁבִים לְשֹׁבֵיהֶם
  choice: Ils feront prisonniers ceux qui les avaient faits prisonniers
  rationale: Cette formulation naturelle reproduit la répétition de la racine שבה et met clairement en relief le renversement entre captifs et ravisseurs.
- source_word: וְרָדוּ בְּנֹגְשֵׂיהֶם
  choice: et ils domineront sur leurs oppresseurs
  rationale: רדה exprime la domination ou l’exercice du pouvoir, tandis que נגשׂ désigne ici ceux qui oppriment. « Oppresseurs » convient mieux que le terme plus étroit « chefs de corvée ».
theological_decisions:
- issue: Le renversement où Israël possède et asservit ses anciens oppresseurs
  choice: Traduire directement l’image de possession, de captivité et d’esclavage
  alternative: Employer « serviteurs » ou généraliser en parlant seulement de soumission
  rationale: Le texte hébreu nomme expressément des personnes asservies et décrit un renversement politique et social. La traduction ne doit ni atténuer cette dureté ni transformer cette scène en approbation doctrinale générale de l’esclavage.
- issue: La traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération garde le caractère de nom propre du tétragramme au lieu de lui substituer un titre.
- issue: Le jeu de mots sur la captivité
  choice: Ils feront prisonniers ceux qui les avaient faits prisonniers
  alternative: Ils deviendront les ravisseurs de leurs ravisseurs
  rationale: La répétition française de « faire prisonnier » reflète la répétition de la racine hébraïque tout en restant immédiatement compréhensible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de l’hébreu, tandis que « chez eux » et « faire prisonnier » assurent une lecture naturelle. Le vocabulaire dur de la possession et de l’esclavage est conservé sans euphémisme ni amplification.
