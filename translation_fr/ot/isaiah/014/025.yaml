base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/025.yaml
  text: to break Assyria in my land[a], and on my mountains I will trample him; then his yoke will depart from upon them[b], and his burden from upon his shoulder will depart.
translation:
  language: fr
  text: pour briser l’Assyrien dans mon pays[a] et le piétiner sur mes montagnes. Alors son joug se retirera d’eux[b], et son fardeau quittera son épaule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Assyrie » ; le terme hébreu peut désigner la nation ou l’Assyrien qui la représente, notamment son roi ou son armée.
    reason: alternative_reading
  - marker: b
    text: L’hébreu passe ici du pluriel, « d’eux », au singulier, « son épaule ». Le singulier peut personnifier le peuple opprimé ou désigner chaque personne individuellement.
    reason: number_shift
lexical_decisions:
- source_word: לִשְׁבֹּר
  choice: pour briser
  rationale: L’infinitif construit exprime le but ou le résultat dans la continuité du serment précédent. « Briser » conserve directement la métaphore.
- source_word: אַשּׁוּר
  choice: l’Assyrien
  rationale: Le nom peut désigner l’Assyrie ou l’Assyrien, représentant du pouvoir impérial. Le masculin permet aussi de conserver naturellement en français la personnification et les suffixes singuliers qui suivent.
- source_word: בְּאַרְצִי
  choice: dans mon pays
  rationale: Dans ce contexte territorial, « mon pays » est naturel en français moderne tout en exprimant que le territoire appartient à Dieu.
- source_word: הָרַי
  choice: mes montagnes
  rationale: Rend littéralement le pluriel et le suffixe de première personne, en maintenant la portée topographique et théologique.
- source_word: אֲבוּסֶנּוּ
  choice: je le piétinerai
  rationale: Le verbe בוס signifie fouler ou piétiner. Le pronom masculin singulier renvoie à l’Assyrien personnifié.
- source_word: וְסָר ... יָסוּר
  choice: cessera de peser ... quittera
  rationale: Les deux formes de סור décrivent la disparition de l’oppression. La formulation française varie légèrement pour rester naturelle tout en conservant les deux mouvements parallèles.
- source_word: עֻלּוֹ
  choice: son joug
  rationale: Image courante de la domination oppressive ; le possessif renvoie à l’oppresseur assyrien.
- source_word: סֻבֳּלוֹ
  choice: son fardeau
  rationale: Désigne une charge imposée, en parallèle avec le joug. « Fardeau » maintient l’image physique et politique.
- source_word: שִׁכְמוֹ
  choice: son épaule
  rationale: Le texte massorétique porte un suffixe singulier. La traduction le conserve plutôt que de l’harmoniser avec le pluriel précédent.
theological_decisions:
- issue: Référent de אַשּׁוּר
  choice: « l’Assyrien », représentant personnifié de la puissance impériale
  alternative: « l’Assyrie », comme entité nationale et politique
  rationale: Les deux sens sont possibles. Le choix du masculin rend plus clairement en français la personnification singulière des propositions suivantes, sans réduire le référent à un seul roi.
- issue: Passage du pluriel au singulier chez les opprimés
  choice: Conserver « sur eux » puis « son épaule »
  alternative: 'Harmoniser au pluriel : « leurs épaules »'
  rationale: L’hébreu passe explicitement du pluriel au singulier. La traduction maintient cette tension textuelle sans décider si le singulier personnifie le peuple ou possède une valeur distributive.
translation_notes:
  register: Français international actuel, sobre et digne. Le verset demeure une proposition de but liée au contexte précédent. Les images concrètes du piétinement, du joug, du fardeau et de l’épaule sont conservées ; la légère étrangeté du passage du pluriel au singulier est volontaire.
