  text: אַֽל תִּשְׂמְחִ֤י פְלֶ֨שֶׁת֙ כֻּלֵּ֔/ךְ כִּ֥י נִשְׁבַּ֖ר שֵׁ֣בֶט מַכֵּ֑/ךְ כִּֽי מִ/שֹּׁ֤רֶשׁ נָחָשׁ֙ יֵ֣צֵא צֶ֔פַע וּ/פִרְי֖/וֹ שָׂרָ֥ף מְעוֹפֵֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/029.yaml
  text: Do not rejoice, all of you Philistia, because the rod that struck you is broken; for from the root of the serpent will come out a viper, and its fruit will be a flying fiery serpent.
translation:
  language: fr
  text: Ne te réjouis pas, Philistie tout entière, de ce que le bâton de celui qui te frappait est brisé ; car de la racine du serpent sortira une vipère, et son fruit sera un serpent brûlant qui vole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un serpent brûlant volant » ; l’expression hébraïque désigne littéralement un « brûlant qui vole » et son identification précise reste incertaine.'
    reason: Signaler la formulation inhabituelle de l’hébreu et l’incertitude lexicale sans effacer l’image du texte.
lexical_decisions:
- source_word: פְלֶשֶׁת כֻּלֵּךְ
  choice: Philistie, toi tout entière
  rationale: Reproduit l’adresse directe au pays personnifié et rend explicitement l’idée de totalité portée par כֻּלֵּךְ.
- source_word: שֵׁבֶט מַכֵּךְ
  choice: le bâton qui te frappait
  rationale: « Bâton » conserve l’image de l’instrument d’autorité ou de châtiment, tandis que le participe est rendu naturellement par une relative.
- source_word: מִשֹּׁרֶשׁ נָחָשׁ
  choice: de la racine du serpent
  rationale: Maintient la métaphore généalogique ou dynastique du texte sans en préciser l’interprétation historique.
- source_word: צֶפַע
  choice: une vipère
  rationale: Terme français courant désignant un serpent venimeux, sans prétendre identifier avec certitude une espèce précise.
- source_word: שָׂרָף מְעוֹפֵף
  choice: un serpent brûlant qui vole
  rationale: « Serpent brûlant » exprime l’appellation imagée שָׂרָף dans ce contexte, et « qui vole » rend directement מְעוֹפֵף tout en préservant l’étrangeté de l’image.
theological_decisions:
- issue: Identification du bâton brisé, du serpent, de la vipère et de leur fruit
  choice: Conserver les images sans identifier leurs référents historiques ou eschatologiques
  alternative: Nommer explicitement des rois ou puissances politiques déterminés
  rationale: Le verset lui-même ne donne pas ces identifications ; les ajouter trancherait une ambiguïté interprétative que la traduction doit préserver.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La personnification féminine de la Philistie est conservée par « toi tout entière ». La ponctuation maintient le mouvement argumentatif des deux propositions introduites par « car ».
