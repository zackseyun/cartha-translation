  text: רֹאֶ֨י/ךָ֙ אֵלֶ֣י/ךָ יַשְׁגִּ֔יחוּ אֵלֶ֖י/ךָ יִתְבּוֹנָ֑נוּ הֲ/זֶ֤ה הָ/אִישׁ֙ מַרְגִּ֣יז הָ/אָ֔רֶץ מַרְעִ֖ישׁ מַמְלָכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/016.yaml
  text: 'Those who see you will stare at you; they will look closely at you: ‘Is this the man who made the earth tremble[a], who shook kingdoms,’'
translation:
  language: fr
  text: 'Ceux qui te verront te fixeront du regard ; ils t’observeront attentivement : « Est-ce là l’homme qui faisait trembler la terre, qui ébranlait les royaumes, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹאֶיךָ
  choice: Ceux qui te voient
  rationale: Le participe qal pluriel muni du suffixe de deuxième personne masculine singulière est employé comme substantif. Cette formulation naturelle conserve l’adresse directe.
- source_word: אֵלֶיךָ יַשְׁגִּיחוּ
  choice: te fixent du regard
  rationale: Le hiphil de שׁגח exprime ici un regard dirigé et soutenu. « Fixer du regard » rend l’attention intense et l’étonnement du contexte.
- source_word: אֵלֶיךָ יִתְבּוֹנָנוּ
  choice: ils t’examinent attentivement
  rationale: La forme réfléchie de בין évoque l’observation attentive et l’examen. Ce choix complète le regard soutenu de la proposition précédente sans réduire le verbe à la seule perception visuelle.
- source_word: הֲזֶה
  choice: Est-ce là
  rationale: La particule interrogative jointe au démonstratif introduit une question marquée par la stupeur. « Est-ce là » en restitue naturellement la force rhétorique.
- source_word: הָאִישׁ
  choice: l’homme
  rationale: Le nom masculin singulier désigne le tyran déchu comme un homme. La traduction conserve cette désignation explicite sans lui imposer une identification ultérieure.
- source_word: מַרְגִּיז הָאָרֶץ
  choice: qui faisait trembler la terre
  rationale: Le participe causatif exprime le fait de provoquer tremblement ou agitation. L’imparfait français convient à l’activité passée caractéristique du personnage contemplé après sa chute.
- source_word: מַרְעִישׁ מַמְלָכוֹת
  choice: qui ébranlait les royaumes
  rationale: Le participe hiphil de רעשׁ signifie causer une secousse ou un bouleversement. « Ébranler » est idiomatique pour des royaumes et maintient le parallélisme avec la terre qui tremble.
theological_decisions:
- issue: Référent de « l’homme » dans le chant satirique
  choice: Traduire simplement comme la désignation d’un souverain humain.
  alternative: Identifier dans le texte principal cet homme à Satan/Lucifer, ou simultanément au roi de Babylone et à un rebelle cosmique.
  rationale: L’hébreu de ce verset dit « l’homme », et le contexte littéraire immédiat présente un chant satirique visant le roi de Babylone. La traduction ne doit pas introduire dans le verset une identification théologique postérieure.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme binaire du regard puis de la question est préservé, ainsi que le parallélisme entre la terre et les royaumes. Aucun appel de note n’est nécessaire, puisque la nuance d’examen attentif est exprimée directement dans le texte.
