  text: וְ/שַׂמְתִּ֛י/הָ לְ/מוֹרַ֥שׁ קִפֹּ֖ד וְ/אַגְמֵי מָ֑יִם וְ/טֵֽאטֵאתִ֨י/הָ֙ בְּ/מַטְאֲטֵ֣א הַשְׁמֵ֔ד נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/023.yaml
  text: I will make her a possession of the hedgehog and pools of water[a], and I will sweep her with the broom of destruction, declares Yahweh of Armies.
translation:
  language: fr
  text: Je ferai d’elle le domaine du hérisson[a] et des étangs ; je la balaierai avec le balai de la destruction, déclare Yahweh des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu קִפֹּד désigne probablement un animal vivant dans le désert ou parmi les ruines, mais son identification est incertaine. On propose aussi « porc-épic », « hibou » ou, traditionnellement, « butor ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: Je ferai d’elle
  rationale: Le verbe שׂוּם peut signifier « mettre, établir, faire ». Avec le complément introduit par לְ, cette tournure exprime naturellement en français le changement de Babylone en domaine de créatures sauvages.
- source_word: לְמוֹרַשׁ
  choice: le domaine de
  rationale: מוֹרָשׁ désigne une possession ou un territoire occupé. « Le domaine de » restitue clairement l’idée que la ville en ruine appartiendra désormais à l’animal nommé ensuite.
- source_word: קִפֹּד
  choice: hérisson
  rationale: L’identification de cet animal vivant dans les déserts ou les ruines reste incertaine. « Hérisson » est un équivalent moderne plausible, tandis que les autres possibilités sont signalées en note.
- source_word: וְאַגְמֵי מָיִם
  choice: et un lieu couvert d’étangs
  rationale: Le pluriel אַגְמֵי évoque des étangs, bassins ou marécages. Cette formulation française s’articule avec « Je ferai d’elle » tout en conservant l’image d’un territoire inondé et désolé.
- source_word: וְטֵאטֵאתִיהָ
  choice: je la balaierai
  rationale: Le verbe rare טאטא signifie « balayer ». La traduction conserve la métaphore vive de l’élimination complète de Babylone.
- source_word: בְּמַטְאֲטֵא הַשְׁמֵד
  choice: avec le balai de la destruction
  rationale: Le בְּ est instrumental, מַטְאֲטֵא désigne un balai, et הַשְׁמֵד exprime la destruction. La construction nominale frappante de l’hébreu est conservée.
- source_word: נְאֻם
  choice: déclare
  rationale: Équivalent français courant et solennel de la formule prophétique introduisant l’auteur de la déclaration.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin présent dans le texte hébreu, plutôt que substitution par un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: צְבָאוֹת signifie littéralement « armées » ou « troupes ». Cette expression transparente conserve la portée martiale du titre divin.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le Seigneur
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre sans lui substituer un titre.
- issue: Référent des suffixes féminins
  choice: d’elle / la
  alternative: en faire / le
  rationale: Les suffixes féminins renvoient à Babylone, ville personnifiée dans le contexte prophétique. Le féminin français préserve cette personnification.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore concrète du balayage est maintenue, ainsi que la personnification féminine de Babylone. Le point-virgule distingue les deux images successives sans affaiblir leur parallélisme.
