  yaml_path: translation/ot/isaiah/014/028.yaml
  text: 'In the year of the death of King Ahaz[a], this oracle came:'
translation:
  language: fr
  text: 'L’année de la mort du roi Ahaz, cet oracle[a] fut prononcé :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette proclamation fut prononcée » ; plus littéralement, « ce fardeau fut ». Le terme hébreu peut désigner un oracle ou une déclaration solennelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת מוֹת
  choice: L’année de la mort de
  rationale: La construction temporelle בִּשְׁנַת suivie du nom construit מוֹת date la proclamation. « L’année de la mort de » est naturel en français et conserve directement la formule hébraïque.
- source_word: הַמֶּלֶךְ אָחָז
  choice: du roi Ahaz
  rationale: Le titre défini suivi du nom propre se rend naturellement par « du roi Ahaz » en français. La forme traditionnelle française « Achaz » est possible, mais « Ahaz » translittère plus directement l’hébreu אָחָז et correspond au nom fourni.
- source_word: הָיָה
  choice: fut prononcée
  rationale: Le verbe signifie littéralement « fut » ou « advint ». Avec מַשָּׂא, la formulation française « fut prononcée » exprime idiomatiquement la communication du message prophétique sans en modifier le contenu.
- source_word: הַמַּשָּׂא
  choice: proclamation
  rationale: Dans un intitulé prophétique, מַשָּׂא désigne une déclaration solennelle, souvent menaçante. « Proclamation » est clair et actuel; « oracle » et le sens plus littéral « fardeau » restent possibles.
- source_word: הַזֶּה
  choice: cette
  rationale: Le démonstratif désigne précisément le message qui suit; « cette » en conserve la valeur déictique.
