source:
  edition: WLC
  text: וְ/נָשָׂ֜אתָ הַ/מָּשָׁ֥ל הַ/זֶּ֛ה עַל מֶ֥לֶךְ בָּבֶ֖ל וְ/אָמָ֑רְתָּ אֵ֚יךְ שָׁבַ֣ת נֹגֵ֔שׂ שָׁבְתָ֖ה מַדְהֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/004.yaml
  text: 'you will take up this taunt against the king of Babylon[a], and say: “How the oppressor has ceased, the insolence has ceased!”'
translation:
  language: fr
  text: 'tu entonneras ce chant moqueur contre le roi de Babylone et tu diras :

    « Comment ! L’oppresseur a cessé,

    l’arrogance[a] a cessé ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu traduit par « arrogance » est rare et son sens est incertain. On pourrait aussi traduire : « l’assaut » ou « la tyrannie qui extorque ». Selon une interprétation traditionnelle : « la ville d’or ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂאתָ
  choice: tu entonneras
  rationale: Avec מָשָׁל, le verbe נשׂא signifie ici prendre la parole pour prononcer un chant ou une parole imagée. « Entonner » rend naturellement en français le caractère poétique de ce qui suit.
- source_word: הַמָּשָׁל הַזֶּה
  choice: ce chant moqueur
  rationale: מָשָׁל peut désigner un proverbe, une parole imagée ou un chant satirique. Dans ce contexte de dérision visant le roi de Babylone, « chant moqueur » exprime clairement sa fonction.
- source_word: עַל
  choice: contre
  rationale: La parole est hostile et dirigée vers le roi de Babylone ; « contre » convient mieux ici que le terme neutre « au sujet de ».
- source_word: מֶלֶךְ בָּבֶל
  choice: le roi de Babylone
  rationale: Traduction directe de l’état construit hébreu.
- source_word: וְאָמַרְתָּ
  choice: et tu diras
  rationale: Le futur français maintient la coordination et la valeur prospective du contexte.
- source_word: אֵיךְ
  choice: Comment !
  rationale: Le terme introduit une exclamation de stupeur feinte et de triomphe dans ce chant moqueur.
- source_word: שָׁבַת / שָׁבְתָה
  choice: a cessé / a cessé
  rationale: La répétition du même verbe préserve le parallélisme rhétorique de l’hébreu.
- source_word: נֹגֵשׂ
  choice: l’oppresseur
  rationale: Le participe substantivé désigne celui qui contraint, pressure ou exige un tribut ; « oppresseur » est précis et accessible.
- source_word: מַדְהֵבָה
  choice: l’arrogance
  rationale: Ce mot très rare est de sens incertain. « Arrogance » convient au portrait de la puissance tyrannique de Babylone, sans retenir la traduction traditionnelle mais lexicalement douteuse « ville d’or » ; l’incertitude est signalée en note.
theological_decisions:
- issue: Sens du terme rare מַדְהֵבָה
  choice: l’arrogance
  alternative: l’assaut ; la tyrannie qui extorque ; la ville d’or
  rationale: Il s’agit d’une difficulté lexicale plutôt que d’un enjeu doctrinal. Le texte principal retient un sens possible adapté au contexte, tandis que la note conserve les principales autres lectures sans trancher au-delà des données.
translation_notes:
  register: Français international moderne, courant et digne. La disposition en vers et la répétition de « a cessé » conservent la force poétique et le parallélisme de l’hébreu.
