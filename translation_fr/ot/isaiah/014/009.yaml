review_pass:
  verdict: revise
  source_fidelity: 'Le sens général et la structure dramatique sont bien rendus : le Shéol personnifié s’agite, réveille les Rephaïm et fait lever les rois. Toutefois, « afin de venir à ta rencontre à ton arrivée » est à la fois lourd et redondant en français. « Pour toi » après « s’agite » peut aussi se comprendre comme un bénéfice plutôt que comme la réaction à l’arrivée du destinataire.'
  naturalness: Le registre est globalement approprié, mais « en bas » est peu idiomatique dans cette personnification poétique et la double expression « venir à ta rencontre / à ton arrivée » alourdit fortement la première phrase. « Là-dessous » et « pour t’accueillir à ton arrivée » sont plus naturels tout en gardant l’imagerie spatiale et l’idée de réception.
  terminology: « Shéol » conserve utilement le terme hébreu sans imposer « enfer ». « Les ombres » rend bien רְפָאִים dans ce contexte, avec une note adéquate. « Chefs de la terre » communique la valeur métaphorique de עַתּוּדֵי אָרֶץ; la note préserve l’image littérale des boucs. Les majuscules à « Shéol » et « Rephaïm » traitent ces translittérations comme des désignations conventionnelles.
  issues:
  - severity: medium
    issue: Formulation redondante de la rencontre et de l’arrivée
    rationale: « Afin de venir à ta rencontre à ton arrivée » reproduit deux fois la même idée et sonne artificiel. Le texte hébreu exprime la venue du personnage comme l’objet de la rencontre; « pour t’accueillir à ton arrivée » le rend naturellement.
  - severity: low
    issue: « En bas » est trop plat dans le cadre poétique
    rationale: Le complément spatial מִתַּחַת situe le Shéol dans le monde d’en bas. « Là-dessous » maintient cette image avec une diction française plus vivante.
  - severity: low
    issue: Ambiguïté française de « s’agite pour toi »
    rationale: En français moderne, cette expression peut suggérer que l’agitation est faite en faveur du destinataire. « S’agite à ton approche » rend clairement la réaction du Shéol sans modifier la scène.
  revised_text: Le Shéol, là-dessous, s’agite à ton approche pour t’accueillir à ton arrivée. Il réveille pour toi les ombres[a], tous les chefs de la terre[b] ; il fait se lever de leurs trônes tous les rois des nations.
  revised_footnotes:
