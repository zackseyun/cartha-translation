  variant: modern international French
source:
  edition: WLC
  text: שְׁא֗וֹל מִ/תַּ֛חַת רָגְזָ֥ה לְ/ךָ֖ לִ/קְרַ֣את בּוֹאֶ֑/ךָ עוֹרֵ֨ר לְ/ךָ֤ רְפָאִים֙ כָּל עַתּ֣וּדֵי אָ֔רֶץ הֵקִים֙ מִ/כִּסְאוֹתָ֔/ם כֹּ֖ל מַלְכֵ֥י גוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/009.yaml
  text: Sheol beneath is stirred up for you[a], to meet your coming; it rouses the shades for you, all the leaders of the earth[b]; it raises from their thrones all the kings of the nations.
translation:
  language: fr
  text: Le Shéol, là-dessous, s’agite à ton approche pour t’accueillir à ton arrivée. Il réveille pour toi les ombres[a], tous les chefs de la terre[b] ; il fait se lever de leurs trônes tous les rois des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les morts » ou « les esprits des défunts » (hébreu : Rephaïm).'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les boucs de la terre », image désignant les chefs ou les personnages puissants.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération conserve la notion hébraïque du monde des morts sans la réduire à la tombe ni y introduire les associations doctrinales plus tardives du mot « enfer ».
- source_word: מִתַּחַת
  choice: en bas
  rationale: Cette expression préserve simplement et naturellement l’image spatiale du monde inférieur.
- source_word: רָגְזָה
  choice: s’agite
  rationale: Le verbe exprime le tremblement ou l’agitation ; « s’agite » convient à la personnification du shéol qui se prépare à accueillir le roi déchu.
- source_word: לִקְרַאת בּוֹאֶךָ
  choice: afin de venir à ta rencontre à ton arrivée
  rationale: Cette formulation restitue à la fois le mouvement de rencontre et l’arrivée annoncée, tout en restant claire en français moderne.
- source_word: עוֹרֵר
  choice: il réveille
  rationale: Le verbe présente le shéol comme faisant se lever les morts à l’arrivée du nouveau venu ; « réveille » conserve la vigueur de l’image.
- source_word: רְפָאִים
  choice: les ombres
  rationale: Dans ce contexte, le terme désigne les morts qui habitent le shéol, non le peuple des Rephaïm. « Ombres » garde la couleur poétique et funèbre de l’expression.
- source_word: עַתּוּדֵי אָרֶץ
  choice: les chefs de la terre
  rationale: Littéralement « les boucs de la terre », l’expression emploie une métaphore animale pour les personnages dominants ; le sens est donné dans le texte et l’image littérale en note.
- source_word: הֵקִים
  choice: il fait se lever
  rationale: La forme causative indique que le shéol fait lever les rois pour accueillir l’arrivant.
- source_word: מִכִּסְאוֹתָם
  choice: de leurs trônes
  rationale: « Trônes » rend naturellement les sièges royaux et maintient l’imagerie politique du passage.
- source_word: כֹּל מַלְכֵי גוֹיִם
  choice: tous les rois des nations
  rationale: Traduction directe qui conserve la portée universelle et l’imagerie royale.
theological_decisions:
- issue: Traduction de שְׁאוֹל dans une satire poétique mettant en scène les morts
  choice: le shéol
  alternative: le séjour des morts ; la tombe ; l’enfer
  rationale: La translittération laisse intacte la représentation hébraïque du domaine des morts et évite aussi bien de la réduire à une tombe individuelle que d’y importer la conception théologique ultérieure de l’enfer.
translation_notes:
  register: Français international moderne, poétique et digne. La personnification du shéol ainsi que le mouvement dramatique de l’accueil sont conservés. Les termes moins transparents sont expliqués brièvement en notes.
