    text: 'Ou « les morts » ou « les esprits des défunts » (hébreu : Rephaïm).'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les boucs de la terre », image désignant les chefs ou les personnages puissants.
    reason: lexical_alternative
  revision_rationale: 'La révision améliore l’idiomaticité sans changer la représentation poétique : le Shéol inférieur est mis en mouvement par l’arrivée du destinataire et convoque les morts illustres. Les termes théologiquement ou lexicalement sensibles et leurs notes sont conservés.'
