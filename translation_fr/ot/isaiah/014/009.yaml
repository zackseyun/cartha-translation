revisions:
- from: Le shéol, en bas, s’agite pour toi afin de venir à ta rencontre à ton arrivée. Il réveille pour toi les ombres[a], tous les chefs de la terre[b] ; il fait se lever de leurs trônes tous les rois des nations.
  to: Le Shéol, là-dessous, s’agite à ton approche pour t’accueillir à ton arrivée. Il réveille pour toi les ombres[a], tous les chefs de la terre[b] ; il fait se lever de leurs trônes tous les rois des nations.
  rationale: 'La révision améliore l’idiomaticité sans changer la représentation poétique : le Shéol inférieur est mis en mouvement par l’arrivée du destinataire et convoque les morts illustres. Les termes théologiquement ou lexicalement sensibles et leurs notes sont conservés.'
