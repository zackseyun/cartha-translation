source:
  edition: WLC
  text: אַ֧ךְ אֶל שְׁא֛וֹל תּוּרָ֖ד אֶל יַרְכְּתֵי בֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/015.yaml
  text: But you will be brought down to Sheol[a], to the depths of the pit.
translation:
  language: fr
  text: Mais tu seras abaissé jusque dans le shéol[a], au plus profond de la fosse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la tombe » ou « le séjour des morts » pour « shéol ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Mais
  rationale: La particule marque ici le contraste brutal avec la prétention de monter exprimée aux versets précédents. « Mais » rend naturellement ce renversement, tout en laissant en arrière-plan la possible nuance affirmative de la particule.
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération préserve la notion hébraïque du séjour des morts sans la réduire à une tombe individuelle ni lui imposer une conception doctrinale ultérieure plus précise.
- source_word: תּוּרָד
  choice: tu seras précipité
  rationale: Le hophal de ירד exprime un mouvement descendant subi. « Tu seras précipité » conserve la valeur passive et fait ressortir le renversement humiliant, sans préciser explicitement l'agent.
- source_word: יַרְכְּתֵי
  choice: au plus profond de
  rationale: Le terme désigne les parties reculées, extrêmes ou intérieures. Dans cette image verticale de descente, « au plus profond de » est idiomatique et poétique en français.
- source_word: בּוֹר
  choice: la fosse
  rationale: « Fosse » rend l'image d'un lieu profond où l'on descend et maintient le parallélisme avec le shéol sans confondre les deux termes.
theological_decisions:
- issue: Traduction de שְׁאוֹל dans un contexte poétique de jugement
  choice: le shéol
  alternative: la tombe ; le séjour des morts
  rationale: « Shéol » conserve l'imagerie hébraïque du monde des morts et évite de réduire le terme à une sépulture physique ou de l'identifier à une doctrine ultérieure de l'enfer. La note donne les équivalents possibles sans trancher au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur passif souligne le renversement subi. « Au plus profond de la fosse » garde la force poétique de la descente, tandis que la note explicite sobrement le terme hébreu.
