source:
  edition: WLC
  text: כָּל מַלְכֵ֥י גוֹיִ֖ם כֻּלָּ֑/ם שָׁכְב֥וּ בְ/כָב֖וֹד אִ֥ישׁ בְּ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/018.yaml
  text: All the kings of the nations[a], all of them, lie in glory[b], each in his own house.
translation:
  language: fr
  text: Tous les rois des nations, oui, tous, reposent avec honneur[a], chacun dans sa demeure[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « dans la gloire » ; le terme désigne ici une condition honorable.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans sa maison » ; dans ce contexte, il peut s’agir de son tombeau ou de sa chambre funéraire.
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַלְכֵי גוֹיִם כֻּלָּם
  choice: Tous les rois des nations, oui, tous
  rationale: La reprise « oui, tous » restitue l’insistance produite en hébreu par כָּל puis כֻּלָּם, tout en restant naturelle en français.
- source_word: שָׁכְבוּ
  choice: reposent
  rationale: Dans ce contexte funéraire, le verbe décrit l’état de rois ensevelis. « Reposent » exprime naturellement cet état sans imposer l’image plus précise du sommeil.
- source_word: בְכָבוֹד
  choice: avec honneur
  rationale: Le nom כָּבוֹד évoque ici la dignité et l’honneur attachés à leur sépulture. « Avec honneur » est idiomatique en français, tandis que le sens plus littéral est signalé en note.
- source_word: אִישׁ בְבֵיתוֹ
  choice: chacun dans sa demeure
  rationale: אִישׁ a une valeur distributive, rendue par « chacun ». « Demeure » conserve l’image de la « maison » tout en pouvant évoquer, dans ce cadre funéraire, le lieu où chacun repose.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et fluide. La répétition emphatique de l’hébreu est conservée sans lourdeur, et l’image de la maison demeure visible dans le texte et explicitée en note.
