source:
  edition: WLC
  text: נִשְׁבַּ֛ע יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר אִם לֹ֞א כַּ/אֲשֶׁ֤ר דִּמִּ֨יתִי֙ כֵּ֣ן הָיָ֔תָה וְ/כַ/אֲשֶׁ֥ר יָעַ֖צְתִּי הִ֥יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/024.yaml
  text: 'Yahweh of Armies has sworn[a], saying: Surely, just as I have planned, so it has come to pass; and just as I have purposed[d][c][b], so it will stand.'
translation:
  language: fr
  text: 'Yahweh des armées[a] a juré : « Assurément[b], comme je l’ai conçu[c], ainsi cela s’est produit ; comme je l’ai décidé[d], cela s’accomplira. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On traduit aussi le titre par « le SEIGNEUR des armées » ou, traditionnellement, « l’Éternel des armées ».
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie une formule de serment qui signifie littéralement « si ce n’est pas », mais qui fonctionne ici comme une affirmation solennelle : « assurément » ou « certes ».'
    reason: source_idiom
  - marker: c
    text: 'Ou : « comme je l’ai pensé » ou « comme je l’ai projeté ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « comme j’en ai formé le dessein » ou « comme je l’ai résolu ». Littéralement, les verbes opposent « ainsi cela s’est produit » à « cela se tiendra / sera établi ».'
    reason: lexical_and_aspectual_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: l’a juré
  rationale: Le parfait présente un serment solennel comme un acte accompli. La tournure française garde ici sa portée actuelle.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Cette formulation conserve le nom divin et rend צְבָאוֹת par son sens concret d’armées, sans ajouter un titre absent de l’hébreu.
- source_word: לֵאמֹר
  choice: ':'
  rationale: En français actuel, les deux-points introduisent naturellement les paroles du serment et rendent inutile un lourd « en disant ».
- source_word: אִם לֹא
  choice: Oui
  rationale: Dans une formule de serment, l’expression littérale « si ce n’est » sert d’affirmation énergique. « Oui » en restitue la force dans un français naturel.
- source_word: דִּמִּיתִי
  choice: je l’ai projeté
  rationale: Le verbe peut exprimer la pensée, l’intention ou le projet. « Projeter » convient au contexte d’un dessein délibéré tout en laissant subsister sa nuance mentale.
- source_word: הָיָתָה
  choice: ainsi en sera-t-il
  rationale: Bien que la forme hébraïque soit un accompli, elle affirme dans ce serment la certitude de l’événement envisagé. Cette tournure française exprime cette certitude sans suggérer à tort que tout s’est déjà produit.
- source_word: יָעַצְתִּי
  choice: je l’ai décidé
  rationale: Le verbe désigne ici un dessein arrêté ou une résolution. « Décidé » le distingue du premier verbe tout en conservant le parallélisme.
- source_word: הִיא תָקוּם
  choice: cela se réalisera
  rationale: Littéralement, le dessein « se lèvera » ou « tiendra ». Dans ce contexte, l’image signifie qu’il sera établi et prendra effet ; « se réalisera » est clair et idiomatique.
theological_decisions:
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées / l’Éternel des armées
  rationale: Le choix garde le nom propre divin et traduit le complément martial sans substituer un titre au tétragramme.
- issue: Valeur temporelle de הָיָתָה dans le serment
  choice: ainsi en sera-t-il
  alternative: ainsi cela est arrivé
  rationale: Le contexte annonce l’exécution certaine du dessein divin. Le français futur restitue cette portée, tandis que l’accompli hébreu souligne la certitude ; la note signale la forme littérale afin de ne pas effacer la tension aspectuelle.
- issue: Force de la formule אִם לֹא
  choice: Oui
  alternative: 'Assurément / littéralement : si ce n’est'
  rationale: Il s’agit d’une formule hébraïque de serment qui renforce l’affirmation, non d’une condition laissée en suspens.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme hébreu est conservé, tandis que l’infinitif לֵאמֹר est rendu par la ponctuation française. Les verbes « projeter », « décider » et « se réaliser » évitent l’archaïsme tout en maintenant la progression entre conception, résolution et accomplissement.
