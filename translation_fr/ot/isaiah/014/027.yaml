reference: Isaiah 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי יְהוָ֧ה צְבָא֛וֹת יָעָ֖ץ וּ/מִ֣י יָפֵ֑ר וְ/יָד֥/וֹ הַ/נְּטוּיָ֖ה וּֽ/מִ֥י יְשִׁיבֶֽ/נָּה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/027.yaml
  text: For Yahweh of hosts has purposed[a], and who can annul it? His hand is stretched out[b], and who can turn it back?
translation:
  language: fr
  text: 'Car Yahweh des armées a formé son projet : qui peut le faire échouer[a] ? Sa main est étendue[b] : qui peut la faire revenir ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rendre caduc ». Le verbe hébreu peut évoquer l’action de rompre, d’annuler ou de contrarier un projet.
    reason: lexical_alternative
  - marker: b
    text: Ou « Sa main est déployée ». Cette image exprime une puissance en action, souvent dans le jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit la raison qui fonde la déclaration précédente et conserve le lien argumentatif du passage.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » rend le nom divin, tandis que « des armées » exprime naturellement צְבָאוֹת et peut englober les puissances célestes aussi bien que terrestres.
- source_word: יָעָץ
  choice: a formé son projet
  rationale: Le verbe désigne ici l’élaboration résolue d’un dessein. Cette formulation française rend l’idée sans réduire le terme à un simple conseil donné.
- source_word: יָפֵר
  choice: peut le faire échouer
  rationale: Le hiphil de פרר peut signifier rompre, rendre caduc ou contrarier. Avec un projet pour objet implicite, « faire échouer » est clair et idiomatique.
- source_word: יָדוֹ הַנְּטוּיָה
  choice: Sa main est étendue
  rationale: La traduction conserve l’image anthropomorphique de la main déjà déployée pour agir.
- source_word: יְשִׁיבֶנָּה
  choice: peut la ramener en arrière
  rationale: Le hiphil de שוב exprime l’action de faire revenir; le suffixe féminin renvoie à la main étendue.
theological_decisions:
- issue: Traduction du titre divin יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur des armées
  rationale: Le texte hébreu emploie directement le nom divin. Le conserver sous la forme « Yahweh » distingue ce nom personnel d’un titre, sans ajouter d’interprétation confessionnelle.
- issue: Portée de l’image de la main étendue
  choice: Conserver l’image sans préciser explicitement qu’il s’agit d’un jugement
  alternative: Sa main est étendue pour frapper
  rationale: Dans le contexte, l’image évoque vraisemblablement une puissance active, notamment en jugement, mais le complément « pour frapper » n’est pas exprimé dans ce verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les deux questions rhétoriques sont formulées avec « qui peut » afin d’exprimer naturellement l’impossibilité de contrecarrer le projet et l’action de Yahweh. Le parallélisme et l’image concrète de la main sont conservés.
