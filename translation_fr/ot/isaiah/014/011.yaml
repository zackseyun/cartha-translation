  variant: modern international French
source:
  edition: WLC
  text: הוּרַ֥ד שְׁא֛וֹל גְּאוֹנֶ֖/ךָ הֶמְיַ֣ת נְבָלֶ֑י/ךָ תַּחְתֶּ֨י/ךָ֙ יֻצַּ֣ע רִמָּ֔ה וּ/מְכַסֶּ֖י/ךָ תּוֹלֵעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/011.yaml
  text: Your pomp has been brought down to Sheol[a], the sound of your harps; maggots are spread out beneath you[c][b], and worms are your covering.
translation:
  language: fr
  text: Ton faste[a] a été abaissé jusqu’au shéol[b], ainsi que le son de tes harpes[c]. Des asticots sont étendus sous toi, et les vers sont ta couverture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « orgueil » ou « majesté ». Le mot hébreu peut désigner aussi bien une splendeur majestueuse qu’une fierté arrogante.
    reason: lexical_alternative
  - marker: b
    text: Le shéol est le domaine des morts; on peut aussi traduire par « le séjour des morts » ou « la tombe ».
    reason: lexical_alternative
  - marker: c
    text: Ou « lyres »; plus généralement, il s’agit d’instruments à cordes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: est descendu
  rationale: Le hofal de ירד exprime une descente subie ou provoquée. En français, « est descendu » garde la déclaration vive de l’abaissement sans alourdir la phrase.
- source_word: שְׁאוֹל
  choice: shéol
  rationale: Le terme hébreu est conservé afin de désigner le domaine des morts sans le réduire à la tombe physique ni y importer la notion ultérieure d’enfer.
- source_word: גְּאוֹנֶךָ
  choice: ton faste
  rationale: Dans cette satire visant un roi déchu, גאון évoque surtout la splendeur orgueilleuse et l’apparat royal. « Faste » maintient ensemble éclat et arrogance.
- source_word: הֶמְיַת נְבָלֶיךָ
  choice: le son de tes harpes
  rationale: הֶמְיָה désigne ici le bruit ou la résonance, tandis que נבל désigne un instrument à cordes de type harpe ou lyre.
- source_word: יֻצַּע רִמָּה
  choice: on étend des asticots
  rationale: Le passif de יצע évoque ce que l’on étend pour former une couche. « Asticots » restitue concrètement les créatures de décomposition désignées par רִמָּה.
- source_word: וּמְכַסֶּיךָ תּוֹלֵעָה
  choice: et les vers sont ta couverture
  rationale: Cette formulation conserve l’image funèbre et le parallélisme entre la couche placée dessous et la couverture posée dessus.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: shéol
  alternative: le séjour des morts ; la tombe
  rationale: Le verset décrit l’arrivée du souverain dans le domaine des morts. La translittération préserve l’imagerie hébraïque et son degré d’indétermination, sans identifier automatiquement ce lieu à l’enfer.
- issue: Valeur de גְּאוֹן
  choice: faste
  alternative: orgueil ; majesté
  rationale: Le contexte associe la chute morale du roi à l’anéantissement de sa splendeur royale. « Faste » exprime cet apparat, tandis qu’une note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, sobre et dignifié. La construction reste imagée et directe; « faste », « shéol », « asticots » et « vers » conservent respectivement la splendeur royale déchue, l’ambiguïté du domaine des morts et la force macabre du texte.
