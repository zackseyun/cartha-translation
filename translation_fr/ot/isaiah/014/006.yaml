- from: celui qui frappait les peuples avec fureur, de coups incessants, qui dominait les nations avec colère et les pourchassait sans relâche.[a]
  to: celui qui frappait les peuples avec fureur, de coups incessants, qui dominait les nations avec colère, par une persécution sans relâche.[a]
  rationale: La révision conserve le mouvement descriptif et la violence du texte, mais ne convertit plus le passif hébreu en une proposition active non ambiguë. La périphrase « par une persécution sans relâche » suit le sens contextuel attesté par le parallélisme, tandis que la note, ancrée à la finale, préserve l'ambiguïté syntaxique et rend correctement la valeur de « sans épargner/sans retenue ».
