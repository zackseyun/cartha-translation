source:
  edition: WLC
  text: מַכֶּ֤ה עַמִּים֙ בְּ/עֶבְרָ֔ה מַכַּ֖ת בִּלְתִּ֣י סָרָ֑ה רֹדֶ֤ה בָ/אַף֙ גּוֹיִ֔ם מֻרְדָּ֖ף בְּלִ֥י חָשָֽׂךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/014/006.yaml
  text: striking peoples in fury with an unceasing blow[a], ruling nations in anger[b], with unrelenting persecution.
translation:
  language: fr
  text: celui qui frappait les peuples avec fureur, de coups incessants, qui dominait les nations avec colère, par une persécution sans relâche.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de la fin du verset est condensé : littéralement, « poursuivi sans épargner » ou « sans retenue ». Le participe est passif; il peut évoquer les nations poursuivies sans relâche, mais son rattachement grammatical exact est incertain.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַכֶּה עַמִּים
  choice: qui frappait les peuples
  rationale: Le participe causatif décrit l’action habituelle du tyran. La proposition relative s’insère naturellement dans la phrase commencée au verset précédent, tandis que « peuples » distingue עַמִּים de גּוֹיִם.
- source_word: בְּעֶבְרָה
  choice: avec fureur
  rationale: עֶבְרָה exprime une colère débordante; « avec fureur » est actuel, énergique et naturel.
- source_word: מַכַּת בִּלְתִּי סָרָה
  choice: de coups incessants
  rationale: L’hébreu emploie littéralement un singulier, « un coup qui ne cessait pas/ne se détournait pas ». Le pluriel français exprime naturellement la violence répétée et continue sans en atténuer la force.
- source_word: רֹדֶה בָאַף גּוֹיִם
  choice: qui dominait les nations avec colère
  rationale: רדה signifie gouverner ou dominer, avec ici une nette coloration oppressive donnée par le contexte. « Nations » rend גּוֹיִם et maintient la distinction lexicale avec « peuples ».
- source_word: מֻרְדָּף בְּלִי חָשָׂךְ
  choice: les pourchassait sans relâche
  rationale: La proposition hébraïque est très condensée. Cette formulation restitue dans un français clair l’idée d’une poursuite oppressive et sans retenue, tout en signalant en note les autres constructions possibles du passif מֻרְדָּף.
theological_decisions:
- issue: Construction et référent de la proposition finale
  choice: 'La proposition poursuit la description de la tyrannie du souverain : il pourchassait les nations sans relâche.'
  alternative: 'On peut comprendre plus littéralement « les nations, poursuivies sans relâche », ou rattacher le participe passif au souverain : « poursuivi sans que personne intervienne ».'
  rationale: Le contexte décrit l’oppression exercée par le roi de Babylone, mais la forme passive singulière et la syntaxe comprimée rendent le rattachement exact incertain. La traduction principale suit le mouvement du parallélisme sans présenter cette lecture comme la seule possible; la note conserve l’ambiguïté textuelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le rythme parallèle et la violence de l’image hébraïque sont conservés. Le passage au pluriel dans « de coups incessants » privilégie un français idiomatique; le sens littéral reste celui d’un coup continuel. Le marqueur [a] figure bien dans le texte principal.
