  source_fidelity: La première moitié rend fidèlement les deux participes décrivant le tyran et le contraste בין « peuples » (עַמִּים) et « nations » (גּוֹיִם). En revanche, « les pourchassait » transforme le participe passif singulier מֻרְדָּף en verbe actif avec un objet explicite. La fin hébraïque est elliptique et difficile; la traduction principale doit éviter de trancher ainsi la construction tout en conservant l'idée de persécution implacable.
  naturalness: « Celui qui frappait les peuples avec fureur, de coups incessants » est compréhensible, mais « frappait ... de coups incessants » est plus direct et plus idiomatique. « Par une persécution sans relâche » donne une conclusion française fluide au parallélisme sans prétendre résoudre entièrement la syntaxe comprimée.
  terminology: « Fureur », « peuples », « nations », « colère », « coups incessants » et « domination » conviennent au registre poétique soutenu et moderne. « Persécution » est justifié comme rendu contextuel de la finale, à condition que la note signale que le participe hébreu est passif et que son rattachement reste incertain.
