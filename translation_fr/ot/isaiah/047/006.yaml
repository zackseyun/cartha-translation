base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/006.yaml
  text: I was angry with my people[a]; I profaned my inheritance and gave them into your hand. You showed them no mercy[c][b]; on the aged you made your yoke very heavy.
translation:
  language: fr
  text: J’étais en colère contre mon peuple ; j’ai profané mon héritage[a] et je les ai livrés entre tes mains. Tu ne leur as montré aucune compassion[b] ; tu as fait peser très lourdement ton joug sur les personnes âgées[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’ai traité mon héritage comme une chose profane ». Le verbe hébreu peut aussi signifier « souiller » ou « traiter comme non sacré ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Tu n’as pas placé pour eux de compassions. »'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « sur le vieillard, tu as rendu ton joug extrêmement lourd ». Le singulier hébreu peut désigner collectivement les personnes âgées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַפְתִּי עַל עַמִּי
  choice: J’étais en colère contre mon peuple
  rationale: קצף exprime la colère. Cette formulation naturelle conserve la première personne et la relation d’alliance exprimée par « mon peuple ».
- source_word: חִלַּלְתִּי נַחֲלָתִי
  choice: j’ai profané mon héritage
  rationale: Le piel de חלל porte le sens fort de profaner, traiter comme non sacré. « Héritage » maintient le langage d’appartenance associé à נחלה sans atténuer l’action divine.
- source_word: וָאֶתְּנֵם בְּיָדֵךְ
  choice: je les ai livrés entre tes mains
  rationale: L’expression signifie remettre quelqu’un au pouvoir d’un autre. « Entre tes mains » préserve l’image hébraïque tout en étant idiomatique en français.
- source_word: לֹא שַׂמְתְּ לָהֶם רַחֲמִים
  choice: Tu ne leur as montré aucune compassion
  rationale: Littéralement, le texte parle de ne pas placer pour eux des compassions. La formulation choisie rend clairement cet idiome et le pluriel abstrait רַחֲמִים.
- source_word: עַל זָקֵן
  choice: même au vieillard
  rationale: Le singulier זָקֵן peut désigner génériquement la personne âgée. « Même » explicite en français la portée emphatique contextuelle sans changer le référent.
- source_word: הִכְבַּדְתְּ עֻלֵּךְ מְאֹד
  choice: tu as imposé très lourdement ton joug
  rationale: La formulation conserve l’image du joug et la notion de poids exprimée par le hiphil de כבד, ainsi que l’intensité de מְאֹד.
theological_decisions:
- issue: L’action divine dans « j’ai profané mon héritage »
  choice: 'Conserver l’affirmation active à la première personne : « j’ai profané mon héritage »'
  alternative: « J’ai abandonné mon héritage » ou « j’ai permis que mon héritage soit profané »
  rationale: L’hébreu présente Dieu comme sujet actif. La traduction ne doit pas transformer cette action judiciaire en simple permission afin d’éviter la tension avec la culpabilité de Babylone, dénoncée dans la suite du verset.
- issue: La responsabilité de Babylone après la remise du peuple entre ses mains
  choice: Maintenir côte à côte l’action judiciaire de Dieu et l’absence de compassion de Babylone
  alternative: Présenter la cruauté de Babylone comme entièrement commandée ou, à l’inverse, dissocier son pouvoir de l’action divine
  rationale: Le verset affirme simultanément que Dieu a livré son peuple et que la destinataire est coupable de l’avoir traité sans compassion. Cette tension doit rester intacte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme prophétique, l’image des mains et celle du joug. Le tutoiement féminin implicite de l’hébreu vise Babylone, mais le français ne marque pas le genre dans ces formes verbales.
