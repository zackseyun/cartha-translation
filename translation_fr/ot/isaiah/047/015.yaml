  source_fidelity: 'Le sens général est bien rendu : les partenaires/commerçants de longue date se dispersent et Babylone demeure sans secours. Toutefois, « personne ne te sauvera » transforme la négation existentielle avec participe (« il n’y a pas de sauveur pour toi ») en un futur explicite. Une formulation existentielle française préserve mieux la valeur de l’hébreu.'
