  text: כֵּ֥ן הָיוּ לָ֖/ךְ אֲשֶׁ֣ר יָגָ֑עַתְּ סֹחֲרַ֣יִ/ךְ מִ/נְּעוּרַ֗יִ/ךְ אִ֤ישׁ לְ/עֶבְר/וֹ֙ תָּע֔וּ אֵ֖ין מוֹשִׁיעֵֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/015.yaml
  text: So have those with whom you labored become to you—your merchants from your youth[a]. Each one wanders to his own quarter; there is no one to save you.
translation:
  language: fr
  text: 'Ainsi en est-il pour toi de ceux avec qui tu as peiné, de tes marchands depuis ta jeunesse : chacun erre de son côté[a] ; il n’y a personne pour te sauver.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacun vers son propre côté », « chacun dans sa propre direction ». L’expression hébraïque est concise et souligne peut-être surtout leur dispersion plutôt qu’une destination précise.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן הָיוּ לָךְ
  choice: Voilà ce que sont devenus pour toi
  rationale: Cette formulation exprime naturellement en français le résultat conclusif introduit par כֵּן et l’état résultant porté par הָיוּ לָךְ.
- source_word: אֲשֶׁר יָגָעַתְּ
  choice: ceux avec qui tu t’es donné du mal
  rationale: יגע évoque un effort pénible. La tournure conserve ici la relation avec les marchands sans imposer trop précisément que le travail ait été fait pour eux.
- source_word: סֹחֲרַיִךְ מִנְּעוּרַיִךְ
  choice: tes marchands depuis ta jeunesse
  rationale: « Marchands » rend directement le vocabulaire commercial, et « depuis ta jeunesse » marque une relation ancienne dans la personnification de Babylone.
- source_word: אִישׁ לְעֶבְרוֹ תָּעוּ
  choice: chacun erre de son côté
  rationale: אִישׁ a une valeur distributive, תעה signifie errer ou s’égarer, et לְעֶבְרוֹ indique le côté ou la direction propre à chacun. La formulation française garde l’idée de dispersion sans fixer une destination précise.
- source_word: אֵין מוֹשִׁיעֵךְ
  choice: personne ne te sauvera
  rationale: La formulation est claire, directe et conserve la portée de ישׁע, qui peut désigner le fait de sauver, délivrer ou secourir.
theological_decisions:
- issue: Portée de מוֹשִׁיעֵךְ
  choice: personne ne te sauvera
  alternative: personne ne te délivrera / ne te secourra
  rationale: « Sauvera » préserve la force théologique possible du terme tout en restant adapté au contexte immédiat de délivrance face au désastre.
- issue: Rapport entre ceux pour qui Babylone a peiné et ses marchands
  choice: 'apposition explicative : « ceux avec qui tu t’es donné du mal, tes marchands »'
  alternative: deux groupes distincts
  rationale: La syntaxe permet naturellement de comprendre « tes marchands » comme précisant l’identité de ceux liés à son labeur, sans ajouter une catégorie absente du texte.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement féminin implicite adressé à Babylone est conservé. « Se donner du mal » rend l’effort pénible de manière idiomatique, tandis que « erre de son côté » maintient l’ambiguïté spatiale du texte hébreu.
