  text: וַ/תִּבְטְחִ֣י בְ/רָעָתֵ֗/ךְ אָמַרְתְּ֙ אֵ֣ין רֹאָ֔/נִי חָכְמָתֵ֥/ךְ וְ/דַעְתֵּ֖/ךְ הִ֣יא שׁוֹבְבָ֑תֶ/ךְ וַ/תֹּאמְרִ֣י בְ/לִבֵּ֔/ךְ אֲנִ֖י וְ/אַפְסִ֥/י עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/010.yaml
  text: You trusted in your wickedness; you said[a], ‘No one sees me.’ Your wisdom and your knowledge led you astray, and you said in your heart, ‘I am, and there is no one besides me.’
translation:
  language: fr
  text: 'Tu as mis ta confiance dans ta méchanceté ; tu as dit : « Personne ne me voit. » C’est ta sagesse et ta connaissance qui t’ont égarée. Tu as dit dans ton cœur : « Moi, et personne d’autre ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Moi, et rien d’autre ! » L’expression hébraïque peut se comprendre de manière plus abstraite, mais, dans ce contexte, elle exprime probablement la prétention de Babylone à n’avoir aucune rivale.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּבְטְחִי
  choice: Tu as mis ta confiance
  rationale: Le verbe בטח exprime ici le fait de se fier à quelque chose. Cette formulation française est naturelle et conserve toute la force de l’accusation.
- source_word: בְרָעָתֵךְ
  choice: dans ta méchanceté
  rationale: רָעָה peut désigner le mal ou le malheur. Le contexte dénonce la conduite et l’arrogance morales de Babylone, ce qui favorise « méchanceté » plutôt que « malheur ».
- source_word: אֵין רֹאָנִי
  choice: Personne ne me voit
  rationale: Cette tournure rend naturellement en français la négation existentielle suivie du participe et exprime l’illusion d’agir à l’abri de tout regard.
- source_word: חָכְמָתֵךְ וְדַעְתֵּךְ
  choice: Ta sagesse et ta connaissance
  rationale: Les deux termes restent distincts, conformément au parallélisme hébreu.
- source_word: הִיא שׁוֹבְבָתֶךְ
  choice: ce sont elles qui t’ont égarée
  rationale: Le verbe décrit ici l’action de détourner ou d’induire en erreur. La tournure emphatique reprend le pronom hébreu הִיא ; le féminin d’« égarée » correspond à Babylone, l’interlocutrice personnifiée.
- source_word: בְלִבֵּךְ
  choice: dans ton cœur
  rationale: L’image hébraïque désigne la pensée intérieure et demeure claire et idiomatique en français.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Moi, et personne d’autre !
  rationale: Cette formulation brève conserve l’affirmation absolue et orgueilleuse de Babylone. « Personne » convient à la ville personnifiée, tandis que la note signale la lecture plus abstraite permise par l’hébreu.
theological_decisions:
- issue: Rendre la prétention אֲנִי וְאַפְסִי עוֹד tout en préservant son écho ironique aux déclarations d’exclusivité divine dans Ésaïe
  choice: Moi, et personne d’autre !
  alternative: Moi, et rien d’autre !
  rationale: La formulation personnelle convient au discours de Babylone personnifiée et préserve sa prétention blasphématoire à une suprématie sans rivale, sans identifier pour autant Babylone à Dieu. La variante plus abstraite reste signalée en note.
translation_notes:
  register: Français international moderne, digne et direct. Le tutoiement suit l’adresse prophétique à Babylone personnifiée ; l’accord féminin « égarée » rend explicite cette personnification. La ponctuation met en relief les deux paroles intérieures sans alourdir le verset.
