base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/011.yaml
  text: But evil will come upon you[a]; you will not know how to charm it away. And disaster will fall upon you; you will not be able to atone for it. And ruin will come upon you suddenly[b], which you do not foresee.
translation:
  language: fr
  text: Mais un malheur viendra sur toi, sans que tu saches comment le conjurer[a]. Un désastre tombera sur toi, sans que tu puisses l’expier[b]. Une dévastation viendra soudain sur toi, sans que tu la voies venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans que tu connaisses son aurore » ou « sans que tu saches comment l’écarter ». L’hébreu de cette proposition est difficile. Le texte retient le sens selon lequel Babylone sera incapable de dissiper le malheur par ses pratiques occultes.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « sans que tu puisses le détourner » ou « l’apaiser ». Littéralement : « faire expiation pour lui » ou « l’expier ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה
  choice: un malheur
  rationale: Dans cette annonce de jugement, le nom désigne un événement funeste plutôt que le mal moral. « Malheur » conserve sa portée large tout en s’accordant avec les termes parallèles de désastre et de dévastation.
- source_word: שַׁחְרָהּ
  choice: comment le conjurer
  rationale: La forme hébraïque est difficile. Dans le contexte des sortilèges et enchantements de Babylone (v. 9, 12), « conjurer » exprime naturellement l’idée qu’elle sera incapable d’écarter le malheur par ses pratiques occultes, sans dissimuler l’autre analyse possible en rapport avec l’aurore.
- source_word: הֹוָה
  choice: un désastre
  rationale: Le terme évoque une calamité destructrice. « Désastre » est clair en français moderne et maintient la progression parallèle du verset.
- source_word: כַּפְּרָהּ
  choice: l’expier
  rationale: Le verbe כפר peut signifier couvrir, purger ou faire expiation. Ici, l’expression indique que Babylone ne pourra ni effacer ni écarter le désastre. « L’expier » préserve la force lexicale inhabituelle de l’hébreu; les formulations plus contextuelles figurent en note.
- source_word: פִּתְאֹם
  choice: soudain
  rationale: Cet adverbe exprime nettement le caractère brusque et inattendu de l’événement.
- source_word: שׁוֹאָה
  choice: une dévastation
  rationale: Le nom désigne une ruine dévastatrice. « Dévastation » rend clairement l’intensité du jugement annoncé.
- source_word: לֹא תֵדָעִי
  choice: sans que tu la voies venir
  rationale: Littéralement, « tu ne sauras pas ». Comme l’objet de ce savoir reste implicite en hébreu, cette formulation française idiomatique exprime l’arrivée imprévue de la dévastation sans prétendre préciser sa nature.
theological_decisions:
- issue: Sens de כפר dans un contexte de jugement
  choice: conserver l’idée lexicale d’expiation avec « l’expier »
  alternative: « le détourner » ou « l’apaiser »
  rationale: Le contexte vise l’incapacité de Babylone à faire disparaître le désastre, et non une doctrine développée du sacrifice. Néanmoins, garder « expier » préserve la tension et le lien lexical du verbe כפר, tandis que la note fournit les équivalents contextuels possibles.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des trois annonces de jugement est conservé, avec une variation lexicale lisible. « Conjurer » rappelle sobrement le contexte des pratiques occultes, tandis que « l’expier » maintient volontairement l’étrangeté théologique et lexicale de l’hébreu.
