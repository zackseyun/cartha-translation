id: ISA.47.4
reference: Isaiah 47:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: גֹּאֲלֵ֕/נוּ יְהוָ֥ה צְבָא֖וֹת שְׁמ֑/וֹ קְד֖וֹשׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/004.yaml
  text: Our Redeemer—Yahweh of Armies is his name—is the Holy One of Israel[a][b].
translation:
  language: fr
  text: Notre Rédempteur — Yahweh des armées est son nom — est le Saint d’Israël[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le Seigneur des armées » ou « l’Éternel des armées ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « Rédempteur » peut aussi désigner un proche parent chargé de racheter ou de défendre les droits d’un membre de sa famille.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֲלֵנוּ
  choice: Notre Rédempteur
  rationale: Le participe substantivé de גאל désigne « celui qui nous rachète ». « Rédempteur » conserve la portée juridique et relationnelle du terme, contrairement à un terme plus général comme « libérateur ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve ici le nom personnel divin plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Ce rendu communique clairement le sens concret de צבאות en français moderne, tout en conservant le titre divin traditionnel dans une forme intelligible.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: L’ajout naturel de la copule en français rend la proposition nominale hébraïque et maintient la structure d’identification.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette formulation conserve le titre caractéristique d’Ésaïe et sa résonance théologique, dans une expression française naturelle et reconnue.
theological_decisions:
- issue: Rendu du titre divin יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le Seigneur des armées / l’Éternel des armées
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom divin, tandis que « des armées » transmet le sens concret de צבאות.
- issue: Majuscule à « Rédempteur »
  choice: Rédempteur
  alternative: rédempteur
  rationale: Le mot fonctionne comme un titre divin, en parallèle avec le nom Yahweh et le titre « le Saint d’Israël ».
- issue: Nuance de parenté dans גאל
  choice: Rédempteur dans le texte, avec précision en note
  alternative: proche parent qui nous rachète / parent-rédempteur
  rationale: La racine peut évoquer le devoir juridique du proche parent, mais cette nuance n’est pas explicitée dans la formulation immédiate. La note conserve cette possibilité sans l’imposer au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation par tirets met en relief l’identification centrale sans effacer la concision de l’hébreu. « Rédempteur » et « Saint » prennent une majuscule en tant que titres divins.
