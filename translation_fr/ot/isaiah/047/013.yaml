source:
  edition: WLC
  text: נִלְאֵ֖ית בְּ/רֹ֣ב עֲצָתָ֑יִ/ךְ יַעַמְדוּ נָ֨א וְ/יוֹשִׁיעֻ֜/ךְ הברו שָׁמַ֗יִם הַֽ/חֹזִים֙ בַּ/כּ֣וֹכָבִ֔ים מֽוֹדִיעִם֙ לֶ/חֳדָשִׁ֔ים מֵ/אֲשֶׁ֥ר יָבֹ֖אוּ עָלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/013.yaml
  text: You are wearied by your many counsels[a]. Let them stand now and save you—those who divide the heavens, who gaze at the stars[b], who make known month by month what will come upon you.
translation:
  language: fr
  text: Tu t’es épuisée à force de tes nombreux conseils. Qu’ils se présentent donc et qu’ils te sauvent — ceux qui découpent le ciel[a], qui observent les étoiles et qui font des annonces mois après mois[b] — de ce qui va t’arriver.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est difficile. Elle peut désigner ceux qui divisent le ciel en secteurs pour l’interpréter.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui font des annonces aux nouvelles lunes ».'
    reason: lexical_alternative
  - marker: c
    text: 'Autre construction possible : « qui annoncent mois après mois ce qui va t’arriver ».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נִלְאֵית
  choice: tu t’es épuisée
  rationale: Le nifal accompli à la 2e personne du féminin singulier exprime l’état d’épuisement atteint par Babylone; le féminin français conserve cette adresse personnifiée.
- source_word: בְּרֹב עֲצָתָיִךְ
  choice: par la multitude de tes conseils
  rationale: Cette formulation conserve l’idée d’abondance portée par רֹב et le sens de conseils, avis ou plans de עֵצָה, sans limiter le terme aux seuls conseillers.
- source_word: יַעַמְדוּ נָא
  choice: qu’ils se présentent donc
  rationale: La tournure rend le défi ironique exprimé par l’inaccompli à valeur jussive avec נָא; «se présenter» est naturel pour des spécialistes sommés d’intervenir.
- source_word: וְיוֹשִׁיעֻךְ
  choice: et qu’ils te sauvent
  rationale: Le hiphil de ישׁע désigne ici le fait de sauver ou délivrer Babylone du désastre annoncé.
- source_word: הברו שָׁמַיִם
  choice: ceux qui découpent le ciel
  rationale: L’expression hébraïque difficile est probablement liée au découpage astrologique du ciel en secteurs; la traduction garde cette image concrète tout en signalant l’incertitude en note.
- source_word: הַחֹזִים בַּכּוֹכָבִים
  choice: qui observent les étoiles
  rationale: Dans ce contexte astrologique, le participe désigne ceux qui contemplent les étoiles pour en tirer des présages; «observent» reste naturel sans ajouter une théorie divinatoire absente du texte.
- source_word: מוֹדִיעִים לֶחֳדָשִׁים
  choice: qui font des annonces mois après mois
  rationale: La formulation conserve le caractère régulier des proclamations, tout en laissant en note l’autre possibilité, liée aux nouvelles lunes.
- source_word: מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: de ce qui va t’arriver
  rationale: 'Le מִן initial se rattache naturellement à «sauver»: les astrologues sont mis au défi de sauver Babylone des événements imminents. Une autre construction possible est signalée en note.'
theological_decisions:
- issue: Identité et capacité des spécialistes babyloniens
  choice: Le texte présente ironiquement des astrologues sommés de sauver Babylone, tout en soulignant implicitement leur impuissance.
  alternative: Comprendre les termes comme une désignation plus générale de sages ou de conseillers, sans nuance astrologique précise.
  rationale: Les étoiles, les cycles mensuels et le contexte des pratiques occultes en Ésaïe 47 favorisent l’interprétation astrologique. La traduction n’ajoute toutefois aucune qualification doctrinale au-delà du défi ironique du texte.
- issue: Rapport syntaxique de מֵאֲשֶׁר יָבֹאוּ עָלָיִךְ
  choice: Rattacher «de ce qui va t’arriver» au verbe «sauver».
  alternative: 'Le rattacher aux annonces: «qui annoncent mois après mois ce qui va t’arriver».'
  rationale: La préposition מִן correspond directement à l’idée d’être sauvé «de» quelque chose. L’éloignement du verbe et la suite des participes permettent néanmoins l’autre compréhension, qui est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier est maintenu parce que le discours s’adresse à Babylone personnifiée. Les tirets encadrent les trois désignations des astrologues et rendent lisible le rattachement final à «qu’ils te sauvent».
