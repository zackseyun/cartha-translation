source:
  edition: WLC
  text: עִמְדִי נָ֤א בַ/חֲבָרַ֨יִ/ךְ֙ וּ/בְ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בַּ/אֲשֶׁ֥ר יָגַ֖עַתְּ מִ/נְּעוּרָ֑יִ/ךְ אוּלַ֛י תּוּכְלִ֥י הוֹעִ֖יל אוּלַ֥י תַּעֲרֽוֹצִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/012.yaml
  text: Stand now with your enchantments and with your many sorceries[a], in which you have labored from your youth; perhaps you may be able to profit[b], perhaps you may inspire terror.
translation:
  language: fr
  text: Persiste donc dans tes incantations et dans tes nombreux sortilèges, où tu t’es donné de la peine depuis ta jeunesse. Peut-être pourras-tu en tirer profit ; peut-être effraieras-tu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peut-être t’imposeras-tu » ; le verbe hébreu peut évoquer le fait de terrifier ou de tenir un adversaire en respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמְדִי נָא
  choice: Tiens donc
  rationale: L’impératif féminin singulier de עמד, renforcé par נָא, prend ici la forme d’une sommation ironique adressée à Babylone. « Tiens donc » conserve l’idée de tenir sa position et laisse entendre la provocation sans l’expliciter.
- source_word: בַחֲבָרַיִךְ
  choice: avec tes incantations
  rationale: חֲבָרִים désigne ici des formules ou pratiques magiques. « Incantations » est naturel en français actuel et convient au parallèle avec « sortilèges ».
- source_word: וּבְרֹב כְּשָׁפַיִךְ
  choice: et avec tes nombreux sortilèges
  rationale: רֹב exprime la multitude, et כְּשָׁפִים des pratiques de magie. « Nombreux sortilèges » préserve le pluriel et l’abondance sans lourdeur.
- source_word: בַּאֲשֶׁר יָגַעַתְּ
  choice: auxquels tu t’es épuisée
  rationale: יגע évoque un travail pénible allant jusqu’à la fatigue. Le pronom relatif reprend naturellement en français les pratiques magiques qui précèdent.
- source_word: מִנְּעוּרַיִךְ
  choice: depuis ta jeunesse
  rationale: La locution temporelle indique une pratique ancienne et continue; « depuis ta jeunesse » est idiomatique et précise.
- source_word: אוּלַי תּוּכְלִי הוֹעִיל
  choice: Peut-être pourras-tu en tirer profit
  rationale: יכל avec הועיל exprime la capacité d’obtenir un bénéfice ou un avantage. « En tirer profit » rend cette idée tout en reliant clairement le bénéfice espéré aux pratiques mentionnées.
- source_word: אוּלַי תַּעֲרוֹצִי
  choice: peut-être inspireras-tu la terreur
  rationale: ערץ peut exprimer le fait de terrifier ou d’imposer l’effroi. Cette formulation garde la valeur causative probable, tout en signalant en note l’autre lecture possible.
theological_decisions:
- issue: Tonalité de l’adresse à Babylone
  choice: Conserver la sommation et les deux propositions introduites par « peut-être » de manière à laisser percevoir l’ironie du contexte, sans ajouter d’explication dans le texte.
  alternative: Traduire comme un conseil neutre et sincère.
  rationale: Le contexte est un oracle de jugement qui tourne en dérision la confiance de Babylone dans ses pratiques occultes. « Tiens donc » rend la pointe provocatrice, tandis que le reste demeure proche des formes hébraïques.
- issue: Sens de תַּעֲרוֹצִי
  choice: « inspireras-tu la terreur », valeur causative liée à l’effroi.
  alternative: « l’emporteras-tu », en comprenant le verbe au sens de dominer ou de tenir l’adversaire en respect.
  rationale: Le champ sémantique de ערץ permet l’idée de provoquer la terreur; l’alternative contextuelle est conservée en note afin de ne pas masquer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et direct. Le féminin singulier est maintenu, puisque l’adresse vise Babylone personnifiée. « Incantations » et « sortilèges » évitent à la fois l’archaïsme excessif et un vocabulaire trop familier.
