  naturalness: La formulation révisée est fluide, moderne et adaptée au registre prophétique. « Tu ne t’es pas souvenue de sa fin » est plus idiomatique que « tu n’as pas gardé en mémoire sa fin » et maintient le féminin de la personnification.
  terminology: « Souveraine » rend une femme exerçant autorité ou domination sans imposer formellement le titre de « reine ». La note conserve « maîtresse » comme possibilité lexicale, avec une clarification de son sens de domination. « Sa fin » garde le suffixe féminin singulier et l’ambiguïté contextuelle quant à son antécédent précis.
