    issue: « la maîtresse » est lexicalement ambigu et peu naturel dans ce sens de domination en français moderne.
    rationale: En français courant, « maîtresse » désigne principalement une amante. « Souveraine » communique naturellement l’idée d’une femme en position d’autorité, tandis qu’une note peut signaler l’alternative plus littérale ou traditionnelle.
