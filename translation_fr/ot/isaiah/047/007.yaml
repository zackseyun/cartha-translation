  text: וַ/תֹּ֣אמְרִ֔י לְ/עוֹלָ֖ם אֶהְיֶ֣ה גְבָ֑רֶת עַ֣ד לֹא שַׂ֥מְתְּ אֵ֨לֶּה֙ עַל לִבֵּ֔/ךְ לֹ֥א זָכַ֖רְתְּ אַחֲרִיתָֽ/הּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/007.yaml
  text: You said[a], ‘I will be mistress forever,’ so that you did not take these things to heart[c][b]; you did not remember her end.
translation:
  language: fr
  text: 'Tu as dit : « Je serai souveraine pour toujours[a] » ; tu n’as pas pris ces choses à cœur[b], tu ne t’es pas souvenue de sa fin[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la maîtresse pour toujours ». Le mot hébreu désigne une femme en position d’autorité ou de domination. « Souveraine » rend ce sens en français moderne sans faire de « reine » un titre explicite.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu n’as pas placé ces choses sur ton cœur ». La construction hébraïque reliant cette phrase à la précédente est difficile; elle peut suggérer une conséquence ou être rendue plus formellement par « jusqu’à ne pas ».'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: Ou « son issue ». Le suffixe hébreu est féminin singulier; dans le contexte, il renvoie vraisemblablement à Babylone personnifiée comme une femme.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמְרִי
  choice: Tu as dit
  rationale: Le parfait avec waw fait progresser le discours. Le passé composé est naturel en français moderne et maintient l’adresse directe à Babylone.
- source_word: לְעוֹלָם אֶהְיֶה
  choice: Je serai pour toujours
  rationale: La formulation rend directement la prétention à une domination future sans fin.
- source_word: גְבָרֶת
  choice: la maîtresse
  rationale: Le nom désigne une femme en position d’autorité ou de domination. « La maîtresse » conserve cette idée dans l’expression française « être la maîtresse », tandis que « reine » introduirait un titre royal absent de l’hébreu.
- source_word: עַד לֹא
  choice: si bien que… ne… pas
  rationale: Dans ce contexte, la locution marque le résultat auquel conduit la prétention arrogante. Cette tournure française exprime naturellement cette conséquence sans reproduire littéralement un obscur « jusqu’à ne pas ».
- source_word: שַׂמְתְּ אֵלֶּה עַל לִבֵּךְ
  choice: tu n’as pas pris ces choses à cœur
  rationale: Cette expression idiomatique française rend l’image hébraïque de placer quelque chose sur son cœur, c’est-à-dire y réfléchir sérieusement et en tenir compte.
- source_word: לֹא זָכַרְתְּ
  choice: tu n’as pas gardé en mémoire
  rationale: Cette formulation conserve le sens cognitif de זכר, « se souvenir », tout en permettant une construction française claire avec le complément qui suit.
- source_word: אַחֲרִיתָהּ
  choice: sa fin
  rationale: Le suffixe féminin singulier est conservé. Dans le contexte, il s’accorde vraisemblablement avec Babylone personnifiée comme une femme et peut désigner sa fin ou son issue ultime.
theological_decisions:
- issue: Personnification féminine de Babylone
  choice: Conserver le féminin dans « la maîtresse » et « sa fin »
  alternative: Neutraliser la dernière expression en traduisant « l’issue de tout cela »
  rationale: Tout l’oracle s’adresse à Babylone sous les traits d’une femme. Le féminin maintient cette personnification prophétique sans ajouter de titre royal.
- issue: Valeur de עַד לֹא
  choice: Exprimer une conséquence par « si bien que »
  alternative: Traduire plus formellement « jusqu’à ne pas » ou coordonner simplement par « et »
  rationale: La syntaxe relie la vantardise de Babylone à son défaut de réflexion. « Si bien que » rend ce lien probable tout en signalant en note l’alternative plus formelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé évite un ton excessivement littéraire. « Être la maîtresse » exprime ici la domination, non une relation amoureuse ; la note prévient l’ambiguïté lexicale possible. La ponctuation conserve le parallélisme entre l’absence de réflexion et l’oubli de la fin.
