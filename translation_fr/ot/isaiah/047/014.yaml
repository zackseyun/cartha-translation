source:
  edition: WLC
  text: הִנֵּ֨ה הָי֤וּ כְ/קַשׁ֙ אֵ֣שׁ שְׂרָפָ֔תַ/ם לֹֽא יַצִּ֥ילוּ אֶת נַפְשָׁ֖/ם מִ/יַּ֣ד לֶֽהָבָ֑ה אֵין גַּחֶ֣לֶת לַ/חְמָ֔ם א֖וּר לָ/שֶׁ֥בֶת נֶגְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/014.yaml
  text: Look[a], they have become like stubble; fire burns them up. They cannot rescue themselves from the power of the flame. This is no coal for warming oneself, no fire to sit before.
translation:
  language: fr
  text: 'Voici : ils sont devenus comme du chaume ; le feu les a consumés. Ils ne peuvent se délivrer de l’emprise de la flamme. Il n’y a pas de braise où se réchauffer[a], ni de feu devant lequel s’asseoir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’y a pas de braise pour se réchauffer. » L’hébreu de cette proposition est difficile ; le sens semble opposer ce feu destructeur à une petite braise de foyer, utile pour se réchauffer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Regardez
  rationale: L’impératif attire vivement l’attention et rend la particule déictique dans un français moderne et naturel.
- source_word: הָיוּ כְקַשׁ
  choice: ils sont devenus comme du chaume
  rationale: Le parfait exprime ici un état résultant. « Chaume » évoque les tiges sèches laissées après la moisson, facilement consumées.
- source_word: אֵשׁ שְׂרָפָתַם
  choice: le feu les consume
  rationale: La formulation brève conserve la vivacité de l’hébreu et exprime une destruction complète sans ajouter « entièrement » au texte.
- source_word: לֹא יַצִּילוּ אֶת נַפְשָׁם
  choice: Ils ne peuvent se délivrer
  rationale: Le hiphil de נצל signifie délivrer ou arracher au danger, tandis que נֶפֶשׁ désigne ici leur propre personne ou vie. Le réfléchi français transmet naturellement l’ensemble.
- source_word: מִיַּד לֶהָבָה
  choice: de l’emprise de la flamme
  rationale: Littéralement « de la main de la flamme » ; « emprise » conserve l’image d’une puissance qui saisit tout en restant idiomatique en français.
- source_word: אֵין גַּחֶלֶת לַחְמָם
  choice: Ce n’est pas une braise pour se réchauffer
  rationale: La clause difficile oppose vraisemblablement ce brasier destructeur à une braise domestique utile. « Braise » convient mieux que « charbon » au contexte du foyer.
- source_word: אוּר לָשֶׁבֶת נֶגְדּוֹ
  choice: ni un feu devant lequel s’asseoir
  rationale: אוּר désigne ici un feu, et la proposition évoque naturellement le feu de foyer devant lequel on s’assied.
theological_decisions:
- issue: Portée de l’image du jugement
  choice: Conserver l’image d’un jugement destructeur visant, dans le contexte, les conseillers et praticiens occultes de Babylone.
  alternative: Présenter explicitement le feu comme une image du châtiment final.
  rationale: Le verset appartient à une parole de jugement contre Babylone. La traduction garde toute la force de l’image sans lui imposer une portée eschatologique que le texte immédiat ne précise pas.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Regardez » garde l’interpellation vive ; « emprise de la flamme » rend l’idiome hébreu sans calque obscur. Le marqueur [a] est placé sur la proposition concernée.
