language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/תָבֹאנָה֩ לָּ֨/ךְ שְׁתֵּי אֵ֥לֶּה רֶ֛גַע בְּ/י֥וֹם אֶחָ֖ד שְׁכ֣וֹל וְ/אַלְמֹ֑ן כְּ/תֻמָּ/ם֙ בָּ֣אוּ עָלַ֔יִ/ךְ בְּ/רֹ֣ב כְּשָׁפַ֔יִ/ךְ בְּ/עָצְמַ֥ת חֲבָרַ֖יִ/ךְ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/009.yaml
  text: 'But these two things will come to you in a moment[a], in one day: bereavement and widowhood. In full measure they will come upon you[b], in spite of your many sorceries and the great power of your spells.'
translation:
  language: fr
  text: 'Mais ces deux choses t’arriveront en un instant, en un seul jour : la perte de tes enfants et le veuvage. Ils s’abattront sur toi dans toute leur ampleur[a], malgré tes nombreuses pratiques de magie et la grande puissance de tes sortilèges[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleinement » ou « dans toute leur ampleur ».
    reason: lexical_alternative
  - marker: b
    text: 'Les expressions finales peuvent aussi se comprendre ainsi : « à cause de tes nombreuses pratiques de magie et de la très grande puissance de tes sortilèges », ou : « avec tes nombreuses pratiques de magie et la très grande puissance de tes sortilèges ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתָבֹאנָה
  choice: t’arriveront
  rationale: Le qal inaccompli à la 3e personne du féminin pluriel annonce ici un événement futur. « T’arriveront » convient naturellement à des malheurs qui atteignent la destinataire.
- source_word: שְׁתֵּי אֵלֶּה
  choice: ces deux malheurs
  rationale: Le nom « malheurs » est explicité d’après les deux calamités nommées ensuite; il rend la phrase naturelle sans préciser davantage leur nature.
- source_word: רֶגַע
  choice: en un instant
  rationale: Le nom désigne un très bref moment et souligne la soudaineté du jugement.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: Cette formulation littérale et idiomatique met en relief la concentration des deux calamités dans une même journée.
- source_word: שְׁכוֹל
  choice: la perte de tes enfants
  rationale: Le terme désigne l’état de celui ou celle qui est privé de ses enfants par la mort. Cette formulation explicite en français l’image familiale portée par le mot hébreu.
- source_word: וְאַלְמֹן
  choice: le veuvage
  rationale: Le nom désigne l’état de veuve et correspond à la personnification féminine de Babylone.
- source_word: כְּתֻמָּם
  choice: dans toute leur ampleur
  rationale: La forme issue de תמם exprime ici la totalité ou la pleine mesure des calamités.
- source_word: בָּאוּ עָלַיִךְ
  choice: ils s’abattront sur toi
  rationale: Le parfait peut avoir une valeur prophétique et présenter l’avenir comme certain. « S’abattront sur toi » exprime idiomatiquement la venue soudaine de calamités.
- source_word: בְּרֹב כְּשָׁפַיִךְ
  choice: malgré tes nombreuses pratiques de magie
  rationale: 'Dans le contexte, la préposition ב est comprise comme concessive : les moyens magiques de Babylone ne pourront empêcher le jugement.'
- source_word: בְּעָצְמַת חֲבָרַיִךְ מְאֹד
  choice: et la grande puissance de tes sortilèges
  rationale: עָצְמָה exprime la puissance, tandis que חֲבָרִים désigne ici des formules magiques ou sortilèges. La coordination dépend de « malgré ».
theological_decisions:
- issue: Valeur de la préposition ב dans les deux propositions finales
  choice: 'Valeur concessive : « malgré tes nombreuses pratiques de magie et la grande puissance de tes sortilèges »'
  alternative: Valeur causale (« à cause de… ») ou associative/instrumentale (« avec… »)
  rationale: 'Le contexte immédiat tourne en dérision la confiance de Babylone dans ses pratiques magiques : les calamités surviendront malgré elles. Les autres analyses grammaticales demeurent possibles et sont signalées en note.'
- issue: Aspect de בָּאוּ dans le discours prophétique
  choice: 'Futur : « ils s’abattront sur toi »'
  alternative: 'Passé accompli : « ils se sont abattus sur toi »'
  rationale: Le parfait prophétique présente un jugement futur comme assuré. Le futur français maintient la cohérence temporelle avec le premier verbe du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement conserve l’adresse directe à Babylone personnifiée. « Pratiques de magie » et « sortilèges » sont courants sans être familiers; « s’abattront » restitue la force de l’annonce prophétique.
