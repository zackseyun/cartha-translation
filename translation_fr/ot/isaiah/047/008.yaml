source:
  edition: WLC
  text: וְ/עַתָּ֞ה שִׁמְעִי זֹ֤את עֲדִינָה֙ הַ/יּוֹשֶׁ֣בֶת לָ/בֶ֔טַח הָ/אֹֽמְרָה֙ בִּ/לְבָ֔בָ/הּ אֲנִ֖י וְ/אַפְסִ֣/י ע֑וֹד לֹ֤א אֵשֵׁב֙ אַלְמָנָ֔ה וְ/לֹ֥א אֵדַ֖ע שְׁכֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/008.yaml
  text: Then[a], hear this, you lover of luxury, who sit securely, who say in your heart, ‘I am, and there is no one besides me. I will not sit as a widow[c][b], nor will I know the loss of children.’
translation:
  language: fr
  text: 'Maintenant donc, écoute ceci, toi qui vis dans les délices[a], qui demeures en sécurité et qui dis dans ton cœur : « Je suis, et il n’y a personne d’autre[b] ! Je ne resterai pas veuve et je ne connaîtrai pas la perte de mes enfants[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toi, la délicate », « toi qui es choyée » ou « toi qui vis dans le luxe ». L’hébreu évoque une vie de raffinement et de complaisance luxueuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « Je suis, et il n’y a rien d’autre ». Cette formule exprime une prétention arrogante à une position sans égale.
    reason: alternative_reading
  - marker: c
    text: L’hébreu désigne le deuil ou la privation causés par la perte d’enfants, c’est-à-dire l’expérience de perdre ses enfants.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: L’expression hébraïque marque explicitement une transition temporelle et rhétorique vers une interpellation directe. « Maintenant donc » en restitue naturellement la vigueur.
- source_word: עֲדִינָה
  choice: toi qui vis dans les délices
  rationale: L’adjectif évoque une personne délicate, choyée et habituée au luxe. Cette formulation française exprime clairement, dans le contexte, l’aisance complaisante de Babylone sans employer un terme potentiellement ambigu comme « délicate ».
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: qui demeures en sécurité
  rationale: Le participe et לָבֶטַח décrivent une installation durable dans un sentiment de sécurité. « Demeurer » convient à une ville personnifiée et reste proche de l’image hébraïque.
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Moi, et personne d’autre !
  rationale: Cette formule elliptique proclame une suprématie exclusive. La tournure française conserve sa brièveté hautaine et son ambiguïté entre l’absence de toute autre personne et l’absence de quoi que ce soit d’autre.
- source_word: לֹא אֵשֵׁב אַלְמָנָה
  choice: Je ne resterai pas veuve
  rationale: Le verbe ישׁב signifie littéralement « s’asseoir » ou « demeurer ». En français, « rester veuve » rend naturellement l’état durable que Babylone affirme ne jamais connaître.
- source_word: אֵדַע שְׁכוֹל
  choice: je ne connaîtrai pas la perte de mes enfants
  rationale: « Connaître » préserve le verbe hébreu employé au sens d’éprouver, tandis que « la perte de mes enfants » explicite que שְׁכוֹל désigne le deuil causé par la mort d’enfants, non l’infertilité.
theological_decisions:
- issue: La prétention de Babylone exprimée par אֲנִי וְאַפְסִי עוֹד
  choice: Moi, et personne d’autre !
  alternative: Je suis, et il n’y a rien en dehors de moi.
  rationale: La formule fait écho aux affirmations de souveraineté exclusive prononcées ailleurs par Dieu, mais elle devient ici une prétention arrogante sur les lèvres de Babylone. La traduction conserve cet écho et cette tension sans les expliquer dans le corps du verset.
translation_notes:
  register: Français international moderne, direct et digne. L’adresse reste au féminin singulier afin de préserver la personnification de Babylone. La ponctuation souligne le ton abrupt et présomptueux de sa déclaration intérieure.
