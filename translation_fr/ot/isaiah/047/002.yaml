source:
  edition: WLC
  text: קְחִ֥י רֵחַ֖יִם וְ/טַ֣חֲנִי קָ֑מַח גַּלִּ֨י צַמָּתֵ֧/ךְ חֶשְׂפִּי שֹׁ֛בֶל גַּלִּי שׁ֖וֹק עִבְרִ֥י נְהָרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/002.yaml
  text: Take the millstones and grind flour[a]; uncover your veil, strip off your skirt, uncover the leg[c][b], cross over the rivers.
translation:
  language: fr
  text: Prends les meules et mouds de la farine. Retire ton voile[a], relève le pan de ta robe[b], découvre ta jambe[c] et traverse les fleuves.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « découvre tes cheveux » ou « tes mèches ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dégage le bas de ta robe ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ta cuisse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחִי רֵחַיִם
  choice: Prends les meules
  rationale: L’impératif féminin singulier commande de prendre les instruments concrets d’un travail manuel humiliant. « Les meules » conserve l’image du texte hébreu.
- source_word: וְטַחֲנִי קָמַח
  choice: et mouds de la farine
  rationale: Traduction directe et naturelle de טחן, « moudre », et קמח, « farine ».
- source_word: גַּלִּי צַמָּתֵךְ
  choice: Retire ton voile
  rationale: צַמָּה peut désigner un voile, mais aussi la chevelure ou les mèches. Dans cette succession d’ordres marquant la perte de dignité, « voile » convient au contexte sans effacer l’ambiguïté, signalée en note.
- source_word: חֶשְׂפִּי שֹׁבֶל
  choice: relève le pan de ta robe
  rationale: חשׂף exprime l’action de dégager ou mettre à nu; שֹׁבֶל désigne le pan ou le bas flottant d’un vêtement. « Relève le pan de ta robe » rend naturellement le geste requis pour traverser l’eau, sans imposer l’idée d’enlever entièrement la robe.
- source_word: גַּלִּי שׁוֹק
  choice: découvre ta jambe
  rationale: שׁוֹק désigne la jambe, parfois plus précisément sa partie inférieure, et peut aussi être compris comme la cuisse. Le terme général « jambe » convient au contexte; l’autre possibilité est conservée en note.
- source_word: עִבְרִי נְהָרוֹת
  choice: traverse les fleuves
  rationale: עבר signifie ici franchir ou traverser, et נְהָרוֹת désigne normalement des fleuves ou cours d’eau. « Fleuves » conserve la force de l’image.
theological_decisions:
- issue: Nature des images d’humiliation
  choice: Rendre une suite d’ordres montrant la perte de dignité royale et l’exposition imposée à Babylone, sans sexualiser davantage la scène.
  alternative: Employer des formulations accentuant explicitement la nudité ou l’exposition sexuelle.
  rationale: Le texte met clairement en scène l’abaissement et la honte, mais la traduction ne doit pas préciser plus que ne le permettent les termes hébreux.
- issue: Portée de חֶשְׂפִּי שֹׁבֶל
  choice: « relève le pan de ta robe »
  alternative: « enlève ta robe » ou « dénude ta traîne »
  rationale: Le contexte du passage des fleuves favorise le dégagement du bas du vêtement. Cette formulation préserve l’exposition progressive sans affirmer le retrait total du vêtement.
translation_notes:
  register: Français international moderne, courant et digne. Les impératifs féminins singuliers sont conservés. La répétition exacte de גַּלִּי n’est pas reproduite au premier emploi afin d’éviter en français l’idée peu naturelle de « découvrir un voile »; elle demeure perceptible dans la progression des gestes.
