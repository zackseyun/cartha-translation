source:
  edition: WLC
  text: שְׁבִ֥י דוּמָ֛ם וּ/בֹ֥אִי בַ/חֹ֖שֶׁךְ בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ גְּבֶ֖רֶת מַמְלָכֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/005.yaml
  text: Sit in silence[a], and go into darkness, daughter of the Chaldeans; for no longer will they call you the mistress of kingdoms.
translation:
  language: fr
  text: Assieds-toi en silence et entre dans les ténèbres, fille des Chaldéens, car on ne t’appellera plus souveraine des royaumes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maîtresse des royaumes » ou « dame des royaumes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי
  choice: Assieds-toi
  rationale: Impératif qal féminin singulier de ישׁב, adressé à Babylone personnifiée. « Assieds-toi » exprime directement la posture d’abaissement imposée.
- source_word: דוּמָם
  choice: en silence
  rationale: L’adverbe évoque le silence ou l’immobilité. « En silence » est naturel en français et conserve l’idée d’une mise à l’écart sans voix.
- source_word: וּבֹאִי בַחֹשֶׁךְ
  choice: et entre dans les ténèbres
  rationale: L’impératif de בוא associé à la préposition et à חֹשֶׁךְ décrit une entrée dans les ténèbres. La formulation garde intacte l’image prophétique de l’obscurité et de la disgrâce.
- source_word: בַּת כַּשְׂדִּים
  choice: fille des Chaldéens
  rationale: La formule personnifie la cité ou le peuple sous les traits d’une femme. La traduction conserve cette image sans ajouter explicitement « Babylone », absent du verset.
- source_word: לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: on ne t’appellera plus
  rationale: Avec la négation, יסף marque ici la cessation, tandis que le pluriel indéfini de קרא se rend naturellement par « on » en français.
- source_word: גְּבֶרֶת מַמְלָכוֹת
  choice: souveraine des royaumes
  rationale: גְּבֶרֶת désigne une femme détenant autorité et prééminence. « Souveraine » communique clairement ce rang dominant en français moderne, tandis que « maîtresse » et « dame » restent des possibilités lexicales signalées en note.
theological_decisions:
- issue: Les ténèbres comme image du jugement et de la perte de prestige
  choice: Conserver littéralement « les ténèbres »
  alternative: Rendre l’idée par « l’obscurité » ou expliciter la disgrâce
  rationale: L’image concrète du texte hébreu laisse au contexte le soin de faire apparaître l’humiliation et la disparition de la scène publique, sans en réduire la portée métaphorique.
- issue: La personnification féminine de la Chaldée ou de Babylone
  choice: Conserver « fille des Chaldéens » et l’appellation féminine « souveraine »
  alternative: Remplacer la personnification par une adresse directe à Babylone
  rationale: Le texte s’adresse explicitement à la puissance jugée comme à une femme. Garder cette personnification préserve la force rhétorique et la tension poétique du jugement.
translation_notes:
  register: Français international moderne, clair et digne. « Assieds-toi » conserve la vigueur de l’impératif; « entre dans les ténèbres » maintient l’image prophétique; « souveraine » évite les connotations modernes potentiellement parasites de « maîtresse » dans le corps du texte tout en conservant cette possibilité en note.
