id: ISA.47.1
reference: Isaiah 47:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רְדִ֣י וּ/שְׁבִ֣י עַל עָפָ֗ר בְּתוּלַת֙ בַּת בָּבֶ֔ל שְׁבִי לָ/אָ֥רֶץ אֵין כִּסֵּ֖א בַּת כַּשְׂדִּ֑ים כִּ֣י לֹ֤א תוֹסִ֨יפִי֙ יִקְרְאוּ לָ֔/ךְ רַכָּ֖ה וַ/עֲנֻגָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/001.yaml
  text: Come down and sit in the dust[a], virgin daughter Babylon; sit on the ground without a throne, daughter of the Chaldeans[d][c][b]. For they will no longer call you tender and delicate.
translation:
  language: fr
  text: Descends et assieds-toi dans la poussière, vierge, fille de Babylone[a] ! Assieds-toi par terre, sans trône[b], fille des Chaldéens ! Car on ne t’appellera plus tendre et délicate[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Vierge, fille de Babylone » personnifie poétiquement la ville et l’empire sous les traits d’une jeune femme de rang royal.
    reason: cultural_note
  - marker: b
    text: 'Ou : « il n’y a pas de trône » ; autre possibilité : « privée de trône ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « douce et choyée » ; les deux adjectifs évoquent aussi la douceur et le raffinement d’une vie privilégiée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְדִי
  choice: Descends
  rationale: Impératif féminin singulier de ירד. « Descends » exprime directement l’abaissement imposé à Babylone sans introduire en français une orientation déictique absente de l’hébreu.
- source_word: וּשְׁבִי / שְׁבִי
  choice: assieds-toi / assieds-toi
  rationale: Dans ce parallélisme avec la poussière et le sol, ישב désigne l’action de s’asseoir plutôt que celle d’habiter. La répétition conserve l’insistance rhétorique de l’hébreu.
- source_word: עַל עָפָר
  choice: dans la poussière
  rationale: Cette tournure française naturelle garde l’image d’humiliation portée par le fait de s’asseoir sur la poussière.
- source_word: בְּתוּלַת בַּת בָּבֶל
  choice: vierge, fille de Babylone
  rationale: La formulation conserve les deux éléments de la chaîne construite et la personnification féminine de Babylone, tout en restant intelligible en français actuel.
- source_word: לָאָרֶץ
  choice: par terre
  rationale: Avec l’impératif « assieds-toi », « par terre » est l’équivalent français le plus naturel et répond à « dans la poussière ».
- source_word: אֵין כִּסֵּא
  choice: sans trône
  rationale: La proposition nominale indique ici la privation du statut royal. « Sans trône » en rend sobrement la valeur circonstancielle, sans exclure la traduction plus littérale « il n’y a pas de trône ».
- source_word: בַּת כַּשְׂדִּים
  choice: fille des Chaldéens
  rationale: Cette traduction suit le gentilé pluriel hébreu et maintient le second titre personnifiant Babylone.
- source_word: כִּי לֹא תוֹסִיפִי יִקְרְאוּ לָךְ
  choice: Car on ne t’appellera plus
  rationale: יסף avec le verbe suivant marque la cessation, tandis que la troisième personne du pluriel a une valeur indéfinie que le français rend naturellement par « on ».
- source_word: רַכָּה וַעֲנֻגָּה
  choice: tendre et délicate
  rationale: Le binôme garde la nuance de douceur pour רכה et celle de délicatesse liée à une vie raffinée ou choyée pour ענגה, sans rendre explicitement une cause seulement implicite.
theological_decisions:
- issue: Personnification de Babylone sous les traits d’une jeune femme royale
  choice: Conserver « vierge, fille de Babylone » et « fille des Chaldéens ».
  alternative: Réduire les titres à « Babylone » ou reformuler « Babylone, la vierge ».
  rationale: L’oracle présente la puissance impériale comme une femme royale désormais abaissée et privée de trône. Cette personnification appartient à la force littéraire et théologique du jugement annoncé et ne doit pas être aplatie.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les impératifs et leur répétition préservent le ton solennel et humiliant de l’oracle. La ponctuation met en relief les deux sommations parallèles sans ajouter d’éléments absents du texte source.
