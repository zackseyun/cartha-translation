source:
  edition: WLC
  text: תִּגָּל֙ עֶרְוָתֵ֔/ךְ גַּ֥ם תֵּרָאֶ֖ה חֶרְפָּתֵ֑/ךְ נָקָ֣ם אֶקָּ֔ח וְ/לֹ֥א אֶפְגַּ֖ע אָדָֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/047/003.yaml
  text: Your nakedness will be uncovered[a]; indeed, your disgrace will be seen. I will take vengeance[b], and I will spare no man.
translation:
  language: fr
  text: Ta nudité sera dévoilée, oui, ton déshonneur sera exposé. Je prendrai vengeance et je n’épargnerai personne[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier membre de phrase peut aussi se traduire : « je ne rencontrerai aucun homme », « je ne laisserai personne intervenir » ou « je ne ferai grâce à personne ». L’hébreu est difficile et admet plusieurs interprétations proches.'
    reason: alternative_reading
  - marker: b
    text: 'L’hébreu porte littéralement « être humain » (אָדָם), employé ici vraisemblablement au sens générique : aucun humain ne pourra détourner le jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגָּל
  choice: sera dévoilée
  rationale: Le nifal inaccompli de גלה exprime ici l’exposition passive. « Sera dévoilée » conserve l’image concrète d’une nudité rendue publique.
- source_word: עֶרְוָתֵךְ
  choice: ta nudité
  rationale: עֶרְוָה désigne concrètement la nudité, avec une forte connotation de honte. La traduction garde cette image plutôt que de l’abstraire.
- source_word: גַּם
  choice: oui
  rationale: Dans ce parallélisme, גַּם renforce et confirme la seconde proposition. « Oui » rend naturellement cette insistance en français.
- source_word: תֵּרָאֶה
  choice: sera exposé
  rationale: Le nifal de ראה signifie littéralement « sera vu ». Avec « déshonneur », « sera exposé » exprime clairement sa manifestation publique tout en évitant une tournure française pesante.
- source_word: חֶרְפָּתֵךְ
  choice: ton déshonneur
  rationale: חֶרְפָּה évoque l’opprobre, la honte sociale et le déshonneur. « Déshonneur » convient au registre solennel de l’oracle.
- source_word: נָקָם אֶקָּח
  choice: je tirerai vengeance
  rationale: La tournure conserve le nom נָקָם et rend l’expression hébraïque « prendre vengeance » par une collocation française idiomatique et soutenue.
- source_word: וְלֹא אֶפְגַּע
  choice: et je n’épargnerai
  rationale: פגע possède un champ sémantique étendu et la proposition est difficile. Dans le contexte du jugement, « ne pas épargner » rend de façon cohérente l’idée d’une vengeance que nul ne pourra fléchir, sans masquer l’ambiguïté, signalée en note.
- source_word: אָדָם
  choice: personne
  rationale: אָדָם a ici vraisemblablement une valeur humaine générique. « Personne » est naturel en français dans cette proposition négative et n’introduit pas une restriction au sexe masculin.
theological_decisions:
- issue: Sens de וְלֹא אֶפְגַּע אָדָם
  choice: je n’épargnerai personne
  alternative: je ne rencontrerai aucun homme ; je ne laisserai personne intervenir ; je ne ferai grâce à personne
  rationale: La construction est concise et le verbe פגע admet plusieurs sens. Le contexte d’un jugement divin soutient l’idée d’une vengeance sans ménagement, mais les autres analyses demeurent possibles et sont donc conservées en note.
- issue: Portée de אָדָם
  choice: personne, au sens de tout être humain
  alternative: un homme
  rationale: Le nom singulier אָדָם peut désigner génériquement un être humain. La traduction française exprime cette portée sans faire de l’identité masculine un élément absent du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement féminin singulier suit l’adresse personnifiée à Babylone. Le parallélisme poétique et la progression de l’exposition vers le jugement sont préservés.
