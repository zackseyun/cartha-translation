  text: לֹא יִשָּׁמַ֨ע ע֤וֹד חָמָס֙ בְּ/אַרְצֵ֔/ךְ שֹׁ֥ד וָ/שֶׁ֖בֶר בִּ/גְבוּלָ֑יִ/ךְ וְ/קָרָ֤את יְשׁוּעָה֙ חוֹמֹתַ֔יִ/ךְ וּ/שְׁעָרַ֖יִ/ךְ תְּהִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/018.yaml
  text: Violence will no longer be heard in your land[a], devastation or destruction within your borders; and you will call your walls Salvation, and your gates Praise.
translation:
  language: fr
  text: On n’entendra plus parler de violence dans ton pays, ni de dévastation ni de destruction à l’intérieur de tes frontières[a]. Tu appelleras tes murailles « Salut » et tes portes « Louange ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ni pillage ni ruine à l’intérieur de tes frontières ».'
    reason: Les mots שֹׁד et שֶׁבֶר peuvent respectivement désigner le pillage ou la dévastation, et la brisure, la ruine ou la destruction.
lexical_decisions:
- source_word: יִשָּׁמַע
  choice: on n’entendra plus parler de
  rationale: Le nifal de שׁמע exprime ici le fait que la violence ne sera plus entendue ni signalée. Cette tournure est naturelle en français et conserve la portée du verbe.
- source_word: חָמָס
  choice: violence
  rationale: Le terme désigne la violence, la brutalité ou l’injustice violente; « violence » convient au parallèle avec les formes de ruine qui suivent.
- source_word: בְּאַרְצֵךְ
  choice: dans ton pays
  rationale: אֶרֶץ peut désigner une terre ou un pays. Ici, « pays » rend clairement l’espace habité auquel s’adresse la prophétie.
- source_word: שֹׁד
  choice: dévastation
  rationale: שֹׁד peut désigner le pillage violent ou la dévastation qui en résulte. Le contexte autorise ce sens résultatif tout en laissant « pillage » comme solution possible.
- source_word: שֶׁבֶר
  choice: destruction
  rationale: Issu de l’idée de brisure, le mot peut évoquer la ruine ou l’effondrement. « Destruction » forme un parallélisme naturel avec « dévastation ».
- source_word: בִּגְבוּלָיִךְ
  choice: à l’intérieur de tes frontières
  rationale: Cette formulation conserve l’image spatiale des limites du territoire.
- source_word: וְקָרָאת
  choice: Tu appelleras
  rationale: Le verbe poursuit la perspective prophétique future. Une nouvelle phrase coordonnée rend le waw sans ajouter un contraste explicite absent de l’hébreu.
- source_word: יְשׁוּעָה
  choice: Salut
  rationale: Le nom donné aux murailles désigne la délivrance salvatrice. « Salut » est ici employé comme appellation.
- source_word: חוֹמֹתַיִךְ
  choice: tes murailles
  rationale: « Murailles » évoque précisément les fortifications d’une ville et convient mieux que le terme général « murs ».
- source_word: שְׁעָרַיִךְ
  choice: tes portes
  rationale: Traduction directe des portes de la ville, lieux d’entrée et de vie publique.
- source_word: תְּהִלָּה
  choice: Louange
  rationale: Le terme signifie habituellement louange ou chant de louange. Il fonctionne ici comme le nom attribué aux portes.
theological_decisions:
- issue: Faut-il rendre יְשׁוּעָה et תְּהִלָּה comme de simples noms communs ou comme des appellations données aux murailles et aux portes ?
  choice: 'Les présenter comme des appellations : « Salut » et « Louange ».'
  alternative: Les traduire descriptivement par « salut » et « louange », sans signaler leur fonction de noms.
  rationale: La construction « tu appelleras X Y » indique une attribution de noms. Les guillemets et les majuscules le montrent en français sans transformer ces abstractions en personnes.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier reproduit l’adresse féminine singulière à Sion. La coordination hébraïque est rendue par une nouvelle phrase, sans introduire un « mais » interprétatif. Les guillemets signalent clairement les noms symboliques.
