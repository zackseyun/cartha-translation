  text: לֹא יִֽהְיֶה לָּ֨/ךְ ע֤וֹד הַ/שֶּׁ֨מֶשׁ֙ לְ/א֣וֹר יוֹמָ֔ם וּ/לְ/נֹ֕גַהּ הַ/יָּרֵ֖חַ לֹא יָאִ֣יר לָ֑/ךְ וְ/הָיָה לָ֤/ךְ יְהוָה֙ לְ/א֣וֹר עוֹלָ֔ם וֵ/אלֹהַ֖יִ/ךְ לְ/תִפְאַרְתֵּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/019.yaml
  text: The sun will no longer be for you the light by day[a], nor will the moon shine for you for brightness; but Yahweh will be for you an everlasting light[c][b], and your God your glory.
translation:
  language: fr
  text: Le soleil ne sera plus pour toi la lumière du jour, et la lune ne t’éclairera pas de sa clarté[a] ; mais Yahweh[b] sera pour toi une lumière éternelle, et ton Dieu sera ta splendeur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de son éclat ».
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « YHWH », nom divin traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: c
    text: Ou « ta gloire » ou « ta beauté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לָּךְ עוֹד
  choice: ne sera plus pour toi
  rationale: Cette formulation française exprime naturellement la cessation indiquée par la négation, l’imparfait de היה, le datif לָךְ et עוֹד.
- source_word: לְאוֹר יוֹמָם
  choice: la lumière du jour
  rationale: Le לְ indique ici la fonction du soleil comme lumière diurne. « La lumière du jour » est naturel en français et conserve le parallélisme poétique.
- source_word: וּלְנֹגַהּ הַיָּרֵחַ לֹא יָאִיר לָךְ
  choice: et la lune ne t’éclairera plus de sa clarté
  rationale: La formulation conserve l’idée de נֹגַהּ, « clarté, éclat », et rend le hiphil de אור ainsi que le datif לָךְ dans un français fluide. « Plus » est repris conformément à la portée contextuelle de עוֹד.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération du nom divin exprimé par le tétragramme, plutôt que remplacement par un titre.
- source_word: לְאוֹר עוֹלָם
  choice: une lumière éternelle
  rationale: Rend la fonction marquée par לְ et la durée indéfinie ou perpétuelle exprimée par עוֹלָם dans un français idiomatique.
- source_word: לְתִפְאַרְתֵּךְ
  choice: ta splendeur
  rationale: תִפְאֶרֶת peut désigner la splendeur, la gloire ou la beauté. « Splendeur » convient au champ lexical lumineux du verset sans réduire le mot au seul honneur abstrait.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Yahvé
  rationale: Le texte hébreu emploie le nom personnel divin. « Yahweh » le représente directement, tandis que « le SEIGNEUR » lui substituerait un titre.
- issue: Nature de la disparition du rôle du soleil et de la lune
  choice: Conserver l’image prophétique sans en préciser le mode d’accomplissement
  alternative: Transformation cosmique strictement littérale ; image exclusivement métaphorique
  rationale: L’hébreu affirme que Yahweh remplacera les luminaires comme lumière de Sion, mais le verset seul ne tranche pas entre les différentes manières de comprendre l’accomplissement de cette image.
- issue: Valeur de תִפְאֶרֶת
  choice: splendeur
  alternative: gloire ; beauté
  rationale: Le terme possède plusieurs nuances réelles. « Splendeur » maintient le lien poétique avec la lumière, tandis que la note préserve les autres sens possibles.
translation_notes:
  register: Français international actuel, soutenu mais accessible. Le parallélisme poétique est conservé, avec une syntaxe naturelle. Le féminin singulier des suffixes hébreux, adressé à Sion ou Jérusalem, n’exige pas de marque distincte dans ces tournures françaises.
