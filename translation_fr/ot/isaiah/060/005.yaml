  - severity: low
    issue: « S’épanouira » interprète l’élargissement du cœur comme une joie univoque.
    rationale: רחב (« être large, s’élargir ») peut évoquer une expansion joyeuse, mais la traduction littérale imagée préserve mieux la tension avec « frémira ».
