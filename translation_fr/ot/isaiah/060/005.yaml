base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/005.yaml
  text: Then you will see and be radiant[a], and your heart will tremble and swell, because the abundance of the sea will be turned to you[b]; the wealth of the nations will come to you.
translation:
  language: fr
  text: Alors tu verras et tu rayonneras, ton cœur frémira et s’élargira, car l’abondance de la mer se tournera vers toi[a], et les richesses des nations viendront à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affluera vers toi ». L’expression peut désigner plus précisément les richesses venues par mer.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְאִי
  choice: tu verras
  rationale: Le qal inaccompli 2e personne féminin singulier de ראה s’adresse à Sion/Jérusalem et reçoit ici naturellement une valeur future dans l’annonce prophétique.
- source_word: וְנָהַרְתְּ
  choice: tu rayonneras
  rationale: Dans ce contexte, נהר décrit vraisemblablement le visage qui s’illumine plutôt qu’un écoulement littéral. « Rayonner » conserve l’image visuelle sans expliciter indûment la joie.
- source_word: וּפָחַד
  choice: ton cœur frémira
  rationale: Avec « ton cœur » comme sujet exprimé, le verbe évoque un saisissement physique et affectif. « Frémira » préserve l’ambivalence entre crainte, émerveillement et joie intense.
- source_word: וְרָחַב לְבָבֵךְ
  choice: ton cœur … s’épanouira
  rationale: Littéralement, le cœur « s’élargira ». L’expression française choisie rend une expansion intérieure heureuse tout en restant imagée et naturelle.
- source_word: יֵהָפֵךְ עָלַיִךְ
  choice: affluera vers toi
  rationale: Le niphal de הפך exprime ici un mouvement ou retournement en direction de Sion. Avec « l’abondance de la mer », « affluera vers toi » transmet ce mouvement en français idiomatique, sans préciser qu’il s’agirait d’une remise de propriété.
- source_word: הֲמוֹן יָם
  choice: l’abondance de la mer
  rationale: הֲמוֹן peut désigner multitude, profusion ou tumulte. « L’abondance de la mer » préserve cette ampleur sémantique; le parallélisme permet aussi d’y entendre les ressources du commerce maritime.
- source_word: חֵיל גּוֹיִם
  choice: les richesses des nations
  rationale: חֵיל peut signifier force, armée ou ressources. Le contexte des biens convergeant vers Sion et le parallélisme avec l’abondance maritime favorisent le sens économique.
- source_word: יָבֹאוּ לָךְ
  choice: viendront à toi
  rationale: Rendu direct du verbe de mouvement et de son complément, adapté à l’image prophétique des ressources des nations arrivant à Sion.
theological_decisions:
- issue: La réaction affective de Sion
  choice: Un saisissement mêlant émerveillement et joie
  alternative: Une peur pure, ou au contraire une joie dépourvue de crainte
  rationale: La succession « verras », « rayonneras », « frémira » et « s’épanouira » associe lumière, tremblement et expansion du cœur. La traduction maintient cette tension au lieu de réduire la réaction à une seule émotion.
- issue: La nature de ce qui vient de la mer
  choice: Une formulation large pouvant inclure les ressources maritimes
  alternative: Identifier explicitement l’expression aux seules richesses du commerce maritime
  rationale: הֲמוֹן יָם reste plus large que « richesses maritimes ». Le texte principal conserve « abondance », tandis que la note signale l’interprétation économique suggérée par le parallélisme.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin singulier est maintenu parce que le discours s’adresse à Sion/Jérusalem personnifiée. « Frémira » évite de réduire פָחַד à la terreur, et « s’épanouira » rend naturellement l’image hébraïque du cœur qui s’élargit.
