source:
  edition: WLC
  text: שְׂאִֽי סָבִ֤יב עֵינַ֨יִ/ךְ֙ וּ/רְאִ֔י כֻּלָּ֖/ם נִקְבְּצ֣וּ בָֽאוּ לָ֑/ךְ בָּנַ֨יִ/ךְ֙ מֵ/רָח֣וֹק יָבֹ֔אוּ וּ/בְנֹתַ֖יִ/ךְ עַל צַ֥ד תֵּאָמַֽנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/004.yaml
  text: Lift up your eyes all around and see[a]; all of them gather together; they come to you. Your sons will come from far away[b], and your daughters will be carried on the hip.
translation:
  language: fr
  text: 'Lève les yeux et regarde autour de toi : tous se rassemblent, ils viennent vers toi. Tes fils viendront de loin, et tes filles seront portées[a] sur la hanche[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront soutenues » ou « seront entourées de soins »; le verbe peut évoquer le fait de porter ou de prendre soin.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sur le côté »; l’expression est généralement comprise comme l’image d’un enfant porté sur la hanche.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי סָבִיב עֵינַיִךְ וּרְאִי
  choice: Lève les yeux et regarde autour de toi
  rationale: Les deux impératifs féminins singuliers s’adressent à Sion personnifiée. Cette formulation française est naturelle tout en conservant le mouvement du regard dans toutes les directions.
- source_word: כֻּלָּם נִקְבְּצוּ בָאוּ לָךְ
  choice: tous se rassemblent, ils viennent vers toi
  rationale: Le présent donne à la scène prophétique son caractère vivant. « Tous » garde l’insistance du pronom hébreu, et « vers toi » exprime la direction marquée par לָךְ.
- source_word: בָּנַיִךְ מֵרָחוֹק יָבֹאוּ
  choice: Tes fils viendront de loin
  rationale: Le terme « fils » est conservé en parallèle avec « filles », et l’imparfait hébreu est rendu par un futur qui convient à la promesse annoncée.
- source_word: וּבְנֹתַיִךְ עַל צַד תֵּאָמַנָה
  choice: et tes filles seront portées sur la hanche
  rationale: Le passif « seront portées » restitue l’image de personnes dont on prend soin; « sur la hanche » rend concrètement le port d’un enfant au côté, sans masquer les autres nuances possibles du verbe et de la locution.
theological_decisions:
- issue: Image sexuée du rétablissement de Sion
  choice: Conserver « fils » et « filles ».
  alternative: Employer le terme collectif « enfants ».
  rationale: Le parallélisme hébreu nomme expressément les deux groupes et présente ainsi le retour de l’ensemble des descendants de Sion.
- issue: Aspect des verbes prophétiques
  choice: Rendre les parfaits de la première scène au présent et les imparfaits de la seconde au futur.
  alternative: Uniformiser tous les verbes au présent ou au futur.
  rationale: Ce choix maintient à la fois la vivacité de la vision (« se rassemblent », « viennent ») et la portée prospective de la promesse (« viendront », « seront portées »), sans supprimer la tension temporelle du texte.
translation_notes:
  register: Français international moderne, clair et digne. L’adresse à Sion reste au féminin singulier, perceptible dans le contexte plutôt que par une marque artificielle. La ponctuation met en valeur les deux volets du parallélisme sans alourdir la phrase.
