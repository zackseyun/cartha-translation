id: ISA.60.14
reference: Isaiah 60:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָלְכ֨וּ אֵלַ֤יִ/ךְ שְׁח֨וֹחַ֙ בְּנֵ֣י מְעַנַּ֔יִ/ךְ וְ/הִֽשְׁתַּחֲו֛וּ עַל כַּפּ֥וֹת רַגְלַ֖יִ/ךְ כָּל מְנַֽאֲצָ֑יִ/ךְ וְ/קָ֤רְאוּ לָ/ךְ֙ עִ֣יר יְהוָ֔ה צִיּ֖וֹן קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/014.yaml
  text: The sons of those who afflicted you will come to you bowed down[a], and all who despised you will bow down at the soles of your feet; and they will call you The City of Yahweh[c][b], Zion of the Holy One of Israel.
translation:
  language: fr
  text: Les fils de ceux qui t’ont opprimée viendront vers toi, courbés[a], et tous ceux qui te méprisent se prosterneront à tes pieds[b]. Ils t’appelleront « Ville de Yahweh », « Sion du Saint d’Israël »[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Les fils de ceux qui t’ont opprimée viendront vers toi, courbés. » On pourrait aussi traduire « les enfants de tes oppresseurs ».'
    reason: lexical_alternative
  - marker: b
    text: La prosternation exprime ici la soumission ou l’hommage rendu à Sion, et non l’adoration divine de la ville.
    reason: cultural_note
  - marker: c
    text: L’expression hébraïque « Sion du Saint d’Israël » présente Sion comme appartenant au Saint d’Israël ou comme lui étant étroitement associée.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁחוֹחַ
  choice: courbés
  rationale: Le terme décrit une posture physiquement abaissée. « Courbés » est naturel en français et conserve l’idée de soumission sans ajouter explicitement l’humiliation.
- source_word: בְּנֵי מְעַנַּיִךְ
  choice: Les fils de ceux qui t’ont opprimée
  rationale: « Les fils » respecte le masculin explicite de בְּנֵי, tandis que « ceux qui t’ont opprimée » rend le participe issu de ענה dans son sens contextuel d’oppression.
- source_word: וְהִשְׁתַּחֲווּ
  choice: se prosterneront
  rationale: Le verbe désigne ici un geste d’abaissement et de soumission devant Sion. « Se prosterner » préserve la force physique du geste sans imposer le sens cultuel d’adorer.
- source_word: עַל כַּפּוֹת רַגְלַיִךְ
  choice: jusqu’à la plante de tes pieds
  rationale: כַּפּוֹת désigne ici la plante des pieds. La tournure française restitue l’image vive d’un abaissement extrême.
- source_word: מְנַאֲצָיִךְ
  choice: ceux qui te méprisaient
  rationale: Le verbe נאץ exprime le mépris ou le rejet dédaigneux. « Méprisaient » est direct, idiomatique et suffisamment fort.
- source_word: עִיר יְהוָה
  choice: Ville de Yahweh
  rationale: Le groupe constitue un titre donné à Sion. Le nom divin יְהוָה est translittéré « Yahweh » afin de préserver le nom propre présent dans l’hébreu.
- source_word: צִיּוֹן קְדוֹשׁ יִשְׂרָאֵל
  choice: Sion du Saint d’Israël
  rationale: Cette construction condensée désigne Sion par son appartenance ou sa relation au Saint d’Israël; elle ne présente pas Sion elle-même comme le Saint d’Israël.
- source_word: וְקָרְאוּ לָךְ
  choice: Ils t’appelleront
  rationale: L’expression introduit les titres par lesquels la ville sera désignée. « Appelleront » est la formulation française la plus simple et naturelle.
theological_decisions:
- issue: Nature de la prosternation devant Sion
  choice: Un geste de soumission et d’hommage envers la Sion restaurée
  alternative: Comprendre le verbe comme une adoration cultuelle rendue à la ville
  rationale: Bien que השתחוה puisse désigner l’adoration dans certains contextes, son destinataire est ici Sion. La traduction conserve le geste physique sans faire de la ville l’objet d’un culte divin.
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu porte explicitement le Tétragramme. « Yahweh » maintient le caractère de nom propre et correspond à la couche anglaise auditée fournie.
- issue: Rapport entre Sion et le Saint d’Israël
  choice: Sion est désignée comme appartenant au Saint d’Israël ou lui étant étroitement liée
  alternative: Lire « Sion, le Saint d’Israël », comme si Sion était elle-même le Saint
  rationale: La syntaxe nominale hébraïque est condensée, mais le contexte et le titre divin établi « le Saint d’Israël » favorisent nettement une relation génitivale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le féminin des pronoms renvoie à Sion/la ville. Les guillemets distinguent clairement les deux titres attribués à la ville.
