source:
  edition: WLC
  text: וְ/יָנַקְתְּ֙ חֲלֵ֣ב גּוֹיִ֔ם וְ/שֹׁ֥ד מְלָכִ֖ים תִּינָ֑קִי וְ/יָדַ֗עַתְּ כִּ֣י אֲנִ֤י יְהוָה֙ מֽוֹשִׁיעֵ֔/ךְ וְ/גֹאֲלֵ֖/ךְ אֲבִ֥יר יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/016.yaml
  text: You will nurse on the milk of nations[a], and you will suck the breast of kings; and you will know that I, Yahweh, am your Savior and your Redeemer, the Mighty One of Jacob.
translation:
  language: fr
  text: Tu téteras le lait des nations et tu téteras le sein des rois. Et tu sauras que moi, Yahweh, je suis ton Sauveur et ton Rédempteur, le Puissant de Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָנַקְתְּ / תִּינָקִי
  choice: tu téteras / tu téteras
  rationale: Le verbe ינק évoque concrètement l’action de téter. La répétition française conserve le parallélisme et l’image saisissante de l’hébreu; les formes au féminin singulier s’adressent à Sion personnifiée.
- source_word: חֲלֵב גּוֹיִם
  choice: le lait des nations
  rationale: Le sens concret « lait » est maintenu plutôt que d’expliciter la métaphore par « richesses » ou « abondance ». גּוֹיִם désigne ici les nations étrangères.
- source_word: וְשֹׁד מְלָכִים
  choice: le sein des rois
  rationale: שֹׁד désigne le sein dans le cadre de l’allaitement. La formulation conserve volontairement l’image corporelle paradoxale de rois qui nourrissent Sion.
- source_word: וְיָדַעַתְּ
  choice: Alors tu sauras
  rationale: Dans cette suite prophétique, la coordination marque naturellement la conséquence de ce qui précède. « Alors » rend ce lien en français sans modifier le contenu de l’affirmation.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre.
- source_word: מוֹשִׁיעֵךְ
  choice: ton Sauveur
  rationale: Le participe hiphil avec suffixe féminin singulier présente Yahweh comme celui qui sauve Sion; « Sauveur » en rend la force concise et titulaire.
- source_word: וְגֹאֲלֵךְ
  choice: ton Rédempteur
  rationale: גאל exprime l’action de délivrer ou de racheter en assumant une obligation de proche. « Rédempteur » préserve ce langage caractéristique d’Ésaïe sans surdéterminer ici la notion de parent-rédempteur.
- source_word: אֲבִיר יַעֲקֹב
  choice: le Puissant de Jacob
  rationale: L’épithète אֲבִיר présente Dieu comme le puissant ou le fort. « Jacob » est conservé conformément au texte, sans le remplacer par « Israël ».
theological_decisions:
- issue: Traitement de l’image d’allaitement appliquée aux nations et aux rois
  choice: Conserver littéralement « lait », « sein » et « téteras »
  alternative: Interpréter l’image comme les richesses ou les ressources des nations et des rois
  rationale: Le texte hébreu répète explicitement le vocabulaire de l’allaitement. Même si l’image évoque le soutien matériel et l’honneur reçus par Sion, l’expliciter dans le corps du verset effacerait sa vigueur et son étrangeté voulue.
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie le nom propre divin; sa transcription permet de le distinguer d’un simple titre.
- issue: Portée de גֹאֲלֵךְ
  choice: ton Rédempteur
  alternative: ton proche qui te rachète
  rationale: Le terme peut évoquer les responsabilités d’un proche, mais le verset ne précise pas cet aspect. « Rédempteur » garde la richesse de la notion sans imposer une seule explication.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le tutoiement au féminin singulier reflète l’adresse à Sion/Jérusalem personnifiée. La répétition de « tu téteras » et l’association volontairement surprenante avec les rois préservent la poésie hébraïque.
