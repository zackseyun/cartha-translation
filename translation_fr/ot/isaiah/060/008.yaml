  text: מִי אֵ֖לֶּה כָּ/עָ֣ב תְּעוּפֶ֑ינָה וְ/כַ/יּוֹנִ֖ים אֶל אֲרֻבֹּתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/008.yaml
  text: Who are these that fly like a cloud[a], and like doves to their windows?
translation:
  language: fr
  text: Qui sont ceux-là qui volent comme un nuage, comme des colombes vers leurs ouvertures[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ouvertures de leur colombier »; le mot désigne des ouvertures ou des fenêtres.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֵלֶּה
  choice: Qui sont ceux-là
  rationale: L’interrogatif מִי porte sur des personnes, et le démonstratif pluriel אֵלֶּה désigne le groupe aperçu. « Ceux-là » rend naturellement la valeur déictique en français.
- source_word: כָּעָב
  choice: comme un nuage
  rationale: Le comparatif כְּ et le singulier עָב sont conservés; le nuage évoque vraisemblablement une masse en mouvement.
- source_word: תְּעוּפֶינָה
  choice: volent
  rationale: L’imparfait qal 3e personne féminin pluriel de עוּף est rendu au présent pour préserver la vivacité de la vision prophétique.
- source_word: וְכַיּוֹנִים
  choice: comme des colombes
  rationale: La seconde comparaison est maintenue en parallèle avec la première. La conjonction peut rester implicite en français après la virgule sans perte de sens.
- source_word: אֶל
  choice: vers
  rationale: « Vers » exprime clairement le mouvement orienté vers les ouvertures, sans imposer que les oiseaux y soient déjà entrés.
- source_word: אֲרֻבֹּתֵיהֶם
  choice: leurs ouvertures
  rationale: אֲרֻבָּה désigne une ouverture ou une fenêtre. Dans le contexte des colombes, il s’agit probablement des ouvertures de leur colombier; « ouvertures » conserve la portée lexicale sans expliciter excessivement l’image.
