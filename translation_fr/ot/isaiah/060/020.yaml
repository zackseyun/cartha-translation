id: ISA.60.20
reference: Isaiah 60:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יָב֥וֹא עוֹד֙ שִׁמְשֵׁ֔/ךְ וִ/ירֵחֵ֖/ךְ לֹ֣א יֵאָסֵ֑ף כִּ֣י יְהוָ֗ה יִֽהְיֶה לָּ/ךְ֙ לְ/א֣וֹר עוֹלָ֔ם וְ/שָׁלְמ֖וּ יְמֵ֥י אֶבְלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/020.yaml
  text: Your sun will no longer go down[a], and your moon will not withdraw; for Yahweh will be your everlasting light[b], and the days of your mourning will be ended.
translation:
  language: fr
  text: Ton soleil ne se couchera plus[a], et ta lune ne se retirera pas, car Yahweh sera pour toi une lumière éternelle, et les jours de ton deuil prendront fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « ne viendra plus », expression qui désigne ici le coucher du soleil.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבוֹא עוֹד
  choice: ne se couchera plus
  rationale: Bien que בוא signifie littéralement « venir », avec le soleil pour sujet il désigne ici idiomatiquement son coucher. Cette formulation est naturelle en français et conserve l’image.
- source_word: שִׁמְשֵׁךְ
  choice: ton soleil
  rationale: Rend directement le nom avec le suffixe possessif féminin singulier, adressé à Sion/Jérusalem.
- source_word: וִירֵחֵךְ
  choice: et ta lune
  rationale: Traduction directe du nom coordonné portant le suffixe féminin singulier.
- source_word: יֵאָסֵף
  choice: ne se retirera pas
  rationale: Le niphal de אסף peut signifier « être recueilli, retiré ». « Se retirera » conserve la métaphore sans la réduire au phénomène astronomique du déclin de la lune.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français le motif de la promesse précédente.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin plutôt que de lui substituer un titre.
- source_word: יִהְיֶה לָךְ לְאוֹר עוֹלָם
  choice: sera pour toi une lumière éternelle
  rationale: Suit de près la construction hébraïque tout en restant idiomatique et digne en français.
- source_word: עוֹלָם
  choice: éternelle
  rationale: Exprime ici la durée sans fin de la lumière divine promise.
- source_word: וְשָׁלְמוּ
  choice: prendront fin
  rationale: Le verbe indique que ces jours seront achevés ou arrivés à leur terme. Cette expression française communique clairement la cessation du deuil.
- source_word: יְמֵי אֶבְלֵךְ
  choice: les jours de ton deuil
  rationale: Traduction directe qui conserve le cadre de lamentation et le possessif adressé à Sion.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme; sa translittération préserve le nom personnel sans lui substituer un titre.
- issue: Imagerie eschatologique du soleil et de la lune
  choice: Conserver littéralement l’imagerie cosmique
  alternative: La reformuler comme une simple image de consolation ou de prospérité
  rationale: Le verset oppose les luminaires créés à la lumière éternelle de Yahweh. La traduction maintient cette image et sa tension théologique sans imposer une interprétation particulière.
translation_notes:
  register: 'Français international moderne, naturel et digne. Tutoiement conservé pour l’adresse poétique à Sion/Jérusalem; parallélisme hébraïque maintenu. Une seule note est nécessaire: « se retirera » reste assez proche de יֵאָסֵף pour préserver dans le texte même l’image de la lune retirée.'
