  source_fidelity: Le sens et le parallélisme du texte hébreu sont fidèlement rendus. « Car voici » reflète כִּי הִנֵּה, « les ténèbres » et « une obscurité épaisse » maintiennent la gradation entre חֹשֶׁךְ et עֲרָפֶל, et la répétition de « sur toi » correspond aux deux occurrences de עָלַיִךְ. L’ajout de « couvrira » au second membre, sous-entendu en hébreu, est nécessaire et non interprétatif en français.
  naturalness: Le français est moderne, solennel et poétique sans être archaïque. La disposition en vers et la reprise de « sur toi » servent bien le parallélisme. « Sur toi se lèvera le SEIGNEUR » est une inversion poétique naturelle.
