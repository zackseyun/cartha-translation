source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה הַ/חֹ֨שֶׁךְ֙ יְכַסֶּה אֶ֔רֶץ וַ/עֲרָפֶ֖ל לְאֻמִּ֑ים וְ/עָלַ֨יִ/ךְ֙ יִזְרַ֣ח יְהוָ֔ה וּ/כְבוֹד֖/וֹ עָלַ֥יִ/ךְ יֵרָאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/002.yaml
  text: For look, darkness will cover the earth, and thick darkness the peoples; but the LORD will rise upon you, and his glory will appear over you.
translation:
  language: fr
  text: 'Car voici : les ténèbres couvriront la terre,

    et une obscurité épaisse couvrira les peuples ;

    mais sur toi se lèvera le SEIGNEUR,

    et sa gloire apparaîtra sur toi.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי relie le verset à l’exhortation précédente par une justification, tandis que הִנֵּה attire solennellement l’attention sur ce qui vient.
- source_word: הַחֹשֶׁךְ
  choice: les ténèbres
  rationale: Ce pluriel idiomatique français rend naturellement le nom collectif hébreu désignant l’obscurité.
- source_word: עֲרָפֶל
  choice: une obscurité épaisse
  rationale: Le terme évoque une obscurité dense ou profonde, plus intense que חֹשֶׁךְ dans le parallélisme.
- source_word: לְאֻמִּים
  choice: les peuples
  rationale: Traduction courante du pluriel, qui désigne ici les groupes humains ou nations.
- source_word: יִזְרַח
  choice: se lèvera
  rationale: Le verbe décrit le lever ou le rayonnement d’un astre ou d’une lumière ; « se lèvera » conserve ici l’image lumineuse sans ajouter un objet absent du texte.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française traditionnelle signalant le nom divin YHWH, en accord avec la couche de consultation fournie.
- source_word: יֵרָאֶה
  choice: apparaîtra
  rationale: Le nifal exprime le fait de devenir visible ou de se manifester ; « apparaîtra » préserve cette nuance.
theological_decisions:
- issue: Rapport entre le lever du SEIGNEUR et l’apparition de sa gloire
  choice: 'Conserver deux propositions parallèles : « sur toi se lèvera le SEIGNEUR » et « sa gloire apparaîtra sur toi »'
  alternative: Expliciter que la gloire du SEIGNEUR brille comme une lumière
  rationale: Le texte associe fortement les deux images sans les identifier grammaticalement ni expliquer leur mécanisme ; la traduction préserve cette tension poétique.
translation_notes:
  register: Style poétique, solennel et intelligible en français international moderne. La répétition de « sur toi » reproduit l’insistance de l’hébreu ; la mise en lignes rend visible le parallélisme.
