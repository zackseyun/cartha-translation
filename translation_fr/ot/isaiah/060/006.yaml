  source_fidelity: 'Le sens est globalement fidèle au texte massorétique : l’abondance des chameaux, les jeunes chameaux de Madian et d’Épha, la venue de Saba, l’or, l’encens, l’annonce des louanges et le nom Yahweh sont tous conservés. La coordination finale est mieux rendue par des verbes finis, à l’image des deux verbes hébreux successifs (« ils porteront… et annonceront »).'
  naturalness: La formulation actuelle « te couvrira, de jeunes chameaux… » est elliptique et peu naturelle en français moderne. Un երկու-points et l’article défini rendent l’explication/apposition claire. Des propositions coordonnées avec « ils porteront » et « ils annonceront » évitent que le participe « portant » ne relègue indûment un verbe principal hébreu à l’arrière-plan.
  terminology: « Chameaux », « jeunes chameaux », « Madian », « Épha », « Saba », « or », « encens » et « Yahweh » conviennent. La note sur l’oliban apporte utilement la précision lexicale pour לְבוֹנָה. « Louanges de Yahweh » préserve de façon satisfaisante l’ambiguïté du génitif hébreu.
