source:
  edition: WLC
  text: שִֽׁפְעַ֨ת גְּמַלִּ֜ים תְּכַסֵּ֗/ךְ בִּכְרֵ֤י מִדְיָן֙ וְ/עֵיפָ֔ה כֻּלָּ֖/ם מִ/שְּׁבָ֣א יָבֹ֑אוּ זָהָ֤ב וּ/לְבוֹנָה֙ יִשָּׂ֔אוּ וּ/תְהִלֹּ֥ת יְהוָ֖ה יְבַשֵּֽׂרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/006.yaml
  text: A multitude of camels will cover you[a], the young camels of Midian and Ephah; all of them will come from Sheba. They will carry gold and frankincense[b], and they will proclaim the praises of Yahweh.
translation:
  language: fr
  text: 'Une multitude de chameaux te couvrira : les jeunes chameaux de Madian et d’Épha. Tous viendront de Saba ; ils porteront de l’or et de l’encens[a], et annonceront les louanges de Yahweh[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus précisément : « de l’oliban » ; il s’agit d’une résine aromatique utilisée comme encens.'
    reason: lexical_precision
  - marker: b
    text: Le verbe traduit par « annonceront » peut aussi signifier « annoncer une bonne nouvelle » ; « les louanges de Yahweh » peut évoquer ses actes dignes de louange.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שִׁפְעַת
  choice: Une multitude de
  rationale: Le nom exprime l’abondance ou la profusion. « Une multitude de » restitue naturellement l’image sans introduire la métaphore plus interprétative d’un flot.
- source_word: גְּמַלִּים
  choice: chameaux
  rationale: Équivalent français direct du pluriel hébreu.
- source_word: תְּכַסֵּךְ
  choice: te couvrira
  rationale: Le piel de כסה signifie couramment « couvrir ». Le suffixe féminin singulier renvoie à Sion/Jérusalem; l’image vive est conservée.
- source_word: בִּכְרֵי
  choice: de jeunes chameaux
  rationale: Le terme désigne de jeunes chameaux. Cette formulation moderne est plus claire que le traditionnel « dromadaires », qui précise plutôt une espèce.
- source_word: מִדְיָן וְעֵיפָה
  choice: Madian et Épha
  rationale: Formes françaises usuelles de ces noms propres bibliques.
- source_word: כֻּלָּם מִשְּׁבָא יָבֹאוּ
  choice: Ils viendront tous de Saba
  rationale: La tournure française conserve l’insistance de כֻּלָּם et l’origine indiquée par la préposition מִן.
- source_word: זָהָב וּלְבוֹנָה
  choice: de l’or et de l’encens
  rationale: לְבוֹנָה désigne l’oliban, couramment appelé « encens » en français biblique. Une note signale le terme plus précis.
- source_word: יִשָּׂאוּ
  choice: portant
  rationale: Le participe français relie naturellement la venue des caravanes au transport des présents, tout en conservant le sens de « porter ».
- source_word: וּתְהִלֹּת יְהוָה
  choice: les louanges de Yahweh
  rationale: Le pluriel est conservé, ainsi que l’ambiguïté entre les louanges adressées à Yahweh et la proclamation de ce qui le rend digne de louange.
- source_word: יְבַשֵּׂרוּ
  choice: annonceront
  rationale: Le verbe signifie annoncer ou porter une bonne nouvelle. « Annonceront » convient au complément « les louanges » sans effacer sa possible nuance de bonne nouvelle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, qui conserve ici le nom propre plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du tétragramme יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom divin. « Yahweh » le représente comme nom propre sans le remplacer par un titre.
- issue: Sens de וּתְהִלֹּת יְהוָה יְבַשֵּׂרוּ
  choice: ils annonceront les louanges de Yahweh
  alternative: ils proclameront les hauts faits de Yahweh / ils annonceront la bonne nouvelle des louanges de Yahweh
  rationale: La formulation choisie conserve le pluriel תְּהִלּוֹת et son ambiguïté, tandis qu’une note rend visible la nuance de bonne nouvelle portée par בשר.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation garde l’adresse féminine singulière à Sion (« te »), le mouvement des caravanes et l’ambiguïté de la dernière proposition.
