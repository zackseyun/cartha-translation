id: ISA.60.9
reference: Isaiah 60:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי לִ֣/י אִיִּ֣ים יְקַוּ֗וּ וָ/אֳנִיּ֤וֹת תַּרְשִׁישׁ֙ בָּ/רִ֣אשֹׁנָ֔ה לְ/הָבִ֤יא בָנַ֨יִ/ךְ֙ מֵֽ/רָח֔וֹק כַּסְפָּ֥/ם וּ/זְהָבָ֖/ם אִתָּ֑/ם לְ/שֵׁם֙ יְהוָ֣ה אֱלֹהַ֔יִ/ךְ וְ/לִ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל כִּ֥י פֵאֲרָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/009.yaml
  text: Surely the coastlands wait for me[a], and the ships of Tarshish first, to bring your sons from far away, with their silver and their gold with them, for the name of Yahweh your God, and for the Holy One of Israel[b], because he has glorified you.
translation:
  language: fr
  text: Oui, les régions côtières m’attendent[a], et les navires de Tarsis sont en tête pour ramener tes fils de loin, avec leur argent et leur or, en l’honneur du nom de Yahweh, ton Dieu, et du Saint d’Israël, parce qu’il t’a glorifiée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les îles m’attendent » ou « les rivages lointains mettent leur espoir en moi » ; le terme hébreu désigne souvent les terres maritimes et le verbe évoque une attente confiante.
    reason: lexical_alternative
  - marker: b
    text: Ou « parce qu’il t’a embellie » ou « parce qu’il t’a honorée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Oui
  rationale: Dans ce contexte, la particule introduit une affirmation explicative et assurée. « Oui » restitue naturellement cette force sans imposer une relation causale trop stricte.
- source_word: אִיִּים
  choice: les régions côtières
  rationale: Dans Ésaïe, le terme peut désigner largement les îles, les côtes et les terres maritimes éloignées. « Régions côtières » garde cette portée géographique sans le limiter aux îles proprement dites.
- source_word: לִי ... יְקַוּוּ
  choice: m’attendent
  rationale: Le verbe exprime une attente confiante ou pleine d’espoir, et la préposition indique ici la personne vers laquelle cette attente se tourne. La note conserve les nuances possibles.
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: les navires de Tarsis
  rationale: Cette traduction préserve l’expression hébraïque traditionnelle sans trancher entre des navires liés à Tarsis et une catégorie de grands navires de commerce.
- source_word: בָּרִאשֹׁנָה
  choice: sont en tête
  rationale: L’adverbe indique la priorité ou la première position. « Sont en tête » s’intègre naturellement à la phrase et rend l’idée de navires arrivant les premiers.
- source_word: בָנַיִךְ
  choice: tes fils
  rationale: Le nom hébreu est explicitement masculin pluriel. Le contexte proche distingue également les fils des filles, ce qui justifie de conserver ici « fils ».
- source_word: כַּסְפָּם וּזְהָבָם אִתָּם
  choice: avec leur argent et leur or
  rationale: La formulation française rend clairement les deux biens qu’ils apportent avec eux, sans reproduire une redondance peu naturelle en français.
- source_word: לְשֵׁם יְהוָה אֱלֹהַיִךְ
  choice: en l’honneur du nom de Yahweh, ton Dieu
  rationale: La préposition לְ exprime ici la destination, le motif ou l’honneur rendu. « En l’honneur du nom » communique naturellement cette orientation vers la réputation et la personne révélée de Dieu.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette formulation conserve le titre divin caractéristique du livre d’Ésaïe.
- source_word: פֵאֲרָךְ
  choice: t’a glorifiée
  rationale: Le piel de פאר peut exprimer l’action d’embellir, d’honorer ou de glorifier. « Glorifiée » convient au contexte d’élévation de Sion tout en laissant les autres nuances en note.
theological_decisions:
- issue: Transcription du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom personnel de l’alliance sans le remplacer par un titre.
- issue: Référent masculin implicite dans כִּי פֵאֲרָךְ
  choice: parce qu’il t’a glorifiée
  alternative: parce que le Saint d’Israël t’a glorifiée; parce que Yahweh t’a glorifiée
  rationale: Le verbe hébreu a un sujet masculin singulier implicite, vraisemblablement Yahweh, le Dieu de Sion, nommé dans la proposition précédente. Le pronom conserve la concision et la légère ambiguïté syntaxique de l’hébreu.
- issue: Genre de בָנַיִךְ
  choice: tes fils
  alternative: tes enfants
  rationale: Le masculin est lexicalement explicite et les filles sont mentionnées séparément dans le contexte du chapitre. La traduction ne neutralise donc pas le terme.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le féminin de « glorifiée » renvoie à Sion, interpellée comme une femme. La ponctuation garde la longue progression poétique du verset tout en assurant sa lisibilité.
