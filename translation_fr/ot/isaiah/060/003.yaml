  text: וְ/הָלְכ֥וּ גוֹיִ֖ם לְ/אוֹרֵ֑/ךְ וּ/מְלָכִ֖ים לְ/נֹ֥גַהּ זַרְחֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/003.yaml
  text: Nations will come to your light[c][b][a], and kings to the brightness of your rising.
translation:
  language: fr
  text: Les nations marcheront vers ta lumière[a], et les rois vers l’éclat de ton lever[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « iront vers ta lumière » ou « viendront à ta lumière ».
    reason: lexical_alternative
  - marker: b
    text: Ou « vers la splendeur de ton aurore » ou « vers l’éclat de ton rayonnement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלְכוּ
  choice: marcheront vers
  rationale: הלך signifie littéralement « marcher/aller ». En français, « marcher vers » reste naturel ici et conserve l’image dynamique du texte hébreu ainsi que la direction exprimée par לְ.
- source_word: גוֹיִם
  choice: des nations
  rationale: גוים désigne couramment les nations ou les peuples. « Des nations » convient au contexte international sans imposer le sens plus interprétatif de « païens ».
- source_word: לְאוֹרֵךְ
  choice: vers ta lumière
  rationale: אוֹר signifie « lumière » et le suffixe féminin singulier renvoie à la destinataire personnifiée. « Vers » rend clairement la valeur directionnelle de לְ.
- source_word: וּמְלָכִים
  choice: et des rois
  rationale: מלכים signifie directement « rois » ; un terme plus large comme « dirigeants » serait moins précis.
- source_word: לְנֹגַהּ
  choice: vers l’éclat
  rationale: נֹגַהּ évoque l’éclat, la splendeur lumineuse ou la clarté. « Éclat » est actuel, digne et s’accorde naturellement avec l’image suivante.
- source_word: זַרְחֵךְ
  choice: de ton lever
  rationale: זרח exprime le fait de se lever ou de poindre en brillant, notamment pour l’astre ou l’aurore. « Ton lever » préserve l’ambiguïté de l’image sans la réduire explicitement à l’aurore.
theological_decisions:
- issue: Référent des suffixes féminins singuliers de la deuxième personne
  choice: Adresse directe à Sion/Jérusalem personnifiée comme une femme
  alternative: Adresse plus générale au peuple de Dieu
  rationale: Le contexte immédiat d’Ésaïe 60 s’adresse à Sion sous une forme féminine singulière. Le français « ta/ton » maintient cette adresse sans ajouter une identification ecclésiologique.
translation_notes:
  register: Français international moderne, naturel et soutenu. Le parallélisme hébreu est conservé par la répétition de « vers ». « Marcheront » maintient l’image concrète du verbe source, tandis que « ton lever » garde ouverte la métaphore du lever, de l’aurore ou du rayonnement.
