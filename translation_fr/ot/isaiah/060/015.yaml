  variant: modern international French
source:
  edition: WLC
  text: תַּ֧חַת הֱיוֹתֵ֛/ךְ עֲזוּבָ֥ה וּ/שְׂנוּאָ֖ה וְ/אֵ֣ין עוֹבֵ֑ר וְ/שַׂמְתִּי/ךְ֙ לִ/גְא֣וֹן עוֹלָ֔ם מְשׂ֖וֹשׂ דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/015.yaml
  text: Instead of your being forsaken and hated[a], with no one passing through, I will make you an everlasting majesty, a joy from generation to generation.
translation:
  language: fr
  text: Au lieu d’être abandonnée et détestée, sans que personne ne passe, je ferai de toi une majesté éternelle[a], une joie de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une gloire éternelle », « une élévation éternelle » ou « un sujet de fierté pour toujours ». Le terme hébreu peut désigner la majesté, la gloire, l’élévation ou la fierté au sens d’un statut honorifique.
    reason: alternative lexicale
lexical_decisions:
- source_word: תַּחַת הֱיוֹתֵךְ
  choice: Au lieu d’être
  rationale: La construction introduit le renversement de la situation antérieure de Sion. Cette formulation française est naturelle et conserve le contraste.
- source_word: עֲזוּבָה
  choice: abandonnée
  rationale: Le féminin correspond à Sion/Jérusalem personnifiée et exprime directement son état de délaissement.
- source_word: וּשְׂנוּאָה
  choice: et détestée
  rationale: Le participe passif signifie littéralement « haïe » ; « détestée » rend ce sens en français courant sans l’atténuer en « méprisée ».
- source_word: וְאֵין עוֹבֵר
  choice: sans que personne ne passe
  rationale: La formulation préserve l’image d’un lieu déserté et ne précise pas indûment s’il s’agit de passer devant la ville ou de la traverser.
- source_word: וְשַׂמְתִּיךְ
  choice: je ferai de toi
  rationale: Dans cette construction, שׂים suivi de ל exprime le fait de donner à quelqu’un ou à quelque chose un nouvel état ou statut.
- source_word: לִגְאוֹן עוֹלָם
  choice: une majesté éternelle
  rationale: גאון peut désigner l’élévation, la majesté ou la gloire. « Majesté » exprime ici le statut honorifique durable accordé à Sion, sans la connotation morale négative que pourrait porter « orgueil ».
- source_word: מְשׂוֹשׂ
  choice: une joie
  rationale: Le nom désigne la joie ou l’allégresse et fonctionne ici comme second attribut de la ville restaurée.
- source_word: דּוֹר וָדוֹר
  choice: de génération en génération
  rationale: Cette expression française idiomatique conserve l’idée de continuité à travers les générations successives.
theological_decisions:
- issue: Sens de גאון dans une promesse de restauration
  choice: majesté
  alternative: gloire, élévation, fierté
  rationale: Dans ce contexte, le mot décrit l’honneur durable conféré à Sion par Dieu, non une arrogance coupable. « Majesté » maintient cette valeur positive tout en laissant en note les principales possibilités lexicales.
translation_notes:
  register: Français international moderne, digne et accessible. Les accords féminins rendent explicite la personnification de Sion/Jérusalem déjà marquée par les formes hébraïques. La proposition « sans que personne ne passe » conserve la concision et l’indétermination spatiale de l’hébreu.
