source:
  edition: WLC
  text: כִּֽי הַ/גּ֧וֹי וְ/הַ/מַּמְלָכָ֛ה אֲשֶׁ֥ר לֹא יַעַבְד֖וּ/ךְ יֹאבֵ֑דוּ וְ/הַ/גּוֹיִ֖ם חָרֹ֥ב יֶחֱרָֽבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/012.yaml
  text: For the nation and the kingdom that will not serve you will perish[b][a], and those nations will be utterly laid waste.
translation:
  language: fr
  text: Car la nation et le royaume qui ne te serviront pas périront, et les nations[a] seront totalement dévastées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe de « la nation et le royaume » au singulier à « les nations » au pluriel, pour produire un effet rhétorique.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu associe un infinitif absolu à un verbe de la même racine pour renforcer l’affirmation. On pourrait aussi traduire : « seront entièrement dévastées » ou « seront certainement ruinées ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison qui fonde les promesses et les jugements précédents, tout en assurant une liaison naturelle en français.
- source_word: הַגּוֹי וְהַמַּמְלָכָה
  choice: la nation et le royaume
  rationale: Conserve les deux noms singuliers et leur sens politique collectif, sans préciser davantage leur identité.
- source_word: אֲשֶׁר לֹא יַעַבְדוּךְ
  choice: qui ne te serviront pas
  rationale: Le verbe עבד signifie couramment « servir ». Le futur convient au contexte prophétique; « refuseront de te servir » ajouterait une nuance volontaire qui n’est pas explicitement exprimée.
- source_word: יֹאבֵדוּ
  choice: périront
  rationale: Exprime largement l’idée de disparition ou de ruine portée par אבד, sans préciser le moyen du jugement.
- source_word: וְהַגּוֹיִם
  choice: et les nations
  rationale: Maintient le passage rhétorique de la nation représentative au singulier vers les nations au pluriel, ainsi que la coordination simple de l’hébreu.
- source_word: חָרֹב יֶחֱרָבוּ
  choice: seront bel et bien dévastées
  rationale: La tournure française marque fortement l’assertion tout en rendant le sens de dévastation de חרב; elle reflète l’emphase de l’infinitif absolu suivi du verbe conjugué sans reproduire maladroitement la répétition hébraïque.
theological_decisions:
- issue: Référent du suffixe féminin singulier de deuxième personne dans « te serviront »
  choice: Maintien de l’adresse directe « te »
  alternative: « serviront Sion », « serviront Jérusalem » ou « serviront le peuple restauré de Dieu »
  rationale: Le contexte immédiat s’adresse à Sion/Jérusalem au féminin singulier. La traduction conserve cette adresse sans transformer l’image en explication théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Bel et bien » rend l’emphase avec naturel sans trancher exclusivement entre intensité et certitude. L’accord au pluriel de « serviront » et « périront » est requis en français par le sujet composé « la nation et le royaume ».
