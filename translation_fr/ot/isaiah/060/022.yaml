source:
  edition: WLC
  text: הַ/קָּטֹן֙ יִֽהְיֶ֣ה לָ/אֶ֔לֶף וְ/הַ/צָּעִ֖יר לְ/ג֣וֹי עָצ֑וּם אֲנִ֥י יְהוָ֖ה בְּ/עִתָּ֥/הּ אֲחִישֶֽׁ/נָּה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/022.yaml
  text: The smallest will become a thousand[a], and the least a mighty nation. I am Yahweh[c][b]; in its time I will hasten it.
translation:
  language: fr
  text: Le plus petit deviendra un millier[a], et le moindre, une nation puissante. Moi, Yahweh, je hâterai cela en son temps[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un clan ». Le mot hébreu peut, dans certains contextes, désigner un clan ou une unité apparentée.
    reason: lexical_alternative
  - marker: b
    text: Ou « au temps qui lui est fixé ». L’hébreu associe un moment déterminé à l’idée d’en hâter l’accomplissement.
    reason: alternative_reading
lexical_decisions:
- source_word: הַקָּטֹן
  choice: le plus petit
  rationale: L’adjectif substantivé désigne ici celui ou le groupe qui est le plus petit ou le plus insignifiant. « Le plus petit » reste naturel et conserve l’image de départ.
- source_word: יִהְיֶה
  choice: deviendra
  rationale: Dans cette construction avec ל exprimant le résultat, היה décrit une transformation plutôt qu’un simple état.
- source_word: לָאֶלֶף
  choice: un millier
  rationale: אֶלֶף a pour sens premier « mille ». « Un millier » s’intègre naturellement à la phrase et souligne la multiplication mise en parallèle avec la nation puissante.
- source_word: הַצָּעִיר
  choice: le moindre
  rationale: צָעִיר peut évoquer la petitesse, l’insignifiance ou la jeunesse. Ici, le parallélisme favorise le rang ou l’importance plutôt que l’âge.
- source_word: לְגוֹי עָצוּם
  choice: une nation puissante
  rationale: Cette expression rend directement גּוֹי, « nation », et עָצוּם, « puissant, fort », tout en conservant l’ampleur de la croissance promise.
- source_word: אֲנִי יְהוָה
  choice: Moi, Yahweh
  rationale: La formulation garde l’auto-identification emphatique et rend directement le nom divin יהוה par « Yahweh ».
- source_word: בְּעִתָּהּ
  choice: en son temps
  rationale: La formule peut désigner le temps propre ou fixé de la réalisation promise. La traduction concise conserve cette nuance sans déterminer explicitement l’antécédent du suffixe féminin.
- source_word: אֲחִישֶׁנָּה
  choice: je hâterai cela
  rationale: Le hiphil de חושׁ exprime l’action de hâter. « Cela » reprend l’accomplissement annoncé sans ajouter un référent absent du texte hébreu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte emploie directement le tétragramme. La translittération « Yahweh » préserve le caractère de nom propre sans introduire un titre à sa place.
- issue: Tension entre le temps fixé et l’action de hâter
  choice: en son temps, je hâterai cela
  alternative: quand le moment viendra, je l’accomplirai rapidement
  rationale: L’hébreu juxtapose délibérément le temps propre de l’événement et l’action divine qui le hâte. La formulation retenue maintient cette tension au lieu de l’expliquer ou de la supprimer.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme poétique est conservé, ainsi que la formulation concise et paradoxale de la dernière proposition.
