    rationale: Le déplacement de « en son temps » après « je hâterai cela » améliore la cadence française sans modifier la portée ni la tension de l’hébreu.
  - severity: low
    issue: Note a trop explicative et légèrement imprécise
    rationale: אֶלֶף signifie d’abord « mille » ; dans certains emplois il peut désigner un clan ou une unité. La mention « mille personnes » n’est pas nécessaire et risque de surdéterminer le terme.
