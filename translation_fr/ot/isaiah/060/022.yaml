  rationale: La révision est limitée à une amélioration de l’ordre des mots dans la finale et à la précision de la note lexicale sur « un millier ». Elle conserve le sens, le registre solennel, l’emphase de l’auto-identification divine et l’ambiguïté intentionnelle du suffixe dans « en son temps » / « cela ».
