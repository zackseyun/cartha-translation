id: ISA.60.1
reference: Isaiah 60:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֥וּמִי א֖וֹרִי כִּ֣י בָ֣א אוֹרֵ֑/ךְ וּ/כְב֥וֹד יְהוָ֖ה עָלַ֥יִ/ךְ זָרָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/001.yaml
  text: Arise[a], shine, for your light has come[b], and the glory of Yahweh has risen upon you.
translation:
  language: fr
  text: Lève-toi, rayonne[a], car ta lumière est venue, et la gloire de Yahweh[b] s’est levée sur toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brille » ou « sois resplendissante »; l’impératif hébreu peut exprimer le fait de devenir lumineuse ou de répandre la lumière.
    reason: lexical_alternative
  - marker: b
    text: Le texte hébreu porte YHWH, le nom divin, traditionnellement rendu par « le SEIGNEUR ».
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמִי
  choice: Lève-toi
  rationale: Impératif qal féminin singulier de קום, adressé à Sion/Jérusalem. « Lève-toi » rend directement l’appel tout en gardant un ton prophétique digne et naturel.
- source_word: אוֹרִי
  choice: rayonne
  rationale: Impératif qal féminin singulier de אור. « Rayonne » exprime une lumière visible et s’accorde naturellement avec « ta lumière est venue », sans réduire l’image à une interprétation abstraite.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le fondement des deux impératifs. « Car » conserve cette relation causale avec concision.
- source_word: בָא אוֹרֵךְ
  choice: ta lumière est venue
  rationale: Le parfait בָא présente l’arrivée de la lumière comme accomplie et certaine. Le passé composé français conserve cette vigueur prophétique sans la transformer explicitement en futur.
- source_word: וּכְבוֹד
  choice: et la gloire
  rationale: כבוד peut évoquer l’honneur, la splendeur et la présence divine manifestée. « La gloire » préserve cette richesse sémantique et l’expression biblique établie.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de représenter directement le tétragramme présent dans le texte hébreu, plutôt que de le remplacer silencieusement par un titre.
- source_word: עָלַיִךְ זָרָח
  choice: s’est levée sur toi
  rationale: זרח décrit notamment le lever ou le jaillissement lumineux d’un astre. « S’est levée sur toi » conserve l’image de l’aube et le parfait hébreu; le féminin français s’accorde avec « gloire ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère personnel du nom divin; une note signale la tradition qui le remplace par « le SEIGNEUR ».
- issue: Valeur temporelle des parfaits בָא et זָרָח dans le discours prophétique
  choice: Passé composé (« est venue », « s’est levée »)
  alternative: Présent ou futur (« vient/se lève »; « viendra/se lèvera »)
  rationale: Les parfaits dépeignent la restauration promise comme une réalité certaine et déjà vivement présentée. Le passé composé maintient l’aspect accompli sans trancher explicitement en faveur d’une simple narration passée ou d’une prédiction future.
translation_notes:
  register: Français international moderne, clair et digne. Les impératifs au féminin singulier reflètent l’adresse à Sion/Jérusalem. « Rayonne » est plus idiomatique en français courant que « brille » dans cette construction, tandis que la note conserve les principales nuances lexicales. Les deux parfaits sont rendus parallèlement au passé composé.
