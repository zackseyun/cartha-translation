  text: וְ/עַמֵּ/ךְ֙ כֻּלָּ֣/ם צַדִּיקִ֔ים לְ/עוֹלָ֖ם יִ֣ירְשׁוּ אָ֑רֶץ נֵ֧צֶר מטע/ו מַעֲשֵׂ֥ה יָדַ֖/י לְ/הִתְפָּאֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/021.yaml
  text: And all your people will be righteous[a]; forever they will possess the land, the shoot of my planting, the work of my hands[c][b], that I may be glorified.
translation:
  language: fr
  text: Tous les membres de ton peuple seront justes ; ils posséderont le pays pour toujours[a][b]. Ils sont le rejeton de sa plantation[c], l’œuvre de mes mains, afin que je manifeste ma splendeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hériteront du pays ». Le verbe hébreu peut signifier « hériter » ou « posséder ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la terre ». Le mot hébreu peut désigner un pays ou la terre ; « le pays » convient plus précisément au contexte de restauration.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « le rejeton de sa plantation ». Le texte hébreu passe ici de « sa » à « mes » dans « l’œuvre de mes mains ». Certaines interprétations harmonisent en « ma plantation ».'
    reason: textual_variant
lexical_decisions:
- source_word: וְעַמֵּךְ כֻּלָּם
  choice: Tout ton peuple
  rationale: Cette formulation française naturelle conserve l’adresse à Sion/Jérusalem au féminin singulier et la totalité exprimée par כֻּלָּם.
- source_word: צַדִּיקִים
  choice: sera juste
  rationale: « Juste » garde la portée morale et relationnelle du terme hébreu sans imposer une explication doctrinale particulière.
- source_word: לְעוֹלָם
  choice: pour toujours
  rationale: Rend simplement et dignement l’idée de permanence durable.
- source_word: יִירְשׁוּ
  choice: ils posséderont
  rationale: Le verbe ירשׁ peut exprimer l’héritage ou la prise et la conservation d’une possession. Dans cette promesse de restauration, « posséderont » convient au contexte, tandis que « hériteront de » est signalé en note.
- source_word: אָרֶץ
  choice: le pays
  rationale: Dans le contexte du rétablissement de Sion, « le pays » est le sens immédiat le plus probable ; « la terre » demeure possible et figure en note.
- source_word: נֵצֶר
  choice: le rejeton
  rationale: « Rejeton » désigne une jeune pousse et convient au registre poétique de l’image végétale.
- source_word: מטעו
  choice: de ce qu’il a planté
  rationale: Le texte fourni porte un suffixe masculin singulier de troisième personne. La traduction le conserve au lieu de l’harmoniser avec la première personne de la proposition suivante.
- source_word: מַעֲשֵׂה יָדַי
  choice: l’œuvre de mes mains
  rationale: Conserve l’image concrète et solennelle de l’action créatrice ou formatrice de Dieu.
- source_word: לְהִתְפָּאֵר
  choice: afin que je sois glorifié
  rationale: Rend la valeur finale de l’infinitif et l’idée que Dieu manifeste sa gloire à travers son œuvre.
theological_decisions:
- issue: Changement de personne entre « ce qu’il a planté » et « mes mains »
  choice: Conserver dans le texte principal la troisième personne de מטעו, puis la première personne de יָדַי.
  alternative: Harmoniser en « ce que j’ai planté » ou « ma plantation ».
  rationale: Le texte hébreu fourni présente ce changement de personne. Le conserver respecte le texte reçu et évite une correction conjecturale ; une note signale clairement la difficulté.
- issue: Portée de צַדִּיקִים
  choice: « juste », sans préciser davantage la nature de cette justice
  alternative: « fidèle », « en règle avec Dieu » ou une paraphrase doctrinale
  rationale: Le terme peut porter des dimensions morales, judiciaires et relationnelles. Une traduction sobre préserve cette richesse et la tension théologique du contexte.
- issue: Sens de לְהִתְפָּאֵר
  choice: « afin que je sois glorifié »
  alternative: « afin que je manifeste ma splendeur » ou « pour servir à ma gloire »
  rationale: La formulation retenue exprime naturellement en français la finalité de l’œuvre divine, sans développer le mécanisme de cette glorification.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset garde le parallélisme poétique et les images végétale et artisanale. La reprise par « Ils sont » clarifie en français que le peuple est à la fois le rejeton et l’œuvre, sans effacer le changement de personne du texte hébreu fourni.
