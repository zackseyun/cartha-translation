base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/017.yaml
  text: Instead of bronze I will bring gold[a], and instead of iron I will bring silver; instead of wood, bronze, and instead of stones, iron. And I will make peace your overseers[c][b], and righteousness your taskmasters.
translation:
  language: fr
  text: 'À la place du bronze[a], j’apporterai de l’or,

    et à la place du fer, j’apporterai de l’argent ;

    à la place du bois, du bronze,

    et à la place des pierres, du fer.

    Je ferai de la paix ton autorité[b],

    et de la justice[c] tes maîtres de corvée[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cuivre ». Le terme hébreu peut désigner le cuivre ou le bronze.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton administration », « ta charge de gouvernement » ou, par métonymie, « tes responsables ». Le terme hébreu peut désigner la surveillance, une charge exercée ou ceux qui l’exercent.
    reason: lexical_alternative
  - marker: c
    text: Ou « droiture ». Le mot hébreu peut évoquer aussi bien la rectitude morale que la justice dans l’ordre public.
    reason: lexical_alternative
  - marker: d
    text: Ou « ceux qui te pressurent » ou « ceux qui exigent de toi un tribut ». Le terme désigne des personnes qui imposent une charge, du travail ou un paiement.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: à la place de
  rationale: Dans cette série d’échanges de matériaux, la préposition exprime clairement la substitution et non une position spatiale.
- source_word: נְחֹשֶׁת
  choice: bronze
  rationale: Le terme peut désigner le cuivre ou un alliage cuivreux. « Bronze » convient naturellement à cette liste de matériaux anciens sans introduire l’anachronisme possible de « laiton ».
- source_word: אָבִיא
  choice: j’apporterai
  rationale: Le hiphil de בוא présente ici Dieu comme celui qui fournit les matériaux de remplacement. « J’apporterai » est précis et naturel.
- source_word: פְקֻדָּתֵךְ
  choice: tes responsables
  rationale: Le nom peut désigner la surveillance, une charge administrative ou ceux qui l’exercent. Le terme personnel « responsables » maintient le parallélisme poétique avec les agents du membre suivant, tout en évitant un titre institutionnel trop précis.
- source_word: שָׁלוֹם
  choice: paix
  rationale: Le mot inclut aussi le bien-être et l’intégrité, mais « paix » reste son équivalent central dans cette vision de restauration.
- source_word: נֹגְשַׂיִךְ
  choice: tes maîtres de corvée
  rationale: Le participe désigne ceux qui pressent les autres, notamment pour exiger travail ou tribut. « Maîtres de corvée » conserve la force coercitive du terme et l’ironie de sa transformation poétique.
- source_word: צְדָקָה
  choice: justice
  rationale: Dans le cadre d’un ordre public restauré, « justice » exprime naturellement la rectitude mise en œuvre dans la vie collective, sans exclure la nuance de droiture.
theological_decisions:
- issue: Relation entre les qualités abstraites et les autorités dans le dernier distique
  choice: « Je ferai de la paix tes responsables, et de la justice tes maîtres de corvée. »
  alternative: « Je ferai régner sur toi la paix, et la justice te gouvernera. »
  rationale: L’hébreu personnifie la paix et la justice en les identifiant aux fonctions d’autorité. La formulation retenue préserve ce parallélisme saisissant et la tension entre coercition passée et ordre restauré, sans transformer le verset en description technique d’un gouvernement.
- issue: Sens de צְדָקָה
  choice: justice
  alternative: droiture
  rationale: Les deux sens sont possibles. « Justice » convient mieux au contexte civique et au contraste avec des agents qui imposent travail ou tribut, tandis qu’une note maintient ouverte la nuance morale de « droiture ».
translation_notes:
  register: Français international moderne, poétique et digne. Les reprises de « à la place de » reproduisent la progression solennelle de l’hébreu. Le dernier distique conserve sa personnification audacieuse plutôt que de l’aplanir en une simple affirmation sur la bonne gouvernance.
