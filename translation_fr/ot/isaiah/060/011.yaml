source:
  edition: WLC
  text: וּ/פִתְּח֨וּ שְׁעָרַ֧יִ/ךְ תָּמִ֛יד יוֹמָ֥ם וָ/לַ֖יְלָה לֹ֣א יִסָּגֵ֑רוּ לְ/הָבִ֤יא אֵלַ֨יִ/ךְ֙ חֵ֣יל גּוֹיִ֔ם וּ/מַלְכֵי/הֶ֖ם נְהוּגִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/011.yaml
  text: Your gates will be open continually[a]; day and night they will not be shut, so that the wealth of the nations may be brought to you[b], with their kings led in procession.
translation:
  language: fr
  text: Tes portes resteront constamment ouvertes ; ni le jour ni la nuit elles ne seront fermées, afin que les richesses des nations[a] soient apportées jusqu’à toi, avec leurs rois conduits en procession[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ressources des nations ». Le mot hébreu peut aussi signifier « force » ou « armée », mais il désigne probablement ici les biens apportés en tribut.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec leurs rois qui sont conduits », voire « menés ». Le participe hébreu peut évoquer une escorte, une procession ou une conduite imposée à des rois soumis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִתְּחוּ שְׁעָרַיִךְ תָּמִיד
  choice: Tes portes resteront constamment ouvertes
  rationale: La forme verbale, jointe à תָּמִיד, décrit ici l’état durable des portes de Sion. « Resteront constamment ouvertes » rend naturellement cette continuité en français.
- source_word: יוֹמָם וָלַיְלָה לֹא יִסָּגֵרוּ
  choice: ni le jour ni la nuit elles ne seront fermées
  rationale: La paire « le jour… la nuit » exprime une durée ininterrompue, tandis que le niphal de סגר indique que les portes ne seront pas fermées.
- source_word: לְהָבִיא אֵלַיִךְ
  choice: afin que… soient amenées chez toi
  rationale: L’infinitif précédé de לְ exprime le but. Le passif français relie naturellement les richesses à l’action de les faire parvenir à Sion.
- source_word: חֵיל גּוֹיִם
  choice: les richesses des nations
  rationale: חֵיל peut désigner la force, une armée ou les ressources matérielles. Dans Ésaïe 60, où les nations apportent leurs biens à Sion, « richesses » correspond le mieux au contexte tout en laissant l’alternative lexicale en note.
- source_word: וּמַלְכֵיהֶם נְהוּגִים
  choice: avec leurs rois conduits en procession
  rationale: Le participe passif de נהג signifie que les rois sont menés ou conduits. « En procession » convient à l’image solennelle sans imposer explicitement l’idée de captivité.
theological_decisions:
- issue: Sens de חֵיל גּוֹיִם dans l’image des nations rendant hommage à Sion
  choice: les richesses des nations
  alternative: la puissance ou l’armée des nations
  rationale: Le contexte immédiat mentionne l’or, l’encens, les troupeaux et d’autres biens apportés à Sion. Le sens économique est donc privilégié, sans nier la gamme sémantique du terme hébreu.
- issue: Nuance de נְהוּגִים appliqué aux rois
  choice: conduits en procession
  alternative: menés comme des captifs, ou simplement conduits
  rationale: Le participe est passif et peut évoquer aussi bien une escorte cérémonielle qu’une soumission. La formulation retenue préserve le mouvement passif et la solennité de la scène sans trancher en faveur d’une captivité explicite.
translation_notes:
  register: Français international moderne, clair et digne. La répétition jour-nuit conserve la portée poétique du mérisme hébreu. Les notes sont placées sur les expressions auxquelles elles se rapportent.
