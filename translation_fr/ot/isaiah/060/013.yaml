source:
  edition: WLC
  text: כְּב֤וֹד הַ/לְּבָנוֹן֙ אֵלַ֣יִ/ךְ יָב֔וֹא בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּ֑ו לְ/פָאֵר֙ מְק֣וֹם מִקְדָּשִׁ֔/י וּ/מְק֥וֹם רַגְלַ֖/י אֲכַבֵּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/013.yaml
  text: The glory of Lebanon will come to you—cypress[a], plane tree, and pine together—to beautify the place of my sanctuary[b], and I will honor the place of my feet.
translation:
  language: fr
  text: 'La splendeur du Liban viendra vers toi : cyprès, platane et pin[a], tous ensemble, pour embellir le lieu de mon sanctuaire ; et je rendrai glorieux le lieu de mes pieds[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu nomme trois sortes d’arbres, mais l’identification exacte des espèces est incertaine. Pour les deuxième et troisième termes, on propose aussi, entre autres, « orme » et « buis ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « mon marchepied ». L’hébreu dit plus littéralement : « le lieu de mes pieds ».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד
  choice: splendeur
  rationale: Dans ce contexte, le terme évoque la magnificence et les précieuses ressources forestières du Liban. « Splendeur » est naturel en français et évite une répétition avec le dernier verbe.
- source_word: הַלְּבָנוֹן
  choice: Liban
  rationale: Nom géographique rendu selon sa forme française usuelle.
- source_word: אֵלַיִךְ
  choice: jusqu’à toi
  rationale: L’adresse est au féminin singulier et renvoie implicitement à Sion/Jérusalem. « Jusqu’à toi » exprime naturellement le mouvement sans expliciter le référent.
- source_word: יָבוֹא
  choice: viendra
  rationale: Le qal inaccompli de בוא signifie directement « venir » ; le futur convient au contexte prophétique.
- source_word: בְּרוֹשׁ
  choice: cyprès
  rationale: L’identification botanique demeure incertaine, mais « cyprès » est une équivalence traditionnelle et plausible pour un arbre fournissant un bois précieux.
- source_word: תִּדְהָר
  choice: platane
  rationale: L’espèce exacte est incertaine ; « platane » est une identification moderne répandue, signalée comme telle dans la note collective.
- source_word: תְאַשּׁוּר
  choice: pin
  rationale: L’identification exacte est discutée ; « pin » convient au contexte d’arbres nobles, avec l’incertitude conservée en note.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Cette formulation rend la venue collective des trois arbres et reste fluide en français.
- source_word: לְפָאֵר
  choice: pour embellir
  rationale: Le piel de פאר désigne ici l’action d’orner ou de rendre magnifique le sanctuaire.
- source_word: מְקוֹם מִקְדָּשִׁי
  choice: le lieu de mon sanctuaire
  rationale: Rendu formel qui conserve la relation construite de l’hébreu et le cadre sacré.
- source_word: וּמְקוֹם רַגְלַי
  choice: le lieu où reposent mes pieds
  rationale: Cette formulation préserve l’image anthropomorphique littérale tout en étant idiomatique en français ; « mon marchepied » serait plus interprétatif.
- source_word: אֲכַבֵּד
  choice: je rendrai glorieux
  rationale: Le piel de כבד peut signifier conférer gloire, honneur ou magnificence. « Rendre glorieux » exprime ici une transformation du lieu plutôt que le simple fait de lui témoigner du respect.
theological_decisions:
- issue: Expression anthropomorphique du rapport de Dieu au sanctuaire
  choice: conserver « le lieu où reposent mes pieds » dans le texte principal
  alternative: mon marchepied
  rationale: L’hébreu dit littéralement « le lieu de mes pieds » et n’emploie pas le nom habituel pour « marchepied ». La formulation retenue maintient l’image poétique et l’association de la présence divine au sanctuaire sans la résoudre par une interprétation.
- issue: Référent du pronom féminin singulier
  choice: laisser le référent implicite
  alternative: ajouter « Sion » ou « Jérusalem »
  rationale: Le contexte identifie l’interlocutrice à Sion/Jérusalem, mais le verset ne la nomme pas. Ne pas l’ajouter respecte la progression du discours.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe conserve le mouvement du verset hébreu, tandis que le point-virgule distingue les deux actions divines. Les incertitudes botaniques et l’image anthropomorphique sont maintenues plutôt que résolues.
