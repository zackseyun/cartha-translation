source:
  edition: WLC
  text: וּ/בָנ֤וּ בְנֵֽי נֵכָר֙ חֹמֹתַ֔יִ/ךְ וּ/מַלְכֵי/הֶ֖ם יְשָׁרְת֑וּ/נֶךְ כִּ֤י בְ/קִצְפִּ/י֙ הִכִּיתִ֔י/ךְ וּ/בִ/רְצוֹנִ֖/י רִֽחַמְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/010.yaml
  text: The sons of foreigners will rebuild your walls[a], and their kings will minister to you; for in my wrath I struck you[d][c][b], but in my favor I have had compassion on you.
translation:
  language: fr
  text: Des étrangers rebâtiront tes murailles, et leurs rois seront à ton service[a] ; car, dans ma colère, je t’ai frappée, mais, dans ma bienveillance[b], j’ai eu compassion de toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te serviront » ; le verbe peut désigner un service personnel, officiel ou ministériel.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans ma faveur » ou « selon mon bon plaisir ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « je t’ai fait miséricorde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: rebâtiront
  rationale: Le verbe signifie littéralement « bâtiront » ; avec les murailles de la ville et dans ce contexte de restauration, « rebâtiront » exprime naturellement le sens sans ajout substantiel.
- source_word: בְנֵי נֵכָר
  choice: des étrangers
  rationale: L’expression formelle « fils de l’étranger » peut désigner idiomatiquement des étrangers. Le français courant « des étrangers » évite une formulation artificielle tout en conservant la portée du syntagme.
- source_word: חֹמֹתַיִךְ
  choice: tes murailles
  rationale: Le pluriel muni du suffixe féminin singulier renvoie aux murailles de la ville personnifiée ; « murailles » convient mieux que « murs » au cadre urbain.
- source_word: וּמַלְכֵיהֶם
  choice: et leurs rois
  rationale: Rendu direct du syntagme avec suffixe masculin pluriel.
- source_word: יְשָׁרְתוּנֶךְ
  choice: seront à ton service
  rationale: Le piel de שׁרת désigne un service personnel, officiel ou ministériel. Cette formulation française est naturelle et conserve cette nuance ; « te serviront » reste possible.
- source_word: בְקִצְפִּי
  choice: dans ma colère
  rationale: קצף désigne une vive colère ou le courroux. « Colère » est clair, digne et actuel en français.
- source_word: הִכִּיתִיךְ
  choice: je t’ai frappée
  rationale: Le verbe נכה signifie ici « frapper ». L’accord féminin manifeste que la destinataire est la ville personnifiée sans ajouter son nom au texte.
- source_word: וּבִרְצוֹנִי
  choice: mais, dans ma bienveillance
  rationale: רָצוֹן exprime ici la faveur, la bienveillance ou le bon plaisir divin. « Bienveillance » forme un contraste naturel avec la colère.
- source_word: רִחַמְתִּיךְ
  choice: j’ai eu compassion de toi
  rationale: רחם exprime une compassion profonde et miséricordieuse. Le rendu préserve cette dimension affective sans la réduire à la seule notion de pitié.
theological_decisions:
- issue: Identification de la destinataire féminine
  choice: Conserver la deuxième personne féminine sans ajouter « Jérusalem » ou « Sion ».
  alternative: 'Expliciter : « Jérusalem » ou « Sion ».'
  rationale: La morphologie hébraïque indique une destinataire féminine, la ville personnifiée, mais aucun nom propre ne figure dans ce verset. L’accord de « frappée » préserve cette donnée sans explicitation indue.
- issue: Contraste entre jugement et compassion
  choice: « dans ma colère, je t’ai frappée, mais, dans ma bienveillance, j’ai eu compassion de toi »
  alternative: « dans mon courroux… mais dans ma faveur, je t’ai fait miséricorde »
  rationale: Le rendu maintient sans l’atténuer la tension du texte entre l’action divine de jugement et la restauration compatissante.
translation_notes:
  register: Français international moderne, clair et digne. « Rebâtiront » et « murailles » conviennent au contexte de restauration urbaine. La ponctuation met en relief le contraste entre colère et bienveillance, tandis que les accords féminins rendent la personnification présente dans l’hébreu.
