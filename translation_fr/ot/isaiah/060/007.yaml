  text: כָּל צֹ֤אן קֵדָר֙ יִקָּ֣בְצוּ לָ֔/ךְ אֵילֵ֥י נְבָי֖וֹת יְשָׁרְת֑וּ/נֶךְ יַעֲל֤וּ עַל רָצוֹן֙ מִזְבְּחִ֔/י וּ/בֵ֥ית תִּפְאַרְתִּ֖/י אֲפָאֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/060/007.yaml
  text: All the flocks of Kedar will be gathered to you[a]; the rams of Nebaioth will minister to you. They will go up with acceptance on my altar[b], and I will beautify my glorious house.
translation:
  language: fr
  text: Tous les troupeaux de Qédar seront rassemblés auprès de toi ; les béliers de Nebayoth seront à ton service. Ils monteront sur mon autel pour être agréés[a], et j’embellirai la maison de ma gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ils monteront favorablement accueillis sur mon autel. » L’expression hébraïque associe la montée sur l’autel à l’idée d’un accueil favorable.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la maison de ma splendeur » ou « la maison de ma gloire » ; il s’agit du temple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל צֹאן קֵדָר
  choice: Tous les troupeaux de Qédar
  rationale: צֹאן est un collectif désignant le petit bétail, notamment les moutons et les chèvres. « Troupeaux » en conserve l'étendue sans la réduire aux seuls moutons. Le nom propre קֵדָר est transcrit « Qédar » selon l'usage français.
- source_word: יִקָּבְצוּ לָךְ
  choice: se rassembleront auprès de toi
  rationale: Le niphal peut exprimer un sens passif ou réfléchi. Cette formulation française naturelle préserve le mouvement de rassemblement en direction de la destinataire personnifiée.
- source_word: אֵילֵי נְבָיוֹת
  choice: les béliers de Nebayoth
  rationale: Dans le parallélisme avec les troupeaux et dans le contexte de l'autel, אֵילֵי désigne des béliers. נְבָיוֹת est conservé comme nom propre sous la forme française « Nebayoth ».
- source_word: יְשָׁרְתוּנֶךְ
  choice: seront à ton service
  rationale: שרת exprime le service et peut avoir une nuance cultuelle. « Seront à ton service » reste naturel, digne et suffisamment ouvert quant à la manière dont ces animaux servent Sion.
- source_word: יַעֲלוּ עַל רָצוֹן מִזְבְּחִי
  choice: Ils monteront sur mon autel, où ils seront agréés
  rationale: La traduction maintient l'image concrète de la montée sur l'autel portée par עלה, tout en rendant רָצוֹן comme l'accueil favorable des sacrifices. La construction française explicite le rapport syntaxique sans remplacer l'image par le seul verbe « offrir ».
- source_word: וּבֵית תִּפְאַרְתִּי אֲפָאֵר
  choice: et je donnerai de la splendeur à la maison qui fait ma gloire
  rationale: Le jeu entre תִּפְאַרְתִּי et אֲפָאֵר associe gloire, beauté et splendeur. Cette formulation évite la répétition maladroite « glorifier ma maison glorieuse » tout en conservant le lien lexical et le sens causatif du piel.
theological_decisions:
- issue: Référent des suffixes féminins de deuxième personne
  choice: Maintenir l'adresse directe à « toi », qui désigne Sion/Jérusalem personnifiée dans le contexte immédiat
  alternative: Identifier explicitement la destinataire au peuple de Dieu dans un sens plus large
  rationale: Ésaïe 60 s'adresse à Sion/Jérusalem sous les traits d'une femme. Garder simplement « toi » respecte cette personnification et n'impose pas dans le verset une identification théologique plus étroite.
- issue: Portée cultuelle de la montée des animaux sur l'autel
  choice: Faire entendre qu'il s'agit de sacrifices favorablement agréés, sans ajouter le nom « offrandes » au texte principal
  alternative: Comprendre l'ensemble comme une simple image de tribut et de service, sans force sacrificielle explicite
  rationale: Les troupeaux, les béliers, l'autel et רָצוֹן forment une scène nettement sacrificielle. La traduction la rend perceptible tout en conservant les images et les termes du texte hébreu.
translation_notes:
  register: Français international moderne, accessible et soutenu. Les noms propres suivent des formes françaises reconnaissables. La cadence en deux phrases conserve le parallélisme poétique, tandis que « seront à ton service » évite un terme ecclésiastique trop spécialisé. Le jeu lexical final entre splendeur et glorification est rendu de manière idiomatique plutôt que par une répétition artificielle.
