id: ISA.61.9
reference: Isaiah 61:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נוֹדַ֤ע בַּ/גּוֹיִם֙ זַרְעָ֔/ם וְ/צֶאֱצָאֵי/הֶ֖ם בְּ/ת֣וֹךְ הָ/עַמִּ֑ים כָּל רֹֽאֵי/הֶם֙ יַכִּיר֔וּ/ם כִּ֛י הֵ֥ם זֶ֖רַע בֵּרַ֥ךְ יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/009.yaml
  text: Their offspring will be known among the nations[a], and their descendants in the midst of the peoples[b]; all who see them will recognize that they are offspring blessed by Yahweh.
translation:
  language: fr
  text: Leurs descendants seront connus parmi les nations, et leur postérité au milieu des peuples ; tous ceux qui les verront reconnaîtront qu’ils sont une descendance bénie par Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנוֹדַע
  choice: seront connus
  rationale: Le nifal de ידע exprime ici naturellement l’état d’être connu ou reconnu. Le pluriel français s’accorde avec « leurs descendants », collectif hébreu rendu au pluriel.
- source_word: בַּגּוֹיִם
  choice: parmi les nations
  rationale: גּוֹיִם désigne largement les nations. Cette formulation conserve la portée internationale sans imposer une opposition plus étroite entre Juifs et non-Juifs.
- source_word: זַרְעָם
  choice: leurs descendants
  rationale: זֶרַע est un nom collectif pouvant désigner la descendance. « Descendants » est naturel en français moderne et convient au contexte humain.
- source_word: וְצֶאֱצָאֵיהֶם
  choice: leur postérité
  rationale: צֶאֱצָאִים désigne ceux qui sont issus de quelqu’un. « Postérité » maintient le parallélisme avec « descendants » sans répétition lourde.
- source_word: בְּתוֹךְ הָעַמִּים
  choice: au milieu des peuples
  rationale: La traduction garde le sens spatial de בְּתוֹךְ et distingue les « peuples » des « nations » du membre parallèle.
- source_word: כָּל רֹאֵיהֶם
  choice: tous ceux qui les verront
  rationale: La proposition relative rend naturellement le participe hébreu. Le futur s’intègre à la perspective prophétique du verset.
- source_word: יַכִּירוּם
  choice: reconnaîtront
  rationale: Le hifil de נכר signifie reconnaître ou identifier. En français, le complément exprimé dans la proposition introduite par « que » rend inutile la répétition de « les ».
- source_word: כִּי
  choice: que
  rationale: כִּי introduit ici le contenu de ce que les observateurs reconnaîtront.
- source_word: זֶרַע
  choice: une descendance
  rationale: « Descendance » conserve la valeur collective de זֶרַע et le lien lexical avec sa première occurrence, tout en restant idiomatique.
- source_word: בֵּרַךְ
  choice: bénie par
  rationale: La forme exprime ici une descendance ayant reçu la bénédiction de Yahweh. La tournure passive française est concise et fidèle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Nature de la reconnaissance publique
  choice: « reconnaîtront qu’ils sont »
  alternative: « les reconnaîtront comme »
  rationale: La formulation retenue conserve כִּי comme introducteur du contenu reconnu et n’ajoute pas une nuance d’acceptation officielle ou d’appartenance particulière.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est conservé par « nations / peuples » et « descendants / postérité ». Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
