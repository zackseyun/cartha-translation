id: ISA.61.4
reference: Isaiah 61:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָנוּ֙ חָרְב֣וֹת עוֹלָ֔ם שֹׁמְמ֥וֹת רִֽאשֹׁנִ֖ים יְקוֹמֵ֑מוּ וְ/חִדְּשׁוּ֙ עָ֣רֵי חֹ֔רֶב שֹׁמְמ֖וֹת דּ֥וֹר וָ/דֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/004.yaml
  text: They will rebuild the ancient ruins[a]; they will raise up the former desolations; they will renew the ruined cities[b], the desolations of generation after generation.
translation:
  language: fr
  text: Ils rebâtiront les ruines anciennes[a], ils relèveront les lieux dévastés d’autrefois ; ils rénoveront les villes en ruine, dévastées de génération en génération[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ruines d’autrefois ». Le mot hébreu עוֹלָם peut évoquer une époque très reculée ou une longue durée.
    reason: lexical_alternative
  - marker: b
    text: Ou « dévastées depuis de nombreuses générations ». L’hébreu dit littéralement « génération et génération ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ
  choice: ils rebâtiront
  rationale: Le verbe בנה signifie littéralement « bâtir » ; avec pour objet des ruines, « rebâtir » exprime naturellement en français la restauration impliquée par le contexte.
- source_word: חָרְבוֹת עוֹלָם
  choice: les ruines anciennes
  rationale: חָרְבוֹת désigne des ruines ou lieux dévastés, et עוֹלָם évoque ici une antiquité ou une longue durée plutôt qu’une éternité métaphysique.
- source_word: שֹׁמְמוֹת רִאשֹׁנִים
  choice: les lieux dévastés d’autrefois
  rationale: 'שֹׁמְמוֹת peut désigner des lieux dévastés, tandis que רִאשֹׁנִים a ici une valeur temporelle : ce qui remonte aux temps passés.'
- source_word: יְקוֹמֵמוּ
  choice: ils relèveront
  rationale: La forme intensive de קום exprime l’action de remettre debout ; « relever » conserve cette image concrète tout en évoquant la restauration.
- source_word: וְחִדְּשׁוּ
  choice: ils rénoveront
  rationale: חדשׁ signifie rendre neuf ou renouveler. Appliqué à des villes, « rénover » est naturel et maintient la nuance propre de ce troisième verbe de restauration.
- source_word: עָרֵי חֹרֶב
  choice: les villes en ruine
  rationale: Le groupe construit désigne des villes caractérisées par la dévastation ; « villes en ruine » est idiomatique et précis en français moderne.
- source_word: שֹׁמְמוֹת דּוֹר וָדוֹר
  choice: dévastées de génération en génération
  rationale: La tournure דּוֹר וָדוֹר exprime la succession des générations. Le participe féminin pluriel rattache clairement la dévastation aux villes.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme des trois verbes est conservé par « rebâtiront », « relèveront » et « rénoveront », sans uniformiser leurs nuances.
