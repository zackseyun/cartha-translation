  terminology: « Ruines anciennes », « lieux dévastés d’autrefois » et « villes en ruine » correspondent adéquatement aux groupes nominaux hébreux. « Rénover » est un emploi recevable pour des villes et exprime utilement la nuance de חדשׁ, distincte de « relever ». Les notes signalent correctement les principales alternatives lexicales de עוֹלָם et de la formule « génération et génération ».
