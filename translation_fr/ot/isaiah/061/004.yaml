  source_fidelity: 'Le texte rend fidèlement la progression des trois actions de restauration : bâtir/rebâtir les ruines anciennes, relever les désolations antérieures, puis renouveler les villes ruinées. « De génération en génération » restitue bien la valeur distributive de דּוֹר וָדוֹר sans trancher excessivement entre une durée continue et des générations successives.'
