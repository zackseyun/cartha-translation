  text: לִ/קְרֹ֤א שְׁנַת רָצוֹן֙ לַֽ/יהוָ֔ה וְ/י֥וֹם נָקָ֖ם לֵ/אלֹהֵ֑י/נוּ לְ/נַחֵ֖ם כָּל אֲבֵלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/002.yaml
  text: to proclaim the year of Yahweh’s favor and the day of vengeance of our God[a], to comfort all who mourn[b],
translation:
  language: fr
  text: pour proclamer l’année de faveur de Yahweh[a] et le jour de la vengeance de notre Dieu, pour consoler tous ceux qui sont en deuil[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’année favorable de Yahweh ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tous les endeuillés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: pour proclamer
  rationale: L’infinitif exprime ici la mission du personnage et désigne une annonce publique et solennelle.
- source_word: שְׁנַת רָצוֹן
  choice: l’année de la faveur
  rationale: רָצוֹן évoque ici l’accueil favorable ou la bienveillance divine. « Faveur » est naturel en français moderne et conserve le lien avec Yahweh.
- source_word: לַיהוָה
  choice: de Yahweh
  rationale: Dans cette construction, ל marque la relation entre l’année de faveur et Yahweh. Le nom divin יהוה est rendu par « Yahweh ».
- source_word: וְיוֹם נָקָם
  choice: et le jour de la vengeance
  rationale: « Vengeance » conserve la force de נָקָם, qui désigne la rétribution divine, tandis que l’article défini maintient le parallélisme avec « l’année ».
- source_word: לֵאלֹהֵינוּ
  choice: de notre Dieu
  rationale: La formulation française exprime naturellement la relation entre le jour de vengeance et « notre Dieu », tout en gardant le possessif collectif.
- source_word: לְנַחֵם
  choice: pour consoler
  rationale: Le second infinitif poursuit l’énoncé de la mission. « Consoler » rend clairement l’action de נחם envers les personnes endeuillées.
- source_word: כָּל אֲבֵלִים
  choice: tous ceux qui sont en deuil
  rationale: Cette tournure rend le pluriel hébreu de manière inclusive et idiomatique, sans limiter le groupe aux hommes.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le nom propre divin. « Yahweh » le préserve plutôt que de le remplacer par un titre.
- issue: Tension entre faveur et vengeance
  choice: Conserver côte à côte « l’année de la faveur » et « le jour de la vengeance »
  alternative: Atténuer « vengeance » en « jugement »
  rationale: Le verset juxtapose délibérément grâce et rétribution divine. La traduction ne réduit ni ne résout cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre « l’année » et « le jour » ainsi que le contraste entre faveur et vengeance sont maintenus. La ponctuation finale conserve la continuité syntaxique probable avec le verset suivant.
