source:
  edition: WLC
  text: כִּ֣י אֲנִ֤י יְהוָה֙ אֹהֵ֣ב מִשְׁפָּ֔ט שֹׂנֵ֥א גָזֵ֖ל בְּ/עוֹלָ֑ה וְ/נָתַתִּ֤י פְעֻלָּתָ/ם֙ בֶּ/אֱמֶ֔ת וּ/בְרִ֥ית עוֹלָ֖ם אֶכְר֥וֹת לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/008.yaml
  text: For I[a], Yahweh, love justice; I hate robbery with burnt offering. And I will give them their recompense in faithfulness[c][b], and I will cut an everlasting covenant with them.
translation:
  language: fr
  text: Car moi, Yahvé, j’aime le droit ; je déteste le vol associé à un holocauste[a]. Je leur donnerai fidèlement leur récompense[b], et je conclurai[c] avec eux une alliance éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. On peut aussi comprendre : « le vol dans un holocauste » ou « le vol destiné à un holocauste ». Elle peut évoquer des biens volés apportés en offrande, ou plus largement l’association de l’injustice au culte.'
    reason: alternative_reading
  - marker: b
    text: Ou « leur salaire » ou « leur rétribution ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « je couperai une alliance », expression hébraïque qui signifie établir ou conclure une alliance.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Translittération française courante du nom divin, qui en préserve la valeur personnelle et liée à l’alliance.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans le contraste éthique avec le vol, le terme désigne ce qui est juste et l’ordre fondé sur la justice ; « le droit » est idiomatique en français dans l’expression « aimer le droit ».
- source_word: גָזֵל
  choice: le vol
  rationale: Le nom désigne un bien obtenu par saisie injuste ou l’acte même de voler ; « le vol » est ici concis et naturel.
- source_word: בְּעוֹלָה
  choice: associé à un holocauste
  rationale: Le texte massorétique rattache le vol à un holocauste, mais la valeur précise de la préposition reste incertaine. « associé à » conserve ce lien sans décider s’il s’agit d’un vol commis dans, pour ou au moyen d’une offrande.
- source_word: פְעֻלָּתָם
  choice: leur rétribution
  rationale: Le mot peut désigner le salaire ou la récompense correspondant à une œuvre. Dans cette promesse, « rétribution » exprime ce qui leur sera accordé comme dû sans préciser indûment sa forme.
- source_word: בֶּאֱמֶת
  choice: fidèlement
  rationale: Employé comme complément de la manière dont Dieu donnera, le terme exprime sa vérité et sa fiabilité ; l’adverbe donne un français naturel tout en gardant la portée relationnelle.
- source_word: בְרִית עוֹלָם
  choice: une alliance éternelle
  rationale: Formulation française établie qui rend la durée indéfinie et permanente de l’alliance.
- source_word: אֶכְרֹת
  choice: je conclurai
  rationale: Le verbe signifie littéralement « couper » dans l’expression hébraïque consacrée pour établir une alliance. « Conclure une alliance » est l’équivalent idiomatique naturel en français, avec le sens littéral signalé en note.
theological_decisions:
- issue: Interprétation de גָזֵל בְּעוֹלָה
  choice: le vol associé à un holocauste
  alternative: le vol dans un holocauste ; le vol destiné à un holocauste ; selon une autre compréhension textuelle, le vol accompagné d’injustice
  rationale: La construction hébraïque est très condensée et le rapport indiqué par בְּ n’est pas univoque. Le texte principal maintient le lien explicite du texte massorétique entre le vol et l’holocauste, donc la tension prophétique entre injustice et culte, sans préciser au-delà du texte la nature exacte de ce lien.
- issue: Valeur de פְעֻלָּתָם
  choice: leur rétribution
  alternative: leur récompense ; leur salaire ; leur œuvre
  rationale: Le contexte de restauration et d’alliance favorise ce que Dieu leur accorde en retour. « Rétribution » préserve l’idée de ce qui est dû tout en évitant de réduire le mot soit au travail lui-même, soit à une récompense comprise de façon trop étroite.
- issue: Expression כרת ברית
  choice: je conclurai avec eux une alliance
  alternative: je couperai avec eux une alliance
  rationale: La traduction littérale serait opaque et peu naturelle pour la plupart des lecteurs francophones. L’équivalent idiomatique français est placé dans le texte, tandis que l’image hébraïque est conservée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La ponctuation met en relief l’auto-identification divine sans alourdir la phrase. Le rendu reste proche de la structure hébraïque, mais emploie les collocations françaises naturelles « aimer le droit » et « conclure une alliance ». L’ambiguïté de בְּעוֹלָה est maintenue dans le texte et explicitée en note.
