source:
  edition: WLC
  text: כִּ֤י כָ/אָ֨רֶץ֙ תּוֹצִ֣יא צִמְחָ֔/הּ וּ/כְ/גַנָּ֖ה זֵרוּעֶ֣י/הָ תַצְמִ֑יחַ כֵּ֣ן אֲדֹנָ֣/י יְהוִ֗ה יַצְמִ֤יחַ צְדָקָה֙ וּ/תְהִלָּ֔ה נֶ֖גֶד כָּל הַ/גּוֹיִֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/011.yaml
  text: For as the earth brings forth its growth[a], and as a garden causes what is sown in it to spring up, so the Lord GOD will cause righteousness and praise to spring up before all the nations.
translation:
  language: fr
  text: Car, comme la terre fait sortir ses pousses, comme un jardin fait germer ce qui y est semé, ainsi le Seigneur Yahweh fera germer la justice[a] et la louange devant toutes les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ». Le terme hébreu peut aussi évoquer le droit rétabli ou la justification publique.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָאָרֶץ
  choice: la terre
  rationale: Dans cette comparaison agricole de portée générale, « la terre » convient mieux que « le pays ».
- source_word: תּוֹצִיא צִמְחָהּ
  choice: fait sortir ses pousses
  rationale: Cette formulation conserve la valeur causative du verbe et l’image concrète de ce qui émerge du sol.
- source_word: וּכְגַנָּה זֵרוּעֶיהָ תַצְמִיחַ
  choice: et qu’un jardin fait germer ce qui y a été semé
  rationale: « Ce qui y a été semé » rend naturellement la forme hébraïque désignant les choses semées, tandis que « fait germer » préserve la valeur causative.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire la répétition artificielle « Seigneur SEIGNEUR ».
- source_word: יַצְמִיחַ
  choice: fera germer
  rationale: Reprend le vocabulaire agricole de la comparaison et maintient la valeur causative du verbe.
- source_word: צְדָקָה
  choice: la justice
  rationale: Dans ce contexte de restauration publique devant les nations, « justice » exprime naturellement la rectitude, le droit rétabli et la possible nuance de justification publique, sans épuiser le champ sémantique.
- source_word: וּתְהִלָּה
  choice: et la louange
  rationale: Le terme désigne naturellement la louange suscitée par l’action salvatrice de Dieu.
- source_word: נֶגֶד כָּל הַגּוֹיִם
  choice: devant toutes les nations
  rationale: Rend directement l’idée d’une manifestation publique en présence de l’ensemble des nations.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: La traduction conserve à la fois le titre « Seigneur » et le nom propre divin, ce qui évite de confondre les deux éléments hébreux.
- issue: Portée de צְדָקָה dans la promesse de restauration
  choice: la justice
  alternative: la droiture
  rationale: Le contexte met en avant une réalité que Dieu fera apparaître publiquement devant les nations. « Justice » convient à cette dimension de droit rétabli et de justification publique; « droiture » demeure une possibilité lexicale et théologique réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « fait/fera germer » maintient le lien rhétorique entre l’image agricole et l’action promise de Dieu; « pousses » garde une image concrète sans limiter le sens à une seule plante.
