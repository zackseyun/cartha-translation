review_pass:
  verdict: revise
  source_fidelity: 'La traduction conserve correctement le contraste entre la honte et la double part, ainsi que le changement du « votre » initial au « ils/leur » du texte massorétique. Toutefois, « vous recevrez » introduit un verbe et rétablit explicitement la deuxième personne dans la première proposition, alors que l’hébreu présente ici une formule elliptique (« au lieu de votre honte : une double part »). Il est préférable de conserver cette ellipse sans la résoudre. « Dans leur pays » rend naturellement בְּאַרְצָם en français moderne.'
  naturalness: La révision proposée demeure fluide et digne en français international moderne. « Déshonneur » est plus directement parallèle à « honte » et correspond bien à כְּלִמָּה. La construction elliptique initiale est acceptable dans le registre poétique et prophétique.
  terminology: « Double part » reproduit avec cohérence les deux occurrences de מִשְׁנֶה. « Pousseront des cris de joie » rend l’intensité vocale de יָרֹנּוּ. « Posséderont » est une option recevable pour יִירָשׁוּ, dont la note conserve la possibilité d’« hériter ».
  issues:
