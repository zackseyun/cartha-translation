revisions:
- from: Au lieu de votre honte, vous recevrez une double part[a] ; au lieu de l’humiliation, ils crieront de joie pour la part qui leur revient[b]. C’est pourquoi, dans leur terre, ils posséderont une double part[c] ; une joie éternelle leur appartiendra.
  to: Au lieu de votre honte, une double part ; au lieu du déshonneur, ils pousseront des cris de joie pour leur part[b]. C’est pourquoi, dans leur pays, ils posséderont une double part[c] ; une joie éternelle leur appartiendra.
  rationale: 'La première proposition est rendue de façon elliptique afin de ne pas introduire « vous recevrez », absent de l’hébreu, et de maintenir le changement de personne du texte massorétique. La note a sur ce changement n’est plus nécessaire : la traduction le montre directement et sans harmonisation. « Déshonneur » et « pays » améliorent respectivement la précision lexicale et l’idiomaticité française.'
