id: ISA.61.7
reference: Isaiah 61:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תַּ֤חַת בָּשְׁתְּ/כֶם֙ מִשְׁנֶ֔ה וּ/כְלִמָּ֖ה יָרֹ֣נּוּ חֶלְקָ֑/ם לָ/כֵ֤ן בְּ/אַרְצָ/ם֙ מִשְׁנֶ֣ה יִירָ֔שׁוּ שִׂמְחַ֥ת עוֹלָ֖ם תִּֽהְיֶ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/007.yaml
  text: Instead of your shame[a], there will be a double portion; and instead of disgrace, they will shout for joy over their portion. Therefore in their land they will possess a double portion[c][b]; everlasting joy will be theirs.
translation:
  language: fr
  text: Au lieu de votre honte, une double part ; au lieu du déshonneur, ils pousseront des cris de joie pour leur part[b]. C’est pourquoi, dans leur pays, ils posséderont une double part[c] ; une joie éternelle leur appartiendra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « ils chanteront de joie pour leur part ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils recevront en héritage une double part ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: au lieu de
  rationale: Dans ce contexte, la préposition exprime un échange ou un renversement, non une position spatiale.
- source_word: בָּשְׁתְּכֶם
  choice: votre honte
  rationale: Le suffixe de deuxième personne du pluriel est conservé, et « honte » rend directement le déshonneur subi.
- source_word: מִשְׁנֶה
  choice: une double part
  rationale: Le nom désigne une quantité ou une part double, avec une résonance possible d’héritage et de restauration.
- source_word: וּכְלִמָּה
  choice: au lieu de l’humiliation
  rationale: Le terme évoque le déshonneur public. « Humiliation » le distingue de בֹּשֶׁת tout en maintenant le parallélisme.
- source_word: יָרֹנּוּ
  choice: ils crieront de joie
  rationale: Le verbe רנן désigne une expression sonore et vive de joie, plus forte qu’un simple « se réjouir ».
- source_word: חֶלְקָם
  choice: la part qui leur revient
  rationale: Cette formulation française naturelle rend le nom « part, portion » avec le suffixe de troisième personne du pluriel.
- source_word: לָכֵן
  choice: c’est pourquoi
  rationale: Le connecteur présente la conséquence du renversement annoncé.
- source_word: בְּאַרְצָם
  choice: dans leur terre
  rationale: « Terre » conserve à la fois le sens territorial et la résonance du retour dans le pays du peuple.
- source_word: יִירָשׁוּ
  choice: ils posséderont
  rationale: ירשׁ peut signifier hériter ou prendre possession. « Posséderont » convient ici puisque l’objet exprimé est la double part.
- source_word: שִׂמְחַת עוֹלָם
  choice: une joie éternelle
  rationale: La formule désigne une joie durable, sans fin, dans un registre digne et naturel.
- source_word: תִּהְיֶה לָהֶם
  choice: leur appartiendra
  rationale: Cette tournure idiomatique exprime naturellement en français la possession promise par la construction hébraïque.
theological_decisions:
- issue: Passage de la deuxième personne (« votre honte ») à la troisième personne du pluriel (« leur part », « leur terre », « ils posséderont »)
  choice: Conserver le changement de personne du texte massorétique
  alternative: 'Harmoniser tout le verset à la deuxième personne : « votre part… votre terre… vous posséderez »'
  rationale: Le changement est réellement présent dans le texte hébreu. Le conserver évite de résoudre silencieusement une difficulté textuelle ou rhétorique.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du verset et le changement abrupt de personne sont maintenus. « Double part » préserve le motif de restauration et la possible nuance d’héritage.
