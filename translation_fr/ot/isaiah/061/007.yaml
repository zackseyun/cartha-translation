    issue: Ajout de « vous recevrez » dans la première proposition.
    rationale: Le texte hébreu ne contient pas de verbe correspondant ni de pronom de deuxième personne comme bénéficiaire de la double part. Cet ajout lisse la rupture de personnes que la note entend précisément signaler. Une formulation elliptique préserve mieux la syntaxe et l’ambiguïté du texte source.
  - severity: low
    issue: « Dans leur terre » est moins idiomatique en français moderne que « dans leur pays ».
    rationale: « Pays » exprime naturellement ici le sens territorial de אֶרֶץ sans perte significative du sens contextuel.
  revised_text: Au lieu de votre honte, une double part ; au lieu du déshonneur, ils pousseront des cris de joie pour leur part[b]. C’est pourquoi, dans leur pays, ils posséderont une double part[c] ; une joie éternelle leur appartiendra.
  revised_footnotes:
