source:
  edition: WLC
  text: וְ/אַתֶּ֗ם כֹּהֲנֵ֤י יְהוָה֙ תִּקָּרֵ֔אוּ מְשָׁרְתֵ֣י אֱלֹהֵ֔י/נוּ יֵאָמֵ֖ר לָ/כֶ֑ם חֵ֤יל גּוֹיִם֙ תֹּאכֵ֔לוּ וּ/בִ/כְבוֹדָ֖/ם תִּתְיַמָּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/006.yaml
  text: But you will be called the priests of Yahweh; they will say of you, "Ministers of our God." You will eat the wealth of nations[a], and in their glory you will boast.
translation:
  language: fr
  text: 'Mais vous, on vous appellera « prêtres de Yahweh » ; on dira de vous : « Serviteurs de notre Dieu. » Vous mangerez les richesses des nations et vous vous glorifierez de leur gloire[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous exulterez dans leur splendeur ». Le dernier verbe est rare, et son sens précis est discuté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֵי יְהוָה
  choice: prêtres de Yahweh
  rationale: Rend directement la construction hébraïque et conserve le vocabulaire sacerdotal ainsi que le nom divin.
- source_word: מְשָׁרְתֵי אֱלֹהֵינוּ
  choice: Serviteurs de notre Dieu
  rationale: « Serviteurs » exprime ici un service officiel, vraisemblablement cultuel, sans évoquer à tort la fonction ecclésiastique moderne de « ministre ».
- source_word: יֵאָמֵר לָכֶם
  choice: on dira de vous
  rationale: Le singulier impersonnel hébreu se rend naturellement par « on » ; « de vous » exprime la désignation publique suggérée par le contexte et maintient le parallélisme avec « on vous appellera ».
- source_word: חֵיל גּוֹיִם
  choice: les richesses des nations
  rationale: Dans ce contexte, חֵיל désigne surtout les biens ou ressources des nations, tout en pouvant ailleurs évoquer leur puissance.
- source_word: תֹּאכֵלוּ
  choice: vous vous nourrirez
  rationale: 'Préserve l''image concrète de l''action de manger tout en donnant en français son sens contextuel : vivre des richesses des nations.'
- source_word: וּבִכְבוֹדָם
  choice: de leur gloire
  rationale: « Gloire » garde l'étendue sémantique de כבוד, qui peut aussi signifier honneur, splendeur ou prestige.
- source_word: תִּתְיַמָּרוּ
  choice: vous vous glorifierez
  rationale: Le verbe rare semble exprimer l'idée de se glorifier ou de tirer fierté ; la formulation française s'accorde naturellement avec « de leur gloire » tout en laissant une variante en note.
theological_decisions:
- issue: Maintien de l'identité sacerdotale des destinataires
  choice: Conserver la désignation explicite « prêtres de Yahweh » et le langage du service de Dieu.
  alternative: Généraliser en parlant seulement de service spirituel.
  rationale: Le texte hébreu emploie expressément des termes sacerdotaux et cultuels ; la traduction ne doit ni les effacer ni les transférer explicitement à une institution ultérieure.
- issue: Rapport des destinataires aux richesses et à la gloire des nations
  choice: Conserver les images fortes de nourriture et de glorification.
  alternative: Paraphraser comme une simple participation à la prospérité des nations.
  rationale: Le parallélisme prophétique associe matériellement חֵיל et כבוד ; une traduction plus abstraite résoudrait indûment la tension du texte.
translation_notes:
  register: Français international moderne, digne et lisible. Le double emploi de « on » rend naturellement les formes passives ou impersonnelles de l’hébreu. Les guillemets signalent la désignation formulée comme parole rapportée.
