source:
  edition: WLC
  text: לָ/שׂ֣וּם לַ/אֲבֵלֵ֣י צִיּ֗וֹן לָ/תֵת֩ לָ/הֶ֨ם פְּאֵ֜ר תַּ֣חַת אֵ֗פֶר שֶׁ֤מֶן שָׂשׂוֹן֙ תַּ֣חַת אֵ֔בֶל מַעֲטֵ֣ה תְהִלָּ֔ה תַּ֖חַת ר֣וּחַ כֵּהָ֑ה וְ/קֹרָ֤א לָ/הֶם֙ אֵילֵ֣י הַ/צֶּ֔דֶק מַטַּ֥ע יְהוָ֖ה לְ/הִתְפָּאֵֽר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/003.yaml
  text: to appoint for the mourners of Zion[a], to give them a headdress instead of ashes, oil of gladness instead of mourning, a garment of praise instead of a faint spirit; and they will be called oaks of righteousness, the planting of Yahweh[d][c][b], that he may display his glory.
translation:
  language: fr
  text: pour accorder aux endeuillés de Sion une parure[a] au lieu de la cendre, l’huile de joie au lieu du deuil, un vêtement de louange au lieu d’un esprit défaillant. On les appellera « térébinthes[b] de justice[c] », plantation de Yahvé, afin qu’il manifeste sa splendeur[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une coiffure de fête ». Le mot hébreu peut désigner un ornement porté sur la tête; l’image évoque probablement une coiffure festive remplaçant la cendre du deuil.
    reason: lexical_alternative
  - marker: b
    text: Ou « grands arbres », voire « chênes ». Le terme hébreu désigne ici des arbres imposants, mais l’espèce exacte n’est pas certaine.
    reason: lexical_alternative
  - marker: c
    text: Ou « de droiture ». Le mot hébreu peut désigner aussi bien la justice que la rectitude morale.
    reason: alternative_reading
  - marker: d
    text: Ou « afin qu’il soit glorifié ». La forme hébraïque peut exprimer la manifestation de la splendeur de Yahvé ou sa glorification au moyen de cette plantation.
    reason: alternative_reading
lexical_decisions:
- source_word: לָשׂוּם לַאֲבֵלֵי צִיּוֹן
  choice: pour accorder aux endeuillés de Sion
  rationale: לָשׂוּם exprime ici l’action de disposer ou d’accorder quelque chose en faveur des endeuillés. Cette formulation française reste naturelle et rattache clairement les dons qui suivent à leurs bénéficiaires.
- source_word: פְּאֵר
  choice: une parure
  rationale: Le nom désigne un ornement, probablement une coiffure de fête. « Parure » conserve la dimension festive sans imposer une forme précise, tout en faisant contraste avec la cendre du deuil.
- source_word: תַּחַת אֵפֶר
  choice: au lieu de la cendre
  rationale: תַּחַת marque la substitution. Le singulier collectif « la cendre » correspond à l’usage français pour le signe rituel du deuil.
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: l’huile de joie
  rationale: L’expression évoque l’huile d’onction associée à la fête et à la réjouissance. « Joie » est direct, actuel et poétique.
- source_word: מַעֲטֵה תְהִלָּה
  choice: un vêtement de louange
  rationale: מַעֲטֵה désigne ce qui enveloppe, notamment un manteau ou vêtement extérieur. « Vêtement » préserve l’image sans employer un terme trop spécialisé.
- source_word: רוּחַ כֵּהָה
  choice: un esprit défaillant
  rationale: כֵּהָה évoque ce qui s’est affaibli, obscurci ou émoussé. « Défaillant » rend l’épuisement intérieur sans le réduire à une catégorie psychologique moderne.
- source_word: וְקֹרָא לָהֶם
  choice: On les appellera
  rationale: Le verbe masculin singulier peut avoir ici une valeur indéfinie proche du passif. La tournure française évite d’ajouter un sujet non exprimé.
- source_word: אֵילֵי הַצֶּדֶק
  choice: térébinthes de justice
  rationale: Dans le contexte de la plantation, אֵילֵי désigne de grands arbres robustes, probablement des térébinthes. Le choix conserve l’image végétale et la force poétique de l’hébreu.
- source_word: מַטַּע יְהוָה
  choice: plantation de Yahvé
  rationale: Le groupe nominal présente le peuple restauré comme ce que Yahvé a planté. La construction concise conserve la métaphore collective et la forme hébraïque.
- source_word: לְהִתְפָּאֵר
  choice: afin qu’il manifeste sa splendeur
  rationale: Le hitpael peut exprimer le fait de se parer de gloire ou de manifester sa gloire. La traduction retient ici l’idée que Yahvé donne à voir sa splendeur par cette plantation.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahvé » représente le nom propre dans une forme française largement intelligible, sans le remplacer par un titre.
- issue: Portée de לְהִתְפָּאֵר
  choice: afin qu’il manifeste sa splendeur
  alternative: afin qu’il soit glorifié
  rationale: La forme verbale permet une nuance réfléchie ou déclarative. Le texte principal garde Yahvé comme agent de la manifestation de sa splendeur, tandis que la lecture passive, théologiquement possible, est signalée en note.
- issue: Valeur de הַצֶּדֶק
  choice: justice
  alternative: droiture
  rationale: צֶדֶק couvre à la fois la justice, la droiture et la conformité à ce qui est juste. « Justice » conserve en français cette portée relationnelle et publique; « droiture » souligne davantage la qualité morale.
translation_notes:
  register: Français international moderne, poétique et digne. La triple structure « au lieu de » est maintenue. « Endeuillés » est concis et naturel; « térébinthes » garde la couleur botanique du texte, avec des équivalents plus généraux en note.
