  text: שׂ֧וֹשׂ אָשִׂ֣ישׂ בַּֽ/יהוָ֗ה תָּגֵ֤ל נַפְשִׁ/י֙ בֵּֽ/אלֹהַ֔/י כִּ֤י הִלְבִּישַׁ֨/נִי֙ בִּגְדֵי יֶ֔שַׁע מְעִ֥יל צְדָקָ֖ה יְעָטָ֑/נִי כֶּֽ/חָתָן֙ יְכַהֵ֣ן פְּאֵ֔ר וְ/כַ/כַּלָּ֖ה תַּעְדֶּ֥ה כֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/010.yaml
  text: I will greatly rejoice in Yahweh[a]; my soul will exult in my God, for he has clothed me with garments of salvation; he has wrapped me in a robe of righteousness, like a bridegroom who adorns himself with a priestly headdress[b], and like a bride who decks herself with her jewelry.
translation:
  language: fr
  text: Je me réjouirai pleinement en Yahweh[a] ; mon âme exultera en mon Dieu, car il m’a revêtu des vêtements du salut, il m’a enveloppé du manteau de la justice[b], comme un jeune marié qui se pare d’un turban sacerdotal[c], et comme une jeune mariée qui se pare de ses bijoux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est le nom personnel de Dieu représenté en hébreu par les quatre consonnes YHWH.
    reason: divine_name
  - marker: b
    text: 'Ou : « du manteau de la droiture ».'
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu est difficile. On peut aussi comprendre : « qui se pare d’un turban d’apparat » ; la forme verbale semble toutefois évoquer la manière dont un prêtre se pare.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: שׂוֹשׂ אָשִׂישׂ
  choice: Je me réjouirai pleinement
  rationale: L’infinitif absolu suivi de l’imparfait intensifie le verbe. « Pleinement » restitue cette insistance dans un français naturel sans reproduire mécaniquement la répétition hébraïque.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב indique ici l’objet ou la sphère de la joie. Le nom divin est translittéré afin de rendre explicitement le tétragramme.
- source_word: תָּגֵל נַפְשִׁי
  choice: mon être exultera
  rationale: גיל exprime une joie vive. נֶפֶשׁ désigne ici la personne intérieure, voire la personne tout entière; « mon être » est plus naturel en français moderne que le calque « mon âme » tout en gardant la portée personnelle de l’expression.
- source_word: הִלְבִּישַׁנִי בִּגְדֵי יֶשַׁע
  choice: il m’a revêtu des vêtements du salut
  rationale: Le parfait décrit un acte accompli dont le locuteur célèbre le résultat. « Revêtir » maintient l’image vestimentaire solennelle, et « salut » conserve l’étendue théologique de יֶשַׁע.
- source_word: מְעִיל צְדָקָה יְעָטָנִי
  choice: il m’a enveloppé du manteau de la justice
  rationale: מְעִיל est un vêtement extérieur, ici rendu par « manteau ». יעט évoque l’action d’envelopper. צְדָקָה peut désigner la justice ou la droiture; « justice » convient au français courant tout en laissant l’autre nuance en note.
- source_word: כֶּחָתָן יְכַהֵן פְּאֵר
  choice: comme un jeune marié qui se pare d’une coiffure sacerdotale
  rationale: Le verbe rare dérivé de כהן paraît évoquer la manière dont un prêtre se coiffe ou se pare. La formulation conserve à la fois l’image nuptiale et l’allusion sacerdotale sans prétendre éliminer l’incertitude lexicale.
- source_word: וְכַכַּלָּה תַּעְדֶּה כֵלֶיהָ
  choice: et comme une jeune mariée qui se pare de ses bijoux
  rationale: עדה signifie se parer, et כֵלִים désigne ici les objets ornementaux de la mariée. « Bijoux » est clair et naturel en français contemporain.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » rend visible le nom personnel tout en évitant de le remplacer par un titre.
- issue: Nuance de צְדָקָה dans la métaphore vestimentaire
  choice: justice
  alternative: droiture
  rationale: Le mot hébreu couvre des idées de justice, de droiture et de conformité à ce qui est juste. « Justice » conserve sa portée relationnelle et publique; la note signale « droiture » afin de ne pas réduire l’ambiguïté.
- issue: Portée sacerdotale de יְכַהֵן פְּאֵר
  choice: une coiffure sacerdotale
  alternative: un turban d’apparat
  rationale: La forme verbale, apparentée au vocabulaire du prêtre, favorise une allusion sacerdotale, mais la construction est rare et discutée. Le texte retient cette lecture probable et la note présente une traduction moins interprétative.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme et la métaphore vestimentaire sont conservés. « Jeune marié » et « jeune mariée » sont préférés à « époux » et « épouse » pour rendre sans ambiguïté le cadre nuptial, tandis que « exultera » maintient l’intensité poétique du second membre.
