  yaml_path: translation/ot/isaiah/061/005.yaml
  text: Foreigners will stand and shepherd your flocks[b][a], and foreigners' sons will be your farmers and your vinedressers.
translation:
  language: fr
  text: Des étrangers se tiendront et feront paître vos troupeaux[a] ; des fils d’étrangers[b] seront vos cultivateurs et vos vignerons.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prendront soin de votre petit bétail ». Le terme hébreu peut englober les moutons et les chèvres.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « fils d’étrangers » ; expression désignant des personnes issues de peuples étrangers.
    reason: cultural_note
lexical_decisions:
- source_word: זָרִים
  choice: des étrangers
  rationale: Le terme désigne ici des personnes étrangères au peuple auquel le prophète s’adresse. « Étrangers » est naturel en français moderne et maintient le parallèle avec « fils d’étrangers ».
- source_word: וְעָמְדוּ
  choice: se tiendront là
  rationale: Le verbe signifie littéralement « se tenir, être debout ». L’ajout idiomatique de « là » conserve cette image tout en donnant une formulation française naturelle, sans expliciter davantage la disponibilité au service.
- source_word: וְרָעוּ
  choice: feront paître
  rationale: Le verbe רעה exprime l’action de mener le petit bétail au pâturage ou d’en prendre soin. « Faire paître » convient directement à « troupeaux » et préserve l’image pastorale.
- source_word: צֹאנְכֶם
  choice: vos troupeaux
  rationale: Ce nom collectif désigne le petit bétail, surtout les moutons et les chèvres. « Troupeaux » rend naturellement le collectif sans le limiter aux seuls moutons.
- source_word: בְנֵי נֵכָר
  choice: des fils d’étrangers
  rationale: La traduction formelle conserve la construction hébraïque et son parallélisme. Dans ce contexte, l’expression peut désigner plus largement des gens issus de peuples étrangers, ce qu’indique la note.
- source_word: אִכָּרֵיכֶם
  choice: vos cultivateurs
  rationale: Le nom désigne ceux qui travaillent la terre. « Cultivateurs » est précis, actuel et plus large que « laboureurs », qui mettrait l’accent sur une seule tâche.
- source_word: כֹרְמֵיכֶם
  choice: vos vignerons
  rationale: Le terme désigne ceux qui cultivent et entretiennent les vignes. « Vignerons » est le terme français courant et précis.
theological_decisions:
- issue: Le renversement des rôles sociaux dans l’oracle de restauration de Sion
  choice: Le verset décrit des étrangers accomplissant des travaux pastoraux et agricoles au service de la communauté restaurée.
  alternative: Y voir principalement une image générale de coopération entre les nations ou une simple métaphore de l’abondance.
  rationale: L’hébreu présente explicitement des étrangers dans ces fonctions. La traduction conserve cette asymétrie sociale et l’imagerie propre à l’oracle, sans lui imposer une réinterprétation ecclésiologique ni en tirer une affirmation doctrinale dépassant le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule fait ressortir les deux membres parallèles. « Se tiendront là » maintient l’image concrète du verbe hébreu sans alourdir la phrase ; « fils d’étrangers » conserve volontairement l’expression source, éclairée par une note.
