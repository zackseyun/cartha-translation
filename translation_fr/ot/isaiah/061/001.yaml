id: ISA.61.1
reference: Isaiah 61:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ר֛וּחַ אֲדֹנָ֥/י יְהוִ֖ה עָלָ֑/י יַ֡עַן מָשַׁח֩ יְהוָ֨ה אֹתִ֜/י לְ/בַשֵּׂ֣ר עֲנָוִ֗ים שְׁלָחַ֨/נִי֙ לַ/חֲבֹ֣שׁ לְ/נִשְׁבְּרֵי לֵ֔ב לִ/קְרֹ֤א לִ/שְׁבוּיִם֙ דְּר֔וֹר וְ/לַ/אֲסוּרִ֖ים פְּקַח קֽוֹחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/061/001.yaml
  text: The Spirit of the Lord GOD is upon me[a], because Yahweh has anointed me to bring good news to the humble; he has sent me to bind up the brokenhearted[b], to proclaim liberty to the captives and opening of the prison to the bound.
translation:
  language: fr
  text: L’Esprit du Seigneur Yahweh est sur moi, car Yahweh m’a oint pour annoncer une bonne nouvelle aux humbles[a]. Il m’a envoyé pour panser ceux qui ont le cœur brisé, pour proclamer la liberté aux captifs et l’ouverture pour ceux qui sont enchaînés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux pauvres » ou « aux affligés » ; le mot hébreu peut désigner les humbles, les démunis ou les personnes éprouvées.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque est difficile. On peut aussi comprendre « l’ouverture des yeux pour ceux qui sont enchaînés » ou, plus généralement, « la délivrance de ceux qui sont enchaînés ».
    reason: alternative_reading
lexical_decisions:
- source_word: רוּחַ
  choice: L’Esprit
  rationale: Dans ce contexte de mission prophétique et avec le titre divin, le mot désigne l’Esprit de Dieu plutôt qu’un vent ou un simple souffle.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Cette formulation conserve les deux éléments du titre hébreu et rend explicitement le nom divin.
- source_word: עָלַי
  choice: est sur moi
  rationale: Formulation française naturelle qui préserve l’image hébraïque de l’Esprit présent sur le messager.
- source_word: מָשַׁח
  choice: m’a consacré par l’onction
  rationale: Cette expression traduit l’acte d’oindre tout en rendant clairement sa fonction de consécration et de mission.
- source_word: לְבַשֵּׂר
  choice: porter une bonne nouvelle
  rationale: Rend le sens d’annoncer une nouvelle favorable dans un français accessible, sans ajouter la notion plus spécialisée de prédication.
- source_word: עֲנָוִים
  choice: aux humbles
  rationale: Le terme peut désigner des personnes humbles, pauvres ou affligées. « Humbles » maintient sa portée sociale et spirituelle; l’autre possibilité majeure est signalée en note.
- source_word: לַחֲבֹשׁ
  choice: panser
  rationale: Le verbe évoque littéralement le fait de bander une blessure; « panser » conserve cette métaphore appliquée aux cœurs brisés.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: ceux qui ont le cœur brisé
  rationale: Expression française idiomatique et fidèle à l’image hébraïque.
- source_word: לִקְרֹא
  choice: proclamer
  rationale: Le contexte est celui d’une annonce publique officielle de libération.
- source_word: דְּרוֹר
  choice: la liberté
  rationale: Le terme désigne ici une remise en liberté, avec un arrière-plan possible de libération proclamée.
- source_word: פְּקַח־קוֹחַ
  choice: l’ouverture
  rationale: L’expression hébraïque rare et difficile semble évoquer une ouverture ou une mise en liberté; une formulation non spécifiée préserve son ambiguïté.
theological_decisions:
- issue: Traduction du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: « Le Seigneur Yahweh » représente distinctement le titre אֲדֹנָי et le nom propre יְהוִה, sans produire l’inélégant « le Seigneur SEIGNEUR ».
- issue: Portée de l’onction
  choice: m’a consacré par l’onction
  alternative: m’a oint
  rationale: La traduction conserve l’acte d’onction et sa fonction de mandat sans identifier explicitement le locuteur ni imposer une conclusion christologique ultérieure.
- issue: Sens de עֲנָוִים
  choice: aux humbles
  alternative: aux pauvres / aux affligés
  rationale: Le mot associe vulnérabilité sociale, affliction et humilité. Le texte principal retient « humbles », tandis que la note préserve les autres valeurs importantes.
- issue: Interprétation de פְּקַח־קוֹחַ
  choice: l’ouverture aux prisonniers
  alternative: l’ouverture des yeux aux prisonniers / la délivrance des prisonniers
  rationale: L’hébreu est difficile. Le choix retenu conserve l’image d’ouverture et le parallélisme avec la liberté des captifs sans trancher entre ouverture de la prison, ouverture des yeux et libération.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le rythme de la déclaration prophétique. « Panser » maintient la métaphore médicale, et les notes rendent visibles les deux principales ambiguïtés lexicales sans les résoudre artificiellement.
