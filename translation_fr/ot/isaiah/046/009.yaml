source:
  edition: WLC
  text: זִכְר֥וּ רִאשֹׁנ֖וֹת מֵ/עוֹלָ֑ם כִּ֣י אָנֹכִ֥י אֵל֙ וְ/אֵ֣ין ע֔וֹד אֱלֹהִ֖ים וְ/אֶ֥פֶס כָּמֽוֹ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/009.yaml
  text: Remember the former things of old[a], for I am God, and there is no other; I am God, and there is none like me.
translation:
  language: fr
  text: Souvenez-vous des choses passées depuis longtemps[a], car je suis Dieu, et il n’y en a pas d’autre ; je suis Dieu, et nul n’est semblable à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les premières choses, depuis les temps anciens ». L’expression hébraïque renvoie ici au passé lointain, sans désigner nécessairement l’éternité au sens abstrait.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: Souvenez-vous
  rationale: L’impératif pluriel appelle les destinataires à se rappeler activement les actes passés de Dieu. « Souvenez-vous » est direct, naturel et digne en français moderne.
- source_word: רִאשֹׁנוֹת
  choice: des événements d’autrefois
  rationale: L’adjectif féminin pluriel substantivé désigne ici les réalités ou actes antérieurs. « Événements » explicite sobrement le référent contextuel sans réduire l’expression à de simples idées.
- source_word: מֵעוֹלָם
  choice: d’autrefois
  rationale: Dans ce contexte, עוֹלָם renvoie au passé lointain plutôt qu’à l’éternité abstraite. « D’autrefois » exprime naturellement cette ancienneté.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de l’appel à se souvenir. « Car » conserve clairement cette valeur explicative.
- source_word: אָנֹכִי אֵל
  choice: je suis Dieu
  rationale: אֵל est ici le titre commun désignant Dieu, et non un nom propre à translittérer. La traduction simple respecte l’auto-identification divine.
- source_word: וְאֵין עוֹד
  choice: et il n’y en a pas d’autre
  rationale: Cette tournure exprime l’exclusivité. Le pronom reprend naturellement « Dieu » en français et conserve pleinement l’affirmation qu’il n’existe aucun autre Dieu.
- source_word: אֱלֹהִים
  choice: je suis Dieu
  rationale: Malgré sa forme morphologiquement plurielle, אֱלֹהִים désigne ici Dieu au singulier. La répétition de « je suis Dieu » reproduit l’accent du parallélisme hébreu.
- source_word: וְאֶפֶס כָּמוֹנִי
  choice: et nul n’est semblable à moi
  rationale: La proposition affirme l’incomparabilité de Dieu. « Nul » rend la négation absolue avec un registre actuel et digne, tandis que « semblable à moi » suit de près l’hébreu.
theological_decisions:
- issue: Auto-identification divine et exclusivité
  choice: Conserver les deux occurrences de « je suis Dieu » ainsi que les deux affirmations, distinctes, qu’il n’y en a pas d’autre et que nul ne lui est semblable.
  alternative: Fusionner les propositions en une seule affirmation d’unicité, ou rendre אֵל par « le Dieu puissant ».
  rationale: Le parallélisme hébreu articule à la fois l’unicité et l’incomparabilité de Dieu. Les maintenir séparément préserve l’insistance théologique du texte sans introduire de précision doctrinale absente de l’original.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La formulation conserve le parallélisme solennel et la répétition du texte hébreu. Le point-virgule distingue les deux affirmations parallèles.
