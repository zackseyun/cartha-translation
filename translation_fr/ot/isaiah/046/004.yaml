  rationale: La révision remplace une interprétation contextuellement plausible mais plus développée de l’auto-identification divine par une formulation française concise, fidèle à l’hébreu. Elle rétablit également l’image cohérente du portage dans les trois verbes concernés, tout en conservant l’objet pluriel, clairement fourni par l’allocution et le contexte.
