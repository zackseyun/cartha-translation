  text: וְ/עַד זִקְנָה֙ אֲנִ֣י ה֔וּא וְ/עַד שֵיבָ֖ה אֲנִ֣י אֶסְבֹּ֑ל אֲנִ֤י עָשִׂ֨יתִי֙ וַ/אֲנִ֣י אֶשָּׂ֔א וַ/אֲנִ֥י אֶסְבֹּ֖ל וַ/אֲמַלֵּֽט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/004.yaml
  text: Even to your old age[a], I am he, and to gray hairs I will carry you. I have made, and I will bear; I will carry[b], and I will rescue.
translation:
  language: fr
  text: Jusqu’à votre vieillesse, c’est moi ; jusqu’à vos cheveux blancs, je vous porterai[a]. C’est moi qui vous ai faits, et c’est moi qui vous porterai ; je vous porterai et je vous délivrerai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vous soutiendrai » ; le verbe hébreu peut désigner le fait de porter ou de soutenir une charge.
    reason: lexical_alternative
  - marker: b
    text: Ou « je vous mettrai à l’abri ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד זִקְנָה
  choice: Même jusqu’à votre vieillesse
  rationale: Exprime avec naturel la continuité emphatique de l’action divine jusque dans la vieillesse ; le possessif est fourni par les destinataires implicites et le parallélisme.
- source_word: אֲנִי הוּא
  choice: je suis le même
  rationale: Dans ce contexte de continuité à travers les âges de la vie, cette formulation française rend l’affirmation concise de l’identité constante de Dieu sans lui imposer une formulation doctrinale ultérieure.
- source_word: וְעַד שֵיבָה
  choice: jusqu’à vos cheveux blancs
  rationale: Conserve l’image concrète de שֵיבָה tout en employant une expression française actuelle et immédiatement compréhensible.
- source_word: אֶסְבֹּל
  choice: je vous porterai
  rationale: Le verbe désigne le fait de porter ou de soutenir une charge. « Porter » maintient le contraste contextuel entre Dieu, qui porte son peuple, et les idoles qu’il faut porter.
- source_word: עָשִׂיתִי
  choice: je vous ai faits
  rationale: Le sens ordinaire est « faire ». L’objet « vous », implicite en hébreu et fourni par le contexte, est nécessaire à une formulation française naturelle.
- source_word: אֶשָּׂא
  choice: je vous prendrai en charge
  rationale: Rend l’idée de soulever et porter avec sollicitude, tout en distinguant légèrement נשׂא des deux emplois de סבל. La répétition de « c’est moi » reflète l’insistance de אֲנִי.
- source_word: וַאֲמַלֵּט
  choice: et je vous délivrerai
  rationale: Le piel de מלט signifie faire échapper, mettre en sûreté ou délivrer. « Délivrer » reste large et digne sans préciser indûment la nature du danger.
theological_decisions:
- issue: Auto-identification divine dans אֲנִי הוּא
  choice: je suis le même
  alternative: c’est moi / je suis celui qui est
  rationale: Le contexte souligne que Dieu demeure identique et fidèle de la naissance à la vieillesse. « Je suis le même » préserve cette force sans transformer la phrase en formule métaphysique explicite.
- issue: Objet implicite des verbes de fabrication et de portage
  choice: vous
  alternative: ne pas exprimer l’objet
  rationale: Le peuple interpellé constitue l’objet contextuel. Son explicitation est requise en français et n’ajoute pas un nouveau référent théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme conserve les répétitions emphatiques de « je » et l’image du Dieu qui porte, centrale dans le contraste avec les idoles des versets précédents.
