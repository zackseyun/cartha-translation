source:
  edition: WLC
  text: קָרְס֤וּ כָֽרְעוּ֙ יַחְדָּ֔ו לֹ֥א יָכְל֖וּ מַלֵּ֣ט מַשָּׂ֑א וְ/נַפְשָׁ֖/ם בַּ/שְּׁבִ֥י הָלָֽכָה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/002.yaml
  text: They stoop[a]; they bow down together. They are unable to save the burden[b], and they themselves go into captivity.
translation:
  language: fr
  text: Ils s’affaissent[a], ils se courbent tous ensemble. Ils ne peuvent délivrer le fardeau, et eux-mêmes[b] partent en captivité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils s’écroulent » ; le verbe hébreu peut évoquer le fait de s’enfoncer ou de s’effondrer.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur âme » ou « leur vie part en captivité ». Le mot hébreu néfèsh peut désigner l’âme, la vie ou la personne elle-même.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְסוּ
  choice: ils s’affaissent
  rationale: Le verbe évoque le fait de s’enfoncer, de s’écrouler ou de s’affaisser. « S’affaissent » conserve l’image physique et le parallélisme sans imposer l’idée d’un effondrement total.
- source_word: כָרְעוּ
  choice: ils se courbent
  rationale: Le verbe peut désigner le fait de s’agenouiller ou de plier. « Se courbent » rend ici le mouvement physique et l’ironie de divinités qui ploient elles-mêmes.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: L’adverbe indique une action commune ; « tous ensemble » est naturel en français et souligne qu’aucun n’échappe à l’abaissement.
- source_word: לֹא יָכְלוּ
  choice: ils ne peuvent
  rationale: Cette expression marque l’incapacité. Le présent maintient la vivacité de la scène prophétique et s’accorde avec les propositions voisines.
- source_word: מַלֵּט
  choice: délivrer
  rationale: L’infinitif signifie faire échapper ou mettre hors de danger. « Délivrer » garde cette valeur concrète tout en restant digne et intelligible.
- source_word: מַשָּׂא
  choice: le fardeau
  rationale: Le nom désigne ce qui est porté, probablement les images divines devenues une charge. « Le fardeau » préserve cette image centrale.
- source_word: וְנַפְשָׁם
  choice: et eux-mêmes
  rationale: נֶפֶשׁ peut signifier l’âme, la vie ou la personne elle-même. Dans cette personnification des dieux ou idoles, « eux-mêmes » exprime naturellement la valeur réflexive sans nier l’ambiguïté lexicale, signalée en note.
- source_word: בַּשְּׁבִי
  choice: en captivité
  rationale: L’expression désigne l’état de captif ou la déportation. « En captivité » est précis dans ce contexte.
- source_word: הָלָכָה
  choice: partent
  rationale: Le verbe signifie aller. Le présent pluriel est requis par la formulation française « eux-mêmes » et rend la scène avec vivacité, bien que l’hébreu emploie une forme accomplie féminine singulière accordée avec נֶפֶשׁ.
theological_decisions:
- issue: Personnification des dieux ou idoles dans la dernière proposition
  choice: et eux-mêmes partent en captivité
  alternative: et leur âme / leur vie part en captivité
  rationale: Le contexte tourne en dérision l’impuissance des dieux babyloniens. נֶפֶשׁ peut désigner la personne elle-même ; la traduction idiomatique conserve la force de la personnification sans introduire une affirmation sur l’existence d’une âme propre aux idoles. La note maintient toutefois l’ambiguïté du terme hébreu.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme et l’ironie du texte sont conservés. Le présent donne à la scène prophétique une force immédiate, tandis que les notes préservent les principales ambiguïtés lexicales.
