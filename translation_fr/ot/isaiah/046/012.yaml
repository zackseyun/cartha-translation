id: ISA.46.12
reference: Isaiah 46:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֖/י אַבִּ֣ירֵי לֵ֑ב הָ/רְחוֹקִ֖ים מִ/צְּדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/012.yaml
  text: Listen to me[a], you stubborn of heart[b], you who are far from righteousness.
translation:
  language: fr
  text: Écoutez-moi, vous qui avez le cœur obstiné[a], vous qui êtes loin de la justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « forts de cœur » ou « puissants de cœur » ; dans ce contexte, l’expression désigne probablement des personnes obstinées ou inflexibles.'
    reason: lexical_alternative
  - marker: b
    text: Ou « de la droiture » ; le terme hébreu peut aussi évoquer l’intervention juste de Dieu, sa délivrance ou sa victoire.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: L’impératif pluriel appelle les destinataires à prêter attention et à obéir, et non simplement à percevoir un son. « Écoutez-moi » est naturel et fidèle à la construction hébraïque.
- source_word: אַבִּירֵי לֵב
  choice: vous qui avez le cœur obstiné
  rationale: 'L’expression signifie littéralement « forts/puissants de cœur », mais le contexte de réprimande lui donne vraisemblablement une valeur négative : fermés, inflexibles ou obstinés intérieurement. Cette formulation conserve l’image du cœur tout en exprimant clairement cette nuance.'
- source_word: הָרְחוֹקִים
  choice: vous qui êtes loin
  rationale: Le participe substantivé décrit directement les personnes interpellées. Une proposition relative est claire et idiomatique en français.
- source_word: מִצְּדָקָה
  choice: de la justice
  rationale: צְדָקָה peut désigner la justice, la droiture ou l’intervention juste et salvatrice de Dieu. « Justice » conserve en français une part importante de cette amplitude sémantique sans imposer exclusivement une lecture morale ou judiciaire.
theological_decisions:
- issue: Sens de צְדָקָה
  choice: justice
  alternative: droiture ; délivrance juste ; victoire
  rationale: Dans ce contexte, le mot peut viser soit l’éloignement moral des destinataires par rapport à ce qui est juste, soit leur éloignement apparent de l’acte juste et salvateur que Dieu va faire approcher au verset suivant. « Justice » préserve mieux cette tension que « droiture » seule.
- issue: Valeur de אַבִּירֵי לֵב
  choice: cœur obstiné
  alternative: cœur fort ; cœur inflexible
  rationale: La tournure hébraïque pourrait littéralement évoquer la force du cœur, mais l’adresse prophétique est ici réprobatrice. « Obstiné » rend ce sens probable sans transformer l’expression en terme doctrinal comme « endurci ».
translation_notes:
  register: Français international moderne, sobre et digne. L’impératif conserve la vigueur de l’interpellation prophétique. La répétition de « vous qui » reproduit le parallélisme descriptif sans lourdeur excessive.
