  text: קֵרַ֤בְתִּי צִדְקָתִ/י֙ לֹ֣א תִרְחָ֔ק וּ/תְשׁוּעָתִ֖/י לֹ֣א תְאַחֵ֑ר וְ/נָתַתִּ֤י בְ/צִיּוֹן֙ תְּשׁוּעָ֔ה לְ/יִשְׂרָאֵ֖ל תִּפְאַרְתִּֽ/י׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/013.yaml
  text: I have brought near my righteousness[a]; it is not far away, and my salvation will not delay. I will place salvation in Zion[b], for Israel my splendor.
translation:
  language: fr
  text: J’ai rapproché ma justice[a] ; elle n’est pas loin, et mon salut ne tardera pas. Je placerai le salut en Sion — pour Israël, ma splendeur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma droiture » ou « mon jugement juste ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ma gloire ». La fin de la phrase est condensée en hébreu ; elle peut aussi se comprendre comme présentant Israël lui-même comme la splendeur de Dieu.
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: קֵרַבְתִּי
  choice: J’ai fait approcher
  rationale: Le qal parfait à la première personne exprime une action accomplie dont l’effet demeure présent. Cette formulation conserve le mouvement vers la proximité sans transformer le verbe en simple présent.
- source_word: צִדְקָתִי
  choice: ma justice
  rationale: Dans ce contexte prophétique, צְדָקָה désigne la justice de Dieu manifestée dans son intervention fidèle et salvatrice. « Justice » garde une portée assez large, tandis que la note signale les nuances possibles.
- source_word: לֹא תִרְחָק
  choice: elle n’est pas loin
  rationale: Le féminin renvoie à « ma justice ». Le présent français exprime naturellement la proximité actuelle annoncée par l’imparfait hébreu.
- source_word: וּתְשׁוּעָתִי
  choice: et mon salut
  rationale: « Salut » rend le sens large de délivrance de תְּשׁוּעָה et maintient le vocabulaire biblique courant.
- source_word: לֹא תְאַחֵר
  choice: ne tardera pas
  rationale: Le piel imparfait exprime ici que le salut n’arrivera pas en retard; le futur convient à l’annonce imminente.
- source_word: וְנָתַתִּי
  choice: Je placerai
  rationale: Avec la préposition locative בְּ, נתן prend ici le sens de mettre ou placer. « Placerai » conserve cette valeur sans diluer l’image.
- source_word: בְצִיּוֹן
  choice: en Sion
  rationale: La préposition בְּ est rendue dans son sens locatif direct.
- source_word: תְּשׁוּעָה
  choice: le salut
  rationale: La répétition du mot « salut » reproduit l’insistance de l’hébreu.
- source_word: לְיִשְׂרָאֵל
  choice: pour Israël
  rationale: La préposition לְ peut marquer le bénéficiaire ou la destination. « Pour Israël » laisse ouverte la relation précise avec le dernier syntagme.
- source_word: תִּפְאַרְתִּי
  choice: ma splendeur
  rationale: תִּפְאֶרֶת peut évoquer la splendeur, la gloire ou la beauté. « Splendeur » rend l’éclat majestueux tout en évitant de réduire le terme à une acception technique.
theological_decisions:
- issue: Rapport entre la justice de Dieu et son salut
  choice: Conserver « ma justice » comme terme large, mis en parallèle avec l’action salvatrice de Dieu.
  alternative: « mon équité » ou « ma justification victorieuse »
  rationale: Chez Ésaïe, la justice divine peut inclure fidélité, jugement juste et délivrance. La traduction ne la réduit ni à un attribut moral abstrait ni à une seule déclaration judiciaire.
- issue: Relation syntaxique entre Sion, Israël et la splendeur de Dieu
  choice: 'Rendre la finale sous une forme condensée : « en Sion — pour Israël, ma splendeur ».'
  alternative: « je placerai le salut en Sion, et ma splendeur en Israël » ou « Israël, ma splendeur »
  rationale: La construction hébraïque est brève et ne répète pas le verbe. La formulation retenue évite de décider entièrement si la splendeur est donnée à Israël, manifestée en lui, ou si Israël est lui-même désigné comme la splendeur de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le parallélisme poétique, la répétition de « salut » et la concision ambiguë de la dernière proposition; le tiret signale cette dernière sans lui imposer une syntaxe explicative absente de l’hébreu.
