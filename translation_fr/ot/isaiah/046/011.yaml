revisions:
- from: J’appelle de l’est un oiseau de proie, d’une terre lointaine l’homme de mon dessein[a]. Oui, j’ai parlé, oui, je le ferai arriver ; je l’ai façonné, oui, je l’accomplirai[b].
  to: J’appelle de l’est un oiseau de proie, d’une terre lointaine l’homme de mon dessein[a]. Oui, j’ai parlé, oui, je le ferai advenir ; je l’ai formé, oui, je l’accomplirai[b].
  rationale: La révision remplace une tournure ambiguë par « je le ferai advenir », qui exprime clairement l’accomplissement causé par Dieu, sans identifier plus précisément le référent implicite des suffixes féminins hébreux. Elle retient « formé » pour refléter directement יָצַר et réduit la note lexicale à son rôle propre, sans imposer d’explication interprétative. L’identification possible à Cyrus demeure en note et non dans le texte.
