base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/011.yaml
  text: calling from the east a bird of prey[a], from a distant land the man of my purpose. Indeed, I have spoken; indeed, I will bring it to pass. I have formed it; indeed[b], I will do it.
translation:
  language: fr
  text: J’appelle de l’est un oiseau de proie, d’une terre lointaine l’homme de mon dessein[a]. Oui, j’ai parlé, oui, je le ferai advenir ; je l’ai formé, oui, je l’accomplirai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’homme de mon conseil ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte plus large, le personnage appelé de l’est est souvent compris comme étant Cyrus, mais il n’est pas nommé dans ce verset.
    reason: cross_reference
lexical_decisions:
- source_word: קֹרֵא
  choice: J’appelle
  rationale: Le participe qal décrit ici l’action de Dieu dans la continuité du contexte. La forme verbale personnelle est plus naturelle en français moderne tout en conservant cette attribution à Dieu.
- source_word: מִמִּזְרָח
  choice: de l’est
  rationale: מִזְרָח désigne couramment l’est, le lieu du lever du soleil. « De l’est » rend clairement le sens géographique.
- source_word: עַיִט
  choice: un oiseau de proie
  rationale: Le nom désigne de manière générale un rapace, sans permettre d’identifier une espèce précise.
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: d’une terre lointaine
  rationale: Cette formulation conserve l’image spatiale et le parallélisme de l’hébreu dans un français naturel.
- source_word: אִישׁ עֲצָתוֹ
  choice: l’homme de mon dessein
  rationale: Dans le contexte, עֵצָה exprime le projet ou l’intention de Dieu. « Dessein » garde la concision du groupe nominal hébreu sans expliciter indûment la manière dont cet homme le réalisera.
- source_word: אַף
  choice: oui
  rationale: Répété dans la seconde moitié du verset, אַף a une valeur affirmative et intensive. La répétition de « oui » restitue avec naturel l’insistance rhétorique.
- source_word: דִּבַּרְתִּי
  choice: j’ai parlé
  rationale: Le passé composé exprime l’acte divin déjà accompli et encore pertinent dans l’enchaînement de la déclaration.
- source_word: אֲבִיאֶנָּה
  choice: je le ferai arriver
  rationale: Le suffixe féminin renvoie vraisemblablement au dessein ou à la chose annoncée. Cette traduction conserve le verbe causatif et évite de faire du personnage masculin son objet.
- source_word: יָצַרְתִּי
  choice: je l’ai façonné
  rationale: יָצַר signifie former ou façonner. « Façonner » préserve la métaphore concrète de la conception intentionnelle du dessein.
- source_word: אֶעֱשֶׂנָּה
  choice: je l’accomplirai
  rationale: Dans ce contexte de réalisation du projet annoncé, « accomplir » exprime naturellement la portée de עשה tout en gardant la conclusion brève et ferme.
theological_decisions:
- issue: Identité de l’« oiseau de proie » et de « l’homme de mon dessein »
  choice: Conserver les désignations imagées sans nommer le personnage dans le texte principal.
  alternative: Identifier explicitement ce personnage à Cyrus, ou y voir plus généralement un instrument du dessein divin.
  rationale: Le contexte plus large est souvent compris comme une allusion à Cyrus, mais celui-ci n’est pas nommé dans ce verset. La traduction ne doit pas transformer cette identification contextuelle en donnée explicite du texte.
- issue: Référent des suffixes féminins de אֲבִיאֶנָּה et אֶעֱשֶׂנָּה
  choice: Employer « le », avec pour référent français « mon dessein » ou, plus largement, ce que Dieu a annoncé.
  alternative: Employer un pronom renvoyant à l’homme appelé de loin, ou « cela » pour l’événement annoncé.
  rationale: Les suffixes hébreux sont féminins et ne renvoient donc pas naturellement à אִישׁ, masculin. Ils évoquent plutôt le dessein, la parole ou la chose annoncée ; le masculin français s’accorde ici avec « dessein ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsme marqué. La répétition de « oui » conserve l’insistance de l’hébreu ; « dessein » maintient la densité du texte tout en restant intelligible. Les deux membres parallèles et les images originales sont préservés.
