    issue: « je le ferai arriver »
    rationale: Cette expression n’est pas la formulation française la plus claire pour le fait de faire se réaliser une parole, un projet ou une chose annoncée. Elle peut être comprise au sens de faire parvenir quelqu’un ou quelque chose à destination.
  - severity: low
    issue: Explication interprétative dans la note a
    rationale: « C’est-à-dire celui qui correspond au projet arrêté par Dieu » dépasse l’alternative lexicale et présente une explicitation interprétative non nécessaire. La note devrait préserver l’ambiguïté du syntagme hébreu.
  - severity: low
    issue: « façonné » pour יָצַר
    rationale: Le terme est possible, mais « formé » reproduit plus directement le verbe hébreu et s’accorde mieux avec le parallélisme volontairement sobre de la déclaration divine.
