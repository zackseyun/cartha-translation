source:
  edition: WLC
  text: זִכְרוּ זֹ֖את וְ/הִתְאֹשָׁ֑שׁוּ הָשִׁ֥יבוּ פוֹשְׁעִ֖ים עַל לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/008.yaml
  text: Remember this and be ashamed[a]; take it to heart[c][b], you transgressors.
translation:
  language: fr
  text: Souvenez-vous de cela et affermissez-vous[a] ; prenez-le à cœur[b], vous qui vous révoltez[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fortifiez-vous », « reprenez courage » ou « montrez-vous fermes ». Le verbe hébreu est très rare et évoque probablement la force ou la fermeté.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ramenez sur le cœur », c’est-à-dire : réfléchissez-y sérieusement.'
    reason: lexical_alternative
  - marker: c
    text: Ou « rebelles » ou « transgresseurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ זֹאת
  choice: Souvenez-vous de cela
  rationale: L’impératif pluriel de זכר commande de se rappeler ce qui vient d’être exposé ; « cela » conserve la valeur du démonstratif singulier זֹאת.
- source_word: וְהִתְאֹשָׁשׁוּ
  choice: et affermissez-vous
  rationale: Ce verbe très rare paraît appeler les destinataires à se rendre fermes ou forts. « Affermissez-vous » préserve cette idée sans introduire une référence masculine absente de la forme hébraïque.
- source_word: הָשִׁיבוּ ... עַל־לֵב
  choice: prenez-le à cœur
  rationale: L’expression signifie littéralement « ramenez sur le cœur ». L’idiome français exprime naturellement l’idée d’intérioriser et de considérer sérieusement ce rappel.
- source_word: פוֹשְׁעִים
  choice: vous qui vous révoltez
  rationale: Le participe pluriel de פשע désigne des personnes qui se rebellent ou transgressent. La tournure verbale française rend clairement leur attitude persistante sans imposer un substantif archaïque.
theological_decisions:
- issue: Portée de פוֹשְׁעִים
  choice: vous qui vous révoltez
  alternative: rebelles ; transgresseurs
  rationale: Le terme peut évoquer aussi bien la rébellion que la transgression. Le texte retient la dynamique de révolte et signale l’autre nuance en note.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des deux impératifs est conservé, tandis que l’idiome hébreu relatif au cœur est rendu par une expression française courante. La note maintient l’incertitude attachée au verbe rare וְהִתְאֹשָׁשׁוּ.
