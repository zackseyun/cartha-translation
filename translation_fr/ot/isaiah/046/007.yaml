source:
  edition: WLC
  text: יִ֠שָּׂאֻ/הוּ עַל כָּתֵ֨ף יִסְבְּלֻ֜/הוּ וְ/יַנִּיחֻ֤/הוּ תַחְתָּי/ו֙ וְ/יַֽעֲמֹ֔ד מִ/מְּקוֹמ֖/וֹ לֹ֣א יָמִ֑ישׁ אַף יִצְעַ֤ק אֵלָי/ו֙ וְ/לֹ֣א יַעֲנֶ֔ה מִ/צָּרָת֖/וֹ לֹ֥א יוֹשִׁיעֶֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/007.yaml
  text: They lift it onto the shoulder[a], they carry it, and they set it in its place, and it stands there; it does not move from its place. Even if someone cries out to it, it does not answer; it does not save him from his distress.
translation:
  language: fr
  text: Ils le hissent sur l’épaule, le portent et le déposent à sa place[a]. Il reste là, debout, sans bouger de sa place. Même si quelqu’un crie vers lui, il ne lui répond pas et ne le sauve pas de sa détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ils le déposent sous lui », expression qui désigne probablement l’installation de l’idole à sa place, peut-être sur son socle.'
    reason: La formulation hébraïque est inhabituelle et son référent précis demeure incertain; la note conserve cette donnée tout en expliquant le sens contextuel probable.
lexical_decisions:
- source_word: יִשָּׂאֻהוּ
  choice: ils le hissent
  rationale: Le verbe נשׂא décrit ici l’action initiale qui consiste à soulever l’idole. « Hissent » distingue nettement cette action du transport exprimé par le verbe suivant.
- source_word: עַל כָּתֵף
  choice: sur l’épaule
  rationale: Le singulier hébreu désigne idiomatiquement le transport sur l’épaule. Cette tournure est naturelle en français.
- source_word: יִסְבְּלֻהוּ
  choice: le portent
  rationale: סבל évoque le fait de porter une charge. « Portent » conserve cette image et s’enchaîne naturellement après « hissent ».
- source_word: וְיַנִּיחֻהוּ תַחְתָּיו
  choice: le déposent à sa place
  rationale: L’expression signifie vraisemblablement que l’idole est posée à l’endroit prévu, peut-être sur son socle. La traduction littérale « sous lui » étant obscure, le sens probable est rendu dans le texte et la formulation hébraïque est signalée en note.
- source_word: וְיַעֲמֹד
  choice: il reste là, debout
  rationale: Le verbe décrit l’idole dressée après avoir été installée. Cette formulation française rend à la fois sa position et son immobilité dans le contexte.
- source_word: מִמְּקוֹמוֹ לֹא יָמִישׁ
  choice: sans bouger de sa place
  rationale: La tournure exprime l’incapacité de l’idole à quitter l’endroit où des humains l’ont placée et préserve la pointe ironique du passage.
- source_word: אַף
  choice: même si
  rationale: 'La particule introduit ici une concession emphatique : même lorsqu’on l’invoque, l’idole demeure impuissante.'
- source_word: יִצְעַק אֵלָיו
  choice: quelqu’un crie vers lui
  rationale: Le verbe au masculin singulier a une valeur générique. « Quelqu’un » exprime naturellement ce sujet indéfini, tandis que « vers lui » conserve l’orientation du cri vers l’idole.
- source_word: וְלֹא יַעֲנֶה
  choice: il ne lui répond pas
  rationale: ענה est le verbe ordinaire pour répondre à un cri ou à une invocation. Le pronom indirect explicite naturellement en français la personne qui appelle.
- source_word: מִצָּרָתוֹ לֹא יוֹשִׁיעֶנּוּ
  choice: ne le sauve pas de sa détresse
  rationale: צרה désigne la détresse ou l’épreuve, et le hiphil de ישׁע signifie sauver ou délivrer. « Sauver de sa détresse » conserve le poids théologique de l’impuissance de l’idole.
theological_decisions:
- issue: Valeur générique du masculin singulier dans la dernière proposition
  choice: « quelqu’un […] ne le sauve pas de sa détresse »
  alternative: « il crie vers lui […] ne le sauve pas de sa détresse » ou une reformulation entièrement épicène
  rationale: Le masculin singulier hébreu fonctionne ici de manière générique. « Quelqu’un » le rend clairement sans transformer le référent singulier en pluriel; les pronoms qui suivent maintiennent la cohésion grammaticale et la distinction entre la personne et l’idole.
- issue: Impuissance de l’idole à sauver
  choice: « ne le sauve pas »
  alternative: « ne peut pas le sauver »
  rationale: L’hébreu nie directement l’acte de sauver sans employer explicitement un verbe exprimant la capacité. La traduction évite donc d’ajouter « pouvoir », tout en laissant le contexte manifester l’impuissance de l’idole.
translation_notes:
  register: Français international moderne, courant et digne. La succession « hissent, portent, déposent » conserve la progression concrète des verbes hébreux. « Il reste là, debout » souligne naturellement l’ironie de l’idole installée par des humains puis incapable de bouger, de répondre ou de sauver.
