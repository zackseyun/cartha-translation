source:
  edition: WLC
  text: הַ/זָּלִ֤ים זָהָב֙ מִ/כִּ֔יס וְ/כֶ֖סֶף בַּ/קָּנֶ֣ה יִשְׁקֹ֑לוּ יִשְׂכְּר֤וּ צוֹרֵף֙ וְ/יַעֲשֵׂ֣/הוּ אֵ֔ל יִסְגְּד֖וּ אַף יִֽשְׁתַּחֲוּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/006.yaml
  text: Those who lavish gold from the purse and weigh out silver on the scale hire a goldsmith[a], and he makes it into a god; they bow down, indeed they prostrate themselves.
translation:
  language: fr
  text: Ils déversent l’or de leur bourse et pèsent l’argent à la balance[a] ; ils engagent un orfèvre, qui en fait un dieu. Puis ils s’inclinent, oui, ils se prosternent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au roseau » ou « à la canne » ; le terme hébreu peut désigner la tige ou le fléau d’une balance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּלִים
  choice: Ils déversent
  rationale: Le participe évoque le fait de verser ou de dépenser abondamment. « Déversent » conserve l’image concrète et suggère la prodigalité sans ajouter explicitement un jugement absent du terme lui-même.
- source_word: זָהָב מִכִּיס
  choice: l’or de leur bourse
  rationale: כִּיס désigne une bourse ou un sachet servant à contenir de l’argent. « Bourse » est naturel en français moderne et convient au contexte.
- source_word: וְכֶסֶף בַּקָּנֶה יִשְׁקֹלוּ
  choice: et pèsent l’argent à la balance[a]
  rationale: קָנֶה signifie littéralement « roseau » ou « canne », mais désigne vraisemblablement ici la tige ou le fléau d’un instrument de pesage. « À la balance » rend clairement l’action commerciale, tandis que la note conserve l’image hébraïque.
- source_word: יִשְׂכְּרוּ צוֹרֵף
  choice: ils paient un orfèvre
  rationale: שׂכר peut exprimer l’engagement contre rémunération. צוֹרֵף est un artisan travaillant ou affinant les métaux ; « orfèvre » convient aux métaux précieux mentionnés et à la fabrication de l’objet.
- source_word: וְיַעֲשֵׂהוּ אֵל
  choice: pour qu’il en fasse un dieu
  rationale: Le suffixe renvoie à la matière précieuse donnée à l’artisan. « En fasse un dieu » préserve le terme אֵל et souligne naturellement la fabrication sans le remplacer par l’interprétation « idole ».
- source_word: יִסְגְּדוּ
  choice: ils s’inclinent
  rationale: סגד désigne le geste de s’incliner en hommage ou en adoration. Cette formulation est claire et permet de conserver une progression avec le verbe suivant.
- source_word: אַף יִשְׁתַּחֲווּ
  choice: oui, ils se prosternent
  rationale: אַף renforce l’énoncé précédent. « Oui » marque cette insistance, et « se prosternent » exprime le geste cultuel plus complet évoqué par חוה.
theological_decisions:
- issue: Désignation de l’objet fabriqué comme divinité
  choice: un dieu
  alternative: une idole
  rationale: L’hébreu emploie אֵל, « dieu ». Le contexte polémique montre qu’il s’agit d’une divinité fabriquée et fausse, mais traduire par « idole » remplacerait le mot source par une interprétation et atténuerait l’ironie du passage.
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve la succession concrète des gestes — sortir la richesse, la peser, payer l’artisan, fabriquer puis adorer — ainsi que l’intensification finale entre s’incliner et se prosterner.
