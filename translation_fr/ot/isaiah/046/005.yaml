  text: To whom will you liken me and make me equal[a], and compare me, that we may be alike?
translation:
  language: fr
  text: À qui me comparerez-vous, me rendrez-vous égal et m’assimilerez-vous, pour que nous soyons semblables[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu accumule plusieurs verbes de sens voisin — « comparer », « rendre égal », « assimiler » — pour renforcer le défi rhétorique. Ou : « … afin que nous soyons semblables ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִי
  choice: À qui
  rationale: Le ל préfixé introduit la personne ou la réalité prise comme terme de comparaison; l’antéposition conserve la force du défi rhétorique.
- source_word: תְדַמְיוּנִי
  choice: me comparerez-vous
  rationale: Le piel de דמה signifie ici « comparer, rendre semblable ». « Comparer » est naturel en français et maintient le suffixe objet « me ».
- source_word: וְתַשְׁווּ
  choice: pour faire de lui mon égal
  rationale: Le hifil de שוה exprime l’idée de mettre sur un pied d’égalité. Le terme de comparaison reste implicite en hébreu; « de lui » l’explicite naturellement en français tout en évitant l’expression ambiguë « me rendre égal ».
- source_word: וְתַמְשִׁלוּנִי
  choice: À qui m’assimilerez-vous
  rationale: Le hifil de משל signifie ici « comparer, assimiler ». La reprise de « À qui » rend explicite le parallélisme elliptique et préserve l’accumulation des verbes de comparaison.
- source_word: וְנִדְמֶה
  choice: pour que nous nous ressemblions
  rationale: La forme à la première personne du pluriel inclut Dieu et l’objet supposé de la comparaison. « Nous nous ressemblions » restitue clairement cette réciprocité et la valeur de résultat ou de visée.
theological_decisions:
- issue: Polémique contre les idoles et accumulation comparative
  choice: Conserver plusieurs expressions proches — « comparer », « faire de lui mon égal », « assimiler », « nous ressembler » — plutôt que réduire la phrase à un seul verbe.
  alternative: Simplifier en répétant seulement « comparer » ou en supprimant un membre de la question.
  rationale: L’hébreu accumule intentionnellement des verbes voisins pour intensifier l’impossibilité de placer Dieu au même niveau qu’un autre être ou objet, sans qu’il soit nécessaire d’ajouter une précision doctrinale absente du verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation en deux questions coordonnées rend lisible le parallélisme hébreu et conserve sa solennité. Le pronom « lui » reprend le terme implicite auquel Dieu serait comparé.
