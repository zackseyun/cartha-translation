    rationale: Ces choix sont possibles pour la lisibilité, mais une seule interrogation avec les verbes coordonnés préserve mieux le mouvement rhétorique sans nuire au français.
  revised_text: À qui me comparerez-vous, me rendrez-vous égal et m’assimilerez-vous, pour que nous soyons semblables[a] ?
