  source_fidelity: 'La première proposition du projet transforme le השני verbe coordonné (« et vous me rendrez égal ») en subordonnée de but (« pour faire de lui mon égal ») et ajoute « lui », absent de l’hébreu. Le texte source enchaîne trois verbes à la 2e personne du pluriel avec « moi » comme objet explicite ou sous-entendu, puis conclut par une première personne du pluriel : « afin que nous soyons semblables ».'
  naturalness: « Me rendrez-vous égal » est un peu soutenu, mais naturel et précis dans ce défi rhétorique. La question unique avec une série de verbes coordonnés reproduit plus fidèlement l'accumulation hébraïque que les deux questions du projet.
  terminology: « Comparer », « rendre égal » et « assimiler » conservent la gradation de verbes apparentés sans ajouter de référent masculin singulier. « Semblables » rend clairement la relation réciproque impliquée par le pluriel final.
