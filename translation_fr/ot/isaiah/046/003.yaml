revisions:
- from: Écoutez-moi, maison de Jacob, et tout le reste de la maison d’Israël, vous dont je me suis chargé dès le ventre maternel, vous que j’ai portés dès le sein maternel[a].
  to: Écoutez-moi, maison de Jacob, et tout le reste de la maison d’Israël, vous que je porte dès le ventre maternel, que je soutiens dès la matrice[a].
  rationale: La révision remplace une paraphrase abstraite par des verbes qui rendent plus directement l’image hébraïque de Dieu portant son peuple. Elle maintient l’agent divin établi par le locuteur et le contexte, conserve le parallélisme, et évite l’ambiguïté moderne de « sein maternel ».
  reviewer_model: gpt-5.6-terra
