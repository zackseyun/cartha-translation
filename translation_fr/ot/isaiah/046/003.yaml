source:
  edition: WLC
  text: שִׁמְע֤וּ אֵלַ/י֙ בֵּ֣ית יַעֲקֹ֔ב וְ/כָל שְׁאֵרִ֖ית בֵּ֣ית יִשְׂרָאֵ֑ל הַֽ/עֲמֻסִים֙ מִנִּי בֶ֔טֶן הַ/נְּשֻׂאִ֖ים מִנִּי רָֽחַם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/003.yaml
  text: Listen to me[a], house of Jacob, and all the remnant of the house of Israel, who have been borne by me from birth, carried from the womb.
translation:
  language: fr
  text: Écoutez-moi, maison de Jacob, et tout le reste de la maison d’Israël, vous que je porte dès le ventre maternel, que je soutiens dès la matrice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie deux expressions parallèles, littéralement « dès le ventre » et « dès la matrice », pour évoquer la sollicitude de Dieu depuis le tout début de la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: L’impératif pluriel appelle à une écoute attentive. « Écoutez-moi » est direct et naturel en français moderne.
- source_word: בֵּית יַעֲקֹב
  choice: maison de Jacob
  rationale: Cette expression traditionnelle désigne collectivement les descendants de Jacob et conserve l’image hébraïque de la « maison ».
- source_word: וְכָל שְׁאֵרִית בֵּית יִשְׂרָאֵל
  choice: et tout le reste de la maison d’Israël
  rationale: « Le reste » préserve le terme prophétique important שְׁאֵרִית ainsi que sa valeur collective.
- source_word: הַעֲמֻסִים
  choice: vous dont je me suis chargé
  rationale: Le participe passif évoque ceux qui sont pris en charge ou portés. La tournure active est idiomatique en français et rend explicite l’action de Dieu que souligne le contexte, par contraste avec les idoles que les humains doivent porter.
- source_word: הַנְּשֻׂאִים
  choice: vous que j’ai portés
  rationale: נשׂא exprime ici l’action de porter. La répétition de « vous » restitue le parallélisme et donne à la phrase française une cadence claire.
- source_word: מִנִּי בֶטֶן … מִנִּי רָחַם
  choice: dès le ventre maternel … dès le sein maternel
  rationale: מִנִּי marque ici le point de départ temporel. Les deux expressions parallèles renvoient à la période précédant la naissance; deux formulations françaises proches préservent la variation poétique.
theological_decisions:
- issue: Terminologie prophétique du « reste »
  choice: le reste
  alternative: ceux qui subsistent
  rationale: « Le reste » maintient la continuité lexicale et théologique de שְׁאֵרִית dans Ésaïe sans développer l’expression par une interprétation supplémentaire.
- issue: Agent des participes passifs
  choice: 'tournures actives à la première personne : « je me suis chargé… j’ai portés »'
  alternative: « vous qui êtes pris en charge… portés… »
  rationale: Les formes hébraïques sont passives et n’expriment pas formellement l’agent dans chaque participe, mais le locuteur divin et le contraste immédiat avec les idoles portées par leurs adorateurs identifient clairement Dieu comme celui qui porte Israël. La formulation française rend ce lien sans ajouter d’agent étranger au contexte.
- issue: Portée temporelle de מִנִּי
  choice: dès
  alternative: par moi
  rationale: Dans les groupes מִנִּי בֶטֶן et מִנִּי רָחַם, la préposition introduit naturellement le point de départ, « depuis/dès le ventre maternel », plutôt qu’un complément d’agent.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sans employer le terme anatomique et peu naturel « matrice » dans le corps du verset. « Sein maternel » est ici pris au sens littéraire de ventre maternel, non de poitrine.
