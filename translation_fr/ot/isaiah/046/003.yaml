review_pass:
  verdict: revise
  source_fidelity: La formulation « vous dont je me suis chargé » atténue et reformule trop librement l’image des participes passifs hébreux, qui décrivent Israël comme porté/soutenu par le locuteur divin. Le français peut exprimer explicitement l’agent, conformément au contexte immédiat et à la lecture retenue dans la piste d’audit anglaise. Les deux expressions temporelles parallèles doivent aussi rester distinctes sans attribuer à « sein maternel » un sens moderne principalement associé à la poitrine.
  naturalness: Le verset est globalement fluide, mais « je me suis chargé » est moins direct que « je vous porte » et « sein maternel » est ambigu en français moderne. « Matrice », bien que plus soutenu, est compréhensible dans ce registre biblique et permet de conserver la variation lexicale sans employer un terme clinique.
  terminology: « Maison de Jacob » et « le reste de la maison d’Israël » conviennent et conservent les désignations collectives ainsi que le terme prophétique חשוב de « reste ». La correction conserve le parallélisme de la prise en charge divine et l’opposition contextuelle avec les idoles portées.
  issues:
  - severity: medium
    issue: « vous dont je me suis chargé » reformule l’image de portage de façon trop abstraite.
    rationale: הָעֲמֻסִים désigne ceux qui sont chargés/portés; dans le contexte, Dieu est celui qui les porte. « Je vous porte » est plus fidèle et plus immédiat.
  - severity: medium
    issue: « sein maternel » est ambigu en français moderne.
    rationale: Son sens usuel est la poitrine. Employer « matrice » dans ce parallélisme évite cette ambiguïté et rend la distinction poétique avec « ventre maternel ».
  revised_text: Écoutez-moi, maison de Jacob, et tout le reste de la maison d’Israël, vous que je porte dès le ventre maternel, que je soutiens dès la matrice[a].
  revised_footnotes:
