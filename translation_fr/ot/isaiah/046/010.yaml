  variant: modern international French
source:
  edition: WLC
  text: מַגִּ֤יד מֵֽ/רֵאשִׁית֙ אַחֲרִ֔ית וּ/מִ/קֶּ֖דֶם אֲשֶׁ֣ר לֹא נַעֲשׂ֑וּ אֹמֵר֙ עֲצָתִ֣/י תָק֔וּם וְ/כָל חֶפְצִ֖/י אֶעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/010.yaml
  text: declaring the end from the beginning[a], and from ancient times things that have not been done, saying, ‘My purpose shall stand[c][b], and I will accomplish all my good pleasure.’
translation:
  language: fr
  text: 'J’annonce dès le commencement la fin, et dès les temps anciens ce qui n’est pas encore arrivé[a]. Je dis : « Mon dessein tiendra ferme[b], et j’accomplirai tout ce que je désire[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui n’a pas été fait ». Autre traduction : « ce qui n’est pas encore accompli ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Mon projet subsistera » ; littéralement : « Mon conseil tiendra ferme ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « tout ce que je veux » ou « tout mon bon plaisir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַגִּיד
  choice: J’annonce
  rationale: Le participe hiphil de נגד exprime l’action de faire connaître ou d’annoncer. La première personne s’accorde naturellement avec la parole divine qui se poursuit dans le verset.
- source_word: מֵרֵאשִׁית אַחֲרִית
  choice: dès le commencement la fin
  rationale: Cette formulation conserve le contraste temporel direct entre רֵאשִׁית, « commencement », et אַחֲרִית, « fin » ou « issue ».
- source_word: וּמִקֶּדֶם
  choice: et depuis les temps anciens
  rationale: Dans son emploi temporel, קֶדֶם désigne un passé lointain. « Depuis les temps anciens » rend clairement ce parallélisme.
- source_word: אֲשֶׁר לֹא נַעֲשׂוּ
  choice: ce qui n’est pas encore arrivé
  rationale: Le texte dit littéralement « ce qui n’a pas été fait ». Dans ce contexte, il s’agit d’événements futurs qui ne se sont pas encore produits ; la note conserve la formulation plus littérale.
- source_word: עֲצָתִי
  choice: Mon dessein
  rationale: עֵצָה peut désigner un conseil, un projet ou un dessein. « Dessein » exprime ici une intention arrêtée sans réduire le mot à un simple avis.
- source_word: תָקוּם
  choice: tiendra ferme
  rationale: קום évoque ici ce qui demeure établi et conserve sa validité. « Tiendra ferme » maintient cette image de stabilité.
- source_word: וְכָל חֶפְצִי
  choice: tout ce que je désire
  rationale: חֵפֶץ peut signifier désir, plaisir ou volonté. La formulation choisie est naturelle en français et garde la dimension personnelle de la volonté divine.
- source_word: אֶעֱשֶׂה
  choice: j’accomplirai
  rationale: עשה signifie fondamentalement « faire », mais désigne ici la réalisation effective du dessein annoncé ; « accomplirai » rend cette force contextuelle.
theological_decisions:
- issue: Expression de l’intention divine dans עֲצָתִי et חֶפְצִי
  choice: Mon dessein tiendra ferme, et j’accomplirai tout ce que je désire
  alternative: Mon conseil subsistera, et je ferai tout ce que je veux
  rationale: La traduction affirme l’efficacité de l’intention divine telle que l’exprime l’hébreu, sans préciser davantage la relation entre connaissance, volonté et accomplissement ni importer une formulation doctrinale particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme temporel et l’image de fermeté sont conservés, tandis que les formulations hébraïques potentiellement ambiguës sont signalées en notes.
