  text: כָּרַ֥ע בֵּל֙ קֹרֵ֣ס נְב֔וֹ הָיוּ֙ עֲצַבֵּי/הֶ֔ם לַ/חַיָּ֖ה וְ/לַ/בְּהֵמָ֑ה נְשֻׂאֹתֵי/כֶ֣ם עֲמוּס֔וֹת מַשָּׂ֖א לַ/עֲיֵפָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/046/001.yaml
  text: Bel bows down[a]; Nebo stoops. Their idols are for the beasts and the cattle. Your loads are borne[c][b], loaded as a burden for the weary.
translation:
  language: fr
  text: Bel se courbe, Nébo s’affaisse. Leurs idoles sont sur les animaux et le bétail. Les objets que vous portiez[a] sont chargés, un fardeau pour la bête épuisée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu de cette phrase est difficile. Autre traduction possible : « Vos charges sont portées, chargées comme un fardeau pour l’animal épuisé. » Le contexte évoque probablement les statues des dieux transportées comme cargaison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: s’effondre
  rationale: Le qal accompli décrit ici prophétiquement l’abaissement ou la chute de Bel. Le présent donne à la scène sa vivacité, et « s’effondre » exprime mieux qu’un simple geste de révérence l’humiliation de la divinité.
- source_word: בֵּל
  choice: Bel
  rationale: Nom propre de la divinité babylonienne, conservé par translittération.
- source_word: קֹרֵס
  choice: s’affaisse
  rationale: Le participe de קרס évoque le fait de ployer ou de s’écrouler. « S’affaisse » forme un parallélisme naturel avec « s’effondre » sans effacer la nuance propre du second verbe.
- source_word: נְבוֹ
  choice: Nébo
  rationale: Forme française traditionnelle et intelligible du nom de la divinité babylonienne.
- source_word: עֲצַבֵּיהֶם
  choice: leurs idoles
  rationale: Dans ce contexte polémique, עצב désigne les représentations cultuelles considérées comme de faux dieux. « Idoles » restitue clairement cette portée.
- source_word: לַחַיָּה וְלַבְּהֵמָה
  choice: sur des animaux, sur des bêtes de somme
  rationale: Les deux termes désignent largement des animaux et du bétail. Dans le contexte du transport des statues, « bêtes de somme » explicite naturellement la fonction du second groupe sans modifier l’image.
- source_word: נְשֻׂאֹתֵיכֶם
  choice: ce que vous portiez est maintenant transporté
  rationale: La forme est difficile et renvoie probablement aux objets cultuels autrefois portés par leurs adorateurs, mais désormais emportés comme cargaison. Cette formulation garde l’adresse à la deuxième personne et fait ressortir l’ironie du renversement.
- source_word: עֲמוּסוֹת
  choice: chargé
  rationale: Le participe passif de עמס décrit ce qui est placé comme charge. Le singulier s’accorde en français avec la proposition substantivée « ce que vous portiez ».
- source_word: מַשָּׂא
  choice: comme un fardeau
  rationale: 'משא désigne une charge ou un fardeau. « Fardeau » souligne l’ironie centrale : les dieux censés porter secours doivent eux-mêmes être portés.'
- source_word: לַעֲיֵפָה
  choice: sur une bête épuisée
  rationale: Le féminin singulier de l’adjectif « fatiguée, épuisée » renvoie vraisemblablement à une bête de somme implicite ou collective. La formulation française rend explicite ce référent probable tout en signalant l’incertitude en note.
theological_decisions:
- issue: Désignation des représentations des dieux babyloniens
  choice: leurs idoles
  alternative: leurs images
  rationale: 'Le contexte prophétique est ouvertement polémique : les objets sont des images cultuelles impuissantes devenues fardeaux. « Idoles » conserve cette critique sans ajouter de particularité confessionnelle.'
- issue: Référent de נְשֻׂאֹתֵיכֶם
  choice: les objets cultuels que les adorateurs portaient auparavant et qui sont désormais transportés comme cargaison
  alternative: vos charges sont portées
  rationale: La syntaxe hébraïque est difficile. Le contexte oppose implicitement les fidèles qui portaient les images à leur transport humiliant sur des animaux. Le texte traduit ce mouvement probable, tandis que la note conserve l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et imagé. Le parallélisme poétique est conservé par « s’effondre / s’affaisse ». La seconde moitié privilégie une syntaxe française claire tout en maintenant, par une note, l’ambiguïté d’un texte hébreu difficile.
