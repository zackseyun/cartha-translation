  source_fidelity: 'Le sens principal est bien rendu : l’absence de maladie et le pardon de l’iniquité sont juxtaposés sans imposer de lien causal individuel. « A reçu le pardon de sa faute » exprime correctement l’idiome נְשֻׂא עָוֺן. Toutefois, la conjonction initiale וּ est préférable en français, et « y habite » reprend plus directement le référent locatif de בָּהּ.'
