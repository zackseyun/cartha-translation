  text: וּ/בַל יֹאמַ֥ר שָׁכֵ֖ן חָלִ֑יתִי הָ/עָ֛ם הַ/יֹּשֵׁ֥ב בָּ֖/הּ נְשֻׂ֥א עָוֺֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/024.yaml
  text: And no inhabitant will say[a], “I am sick”; the people who dwell there are forgiven their iniquity.
translation:
  language: fr
  text: 'Et aucun habitant ne dira : « Je suis malade. » Le peuple qui y habite a reçu le pardon de sa faute.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa faute lui est enlevée » ou « sa culpabilité est ôtée ». L’hébreu emploie l’image d’une faute portée ou ôtée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַל
  choice: Aucun… ne
  rationale: Cette tournure française exprime naturellement la négation forte introduisant l’énoncé, tandis que l’enchaînement avec le contexte est suffisamment porté par la continuité du verset.
- source_word: יֹאמַר
  choice: dira
  rationale: L’imparfait hébreu a ici une valeur future dans le discours prophétique.
- source_word: שָׁכֵן
  choice: habitant
  rationale: Le singulier désigne de façon générique toute personne résidant dans la ville.
- source_word: חָלִיתִי
  choice: Je suis malade
  rationale: Le verbe חלה décrit ici l’état de maladie ou de faiblesse; le présent français convient au discours direct.
- source_word: הָעָם
  choice: le peuple
  rationale: Le terme désigne collectivement la population, sans accent politique particulier.
- source_word: הַיֹּשֵׁב בָּהּ
  choice: qui habite là
  rationale: Le participe singulier s’accorde avec le collectif « peuple »; « là » rend le suffixe locatif sans personnification artificielle.
- source_word: נְשֻׂא עָוֺן
  choice: a reçu le pardon de sa faute
  rationale: L’expression passive évoque littéralement la faute portée, enlevée ou levée, et signifie idiomatiquement qu’elle est pardonnée. La formulation française conserve le collectif singulier.
theological_decisions:
- issue: Rapport entre la guérison physique et le pardon
  choice: Présenter côte à côte l’absence de maladie et le pardon de la faute.
  alternative: Comprendre la maladie comme une pure métaphore spirituelle, ou affirmer un lien causal systématique entre chaque maladie et un péché personnel.
  rationale: Le texte associe ces deux bénédictions dans le contexte du rétablissement de Sion sans préciser entre elles un rapport causal individuel.
- issue: Portée de נְשֻׂא עָוֺן
  choice: Traduire idiomatiquement par le pardon tout en signalant l’image hébraïque en note.
  alternative: Traduire directement par « sa faute est enlevée » ou « sa culpabilité est emportée ».
  rationale: Le pardon est le sens contextuel naturel, mais l’image de la faute portée ou ôtée mérite d’être conservée comme possibilité lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. « Habitant » et « peuple » préservent le contraste entre l’individu générique et la collectivité. La note maintient l’ambiguïté de l’expression hébraïque relative à la faute.
