  text: נִטְּשׁ֖וּ חֲבָלָ֑יִ/ךְ בַּל יְחַזְּק֤וּ כֵן תָּרְנָ/ם֙ בַּל פָּ֣רְשׂוּ נֵ֔ס אָ֣ז חֻלַּ֤ק עַֽד שָׁלָל֙ מַרְבֶּ֔ה פִּסְחִ֖ים בָּ֥זְזוּ בַֽז־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/023.yaml
  text: Your ropes hang loose[a]; they cannot hold firm the base of their mast; they cannot spread the sail. Then abundant plunder will be divided[b]; even the lame will carry off the spoil.
translation:
  language: fr
  text: Tes cordages sont relâchés ; ils ne peuvent assurer solidement le support[a] de leur mât ni déployer la voile[b]. Alors on partagera un abondant butin ; même les boiteux emporteront le butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est difficile ici. Il peut désigner la base, le socle ou le dispositif qui soutient le mât.
    reason: textual_or_lexical_uncertainty
  - marker: b
    text: Ou « l’étendard » ou « le signal ». Le mot hébreu désigne généralement une bannière ou un signal dressé, mais « voile » convient à l’image du navire dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְּשׁוּ חֲבָלָיִךְ
  choice: Tes cordages sont relâchés
  rationale: Le passif exprime des cordages lâchés ou détendus. « Cordages » convient au cadre nautique et le possessif féminin singulier est conservé par « tes ».
- source_word: בַּל יְחַזְּקוּ
  choice: ils ne peuvent maintenir solidement
  rationale: La négation forte, dans l’image d’un navire hors d’état de fonctionner, indique ici l’incapacité ; le verbe exprime l’idée d’affermir ou de maintenir ferme.
- source_word: כֵן
  choice: le support
  rationale: Le nom est difficile dans ce contexte et semble désigner ce qui soutient ou fixe le mât. « Support » reste volontairement général afin de ne pas imposer une précision absente de l’hébreu.
- source_word: תָּרְנָם
  choice: leur mât
  rationale: Le nom désigne le mât, et le suffixe masculin pluriel est rendu par « leur », malgré le passage de « tes cordages » à « leur mât » dans le texte hébreu.
- source_word: בַּל פָּרְשׂוּ נֵס
  choice: ni déployer la voile
  rationale: Le verbe signifie étendre ou déployer. נֵס désigne ordinairement un étendard ou un signal, mais « voile » est plausible ici et maintient la cohérence de la métaphore nautique ; l’autre sens est signalé en note.
- source_word: אָז חֻלַּק עַד שָׁלָל מַרְבֶּה
  choice: Alors on partagera un abondant butin
  rationale: Le passif hébreu annonce la répartition d’une très grande quantité de butin. Le futur convient à l’enchaînement prophétique du contexte.
- source_word: פִּסְחִים בָּזְזוּ בַז
  choice: même les boiteux emporteront leur part de prise
  rationale: La formule souligne que la victoire sera si complète que même ceux qui boitent pourront participer à la prise du butin. « Leur part de prise » restitue naturellement l’objet apparenté au verbe hébreu.
theological_decisions: []
