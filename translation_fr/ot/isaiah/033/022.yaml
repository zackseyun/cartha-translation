id: ISA.33.22
reference: Isaiah 33:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י יְהוָה֙ שֹׁפְטֵ֔/נוּ יְהוָ֖ה מְחֹקְקֵ֑/נוּ יְהוָ֥ה מַלְכֵּ֖/נוּ ה֥וּא יוֹשִׁיעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/022.yaml
  text: For Yahweh is our judge[a]; Yahweh is our lawgiver; Yahweh is our king[b]; he will save us.
translation:
  language: fr
  text: 'Car Yahweh est notre juge, Yahweh est notre législateur, Yahweh est notre roi : c’est lui qui nous sauvera.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou le fondement de ce qui précède, sans préciser davantage la relation logique.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: שֹׁפְטֵנוּ
  choice: notre juge
  rationale: Conserve directement le titre judiciaire et la construction nominale concise de l’hébreu.
- source_word: מְחֹקְקֵנוּ
  choice: notre législateur
  rationale: Exprime celui qui édicte les lois ou les décrets; ce terme français actuel préserve le deuxième élément de la série judiciaire, législative et royale.
- source_word: מַלְכֵּנוּ
  choice: notre roi
  rationale: Conserve sans atténuation l’image monarchique du texte.
- source_word: הוּא
  choice: c’est lui
  rationale: Rend l’emploi explicite et emphatique du pronom hébreu dans la proposition finale.
- source_word: יוֹשִׁיעֵנוּ
  choice: qui nous sauvera
  rationale: Rend directement l’imparfait hiphil de ישׁע et garde la portée large du vocabulaire du salut.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa transcription le distingue des titres « juge », « législateur » et « roi » qui suivent.
- issue: Nuance de מְחֹקְקֵנוּ
  choice: notre législateur
  alternative: celui qui nous donne ses lois; notre souverain
  rationale: « Législateur » maintient le sens de celui qui édicte des prescriptions et préserve la progression des trois fonctions, sans réduire ce terme à l’idée générale de souverain.
- issue: Force du pronom הוּא
  choice: c’est lui qui nous sauvera
  alternative: il nous sauvera
  rationale: La tournure détachée reproduit naturellement en français l’accent porté par le pronom hébreu explicite, sans ajouter « lui-même ».
translation_notes:
  register: Français international moderne, digne et lisible. La répétition triple de « Yahweh est notre… » est maintenue pour préserver le rythme rhétorique; les deux-points mettent en relief la conclusion salvatrice.
