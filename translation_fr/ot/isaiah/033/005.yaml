id: ISA.33.5
reference: Isaiah 33:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: נִשְׂגָּ֣ב יְהוָ֔ה כִּ֥י שֹׁכֵ֖ן מָר֑וֹם מִלֵּ֣א צִיּ֔וֹן מִשְׁפָּ֖ט וּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/005.yaml
  text: Yahweh is exalted[a], for he dwells on high; he has filled Zion with justice and righteousness.
translation:
  language: fr
  text: Yahvé est exalté, car il demeure dans les hauteurs ; il a rempli Sion de justice et de droiture.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִשְׂגָּב
  choice: est exalté
  rationale: Le participe passif ou statif exprime la position souverainement élevée de Yahvé. « Est exalté » conserve à la fois l’image de hauteur et la valeur honorifique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: La translittération française usuelle du tétragramme préserve ici le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le motif de l’affirmation précédente ; « car » convient au registre poétique et reste naturel.
- source_word: שֹׁכֵן מָרוֹם
  choice: il demeure dans les hauteurs
  rationale: Le participe indique une demeure continue, tandis que מָרוֹם évoque le domaine élevé. Cette formulation conserve clairement l’image spatiale.
- source_word: מִלֵּא
  choice: il a rempli
  rationale: 'L’accompli hébreu présente l’action comme réalisée, avec un résultat qui demeure : Sion se trouve remplie de ces qualités.'
- source_word: צִיּוֹן
  choice: Sion
  rationale: La forme française traditionnelle du nom propre en préserve la portée géographique, poétique et théologique.
- source_word: מִשְׁפָּט
  choice: justice
  rationale: Dans cette paire, le terme désigne l’exercice du droit et un ordre social juste, non simplement un verdict judiciaire.
- source_word: צְדָקָה
  choice: droiture
  rationale: « Droiture » exprime la rectitude morale et permet de distinguer ce terme de מִשְׁפָּט sans réduire les deux mots à un seul concept français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme. Le rendre comme nom propre préserve sa fonction personnelle et relationnelle sans lui substituer un titre.
- issue: Distinction entre מִשְׁפָּט et צְדָקָה
  choice: justice et droiture
  alternative: droit et justice
  rationale: 'La traduction choisie maintient les deux dimensions de la paire hébraïque : l’ordre juste et la rectitude morale, sans les confondre ni imposer une interprétation confessionnelle.'
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe parallèle et le point-virgule rendent le mouvement du verset sans lourdeur archaïque.
