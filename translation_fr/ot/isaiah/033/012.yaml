  text: וְ/הָי֥וּ עַמִּ֖ים מִשְׂרְפ֣וֹת שִׂ֑יד קוֹצִ֥ים כְּסוּחִ֖ים בָּ/אֵ֥שׁ יִצַּֽתּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/012.yaml
  text: And the peoples will become burnings of lime; like cut thornbushes[a], they will be burned in the fire.
translation:
  language: fr
  text: Les peuples deviendront de la chaux calcinée ; comme des épines coupées, ils seront brûlés dans le feu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils s’enflammeront » ou « ils seront mis en feu ». Le verbe hébreu peut souligner le fait de prendre feu aussi bien que celui d’être livré aux flammes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: deviendront
  rationale: Avec un attribut nominal, היה exprime ici l’entrée dans un nouvel état sous l’effet du jugement ; « deviendront » rend cette transformation plus nettement que « seront ».
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel désigne collectivement des groupes humains ; « les peuples » en conserve la portée sans imposer le sens plus politique de « nations ».
- source_word: מִשְׂרְפוֹת שִׂיד
  choice: de la chaux calcinée
  rationale: L’expression hébraïque, très condensée, évoque la chaux produite par une cuisson intense. Cette formulation française garde l’image de destruction par le feu sans employer le peu naturel « combustions de chaux ».
- source_word: קוֹצִים כְּסוּחִים
  choice: comme des épines coupées
  rationale: קוֹצִים désigne des épines ou broussailles épineuses, et כְּסוּחִים signifie qu’elles ont été coupées. La formulation reste proche de l’image hébraïque et demeure naturelle en français.
- source_word: בָּאֵשׁ
  choice: dans le feu
  rationale: 'La préposition est rendue dans son sens locatif naturel : les épines coupées prennent feu au milieu des flammes.'
- source_word: יִצַּתּוּ
  choice: ils s’embraseront
  rationale: Le verbe peut décrire le fait de prendre feu ou d’être mis à feu. « S’embraseront » restitue vivement l’ignition tout en laissant l’autre nuance en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme et la force des deux images de combustion sont conservés, tandis que l’expression hébraïque condensée sur la chaux est rendue idiomatiquement.
