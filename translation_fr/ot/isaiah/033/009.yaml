id: ISA.33.9
reference: Isaiah 33:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָבַ֤ל אֻמְלְלָה֙ אָ֔רֶץ הֶחְפִּ֥יר לְבָנ֖וֹן קָמַ֑ל הָיָ֤ה הַ/שָּׁרוֹן֙ כָּֽ/עֲרָבָ֔ה וְ/נֹעֵ֥ר בָּשָׁ֖ן וְ/כַרְמֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/009.yaml
  text: The land mourns and withers[a]; Lebanon is ashamed and withers away. Sharon has become like the Arabah[b], and Bashan and Carmel shake off their leaves.
translation:
  language: fr
  text: Le pays est en deuil et dépérit ; le Liban, couvert de honte, se flétrit. Le Sharon est devenu comme l’Araba[a] ; le Bashan et le Carmel se dépouillent de leur feuillage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme la plaine désertique » ou « comme le désert ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le Bashan et le Carmel secouent » ; l’idée est qu’ils sont dépouillés de leur végétation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבַל
  choice: est en deuil
  rationale: Le verbe exprime couramment le deuil ou la lamentation. Cette formulation conserve la personnification poétique du pays tout en évoquant sa désolation.
- source_word: אֻמְלְלָה
  choice: dépérit
  rationale: Le verbe décrit un affaiblissement ou un flétrissement. « Dépérit » convient au paysage dévasté et s’accorde naturellement avec « est en deuil ».
- source_word: אֶרֶץ
  choice: le pays
  rationale: Dans ce contexte de jugement prophétique, le terme désigne plus vraisemblablement le territoire dévasté que la terre entière.
- source_word: הֶחְפִּיר
  choice: couvert de honte
  rationale: Le verbe signifie être honteux, humilié ou confondu. Appliqué au Liban, il prolonge la personnification du paysage.
- source_word: לְבָנוֹן
  choice: le Liban
  rationale: Forme française usuelle du nom géographique.
- source_word: קָמַל
  choice: se flétrit
  rationale: Ce terme lié à la végétation décrit ce qui se dessèche ou perd sa vigueur. « Se flétrit » restitue précisément l’image.
- source_word: הַשָּׁרוֹן
  choice: le Sharon
  rationale: Nom propre régional conservé sous sa forme française courante ; l’article hébreu est rendu en français.
- source_word: כָּעֲרָבָה
  choice: comme l’Araba
  rationale: Le terme peut désigner la dépression aride du Jourdain ou, plus largement, une plaine désertique. Le nom géographique préserve ici l’allusion, avec une explication en note.
- source_word: נֹעֵר
  choice: se dépouillent de leur feuillage
  rationale: Le verbe signifie secouer, faire tomber ou se débarrasser de quelque chose. Comme il s’applique au Bashan et au Carmel, le contexte suggère qu’ils perdent leur végétation ; l’ajout explicatif « de leur feuillage » rend l’image intelligible.
- source_word: בָּשָׁן
  choice: le Bashan
  rationale: Forme française usuelle du nom de la région.
- source_word: כַרְמֶל
  choice: le Carmel
  rationale: Forme française usuelle du nom propre ; « mont » n’est pas explicite dans l’hébreu.
