  text: לִבְּ/ךָ֖ יֶהְגֶּ֣ה אֵימָ֑ה אַיֵּ֤ה סֹפֵר֙ אַיֵּ֣ה שֹׁקֵ֔ל אַיֵּ֖ה סֹפֵ֥ר אֶת הַ/מִּגְדָּלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/018.yaml
  text: 'Your heart will meditate on terror: “Where is the scribe? Where is the one who weighs? Where is the one who counts the towers?”[a][b]'
translation:
  language: fr
  text: 'Ton cœur repensera à la terreur : « Où est le scribe ? Où est celui qui pèse ? Où est celui qui compte les tours ? »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « méditera sur la terreur » ou « murmurera au sujet de la terreur ». Le verbe hébreu peut désigner une réflexion intérieure ou une parole prononcée à voix basse.
    reason: lexical_alternative
  - marker: b
    text: « Le scribe… celui qui pèse… celui qui compte les tours » désigne probablement des fonctionnaires étrangers chargés d’évaluations, du tribut ou de calculs liés au siège.
    reason: cultural_note
lexical_decisions:
- source_word: לִבְּךָ
  choice: ton cœur
  rationale: Le terme hébreu désigne la personne intérieure, notamment le siège de la pensée. « Cœur » conserve l’image anthropologique de l’original.
- source_word: יֶהְגֶּה
  choice: repensera à
  rationale: Le verbe peut exprimer une réflexion intérieure ou une parole à voix basse. Dans ce contexte de souvenir rétrospectif, « repensera à » est naturel et fait ressortir l’idée de se remémorer la menace passée sans imposer un sens vocal.
- source_word: אֵימָה
  choice: la terreur
  rationale: Le nom exprime une peur intense ou l’effroi ; « terreur » en conserve la force.
- source_word: אַיֵּה
  choice: Où est
  rationale: L’interrogatif est répété devant trois désignations singulières. Sa reprise conserve la force rhétorique du texte.
- source_word: סֹפֵר
  choice: le scribe
  rationale: Le participe peut désigner celui qui écrit, consigne ou compte. « Scribe » convient à un fonctionnaire administratif tout en évitant de préciser indûment sa fonction.
- source_word: שֹׁקֵל
  choice: celui qui pesait
  rationale: Le participe signifie littéralement « celui qui pèse », probablement en rapport avec un tribut ou un paiement. La formulation verbale reste transparente et ne transforme pas l’activité en titre officiel certain.
- source_word: סֹפֵר אֶת הַמִּגְדָּלִים
  choice: celui qui comptait les tours
  rationale: Avec « les tours » comme complément, ספר prend naturellement le sens de compter ou recenser. L’imparfait français cadre avec l’évocation d’agents désormais disparus.
- source_word: הַמִּגְדָּלִים
  choice: les tours
  rationale: La traduction concrète conserve l’image hébraïque sans l’élargir interprétativement à l’ensemble des fortifications.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le futur « repensera » conserve la perspective du texte, tandis que les imparfaits dans les questions présentent ces personnages comme appartenant à la terreur passée. Les répétitions et les images administratives et militaires sont maintenues.
