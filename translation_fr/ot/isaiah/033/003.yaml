  variant: modern international French
source:
  edition: WLC
  text: מִ/קּ֣וֹל הָמ֔וֹן נָדְד֖וּ עַמִּ֑ים מֵ/ר֣וֹמְמֻתֶ֔/ךָ נָפְצ֖וּ גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/003.yaml
  text: At the sound of the tumult[a], peoples fled; at your rising up[b], nations were scattered.
translation:
  language: fr
  text: Au bruit du tumulte[a], des peuples ont fui ; devant ton élévation[b], des nations se sont dispersées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Au fracas de l’agitation » ; le mot hébreu peut désigner un tumulte, un grondement ou une foule en mouvement.
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause de ton élévation » ou « devant ton exaltation » ; l’hébreu peut évoquer soit le fait que Dieu se lève pour agir, soit la manifestation de sa majesté souveraine.
    reason: alternative_reading
lexical_decisions:
- source_word: מִקּוֹל
  choice: Au bruit de
  rationale: La préposition מִן avec קוֹל indique ici la cause ou l’occasion. « Au bruit de » exprime naturellement en français ce qui déclenche la fuite.
- source_word: הָמוֹן
  choice: du tumulte
  rationale: הָמוֹן peut évoquer une foule, un grondement ou une agitation bruyante. Dans ce contexte de fuite des peuples, « tumulte » rend à la fois le bruit et l’agitation.
- source_word: נָדְדוּ
  choice: ont fui
  rationale: Bien que le verbe puisse signifier errer ou s’éloigner, le contexte militaire et judiciaire favorise le sens de prendre la fuite.
- source_word: עַמִּים
  choice: des peuples
  rationale: « Peuples » conserve la distinction lexicale avec גּוֹיִם, rendu ensuite par « nations », sans nier le chevauchement de leurs sens.
- source_word: מֵרוֹמְמֻתֶךָ
  choice: quand tu t’es élevé
  rationale: Le terme dérivé de רום peut désigner l’action de s’élever ou l’exaltation. Cette formulation française reste vivante et préserve l’ambiguïté entre l’intervention active de Dieu et la manifestation de sa majesté.
- source_word: נָפְצוּ
  choice: se sont dispersées
  rationale: Le verbe peut évoquer la dispersion ou l’éclatement. Avec les nations comme sujet dans ce contexte, « se sont dispersées » exprime clairement le résultat sans imposer l’idée plus forte d’anéantissement.
- source_word: גּוֹיִם
  choice: des nations
  rationale: « Nations » est le terme français courant dans ce contexte et évite d’introduire la distinction ultérieure portée par « païens » ou « Gentils ».
theological_decisions:
- issue: Référent du suffixe de deuxième personne dans מֵרוֹמְמֻתֶךָ
  choice: L’adresse est laissée telle quelle et comprise principalement comme visant Dieu lorsqu’il se lève ou manifeste son élévation dans le jugement.
  alternative: Le suffixe pourrait viser Sion ou Jérusalem personnifiée.
  rationale: Le contexte immédiat met en avant l’intervention du Seigneur contre les nations ennemies. Le texte traduit conserve toutefois la simple deuxième personne et ne nomme pas explicitement le référent.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme « peuples / nations » est conservé, ainsi que l’ambiguïté de l’expression liée à l’élévation. Les passés composés donnent au vers une narration naturelle sans alourdir la formulation.
