  terminology: « Peuples » / « nations » préserve utilement la distinction formelle entre עמים et גוים. « Tumulte » convient à המון. « Élévation » évite de trancher indûment entre le relèvement pour agir et l’exaltation/majesté, sans imposer explicitement le référent divin.
  issues:
