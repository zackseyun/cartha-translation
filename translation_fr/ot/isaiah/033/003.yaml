  source_fidelity: 'Le parallélisme et les principaux lexèmes sont bien rendus : « au bruit du tumulte », « peuples », « nations » et la fuite/dispersion correspondent au texte hébreu. Cependant, « quand tu t’es élevé » transforme la préposition מן (« de/devant/en raison de ») en repère temporel et emploie un passé composé qui présente l’élévation comme un acte achevé. Une formulation causale ou circonstancielle est plus proche de מֵרֹמְמֻתֶךָ tout en préservant son ambiguïté sémantique.'
