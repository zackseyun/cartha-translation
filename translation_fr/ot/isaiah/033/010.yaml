  text: עַתָּ֥ה אָק֖וּם יֹאמַ֣ר יְהוָ֑ה עַתָּה֙ אֵֽרוֹמָ֔ם עַתָּ֖ה אֶנָּשֵֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/010.yaml
  text: Now I will arise[a], says Yahweh; now I will be exalted; now I will lift myself up.
translation:
  language: fr
  text: « Maintenant, je me lèverai, dit Yahvé ; maintenant, je m’élèverai ; maintenant, je serai élevé[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les deux derniers verbes hébreux sont étroitement apparentés et leurs nuances active, réflexive ou passive sont discutées. On peut aussi rendre le premier par « je serai exalté » et le second par « je m’élèverai ».
    reason: Précise l’alternative lexicale et de voix sans inverser l’ordre des verbes hébreux ni imposer une interprétation théologique.
lexical_decisions:
- source_word: עַתָּה
  choice: maintenant
  rationale: L’adverbe marque l’imminence de l’intervention divine. Sa triple répétition est conservée pour maintenir le rythme et la progression rhétorique.
- source_word: אָקוּם
  choice: je me lèverai
  rationale: Le qal inaccompli à la première personne de קום exprime ici l’entrée résolue de Dieu dans l’action. « Me lever » est naturel en français tout en gardant la solennité de l’image.
- source_word: יֹאמַר יְהוָה
  choice: dit Yahvé
  rationale: La formule prophétique est rendue au présent français, conformément à l’usage idiomatique dans une citation directe. Le nom divin est translittéré sous sa forme française courante « Yahvé ».
- source_word: אֵרוֹמָם
  choice: je m’élèverai
  rationale: La forme intensive de רום peut exprimer le fait de s’élever ou d’être élevé. La tournure pronominale préserve ici une nuance active ou réflexive sans surinterpréter le mécanisme de l’exaltation.
- source_word: אֶנָּשֵׂא
  choice: je serai élevé
  rationale: Le nifal inaccompli de נשׂא admet un sens passif ou réflexif. La formulation passive distingue ce verbe du précédent tout en conservant leur étroite proximité sémantique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. « Yahvé » en conserve la fonction de nom personnel dans une forme établie en français moderne, plutôt que de lui substituer un titre.
- issue: Rapport entre les deux derniers verbes d’élévation
  choice: « je m’élèverai » puis « je serai élevé »
  alternative: « je serai exalté » puis « je serai élevé »
  rationale: Les deux verbes hébreux sont distincts mais très proches par le sens. Le français maintient cette proximité tout en différenciant leur voix, sans déterminer plus précisément qui reconnaît ou manifeste l’élévation de Dieu.
translation_notes:
  register: Français international, actuel et digne. La triple reprise de « maintenant » ainsi que les trois propositions brèves conservent l’élan solennel et culminant de l’hébreu.
