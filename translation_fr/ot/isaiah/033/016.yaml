source:
  edition: WLC
  text: ה֚וּא מְרוֹמִ֣ים יִשְׁכֹּ֔ן מְצָד֥וֹת סְלָעִ֖ים מִשְׂגַּבּ֑/וֹ לַחְמ֣/וֹ נִתָּ֔ן מֵימָ֖י/ו נֶאֱמָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/016.yaml
  text: He will dwell on the heights[a]; rocky fortresses will be his refuge; his bread will be given[b], his water will be sure.
translation:
  language: fr
  text: Lui, il habitera sur les hauteurs ; les forteresses rocheuses seront son refuge[a] ; son pain lui sera donné, son eau ne manquera pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa citadelle élevée ». Le terme hébreu désigne un lieu élevé, sûr et protecteur.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ses eaux sont sûres » ; ou : « son eau sera fiable ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Lui, il
  rationale: Le pronom emphatique reprend l’homme juste décrit au verset précédent. La dislocation « Lui, il » restitue naturellement en français la mise en relief du pronom hébreu.
- source_word: מְרוֹמִים
  choice: sur les hauteurs
  rationale: Le pluriel désigne des lieux élevés ; cette formulation conserve l’image spatiale de sécurité.
- source_word: יִשְׁכֹּן
  choice: habitera
  rationale: L’imparfait qal exprime ici une demeure durable dans le cadre d’une promesse.
- source_word: מְצָדוֹת סְלָעִים
  choice: les forteresses rocheuses
  rationale: Le syntagme signifie littéralement « forteresses de rochers » et évoque des positions défensives inaccessibles.
- source_word: מִשְׂגַּבּוֹ
  choice: son refuge
  rationale: Le nom désigne un lieu élevé et sûr servant de protection ; « refuge » en rend clairement la fonction.
- source_word: לַחְמוֹ נִתָּן
  choice: son pain lui sera donné
  rationale: Le terme concret « pain » est conservé, et le passif prédicatif est rendu comme une promesse de provision.
- source_word: מֵימָיו נֶאֱמָנִים
  choice: son eau ne manquera pas
  rationale: Littéralement, les eaux sont « sûres, fiables ». En français, cette formulation exprime naturellement la fiabilité durable de l’approvisionnement.
theological_decisions:
- issue: Référent du pronom masculin singulier
  choice: L’homme juste décrit en Ésaïe 33.15
  alternative: Une affirmation générale sur toute personne juste, ou une application typologique au reste fidèle
  rationale: Le contexte immédiat décrit celui qui marche dans la justice, puis annonce sa sécurité et sa subsistance. Aucun référent divin ou messianique plus précis n’est imposé par le texte.
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme poétique et les images concrètes de hauteur, de forteresse, de pain et d’eau sont préservés.
