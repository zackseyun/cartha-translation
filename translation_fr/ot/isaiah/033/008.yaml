  text: נָשַׁ֣מּוּ מְסִלּ֔וֹת שָׁבַ֖ת עֹבֵ֣ר אֹ֑רַח הֵפֵ֤ר בְּרִית֙ מָאַ֣ס עָרִ֔ים לֹ֥א חָשַׁ֖ב אֱנֽוֹשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/008.yaml
  text: The highways lie desolate[a]; the traveler has ceased from the road. He has broken the covenant, despised the cities[b], and regarded no man.
translation:
  language: fr
  text: Les grandes routes sont désertes ; plus personne ne les emprunte. Il a rompu l’alliance, méprisé les villes[a] et n’a eu aucun égard pour l’être humain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines versions anciennes semblent refléter « les témoins » plutôt que « les villes ». Le texte massorétique porte « les villes ».
    reason: textual_variant
  - marker: b
    text: 'Hébreu : « homme » (ʾenosh), au singulier ; ce terme désigne ici l’être humain de manière générale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁמּוּ
  choice: sont désertes
  rationale: Le verbe exprime un état de désolation résultant d’une dévastation ou d’un abandon. Cette formulation française est naturelle et conserve ce sens résultatif.
- source_word: מְסִלּוֹת
  choice: les grandes routes
  rationale: Le nom désigne souvent des voies importantes ou aménagées, plutôt que de simples sentiers. « Grandes routes » convient au cadre des déplacements publics.
- source_word: שָׁבַת עֹבֵר אֹרַח
  choice: le voyageur ne passe plus sur les chemins
  rationale: La construction décrit littéralement celui qui parcourt une voie et dont le passage a cessé. « Ne passe plus » rend clairement la cessation tout en conservant le voyageur au singulier.
- source_word: הֵפֵר בְּרִית
  choice: Il a rompu l’alliance
  rationale: L’expression signifie rompre ou violer une alliance. « Alliance » préserve la portée biblique de בְּרִית sans exclure qu’il puisse s’agir ici d’un accord politique.
- source_word: מָאַס עָרִים
  choice: méprisé les villes
  rationale: Le texte massorétique porte עָרִים, « villes ». Le verbe מָאַס exprime ici le rejet ou le mépris ; « méprisé » en conserve la force.
- source_word: לֹא חָשַׁב אֱנוֹשׁ
  choice: n’a eu aucun égard pour l’homme
  rationale: L’expression indique l’absence de considération pour l’être humain. « L’homme » conserve le singulier אֱנוֹשׁ tout en ayant ici une valeur générique.
theological_decisions:
- issue: Valeur générique de אֱנוֹשׁ
  choice: l’homme
  alternative: personne ; l’être humain ; les humains
  rationale: Le nom hébreu est un singulier désignant un homme mortel, mais il a ici une portée générique. « L’homme » conserve à la fois le singulier et cette portée, explicitée en note.
- issue: Référent des verbes à la troisième personne du singulier dans la seconde moitié du verset
  choice: 'maintien d’un sujet masculin non précisé : « Il »'
  alternative: l’ennemi ; le traître ; celui qui a rompu l’alliance
  rationale: L’hébreu n’identifie pas explicitement le sujet dans ce verset. Le pronom « Il » préserve cette indétermination sans imposer une identification tirée du contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé, avec une ponctuation fluide. Les marqueurs de note [a] et [b] sont placés immédiatement après les expressions concernées.
