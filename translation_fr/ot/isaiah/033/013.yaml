  text: שִׁמְע֥וּ רְחוֹקִ֖ים אֲשֶׁ֣ר עָשִׂ֑יתִי וּ/דְע֥וּ קְרוֹבִ֖ים גְּבֻרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/013.yaml
  text: Hear[a], you who are far away, what I have done; and know, you who are near[b], my might.
translation:
  language: fr
  text: Écoutez, vous qui êtes loin, ce que j’ai fait ; et vous qui êtes près, reconnaissez[a] ma puissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sachez » ou « prenez conscience de ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ma force » ou « mon pouvoir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: Impératif masculin pluriel de שׁמע. « Écoutez » rend naturellement en français l’appel direct du discours prophétique.
- source_word: רְחוֹקִים
  choice: vous qui êtes loin
  rationale: Adjectif pluriel employé substantivement et comme vocatif. Cette formulation explicite les destinataires tout en conservant le contraste spatial avec « près ».
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: ce que j’ai fait
  rationale: Le relatif אֲשֶׁר suivi du parfait à la première personne se rend naturellement ainsi ; le passé composé présente l’action accomplie avec sa portée actuelle.
- source_word: וּדְעוּ
  choice: et … reconnaissez
  rationale: Impératif pluriel de ידע. Dans cet appel adressé à des témoins d’une action divine, « reconnaissez » exprime la prise de conscience demandée ; la note conserve le sens plus formel « sachez ».
- source_word: קְרוֹבִים
  choice: vous qui êtes près
  rationale: Adjectif pluriel substantivé, parallèle à רְחוֹקִים. La tournure française garde l’adresse directe et l’opposition entre ceux qui sont loin et ceux qui sont près.
- source_word: גְּבֻרָתִי
  choice: ma puissance
  rationale: גְּבוּרָה désigne la force ou la puissance manifeste. « Ma puissance » est idiomatique, digne et moins interprétatif que « mon exploit ».
theological_decisions:
- issue: Identité du locuteur indiquée par les formes à la première personne
  choice: Conserver « j’ai fait » et « ma puissance » sans ajouter le nom de Dieu.
  alternative: Expliciter « ce que le Seigneur a fait » ou « la puissance du Seigneur ».
  rationale: Le contexte identifie le locuteur au Seigneur, mais le verset hébreu ne répète pas son nom ; l’ajouter résoudrait explicitement ce que la ligne laisse contextuel.
- issue: Valeur de ידע dans l’injonction
  choice: « reconnaissez »
  alternative: « sachez » ou « prenez connaissance de »
  rationale: « Reconnaissez » convient à l’appel à constater la puissance révélée, sans aller jusqu’au sens confessionnel plus fort d’« avouez ». La note signale l’équivalent plus formel.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le parallélisme « loin / près » et les deux impératifs pluriels sont maintenus. Le point-virgule préserve les deux membres équilibrés de l’énoncé.
