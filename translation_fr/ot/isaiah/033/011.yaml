id: ISA.33.11
reference: Isaiah 33:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: תַּהֲר֥וּ חֲשַׁ֖שׁ תֵּ֣לְדוּ קַ֑שׁ רוּחֲ/כֶ֕ם אֵ֖שׁ תֹּאכַלְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/011.yaml
  text: You conceive chaff; you give birth to stubble[a]. Your breath is a fire that will consume you.
translation:
  language: fr
  text: Vous concevez de la balle, vous mettez au monde du chaume. Votre souffle[a] est un feu qui vous dévorera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre esprit ». Le mot hébreu peut signifier « souffle », « vent » ou « esprit ».
    reason: Alternative lexicale destinée à préserver l’étendue sémantique de רוּחַ.
lexical_decisions:
- source_word: תַּהֲרוּ
  choice: vous concevez
  rationale: Le verbe הרה désigne la conception ou la grossesse. « Vous concevez » conserve la métaphore de la gestation et prépare naturellement l’image de l’enfantement.
- source_word: חֲשַׁשׁ
  choice: de la balle
  rationale: Le nom désigne une matière végétale légère, sèche et facilement inflammable. « Balle » exprime ici à la fois l’inutilité du produit conçu et sa vulnérabilité au feu.
- source_word: תֵּלְדוּ
  choice: vous mettez au monde
  rationale: Le verbe ילד signifie enfanter. Cette formulation actuelle et explicite maintient l’image de l’accouchement sans lourdeur.
- source_word: קַשׁ
  choice: du chaume
  rationale: Le terme désigne de la paille ou des restes végétaux secs. « Chaume » se distingue de « balle » tout en prolongeant l’image de matières sans valeur qui brûlent aisément.
- source_word: רוּחֲכֶם
  choice: votre souffle
  rationale: רוּחַ peut signifier « souffle », « vent » ou « esprit ». « Souffle » préserve l’image concrète de ce qui émane des destinataires et devient l’instrument de leur propre destruction, sans exclure les autres nuances.
- source_word: אֵשׁ
  choice: un feu
  rationale: Le mot signifie directement « feu » ; l’article indéfini convient à la phrase attributive en français.
- source_word: תֹּאכַלְכֶם
  choice: qui vous dévorera
  rationale: Le verbe אכל signifie littéralement manger ou dévorer. Avec le feu pour sujet, « dévorera » reste naturel en français et conserve la vigueur de l’image hébraïque.
theological_decisions:
- issue: Sens de רוּחֲכֶם dans cette image de jugement
  choice: votre souffle
  alternative: votre esprit ; votre vent
  rationale: Le texte présente ce qui procède des destinataires comme le moyen de leur destruction. « Souffle » garde cette image concrète et la tension entre respiration, force intérieure et impulsion, au lieu de réduire d’emblée le terme à une faculté spirituelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme bref ainsi que les métaphores de la conception, de l’enfantement et du feu sont conservés.
