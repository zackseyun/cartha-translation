id: ISA.33.17
reference: Isaiah 33:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֶ֥לֶךְ בְּ/יָפְי֖/וֹ תֶּחֱזֶ֣ינָה עֵינֶ֑י/ךָ תִּרְאֶ֖ינָה אֶ֥רֶץ מַרְחַקִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/017.yaml
  text: Your eyes will behold the king in his beauty[a]; they will see a far-reaching land.
translation:
  language: fr
  text: Tes yeux contempleront le roi dans sa beauté ; ils verront un pays qui s’étend au loin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un pays lointain » ; plus littéralement, « un pays de grandes distances ».
    reason: Alternative lexicale pour אֶרֶץ מַרְחַקִּים, expression qui peut évoquer soit une vaste étendue, soit l’éloignement du pays.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: le roi
  rationale: Le nom signifie « roi ». Malgré l’absence d’article en hébreu, le contexte permet un sens défini ; la traduction ne précise toutefois pas l’identité du roi.
- source_word: בְּיָפְיוֹ
  choice: dans sa beauté
  rationale: Cette formulation conserve la construction hébraïque et laisse ouverte la nuance entre beauté, splendeur royale et dignité restaurée.
- source_word: תֶּחֱזֶינָה
  choice: contempleront
  rationale: Le verbe חזה peut évoquer une vision attentive, plus marquée qu’un simple regard. « Contempleront » rend cette nuance dans un français naturel et soutenu.
- source_word: עֵינֶיךָ
  choice: tes yeux
  rationale: L’hébreu nomme explicitement les yeux ; les conserver maintient l’image vive et le parallélisme du verset.
- source_word: תִּרְאֶינָה
  choice: ils verront
  rationale: Le pronom reprend « tes yeux » et reproduit clairement le parallélisme entre les deux propositions.
- source_word: אֶרֶץ
  choice: un pays
  rationale: אֶרֶץ peut désigner une terre ou un pays. « Un pays » convient ici au paysage territorial évoqué et respecte l’absence de détermination explicite.
- source_word: מַרְחַקִּים
  choice: qui s’étend au loin
  rationale: Le pluriel exprime des distances ou des étendues lointaines. Cette formulation naturelle préserve principalement l’idée d’ampleur, tandis que la note signale aussi la lecture possible d’un pays éloigné.
theological_decisions:
- issue: Identité du « roi »
  choice: Conserver « le roi » sans identifier son référent.
  alternative: Ézéchias dans sa splendeur restaurée, le Seigneur comme roi divin, ou un roi messianique et eschatologique.
  rationale: Le texte hébreu dit seulement « roi » dans ce verset. Ne pas préciser son identité préserve l’ambiguïté et la tension théologique du passage.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier rend le suffixe hébreu de deuxième personne du singulier. Le point-virgule conserve le parallélisme des deux propositions.
