source:
  edition: WLC
  text: אֶת עַ֥ם נוֹעָ֖ז לֹ֣א תִרְאֶ֑ה עַ֣ם עִמְקֵ֤י שָׂפָה֙ מִ/שְּׁמ֔וֹעַ נִלְעַ֥ג לָשׁ֖וֹן אֵ֥ין בִּינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/019.yaml
  text: You will no longer see the insolent people[a], a people of speech too deep to understand[c][b], of a stammering tongue without comprehension.
translation:
  language: fr
  text: Tu ne verras plus le peuple insolent[a], ce peuple au langage trop obscur pour être compris[b], à la langue balbutiante dont on ne saisit pas le sens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le peuple féroce » ou « le peuple provocateur ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « un peuple profond de lèvre »; la suite de l’expression hébraïque est difficile et évoque un langage qui échappe à l’audition ou à la compréhension.
    reason: lexical_alternative
  - marker: c
    text: Ou « à la langue moqueuse » ou « à la langue étrangère ». L’expression hébraïque est difficile et désigne probablement une langue étrangère que l’auditeur ne comprend pas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹעָז
  choice: insolent
  rationale: Le terme évoque une hardiesse arrogante ou intimidante. « Insolent » rend cette nuance sans réduire le mot au seul sens militaire de « féroce ».
- source_word: תִרְאֶה
  choice: tu ne verras plus
  rationale: ראה signifie normalement « voir ». Dans ce contexte, la négation indique que le destinataire n'aura plus à voir ni à affronter ce peuple; « plus » explicite naturellement cette portée en français.
- source_word: עַם ... עַם
  choice: le peuple ... ce peuple
  rationale: La répétition hébraïque est conservée, tandis que « ce peuple » relie naturellement l'apposition à son antécédent en français.
- source_word: עִמְקֵי שָׂפָה מִשְּׁמוֹעַ
  choice: au langage trop obscur pour être compris
  rationale: Littéralement, l'expression parle d'un peuple « profond de lèvre, loin de l'écoute ». Elle désigne idiomatiquement une parole inaccessible à l'auditeur; « obscur » préserve l'image de profondeur sans produire une formulation française opaque.
- source_word: נִלְעַג לָשׁוֹן
  choice: à la langue balbutiante
  rationale: L'expression difficile décrit vraisemblablement une langue étrangère perçue comme hachée ou inintelligible. « Balbutiante » garde l'image auditive traditionnelle sans affirmer qu'il s'agit d'un trouble réel de la parole.
- source_word: אֵין בִּינָה
  choice: dont on ne saisit pas le sens
  rationale: La formule indique ici l'absence d'intelligibilité pour l'auditeur. Cette tournure française évite d'attribuer absurdement un manque d'intelligence à la langue elle-même.
theological_decisions: []
