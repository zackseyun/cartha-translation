source:
  edition: WLC
  text: ה֣וֹי שׁוֹדֵ֗ד וְ/אַתָּה֙ לֹ֣א שָׁד֔וּד וּ/בוֹגֵ֖ד וְ/לֹא בָ֣גְדוּ ב֑/וֹ כַּ/הֲתִֽמְ/ךָ֤ שׁוֹדֵד֙ תּוּשַּׁ֔ד כַּ/נְּלֹתְ/ךָ֥ לִ/בְגֹּ֖ד יִבְגְּדוּ בָֽ/ךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/001.yaml
  text: Woe to you[a], destroyer, though you yourself have not been destroyed, and betrayer, though they have not betrayed you. When you finish destroying, you will be destroyed; when you cease betraying[c][b], they will betray you.
translation:
  language: fr
  text: Malheur à toi, dévastateur, qui n’as pas été dévasté ![b] Traître, que personne n’a trahi ![a] Quand tu auras fini de dévaster, tu seras dévasté ; quand tu auras cessé de trahir,[c] on te trahira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et l’on ne l’a pas trahi ». La traduction dans le texte suit l’interpellation directe et le parallélisme ; la lecture à la troisième personne reste possible.'
    reason: alternative_reading
  - marker: b
    text: On peut aussi traduire la famille de mots rendue par « dévastateur, dévasté » par « pillard, pillé ». Le terme hébreu peut désigner aussi bien la dévastation violente que le pillage.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « quand tu auras fini de trahir » ou « quand tu auras cessé d’agir avec perfidie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à toi
  rationale: Formule française consacrée et vigoureuse pour introduire une dénonciation prophétique ; elle conserve la force oraculaire de l’hébreu.
- source_word: שׁוֹדֵד / שָׁדוּד / תּוּשַּׁד
  choice: dévastateur / dévasté / tu seras dévasté
  rationale: « Dévaster » couvre la violence destructrice et la spoliation du radical hébreu, tout en permettant de préserver en français sa répétition et le renversement rhétorique.
- source_word: בּוֹגֵד / בגד
  choice: traître / trahir
  rationale: Cette famille lexicale naturelle en français restitue la perfidie exprimée par le radical hébreu et maintient sa répétition dans les deux moitiés du verset.
- source_word: בָגְדוּ בוֹ
  choice: que personne n’a trahi
  rationale: La formulation suit l’interpellation directe et le parallélisme du verset. Le texte consonantique porte toutefois un suffixe de troisième personne, signalé en note.
- source_word: כַּהֲתִמְךָ
  choice: Quand tu auras fini
  rationale: Rend naturellement la construction temporelle et l’idée d’achèvement de l’action.
- source_word: כַּנְּלֹתְךָ לִבְגֹּד
  choice: quand tu auras cessé de trahir
  rationale: Exprime l’achèvement ou la cessation de la conduite perfide sans imposer une nuance plus précise que l’hébreu.
- source_word: יִבְגְּדוּ בָךְ
  choice: on te trahira
  rationale: 'Le pronom indéfini français rend naturellement le pluriel non spécifié de l’hébreu, tout en conservant le renversement : celui qui trahit sera trahi.'
