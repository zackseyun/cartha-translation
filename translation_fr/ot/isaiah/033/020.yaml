source:
  edition: WLC
  text: חֲזֵ֣ה צִיּ֔וֹן קִרְיַ֖ת מֽוֹעֲדֵ֑/נוּ עֵינֶי/ךָ֩ תִרְאֶ֨ינָה יְרוּשָׁלִַ֜ם נָוֶ֣ה שַׁאֲנָ֗ן אֹ֤הֶל בַּל יִצְעָן֙ בַּל יִסַּ֤ע יְתֵֽדֹתָי/ו֙ לָ/נֶ֔צַח וְ/כָל חֲבָלָ֖י/ו בַּל יִנָּתֵֽקוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/020.yaml
  text: Look upon Zion[a], the city of our appointed feasts; your eyes will see Jerusalem, a quiet habitation, a tent that will not be moved; its stakes will never be pulled up[c][b], and none of its ropes will be torn apart.
translation:
  language: fr
  text: 'Contemple Sion[a], la ville de nos fêtes solennelles ; tes yeux verront Jérusalem, une demeure paisible[b], une tente qui ne sera pas déplacée : jamais ses piquets ne seront arrachés, et aucune de ses cordes ne sera rompue[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ville de nos temps fixés », « la ville de nos assemblées fixées » ou « la ville de nos fêtes ». Le mot hébreu peut désigner des temps déterminés ou des rassemblements, notamment dans le cadre du culte.
    reason: lexical_alternative
  - marker: b
    text: Ou « demeure tranquille » ou « demeure sûre ». Le terme hébreu évoque le calme, l’absence de trouble et la sécurité.
    reason: lexical_alternative
  - marker: c
    text: 'L’hébreu décrit la permanence de Jérusalem par l’image d’une tente : ses piquets ne seront pas arrachés et ses cordes ne seront pas rompues.'
    reason: cultural_note
lexical_decisions:
- source_word: חֲזֵה
  choice: Contemple
  rationale: L’impératif appelle directement le destinataire à porter son regard sur Sion. « Contemple » garde cette force tout en convenant au registre poétique et digne du passage.
- source_word: קִרְיַת מוֹעֲדֵנוּ
  choice: la ville de nos fêtes fixées
  rationale: מוֹעֵד désigne un temps ou un rassemblement fixé, souvent cultuel. « Fêtes fixées » conserve à la fois l’idée de calendrier établi et le contexte de célébration, sans réduire le terme aux seules assemblées.
- source_word: עֵינֶיךָ תִרְאֶינָה
  choice: tes yeux verront
  rationale: La formulation maintient les yeux comme sujet explicite, conformément à l’accent concret de l’hébreu.
- source_word: נָוֶה
  choice: demeure
  rationale: « Demeure » exprime naturellement le lieu d’habitation, sans imposer la nuance pastorale que le mot peut avoir ailleurs.
- source_word: שַׁאֲנָן
  choice: paisible
  rationale: L’adjectif évoque le calme, l’absence de trouble et, par implication, la sécurité. « Paisible » rend directement la tranquillité sans expliciter excessivement la sécurité.
- source_word: אֹהֶל
  choice: tente
  rationale: Le sens ordinaire est « tente », confirmé par les piquets et les cordes qui suivent. « Tabernacle » introduirait ici une spécialisation cultuelle non requise.
- source_word: בַּל יִצְעָן
  choice: qui ne sera pas déplacée
  rationale: Le verbe rare semble évoquer le déplacement ou l’errance. Dans l’image d’une tente durable, « ne sera pas déplacée » reste précis et préserve la possible nuance de mobilité empêchée.
- source_word: בַּל יִסַּע יְתֵדֹתָיו לָנֶצַח
  choice: jamais ses piquets ne seront arrachés
  rationale: נסע appliqué aux piquets évoque leur retrait lorsqu’on lève le camp. « Arrachés » rend concrètement ce geste, tandis que « jamais » exprime naturellement לָנֶצַח dans une proposition négative.
- source_word: וְכָל חֲבָלָיו בַּל יִנָּתֵקוּ
  choice: et aucune de ses cordes ne sera rompue
  rationale: La tournure française « aucune… ne » rend idiomatiquement l’hébreu « toutes… ne seront pas ». Les cordes appartiennent à l’image de la tente, et נתק au niphal indique ici la rupture ou l’arrachement.
theological_decisions:
- issue: Portée de l’image de Sion et de Jérusalem
  choice: Présenter Jérusalem comme une demeure paisible et stable au moyen de l’image concrète d’une tente inébranlable.
  alternative: Préciser dans le texte qu’il s’agit exclusivement soit d’une restauration historique et politique, soit du peuple de Dieu dans son accomplissement eschatologique.
  rationale: Le verset promet la stabilité de Jérusalem sans définir à lui seul toute la portée historique ou eschatologique de cette promesse. La traduction conserve donc l’image et sa tension théologique sans l’allégoriser ni la restreindre.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier reproduit la deuxième personne masculine singulière de l’hébreu. La ponctuation met en relief l’explication métaphorique de la « demeure paisible » par l’image de la tente.
