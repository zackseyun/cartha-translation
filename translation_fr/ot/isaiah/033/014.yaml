source:
  edition: WLC
  text: פָּחֲד֤וּ בְ/צִיּוֹן֙ חַטָּאִ֔ים אָחֲזָ֥ה רְעָדָ֖ה חֲנֵפִ֑ים מִ֣י יָג֣וּר לָ֗/נוּ אֵ֚שׁ אוֹכֵלָ֔ה מִי יָג֥וּר לָ֖/נוּ מוֹקְדֵ֥י עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/014.yaml
  text: 'Sinners in Zion are afraid[d][c][b][a]; trembling has seized the godless: “Who among us can dwell with a consuming fire? Who among us can dwell with everlasting burnings?”'
translation:
  language: fr
  text: 'Dans Sion, les pécheurs ont peur ; le tremblement a saisi les impies[a] : « Qui de nous peut demeurer[b] auprès d’un feu dévorant[c] ? Qui de nous peut demeurer auprès de brasiers éternels[d] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des hypocrites ». Le terme hébreu peut désigner les impies ou les irréligieux, et pas seulement les personnes qui manquent de sincérité.
    reason: lexical_alternative
  - marker: b
    text: Ou « séjourner ». Le verbe hébreu peut signifier séjourner, habiter ou demeurer.
    reason: lexical_alternative
  - marker: c
    text: L’expression « feu dévorant » rappelle le langage biblique employé pour la présence sainte de Dieu qui juge ; voir Deutéronome 4.24 et Hébreux 12.29.
    reason: cross_reference
  - marker: d
    text: Ou « des flammes perpétuelles » ou « des embrasements éternels ».
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּחֲדוּ בְצִיּוֹן חַטָּאִים
  choice: Dans Sion, les pécheurs sont saisis de peur
  rationale: Le parfait exprime ici une peur qui s’est emparée d’eux et dont l’effet demeure. « Dans Sion » rend naturellement la localisation.
- source_word: אָחֲזָה רְעָדָה
  choice: un tremblement s’empare
  rationale: Cette formulation conserve l’image concrète de la saisie tout en restant idiomatique en français.
- source_word: חֲנֵפִים
  choice: les impies
  rationale: Le terme désigne ici des personnes irréligieuses ou moralement profanes, et pas nécessairement des personnes simplement hypocrites.
- source_word: מִי יָגוּר לָנוּ
  choice: Qui de nous peut demeurer
  rationale: גור peut signifier séjourner ou demeurer. « Qui de nous » rend le pronom communautaire sans imposer une analyse trop étroite de sa fonction.
- source_word: אֵשׁ אוֹכֵלָה
  choice: un feu dévorant
  rationale: « Feu dévorant » restitue directement le participe hébreu et constitue une expression française naturelle pour cette image de destruction et de sainteté redoutable.
- source_word: מוֹקְדֵי עוֹלָם
  choice: des brasiers éternels
  rationale: « Brasiers » préserve le pluriel concret de l’hébreu, tandis qu’« éternels » rend la durée exprimée par עוֹלָם sans préciser davantage la nature de ces feux.
theological_decisions:
- issue: Référent du feu dévorant et des brasiers éternels
  choice: La traduction laisse les images désigner la présence sainte et redoutable de Dieu ainsi que son jugement, sans les expliciter dans le corps du verset.
  alternative: Comprendre ces images plus étroitement comme le feu du châtiment divin ou comme une allusion aux feux de l’autel de Sion.
  rationale: Le contexte présente la présence de YHWH comme redoutable pour les pécheurs, et le verset suivant décrit celui qui peut habiter dans cette présence. Le maintien de la métaphore préserve la tension du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme des deux questions est conservé, de même que les images concrètes de la peur, du tremblement et du feu.
