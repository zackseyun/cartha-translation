source:
  edition: WLC
  text: וְ/הָיָה֙ אֱמוּנַ֣ת עִתֶּ֔י/ךָ חֹ֥סֶן יְשׁוּעֹ֖ת חָכְמַ֣ת וָ/דָ֑עַת יִרְאַ֥ת יְהוָ֖ה הִ֥יא אוֹצָרֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/006.yaml
  text: And he will be the stability of your times[a], a wealth of salvation, wisdom, and knowledge[c][b]; the fear of Yahweh is his treasure.
translation:
  language: fr
  text: Il sera la stabilité de ton époque[a], une abondance de salut[b], de sagesse et de connaissance ; la crainte de Yahvé est son trésor[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Il y aura de la stabilité à ton époque » ; le verbe hébreu peut être compris de manière impersonnelle.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu porte le pluriel « saluts », qui peut évoquer un salut abondant ou de nombreuses délivrances.
    reason: lexical_alternative
  - marker: c
    text: 'Le suffixe hébreu signifie « son », mais son référent précis est discuté : il peut notamment renvoyer à Yahvé ou à la personne évoquée dans le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Il sera
  rationale: Le verbe est au masculin singulier et peut renvoyer personnellement à Yahvé dans le contexte. La note conserve toutefois la lecture impersonnelle possible.
- source_word: אֱמוּנַת עִתֶּיךָ
  choice: la stabilité de ton époque
  rationale: אֱמוּנָה exprime ici la fermeté ou la sûreté objective. Le singulier collectif « époque » rend naturellement le pluriel hébreu « tes temps » tout en conservant l’adresse au masculin singulier.
- source_word: חֹסֶן
  choice: une abondance de
  rationale: Le nom peut désigner richesse, réserve ou abondance. « Une abondance de » s’intègre naturellement à l’énumération abstraite qui suit.
- source_word: יְשׁוּעוֹת
  choice: salut
  rationale: Le pluriel hébreu peut avoir une valeur intensive ou désigner de multiples délivrances. Le singulier collectif « salut » est idiomatique en français, avec l’autre possibilité signalée en note.
- source_word: חָכְמַת וָדָעַת
  choice: de sagesse et de connaissance
  rationale: Ces substantifs coordonnés complètent naturellement « une abondance de » en français.
- source_word: יִרְאַת יְהוָה
  choice: la crainte de Yahvé
  rationale: L’expression désigne une crainte révérencielle envers Dieu. « Yahvé » est la forme française courante du nom divin יהוה.
- source_word: הִיא אוֹצָרוֹ
  choice: est son trésor
  rationale: Le pronom féminin reprend « la crainte », tandis que le suffixe masculin singulier de « trésor » renvoie à un référent masculin que le verset ne précise pas explicitement.
theological_decisions:
- issue: Sujet de וְהָיָה
  choice: « Il sera », avec Yahvé comme référent contextuel
  alternative: « Il y aura de la stabilité à ton époque »
  rationale: Le masculin singulier permet une lecture personnelle, mais la construction peut aussi être comprise impersonnellement. La traduction retient la première sans supprimer la seconde.
- issue: Référent du suffixe dans אוֹצָרוֹ
  choice: « son trésor » sans expliciter le possesseur
  alternative: Le trésor de Yahvé, du roi ou de l’homme auquel le passage s’adresse
  rationale: Le suffixe est masculin singulier, mais son antécédent n’est pas exprimé sans équivoque. Le français « son » préserve cette indétermination.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement singulier reflète le suffixe hébreu de deuxième personne masculine singulière. La formulation garde les ambiguïtés réelles du sujet initial et du possesseur final.
