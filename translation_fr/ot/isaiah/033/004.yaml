  text: And your spoil will be gathered like the gathering of locusts[a]; like the rushing of swarms[b], they rush upon it.
translation:
  language: fr
  text: Votre butin sera ramassé comme on ramasse les criquets[a] ; comme les nuées se précipitent, on se précipitera sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le rassemblement du criquet dévastateur » ; le terme hébreu חָסִיל peut désigner une espèce ou un stade particulier du criquet.
    reason: lexical_alternative
  - marker: b
    text: 'La seconde comparaison est difficile en hébreu. On peut aussi traduire : « comme l’assaut des criquets, ils se précipitent sur lui » ou « comme des criquets qui courent en tous sens sur lui ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֻסַּף
  choice: sera ramassé
  rationale: Le passif de אסף exprime ici, dans le contexte, une action à venir. « Ramasser » convient au butin et permet de conserver l’écho avec le nom verbal suivant.
- source_word: שְׁלַלְכֶם
  choice: votre butin
  rationale: שׁלל désigne couramment le butin pris à la guerre ; « butin » est naturel et précis en français.
- source_word: אֹסֶף
  choice: comme ramasse
  rationale: Le nom d’action apparenté à אסף renforce le verbe précédent. Une tournure verbale française conserve l’écho lexical sans produire l’expression peu naturelle « comme le ramassage ».
- source_word: הֶחָסִיל
  choice: le criquet dévastateur
  rationale: חָסִיל peut désigner une espèce ou un stade particulier du criquet et évoque ce qui dévore. Le singulier collectif respecte l’article et la forme hébraïque tout en restant intelligible.
- source_word: כְּמַשַּׁק
  choice: comme ... se ruent
  rationale: Le nom rare semble évoquer une ruée, un assaut ou un mouvement impétueux. La formulation verbale restitue cette image avec naturel.
- source_word: גֵּבִים
  choice: les nuées
  rationale: Ce terme rare et difficile semble désigner ici des groupes grouillants, probablement des nuées de criquets. « Nuées » maintient l’image sans préciser au-delà de ce que permet le texte.
- source_word: שׁוֹקֵק
  choice: on se ruera
  rationale: Le participe décrit un mouvement vif et répété. Le pronom indéfini « on » évite d’ajouter un sujet humain explicite absent de l’hébreu.
- source_word: בּוֹ
  choice: sur lui
  rationale: Le suffixe renvoie vraisemblablement au butin ; « sur lui » convient à l’image d’une ruée vers le butin.
