revisions:
- from: Votre butin sera ramassé comme ramasse le criquet dévastateur[a] ; comme les nuées se ruent, on se ruera sur lui[b].
  to: Votre butin sera ramassé comme on ramasse les criquets[a] ; comme les nuées se précipitent, on se précipitera sur lui[b].
  rationale: 'La correction nécessaire porte principalement sur la syntaxe et le sens de la première comparaison : le butin est recueilli à la manière d’une collecte de criquets, non par un criquet qui recueillerait. Les notes sont ajustées afin que l’alternative réelle soit signalée et que les difficultés lexicales de la seconde image soient conservées.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:08Z'
review_pass:
  verdict: revise
  source_fidelity: 'La première comparaison du projet inverse la relation exprimée par le nom d’action אֹסֶף : « comme ramasse le criquet » fait du criquet celui qui ramasse, tandis que le texte compare le rassemblement du butin à la collecte/destruction associée aux criquets. La révision restitue cette relation sans forcer une identification plus précise de חָסִיל. Dans la seconde comparaison, גֵּבִים et כְּמַשַּׁק demeurent difficiles ; « nuées » et une formulation de mouvement conservent utilement cette indétermination. Le pronom « lui » peut renvoyer au butin.'
  naturalness: « Comme on ramasse les criquets » est idiomatique en français moderne et garde l’effet du passif initial suivi du nom d’action apparenté. « Comme les nuées se précipitent, on se précipitera sur lui » est plus cohérent syntaxiquement que l’alternance du présent pluriel (« les nuées se ruent ») et du futur impersonnel du projet.
  terminology: « Butin » est exact dans le contexte martial. « Criquets » est un rendu moderne approprié de חָסִיל, avec une note qui préserve la possibilité d’une variété ou d’un stade particulier. « Nuées » reste une solution prudente pour le terme rare גֵּבִים, sans imposer une interprétation zoologique définitive.
  issues:
  - severity: high
    issue: La première comparaison attribue l’action de ramasser au criquet.
    rationale: « comme ramasse le criquet dévastateur » signifie que le criquet ramasse le butin. Or אֹסֶף הֶחָסִיל désigne le rassemblement/collecte associé au criquet ; la comparaison doit porter sur la façon dont le butin est ramassé.
  - severity: medium
    issue: La note a ne correspond pas à la leçon principale proposée.
    rationale: Elle présente « comme on ramasse les criquets » comme une alternative alors que cette formulation rend plus fidèlement et plus naturellement la relation syntaxique du texte.
  - severity: low
    issue: La seconde phrase mêle deux sujets et deux repères temporels sans nécessité.
    rationale: « comme les nuées se ruent, on se ruera » est possible, mais « se précipitent / se précipitera » assure une meilleure cohérence tout en préservant l’image et l’indétermination du sujet.
  revised_text: Votre butin sera ramassé comme on ramasse les criquets[a] ; comme les nuées se précipitent, on se précipitera sur lui[b].
  revised_footnotes:
  - marker: a
    text: Ou « comme le rassemblement du criquet dévastateur » ; le terme hébreu חָסִיל peut désigner une espèce ou un stade particulier du criquet.
    reason: lexical_alternative
  - marker: b
    text: 'La seconde comparaison est difficile en hébreu. On peut aussi traduire : « comme l’assaut des criquets, ils se précipitent sur lui » ou « comme des criquets qui courent en tous sens sur lui ».'
    reason: alternative_reading
  revision_rationale: 'La correction nécessaire porte principalement sur la syntaxe et le sens de la première comparaison : le butin est recueilli à la manière d’une collecte de criquets, non par un criquet qui recueillerait. Les notes sont ajustées afin que l’alternative réelle soit signalée et que les difficultés lexicales de la seconde image soient conservées.'
