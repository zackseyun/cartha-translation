id: ISA.33.21
reference: Isaiah 33:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אִם שָׁ֞ם אַדִּ֤יר יְהוָה֙ לָ֔/נוּ מְקוֹם נְהָרִ֥ים יְאֹרִ֖ים רַחֲבֵ֣י יָדָ֑יִם בַּל תֵּ֤לֶךְ בּ/וֹ֙ אֳנִי שַׁ֔יִט וְ/צִ֥י אַדִּ֖יר לֹ֥א יַעַבְרֶֽ/נּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/021.yaml
  text: But there the majestic Yahweh will be for us a place of rivers[a], of broad streams, where no rowing ship can go[c][b], and no mighty vessel can pass through.
translation:
  language: fr
  text: Mais là, Yahweh dans sa majesté sera pour nous un lieu de fleuves et de larges cours d’eau[a]. Aucun navire à rames[b] n’y circulera, et aucun puissant vaisseau ne le traversera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « larges de mains », expression qui évoque des cours d’eau très larges.
    reason: cultural_note
  - marker: b
    text: Ou « navire à avirons »; l’expression hébraïque désigne un bâtiment employé à la navigation active.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Mais
  rationale: La locution marque ici un contraste appuyé avec ce qui précède; « Mais » le rend naturellement en français.
- source_word: שָׁם
  choice: là
  rationale: Conserve l’insistance locale qui renvoie à Sion.
- source_word: אַדִּיר יְהוָה
  choice: Yahweh dans sa majesté
  rationale: אַדִּיר exprime la majesté, la puissance ou la noblesse. Cette formulation française naturelle garde la qualification étroitement liée à Yahweh sans réduire le terme à la seule force militaire.
- source_word: לָנוּ
  choice: pour nous
  rationale: Le lamed indique ici l’avantage ou le bénéfice accordé au peuple.
- source_word: מְקוֹם נְהָרִים יְאֹרִים
  choice: un lieu de fleuves et de cours d’eau
  rationale: Conserve le substantif מְקוֹם et l’image audacieuse de Yahweh comme lieu protecteur caractérisé par des eaux défensives.
- source_word: רַחֲבֵי יָדָיִם
  choice: larges
  rationale: L’expression signifie littéralement « larges de mains/côtés » et décrit la grande largeur des cours d’eau.
- source_word: אֳנִי שַׁיִט
  choice: navire à rames
  rationale: Désigne un bâtiment utilisé pour la navigation active, vraisemblablement mû par des rames; cette expression est claire sans imposer le type historique plus précis de la galère.
- source_word: וְצִי אַדִּיר
  choice: et aucun puissant vaisseau
  rationale: צִי désigne un navire ou vaisseau, tandis que אַדִּיר souligne sa puissance ou son caractère imposant.
- source_word: לֹא יַעַבְרֶנּוּ
  choice: ne le traversera
  rationale: Le suffixe masculin singulier renvoie naturellement au lieu ou à l’espace aquatique évoqué; « traverser » rend directement le mouvement de passage.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin personnel; sa translittération le distingue d’un simple titre.
- issue: Image de Yahweh comme lieu de cours d’eau protecteurs
  choice: sera pour nous un lieu de fleuves et de larges cours d’eau
  alternative: sera pour nous comme un lieu de fleuves et de larges cours d’eau
  rationale: L’hébreu ne contient aucun marqueur explicite de comparaison. La formulation maintient donc la métaphore directe et sa tension poétique au lieu de la transformer en comparaison.
- issue: Relation syntaxique de אַדִּיר à יְהוָה
  choice: Yahweh dans sa majesté
  alternative: le majestueux Yahweh
  rationale: Les deux analyses expriment la qualification de Yahweh par אַדִּיר. Le choix retenu est plus idiomatique en français avec le nom propre tout en préservant la nuance de majesté.
translation_notes:
  register: Français international moderne, digne et poétique. La métaphore inhabituelle de Yahweh comme « lieu » de fleuves est conservée, tandis que la ponctuation en deux phrases clarifie l’image sans en modifier le contenu.
