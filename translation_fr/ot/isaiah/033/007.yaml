  text: הֵ֚ן אֶרְאֶלָּ֔ם צָעֲק֖וּ חֻ֑צָ/ה מַלְאֲכֵ֣י שָׁל֔וֹם מַ֖ר יִבְכָּיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/007.yaml
  text: Look[a], their heroes cry out outside[b]; the messengers of peace weep bitterly.
translation:
  language: fr
  text: 'Voici : leurs héros[a] crient au-dehors ; les messagers de paix[b] pleurent amèrement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « leurs héros » est incertain ; il peut aussi désigner « leurs hommes vaillants » ou, plus littéralement, quelque chose comme « leurs Ariels » ou « leurs lions de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les envoyés de paix » ou « les ambassadeurs de paix ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: Cette interjection attire vivement l’attention sur la scène. « Voyez » est naturel en français moderne et conserve cette force déictique.
- source_word: אֶרְאֶלָּם
  choice: leurs héros
  rationale: Le terme est rare et incertain. Dans ce contexte de détresse nationale et d’échec diplomatique, il désigne vraisemblablement des hommes vaillants ou des champions ; le suffixe pronominal donne « leurs ».
- source_word: צָעֲקוּ
  choice: crient
  rationale: Le parfait hébreu décrit un cri de détresse. Le présent français rend bien la vivacité du tableau prophétique.
- source_word: חֻצָה
  choice: au-dehors
  rationale: L’adverbe indique ce qui se passe à l’extérieur ou dans l’espace public. « Au-dehors » reste proche du sens sans préciser indûment qu’il s’agit de rues.
- source_word: מַלְאֲכֵי שָׁלוֹם
  choice: les messagers de paix
  rationale: Dans le contexte politique, il s’agit probablement d’envoyés humains chargés de négocier la paix. « Messagers de paix » conserve toutefois la largeur du terme hébreu.
- source_word: מַר
  choice: amèrement
  rationale: L’adjectif est employé adverbialement pour qualifier les pleurs ; « pleurent amèrement » est idiomatique en français.
- source_word: יִבְכָּיוּן
  choice: pleurent
  rationale: L’imparfait hébreu peut exprimer ici une action présente dépeinte avec vivacité. Le présent s’accorde avec le premier membre du verset.
theological_decisions:
- issue: Identité de אֶרְאֶלָּם
  choice: Des héros ou hommes vaillants humains
  alternative: Leurs hommes d’Ariel, leurs lions de Dieu, ou les gens d’Ariel
  rationale: Le contexte immédiat évoque la dévastation, l’échec des négociations et la lamentation publique. L’interprétation comme champions humains s’accorde le mieux avec les envoyés de paix du second membre, mais l’incertitude lexicale est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé, ainsi que le présent de narration prophétique. « Au-dehors » évite d’ajouter la précision « dans les rues », qui n’est pas imposée par l’hébreu.
