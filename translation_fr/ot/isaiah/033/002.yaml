id: ISA.33.2
reference: Isaiah 33:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָ֥ה חָנֵּ֖/נוּ לְ/ךָ֣ קִוִּ֑ינוּ הֱיֵ֤ה זְרֹעָ/ם֙ לַ/בְּקָרִ֔ים אַף יְשׁוּעָתֵ֖/נוּ בְּ/עֵ֥ת צָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/002.yaml
  text: O Yahweh[a], be gracious to us; we wait for you. Be our arm every morning, also our salvation in the time of distress.
translation:
  language: fr
  text: Yahvé, fais-nous grâce ! Nous t’attendons. Sois leur bras[a] chaque matin, sois aussi notre salut au temps de la détresse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu porte « leur bras ». Certains comprennent ce pronom comme une désignation collective du peuple qui prie et traduisent : « notre bras ».'
    reason: Signaler la variation d’interprétation sans effacer le suffixe du texte massorétique.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Le nom divin est translittéré sous sa forme française courante, conformément à l’adresse directe de la prière.
- source_word: חָנֵּנוּ
  choice: fais-nous grâce
  rationale: L’impératif de חנן demande la faveur bienveillante de Dieu ; cette formulation est naturelle, concise et conserve le vocabulaire de la grâce.
- source_word: לְךָ קִוִּינוּ
  choice: nous t’attendons
  rationale: קוה associe l’attente à l’espérance confiante. « Nous t’attendons » conserve l’image verbale sans la réduire à un simple sentiment d’espoir.
- source_word: זְרֹעָם
  choice: leur bras
  rationale: Le texte massorétique porte un suffixe de troisième personne du pluriel. Le nom « bras » maintient l’image hébraïque de la force et de la puissance secourable.
- source_word: לַבְּקָרִים
  choice: chaque matin
  rationale: Le pluriel hébreu exprime ici la répétition ; « chaque matin » est l’équivalent idiomatique naturel en français.
- source_word: אַף יְשׁוּעָתֵנוּ
  choice: sois aussi notre salut
  rationale: אַף ajoute une seconde demande, tandis que יְשׁוּעָה désigne le salut ou la délivrance. « Salut » en préserve la portée large.
- source_word: בְּעֵת צָרָה
  choice: au temps de la détresse
  rationale: Cette expression rend le cadre temporel et la gravité de צָרָה dans un registre digne et actuel.
theological_decisions:
- issue: Le pronom suffixé dans זְרֹעָם
  choice: leur bras
  alternative: notre bras
  rationale: Le texte massorétique se lit naturellement « leur bras », malgré le passage de « nous » à « leur ». Cette tension grammaticale est conservée dans le texte, tandis que la lecture contextuellement harmonisée « notre bras » est signalée en note.
translation_notes:
  register: Français international moderne, dans un registre de prière digne et accessible. La métaphore concrète du « bras » et le changement de personne du texte hébreu sont volontairement préservés.
