    issue: «crimes de sang» restreint indûment דָּמִים
    rationale: L’hébreu «sangs» peut évoquer le sang versé, la violence meurtrière ou la responsabilité qui en découle; l’expression française «crimes de sang» tend à désigner une catégorie pénale précise.
  - severity: low
    issue: Formulation des mains et du pot-de-vin légèrement peu idiomatique
    rationale: «Pour ne pas recevoir de pot-de-vin» exprime plus naturellement en français le refus de saisir ou d’accepter le pot-de-vin.
  - severity: low
    issue: 'Note a: littéralité excessive'
    rationale: Le pluriel צְדָקוֹת peut avoir une valeur qualitative; «actes de justice» est une possibilité interprétative, non une restitution littérale imposée.
