  verdict: revise
  source_fidelity: Le projet rend fidèlement la chaîne de participes éthiques, les images corporelles et la progression vers le verset suivant. «Crimes de sang» est toutefois plus étroit et plus juridiquement défini que דָּמִים, qui désigne plus largement le sang versé, la violence meurtrière ou la culpabilité de sang. La formulation révisée conserve mieux cette amplitude.
  naturalness: Le français est globalement naturel et de registre approprié. «Secoue ses mains pour ne pas accepter de pot-de-vin» est légèrement lourd et «accepter de pot-de-vin» est moins idiomatique; «secoue ses mains pour ne pas recevoir de pot-de-vin» est plus fluide. «Entendre parler de sang versé» est naturel sans imposer un sens technique à l’expression.
  terminology: «Justice», «ce qui est droit», «oppression», «pot-de-vin» et «mal» conviennent au registre moderne international. La note sur צְדָקוֹת est ajustée pour ne pas présenter «actes de justice» comme le sens littéral obligatoire du pluriel abstrait.
