  to: Celui qui marche dans la justice et dit ce qui est droit[a], qui méprise le profit tiré de l’oppression[b], qui secoue ses mains pour ne pas recevoir de pot-de-vin, qui se bouche les oreilles pour ne pas entendre parler de sang versé[c] et ferme les yeux pour ne pas regarder le mal —
  rationale: La révision évite de réduire «sangs» à la catégorie française des «crimes de sang», améliore légèrement l’idiome concernant le pot-de-vin et corrige la présentation de l’alternative lexicale relative à «justice». La structure, le registre, les images et le tiret final sont conservés.
