source:
  edition: WLC
  text: הֹלֵ֣ךְ צְדָק֔וֹת וְ/דֹבֵ֖ר מֵֽישָׁרִ֑ים מֹאֵ֞ס בְּ/בֶ֣צַע מַעֲשַׁקּ֗וֹת נֹעֵ֤ר כַּפָּי/ו֙ מִ/תְּמֹ֣ךְ בַּ/שֹּׁ֔חַד אֹטֵ֤ם אָזְנ/וֹ֙ מִ/שְּׁמֹ֣עַ דָּמִ֔ים וְ/עֹצֵ֥ם עֵינָ֖י/ו מֵ/רְא֥וֹת בְּ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/033/015.yaml
  text: He who walks in righteousness and speaks what is upright[a], who despises gain from extortions, who shakes his hands free from taking a bribe, who stops his ears from hearing of bloodshed[c][b], and shuts his eyes from looking on evil—
translation:
  language: fr
  text: Celui qui marche dans la justice et dit ce qui est droit[a], qui méprise le profit tiré de l’oppression[b], qui secoue ses mains pour ne pas recevoir de pot-de-vin, qui se bouche les oreilles pour ne pas entendre parler de sang versé[c] et ferme les yeux pour ne pas regarder le mal —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «qui marche dans la droiture» ou «qui vit en accomplissant des actes justes».
    reason: lexical_alternative
  - marker: b
    text: Ou «le gain obtenu par des extorsions».
    reason: lexical_alternative
  - marker: c
    text: L’hébreu porte littéralement «des sangs», expression pouvant désigner le sang versé, des violences meurtrières ou la culpabilité liée au sang versé.
    reason: cultural_note
lexical_decisions:
- source_word: הֹלֵךְ צְדָקוֹת
  choice: marche dans la justice
  rationale: Conserve la métaphore hébraïque de la marche comme conduite de vie. Le pluriel צְדָקוֹת peut exprimer la qualité morale ou des actes justes; «dans la justice» reste naturel tout en maintenant cette portée large.
- source_word: וְדֹבֵר מֵישָׁרִים
  choice: et dit ce qui est droit
  rationale: מֵישָׁרִים évoque ce qui est droit, intègre ou équitable. La formulation française est naturelle sans réduire le sens à la seule sincérité.
- source_word: מֹאֵס
  choice: méprise
  rationale: Le participe exprime un rejet moral énergique, plus fort qu’un simple refus.
- source_word: בְּבֶצַע מַעֲשַׁקּוֹת
  choice: le profit tiré de l’oppression
  rationale: בֶּצַע désigne un gain ou profit souvent illicite, tandis que מַעֲשַׁקּוֹת renvoie à des actes d’oppression ou d’extorsion. Cette traduction claire préserve le lien entre profit et exploitation.
- source_word: נֹעֵר כַּפָּיו מִתְּמֹךְ בַּשֹּׁחַד
  choice: secoue ses mains pour ne pas accepter de pot-de-vin
  rationale: Préserve le geste concret de נֹעֵר כַּפָּיו tout en explicitant sa fonction de refus. «Pot-de-vin» est le terme français courant pour שֹׁחַד.
- source_word: אֹטֵם אָזְנוֹ מִשְּׁמֹעַ דָּמִים
  choice: se bouche les oreilles pour ne pas entendre parler de crimes de sang
  rationale: Le français idiomatique emploie le pluriel «les oreilles». דָּמִים, littéralement «sangs», peut désigner les meurtres, les violences meurtrières ou la culpabilité liée au sang versé; «crimes de sang» maintient cette gravité sans préciser indûment des projets ou des récits.
- source_word: וְעֹצֵם עֵינָיו מֵרְאוֹת בְּרָע
  choice: et ferme les yeux pour ne pas regarder le mal
  rationale: Rend directement l’évitement volontaire exprimé par la construction hébraïque, sans déterminer si le regard impliquerait approbation, fascination ou participation.
theological_decisions:
- issue: Sujet implicite de la série de participes hébreux
  choice: Celui qui…
  alternative: Quiconque… / L’homme qui…
  rationale: «Celui qui» fournit en français le sujet nécessaire, conserve le singulier représentatif et évite d’ajouter un nom absent de l’hébreu.
- issue: Portée de צְדָקוֹת
  choice: justice
  alternative: actes justes / droiture
  rationale: Le terme peut viser la conduite juste, des œuvres de justice ou une qualité morale générale. «Justice» conserve la dimension éthique globale; la note maintient les autres possibilités.
- issue: Sens de מִשְּׁמֹעַ דָּמִים
  choice: ne pas entendre parler de crimes de sang
  alternative: ne pas écouter des projets meurtriers / ne pas entendre parler de sang versé
  rationale: Le texte ne précise pas s’il s’agit de projets violents, de récits ou d’une sollicitation à la complicité. La traduction conserve cette indétermination plutôt que d’imposer un scénario.
translation_notes:
  register: Français international moderne, digne et accessible. La structure accumulative des participes est conservée, ainsi que le tiret final indiquant que la pensée se poursuit au verset suivant. Les images corporelles de la marche, des mains, des oreilles et des yeux sont maintenues.
