    issue: Ancre de la note b placée après « à l’extrême » plutôt qu’après le verbe concerné.
    rationale: La note b porte sur le sens lexical de תְעַנֵּנוּ (« nous affligeras-tu » / « nous humilieras-tu »), non sur l’intensif עַד מְאֹד. L’ancre doit donc suivre « affligeras-tu ».
  - severity: low
