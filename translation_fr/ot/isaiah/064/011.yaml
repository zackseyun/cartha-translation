source:
  edition: WLC
  text: הַ/עַל אֵ֥לֶּה תִתְאַפַּ֖ק יְהוָ֑ה תֶּחֱשֶׁ֥ה וּ/תְעַנֵּ֖/נוּ עַד מְאֹֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/011.yaml
  text: Will you restrain yourself over these things[b][a], O Yahweh? Will you keep silent and afflict us so very severely?
translation:
  language: fr
  text: À la vue de tout cela[a], te retiendras-tu, Yahweh ? Garderas-tu le silence et nous affligeras-tu[b] à l’extrême ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de tout cela » ou « Au sujet de tout cela ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous humilieras-tu à l’extrême ». Le verbe hébreu peut évoquer l’affliction ou l’humiliation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ/עַל אֵלֶּה
  choice: Devant tout cela
  rationale: La particule interrogative הַ introduit une question rhétorique, tandis que עַל אֵלֶּה renvoie aux désastres décrits précédemment. « Devant tout cela » exprime naturellement en français les circonstances qui devraient appeler l’intervention divine, sans préciser à tort si elles en sont la cause stricte.
- source_word: תִתְאַפַּק
  choice: te retiendras-tu
  rationale: Le hitpael de אפק désigne l’action de se contenir ou de se retenir. La forme pronominale française conserve cette nuance réflexive et, dans le contexte, évoque le fait de différer son intervention.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre, plutôt que remplacé par un titre, afin de représenter directement le nom divin présent dans le texte hébreu.
- source_word: תֶּחֱשֶׁה
  choice: Garderas-tu le silence
  rationale: Le verbe signifie « être, rester silencieux ». Dans cette question rhétorique, « garder le silence » est naturel et suggère la persistance de ce silence.
- source_word: וּ/תְעַנֵּ/נוּ
  choice: et nous affligeras-tu
  rationale: Le piel de ענה exprime ici très probablement l’affliction ou l’humiliation. « Affliger » convient au contexte de lamentation et à l’intensification qui suit, tout en laissant « humilier » en note comme autre nuance possible.
- source_word: עַד מְאֹד
  choice: à l’extrême
  rationale: Cette expression intensifie fortement le verbe. « À l’extrême » rend sa force adverbiale dans un français actuel, concis et digne.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: L’hébreu emploie explicitement le tétragramme. La translittération « Yahweh » préserve le nom propre sans lui substituer un titre.
- issue: Sens de ענה au piel
  choice: nous affligeras-tu
  alternative: nous humilieras-tu
  rationale: Dans cette lamentation au sujet de souffrances extrêmes, « affliger » correspond le mieux au contexte. Le verbe peut toutefois aussi porter la nuance d’abaissement ou d’humiliation, conservée en note.
translation_notes:
  register: Français international moderne, avec une syntaxe directe et solennelle. Les deux questions rhétoriques et le parallélisme de l’hébreu sont conservés. « Tout cela » reprend naturellement l’ensemble des dévastations mentionnées dans le contexte immédiat.
