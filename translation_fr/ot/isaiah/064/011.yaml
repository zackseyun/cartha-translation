  source_fidelity: Le sens de תִתְאַפַּק (« se retenir », « se contenir ») et celui de תְעַנֵּנוּ (« nous affliger », avec possible nuance d’humiliation) sont bien rendus. « Devant tout cela » reste possible, mais « À la vue de tout cela » exprime plus clairement la valeur circonstancielle de עַל־אֵלֶּה sans imposer une relation causale stricte. « À l’extrême » rend correctement l’intensif עַד מְאֹד.
  naturalness: La formulation est fluide et conserve avec naturel les deux questions rhétoriques. Le déplacement de l’appel « Yahweh » après le premier verbe est idiomatique en français et respecte le registre solennel.
  terminology: « Yahweh » correspond au tétragramme. « Affliger » est approprié dans ce contexte de lamentation; l’alternative « humilier » est utilement conservée en note.
