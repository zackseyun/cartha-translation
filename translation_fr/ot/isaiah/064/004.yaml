  text: פָּגַ֤עְתָּ אֶת שָׂשׂ֙ וְ/עֹ֣שֵׂה צֶ֔דֶק בִּ/דְרָכֶ֖י/ךָ יִזְכְּר֑וּ/ךָ הֵן אַתָּ֤ה קָצַ֨פְתָּ֙ וַֽ/נֶּחֱטָ֔א בָּ/הֶ֥ם עוֹלָ֖ם וְ/נִוָּשֵֽׁעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/004.yaml
  text: You meet the one who gladly does righteousness[a], those who remember you in your ways. Behold, you were angry, and we sinned; in them we have been a long time[b], and shall we be saved?
translation:
  language: fr
  text: Tu rencontres celui qui se réjouit et fait ce qui est juste[a], ceux qui se souviennent de toi dans tes voies. Voici, tu t’es mis en colère, et nous avons péché ; nous y sommes depuis longtemps[b] — et serons-nous sauvés ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui fait avec joie ce qui est juste ». Les participes hébreux peuvent être compris ensemble comme décrivant la personne que Dieu rencontre favorablement.'
    reason: lexical_alternative
  - marker: b
    text: 'La proposition « nous y sommes depuis longtemps — et serons-nous sauvés ? » est difficile du point de vue du texte et de la syntaxe. Le référent de « y » est incertain. On peut aussi comprendre : « en eux/elles est la permanence, et nous serons sauvés », ou lire la dernière proposition comme une affirmation : « et nous serons sauvés ».'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּגַעְתָּ
  choice: tu viens à la rencontre
  rationale: Le verbe פגע signifie couramment « rencontrer » ou « aller à la rencontre de ». Cette formulation française garde ici le sens relationnel sans préciser indûment si Dieu accueille favorablement la personne décrite.
- source_word: שָׂשׂ וְעֹשֵׂה צֶדֶק
  choice: celui qui pratique la justice avec joie
  rationale: Les deux participes décrivent une personne caractérisée par la joie et par une conduite juste. La tournure adverbiale est naturelle en français, tandis que la note conserve l’autre articulation possible.
- source_word: בִּדְרָכֶיךָ
  choice: dans tes voies
  rationale: Le calque mesuré préserve l’image hébraïque des voies de Dieu ainsi que son sens éthique, sans la réduire explicitement à l’obéissance.
- source_word: יִזְכְּרוּךָ
  choice: ceux qui se souviennent de toi
  rationale: La forme verbale au pluriel poursuit la description des personnes concernées. « Se souvenir de toi » conserve le sens actif et religieux du verbe sans ajout interprétatif.
- source_word: הֵן
  choice: Voici
  rationale: Cette particule attire solennellement l’attention. « Voici » convient au registre biblique moderne sans être aussi archaïque que certaines autres possibilités.
- source_word: קָצַפְתָּ
  choice: tu t’es mis en colère
  rationale: Le verbe exprime clairement la colère divine. Cette formulation courante et digne en rend la force sans recourir à un vocabulaire théologique plus technique.
- source_word: וַנֶּחֱטָא
  choice: et nous avons péché
  rationale: La traduction énonce simplement la faute collective et maintient la coordination hébraïque sans imposer une relation temporelle ou causale plus précise.
- source_word: בָּהֶם
  choice: y
  rationale: Le pronom hébreu a un antécédent incertain. Le pronom français « y » maintient autant que possible cette indétermination, explicitée dans la note.
- source_word: עוֹלָם
  choice: depuis longtemps
  rationale: Dans cette proposition difficile, עוֹלָם exprime vraisemblablement une longue durée. Cette traduction évite de lui donner nécessairement le sens absolu de « pour toujours ».
- source_word: וְנִוָּשֵׁעַ
  choice: et serons-nous sauvés ?
  rationale: Le niphal de ישׁע signifie « être sauvé ». Le contexte de lamentation permet de comprendre la forme comme une question rhétorique, tout en signalant en note la lecture déclarative possible.
theological_decisions:
- issue: Valeur de la proposition finale וְנִוָּשֵׁעַ
  choice: 'Une question : « et serons-nous sauvés ? »'
  alternative: 'Une affirmation : « et nous serons sauvés » ; ou, avec une autre analyse de la proposition précédente : « en elles se trouve la permanence, et nous serons sauvés »'
  rationale: La syntaxe hébraïque de la fin du verset est particulièrement difficile et ne comporte pas de marque interrogative explicite. La question convient à la tension pénitentielle du contexte, mais la note préserve la possibilité d’une déclaration confiante.
- issue: Référent de בָּהֶם (« en eux/en elles »)
  choice: Le pronom « y » est laissé sans antécédent explicite.
  alternative: Préciser « dans tes voies », « dans ces péchés » ou « dans ces choses ».
  rationale: Le texte ne permet pas d’identifier le référent avec certitude. Le préciser dans le corps du texte résoudrait une ambiguïté authentique et pourrait infléchir l’interprétation théologique du rapport entre péché, permanence et salut.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la solennité du discours prophétique ; « dans tes voies » conserve l’image hébraïque. La fin volontairement heurtée du verset et son ambiguïté théologique sont maintenues, avec les principales lectures concurrentes en note.
