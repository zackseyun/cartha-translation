id: ISA.64.7
reference: Isaiah 64:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֥ה יְהוָ֖ה אָבִ֣י/נוּ אָ֑תָּה אֲנַ֤חְנוּ הַ/חֹ֨מֶר֙ וְ/אַתָּ֣ה יֹצְרֵ֔/נוּ וּ/מַעֲשֵׂ֥ה יָדְ/ךָ֖ כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/007.yaml
  text: But now, O Yahweh, you are our Father; we are the clay, and you are our potter; we all are the work of your hand.
translation:
  language: fr
  text: Mais maintenant, Yahweh, tu es notre Père. Nous sommes l’argile, et toi, tu es notre potier ; nous sommes tous l’œuvre de ta main.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Mais maintenant
  rationale: 'La conjonction jointe à l’adverbe temporel introduit ici une transition contrastive : après ce qui précède, le peuple renouvelle son appel à Dieu.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération usuelle du nom divin, plutôt que remplacé par un titre.
- source_word: אָבִינוּ אָתָּה
  choice: tu es notre Père
  rationale: La proposition nominale hébraïque affirme directement la relation paternelle, tandis que le pronom אָתָּה porte une nuance d’insistance.
- source_word: אֲנַחְנוּ הַחֹמֶר
  choice: Nous sommes l’argile
  rationale: L’article défini est conservé, et « argile » exprime naturellement la matière façonnée par le potier.
- source_word: וְאַתָּה יֹצְרֵנוּ
  choice: et toi, tu es notre potier
  rationale: Dans le cadre explicite de l’image de l’argile, le participe de יצר désigne naturellement le potier. Le pronom disjoint « toi » restitue son relief emphatique.
- source_word: וּמַעֲשֵׂה יָדְךָ כֻּלָּנוּ
  choice: nous sommes tous l’œuvre de ta main
  rationale: Cette formulation conserve l’image anthropomorphique et rend l’accent collectif de כֻּלָּנוּ dans un français naturel.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin ; la translittération le distingue d’un simple titre.
- issue: Langage paternel appliqué à Dieu
  choice: notre Père
  alternative: notre parent
  rationale: Le substantif hébreu est explicitement masculin et relationnel ; « Père » en conserve fidèlement l’image sans neutralisation.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse directe biblique et maintient la proximité du singulier hébreu. La ponctuation souligne le parallélisme entre le Père, l’argile, le potier et l’œuvre de la main.
