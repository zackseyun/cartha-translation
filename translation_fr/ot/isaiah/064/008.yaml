id: ISA.64.8
reference: Isaiah 64:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַל תִּקְצֹ֤ף יְהוָה֙ עַד מְאֹ֔ד וְ/אַל לָ/עַ֖ד תִּזְכֹּ֣ר עָוֺ֑ן הֵ֥ן הַבֶּט נָ֖א עַמְּ/ךָ֥ כֻלָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/008.yaml
  text: 'Do not be exceedingly angry[a], O Yahweh, and do not remember iniquity forever. Look, please: we are all your people.'
translation:
  language: fr
  text: 'Ne t’irrite pas outre mesure, Yahweh, et ne te souviens pas éternellement de la faute[a]. Regarde, s’il te plaît : nous sommes tous ton peuple.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la culpabilité » ; le mot hébreu עָוֹן peut désigner à la fois la faute commise et la culpabilité qui en résulte.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּקְצֹף ... עַד מְאֹד
  choice: Ne t’irrite pas outre mesure
  rationale: Le qal de קצף exprime la colère, tandis que עַד מְאֹד en intensifie le degré. « S’irriter outre mesure » rend naturellement en français la requête négative sans affaiblir son intensité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de conserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְאַל לָעַד תִּזְכֹּר עָוֹן
  choice: et ne te souviens pas éternellement de la faute
  rationale: La formulation garde le verbe זכר et la portée temporelle de לָעַד. « Faute » est compréhensible en français moderne tout en laissant une note signaler que עָוֹן peut aussi désigner la culpabilité qui découle de l’acte.
- source_word: הֵן הַבֶּט נָא
  choice: Regarde, s’il te plaît
  rationale: הֵן attire vivement l’attention, הַבֶּט commande de regarder et נָא donne à l’appel une nuance de supplication. La tournure française exprime ces trois éléments sans archaïsme.
- source_word: עַמְּךָ כֻלָּנוּ
  choice: nous sommes tous ton peuple
  rationale: La proposition hébraïque est sans verbe. L’ajout nécessaire de « sommes » produit une phrase française naturelle et conserve l’insistance collective de כֻלָּנוּ.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme comme nom propre. Sa translittération préserve cet emploi sans remplacer le nom par un titre.
- issue: Portée de עָוֹן dans la prière pénitentielle
  choice: la faute
  alternative: la culpabilité
  rationale: עָוֹן peut désigner aussi bien l’acte mauvais que la culpabilité qui en résulte. Le texte principal retient un terme courant sans trancher silencieusement l’ambiguïté, laquelle est explicitée en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Outre mesure » maintient la force de l’appel sans lourdeur, et « s’il te plaît » conserve le ton pressant de la supplication.
