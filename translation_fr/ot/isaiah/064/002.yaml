id: ISA.64.2
reference: Isaiah 64:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/עֲשׂוֹתְ/ךָ֥ נוֹרָא֖וֹת לֹ֣א נְקַוֶּ֑ה יָרַ֕דְתָּ מִ/פָּנֶ֖י/ךָ הָרִ֥ים נָזֹֽלּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/002.yaml
  text: When you did awesome things that we did not expect[a], you came down[b]; the mountains quaked before you.
translation:
  language: fr
  text: Quand tu as accompli des actes redoutables que nous n’attendions pas, tu es descendu ; devant toi, les montagnes se sont dissoutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont fondu » ou « ont tremblé ». Le verbe hébreu évoque ce qui coule ou se dissout devant Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲשׂוֹתְךָ
  choice: Quand tu as accompli
  rationale: La préposition ב avec l’infinitif construit et le suffixe de 2e personne a ici une valeur temporelle. « Quand tu as accompli » restitue naturellement le lien entre les propositions.
- source_word: נוֹרָאוֹת
  choice: des actes redoutables
  rationale: Le terme désigne des actes qui inspirent crainte et saisissement. « Redoutables » conserve cette force sans le sens familier que peut avoir « formidables ».
- source_word: לֹא נְקַוֶּה
  choice: que nous n’attendions pas
  rationale: Le verbe קוה peut exprimer l’attente confiante ou l’espérance. Dans ce contexte, la négation indique que ces actes dépassaient ce que les locuteurs attendaient.
- source_word: יָרַדְתָּ
  choice: tu es descendu
  rationale: Traduction directe de ירד, appropriée à la manifestation divine décrite.
- source_word: מִפָּנֶיךָ
  choice: devant toi
  rationale: L’expression signifie littéralement « de devant ta face/présence » et décrit la réaction des montagnes à la présence de Dieu.
- source_word: הָרִים
  choice: les montagnes
  rationale: Équivalent direct et naturel de הָרִים.
- source_word: נָזֹלּוּ
  choice: se sont liquéfiées
  rationale: Le verbe évoque ce qui coule ou se dissout. « Se sont liquéfiées » garde l’image poétique de montagnes qui perdent leur consistance devant Dieu, tandis qu’une note signale les autres interprétations possibles.
theological_decisions:
- issue: Image théophanique de la réaction des montagnes à la descente de Dieu
  choice: Conserver l’image concrète de montagnes qui « se sont liquéfiées » devant Dieu.
  alternative: « ont tremblé » ou « ont fondu » devant toi
  rationale: L’hébreu présente une image vive de dissolution ou d’écoulement. La conserver maintient la tension poétique et la représentation de la création défaite devant la présence divine, sans réduire le texte à un simple tremblement.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement suit l’adresse directe à Dieu. « Actes redoutables » exprime le saisissement religieux sans connotation familière.
