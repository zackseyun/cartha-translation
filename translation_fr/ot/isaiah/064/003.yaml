id: ISA.64.3
reference: Isaiah 64:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/מֵ/עוֹלָ֥ם לֹא שָׁמְע֖וּ לֹ֣א הֶאֱזִ֑ינוּ עַ֣יִן לֹֽא רָאָ֗תָה אֱלֹהִים֙ זוּלָ֣תְ/ךָ֔ יַעֲשֶׂ֖ה לִ/מְחַכֵּה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/003.yaml
  text: From of old no one has heard, no ear has listened, no eye has seen a God besides you, who acts for the one who waits for him.
translation:
  language: fr
  text: Depuis toujours, personne n’a entendu, aucune oreille n’a prêté attention, aucun œil n’a vu un Dieu autre que toi, qui agisse pour celui qui l’attend.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵעוֹלָם
  choice: Depuis toujours
  rationale: Rend naturellement l’idée temporelle de « depuis les temps anciens / depuis toujours » sans imposer ici le sens absolu d’éternité.
- source_word: לֹא שָׁמְעוּ
  choice: personne n’a entendu
  rationale: Le pluriel impersonnel hébreu est rendu par une tournure française générale, conformément au sens du contexte.
- source_word: לֹא הֶאֱזִינוּ
  choice: aucune oreille n’a prêté attention
  rationale: Le verbe exprime une écoute attentive; la mention de l’oreille, implicite dans la formulation parallèle, produit un français naturel et conserve la progression poétique.
- source_word: אֱלֹהִים זוּלָתְךָ
  choice: un Dieu autre que toi
  rationale: Préserve la comparaison exclusive adressée directement à Dieu.
- source_word: יַעֲשֶׂה
  choice: qui agisse
  rationale: Le subjonctif s’intègre à la proposition relative dépendant de « aucun œil n’a vu » et rend l’action caractéristique de ce Dieu sans préciser un objet absent de l’hébreu.
- source_word: לִמְחַכֵּה לוֹ
  choice: pour celui qui l’attend
  rationale: « Attendre » conserve l’idée d’une attente confiante orientée vers Dieu; le singulier générique est maintenu.
theological_decisions:
- issue: Unicité divine et action de Dieu
  choice: « un Dieu autre que toi, qui agisse »
  alternative: « aucun Dieu, sauf toi, qui agit »
  rationale: 'La formulation retenue conserve la syntaxe comparative et la tension poétique: nul autre Dieu n’a été perçu comme agissant en faveur de ceux qui l’attendent, sans transformer le verset en énoncé dogmatique plus explicite que l’hébreu.'
- issue: Nature de l’attente
  choice: « celui qui l’attend »
  alternative: « celui qui espère en lui »
  rationale: Le texte source parle d’attendre; « espérer » expliciterait légitimement la confiance, mais réduirait l’amplitude du terme.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme auditif et visuel est conservé, avec une légère explicitation idiomatique (« aucune oreille ») pour éviter un pluriel impersonnel maladroit en français.
