review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images principales sont bien rendues : invocation du nom, initiative personnelle, visage caché et domination de l’iniquité. Toutefois, « se ressaisir » évoque plutôt le retour au calme ou à la maîtrise de soi que le fait de se réveiller/se mobiliser. La note présente aussi « par la main » comme formulation plus littérale, alors que le texte porte littéralement « dans la main de »; l’expression française proposée y est en outre susceptible de suggérer un instrument distinct de l’iniquité.'
  naturalness: Le français est fluide, poétique et d’un registre moderne approprié. « Se mobilise » est plus idiomatique et plus exact dans ce contexte que « se ressaisit ». « Au pouvoir de notre iniquité » est naturel dans ce registre et explicite avec sobriété l’idiome de la main.
  terminology: « Invoquer ton nom » et « cacher ton visage » préservent utilement les expressions bibliques. « Notre iniquité » maintient le singulier collectif de עָוֹן et sa gravité morale sans imposer une lecture confessionnelle. La note conserve l’image de la dissolution, sans prétendre résoudre entièrement le rapport entre l’action divine et l’iniquité.
  issues:
  - severity: medium
    issue: « Se ressaisit » pour מִתְעוֹרֵר
    rationale: Le hitpael décrit l’action de se réveiller ou de se stimuler pour agir. En français moderne, « se ressaisir » signifie surtout reprendre son sang-froid ou sa maîtrise; « se mobiliser » rend mieux l’élan volontaire requis par le contexte.
  - severity: medium
    issue: Formulation de la note littérale finale
    rationale: « Par la main de nos fautes » n’est pas une présentation strictement littérale de בְּיַד עֲוֺנֵנוּ et peut infléchir l’image. Il convient de signaler directement la formule « dans la main de notre iniquité », tout en expliquant que le verbe évoque la fonte ou le dépérissement.
