source:
  edition: WLC
  text: וְ/אֵין קוֹרֵ֣א בְ/שִׁמְ/ךָ֔ מִתְעוֹרֵ֖ר לְ/הַחֲזִ֣יק בָּ֑/ךְ כִּֽי הִסְתַּ֤רְתָּ פָנֶ֨י/ךָ֙ מִמֶּ֔/נּוּ וַ/תְּמוּגֵ֖/נוּ בְּ/יַד עֲוֺנֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/006.yaml
  text: And there is no one who calls on your name[a], who stirs himself up to take hold of you; for you have hidden your face from us and have given us over into the hand of our iniquity.
translation:
  language: fr
  text: 'Et personne n’invoque ton nom,

    personne ne se mobilise pour s’attacher à toi,

    car tu nous as caché ton visage

    et tu nous as livrés au pouvoir de notre iniquité[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « tu nous as fait fondre dans la main de notre iniquité ». Le verbe hébreu évoque le fait de fondre, de se dissoudre ou de dépérir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵין
  choice: Et personne ne
  rationale: Rend naturellement la conjonction et la négation existentielle totale en français.
- source_word: קוֹרֵא בְשִׁמְךָ
  choice: n’invoque ton nom
  rationale: « Invoquer le nom » exprime clairement l’appel adressé à Dieu dans la prière tout en conservant l’image hébraïque du nom.
- source_word: מִתְעוֹרֵר
  choice: ne se ressaisit
  rationale: Le verbe réfléchi décrit quelqu’un qui se mobilise lui-même. « Se ressaisir » est actuel et naturel, sans réduire l’expression à un simple réveil physique.
- source_word: לְהַחֲזִיק בָּךְ
  choice: pour s’attacher à toi
  rationale: חזק avec ב évoque le fait de saisir et de tenir fermement. « S’attacher à toi » conserve l’élan volontaire vers Dieu dans un français idiomatique.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de l’absence d’invocation et d’élan vers Dieu.
- source_word: הִסְתַּרְתָּ פָנֶיךָ מִמֶּנּוּ
  choice: tu nous as caché ton visage
  rationale: Préserve l’image biblique du visage divin retiré, signe de distance ou de défaveur.
- source_word: וַתְּמוּגֵנוּ
  choice: tu nous as livrés
  rationale: Le verbe évoque littéralement le fait de faire fondre ou dépérir. Avec « dans la main de nos fautes », le contexte exprime l’abandon au pouvoir destructeur de celles-ci; l’image littérale est signalée en note.
- source_word: בְּיַד עֲוֺנֵנוּ
  choice: au pouvoir de nos fautes
  rationale: « La main de » est ici une métaphore de domination. « Au pouvoir de » en communique le sens sans obscurité; עָוֹן peut désigner la faute, la culpabilité ou ses conséquences, et « fautes » maintient ici la responsabilité morale.
theological_decisions:
- issue: L’action divine et la responsabilité humaine dans la dernière proposition
  choice: Dieu livre le peuple au pouvoir de ses propres fautes.
  alternative: Dieu fait fondre le peuple par la main de sa faute.
  rationale: La formulation maintient à la fois le jugement divin et la responsabilité du peuple, sans définir un mécanisme métaphysique. La note conserve l’image plus littérale et l’ambiguïté du rapport entre faute, culpabilité et conséquences.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé sur quatre lignes. « Invoquer ton nom » et « cacher ton visage » maintiennent les images théologiques du texte hébreu, tandis que « au pouvoir de » explicite l’idiome de la main.
