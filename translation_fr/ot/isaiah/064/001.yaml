  variant: modern international French
source:
  edition: WLC
  text: כִּ/קְדֹ֧חַ אֵ֣שׁ הֲמָסִ֗ים מַ֚יִם תִּבְעֶה אֵ֔שׁ לְ/הוֹדִ֥יעַ שִׁמְ/ךָ֖ לְ/צָרֶ֑י/ךָ מִ/פָּנֶ֖י/ךָ גּוֹיִ֥ם יִרְגָּֽזוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/001.yaml
  text: As when fire kindles brushwood[a], and fire causes water to boil, to make your name known to your adversaries[c][b], so that nations tremble at your presence—
translation:
  language: fr
  text: Comme le feu embrase les broussailles[a][c], comme le feu fait bouillir l’eau[b], afin de faire connaître ton nom à tes adversaires, afin que les nations tremblent devant toi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chaume » ou « les brindilles sèches ». Le terme hébreu est rare et semble désigner une matière qui s’enflamme facilement.
    reason: lexical_alternative
  - marker: b
    text: Ou « fait bouillonner l’eau ».
    reason: lexical_alternative
  - marker: c
    text: Dans certaines traditions de numérotation, ce verset est numéroté Ésaïe 63.19b.
    reason: textual_variant
lexical_decisions:
- source_word: כִּקְדֹחַ אֵשׁ
  choice: Comme le feu embrase
  rationale: Le préfixe כ introduit une comparaison, et l’infinitif de קדח exprime l’action d’allumer ou d’embraser. Cette formulation conserve l’image tout en restant naturelle en français.
- source_word: הֲמָסִים
  choice: les broussailles
  rationale: Ce terme rare et difficile semble désigner une matière facilement inflammable. « Broussailles » rend clairement l’image sans prétendre lever toute l’incertitude lexicale.
- source_word: מַיִם תִּבְעֶה אֵשׁ
  choice: comme le feu fait bouillir l’eau
  rationale: Dans ce contexte, בעה décrit vraisemblablement l’eau qui bout ou bouillonne sous l’action du feu. La répétition de « comme le feu » rend explicite le parallélisme hébreu.
- source_word: לְהוֹדִיעַ שִׁמְךָ
  choice: afin de faire connaître ton nom
  rationale: Le hifil de ידע a ici son sens causatif habituel, « faire connaître ». L’expression biblique « ton nom » est conservée.
- source_word: לְצָרֶיךָ
  choice: à tes adversaires
  rationale: צר désigne ceux qui s’opposent à Dieu. « Adversaires » préserve cette relation d’opposition sans imposer exclusivement un contexte militaire.
- source_word: מִפָּנֶיךָ
  choice: devant ta présence
  rationale: L’expression signifie littéralement « de devant ta face ». « Devant ta présence » garde la force de la manifestation divine et convient à la construction française avec « trembler ».
- source_word: גּוֹיִם יִרְגָּזוּ
  choice: les nations tremblent
  rationale: גוים désigne ici les nations, et רגז exprime le tremblement ou l’agitation provoqués par la manifestation divine.
theological_decisions:
- issue: Rapport du verset avec la supplication précédente
  choice: Présenter le texte comme la continuation syntaxique et poétique de la demande précédente, sans en répéter les mots dans ce verset.
  alternative: Ajouter explicitement l’appel à ce que Dieu descende, emprunté au contexte précédent.
  rationale: L’hébreu fourni commence par une comparaison et dépend de la supplication précédente. Le tiret final laisse la phrase ouverte sans importer dans le texte des mots absents de cette unité.
- issue: Portée de l’image du feu
  choice: Conserver l’image ouverte d’une manifestation divine puissante qui révèle le nom de Dieu et fait trembler les nations.
  alternative: Limiter l’image soit au jugement, soit à la purification.
  rationale: Le texte associe révélation, adversaires et tremblement, mais ne réduit pas explicitement le feu à une seule catégorie théologique.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition de « comme le feu » souligne le parallélisme; les notes préservent l’incertitude du terme rare et la variante de versification.
