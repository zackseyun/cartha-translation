  text: עָרֵ֥י קָדְשְׁ/ךָ֖ הָי֣וּ מִדְבָּ֑ר צִיּוֹן֙ מִדְבָּ֣ר הָיָ֔תָה יְרוּשָׁלִַ֖ם שְׁמָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/009.yaml
  text: Your holy cities have become a wilderness; Zion has become a wilderness[a], Jerusalem a desolation.
translation:
  language: fr
  text: Tes villes saintes sont devenues un désert ; Sion est devenue un désert[a], Jérusalem est une désolation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une région désertique » dans les deux occurrences de מִדְבָּר.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵי קָדְשְׁךָ
  choice: Tes villes saintes
  rationale: Le groupe construit signifie littéralement « les villes de ta sainteté ». « Tes villes saintes » exprime naturellement en français à la fois l’appartenance et le caractère sacré.
- source_word: הָיוּ
  choice: sont devenues
  rationale: Le qatal de היה peut présenter l’état résultant d’un changement antérieur ; le passé composé convient à la lamentation sur leur état présent.
- source_word: מִדְבָּר
  choice: un désert
  rationale: Le terme désigne une région désertique ou inhabitée. « Désert » est ici clair et naturel, tout en évoquant l’abandon sans préciser indûment le degré d’aridité.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: הָיָתָה
  choice: est devenue
  rationale: Comme dans le premier membre, le passé composé rend le passage à l’état de dévastation et son résultat actuel.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française établie du nom propre.
- source_word: שְׁמָמָה
  choice: une étendue dévastée
  rationale: Le substantif désigne la dévastation ou un lieu dévasté. Cette formulation conserve une valeur nominale et le parallélisme, avec un français plus naturel que « une désolation ».
