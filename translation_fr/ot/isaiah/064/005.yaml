  source_fidelity: 'Le projet suit fidèlement les quatre membres du verset : état devenu impur, comparaison des actes justes à un vêtement impur, flétrissement de tous comme une feuille, et emportement par les iniquités à l’image du vent. La note rend correctement la précision menstruelle probable de בֶּגֶד עִדִּים, sans la surimposer au texte principal. « Fautes » est toutefois un peu faible pour עָוֹן, qui porte ordinairement une charge plus grave d’iniquité/culpabilité.'
  naturalness: 'Le français est clair, actuel et de registre convenable. La dernière proposition gagnerait en netteté syntaxique : « nos fautes nous emportent comme le vent » peut d’abord se comprendre comme si les fautes emportaient à la manière du vent, alors que l’hébreu juxtapose explicitement le vent comme comparant. L’incise « comme le vent » préserve l’image tout en clarifiant la relation.'
  terminology: « Impur », « vêtement souillé » et « actes justes » sont appropriés et ne surinterprètent pas l’imagerie. « Iniquités » restitue mieux עֲוֺנֵינוּ que « fautes », sans imposer de lecture doctrinale ultérieure.
