  text: וַ/נְּהִ֤י כַ/טָּמֵא֙ כֻּלָּ֔/נוּ וּ/כְ/בֶ֥גֶד עִדִּ֖ים כָּל צִדְקֹתֵ֑י/נוּ וַ/נָּ֤בֶל כֶּֽ/עָלֶה֙ כֻּלָּ֔/נוּ וַ/עֲוֺנֵ֖/נוּ כָּ/ר֥וּחַ יִשָּׂאֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/005.yaml
  text: We all became like one who is unclean[a], and all our righteous deeds are like a filthy garment; we all wither like a leaf, and our iniquities carry us away like the wind.
translation:
  language: fr
  text: Nous sommes tous devenus comme quelqu’un d’impur, et tous nos actes justes sont comme un vêtement souillé[a] ; nous nous flétrissons tous comme une feuille, et nos iniquités, comme le vent, nous emportent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus précisément : « un vêtement souillé par les règles » ou « un linge menstruel ».'
    reason: Précision lexicale concernant l’image exprimée par בֶּגֶד עִדִּים.
lexical_decisions:
- source_word: וַנְּהִי כַטָּמֵא כֻּלָּנוּ
  choice: Nous sommes tous devenus comme quelqu’un d’impur
  rationale: « Sommes devenus » exprime le passage à un état marqué par וַנְּהִי. « Quelqu’un d’impur » conserve la portée personnelle de טָמֵא sans limiter l’image à la seule impureté rituelle ou morale.
- source_word: וּכְבֶגֶד עִדִּים
  choice: comme un vêtement souillé[a]
  rationale: La formulation principale reste naturelle et digne, tandis que la note conserve la référence plus précise à l’impureté menstruelle portée par עִדִּים.
- source_word: כָּל צִדְקֹתֵינוּ
  choice: tous nos actes justes
  rationale: Le pluriel désigne ici des manifestations concrètes de justice plutôt que la justice comme notion abstraite.
- source_word: וַנָּבֶל כֶּעָלֶה כֻּלָּנוּ
  choice: nous nous flétrissons tous comme une feuille
  rationale: « Se flétrir » rend l’image végétale de נבל et s’accorde naturellement avec la feuille.
- source_word: וַעֲוֺנֵנוּ
  choice: nos fautes
  rationale: « Fautes » communique en français courant la charge morale de עָוֹן tout en permettant sa valeur collective et son association avec la culpabilité.
- source_word: כָּרוּחַ יִשָּׂאֻנוּ
  choice: nous emportent comme le vent
  rationale: Dans l’image de la feuille flétrie, נשׂא exprime le fait d’être entraîné et emporté ; la comparaison avec le vent est conservée sans intensification ajoutée.
theological_decisions:
- issue: Nature de l’impureté dans la confession
  choice: Conserver les images d’impureté et de souillure sans les réduire à une catégorie exclusivement rituelle ou exclusivement morale.
  alternative: Interpréter le passage soit comme une simple référence cérémonielle, soit comme l’énoncé technique d’une doctrine systématique ultérieure.
  rationale: Le texte emploie le langage de l’impureté dans une confession pénitentielle. La traduction en préserve la force et la tension sans imposer une formulation doctrinale absente de l’hébreu.
translation_notes:
  register: Français international actuel, clair et digne. Le rythme parallèle de la confession est conservé, avec répétition de « tous » et maintien des deux comparaisons, celle de la feuille et celle du vent.
