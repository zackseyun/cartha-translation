review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la maison sainte et splendide, lieu de la louange des pères, est détruite par le feu, et les choses précieuses sont réduites à la ruine. Toutefois, « un brasier » désigne normalement un foyer ou un grand feu, non l’état de destruction subi par le sanctuaire ; il risque donc de présenter la maison comme étant devenue un feu plutôt que comme ayant été livrée aux flammes. « Tout ce que nous avions de précieux » introduit en outre un imparfait absent de l’hébreu.'
  naturalness: « Notre maison sainte et splendide » et « où nos pères te louaient » sont naturels dans un français moderne et digne. « Est devenue la proie des flammes » rend naturellement la destruction tout en gardant l’image nominale forte. « Tout ce qui nous est précieux » est plus fluide et plus large que « tout ce que nous avions de précieux ».
  terminology: « Pères » respecte אֲבֹתֵינוּ ; la note « ancêtres » est appropriée. « Splendide » est un bon rendu non confessionnel de תפארת. La note sur l’expression de feu doit rester attachée à l’expression qu’elle explique.
  issues:
  - severity: medium
    issue: « est devenue un brasier »
    rationale: En français, un brasier est d’ordinaire le feu lui-même ou un emplacement où il brûle. Cette expression ne rend pas clairement le résultat de l’incendie exprimé par לִשְׂרֵפַת אֵשׁ et peut déplacer l’image.
  - severity: low
    issue: « tout ce que nous avions de précieux »
    rationale: L’imparfait « avions » ajoute une nuance temporelle rétrospective qui n’est pas formulée dans le suffixe possessif hébreu. Une formulation au présent conserve mieux l’énoncé tout en restant naturelle.
  revised_text: Notre maison sainte et splendide, où nos pères[a] te louaient, est devenue la proie des flammes[b], et tout ce qui nous est précieux est devenu une ruine.
