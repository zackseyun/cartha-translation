revisions:
- from: Notre maison sainte et splendide, où nos pères[a] te louaient, est devenue un brasier[b], et tout ce que nous avions de précieux est devenu une ruine.
  to: Notre maison sainte et splendide, où nos pères[a] te louaient, est devenue la proie des flammes[b], et tout ce qui nous est précieux est devenu une ruine.
  rationale: La révision remplace « un brasier », qui est ambigu et peut désigner le feu plutôt que la destruction par le feu, par une expression française idiomatique exprimant le résultat dévastateur. Elle évite aussi l’imparfait non marqué dans le texte source pour les réalités précieuses. Les deux propositions gardent la répétition de « est devenu(e) », l’ampleur non spécifiée de מַחֲמַדֵּינוּ et la force lamentative du verset.
