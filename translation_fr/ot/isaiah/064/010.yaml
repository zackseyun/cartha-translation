  text: בֵּ֧ית קָדְשֵׁ֣/נוּ וְ/תִפְאַרְתֵּ֗/נוּ אֲשֶׁ֤ר הִֽלְל֨וּ/ךָ֙ אֲבֹתֵ֔י/נוּ הָיָ֖ה לִ/שְׂרֵ֣פַת אֵ֑שׁ וְ/כָל מַחֲמַדֵּ֖י/נוּ הָיָ֥ה לְ/חָרְבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/064/010.yaml
  text: Our holy and beautiful house[a], where our fathers praised you, has become a burning with fire[b], and all our precious things have become a ruin.
translation:
  language: fr
  text: Notre maison sainte et splendide, où nos pères[a] te louaient, est devenue la proie des flammes[b], et tout ce qui nous est précieux est devenu une ruine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nos ancêtres ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « est devenue une combustion de feu » ; on peut aussi traduire « a été consumée par le feu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קָדְשֵׁנוּ וְתִפְאַרְתֵּנוּ
  choice: notre maison sainte et splendide
  rationale: La tournure hébraïque signifie littéralement « la maison de notre sainteté et de notre splendeur/gloire ». Cette formulation française naturelle conserve les deux qualités attribuées au sanctuaire sans remplacer « maison » par l’interprétation plus explicite « temple ».
- source_word: אֲשֶׁר הִלְלוּךָ אֲבֹתֵינוּ
  choice: où nos pères te louaient
  rationale: « Où » exprime naturellement la valeur locative du relatif אֲשֶׁר. Le verbe הלל au piel signifie ici « louer ». « Nos pères » garde la forme masculine explicite de l’hébreu et sa portée historique, tandis que « nos ancêtres » est signalé en note.
- source_word: הָיָה לִשְׂרֵפַת אֵשׁ
  choice: est devenue un brasier
  rationale: Cette expression rend de façon idiomatique mais imagée la construction nominale hébraïque, littéralement « est devenue une combustion de feu », sans la réduire silencieusement à un simple passif.
- source_word: מַחֲמַדֵּינוּ
  choice: tout ce que nous avions de précieux
  rationale: Le terme désigne des réalités désirables, chères ou précieuses, sans préciser s’il s’agit d’objets du sanctuaire, de lieux aimés ou d’autres biens. La formulation française conserve cette ampleur.
- source_word: לְחָרְבָּה
  choice: une ruine
  rationale: Le nom exprime la dévastation ou l’état de ruine. « Une ruine » est concret, clair et correspond à la construction prédicative du texte.
theological_decisions:
- issue: Référent de « notre maison sainte et splendide »
  choice: La formulation désigne principalement le temple de Jérusalem, sans introduire le mot « temple » dans le texte.
  alternative: Y voir une référence plus large englobant Jérusalem ou les lieux saints du pays.
  rationale: La mention de la maison où les pères louaient Dieu désigne directement le sanctuaire, tandis que le contexte plus large de la lamentation concerne aussi Sion et Jérusalem.
- issue: Traduction de אֲבֹתֵינוּ
  choice: nos pères
  alternative: nos ancêtres
  rationale: L’hébreu emploie explicitement un pluriel masculin doté ici d’une portée historique et collective. Le texte principal conserve cette forme, et la note donne l’équivalent français plus inclusif possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la lamentation est préservé par deux propositions parallèles avec « est devenue ». « Splendide » rend תפארת sans imposer le sens plus théologique de « glorieuse », et « un brasier » conserve l’image forte de la construction nominale hébraïque.
