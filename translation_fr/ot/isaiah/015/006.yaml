  text: כִּֽי מֵ֥י נִמְרִ֖ים מְשַׁמּ֣וֹת יִֽהְי֑וּ כִּֽי יָבֵ֤שׁ חָצִיר֙ כָּ֣לָה דֶ֔שֶׁא יֶ֖רֶק לֹ֥א הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/006.yaml
  text: For the waters of Nimrim will become desolations[a], for the grass is dried up, the vegetation is gone, and no green thing remains.
translation:
  language: fr
  text: 'Car les eaux de Nimrim seront dévastées[a] : l’herbe s’est desséchée, la végétation a disparu, il ne reste plus rien de vert.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « deviendront une étendue dévastée ». L’expression hébraïque est concise : elle peut décrire soit les eaux elles-mêmes comme dévastées, soit la région où elles coulent comme devenue déserte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de la lamentation et du jugement décrits dans le contexte. « Car » convient aux deux occurrences, la seconde étant rendue par la ponctuation pour éviter une répétition lourde.
- source_word: מֵי נִמְרִים
  choice: les eaux de Nimrim
  rationale: מֵי est le pluriel construit de « eaux » et נִמְרִים est un nom de lieu, conservé par translittération.
- source_word: מְשַׁמּוֹת יִהְיוּ
  choice: deviendront des lieux dévastés
  rationale: Le pluriel nominal מְשַׁמּוֹת évoque des espaces dévastés, tandis que היה avec un attribut peut signifier « être » ou « devenir ». Cette formulation conserve le pluriel et exprime naturellement le passage à un état de désolation.
- source_word: יָבֵשׁ חָצִיר
  choice: l’herbe s’est desséchée
  rationale: Le parfait décrit l’état résultant de l’assèchement. Le passé composé est naturel en français et garde l’image concrète de l’herbe privée d’eau.
- source_word: כָּלָה דֶשֶׁא
  choice: la végétation a disparu
  rationale: דֶשֶׁא désigne la végétation fraîche ou les jeunes pousses, et כָּלָה en exprime la disparition complète.
- source_word: יֶרֶק לֹא הָיָה
  choice: il ne reste plus rien de vert
  rationale: יֶרֶק désigne largement ce qui est vert ou la verdure. La formulation française exprime naturellement la négation existentielle et l’absence totale de végétation.
