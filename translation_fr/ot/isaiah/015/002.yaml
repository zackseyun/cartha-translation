revisions:
- from: Il est monté au temple[a] et, à Dibon, aux hauts lieux, pour pleurer. Sur Nébo et sur Médéba, Moab pousse des lamentations ; toutes les têtes sont rasées[b], toutes les barbes sont coupées.
  to: Il est monté au temple[a], et Dibon aux hauts lieux, pour pleurer ; sur Nébo et sur Médéba, Moab pousse des cris de lamentation. Toutes les têtes sont rasées[b], toutes les barbes sont coupées.
  rationale: La révision retire l’ajout locatif « à Dibon » afin de préserver l’ellipse et la coordination de l’hébreu, que la tradition textuelle et les traductions comprennent de diverses manières. Elle renforce aussi légèrement la traduction du verbe de lamentation. Les ancres et les notes sont conservées et adaptées à la difficulté syntaxique.
