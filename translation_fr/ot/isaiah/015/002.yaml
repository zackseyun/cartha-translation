translation_notes:
  register: Français international moderne, sobre et soutenu. La structure elliptique du premier membre est conservée autant que possible sans rendre la phrase incompréhensible ; la ponctuation indique Dibon comme lieu tout en évitant de masquer totalement l’ambiguïté de l’hébreu.
