  text: עָלָ֨ה הַ/בַּ֧יִת וְ/דִיבֹ֛ן הַ/בָּמ֖וֹת לְ/בֶ֑כִי עַל נְב֞וֹ וְ/עַ֤ל מֵֽידְבָא֙ מוֹאָ֣ב יְיֵלִ֔יל בְּ/כָל רֹאשָׁ֣י/ו קָרְחָ֔ה כָּל זָקָ֖ן גְּרוּעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/002.yaml
  text: He has gone up to the temple[a], and Dibon to the high places, to weep. Over Nebo and over Medeba Moab wails; on every head is baldness[b], every beard is cut off.
translation:
  language: fr
  text: Il est monté au temple[a], et Dibon aux hauts lieux, pour pleurer ; sur Nébo et sur Médéba, Moab pousse des cris de lamentation. Toutes les têtes sont rasées[b], toutes les barbes sont coupées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est monté à la maison, et Dibon aux hauts lieux, pour pleurer. » L’hébreu dit littéralement « la maison », expression qui désigne probablement ici un sanctuaire ou un temple. La syntaxe du membre concernant Dibon est elliptique.'
    reason: lexical_alternative
  - marker: b
    text: Le rasage de la tête et la coupe de la barbe sont des signes de deuil.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָה
  choice: Il est monté
  rationale: Le qal accompli, troisième personne du masculin singulier, présente l’action comme accomplie dans le tableau de lamentation. Le passé composé est naturel en français tout en conservant cet aspect.
- source_word: הַבַּיִת
  choice: au temple
  rationale: Littéralement « à la maison ». L’association avec les hauts lieux et les rites de deuil favorise ici le sens d’un sanctuaire ou temple ; l’alternative littérale est conservée en note.
- source_word: וְדִיבֹן הַבָּמוֹת
  choice: et, à Dibon, aux hauts lieux
  rationale: La formulation hébraïque est elliptique. Cette ponctuation comprend Dibon comme lieu et les hauts lieux comme destination, sans faire explicitement de Dibon un second sujet.
- source_word: לְבֶכִי
  choice: pour pleurer
  rationale: Le nom précédé de ל exprime ici le but ; l’infinitif français restitue naturellement cette valeur.
- source_word: עַל נְבוֹ וְעַל מֵידְבָא
  choice: Sur Nébo et sur Médéba
  rationale: Les noms propres sont translittérés selon l’usage français, et la répétition de עַל est conservée afin de respecter le parallélisme.
- source_word: מוֹאָב יְיֵלִיל
  choice: Moab pousse des lamentations
  rationale: Le verbe exprime une plainte forte et audible. Cette formulation garde l’intensité sans la connotation potentiellement animale de « hurle ».
- source_word: בְּכָל רֹאשָׁיו קָרְחָה
  choice: toutes les têtes sont rasées
  rationale: Moab est un collectif et le français appelle ici une formulation distributive au pluriel. Dans ce contexte de deuil, la « calvitie » désigne le rasage de la tête plutôt qu’une perte naturelle des cheveux.
- source_word: כָּל זָקָן גְּרוּעָה
  choice: toutes les barbes sont coupées
  rationale: La formulation parallèle est rendue littéralement et clairement ; la coupe de la barbe appartient aux gestes visibles de deuil.
