source:
  edition: WLC
  text: מַשָּׂ֖א מוֹאָ֑ב כִּ֠י בְּ/לֵ֞יל שֻׁדַּ֨ד עָ֤ר מוֹאָב֙ נִדְמָ֔ה כִּ֗י בְּ/לֵ֛יל שֻׁדַּ֥ד קִיר מוֹאָ֖ב נִדְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/001.yaml
  text: 'An oracle concerning Moab: because in a night Ar of Moab is devastated[a], it is destroyed; because in a night Kir of Moab is devastated[c][b], it is destroyed.'
translation:
  language: fr
  text: 'Oracle sur Moab[a] : car, en une nuit[b], Ar de Moab est dévastée, réduite au silence[c] ; car, en une nuit, Kir de Moab est dévastée, réduite au silence.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi être traduit par « proclamation » ou « fardeau » ; ici, il sert de titre à une parole prophétique sur Moab.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « en une nuit », ce qui souligne la soudaineté de la dévastation ; « en une seule nuit » est aussi possible.
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu peut aussi signifier « anéantie », « détruite » ou « retranchée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: proclamation
  rationale: Dans un titre prophétique, le terme introduit une parole solennelle, souvent de jugement. « Proclamation » est naturel en français moderne tout en laissant « oracle » et « fardeau » comme possibilités signalées en note.
- source_word: מוֹאָב
  choice: Moab
  rationale: Forme française traditionnelle du nom propre.
- source_word: כִּי
  choice: oui
  rationale: Dans cette formulation poétique, כִּי peut marquer avec force le contenu de la proclamation. « Oui » préserve cette valeur emphatique sans imposer le lien causal que supposerait nécessairement « parce que ».
- source_word: בְּלֵיל
  choice: en une seule nuit
  rationale: Cette tournure française naturelle conserve l'idée d'un événement soudain accompli dans l'espace d'une nuit.
- source_word: שֻׁדַּד
  choice: est dévastée
  rationale: Le passif exprime une mise à sac violente. « Dévastée » reste fort sans affirmer plus précisément une annihilation totale.
- source_word: עָר מוֹאָב
  choice: Ar de Moab
  rationale: Le groupe est compris comme le nom d'une ville moabite et conserve la relation exprimée par la construction hébraïque.
- source_word: נִדְמָה
  choice: réduite au silence
  rationale: Le verbe peut évoquer la cessation, l'anéantissement ou le silence. Cette traduction maintient l'image distincte de celle de שֻׁדַּד, tandis qu'une note conserve les autres sens plausibles.
- source_word: קִיר מוֹאָב
  choice: Kir de Moab
  rationale: Transcription du nom de lieu avec restitution naturelle de la construction hébraïque.
theological_decisions:
- issue: Rapport introduit par כִּי
  choice: oui
  alternative: car / parce que
  rationale: Le contexte permet une valeur emphatique aussi bien qu'explicative. Le texte principal adopte une lecture emphatique adaptée à l'annonce prophétique, sans transformer les destructions en cause logique certaine de la proclamation.
- issue: Sens de נִדְמָה
  choice: réduite au silence
  alternative: détruite / retranchée
  rationale: La polysémie du verbe est théologiquement et poétiquement pertinente. Le choix principal garde l'image du silence, et la note évite de présenter cette nuance comme exclusive.
translation_notes:
  register: Français international moderne, solennel et poétique. Le parallélisme des deux demi-vers est conservé, avec répétition de « en une seule nuit » et de la double description passive. Les noms Ar, Kir et Moab sont transcrits selon l’usage biblique français.
