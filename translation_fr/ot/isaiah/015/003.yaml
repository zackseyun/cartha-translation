  - severity: low
    issue: Note propose une paraphrase interprétative comme alternative directe
    rationale: « Fond en larmes » ne traduit pas lexicalement « descendant »; elle peut être conservée comme explication possible, mais non comme l’équivalent principal de l’alternative textuelle.
