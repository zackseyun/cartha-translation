  text: In its streets they put on sackcloth; on its rooftops and in its squares everyone wails[a], going down in weeping.
translation:
  language: fr
  text: Dans ses rues, ils revêtent le sac ; sur ses toits et sur ses places, tous se lamentent et descendent en pleurs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous se lamentent, descendant en pleurs ». L’hébreu dit littéralement « descendant en pleurs » ; l’image peut évoquer une descente réelle ou l’accablement du chagrin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחוּצֹתָיו
  choice: dans ses rues
  rationale: חוּץ désigne ici les espaces extérieurs de la ville, couramment ses rues ; cette formulation est naturelle en français et convient à la scène de deuil public.
- source_word: חָגְרוּ שָׂק
  choice: on revêt le sac
  rationale: חגר signifie littéralement « ceindre », mais avec שַׂק l’expression désigne le fait de revêtir une étoffe grossière en signe de deuil. « Revêtir le sac » conserve l’image biblique avec dignité.
- source_word: עַל גַּגּוֹתֶיהָ
  choice: sur ses toits
  rationale: גַּגּוֹת désigne les toits plats des maisons, lieux visibles où se déroule la lamentation publique.
- source_word: וּבִרְחֹבֹתֶיהָ
  choice: et sur ses places
  rationale: רְחוֹבוֹת désigne de larges espaces publics ou places. Ce choix maintient la distinction avec חוּצוֹת, rendu par « rues ».
- source_word: כֻּלֹּה
  choice: tout le monde
  rationale: Le féminin singulier renvoie collectivement à la ville et, dans ce contexte, à l’ensemble de ses habitants. « Tout le monde » exprime naturellement cette portée distributive.
- source_word: יְיֵלִיל
  choice: pousse des lamentations
  rationale: ילל évoque une lamentation forte, proche du hurlement. Cette expression française rend son intensité sans connotation animale indue.
- source_word: יֹרֵד בַּבֶּכִי
  choice: descendant en pleurs
  rationale: Le participe יֹרֵד signifie littéralement « descendant ». La traduction conserve cette image volontairement ambiguë, qui peut évoquer un déplacement physique ou l’accablement causé par le chagrin.
