  text: כִּֽי הִקִּ֥יפָה הַ/זְּעָקָ֖ה אֶת גְּב֣וּל מוֹאָ֑ב עַד אֶגְלַ֨יִם֙ יִלְלָתָ֔/הּ וּ/בְאֵ֥ר אֵילִ֖ים יִלְלָתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/008.yaml
  text: For the outcry has gone around the border of Moab[a]; its wailing reaches as far as Eglaim[b], and its wailing to Beer-elim.
translation:
  language: fr
  text: Car le cri de détresse a fait le tour de la frontière de Moab[a] ; sa lamentation retentit jusqu’à Églaïm, sa lamentation jusqu’à Beer-Élim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a encerclé la frontière de Moab ». Le verbe hébreu conserve l’image du cri qui fait tout le tour de Moab.'
    reason: lexical_alternative
  - marker: b
    text: Beer-Élim est un nom de lieu qui peut signifier « puits d’Élim » ou « puits des puissants ».
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication qui prolonge la lamentation précédente ; « car » rend naturellement ce lien discursif.
- source_word: הִקִּיפָה
  choice: a fait le tour de
  rationale: 'Conserve l’image spatiale du verbe : le cri parcourt tout le pourtour de Moab, sans réduire le sens au simple fait de se répandre.'
- source_word: הַזְּעָקָה
  choice: le cri de détresse
  rationale: זְעָקָה désigne un cri intense suscité par la détresse ; cette expression est claire et naturelle en français moderne.
- source_word: אֶת גְּבוּל מוֹאָב
  choice: la frontière de Moab
  rationale: גְּבוּל a ici son sens géographique de frontière ou de limite territoriale.
- source_word: עַד
  choice: atteignent … et jusqu’à
  rationale: Marque l’étendue géographique des lamentations. La formulation française varie légèrement entre les deux membres pour éviter une lourdeur tout en conservant le parallélisme.
- source_word: אֶגְלַיִם
  choice: Églaïm
  rationale: Nom de lieu translittéré sous une forme adaptée à l’orthographe française.
- source_word: יִלְלָתָהּ
  choice: ses lamentations
  rationale: Le nom exprime des cris plaintifs de douleur. Le pluriel collectif est idiomatique en français et le possessif maintient le lien avec le cri de détresse ; le terme hébreu est répété, mais la syntaxe française permet de le sous-entendre dans le second membre.
- source_word: וּבְאֵר אֵילִים
  choice: et jusqu’à Beer-Élim
  rationale: Le second nom de lieu poursuit vraisemblablement l’indication de l’étendue du cri ; « jusqu’à » explicite en français la portée de עַד qui gouverne la construction parallèle.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La traduction conserve l’image concrète du cri parcourant le pourtour de Moab ainsi que les deux noms de lieux. Le point-virgule rend la progression poétique de l’hébreu.
