  source_fidelity: 'Le texte rend correctement le sens global de l’hébreu : la conséquence (« C’est pourquoi »), le transport des biens accumulés et des réserves, ainsi que le passage associé au « torrent des Saules ». Le pluriel collectif (« ils ») est justifié par le contexte moabite, bien que le premier verbe hébreu soit formellement au singulier. Les deux difficultés lexicales importantes, פְּקֻדָּתָם et הָעֲרָבִים, restent signalées sans résolution excessive.'
