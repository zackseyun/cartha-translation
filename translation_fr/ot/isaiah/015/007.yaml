  terminology: « Torrent » rend naturellement נחל dans ce contexte; « oued » est utilement proposé en note. « Saules » respecte la lecture traditionnelle tout en préservant l’alternative liée à l’Araba ou aux plaines arides. « Biens qu’ils ont acquis » et « ce qu’ils ont mis en réserve » distinguent de manière lisible les deux expressions hébraïques, avec une note adéquate pour la seconde.
