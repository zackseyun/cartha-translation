  text: עַל כֵּ֖ן יִתְרָ֣ה עָשָׂ֑ה וּ/פְקֻדָּתָ֔/ם עַ֛ל נַ֥חַל הָ/עֲרָבִ֖ים יִשָּׂאֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/007.yaml
  text: Therefore the abundance they have gained and what they have stored up they carry away over the Brook of the Willows[a][b].
translation:
  language: fr
  text: C’est pourquoi ils emportent par-delà le torrent des Saules[a] les biens qu’ils ont acquis et ce qu’ils ont mis en réserve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par-delà l’oued de l’Araba » ou « par-delà la vallée des plaines désertiques ». L’expression hébraïque est incertaine; la traduction traditionnelle est « le torrent des Saules ».
    reason: alternative_reading
  - marker: b
    text: L’expression traduite par « ce qu’ils ont mis en réserve » est difficile en hébreu; elle peut aussi signifier « leurs possessions » ou « ce qui leur avait été confié ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְרָה עָשָׂה
  choice: les biens qu’ils ont acquis
  rationale: יִתְרָה évoque ce qui est en surplus, ce qui reste ou l’abondance; associé à עָשָׂה dans ce contexte de fuite, le groupe désigne naturellement les biens accumulés. Le pluriel français reprend collectivement les Moabites.
- source_word: וּפְקֻדָּתָם
  choice: et ce qu’ils ont mis en réserve
  rationale: Le terme est difficile et peut désigner des réserves, des possessions ou ce qui a été confié à leur garde. Cette formulation s’accorde au parallélisme sans masquer l’incertitude, signalée en note.
- source_word: נַחַל
  choice: torrent
  rationale: נַחַל désigne souvent un cours d’eau, notamment le lit d’un torrent saisonnier. « Torrent » est naturel en français et convient mieux ici que le terme technique « oued ».
- source_word: הָעֲרָבִים
  choice: des Saules
  rationale: La compréhension traditionnelle rattache le mot à des saules ou peupliers et forme un nom de lieu, « torrent des Saules ». Une autre analyse le relie à l’Araba ou à des plaines désertiques; elle est conservée en note.
- source_word: יִשָּׂאוּם
  choice: ils emportent
  rationale: Le verbe נשׂא signifie porter ou transporter; « emportent » exprime naturellement le déplacement des biens dans le contexte de la fuite, tandis que le suffixe objet est rendu par la construction française.
