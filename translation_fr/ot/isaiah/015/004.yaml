  text: וַ/תִּזְעַ֤ק חֶשְׁבּוֹן֙ וְ/אֶלְעָלֵ֔ה עַד יַ֖הַץ נִשְׁמַ֣ע קוֹלָ֑/ם עַל כֵּ֗ן חֲלֻצֵ֤י מוֹאָב֙ יָרִ֔יעוּ נַפְשׁ֖/וֹ יָ֥רְעָה לּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/004.yaml
  text: Heshbon and Elealeh cry out[a]; their voice is heard as far as Jahaz. Therefore the armed men of Moab cry out[b]; his soul trembles within him.
translation:
  language: fr
  text: Heshbon et Éléalé poussent des cris ; leur voix se fait entendre jusqu’à Yahats. C’est pourquoi les hommes armés de Moab crient[a] ; son âme est bouleversée en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les guerriers de Moab poussent des cris ». Le terme traduit par « hommes armés » peut désigner plus généralement des guerriers, et le verbe un cri puissant, éventuellement guerrier.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu de la dernière proposition est difficile. Autres traductions possibles : « son âme est dans la détresse » ou « son âme tremble en lui ». Le singulier peut personnifier Moab ou viser chaque combattant.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְעַק
  choice: poussent des cris
  rationale: Le verbe זעק exprime un cri puissant de détresse ou d’alarme. Le pluriel français s’accorde naturellement avec les deux villes personnifiées, malgré le verbe hébreu au singulier qui précède le sujet composé.
- source_word: חֶשְׁבּוֹן וְאֶלְעָלֵה
  choice: Heshbon et Éléalé
  rationale: Les noms de lieux sont translittérés selon des formes françaises lisibles, sans les traduire.
- source_word: עַד יַהַץ
  choice: jusqu’à Yahats
  rationale: עַד indique ici la portée du cri ; « jusqu’à » rend directement cette extension géographique.
- source_word: נִשְׁמַע קוֹלָם
  choice: leur voix se fait entendre
  rationale: Cette formulation conserve l’image hébraïque de la « voix » tout en étant naturelle en français ; le suffixe pluriel renvoie aux villes personnifiées.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: L’expression introduit la conséquence de la détresse décrite auparavant.
- source_word: חֲלֻצֵי מוֹאָב
  choice: les hommes armés de Moab
  rationale: חֲלֻצִים désigne ici des hommes équipés pour le combat. « Hommes armés » garde le sens militaire sans préciser davantage leur statut.
- source_word: יָרִיעוּ
  choice: crient
  rationale: Le verbe désigne un cri puissant et peut avoir une nuance guerrière. Dans ce contexte de détresse, « crient » évite d’imposer l’idée d’un cri de victoire ou d’un signal de combat.
- source_word: נַפְשׁוֹ
  choice: son âme
  rationale: נפש désigne ici l’être intérieur ou la personne elle-même. « Son âme » préserve l’image poétique et le singulier collectif du texte.
- source_word: יָרְעָה לּוֹ
  choice: est bouleversée en lui
  rationale: La tournure hébraïque difficile évoque un profond mal-être ou un effondrement intérieur. Cette traduction reste intelligible sans réduire le sens à la seule peur physique.
theological_decisions:
- issue: Référent du singulier dans נַפְשׁוֹ יָרְעָה לּוֹ
  choice: Conserver « son âme… en lui »
  alternative: 'Employer un pluriel explicatif : « leur âme est bouleversée en eux »'
  rationale: Le texte hébreu passe au singulier, probablement en personnifiant Moab ou en visant collectivement chacun de ses combattants. Le singulier préserve cette tension sans fixer le référent.
translation_notes:
  register: Français international moderne, sobre et poétique. Les villes sont personnifiées, et la variation entre le pluriel des combattants et le singulier final est volontairement conservée.
