  text: לִבִּ/י֙ לְ/מוֹאָ֣ב יִזְעָ֔ק בְּרִיחֶ֕/הָ עַד צֹ֖עַר עֶגְלַ֣ת שְׁלִשִׁיָּ֑ה כִּ֣י מַעֲלֵ֣ה הַ/לּוּחִ֗ית בִּ/בְכִי֙ יַֽעֲלֶה בּ֔/וֹ כִּ֚י דֶּ֣רֶךְ חוֹרֹנַ֔יִם זַעֲקַת שֶׁ֖בֶר יְעֹעֵֽרוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/005.yaml
  text: My heart cries out for Moab[a]; her fugitives flee as far as Zoar, as far as Eglath-shelishiyah. For they go up the ascent of Luhith with weeping[c][b]; for on the road to Horonaim they raise a cry of destruction.
translation:
  language: fr
  text: Mon cœur crie pour Moab. Ses fugitifs[a] vont jusqu’à Tsoar, jusqu’à Églath-Shelishiya[b]. Ils gravissent en pleurant[c] la montée de Louhith ; sur la route de Horonaïm, ils poussent un cri de désastre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu rendu par « fugitifs » est difficile. Il peut aussi se comprendre plus littéralement comme « ses barres », sens que certains interprètent de façon figurée ou corrigent selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Églath-Shelishiya est probablement un nom de lieu. L’expression hébraïque peut aussi signifier littéralement « une génisse de trois ans ».
    reason: lexical_alternative
  - marker: c
    text: Les verbes hébreux de ce verset alternent entre le singulier et le pluriel. La traduction emploie le pluriel pour représenter collectivement les habitants de Moab en fuite.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי לְמוֹאָב יִזְעָק
  choice: Mon cœur pousse des cris pour Moab
  rationale: Conserve l’image hébraïque du cœur comme siège de l’émotion et rend זעק par une expression française évoquant un cri intense de lamentation.
- source_word: בְּרִיחֶיהָ
  choice: Ses fugitifs
  rationale: Le contexte décrit la fuite devant la dévastation. Le mot hébreu est toutefois difficile et peut aussi être compris au sens littéral de « ses barres » ; cette ambiguïté est signalée en note.
- source_word: עַד צֹעַר
  choice: jusqu’à Tsoar
  rationale: עַד indique ici la limite ou l’étendue du déplacement.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  choice: Églath-Shelishiya
  rationale: Dans cette suite de lieux et d’itinéraires, l’expression est probablement un toponyme. La translittération évite de trancher indûment son sens incertain.
- source_word: מַעֲלֵה הַלּוּחִית
  choice: la montée de Louhith
  rationale: Rend directement la désignation géographique d’une voie ascendante.
- source_word: בִּבְכִי יַעֲלֶה בּוֹ
  choice: Ils gravissent en pleurant
  rationale: Expression française naturelle qui conserve à la fois le mouvement ascendant et les pleurs. Le pluriel explicite la valeur collective du singulier hébreu.
- source_word: דֶּרֶךְ חוֹרֹנַיִם
  choice: sur la route de Horonaïm
  rationale: Formulation idiomatique pour une route associée à Horonaïm, sans imposer plus précisément qu’elle y conduit.
- source_word: זַעֲקַת שֶׁבֶר יְעֹעֵרוּ
  choice: ils font retentir un cri de détresse
  rationale: « Font retentir » exprime l’idée d’éveiller ou de soulever le cri ; « détresse » rend la catastrophe et l’effondrement impliqués par שֶׁבֶר dans une langue française naturelle.
