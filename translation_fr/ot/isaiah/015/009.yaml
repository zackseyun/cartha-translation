  text: כִּ֣י מֵ֤י דִימוֹן֙ מָ֣לְאוּ דָ֔ם כִּֽי אָשִׁ֥ית עַל דִּימ֖וֹן נוֹסָפ֑וֹת לִ/פְלֵיטַ֤ת מוֹאָב֙ אַרְיֵ֔ה וְ/לִ/שְׁאֵרִ֖ית אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/015/009.yaml
  text: 'For the waters of Dimon are full of blood[a], for I will bring more upon Dimon: a lion upon the fugitives of Moab[c][b], and upon the remnant of the land.'
translation:
  language: fr
  text: 'Car les eaux de Dimôn sont pleines de sang[a], car je ferai venir sur Dimôn davantage encore[b] : un lion contre les rescapés de Moab[c] et contre le reste du pays.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Dimôn fait peut-être écho au mot hébreu dam, « sang ». Certains rapprochent aussi ce lieu de Dibôn.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « je placerai sur Dimôn des choses supplémentaires ». L’hébreu ne précise pas la nature de ce qui est ajouté.'
    reason: alternative_reading
  - marker: c
    text: Le « lion » peut être un animal réel ou l’image d’un jugement supplémentaire.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵי דִימוֹן
  choice: les eaux de Dimôn
  rationale: Le pluriel construit מֵי signifie ici « les eaux de ». La forme massorétique Dimôn est conservée afin de respecter le texte et son possible jeu de mots avec דָם, « sang ».
- source_word: מָלְאוּ דָם
  choice: sont pleines de sang
  rationale: Cette formulation française naturelle conserve directement l’image saisissante du texte hébreu.
- source_word: אָשִׁית עַל דִימוֹן נוֹסָפוֹת
  choice: je ferai venir encore d’autres malheurs sur Dimôn
  rationale: שׂים avec עַל exprime ici ce qui est imposé ou amené sur un lieu. נוֹסָפוֹת désigne littéralement des choses supplémentaires sans les nommer ; « d’autres malheurs » explicite avec retenue ce que le contexte de jugement rend évident, tandis qu’une note signale l’implicite hébreu.
- source_word: לִפְלֵיטַת מוֹאָב
  choice: contre les rescapés de Moab
  rationale: פְלֵיטָה désigne ceux qui ont échappé au désastre. « Rescapés » convient au contexte de destruction et évite la connotation parfois politique de « fugitifs ».
- source_word: אַרְיֵה
  choice: un lion
  rationale: Le nom concret est maintenu sans décider s’il désigne un animal réel ou une image prophétique d’un nouveau jugement.
- source_word: וְלִשְׁאֵרִית אֲדָמָה
  choice: et contre ce qui reste du pays
  rationale: שְׁאֵרִית exprime le reste ou ce qui subsiste, et אֲדָמָה peut désigner ici le pays. Cette traduction conserve l’indétermination du groupe plutôt que de préciser sans nécessité qu’il s’agit exclusivement de personnes.
- source_word: כִּי ... כִּי
  choice: Car ... Oui
  rationale: Le premier כִּי relie le verset à l’annonce précédente par une explication ; le second renforce l’annonce divine. « Oui » rend naturellement cette reprise emphatique en français.
theological_decisions:
- issue: Nature du « lion » dans l’oracle de jugement
  choice: Conserver l’image concrète « un lion » sans l’interpréter dans le texte principal.
  alternative: Un lion réel envoyé comme jugement, ou une image d’une puissance envahissante ou d’un nouveau désastre.
  rationale: L’hébreu présente l’image sans en identifier explicitement le référent. La traduction préserve donc cette ambiguïté prophétique.
translation_notes:
  register: Français international moderne, clair et digne. La cadence prophétique est conservée sans tournures inutilement archaïques. « Dimôn » suit la forme du texte massorétique ; les ambiguïtés concernant les calamités ajoutées et le lion sont signalées sans imposer une interprétation.
