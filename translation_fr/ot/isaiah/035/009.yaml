  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹא יִהְיֶ֨ה שָׁ֜ם אַרְיֵ֗ה וּ/פְרִ֤יץ חַיּוֹת֙ בַּֽל יַעֲלֶ֔/נָּה לֹ֥א תִמָּצֵ֖א שָׁ֑ם וְ/הָלְכ֖וּ גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/009.yaml
  text: No lion will be there[a], and no ravenous beast will go up on it; it will not be found there[c][b], but the redeemed will walk there.
translation:
  language: fr
  text: Il n’y aura là aucun lion, et aucune bête féroce[a] ne montera sur cette route[b] ; on n’en trouvera pas là. Mais les rachetés[c] y marcheront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bête violente », « bête redoutable » ou « bête prédatrice ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne montera sur elle » ; le pronom féminin renvoie probablement à la route mentionnée au verset précédent.
    reason: cross_reference
  - marker: c
    text: Le terme hébreu signifie « rachetés » et vient du verbe גאל. Le verset suivant emploie un autre verbe, פדה, souvent rendu par « libérer » ou « racheter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְיֵה
  choice: lion
  rationale: Nom courant du lion ; le singulier hébreu a ici une valeur générique, rendue naturellement en français par « aucun lion ».
- source_word: פְרִיץ חַיּוֹת
  choice: bête féroce
  rationale: פְרִיץ évoque la violence ou la brutalité ; avec חַיּוֹת, l’expression désigne un animal sauvage dangereux. « Bête féroce » est naturel et digne en français, sans préciser indûment qu’il s’agit nécessairement d’un prédateur affamé.
- source_word: בַּל
  choice: aucune… ne… pas
  rationale: La particule négative poétique renforce l’exclusion ; la négation française est répartie naturellement entre « aucune » et « ne… pas ».
- source_word: יַעֲלֶנָּה
  choice: ne montera sur cette route
  rationale: עלה signifie « monter ». Le suffixe féminin renvoie très probablement à la route surélevée du verset précédent ; le référent est explicité en français pour éviter un pronom obscur.
- source_word: תִמָּצֵא
  choice: on n’en trouvera pas
  rationale: Le niphal de מצא signifie couramment « être trouvé ». La tournure impersonnelle française conserve ce sens tout en évitant une référence pronominale féminine ambiguë.
- source_word: גְּאוּלִים
  choice: les rachetés
  rationale: Le participe passif de גאל désigne ceux qui ont été rachetés ou repris en charge. « Les rachetés » est concis, naturel et conserve la portée théologique du terme.
- source_word: וְהָלְכוּ
  choice: y marcheront
  rationale: הלך signifie ordinairement « marcher, aller ». « Y marcheront » convient à la route évoquée et maintient le contraste avec l’absence d’animaux dangereux.
- source_word: שָׁם
  choice: là / y
  rationale: L’adverbe local répété souligne la sécurité du lieu ; ses occurrences sont rendues par les équivalents français naturels « là » et « y ».
theological_decisions:
- issue: Terminologie de la délivrance dans גְּאוּלִים
  choice: les rachetés
  alternative: ceux qui ont été délivrés
  rationale: גְּאוּלִים vient de גאל, tandis que le verset suivant emploie פדה. « Les rachetés » garde ici le vocabulaire propre à גאל sans identifier silencieusement les deux verbes, même si leurs champs sémantiques se recouvrent.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. La répétition de « là » est partiellement conservée, tandis que « y » assure une lecture idiomatique. « Cette route » explicite un antécédent fourni par le verset précédent.
