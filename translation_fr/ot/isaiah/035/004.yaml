  text: אִמְרוּ֙ לְ/נִמְהֲרֵי לֵ֔ב חִזְק֖וּ אַל תִּירָ֑אוּ הִנֵּ֤ה אֱלֹֽהֵי/כֶם֙ נָקָ֣ם יָב֔וֹא גְּמ֣וּל אֱלֹהִ֔ים ה֥וּא יָב֖וֹא וְ/יֹשַׁעֲ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/004.yaml
  text: Say to those with an anxious heart[a], “Be strong; do not fear. Look, your God will come with vengeance, with the recompense of God[b]; he himself will come and save you.”
translation:
  language: fr
  text: 'Dites à ceux dont le cœur s’affole[a] : « Soyez forts, n’ayez pas peur ! Voici votre Dieu ! Il viendra avec vengeance, avec la rétribution de Dieu[b] ; c’est lui qui viendra vous sauver. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ceux qui ont le cœur précipité », c’est-à-dire à ceux qui sont intérieurement agités ou pris de panique.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu peut aussi se comprendre : « la vengeance viendra, la rétribution de Dieu ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: נִמְהֲרֵי לֵב
  choice: ceux dont le cœur s’affole
  rationale: L’expression signifie littéralement « ceux qui ont le cœur précipité ». Dans ce contexte, elle évoque une agitation intérieure proche de la panique. Cette formulation française restitue l’image du cœur et son sens contextuel sans la réduire à la seule peur.
- source_word: חִזְקוּ
  choice: Soyez forts
  rationale: L’impératif pluriel de חזק appelle directement les destinataires à la fermeté. « Soyez forts » en conserve la forme et la vigueur.
- source_word: אַל תִּירָאוּ
  choice: n’ayez pas peur
  rationale: Traduction française naturelle et directe de l’interdiction exprimée par ירא.
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » attire solennellement l’attention sur l’intervention imminente de Dieu et convient au registre prophétique moderne.
- source_word: אֱלֹהֵיכֶם
  choice: votre Dieu
  rationale: Rend directement le nom avec son suffixe de deuxième personne du pluriel et maintient sa portée relationnelle.
- source_word: נָקָם
  choice: la vengeance
  rationale: Le nom désigne l’action de venger ou la vengeance. Le choix direct préserve la force du jugement divin au lieu de l’atténuer.
- source_word: גְּמוּל אֱלֹהִים
  choice: la rétribution de Dieu
  rationale: 'Cette traduction garde explicitement le complément אֱלֹהִים et laisse ouverte la relation exacte du génitif : rétribution exercée, accordée ou appartenant à Dieu.'
- source_word: הוּא
  choice: C’est lui
  rationale: 'La tournure disloquée rend l’insistance du pronom indépendant : Dieu lui-même est celui qui vient.'
- source_word: וְיֹשַׁעֲכֶם
  choice: et vous sauvera
  rationale: Le hiphil de ישׁע exprime l’action de sauver ou délivrer. « Sauver » conserve toute l’ampleur du terme.
theological_decisions:
- issue: Rapport entre la vengeance divine et le salut
  choice: Conserver côte à côte la vengeance et la rétribution de Dieu, puis son action salvatrice envers les destinataires.
  alternative: Atténuer « vengeance » en « justice », ou limiter le salut à une interprétation exclusivement spirituelle.
  rationale: Le texte hébreu associe sans les confondre le jugement rétributif de Dieu et le salut de son peuple. La traduction maintient cette tension théologique.
- issue: Sujet de יָבוֹא après נָקָם
  choice: 'Comprendre « la vengeance » comme sujet explicite : « la vengeance viendra »; reprendre ensuite Dieu comme sujet avec הוּא יָבוֹא.'
  alternative: 'Comprendre Dieu comme sujet dès le premier יָבוֹא : « votre Dieu viendra avec vengeance ».'
  rationale: L’ordre immédiat נָקָם יָבוֹא permet naturellement de prendre « vengeance » pour sujet, tandis que la reprise emphatique הוּא יָבוֹא identifie clairement Dieu comme sujet de la seconde venue. L’autre analyse reste possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient le relief prophétique; « n’ayez pas peur » reste naturel à l’oral comme à l’écrit. La ponctuation explicite l’analyse syntaxique retenue sans masquer l’autre possibilité, donnée en note.
