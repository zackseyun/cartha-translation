  source_fidelity: 'Le texte rend fidèlement les deux propositions de l’hébreu : le singulier générique de פִּסֵּחַ, le saut vigoureux, la langue de la personne muette qui exulte, puis l’irruption des eaux et des cours d’eau dans les régions arides. Les futurs français conviennent au cadre prophétique, même si נִבְקְעוּ est formellement un parfait.'
