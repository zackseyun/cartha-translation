  text: אָ֣ז יְדַלֵּ֤ג כָּֽ/אַיָּל֙ פִּסֵּ֔חַ וְ/תָרֹ֖ן לְשׁ֣וֹן אִלֵּ֑ם כִּֽי נִבְקְע֤וּ בַ/מִּדְבָּר֙ מַ֔יִם וּ/נְחָלִ֖ים בָּ/עֲרָבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/006.yaml
  text: Then the lame will leap like a deer[a], and the tongue of the mute will sing for joy; for waters have burst forth in the wilderness[b], and streams in the desert plain.
translation:
  language: fr
  text: Alors le boiteux bondira comme un cerf, et la langue du muet poussera des cris de joie[a] ; car des eaux jailliront dans le désert, et des torrents dans la plaine aride[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « chantera de joie ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans l’Araba », si le terme est compris comme un nom géographique plutôt que comme le nom commun « plaine aride ».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְדַלֵּג
  choice: bondira
  rationale: Le piel exprime un saut vif et vigoureux ; « bondira » restitue naturellement cette énergie en français.
- source_word: כָּאַיָּל
  choice: comme un cerf
  rationale: אַיָּל désigne un cervidé mâle ; « cerf » est précis, courant et adapté à la comparaison poétique.
- source_word: פִּסֵּחַ
  choice: le boiteux
  rationale: L’adjectif substantivé désigne ici, au singulier générique, une personne qui boite. « Le boiteux » reste concis et proche de la forme hébraïque.
- source_word: וְתָרֹן
  choice: poussera des cris de joie
  rationale: רנן évoque une clameur éclatante et joyeuse, parfois chantée. Cette formulation conserve le sens sans trancher en faveur du seul chant.
- source_word: לְשׁוֹן אִלֵּם
  choice: la langue du muet
  rationale: La formulation littérale met la langue au premier plan et souligne le rétablissement de la parole.
- source_word: נִבְקְעוּ
  choice: jailliront
  rationale: Le niphal de בקע évoque une ouverture ou une rupture. Avec les eaux pour sujet, « jailliront » exprime naturellement leur surgissement soudain.
- source_word: בַמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne ici une région inculte et aride. « Désert » est naturel en français et se distingue encore de la plaine aride du second membre.
- source_word: מַיִם
  choice: des eaux
  rationale: Le pluriel « des eaux » conserve la forme hébraïque et convient au registre poétique.
- source_word: וּנְחָלִים
  choice: des torrents
  rationale: נְחָלִים peut désigner des cours d’eau ou torrents, souvent associés aux ravins. « Torrents » rend la vigueur de l’eau nouvellement présente dans ce paysage.
- source_word: בָּעֲרָבָה
  choice: dans la plaine aride
  rationale: עֲרָבָה peut être un nom commun désignant une steppe ou plaine désertique, ou le toponyme Araba. Le sens commun convient au parallélisme, tandis que l’autre lecture est signalée en note.
theological_decisions:
- issue: Nature des images de restauration
  choice: Présenter sans atténuation la guérison corporelle et le renouvellement du milieu naturel.
  alternative: Comprendre les images comme exclusivement spirituelles, ou comme exclusivement littérales et eschatologiques.
  rationale: Le verset décrit directement le rétablissement de facultés physiques et l’irruption d’eau dans un pays aride, sans préciser ici le mode ou le moment de leur accomplissement.
translation_notes:
  register: Français moderne, international et digne, avec un rythme poétique clair. Le futur hébreu est maintenu dans l’ensemble du verset ; les images concrètes et l’ambiguïté géographique de עֲרָבָה sont préservées.
