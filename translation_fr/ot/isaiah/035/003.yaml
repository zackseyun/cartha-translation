  text: חַזְּק֖וּ יָדַ֣יִם רָפ֑וֹת וּ/בִרְכַּ֥יִם כֹּשְׁל֖וֹת אַמֵּֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/003.yaml
  text: Strengthen weak hands[a], and make firm feeble knees.
translation:
  language: fr
  text: Fortifiez les mains faibles et affermissez les genoux qui chancellent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les genoux qui fléchissent ». Le participe hébreu évoque des genoux qui chancellent, vacillent ou risquent de céder.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַזְּקוּ
  choice: Fortifiez
  rationale: 'Le piel impératif pluriel a ici une valeur causative et porte sur « les mains » : il appelle à leur rendre de la force.'
- source_word: יָדַיִם רָפוֹת
  choice: les mains faibles
  rationale: Cette formulation conserve l’image concrète de l’hébreu et exprime naturellement le manque de force en français moderne.
- source_word: וּבִרְכַּיִם
  choice: et ... les genoux
  rationale: La conjonction et le nom sont maintenus pour préserver le parallélisme poétique.
- source_word: כֹּשְׁלוֹת
  choice: qui chancellent
  rationale: Le participe de כשל dépeint des genoux qui vacillent ou risquent de céder; la proposition relative restitue cette image avec naturel.
- source_word: אַמֵּצוּ
  choice: affermissez
  rationale: Ce verbe exprime l’action de rendre ferme ou fort; « affermissez » préserve la variation poétique par rapport à חַזְּקוּ.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. L’impératif pluriel et le parallélisme des deux membres sont conservés, ainsi que l’image dynamique des genoux chancelants.
