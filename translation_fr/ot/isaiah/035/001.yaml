  text: The wilderness and the dry land will rejoice[a]; the desert plain will be glad and blossom like the crocus.
translation:
  language: fr
  text: Le désert et la terre aride se réjouiront ; la plaine désertique sera dans l’allégresse et fleurira comme le crocus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lis », « asphodèle » ou une autre plante à bulbe ; l’identification exacte du mot hébreu חֲבַצָּלֶת est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׂשׂוּם
  choice: se réjouiront
  rationale: Le verbe שׂוּשׂ exprime une joie vive. Le futur convient au contexte prophétique. La forme inhabituelle se comprend ici le plus naturellement avec « le désert et la terre aride » comme sujets personnifiés, sans tenter de reproduire mécaniquement le מ final.
- source_word: מִדְבָּר
  choice: désert
  rationale: Désigne ici une étendue inculte et désolée. « Désert » est clair en français moderne et convient à l’image poétique, sans imposer nécessairement un paysage de dunes.
- source_word: צִיָּה
  choice: terre aride
  rationale: Rend explicitement l’idée de sécheresse et forme avec « désert » un parallélisme naturel.
- source_word: תָגֵל
  choice: sera dans l’allégresse
  rationale: Le verbe גיל évoque la joie, voire l’exultation. Cette formulation conserve son intensité tout en variant le vocabulaire après « se réjouiront ».
- source_word: עֲרָבָה
  choice: plaine désertique
  rationale: Le mot peut désigner l’Araba comme nom propre ou, plus généralement, une plaine aride ou une steppe. Le contexte poétique favorise ici le sens commun.
- source_word: תִפְרַח
  choice: fleurira
  rationale: Le verbe פרח décrit l’éclosion ou la floraison ; « fleurira » est naturel et restitue directement la transformation de la terre aride.
- source_word: חֲבַצָּלֶת
  choice: crocus
  rationale: L’identification botanique exacte est incertaine. « Crocus » est une équivalence moderne courante, mais les autres possibilités doivent rester signalées en note.
