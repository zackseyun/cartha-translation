revisions:
- from: Elle fleurira abondamment et exultera — oui[a], elle exultera et poussera des cris de joie. La gloire du Liban lui sera donnée, la splendeur du Carmel et du Sharon[b]. Ils verront la gloire de Yahweh[c], la splendeur de notre Dieu.
  to: Elle fleurira abondamment[a] et exultera, oui, dans l’allégresse et avec des cris de joie. La gloire du Liban lui sera donnée, la splendeur du Carmel et du Sharon[b]. Ils verront la gloire de Yahweh[c], la splendeur de notre Dieu.
  rationale: 'La révision replace la note a sur l’expression qu’elle documente et rend la séquence de joie dans une syntaxe française plus fluide, tout en conservant son caractère intensif et sonore. Elle ne précise pas le référent de « ils » et maintient les échos lexicaux essentiels : gloire/gloire et splendeur/splendeur.'
