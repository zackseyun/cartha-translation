id: ISA.35.2
reference: Isaiah 35:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: פָּרֹ֨חַ תִּפְרַ֜ח וְ/תָגֵ֗ל אַ֚ף גִּילַ֣ת וְ/רַנֵּ֔ן כְּב֤וֹד הַ/לְּבָנוֹן֙ נִתַּן לָ֔/הּ הֲדַ֥ר הַ/כַּרְמֶ֖ל וְ/הַ/שָּׁר֑וֹן הֵ֛מָּה יִרְא֥וּ כְבוֹד יְהוָ֖ה הֲדַ֥ר אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/002.yaml
  text: It will blossom abundantly and rejoice—yes[a], with rejoicing and a shout of joy. The glory of Lebanon will be given to it, the majesty of Carmel and Sharon. They will see the glory of Yahweh[c][b], the majesty of our God.
translation:
  language: fr
  text: Elle fleurira abondamment[a] et exultera, oui, dans l’allégresse et avec des cris de joie. La gloire du Liban lui sera donnée, la splendeur du Carmel et du Sharon[b]. Ils verront la gloire de Yahweh[c], la splendeur de notre Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle fleurira à coup sûr » ; l’hébreu associe un infinitif absolu au verbe conjugué pour marquer l’insistance.'
    reason: lexical_alternative
  - marker: b
    text: Le Liban, le Carmel et le Sharon étaient réputés pour leur beauté naturelle et leur fertilité ; l’image présente le désert recevant leur éclat.
    reason: cultural_note
  - marker: c
    text: 'Hébreu : « YHWH », traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: פָּרֹחַ תִּפְרַח
  choice: elle fleurira abondamment
  rationale: La construction formée de l’infinitif absolu et du verbe conjugué intensifie l’idée de floraison. « Fleurira abondamment » exprime cette force avec naturel en français.
- source_word: וְתָגֵל … גִּילַת
  choice: et exultera — oui, elle exultera
  rationale: La racine גיל évoque une joie vive et débordante. La répétition d’« exultera » conserve le renforcement produit par les termes apparentés en hébreu.
- source_word: אַף
  choice: oui
  rationale: La particule a ici une valeur emphatique; « oui » accentue naturellement la montée poétique.
- source_word: וְרַנֵּן
  choice: et poussera des cris de joie
  rationale: רנן peut désigner des cris retentissants ou un chant jubilant. Cette formulation garde le caractère sonore et joyeux de la scène.
- source_word: כְּבוֹד הַלְּבָנוֹן
  choice: la gloire du Liban
  rationale: « Gloire » rend כבוד et maintient son écho lexical avec « la gloire de Yahweh » plus loin dans le verset.
- source_word: נִתַּן לָהּ
  choice: lui sera donnée
  rationale: Bien que la forme hébraïque soit un accompli passif, le contexte prophétique de restauration justifie en français une valeur future.
- source_word: הֲדַר
  choice: la splendeur
  rationale: הדר exprime l’éclat, la beauté majestueuse. « Splendeur » convient aussi bien aux régions fertiles qu’à la grandeur divine et le distingue de כבוד, rendu par « gloire ».
- source_word: הַכַּרְמֶל וְהַשָּׁרוֹן
  choice: du Carmel et du Sharon
  rationale: Les noms géographiques sont translittérés; les articles français sont intégrés naturellement à la syntaxe.
- source_word: הֵמָּה יִרְאוּ
  choice: Ils verront
  rationale: Le texte porte explicitement un pronom et un verbe au masculin pluriel. La traduction conserve ce changement grammatical sans préciser de manière interprétative l’identité du groupe.
- source_word: כְבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: Le nom divin יהוה est translittéré « Yahweh », tandis que « gloire » préserve le rappel de la gloire du Liban.
- source_word: הֲדַר אֱלֹהֵינוּ
  choice: la splendeur de notre Dieu
  rationale: La reprise de « splendeur » pour הדר maintient le parallélisme lexical du texte hébreu.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: La translittération rend visible le nom divin présent dans le texte hébreu; une note signale la traduction traditionnelle.
- issue: Référent de הֵמָּה (« ils »)
  choice: Conserver « Ils verront » sans expliciter le référent
  alternative: 'Reformuler impersonnellement : « on verra » ou « la gloire de Yahweh sera vue »'
  rationale: L’hébreu introduit un masculin pluriel après des images centrées sur une terre au féminin singulier. Garder le pronom préserve cette tension et évite d’imposer l’identification de ses référents.
translation_notes:
  register: Français international actuel, poétique et digne. Le féminin singulier « elle » reprend le désert ou la terre du contexte précédent. Le parallélisme « gloire / splendeur » et le passage soudain au masculin pluriel « ils » sont conservés.
