base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/007.yaml
  text: The burning sand will become a pool[a], and the thirsty ground springs of water; in the haunt of jackals, where they lie down, there will be grass, reeds[c][b], and rushes.
translation:
  language: fr
  text: Le sol brûlant deviendra un étang[a], et la terre desséchée deviendra des sources d’eau. Dans le repaire des chacals, là où ils se couchent[b], pousseront l’herbe, les roseaux et les joncs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le mirage deviendra un étang ». Le mot hébreu peut désigner la chaleur desséchante ou l’apparence miroitante du désert sous l’effet de la chaleur.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le repaire des chacals, son lieu de repos ». La syntaxe hébraïque est resserrée, et le rapport précis entre le repaire, le lieu où les chacals se couchent et la végétation nouvelle peut être compris de plusieurs façons.
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « joncs » peut aussi désigner le papyrus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁרָב
  choice: le sol brûlant
  rationale: Le terme peut évoquer la chaleur desséchante ou l’aspect miroitant du désert sous la chaleur. « Le sol brûlant » conserve ici une image concrète sans réduire le mot à une illusion d’optique.
- source_word: לַאֲגַם
  choice: un étang
  rationale: אֲגַם désigne une étendue d’eau, parfois marécageuse. « Étang » convient à l’image de transformation et reste naturel en français.
- source_word: צִמָּאוֹן
  choice: la terre desséchée
  rationale: Le nom peut désigner la soif ou un lieu aride. Le parallélisme décrit le paysage; cette formulation explicite donc le sens topographique.
- source_word: לְמַבּוּעֵי מָיִם
  choice: des sources d’eau
  rationale: מַבּוּעַ désigne une source jaillissante. Le pluriel exprime l’abondance de l’eau nouvelle.
- source_word: בִּנְוֵה תַנִּים
  choice: dans le repaire des chacals
  rationale: נָוֶה peut désigner une demeure ou un lieu fréquenté; dans ce décor désertique, « repaire » est idiomatique. תַנִּים désigne ici des chacals plutôt que les « dragons » de certaines traditions anciennes.
- source_word: רִבְצָהּ
  choice: leur lieu de repos
  rationale: Le terme vient de רבץ, « se coucher, être étendu ». Le français rattache naturellement ce lieu aux chacals, tout en signalant en note la syntaxe hébraïque resserrée et le suffixe grammatical singulier.
- source_word: חָצִיר לְקָנֶה וָגֹמֶא
  choice: l’herbe fera place aux roseaux et aux joncs
  rationale: חָצִיר est l’herbe, קָנֶה le roseau, et גֹמֶא un jonc ou papyrus. Le לְ marque vraisemblablement ici le résultat de la transformation; « fera place à » rend cette progression vers une végétation de zone humide.
