  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשֻׁב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂ֔יגוּ וְ/נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/010.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing; everlasting joy will be upon their heads. Gladness and joy will overtake them[a], and sorrow and sighing will flee away.
translation:
  language: fr
  text: Les rachetés[a] de Yahweh reviendront, et ils viendront à Sion avec des cris de joie. Une joie éternelle sera sur leur tête. L’allégresse et la joie les rejoindront, tandis que le chagrin et les soupirs s’enfuiront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux que Yahweh a délivrés par rançon ». Le terme hébreu peut désigner des personnes rachetées ou délivrées par rançon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְדוּיֵי יְהוָה
  choice: Les rachetés de Yahweh
  rationale: Le participe passif de פדה désigne ceux qui ont été délivrés ou récupérés par rachat. « Rachetés » conserve cette image et sa portée salvatrice, tandis que le nom divin יְהוָה est transcrit « Yahweh ».
- source_word: יְשֻׁבוּן
  choice: reviendront
  rationale: Le verbe שוב exprime ici un retour. Le futur simple rend naturellement l’action annoncée.
- source_word: וּבָאוּ צִיּוֹן
  choice: ils arriveront à Sion
  rationale: בוא peut signifier « venir », « arriver » ou « entrer ». « Arriver à Sion » exprime clairement l’aboutissement du retour en français courant.
- source_word: בְּרִנָּה
  choice: avec des cris de joie
  rationale: רִנָּה évoque une clameur jubilante, qui peut être chantée. « Cris de joie » garde mieux que le seul mot « chants » l’intensité sonore du terme hébreu.
- source_word: וְשִׂמְחַת עוֹלָם
  choice: Une joie éternelle
  rationale: La construction signifie littéralement une joie durable, pour toujours. « Éternelle » est concise et naturelle dans ce contexte poétique.
- source_word: עַל רֹאשָׁם
  choice: sera sur leur tête
  rationale: La formulation garde l’image hébraïque frappante de la joie posée sur la tête, sans expliciter qu’elle serait une couronne ou un ornement.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: L’allégresse et la joie
  rationale: Deux termes français distincts reproduisent le redoublement poétique de deux noms hébreux proches.
- source_word: יַשִּׂיגוּ
  choice: les rejoindront
  rationale: נשׂג peut signifier atteindre ou rattraper. Avec l’allégresse et la joie comme sujets, « les rejoindront » conserve la personnification et l’image de bienfaits qui atteignent les voyageurs.
- source_word: וְנָסוּ יָגוֹן וַאֲנָחָה
  choice: le chagrin et les soupirs s’enfuiront
  rationale: « S’enfuiront » traduit directement נוס et maintient la personnification. « Chagrin » et « soupirs » rendent les dimensions intérieure et audible de la détresse.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme. La transcription « Yahweh » présente le nom propre divin sans le remplacer par un titre.
- issue: Sens de פְדוּיֵי
  choice: rachetés
  alternative: délivrés par rançon
  rationale: Le terme peut désigner ceux qui ont été libérés ou repris moyennant rachat. « Rachetés » préserve cette gamme de sens et l’écho salvateur sans imposer les détails d’un paiement précis.
translation_notes:
  register: Français international moderne, poétique et digne. La structure parallèle et les personnifications de la joie, du chagrin et des soupirs sont conservées. Le point-virgule clarifie le mouvement en deux temps sans effacer la coordination hébraïque.
