source:
  edition: WLC
  text: אָ֥ז תִּפָּקַ֖חְנָה עֵינֵ֣י עִוְרִ֑ים וְ/אָזְנֵ֥י חֵרְשִׁ֖ים תִּפָּתַֽחְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/005.yaml
  text: Then the eyes of the blind will be opened[a], and the ears of the deaf will be opened.
translation:
  language: fr
  text: Alors les yeux des aveugles s’ouvriront, et les oreilles des sourds s’ouvriront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Adverbe temporel qui situe l’accomplissement à venir comme la conséquence de ce qui précède. « Alors » est naturel et concis.
- source_word: תִּפָּקַחְנָה
  choice: s’ouvriront
  rationale: Nifal inaccompli, troisième personne du féminin pluriel, de פקח, avec « les yeux » pour sujet. La tournure pronominale française exprime naturellement l’ouverture des yeux sans ajouter d’intensité absente de l’hébreu.
- source_word: עֵינֵי עִוְרִים
  choice: les yeux des aveugles
  rationale: Le substantif en état construit suivi de l’adjectif substantivé pluriel est rendu par une expression française directe et digne.
- source_word: וְאָזְנֵי חֵרְשִׁים
  choice: et les oreilles des sourds
  rationale: Cette formulation conserve le parallélisme de la première proposition et rend naturellement l’état construit hébreu.
- source_word: תִּפָּתַחְנָה
  choice: seront débouchées
  rationale: Nifal inaccompli de פתח, littéralement « seront ouvertes ». Avec « oreilles », « seront débouchées » exprime idiomatiquement le rétablissement de l’ouïe tout en distinguant ce verbe de פקח dans la proposition précédente. La traduction plus littérale figure en note.
theological_decisions:
- issue: Nature de l’image de restauration
  choice: Conserver le langage concret de la guérison corporelle sans préciser si son accomplissement est uniquement physique, uniquement spirituel, ou les deux.
  alternative: Interpréter explicitement le verset soit comme une guérison miraculeuse seulement, soit comme une métaphore de la perception spirituelle seulement.
  rationale: Le verset parle concrètement des yeux et des oreilles. La traduction doit préserver cette image prophétique ainsi que son ouverture interprétative.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est conservé, tandis que la légère variation entre les deux verbes hébreux est perceptible en français.
