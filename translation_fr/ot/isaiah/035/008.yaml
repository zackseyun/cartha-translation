  terminology: « Chaussée », « route », « Voie sainte », « impure » et « insensés » sont des choix justes et cohérents. La majuscule dans le nom donné à la route est défendable. La formulation révisée maintient l’ouverture cultuelle et éthique de טָמֵא.
