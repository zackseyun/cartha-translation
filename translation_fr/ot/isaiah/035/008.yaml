source:
  edition: WLC
  text: וְ/הָיָה שָׁ֞ם מַסְל֣וּל וָ/דֶ֗רֶךְ וְ/דֶ֤רֶךְ הַ/קֹּ֨דֶשׁ֙ יִקָּ֣רֵא לָ֔/הּ לֹֽא יַעַבְרֶ֥/נּוּ טָמֵ֖א וְ/הוּא לָ֑/מוֹ הֹלֵ֥ךְ דֶּ֛רֶךְ וֶ/אֱוִילִ֖ים לֹ֥א יִתְעֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/035/008.yaml
  text: And there shall be a highway there[a], and a road, and it shall be called the Holy Way. The unclean shall not pass over it, but it shall be for them[b]; whoever walks on the way—even fools—shall not go astray.
translation:
  language: fr
  text: Il y aura là une chaussée et une route, et on l’appellera « la Voie sainte ». Aucune personne impure n’y passera, mais elle sera pour eux[a]. Ceux qui marcheront sur cette voie, même les insensés, ne s’égareront pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La proposition hébraïque est difficile. On peut aussi comprendre : « et lui sera avec eux » ou « elle leur appartiendra ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « ne se perdront pas » ou « n’erreront pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַסְלוּל
  choice: chaussée
  rationale: Le terme désigne une voie aménagée ou surélevée. « Chaussée » conserve l’image d’une route préparée tout en restant naturel en français.
- source_word: דֶּרֶךְ
  choice: route / voie
  rationale: Le mot est répété avec des nuances légèrement différentes. « Route » convient à l’association avec « chaussée », tandis que « Voie » convient au nom solennel « la Voie sainte » et au parcours qui suit.
- source_word: הַקֹּדֶשׁ
  choice: sainte
  rationale: Dans l’expression construite avec דֶּרֶךְ, le terme indique une voie consacrée à Dieu. « La Voie sainte » rend clairement cette dimension sans la préciser davantage.
- source_word: יִקָּרֵא לָהּ
  choice: on l’appellera
  rationale: Le niphal de קרא exprime ici l’attribution d’un nom. La tournure française impersonnelle est naturelle et le pronom féminin renvoie à la voie.
- source_word: טָמֵא
  choice: aucun être impur
  rationale: L’adjectif est substantivé. Cette formulation conserve la portée générale du terme, qui peut évoquer à la fois l’impureté cultuelle et l’impureté morale.
- source_word: יַעַבְרֶנּוּ
  choice: n’y passera
  rationale: Le verbe עבר décrit le passage, et le pronom suffixe renvoie à la voie. « N’y passera » est idiomatique et préserve l’image du déplacement.
- source_word: וְהוּא לָמוֹ
  choice: mais elle sera pour eux
  rationale: La proposition est syntaxiquement difficile. Le pronom est ici rapporté à la voie, destinée aux personnes évoquées dans le contexte; les autres analyses possibles sont signalées en note.
- source_word: הֹלֵךְ דֶּרֶךְ
  choice: ceux qui suivront cette voie
  rationale: Le participe décrit de façon générale les voyageurs qui empruntent cette voie. Le pluriel français permet un enchaînement naturel avec « les insensés ».
- source_word: אֱוִילִים
  choice: les insensés
  rationale: Le terme désigne des personnes dépourvues de sagesse plutôt que de simples personnes peu intelligentes. « Insensés » garde cette portée morale et sapientielle.
- source_word: לֹא יִתְעוּ
  choice: ne s’égareront pas
  rationale: Le verbe תעה peut signifier errer, se perdre ou s’égarer. Cette traduction convient à la fois au déplacement concret et à sa possible portée figurée.
theological_decisions:
- issue: Nature de l’impureté dans לֹא יַעַבְרֶנּוּ טָמֵא
  choice: Conserver la catégorie générale avec « aucun être impur »
  alternative: « aucune personne rituellement impure » ou « aucun être moralement corrompu »
  rationale: Dans la littérature prophétique, טָמֵא peut avoir une résonance cultuelle aussi bien qu’éthique. La traduction ne limite donc pas le terme à une seule de ces dimensions.
- issue: Interprétation de la proposition difficile וְהוּא לָמוֹ
  choice: 'Rapporter le pronom à la voie : « mais elle sera pour eux »'
  alternative: « et lui sera avec eux » ou « elle leur appartiendra »
  rationale: La syntaxe hébraïque est très condensée. Le renvoi à la voie s’accorde avec le contraste entre l’exclusion de l’impur et les voyageurs auxquels la voie est destinée, mais les autres lectures plausibles sont maintenues en note.
- issue: Rapport entre le voyageur et « les insensés »
  choice: Comprendre les insensés comme inclus parmi ceux qui suivent la voie
  alternative: Lire « les insensés ne s’égareront pas » comme une proposition distincte
  rationale: L’enchaînement hébreu est abrupt. La formulation française conserve l’idée étonnante que même les insensés ne s’égareront pas, sans expliquer la cause ni atténuer la tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Chaussée » et « route » préservent le double vocabulaire routier; la majuscule à « Voie » souligne qu’il s’agit du nom donné à cette route. Les ambiguïtés syntaxiques et théologiques réelles sont conservées dans le texte ou signalées en notes.
