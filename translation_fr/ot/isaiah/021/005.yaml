source:
  edition: WLC
  text: עָרֹ֧ךְ הַ/שֻּׁלְחָ֛ן צָפֹ֥ה הַ/צָּפִ֖ית אָכ֣וֹל שָׁתֹ֑ה ק֥וּמוּ הַ/שָּׂרִ֖ים מִשְׁח֥וּ מָגֵֽן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/005.yaml
  text: They set the table[a], they spread the rugs, they eat, they drink. Rise up, princes[b]; oil the shield.
translation:
  language: fr
  text: On dresse la table[a], on étend les tapis, on mange, on boit. Levez-vous, princes ! Enduisez d’huile le bouclier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « on surveille le poste de guet » ou « on place une sentinelle ». L’hébreu de cette proposition est difficile ; le texte retient le sens lié à la préparation d’un banquet, qui s’accorde avec la suite des actions.
    reason: alternative_reading
  - marker: b
    text: 'Littéralement « oignez le bouclier » : il s’agit vraisemblablement de préparer le bouclier au combat en l’enduisant d’huile.'
    reason: cultural_note
lexical_decisions:
- source_word: עָרֹךְ הַשֻּׁלְחָן
  choice: On dresse la table
  rationale: עָרֹךְ, de ערך, exprime l’action de disposer ou de mettre en ordre. « Dresser la table » est l’expression française naturelle qui conserve l’image concrète et la succession rapide des actions.
- source_word: צָפֹה הַצָּפִית
  choice: on étend les tapis
  rationale: Cette expression hébraïque rare et difficile peut désigner la mise en place d’un revêtement pour le banquet. « Étendre les tapis » rend cette interprétation de façon naturelle, tandis que la lecture liée à la surveillance est signalée en note.
- source_word: אָכוֹל שָׁתֹה
  choice: on mange, on boit
  rationale: Les deux infinitifs absolus produisent une description vive et condensée. Des verbes français au présent rendent naturellement cette scène en cours.
- source_word: קוּמוּ הַשָּׂרִים
  choice: Levez-vous, princes !
  rationale: L’impératif pluriel introduit une rupture urgente. « Princes » conserve le rang politique ou aristocratique possible de שׂרים sans le réduire à une fonction militaire.
- source_word: מִשְׁחוּ מָגֵן
  choice: Enduisez d’huile le bouclier
  rationale: משׁח signifie littéralement oindre ou enduire. La formulation explicite l’usage concret de l’huile dans la préparation du bouclier, tout en maintenant le singulier collectif de l’hébreu.
