  source_fidelity: 'Le texte rend fidèlement la séquence hébraïque : préparation du repas, manger et boire, puis brusque impératif militaire. « On dresse la table », « on étend les tapis », « Levez-vous, princes ! » et « Enduisez d’huile le bouclier » correspondent bien aux formes et au mouvement du texte. L’ambiguïté de צָפֹה הַצָּפִית est préservée en note sans imposer une solution certaine.'
