base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/003.yaml
  text: Therefore my loins are filled with anguish[a]; pains have seized me like the pains of a woman giving birth. I am bent over from hearing[b]; I am dismayed from seeing.
translation:
  language: fr
  text: C’est pourquoi mes reins sont remplis d’angoisse[a] ; des douleurs m’ont saisi, comme les douleurs d’une femme qui accouche. Je suis courbé par ce que j’entends ; je suis épouvanté par ce que je vois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tremblements » ; le terme hébreu évoque une détresse intense accompagnée de tremblements ou de contorsions.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלְאוּ מָתְנַי
  choice: mes reins sont remplis
  rationale: « Reins » conserve l’image corporelle concrète des מָתְנַיִם, la région des reins ou des hanches, dans un français biblique encore intelligible.
- source_word: חַלְחָלָה
  choice: angoisse
  rationale: Le nom évoque une détresse intense qui fait trembler ou se tordre. « Angoisse » exprime clairement cette expérience, tandis qu’une note préserve la dimension physique du terme.
- source_word: צִירִים אֲחָזוּנִי
  choice: des douleurs m’ont saisi
  rationale: צִירִים désigne ici des douleurs comparables à celles de l’accouchement, et אחז exprime une emprise soudaine et puissante.
- source_word: כְּצִירֵי יוֹלֵדָה
  choice: comme les douleurs d’une femme qui accouche
  rationale: Cette formulation actuelle conserve la comparaison explicite et l’image vive de la femme en train d’accoucher.
- source_word: נַעֲוֵיתִי
  choice: je suis courbé
  rationale: Le verbe peut décrire le fait d’être courbé, tordu ou plié sous l’effet de la détresse. « Je suis courbé » reste naturel sans effacer l’image corporelle.
- source_word: מִשְּׁמֹעַ
  choice: par ce que j’entends
  rationale: La préposition מן avec l’infinitif est comprise ici comme indiquant la cause. La formulation française explicite naturellement que ce qui est entendu provoque cette réaction.
- source_word: נִבְהַלְתִּי
  choice: épouvanté
  rationale: Le verbe exprime un bouleversement alarmé pouvant aller jusqu’à la terreur. « Épouvanté » convient à l’intensité physique et émotionnelle du contexte.
- source_word: מֵרְאוֹת
  choice: par ce que je vois
  rationale: Cette traduction causale maintient le parallélisme avec « par ce que j’entends » et rend la construction idiomatique en français.
