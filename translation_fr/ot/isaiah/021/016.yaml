id: ISA.21.16
reference: Isaiah 21:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי כֹ֛ה אָמַ֥ר אֲדֹנָ֖/י אֵלָ֑/י בְּ/ע֤וֹד שָׁנָה֙ כִּ/שְׁנֵ֣י שָׂכִ֔יר וְ/כָלָ֖ה כָּל כְּב֥וֹד קֵדָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/016.yaml
  text: 'For thus the Lord said to me: Within a year[a], like the years of a hired worker, all the glory of Kedar will come to an end.'
translation:
  language: fr
  text: 'Car voici ce que le Seigneur m’a dit : « Dans un an, compté aussi exactement que le temps d’un salarié, toute la gloire[a] de Qédar prendra fin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la splendeur » ou « toute la richesse ». Le mot hébreu peut désigner la gloire, l’honneur, la splendeur ou l’abondance matérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que … m’a dit
  rationale: « Car » conserve le lien explicatif avec le contexte, tandis que « voici ce que … a dit » rend naturellement en français moderne la formule déclarative hébraïque.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le texte porte le titre divin אֲדֹנָי, et non le tétragramme ; « le Seigneur » traduit directement ce titre.
- source_word: בְּעוֹד שָׁנָה
  choice: Dans un an
  rationale: La formule indique le délai restant avant l’accomplissement. « Dans un an » est idiomatique et n’implique pas que l’événement puisse survenir n’importe quand avant l’échéance.
- source_word: כִּשְׁנֵי שָׂכִיר
  choice: compté aussi exactement que le temps d’un salarié
  rationale: L’expression évoque une durée déterminée et soigneusement comptée, comme celle d’un travailleur rémunéré. Cette formulation explicite l’idiome tout en conservant sa comparaison.
- source_word: וְכָלָה
  choice: prendra fin
  rationale: Le verbe exprime ici l’épuisement ou la disparition complète de ce qui faisait la gloire de Qédar.
- source_word: כָּל כְּבוֹד
  choice: toute la gloire
  rationale: « Toute » maintient la portée totale du jugement ; « gloire » conserve l’étendue sémantique du terme, qui peut aussi évoquer prestige, splendeur ou richesse.
- source_word: קֵדָר
  choice: Qédar
  rationale: Le nom propre du peuple ou territoire arabe est translittéré selon l’usage français.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: Seigneur
  rationale: Le texte emploie un titre divin plutôt que le nom YHWH. L’article défini donne en français la forme naturelle du titre sans l’assimiler typographiquement au tétragramme.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le lien logique avec le verset précédent, la solennité de la parole divine et l’idée d’un délai exactement compté. Le marqueur de note est placé après « gloire », terme auquel la variante lexicale se rapporte.
