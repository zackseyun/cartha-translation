  text: מַשָּׂ֖א דּוּמָ֑ה אֵלַ/י֙ קֹרֵ֣א מִ/שֵּׂעִ֔יר שֹׁמֵר֙ מַה מִ/לַּ֔יְלָה שֹׁמֵ֖ר מַה מִ/לֵּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/011.yaml
  text: 'An oracle concerning Dumah: One calls to me from Seir[a], “Watchman, what of the night? Watchman[b], what of the night?”'
translation:
  language: fr
  text: 'Oracle concernant Douma : Quelqu’un m’appelle depuis Séir[a] : « Veilleur, où en est la nuit ? Veilleur, où en est la nuit ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom Douma peut aussi faire écho au mot hébreu évoquant le « silence ». Certains y voient une désignation d’Édom, puisque Séir est mentionné ici.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Combien reste-t-il de la nuit ? » L’expression hébraïque interroge sur l’état ou l’avancement de la nuit.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans les titres prophétiques, le terme introduit une parole solennelle. « Proclamation » est naturel en français moderne et évite le sens concret potentiellement trompeur de « fardeau ».
- source_word: דּוּמָה
  choice: Douma
  rationale: Le mot est traité comme un nom propre dans le titre, sans trancher son identification exacte; sa possible résonance avec le mot hébreu évoquant le silence est signalée en note.
- source_word: אֵלַי קֹרֵא
  choice: Quelqu’un m’appelle
  rationale: Le participe masculin singulier n’a pas de sujet explicite. « Quelqu’un » restitue naturellement cette indétermination.
- source_word: מִשֵּׂעִיר
  choice: depuis Séir
  rationale: Le nom propre est translittéré selon l’usage français, et la préposition indique l’origine de l’appel.
- source_word: שֹׁמֵר
  choice: Veilleur
  rationale: Dans cette scène nocturne, le terme désigne celui qui monte la garde. « Veilleur » convient au registre poétique et permet de conserver l’apostrophe répétée.
- source_word: מַה מִלַּיְלָה / מַה מִלֵּיל
  choice: où en est la nuit ?
  rationale: L’expression demande quel est l’état ou le degré d’avancement de la nuit. Cette formulation idiomatique française préserve la force de la question et la répétition, malgré les deux formes poétiques hébraïques de « nuit ».
theological_decisions:
- issue: Identification de דּוּמָה
  choice: Nom propre « Douma » dans le texte principal
  alternative: « silence » comme nom commun, ou allusion indirecte à Édom
  rationale: La forme du titre favorise un nom de lieu ou de peuple, tandis que la mention de Séir suggère un cadre édomite. La translittération conserve l’ambiguïté historique; les autres résonances sont présentées en note.
translation_notes:
  register: Français international moderne, digne et poétique. La répétition rhétorique est conservée; les noms propres suivent les formes françaises usuelles. Le second appel porte la note afin de ne pas interrompre le rythme de la citation.
