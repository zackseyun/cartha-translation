  text: For they have fled from swords[a], from the drawn sword, and from the bent bow[c][b], and from the weight of battle.
translation:
  language: fr
  text: Car ils ont fui devant les épées, devant l’épée dégainée[a], devant l’arc bandé[b] et devant le poids de la guerre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épée brandie » ou « étendue ». Le terme hébreu décrit une épée tirée, étendue ou prête à servir.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’arc tendu ». L’hébreu décrit un arc préparé pour le tir.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « le poids du combat ». Littéralement : « le poids de la guerre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’énoncé précédent avec une valeur causale naturelle en français.
- source_word: מִפְּנֵי
  choice: devant
  rationale: La préposition répétée exprime ici la fuite face à une menace; « devant » conserve à la fois la nuance spatiale et la cause de la fuite.
- source_word: חֲרָבוֹת
  choice: les épées
  rationale: Rend directement le pluriel hébreu et évoque la menace armée dans son ensemble.
- source_word: נָדָדוּ
  choice: ils ont fui
  rationale: Dans ce contexte militaire, le verbe désigne la fuite plutôt qu’une errance sans but.
- source_word: חֶרֶב נְטוּשָׁה
  choice: l’épée brandie
  rationale: נְטוּשָׁה décrit vraisemblablement une épée étendue ou prête à frapper; « brandie » exprime naturellement cette menace active.
- source_word: קֶשֶׁת דְּרוּכָה
  choice: l’arc tendu
  rationale: Expression française courante pour un arc préparé au tir, qui restitue l’image du participe hébreu.
- source_word: כֹּבֶד מִלְחָמָה
  choice: le poids du combat
  rationale: Conserve la métaphore concrète de la lourdeur tout en restant intelligible dans la scène militaire.
