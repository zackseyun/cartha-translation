source:
  edition: WLC
  text: חָז֥וּת קָשָׁ֖ה הֻגַּד לִ֑/י הַ/בּוֹגֵ֤ד בּוֹגֵד֙ וְ/הַ/שּׁוֹדֵ֣ד שׁוֹדֵ֔ד עֲלִ֤י עֵילָם֙ צוּרִ֣י מָדַ֔י כָּל אַנְחָתָ֖/ה הִשְׁבַּֽתִּי־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/002.yaml
  text: 'A harsh vision has been declared to me: the betrayer betrays[a], and the destroyer destroys. Go up, Elam; lay siege, Media[b]. I have put an end to all her groaning.'
translation:
  language: fr
  text: 'Une vision terrible m’a été annoncée : le traître trahit[a], et le dévastateur dévaste. Monte, Élam ! Assiège, Médie ! J’ai mis fin à tous ses gémissements[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le perfide agit avec perfidie, et le pillard se livre au pillage ».'
    reason: lexical_alternative
  - marker: b
    text: Le suffixe hébreu correspondant à « ses » est féminin singulier, mais son référent n’est pas explicitement indiqué dans ce verset.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזוּת קָשָׁה
  choice: une vision terrible
  rationale: חָזוּת désigne ici une vision prophétique, et קָשָׁה en souligne le caractère dur, pénible et redoutable. « Vision terrible » est naturel en français et restitue cette gravité.
- source_word: הֻגַּד לִי
  choice: m’a été annoncée
  rationale: Le passif de נגד exprime qu’un message a été communiqué au prophète. « Annoncée » conserve le registre prophétique sans lourdeur.
- source_word: הַבּוֹגֵד בּוֹגֵד
  choice: le traître trahit
  rationale: Cette formulation reproduit la répétition de la racine hébraïque et son effet rhétorique tout en restant claire en français.
- source_word: וְהַשֹּׁדֵד שֹׁדֵד
  choice: et le dévastateur dévaste
  rationale: שׁדד peut évoquer le pillage ou la dévastation violente. La répétition nominale et verbale préserve le parallélisme marqué de l’hébreu.
- source_word: עֲלִי עֵילָם
  choice: Monte, Élam !
  rationale: L’impératif de עלה est un appel militaire à avancer contre l’ennemi. « Monte » conserve l’image du texte source.
- source_word: צוּרִי מָדַי
  choice: Assiège, Médie !
  rationale: Dans ce contexte militaire, צור signifie encercler ou assiéger. L’impératif français est direct et concis.
- source_word: כָּל אַנְחָתָהּ
  choice: tous ses gémissements
  rationale: אַנְחָה désigne les soupirs ou gémissements causés par la détresse. Le possessif conserve l’absence de référent explicite dans le verset.
- source_word: הִשְׁבַּתִּי
  choice: j’ai mis fin à
  rationale: Le hiphil de שבת signifie « faire cesser ». Cette expression française rend naturellement la valeur causative.
theological_decisions:
- issue: Référent du suffixe féminin dans כָּל אַנְחָתָהּ
  choice: Le référent reste implicite avec « ses gémissements ».
  alternative: Préciser « les gémissements de Babylone », « du pays » ou « qu’elle provoquait ».
  rationale: Le suffixe hébreu est féminin singulier, mais son antécédent n’est pas nommé explicitement dans ce verset. Le préciser résoudrait indûment une ambiguïté du texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les impératifs brefs gardent la vigueur de l’oracle, et les répétitions « trahit » et « dévaste » reproduisent délibérément la rhétorique hébraïque.
