  text: וּ/שְׁאָ֧ר מִסְפַּר קֶ֛שֶׁת גִּבּוֹרֵ֥י בְנֵֽי קֵדָ֖ר יִמְעָ֑טוּ כִּ֛י יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/017.yaml
  text: And the remainder of the number of the bowmen[a], the mighty men of the sons of Kedar, will be few, for Yahweh, the God of Israel[b], has spoken.
translation:
  language: fr
  text: Le reste des archers[a], des guerriers parmi les fils de Qédar, sera peu nombreux[b], car Yahweh, le Dieu d’Israël, a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’arc », employé ici par métonymie pour les archers.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « le reste du nombre de l’arc [c’est-à-dire des archers] des guerriers des fils de Qédar deviendra peu nombreux ».
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁאָר מִסְפַּר
  choice: qui resteront … seront peu nombreux
  rationale: La tournure hébraïque est quantitativement marquée mais peu naturelle si elle est reproduite mot à mot. Cette formulation française exprime clairement le petit nombre des survivants tout en conservant l’idée de reste.
- source_word: קֶשֶׁת
  choice: les archers
  rationale: Le mot signifie littéralement « arc », employé ici par métonymie pour ceux qui le manient. « Archers » est actuel, naturel et adapté au contexte militaire.
- source_word: גִּבּוֹרֵי
  choice: les vaillants
  rationale: Dans ce contexte, le terme désigne des hommes forts et valeureux, notamment des guerriers. « Vaillants » garde la force de l’expression sans alourdir la phrase.
- source_word: בְנֵי קֵדָר
  choice: fils de Qédar
  rationale: Cette traduction conserve l’expression ethnique et généalogique hébraïque, intelligible dans un registre biblique français digne.
- source_word: יִמְעָטוּ
  choice: seront peu nombreux
  rationale: Le verbe exprime le fait de devenir ou d’être peu nombreux. La formulation rend ici naturellement le résultat annoncé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et habituelle de la construction hébraïque.
- source_word: דִּבֵּר
  choice: a parlé
  rationale: Le parfait fonde la certitude de l’annonce prophétique; « a parlé » conserve cette force de clôture.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » en préserve le caractère de nom propre sans lui substituer un titre.
- issue: Rapport syntaxique entre « arc », « vaillants » et « fils de Qédar »
  choice: Les survivants sont compris comme les archers appartenant aux vaillants fils de Qédar.
  alternative: « Le reste du nombre des arcs des vaillants fils de Qédar diminuera. »
  rationale: La chaîne de compléments hébraïque admet une traduction plus formelle, mais difficile en français. Le texte principal rend la métonymie et le sens militaire sans effacer l’autre construction possible, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite le calque lourd « le reste du nombre » dans le texte principal, tout en en conservant la possibilité en note. « Fils de Qédar » maintient la couleur de l’expression hébraïque.
