  source_fidelity: La phrase principale rend correctement l’annonce d’une forte diminution des archers de Qédar et la clôture divine. Toutefois, elle dilue la construction quantitative שְׁאָר מִסְפָּר (« le reste du nombre ») et « parmi les vaillants fils » introduit un rapport d’inclusion moins net que la chaîne de compléments hébraïque. La note b parle d’« arcs », alors que le sens contextuel est métonymiquement celui des archers.
  naturalness: « Le reste des archers, des guerriers parmi les fils de Qédar » est un français actuel et lisible, tout en restant suffisamment proche de la formulation dense de l’oracle. L’apposition explicite la valeur militaire de גִּבּוֹרֵי sans imposer une interprétation confessionnelle.
  terminology: « Archers » restitue de manière naturelle la métonymie de « l’arc »; « guerriers » rend mieux גִּבּוֹרֵי dans ce contexte militaire que « vaillants » employé seul. « Fils de Qédar », « Yahweh » et « le Dieu d’Israël » sont conservés.
  issues:
