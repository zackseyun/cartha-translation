    issue: La formulation principale atténue « le reste du nombre » et ajoute « parmi » dans une relation syntaxique qui n’est pas exprimée ainsi en hébreu.
    rationale: Le texte source met en avant ce qui subsiste et son petit nombre. Une formulation avec « le reste » conserve plus directement cette double idée sans calquer lourdement toute la chaîne nominale.
  - severity: medium
    issue: La note b présente « arcs des vaillants fils de Qédar ».
    rationale: Même si קֶשֶׁת signifie littéralement « arc », il est ici employé pour les porteurs d’arc; la note doit signaler cette métonymie au lieu de proposer une lecture française qui fait des arcs eux-mêmes le sujet de la diminution.
  revised_text: Le reste des archers[a], des guerriers parmi les fils de Qédar, sera peu nombreux[b], car Yahweh, le Dieu d’Israël, a parlé.
