  text: לִ/קְרַ֥את צָמֵ֖א הֵתָ֣יוּ מָ֑יִם יֹשְׁבֵי֙ אֶ֣רֶץ תֵּימָ֔א בְּ/לַחְמ֖/וֹ קִדְּמ֥וּ נֹדֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/014.yaml
  text: Bring water to meet the thirsty[a]; O inhabitants of the land of Tema[b], meet the fugitive with bread.
translation:
  language: fr
  text: Apportez de l’eau à celui qui a soif ; habitants du pays de Téma[b], allez à la rencontre du fugitif avec du pain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu porte littéralement : « avec son pain ». La construction peut évoquer des provisions apportées lors de la rencontre ou du pain fourni au fugitif ; le référent précis de « son » demeure incertain.'
    reason: lexical_alternative
  - marker: b
    text: Téma était une oasis et une région d’Arabie située sur des routes caravanières.
    reason: cultural_note
lexical_decisions:
- source_word: לִקְרַאת צָמֵא
  choice: à celui qui a soif
  rationale: La locution לִקְרַאת exprime le mouvement vers quelqu’un que l’on va rencontrer. En français, « apporter à » rend naturellement l’action sans répéter lourdement « aller à la rencontre ». Le singulier substantivé צָמֵא est conservé par « celui qui a soif ».
- source_word: הֵתָיוּ מָיִם
  choice: Apportez de l’eau
  rationale: L’impératif pluriel appelle ici à apporter ou présenter de l’eau ; cette formulation est naturelle et respecte l’objet explicite מָיִם.
- source_word: יֹשְׁבֵי אֶרֶץ תֵּימָא
  choice: habitants du pays de Téma
  rationale: Le groupe désigne les destinataires de l’impératif suivant et est donc rendu comme une apostrophe. Le toponyme est translittéré « Téma ».
- source_word: בְּלַחְמוֹ
  choice: avec du pain
  rationale: Le ב peut marquer l’accompagnement ou le moyen. Le suffixe consonantique permet littéralement « son pain », mais sa référence et la portée exacte de l’expression sont incertaines ; le texte principal conserve donc une formulation française sobre, avec une note signalant l’ambiguïté.
- source_word: קִדְּמוּ
  choice: allez à la rencontre
  rationale: Le piel exprime l’action d’aller au-devant de quelqu’un. « Allez à la rencontre » fait entendre le mouvement impliqué, plus clairement que le seul verbe « rencontrez ».
- source_word: נֹדֵד
  choice: du fugitif
  rationale: Dans ce contexte de fuite et de déplacement, le participe désigne plus probablement une personne en fuite qu’un simple voyageur ou vagabond.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et direct. L’ordre poétique en deux membres est préservé, tandis que la répétition hébraïque du vocabulaire de la rencontre est modulée pour rester idiomatique. Les deux appels s’adressent au pluriel aux habitants de Téma.
