source:
  edition: WLC
  text: כִּ֣י כֹ֥ה אָמַ֛ר אֵלַ֖/י אֲדֹנָ֑/י לֵ֚ךְ הַעֲמֵ֣ד הַֽ/מְצַפֶּ֔ה אֲשֶׁ֥ר יִרְאֶ֖ה יַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/006.yaml
  text: 'For thus the Lord said to me: “Go[a], station the watchman; let him report what he sees.”'
translation:
  language: fr
  text: 'Car voici ce que le Seigneur m’a dit : « Va, poste le guetteur ; qu’il rapporte ce qu’il voit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: Car voici ce que … m’a dit
  rationale: Cette formulation française naturelle conserve à la fois la fonction explicative de כִּי et la formule introductive כֹה אָמַר, ici inscrite dans un récit au passé.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin אֲדֹנָי, et non du nom divin YHWH. « Le Seigneur » le rend clairement en français moderne.
- source_word: לֵךְ הַעֲמֵד
  choice: Va, poste
  rationale: '« Va » rend directement l’impératif לֵךְ. « Poste » exprime la valeur causative de l’impératif hiphil הַעֲמֵד : faire prendre position à quelqu’un pour assurer la surveillance.'
- source_word: הַמְצַפֶּה
  choice: le guetteur
  rationale: Le participe substantivé désigne une personne chargée d’observer. « Guetteur » convient au contexte de surveillance et reste naturel en français.
- source_word: אֲשֶׁר יִרְאֶה יַגִּיד
  choice: qu’il annonce ce qu’il verra
  rationale: L’ordre indirect « qu’il annonce » restitue la valeur injonctive de יַגִּיד après les impératifs. Le futur « verra » conserve l’orientation prospective de יִרְאֶה dans cette mission.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: mon Seigneur
  rationale: Même si la forme est historiquement liée à « mon seigneur », אֲדֹנָי fonctionne ici comme titre divin établi. « Le Seigneur » est idiomatique et évite de le confondre avec le nom divin YHWH.
translation_notes:
  register: Registre courant et digne. La phrase conserve la brièveté impérative de la commission prophétique sans archaïsmes. Aucun appel de note n’est nécessaire, car les nuances lexicales peuvent être rendues directement dans le texte.
