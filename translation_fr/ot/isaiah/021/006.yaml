  source_fidelity: La formule introductive, le titre divin, les impératifs et l’idée de poster un observateur sont fidèlement rendus. Toutefois, « ce qu’il verra » interprète le yiqtol יִרְאֶה comme un futur strict. Dans cette consigne, il exprime plus naturellement ce que le guetteur observe/viendra à observer; le français « ce qu’il voit » conserve mieux la portée non marquée du texte et correspond à la formulation anglaise auditée.
  naturalness: Le français est clair, moderne et d’un registre approprié. « Poste le guetteur » est concis et recevable dans le contexte d’une consigne de surveillance. « Qu’il rapporte ce qu’il voit » est idiomatique et précise naturellement la fonction du guetteur.
  terminology: « Le Seigneur » rend correctement le titre divin אֲדֹנָי, sans le confondre avec le tétragramme. « Guetteur » convient à הַמְצַפֶּה. « Rapporte » rend bien la fonction déclarative de יַגִּיד dans ce contexte, sans surinterprétation théologique.
