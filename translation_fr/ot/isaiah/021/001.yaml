id: ISA.21.1
reference: Isaiah 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מַשָּׂ֖א מִדְבַּר יָ֑ם כְּ/סוּפ֤וֹת בַּ/נֶּ֨גֶב֙ לַֽ/חֲלֹ֔ף מִ/מִּדְבָּ֣ר בָּ֔א מֵ/אֶ֖רֶץ נוֹרָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/001.yaml
  text: 'An oracle concerning the wilderness of the sea: like whirlwinds in the Negev sweeping through[a], it comes from the wilderness[c][b], from a fearful land.'
translation:
  language: fr
  text: 'Proclamation concernant le désert de la mer[a] : comme des tourbillons qui traversent le Néguev[b], cela vient[c] du désert, d’un pays redoutable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le désert près de la mer ». L’expression hébraïque, inhabituelle, peut être une désignation géographique poétique.
    reason: lexical_alternative
  - marker: b
    text: Ou « le sud ». Le mot hébreu peut désigner la région du Néguev ou, plus généralement, le sud.
    reason: lexical_alternative
  - marker: c
    text: Le sujet de « vient » n’est pas exprimé en hébreu ; il peut renvoyer à la force comparable aux tourbillons qui vient d’être évoquée.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans les titres prophétiques, le terme introduit une parole solennelle, souvent porteuse de jugement. « Proclamation » conserve cette fonction sans suggérer le sens matériel de « fardeau ».
- source_word: מִדְבַּר יָם
  choice: le désert de la mer
  rationale: Cette expression construit une image géographique énigmatique. La traduction littérale en préserve l’étrangeté sans l’identifier d’emblée à un lieu ou à un peuple précis.
- source_word: כְּסוּפוֹת
  choice: comme des tourbillons
  rationale: Le mot désigne des vents de tempête violents. « Tourbillons » restitue la vigueur et le mouvement de la comparaison.
- source_word: בַּנֶּגֶב
  choice: dans le Néguev
  rationale: Le terme peut désigner le sud en général, mais aussi la région désertique du Néguev. La translittération conserve ici la couleur géographique.
- source_word: לַחֲלֹף
  choice: qui traversent
  rationale: L’infinitif exprime le passage rapide des vents à travers une région. « Qui traversent » est naturel en français et respecte le mouvement de l’image.
- source_word: מִמִּדְבָּר בָּא
  choice: cela vient du désert
  rationale: Le verbe hébreu est au singulier, sans sujet exprimé. Le pronom neutre « cela » évite d’introduire arbitrairement un sujet humain ou masculin.
- source_word: מֵאֶרֶץ נוֹרָאָה
  choice: d’un pays redoutable
  rationale: נוֹרָאָה décrit ce qui inspire la crainte ou l’effroi. « Redoutable » en transmet la force sans préciser indûment la nature de la menace.
theological_decisions:
- issue: Interprétation du titre géographique énigmatique
  choice: Conserver « le désert de la mer » dans le texte principal.
  alternative: Rendre l’expression par « le désert près de la mer » ou l’identifier explicitement à Babylone.
  rationale: Le texte hébreu laisse l’expression énigmatique. La traduction ne doit pas résoudre dans le texte principal une identification géographique ou historique qui n’y est pas formulée.
- issue: Sujet implicite du verbe בָּא
  choice: Employer le neutre « cela vient ».
  alternative: Employer « il vient », « quelqu’un vient » ou désigner explicitement l’envahisseur.
  rationale: Le sujet n’est pas exprimé en hébreu et peut renvoyer au phénomène comparé à la tempête. Une formulation neutre préserve cette ambiguïté.
translation_notes:
  register: Français international actuel, sobre et solennel. La syntaxe conserve l’image dense et l’ambiguïté du texte hébreu tout en restant intelligible à la lecture.
