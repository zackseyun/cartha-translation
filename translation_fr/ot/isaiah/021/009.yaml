  text: וְ/הִנֵּה זֶ֥ה בָא֙ רֶ֣כֶב אִ֔ישׁ צֶ֖מֶד פָּֽרָשִׁ֑ים וַ/יַּ֣עַן וַ/יֹּ֗אמֶר נָפְלָ֤ה נָֽפְלָה֙ בָּבֶ֔ל וְ/כָל פְּסִילֵ֥י אֱלֹהֶ֖י/הָ שִׁבַּ֥ר לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/009.yaml
  text: And look[a], here comes a chariot, a man with a pair of horsemen. And he answered and said, “Fallen, fallen is Babylon[c][b], and all the carved images of her gods he has shattered to the ground.”
translation:
  language: fr
  text: 'Et voici qu’arrive un char — un homme, une paire de cavaliers[a]. Il prit la parole et dit : « Elle est tombée, elle est tombée, Babylone ! Toutes les images taillées de ses dieux[b], il les a fracassées à terre[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé : « un char, un homme, une paire de cavaliers ». La relation exacte entre ces éléments est incertaine.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « toutes les idoles de ses dieux ».'
    reason: lexical_alternative
  - marker: c
    text: L’hébreu dit « il a fracassé », sans nommer l’auteur de l’action ; celui-ci doit être compris d’après le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה זֶה בָא
  choice: Et voici qu’arrive
  rationale: Rend l’annonce déictique et saisissante du texte hébreu dans un français actuel, tout en conservant l’idée d’une arrivée en cours.
- source_word: רֶכֶב אִישׁ צֶמֶד פָּרָשִׁים
  choice: un char, avec un homme et une paire de cavaliers
  rationale: La formulation hébraïque est très condensée et sa syntaxe reste incertaine. Cette traduction en conserve les principaux éléments sans préciser indûment leur relation exacte.
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: Il prit la parole et dit
  rationale: Formule française naturelle qui restitue les deux verbes hébreux introduisant la proclamation.
- source_word: נָפְלָה נָפְלָה בָּבֶל
  choice: Elle est tombée, elle est tombée, Babylone !
  rationale: Conserve la répétition emphatique et l’antéposition du verdict. Le pronom féminin reprend naturellement Babylone en français.
- source_word: פְּסִילֵי אֱלֹהֶיהָ
  choice: les statues sculptées de ses dieux
  rationale: פְּסִילִים désigne concrètement des représentations taillées ou sculptées; « statues sculptées » reste clair sans réduire d’emblée le terme à sa qualification religieuse d’« idoles ».
- source_word: שִׁבַּר לָאָרֶץ
  choice: il les a fracassées à terre
  rationale: « Fracasser » exprime la destruction violente, tandis que « à terre » rend naturellement la direction et le résultat indiqués par לָאָרֶץ.
theological_decisions:
- issue: Identité de l’agent qui détruit les statues
  choice: Conserver le singulier actif « il les a fracassées » sans identifier l’agent.
  alternative: « elles ont été fracassées » ou « on les a fracassées »
  rationale: Le verbe hébreu est à la troisième personne du masculin singulier, mais son sujet n’est pas exprimé. La traduction préserve cette tension au lieu d’attribuer explicitement l’action à Dieu ou à un conquérant.
translation_notes:
  register: Français international moderne, digne et accessible. La proclamation garde sa brièveté et sa force, tandis qu’une note signale la syntaxe exceptionnellement comprimée de la description du char.
