  verdict: revise
  source_fidelity: La proclamation sur Babylone et la destruction de ses représentations cultuelles est globalement fidèle. Toutefois, « avec un homme et une paire de cavaliers » établit une relation syntaxique que l’hébreu extrêmement elliptique ne précise pas et produit une image inutilement définie. « Statues sculptées » est aussi redondant pour פְּסִילִים, qui désigne plus exactement des images taillées/sculptées.
  naturalness: Le français est généralement moderne et clair. « Un char, un homme, une paire de cavaliers » conserve délibérément la juxtaposition abrupte du texte, mais avec une ponctuation qui la présente comme une description visionnaire comprimée; la note en explique l’ellipse. « Images taillées » est à la fois naturel dans ce registre et moins tautologique.
  terminology: « Babylone », « dieux », la répétition emphatique de la chute et l’agent singulier non identifié sont bien rendus. « Images taillées » restitue le terme concret פְּסִילִים sans imposer d’emblée l’interprétation « idoles ».
