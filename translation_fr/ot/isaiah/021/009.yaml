  to: 'Et voici qu’arrive un char — un homme, une paire de cavaliers[a]. Il prit la parole et dit : « Elle est tombée, elle est tombée, Babylone ! Toutes les images taillées de ses dieux[b], il les a fracassées à terre[c]. »'
