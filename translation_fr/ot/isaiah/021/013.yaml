  text: מַשָּׂ֖א בַּ/עְרָ֑ב בַּ/יַּ֤עַר בַּ/עְרַב֙ תָּלִ֔ינוּ אֹֽרְח֖וֹת דְּדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/013.yaml
  text: 'An oracle concerning Arabia: In the forest in Arabia you will spend the night[c][b][a], O caravans of Dedanites.'
translation:
  language: fr
  text: 'Proclamation au sujet de l’Arabie[a].


    Dans les bois, en Arabie[b],


    vous passerez la nuit,


    caravanes des Dedanites[c] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fardeau au sujet de l’Arabie » ou « Oracle au sujet de l’Arabie ». Dans les titres prophétiques, le mot hébreu מַשָּׂא peut désigner un fardeau ou une parole solennelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « Dans les fourrés, en Arabie ». Le mot hébreu יַעַר signifie habituellement « forêt » ou « bois », mais il peut désigner ici une zone de broussailles.
    reason: cultural_note
  - marker: c
    text: L’expression hébraïque peut aussi se traduire littéralement par « chemins des Dedanites » ; dans ce contexte, elle désigne probablement des groupes de voyageurs, c’est-à-dire des caravanes.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans un titre prophétique, le terme introduit une parole solennelle. « Proclamation » est actuel et digne, tandis que « oracle » peut évoquer en français moderne la divination et que « fardeau » privilégierait une autre nuance possible.
- source_word: בַּעְרָב
  choice: au sujet de l’Arabie
  rationale: Après מַשָּׂא, la préposition indique naturellement le sujet de la proclamation sans imposer à elle seule le sens hostile « contre ».
- source_word: בַּיַּעַר
  choice: Dans les bois
  rationale: יַעַר désigne normalement une forêt ou une région boisée. « Les bois » garde ce sens lexical tout en convenant mieux qu’une forêt dense au contexte géographique.
- source_word: בַּעְרַב
  choice: en Arabie
  rationale: La lecture géographique reprend vraisemblablement le nom de lieu du titre et s’accorde avec la mention des Dedanites, bien que les mêmes consonnes puissent être associées au soir.
- source_word: תָּלִינוּ
  choice: vous passerez la nuit
  rationale: Le verbe לין signifie loger ou passer la nuit ; cette formulation est naturelle en français moderne et conserve la valeur temporelle.
- source_word: אֹרְחוֹת
  choice: caravanes
  rationale: Le nom peut littéralement désigner des chemins ou des routes, mais l’apostrophe et le complément « de Dedan » orientent ici vers les groupes qui les parcourent, donc des caravanes.
- source_word: דְּדָנִים
  choice: de Dedan
  rationale: La forme renvoie aux gens de Dedan. Avec « caravanes », « caravanes de Dedan » exprime naturellement leur origine ou leur appartenance sans alourdir le vers.
