base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/012.yaml
  text: The watchman says[a], “Morning comes, and also night. If you would inquire, inquire; return[b], come.”
translation:
  language: fr
  text: 'Le guetteur dit[a] : « Le matin vient, et aussi la nuit. Si vous voulez interroger, interrogez ; revenez[b], venez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le matin est venu, et aussi la nuit. » L’hébreu peut exprimer soit une venue présentée de manière générale, soit une annonce plus immédiate.'
    reason: lexical_alternative
  - marker: b
    text: Les derniers impératifs peuvent aussi se comprendre comme « faites demi-tour, venez » ou « revenez, venez de nouveau ». Ils peuvent évoquer un retournement ou simplement le fait de revenir poser la question ; l’hébreu laisse la nuance ouverte.
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר
  choice: le guetteur
  rationale: Le participe substantivé désigne celui qui veille. « Guetteur » convient au contexte immédiat de l’oracle et sonne naturellement en français moderne.
- source_word: אָמַר
  choice: dit
  rationale: Bien que la forme hébraïque soit un accompli, le présent français introduit naturellement la réponse directe et garde son caractère vivant.
- source_word: אָתָה בֹקֶר
  choice: le matin vient
  rationale: Le verbe signifie « venir » et בֹקֶר « matin ». Cette formulation conserve l’image de l’arrivée du matin sans la préciser davantage.
- source_word: וְגַם לָיְלָה
  choice: et aussi la nuit
  rationale: La coordination simple préserve la juxtaposition énigmatique du matin et de la nuit sans imposer une valeur adversative.
- source_word: אִם תִּבְעָיוּן בְּעָיוּ
  choice: si vous voulez interroger, interrogez
  rationale: La répétition du même radical hébreu est maintenue. « Voulez » exprime ici la disposition ou l’intention sans alourdir la phrase.
- source_word: שֻׁבוּ
  choice: revenez
  rationale: Le verbe peut signifier revenir ou faire demi-tour. « Revenez » garde ouverte l’idée d’un retour physique, d’une nouvelle démarche ou d’un retournement.
- source_word: אֵתָיוּ
  choice: venez
  rationale: L’impératif est rendu directement, en conservant la succession brève et énigmatique « revenez, venez ».
theological_decisions:
- issue: Portée de « revenez »
  choice: Conserver un commandement non explicité
  alternative: Rendre explicitement par « repentez-vous » ou « revenez plus tard »
  rationale: Le texte hébreu ne décide pas clairement entre un retournement spirituel, un retour physique ou une invitation à revenir poser la question. La traduction ne tranche donc pas.
translation_notes:
  register: Français moderne, sobre et digne. La formulation conserve les répétitions, la brièveté et l’ambiguïté de l’oracle, sans expliciter artificiellement le rapport entre le matin et la nuit ni la portée des impératifs finaux.
