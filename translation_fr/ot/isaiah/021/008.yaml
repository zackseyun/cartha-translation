source:
  edition: WLC
  text: וַ/יִּקְרָ֖א אַרְיֵ֑ה עַל מִצְפֶּ֣ה אֲדֹנָ֗/י אָנֹכִ֞י עֹמֵ֤ד תָּמִיד֙ יוֹמָ֔ם וְ/עַל מִ֨שְׁמַרְתִּ֔/י אָנֹכִ֥י נִצָּ֖ב כָּל הַ/לֵּילֽוֹת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/008.yaml
  text: Then he cried[a], “A lion! On the watchtower, my lord, I stand continually by day[b], and at my post I am stationed all the nights.”
translation:
  language: fr
  text: 'Alors il cria[a] : « Un lion ! Sur la tour de guet, mon seigneur, je me tiens constamment durant le jour, et à mon poste, je demeure en faction toutes les nuits[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Un lion ! » ou « Lion ! » L’expression est difficile ; certains comprennent que la sentinelle crie comme un lion.'
    reason: alternative_reading
  - marker: b
    text: 'Ou « chaque nuit ». L’hébreu porte littéralement le pluriel : « toutes les nuits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Alors il cria
  rationale: Le wayyiqtol de קרא fait avancer le récit et signifie ici appeler ou crier à haute voix ; « cria » convient à l’exclamation urgente.
- source_word: אַרְיֵה
  choice: Un lion !
  rationale: Le nom signifie littéralement « lion ». La syntaxe est difficile ; la traduction conserve sans l’expliciter la leçon massorétique, tandis que la note signale l’interprétation comparative possible.
- source_word: עַל מִצְפֶּה
  choice: Sur la tour de guet
  rationale: מִצְפֶּה désigne un lieu d’observation, poste élevé ou tour de guet ; cette formulation est naturelle dans le contexte d’une sentinelle.
- source_word: אֲדֹנָי
  choice: mon seigneur
  rationale: Le terme muni du suffixe de première personne désigne ici le supérieur auquel la sentinelle rend compte, et non le nom divin.
- source_word: עֹמֵד תָּמִיד יוֹמָם
  choice: je me tiens constamment durant le jour
  rationale: Le participe exprime une position prolongée, תָּמִיד la continuité, et יוֹמָם la période diurne.
- source_word: וְעַל מִשְׁמַרְתִּי
  choice: et à mon poste
  rationale: מִשְׁמֶרֶת peut désigner la garde, la veille ou le poste assigné ; « à mon poste » restitue sobrement la situation militaire.
- source_word: אָנֹכִי נִצָּב
  choice: je reste en place
  rationale: Le participe niphal de נצב évoque le fait d’être établi ou maintenu en position ; la formulation évite une répétition lourde de « je me tiens » tout en gardant l’idée durative.
- source_word: כָּל הַלֵּילוֹת
  choice: toutes les nuits
  rationale: Cette traduction garde le pluriel explicite de l’hébreu et suggère une vigilance nocturne répétée.
theological_decisions:
- issue: Identité de « mon seigneur »
  choice: Titre humain en minuscules
  alternative: « mon Seigneur », comme titre divin
  rationale: La forme avec suffixe et la scène d’un rapport adressé à un supérieur favorisent l’adresse humaine ; la traduction ne transforme donc pas le titre en désignation divine.
- issue: Fonction syntaxique de אַרְיֵה
  choice: Conserver l’exclamation nominale « Un lion ! »
  alternative: « comme un lion » ou « d’une voix de lion »
  rationale: Le texte massorétique ne porte aucune particule comparative. La formulation principale préserve sa difficulté et la note présente l’interprétation comparative sans l’imposer.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation rend le discours de la sentinelle lisible sans résoudre la difficulté de « lion ». « Durant le jour » et « toutes les nuits » conservent le contraste temporel et le pluriel hébreu.
