source:
  edition: WLC
  text: תָּעָ֣ה לְבָבִ֔/י פַּלָּצ֖וּת בִּֽעֲתָ֑תְ/נִי אֵ֚ת נֶ֣שֶׁף חִשְׁקִ֔/י שָׂ֥ם לִ֖/י לַ/חֲרָדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/004.yaml
  text: My heart reels; shuddering terrifies me[a]. The twilight I longed for he has turned into terror for me.
translation:
  language: fr
  text: Mon cœur chancelle ; un tremblement d’effroi me saisit. Du crépuscule que je désirais, il[a] en a fait pour moi une terreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le sujet de « il en a fait » n’est pas exprimé en hébreu.
    reason: ambiguïté grammaticale concernant l’agent
lexical_decisions:
- source_word: תָּעָה
  choice: chancelle
  rationale: Le verbe signifie littéralement errer ou s’égarer. Avec « mon cœur », « chancelle » exprime naturellement en français le bouleversement et la désorientation intérieure, tout en conservant l’image d’instabilité.
- source_word: לְבָבִי
  choice: mon cœur
  rationale: Cette traduction directe conserve la conception hébraïque du cœur comme centre de la vie intérieure.
- source_word: פַּלָּצוּת
  choice: un frisson d’horreur
  rationale: Le nom évoque à la fois un violent frémissement et l’horreur qui le provoque. Cette expression française garde les dimensions physique et émotionnelle du terme.
- source_word: בִּעֲתַתְנִי
  choice: m’épouvante
  rationale: Le verbe désigne l’action de terrifier ou de saisir d’effroi. Le présent rend l’effet immédiat et saisissant de la vision.
- source_word: נֶשֶׁף
  choice: le crépuscule
  rationale: Le mot désigne la lumière indistincte du crépuscule, souvent celui du soir. « Crépuscule » préserve l’atmosphère poétique sans préciser plus que l’hébreu.
- source_word: חִשְׁקִי
  choice: que je désirais
  rationale: Le nom suffixé signifie littéralement « mon désir ». La tournure verbale est plus naturelle en français et exprime fidèlement le crépuscule attendu avec désir.
- source_word: שָׂם לִי לַחֲרָדָה
  choice: l’a changé pour moi en terreur
  rationale: La construction signifie qu’une chose est rendue ou établie comme une autre. Cette formulation française exprime clairement le renversement du crépuscule désiré en expérience terrifiante.
theological_decisions:
- issue: Identité du sujet implicite de שָׂם
  choice: il, accompagné d’une note signalant l’absence de sujet explicite
  alternative: Dieu l’a changé / il s’est changé
  rationale: Le verbe hébreu est à la troisième personne du singulier, mais le sujet n’est pas nommé dans ce verset. Employer « il » sans identifier l’agent, puis expliciter cette ambiguïté en note, évite aussi bien d’ajouter « Dieu » que de transformer la proposition active en tournure pronominale.
translation_notes:
  register: Français international actuel, poétique et digne. Le balancement des deux phrases et la répétition du champ lexical de la peur rendent l’intensité de l’hébreu sans lisser son caractère saisissant.
