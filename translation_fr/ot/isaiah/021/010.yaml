  text: מְדֻשָׁתִ֖/י וּ/בֶן גָּרְנִ֑/י אֲשֶׁ֣ר שָׁמַ֗עְתִּי מֵ/אֵ֨ת יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל הִגַּ֥דְתִּי לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/021/010.yaml
  text: O my threshed one[a], and son of my threshing floor, what I have heard from Yahweh of hosts, the God of Israel[b], I have declared to you.
translation:
  language: fr
  text: Ô toi qui as été battu[a], fils de mon aire de battage[b] ! Ce que j’ai entendu de la part de Yahweh des armées, le Dieu d’Israël, je vous l’ai annoncé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon/ma battu(e) ». Le terme hébreu évoque le battage ou le foulage et emploie cette image pour une dure affliction.'
    reason: lexical_alternative
  - marker: b
    text: Expression métaphorique inhabituelle, étroitement liée à l’image du battage. Elle peut désigner ceux qui ont été traités comme le grain sur une aire.
    reason: cultural_note
lexical_decisions:
- source_word: מְדֻשָׁתִי
  choice: toi qu’on a battu comme le grain
  rationale: Le terme dérive de דושׁ, « battre, fouler » le grain. Cette formulation française rend explicite le domaine agricole sans réduire la métaphore à la seule idée abstraite d’oppression.
- source_word: וּבֶן גָּרְנִי
  choice: fils de mon aire de battage
  rationale: La traduction garde les mots concrets בֵּן, « fils », et גֹּרֶן, « aire de battage », ainsi que leur parallélisme avec l’image précédente, malgré l’étrangeté volontaire de la métaphore.
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: Ce que j’ai entendu
  rationale: Le relatif introduit le contenu du message reçu; le passé composé convient naturellement au lien entre l’audition antérieure et l’annonce présente.
- source_word: מֵאֵת
  choice: de la part de
  rationale: Cette locution marque clairement et naturellement la source personnelle du message.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré, et צְבָאוֹת est rendu par « armées », terme français actuel qui conserve l’image de puissances rangées sans préciser s’il s’agit d’armées terrestres ou célestes.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la construction hébraïque.
- source_word: הִגַּדְתִּי לָכֶם
  choice: je vous l’ai annoncé
  rationale: Le hiphil de נגד exprime l’action de faire connaître; « annoncer » maintient le registre prophétique. Le pronom « vous » respecte le pluriel de לָכֶם, et « l’ » reprend naturellement le contenu entendu.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre divin; sa translittération préserve cette donnée au lieu de lui substituer un titre.
- issue: Interprétation de l’image du battage
  choice: Conserver dans le texte l’image agricole d’une personne battue comme le grain
  alternative: mon peuple opprimé
  rationale: Le référent collectif est probable dans le contexte, mais il n’est pas nommé dans ce verset. La formulation retenue préserve donc l’image et son ambiguïté plutôt que de la résoudre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’armée céleste
  rationale: L’hébreu ne précise pas ici la nature des « armées »; la traduction reste large afin de ne pas imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et prophétique. L’apostrophe initiale conserve sa vigueur poétique; la syntaxe finale reste solennelle tout en étant idiomatique. Les métaphores agricoles sont maintenues et expliquées sans identifier explicitement leur référent.
