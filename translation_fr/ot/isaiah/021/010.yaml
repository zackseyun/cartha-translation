  rationale: La révision retire la comparaison « comme le grain », qui n’est pas formulée dans l’hébreu, tout en préservant l’image du battage par le contexte immédiat et les notes. Elle conserve l’étrangeté poétique de « fils de mon aire de battage » sans en imposer un référent collectif. La première note rend explicitement compte du suffixe possessif que le français ne peut intégrer ici naturellement sans produire une expression opaque.
