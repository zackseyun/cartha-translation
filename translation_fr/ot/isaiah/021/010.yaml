  naturalness: « Ô toi qui as été battu » est idiomatique dans un registre prophétique moderne. « Fils de mon aire de battage » demeure volontairement insolite, comme l’expression hébraïque, mais reste intelligible grâce à la note. La suppression de « comme le grain » évite une explicitation interprétative dans le texte courant.
  terminology: « Yahweh des armées » et « le Dieu d’Israël » sont appropriés et cohérents. « Annoncé » convient à הִגַּדְתִּי. Les notes doivent identifier avec exactitude le possessif de la première expression et ne pas présenter l’image ajoutée au texte comme si elle y figurait sous forme comparative.
