  text: And he saw riders, pairs of horsemen[a], riders on donkeys, riders on camels; and he listened intently, with great attentiveness.
translation:
  language: fr
  text: Il vit des cavaliers, des cavaliers allant deux par deux, des hommes montés sur des ânes et des hommes montés sur des chameaux. Il écouta avec une très grande attention[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu emploie une expression emphatique apparentée à « attention, grande écoute » ; le dernier terme est un infinitif qui renforce l’idée : « il écouta très attentivement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Il vit
  rationale: Le qal accompli à la troisième personne du masculin singulier, coordonné au contexte narratif, est rendu naturellement par le passé simple.
- source_word: רֶכֶב
  choice: cavaliers / hommes montés
  rationale: Dans cette série comprenant chevaux, ânes et chameaux, le terme désigne vraisemblablement des unités montées plutôt que des chars à roues. La variation française évite de qualifier improprement de « cavaliers » ceux qui montent des ânes ou des chameaux.
- source_word: צֶמֶד פָּרָשִׁים
  choice: des cavaliers allant deux par deux
  rationale: צֶמֶד exprime l’idée d’une paire, et פָּרָשִׁים celle de cavaliers. Cette formulation conserve l’organisation par paires sans imposer l’image d’un attelage.
- source_word: רֶכֶב חֲמוֹר
  choice: des hommes montés sur des ânes
  rationale: Le syntagme construit est compris dans son contexte comme désignant des hommes utilisant des ânes comme montures.
- source_word: רֶכֶב גָּמָל
  choice: des hommes montés sur des chameaux
  rationale: La traduction suit le parallélisme avec les ânes et exprime clairement le sens collectif de cavaliers montés sur des chameaux.
- source_word: וְהִקְשִׁיב
  choice: Il écouta
  rationale: Le hiphil de קשׁב exprime une écoute volontaire et attentive; l’intensité est portée par la locution nominale qui suit.
- source_word: קֶשֶׁב רַב קָשֶׁב
  choice: avec une très grande attention
  rationale: La répétition emphatique du nom קֶשֶׁב, renforcée par רַב, est rendue dans un français naturel tout en étant signalée littéralement en note.
