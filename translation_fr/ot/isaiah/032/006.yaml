source:
  edition: WLC
  text: כִּ֤י נָבָל֙ נְבָלָ֣ה יְדַבֵּ֔ר וְ/לִבּ֖/וֹ יַעֲשֶׂה אָ֑וֶן לַ/עֲשׂ֣וֹת חֹ֗נֶף וּ/לְ/דַבֵּ֤ר אֶל יְהוָה֙ תּוֹעָ֔ה לְ/הָרִיק֙ נֶ֣פֶשׁ רָעֵ֔ב וּ/מַשְׁקֶ֥ה צָמֵ֖א יַחְסִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/006.yaml
  text: 'For a fool speaks folly[a], and his heart devises iniquity: to practice godlessness and to speak error against Yahweh[c][b], to leave the hungry person empty and to withhold drink from the thirsty.'
translation:
  language: fr
  text: 'Car l’insensé dit des folies,


    et son cœur commet le mal :


    il pratique l’impiété[a],


    dit des faussetés contre Yahweh[b],


    laisse l’affamé sans rien[c]


    et prive l’assoiffé de boisson.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’hypocrisie » ; le mot hébreu peut désigner l’impiété, notamment lorsqu’elle se manifeste par une conduite hypocrite et mauvaise.
    reason: lexical_alternative
  - marker: b
    text: Ou « dit des faussetés au sujet de Yahweh ».
    reason: alternative_reading
  - marker: c
    text: Littéralement, « vider l’appétit de l’affamé ». Le mot hébreu peut désigner la personne vivante ou son appétit, et non nécessairement l’« âme » au sens étroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל / נְבָלָה
  choice: le fou dit des folies
  rationale: 'Cette formulation conserve le jeu de mots hébreu tout en donnant à « fou » son sens moral : une personne insensée et vile, non simplement peu intelligente.'
- source_word: וְלִבּוֹ יַעֲשֶׂה אָוֶן
  choice: et son cœur commet le mal
  rationale: « Cœur » maintient l’image hébraïque du centre de la volonté et de la pensée. Le verbe יַעֲשֶׂה signifie ici faire ou produire plutôt que nécessairement « concevoir », et אָוֶן désigne le mal ou l’iniquité.
- source_word: חֹנֶף
  choice: impiété
  rationale: Dans ce contexte, le terme désigne une conduite profane et opposée à Dieu; « impiété » convient mieux que le sens plus étroit d’« hypocrisie ».
- source_word: אֶל יְהוָה תּוֹעָה
  choice: profère des paroles mensongères contre Yahweh
  rationale: תּוֹעָה évoque l’erreur, l’égarement ou la fausseté. « Paroles mensongères » rend naturellement cette parole fausse, tandis que « contre » exprime sa force hostile sans effacer l’autre possibilité syntaxique, signalée en note.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin représente directement le tétragramme hébreu plutôt que de lui substituer un titre.
- source_word: לְהָרִיק נֶפֶשׁ רָעֵב
  choice: laisse l’affamé le ventre vide
  rationale: נֶפֶשׁ désigne ici l’être vivant dans son besoin physique, voire son appétit, et non une âme désincarnée. L’expression française rend concrètement la privation.
- source_word: וּמַשְׁקֶה צָמֵא יַחְסִיר
  choice: prive l’assoiffé de boisson
  rationale: La tournure exprime clairement l’action de faire manquer ou de retenir la boisson nécessaire.
theological_decisions:
- issue: Sens éthique et religieux de חֹנֶף
  choice: impiété
  alternative: hypocrisie
  rationale: Le parallèle avec les paroles fausses contre Yahweh et la privation des nécessiteux indique une impiété active, notion plus large qu’une simple dissimulation hypocrite.
- issue: Référent de נֶפֶשׁ
  choice: l’affamé le ventre vide
  alternative: l’âme de l’affamé vide
  rationale: Le contexte vise la personne affamée dans son besoin corporel. Une traduction littérale par « âme » risquerait d’introduire une opposition entre corps et âme absente du passage.
- issue: Rapport exprimé par אֶל יְהוָה
  choice: contre Yahweh
  alternative: au sujet de Yahweh
  rationale: Le contexte permet de comprendre une parole hostile dirigée contre Yahweh, mais la préposition peut aussi introduire ce dont on parle; l’ambiguïté est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes met en évidence la série d’actions sans ajouter de structure absente de l’hébreu. Le jeu de mots entre נָבָל et נְבָלָה est conservé par « fou » et « folies ».
