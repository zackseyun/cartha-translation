review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est fidèle au texte hébreu : la folie moralement coupable, l’impiété, la parole fausse à l’égard de Yahweh et la privation des personnes dans le besoin sont bien rendues. Toutefois, « laisse l’affamé le ventre vide » est une formulation française peu idiomatique et interprète נֶפֶשׁ de manière plus anatomique que nécessaire. « Des paroles mensongères » ajoute un pluriel absent du texte, sans nécessité.'
  naturalness: Le registre est moderne et digne, mais « laisse l’affamé le ventre vide » sonne heurté en français international. « Laisse l’affamé sans rien » est plus naturel et conserve la notion de privation. « Dire des faussetés » est plus direct et plus près de l’unique nom hébreu תּוֹעָה que « proférer des paroles mensongères ».
  terminology: « Impiété » rend bien חֹנֶף dans ce contexte. « Yahweh » respecte la décision terminologique fournie. « Insensé » exprime plus nettement la portée éthique de נָבָל que « fou », tout en permettant de conserver le jeu avec « folie ».
  issues:
  - severity: medium
    issue: Formulation de la privation de l’affamé
    rationale: « Laisse l’affamé le ventre vide » est peu naturel et réduit potentiellement נֶפֶשׁ à l’estomac. Le contexte vise l’affamé dans son besoin ; « laisse l’affamé sans rien » est idiomatique et suffisamment équivalent.
  - severity: low
    issue: Expansion plurielle dans la parole contre Yahweh
    rationale: Le texte porte le singulier תּוֹעָה (« fausseté », « parole d’égarement »). « Dire des faussetés » est naturel en français, mais « des paroles mensongères » est une expansion plus marquée. Une formulation plus concise améliore la proximité au source.
  - severity: low
    issue: Nuance morale de נָבָל
    rationale: En français courant, « fou » évoque volontiers la maladie mentale ou l’excentricité. « Insensé » garde plus clairement le sens biblique d’une personne moralement dépourvue de jugement.
