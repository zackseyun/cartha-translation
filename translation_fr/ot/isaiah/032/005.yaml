id: ISA.32.5
reference: Isaiah 32:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לֹֽא יִקָּרֵ֥א ע֛וֹד לְ/נָבָ֖ל נָדִ֑יב וּ/לְ/כִילַ֕י לֹ֥א יֵֽאָמֵ֖ר שֽׁוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/005.yaml
  text: No longer will the fool be called noble[d][c][b][a], nor will the scoundrel be called generous.
translation:
  language: fr
  text: Le fou[a] ne sera plus appelé noble[b], et l’avare[c] ne sera plus qualifié de généreux[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme vil »; le mot hébreu évoque la bassesse morale autant que la folie.
    reason: lexical_alternative
  - marker: b
    text: Ou « généreux », « magnanime » ou « de noble rang ».
    reason: lexical_alternative
  - marker: c
    text: Ou « l’homme mesquin » ou « l’homme sans scrupules ».
    reason: lexical_alternative
  - marker: d
    text: Ou « noble », « riche » ou « important ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָל
  choice: le fou
  rationale: Le terme désigne moins un manque d’intelligence qu’une personne moralement insensée ou vile. « Le fou » reste concis et fait entendre la portée éthique courante dans la littérature de sagesse.
- source_word: נָדִיב
  choice: noble
  rationale: Le mot peut évoquer la noblesse, la générosité ou une disposition volontaire. Ici, dans une scène où les désignations honorifiques cessent d’être faussées, « noble » convient au statut publiquement reconnu.
- source_word: כִילַי
  choice: l’avare
  rationale: Ce terme rare caractérise une personne mesquine, parcimonieuse ou moralement peu honorable. « L’avare » rend clairement la nuance liée à l’absence de générosité et soutient le contraste avec שׁוֹעַ.
- source_word: שׁוֹעַ
  choice: généreux
  rationale: Le mot peut désigner une personne opulente, notable ou noble. Dans le parallélisme avec « l’avare », « généreux » exprime naturellement le contraste moral, tandis que la note conserve les sens sociaux possibles.
- source_word: יִקָּרֵא
  choice: sera appelé
  rationale: Le niphal de קרא exprime ici la désignation passive d’une personne; « sera appelé » en est le rendu français direct et naturel.
- source_word: יֵאָמֵר
  choice: sera qualifié de
  rationale: Le niphal de אמר relève d’une parole portée sur quelqu’un. « Sera qualifié de » reste idiomatique, maintient le parallélisme et laisse percevoir une légère variation par rapport à קרא.
- source_word: עוֹד
  choice: ne… plus
  rationale: Avec la négation, עוֹד indique la cessation d’une situation existante; la tournure française « ne… plus » l’exprime directement.
theological_decisions:
- issue: Nature du contraste énoncé
  choice: Un rétablissement moral et social où les personnes mauvaises ne reçoivent plus de désignations honorables.
  alternative: Une annonce explicitement messianique ou une maxime générale sur la véracité du langage.
  rationale: Le verset traite directement de la manière dont les personnes sont nommées ou publiquement qualifiées. Le contexte plus large peut donner à ce changement une portée future, mais la traduction n’ajoute pas une interprétation messianique absente de cette phrase.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme hébreu est conservé, avec une légère variation entre « appelé » et « qualifié de ». Les notes signalent que les deux titres honorifiques peuvent exprimer soit une qualité morale, soit un rang social.
