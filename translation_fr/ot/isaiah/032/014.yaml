source:
  edition: WLC
  text: כִּֽי אַרְמ֣וֹן נֻטָּ֔שׁ הֲמ֥וֹן עִ֖יר עֻזָּ֑ב עֹ֣פֶל וָ/בַ֜חַן הָיָ֨ה בְעַ֤ד מְעָרוֹת֙ עַד עוֹלָ֔ם מְשׂ֥וֹשׂ פְּרָאִ֖ים מִרְעֵ֥ה עֲדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/014.yaml
  text: For the palace is abandoned[a], the crowded city is forsaken; Ophel and the watchtower have become caves forever, a joy for wild donkeys[c][b], a pasture for flocks.
translation:
  language: fr
  text: 'Car le palais est abandonné,

    la ville populeuse est délaissée ;

    l’Ophel[a] et la tour de guet sont devenus des cavernes pour toujours[b],

    la joie des ânes sauvages,

    un pâturage pour les troupeaux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’« Ophel » est le nom donné à la hauteur fortifiée d’un secteur de Jérusalem.
    reason: cultural_note
  - marker: b
    text: 'Ou : « sont devenus des repaires pour toujours ». L’hébreu décrit probablement des fortifications en ruine transformées en abris pour les animaux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְמוֹן
  choice: palais
  rationale: Le terme désigne un édifice royal ou fortifié important ; « palais » convient naturellement au contexte urbain.
- source_word: נֻטָּשׁ
  choice: est abandonné
  rationale: Le passif exprime l’état d’un lieu laissé désert.
- source_word: הֲמוֹן עִיר
  choice: la ville bruyante
  rationale: הָמוֹן peut évoquer à la fois la multitude et son tumulte. « Ville bruyante » conserve ici la dimension sonore sans exclure l’idée d’une population nombreuse.
- source_word: עֻזָּב
  choice: est délaissée
  rationale: Le passif est parallèle à נֻטָּשׁ ; la variation française maintient le parallélisme sans répétition pesante.
- source_word: עֹפֶל
  choice: l’Ophel
  rationale: Le mot est compris comme le nom topographique du secteur fortifié en hauteur de Jérusalem et est donc translittéré.
- source_word: בַּחַן
  choice: la tour de guet
  rationale: Dans ce contexte de fortifications urbaines, le terme désigne vraisemblablement une tour d’observation.
- source_word: הָיָה בְעַד מְעָרוֹת
  choice: sont devenus des cavernes
  rationale: Le sens précis de בְעַד dans cette construction est difficile, mais l’ensemble décrit probablement les fortifications ruinées devenues des cavités ou des repaires. L’accord pluriel est naturel en français avec le sujet composé.
- source_word: עַד עוֹלָם
  choice: pour toujours
  rationale: Rendu usuel de l’expression hébraïque de durée indéfinie ou durable, sans tenter d’en résoudre ici la portée prophétique.
- source_word: מְשׂוֹשׂ פְּרָאִים
  choice: la joie des ânes sauvages
  rationale: La formulation conserve l’image poétique du lieu devenu source de joie pour les ânes sauvages.
- source_word: מִרְעֵה עֲדָרִים
  choice: un pâturage pour les troupeaux
  rationale: Traduction directe et idiomatique de l’expression pastorale.
theological_decisions:
- issue: Portée temporelle de עַד עוֹלָם
  choice: pour toujours
  alternative: pour une longue durée
  rationale: La traduction garde la force conventionnelle de l’idiome prophétique sans décider si la durée doit être comprise comme strictement illimitée ; le contexte suivant peut apporter une tension littéraire.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le parallélisme poétique est disposé en lignes. « Ville bruyante » préserve la nuance de multitude ou de tumulte de הֲמוֹן, tandis que « cavernes » conserve le sens concret de מְעָרוֹת ; une autre lecture est signalée en note.
