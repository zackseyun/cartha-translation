    issue: Note alternative trompeuse
    rationale: « Ils se lamentent sur les seins » n’est pas une alternative interprétative naturelle ni claire. La difficulté est l’ellipse hébraïque et le rapport précis entre « seins/poitrine » et « se lamentant », non une lamentation dirigée vers des seins.
  - severity: low
    issue: « Champs de délices » est peu naturel
    rationale: L’expression est poétique mais inhabituelle en français moderne et déplace légèrement le sens adjectival de « champs agréables/désirables ».
  revised_text: Ils se frappent la poitrine[a] en signe de deuil pour les champs agréables, pour la vigne féconde.
