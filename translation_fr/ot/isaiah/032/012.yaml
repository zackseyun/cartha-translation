  text: עַל שָׁדַ֖יִם סֹֽפְדִ֑ים עַל שְׂדֵי חֶ֕מֶד עַל גֶּ֖פֶן פֹּרִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/012.yaml
  text: They beat their breasts in mourning over the delightful fields[b][a], over the fruitful vine.
translation:
  language: fr
  text: Ils se frappent la poitrine[a] en signe de deuil pour les champs agréables, pour la vigne féconde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est très condensé et dit littéralement : « sur les seins [ou : la poitrine], se lamentant ». On comprend généralement qu’il s’agit de se frapper la poitrine en signe de deuil. La relation exacte entre « seins » et « se lamentant » est incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁדַיִם
  choice: la poitrine
  rationale: Le nom désigne littéralement les « seins ». Dans ce contexte de lamentation, le français idiomatique emploie le singulier collectif « la poitrine » pour le geste de deuil probablement sous-entendu.
- source_word: סֹפְדִים
  choice: Ils se frappent la poitrine en signe de deuil
  rationale: Le participe signifie « se lamenter, mener deuil ». La tournure hébraïque est elliptique; cette formulation française explicite le geste de deuil vraisemblablement évoqué par la mention des seins, tout en signalant l’ambiguïté dans une note.
- source_word: שְׂדֵי חֶמֶד
  choice: les champs de délices
  rationale: חֶמֶד exprime ce qui est désirable, précieux ou source de plaisir. « Champs de délices » conserve cette valeur affective et le registre poétique sans réduire l’expression à la seule fertilité.
- source_word: גֶּפֶן פֹּרִיָּה
  choice: la vigne féconde
  rationale: Cette expression rend directement l’image d’une vigne qui porte du fruit, dans un français concis et soutenu.
- source_word: עַל
  choice: pour
  rationale: La préposition répétée introduit ici ce qui motive la lamentation. « Pour » est naturel en français avec « mener deuil » et permet de conserver le parallélisme des deux compléments.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La répétition de « pour » préserve le parallélisme hébreu, tandis que la note maintient l’ambiguïté de la formulation condensée.
