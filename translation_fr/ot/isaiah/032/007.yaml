source:
  edition: WLC
  text: וְ/כֵלַ֖י כֵּלָ֣י/ו רָעִ֑ים ה֚וּא זִמּ֣וֹת יָעָ֔ץ לְ/חַבֵּ֤ל ענוים בְּ/אִמְרֵי שֶׁ֔קֶר וּ/בְ/דַבֵּ֥ר אֶבְי֖וֹן מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/007.yaml
  text: And the rogue’s devices are evil[a]; he devises schemes to ruin the humble with lying words[c][b], even when the poor man speaks what is just.
translation:
  language: fr
  text: 'Quant au fourbe, ses moyens sont mauvais[a] : il conçoit des complots pour ruiner les humbles[b] par des paroles mensongères, même quand le pauvre dit ce qui est juste[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses outils », « ses instruments » ou « ses armes »; le terme hébreu peut désigner des objets concrets aussi bien que des moyens d’action.
    reason: lexical_alternative
  - marker: b
    text: Ou « les affligés » ou « les doux ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « et quand le pauvre parle justice [ou jugement] ». Le mot rendu par « ce qui est juste » peut aussi évoquer le droit ou une cause judiciaire; le sens peut être que le fourbe s’oppose au pauvre même lorsque celui-ci présente une cause juste.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: כֵלַי / כֵּלָיו
  choice: le fourbe / ses moyens
  rationale: Le premier terme désigne ici un homme sans scrupules, tandis que le second est le nom כְּלִי, « objet, outil, instrument ». Dans ce contexte de machinations, « ses moyens » rend naturellement son emploi métaphorique tout en maintenant le jeu de mots hébreu autant que le permet le français.
- source_word: רָעִים
  choice: mauvais
  rationale: L’adjectif qualifie moralement les moyens employés. « Mauvais » est idiomatique et conserve la condamnation éthique du texte.
- source_word: זִמּוֹת יָעָץ
  choice: il conçoit des complots
  rationale: L’association du nom désignant des projets souvent malveillants et du verbe « conseiller, projeter » exprime ici l’élaboration délibérée de plans nuisibles.
- source_word: לְחַבֵּל
  choice: pour ruiner
  rationale: Le verbe exprime l’intention de causer un grave tort. « Ruiner » convient au cadre social et judiciaire sans imposer l’idée d’une mise à mort.
- source_word: ענוים
  choice: les humbles
  rationale: Le terme peut désigner les humbles, les doux ou les affligés. « Les humbles » préserve la dimension sociale et morale sans le confondre avec אֶבְיוֹן, « le pauvre », dans la suite du verset.
- source_word: בְּאִמְרֵי שֶׁקֶר
  choice: par des paroles mensongères
  rationale: La préposition indique le moyen employé; cette formulation française restitue clairement le pluriel et l’idée de fausseté délibérée.
- source_word: אֶבְיוֹן
  choice: le pauvre
  rationale: Le nom est au masculin singulier et désigne une personne pauvre ou nécessiteuse. Le singulier représentatif est conservé dans une formulation française naturelle.
- source_word: וּבְדַבֵּר אֶבְיוֹן מִשְׁפָּט
  choice: même quand le pauvre défend une cause juste
  rationale: L’infinitif précédé de בְּ est compris comme circonstanciel ou temporel. מִשְׁפָּט conserve ici une portée à la fois juridique et éthique; « défend une cause juste » explicite naturellement cette idée sans masquer l’ambiguïté, signalée en note.
theological_decisions:
- issue: Valeur du masculin singulier אֶבְיוֹן
  choice: le pauvre
  alternative: la personne pauvre / les nécessiteux
  rationale: Le masculin singulier hébreu est probablement représentatif. Le conserver respecte la forme du texte sans limiter nécessairement son application aux hommes.
- issue: Interprétation de la proposition finale
  choice: même quand le pauvre défend une cause juste
  alternative: et lorsque le pauvre parle avec justice / expose son droit
  rationale: La syntaxe permet une lecture temporelle ou circonstancielle, et מִשְׁפָּט peut évoquer la justice, le droit ou une cause judiciaire. Le texte principal offre une lecture claire, tandis que la note maintient les autres possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le ton de dénonciation prophétique, distingue « les humbles » du singulier « le pauvre » et place les appels de note dans l’ordre [a], [b], [c].
