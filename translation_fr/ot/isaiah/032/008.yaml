  yaml_path: translation/ot/isaiah/032/008.yaml
  text: But a noble man plans noble things[b][a], and he stands on noble things.
translation:
  language: fr
  text: Mais l’homme noble conçoit de nobles desseins[a], et c’est sur de nobles desseins qu’il se tient ferme[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conçoit des desseins généreux ». Les mots hébreux נָדִיב et נְדִיבוֹת peuvent exprimer aussi bien la noblesse que la générosité.
    reason: lexical_alternative
  - marker: b
    text: Ou « il se tient debout sur de nobles desseins », « c’est grâce à de nobles desseins qu’il se tient ferme » ou « il est affermi dans de nobles desseins ». L’expression hébraïque avec עַל et יָקוּם est concise et admet plusieurs nuances proches.
    reason: alternative_reading
lexical_decisions:
- source_word: נָדִיב
  choice: l’homme noble
  rationale: Employé comme substantif masculin singulier, le terme désigne ici un homme de caractère noble, par contraste avec les figures moralement dégradées des versets précédents. « Noble » conserve aussi la proximité lexicale avec נְדִיבוֹת sans imposer le sens politique de « prince ».
- source_word: נְדִיבוֹת
  choice: de nobles projets
  rationale: Le nom pluriel peut évoquer ce qui est noble ou généreux, notamment des desseins et des actions. « Nobles projets » convient directement avec יָעָץ et permet de reprendre la même expression dans la seconde proposition, comme le fait l’hébreu.
- source_word: יָעָץ
  choice: forme
  rationale: Le verbe signifie conseiller, délibérer ou concevoir un plan. Dans ce contexte, « forme de nobles projets » exprime naturellement l’élaboration d’intentions.
- source_word: עַל
  choice: par
  rationale: Avec יָקוּם, la préposition peut indiquer le fondement ou le moyen par lequel l’homme demeure ferme. « Par » donne une phrase française naturelle tout en laissant en note les nuances possibles de l’expression concise.
- source_word: יָקוּם
  choice: il tient ferme
  rationale: קום signifie littéralement se lever ou se tenir debout et peut ici exprimer la fermeté ou la constance. « Tient ferme » conserve l’image de la station debout tout en faisant entendre la persévérance morale.
