  text: וְ/יָשַׁ֥ב עַמִּ֖/י בִּ/נְוֵ֣ה שָׁל֑וֹם וּֽ/בְ/מִשְׁכְּנוֹת֙ מִבְטַחִ֔ים וּ/בִ/מְנוּחֹ֖ת שַׁאֲנַנּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/018.yaml
  text: And my people will dwell in a peaceful habitation[a], in secure dwellings[b], and in quiet resting places.
translation:
  language: fr
  text: Mon peuple habitera dans une demeure de paix[a], dans des demeures sûres et dans des lieux de repos tranquilles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans une demeure paisible ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשַׁב
  choice: habitera
  rationale: ישׁב exprime ici une habitation durable. « Habitera » convient au contexte prophétique de stabilité et de sécurité; la coordination initiale n’a pas besoin d’être rendue mécaniquement en français.
- source_word: עַמִּי
  choice: mon peuple
  rationale: עם avec le suffixe de première personne du singulier désigne naturellement « mon peuple » et conserve la portée relationnelle de l’expression.
- source_word: בִּנְוֵה שָׁלוֹם
  choice: dans un domaine paisible
  rationale: נָוֶה peut désigner un lieu habité, une demeure ou un domaine pastoral. « Domaine » garde l’idée d’un lieu concret sans imposer un bâtiment unique, tandis que « paisible » rend naturellement שָׁלוֹם dans cette relation.
- source_word: וּבְמִשְׁכְּנוֹת מִבְטַחִים
  choice: dans des demeures sûres
  rationale: מִשְׁכָּנוֹת désigne des lieux d’habitation, sans connotation cultuelle nécessaire. מִבְטַחִים qualifie ici leur sécurité objective; « demeures sûres » est clair et idiomatique.
- source_word: וּבִמְנוּחֹת שַׁאֲנַנּוֹת
  choice: et dans des lieux de repos tranquilles
  rationale: מְנוּחוֹת désigne des lieux de repos, et שַׁאֲנַנּוֹת évoque le calme, l’aisance et l’absence de trouble. « Tranquilles » exprime cette sécurité sereine sans suggérer la complaisance.
theological_decisions:
- issue: Nature et horizon de la promesse
  choice: Présenter des conditions concrètes et collectives de paix, de sécurité et de repos pour le peuple de Dieu, sans préciser l’horizon de leur accomplissement.
  alternative: Interpréter explicitement la promesse soit comme la restauration historique de Juda, soit comme une paix messianique eschatologique.
  rationale: Le verset promet un habitat paisible et sûr, mais ne délimite pas à lui seul la période ni le mode d’accomplissement. La traduction conserve donc cette ouverture interprétative.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme en trois membres est conservé, avec une légère variation lexicale pour éviter une répétition pesante. « Domaine paisible » maintient l’ambivalence résidentielle et pastorale de נָוֶה; la note donne une formulation plus littérale.
