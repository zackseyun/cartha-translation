  text: וּ/בָרַ֖ד בְּ/רֶ֣דֶת הַ/יָּ֑עַר וּ/בַ/שִּׁפְלָ֖ה תִּשְׁפַּ֥ל הָ/עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/019.yaml
  text: And it will hail when the forest falls[a], and the city will be utterly laid low in the lowland.
translation:
  language: fr
  text: Et il grêlera quand la forêt tombera[a], et dans la plaine la ville sera abaissée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et la grêle tombera quand la forêt descendra. » L’hébreu permet une traduction plus formelle où « la grêle » est le sujet et où la forêt descend ou tombe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרַד
  choice: Et il grêlera
  rationale: Le terme, lié à la grêle, est compris ici comme une expression météorologique impersonnelle. « Il grêlera » est naturel en français tout en conservant la valeur future du contexte.
- source_word: בְּרֶדֶת
  choice: quand … tombera
  rationale: 'L’infinitif construit de ירד, précédé de ב, a ici une valeur temporelle : « quand … descendra/tombera ».'
- source_word: הַיָּעַר
  choice: la forêt
  rationale: יער désigne normalement une forêt ou une région boisée ; « forêt » est l’équivalent français le plus direct.
- source_word: וּבַשִּׁפְלָה
  choice: et, dans la région basse
  rationale: שפלה désigne un lieu ou une région de faible altitude. « Région basse » garde la portée topographique ainsi que l’écho lexical avec le verbe suivant, sans identifier nécessairement le terme à une région géographique précise.
- source_word: תִּשְׁפַּל
  choice: sera entièrement abaissée
  rationale: Le verbe שׁפל signifie devenir bas ou être abaissé. Appliqué à la ville, il évoque ici son abaissement catastrophique, non une humilité morale ; « entièrement » rend la force du tableau sans en préciser indûment le mécanisme.
- source_word: הָעִיר
  choice: la ville
  rationale: עיר est le terme courant pour « ville » ; l’article défini est conservé.
