  yaml_path: translation/ot/isaiah/032/013.yaml
  text: On the land of my people[a], thorn and brier will come up; indeed[b], over all the joyful houses in the exultant city.
translation:
  language: fr
  text: Sur la terre de mon peuple pousseront épines et ronces, et même sur toutes les maisons pleines de joie de la cité en liesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְמַת עַמִּי
  choice: la terre de mon peuple
  rationale: אַדְמָה désigne la terre ou le sol. « La terre de mon peuple » est naturel en français et conserve à la fois l’image concrète et l’appartenance exprimée par l’hébreu.
- source_word: קוֹץ שָׁמִיר
  choice: épines et ronces
  rationale: Le couple évoque une végétation épineuse envahissant une terre dévastée. « Épines et ronces » rend cette image avec des termes courants sans imposer une identification botanique trop précise.
- source_word: תַּעֲלֶה
  choice: pousseront
  rationale: Dans ce contexte végétal, עלה décrit ce qui monte ou surgit du sol. « Pousseront » est idiomatique et précis en français.
- source_word: כִּי
  choice: oui
  rationale: כִּי est compris ici comme une particule emphatique qui renforce et étend l’annonce, plutôt que comme l’introduction stricte d’une cause.
- source_word: בָּתֵּי מָשׂוֹשׂ
  choice: les maisons pleines de joie
  rationale: Cette formulation naturelle conserve le sens du syntagme construit « maisons de joie » et l’idée de demeures caractérisées par la réjouissance, sans préciser s’il s’agit de fêtes ou d’agrément.
- source_word: קִרְיָה עַלִּיזָה
  choice: la cité en liesse
  rationale: עַלִּיזָה caractérise la cité par l’allégresse. « Cité en liesse » garde le registre poétique et le contraste avec le jugement annoncé, sans ajouter explicitement l’idée d’insouciance.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, soutenu mais accessible. La syntaxe poétique suit le mouvement de l’hébreu : l’annonce concernant la terre est étendue aux maisons et à la cité. L’inversion « pousseront épines et ronces » maintient une cadence prophétique naturelle en français.'
