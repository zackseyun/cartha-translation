- from: Sur la terre de mon peuple pousseront épines et ronces ; oui, sur toutes les maisons pleines de joie de la cité en liesse.
  to: Sur la terre de mon peuple pousseront épines et ronces, et même sur toutes les maisons pleines de joie de la cité en liesse.
  rationale: La révision ne modifie pas le sens ; elle remplace « oui » par « et même » afin de rendre plus naturellement en français la portée emphatique de כִּי et de relier explicitement la seconde localisation à l’annonce des épines et des ronces. Aucun ajout de note n’est nécessaire.
