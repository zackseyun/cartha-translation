  text: יָמִים֙ עַל שָׁנָ֔ה תִּרְגַּ֖זְנָה בֹּֽטְח֑וֹת כִּ֚י כָּלָ֣ה בָצִ֔יר אֹ֖סֶף בְּלִ֥י יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/010.yaml
  text: In little more than a year you will tremble[a], you complacent women, because the grape harvest will fail[c][b]; the fruit harvest will not come.
translation:
  language: fr
  text: Dans un peu plus d’un an[a], vous tremblerez, femmes qui vous sentez en sécurité[b], car la vendange sera terminée et la récolte ne viendra pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des jours sur une année » ; probablement un peu plus d’une année.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « femmes pleines d’assurance » ou « femmes insouciantes ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la rentrée des récoltes ne viendra pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִים עַל שָׁנָה
  choice: Dans un peu plus d’un an
  rationale: L’expression, littéralement « des jours sur une année », désigne vraisemblablement une courte période ajoutée à une année entière. La formulation française est naturelle et conserve l’imminence de l’annonce.
- source_word: תִּרְגַּזְנָה
  choice: vous tremblerez
  rationale: Le verbe רגז exprime l’agitation, l’effroi ou le tremblement. « Tremblerez » convient à cet avertissement prophétique et respecte la deuxième personne féminine plurielle.
- source_word: בֹּטְחוֹת
  choice: femmes qui vous croyez en sécurité
  rationale: Le participe féminin pluriel de בטח désigne celles qui se sentent en sûreté ou pleines d’assurance. « Vous croyez en sécurité » fait ressortir, sans la suraccentuer, l’assurance que le contexte présente comme mal fondée.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison du tremblement annoncé. « Car » conserve clairement ce rapport causal dans un registre digne et courant.
- source_word: כָּלָה בָצִיר
  choice: la vendange sera perdue
  rationale: בָצִיר désigne précisément la vendange, et כָּלָה indique qu’elle est achevée ou qu’elle arrive à son terme. Dans ce contexte de privation annoncée, « sera perdue » communique naturellement l’échec de la vendange, tout en laissant la valeur plus littérale signalée en note.
- source_word: אֹסֶף
  choice: la récolte
  rationale: Le nom désigne le rassemblement ou la rentrée des produits agricoles. « La récolte » est immédiatement compréhensible en français moderne, tandis que la nuance de rentrée est conservée en note.
- source_word: בְּלִי יָבוֹא
  choice: ne viendra pas
  rationale: La tournure signifie littéralement « sans venir ». Cette traduction maintient l’image concrète de la récolte attendue qui n’arrive pas.
theological_decisions: []
translation_notes:
