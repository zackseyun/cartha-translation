    rationale: Cette expression interprète כָּלָה comme une perte ou un échec. Le verbe signifie d’abord être achevé, fini ou parvenir à son terme; la traduction doit éviter d’expliciter une perte que le terme lui-même ne formule pas.
  - severity: low
    issue: « femmes qui vous croyez en sécurité »
    rationale: La tournure est compréhensible, mais « vous sentez en sécurité » est plus naturelle et reflète mieux le participe de בטח, qui désigne celles qui se sentent en sûreté ou confiantes.
