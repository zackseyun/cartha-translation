  verdict: revise
  source_fidelity: La formulation « la vendange sera perdue » dépasse le sens lexical direct de כָּלָה, qui indique que la vendange est achevée, arrivée à son terme ou a cessé. Le contexte annonce certes une détresse agricole, mais le texte ne dit pas explicitement qu’elle est « perdue ». « Sera terminée » rend l’énoncé sans ajouter cette précision. Le reste respecte l’adresse féminine plurielle, la causalité et le parallélisme entre vendange et rentrée des produits.
  naturalness: « Femmes qui vous sentez en sécurité » est plus idiomatique en français moderne que « femmes qui vous croyez en sécurité », tout en conservant l’idée d’un sentiment de sécurité. La phrase demeure fluide et d’un registre prophétique sobre.
  terminology: « Vendange » correspond précisément à בָצִיר. « Récolte » est acceptable pour אֹסֶף, avec la note qui précise la notion de rentrée ou d’ingathering. La note sur בֹּטְחוֹת doit d’abord présenter les équivalents de sécurité/confiance; « insouciantes » relève davantage de la nuance contextuelle.
  issues:
