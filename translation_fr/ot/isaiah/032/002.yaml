  text: וְ/הָיָה אִ֥ישׁ כְּ/מַֽחֲבֵא ר֖וּחַ וְ/סֵ֣תֶר זָ֑רֶם כְּ/פַלְגֵי מַ֣יִם בְּ/צָי֔וֹן כְּ/צֵ֥ל סֶֽלַע כָּבֵ֖ד בְּ/אֶ֥רֶץ עֲיֵפָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/002.yaml
  text: And a man will be like a hiding place from the wind[a], and a shelter from the storm, like streams of water in a dry place[c][b], like the shade of a massive rock in a weary land.
translation:
  language: fr
  text: Et un homme[c] sera comme un abri contre le vent[a], comme un refuge contre l’orage[b], comme des cours d’eau dans un lieu aride, comme l’ombre d’un rocher massif dans une terre épuisée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un refuge contre le vent ».
    reason: lexical_alternative
  - marker: b
    text: Ou « contre l’averse torrentielle » ou « contre la tempête ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « un homme » peut désigner de manière représentative le dirigeant idéal du verset précédent, chacun des dirigeants justes, ou encore avoir une portée typologique qui les dépasse.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Et … sera
  rationale: Dans ce discours prophétique, le parfait qal précédé du waw exprime naturellement une situation à venir. « Et » maintient le lien avec le verset précédent.
- source_word: אִישׁ
  choice: un homme
  rationale: Le nom hébreu est masculin singulier. Cette traduction en conserve la forme tout en laissant ouverte sa portée individuelle ou représentative.
- source_word: מַחֲבֵא רוּחַ
  choice: un abri contre le vent
  rationale: מַחֲבֵא désigne une cachette ou un refuge. « Abri » restitue naturellement en français l’image concrète d’un lieu qui protège du vent.
- source_word: סֵתֶר זָרֶם
  choice: un refuge contre l’orage
  rationale: סֵתֶר évoque un lieu couvert et protecteur, tandis que זָרֶם peut désigner une pluie violente, une averse torrentielle ou une tempête. « Orage » conserve l’image menaçante sans la limiter à la seule pluie.
- source_word: פַלְגֵי מַיִם
  choice: des cours d’eau
  rationale: L’expression désigne des canaux ou des courants d’eau. « Cours d’eau » rend clairement l’image d’une eau abondante et vivifiante.
- source_word: בְּצָיוֹן
  choice: dans un lieu aride
  rationale: Le terme désigne la sécheresse ou une région desséchée. « Lieu aride » est idiomatique et respecte le parallélisme poétique.
- source_word: צֵל סֶלַע כָּבֵד
  choice: l’ombre d’un rocher massif
  rationale: צֵל désigne l’ombre protectrice, סֶלַע un rocher ou escarpement, et כָּבֵד, littéralement « lourd », suggère ici une masse imposante.
- source_word: בְּאֶרֶץ עֲיֵפָה
  choice: dans une terre épuisée
  rationale: עֲיֵפָה signifie « fatiguée, épuisée, défaillante ». Appliqué à la terre, le mot forme une personnification que la traduction conserve.
theological_decisions:
- issue: Référent de « un homme » dans le contexte
  choice: Conserver « un homme » sans préciser davantage son identité.
  alternative: « le roi », « chaque dirigeant » ou une désignation explicitement messianique.
  rationale: Le contexte immédiat mentionne un roi et des chefs, si bien que le singulier peut désigner un personnage particulier ou avoir une valeur représentative. Le texte français préserve cette ouverture et n’impose aucune identification doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure comparative répétée de l’hébreu est conservée, ainsi que la personnification finale de la terre.
