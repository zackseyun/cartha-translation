source:
  edition: WLC
  text: נָשִׁים֙ שַֽׁאֲנַנּ֔וֹת קֹ֖מְנָה שְׁמַ֣עְנָה קוֹלִ֑/י בָּנוֹת֙ בֹּֽטח֔וֹת הַאְזֵ֖נָּה אִמְרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/009.yaml
  text: You complacent women[a], rise up; hear my voice. You confident daughters[c][b], listen to my word.
translation:
  language: fr
  text: Femmes qui vivez dans l’insouciance[a], levez-vous, écoutez ma voix ! Filles pleines d’assurance[b], prêtez attention à ma parole !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui vivez tranquilles » ; l’hébreu peut évoquer une vie sans trouble aussi bien qu’une insouciance coupable.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « filles confiantes ». Ou « filles qui vous sentez en sécurité » ; l’hébreu souligne le sentiment d’être à l’abri.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁים
  choice: femmes
  rationale: Le nom pluriel désigne ici les femmes en général; le parallélisme avec « filles » ne favorise pas le sens plus restreint d’« épouses ».
- source_word: שַׁאֲנַנּוֹת
  choice: qui vivez dans l’insouciance
  rationale: Dans cette réprimande prophétique, l’adjectif évoque une existence tranquille accompagnée d’une assurance imprudente. Cette formulation française reste naturelle et conserve la nuance négative sans réduire le terme à la seule sécurité.
- source_word: קֹמְנָה
  choice: levez-vous
  rationale: L’impératif féminin pluriel de קום exprime un appel pressant à se mettre debout et à prêter attention.
- source_word: שְׁמַעְנָה
  choice: écoutez
  rationale: L’impératif féminin pluriel demande une écoute effective; « écoutez » est naturel en français avec « ma voix ».
- source_word: קוֹלִי
  choice: ma voix
  rationale: קוֹל désigne naturellement la voix dans cette adresse directe et maintient la forme concrète de l’hébreu.
- source_word: בָּנוֹת
  choice: filles
  rationale: Le terme signifie littéralement « filles » et sert ici d’interpellation parallèle à « femmes »; le conserver respecte l’image et la structure hébraïques.
- source_word: בֹּטְחוֹת
  choice: qui vous croyez en sécurité
  rationale: Le participe décrit des femmes qui se sentent à l’abri. La tournure marque le caractère subjectif, et bientôt démenti, de cette assurance sans suggérer une juste confiance en Dieu.
- source_word: הַאְזֵנָּה
  choice: prêtez attention
  rationale: Le hifil impératif de אזן appelle à tendre l’oreille avec attention. Cette traduction distingue utilement le verbe du précédent tout en restant idiomatique.
- source_word: אִמְרָתִי
  choice: ma parole
  rationale: Le nom désigne ici ce qui est prononcé. « Ma parole » est digne, clair et parallèle à « ma voix ».
theological_decisions:
- issue: Nature de l’assurance reprochée
  choice: « qui vous croyez en sécurité » présente cette sécurité comme une perception humaine
  alternative: « confiantes » ou « en sécurité »
  rationale: Le contexte prophétique met en cause une assurance qui sera démentie. La traduction évite toutefois d’ajouter explicitement sa cause ou d’en faire une doctrine particulière.
translation_notes:
  register: Français international moderne, direct et solennel. Les deux impératifs féminins pluriels et le parallélisme de l’adresse sont conservés. La variation « écoutez / prêtez attention » reflète les deux verbes hébreux sans archaïsme.
