id: ISA.32.3
reference: Isaiah 32:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/לֹ֥א תִשְׁעֶ֖ינָה עֵינֵ֣י רֹאִ֑ים וְ/אָזְנֵ֥י שֹׁמְעִ֖ים תִּקְשַֽׁבְנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/003.yaml
  text: Then the eyes of those who see will not be dim[a], and the ears of those who hear will listen attentively.
translation:
  language: fr
  text: Alors, les yeux de ceux qui voient ne s’obscurciront pas[a], et les oreilles de ceux qui entendent écouteront attentivement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne se détourneront pas » ou « ne seront pas voilés ». Le sens exact du verbe hébreu est incertain ; il évoque ici une vision qui n’est pas détournée ou entravée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא תִשְׁעֶינָה
  choice: ne s’obscurciront plus
  rationale: La négation avec le verbe תִשְׁעֶינָה décrit ici la fin d’une perception visuelle entravée. « Ne s’obscurciront plus » est naturel en français, convient au cadre prophétique et conserve l’image sensorielle sans la réduire à une guérison physique.
- source_word: עֵינֵי רֹאִים
  choice: les yeux de ceux qui voient
  rationale: Le participe substantivé רֹאִים est rendu sans lui donner le sens technique de « voyants » ou de prophètes; la construction parallèle de l’hébreu est préservée.
- source_word: וְאָזְנֵי שֹׁמְעִים
  choice: et les oreilles de ceux qui entendent
  rationale: Cette formulation reproduit le parallélisme entre les yeux et les oreilles ainsi qu’entre ceux qui voient et ceux qui entendent.
- source_word: תִּקְשַׁבְנָה
  choice: écouteront attentivement
  rationale: Le verbe קשׁב exprime une écoute soutenue et réceptive, plus précise que le simple fait d’entendre.
- source_word: וְ
  choice: Alors / et
  rationale: Le premier waw est rendu par « Alors » afin de marquer l’enchaînement avec la promesse précédente; le second relie naturellement les deux membres parallèles par « et ».
theological_decisions:
- issue: Nature de la perception restaurée
  choice: Conserver les images concrètes de la vue et de l’ouïe, qui peuvent évoquer un discernement moral et spirituel renouvelé.
  alternative: Expliciter soit une guérison physique stricte, soit une référence exclusive aux prophètes.
  rationale: Ésaïe 32.1-4 associe le règne juste à une compréhension renouvelée. La traduction garde ouverte la tension entre l’image sensorielle et sa portée figurée, sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique est maintenu, avec une syntaxe immédiatement compréhensible et sans vocabulaire confessionnel technique.
