  text: וְ/שָׁכַ֥ן בַּ/מִּדְבָּ֖ר מִשְׁפָּ֑ט וּ/צְדָקָ֖ה בַּ/כַּרְמֶ֥ל תֵּשֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/016.yaml
  text: Then justice will dwell in the wilderness[b][a], and righteousness will abide in the fruitful field.
translation:
  language: fr
  text: Alors le droit habitera dans le désert, et la justice demeurera dans la campagne fertile[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le Carmel ». Le mot hébreu peut désigner une terre fertile et cultivée ou le lieu appelé Carmel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַן
  choice: Alors … habitera
  rationale: Le parfait qal peut avoir ici une valeur prophétique future. « Alors » exprime naturellement la progression par rapport au contexte précédent.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: Le terme désigne une terre aride ou inculte et maintient le contraste avec la terre cultivée.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte de restauration, le mot évoque un ordre juste établi plutôt qu’un verdict particulier.
- source_word: וּצְדָקָה
  choice: la justice
  rationale: « Justice » exprime ici la rectitude et préserve en français une distinction naturelle avec « le droit » pour מִשְׁפָּט.
- source_word: בַּכַּרְמֶל
  choice: dans le verger fertile
  rationale: כַּרְמֶל désigne probablement ici une terre fertile et cultivée, en contraste avec le désert, plutôt que le nom propre Carmel.
- source_word: תֵּשֵׁב
  choice: demeurera
  rationale: Bien que le verbe signifie littéralement « s’asseoir », il exprime ici une présence établie et durable, en parallèle avec « habitera ».
theological_decisions:
- issue: Distinction entre מִשְׁפָּט et צְדָקָה
  choice: le droit … la justice
  alternative: la justice … la droiture
  rationale: 'Ce couple conserve deux notions liées mais non identiques : l’ordre conforme au droit et la rectitude. Il évite de rendre les deux termes par le même mot.'
translation_notes:
  register: Français moderne, digne et accessible. La personnification poétique est conservée par « le droit habitera » et « la justice demeurera ».
