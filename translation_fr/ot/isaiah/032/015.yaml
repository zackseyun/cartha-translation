reference: Isaiah 32:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עַד יֵ֨עָרֶ֥ה עָלֵ֛י/נוּ ר֖וּחַ מִ/מָּר֑וֹם וְ/הָיָ֤ה מִדְבָּר֙ לַ/כַּרְמֶ֔ל ו/כרמל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/015.yaml
  text: until a spirit from on high is poured out on us[a], and the wilderness becomes a fruitful field[b], and the fruitful field is regarded as a forest.
translation:
  language: fr
  text: jusqu’à ce qu’un esprit venu d’en haut soit répandu sur nous[a], et que le désert devienne une terre fertile[b], et que la terre fertile soit considérée comme une forêt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Esprit venu d’en haut » ; l’hébreu רוּחַ peut désigner un esprit et, dans ce contexte, peut renvoyer plus précisément à l’Esprit de Dieu.
    reason: alternative_reading
  - marker: b
    text: « Terre fertile » traduit l’hébreu karmel, qui désigne une terre fertile ou cultivée ; il ne s’agit probablement pas ici du nom de lieu Carmel.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: jusqu’à ce que
  rationale: Introduit la limite temporelle de la situation décrite auparavant et appelle naturellement le subjonctif en français.
- source_word: יֵעָרֶה עָלֵינוּ
  choice: soit répandu sur nous
  rationale: Le nifal de ערה exprime ici une effusion subie; la tournure passive conserve cette image et «sur nous» rend naturellement עַל.
- source_word: רוּחַ
  choice: un esprit
  rationale: רוּחַ peut désigner l’esprit, le souffle ou le vent. Le renouvellement venant d’en haut favorise «esprit», mais l’absence d’article invite à ne pas expliciter «le Saint-Esprit» dans le texte principal.
- source_word: מִמָּרוֹם
  choice: venu d’en haut
  rationale: מָרוֹם évoque un lieu élevé; cette formulation française naturelle préserve l’idée d’une origine céleste.
- source_word: מִדְבָּר
  choice: le désert
  rationale: Rend clairement l’espace inculte opposé à la terre cultivée, sans ajouter la nuance plus subjective de «désolation».
- source_word: כַּרְמֶל
  choice: une terre fertile
  rationale: Le nom commun désigne ici vraisemblablement une terre fertile ou cultivée, plutôt que le toponyme Carmel.
- source_word: יַעַר
  choice: une forêt
  rationale: Équivalent direct et courant de יַעַר dans l’image de transformation.
- source_word: יֵחָשֵׁב
  choice: soit considérée comme
  rationale: Le nifal de חשב signifie «être tenu, compté ou considéré comme»; cette formulation est claire en français moderne.
theological_decisions:
- issue: Faut-il identifier explicitement רוּחַ au Saint-Esprit?
  choice: un esprit venu d’en haut
  alternative: l’Esprit venu d’en haut
  rationale: Le contexte suggère fortement une action divine vivifiante, mais l’hébreu n’emploie ni article ni qualificatif signifiant «saint». Le texte principal conserve donc l’indétermination grammaticale, tandis que la note signale la lecture théologiquement plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La structure «jusqu’à ce que… soit…, que… devienne…, et que… soit…» maintient l’unité syntaxique et la progression poétique du verset. «Venu d’en haut» évite la tournure moins naturelle «depuis les hauteurs» tout en conservant l’origine élevée ou céleste.
