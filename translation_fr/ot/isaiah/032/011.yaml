  source_fidelity: 'Le texte rend fidèlement les impératifs féminins pluriels et leur progression : trembler, frémir, se dépouiller, se mettre à nu, puis se ceindre au niveau des reins. « Femmes insouciantes » et « femmes qui vous croyez en sécurité » transmettent de façon juste le reproche adressé à des femmes vivant dans une sécurité confiante. L’absence de matière explicitement nommée après « ceignez-vous » est respectée dans le corps du texte.'
