id: ISA.32.11
reference: Isaiah 32:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חִרְדוּ֙ שַֽׁאֲנַנּ֔וֹת רְגָ֖זָה בֹּֽטְח֑וֹת פְּשֹׁ֣טָֽה וְ/עֹ֔רָה וַ/חֲג֖וֹרָה עַל חֲלָצָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/011.yaml
  text: Tremble[a], you complacent women; shudder, you confident ones. Strip, make yourselves bare[c][b], and tie sackcloth around your waist.
translation:
  language: fr
  text: Tremblez, femmes insouciantes ! Frémissez, femmes qui vous croyez en sécurité ! Déshabillez-vous, mettez-vous à nu et ceignez-vous les reins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu ne précise pas ce dont elles doivent se ceindre. Dans ce contexte de deuil prophétique, on comprend souvent : « ceignez-vous d’un sac autour de la taille ».'
    reason: cultural_note
lexical_decisions:
- source_word: חִרְדוּ
  choice: Tremblez
  rationale: L’impératif pluriel de חרד exprime un tremblement provoqué par la peur ; « Tremblez » est direct et naturel.
- source_word: שַׁאֲנַנּוֹת
  choice: femmes insouciantes
  rationale: L’adjectif féminin pluriel désigne celles qui vivent dans une tranquillité imprudente. « Insouciantes » conserve l’adresse féminine et la portée de reproche.
- source_word: רְגָזָה
  choice: Frémissez
  rationale: Cet impératif féminin pluriel évoque l’agitation ou le tremblement. « Frémissez » maintient le parallélisme tout en le distinguant de « Tremblez ».
- source_word: בֹּטְחוֹת
  choice: femmes qui vous croyez en sécurité
  rationale: Le participe féminin pluriel décrit celles qui se sentent en sûreté. La tournure explicite la confiance subjective et sa nuance ironique dans l’oracle.
- source_word: פְּשֹׁטָה וְעֹרָה
  choice: Déshabillez-vous, mettez-vous à nu
  rationale: Les deux impératifs successifs commandent d’ôter ses vêtements puis d’être exposé ; la formulation française garde leur intensification sans les fusionner.
- source_word: וַחֲגֹרָה
  choice: ceignez-vous
  rationale: Le verbe חגר signifie attacher ou ceindre autour du corps. Le complément matériel n’étant pas exprimé dans ce verset, la traduction ne fournit pas « un sac » dans le texte.
- source_word: עַל חֲלָצָיִם
  choice: les reins
  rationale: L’expression signifie littéralement « sur/autour des reins ». « Se ceindre les reins » est une formulation française digne et compréhensible, qui conserve l’image corporelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, au ton prophétique vif et digne. Les impératifs féminins pluriels sont rendus explicitement. La traduction conserve les deux verbes de dévêtissement et évite d’ajouter « sac » au corps du texte, puisque ce mot est absent de l’hébreu.
