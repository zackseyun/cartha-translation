id: ISA.32.1
reference: Isaiah 32:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֥ן לְ/צֶ֖דֶק יִמְלָךְ מֶ֑לֶךְ וּ/לְ/שָׂרִ֖ים לְ/מִשְׁפָּ֥ט יָשֹֽׂרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/001.yaml
  text: Behold[a], a king will reign in righteousness[d][c][b], and princes will rule with justice.
translation:
  language: fr
  text: Voici[a] qu’un roi régnera avec justice[b], et des princes[c] gouverneront selon le droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Regardez » ; cette interjection attire fortement l’attention.
    reason: lexical_alternative
  - marker: b
    text: Ou « régnera justement » ; littéralement « régnera dans/avec la justice ».
    reason: lexical_alternative
  - marker: c
    text: « Princes » peut aussi se traduire par « chefs », « dirigeants » ou « hauts responsables ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Interjection qui attire solennellement l’attention. « Voici » conserve la force prophétique tout en restant naturel dans un registre biblique moderne.
- source_word: לְצֶדֶק
  choice: avec justice
  rationale: Le לְ indique ici vraisemblablement la manière ou la norme du règne. « Avec justice » garde la forme nominale et la portée morale et judiciaire de צֶדֶק.
- source_word: יִמְלָךְ מֶלֶךְ
  choice: un roi régnera
  rationale: מֶלֶךְ est sans article, d’où « un roi ». Le yiqtol est rendu par le futur. La formulation française conserve aussi la répétition lexicale du verbe et du nom hébreux.
- source_word: וּלְשָׂרִים
  choice: et des princes
  rationale: שָׂרִים désigne des chefs, dignitaires ou hauts responsables. « Princes » convient au cadre royal et maintient le parallélisme avec le roi.
- source_word: לְמִשְׁפָּט
  choice: selon le droit
  rationale: La tournure exprime la norme de leur gouvernement. « Selon le droit » rend la dimension judiciaire et éthique de מִשְׁפָּט sans la réduire à un verdict ponctuel.
- source_word: יָשֹׂרוּ
  choice: gouverneront
  rationale: Le verbe שׂרר signifie exercer l’autorité. « Gouverneront » est clair dans ce contexte politique et évite la répétition française de « régner ».
theological_decisions:
- issue: Faut-il identifier explicitement le roi comme le Messie ?
  choice: Conserver l’expression indéfinie « un roi » sans identification explicite.
  alternative: Employer « le roi » ou nommer explicitement le Messie.
  rationale: Même si le passage peut recevoir une lecture messianique dans son contexte plus large, l’hébreu dit simplement מֶלֶךְ sans article et n’identifie pas ici le personnage. La traduction préserve cette ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme royal du verset ainsi que les deux notions proches mais distinctes de צֶדֶק (« justice ») et מִשְׁפָּט (« droit »).
