  yaml_path: translation/ot/isaiah/032/020.yaml
  text: Blessed are you who sow beside all waters[a], who let the feet of the ox and the donkey range free.
translation:
  language: fr
  text: Heureux êtes-vous, vous qui semez près de toutes les eaux et qui laissez le bœuf et l’âne aller librement[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « qui envoyez le pied du bœuf et de l’âne »; cette expression évoque le fait de laisser les animaux circuler ou paître librement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיכֶם
  choice: Heureux êtes-vous
  rationale: La formule au pluriel exprime le bonheur enviable et conserve la force d’une béatitude, sans faire de Dieu le sujet explicite d’une bénédiction.
- source_word: זֹרְעֵי
  choice: vous qui semez
  rationale: La proposition relative rend naturellement en français le participe qui caractérise les destinataires par leur activité.
- source_word: עַל כָּל מָיִם
  choice: près de toutes les eaux
  rationale: Cette formulation garde le pluriel et l’idée de semer en tous lieux bien irrigués, tout en évitant le calque peu naturel « sur toutes les eaux ».
- source_word: מְשַׁלְּחֵי רֶגֶל
  choice: qui laissez … aller librement
  rationale: L’expression signifie littéralement « envoyer le pied » et décrit ici le fait de laisser les animaux circuler librement; la note conserve l’image hébraïque.
- source_word: הַשּׁוֹר
  choice: le bœuf
  rationale: « Bœuf » convient au contexte agricole et forme un couple naturel avec « l’âne ».
- source_word: וְהַחֲמוֹר
  choice: et l’âne
  rationale: Terme moderne, clair et fidèle pour désigner l’animal de travail.
