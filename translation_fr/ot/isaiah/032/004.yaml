  text: וּ/לְבַ֥ב נִמְהָרִ֖ים יָבִ֣ין לָ/דָ֑עַת וּ/לְשׁ֣וֹן עִלְּגִ֔ים תְּמַהֵ֖ר לְ/דַבֵּ֥ר צָחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/004.yaml
  text: The heart of the hasty will understand knowledge[b][a], and the tongue of stammerers will hasten to speak clearly.
translation:
  language: fr
  text: Le cœur des impulsifs accédera à la connaissance[a], et la langue de ceux qui bégayent s’empressera de parler clairement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comprendra ce qu’il faut savoir ». L’expression hébraïque associe l’action de comprendre à celle de connaître.
    reason: ambiguïté syntaxique et lexicale
  - marker: b
    text: Ou « distinctement » ou « avec clarté ».
    reason: alternative lexicale
lexical_decisions:
- source_word: לְבַב
  choice: le cœur
  rationale: Conserve le terme anthropologique hébreu, qui désigne ici la faculté intérieure de penser et de comprendre.
- source_word: נִמְהָרִים
  choice: des impulsifs
  rationale: Le mot désigne ceux qui agissent ou jugent avec précipitation; « impulsifs » est naturel en français moderne.
- source_word: יָבִין לָדַעַת
  choice: accédera à la connaissance
  rationale: Rend l’idée de parvenir à comprendre ou à savoir tout en évitant la tournure française peu naturelle « comprendra la connaissance ».
- source_word: לְשׁוֹן
  choice: la langue
  rationale: Traduction concrète qui maintient le parallélisme poétique avec « le cœur ».
- source_word: עִלְּגִים
  choice: ceux qui bégayent
  rationale: Exprime directement une parole entravée ou hésitante dans un français courant et respectueux.
- source_word: תְּמַהֵר לְדַבֵּר
  choice: s’empressera de parler
  rationale: Reproduit la notion de promptitude du piel de מהר et maintient son écho avec נִמְהָרִים.
- source_word: צָחוֹת
  choice: clairement
  rationale: Marque la clarté ou la netteté de la parole, en contraste avec le bégaiement.
