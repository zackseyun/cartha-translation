id: ISA.32.17
reference: Isaiah 32:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֛ה מַעֲשֵׂ֥ה הַ/צְּדָקָ֖ה שָׁל֑וֹם וַֽ/עֲבֹדַת֙ הַ/צְּדָקָ֔ה הַשְׁקֵ֥ט וָ/בֶ֖טַח עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/032/017.yaml
  text: And the work of righteousness will be peace, and the service of righteousness, quietness and security forever.
translation:
  language: fr
  text: L’œuvre de la justice sera la paix, et le travail de la justice[a], le calme et la sécurité pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : le service de la justice. Le terme hébreu peut désigner le travail, l’activité ou le service.'
    reason: Signaler l’étendue sémantique de עֲבֹדָה et préserver l’ambiguïté que ne peut rendre un seul terme français.
lexical_decisions:
- source_word: מַעֲשֵׂה (ma‘aseh)
  choice: œuvre
  rationale: Le nom désigne ce que la justice accomplit ou produit; « œuvre » conserve la formulation concise et le parallélisme du texte hébreu.
- source_word: הַצְּדָקָה (hatsedaqah)
  choice: la justice
  rationale: « Justice » est le terme français courant qui couvre ici la conduite droite et conforme à ce qui est juste, sans réduire le mot à une doctrine particulière.
- source_word: עֲבֹדַת (avodat)
  choice: travail
  rationale: Le mot peut désigner le travail, l’activité ou le service. « Travail » maintient son sens concret ainsi que son parallélisme avec « œuvre », tout en laissant ouverte la nuance exacte.
- source_word: הַשְׁקֵט (hashqet)
  choice: le calme
  rationale: Cette forme exprime l’état de tranquillité ou de repos qui résulte de la justice.
- source_word: בֶטַח (vetah)
  choice: la sécurité
  rationale: Le terme évoque le fait de vivre à l’abri et en confiance; « sécurité » convient naturellement au couple formé avec « calme ».
- source_word: עַד עוֹלָם (ad ‘olam)
  choice: pour toujours
  rationale: Rendu idiomatique de l’expression temporelle indiquant une durée indéfinie et permanente.
theological_decisions:
- issue: Relation entre la justice, la paix, le calme et la sécurité
  choice: Conserver les propositions nominales et le parallélisme sans préciser davantage le lien causal.
  alternative: Traduire explicitement « la justice produira la paix » et « son résultat sera… ».
  rationale: L’hébreu associe l’œuvre ou le travail de la justice à ces effets, mais sa construction lapidaire laisse une certaine tension entre activité, résultat et état. La traduction ne doit pas imposer une explication théologique plus étroite.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé; la syntaxe nominale reste concise tout en étant compréhensible pour un lectorat général.
