  text: בָּ/עֵ֣ת הַ/הִ֗יא דִּבֶּ֣ר יְהוָה֮ בְּ/יַ֣ד יְשַׁעְיָ֣הוּ בֶן אָמוֹץ֮ לֵ/אמֹר֒ לֵ֗ךְ וּ/פִתַּחְתָּ֤ הַ/שַּׂק֙ מֵ/עַ֣ל מָתְנֶ֔י/ךָ וְ/נַעַלְ/ךָ֥ תַחֲלֹ֖ץ מֵ/עַ֣ל רַגְלֶ֑י/ךָ וַ/יַּ֣עַשׂ כֵּ֔ן הָלֹ֖ךְ עָר֥וֹם וְ/יָחֵֽף־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/002.yaml
  text: At that time Yahweh spoke by the hand of Isaiah son of Amoz[a], saying, “Go, loosen the sackcloth from your waist, and remove your sandals from your feet.” And he did so, walking naked and barefoot.
translation:
  language: fr
  text: 'À cette époque, Yahweh parla par l’intermédiaire d’Ésaïe, fils d’Amots : « Va, détache de ta taille le vêtement de toile de sac et enlève tes sandales. » Il fit ainsi, allant nu[a] et pieds nus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dévêtu » ou « peu vêtu » ; dans certains contextes, le mot hébreu peut désigner une personne insuffisamment vêtue plutôt que totalement nue.
    reason: Alternative lexicale préservant l’étendue sémantique de עָרוֹם et l’ambiguïté du geste prophétique.
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: À cette époque
  rationale: Expression temporelle naturelle qui reprend le cadre narratif plus large indiqué par l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: דִּבֶּר ... בְּיַד
  choice: parla par l’intermédiaire de
  rationale: Littéralement « parla par la main de » ; l’expression française choisie restitue clairement l’idée de médiation prophétique sans calque obscur.
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: Ésaïe, fils d’Amots
  rationale: Formes françaises conventionnelles des noms bibliques et restitution directe de la filiation.
- source_word: לֵאמֹר
  choice: deux-points introduisant le discours direct
  rationale: En français, la ponctuation introduit naturellement la citation sans qu’il soit nécessaire d’ajouter « en disant ».
- source_word: לֵךְ
  choice: Va
  rationale: Équivalent direct et naturel de l’impératif.
- source_word: וּפִתַּחְתָּ הַשַּׂק מֵעַל מָתְנֶיךָ
  choice: détache le vêtement de toile de sac que tu portes autour de la taille
  rationale: פתח désigne ici l’action de défaire ou détacher ; « vêtement de toile de sac » précise que שׂק est porté, tandis que « autour de la taille » rend naturellement la localisation.
- source_word: וְנַעַלְךָ תַחֲלֹץ מֵעַל רַגְלֶיךָ
  choice: enlève tes sandales
  rationale: Formulation française idiomatique ; la mention « de tes pieds » serait redondante, et le singulier hébreu peut avoir une valeur collective.
- source_word: וַיַּעַשׂ כֵּן
  choice: Ésaïe le fit
  rationale: Le nom explicite le sujet en français et évite une éventuelle ambiguïté après la parole divine, sans ajouter de contenu interprétatif.
- source_word: הָלֹךְ עָרוֹם וְיָחֵף
  choice: marcha nu et pieds nus
  rationale: Rend directement l’état dans lequel Ésaïe accomplit le signe ; « pieds nus » est l’équivalent français naturel de יָחֵף.
theological_decisions:
- issue: Degré de dénudement exprimé par עָרוֹם
  choice: nu dans le texte principal, avec une note signalant l’ambiguïté
  alternative: dévêtu ; peu vêtu ; seulement vêtu d’un sous-vêtement
  rationale: Le sens ordinaire est « nu », qu’il ne faut pas atténuer dans le texte principal. Cependant, selon le contexte, le terme peut désigner une personne dépouillée de son vêtement extérieur ou insuffisamment vêtue ; la note préserve cette possibilité sans trancher.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe hébraïque est rendue de façon naturelle, notamment par l’omission de « en disant » et par « par l’intermédiaire de » plutôt que le calque « par la main de ». Le nom Yahweh est conservé. Le marqueur [a] figure immédiatement après « nu ».
