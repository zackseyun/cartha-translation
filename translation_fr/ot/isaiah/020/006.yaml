  text: וְ֠/אָמַר יֹשֵׁ֨ב הָ/אִ֣י הַ/זֶּה֮ בַּ/יּ֣וֹם הַ/הוּא֒ הִנֵּה כֹ֣ה מַבָּטֵ֗/נוּ אֲשֶׁר נַ֤סְנוּ שָׁם֙ לְ/עֶזְרָ֔ה לְ/הִ֨נָּצֵ֔ל מִ/פְּנֵ֖י מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֵ֖יךְ נִמָּלֵ֥ט אֲנָֽחְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/006.yaml
  text: And the inhabitant of this coastland will say in that day[a], ‘Look, this is our hope, where we fled for help to be delivered from the king of Assyria[b]. And how shall we escape?’
translation:
  language: fr
  text: 'En ce jour-là, les habitants de cette région côtière[a] diront : « Voilà donc ce vers quoi nous nous tournions[b], là où nous avons fui pour chercher de l’aide et être délivrés du roi d’Assyrie ! Et nous, comment échapperons-nous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner une « île ». Chez Ésaïe, il s’applique souvent plus largement aux terres maritimes ou aux régions côtières.
    reason: lexical_alternative
  - marker: b
    text: 'Autres traductions possibles : « voilà notre espoir » ou « voilà ce sur quoi nous comptions ». Le mot hébreu désigne ce vers quoi l’on porte son regard et, par extension, ce en quoi l’on place son attente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב הָאִי הַזֶּה
  choice: les habitants de cette région côtière
  rationale: Le participe singulier יֹשֵׁב a ici une valeur collective. Le pluriel français exprime naturellement l’ensemble de la population. אִי peut désigner une île, mais aussi un littoral ou une terre maritime ; dans ce contexte, « région côtière » évite de préciser à tort qu’il s’agit nécessairement d’une île.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, rendue dans un français naturel et digne.
- source_word: הִנֵּה
  choice: Voilà donc
  rationale: Marque l’attention et, dans ce contexte, la constatation désabusée. « Voilà donc » restitue cette force sans archaïsme.
- source_word: כֹּה מַבָּטֵנוּ
  choice: celui vers qui nous tournions nos regards
  rationale: מַבָּט désigne littéralement ce que l’on regarde et, par extension, l’objet de l’attente ou de la confiance. Cette formulation conserve l’image du regard tout en laissant percevoir l’idée d’espoir placé en quelqu’un.
- source_word: אֲשֶׁר נַסְנוּ שָׁם
  choice: celui auprès de qui nous avons cherché refuge
  rationale: נוּס exprime la fuite, tandis que שָׁם indique le lieu vers lequel on fuit. « Chercher refuge auprès de » rend naturellement en français le mouvement motivé par le danger.
- source_word: לְעֶזְרָה
  choice: pour obtenir de l’aide
  rationale: Rend directement la finalité exprimée par לְ et le nom עֶזְרָה.
- source_word: לְהִנָּצֵל
  choice: être délivrés
  rationale: Le niphal de נצל exprime ici le fait d’être arraché ou soustrait au danger ; le passif est conservé.
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: du roi d’Assyrie
  rationale: מִפְּנֵי indique ici l’éloignement devant la menace ou la puissance du roi d’Assyrie.
- source_word: וְאֵיךְ נִמָּלֵט אֲנָחְנוּ
  choice: Et nous, comment échapperons-nous ?
  rationale: La mise en relief de « nous » rend le pronom explicite אֲנָחְנוּ. Le futur et la question rhétorique expriment l’absence apparente d’issue.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le pluriel collectif est privilégié pour la fluidité. La formulation conserve l’image hébraïque du regard et l’amertume de la constatation, sans développer explicitement un sens absent de la forme originale.
