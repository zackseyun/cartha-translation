revisions:
- from: 'En ce jour-là, les habitants de cette région côtière[a] diront : « Voilà donc celui vers qui nous tournions nos regards[b], celui auprès de qui nous avons cherché refuge pour obtenir de l’aide et être délivrés du roi d’Assyrie ! Et nous, comment échapperons-nous ? »'
  to: 'En ce jour-là, les habitants de cette région côtière[a] diront : « Voilà donc ce vers quoi nous nous tournions[b], là où nous avons fui pour chercher de l’aide et être délivrés du roi d’Assyrie ! Et nous, comment échapperons-nous ? »'
  rationale: La révision restitue l’ambiguïté du référent hébreu par « ce vers quoi », conserve la dimension spatiale de la fuite par « là où », et traduit plus directement le verbe « fuir ». Les ancres et le contenu des notes restent appropriés.
