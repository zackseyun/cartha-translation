  text: וַ/יֹּ֣אמֶר יְהוָ֔ה כַּ/אֲשֶׁ֥ר הָלַ֛ךְ עַבְדִּ֥/י יְשַׁעְיָ֖הוּ עָר֣וֹם וְ/יָחֵ֑ף שָׁלֹ֤שׁ שָׁנִים֙ א֣וֹת וּ/מוֹפֵ֔ת עַל מִצְרַ֖יִם וְ/עַל כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/003.yaml
  text: Then Yahweh said[b][a], “Just as my servant Isaiah has walked naked and barefoot for three years as a sign and a portent against Egypt and Cush,”
translation:
  language: fr
  text: 'Alors Yahweh dit : « De même que mon serviteur Ésaïe a marché nu[a] et pieds nus pendant trois ans, en signe et en présage contre l’Égypte et Koush[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être « dépouillé de ses vêtements extérieurs » : il pouvait ne porter qu’un pagne ou un sous-vêtement, sans être entièrement nu.'
    reason: lexical_alternative
  - marker: b
    text: Koush désigne la région située au sud de l’Égypte, souvent associée à la Nubie; certaines traductions emploient « Éthiopie ».
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel et préserve sa valeur propre dans le texte hébreu.
- source_word: כַּאֲשֶׁר
  choice: De même que
  rationale: Rend clairement la comparaison qui introduit et fonde l’acte symbolique.
- source_word: הָלַךְ
  choice: a marché
  rationale: Conserve le sens concret du verbe hébreu tout en restant naturel avec l’indication de durée.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Convient au statut d’Ésaïe comme prophète au service de Dieu, sans accentuer indûment l’idée d’esclavage.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
- source_word: עָרוֹם
  choice: nu
  rationale: Reproduit le sens lexical direct, tout en signalant en note la possibilité qu’Ésaïe ait seulement été dépouillé de ses vêtements extérieurs.
- source_word: וְיָחֵף
  choice: et pieds nus
  rationale: Expression française naturelle qui restitue directement l’état décrit.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: pendant trois ans
  rationale: Exprime clairement et naturellement la durée de l’acte symbolique.
- source_word: אוֹת וּמוֹפֵת
  choice: en signe et en présage
  rationale: 'Maintient les deux termes distincts : l’acte signifie quelque chose et annonce le jugement à venir.'
- source_word: עַל
  choice: contre
  rationale: Dans ce contexte de jugement, la préposition a une valeur défavorable visant l’Égypte et Koush.
- source_word: מִצְרַיִם
  choice: l’Égypte
  rationale: Nom français usuel du pays.
- source_word: כּוּשׁ
  choice: Koush
  rationale: Transcription française du nom ancien, préférable à une identification moderne trop précise; une note en donne le cadre géographique.
theological_decisions:
- issue: Degré de nudité d’Ésaïe dans l’acte symbolique
  choice: « nu » dans le texte principal, avec une note préservant la possibilité d’un dénuement partiel
  alternative: « dépouillé de ses vêtements extérieurs » ou « en sous-vêtement »
  rationale: Le sens ordinaire de l’hébreu עָרוֹם est « nu ». Toutefois, selon les usages vestimentaires anciens et le contexte, le mot peut décrire une personne privée de son vêtement extérieur sans impliquer nécessairement une nudité totale. La traduction conserve donc la formulation forte du texte sans supprimer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure comparative et le caractère inachevé du verset, dont la phrase se poursuit au verset suivant. Les marqueurs de notes sont placés immédiatement après les termes concernés.
