    issue: « leur fierté » pour תִּפְאַרְתָּם
    rationale: 'Le mot français désigne normalement une disposition ou un sentiment des sujets. Dans ce parallélisme, l’Égypte est ce en quoi ils se glorifient : « leur gloire » conserve mieux la valeur du nom hébreu et l’ambiguïté entre gloire, objet de gloire et vantardise.'
