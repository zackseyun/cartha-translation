  yaml_path: translation/ot/isaiah/020/005.yaml
  text: And they will be dismayed and ashamed because of Cush[a], their hope, and because of Egypt[c][b], their boast.
translation:
  language: fr
  text: Ils seront consternés et couverts de honte à cause de Koush[a], leur espoir, et à cause de l’Égypte, leur gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Koush est l’ancienne région située au sud de l’Égypte, souvent associée à la Nubie ; certaines traductions anciennes l’appellent « Éthiopie ».
    reason: cultural_note
  - marker: b
    text: Ou « leur fierté » ; ou « ce dont ils se glorifient ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחַתּוּ
  choice: Ils seront consternés
  rationale: Le verbe חתת exprime ici, dans la séquence prophétique, l’effondrement ou la consternation à venir. « Seront consternés » rend naturellement cette réaction sans imposer l’image plus concrète de personnes « brisées ».
- source_word: וָבֹשׁוּ
  choice: et couverts de honte
  rationale: בושׁ évoque la honte et l’humiliation résultant d’un espoir déçu. Cette formulation française s’accorde naturellement avec « consternés ».
- source_word: מִכּוּשׁ
  choice: à cause de Koush
  rationale: 'Dans ce parallélisme, מן a une valeur causale : leur consternation et leur honte viennent de ce qui arrive à Koush. Le nom historique « Koush » évite l’identification moderne trompeuse avec la seule Éthiopie.'
- source_word: מַבָּטָם
  choice: leur espoir
  rationale: מַבָּט désigne littéralement ce vers quoi l’on regarde et, ici, l’objet de l’attente ou de la confiance. « Leur espoir » est concis et idiomatique.
- source_word: וּמִן מִצְרַיִם
  choice: et à cause de l’Égypte
  rationale: Comme dans le premier membre, מן est compris causalement, conformément au parallélisme.
- source_word: תִּפְאַרְתָּם
  choice: leur fierté
  rationale: תִּפְאֶרֶת peut désigner la gloire, l’ornement ou ce dont on se glorifie. « Leur fierté » exprime ici naturellement l’Égypte comme objet d’orgueil, tout en signalant en note l’alternative « gloire ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La structure parallèle de l’hébreu est conservée par la répétition de « à cause de ». « Koush » est translittéré et expliqué en note.
