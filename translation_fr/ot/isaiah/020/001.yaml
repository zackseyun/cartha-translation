  variant: modern international French
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת בֹּ֤א תַרְתָּן֙ אַשְׁדּ֔וֹדָ/ה בִּ/שְׁלֹ֣ח אֹת֔/וֹ סַֽרְג֖וֹן מֶ֣לֶךְ אַשּׁ֑וּר וַ/יִּלָּ֥חֶם בְּ/אַשְׁדּ֖וֹד וַֽ/יִּלְכְּדָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/001.yaml
  text: In the year that the Tartan came to Ashdod[a], when Sargon king of Assyria sent him, and he fought against Ashdod and captured it,
translation:
  language: fr
  text: L’année où le tartân se rendit à Ashdod[a], envoyé par Sargon, roi d’Assyrie, il combattit contre Ashdod et s’en empara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Tartân » est probablement un titre officiel assyrien, peut-être l’équivalent de « commandant en chef », plutôt qu’un nom de personne.
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת
  choice: L’année où
  rationale: La préposition ב avec שְׁנַת introduit le cadre temporel; cette tournure est naturelle en français moderne.
- source_word: תַרְתָּן
  choice: le tartân
  rationale: Le terme est vraisemblablement un titre officiel assyrien plutôt qu’un nom propre; la translittération conserve ce titre sans en imposer un équivalent incertain.
- source_word: אַשְׁדּוֹדָה
  choice: se rendit à Ashdod
  rationale: Le hé directionnel marque un mouvement vers Ashdod; « se rendit à » exprime clairement ce déplacement.
- source_word: בִּשְׁלֹח אֹתוֹ
  choice: envoyé par Sargon, roi d’Assyrie
  rationale: L’infinitif construit avec ב indique une circonstance concomitante. La formulation française rattache sans ambiguïté l’envoi du tartân à Sargon.
- source_word: סַרְגוֹן מֶלֶךְ אַשּׁוּר
  choice: Sargon, roi d’Assyrie
  rationale: Translittération française usuelle du nom royal et restitution naturelle de la chaîne construite en apposition.
- source_word: וַיִּלָּחֶם בְּאַשְׁדּוֹד
  choice: il combattit contre Ashdod
  rationale: לחם avec ב signifie couramment combattre contre; la traduction préserve le sens militaire sans le préciser davantage.
- source_word: וַיִּלְכְּדָהּ
  choice: et s’en empara
  rationale: Dans un contexte militaire, לכד désigne la prise d’une ville; le pronom « en » renvoie naturellement à Ashdod.
