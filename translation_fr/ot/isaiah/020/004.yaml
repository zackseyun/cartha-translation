  source_fidelity: 'Le sens est globalement fidèle au texte massorétique : le roi d’Assyrie conduit les captifs d’Égypte et les exilés de Koush, de tout âge, nus, pieds nus et les fesses exposées. « Emmènera » est acceptable, mais « conduira » rend plus directement יִנְהַג. La construction française doit aussi faire porter clairement « les fesses découvertes » sur les personnes déportées.'
  naturalness: La phrase actuelle est presque naturelle, mais l’apposition « les fesses découvertes » après « nus et pieds nus » est elliptique et peut momentanément sembler détachée. « les fesses découvertes » peut également être formulé plus idiomatiquement par « les fesses à découvert ».
  terminology: '« Koush », « captifs », « déportés », « nus et pieds nus » et « la nudité de l’Égypte » conviennent. Le registre reste direct et digne. Les notes doivent être rattachées aux expressions qu’elles expliquent : la note sur l’exposition des fesses au premier syntagme, et celle sur « la nudité de l’Égypte » à cette expression.'
  issues:
