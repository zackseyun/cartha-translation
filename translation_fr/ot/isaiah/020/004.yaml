base_translation:
  language: en
  yaml_path: translation/ot/isaiah/020/004.yaml
  text: so the king of Assyria will lead away the captives of Egypt and the exiles of Cush[a], young and old, naked and barefoot[b], with buttocks uncovered—the nakedness of Egypt.
translation:
  language: fr
  text: ainsi, le roi d’Assyrie conduira les captifs d’Égypte et les déportés de Koush, jeunes et vieux, nus et pieds nus, avec les fesses à découvert[a] — la nudité de l’Égypte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les fesses dénudées ». L’expression hébraïque est volontairement crue et dépeint l’humiliation publique des déportés d’Égypte et de Koush.
    reason: lexical_alternative
  - marker: b
    text: Ou « la honte de l’Égypte ». L’hébreu dit littéralement « la nudité de l’Égypte », image d’une exposition publique humiliante.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ainsi
  rationale: Relie directement le geste symbolique d’Ésaïe à son accomplissement annoncé, dans un français naturel et digne.
- source_word: יִנְהַג
  choice: emmènera
  rationale: Dans ce contexte de déportation forcée, le verbe exprime le fait de conduire des personnes au loin; « emmènera » reste fluide sans effacer la contrainte indiquée par le contexte.
- source_word: שְׁבִי
  choice: les captifs
  rationale: Le nom désigne ici les personnes capturées plutôt que l’état abstrait de captivité, en parallèle avec « les déportés ».
- source_word: גָּלוּת
  choice: les déportés
  rationale: Le terme renvoie ici à la population emmenée en exil. « Déportés » rend clairement le déplacement forcé et convient au parallèle avec « captifs ».
- source_word: כּוּשׁ
  choice: Koush
  rationale: La translittération évite d’assimiler sans nuance cette région ancienne à un État moderne appelé Éthiopie.
- source_word: נְעָרִים וּזְקֵנִים
  choice: jeunes et vieux
  rationale: Cette paire exprime l’ensemble des âges. La formulation est concise, idiomatique et ne précise pas davantage le genre que ne l’exige le contexte.
- source_word: עָרוֹם וְיָחֵף
  choice: nus et pieds nus
  rationale: Rend littéralement les deux conditions décrites et maintient le lien avec le geste symbolique du contexte, malgré la répétition française intentionnelle de « nus ».
- source_word: חֲשׂוּפַי שֵׁת
  choice: les fesses découvertes
  rationale: La formulation conserve le caractère volontairement cru de l’hébreu ainsi que l’image d’exposition humiliante.
- source_word: עֶרְוַת מִצְרָיִם
  choice: la nudité de l’Égypte
  rationale: La traduction littérale maintient le lien lexical avec la nudité déjà mentionnée et laisse au contexte sa connotation de honte publique.
