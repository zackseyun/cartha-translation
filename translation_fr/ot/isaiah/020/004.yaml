  rationale: La révision rend plus explicitement la fonction qualificative de « fesses exposées » et emploie « conduira », plus près de יִנְהַג. Elle maintient les distinctions du texte hébreu, l’imagerie corporelle directe, le toponyme historique Koush et les deux notes lexicales correctement ancrées.
