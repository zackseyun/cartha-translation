- from: Car la ville fortifiée est solitaire, demeure délaissée et abandonnée comme le désert. Là, un veau vient paître ; là, il se couche et dépouille ses branches.[a]
  to: Car la ville fortifiée est solitaire, demeure délaissée et abandonnée comme le désert. Là, un veau paît ; là, il se couche et en dépouille les branches.[a]
  rationale: La révision retire l’ajout non requis « vient » et remplace le possessif français ambigu par « en », qui rend plus clairement la relation des branches au lieu féminin du texte hébreu. La note conserve l’alternative de traduction et explique la référence grammaticale sans imposer une identification plus précise du référent.
