  text: כִּ֣י עִ֤יר בְּצוּרָה֙ בָּדָ֔ד נָוֶ֕ה מְשֻׁלָּ֥ח וְ/נֶעֱזָ֖ב כַּ/מִּדְבָּ֑ר שָׁ֣ם יִרְעֶ֥ה עֵ֛גֶל וְ/שָׁ֥ם יִרְבָּ֖ץ וְ/כִלָּ֥ה סְעִפֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/010.yaml
  text: For the fortified city is solitary[a], a habitation deserted and abandoned like the wilderness; there a calf grazes[b], and there it lies down and strips its branches bare.
translation:
  language: fr
  text: Car la ville fortifiée est solitaire, demeure délaissée et abandonnée comme le désert. Là, un veau paît ; là, il se couche et en dépouille les branches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en consume les branches ». Le verbe hébreu évoque une consommation complète. Le pronom « en » renvoie au lieu abandonné, que le texte hébreu présente au féminin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication ou le fondement de ce qui précède, sans imposer une valeur emphatique.
- source_word: עִיר בְּצוּרָה
  choice: la ville fortifiée
  rationale: Rend naturellement l’idée d’une ville protégée par des fortifications ; le défini convient à la référence contextuelle probable, bien que l’hébreu n’ait pas d’article explicite.
- source_word: בָּדָד
  choice: solitaire
  rationale: Exprime l’isolement désolé de la ville dans un registre poétique, actuel et digne.
- source_word: נָוֶה
  choice: demeure
  rationale: Le terme peut désigner un lieu habité ou un pâturage. « Demeure » convient à l’apposition à la ville tout en laissant percevoir le contraste avec son abandon.
- source_word: מְשֻׁלָּח וְנֶעֱזָב
  choice: délaissée et abandonnée
  rationale: Préserve le redoublement hébreu et décrit clairement l’état de désolation du lieu.
- source_word: כַּמִּדְבָּר
  choice: comme le désert
  rationale: « Désert » désigne ici un espace inculte et inhabité, sans nécessairement limiter l’image à un désert de sable.
- source_word: שָׁם יִרְעֶה עֵגֶל
  choice: Là, un veau vient paître
  rationale: Conserve le singulier et rend רעה par l’expression pastorale française naturelle « paître » ; « vient » explicite légèrement l’accès libre au lieu sans modifier l’image.
- source_word: וְשָׁם יִרְבָּץ
  choice: là, il se couche
  rationale: Rend le repos d’un animal et rattache clairement le pronom au veau.
- source_word: וְכִלָּה סְעִפֶיהָ
  choice: et dépouille ses branches
  rationale: כלה indique l’épuisement complet ; « dépouille » exprime naturellement que le veau consomme entièrement le feuillage ou les rameaux. Le féminin du suffixe renvoie au lieu ou à la ville personnifiée, mais la formulation française peut sembler associer les branches à la demeure ; une note conserve cette difficulté.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique mais accessible. La structure en deux phrases conserve la progression de la ville désertée vers le veau qui y paît librement. Le terme polysémique נָוֶה est rendu par « demeure » plutôt que par « pâturage », afin de préserver son lien avec la ville sans effacer sa nuance pastorale.
