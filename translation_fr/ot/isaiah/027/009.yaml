source:
  edition: WLC
  text: לָ/כֵ֗ן בְּ/זֹאת֙ יְכֻפַּ֣ר עֲוֺֽן יַעֲקֹ֔ב וְ/זֶ֕ה כָּל פְּרִ֖י הָסִ֣ר חַטָּאת֑/וֹ בְּ/שׂוּמ֣/וֹ כָּל אַבְנֵ֣י מִזְבֵּ֗חַ כְּ/אַבְנֵי גִר֙ מְנֻפָּצ֔וֹת לֹֽא יָקֻ֥מוּ אֲשֵׁרִ֖ים וְ/חַמָּנִֽים־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/009.yaml
  text: 'Therefore by this the guilt of Jacob will be atoned for, and this will be the full fruit of the removal of his sin: when he makes all the stones of the altar like crushed chalkstones, the Asherah poles and incense altars will not stand.'
translation:
  language: fr
  text: 'Ainsi, c’est par cela que la faute de Jacob sera expiée, et ce sera le fruit entier de la suppression de son péché : en faisant de toutes les pierres de l’autel des pierres calcaires pulvérisées ; les poteaux d’Ashéra[a] et les stèles solaires[b] ne se dresseront plus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ashéra était une divinité cananéenne ; le terme peut aussi désigner les objets cultuels en bois qui lui étaient associés.
    reason: Le nom et la nature exacte des אֲשֵׁרִים peuvent être inconnus du lecteur moderne.
  - marker: b
    text: 'Ou : « stèles consacrées au soleil ». Il s’agit probablement d’objets cultuels liés au culte solaire.'
    reason: Le sens précis de חַמָּנִים est rare et comporte une certaine incertitude.
lexical_decisions:
- source_word: עָוֺן
  choice: faute
  rationale: Le terme peut désigner la faute, l’iniquité ou la culpabilité qui en découle. « Faute » conserve ici cette amplitude sans alourdir la phrase.
- source_word: יְכֻפַּר
  choice: sera expiée
  rationale: Le passif du verbe כפר exprime l’expiation de la faute ; la formulation française garde la voix passive du texte.
- source_word: פְּרִי
  choice: fruit
  rationale: Conserve la métaphore hébraïque du résultat produit par l’effacement du péché.
- source_word: אַבְנֵי גִר מְנֻפָּצוֹת
  choice: pierres calcaires pulvérisées
  rationale: גיר désigne une matière calcaire ou crayeuse, et מנפצות des pierres brisées ou réduites en morceaux. « Pulvérisées » rend l’image d’une destruction complète.
- source_word: אֲשֵׁרִים
  choice: poteaux sacrés d’Ashéra
  rationale: Le pluriel désigne des objets cultuels associés à Ashéra, souvent représentés comme des poteaux ou des symboles en bois.
- source_word: חַמָּנִים
  choice: colonnes solaires
  rationale: Le terme désigne vraisemblablement des objets ou piliers cultuels liés au soleil, et non des autels à encens.
theological_decisions:
- issue: Rapport entre l’expiation et la destruction des objets idolâtres
  choice: Maintenir « par ceci » puis présenter la destruction cultuelle comme le fruit de l’effacement du péché
  alternative: Faire de la destruction des autels le moyen humain qui procure directement l’expiation
  rationale: La syntaxe conserve une tension entre le moyen de l’expiation et son fruit concret. La traduction évite de trancher davantage que l’hébreu.
- issue: Sujet de בְּשׂוּמוֹ
  choice: « il réduira », avec un sujet laissé implicite comme en hébreu
  alternative: Nommer explicitement Jacob ou Dieu comme sujet
  rationale: Le suffixe verbal masculin singulier ne permet pas à lui seul d’identifier sans ambiguïté le sujet ; l’implicite préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et soutenu. La structure poétique et la métaphore du « fruit » sont conservées, tandis que les termes cultuels rares sont explicités par des notes.
