revisions:
- from: 'Ainsi, c’est par ceci que la faute de Jacob sera expiée, et voici tout le fruit de l’effacement de son péché : il réduira toutes les pierres de l’autel en pierres calcaires pulvérisées ; les poteaux sacrés d’Ashéra[a] et les colonnes solaires[b] ne se dresseront plus.'
  to: 'Ainsi, c’est par cela que la faute de Jacob sera expiée, et ce sera le fruit entier de la suppression de son péché : en faisant de toutes les pierres de l’autel des pierres calcaires pulvérisées ; les poteaux d’Ashéra[a] et les stèles solaires[b] ne se dresseront plus.'
  rationale: La révision conserve les choix fondamentaux du projet, mais restitue la construction infinitive de בְּשׂוּמוֹ et améliore la formulation française de la conséquence (« ce sera le fruit entier »). Elle ne précise pas l’agent implicite de l’action sur l’autel. Les notes restent ancrées aux termes rares et conservent l’incertitude concernant חַמָּנִים.
  reviewer_model: gpt-5.6-terra
