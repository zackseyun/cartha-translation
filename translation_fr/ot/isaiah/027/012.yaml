source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יַחְבֹּ֧ט יְהוָ֛ה מִ/שִּׁבֹּ֥לֶת הַ/נָּהָ֖ר עַד נַ֣חַל מִצְרָ֑יִם וְ/אַתֶּ֧ם תְּלֻקְּט֛וּ לְ/אַחַ֥ד אֶחָ֖ד בְּנֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/012.yaml
  text: And in that day Yahweh will thresh from the channel of the River to the Wadi of Egypt[a], and you will be gathered one by one[d][c][b], O sons of Israel.
translation:
  language: fr
  text: En ce jour-là, Yahweh procédera au battage, depuis le courant du Fleuve[a] jusqu’au torrent d’Égypte[b] ; et vous serez recueillis, un à un[c], fils d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « Fleuve » désigne probablement l’Euphrate.
    reason: cross_reference
  - marker: b
    text: Ou « l’oued d’Égypte ». Le terme hébreu désigne souvent un cours d’eau saisonnier ; il ne s’agit pas nécessairement du Nil.
    reason: lexical_alternative
  - marker: c
    text: Le verbe évoque le glanage, c’est-à-dire le fait de recueillir séparément ce qui reste après la récolte.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: Ce jour-là
  rationale: Formule prophétique temporelle rendue de manière naturelle et concise en français moderne.
- source_word: יַחְבֹּט
  choice: battra
  rationale: Le verbe désigne l’action de battre une récolte ou de faire tomber des fruits en les frappant. Le choix conserve l’image agricole sans préciser un complément absent de l’hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du nom divin, plutôt que substitution par un titre.
- source_word: מִשִּׁבֹּלֶת הַנָּהָר
  choice: depuis le courant du Fleuve
  rationale: Dans ce contexte géographique, שִׁבֹּלֶת désigne vraisemblablement le courant ou le cours du grand fleuve. La majuscule à « Fleuve » reflète son emploi comme désignation géographique.
- source_word: עַד נַחַל מִצְרָיִם
  choice: jusqu’au torrent d’Égypte
  rationale: נַחַל désigne souvent un cours d’eau saisonnier ou un oued, et non nécessairement un grand fleuve permanent.
- source_word: תְּלֻקְּטוּ
  choice: vous serez recueillis
  rationale: Le passif de לקט évoque le glanage et le rassemblement d’éléments dispersés; « recueillis » reste naturel tout en conservant cette nuance.
- source_word: לְאַחַד אֶחָד
  choice: un à un
  rationale: Expression distributive qui souligne le rassemblement individuel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  rationale: Rendu littéral et idiomatique de l’appellation collective adressée aux descendants d’Israël.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le nom divin; sa transcription préserve la distinction entre nom propre et titre.
- issue: Rapport entre le battage et le rassemblement
  choice: Conserver successivement « battra » et « serez recueillis »
  alternative: Expliciter que Yahweh bat ou vanne les peuples afin de rassembler Israël
  rationale: Le texte associe les deux images sans en expliquer entièrement le mécanisme. La traduction maintient cette tension et n’ajoute ni objet explicite au battage ni interprétation théologique.
- issue: Portée de בְּנֵי יִשְׂרָאֵל
  choice: fils d’Israël
  alternative: enfants d’Israël / peuple d’Israël
  rationale: La formulation conserve l’expression hébraïque traditionnelle sans décider si l’adresse doit être comprise exclusivement en termes masculins ou plus largement comme une désignation collective.
translation_notes:
  register: Français moderne, sobre et prophétique. « Ce jour-là » évite une tournure artificielle; « battra » conserve l’image agricole abrupte de l’hébreu; « fils d’Israël » maintient l’adresse collective sans ajouter le vocatif archaïsant « ô ».
