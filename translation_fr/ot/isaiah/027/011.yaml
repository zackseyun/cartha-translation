  source_fidelity: 'Le sens général et l’imagerie sont fidèlement rendus : la végétation desséchée est brisée puis utilisée comme combustible; le pluriel de « elles sont brisées » correspond à תִּשָּׁבַרְנָה, tandis que « y » permet de ne pas lisser entièrement le complément féminin singulier de מְאִירוֹת אוֹתָהּ. Les deux désignations divines distinctes, « celui qui l’a fait » et « celui qui l’a façonné », ainsi que le refus de compassion et de faveur, sont conservés.'
  naturalness: La formulation est globalement claire et actuelle. « Un peuple dépourvu d’intelligence » peut toutefois évoquer surtout une déficience intellectuelle; dans ce contexte prophétique, בִּינוֹת vise plus précisément l’absence de compréhension ou de discernement. « Sans discernement » est plus idiomatique et plus exact. « N’aura pas de compassion pour lui » est également la collocation française la plus naturelle.
  terminology: « Branches », « façonné » et « aucune faveur » rendent bien l’image végétale et le parallélisme des verbes de création. « Sans discernement » préserve le caractère moral et spirituel du constat sans introduire de terminologie confessionnelle.
