  text: בִּ/יבֹ֤שׁ קְצִירָ/הּ֙ תִּשָּׁבַ֔רְנָה נָשִׁ֕ים בָּא֖וֹת מְאִיר֣וֹת אוֹתָ֑/הּ כִּ֣י לֹ֤א עַם בִּינוֹת֙ ה֔וּא עַל כֵּן֙ לֹֽא יְרַחֲמֶ֣/נּוּ עֹשֵׂ֔/הוּ וְ/יֹצְר֖/וֹ לֹ֥א יְחֻנֶּֽ/נּוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/011.yaml
  text: When its branches[a] dry up, they are broken; women come and set them on fire. For this is a people without understanding; therefore its Maker will not have compassion on it, and the one who formed it will show it no favor.
translation:
  language: fr
  text: Quand ses branches[a] sèchent, elles sont brisées ; des femmes viennent y mettre le feu. Car c’est un peuple sans discernement ; c’est pourquoi celui qui l’a fait n’aura pas de compassion pour lui, et celui qui l’a façonné ne lui accordera aucune faveur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un verbe au pluriel (« elles sont brisées »), mais un complément au féminin singulier dans l’expression rendue par « y mettre le feu » ; la végétation semble être envisagée collectivement.
    reason: grammaire
lexical_decisions:
- source_word: בִּיבֹשׁ
  choice: Quand … sèchent
  rationale: La préposition בְּ avec la forme infinitive exprime ici naturellement le temps. « Sèchent » convient à la végétation ensuite brisée et brûlée.
- source_word: קְצִירָהּ
  choice: ses branches
  rationale: Bien que le nom puisse désigner une récolte ou ce qui est coupé, le contexte décrit une végétation desséchée, brisée puis brûlée. « Branches » rend clairement cette image en français.
- source_word: תִּשָּׁבַרְנָה
  choice: elles sont brisées
  rationale: Le verbe passif est au féminin pluriel et renvoie aux branches ou aux parties de végétation desséchées.
- source_word: נָשִׁים בָּאוֹת מְאִירוֹת אוֹתָהּ
  choice: des femmes viennent y mettre le feu
  rationale: Cette formulation naturelle conserve l’action des femmes et l’emploi de la végétation sèche comme combustible, tout en laissant subsister la valeur collective du complément singulier hébreu.
- source_word: לֹא עַם בִּינוֹת הוּא
  choice: c’est un peuple dépourvu d’intelligence
  rationale: La tournure exprime directement l’absence de discernement ou de compréhension sans affaiblir le jugement porté sur le peuple.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: Ce connecteur marque clairement la conséquence entre le manque d’intelligence du peuple et le jugement annoncé.
- source_word: לֹא יְרַחֲמֶנּוּ
  choice: n’aura pas compassion de lui
  rationale: רחם désigne la compassion ou la miséricorde. Le pronom masculin singulier reprend naturellement « peuple » en français.
- source_word: עֹשֵׂהוּ
  choice: celui qui l’a fait
  rationale: Cette traduction garde la désignation participiale de Dieu comme celui qui a fait ce peuple, sans confondre עשה avec un autre verbe de création.
- source_word: וְיֹצְרוֹ
  choice: celui qui l’a façonné
  rationale: « Façonner » conserve l’image distinctive de יצר et le parallélisme avec « celui qui l’a fait ».
- source_word: לֹא יְחֻנֶּנּוּ
  choice: ne lui accordera aucune faveur
  rationale: חנן signifie accorder grâce ou faveur. Cette expression française actuelle préserve le sens sans imposer une terminologie doctrinale spécialisée.
theological_decisions:
- issue: Nombre grammatical dans l’image de la végétation
  choice: Traduire le nom contextuellement par « branches » et conserver le verbe passif pluriel, tout en employant « y mettre le feu » pour ne pas effacer le complément collectif singulier de l’hébreu.
  alternative: « Quand sa récolte sèche, elle est brisée ; des femmes viennent en faire du feu. »
  rationale: L’hébreu associe un verbe féminin pluriel à un complément féminin singulier, probablement parce que la végétation est envisagée tantôt comme plusieurs éléments, tantôt comme un ensemble. La traduction et la note préservent cette tension au lieu de l’harmoniser silencieusement.
- issue: Double désignation divine et jugement
  choice: Conserver séparément « celui qui l’a fait » et « celui qui l’a façonné », ainsi que l’absence de compassion et de faveur.
  alternative: Réduire les deux expressions à « Dieu n’aura pas pitié d’eux ».
  rationale: 'Les deux participes hébreux עשה et יצר ont des images distinctes. Leur maintien fait ressortir la tension voulue : celui qui a fait et façonné ce peuple lui refuse compassion et faveur à cause de son manque d’intelligence.'
translation_notes:
  register: Français international moderne, clair et digne. « Dépourvu d’intelligence » exprime ici l’absence de discernement plutôt qu’une simple faiblesse intellectuelle. Le parallélisme hébreu entre « fait » et « façonné » est conservé.
