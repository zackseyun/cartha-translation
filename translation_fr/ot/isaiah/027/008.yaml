base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/008.yaml
  text: By measure[a], when you sent her away, you contended with her[c][b]; he drove her out with his fierce wind on the day of the east wind.
translation:
  language: fr
  text: Avec mesure[a], en la renvoyant, tu as plaidé contre elle[b] ; il l’a chassée par son vent violent, au jour du vent d’est[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Avec retenue » ou « Dans une mesure précise ». Le terme hébreu est rare et semble indiquer que le jugement était limité plutôt que total.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu conserve le pronom féminin « elle » ; il personnifie probablement Sion, Israël ou le peuple sous les traits d’une femme.
    reason: alternative_reading
  - marker: c
    text: Dans la Bible hébraïque, le vent d’est est souvent un vent brûlant et destructeur venant du désert.
    reason: cultural_note
lexical_decisions:
- source_word: בְּסַּאסְּאָה
  choice: Avec mesure
  rationale: Ce terme hébreu rare est généralement compris comme indiquant une action mesurée ou limitée. « Avec mesure » conserve sa brièveté et l’idée que le jugement n’aboutit pas à l’anéantissement.
- source_word: בְּשַׁלְחָהּ
  choice: en la renvoyant
  rationale: L’infinitif construit avec suffixe féminin exprime ici le moyen ou la circonstance de l’action. « En la renvoyant » reste proche de la syntaxe hébraïque et laisse ouverte la nuance d’exil ou d’expulsion.
- source_word: תְּרִיבֶנָּה
  choice: tu as plaidé contre elle
  rationale: Le verbe ריב peut évoquer une contestation, un différend ou une action judiciaire. « Plaider contre » conserve cette coloration juridique sans réduire le passage à un procès formel.
- source_word: הָגָה
  choice: il l’a chassée
  rationale: Dans ce contexte de jugement associé à un vent violent, le verbe est compris comme une éviction énergique. « Chassée » exprime cette action décisive sans préciser davantage sa destination.
- source_word: בְּרוּחוֹ הַקָּשָׁה
  choice: par son vent violent
  rationale: רוּחַ désigne ici le vent, comme le confirme la mention du vent d’est. L’adjectif exprime la dureté ou la force ; « violent » forme en français une association naturelle avec « vent ».
- source_word: בְּיוֹם קָדִים
  choice: au jour du vent d’est
  rationale: La formulation conserve l’image poétique du jour marqué par le vent d’est, traditionnellement chaud et destructeur, sans expliciter cette connotation dans le corps du texte.
theological_decisions:
- issue: Référent des suffixes féminins
  choice: Maintenir le pronom féminin « elle » sans identifier explicitement son référent.
  alternative: Préciser « Israël », « Sion » ou « le peuple de Dieu » dans le texte.
  rationale: Le contexte personnifie vraisemblablement Israël ou Sion sous les traits d’une femme, mais le verset ne nomme pas le référent. Le pronom préserve l’ambiguïté du texte.
- issue: Passage de la deuxième à la troisième personne
  choice: Conserver le changement entre « tu as plaidé » et « il l’a chassée ».
  alternative: Uniformiser les deux propositions à la deuxième personne.
  rationale: L’hébreu présente ce changement abrupt de personne. Le maintenir respecte la texture poétique et évite une harmonisation interprétative.
- issue: Portée du jugement divin
  choice: Rendre le premier terme par « Avec mesure » sans expliquer dans le texte que le jugement est limité.
  alternative: Traduire explicitement par « Avec retenue » ou développer l’idée d’un jugement non exterminateur.
  rationale: Le terme rare paraît évoquer une action mesurée, mais sa nuance exacte demeure incertaine. Une note présente les principales possibilités sans résoudre la tension dans le texte.
translation_notes:
  register: Français international actuel, digne et poétique. La construction « au jour du vent d’est » garde la densité imagée de l’hébreu ; « en la renvoyant » conserve le lien syntaxique étroit entre l’éloignement et la contestation judiciaire.
