  text: הַ/כְּ/מַכַּ֥ת מַכֵּ֖/הוּ הִכָּ֑/הוּ אִם כְּ/הֶ֥רֶג הֲרֻגָ֖י/ו הֹרָֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/007.yaml
  text: Has he struck him as he struck the one who struck him? Or has he been killed as his slain were killed?[a][b]
translation:
  language: fr
  text: L’a-t-il frappé comme il a frappé celui qui le frappait ? Ou a-t-il été tué comme ceux qu’il a tués ont été tués ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « L’a-t-il frappé selon le coup de celui qui le frappait ? »'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, celui dont il est question n’est pas anéanti de la même manière que ceux qu’il — ou son ennemi — a tués. En hébreu, les référents des pronoms restent condensés et quelque peu implicites.
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּמַכַּת
  choice: L’a-t-il… comme il a…
  rationale: L’interrogatif הַ associé à la préposition comparative כְּ introduit une question rhétorique. La tournure française conserve à la fois l’interrogation et la comparaison.
- source_word: מַכֵּהוּ
  choice: celui qui le frappait
  rationale: Le participe hifil de נכה avec suffixe masculin singulier désigne l’agent qui le frappe. Cette formulation est naturelle en français et garde les référents pronominaux implicites.
- source_word: הִכָּהוּ
  choice: l’a-t-il frappé
  rationale: Le verbe accompli est rendu par le passé composé, idiomatique dans une question française portant sur l’action évoquée.
- source_word: אִם
  choice: Ou
  rationale: Dans ce parallélisme interrogatif, אִם introduit la seconde possibilité et prend une valeur disjonctive.
- source_word: כְּהֶרֶג
  choice: comme… ont été tués
  rationale: Le nom הֶרֶג exprime la mise à mort. Une formulation verbale passive est plus naturelle en français tout en maintenant la comparaison.
- source_word: הֲרֻגָיו
  choice: ceux qu’il avait tués
  rationale: Le participe passif substantivé avec suffixe peut désigner « ses tués », c’est-à-dire ceux tués par lui. La formulation française explicite grammaticalement cette relation tout en laissant l’antécédent de « il » indéterminé.
- source_word: הֹרָג
  choice: a-t-il été tué
  rationale: La forme hophal exprime le passif. Le passé composé restitue clairement la question rhétorique sans ajouter l’identité de l’agent.
theological_decisions:
- issue: Référents des pronoms dans la comparaison rhétorique
  choice: Conserver les pronoms sans nommer explicitement Israël/Jacob, le Seigneur ou l’ennemi dans le texte principal.
  alternative: Identifier directement Israël/Jacob comme celui qui est frappé et ses ennemis comme ceux qui le frappent.
  rationale: L’hébreu comprime et laisse implicites les référents. Le contexte suggère un contraste entre le châtiment mesuré d’Israël/Jacob et le jugement de ceux qui l’ont frappé, mais le préciser dans le texte résoudrait une ambiguïté réelle.
- issue: Valeur du suffixe dans הֲרֻגָיו
  choice: « ceux qu’il avait tués », avec un référent pronominal non identifié
  alternative: « ses victimes » ou « ceux que son ennemi avait tués »
  rationale: La construction peut exprimer les personnes tuées par le référent du suffixe, mais l’identité exacte de celui-ci demeure comprimée. La traduction préserve cette tension grâce au pronom, complété par une note.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme des deux questions est conservé. « Tuer » est préféré à « massacrer » afin de ne pas renforcer indûment le registre, tandis que la répétition du radical de mise à mort est rendue par la répétition de « tué ».
