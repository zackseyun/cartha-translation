id: ISA.27.3
reference: Isaiah 27:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֤י יְהוָה֙ נֹֽצְרָ֔/הּ לִ/רְגָעִ֖ים אַשְׁקֶ֑/נָּה פֶּ֚ן יִפְקֹ֣ד עָלֶ֔י/הָ לַ֥יְלָה וָ/י֖וֹם אֶצֳּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/003.yaml
  text: I[a], Yahweh, am its keeper[b]; I water it continually. Lest anyone punish it, I guard it night and day.
translation:
  language: fr
  text: Moi, Yahweh, je veille sur elle ; je l’arrose à chaque instant[a]. De peur que quelqu’un ne s’en prenne à elle[b], je la garde nuit et jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de moment en moment » ou « continuellement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne l’attaque » ou « ne vienne la punir ». Le verbe hébreu peut désigner une intervention hostile ou une visite punitive.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit plutôt que remplacé par un titre, conformément au texte hébreu.
- source_word: נֹצְרָהּ
  choice: je veille sur elle
  rationale: Le verbe נצר exprime une protection vigilante. Le pronom féminin renvoie à la vigne du contexte.
- source_word: לִרְגָעִים
  choice: à chaque instant
  rationale: L’expression signifie littéralement « à des moments » et décrit ici un soin constamment renouvelé.
- source_word: אַשְׁקֶנָּה
  choice: je l’arrose
  rationale: Le hiphil de שקה signifie « donner à boire » ; pour une vigne, « arroser » est naturel et précis.
- source_word: פֶּן
  choice: de peur que
  rationale: Cette tournure introduit une situation que la vigilance de Yahweh vise à empêcher.
- source_word: יִפְקֹד עָלֶיהָ
  choice: quelqu’un ne s’en prenne à elle
  rationale: פקד avec על peut évoquer une intervention hostile ou punitive. Cette formulation française conserve l’idée d’hostilité sans imposer exclusivement le sens judiciaire.
- source_word: לַיְלָה וָיוֹם
  choice: nuit et jour
  rationale: Expression idiomatique indiquant une protection ininterrompue.
- source_word: אֶצֳּרֶנָּה
  choice: je la garde
  rationale: La seconde occurrence de נצר est rendue par un verbe actif de protection, tout en variant naturellement par rapport à « je veille sur elle ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin ; sa transcription préserve cette distinction sans lui substituer un titre.
- issue: Sujet non exprimé de יִפְקֹד
  choice: quelqu’un
  alternative: il ; un ennemi
  rationale: Le verbe est à la troisième personne masculine du singulier sans sujet explicite. Un sujet indéfini rend naturellement cette indétermination en français.
- issue: Portée de פקד על
  choice: s’en prendre à
  alternative: punir ; attaquer ; intervenir contre
  rationale: Le contexte de protection de la vigne favorise une intervention hostile, tandis que la note maintient la possible nuance punitive.
translation_notes:
  register: Français international moderne, digne et accessible. « Moi, Yahweh » conserve l’emphase du pronom hébreu. Le féminin est maintenu parce que le référent contextuel est la vigne.
