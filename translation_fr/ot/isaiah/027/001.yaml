source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֡וּא יִפְקֹ֣ד יְהוָה֩ בְּ/חַרְב֨/וֹ הַ/קָּשָׁ֜ה וְ/הַ/גְּדוֹלָ֣ה וְ/הַֽ/חֲזָקָ֗ה עַ֤ל לִוְיָתָן֙ נָחָ֣שׁ בָּרִ֔חַ וְ/עַל֙ לִוְיָתָ֔ן נָחָ֖שׁ עֲקַלָּת֑וֹן וְ/הָרַ֥ג אֶת הַ/תַּנִּ֖ין אֲשֶׁ֥ר בַּ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/001.yaml
  text: In that day Yahweh will punish Leviathan the fleeing serpent[a], Leviathan the twisting serpent, with his fierce and great and strong sword[c][b]; and he will kill the dragon that is in the sea.
translation:
  language: fr
  text: En ce jour-là, Yahweh punira, avec son épée redoutable, grande et puissante, Léviathan, le serpent fugitif[a], Léviathan, le serpent tortueux[b] ; il tuera le monstre marin[c] qui est dans la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le serpent rapide ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le serpent sinueux » ou « le serpent qui se contorsionne ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « le dragon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique naturelle en français, qui conserve la portée littéraire et eschatologique de l’hébreu.
- source_word: יִפְקֹד ... עַל
  choice: interviendra contre
  rationale: פקד suivi de עַל exprime ici une intervention hostile et judiciaire. Cette formulation préserve l’idée de jugement sans réduire d’emblée le verbe au seul sens de « punir ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération usuelle du nom divin, plutôt que substitution par un titre.
- source_word: בְּחַרְבוֹ
  choice: avec son épée
  rationale: Rend naturellement le beth instrumental tout en conservant l’image guerrière concrète.
- source_word: הַקָּשָׁה וְהַגְּדוֹלָה וְהַחֲזָקָה
  choice: redoutable, grande et puissante
  rationale: « Redoutable » exprime la dureté menaçante de קָשָׁה appliquée à l’épée ; « grande » et « puissante » maintiennent l’accumulation emphatique des trois adjectifs.
- source_word: לִוְיָתָן
  choice: Léviathan
  rationale: Conserve le nom propre traditionnel de la créature poétique et mythique.
- source_word: נָחָשׁ בָּרִחַ
  choice: le serpent fuyard
  rationale: « Serpent » convient au registre poétique ; « fuyard » rend directement le sens probable de בָּרִחַ tout en laissant en note l’alternative liée à la rapidité ou au mouvement glissant.
- source_word: נָחָשׁ עֲקַלָּתוֹן
  choice: le serpent tortueux
  rationale: « Tortueux » restitue l’idée de torsion, de courbure ou de mouvement sinueux et garde une dignité poétique naturelle.
- source_word: וְהָרַג
  choice: il tuera
  rationale: Le qatal coordonné poursuit ici la perspective future de l’annonce prophétique ; « tuera » est direct et moderne.
- source_word: הַתַּנִּין
  choice: le monstre marin
  rationale: Dans ce contexte de chaos marin, תַּנִּין désigne une grande créature monstrueuse. « Monstre marin » évite les associations modernes parfois trop précises de « dragon », signalé néanmoins en note.
- source_word: אֲשֶׁר בַּיָּם
  choice: qui est dans la mer
  rationale: Rend simplement la proposition relative sans transformer la mer en nom propre ni préciser davantage son identité.
theological_decisions:
- issue: Imagerie mythique de Léviathan et du tannîn
  choice: Conserver Léviathan et le monstre marin comme figures poétiques sans leur attribuer explicitement un référent unique.
  alternative: Les identifier dans le texte à Satan, au chaos cosmique ou à un empire historique précis.
  rationale: Le verset mobilise l’imagerie biblique et proche-orientale des monstres du chaos, mais ne précise pas ici leur référent. La traduction maintient donc l’ambiguïté symbolique et la tension théologique du texte.
- issue: Valeur judiciaire de פקד
  choice: « interviendra contre »
  alternative: « punira » ou « demandera des comptes à »
  rationale: Le contexte indique clairement une action de jugement, mais le verbe possède une portée plus large que la seule punition. La formulation retenue conserve cette amplitude tout en exprimant l’hostilité de l’action.
translation_notes:
  register: Français international moderne, digne et poétique. La phrase conserve la répétition de « Léviathan » et l’accumulation des qualificatifs de l’épée, tout en adoptant une ponctuation française fluide. Tous les marqueurs de notes figurent immédiatement après les expressions concernées.
