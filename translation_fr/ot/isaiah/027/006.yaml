  text: הַ/בָּאִים֙ יַשְׁרֵ֣שׁ יַֽעֲקֹ֔ב יָצִ֥יץ וּ/פָרַ֖ח יִשְׂרָאֵ֑ל וּ/מָלְא֥וּ פְנֵי תֵבֵ֖ל תְּנוּבָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/006.yaml
  text: In days to come Jacob will take root[a]; Israel will blossom and flower[b], and they will fill the face of the world with fruit.
translation:
  language: fr
  text: Dans les jours à venir, Jacob prendra racine[a] ; Israël bourgeonnera et fleurira, et ils rempliront le monde de fruits[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Ceux qui viennent, Jacob prendra racine. » L’expression hébraïque signifie plus littéralement « ceux qui viennent », mais elle semble ici avoir une valeur temporelle.'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « ils rempliront la face du monde de fruits ». Le mot traduit par « fruits » peut aussi signifier « produits » ou « rendement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּאִים
  choice: Dans les temps à venir
  rationale: L’expression participiale avec article est elliptique. Dans ce contexte prophétique, elle introduit vraisemblablement un temps futur plutôt qu’un groupe de personnes.
- source_word: יַשְׁרֵשׁ
  choice: prendra racine
  rationale: Le hifil peut avoir une valeur causative (« fera prendre racine »), mais, avec Jacob comme sujet et dans le parallélisme végétal, l’emploi quasi intransitif est naturel en français.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacob / Israël
  rationale: Les noms sont conservés tels quels. Ils désignent collectivement le peuple, sans que cette interprétation soit explicitée dans le texte.
- source_word: יָצִיץ וּפָרַח
  choice: bourgeonnera et fleurira
  rationale: Les deux verbes décrivent successivement la pousse ou l’apparition des bourgeons, puis la floraison. Cette formulation maintient leur distinction et l’image botanique.
- source_word: וּמָלְאוּ
  choice: et ils couvriront
  rationale: Le verbe pluriel considère le peuple comme une pluralité. « Couvriront » exprime idiomatiquement en français le fait de remplir une surface, tout en gardant le sujet pluriel explicite.
- source_word: פְנֵי תֵבֵל
  choice: toute la terre
  rationale: Littéralement « la face du monde habité ». « Toute la terre » rend naturellement l’étendue mondiale visée, tandis qu’une note conserve l’image formelle.
- source_word: תְּנוּבָה
  choice: de fruits
  rationale: Le nom peut désigner le fruit, le produit ou le rendement. « Fruits » s’accorde au mieux avec la métaphore végétale environnante.
theological_decisions:
- issue: Identité collective de Jacob et d’Israël dans la métaphore agricole
  choice: Conserver les noms Jacob et Israël, avec passage du singulier au pluriel dans la dernière proposition
  alternative: Expliciter « les descendants de Jacob » ou maintenir artificiellement un sujet singulier
  rationale: L’hébreu personnifie d’abord collectivement le peuple sous les noms Jacob et Israël, puis emploie un verbe pluriel. La traduction préserve cette tension grammaticale et théologique sans expansion interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme poétique et l’image végétale sont conservés. « Dans les temps à venir » est idiomatique sans être familier ; la rupture du singulier (« Israël ») au pluriel (« ils ») reproduit le mouvement du texte hébreu.
