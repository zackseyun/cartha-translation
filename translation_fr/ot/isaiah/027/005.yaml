  text: א֚וֹ יַחֲזֵ֣ק בְּ/מָעוּזִּ֔/י יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑/י שָׁל֖וֹם יַֽעֲשֶׂה לִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/005.yaml
  text: Or let him take hold of my strength[a]; let him make peace with me; let him make peace with me.
translation:
  language: fr
  text: Ou bien, qu’il s’attache à ma force[a] ; qu’il fasse la paix avec moi, qu’il fasse la paix avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma protection », « mon refuge » ou « ma forteresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: Ou bien
  rationale: Introduit clairement l’alternative offerte après l’image du jugement dans le contexte précédent.
- source_word: יַחֲזֵ֣ק
  choice: qu’il s’attache à
  rationale: Le hiphil de חזק exprime ici l’action de saisir fermement ou de chercher appui. « S’attacher à » conserve l’idée d’une démarche résolue tout en restant naturel en français.
- source_word: בְּמָעוּזִּי
  choice: ma protection
  rationale: מָעוֹז peut désigner la force, un refuge ou une place forte. Dans cette invitation à échapper au jugement, « ma protection » exprime naturellement la fonction du terme sans effacer ses autres nuances, signalées en note.
- source_word: יַעֲשֶׂ֥ה שָׁל֖וֹם לִ֑י
  choice: qu’il fasse la paix avec moi
  rationale: L’expression עשה שלום avec לְ désigne ici l’établissement de relations pacifiques avec le locuteur. Le subjonctif restitue la valeur volitive du verbe.
- source_word: שָׁל֖וֹם יַֽעֲשֶׂה לִּֽי
  choice: qu’il fasse la paix avec moi
  rationale: La proposition entière est répétée afin de conserver l’insistance marquée de l’hébreu.
theological_decisions:
- issue: Référent des pronoms de première personne
  choice: Le locuteur est Dieu, qui offre sa protection et la paix avec lui comme alternative au jugement.
  alternative: Une formulation impersonnelle qui atténuerait la référence directe à Dieu.
  rationale: Dans le contexte immédiat d’Ésaïe 27, le discours est divin. La traduction maintient cette invitation directe sans tirer de conclusion doctrinale supplémentaire.
- issue: Nature de מָעוּזִּי
  choice: « ma protection », compris comme la protection offerte par Dieu.
  alternative: « ma force », « mon refuge » ou « ma forteresse ».
  rationale: Le mot garde une tension entre force protectrice et lieu de refuge. Le texte principal privilégie une expression française naturelle, tandis que la note préserve l’étendue lexicale.
translation_notes:
  register: Français moderne, digne et direct. La répétition finale est volontairement conservée pour rendre l’insistance de l’hébreu.
