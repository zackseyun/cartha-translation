  text: חֵמָ֖ה אֵ֣ין לִ֑/י מִֽי יִתְּנֵ֜/נִי שָׁמִ֥יר שַׁ֨יִת֙ בַּ/מִּלְחָמָ֔ה אֶפְשְׂעָ֥ה בָ֖/הּ אֲצִיתֶ֥/נָּה יָּֽחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/004.yaml
  text: I have no wrath[a]. Who would set briers and thorns against me in battle? I would march against them[b]; I would burn them up together.
translation:
  language: fr
  text: Je n’éprouve aucune colère. Qui dresserait contre moi des ronces et des épines pour le combat[a] ? Je passerais à travers elles[b] et je les brûlerais toutes ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui me donnera des ronces et des épines pour le combat ? » La tournure peut exprimer un défi ou le souhait de voir de tels adversaires placés devant le locuteur.'
    reason: lexical_alternative
  - marker: b
    text: Dans « je passerais à travers elles » et « je les brûlerais », les suffixes hébreux sont au féminin singulier et renvoient collectivement aux « ronces et épines » ; le français emploie naturellement le pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵמָה
  choice: fureur
  rationale: Le nom évoque une colère ardente et intense. « Fureur » en conserve la force tout en restant naturel dans ce contexte poétique.
- source_word: אֵין לִי
  choice: je n’éprouve aucune
  rationale: La construction existentielle signifie littéralement « il n’y en a pas pour moi ». Avec un sentiment comme « fureur », cette formulation rend naturellement la possession ou la disposition en français.
- source_word: מִי יִתְּנֵנִי
  choice: Qui dressera contre moi
  rationale: Littéralement, « Qui me donnera ». Dans ce contexte de combat, l’expression lance un défi et envisage que des adversaires soient placés devant le locuteur.
- source_word: שָׁמִיר שַׁיִת
  choice: des ronces et des épines
  rationale: Le binôme désigne collectivement une végétation épineuse, hostile et destinée au feu. « Ronces et épines » est clair et naturel en français.
- source_word: בַּמִּלְחָמָה
  choice: dans la bataille
  rationale: Cette expression conserve explicitement le cadre martial du texte hébreu.
- source_word: אֶפְשְׂעָה בָהּ
  choice: Je marcherais contre elles
  rationale: Le verbe exprime l’action d’avancer ou de faire un pas, ici contre un adversaire. Le conditionnel français rend naturellement la conséquence de la situation hypothétique évoquée par la question précédente.
- source_word: אֲצִיתֶנָּה
  choice: je les brûlerais
  rationale: Le hifil de יצת signifie mettre le feu ou embraser. Le pluriel français reprend naturellement les deux termes collectifs « ronces et épines ».
- source_word: יַחַד
  choice: toutes ensemble
  rationale: L’adverbe souligne que la végétation épineuse serait entièrement brûlée en une seule fois.
theological_decisions:
- issue: Disposition du locuteur envers la vigne
  choice: La déclaration « Je n’éprouve aucune fureur » demeure sans complément explicite, comme en hébreu, et se comprend dans le cadre immédiat de la vigne gardée par le Seigneur.
  alternative: Préciser « contre elle » ou généraliser en « je ne me mets jamais en colère ».
  rationale: 'L’absence d’objet doit être préservée : elle permet au contexte d’orienter le sens sans transformer cette affirmation locale en déclaration théologique absolue.'
- issue: Valeur de la question concernant les ronces et les épines
  choice: 'La rendre comme un défi martial : « Qui dressera contre moi… ? »'
  alternative: 'La rendre comme un souhait : « Si seulement j’avais devant moi… »'
  rationale: La tournure hébraïque peut exprimer un défi ou un souhait. La forme interrogative maintient cette tension tout en faisant ressortir l’image du combat.
translation_notes:
  register: Français international moderne, poétique et digne. Le vocabulaire reste accessible, tandis que le rythme bref et l’image martiale de l’hébreu sont conservés.
