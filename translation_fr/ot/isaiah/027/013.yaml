  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יִתָּקַע֮ בְּ/שׁוֹפָ֣ר גָּדוֹל֒ וּ/בָ֗אוּ הָ/אֹֽבְדִים֙ בְּ/אֶ֣רֶץ אַשּׁ֔וּר וְ/הַ/נִּדָּחִ֖ים בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הִשְׁתַּחֲו֧וּ לַ/יהוָ֛ה בְּ/הַ֥ר הַ/קֹּ֖דֶשׁ בִּ/ירוּשָׁלִָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/013.yaml
  text: And in that day a great trumpet will be blown[c][b][a], and those perishing in the land of Assyria and those driven away in the land of Egypt will come and worship Yahweh on the holy mountain in Jerusalem.
translation:
  language: fr
  text: En ce jour-là, une grande trompette retentira. Ceux qui périssent[a] au pays d’Assyrie et ceux qui ont été chassés[b] au pays d’Égypte viendront se prosterner[c] devant le SEIGNEUR, sur la montagne sainte, à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont perdus ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les bannis » ou « les exilés ».
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu désigne littéralement le fait de s’incliner ou de se prosterner; dans ce contexte, il s’agit d’adorer le SEIGNEUR.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Rend naturellement la formule prophétique d’introduction et son orientation future sans employer la tournure vieillie « il arrivera en ce jour-là ».
- source_word: יִתָּקַע בְּשׁוֹפָר גָּדוֹל
  choice: une grande trompette retentira
  rationale: Exprime en français courant le son puissant du שׁוֹפָר et conserve l’indétermination ainsi que l’adjectif « grand ». « Trompette » communique mieux la fonction au lecteur ordinaire que le terme translittéré « shofar ».
- source_word: הָאֹבְדִים
  choice: ceux qui périssent
  rationale: Conserve la valeur participiale et la possibilité d’une situation de ruine en cours, sans réduire le mot au seul sens de personnes géographiquement perdues.
- source_word: בְּאֶרֶץ אַשּׁוּר
  choice: au pays d’Assyrie
  rationale: Maintient le nom explicite אֶרֶץ, tout en employant une construction française naturelle.
- source_word: וְהַנִּדָּחִים
  choice: ceux qui ont été chassés
  rationale: Préserve la valeur passive et l’image de personnes repoussées loin de leur lieu, sans imposer le sens juridique plus étroit de « bannis ».
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: au pays d’Égypte
  rationale: Maintient le parallélisme géographique avec le pays d’Assyrie et rend explicitement אֶרֶץ.
- source_word: וְהִשְׁתַּחֲווּ
  choice: viendront se prosterner
  rationale: Conserve le geste concret d’abaissement corporel et, avec « devant le SEIGNEUR », laisse clairement percevoir sa portée cultuelle.
- source_word: לַיהוָה
  choice: devant le SEIGNEUR
  rationale: « Devant » convient au geste de prosternation, tandis que « le SEIGNEUR » suit la convention française courante pour le tétragramme.
- source_word: בְּהַר הַקֹּדֶשׁ בִּירוּשָׁלִָם
  choice: sur la montagne sainte, à Jérusalem
  rationale: Rend directement le lieu sacré et rattache naturellement Jérusalem à sa localisation en français.
theological_decisions:
- issue: Portée du rassemblement prophétique
  choice: Conserver l’annonce d’un rassemblement futur depuis l’Assyrie et l’Égypte sans en préciser exclusivement l’accomplissement.
  alternative: Limiter le texte soit au retour historique des exilés, soit au rassemblement eschatologique final.
  rationale: La formule « en ce jour-là » et les images de restauration peuvent porter plusieurs horizons prophétiques; la traduction ne tranche pas ce que le verset laisse ouvert.
- issue: Nature de l’acte exprimé par וְהִשְׁתַּחֲווּ
  choice: se prosterner devant le SEIGNEUR
  alternative: adorer le SEIGNEUR
  rationale: Le contexte indique bien l’adoration, mais le choix retenu préserve aussi le geste physique exprimé par le verbe hébreu.
- issue: Rendu du tétragramme יהוה
  choice: le SEIGNEUR
  alternative: YHWH / Yahvé
  rationale: Cette forme est intelligible, digne et conforme à une convention biblique française largement reçue, sans privilégier une vocalisation reconstruite.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsmes. Le verset est réparti en deux phrases pour éviter une coordination lourde. Les parallélismes géographiques et les participes substantivés sont conservés autant que le permet un français naturel.
