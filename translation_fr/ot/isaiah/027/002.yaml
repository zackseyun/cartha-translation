  text: בַּ/יּ֖וֹם הַ/ה֑וּא כֶּ֥רֶם חֶ֖מֶד עַנּוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/027/002.yaml
  text: 'In that day: “A pleasant vineyard”—sing of it![a][b]'
translation:
  language: fr
  text: 'En ce jour-là : « Une vigne délicieuse[a] » — chantez à son sujet[b] !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Une vigne de délices » ; cette tournure rend plus littéralement l’expression hébraïque.
    reason: lexical_alternative
  - marker: b
    text: Ou « chantez-lui » ou « chantez pour elle » ; le verbe hébreu peut évoquer une réponse chantée, et le pronom féminin renvoie à la vigne.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique consacrée, naturelle en français et fidèle à la cadence de l’hébreu.
- source_word: כֶּרֶם
  choice: vigne
  rationale: Le nom désigne ici le vignoble comme réalité collective. « Vigne » est le terme français courant dans l’image biblique du vignoble et s’accorde naturellement avec le pronom féminin.
- source_word: חֶמֶד
  choice: délicieuse
  rationale: Le substantif exprime ce qui suscite le plaisir, le désir ou l’admiration. « Délicieuse » produit une apposition poétique naturelle tout en conservant l’évaluation positive.
- source_word: עַנּוּ
  choice: chantez
  rationale: 'Impératif pluriel du verbe ענה employé dans un sens musical ou responsorial : répondre en chantant, d’où ici l’exhortation concise « chantez ».'
- source_word: לָהּ
  choice: pour elle
  rationale: 'La préposition ל avec le suffixe féminin singulier renvoie à la vigne. « Pour elle » garde la personnification et laisse ouverte la nuance exacte : chanter pour, à propos de, ou en l’honneur de la vigne.'
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et digne. La ponctuation présente « Une vigne délicieuse » comme le thème du chant. Le féminin « elle » conserve la référence grammaticale hébraïque et la légère personnification de la vigne.
