base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/007.yaml
  text: to open blind eyes[a], to bring a prisoner out from confinement[c][b], from the prison house those who sit in darkness.
translation:
  language: fr
  text: pour ouvrir des yeux aveugles[a], pour faire sortir un prisonnier du lieu de détention[b], et de la prison ceux qui sont assis dans les ténèbres[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les yeux des aveugles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du cachot » ou « de la prison » ; le terme hébreu peut désigner un lieu fermé où quelqu’un est retenu.
    reason: lexical_alternative
  - marker: c
    text: Ou « ceux qui demeurent dans les ténèbres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְקֹחַ
  choice: pour ouvrir
  rationale: L’infinitif construit exprime ici le but. « Ouvrir » rend naturellement la tournure hébraïque employée avec « yeux ».
- source_word: עֵינַיִם עִוְרוֹת
  choice: des yeux aveugles
  rationale: L’adjectif qualifie directement les yeux. Cette formulation concise conserve l’image concrète et l’indétermination de l’hébreu.
- source_word: לְהוֹצִיא
  choice: pour faire sortir
  rationale: 'Ce second infinitif de but a une valeur causative : il s’agit de faire sortir quelqu’un de son enfermement.'
- source_word: מִמַּסְגֵּר
  choice: du lieu de détention
  rationale: Le terme peut désigner un endroit fermé où l’on retient quelqu’un. La formulation choisie préserve cette portée générale sans imposer un type précis de cachot ou de prison.
- source_word: אַסִּיר
  choice: le prisonnier
  rationale: Le singulier hébreu désigne un prisonnier de manière représentative. L’article défini convient naturellement en français dans cette construction poétique.
- source_word: מִבֵּית כֶּלֶא
  choice: de la prison
  rationale: L’expression signifie littéralement « de la maison d’emprisonnement ». « De la prison » est idiomatique en français moderne tout en conservant le cadre concret de l’incarcération.
- source_word: יֹשְׁבֵי חֹשֶׁךְ
  choice: ceux qui sont assis dans les ténèbres
  rationale: Le participe de ישב peut signifier « être assis » ou « demeurer ». « Sont assis » conserve l’image poétique vive de personnes maintenues dans les ténèbres.
theological_decisions:
- issue: Portée littérale ou métaphorique de l’aveuglement, de l’emprisonnement et des ténèbres
  choice: Conserver les images concrètes sans en expliciter le sens spirituel dans le texte.
  alternative: Interpréter expressément le verset comme une illumination et une libération spirituelles.
  rationale: Le passage peut porter à la fois une résonance concrète et métaphorique. L’hébreu ne tranche pas explicitement entre ces dimensions ; la traduction maintient donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme poétique et les images concrètes de l’hébreu sont conservés, tandis que « de la prison » évite le calque peu naturel « de la maison d’emprisonnement ».
