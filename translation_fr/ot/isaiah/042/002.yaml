  text: He will not cry out or raise his voice[a], or make his voice heard in the street.
translation:
  language: fr
  text: Il ne criera pas, il n’élèvera pas la voix[a] et ne la fera pas entendre dans la rue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne crie pas, il n’élève pas la voix et ne fait pas entendre sa voix au-dehors. »'
    reason: 'Alternative aspectuelle : les inaccomplis peuvent décrire une conduite habituelle au présent. Alternative lexicale : חוּץ peut se rendre par « au-dehors ».'
lexical_decisions:
- source_word: יִצְעַק
  choice: criera
  rationale: Le verbe צעק désigne un cri ou un appel lancé à haute voix. « Crier » conserve ici la dimension sonore et publique sans imposer l’idée d’un cri de détresse.
- source_word: יִשָּׂא
  choice: élèvera la voix
  rationale: נשׂא signifie littéralement « lever, porter ». Dans ce parallélisme, la voix mentionnée dans la proposition suivante est sous-entendue; « élever la voix » restitue naturellement cette ellipse en français.
- source_word: יַשְׁמִיעַ
  choice: fera entendre
  rationale: La forme causative de שׁמע signifie « faire entendre ». Cette traduction garde la valeur causative tout en restant idiomatique.
- source_word: בַּחוּץ
  choice: dans la rue
  rationale: חוּץ désigne l’extérieur ou l’espace public. « Dans la rue » convient à l’image d’une prise de parole publique, sans préciser indûment une place de marché.
- source_word: קוֹלוֹ
  choice: la
  rationale: Le pronom « la » reprend « la voix » en français, évite une répétition pesante et conserve clairement le même référent.
- source_word: לֹא ... וְלֹא ... וְלֹא
  choice: ne ... pas, ne ... pas et ne ... pas
  rationale: La répétition des négations et la coordination préservent le rythme ternaire de l’hébreu tout en produisant une phrase française naturelle.
theological_decisions:
- issue: Valeur temporelle et aspectuelle des formes inaccomplies dans le portrait du serviteur
  choice: Futur descriptif (« Il ne criera pas… »)
  alternative: Présent habituel (« Il ne crie pas… »)
  rationale: Le contexte programmatique et prospectif d’Ésaïe 42 favorise le futur, tout en décrivant la conduite caractéristique du serviteur. La note maintient ouverte la possibilité d’une lecture habituelle au présent.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé par trois propositions négatives. « Élever la voix » rend l’ellipse hébraïque sans alourdir le texte; le pronom « la » reprend ensuite naturellement « la voix ».
