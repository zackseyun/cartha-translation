  rationale: La révision supprime l’addition implicite créée par la coordination de deux référents géographiques pour un seul mot hébreu. Elle conserve le sens maritime et l’horizon lointain de אִיִּים, sans trancher artificiellement entre « îles » et « côtes ». Le reste du texte et de la note est fidèle, naturel et théologiquement non interprétatif.
