  text: לֹ֤א יִכְהֶה֙ וְ/לֹ֣א יָר֔וּץ עַד יָשִׂ֥ים בָּ/אָ֖רֶץ מִשְׁפָּ֑ט וּ/לְ/תוֹרָת֖/וֹ אִיִּ֥ים יְיַחֵֽילוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/004.yaml
  text: He will not grow dim or be crushed until he establishes justice in the earth[a], and the coastlands will wait for his instruction.
translation:
  language: fr
  text: Il ne faiblira ni ne sera brisé jusqu’à ce qu’il établisse la justice sur la terre. Les régions côtières attendront son enseignement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mettront leur espérance dans son enseignement ». Le verbe hébreu exprime une attente confiante, tournée vers ce que l’on espère.'
    reason: Alternative lexicale préservant la nuance d’attente pleine d’espérance portée par יְיַחֵילוּ.
lexical_decisions:
- source_word: יִכְהֶה
  choice: ne faiblira pas
  rationale: Le verbe כהה évoque le fait de perdre son éclat ou sa vigueur. « Faiblir » est naturel en français et conserve, sans la surcharger, l’idée d’affaiblissement qui fait écho à la mèche du verset précédent.
- source_word: יָרוּץ
  choice: ne sera pas brisé
  rationale: Le verbe רצץ signifie écraser ou briser. « Être brisé » maintient le lien lexical avec le roseau brisé du verset précédent et convient au parallélisme.
- source_word: עַד יָשִׂים
  choice: jusqu’à ce qu’il établisse
  rationale: שׂים signifie littéralement mettre ou placer; avec מִשְׁפָּט, « établir » exprime naturellement la mise en place effective de la justice.
- source_word: בָּאָרֶץ
  choice: sur la terre
  rationale: אֶרֶץ peut désigner un pays ou la terre. La mention parallèle des îles et régions côtières favorise ici une portée géographique universelle.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Dans ce contexte, מִשְׁפָּט désigne l’ordre juste instauré, plutôt qu’un simple verdict judiciaire.
- source_word: לְתוֹרָתוֹ
  choice: son enseignement
  rationale: תּוֹרָה désigne l’instruction ou l’enseignement, et ne se limite pas à un code légal. « Enseignement » est clair en français moderne tout en gardant cette ampleur.
- source_word: אִיִּים
  choice: les îles et les régions côtières
  rationale: Dans les textes prophétiques, אִיִּים peut désigner les îles aussi bien que les territoires maritimes éloignés. La formulation française rend explicitement cette étendue sémantique.
- source_word: יְיַחֵילוּ
  choice: attendront
  rationale: Le verbe יחל exprime une attente orientée par l’espérance. « Attendront » conserve l’action verbale centrale; la nuance d’espoir est signalée en note.
theological_decisions:
- issue: Portée de la mission du serviteur
  choice: Une portée universelle suggérée par « la terre » et les territoires maritimes
  alternative: Le pays d’Israël en premier lieu, avec de possibles prolongements plus larges
  rationale: L’association de בָּאָרֶץ avec אִיִּים ouvre elle-même l’horizon au-delà d’un territoire local, sans imposer au verset des conclusions théologiques ultérieures.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est conservé, ainsi que les échos lexicaux avec le roseau brisé et la mèche faiblissante du verset précédent. La portée de אֶרֶץ et la nuance de יחל restent ouvertes sans interprétation confessionnelle ajoutée.
