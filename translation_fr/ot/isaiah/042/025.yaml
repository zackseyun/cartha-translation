source:
  edition: WLC
  text: וַ/יִּשְׁפֹּ֤ךְ עָלָי/ו֙ חֵמָ֣ה אַפּ֔/וֹ וֶ/עֱז֖וּז מִלְחָמָ֑ה וַ/תְּלַהֲטֵ֤/הוּ מִ/סָּבִיב֙ וְ/לֹ֣א יָדָ֔ע וַ/תִּבְעַר בּ֖/וֹ וְ/לֹא יָשִׂ֥ים עַל לֵֽב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/025.yaml
  text: So he poured out on him the heat of his anger and the might of battle[a]; it set him ablaze all around, but he did not know; it burned in him[d][c][b], but he did not take it to heart.
translation:
  language: fr
  text: Il a donc déversé sur lui[a] l’ardeur de sa colère et la force de la guerre[b]. Cela l’a embrasé de tous côtés, mais il ne s’en est pas rendu compte ; cela a brûlé en lui, mais il ne l’a pas pris à cœur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le singulier « lui/il » désigne Israël, personnifié comme un seul homme.
    reason: cultural_note
  - marker: b
    text: 'Autres traductions possibles : « la violence de la guerre » ou « la fureur du combat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּךְ עָלָיו
  choice: a déversé sur lui
  rationale: « Déverser sur » conserve la métaphore concrète de שׁפך et le pronom masculin singulier du texte hébreu.
- source_word: חֵמָה אַפּוֹ
  choice: l’ardeur de sa colère
  rationale: « Ardeur » exprime la chaleur et l’intensité de חֵמָה tout en préparant naturellement l’image du feu dans la suite du verset.
- source_word: וֶעֱזוּז מִלְחָמָה
  choice: et la force de la guerre
  rationale: עֱזוּז désigne la force puissante ou redoutable. Cette formulation reste proche de l’association nominale hébraïque sans réduire le sens à la seule fureur.
- source_word: וַתְּלַהֲטֵהוּ מִסָּבִיב
  choice: Cela l’a embrasé de tous côtés
  rationale: « Embraser » restitue l’image vive de la flamme, et « de tous côtés » rend clairement מִסָּבִיב.
- source_word: וְלֹא יָדָע
  choice: mais il ne s’en est pas rendu compte
  rationale: Dans ce contexte, ידע indique l’absence de perception ou de prise de conscience du jugement, plutôt qu’un simple manque d’information.
- source_word: וַתִּבְעַר בּוֹ
  choice: cela l’a consumé
  rationale: Le verbe בער évoque un feu qui brûle ou consume. Le complément בּוֹ permet ici une formulation française transitive naturelle, sans préciser indûment si le feu agit « en lui » ou « contre lui ».
- source_word: וְלֹא יָשִׂים עַל לֵב
  choice: mais il ne l’a pas pris à cœur
  rationale: « Prendre à cœur » est l’équivalent idiomatique français de l’expression hébraïque « placer sur le cœur » et garde l’idée de considérer sérieusement ce qui arrive.
theological_decisions:
- issue: Référent des pronoms masculins singuliers
  choice: Maintien de « lui/il » pour représenter Israël comme un peuple personnifié.
  alternative: Employer « eux/ils » afin d’expliciter qu’il s’agit de la collectivité d’Israël.
  rationale: L’hébreu emploie constamment le singulier dans ce passage. Le conserver respecte la personnification prophétique et évite d’aplanir la forme littéraire.
- issue: Sujet des verbes décrivant l’action du feu
  choice: Emploi de « cela » pour désigner globalement ce que Dieu vient de déverser.
  alternative: Faire explicitement de Dieu le sujet de tous les verbes, ou rattacher grammaticalement les verbes à la seule guerre.
  rationale: Le texte passe de l’action divine aux effets de la colère et de la guerre déversées. « Cela » préserve cette transition sans imposer un antécédent plus précis que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé assure une narration naturelle. Les images du déversement, de l’ardeur et du feu sont maintenues, ainsi que le singulier collectif appliqué à Israël.
