  variant: modern international French
source:
  edition: WLC
  text: מִ֤י עִוֵּר֙ כִּ֣י אִם עַבְדִּ֔/י וְ/חֵרֵ֖שׁ כְּ/מַלְאָכִ֣/י אֶשְׁלָ֑ח מִ֤י עִוֵּר֙ כִּ/מְשֻׁלָּ֔ם וְ/עִוֵּ֖ר כְּ/עֶ֥בֶד יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/019.yaml
  text: Who is blind but my servant[a], and deaf like my messenger whom I send? Who is blind like the one who is at peace, and blind like the servant of Yahweh?
translation:
  language: fr
  text: Qui est aveugle, sinon mon serviteur, et sourd comme le messager que j’envoie ? Qui est aveugle comme celui qui est en paix[a], aveugle comme le serviteur de Yahweh ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui est parfait (ou intègre) »; le mot hébreu est difficile et peut évoquer ce qui est complet, entier ou dans une juste relation.
    reason: alternative_reading
lexical_decisions:
- source_word: עִוֵּר
  choice: aveugle
  rationale: Sens courant de l’adjectif hébreu; la répétition est conservée pour maintenir la force rhétorique du verset.
- source_word: חֵרֵשׁ
  choice: sourd
  rationale: Rendu direct et naturel, en parallèle avec « aveugle » dans le reproche prophétique.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: « Serviteur » convient au contexte d’Ésaïe et évite de mettre au premier plan la nuance d’esclavage qui n’est pas déterminante ici.
- source_word: מַלְאָכִי
  choice: mon messager
  rationale: Le parallèle avec « mon serviteur » et la proposition « que j’envoie » favorisent le sens d’un agent mandaté plutôt que celui d’un ange.
- source_word: אֶשְׁלָח
  choice: que j’envoie
  rationale: Le présent français rend naturellement l’imparfait hébreu de première personne sans imposer un accomplissement passé.
- source_word: מְשֻׁלָּם
  choice: celui qui est en paix
  rationale: Le terme, difficile, appartient au champ sémantique de l’intégrité, de l’accomplissement et de la paix. Ce rendu relationnel préserve l’ironie du contexte sans ajouter « avec moi », absent de l’hébreu; d’autres sens possibles sont signalés en note.
- source_word: עֶבֶד יְהוָה
  choice: le serviteur de Yahweh
  rationale: Rendu direct de la construction hébraïque, avec « serviteur » conservé pour la cohérence du vocabulaire du passage.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription explicite du nom divin conformément à l’usage du projet.
- source_word: כִּי אִם
  choice: sinon
  rationale: Dans cette question rhétorique, « sinon » exprime naturellement la valeur exclusive de l’expression hébraïque.
theological_decisions:
- issue: Identité du « serviteur » et du « messager » visés par le reproche
  choice: Ne pas préciser le référent au-delà des désignations du texte.
  alternative: Identifier explicitement le personnage à Israël, au prophète ou à une figure idéale du serviteur.
  rationale: Le verset évoque un serviteur mandaté, mais ne tranche pas lui-même entre ces identifications; la traduction conserve cette tension.
- issue: Sens de מְשֻׁלָּם
  choice: celui qui est en paix
  alternative: celui qui est parfait / intègre; celui qui est accompli; celui qui a reçu sa rétribution
  rationale: La forme hébraïque est difficile et susceptible de plusieurs analyses. Le texte principal retient un sens lié à la paix ou à l’intégrité, tandis que la note préserve les principales possibilités sans résoudre indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative, le parallélisme et la triple répétition d’« aveugle » sont conservés. « Sinon » est plus idiomatique que « si ce n’est » tout en gardant la force exclusive de l’hébreu.
