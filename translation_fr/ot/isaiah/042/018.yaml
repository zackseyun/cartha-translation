  text: הַ/חֵרְשִׁ֖ים שְׁמָ֑עוּ וְ/הַ/עִוְרִ֖ים הַבִּ֥יטוּ לִ/רְאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/018.yaml
  text: Hear[a], you deaf; and look, you blind[b], that you may see.
translation:
  language: fr
  text: Sourds[a], écoutez ! Aveugles[a], regardez afin de voir[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les sourds ... les aveugles ». Les adjectifs hébreux avec l’article peuvent être compris comme une interpellation directe (« sourds », « aveugles ») ou comme des désignations substantivées.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour voir ». L’infinitif final exprime le but : « regardez afin de voir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵרְשִׁים
  choice: Sourds
  rationale: L’adjectif défini pluriel est compris comme un vocatif dans ce contexte. En français, le nom sans article placé en tête rend naturellement l’interpellation directe.
- source_word: שְׁמָעוּ
  choice: écoutez
  rationale: L’impératif pluriel de שׁמע peut signifier « entendre » ou « écouter ». « Écoutez » exprime ici plus naturellement l’ordre prophétique adressé à des sourds, sans supprimer le paradoxe.
- source_word: וְהַעִוְרִים
  choice: Aveugles
  rationale: Le second adjectif défini pluriel est également rendu comme un vocatif, en parallèle avec « Sourds ».
- source_word: הַבִּיטוּ
  choice: regardez
  rationale: L’impératif hiphil de נבט appelle à diriger le regard. « Regardez » est moderne, clair et maintient le parallélisme avec « écoutez ».
- source_word: לִרְאוֹת
  choice: afin de voir
  rationale: L’infinitif précédé de ל indique ici le but, voire le résultat visé. « Afin de voir » conserve cette valeur et le paradoxe délibéré de l’hébreu.
theological_decisions:
- issue: Faut-il interpréter immédiatement la surdité et la cécité comme une insensibilité spirituelle ?
  choice: Conserver les termes concrets « sourds » et « aveugles »
  alternative: Traduire par « insensibles » ou expliciter « spirituellement sourds et aveugles »
  rationale: Le contexte donne probablement à ces handicaps une portée métaphorique, mais l’hébreu maintient l’image sensorielle concrète. La traduction ne doit pas résoudre cette tension à la place du lecteur.
- issue: Les adjectifs définis désignent-ils « les sourds/les aveugles » ou interpellent-ils directement « Sourds/Aveugles » ?
  choice: 'Interpellation directe : « Sourds… Aveugles… »'
  alternative: 'Description substantivée : « Que les sourds… et que les aveugles… »'
  rationale: Les impératifs pluriels et la force de la sommation prophétique favorisent la lecture vocative, tout en reconnaissant que la forme hébraïque peut aussi être comprise substantivement.
translation_notes:
  register: Français international moderne, direct et solennel. Le parallélisme impératif et le paradoxe sensoriel sont conservés. Aucun ajout interprétatif confessionnel.
