  text: מִ֥י בָ/כֶ֖ם יַאֲזִ֣ין זֹ֑את יַקְשִׁ֥ב וְ/יִשְׁמַ֖ע לְ/אָחֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/023.yaml
  text: Who among you will listen to this[a], will pay attention and hear hereafter?
translation:
  language: fr
  text: Qui parmi vous prêtera l’oreille à cela, se montrera attentif et écoutera à l’avenir[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’avenir », « par la suite » ou « après cela ». L’hébreu dit littéralement « vers l’arrière » ou « pour après » ; l’expression est employée ici dans un sens temporel, en vue de ce qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Qui parmi vous
  rationale: La tournure interrogative désigne rhétoriquement une personne au sein du groupe interpellé et se rend naturellement ainsi en français.
- source_word: יַאֲזִין
  choice: prêtera l’oreille
  rationale: Le hiphil de אזן exprime une écoute volontaire et attentive. « Prêter l’oreille » est une expression française actuelle et digne qui maintient la distinction avec les verbes suivants.
- source_word: זֹאת
  choice: à cela
  rationale: Le démonstratif féminin singulier renvoie au message ou à l’avertissement qui vient d’être énoncé.
- source_word: יַקְשִׁב
  choice: sera attentif
  rationale: Le hiphil de קשב souligne l’attention soutenue; ce choix évite de confondre les trois verbes d’écoute du verset.
- source_word: וְיִשְׁמַע
  choice: et écoutera
  rationale: שמע signifie ici entendre ou écouter. « Écoutera » convient au parallélisme sans imposer la nuance possible d’obéissance.
- source_word: לְאָחוֹר
  choice: désormais
  rationale: L’expression signifie littéralement « vers l’arrière / pour après » et prend ici un sens temporel orienté vers ce qui suit. « Désormais » est idiomatique, tout en laissant une note signaler les autres lectures possibles.
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme excessif. La série de trois verbes apparentés est conservée par des formulations distinctes, et l’ambiguïté temporelle de לְאָחוֹר est explicitée en note.
