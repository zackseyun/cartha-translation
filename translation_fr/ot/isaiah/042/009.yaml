  text: הָ/רִֽאשֹׁנ֖וֹת הִנֵּה בָ֑אוּ וַֽ/חֲדָשׁוֹת֙ אֲנִ֣י מַגִּ֔יד בְּ/טֶ֥רֶם תִּצְמַ֖חְנָה אַשְׁמִ֥יע אֶתְ/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/009.yaml
  text: Behold[a], the former things have come to pass, and I declare new things; before they spring up[c][b], I announce them to you.
translation:
  language: fr
  text: Voici, les choses passées se sont accomplies, et j’annonce des choses nouvelles ; avant qu’elles ne germent[a], je vous les fais connaître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe évoque ce qui « germe » ou « pousse », image végétale appliquée à des réalités qui ne sont pas encore apparues.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִאשֹׁנוֹת
  choice: les choses passées
  rationale: L’adjectif pluriel substantivé désigne ce qui précède et s’oppose ici aux « nouvelles » choses. « Les choses passées » est naturel en français et conserve cette opposition sans préciser abusivement s’il s’agit d’événements ou de prédictions.
- source_word: הִנֵּה
  choice: Voici
  rationale: Interjection déictique qui attire solennellement l’attention. « Voici » convient au registre prophétique tout en restant courant et compréhensible.
- source_word: בָּאוּ
  choice: se sont accomplies
  rationale: Le verbe signifie littéralement « sont venues ». Dans le contexte d’annonces divines désormais réalisées, « se sont accomplies » rend naturellement la portée idiomatique, tout en maintenant le thème de l’annonce et de sa réalisation.
- source_word: חֲדָשׁוֹת
  choice: de nouvelles
  rationale: L’adjectif pluriel substantivé est rendu de façon concise, le nom « choses » étant récupérable du premier membre. Cette formulation préserve le parallélisme sans imposer « événements ».
- source_word: מַגִּיד
  choice: j’en annonce
  rationale: Le hiphil de נגד exprime l’action de faire connaître ou d’annoncer. « Annonce » convient à la parole prophétique et permet au pronom « en » de reprendre naturellement « de nouvelles [choses] ».
- source_word: בְּטֶרֶם
  choice: avant que
  rationale: Rend directement la relation temporelle antérieure exprimée par l’hébreu.
- source_word: תִּצְמַחְנָה
  choice: elles ne germent
  rationale: Le verbe évoque littéralement la germination ou la croissance végétale. « Germer » préserve cette image en français naturel ; le « ne » est explétif après « avant que » et ne marque pas une négation.
- source_word: אַשְׁמִיעַ אֶתְכֶם
  choice: je vous les fais entendre
  rationale: Cette formulation conserve la valeur causative du hiphil de שמע, littéralement « je vous fais entendre », tout en explicitant par « les » l’objet contextuel, à savoir les choses nouvelles.
theological_decisions:
- issue: Langage d’accomplissement prophétique
  choice: Le verset oppose des choses antérieures désormais accomplies à de nouvelles choses annoncées avant leur apparition.
  alternative: On peut comprendre plus généralement une opposition entre les actes passés et les actes futurs, sans insister explicitement sur leur prédiction préalable.
  rationale: Le rapprochement entre « se sont accomplies », « j’en annonce » et « avant qu’elles ne germent » soutient l’idée d’annonce préalable et de réalisation, sans qu’il soit nécessaire d’ajouter une formulation doctrinale absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la force prophétique sans archaïsme marqué. Le parallélisme entre les choses passées et les nouvelles est préservé, ainsi que l’image végétale de leur germination.
