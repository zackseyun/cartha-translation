  text: ראית רַבּ֖וֹת וְ/לֹ֣א תִשְׁמֹ֑ר פָּק֥וֹחַ אָזְנַ֖יִם וְ/לֹ֥א יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/020.yaml
  text: You have seen many things[a], but you do not observe; his ears are open, but he does not hear.
translation:
  language: fr
  text: Tu as vu beaucoup de choses[a], mais tu n’y prêtes pas attention ; les oreilles ouvertes, il n’entend pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu passe de la 2e personne (« tu ») dans la première moitié du verset à la 3e personne (« il n’entend pas ») dans la seconde. Certaines traductions uniformisent le tout à la 2e personne (« tes oreilles… tu n’entends pas »).
    reason: alternative_reading
lexical_decisions:
- source_word: ראית
  choice: Tu as vu
  rationale: Le qal accompli à la 2e personne du masculin singulier est rendu par un passé composé, naturel en français et fidèle à l’aspect accompli dans cette interpellation.
- source_word: רַבּוֹת
  choice: beaucoup de choses
  rationale: L’adjectif féminin pluriel est employé substantivement ; cette expression en donne un équivalent français naturel.
- source_word: וְלֹא תִשְׁמֹר
  choice: mais tu n’y prêtes pas attention
  rationale: שׁמר peut signifier garder, veiller ou observer. Ici, après « voir », la formule exprime naturellement le défaut d’attention et de prise en compte, sans répéter le champ lexical de la vue.
- source_word: פָּקוֹחַ אָזְנַיִם
  choice: ses oreilles sont ouvertes
  rationale: Le participe passif ou résultatif décrit l’état des oreilles ; le français exige ici une proposition verbale. Le possessif rend la construction idiomatique tout en préparant le verbe à la 3e personne.
- source_word: וְלֹא יִשְׁמָע
  choice: mais il n’entend pas
  rationale: Le qal inaccompli à la 3e personne du masculin singulier est rendu au présent dans cette dénonciation. « Entendre » maintient l’image sensorielle sans interpréter le verbe comme une volonté de ne pas écouter.
theological_decisions:
- issue: Changement de personne grammaticale dans le verset
  choice: Conserver le passage de la 2e personne (« tu ») à la 3e personne (« ses… il »).
  alternative: Uniformiser le verset à la 2e personne (« tes oreilles… tu n’entends pas ») ou à la 3e personne.
  rationale: Le texte massorétique opère réellement ce changement. Le conserver respecte sa tension rhétorique sans la résoudre par harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète l’adresse hébraïque au masculin singulier. « Prêter attention » privilégie l’intelligibilité contextuelle tout en restant dans l’étendue sémantique de שׁמר.
