  source_fidelity: Le rendu conserve bien l’accompli initial (« Tu as vu »), l’idée de nombreuses réalités vues, le défaut d’attention exprimé par שׁמר, ainsi que l’inaccompli final à la 3e personne (« il n’entend pas »). Toutefois, le texte hébreu ne porte pas de suffixe possessif à « oreilles » ; « ses oreilles » est une explicitation française possible, mais évitable. La note doit surtout localiser le changement de personne dans le verbe final, plutôt que de l’attribuer à un possessif absent de l’hébreu.
  naturalness: « Tu as vu beaucoup de choses, mais tu n’y prêtes pas attention » est naturel en français international moderne. « Les oreilles ouvertes, il n’entend pas » est concis, idiomatique dans un registre biblique moderne et conserve mieux la formulation nominale hébraïque qu’un possessif explicité.
  terminology: « Prêter attention » rend de manière contextuellement juste la nuance de vigilance/observation de שׁמר sans répétition artificielle de « voir ». « Entendre » maintient le parallélisme sensoriel de שמע. Le changement de personne est préservé sans harmonisation doctrinale ou interprétative.
