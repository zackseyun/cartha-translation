id: ISA.42.6
reference: Isaiah 42:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֧י יְהוָ֛ה קְרָאתִ֥י/ךָֽ בְ/צֶ֖דֶק וְ/אַחְזֵ֣ק בְּ/יָדֶ֑/ךָ וְ/אֶצָּרְ/ךָ֗ וְ/אֶתֶּנְ/ךָ֛ לִ/בְרִ֥ית עָ֖ם לְ/א֥וֹר גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/006.yaml
  text: I am Yahweh[a]; I have called you in righteousness, and I will take hold of your hand; I will keep you and give you as a covenant for the people[c][b], as a light for the nations.
translation:
  language: fr
  text: Moi, Yahweh, je t’ai appelé selon la justice[a] ; je te prendrai par la main, je te garderai et je ferai de toi une alliance pour le peuple[b], une lumière pour les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « selon la droiture ». Le mot hébreu peut désigner la justice, la droiture ou ce qui est juste.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour un peuple ». L’hébreu n’emploie pas l’article, mais le contexte peut désigner le peuple d’Israël.
    reason: textual_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans l’hébreu.
- source_word: קְרָאתִיךָ
  choice: je t’ai appelé
  rationale: Le parfait hébreu présente l’appel comme un acte accompli ; le passé composé est naturel en français et convient au contexte de mission.
- source_word: בְצֶדֶק
  choice: selon la justice
  rationale: Cette formulation française naturelle conserve la valeur nominale de צֶדֶק et exprime que l’appel est conforme à la justice de Yahweh, sans réduire le terme à une seule nuance morale ou judiciaire.
- source_word: וְאַחְזֵק בְּיָדֶךָ
  choice: je te prendrai par la main
  rationale: La tournure garde l’image concrète du geste de soutien exprimé par le hiphil de חזק avec « main », tout en restant idiomatique en français moderne.
- source_word: וְאֶצָּרְךָ
  choice: je te garderai
  rationale: נצר signifie garder, protéger ou préserver. « Je te garderai » demeure concis, proche de l’hébreu et compréhensible dans ce contexte protecteur.
- source_word: וְאֶתֶּנְךָ
  choice: je ferai de toi
  rationale: Bien que נתן signifie littéralement « donner », « faire de toi » exprime naturellement en français l’attribution d’une fonction, sans modifier le contenu des compléments qui suivent.
- source_word: לִבְרִית עָם
  choice: une alliance pour le peuple
  rationale: La formulation conserve l’identification frappante du serviteur lui-même à une alliance, au lieu de l’expliciter comme simple médiateur. « Le peuple » rend la référence collective probablement définie dans le contraste avec les nations.
- source_word: לְאוֹר גּוֹיִם
  choice: une lumière pour les nations
  rationale: « Lumière » traduit directement אוֹר et « nations » restitue גּוֹיִם sans lui donner d’emblée le sens plus technique de « non-Juifs ».
theological_decisions:
- issue: Le serviteur donné comme alliance
  choice: Conserver « je ferai de toi une alliance pour le peuple ».
  alternative: « Je ferai de toi le médiateur d’une alliance pour le peuple. »
  rationale: L’hébreu présente directement la personne interpellée comme alliance. L’explication par la médiation serait possible sur le plan interprétatif, mais réduirait la tension et la richesse théologiques du texte.
- issue: Le contraste entre עָם et גּוֹיִם
  choice: « le peuple » et « les nations »
  alternative: « un peuple » et « les non-Juifs »
  rationale: Ce choix préserve le contraste poétique vraisemblable entre Israël et l’ensemble des nations sans imposer une terminologie doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe poétique est conservée sans archaïsmes. « Moi, Yahweh » rend l’emphase du pronom hébreu initial ; les futurs maintiennent la suite des engagements divins.
