  text: יְהוָ֥ה חָפֵ֖ץ לְמַ֣עַן צִדְק֑/וֹ יַגְדִּ֥יל תּוֹרָ֖ה וְ/יַאְדִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/021.yaml
  text: Yahweh was pleased[a], for the sake of his righteousness[c][b], to make the law great and glorious.
translation:
  language: fr
  text: Yahweh a pris plaisir, pour l’amour de sa justice[a], à rendre la loi[b] grande et à la rendre glorieuse[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sa droiture ». L’hébreu peut exprimer le motif ou le but : « en raison de sa justice » ou « afin de manifester sa justice ».'
    reason: alternative_reading
  - marker: b
    text: Hébreu torah, qui peut aussi signifier « instruction » ou « enseignement ».
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « à rendre grande la loi et à la rendre majestueuse ».'
    reason: formal_equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel révélé dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: חָפֵץ
  choice: a voulu
  rationale: Le verbe exprime ici la volonté favorable de Yahweh. « A voulu » est naturel en français et conserve la nuance volitive sans imposer l’idée plus affective de plaisir.
- source_word: לְמַעַן
  choice: à cause de
  rationale: La préposition peut exprimer le motif ou le but. Dans cette construction, « à cause de sa justice » rend naturellement le motif, tout en laissant subsister une certaine souplesse sémantique.
- source_word: צִדְקוֹ
  choice: sa justice
  rationale: צדק peut désigner la justice, la droiture ou la juste conduite. « Sa justice » convient au contexte et rapporte clairement le motif à Yahweh sans réduire le terme à une décision judiciaire particulière.
- source_word: יַגְדִּיל
  choice: rendre grande
  rationale: 'Le hiphil de גדל est causatif : faire devenir grand, magnifier. « Rendre grande » en restitue directement la valeur.'
- source_word: תּוֹרָה
  choice: la loi
  rationale: « Loi » conserve ici la portée reconnue de תּוֹרָה, tandis que les sens plus larges d’enseignement et d’instruction sont signalés en note.
- source_word: וְיַאְדִּיר
  choice: et magnifique
  rationale: Le hiphil exprime le fait de rendre majestueux ou magnifique. La coordination elliptique « grande et magnifique » est idiomatique en français; la forme verbale pleinement explicite est donnée en note.
theological_decisions:
- issue: Sens de צִדְקוֹ comme motif de l’action de Yahweh
  choice: sa justice
  alternative: sa droiture
  rationale: « Justice » préserve la dimension morale et juste du terme sans la limiter strictement au domaine judiciaire. « Droiture » reste une possibilité lexicale réelle, indiquée en note.
- issue: Rapport logique exprimé par לְמַעַן
  choice: à cause de sa justice
  alternative: pour sa justice / afin de manifester sa justice
  rationale: Le contexte permet de comprendre l’expression comme motif ou finalité. Le texte principal retient le motif, plus naturel en français, sans développer une finalité théologique qui n’est pas explicitée dans l’hébreu.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et suit l’ordre logique de l’hébreu. « A voulu » évite une tournure affective excessive, tandis que « grande et magnifique » restitue naturellement les deux verbes causatifs.
