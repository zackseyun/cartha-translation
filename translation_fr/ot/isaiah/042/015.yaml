id: ISA.42.15
reference: Isaiah 42:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַחֲרִ֤יב הָרִים֙ וּ/גְבָע֔וֹת וְ/כָל עֶשְׂבָּ֖/ם אוֹבִ֑ישׁ וְ/שַׂמְתִּ֤י נְהָרוֹת֙ לָֽ/אִיִּ֔ים וַ/אֲגַמִּ֖ים אוֹבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/015.yaml
  text: I will lay waste mountains and hills[a], and I will dry up all their vegetation; I will turn rivers into islands, and I will dry up pools.
translation:
  language: fr
  text: Je dévasterai les montagnes et les collines, et je dessécherai toute leur végétation ; je changerai les fleuves en îles[a], et je dessécherai les étangs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terres côtières » ; le terme hébreu peut désigner des îles ou des régions maritimes.
    reason: Alternative lexicale attestée pour אִיִּים.
lexical_decisions:
- source_word: אַחֲרִיב
  choice: Je dévasterai
  rationale: Le hifil de חרב exprime l’action de rendre désert ou dévasté. « Dévaster » conserve la force causative et le ton de jugement sans impliquer nécessairement une destruction absolue.
- source_word: הָרִים וּגְבָעוֹת
  choice: les montagnes et les collines
  rationale: Ces termes désignent naturellement les montagnes et les collines ; « hauts lieux » introduirait ici une nuance cultuelle absente du texte.
- source_word: וְכָל עֶשְׂבָּם
  choice: toute leur végétation
  rationale: עֵשֶׂב peut désigner l’herbe ou, plus largement, la végétation. Le suffixe renvoie collectivement aux montagnes et aux collines.
- source_word: אוֹבִישׁ
  choice: je dessécherai
  rationale: Le hifil de יבש signifie « rendre sec ». Le même choix est maintenu pour la végétation et les eaux afin de préserver la répétition hébraïque.
- source_word: וְשַׂמְתִּי
  choice: je changerai
  rationale: Dans cette construction où un objet reçoit un nouvel état, שׂים a le sens de « faire devenir » ; « changer en » est naturel en français.
- source_word: נְהָרוֹת
  choice: les fleuves
  rationale: נָהָר désigne normalement un fleuve ou une grande rivière. « Fleuves » garde ici la puissance de l’image.
- source_word: לָאִיִּים
  choice: en îles
  rationale: אִי peut désigner une île ou une terre maritime. « Îles » en est le rendu lexical direct, tandis que l’autre sens est signalé en note.
- source_word: וַאֲגַמִּים
  choice: les étangs
  rationale: אֲגַמִּים désigne des étendues d’eau stagnante, des étangs ou des marais. « Étangs » convient au parallélisme avec les fleuves.
theological_decisions:
- issue: L’image du jugement divin exercé sur la création
  choice: Conserver la déclaration concrète de dévastation du relief, de la végétation et des eaux.
  alternative: Reformuler l’ensemble comme une simple métaphore de la suppression des obstacles.
  rationale: L’hébreu emploie des images environnementales concrètes. La traduction ne doit pas décider si leur portée est exclusivement figurée, historique ou cosmique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition de « je » devant les quatre verbes est conservée pour refléter l’insistance rhétorique des formes verbales hébraïques à la première personne.
