source:
  edition: WLC
  text: וְ/הוֹלַכְתִּ֣י עִוְרִ֗ים בְּ/דֶ֨רֶךְ֙ לֹ֣א יָדָ֔עוּ בִּ/נְתִיב֥וֹת לֹֽא יָדְע֖וּ אַדְרִיכֵ֑/ם אָשִׂים֩ מַחְשָׁ֨ךְ לִ/פְנֵי/הֶ֜ם לָ/א֗וֹר וּ/מַֽעֲקַשִּׁים֙ לְ/מִישׁ֔וֹר אֵ֚לֶּה הַ/דְּבָרִ֔ים עֲשִׂיתִ֖/ם וְ/לֹ֥א עֲזַבְתִּֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/016.yaml
  text: And I will lead the blind by a way they have not known; on paths they have not known I will guide them. I will make the darkness before them into light[a], and the crooked places into level ground. These are the things I have done, and I have not forsaken them.
translation:
  language: fr
  text: Je conduirai les aveugles par un chemin qu’ils ne connaissent pas ; je les guiderai sur des sentiers qu’ils ne connaissent pas. Devant eux, je changerai les ténèbres en lumière et les passages tortueux en terrain plat. Voilà ce que j’ai accompli, et je ne les ai pas abandonnés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voilà ce que je ferai, et je ne les abandonnerai pas. » L’hébreu emploie ici des verbes à l’accompli, qui peuvent désigner une action achevée ou exprimer la certitude prophétique de ce que Dieu promet de faire.'
    reason: Lecture temporelle alternative des formes verbales hébraïques.
lexical_decisions:
- source_word: וְהוֹלַכְתִּי
  choice: Je conduirai
  rationale: Le hiphil de הלך exprime l’action de faire aller ou de mener. « Conduire » rend naturellement l’idée d’une direction assurée par Dieu.
- source_word: עִוְרִים
  choice: les aveugles
  rationale: L’adjectif masculin pluriel est employé comme substantif. La formulation conserve l’image concrète sans décider si sa portée est uniquement physique ou aussi métaphorique.
- source_word: בְּדֶרֶךְ לֹא יָדָעוּ
  choice: par un chemin qu’ils ne connaissent pas
  rationale: דרך désigne ici une voie à parcourir. « Par un chemin » est idiomatique en français, tandis que le présent « ne connaissent pas » exprime leur absence actuelle de familiarité avec cette voie.
- source_word: בִּנְתִיבוֹת
  choice: sur des sentiers
  rationale: נתיבות est un pluriel poétique désignant des pistes ou des sentiers. « Sur » convient au déplacement et maintient le parallélisme avec le chemin.
- source_word: אַדְרִיכֵם
  choice: je les guiderai
  rationale: Le hiphil de דרך signifie faire cheminer, diriger ou guider. « Guider » évite de répéter « conduire » tout en conservant la direction intentionnelle.
- source_word: מַחְשָׁךְ לִפְנֵיהֶם לָאוֹר
  choice: Devant eux, je changerai les ténèbres en lumière
  rationale: La tournure française rend explicitement la transformation indiquée par שים et le lamed de résultat, tout en conservant la position spatiale de לִפְנֵיהֶם.
- source_word: וּמַעֲקַשִּׁים לְמִישׁוֹר
  choice: les passages tortueux en terrain plat
  rationale: מַעֲקַשִּׁים évoque ce qui est tortueux ou difficile à parcourir, et מִישׁוֹר un espace uni ou plat. « Passages » maintient l’image du trajet sans réduire le terme à une abstraction morale.
- source_word: אֵלֶּה הַדְּבָרִים עֲשִׂיתִם
  choice: Voilà ce que j’ai accompli
  rationale: Cette formulation française naturelle représente le démonstratif et le verbe à l’accompli sans imposer au texte principal une lecture strictement future.
- source_word: וְלֹא עֲזַבְתִּים
  choice: et je ne les ai pas abandonnés
  rationale: Le suffixe masculin pluriel renvoie naturellement aux aveugles. Le passé composé conserve la forme accomplie hébraïque et son contraste avec les promesses futures du début du verset.
theological_decisions:
- issue: Valeur temporelle des deux formes accomplies à la fin du verset
  choice: 'Conserver dans le texte principal l’aspect accompli : « j’ai accompli… je ne les ai pas abandonnés »'
  alternative: « Voilà ce que je ferai, et je ne les abandonnerai pas »
  rationale: Le verset commence par des formes nettement prospectives, puis passe à des verbes à l’accompli. Le texte principal préserve ce changement rhétorique, qui peut présenter l’action promise comme certaine ou déjà accomplie, tandis que la note signale clairement la lecture future possible.
- issue: Portée de l’image des aveugles
  choice: Maintenir simplement « les aveugles »
  alternative: Expliciter « ceux qui sont spirituellement aveugles »
  rationale: Le terme source ne précise pas ici si l’aveuglement est physique, métaphorique ou les deux. La traduction conserve donc l’ambiguïté sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par « chemin / sentiers » et « ténèbres / lumière ». « Passages tortueux » reste concret et lié au déplacement ; « terrain plat » rend l’image d’une voie devenue praticable.
