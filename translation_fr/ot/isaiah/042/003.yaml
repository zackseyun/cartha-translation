  text: קָנֶ֤ה רָצוּץ֙ לֹ֣א יִשְׁבּ֔וֹר וּ/פִשְׁתָּ֥ה כֵהָ֖ה לֹ֣א יְכַבֶּ֑/נָּה לֶ/אֱמֶ֖ת יוֹצִ֥יא מִשְׁפָּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/003.yaml
  text: A bruised reed he will not break[a], and a dimly burning wick he will not extinguish[b]; he will faithfully bring forth justice.
translation:
  language: fr
  text: Il ne brisera pas le roseau meurtri, et il n’éteindra pas la mèche qui faiblit ; avec fidélité[a], il fera paraître le droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en vérité, il fera paraître le droit » ; l’hébreu peut aussi se comprendre ainsi.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנֶה רָצוּץ
  choice: le roseau meurtri
  rationale: קָנֶה désigne couramment un roseau, et רָצוּץ le présente comme endommagé ou écrasé. « Meurtri » conserve l’image d’une extrême fragilité sans laisser entendre que le roseau est déjà entièrement brisé.
- source_word: לֹא יִשְׁבּוֹר
  choice: il ne brisera pas
  rationale: L’imparfait décrit ici l’action caractéristique à venir du serviteur. Le futur français convient au portrait prophétique.
- source_word: פִשְׁתָּה כֵהָה
  choice: la mèche qui faiblit
  rationale: פִשְׁתָּה signifie littéralement « lin », mais, avec כֵהָה et le verbe « éteindre », il s’agit vraisemblablement d’une mèche de lampe en lin. « Qui faiblit » rend son état presque éteint sans imposer l’image plus précise d’une mèche fumante.
- source_word: לֹא יְכַבֶּנָּה
  choice: il n’éteindra pas
  rationale: Le verbe כבה signifie éteindre ou étouffer une flamme. « Éteindre » est naturel en français et maintient clairement l’image de la lampe.
- source_word: לֶאֱמֶת
  choice: avec fidélité
  rationale: אֱמֶת peut exprimer la vérité, la fidélité ou la fiabilité. « Avec fidélité » rend naturellement sa valeur adverbiale tout en préservant l’idée que l’action du serviteur est sûre et authentique.
- source_word: יוֹצִיא מִשְׁפָּט
  choice: il fera triompher la justice
  rationale: Le hiphil de יצא signifie littéralement « faire sortir, faire paraître ». Avec מִשְׁפָּט, l’expression indique que le serviteur fera advenir ou prévaloir la justice. « Fera triompher » est idiomatique et exprime cette efficacité sans réduire מִשְׁפָּט à un simple verdict judiciaire.
theological_decisions:
- issue: Portée des images du roseau et de la mèche
  choice: Conserver les métaphores concrètes sans les expliquer comme désignant explicitement les faibles.
  alternative: Un faible, il ne l’écrasera pas, et celui qui défaille, il ne l’anéantira pas.
  rationale: L’hébreu laisse les images ouvertes. Les préserver maintient leur force poétique et évite d’inscrire une interprétation particulière dans le texte.
- issue: Sens de לֶאֱמֶת
  choice: avec fidélité
  alternative: en vérité
  rationale: Le syntagme peut décrire soit la fidélité avec laquelle le serviteur agit, soit la conformité de son œuvre à la vérité. Le texte principal retient la première nuance, naturelle dans ce contexte, tandis que la note garde visible l’autre possibilité.
- issue: Force de יוֹצִיא מִשְׁפָּט
  choice: il fera triompher la justice
  alternative: il fera paraître le droit
  rationale: מִשְׁפָּט peut désigner le droit, le jugement ou la justice. Ici, le contexte du serviteur favorise l’établissement effectif d’un ordre juste, sans exclure les résonances judiciaires du terme.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme hébreu est conservé, ainsi que les deux images concrètes. « Mèche qui faiblit » évite un archaïsme tout en restant sobre. La note signale l’ambiguïté réelle de לֶאֱמֶת et la nuance plus littérale de יוֹצִיא מִשְׁפָּט.
