id: ISA.42.13
reference: Isaiah 42:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יְהוָה֙ כַּ/גִּבּ֣וֹר יֵצֵ֔א כְּ/אִ֥ישׁ מִלְחָמ֖וֹת יָעִ֣יר קִנְאָ֑ה יָרִ֨יעַ֙ אַף יַצְרִ֔יחַ עַל אֹיְבָ֖י/ו יִתְגַּבָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/013.yaml
  text: Yahweh goes out like a mighty warrior[a]; like a man of war he stirs up zeal. He shouts, yes, he raises a battle cry[c][b]; over his enemies he shows himself mighty.
translation:
  language: fr
  text: Yahvé sort comme un puissant guerrier ; comme un homme de guerre[c], il éveille son ardeur[a]. Il pousse un cri, oui, il lance un cri de guerre ; contre ses ennemis, il se montre puissant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il éveille sa jalousie ». Le mot hébreu קִנְאָה peut désigner l’ardeur ou la jalousie, notamment dans le cadre de l’alliance.
    reason: lexical_alternative
  - marker: b
    text: Ou « il l’emporte sur ses ennemis ». La dernière proposition peut être rendue plus dynamiquement pour souligner la victoire.
    reason: lexical_alternative
  - marker: c
    text: Littéralement « comme un homme de guerres », c’est-à-dire un guerrier expérimenté au combat.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: La forme française courante « Yahvé » rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: כַּגִּבּוֹר
  choice: comme un puissant guerrier
  rationale: גִּבּוֹר désigne ici un homme fort ou un guerrier valeureux ; le contexte militaire appelle « puissant guerrier ».
- source_word: יֵצֵא
  choice: sort
  rationale: Le verbe signifie littéralement « sortir ». Cette formulation conserve l’image sans ajouter l’idée plus précise de marcher au combat.
- source_word: כְּאִישׁ מִלְחָמוֹת
  choice: comme un homme de guerre
  rationale: Cette expression naturelle en français conserve le nom masculin אִישׁ et le parallélisme guerrier ; une note signale le pluriel littéral de מִלְחָמוֹת.
- source_word: יָעִיר קִנְאָה
  choice: il éveille son ardeur
  rationale: Le verbe exprime la mise en mouvement, et קִנְאָה peut désigner l’ardeur zélée ou la jalousie. « Son ardeur » est idiomatique sans supprimer l’autre possibilité, donnée en note.
- source_word: יָרִיעַ
  choice: Il pousse un cri
  rationale: Le verbe désigne l’émission d’un cri puissant, souvent guerrier ; la formulation reste sobre et laisse le contexte en préciser la nature.
- source_word: אַף
  choice: oui
  rationale: Ici, אַף renforce la progression entre les deux verbes ; « oui » reproduit naturellement cette insistance.
- source_word: יַצְרִיחַ
  choice: il lance un cri de guerre
  rationale: Le verbe exprime un cri retentissant. Dans l’environnement explicitement militaire du verset, « cri de guerre » en communique naturellement la force.
- source_word: עַל אֹיְבָיו
  choice: contre ses ennemis
  rationale: עַל peut signifier « contre » ou « sur ». Avec le verbe suivant, « contre » exprime clairement l’affrontement sans décider à lui seul de son résultat.
- source_word: יִתְגַּבָּר
  choice: il se montre puissant
  rationale: Le hitpael de גבר peut signifier se montrer fort ou l’emporter. Cette traduction conserve la nuance réflexive et fait écho à גִּבּוֹר au début du verset.
theological_decisions:
- issue: Maintien de l’image de Yahvé comme guerrier
  choice: Conserver pleinement le langage militaire
  alternative: Atténuer l’image en parlant seulement de force ou d’intervention
  rationale: 'Le texte hébreu accumule les images de guerre : guerrier, homme de guerre, cris et puissance contre les ennemis. Les atténuer effacerait une tension voulue du passage.'
- issue: Sens de קִנְאָה appliqué à Dieu
  choice: ardeur
  alternative: jalousie
  rationale: « Ardeur » rend ici l’engagement intense et actif de Yahvé sans suggérer spontanément une envie mesquine. Comme « jalousie » demeure possible, elle est conservée en note.
- issue: Nuance de victoire dans יִתְגַּבָּר
  choice: il se montre puissant
  alternative: il l’emporte
  rationale: Le choix principal préserve la forme réflexive et l’écho lexical avec « puissant guerrier », tandis que la note donne la lecture plus dynamique de victoire.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe poétique et le parallélisme sont maintenus sans calque maladroit ; le vocabulaire martial du texte hébreu n’est pas adouci. Les marqueurs de notes sont placés auprès des expressions qu’ils expliquent.
