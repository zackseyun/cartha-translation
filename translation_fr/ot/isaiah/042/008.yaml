id: ISA.42.8
reference: Isaiah 42:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲנִ֥י יְהוָ֖ה ה֣וּא שְׁמִ֑/י וּ/כְבוֹדִ/י֙ לְ/אַחֵ֣ר לֹֽא אֶתֵּ֔ן וּ/תְהִלָּתִ֖/י לַ/פְּסִילִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/008.yaml
  text: I am Yahweh; that is my name. I will not give my glory to another[a], nor my praise to idols.
translation:
  language: fr
  text: Je suis Yahweh — tel est mon nom. Je ne donnerai pas ma gloire à un autre, ni ma louange aux idoles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux images taillées ». Le terme hébreu désigne précisément des images sculptées ou façonnées, qui sont ici des idoles.
    reason: alternative lexicale
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittère le nom divin personnel plutôt que de lui substituer un titre.
- source_word: הוּא שְׁמִי
  choice: tel est mon nom
  rationale: Rend de façon naturelle en français la valeur identificatrice et emphatique du pronom הוּא.
- source_word: כְבוֹדִי
  choice: ma gloire
  rationale: Préserve le terme théologique et poétique courant, qui peut aussi évoquer l’honneur.
- source_word: לְאַחֵר
  choice: à un autre
  rationale: Conserve la formulation concise et indéterminée de l’hébreu sans préciser abusivement le référent.
- source_word: אֶתֵּן
  choice: je ne donnerai pas
  rationale: Le yiqtol exprime ici la résolution ferme de Yahweh; le futur français convient à cette déclaration.
- source_word: תְהִלָּתִי
  choice: ma louange
  rationale: Suit la formulation compacte de l’hébreu sans développer explicitement « la louange qui m’est due ».
- source_word: לַפְּסִילִים
  choice: aux idoles
  rationale: Communique clairement le référent en français moderne, tandis que la note conserve le sens concret d’images taillées ou façonnées.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme comme nom propre; « Yahweh » en préserve la fonction et l’identité personnelle.
- issue: Sens de « ma louange »
  choice: Conserver « ma louange »
  alternative: la louange qui m’est due
  rationale: La formulation brève respecte la poésie hébraïque et n’explicite pas au-delà du texte le rapport entre Dieu et la louange.
- issue: Référent de פְּסִילִים
  choice: idoles dans le texte, avec « images taillées » en note
  alternative: images taillées
  rationale: « Idoles » exprime naturellement la fonction cultuelle dans le contexte, tandis que la note signale la composante matérielle propre au mot hébreu.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le tiret met en relief l’identification du nom divin; le parallélisme « ma gloire… ma louange » est conservé.
