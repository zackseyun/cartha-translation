source:
  edition: WLC
  text: נָסֹ֤גוּ אָחוֹר֙ יֵבֹ֣שׁוּ בֹ֔שֶׁת הַ/בֹּטְחִ֖ים בַּ/פָּ֑סֶל הָ/אֹמְרִ֥ים לְ/מַסֵּכָ֖ה אַתֶּ֥ם אֱלֹהֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/017.yaml
  text: They will be turned back[a]; they will be utterly put to shame—those who trust in an idol, who say to a cast image[d][c][b], “You are our gods.”
translation:
  language: fr
  text: 'Ils reculeront[a], ils seront couverts de honte[b], ceux qui mettent leur confiance dans une idole et qui disent à une statue de métal fondu[c] : « Vous êtes nos dieux[d] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seront repoussés en arrière » ; le verbe hébreu peut évoquer aussi bien le recul que le fait d’être refoulé.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « ils auront honte de honte », tournure emphatique exprimant une honte extrême.
    reason: lexical_alternative
  - marker: c
    text: Le premier terme peut aussi se traduire par « image taillée » et le second par « image coulée ». L’hébreu emploie deux mots distincts pour des objets de culte fabriqués.
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu porte le pluriel : « Vous êtes nos dieux. » Certaines traductions lissent la formulation au singulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָסֹגוּ אָחוֹר
  choice: Ils reculeront
  rationale: Le verbe נסג avec אָחוֹר exprime un mouvement en arrière, volontaire ou imposé. Le futur convient à l’annonce de jugement dans le contexte, tout en laissant ouverte la nuance entre retraite et refoulement.
- source_word: יֵבֹשׁוּ בֹשֶׁת
  choice: ils seront couverts de honte
  rationale: La construction associe le verbe בוש à un nom de même racine pour renforcer fortement l’idée de honte. Cette tournure française rend l’intensité sans reproduire littéralement une construction peu naturelle.
- source_word: הַבֹּטְחִים בַּפָּסֶל
  choice: ceux qui mettent leur confiance dans une idole
  rationale: Le participe substantivé désigne ceux que caractérise cette confiance. « Idole » exprime clairement la fonction cultuelle de פֶּסֶל, terme qui peut aussi désigner une image taillée.
- source_word: הָאֹמְרִים לְמַסֵּכָה
  choice: qui disent à une statue de métal fondu
  rationale: מַסֵּכָה désigne une image fabriquée par fonte. « Statue de métal fondu » est naturel en français et conserve la nuance du procédé de fabrication.
- source_word: אַתֶּם אֱלֹהֵינוּ
  choice: Vous êtes nos dieux
  rationale: Le pronom אַתֶּם et le nom אֱלֹהֵינוּ sont tous deux au pluriel. La traduction conserve ce nombre plutôt que de le ramener au singulier.
theological_decisions:
- issue: Distinction entre פֶּסֶל et מַסֵּכָה
  choice: Les rendre respectivement par « idole » et « statue de métal fondu »
  alternative: « image taillée » et « statue de métal fondu », ou simplement « idole » dans les deux cas
  rationale: Le texte emploie deux termes distincts pour des objets cultuels fabriqués. La formulation retenue maintient leur distinction tout en exprimant clairement la portée idolâtre du premier.
- issue: Nombre grammatical dans אַתֶּם אֱלֹהֵינוּ
  choice: 'Conserver le pluriel : « Vous êtes nos dieux »'
  alternative: 'Lisser au singulier : « Tu es notre dieu »'
  rationale: Les formes hébraïques sont explicitement plurielles. Les conserver évite de résoudre artificiellement la tension créée par une parole adressée à une statue au moyen du pluriel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme accusateur du verset. Le pluriel dans la citation et l’ambiguïté du mouvement de recul sont maintenus, avec des notes explicatives.
