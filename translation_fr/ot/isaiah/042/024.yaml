id: ISA.42.24
reference: Isaiah 42:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִֽי נָתַ֨ן ל/משוסה יַעֲקֹ֛ב וְ/יִשְׂרָאֵ֥ל לְ/בֹזְזִ֖ים הֲ/ל֣וֹא יְהוָ֑ה ז֚וּ חָטָ֣אנוּ ל֔/וֹ וְ/לֹֽא אָב֤וּ בִ/דְרָכָי/ו֙ הָל֔וֹךְ וְ/לֹ֥א שָׁמְע֖וּ בְּ/תוֹרָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/024.yaml
  text: Who gave Jacob over to plunder[a], and Israel to looters? Was it not Yahweh, he against whom we have sinned? They were not willing to walk in his ways[b], and they did not listen to his law.
translation:
  language: fr
  text: Qui a livré Jacob au pillage[a] et Israël aux pillards ? N’est-ce pas Yahweh, celui contre qui nous avons péché ? Ils n’ont pas voulu marcher dans ses voies et ils n’ont pas écouté sa loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu associe ici « au pillage » et « aux pillards » : Jacob et Israël sont présentés comme livrés à ceux qui les dépouillent.'
    reason: lexical_alternative
  - marker: b
    text: Ou « son instruction » (hébreu torah).
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/משוסה
  choice: au pillage
  rationale: Le nom désigne l’état de celui qui est livré comme butin ou exposé au pillage. « Livré… au pillage » est naturel en français et conserve l’image de Jacob abandonné aux déprédations.
- source_word: לְ/בֹזְזִים
  choice: aux pillards
  rationale: Le participe substantivé de בזז désigne ceux qui s’emparent du butin. « Pillards » exprime clairement ces agents hostiles et répond au parallèle « pillage ».
- source_word: הֲ/לֹא יְהוָה
  choice: N’est-ce pas Yahweh
  rationale: La question rhétorique appelle une réponse affirmative. Le nom divin est translittéré « Yahweh » afin de représenter directement le tétragramme.
- source_word: זוּ
  choice: lui contre qui
  rationale: זוּ introduit ici la proposition relative et porte une certaine insistance. « Lui contre qui » conserve cette mise en relief tout en rendant idiomatiquement חטא ל, « pécher contre ».
- source_word: חָטָאנוּ ל/וֹ
  choice: nous avons péché
  rationale: Le passé composé exprime naturellement en français l’acte passé ayant une pertinence présente; le complément « contre qui » rend la relation marquée par ל.
- source_word: וְ/לֹא אָבוּ
  choice: Ils n’ont pas voulu
  rationale: אבה exprime la volonté ou le refus. Cette formulation reste proche du verbe sans renforcer inutilement le sens par « ils ont refusé ».
- source_word: בִ/דְרָכָי/ו הָלוֹךְ
  choice: marcher dans ses voies
  rationale: L’expression hébraïque décrit la conduite. La métaphore de la marche demeure intelligible et digne en français biblique moderne.
- source_word: בְּ/תוֹרָת/וֹ
  choice: sa loi
  rationale: תּוֹרָה peut désigner la loi ou, plus largement, l’instruction. « Sa loi » convient au contexte d’alliance, tandis que l’autre nuance est signalée en note.
- source_word: שָׁמְעוּ
  choice: ils n’ont pas écouté
  rationale: שׁמע peut impliquer l’obéissance, mais « écouter » conserve le sens lexical premier et laisse au contexte l’implication de désobéissance.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Jacob… Israël
  rationale: Les deux noms sont conservés pour respecter le parallélisme poétique et l’identité d’alliance du peuple.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Passage de la première personne (« nous avons péché ») à la troisième personne (« ils n’ont pas voulu… »)
  choice: Conserver le changement de personne du texte hébreu
  alternative: Harmoniser toutes les propositions à la première personne du pluriel
  rationale: Le changement abrupt appartient au texte source et peut porter une tension rhétorique entre confession collective et description du peuple; il ne doit pas être supprimé.
- issue: Portée de תּוֹרָה
  choice: sa loi
  alternative: son instruction; son enseignement
  rationale: Dans ce contexte prophétique et lié à l’alliance, « loi » est une traduction solide, mais le champ sémantique plus large de תּוֹרָה est maintenu en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme Jacob/Israël, la question rhétorique, l’insistance de זוּ par « lui », ainsi que le changement intentionnel de « nous » à « ils ». La note [b] est placée après « voies »; la nuance « instruction » de תּוֹרָה est toutefois expliquée dans les décisions lexicales mais n’est pas appelée par un marqueur dans le texte.
