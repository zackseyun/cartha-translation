    rationale: Le texte présente le peuple comme « butin/proie », parallèlement à לָבַז, et non seulement comme subissant un pillage. Une formulation nominale maintient mieux l'image et le parallélisme.
  - severity: low
    issue: « Rendez-les ! » explicite l'objet de l'impératif הָשַׁב.
    rationale: L'objet est sous-entendu en hébreu et peut renvoyer aux personnes, aux biens, ou plus largement à ce qui a été pris. « Restituez ! » préserve cette ouverture.
