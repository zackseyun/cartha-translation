  source_fidelity: Le projet rend fidèlement l'image générale de spoliation, de captivité et d'absence de délivrance. Toutefois, « ils sont livrés au pillage » reformule le second prédicat comme un processus subi, alors que מְשִׁסָּה les décrit de nouveau comme du butin ou une proie. « Rendez-les ! » précise également un objet humain que l'hébreu laisse implicite.
  naturalness: Le français est clair et d'un registre convenable. Une reprise nominale de « butin / proie » permet toutefois de mieux conserver le parallélisme incisif de l'original tout en restant naturelle.
  terminology: « Dépouillé et pillé », « prisons » et « délivrer » conviennent. Le couple « butin / proie » rend les deux désignations successives de ce peuple comme objet de prédation sans les confondre avec l'acte de piller.
