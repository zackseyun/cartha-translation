  text: וְ/הוּא֮ עַם בָּז֣וּז וְ/שָׁסוּי֒ הָפֵ֤חַ בַּֽ/חוּרִים֙ כֻּלָּ֔/ם וּ/בְ/בָתֵּ֥י כְלָאִ֖ים הָחְבָּ֑אוּ הָי֤וּ לָ/בַז֙ וְ/אֵ֣ין מַצִּ֔יל מְשִׁסָּ֖ה וְ/אֵין אֹמֵ֥ר הָשַֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/022.yaml
  text: But this is a people plundered and pillaged[a], all of them trapped in holes and hidden away in prison houses. They have become spoil, with no one to rescue them; plunder, with no one saying, “Restore!”
translation:
  language: fr
  text: 'Mais c’est un peuple dépouillé et pillé : tous sont pris au piège dans des trous[a] et cachés dans des prisons. Ils sont devenus un butin, sans personne pour les délivrer, une proie, sans personne pour dire : « Restituez ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « tous sont pris au piège parmi les jeunes hommes ». Le mot hébreu signifie le plus souvent « jeunes hommes », mais le contexte favorise ici le sens de « trous » ou de « fosses ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא עַם
  choice: Mais voici un peuple
  rationale: Le pronom reprend collectivement le peuple évoqué dans le contexte. « Mais voici » exprime naturellement le contraste et introduit la description sans imposer un référent masculin individuel.
- source_word: בָּזוּז וְשָׁסוּי
  choice: dépouillé et pillé
  rationale: Les deux participes décrivent une spoliation violente. Deux termes distincts conservent le redoublement expressif de l’hébreu.
- source_word: הָפֵחַ
  choice: pris au piège
  rationale: Dans ce contexte difficile, la forme exprime vraisemblablement l’idée d’être capturé ou pris au piège.
- source_word: בַּחוּרִים
  choice: dans des trous
  rationale: La construction parallèle avec les prisons favorise ici le sens rare de cavités ou trous, plutôt que le sens courant « jeunes hommes » ; l’incertitude est signalée en note.
- source_word: כֻּלָּם
  choice: tous
  rationale: Rend explicitement la totalité du groupe avec une formulation française concise.
- source_word: וּבְבָתֵּי כְלָאִים הָחְבָּאוּ
  choice: et cachés dans des prisons
  rationale: « Prisons » rend naturellement l’expression littérale « maisons de détention », tandis que « cachés » conserve la forme passive du verbe.
- source_word: הָיוּ לָבַז
  choice: Ils sont devenus une proie
  rationale: La tournure היה ל indique un état acquis. « Une proie » restitue l’image collective de personnes livrées à leurs ravisseurs.
- source_word: וְאֵין מַצִּיל
  choice: et personne ne les délivre
  rationale: Cette formulation conserve la valeur existentielle de אֵין et le sens actif du participe « celui qui délivre ».
- source_word: מְשִׁסָּה
  choice: ils sont livrés au pillage
  rationale: Le nom reprend le champ lexical de la spoliation ; cette formulation française évite une phrase nominale maladroite tout en maintenant le parallélisme.
- source_word: הָשַׁב
  choice: Rendez-les !
  rationale: L’impératif du verbe שוב à la forme causative demande de faire revenir ou de restituer ce qui a été pris. Le complément humain implicite est explicité par « les » en français.
theological_decisions:
- issue: Référent du pronom singulier וְהוּא
  choice: Référence collective au peuple, rendue par « Mais voici un peuple »
  alternative: « Et il est un peuple » ou « Pourtant, c’est un peuple »
  rationale: Le nom collectif עַם explicite immédiatement le référent. La formulation choisie respecte le mouvement du discours sans transformer le pronom en individu.
- issue: Objet implicite de l’impératif הָשַׁב
  choice: « Rendez-les ! », en référence aux membres du peuple emmenés ou retenus
  alternative: « Restituez ! » ou « Ramenez ! » sans objet explicite
  rationale: L’hébreu laisse l’objet sous-entendu. Le français exige ici une formulation plus complète ; « les » renvoie naturellement au peuple décrit, sans préciser davantage l’identité de ceux qui devraient agir.
translation_notes:
  register: Français moderne, international et digne. Le verset conserve son parallélisme de lamentation, avec un vocabulaire concret et accessible. L’ambiguïté lexicale de בַּחוּרִים est maintenue en note.
