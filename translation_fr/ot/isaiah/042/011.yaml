id: ISA.42.11
reference: Isaiah 42:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יִשְׂא֤וּ מִדְבָּר֙ וְ/עָרָ֔י/ו חֲצֵרִ֖ים תֵּשֵׁ֣ב קֵדָ֑ר יָרֹ֨נּוּ֙ יֹ֣שְׁבֵי סֶ֔לַע מֵ/רֹ֥אשׁ הָרִ֖ים יִצְוָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/011.yaml
  text: Let the wilderness and its cities lift up their voice[a], the settlements where Kedar dwells; let the inhabitants of Sela sing for joy; let them shout from the tops of the mountains.
translation:
  language: fr
  text: 'Que le désert et ses villes élèvent la voix,

    ainsi que les villages où habite Qédar !

    Que les habitants de Séla[a] chantent de joie,

    qu’ils poussent des cris du haut des montagnes !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du rocher », si סֶלַע est compris comme un nom commun plutôt que comme le nom de lieu Séla.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂאוּ
  choice: élèvent la voix
  rationale: Le verbe נשׂא signifie « lever, élever ». L’objet « la voix », implicite en hébreu, est explicité selon l’usage naturel du français et le contexte d’acclamation.
- source_word: מִדְבָּר
  choice: le désert
  rationale: « Désert » rend naturellement מִדְבָּר en français moderne tout en convenant à la personnification poétique du lieu.
- source_word: וְעָרָיו
  choice: et ses villes
  rationale: Le suffixe masculin singulier renvoie naturellement au désert, antécédent grammatical ; le possessif français « ses » évite une personnification masculine artificielle.
- source_word: חֲצֵרִים
  choice: les villages
  rationale: Le terme désigne des lieux habités non fortifiés. « Villages » est clair et courant, tout en pouvant évoquer les petites implantations associées à Qédar.
- source_word: תֵּשֵׁב קֵדָר
  choice: où habite Qédar
  rationale: La proposition relative restitue avec naturel le rapport entre les villages et Qédar. Le nom propre est translittéré.
- source_word: יָרֹנּוּ
  choice: chantent de joie
  rationale: רנן exprime un chant ou un cri éclatant de joie ; « chanter de joie » conserve à la fois sa dimension vocale et jubilatoire.
- source_word: יֹשְׁבֵי
  choice: les habitants de
  rationale: Le participe substantivé désigne ceux qui résident dans un lieu ; « les habitants de » est idiomatique et concis.
- source_word: סֶלַע
  choice: Séla
  rationale: Le parallélisme avec Qédar favorise l’interprétation comme nom de lieu. La possibilité du nom commun « rocher » est conservée en note.
- source_word: מֵרֹאשׁ הָרִים
  choice: du haut des montagnes
  rationale: Cette formulation française naturelle exprime le lieu élevé d’où partent les cris sans reproduire littéralement l’hébraïsme « tête des montagnes ».
- source_word: יִצְוָחוּ
  choice: poussent des cris
  rationale: צוח désigne un cri puissant. Dans ce contexte de louange, « pousser des cris » exprime une acclamation sonore sans ajouter un qualificatif absent du texte.
theological_decisions: []
translation_notes:
  register: Poésie prophétique rendue dans un français moderne, digne et oralement fluide. Les quatre appels volitifs sont portés par « Que… », avec un parallélisme clair. Le nom Qédar suit une translittération française courante, et l’ambiguïté de Séla est explicitement préservée en note.
