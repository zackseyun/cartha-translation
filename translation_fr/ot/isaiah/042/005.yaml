  variant: modern international French
source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר הָ/אֵ֣ל יְהוָ֗ה בּוֹרֵ֤א הַ/שָּׁמַ֨יִם֙ וְ/נ֣וֹטֵי/הֶ֔ם רֹקַ֥ע הָ/אָ֖רֶץ וְ/צֶאֱצָאֶ֑י/הָ נֹתֵ֤ן נְשָׁמָה֙ לָ/עָ֣ם עָלֶ֔י/הָ וְ/ר֖וּחַ לַ/הֹלְכִ֥ים בָּֽ/הּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/005.yaml
  text: 'Thus says God[a], Yahweh, who created the heavens and stretched them out, who spread out the earth and its offspring[c][b], who gives breath to the people on it and spirit to those who walk in it:'
translation:
  language: fr
  text: 'Ainsi parle Dieu, Yahweh, lui qui a créé les cieux et les a déployés, qui a étendu[a] la terre et ce qui en sort[b], qui donne le souffle au peuple qui l’habite et l’esprit[c] à ceux qui y marchent :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui a battu et étendu la terre ». Le verbe hébreu peut évoquer le travail d’une matière que l’on frappe pour l’aplatir et l’étendre.
    reason: lexical_alternative
  - marker: b
    text: Ou « sa descendance » ou « ce qu’elle produit ». L’expression désigne largement ce qui sort de la terre.
    reason: lexical_alternative
  - marker: c
    text: Ou « souffle ». Le mot hébreu peut signifier « esprit », « souffle » ou « vent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל יְהוָה
  choice: Dieu, Yahweh
  rationale: Le titre אֵל et le nom divin יְהוָה sont tous deux conservés. L’apposition est naturelle en français et évite de fondre les deux expressions.
- source_word: בּוֹרֵא הַשָּׁמַיִם
  choice: lui qui a créé les cieux
  rationale: Le participe décrit Yahweh comme créateur. La relative française rend naturellement cette fonction tout en gardant la portée cosmique de « les cieux ».
- source_word: וְנֹטֵיהֶם
  choice: et les a déployés
  rationale: « Déployer » exprime l’action d’étendre les cieux et préserve l’image poétique.
- source_word: רֹקַע הָאָרֶץ
  choice: qui a étendu la terre
  rationale: רָקַע évoque une matière battue puis étendue. « Étendre » communique clairement le résultat spatial; l’image plus concrète est signalée en note.
- source_word: וְצֶאֱצָאֶיהָ
  choice: et ce qui en sort
  rationale: Le nom désigne ce qui jaillit ou provient de la terre, sans préciser s’il s’agit de sa production, de sa végétation ou de ses êtres vivants. Cette formulation conserve cette ampleur.
- source_word: נֹתֵן נְשָׁמָה
  choice: qui donne le souffle
  rationale: נְשָׁמָה désigne ici le souffle vital; « souffle » convient mieux que « âme » et maintient le motif de la création.
- source_word: לָעָם עָלֶיהָ
  choice: au peuple qui l’habite
  rationale: Le collectif עָם est rendu au singulier. La relative explicite idiomatiquement la présence du peuple sur la terre sans changer le référent.
- source_word: וְרוּחַ
  choice: et l’esprit
  rationale: רוּחַ peut signifier esprit, souffle ou vent. « Esprit » distingue ce terme du précédent נְשָׁמָה tout en préservant sa profondeur anthropologique.
- source_word: לַהֹלְכִים בָּהּ
  choice: à ceux qui y marchent
  rationale: La traduction garde l’image concrète du participe « ceux qui marchent » et rend naturellement le pronom locatif par « y ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le nom propre de l’alliance est transcrit plutôt que remplacé par un titre, conformément à la valeur directe du tétragramme dans le texte.
- issue: Distinction entre נְשָׁמָה et רוּחַ
  choice: le souffle… l’esprit
  alternative: le souffle… le souffle
  rationale: Les deux mots ont des champs sémantiques qui se recoupent, mais ils restent distincts dans l’hébreu. Deux rendus différents préservent cette tension sans imposer une anthropologie systématique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La répétition des relatives garde le rythme solennel de la proclamation. « Lui qui » met naturellement en relief la série de participes hébreux. Les trois appels de note sont placés immédiatement après les expressions concernées.
