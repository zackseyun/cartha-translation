source:
  edition: WLC
  text: שִׁ֤ירוּ לַֽ/יהוָה֙ שִׁ֣יר חָדָ֔שׁ תְּהִלָּת֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ יוֹרְדֵ֤י הַ/יָּם֙ וּ/מְלֹא֔/וֹ אִיִּ֖ים וְ/יֹשְׁבֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/010.yaml
  text: Sing to Yahweh a new song[a], his praise from the end of the earth, you who go down to the sea, and all that fills it[b], the coastlands and those who dwell in them.
translation:
  language: fr
  text: Chantez à Yahweh un chant nouveau, sa louange depuis l’extrémité de la terre[a], vous qui descendez vers la mer, et tout ce qui la remplit, les régions côtières[b] et leurs habitants.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « depuis l’extrémité de la terre » ; l’expression peut aussi se rendre par « depuis les extrémités de la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les îles ». Le terme hébreu peut désigner des îles aussi bien que des côtes ou des terres maritimes lointaines.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: Chantez
  rationale: L’impératif pluriel appelle directement tous les groupes mentionnés à louer Dieu. « Chantez » est simple, naturel et fidèle.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition indique ici le destinataire du chant, et le nom divin יהוה est transcrit « Yahweh » afin de conserver le nom propre présent dans le texte hébreu.
- source_word: שִׁיר חָדָשׁ
  choice: un chant nouveau
  rationale: Cette expression hébraïque courante désigne une louange nouvelle suscitée par l’action de Dieu. « Chant nouveau » est idiomatique et dignifié en français.
- source_word: תְּהִלָּתוֹ
  choice: chantez sa louange
  rationale: L’hébreu enchaîne elliptiquement « sa louange » après l’ordre de chanter. La répétition de « chantez » explicite en français le lien syntaxique sans changer le sens.
- source_word: מִקְצֵה הָאָרֶץ
  choice: depuis l’extrémité de la terre
  rationale: Le singulier hébreu קְצֵה est conservé. L’expression évoque la limite la plus lointaine du monde habité sans imposer le pluriel idiomatique fréquent dans les traductions.
- source_word: יוֹרְדֵי הַיָּם
  choice: vous qui descendez vers la mer
  rationale: Le participe pluriel décrit littéralement ceux qui descendent vers la mer. Cette formulation garde l’image hébraïque et l’adresse directe, plutôt que de réduire le groupe aux seuls marins.
- source_word: וּמְלֹאוֹ
  choice: avec tout ce qui la remplit
  rationale: מְלֹא désigne la totalité de ce qui remplit la mer. Cette formulation française est plus naturelle que le calque « sa plénitude ».
- source_word: אִיִּים
  choice: les régions côtières
  rationale: Dans Ésaïe, אִיִּים peut désigner largement les îles, les côtes et les terres maritimes lointaines. « Régions côtières » préserve cette portée géographique générale.
- source_word: וְיֹשְׁבֵיהֶם
  choice: et leurs habitants
  rationale: La formulation rend clairement le participe substantivé et son suffixe pluriel, dont l’antécédent est אִיִּים.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte emploie explicitement le Tétragramme. « Yahweh » le rend comme un nom propre et évite de le remplacer par un titre, sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme poétique est conservé, avec une légère explicitation verbale (« chantez sa louange ») nécessaire à la fluidité française. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
