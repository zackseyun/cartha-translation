review_pass:
  verdict: revise
  source_fidelity: Le texte hébreu enchaîne l’impératif « Chantez » avec « un chant nouveau », puis « sa louange depuis l’extrémité de la terre », avant d’énumérer les groupes et réalités appelés à cette louange. Le nom Yahweh, le singulier « l’extrémité », l’image de ceux qui descendent vers la mer, et la portée maritime de אִיִּים sont correctement rendus. La révision évite toutefois de faire de « tout ce qui la remplit » un simple accompagnement des personnes qui descendent vers la mer.
  naturalness: La suppression du second « chantez » restitue mieux le parallélisme concis de la poésie hébraïque. La coordination explicite des groupes (« vous..., et tout..., les régions... ») est plus nette et naturelle en français soutenu.
  terminology: « Yahweh » rend directement le Tétragramme. « Chant nouveau », « louange », « l’extrémité de la terre », « régions côtières » et « habitants » sont appropriés. La note sur « îles » préserve l’alternative lexicale légitime pour אִיִּים.
  issues:
  - severity: medium
    issue: Coordination de « avec tout ce qui la remplit »
    rationale: Dans le brouillon, « avec » rattache syntaxiquement tout ce qui remplit la mer aux personnes qui descendent vers elle. Or וּמְלֹאוֹ est un élément coordonné de l’appel à la louange, non leur accompagnement.
  - severity: low
    issue: Répétition explicative de « chantez »
    rationale: « Chantez sa louange » est interprétativement défendable, mais l’ajout d’un second impératif affaiblit le parallélisme elliptique du texte source. La construction française sans répétition reste claire.
  revised_text: Chantez à Yahweh un chant nouveau, sa louange depuis l’extrémité de la terre[a], vous qui descendez vers la mer, et tout ce qui la remplit, les régions côtières[b] et leurs habitants.
