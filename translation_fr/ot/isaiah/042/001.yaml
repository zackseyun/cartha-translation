source:
  edition: WLC
  text: הֵ֤ן עַבְדִּ/י֙ אֶתְמָךְ בּ֔/וֹ בְּחִירִ֖/י רָצְתָ֣ה נַפְשִׁ֑/י נָתַ֤תִּי רוּחִ/י֙ עָלָ֔י/ו מִשְׁפָּ֖ט לַ/גּוֹיִ֥ם יוֹצִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/001.yaml
  text: Behold my servant[a], whom I uphold, my chosen one, in whom my soul delights. I have put my Spirit upon him[c][b]; he will bring forth justice to the nations.
translation:
  language: fr
  text: Voici mon serviteur, que je soutiens, celui que j’ai choisi et en qui je prends plaisir. J’ai mis mon Esprit sur lui ; il fera parvenir le droit[a] aux nations.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la justice » ou « le jugement ». Le mot hébreu peut désigner une décision judiciaire, la justice ou un ordre juste.
    reason: lexical_alternative
  - marker: b
    text: Dans le Nouveau Testament, ce verset est appliqué à Jésus, le Messie (voir Matthieu 12.18).
    reason: cross_reference
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: Particule déictique qui attire l’attention. « Voici » conserve le ton prophétique élevé tout en restant naturel en français moderne.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: Dans ce contexte prophétique, « serviteur » exprime naturellement la fonction désignée sans accentuer indûment le statut servile que pourrait suggérer « esclave ».
- source_word: אֶתְמָךְ בּוֹ
  choice: que je soutiens
  rationale: Le verbe תמך construit avec ב exprime l’action de soutenir ou d’affermir. La proposition relative donne une syntaxe française fluide.
- source_word: בְּחִירִי
  choice: celui que j’ai choisi
  rationale: Cette formulation rend clairement et naturellement l’adjectif substantivé « mon élu / celui que j’ai choisi », sans connotation électorale moderne.
- source_word: רָצְתָה נַפְשִׁי
  choice: en qui je prends plaisir
  rationale: La formule exprime le profond agrément de Dieu. « Prendre plaisir en » préserve mieux l’intensité de l’hébreu que le simple « qui a toute mon approbation », tout en évitant le calque peu naturel « mon âme prend plaisir ».
- source_word: נָתַתִּי רוּחִי עָלָיו
  choice: J’ai mis mon Esprit sur lui
  rationale: נתן avec רוח et על désigne ici l’octroi de l’Esprit divin au serviteur. La majuscule identifie naturellement l’Esprit de Dieu, explicitement désigné par le possessif.
- source_word: מִשְׁפָּט
  choice: le droit
  rationale: Dans ce contexte, מִשְׁפָּט dépasse la seule sentence judiciaire et évoque le droit, la justice ou l’ordre juste. « Le droit » s’accorde bien avec le mouvement exprimé par יוֹצִיא, tout en laissant une note signaler l’amplitude du terme.
- source_word: לַגּוֹיִם
  choice: aux nations
  rationale: גּוֹיִם désigne largement les peuples ou nations. « Nations » évite de restreindre le sens par la catégorie religieuse plus tardive de « païens ».
- source_word: יוֹצִיא
  choice: il fera parvenir
  rationale: Le hiphil de יצא signifie faire sortir, produire ou porter au-dehors. Avec « le droit » et un destinataire introduit par ל, « fera parvenir » rend naturellement l’idée que le serviteur porte le droit jusqu’aux nations, sans préciser indûment s’il le proclame ou l’établit.
theological_decisions:
- issue: Identité du serviteur
  choice: Conserver la désignation neutre « mon serviteur » dans le texte.
  alternative: Identifier explicitement le serviteur à Israël, à un prophète individuel ou au Messie.
  rationale: Le verset hébreu ne précise ici que « mon serviteur ». La traduction ne tranche donc pas dans le corps du texte entre les lectures corporative, prophétique et messianique ; la réception néotestamentaire est indiquée séparément en note.
- issue: רוּחִי comme Esprit divin
  choice: Employer la majuscule dans « mon Esprit ».
  alternative: Écrire « mon esprit » avec une minuscule.
  rationale: Le locuteur étant Dieu et l’expression décrivant l’habilitation du serviteur par ce qui lui appartient, « Esprit » rend le référent divin sans ajouter de contenu absent de la construction hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici » maintient la solennité prophétique ; la syntaxe reste fluide et évite les archaïsmes. Les ambiguïtés concernant l’identité du serviteur et l’étendue de מִשְׁפָּט sont préservées.
