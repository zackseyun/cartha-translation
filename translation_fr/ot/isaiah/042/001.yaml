  terminology: « Serviteur », « Esprit », « droit » et « nations » sont cohérents avec le contexte et avec un français international moderne. La note sur « droit » signale utilement l’amplitude de משפט. La note néotestamentaire est explicitement présentée comme une application ultérieure, sans imposer cette identification dans le texte.
