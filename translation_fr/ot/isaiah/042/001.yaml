  source_fidelity: 'Le texte rend fidèlement les unités de l’hébreu : « Voici » pour הֵן, « mon serviteur » pour עַבְדִּי, le soutien divin, l’élection et le plaisir divin, le don de l’Esprit, puis la mission du serviteur concernant le droit et les nations. « Il fera parvenir le droit aux nations » est une formulation recevable pour יוֹצִיא מִשְׁפָּט לַגּוֹיִם et ne force pas indûment une interprétation unique (proclamation, manifestation ou établissement).'
