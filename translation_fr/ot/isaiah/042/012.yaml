  text: יָשִׂ֥ימוּ לַֽ/יהוָ֖ה כָּב֑וֹד וּ/תְהִלָּת֖/וֹ בָּ/אִיִּ֥ים יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/012.yaml
  text: Let them give glory to Yahweh[c][b][a], and let them declare his praise in the coastlands.
translation:
  language: fr
  text: Qu’ils rendent gloire à Yahweh[a] et proclament sa louange dans les îles[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
  - marker: b
    text: Ou « dans les terres maritimes ». Chez Ésaïe, le terme peut désigner plus largement des régions lointaines situées au-delà ou au bord de la mer, et pas seulement des îles au sens strict.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂימוּ
  choice: qu’ils rendent
  rationale: שׂים signifie littéralement « mettre, placer », mais avec כָּבוֹד et un destinataire introduit par ל, l’expression idiomatique signifie « rendre/attribuer gloire ». « Rendre gloire » est naturel en français et conserve la valeur exhortative.
- source_word: לַיהוָה
  choice: à Yahweh
  rationale: La préposition ל marque ici le destinataire, et le tétragramme יהוה est transcrit « Yahweh » afin de conserver le nom divin dans le texte.
- source_word: כָּבוֹד
  choice: gloire
  rationale: Dans ce contexte de louange, כָּבוֹד désigne la gloire ou l’honneur reconnus à Dieu ; « gloire » préserve le vocabulaire cultuel et le parallélisme.
- source_word: וּתְהִלָּתוֹ
  choice: et ... sa louange
  rationale: תְּהִלָּה signifie « louange » ; le suffixe masculin singulier donne « sa louange », c’est-à-dire la louange qui lui revient.
- source_word: בָּאִיִּים
  choice: dans les terres maritimes
  rationale: אִיִּים peut désigner des îles, mais aussi, notamment chez Ésaïe, les régions lointaines accessibles par mer. « Terres maritimes » garde cette portée plus large sans réduire le terme aux seules côtes.
- source_word: יַגִּידוּ
  choice: proclament
  rationale: Le hifil de נגד signifie « faire connaître, annoncer, déclarer ». « Proclamer » convient à une louange publique et au registre poétique du passage.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte explicitement le tétragramme. « Yahweh » conserve le nom propre, tandis que « le SEIGNEUR » représente sa lecture traditionnelle.
- issue: Rapport entre la gloire humaine et la gloire divine
  choice: rendent gloire à Yahweh
  alternative: attribuent la gloire à Yahweh
  rationale: L’expression ne suggère pas que les humains augmentent intrinsèquement la gloire de Dieu, mais qu’ils la reconnaissent publiquement. « Rendre gloire » maintient l’idiome biblique sans expliciter davantage cette tension.
translation_notes:
  register: Français international actuel, poétique et digne. L’impératif à la troisième personne (« Qu’ils… ») rend la valeur exhortative des formes hébraïques. Le parallélisme entre « rendre gloire » et « proclamer sa louange » est conservé.
