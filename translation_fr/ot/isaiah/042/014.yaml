source:
  edition: WLC
  text: הֶחֱשֵׁ֨יתִי֙ מֵֽ/עוֹלָ֔ם אַחֲרִ֖ישׁ אֶתְאַפָּ֑ק כַּ/יּוֹלֵדָ֣ה אֶפְעֶ֔ה אֶשֹּׁ֥ם וְ/אֶשְׁאַ֖ף יָֽחַד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/042/014.yaml
  text: I have kept silent from long ago[a]; I have been quiet and restrained myself. Like a woman in labor I will cry out[b]; I will gasp and pant together.
translation:
  language: fr
  text: Depuis longtemps, j’ai gardé le silence[a] ; je me suis tu et je me suis contenu. Comme une femme en travail, je pousserai des cris ; je halèterai et je soufflerai bruyamment, tout à la fois[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis des temps anciens » ; l’expression peut aussi souligner la durée : « pendant longtemps ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ensemble ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱשֵׁיתִי
  choice: j’ai gardé le silence
  rationale: Le hifil à la première personne exprime ici le fait d’être demeuré silencieux ou de s’être imposé le silence. Le passé composé convient au regard rétrospectif du verset.
- source_word: מֵעוֹלָם
  choice: depuis longtemps
  rationale: Dans ce contexte, l’expression indique une longue durée antérieure plutôt que l’éternité absolue. Cette formulation française est naturelle tout en conservant l’ampleur temporelle.
- source_word: אַחֲרִישׁ
  choice: je me suis tu
  rationale: Le verbe appartient au champ lexical du silence. Le choix évite une répétition pesante tout en maintenant le parallélisme avec la proposition précédente.
- source_word: אֶתְאַפָּק
  choice: je me suis contenu
  rationale: Le hitpael de אפק exprime la maîtrise de soi, le fait de se retenir. La tournure pronominale française en conserve la valeur réflexive.
- source_word: כַּיּוֹלֵדָה
  choice: comme une femme qui accouche
  rationale: La comparaison explicite avec une femme en plein accouchement est rendue directement, dans une langue moderne et claire.
- source_word: אֶפְעֶה
  choice: je vais crier
  rationale: Le verbe פעה désigne l’émission d’un cri. Le futur proche marque naturellement en français le passage du long silence à l’action imminente.
- source_word: אֶשֹּׁם
  choice: je halèterai
  rationale: Dans l’image de l’accouchement et en parallèle avec le verbe suivant, le terme évoque une respiration forte et saccadée.
- source_word: וְאֶשְׁאַף
  choice: et je chercherai mon souffle
  rationale: שׁאף peut décrire le fait de haleter ou de respirer avec effort. Cette formulation française complète l’image sans répéter exactement le verbe précédent.
- source_word: יָחַד
  choice: tout à la fois
  rationale: L’adverbe présente les deux actions comme simultanées et peut aussi suggérer leur brusque irruption.
theological_decisions:
- issue: Autodescription divine au moyen de l’image de l’accouchement
  choice: Conserver sans l’atténuer la comparaison « comme une femme qui accouche »
  alternative: Remplacer l’image par une simple évocation d’un cri intense
  rationale: L’hébreu établit explicitement cette comparaison. La maintenir préserve la force et la tension théologique du texte sans transformer la comparaison en affirmation sur la nature divine.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé souligne la longue période de silence qui précède l’action imminente ; le futur proche introduit le brusque retournement, puis le futur simple déploie l’image de la respiration liée à l’accouchement.
