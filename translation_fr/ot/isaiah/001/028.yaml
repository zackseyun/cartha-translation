id: ISA.1.28
reference: Isaiah 1:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שֶׁ֧בֶר פֹּשְׁעִ֛ים וְ/חַטָּאִ֖ים יַחְדָּ֑ו וְ/עֹזְבֵ֥י יְהוָ֖ה יִכְלֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/028.yaml
  text: But rebels and sinners will be broken together[b][a], and those who forsake Yahweh will come to an end.
translation:
  language: fr
  text: Mais les rebelles et les pécheurs seront brisés ensemble[a], et ceux qui abandonnent Yahweh connaîtront leur fin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais ce sera la destruction des rebelles et des pécheurs, tous ensemble. » L’hébreu emploie ici un nom pouvant signifier « brisure », « ruine » ou « destruction ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « périront » ou « seront consumés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבֶר
  choice: seront brisés
  rationale: Le nom hébreu exprime la brisure, l’effondrement ou la ruine. Une tournure verbale au passif est naturelle en français et conserve l’image concrète de la brisure, sans exclure le sens de destruction.
- source_word: פֹּשְׁעִים
  choice: les rebelles
  rationale: Le terme désigne ceux qui se révoltent ou se dressent volontairement contre l’autorité; « rebelles » rend cette idée avec force dans un français actuel.
- source_word: חַטָּאִים
  choice: les pécheurs
  rationale: Ce terme courant désigne ceux qui sont caractérisés par le péché. Il maintient la distinction avec « les rebelles », qui souligne plus précisément la révolte.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe indique que les deux groupes subiront conjointement le même sort.
- source_word: עֹזְבֵי יְהוָה
  choice: ceux qui abandonnent Yahweh
  rationale: Le participe de עזב exprime l’action de quitter ou d’abandonner. « Abandonnent » est naturel et fait ressortir la gravité relationnelle de l’acte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יִכְלוּ
  choice: connaîtront leur fin
  rationale: Le verbe כלה peut signifier finir, disparaître, périr ou être consumé. Cette expression française transmet l’idée générale d’une fin complète sans préciser indûment la manière du jugement.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom personnel et l’arrière-plan d’alliance sans le remplacer par un titre.
- issue: Nature du sort des rebelles et des pécheurs
  choice: seront brisés
  alternative: la destruction des rebelles et des pécheurs
  rationale: L’hébreu emploie un nom, « brisure/ruine », dans une proposition nominale. La formulation verbale française reste proche de l’image sans trancher davantage la nature précise de cette destruction; la formulation nominale demeure possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme du texte hébreu, l’image concrète de la brisure et la portée générale du verbe final.
