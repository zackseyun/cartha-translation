  text: כִּ֣י תָבֹ֔אוּ לֵ/רָא֖וֹת פָּנָ֑/י מִי בִקֵּ֥שׁ זֹ֛את מִ/יֶּדְ/כֶ֖ם רְמֹ֥ס חֲצֵרָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/012.yaml
  text: 'When you come to appear before me[a], who has required this from your hand: trampling my courts?'
translation:
  language: fr
  text: Quand vous venez vous présenter devant moi[a], qui vous a demandé de piétiner mes parvis ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « voir ma face » ; expression qui désigne le fait de paraître en présence de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Quand
  rationale: Dans ce contexte, la conjonction introduit la circonstance visée par le reproche plutôt qu’une cause explicite.
- source_word: תָבֹאוּ
  choice: vous venez
  rationale: Le verbe exprime naturellement la venue des adorateurs au sanctuaire.
- source_word: לֵרָאוֹת פָּנָי
  choice: vous présenter devant moi
  rationale: Littéralement « voir ma face » ; dans ce contexte cultuel, l’expression désigne le fait de paraître dans la présence de Dieu.
- source_word: מִי בִקֵּשׁ זֹאת מִיֶּדְכֶם
  choice: qui vous a demandé cela
  rationale: Cette formulation française restitue naturellement la question rhétorique. L’expression hébraïque « de votre main » indique ici ce qui est demandé de leur part ; la conserver littéralement serait peu idiomatique en français.
- source_word: רְמֹס חֲצֵרָי
  choice: piétiner mes parvis
  rationale: « Piétiner » garde la force accusatrice du verbe, et « parvis » est le terme usuel pour les cours du sanctuaire.
theological_decisions:
- issue: Sens de l’expression cultuelle לֵרָאוֹת פָּנָי
  choice: vous présenter devant moi
  alternative: voir ma face
  rationale: La traduction principale exprime l’acte de se rendre dans la présence de Dieu au sanctuaire sans suggérer nécessairement une vision physique, tandis que la note conserve le sens littéral.
- issue: Portée du reproche divin
  choice: Le reproche vise leur venue devenue un piétinement des parvis
  alternative: Dieu condamnerait en soi toute venue au sanctuaire
  rationale: La question rhétorique, dans son contexte, dénonce leur culte corrompu. La traduction préserve cette tension sans ajouter une conclusion doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et direct. « Se présenter devant » rend l’idiome cultuel avec naturel ; les deux-points maintiennent l’apposition accusatrice entre « cela » et « piétiner mes parvis ».
