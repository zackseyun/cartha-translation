  source_fidelity: 'Le sens cultuel de לֵרָאוֹת פָּנַי est correctement rendu par « vous présenter devant moi ». La question rhétorique et l’accusation de fouler les parvis sont conservées. Toutefois, en français, l’apposition après « cela : » est moins claire et moins naturelle que la construction infinitive directement régie par « demander ».'
  naturalness: '« Qui vous a demandé cela : piétiner mes parvis ? » est compréhensible, mais la ponctuation introduit une apposition abrupte et laisse l’infinitif insuffisamment intégré à la question. « Qui vous a demandé de piétiner mes parvis ? » est idiomatique, direct et conserve la force accusatrice.'
  terminology: « Parvis » convient au contexte du sanctuaire et « piétiner » restitue bien la force de רְמֹס. La note doit employer la formulation française naturelle « paraître en présence de Dieu » plutôt que « paraître dans la présence de Dieu ».
