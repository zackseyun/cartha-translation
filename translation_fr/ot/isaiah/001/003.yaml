id: ISA.1.3
reference: Isaiah 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: יָדַ֥ע שׁוֹר֙ קֹנֵ֔/הוּ וַ/חֲמ֖וֹר אֵב֣וּס בְּעָלָ֑י/ו יִשְׂרָאֵל֙ לֹ֣א יָדַ֔ע עַמִּ֖/י לֹ֥א הִתְבּוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/003.yaml
  text: An ox knows its owner[a], and a donkey its master's feeding trough; Israel does not know[b]; my people do not understand.
translation:
  language: fr
  text: 'Le bœuf connaît son propriétaire,

    et l’âne la mangeoire de son maître ;

    Israël ne connaît pas[a],

    mon peuple ne comprend pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le contexte laisse entendre qu’Israël ne connaît pas le Seigneur, mais l’hébreu ne précise pas l’objet du verbe.
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַע
  choice: connaît
  rationale: « Connaître » conserve le sens cognitif et relationnel du verbe ainsi que sa reprise dans l’accusation portée contre Israël.
- source_word: שׁוֹר
  choice: bœuf
  rationale: Ce terme courant désigne naturellement le bovin domestique évoqué dans la comparaison.
- source_word: קֹנֵהוּ
  choice: son propriétaire
  rationale: Dans ce contexte d’animal domestique, le participe de קנה désigne naturellement celui à qui l’animal appartient.
- source_word: חֲמוֹר
  choice: âne
  rationale: Équivalent français moderne, précis et naturel.
- source_word: אֵבוּס
  choice: mangeoire
  rationale: « Mangeoire » désigne clairement l’auge où l’animal reçoit sa nourriture, sans alourdir l’expression.
- source_word: בְּעָלָיו
  choice: son maître
  rationale: בעל peut désigner le propriétaire ou le maître. « Son maître » exprime ici l’autorité et évite une répétition peu naturelle de « propriétaire ».
- source_word: לֹא יָדַע
  choice: ne connaît pas
  rationale: La formulation reprend « connaît » au début du verset et conserve l’absence d’objet explicite en hébreu.
- source_word: עַמִּי
  choice: mon peuple
  rationale: La traduction directe du nom avec suffixe de première personne préserve la dimension relationnelle et l’émotion de l’accusation divine.
- source_word: הִתְבּוֹנָן
  choice: ne comprend pas
  rationale: Le verbe exprime ici l’intelligence réfléchie ou le discernement ; cette formulation naturelle maintient le parallélisme avec « ne connaît pas ».
theological_decisions:
- issue: Objet implicite de l’incapacité d’Israël à connaître
  choice: Laisser l’objet inexprimé dans le texte principal
  alternative: « Israël ne me connaît pas » ou « Israël ne connaît pas le Seigneur »
  rationale: Le contexte indique fortement que Dieu est l’objet implicite, mais l’hébreu ne le nomme pas. La traduction en conserve donc la concision et la tension rhétorique.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé en quatre lignes, avec une syntaxe accessible et sans explicitation doctrinale dans le texte principal.
