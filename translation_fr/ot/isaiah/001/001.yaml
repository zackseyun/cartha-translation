id: ISA.1.1
reference: Isaiah 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: חֲזוֹן֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֲשֶׁ֣ר חָזָ֔ה עַל יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בִּ/ימֵ֨י עֻזִּיָּ֧הוּ יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖הוּ מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/001.yaml
  text: The vision of Isaiah son of Amoz[a], which he saw concerning Judah and Jerusalem in the days of Uzziah, Jotham, Ahaz, and Hezekiah, kings of Judah.
translation:
  language: fr
  text: Vision d’Ésaïe, fils d’Amots, qu’il a vue au sujet de Juda et de Jérusalem[a], du temps d’Ozias, de Jotam, d’Ahaz et d’Ézéchias, rois de Juda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contre Juda et Jérusalem ». La préposition hébraïque peut introduire le sujet du message ou, dans certains contextes, un message hostile.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזוֹן
  choice: Vision
  rationale: « Vision » rend directement le terme prophétique et permet de conserver, avec « qu’il a vue », l’écho entre le nom et le verbe hébreux.
- source_word: יְשַׁעְיָהוּ
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: בֶן אָמוֹץ
  choice: fils d’Amots
  rationale: Le construit exprime ici la filiation directe; « Amots » distingue ce nom de celui du prophète Amos.
- source_word: אֲשֶׁר חָזָה
  choice: qu’il a vue
  rationale: Rend la proposition relative et le sens concret du verbe « voir », tout en préservant autant que possible le lien lexical avec « vision ».
- source_word: עַל
  choice: au sujet de
  rationale: La préposition introduit naturellement le domaine concerné sans imposer à elle seule une portée hostile.
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: Juda et Jérusalem
  rationale: Formes françaises usuelles des noms géographiques.
- source_word: בִּימֵי
  choice: du temps de
  rationale: Expression française naturelle qui conserve la valeur temporelle de l’hébreu sans expliciter « pendant les règnes de ».
- source_word: עֻזִּיָּהוּ יוֹתָם אָחָז יְחִזְקִיָּהוּ
  choice: Ozias, Jotam, Ahaz et Ézéchias
  rationale: Formes françaises bibliques courantes des noms royaux.
- source_word: מַלְכֵי יְהוּדָה
  choice: rois de Juda
  rationale: Traduction directe du pluriel construit, qui identifie les quatre hommes comme rois de Juda.
theological_decisions:
- issue: Portée de עַל dans la suscription
  choice: au sujet de Juda et de Jérusalem
  alternative: contre Juda et Jérusalem
  rationale: La préposition peut introduire le sujet d’un message prophétique ou, selon le contexte, une parole dirigée contre quelqu’un. La traduction principale reste large afin de préserver la coexistence du jugement et de l’espérance dans le livre; la nuance hostile possible est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « qu’il a vue » est légèrement répétitive en français, mais elle préserve intentionnellement l’écho hébreu entre « vision » et « voir ». Les noms propres suivent les formes françaises bibliques courantes.
