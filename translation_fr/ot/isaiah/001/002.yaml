source:
  edition: WLC
  text: שִׁמְע֤וּ שָׁמַ֨יִם֙ וְ/הַאֲזִ֣ינִי אֶ֔רֶץ כִּ֥י יְהוָ֖ה דִּבֵּ֑ר בָּנִים֙ גִּדַּ֣לְתִּי וְ/רוֹמַ֔מְתִּי וְ/הֵ֖ם פָּ֥שְׁעוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/002.yaml
  text: 'Hear[a], O heavens, and give ear, O earth, for Yahweh has spoken: “I have reared children and brought them up[b], but they have rebelled against me.”'
translation:
  language: fr
  text: 'Écoutez, cieux, et prête l’oreille, terre, car Yahweh a parlé : « J’ai élevé des enfants et je les ai fait grandir[a], mais ils se sont révoltés contre moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je les ai élevés » ou « je les ai exaltés ». Le second verbe peut désigner le fait de faire grandir, mais aussi d’élever ou de mettre en honneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel ouvre une sommation solennelle et conserve l’appel à une écoute attentive.
- source_word: שָׁמַיִם
  choice: cieux
  rationale: Dans le parallélisme avec la terre, le pluriel « cieux » exprime la convocation cosmique comme témoins.
- source_word: הַאֲזִינִי
  choice: prête l’oreille
  rationale: L’impératif féminin singulier s’accorde avec « terre » et maintient le parallélisme poétique avec « Écoutez ».
- source_word: אֶרֶץ
  choice: terre
  rationale: Le parallèle avec les cieux favorise le sens cosmique « terre » plutôt que « pays ».
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré afin de préserver le nom personnel présent dans le texte hébreu.
- source_word: דִּבֵּר
  choice: a parlé
  rationale: Le parfait présente la déclaration divine comme un fait solennel et accompli qui introduit la citation.
- source_word: בָּנִים
  choice: des enfants
  rationale: Le masculin pluriel désigne collectivement le peuple dans une relation filiale, sans viser seulement les hommes.
- source_word: גִּדַּלְתִּי
  choice: J’ai élevé
  rationale: Dans l’image parentale, le verbe signifie naturellement élever des enfants.
- source_word: רוֹמַמְתִּי
  choice: je les ai fait grandir
  rationale: Cette formulation française naturelle conserve ici l’idée de conduire les enfants à la croissance et à l’élévation, tout en évitant l’ambiguïté de « élevés » répété.
- source_word: פָּשְׁעוּ בִי
  choice: ils se sont révoltés contre moi
  rationale: Le verbe avec la préposition exprime une rébellion dirigée contre l’autorité légitime de celui qui parle.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte le nom propre divin; sa translittération le distingue d’un titre et préserve sa fonction d’alliance.
- issue: Portée de בָּנִים
  choice: des enfants
  alternative: des fils
  rationale: Le terme masculin pluriel représente ici collectivement Israël; « enfants » garde la métaphore filiale sans restreindre indûment le référent aux hommes.
- issue: Relation entre גִּדַּלְתִּי et רוֹמַמְתִּי
  choice: J’ai élevé des enfants et je les ai fait grandir
  alternative: J’ai élevé des fils et je les ai exaltés
  rationale: Le contexte parental favorise l’éducation et la croissance, tandis que le second verbe garde une nuance d’élévation. La traduction ne réduit pas les deux verbes à un strict doublon et la note signale leur amplitude.
translation_notes:
  register: 'Français international moderne, solennel et poétique sans archaïsme excessif. Le contraste de nombre du texte hébreu est conservé : « cieux » reçoit un impératif pluriel, tandis que « terre » reçoit un impératif singulier.'
