revisions:
- from: Comment la cité fidèle est-elle devenue une prostituée ! Elle était pleine de droit ; la justice passait la nuit chez elle[a], mais maintenant, ce sont des meurtriers.
  to: Comment la cité fidèle est-elle devenue une prostituée ! Elle était pleine de droit ; la justice logeait en elle[a], mais maintenant, des meurtriers y habitent !
  rationale: 'La révision remplace une clausule française ambiguë par une formulation qui exprime naturellement le contraste spatial et temporel porté par le verset : la justice résidait autrefois dans la cité, tandis que des meurtriers y résident maintenant. « Logeait en elle » préserve à la fois le locatif hébreu et l’image vivante du verbe. Aucun contenu théologique ou interprétatif supplémentaire n’est introduit.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : lamentation exclamative, personnification féminine de la cité, métaphore explicite de la prostitution, contraste entre le droit, la justice qui résidait dans la cité, et les meurtriers. « Droit » pour מִשְׁפָּט et « justice » pour צֶדֶק constituent une distinction française défendable dans ce parallélisme. La formulation finale actuelle, « ce sont des meurtriers », ne rend toutefois pas clairement l’ellipse liée au lieu où la justice « logeait » et produit une construction sémantiquement maladroite en français.'
  naturalness: Le registre est moderne, soutenu et approprié à la poésie prophétique. « Passait la nuit chez elle » est compréhensible, mais « chez elle » atténue le locatif de la ville et s’accorde moins bien avec la note disant « en elle ». « Logeait en elle » conserve l’image de résidence et s’intègre plus naturellement au contraste final. L’ajout prudent de « y habitent » rend explicite en français le prédicat elliptique attendu sans modifier le sens.
  terminology: « Cité fidèle », « prostituée », « droit », « justice » et « meurtriers » sont exacts et de registre adéquat. La métaphore sexuelle est préservée sans surcharge interprétative. Aucun enjeu doctrinal n’est imposé.
  issues:
  - severity: medium
    issue: La clausule « mais maintenant, ce sont des meurtriers » est elliptique de manière ambiguë et peu idiomatique.
    rationale: En français, la tournure présentative peut laisser entendre une identification de la cité avec des meurtriers plutôt que leur présence en elle. L’hébreu oppose la résidence passée de la justice à la présence actuelle des meurtriers ; « des meurtriers y habitent » explicite seulement ce rapport contextuellement implicite.
  - severity: low
    issue: « chez elle » ne correspond pas pleinement au locatif « en elle » et ne concorde pas avec la note.
    rationale: La ville est personnifiée, ce qui autorise « chez elle », mais « en elle » garde plus directement l’image spatiale hébraïque et la cohérence de l’annotation.
  revised_text: Comment la cité fidèle est-elle devenue une prostituée ! Elle était pleine de droit ; la justice logeait en elle[a], mais maintenant, des meurtriers y habitent !
  revised_footnotes:
