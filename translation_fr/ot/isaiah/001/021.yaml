    text: 'Littéralement : « la justice passait la nuit en elle » ; le verbe évoque le fait de passer la nuit ou de loger quelque part.'
    reason: lexical_alternative
  revision_rationale: 'La révision remplace une clausule française ambiguë par une formulation qui exprime naturellement le contraste spatial et temporel porté par le verset : la justice résidait autrefois dans la cité, tandis que des meurtriers y résident maintenant. « Logeait en elle » préserve à la fois le locatif hébreu et l’image vivante du verbe. Aucun contenu théologique ou interprétatif supplémentaire n’est introduit.'
