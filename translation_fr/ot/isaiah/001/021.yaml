  text: אֵיכָה֙ הָיְתָ֣ה לְ/זוֹנָ֔ה קִרְיָ֖ה נֶאֱמָנָ֑ה מְלֵאֲתִ֣י מִשְׁפָּ֗ט צֶ֛דֶק יָלִ֥ין בָּ֖/הּ וְ/עַתָּ֥ה מְרַצְּחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/021.yaml
  text: How the faithful city has become a prostitute! She was full of justice[a]; righteousness lodged in her[c][b], but now murderers.
translation:
  language: fr
  text: Comment la cité fidèle est-elle devenue une prostituée ! Elle était pleine de droit ; la justice logeait en elle[a], mais maintenant, des meurtriers y habitent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la justice passait la nuit en elle » ; le verbe évoque le fait de passer la nuit ou de loger quelque part.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Comment
  rationale: Introduit une lamentation exclamative devant un renversement saisissant, et non une demande d’information.
- source_word: הָיְתָה לְזוֹנָה
  choice: est-elle devenue une prostituée
  rationale: Exprime le changement d’état accompli et conserve sans l’atténuer la métaphore frappante de l’infidélité et de la corruption de la ville.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: la cité fidèle
  rationale: « Cité » convient au registre poétique, tandis que « fidèle » préserve le contraste moral avec l’état présent de Jérusalem.
- source_word: מְלֵאֲתִי מִשְׁפָּט
  choice: Elle était pleine de droit
  rationale: Le mot מִשְׁפָּט désigne ici l’ordre juste, notamment judiciaire et social ; « droit » le distingue naturellement de צֶדֶק dans le membre parallèle.
- source_word: צֶדֶק
  choice: la justice
  rationale: Dans ce contexte éthique et social, « justice » est naturel en français tout en gardant la proximité sémantique avec מִשְׁפָּט.
- source_word: יָלִין בָּהּ
  choice: passait la nuit chez elle
  rationale: Rend concrètement le verbe qui évoque le fait de passer la nuit ou de loger, en conservant la personnification de la justice.
- source_word: וְעַתָּה מְרַצְּחִים
  choice: mais maintenant, ce sont des meurtriers
  rationale: « Mais maintenant » explicite le contraste ; la tournure présentative française restitue l’ellipse hébraïque sans ajouter un lieu ou un verbe absent du texte.
theological_decisions:
- issue: Métaphore sexuelle appliquée à l’infidélité de Jérusalem
  choice: Conserver explicitement « devenue une prostituée »
  alternative: « devenue infidèle » ou « devenue comme une prostituée »
  rationale: L’hébreu emploie directement une image forte pour la corruption morale de la ville personnifiée. La généraliser ou ajouter « comme » en atténuerait indûment la portée.
- issue: Rapport entre מִשְׁפָּט et צֶדֶק
  choice: Les rendre respectivement par « droit » et « justice »
  alternative: « justice » et « droiture »
  rationale: Les champs sémantiques se recouvrent. Le choix retenu maintient la distinction poétique sans imposer une opposition théologique trop précise.
translation_notes:
  register: Français moderne, poétique et digne. « Cité » garde la tonalité prophétique sans archaïsme marqué. La ponctuation et la tournure finale préservent le contraste abrupt de l’hébreu.
