  text: שָׂרַ֣יִ/ךְ סוֹרְרִ֗ים וְ/חַבְרֵי֙ גַּנָּבִ֔ים כֻּלּ/וֹ֙ אֹהֵ֣ב שֹׁ֔חַד וְ/רֹדֵ֖ף שַׁלְמֹנִ֑ים יָתוֹם֙ לֹ֣א יִשְׁפֹּ֔טוּ וְ/רִ֥יב אַלְמָנָ֖ה לֹֽא יָב֥וֹא אֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/023.yaml
  text: Your rulers are rebels and companions of thieves[a]; every one of them loves a bribe and runs after payments. They do not defend the orphan[c][b], and the widow’s case does not come before them.
translation:
  language: fr
  text: Tes dirigeants sont des rebelles et des associés de voleurs[a] ; chacun d’eux aime les pots-de-vin et court après les rétributions[b]. Ils ne rendent pas justice à l’orphelin[c], et la cause de la veuve ne leur parvient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tes princes sont rebelles et compagnons de voleurs ».
    reason: lexical_alternative
  - marker: b
    text: Ou « poursuit les récompenses » ou « les paiements » ; le terme hébreu peut désigner des rétributions, des présents ou des compensations, probablement recherchés ici dans un contexte de corruption.
    reason: lexical_alternative
  - marker: c
    text: Ou « Ils ne défendent pas l’orphelin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרַיִךְ
  choice: tes dirigeants
  rationale: שַׂר désigne ici ceux qui exercent l’autorité. « Dirigeants » est actuel, clair et adapté au contexte civique, sans la coloration dynastique que peut avoir « princes ».
- source_word: סוֹרְרִים
  choice: sont des rebelles
  rationale: Le participe issu de סרר exprime la rébellion, l’insoumission ou l’obstination. Le substantif « rebelles » conserve la force de l’accusation.
- source_word: וְחַבְרֵי גַּנָּבִים
  choice: et des associés de voleurs
  rationale: La construction désigne des compagnons ou associés de voleurs. « Associés » exprime leur alliance corrompue sans affirmer nécessairement qu’ils commettent eux-mêmes les vols.
- source_word: כֻּלּוֹ
  choice: chacun d’eux
  rationale: La forme singulière a ici une valeur distributive portant sur tout le groupe ; « chacun d’eux » rend clairement cette portée en français.
- source_word: אֹהֵב שֹׁחַד
  choice: aime les pots-de-vin
  rationale: שֹׁחַד désigne un présent corrupteur. Le pluriel générique « les pots-de-vin » est idiomatique en français après « chacun d’eux ».
- source_word: וְרֹדֵף שַׁלְמֹנִים
  choice: et court après les rétributions
  rationale: רדף signifie poursuivre ou courir après. Le terme rare שַׁלְמֹנִים peut désigner des paiements, récompenses ou compensations ; « rétributions » en conserve la relative indétermination, tandis que le contexte leur donne une portée corrompue.
- source_word: יָתוֹם לֹא יִשְׁפֹּטוּ
  choice: ils ne rendent pas justice à l’orphelin
  rationale: Dans ce contexte judiciaire, שׁפט ne signifie pas seulement prononcer un jugement, mais faire droit à une personne vulnérable. « Rendre justice » préserve cette fonction sans transformer le verbe en simple défense personnelle.
- source_word: וְרִיב אַלְמָנָה
  choice: et la cause de la veuve
  rationale: רִיב peut désigner un litige, une plainte ou une affaire judiciaire. « Cause » convient au cadre juridique et reste naturel en français.
- source_word: לֹא יָבוֹא אֲלֵיהֶם
  choice: ne leur parvient pas
  rationale: L’hébreu dit littéralement que la cause ne vient pas jusqu’à eux. « Ne leur parvient pas » conserve cette formulation, qui peut évoquer soit le défaut d’accès, soit leur refus de l’entendre.
