id: ISA.1.17
reference: Isaiah 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לִמְד֥וּ הֵיטֵ֛ב דִּרְשׁ֥וּ מִשְׁפָּ֖ט אַשְּׁר֣וּ חָמ֑וֹץ שִׁפְט֣וּ יָת֔וֹם רִ֖יבוּ אַלְמָנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/017.yaml
  text: Learn to do good; seek justice[a], correct the oppressor; judge for the fatherless, plead for the widow.
translation:
  language: fr
  text: Apprenez à faire le bien ; recherchez la justice, redressez l’oppresseur[a] ; rendez justice à l’orphelin, défendez la cause de la veuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secourez l’opprimé » ou « rétablissez l’opprimé dans son droit ». L’expression hébraïque est difficile, et חָמוֹץ peut être compris de différentes manières.
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְדוּ הֵיטֵב
  choice: Apprenez à faire le bien
  rationale: L’impératif pluriel לִמְדוּ appelle à un apprentissage concret, tandis que הֵיטֵב exprime ici l’action bonne. Cette formulation française restitue naturellement l’exhortation éthique.
- source_word: דִּרְשׁוּ מִשְׁפָּט
  choice: recherchez la justice
  rationale: דִּרְשׁוּ exprime une recherche active et מִשְׁפָּט désigne, dans ce contexte prophétique et social, la justice plutôt que le seul jugement judiciaire.
- source_word: אַשְּׁרוּ חָמוֹץ
  choice: redressez l’oppresseur
  rationale: אַשְּׁרוּ peut signifier mettre droit ou redresser, et חָמוֹץ peut recevoir un sens actif, « oppresseur ». Le choix conserve une tournure brève ainsi que l’image de rectification, sans masquer l’incertitude lexicale signalée en note.
- source_word: שִׁפְטוּ יָתוֹם
  choice: rendez justice à l’orphelin
  rationale: שִׁפְטוּ a ici une portée judiciaire favorable au bénéficiaire. « Rendez justice à » est plus idiomatique en français moderne que « jugez pour », tout en conservant la dimension juridique. יָתוֹם désigne l’enfant privé de père ; « orphelin » est le terme français courant dans cette catégorie sociale biblique.
- source_word: רִיבוּ אַלְמָנָה
  choice: défendez la cause de la veuve
  rationale: רִיבוּ évoque l’action de plaider ou de soutenir une cause en justice. La formulation retenue est naturelle, claire et conserve la nuance d’assistance juridique.
theological_decisions:
- issue: Interprétation de אַשְּׁרוּ חָמוֹץ
  choice: redressez l’oppresseur
  alternative: secourez l’opprimé ; rétablissez l’opprimé dans son droit
  rationale: Le sens actif de חָמוֹץ, « oppresseur », est retenu dans le texte, avec אַשְּׁרוּ compris comme « redresser ». Toutefois, le mot hébreu peut être interprété passivement, « opprimé ». La note préserve cette ambiguïté réelle plutôt que de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. La série d’impératifs et la tonalité juridique du texte hébreu sont maintenues, avec des formulations idiomatiques accessibles.
