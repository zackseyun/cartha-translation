id: ISA.1.20
reference: Isaiah 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אִם תְּמָאֲנ֖וּ וּ/מְרִיתֶ֑ם חֶ֣רֶב תְּאֻכְּל֔וּ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/020.yaml
  text: But if you refuse and rebel[a], you will be devoured by the sword; for the mouth of Yahweh has spoken.
translation:
  language: fr
  text: Mais si vous refusez et vous vous rebellez, vous serez dévorés par l’épée[a], car la bouche de Yahweh a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vous serez mangés par l’épée ». Cette formulation crée un contraste délibéré avec le verset précédent, où il est promis : « vous mangerez ce qu’il y a de bon dans le pays ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Mais si
  rationale: La conjonction relie cet avertissement à la promesse conditionnelle du verset 19. « Mais si » exprime naturellement en français le contraste et conserve la valeur conditionnelle.
- source_word: תְּמָאֲנוּ
  choice: vous refusez
  rationale: Le verbe מאן exprime le refus ou le manque de volonté. « Refusez » est direct et convient à la vigueur de l’avertissement.
- source_word: וּמְרִיתֶם
  choice: et vous révoltez
  rationale: Le verbe מרה désigne une attitude de rébellion ou de défi. « Vous révoltez » en garde le caractère actif sans atténuer la désobéissance.
- source_word: חֶרֶב
  choice: l’épée
  rationale: L’image prophétique de l’épée évoque ici la mort violente et le jugement. La traduction concrète conserve mieux cette force que le terme abstrait « guerre ».
- source_word: תְּאֻכְּלוּ
  choice: vous serez dévorés
  rationale: 'Le passif du verbe « manger » renverse délibérément la promesse du verset 19 : au lieu de manger les biens du pays, les rebelles seront eux-mêmes « mangés » par l’épée. « Dévorés » est naturel en français tout en préservant cette image.'
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit le fondement solennel de l’avertissement divin.
- source_word: פִּי יְהוָה
  choice: la bouche de Yahweh
  rationale: La formulation concrète de l’hébreu souligne que cet oracle vient directement de Dieu. Conserver « bouche » maintient cette image anthropomorphique et sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est transcrit afin de représenter explicitement le tétragramme présent dans le texte hébreu.
- source_word: דִּבֵּר
  choice: a parlé
  rationale: Le parfait présente la déclaration comme ferme et certaine. « A parlé » rend naturellement en français la formule prophétique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel
  rationale: Le texte emploie directement le nom divin. « Yahweh » le représente comme un nom propre plutôt que de le remplacer par un titre traditionnel.
- issue: Maintien de l’image « manger/dévorer »
  choice: vous serez dévorés par l’épée
  alternative: vous périrez par l’épée
  rationale: La formulation retenue conserve le renversement théologique et rhétorique par rapport au verset 19, sans réduire l’image à sa seule conséquence.
translation_notes:
  register: Français international moderne, direct et solennel. La syntaxe reste claire pour un large public tout en conservant l’image prophétique concrète et le contraste verbal avec le verset 19.
