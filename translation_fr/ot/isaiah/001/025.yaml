revisions:
- from: Je tournerai ma main contre toi[a] ; je purifierai tes scories comme avec de la potasse[b], et j’enlèverai tout ton métal impur[c].
  to: Je tournerai ma main contre toi[a] ; je ferai fondre tes scories comme avec de la potasse[b], et j’enlèverai tout ton étain[c].
  rationale: La révision corrige la relation entre le verbe d’affinage et les « scories », sans atténuer l’action judiciaire ni transformer l’image en explication. Elle remplace aussi le terme interprétatif « métal impur » par le sens spécifique possible « étain », tout en maintenant l’ambiguïté contextuelle dans la note.
