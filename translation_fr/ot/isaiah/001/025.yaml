source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה יָדִ/י֙ עָלַ֔יִ/ךְ וְ/אֶצְרֹ֥ף כַּ/בֹּ֖ר סִיגָ֑יִ/ךְ וְ/אָסִ֖ירָה כָּל בְּדִילָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/025.yaml
  text: I will turn my hand against you[a], and I will smelt away your dross as with lye[c][b], and remove all your alloy.
translation:
  language: fr
  text: Je tournerai ma main contre toi[a] ; je ferai fondre tes scories comme avec de la potasse[b], et j’enlèverai tout ton étain[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur toi ». L’expression hébraïque peut annoncer une action punitive ou une intervention purificatrice ; ici, l’image de l’affinage associe le jugement à la purification.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu désigne un alcali employé pour nettoyer ou traiter les matières ; on pourrait aussi traduire « avec un alcali » ou « comme avec de la lessive ».
    reason: lexical_alternative
  - marker: c
    text: Le terme peut désigner « ton étain » ; dans ce contexte, il peut aussi évoquer plus largement des métaux d’alliage inférieurs mêlés au métal précieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Je tournerai
  rationale: Le hiphil de שוב, associé ici à « ma main », exprime le fait de diriger de nouveau ou de tourner sa main vers quelqu’un. Cette formulation conserve l’image hébraïque sans la réduire à une simple restauration.
- source_word: יָדִי
  choice: ma main
  rationale: L’anthropomorphisme hébreu désigne l’action et la puissance divines ; le conserver respecte la force poétique du texte.
- source_word: עָלַיִךְ
  choice: contre toi
  rationale: La préposition על peut signifier « sur » ou, dans ce contexte judiciaire, « contre ». Le contexte immédiat justifie le sens adversatif, tandis qu’une note préserve l’ambiguïté de l’expression.
- source_word: וְאֶצְרֹף
  choice: je purifierai
  rationale: צרף appartient au vocabulaire métallurgique de la fonte et de l’affinage. « Purifierai » rend clairement le but du procédé tout en restant lié aux « scories ».
- source_word: כַּבֹּר
  choice: comme avec de la potasse
  rationale: בֹּר désigne une substance alcaline employée pour nettoyer ou traiter les matières. « Potasse » est un terme français précis et compréhensible ; « comme avec » maintient la comparaison marquée par כ.
- source_word: סִיגָיִךְ
  choice: tes scories
  rationale: סיגים désigne les résidus ou impuretés issus de l’affinage des métaux. « Scories » conserve exactement la métaphore métallurgique.
- source_word: וְאָסִירָה
  choice: et j’enlèverai
  rationale: Le hiphil de סור signifie faire disparaître ou ôter. « Enlèverai » est naturel et exprime directement l’élimination.
- source_word: כָּל
  choice: tout
  rationale: Le terme marque la totalité et est rendu explicitement.
- source_word: בְּדִילָיִךְ
  choice: ton métal impur
  rationale: בדיל peut désigner précisément l’étain ou, dans ce contexte, un métal inférieur mêlé au métal précieux. « Métal impur » rend sa fonction dans l’image sans imposer une identification trop étroite.
theological_decisions:
- issue: Nature de l’intervention divine
  choice: Un jugement sévère qui vise aussi la purification
  alternative: Un jugement uniquement destructeur, ou au contraire une restauration dépourvue de dimension punitive
  rationale: L’expression « tourner ma main contre toi » a une force judiciaire, tandis que l’affinage et l’élimination des impuretés indiquent une visée purificatrice. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, sobre et poétique. La structure en trois propositions conserve le parallélisme hébreu. Le tutoiement féminin singulier adressé à la ville est naturellement représenté par « toi », sans marquage de genre visible en français.
