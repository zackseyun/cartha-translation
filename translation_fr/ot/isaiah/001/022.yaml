  text: כַּסְפֵּ֖/ךְ הָיָ֣ה לְ/סִיגִ֑ים סָבְאֵ֖/ךְ מָה֥וּל בַּ/מָּֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/022.yaml
  text: Your silver has become dross[a]; your wine is diluted with water.
translation:
  language: fr
  text: Ton argent est devenu des scories ; ton vin[a] est coupé d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ta boisson enivrante ». Le terme hébreu peut désigner le vin ou, plus largement, une boisson alcoolisée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפֵּךְ
  choice: ton argent
  rationale: כֶּסֶף désigne ici l’argent métal plutôt que la monnaie ; ce sens concret maintient l’image métallurgique créée par « scories ». Le possessif singulier correspond à l’adresse faite à Jérusalem personnifiée.
- source_word: הָיָה לְסִיגִים
  choice: est devenu des scories
  rationale: Le qatal הָיָה présente l’état résultant, tandis que סִיגִים désigne les résidus ou impuretés issus du travail du métal. « Est devenu des scories » rend naturellement l’accusation et conserve le pluriel hébreu.
- source_word: סָבְאֵךְ
  choice: ton vin
  rationale: סֹבֶא désigne une boisson alcoolisée, souvent comprise comme du vin ou une boisson enivrante. « Vin » convient au contexte de dilution par l’eau, sans masquer l’étendue possible du terme, signalée en note.
- source_word: מָהוּל בַּמָּיִם
  choice: est coupé d’eau
  rationale: מָהוּל signifie « mélangé, dilué ». En français actuel, « couper du vin d’eau » exprime précisément et avec naturel l’adultération dénoncée ; בַּמָּיִם indique ce avec quoi la boisson est mélangée.
