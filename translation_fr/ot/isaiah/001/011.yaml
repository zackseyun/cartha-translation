id: ISA.1.11
reference: Isaiah 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/מָּה לִּ֤/י רֹב זִבְחֵי/כֶם֙ יֹאמַ֣ר יְהוָ֔ה שָׂבַ֛עְתִּי עֹל֥וֹת אֵילִ֖ים וְ/חֵ֣לֶב מְרִיאִ֑ים וְ/דַ֨ם פָּרִ֧ים וּ/כְבָשִׂ֛ים וְ/עַתּוּדִ֖ים לֹ֥א חָפָֽצְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/011.yaml
  text: Why are your many sacrifices to me? says Yahweh[a]. I have had enough of burnt offerings of rams and the fat of fattened animals[b]; and in the blood of bulls and lambs and goats I do not delight.
translation:
  language: fr
  text: « Que m’importe la multitude de vos sacrifices ? » dit Yahweh[a]. « Je suis rassasié des holocaustes de béliers et de la graisse des bêtes engraissées. Je ne prends aucun plaisir au sang des taureaux, des agneaux et des boucs[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « Pourquoi pour moi la multitude de vos sacrifices ? » On peut aussi comprendre : « À quoi me servent tous vos sacrifices ? »'
    reason: lexical_alternative
  - marker: b
    text: Le terme traduit par « boucs » désigne des chèvres mâles.
    reason: lexical_clarification
lexical_decisions:
- source_word: לָמָּה לִּי
  choice: Que m’importe… ?
  rationale: Cette tournure française naturelle conserve la force rhétorique de l’expression hébraïque, qui demande quelle valeur ou quelle utilité ces sacrifices ont pour Yahweh, sans la réduire à une simple demande d’information causale.
- source_word: רֹב זִבְחֵיכֶם
  choice: la multitude de vos sacrifices
  rationale: רֹב souligne l’abondance ou le grand nombre, tandis que זִבְחֵיכֶם désigne les sacrifices offerts par les destinataires.
- source_word: יֹאמַר יְהוָה
  choice: dit Yahweh
  rationale: Le présent français « dit » convient à la formule prophétique et le nom divin est translittéré « Yahweh ».
- source_word: שָׂבַעְתִּי
  choice: Je suis rassasié
  rationale: Le verbe exprime le fait d’être rempli jusqu’à satiété; « rassasié » préserve l’image et, dans ce contexte, la nuance de rejet.
- source_word: עֹלוֹת אֵילִים
  choice: les holocaustes de béliers
  rationale: « Holocaustes » est le terme français usuel pour les sacrifices entièrement brûlés, et אֵילִים désigne des béliers.
- source_word: חֵלֶב מְרִיאִים
  choice: la graisse des bêtes engraissées
  rationale: חֵלֶב signifie « graisse » et מְרִיאִים désigne des animaux bien nourris ou engraissés; « bêtes » reste naturel sans préciser une espèce absente de l’hébreu.
- source_word: דַם פָּרִים וּכְבָשִׂים וְעַתּוּדִים
  choice: au sang des taureaux, des agneaux et des boucs
  rationale: La liste rend concrètement les trois catégories animales; עַתּוּדִים désigne plus précisément des boucs, c’est-à-dire des chèvres mâles.
- source_word: לֹא חָפָצְתִּי
  choice: Je ne prends aucun plaisir
  rationale: La formule exprime l’absence de plaisir, d’agrément ou de désir; cette traduction française est claire et conserve la portée évaluative du verbe.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre et évite de le remplacer par un titre.
- issue: Portée du rejet des sacrifices
  choice: Traduire directement le dégoût et l’absence de plaisir sans ajouter d’explication
  alternative: Préciser que seuls les sacrifices hypocrites ou offerts sans repentance sont rejetés
  rationale: Le contexte plus large éclaire la dénonciation, mais le verset lui-même formule le rejet avec une force absolue. La traduction ne doit pas introduire dans le corps du texte une qualification absente de cette phrase.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Les guillemets structurent la parole divine. « Que m’importe » restitue l’interpellation rhétorique avec naturel; « rassasié » et « holocaustes » gardent la densité cultuelle et imagée de l’hébreu.
