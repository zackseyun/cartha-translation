source:
  edition: WLC
  text: אַרְצְ/כֶ֣ם שְׁמָמָ֔ה עָרֵי/כֶ֖ם שְׂרֻפ֣וֹת אֵ֑שׁ אַדְמַתְ/כֶ֗ם לְ/נֶגְדְּ/כֶם֙ זָרִים֙ אֹכְלִ֣ים אֹתָ֔/הּ וּ/שְׁמָמָ֖ה כְּ/מַהְפֵּכַ֥ת זָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/007.yaml
  text: Your land is a desolation[a]; your cities are burned with fire. Your soil—before your very eyes—strangers are devouring it, and it is a desolation[b], like an overthrow by strangers.
translation:
  language: fr
  text: Votre pays est dévasté ; vos villes sont incendiées. Votre sol, sous vos yeux, des étrangers le dévorent ; il est dévasté, comme un bouleversement lié à des étrangers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un renversement d’étrangers ». La formule hébraïque est ambiguë : elle peut évoquer un bouleversement causé par des étrangers ou le renversement d’étrangers ; certains y voient une allusion au renversement de Sodome.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְצְכֶם
  choice: votre pays
  rationale: אֶרֶץ désigne ici l’ensemble du territoire national ; « pays » convient naturellement au contraste avec les villes et le sol.
- source_word: שְׁמָמָה
  choice: est dévasté
  rationale: Le nom hébreu décrit un état de désolation. La tournure adjectivale française est naturelle tout en gardant la force du jugement.
- source_word: עָרֵיכֶם שְׂרֻפוֹת אֵשׁ
  choice: vos villes sont incendiées
  rationale: « Incendiées » exprime idiomatiquement le passif accompagné de « feu », sans la lourdeur de « brûlées par le feu ».
- source_word: אַדְמַתְכֶם
  choice: votre sol
  rationale: « Sol » distingue l’אֲדָמָה productive de l’אֶרֶץ, le pays, mentionné au début.
- source_word: לְנֶגְדְּכֶם
  choice: sous vos yeux
  rationale: Cette expression française rend la proximité visible et l’impuissance des destinataires.
- source_word: זָרִים
  choice: des étrangers
  rationale: Le mot désigne des personnes extérieures au peuple ou au territoire ; la même traduction est maintenue aux deux occurrences.
- source_word: אֹכְלִים אֹתָהּ
  choice: le dévorent
  rationale: Le verbe « dévorer » conserve l’image de la consommation prédatrice du sol ou de ses produits.
- source_word: כְּמַהְפֵּכַת זָרִים
  choice: comme après un renversement causé par des étrangers
  rationale: Cette formulation française comprend זָרִים comme les auteurs du renversement, tout en signalant en note l’ambiguïté de la construction.
theological_decisions:
- issue: Interprétation de כְּמַהְפֵּכַת זָרִים
  choice: comme après un renversement causé par des étrangers
  alternative: comme lors du renversement d’étrangers ; ou, selon certains, comme lors du renversement de Sodome
  rationale: La construction hébraïque condensée permet plusieurs rapports entre « renversement » et « étrangers ». Le texte principal maintient le parallèle avec les étrangers qui dévorent le sol, sans transformer en certitude une éventuelle allusion à Sodome.
translation_notes:
  register: Français international moderne, sobre et solennel. Le déplacement de « votre sol » en tête de proposition reproduit la mise en relief hébraïque. « Pays », « villes » et « sol » préservent les distinctions concrètes du texte source.
