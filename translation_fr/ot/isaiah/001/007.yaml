revisions:
- from: Votre pays est dévasté ; vos villes sont incendiées. Votre sol, sous vos yeux, des étrangers le dévorent ; il est dévasté, comme après un renversement causé par des étrangers.[a]
  to: Votre pays est dévasté ; vos villes sont incendiées. Votre sol, sous vos yeux, des étrangers le dévorent ; il est dévasté, comme un bouleversement lié à des étrangers.[a]
  rationale: La révision se limite à la dernière comparaison et à sa note. Elle retire les ajouts interprétatifs « après » et « causé par », tout en conservant en français une relation volontairement non spécifiée entre le bouleversement et les étrangers. Les autres choix du projet sont fidèles, naturels et terminologiquement cohérents.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:19:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le verset rend correctement les éléments principaux : pays/territoire, villes brûlées, sol mis en relief, consommation par des étrangers sous les yeux des destinataires et état de désolation. Toutefois, « comme après un renversement causé par des étrangers » ajoute à la formule hébraïque à la fois une relation temporelle (« après ») et une causalité déterminée (« causé par »). La construction כְּמַהְפֵּכַת זָרִים est réellement ambiguë et ne permet pas d''affirmer ces deux précisions dans le texte principal.'
  naturalness: Le français est globalement naturel, sobre et adapté à un registre prophétique moderne. « Sous vos yeux » et « des étrangers le dévorent » sont particulièrement efficaces. « Comme un bouleversement lié à des étrangers » est plus prudent que la formulation actuelle tout en restant intelligible en français contemporain.
  terminology: « Pays », « villes », « sol », « étrangers » et « dévorent » sont des choix justes et cohérents. « Dévasté » rend convenablement שְׁמָמָה dans les deux occurrences. « Bouleversement » exprime naturellement la catastrophe désignée par מַהְפֵּכָה sans imposer l'identification à Sodome.
  issues:
  - severity: medium
    issue: La clausule finale surinterprète la relation entre « renversement » et « étrangers ».
    rationale: Le texte hébreu dit littéralement, de manière condensée, « comme un renversement d'étrangers ». La traduction « comme après un renversement causé par des étrangers » introduit « après » et fixe les étrangers comme agents. Il convient de conserver l'ambiguïté dans le texte et d'expliquer les lectures possibles en note.
  revised_text: Votre pays est dévasté ; vos villes sont incendiées. Votre sol, sous vos yeux, des étrangers le dévorent ; il est dévasté, comme un bouleversement lié à des étrangers.[a]
  revised_footnotes:
