  text: לֹ֣א תוֹסִ֗יפוּ הָבִיא֙ מִנְחַת שָׁ֔וְא קְטֹ֧רֶת תּוֹעֵבָ֛ה הִ֖יא לִ֑/י חֹ֤דֶשׁ וְ/שַׁבָּת֙ קְרֹ֣א מִקְרָ֔א לֹא אוּכַ֥ל אָ֖וֶן וַ/עֲצָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/013.yaml
  text: Do not continue bringing worthless grain offerings[a]; incense is an abomination to me. New moon and Sabbath[b], the calling of an assembly—I cannot endure iniquity and solemn assembly.
translation:
  language: fr
  text: 'Ne continuez pas à apporter des offrandes de céréales sans valeur[a] ; l’encens m’est abominable. Nouvelle lune, sabbat, convocation d’une assemblée : je ne peux supporter l’iniquité et l’assemblée solennelle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des offrandes vaines » ou « des offrandes vides ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ne peux supporter l’iniquité jointe à l’assemblée solennelle ». L’hébreu est concis et peut souligner l’incompatibilité entre le mal et la réunion cultuelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: תוֹסִיפוּ הָבִיא
  choice: continuez à apporter
  rationale: Le hiphil de יסף suivi d’un infinitif exprime ici la continuation d’une action ; cette tournure en conserve naturellement la valeur itérative.
- source_word: מִנְחַת שָׁוְא
  choice: des offrandes de céréales sans valeur
  rationale: מִנְחָה désigne souvent, dans le contexte cultuel, une offrande de céréales, tandis que שָׁוְא évoque ce qui est vain, vide ou sans valeur.
- source_word: קְטֹרֶת
  choice: l’encens
  rationale: Le terme désigne directement l’encens dans ce contexte cultuel.
- source_word: תּוֹעֵבָה הִיא לִי
  choice: m’est abominable
  rationale: Cette formulation garde la grande force de תּוֹעֵבָה tout en étant idiomatique en français actuel.
- source_word: חֹדֶשׁ
  choice: Nouvelle lune
  rationale: Dans ce calendrier cultuel, le mot désigne la célébration liée à la nouvelle lune.
- source_word: שַׁבָּת
  choice: sabbat
  rationale: « Sabbat » est le terme français courant et précis pour le jour cultuel visé.
- source_word: קְרֹא מִקְרָא
  choice: convocation d’une assemblée
  rationale: La formulation rend la construction associant le verbe « convoquer » et le nom apparenté, sans alourdir excessivement le français.
- source_word: לֹא אוּכַל
  choice: je ne peux supporter
  rationale: Bien que le verbe signifie littéralement « pouvoir », le contexte exprime ici ce qui est intolérable.
- source_word: אָוֶן
  choice: l’iniquité
  rationale: Le terme peut désigner le mal, la perversité ou le malheur ; ici, « iniquité » conserve son poids moral dans la dénonciation prophétique.
- source_word: וַעֲצָרָה
  choice: et l’assemblée solennelle
  rationale: עֲצָרָה désigne une réunion religieuse solennelle, souvent liée à une fête.
theological_decisions:
- issue: Rapport entre la conduite pécheresse et le culte dans la dernière proposition
  choice: je ne peux supporter l’iniquité et l’assemblée solennelle
  alternative: je ne peux supporter l’iniquité jointe à l’assemblée solennelle
  rationale: L’hébreu juxtapose אָוֶן et עֲצָרָה sans préposition explicite. La coordination maintient la concision et la tension du texte ; une note signale l’interprétation associative possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire cultuel reste précis, et la syntaxe brève de la dernière proposition préserve l’ambiguïté réelle de l’hébreu.
