source:
  edition: WLC
  text: כִּ֣י יֵבֹ֔שׁוּ מֵ/אֵילִ֖ים אֲשֶׁ֣ר חֲמַדְתֶּ֑ם וְ/תַ֨חְפְּר֔וּ מֵ/הַ/גַּנּ֖וֹת אֲשֶׁ֥ר בְּחַרְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/029.yaml
  text: For you will be ashamed of the oaks that you desired[a], and you will be disgraced because of the gardens that you chose.
translation:
  language: fr
  text: Car ils auront honte des grands arbres que vous avez désirés[a], et vous serez humiliés à cause des jardins que vous avez choisis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu peut désigner des chênes, des térébinthes ou, plus généralement, de grands arbres, probablement associés ici à un culte illicite. Le texte massorétique dit littéralement « ils auront honte », puis revient à « vous » dans la suite du verset; cette rupture de personne est conservée dans la traduction.
    reason: Incertitude lexicale concernant l’espèce d’arbre et changement de personne grammaticale dans le texte massorétique.
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication du jugement annoncé dans le contexte précédent, avec une articulation naturelle en français.
- source_word: יֵבֹשׁוּ
  choice: vous aurez honte
  rationale: Bien que la forme massorétique soit à la troisième personne du pluriel, le parallélisme avec les formes à la deuxième personne et le contexte soutiennent une adresse directe au même groupe. « Aurez honte » exprime naturellement בוש.
- source_word: מֵאֵילִים
  choice: des grands arbres
  rationale: אֵילִים désigne ici vraisemblablement de grands arbres associés à des pratiques cultuelles. L’espèce exacte étant incertaine, « grands arbres » évite une précision botanique injustifiée; les possibilités traditionnelles sont signalées en note.
- source_word: אֲשֶׁר חֲמַדְתֶּם
  choice: que vous désiriez
  rationale: חמד exprime un désir marqué ou l’attrait éprouvé pour quelque chose. L’imparfait français convient à l’attachement antérieur qui deviendra motif de honte.
- source_word: וְתַחְפְּרוּ
  choice: et vous rougirez
  rationale: חפר évoque le fait d’être confus ou couvert de honte. « Rougirez » conserve une image distincte de « aurez honte » tout en restant idiomatique et digne.
- source_word: מֵהַגַּנּוֹת
  choice: à cause des jardins
  rationale: Après un verbe de honte, מִן indique ici ce qui en est la cause. « À cause de » rend clairement cette relation en français.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: que vous aviez choisis
  rationale: בחר signifie simplement « choisir ». Le plus-que-parfait marque naturellement que ce choix précède la honte future, sans modifier le sens fondamental.
theological_decisions:
- issue: Fonction des grands arbres et des jardins
  choice: Conserver dans le texte les images concrètes sans ajouter explicitement « sacrés » ou « idolâtres ».
  alternative: Traduire de manière interprétative par « arbres sacrés » et « jardins cultuels ».
  rationale: Le contexte prophétique rend très probable une référence à des lieux de culte illicite, mais les noms hébreux eux-mêmes disent simplement « arbres » et « jardins ». La traduction préserve cette retenue, tandis que la note indique le contexte vraisemblable.
- issue: Personne grammaticale de יֵבֹשׁוּ
  choice: Rendre par la deuxième personne du pluriel, en accord avec les autres verbes du verset.
  alternative: Traduire littéralement la forme massorétique par « ils auront honte », puis passer à « vous rougirez ».
  rationale: La troisième personne de יֵבֹשׁוּ crée une tension textuelle réelle, mais le parallélisme immédiat avec חֲמַדְתֶּם, תַחְפְּרוּ et בְּחַרְתֶּם favorise fortement une adresse continue à « vous ». La note préserve l’anomalie grammaticale.
translation_notes:
  register: Français international moderne, clair et soutenu. « Grands arbres » privilégie l’exactitude face à l’incertitude botanique; « rougirez » maintient la variation poétique entre les deux verbes de honte. La note rattachée à [a] rend compte à la fois de l’alternative lexicale et de la tension grammaticale.
