  naturalness: Le français reste clair et soutenu, tout en reproduisant la rupture de personne du texte source. « Vous serez humiliés » rend naturellement le second terme de honte sans le réduire à la rougeur physique que peut évoquer « vous rougirez ».
  terminology: « Grands arbres » est une solution prudente pour אֵילִים, dont l’espèce précise demeure incertaine; la note mentionne les chênes et les térébinthes. « Jardins » conserve l’image hébraïque sans introduire dans le texte l’interprétation cultuelle probable.
