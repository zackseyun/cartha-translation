    rationale: « Que vous désiriez » et « que vous aviez choisis » introduisent une nuance aspectuelle distincte et asymétrique. « Que vous avez désirés/choisis » rend plus directement les parfaits hébreux et maintient le parallélisme.
  - severity: low
