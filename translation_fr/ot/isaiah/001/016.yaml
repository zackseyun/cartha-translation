id: ISA.1.16
reference: Isaiah 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רַחֲצוּ֙ הִזַּכּ֔וּ הָסִ֛ירוּ רֹ֥עַ מַעַלְלֵי/כֶ֖ם מִ/נֶּ֣גֶד עֵינָ֑/י חִדְל֖וּ הָרֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/016.yaml
  text: Wash yourselves[a]; make yourselves clean. Remove the evil of your deeds from before my eyes[b]. Stop doing evil.
translation:
  language: fr
  text: Lavez-vous[a], purifiez-vous. Ôtez de devant mes yeux[b] le mal que vous faites. Cessez de faire le mal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendez-vous purs ». Le verbe hébreu peut exprimer le fait de devenir propre ou pur.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de devant mes yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחֲצוּ
  choice: Lavez-vous
  rationale: L’impératif qal pluriel de רחץ évoque ici, dans une exhortation morale, l’action de se laver. La forme pronominale française restitue naturellement la valeur réfléchie suggérée par le contexte.
- source_word: הִזַּכּוּ
  choice: purifiez-vous
  rationale: L’impératif hitpael pluriel exprime le fait de devenir ou de se rendre propre, pur. « Purifiez-vous » est naturel, distinct de « Lavez-vous », et conserve l’image morale sans en faire un terme rituel technique.
- source_word: הָסִירוּ
  choice: Ôtez
  rationale: L’impératif hiphil de סור a ici le sens causatif d’enlever ou d’écarter. « Ôtez » convient à la construction « de devant mes yeux » et garde la vigueur de l’ordre.
- source_word: רֹעַ מַעַלְלֵיכֶם
  choice: le mal que vous faites
  rationale: Littéralement, l’expression signifie « le mal de vos actes ». La formulation française choisie en transmet clairement le sens moral et verbal, sans lourdeur.
- source_word: מִנֶּגֶד עֵינַי
  choice: de devant mes yeux
  rationale: Cette formulation suit de près l’image hébraïque, littéralement « de devant mes yeux », plutôt que de la remplacer silencieusement par l’expression plus idiomatique « loin de mon regard ».
- source_word: חִדְלוּ הָרֵעַ
  choice: Cessez de faire le mal
  rationale: חדל suivi de l’infinitif exprime la cessation d’une action. « Cessez de faire le mal » restitue directement et dignement cet impératif.
theological_decisions:
- issue: Langage de lavage et de purification morale
  choice: Conserver les impératifs « Lavez-vous » et « purifiez-vous » comme images de repentance et de réforme morale.
  alternative: Employer une formulation explicitement rituelle ou sacramentelle.
  rationale: Le contexte immédiat dénonce la conduite mauvaise de Juda et appelle à y renoncer. Le texte garde une imagerie de purification, mais ne précise ici ni rite ni sacrement.
translation_notes:
  register: Français international moderne, direct et digne. La suite d’impératifs est maintenue. « Ôtez de devant mes yeux » conserve volontairement l’image anthropomorphique de l’hébreu, tandis que « le mal que vous faites » rend idiomatiquement le sens de « le mal de vos actes ».
