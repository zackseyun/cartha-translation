  text: לְכוּ נָ֛א וְ/נִוָּֽכְחָ֖ה יֹאמַ֣ר יְהוָ֑ה אִם יִֽהְי֨וּ חֲטָאֵי/כֶ֤ם כַּ/שָּׁנִים֙ כַּ/שֶּׁ֣לֶג יַלְבִּ֔ינוּ אִם יַאְדִּ֥ימוּ כַ/תּוֹלָ֖ע כַּ/צֶּ֥מֶר יִהְיֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/018.yaml
  text: 'Come now[a], and let us reason together, says Yahweh: though your sins are like scarlet, they will become white like snow; though they are red like crimson[b], they will become like wool.'
translation:
  language: fr
  text: « Venez donc, et discutons ensemble[a] », dit Yahweh. « Même si vos péchés sont comme l’écarlate, ils deviendront blancs comme la neige ; même s’ils sont rouges comme le cramoisi[b], ils deviendront comme la laine. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « plaidons ensemble », « débattons de l’affaire » ou « réglons le différend ». Le verbe hébreu possède des nuances à la fois judiciaires et dialogiques.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « comme le ver » ou « comme l’insecte associé au cramoisi » ; le mot hébreu peut aussi désigner, par association, la teinture ou la couleur rouge produite à partir de cet insecte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: Venez donc
  rationale: L’impératif pluriel de הלך sert ici d’invitation pressante, tandis que נָא nuance l’appel. « Venez donc » est naturel et conserve cette force exhortative.
- source_word: וְנִוָּכְחָה
  choice: et discutons ensemble
  rationale: Le niphal cohortatif de יכח évoque l’examen contradictoire d’une affaire, avec des nuances à la fois dialogiques et judiciaires. « Discutons ensemble » reste accessible sans effacer cette portée, explicitée en note.
- source_word: יֹאמַר יְהוָה
  choice: dit Yahweh
  rationale: La formule prophétique hébraïque introduit directement la parole divine. « Dit » convient au français courant, et le nom propre « Yahweh » représente le tétragramme.
- source_word: אִם יִהְיוּ חֲטָאֵיכֶם
  choice: Même si vos péchés sont
  rationale: Dans le parallélisme, אִם a une valeur concessive. « Même si » en exprime clairement la force tout en gardant la structure conditionnelle de l’hébreu.
- source_word: כַּשָּׁנִים
  choice: comme l’écarlate
  rationale: שָׁנִים désigne une matière ou teinture d’un rouge éclatant. « Écarlate » rend sobrement l’image chromatique opposée à la neige.
- source_word: כַּשֶּׁלֶג יַלְבִּינוּ
  choice: ils deviendront blancs comme la neige
  rationale: La forme verbale de לבן exprime le fait de blanchir ou de devenir blanc. Cette traduction fait ressortir la transformation promise.
- source_word: אִם יַאְדִּימוּ
  choice: même s’ils sont rouges
  rationale: La forme de אדם décrit ici leur couleur rouge. Le présent français s’accorde naturellement avec la première proposition concessive.
- source_word: כַּתּוֹלָע
  choice: comme le cramoisi
  rationale: תּוֹלָע désigne littéralement l’insecte dont on tirait une teinture rouge, puis cette couleur par association. « Cramoisi » restitue l’image poétique ; la référence littérale est conservée en note.
- source_word: כַּצֶּמֶר יִהְיוּ
  choice: ils deviendront comme la laine
  rationale: La formulation conserve la comparaison concise de l’hébreu sans ajouter « blancs », qualité déjà suggérée par le parallélisme avec la neige.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme, rendu ici comme nom propre afin de préserver le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée de la transformation des péchés
  choice: Conserver l’image d’un changement de couleur sans expliciter son mécanisme théologique
  alternative: Paraphraser en termes de pardon ou de purification
  rationale: Le verset promet que ce qui est écarlate deviendra blanc, mais ne précise pas ici comment cette transformation s’opère. La traduction préserve cette tension sans importer une explication doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le discours direct met en valeur l’invitation divine et la symétrie poétique. Les répétitions et les deux comparaisons parallèles sont conservées.
