id: ISA.1.26
reference: Isaiah 1:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָשִׁ֤יבָה שֹׁפְטַ֨יִ/ךְ֙ כְּ/בָ/רִ֣אשֹׁנָ֔ה וְ/יֹעֲצַ֖יִ/ךְ כְּ/בַ/תְּחִלָּ֑ה אַחֲרֵי כֵ֗ן יִקָּ֤רֵא לָ/ךְ֙ עִ֣יר הַ/צֶּ֔דֶק קִרְיָ֖ה נֶאֱמָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/026.yaml
  text: And I will restore your judges as at the first[a], and your counselors as at the beginning. Afterward you will be called the city of righteousness, a faithful city.
translation:
  language: fr
  text: 'Je rétablirai tes juges comme autrefois,

    et tes conseillers comme au commencement.

    Après cela, on t’appellera « ville de justice »[a],

    « cité fidèle ».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ville de droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Je rétablirai
  rationale: Le hiphil de שוב exprime ici l’action de faire revenir ou de restaurer. « Rétablirai » convient au retour d’une autorité civique juste.
- source_word: שֹׁפְטַיִךְ
  choice: tes juges
  rationale: שֹׁפֵט désigne normalement un juge, même si la fonction peut aussi comporter une dimension gouvernementale.
- source_word: כְבָרִאשֹׁנָה
  choice: comme autrefois
  rationale: La formule renvoie à un état antérieur sans préciser la période historique; « comme autrefois » est naturel et laisse cette référence ouverte.
- source_word: וְיֹעֲצַיִךְ
  choice: tes conseillers
  rationale: Le terme désigne ceux qui donnent conseil dans la conduite de la cité et forme un parallèle avec « tes juges ».
- source_word: כְבַתְּחִלָּה
  choice: comme au commencement
  rationale: Cette traduction maintient le parallélisme temporel avec « comme autrefois » tout en distinguant les deux formulations hébraïques.
- source_word: אַחֲרֵי כֵן
  choice: Après cela
  rationale: 'Transition temporelle claire: le nouveau nom de la ville suit le rétablissement de ses responsables.'
- source_word: יִקָּרֵא לָךְ
  choice: on t’appellera
  rationale: Le niphal de קרא exprime ici l’attribution d’un nom. La deuxième personne conserve l’adresse directe à la ville personnifiée.
- source_word: עִיר הַצֶּדֶק
  choice: ville de justice
  rationale: Dans ce contexte de restauration des juges et de contraste avec l’injustice de la ville, « justice » rend naturellement la portée civique de צֶדֶק, sans exclure sa dimension morale plus large.
- source_word: קִרְיָה נֶאֱמָנָה
  choice: cité fidèle
  rationale: קִרְיָה est un synonyme poétique de « ville »; « cité fidèle » préserve la variation poétique et le contraste avec la cité devenue infidèle en Ésaïe 1.21.
theological_decisions:
- issue: Portée de צֶדֶק dans le nom restauré de la ville
  choice: justice
  alternative: droiture
  rationale: Le contexte immédiat met en avant le rétablissement des juges et la restauration civique, ce qui favorise « justice ». Toutefois, צֶדֶק peut aussi évoquer plus largement la rectitude morale; cette possibilité est conservée en note.
translation_notes:
  register: Français moderne, digne et accessible. La disposition en lignes conserve le parallélisme poétique. « Cité » évite une répétition plate de « ville » et reflète le changement de terme dans l’hébreu.
