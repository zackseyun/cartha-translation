id: ISA.1.9
reference: Isaiah 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לוּלֵי֙ יְהוָ֣ה צְבָא֔וֹת הוֹתִ֥יר לָ֛/נוּ שָׂרִ֖יד כִּ/מְעָ֑ט כִּ/סְדֹ֣ם הָיִ֔ינוּ לַ/עֲמֹרָ֖ה דָּמִֽינוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/009.yaml
  text: If Yahweh of hosts had not left us a very small remnant[a], we would have become like Sodom; we would have resembled Gomorrah.
translation:
  language: fr
  text: Si Yahweh des armées ne nous avait pas laissé un très petit reste[a], nous serions devenus comme Sodome ; nous aurions ressemblé à Gomorrhe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne nous avait pas conservé quelques survivants ».'
    reason: Alternative lexicale reflétant le sens de préservation possible pour הוֹתִיר et la valeur collective de שָׂרִיד.
lexical_decisions:
- source_word: לוּלֵי
  choice: Si ... ne ... avait
  rationale: Cette tournure introduit naturellement en français une condition irréelle du passé, dont la conséquence est exprimée au conditionnel passé.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Cette expression française traditionnelle et intelligible conserve l’idée des armées ou puissances placées sous le commandement de Yahweh sans les limiter explicitement à des forces humaines.
- source_word: הוֹתִיר
  choice: avait laissé
  rationale: Le hiphil de יתר signifie ici laisser subsister ou laisser comme reste ; « avait laissé » est concis et s’accorde naturellement avec « reste ».
- source_word: שָׂרִיד
  choice: reste
  rationale: Bien que le nom soit au singulier, il a ici une valeur collective. « Reste » préserve le vocabulaire prophétique sans imposer une interprétation supplémentaire.
- source_word: כִּמְעָט
  choice: qu’un tout petit
  rationale: Associé à שָׂרִיד, le terme souligne le nombre extrêmement réduit de ceux qui subsistent. La construction « ne ... qu’un tout petit reste » est naturelle en français.
- source_word: כִּסְדֹם
  choice: comme Sodome
  rationale: Le préfixe כ marque une comparaison, rendue directement par « comme ».
- source_word: הָיִינוּ
  choice: nous serions devenus
  rationale: Dans cette conséquence irréelle, « devenus » exprime clairement l’état auquel le peuple aurait abouti.
- source_word: לַעֲמֹרָה
  choice: à Gomorrhe
  rationale: Le nom propre suit sa forme française usuelle ; la préposition hébraïque appartient à la construction du verbe דמה.
- source_word: דָּמִינוּ
  choice: nous aurions ressemblé
  rationale: Le verbe signifie ressembler ou être semblable. Une formulation distincte de « devenus comme » respecte la variation du parallélisme hébreu.
theological_decisions:
- issue: Rendu du titre divin יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: Yahweh des puissances
  rationale: « Yahweh » conserve le nom divin du texte, tandis que « des armées » rend le sens large de צְבָאוֹת sans préciser indûment la nature de ces armées.
- issue: Vocabulaire du reste
  choice: un tout petit reste
  alternative: quelques survivants
  rationale: « Reste » conserve le motif lexical prophétique et la valeur collective du singulier hébreu ; la note signale la lecture concrète en termes de survivants.
translation_notes:
  register: Français international moderne, naturel et digne. Le conditionnel passé restitue la condition contraire aux faits ; le point-virgule maintient le parallélisme des deux propositions finales.
