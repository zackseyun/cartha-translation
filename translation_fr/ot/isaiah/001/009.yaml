review_pass:
  verdict: revise
  source_fidelity: 'La structure contrefactuelle de לוּלֵי est bien visée, ainsi que le nom « Yahweh », le titre « des armées », le vocabulaire du « reste » et le parallélisme Sodome/Gomorrhe. Cependant, la négation restrictive « ne… qu’ » inverse la logique conditionnelle du texte : elle signifie que Yahweh aurait laissé seulement un petit reste, tandis que l’hébreu affirme que, sans ce petit reste laissé par Yahweh, le peuple aurait été comme Sodome et Gomorrhe.'
  naturalness: « Yahweh des armées », « un très petit reste », « nous serions devenus comme Sodome » et « nous aurions ressemblé à Gomorrhe » sont naturels, clairs et d’un registre prophétique moderne approprié. La correction de « ne… qu’ » en « ne… pas » rend aussi la phrase française logiquement et grammaticalement cohérente.
  terminology: « Yahweh » rend fidèlement le Tétragramme, et « des armées » est un rendu établi et suffisamment large de צבאות. « Reste » conserve utilement le terme prophétique collectif pour שריד. Les noms « Sodome » et « Gomorrhe » suivent l’usage français courant.
  issues:
  - severity: high
    issue: La locution « ne nous avait laissé qu’un tout petit reste » emploie une négation restrictive au lieu de la négation du contrefactuel.
    rationale: « Ne… que » signifie « seulement » et ne correspond pas à « si Yahweh n’avait pas laissé ». Le sens résultant est contraire à l’argument du verset. Il faut écrire « ne nous avait pas laissé un très petit reste » (ou une formulation équivalente).
  - severity: low
    issue: La note alternative doit reproduire la négation complète.
    rationale: Après correction du texte principal, « ne nous avait pas conservé quelques survivants » fournit une alternative lexicale cohérente pour הותיר et שריד, sans modifier le sens.
  revised_text: Si Yahweh des armées ne nous avait pas laissé un très petit reste[a], nous serions devenus comme Sodome ; nous aurions ressemblé à Gomorrhe.
  revised_footnotes:
  - marker: a
    text: 'Ou : « ne nous avait pas conservé quelques survivants ».'
    reason: Alternative lexicale reflétant le sens de préservation possible pour הוֹתִיר et la valeur collective de שָׂרִיד.
  revision_rationale: 'La révision rétablit la négation exigée par la protase contrefactuelle hébraïque : sans le très petit reste préservé par Yahweh, le peuple aurait connu un sort comparable à celui de Sodome et de Gomorrhe. Elle conserve les autres choix fidèles et naturels du projet, ainsi que l’ancre de note.'
