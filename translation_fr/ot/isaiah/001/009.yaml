- from: Si Yahweh des armées ne nous avait laissé qu’un tout petit reste[a], nous serions devenus comme Sodome ; nous aurions ressemblé à Gomorrhe.
  to: Si Yahweh des armées ne nous avait pas laissé un très petit reste[a], nous serions devenus comme Sodome ; nous aurions ressemblé à Gomorrhe.
  rationale: 'La révision rétablit la négation exigée par la protase contrefactuelle hébraïque : sans le très petit reste préservé par Yahweh, le peuple aurait connu un sort comparable à celui de Sodome et de Gomorrhe. Elle conserve les autres choix fidèles et naturels du projet, ainsi que l’ancre de note.'
