id: ISA.1.8
reference: Isaiah 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/נוֹתְרָ֥ה בַת צִיּ֖וֹן כְּ/סֻכָּ֣ה בְ/כָ֑רֶם כִּ/מְלוּנָ֥ה בְ/מִקְשָׁ֖ה כְּ/עִ֥יר נְצוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/008.yaml
  text: And daughter Zion is left like a shelter in a vineyard[a], like a hut in a cucumber field[c][b], like a besieged city.
translation:
  language: fr
  text: Et la fille de Sion est restée comme un abri dans une vigne, comme une cabane dans un champ de concombres[a], comme une ville assiégée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un champ de melons » ou « dans un champ de courges » ; le terme hébreu peut désigner plus largement une parcelle où poussent des concombres ou d’autres cucurbitacées.
    reason: lexical_alternative
  - marker: b
    text: Ou, peut-être, « comme une ville gardée » ; dans ce contexte, « ville assiégée » paraît toutefois plus probable.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנוֹתְרָה
  choice: Et ... est restée
  rationale: Le niphal exprime ce qui subsiste ou demeure après la dévastation. « Est restée » est naturel en français et conserve ici la nuance d'isolement.
- source_word: בַת צִיּוֹן
  choice: la fille de Sion
  rationale: Cette expression personnifie Sion/Jérusalem. La construction française avec « de » préserve clairement l'image poétique hébraïque.
- source_word: כְּסֻכָּה
  choice: comme un abri
  rationale: סֻכָּה désigne un abri ou une hutte temporaire. « Abri » en exprime clairement la fonction, tandis que le parallélisme en suggère la fragilité.
- source_word: בְכָרֶם
  choice: dans une vigne
  rationale: Rendu locatif direct du nom hébreu au singulier, évoquant l'abri isolé installé dans une vigne.
- source_word: כִּמְלוּנָה
  choice: comme une cabane
  rationale: מְלוּנָה désigne un gîte ou abri temporaire dans un champ. « Cabane » rend naturellement cette construction sommaire en français.
- source_word: בְמִקְשָׁה
  choice: dans un champ de concombres
  rationale: Le terme désigne une parcelle cultivée de concombres ou d'autres cucurbitacées. Le choix principal suit le référent traditionnel plausible, tout en signalant l'étendue lexicale en note.
- source_word: כְּעִיר נְצוּרָה
  choice: comme une ville assiégée
  rationale: Dans ce contexte de dévastation et d'isolement, le participe est le plus naturellement compris au sens de « assiégée », sans effacer l'autre lecture possible liée à la garde ou à la surveillance.
theological_decisions:
- issue: Personnification de Sion
  choice: Conserver « la fille de Sion » dans le texte principal.
  alternative: Jérusalem ; le peuple de Sion
  rationale: Le texte hébreu personnifie poétiquement Sion. Remplacer l'expression par son référent interprété ferait disparaître une composante littéraire et théologique du texte.
- issue: État de la ville dans la dernière comparaison
  choice: Rendre נְצוּרָה par « assiégée ».
  alternative: gardée ; surveillée
  rationale: « Assiégée » s'accorde le mieux avec le contexte immédiat de ravage et avec l'image d'un lieu laissé seul, mais l'ambiguïté lexicale réelle est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme ternaire des comparaisons et la personnification prophétique sont conservés. « Abri » puis « cabane » évitent une répétition pesante tout en maintenant le parallélisme et le caractère temporaire des deux constructions.
