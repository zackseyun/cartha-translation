  text: וְ/הָיָ֤ה הֶ/חָסֹן֙ לִ/נְעֹ֔רֶת וּ/פֹעֲל֖/וֹ לְ/נִיצ֑וֹץ וּ/בָעֲר֧וּ שְׁנֵי/הֶ֛ם יַחְדָּ֖ו וְ/אֵ֥ין מְכַבֶּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/031.yaml
  text: The strong man will become tinder[a], and his work a spark; both of them will burn together, with no one to quench them.
translation:
  language: fr
  text: L’homme puissant deviendra de l’étoupe[a], et son œuvre une étincelle ; tous deux brûleront ensemble, sans personne pour les éteindre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’étoupe désigne des fibres détachées, notamment de lin, qui s’enflamment facilement.
    reason: lexical_explanation
lexical_decisions:
- source_word: הֶחָסֹן
  choice: l’homme puissant
  rationale: Le terme désigne celui qui est fort ou puissant. Cette traduction conserve la valeur personnelle du singulier et convient au contexte de jugement.
- source_word: לִנְעֹרֶת
  choice: comme de l’étoupe
  rationale: Le nom désigne des fibres détachées, notamment des déchets de lin, qui s’enflamment facilement. « Étoupe » préserve l’image concrète du texte hébreu ; une note en explique le sens.
- source_word: וּפֹעֲלוֹ
  choice: et son œuvre
  rationale: Le nom peut désigner l’œuvre, l’action ou ce qui a été produit. « Son œuvre » maintient cette largeur de sens sans préciser indûment s’il s’agit de ses actes ou de son ouvrage.
- source_word: לְנִיצוֹץ
  choice: comme une étincelle
  rationale: Le mot désigne une étincelle ou une particule incandescente. « Étincelle » rend directement l’image qui déclenche la combustion.
- source_word: וּבָעֲרוּ
  choice: brûleront
  rationale: Le verbe exprime le fait de brûler ou d’être consumé par le feu. Le choix reste sobre et fidèle.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: tous deux brûleront ensemble
  rationale: La formulation restitue l’insistance hébraïque sur la destruction conjointe de l’homme puissant et de son œuvre.
- source_word: וְאֵין מְכַבֶּה
  choice: sans personne pour les éteindre
  rationale: La construction exprime l’absence de quiconque puisse éteindre le feu. Le pronom pluriel reprend naturellement les deux éléments précédents.
theological_decisions:
- issue: Référent du possessif singulier dans « son œuvre »
  choice: 'Le possessif renvoie à l’homme puissant : le jugement atteint à la fois sa personne et son œuvre.'
  alternative: Le possessif peut être compris collectivement comme visant les œuvres de la classe des puissants.
  rationale: Le suffixe singulier hébreu renvoie le plus naturellement au sujet singulier הֶחָסֹן et maintient le parallélisme poétique entre la personne et son œuvre.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le parallélisme poétique. « Étoupe », terme concret mais peu courant, est maintenu pour la précision de l’image et expliqué en note.
