id: ISA.1.6
reference: Isaiah 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ/כַּף רֶ֤גֶל וְ/עַד רֹאשׁ֙ אֵֽין בּ֣/וֹ מְתֹ֔ם פֶּ֥צַע וְ/חַבּוּרָ֖ה וּ/מַכָּ֣ה טְרִיָּ֑ה לֹא זֹ֨רוּ֙ וְ/לֹ֣א חֻבָּ֔שׁוּ וְ/לֹ֥א רֻכְּכָ֖ה בַּ/שָּֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/006.yaml
  text: From the sole of the foot even to the head[a], there is no soundness in it—only wounds and bruises and fresh blows; they have not been pressed out, or bandaged[d][c][b], or softened with oil.
translation:
  language: fr
  text: 'De la plante du pied jusqu’à la tête, rien n’est sain en lui[a] : ce ne sont que blessures, contusions et plaies à vif[b]. Elles n’ont été ni pressées[c], ni pansées[d] ni adoucies avec de l’huile.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le texte hébreu dit « en lui » : la nation est représentée comme un corps blessé.'
    reason: alternative_reading
  - marker: b
    text: Ou « plaies récentes ». L’expression peut désigner des blessures encore fraîches et à vif.
    reason: lexical_alternative
  - marker: c
    text: Le verbe peut évoquer le fait de presser les plaies pour en faire sortir les matières avant de les soigner.
    reason: cultural_note
  - marker: d
    text: Ou « bandées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכַּף רֶגֶל וְעַד רֹאשׁ
  choice: De la plante du pied jusqu’à la tête
  rationale: Rend l’expression corporelle de totalité, du bas jusqu’en haut, dans un français naturel et fidèle au singulier hébreu.
- source_word: אֵין בּוֹ מְתֹם
  choice: rien n’est sain en lui
  rationale: מְתֹם désigne l’intégrité ou l’état intact. Le pronom masculin hébreu est conservé afin de maintenir la personnification de la nation comme un corps blessé.
- source_word: פֶּצַע וְחַבּוּרָה וּמַכָּה טְרִיָּה
  choice: blessures, contusions et plaies à vif
  rationale: Les singuliers collectifs sont naturellement rendus au pluriel. « Plaies à vif » exprime le caractère frais ou cru de מַכָּה טְרִיָּה sans suggérer nécessairement une infection.
- source_word: לֹא זֹרוּ
  choice: n’ont été ni nettoyées par pression
  rationale: Dans ce contexte médical, le verbe peut désigner l’action de presser une plaie pour en faire sortir les matières; cette formulation reste intelligible tout en signalant le geste.
- source_word: וְלֹא חֻבָּשׁוּ
  choice: ni pansées
  rationale: חבשׁ désigne ici le fait de bander ou de traiter une plaie. « Panser » est courant en français moderne et englobe naturellement la pose d’un bandage.
- source_word: וְלֹא רֻכְּכָה בַּשָּׁמֶן
  choice: ni adoucies avec de l’huile
  rationale: Rend directement l’idée de rendre tendre ou souple au moyen d’huile, pratique de soin des plaies.
theological_decisions:
- issue: Référent de la métaphore corporelle
  choice: Conserver « en lui », conformément au pronom masculin hébreu
  alternative: Employer « en elle » pour renvoyer explicitement à la nation, ou une tournure impersonnelle comme « rien n’y est sain »
  rationale: Le texte présente Juda/Israël sous les traits d’un corps blessé. « En lui » préserve la forme du texte et la personnification sans identifier ce corps à un homme particulier; la note explicite le référent collectif.
translation_notes:
  register: Français international moderne, digne et accessible. La série médicale demeure concrète; « contusions », « plaies à vif », « pansées » et « huile » préservent l’image sans archaïsme. Les marqueurs suivent immédiatement les expressions concernées.
