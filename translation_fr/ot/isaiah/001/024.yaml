revisions:
- from: 'C’est pourquoi, déclaration du Seigneur[a], Yahweh des armées[b], le Puissant d’Israël : « Ah ! Je trouverai soulagement auprès de mes adversaires[c] et je me vengerai de mes ennemis. »'
  to: 'C’est pourquoi, déclaration du Seigneur[a], Yahweh des armées[b], le Puissant d’Israël : « Ah ! Je me soulagerai de mes adversaires[c] et je me vengerai de mes ennemis. »'
  rationale: La révision remplace une construction française ambiguë par « je me soulagerai de mes adversaires », qui rend de façon plus directe le soulagement que Dieu obtient en agissant contre ses adversaires, sans confondre cette expression avec la vengeance explicitement énoncée ensuite. La note relative à « des armées » est également rectifiée afin de distinguer le rendu littéral d’une explicitation interprétative.
