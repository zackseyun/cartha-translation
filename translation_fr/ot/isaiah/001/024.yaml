id: ISA.1.24
reference: Isaiah 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻ֤ם הָֽ/אָדוֹן֙ יְהוָ֣ה צְבָא֔וֹת אֲבִ֖יר יִשְׂרָאֵ֑ל ה֚וֹי אֶנָּחֵ֣ם מִ/צָּרַ֔/י וְ/אִנָּקְמָ֖ה מֵ/אוֹיְבָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/024.yaml
  text: 'Therefore the declaration of the Lord[a], Yahweh of Armies, the Mighty One of Israel: “Ah[c][b], I will get relief from my foes and avenge myself on my enemies.”'
translation:
  language: fr
  text: 'C’est pourquoi, déclaration du Seigneur[a], Yahweh des armées[b], le Puissant d’Israël : « Ah ! Je me soulagerai de mes adversaires[c] et je me vengerai de mes ennemis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « oracle du Seigneur ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit littéralement « Yahweh des armées ». « Armées célestes » explicite le sens possible de « armées ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je serai consolé au sujet de mes adversaires » ou « je trouverai du soulagement de mes adversaires ».
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence qui découle de l’accusation précédente.
- source_word: נְאֻם
  choice: déclaration
  rationale: Rend la formule prophétique solennelle dans un français actuel; « oracle » demeure possible mais plus technique.
- source_word: הָאָדוֹן
  choice: le Seigneur
  rationale: Exprime le titre divin et sa souveraineté sans le confondre avec le nom propre qui suit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin explicitement présent dans le texte hébreu.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Conserve l’image militaire concrète et reste transparent pour le lecteur moderne.
- source_word: אֲבִיר יִשְׂרָאֵל
  choice: le Puissant d’Israël
  rationale: Rend ce titre divin qui souligne la force et la puissance.
- source_word: הוֹי
  choice: Ah !
  rationale: Préserve la force affective de l’interjection sans décider s’il s’agit précisément d’une plainte, d’un soulagement ou d’une exclamation menaçante.
- source_word: אֶנָּחֵם
  choice: Je trouverai soulagement
  rationale: Dans ce contexte, le niphal de נחם exprime le soulagement ou la satisfaction obtenus par l’action contre les adversaires, tout en restant distinct du verbe de vengeance qui suit.
- source_word: מִצָּרַי
  choice: auprès de mes adversaires
  rationale: Avec le verbe précédent, מן désigne ceux à l’égard desquels le soulagement est obtenu; « auprès de » offre une formulation française naturelle sans effacer l’ambiguïté de la relation.
- source_word: וְאִנָּקְמָה
  choice: et je me vengerai
  rationale: Conserve la résolution à la première personne et la valeur réfléchie du jugement exercé.
- source_word: מֵאוֹיְבָי
  choice: de mes ennemis
  rationale: « Se venger de » est la construction idiomatique normale en français.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte emploie directement le tétragramme; la translittération distingue le nom personnel du titre הָאָדוֹן, « le Seigneur ».
- issue: Rapport entre soulagement divin et vengeance
  choice: Je trouverai soulagement auprès de mes adversaires et je me vengerai de mes ennemis
  alternative: Je serai consolé au sujet de mes adversaires; je me soulagerai de mes adversaires
  rationale: Les deux verbes sont maintenus comme deux expressions liées mais distinctes. La traduction ne réduit pas le premier à la vengeance, tout en préservant le caractère judiciaire et saisissant de l’énoncé.
translation_notes:
  register: Français international moderne, solennel mais accessible. La succession « le Seigneur, Yahweh » est conservée parce que l’hébreu juxtapose un titre divin et le nom propre. Les marqueurs [a], [b] et [c] figurent tous dans le texte.
