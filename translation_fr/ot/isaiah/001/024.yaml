  - severity: low
    issue: Note b historiquement et lexicalement imprécise
    rationale: Elle présente « Yahweh des armées » comme une option traditionnelle, alors que c’est précisément le rendu de la traduction. « Armées célestes » constitue une interprétation explicative de צבאות, et « puissances » une adaptation plus libre.
