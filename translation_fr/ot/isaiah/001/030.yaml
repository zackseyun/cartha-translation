id: ISA.1.30
reference: Isaiah 1:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י תִֽהְי֔וּ כְּ/אֵלָ֖ה נֹבֶ֣לֶת עָלֶ֑/הָ וּֽ/כְ/גַנָּ֔ה אֲשֶׁר מַ֖יִם אֵ֥ין לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/030.yaml
  text: For you will be like an oak whose leaf withers[a], and like a garden that has no water.
translation:
  language: fr
  text: Car vous serez comme un chêne dont la feuille se flétrit[a], comme un jardin qui n’a pas d’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un térébinthe ». Le mot hébreu אֵלָה peut désigner un térébinthe ou un chêne; l’espèce exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou la conséquence du jugement annoncé dans le contexte précédent.
- source_word: תִהְיוּ
  choice: vous serez
  rationale: L’imparfait qal à la deuxième personne du pluriel a ici une valeur future ou résultative.
- source_word: כְאֵלָה
  choice: comme un chêne
  rationale: אֵלָה peut désigner un chêne ou un térébinthe. « Chêne » offre une image naturelle et immédiatement compréhensible; l’incertitude botanique est conservée en note.
- source_word: נֹבֶלֶת
  choice: se flétrit
  rationale: Le participe de נבל exprime le dépérissement ou le flétrissement; une proposition relative est naturelle en français.
- source_word: עָלֶהָ
  choice: dont la feuille
  rationale: Le substantif singulier muni du suffixe féminin renvoie à la feuille de l’arbre; le singulier de l’hébreu est conservé.
- source_word: וּכְגַנָּה
  choice: comme un jardin
  rationale: גַּנָּה désigne un jardin ou un espace cultivé clos; « jardin » est l’équivalent français le plus direct.
- source_word: אֲשֶׁר מַיִם אֵין לָהּ
  choice: qui n’a pas d’eau
  rationale: Formulation française naturelle qui conserve l’image explicite de la privation d’eau.
- source_word: מַיִם
  choice: eau
  rationale: Bien que de forme plurielle en hébreu, מַיִם désigne normalement l’eau comme substance.
theological_decisions: []
