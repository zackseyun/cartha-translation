id: ISA.1.10
reference: Isaiah 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה קְצִינֵ֣י סְדֹ֑ם הַאֲזִ֛ינוּ תּוֹרַ֥ת אֱלֹהֵ֖י/נוּ עַ֥ם עֲמֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/010.yaml
  text: Hear the word of Yahweh[a], rulers of Sodom; give ear to the instruction of our God[b], people of Gomorrah.
translation:
  language: fr
  text: Écoutez la parole de Yahvé, dirigeants de Sodome[a] ; prêtez l’oreille à l’enseignement[b] de notre Dieu, peuple de Gomorrhe !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ésaïe interpelle les dirigeants et le peuple de Juda en les associant prophétiquement à Sodome et à Gomorrhe ; il ne les identifie pas littéralement à ces villes.
    reason: cultural_note
  - marker: b
    text: 'Ou « instruction » ou « loi » (hébreu : torah).'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: 'Impératif pluriel de שׁמע : il appelle non seulement à entendre, mais aussi à prêter attention. « Écoutez » est direct, naturel et conserve la force de l’interpellation prophétique.'
- source_word: דְבַר יְהוָה
  choice: la parole de Yahvé
  rationale: דבר désigne ici la parole ou le message divin. « La parole de Yahvé » préserve la formule prophétique et rend le nom divin comme un nom propre.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin représenté par le tétragramme, choisie plutôt qu’un remplacement par le titre « le Seigneur ».
- source_word: קְצִינֵי
  choice: dirigeants
  rationale: Le terme désigne des chefs ou responsables exerçant l’autorité. « Dirigeants » est actuel et convient à l’adresse collective.
- source_word: סְדֹם
  choice: Sodome
  rationale: Forme française traditionnelle et standard de ce nom de lieu.
- source_word: הַאֲזִינוּ
  choice: prêtez l’oreille
  rationale: Cet impératif parallèle exprime une écoute attentive. La locution distingue le verbe de שִׁמְעוּ tout en conservant le parallélisme poétique.
- source_word: תּוֹרַת
  choice: l’enseignement
  rationale: תורה peut désigner la loi, l’instruction ou l’enseignement. Dans cet appel prophétique, « enseignement » conserve sa portée générale sans le réduire à un code juridique.
- source_word: אֱלֹהֵינוּ
  choice: notre Dieu
  rationale: Le suffixe de première personne du pluriel est explicite ; il est donc conservé.
- source_word: עַם עֲמֹרָה
  choice: peuple de Gomorrhe
  rationale: L’expression fonctionne comme une apostrophe. La formulation française garde cette identification directe et saisissante.
- source_word: עֲמֹרָה
  choice: Gomorrhe
  rationale: Forme française traditionnelle et standard de ce nom de lieu.
theological_decisions:
- issue: Identification prophétique des dirigeants et du peuple avec Sodome et Gomorrhe
  choice: Conserver les apostrophes directes « dirigeants de Sodome » et « peuple de Gomorrhe ».
  alternative: 'Expliciter la comparaison : « dirigeants semblables à ceux de Sodome » et « peuple semblable à celui de Gomorrhe ».'
  rationale: L’hébreu emploie directement les noms de Sodome et de Gomorrhe. Maintenir cette formulation préserve la vigueur accusatrice et la tension de l’image sans ajouter un marqueur comparatif absent du texte.
- issue: Portée de תּוֹרָה
  choice: enseignement
  alternative: loi ou instruction
  rationale: Le contexte permet un sens plus large que celui d’un corpus légal. « Enseignement » maintient cette amplitude, tandis qu’une note signale les autres traductions possibles.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des deux impératifs est conservé par « Écoutez » et « prêtez l’oreille ». Les apostrophes restent littérales afin de préserver le choc rhétorique du texte hébreu.
