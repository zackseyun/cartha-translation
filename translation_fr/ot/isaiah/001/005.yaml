source:
  edition: WLC
  text: עַ֣ל מֶ֥ה תֻכּ֛וּ ע֖וֹד תּוֹסִ֣יפוּ סָרָ֑ה כָּל רֹ֣אשׁ לָ/חֳלִ֔י וְ/כָל לֵבָ֖ב דַּוָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/005.yaml
  text: Why should you be struck again? You continue in rebellion. The whole head is sick[a], and the whole heart is faint.
translation:
  language: fr
  text: Pourquoi seriez-vous encore frappés ? Vous persistez dans la révolte. La tête tout entière est malade[a], et le cœur tout entier est défaillant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À quel endroit pourriez-vous encore être frappés ? » L’hébreu peut demander sur quelle partie du corps d’autres coups pourraient tomber, puisque le corps entier est malade.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַל מֶה
  choice: Pourquoi
  rationale: L’expression interrogative introduit naturellement une question rhétorique sur le motif ou l’utilité de nouveaux coups.
- source_word: תֻכּוּ עוֹד
  choice: vous frapper encore
  rationale: Le hophal de נכה exprime le fait d’être frappé; l’infinitif français après « Pourquoi » rend idiomatiquement la question rhétorique, tandis que « encore » conserve l’idée de répétition ou de prolongement.
- source_word: תּוֹסִיפוּ סָרָה
  choice: Vous persistez dans la révolte
  rationale: יסף suivi de סרה exprime ici la continuation obstinée d’une conduite rebelle. La phrase reste déclarative, conformément à la syntaxe hébraïque.
- source_word: כָּל רֹאשׁ
  choice: La tête tout entière
  rationale: Cette formulation préserve l’image collective d’un seul corps et le sens de totalité, plutôt que de distribuer l’énoncé entre plusieurs têtes.
- source_word: לָחֳלִי
  choice: est malade
  rationale: Le lamed avec חֳלִי décrit un état de maladie; « est malade » est naturel et fidèle à la métaphore corporelle.
- source_word: וְכָל לֵבָב
  choice: et le cœur tout entier
  rationale: La formulation maintient le parallélisme avec « la tête tout entière » et l’image collective du corps.
- source_word: דַּוָּי
  choice: est défaillant
  rationale: L’adjectif évoque un état de faiblesse, de souffrance ou d’épuisement. « Défaillant » convient au cœur et le distingue de la maladie de la tête sans effacer la proximité des images.
theological_decisions:
- issue: Sens de la question initiale
  choice: Question rhétorique sur la raison ou l’utilité de nouveaux coups alors que le peuple persiste dans la révolte
  alternative: Question demandant sur quelle partie du corps d’autres coups pourraient encore tomber
  rationale: עַל מֶה signifie le plus naturellement « pourquoi » dans cette construction. Toutefois, l’image corporelle qui suit permet un sens locatif, signalé en note afin de préserver l’ambiguïté réelle.
- issue: Statut syntaxique de תּוֹסִיפוּ סָרָה
  choice: 'Proposition déclarative : « Vous persistez dans la révolte »'
  alternative: 'Seconde question : « Pourquoi persistez-vous dans la révolte ? »'
  rationale: L’hébreu ne marque pas une seconde interrogation; la proposition décrit la persistance rebelle qui accompagne et explique la question précédente.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement pluriel correspond à l’adresse collective. « Persistez » exprime l’obstination sans alourdir la phrase; la répétition de « tout entière » conserve le parallélisme poétique.
