source:
  edition: WLC
  text: וּ/בְ/פָרִשְׂ/כֶ֣ם כַּפֵּי/כֶ֗ם אַעְלִ֤ים עֵינַ/י֙ מִ/כֶּ֔ם גַּ֛ם כִּֽי תַרְבּ֥וּ תְפִלָּ֖ה אֵינֶ֣/נִּי שֹׁמֵ֑עַ יְדֵי/כֶ֖ם דָּמִ֥ים מָלֵֽאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/015.yaml
  text: And when you spread out your palms[a], I hide my eyes from you; even though you multiply prayers, I am not listening[c][b]. Your hands are full of blood.
translation:
  language: fr
  text: Quand vous étendez les paumes[a], je détourne de vous mon regard ; même si vous multipliez les prières, je n’écoute pas[b]. Vos mains sont pleines de sang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mains ». L’hébreu dit précisément « les paumes », évoquant le geste des mains étendues dans la prière.
    reason: lexical_alternative
  - marker: b
    text: Ou « je n’entends pas » ou « je ne veux pas écouter ». Dans ce contexte, l’expression indique que Dieu refuse d’accueillir leurs prières.
    reason: lexical_alternative
  - marker: c
    text: Le pluriel hébreu peut aussi évoquer le sang versé ou la culpabilité liée au sang répandu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְפָרִשְׂכֶם
  choice: Quand vous étendez
  rationale: L’infinitif construit précédé de בְּ a ici une valeur temporelle. « Étendez » rend naturellement le geste de déployer les mains pour prier.
- source_word: כַּפֵּיכֶם
  choice: les paumes
  rationale: כַּף désigne précisément la paume ou le creux de la main. Ce choix conserve l’image concrète du geste de prière et la distingue de יְדֵיכֶם, « vos mains », à la fin du verset.
- source_word: אַעְלִים עֵינַי מִכֶּם
  choice: je détourne de vous mon regard
  rationale: L’expression hébraïque décrit le refus délibéré de Dieu de regarder les adorateurs. Cette formulation française reste concrète et naturelle, sans employer « fermer les yeux », qui pourrait suggérer à tort la tolérance.
- source_word: גַּם כִּי
  choice: même si
  rationale: 'La locution introduit une concession : l’abondance des prières ne change rien au refus exprimé.'
- source_word: תַרְבּוּ תְפִלָּה
  choice: vous multipliez les prières
  rationale: Le hiphil de רבה exprime l’idée de rendre nombreux ou d’accroître. Le pluriel français transmet naturellement l’idée de prières répétées ou nombreuses.
- source_word: אֵינֶנִּי שֹׁמֵעַ
  choice: je n’écoute pas
  rationale: La négation avec le participe exprime ici un refus actuel et continu d’accueillir les prières, plutôt qu’une incapacité à les entendre.
- source_word: יְדֵיכֶם
  choice: Vos mains
  rationale: Le terme ordinaire יָד est rendu par « mains », ce qui préserve le contraste lexical avec les « paumes » du début et fait passer du geste cultuel à la culpabilité morale.
- source_word: דָּמִים מָלֵאוּ
  choice: sont pleines de sang
  rationale: Le parfait décrit l’état présent résultant des actes commis. « Sang » conserve la force et l’ambiguïté du pluriel hébreu, qui peut évoquer le sang versé ou la culpabilité liée au sang.
theological_decisions:
- issue: Langage anthropomorphique décrivant le refus divin du culte
  choice: Conserver l’image corporelle par « je détourne de vous mon regard » et « je n’écoute pas ».
  alternative: Paraphraser par « je vous ignore » ou « je refuse de vous prêter attention ».
  rationale: Les images du regard et de l’écoute communiquent avec force le rejet d’un culte contredit par la violence. Les conserver évite d’atténuer l’accusation prophétique.
- issue: Portée de דָּמִים
  choice: Employer « sang » dans le texte et signaler les nuances en note.
  alternative: Traduire directement par « sang versé » ou « meurtres ».
  rationale: Le pluriel hébreu peut désigner le sang répandu, les violences meurtrières ou la culpabilité qui en résulte. « Sang » maintient cette densité sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation garde le parallélisme entre le geste de prière, le refus divin et les mains souillées, tout en évitant l’expression française ambiguë « fermer les yeux sur ».
