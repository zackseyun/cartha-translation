  text: אִם תֹּאב֖וּ וּ/שְׁמַעְתֶּ֑ם ט֥וּב הָ/אָ֖רֶץ תֹּאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/019.yaml
  text: If you are willing and obedient[a], you will eat the good of the land.
translation:
  language: fr
  text: Si vous êtes de bonne volonté et si vous écoutez[a], vous mangerez les bons produits du pays.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous obéissez » ; ici, écouter implique de répondre par l’obéissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Si
  rationale: Particule conditionnelle introduisant la condition dont dépend la promesse.
- source_word: תֹּאבוּ
  choice: vous le voulez
  rationale: Le verbe אבה exprime le consentement ou la volonté. Cette formulation est naturelle en français et conserve la dimension volontaire.
- source_word: וּשְׁמַעְתֶּם
  choice: et si vous écoutez
  rationale: שׁמע signifie écouter, entendre ou obéir selon le contexte. « Écoutez » préserve l’image hébraïque tout en suggérant ici une réponse obéissante, explicitée en note.
- source_word: טוּב הָאָרֶץ
  choice: les bons produits du pays
  rationale: Littéralement « le bon du pays » ou « ce que le pays a de bon » ; dans ce contexte, l’expression désigne concrètement les bonnes productions dont on pourra jouir.
- source_word: תֹּאכֵלוּ
  choice: vous mangerez
  rationale: Rend directement l’imparfait de אכל et conserve l’image concrète de la jouissance des produits du pays.
theological_decisions:
- issue: Sens de שׁמע dans l’exhortation d’alliance
  choice: écoutez
  alternative: obéissez
  rationale: Dans le contexte, écouter suppose une réponse conforme à ce qui est demandé. Le texte principal conserve néanmoins l’ambiguïté lexicale et l’image de l’écoute, tandis que la note en précise la portée.
translation_notes:
  register: Français moderne, clair et digne. La reprise de « si » devant le second verbe rend la condition naturelle en français. « Les bons produits du pays » explicite sobrement l’expression hébraïque sans réduire la promesse à une denrée précise.
