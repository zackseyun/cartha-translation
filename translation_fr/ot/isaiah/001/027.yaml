source:
  edition: WLC
  text: צִיּ֖וֹן בְּ/מִשְׁפָּ֣ט תִּפָּדֶ֑ה וְ/שָׁבֶ֖י/הָ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/027.yaml
  text: Zion will be redeemed by justice[a], and her returnees by righteousness.
translation:
  language: fr
  text: Sion sera rachetée par le droit, et ceux des siens qui reviennent[a] par la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui reviennent à elle ». Le participe hébreu peut évoquer un retour à Sion ou le fait de revenir à Dieu, c’est-à-dire de se repentir.
    reason: alternative_reading
lexical_decisions:
- source_word: צִיּוֹן
  choice: Sion
  rationale: Forme française traditionnelle et courante du nom propre biblique.
- source_word: בְּמִשְׁפָּט
  choice: par le droit
  rationale: מִשְׁפָּט désigne ici l’exercice juste du droit ou du jugement; « par » rend la valeur instrumentale de ב et distingue ce terme de צְדָקָה.
- source_word: תִּפָּדֶה
  choice: sera rachetée
  rationale: Le niphal de פדה exprime le fait d’être racheté ou délivré; « rachetée » conserve la force propre du verbe sans expliciter indûment la manière de cette délivrance.
- source_word: וְשָׁבֶיהָ
  choice: et ceux qui reviennent à elle
  rationale: Le participe de שוב avec suffixe féminin peut désigner ceux qui reviennent à Sion, mais peut aussi évoquer ceux qui se détournent du mal et reviennent à Dieu. Le texte principal retient le sens spatial le plus direct, tandis que la note préserve l’ambiguïté.
- source_word: בִּצְדָקָה
  choice: par la justice
  rationale: צְדָקָה exprime la justice, la droiture ou la conduite juste. « Justice » est naturel en français et maintient le parallélisme tout en restant distinct de « le droit ».
theological_decisions:
- issue: Sens de וְשָׁבֶיהָ dans le contexte prophétique
  choice: ceux qui reviennent à elle
  alternative: ceux qui reviennent à Dieu / ceux qui se repentent
  rationale: La morphologie permet un retour vers Sion aussi bien qu’un retour moral ou spirituel. Le contexte d’Ésaïe 1 favorise une résonance de repentance, mais ne justifie pas d’exclure le sens spatial; la note conserve donc cette tension.
translation_notes:
  register: Français moderne, sobre et dignifié. « Le droit » et « la justice » rendent les deux termes hébreux parallèles sans les confondre. La formulation évite le substantif peu naturel « revenants » et maintient explicitement l’ambiguïté dans la note.
