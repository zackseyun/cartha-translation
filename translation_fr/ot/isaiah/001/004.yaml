id: ISA.1.4
reference: Isaiah 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֣וֹי גּ֣וֹי חֹטֵ֗א עַ֚ם כֶּ֣בֶד עָוֺ֔ן זֶ֣רַע מְרֵעִ֔ים בָּנִ֖ים מַשְׁחִיתִ֑ים עָזְב֣וּ אֶת יְהוָ֗ה נִֽאֲצ֛וּ אֶת קְד֥וֹשׁ יִשְׂרָאֵ֖ל נָזֹ֥רוּ אָחֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/004.yaml
  text: Ah[a], sinful nation, a people heavy with iniquity, offspring of evildoers[b], children who act corruptly! They have forsaken Yahweh; they have despised the Holy One of Israel[e][d][c]; they have turned backward.
translation:
  language: fr
  text: Malheur[a] à la nation pécheresse, au peuple chargé de fautes, à la descendance de ceux qui font le mal, aux enfants qui agissent de façon perverse ! Ils ont abandonné Yahweh[b], ils ont méprisé le Saint d’Israël ; ils se sont détournés en arrière[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Hélas, nation pécheresse ! » L’interjection hébraïque peut exprimer aussi bien la lamentation que la dénonciation.
    reason: lexical_alternative
  - marker: b
    text: Yahweh représente le nom divin יהוה (YHWH), parfois rendu traditionnellement par « le SEIGNEUR ».
    reason: alternative_reading
  - marker: c
    text: Ou « ils lui ont tourné le dos » ; le texte peut aussi évoquer le fait de s’éloigner et de revenir en arrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur
  rationale: L’interjection exprime ici à la fois la lamentation et la dénonciation. « Malheur » conserve la force d’une adresse prophétique, tandis que la note signale l’autre nuance possible.
- source_word: גּוֹי חֹטֵא
  choice: nation pécheresse
  rationale: Le participe חֹטֵא qualifie la nation de manière durable. Cette formulation est naturelle en français et maintient la portée collective de l’accusation.
- source_word: עַם כֶּבֶד עָוֺן
  choice: peuple chargé de fautes
  rationale: « Chargé » conserve l’image du poids portée par כֶּבֶד. Le pluriel français « fautes » rend naturellement le sens collectif de עָוֺן sans le limiter au seul sentiment de culpabilité.
- source_word: זֶרַע מְרֵעִים
  choice: descendance de ceux qui font le mal
  rationale: « Descendance » préserve l’image généalogique collective de זֶרַע. La périphrase « ceux qui font le mal » est plus courante et transparente que « malfaiteurs » dans ce contexte.
- source_word: בָּנִים מַשְׁחִיתִים
  choice: enfants qui sèment la corruption
  rationale: Le participe causatif décrit des enfants qui produisent ou propagent la corruption. Cette expression française garde leur rôle actif, sans réduire le terme à une simple qualité morale.
- source_word: עָזְבוּ
  choice: ont abandonné
  rationale: Le verbe exprime l’abandon ou le délaissement. « Abandonné » est direct, actuel et convient au contexte de rupture d’alliance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: נִאֲצוּ
  choice: ont méprisé
  rationale: Le verbe marque un rejet empreint de mépris. « Méprisé » en restitue clairement la force.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette formulation conserve le titre divin caractéristique du livre d’Ésaïe et son lien explicite avec Israël.
- source_word: נָזֹרוּ אָחוֹר
  choice: se sont détournés et ont reculé
  rationale: La formulation rend à la fois l’éloignement exprimé par le verbe et le mouvement vers l’arrière indiqué par אָחוֹר, tout en restant idiomatique en français.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom propre YHWH. « Yahweh » préserve cette donnée du texte source sans remplacer le nom par un titre traditionnel.
- issue: Superposition des images collectives et familiales
  choice: Conserver « nation », « peuple », « descendance » et « enfants »
  alternative: Uniformiser toutes les expressions en un seul vocabulaire collectif
  rationale: L’accumulation passe délibérément de l’identité nationale à l’identité familiale. La conserver maintient l’intensification rhétorique et la tension liée à l’identité d’Israël.
- issue: Sens de la dernière proposition
  choice: se sont détournés et ont reculé
  alternative: lui ont tourné le dos ; se sont éloignés en arrière
  rationale: Le groupe hébreu peut évoquer l’éloignement, le recul ou le fait de tourner le dos. Le choix retenu garde les deux composantes sans imposer une seule image idiomatique.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme accumulatif de l’hébreu est conservé par les quatre groupes parallèles introduits par « à la/au/à la/aux ». La ponctuation distingue l’exclamation accusatrice des trois constats qui suivent.
