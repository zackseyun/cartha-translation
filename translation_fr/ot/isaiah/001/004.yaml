    issue: « enfants qui sèment la corruption »
    rationale: Cette formulation suggère spécifiquement la diffusion de la corruption. Le participe hiphil de שחת désigne ici des enfants dont l’agir est perverti/destructeur; une formulation plus générale évite cette précision non exigée par le texte.
  - severity: medium
    issue: « ils se sont détournés et ont reculé »
    rationale: La coordination transforme l’expression נָזֹרוּ אָחוֹר en deux verbes distincts. Il convient de maintenir l’unité de l’image, tout en laissant la note signaler « tourner le dos » ou l’aliénation suivie d’un retour en arrière.
