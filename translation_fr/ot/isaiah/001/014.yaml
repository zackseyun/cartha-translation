source:
  edition: WLC
  text: חָדְשֵׁי/כֶ֤ם וּ/מוֹעֲדֵי/כֶם֙ שָׂנְאָ֣ה נַפְשִׁ֔/י הָי֥וּ עָלַ֖/י לָ/טֹ֑רַח נִלְאֵ֖יתִי נְשֹֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/001/014.yaml
  text: Your new moons and your appointed feasts my soul hates[a]; they have become a burden to me; I am weary of bearing them.
translation:
  language: fr
  text: Vos nouvelles lunes et vos fêtes fixées[a], mon âme les déteste. Elles sont devenues pour moi un fardeau ; je suis las de les porter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vos temps fixés » ou « vos fêtes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְשֵׁיכֶם
  choice: vos nouvelles lunes
  rationale: חֹדֶשׁ désigne littéralement la nouvelle lune et, par extension, la célébration mensuelle qui lui est associée. « Nouvelles lunes » conserve l’expression hébraïque et sa portée cultuelle.
- source_word: וּמוֹעֲדֵיכֶם
  choice: et vos fêtes fixées
  rationale: מוֹעֵד peut désigner un temps ou un rendez-vous fixé ; dans ce contexte cultuel, il s’agit des fêtes religieuses célébrées à dates déterminées. « Fêtes fixées » reste naturel tout en gardant l’idée de temps établi.
- source_word: שָׂנְאָה נַפְשִׁי
  choice: je les déteste de toute mon âme
  rationale: Littéralement, « mon âme déteste ». La formulation française conserve l’intensité personnelle de נֶפֶשׁ sans produire une tournure artificielle.
- source_word: הָיוּ עָלַי לָטֹרַח
  choice: elles sont devenues pour moi un fardeau
  rationale: 'Le parfait exprime ici un état résultant : ces célébrations en sont venues à constituer un poids pour Dieu.'
- source_word: טֹרַח
  choice: fardeau
  rationale: טֹרַח évoque une charge pénible, un poids ou une peine. « Fardeau » prépare naturellement l’image suivante de l’action de porter.
- source_word: נִלְאֵיתִי
  choice: je suis las
  rationale: Le verbe exprime la fatigue et l’épuisement. « Je suis las » est concis, digne et adapté au registre prophétique.
- source_word: נְשֹׂא
  choice: de les porter
  rationale: L’infinitif de נָשָׂא signifie « porter » ou « supporter ». Le pronom « les », explicité d’après le contexte, renvoie aux célébrations et maintient la métaphore du fardeau.
theological_decisions:
- issue: Le rejet par Dieu des pratiques cultuelles d’Israël
  choice: Les possessifs « vos » sont maintenus afin d’exprimer le rejet de célébrations devenues celles du peuple dans leur forme corrompue, sans atténuer la vigueur de la déclaration divine.
  alternative: Formuler le verset de manière à laisser entendre que Dieu rejette en elles-mêmes toutes les fêtes qu’il avait prescrites.
  rationale: 'Le contexte dénonce un culte associé à l’injustice et à l’hypocrisie. La traduction préserve néanmoins la tension du texte : Dieu dit réellement détester « vos » célébrations, sans ajouter dans le corps du verset une explication théologique absente de l’hébreu.'
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé, ainsi que la métaphore continue du fardeau que Dieu est las de porter.
