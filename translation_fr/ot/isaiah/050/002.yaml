  to: 'Pourquoi, quand je suis venu, n’y avait-il personne[a] ? Pourquoi, quand j’ai appelé, personne n’a-t-il répondu ? Ma main est-elle donc trop courte pour racheter[b] ? Ou bien n’ai-je pas en moi la force de délivrer ? Voici : par ma réprimande[c], je mets la mer à sec, je change les fleuves en désert ; leurs poissons se mettent à sentir mauvais faute d’eau et meurent de soif.'
