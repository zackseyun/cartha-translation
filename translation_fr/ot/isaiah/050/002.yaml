source:
  edition: WLC
  text: מַדּ֨וּעַ בָּ֜אתִי וְ/אֵ֣ין אִ֗ישׁ קָרָֽאתִי֮ וְ/אֵ֣ין עוֹנֶה֒ הֲ/קָצ֨וֹר קָצְרָ֤ה יָדִ/י֙ מִ/פְּד֔וּת וְ/אִם אֵֽין בִּ֥/י כֹ֖חַ לְ/הַצִּ֑יל הֵ֣ן בְּ/גַעֲרָתִ֞/י אַחֲרִ֣יב יָ֗ם אָשִׂ֤ים נְהָרוֹת֙ מִדְבָּ֔ר תִּבְאַ֤שׁ דְּגָתָ/ם֙ מֵ/אֵ֣ין מַ֔יִם וְ/תָמֹ֖ת בַּ/צָּמָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/002.yaml
  text: Why[a], when I came, was there no man? When I called, was there no one to answer? Is my hand really too short to redeem, or is there no power in me to deliver? Behold[b], by my rebuke I dry up the sea; I make rivers a wilderness[c]; their fish stink for lack of water and die of thirst.
translation:
  language: fr
  text: 'Pourquoi, quand je suis venu, n’y avait-il personne[a] ? Pourquoi, quand j’ai appelé, personne n’a-t-il répondu ? Ma main est-elle donc trop courte pour racheter[b] ? Ou bien n’ai-je pas en moi la force de délivrer ? Voici : par ma réprimande[c], je mets la mer à sec, je change les fleuves en désert ; leurs poissons se mettent à sentir mauvais faute d’eau et meurent de soif.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et il n’y avait pas d’homme ». Ici, le masculin singulier אִישׁ a un sens représentatif et désigne toute personne dans cette phrase négative.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour libérer » ou « pour payer la rançon ». Le texte hébreu emploie l’image d’une main devenue trop courte, c’est-à-dire incapable d’agir.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « par ma menace ». Le mot hébreu désigne une parole de réprobation prononcée avec autorité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ בָּאתִי וְאֵין אִישׁ
  choice: Pourquoi suis-je venu sans trouver personne ?
  rationale: La question rhétorique est rendue dans un français naturel. אִישׁ désigne ici un être humain quelconque dans une tournure existentielle ; « personne » communique ce sens représentatif sans introduire une restriction masculine absente du propos.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: Pourquoi ai-je appelé sans que personne réponde ?
  rationale: « Appeler » conserve l’ambiguïté entre appel et convocation. La subordonnée française restitue naturellement le participe עוֹנֶה, qui désigne quelqu’un répondant à l’appel.
- source_word: הֲקָצוֹר קָצְרָה יָדִי מִפְּדוּת
  choice: Ma main serait-elle vraiment trop courte pour racheter ?
  rationale: La métaphore hébraïque de la main trop courte est maintenue comme image de l’incapacité. Le conditionnel interrogatif et « vraiment » rendent la vigueur rhétorique de la construction, tandis que « racheter » exprime פדות dans son champ de libération ou de rançon.
- source_word: וְאִם אֵין בִּי כֹחַ לְהַצִּיל
  choice: Ou bien n’ai-je pas la force de délivrer ?
  rationale: כֹחַ est rendu par « force » et הציל par « délivrer », terme assez large pour évoquer un sauvetage concret sans réduire le sens à une acception exclusivement spirituelle.
- source_word: הֵן
  choice: Voyez
  rationale: La particule attire l’attention sur la démonstration qui suit. « Voyez » garde cette fonction déictique dans un registre digne et actuel.
- source_word: בְּגַעֲרָתִי
  choice: par ma réprimande
  rationale: גערה désigne une parole autoritaire de réprobation. « Réprimande » conserve l’idée d’un acte verbal efficace, plutôt que de l’expliciter simplement comme puissance.
- source_word: אַחֲרִיב יָם
  choice: je mets la mer à sec
  rationale: Le hiphil de חרב peut signifier rendre sec ou dévaster. La mort des poissons faute d’eau montre que l’assèchement est ici au premier plan.
- source_word: אָשִׂים נְהָרוֹת מִדְבָּר
  choice: je change les fleuves en désert
  rationale: La construction exprime une transformation. Cette formulation française préserve l’image frappante du texte tout en restant idiomatique.
- source_word: תִּבְאַשׁ דְּגָתָם מֵאֵין מַיִם וְתָמֹת בַּצָּמָא
  choice: leurs poissons pourrissent faute d’eau et meurent de soif
  rationale: Le collectif דגה est naturellement rendu au pluriel. באש indique qu’ils deviennent infects ou pourrissent ; « pourrissent » exprime clairement la conséquence de l’assèchement.
theological_decisions:
- issue: Expression anthropomorphique de la puissance divine
  choice: Conserver « ma main… trop courte »
  alternative: « Ma puissance serait-elle insuffisante pour racheter ? »
  rationale: Le texte hébreu présente la capacité d’action divine au moyen de l’image corporelle de la main. La conserver maintient sa force rhétorique, tandis que la proposition suivante en donne déjà le sens par le mot « force ».
- issue: Portée de אִישׁ dans la première question
  choice: Employer « personne » dans le texte
  alternative: « aucun homme »
  rationale: 'Dans cette construction existentielle, le masculin singulier אִישׁ a une portée représentative : la question porte sur l’absence de tout répondant, non sur le sexe de celui-ci. La note signale toutefois la forme littérale.'
- issue: Rapport entre « racheter » et « délivrer »
  choice: Maintenir deux verbes distincts
  alternative: Traduire les deux membres par « sauver »
  rationale: פדות évoque le rachat ou la libération, tandis que הציל désigne plus largement l’action d’arracher au danger. La distinction française préserve le parallélisme sans effacer la nuance lexicale.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les questions rhétoriques restent vives et directes ; les métaphores de la main trop courte, de la mer asséchée et des fleuves changés en désert sont conservées. La ponctuation met en évidence le passage de l’interpellation à la démonstration de puissance.
