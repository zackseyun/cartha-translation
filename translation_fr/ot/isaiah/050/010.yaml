source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ יְרֵ֣א יְהוָ֔ה שֹׁמֵ֖עַ בְּ/ק֣וֹל עַבְדּ֑/וֹ אֲשֶׁ֣ר הָלַ֣ךְ חֲשֵׁכִ֗ים וְ/אֵ֥ין נֹ֨גַהּ֙ ל֔/וֹ יִבְטַח֙ בְּ/שֵׁ֣ם יְהוָ֔ה וְ/יִשָּׁעֵ֖ן בֵּ/אלֹהָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/010.yaml
  text: Who among you fears Yahweh[a], listening to the voice of his servant? Let the one who walks in darkness and has no light trust in the name of Yahweh and lean on his God.
translation:
  language: fr
  text: Qui d’entre vous craint Yahweh et écoute[a] la voix de son serviteur ? Que celui qui marche dans les ténèbres et n’a pas de lumière mette sa confiance dans le nom de Yahweh et s’appuie sur son Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « obéit à la voix de son serviteur » ou « tient compte de la voix de son serviteur ».'
    reason: L’hébreu שׁמע בקול peut désigner l’écoute attentive et, selon le contexte, le fait d’obéir ou de tenir compte de ce qui est dit.
lexical_decisions:
- source_word: מִי בָכֶם
  choice: Qui parmi vous
  rationale: Formulation interrogative directe, naturelle en français, qui conserve l’adresse à l’auditoire.
- source_word: יְרֵא יְהוָה
  choice: craint Yahweh
  rationale: « Craindre » conserve le poids de la crainte révérencielle associée à Dieu, sans l’atténuer en simple respect.
- source_word: שֹׁמֵעַ בְּקוֹל עַבְדּוֹ
  choice: écoute la voix de son serviteur
  rationale: שׁמע בקול peut impliquer l’obéissance, mais « écoute la voix » préserve à la fois l’image auditive et l’idée d’attention, sans expliciter davantage que l’hébreu.
- source_word: עַבְדּוֹ
  choice: son serviteur
  rationale: « Serviteur » convient au langage prophétique et ne tranche pas l’identité du personnage.
- source_word: אֲשֶׁר הָלַךְ חֲשֵׁכִים
  choice: celui qui marche dans les ténèbres
  rationale: Le présent français exprime naturellement la situation décrite; « les ténèbres » rend l’intensité du pluriel hébreu dans un registre biblique courant et intelligible.
- source_word: וְאֵין נֹגַהּ לוֹ
  choice: et n’a aucune lumière
  rationale: « Lumière » rend naturellement נֹגַהּ dans cette image d’une absence totale d’éclat ou d’illumination.
- source_word: יִבְטַח בְּשֵׁם יְהוָה
  choice: mette sa confiance dans le nom de Yahweh
  rationale: Cette tournure exprime clairement l’exhortation et conserve la notion théologiquement importante du « nom » révélé de Dieu.
- source_word: וְיִשָּׁעֵן בֵּאלֹהָיו
  choice: s’appuie sur son Dieu
  rationale: « S’appuyer sur » conserve la métaphore concrète de שׁען tout en étant idiomatique en français.
theological_decisions:
- issue: Identité de « son serviteur »
  choice: Le référent reste implicite dans « son serviteur ».
  alternative: Préciser qu’il s’agit du prophète, d’Israël ou de la figure messianique du Serviteur.
  rationale: Le contexte d’Ésaïe permet plusieurs associations, mais ce verset ne précise pas lui-même l’identité du serviteur; la traduction ne doit donc pas la fixer.
- issue: Portée de שֹׁמֵעַ בְּקוֹל
  choice: « écoute la voix »
  alternative: « obéit à la voix » ou « prête attention à la voix »
  rationale: L’expression peut comporter une implication d’obéissance, mais la formulation retenue conserve son sens auditif et son ambiguïté pragmatique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme, la métaphore des ténèbres et celle de l’appui, sans ajouter d’identification doctrinale au serviteur.
