source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֵ֣י זֶ֠ה סֵ֣פֶר כְּרִית֤וּת אִמְּ/כֶם֙ אֲשֶׁ֣ר שִׁלַּחְתִּ֔י/הָ א֚וֹ מִ֣י מִ/נּוֹשַׁ֔/י אֲשֶׁר מָכַ֥רְתִּי אֶתְ/כֶ֖ם ל֑/וֹ הֵ֤ן בַּ/עֲוֺנֹֽתֵי/כֶם֙ נִמְכַּרְתֶּ֔ם וּ/בְ/פִשְׁעֵי/כֶ֖ם שֻׁלְּחָ֥ה אִמְּ/כֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/001.yaml
  text: 'Thus says the LORD: Where is your mother''s certificate of divorce, with which I sent her away? Or which of my creditors is it to whom I sold you? Look, you were sold because of your iniquities, and your mother was sent away because of your transgressions.'
translation:
  language: fr
  text: 'Ainsi parle le SEIGNEUR : Où est l’acte de divorce de votre mère, par lequel je l’ai renvoyée ? Ou bien auquel de mes créanciers vous ai-je vendus ? Voici : c’est à cause de vos fautes que vous avez été vendus, et c’est à cause de vos révoltes que votre mère a été renvoyée.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֵפֶר כְּרִיתוּת
  choice: acte de divorce
  rationale: Expression juridique désignant le document officiel de répudiation; « acte » est naturel et précis en français moderne.
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Convention française courante qui distingue le nom divin par les petites capitales sans imposer une vocalisation incertaine.
- source_word: עֲוֹנוֹת
  choice: fautes
  rationale: Rend la culpabilité morale impliquée par le terme, dans une formulation accessible et non excessivement technique.
- source_word: פִשְׁעֵי
  choice: révoltes
  rationale: Préserve la nuance d’insubordination délibérée, plus forte que celle de simples erreurs.
- source_word: הֵן
  choice: Voici
  rationale: Conserve la particule emphatique qui introduit le contraste et l’explication décisive.
theological_decisions:
- issue: Responsabilité de l’exil figurée par le divorce et la vente
  choice: Conserver les deux questions rhétoriques puis attribuer explicitement la vente et le renvoi aux fautes et aux révoltes du peuple.
  alternative: Formuler comme si Dieu avait effectivement divorcé de la mère ou vendu le peuple à un créancier.
  rationale: Le texte nie implicitement l’existence d’un acte de divorce ou d’un créancier divin, tout en affirmant que les conséquences subies proviennent des péchés du peuple.
- issue: Relation entre « vous » et « votre mère »
  choice: Maintenir la métaphore collective sans identifier davantage la mère.
  alternative: Expliciter « votre mère, Sion » ou « Jérusalem ».
  rationale: L’identification est probable dans le contexte prophétique, mais elle n’est pas formulée dans ce verset; l’expliciter réduirait la portée de l’image.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le parallélisme hébraïque et les images juridiques sont conservés; « renvoyée » maintient le lien verbal avec la répudiation sans alourdir le texte.
