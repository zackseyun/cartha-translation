  variant: modern international French
source:
  edition: WLC
  text: אֲדֹנָ֣/י יְהֹוִ֗ה נָ֤תַן לִ/י֙ לְשׁ֣וֹן לִמּוּדִ֔ים לָ/דַ֛עַת לָ/ע֥וּת אֶת יָעֵ֖ף דָּבָ֑ר יָעִ֣יר בַּ/בֹּ֣קֶר בַּ/בֹּ֗קֶר יָעִ֥יר לִ/י֙ אֹ֔זֶן לִ/שְׁמֹ֖עַ כַּ/לִּמּוּדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/004.yaml
  text: The Lord GOD has given me the tongue of those who are taught[a], that I may know how to sustain the weary with a word. Morning by morning he awakens[c][b]; he awakens my ear to hear like those who are taught.
translation:
  language: fr
  text: Le Seigneur Yahweh[c] m’a donné la langue de ceux qui sont instruits[a], afin que je sache soutenir par une parole celui qui est fatigué[b]. Matin après matin, il m’éveille ; il éveille mon oreille afin que j’entende comme ceux qui sont instruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la langue des disciples » ou « la langue des personnes enseignées ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe hébreu traduit par « soutenir » est difficile ; il pourrait aussi signifier « aider » ou, moins probablement, « répondre à » celui qui est fatigué.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu associe ici le titre אֲדֹנָי (« Seigneur ») au nom divin YHWH (« Yahweh »).
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  rationale: Le titre associe אֲדֹנָי (« Seigneur ») au nom divin YHWH. « Le Seigneur Yahweh » conserve les deux éléments sans produire l’expression peu naturelle « le Seigneur, le SEIGNEUR ».
- source_word: לְשׁוֹן
  choice: la langue
  rationale: La métaphore hébraïque désigne la faculté de parler et reste naturelle en français.
- source_word: לִמּוּדִים
  choice: ceux qui sont instruits
  rationale: Cette formulation conserve le sens de personnes formées ou enseignées sans imposer le sens plus spécialisé de « disciples ». Le même choix est repris à la fin du verset afin de préserver le parallèle.
- source_word: לָדַעַת
  choice: afin que je sache
  rationale: L’infinitif exprime ici le but du don reçu ; cette tournure est claire et naturelle en français.
- source_word: לָעוּת
  choice: soutenir
  rationale: Le verbe, rare et difficile, paraît désigner ici une aide apportée à la personne épuisée. « Soutenir » convient au contexte tout en laissant une note signaler l’incertitude lexicale.
- source_word: יָעֵף
  choice: celui qui est épuisé
  rationale: L’adjectif substantivé désigne une personne accablée par la fatigue ; le singulier français reflète le singulier hébreu.
- source_word: דָּבָר
  choice: par une parole
  rationale: Le nom signifie « parole » ou « chose ». Dans ce contexte, « par une parole » exprime naturellement le moyen par lequel la personne épuisée est soutenue.
- source_word: יָעִיר
  choice: éveille
  rationale: Le hifil de עור signifie « éveiller » ou « réveiller ». La répétition du verbe est conservée.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Matin après matin
  rationale: Cette expression restitue la répétition hébraïque et l’idée d’une action régulière.
- source_word: אֹזֶן
  choice: mon oreille
  rationale: Le datif « à moi » et le contexte indiquent que l’oreille est celle du locuteur ; le possessif est nécessaire en français naturel.
- source_word: לִשְׁמֹעַ
  choice: pour que j’écoute
  rationale: Dans ce contexte d’instruction reçue, « écouter » exprime la réception attentive suggérée par la construction, sans ajouter de contenu doctrinal.
- source_word: כַּלִּמּוּדִים
  choice: comme ceux qui sont instruits
  rationale: La traduction reprend exactement le choix fait pour la première occurrence de לִמּוּדִים, maintenant ainsi la cohésion du verset.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  alternative: Le Seigneur DIEU
  rationale: Le texte porte à la fois le titre אֲדֹנָי et le nom propre YHWH. Le choix retenu rend explicitement les deux et évite de remplacer silencieusement le nom divin par un titre.
- issue: Identité des לִמּוּדִים
  choice: ceux qui sont instruits
  alternative: les disciples
  rationale: Le mot peut évoquer des disciples, mais le sens plus large de personnes enseignées préserve l’ambiguïté et n’introduit pas une catégorie religieuse plus précise que l’hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure poétique, la répétition de « il éveille » et le parallèle entre parler et écouter comme une personne instruite sont conservés. Le point-virgule rend lisible la reprise hébraïque sans l’aplanir.
