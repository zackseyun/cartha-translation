id: ISA.50.3
reference: Isaiah 50:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אַלְבִּ֥ישׁ שָׁמַ֖יִם קַדְר֑וּת וְ/שַׂ֖ק אָשִׂ֥ים כְּסוּתָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/003.yaml
  text: I clothe the heavens with darkness[b][a], and I make sackcloth their covering.
translation:
  language: fr
  text: Je revêts les cieux d’obscurité[a] et je fais de la toile de sac[b] leur couverture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de noirceur » ou « de ténèbres ».
    reason: lexical_alternative
  - marker: b
    text: La toile de sac était une étoffe grossière portée notamment en signe de deuil et d’affliction.
    reason: cultural_note
lexical_decisions:
- source_word: אַלְבִּישׁ
  choice: Je revêts
  rationale: Le hifil de לבשׁ exprime l’action de vêtir. « Je revêts » conserve ce sens causatif et convient au registre poétique.
- source_word: שָׁמַיִם
  choice: les cieux
  rationale: Le pluriel « les cieux » respecte la forme hébraïque et maintient le registre élevé de l’image.
- source_word: קַדְרוּת
  choice: d’obscurité
  rationale: Le nom peut désigner l’obscurité, la noirceur ou une sombre tristesse. « Obscurité » est naturel en français et laisse ouverte la portée cosmique et funèbre de l’image.
- source_word: וְשַׂק
  choice: et de la toile de sac
  rationale: שַׂק désigne une étoffe grossière associée notamment au deuil. « Toile de sac » est plus immédiatement compréhensible en français moderne que le seul mot « sac », tout en conservant la référence culturelle.
- source_word: אָשִׂים
  choice: je fais de
  rationale: Dans cette construction, שׂים signifie mettre ou établir quelque chose comme couverture. « Je fais de… leur couverture » rend clairement cette relation sans ajouter d’interprétation.
- source_word: כְּסוּתָם
  choice: leur couverture
  rationale: Le terme désigne ce qui couvre, voire un vêtement. « Leur couverture » reprend le parallélisme avec « Je revêts » sans préciser excessivement la métaphore.
theological_decisions:
- issue: Imagerie cosmique de jugement et de deuil
  choice: Conserver l’image de Dieu revêtant les cieux d’obscurité et leur donnant une toile de deuil pour couverture.
  alternative: Interpréter explicitement soit un obscurcissement cosmique littéral, soit une métaphore du deuil et du jugement.
  rationale: L’hébreu unit l’obscurcissement des cieux et le symbole funèbre de la toile de sac. La formulation préserve la tension entre phénomène cosmique et langage métaphorique sans imposer une seule lecture.
translation_notes:
  register: Français international moderne, digne et poétique. « Je revêts » et « les cieux » conservent l’élévation du texte, tandis que la syntaxe reste claire pour un lectorat général.
