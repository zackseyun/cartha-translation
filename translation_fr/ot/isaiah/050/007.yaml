id: ISA.50.7
reference: Isaiah 50:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/אדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י עַל כֵּ֖ן לֹ֣א נִכְלָ֑מְתִּי עַל כֵּ֞ן שַׂ֤מְתִּי פָנַ/י֙ כַּֽ/חַלָּמִ֔ישׁ וָ/אֵדַ֖ע כִּי לֹ֥א אֵבֽוֹשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/007.yaml
  text: But the Lord GOD helps me[a]; therefore I have not been disgraced. Therefore I have set my face like flint[d][c][b], and I know that I will not be put to shame.
translation:
  language: fr
  text: Mais le Seigneur Yahweh vient à mon aide ; c’est pourquoi je n’ai pas été humilié. C’est pourquoi j’ai rendu mon visage dur comme le silex[a], et je sais que je ne serai pas couvert de honte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image du visage rendu dur comme le silex exprime une résolution ferme face à l’opposition.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Le titre composé associe אֲדֹנָי (« Seigneur ») au nom divin YHWH. « Le Seigneur Yahweh » conserve cette distinction sans produire le maladroit « le Seigneur le SEIGNEUR ».
- source_word: יַעֲזָר לִי
  choice: vient à mon aide
  rationale: L’imparfait exprime ici une assurance actuelle et tournée vers l’avenir. Cette formulation rend naturellement l’action secourable de עזר sans imposer une valeur temporelle trop étroite.
- source_word: עַל כֵּן
  choice: c’est pourquoi
  rationale: La reprise exacte de la locution dans les deux propositions conserve l’enchaînement logique et l’insistance rhétorique de l’hébreu.
- source_word: לֹא נִכְלָמְתִּי
  choice: je n’ai pas été humilié
  rationale: Le niphal de כלם désigne le fait de subir humiliation ou déshonneur. « Humilié » préserve la valeur passive et distingue légèrement ce terme du verbe בוש à la fin du verset.
- source_word: שַׂמְתִּי פָנַי כַּחַלָּמִישׁ
  choice: j’ai rendu mon visage dur comme le silex
  rationale: 'La formulation conserve l’image concrète du visage et du silex, tout en explicitant en français la qualité suggérée par la comparaison : une résolution inflexible.'
- source_word: וָאֵדַע
  choice: et je sais
  rationale: Le présent français exprime bien la certitude établie du locuteur, plutôt qu’une simple acquisition passée de connaissance.
- source_word: לֹא אֵבוֹשׁ
  choice: je ne serai pas couvert de honte
  rationale: בוש peut désigner le fait d’être publiquement honteux ou confondu. Cette expression garde la dimension résultative et publique tout en évitant de réduire le sens au sentiment intérieur d’avoir honte.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le texte porte explicitement le titre אֲדֹנָי suivi du nom propre divin YHWH. La translittération « Yahweh » préserve le nom d’alliance et distingue les deux éléments du titre.
- issue: Rapport entre נכלם et בוש
  choice: « humilié » puis « couvert de honte »
  alternative: Employer « honte » dans les deux propositions
  rationale: Les deux verbes appartiennent au même champ de la honte et du déshonneur sans être strictement identiques. Deux expressions proches maintiennent à la fois leur parallélisme théologique et leur nuance lexicale.
translation_notes:
  register: Français moderne, international et digne. La répétition de « c’est pourquoi » reproduit la structure insistante de l’hébreu. L’image du silex est conservée et légèrement explicitée dans le corps du texte pour rester immédiatement compréhensible.
