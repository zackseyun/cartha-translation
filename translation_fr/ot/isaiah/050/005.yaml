  text: אֲדֹנָ֤/י יְהוִה֙ פָּתַֽח לִ֣/י אֹ֔זֶן וְ/אָנֹכִ֖י לֹ֣א מָרִ֑יתִי אָח֖וֹר לֹ֥א נְסוּגֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/005.yaml
  text: The Lord GOD has opened my ear[a], and I was not rebellious; I did not turn back.
translation:
  language: fr
  text: Le Seigneur Yahweh m’a ouvert l’oreille, et moi, je ne me suis pas rebellé ; je n’ai pas reculé.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne me suis pas retiré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  rationale: Le titre composé conserve à la fois אֲדֹנָי (« Seigneur ») et le nom divin יהוה (« Yahweh »), sans produire l’expression peu naturelle « le Seigneur SEIGNEUR ».
- source_word: פָּתַח לִי אֹזֶן
  choice: m’a ouvert l’oreille
  rationale: Cette formulation naturelle en français conserve l’image concrète de l’hébreu, littéralement « a ouvert pour moi une oreille », plutôt que de l’expliciter par « m’a rendu attentif ».
- source_word: מָרִיתִי
  choice: je ne me suis pas rebellé
  rationale: Le verbe מרה exprime la rébellion ou l’insoumission. Le passé composé convient au témoignage rétrospectif et maintient le lien avec l’acte divin précédent.
- source_word: אָחוֹר לֹא נְסוּגֹתִי
  choice: je n’ai pas reculé
  rationale: סוג signifie aller en arrière, reculer ou se retirer. « Reculer » rend idiomatiquement l’ensemble formé avec אָחוֹר, sans ajouter un objet absent de l’hébreu.
theological_decisions:
- issue: Rendu du nom divin dans le titre אֲדֹנָי יְהוִה
  choice: Le Seigneur Yahweh
  alternative: Le Seigneur DIEU
  rationale: Le choix maintient distinctement le titre אֲדֹנָי et le nom propre יהוה, conformément à la donnée hébraïque, sans remplacer silencieusement le Tétragramme par un titre.
- issue: Nature de l’ouverture de l’oreille
  choice: Conserver l’image « m’a ouvert l’oreille »
  alternative: m’a rendu attentif / m’a appris à écouter
  rationale: L’hébreu emploie une image concrète dont la portée peut inclure l’écoute et l’obéissance. La traduction ne tranche pas entre ces nuances par une explicitation théologique.
translation_notes:
  register: Français international moderne, digne et direct. La reprise emphatique de וְאָנֹכִי est rendue par « et moi ». Le singulier concret « l’oreille » est conservé. La note maintient une autre nuance possible de נסוג sans alourdir le texte principal.
