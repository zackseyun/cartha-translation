source:
  edition: WLC
  text: קָרוֹב֙ מַצְדִּיקִ֔/י מִֽי יָרִ֥יב אִתִּ֖/י נַ֣עַמְדָה יָּ֑חַד מִֽי בַ֥עַל מִשְׁפָּטִ֖/י יִגַּ֥שׁ אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/008.yaml
  text: Near is the one who vindicates me[a]; who will contend with me? Let us stand together[b]. Who is the master of my case? Let him come near to me.
translation:
  language: fr
  text: Celui qui me donne raison[a] est proche. Qui plaidera contre moi ? Comparaissons ensemble. Qui est mon adversaire en justice[b] ? Qu’il s’approche de moi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui me justifie » ou « celui qui me déclare juste ». Le verbe hébreu a ici un sens judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « le maître » ou « le détenteur de mon affaire judiciaire », c’est-à-dire la partie qui détient ou fait valoir une prétention en justice contre moi.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב
  choice: Il est proche
  rationale: L’adjectif placé en tête souligne la proximité immédiate. Cette tournure française conserve l’emphase sans adopter l’ordre hébreu peu naturel « Proche est… ».
- source_word: מַצְדִּיקִי
  choice: celui qui me donne raison
  rationale: 'Le hiphil de צדק a ici une valeur judiciaire : il s’agit de reconnaître publiquement le bon droit du serviteur. « Me donne raison » est naturel en français et évite aussi bien l’idée d’une transformation morale que le poids doctrinal possible de « me justifie ».'
- source_word: יָרִיב אִתִּי
  choice: contestera avec moi
  rationale: ריב évoque une querelle ou une contestation, notamment judiciaire. La formulation garde à la fois la confrontation directe et la couleur juridique du contexte.
- source_word: נַעַמְדָה יָּחַד
  choice: Comparaissons ensemble
  rationale: Le cohortatif invite l’adversaire à se présenter avec le locuteur. « Comparaissons » explicite naturellement en français la scène judiciaire suggérée par le fait de se tenir ensemble devant le tribunal.
- source_word: בַעַל מִשְׁפָּטִי
  choice: Qui a un litige avec moi
  rationale: Littéralement, l’expression désigne le « maître » ou détenteur de la cause judiciaire. La formulation choisie transmet en français courant l’idée de la partie qui soutient une prétention en justice contre le locuteur.
- source_word: יִגַּשׁ אֵלָי
  choice: Qu’il s’approche de moi
  rationale: 'La forme exprime un défi : que l’adversaire vienne se présenter. « S’approche » fait en outre écho à la proximité affirmée au début du verset.'
theological_decisions:
- issue: Valeur judiciaire ou morale de מַצְדִּיקִי
  choice: 'Valeur judiciaire : « celui qui me donne raison »'
  alternative: « celui qui me rend juste » ou « celui qui me justifie »
  rationale: Le vocabulaire environnant — contestation, comparution et litige — établit une scène de tribunal. La traduction exprime donc une reconnaissance du bon droit, sans introduire une transformation morale ni imposer une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, digne et direct. Le champ lexical judiciaire est rendu dans des termes accessibles (« donne raison », « comparaissons », « litige »), tandis que les notes conservent les formulations plus littérales et l’ambiguïté lexicale pertinente.
