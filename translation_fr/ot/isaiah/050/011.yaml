source:
  edition: WLC
  text: הֵ֧ן כֻּלְּ/כֶ֛ם קֹ֥דְחֵי אֵ֖שׁ מְאַזְּרֵ֣י זִיק֑וֹת לְכ֣וּ בְּ/א֣וּר אֶשְׁ/כֶ֗ם וּ/בְ/זִיקוֹת֙ בִּֽעַרְתֶּ֔ם מִ/יָּדִ/י֙ הָיְתָה זֹּ֣את לָ/כֶ֔ם לְ/מַעֲצֵבָ֖ה תִּשְׁכָּבֽוּ/ן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/011.yaml
  text: 'Look[a], all of you who kindle a fire, who gird yourselves with burning arrows: walk in the light of your fire and among the arrows you have set ablaze[b]. This has come to you from my hand: you will lie down in torment.'
translation:
  language: fr
  text: 'Eh bien, vous tous qui allumez un feu et qui vous ceignez de traits enflammés[a] : marchez à la lumière de votre feu, au milieu des traits que vous avez embrasés. C’est de ma main que cela vous est venu : vous vous coucherez dans la souffrance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’étincelles », « de brandons » ou « de flèches enflammées ».
    reason: Le sens précis de זִיקוֹת est discuté; le mot peut évoquer des étincelles, des objets incendiaires ou des projectiles ardents.
  - marker: b
    text: Ou « dans la douleur », « dans le chagrin » ou « dans l’angoisse ».
    reason: מַעֲצֵבָה désigne une douleur ou une détresse dont la nuance exacte reste ouverte.
lexical_decisions:
- source_word: הֵן
  choice: Voici
  rationale: L’interjection attire solennellement l’attention sur la déclaration qui suit, dans un français actuel et digne.
- source_word: קֹדְחֵי אֵשׁ
  choice: qui allumez un feu
  rationale: 'Le participe est compris activement : ces personnes produisent elles-mêmes le feu auquel elles se fient.'
- source_word: מְאַזְּרֵי
  choice: qui vous ceignez de
  rationale: Cette formulation conserve l’image concrète du verbe אזר, « ceindre », ainsi que sa valeur réfléchie, sans la réduire à un simple « vous munissez ».
- source_word: זִיקוֹת
  choice: traits enflammés
  rationale: Le terme peut désigner des projectiles ou brandons ardents, voire des étincelles. « Traits enflammés » s’accorde bien avec l’idée de s’en ceindre, tout en gardant l’image hostile; les autres sens plausibles sont signalés en note.
- source_word: לְכוּ
  choice: marchez
  rationale: L’impératif garde l’image du déplacement dans la lumière produite par ces personnes et laisse percevoir le défi ironique du contexte.
- source_word: בְּאוּר אֶשְׁכֶם
  choice: à la lumière de votre feu
  rationale: Cette tournure française naturelle conserve l’ironie d’une lumière fabriquée par ceux qui y marchent.
- source_word: וּבְזִיקוֹת בִּעַרְתֶּם
  choice: au milieu des traits que vous avez embrasés
  rationale: « Au milieu de » rend naturellement la préposition, tandis que « embrasés » exprime l’action de mettre le feu et maintient le lien avec la première occurrence de זִיקוֹת.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: L’expression concrète est conservée, car elle souligne l’intervention directe du locuteur divin.
- source_word: לְמַעֲצֵבָה
  choice: dans la souffrance
  rationale: Le nom exprime la douleur ou la détresse. « Souffrance » préserve cette étendue sémantique sans imposer exclusivement une douleur physique ou un chagrin intérieur.
- source_word: תִּשְׁכָּבוּן
  choice: vous vous coucherez
  rationale: La traduction littérale maintient l’image finale d’un repos qui se transforme en état de souffrance.
theological_decisions:
- issue: Valeur des impératifs « marchez à la lumière de votre feu »
  choice: Un défi ironique à poursuivre une voie qui aboutira au jugement
  alternative: Une invitation neutre à continuer dans la voie choisie
  rationale: La mention de la main du locuteur et l’annonce finale de la souffrance donnent aux impératifs une force judiciaire et ironique, sans qu’il soit nécessaire de l’expliciter dans le texte.
- issue: Identité du locuteur dans « de ma main »
  choice: Dieu est le locuteur et présente l’issue annoncée comme venant de sa main
  alternative: Le serviteur serait le locuteur immédiat
  rationale: Dans le cadre du discours prophétique, la main qui impose cette conséquence est naturellement comprise comme celle de Dieu. La traduction ne remplace toutefois pas le pronom par un nom et laisse intacte la formulation du texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition du feu et des traits est maintenue, ainsi que l’image inhabituelle de se ceindre. Les deux-points font ressortir le passage du défi ironique à la sentence.
