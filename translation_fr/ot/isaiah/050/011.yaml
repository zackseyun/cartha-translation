  rationale: 'La révision est limitée à deux points sûrs : une introduction plus idiomatique en français moderne et la restitution de l’accompli de הָיְתָה. Les choix lexicaux disputés relatifs à זִיקוֹת, ainsi que leurs notes, sont maintenus afin de ne pas trancher artificiellement l’ambiguïté du terme.'
