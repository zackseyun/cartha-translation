review_pass:
  verdict: revise
  source_fidelity: La représentation des participes (« qui allumez », « qui vous ceignez »), de l’impératif, de l’image répétée des זִיקוֹת et de la conclusion est globalement fidèle. « Traits enflammés » est un choix défendable pour זִיקוֹת, terme disputé, et la note préserve correctement les principales possibilités. En revanche, « ce qui vous arrivera » transforme הָיְתָה (« a été / est advenu ») en un futur explicite. Il convient de conserver l’aspect du texte hébreu, même si la formule fonctionne dans un oracle de jugement.
  naturalness: Le registre est moderne et solennel. « Voici, vous tous » est toutefois un peu heurté en français actuel; « Eh bien, vous tous » rend plus naturellement l’interjection introductive tout en gardant son ton de mise en garde. « Vous vous coucherez dans la souffrance » est clair et conserve l’image.
  terminology: « Vous ceignez de traits enflammés » conserve intentionnellement l’image concrète et réflexive de אזר. « Traits enflammés » est cohérent avec la répétition subséquente; les alternatives « étincelles », « brandons » et « flèches enflammées » doivent rester en note. « Souffrance » est un rendu ample et non confessionnel de לְמַעֲצֵבָה.
  issues:
  - severity: medium
    issue: Temps de la proposition issue de הָיְתָה
    rationale: « Voilà ce qui vous arrivera de ma main » introduit un futur (« arrivera ») absent de la forme accomplie hébraïque. « C’est de ma main que cela vous est venu » conserve l’accompli sans supprimer la tension oraculaire avec le futur final.
  - severity: low
    issue: Formulation introductive peu idiomatique
    rationale: « Voici, vous tous qui… » est compréhensible mais raide en français moderne. « Eh bien, vous tous qui… » est une introduction naturelle et garde la force déictique/exhortative de הֵן.
