  source_fidelity: 'Le texte rend fidèlement les éléments essentiels de l’hébreu : l’affirmation emphatique הֵן, le titre composé אֲדֹנָי יְהוִה, le secours divin, la question judiciaire introduite par מִי הוּא, puis l’image des opposants qui s’usent comme un vêtement et sont mangés par la mite. « Viendra à mon aide » n’est pas exigé : le présent « vient à mon aide » rend de façon recevable l’imparfait dans cette déclaration confiante.'
