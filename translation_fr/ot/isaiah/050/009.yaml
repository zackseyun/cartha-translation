id: ISA.50.9
reference: Isaiah 50:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן אֲדֹנָ֤/י יְהוִה֙ יַֽעֲזָר לִ֔/י מִי ה֖וּא יַרְשִׁיעֵ֑/נִי הֵ֤ן כֻּלָּ/ם֙ כַּ/בֶּ֣גֶד יִבְל֔וּ עָ֖שׁ יֹאכְלֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/050/009.yaml
  text: Behold[a], the Lord GOD helps me; who is he who will declare me guilty? Behold, all of them will wear out like a garment; a moth will eat them.
translation:
  language: fr
  text: 'Oui, le Seigneur Yahweh vient à mon aide : qui me déclarera coupable[a] ? Oui, eux tous s’useront comme un vêtement ; la mite les mangera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui me condamnera ? » Le verbe hébreu relève du langage judiciaire : il signifie déclarer quelqu’un coupable ou le condamner en jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule attire l’attention et renforce l’assurance du locuteur. « Oui » restitue ici cette insistance avec naturel et dignité en français moderne.
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  rationale: Rend distinctement le titre אֲדֹנָי et le nom divin יהוה, sans produire l’expression maladroite « le Seigneur SEIGNEUR ».
- source_word: יַעֲזָר לִי
  choice: vient à mon aide
  rationale: L’imparfait hébreu peut exprimer une action présente ou à venir. Cette formulation française porte l’idée de secours assuré sans imposer une temporalité trop étroite.
- source_word: מִי הוּא יַרְשִׁיעֵנִי
  choice: qui me déclarera coupable ?
  rationale: 'Le hiphil de רשע appartient au registre judiciaire : il s’agit de prononcer quelqu’un coupable. Le pronom explicite הוּא renforce la question en hébreu, mais son calque serait lourd en français.'
- source_word: כֻּלָּם
  choice: eux tous
  rationale: Conserve à la fois la totalité et l’accent mis sur les adversaires.
- source_word: כַּבֶּגֶד יִבְלוּ
  choice: s’useront comme un vêtement
  rationale: Préserve l’image concrète de la détérioration progressive d’un vêtement.
- source_word: עָשׁ יֹאכְלֵם
  choice: la mite les mangera
  rationale: Maintient l’image vive et littérale du texte hébreu ; le singulier générique se rend naturellement avec l’article défini en français.
theological_decisions:
- issue: Rendu du nom divin dans אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix conserve les deux éléments du titre composé et distingue le nom propre divin du titre « Seigneur », sans dépendre d’une résolution confessionnelle particulière.
- issue: Portée judiciaire de יַרְשִׁיעֵנִי
  choice: me déclarera coupable
  alternative: me condamnera
  rationale: « Déclarer coupable » exprime directement le verdict judiciaire du verbe ; « condamner » est idiomatique, mais peut aussi suggérer l’imposition de la peine.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le parallélisme et les images concrètes du texte sont conservés ; la syntaxe est légèrement réordonnée pour rester naturelle en français.
