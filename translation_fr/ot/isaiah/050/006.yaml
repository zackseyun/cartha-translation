  yaml_path: translation/ot/isaiah/050/006.yaml
  text: I gave my back to those who strike[a], and my cheeks to those who pull out the beard; I did not hide my face from disgrace and spitting.
translation:
  language: fr
  text: 'J’ai donné mon dos à ceux qui me frappaient,

    et mes joues à ceux qui m’arrachaient les poils de la barbe[a] ;

    je n’ai pas caché mon visage

    aux humiliations et aux crachats.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ceux qui m’arrachaient les poils ». L’hébreu dit littéralement « à ceux qui arrachent » et ne précise pas l’objet ; dans ce contexte, il s’agit probablement des poils de la barbe.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּוִי
  choice: mon dos
  rationale: גֵּו peut désigner le dos ou le corps. Dans le contexte des coups, « mon dos » est précis et naturel.
- source_word: נָתַתִּי
  choice: J’ai livré
  rationale: נתן signifie fondamentalement « donner ». Ici, « livrer » exprime naturellement le fait de présenter volontairement son dos aux coups, sans ajouter une interprétation théologique.
- source_word: לְמַכִּים
  choice: à ceux qui me frappaient
  rationale: Le participe de נכה désigne ceux qui portent des coups. L’imparfait français convient à l’action exercée par ces personnes et l’objet « me » est clairement impliqué par « mon dos ».
- source_word: וּלְחָיַי
  choice: et mes joues
  rationale: לְחִי désigne la joue ou la mâchoire. Le pluriel « mes joues » rend directement la forme munie du suffixe possessif.
- source_word: לְמֹרְטִים
  choice: à ceux qui m’arrachaient les poils
  rationale: מרט signifie arracher ou épiler. L’hébreu ne nomme pas explicitement l’objet arraché ; « les poils » conserve cette relative indétermination, tandis qu’une note indique l’interprétation probable de la barbe.
- source_word: פָּנַי
  choice: mon visage
  rationale: Rendu direct de פָּנִים avec le suffixe de première personne.
- source_word: לֹא הִסְתַּרְתִּי
  choice: je n’ai pas caché
  rationale: Le hiphil de סתר signifie cacher ou dissimuler. La formulation conserve l’image physique et la négation directe de l’hébreu.
- source_word: מִכְּלִמּוֹת
  choice: aux humiliations
  rationale: כְּלִמּוֹת évoque la honte, l’opprobre ou les actes humiliants. Le pluriel français « humiliations » respecte le pluriel hébreu et s’accorde naturellement avec « crachats ».
- source_word: וָרֹק
  choice: et aux crachats
  rationale: רֹק désigne la salive ou le fait de cracher. « Crachats » restitue concrètement l’acte insultant et forme en français un parallélisme naturel avec « humiliations ».
theological_decisions:
- issue: Rendre explicite ou non l’application messianique et christologique du serviteur
  choice: Maintenir la parole à la première personne sans identifier explicitement le locuteur au Messie ou à Jésus.
  alternative: Formuler le verset de manière à mettre en avant son accomplissement dans la passion de Jésus.
  rationale: Le texte hébreu présente simplement la parole du serviteur à la première personne. Son application christologique appartient à l’interprétation canonique et théologique, mais ne doit pas être ajoutée au libellé du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en trois lignes fait ressortir le parallélisme poétique. « Livré » reste idiomatique tout en conservant l’idée de participation volontaire portée par le contexte. Le texte évite d’expliciter une identification christologique absente de la formulation hébraïque.
