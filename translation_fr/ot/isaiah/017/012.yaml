  text: ה֗וֹי הֲמוֹן֙ עַמִּ֣ים רַבִּ֔ים כַּ/הֲמ֥וֹת יַמִּ֖ים יֶהֱמָי֑וּ/ן וּ/שְׁא֣וֹן לְאֻמִּ֔ים כִּ/שְׁא֛וֹן מַ֥יִם כַּבִּירִ֖ים יִשָּׁאֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/012.yaml
  text: Ah[a], the roar of many peoples— they roar like the roaring of the seas[b]; and the rushing of nations— they rush like the rushing of mighty waters.
translation:
  language: fr
  text: Ah ![a] Quel grondement de peuples nombreux ! Ils grondent comme grondent les mers[b]. Quel fracas de nations ! Elles grondent comme grondent des eaux puissantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Malheur ! Une multitude de peuples nombreux… » L’interjection hébraïque peut introduire une lamentation, un avertissement ou un appel à l’attention.'
    reason: alternative_reading
  - marker: b
    text: L’hébreu répète, dans chaque membre, des termes liés au bruit — « grondement/gronder » puis « fracas/gronder » — afin d’intensifier l’image de nations tumultueuses comparées aux mers et aux eaux puissantes.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Ah !
  rationale: Interjection exclamative pouvant exprimer la lamentation, l’avertissement ou attirer l’attention. « Ah ! » conserve ici cette ouverture sans imposer le sens de malédiction.
- source_word: הֲמוֹן עַמִּים רַבִּים
  choice: Quel grondement de peuples nombreux !
  rationale: הֲמוֹן peut désigner une multitude ou son tumulte. Le verbe apparenté et la comparaison avec les mers favorisent le sens sonore de « grondement », tandis que « peuples nombreux » rend directement עַמִּים רַבִּים.
- source_word: כַּהֲמוֹת יַמִּים יֶהֱמָיוּן
  choice: Ils grondent comme grondent les mers
  rationale: La répétition de « grondent » reproduit la reprise hébraïque de la racine ה־מ־ה et garde le pluriel poétique « les mers ».
- source_word: וּשְׁאוֹן לְאֻמִּים
  choice: Quel fracas de nations !
  rationale: שָׁאוֹן évoque un bruit violent ou un tumulte. « Fracas » distingue cette seconde image de « grondement » tout en maintenant sa force acoustique; לְאֻמִּים est rendu par « nations ».
- source_word: כִּשְׁאוֹן מַיִם כַּבִּירִים יִשָּׁאוּן
  choice: Elles font fracas comme des eaux puissantes
  rationale: La répétition de « fracas » reflète le lien entre שְׁאוֹן et יִשָּׁאוּן. « Eaux puissantes » traduit naturellement מַיִם כַּבִּירִים et évoque leur force imposante.
theological_decisions:
- issue: Valeur de l’interjection הוֹי
  choice: Ah !
  alternative: Malheur ! / Hélas !
  rationale: Le contexte immédiat décrit le tumulte des peuples sans formuler explicitement contre eux une sentence de malheur. La note conserve les autres valeurs possibles de l’interjection.
translation_notes:
  register: Français international moderne, poétique et digne. Les exclamations rendent la syntaxe nominale énergique de l’hébreu; les répétitions intentionnelles préservent son effet sonore et son parallélisme.
