  text: וְ/לֹ֣א יִשְׁעֶ֔ה אֶל הַֽ/מִּזְבְּח֖וֹת מַעֲשֵׂ֣ה יָדָ֑י/ו וַ/אֲשֶׁ֨ר עָשׂ֤וּ אֶצְבְּעֹתָי/ו֙ לֹ֣א יִרְאֶ֔ה וְ/הָ/אֲשֵׁרִ֖ים וְ/הָ/חַמָּנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/008.yaml
  text: And he will not look to the altars[a], the work of his hands[b], and he will not regard what his fingers have made—the Asherim and the incense altars.
translation:
  language: fr
  text: Il ne se tournera pas vers les autels qu’ont faits ses mains, et il ne regardera pas ce que ses doigts ont fait, ni les ashérim[a] ni les hammanim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Objets cultuels associés à la déesse Ashéra ; on traduit aussi « poteaux sacrés d’Ashéra ». Leur forme exacte pouvait varier.
    reason: lexical_alternative
  - marker: b
    text: Terme hébreu désignant des objets cultuels dont la forme et la fonction précises sont incertaines ; on traduit aussi « stèles solaires », « images du soleil » ou « autels à encens ».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁעֶה
  choice: se tournera vers
  rationale: Dans ce contexte cultuel, le verbe exprime une attention orientée vers un objet de confiance ou de dévotion, et non un simple regard visuel.
- source_word: הַמִּזְבְּחוֹת
  choice: les autels
  rationale: Le terme désigne directement des autels; aucune précision supplémentaire n’est nécessaire.
- source_word: מַעֲשֵׂה יָדָיו
  choice: œuvre de ses mains
  rationale: Cette formulation conserve l’image hébraïque et la critique prophétique d’objets religieux fabriqués par l’être humain.
- source_word: וַאֲשֶׁר עָשׂוּ אֶצְבְּעֹתָיו
  choice: ce que ses doigts ont fait
  rationale: La traduction garde le parallélisme concret entre les mains et les doigts tout en restant naturelle en français.
- source_word: יִרְאֶה
  choice: regardera
  rationale: Le verbe signifie littéralement « voir », mais désigne ici un regard attentif; « regardera » préserve ce sens sans surinterprétation.
- source_word: הָאֲשֵׁרִים
  choice: les ashérim
  rationale: La translittération conserve la désignation hébraïque d’objets cultuels associés à Ashéra sans imposer leur forme matérielle exacte.
- source_word: הַחַמָּנִים
  choice: les piliers solaires
  rationale: Le terme rare semble désigner des objets cultuels probablement liés au soleil; « piliers solaires » rend cette compréhension tout en signalant l’incertitude en note.
theological_decisions:
- issue: Désignation des objets du culte païen dans la polémique prophétique
  choice: Nommer les objets cultuels de manière concrète sans ajouter le mot « idoles » dans le texte
  alternative: Employer « idoles », « poteaux d’Ashéra » ou « autels à encens » de façon explicative
  rationale: Le texte condamne ces objets en les présentant comme une fabrication humaine. La traduction laisse cette critique ressortir de la formulation elle-même et conserve l’incertitude entourant les termes cultuels.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme des « mains » et des « doigts » est conservé, ainsi que la progression entre se tourner vers ces objets et les regarder avec considération.
