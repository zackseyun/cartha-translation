  text: לְאֻמִּ֗ים כִּ/שְׁא֞וֹן מַ֤יִם רַבִּים֙ יִשָּׁא֔וּ/ן וְ/גָ֥עַר בּ֖/וֹ וְ/נָ֣ס מִ/מֶּרְחָ֑ק וְ/רֻדַּ֗ף כְּ/מֹ֤ץ הָרִים֙ לִ/פְנֵי ר֔וּחַ וּ/כְ/גַלְגַּ֖ל לִ/פְנֵ֥י סוּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/013.yaml
  text: The peoples roar like the roaring of many waters[a], but he rebukes it, and it flees far away, chased like chaff on the mountains before the wind[d][c][b], and like whirling dust before the storm.
translation:
  language: fr
  text: Les peuples grondent comme grondent les grandes eaux[a]. Mais il réprimande cette masse, qui s’enfuit au loin, pourchassée comme la paille des montagnes devant le vent[b] et comme un tourbillon de poussière devant la tempête[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les nations grondent comme grondent les eaux puissantes. »'
    reason: Alternative lexicale pour לְאֻמִּים et מַיִם רַבִּים.
  - marker: b
    text: L’hébreu emploie ici des formes au singulier (« il le réprimande… il s’enfuit »), considérant apparemment les nombreux peuples, ou leur tumulte, comme une seule masse.
    reason: Signaler le passage du pluriel au singulier collectif dans le texte source.
  - marker: c
    text: 'Ou : « comme une chose qui tournoie devant la tourmente » ; le terme hébreu peut désigner un objet léger qui roule ou tourbillonne.'
    reason: Le sens concret de גַלְגַּל dans cette image poétique demeure incertain.
lexical_decisions:
- source_word: לְאֻמִּים
  choice: les peuples
  rationale: Le pluriel désigne plusieurs groupes humains ou nationaux. « Peuples » conserve cette dimension collective sans accentuer indûment le sens politique.
- source_word: כִּשְׁאוֹן מַיִם רַבִּים יִשָּׁאוּן
  choice: grondent comme grondent les grandes eaux
  rationale: La répétition de « grondent » restitue l’intensité sonore de שָׁאוֹן et du verbe apparenté, tandis que « grandes eaux » exprime naturellement l’abondance et la puissance de מַיִם רַבִּים.
- source_word: וְגָעַר בּוֹ
  choice: mais il réprimande cette masse
  rationale: Le verbe exprime une réprimande énergique. « Il » maintient l’auteur de la réprimande implicite, et « cette masse » rend le suffixe masculin singulier sans désigner artificiellement un peuple particulier.
- source_word: וְנָס מִמֶּרְחָק
  choice: qui s’enfuit au loin
  rationale: Le verbe singulier prolonge la représentation collective. « Au loin » rend idiomatiquement l’éloignement exprimé par מִמֶּרְחָק.
- source_word: וְרֻדַּף כְּמֹץ הָרִים
  choice: pourchassée comme la paille des montagnes
  rationale: Le passif exprime une fuite imposée. מֹץ désigne la menue paille ou balle emportée par le vent; le rapport exact du complément « des montagnes » reste compact comme en hébreu.
- source_word: לִפְנֵי רוּחַ
  choice: devant le vent
  rationale: Expression française naturelle qui conserve l’image d’une matière légère poussée devant une force.
- source_word: וּכְגַלְגַּל
  choice: comme un tourbillon de poussière
  rationale: גַלְגַּל évoque ici une chose légère qui roule ou tournoie. Ce choix communique le mouvement sans imposer l’identification botanique plus précise de « virevoltant ».
- source_word: לִפְנֵי סוּפָה
  choice: devant la tempête
  rationale: סוּפָה désigne une violente tempête, éventuellement un tourbillon; « tempête » est clair et suffisamment large.
theological_decisions:
- issue: Référence des formes singulières après le pluriel « peuples »
  choice: Rendre le référent collectif par « cette masse, qui s’enfuit »
  alternative: Employer « les réprimande, et ils s’enfuient » ou reprendre « le tumulte »
  rationale: בּוֹ et וְנָס sont au singulier et envisagent vraisemblablement les peuples, ou leur tumulte, comme une seule masse. La formulation française préserve ce changement grammatical sans produire le pronom ambigu « le ».
- issue: Identité de celui qui réprimande
  choice: Conserver le sujet implicite sous la forme « il »
  alternative: Écrire explicitement « Dieu » ou « le Seigneur »
  rationale: Le contexte permet de comprendre l’agent divin, mais ce verset ne le nomme pas. La traduction n’ajoute donc aucun nom divin.
translation_notes:
  register: Français international moderne, poétique mais accessible. La répétition « grondent comme grondent » reproduit l’effet sonore de l’hébreu. « Cette masse » permet de conserver le singulier collectif sans obscurité excessive. Tous les marqueurs de note figurent dans le texte.
