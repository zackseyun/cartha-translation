id: ISA.17.2
reference: Isaiah 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עֲזֻב֖וֹת עָרֵ֣י עֲרֹעֵ֑ר לַ/עֲדָרִ֣ים תִּֽהְיֶ֔ינָה וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/002.yaml
  text: The cities of Aroer are abandoned[a]; they will be for flocks[b], and they will lie down with no one to make them afraid.
translation:
  language: fr
  text: Les villes d’Aroër sont abandonnées[a] ; elles seront livrées aux troupeaux[b], qui s’y coucheront sans que personne les effraie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « délaissées » ou « désertes ».
    reason: lexical_alternative
  - marker: b
    text: Le terme peut désigner des troupeaux de petit ou de gros bétail ; l’image est celle de villes dépeuplées devenues des lieux où les animaux peuvent paître et se reposer.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזֻבוֹת
  choice: abandonnées
  rationale: Participe passif féminin pluriel de עזב, décrivant les villes comme délaissées ou désertées. « Abandonnées » est naturel en français moderne et conserve l’état passif.
- source_word: עָרֵי
  choice: les villes de
  rationale: Pluriel construit de עִיר. « Les villes de » est la formulation française habituelle et convient au contexte d’un oracle de jugement.
- source_word: עֲרֹעֵר
  choice: Aroër
  rationale: Nom de lieu translittéré ; le tréma aide le lecteur francophone à distinguer les voyelles.
- source_word: לַעֲדָרִים
  choice: livrées aux troupeaux
  rationale: עֵדֶר désigne un troupeau de bétail, souvent de petit bétail. La tournure « livrées aux troupeaux » exprime naturellement en français que les villes dépeuplées deviennent leur domaine, sans préciser indûment l’espèce animale.
- source_word: תִּהְיֶינָה
  choice: elles seront
  rationale: Forme féminine plurielle de היה. Le futur simple reprend directement les villes comme sujet.
- source_word: וְרָבְצוּ
  choice: qui s’y coucheront
  rationale: רבץ s’emploie couramment pour des animaux qui se couchent. Le relatif clarifie que le sujet implicite est désormais « les troupeaux », et « s’y » rattache leur repos aux villes.
- source_word: וְאֵין מַחֲרִיד
  choice: sans que personne les effraie
  rationale: Expression indiquant que les animaux resteront sans être dérangés ni menacés. Cette formulation française conserve l’idée d’absence totale de cause d’effroi.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’image pastorale et le changement implicite de sujet entre les villes et les troupeaux, tout en le rendant lisible par une proposition relative.
