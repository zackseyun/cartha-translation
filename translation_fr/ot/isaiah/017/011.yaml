id: ISA.17.11
reference: Isaiah 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/י֤וֹם נִטְעֵ/ךְ֙ תְּשַׂגְשֵׂ֔גִי וּ/בַ/בֹּ֖קֶר זַרְעֵ֣/ךְ תַּפְרִ֑יחִי נֵ֥ד קָצִ֛יר בְּ/י֥וֹם נַחֲלָ֖ה וּ/כְאֵ֥ב אָנֽוּשׁ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/011.yaml
  text: On the day you plant[a], you make it grow luxuriantly; and in the morning you make your seed sprout[b]. But the harvest flees away in a day of grief and incurable pain.
translation:
  language: fr
  text: Le jour où tu plantes, tu fais pousser avec vigueur ce que tu as planté ; dès le matin, tu fais germer ta semence. Mais la moisson disparaît[a] au jour de la détresse[b] et d’une douleur incurable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « un tas de moisson ». L’expression hébraïque est difficile ; certains comprennent נֵד comme un « tas » plutôt que comme l’expression d’une disparition.
    reason: lexical_alternative
  - marker: b
    text: « Au jour de la détresse » peut aussi se traduire par « au jour de la maladie » ou « au jour de l’affliction ».
    reason: lexical_alternative
lexical_decisions:
- source_word: נִטְעֵךְ
  choice: le jour où tu plantes
  rationale: Le nom avec suffixe signifie littéralement « au jour de ta plantation ». La tournure verbale est plus naturelle en français et conserve l’image agricole.
- source_word: תְּשַׂגְשֵׂגִי
  choice: tu fais pousser avec vigueur ce que tu as planté
  rationale: Le verbe évoque une croissance vigoureuse ou luxuriante. L’objet est explicité à partir de la plantation mentionnée juste avant, sans modifier le sens.
- source_word: זַרְעֵךְ תַּפְרִיחִי
  choice: tu fais germer ta semence
  rationale: La forme causative de פרח exprime l’action de faire germer, bourgeonner ou fleurir. « Faire germer » convient directement à la semence dans ce contexte agricole.
- source_word: נֵד קָצִיר
  choice: la moisson disparaît
  rationale: נֵד est difficile ici. Dans ce contexte de jugement, la lecture verbale exprime la disparition soudaine de la récolte espérée. La possibilité plus littérale d’un « tas de moisson » est conservée en note.
- source_word: בְּיוֹם נַחֲלָה
  choice: au jour de la détresse
  rationale: נַחֲלָה peut désigner ici la maladie, l’affliction ou une calamité grave. « Détresse » rend le malheur sans limiter indûment l’expression à une affection médicale.
- source_word: וּכְאֵב אָנֽוּשׁ
  choice: et d’une douleur incurable
  rationale: כאב désigne la douleur, tandis que אנושׁ souligne son caractère extrême, désespéré ou incurable. Cette formulation garde l’intensité du jugement prophétique.
theological_decisions:
- issue: Nature exacte de la perte de la récolte
  choice: La moisson « disparaît »
  alternative: La moisson forme « un tas »
  rationale: Le texte hébreu est lexicalement incertain plutôt que théologiquement explicite. La traduction principale suit le mouvement de perte suggéré par le contexte, tout en signalant l’autre analyse en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme agricole de la première moitié est maintenu, puis brisé par « Mais ». Les verbes à la deuxième personne du féminin singulier ne se distinguent pas morphologiquement en français ; aucune destinataire supplémentaire n’est donc explicitée.
