  source_fidelity: 'Le texte rend fidèlement la progression du verset : plantation et développement vigoureux, germination matinale de la semence, puis perte de la moisson dans un temps de détresse et de douleur extrême. « La moisson disparaît » suit l’analyse contextuelle retenue dans la piste d’audit anglaise pour נֵד קָצִיר, tandis que la note conserve explicitement l’analyse concurrente « un tas de moisson ».'
  naturalness: Le français est moderne, fluide et d’un registre approprié au texte prophétique. « Tu fais pousser avec vigueur ce que tu as planté » explicite naturellement l’objet sous-entendu par la construction hébraïque. « Ta semence » est un collectif agricole idiomatique, et « dès le matin » rend avec naturel la rapidité suggérée par la scène.
  terminology: Les termes agricoles (« plantes », « faire pousser », « semence », « moisson ») sont cohérents. « Détresse » et « douleur incurable » rendent sobrement la gravité de נַחֲלָה et de כְּאֵב אָנּוּשׁ sans imposer une lecture médicale ou doctrinale trop étroite. Les ancres de notes sont correctement placées sur « disparaît » et « détresse », soit les expressions auxquelles elles se rapportent.
