id: ISA.17.10
reference: Isaiah 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י שָׁכַ֨חַתְּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/ךְ וְ/צ֥וּר מָעֻזֵּ֖/ךְ לֹ֣א זָכָ֑רְתְּ עַל כֵּ֗ן תִּטְּעִי֙ נִטְעֵ֣י נַעֲמָנִ֔ים וּ/זְמֹ֥רַת זָ֖ר תִּזְרָעֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/010.yaml
  text: For you have forgotten the God of your salvation[a], and have not remembered the Rock of your refuge[c][b]; therefore you plant pleasant plants and sow it with a foreign vine.
translation:
  language: fr
  text: Car tu as oublié le Dieu de ton salut et tu ne t’es pas souvenue du Rocher, ton refuge. C’est pourquoi tu plantes des plants agréables[a] et tu y sèmes un sarment étranger[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des plantations de délices » ou « des plantations recherchées ». Il pourrait s’agir de plantes cultivées dans le cadre de pratiques religieuses étrangères.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une pousse étrangère » ou « un rameau venu d’ailleurs ».'
    reason: lexical_alternative
  - marker: c
    text: L’image agricole peut évoquer le recours à des cultes étrangers ou à des alliances étrangères plutôt qu’au Seigneur, mais l’hébreu ne l’affirme pas explicitement.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁכַחַתְּ
  choice: tu as oublié
  rationale: Le qal accompli à la 2e personne du féminin singulier décrit un oubli déjà réalisé dont les conséquences demeurent. Le passé composé est naturel en français.
- source_word: אֱלֹהֵי יִשְׁעֵךְ
  choice: le Dieu de ton salut
  rationale: Cette formulation conserve la chaîne construite et le substantif יֵשַׁע, sans transformer l’expression en proposition explicative.
- source_word: צוּר מָעֻזֵּךְ
  choice: le Rocher, ton refuge
  rationale: « Rocher » préserve la métaphore divine de stabilité et de protection. L’apposition « ton refuge » rend naturellement la fonction protectrice de מָעוֹז en français.
- source_word: לֹא זָכָרְתְּ
  choice: tu ne t’es pas souvenue
  rationale: Le verbe reste parallèle à « tu as oublié ». L’accord féminin rend visible l’adresse à une destinataire féminine singulière portée par l’hébreu.
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Ce connecteur français exprime clairement la conséquence introduite par la locution hébraïque.
- source_word: תִּטְּעִי
  choice: tu plantes
  rationale: L’inaccompli peut présenter ici, avec vivacité, le comportement qui découle de l’oubli de Dieu. Le présent français convient au tableau prophétique, sans exclure une nuance prospective.
- source_word: נִטְעֵי נַעֲמָנִים
  choice: des plants agréables
  rationale: La traduction conserve l’image agricole et la valeur de ce qui est plaisant ou désirable, sans préciser dans le texte une éventuelle fonction cultuelle.
- source_word: זְמֹרַת זָר
  choice: un sarment étranger
  rationale: זְמֹרָה désigne un sarment ou rameau de vigne, tandis que זָר signifie « étranger » ou « venu d’ailleurs ». « Sarment étranger » maintient les deux éléments de l’image.
- source_word: תִּזְרָעֶנּוּ
  choice: tu y sèmes
  rationale: « Sèmes » conserve le verbe זרע. Le pronom adverbial « y » rend de façon naturelle la relation elliptique avec la plantation mentionnée juste avant, tout en gardant l’image inhabituelle d’un sarment semé.
theological_decisions:
- issue: Faut-il présenter explicitement les plantations comme idolâtres ?
  choice: Conserver dans le texte principal l’image agricole sans préciser sa fonction religieuse.
  alternative: Parler de jardins idolâtres ou de plantations employées dans un culte étranger.
  rationale: Le contexte reproche à la destinataire d’avoir oublié Dieu, et les végétaux étrangers peuvent évoquer des pratiques cultuelles ou des alliances étrangères. Toutefois, l’hébreu ne formule pas explicitement cette interprétation ; une note la signale donc sans résoudre l’ambiguïté.
translation_notes:
  register: Français international actuel, digne et accessible. Le féminin singulier de l’adresse hébraïque est rendu par « souvenue ». Les métaphores du Rocher, du refuge et de la culture végétale sont conservées, ainsi que l’expression volontairement inhabituelle « semer un sarment ».
