id: ISA.17.5
reference: Isaiah 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כֶּֽ/אֱסֹף֙ קָצִ֣יר קָמָ֔ה וּ/זְרֹע֖/וֹ שִׁבֳּלִ֣ים יִקְצ֑וֹר וְ/הָיָ֛ה כִּ/מְלַקֵּ֥ט שִׁבֳּלִ֖ים בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/005.yaml
  text: And it will be as when one gathers standing grain at harvest[a], and his arm reaps the ears[b]; and it will be as when one gleans ears in the Valley of Rephaim.
translation:
  language: fr
  text: Il en sera comme lorsqu’on rassemble à la moisson le blé sur pied et que son bras moissonne les épis[a] ; il en sera comme lorsqu’on glane des épis dans la vallée de Rephaïm[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les têtes des céréales ».
    reason: lexical_alternative
  - marker: b
    text: Rephaïm est un nom de lieu ; ce nom a aussi été rapproché du mot rendu par « géants ».
    reason: alternative_reading
lexical_decisions:
- source_word: כֶּאֱסֹף
  choice: comme lorsqu’on rassemble
  rationale: L’infinitif construit précédé de כ exprime une comparaison. Le pronom indéfini « on » rend naturellement l’action générale sans ajouter un sujet précis.
- source_word: קָצִיר
  choice: à la moisson
  rationale: Dans ce contexte, le mot peut désigner la moisson ou le moissonneur. La lecture circonstancielle « à la moisson » s’accorde avec קָמָה comme objet de l’action et préserve la formulation retenue dans la couche de consultation.
- source_word: קָמָה
  choice: le blé sur pied
  rationale: Le nom désigne une céréale encore dressée dans le champ. « Blé » est ici générique en français courant, et « sur pied » conserve cette précision.
- source_word: וּזְרֹעוֹ
  choice: et que le bras
  rationale: Le texte hébreu fait explicitement du bras le sujet de l’action suivante. L’article défini français conserve cette image corporelle sans imposer un référent masculin absent de la traduction.
- source_word: שִׁבֳּלִים
  choice: les épis
  rationale: Le terme désigne les épis ou têtes des céréales. « Épis » est le terme français naturel et précis.
- source_word: יִקְצוֹר
  choice: moissonne
  rationale: Le verbe est le terme ordinaire pour moissonner. Le choix maintient le réseau lexical agricole et l’image frappante du bras qui agit.
- source_word: כִּמְלַקֵּט
  choice: comme lorsqu’on glane
  rationale: לקט désigne le ramassage de ce qui reste après la moisson. « Glaner » en conserve le sens agricole spécifique.
- source_word: בְּעֵמֶק רְפָאִים
  choice: dans la vallée de Rephaïm
  rationale: Il s’agit d’un toponyme. La translittération évite de transformer le nom propre en interprétation.
theological_decisions:
- issue: Interprétation de רְפָאִים dans le nom de lieu
  choice: Rephaïm, translittéré dans « vallée de Rephaïm »
  alternative: vallée des Géants
  rationale: Le contexte emploie un nom géographique. La translittération préserve le toponyme et n’impose pas l’étymologie ou l’association possible avec les « géants ».
- issue: Valeur de קָצִיר dans la comparaison
  choice: la moisson, comprise comme indication de circonstance
  alternative: le moissonneur, comme sujet de « rassemble »
  rationale: Les deux valeurs lexicales sont possibles. La traduction retenue suit la syntaxe comprise dans la couche anglaise auditée tout en évitant de préciser l’identité de l’agent.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « il en sera comme » et l’image inhabituelle du bras qui moissonne sont conservées afin de respecter la structure et la vivacité de l’hébreu. Les marqueurs de note sont placés directement après les termes qu’ils expliquent.
