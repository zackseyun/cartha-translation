id: ISA.17.7
reference: Isaiah 17:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֔וּא יִשְׁעֶ֥ה הָ/אָדָ֖ם עַל עֹשֵׂ֑/הוּ וְ/עֵינָ֕י/ו אֶל קְד֥וֹשׁ יִשְׂרָאֵ֖ל תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/007.yaml
  text: In that day man will look to his Maker[b][a], and his eyes will look to the Holy One of Israel.
translation:
  language: fr
  text: En ce jour-là, l’être humain[a] portera son regard vers son Créateur, et ses yeux se tourneront vers le Saint d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque est au singulier, mais elle désigne ici l’humanité en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique naturelle en français, sans préciser davantage la nature ni la date de ce jour.
- source_word: יִשְׁעֶה עַל
  choice: se tournera vers
  rationale: Exprime l’attention dirigée vers quelqu’un et s’accorde idiomatiquement avec la préposition, sans expliciter indûment la confiance ou la repentance.
- source_word: הָאָדָם
  choice: l’être humain
  rationale: Le singulier hébreu est représentatif de l’humanité en général. « L’être humain » en conserve le nombre et la portée générique dans un français moderne.
- source_word: עֹשֵׂהוּ
  choice: celui qui l’a fait
  rationale: Rend directement le participe avec son suffixe masculin singulier et maintient le rapport personnel entre la créature et son auteur.
- source_word: וְעֵינָיו
  choice: et ses yeux
  rationale: Conserve l’image corporelle et le parallélisme poétique de l’hébreu.
- source_word: אֶל קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Traduction française consacrée du titre divin caractéristique d’Ésaïe.
- source_word: תִּרְאֶינָה
  choice: regarderont
  rationale: Le verbe signifie fondamentalement « voir », mais désigne ici un regard dirigé vers Dieu; « regarderont » préserve ce sens et le parallélisme sans confondre entièrement les deux verbes hébreux.
theological_decisions:
- issue: Portée du singulier הָאָדָם
  choice: l’être humain
  alternative: l’homme; l’humanité
  rationale: Le texte emploie un singulier générique. La formulation choisie en maintient la valeur représentative sans la réduire à un individu masculin particulier.
- issue: Faut-il expliciter la confiance ou la repentance?
  choice: se tournera vers
  alternative: mettra sa confiance en; reviendra à
  rationale: Le contexte peut évoquer une réorientation vers Dieu, mais le verbe hébreu parle d’attention ou de regard. La traduction laisse subsister cette implication sans la transformer en affirmation explicite.
- issue: Identification de celui qui a fait l’être humain
  choice: celui qui l’a fait
  alternative: son Créateur
  rationale: Le contexte identifie clairement Dieu, mais l’hébreu emploie une proposition participiale plutôt qu’un titre abstrait. La traduction préserve cette forme concrète.
translation_notes:
  register: Français international moderne, sobre et poétique. La répétition conceptuelle du regard est maintenue, tandis que deux verbes français distincts reflètent les deux verbes hébreux. Aucun vocabulaire confessionnel supplémentaire n’est introduit.
