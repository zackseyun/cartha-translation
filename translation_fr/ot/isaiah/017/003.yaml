source:
  edition: WLC
  text: וְ/נִשְׁבַּ֤ת מִבְצָר֙ מֵֽ/אֶפְרַ֔יִם וּ/מַמְלָכָ֥ה מִ/דַּמֶּ֖שֶׂק וּ/שְׁאָ֣ר אֲרָ֑ם כִּ/כְב֤וֹד בְּנֵֽי יִשְׂרָאֵל֙ יִֽהְי֔וּ נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/003.yaml
  text: And the fortress will cease from Ephraim[a], and the kingdom from Damascus; and the remnant of Aram will be like the glory of the sons of Israel[b], declares Yahweh of hosts.
translation:
  language: fr
  text: La forteresse disparaîtra d’Éphraïm, et le royaume de Damas. Le reste d’Aram sera comme la gloire[a] des fils d’Israël — déclaration de Yahvé des armées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La comparaison peut signifier que le reste d’Aram connaîtra la même diminution que la gloire d’Israël ; l’hébreu ne précise pas explicitement le point de ressemblance. Le mot traduit par « gloire » peut aussi signifier « honneur » ou « splendeur ».
    reason: Préserver l’ambiguïté de la comparaison et signaler l’étendue sémantique de כָּבוֹד.
lexical_decisions:
- source_word: וְנִשְׁבַּת
  choice: disparaîtra
  rationale: Le nifal de שׁבת exprime ici la cessation ou la suppression. « Disparaîtra » est naturel en français et évite de préciser un mode de destruction que l’hébreu ne donne pas.
- source_word: מִבְצָר
  choice: la forteresse
  rationale: Le singulier désigne une place fortifiée ou un bastion; « forteresse » conserve la forme concrète et militaire.
- source_word: מֵאֶפְרַיִם
  choice: d’Éphraïm
  rationale: Le nom géographique est conservé sans l’expliciter comme désignation du royaume du Nord.
- source_word: וּמַמְלָכָה
  choice: et la royauté
  rationale: מַמְלָכָה peut désigner le royaume ou la souveraineté royale. Dans la construction elliptique « cessera de Damas », « royauté » exprime naturellement la disparition du pouvoir monarchique sans ajouter un verbe absent.
- source_word: מִדַּמֶּשֶׂק
  choice: de Damas
  rationale: Rendu direct du nom de lieu avec sa préposition.
- source_word: וּשְׁאָר אֲרָם
  choice: Le reste d’Aram
  rationale: « Reste » rend שְׁאָר et conserve le nom propre historique Aram plutôt que de l’actualiser en « Syrie ».
- source_word: כִּכְבוֹד
  choice: sera comme la gloire
  rationale: כָּבוֹד peut évoquer gloire, honneur ou splendeur. « Gloire » préserve l’ampleur sémantique et le registre prophétique sans déterminer le point précis de la comparaison.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: des fils d’Israël
  rationale: Rendu formel de l’expression masculine hébraïque, qui désigne collectivement les descendants ou le peuple d’Israël.
- source_word: יִהְיוּ
  choice: sera
  rationale: Le pluriel hébreu s’accorde avec le sens collectif du reste d’Aram; en français, « le reste » appelle naturellement le singulier.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: déclaration de Yahvé des armées
  rationale: נְאֻם est une formule d’oracle prophétique. « Déclaration de » conserve sa forme nominale; « Yahvé » représente le nom divin יהוה, et « des armées » rend concrètement צְבָאוֹת.
theological_decisions:
- issue: Sens de la comparaison entre le reste d’Aram et la gloire des fils d’Israël
  choice: La comparaison demeure non explicitée dans le texte principal.
  alternative: Comprendre que le reste d’Aram connaîtra la même diminution que la gloire d’Israël, annoncée dans le contexte suivant.
  rationale: L’hébreu n’énonce pas le point de ressemblance. Le contexte suggère une destinée commune de déclin, mais l’introduire directement dans le verset résoudrait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et prophétique. Le parallélisme initial est conservé par une ellipse verbale naturelle. Les noms historiques Éphraïm et Aram sont maintenus, et la formule finale garde une solennité oraculaire.
