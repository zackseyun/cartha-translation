source:
  edition: WLC
  text: מַשָּׂ֖א דַּמָּ֑שֶׂק הִנֵּ֤ה דַמֶּ֨שֶׂק֙ מוּסָ֣ר מֵ/עִ֔יר וְ/הָיְתָ֖ה מְעִ֥י מַפָּלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/001.yaml
  text: 'An oracle concerning Damascus: Behold[a], Damascus will be removed from being a city[b], and it will become a heap of ruins.'
translation:
  language: fr
  text: 'Proclamation concernant Damas :


    Voici : Damas cessera d’être une ville[a] ; elle deviendra un amas de ruines.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « retirée d’une ville » ; c’est-à-dire qu’elle cessera d’être une ville.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans un titre prophétique, le terme introduit une parole solennelle, souvent porteuse de jugement. « Proclamation » est actuel et digne, sans l’ambiguïté courante de « oracle » en français ni le caractère trop littéral de « fardeau ».
- source_word: דַּמָּשֶׂק
  choice: Damas
  rationale: Forme française usuelle du nom propre.
- source_word: הִנֵּה
  choice: Voici
  rationale: Conserve la force solennelle et déictique de l’annonce prophétique dans un français naturel.
- source_word: מוּסָר מֵעִיר
  choice: cessera d’être une ville
  rationale: Rend naturellement l’idée de séparation d’avec le statut de ville exprimée par la construction hébraïque, plutôt qu’un déplacement géographique.
- source_word: וְהָיְתָה
  choice: elle deviendra
  rationale: Le contexte indique un changement d’état résultant du jugement annoncé.
- source_word: מְעִי מַפָּלָה
  choice: un amas de ruines
  rationale: Expression française idiomatique qui restitue l’image collective d’un monceau produit par l’effondrement.
theological_decisions:
- issue: Valeur de מַשָּׂא dans le titre prophétique
  choice: Proclamation
  alternative: Fardeau ; oracle
  rationale: Le contexte de jugement est préservé par le contenu du verset sans imposer au titre le sens lexical discuté de « fardeau ». « Proclamation » garde la portée formelle d’une parole prophétique.
translation_notes:
  register: Français international moderne, solennel mais accessible. La disposition en titre suivi de l’annonce conserve la structure du texte hébreu. « Voici » maintient la vivacité prophétique ; le futur explicite la portée imminente de la forme participiale.
