source:
  edition: WLC
  text: לְ/עֵ֥ת עֶ֨רֶב֙ וְ/הִנֵּ֣ה בַלָּהָ֔ה בְּ/טֶ֥רֶם בֹּ֖קֶר אֵינֶ֑/נּוּ זֶ֚ה חֵ֣לֶק שׁוֹסֵ֔י/נוּ וְ/גוֹרָ֖ל לְ/בֹזְזֵֽי/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/014.yaml
  text: At evening time, look—terror! Before morning, he is no more. This is the portion of those who plunder us, and the lot of those who loot us.
translation:
  language: fr
  text: Au soir, voici la terreur ! Avant le matin, il n’est plus. Voilà la part de ceux qui nous dépouillent, le sort de ceux qui nous pillent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵת עֶרֶב
  choice: Au soir
  rationale: Rend naturellement l’indication temporelle hébraïque tout en conservant sa brièveté poétique.
- source_word: וְהִנֵּה בַלָּהָה
  choice: voici la terreur !
  rationale: « Voici » conserve la force présentative de הִנֵּה, et « terreur » exprime directement בַלָּהָה.
- source_word: אֵינֶנּוּ
  choice: il n’est plus
  rationale: Préserve le pronom masculin singulier et l’expression hébraïque de disparition ou d’anéantissement, sans préciser davantage son référent.
- source_word: חֵלֶק
  choice: la part
  rationale: Équivalent courant qui garde l’idée de portion attribuée.
- source_word: שׁוֹסֵינוּ
  choice: ceux qui nous dépouillent
  rationale: Rend le participe désignant les ravageurs ou spoliateurs avec une formulation française naturelle.
- source_word: גוֹרָל
  choice: le sort
  rationale: Conserve l’image d’un lot échu ou d’une destinée assignée.
- source_word: לְבֹזְזֵינוּ
  choice: de ceux qui nous pillent
  rationale: Rend distinctement le second terme relatif au pillage, tout en maintenant le parallélisme.
theological_decisions:
- issue: Référent du masculin singulier אֵינֶנּוּ
  choice: Conserver « il n’est plus » sans expliciter le référent
  alternative: « ils ne sont plus » ou « la terreur n’est plus »
  rationale: Le texte massorétique porte un masculin singulier dont le référent reste implicite; l’expliciter ou le pluraliser résoudrait indûment l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme final est maintenu, de même que la soudaineté dramatique entre le soir et le matin.
