    text: 'Ou : « quatre ou cinq sur ses rameaux fertiles ». Littéralement : « quatre ou cinq parmi ses rameaux fructueux ».'
    reason: Conserve l’alternative spatiale française tout en signalant la formulation plus proche de la préposition et de l’adjectif hébreux.
  revision_rationale: La révision maintient l’ambiguïté du pronom « en », l’image agricole et le registre poétique, tout en rapprochant la comparaison de la syntaxe hébraïque. Elle clarifie que les fruits sont ceux qui demeurent après la récolte sans imposer un référent théologique à l’image.
