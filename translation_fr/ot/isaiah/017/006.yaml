review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : un petit reste de fruits demeure après la récolte des olives, et la formule divine est complète. Toutefois, « comme après le gaulage » transforme la comparaison nominale « comme le gaulage / le battage d’un olivier » en une relation temporelle et explicite davantage le résultat. Une formulation directe conserve mieux l’image hébraïque.'
  naturalness: Le français est globalement naturel et d’un registre approprié. « Fruits à grappiller » est compréhensible, mais « grappillage » appliqué aux olives est moins idiomatique que « quelques fruits restés à grappiller » ou « quelques fruits à glaner ». « Gaulage » est précis, mais relativement spécialisé ; « battage d’un olivier » demeure clair, naturel et proche de l’original.
  terminology: « Yahweh » et « le Dieu d’Israël » sont appropriés. « Olives » convient ici pour גַּרְגְּרִים. « Au sommet de la cime » rend plus précisément רֹאשׁ אָמִיר que « tout en haut de la ramure », qui est plus diffus. « Parmi ses rameaux fertiles » conserve la préposition בְ et l’adjectif qualifiant les rameaux.
  issues:
  - severity: medium
    issue: « comme après le gaulage d’un olivier »
    rationale: L’hébreu כְּנֹקֶף זַיִת présente la comparaison avec le battage/gaulage d’un olivier, non explicitement l’état « après » cette opération. La reformulation temporelle est interprétative.
  - severity: low
    issue: « quelques fruits à grappiller »
    rationale: Cette expression peut suggérer des fruits destinés à être cueillis plutôt que les fruits laissés après la récolte. « quelques fruits restés à grappiller » exprime plus nettement la valeur de עֹלֵלֹת.
  - severity: low
    issue: « sur ses rameaux fertiles »
    rationale: « Parmi ses rameaux fertiles » reflète plus directement בִּסְעִפֶיהָ et évite de déplacer légèrement le rapport spatial.
  revised_text: 'Il en restera pourtant quelques fruits restés à grappiller, comme au battage d’un olivier : deux ou trois olives au sommet de la cime, quatre ou cinq parmi ses rameaux fertiles[a], déclare Yahweh, le Dieu d’Israël.'
  revised_footnotes:
