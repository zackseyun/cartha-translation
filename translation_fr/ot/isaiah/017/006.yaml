revisions:
- from: 'Il en restera pourtant quelques fruits à grappiller, comme après le gaulage d’un olivier : deux ou trois olives tout en haut de la ramure, quatre ou cinq sur ses rameaux fertiles[a], déclare Yahweh, le Dieu d’Israël.'
  to: 'Il en restera pourtant quelques fruits restés à grappiller, comme au battage d’un olivier : deux ou trois olives au sommet de la cime, quatre ou cinq parmi ses rameaux fertiles[a], déclare Yahweh, le Dieu d’Israël.'
  rationale: La révision maintient l’ambiguïté du pronom « en », l’image agricole et le registre poétique, tout en rapprochant la comparaison de la syntaxe hébraïque. Elle clarifie que les fruits sont ceux qui demeurent après la récolte sans imposer un référent théologique à l’image.
