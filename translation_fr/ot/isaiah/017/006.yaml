base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/006.yaml
  text: 'Yet gleanings will be left in it[a], as when an olive tree is beaten: two or three berries at the top of the highest bough, four or five on its fruitful branches, declares Yahweh, the God of Israel.'
translation:
  language: fr
  text: 'Il en restera pourtant quelques fruits restés à grappiller, comme au battage d’un olivier : deux ou trois olives au sommet de la cime, quatre ou cinq parmi ses rameaux fertiles[a], déclare Yahweh, le Dieu d’Israël.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quatre ou cinq sur ses rameaux fertiles ». Littéralement : « quatre ou cinq parmi ses rameaux fructueux ».'
    reason: Conserve l’alternative spatiale française tout en signalant la formulation plus proche de la préposition et de l’adjectif hébreux.
lexical_decisions:
- source_word: וְנִשְׁאַר בּוֹ עוֹלֵלֹת
  choice: Il en restera pourtant quelques fruits à grappiller
  rationale: Le nifal de שׁאר exprime ce qui subsiste, tandis que עוֹלֵלֹת désigne les fruits laissés pour le grappillage. « Il en restera » conserve volontairement la référence pronominale assez ouverte de בּוֹ et « pourtant » rend la valeur adversative du contexte.
- source_word: כְּנֹקֶף זַיִת
  choice: comme après le gaulage d’un olivier
  rationale: נֹקֶף évoque l’action de frapper l’olivier pour en faire tomber les fruits. « Gaulage » est le terme agricole français précis et la tournure avec « après » fait comprendre qu’il s’agit des fruits demeurés sur l’arbre.
- source_word: גַּרְגְּרִים
  choice: olives
  rationale: Le nom désigne de petits fruits ou grains pris individuellement. Dans le contexte explicite de l’olivier, « olives » est plus clair et naturel en français que « grains ».
- source_word: בְּרֹאשׁ אָמִיר
  choice: tout en haut de la ramure
  rationale: רֹאשׁ indique le sommet et אָמִיר la branche supérieure ou la cime. La formulation restitue l’image des quelques fruits restés hors d’atteinte.
- source_word: בִּסְעִפֶיהָ פֹּרִיָּה
  choice: sur ses rameaux fertiles
  rationale: סְעִפִים désigne les rameaux ou branches, et פֹּרִיָּה les qualifie de fertiles ou porteurs de fruits. Le possessif féminin renvoie à l’olivier.
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: La formule prophétique נְאֻם est rendue par le présent solennel et naturel « déclare ». Le nom divin est translittéré « Yahweh ».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe de la chaîne construite, qui conserve l’identification divine complète.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre d’alliance plutôt que de lui substituer un titre.
- issue: Portée de l’image du reste
  choice: Maintenir l’image agricole sans expliciter son référent théologique
  alternative: Identifier directement les fruits survivants au reste d’Israël
  rationale: Le verset présente une comparaison imagée et le pronom בּוֹ demeure contextuellement souple. La traduction ne résout donc pas dans le corps du texte ce que l’hébreu laisse implicite.
translation_notes:
  register: Français international actuel, digne et imagé. « Gaulage » est un terme agricole précis encore transparent dans le contexte ; « ramure » et « rameaux » maintiennent le registre poétique sans archaïsme excessif.
