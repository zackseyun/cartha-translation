source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא יִדַּ֖ל כְּב֣וֹד יַעֲקֹ֑ב וּ/מִשְׁמַ֥ן בְּשָׂר֖/וֹ יֵרָזֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/004.yaml
  text: And in that day the glory of Jacob will become thin[b][a], and the fatness of his flesh will waste away.
translation:
  language: fr
  text: En ce jour-là, la gloire de Jacob s’amenuisera[a], et la graisse de son corps fondra[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « diminuera ». Le verbe hébreu peut évoquer ce qui devient moindre, faible ou mince.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « la graisse de sa chair deviendra maigre ». L’image de l’amaigrissement représente la perte de force et de prospérité.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette tournure française naturelle conserve la formule temporelle prophétique sans rendre séparément וְהָיָה, dont la valeur introductive est portée par la phrase au futur.
- source_word: יִדַּל
  choice: s’amenuisera
  rationale: Le verbe דלל évoque ce qui devient peu abondant, faible ou mince. « S’amenuisera » préserve cette amplitude de sens et convient naturellement à « la gloire ».
- source_word: כְּבוֹד
  choice: la gloire
  rationale: '« Gloire » conserve le champ sémantique large du terme hébreu : éclat, prestige, puissance et prospérité.'
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom employé par l’hébreu est maintenu, sans le remplacer par l’interprétation « Israël ».
- source_word: וּמִשְׁמַן בְּשָׂרוֹ
  choice: et la graisse de son corps
  rationale: Cette formulation garde l’image physique de l’abondance corporelle tout en étant plus idiomatique en français moderne que « la graisse de sa chair ».
- source_word: יֵרָזֶה
  choice: fondra
  rationale: Le verbe signifie devenir maigre ou perdre sa graisse. Appliqué à « la graisse de son corps », « fondra » exprime naturellement cet amaigrissement et maintient l’image concrète.
theological_decisions:
- issue: Référent de « Jacob » dans cet oracle de jugement
  choice: Conserver « Jacob » comme nom collectif et national sans explicitation dans le texte principal.
  alternative: Israël ; le peuple de Jacob
  rationale: Le contexte vise le peuple, mais le texte hébreu emploie « Jacob ». Garder ce nom préserve sa résonance prophétique et historique sans imposer une paraphrase interprétative.
- issue: Rapport entre l’image corporelle et la perte de prospérité
  choice: Maintenir l’image physique de l’amaigrissement.
  alternative: Expliciter abstraitement la perte de force ou de prospérité.
  rationale: Le parallélisme suggère une humiliation et un appauvrissement collectifs, mais il les exprime par l’image du corps qui maigrit. La traduction conserve cette tension métaphorique au lieu de la résoudre.
translation_notes:
  register: Français international moderne, sobre et prophétique. La formulation reste accessible tout en conservant le parallélisme et l’image corporelle de l’hébreu.
