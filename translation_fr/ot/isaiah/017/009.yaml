revisions:
- from: En ce jour-là, ses villes fortifiées seront comme les lieux abandonnés de la forêt et de la cime des arbres[a], qu’ils avaient délaissés devant les fils d’Israël[b] ; et ce sera la désolation.
  to: En ce jour-là, ses villes fortifiées seront comme les lieux abandonnés dans la forêt et sur les hautes branches[a], qu’ils avaient délaissés devant les fils d’Israël[b] ; et ce sera la désolation.
  rationale: La révision améliore la syntaxe française de la comparaison et maintient le singulier conceptuel de l’image arboricole hébraïque par « les hautes branches » comme expression générique. Elle conserve l’ambiguïté du sujet implicite, la valeur spatiale principale de « devant », ainsi que les deux notes nécessaires.
