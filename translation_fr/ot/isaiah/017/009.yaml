  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֨וֹם הַ/ה֜וּא יִהְי֣וּ עָרֵ֣י מָעֻזּ֗/וֹ כַּ/עֲזוּבַ֤ת הַ/חֹ֨רֶשׁ֙ וְ/הָ֣/אָמִ֔יר אֲשֶׁ֣ר עָזְב֔וּ מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָיְתָ֖ה שְׁמָמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/017/009.yaml
  text: In that day his fortified cities will be like the deserted places of the forest and the treetop[a], which they abandoned before the sons of Israel[b]; and it will become a desolation.
translation:
  language: fr
  text: En ce jour-là, ses villes fortifiées seront comme les lieux abandonnés dans la forêt et sur les hautes branches[a], qu’ils avaient délaissés devant les fils d’Israël[b] ; et ce sera la désolation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la branche la plus haute ». Le terme hébreu désigne la partie supérieure d’un arbre.
    reason: lexical_alternative
  - marker: b
    text: Ou « à cause des fils d’Israël ». L’expression hébraïque peut évoquer un retrait devant leur présence.
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי מָעֻזּוֹ
  choice: ses villes fortifiées
  rationale: Le syntagme signifie littéralement « les villes de sa forteresse / de son lieu fort ». « Ses villes fortifiées » est naturel en français et conserve le suffixe masculin singulier.
- source_word: כַּעֲזוּבַת
  choice: comme les lieux abandonnés
  rationale: Le terme dérivé de עזב exprime l’abandon. Le pluriel français rend clairement l’image de lieux laissés à l’abandon et s’accorde avec la comparaison portant sur les villes.
- source_word: הַחֹרֶשׁ
  choice: la forêt
  rationale: חֹרֶשׁ désigne un bois, une forêt ou une végétation dense. « La forêt » est le terme moderne le plus direct.
- source_word: וְהָאָמִיר
  choice: et de la cime des arbres
  rationale: אָמִיר désigne la partie la plus haute d’un arbre, notamment sa cime ou sa branche supérieure. La formulation française explicite naturellement l’image arboricole sans la surinterpréter.
- source_word: אֲשֶׁר עָזְבוּ
  choice: qu’ils avaient délaissés
  rationale: Le verbe hébreu est actif et son sujet pluriel reste implicite. « Ils » maintient cette indétermination, tandis que le plus-que-parfait situe l’abandon avant l’état annoncé.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: devant les fils d’Israël
  rationale: « Devant » conserve au plus près l’expression hébraïque, qui peut évoquer un retrait face à la présence d’Israël. La nuance causale possible est signalée en note.
- source_word: וְהָיְתָה שְׁמָמָה
  choice: et ce sera la désolation
  rationale: Cette tournure rend directement l’état de dévastation annoncé par le nom שְׁמָמָה, dans un français prophétique naturel et solennel.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique courante, rendue de façon naturelle en français moderne.
theological_decisions:
- issue: Expression genrée בְּנֵי יִשְׂרָאֵל
  choice: les fils d’Israël
  alternative: le peuple d’Israël / les Israélites
  rationale: « Les fils d’Israël » reproduit la forme masculine du texte hébreu et préserve ses résonances intertextuelles, sans exclure que l’expression fonctionne ici comme un ethnonyme collectif.
- issue: Valeur de מִפְּנֵי
  choice: devant les fils d’Israël
  alternative: à cause des fils d’Israël
  rationale: Le texte peut décrire un abandon devant la présence ou l’avancée d’Israël, tout en permettant une lecture causale. Le texte principal garde l’image spatiale et la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le ton prophétique et l’ambiguïté du sujet pluriel de « délaissés ». Les deux notes rendent visibles les principales incertitudes lexicales sans alourdir le texte.
