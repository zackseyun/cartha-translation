  text: וַֽ/יְעַזְּקֵ֣/הוּ וַֽ/יְסַקְּלֵ֗/הוּ וַ/יִּטָּעֵ֨/הוּ֙ שֹׂרֵ֔ק וַ/יִּ֤בֶן מִגְדָּל֙ בְּ/תוֹכ֔/וֹ וְ/גַם יֶ֖קֶב חָצֵ֣ב בּ֑/וֹ וַ/יְקַ֛ו לַ/עֲשׂ֥וֹת עֲנָבִ֖ים וַ/יַּ֥עַשׂ בְּאֻשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/002.yaml
  text: He dug it up[a], cleared it of stones, and planted it with choice vines; he built a tower in its midst, and also hewed out a winepress in it. Then he expected it to produce grapes, but it produced wild grapes.
translation:
  language: fr
  text: Il en travailla le sol, en retira les pierres et y planta des ceps de choix. Il bâtit une tour en son milieu et y tailla aussi un pressoir. Puis il s’attendit à ce qu’elle produise des raisins, mais elle produisit des raisins infects.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des raisins sauvages » ou « de mauvais raisins ». Le terme hébreu désigne des raisins de mauvaise qualité ou nauséabonds, par opposition aux raisins attendus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַזְּקֵהוּ
  choice: Il en travailla le sol
  rationale: Le verbe désigne ici le travail préparatoire du sol d’une vigne, probablement en le bêchant ou en le piochant. Cette formulation naturelle garde le sens sans imposer un outil précis.
- source_word: וַיְסַקְּלֵהוּ
  choice: en retira les pierres
  rationale: Au piel et dans ce contexte viticole, le verbe signifie débarrasser le terrain de ses pierres.
- source_word: שֹׂרֵק
  choice: des ceps de choix
  rationale: Le terme désigne une vigne ou un plant de qualité supérieure. Le pluriel français exprime naturellement la valeur collective du singulier hébreu.
- source_word: מִגְדָּל
  choice: une tour
  rationale: Le mot signifie simplement « tour ». Sa fonction probable de tour de guet n’est pas ajoutée au texte.
- source_word: בְּתוֹכוֹ
  choice: en son milieu
  rationale: Cette expression conserve l’image spatiale et le registre poétique de l’hébreu.
- source_word: יֶקֶב
  choice: un pressoir
  rationale: Dans ce cadre, le terme renvoie à l’installation servant à presser les raisins; « pressoir » est clair et usuel.
- source_word: חָצֵב
  choice: creusa
  rationale: Le verbe évoque une excavation taillée, vraisemblablement dans la roche. « Creusa » est naturel en français et convient à la fabrication d’un pressoir.
- source_word: וַיְקַו
  choice: il s’attendit
  rationale: Le verbe peut exprimer l’attente ou l’espoir. Ici, il s’agit d’une attente légitime après tous les soins apportés à la vigne.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: à ce qu’elle produise de bons raisins
  rationale: « Produire » rend idiomatiquement le verbe « faire ». L’adjectif « bons » explicite le contraste implicite entre עֲנָבִים, les raisins attendus, et les fruits mauvais effectivement obtenus.
- source_word: וַיַּעַשׂ בְּאֻשִׁים
  choice: elle produisit des raisins infects
  rationale: בְּאֻשִׁים désigne des fruits mauvais, nauséabonds ou impropres. « Raisins infects » préserve la forte dépréciation du terme sans les identifier nécessairement à une variété sauvage.
theological_decisions:
- issue: La vigne est ensuite identifiée à Israël dans le contexte.
  choice: Conserver ici uniquement l’image agricole concrète.
  alternative: Anticiper explicitement l’interprétation allégorique dans la formulation du verset.
  rationale: Le verset appartient d’abord au chant de la vigne; l’explication ultérieure doit révéler le référent sans que la traduction l’introduise prématurément.
translation_notes:
  register: Français international moderne, naturel et digne, avec une légère élévation poétique. Les termes concrets de la viticulture sont conservés, et l’ambiguïté exacte de בְּאֻשִׁים est signalée en note.
