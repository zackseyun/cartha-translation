  text: ה֗וֹי מַגִּיעֵ֥י בַ֨יִת֙ בְּ/בַ֔יִת שָׂדֶ֥ה בְ/שָׂדֶ֖ה יַקְרִ֑יבוּ עַ֚ד אֶ֣פֶס מָק֔וֹם וְ/הֽוּשַׁבְתֶּ֥ם לְ/בַדְּ/כֶ֖ם בְּ/קֶ֥רֶב הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/008.yaml
  text: Woe to those who join house to house[a], who bring field near to field until there is no place left[b], and you are made to dwell alone in the midst of the land.
translation:
  language: fr
  text: Malheur à ceux qui ajoutent maison à maison et joignent champ à champ[a], jusqu’à ce qu’il ne reste plus de place et que vous soyez les seuls à habiter au milieu du pays[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe hébreu signifie littéralement « faire approcher ». Il évoque ici le regroupement de propriétés voisines par acquisitions successives.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu passe ici à la deuxième personne et interpelle directement les coupables. La forme verbale est passive/causative : littéralement, « que vous soyez établis seuls au milieu du pays ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Formule prophétique de dénonciation et d’avertissement, naturelle et solennelle en français.
- source_word: מַגִּיעֵי בַיִת בְּבַיִת
  choice: ceux qui ajoutent maison à maison
  rationale: Le participe causatif évoque le fait de mettre les maisons en contact par acquisitions successives; « ajouter » exprime clairement cette accumulation tout en gardant la construction concise de l’hébreu.
- source_word: שָׂדֶה בְשָׂדֶה יַקְרִיבוּ
  choice: joignent champ à champ
  rationale: Le verbe signifie littéralement « faire approcher »; dans ce contexte foncier, « joindre » rend naturellement le regroupement de parcelles voisines et maintient le parallélisme.
- source_word: עַד אֶפֶס מָקוֹם
  choice: jusqu’à ce qu’il ne reste plus de place
  rationale: 'Rend clairement le résultat de l’accaparement continu: aucun espace ne demeure disponible.'
- source_word: וְהוּשַׁבְתֶּם
  choice: et que vous habitiez
  rationale: Conserve le passage soudain à la deuxième personne. La forme consonantique peut être comprise comme causative passive, mais une formulation française strictement passive serait lourde; l’ambiguïté est signalée en note.
- source_word: לְבַדְּכֶם
  choice: seuls
  rationale: Exprime l’exclusivité recherchée par les personnes interpellées.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: au milieu du pays
  rationale: Préserve l’image spatiale de l’hébreu; « pays » convient ici au territoire habité et convoité.
theological_decisions:
- issue: Portée du changement de personne et valeur de וְהוּשַׁבְתֶּם
  choice: Conserver l’adresse directe par « vous habitiez » et expliquer en note la lecture passive possible.
  alternative: « et que vous soyez établis seuls » ou « et que vous soyez seuls à habiter »
  rationale: Le texte confronte directement les accapareurs. La vocalisation massorétique présente une nuance causative passive difficile à reproduire sans alourdir le français; la note maintient cette donnée sans trancher excessivement.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme parallèle de l’hébreu est conservé, ainsi que le brusque passage de la troisième à la deuxième personne.
