  terminology: « Malheur à » convient très bien à הוֹי. « Pays » est recevable pour הָאָרֶץ dans ce contexte territorial. « Joignent champ à champ » est une formulation concise et naturelle pour la concentration de propriétés; la note précise la valeur littérale du verbe sans surinterpréter le mécanisme économique.
