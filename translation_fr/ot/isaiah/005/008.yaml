  verdict: revise
  source_fidelity: 'Le parallélisme de l’accumulation foncière est bien rendu : « ajoutent maison à maison » correspond à מַגִּיעֵי בַיִת בְּבַיִת, et « joignent champ à champ » rend de manière idiomatique le rapprochement de parcelles exprimé par שָׂדֶה בְשָׂדֶה יַקְרִיבוּ. « Jusqu’à ce qu’il ne reste plus de place » reflète correctement עַד אֶפֶס מָקוֹם. En revanche, וְהוּשַׁבְתֶּם est vocalisé comme un parfait hofal, à nuance passive/causative (« vous êtes/soyez établis, installés »), et non simplement comme « vous habitiez ». La révision conserve à la fois cette nuance et le brusque passage à la deuxième personne.'
