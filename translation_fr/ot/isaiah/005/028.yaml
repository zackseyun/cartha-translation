  text: whose arrows are sharpened[a], and all his bows are bent; the hooves of his horses are considered like flint[c][b], and his wheels like the whirlwind.
translation:
  language: fr
  text: 'Ses flèches sont aiguisées,

    et tous ses arcs sont bandés[a] ;

    les sabots de ses chevaux sont réputés être du silex[b],

    et ses roues sont comme un tourbillon[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tendus » ; l’hébreu décrit des arcs préparés pour servir.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme une pierre dure » ; la comparaison souligne l’extrême dureté des sabots.
    reason: lexical_alternative
  - marker: c
    text: Ou « comme la tempête » ; l’image évoque la rapidité et la force destructrice.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנוּנִים
  choice: sont aiguisées
  rationale: Le terme décrit des flèches rendues tranchantes et prêtes au combat ; « aiguisées » est naturel et précis en français.
- source_word: דְּרֻכוֹת
  choice: sont bandés
  rationale: Dans le contexte de l’arc, דרך évoque l’action de le courber et de le tenir prêt à servir. « Bandés » exprime idiomatiquement cet état de préparation.
- source_word: כַּצַּר נֶחְשָׁבוּ
  choice: sont aussi durs que le silex
  rationale: La formulation rend naturellement la comparaison évaluative portée par נֶחְשָׁבוּ et la dureté de צַר, probablement une pierre très dure ou du silex.
- source_word: וְגַלְגִּלָּיו
  choice: et les roues de ses chars
  rationale: Le nom signifie littéralement « ses roues » ; « de ses chars » explicite le référent évident dans cette description d’une armée en marche.
- source_word: כַּסּוּפָה
  choice: comme un tourbillon
  rationale: סוּפָה désigne une violente tempête ou un tourbillon ; ce choix conserve l’image de vitesse et de force dévastatrice.
