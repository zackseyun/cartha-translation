id: ISA.5.3
reference: Isaiah 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּ֛ה יוֹשֵׁ֥ב יְרוּשָׁלִַ֖ם וְ/אִ֣ישׁ יְהוּדָ֑ה שִׁפְטוּ נָ֕א בֵּינִ֖/י וּ/בֵ֥ין כַּרְמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/003.yaml
  text: And now[a], inhabitant of Jerusalem and man of Judah, judge, please, between me and my vineyard.
translation:
  language: fr
  text: Et maintenant, habitant de Jérusalem et homme de Juda[a], jugez, je vous prie, entre moi et ma vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie ici deux expressions au singulier, « habitant de Jérusalem » et « homme de Juda », pour s’adresser collectivement à la population.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: « Et » maintient le lien avec le discours précédent, tandis que « maintenant » marque le passage à l’interpellation directe.
- source_word: יוֹשֵׁב יְרוּשָׁלַם
  choice: habitant de Jérusalem
  rationale: Le participe masculin singulier désigne collectivement la population de Jérusalem. Le singulier est conservé afin de respecter la forme rhétorique hébraïque.
- source_word: וְאִישׁ יְהוּדָה
  choice: et homme de Juda
  rationale: Le singulier masculin אִישׁ est employé de façon représentative, en parallèle avec « habitant de Jérusalem ». « Homme de Juda » préserve cette texture sans transformer implicitement l’adresse en pluriel.
- source_word: שִׁפְטוּ
  choice: jugez
  rationale: L’impératif pluriel demande aux destinataires de prononcer une appréciation entre les deux parties; « jugez » rend directement le verbe שׁפט.
- source_word: נָא
  choice: je vous prie
  rationale: La particule nuance l’impératif comme une invitation pressante ou courtoise. « Je vous prie » garde cette force rhétorique dans un français actuel et digne.
- source_word: בֵּינִי וּבֵין כַּרְמִי
  choice: entre moi et ma vigne
  rationale: La répétition de la préposition présente les deux parties du différend. « Vigne » est le terme français naturel pour le terrain planté de ceps dans cette métaphore.
theological_decisions:
- issue: Adresse collective sous forme de singuliers représentatifs
  choice: Conserver « habitant de Jérusalem et homme de Juda » au singulier
  alternative: « habitants de Jérusalem et hommes de Juda » ou « peuple de Jérusalem et de Juda »
  rationale: L’hébreu associe deux expressions masculines singulières à un impératif pluriel. Garder ce contraste préserve l’adresse corporative et sa forme rhétorique sans la neutraliser ni la régulariser.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le contraste entre les vocatifs singuliers et l’impératif pluriel est volontairement conservé. « Je vous prie » traduit l’appel rhétorique de נָא sans atténuer la demande de jugement.
