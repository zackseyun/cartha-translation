revisions:
- from: Car la vigne de Yahweh des armées[a], c’est la maison d’Israël, et l’homme de Juda[b] est le plant qui faisait ses délices. Il attendait le droit, mais voici le sang versé ; la justice, mais voici un cri de détresse ![c]
  to: Car le vignoble de Yahweh des armées[a], c’est la maison d’Israël, et les hommes de Juda sont la plantation qui fait ses délices[b]. Il attendait le droit, et voici l’effusion de sang ; la justice, et voici un cri de détresse ![c]
  rationale: La révision rend plus explicitement le sens collectif de Juda, améliore l’idiomaticité de la métaphore (« la plantation qui fait ses délices ») sans ajouter de nuance temporelle, et emploie « vignoble » pour le sens agricole de כרם. La structure antithétique, le nom divin, le vocabulaire éthique et l’explication du double jeu sonore sont préservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T04:20:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : la vigne désigne Israël, Juda est la plantation appréciée de Yahweh, et les deux attentes déçues sont bien exprimées. Toutefois, « le plant qui faisait ses délices » introduit un imparfait absent de l’hébreu et formule de façon peu naturelle la relation exprimée par נְטַע שַׁעֲשׁוּעָיו. Le singulier français « l’homme de Juda » se lit plus spontanément comme un individu, alors que le singulier hébreu fonctionne vraisemblablement de manière collective dans ce parallélisme.'
  naturalness: « Vignoble » désigne plus clairement en français le terrain planté de vignes que « vigne », qui peut aussi désigner un cep. « Les hommes de Juda sont la plantation qui fait ses délices » est naturel, conserve la portée collective du texte et rend la métaphore agricole sans imposer une interprétation confessionnelle.
  terminology: « Yahweh des armées », « maison d’Israël », « droit », « justice », « effusion de sang » et « cri de détresse » conviennent au registre biblique moderne. « Effusion de sang » rend idiomatiquement le probable sens de מִשְׂפָּח, tout en permettant à la note de signaler la rareté du terme et le jeu sonore.
  issues:
  - severity: medium
    issue: « le plant qui faisait ses délices »
    rationale: L’imparfait « faisait » n’est pas porté par le syntagme nominal hébreu (« plantation/plant de ses délices ») et peut suggérer une situation révolue. La formulation française est en outre raide.
  - severity: medium
    issue: « l’homme de Juda » dans le texte principal
    rationale: Bien que le mot hébreu soit morphologiquement singulier, il a ici une valeur collective probable. En français contemporain, le singulier non contextualisé évoque surtout une personne individuelle et obscurcit le parallèle avec « la maison d’Israël ».
  - severity: low
    issue: « la vigne »
    rationale: Le terme peut être compris comme un cep individuel. « Vignoble » rend plus nettement le sens de כרם, le terrain cultivé qui prolonge l’image des versets précédents.
  revised_text: Car le vignoble de Yahweh des armées[a], c’est la maison d’Israël, et les hommes de Juda sont la plantation qui fait ses délices[b]. Il attendait le droit, et voici l’effusion de sang ; la justice, et voici un cri de détresse ![c]
  revised_footnotes:
