source:
  edition: WLC
  text: כִּ֣י כֶ֜רֶם יְהוָ֤ה צְבָאוֹת֙ בֵּ֣ית יִשְׂרָאֵ֔ל וְ/אִ֣ישׁ יְהוּדָ֔ה נְטַ֖ע שַׁעֲשׁוּעָ֑י/ו וַ/יְקַ֤ו לְ/מִשְׁפָּט֙ וְ/הִנֵּ֣ה מִשְׂפָּ֔ח לִ/צְדָקָ֖ה וְ/הִנֵּ֥ה צְעָקָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/007.yaml
  text: For the vineyard of Yahweh of Armies is the house of Israel[a], and the men of Judah are the planting of his delight. He looked for justice, but behold, bloodshed; for righteousness, but behold[c][b], an outcry.
translation:
  language: fr
  text: Car le vignoble de Yahweh des armées[a], c’est la maison d’Israël, et les hommes de Juda sont la plantation qui fait ses délices[b]. Il attendait le droit, et voici l’effusion de sang ; la justice, et voici un cri de détresse ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Yahweh des armées » est traditionnellement rendu par « le SEIGNEUR des armées » ou « l’Éternel des armées ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « l’homme de Juda ». Le singulier hébreu peut avoir ici un sens collectif : « les hommes de Juda » ou « les gens de Juda ».'
    reason: alternative_reading
  - marker: c
    text: 'L’hébreu rapproche des mots aux sonorités voisines : mishpat (« droit ») et mispach (« effusion de sang », terme rare au sens incertain), puis tsedaqah (« justice ») et tse‘aqah (« cri de détresse »). Ces échos sonores accentuent le contraste entre ce que Yahweh attendait et ce qu’il a trouvé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’image de la vigne développée dans les versets précédents.
- source_word: כֶרֶם
  choice: la vigne
  rationale: En français courant, « vigne » peut désigner le terrain planté de ceps et maintient naturellement l’image agricole ; « vignoble » serait également possible.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Rend directement le nom divin et traduit צְבָאוֹת par un terme français actuel qui conserve la force du titre.
- source_word: בֵּית יִשְׂרָאֵל
  choice: la maison d’Israël
  rationale: Conserve l’expression collective et historique de l’hébreu.
- source_word: וְאִישׁ יְהוּדָה
  choice: l’homme de Juda
  rationale: Respecte le singulier hébreu tout en laissant ouverte sa portée collective, explicitée en note.
- source_word: נְטַע שַׁעֲשׁוּעָיו
  choice: le plant qui faisait ses délices
  rationale: Préserve la métaphore de ce que Yahweh a planté et exprime en français naturel l’affection indiquée par שַׁעֲשׁוּעָיו.
- source_word: וַיְקַו
  choice: Il attendait
  rationale: Exprime l’attente de Yahweh envers sa vigne sans suggérer une simple observation visuelle.
- source_word: לְמִשְׁפָּט
  choice: le droit
  rationale: Désigne ici l’ordre juste et la pratique sociale de la justice ; « le droit » convient à la structure parallèle avec « la justice ».
- source_word: מִשְׂפָּח
  choice: le sang versé
  rationale: Rend l’interprétation probable de ce terme rare comme violence sanglante, tout en signalant son incertitude en note.
- source_word: לִצְדָקָה
  choice: la justice
  rationale: Exprime la conduite droite attendue dans les relations sociales et communautaires.
- source_word: צְעָקָה
  choice: un cri de détresse
  rationale: Précise qu’il s’agit du cri provoqué par l’oppression ou le tort subi, plutôt que d’un cri indéterminé.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu porte le nom propre divin ; sa transcription permet de le distinguer du titre אֲדֹנָי.
- issue: Portée de אִישׁ יְהוּדָה
  choice: l’homme de Juda, compris collectivement
  alternative: les gens de Juda
  rationale: Le singulier hébreu est conservé dans le texte, sans exclure sa fonction collective dans ce parallélisme avec la maison d’Israël.
- issue: Rapport entre מִשְׁפָּט / מִשְׂפָּח et צְדָקָה / צְעָקָה
  choice: Traduire le sens et expliquer les jeux sonores en note
  alternative: Créer en français des rapprochements sonores moins exacts sémantiquement
  rationale: Les jeux de mots accusateurs sont importants, mais une imitation française risquerait de modifier les maux dénoncés par le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle et les deux « voici » conservent la vigueur poétique de l’accusation. « L’homme de Juda » maintient la forme singulière du texte source, avec clarification en note, tandis que le jeu sonore hébreu est expliqué plutôt que recréé artificiellement.
