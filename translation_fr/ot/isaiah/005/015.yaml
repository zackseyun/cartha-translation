  yaml_path: translation/ot/isaiah/005/015.yaml
  text: And man is brought low[a], and a man is humbled[b], and the eyes of the lofty will be brought low.
translation:
  language: fr
  text: L’être humain est abaissé[a], l’homme est rabaissé, et les yeux des orgueilleux[b] seront abaissés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’incline » ; l’hébreu emploie ici deux verbes distincts, mais sémantiquement proches, pour exprimer l’abaissement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les yeux des hauts » ; il s’agit des regards de personnes orgueilleuses ou hautaines.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁח
  choice: est abaissé
  rationale: 'Le verbe שׁחח exprime le fait de se courber ou d’être rabaissé. Dans ce contexte de jugement, « est abaissé » rend bien l’abaissement, tandis qu’une note conserve la possibilité d’un sens plus directement réfléchi : « s’incline ».'
- source_word: אָדָם
  choice: l’être humain
  rationale: Ce nom désigne ici l’humanité représentée au singulier. « L’être humain » exprime naturellement cette portée générale en français sans le confondre entièrement avec אִישׁ dans le membre parallèle.
- source_word: וַיִּשְׁפַּל
  choice: est humilié
  rationale: Le verbe שׁפל signifie devenir bas ou être abaissé. « Est humilié » maintient le parallélisme tout en distinguant légèrement ce verbe du précédent.
- source_word: אִישׁ
  choice: l’homme
  rationale: Le singulier masculin individualise le second membre poétique. « L’homme » préserve cette forme et le parallélisme avec « l’être humain ».
- source_word: עֵינֵי גְבֹהִים
  choice: les yeux des orgueilleux
  rationale: L’expression signifie littéralement « les yeux des hauts ». Cette formulation conserve l’image concrète des yeux tout en rendant clairement le sens moral de גְבֹהִים.
- source_word: תִּשְׁפַּלְנָה
  choice: seront abaissés
  rationale: L’imparfait féminin pluriel s’accorde avec « yeux » et annonce leur abaissement. Le futur français marque la progression vers le jugement annoncé.
theological_decisions:
- issue: Portée des termes humains אָדָם et אִישׁ
  choice: l’être humain… l’homme
  alternative: l’homme… chacun / l’humanité… l’homme
  rationale: Les deux noms masculins singuliers sont parallèles sans être strictement identiques. La traduction conserve à la fois la portée humaine générale de אָדָם et l’expression individuelle masculine de אִישׁ.
- issue: Temps et aspect dans la poésie prophétique
  choice: présent pour les deux premiers membres, futur pour le dernier
  alternative: passé partout / futur partout
  rationale: Les deux formes narratives initiales peuvent présenter le jugement avec une vivacité ou une certitude prophétique, tandis que l’imparfait final annonce son accomplissement. Ce contraste garde la progression du texte sans imposer une chronologie plus rigide que l’hébreu.
- issue: Image des yeux élevés
  choice: les yeux des orgueilleux
  alternative: les regards hautains / les yeux des gens élevés
  rationale: Le texte associe concrètement les yeux à ceux qui sont « hauts ». La formulation retenue garde l’image corporelle et indique l’orgueil sans introduire une catégorie sociale précise.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme poétique est conservé, avec une variation lexicale mesurée entre « abaissé » et « humilié ». L’image hébraïque des yeux est maintenue.
