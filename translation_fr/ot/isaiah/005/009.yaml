source:
  edition: WLC
  text: בְּ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם לֹ֞א בָּתִּ֤ים רַבִּים֙ לְ/שַׁמָּ֣ה יִֽהְי֔וּ גְּדֹלִ֥ים וְ/טוֹבִ֖ים מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/009.yaml
  text: 'In my ears Yahweh of Armies has sworn: Surely many houses will become a desolation[a], great and good houses[b], without inhabitant.'
translation:
  language: fr
  text: 'J’ai entendu Yahweh des armées[a] jurer : « Assurément, de nombreuses maisons, grandes et belles, seront dévastées, sans habitant[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le SEIGNEUR des armées ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans mes oreilles » ; l’expression indique qu’Ésaïe a entendu cette parole directement.
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּאָזְנַי
  choice: À mes oreilles
  rationale: Conserve l’image hébraïque et l’immédiateté solennelle d’une parole entendue directement par le prophète; la note explicite l’idiome.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: צְבָאוֹת
  choice: des armées
  rationale: Rend le titre divin en français actuel et transparent, avec l’idée de forces placées sous le commandement de Dieu.
- source_word: אִם לֹא
  choice: Oui
  rationale: Dans cette formule de serment, l’expression introduit une affirmation solennelle et certaine; « Oui » en restitue naturellement la force, tandis que « a juré » rend explicite le cadre elliptique du serment.
- source_word: בָּתִּים רַבִּים
  choice: de nombreuses maisons
  rationale: Le contexte vise concrètement les bâtiments voués à l’abandon, et non d’abord les familles.
- source_word: לְשַׁמָּה יִהְיוּ
  choice: seront dévastées
  rationale: Exprime en français naturel l’état résultant de dévastation porté par le nom שַׁמָּה avec le verbe « être/devenir ».
- source_word: גְּדֹלִים וְטוֹבִים
  choice: même grandes et belles
  rationale: « Grandes » indique la taille et « belles » la qualité ou l’agrément; « même » marque naturellement la valeur concessive de cette précision dans l’annonce du jugement.
- source_word: מֵאֵין יוֹשֵׁב
  choice: resteront sans habitant
  rationale: Restitue de façon concise l’image saisissante de maisons entièrement privées d’occupants; « resteront » permet une coordination française fluide.
theological_decisions:
- issue: Traduction du titre divin יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: le SEIGNEUR des armées / le SEIGNEUR de l’univers
  rationale: Le texte porte le nom propre divin יְהוָה. Sa transcription préserve ce nom, tandis que « des armées » conserve le titre צְבָאוֹת sans le limiter explicitement aux seules armées célestes.
- issue: Force de la formule אִם לֹא
  choice: 'a juré : « Oui… »'
  alternative: 'a déclaré : « Certainement… »'
  rationale: אִם לֹא fonctionne ici comme une formule de serment elliptique. La traduction en communique la solennité sans inventer le contenu de la malédiction sous-entendue.
translation_notes:
  register: Français international moderne, solennel mais accessible. La tournure imagée « À mes oreilles » est maintenue, avec explication en note. Le parallélisme bref et la gravité de l’oracle sont préservés.
