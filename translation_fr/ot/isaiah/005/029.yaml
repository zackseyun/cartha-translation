  variant: modern international French
source:
  edition: WLC
  text: שְׁאָגָ֥ה ל֖/וֹ כַּ/לָּבִ֑יא ו/שאג כַּ/כְּפִירִ֤ים וְ/יִנְהֹם֙ וְ/יֹאחֵ֣ז טֶ֔רֶף וְ/יַפְלִ֖יט וְ/אֵ֥ין מַצִּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/029.yaml
  text: Its roaring is like a lion[a], and it roars like young lions; it growls and seizes prey, and carries it off[b], with none to rescue.
translation:
  language: fr
  text: Son rugissement est comme celui d’un lion[a] ; il rugit comme de jeunes lions. Il gronde, saisit sa proie et l’emporte[b], et personne ne la délivre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une lionne » ; le terme hébreu peut parfois avoir ce sens plus précis, mais « lion » convient bien au parallèle avec les jeunes lions.
    reason: lexical_alternative
  - marker: b
    text: Ou « la traîne au loin » ou « s’échappe avec elle » ; le verbe hébreu suggère que la proie est emmenée hors d’atteinte.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאָגָה לוֹ
  choice: Son rugissement
  rationale: La proposition nominale décrit le grondement de la puissance envahissante personnifiée. Le possessif masculin singulier est rendu naturellement par « son » en français.
- source_word: כַּלָּבִיא
  choice: comme celui d’un lion
  rationale: לָבִיא désigne ici un lion puissant et adulte. « Celui » évite la formulation peu naturelle « son rugissement est comme un lion » tout en gardant la comparaison sur le rugissement.
- source_word: וְשאג
  choice: il rugit
  rationale: Le parfait s’inscrit dans une description poétique vive ; le présent français en restitue l’immédiateté.
- source_word: כַּכְּפִירִים
  choice: comme de jeunes lions
  rationale: כְּפִירִים désigne des lions jeunes mais déjà redoutables, plutôt que de petits lionceaux.
- source_word: וְיִנְהֹם
  choice: Il gronde
  rationale: Le verbe évoque un grondement sourd, distinct du rugissement déjà mentionné.
- source_word: וְיֹאחֵז טֶרֶף
  choice: saisit sa proie
  rationale: אָחַז exprime une prise ferme et טֶרֶף désigne naturellement la proie dans cette image de lions.
- source_word: וְיַפְלִיט
  choice: et l’emporte
  rationale: Dans ce contexte, le hiphil évoque le fait d’emmener la proie hors d’atteinte, plutôt qu’une délivrance au sens positif.
- source_word: וְאֵין מַצִּיל
  choice: sans que personne puisse la lui arracher
  rationale: La tournure exprime idiomatiquement l’absence de tout sauveur capable de délivrer la proie, tout en maintenant le lien avec l’image prédatrice.
theological_decisions: []
