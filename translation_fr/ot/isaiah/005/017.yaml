translation:
  language: fr
  text: Alors les agneaux paîtront dans leur pâturage[a], et des étrangers établis[b] mangeront parmi les ruines des gens bien nourris[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu כדברם est difficile. Autres sens proposés : « dans leur propre lieu de pâture », « selon leur parole » ou « selon leur ordre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des résidents étrangers » ou « des étrangers séjournant parmi eux » ; le terme désigne des étrangers vivant au sein d’une autre population.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des gens gras », « des riches » ou « des gens prospères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָעוּ
  choice: Alors … paîtront
  rationale: Le qal de רעה décrit ici des animaux qui paissent. « Alors » exprime naturellement la conséquence du jugement annoncé dans le contexte.
- source_word: כְבָשׂים
  choice: les agneaux
  rationale: Le terme peut désigner des moutons, mais « agneaux » en conserve le sens courant et l'image d'animaux vulnérables paissant paisiblement.
- source_word: כְדָבְרָם
  choice: comme dans leur pâturage
  rationale: La forme hébraïque est difficile. Le contexte favorise le sens traditionnel d'un lieu où paître plutôt que le sens littéral, mais peu vraisemblable ici, « selon leur parole ».
- source_word: וְחָרְבוֹת
  choice: parmi les ruines
  rationale: חרבות désigne des lieux ruinés ou dévastés. La préposition « parmi » rend en français la valeur locative qu'exige le contexte.
- source_word: מֵחִים
  choice: des gens bien nourris
  rationale: Ce terme rare est généralement rattaché aux personnes grasses, prospères ou riches. « Gens bien nourris » préserve l'image concrète sans effacer sa portée sociale possible.
- source_word: גָּרִים
  choice: des résidents étrangers
  rationale: גרים désigne des étrangers établis parmi une population, et non de simples visiteurs. Cette formulation moderne conserve à la fois leur statut extérieur et leur résidence locale.
- source_word: יֹאכֵלוּ
  choice: mangeront
  rationale: Le sens ordinaire « manger » convient à l'image de personnes consommant ce qui pousse au milieu d'anciens domaines dévastés.
