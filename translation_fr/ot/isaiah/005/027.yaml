  variant: modern international French
source:
  edition: WLC
  text: אֵין עָיֵ֤ף וְ/אֵין כּוֹשֵׁל֙ בּ֔/וֹ לֹ֥א יָנ֖וּם וְ/לֹ֣א יִישָׁ֑ן וְ/לֹ֤א נִפְתַּח֙ אֵז֣וֹר חֲלָצָ֔י/ו וְ/לֹ֥א נִתַּ֖ק שְׂר֥וֹךְ נְעָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/027.yaml
  text: None among them is weary[a], and none stumbles; none slumbers or sleeps; the belt at his waist is not loosened[b], and the strap of his sandals is not broken.
translation:
  language: fr
  text: Aucun d’eux[a] n’est fatigué, aucun ne trébuche ; aucun ne somnole ni ne dort ; la ceinture autour de ses reins ne se défait pas[b], et la lanière de ses sandales ne se rompt pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en lui ». L’hébreu emploie un pronom singulier dont le référent est collectif : la force d’invasion considérée dans son ensemble.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la ceinture de ses reins ne s’ouvre pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָיֵף
  choice: fatigué
  rationale: Terme courant et précis pour l’épuisement physique dans le contexte d’une armée en marche.
- source_word: כּוֹשֵׁל
  choice: trébuche
  rationale: Rend directement l’idée de perdre pied ou de chanceler, et conserve le parallélisme avec « fatigué ».
- source_word: בּוֹ
  choice: d’eux
  rationale: 'Le pronom hébreu est morphologiquement singulier, mais son référent est collectif : la force d’invasion considérée comme un tout. Le français demande ici une formulation distributive naturelle.'
- source_word: יָנוּם
  choice: somnole
  rationale: Distingue ce verbe du suivant, « dormir », tout en conservant la paire poétique de quasi-synonymes.
- source_word: יִישָׁן
  choice: dort
  rationale: Équivalent français direct du verbe courant « dormir », en parallèle avec « somnole ».
- source_word: נִפְתַּח
  choice: se défait
  rationale: Pour une ceinture, le passif de « ouvrir » désigne concrètement le fait qu’elle se détache ou se défait ; cette formulation est naturelle en français.
- source_word: אֵזוֹר
  choice: ceinture
  rationale: Désigne la ceinture ou l’écharpe portée autour du corps ; « ceinture » est clair et moderne.
- source_word: חֲלָצָיו
  choice: autour de ses reins
  rationale: Conserve l’image corporelle de l’hébreu sans employer une tournure obscure ; « reins » appartient au registre biblique dignifié tout en restant compréhensible.
- source_word: נִתַּק
  choice: ne se rompt pas
  rationale: Exprime qu’une attache n’est ni arrachée ni cassée ; « se rompre » convient naturellement à une lanière.
- source_word: שְׂרוֹךְ
  choice: lanière
  rationale: Désigne clairement l’attache d’une chaussure ancienne et évite l’anachronisme possible de « lacet ».
- source_word: נְעָלָיו
  choice: ses sandales
  rationale: Préserve la réalité historique du type de chaussure évoqué.
theological_decisions: []
translation_notes:
  register: Français international moderne, poétique et dignifié. Le rythme en propositions brèves conserve l’impression d’une armée infatigable et parfaitement équipée. Le passage du pluriel distributif aux possessifs singuliers reflète le mouvement du texte hébreu, qui envisage aussi la force ennemie comme une unité collective.
