  rationale: La révision affine le rendu de בָתָה par « friche » et remplace une expression française qui pouvait affaiblir la force de l’ordre divin adressé aux nuages. La structure, les images agricoles, le féminin renvoyant à la vigne et l’action directe du locuteur sont conservés.
