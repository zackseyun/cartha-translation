    issue: La formulation « de ne pas laisser tomber de pluie »
    rationale: Elle peut suggérer que les nuages retiennent passivement une pluie qu’ils pourraient laisser tomber. L’hébreu exprime l’ordre de ne pas faire pleuvoir sur la vigne. « De ne pas faire tomber de pluie » rend plus directement l’action prohibée.
  - severity: low
    issue: « Un terrain dévasté » pour בָתָה
    rationale: Cette formulation est possible, mais « une friche » exprime plus naturellement une terre abandonnée ou inculte, nuance centrale du contexte où l’entretien cesse.
