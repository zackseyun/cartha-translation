  text: וַ/אֲשִׁיתֵ֣/הוּ בָתָ֗ה לֹ֤א יִזָּמֵר֙ וְ/לֹ֣א יֵעָדֵ֔ר וְ/עָלָ֥ה שָׁמִ֖יר וָ/שָׁ֑יִת וְ/עַ֤ל הֶ/עָבִים֙ אֲצַוֶּ֔ה מֵ/הַמְטִ֥יר עָלָ֖י/ו מָטָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/006.yaml
  text: And I will make it a wasteland[a]; it will not be pruned or hoed, and briers and thorns will grow up[c][b]; and I will command the clouds not to rain on it.
translation:
  language: fr
  text: 'J’en ferai une friche[a] : elle ne sera ni taillée ni bêchée[b] ; des ronces et des épines y pousseront. J’ordonnerai aux nuages de ne pas faire tomber de pluie sur elle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un terrain dévasté » ou « un terrain laissé à l’abandon ».
    reason: lexical_alternative
  - marker: b
    text: Ou « travaillée à la houe ». L’hébreu désigne le fait de cultiver le sol en le creusant.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשִׁיתֵהוּ
  choice: J’en ferai
  rationale: Le verbe שׂים peut signifier « placer, établir, faire ». Avec le nom prédicatif qui suit, « J’en ferai » exprime naturellement en français l’action directe du locuteur.
- source_word: בָתָה
  choice: un terrain dévasté
  rationale: Le nom désigne un espace ruiné, abandonné ou laissé inculte. « Terrain dévasté » convient au contexte de jugement tout en gardant l’image concrète.
- source_word: לֹא יִזָּמֵר
  choice: elle ne sera ni taillée
  rationale: Dans le contexte viticole, זמר désigne la taille de la vigne. La forme passive de l’hébreu est conservée.
- source_word: וְלֹא יֵעָדֵר
  choice: ni bêchée
  rationale: עדר désigne le travail du sol par creusement. « Bêcher » est précis, naturel dans ce contexte agricole et respecte la forme passive.
- source_word: וְעָלָה שָׁמִיר וָשָׁיִת
  choice: ronces et épines y pousseront
  rationale: Le binôme שָׁמִיר וָשָׁיִת évoque une végétation épineuse envahissante sans permettre d’identifier avec certitude des espèces précises. Le pronom « y » rend explicite le lieu où elle pousse.
- source_word: וְעַל הֶעָבִים אֲצַוֶּה
  choice: J’ordonnerai aux nuages
  rationale: Cette formulation française rend clairement les nuages comme destinataires de l’ordre, tout en conservant l’action directe à la première personne.
- source_word: מֵהַמְטִיר עָלָיו מָטָר
  choice: de ne pas laisser tomber de pluie sur elle
  rationale: Après צוה, מן avec l’infinitif exprime ici l’empêchement ou l’interdiction. La répétition hébraïque littérale « faire pleuvoir de la pluie » est rendue par une tournure française naturelle.
theological_decisions:
- issue: Action directe du locuteur dans l’image du jugement
  choice: 'Conserver la première personne active : « J’en ferai » et « J’ordonnerai »'
  alternative: Employer une formulation impersonnelle où la vigne devient dévastée et privée de pluie
  rationale: L’hébreu attribue explicitement au locuteur les mesures de jugement prises contre la vigne. La traduction conserve cette force sans préciser davantage l’identité du locuteur que ne le fait le verset isolé.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le rythme en deux phrases suit la progression du jugement : cessation de l’entretien, invasion des plantes épineuses, puis privation de pluie. Le féminin « elle » reprend la vigne du contexte immédiat.'
