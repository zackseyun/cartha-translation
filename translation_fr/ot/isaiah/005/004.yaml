base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/004.yaml
  text: What more was there to do for my vineyard that I have not done in it? Why[a], when I expected it to produce grapes, did it produce wild grapes?
translation:
  language: fr
  text: Qu’y avait-il encore à faire pour ma vigne, que je n’aie pas fait ? Pourquoi, alors que j’espérais qu’elle produirait des raisins, en a-t-elle produit de mauvais[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « raisins infects » ou « fruits sans valeur » ; le terme hébreu désigne un fruit mauvais, nauséabond ou inutilisable.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לַּעֲשׂוֹת עוֹד
  choice: Que restait-il encore à faire
  rationale: Cette formulation restitue l’interrogation rhétorique sur une éventuelle action encore possible, sans l’élargir en « qu’aurais-je pu faire de plus ? ».
- source_word: לְכַרְמִי
  choice: pour ma vigne
  rationale: La préposition לְ exprime ici l’action bénéfique accomplie en faveur de la vigne ; « pour » est naturel en français.
- source_word: וְלֹא עָשִׂיתִי בּוֹ
  choice: que je n’y aie pas fait
  rationale: Le pronom adverbial « y » reprend naturellement « ma vigne » et conserve la valeur locative de בּוֹ. Le subjonctif convient à la tournure interrogative française.
- source_word: קִוֵּיתִי
  choice: j’espérais
  rationale: קוה peut exprimer l’attente confiante ou l’espoir. « J’espérais » conserve ici la dimension d’attente sans réduire le verbe à une simple prévision.
- source_word: לַעֲשׂוֹת עֲנָבִים
  choice: qu’elle produirait des raisins
  rationale: Avec le produit d’une terre ou d’une plante, עשה signifie naturellement « produire ». Le sujet « elle » explicite la vigne déjà mentionnée.
- source_word: בְּאֻשִׁים
  choice: de mauvais raisins
  rationale: Le mot désigne un produit mauvais, nauséabond ou sans valeur. « Mauvais raisins » reste intelligible et évite de donner à tort au terme une précision botanique ; la note conserve les autres nuances possibles.
theological_decisions:
- issue: Image métaphorique de la vigne
  choice: Conserver « ma vigne » sans identifier son référent dans le verset.
  alternative: Expliciter la vigne comme représentant Israël ou le peuple de Dieu.
  rationale: Le verset présente encore l’image poétique, dont le contexte donne ensuite l’interprétation. La traduction ne doit pas anticiper cette explication.
- issue: Nuance de קִוֵּיתִי
  choice: Traduire par « j’espérais ».
  alternative: Traduire par « je m’attendais à » ou « j’attendais ».
  rationale: « J’espérais » maintient à la fois l’attente d’un résultat et la déception exprimée, sans trancher la tension théologique par une formulation purement prédictive.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La structure en deux questions conserve la force rhétorique du texte hébreu. Le déplacement naturel du complément pronominal dans « en a-t-elle produit » évite une répétition lourde tout en maintenant explicitement le contraste entre les raisins espérés et le mauvais produit obtenu.
