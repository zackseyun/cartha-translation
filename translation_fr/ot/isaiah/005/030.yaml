source:
  edition: WLC
  text: וְ/יִנְהֹ֥ם עָלָ֛י/ו בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/נַהֲמַת יָ֑ם וְ/נִבַּ֤ט לָ/אָ֨רֶץ֙ וְ/הִנֵּה חֹ֔שֶׁךְ צַ֣ר וָ/א֔וֹר חָשַׁ֖ךְ בַּ/עֲרִיפֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/030.yaml
  text: And he will roar over it on that day like the roaring of the sea[a]; and if one looks to the land, behold, darkness and distress[d][c][b], and the light is darkened in its clouds.
translation:
  language: fr
  text: En ce jour-là, il rugira contre lui comme rugit la mer[a]. Si l’on regarde vers le pays[b], voici les ténèbres et la détresse[c] ; et la lumière s’obscurcit dans ses nuages[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dessus de lui ». Le suffixe hébreu est masculin singulier et son référent demeure incertain ; il peut désigner un individu, un peuple personnifié ou une cible ennemie, selon la manière dont on comprend le contexte précédent.
    reason: alternative_reading
  - marker: b
    text: Ou « vers la terre » ; le mot hébreu אֶרֶץ peut désigner un pays ou la terre.
    reason: lexical_alternative
  - marker: c
    text: Ou « l’angoisse » ; le terme hébreu צַר évoque la détresse, l’oppression ou le resserrement.
    reason: lexical_alternative
  - marker: d
    text: 'L’expression hébraïque finale est difficile. On peut aussi traduire : « par ses nuages » ou « dans ses épais nuages » ; elle semble évoquer des masses nuageuses qui obscurcissent la lumière.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִנְהֹם
  choice: il rugira
  rationale: Le verbe נהם évoque un grondement ou rugissement puissant. La forme masculine singulière laisse le sujet implicite, comme en hébreu.
- source_word: עָלָיו
  choice: contre lui
  rationale: La préposition על avec suffixe masculin singulier peut exprimer une action dirigée contre quelqu’un ou quelque chose. « Contre lui » conserve le genre grammatical et la menace sans identifier davantage le référent.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule temporelle prophétique naturelle et fidèle en français actuel.
- source_word: כְּנַהֲמַת יָם
  choice: comme rugit la mer
  rationale: Cette formulation française vive restitue la comparaison sonore et évite la lourdeur de « comme le rugissement de la mer ».
- source_word: וְנִבַּט לָאָרֶץ
  choice: Si l’on regarde vers le pays
  rationale: La forme verbale se prête à une tournure impersonnelle. « Pays » convient à la scène territoriale, tout en signalant en note la possibilité de « terre ».
- source_word: וְהִנֵּה
  choice: voici
  rationale: « Voici » garde la force déictique et la soudaineté de la vision dans un français plus courant que « voici que » ou « voyez ».
- source_word: חֹשֶׁךְ צַר
  choice: les ténèbres et la détresse
  rationale: Le texte consonantique et la vocalisation massorétique présentent deux termes juxtaposés. Cette traduction conserve leur tension sans les fondre en une seule expression.
- source_word: וָאוֹר חָשַׁךְ
  choice: même la lumière s’obscurcit
  rationale: Le contraste est rendu clairement; « même » exprime naturellement en français la force adversative de la juxtaposition sans modifier son contenu essentiel.
- source_word: בַּעֲרִיפֶיהָ
  choice: dans ses nuages
  rationale: Le mot rare semble désigner des nuages ou masses nuageuses. La préposition ב est rendue directement par « dans », et le suffixe féminin par « ses », sans fixer explicitement son antécédent.
theological_decisions:
- issue: Référent du sujet implicite et du suffixe dans עָלָיו
  choice: Conserver « il » et « lui » sans identifier explicitement le référent
  alternative: Identifier le sujet comme l’ennemi envahisseur et l’objet comme le pays ou le peuple
  rationale: Le verset et son contexte permettent plusieurs constructions du référent. L’expliciter dans le corps du texte résoudrait une ambiguïté que l’hébreu maintient.
- issue: Interprétation de la dernière expression בַּעֲרִיפֶיהָ
  choice: Image de la lumière obscurcie « dans ses nuages »
  alternative: « par ses épais nuages » ou autre lecture d’un mot hébreu rare
  rationale: La formulation retenue préserve l’image cosmique du jugement tout en évitant de transformer une expression textuellement difficile en affirmation théologique trop précise.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme bref et les images du rugissement, des ténèbres et de la lumière obscurcie sont conservés. Les ambiguïtés du sujet, des référents pronominaux, de אֶרֶץ et du mot rare עֲרִיפֶיהָ sont maintenues ou documentées en notes.
