source:
  edition: WLC
  text: וְ/עַתָּה֙ אוֹדִֽיעָה נָּ֣א אֶתְ/כֶ֔ם אֵ֛ת אֲשֶׁר אֲנִ֥י עֹשֶׂ֖ה לְ/כַרְמִ֑/י הָסֵ֤ר מְשׂוּכָּת/וֹ֙ וְ/הָיָ֣ה לְ/בָעֵ֔ר פָּרֹ֥ץ גְּדֵר֖/וֹ וְ/הָיָ֥ה לְ/מִרְמָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/005.yaml
  text: 'And now[a], please let me tell you what I will do to my vineyard: I will remove its hedge, and it will be burned; I will break down its wall[b], and it will be trampled down.'
translation:
  language: fr
  text: 'Et maintenant, permettez-moi de vous faire savoir ce que je vais faire à ma vigne : j’enlèverai sa haie, et elle sera dévorée[a] ; j’abattrai son mur, et elle sera piétinée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle sera brûlée » ou « elle sera consumée ». L’expression hébraïque signifie littéralement « elle sera pour être consumée »; selon le contexte, elle peut évoquer le fait d’être dévorée ou brûlée.
    reason: lexical_alternative
  - marker: b
    text: Ou « elle deviendra un lieu que l’on piétine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède et la transition temporelle.
- source_word: אוֹדִיעָה נָּא אֶתְכֶם
  choice: permettez-moi de vous faire savoir
  rationale: Rend le causatif de ידע et la nuance d’appel ou de politesse portée par נָא, dans un français digne et naturel.
- source_word: אֵת אֲשֶׁר אֲנִי עֹשֶׂה לְכַרְמִי
  choice: ce que je vais faire à ma vigne
  rationale: Le participe עֹשֶׂה désigne ici l’action imminente annoncée ; « je vais faire » la rend naturellement sans lui donner un futur lointain.
- source_word: הָסֵר מְשׂוּכָּתוֹ
  choice: j’enlèverai sa haie
  rationale: L’infinitif absolu annonce une action décidée ; מְשׂוּכָּה désigne la haie protectrice de la vigne.
- source_word: וְהָיָה לְבָעֵר
  choice: et elle sera livrée à la destruction
  rationale: La tournure signifie littéralement qu’elle « sera pour la destruction/consomption ». Cette formulation conserve la valeur résultative sans imposer avec certitude l’idée spécifique du feu.
- source_word: פָּרֹץ גְּדֵרוֹ
  choice: j’abattrai son mur
  rationale: פָּרֹץ exprime l’ouverture d’une brèche ou la démolition ; « abattre » convient à un mur et distingue celui-ci de la haie précédente.
- source_word: וְהָיָה לְמִרְמָס
  choice: et elle sera piétinée
  rationale: Rend clairement le résultat exprimé par le nom מִרְמָס, tout en maintenant la vigueur de l’image.
theological_decisions:
- issue: L’image de la vigne comme annonce de jugement
  choice: Conserver l’image agricole sans identifier explicitement la vigne dans ce verset.
  alternative: Ajouter dans le texte que la vigne représente Israël ou Juda.
  rationale: Le contexte fournit l’interprétation de l’image, mais ce verset la maintient sous forme métaphorique. L’expliciter ici effacerait la progression poétique et prophétique.
- issue: Nature précise de la destruction après l’enlèvement de la haie
  choice: Employer une formulation générale, « livrée à la destruction », et signaler en note les possibilités lexicales.
  alternative: Traduire directement « elle sera brûlée » ou « elle sera dévorée/consumée ».
  rationale: לְבָעֵר est susceptible d’être compris comme destruction, consommation ou brûlage. Le texte principal évite de résoudre abusivement cette ambiguïté.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le pluriel « vous » reste non marqué en français, tandis que l’hébreu s’adresse explicitement à plusieurs personnes. Les deux protections de la vigne sont distinguées par « haie » et « mur ».
