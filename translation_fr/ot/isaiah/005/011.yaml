id: ISA.5.11
reference: Isaiah 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֛וֹי מַשְׁכִּימֵ֥י בַ/בֹּ֖קֶר שֵׁכָ֣ר יִרְדֹּ֑פוּ מְאַחֲרֵ֣י בַ/נֶּ֔שֶׁף יַ֖יִן יַדְלִיקֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/011.yaml
  text: Woe to those who rise early in the morning to pursue strong drink[a], who stay late into the evening until wine inflames them.
translation:
  language: fr
  text: Malheur à ceux qui se lèvent de bon matin pour courir après les boissons enivrantes, et qui s’attardent jusqu’au crépuscule[a], tandis que le vin les enflamme !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au soir ». Le mot hébreu peut désigner le crépuscule, surtout celui du soir, mais sa nuance exacte varie selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule française naturelle conserve la force de la dénonciation prophétique, avec sa nuance de lamentation et de jugement.
- source_word: מַשְׁכִּימֵי בַבֹּקֶר
  choice: ceux qui se lèvent de bon matin
  rationale: Rend le participe et l’idée de se lever tôt dans une expression française courante et digne.
- source_word: שֵׁכָר
  choice: boissons enivrantes
  rationale: Le terme désigne une boisson alcoolisée autre que le vin, sans impliquer nécessairement des alcools distillés modernes. Le pluriel générique est idiomatique en français.
- source_word: יִרְדֹּפוּ
  choice: courir après
  rationale: Préserve l’image vive d’une poursuite empressée et habituelle, dans un français accessible.
- source_word: מְאַחֲרֵי
  choice: qui s’attardent
  rationale: Exprime le fait de prolonger l’activité jusque tard sans ajouter explicitement l’idée de rester éveillé, absente du verbe hébreu.
- source_word: בַנֶּשֶׁף
  choice: jusqu’au crépuscule
  rationale: Dans la progression depuis le matin, נֶשֶׁף renvoie vraisemblablement au crépuscule du soir. « Jusqu’au » rend naturellement en français l’idée contextuelle de prolongation.
- source_word: יַיִן יַדְלִיקֵם
  choice: tandis que le vin les enflamme
  rationale: Conserve le vin comme sujet du verbe et maintient la métaphore causative de l’embrasement ou de l’excitation.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu. « Boissons enivrantes » évite l’anachronisme possible de « alcools forts », tandis que « le vin les enflamme » préserve l’image vigoureuse de l’hébreu.
