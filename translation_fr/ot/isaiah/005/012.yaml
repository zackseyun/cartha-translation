id: ISA.5.12
reference: Isaiah 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֨ה כִנּ֜וֹר וָ/נֶ֗בֶל תֹּ֧ף וְ/חָלִ֛יל וָ/יַ֖יִן מִשְׁתֵּי/הֶ֑ם וְ/אֵ֨ת פֹּ֤עַל יְהוָה֙ לֹ֣א יַבִּ֔יטוּ וּ/מַעֲשֵׂ֥ה יָדָ֖י/ו לֹ֥א רָאֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/012.yaml
  text: There are lyre and harp[a], tambourine and flute, and wine at their feasts; but they do not look to the work of Yahweh[b], and they do not see the work of his hands.
translation:
  language: fr
  text: Dans leurs banquets[a], il y a la lyre et la harpe[b], le tambourin et la flûte, ainsi que du vin ; mais ils ne prêtent pas attention à l’action de Yahweh[c] et ne voient pas l’œuvre de ses mains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs festins » ; le terme hébreu désigne un banquet où l’on boit.
    reason: lexical_alternative
  - marker: b
    text: L’identification exacte de ces deux instruments à cordes anciens est incertaine.
    reason: historical_cultural_context
  - marker: c
    text: Yahweh est le nom divin représenté en hébreu par les quatre consonnes YHWH.
    reason: translation_convention
lexical_decisions:
- source_word: וְהָיָה
  choice: il y a
  rationale: Le parfait de היה introduit ici de manière idiomatique la scène décrite. Le présent français rend naturellement ce qui caractérise leurs banquets dans ce passage poétique.
- source_word: כִנּוֹר וָנֶבֶל
  choice: la lyre et la harpe
  rationale: Ces termes désignent deux instruments à cordes distincts, dont l’identification précise reste incertaine. Ces équivalents usuels les différencient sans recourir à des termes archaïques.
- source_word: תֹּף וְחָלִיל
  choice: le tambourin et la flûte
  rationale: תֹּף désigne vraisemblablement un tambour sur cadre, et חָלִיל un instrument à vent de type flûte ou chalumeau. Les choix retenus sont clairs et courants.
- source_word: וָיַיִן מִשְׁתֵּיהֶם
  choice: ainsi que du vin ... dans leurs banquets
  rationale: מִשְׁתֶּה est un banquet où l’on boit. La mention explicite du vin conserve cette nuance et permet d’employer le terme français naturel « banquets ».
- source_word: פֹּעַל יְהוָה
  choice: l’action de Yahweh
  rationale: פֹּעַל peut désigner l’œuvre, l’activité ou l’acte accompli. « L’action » garde le sens dynamique et évite de répéter exactement « œuvre » dans le membre parallèle.
- source_word: יַבִּיטוּ
  choice: ils ne prêtent pas attention à
  rationale: Le verbe exprime ici un regard dirigé et attentif, et non la seule perception visuelle. Cette formulation française communique l’idée de considération délibérée.
- source_word: מַעֲשֵׂה יָדָיו
  choice: l’œuvre de ses mains
  rationale: La traduction conserve l’image concrète des mains ainsi que le parallélisme poétique avec « l’action de Yahweh ».
- source_word: רָאוּ
  choice: ne voient pas
  rationale: Bien que la forme hébraïque soit un parfait, elle décrit parallèlement une attitude caractéristique. Le présent convient au contexte et préserve le verbe concret « voir ».
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie le nom propre divin. « Yahweh » le représente directement plutôt que de lui substituer un titre.
- issue: Nature de « l’action de Yahweh » et de « l’œuvre de ses mains »
  choice: Conserver deux expressions parallèles sans préciser leur référent
  alternative: Expliciter qu’il s’agit de ses jugements, de sa création ou de ses actes historiques
  rationale: Le verset ne précise pas l’acte visé. Garder la formulation générale préserve l’ambiguïté et la force de l’accusation prophétique.
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux parties et le parallélisme poétique sont conservés. « Banquets » reste soutenu sans être archaïque, tandis que « prêtent attention » rend naturellement l’idée d’un refus délibéré de considérer l’action divine.
