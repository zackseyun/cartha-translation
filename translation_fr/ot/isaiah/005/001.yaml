source:
  edition: WLC
  text: אָשִׁ֤ירָה נָּא֙ לִֽ/ידִידִ֔/י שִׁירַ֥ת דּוֹדִ֖/י לְ/כַרְמ֑/וֹ כֶּ֛רֶם הָיָ֥ה לִֽ/ידִידִ֖/י בְּ/קֶ֥רֶן בֶּן שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/001.yaml
  text: 'Let me sing[a], please, for my beloved a song of my beloved concerning his vineyard: my beloved had a vineyard on a fertile hill.'
translation:
  language: fr
  text: 'Laissez-moi chanter, je vous prie, pour mon ami le chant de mon bien-aimé au sujet de sa vigne : mon ami avait une vigne sur un coteau fertile[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « sur une corne, fils d’huile », image désignant un coteau au sol riche.'
    reason: L’expression topographique et agricole repose sur un idiome dont une traduction littérale serait obscure en français.
lexical_decisions:
- source_word: אָשִׁירָה נָּא
  choice: Laissez-moi donc chanter
  rationale: Le cohortatif à la première personne exprime ici l’élan ou l’invitation du chanteur. « Laissez-moi… chanter » le rend naturellement en français, tandis que « donc » restitue avec discrétion la nuance de la particule נָא.
- source_word: לִידִידִי
  choice: pour mon ami
  rationale: La préposition ל marque ici la personne en faveur de laquelle ou à propos de laquelle le chant est entonné. « Mon ami » rend יָדִיד sans le confondre entièrement avec le terme poétique différent דּוֹד.
- source_word: שִׁירַת דּוֹדִי
  choice: le chant de mon bien-aimé
  rationale: Le groupe construit signifie littéralement « le chant de mon bien-aimé ». Cette formulation conserve la relation génitive et la tonalité poétique sans décider si le chant appartient au bien-aimé ou porte sur lui.
- source_word: לְכַרְמוֹ
  choice: au sujet de sa vigne
  rationale: La préposition ל indique vraisemblablement ici le thème du chant. « Au sujet de » est précis et naturel dans ce contexte.
- source_word: כֶּרֶם הָיָה לִידִידִי
  choice: mon ami avait une vigne
  rationale: La construction hébraïque dit littéralement qu’une vigne « était à » l’ami; le français idiomatique exprime cette possession par « avait ».
- source_word: בְּקֶרֶן בֶּן שָׁמֶן
  choice: sur un coteau fertile
  rationale: קֶרֶן, littéralement « corne », désigne métaphoriquement une hauteur saillante; בֶּן שָׁמֶן, littéralement « fils d’huile/de graisse », évoque un sol riche. « Coteau fertile » transmet clairement le sens topographique et agricole, tandis que l’image littérale est signalée en note.
theological_decisions:
- issue: Identité de « mon ami » et de « mon bien-aimé »
  choice: Ne pas identifier explicitement le personnage dans le texte principal.
  alternative: L’identifier d’emblée au SEIGNEUR, ou y voir seulement un ami réel ou un personnage littéraire du prophète.
  rationale: Ce premier vers ouvre le poème sans dévoiler encore explicitement l’identité du propriétaire de la vigne. La traduction préserve cette progression littéraire et la tension théologique que la suite du passage éclairera.
- issue: Deux désignations hébraïques du personnage aimé
  choice: Rendre יָדִיד par « ami » et דּוֹד par « bien-aimé ».
  alternative: Employer « bien-aimé » pour les deux termes afin d’accentuer leur coréférence probable.
  rationale: Les deux mots renvoient vraisemblablement au même personnage, mais leur distinction lexicale participe à la poésie du vers. Le français peut la conserver sans imposer une différence d’identité.
translation_notes:
  register: Français international actuel, poétique et digne. La phrase conserve l’ouverture chantée du passage, distingue les deux termes affectifs de l’hébreu et explicite seulement l’idiome topographique dans une note.
