  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵן֩ כֶּ/אֱכֹ֨ל קַ֜שׁ לְשׁ֣וֹן אֵ֗שׁ וַ/חֲשַׁ֤שׁ לֶֽהָבָה֙ יִרְפֶּ֔ה שָׁרְשָׁ/ם֙ כַּ/מָּ֣ק יִֽהְיֶ֔ה וּ/פִרְחָ֖/ם כָּ/אָבָ֣ק יַעֲלֶ֑ה כִּ֣י מָאֲס֗וּ אֵ֚ת תּוֹרַת֙ יְהוָ֣ה צְבָא֔וֹת וְ/אֵ֛ת אִמְרַ֥ת קְדֽוֹשׁ יִשְׂרָאֵ֖ל נִאֵֽצוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/024.yaml
  text: Therefore[a], as the tongue of fire devours stubble, and dry grass sinks before the flame, so their root will become rot, and their blossom will go up like dust; for they have rejected the law of Yahweh of hosts[b], and have despised the word of the Holy One of Israel.
translation:
  language: fr
  text: C’est pourquoi, comme une langue de feu dévore le chaume et que l’herbe sèche s’affaisse devant la flamme, ainsi leur racine deviendra pourriture[a], et leur fleur s’envolera comme la poussière, car ils ont rejeté la loi de Yahweh des armées et méprisé la parole du Saint d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur racine sera comme la pourriture ».
    reason: La construction hébraïque peut se comprendre comme un prédicat (« deviendra pourriture ») ou comme une comparaison explicite.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit clairement la conséquence judiciaire de l’accusation précédente.
- source_word: לְשׁוֹן אֵשׁ
  choice: une langue de feu
  rationale: Conserve la métaphore hébraïque vive et naturelle en français.
- source_word: קַשׁ
  choice: le chaume
  rationale: Désigne les tiges sèches laissées après la moisson et convient à l’image agricole.
- source_word: חֲשַׁשׁ
  choice: l’herbe sèche
  rationale: Rend sans précision excessive une matière végétale sèche et facilement combustible.
- source_word: יִרְפֶּה
  choice: s’affaisse devant
  rationale: Le verbe exprime le relâchement ou l’effondrement; cette formulation préserve l’image sans lui faire dire explicitement «être consumé».
- source_word: כַּמָּק יִהְיֶה
  choice: deviendra pourriture
  rationale: Expression concise qui représente la décomposition de la racine, tout en signalant en note l’autre analyse possible de la comparaison.
- source_word: פִּרְחָם
  choice: leur fleur
  rationale: Forme avec «racine» les deux pôles de la métaphore végétale.
- source_word: כָּאָבָק יַעֲלֶה
  choice: s’envolera comme la poussière
  rationale: Rend idiomatiquement le mouvement ascendant d’une poussière légère emportée dans l’air.
- source_word: מָאֲסוּ
  choice: ont rejeté
  rationale: Exprime la répudiation de la loi et évite de répéter «méprisé», réservé au second verbe.
- source_word: תּוֹרַת
  choice: la loi
  rationale: Préserve ici la force normative et l’arrière-plan d’alliance de la Torah.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme; sa translittération distingue le nom divin du titre.
- issue: Sens de תּוֹרָה dans ce contexte prophétique
  choice: la loi
  alternative: l’instruction
  rationale: «Loi» maintient la portée normative de l’accusation d’infidélité, tandis qu’«instruction» demeure une possibilité lexicale générale.
- issue: Ambiguïté syntaxique de כַּמָּק יִהְיֶה
  choice: deviendra pourriture
  alternative: sera comme la pourriture
  rationale: La tournure prédicative est fluide et vigoureuse, mais le כ peut aussi garder sa valeur comparative explicite; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, poétique et digne. La structure comparative et les images végétales du texte hébreu sont conservées sans archaïsmes inutiles.
