source:
  edition: WLC
  text: לָ/כֵ֛ן גָּלָ֥ה עַמִּ֖/י מִ/בְּלִי דָ֑עַת וּ/כְבוֹד/וֹ֙ מְתֵ֣י רָעָ֔ב וַ/הֲמוֹנ֖/וֹ צִחֵ֥ה צָמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/013.yaml
  text: Therefore my people go into exile for lack of knowledge; their honored men are dying of hunger[a], and their multitude is parched with thirst.
translation:
  language: fr
  text: C’est pourquoi mon peuple part en exil, faute de connaissance ; ses notables sont affamés[a], et sa multitude est desséchée par la soif.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa gloire, des hommes de faim » ; « sa gloire » désigne probablement les personnes éminentes du peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit la conséquence de l’accusation précédente avec clarté et dans un français prophétique naturel.
- source_word: גָּלָה
  choice: part en exil
  rationale: Rend le sens d’exil sans préciser un agent que l’hébreu n’exprime pas ici ; le parfait prophétique peut annoncer comme certaine une réalité à venir.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Conserve directement l’expression d’appartenance à la première personne.
- source_word: מִבְּלִי דָעַת
  choice: faute de connaissance
  rationale: Exprime naturellement l’absence et sa portée causale, tout en conservant la largeur sémantique de דַּעַת.
- source_word: כְבוֹדוֹ
  choice: ses notables
  rationale: Le terme signifie littéralement « sa gloire », mais désigne vraisemblablement ici les personnes éminentes qui font la gloire du peuple.
- source_word: מְתֵי רָעָב
  choice: des hommes affamés
  rationale: Reproduit assez formellement l’expression « hommes de faim » sans ajouter explicitement l’idée de mort, absente du substantif מְתֵי dans cette construction.
- source_word: הֲמוֹנוֹ
  choice: sa multitude
  rationale: Préserve le collectif singulier et désigne la masse du peuple.
- source_word: צִחֵה צָמָא
  choice: est desséchée par la soif
  rationale: Rend l’état d’extrême dessèchement et son association directe avec la soif dans un français clair.
theological_decisions:
- issue: Sens de דַּעַת dans l’accusation prophétique
  choice: connaissance
  alternative: compréhension
  rationale: « Connaissance » garde ouverte la portée intellectuelle, morale et relationnelle du mot, sans la réduire explicitement à une seule dimension.
- issue: Valeur temporelle de גָּלָה
  choice: part en exil
  alternative: est parti en exil
  rationale: Dans ce contexte d’annonce judiciaire, le parfait peut présenter l’exil futur comme assuré. Le présent français conserve la force immédiate sans imposer un accomplissement déjà achevé.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme entre les notables affamés et la multitude desséchée est conservé, de même que le singulier collectif renvoyant au peuple.
