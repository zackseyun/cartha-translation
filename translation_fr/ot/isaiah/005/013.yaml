review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : la conséquence annoncée, l’exil, le manque de connaissance, les personnes éminentes frappées par la faim et la multitude desséchée par la soif. « Part en exil » respecte la valeur prophétique du parfait sans imposer un exil déjà accompli. La construction « sa gloire, hommes de faim » est correctement comprise comme visant les notables.'
  naturalness: « Ses notables sont des hommes affamés » est compréhensible, mais « des hommes affamés » est inutilement calqué et moins naturel en français moderne. « Ses notables sont affamés » exprime le même état avec plus de fluidité. Le reste est clair et de registre prophétique sobre.
  terminology: « Connaissance » préserve utilement l’ampleur de דַּעַת. « Notables » convient au sens contextuel de כְבוֹדוֹ, tout en laissant la note signaler le littéral et l’incertitude interprétative. « Multitude » est approprié pour הֲמוֹנוֹ.
  issues:
