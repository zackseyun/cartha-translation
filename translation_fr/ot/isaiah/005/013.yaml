  to: C’est pourquoi mon peuple part en exil, faute de connaissance ; ses notables sont affamés[a], et sa multitude est desséchée par la soif.
  rationale: Une légère révision idiomatique remplace le calque français « sont des hommes affamés » par « sont affamés ». La note conserve le littéral hébreu et la nature probable, sans la présenter comme certaine, de l’interprétation de « sa gloire ».
