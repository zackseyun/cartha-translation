source:
  edition: WLC
  text: מַצְדִּיקֵ֥י רָשָׁ֖ע עֵ֣קֶב שֹׁ֑חַד וְ/צִדְקַ֥ת צַדִּיקִ֖ים יָסִ֥ירוּ מִמֶּֽ/נּוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/023.yaml
  text: who acquit the wicked for a bribe[a], and take away the righteousness of the righteous from him.
translation:
  language: fr
  text: eux qui acquittent le méchant pour un pot-de-vin[a] et retirent aux justes leur droit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui déclarent juste le méchant à cause d’un pot-de-vin et retirent à chacun des justes son droit ». À la fin, le texte hébreu emploie un pronom masculin singulier, probablement au sens distributif.'
    reason: Alternative lexicale pour le verbe judiciaire et précision sur le suffixe massorétique singulier.
lexical_decisions:
- source_word: מַצְדִּיקֵי
  choice: eux qui acquittent
  rationale: 'Le participe hiphil de צדק a ici une valeur judiciaire : déclarer juste, donc acquitter. « Acquittent » exprime naturellement cette valeur en français.'
- source_word: רָשָׁע
  choice: le coupable
  rationale: L’adjectif substantivé désigne ici celui qui est coupable dans un cadre judiciaire. Ce choix rend plus nettement le contraste juridique avec les justes.
- source_word: עֵקֶב שֹׁחַד
  choice: en échange d’un pot-de-vin
  rationale: עֵקֶב indique ici le motif ou la contrepartie de l’acquittement, et שֹׁחַד désigne un présent corrupteur. Cette formulation française rend explicitement la corruption dénoncée.
- source_word: וְצִדְקַת צַדִּיקִים
  choice: et ... aux justes la justice qui leur est due
  rationale: צְדָקָה peut désigner la justice, la juste cause ou le bon droit dans ce contexte judiciaire. « La justice qui leur est due » conserve le lien lexical avec « les justes » tout en rendant le sens concret.
- source_word: יָסִירוּ
  choice: enlèvent
  rationale: Le hiphil de סור signifie faire disparaître, ôter ou enlever. « Enlèvent » reste proche de l’image hébraïque sans être obscur.
- source_word: מִמֶּנּוּ
  choice: qui leur est due
  rationale: Le suffixe massorétique est au masculin singulier, probablement avec une valeur distributive après le pluriel « les justes ». Le français emploie naturellement le pluriel « leur » pour renvoyer à ce groupe; la note signale la forme littérale.
theological_decisions:
- issue: Sens de צִדְקָה dans une dénonciation judiciaire
  choice: la justice qui leur est due
  alternative: leur justice / leur bon droit
  rationale: Le contexte concerne des juges corrompus qui ôtent aux justes la décision équitable ou la reconnaissance légitime. Cette traduction préserve la portée morale de « justice » sans réduire le terme à une qualité intérieure.
- issue: Référence du suffixe singulier מִמֶּנּוּ après צַדִּיקִים
  choice: rendu idiomatiquement au pluriel, avec précision en note
  alternative: lui enlèvent la justice des justes
  rationale: Une reproduction mécanique du singulier serait ambiguë et peu naturelle en français. La valeur distributive demeure possible et est conservée dans la note plutôt que supprimée.
translation_notes:
  register: Français moderne, clair et digne. « Pot-de-vin » est l’expression usuelle pour un paiement corrupteur; « la justice qui leur est due » maintient le registre judiciaire et le jeu lexical entre justice et justes.
