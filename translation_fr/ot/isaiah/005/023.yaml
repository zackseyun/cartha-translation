review_pass:
  verdict: revise
  source_fidelity: Le sens judiciaire de מַצְדִּיקֵי est bien rendu par « acquittent ». Toutefois, רָשָׁע désigne le méchant / l’impie, avec une portée morale et judiciaire, et non simplement une personne déjà établie comme « coupable » dans la procédure. « Pour un pot-de-vin » rend plus directement la valeur causale de עֵקֶב. Pour צִדְקַת צַדִּיקִים, « leur droit » exprime sans surcharge la justice ou la juste cause dont les justes sont privés.
  naturalness: La formulation révisée est naturelle en français moderne et conserve le caractère de proposition relative rattachée au malheur de la section précédente. « Retirent aux justes leur droit » est plus concis et idiomatique que « enlèvent aux justes la justice qui leur est due ».
  terminology: « Méchant » correspond à רָשָׁע sans restreindre le terme à une culpabilité procédurale. « Justes » maintient le contraste lexical avec le champ de צדק. « Droit » convient au contexte de corruption judiciaire tout en laissant ouverte la nuance de justice/righteousness de צְדָקָה.
  issues:
  - severity: medium
    issue: « le coupable » restreint le sens de רָשָׁע.
    rationale: Le terme hébreu qualifie le méchant ou l’impie; dans ce contexte il a certes une résonance judiciaire, mais « coupable » peut présupposer précisément le verdict que les juges corrompus falsifient.
  - severity: low
    issue: « en échange d’un pot-de-vin » accentue l’idée d’une contrepartie transactionnelle.
    rationale: עֵקֶב introduit ici le motif ou la cause de l’acquittement. « Pour un pot-de-vin » le rend plus directement.
  - severity: low
    issue: « la justice qui leur est due » est explicatif et plus développé que le texte source.
    rationale: Le substantif singulier צִדְקַת peut désigner leur justice, leur juste cause ou leur droit. « Leur droit » conserve cette concision et le cadre juridique.
