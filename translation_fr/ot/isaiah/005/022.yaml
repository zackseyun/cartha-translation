source:
  edition: WLC
  text: ה֕וֹי גִּבּוֹרִ֖ים לִ/שְׁתּ֣וֹת יָ֑יִן וְ/אַנְשֵׁי חַ֖יִל לִ/מְסֹ֥ךְ שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/022.yaml
  text: Woe to those who are heroes at drinking wine[b][a], and men of strength at mixing strong drink.
translation:
  language: fr
  text: Malheur à ceux qui sont des héros[a] pour boire du vin, des hommes vaillants[b] pour mêler une boisson enivrante[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi se traduire par « hommes puissants » ou « guerriers »; il est employé ici avec ironie à propos de leur aptitude à boire.
    reason: lexical_alternative
  - marker: b
    text: L’expression hébraïque désigne habituellement des hommes valeureux, puissants ou capables; elle est ici appliquée sarcastiquement à ceux qui savent préparer des boissons alcoolisées.
    reason: lexical_alternative
  - marker: c
    text: Le terme hébreu désigne une boisson alcoolisée, mais n’en précise pas exactement la nature; on traduit aussi par « boisson forte » ou « boisson fermentée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule rend l’interjection prophétique qui exprime à la fois la dénonciation et l’annonce du jugement.
- source_word: גִּבּוֹרִים
  choice: héros
  rationale: Le mot désigne habituellement des hommes puissants ou des guerriers. « Héros » conserve ici l’éloge apparent et donc l’ironie visant leur prouesse à boire.
- source_word: לִשְׁתּוֹת
  choice: pour boire
  rationale: L’infinitif avec ל indique le domaine dans lequel ces hommes passent ironiquement pour des héros; cette tournure reste naturelle et proche de la structure hébraïque.
- source_word: יַיִן
  choice: vin
  rationale: Équivalent français courant du terme hébreu usuel pour le vin.
- source_word: וְאַנְשֵׁי חַיִל
  choice: des hommes vaillants
  rationale: L’expression désigne couramment des hommes valeureux, capables ou puissants. « Hommes vaillants » maintient son caractère honorifique, employé ici avec sarcasme.
- source_word: לִמְסֹךְ
  choice: pour mélanger
  rationale: Le verbe signifie mélanger ou préparer une boisson par mélange; « mélanger » préserve l’image concrète et le parallélisme avec « pour boire ».
- source_word: שֵׁכָר
  choice: boissons enivrantes
  rationale: Le terme désigne une boisson alcoolisée, sans permettre d’en préciser sûrement la nature. « Boissons enivrantes » évite de la réduire à une eau-de-vie moderne; le pluriel est idiomatique en français.
theological_decisions:
- issue: Portée ironique des titres honorifiques
  choice: Conserver « héros » et « hommes vaillants » dans le texte
  alternative: Expliciter par « champions de la boisson » ou « experts en boissons »
  rationale: Les titres traditionnellement associés à la puissance et à la valeur sont volontairement détournés. Les conserver laisse au lecteur la force du contraste sans remplacer l’ironie prophétique par une interprétation explicative.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le parallélisme du vers hébreu et son sarcasme sont maintenus. Le point d’exclamation convient à la vigueur de l’oracle de malheur.
