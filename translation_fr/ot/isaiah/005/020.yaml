  text: ה֣וֹי הָ/אֹמְרִ֥ים לָ/רַ֛ע ט֖וֹב וְ/לַ/טּ֣וֹב רָ֑ע שָׂמִ֨ים חֹ֤שֶׁךְ לְ/אוֹר֙ וְ/א֣וֹר לְ/חֹ֔שֶׁךְ שָׂמִ֥ים מַ֛ר לְ/מָת֖וֹק וּ/מָת֥וֹק לְ/מָֽר׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/020.yaml
  text: Woe to those who call evil good and good evil[a], who make darkness light and light darkness[b], who make bitter sweet and sweet bitter.
translation:
  language: fr
  text: Malheur à ceux qui appellent le mal bien et le bien mal[a], qui changent les ténèbres en lumière et la lumière en ténèbres[b], qui changent l’amer en doux et le doux en amer !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui disent du mal : “C’est bien”, et du bien : “C’est mal”. »'
    reason: Alternative plus littérale pour le verbe « dire » et la construction prédicative hébraïque.
  - marker: b
    text: 'La répétition des images — ténèbres et lumière, amer et doux — renforce l’accusation : il s’agit de renverser la réalité morale, et non d’une simple erreur de langage.'
    reason: Note explicative sur la force rhétorique des parallèles.
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Interjection prophétique de dénonciation et de jugement; « Malheur à » est naturel, solennel et traditionnel en français biblique moderne.
- source_word: הָאֹמְרִים
  choice: ceux qui appellent
  rationale: Le verbe signifie littéralement « dire », mais la construction prédicative exprime ici le fait d’attribuer une qualification; « appellent » le rend clairement sans développer le sens.
- source_word: לָרַע טוֹב וְלַטּוֹב רָע
  choice: le mal bien et le bien mal
  rationale: Cette formulation concise conserve l’antithèse et l’inversion morale du texte hébreu.
- source_word: שָׂמִים חֹשֶׁךְ לְאוֹר וְאוֹר לְחֹשֶׁךְ
  choice: font des ténèbres la lumière et de la lumière les ténèbres
  rationale: La construction « faire de X Y » exprime naturellement en français la substitution ou la requalification indiquée par שׂים avec ל, tout en préservant le parallélisme.
- source_word: שָׂמִים מַר לְמָתוֹק וּמָתוֹק לְמָר
  choice: font de l’amer le doux et du doux l’amer
  rationale: Les adjectifs substantivés gardent la brièveté et la symétrie de la métaphore sensorielle hébraïque.
theological_decisions:
- issue: Nature de la dénonciation
  choice: Le verset condamne le renversement des valeurs morales, où le mal est qualifié de bien et le bien de mal.
  alternative: Comprendre le verset comme une condamnation générale de toute confusion, ou comme une critique exclusivement judiciaire ou sociale.
  rationale: Les images parallèles des ténèbres et de la lumière, puis de l’amer et du doux, amplifient l’accusation sans la limiter à un domaine doctrinal, politique ou social particulier.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme ternaire et les oppositions compactes de l’hébreu sont conservés; le point d’exclamation rend la vigueur de l’interjection prophétique.
