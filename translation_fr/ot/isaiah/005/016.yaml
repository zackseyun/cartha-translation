id: ISA.5.16
reference: Isaiah 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּגְבַּ֛ה יְהוָ֥ה צְבָא֖וֹת בַּ/מִּשְׁפָּ֑ט וְ/הָ/אֵל֙ הַ/קָּד֔וֹשׁ נִקְדָּ֖שׁ בִּ/צְדָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/016.yaml
  text: But Yahweh of hosts is exalted in justice[b][a], and the Holy God is shown holy in righteousness.
translation:
  language: fr
  text: Mais Yahvé des armées est exalté par le jugement[a], et le Dieu saint se révèle saint[b] par la justice.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la justice » ou « dans le jugement ». Le mot hébreu peut désigner aussi bien la justice comme principe que le jugement exercé.
    reason: lexical_alternative
  - marker: b
    text: Ou « se montre saint », « est reconnu saint » ou, plus littéralement, « est sanctifié ». Le texte indique que la sainteté de Dieu est manifestée ou reconnue dans sa juste action.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּה
  choice: est exalté
  rationale: Le verbe גבה exprime l’élévation ou la grandeur. Dans ce contexte, « est exalté » indique que la hauteur souveraine de Yahvé se révèle dans son action judiciaire.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » transcrit le nom divin, tandis que « des armées » conserve la portée large du titre צְבָאוֹת sans le limiter explicitement aux seules armées humaines ou célestes.
- source_word: בַּמִּשְׁפָּט
  choice: par le jugement
  rationale: La préposition ב peut exprimer ici le moyen, et מִשְׁפָּט désigne, dans le contexte immédiat, l’exercice concret du jugement, tout en comportant une dimension de justice.
- source_word: וְהָאֵל הַקָּדוֹשׁ
  choice: et le Dieu saint
  rationale: Cette formulation française naturelle rend אֵל comme nom et הַקָּדוֹשׁ comme qualificatif défini, sans transformer nécessairement l’expression en titre propre.
- source_word: נִקְדָּשׁ
  choice: manifeste sa sainteté
  rationale: Le niphal de קדש exprime ici que Dieu se révèle ou se montre saint. Cette formulation évite de laisser entendre qu’il devient saint ou qu’un autre agent le sanctifie.
- source_word: בִּצְדָקָה
  choice: par la justice
  rationale: צְדָקָה désigne la droiture ou la justice. « Par la justice » rend naturellement la valeur instrumentale probable de ב et conserve le parallélisme avec le jugement.
theological_decisions:
- issue: Rendre נִקְדָּשׁ sans suggérer un changement dans la nature de Dieu
  choice: manifeste sa sainteté
  alternative: est reconnu saint / se montre saint / est sanctifié
  rationale: Le passif hébreu peut décrire la manifestation ou la reconnaissance de la sainteté divine. La formulation retenue exprime cette manifestation sans suggérer que Dieu acquiert la sainteté.
- issue: Préserver la distinction entre מִשְׁפָּט et צְדָקָה
  choice: jugement … justice
  alternative: justice … droiture
  rationale: Les deux termes sont proches mais non identiques. « Jugement » met en relief l’acte judiciaire dans le premier membre, tandis que « justice » exprime la rectitude divine dans le second.
- issue: Valeur de la préposition ב dans les deux membres parallèles
  choice: par … par
  alternative: dans … dans
  rationale: 'Le contexte favorise une lecture instrumentale : Yahvé est exalté par l’exercice du jugement et sa sainteté est manifestée par la justice. La note signale l’autre lecture possible pour le premier terme.'
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme hébreu est conservé, avec une distinction lexicale entre « jugement » et « justice ». Le nom divin est transcrit « Yahvé ».
