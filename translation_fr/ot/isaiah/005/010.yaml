  yaml_path: translation/ot/isaiah/005/010.yaml
  text: For ten yoke-pairs of vineyard will yield one bath[b][a], and a homer of seed will yield an ephah.
translation:
  language: fr
  text: Car dix jougs de vigne[a] ne produiront qu’un bath, et un homer de semence ne produira qu’un épha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dix paires d’attelage de vigne ». Le terme hébreu désigne littéralement un joug ou une paire d’animaux; il renvoie probablement ici à une étendue de vigne correspondant au travail d’un attelage. Le bath est une mesure de capacité pour les liquides; le homer et l’épha servent aux matières sèches. Un homer vaut dix éphas : la vigne comme la récolte auront donc un rendement très faible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication du jugement annoncé dans le contexte précédent.
- source_word: עֲשֶׂרֶת צִמְדֵּי כֶרֶם
  choice: dix arpents de vigne
  rationale: צֶמֶד désigne ici vraisemblablement une superficie agraire, c’est-à-dire la terre travaillée par un attelage. « Arpent » rend naturellement cette ancienne mesure de superficie sans suggérer que des paires d’animaux se trouvent dans la vigne.
- source_word: יַעֲשׂוּ / יַעֲשֶׂה
  choice: ne produiront… ne produira
  rationale: Dans ce contexte agricole, עשה signifie produire ou donner comme rendement. La négation restrictive « ne… que » exprime clairement l’extrême faiblesse du rendement.
- source_word: בַּת אֶחָת
  choice: qu’un bath
  rationale: Le bath, mesure ancienne de capacité pour les liquides, est conservé afin de respecter la précision historique du texte.
- source_word: וְזֶרַע חֹמֶר
  choice: un homer de semence
  rationale: Rend naturellement la construction hébraïque désignant une quantité de semence équivalant à un homer.
- source_word: אֵיפָה
  choice: un épha
  rationale: Cette ancienne mesure de capacité pour les matières sèches est conservée sous sa forme française traditionnelle.
