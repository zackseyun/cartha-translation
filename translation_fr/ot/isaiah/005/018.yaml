id: ISA.5.18
reference: Isaiah 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֛וֹי מֹשְׁכֵ֥י הֶֽ/עָוֺ֖ן בְּ/חַבְלֵ֣י הַ/שָּׁ֑וְא וְ/כַ/עֲב֥וֹת הָ/עֲגָלָ֖ה חַטָּאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/018.yaml
  text: Woe to those who drag iniquity with cords of falsehood[a], and sin with cart ropes[b],
translation:
  language: fr
  text: Malheur à ceux qui traînent la faute avec des cordes de néant[a], et le péché comme avec les gros cordages d’un chariot[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec des cordes de fausseté » ou « de vanité » ; le mot hébreu peut évoquer le néant, la vanité ou la fausseté.
    reason: lexical_alternative
  - marker: b
    text: L’image peut aussi suggérer qu’ils attirent sur eux la culpabilité ou ses conséquences, plutôt que de seulement traîner le péché derrière eux.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Formule prophétique naturelle en français, qui conserve la force de la dénonciation ou de la lamentation.
- source_word: מֹשְׁכֵי
  choice: ceux qui traînent
  rationale: Le participe décrit une action persistante; « traînent » maintient l’image concrète d’une charge tirée avec effort.
- source_word: עָוֹן
  choice: la faute
  rationale: Le terme peut désigner la conduite coupable, la culpabilité ou ses conséquences. « Faute » conserve une certaine amplitude sémantique tout en restant distinct de חַטָּאָה.
- source_word: בְּחַבְלֵי הַשָּׁוְא
  choice: avec les cordes du néant
  rationale: שָׁוְא peut évoquer le néant, la vanité ou la fausseté. « Du néant » préserve l’image énigmatique et son ampleur plutôt que de la limiter au mensonge.
- source_word: וְכַעֲבֹתוֹת
  choice: et… comme avec les câbles
  rationale: Le préfixe כ marque normalement la comparaison, tandis que עֲבֹתוֹת désigne des cordes épaisses. « Câbles » rend naturellement leur robustesse en français.
- source_word: הָעֲגָלָה
  choice: d’un chariot
  rationale: Équivalent français courant qui conserve l’image d’un véhicule lourd tiré par des cordes.
- source_word: חַטָּאָה
  choice: le péché
  rationale: Rend directement le terme tout en le distinguant de עָוֹן, traduit ici par « faute ».
theological_decisions:
- issue: Rapport métaphorique entre les personnes et le mal
  choice: Le texte les représente en train de traîner activement leur faute et leur péché.
  alternative: Elles attirent sur elles leur culpabilité, ses conséquences ou leur châtiment par des moyens trompeurs.
  rationale: L’image immédiate est celle d’une charge tirée à l’aide de cordes. Toutefois, la portée de עָוֹן permet aussi d’entendre la culpabilité ou ses conséquences; cette possibilité est signalée sans remplacer l’image principale.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation garde le parallélisme poétique, la comparaison explicitement marquée par כ, ainsi que l’ambiguïté de שָׁוְא et de עָוֹן.
