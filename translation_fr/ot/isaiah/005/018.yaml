  source_fidelity: Le texte rend bien l’oracle de malheur, le participe exprimant une action continue, et la distinction entre עָוֹן (« faute ») et חַטָּאָה (« péché »). « Néant » demeure une option lexicalement possible pour שָׁוְא et la note conserve utilement les autres nuances. La comparaison introduite par כ doit toutefois être formulée plus idiomatiquement en français sans être supprimée.
  naturalness: '« Comme avec les câbles d’un chariot » est peu naturel : « câbles » évoque plutôt des câbles métalliques ou techniques, et la construction comparative est raide. « Comme avec les gros cordages d’un chariot » rend à la fois l’épaisseur de עֲבֹתוֹת et l’image du chariot dans un français moderne clair.'
  terminology: « Malheur à », « faute » et « péché » conviennent au registre prophétique moderne et maintiennent la différenciation des deux termes hébreux. « Cordes de néant » évite le possessif français ambigu « cordes du néant » tout en préservant l’ouverture sémantique du texte.
