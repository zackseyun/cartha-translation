  text: הָ/אֹמְרִ֗ים יְמַהֵ֧ר יָחִ֛ישָׁ/ה מַעֲשֵׂ֖/הוּ לְמַ֣עַן נִרְאֶ֑ה וְ/תִקְרַ֣ב וְ/תָב֗וֹאָ/ה עֲצַ֛ת קְד֥וֹשׁ יִשְׂרָאֵ֖ל וְ/נֵדָֽעָה׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/019.yaml
  text: who say[a], “Let him hurry; let him hasten his work, so that we may see it; let the plan of the Holy One of Israel draw near and come, so that we may know it.”
translation:
  language: fr
  text: 'ceux qui disent : « Qu’il se dépêche ! Qu’il hâte son œuvre, afin que nous la voyions ! Que le projet[a] du Saint d’Israël approche et arrive, afin que nous le connaissions ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le dessein » ou « le conseil » du Saint d’Israël.
    reason: Alternative lexicale pour עֲצַת, qui peut désigner un projet, un dessein ou un conseil.
lexical_decisions:
- source_word: הָאֹמְרִים
  choice: ceux qui disent
  rationale: Le participe poursuit la description des personnes visées au verset précédent ; cette formulation reste naturelle en français tout en marquant cette continuité.
- source_word: יְמַהֵר
  choice: qu’il se dépêche
  rationale: La tournure volitive exprime ici un défi moqueur adressé à Dieu.
- source_word: יָחִישָׁה מַעֲשֵׂהוּ
  choice: qu’il hâte son œuvre
  rationale: Cette formulation conserve le second verbe et donc le redoublement rhétorique de l’hébreu, sans le fondre dans le premier.
- source_word: לְמַעַן נִרְאֶה
  choice: afin que nous la voyions
  rationale: La proposition exprime le but ; le pronom féminin renvoie naturellement à « œuvre », sans ajouter un référent étranger au texte.
- source_word: וְתִקְרַב וְתָבוֹאָה
  choice: que … approche et arrive
  rationale: Les deux verbes sont maintenus afin de préserver le parallélisme insistant de l’hébreu.
- source_word: עֲצַת
  choice: le projet
  rationale: Le nom peut désigner un conseil, un dessein ou un projet. « Projet » exprime clairement et simplement l’intention divine dans ce contexte.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette traduction directe conserve le titre divin caractéristique du livre d’Ésaïe.
- source_word: וְנֵדָעָה
  choice: et nous le saurons
  rationale: La formulation rend la conclusion provocatrice des locuteurs ; « le » reprend le projet ou ce qui se produira, sans préciser davantage l’objet implicite en hébreu.
theological_decisions:
- issue: Référent des verbes et des suffixes à la troisième personne du singulier
  choice: Les locuteurs mettent Dieu au défi d’agir rapidement, tout en conservant les pronoms « il » et « son ».
  alternative: Nommer explicitement Dieu dans la citation.
  rationale: Le contexte et la mention du « Saint d’Israël » permettent d’identifier le référent. Garder les pronoms préserve toutefois la distance rhétorique et le ton méprisant de l’hébreu.
- issue: Sens de עֲצַת
  choice: le projet du Saint d’Israël
  alternative: le dessein du Saint d’Israël ; le conseil du Saint d’Israël
  rationale: « Projet » est clair en français moderne et n’impose pas de nuance théologique technique. « Dessein » est signalé en note comme autre traduction possible.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les exclamations rendent le défi sarcastique, et la répétition des verbes conserve l’insistance poétique de l’hébreu.
