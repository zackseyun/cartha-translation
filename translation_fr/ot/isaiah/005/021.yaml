  yaml_path: translation/ot/isaiah/005/021.yaml
  text: Woe to those who are wise in their own eyes and discerning in their own sight[a].
translation:
  language: fr
  text: Malheur à ceux qui sont sages à leurs propres yeux et qui se croient perspicaces[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « capables de discernement » ou « intelligents ». Le terme hébreu désigne une intelligence qui comprend et discerne.
