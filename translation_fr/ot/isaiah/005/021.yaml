lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Interjection prophétique de dénonciation annonçant le jugement; « Malheur à » en restitue naturellement la force en français.
- source_word: חֲכָמִים
  choice: sages
  rationale: Le terme qualifie ceux qui se considèrent eux-mêmes comme sages; « sages » est direct et idiomatique.
- source_word: בְּעֵינֵיהֶם
  choice: à leurs propres yeux
  rationale: Cette expression française conserve l’image et le sens idiomatique d’une évaluation complaisante de soi.
- source_word: וְנֶגֶד פְּנֵיהֶם
  choice: à leurs propres yeux
  rationale: Littéralement « devant leur face »; la reprise idiomatique souligne en français le parallélisme de l’autoévaluation, sans conserver une tournure artificielle.
- source_word: נְבֹנִים
  choice: intelligents
  rationale: Le mot désigne la capacité de comprendre et de discerner. « Intelligents » est naturel, tout en laissant la note signaler l’autre nuance possible.
