revisions:
- from: C’est pourquoi la colère de Yahvé s’est enflammée contre son peuple. Il a étendu la main contre lui et l’a frappé ; les montagnes ont tremblé, et leurs cadavres ont été comme des déchets[a] au milieu des rues. Malgré tout cela, sa colère ne s’est pas détournée, et sa main est encore étendue.
  to: C’est pourquoi la colère de Yahvé s’est enflammée contre son peuple. Il a étendu la main contre lui et l’a frappé ; les montagnes ont tremblé, et leurs cadavres étaient comme des déchets[a] au milieu des rues. Malgré tout cela, sa colère ne s’est pas détournée, et sa main est encore étendue.
  rationale: La seule révision nécessaire remplace « ont été comme » par « étaient comme », afin d’obtenir une comparaison française naturelle sans introduire l’idée supplémentaire d’un devenir. La note conserve explicitement l’incertitude et l’image possible des « balayures ».
