source:
  edition: WLC
  text: עַל כֵּ֡ן חָרָה֩ אַף יְהוָ֨ה בְּ/עַמּ֜/וֹ וַ/יֵּ֣ט יָד֧/וֹ עָלָ֣י/ו וַ/יַּכֵּ֗/הוּ וַֽ/יִּרְגְּזוּ֙ הֶֽ/הָרִ֔ים וַ/תְּהִ֧י נִבְלָתָ֛/ם כַּ/סּוּחָ֖ה בְּ/קֶ֣רֶב חוּצ֑וֹת בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/025.yaml
  text: Therefore the anger of Yahweh burned against his people[a], and he stretched out his hand against them and struck them; the mountains quaked, and their corpses were like refuse in the midst of the streets. For all this, his anger has not turned away, and his hand is still stretched out.
translation:
  language: fr
  text: C’est pourquoi la colère de Yahvé s’est enflammée contre son peuple. Il a étendu la main contre lui et l’a frappé ; les montagnes ont tremblé, et leurs cadavres étaient comme des déchets[a] au milieu des rues. Malgré tout cela, sa colère ne s’est pas détournée, et sa main est encore étendue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme des balayures » ; le terme hébreu désigne ce qui est balayé ou rejeté.
    reason: Alternative lexicale pour un mot hébreu rare.
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien de conséquence avec l’accusation précédente.
- source_word: חָרָה אַף יְהוָה
  choice: la colère de Yahvé s’est enflammée
  rationale: Conserve l’image hébraïque de la colère qui brûle tout en restant idiomatique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
- source_word: בְּעַמּוֹ
  choice: contre son peuple
  rationale: Avec le verbe de colère, la préposition indique ici l’objet vers lequel celle-ci se dirige.
- source_word: וַיֵּט יָדוֹ עָלָיו
  choice: Il a étendu la main contre lui
  rationale: Préserve l’image anthropomorphique du geste de jugement et le singulier collectif de « peuple ».
- source_word: וַיַּכֵּהוּ
  choice: et l’a frappé
  rationale: Le suffixe singulier renvoie au nom collectif « peuple » ; le français permet de maintenir cette concordance.
- source_word: וַיִּרְגְּזוּ הֶהָרִים
  choice: les montagnes ont tremblé
  rationale: Rend directement le bouleversement physique exprimé par le verbe hébreu.
- source_word: נִבְלָתָם
  choice: leurs cadavres
  rationale: Désigne clairement les corps morts, sans atténuer la violence de la scène.
- source_word: כַּסּוּחָה
  choice: comme des déchets
  rationale: Le terme rare évoque ce qui est balayé ou rejeté ; « déchets » est clair, tandis que l’image plus précise est signalée en note.
- source_word: בְּקֶרֶב חוּצוֹת
  choice: au milieu des rues
  rationale: Reproduit la localisation publique des cadavres dans les voies de la ville.
- source_word: בְּכָל זֹאת
  choice: Malgré tout cela
  rationale: Dans le refrain, la formule indique que les jugements déjà infligés n’ont pas épuisé la colère divine.
- source_word: לֹא שָׁב אַפּוֹ
  choice: sa colère ne s’est pas détournée
  rationale: Conserve la métaphore selon laquelle la colère n’est pas revenue en arrière ou ne s’est pas retirée.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: sa main est encore étendue
  rationale: Préserve le refrain imagé annonçant la poursuite possible du jugement.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: La translittération rend visible le nom propre présent dans le texte hébreu sans introduire un titre à sa place.
- issue: Langage anthropomorphique du jugement divin
  choice: Maintenir la colère enflammée et la main étendue
  alternative: Paraphraser par « Yahvé était très en colère et continuait à punir »
  rationale: Les images corporelles structurent la force prophétique du verset et ne doivent pas être réduites à des abstractions.
- issue: Référence grammaticale au peuple collectif
  choice: « contre lui » et « l’a frappé »
  alternative: « contre eux » et « les a frappés »
  rationale: Le texte hébreu emploie des suffixes masculins singuliers renvoyant au nom collectif « peuple » ; le français peut préserver ce mouvement grammatical.
translation_notes:
  register: Français international moderne, grave et prophétique. La syntaxe reste fluide tout en conservant les images hébraïques, le singulier collectif et la structure du refrain.
