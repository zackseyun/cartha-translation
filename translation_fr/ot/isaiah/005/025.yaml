review_pass:
  verdict: revise
  source_fidelity: 'Le sens du texte hébreu est bien rendu : la colère de Yahvé, le geste judiciaire de sa main, l’ébranlement des montagnes, les cadavres dans les rues et le refrain final sont préservés. Le singulier collectif (« son peuple », « lui », « l’a frappé ») correspond correctement aux suffixes singuliers hébreux. La valeur de כַּסּוּחָה demeure lexicalement discutée et doit rester accompagnée d’une note.'
  naturalness: 'La formulation est globalement naturelle dans un français moderne au registre prophétique. Toutefois, « leurs cadavres ont été comme des déchets » est maladroit en français : avec cette comparaison descriptive, « étaient comme » est la tournure idiomatique et correspond directement à la construction nominale hébraïque.'
  terminology: « Yahvé », « colère », « main étendue » et « cadavres » conviennent au registre et respectent les images du texte. « Déchets » est possible pour כַּסּוּחָה, à condition de conserver l’alternative « balayures » en note.
  issues:
  - severity: low
    issue: Tournure verbale dans la comparaison des cadavres
    rationale: « Ont été comme des déchets » sonne comme un calque et suggère un changement d’état. L’hébreu présente ici une comparaison descriptive ; « étaient comme des déchets » est plus fidèle et plus idiomatique.
  revised_text: C’est pourquoi la colère de Yahvé s’est enflammée contre son peuple. Il a étendu la main contre lui et l’a frappé ; les montagnes ont tremblé, et leurs cadavres étaient comme des déchets[a] au milieu des rues. Malgré tout cela, sa colère ne s’est pas détournée, et sa main est encore étendue.
  revised_footnotes:
