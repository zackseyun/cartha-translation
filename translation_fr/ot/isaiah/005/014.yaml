  verdict: revise
  source_fidelity: 'Le sens et l’imagerie du texte hébreu sont bien rendus : le séjour des morts est personnifié, sa « gorge » et sa bouche évoquent son avidité, et l’énumération finale désigne la splendeur, la foule, le tumulte et l’individu qui se réjouit dans la ville. Toutefois, « y descendent » explicite la destination, alors que l’hébreu dit simplement « descend » ; l’image du séjour des morts permet de le comprendre sans l’ajouter.'
  naturalness: Le français est moderne, clair et d’un registre poétique approprié. La coordination finale avec un sujet composé et le pluriel « descendent » est naturelle. Supprimer « y » rend la formulation légèrement plus sobre et plus proche de l’ellipse expressive de l’original.
  terminology: '« Le séjour des morts » est un équivalent clair et théologiquement non chargé de שׁאול dans ce contexte. « Gorge », « sans limite », « tumulte » et « exulte » conviennent. La note a doit cependant éviter de présenter « être » comme la traduction littérale de nephesh : le terme hébreu doit être conservé dans la formulation littérale, puis expliqué selon son emploi contextuel.'
  issues:
