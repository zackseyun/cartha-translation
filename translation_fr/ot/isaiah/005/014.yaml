base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/014.yaml
  text: Therefore Sheol has enlarged its throat and opened its mouth without measure[a], and her splendor, her multitude, her uproar[c][b], and the one who exults in her go down.
translation:
  language: fr
  text: C’est pourquoi le séjour des morts élargit sa gorge[a] et ouvre sa bouche sans limite[b] ; la splendeur de la ville, sa foule, son tumulte et celui qui exulte en elle descendent.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « élargit son nephesh » ; dans ce contexte, l’expression peut aussi signifier « augmente son appétit ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sans mesure ».'
    reason: lexical_alternative
  - marker: c
    text: Le séjour des morts est ici personnifié comme une puissance vorace qui ouvre la bouche pour engloutir la grandeur de la ville et ceux qui s’y réjouissent.
    reason: cultural_note
lexical_decisions:
- source_word: שְּׁאוֹל
  choice: le séjour des morts
  rationale: Expression française claire qui désigne le domaine des morts sans le réduire à la tombe individuelle ni importer une conception plus tardive de l’enfer ; la personnification est conservée.
- source_word: הִרְחִיבָה ... נַפְשָׁהּ
  choice: élargit sa gorge
  rationale: Le sens littéral est « élargit son nephesh » ; dans le parallélisme avec la bouche ouverte, « gorge » restitue l’image corporelle et dévorante sans employer le trompeur « âme ».
- source_word: וּפָעֲרָה פִיהָ
  choice: et ouvre sa bouche
  rationale: Conserve directement l’image du séjour des morts personnifié qui s’apprête à engloutir.
- source_word: לִבְלִי חֹק
  choice: sans limite
  rationale: Dans cette locution, חֹק exprime une borne ou une mesure plutôt qu’un décret ; « sans limite » est naturel et précis en français.
- source_word: וְיָרַד
  choice: y descendent
  rationale: Le présent prophétique rend vivante et certaine l’annonce du jugement. Le pluriel français s’accorde naturellement avec l’énumération qui suit, bien que l’hébreu emploie un verbe singulier placé avant celle-ci.
- source_word: הֲדָרָהּ
  choice: la splendeur de la ville
  rationale: Le suffixe féminin renvoie vraisemblablement à la ville évoquée dans le contexte. L’explicitation évite qu’en français il paraisse renvoyer au séjour des morts, grammaticalement masculin.
- source_word: הֲמוֹנָהּ
  choice: sa foule
  rationale: Désigne naturellement la masse des habitants ou des participants aux réjouissances de la ville.
- source_word: שְׁאוֹנָהּ
  choice: son tumulte
  rationale: Rend le bruit agité et tapageur de la ville dans un registre poétique actuel.
- source_word: וְעָלֵז בָּהּ
  choice: celui qui exulte en elle
  rationale: Respecte le singulier hébreu et garde la nuance de joie expansive, voire arrogante, plutôt que de généraliser au pluriel.
theological_decisions:
- issue: Désignation de שְּׁאוֹל dans ce jugement poétique
  choice: le séjour des morts
  alternative: le Shéol ; la tombe ; la mort
  rationale: « Le séjour des morts » préserve la référence au domaine des défunts et sa personnification comme puissance dévorante, tout en restant immédiatement compréhensible. « La tombe » serait trop étroit et « la mort » trop abstrait.
- issue: Référent des suffixes féminins dans la seconde moitié du verset
  choice: la ville
  alternative: Sion ou Jérusalem explicitement ; le séjour des morts
  rationale: Le contexte vise la grandeur et la population de la ville, mais le verset ne la nomme pas ici. « La ville » clarifie le référent nécessaire en français sans ajouter un nom propre absent du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le rythme repose sur deux images corporelles parallèles, puis sur une énumération descendante. « Séjour des morts » privilégie l’intelligibilité, tandis que les notes conservent l’ambiguïté lexicale de nephesh et de la locution finale.
