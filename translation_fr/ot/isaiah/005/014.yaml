  rationale: 'La révision supprime le complément de lieu non exprimé en hébreu et corrige la note lexicale sur nephesh. Elle conserve les choix solides du projet : « séjour des morts » pour שׁאול, l’image concrète de la « gorge », l’indétermination poétique de « sans limite », ainsi que le singulier collectif de « celui qui exulte en elle ».'
