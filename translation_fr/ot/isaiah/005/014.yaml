    rationale: Le verbe hébreu וירד (« descend ») ne comporte pas de complément de lieu. La destination est suggérée par la personnification du séjour des morts, mais ne doit pas être grammaticalement explicitée dans le texte principal.
  - severity: medium
    issue: La note a appelle « être » la valeur littérale de nephesh.
    rationale: Le texte dit littéralement « élargit son nephesh ». « Être » est une interprétation lexicale possible dans certains contextes, mais elle n’est pas la formulation littérale et brouille ici l’image de la gorge ou de l’appétit.
