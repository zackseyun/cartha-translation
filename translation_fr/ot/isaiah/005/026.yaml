source:
  edition: WLC
  text: וְ/נָֽשָׂא נֵ֤ס לַ/גּוֹיִם֙ מֵ/רָח֔וֹק וְ/שָׁ֥רַק ל֖/וֹ מִ/קְצֵ֣ה הָ/אָ֑רֶץ וְ/הִנֵּ֥ה מְהֵרָ֖ה קַ֥ל יָבֽוֹא־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/005/026.yaml
  text: He will raise a signal for the nations from far away[a], and whistle for them from the end of the earth; and behold, quickly, swiftly[c][b], it comes.
translation:
  language: fr
  text: Il dressera un signal pour les nations lointaines[a] et les appellera d’un coup de sifflet depuis l’extrémité de la terre. Et le voici qui arrive, rapide et léger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un étendard pour les nations venues de loin ». Le mot hébreu désigne un signe élevé pour servir de point de ralliement ou d’appel.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie le singulier : « pour lui… il arrive ». La force composée des nations est vraisemblablement envisagée comme une unité collective.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְנָשָׂא נֵס
  choice: Il dressera un signal
  rationale: Le verbe נשׂא associé à נֵס décrit l’action d’élever un signe de ralliement. « Dresser un signal » garde à la fois le geste concret et la fonction d’appel.
- source_word: לַגּוֹיִם מֵרָחוֹק
  choice: pour les nations lointaines
  rationale: Le complément מֵרָחוֹק caractérise ici naturellement les nations appelées depuis une grande distance. Cette formulation française évite l’ambiguïté maladroite de « un signal de loin ».
- source_word: וְשָׁרַק לוֹ
  choice: et les appellera d’un coup de sifflet
  rationale: שרק désigne un sifflement aigu servant ici à convoquer. Le pronom hébreu est singulier, mais son référent collectif est rendu au pluriel dans cette proposition pour un français intelligible.
- source_word: מִקְצֵה הָאָרֶץ
  choice: depuis l’extrémité de la terre
  rationale: La formulation conserve l’image hébraïque des confins du monde, plutôt que de la réduire à un territoire local.
- source_word: וְהִנֵּה
  choice: Et voici
  rationale: « Et voici » restitue la vivacité du marqueur de présentation sans l’archaïsme plus marqué de « voici que » dans une phrase déjà concise.
- source_word: מְהֵרָה קַל
  choice: rapide et léger
  rationale: Les deux termes cumulent l’idée de vitesse et d’agilité. Garder deux qualificatifs préserve l’insistance de l’hébreu sans les fondre en un seul adverbe.
- source_word: יָבֹוא
  choice: il arrive
  rationale: Le singulier hébreu présente la force envahissante comme une unité collective. Le présent français après « voici » rend l’arrivée vive et imminente.
theological_decisions:
- issue: Référent singulier de לוֹ et יָבֹוא après le pluriel « nations »
  choice: Employer le pluriel dans l’appel (« les appellera »), puis conserver le singulier collectif dans l’arrivée (« il arrive »).
  alternative: Uniformiser tout le verset au pluriel (« elles arrivent ») ou maintenir partout un masculin singulier explicite.
  rationale: L’hébreu associe les nations au pluriel à une force convoquée envisagée ensuite au singulier. La traduction conserve cette tension grammaticale et littéraire au lieu de déterminer plus précisément l’identité du référent.
translation_notes:
  register: Français international moderne, digne et accessible. L’image militaire du signal élevé et l’appel par sifflement sont conservés. Le singulier collectif final est maintenu et expliqué en note.
