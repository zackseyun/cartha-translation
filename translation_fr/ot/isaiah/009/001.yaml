id: ISA.9.1
reference: Isaiah 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הָ/עָם֙ הַ/הֹלְכִ֣ים בַּ/חֹ֔שֶׁךְ רָא֖וּ א֣וֹר גָּד֑וֹל יֹשְׁבֵי֙ בְּ/אֶ֣רֶץ צַלְמָ֔וֶת א֖וֹר נָגַ֥הּ עֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/001.yaml
  text: The people walking in darkness have seen a great light; on those dwelling in a land of deep darkness[a], light has shone.
translation:
  language: fr
  text: Le peuple qui marche dans les ténèbres a vu une grande lumière ; sur ceux qui habitent un pays de profonde obscurité[a], la lumière a resplendi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un pays d’ombre de la mort ». Le terme hébreu צַלְמָוֶת est traditionnellement traduit ainsi, mais il peut aussi désigner plus généralement une obscurité profonde ou de sombres ténèbres.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: Le peuple
  rationale: Le nom collectif עַם désigne ici une population ou un peuple ; le singulier collectif français convient naturellement.
- source_word: הַהֹלְכִים
  choice: qui marche
  rationale: Le participe exprime une situation continue et conserve l’image biblique de la marche. L’accord au singulier suit le nom collectif « peuple ».
- source_word: בַּחֹשֶׁךְ
  choice: dans les ténèbres
  rationale: Cette formulation française naturelle préserve les dimensions concrète et métaphorique de l’hébreu.
- source_word: רָאוּ
  choice: a vu
  rationale: Le parfait présente l’action comme accomplie ; le passé composé convient à une proclamation prophétique dont l’effet demeure présent.
- source_word: אוֹר גָּדוֹל
  choice: une grande lumière
  rationale: Traduction directe et idiomatique de l’association nom-adjectif.
- source_word: יֹשְׁבֵי
  choice: ceux qui habitent
  rationale: La proposition relative rend naturellement le participe hébreu tout en conservant l’idée d’une condition durable.
- source_word: בְּאֶרֶץ
  choice: un pays
  rationale: Dans cette construction qualitative, « un pays de… » est naturel en français et n’identifie pas indûment un territoire précis.
- source_word: צַלְמָוֶת
  choice: profonde obscurité
  rationale: Le terme désigne vraisemblablement ici des ténèbres très épaisses ou une profonde détresse. Cette traduction garde le sens probable sans introduire explicitement la mort ; la lecture traditionnelle figure en note.
- source_word: אוֹר
  choice: la lumière
  rationale: La reprise de « lumière » préserve l’effet littéraire du texte. L’article défini renvoie naturellement à la grande lumière déjà mentionnée.
- source_word: נָגַהּ
  choice: a resplendi
  rationale: Le verbe signifie émettre de la lumière ou briller. « A resplendi » restitue sa force tout en restant digne et courant.
- source_word: עֲלֵיהֶם
  choice: sur ceux
  rationale: La préposition signifie littéralement « sur eux » ; son placement en tête du second membre respecte le parallélisme hébreu.
theological_decisions:
- issue: Traduction de צַלְמָוֶת dans un passage prophétique à portée messianique
  choice: profonde obscurité
  alternative: ombre de la mort
  rationale: Le composé hébreu peut fonctionner comme une expression de ténèbres extrêmes plutôt que comme une mention explicite de la mort. Le texte principal retient le sens contextuel probable, tandis que la note conserve la traduction traditionnelle et l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme poétique et la répétition de « lumière » sont conservés ; le passé composé rend l’accompli prophétique sans l’expliquer.
