  yaml_path: translation/ot/isaiah/009/004.yaml
  text: For every boot of the tramping warrior in the battle's tumult[a], and every garment rolled in blood, will be for burning, fuel for the fire.
translation:
  language: fr
  text: Car toute botte qui martèle dans le tumulte[a], et tout vêtement roulé dans le sang, seront destinés à être brûlés, combustible pour le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute botte qui martèle dans le tumulte ». L’expression hébraïque est rare et difficile ; certains comprennent la première proposition plus abstraitement comme évoquant le fracas du combat plutôt que des chaussures.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve le lien causal du contexte.
- source_word: כָל סְאוֹן סֹאֵן
  choice: toute botte qui martèle le sol
  rationale: Le substantif סְאוֹן est rare et difficile; dans ce contexte guerrier et avec le participe apparenté סֹאֵן, «botte» et l’action de marteler le sol donnent une image cohérente, parallèle au vêtement ensanglanté.
- source_word: בְּרַעַשׁ
  choice: dans le tumulte du combat
  rationale: רַעַשׁ évoque bruit, secousse ou tumulte; «du combat» explicite sobrement le cadre martial immédiat sans prétendre que ce complément est lexicalement exprimé.
- source_word: וְשִׂמְלָה מְגוֹלָלָה בְדָמִים
  choice: et tout vêtement roulé dans le sang
  rationale: Rend directement le vêtement et le participe passif; le pluriel idiomatique hébreu דָמִים se traduit naturellement par «sang».
- source_word: וְהָיְתָה לִשְׂרֵפָה
  choice: seront voués au feu
  rationale: Exprime la destination «pour être brûlés» dans un français naturel; le pluriel reprend les deux éléments coordonnés.
- source_word: מַאֲכֹלֶת אֵשׁ
  choice: livrés aux flammes
  rationale: Restitue idiomatiquement l’idée littérale de «nourriture du feu», tout en évitant la répétition peu naturelle de «feu».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et imagé. La formulation conserve le parallélisme des équipements de guerre destinés à disparaître par le feu, tout en signalant l’incertitude lexicale de la première proposition.
