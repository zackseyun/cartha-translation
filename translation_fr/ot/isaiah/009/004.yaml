revisions:
- from: Car toute botte qui martèle le sol dans le tumulte du combat[a], et tout vêtement roulé dans le sang, seront voués au feu, livrés aux flammes.
  to: Car toute botte qui martèle dans le tumulte[a], et tout vêtement roulé dans le sang, seront destinés à être brûlés, combustible pour le feu.
  rationale: 'La révision supprime l’explicitation non lexicale « du combat » et l’ajout « le sol », tout en gardant l’interprétation de « botte » signalée comme incertaine par la note. Elle rend explicitement la double expression finale : destination à la combustion et rôle de nourriture/combustible du feu.'
