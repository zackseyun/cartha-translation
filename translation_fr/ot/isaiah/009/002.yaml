id: ISA.9.2
reference: Isaiah 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִרְבִּ֣יתָ הַ/גּ֔וֹי לא הִגְדַּ֣לְתָּ הַ/שִּׂמְחָ֑ה שָׂמְח֤וּ לְ/פָנֶ֨י/ךָ֙ כְּ/שִׂמְחַ֣ת בַּ/קָּצִ֔יר כַּ/אֲשֶׁ֥ר יָגִ֖ילוּ בְּ/חַלְּקָ֥/ם שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/002.yaml
  text: You have multiplied the nation[a]; you have not increased the joy. They rejoice before you as with the joy at harvest[b], as men exult when they divide spoil.
translation:
  language: fr
  text: Tu as multiplié la nation[a], tu n’as pas accru la joie. Ils se réjouissent devant toi comme on se réjouit à la moisson[b], comme on exulte quand on partage le butin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plusieurs versions anciennes et de nombreuses traductions ont : « tu as accru sa joie », ce qui correspond à une lecture hébraïque telle que לוֹ (« à elle / pour elle ») au lieu de לֹא (« ne… pas »).'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « comme la joie à la moisson »; on peut aussi traduire l’ensemble : « Ils se réjouissent devant toi de la joie de la moisson, comme on exulte quand on partage le butin. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְבִּיתָ
  choice: tu as multiplié
  rationale: Le hiphil de רבה exprime ici l’action de rendre nombreux ou de multiplier; ce choix conserve la valeur causative et convient à son complément, « la nation ».
- source_word: הַגּוֹי
  choice: la nation
  rationale: Le singulier défini désigne collectivement une nation ou un peuple. « La nation » reproduit directement la forme hébraïque sans préciser une identité que le verset ne nomme pas.
- source_word: לֹא הִגְדַּלְתָּ הַשִּׂמְחָה
  choice: tu n’as pas accru la joie
  rationale: Le texte massorétique fourni porte לֹא, « ne… pas ». « Accroître la joie » rend naturellement le hiphil de גדל tout en maintenant la difficulté du texte.
- source_word: שָׂמְחוּ לְפָנֶיךָ
  choice: ils se réjouissent devant toi
  rationale: Le parfait peut présenter vivement le résultat dans le discours prophétique. « Devant toi » conserve l’orientation de cette joie vers la présence de Dieu.
- source_word: כְּשִׂמְחַת בַּקָּצִיר
  choice: comme on se réjouit à la moisson
  rationale: Cette formulation française naturelle exprime la comparaison avec la joie propre au temps de la moisson; la construction plus littérale est signalée en note.
- source_word: כַּאֲשֶׁר יָגִילוּ
  choice: comme on exulte quand
  rationale: גיל évoque une joie vive et débordante. Le pronom indéfini « on » rend naturellement en français la portée générique du pluriel hébreu.
- source_word: בְּחַלְּקָם שָׁלָל
  choice: on partage le butin
  rationale: L’expression désigne la répartition des biens pris après une victoire. « Partager le butin » conserve clairement l’image guerrière.
theological_decisions:
- issue: Lecture de לא (« ne… pas ») ou de לו (« à elle / pour elle ») dans le second membre
  choice: 'Le texte principal suit le texte massorétique : « tu n’as pas accru la joie »'
  alternative: « tu as accru sa joie »
  rationale: La source hébraïque fournie lit explicitement לֹא, « ne… pas ». Malgré la difficulté créée dans le contexte et l’appui de plusieurs témoins anciens en faveur d’une lecture correspondant à לוֹ, il convient de ne pas corriger silencieusement le texte; la variante est donc indiquée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement maintient l’adresse directe à Dieu. La répétition autour de la joie et le contraste difficile du texte massorétique sont conservés, sans harmonisation silencieuse.
