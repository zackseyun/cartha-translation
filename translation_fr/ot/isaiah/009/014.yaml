  text: זָקֵ֥ן וּ/נְשׂוּא פָנִ֖ים ה֣וּא הָ/רֹ֑אשׁ וְ/נָבִ֥יא מֽוֹרֶה שֶּׁ֖קֶר ה֥וּא הַ/זָּנָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/014.yaml
  text: The elder and the honored man is the head[b][a], and the prophet who teaches falsehood is the tail.
translation:
  language: fr
  text: L’ancien et le dignitaire[a], c’est la tête ; le prophète[b] qui enseigne le mensonge, c’est la queue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vieillard et l’homme de haut rang ». L’expression hébraïque traduite par « le dignitaire » signifie littéralement « celui dont le visage est élevé ».
    reason: lexical_alternative
  - marker: b
    text: Ou « le prophète qui enseigne des mensonges ».
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן
  choice: l’ancien
  rationale: Le terme peut désigner un homme âgé ou un ancien investi d’autorité. Dans ce contexte de direction sociale, « l’ancien » garde les deux dimensions sans réduire le mot au seul âge.
- source_word: וּנְשׂוּא פָנִים
  choice: et le dignitaire
  rationale: L’expression signifie littéralement « celui dont le visage est élevé » et désigne un homme honoré ou de haut rang. « Le dignitaire » exprime naturellement ce statut en français moderne.
- source_word: הוּא הָרֹאשׁ
  choice: c’est la tête
  rationale: Cette formulation conserve l’identification métaphorique directe et rend naturellement le pronom hébreu emphatique.
- source_word: וְנָבִיא
  choice: le prophète
  rationale: Le nom présente ici une figure représentative, mise en parallèle avec « l’ancien et le dignitaire » et identifiée à la queue.
- source_word: מוֹרֶה שֶּׁקֶר
  choice: qui enseigne le mensonge
  rationale: Le participe décrit une activité caractéristique ou continue. Le singulier collectif « le mensonge » rend clairement שֶׁקֶר, qui peut aussi être traduit par « des mensonges » ou « la fausseté ».
- source_word: הוּא הַזָּנָב
  choice: c’est la queue
  rationale: La traduction maintient l’image corporelle concrète et son contraste rhétorique avec « la tête ».
theological_decisions:
- issue: Identification métaphorique des dirigeants sociaux et religieux à « la tête » et à « la queue »
  choice: Conserver directement les métaphores « tête » et « queue ».
  alternative: Expliciter par « dirigeant » et « partie inférieure » ou « suiveur ».
  rationale: Le texte hébreu emploie des images corporelles concrètes, éclairées par le contexte immédiat. Les préserver maintient la force prophétique et évite d’introduire une interprétation dans le corps du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La structure équilibrée « c’est la tête… c’est la queue » reproduit le parallélisme et l’opposition du texte hébreu. Le point-virgule rend la division entre les deux identifications sans alourdir la phrase.
