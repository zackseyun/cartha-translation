  yaml_path: translation/ot/isaiah/009/013.yaml
  text: So Yahweh cut off from Israel head and tail[a], palm branch and reed[b], in one day.
translation:
  language: fr
  text: Et Yahweh retrancha d’Israël la tête et la queue[a], la palme et le roseau[b], en un seul jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire toute l’étendue de la nation, des plus élevés aux plus humbles ; le verset suivant explique cette image.
    reason: cross_reference
  - marker: b
    text: Ou « le jonc ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְרֵת
  choice: retrancha
  rationale: Le hiphil de כרת exprime ici une élimination décisive. « Retrancha » conserve l’image de séparation et le registre solennel du jugement, sans réduire le verbe à une coupe matérielle.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme préserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: מִיִּשְׂרָאֵל
  choice: d’Israël
  rationale: La préposition מן marque ici le retrait hors du peuple, rendu naturellement en français par « retrancher d’Israël ».
- source_word: רֹאשׁ וְזָנָב
  choice: la tête et la queue
  rationale: Les images concrètes de l’hébreu sont conservées, puisque le verset suivant en donne lui-même l’interprétation.
- source_word: כִּפָּה
  choice: la palme
  rationale: Le terme désigne la cime ou la branche du palmier. « La palme » est une formulation française concise qui maintient le contraste vertical avec la plante des marais.
- source_word: וְאַגְמוֹן
  choice: le roseau
  rationale: אַגְמוֹן désigne une plante de marais, roseau ou jonc. « Roseau » est clair et naturel dans le texte principal.
- source_word: יוֹם אֶחָד
  choice: en un seul jour
  rationale: Cette expression française naturelle souligne la soudaineté et l’ampleur du jugement exprimées par l’hébreu.
theological_decisions:
- issue: Conservation de la métaphore ou explicitation interprétative
  choice: Conserver « la tête et la queue, la palme et le roseau » dans le texte principal
  alternative: Traduire explicitement par « les dirigeants et les subalternes, les grands et les petits »
  rationale: Le texte source emploie des images que le verset suivant explique. Les préserver évite d’anticiper cette explication et maintient la progression rhétorique du passage.
translation_notes:
  register: Français international moderne, digne et lisible. « Retrancha » apporte une légère solennité appropriée au registre prophétique sans rendre la phrase obscure. Le parallélisme imagé de l’hébreu est conservé.
