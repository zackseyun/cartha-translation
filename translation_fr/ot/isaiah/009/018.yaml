  naturalness: Le texte révisé reste fluide et digne en français international moderne. « Par la fureur de Yahweh des armées » est naturel dans un registre prophétique soutenu. « Personne n’épargne son frère » est une formulation idiomatique qui conserve la portée distributive et le vocabulaire familial du texte.
  terminology: « Yahweh » rend explicitement le tétragramme, conformément au dossier. « Des armées » est un rendu lexicalement direct de צְבָאוֹת. « Frère » et « épargne » maintiennent respectivement l’image sociale/familiale et la force de חמל.
