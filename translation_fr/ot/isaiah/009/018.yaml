  text: בְּ/עֶבְרַ֛ת יְהוָ֥ה צְבָא֖וֹת נֶעְתַּ֣ם אָ֑רֶץ וַ/יְהִ֤י הָ/עָם֙ כְּ/מַאֲכֹ֣לֶת אֵ֔שׁ אִ֥ישׁ אֶל אָחִ֖י/ו לֹ֥א יַחְמֹֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/018.yaml
  text: By the wrath of Yahweh of hosts the land is scorched[a], and the people have become like fuel for the fire; no man spares his brother.
translation:
  language: fr
  text: Par la fureur de Yahweh des armées, le pays est brûlé[a] ; le peuple est devenu comme ce que dévore le feu. Personne n’épargne son frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est consumé » ou « est obscurci ». Le verbe hébreu est rare et son sens précis est discuté ; l’image du feu dans la suite favorise ici « est brûlé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶבְרַת
  choice: Sous la fureur de
  rationale: La préposition בְּ situe ici le jugement sous l’action de la colère divine. « Fureur » rend la force débordante de עֶבְרָה dans un français naturel et soutenu.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: « Yahweh » transcrit le nom divin ; « des armées » rend clairement צְבָאוֹת et conserve sa portée souveraine et guerrière sans préciser indûment la nature de ces armées.
- source_word: נֶעְתַּם
  choice: est consumé
  rationale: Le verbe rare est incertain. « Est consumé » s’accorde avec l’image explicite du feu dans la proposition suivante, tout en laissant en note l’autre interprétation majeure, « est obscurci ».
- source_word: אָרֶץ
  choice: le pays
  rationale: Dans ce contexte de jugement visant un peuple et son territoire, « le pays » est plus précis que « la terre ».
- source_word: וַיְהִי הָעָם
  choice: le peuple est devenu
  rationale: Le passé composé exprime naturellement en français l’entrée dans l’état résultant décrit par le wayyiqtol.
- source_word: כְּמַאֲכֹלֶת אֵשׁ
  choice: comme la proie du feu
  rationale: L’expression désigne littéralement ce que le feu mange. « La proie du feu » conserve cette image de dévoration dans un français idiomatique et évite d’ajouter explicitement la notion de combustible.
- source_word: אִישׁ אֶל אָחִיו לֹא יַחְמֹלוּ
  choice: Personne n’épargne son frère
  rationale: La formulation distributive rend naturellement le sens de אִישׁ et le pluriel verbal, tandis que « son frère » préserve le langage familial et « épargne » la force de חמל dans ce contexte de violence.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le nom propre de l’alliance plutôt que de le remplacer par un titre.
- issue: Portée de צְבָאוֹת
  choice: des armées
  alternative: de l’univers
  rationale: « Des armées » reste proche du sens lexical et de l’imagerie de puissance souveraine, sans adopter l’interprétation plus large mais moins formelle « de l’univers ».
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation fait ressortir les deux conséquences du jugement. « Personne n’épargne son frère » est inclusif dans sa portée tout en conservant l’image masculine et fraternelle du texte hébreu.
