  register: Français international moderne, soutenu mais accessible. La répétition du sujet est allégée par « embrase », tandis que « ceux-ci » explicite le référent grammatical pluriel de la dernière proposition. Le marqueur de note est placé après la proposition difficile à laquelle la note se rapporte.
