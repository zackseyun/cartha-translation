revisions:
- from: 'Car la méchanceté brûle comme un feu : elle dévore ronces et épines, embrase les fourrés de la forêt, et ceux-ci s’élèvent en tourbillonnant dans une colonne de fumée[a].'
  to: 'Car la méchanceté brûle comme un feu : elle dévore ronces et épines, embrase les fourrés de la forêt, et ils s’élèvent en volutes de fumée[a].'
  rationale: La révision remplace le démonstratif « ceux-ci » par le pronom pluriel plus discret et reformule l’expression finale en français idiomatique. Elle conserve le pluriel du texte hébreu, son image de mouvement ascendant et l’incertitude lexicale signalée par la note, sans imposer une identification définitive du sujet ni une nuance technique au verbe rare.
