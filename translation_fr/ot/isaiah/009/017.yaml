base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/017.yaml
  text: For wickedness burns like a fire; it devours brier and thorn[a], and it kindles the thickets of the forest, and they roll upward in a column of smoke.
translation:
  language: fr
  text: 'Car la méchanceté brûle comme un feu : elle dévore ronces et épines, embrase les fourrés de la forêt, et ils s’élèvent en volutes de fumée[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils montent dans une colonne de fumée ». Le sens exact de la dernière proposition hébraïque est difficile ; elle évoque vraisemblablement une montée ou un roulement en masses de fumée.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָעֲרָה
  choice: brûle
  rationale: Le qatal qal féminin singulier s’accorde avec רִשְׁעָה. Dans ce discours prophétique, le présent français rend naturellement la scène saisissante et son effet actuel.
- source_word: רִשְׁעָה
  choice: la méchanceté
  rationale: Le nom abstrait désigne le mal moral et reste personnifié comme sujet du feu qui dévore.
- source_word: שָׁמִיר וָשַׁיִת
  choice: ronces et épines
  rationale: Cette paire traditionnelle désigne une végétation piquante dont l’identification botanique exacte demeure incertaine ; des termes généraux préservent donc au mieux l’image.
- source_word: תֹּאכֵל
  choice: elle dévore
  rationale: Le verbe אכל, littéralement « manger », décrit couramment un feu qui consume ; « dévore » conserve la vigueur de la métaphore.
- source_word: וַתִּצַּת
  choice: embrase
  rationale: Le verbe יצת signifie mettre le feu ou allumer. « Embrase » exprime clairement l’extension de l’incendie aux fourrés.
- source_word: סִבְכֵי הַיַּעַר
  choice: les fourrés de la forêt
  rationale: סבך évoque une végétation dense et enchevêtrée ; « fourrés » est précis, naturel et garde l’image forestière.
- source_word: וַיִּתְאַבְּכוּ
  choice: s’élèvent en tourbillonnant
  rationale: Ce verbe rare et difficile paraît décrire un mouvement ascendant ou en volutes. La formulation française rend cette image sans prétendre lever entièrement l’incertitude lexicale.
- source_word: גֵּאוּת עָשָׁן
  choice: dans une colonne de fumée
  rationale: גֵּאוּת peut évoquer ce qui se gonfle ou s’élève ; associé à « fumée », le syntagme décrit vraisemblablement une masse de fumée montant en hauteur.
