id: ISA.9.9
reference: Isaiah 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לְבֵנִ֥ים נָפָ֖לוּ וְ/גָזִ֣ית נִבְנֶ֑ה שִׁקְמִ֣ים גֻּדָּ֔עוּ וַ/אֲרָזִ֖ים נַחֲלִֽיף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/009.yaml
  text: Bricks have fallen[a], but we will rebuild with cut stone; sycamores have been cut down[b], but we will replace them with cedars.
translation:
  language: fr
  text: Les briques sont tombées, mais nous rebâtirons en pierre de taille[a] ; les sycomores[b] ont été abattus, mais nous les remplacerons par des cèdres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en pierres taillées ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de figuiers-sycomores.
    reason: cultural_note
lexical_decisions:
- source_word: לְבֵנִים
  choice: briques
  rationale: Le nom pluriel désigne des briques de construction ordinaires, probablement en terre. « Briques » reste naturel et n’ajoute pas une précision matérielle que l’hébreu n’explicite pas.
- source_word: נָפָלוּ
  choice: sont tombées
  rationale: L’accompli présente la chute comme un fait réalisé. Le passé composé convient au français actuel et relie naturellement le désastre à la résolution qui suit.
- source_word: גָזִית
  choice: pierre de taille
  rationale: Le terme désigne de la pierre travaillée ou taillée pour la maçonnerie. « Pierre de taille » est l’expression française idiomatique et marque le contraste avec les briques ordinaires.
- source_word: נִבְנֶה
  choice: nous rebâtirons
  rationale: L’inaccompli à la première personne du pluriel exprime ici une intention future. Bien que le verbe signifie littéralement « bâtir », « rebâtir » rend naturellement l’idée contextuelle de construire après l’effondrement.
- source_word: שִׁקְמִים
  choice: sycomores
  rationale: Le mot désigne les figuiers-sycomores du Proche-Orient. « Sycomores » est concis dans le texte, tandis qu’une note précise l’identification botanique.
- source_word: גֻּדָּעוּ
  choice: ont été abattus
  rationale: La forme passive indique que les arbres ont été coupés ou abattus. Cette formulation conserve clairement le passif.
- source_word: אֲרָזִים
  choice: cèdres
  rationale: Le pluriel désigne des cèdres, bois plus prestigieux que celui des sycomores. Le terme français est direct et suffisant.
- source_word: נַחֲלִיף
  choice: nous les remplacerons par
  rationale: Le hiphil de חלף exprime ici la substitution. La formulation française explicite naturellement que les sycomores seront remplacés par des cèdres.
theological_decisions:
- issue: Tonalité de la déclaration des locuteurs
  choice: Une résolution fière et provocatrice de reconstruire avec des matériaux supérieurs après le désastre.
  alternative: Une simple déclaration neutre de reconstruction.
  rationale: Le contexte présente ces paroles comme l’expression d’une confiance arrogante plutôt que d’un repentir. Le contraste entre briques et pierre de taille, puis entre sycomores et cèdres, suffit à faire entendre cette prétention sans ajouter de commentaire interprétatif au verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, ainsi que le contraste ascendant entre matériaux ordinaires et matériaux plus nobles. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
