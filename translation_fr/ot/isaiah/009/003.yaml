    issue: Le complément « son fardeau » est absorbé dans une relative.
    rationale: עֹל סֻבֳּלוֹ signifie littéralement « le joug de son fardeau/de sa charge ». « Le joug qui pesait sur lui » communique l’effet du joug, mais ne préserve pas distinctement le fardeau que le texte nomme.
  - severity: low
    issue: « Posée » ajoute une nuance non exprimée explicitement.
    rationale: מַטֵּה שִׁכְמוֹ est littéralement « le bâton/la barre de (ou sur) son épaule ». « La barre sur son épaule » suffit et reste plus près de l’expression source.
