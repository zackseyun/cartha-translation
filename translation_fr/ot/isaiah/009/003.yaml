source:
  edition: WLC
  text: כִּ֣י אֶת עֹ֣ל סֻבֳּל֗/וֹ וְ/אֵת֙ מַטֵּ֣ה שִׁכְמ֔/וֹ שֵׁ֖בֶט הַ/נֹּגֵ֣שׂ בּ֑/וֹ הַחִתֹּ֖תָ כְּ/י֥וֹם מִדְיָֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/003.yaml
  text: For the yoke of his burden[a], and the staff on his shoulder[c][b], the rod of his oppressor—you have shattered them as on the day of Midian.
translation:
  language: fr
  text: Car le joug de la charge qu’il portait[a], la barre sur son épaule et le bâton de celui qui l’opprimait, tu les as brisés[b], comme au jour de Madian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le joug de son fardeau » ; on peut aussi comprendre : « le joug de son oppression ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu emploie un verbe à l’accompli : « tu les as brisés ». Dans ce contexte prophétique, certaines traductions rendent : « tu les briseras ».'
    reason: alternative_reading
  - marker: c
    text: Le « jour de Madian » évoque probablement la victoire que le Seigneur accorda sur Madian au temps de Gédéon (Juges 7).
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici la raison de la joie et de la délivrance annoncées dans le contexte précédent.
- source_word: עֹל סֻבֳּלוֹ
  choice: le joug qui pesait sur lui
  rationale: « Joug » conserve l’image concrète de la servitude imposée. La relative exprime en français naturel la charge désignée par סֻבֳּל sans réduire l’expression à la seule idée abstraite d’oppression.
- source_word: מַטֵּה שִׁכְמוֹ
  choice: la barre posée sur son épaule
  rationale: מַטֶּה peut désigner un bâton, une verge ou une barre. « Barre » évoque ici l’instrument qui fait porter la charge et permet de le distinguer du שֵׁבֶט mentionné ensuite.
- source_word: שֵׁבֶט הַנֹּגֵשׂ בּוֹ
  choice: le bâton de celui qui l’opprimait
  rationale: « Bâton » garde l’image de l’instrument de contrainte, tandis que la tournure verbale rend clairement l’action coercitive du נֹגֵשׂ.
- source_word: הַחִתֹּתָ
  choice: tu les as brisés
  rationale: Le parfait hébreu à la deuxième personne du masculin singulier est conservé comme un acte accompli adressé à Dieu. Le pronom « les » reprend naturellement les trois objets précédents.
- source_word: כְּיוֹם מִדְיָן
  choice: comme au jour de Madian
  rationale: Cette formulation française naturelle maintient la comparaison historique et le caractère évocateur de l’expression hébraïque.
theological_decisions:
- issue: Parfait prophétique et action divine
  choice: « tu les as brisés »
  alternative: « tu les briseras »
  rationale: Le parfait présente la victoire divine comme accomplie et certaine. Le rendre au passé composé préserve cette force rhétorique et l’adresse directe à Dieu, tandis que la note signale la possibilité d’une traduction au futur selon la valeur prophétique du contexte.
translation_notes:
  register: Français international moderne, digne et accessible. Les images concrètes du joug, de la barre et du bâton sont maintenues, avec une syntaxe fluide. Le pronom collectif masculin singulier de l’hébreu est rendu par « lui », sans expliciter davantage son référent.
