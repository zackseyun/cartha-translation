id: ISA.9.5
reference: Isaiah 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּי יֶ֣לֶד יֻלַּד לָ֗/נוּ בֵּ֚ן נִתַּן לָ֔/נוּ וַ/תְּהִ֥י הַ/מִּשְׂרָ֖ה עַל שִׁכְמ֑/וֹ וַ/יִּקְרָ֨א שְׁמ֜/וֹ פֶּ֠לֶא יוֹעֵץ֙ אֵ֣ל גִּבּ֔וֹר אֲבִי עַ֖ד שַׂר שָׁלֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/005.yaml
  text: For a child has been born to us[a], a son has been given to us, and the rule is on his shoulder; and his name is called Wonderful Counselor, Mighty God, Father of Eternity[b], Prince of Peace.
translation:
  language: fr
  text: Car un enfant nous est né[a], un fils nous a été donné ; la souveraineté repose sur son épaule, et on l’appelle Merveilleux Conseiller, Dieu puissant, Père de l’éternité[b], Prince de la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une formulation prophétique plus traditionnelle : « Car un enfant nous naîtra, un fils nous sera donné ; la souveraineté reposera sur son épaule, et on l’appellera… »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Père de l’éternité » ; on traduit aussi traditionnellement : « Père éternel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’espérance annoncée dans le contexte précédent et conserve la valeur explicative de la conjonction.
- source_word: יֶלֶד
  choice: un enfant
  rationale: Désigne naturellement un jeune enfant sans préciser davantage son âge.
- source_word: יֻלַּד לָנוּ
  choice: nous est né
  rationale: Le parfait passif présente la naissance comme accomplie. Cette tournure française, courante dans les annonces de naissance, garde aussi sa pertinence présente.
- source_word: בֵּן נִתַּן לָנוּ
  choice: un fils nous a été donné
  rationale: Respecte le parallélisme, le genre masculin de בֵּן et le passif, sans ajouter explicitement celui qui donne.
- source_word: הַמִּשְׂרָה
  choice: la souveraineté
  rationale: Exprime l’autorité royale et le pouvoir de gouverner sans évoquer principalement une institution administrative moderne.
- source_word: וַתְּהִי הַמִּשְׂרָה עַל שִׁכְמוֹ
  choice: la souveraineté repose sur son épaule
  rationale: Conserve l’image hébraïque de l’autorité portée sur l’épaule et l’exprime dans un français naturel, sans développer davantage la métaphore.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: on l’appelle
  rationale: Le verbe singulier a un sujet non exprimé. Le pronom indéfini français rend naturellement cette formule de nomination sans imposer une identité au sujet.
- source_word: פֶּלֶא יוֹעֵץ
  choice: Merveilleux Conseiller
  rationale: Traite les deux mots comme un titre royal composé, en préservant l’idée d’un conseiller dont le caractère ou l’action relève du merveilleux.
- source_word: אֵל גִּבּוֹר
  choice: Dieu puissant
  rationale: Rend directement le titre, qui possède ailleurs dans Ésaïe une nette portée divine, sans l’affaiblir pour des raisons théologiques.
- source_word: אֲבִי עַד
  choice: Père de l’éternité
  rationale: Reproduit la construction hébraïque, littéralement « père de perpétuité/éternité », tout en signalant en note la formulation française traditionnelle.
- source_word: שַׂר שָׁלוֹם
  choice: Prince de la paix
  rationale: Rend fidèlement le titre royal et conserve dans « paix » la richesse du terme שָׁלוֹם sans l’expliciter dans le texte.
theological_decisions:
- issue: Portée des noms ou titres royaux
  choice: Rapporter toute la série — « Merveilleux Conseiller, Dieu puissant, Père de l’éternité, Prince de la paix » — à l’enfant.
  alternative: Comprendre certains éléments comme une description de Dieu qui nomme l’enfant, ou atténuer אֵל גִּבּוֹר en « héros divin » ou « héros puissant ».
  rationale: La formule de nomination et la syntaxe se lisent le plus naturellement comme une série de titres attribués à l’enfant. La traduction conserve donc leur pleine force sans ajouter une construction qui n’est pas explicite dans l’hébreu.
- issue: Valeur temporelle des verbes dans la proclamation prophétique
  choice: Employer des formes françaises présentant la naissance et le don comme accomplis, puis des présents pour la souveraineté et le nom.
  alternative: Tout rendre au passé ou adopter une formulation future telle que « un enfant naîtra » et « on l’appellera ».
  rationale: Les formes hébraïques permettent une proclamation prophétique de réalités présentées comme accomplies. Le français choisi garde cet effet, tandis que la note reconnaît la lecture future traditionnelle suggérée par le contexte.
- issue: Sujet non exprimé de וַיִּקְרָא
  choice: Employer le sujet indéfini « on » dans « on l’appelle ».
  alternative: Traduire « il l’appela », « son nom fut appelé » ou, selon la portée prophétique, « on l’appellera ».
  rationale: Le texte massorétique porte un verbe masculin singulier sans sujet explicite. Le français indéfini évite d’identifier arbitrairement celui qui donne le nom, tout en rendant clairement la formule.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la proclamation et la série de titres. « Souveraineté » évite le sens institutionnel moderne de « gouvernement ». Les majuscules signalent que la série fonctionne ici comme des titres royaux.
