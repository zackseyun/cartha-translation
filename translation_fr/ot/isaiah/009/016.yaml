    issue: Valeur de בְּכָל־זֹאת
    rationale: « Malgré tout cela » peut laisser entendre que la colère persiste malgré les faits énumérés, alors que le refrain hébreu relie ces faits à la persistance de la colère sans imposer cette concession. « Avec tout cela » est plus proche et préserve l’ambiguïté relationnelle.
  - severity: low
    issue: Formulation de la parole coupable
    rationale: « Prononce des paroles infâmes » est une formulation française un peu plus usuelle que « profère des paroles infâmes », sans modification de sens.
