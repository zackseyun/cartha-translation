  variant: modern international French
source:
  edition: WLC
  text: עַל כֵּ֨ן עַל בַּחוּרָ֜י/ו לֹֽא יִשְׂמַ֣ח אֲדֹנָ֗/י וְ/אֶת יְתֹמָ֤י/ו וְ/אֶת אַלְמְנֹתָי/ו֙ לֹ֣א יְרַחֵ֔ם כִּ֤י כֻלּ/וֹ֙ חָנֵ֣ף וּ/מֵרַ֔ע וְ/כָל פֶּ֖ה דֹּבֵ֣ר נְבָלָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/016.yaml
  text: Therefore the Lord does not rejoice over their young men[a], and he does not have compassion on their fatherless and their widows; for every one of them is godless and an evildoer, and every mouth speaks folly. For all this his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: fr
  text: C’est pourquoi le Seigneur ne se réjouira pas de leurs jeunes hommes[a] et n’aura pas compassion de leurs orphelins ni de leurs veuves. Car ils sont tous impies et font le mal, et toute bouche prononce des paroles infâmes[b]. Avec tout cela, sa colère ne s’est pas détournée, et sa main reste étendue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en hébreu : « ses jeunes hommes… ses orphelins… ses veuves » ; le pluriel français renvoie au peuple pris collectivement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dit des choses insensées et honteuses » ; le terme hébreu associe la folie morale à ce qui est infâme ou scandaleux.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence du réquisitoire précédent et conserve la valeur déductive de l’expression.
- source_word: בַּחוּרָיו
  choice: leurs jeunes hommes
  rationale: בָּחוּר désigne ici des hommes jeunes, dans la force de l’âge. Le suffixe hébreu est au masculin singulier, mais son référent collectif est le peuple.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Dans cet emploi prophétique, le terme fonctionne comme un titre divin; « le Seigneur » est la formulation française naturelle.
- source_word: יְתֹמָיו
  choice: leurs orphelins
  rationale: יָתוֹם désigne l’enfant privé de père et, plus largement en français courant, l’orphelin. Le possessif pluriel rend le référent collectif.
- source_word: אַלְמְנֹתָיו
  choice: leurs veuves
  rationale: Traduction directe du nom pluriel, avec adaptation du possessif au peuple pris collectivement.
- source_word: יְרַחֵם
  choice: aura compassion
  rationale: רִחַם exprime une compassion qui se manifeste en miséricorde; cette formulation en conserve la dimension affective.
- source_word: כֻלּוֹ
  choice: ils sont tous
  rationale: Rend de façon idiomatique la totalité visée par la forme collective hébraïque.
- source_word: חָנֵף
  choice: impies
  rationale: Dans ce contexte prophétique, חָנֵף dénonce l’irrévérence et la corruption religieuse plutôt que la seule hypocrisie.
- source_word: מֵרַע
  choice: font le mal
  rationale: La tournure verbale française traduit naturellement celui qui pratique ou produit le mal, sans substantif lourd.
- source_word: כָל פֶּה דֹּבֵר נְבָלָה
  choice: toute bouche profère des paroles infâmes
  rationale: Conserve l’image concrète de « toute bouche » et exprime la dimension moralement honteuse ou vile de נְבָלָה, dont « folie » seul rendrait insuffisamment la force en français moderne.
- source_word: בְּכָל זֹאת
  choice: Malgré tout cela
  rationale: Dans le refrain d’Ésaïe, la formule souligne que les jugements déjà évoqués n’ont pas épuisé la colère divine.
- source_word: לֹא שָׁב אַפּוֹ
  choice: sa colère ne s’est pas détournée
  rationale: אַף signifie idiomatiquement « colère », et שׁוּב exprime ici le fait de se détourner ou de revenir en arrière.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: et sa main reste étendue
  rationale: Préserve l’image hébraïque de la main divine encore tendue, image de jugement dont le texte ne précise pas davantage la modalité.
theological_decisions:
- issue: Titre divin אֲדֹנָי
  choice: le Seigneur
  alternative: mon Seigneur
  rationale: Même si la forme a historiquement une morphologie possessive, elle fonctionne ici comme le titre divin usuel; « mon Seigneur » introduirait une nuance personnelle absente du contexte.
- issue: Suffixes possessifs de « jeunes hommes », « orphelins » et « veuves »
  choice: leurs jeunes hommes… leurs orphelins… leurs veuves
  alternative: ses jeunes hommes… ses orphelins… ses veuves
  rationale: Les suffixes hébreux sont au singulier parce qu’ils renvoient au peuple pris comme un tout. Le pluriel français rend clairement ce référent collectif sans suggérer un propriétaire masculin individuel.
- issue: Portée de la main divine étendue
  choice: conserver l’image sans explicitation
  alternative: sa main est encore levée pour frapper
  rationale: Le contexte indique le jugement, mais le texte hébreu dit seulement que la main demeure étendue. L’ajout « pour frapper » résoudrait une image que l’original laisse implicite.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe garde le parallélisme prophétique et le refrain du passage, tout en évitant les archaïsmes. Les marqueurs [a] et [b] figurent dans le corps du texte et correspondent exactement aux notes.
