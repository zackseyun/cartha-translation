id: ISA.9.19
reference: Isaiah 9:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּגְזֹ֤ר עַל יָמִין֙ וְ/רָעֵ֔ב וַ/יֹּ֥אכַל עַל שְׂמֹ֖אול וְ/לֹ֣א שָׂבֵ֑עוּ אִ֥ישׁ בְּשַׂר זְרֹע֖/וֹ יֹאכֵֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/019.yaml
  text: He cuts on the right[a], but is hungry; he eats on the left, but is not satisfied[b]. Each one eats the flesh of his own arm.
translation:
  language: fr
  text: Il coupe à droite[a], mais il a faim ; il mange à gauche, mais ils ne sont pas rassasiés. Chacun mange la chair de son propre bras[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il arrache à droite ». Le verbe hébreu signifie littéralement « couper » ou « retrancher » ; dans ce contexte de faim et de violence, il peut évoquer le fait de saisir ou de découper de la nourriture.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « la chair de son bras ». L’image peut évoquer un cannibalisme figuré, des luttes internes extrêmes ou une autodestruction collective. L’hébreu passe aussi du singulier au pluriel au milieu du verset.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְזֹר
  choice: Il tranche
  rationale: Le verbe גזר signifie concrètement « couper » ou « retrancher ». « Tranche » conserve cette image violente sans préciser un objet que l’hébreu laisse implicite.
- source_word: עַל יָמִין
  choice: à droite
  rationale: Cette formulation spatiale simple maintient le parallélisme avec « à gauche ».
- source_word: וְרָעֵב
  choice: mais il a encore faim
  rationale: « Mais » rend le contraste entre l’action précédente et la faim qui persiste ; « encore » explicite naturellement en français cette persistance suggérée par le contexte.
- source_word: וַיֹּאכַל
  choice: il mange
  rationale: אכל est le verbe courant pour « manger ». Le choix sobre laisse au contexte et à la dernière proposition toute leur violence.
- source_word: עַל שְׂמֹאול
  choice: à gauche
  rationale: Le rendu reprend exactement la structure directionnelle de « à droite ».
- source_word: וְלֹא שָׂבֵעוּ
  choice: mais ils ne sont pas rassasiés
  rationale: Le pluriel soudain de l’hébreu est conservé afin de ne pas effacer le passage d’un individu représentatif à la collectivité.
- source_word: אִישׁ
  choice: Chacun
  rationale: אישׁ a ici une valeur distributive. « Chacun » est naturel en français et garde l’individualisation du propos.
- source_word: בְּשַׂר
  choice: la chair
  rationale: « Chair » préserve l’image corporelle crue, plus fidèlement que « viande ».
- source_word: זְרֹעוֹ
  choice: de son propre bras
  rationale: זרוע désigne normalement le bras. « Propre » fait ressortir le caractère autoréférentiel de l’image sans la transformer en métaphore abstraite de la force.
- source_word: יֹאכֵלוּ
  choice: mange
  rationale: Après le singulier distributif « chacun », le français exige naturellement le singulier, même si le verbe hébreu est au pluriel.
theological_decisions:
- issue: Portée de l’image de la chair du bras
  choice: Conserver l’image corporelle littérale dans le texte
  alternative: Interpréter directement l’expression comme une lutte fratricide ou un processus d’autodestruction
  rationale: Le contexte évoque probablement une violence interne autodestructrice, mais la traduction ne doit pas remplacer l’image cannibalique du texte par son interprétation.
translation_notes:
  register: Français moderne, sobre et digne. Le parallélisme « à droite / à gauche » et l’image corporelle sont maintenus. Le brusque passage hébreu du singulier au pluriel est volontairement conservé, malgré son caractère marqué en français.
