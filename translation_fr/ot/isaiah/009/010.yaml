  text: וַ/יְשַׂגֵּ֧ב יְהוָ֛ה אֶת צָרֵ֥י רְצִ֖ין עָלָ֑י/ו וְ/אֶת אֹיְבָ֖י/ו יְסַכְסֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/010.yaml
  text: And Yahweh raised up the adversaries of Rezin against him[a], and stirred up his enemies[b],
translation:
  language: fr
  text: Yahweh a dressé contre lui les adversaires de Retsîn[a] et a excité ses ennemis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a fortifié les adversaires de Retsîn contre lui » ou « a élevé les adversaires de Retsîn contre lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu conserve le singulier : « contre lui… ses ennemis ». D’après le contexte plus large, il s’agit du royaume du Nord, c’est-à-dire d’Éphraïm.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: a dressé
  rationale: Le hiphil de שׂגב peut exprimer l’idée de rendre fort, de placer en hauteur ou d’élever. Dans ce contexte de jugement, « a dressé » indique naturellement que Yahweh fait surgir ou met en position d’agir des adversaires, sans suggérer qu’il leur confère un honneur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, afin de conserver le nom personnel présent dans le texte hébreu.
- source_word: צָרֵי רְצִין
  choice: les adversaires de Retsîn
  rationale: Cette construction signifie littéralement « les adversaires de Retsîn ». « Adversaires » préserve le sens hostile tout en évitant de répéter immédiatement « ennemis ».
- source_word: עָלָיו
  choice: contre lui
  rationale: Dans un contexte d’action hostile, עַל signifie naturellement « contre ». Le pronom masculin singulier est conservé sans en expliciter le référent.
- source_word: אֹיְבָיו
  choice: ses ennemis
  rationale: Traduction directe et naturelle du nom muni du suffixe pronominal masculin singulier.
- source_word: יְסַכְסֵךְ
  choice: a poussé … à l’attaque
  rationale: Le verbe סכסך exprime l’incitation ou la mise en mouvement d’une hostilité. Cette formulation française actuelle restitue clairement cette valeur causative sans préciser davantage la forme du conflit.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah ; le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom divin au lieu de lui substituer un titre.
- issue: Référent des pronoms masculins singuliers עָלָיו et אֹיְבָיו
  choice: Conserver « lui » et « ses » sans nommer le référent
  alternative: contre Israël ; contre Éphraïm
  rationale: Le contexte plus large désigne le royaume du Nord, ou Éphraïm, mais le verset garde des suffixes singuliers sans répéter explicitement leur référent. La traduction préserve cette donnée et son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Retsîn » suit une translittération française usuelle du nom hébreu. Le parallélisme et les pronoms singuliers du texte source sont maintenus.
