  text: וְ/הָ/עָ֥ם לֹא שָׁ֖ב עַד הַ/מַּכֵּ֑/הוּ וְ/אֶת יְהוָ֥ה צְבָא֖וֹת לֹ֥א דָרָֽשׁוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/012.yaml
  text: But the people did not return to him who struck them[a], nor did they seek Yahweh of Armies.
translation:
  language: fr
  text: Mais le peuple n’est pas revenu vers celui qui le frappait, et il n’a pas cherché Yahvé des armées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « le SEIGNEUR des armées ».'
    reason: Signale le rendu traditionnel du nom divin et de son titre sans le substituer au texte principal.
lexical_decisions:
- source_word: וְהָעָם
  choice: Mais le peuple
  rationale: Le nom הָעָם désigne « le peuple ». Dans ce contexte de jugement, la conjonction וְ a une valeur contrastive, rendue naturellement par « Mais ».
- source_word: לֹא שָׁב
  choice: n’est pas revenu
  rationale: שׁוּב signifie fondamentalement « revenir, retourner ». « Revenir » conserve ici la dimension relationnelle sans expliciter davantage l’idée de repentance.
- source_word: עַד הַמַּכֵּהוּ
  choice: à celui qui le frappait
  rationale: La préposition עַד marque ici le mouvement vers quelqu’un. Le participe הַמַּכֵּה désigne celui qui frappe, et le suffixe masculin singulier renvoie grammaticalement au nom collectif « le peuple ».
- source_word: וְאֶת יְהוָה צְבָאוֹת
  choice: et … Yahvé des armées
  rationale: La coordination négative se rend naturellement en français par « et il n’a pas… ». Le nom divin יְהוָה est transcrit « Yahvé », forme courante en français, et צְבָאוֹת est traduit par « des armées ».
- source_word: לֹא דָרָשׁוּ
  choice: il n’a pas recherché
  rationale: דָּרַשׁ exprime ici le fait de chercher Dieu, notamment pour se tourner vers lui et solliciter son aide. « Rechercher » garde cette portée sans la réduire à une simple demande de renseignements.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » conserve le nom propre divin dans une forme française reconnue, tandis que le rendu traditionnel est signalé en note.
- issue: Rendu du titre צְבָאוֹת
  choice: des armées
  alternative: des puissances célestes
  rationale: « Des armées » exprime directement le sens concret de צְבָאוֹת et préserve la force militaire du titre sans déterminer si les armées visées sont terrestres ou célestes.
translation_notes:
  register: Français moderne, sobre et digne. Le singulier grammatical de « le peuple … le frappait … il n’a pas » est naturel en français et correspond au suffixe singulier hébreu, même si le dernier verbe hébreu est au pluriel par accord selon le sens collectif.
