id: ISA.9.15
reference: Isaiah 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יִּֽהְי֛וּ מְאַשְּׁרֵ֥י הָֽ/עָם הַ/זֶּ֖ה מַתְעִ֑ים וּ/מְאֻשָּׁרָ֖י/ו מְבֻלָּעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/015.yaml
  text: And the guides of this people have become those who lead them astray[a], and those guided by them are swallowed up.
translation:
  language: fr
  text: Les guides de ce peuple sont devenus ceux qui l’égarent[a], et ceux qu’ils guident sont engloutis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ceux qui déclarent ce peuple heureux l’égarent, et ceux qu’ils déclarent heureux sont engloutis. » Les formes hébraïques issues de אשר peuvent se rapporter au fait de déclarer quelqu’un heureux, bien que le contexte permette aussi de comprendre « guides » et « ceux qu’ils guident ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: sont devenus
  rationale: La forme narrative de היה présente ici l’entrée dans l’état décrit. « Sont devenus » exprime naturellement en français ce changement, sans le réduire à une simple description passée.
- source_word: מְאַשְּׁרֵי
  choice: les guides de
  rationale: Le participe piel de אשר peut évoquer le fait de conduire ou celui de déclarer heureux. Dans ce contexte, son parallélisme avec « égarent » favorise le sens de guides, tout en conservant l’autre lecture en note.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: עם désigne directement un peuple, et le démonstratif est conservé dans la tournure prophétique naturelle « ce peuple ».
- source_word: מַתְעִים
  choice: ceux qui l’égarent
  rationale: 'Le participe hifil de תעה a une valeur causative : faire errer, détourner du bon chemin. « Égarent » restitue cette force de manière concise et idiomatique.'
- source_word: וּמְאֻשָּׁרָיו
  choice: et ceux qu’ils guident
  rationale: Le participe passif, parallèle à מְאַשְּׁרֵי, désigne ceux qui sont conduits. Le français emploie le pluriel « ils » en renvoyant collectivement aux guides mentionnés dans le premier membre.
- source_word: מְבֻלָּעִים
  choice: sont engloutis
  rationale: Le participe passif de בלע conserve l’image vive de personnes avalées ou englouties. Ce choix laisse la portée destructrice de la métaphore intacte sans la réduire explicitement à « détruits ».
theological_decisions:
- issue: Interprétation des deux formes issues de אשר
  choice: Comprendre les formes parallèles au sens de guides et de personnes guidées
  alternative: 'Comprendre : « ceux qui déclarent ce peuple heureux l’égarent, et ceux qu’ils déclarent heureux sont engloutis »'
  rationale: Le voisinage immédiat de מַתְעִים, « égarent », appuie le champ sémantique de la conduite. Toutefois, אשר peut aussi se rapporter au fait de déclarer quelqu’un heureux ; cette ambiguïté réelle est donc signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le parallélisme, l’ironie entre guider et égarer, ainsi que la métaphore d’engloutissement. Le marqueur [a] est placé immédiatement après la proposition concernée.
