review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : l’expansion sans fin de la souveraineté et de la paix, le trône davidique, l’établissement du royaume par le droit et la justice, et l’action décisive de Yahweh des armées. Toutefois, la ponctuation et l’ordre de la phrase française font paraître « sur le trône de David » comme un ajout syntaxiquement flottant après « il n’y aura pas de fin ». Une légère réorganisation rend clairement la relation exprimée par l’hébreu sans en réduire l’ambiguïté interprétative.'
  naturalness: Le registre est soutenu et accessible, mais l’attaque « À l’accroissement ... il n’y aura pas de fin, sur le trône ... » est lourde en français actuel. « Il n’y aura pas de fin à ... sur le trône ... » est plus idiomatique et garde la formulation non paraphrastique.
  terminology: « Domination », « paix », « droit », « justice », « zèle » et « Yahweh des armées » sont des choix recevables. La paire « droit et justice » distingue utilement משפט et צדקה. « Établir » représente plus directement להכין que « affermir », tout en laissant à « soutenir » la nuance de maintien de סעד.
  issues:
  - severity: medium
    issue: Construction syntaxique initiale ambiguë et peu naturelle
    rationale: Dans le texte proposé, « sur le trône de David et sur son royaume » est placé après « il n’y aura pas de fin » sans rattachement français net. Le déplacer à l’intérieur du complément de la promesse rend la portée royale de la croissance et de la paix lisible.
  - severity: low
    issue: « Affermir » est légèrement moins direct que le verbe source
    rationale: Le hiphil de כון peut signifier « établir » ou « rendre ferme ». Dans cette coordination avec סעד, « établir et soutenir » restitue clairement les deux verbes sans perdre l’idée de stabilité.
  revised_text: Il n’y aura pas de fin à l’accroissement de la domination ni à la paix sur le trône de David et sur son royaume, afin de l’établir et de le soutenir par le droit et la justice, dès maintenant et pour toujours. Le zèle de Yahweh des armées[a] accomplira cela.
