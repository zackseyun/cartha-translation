  variant: modern international French
source:
  edition: WLC
  text: ל/םרבה הַ/מִּשְׂרָ֜ה וּ/לְ/שָׁל֣וֹם אֵֽין קֵ֗ץ עַל כִּסֵּ֤א דָוִד֙ וְ/עַל מַמְלַכְתּ֔/וֹ לְ/הָכִ֤ין אֹתָ/הּ֙ וּֽ/לְ/סַעֲדָ֔/הּ בְּ/מִשְׁפָּ֖ט וּ/בִ/צְדָקָ֑ה מֵ/עַתָּה֙ וְ/עַד עוֹלָ֔ם קִנְאַ֛ת יְהוָ֥ה צְבָא֖וֹת תַּעֲשֶׂה זֹּֽאת־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/006.yaml
  text: Of the increase of the dominion and of peace there will be no end[a], on the throne of David and over his kingdom, to establish it and to uphold it with justice and with righteousness from now on and forever. The zeal of Yahweh of Armies will do this.
translation:
  language: fr
  text: Il n’y aura pas de fin à l’accroissement de la domination ni à la paix sur le trône de David et sur son royaume, afin de l’établir et de le soutenir par le droit et la justice, dès maintenant et pour toujours. Le zèle de Yahweh des armées[a] accomplira cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Yahweh des puissances célestes »; traduction traditionnelle : « l’Éternel des armées ».'
    reason: Le titre צְבָאוֹת peut désigner les armées, notamment célestes; la note indique une formulation explicative et la traduction française traditionnelle.
lexical_decisions:
- source_word: למרבה
  choice: À l’accroissement
  rationale: La préposition ל introduit ici l’idée d’une croissance continue. Cette formulation conserve la construction hébraïque sans la développer en une proposition explicative.
- source_word: הַמִּשְׂרָה
  choice: la domination
  rationale: מִשְׂרָה désigne l’exercice du pouvoir royal. « Domination » garde l’ampleur politique et dynastique du terme, sans l’assimiler à une administration moderne.
- source_word: וּלְשָׁלוֹם
  choice: et à la paix
  rationale: שָׁלוֹם évoque la paix, l’intégrité et le bien-être. « Paix » est ici le terme français le plus direct et laisse subsister cette richesse sémantique.
- source_word: אֵין קֵץ
  choice: il n’y aura pas de fin
  rationale: La proposition nominale signifie littéralement « il n’y a pas de fin »; le futur français exprime naturellement la portée prospective de la promesse.
- source_word: עַל כִּסֵּא דָוִד
  choice: sur le trône de David
  rationale: La traduction conserve directement l’image royale et la portée dynastique du texte.
- source_word: וְעַל מַמְלַכְתּוֹ
  choice: et sur son royaume
  rationale: מַמְלָכָה désigne ici le royaume davidique; le suffixe masculin est conservé sans préciser davantage son référent.
- source_word: לְהָכִין אֹתָהּ
  choice: pour l’affermir
  rationale: Le hiphil de כון signifie établir ou rendre ferme. « Affermir » exprime bien la stabilité durable du royaume.
- source_word: וּלְסַעֲדָהּ
  choice: et le soutenir
  rationale: סעד signifie soutenir ou maintenir. Le pronom français reprend naturellement « royaume », masculin en français, bien que le référent hébreu מַמְלָכָה soit féminin.
- source_word: בְּמִשְׁפָּט
  choice: par le droit
  rationale: מִשְׁפָּט renvoie ici à l’ordre juste qui gouverne les décisions et l’exercice du pouvoir. « Droit » le distingue utilement de צְדָקָה.
- source_word: וּבִצְדָקָה
  choice: et la justice
  rationale: צְדָקָה exprime la rectitude conforme à ce qui est juste. « Justice » forme en français un couple naturel avec « droit » tout en préservant la distinction des deux termes hébreux.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: dès maintenant et pour toujours
  rationale: Cette expression indique une durée qui commence dans l’horizon présent de la prophétie et se prolonge sans terme.
- source_word: קִנְאַת
  choice: Le zèle
  rationale: קִנְאָה peut désigner la jalousie ou le zèle. Appliqué ici à l’engagement de Yahweh à réaliser sa promesse, « zèle » évite les connotations trompeuses d’une jalousie mesquine.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est rendu par « Yahweh ». צְבָאוֹת est traduit concrètement par « armées », titre qui évoque la souveraineté divine sur les puissances célestes.
- source_word: תַּעֲשֶׂה זֹּאת
  choice: accomplira cela
  rationale: « Accomplir » rend idiomatiquement l’action décisive par laquelle Yahweh réalisera la promesse annoncée.
theological_decisions:
- issue: Portée davidique et messianique de la promesse royale
  choice: Conserver « sur le trône de David et sur son royaume » ainsi que la durée sans fin, sans ajouter d’identification christologique dans le corps du verset.
  alternative: Identifier explicitement le roi promis au Christ dans la traduction.
  rationale: Le texte affirme une royauté davidique durable, mais ne formule pas lui-même l’identification ultérieure. La traduction préserve ainsi sa portée et sa tension théologique sans anticiper l’interprétation canonique.
- issue: Traduction du titre יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  alternative: l’Éternel des armées; le Seigneur des armées; Yahweh des puissances célestes
  rationale: « Yahweh » représente directement le nom divin, tandis que « des armées » conserve l’image du titre hébreu. Une note signale les formulations traditionnelles ou explicatives.
translation_notes:
  register: Français international actuel, soutenu mais accessible. La structure initiale volontairement solennelle suit de près l’ordre hébreu. Les termes « droit » et « justice » maintiennent la paire מִשְׁפָּט / צְדָקָה sans les confondre.
