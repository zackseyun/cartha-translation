revisions:
- from: À l’accroissement de la domination et à la paix, il n’y aura pas de fin, sur le trône de David et sur son royaume, pour l’affermir et le soutenir par le droit et la justice, dès maintenant et pour toujours. Le zèle de Yahweh des armées[a] accomplira cela.
  to: Il n’y aura pas de fin à l’accroissement de la domination ni à la paix sur le trône de David et sur son royaume, afin de l’établir et de le soutenir par le droit et la justice, dès maintenant et pour toujours. Le zèle de Yahweh des armées[a] accomplira cela.
  rationale: 'La révision clarifie la syntaxe française tout en conservant l’ordre conceptuel et les éléments du texte hébreu : expansion de la domination, paix sans fin, cadre davidique, établissement et soutien du royaume, droit et justice, permanence, puis zèle de Yahweh. Elle n’ajoute aucune identification doctrinale du souverain promis.'
