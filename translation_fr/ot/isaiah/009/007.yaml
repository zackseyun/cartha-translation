source:
  edition: WLC
  text: דָּבָ֛ר שָׁלַ֥ח אֲדֹנָ֖/י בְּ/יַעֲקֹ֑ב וְ/נָפַ֖ל בְּ/יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/007.yaml
  text: The Lord sent a word into Jacob[a], and it fell on Israel.
translation:
  language: fr
  text: Le Seigneur a envoyé une parole contre Jacob[a], et elle est tombée sur Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le Seigneur a envoyé une parole à Jacob, et elle est tombée sur Israël. »'
    reason: La préposition בְּ peut ici marquer la destination de la parole ; dans le contexte de jugement, elle peut aussi indiquer la cible visée.
lexical_decisions:
- source_word: דָּבָר
  choice: une parole
  rationale: דָּבָר peut désigner une parole, un message ou une déclaration. « Une parole » conserve la formulation concise et la force d’une parole divine agissante.
- source_word: שָׁלַח
  choice: a envoyé
  rationale: Le parfait שָׁלַח est rendu naturellement par le passé composé, sans lui imposer une nuance aspectuelle supplémentaire.
- source_word: אֲדֹנָי
  choice: Le Seigneur
  rationale: Le texte porte le titre divin אֲדֹנָי, et non le tétragramme ; « le Seigneur » en est l’équivalent français courant et digne.
- source_word: בְּיַעֲקֹב
  choice: à Jacob
  rationale: Avec « envoyer », la préposition בְּ peut signaler la destination ou la cible. « À Jacob » reste naturel en français et évite de rendre explicite dès le premier membre la valeur hostile seulement suggérée par le contexte.
- source_word: וְנָפַל
  choice: et elle est tombée
  rationale: Le verbe נפל signifie « tomber ». Le pronom féminin reprend naturellement « parole » et maintient l’image frappante de son arrivée effective.
- source_word: בְּיִשְׂרָאֵל
  choice: sur Israël
  rationale: Avec נפל, « tomber sur » exprime naturellement l’impact ou l’atteinte, tout en conservant la métaphore hébraïque.
theological_decisions:
- issue: Traduction du titre divin אֲדֹנָי
  choice: Le Seigneur
  alternative: Seigneur
  rationale: Il s’agit d’un titre divin et non du nom יהוה. L’article français convient ici à la fonction nominale du titre.
- issue: Valeur de בְּ devant Jacob et Israël
  choice: « à Jacob » dans le premier membre et « sur Israël » dans le second
  alternative: « contre Jacob » et « contre/sur Israël »
  rationale: Le parallélisme et le contexte de jugement permettent une valeur hostile, mais la préposition elle-même reste souple. Le texte principal préserve la formulation directionnelle, tandis que la note signale explicitement la lecture punitive possible.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition des noms collectifs « Jacob » et « Israël » ainsi que l’image de la parole qui « tombe » sont conservées.
