id: ISA.9.11
reference: Isaiah 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֲרָ֣ם מִ/קֶּ֗דֶם וּ/פְלִשְׁתִּים֙ מֵֽ/אָח֔וֹר וַ/יֹּאכְל֥וּ אֶת יִשְׂרָאֵ֖ל בְּ/כָל פֶּ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/011.yaml
  text: Aram from the east and the Philistines from the west devoured Israel with full mouth[a]. For all this, his anger has not turned away[b], and his hand is still stretched out.
translation:
  language: fr
  text: Aram, à l’est, et les Philistins, à l’ouest[a], ont dévoré Israël à pleine bouche[b]. Malgré tout cela, sa colère ne s’est pas détournée, et sa main reste étendue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « par-derrière » ; en contraste avec « à l’est », l’expression désigne probablement l’ouest.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « de toute bouche », expression évoquant une dévoration vorace et complète.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: Aram
  rationale: Conserve le nom ethnogéographique hébreu plutôt que de le moderniser en « Syrie ».
- source_word: מִקֶּדֶם
  choice: à l’est
  rationale: קֶדֶם peut désigner l’avant ou l’est ; le parallélisme géographique avec מֵאָחוֹר favorise ici le sens directionnel.
- source_word: פְלִשְׁתִּים
  choice: les Philistins
  rationale: Désignation française courante de ce peuple.
- source_word: מֵאָחוֹר
  choice: à l’ouest
  rationale: Le mot signifie littéralement « par-derrière », mais, en opposition à « à l’est », il désigne vraisemblablement l’ouest.
- source_word: וַיֹּאכְלוּ
  choice: ont dévoré
  rationale: Le verbe signifie littéralement « manger » ; dans ce contexte d’attaque ennemie, « dévorer » garde la vigueur de la métaphore.
- source_word: בְּכָל פֶּה
  choice: à pleine bouche
  rationale: Cette formulation conserve l’image corporelle de l’hébreu tout en exprimant naturellement en français une consommation vorace.
- source_word: בְּכָל זֹאת
  choice: Malgré tout cela
  rationale: Le refrain souligne que les jugements déjà survenus n’ont pas mis fin à la colère divine ; cette tournure rend clairement la valeur concessive du contexte.
- source_word: לֹא שָׁב אַפּוֹ
  choice: sa colère ne s’est pas détournée
  rationale: אַף signifie littéralement « nez », puis idiomatiquement « colère » ; la formulation préserve aussi l’image du détournement.
- source_word: וְעוֹד יָדוֹ נְטוּיָה
  choice: sa main reste étendue
  rationale: Rend de près l’image prophétique d’une action divine de jugement qui se poursuit, sans expliciter davantage que le texte.
theological_decisions:
- issue: Référent des pronoms dans le refrain
  choice: Les pronoms renvoient à Dieu, sans remplacer « sa » par « celle du SEIGNEUR ».
  alternative: Nommer explicitement le SEIGNEUR ou laisser l’agent indéterminé.
  rationale: Le contexte du refrain désigne Dieu comme celui dont la colère et la main demeurent actives. Le pronom conserve toutefois la forme implicite de l’hébreu.
- issue: Portée de la main étendue
  choice: Conserver l’image sans ajouter « pour frapper » ou « contre Israël ».
  alternative: Expliciter qu’il s’agit d’une main levée pour poursuivre le jugement.
  rationale: Le contexte indique le jugement, mais l’hébreu lui-même maintient une image concise ; l’explicitation supprimerait une part de sa tension.
translation_notes:
  register: Français international actuel, digne et accessible. Le verset garde les images fortes de la dévoration, de la colère qui ne se détourne pas et de la main étendue, tout en rendant explicitement géographique l’opposition entre l’est et l’ouest.
