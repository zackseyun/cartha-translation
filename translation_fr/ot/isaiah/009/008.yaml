source:
  edition: WLC
  text: וְ/יָדְעוּ֙ הָ/עָ֣ם כֻּלּ֔/וֹ אֶפְרַ֖יִם וְ/יוֹשֵׁ֣ב שֹׁמְר֑וֹן בְּ/גַאֲוָ֛ה וּ/בְ/גֹ֥דֶל לֵבָ֖ב לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/008.yaml
  text: And all the people will know—Ephraim and the inhabitants of Samaria—who say in pride and in arrogance of heart,[a]
translation:
  language: fr
  text: 'Tout le peuple le saura, Éphraïm et les habitants de Samarie, eux qui disent avec orgueil et avec un cœur arrogant[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu, littéralement : « avec grandeur de cœur ». Ici, l’expression évoque une orgueilleuse exaltation de soi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Tout le peuple le saura
  rationale: Le qatal précédé de וְ dans ce discours prophétique se comprend naturellement avec une valeur future ou résultative. Le pronom « le » rend en français l’objet implicite de « savoir » sans le préciser davantage.
- source_word: הָעָם כֻּלּוֹ
  choice: tout le peuple
  rationale: Cette formulation française naturelle conserve la totalité exprimée par כֻּלּוֹ.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé, même s’il désigne ici par métonymie le royaume du Nord.
- source_word: וְיוֹשֵׁב שֹׁמְרוֹן
  choice: et les habitants de Samarie
  rationale: Le participe singulier a une valeur collective ; le pluriel français en restitue naturellement le sens.
- source_word: בְּגַאֲוָה
  choice: avec orgueil
  rationale: גַּאֲוָה exprime ici l’orgueil ou la hauteur ; « avec orgueil » convient au caractère de leurs paroles.
- source_word: וּבְגֹדֶל לֵבָב
  choice: et avec un cœur arrogant
  rationale: L’expression signifie littéralement « avec grandeur de cœur », mais le contexte lui donne une valeur négative d’orgueilleuse assurance. La traduction choisie communique cette force en français actuel.
- source_word: לֵאמֹר
  choice: 'eux qui disent … :'
  rationale: L’infinitif introduit les paroles rapportées au verset suivant. « Eux qui disent » rattache clairement cette attitude à Éphraïm et aux habitants de Samarie, tandis que les deux-points signalent la citation à venir.
theological_decisions: []
