source:
  edition: WLC
  text: מְנַשֶּׁ֣ה אֶת אֶפְרַ֗יִם וְ/אֶפְרַ֨יִם֙ אֶת מְנַשֶּׁ֔ה יַחְדָּ֥ו הֵ֖מָּה עַל יְהוּדָ֑ה בְּ/כָל זֹאת֙ לֹא שָׁ֣ב אַפּ֔/וֹ וְ/ע֖וֹד יָד֥/וֹ נְטוּיָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/009/020.yaml
  text: Manasseh devours Ephraim[a], and Ephraim Manasseh; together they are against Judah. For all this his anger has not turned away, and his hand is still stretched out.
translation:
  language: fr
  text: Manassé dévore Éphraïm[a], et Éphraïm dévore Manassé ; ensemble, ils se dressent contre Juda. Malgré tout cela, sa colère ne s’est pas détournée, et sa main reste étendue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Manassé Éphraïm, et Éphraïm Manassé ». L’hébreu omet le verbe ; « dévore » est repris de l’image du verset précédent.'
    reason: alternative lexicale et verbe sous-entendu
lexical_decisions:
- source_word: מְנַשֶּׁה
  choice: Manassé
  rationale: Nom traditionnel français de la tribu, conforme à l’usage biblique courant.
- source_word: אֶפְרַיִם
  choice: Éphraïm
  rationale: Nom traditionnel français de la tribu.
- source_word: אֶת
  choice: marque de l’objet direct, non rendue séparément
  rationale: Cette particule n’a pas d’équivalent lexical naturel en français.
- source_word: '[verbe sous-entendu après מְנַשֶּׁה et אֶפְרַיִם]'
  choice: dévore
  rationale: L’hébreu omet le verbe ; « dévore » reprend naturellement l’image explicite du verset précédent tout en signalant cette suppléance par une note.
- source_word: יַחְדָּו הֵמָּה
  choice: ensemble, ils
  rationale: Rend l’action commune et conserve l’effet d’insistance du pronom indépendant.
- source_word: עַל
  choice: contre
  rationale: Le contexte d’hostilité entre tribus appelle le sens adversatif.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle du nom de la tribu et du royaume.
- source_word: בְּכָל זֹאת
  choice: Malgré tout cela
  rationale: 'Rend clairement la valeur concessive du refrain : les jugements évoqués n’ont pas mis fin à la colère.'
- source_word: לֹא שָׁב אַפּוֹ
  choice: sa colère ne s’est pas détournée
  rationale: אַף désigne idiomatiquement la colère ; la formulation conserve l’image hébraïque du mouvement qui ne s’est pas inversé.
- source_word: וְעוֹד
  choice: reste
  rationale: Dans la tournure française « reste étendue », exprime la continuité du jugement.
- source_word: יָדוֹ נְטוּיָה
  choice: sa main reste étendue
  rationale: Préserve l’image corporelle et l’état continu exprimé par le participe hébreu.
theological_decisions:
- issue: Référent de « sa colère » et de « sa main »
  choice: Conserver les pronoms sans expliciter « Dieu » ou « le Seigneur ».
  alternative: Traduire « la colère du Seigneur » et « sa main ».
  rationale: Le refrain désigne clairement Dieu dans son contexte, mais l’hébreu emploie des suffixes pronominaux. Les conserver respecte la forme et la cadence sans ajouter une explicitation absente du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la vigueur poétique du conflit fratricide et le rythme solennel du refrain. Le point-virgule distingue l’hostilité mutuelle de l’alliance contre Juda.
