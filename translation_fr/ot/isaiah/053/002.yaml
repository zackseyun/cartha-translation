source:
  edition: WLC
  text: וַ/יַּ֨עַל כַּ/יּוֹנֵ֜ק לְ/פָנָ֗י/ו וְ/כַ/שֹּׁ֨רֶשׁ֙ מֵ/אֶ֣רֶץ צִיָּ֔ה לֹא תֹ֥אַר ל֖/וֹ וְ/לֹ֣א הָדָ֑ר וְ/נִרְאֵ֥/הוּ וְ/לֹֽא מַרְאֶ֖ה וְ/נֶחְמְדֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/002.yaml
  text: For he grew up before him like a young plant[a], and like a root out of dry ground. He had no form or majesty that we should look at him[c][b], and no appearance that we should desire him.
translation:
  language: fr
  text: Il a grandi devant lui[b] comme une jeune pousse[a], comme une racine qui sort d’une terre aride. Il n’avait ni prestance ni majesté pour attirer nos regards[c], ni apparence qui nous le fasse désirer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une tendre pousse ». Le mot hébreu יוֹנֵק peut désigner une pousse jeune et tendre dans cette image végétale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « devant lui ». Le pronom peut être compris comme renvoyant au SEIGNEUR, mais le texte ne le nomme pas de nouveau explicitement ici.
    reason: alternative_reading
  - marker: c
    text: 'Plus littéralement : « Il n’avait ni forme ni majesté ; nous l’avons vu, et il n’avait aucune apparence qui nous le fasse désirer. »'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל
  choice: Il a grandi
  rationale: Le verbe עלה signifie littéralement « monter » ou « surgir »; dans cette image végétale, « grandir » exprime naturellement le développement de la pousse tout en convenant à la progression du serviteur.
- source_word: כַּיּוֹנֵק
  choice: comme une jeune pousse
  rationale: יוֹנֵק peut désigner un nourrisson ou, dans un contexte botanique, une pousse tendre. Le parallèle avec la racine impose ici l’image végétale; « jeune pousse » est clair et naturel en français moderne.
- source_word: לְפָנָיו
  choice: devant lui
  rationale: La formulation conserve le pronom masculin singulier de l’hébreu sans préciser son antécédent.
- source_word: וְכַשֹּׁרֶשׁ
  choice: comme une racine
  rationale: שֹׁרֶשׁ est le terme courant pour « racine ». La traduction maintient l’image concrète du texte.
- source_word: מֵאֶרֶץ צִיָּה
  choice: sortant d’une terre aride
  rationale: אֶרֶץ désigne ici la terre ou le sol, et צִיָּה un état de sécheresse. « Terre aride » restitue clairement le milieu stérile évoqué.
- source_word: לֹא תֹאַר לוֹ
  choice: Il n’avait ni forme
  rationale: תֹאַר désigne la forme, les traits ou l’aspect extérieur. « Forme » reste proche de l’hébreu et évite d’introduire explicitement l’idée de beauté.
- source_word: וְלֹא הָדָר
  choice: ni majesté
  rationale: הָדָר peut signifier majesté, splendeur ou magnificence. « Majesté » exprime ici l’absence de grandeur extérieure impressionnante.
- source_word: וְנִרְאֵהוּ
  choice: qui attirent nos regards
  rationale: La forme hébraïque signifie littéralement « et nous l’avons vu ». Dans la construction contextuelle, elle est rendue de manière idiomatique comme l’absence de qualités visuelles propres à retenir le regard; la lecture plus littérale est signalée en note.
- source_word: וְלֹא מַרְאֶה
  choice: ni apparence
  rationale: מַרְאֶה désigne ce qui se présente à la vue, l’apparence. Ce choix ne réduit pas d’emblée le terme à la seule beauté physique.
- source_word: וְנֶחְמְדֵהוּ
  choice: qui nous donne envie de le désirer
  rationale: חמד exprime le désir ou l’attrait. Cette tournure conserve l’idée qu’aucun aspect visible ne suscitait le désir, sans préciser la nature de celui-ci.
theological_decisions:
- issue: Référent de « devant lui » (לְפָנָיו)
  choice: Conserver « devant lui » sans identifier le référent dans le texte principal.
  alternative: « devant le SEIGNEUR » ou, selon une autre compréhension proposée, « devant nous »
  rationale: Le suffixe hébreu est masculin singulier, mais son antécédent n’est pas répété explicitement dans ce verset. Le contexte conduit souvent à y voir le SEIGNEUR; la traduction maintient néanmoins l’indétermination grammaticale du texte.
- issue: Portée de l’absence de forme, de majesté et d’apparence
  choice: Employer un vocabulaire lié à l’aspect visible sans développer les conséquences sociales ou royales.
  alternative: Expliciter une absence de beauté physique, de maintien royal ou de prestige social.
  rationale: Les termes hébreux portent d’abord sur ce qui se voit. Des implications plus larges sont possibles, mais elles ne doivent pas être intégrées sans nécessité à la traduction.
- issue: Relation syntaxique de וְנִרְאֵהוּ avec les propositions voisines
  choice: L’intégrer idiomatiquement à l’idée d’une forme et d’une majesté incapables d’attirer les regards.
  alternative: 'Traduire formellement : « nous l’avons vu, mais il n’avait aucune apparence qui nous le fasse désirer »'
  rationale: La forme verbale peut se traduire directement par « nous l’avons vu ». La formulation principale produit une phrase française fluide et cohérente avec le contexte, tandis que la note préserve la lecture formellement plus proche.
translation_notes:
  register: Français international moderne, digne et accessible. L’image végétale demeure concrète; le pronom ambigu est conservé; la syntaxe visuelle difficile est rendue avec fluidité dans le texte principal et sa forme plus littérale est donnée en note.
