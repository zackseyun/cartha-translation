  rationale: 'La révision élimine une redondance française, rend plus idiomatique l’absence d’attrait visuel et conserve les éléments essentiels du texte source : les comparaisons végétales, l’antécédent non précisé de « devant lui », ainsi que la possibilité de traduire formellement « nous l’avons vu » en note. Aucune interprétation doctrinale n’est ajoutée.'
