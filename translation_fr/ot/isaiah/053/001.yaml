id: ISA.53.1
reference: Isaiah 53:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִ֥י הֶאֱמִ֖ין לִ/שְׁמֻעָתֵ֑/נוּ וּ/זְר֥וֹעַ יְהוָ֖ה עַל מִ֥י נִגְלָֽתָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/001.yaml
  text: Who has believed our report[a], and to whom has the arm of Yahweh been revealed?
translation:
  language: fr
  text: Qui a cru à ce que nous avons entendu[a] ? Et à qui le bras de Yahweh a-t-il été révélé ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à notre récit », « à notre message » ou « à ce que nous avons annoncé ». Le mot hébreu peut désigner ce qui a été entendu, rapporté ou proclamé.
    reason: Alternative lexicale reflétant l’étendue sémantique de שְׁמוּעָה.
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique; « qui » en est l’équivalent français direct et naturel.
- source_word: הֶאֱמִין
  choice: a cru
  rationale: Le hiphil de אמן signifie ici « croire » ou « faire confiance ». Le passé composé convient à la portée rhétorique du verset.
- source_word: לִשְׁמֻעָתֵנוּ
  choice: à ce que nous avons entendu
  rationale: שְׁמוּעָה peut désigner ce qui est entendu, une nouvelle, un récit ou un message. Cette formulation conserve le lien avec l’audition et l’ambiguïté du terme hébreu; la préposition ל est rendue naturellement avec « croire à ».
- source_word: וּזְרוֹעַ
  choice: Et ... le bras
  rationale: זְרוֹעַ signifie littéralement « bras ». La métaphore biblique de la puissance agissante de Dieu est conservée plutôt qu’explicitée.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin afin de le distinguer d’un titre tel que « le Seigneur ».
- source_word: עַל מִי
  choice: à qui
  rationale: Avec le passif de גלה, « à qui » exprime idiomatiquement en français la personne à laquelle cette révélation est accordée.
- source_word: נִגְלָתָה
  choice: a-t-il été révélé
  rationale: Le niphal de גלה est passif et signifie « être révélé » ou « être dévoilé ». L’inversion interrogative donne une formulation française digne et naturelle.
theological_decisions:
- issue: Portée métaphorique du « bras de Yahweh »
  choice: Conserver « le bras de Yahweh » dans le texte principal
  alternative: la puissance de Yahweh
  rationale: Cette image biblique évoque la puissance divine manifestée, notamment dans le salut et le jugement. La conserver maintient ses résonances intertextuelles sans imposer une interprétation réductrice.
- issue: Sens de שְׁמוּעָה
  choice: ce que nous avons entendu
  alternative: notre récit / notre message / ce que nous avons annoncé
  rationale: Le nom hébreu couvre ce qui est entendu aussi bien que la nouvelle ou le message transmis. Le texte principal préserve ce lien lexical et la note signale les lectures contextuelles possibles.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La structure en deux questions parallèles et la métaphore corporelle de l’hébreu sont conservées.
