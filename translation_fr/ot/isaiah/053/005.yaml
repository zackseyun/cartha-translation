source:
  edition: WLC
  text: וְ/הוּא֙ מְחֹלָ֣ל מִ/פְּשָׁעֵ֔/נוּ מְדֻכָּ֖א מֵ/עֲוֺנֹתֵ֑י/נוּ מוּסַ֤ר שְׁלוֹמֵ֨/נוּ֙ עָלָ֔י/ו וּ/בַ/חֲבֻרָת֖/וֹ נִרְפָּא לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/005.yaml
  text: But he was pierced because of our transgressions[a]; he was crushed because of our iniquities; the chastisement for our peace was upon him[c][b], and by his wound we are healed.
translation:
  language: fr
  text: Mais lui, il était transpercé à cause de nos révoltes[a], écrasé à cause de nos fautes. Le châtiment qui nous apporte la paix[b] était sur lui, et par sa blessure[c], nous sommes guéris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « blessé ». Le terme hébreu peut désigner le fait d’être blessé ou transpercé.
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « paix » peut aussi désigner le bien-être, l’intégrité ou la pleine restauration.
    reason: lexical_alternative
  - marker: c
    text: Ou « par la marque de ses coups » ou « par sa meurtrissure ». Le nom hébreu est au singulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Mais lui
  rationale: Le ו prend ici une valeur adversative par rapport à l’appréciation erronée formulée au verset précédent; la dislocation « lui » souligne naturellement ce contraste en français.
- source_word: מְחֹלָל
  choice: transpercé
  rationale: Dans ce contexte de souffrance physique et en parallèle avec « écrasé », le participe passif de חלל désigne très probablement une blessure violente, possiblement perforante. « Transpercé » conserve la force concrète de l’image; « blessé » reste possible.
- source_word: מִפְּשָׁעֵינוּ
  choice: à cause de nos révoltes
  rationale: La préposition מִן exprime ici la cause. « Révoltes » rend la dimension de rupture délibérée contenue dans פשע et la distingue de עון.
- source_word: מְדֻכָּא
  choice: écrasé
  rationale: Ce terme exprime une atteinte ou une oppression extrême. « Écrasé » en restitue l’intensité mieux que « meurtri ».
- source_word: מֵעֲוֺנֹתֵינוּ
  choice: à cause de nos fautes
  rationale: La préposition est de nouveau causale. « Fautes » exprime la culpabilité morale de עון dans un français naturel, sans le confondre avec les « révoltes » du membre précédent.
- source_word: מוּסַר
  choice: châtiment
  rationale: Dans ce contexte de souffrance liée aux fautes d’autrui, מוּסָר désigne une correction pénible ou punitive. « Châtiment » en conserve la gravité sans développer une théorie doctrinale au-delà du texte.
- source_word: שְׁלוֹמֵנוּ
  choice: qui nous apporte la paix
  rationale: 'Cette formulation rend la relation condensée « châtiment de notre paix » en indiquant que ce châtiment procure la paix aux locuteurs. « Paix » garde ouverte la portée étendue de שָׁלוֹם: bien-être, intégrité et restauration.'
- source_word: עָלָיו
  choice: était sur lui
  rationale: La traduction conserve l’image hébraïque du châtiment posé sur le serviteur, sans préciser davantage la mécanique de cette relation.
- source_word: וּבַחֲבֻרָתוֹ
  choice: par sa blessure
  rationale: Le nom est singulier et désigne la marque ou la plaie produite par un coup. « Blessure » est actuel et naturel tout en maintenant le singulier.
- source_word: נִרְפָּא לָנוּ
  choice: nous sommes guéris
  rationale: Malgré la construction hébraïque inhabituelle avec une forme verbale au singulier et לָנוּ, le sens idiomatique contextuel est qu’une guérison advient aux locuteurs. Cette formulation française est claire et préserve l’image de la guérison.
theological_decisions:
- issue: Rapport entre la souffrance du serviteur et les péchés des autres
  choice: Employer deux fois « à cause de » et présenter le châtiment porteur de paix comme étant sur lui.
  alternative: Employer « pour », ou expliciter une théorie pénale et substitutive complète.
  rationale: L’hébreu relie clairement la souffrance du serviteur aux révoltes et aux fautes du groupe, avec une dimension vicariante. La traduction conserve ce lien sans imposer un mécanisme doctrinal plus détaillé que le verset.
- issue: Portée de la paix et de la guérison
  choice: Conserver les termes larges « paix » et « guéris ».
  alternative: Limiter la guérison au domaine physique, au pardon spirituel ou à la prospérité matérielle.
  rationale: שָׁלוֹם et רפא ont ici une portée restauratrice qui ne doit pas être arbitrairement réduite à une seule dimension.
- issue: Valeur de la formule מוּסַר שְׁלוֹמֵנוּ
  choice: « Le châtiment qui nous apporte la paix »
  alternative: « Le châtiment de notre paix » ou « le châtiment nécessaire à notre paix ».
  rationale: Le rapport exact entre les deux noms est condensé en hébreu. La formulation choisie exprime le résultat bénéfique pour « nous » sans ajouter l’idée explicite de nécessité, absente de la forme hébraïque.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, de même que les images concrètes de violence, de paix et de guérison. La phrase explicite légèrement le rapport nominal très condensé de l’hébreu afin de rester naturelle en français, sans réduire la portée théologique du texte.
