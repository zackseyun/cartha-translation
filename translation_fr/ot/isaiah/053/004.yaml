revisions:
- from: Oui, ce sont nos maladies qu’il portait, et nos douleurs dont il s’était chargé[a]. Pourtant, nous le considérions comme frappé, atteint par Dieu[b] et humilié.
  to: En réalité, il a porté nos maladies et s’est chargé de nos douleurs[a] ; pourtant, nous le considérions comme frappé, atteint par Dieu[b] et affligé.
  rationale: La révision aligne les verbes français sur l’aspect accompli des parfaits hébreux, remplace « humilié » par « affligé » dans le contexte immédiat de souffrance, et rend l’emphase corrective initiale de façon plus idiomatique. Les alternatives lexicales et l’ambiguïté limitée du second membre sont conservées dans les notes.
