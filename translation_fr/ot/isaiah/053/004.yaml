  text: אָכֵ֤ן חֳלָיֵ֨/נוּ֙ ה֣וּא נָשָׂ֔א וּ/מַכְאֹבֵ֖י/נוּ סְבָלָ֑/ם וַ/אֲנַ֣חְנוּ חֲשַׁבְנֻ֔/הוּ נָג֛וּעַ מֻכֵּ֥ה אֱלֹהִ֖ים וּ/מְעֻנֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/004.yaml
  text: Surely he has borne our sicknesses and carried our pains[a]; yet we considered him stricken, struck by God[b], and afflicted.
translation:
  language: fr
  text: En réalité, il a porté nos maladies et s’est chargé de nos douleurs[a] ; pourtant, nous le considérions comme frappé, atteint par Dieu[b] et affligé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nos souffrances » et « nos peines ». Plus littéralement, l’hébreu parle de maladies et de douleurs.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « frappé par Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Oui, ce sont
  rationale: Introduit avec emphase une rectification de la perception exprimée ensuite; cette tournure française marque naturellement l’insistance et le contraste.
- source_word: חֳלָיֵנוּ
  choice: nos maladies
  rationale: Le nom désigne d’abord les maladies ou infirmités physiques, plutôt que le seul chagrin.
- source_word: נָשָׂא
  choice: portait
  rationale: Exprime le fait de prendre sur soi et de porter un fardeau; l’imparfait convient au tableau rétrospectif du poème.
- source_word: וּמַכְאֹבֵינוּ
  choice: nos douleurs
  rationale: Rend directement un terme désignant la douleur, souvent physique, tout en laissant possible une portée plus large.
- source_word: סְבָלָם
  choice: dont il s’était chargé
  rationale: Le verbe évoque le transport d’une charge; la formulation distingue ce second verbe de נָשָׂא sans perdre le parallélisme.
- source_word: וַאֲנַחְנוּ
  choice: Pourtant, nous
  rationale: La coordination prend ici une valeur adversative, opposant la réalité de ce qu’il portait au jugement porté sur lui.
- source_word: חֲשַׁבְנֻהוּ
  choice: nous le considérions comme
  rationale: Rend le fait de tenir ou compter quelqu’un pour tel, dans un français moderne et naturel.
- source_word: נָגוּעַ
  choice: frappé
  rationale: Conserve l’idée d’un être touché par un coup ou un fléau sans préciser indûment la nature de l’atteinte.
- source_word: מֻכֵּה אֱלֹהִים
  choice: atteint par Dieu
  rationale: Maintient explicitement l’agent divin tout en évitant de répéter immédiatement « frappé » en français.
- source_word: וּמְעֻנֶּה
  choice: et humilié
  rationale: Le participe peut désigner celui qui est abaissé, humilié ou affligé; « humilié » préserve ici une nuance distincte des deux termes précédents.
theological_decisions:
- issue: 'Portée des fardeaux du serviteur: maladies physiques ou souffrances généralisées'
  choice: Langage concret des maladies et des douleurs dans le texte principal
  alternative: « nos souffrances » et « nos peines »
  rationale: Les substantifs hébreux désignent le plus naturellement la maladie et la douleur. Le texte ne doit toutefois pas empêcher leur portée poétique plus large, signalée en note.
- issue: Agence divine dans מֻכֵּה אֱלֹהִים
  choice: « atteint par Dieu »
  alternative: « frappé par Dieu »
  rationale: La syntaxe attribue clairement l’atteinte à Dieu. La traduction conserve cette attribution comme élément de la manière dont « nous » interprétions l’état du serviteur, sans affirmer davantage que le verset.
- issue: Sens de וּמְעֻנֶּה
  choice: « humilié »
  alternative: « affligé »
  rationale: Les deux sens sont possibles. « Humilié » rend la notion d’abaissement et évite une accumulation de quasi-synonymes, tout en préservant la tension lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme poétique repose sur deux membres parallèles, puis sur le contraste introduit par « Pourtant ». Les notes conservent les principales possibilités lexicales sans résoudre la tension entre la réalité du rôle du serviteur et l’interprétation qu’en donnaient les témoins.
