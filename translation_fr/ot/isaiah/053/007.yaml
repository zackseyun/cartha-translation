  text: נִגַּ֨שׂ וְ/ה֣וּא נַעֲנֶה֮ וְ/לֹ֣א יִפְתַּח פִּי/ו֒ כַּ/שֶּׂה֙ לַ/טֶּ֣בַח יוּבָ֔ל וּ/כְ/רָחֵ֕ל לִ/פְנֵ֥י גֹזְזֶ֖י/הָ נֶאֱלָ֑מָה וְ/לֹ֥א יִפְתַּ֖ח פִּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/007.yaml
  text: He was oppressed[a], and he was afflicted, yet he did not open his mouth; like a lamb led to the slaughter, and like a ewe silent before her shearers, so he did not open his mouth.
translation:
  language: fr
  text: Il a été opprimé[a] et humilié, mais il n’a pas ouvert la bouche. Comme un agneau qu’on mène à l’abattoir, comme une brebis qui reste muette devant ceux qui la tondent, il n’a pas ouvert la bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il a été opprimé, mais il s’est humilié. » Le début du verset est difficile en hébreu; le second verbe peut aussi être compris dans un sens réfléchi, celui de s’humilier ou de se soumettre.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִגַּשׂ
  choice: a été opprimé
  rationale: Le nifal exprime ici le fait de subir une contrainte ou un traitement oppressif. « A été opprimé » est naturel en français moderne et convient au contexte de souffrance injuste.
- source_word: נַעֲנֶה
  choice: humilié
  rationale: Dans ce contexte, le verbe décrit l’abaissement ou l’affliction subie, et non une réponse verbale. « Humilié » conserve la dimension d’abaissement tout en laissant la note signaler la possibilité d’un sens réfléchi.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: mais il n’a pas ouvert la bouche
  rationale: « Mais » rend naturellement la valeur concessive du waw après l’oppression et l’humiliation. L’expression littérale « ouvrir la bouche » est claire et sa répétition structure le verset.
- source_word: כַּשֶּׂה
  choice: comme un agneau
  rationale: שֶׂה peut désigner une tête de petit bétail, mais « agneau » exprime naturellement la vulnérabilité de l’animal conduit à l’abattage.
- source_word: לַטֶּבַח יוּבָל
  choice: qu’on mène à l’abattoir
  rationale: Le hofal indique un déplacement imposé par autrui. La tournure active indéfinie « qu’on mène » est idiomatique et conserve le caractère passif de l’animal; « à l’abattoir » rend naturellement la destination.
- source_word: וּכְרָחֵל
  choice: comme une brebis
  rationale: רָחֵל désigne précisément une brebis; le choix préserve le genre de l’animal et prépare les suffixes féminins de la comparaison.
- source_word: לִפְנֵי גֹזְזֶיהָ
  choice: devant ceux qui la tondent
  rationale: Cette formulation est plus courante et immédiatement compréhensible en français moderne que « devant ses tondeurs », tout en conservant le sens exact.
- source_word: נֶאֱלָמָה
  choice: qui reste muette
  rationale: Le verbe décrit le silence complet de la brebis. « Reste muette » restitue cet état dans une proposition française naturelle, sans suggérer nécessairement une incapacité physique permanente.
- source_word: וְלֹא יִפְתַּח פִּיו
  choice: il n’a pas ouvert la bouche
  rationale: La répétition finale est conservée sans connecteur explicatif ajouté, afin de reproduire sobrement l’insistance rhétorique de l’hébreu.
theological_decisions:
- issue: Degré de précision messianique dans la traduction
  choice: Traduire le sens immédiat du texte hébreu sans introduire explicitement une identification christologique.
  alternative: Employer une formulation davantage modelée sur les citations néotestamentaires ou nommer le Christ.
  rationale: Le verset présente le serviteur souffrant au moyen de comparaisons et d’une répétition. La traduction doit préserver cette présentation et laisser son identification théologique au contexte canonique plutôt que de l’insérer dans le texte.
- issue: Valeur de נַעֲנֶה
  choice: Comprendre le verbe comme décrivant une humiliation subie, tout en signalant l’interprétation réfléchie en note.
  alternative: « Il s’est humilié » ou « il s’est soumis ».
  rationale: La forme et le contexte permettent une lecture passive ou réfléchie. Le corps du texte suit le parallélisme avec l’oppression, tandis que la note préserve l’ambiguïté réelle sans trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme en trois mouvements et la répétition finale sont conservés. « Abattoir » et « ceux qui la tondent » privilégient une expression courante sans affaiblir l’image poétique.
