id: ISA.53.10
reference: Isaiah 53:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וַ/יהוָ֞ה חָפֵ֤ץ דַּכְּא/וֹ֙ הֶֽחֱלִ֔י אִם תָּשִׂ֤ים אָשָׁם֙ נַפְשׁ֔/וֹ יִרְאֶ֥ה זֶ֖רַע יַאֲרִ֣יךְ יָמִ֑ים וְ/חֵ֥פֶץ יְהוָ֖ה בְּ/יָד֥/וֹ יִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/010.yaml
  text: Yet it pleased Yahweh to crush him[a]; he made him sick. If his life makes a guilt offering, he will see offspring, he will prolong his days[e][d][c][b], and the pleasure of Yahweh will prosper in his hand.
translation:
  language: fr
  text: Pourtant[a], il a plu à Yahweh de l’écraser ; il l’a rendu malade[b]. Si sa vie est offerte en offrande de réparation[c][d], il verra une descendance, il prolongera ses jours, et la volonté de Yahweh s’accomplira par sa main[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Et Yahweh » ou « Mais Yahweh » ; la conjonction hébraïque peut se traduire de plusieurs manières selon l’enchaînement du discours.
    reason: lexical_alternative
  - marker: b
    text: Ou « il l’a affligé » ou « il l’a fait souffrir ».
    reason: lexical_alternative
  - marker: c
    text: Ou « Si sa vie se met elle-même en offrande de réparation » ou « Si tu fais de sa vie une offrande de réparation ». L’hébreu de cette proposition est difficile, notamment quant au sujet du verbe « faire » ou « placer ».
    reason: alternative_reading
  - marker: d
    text: L’« offrande de réparation » est le sacrifice prescrit dans la Torah en rapport avec la culpabilité et la réparation du tort commis.
    reason: cultural_note
  - marker: e
    text: Ou « et le plaisir — ou le dessein — de Yahweh réussira par sa main ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Pourtant, … Yahweh
  rationale: La conjonction וַ peut simplement signifier « et », mais le contexte permet une valeur contrastive. « Pourtant » exprime ce contraste sans effacer les autres possibilités, signalées en note. Le nom divin est translittéré « Yahweh ».
- source_word: חָפֵץ
  choice: il a plu
  rationale: Le verbe peut exprimer le plaisir, le désir ou la volonté. « Il a plu à Yahweh de… » conserve la force difficile du texte et son lien lexical avec חֵפֶץ à la fin du verset, sans réduire l’action divine à une simple permission.
- source_word: דַּכְּאוֹ
  choice: de l’écraser
  rationale: Le verbe exprime une action violente et sévère ; « écraser » rend mieux cette intensité que « meurtrir ».
- source_word: הֶחֱלִי
  choice: il l’a rendu malade
  rationale: La forme causative de חלה signifie concrètement « rendre malade » et peut, dans un sens plus large, évoquer l’affliction ou la souffrance.
- source_word: אִם
  choice: Si
  rationale: La particule introduit le plus naturellement une condition, tout en pouvant recevoir ici une nuance temporelle selon l’analyse de la proposition.
- source_word: תָּשִׂים … נַפְשׁוֹ
  choice: sa vie se fait
  rationale: La forme verbale féminine peut s’accorder avec נַפְשׁוֹ, « sa vie », pris comme sujet. La tournure pronominale française garde ce sujet et le mouvement d’offrande, tout en évitant l’idée erronée que le serviteur accomplirait lui-même un rite distinct. L’ambiguïté syntaxique est explicitée en note.
- source_word: אָשָׁם
  choice: offrande de réparation
  rationale: Le mot désigne dans la Torah une offrande sacrificielle liée à la culpabilité et à la réparation. Cette formulation française rend à la fois sa dimension cultuelle et réparatrice.
- source_word: יִרְאֶה זֶרַע
  choice: il verra une descendance
  rationale: זֶרַע peut désigner la semence, la postérité ou les descendants. « Une descendance » est naturel en français et ne précise pas au-delà du texte la nature de ce lien.
- source_word: יַאֲרִיךְ יָמִים
  choice: il prolongera ses jours
  rationale: La traduction conserve l’idiome hébreu de la longévité tout en restant intelligible en français moderne.
- source_word: וְחֵפֶץ יְהוָה
  choice: et ce qui plaît à Yahweh
  rationale: Cette formulation naturelle conserve le lien lexical avec חָפֵץ au début du verset. Le nom חֵפֶץ peut également désigner la volonté ou le dessein.
- source_word: בְּיָדוֹ יִצְלָח
  choice: réussira par sa main
  rationale: La préposition peut exprimer la sphère ou l’intermédiaire. « Par sa main » garde l’image hébraïque et communique l’idée d’agence ; יצלח exprime ici la réussite ou l’accomplissement favorable.
theological_decisions:
- issue: L’action divine dans la souffrance du serviteur
  choice: Le texte attribue directement à Yahweh l’action de l’écraser et de le rendre malade.
  alternative: Yahweh a permis qu’il soit écrasé ou affligé.
  rationale: Les verbes hébreux présentent Yahweh comme l’agent direct. Transformer cette action en simple permission atténuerait une tension théologique réellement présente dans le texte. La traduction ne définit toutefois pas ce plaisir comme une joie cruelle.
- issue: Le sujet de la proposition concernant l’offrande de réparation
  choice: « Si sa vie se fait offrande de réparation » prend « sa vie » comme sujet grammatical.
  alternative: « Si tu fais de sa vie une offrande de réparation » ou « Quand sa vie sera offerte en offrande de réparation ».
  rationale: 'La syntaxe hébraïque est difficile : תָּשִׂים peut être analysé comme une troisième personne féminine accordée avec « sa vie », mais la forme consonantique permet aussi une lecture à la deuxième personne masculine. La formulation principale suit une analyse défendable sans dissimuler les autres.'
translation_notes:
  register: Français international actuel, digne et accessible. La formulation conserve les images fortes de l’hébreu (« écraser », « prolonger ses jours », « par sa main ») ainsi que l’ambiguïté de la proposition sacrificielle. « Offrande de réparation » est préféré à « sacrifice de culpabilité », moins idiomatique, tout en explicitant en note le cadre cultuel.
