revisions:
- from: Pourtant[a], il a plu à Yahweh de l’écraser ; il l’a rendu malade[b]. Si sa vie se fait offrande de réparation[c][d], il verra une descendance, il prolongera ses jours, et ce qui plaît à Yahweh réussira par sa main[e].
  to: Pourtant[a], il a plu à Yahweh de l’écraser ; il l’a rendu malade[b]. Si sa vie est offerte en offrande de réparation[c][d], il verra une descendance, il prolongera ses jours, et la volonté de Yahweh s’accomplira par sa main[e].
  rationale: La révision remplace une tournure réflexive française artificielle par une passive naturelle pour la clause dont la syntaxe hébraïque est disputée, sans trancher les autres possibilités, explicitement conservées en note. Elle rend aussi le dernier membre plus idiomatique en français, sans atténuer ni l’agence divine ni l’image de l’action « par sa main ».
