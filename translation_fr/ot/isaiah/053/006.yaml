id: ISA.53.6
reference: Isaiah 53:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֻּלָּ֨/נוּ֙ כַּ/צֹּ֣אן תָּעִ֔ינוּ אִ֥ישׁ לְ/דַרְכּ֖/וֹ פָּנִ֑ינוּ וַֽ/יהוָה֙ הִפְגִּ֣יעַ בּ֔/וֹ אֵ֖ת עֲוֺ֥ן כֻּלָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/006.yaml
  text: All of us[a], like sheep, have gone astray; each of us has turned to his own way[c][b]; and Yahweh has laid on him the iniquity of us all.
translation:
  language: fr
  text: Nous tous, comme des brebis, nous nous sommes égarés ; chacun de nous s’est tourné vers son propre chemin, et Yahvé a fait retomber sur lui la faute[a] de nous tous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut aussi désigner la culpabilité ou les conséquences, notamment le châtiment, qui découlent de la faute.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, le verbe peut évoquer le fait que Yahvé a fait atteindre, rencontrer ou converger sur lui la faute de nous tous.
    reason: alternative_reading
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: Nous tous / de nous tous
  rationale: La reprise au début et à la fin conserve l’insistance et l’encadrement du texte hébreu.
- source_word: כַּצֹּאן
  choice: comme des brebis
  rationale: Cette formulation française naturelle conserve l’image collective du troupeau et convient au contexte d’égarement.
- source_word: תָּעִינוּ
  choice: nous nous sommes égarés
  rationale: Le verbe exprime l’action de quitter le bon chemin ; « s’égarer » maintient à la fois l’image pastorale et sa portée morale.
- source_word: אִישׁ לְדַרְכּוֹ פָּנִינוּ
  choice: chacun de nous s’est tourné vers son propre chemin
  rationale: « Chacun de nous » rend la valeur distributive de אִישׁ dans un contexte explicitement universel, tandis que « son propre chemin » conserve l’individualisation du mouvement.
- source_word: וַיהוָה
  choice: et Yahvé
  rationale: Le nom divin est rendu comme un nom propre plutôt que remplacé par un titre ; « Yahvé » est sa forme française courante.
- source_word: הִפְגִּיעַ בּוֹ
  choice: a fait retomber sur lui
  rationale: La tournure exprime naturellement en français le causatif hébreu, selon lequel Yahvé fait atteindre ou rencontrer le serviteur par la faute commune, sans détailler davantage le mécanisme.
- source_word: עֲוֺן
  choice: la faute
  rationale: « Faute » est courant, digne et suffisamment large pour désigner ici la perversité commise, tout en laissant une note signaler les nuances de culpabilité et de conséquence pénale.
theological_decisions:
- issue: Portée du fait que le serviteur porte עָוֹן
  choice: Yahvé a fait retomber sur lui la faute de nous tous
  alternative: Yahvé a fait retomber sur lui le châtiment dû à nos fautes
  rationale: Le texte affirme que la faute commune atteint le serviteur par l’action de Yahvé, mais il ne développe pas ici une formulation doctrinale complète. La traduction conserve donc la force vicariante du passage sans réduire עָוֹן au seul châtiment.
- issue: Valeur universelle du masculin distributif אִישׁ
  choice: chacun de nous
  alternative: chacun
  rationale: Dans le cadre formé par « nous tous » et « de nous tous », אִישׁ distribue l’action entre tous les membres du groupe. « Chacun de nous » exprime directement cette fonction en français sans laisser croire que seuls les hommes sont concernés.
- issue: Ambiguïté de הִפְגִּיעַ et de עָוֹן
  choice: Conserver une formulation large dans le texte et préciser les nuances en notes
  alternative: Expliciter dans le texte que Yahvé a infligé au serviteur le châtiment de tous
  rationale: L’hébreu permet les idées de faire rencontrer, atteindre ou tomber, et עָוֹן peut désigner la faute, la culpabilité ou sa conséquence. Une explicitation unique résoudrait indûment cette tension.
translation_notes:
  register: Français international actuel, clair et digne. La reprise « Nous tous… de nous tous » conserve la structure emphatique de l’hébreu. « Chacun de nous » est idiomatique et rend la distribution individuelle au sein du groupe universel. Les notes maintiennent les ambiguïtés lexicales sans alourdir le verset.
