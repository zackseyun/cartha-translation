  text: וַ/יִּתֵּ֤ן אֶת רְשָׁעִים֙ קִבְר֔/וֹ וְ/אֶת עָשִׁ֖יר בְּ/מֹתָ֑י/ו עַ֚ל לֹא חָמָ֣ס עָשָׂ֔ה וְ/לֹ֥א מִרְמָ֖ה בְּ/פִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/009.yaml
  text: And they assigned his grave with the wicked[a], and with a rich man in his deaths, although he had done no violence[b], and no deceit was in his mouth.
translation:
  language: fr
  text: On plaça[b] sa tombe parmi les méchants, et avec un homme riche dans ses morts[a], bien qu’il n’ait commis aucune violence et qu’aucune tromperie n’ait été dans sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans ses morts ». Beaucoup comprennent cette expression hébraïque inhabituelle au sens de « dans sa mort » ou « au moment de sa mort ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Il plaça » ou « Sa tombe fut placée ». Le verbe hébreu signifie littéralement « donna, mit, plaça », et son sujet n’est pas explicitement identifié.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: On plaça
  rationale: Le verbe נתן signifie littéralement « donner, mettre, placer ». La tournure française avec « on » rend ici le sens impersonnel sans attribuer l’action à un sujet que l’hébreu ne nomme pas explicitement.
- source_word: רְשָׁעִים
  choice: les méchants
  rationale: Ce substantif pluriel désigne des personnes moralement coupables. « Les méchants » est direct, courant et conserve la catégorie morale du texte.
- source_word: קִבְרוֹ
  choice: sa tombe
  rationale: קבר désigne une tombe ou un lieu de sépulture. « Sa tombe » est l’équivalent français le plus direct.
- source_word: עָשִׁיר
  choice: un homme riche
  rationale: L’adjectif substantivé est au singulier et renvoie naturellement à une personne riche. L’ajout de « homme » rend cette valeur personnelle explicite en français sans préciser davantage son identité.
- source_word: בְּמֹתָיו
  choice: dans ses morts
  rationale: La forme hébraïque est morphologiquement plurielle, littéralement « dans ses morts ». Malgré son étrangeté en français, le pluriel est maintenu dans le texte afin de ne pas effacer une particularité réelle de la source; l’interprétation idiomatique au singulier est donnée en note.
- source_word: עַל
  choice: bien que
  rationale: 'Dans ce contexte, עַל introduit une circonstance à valeur concessive : le traitement subi contraste avec l’absence de violence et de tromperie chez le serviteur.'
- source_word: חָמָס
  choice: violence
  rationale: חמס désigne couramment la violence ou le tort violent. « Violence » en conserve le sens principal et le poids moral.
- source_word: מִרְמָה
  choice: tromperie
  rationale: מִרְמָה désigne la tromperie, la fraude ou la fausseté. « Tromperie » est clair en français moderne et convient au domaine de la parole.
- source_word: בְּפִיו
  choice: dans sa bouche
  rationale: La traduction conserve l’image hébraïque de ce qui est présent dans la bouche, sans ajouter l’idée de découverte exprimée par « trouvée ».
theological_decisions:
- issue: Le pluriel inhabituel בְּמֹתָיו dans un passage du chant du serviteur à forte portée messianique
  choice: Maintenir « dans ses morts » dans le texte principal et signaler en note l’interprétation idiomatique au singulier.
  alternative: « dans sa mort » ou « au moment de sa mort »
  rationale: Le pluriel appartient à la forme transmise du texte hébreu. Le conserver évite d’harmoniser silencieusement ce détail avec une lecture théologique ultérieure, tout en permettant au lecteur de connaître l’interprétation idiomatique courante.
- issue: Le sujet non exprimé de וַיִּתֵּן
  choice: Employer le pronom impersonnel « on » dans « On plaça ».
  alternative: « Il plaça » ou « Sa tombe fut placée »
  rationale: La forme verbale est une troisième personne masculine singulière, mais son référent n’est pas explicite dans la proposition. La tournure impersonnelle française préserve cette indétermination sans identifier le sujet à Dieu, au serviteur ou à un groupe humain.
translation_notes:
  register: Français international moderne, digne et lisible. La syntaxe reste volontairement proche du parallélisme hébreu. « Dans ses morts » est inhabituel en français, mais cette étrangeté est conservée pour représenter le pluriel du texte source et expliquée en note.
