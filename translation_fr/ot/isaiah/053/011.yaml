language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מֵ/עֲמַ֤ל נַפְשׁ/וֹ֙ יִרְאֶ֣ה יִשְׂבָּ֔ע בְּ/דַעְתּ֗/וֹ יַצְדִּ֥יק צַדִּ֛יק עַבְדִּ֖/י לָֽ/רַבִּ֑ים וַ/עֲוֺנֹתָ֖/ם ה֥וּא יִסְבֹּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/011.yaml
  text: From the anguish of his soul he will see and be satisfied[a]; by his knowledge my righteous servant will justify many[b], and he will bear their iniquities.
translation:
  language: fr
  text: Au terme du tourment de son âme, il verra[a] et sera comblé. Par sa connaissance[b], mon serviteur juste justifiera un grand nombre, et lui-même portera leurs iniquités.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains témoins anciens lisent : « il verra la lumière et sera comblé ». Le texte massorétique dit simplement : « il verra et sera comblé ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Par la connaissance qu’ils ont de lui », si l’expression désigne la connaissance du serviteur par les autres plutôt que sa propre connaissance.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֲמַל נַפְשׁוֹ
  choice: Après les tourments de son âme
  rationale: עָמָל évoque ici une souffrance pénible plutôt qu’un simple travail. « Après » exprime naturellement en français le point de départ marqué par מִן et le passage de la souffrance à son résultat, tandis que « de son âme » conserve l’image hébraïque.
- source_word: יִרְאֶה יִשְׂבָּע
  choice: il verra et sera comblé
  rationale: Le texte massorétique ne précise pas ce qu’il verra. « Être comblé » rend le sens de satisfaction de שׂבע dans un français naturel, sans lui donner ici le sens physique de manger à satiété.
- source_word: בְּדַעְתּוֹ
  choice: Par sa connaissance
  rationale: Le suffixe renvoie le plus directement à la connaissance du serviteur lui-même et la préposition peut avoir une valeur instrumentale. La formulation française conserve toutefois la concision et l’ambiguïté de l’expression.
- source_word: יַצְדִּיק
  choice: justifiera
  rationale: Le hiphil de צדק signifie rendre juste, tenir pour juste ou déclarer juste. « Justifier » est concis et laisse ouverte la nuance exacte du causatif.
- source_word: צַדִּיק עַבְדִּי
  choice: mon serviteur juste
  rationale: Cette formulation naturelle conserve צַדִּיק comme qualification du serviteur sans ajouter d’explication christologique ou doctrinale.
- source_word: לָרַבִּים
  choice: beaucoup de gens
  rationale: Cette expression rend clairement רַבִּים en français courant sans l’élargir à « tous ». Elle évite aussi l’ambiguïté moderne de « plusieurs », qui pourrait suggérer un petit nombre.
- source_word: וַעֲוֺנֹתָם
  choice: leurs fautes
  rationale: עָוֹן désigne les fautes, leur culpabilité ou leur conséquence. « Fautes » est actuel et suffisamment fort dans ce contexte de responsabilité morale.
- source_word: הוּא יִסְבֹּל
  choice: lui-même portera
  rationale: Le pronom indépendant הוּא met le serviteur en relief. « Lui-même » restitue cette insistance, et « portera » exprime directement le fait d’assumer le poids des fautes.
theological_decisions:
- issue: Sens de בְּדַעְתּוֹ
  choice: « Par sa connaissance », compris d’abord comme la connaissance propre au serviteur
  alternative: « Par la connaissance qu’ils auront de lui », compris comme la connaissance du serviteur par les autres
  rationale: La première lecture suit plus immédiatement le suffixe hébreu, mais la construction demeure susceptible d’une lecture objective. L’autre possibilité est donc signalée sans être introduite dans le corps du texte.
- issue: Forme textuelle après יִרְאֶה
  choice: « il verra », sans complément exprimé
  alternative: « il verra la lumière », d’après certains témoins anciens
  rationale: Le texte massorétique fourni ne contient pas « lumière ». La traduction principale suit donc ce texte tout en documentant une variante ancienne importante.
- issue: Portée de לָרַבִּים
  choice: « beaucoup de gens »
  alternative: « la multitude »
  rationale: Le texte dit רַבִּים et ne doit pas être élargi à « tous » par harmonisation théologique. « Beaucoup de gens » communique clairement la pluralité indéfinie en français moderne.
- issue: Nuance causative de יַצְדִּיק
  choice: « justifiera »
  alternative: « déclarera justes » ou « rendra justes »
  rationale: Le verbe français « justifier » préserve mieux la tension entre une déclaration de justice et l’action de rendre juste, sans imposer l’une de ces analyses.
translation_notes:
  register: Français international moderne, digne et lisible. Le rythme en deux phrases clarifie la progression sans effacer le parallélisme. Les termes « âme », « justifiera » et « portera » maintiennent les images et la densité théologique du texte hébreu, tandis que les notes conservent l’ambiguïté grammaticale et la variante textuelle.
