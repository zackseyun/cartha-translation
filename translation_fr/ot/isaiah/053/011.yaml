- from: Après les tourments de son âme, il verra[a] et sera comblé. Par sa connaissance[b], mon serviteur juste justifiera beaucoup de gens, et lui-même portera leurs fautes.
  to: Au terme du tourment de son âme, il verra[a] et sera comblé. Par sa connaissance[b], mon serviteur juste justifiera un grand nombre, et lui-même portera leurs iniquités.
  rationale: 'La révision conserve les deux ambiguïtés importantes : le complément de « il verra » reste inexprimé dans le texte principal, et la lecture objective possible de בְּדַעְתּוֹ demeure en note. Elle améliore la précision lexicale de עָוֺן par « iniquités », resserre le rendu de לָרַבִּים par « un grand nombre », et maintient l’emphase explicite de הוּא avec « lui-même ».'
