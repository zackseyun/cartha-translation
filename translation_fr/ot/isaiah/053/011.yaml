  - severity: medium
    issue: « leurs fautes » est trop faible pour עֲוֺנֹתָם.
    rationale: עָוֺן renvoie aux iniquités et à la culpabilité qui s’y attache. « Fautes » peut désigner des erreurs ou manquements relativement légers et affaiblit le terme dans ce passage.
  - severity: low
