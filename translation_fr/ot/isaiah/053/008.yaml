source:
  edition: WLC
  text: מֵ/עֹ֤צֶר וּ/מִ/מִּשְׁפָּט֙ לֻקָּ֔ח וְ/אֶת דּוֹר֖/וֹ מִ֣י יְשׂוֹחֵ֑חַ כִּ֤י נִגְזַר֙ מֵ/אֶ֣רֶץ חַיִּ֔ים מִ/פֶּ֥שַׁע עַמִּ֖/י נֶ֥גַע לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/008.yaml
  text: By oppression and judgment he was taken away[a]; and as for his generation, who considered that he was cut off from the land of the living[c][b], stricken for the transgression of my people?
translation:
  language: fr
  text: Par l’oppression et le jugement, il a été emporté. Quant à sa génération[b], qui en parlera[a] ? Car il a été retranché de la terre des vivants ; à cause de la transgression de mon peuple, le coup est tombé sur lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui y réfléchira ? » ou « qui en fera le récit ? » Le verbe hébreu est rare et son sens précis est difficile à établir.
    reason: lexical_alternative
  - marker: b
    text: « Sa génération » peut désigner ses contemporains, sa descendance ou, plus largement, le cours de sa vie et son destin.
    reason: alternative_reading
  - marker: c
    text: 'L’hébreu peut aussi se comprendre : « il a été frappé à cause de la transgression de mon peuple ». לָמוֹ a formellement une valeur plurielle (« sur eux »), mais peut avoir ici un sens poétique singulier (« sur lui »).'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֹצֶר
  choice: Par l’oppression
  rationale: עֹצֶר peut désigner la contrainte, la détention ou une oppression. « Par l’oppression » conserve ici la dureté du terme et la valeur possible du préfixe מִן, sans réduire le sens à une incarcération précise.
- source_word: וּמִמִּשְׁפָּט
  choice: et le jugement
  rationale: מִשְׁפָּט peut évoquer le jugement, la justice ou la procédure judiciaire. « Le jugement » maintient la dimension juridique sans décider si le procès était juste.
- source_word: לֻקָּח
  choice: il a été emporté
  rationale: Le passif de לקח exprime ici un enlèvement ou un retrait. « Emporté » convient au mouvement violent vers la mort suggéré par la suite du verset.
- source_word: וְאֶת־דּוֹרוֹ
  choice: Quant à sa génération
  rationale: La tournure thématique rend la mise en relief de l’expression hébraïque. Le mot « génération » est conservé afin de ne pas trancher entre contemporains, descendance et cours de sa vie.
- source_word: מִי יְשׂוֹחֵחַ
  choice: qui en a parlé
  rationale: Le verbe שׂוח est rare et son sens précis est discuté. « Parler de » est une possibilité lexicale directe et donne une question rhétorique naturelle en français ; d’autres sens plausibles sont signalés en note.
- source_word: כִּי
  choice: Car
  rationale: כִּי peut introduire ici l’explication de la question précédente. « Car » respecte cette articulation sans imposer que toute la proposition soit le contenu mental de ce que la génération n’aurait pas compris.
- source_word: נִגְזַר
  choice: il a été retranché
  rationale: Le nifal de גזר signifie être coupé ou retranché. « Retranché » préserve l’image et exprime naturellement l’exclusion du monde des vivants.
- source_word: מֵאֶרֶץ חַיִּים
  choice: de la terre des vivants
  rationale: Cette expression hébraïque imagée désigne le domaine de ceux qui vivent. La formulation française en conserve l’image traditionnelle et reste intelligible.
- source_word: מִפֶּשַׁע עַמִּי
  choice: à cause de la révolte de mon peuple
  rationale: פֶּשַׁע désigne une transgression conçue comme rébellion. « Révolte » restitue cette force, tandis que « à cause de » rend explicitement la valeur causale probable de מִן.
- source_word: נֶגַע לָמוֹ
  choice: le coup est tombé sur lui
  rationale: נֶגַע est un nom signifiant coup, atteinte ou plaie. La proposition nominale très condensée est rendue par une phrase française claire. Le singulier contextuel de לָמוֹ est retenu dans le texte, mais son ambiguïté morphologique est conservée en note.
theological_decisions:
- issue: Référent et nombre de לָמוֹ dans la dernière proposition
  choice: 'Sens singulier rapporté au serviteur : « le coup est tombé sur lui »'
  alternative: « le coup est tombé sur eux » ; ou « il a été frappé à cause de la révolte de mon peuple »
  rationale: לָמוֹ a formellement l’apparence d’un pluriel, mais peut fonctionner comme un singulier poétique. Le contexte immédiat parle constamment du serviteur au singulier. La note maintient néanmoins l’autre lecture possible.
- issue: Sens de דּוֹר dans « sa génération »
  choice: Conserver le terme large « génération »
  alternative: Ses contemporains ; sa descendance ; le cours de sa vie ou son destin
  rationale: Le terme hébreu admet plusieurs compréhensions dans cette construction difficile. Le texte principal évite de choisir une interprétation théologique plus étroite que l’hébreu.
- issue: Rapport logique introduit par כִּי
  choice: 'Lire כִּי comme explicatif : « Car »'
  alternative: 'Le lire comme introduisant le contenu de la réflexion : « qui a compris qu’il avait été retranché… ? »'
  rationale: Les deux analyses sont grammaticalement envisageables. « Car » garde la structure poétique en propositions successives et évite d’intégrer toute la suite comme objet du verbe rare יְשׂוֹחֵחַ.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation conserve la densité poétique et juridique de l’hébreu. Les termes « génération », « retranché » et « terre des vivants » maintiennent les images du texte source, tandis que les notes exposent les ambiguïtés réelles sans imposer une lecture confessionnelle.
