base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/003.yaml
  text: He was despised and rejected by men[a], a man of pains and acquainted with sickness; and like one from whom people hide their faces, he was despised[d][c][b], and we did not esteem him.
translation:
  language: fr
  text: Il était méprisé et délaissé par les hommes[a], homme de douleurs[b] et familier de la maladie[c] ; comme quelqu’un devant qui l’on se voile le visage[d], il était méprisé, et nous ne lui accordions aucune valeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression hébraïque est difficile. Autres traductions possibles : « rejeté par les hommes » ou « abandonné des hommes ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « homme de souffrances » ; le terme peut désigner la douleur aussi bien que le chagrin.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « connaissant la maladie ». Traditionnellement : « familier de la souffrance » ou « de la douleur ».'
    reason: lexical_alternative
  - marker: d
    text: 'L’hébreu est elliptique, littéralement proche de : « comme lorsqu’on cache les visages loin de lui ». Le sens paraît être que les gens se voilaient le visage devant lui ou détournaient leur regard de lui.'
    reason: textual_clarity
lexical_decisions:
- source_word: נִבְזֶה
  choice: méprisé
  rationale: Le participe niphal de בזה exprime le fait d’être méprisé ou tenu en peu d’estime. « Méprisé » est direct, naturel et conserve la valeur passive.
- source_word: חֲדַל אִישִׁים
  choice: délaissé par les hommes
  rationale: L’expression hébraïque est difficile. חדל évoque ici le manque, l’abandon ou la mise à l’écart en relation avec les humains. « Délaissé par les hommes » rend cette solitude sociale sans imposer le sens plus précis d’un rejet formel.
- source_word: אִישׁ מַכְאֹבוֹת
  choice: homme de douleurs
  rationale: מַכְאֹב peut désigner douleurs, souffrances ou chagrins. « Homme de douleurs » reste concret, digne et ouvert aux dimensions physiques et affectives.
- source_word: וִידוּעַ חֹלִי
  choice: familier de la maladie
  rationale: Le participe de ידע associé à חֹלִי décrit quelqu’un qui connaît intimement la maladie. « Familier de » est idiomatique en français et ne précise pas indûment s’il en souffre lui-même ou s’il est connu d’elle.
- source_word: וּכְמַסְתֵּר פָּנִים מִמֶּנּוּ
  choice: comme quelqu’un dont on détourne le visage
  rationale: La formulation hébraïque est elliptique, littéralement proche de « comme une dissimulation de visages loin de lui ». La traduction explicite le sujet humain implicite tout en conservant l’idée que les autres refusent de le regarder.
- source_word: וְלֹא חֲשַׁבְנֻהוּ
  choice: nous ne lui accordions aucune valeur
  rationale: חשב signifie ici considérer, estimer ou attribuer de la valeur. Cette tournure française exprime clairement le jugement dépréciatif du groupe qui parle.
theological_decisions:
- issue: Interprétation messianique du serviteur
  choice: Présenter le personnage dans les termes propres du poème, sans ajouter d’identification christologique explicite.
  alternative: Introduire dans le verset une désignation explicitement messianique ou christologique.
  rationale: Le texte hébreu ne nomme pas ici le personnage. La traduction laisse donc ouverte la lecture canonique et théologique sans incorporer dans le corps du verset une interprétation absente de sa formulation.
- issue: Nature des souffrances
  choice: Conserver les termes concrets « douleurs » et « maladie ».
  alternative: Employer uniquement des termes affectifs tels que « chagrins » et « affliction ».
  rationale: Les mots hébreux peuvent toucher à la souffrance physique comme à la détresse. La formulation retenue préserve cette tension sans réduire le portrait à la seule émotion ni à un diagnostic médical précis.
translation_notes:
  register: Français international actuel, sobre et digne. Le rythme nominal de « homme de douleurs » conserve la densité poétique de l’hébreu. Les répétitions de « méprisé » sont maintenues, tandis que la dernière proposition est formulée naturellement pour exprimer l’absence d’estime.
