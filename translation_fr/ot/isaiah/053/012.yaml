id: ISA.53.12
reference: Isaiah 53:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֞ן אֲחַלֶּק ל֣/וֹ בָ/רַבִּ֗ים וְ/אֶת עֲצוּמִים֮ יְחַלֵּ֣ק שָׁלָל֒ תַּ֗חַת אֲשֶׁ֨ר הֶעֱרָ֤ה לַ/מָּ֨וֶת֙ נַפְשׁ֔/וֹ וְ/אֶת פֹּשְׁעִ֖ים נִמְנָ֑ה וְ/הוּא֙ חֵטְא רַבִּ֣ים נָשָׂ֔א וְ/לַ/פֹּשְׁעִ֖ים יַפְגִּֽיעַ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/053/012.yaml
  text: Therefore I will allot him a portion among the many[a], and he will divide plunder with the strong, because he poured out his life to death and was numbered with transgressors[c][b]; yet he bore the sin of many and intercedes for transgressors.
translation:
  language: fr
  text: C’est pourquoi je lui attribuerai une part avec un grand nombre[a], et il partagera le butin avec les puissants, parce qu’il a livré sa vie à la mort et qu’il a été compté parmi les transgresseurs[b]. Pourtant, il a porté le péché d’un grand nombre et il intercède en faveur des transgresseurs[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je lui attribuerai une part parmi un grand nombre »; l’expression hébraïque est concise et peut être comprise de plusieurs manières très proches.
    reason: alternative_reading
  - marker: b
    text: Ou « il a été mis au nombre des transgresseurs ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il intervient en faveur des transgresseurs ». Le verbe hébreu peut exprimer ici l’intercession ou l’intervention en faveur de quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence ou le résultat de la souffrance et de la justification du serviteur.
- source_word: אֲחַלֶּק לוֹ בָרַבִּים
  choice: je lui attribuerai une part parmi la multitude
  rationale: Le piel de חלק exprime le partage ou l’attribution d’une part. Cette formulation conserve l’image du partage du butin tout en laissant ouverte la syntaxe compacte de בָרַבִּים.
- source_word: עֲצוּמִים
  choice: les puissants
  rationale: Le terme désigne naturellement des personnes fortes ou puissantes et convient au tableau d’une victoire suivie du partage du butin.
- source_word: יְחַלֵּק שָׁלָל
  choice: il partagera le butin
  rationale: Rend clairement l’image militaire courante sans alourdir le français.
- source_word: תַּחַת אֲשֶׁר
  choice: parce que
  rationale: Exprime ici la cause de l’élévation annoncée.
- source_word: הֶעֱרָה לַמָּוֶת נַפְשׁוֹ
  choice: il a livré sa vie à la mort
  rationale: נפשׁ désigne ici la vie ou la personne elle-même. « Livré sa vie » restitue en français courant le don total exprimé par l’image hébraïque de l’effusion.
- source_word: וְאֶת פֹּשְׁעִים נִמְנָה
  choice: il a été compté parmi les transgresseurs
  rationale: La tournure passive exprime qu’il a été considéré comme appartenant à leur groupe.
- source_word: פֹּשְׁעִים
  choice: transgresseurs
  rationale: Le mot issu de פשע évoque la transgression et la rébellion plutôt que le péché en général; le même choix est conservé dans les deux occurrences.
- source_word: וְהוּא
  choice: Pourtant, il
  rationale: Le waw prend dans le contexte une valeur de contraste entre le classement du serviteur parmi les transgresseurs et le fait qu’il porte le péché d’autres personnes.
- source_word: חֵטְא רַבִּים נָשָׂא
  choice: il a porté le péché d’un grand nombre
  rationale: « Porter le péché » maintient la portée représentative ou sacrificielle de נשא sans la développer en une formule doctrinale plus précise. « Un grand nombre » est naturel en français tout en conservant la portée indéterminée de רבים.
- source_word: וְלַפֹּשְׁעִים יַפְגִּיעַ
  choice: il intercède en faveur des transgresseurs
  rationale: Le hiphil de פגע peut désigner l’intercession ou la supplication. Le présent français rend convenablement la valeur récapitulative possible de l’imparfait hébreu sans imposer une action strictement passée.
theological_decisions:
- issue: Portée de רַבִּים
  choice: un grand nombre / la multitude, sans assimiler explicitement le terme à « tous »
  alternative: tous; les multitudes
  rationale: L’hébreu parle des « nombreux ». La traduction évite de trancher si cette expression est universelle ou désigne un groupe plus restreint.
- issue: Valeur expiatoire de נָשָׂא חֵטְא
  choice: il a porté le péché
  alternative: il a enlevé le péché; il a subi le châtiment
  rationale: La formulation conserve la force représentative et sacrificielle possible sans réduire le texte à une seule explication doctrinale ultérieure.
- issue: Valeur temporelle et médiatrice de יַפְגִּיעַ
  choice: il intercède
  alternative: il intercédait; il est intervenu; il plaide
  rationale: L’imparfait hébreu permet une action récapitulative ou non bornée. Le présent préserve cette ouverture et le sens de requête en faveur d’autrui.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement solennel du chant sans archaïsmes. « Transgresseurs » est retenu malgré son registre légèrement soutenu afin de préserver la nuance morale et juridique de פשע; « personnes rebelles » serait plus courant, mais moins précis dans ce contexte.
