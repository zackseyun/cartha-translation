revisions:
- from: C’est pourquoi je lui attribuerai une part parmi la multitude[a], et il partagera le butin avec les puissants, parce qu’il a livré sa vie à la mort et qu’il a été compté parmi les transgresseurs[b]. Pourtant, il a porté le péché d’un grand nombre et il intercède en faveur des transgresseurs[c].
  to: C’est pourquoi je lui attribuerai une part avec un grand nombre[a], et il partagera le butin avec les puissants, parce qu’il a livré sa vie à la mort et qu’il a été compté parmi les transgresseurs[b]. Pourtant, il a porté le péché d’un grand nombre et il intercède en faveur des transgresseurs[c].
  rationale: La révision harmonise les deux rendus de רַבִּים par « un grand nombre » et remplace une formulation initiale un peu maladroite par une formulation française naturelle qui ne tranche pas la syntaxe hébraïque disputée. Aucun autre changement n’est nécessaire.
