id: ISA.66.24
reference: Isaiah 66:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/יָצְא֣וּ וְ/רָא֔וּ בְּ/פִגְרֵי֙ הָ/אֲנָשִׁ֔ים הַ/פֹּשְׁעִ֖ים בִּ֑/י כִּ֣י תוֹלַעְתָּ֞/ם לֹ֣א תָמ֗וּת וְ/אִשָּׁ/ם֙ לֹ֣א תִכְבֶּ֔ה וְ/הָי֥וּ דֵרָא֖וֹן לְ/כָל בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/024.yaml
  text: And they will go out and look on the corpses of the men who rebelled against me[a]. For their worm will not die, and their fire will not be quenched[c][b], and they will be an abhorrence to all flesh.
translation:
  language: fr
  text: Ils sortiront et regarderont les cadavres des hommes qui se sont révoltés contre moi. Car leur ver[a] ne mourra pas, et leur feu ne s’éteindra pas. Ils seront un objet d’horreur[b] pour toute chair[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu peut aussi désigner une larve ou un asticot.
    reason: lexical_alternative
  - marker: b
    text: Ou « une chose répugnante » ou « un objet de dégoût ».
    reason: lexical_alternative
  - marker: c
    text: « Toute chair » est une expression hébraïque qui désigne ici tous les êtres humains, c’est-à-dire toute l’humanité.
    reason: cultural_note
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: Ils sortiront
  rationale: Le qatal inversé poursuit ici la séquence à valeur future. Le futur simple est naturel en français et conserve le mouvement vers l’extérieur.
- source_word: וְרָאוּ בְּ
  choice: et regarderont
  rationale: Avec la préposition בְּ devant l’objet, ראה exprime ici le fait de porter les regards sur quelque chose, plutôt qu’une simple perception fortuite.
- source_word: בְּפִגְרֵי
  choice: les cadavres
  rationale: פגר désigne un cadavre ou une dépouille. « Cadavres » restitue clairement et sobrement la dureté de l’image.
- source_word: הָאֲנָשִׁים
  choice: des hommes
  rationale: Le nom est un pluriel masculin concret. « Hommes » en respecte la forme sans transformer le groupe désigné en abstraction générique.
- source_word: הַפֹּשְׁעִים בִּי
  choice: qui se sont révoltés contre moi
  rationale: פשׁע exprime une transgression conçue comme rébellion ou défiance. La tournure pronominale est idiomatique en français.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication du spectacle décrit dans la première phrase.
- source_word: תוֹלַעְתָּם
  choice: leur ver
  rationale: תולעת peut désigner un ver, une larve ou un asticot. « Ver » reste exact, sobre et conserve l’écho intertextuel de cette formule.
- source_word: לֹא תָמוּת
  choice: ne mourra pas
  rationale: Le futur correspond à la progression prophétique du passage et s’accorde avec le sujet féminin singulier en hébreu.
- source_word: וְאִשָּׁם
  choice: et leur feu
  rationale: Le suffixe pronominal indique l’association du feu avec ceux qui subissent le jugement, sans nécessairement exprimer une possession au sens strict.
- source_word: לֹא תִכְבֶּה
  choice: ne s’éteindra pas
  rationale: כבה appliqué au feu signifie s’éteindre ou être éteint. La forme pronominale est la formulation française la plus naturelle.
- source_word: וְהָיוּ דֵרָאוֹן
  choice: Ils seront un objet d’horreur
  rationale: Le rare nom דראון désigne ce qui inspire répulsion ou horreur. « Un objet d’horreur » conserve sa valeur nominale.
- source_word: לְכָל בָּשָׂר
  choice: pour toute chair
  rationale: La traduction garde l’expression hébraïque concrète « toute chair », qui désigne ici l’ensemble des êtres humains; une note en explicite le sens.
theological_decisions:
- issue: Nature des images du jugement
  choice: Conserver les images concrètes des cadavres, du ver qui ne meurt pas et du feu qui ne s’éteint pas, sans en tirer dans la traduction une description doctrinale plus détaillée.
  alternative: Interpréter explicitement ces images soit comme de simples métaphores de la honte et de la défaite, soit comme une définition complète des modalités d’un châtiment éternel conscient.
  rationale: Le verset décrit les suites visibles du jugement divin, mais la traduction ne doit ni réduire ces images à un sens purement figuré ni préciser au-delà du texte la nature exacte du châtiment.
- issue: Valeur de הָאֲנָשִׁים
  choice: des hommes
  alternative: des gens / des êtres humains
  rationale: Le texte désigne par un pluriel masculin un groupe concret de rebelles. La traduction conserve cette donnée grammaticale sans prétendre résoudre la portée représentative éventuelle de ce groupe.
- issue: Portée de « toute chair »
  choice: Conserver l’expression sémitique dans le texte et en expliquer le référent humain en note.
  alternative: Traduire directement par « tous les êtres humains » ou « toute l’humanité ».
  rationale: Cette formulation préserve l’image de l’hébreu tout en évitant, grâce à la note, qu’elle soit comprise comme visant indistinctement toute matière vivante.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste directe et solennelle. Les images physiques et la tension théologique du texte hébreu sont conservées; les notes éclairent les termes rares ou idiomatiques sans imposer une interprétation doctrinale.
