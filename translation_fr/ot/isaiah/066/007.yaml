id: ISA.66.7
reference: Isaiah 66:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בְּ/טֶ֥רֶם תָּחִ֖יל יָלָ֑דָה בְּ/טֶ֨רֶם יָב֥וֹא חֵ֛בֶל לָ֖/הּ וְ/הִמְלִ֥יטָה זָכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/007.yaml
  text: Before she was in labor[a], she gave birth; before pain came upon her[b], she delivered a son.
translation:
  language: fr
  text: Avant d’être en travail[a], elle a enfanté ; avant que les douleurs lui viennent, elle[b] a mis au monde un fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avant qu’elle éprouve les douleurs de l’accouchement. »'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte, « elle » désigne Sion, c’est-à-dire Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: avant
  rationale: La conjonction temporelle signifie « avant » ou « alors que… ne… pas encore ». Sa répétition en français conserve le parallélisme et l’insistance de l’hébreu.
- source_word: תָּחִיל
  choice: être en travail
  rationale: Dans ce contexte d’accouchement, le verbe évoque les contractions et les douleurs qui font se tordre. « Être en travail » rend naturellement cette idée en français actuel.
- source_word: יָלָדָה
  choice: elle a enfanté
  rationale: Le verbe désigne directement l’action de donner naissance. « Enfanter » est concis, digne et maintient le contraste surprenant entre l’absence de travail et la naissance.
- source_word: יָבֹא
  choice: viennent
  rationale: Avec חֵבֶל et le complément לָהּ, le verbe exprime les douleurs qui surviennent à la femme. « Lui viennent » suit de près la construction hébraïque tout en restant idiomatique.
- source_word: חֵבֶל
  choice: les douleurs
  rationale: Au singulier collectif en hébreu, le terme désigne ici les douleurs ou contractions de l’accouchement. Le pluriel français est l’expression naturelle dans ce contexte.
- source_word: וְהִמְלִיטָה
  choice: elle a mis au monde
  rationale: La forme causative de מלט signifie ici faire sortir, mettre au monde. Cette tournure française exprime clairement l’accouchement sans répéter « enfanter ».
- source_word: זָכָר
  choice: un fils
  rationale: Le mot signifie littéralement « un mâle ». Dans le contexte immédiat d’une naissance humaine, « un fils » est naturel et conserve la précision masculine du texte.
theological_decisions:
- issue: Référent de la femme
  choice: Le texte principal conserve le pronom féminin « elle ».
  alternative: Expliciter « Sion » ou « Jérusalem » dans le texte principal.
  rationale: Le contexte environnant désigne Sion/Jérusalem, mais ce verset emploie seulement des formes verbales et un pronom féminins. Garder « elle » préserve l’image et évite d’intégrer l’interprétation au corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme hébreu est conservé par la répétition de « avant ». Les deux formulations de la naissance, « a enfanté » et « a mis au monde », reflètent la variation lexicale de l’original sans archaïsme.
