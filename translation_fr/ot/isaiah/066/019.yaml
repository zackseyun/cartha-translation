  text: וְ/שַׂמְתִּ֨י בָ/הֶ֜ם א֗וֹת וְ/שִׁלַּחְתִּ֣י מֵ/הֶ֣ם פְּ֠לֵיטִים אֶֽל הַ/גּוֹיִ֞ם תַּרְשִׁ֨ישׁ פּ֥וּל וְ/ל֛וּד מֹ֥שְׁכֵי קֶ֖שֶׁת תֻּבַ֣ל וְ/יָוָ֑ן הָ/אִיִּ֣ים הָ/רְחֹקִ֗ים אֲשֶׁ֨ר לֹא שָׁמְע֤וּ אֶת שִׁמְעִ/י֙ וְ/לֹא רָא֣וּ אֶת כְּבוֹדִ֔/י וְ/הִגִּ֥ידוּ אֶת כְּבוֹדִ֖/י בַּ/גּוֹיִֽם׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/019.yaml
  text: And I will set a sign among them[a], and from them I will send survivors to the nations—to Tarshish, Pul, and Lud, who draw the bow; to Tubal and Javan[d][c][b]; to the distant coastlands that have not heard my report and have not seen my glory—and they will declare my glory among the nations.
translation:
  language: fr
  text: Je placerai un signe parmi eux[a], et j’enverrai d’entre eux des rescapés vers les nations — vers Tarsis, Poul et Loud, qui bandent l’arc[b]; vers Toubal et Yavân; vers les lointaines contrées côtières[c] qui n’ont pas entendu ce qu’on rapporte à mon sujet[d] et qui n’ont pas vu ma gloire. Ils proclameront ma gloire parmi les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en eux » ou « sur eux »; la préposition hébraïque permet plusieurs nuances.
    reason: lexical_alternative
  - marker: b
    text: L’expression « qui bandent l’arc » peut être comprise comme décrivant Loud en particulier; on peut aussi traduire plus généralement par « les archers ».
    reason: syntactic_ambiguity
  - marker: c
    text: Ou « les îles lointaines »; le terme hébreu peut désigner des îles ou des régions côtières, notamment des territoires maritimes éloignés.
    reason: lexical_alternative
  - marker: d
    text: Ou « qui n’ont pas entendu parler de ma renommée » ou « qui n’ont pas entendu la nouvelle à mon sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי בָהֶם אוֹת
  choice: Je placerai un signe parmi eux
  rationale: « Placer » rend naturellement שׂים, et « signe » conserve toute l’étendue de אוֹת sans préciser sa nature. « Parmi eux » convient au référent collectif tout en laissant en note les autres nuances possibles de ב.
- source_word: וְשִׁלַּחְתִּי מֵהֶם פְּלֵיטִים
  choice: et j’enverrai certains de leurs rescapés
  rationale: פְּלֵיטִים désigne ceux qui ont échappé ou survécu. « Rescapés » est actuel et précis; « certains de leurs » exprime idiomatiquement מֵהֶם sans identifier davantage le groupe visé.
- source_word: אֶל הַגּוֹיִם
  choice: vers les nations
  rationale: Le mouvement marqué par אֶל est rendu par « vers », et גּוֹיִם désigne ici les nations étrangères sans imposer une opposition théologique entre Juifs et non-Juifs.
- source_word: תַּרְשִׁישׁ פּוּל וְלוּד ... תֻּבַל וְיָוָן
  choice: Tarsis, Poul et Loud ... Toubal et Yavân
  rationale: Les noms de peuples ou de territoires sont translittérés sous des formes françaises reconnaissables. « Yavân » reflète le nom hébreu sans le remplacer interprétativement par « Grèce ».
- source_word: מֹשְׁכֵי קֶשֶׁת
  choice: qui bandent l’arc
  rationale: Cette formulation conserve l’image concrète de ceux qui tirent ou tendent l’arc, plutôt que de la réduire au nom « archers ».
- source_word: הָאִיִּים הָרְחֹקִים
  choice: les lointaines contrées côtières
  rationale: אִיִּים peut désigner des îles aussi bien que des régions maritimes ou côtières. « Contrées côtières » garde une portée géographique assez large en français courant.
- source_word: אֲשֶׁר לֹא שָׁמְעוּ אֶת שִׁמְעִי
  choice: qui n’ont pas entendu ce qu’on rapporte à mon sujet
  rationale: שִׁמְעִי désigne ici ce qui est entendu au sujet de Dieu — nouvelle, réputation ou renommée. La périphrase française préserve ce champ de sens sans réduire le terme à la seule « renommée ».
- source_word: וְהִגִּידוּ אֶת כְּבוֹדִי בַּגּוֹיִם
  choice: Ils proclameront ma gloire parmi les nations
  rationale: נגד au hifil signifie annoncer ou faire connaître. « Proclameront » exprime clairement cette annonce publique, tandis que « parmi » convient à la diffusion au sein des nations.
theological_decisions:
- issue: Nature du signe placé parmi eux
  choice: Conserver le terme général « un signe »
  alternative: « une marque sur eux » ou « un étendard parmi eux »
  rationale: Le texte hébreu ne définit ni la forme ni la fonction exacte du signe. Le préciser introduirait une interprétation absente du verset.
- issue: Référent de « eux » et origine des rescapés
  choice: Maintenir les pronoms sans identifier explicitement le groupe
  alternative: Préciser qu’il s’agit d’Israélites, de Judéens ou des adorateurs mentionnés dans le contexte
  rationale: Le verset emploie des pronoms et ne répète pas leur référent. La traduction conserve cette continuité sans la resserrer doctrinalement.
- issue: Portée de la mission des rescapés
  choice: Rendre simplement leur envoi et leur proclamation de la gloire divine
  alternative: Les qualifier explicitement de missionnaires ou d’évangélistes
  rationale: Même si le mouvement vers les nations peut être compris comme missionnaire, ces titres ne figurent pas dans le texte et ajouteraient une catégorie théologique.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase ample et énumérative conserve le mouvement prophétique de l’hébreu, tandis que la ponctuation clarifie la liste des peuples et territoires sans en résoudre les incertitudes.
