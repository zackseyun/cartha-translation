  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י נֹטֶֽה אֵ֠לֶי/הָ כְּ/נָהָ֨ר שָׁל֜וֹם וּ/כְ/נַ֧חַל שׁוֹטֵ֛ף כְּב֥וֹד גּוֹיִ֖ם וִֽ/ינַקְתֶּ֑ם עַל צַד֙ תִּנָּשֵׂ֔אוּ וְ/עַל בִּרְכַּ֖יִם תְּשָׁעֳשָֽׁעוּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/012.yaml
  text: 'For thus says Yahweh: Behold[a], I am extending peace to her like a river, and the glory of the nations like an overflowing stream; and you will nurse, you will be carried on the hip[b], and bounced on the knees.'
translation:
  language: fr
  text: 'Car ainsi parle Yahvé : « Voici, je vais étendre vers elle la paix comme un fleuve, et la gloire des nations[a] comme un torrent qui déborde. Vous téterez, vous serez portés sur la hanche et cajolés sur les genoux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les richesses » ou « l’abondance des nations ». Le mot hébreu traduit par « gloire » peut inclure leur splendeur et leurs biens.
    reason: lexical_alternative
  - marker: b
    text: Ou « bercés avec tendresse sur les genoux ». L’hébreu évoque les gestes affectueux et joyeux prodigués à un petit enfant.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin, qui représente le tétragramme au lieu de le remplacer par un titre.
- source_word: הִנְנִי נֹטֶה אֵלֶיהָ
  choice: Je vais faire couler vers elle
  rationale: « Voici » rend la force présentative de הִנְנִי. Avec la comparaison au fleuve, « faire couler vers elle » exprime naturellement en français l’action de déployer ou diriger quelque chose vers Jérusalem.
- source_word: שָׁלוֹם
  choice: la paix
  rationale: Rendu principal et traditionnel, assez large ici pour évoquer aussi le bien-être et la prospérité.
- source_word: כְּנָהָר
  choice: comme un fleuve
  rationale: Conserve directement l’image d’un cours d’eau ample et continu.
- source_word: וּכְנַחַל שׁוֹטֵף
  choice: comme un torrent qui déborde
  rationale: נַחַל peut désigner un torrent ou un oued, et שׁוֹטֵף en souligne le caractère débordant et impétueux.
- source_word: כְּבוֹד גּוֹיִם
  choice: la gloire des nations
  rationale: Traduction formelle qui préserve l’étendue sémantique de כָּבוֹד; dans ce contexte, cette gloire peut comprendre leurs richesses et leur splendeur.
- source_word: וִינַקְתֶּם
  choice: Vous téterez
  rationale: Respecte la forme active du verbe hébreu et prolonge sans détour l’image maternelle du contexte.
- source_word: עַל צַד תִּנָּשֵׂאוּ
  choice: vous serez portés sur la hanche
  rationale: Le passif est conservé; dans l’image maternelle, צַד désigne naturellement le côté ou la hanche où l’on porte un enfant.
- source_word: וְעַל בִּרְכַּיִם תְּשָׁעֳשָׁעוּ
  choice: cajolés sur les genoux
  rationale: Exprime en français actuel les soins tendres et joyeux accordés à un petit enfant, sans réduire le verbe à un seul geste précis.
theological_decisions:
- issue: Référent du suffixe féminin אֵלֶיהָ (« vers elle »)
  choice: Maintien du pronom « elle »
  alternative: Expliciter « vers Jérusalem » ou « vers Sion »
  rationale: Le contexte immédiat identifie la ville maternelle, mais le texte hébreu emploie ici un pronom. Le conserver maintient la cohésion littéraire sans ajouter un nom absent du verset.
- issue: Étendue de שָׁלוֹם
  choice: « la paix »
  alternative: « le bien-être » ou « la prospérité »
  rationale: « Paix » garde la formulation biblique familière tout en laissant subsister le sens plus vaste de plénitude, de sécurité et de prospérité.
translation_notes:
  register: Français international actuel, digne et imagé. La syntaxe demeure accessible, tandis que « téterez » conserve l’image maternelle explicite et la voix active de l’hébreu. Les notes sont placées sur les expressions auxquelles elles se rapportent.
