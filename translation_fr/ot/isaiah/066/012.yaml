  - severity: medium
    issue: Le verbe « faire couler » ajoute une représentation verbale du flux qui n’est pas explicitement portée par נֹטֶה.
    rationale: Le fleuve est une comparaison pour la paix, mais נֹטֶה signifie d’abord étendre, déployer ou diriger vers. Employer « étendre » maintient l’image et la portée du verbe hébreu.
  - severity: low
    issue: L’emphase de הִנְנִי n’est pas explicitement rendue dans la proposition divine.
    rationale: « Voici ce que dit Yahvé » rend surtout כִּי כֹה אָמַר יהוה. Ajouter « Voici » après l’introduction restitue la particule emphatique sans imposer une interprétation.
