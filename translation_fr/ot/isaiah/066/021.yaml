  yaml_path: translation/ot/isaiah/066/021.yaml
  text: And even from them I will take some for priests and for Levites[b][a], says Yahweh.
translation:
  language: fr
  text: Et même parmi eux[a], j’en prendrai pour en faire des prêtres et des lévites[b], dit le SEIGNEUR.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’antécédent de « eux » reste implicite en hébreu et doit être compris à partir du contexte précédent.
    reason: ambiguïté du référent
  - marker: b
    text: 'Littéralement : « pour prêtres et pour lévites » ; on peut aussi comprendre : « comme prêtres et comme lévites ».'
    reason: variante lexicale et syntaxique
lexical_decisions:
- source_word: וְגַם
  choice: Et … aussi
  rationale: Cette formulation conserve à la fois le lien avec le contexte précédent et la valeur emphatique de גַם, tout en restant naturelle en français.
- source_word: מֵהֶם
  choice: parmi eux
  rationale: La préposition מִן exprime ici un prélèvement au sein d’un groupe. « Parmi eux » rend clairement ce sens partitif sans préciser l’identité du groupe, laissée implicite en hébreu.
- source_word: אֶקַּח
  choice: j’en prendrai
  rationale: Le verbe לקח signifie littéralement « prendre » et peut, dans ce contexte, évoquer une sélection. Le pronom « en » exprime naturellement en français le prélèvement d’une partie du groupe.
- source_word: לַכֹּהֲנִים
  choice: pour en faire des prêtres
  rationale: Le ל peut marquer la destination ou la désignation à une fonction. Cette tournure française communique l’idée de nomination sans remplacer le verbe « prendre » par « choisir ».
- source_word: לַלְוִיִּם
  choice: des lévites
  rationale: Le second ל est compris parallèlement au premier dans la tournure « pour en faire des prêtres et des lévites ». « Lévites » est l’appellation française courante de cette catégorie cultuelle.
- source_word: אָמַר יְהוָה
  choice: dit le SEIGNEUR
  rationale: Le parfait אָמַר fonctionne dans cette formule prophétique comme une déclaration solennelle actuelle. « Dit le SEIGNEUR » est idiomatique, et « le SEIGNEUR » représente le nom divin יהוה selon la convention éditoriale française.
theological_decisions:
- issue: Identité de « eux » et portée de l’admission aux fonctions sacerdotales et lévitiques
  choice: Conserver le pronom sans identifier explicitement son antécédent, afin que le contexte précédent fournisse le référent.
  alternative: Limiter explicitement le référent aux Israélites ramenés d’entre les nations, ou l’identifier sans réserve aux membres des nations.
  rationale: L’hébreu ne répète pas l’antécédent. Le préciser dans le corps du texte trancherait une question interprétative que le verset laisse dépendre du contexte. La traduction conserve également la force surprenante de l’accès aux fonctions de prêtres et de lévites sans en imposer une lecture littérale ou figurée.
- issue: Valeur du ל devant « prêtres » et « lévites »
  choice: Rendre l’idée de destination ou de nomination par « pour en faire ».
  alternative: Traduire plus littéralement « pour prêtres et pour lévites » ou employer « comme prêtres et comme lévites ».
  rationale: La formulation retenue est naturelle en français et exprime la désignation à une fonction, tandis qu’une note signale l’autre rendu possible sans effacer la souplesse grammaticale de l’hébreu.
translation_notes:
  register: Français international moderne, sobre et solennel. La phrase conserve la continuité prophétique, le sens partitif et l’ambiguïté contextuelle, tout en évitant une construction française artificielle.
