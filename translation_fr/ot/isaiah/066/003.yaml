source:
  edition: WLC
  text: שׁוֹחֵ֨ט הַ/שּׁ֜וֹר מַכֵּה אִ֗ישׁ זוֹבֵ֤חַ הַ/שֶּׂה֙ עֹ֣רֵֽף כֶּ֔לֶב מַעֲלֵ֤ה מִנְחָה֙ דַּם חֲזִ֔יר מַזְכִּ֥יר לְבֹנָ֖ה מְבָ֣רֵֽךְ אָ֑וֶן גַּם הֵ֗מָּה בָּֽחֲרוּ֙ בְּ/דַרְכֵי/הֶ֔ם וּ/בְ/שִׁקּוּצֵי/הֶ֖ם נַפְשָׁ֥/ם חָפֵֽצָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/003.yaml
  text: The one who slaughters an ox is like one who strikes down a man[a]; the one who sacrifices a lamb, like one who breaks a dog’s neck; the one who offers a grain offering, like one who offers pig’s blood; the one who makes a memorial offering of frankincense, like one who blesses wickedness. They too have chosen their own ways[b], and their soul delights in their abominations.
translation:
  language: fr
  text: Celui qui immole un bœuf est comme celui qui abat un homme ; celui qui sacrifie un agneau, comme celui qui brise la nuque d’un chien ; celui qui présente une offrande de céréales, comme celui qui présente du sang de porc ; celui qui offre de l’encens en mémorial, comme celui qui bénit le mal[a]. Eux aussi ont choisi leurs propres voies, et leur âme prend plaisir à leurs abominations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui bénit une idole ». Le mot hébreu peut désigner le mal, l’iniquité ou une réalité idolâtre.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « leur âme prend plaisir » ; le nom et le verbe au singulier sont employés collectivement pour désigner le peuple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹחֵט הַשּׁוֹר
  choice: celui qui immole un bœuf
  rationale: « Immoler » convient au contexte sacrificiel, tandis que « celui qui » conserve la valeur générique du participe hébreu. « Bœuf » désigne naturellement ici l’animal bovin offert.
- source_word: מַכֵּה אִישׁ
  choice: est comme celui qui abat un homme
  rationale: La comparaison implicite est explicitée par « est comme ». « Abat » rend la violence de נכה sans imposer plus précisément que l’hébreu la manière ou l’issue du coup.
- source_word: זוֹבֵחַ הַשֶּׂה
  choice: celui qui sacrifie un agneau
  rationale: שֶׂה peut désigner une jeune bête du petit bétail, ovine ou caprine. « Agneau » est naturel dans ce contexte sacrificiel, sans que le contraste principal du verset en dépende.
- source_word: עֹרֵף כֶּלֶב
  choice: comme celui qui brise la nuque d’un chien
  rationale: ערף décrit l’action de briser la nuque, notamment dans un cadre rituel, plutôt qu’une décapitation ordinaire.
- source_word: מַעֲלֵה מִנְחָה
  choice: celui qui présente une offrande de céréales
  rationale: Dans le vocabulaire cultuel, מִנְחָה désigne ici une offrande végétale ou céréalière. « Présente » exprime simplement l’acte d’offrir sans alourdir la phrase.
- source_word: דַּם חֲזִיר
  choice: comme celui qui présente du sang de porc
  rationale: Le texte hébreu est très elliptique. La reprise de « présente » rend en français la comparaison sous-entendue et maintient la force choquante du sang d’un animal impur.
- source_word: מַזְכִּיר לְבֹנָה
  choice: celui qui offre de l’encens en mémorial
  rationale: Le hiphil de זכר possède ici une valeur cultuelle liée à l’offrande mémoriale. « Encens » est le terme français courant pour la substance aromatique לְבֹנָה dans ce contexte.
- source_word: מְבָרֵךְ אָוֶן
  choice: comme celui qui bénit le mal
  rationale: אָוֶן peut évoquer le mal, l’iniquité ou une réalité idolâtre. « Le mal » garde l’expression concise et moralement forte sans réduire le mot à une idole déterminée.
- source_word: גַּם הֵמָּה בָּחֲרוּ בְּדַרְכֵיהֶם
  choice: Eux aussi ont choisi leurs propres voies
  rationale: « Eux aussi » restitue l’insistance de גַּם הֵמָּה. « Leurs propres voies » fait entendre, dans le contexte, leur orientation volontaire et rebelle.
- source_word: וּבְשִׁקּוּצֵיהֶם נַפְשָׁם חָפֵצָה
  choice: et leur être tout entier prend plaisir à leurs abominations
  rationale: נֶפֶשׁ désigne ici la personne dans son intériorité plutôt qu’une partie immatérielle isolée. Le singulier et le verbe féminin forment une construction collective. « Abominations » conserve le registre prophétique de שִׁקּוּצִים.
theological_decisions:
- issue: Nature des équivalences entre les sacrifices prescrits et les actes odieux
  choice: Exprimer la comparaison implicite par « est comme » et par des reprises elliptiques de « comme celui qui »
  alternative: Présenter les membres comme des identifications directes, sans marque comparative
  rationale: 'L’hébreu juxtapose participes et groupes nominaux sans particule comparative. Dans le contexte, cette juxtaposition produit une équivalence provocante : le culte de personnes rebelles est aussi odieux que les actes mentionnés. La formulation comparative communique ce sens sans préciser davantage le mécanisme du rejet divin.'
- issue: Sens de אָוֶן
  choice: le mal
  alternative: une idole ; l’iniquité
  rationale: Le mot peut avoir une coloration idolâtre, mais il garde une portée sémantique plus large. « Le mal » préserve cette ambiguïté et la condamnation morale du passage sans introduire une idole explicite absente du texte.
- issue: Portée collective de נַפְשָׁם חָפֵצָה
  choice: leur être tout entier prend plaisir
  alternative: leur âme prend plaisir ; ils prennent plaisir
  rationale: La construction emploie littéralement un nom singulier et un verbe singulier féminin pour parler collectivement du groupe. La traduction retenue conserve l’intériorité et l’engagement personnel exprimés par נֶפֶשׁ tout en restant naturelle en français.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le parallélisme prophétique est maintenu au moyen de propositions répétées et d’ellipses naturelles. Les images cultuelles et leur contraste volontairement choquant ne sont ni atténués ni développés au-delà du texte hébreu.
