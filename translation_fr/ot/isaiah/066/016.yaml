  source_fidelity: Le sens judiciaire de נִשְׁפָּט, les deux instruments (« par le feu » et « par son épée »), la portée de « toute chair » et l’aboutissement en de nombreux morts sont bien rendus. « Ceux que Yahweh tuera » transforme toutefois le participe nominal חַלְלֵי (« les tués / les morts frappés ») en verbe actif direct; une forme passive conserve plus exactement la formulation hébraïque.
  naturalness: La succession « et par son épée, contre toute chair » est heurtée en français moderne. Réunir les compléments autour de « exercera son jugement » garde le parallélisme sans cette rupture syntaxique.
  terminology: « Yahweh », « toute chair », « feu » et « épée » sont appropriés et cohérents. « Son jugement » est idiomatique en français et n’ajoute pas une précision théologique absente du texte; le possessif est naturellement impliqué par le sujet divin.
