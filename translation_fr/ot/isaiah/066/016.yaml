source:
  edition: WLC
  text: כִּ֤י בָ/אֵשׁ֙ יְהוָ֣ה נִשְׁפָּ֔ט וּ/בְ/חַרְבּ֖/וֹ אֶת כָּל בָּשָׂ֑ר וְ/רַבּ֖וּ חַֽלְלֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/016.yaml
  text: For by fire Yahweh will execute judgment[a], and by his sword, against all flesh[b]; and many will be those slain by Yahweh.
translation:
  language: fr
  text: Car Yahweh exercera son jugement contre toute chair par le feu et par son épée[a] ; nombreux seront ceux qui seront tués par Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus simplement : « Yahweh jugera toute chair par le feu et par son épée. » Le verbe hébreu peut exprimer soit le fait de juger, soit, plus explicitement, celui d’exercer le jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou la justification de ce qui précède, tout en conservant clairement le lien logique.
- source_word: בָאֵשׁ
  choice: par le feu
  rationale: 'La préposition בְּ a ici une valeur instrumentale : le feu est le moyen du jugement.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin exprimé par le tétragramme, au lieu de lui substituer un titre.
- source_word: נִשְׁפָּט
  choice: exercera le jugement
  rationale: Rend la valeur judiciaire du niphal de שׁפט dans ce contexte sans suggérer que Yahweh serait lui-même jugé. La note conserve la possibilité d’une formulation plus compacte.
- source_word: וּבְחַרְבּוֹ
  choice: et par son épée
  rationale: Conserve la valeur instrumentale de la préposition ainsi que l’image de l’épée, sans décider si elle est littérale ou figurée.
- source_word: אֶת כָּל בָּשָׂר
  choice: contre toute chair
  rationale: Dans cette construction judiciaire, אֶת introduit la partie visée par le jugement. « Toute chair » préserve l’expression prophétique concrète et sa portée universelle.
- source_word: וְרַבּוּ
  choice: nombreux seront
  rationale: La tournure française conserve l’accent final du texte sur le grand nombre des morts.
- source_word: חַלְלֵי יְהוָה
  choice: ceux que Yahweh tuera
  rationale: 'Explicite naturellement en français le rapport du construit hébreu : ces morts sont ceux que Yahweh aura frappés à mort.'
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie le nom propre divin. Sa transcription préserve cette distinction sans remplacer le nom par un titre.
- issue: Portée de כָּל בָּשָׂר
  choice: toute chair
  alternative: toute l’humanité
  rationale: La formulation littérale garde à la fois la portée humaine universelle et l’évocation de la condition corporelle et mortelle, sans réduire l’expression à une abstraction.
- issue: Valeur de נִשְׁפָּט et relation avec אֶת כָּל בָּשָׂר
  choice: Yahweh exercera le jugement… contre toute chair
  alternative: Yahweh jugera toute chair par le feu et par son épée
  rationale: Le choix principal rend explicitement l’action judiciaire du niphal et la relation adversative, tandis que la note signale la construction plus compacte permise par l’hébreu.
translation_notes:
  register: Français international moderne, solennel mais accessible. La structure garde le parallélisme « par le feu… par son épée » et l’expression prophétique « toute chair ». Le point-virgule marque la transition vers le résultat du jugement.
