source:
  edition: WLC
  text: שִׁמְעוּ֙ דְּבַר יְהוָ֔ה הַ/חֲרֵדִ֖ים אֶל דְּבָר֑/וֹ אָמְרוּ֩ אֲחֵי/כֶ֨ם שֹׂנְאֵי/כֶ֜ם מְנַדֵּי/כֶ֗ם לְמַ֤עַן שְׁמִ/י֙ יִכְבַּ֣ד יְהוָ֔ה וְ/נִרְאֶ֥ה בְ/שִׂמְחַתְ/כֶ֖ם וְ/הֵ֥ם יֵבֹֽשׁוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/005.yaml
  text: 'Hear the word of Yahweh[a], you who tremble at his word: Your brothers who hate you, who cast you out for my name’s sake, have said, “Let Yahweh be glorified, that we may see your joy”[b]; but they will be put to shame.'
translation:
  language: fr
  text: 'Écoutez la parole de Yahweh, vous qui tremblez à sa parole : Vos frères, qui vous haïssent et vous excluent à cause de mon nom, ont dit : « Que Yahweh soit glorifié, afin que nous voyions votre joie ! »[a] Mais ce sont eux qui seront couverts de honte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les paroles citées sont probablement une raillerie des frères hostiles. On peut aussi comprendre : « Que Yahweh soit glorifié, et que nous voyions votre joie ! » Certains comprennent autrement le dernier verbe et y voient une référence à l’apparition de Yahweh plutôt qu’à « nous voyions ».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Écoutez
  rationale: L’impératif pluriel appelle directement les destinataires à prêter attention; « Écoutez » est naturel en français tout en conservant la solennité prophétique.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » maintient l’expression prophétique consacrée et la force de la communication divine; le nom propre rend directement le tétragramme.
- source_word: הַחֲרֵדִים אֶל דְּבָרוֹ
  choice: vous qui tremblez à sa parole
  rationale: חרד exprime un tremblement pouvant relever de la crainte révérencielle. La formulation conserve l’image concrète sans la réduire à la seule idée de respect.
- source_word: אֲחֵיכֶם
  choice: Vos frères
  rationale: Le terme familial est conservé; il désigne probablement ici des membres du même peuple et souligne la gravité de leur hostilité.
- source_word: שֹׂנְאֵיכֶם
  choice: qui vous haïssent
  rationale: Le participe est naturellement rendu en français par une proposition relative.
- source_word: מְנַדֵּיכֶם
  choice: vous excluent
  rationale: Dans ce contexte, le verbe désigne vraisemblablement une mise à l’écart sociale ou cultuelle. « Excluent » est précis et idiomatique, tandis que « chassent » ou « bannissent » demeurent possibles.
- source_word: לְמַעַן שְׁמִי
  choice: à cause de mon nom
  rationale: La préposition indique ici le motif déclaré ou le prétexte de l’exclusion. Cette tournure française reste proche du sens sans suggérer que Dieu approuve l’acte.
- source_word: יִכְבַּד יְהוָה
  choice: Que Yahweh soit glorifié
  rationale: L’imparfait à valeur jussive est rendu par un souhait à la troisième personne; le passif préserve l’ambiguïté entre formule pieuse et parole sarcastique.
- source_word: וְנִרְאֶה בְשִׂמְחַתְכֶם
  choice: afin que nous voyions votre joie
  rationale: La forme massorétique se comprend le plus directement comme une première personne du pluriel, « nous verrons/puissions voir ». Le français exprime le lien avec la proposition précédente sans imposer plus fortement que l’hébreu la nuance de moquerie.
- source_word: וְהֵם יֵבֹשׁוּ
  choice: Mais ce sont eux qui seront couverts de honte
  rationale: Le pronom explicite הֵם crée un contraste appuyé. « Ce sont eux » le fait ressortir, et « couverts de honte » exprime la disgrâce future annoncée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte le nom divin propre. « Yahweh » le représente directement et évite de le remplacer par un titre.
- issue: Tonalité de la parole des frères hostiles
  choice: Conserver une formulation pouvant être comprise comme une raillerie ou comme une déclaration pieuse de façade
  alternative: Marquer explicitement le sarcasme dans le corps du texte
  rationale: Le contexte d’hostilité et la honte finale favorisent fortement une lecture sarcastique, mais aucun marqueur lexical n’oblige à l’inscrire directement dans la traduction.
- issue: Sujet de וְנִרְאֶה
  choice: '« nous » : « afin que nous voyions votre joie »'
  alternative: 'Une lecture impliquant l’apparition de Dieu : « qu’il apparaisse dans votre joie »'
  rationale: La vocalisation et la morphologie du texte massorétique favorisent la première personne du pluriel. L’autre interprétation est suffisamment attestée comme difficulté pour être signalée en note sans remplacer la lecture principale.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La syntaxe prophétique et les images fortes de l’hébreu sont conservées, tandis que le contraste final est rendu explicitement par « ce sont eux ». Tous les appels de note du texte correspondent aux notes fournies.
