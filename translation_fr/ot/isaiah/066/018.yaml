  text: וְ/אָנֹכִ֗י מַעֲשֵׂי/הֶם֙ וּ/מַחְשְׁבֹ֣תֵי/הֶ֔ם בָּאָ֕ה לְ/קַבֵּ֥ץ אֶת כָּל הַ/גּוֹיִ֖ם וְ/הַ/לְּשֹׁנ֑וֹת וּ/בָ֖אוּ וְ/רָא֥וּ אֶת כְּבוֹדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/018.yaml
  text: For I know their works and their thoughts[a]. The time is coming to gather all the nations and tongues[b], and they will come and see my glory.
translation:
  language: fr
  text: Car je connais leurs actes et leurs pensées[a]. Le temps vient où je rassemblerai toutes les nations et toutes les langues[b] ; elles viendront et verront ma gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu est abrupt et difficile. Il dit littéralement, de manière elliptique : « Et moi, leurs actes et leurs pensées, vient pour rassembler toutes les nations et les langues. » Le verbe « vient » est au féminin et son sujet n’est pas exprimé. On comprend couramment : « Car je connais leurs actes et leurs pensées ; le temps vient où je rassemblerai… » ou : « À cause de leurs actes et de leurs pensées, je viens rassembler… »'
    reason: alternative_reading
  - marker: b
    text: C’est-à-dire les gens de toutes langues, ou les groupes linguistiques.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Car je
  rationale: Le pronom indépendant אָנֹכִי souligne le locuteur divin. « Car » exprime le lien explicatif probable avec le contexte, tandis que « je » garde l’accent personnel.
- source_word: מַעֲשֵׂיהֶם
  choice: leurs actes
  rationale: מַעֲשֶׂה désigne ici ce qu’ils font. « Actes » est naturel en français moderne et conserve la portée morale du terme.
- source_word: וּמַחְשְׁבֹתֵיהֶם
  choice: et leurs pensées
  rationale: מַחֲשָׁבוֹת peut désigner les pensées, les projets ou les intentions. « Pensées » est le terme le plus large et forme un contraste clair entre l’extérieur et l’intérieur.
- source_word: בָּאָה
  choice: Le temps vient où
  rationale: La forme féminine singulière est syntaxiquement difficile. Cette formulation restitue en français l’annonce imminente ou future sans présenter l’hébreu elliptique comme s’il était univoque; la difficulté est signalée en note.
- source_word: לְקַבֵּץ
  choice: je rassemblerai
  rationale: Le verbe קבץ signifie réunir ou rassembler. Le futur convient à la séquence prophétique et identifie naturellement Dieu comme sujet dans le contexte.
- source_word: כָּל־הַגּוֹיִם
  choice: toutes les nations
  rationale: גּוֹיִם désigne ici l’ensemble des nations. Cette traduction conserve la portée universelle sans introduire l’opposition plus étroite que pourrait suggérer « païens ».
- source_word: וְהַלְּשֹׁנוֹת
  choice: et toutes les langues
  rationale: לְשֹׁנוֹת signifie littéralement « langues » et désigne par métonymie les groupes linguistiques. La répétition de « toutes les » rend l’expression naturelle et explicite en français.
- source_word: וּבָאוּ וְרָאוּ
  choice: elles viendront et verront
  rationale: Les formes verbales appartiennent à la séquence prophétique et sont rendues au futur. Le pronom féminin reprend grammaticalement « les nations » en français.
- source_word: כְּבוֹדִי
  choice: ma gloire
  rationale: כָּבוֹד désigne ici la gloire divine manifestée. « Gloire » conserve sa force théologique et ses résonances dans Ésaïe.
theological_decisions:
- issue: Interprétation de l’ouverture hébraïque abrupte et elliptique
  choice: « Car je connais leurs actes et leurs pensées. Le temps vient où je rassemblerai… »
  alternative: « Et moi — leurs actes et leurs pensées — venant rassembler toutes les nations et toutes les langues… »; ou « À cause de leurs actes et de leurs pensées, je viens rassembler… »
  rationale: Le texte massorétique ne contient explicitement ni le verbe « connaître » ni le nom « temps » et sa syntaxe est difficile. La formulation principale donne le sens contextuel couramment compris et reste intelligible, tandis que la note expose honnêtement l’ellipse et les principales possibilités au lieu de dissimuler l’incertitude.
- issue: Référent de « langues »
  choice: Conserver « langues » comme métonymie des groupes humains
  alternative: « les gens de toutes langues » ou « les groupes linguistiques »
  rationale: La formulation garde l’image hébraïque et l’universalité du rassemblement sans limiter celui-ci à une catégorie ethnique ou confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La phrase principale privilégie la lisibilité, tandis que la note conserve l’ambiguïté réelle de l’hébreu. « Actes », « pensées », « nations » et « gloire » sont des termes courants qui gardent la densité du registre prophétique.
