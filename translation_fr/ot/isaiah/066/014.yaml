  text: וּ/רְאִיתֶם֙ וְ/שָׂ֣שׂ לִבְּ/כֶ֔ם וְ/עַצְמוֹתֵי/כֶ֖ם כַּ/דֶּ֣שֶׁא תִפְרַ֑חְנָה וְ/נוֹדְעָ֤ה יַד יְהוָה֙ אֶת עֲבָדָ֔י/ו וְ/זָעַ֖ם אֶת אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/014.yaml
  text: You will see[a], and your heart will rejoice; your bones will flourish like the grass. The hand of Yahweh will be made known to his servants, and he will be indignant against his enemies.
translation:
  language: fr
  text: Vous verrez, et votre cœur se réjouira ; vos os reprendront vigueur comme l’herbe. La main de Yahweh se fera connaître à ses serviteurs, et il s’indignera contre ses ennemis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Vous le verrez
  rationale: Le qal accompli précédé de la conjonction prend ici, dans le discours prophétique, une valeur future. Le pronom « le » reprend naturellement en français ce qui vient d’être annoncé, sans préciser davantage l’objet implicite de la vision.
- source_word: וְשָׂשׂ לִבְּכֶם
  choice: votre cœur se réjouira
  rationale: Cette formulation conserve l’image hébraïque du cœur comme siège de la joie et reste naturelle en français moderne.
- source_word: וְעַצְמוֹתֵיכֶם כַּדֶּשֶׁא תִפְרַחְנָה
  choice: vos os reprendront vigueur comme l’herbe
  rationale: « Os » maintient l’image corporelle d’un renouvellement profond. Pour פרח, « reprendront vigueur » exprime ici l’essor vital évoqué par la végétation, sans suggérer improprement que les os fleurissent au sens littéral.
- source_word: וְנוֹדְעָה יַד יְהוָה
  choice: La main de Yahweh se fera connaître
  rationale: 'Le nifal de ידע est rendu avec sa valeur passive-résultative : l’action puissante de Yahweh deviendra manifeste. « Main » est conservé comme image biblique de sa puissance agissante.'
- source_word: אֶת עֲבָדָיו
  choice: envers ses serviteurs
  rationale: La particule אֶת présente ici une relation inhabituelle avec נודע. « Envers » préserve une certaine ouverture entre manifestation aux serviteurs et intervention en leur faveur, sans imposer une seule nuance.
- source_word: וְזָעַם אֶת אֹיְבָיו
  choice: et il manifestera son indignation contre ses ennemis
  rationale: La conjonction est traduite directement par « et ». Le verbe exprime l’indignation ou la colère dirigée contre les ennemis ; « manifestera son indignation » convient au parallélisme avec la manifestation de la main divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » représente le nom propre sans le remplacer par un titre.
- issue: Rapport entre les deux dernières propositions
  choice: et il manifestera son indignation contre ses ennemis
  alternative: mais il manifestera son indignation contre ses ennemis
  rationale: Bien qu’un contraste sémantique oppose serviteurs et ennemis, la conjonction hébraïque est simplement coordonnante. « Et » conserve cette forme sans expliciter un rapport adversatif.
- issue: Sens de אֶת après וְנוֹדְעָה
  choice: envers ses serviteurs
  alternative: à ses serviteurs ; en faveur de ses serviteurs
  rationale: La construction peut évoquer la manifestation de la puissance divine aux serviteurs ou son action en leur faveur. « Envers » évite de trancher entièrement cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation conserve les deux mouvements du verset. Les métaphores du cœur, des os et de la main divine sont maintenues, tandis que l’expression concernant les os est formulée idiomatiquement.
