revisions:
- from: Vous le verrez, et votre cœur se réjouira ; vos os reprendront vigueur comme l’herbe. La main de Yahweh se fera connaître envers ses serviteurs, et il manifestera son indignation contre ses ennemis.
  to: Vous verrez, et votre cœur se réjouira ; vos os reprendront vigueur comme l’herbe. La main de Yahweh se fera connaître à ses serviteurs, et il s’indignera contre ses ennemis.
  rationale: La révision supprime l’objet implicite ajouté après « verrez », remplace une tournure française peu naturelle par une formulation idiomatique, et rend directement le verbe final. Elle maintient la coordination par « et », le nom divin Yahweh, les métaphores corporelles et l’ambiguïté relative de la manifestation de la main divine auprès de ses serviteurs.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:37Z'
review_pass:
  verdict: revise
  source_fidelity: La valeur future de וּרְאִיתֶם est bien rendue. « Vos os reprendront vigueur comme l’herbe » restitue de façon idiomatique l’image de renouvellement de תִפְרַחְנָה sans la réduire à une simple prospérité. La proposition sur la main de Yahweh garde l’ambiguïté de la relation avec ses serviteurs, mais « envers » est peu naturel ici. Enfin, « manifestera son indignation » ajoute l’idée de manifester, absente de וְזָעַם, qui énonce directement l’indignation/la colère divine.
  naturalness: Le registre est moderne, digne et globalement naturel. « Vous le verrez » introduit toutefois un pronom objet que l’hébreu ne formule pas, tandis que « se fera connaître envers ses serviteurs » est une collocation maladroite en français. « Se fera connaître à ses serviteurs » est nettement plus idiomatique et ne surinterprète pas de manière importante la construction difficile.
  terminology: « Yahweh » correspond au tétragramme et à la décision éditoriale fournie. « Cœur », « os », « main » et « serviteurs » préservent les images et le registre du texte. « S’indignera contre ses ennemis » rend directement זָעַם sans ajouter un acte de démonstration.
  issues:
  - severity: low
    issue: Pronom objet ajouté dans « Vous le verrez »
    rationale: וּרְאִיתֶם signifie simplement « vous verrez »; son objet est implicite et dépend du contexte. Le français peut tout aussi naturellement le laisser implicite.
  - severity: medium
    issue: « se fera connaître envers ses serviteurs » est peu idiomatique
    rationale: Dans ce contexte, « envers » sonne administratif et ne se combine pas naturellement avec « se faire connaître ». « À ses serviteurs » rend la manifestation/reconnaissance tout en évitant l’explicitation plus forte de « en faveur de ».
  - severity: medium
    issue: « il manifestera son indignation » explicite un élément absent du verbe hébreu
    rationale: וְזָעַם exprime l’indignation ou la colère dirigée contre les ennemis; il ne signifie pas littéralement « manifester » cette indignation. Une formulation verbale directe conserve mieux la concision et le parallélisme du texte.
  revised_text: Vous verrez, et votre cœur se réjouira ; vos os reprendront vigueur comme l’herbe. La main de Yahweh se fera connaître à ses serviteurs, et il s’indignera contre ses ennemis.
  revised_footnotes: []
  revision_rationale: La révision supprime l’objet implicite ajouté après « verrez », remplace une tournure française peu naturelle par une formulation idiomatique, et rend directement le verbe final. Elle maintient la coordination par « et », le nom divin Yahweh, les métaphores corporelles et l’ambiguïté relative de la manifestation de la main divine auprès de ses serviteurs.
