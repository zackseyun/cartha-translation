base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/011.yaml
  text: so that you may nurse and be satisfied from her comforting breast[c][b][a], so that you may drink deeply and delight yourselves from the abundance of her glory.
translation:
  language: fr
  text: afin que vous tétiez et soyez rassasiés du sein de ses consolations[a], afin que vous tiriez à longs traits de l’abondance de sa gloire[c] et vous en délectiez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du sein de ses consolations ».'
    reason: La formulation hébraïque associe concrètement le sein maternel aux consolations données par Jérusalem.
  - marker: b
    text: 'Ou : « vous vous délectiez » ou « vous vous réjouissiez pleinement ». Le verbe hébreu exprime le fait de prendre un profond plaisir.'
    reason: Le hitpael de ענג comporte une nuance réfléchie de délice intense.
  - marker: c
    text: Le nom hébreu traduit par « abondance » peut aussi être compris comme « plénitude » ou « débordement ».
    reason: Le sens précis de זִיז dans ce passage est incertain.
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat dans les deux propositions et reproduit naturellement leur parallélisme.
- source_word: תִּינְקוּ
  choice: vous soyez allaités
  rationale: Le verbe ינק évoque le nourrisson qui tète. La tournure française garde clairement l’image maternelle sans la rudesse possible de « sucer ».
- source_word: וּשְׂבַעְתֶּם
  choice: et rassasiés
  rationale: שבע exprime le fait d’être pleinement nourri et satisfait; « rassasiés » convient au contexte d’allaitement.
- source_word: מִשֹּׁד תַּנְחֻמֶיהָ
  choice: au sein de ses consolations
  rationale: Rend assez formellement l’expression « du sein de ses consolations », tout en employant « au sein » de manière idiomatique après « allaités et rassasiés ».
- source_word: תָּמֹצּוּ
  choice: vous puisiez à longs traits
  rationale: Le verbe poursuit l’image d’une aspiration abondante. Cette formulation française conserve l’intensité sans réduire l’action au simple fait de boire.
- source_word: וְהִתְעַנַּגְתֶּם
  choice: et trouviez votre délice
  rationale: Exprime la valeur réfléchie du hitpael et l’idée d’une jouissance profonde dans un registre digne et courant.
- source_word: מִזִּיז
  choice: dans l’abondance de
  rationale: זִיז est rare et difficile; « abondance » représente une compréhension courante, tandis que « dans » donne en français la relation naturelle avec « trouver son délice ».
- source_word: כְּבוֹדָהּ
  choice: sa gloire
  rationale: כבוד désigne ici la gloire ou la splendeur de Jérusalem personnifiée; « gloire » préserve le vocabulaire majeur d’Ésaïe.
theological_decisions:
- issue: Image maternelle de Jérusalem/Sion
  choice: Conserver directement l’image de Jérusalem comme mère qui allaite et console.
  alternative: Généraliser l’image en parlant seulement de réconfort divin.
  rationale: Le contexte personnifie Jérusalem comme une mère. La traduction ne doit ni effacer cette image corporelle ni l’allégoriser au-delà du texte.
- issue: Sens du nom rare זִיז
  choice: abondance
  alternative: plénitude ou débordement
  rationale: Le terme demeure lexicalement incertain. Le texte retient une option plausible et la note signale les autres sans trancher davantage.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme des deux « afin que » est maintenu. L’image corporelle de l’allaitement demeure explicite, tandis que les termes rares ou ambigus sont signalés en notes.
