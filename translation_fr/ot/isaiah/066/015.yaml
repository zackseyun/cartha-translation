  text: כִּֽי הִנֵּ֤ה יְהוָה֙ בָּ/אֵ֣שׁ יָב֔וֹא וְ/כַ/סּוּפָ֖ה מַרְכְּבֹתָ֑י/ו לְ/הָשִׁ֤יב בְּ/חֵמָה֙ אַפּ֔/וֹ וְ/גַעֲרָת֖/וֹ בְּ/לַהֲבֵי אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/015.yaml
  text: For look[a], Yahweh will come in fire, and his chariots like the whirlwind[c][b], to repay his anger in fury and his rebuke with flames of fire.
translation:
  language: fr
  text: 'Car voici : Yahweh vient dans le feu[a], et ses chars sont comme la tempête[b], pour exercer sa colère avec fureur[c] et sa réprimande avec des flammes de feu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec le feu » ; la préposition hébraïque peut indiquer le cadre dans lequel Yahweh vient ou ce qui accompagne sa venue.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme le tourbillon » ; le mot hébreu désigne une tempête violente.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « pour faire revenir sa colère dans la fureur » ; le verbe peut aussi exprimer l’idée de rendre, d’exécuter ou de rétribuer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Car voici
  rationale: כִּי relie l’annonce à son contexte explicatif, tandis que הִנֵּה attire vivement l’attention. « Car voici » conserve ces deux fonctions dans un registre français digne et intelligible.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription usuelle du tétragramme, qui préserve ici le nom divin présent dans le texte hébreu.
- source_word: בָּאֵשׁ יָבוֹא
  choice: vient dans le feu
  rationale: Le présent prophétique français rend naturellement l’annonce vive de l’imparfait hébreu. « Dans le feu » conserve la valeur spatiale ou circonstancielle possible de ב sans la réduire à un simple instrument.
- source_word: וְכַסּוּפָה מַרְכְּבֹתָיו
  choice: et ses chars sont comme la tempête
  rationale: La proposition hébraïque est nominale et compare les chars à une סוּפָה, violente tempête ou tourbillon. L’ajout français de « sont » explicite seulement la syntaxe.
- source_word: לְהָשִׁיב
  choice: pour déverser
  rationale: Le hiphil de שׁוב signifie littéralement faire revenir ou rendre. Avec la colère comme objet, « déverser » exprime naturellement en français sa mise à exécution, sans suggérer que la colère elle-même reçoit un remboursement.
- source_word: בְּחֵמָה אַפּוֹ
  choice: sa colère avec fureur
  rationale: 'La formulation maintient les deux termes distincts : אַף désigne ici la colère, et חֵמָה son caractère ardent et furieux.'
- source_word: וְגַעֲרָתוֹ בְּלַהֲבֵי אֵשׁ
  choice: et sa réprimande dans des flammes de feu
  rationale: « Réprimande » garde la dimension verbale et autoritaire de גְּעָרָה. « Dans des flammes de feu » reproduit l’image et le parallélisme avec « dans le feu ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre la colère, la fureur et le verbe לְהָשִׁיב
  choice: pour déverser sa colère avec fureur
  alternative: pour rendre sa colère dans la fureur
  rationale: La solution retenue exprime en français l’exécution de la colère divine tout en gardant distincts אַף et חֵמָה. La note signale le sens plus littéral du verbe afin de ne pas masquer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le vers conserve la vigueur de l’annonce prophétique, le parallélisme des deux mentions du feu et l’image martiale des chars. Les variantes sémantiques réelles sont données en notes.
