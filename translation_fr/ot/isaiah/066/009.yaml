  text: הַ/אֲנִ֥י אַשְׁבִּ֛יר וְ/לֹ֥א אוֹלִ֖יד יֹאמַ֣ר יְהוָ֑ה אִם אֲנִ֧י הַ/מּוֹלִ֛יד וְ/עָצַ֖רְתִּי אָמַ֥ר אֱלֹהָֽיִ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/009.yaml
  text: Shall I bring to the point of birth and not cause to give birth? says Yahweh[a]. Shall I, who cause to give birth[c][b], shut the womb? says your God.
translation:
  language: fr
  text: Est-ce que je conduirais jusqu’au moment de l’accouchement sans faire naître ? dit Yahweh[a]. Est-ce que moi, qui fais naître, je fermerais la matrice[b] ? dit ton Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conduirais-je jusqu’au point de rupture » ; l’hébreu emploie une image d’accouchement pour évoquer le moment de la délivrance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « retenir » ou « fermer » ; l’objet est sous-entendu en hébreu et précisé ici, d’après l’image de l’accouchement, par « la matrice ».
    reason: lexical_alternative
  - marker: c
    text: 'En hébreu, « ton » est au féminin singulier : Dieu s’adresse à Sion/Jérusalem, présentée comme une femme dans le contexte.'
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁבִּיר
  choice: conduirais jusqu’au moment de l’accouchement
  rationale: Le hiphil de שׁבר relève ici de l’image de l’accouchement et désigne l’action de mener la grossesse jusqu’au moment critique de la délivrance, non celle de briser au sens littéral.
- source_word: אוֹלִיד / הַמּוֹלִיד
  choice: faire naître / qui fais naître
  rationale: Le hiphil de ילד est causatif. « Faire naître » en conserve la valeur tout en restant naturel et digne en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אִם
  choice: Est-ce que
  rationale: Dans le parallélisme, אִם introduit la seconde question rhétorique. Une seconde interrogation directe rend naturellement cette fonction sans imposer une valeur conditionnelle.
- source_word: וְעָצַרְתִּי
  choice: je fermerais le sein maternel
  rationale: עצר signifie retenir, arrêter ou fermer. Le contexte obstétrical permet d’expliciter l’objet sous-entendu; « sein maternel » désigne ici la matrice sans employer le terme médical plus étroit « utérus ».
- source_word: אֱלֹהָיִךְ
  choice: ton Dieu
  rationale: Le suffixe de deuxième personne féminine singulière exprime l’adresse directe à Sion/Jérusalem; le français « ton » s’accorde grammaticalement avec « Dieu » et ne peut signaler à lui seul le genre de la destinataire.
theological_decisions:
- issue: Rendre l’image de l’accouchement sans la surinterpréter ni l’aplanir
  choice: Conserver les deux questions rhétoriques et présenter Dieu comme celui qui mène au moment de l’accouchement et fait naître.
  alternative: 'Traduire plus dynamiquement : « Commencerais-je l’accouchement sans le mener à terme ? »'
  rationale: La formulation retenue garde l’assurance rhétorique que Dieu n’interrompra pas l’œuvre commencée pour Sion, sans transformer l’image en affirmation doctrinale plus large.
- issue: Expliciter l’objet absent de וְעָצַרְתִּי
  choice: Ajouter « le sein maternel » comme objet contextuellement implicite.
  alternative: Traduire simplement « me retiendrais-je ? » ou « empêcherais-je la naissance ? »
  rationale: L’hébreu laisse l’objet implicite. L’explicitation rend l’image compréhensible en français tout en restant contrôlée par le contexte immédiat.
translation_notes:
  register: Français international moderne, courant et digne. Les questions rhétoriques préservent le parallélisme. « Faire naître » garde la causalité des formes hébraïques; « accouchement » rend l’image clairement accessible.
