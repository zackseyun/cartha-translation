id: ISA.66.23
reference: Isaiah 66:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה מִֽ/דֵּי חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ וּ/מִ/דֵּ֥י שַׁבָּ֖ת בְּ/שַׁבַּתּ֑/וֹ יָב֧וֹא כָל בָּשָׂ֛ר לְ/הִשְׁתַּחֲוֺ֥ת לְ/פָנַ֖/י אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/023.yaml
  text: And it shall be[a], from new moon to its new moon and from Sabbath to its Sabbath, all flesh shall come to bow down before me[b], says Yahweh.
translation:
  language: fr
  text: 'Et voici ce qui arrivera : de nouvelle lune en nouvelle lune et de sabbat en sabbat, toute chair viendra se prosterner devant moi[a], dit Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Toute chair » est une expression hébraïque qui peut désigner toute l’humanité, tout en conservant l’idée d’une vie créée et incarnée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Et voici ce qui arrivera
  rationale: Rend la formule prophétique annonçant une situation future dans un français actuel et solennel, sans archaïsme.
- source_word: מִדֵּי חֹדֶשׁ בְּחָדְשׁוֹ
  choice: de nouvelle lune en nouvelle lune
  rationale: L’expression marque une récurrence régulière. Dans le parallèle avec le sabbat, חֹדֶשׁ désigne naturellement la nouvelle lune comme repère cultuel; la tournure française idiomatique exprime la succession mensuelle sans reproduire artificiellement le suffixe hébreu.
- source_word: וּמִדֵּי שַׁבָּת בְּשַׁבַּתּוֹ
  choice: et de sabbat en sabbat
  rationale: Conserve le terme cultuel et le parallélisme, tout en exprimant naturellement la récurrence hebdomadaire.
- source_word: יָבוֹא
  choice: viendra
  rationale: Futur simple de בוא, indiquant le mouvement vers la présence divine.
- source_word: כָל בָּשָׂר
  choice: toute chair
  rationale: Préserve l’expression hébraïque et sa portée universelle ainsi que sa nuance de vie humaine incarnée, sans réduire explicitement le référent à « tous les peuples ».
- source_word: לְהִשְׁתַּחֲוֺת
  choice: se prosterner
  rationale: Rend le geste concret d’abaissement corporel accompli dans l’adoration.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Équivalent français direct indiquant la présence face à Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de le remplacer par un titre.
theological_decisions:
- issue: Sens de חֹדֶשׁ dans le cadre de l’adoration annoncée
  choice: nouvelle lune
  alternative: mois
  rationale: Le parallélisme avec le sabbat et la récurrence cultuelle favorisent « nouvelle lune ». Ce choix conserve la texture liturgique sans trancher la question plus large de la permanence de ces observances.
- issue: Étendue de כָל בָּשָׂר
  choice: toute chair
  alternative: toute l’humanité
  rationale: L’expression source est maintenue afin de préserver à la fois son emploi naturel pour l’ensemble des humains dans ce contexte et sa résonance plus large de créatures incarnées.
translation_notes:
  register: Français international moderne, digne et prophétique. « De nouvelle lune en nouvelle lune » et « de sabbat en sabbat » privilégient une formulation française naturelle de la récurrence plutôt qu’un calque des suffixes hébreux. Le terme « chair » est conservé et expliqué en note.
