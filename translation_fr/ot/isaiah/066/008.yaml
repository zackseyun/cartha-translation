source:
  edition: WLC
  text: מִֽי שָׁמַ֣ע כָּ/זֹ֗את מִ֤י רָאָה֙ כָּ/אֵ֔לֶּה הֲ/י֤וּחַל אֶ֨רֶץ֙ בְּ/י֣וֹם אֶחָ֔ד אִם יִוָּ֥לֵֽד גּ֖וֹי פַּ֣עַם אֶחָ֑ת כִּֽי חָ֛לָה גַּם יָלְדָ֥ה צִיּ֖וֹן אֶת בָּנֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/008.yaml
  text: Who has heard such a thing? Who has seen things like these? Can a land be brought forth in one day? Can a nation be born all at once? For Zion was in labor and also gave birth to her children[a].
translation:
  language: fr
  text: Qui a entendu chose pareille ? Qui a vu de telles choses ? Un pays peut-il être mis au monde en un seul jour ? Une nation peut-elle naître d’un seul coup ? Car Sion a été en travail et elle a aussi donné naissance à ses enfants[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ses fils ».'
    reason: Alternative lexicale reflétant le masculin pluriel de l’hébreu.
lexical_decisions:
- source_word: כָּזֹאת
  choice: chose pareille
  rationale: Cette tournure française naturelle conserve le démonstratif singulier et la force étonnée de la question rhétorique.
- source_word: כָּאֵלֶּה
  choice: de telles choses
  rationale: Le pluriel de l’hébreu est maintenu et forme un parallélisme naturel avec la première question.
- source_word: הֲיוּחַל אֶרֶץ
  choice: Un pays peut-il être mis au monde
  rationale: « Mis au monde » préserve l’image de l’accouchement portée par le verbe passif, tandis que « pays » convient au parallèle avec « nation » sans réduire אֶרֶץ à la planète entière.
- source_word: בְּיוֹם אֶחָד
  choice: en un seul jour
  rationale: La formulation est claire et souligne naturellement l’unicité du jour.
- source_word: אִם יִוָּלֵד גּוֹי
  choice: Une nation peut-elle naître
  rationale: אִם introduit ici la seconde question rhétorique; « naître » rend directement le passif de ילד.
- source_word: פַּעַם אֶחָת
  choice: d’un seul coup
  rationale: Cette expression idiomatique communique la simultanéité et le caractère soudain de l’événement sans imposer une durée précise.
- source_word: כִּי
  choice: Car
  rationale: Le connecteur introduit l’explication qui fonde les questions précédentes.
- source_word: חָלָה
  choice: a été en travail
  rationale: Cette expression moderne conserve explicitement l’image des douleurs et du processus de l’accouchement.
- source_word: גַּם יָלְדָה
  choice: elle a aussi donné naissance
  rationale: « Aussi » représente גַּם sans ajouter l’idée non explicite de « dès que »; « donné naissance » rend clairement ילד.
- source_word: בָּנֶיהָ
  choice: ses enfants
  rationale: Le masculin pluriel désigne ici collectivement la descendance de Sion; « enfants » exprime cette portée tout en signalant la forme littérale en note.
theological_decisions:
- issue: Personnification maternelle de Sion
  choice: Conserver Sion comme mère personnifiée, en travail puis donnant naissance à ses enfants.
  alternative: Paraphraser l’image comme une restauration nationale sans maternité explicite.
  rationale: Le texte hébreu attribue directement à Sion le travail et l’enfantement; maintenir cette tension imagée évite de transformer la métaphore prophétique en interprétation abstraite.
- issue: Portée de בָּנֶיהָ
  choice: Employer « ses enfants » dans le texte principal.
  alternative: Employer « ses fils ».
  rationale: La forme hébraïque est masculine plurielle, mais elle désigne vraisemblablement la descendance collective de Sion plutôt que les seuls hommes. La traduction littérale reste disponible en note.
translation_notes:
  register: Français international actuel, digne et accessible. Les questions rhétoriques et le parallélisme poétique sont conservés; l’image obstétricale demeure explicite sans archaïsme.
