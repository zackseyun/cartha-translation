  text: הַ/מִּתְקַדְּשִׁ֨ים וְ/הַ/מִּֽטַּהֲרִ֜ים אֶל הַ/גַּנּ֗וֹת אַחַ֤ר אחד בַּ/תָּ֔וֶךְ אֹֽכְלֵי֙ בְּשַׂ֣ר הַ/חֲזִ֔יר וְ/הַ/שֶּׁ֖קֶץ וְ/הָ/עַכְבָּ֑ר יַחְדָּ֥ו יָסֻ֖פוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/017.yaml
  text: Those who sanctify themselves and purify themselves to go into the gardens[a], following one in the midst, eating the flesh of pigs and detestable things and mice, shall come to an end together, declares Yahweh.
translation:
  language: fr
  text: Ceux qui se consacrent et se purifient pour aller dans les jardins, suivant quelqu’un au milieu[a], mangeant de la viande de porc, des choses répugnantes et des souris, périront tous ensemble, déclare Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « après un, au milieu ». L’expression hébraïque est difficile ; elle peut évoquer des personnes qui suivent un responsable rituel, qui suivent quelqu’un vers le centre ou qui avancent l’une après l’autre dans un rite.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּתְקַדְּשִׁים
  choice: ceux qui se consacrent
  rationale: Le participe hitpael de קדשׁ exprime une consécration réflexive. « Se consacrent » garde la dimension rituelle et l’ironie d’une sainteté recherchée dans un culte condamné.
- source_word: וְהַמִּטַּהֲרִים
  choice: et se purifient
  rationale: Le hitpael de טהר est réflexif et désigne ici une purification rituelle; cette formulation s’accorde naturellement avec « se consacrent ».
- source_word: אֶל הַגַּנּוֹת
  choice: pour aller dans les jardins
  rationale: אֶל indique le mouvement vers les jardins. L’ajout de « aller » explicite en français le mouvement sous-entendu sans préciser davantage la nature du rite.
- source_word: אַחַר אחד בַּתָּוֶךְ
  choice: derrière quelqu’un au milieu
  rationale: La construction est obscure. Cette formulation demeure proche des éléments hébreux, laisse le référent indéterminé et évite d’identifier arbitrairement un chef rituel, une idole ou une procession.
- source_word: אֹכְלֵי בְּשַׂר הַחֲזִיר
  choice: ceux qui mangent de la viande de porc
  rationale: Le participe poursuit la caractérisation du groupe. « Viande de porc » est l’expression française actuelle et concrète correspondant à בְּשַׂר הַחֲזִיר.
- source_word: הַשֶּׁקֶץ
  choice: des choses répugnantes
  rationale: Le terme désigne ce qui inspire le dégoût, notamment dans un cadre rituel. « Choses répugnantes » reste accessible et ne réduit pas indûment le mot à une catégorie particulière.
- source_word: הָעַכְבָּר
  choice: des souris
  rationale: עַכְבָּר désigne normalement la souris; « rats » reste possible selon le contexte zoologique, mais est moins sûr.
- source_word: יַחְדָּו יָסֻפוּ
  choice: connaîtront tous ensemble leur fin
  rationale: יַחְדָּו souligne le sort collectif, tandis que סוף exprime ici le fait d’être amené à sa fin. La formulation française garde ce sens sans préciser le mode du jugement.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: La formule prophétique nominale est rendue avec solennité, et le nom divin יהוה est translittéré « Yahweh ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur; l’Éternel; Jéhovah
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère propre du nom divin sans le remplacer par un titre.
- issue: Interprétation de la formule cultuelle obscure אַחַר אחד בַּתָּוֶךְ
  choice: derrière quelqu’un au milieu
  alternative: à la suite d’un seul au milieu; derrière celui qui est au centre; l’un après l’autre
  rationale: L’hébreu est réellement difficile et semble évoquer un rite condamné sans en rendre les détails certains. Le texte principal conserve cette tension, et la note présente les principales possibilités sans imposer une identification doctrinale.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme participial est conservé par la reprise de « ceux qui ». La tournure volontairement inhabituelle « derrière quelqu’un au milieu » reflète l’obscurité du texte source et est éclairée par une note.
