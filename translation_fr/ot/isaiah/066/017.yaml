revisions:
- from: Ceux qui se consacrent et se purifient pour aller dans les jardins, derrière quelqu’un au milieu[a], ceux qui mangent de la viande de porc, des choses répugnantes et des souris, connaîtront tous ensemble leur fin — déclaration de Yahweh.
  to: Ceux qui se consacrent et se purifient pour aller dans les jardins, suivant quelqu’un au milieu[a], mangeant de la viande de porc, des choses répugnantes et des souris, périront tous ensemble, déclare Yahweh.
  rationale: La révision améliore l’idiomaticité française de la séquence cultuelle sans résoudre son ambiguïté, et remplace une périphrase affaiblie par « périront », qui rend plus directement l’issue de jugement exprimée par le verbe hébreu. Les autres choix lexicaux et le nom divin sont conservés.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:38:36Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet rend correctement les participes réflexifs (« se consacrent », « se purifient »), le mouvement vers les jardins, les aliments mentionnés et le jugement collectif. Toutefois, « connaîtront tous ensemble leur fin » atténue et reformule inutilement יָסֻפוּ, qui annonce leur disparition/périssement. La formule obscure אַחַר אֶחָד בַּתָּוֶךְ doit demeurer non résolue, sans que le français devienne artificiellement opaque.
  naturalness: « Derrière quelqu’un au milieu » est peu idiomatique en français moderne et peut donner l’impression d’une localisation physique incohérente. « Suivant quelqu’un au milieu » reste volontairement elliptique, conformément à l’hébreu difficile, tout en étant plus lisible. Une chaîne homogène de participes rend aussi mieux la description du groupe.
  terminology: « Yahweh » reproduit de manière cohérente le tétragramme. « Viande de porc », « choses répugnantes » et « souris » sont exacts et d’un registre moderne. « Périront » exprime naturellement le sens de destruction ou de disparition de יספו sans en préciser le moyen.
  issues:
  - severity: medium
    issue: Rendu de יָסֻפוּ
    rationale: « Connaîtront ... leur fin » décrit une expérience plutôt que l’aboutissement destructeur annoncé par le verbe. « Périront » est plus direct et fidèle.
  - severity: low
    issue: Formulation française de la locution cultuelle obscure
    rationale: « Derrière quelqu’un au milieu » est grammaticalement possible mais très heurté. « Suivant quelqu’un au milieu » conserve l’ambiguïté du texte tout en améliorant la lisibilité.
  - severity: low
    issue: Note littérale
    rationale: « Après un, au milieu » reflète plus directement אַחַר אֶחָד בַּתָּוֶךְ que « derrière un au milieu » et évite de présenter « derrière » comme seule valeur possible de אַחַר.
