id: ISA.66.6
reference: Isaiah 66:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ק֤וֹל שָׁאוֹן֙ מֵ/עִ֔יר ק֖וֹל מֵֽ/הֵיכָ֑ל ק֣וֹל יְהוָ֔ה מְשַׁלֵּ֥ם גְּמ֖וּל לְ/אֹיְבָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/006.yaml
  text: A sound of uproar from the city[a], a sound from the temple[c][b], the sound of Yahweh repaying recompense to his enemies.
translation:
  language: fr
  text: 'Un bruit[a] de tumulte[b] vient de la ville, un bruit vient du Temple[c] : c’est le bruit de Yahweh, qui rend à ses ennemis ce qui leur est dû.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son » ou « voix » à chacune des trois occurrences ; l’hébreu répète le même mot pour produire un effet rhétorique.
    reason: lexical_alternative
  - marker: b
    text: Ou « fracas », « grondement » ou « vacarme ».
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu rendu par « Temple » peut aussi signifier « palais » dans d’autres contextes.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  choice: bruit
  rationale: Le mot peut désigner un bruit, un son ou une voix. Ici, il introduit une scène auditive sans paroles rapportées. « Bruit » convient aux trois occurrences et permet de préserver la répétition rhétorique de l’hébreu.
- source_word: שָׁאוֹן
  choice: tumulte
  rationale: Le terme évoque une agitation bruyante, voire violente. « Tumulte » conserve cette intensité et le registre solennel du jugement.
- source_word: מֵעִיר
  choice: vient de la ville
  rationale: La préposition מִן indique la provenance. L’ajout naturel du verbe « vient » explicite en français la proposition nominale hébraïque sans changer l’image d’un bruit provenant de la ville.
- source_word: מֵהֵיכָל
  choice: vient du Temple
  rationale: הֵיכָל peut signifier « palais » ou « temple ». Dans ce contexte concernant Jérusalem et le jugement divin, « Temple » est le référent le plus probable.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération rend le nom divin personnel présent dans le texte hébreu, plutôt que de lui substituer un titre.
- source_word: מְשַׁלֵּם גְּמוּל
  choice: rend … ce qui leur est dû
  rationale: La combinaison exprime l’action de rétribuer ou de rendre en retour. Cette formulation française évite une redondance artificielle tout en conservant la portée judiciaire de l’expression.
- source_word: לְאֹיְבָיו
  choice: à ses ennemis
  rationale: La préposition לְ introduit ici les destinataires de la rétribution. « À ses ennemis » en donne une traduction directe.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Yahvé
  rationale: Le texte emploie explicitement le tétragramme. « Yahweh » préserve le nom propre et évite de le remplacer par un titre ; « Yahvé » est une autre forme française traditionnelle.
- issue: Nature de la rétribution divine
  choice: rend à ses ennemis ce qui leur est dû
  alternative: rétribue ses ennemis
  rationale: L’expression conserve l’idée de juste retour portée par מְשַׁלֵּם גְּמוּל sans préciser au-delà du texte la forme exacte du châtiment.
translation_notes:
  register: Français moderne, clair et solennel. La triple répétition de « bruit » reproduit l’insistance de l’hébreu ; les verbes nécessaires en français sont ajoutés avec retenue. La majuscule à « Temple » signale ici le sanctuaire de Jérusalem.
