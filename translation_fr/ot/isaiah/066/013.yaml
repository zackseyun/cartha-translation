source:
  edition: WLC
  text: כְּ/אִ֕ישׁ אֲשֶׁ֥ר אִמּ֖/וֹ תְּנַחֲמֶ֑/נּוּ כֵּ֤ן אָֽנֹכִי֙ אֲנַ֣חֶמְ/כֶ֔ם וּ/בִ/ירֽוּשָׁלִַ֖ם תְּנֻחָֽמוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/013.yaml
  text: As one whom his mother comforts[a], so I will comfort you; and in Jerusalem you will be comforted.
translation:
  language: fr
  text: Comme un homme que sa mère console[a], ainsi, moi, je vous consolerai ; et à Jérusalem, vous serez consolés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme quelqu’un que sa mère console. » L’hébreu porte littéralement « un homme » (אִישׁ), employé ici dans une comparaison de portée représentative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּאִישׁ
  choice: Comme un homme
  rationale: אִישׁ est un nom masculin singulier qui introduit ici la comparaison. « Un homme » en conserve la forme explicite et la portée représentative.
- source_word: אֲשֶׁר אִמּוֹ תְּנַחֲמֶנּוּ
  choice: que sa mère console
  rationale: La relative française exprime naturellement que l’homme est l’objet de la consolation de sa mère; le pronom objet hébreu est implicitement repris par « que ».
- source_word: כֵּן אָנֹכִי
  choice: ainsi moi, je
  rationale: « Ainsi » marque la correspondance de la comparaison, tandis que « moi, je » rend l’insistance du pronom indépendant אָנֹכִי sans lourdeur excessive.
- source_word: אֲנַחֶמְכֶם
  choice: je vous consolerai
  rationale: Le futur français convient à la promesse et « consoler » rend le piel de נחם tout en permettant de conserver la répétition du même radical.
- source_word: וּבִירוּשָׁלַם
  choice: et à Jérusalem
  rationale: Avec un nom de ville, le français idiomatique emploie « à ». Le syntagme peut exprimer le lieu où la consolation promise sera vécue.
- source_word: תְּנֻחָמוּ
  choice: vous serez consolés
  rationale: Cette formulation préserve la valeur passive et la troisième occurrence du thème נחם dans le verset.
theological_decisions:
- issue: Langage masculin représentatif dans la comparaison
  choice: Comme un homme
  alternative: Comme quelqu’un
  rationale: Le texte hébreu emploie explicitement אִישׁ, « homme », au masculin singulier. Le conserver respecte l’image source et sa portée représentative, tandis que la note signale l’expression française plus générale.
- issue: Insistance du pronom divin אָנֹכִי
  choice: ainsi moi, je vous consolerai
  alternative: ainsi je vous consolerai
  rationale: Le redoublement français « moi, je » fait entendre l’emphase du pronom indépendant hébreu sans transformer l’énoncé en affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « consoler » est volontaire afin de reproduire les trois emplois du radical נחם. Le point-virgule distingue la comparaison et sa réalisation localisée sans rompre leur unité.
