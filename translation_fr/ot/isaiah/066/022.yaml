source:
  edition: WLC
  text: כִּ֣י כַ/אֲשֶׁ֣ר הַ/שָּׁמַ֣יִם הַ֠/חֳדָשִׁים וְ/הָ/אָ֨רֶץ הַ/חֲדָשָׁ֜ה אֲשֶׁ֨ר אֲנִ֥י עֹשֶׂ֛ה עֹמְדִ֥ים לְ/פָנַ֖/י נְאֻם יְהוָ֑ה כֵּ֛ן יַעֲמֹ֥ד זַרְעֲ/כֶ֖ם וְ/שִׁמְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/022.yaml
  text: For just as the new heavens and the new earth that I am making shall remain before me[a], declares Yahweh, so your offspring and your name shall remain.
translation:
  language: fr
  text: Car, tout comme les cieux nouveaux et la terre nouvelle que je crée subsistent devant moi[a] — déclare Yahweh —, ainsi votre descendance et votre nom subsisteront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se tiennent » ou « demeurent » ; la même racine verbale hébraïque est employée ensuite pour la descendance et le nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison ou l’explication de l’affirmation précédente et maintient le lien discursif.
- source_word: כַאֲשֶׁר ... כֵּן
  choice: tout comme ... ainsi
  rationale: Préserve clairement la structure comparative corrélative de l’hébreu dans un français naturel et soutenu.
- source_word: הַשָּׁמַיִם הַחֳדָשִׁים וְהָאָרֶץ הַחֲדָשָׁה
  choice: le nouveau ciel et la nouvelle terre
  rationale: Rend les articles définis et emploie la formulation française biblique naturelle; le pluriel hébreu שָׁמַיִם se traduit idiomatiquement par le singulier collectif « ciel ».
- source_word: עֹשֶׂה
  choice: je fais
  rationale: Le participe présente l’action divine comme actuelle ou imminente; le présent français conserve cette ouverture aspectuelle sans imposer un futur explicite.
- source_word: עֹמְדִים / יַעֲמֹד
  choice: subsisteront
  rationale: Dans les deux propositions, le verbe exprime ici la permanence ou la continuité. Répéter le même verbe français préserve la comparaison et la cohésion lexicale.
- source_word: לְפָנַי
  choice: devant moi
  rationale: Correspondance directe qui conserve la dimension relationnelle et spatiale sans l’expliciter davantage.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: Restitue avec solennité la formule prophétique nominale et conserve le nom divin.
- source_word: זַרְעֲכֶם
  choice: votre descendance
  rationale: Exprime naturellement en français la valeur collective de זֶרַע, sans l’ambiguïté biologique que pourrait produire ici « semence ».
- source_word: וְשִׁמְכֶם
  choice: et votre nom
  rationale: Conserve l’image concrète de l’hébreu sans la réduire à la seule renommée.
theological_decisions:
- issue: Portée eschatologique du « nouveau ciel et de la nouvelle terre »
  choice: Conserver directement l’expression de renouvellement cosmique.
  alternative: L’interpréter explicitement soit comme une création future strictement littérale, soit comme une simple métaphore de la restauration de l’alliance.
  rationale: Le texte ne tranche pas lui-même entre ces précisions interprétatives; la formulation maintient donc toute sa portée théologique.
- issue: Identité de la descendance dont la permanence est promise
  choice: Laisser « votre descendance et votre nom » sans en préciser davantage le référent théologique.
  alternative: Identifier explicitement cette descendance à l’Israël ethnique, au reste fidèle ou au peuple eschatologique de Dieu.
  rationale: Le verset promet une continuité durable, mais ne définit pas ici à lui seul toute l’étendue du groupe concerné.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « tout comme ... ainsi » conserve le parallélisme hébreu. « Subsisteront » rend la durée promise tout en permettant à la note de signaler le sens plus littéral « se tenir ».
