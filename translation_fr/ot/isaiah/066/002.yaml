  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du TM : l’acte créateur (« ma main l’a fait »), l’existence qui en résulte, la formule prophétique, puis le contraste introduisant celui vers qui Yahweh porte son regard. « Pauvre et abattu d’esprit » respecte la portée de עָנִי et נְכֵה רוּחַ sans réduire le premier à l’humilité ni imposer la contrition au second. « Tremble à ma parole » conserve le singulier de דְבָרִי et l’expression de crainte révérencielle.'
  naturalness: Le français est moderne, clair et d’un registre convenant à un oracle prophétique. « Mais voici vers qui je porterai mon regard » est idiomatique et conserve l’image du regard dirigé vers une personne. La répétition de « tout cela » reflète naturellement la répétition hébraïque.
  terminology: « Yahweh » correspond au tétragramme et à la politique fournie. « Abattu d’esprit » est une solution sobre et non confessionnelle pour נְכֵה רוּחַ. La note explique utilement les possibilités lexicales sans surcharger le texte.
