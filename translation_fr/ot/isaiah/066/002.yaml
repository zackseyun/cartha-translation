id: ISA.66.2
reference: Isaiah 66:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אֶת כָּל אֵ֨לֶּה֙ יָדִ֣/י עָשָׂ֔תָה וַ/יִּהְי֥וּ כָל אֵ֖לֶּה נְאֻם יְהוָ֑ה וְ/אֶל זֶ֣ה אַבִּ֔יט אֶל עָנִי֙ וּ/נְכֵה ר֔וּחַ וְ/חָרֵ֖ד עַל דְּבָרִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/002.yaml
  text: 'My hand made all these things[a], and so all these things came to be, declares Yahweh. But to this one I will look: to the poor and contrite in spirit, and the one who trembles at my word.'
translation:
  language: fr
  text: '« Tout cela, c’est ma main qui l’a fait, et c’est ainsi que tout cela est venu à l’existence, déclare Yahweh. Mais voici vers qui je porterai mon regard : vers celui qui est pauvre et abattu d’esprit[a], et qui tremble à ma parole. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « affligé et brisé d’esprit » ; le premier terme peut aussi signifier « humble ».
    reason: Les termes עָנִי et נְכֵה רוּחַ couvrent respectivement les idées de pauvreté, d’affliction ou d’humilité, et celles d’un esprit frappé, abattu ou brisé.
lexical_decisions:
- source_word: יָדִי עָשָׂתָה
  choice: c’est ma main qui l’a fait
  rationale: Cette formulation conserve l’image anthropomorphique de la main divine et met en valeur le sujet, comme le fait l’ordre des mots hébreu.
- source_word: כָּל אֵלֶּה
  choice: tout cela
  rationale: Le pluriel démonstratif renvoie aux réalités mentionnées au verset précédent. En français, « tout cela » est plus naturel que « toutes ces choses » tout en gardant la portée collective.
- source_word: וַיִּהְיוּ כָל אֵלֶּה
  choice: c’est ainsi que tout cela est venu à l’existence
  rationale: Le verbe היה exprime ici l’existence résultant de l’acte créateur. « Est venu à l’existence » rend ce lien plus clairement que le simple « a été ».
- source_word: נְאֻם יְהוָה
  choice: déclare Yahweh
  rationale: « Déclare » restitue avec solennité la formule prophétique, tandis que « Yahweh » représente directement le nom divin.
- source_word: וְאֶל זֶה אַבִּיט
  choice: Mais voici vers qui je porterai mon regard
  rationale: « Mais » marque le contraste, et « porter mon regard vers » conserve l’image hébraïque d’une attention divine dirigée favorablement vers quelqu’un.
- source_word: עָנִי
  choice: pauvre
  rationale: « Pauvre » préserve le sens lexical principal sans réduire le terme à la seule humilité intérieure; le mot hébreu peut aussi évoquer une personne affligée ou humble.
- source_word: נְכֵה רוּחַ
  choice: abattu d’esprit
  rationale: L’expression décrit un esprit frappé, blessé ou brisé. « Abattu d’esprit » reste naturel en français et conserve cette image sans imposer exclusivement l’idée de repentance.
- source_word: חָרֵד עַל דְּבָרִי
  choice: qui tremble à ma parole
  rationale: Cette traduction concise conserve le singulier hébreu et exprime la crainte profonde et révérencieuse suscitée par la parole divine.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le nom propre divin plutôt que de le remplacer par un titre.
- issue: Nature du regard divin en וְאֶל זֶה אַבִּיט
  choice: je porterai mon regard
  alternative: je regarderai / je prête attention
  rationale: La formulation conserve l’image du regard tout en laissant au contexte sa nuance probable d’attention favorable, sans l’expliciter comme une faveur ou une approbation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde la solennité de l’oracle tout en évitant les tournures archaïques. Le contraste entre la souveraineté créatrice de Yahweh et son attention envers la personne vulnérable et révérencieuse demeure explicite.
