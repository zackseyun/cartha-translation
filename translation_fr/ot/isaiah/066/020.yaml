revisions:
- from: Ils ramèneront tous vos frères de toutes les nations en offrande à Yahvé, sur des chevaux, dans des chars, dans des litières[a], sur des mulets et sur des dromadaires[b], jusqu’à ma montagne sainte, à Jérusalem, dit Yahvé. Ils les amèneront comme les fils d’Israël apportent l’offrande dans un récipient pur à la maison de Yahvé.[c]
  to: Ils amèneront tous vos frères[c] de toutes les nations en offrande à Yahvé, sur des chevaux, dans des chars, dans des litières[a], sur des mulets et sur des dromadaires[b], jusqu’à ma montagne sainte, Jérusalem, dit Yahvé, comme les fils d’Israël apportent l’offrande dans un récipient pur à la maison de Yahvé.
