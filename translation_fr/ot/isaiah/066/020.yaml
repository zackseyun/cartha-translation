language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֵבִ֣יאוּ אֶת כָּל אֲחֵי/כֶ֣ם מִ/כָּל הַ/גּוֹיִ֣ם מִנְחָ֣ה לַֽ/יהוָ֡ה בַּ/סּוּסִ֡ים וּ֠/בָ/רֶכֶב וּ/בַ/צַּבִּ֨ים וּ/בַ/פְּרָדִ֜ים וּ/בַ/כִּרְכָּר֗וֹת עַ֣ל הַ֥ר קָדְשִׁ֛/י יְרוּשָׁלִַ֖ם אָמַ֣ר יְהוָ֑ה כַּ/אֲשֶׁ֣ר יָבִיאוּ֩ בְנֵ֨י יִשְׂרָאֵ֧ל אֶת הַ/מִּנְחָ֛ה בִּ/כְלִ֥י טָה֖וֹר בֵּ֥ית יְהוָֽה־־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/020.yaml
  text: And they will bring all your brothers from all the nations as an offering to Yahweh[a], on horses and in chariots and in litters and on mules and on camels, to my holy mountain Jerusalem, says Yahweh[c][b], just as the sons of Israel bring the offering in a clean vessel to the house of Yahweh.
translation:
  language: fr
  text: Ils amèneront tous vos frères[c] de toutes les nations en offrande à Yahvé, sur des chevaux, dans des chars, dans des litières[a], sur des mulets et sur des dromadaires[b], jusqu’à ma montagne sainte, Jérusalem, dit Yahvé, comme les fils d’Israël apportent l’offrande dans un récipient pur à la maison de Yahvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans des chariots couverts » ; le terme hébreu est rare et son sens exact est incertain.
    reason: lexical_alternative
  - marker: b
    text: Ou « sur des chameaux rapides » ; le terme hébreu est très rare et peut désigner des montures rapides ou un type de véhicule.
    reason: lexical_alternative
  - marker: c
    text: « Frères » peut avoir ici un sens de parenté plus large et ne désigne pas nécessairement uniquement des frères masculins.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵבִיאוּ
  choice: Ils ramèneront
  rationale: Dans ce contexte de rassemblement depuis les nations, le hiphil exprime le fait de faire venir; « ramèneront » rend naturellement le retour des dispersés sans expliciter davantage l’agent.
- source_word: כָּל אֲחֵיכֶם
  choice: tous vos frères
  rationale: Conserve le terme familial masculin du texte hébreu, qui désigne ici principalement les membres du peuple dispersés et peut avoir un sens de parenté plus large.
- source_word: מִכָּל הַגּוֹיִם
  choice: de toutes les nations
  rationale: Expression française directe qui garde l’image d’un rassemblement depuis l’ensemble des peuples.
- source_word: מִנְחָה
  choice: en offrande / l’offrande
  rationale: Le mot peut désigner un don, un tribut ou une offrande cultuelle. « Offrande » maintient cette amplitude et le parallèle avec le culte au temple.
- source_word: לַיהוָה / יְהוָה
  choice: à Yahvé / Yahvé
  rationale: Transcription française courante du nom divin YHWH, conforme à la couche de consultation fournie et distinguée d’un titre comme « le Seigneur ».
- source_word: בַּסּוּסִים וּבָרֶכֶב
  choice: sur des chevaux, dans des chars
  rationale: Rend les moyens de transport de façon naturelle tout en respectant la distinction entre montures et véhicules.
- source_word: וּבַצַּבִּים
  choice: dans des litières
  rationale: Le terme rare désigne vraisemblablement un type de véhicule ou de moyen de portage; « litières » convient au transport de personnes, avec l’incertitude signalée en note.
- source_word: וּבַפְּרָדִים
  choice: sur des mulets
  rationale: Équivalent précis et usuel de פֶּרֶד.
- source_word: וּבַכִּרְכָּרוֹת
  choice: sur des dromadaires
  rationale: Le terme est très rare et incertain; « dromadaires » suit une interprétation ancienne et probable comme montures rapides, sans masquer l’autre analyse possible.
- source_word: עַל הַר קָדְשִׁי יְרוּשָׁלִַם
  choice: jusqu’à ma montagne sainte, à Jérusalem
  rationale: Marque clairement la destination et présente Jérusalem comme l’emplacement ou l’apposition de la montagne sainte.
- source_word: בִּכְלִי טָהוֹר
  choice: dans un récipient pur
  rationale: « Récipient » reste suffisamment général pour כְּלִי, tandis que « pur » conserve la qualification rituelle sans la réduire à la propreté matérielle.
- source_word: בֵּית יְהוָה
  choice: la maison de Yahvé
  rationale: Préserve l’expression cultuelle concrète de l’hébreu plutôt que de l’interpréter directement comme « temple ».
theological_decisions:
- issue: Référent de « vos frères »
  choice: Les membres du peuple dispersés parmi les nations sont présentés comme l’offrande ramenée à Yahvé.
  alternative: Les non-Israélites convertis, ou l’ensemble des adorateurs issus des nations, seraient eux-mêmes l’offrande.
  rationale: Le sens familial de אֲחֵיכֶם et la comparaison avec les fils d’Israël favorisent le rassemblement des Israélites dispersés. La traduction ne ferme toutefois pas les résonances plus larges du contexte eschatologique.
- issue: Fonction de l’image de l’offrande
  choice: Les personnes ramenées sont comparées à une offrande apportée à Yahvé.
  alternative: Les personnes transporteraient une offrande distincte destinée à Yahvé.
  rationale: 'L’objet direct « tous vos frères » est suivi de מִנְחָה, qui fonctionne naturellement comme complément de manière ou d’état: ils sont amenés « en offrande ». Le second membre développe explicitement cette comparaison cultuelle.'
- issue: Portée de « pur »
  choice: La pureté du récipient garde sa dimension cultuelle.
  alternative: Le terme indiquerait seulement un récipient physiquement propre.
  rationale: Le cadre de l’offrande apportée à la maison de Yahvé rend la pureté rituelle saillante, mais le français « pur » laisse subsister toute la portée du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été divisée en deux phrases pour clarifier la comparaison finale. « Maison de Yahvé » conserve l’imagerie hébraïque; « récipient pur » maintient la nuance cultuelle. Tous les marqueurs de notes figurent dans le texte principal.
