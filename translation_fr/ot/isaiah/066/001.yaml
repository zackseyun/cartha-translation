source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַ/שָּׁמַ֣יִם כִּסְאִ֔/י וְ/הָ/אָ֖רֶץ הֲדֹ֣ם רַגְלָ֑/י אֵי זֶ֥ה בַ֨יִת֙ אֲשֶׁ֣ר תִּבְנוּ לִ֔/י וְ/אֵי זֶ֥ה מָק֖וֹם מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/001.yaml
  text: 'Thus says Yahweh: Heaven is my throne[a], and the earth is my footstool. What kind of house would you build for me[c][b], and what place would be my resting place?'
translation:
  language: fr
  text: 'Voici ce que dit Yahweh :


    « Le ciel est mon trône,

    et la terre, mon marchepied.


    Quelle maison pourriez-vous me bâtir[a][b] ?

    Quel serait le lieu de mon repos[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quelle sorte de maison me bâtiriez-vous ? » La question hébraïque est rhétorique et souligne qu’aucune maison construite par des humains ne peut être à la mesure de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Le mot « maison » fait probablement allusion au temple, mais l’hébreu dit simplement « maison ».
    reason: cultural_note
  - marker: c
    text: 'Ou : « Où serait le lieu de mon repos ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend naturellement en français moderne la formule prophétique d’introduction, tout en conservant sa solennité.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: הַשָּׁמַיִם
  choice: Le ciel
  rationale: Le nom hébreu a une forme plurielle, mais désigne ici le domaine céleste opposé à la terre ; le singulier est idiomatique en français.
- source_word: כִּסְאִי
  choice: mon trône
  rationale: Traduction directe de la métaphore royale.
- source_word: וְהָאָרֶץ
  choice: et la terre
  rationale: Conserve le contraste cosmique avec le ciel.
- source_word: הֲדֹם רַגְלָי
  choice: mon marchepied
  rationale: Équivalent français concis et usuel de l’expression désignant le support des pieds.
- source_word: אֵי זֶה
  choice: Quelle / Quel
  rationale: Dans ces questions rhétoriques, l’expression porte sur la nature ou l’adéquation de la maison et du lieu, plutôt que sur leur emplacement.
- source_word: בַיִת
  choice: maison
  rationale: Conserve le terme hébreu sans expliciter « temple », bien que cette allusion soit présente dans le contexte.
- source_word: אֲשֶׁר תִּבְנוּ לִי
  choice: pourriez-vous me bâtir
  rationale: 'Le conditionnel exprime naturellement le défi rhétorique : aucune construction humaine ne saurait contenir Dieu.'
- source_word: מָקוֹם מְנוּחָתִי
  choice: lieu pourrait être celui de mon repos
  rationale: Préserve à la fois le nom « lieu » et l’ambiguïté de מְנוּחָה, qui peut désigner le repos ou le lieu où l’on repose.
theological_decisions:
- issue: Faut-il expliciter que la « maison » est le temple ?
  choice: Conserver « maison » dans le texte principal.
  alternative: Traduire par « temple ».
  rationale: Le temple est vraisemblablement visé, mais le mot hébreu signifie bien « maison ». Le conserver maintient la portée générale de la question sur l’impossibilité de loger Dieu dans un édifice humain.
- issue: Force des questions adressées aux bâtisseurs
  choice: Employer « pourriez-vous » pour faire entendre leur portée rhétorique.
  alternative: Employer le plus littéral « bâtirez-vous ».
  rationale: Le texte ne demande pas simplement quels sont leurs projets ; il met en cause l’adéquation de toute maison qu’ils pourraient bâtir, sans toutefois transformer cette implication en affirmation explicite.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La disposition en lignes met en valeur le parallélisme poétique. « Marchepied » conserve l’image royale, et « maison » évite de surinterpréter le terme hébreu.
