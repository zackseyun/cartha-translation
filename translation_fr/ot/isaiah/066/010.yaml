  text: שִׂמְח֧וּ אֶת יְרוּשָׁלִַ֛ם וְ/גִ֥ילוּ בָ֖/הּ כָּל אֹהֲבֶ֑י/הָ שִׂ֤ישׂוּ אִתָּ/הּ֙ מָשׂ֔וֹשׂ כָּל הַ/מִּֽתְאַבְּלִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/010.yaml
  text: Rejoice with Jerusalem and be glad in her[a], all you who love her; rejoice with her in joy[b], all you who mourn over her.
translation:
  language: fr
  text: Réjouissez-vous avec Jérusalem et exultez à son sujet[a], vous tous qui l’aimez ! Tressaillez de joie avec elle[b], vous tous qui la pleurez !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réjouissez-vous en elle ». La préposition hébraïque peut exprimer ici la sphère ou l’objet de l’allégresse; « à son sujet » en rend le sens de façon naturelle.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu associe un verbe et un nom de même famille pour renforcer l’expression de la joie; littéralement : « exultez avec elle d’exultation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ אֶת יְרוּשָׁלִַם
  choice: Réjouissez-vous avec Jérusalem
  rationale: L’impératif pluriel exprime la joie, et אֶת peut ici présenter Jérusalem comme l’objet de cette joie ou celle avec qui elle est partagée. « Avec Jérusalem » s’accorde bien avec אִתָּהּ plus loin et souligne la joie commune.
- source_word: וְגִילוּ בָהּ
  choice: et soyez dans l’allégresse à cause d’elle
  rationale: גיל évoque une allégresse vive. Avec בָהּ, « à cause d’elle » est naturel en français et exprime la joie suscitée par Jérusalem sans effacer complètement l’ambiguïté, signalée en note.
- source_word: כָּל אֹהֲבֶיהָ
  choice: vous tous qui l’aimez
  rationale: Le participe désigne ceux qui aiment Jérusalem; la formulation française conserve l’adresse directe et la personnification féminine de la ville.
- source_word: שִׂישׂוּ אִתָּהּ מָשׂוֹשׂ
  choice: Tressaillez de joie avec elle
  rationale: Le verbe שׂושׂ et le nom apparenté מָשׂוֹשׂ forment une construction emphatique. « Tressaillez de joie » restitue cette intensité dans un français naturel, tandis que « avec elle » traduit clairement l’accompagnement.
- source_word: כָּל הַמִּתְאַבְּלִים עָלֶיהָ
  choice: vous tous qui portez son deuil
  rationale: Le participe hitpael exprime le fait de mener deuil au sujet de Jérusalem. « Porter son deuil » est idiomatique, digne et plus direct que « être en deuil sur elle ».
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs pluriels et la personnification féminine de Jérusalem sont conservés. La répétition emphatique de la joie est rendue idiomatiquement, avec une note signalant la construction hébraïque.
