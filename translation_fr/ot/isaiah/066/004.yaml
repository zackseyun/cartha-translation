  text: גַּם אֲנִ֞י אֶבְחַ֣ר בְּ/תַעֲלֻלֵי/הֶ֗ם וּ/מְגֽוּרֹתָ/ם֙ אָבִ֣יא לָ/הֶ֔ם יַ֤עַן קָרָ֨אתִי֙ וְ/אֵ֣ין עוֹנֶ֔ה דִּבַּ֖רְתִּי וְ/לֹ֣א שָׁמֵ֑עוּ וַ/יַּעֲשׂ֤וּ הָ/רַע֙ בְּ/עֵינַ֔/י וּ/בַ/אֲשֶׁ֥ר לֹֽא חָפַ֖צְתִּי בָּחָֽרוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/066/004.yaml
  text: So I also will choose harsh treatment for them[a], and I will bring their fears upon them, because I called and no one answered, I spoke and they did not listen; they did what was evil in my eyes[b], and chose what I did not delight in.
translation:
  language: fr
  text: Moi aussi, je choisirai de les traiter durement[a], et je ferai venir sur eux ce qu’ils redoutent, parce que j’ai appelé et personne n’a répondu, j’ai parlé et ils n’ont pas écouté ; ils ont fait ce qui est mal à mes yeux et ont choisi ce qui ne me plaît pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu est rare et difficile. Il peut évoquer des traitements humiliants ou sévères, des moqueries, des agissements arbitraires, voire des égarements ; dans ce contexte, il peut désigner le traitement judiciaire que Dieu leur réserve.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Moi aussi
  rationale: L’expression marque une correspondance emphatique entre leur choix et la réponse de Dieu; « Moi aussi » rend cette reprise naturellement en français.
- source_word: אֶבְחַר
  choice: je choisirai
  rationale: Le verbe בחר signifie « choisir ». Sa répétition à la fin du verset est conservée afin de maintenir l’ironie délibérée du texte.
- source_word: בְּתַעֲלֻלֵיהֶם
  choice: de les traiter durement
  rationale: Le terme rare peut évoquer des agissements capricieux, des mauvais traitements ou des moqueries. Dans ce contexte de jugement, cette formulation française exprime un traitement punitif sans trancher en faveur de la seule idée de moquerie.
- source_word: וּמְגוּרֹתָם
  choice: ce qu’ils redoutent
  rationale: Le nom peut désigner soit la peur ressentie, soit son objet. Avec « faire venir sur eux », l’objet de leur crainte est le sens français le plus naturel.
- source_word: אָבִיא לָהֶם
  choice: je ferai venir sur eux
  rationale: Cette tournure rend naturellement l’action causative et la portée défavorable du jugement.
- source_word: יַעַן
  choice: parce que
  rationale: La conjonction introduit explicitement le motif du jugement.
- source_word: קָרָאתִי וְאֵין עוֹנֶה
  choice: j’ai appelé et personne n’a répondu
  rationale: La construction avec אֵין et le participe indique l’absence de toute réponse personnelle.
- source_word: דִּבַּרְתִּי וְלֹא שָׁמֵעוּ
  choice: j’ai parlé et ils n’ont pas écouté
  rationale: Dans ce reproche prophétique, שׁמע exprime l’écoute attentive et l’obéissance, plutôt qu’une simple perception auditive.
- source_word: וַיַּעֲשׂוּ הָרַע בְּעֵינַי
  choice: Ils ont fait ce qui est mal à mes yeux
  rationale: La formulation conserve l’image évaluative hébraïque tout en restant claire en français moderne.
- source_word: וּבַאֲשֶׁר לֹא חָפַצְתִּי בָּחָרוּ
  choice: et ont choisi ce qui ne me plaît pas
  rationale: חפץ associe désir et plaisir. « Ne me plaît pas » est naturel, dignifié et maintient le contraste avec leur choix.
theological_decisions:
- issue: Nature de la réponse divine dans le jugement
  choice: Dieu choisit de leur infliger un traitement sévère correspondant à leur propre choix.
  alternative: Dieu choisit leurs égarements ou leurs agissements pervers eux-mêmes, en les y livrant.
  rationale: Le parallèle avec « je ferai venir sur eux ce qu’ils redoutent » favorise ici le sens d’une rétribution judiciaire. La note conserve néanmoins l’incertitude du terme rare, sans attribuer explicitement à Dieu le choix du mal moral.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme prophétique et la répétition de « choisir ». « Ce qu’ils redoutent » évite l’ambiguïté peu naturelle de « leurs craintes » dans cette construction.
