source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה לֹ֤א תִנָּתֵן֙ הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/015.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us[b]; this city will not be given into the hand of the king of Assyria.’
translation:
  language: fr
  text: 'Et qu’Ézékias ne vous amène pas à mettre votre confiance en Yahweh[a] en disant : « Yahweh nous délivrera à coup sûr[b] ; cette ville ne sera pas livrée entre les mains du roi d’Assyrie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh est le nom personnel de Dieu représenté en hébreu par les quatre lettres יהוה (YHWH).
    reason: divine_name
  - marker: b
    text: 'L’hébreu répète ici la racine du verbe « délivrer » dans une construction emphatique : littéralement, « délivrant, il nous délivrera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם חִזְקִיָּהוּ
  choice: Et qu’Ézékias ne vous amène pas à mettre votre confiance
  rationale: 'Le hiphil de בטח exprime ici la cause : Ézékias amène ses auditeurs à placer leur confiance. Cette formulation reste naturelle en français sans ajouter l’idée de tromperie.'
- source_word: אֶל יְהוָה
  choice: en Yahweh
  rationale: Avec « mettre sa confiance », la préposition française « en » rend naturellement la relation exprimée par אֶל ; le nom divin est translittéré « Yahweh ».
- source_word: לֵאמֹר
  choice: en disant
  rationale: Rend l’infinitif introduisant les paroles rapportées et rattache naturellement la citation à l’action d’Ézékias.
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: nous délivrera à coup sûr
  rationale: L’infinitif absolu suivi du verbe de même racine marque une forte insistance. « À coup sûr » restitue cette valeur dans un français courant et digne.
- source_word: לֹא תִנָּתֵן הָעִיר הַזֹּאת
  choice: cette ville ne sera pas livrée
  rationale: Le niphal de נתן est passif. « Être livrée » convient au contexte militaire et demeure proche de l’idée de remise au pouvoir d’un ennemi.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  choice: entre les mains du roi d’Assyrie
  rationale: Conserve l’image hébraïque de la main comme expression du pouvoir ou de la domination, sous une forme idiomatique en français.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve le caractère de nom propre sans substituer un titre.
- issue: Force emphatique de הַצֵּל יַצִּילֵנוּ
  choice: nous délivrera à coup sûr
  alternative: nous délivrera certainement / ne manquera pas de nous délivrer
  rationale: La construction hébraïque affirme avec insistance la délivrance attendue. La traduction garde cette emphase sans modifier la nature de l’affirmation rapportée par l’orateur assyrien.
- issue: Sens de בְּיַד
  choice: entre les mains
  alternative: au pouvoir de
  rationale: L’expression est métaphorique et désigne la soumission au pouvoir du roi d’Assyrie. Le texte principal conserve l’image ; la note explicite le sens possible.
translation_notes:
  register: Français international moderne, clair et digne. La tournure causative est explicitée sans prêter à Ézékias une intention de tromper absente du verbe. L’image des « mains » est conservée parce qu’elle reste intelligible en français.
