  text: מִ֗י בְּ/כָל אֱלֹהֵ֤י הָֽ/אֲרָצוֹת֙ הָ/אֵ֔לֶּה אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּֽי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/020.yaml
  text: Who among all the gods of these lands has delivered their land from my hand, that Yahweh should deliver Jerusalem from my hand?
translation:
  language: fr
  text: Lequel, parmi tous les dieux de ces pays, a délivré son pays de ma main ? Yahweh délivrerait-il donc Jérusalem de ma main ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת הָאֵלֶּה
  choice: Qui, parmi tous les dieux de ces pays
  rationale: « Qui, parmi… » rend naturellement l’interrogation rhétorique et בְּכָל comme une sélection au sein de l’ensemble. « Pays » convient ici aux territoires conquis évoqués par le discours.
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: a délivré son pays
  rationale: Le pluriel hébreu s’inscrit dans une question distributive portant sur chaque dieu éventuel. Le français emploie donc naturellement le singulier « a délivré son pays », sans effacer la référence collective de la formulation source.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: La traduction conserve l’image concrète de la « main », qui désigne ici le pouvoir ou la domination du locuteur et se répète à la fin du verset.
- source_word: כִּי יַצִּיל
  choice: pour que … délivre
  rationale: Dans cette question moqueuse, כִּי introduit la conséquence prétendument invraisemblable que le locuteur tire de ses victoires. « Pour que » restitue clairement ce mouvement rhétorique en français.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans le texte hébreu.
- source_word: יְרוּשָׁלִַם
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le nom propre divin. « Yahweh » le conserve comme nom et évite de lui substituer le titre « le SEIGNEUR ».
- issue: Portée de la vantardise assyrienne
  choice: Conserver la comparaison provocatrice entre Yahweh et les dieux des pays vaincus
  alternative: Reformuler de manière à nier explicitement que Yahweh soit comparable aux autres dieux
  rationale: Le verset rapporte la provocation du porte-parole assyrien, sans l’approuver. La traduction doit préserver cette tension narrative plutôt que corriger théologiquement les paroles du personnage.
translation_notes:
  register: Français moderne, direct et digne. La répétition de « délivré/délivre » et de « de ma main » est maintenue pour reproduire l’insistance du texte. La ponctuation met en relief l’incise « parmi tous les dieux de ces pays » sans alourdir la phrase.
