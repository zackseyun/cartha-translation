  variant: modern international French
source:
  edition: WLC
  text: וַ/יֵּצֵ֥א אֵלָ֛י/ו אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָא֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/003.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, came out to him, along with Shebna the scribe and Joah son of Asaph[d][c][b], the recorder.
translation:
  language: fr
  text: Alors Éliaquim, fils de Hilqiya, responsable du palais[a], sortit à sa rencontre, accompagné de Shebna, le secrétaire[b], et de Yoah, fils d’Asaph, l’archiviste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque signifie littéralement « qui était sur la maison » et désigne un haut fonctionnaire chargé de l’administration du palais royal.
    reason: cultural_note
  - marker: b
    text: Ou « le scribe ».
    reason: lexical_alternative
  - marker: c
    text: Ou « le chroniqueur »; le titre désigne un fonctionnaire chargé des archives et des affaires dont il fallait rendre compte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֵלָיו
  choice: sortit à sa rencontre
  rationale: Le verbe יצא signifie « sortir », et אֵלָיו indique le mouvement vers l’homme mentionné auparavant. « À sa rencontre » exprime naturellement en français ce déplacement sans imposer le point de vue ambigu de « vint/s’en alla ».
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: Éliaquim, fils de Hilqiya
  rationale: Les noms propres sont translittérés dans une forme française lisible, et la filiation hébraïque est conservée.
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: responsable du palais
  rationale: L’expression idiomatique désigne un haut fonctionnaire chargé de l’administration du palais ou de la maison royale. Une traduction strictement littérale, « qui était sur la maison », serait obscure en français.
- source_word: וְשֶׁבְנָא הַסֹּפֵר
  choice: accompagné de Shebna, le secrétaire
  rationale: La coordination hébraïque est rendue naturellement après le verbe singulier. Dans ce cadre royal, סֹפֵר désigne vraisemblablement un secrétaire administratif, plutôt qu’un copiste au sens courant.
- source_word: וְיוֹאָח בֶּן אָסָף
  choice: et de Yoah, fils d’Asaph
  rationale: Le nom et la construction filiale sont conservés; la préposition « de » dépend de « accompagné » et assure une coordination française fluide.
- source_word: הַמַּזְכִּיר
  choice: l’archiviste
  rationale: Le titre désigne un fonctionnaire chargé de conserver, rappeler ou rapporter les affaires officielles. « Archiviste » est concis et intelligible, tandis que « chroniqueur » demeure une possibilité.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les titres administratifs sont formulés de façon immédiatement compréhensible, avec les nuances lexicales conservées en notes.
