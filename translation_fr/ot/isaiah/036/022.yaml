  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣הוּ אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סּוֹפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣ידוּ ל֔/וֹ אֵ֖ת דִּבְרֵ֥י רַב שָׁקֵֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/022.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: fr
  text: Éliakim, fils de Hilqiya, responsable du palais, Shebna, le secrétaire, et Yoah, fils d’Asaph, l’archiviste, se rendirent alors auprès d’Ézéchias, les vêtements déchirés, et lui rapportèrent les paroles du rab-shaqé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rab-shaqé » est un titre officiel assyrien, souvent compris comme « grand échanson » ou comme la désignation d’un autre haut dignitaire de la cour.
    reason: Note culturelle expliquant un titre assyrien translittéré dont la fonction précise reste incertaine.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: se rendirent alors
  rationale: Le wayyiqtol fait progresser le récit. Le singulier hébreu placé avant une série de sujets coordonnés se rend naturellement au pluriel en français.
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: responsable du palais
  rationale: L’expression désigne le haut fonctionnaire chargé de la maison royale; « palais » explicite ici la valeur administrative de « maison » sans alourdir le texte.
- source_word: הַסּוֹפֵר
  choice: le secrétaire
  rationale: Dans ce cadre royal, סֹפֵר désigne vraisemblablement un secrétaire de cour plutôt qu’un simple copiste; ce terme est naturel en français moderne.
- source_word: הַמַּזְכִּיר
  choice: l’archiviste
  rationale: Le titre désigne un fonctionnaire chargé des registres ou de la mémoire officielle; « archiviste » rend clairement cette fonction, sans employer l’artificiel « mémorialiste ».
- source_word: קְרוּעֵי בְגָדִים
  choice: les vêtements déchirés
  rationale: Cette formulation concise décrit leur état à l’arrivée et conserve le geste visible de détresse et de deuil.
- source_word: וַיַּגִּידוּ לוֹ
  choice: lui rapportèrent
  rationale: Le hiphil de נגד signifie ici transmettre ou faire connaître ce qui a été dit; « rapportèrent » convient au compte rendu officiel.
- source_word: דִּבְרֵי
  choice: les paroles de
  rationale: La traduction directe « paroles » préserve le lien avec le discours précédent, plutôt que de réduire celui-ci à un simple message.
- source_word: רַב שָׁקֵה
  choice: le rab-shaqé
  rationale: Le terme est un titre assyrien. Sa translittération conserve la désignation historique sans imposer dans le corps du texte une équivalence fonctionnelle incertaine.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Les titres administratifs sont rendus par des termes immédiatement compréhensibles; le titre assyrien est conservé et expliqué en note. Les noms propres suivent des formes françaises proches de l’hébreu.
