  text: אַֽל תִּשְׁמְע֖וּ אֶל חִזְקִיָּ֑הוּ כִּי֩ כֹ֨ה אָמַ֜ר הַ/מֶּ֣לֶךְ אַשּׁ֗וּר עֲשֽׂוּ אִתִּ֤/י בְרָכָה֙ וּ/צְא֣וּ אֵלַ֔/י וְ/אִכְל֤וּ אִישׁ גַּפְנ/וֹ֙ וְ/אִ֣ישׁ תְּאֵנָת֔/וֹ וּ/שְׁת֖וּ אִ֥ישׁ מֵי בוֹרֽ/וֹ־־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/016.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern[b],'
translation:
  language: fr
  text: '« N’écoutez pas Ézéchias, car voici ce que dit le roi d’Assyrie : Faites la paix avec moi[a], sortez et venez à moi. Que chacun[b] mange de sa vigne et de son figuier, et que chacun boive l’eau de sa citerne, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Faites avec moi une bénédiction. » Dans ce contexte, cette expression signifie conclure la paix ou accepter des conditions favorables.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu répète אִישׁ, « homme », au masculin singulier, avec un sens distributif : chacun des membres du groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: écoutez
  rationale: L’expression signifie ici « écouter » ou « prêter attention à ». « N’écoutez pas Ézéchias » reste naturel et ne surinterprète pas le verbe comme une obéissance complète.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom hébreu.
- source_word: כִּי כֹה אָמַר
  choice: car voici ce que dit
  rationale: Formulation française actuelle qui conserve la fonction de la formule introduisant une proclamation officielle.
- source_word: הַמֶּלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: Rend directement la construction hébraïque et le titre politique.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: Faites la paix avec moi
  rationale: Dans ce contexte diplomatique, l’expression idiomatique invite à conclure des conditions favorables ou la paix. Sa formulation littérale, inhabituelle, est conservée en note.
- source_word: וּצְאוּ אֵלַי
  choice: et sortez vers moi
  rationale: Conserve le mouvement exprimé par l’hébreu sans expliciter par « rendez-vous », qui imposerait l’implication militaire.
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: Que chacun mange du fruit de sa vigne et de son figuier
  rationale: Le subjonctif restitue naturellement en français la suite d’impératifs. « Du fruit » explicite seulement l’objet implicite nécessaire après « manger », tandis que les possessifs gardent l’idée de propriété personnelle.
- source_word: אִישׁ
  choice: chacun
  rationale: « Chacun » rend naturellement la valeur distributive du masculin singulier hébreu répété, sans alourdir la phrase française.
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: et boive l’eau de sa citerne
  rationale: « Citerne » désigne précisément ici une fosse aménagée pour recueillir et conserver l’eau, plutôt qu’un puits alimenté par une source.
theological_decisions:
- issue: Portée de « sortez vers moi »
  choice: Conserver la formulation concrète « sortez vers moi »
  alternative: « rendez-vous à moi »
  rationale: Le contexte suggère une reddition, mais le texte hébreu ne la nomme pas explicitement. La traduction préserve donc cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La formule de proclamation reste solennelle sans archaïsme. Les impératifs sont rendus par « que chacun… » pour une syntaxe française naturelle, et la virgule finale signale que la déclaration se poursuit au verset suivant.
