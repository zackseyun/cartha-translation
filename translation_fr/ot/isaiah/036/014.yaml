id: ISA.36.14
reference: Isaiah 36:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥א לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּ֥י לֹֽא יוּכַ֖ל לְ/הַצִּ֥יל אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/014.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you.'
translation:
  language: fr
  text: 'Ainsi parle le roi : « Qu’Ézéchias ne vous trompe pas[a], car il ne pourra pas vous délivrer[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne vous égare pas » ou « ne vous induise pas en erreur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sauver » ou « secourir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Ainsi parle le roi
  rationale: Cette formulation naturelle et digne conserve la formule solennelle de proclamation royale. Le présent français convient à l’introduction d’un message cité.
- source_word: אַל יַשִּׁא לָכֶם חִזְקִיָּהוּ
  choice: Qu’Ézéchias ne vous trompe pas
  rationale: Le tour prohibitif rend אַל avec le jussif. « Tromper » exprime ici le sens causatif de נשׁא, qui peut aussi signifier égarer ou induire en erreur.
- source_word: כִּי לֹא יוּכַל
  choice: car il ne pourra pas
  rationale: « Car » introduit la raison de l’interdiction, et le futur « ne pourra pas » préserve l’idée d’incapacité dans la situation à venir.
- source_word: לְהַצִּיל אֶתְכֶם
  choice: vous délivrer
  rationale: Dans ce contexte de menace militaire, « délivrer » rend הציל au sens de tirer quelqu’un du danger; « sauver » ou « secourir » seraient également possibles.
theological_decisions:
- issue: Référent de « le roi »
  choice: Conserver « le roi » sans préciser son nom
  alternative: « Sennachérib » ou « le grand roi »
  rationale: L’hébreu porte simplement הַמֶּלֶךְ, « le roi ». Le contexte permet de reconnaître le roi d’Assyrie, mais l’expliciter dans le texte ajouterait une information absente de ce verset.
translation_notes:
  register: Français international moderne, clair et digne. La formule « Ainsi parle » maintient le ton officiel sans archaïsme excessif; les guillemets signalent explicitement le message royal cité.
