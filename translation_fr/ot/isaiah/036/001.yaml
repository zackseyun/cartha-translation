source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה לַ/מֶּ֣לֶךְ חִזְקִיָּ֗הוּ עָלָ֞ה סַנְחֵרִ֤יב מֶֽלֶךְ אַשּׁוּר֙ עַ֣ל כָּל עָרֵ֧י יְהוּדָ֛ה הַ/בְּצֻר֖וֹת וַֽ/יִּתְפְּשֵֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/001.yaml
  text: In the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: fr
  text: La quatorzième année du règne du roi Ézéchias, Sennachérib, roi d’Assyrie, marcha contre toutes les villes fortifiées de Juda et s’en empara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: La quatorzième année…
  rationale: La forme narrative introduit un nouvel épisode. En français moderne, son rôle discursif est naturellement porté par l’ouverture temporelle, sans ajouter « Or » ni la formule archaïque « Il arriva que ».
- source_word: בְּאַרְבַּע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: La quatorzième année du règne du roi Ézéchias
  rationale: Il s’agit de la formule habituelle de datation selon les années de règne. L’ajout explicatif « du règne » rend en français naturel la relation exprimée par le lamed.
- source_word: עָלָה ... עַל
  choice: marcha contre
  rationale: Dans ce contexte militaire, l’expression décrit une avancée hostile. « Marcha contre » conserve cette nuance sans préciser davantage la nature de l’offensive.
- source_word: סַנְחֵרִיב
  choice: Sennachérib
  rationale: Translittération française conventionnelle du nom propre.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: roi d’Assyrie
  rationale: Le groupe construit indique la fonction royale de Sennachérib et le territoire sur lequel il règne.
- source_word: כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: toutes les villes fortifiées de Juda
  rationale: « Fortifiées » rend précisément les villes rendues défendables par leurs ouvrages militaires.
- source_word: וַיִּתְפְּשֵׂם
  choice: et s’en empara
  rationale: Le verbe signifie saisir ou prendre. Appliqué à des villes, « s’en empara » exprime naturellement leur conquête militaire, le pronom « en » reprenant les villes.
