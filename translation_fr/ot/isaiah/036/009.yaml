source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/009.yaml
  text: How then can you repulse a single captain of the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: fr
  text: Comment donc pourrais-tu repousser un seul gouverneur[a] parmi les serviteurs les moins importants de mon maître, alors que tu comptes sur l’Égypte pour des chars et des cavaliers ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « haut fonctionnaire » ou « officier ». Le terme hébreu désigne un responsable subordonné, notamment dans un contexte administratif ou militaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵיךְ
  choice: Comment… alors
  rationale: Rend à la fois la question rhétorique et le lien argumentatif avec ce qui précède.
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: pourrais-tu… repousser
  rationale: L’expression signifie littéralement « faire retourner la face de » et, dans ce contexte militaire, « résister à » ou « repousser ».
- source_word: פַחַת
  choice: gouverneur
  rationale: Le terme désigne un dirigeant ou haut fonctionnaire subordonné; « gouverneur » conserve mieux sa portée administrative que le terme spécifiquement militaire « capitaine ».
- source_word: אַחַד
  choice: un seul
  rationale: 'Souligne la force de la raillerie : Juda ne pourrait même pas repousser un unique subordonné assyrien.'
- source_word: עַבְדֵי אֲדֹנִי הַקְטַנִּים
  choice: même parmi les plus petits serviteurs de mon maître
  rationale: Rend naturellement en français le rang inférieur visé par הַקְטַנִּים, sans suggérer une petite taille physique; « même parmi » explicite la valeur partitive probable de la construction.
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: puisque tu mets ta confiance dans l’Égypte
  rationale: Exprime la confiance intéressée placée en l’Égypte et le rapport argumentatif avec la question précédente.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: pour avoir des chars et des cavaliers
  rationale: Les termes désignent les forces de chars et les troupes montées attendues de l’Égypte; « pour avoir » rend clairement le but de cette confiance.
