  text: פֶּן יַסִּ֨ית אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵ֑/נוּ הַ/הִצִּ֜ילוּ אֱלֹהֵ֤י הַ/גּוֹיִם֙ אִ֣ישׁ אֶת אַרְצ֔/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/018.yaml
  text: Do not let Hezekiah mislead you[a], saying, ‘Yahweh will deliver us.’ Have any of the gods of the nations, each one[b], delivered his land from the hand of the king of Assyria?
translation:
  language: fr
  text: 'Qu’Ézéchias ne vous égare pas[a] en disant : « Yahweh nous délivrera. » Les dieux des nations ont-ils chacun délivré son pays du pouvoir du roi d’Assyrie[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’Ézéchias ne vous incite pas » ou « ne vous persuade pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ont-ils délivré, les dieux des nations, chacun son pays, de la main du roi d’Assyrie ? »'
    reason: source_imagery_and_grammar
lexical_decisions:
- source_word: פֶּן
  choice: Qu’Ézéchias ne vous… pas
  rationale: Dans cet avertissement, פֶּן introduit une mise en garde négative. Cette tournure française est naturelle et conserve la force préventive de l’hébreu.
- source_word: יַסִּית
  choice: égare
  rationale: Le hifil de סות peut exprimer l’idée d’inciter, de persuader ou d’induire en erreur. « Égarer » convient à la tentative du Rab-Shaké de détourner le peuple de la parole d’Ézéchias sans imposer l’idée plus forte de tromperie délibérée.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et courante du nom propre hébreu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française du nom divin, qui préserve ici le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: יַצִּילֵנוּ
  choice: nous délivrera
  rationale: Le hifil de נצל signifie délivrer ou arracher à un danger. « Délivrer » convient au contexte de menace militaire.
- source_word: הַהִצִּילוּ
  choice: ont-ils… délivré
  rationale: La particule interrogative jointe à l’accompli forme une question rhétorique portant sur l’échec supposé des dieux nationaux.
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: les dieux des nations
  rationale: Rendu direct du syntagme construit, en maintenant la dimension ethnique et politique de גּוֹיִם.
- source_word: אִישׁ
  choice: chacun
  rationale: 'אִישׁ a ici une valeur distributive : chaque dieu est envisagé séparément. « Chacun » restitue clairement cette fonction.'
- source_word: אַרְצוֹ
  choice: leur pays
  rationale: Le suffixe singulier renvoie distributivement au pays associé à chaque dieu. En français, « chacun… leur pays » évite de personnifier inutilement ces dieux par « son » tout en restant naturel; la note signale la construction plus littérale.
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  choice: du pouvoir du roi d’Assyrie
  rationale: L’expression hébraïque « de la main de » désigne ici la puissance ou la domination. « Du pouvoir de » transmet naturellement cet idiome en français moderne.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom divin au lieu de le remplacer par un titre.
- issue: Portée de la question sur les dieux des nations
  choice: Question rhétorique rapportant l’argument du Rab-Shaké sans en confirmer la théologie
  alternative: Formulation qui expliciterait que ces dieux sont impuissants ou inexistants
  rationale: Le verset rapporte la propagande assyrienne. La traduction préserve sa formulation comparative sans ajouter au discours une conclusion théologique absente de cette phrase.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique et le discours direct sont conservés. « Du pouvoir de » rend l’idiome hébreu avec naturel, tandis que la note préserve l’image de la main et la construction distributive.
