  text: וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּֽי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/021.yaml
  text: But they kept silent and did not answer him a word[a], for the king’s command was, saying, “Do not answer him.”
translation:
  language: fr
  text: 'Mais ils gardèrent le silence et ne lui répondirent pas un mot[a], car l’ordre du roi était : « Ne lui répondez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne lui répondirent pas un mot », expression signifiant qu’ils ne lui donnèrent absolument aucune réponse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲרִישׁוּ
  choice: ils gardèrent le silence
  rationale: Le verbe חרשׁ exprime ici un silence délibéré; cette formulation naturelle conserve l’idée de retenue intentionnelle.
- source_word: וְלֹא עָנוּ אֹתוֹ דָּבָר
  choice: et ne lui répondirent pas un mot
  rationale: La tournure hébraïque signifie qu’ils ne donnèrent absolument aucune réponse; la formulation française en préserve l’image et l’insistance.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison de leur silence dans un registre narratif soutenu mais courant.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: le roi avait donné cet ordre
  rationale: מִצְוָה désigne ici un ordre revêtu d’autorité. La reformulation verbale est plus naturelle en français tout en conservant le sens.
- source_word: הִיא לֵאמֹר
  choice: 'cet ordre :'
  rationale: La construction introduit le contenu de l’ordre. En français moderne, les deux-points rendent cette fonction plus naturellement que le calque « était, disant ».
- source_word: לֹא תַעֲנֻהוּ
  choice: Ne lui répondez pas
  rationale: L’imparfait hébreu négatif énonce ici une instruction adressée à plusieurs hommes; l’impératif français en restitue directement la force.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique; la syntaxe de l’introduction de l’ordre a été rendue idiomatique sans modifier le rapport causal ni la force de l’interdiction.
