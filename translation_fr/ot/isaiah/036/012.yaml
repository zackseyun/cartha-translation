  text: וַ/יֹּ֣אמֶר רַב שָׁקֵ֗ה הַ/אֶ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חוֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חראי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/012.yaml
  text: But the Rabshakeh said[a], “Has my master sent me to your master and to you to speak these words? Has he not sent me to the men sitting on the wall, to eat their own dung and drink their own urine with you?”
translation:
  language: fr
  text: 'Mais le Rabschaké dit[a] : « Mon maître m’a-t-il envoyé à ton maître et à toi pour dire ces paroles ? Ne m’a-t-il pas envoyé aux hommes assis sur la muraille, qui mangeront leurs excréments et boiront leur urine avec vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu emploie un langage volontairement grossier dans cette menace liée au siège. Le texte écrit (ketiv) comporte des termes plus crus ; la lecture traditionnelle (qeré), suivie ici, les remplace par les euphémismes « excréments » et « urine ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Le titre assyrien est translittéré afin de préserver sa désignation historique; la graphie française avec traits d’union facilite la lecture.
- source_word: אֲדֹנֶיךָ / אֲדֹנִי
  choice: ton maître / mon maître
  rationale: Dans ce contexte politique, le terme désigne respectivement Ézékias et le roi d’Assyrie comme supérieurs humains; « maître » évite une connotation divine indue.
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: dire ces paroles
  rationale: Rend naturellement en français l’expression hébraïque tout en conservant le substantif concret « paroles ».
- source_word: הֲלֹא
  choice: N’est-ce pas aussi
  rationale: Formule une question rhétorique attendant une réponse affirmative; « aussi » explicite en français le contraste entre les destinataires mentionnés.
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחוֹמָה
  choice: les hommes assis sur la muraille
  rationale: Reproduit le masculin pluriel et le participe hébreu dans une formulation française directe.
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: qui devront manger ... et boire ...
  rationale: Le français exige ici une articulation idiomatique du résultat menaçant du siège; « devront » reste moins déterministe que « sont condamnés à ».
- source_word: חראיהם
  choice: leurs excréments
  rationale: Préserve le sens corporel et humiliant du terme hébreu sans employer une vulgarité française disproportionnée.
- source_word: שיניהם
  choice: leur urine
  rationale: Rend le sens du mot lu selon la tradition scribale; la note signale que l’expression hébraïque sous-jacente est plus crue.
- source_word: עִמָּכֶם
  choice: avec vous
  rationale: Traduction directe de la préposition comitative avec suffixe de deuxième personne masculine plurielle.
theological_decisions: []
translation_notes:
  register: Français moderne, digne mais direct. La rudesse de la provocation est maintenue sans recourir à un vocabulaire artificiellement archaïque. Le tutoiement reflète les formes hébraïques au singulier adressées au porte-parole, puis le pluriel de « avec vous ».
