  source_fidelity: Le projet suit à juste titre le texte massorétique fourni en conservant la première personne dans אָמַרְתִּי, lecture difficile en regard de 2 Rois 18.20. Toutefois, « que les projets et la puissance » crée une construction française ambiguë et tend à présenter ces réalités comme le contenu positif des paroles, alors que la formule hébraïque les déprécie comme de simples paroles. Une ponctuation et une formulation plus nettes rendent cette relation sans harmoniser le texte.
  naturalness: « Je le dis » est compréhensible, mais « Je dis » est plus direct dans cette réplique. « Des mots en l’air » est moderne et naturel; la construction avec deux-points permet de garder l’apposition elliptique et dépréciative de l’hébreu. « Stratégie » rend plus précisément עֵצָה dans le contexte militaire que « projets ».
  terminology: « Force » rend naturellement גְבוּרָה dans un contexte de guerre. « Te révolter contre moi » conserve la portée politique de מָרַד sans la surinterpréter. Une note est nécessaire au point d’ancrage de « Je dis » pour signaler sobrement la divergence du parallèle, sans substituer sa lecture au texte source.
