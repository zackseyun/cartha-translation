  text: אָמַ֨רְתִּי֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/005.yaml
  text: You say—but they are only words of the lips—‘There is counsel and strength for war.’ Now in whom have you trusted, that you have rebelled against me?
translation:
  language: fr
  text: 'Je dis[a] : « Ce ne sont que des mots en l’air : de la stratégie et de la force pour la guerre. » Maintenant, en qui as-tu placé ta confiance, pour te révolter contre moi ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Hébreu : « Je dis ». Le passage parallèle, 2 Rois 18.20, porte : « Tu dis ».'
    reason: Signale la lecture difficile du texte massorétique et la variante du parallèle sans modifier le texte traduit.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Je le dis
  rationale: Suit la forme à la première personne du texte massorétique d’Ésaïe. Le parallèle de 2 Rois 18.20 porte « tu dis », mais cette variante n’est pas introduite silencieusement dans le texte principal.
- source_word: אַךְ דְּבַר שְׂפָתַיִם
  choice: ce ne sont que des paroles en l’air
  rationale: Rend l’expression littérale « seulement une parole des lèvres » par une tournure française naturelle exprimant des propos sans substance.
- source_word: עֵצָה וּגְבוּרָה לַמִּלְחָמָה
  choice: les projets et la puissance pour faire la guerre
  rationale: 'Conserve les deux éléments du texte hébreu : la stratégie ou les desseins réfléchis, et la capacité militaire.'
- source_word: בָטַחְתָּ
  choice: as-tu placé ta confiance
  rationale: Exprime la confiance ou l’assurance mise en une personne, plutôt qu’une simple opinion.
- source_word: מָרַדְתָּ
  choice: te révolter
  rationale: Rend le sens politique fort de la rébellion contre l’autorité impériale revendiquée par le locuteur.
theological_decisions:
- issue: Personne grammaticale de l’introduction
  choice: « Je le dis », selon אָמַרְתִּי dans le WLC
  alternative: « Tu dis », comme dans le passage parallèle de 2 Rois 18.20 et dans plusieurs traductions qui harmonisent ou corrigent le texte
  rationale: La traduction privilégie le texte source fourni et préserve sa lecture difficile sans l’harmoniser silencieusement avec le parallèle.
translation_notes:
  register: Français international moderne, direct et digne. « Paroles en l’air » est idiomatique sans être familier. La syntaxe garde l’effet rhétorique dépréciatif du discours assyrien.
