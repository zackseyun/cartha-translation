  text: עַד בֹּאִ֕/י וְ/לָקַחְתִּ֥י אֶתְ/כֶ֖ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֑ם אֶ֤רֶץ דָּגָן֙ וְ/תִיר֔וֹשׁ אֶ֥רֶץ לֶ֖חֶם וּ/כְרָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/017.yaml
  text: until I come and take you away to a land like your own land—a land of grain and new wine[b][a], a land of bread and vineyards.
translation:
  language: fr
  text: jusqu’à ce que je vienne vous prendre et vous emmener dans un pays comme le vôtre, un pays de céréales et de vin nouveau, un pays de pain et de vignes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: jusqu’à ce que je vienne
  rationale: עַד marque ici la limite temporelle, et בֹּאִי est la forme qal à la première personne du singulier de בוא. Cette formulation française rend directement l’attente jusqu’à la venue annoncée.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: vous prendre pour vous conduire
  rationale: לקח signifie fondamentalement « prendre ». Dans ce contexte de déplacement imposé, « pour vous conduire » explicite naturellement la destination introduite par אֶל sans employer une formulation excessivement interprétative comme « vous déporter ».
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: dans un pays semblable au vôtre
  rationale: אֶל indique le mouvement vers une destination, tandis que כְּ exprime une comparaison. « Semblable au vôtre » préserve la promesse rhétorique d’un pays comparable, non identique.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: un pays de blé et de vin nouveau
  rationale: דָּגָן désigne les céréales ou le grain; « blé » est ici une expression française naturelle de l’abondance céréalière. תִּירוֹשׁ désigne couramment le vin nouveau et reste distinct du terme plus général יין.
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: un pays de pain et de vignes
  rationale: לֶחֶם est rendu littéralement par « pain ». כְּרָמִים peut désigner des vignes ou des vignobles; « vignes » forme en français un couple agricole naturel avec « pain » tout en conservant l’image concrète.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la cadence persuasive du discours assyrien et la répétition « un pays… un pays… ». Le déplacement contraint reste perceptible par le contexte, sans introduire dans le corps du verset le terme plus interprétatif « déporter ».
