  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֣וּר אֶת רַב שָׁקֵ֨ה מִ/לָּכִ֧ישׁ יְרוּשָׁלְַ֛מָ/ה אֶל הַ/מֶּ֥לֶךְ חִזְקִיָּ֖הוּ בְּ/חֵ֣יל כָּבֵ֑ד וַֽ/יַּעֲמֹ֗ד בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָ/עֶלְיוֹנָ֔ה בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/002.yaml
  text: Then the king of Assyria sent the Rabshakeh from Lachish to Jerusalem, to King Hezekiah, with a heavy force. And he stood by the conduit of the upper pool, on the highway to the launderer’s field.
translation:
  language: fr
  text: Le roi d’Assyrie envoya de Lakish à Jérusalem, auprès du roi Ézékias, le grand échanson[a] avec une importante force militaire. Celui-ci prit position près du canal du réservoir supérieur, sur la route du champ du foulon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Rab-Shaké ». Il s’agit d’un titre assyrien porté par un haut dignitaire, et non nécessairement d’un nom propre.'
    reason: Le titre רַב שָׁקֵה peut être translittéré ou traduit; la note préserve cette possibilité et précise sa nature.
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le grand échanson
  rationale: Titre assyrien désignant un haut dignitaire; la traduction traditionnelle française conserve sa valeur de fonction sans le traiter comme un nom propre.
- source_word: בְּחֵיל כָּבֵד
  choice: avec une armée imposante
  rationale: חַיִל désigne ici une force militaire, tandis que כָּבֵד exprime son importance ou sa puissance; «armée imposante» est naturel en français et ne réduit pas l’expression au seul nombre.
- source_word: וַיַּעֲמֹד
  choice: prit position
  rationale: Dans ce contexte militaire et diplomatique, le verbe signifie plus qu’une simple posture physique et indique que le dignitaire s’établit à l’endroit mentionné.
- source_word: תְּעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: le canal du réservoir supérieur
  rationale: «Canal» rend תְּעָלָה et «réservoir» traduit naturellement בְּרֵכָה dans le contexte d’un ouvrage hydraulique.
- source_word: מְסִלַּת שְׂדֵה כוֹבֵס
  choice: la route du Champ du Blanchisseur
  rationale: מְסִלָּה désigne une voie aménagée; כוֹבֵס est un laveur ou blanchisseur de tissus. La majuscule signale un toponyme descriptif.
