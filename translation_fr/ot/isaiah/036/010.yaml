id: ISA.36.10
reference: Isaiah 36:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/הַשְׁחִיתָ֑/הּ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה אֶל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/010.yaml
  text: And now[a], was it apart from Yahweh that I came up against this land to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: fr
  text: 'Et maintenant, est-ce sans Yahweh[a] que je suis monté contre ce pays pour le détruire ? Yahweh m’a dit : « Monte contre ce pays et détruis-le. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « indépendamment de Yahweh ».'
    reason: 'Variante lexicale explicitant la nuance de מִבַּלְעֲדֵי : agir sans l’autorisation ou l’intervention de Yahweh.'
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: est-ce sans
  rationale: La particule interrogative הֲ jointe à מִבַּלְעֲדֵי introduit une question rhétorique. « Est-ce sans » est naturel en français et conserve l’idée d’une action qui ne serait pas indépendante de Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, ce qui préserve le nom personnel présent dans le texte hébreu.
- source_word: עָלִיתִי
  choice: je suis monté
  rationale: Le verbe עלה signifie couramment « monter ». Avec la préposition על dans ce contexte militaire, « monter contre » exprime l’avancée hostile tout en gardant l’image directionnelle.
- source_word: עַל הָאָרֶץ הַזֹּאת
  choice: contre ce pays
  rationale: Dans ce contexte d’invasion, « contre ce pays » rend la valeur hostile de על. « Pays » désigne ici le territoire visé de manière naturelle en français.
- source_word: לְהַשְׁחִיתָהּ
  choice: pour le détruire
  rationale: L’infinitif construit au hifil de שׁחת indique le but destructeur de l’expédition. « Détruire » en donne le sens direct.
- source_word: אָמַר אֵלַי
  choice: m’a dit
  rationale: Cette formulation française simple et idiomatique correspond au discours rapporté hébreu.
- source_word: עֲלֵה
  choice: Monte
  rationale: L’impératif de עלה est rendu directement par « Monte », en conservant le mouvement exprimé par l’hébreu.
- source_word: וְהַשְׁחִיתָהּ
  choice: et détruis-le
  rationale: La seconde injonction explicite est maintenue, avec sa coordination et sa force impérative.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: La translittération préserve le nom divin du texte source. Le propos reste présenté comme l’affirmation du porte-parole assyrien, sans que la traduction se prononce sur sa véracité.
- issue: Prétendue autorisation divine de l’invasion
  choice: 'Conserver l’affirmation directe : « Yahweh m’a dit »'
  alternative: Ajouter dans le texte une marque de doute ou de prétention
  rationale: L’hébreu rapporte directement la déclaration sans en évaluer ici la véracité. Ajouter « prétendument » ou une formule semblable résoudrait une tension que le verset laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ce pays » et de « détruire » est conservée pour respecter l’insistance du texte. « Monter contre » garde l’image hébraïque tout en restant intelligible dans un contexte militaire.
