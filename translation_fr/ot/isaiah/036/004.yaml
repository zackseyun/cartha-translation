base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/004.yaml
  text: 'Then the Rabshakeh said to them[a], “Please say to Hezekiah, ‘Thus says the great king[b], the king of Assyria: What is this confidence that you have trusted in?’”'
translation:
  language: fr
  text: 'Le Rab-Shaké leur dit[a] : « Dites, s’il vous plaît, à Ézéchias : “Voici ce que dit le grand roi, le roi d’Assyrie : Quelle est cette confiance sur laquelle tu t’appuies[b] ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Rab-Shaké » est probablement un titre officiel assyrien. Il pourrait désigner le grand échanson ou un autre haut dignitaire de la cour ou de l’armée.
    reason: cultural_note
  - marker: b
    text: 'L’hébreu emploie un nom et un verbe de la même racine : littéralement, « cette confiance en laquelle tu as placé ta confiance ». Cette répétition donne de l’emphase à la question.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Le terme, probablement emprunté à l’akkadien, désigne un haut dignitaire assyrien dont la fonction précise reste discutée. La translittération traditionnelle française préserve cette incertitude.
- source_word: אִמְרוּ נָא
  choice: Dites, s’il vous plaît
  rationale: L’impératif pluriel suivi de נָא exprime ici une demande formulée avec politesse; cette tournure la rend clairement en français actuel.
- source_word: חִזְקִיָּהוּ
  choice: Ézéchias
  rationale: Forme française traditionnelle et largement reconnue du nom propre.
- source_word: כֹּה אָמַר
  choice: Voici ce que dit
  rationale: Rend naturellement en français moderne la formule solennelle employée par un messager, sans archaïsme inutile.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: le grand roi
  rationale: Traduction directe du titre royal assyrien, qui conserve sa solennité et sa portée politique.
- source_word: מֶלֶךְ אַשּׁוּר
  choice: le roi d’Assyrie
  rationale: L’apposition et la répétition de « roi » reproduisent la titulature emphatique de l’hébreu.
- source_word: הַבִּטָּחוֹן הַזֶּה אֲשֶׁר בָּטָחְתָּ
  choice: cette confiance en laquelle tu te confies
  rationale: La formulation conserve la répétition rhétorique du nom et du verbe issus de la même racine hébraïque, tout en restant intelligible en français.
