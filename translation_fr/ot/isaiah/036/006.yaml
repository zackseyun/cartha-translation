  text: הִנֵּ֣ה בָטַ֡חְתָּ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/006.yaml
  text: Look[a], you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, goes into his hand and pierces it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: fr
  text: 'Voici : tu mets ta confiance dans l’Égypte, ce bâton de roseau brisé. Si quelqu’un[a] s’appuie dessus, il pénètre dans sa main et la transperce. Tel est le pharaon, roi d’Égypte, pour tous ceux qui mettent leur confiance en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « un homme » ; le masculin singulier représente ici toute personne qui s’appuie sur ce bâton.'
    reason: Précise la forme du texte hébreu tout en expliquant son emploi générique.
lexical_decisions:
- source_word: הִנֵּה
  choice: Regarde
  rationale: Cette interjection attire vivement l’attention. « Regarde » est naturel en français moderne et conserve la force déictique de l’hébreu.
- source_word: בָטַחְתָּ
  choice: tu mets ta confiance
  rationale: Le parfait décrit ici l’attitude actuelle du destinataire. Cette formulation exprime clairement une confiance active et durable.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: ce bâton de roseau brisé
  rationale: מִשְׁעֶנֶת désigne un objet servant d’appui, et הַקָּנֶה הָרָצוּץ un roseau endommagé qui ne peut soutenir celui qui s’y fie. « Bâton de roseau brisé » conserve l’image concrète sans lourdeur.
- source_word: עַל מִצְרַיִם
  choice: dans l’Égypte
  rationale: Avec le verbe בטח, le français idiomatique demande « mettre sa confiance dans ». L’Égypte est mise en apposition avec le bâton de roseau brisé.
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: Si quelqu’un s’appuie dessus
  rationale: La relative hébraïque décrit ce qui arrive dans l’éventualité où une personne prend appui sur ce roseau. La tournure conditionnelle rend cette relation naturellement.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: il lui pénètre dans la paume et la transperce
  rationale: Le bâton entre dans la paume de celui qui s’appuie sur lui et la perce. Le présent conserve la vivacité de la description hébraïque.
- source_word: כֵּן
  choice: Tel est
  rationale: Cette expression introduit clairement l’application de la comparaison au pharaon tout en restant concise et digne.
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: pour tous ceux qui mettent leur confiance en lui
  rationale: La formulation reprend le même vocabulaire que dans la première proposition et indique ce que le pharaon représente pour tous ceux qui comptent sur lui.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. La métaphore concrète du soutien trompeur est conservée, ainsi que le passage de l’image du roseau à son application au pharaon.
