  source_fidelity: 'Le sens polémique du discours assyrien est bien conservé : les « hauts lieux » et les « autels » sont présentés, dans ses propres termes, comme appartenant au SEIGNEUR, sans correction théologique du propos. « Vous vous prosternerez » rend fidèlement תשתחוו. Toutefois, « les habitants de » explicite et remplace les destinataires nominaux « Juda et Jérusalem » ; cette addition n’est pas nécessaire et atténue la formulation directe du texte.'
  naturalness: Le français est fluide et de registre approprié. La formulation révisée « Nous mettons notre confiance dans le SEIGNEUR, notre Dieu » est idiomatique, tout en reproduisant plus directement la construction hébraïque.
  terminology: « SEIGNEUR », « hauts lieux », « autels » et « se prosterner » sont des choix établis et appropriés. « Ézékias » est la forme française usuelle.
