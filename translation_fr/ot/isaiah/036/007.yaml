    rationale: « C’est dans le SEIGNEUR notre Dieu que nous mettons notre confiance » est compréhensible, mais « Nous mettons notre confiance dans le SEIGNEUR, notre Dieu » suit plus directement la proposition citée en hébreu, avec une ponctuation française plus naturelle.
