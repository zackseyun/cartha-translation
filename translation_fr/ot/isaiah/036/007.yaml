  text: וְ/כִי תֹאמַ֣ר אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵ֛י הַ/מִּזְבֵּ֥חַ הַ/זֶּ֖ה תִּֽשְׁתַּחֲוֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/007.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall bow down before this altar’?”
translation:
  language: fr
  text: 'Mais si tu me dis : « Nous mettons notre confiance dans le SEIGNEUR, notre Dieu », n’est-ce pas lui dont Ézékias a supprimé les hauts lieux et les autels, en disant à Juda et à Jérusalem : « C’est devant cet autel-ci que vous vous prosternerez » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: le SEIGNEUR
  rationale: Rend le tétragramme selon la convention française largement reconnue, en petites capitales dans la composition finale.
- source_word: בָּטָחְנוּ
  choice: nous mettons notre confiance
  rationale: 'Exprime naturellement en français l’accompli hébreu à valeur d’état présent : « nous avons placé et continuons de placer notre confiance ».'
- source_word: בָּמוֹתָיו
  choice: ses hauts lieux
  rationale: Terme biblique consacré pour les lieux cultuels surélevés; le possessif renvoie grammaticalement au SEIGNEUR dans l’argument du porte-parole assyrien.
- source_word: תִּשְׁתַּחֲווּ
  choice: vous vous prosternerez
  rationale: Conserve le geste cultuel concret et la valeur injonctive de l’imparfait hébreu dans le discours rapporté.
- source_word: הַמִּזְבֵּחַ הַזֶּה
  choice: cet autel-ci
  rationale: Le suffixe démonstratif souligne l’autel déterminé de Jérusalem, opposé aux autels supprimés.
theological_decisions:
- issue: À qui appartiennent les hauts lieux et les autels selon la formulation du discours assyrien ?
  choice: « ses hauts lieux et ses autels », avec le SEIGNEUR comme antécédent
  alternative: Reformuler pour distinguer les hauts lieux illégitimes du culte légitime
  rationale: Le verset rapporte la compréhension polémique du porte-parole assyrien, qui interprète à tort la réforme centralisatrice d’Ézékias comme une offense au Dieu de Juda. La traduction ne corrige pas silencieusement son raisonnement.
- issue: Portée de l’ordre attribué à Ézékias
  choice: « C’est devant cet autel-ci que vous vous prosternerez »
  alternative: « Vous adorerez devant cet autel »
  rationale: La formulation choisie préserve le geste physique du verbe hébreu et l’insistance déictique sur l’unique autel.
translation_notes:
  register: Français moderne, oral et digne, adapté à une provocation diplomatique directe. Le tutoiement correspond au singulier hébreu adressé à Ézékias par l’intermédiaire de ses représentants; « les habitants de » explicite naturellement les destinataires collectifs Juda et Jérusalem sans modifier le sens.
