  text: אַיֵּ֞ה אֱלֹהֵ֤י חֲמָת֙ וְ/אַרְפָּ֔ד אַיֵּ֖ה אֱלֹהֵ֣י סְפַרְוָ֑יִם וְ/כִֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/019.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim? And have they delivered Samaria from my hand?[a]
translation:
  language: fr
  text: Où sont les dieux de Hamath et d’Arpad ? Où sont les dieux de Sepharvaïm ? Ont-ils délivré Samarie de ma main[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « arraché » ou « sauvé » pour « délivré ».'
    reason: Alternative lexicale pour הִצִּילוּ.
lexical_decisions:
- source_word: אַיֵּה
  choice: Où sont
  rationale: L’interrogatif porte sur la localisation; le pluriel français s’accorde naturellement avec « les dieux ».
- source_word: אֱלֹהֵי
  choice: les dieux de
  rationale: Le pluriel construit est rendu avec l’article défini, nécessaire et idiomatique en français.
- source_word: חֲמָת וְאַרְפָּד
  choice: Hamath et Arpad
  rationale: Les noms de lieux sont translittérés selon les formes françaises courantes.
- source_word: סְפַרְוָיִם
  choice: Sepharvaïm
  rationale: Translittération française courante du nom de lieu, avec tréma pour guider la prononciation.
- source_word: וְכִי
  choice: Ont-ils donc
  rationale: « donc » restitue la force climactique et provocatrice de la question rhétorique sans transformer celle-ci en affirmation.
- source_word: הִצִּילוּ
  choice: délivré
  rationale: Le hiphil de נצל exprime ici l’action d’arracher ou de soustraire à une puissance ennemie; « délivrer » convient au contexte militaire.
- source_word: אֶת שֹׁמְרוֹן
  choice: Samarie
  rationale: La marque de l’objet direct n’est pas traduite; le nom de la ville suit sa forme française traditionnelle.
- source_word: מִיָּדִי
  choice: de ma main
  rationale: L’image concrète de la main comme pouvoir ou domination est claire en français et conserve la vantardise du discours.
theological_decisions:
- issue: Référent de « ma main » dans le discours du grand échanson
  choice: Conserver la vantardise à la première personne sans précision interprétative
  alternative: Expliciter « de la main du roi d’Assyrie » ou rendre « de mon pouvoir »
  rationale: L’hébreu met directement la parole provocatrice à la première personne. La traduction en préserve la tension et l’image sans identifier davantage le référent.
translation_notes:
  register: Français moderne, naturel et digne. Les questions brèves conservent le ton de défi. « De ma main » maintient l’image hébraïque, tandis que « donc » rend la portée rhétorique de וְכִי.
