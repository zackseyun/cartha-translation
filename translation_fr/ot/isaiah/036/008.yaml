source:
  edition: WLC
  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י הַ/מֶּ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/008.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: fr
  text: 'Et maintenant, je t’en prie, fais un pari[a] avec mon maître, le roi d’Assyrie : je te donnerai deux mille chevaux, si tu es capable de fournir des cavaliers pour les monter.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prends un engagement envers » ou « conclus un accord avec ». Le verbe hébreu peut désigner le fait de s’engager par un accord ou un pari ; ici, le contexte favorise le sens moqueur d’un pari ou d’un défi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Et maintenant
  rationale: Cette transition rend directement la conjonction et l’adverbe hébreux, tout en introduisant naturellement la nouvelle provocation.
- source_word: הִתְעָרֶב
  choice: fais un pari
  rationale: À la forme hitpael, avec אֶת et dans ce discours diplomatique moqueur, le verbe évoque un engagement pris sous forme de pari ou de défi. Cette formulation conserve la force provocatrice du propos.
- source_word: נָא
  choice: je t’en prie
  rationale: La particule adoucit formellement l’impératif. « Je t’en prie » préserve la politesse rhétorique, ici teintée d’ironie.
- source_word: אֶת אֲדֹנִי הַמֶּלֶךְ אַשּׁוּר
  choice: avec mon maître, le roi d’Assyrie
  rationale: אֶת désigne ici l’autre partie du pari, tandis que אֲדֹנִי renvoie au supérieur humain du porte-parole. « Mon maître » évite une possible lecture comme titre divin.
- source_word: וְאֶתְּנָה לְךָ
  choice: je te donnerai
  rationale: La formulation exprime clairement l’offre faite à l’interlocuteur, sans alourdir la phrase française.
- source_word: אַלְפַּיִם סוּסִים
  choice: deux mille chevaux
  rationale: Traduction directe de la quantité et du nom hébreux.
- source_word: אִם תּוּכַל
  choice: si tu es capable
  rationale: Cette expression conserve la condition de capacité et souligne légèrement la nuance de défi présente dans le contexte.
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: de fournir des cavaliers pour les monter
  rationale: Le sens est de mettre à disposition assez d’hommes aptes à monter les chevaux. Cette formulation est claire en français et conserve la référence explicite aux chevaux.
