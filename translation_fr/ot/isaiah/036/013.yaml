  yaml_path: translation/ot/isaiah/036/013.yaml
  text: Then the Rabshakeh stood and called out loudly in Judean, and said, “Hear the words of the great king, the king of Assyria.”
translation:
  language: fr
  text: 'Alors le Rab-Shaké se tint debout et cria d’une voix forte en judéen : « Écoutez les paroles du grand roi, le roi d’Assyrie ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le Rab-Shaké
  rationale: Translittération française traditionnelle du titre assyrien, conservé comme désignation du porte-parole.
- source_word: בְקוֹל גָּדוֹל
  choice: d’une voix forte
  rationale: Rend directement l’expression hébraïque indiquant le volume de la proclamation.
- source_word: יְהוּדִית
  choice: en judéen
  rationale: Désigne ici la langue du royaume de Juda, par opposition à l’araméen mentionné dans le contexte.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: du grand roi
  rationale: Conserve le titre emphatique employé par le représentant assyrien.
