- from: 'Alors Éliakim, Shebna et Yoah dirent au rab-shaké[a] : « S’il te plaît, parle à tes serviteurs en araméen, car nous le comprenons. Ne nous parle pas dans la langue de Juda[b], aux oreilles du peuple qui se trouve sur la muraille. »'
  to: 'Alors Éliakim, Shebna et Joach dirent au rab-shaké[a] : « Nous t’en prions, parle à tes serviteurs en araméen, car nous le comprenons. Ne nous parle pas dans la langue de Juda[b] à portée d’oreille du peuple qui est sur la muraille. »'
  rationale: La révision améliore le registre de la demande et remplace un calque hébraïque par une expression française idiomatique, sans modifier le sens ni supprimer l’ambiguïté lexicale concernant יְהוּדִית. Les notes sont resserrées afin de ne pas surinterpréter le titre assyrien et de préciser l’alternative lexicale.
