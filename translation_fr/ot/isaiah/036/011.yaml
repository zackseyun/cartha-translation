base_translation:
  language: en
  yaml_path: translation/ot/isaiah/036/011.yaml
  text: Then Eliakim[a], Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it[b]. And do not speak to us in Judean in the hearing of the people who are on the wall.”
translation:
  language: fr
  text: 'Alors Éliakim, Shebna et Joach dirent au rab-shaké[a] : « Nous t’en prions, parle à tes serviteurs en araméen, car nous le comprenons. Ne nous parle pas dans la langue de Juda[b] à portée d’oreille du peuple qui est sur la muraille. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le rab-shaké est vraisemblablement un titre d’un fonctionnaire assyrien plutôt qu’un nom personnel.
    reason: cultural_note
  - marker: b
    text: Ou « en hébreu ». Le terme hébreu יְהוּדִית désigne plus précisément la langue de Juda ou des Judéens.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: le rab-shaké
  rationale: Le terme d’origine akkadienne désigne vraisemblablement un titre officiel assyrien, mais la fonction exacte reste discutée. La translittération évite de préciser abusivement l’office et l’article français marque qu’il s’agit d’un titre.
- source_word: דַּבֶּר נָא
  choice: S’il te plaît, parle
  rationale: L’impératif accompagné de נָא exprime ici une demande polie et déférente.
- source_word: עֲבָדֶיךָ
  choice: tes serviteurs
  rationale: Dans ce contexte diplomatique, les responsables parlent d’eux-mêmes avec déférence. « Esclaves » exagérerait la relation sociale, tandis que « fonctionnaires » effacerait cette nuance.
- source_word: אֲרָמִית
  choice: en araméen
  rationale: La forme désigne la langue araméenne; cette tournure est naturelle en français moderne.
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: car nous le comprenons
  rationale: Même si שׁמע signifie littéralement « entendre », il prend couramment le sens de « comprendre » lorsqu’il est question d’une langue.
- source_word: יְהוּדִית
  choice: dans la langue de Juda
  rationale: Le mot renvoie précisément à la langue de Juda ou des Judéens. Cette formulation conserve la référence ethnogéographique sans imposer le terme linguistique plus général « hébreu ».
- source_word: בְּאָזְנֵי
  choice: aux oreilles de
  rationale: 'La formulation conserve l’image concrète de l’hébreu tout en restant intelligible : il s’agit de parler de manière à être entendu.'
- source_word: הָעָם אֲשֶׁר עַל הַחוֹמָה
  choice: le peuple qui se trouve sur la muraille
  rationale: « Peuple » traduit simplement הָעָם sans réduire le groupe à des soldats; la relative explicite sa position sur la muraille.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier hébreu employé envers l’émissaire. La demande demeure polie, tandis que « tes serviteurs » conserve la déférence diplomatique.
