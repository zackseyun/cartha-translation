base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/027.yaml
  text: The first says to Zion[a], ‘Look[d][c][b], here they are!’ and to Jerusalem I give a herald of good news.
translation:
  language: fr
  text: 'Je suis le premier à dire à Sion[a] : « Voici, les voici[b] ! » Et à Jérusalem, je donne un messager qui annonce une bonne nouvelle[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit de façon condensée : « premier à Sion ». On peut aussi comprendre : « Le premier dit à Sion » ou « En premier, à Sion ».'
    reason: alternative_reading
  - marker: b
    text: L’hébreu ne précise pas qui ou quoi est désigné par « les »; il peut s’agir de personnes ou d’événements qui viennent d’être annoncés.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « je donnerai à Jérusalem un messager qui annonce une bonne nouvelle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִאשׁוֹן לְצִיּוֹן
  choice: Je suis le premier à dire à Sion
  rationale: 'L’hébreu est très elliptique : « premier à/pour Sion », sans verbe exprimé. Le contexte porte sur celui qui annonce le premier ce qui va arriver. La formulation française restitue ce sens probable tout en signalant dans une note le caractère condensé et l’autre analyse possible.'
- source_word: הִנֵּה הִנָּם
  choice: 'Regardez : les voici !'
  rationale: Cette expression déictique redoublée attire fortement l’attention. « Regardez » rend l’appel initial, et « les voici » conserve le suffixe masculin pluriel sans préciser son référent.
- source_word: וְלִירוּשָׁלִַם
  choice: Et à Jérusalem
  rationale: La préposition ל marque naturellement le destinataire; la place initiale du complément maintient le parallélisme avec Sion.
- source_word: מְבַשֵּׂר
  choice: un messager qui annonce une bonne nouvelle
  rationale: Le participe de בשׂר désigne quelqu’un qui apporte ou proclame une bonne nouvelle. La proposition relative est claire et naturelle en français moderne.
- source_word: אֶתֵּן
  choice: je donne
  rationale: L’inaccompli à la première personne peut avoir une valeur présente ou future dans le discours prophétique. Le présent conserve ici le caractère vif de la déclaration, tandis que la possibilité du futur est indiquée en note.
theological_decisions:
- issue: Référent du pluriel dans « les voici »
  choice: Le référent reste implicite.
  alternative: Les exilés qui reviennent, les événements annoncés ou les agents de la délivrance.
  rationale: Le texte hébreu emploie un suffixe pluriel sans identifier explicitement les personnes ou les choses visées; les préciser réduirait indûment l’ambiguïté du texte.
- issue: Sujet et verbe sous-entendus dans la première proposition
  choice: « Je suis le premier à dire » explicite en français la lecture contextuelle la plus probable.
  alternative: « Le premier dit à Sion » ou, plus littéralement, « En premier, à Sion » sans verbe exprimé.
  rationale: La proposition hébraïque est elliptique. Le contexte immédiat oppose celui qui annonce d’avance aux idoles incapables de le faire. Une note préserve néanmoins l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme poétique entre Sion et Jérusalem, explicite avec prudence l’ellipse initiale et maintient l’indétermination du pronom pluriel.
