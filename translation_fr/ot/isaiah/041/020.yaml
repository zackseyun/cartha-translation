    issue: Coordination de la seconde clause divine
    rationale: Le waw de וּקְדוֹשׁ יִשְׂרָאֵל se rend le plus directement par « et », non par un deuxième « que », qui peut faire paraître la seconde clause comme une proposition de contenu indépendante plutôt que comme le membre coordonné du parallèle.
  - severity: low
    issue: Tour idiomatique de l’expression intérieure
    rationale: « Le prennent à cœur » est plus naturel en français que « prennent cela à cœur » et conserve l’idée de prendre intérieurement en considération.
