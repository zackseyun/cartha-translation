source:
  edition: WLC
  text: לְמַ֧עַן יִרְא֣וּ וְ/יֵדְע֗וּ וְ/יָשִׂ֤ימוּ וְ/יַשְׂכִּ֨ילוּ֙ יַחְדָּ֔ו כִּ֥י יַד יְהוָ֖ה עָ֣שְׂתָה זֹּ֑את וּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל בְּרָאָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/020.yaml
  text: so that they may see and know[a], and may consider and understand together, that the hand of Yahweh has done this, and the Holy One of Israel has created it.
translation:
  language: fr
  text: afin qu’ils voient et sachent, qu’ils le prennent à cœur et comprennent tous ensemble que la main de Yahweh a fait cela, et que le Saint d’Israël l’a créée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: afin que
  rationale: Introduit le but ou le résultat et convient naturellement à la série de verbes au subjonctif.
- source_word: יִרְאוּ וְיֵדְעוּ
  choice: qu’ils voient et sachent
  rationale: Préserve les sens fondamentaux de « voir » et « savoir », ainsi que leur progression cognitive.
- source_word: וְיָשִׂימוּ
  choice: qu’ils prennent cela à cœur
  rationale: Rend la valeur mentale et intérieure de שׂים dans ce contexte, plutôt qu’un simple acte de « mettre ».
- source_word: וְיַשְׂכִּילוּ
  choice: et comprennent
  rationale: Le hiphil de שׂכל exprime ici l’intelligence ou le discernement; « comprennent » est clair et naturel.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Exprime la dimension collective de l’adverbe sans alourdir la phrase.
- source_word: כִּי
  choice: que
  rationale: Introduit le contenu de ce qui doit être vu, su et compris.
- source_word: יַד יְהוָה
  choice: la main de Yahweh
  rationale: Conserve l’image hébraïque de la main comme expression de l’action et de la puissance divines, tout en rendant directement le nom divin.
- source_word: עָשְׂתָה זֹּאת
  choice: a fait cela
  rationale: Rend simplement le verbe large עשה et son démonstratif, qui renvoie à l’œuvre décrite dans le contexte.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: que le Saint d’Israël
  rationale: Conserve le titre divin caractéristique d’Ésaïe. La coordination française par répétition de « que » rend naturellement le waw sans suggérer deux agents.
- source_word: בְּרָאָהּ
  choice: l’a créé
  rationale: Préserve le verbe distinct ברא, « créer », et rend le suffixe féminin par un pronom reprenant « cela » comme l’œuvre évoquée.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR; Jéhovah
  rationale: Le texte porte directement le Tétragramme; « Yahweh » préserve le nom propre sans le remplacer par un titre.
- issue: Rapport entre « a fait cela » et « l’a créé »
  choice: Maintenir les deux propositions distinctes
  alternative: Fusionner les deux verbes en une seule formulation
  rationale: L’hébreu emploie עשה puis ברא. Les conserver respecte l’insistance rhétorique sur l’action créatrice divine sans imposer une distinction doctrinale supplémentaire.
- issue: Progression des quatre verbes cognitifs
  choice: voient / sachent / prennent cela à cœur / comprennent
  alternative: voient / reconnaissent / considèrent / acquièrent du discernement
  rationale: La formulation maintient les quatre mouvements distincts, y compris la nuance d’intériorisation possible de וְיָשִׂימוּ, sans réduire leur tension sémantique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme et l’accumulation de verbes de l’hébreu. Aucun appel de note n’est nécessaire, car la nuance intérieure de וְיָשִׂימוּ est intégrée au texte principal.
