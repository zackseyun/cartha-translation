source:
  edition: WLC
  text: מִֽי הִגִּ֤יד מֵ/רֹאשׁ֙ וְ/נֵדָ֔עָה וּ/מִ/לְּ/פָנִ֖ים וְ/נֹאמַ֣ר צַדִּ֑יק אַ֣ף אֵין מַגִּ֗יד אַ֚ף אֵ֣ין מַשְׁמִ֔יעַ אַ֥ף אֵין שֹׁמֵ֖עַ אִמְרֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/026.yaml
  text: Who declared it from the beginning[a], so that we might know, and beforehand, so that we might say, ‘He is right’? But there was no one declaring it, no one making it heard[b], no one hearing your words.
translation:
  language: fr
  text: 'Qui l’a annoncé dès le début[a], pour que nous le sachions, et d’avance, pour que nous disions : « Il a raison » ? Mais personne ne l’a annoncé, personne ne l’a fait entendre, personne n’a entendu vos paroles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dès le commencement » ou « depuis le premier moment ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי הִגִּיד
  choice: Qui l’a annoncé
  rationale: La question directe conserve la force du défi rhétorique. « Annoncer » rend naturellement le hiphil de נגד dans ce contexte de prédiction publique.
- source_word: מֵרֹאשׁ
  choice: dès le commencement
  rationale: Cette expression marque l’antériorité de l’annonce; « dès » fait ressortir le point de départ temporel sans préciser davantage le référent.
- source_word: וְנֵדָעָה
  choice: pour que nous le sachions
  rationale: Le cohortatif exprime ici le but ou le résultat attendu de l’annonce préalable.
- source_word: וּמִלְּפָנִים
  choice: et d’avance
  rationale: La formulation française est naturelle et maintient le parallélisme temporel avec « dès le commencement ».
- source_word: וְנֹאמַר צַדִּיק
  choice: 'pour que nous disions : « Il avait raison »'
  rationale: Dans ce défi portant sur une prédiction antérieure, צַדִּיק exprime une reconnaissance de justesse ou de véracité. L’imparfait français situe cette appréciation après la réalisation de l’annonce.
- source_word: אַף אֵין מַגִּיד
  choice: Mais personne ne l’a annoncé
  rationale: « Mais » marque le contraste conclusif, tandis que « personne » rend avec naturel la négation absolue.
- source_word: אַף אֵין מַשְׁמִיעַ
  choice: personne ne l’a fait entendre
  rationale: La tournure causative « faire entendre » reflète précisément le hiphil de שמע et conserve le parallélisme.
- source_word: אַף אֵין שֹׁמֵעַ אִמְרֵיכֶם
  choice: personne n’a entendu vos paroles
  rationale: La traduction reste proche de la construction hébraïque et maintient l’adresse polémique au pluriel.
theological_decisions:
- issue: Référent de l’objet implicite du défi de prédiction
  choice: Employer le pronom neutre contextuel « l’ » sans identifier une personne ni un événement précis.
  alternative: « Qui a annoncé cela » ou « Qui l’a annoncé, lui »
  rationale: L’hébreu ne donne aucun objet explicite. Le pronom français est nécessaire à la fluidité, mais son référent demeure volontairement indéterminé.
- issue: Sens de צַדִּיק dans ce contexte
  choice: « Il avait raison »
  alternative: « Il est juste » ou « Il est dans son droit »
  rationale: Le contexte demande un verdict sur la justesse d’une annonce prophétique plutôt qu’une affirmation générale de justice morale. La traduction préserve ainsi la portée probatoire du défi.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme ternaire final est conservé. Le passé composé rend naturellement les participes hébreux dans la conclusion rétrospective du défi, tandis que l’imparfait « avait raison » explicite la perspective temporelle sans modifier le verdict.
