id: ISA.41.1
reference: Isaiah 41:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַחֲרִ֤ישׁוּ אֵלַ/י֙ אִיִּ֔ים וּ/לְאֻמִּ֖ים יַחֲלִ֣יפוּ כֹ֑חַ יִגְּשׁוּ֙ אָ֣ז יְדַבֵּ֔רוּ יַחְדָּ֖ו לַ/מִּשְׁפָּ֥ט נִקְרָֽבָה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/001.yaml
  text: Be silent before me[a], coastlands; let the peoples renew their strength. Let them come near; then let them speak[c][b]. Together let us draw near for judgment.
translation:
  language: fr
  text: Faites silence devant moi, terres côtières[a] ! Que les peuples renouvellent leurs forces[b]. Qu’ils s’approchent, puis qu’ils parlent. Ensemble, approchons-nous pour le jugement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « îles » ou « rivages lointains » ; le terme hébreu peut désigner largement des territoires maritimes ou côtiers éloignés.
    reason: lexical_alternative
  - marker: b
    text: Ou « retrouvent de nouvelles forces » ; l’expression hébraïque évoque littéralement un changement ou un renouvellement de force.
    reason: lexical_alternative
  - marker: c
    text: Le mot hébreu peut aussi évoquer la justice, une cause judiciaire ou la décision rendue ; le contexte présente une convocation de type judiciaire.
    reason: cultural_note
lexical_decisions:
- source_word: הַחֲרִישׁוּ
  choice: Faites silence
  rationale: L’impératif hiphil commande ici le silence dans le cadre d’une convocation solennelle. « Faites silence » conserve cette force tout en restant naturel et digne en français moderne.
- source_word: אֵלַי
  choice: devant moi
  rationale: La préposition signifie littéralement « vers moi » ou « à moi ». Avec l’ordre de garder le silence, « devant moi » exprime naturellement la relation au locuteur sans ajouter explicitement l’idée d’écouter.
- source_word: אִיִּים
  choice: terres côtières
  rationale: Dans Ésaïe, le terme peut désigner des îles, des rivages ou, plus largement, des territoires maritimes éloignés. « Terres côtières » rend cette portée sans la limiter à des îles au sens strict.
- source_word: וּלְאֻמִּים
  choice: les peuples
  rationale: Le pluriel désigne des peuples ou des nations. « Les peuples » convient au parallélisme et garde une distinction lexicale possible avec d’autres mots hébreux souvent traduits par « nations ».
- source_word: יַחֲלִיפוּ כֹחַ
  choice: renouvellent leurs forces
  rationale: L’expression évoque un changement ou un renouvellement de force. Cette formulation conserve l’image hébraïque tout en exprimant que les peuples doivent rassembler de nouvelles forces avant de comparaître.
- source_word: יִגְּשׁוּ
  choice: Qu’ils s’approchent
  rationale: L’imparfait a ici une valeur jussive dans la suite de la convocation. La tournure française préserve cette nuance d’invitation ou d’ordre.
- source_word: אָז
  choice: puis
  rationale: 'L’adverbe marque l’étape suivante : les peuples doivent d’abord s’approcher, puis parler. « Puis » rend clairement cette progression.'
- source_word: יְדַבֵּרוּ
  choice: qu’ils parlent
  rationale: Le verbe signifie simplement « parler ». Le contexte judiciaire laisse entendre qu’ils exposent leur cause, mais le texte principal ne développe pas cette implication.
- source_word: יַחְדָּו
  choice: Ensemble
  rationale: L’adverbe indique que les parties s’avancent conjointement vers le jugement. Placé en tête, il garde son relief dans la dernière proposition.
- source_word: לַמִּשְׁפָּט
  choice: pour le jugement
  rationale: מִשְׁפָּט possède ici une forte dimension judiciaire, sans préciser à lui seul s’il s’agit de la procédure, de la décision ou de l’exercice de la justice. « Pour le jugement » maintient cette tension.
- source_word: נִקְרָבָה
  choice: approchons-nous
  rationale: La forme cohortative à la première personne du pluriel inclut le locuteur dans le mouvement vers le jugement. « Approchons-nous » en conserve directement la force exhortative.
theological_decisions:
- issue: Cadre judiciaire du verset
  choice: Présenter le passage comme une convocation divine à une confrontation judiciaire, sans expliciter davantage que l’hébreu.
  alternative: Traduire librement par « retrouvons-nous au tribunal » ou comprendre seulement un appel général à écouter.
  rationale: La succession des injonctions — faire silence, renouveler ses forces, s’approcher, parler et venir au jugement — évoque nettement une scène judiciaire. La traduction en préserve le caractère sans transformer l’allusion en paraphrase explicite.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Les impératifs et formes exhortatives maintiennent le rythme de la convocation. « Terres côtières » et « jugement » préservent la portée géographique et judiciaire tout en signalant leurs nuances en notes.
