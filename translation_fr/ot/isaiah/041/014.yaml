source:
  edition: WLC
  text: אַל תִּֽירְאִי֙ תּוֹלַ֣עַת יַֽעֲקֹ֔ב מְתֵ֖י יִשְׂרָאֵ֑ל אֲנִ֤י עֲזַרְתִּי/ךְ֙ נְאֻם יְהוָ֔ה וְ/גֹאֲלֵ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/014.yaml
  text: Do not fear[a], worm Jacob, men of Israel; I myself help you, declares Yahweh, your Redeemer[c][b], the Holy One of Israel.
translation:
  language: fr
  text: « N’aie pas peur, ver de Jacob[a], gens d’Israël[b] ! C’est moi qui t’aide[c], déclare Yahweh, ton rédempteur[d], le Saint d’Israël. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « ver de Jacob » : image de la faiblesse et de l’abaissement de Jacob, c’est-à-dire d’Israël.'
    reason: cultural_note
  - marker: b
    text: Ou « hommes d’Israël » ou « mortels d’Israël » ; le terme hébreu peut aussi, selon certaines analyses, suggérer un petit nombre de personnes.
    reason: lexical_alternative
  - marker: c
    text: Ou « je t’ai aidé » ou « je t’aiderai ». L’accompli hébreu peut exprimer ici une intervention présentée comme certaine.
    reason: alternative_reading
  - marker: d
    text: Le mot hébreu désigne notamment le proche qui intervient pour défendre les droits d’un membre de sa famille, le délivrer ou racheter ce qui lui appartient.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: N’aie pas peur
  rationale: La construction אַל suivie de l’imparfait exprime une défense. Le féminin singulier s’accorde avec Jacob personnifié comme une collectivité ; cette distinction n’est pas audible dans la formulation française retenue.
- source_word: תּוֹלַעַת יַעֲקֹב
  choice: vermisseau de Jacob
  rationale: תּוֹלַעַת désigne littéralement un ver. « Vermisseau » conserve en français l’image frappante de faiblesse et d’abaissement, sans la réduire à une simple paraphrase.
- source_word: מְתֵי יִשְׂרָאֵל
  choice: mortels d’Israël
  rationale: מְתֵי signifie « hommes » ou « mortels ». Dans le parallélisme avec « vermisseau de Jacob », « mortels » met en évidence la fragilité humaine tout en évitant de limiter indûment l’adresse aux seuls hommes de sexe masculin.
- source_word: אֲנִי
  choice: C’est moi qui
  rationale: Le pronom sujet explicite est emphatique. La tournure clivée française en restitue naturellement l’insistance.
- source_word: עֲזַרְתִּיךְ
  choice: t’aide
  rationale: Le verbe est formellement à l’accompli, mais il intervient dans une assurance prophétique et peut avoir une portée présente ou future. Le présent français exprime l’assurance sans l’enfermer dans un passé ponctuel.
- source_word: נְאֻם יְהוָה
  choice: déclaration de Yahweh
  rationale: נְאֻם introduit solennellement une parole divine. Le nom propre Yahweh rend directement le tétragramme יְהוָה.
- source_word: וְגֹאֲלֵךְ
  choice: moi, ton rédempteur
  rationale: Le participe גֹאֵל désigne celui qui revendique, délivre ou rachète en qualité de proche protecteur. « Rédempteur » conserve le titre traditionnel et sa portée de délivrance ; la reprise de « moi » rend claire en français l’apposition à Yahweh.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette formulation conserve le titre divin caractéristique du livre d’Ésaïe et son poids théologique.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » le traite comme le nom d’alliance plutôt que de le remplacer par un titre.
- issue: Portée temporelle de עֲזַרְתִּיךְ
  choice: C’est moi qui t’aide
  alternative: je t’ai aidé ; je t’aiderai
  rationale: L’accompli hébreu peut présenter l’intervention divine comme assurée, même si son accomplissement est présent ou futur. Une note maintient cette tension temporelle.
- issue: Valeur de מְתֵי יִשְׂרָאֵל
  choice: mortels d’Israël
  alternative: hommes d’Israël ; gens d’Israël ; petit nombre d’Israël
  rationale: Le mot peut désigner des hommes ou des mortels et, selon certaines analyses, évoquer leur petit nombre. Le contexte souligne surtout la fragilité d’Israël ; la note conserve les autres possibilités.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le tutoiement singulier suit Jacob personnifié et les suffixes féminins singuliers de l’hébreu. Le passage momentané au vocatif pluriel « mortels d’Israël » conserve la tension grammaticale et poétique du texte source. Les métaphores et les titres divins ne sont pas atténués.
