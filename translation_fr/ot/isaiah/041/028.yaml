base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/028.yaml
  text: And I looked[a], but there was no man; among these there was no counselor, that I might ask them[b] and they would answer a word.
translation:
  language: fr
  text: 'J’ai regardé : il n’y avait personne[a]. Parmi ceux-ci, il n’y avait pas de conseiller que je puisse interroger et qui puisse répondre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il n’y avait pas d’homme ». Le masculin singulier hébreu peut ici représenter toute personne.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « et ils répondent une parole » ; c’est-à-dire, une réponse quelconque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרֶא
  choice: J’ai regardé
  rationale: Le qal inaccompli à la première personne peut, dans ce discours prophétique, évoquer un examen présenté rétrospectivement. « J’ai regardé » conserve la dimension d’observation.
- source_word: וְאֵין אִישׁ
  choice: il n’y avait personne
  rationale: אִישׁ signifie littéralement « homme », mais dans cette construction négative il désigne idiomatiquement l’absence de quiconque. « Personne » est ici le français naturel sans modifier le sens référentiel.
- source_word: וּמֵאֵלֶּה
  choice: Parmi ceux-ci
  rationale: 'La préposition מִן est comprise dans son sens partitif : aucun conseiller ne se trouve parmi les êtres ou objets qui viennent d’être examinés. Le démonstratif reste volontairement non explicité.'
- source_word: וְאֵין יוֹעֵץ
  choice: pas un conseiller
  rationale: Le participe substantivé יוֹעֵץ désigne quelqu’un qui conseille. La tournure elliptique française conserve la brièveté et renforce l’idée qu’il n’en existe aucun.
- source_word: וְאֶשְׁאָלֵם
  choice: que je puisse interroger
  rationale: L’inaccompli coordonné se comprend comme une possibilité liée à l’absence de conseiller, plutôt que comme le récit d’une interrogation effectivement accomplie. Le suffixe masculin pluriel est rendu implicitement par le relatif dont l’antécédent est « conseiller » dans une construction distributive.
- source_word: וְיָשִׁיבוּ דָבָר
  choice: et qui me donne une réponse
  rationale: Le hiphil de שוב exprime ici l’action de répondre, tandis que דָבָר, littéralement « une parole », désigne idiomatiquement une réponse. Cette formulation française est naturelle tout en maintenant le parallélisme potentiel de la proposition.
theological_decisions:
- issue: Référent de « ceux-ci » et identité du conseiller absent
  choice: Ne pas préciser le référent dans le texte principal
  alternative: Identifier explicitement « ceux-ci » aux idoles ou à leurs représentants
  rationale: Ésaïe 41.21-29 met principalement en scène une contestation judiciaire des idoles, mais le démonstratif hébreu ne nomme pas lui-même son référent. La traduction préserve cette retenue et la possible portée plus large visant leurs représentants ou les puissances des nations.
- issue: Valeur de אִישׁ
  choice: personne
  alternative: homme
  rationale: Bien que le nom hébreu soit masculin singulier, l’expression existentielle négative signifie ici qu’aucun individu capable de répondre ne se trouve là. En français moderne, « personne » rend directement cette fonction représentative, tandis qu’une note signale la forme littérale.
- issue: Rapport entre l’interrogation et la réponse
  choice: 'Possibilité non réalisée : « que je puisse interroger »'
  alternative: 'Séquence passée : « quand je les ai interrogés »'
  rationale: 'Le contexte et les inaccomplis permettent une nuance potentielle ou finale : il ne se trouve aucun conseiller susceptible d’être interrogé et de répondre. La traduction n’impose donc pas une interrogation passée qui ne ressort pas nécessairement de la forme verbale.'
translation_notes:
  register: Français international moderne, digne et lisible. Le deux-points et la proposition elliptique reproduisent la progression serrée du verset. « Ceux-ci » conserve l’ambiguïté du démonstratif hébreu ; les notes rendent accessibles les formulations plus littérales.
