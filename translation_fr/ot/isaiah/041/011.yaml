  verdict: revise
  source_fidelity: 'Révision nécessaire pour deux nuances : הֵן est mieux rendu par « Voici », qui conserve l’appel d’attention prophétique, que par « Oui », davantage purement affirmatif ; et יִהְיוּ כְאַיִן exprime « ils deviendront/seront comme rien », sans introduire le passif implicite de « seront réduits à rien ». Le reste rend fidèlement le parallélisme : honte, humiliation, disparition et conflit.'
  naturalness: Le français révisé est moderne, international et solennel. « Voici » est naturel dans ce registre prophétique sans être archaïque ; « deviendront comme rien » est clair et respecte l’image comparative hébraïque.
  terminology: « Couverts de honte », « humiliés », « furieux contre toi », « périront » et « les hommes qui te cherchent querelle » sont appropriés. Le dernier groupe conserve le nom masculin אַנְשֵׁי tout en rendant naturellement la notion de litige ou de contention de רִיב.
