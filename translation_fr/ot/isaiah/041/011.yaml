source:
  edition: WLC
  text: הֵ֤ן יֵבֹ֨שׁוּ֙ וְ/יִכָּ֣לְמ֔וּ כֹּ֖ל הַ/נֶּחֱרִ֣ים בָּ֑/ךְ יִֽהְי֥וּ כְ/אַ֛יִן וְ/יֹאבְד֖וּ אַנְשֵׁ֥י רִיבֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/011.yaml
  text: Behold[a], all who are enraged against you will be put to shame and humiliated; they will become as nothing, and the men who contend with you will perish.
translation:
  language: fr
  text: Voici, tous ceux qui sont furieux contre toi seront couverts de honte et humiliés ; ils deviendront comme rien, et les hommes qui te cherchent querelle périront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule attire l’attention tout en affirmant avec force ce qui suit. « Oui » garde ici cette valeur emphatique dans un français actuel et digne.
- source_word: יֵבֹשׁוּ
  choice: seront couverts de honte
  rationale: Le verbe exprime la honte ou le déshonneur résultant d’un renversement. Cette tournure française rend mieux le résultat objectif que le simple sentiment d’avoir honte.
- source_word: וְיִכָּלְמוּ
  choice: et humiliés
  rationale: Le niphal de כלם renforce le premier verbe par une idée voisine d’humiliation ou de déshonneur, sans que le parallélisme soit aplati.
- source_word: כֹּל הַנֶּחֱרִים בָּךְ
  choice: tous ceux qui sont furieux contre toi
  rationale: Le participe de חרה évoque littéralement l’embrasement et, idiomatiquement, une vive colère hostile. « Furieux contre toi » en restitue naturellement l’intensité.
- source_word: יִהְיוּ כְאַיִן
  choice: ils seront réduits à rien
  rationale: Cette expression rend le passage futur à l’insignifiance ou à la non-existence effective. Elle est naturelle en français, même si elle explicite légèrement la valeur résultative de l’hébreu « seront comme rien ».
- source_word: וְיֹאבְדוּ
  choice: périront
  rationale: 'Le qal de אבד est ici intransitif : disparaître ou périr. « Périront » conserve cette force sans introduire explicitement un agent destructeur.'
- source_word: אַנְשֵׁי רִיבֶךָ
  choice: les hommes qui te cherchent querelle
  rationale: La construction signifie littéralement « les hommes de ton litige ». « Te cherchent querelle » conserve à la fois l’hostilité et la nuance de conflit portée par ריב, tout en gardant le nom masculin אַנְשֵׁי.
theological_decisions:
- issue: Expression masculine אַנְשֵׁי רִיבֶךָ
  choice: les hommes qui te cherchent querelle
  alternative: ceux qui te cherchent querelle
  rationale: Le texte hébreu emploie explicitement le nom masculin pluriel « hommes ». Le conserver évite de neutraliser sans nécessité une donnée formelle du texte, sans pour autant tirer une conclusion doctrinale sur la portée du jugement.
- issue: Nature de la disparition annoncée
  choice: seront réduits à rien… périront
  alternative: seront comme rien… disparaîtront
  rationale: Le verset annonce la défaite complète des adversaires, mais ne précise pas ici les modalités ni une doctrine détaillée de leur sort. La traduction maintient la force du langage sans l’interpréter davantage.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le parallélisme prophétique est conservé, avec deux termes distincts pour la honte et l’humiliation. Aucun appel de note n’est nécessaire, les nuances principales étant rendues directement dans le texte.
