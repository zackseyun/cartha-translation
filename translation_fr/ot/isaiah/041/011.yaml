    rationale: « Oui » rend la certitude, mais atténue la valeur présentative et appelant l’attention de הֵן. « Voici » correspond mieux au texte source et à l’audit anglais « Behold ».
  - severity: medium
    issue: יִהְיוּ כְאַיִן est rendu par « seront réduits à rien ».
    rationale: Cette formulation suggère plus explicitement une action subie ou un agent réducteur. L’hébreu emploie « être/devenir » avec « comme rien » ; « deviendront comme rien » conserve la forme et l’image sans préciser le mécanisme.
  revised_text: Voici, tous ceux qui sont furieux contre toi seront couverts de honte et humiliés ; ils deviendront comme rien, et les hommes qui te cherchent querelle périront.
