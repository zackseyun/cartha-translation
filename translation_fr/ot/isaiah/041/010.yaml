source:
  edition: WLC
  text: אַל תִּירָא֙ כִּ֣י עִמְּ/ךָ אָ֔נִי אַל תִּשְׁתָּ֖ע כִּֽי אֲנִ֣י אֱלֹהֶ֑י/ךָ אִמַּצְתִּ֨י/ךָ֙ אַף עֲזַרְתִּ֔י/ךָ אַף תְּמַכְתִּ֖י/ךָ בִּ/ימִ֥ין צִדְקִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/010.yaml
  text: Do not fear[a], for I am with you; do not look around in dread, for I am your God. I will strengthen you; surely I will help you[b]; surely I will uphold you with my righteous right hand.
translation:
  language: fr
  text: N’aie pas peur, car je suis avec toi ; ne regarde pas autour de toi avec angoisse[a], car je suis ton Dieu. Je te fortifierai ; oui, je t’aiderai ; oui, je te soutiendrai par la main droite de ma justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne sois pas consterné ». Le verbe hébreu semble évoquer le fait de regarder autour de soi avec inquiétude ou effroi.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la main droite de ma justice ».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Rend directement la prohibition formée sur ירא dans un français actuel et naturel.
- source_word: כִּי עִמְּךָ אָנִי
  choice: car je suis avec toi
  rationale: כִּי introduit ici le motif de l’exhortation ; « car » en conserve clairement la valeur causale et le ton poétique.
- source_word: אַל תִּשְׁתָּע
  choice: ne regarde pas autour de toi avec angoisse
  rationale: Le verbe semble évoquer le fait de regarder autour de soi sous l’effet de l’inquiétude ou de l’effroi. Cette formulation conserve l’image concrète sans sacrifier la clarté.
- source_word: אֲנִי אֱלֹהֶיךָ
  choice: je suis ton Dieu
  rationale: Traduction directe de l’affirmation d’identité et de relation.
- source_word: אִמַּצְתִּיךָ
  choice: je te fortifierai
  rationale: Dans cette suite d’assurances divines, le futur français exprime naturellement la valeur de promesse du parfait hébreu.
- source_word: אַף
  choice: oui
  rationale: Ici, אַף renforce chaque assurance. La répétition de « oui » restitue sobrement la progression emphatique.
- source_word: עֲזַרְתִּיךָ
  choice: je t’aiderai
  rationale: Rend le sens courant de עזר et, au futur, son rôle de promesse dans le contexte.
- source_word: תְּמַכְתִּיךָ
  choice: je te soutiendrai
  rationale: תמך exprime l’action de soutenir ou de maintenir ; « soutenir » convient à l’image de la main qui suit.
- source_word: בִּימִין צִדְקִי
  choice: de ma main droite juste
  rationale: La préposition est comprise comme instrumentale. Cette formulation française conserve le lien entre la main droite divine et la justice, sans réduire צֶדֶק à une seule nuance.
theological_decisions:
- issue: Sens de בִּימִין צִדְקִי
  choice: de ma main droite juste
  alternative: de la main droite de ma justice
  rationale: Le tour retenu reste lisible en français tout en présentant la puissance qui soutient comme caractérisée par la justice. La note conserve la construction hébraïque plus formelle et son ambiguïté.
- issue: Valeur temporelle des trois verbes d’assurance
  choice: 'futurs de promesse : « je te fortifierai… je t’aiderai… je te soutiendrai »'
  alternative: 'accomplis ou présents d’assurance : « je t’ai fortifié… » ou « je te fortifie… »'
  rationale: Bien que les formes hébraïques soient des parfaits, leur enchaînement dans ce discours prophétique fonctionne comme une série d’assurances. Le futur transmet clairement cette portée sans prétendre que la morphologie hébraïque équivaut à un futur simple.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit l’adresse hébraïque. Les répétitions et le parallélisme sont maintenus afin de préserver la force poétique des assurances divines.
