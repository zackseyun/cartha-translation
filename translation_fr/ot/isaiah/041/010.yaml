  to: N’aie pas peur, car je suis avec toi ; ne regarde pas autour de toi avec angoisse[a], car je suis ton Dieu. Je te fortifierai ; oui, je t’aiderai ; oui, je te soutiendrai par la main droite de ma justice[b].
  rationale: La révision est limitée à la dernière assurance. « Par » rend clairement l’emploi instrumental de ב, tandis que « la main droite de ma justice » préserve la construction hébraïque et son ouverture sémantique mieux que « ma main droite juste ». La ponctuation en propositions brèves maintient la progression emphatique de la série.
