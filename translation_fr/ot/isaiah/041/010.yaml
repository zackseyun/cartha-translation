  terminology: « Dieu », « fortifier », « aider » et « soutenir » conviennent. La formulation révisée de l’expression finale conserve le terme théologique « justice » et la structure du syntagme hébreu sans lui attribuer d’avance une nuance confessionnelle particulière.
