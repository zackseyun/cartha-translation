id: ISA.41.5
reference: Isaiah 41:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: רָא֤וּ אִיִּים֙ וְ/יִירָ֔אוּ קְצ֥וֹת הָ/אָ֖רֶץ יֶחֱרָ֑דוּ קָרְב֖וּ וַ/יֶּאֱתָיֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/005.yaml
  text: The coastlands have seen and fear[a]; the ends of the earth tremble[b]. They draw near and come.
translation:
  language: fr
  text: Les îles l’ont vu et ont pris peur[a] ; les extrémités de la terre tremblent. Elles s’approchent et viennent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rivages » ou « les terres côtières lointaines ».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ
  choice: l’ont vu
  rationale: Le parfait exprime ici une perception accomplie dont découle la réaction présente. Le pronom « l’ » laisse le référent implicite comme en hébreu.
- source_word: אִיִּים
  choice: les îles
  rationale: Le terme peut désigner des îles, des rivages ou, plus largement, des régions maritimes lointaines. « Les îles » est naturel en français prophétique et conserve l’image géographique concrète.
- source_word: וְיִירָאוּ
  choice: et ont pris peur
  rationale: Le verbe ירא indique ici la peur suscitée par ce qui a été vu, sans imposer l’idée d’adoration ou de crainte révérencielle.
- source_word: קְצוֹת הָאָרֶץ
  choice: les extrémités de la terre
  rationale: Cette expression rend l’idiome hébreu désignant les régions les plus éloignées du monde, dans un registre digne et intelligible.
- source_word: יֶחֱרָדוּ
  choice: tremblent
  rationale: חרד associe tremblement physique et effroi ; « tremblent » préserve cette double force sans surinterprétation.
- source_word: קָרְבוּ
  choice: Elles s’approchent
  rationale: Le verbe marque un mouvement vers un point sans préciser ici l’intention de ce mouvement.
- source_word: וַיֶּאֱתָיוּן
  choice: et viennent
  rationale: Ce verbe poétique signifie « venir ». La formulation conserve le parallélisme rapproché et légèrement répétitif de l’hébreu.
theological_decisions:
- issue: Nature de la réaction des nations lointaines
  choice: Une réaction de peur et de tremblement, suivie d’un mouvement d’approche dont l’intention reste indéterminée.
  alternative: Une crainte révérencielle ou un rassemblement explicitement hostile.
  rationale: Le verset exprime clairement l’effroi, mais ne dit pas à lui seul si l’approche est soumise, hostile ou liée à la fabrication d’idoles décrite ensuite. La traduction maintient cette tension.
translation_notes:
  register: 'Français moderne, international et digne. Le pluriel féminin des sujets géographiques est repris par « Elles ». La coordination brève préserve le rythme poétique et la progression : voir, craindre, trembler, s’approcher, venir.'
