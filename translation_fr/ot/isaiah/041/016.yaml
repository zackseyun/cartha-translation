revisions:
- from: Tu les vanneras[a] ; le vent les emportera et la tempête les dispersera. Mais toi, tu te réjouiras en Yahweh[b] ; tu te glorifieras dans le Saint d’Israël[c].
  to: Tu les vanneras[a] ; le vent les emportera, et la tempête les dispersera. Mais toi, tu te réjouiras en Yahweh[b] ; tu mettras ta fierté dans le Saint d’Israël[c].
  rationale: La révision conserve l’imagerie et la syntaxe fondamentales du texte source. Elle remplace une tournure française un peu moins naturelle par « mettre sa fierté dans », sans réduire la force positive de הלל au hitpael. La note c documente également le féminin singulier de l’hébreu sans introduire dans le texte un référent absent du verset même.
