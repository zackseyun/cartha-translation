review_pass:
  verdict: revise
  source_fidelity: 'Le sens du texte hébreu est globalement bien rendu : le vannage, le vent qui emporte, la tempête qui disperse, puis la joie et la glorification en Yahweh/le Saint d’Israël sont conservés. Toutefois, le pronom hébreu est au féminin singulier ; le français « tu » ne permet pas d’en rendre la portée sans ambiguïté. Dans le contexte, Sion/Israël est interpellée au féminin. Une formulation féminine est donc une correction sûre et plus fidèle.'
  naturalness: La phrase est claire et de registre moderne. « Te glorifieras dans » est compréhensible, mais demeure moins idiomatique en français actuel que « mettras ta fierté dans », tout en rendant adéquatement le hitpael de הלל dans ce contexte.
  terminology: « Yahweh » rend directement le tétragramme, conformément au choix fourni. « le Saint d’Israël » est le rendu exact du titre isaïen. « Vanner » préserve à juste titre l’imagerie agricole du contexte.
  issues:
  - severity: medium
    issue: Le destinataire féminin singulier n’est pas explicitement rendu.
    rationale: Les formes verbales hébraïques תזרם, תגיל et תתהלל sont au féminin singulier. Le français « tu » est grammaticalement neutre à l’écrit dans cette forme, mais l’ajout de « fille de Sion » ou une autre explicitation ne serait pas justifié dans le verset. Employer « tu seras heureuse » altérerait le lexique. Une note peut signaler que le « tu » vise Sion/Israël au féminin ; la traduction reste structurellement acceptable mais la note améliore la fidélité.
  - severity: low
    issue: « Tu te glorifieras dans » est légèrement lourd en français moderne.
    rationale: La construction est possible et proche de formulations bibliques traditionnelles, mais « tu mettras ta fierté dans le Saint d’Israël » est plus naturel tout en conservant le sens de se glorifier/placer son sujet de fierté en Dieu.
