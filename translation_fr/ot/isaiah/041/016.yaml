base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/016.yaml
  text: You will winnow them[a], and the wind will carry them away, and the storm will scatter them; but you will rejoice in Yahweh[c][b]; in the Holy One of Israel you will boast.
translation:
  language: fr
  text: Tu les vanneras[a] ; le vent les emportera, et la tempête les dispersera. Mais toi, tu te réjouiras en Yahweh[b] ; tu mettras ta fierté dans le Saint d’Israël[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu les disperseras ». Le verbe hébreu peut désigner l’action de disperser en général ; « vanner » conserve ici l’image du battage.'
    reason: lexical_alternative
  - marker: b
    text: Le nom hébreu YHWH est rendu ici par « Yahweh ».
    reason: textual_clarification
  - marker: c
    text: 'Ou : « tu te glorifieras dans le Saint d’Israël ». Les verbes hébreux s’adressent à un féminin singulier, Sion/Israël dans le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּזְרֵם
  choice: tu les vanneras
  rationale: Le verbe זרה peut exprimer l’action de disperser, mais « vanner » maintient ici l’image agricole du battage et de la balle emportée par le vent, présente dans le contexte immédiat.
- source_word: רוּחַ
  choice: le vent
  rationale: Le parallélisme avec la tempête et l’action d’emporter désignent clairement le vent, plutôt que l’esprit ou le souffle.
- source_word: תִּשָּׂאֵם
  choice: les emportera
  rationale: Le verbe נשׂא signifie porter ou soulever ; dans l’image du vannage, « emporter » exprime naturellement l’action du vent sur la balle.
- source_word: סְעָרָה
  choice: la tempête
  rationale: Le terme désigne un vent violent ou une tempête. « Tempête » est précis, naturel et n’impose pas la forme plus particulière d’un tourbillon.
- source_word: תָּפִיץ אוֹתָם
  choice: les dispersera
  rationale: Le hifil de פוץ signifie faire disperser. « Dispersera » rend clairement l’éparpillement produit par la tempête.
- source_word: תָּגִיל
  choice: tu te réjouiras
  rationale: גיל exprime une joie vive ou l’exultation. « Se réjouir » est actuel, digne et conserve l’idée essentielle.
- source_word: בַּיהוָה
  choice: en Yahweh
  rationale: La préposition ב marque ici l’objet ou la sphère de la joie. Le nom divin יהוה est rendu directement par « Yahweh ».
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: dans le Saint d’Israël
  rationale: Le titre divin caractéristique d’Ésaïe est rendu intégralement. « Dans » préserve le parallélisme avec « en Yahweh ».
- source_word: תִּתְהַלָּל
  choice: tu te glorifieras
  rationale: Le hitpael de הלל signifie se glorifier ou mettre sa fierté en quelqu’un. Dans ce contexte, il s’agit d’une confiance exultante centrée sur Dieu, non d’une exaltation autonome de soi.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le tétragramme יהוה. « Yahweh » rend le nom propre explicitement, tandis qu’une note signale sa forme hébraïque.
- issue: Portée de תִּתְהַלָּל
  choice: tu te glorifieras dans le Saint d’Israël
  alternative: tu mettras ta fierté dans le Saint d’Israël
  rationale: « Se glorifier dans » maintient la force théologique et la construction parallèle de l’hébreu sans transformer cette joie en orgueil personnel. L’alternative plus idiomatique est conservée en note.
translation_notes:
  register: Français international moderne, au registre digne et accessible. La ponctuation fait ressortir le contraste entre la dispersion des ennemis et la joie du destinataire. Le vocabulaire agricole est maintenu afin de relier le verset à l’image du battage dans le contexte.
