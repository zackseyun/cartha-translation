  text: הָ/עֲנִיִּ֨ים וְ/הָ/אֶבְיוֹנִ֜ים מְבַקְשִׁ֥ים מַ֨יִם֙ וָ/אַ֔יִן לְשׁוֹנָ֖/ם בַּ/צָּמָ֣א נָשָׁ֑תָּה אֲנִ֤י יְהוָה֙ אֶעֱנֵ֔/ם אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֹ֥א אֶעֶזְבֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/017.yaml
  text: The poor and needy seek water[a], but there is none; their tongue is parched with thirst. I, Yahweh, will answer them; I, the God of Israel, will not forsake them.
translation:
  language: fr
  text: Les pauvres et les nécessiteux cherchent de l’eau, mais il n’y en a pas ; leur langue est desséchée par la soif. Moi, Yahweh, je leur répondrai ; moi, le Dieu d’Israël, je ne les abandonnerai pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲנִיִּים וְהָאֶבְיוֹנִים
  choice: Les pauvres et les nécessiteux
  rationale: Le premier terme peut désigner les pauvres, les affligés ou les opprimés ; associé à אֶבְיוֹנִים, il met ici au premier plan leur dénuement. « Nécessiteux » maintient la distinction du parallélisme sans réduire les deux termes à un seul.
- source_word: מְבַקְשִׁים מַיִם וָאַיִן
  choice: cherchent de l’eau, mais il n’y en a pas
  rationale: Le participe exprime une recherche en cours. La tournure française rend naturellement l’absence de l’eau recherchée, tandis que « mais » explicite la valeur adversative du contexte.
- source_word: לְשׁוֹנָם בַּצָּמָא נָשָׁתָּה
  choice: leur langue est desséchée par la soif
  rationale: Le singulier collectif hébreu est conservé dans une image naturelle en français. « Desséchée » restitue directement l’idée de sécher ou de se flétrir, et « par la soif » en indique la cause.
- source_word: אֲנִי יְהוָה אֶעֱנֵם
  choice: Moi, Yahweh, je leur répondrai
  rationale: Le pronom indépendant est emphatique ; la dislocation « Moi… je » en restitue naturellement l’insistance en français. ענה signifie ici répondre à leur détresse.
- source_word: אֱלֹהֵי יִשְׂרָאֵל לֹא אֶעֶזְבֵם
  choice: moi, le Dieu d’Israël, je ne les abandonnerai pas
  rationale: La reprise de « moi… je » fait entendre le parallélisme emphatique. « Abandonner » exprime clairement et dignement le poids relationnel de עזב en français moderne.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le Tétragramme, nom propre du Dieu d’Israël. « Yahweh » le distingue du titre אֲדֹנָי et suit ici la couche de consultation anglaise mise à jour, sans transformer le nom en titre.
- issue: Portée de la réponse divine
  choice: je leur répondrai
  alternative: je les exaucerai
  rationale: Le verbe ענה signifie directement « répondre ». « Exaucer » supposerait plus explicitement une prière formulée et résoudrait une nuance que le verset laisse implicite.
translation_notes:
  register: Français international moderne, poétique et digne. Le parallélisme hébreu et l’insistance des pronoms divins sont préservés par la construction « Moi… je ». Aucun marqueur de note n’est requis, puisqu’aucune note n’est proposée.
