source:
  edition: WLC
  text: וְ/אַתָּה֙ יִשְׂרָאֵ֣ל עַבְדִּ֔/י יַעֲקֹ֖ב אֲשֶׁ֣ר בְּחַרְתִּ֑י/ךָ זֶ֖רַע אַבְרָהָ֥ם אֹהֲבִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/008.yaml
  text: But you[a], Israel, my servant, Jacob, whom I have chosen, offspring of Abraham, my friend—
translation:
  language: fr
  text: Mais toi, Israël, mon serviteur, Jacob, que j’ai choisi, descendance d’Abraham, mon ami[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « celui qui m’aime ».'
    reason: La forme hébraïque est un participe qui peut décrire Abraham comme celui qui aime Dieu, même si elle prend ici naturellement le sens relationnel de « mon ami ».
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Mais toi
  rationale: La conjonction suivie du pronom indépendant marque ici le contraste avec les nations et les fabricants d’idoles du contexte précédent. « Mais toi » rend naturellement cette valeur adversative en français.
- source_word: יִשְׂרָאֵל
  choice: Israël
  rationale: Le nom propre est conservé sous sa forme française usuelle.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: עבד peut désigner un esclave ou un serviteur, mais il fonctionne ici comme un titre exprimant la relation d’Israël à Dieu. « Mon serviteur » convient au contexte sans accentuer indûment la condition servile.
- source_word: יַעֲקֹב
  choice: Jacob
  rationale: Le nom propre est conservé sous sa forme française usuelle et se trouve en apposition à Israël.
- source_word: אֲשֶׁר בְּחַרְתִּיךָ
  choice: que j’ai choisi
  rationale: La proposition relative se rapporte à Jacob, c’est-à-dire Israël. Le passé composé exprime naturellement en français l’acte accompli du choix divin dont la portée demeure actuelle.
- source_word: זֶרַע אַבְרָהָם
  choice: descendance d’Abraham
  rationale: זֶרַע est un singulier collectif. « Descendance » conserve cette valeur collective tout en étant plus naturel en français moderne que « semence » ou « postérité ».
- source_word: אֹהֲבִי
  choice: mon ami
  rationale: Le participe muni du suffixe de première personne peut signifier littéralement « celui qui m’aime », mais il peut aussi exprimer idiomatiquement une relation d’amitié. « Mon ami » rend clairement ce sens relationnel, tandis que la lecture plus littérale est conservée en note.
theological_decisions:
- issue: Sens de אֹהֲבִי à propos d’Abraham
  choice: mon ami
  alternative: celui qui m’aime
  rationale: Dans ce contexte, le participe peut désigner Abraham comme celui qui aime Dieu ou, idiomatiquement, comme l’ami de Dieu. Le texte principal retient le sens relationnel naturel en français, sans effacer l’autre analyse possible, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure en appositions du texte hébreu est maintenue. Le tiret final indique que l’adresse se poursuit au verset suivant.
