id: ISA.41.13
reference: Isaiah 41:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֗י אֲנִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מַחֲזִ֣יק יְמִינֶ֑/ךָ הָ/אֹמֵ֥ר לְ/ךָ֛ אַל תִּירָ֖א אֲנִ֥י עֲזַרְתִּֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/013.yaml
  text: For I am Yahweh your God[a], who takes hold of your right hand, who says to you, ‘Do not fear; I will help you.’
translation:
  language: fr
  text: 'Car moi, Yahweh, ton Dieu, je saisis ta main droite et je te dis : « N’aie pas peur, je t’aiderai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu porte formellement « je t’ai aidé »; dans ce contexte de promesse et de réassurance, la forme est rendue par « je t’aiderai ».
    reason: alternative lexicale et aspectuelle
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de ne pas avoir peur et conserve naturellement le lien logique avec le contexte.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel au lieu de lui substituer un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Conserve le possessif singulier et la relation d’alliance exprimée dans l’adresse directe.
- source_word: מַחֲזִיק יְמִינֶךָ
  choice: je saisis ta main droite
  rationale: Le participe hiphil de חזק décrit ici l’action de tenir fermement ou de saisir; la formulation garde l’image concrète de la main droite tout en étant naturelle en français.
- source_word: הָאֹמֵר לְךָ
  choice: et je te dis
  rationale: Rend naturellement le second participe appositionnel, qui poursuit la description de Yahweh parlant directement à son serviteur.
- source_word: אַל תִּירָא
  choice: N’aie pas peur
  rationale: Formulation courante, claire et directe de l’interdiction négative.
- source_word: עֲזַרְתִּיךָ
  choice: je t’aiderai
  rationale: Bien que la forme soit un accompli, le contexte de réassurance lui donne une force de promesse; le futur français exprime clairement cette assurance, tandis que la valeur formelle est signalée en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: Jéhovah; le SEIGNEUR
  rationale: Le texte porte le tétragramme comme nom propre; sa transcription préserve le nom personnel sans le remplacer par un titre.
- issue: Valeur aspectuelle de עֲזַרְתִּיךָ dans une parole de réassurance
  choice: 'sens promissoire au futur : « je t’aiderai »'
  alternative: « je t’aide »; formellement, « je t’ai aidé »
  rationale: L’accompli hébreu peut présenter comme certaine l’aide promise. Le futur convient à l’exhortation « N’aie pas peur », sans effacer la forme hébraïque, explicitée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement conserve l’adresse hébraïque au singulier. L’image concrète de la main droite et le nom divin sont maintenus.
