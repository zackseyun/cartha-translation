source:
  edition: WLC
  text: אֲשֶׁ֤ר הֶחֱזַקְתִּ֨י/ךָ֙ מִ/קְצ֣וֹת הָ/אָ֔רֶץ וּ/מֵ/אֲצִילֶ֖י/הָ קְרָאתִ֑י/ךָ וָ/אֹ֤מַר לְ/ךָ֙ עַבְדִּ/י אַ֔תָּה בְּחַרְתִּ֖י/ךָ וְ/לֹ֥א מְאַסְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/009.yaml
  text: you whom I took hold of from the ends of the earth[a], and called from its farthest corners, and said to you, ‘You are my servant; I have chosen you and not rejected you,’
translation:
  language: fr
  text: 'toi que j’ai saisi aux extrémités de la terre et appelé depuis ses confins[a], toi à qui j’ai dit : « Tu es mon serviteur, je t’ai choisi et je ne t’ai pas rejeté »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « depuis ses extrémités ». Le terme hébreu est discuté. Certains le comprennent comme « depuis ses nobles », mais le sens géographique correspond mieux au parallélisme avec « les extrémités de la terre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזַקְתִּיךָ
  choice: j’ai saisi
  rationale: Le hiphil de חזק peut exprimer l’action de saisir ou de fortifier. Avec le complément « aux extrémités de la terre », le sens concret de prendre ou saisir quelqu’un est le plus probable.
- source_word: מִקְצוֹת הָאָרֶץ
  choice: aux extrémités de la terre
  rationale: Cette expression désigne les régions les plus éloignées. « Aux extrémités de la terre » conserve l’image géographique et le parallélisme poétique.
- source_word: וּמֵאֲצִילֶיהָ
  choice: depuis ses confins
  rationale: Dans ce contexte géographique, אציליה désigne probablement les côtés, extrémités ou confins de la terre. « Ses confins » exprime naturellement l’éloignement tout en préservant le parallélisme; l’autre analyse, « ses nobles », est signalée en note.
- source_word: קְרָאתִיךָ
  choice: appelé
  rationale: « Appeler » rend naturellement le verbe קרא et laisse subsister à la fois l’idée d’appel et celle de convocation divine.
- source_word: עַבְדִּי
  choice: mon serviteur
  rationale: עבד peut désigner un esclave ou un serviteur. Dans l’adresse à Israël/Jacob chez Ésaïe, « serviteur » est le terme français naturel et approprié au contexte.
- source_word: בְּחַרְתִּיךָ
  choice: je t’ai choisi
  rationale: Le passé composé présente le choix antérieur comme toujours pertinent dans la situation présente et s’accorde naturellement avec la proposition suivante.
- source_word: מְאַסְתִּיךָ
  choice: je ne t’ai pas rejeté
  rationale: מאס exprime ici le refus ou le rejet. « Rejeter » est clair en français moderne et convient à l’assurance donnée dans ce contexte d’élection.
theological_decisions:
- issue: Référent de la deuxième personne du singulier
  choice: Maintenir « toi/tu » au singulier dans tout le verset, Israël/Jacob étant interpellé collectivement comme un seul serviteur.
  alternative: Employer un pluriel pour expliciter la dimension collective.
  rationale: L’hébreu emploie constamment le masculin singulier. Le conserver respecte la personnification collective et évite de modifier la structure littéraire et théologique de l’adresse.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « toi » reproduit l’insistance de l’adresse hébraïque; « confins » conserve la poésie sans être archaïque.
