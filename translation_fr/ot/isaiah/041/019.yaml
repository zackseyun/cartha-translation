  variant: modern international French
source:
  edition: WLC
  text: אֶתֵּ֤ן בַּ/מִּדְבָּר֙ אֶ֣רֶז שִׁטָּ֔ה וַ/הֲדַ֖ס וְ/עֵ֣ץ שָׁ֑מֶן אָשִׂ֣ים בָּ/עֲרָבָ֗ה בְּר֛וֹשׁ תִּדְהָ֥ר וּ/תְאַשּׁ֖וּר יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/019.yaml
  text: I will put in the wilderness cedar[a], acacia, myrtle, and olive tree; I will set in the desert cypress, plane tree, and pine together[b],
translation:
  language: fr
  text: Je mettrai dans le désert le cèdre, l’acacia, le myrte et l’olivier[a] ; je placerai dans la plaine aride le cyprès, le platane et le pin, tous ensemble[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « arbre à huile » ; l’expression hébraïque signifie littéralement « arbre d’huile » ou « arbre à huile ».
    reason: lexical_alternative
  - marker: b
    text: L’identification exacte du « cyprès », du « platane » et du « pin » est incertaine. On propose aussi, respectivement, le genévrier ou le sapin, l’orme, et le buis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתֵּן
  choice: Je mettrai
  rationale: Le verbe signifie couramment « donner », mais, avec des arbres et un complément de lieu, « mettre » rend naturellement ici l’idée de les placer.
- source_word: בַּמִּדְבָּר
  choice: dans le désert
  rationale: מִדְבָּר désigne une région sauvage et non cultivée, souvent aride ; « désert » est idiomatique en français tout en convenant au parallélisme poétique.
- source_word: אֶרֶז
  choice: le cèdre
  rationale: Identification traditionnelle et bien établie, probablement le cèdre du Liban dans de nombreux emplois bibliques.
- source_word: שִׁטָּה
  choice: l’acacia
  rationale: Équivalent botanique moderne et clair du nom hébreu.
- source_word: הֲדַס
  choice: le myrte
  rationale: Équivalent botanique usuel et largement reconnu.
- source_word: עֵץ שָׁמֶן
  choice: l’olivier
  rationale: L’expression signifie littéralement « arbre à huile » ; dans ce contexte, elle désigne vraisemblablement l’olivier. La traduction littérale possible est signalée en note.
- source_word: אָשִׂים
  choice: je placerai
  rationale: Le verbe est parallèle à אֶתֵּן et exprime la mise en place ; « placerai » conserve ce sens tout en reproduisant la variation poétique.
- source_word: בָּעֲרָבָה
  choice: dans la plaine aride
  rationale: עֲרָבָה peut désigner une steppe ou plaine désertique, ou la région de l’Araba. Le parallélisme favorise ici le sens commun ; « plaine aride » le distingue de מִדְבָּר sans en faire un nom propre.
- source_word: בְּרוֹשׁ
  choice: le cyprès
  rationale: « Cyprès » est un équivalent traditionnel plausible, mais l’espèce exacte reste incertaine, ce que signale la note.
- source_word: תִּדְהָר
  choice: le platane
  rationale: « Platane » est une identification moderne courante, sans être certaine ; une autre possibilité est donnée en note.
- source_word: תְאַשּׁוּר
  choice: le pin
  rationale: « Pin » convient au contexte et correspond à une identification courante, mais le nom botanique hébreu demeure incertain.
- source_word: יַחְדָּו
  choice: tous ensemble
  rationale: Cette expression restitue l’accent collectif de l’adverbe hébreu et s’intègre naturellement à l’énumération.
theological_decisions: []
