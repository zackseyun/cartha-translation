revisions:
- from: Voici, je fais de toi un traîneau à battre le grain, neuf et tranchant, muni de nombreuses dents[a]. Tu fouleras les montagnes et tu les réduiras en poussière, tu rendras les collines pareilles à la paille.
  to: Voici, j’ai fait de toi un traîneau de dépiquage neuf et tranchant, muni de dents tranchantes[a]. Tu fouleras les montagnes et tu les broieras ; tu rendras les collines pareilles à la balle.
  rationale: La révision rend le parfait initial, emploie « balle » pour le résidu léger du grain, et évite de résoudre dans le texte la forme ou le nombre des éléments coupants de l’instrument. Elle maintient l’imagerie agricole et topographique sans l’interpréter.
