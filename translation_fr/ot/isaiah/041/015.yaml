base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/015.yaml
  text: Behold[a], I have made you a new sharp threshing sledge with double edges; you will thresh the mountains and crush them, and you will make the hills like chaff.
translation:
  language: fr
  text: Voici, j’ai fait de toi un traîneau de dépiquage neuf et tranchant, muni de dents tranchantes[a]. Tu fouleras les montagnes et tu les broieras ; tu rendras les collines pareilles à la balle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu dit littéralement « possédant des bouches » ; l’expression peut évoquer des dents tranchantes, des tranchants doubles ou des dents crénelées.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marqueur emphatique qui attire l’attention sur la déclaration divine; « Voici » conserve la solennité prophétique tout en restant courant.
- source_word: שַׂמְתִּיךְ
  choice: je fais de toi
  rationale: שׂוּם exprime ici l’établissement ou la transformation métaphorique. Le parfait hébreu peut présenter l’acte divin comme assuré; le présent français rend naturellement cette déclaration performative dans le contexte.
- source_word: לְמוֹרַג
  choice: un traîneau à battre le grain
  rationale: מוֹרַג désigne un instrument de dépiquage, généralement une lourde planche ou un traîneau garni de pièces coupantes. La formulation explicite sa fonction pour le lectorat moderne.
- source_word: חָרוּץ חָדָשׁ
  choice: neuf et tranchant
  rationale: Les deux adjectifs décrivent l’instrument comme neuf et coupant; l’ordre français naturel est retenu sans perdre les deux traits.
- source_word: בַּעַל פִּיפִיּוֹת
  choice: muni de nombreuses dents
  rationale: L’expression signifie littéralement « possédant des bouches/tranchants ». Dans la description d’un instrument de dépiquage, « dents » restitue concrètement ses éléments coupants, tandis que la note conserve l’incertitude sur leur forme ou leur nombre.
- source_word: תָּדוּשׁ
  choice: tu fouleras
  rationale: דּוּשׁ désigne l’action de battre ou fouler lors du dépiquage. « Fouler » s’accorde bien avec l’image d’un traîneau passant sur les montagnes.
- source_word: וְתָדֹק
  choice: et tu les réduiras en poussière
  rationale: דקק exprime l’action de broyer très finement. Le pronom reprend naturellement « les montagnes »; « réduire en poussière » rend le résultat intensif.
- source_word: וּגְבָעוֹת כַּמֹּץ תָּשִׂים
  choice: tu rendras les collines pareilles à la paille
  rationale: שׂוּם a ici une valeur résultative. מֹץ désigne les débris légers séparés lors du battage; « paille » est une formulation française naturelle dans cette image agricole.
theological_decisions:
- issue: Sens métaphorique des montagnes et des collines
  choice: Conserver intégralement l’image agricole et topographique
  alternative: Identifier explicitement les montagnes et les collines à des peuples, des ennemis ou des obstacles
  rationale: Le verset ne précise pas lui-même le référent de ces éléments. Les interpréter dans le corps du texte supprimerait une ambiguïté poétique et théologique authentique.
- issue: Aspect du parfait שַׂמְתִּיךְ
  choice: « je fais de toi »
  alternative: « j’ai fait de toi »
  rationale: Dans cette promesse prophétique, le parfait peut présenter comme certain l’acte souverain de Dieu. Le présent français rend la déclaration vive et immédiate sans nier son caractère accompli ou assuré.
translation_notes:
  register: Français international moderne, digne et imagé. Le terme technique « traîneau à battre le grain » est rendu intelligible par sa fonction. La métaphore concrète est préservée sans explicitation doctrinale.
