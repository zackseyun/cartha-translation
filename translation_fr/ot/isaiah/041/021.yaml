    rationale: L’hébreu עֲצֻמוֹתֵיכֶם qualifie les éléments apportés comme forts ou puissants, mais ne les compare pas à d’autres arguments. « Les plus solides » ajoute une intensification comparative non exprimée.
  - severity: low
    issue: 'Note a : littéralisme inexact de l’impératif'
    rationale: קָרְבוּ est un impératif pluriel de « approcher/s’avancer ». « Faites approcher votre litige » change inutilement la construction verbale. Une note indiquant « Approchez avec votre cause/litige » rend mieux la formulation tout en signalant son caractère littéral.
