base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/021.yaml
  text: Present your case,” says Yahweh[c][b][a]; “bring forward your strong arguments,” says the King of Jacob.
translation:
  language: fr
  text: « Présentez votre cause[a], dit Yahweh[c] ; avancez vos arguments solides[b], dit le roi de Jacob. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Approchez avec votre litige / votre cause. » Il s’agit d’une sommation formulée dans le langage d’un procès.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « présentez vos raisons fortes », « vos preuves » ou « vos moyens de défense ».'
    reason: lexical_alternative
  - marker: c
    text: 'Hébreu : YHWH, traditionnellement rendu par « le SEIGNEUR ».'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרְבוּ רִיבְכֶם
  choice: Présentez votre cause
  rationale: Littéralement, l’expression invite à faire approcher le litige. Dans ce contexte de confrontation judiciaire, « Présentez votre cause » restitue naturellement en français la sommation juridique et la force de l’impératif.
- source_word: יֹאמַר
  choice: dit
  rationale: Le présent français « dit » convient à la formule de discours prophétique et demeure naturel dans une citation directe.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Cette forme rend le nom divin YHWH comme nom propre au lieu de lui substituer un titre.
- source_word: הַגִּישׁוּ עֲצֻמוֹתֵיכֶם
  choice: avancez vos arguments les plus solides
  rationale: Le verbe signifie faire approcher ou présenter. Le substantif rare désigne ici vraisemblablement des raisons fortes, des preuves ou des moyens de défense. Cette formulation française conserve la force suggérée par le terme tout en rendant clairement la scène judiciaire.
- source_word: מֶלֶךְ יַעֲקֹב
  choice: le Roi de Jacob
  rationale: La formulation conserve le nom Jacob et la relation exprimée par la construction hébraïque, sans la remplacer par « Israël ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » préserve sa fonction de nom propre, tandis que « le SEIGNEUR » représente la lecture traditionnelle.
- issue: Portée judiciaire de l’image
  choice: Présentez votre cause… avancez vos arguments
  alternative: Approchez votre litige… faites approcher vos raisons fortes
  rationale: Le contexte est celui d’une sommation judiciaire. Le français idiomatique explicite ce cadre sans ajouter de conclusion théologique au défi lancé.
- issue: Sens du terme rare עֲצֻמוֹתֵיכֶם
  choice: vos arguments les plus solides
  alternative: vos raisons fortes ; vos preuves ; vos moyens de défense
  rationale: Le terme admet plusieurs nuances dans ce contexte. Le texte principal exprime l’idée de force argumentative, et la note conserve les autres possibilités réelles.
translation_notes:
  register: Français international actuel, digne et accessible. La ponctuation fait entendre deux injonctions parallèles. « Cause » et « arguments » maintiennent le cadre judiciaire, tandis que les notes signalent les formulations plus littérales et l’incertitude lexicale.
