  terminology: « Yahweh » reproduit correctement le choix de rendre le tétragramme comme nom propre. « Jacob » doit être conservé. « Cause », « arguments solides », « preuves » et « moyens de défense » maintiennent l’ambiguïté lexicale et judiciaire du texte sans la surinterpréter.
  issues:
