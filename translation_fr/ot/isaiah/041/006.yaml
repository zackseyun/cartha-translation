  text: אִ֥ישׁ אֶת רֵעֵ֖/הוּ יַעְזֹ֑רוּ וּ/לְ/אָחִ֖י/ו יֹאמַ֥ר חֲזָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/006.yaml
  text: Each man helps his neighbor[a], and says to his brother[b], “Be strong!”
translation:
  language: fr
  text: 'Chacun aide son prochain[a] et dit à son frère[b] : « Courage ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son compagnon » ou « son ami ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « frère » peut aussi désigner plus largement un proche, un compatriote ou un membre du même groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Chacun
  rationale: Le singulier אִישׁ a ici une valeur distributive, confirmée par le verbe hébreu au pluriel. « Chacun » rend naturellement cette portée collective sans alourdir la phrase.
- source_word: אֶת רֵעֵהוּ
  choice: son prochain
  rationale: רֵעַ peut désigner le prochain, le compagnon ou l’ami. « Prochain » conserve le sens interpersonnel général sans supposer une relation d’amitié.
- source_word: יַעְזֹרוּ
  choice: aide
  rationale: L’imparfait décrit ici la scène de façon vive plutôt qu’il ne marque nécessairement le futur. Le présent français convient, avec le singulier exigé par « chacun ».
- source_word: וּלְאָחִיו
  choice: et dit à son frère
  rationale: אָח signifie directement « frère », tout en pouvant désigner plus largement un proche, un compatriote ou un membre du même groupe. Le terme direct préserve le parallélisme avec « prochain ».
- source_word: יֹאמַר
  choice: dit
  rationale: Comme יַעְזֹרוּ, cet imparfait s’intègre naturellement à une description au présent.
- source_word: חֲזָק
  choice: Courage !
  rationale: L’impératif de חזק exhorte à être fort et résolu. L’ellipse française « Courage ! » est actuelle, naturelle et conserve pleinement la force exhortative.
theological_decisions: []
