id: ISA.41.23
reference: Isaiah 41:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הַגִּ֨ידוּ֙ הָ/אֹתִיּ֣וֹת לְ/אָח֔וֹר וְ/נֵ֣דְעָ֔ה כִּ֥י אֱלֹהִ֖ים אַתֶּ֑ם אַף תֵּיטִ֣יבוּ וְ/תָרֵ֔עוּ וְ/נִשְׁתָּ֖עָה ו/נרא יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/023.yaml
  text: Declare to us the things to come afterward[a], that we may know that you are gods; indeed, do good or do harm[c][b], that we may be dismayed and see together.
translation:
  language: fr
  text: Annoncez ce qui arrivera par la suite[a], afin que nous sachions que vous êtes des dieux. Oui, faites du bien ou du mal[b], afin que nous soyons saisis d’effroi[c] et que nous voyions ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les choses ultérieures ». L’expression hébraïque désigne ce qui vient après et sert ici à défier les idoles de prédire l’avenir.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « faites du bien et faites du mal ». Il s’agit d’un défi lancé aux idoles : qu’elles manifestent un pouvoir réel, bénéfique ou nuisible.'
    reason: lexical_alternative
  - marker: c
    text: Le verbe hébreu est rare. Il peut aussi évoquer le fait de regarder avec stupeur ou de porter ses regards autour de soi avec effroi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ
  choice: Annoncez
  rationale: L’impératif pluriel de נגד lance aux idoles le défi de faire connaître publiquement ce qui doit arriver. « Annoncez » conserve le ton solennel et provocateur.
- source_word: הָאֹתִיּוֹת לְאָחוֹר
  choice: ce qui arrivera par la suite
  rationale: L’expression désigne littéralement « les choses ultérieures » et, dans ce contexte, met les idoles au défi de prédire l’avenir. La formulation retenue explicite naturellement sa portée temporelle.
- source_word: וְנֵדְעָה
  choice: afin que nous sachions
  rationale: Le cohortatif à la première personne du pluriel, après l’impératif, exprime ici le but ou le résultat attendu.
- source_word: כִּי אֱלֹהִים אַתֶּם
  choice: que vous êtes des dieux
  rationale: 'Le pronom et le contexte sont pluriels : le prophète s’adresse aux prétendues divinités et les met au défi de prouver leur pouvoir.'
- source_word: אַף
  choice: Oui
  rationale: La particule renforce le défi qui suit. « Oui » rend cette insistance avec naturel en français.
- source_word: תֵּיטִיבוּ וְתָרֵעוּ
  choice: faites du bien ou du mal
  rationale: Les deux verbes opposés défient les idoles de produire un effet réel, bénéfique ou nuisible. « Ou » exprime naturellement cette alternative en français.
- source_word: וְנִשְׁתָּעָה
  choice: afin que nous soyons saisis d’effroi
  rationale: La forme verbale est rare. Dans cette provocation, elle peut décrire l’effroi ou la stupeur que susciterait une véritable démonstration de puissance.
- source_word: וְנִרְאֶה
  choice: et que nous voyions
  rationale: Le verbe signifie simplement « voir » et ne porte pas d’objet explicite dans le texte hébreu ; la traduction préserve cette absence.
- source_word: יַחְדָּו
  choice: ensemble
  rationale: L’adverbe final indique une réaction ou une observation collective.
theological_decisions:
- issue: Traduction de אֱלֹהִים dans une polémique contre les idoles
  choice: des dieux
  alternative: des êtres divins ; Dieu
  rationale: 'L’adresse à la deuxième personne du pluriel et le contexte polémique imposent ici le pluriel « des dieux ». La traduction ne reconnaît pas leur réalité divine : elle restitue le défi ironique qui leur est lancé.'
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de défi prophétique est conservé, ainsi que l’ambiguïté du verbe rare וְנִשְׁתָּעָה. Aucun objet n’est ajouté après « voyions », conformément à l’hébreu.
