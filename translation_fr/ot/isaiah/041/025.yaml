review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien conservé : initiative divine, provenance nord et est, appel au nom divin, puis image du potier. Toutefois, « marchera sur les dirigeants » anticipe et renforce le verbe de la seconde comparaison (« il foule »), alors que וְיָבֹא exprime d’abord la venue/attaque contre les dirigeants. La note b contient en outre une alternative inexacte : « appeler en mon nom » ne correspond pas à « appeler/invoquer mon nom ».'
  naturalness: Le français est globalement clair et d’un registre approprié. « Du soleil levant » est plus idiomatique et plus concis que « depuis le soleil levant » dans cette indication d’origine. « Viendra contre les dirigeants, comme contre de l’argile » conserve la construction comparative inhabituelle mais intelligible de l’hébreu et évite de confondre les deux verbes de l’image.
  terminology: « Suscité », « dirigeants », « argile », « potier » et « glaise » sont adaptés. « Invoque mon nom » est possible, mais une note doit proposer des alternatives sémantiquement exactes, telles que « fait appel à mon nom » et « proclame mon nom ».
  issues:
  - severity: medium
    issue: « Il marchera sur les dirigeants » traduit וְיָבֹא de manière trop interprétative.
    rationale: Le texte distingue la venue hostile contre les dirigeants (וְיָבֹא) du fait de fouler la glaise (יִרְמָס). La formulation proposée les fusionne et réduit la progression de l’image.
  - severity: medium
    issue: La note b propose « il appelle en mon nom ».
    rationale: Cette expression française signifie plutôt agir ou parler au nom de quelqu’un ; elle ne rend pas l’hébreu יִקְרָא בִשְׁמִי, « appeler/invoquer mon nom ».
  revised_text: Je l’ai suscité du nord, et il est venu ; du soleil levant[a], il invoque mon nom[b]. Il viendra contre les dirigeants, comme contre de l’argile, comme un potier qui foule la glaise.
  revised_footnotes:
