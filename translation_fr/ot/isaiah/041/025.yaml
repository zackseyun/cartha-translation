    text: 'Ou : « de l’est » ; littéralement : « du lever du soleil ».'
    reason: lexical_alternative
  - marker: b
    text: Peut aussi se traduire par « il fait appel à mon nom » ou « il proclame mon nom ».
    reason: lexical_alternative
