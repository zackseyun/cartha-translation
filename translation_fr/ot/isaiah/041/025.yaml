  variant: modern international French
source:
  edition: WLC
  text: הַעִיר֤וֹתִי מִ/צָּפוֹן֙ וַ/יַּ֔את מִ/מִּזְרַח שֶׁ֖מֶשׁ יִקְרָ֣א בִ/שְׁמִ֑/י וְ/יָבֹ֤א סְגָנִים֙ כְּמוֹ חֹ֔מֶר וּ/כְמ֥וֹ יוֹצֵ֖ר יִרְמָס טִֽיט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/025.yaml
  text: I have stirred up one from the north[a], and he has come; from the rising of the sun he calls on my name. He will come upon rulers as upon clay[c][b], and like a potter he treads mud.
translation:
  language: fr
  text: Je l’ai suscité du nord, et il est venu ; du soleil levant[a], il invoque mon nom[b]. Il viendra contre les dirigeants, comme contre de l’argile, comme un potier qui foule la glaise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’est » ; littéralement : « du lever du soleil ».'
    reason: lexical_alternative
  - marker: b
    text: Peut aussi se traduire par « il fait appel à mon nom » ou « il proclame mon nom ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִירוֹתִי
  choice: Je l’ai suscité
  rationale: Le hiphil de עור exprime ici l’action de mettre quelqu’un en mouvement ou de le faire entrer en action. « Suscité » est naturel et digne, tout en maintenant clairement l’initiative divine.
- source_word: מִצָּפוֹן
  choice: du nord
  rationale: Traduction directe de l’indication géographique.
- source_word: וַיַּאת
  choice: et il est venu
  rationale: Le parfait suivi du wayyiqtol peut former une séquence à valeur accomplie. Le passé composé rend lisiblement cette perspective prophétique.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: depuis le soleil levant
  rationale: L’expression hébraïque signifie littéralement « depuis le lever du soleil » et désigne l’est. « Depuis le soleil levant » conserve l’image sans devenir obscur ; l’équivalent géographique figure en note.
- source_word: יִקְרָא בִשְׁמִי
  choice: il invoque mon nom
  rationale: קרא בשם peut signifier appeler, invoquer ou proclamer un nom. « Invoque mon nom » rend bien l’idiome sans déterminer à lui seul la nature exacte de l’attitude religieuse du personnage ; l’ambiguïté est signalée en note.
- source_word: וְיָבֹא סְגָנִים
  choice: Il marchera sur les dirigeants
  rationale: Le verbe de venue, suivi des hauts responsables et de l’image de piétinement, décrit une avancée hostile. « Marchera sur » relie naturellement le mouvement à la comparaison suivante sans surcharger le texte.
- source_word: סְגָנִים
  choice: les dirigeants
  rationale: Le terme désigne des hauts fonctionnaires, gouverneurs ou chefs. « Dirigeants » convient à la portée politique générale du contexte.
- source_word: כְּמוֹ חֹמֶר
  choice: comme sur de l’argile
  rationale: חֹמֶר désigne l’argile. L’ajout syntaxique de « sur » en français rattache clairement la comparaison à l’action exercée contre les dirigeants.
- source_word: וּכְמוֹ יוֹצֵר יִרְמָס טִיט
  choice: comme un potier qui foule la glaise
  rationale: יוֹצֵר est celui qui façonne, ici le potier ; רמס signifie fouler ou piétiner ; טיט désigne la boue, la glaise ou le limon. « Glaise » est naturel dans l’image du potier, tandis que « foule » conserve à la fois le geste artisanal et sa force menaçante.
theological_decisions:
- issue: Identité du personnage suscité par Dieu
  choice: Conserver le pronom « il » sans nommer le personnage.
  alternative: L’identifier explicitement à Cyrus.
  rationale: Le contexte est couramment compris comme visant Cyrus, mais ce verset hébreu ne le nomme pas. La traduction ne doit pas transformer une identification contextuelle en mention explicite.
- issue: Portée religieuse de יִקְרָא בִשְׁמִי
  choice: Traduire « il invoque mon nom » tout en signalant d’autres nuances possibles.
  alternative: « il proclame mon nom » ou « il m’appelle par mon nom »
  rationale: L’expression peut évoquer l’invocation, l’appel ou la proclamation du nom divin. Le verset ne tranche pas entièrement la question de la piété personnelle du conquérant ; la formulation et la note préservent cette tension.
translation_notes:
  register: Français international moderne, au registre digne et accessible. Le rythme en deux mouvements est conservé. Les images concrètes du soleil levant, de l’argile et du potier sont maintenues, sans nommer Cyrus ni préciser au-delà de l’hébreu la nature de son rapport au nom divin.
