revisions:
- from: Je l’ai suscité du nord, et il est venu ; depuis le soleil levant[a], il invoque mon nom[b]. Il marchera sur les dirigeants comme sur de l’argile, comme un potier qui foule la glaise.
  to: Je l’ai suscité du nord, et il est venu ; du soleil levant[a], il invoque mon nom[b]. Il viendra contre les dirigeants, comme contre de l’argile, comme un potier qui foule la glaise.
  rationale: La révision maintient l’ambiguïté du personnage et de son rapport au nom divin, sans le nommer ni en déduire une piété particulière. Elle restitue plus nettement la distinction hébraïque entre sa venue contre les dirigeants et l’action de fouler la glaise, tout en corrigeant l’alternative fautive de la note b.
