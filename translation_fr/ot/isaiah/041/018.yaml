id: ISA.41.18
reference: Isaiah 41:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אֶפְתַּ֤ח עַל שְׁפָיִים֙ נְהָר֔וֹת וּ/בְ/ת֥וֹךְ בְּקָע֖וֹת מַעְיָנ֑וֹת אָשִׂ֤ים מִדְבָּר֙ לַ/אֲגַם מַ֔יִם וְ/אֶ֥רֶץ צִיָּ֖ה לְ/מוֹצָ֥אֵי מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/018.yaml
  text: I will open rivers on the bare heights[a], and springs in the midst of the valleys; I will make the wilderness into a pool of water[b], and the dry land into springs of water.
translation:
  language: fr
  text: Je ferai jaillir des fleuves sur les hauteurs dénudées[a], et des sources au milieu des vallées. Je changerai le désert en étendue d’eau[b], et la terre aride en points d’où jaillit l’eau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « collines dénudées » ou « hauteurs stériles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « bassin d’eau » ou « marais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְתַּח
  choice: Je ferai jaillir
  rationale: Le sens de base est « ouvrir ». Avec des fleuves comme complément, « faire jaillir » exprime naturellement en français l’ouverture de voies d’eau par Dieu, sans rendre la tournure obscure.
- source_word: שְׁפָיִים
  choice: hauteurs dénudées
  rationale: Le nom désigne des hauteurs exposées et dépourvues de végétation. Cette formulation conserve à la fois le relief et la stérilité, sans la connotation cultuelle possible de « hauts lieux ».
- source_word: נְהָרוֹת
  choice: fleuves
  rationale: « Fleuves » maintient la valeur forte du pluriel hébreu et l’image d’abondance, même si « rivières » serait également possible en français courant.
- source_word: וּבְתוֹךְ בְּקָעוֹת
  choice: au milieu des vallées
  rationale: La traduction conserve בְּתוֹךְ, « au milieu de », et rend בְּקָעוֹת par « vallées », en contraste poétique avec les hauteurs.
- source_word: מַעְיָנוֹת
  choice: sources
  rationale: Le terme désigne des sources naturelles. « Sources » est précis, actuel et évite l’idée de fontaines artificielles.
- source_word: אָשִׂים
  choice: Je changerai
  rationale: Dans ce contexte de transformation, « changer en » rend idiomatiquement שׂים avec לְ, littéralement « faire de / établir comme », sans ajouter d’interprétation.
- source_word: מִדְבָּר
  choice: le désert
  rationale: « Désert » est naturel et largement compréhensible; il désigne ici une région inculte et aride, sans exiger l’image d’une mer de sable.
- source_word: לַאֲגַם מַיִם
  choice: en étendue d’eau
  rationale: אֲגַם peut désigner une nappe, un bassin ou une zone marécageuse. « Étendue d’eau » garde cette relative indétermination en français.
- source_word: אֶרֶץ צִיָּה
  choice: la terre aride
  rationale: La formule rend l’état de sécheresse intense de la terre avec un registre courant et digne.
- source_word: לְמוֹצָאֵי מָיִם
  choice: en points d’où jaillit l’eau
  rationale: מוֹצָאֵי désigne littéralement les lieux de sortie de l’eau. Cette formulation distingue ce terme du précédent מַעְיָנוֹת tout en conservant son image concrète.
theological_decisions:
- issue: Nature des images de transformation
  choice: Conserver la promesse divine sous la forme concrète d’une transformation de lieux arides par une eau abondante.
  alternative: Expliciter un renouvellement spirituel ou une transformation eschatologique.
  rationale: L’hébreu présente directement des fleuves, des sources et des terres transformées. La traduction ne doit pas imposer une lecture allégorique ou un cadre eschatologique particulier.
translation_notes:
  register: Français international moderne, poétique mais accessible. Le parallélisme des hauteurs, des vallées, du désert et de la terre aride est conservé. Les formulations évitent les archaïsmes et n’explicitent aucune interprétation confessionnelle.
