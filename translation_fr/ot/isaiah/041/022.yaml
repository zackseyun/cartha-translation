  to: Qu’ils les présentent et qu’ils nous disent ce qui arrivera. Qu’ils nous disent ce que sont les événements passés, afin que nous y appliquions notre cœur[a] et que nous en connaissions l’issue[b] ; ou faites-nous entendre les événements à venir.
