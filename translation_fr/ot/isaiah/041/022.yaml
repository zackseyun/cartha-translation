source:
  edition: WLC
  text: יַגִּ֨ישׁוּ֙ וְ/יַגִּ֣ידוּ לָ֔/נוּ אֵ֖ת אֲשֶׁ֣ר תִּקְרֶ֑ינָה הָ/רִאשֹׁנ֣וֹת מָ֣ה הֵ֗נָּה הַגִּ֜ידוּ וְ/נָשִׂ֤ימָה לִבֵּ֨/נוּ֙ וְ/נֵדְעָ֣ה אַחֲרִיתָ֔/ן א֥וֹ הַ/בָּא֖וֹת הַשְׁמִיעֻֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/022.yaml
  text: Let them bring them forward and tell us what will happen[a]. Tell us the former things—what they are—that we may set our heart on them and know their outcome[c][b]; or declare to us the things to come.
translation:
  language: fr
  text: Qu’ils les présentent et qu’ils nous disent ce qui arrivera. Qu’ils nous disent ce que sont les événements passés, afin que nous y appliquions notre cœur[a] et que nous en connaissions l’issue[b] ; ou faites-nous entendre les événements à venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « que nous placions notre cœur » ; cette expression signifie prêter une attention réfléchie.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « que nous en connaissions la fin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּישׁוּ
  choice: Qu’ils les présentent
  rationale: Le hiphil de נגשׁ appelle ici les adversaires à présenter leurs preuves ou leurs idoles dans une scène de procès. Le pronom objet, sous-entendu en hébreu, est repris du contexte.
- source_word: וְיַגִּידוּ לָנוּ
  choice: et qu’ils nous disent
  rationale: Le hiphil de נגד signifie « dire, déclarer, annoncer ». « Nous disent » est naturel tout en conservant la sommation.
- source_word: אֵת אֲשֶׁר תִּקְרֶינָה
  choice: ce qui arrivera
  rationale: קרה désigne ce qui se produit ou arrive ; cette formulation française rend naturellement le pluriel implicite de l’hébreu.
- source_word: הָרִאשֹׁנוֹת
  choice: les événements passés
  rationale: ראשׁון désigne ici les réalités ou événements antérieurs, en contraste avec ceux qui viennent. « Événements » explicite sobrement le substantif sous-entendu.
- source_word: מָה הֵנָּה
  choice: ce que sont
  rationale: La proposition nominale signifie littéralement « ce qu’ils sont ». La traduction conserve cette formulation sans l’interpréter comme « ce qu’ils signifient ».
- source_word: וְנָשִׂימָה לִבֵּנוּ
  choice: afin que nous y appliquions notre cœur
  rationale: La formulation préserve l’image anthropologique hébraïque tout en restant intelligible ; elle exprime une attention et une réflexion soutenues.
- source_word: וְנֵדְעָה אַחֲרִיתָן
  choice: et que nous en connaissions l’issue
  rationale: אַחֲרִית peut désigner la fin, la suite ou l’issue. « Issue » convient au contexte d’événements dont on examine l’aboutissement.
- source_word: אוֹ הַבָּאוֹת
  choice: ou ... les événements à venir
  rationale: Le participe de בוא désigne ce qui vient. Cette expression maintient le contraste avec les événements passés.
- source_word: הַשְׁמִיעֻנוּ
  choice: faites-nous entendre
  rationale: Le hiphil de שׁמע signifie littéralement « faire entendre ». Le français conserve ici cette image, qui équivaut contextuellement à annoncer.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde la tonalité judiciaire de la sommation, le parallélisme entre les événements passés et à venir, ainsi que l’image hébraïque du cœur sans l’aplanir.
