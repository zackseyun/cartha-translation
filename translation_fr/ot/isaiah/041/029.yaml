    issue: « Oui » pour הֵן
    rationale: הֵן introduit ici une constatation emphatique à valeur déictique (« Voici », « Regardez »), non une simple affirmation dialogique. « Oui » affaiblit ou déplace cette fonction.
  - severity: low
    issue: Ordre de mots « ils ne sont tous que néant »
    rationale: Cette tournure est moins idiomatique en français moderne et peut rendre la portée de « tous » moins immédiatement claire. Une construction nominale poétique permet de préserver la concision de l’hébreu.
  revised_text: 'Voici : tous sont néant ; leurs œuvres ne sont rien. Leurs statues de métal fondu ne sont que vent et vide.'
  revised_footnotes: []
