revisions:
- from: Oui, ils ne sont tous que néant ; leurs œuvres ne sont rien. Leurs statues de métal fondu ne sont que vent et vide.
  to: 'Voici : tous sont néant ; leurs œuvres ne sont rien. Leurs statues de métal fondu ne sont que vent et vide.'
  rationale: La révision remplace seulement l’équivalent inadéquat de l’interjection initiale et régularise l’ordre des mots. Elle conserve la distinction entre les deux termes hébreux de nullité, l’ambiguïté contextuelle du référent de « tous », ainsi que l’image finale des représentations coulées comme réalité insubstantielle.
