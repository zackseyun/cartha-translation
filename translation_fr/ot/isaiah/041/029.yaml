id: ISA.41.29
reference: Isaiah 41:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֵ֣ן כֻּלָּ֔/ם אָ֥וֶן אֶ֖פֶס מַעֲשֵׂי/הֶ֑ם ר֥וּחַ וָ/תֹ֖הוּ נִסְכֵּי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/029.yaml
  text: Look[a], all of them are nothing; their works are nothing[b]. Their cast images are wind and emptiness.
translation:
  language: fr
  text: 'Voici : tous sont néant ; leurs œuvres ne sont rien. Leurs statues de métal fondu ne sont que vent et vide.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Oui
  rationale: La particule introduit ici une conclusion emphatique. « Oui » est naturel en français et marque l’insistance sans l’archaïsme de « Voici ».
- source_word: כֻּלָּם
  choice: ils… tous
  rationale: Conserve à la fois la totalité et la force pronominale du texte hébreu, tout en laissant le référent aussi large que dans le contexte.
- source_word: אָוֶן
  choice: néant
  rationale: Dans cette polémique contre les idoles, le terme souligne leur nullité et leur inconsistance plutôt que le mal moral ou le malheur.
- source_word: אֶפֶס
  choice: ne sont rien
  rationale: Rend idiomatiquement en français la prédication absolue de nullité et maintient le parallélisme avec « néant ».
- source_word: מַעֲשֵׂיהֶם
  choice: leurs œuvres
  rationale: Préserve le sens large des productions ou actions qui leur sont associées, sans limiter le mot aux seules idoles fabriquées.
- source_word: רוּחַ
  choice: vent
  rationale: En parallèle avec תֹהוּ, le mot exprime ici l’inconsistance ; « esprit » créerait une association théologique trompeuse.
- source_word: תֹהוּ
  choice: vide
  rationale: Dans ce contexte, le terme évoque la vacuité et la futilité plutôt qu’un chaos primordial déterminé.
- source_word: נִסְכֵּיהֶם
  choice: leurs statues de métal fondu
  rationale: Le nom désigne des représentations obtenues par coulage. Cette formulation est claire en français moderne et plus précise que le seul mot « statues ».
theological_decisions:
- issue: Référent de la dénonciation
  choice: La formulation condamne l’ensemble évoqué par le contexte, puis désigne explicitement les statues de métal fondu.
  alternative: Comprendre exclusivement les fabricants d’idoles, ou exclusivement les idoles.
  rationale: Les suffixes pluriels permettent un référent assez large, englobant potentiellement les idoles et tout le système qui les produit, tandis que le dernier membre nomme clairement les représentations coulées. La traduction ne tranche pas davantage que l’hébreu.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme poétique est conservé, avec une légère variation entre « néant » et « rien » afin de refléter les deux termes hébreux distincts.
