  text: מִ֤י הֵעִיר֙ מִ/מִּזְרָ֔ח צֶ֖דֶק יִקְרָאֵ֣/הוּ לְ/רַגְל֑/וֹ יִתֵּ֨ן לְ/פָנָ֤י/ו גּוֹיִם֙ וּ/מְלָכִ֣ים יַ֔רְדְּ יִתֵּ֤ן כֶּֽ/עָפָר֙ חַרְבּ֔/וֹ כְּ/קַ֥שׁ נִדָּ֖ף קַשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/002.yaml
  text: Who has stirred up one from the east[a], calling him in righteousness to his feet? He gives nations before him and subdues kings; he gives them like dust to his sword[b], like driven stubble to his bow.
translation:
  language: fr
  text: Qui a suscité de l’est celui qu’il appelle avec justice à sa suite[a] ? Il lui livre des nations et lui soumet des rois[b] ; il les livre à son épée comme la poussière, à son arc comme le chaume emporté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « celui que la justice appelle à sa suite », ou « celui que la victoire appelle à sa suite ». L’expression hébraïque est difficile ; le mot traduit par « justice » peut aussi évoquer ici la juste cause, la justification ou la victoire.'
    reason: lexical_alternative
  - marker: b
    text: 'Le texte hébreu de cette proposition est difficile. On comprend aussi : « il fait régner des rois » ou « il lui fait fouler aux pieds des rois ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֵעִיר
  choice: a suscité
  rationale: Le hiphil exprime ici l’action de faire surgir ou de mettre quelqu’un en mouvement pour accomplir une tâche. « Susciter » conserve ce sens causatif dans un registre biblique clair.
- source_word: מִמִּזְרָח
  choice: de l’orient
  rationale: Le nom désigne le lieu du lever du soleil, donc l’est ou l’orient. « De l’orient » est naturel et digne en français.
- source_word: צֶדֶק
  choice: la justice
  rationale: Le terme peut désigner la justice, la droiture, la juste cause ou la victoire comprise comme justification. Le choix lexical central « justice » évite de trancher en faveur de la seule victoire.
- source_word: יִקְרָאֵהוּ לְרַגְלוֹ
  choice: appelle à sa suite
  rationale: Littéralement, l’expression évoque un appel « à son pied ». En contexte, elle indique vraisemblablement le fait de suivre ou de se tenir à la disposition de quelqu’un. « À sa suite » conserve l’image relationnelle sans produire le français peu naturel « à ses pieds ».
- source_word: יִתֵּן לְפָנָיו גּוֹיִם
  choice: Il lui livre des nations
  rationale: נתן avec « devant lui » exprime ici la remise des nations au pouvoir du conquérant. « Lui livre » rend cette valeur idiomatiquement.
- source_word: וּמְלָכִים יַרְדְּ
  choice: et lui soumet des rois
  rationale: La forme massorétique et la syntaxe sont difficiles. Dans ce contexte de conquête, la proposition indique vraisemblablement que les rois passent sous sa domination. Une note signale l’incertitude.
- source_word: יִתֵּן כֶּעָפָר חַרְבּוֹ
  choice: il réduit leurs corps en poussière par son épée
  rationale: 'La construction hébraïque est fortement elliptique : « il donne comme poussière son épée ». Le contexte fournit les ennemis comme objet implicite. « Leurs corps » explicite sobrement cet objet et maintient l’image de destruction, tandis que « par » exprime l’instrument.'
- source_word: כְּקַשׁ נִדָּף קַשְׁתּוֹ
  choice: en paille emportée par son arc
  rationale: קשׁ désigne de la paille ou du chaume, et נדף ce qui est chassé ou emporté. La formulation française conserve le parallélisme avec l’épée et l’image de la matière légère dispersée.
theological_decisions:
- issue: Identité de celui qui vient de l’orient
  choice: Laisser le personnage sans nom
  alternative: L’identifier à Cyrus, à Abraham ou à un conquérant idéal suscité par Dieu
  rationale: Le verset ne nomme pas cet homme. L’identifier dans le corps du texte imposerait une conclusion interprétative que l’hébreu ne formule pas.
- issue: Sujet de « appelle »
  choice: Conserver « la justice » comme sujet grammatical possible
  alternative: 'Comprendre Dieu comme sujet : « qu’il appelle avec justice à sa suite »'
  rationale: L’enchaînement hébreu permet de rattacher צֶדֶק à l’appel de plusieurs manières. La formulation retenue suit la lecture où « justice » est le sujet proche, tout en signalant les autres analyses en note.
translation_notes:
  register: Français international moderne, soutenu sans être archaïque. Les images de poussière et de paille sont conservées, tandis que les ellipses hébraïques sont légèrement explicitées pour assurer une lecture naturelle. Tous les marqueurs de note figurent dans le texte.
