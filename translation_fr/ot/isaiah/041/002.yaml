revisions:
- from: Qui a suscité de l’orient celui que la justice appelle à sa suite[a] ? Il lui livre des nations et lui soumet des rois[b] ; il réduit leurs corps en poussière par son épée, en paille emportée par son arc.
  to: Qui a suscité de l’est celui qu’il appelle avec justice à sa suite[a] ? Il lui livre des nations et lui soumet des rois[b] ; il les livre à son épée comme la poussière, à son arc comme le chaume emporté.
  rationale: La révision supprime l’ajout interprétatif « leurs corps », rend plus naturellement l’appel tout en maintenant par note l’analyse où « justice » est sujet, et restitue le parallélisme elliptique entre l’épée, l’arc, la poussière et le chaume. L’identité de celui qui vient de l’est demeure non précisée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'La première proposition doit mieux rendre l’ambiguïté syntaxique de צֶדֶק יִקְרָאֵהוּ לְרַגְלוֹ sans faire de « la justice » un agent personnifié qui appelle quelqu’un « à sa suite ». La dernière proposition ne contient pas « leurs corps » : cette précision est ajoutée au texte. Le parallélisme de l’épée et de l’arc peut être conservé en français par « les livre à ... », avec les adversaires comme objet implicite explicité par « les ».'
  naturalness: « De l’est » est plus naturel en français international moderne que « de l’orient ». « Celui que la justice appelle à sa suite » est grammaticalement possible, mais demeure opaque et suggère une personnification peu naturelle. « Celui qu’il appelle avec justice à sa suite » est plus lisible tout en laissant la note signaler l’autre analyse.
  terminology: « Suscité », « justice », « nations », « rois », « soumet » et « chaume emporté » conviennent au registre biblique moderne. « Paille » peut désigner le matériau récolté, mais « chaume » rend plus précisément קשׁ dans cette image. « Leurs corps » doit être supprimé, car le texte vise les peuples et les rois, non leurs corps explicitement.
  issues:
  - severity: medium
    issue: « la justice appelle à sa suite » attribue l’appel à la justice et rend le référent du possessif artificiellement incertain.
    rationale: La syntaxe hébraïque est difficile et permet plusieurs analyses ; cette formulation française en privilégie une de façon peu naturelle. Une construction avec le sujet divin implicite correspond mieux au flux de la question et préserve l’alternative en note.
  - severity: high
    issue: « il réduit leurs corps en poussière » ajoute « leurs corps ».
    rationale: Aucun terme hébreu ne signifie « corps ». L’objet implicite est constitué des nations et des rois vaincus ; l’ajout introduit une précision matérielle absente du texte.
  - severity: medium
    issue: « par son épée, en paille emportée par son arc » transforme de façon trop libre les compléments liés à l’épée et à l’arc.
    rationale: Le texte compare les ennemis à la poussière devant l’épée et au chaume chassé devant l’arc. « Les livre à son épée..., à son arc... » maintient le parallélisme et évite de faire de l’arc l’agent direct d’une transformation non explicitée.
  revised_text: Qui a suscité de l’est celui qu’il appelle avec justice à sa suite[a] ? Il lui livre des nations et lui soumet des rois[b] ; il les livre à son épée comme la poussière, à son arc comme le chaume emporté.
  revised_footnotes:
