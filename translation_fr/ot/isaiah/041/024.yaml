    rationale: L’alternative ne correspond pas syntaxiquement à la formulation annotée et rend l’ancrage lexical moins clair.
  revised_text: 'Voyez : vous n’êtes rien, et votre œuvre est moins que rien[a] ; celui qui vous choisit est une abomination.'
