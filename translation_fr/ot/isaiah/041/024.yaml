  variant: modern international French
source:
  edition: WLC
  text: הֵן אַתֶּ֣ם מֵ/אַ֔יִן וּ/פָעָלְ/כֶ֖ם מֵ/אָ֑פַע תּוֹעֵבָ֖ה יִבְחַ֥ר בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/024.yaml
  text: Look[a], you are from nothing, and your work is from nonexistence; whoever chooses you is an abomination.
translation:
  language: fr
  text: 'Voyez : vous n’êtes rien, et votre œuvre est moins que rien[a] ; celui qui vous choisit est une abomination.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme hébreu rendu par « moins que rien » est rare et son sens est incertain. On peut aussi le comprendre comme « de rien ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: L’interjection introduit avec force le verdict prophétique. « Voyez » est actuel et soutenu, sans l’archaïsme de « voici » employé seul.
- source_word: מֵאַיִן
  choice: vous venez du néant
  rationale: La formulation conserve la préposition hébraïque marquant la provenance tout en exprimant la non-existence et l’inanité des idoles.
- source_word: וּפָעָלְכֶם
  choice: et votre œuvre
  rationale: « Œuvre » garde l’étendue du terme hébreu, qui peut désigner l’action, le produit ou l’effet attribué aux idoles.
- source_word: מֵאָפַע
  choice: vient de ce qui n’est rien
  rationale: Ce mot très rare et difficile est rendu selon le parallélisme avec מֵאַיִן, sans transformer avec certitude la préposition en comparaison. Une note signale l’incertitude lexicale.
- source_word: תּוֹעֵבָה
  choice: une abomination
  rationale: Ce nom fort exprime la répulsion morale et cultuelle du texte, plus pleinement qu’un simple adjectif comme « détestable ».
- source_word: יִבְחַר בָּכֶם
  choice: celui qui vous choisit
  rationale: Le singulier à valeur générale et la construction avec ב sont rendus naturellement comme le choix ou la préférence accordés à ces idoles.
theological_decisions:
- issue: Référent des pronoms de la deuxième personne du pluriel
  choice: Les pronoms s’adressent directement aux dieux ou idoles mis au défi dans le contexte.
  alternative: Ils pourraient viser, par métonymie, ceux qui fabriquent les idoles.
  rationale: Le contexte immédiat interpelle les prétendus dieux et condamne ensuite celui qui les choisit. La traduction maintient l’adresse directe sans ajouter d’identification interprétative.
- issue: Portée du prédicat תּוֹעֵבָה
  choice: La personne qui choisit les idoles est qualifiée d’« abomination ».
  alternative: 'On pourrait rendre plus idiomatiquement : « est abominable » ou comprendre que son choix est abominable.'
  rationale: Le texte hébreu emploie directement le nom « abomination » comme prédicat. Le conserver maintient la vigueur et la tension de l’énoncé.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme des deux propositions est conservé, ainsi que la violence rhétorique du verdict contre les idoles et ceux qui les choisissent.
