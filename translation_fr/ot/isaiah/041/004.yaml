source:
  edition: WLC
  text: מִֽי פָעַ֣ל וְ/עָשָׂ֔ה קֹרֵ֥א הַ/דֹּר֖וֹת מֵ/רֹ֑אשׁ אֲנִ֤י יְהוָה֙ רִאשׁ֔וֹן וְ/אֶת אַחֲרֹנִ֖ים אֲנִי הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/004.yaml
  text: Who has acted and done this[a], calling the generations from the beginning? I, Yahweh, am the first, and with the last ones—I am he.
translation:
  language: fr
  text: 'Qui a agi et accompli cela,

    appelant les générations dès le commencement ?

    Moi, Yahweh, je suis le premier

    et, avec les derniers, je suis le même[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et avec les derniers, moi, lui ». La construction hébraïque est elliptique ; on peut aussi comprendre : « et avec les derniers, c’est moi » ou « quant aux derniers, je suis le même ».'
    reason: La syntaxe de וְאֶת אַחֲרֹנִים אֲנִי הוּא est inhabituelle et permet plusieurs formulations françaises, qu’il convient de signaler sans supprimer l’ambiguïté.
lexical_decisions:
- source_word: מִי
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique.
- source_word: פָעַל וְעָשָׂה
  choice: a agi et accompli cela
  rationale: Les deux verbes sont conservés afin de rendre l’insistance sur une action effective. « Cela » est ajouté naturellement en français pour renvoyer aux événements historiques évoqués dans le contexte.
- source_word: קֹרֵא
  choice: appelant
  rationale: 'Le participe qal présente l’action comme caractéristique ou continue : Yahweh appelle les générations à paraître dans l’histoire.'
- source_word: הַדֹּרוֹת
  choice: les générations
  rationale: Traduction directe et naturelle, qui maintient l’idée d’une succession historique.
- source_word: מֵרֹאשׁ
  choice: dès le commencement
  rationale: L’expression a ici un sens temporel et renvoie au point de départ de l’histoire ou à la première génération.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le nom divin est translittéré plutôt que remplacé par un titre, conformément à sa présence explicite dans l’hébreu.
- source_word: רִאשׁוֹן
  choice: le premier
  rationale: L’adjectif attribut exprime la primauté et l’antériorité de Yahweh.
- source_word: וְאֶת אַחֲרֹנִים
  choice: et, avec les derniers
  rationale: La construction difficile et elliptique est rendue sans effacer le pluriel hébreu. « Avec » exprime la présence continue de Yahweh auprès des générations ultimes.
- source_word: אֲנִי הוּא
  choice: je suis le même
  rationale: Cette formulation française rend l’auto-identification concise et la continuité d’identité exprimées par la formule hébraïque, sans employer le peu naturel « je suis lui ».
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte explicitement le tétragramme. La translittération conserve le nom personnel plutôt que de lui substituer un titre.
- issue: Rapport de Dieu aux « derniers » dans וְאֶת אַחֲרֹנִים
  choice: avec les derniers
  alternative: quant aux derniers / avec le dernier
  rationale: L’hébreu est elliptique et son articulation exacte est discutée. Le texte principal conserve la préposition probable et le pluriel, présentant Yahweh comme toujours présent lorsque viennent les dernières générations, sans transformer explicitement « les derniers » en un titre divin.
- issue: Sens de la formule אֲנִי הוּא
  choice: je suis le même
  alternative: c’est moi
  rationale: « Je suis le même » fait entendre la continuité de l’identité divine dans le contexte, tandis que « c’est moi » rendrait surtout l’identification. La formulation choisie préserve la densité théologique sans développer la formule.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé par la disposition en lignes. « Accompli » et « dès le commencement » gardent une tonalité soutenue mais courante ; « Yahweh » préserve le nom divin.
