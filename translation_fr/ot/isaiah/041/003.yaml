  yaml_path: translation/ot/isaiah/041/003.yaml
  text: He pursues them and passes on safely[a], by a path his feet had not traveled.
translation:
  language: fr
  text: Il les poursuit et passe sans encombre[a], par un sentier où ses pieds n’étaient jamais passés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il les poursuit et passe en paix, par un sentier où ses pieds n’étaient jamais allés. » La dernière proposition hébraïque est difficile. Elle peut évoquer une avancée sûre ou un chemin que ses pieds n’avaient pas encore parcouru; sa formulation précise demeure incertaine.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְדְּפֵם
  choice: Il les poursuit
  rationale: Le qal inaccompli, avec suffixe de troisième personne masculine plurielle, s’inscrit ici dans une narration prophétique vive. Le présent français conserve cette dynamique et le sens hostile de la poursuite.
- source_word: יַעֲבוֹר
  choice: et avance
  rationale: Le verbe עבר signifie passer, traverser ou aller plus loin. « Avance » exprime naturellement la progression continue du conquérant sans préciser indûment ce qu’il traverse.
- source_word: שָׁלוֹם
  choice: sans encombre
  rationale: Employé adverbialement, שָׁלוֹם décrit ici une progression paisible, sûre ou indemne. « Sans encombre » rend en français courant l’idée d’une avancée sans opposition ni dommage, tout en signalant en note le sens plus littéral.
- source_word: אֹרַח
  choice: par un sentier
  rationale: אֹרַח désigne un sentier, une piste ou un chemin. « Sentier » conserve l’image concrète d’une voie empruntée.
- source_word: בְּרַגְלָיו לֹא יָבוֹא
  choice: où ses pieds n’étaient jamais passés
  rationale: L’expression hébraïque est condensée et littéralement proche de « où, avec ses pieds, il ne vient pas ». La formulation française maintient l’image des pieds et exprime l’idée probable d’un itinéraire jusque-là non parcouru, sans masquer la difficulté dans la note.
theological_decisions:
- issue: Interprétation de אֹרַח בְּרַגְלָיו לֹא יָבוֹא
  choice: Le conquérant avance par un sentier où ses pieds n’étaient jamais passés.
  alternative: Il avance sur un sentier que ses pieds ne touchent pas, ou il vient par un chemin sans se servir de ses pieds.
  rationale: La syntaxe hébraïque est difficile. Dans le contexte de la marche victorieuse du conquérant, l’idée d’une avancée par une voie encore non parcourue paraît la plus cohérente. La note conserve néanmoins l’ambiguïté réelle au lieu de présenter cette interprétation comme certaine.
translation_notes:
  register: Français international moderne, naturel et digne. « Sans encombre » est idiomatique sans être familier; « sentier » préserve l’image concrète. La note rend compte du sens littéral de שָׁלוֹם et de l’ambiguïté de la proposition finale.
