source:
  edition: WLC
  text: תְּבַקְשֵׁ/ם֙ וְ/לֹ֣א תִמְצָאֵ֔/ם אַנְשֵׁ֖י מַצֻּתֶ֑/ךָ יִהְי֥וּ כְ/אַ֛יִן וּ/כְ/אֶ֖פֶס אַנְשֵׁ֥י מִלְחַמְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/012.yaml
  text: You will seek them and not find them—those men who contend with you[a]. The men who wage war against you will become like nothing[b], like nonexistence.
translation:
  language: fr
  text: 'Tu les chercheras sans les trouver : ces hommes qui te cherchent querelle[a]. Les hommes qui te font la guerre deviendront comme rien, comme le néant[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les hommes de ta querelle » ; c’est-à-dire ceux qui se querellent avec toi ou entrent en conflit avec toi.'
    reason: lexical_alternative
  - marker: b
    text: 'Hébreu : « comme rien et comme éfès » ; le second terme peut aussi se traduire par « comme absolument rien » ou « comme l’inexistence ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַקְשֵׁם
  choice: Tu les chercheras
  rationale: Le piel de בקש signifie couramment « chercher ». Ce choix forme un parallèle naturel avec « trouver ».
- source_word: וְלֹא תִמְצָאֵם
  choice: mais tu ne les trouveras pas
  rationale: מצא signifie « trouver ». « Mais » rend naturellement en français le contraste logique exprimé dans cette coordination hébraïque.
- source_word: אַנְשֵׁי מַצֻּתֶךָ
  choice: ces hommes qui te cherchent querelle
  rationale: L’expression construite signifie littéralement « les hommes de ta querelle ». La formulation retenue exprime idiomatiquement ceux qui entrent en conflit avec le destinataire, sans les réduire au terme plus général « adversaires ».
- source_word: יִהְיוּ
  choice: Ils seront
  rationale: Le verbe היה peut signifier « être » ou « devenir ». « Seront » reste proche de la forme hébraïque tout en permettant au contexte d’exprimer le résultat annoncé.
- source_word: כְאַיִן
  choice: comme rien
  rationale: אַיִן évoque le rien ou la non-existence, et le préfixe כְּ marque explicitement la comparaison.
- source_word: וּכְאֶפֶס
  choice: comme s’ils n’existaient pas
  rationale: אֶפֶס peut désigner le néant, l’inexistence ou l’absence totale. Cette tournure française naturelle conserve une distinction avec « comme rien » et évite le substantif abstrait peu idiomatique « non-existence ».
- source_word: אַנְשֵׁי מִלְחַמְתֶּךָ
  choice: les hommes qui te font la guerre
  rationale: La construction signifie littéralement « les hommes de ta guerre », c’est-à-dire ceux qui combattent contre toi. « Te font la guerre » est clair, actuel et fidèle au rapport d’hostilité.
theological_decisions:
- issue: Portée des images décrivant la disparition des ennemis
  choice: 'Conserver deux comparaisons apparentées mais distinctes : « comme rien, comme s’ils n’existaient pas »'
  alternative: Employer deux fois « comme rien » ou paraphraser par « ils disparaîtront complètement »
  rationale: Le texte décrit poétiquement la disparition totale des ennemis sans formuler directement une affirmation métaphysique sur leur annihilation. Les deux comparaisons préservent l’intensification et la tension du parallélisme hébreu.
translation_notes:
  register: 'Français international moderne, digne et accessible. Le tutoiement singulier reproduit l’adresse hébraïque à Israël. La disposition conserve l’effet poétique : la reprise finale de « les hommes » met en relief ceux qui font la guerre au destinataire.'
