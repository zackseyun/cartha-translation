revisions:
- from: Tu les chercheras, mais tu ne les trouveras pas, ces hommes qui te cherchent querelle[a]. Ils seront comme rien, comme s’ils n’existaient pas[b], les hommes qui te font la guerre.
  to: 'Tu les chercheras sans les trouver : ces hommes qui te cherchent querelle[a]. Les hommes qui te font la guerre deviendront comme rien, comme le néant[b].'
  rationale: La révision élimine le contraste ajouté par « mais », clarifie la syntaxe de la seconde proposition et rend les deux comparaisons nominales hébraïques par deux comparaisons françaises parallèles. Elle conserve le tutoiement, la référence personnelle aux adversaires et l’intensification poétique, sans imposer d’interprétation doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:01:30Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, la coordination « mais » ajoute un contraste qui n’est pas marqué par le waw hébreu; « sans les trouver » rend plus exactement et naturellement la relation. Dans la seconde phrase, « deviendront » rend mieux le résultat annoncé par יִהְיוּ dans ce contexte.
  naturalness: « Ils seront … les hommes qui te font la guerre » est grammaticalement possible, mais la dislocation finale est lourde en français moderne. Mettre « Les hommes qui te font la guerre » en position de sujet rend le verset plus net sans modifier l’emphase poétique.
  terminology: « Chercher querelle » et « faire la guerre » sont des équivalents idiomatiques et précis des deux expressions de conflit. « Comme le néant » restitue naturellement la seconde comparaison (כְאֶפֶס) et évite la tournure hypothétique « comme s’ils n’existaient pas », qui explicite légèrement l’image.
  issues:
  - severity: low
    issue: « mais tu ne les trouveras pas » introduit une opposition explicite.
    rationale: L’hébreu coordonne simplement « tu les chercheras et tu ne les trouveras pas »; « sans les trouver » conserve la conséquence sans surtraduire un contraste.
  - severity: medium
    issue: Le sujet « les hommes qui te font la guerre » est rejeté après « Ils seront ».
    rationale: Cette construction est lourde et peut momentanément rendre le référent de « ils » moins clair. Le sujet explicite en tête de phrase suit la syntaxe française habituelle.
  - severity: low
    issue: « comme s’ils n’existaient pas » interprète la seconde comparaison sous forme d’une proposition hypothétique.
    rationale: « Comme le néant » maintient plus directement la forme nominale et comparative de כְאֶפֶס, tout en gardant la distinction poétique avec « comme rien ».
  revised_text: 'Tu les chercheras sans les trouver : ces hommes qui te cherchent querelle[a]. Les hommes qui te font la guerre deviendront comme rien, comme le néant[b].'
