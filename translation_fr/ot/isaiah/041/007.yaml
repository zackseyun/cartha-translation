  rationale: 'Révision limitée à la syntaxe et au registre : « en disant » rétablit le lien du participe hébreu avec la scène artisanale, et « C’est bien » évite la coloration familière de « C’est bon ! ». Le texte conserve l’ambiguïté voulue quant à l’objet fabriqué et aux nuances de דבק.'
