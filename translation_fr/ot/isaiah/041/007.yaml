  text: וַ/יְחַזֵּ֤ק חָרָשׁ֙ אֶת צֹרֵ֔ף מַחֲלִ֥יק פַּטִּ֖ישׁ אֶת ה֣וֹלֶם פָּ֑עַם אֹמֵ֤ר לַ/דֶּ֨בֶק֙ ט֣וֹב ה֔וּא וַ/יְחַזְּקֵ֥/הוּ בְ/מַסְמְרִ֖ים לֹ֥א יִמּֽוֹט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/041/007.yaml
  text: The craftsman strengthens the metalworker[a]; the one who smooths with the hammer strengthens the one who strikes the anvil, saying of the soldering, “It is good”[b]; then he fastens it with nails so that it will not totter.
translation:
  language: fr
  text: 'L’artisan encourage le fondeur ; celui qui polit au marteau encourage celui qui frappe l’enclume, en disant de l’assemblage[a] : « C’est bien. » Puis il le fixe avec des clous, pour qu’il ne vacille pas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la soudure » ou « du joint ». Le terme hébreu peut désigner le matériau de liaison ou l’opération qui réunit les différentes pièces.
    reason: lexical_alternative
  - marker: b
    text: Ou « pour qu’il ne bouge pas » ou « pour qu’il ne bascule pas ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: encourage
  rationale: À propos de deux ouvriers, le piel de חזק peut exprimer le fait de fortifier ou d’encourager. « Encourage » est naturel en français et laisse percevoir leur soutien mutuel, tandis que le second emploi du verbe décrit concrètement la fixation de l’objet.
- source_word: חָרָשׁ
  choice: artisan
  rationale: Le terme désigne de manière générale un ouvrier qualifié. « Artisan » maintient cette portée sans le confondre avec le fondeur qui suit.
- source_word: צֹרֵף
  choice: fondeur
  rationale: Le participe désigne celui qui fond ou affine le métal. « Fondeur » convient au cadre de travail du métal sans préciser indûment qu’il s’agit d’un orfèvre ou que le métal est de l’or.
- source_word: מַחֲלִיק פַּטִּישׁ
  choice: celui qui polit au marteau
  rationale: Le participe évoque ici l’action de lisser ou de polir le métal. La tournure verbale est claire et naturelle en français.
- source_word: הוֹלֶם פָּעַם
  choice: celui qui frappe sur l’enclume
  rationale: הולם décrit celui qui frappe, et פעם peut désigner ici la surface de frappe ou l’enclume. Cette formulation conserve l’image cohérente de l’atelier.
- source_word: לַדֶּבֶק
  choice: de l’assemblage
  rationale: דבק peut désigner le joint, le matériau de liaison ou l’opération par laquelle les pièces sont réunies. « Assemblage » conserve cette largeur sémantique ; une note signale la possibilité plus précise de la soudure.
- source_word: טוֹב הוּא
  choice: C’est bon !
  rationale: Cette appréciation brève et directe reproduit naturellement l’énoncé hébreu sans ajouter « travail » ni préciser ce qui est jugé bon.
- source_word: וַיְחַזְּקֵהוּ בְמַסְמְרִים
  choice: Puis il le fixe avec des clous
  rationale: Le second emploi de חזק concerne la stabilisation matérielle de l’objet. Le pronom « le » préserve le suffixe masculin hébreu sans introduire explicitement le mot « idole », absent de ce verset.
- source_word: לֹא יִמּוֹט
  choice: pour qu’il ne vacille pas
  rationale: Le nifal de מוט peut exprimer le fait de chanceler, de bouger ou de basculer. « Vaciller » maintient l’image ironique d’un objet qu’il faut stabiliser sans imposer l’idée plus forte d’une chute effective.
theological_decisions:
- issue: Présentation de la fabrication d’une idole dans la satire prophétique
  choice: Décrire la coopération des artisans et la stabilisation de l’objet sans ajouter le mot « idole » dans le texte principal.
  alternative: Expliciter le référent par « l’idole » pour faciliter la compréhension.
  rationale: Le contexte immédiat identifie le référent, mais le verset hébreu se limite aux artisans, à leur travail et au pronom désignant l’objet. Cette retenue préserve l’ironie prophétique sans expansion interprétative.
- issue: Nature du soutien entre les artisans
  choice: Rendre le premier וַיְחַזֵּק par « encourage », puis le second par « fixe ».
  alternative: Employer « fortifie » ou « affermit » dans les deux cas.
  rationale: Le contexte autorise un soutien interpersonnel dans le premier cas et exige une action matérielle dans le second. Le choix français fait entendre cette variation contextuelle sans effacer le lien créé par le même verbe hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation rend visible le parallélisme des ouvriers ; les formulations restent concrètes et évitent tout vocabulaire confessionnel ou toute explicitation absente de l’hébreu.
