  source_fidelity: 'La structure et les images du texte hébreu sont bien rendues : l''acte créateur est compris comme une promesse future, et la nuée, la fumée, l''éclat du feu et le dais demeurent des éléments distincts. « Sur chaque lieu du mont Sion » rend plus explicitement la portée distributive de כָּל avec מָכוֹן, là où « sur tout le site » peut suggérer un seul site pris globalement.'
  naturalness: Le français est globalement soutenu et naturel. « Un feu en flammes » est un peu plus idiomatique que « un feu flamboyant » tout en conservant l'idée de לֶהָבָה. La note a est corrigée, car « assemblées fixées » n'est pas naturel en français dans ce sens.
  terminology: « Yahvé », « mont Sion », « nuée », « gloire » et « dais » conviennent au registre prophétique français. La note d doit proposer « couverture » sans ajouter « protectrice », qualification interprétative qui n'est pas lexicalement exprimée par חֻפָּה.
