id: ISA.4.5
reference: Isaiah 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/בָרָ֣א יְהוָ֡ה עַל֩ כָּל מְכ֨וֹן הַר צִיּ֜וֹן וְ/עַל מִקְרָאֶ֗/הָ עָנָ֤ן יוֹמָם֙ וְ/עָשָׁ֔ן וְ/נֹ֛גַהּ אֵ֥שׁ לֶהָבָ֖ה לָ֑יְלָה כִּ֥י עַל כָּל כָּב֖וֹד חֻפָּֽה־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/005.yaml
  text: Then Yahweh will create over the whole site of Mount Zion and over her assemblies a cloud by day[a], and smoke, and the brightness of a flaming fire by night[d][c][b]; for over all the glory there will be a canopy.
translation:
  language: fr
  text: Alors Yahvé créera, sur chaque lieu du mont Sion et sur ses assemblées[a], une nuée pendant le jour, ainsi que de la fumée, et, pendant la nuit, l’éclat d’un feu en flammes[b][c] ; car au-dessus de toute gloire il y aura un dais[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses convocations ». Le terme hébreu peut désigner des assemblées désignées ou des rassemblements convoqués.
    reason: lexical_alternative
  - marker: b
    text: Ou « la lueur d’un feu ardent pendant la nuit ».
    reason: lexical_alternative
  - marker: c
    text: Cette image rappelle la nuée et le feu par lesquels Yahvé manifestait sa présence au désert (voir, par exemple, Exode 13.21-22).
    reason: cross_reference
  - marker: d
    text: Ou « une couverture ». Le terme hébreu peut aussi désigner un dais nuptial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרָא
  choice: Alors … créera
  rationale: Le parfait qal précédé de la conjonction s’inscrit ici dans une annonce prophétique tournée vers l’avenir. « Créera » conserve la force du verbe ברא, et « alors » marque la progression du discours.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, qui le distingue d’un titre comme « le Seigneur ».
- source_word: מְכוֹן
  choice: site
  rationale: Le nom désigne un lieu fixé ou établi. « Site » convient au cadre géographique du mont Sion sans imposer l’interprétation plus précise de « demeure ».
- source_word: הַר צִיּוֹן
  choice: mont Sion
  rationale: Forme française usuelle du nom géographique.
- source_word: מִקְרָאֶיהָ
  choice: ses assemblées
  rationale: מִקְרָא peut désigner une assemblée convoquée. Le suffixe féminin singulier renvoie à Sion ; « ses assemblées » reste naturel et compréhensible.
- source_word: עָנָן יוֹמָם
  choice: une nuée pendant le jour
  rationale: « Nuée » garde le caractère théophanique possible de l’image, tandis que « pendant le jour » rend clairement יוֹמָם.
- source_word: וְעָשָׁן
  choice: ainsi que de la fumée
  rationale: La fumée demeure un élément visible distinct, conformément à l’accumulation des manifestations dans l’hébreu.
- source_word: וְנֹגַהּ אֵשׁ לֶהָבָה לָיְלָה
  choice: et, pendant la nuit, l’éclat d’un feu flamboyant
  rationale: « Éclat » rend נֹגַהּ et « feu flamboyant » conserve l’idée de flamme exprimée par לֶהָבָה. Le déplacement de « pendant la nuit » produit une phrase française fluide sans modifier le sens.
- source_word: כִּי
  choice: car
  rationale: Introduit naturellement en français l’explication qui fonde l’image précédente.
- source_word: כָּבוֹד
  choice: toute gloire
  rationale: « Gloire » conserve l’amplitude du terme, qui peut évoquer honneur, splendeur ou présence glorieuse, sans préciser laquelle de ces nuances domine.
- source_word: חֻפָּה
  choice: un dais
  rationale: « Dais » exprime l’idée d’une couverture déployée au-dessus de quelque chose et laisse subsister les possibles résonances nuptiales du mot sans les imposer.
theological_decisions:
- issue: Valeur temporelle et aspectuelle de וּבָרָא
  choice: 'Promesse future : « créera »'
  alternative: 'Récit au passé : « créa » ou « a créé »'
  rationale: Le contexte de restauration annoncée situe l’acte dans l’avenir. Le futur français rend cette fonction prophétique sans affaiblir l’idée d’un acte créateur de Dieu.
- issue: Évocation de la nuée et du feu de l’Exode
  choice: Conserver les images sans expliciter leur interprétation dans le texte
  alternative: Ajouter « colonne de nuée » et « colonne de feu », ou expliciter un accomplissement typologique
  rationale: Les termes rappellent fortement la présence divine guidant Israël au désert, mais le texte hébreu ne contient pas ici le mot « colonne » et ne précise pas l’accomplissement théologique.
- issue: Portée de כָּבוֹד
  choice: Maintenir l’expression ouverte « toute gloire »
  alternative: Préciser « toute la gloire de Sion » ou « toute la présence glorieuse de Yahvé »
  rationale: Le référent exact de la gloire n’est pas explicitement formulé. La traduction préserve cette tension au lieu de choisir entre la splendeur de Sion et la présence glorieuse de Dieu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’accumulation poétique des manifestations visibles, tout en réorganisant légèrement les compléments temporels pour assurer une lecture naturelle. « Nuée », « gloire » et « dais » maintiennent la dignité et les résonances du langage prophétique sans développer une interprétation confessionnelle.
