  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ צֶ֣מַח יְהוָ֔ה לִ/צְבִ֖י וּ/לְ/כָב֑וֹד וּ/פְרִ֤י הָ/אָ֨רֶץ֙ לְ/גָא֣וֹן וּ/לְ/תִפְאֶ֔רֶת לִ/פְלֵיטַ֖ת יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/002.yaml
  text: In that day the branch of Yahweh will be for beauty and for glory[a], and the fruit of the land for majesty and for splendor[b], for the survivors of Israel.
translation:
  language: fr
  text: En ce jour-là, la pousse de Yahvé sera, pour les survivants d’Israël[b], beauté et gloire, et le fruit du pays, fierté et splendeur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ou : « le reste d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette tournure française naturelle conserve la formule temporelle caractéristique du discours prophétique sans préciser indûment sa portée.
- source_word: צֶמַח יְהוָה
  choice: ce que Yahvé fera germer
  rationale: צֶמַח peut désigner une pousse, la croissance végétale ou ce qui germe. La formulation verbale rend naturellement le rapport à Yahvé et convient au parallèle agricole avec « le fruit du pays », tout en signalant en note la traduction plus littérale susceptible d’une résonance royale ou messianique.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Transcription française courante du nom divin, plutôt qu’un remplacement par un titre.
- source_word: לִצְבִי וּלְכָבוֹד
  choice: sera beauté et gloire
  rationale: צְבִי exprime ici la beauté ou l’ornement, tandis que כָבוֹד évoque la gloire ou l’honneur. L’expression française garde le parallélisme élevé sans ajouter un verbe absent de sens au-delà de la copule hébraïque.
- source_word: וּפְרִי הָאָרֶץ
  choice: et le fruit du pays
  rationale: « Fruit » conserve l’image agricole; « pays » convient mieux que « terre » au contexte centré sur Israël, tout en restant proche de הָאָרֶץ.
- source_word: לְגָאוֹן וּלְתִפְאֶרֶת
  choice: sera fierté et splendeur
  rationale: גָאוֹן peut exprimer positivement l’élévation, la majesté ou la fierté; ici, le parallélisme favorable appelle ce sens positif. תִפְאֶרֶת est rendu par « splendeur » afin de préserver la variété poétique.
- source_word: לִפְלֵיטַת יִשְׂרָאֵל
  choice: pour les survivants d’Israël
  rationale: פְלֵיטָה désigne ceux qui ont échappé au désastre. « Survivants » est clair en français moderne et ne transforme pas d’emblée le terme en catégorie théologique.
theological_decisions:
- issue: 'La portée de צֶמַח יְהוָה : végétation restaurée ou figure appelée « Germe »'
  choice: ce que Yahvé fera germer
  alternative: le Germe de Yahvé / la pousse de Yahvé
  rationale: Le contexte et le parallèle avec « le fruit du pays » permettent une lecture agricole, tandis que le substantif צֶמַח peut aussi évoquer les textes prophétiques du « Germe ». Le texte principal privilégie une formulation française naturelle qui n’exclut pas l’action restauratrice de Yahvé; la note conserve explicitement la traduction nominale et sa possible résonance royale ou messianique.
- issue: Le rendu de פְלֵיטָה et son rapport au thème du reste
  choice: les survivants d’Israël
  alternative: le reste d’Israël
  rationale: Le sens lexical immédiat est celui des rescapés ou survivants. La traduction traditionnelle « reste » est théologiquement significative dans Ésaïe, mais elle est placée en note pour ne pas surinterpréter le lexème.
translation_notes:
  register: Français international moderne, poétique et digne. La phrase conserve les deux membres parallèles du verset. « Fierté » est employé ici dans son sens positif d’honneur et de motif de fierté; les notes préservent les ambiguïtés lexicale et théologique essentielles.
