  text: וְ/סֻכָּ֛ה תִּהְיֶ֥ה לְ/צֵל יוֹמָ֖ם מֵ/חֹ֑רֶב וּ/לְ/מַחְסֶה֙ וּ/לְ/מִסְתּ֔וֹר מִ/זֶּ֖רֶם וּ/מִ/מָּטָֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/006.yaml
  text: And there will be a shelter for shade by day from heat[c][b][a], and for a refuge and a hiding place from storm and from rain.
translation:
  language: fr
  text: Il y aura un abri[a], qui donnera de l’ombre le jour contre la chaleur[b], et qui servira de refuge et de cachette contre la tempête[c] et la pluie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une cabane » : le mot hébreu peut désigner une structure couverte temporaire.'
    reason: lexical_alternative
  - marker: b
    text: Ou « de la chaleur brûlante ».
    reason: lexical_alternative
  - marker: c
    text: Ou « contre le torrent » ou « contre la pluie torrentielle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: סֻכָּה
  choice: abri
  rationale: Le nom désigne une structure couverte, souvent temporaire. « Abri » exprime naturellement ici sa fonction protectrice sans imposer l’image plus précise d’une cabane festive.
- source_word: תִּהְיֶה
  choice: il y aura
  rationale: Cette tournure existentielle rend naturellement en français le verbe « être » avec un sujet indéfini.
- source_word: לְצֵל
  choice: pour donner de l’ombre
  rationale: Dans ce contexte de protection contre la chaleur, cette formulation est plus idiomatique que le calque « pour ombre ».
- source_word: יוֹמָם
  choice: pendant le jour
  rationale: L’adverbe indique la période diurne; cette expression est claire et naturelle en français moderne.
- source_word: מֵחֹרֶב
  choice: protéger de la chaleur
  rationale: Dans ce contexte météorologique, חֹרֶב évoque la chaleur intense plutôt que la sécheresse au sens agricole.
- source_word: מַחְסֶה
  choice: refuge
  rationale: Le terme désigne un lieu où l’on est protégé; « refuge » conserve cette nuance tout en restant distinct de « abri ».
- source_word: מִסְתּוֹר
  choice: retraite
  rationale: Le nom évoque un lieu retiré et protégé. « Retraite » préserve cette nuance sans suggérer nécessairement que l’on se cache d’une personne.
- source_word: זֶרֶם
  choice: tempête
  rationale: Le mot peut désigner un phénomène violent, un torrent ou une pluie torrentielle. « Tempête » le distingue de מָטָר tout en conservant la violence de l’image.
- source_word: מָטָר
  choice: pluie
  rationale: Il s’agit du sens courant du terme et il complète naturellement « tempête ».
theological_decisions:
- issue: Nature de l’image protectrice
  choice: Présenter concrètement un abri protégeant des intempéries sans préciser son référent théologique.
  alternative: Identifier explicitement l’abri à Sion, à la présence divine ou à une protection messianique.
  rationale: L’hébreu déploie une image poétique de protection contre la chaleur et les intempéries, mais ce verset ne demande pas que la traduction en fixe davantage le référent théologique.
translation_notes:
  register: Français international moderne, clair et digne. La structure poétique associe l’ombre protectrice du jour à un refuge contre les intempéries; les termes français évitent les répétitions tout en maintenant les nuances des trois noms hébreux désignant l’abri.
