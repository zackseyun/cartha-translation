  naturalness: Le français est généralement clair et moderne. « Que ton nom soit invoqué sur nous » est à la fois plus idiomatique dans un registre biblique sobre et plus proche de l’expression hébraïque que « soit prononcé sur nous ».
  terminology: '« Opprobre » rend mieux חֶרְפָּה que « honte » : le mot exprime un déshonneur subi et socialement attribué, sans le réduire à un sentiment intérieur. La note doit parler du statut d’épouse et du rattachement au nom d’un homme, non d’un hypothétique « statut d’un mari ».'
