id: ISA.4.1
reference: Isaiah 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הֶחֱזִיקוּ֩ שֶׁ֨בַע נָשִׁ֜ים בְּ/אִ֣ישׁ אֶחָ֗ד בַּ/יּ֤וֹם הַ/הוּא֙ לֵ/אמֹ֔ר לַחְמֵ֣/נוּ נֹאכֵ֔ל וְ/שִׂמְלָתֵ֖/נוּ נִלְבָּ֑שׁ רַ֗ק יִקָּרֵ֤א שִׁמְ/ךָ֙ עָלֵ֔י/נוּ אֱסֹ֖ף חֶרְפָּתֵֽ/נוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/001.yaml
  text: And seven women will take hold of one man in that day[a], saying, “We will eat our own bread and wear our own clothing; only let your name be called over us[b]. Take away our reproach.”
translation:
  language: fr
  text: 'En ce jour-là, sept femmes saisiront un seul homme et diront : « Nous mangerons notre propre pain et porterons nos propres vêtements. Permets seulement que ton nom soit invoqué sur nous[a] ; enlève notre opprobre[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que nous soyons appelées par ton nom ». Cette expression implique probablement un mariage ou un rattachement juridique et social à cet homme.'
    reason: lexical_alternative
  - marker: b
    text: L’« opprobre » désigne ici un déshonneur social. Dans ce contexte, il s’agit vraisemblablement du déshonneur associé au fait de ne pas être rattachées au nom et au statut d’un homme, probablement comme épouses, après la dévastation décrite précédemment.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶחֱזִיקוּ
  choice: saisiront
  rationale: Le hifil de חזק construit avec ב exprime ici le fait de saisir ou de s’emparer fermement de quelqu’un. « Saisiront » conserve la force et l’initiative pressante du geste sans lui attribuer nécessairement une violence excessive.
- source_word: שֶׁבַע נָשִׁים
  choice: sept femmes
  rationale: Traduction directe du numéral et du nom. Il ne faut pas employer « épouses », puisque le lien matrimonial n’est qu’implicite dans la demande qui suit.
- source_word: בְּאִישׁ אֶחָד
  choice: un seul homme
  rationale: La préposition ב marque l’objet saisi. « Un seul » fait ressortir en français le contraste entre les sept femmes et l’homme unique.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formule prophétique naturelle en français, qui maintient le lien avec le jugement et la dévastation annoncés dans le contexte.
- source_word: לֵאמֹר
  choice: et diront
  rationale: Cette formulation introduit naturellement le discours direct en français tout en rendant la valeur de l’infinitif hébreu.
- source_word: לַחְמֵנוּ נֹאכֵל
  choice: Nous mangerons notre propre pain
  rationale: Le suffixe possessif signifie « notre pain » ; « propre » explicite l’insistance contextuelle sur le fait que ces femmes assureront elles-mêmes leur subsistance.
- source_word: וְשִׂמְלָתֵנוּ נִלְבָּשׁ
  choice: et porterons nos propres vêtements
  rationale: « Vêtements » rend naturellement la valeur collective de שִׂמְלָה. « Propres » souligne, comme dans le membre parallèle, qu’elles ne réclament pas d’être entretenues par l’homme.
- source_word: רַק
  choice: seulement
  rationale: 'L’adverbe marque la restriction : malgré leur autonomie matérielle déclarée, elles demandent une seule chose.'
- source_word: יִקָּרֵא שִׁמְךָ עָלֵינוּ
  choice: que ton nom soit prononcé sur nous
  rationale: Cette formulation conserve l’image et la construction passive de l’hébreu, sans expliciter abusivement la demande par « épouse-nous ». Une note donne l’équivalent français plus idiomatique.
- source_word: אֱסֹף
  choice: enlève
  rationale: Bien que le sens premier de אסף soit « rassembler », le verbe signifie ici retirer ou faire disparaître ce qui constitue leur honte.
- source_word: חֶרְפָּתֵנוּ
  choice: notre honte
  rationale: « Honte » est clair en français moderne et peut désigner ici la condition socialement déshonorante évoquée, sans en limiter la cause au célibat ou à l’absence d’enfants.
theological_decisions:
- issue: Portée matrimoniale ou sociale de « que ton nom soit prononcé sur nous »
  choice: Conserver dans le texte l’expression imagée de l’hébreu.
  alternative: « Que nous soyons appelées de ton nom » ou, de manière interprétative, « épouse-nous ».
  rationale: La formule implique vraisemblablement que les femmes soient rattachées au nom et au statut de l’homme, probablement par le mariage, mais le texte n’emploie pas le verbe ordinaire signifiant « épouser ». La traduction maintient donc cette implication sans la transformer en affirmation explicite.
- issue: Nature précise de la honte
  choice: Employer le terme général « honte ».
  alternative: « La honte de ne pas être mariées » ou « la honte de ne pas avoir d’enfants ».
  rationale: Le contexte permet d’évoquer le déshonneur social lié à l’absence de mari, de nom familial ou de descendance après la dévastation, mais le verset ne précise pas une cause unique.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste simple et pressant. L’expression inhabituelle « ton nom soit prononcé sur nous » est volontairement maintenue afin de préserver l’image hébraïque et son ambiguïté sociale et matrimoniale, avec clarification en note.
