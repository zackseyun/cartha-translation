revisions:
- from: 'En ce jour-là, sept femmes saisiront un seul homme et diront : « Nous mangerons notre propre pain et porterons nos propres vêtements. Permets seulement que ton nom soit prononcé sur nous[a] ; enlève notre honte[b]. »'
  to: 'En ce jour-là, sept femmes saisiront un seul homme et diront : « Nous mangerons notre propre pain et porterons nos propres vêtements. Permets seulement que ton nom soit invoqué sur nous[a] ; enlève notre opprobre[b]. »'
  rationale: La révision remplace « prononcé » par « invoqué », qui rend plus fidèlement l’idiome passif « ton nom sera appelé sur nous » tout en restant recevable en français biblique moderne. « Opprobre » restitue la valeur sociale de חֶרְפָּה. Les notes conservent explicitement le caractère probable, plutôt qu’explicite, de l’implication matrimoniale et ne réduisent pas l’opprobre à une cause unique.
