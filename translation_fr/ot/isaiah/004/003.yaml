id: ISA.4.3
reference: Isaiah 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/נִּשְׁאָ֣ר בְּ/צִיּ֗וֹן וְ/הַ/נּוֹתָר֙ בִּ/יר֣וּשָׁלִַ֔ם קָד֖וֹשׁ יֵאָ֣מֶר ל֑/וֹ כָּל הַ/כָּת֥וּב לַ/חַיִּ֖ים בִּ/ירוּשָׁלִָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/003.yaml
  text: And it shall be that whoever remains in Zion and whoever is left in Jerusalem will be called holy—everyone who is recorded for life in Jerusalem[a][b].
translation:
  language: fr
  text: Alors, quiconque restera à Sion et quiconque subsistera à Jérusalem sera appelé saint — tous ceux qui seront inscrits pour la vie à Jérusalem[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui seront inscrits parmi les vivants à Jérusalem ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « inscrits pour la vie » peut évoquer un registre officiel des personnes épargnées et maintenues en vie ; elle fait aussi écho au thème biblique plus large de personnes inscrites dans le livre de vie.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיָה
  choice: Alors
  rationale: Introduit naturellement en français l’annonce prophétique à venir portée par la construction hébraïque, sans l’alourdir par un calque.
- source_word: הַנִּשְׁאָר
  choice: quiconque restera
  rationale: Le participe nifal désigne celui qui demeure ou survit. « Quiconque » en restitue la portée générique et distributive dans un français actuel.
- source_word: בְּצִיּוֹן
  choice: à Sion
  rationale: Conserve le nom géographique et théologique; « à » est la préposition française naturelle avec un nom de ville.
- source_word: וְהַנּוֹתָר
  choice: quiconque subsistera
  rationale: Rend le participe parallèle par un terme évoquant la survie, tout en conservant la variation lexicale de l’hébreu.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Rendu locatif direct et idiomatique en français.
- source_word: קָדוֹשׁ
  choice: saint
  rationale: Terme biblique usuel qui exprime l’appartenance et la consécration, sans réduire le sens à une simple qualité morale.
- source_word: יֵאָמֶר לוֹ
  choice: sera appelé
  rationale: Rend idiomatiquement le nifal de אמר avec ל, qui attribue ici la désignation « saint » à la personne concernée.
- source_word: כָּל הַכָּתוּב
  choice: quiconque sera inscrit
  rationale: Le singulier distributif hébreu est conservé par « quiconque »; « inscrit » suggère naturellement une consignation dans un registre sans en préciser abusivement la nature.
- source_word: לַחַיִּים
  choice: pour la vie
  rationale: Préserve l’expression concise et son ambiguïté entre l’inscription en vue de rester en vie et une résonance théologique plus large.
- source_word: בִּירוּשָׁלִַם
  choice: à Jérusalem
  rationale: Conserve le complément locatif final et son lien possible avec l’inscription ou avec les vivants de Jérusalem.
theological_decisions:
- issue: Le verset vise-t-il seulement les survivants physiques ou un reste sanctifié et désigné par Dieu ?
  choice: Le texte principal maintient ensemble la survie, l’appellation « saint » et l’inscription pour la vie.
  alternative: Limiter le verset soit à des survivants historiques, soit à une référence explicite au livre de vie eschatologique.
  rationale: L’hébreu unit ces éléments sans développer leur rapport. La traduction ne doit ni supprimer la portée théologique ni imposer une doctrine ultérieure entièrement formulée.
- issue: Sens de לַחַיִּים
  choice: pour la vie
  alternative: parmi les vivants
  rationale: « Pour la vie » conserve la construction hébraïque et sa tension sémantique; l’autre lecture légitime est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « quiconque » rend la valeur générique des participes singuliers et assure la cohérence distributive du verset. « Subsistera » maintient le parallélisme tout en reflétant la variation lexicale hébraïque. Les marqueurs [a] et [b] figurent dans le texte principal.
