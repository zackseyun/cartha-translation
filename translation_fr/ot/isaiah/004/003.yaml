  terminology: « Sion », « Jérusalem », « saint » et « inscrit pour la vie » conviennent. « Subsistera » est recevable dans ce registre prophétique et maintient la nuance parallèle de survie sans introduire l’idée potentiellement ambiguë d’être « laissé » au sens d’abandonné.
