language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אִ֣ם רָחַ֣ץ אֲדֹנָ֗/י אֵ֚ת צֹאַ֣ת בְּנוֹת צִיּ֔וֹן וְ/אֶת דְּמֵ֥י יְרוּשָׁלִַ֖ם יָדִ֣יחַ מִ/קִּרְבָּ֑/הּ בְּ/ר֥וּחַ מִשְׁפָּ֖ט וּ/בְ/ר֥וּחַ בָּעֵֽר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/004/004.yaml
  text: when the Lord has washed away the filth of the daughters of Zion and cleansed the bloodshed of Jerusalem from her midst by a spirit of justice and by a spirit of burning[a][b].
translation:
  language: fr
  text: quand le Seigneur aura lavé la souillure des filles de Sion et aura ôté de son sein le sang versé de Jérusalem[a], par un souffle de jugement et par un souffle qui consume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la culpabilité liée au sang versé » ; littéralement « les sangs de Jérusalem ».
    reason: lexical_alternative
  - marker: b
    text: 'Le mot hébreu traduit par « souffle » peut aussi signifier « vent » ou « esprit ». On pourrait aussi traduire : « par un esprit de jugement et par un esprit qui consume » ; ou comprendre l’image d’un vent de jugement et d’un vent brûlant.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: quand
  rationale: Avec les formes verbales qui suivent et dans le contexte de la promesse précédente, le terme introduit ici le moment où la purification sera accomplie, sans mettre principalement en doute sa réalisation.
- source_word: רָחַץ
  choice: aura lavé
  rationale: Le verbe signifie « laver ». Le futur antérieur convient à la subordonnée temporelle française et conserve l’image concrète de purification.
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Il s’agit du titre divin Adonaï, et non du tétragramme.
- source_word: צֹאַת
  choice: la souillure
  rationale: Le nom désigne une saleté repoussante, pouvant évoquer les excréments. « Souillure » garde à la fois la force morale et l’image d’impureté sans devenir inutilement cru.
- source_word: בְּנוֹת צִיּוֹן
  choice: les filles de Sion
  rationale: Cette traduction directe préserve l’expression prophétique et sa dimension collective, sans la réduire explicitement aux seules femmes de la ville.
- source_word: דְּמֵי יְרוּשָׁלַםִ
  choice: le sang versé … en son sein
  rationale: Le pluriel hébreu « sangs » peut désigner le sang répandu ou la culpabilité liée au meurtre. « Sang versé » reste naturel et laisse percevoir la violence commise.
- source_word: יָדִיחַ
  choice: aura éliminé
  rationale: La forme verbale exprime ici l’action de faire partir en lavant ou en rinçant. « Éliminé » rend clairement le résultat sans répéter « lavé » ni suggérer que le sang versé lui-même devient pur.
- source_word: מִקִּרְבָּהּ
  choice: de Jérusalem … en son sein
  rationale: La formulation conserve l’idée d’une réalité retirée de l’intérieur de Jérusalem ainsi que la personnification féminine de la ville.
- source_word: בְּרוּחַ
  choice: par un souffle
  rationale: רוּחַ peut signifier souffle, vent ou esprit. « Souffle » préserve mieux cette polysémie en français et évite d’identifier explicitement l’agent au Saint-Esprit.
- source_word: מִשְׁפָּט
  choice: jugement
  rationale: Dans ce contexte de purification punitive, « jugement » rend directement la dimension judiciaire du terme, tout en pouvant inclure l’exercice de la justice.
- source_word: בְּרוּחַ בָּעֵר
  choice: un souffle qui consume
  rationale: La forme issue de בער évoque ce qui brûle ou consume. Cette tournure française conserve l’image active d’une purification destructrice.
theological_decisions:
- issue: Sens de רוּחַ dans les deux expressions parallèles
  choice: « par un souffle de jugement et un souffle qui consume »
  alternative: « par l’Esprit de jugement et par l’Esprit qui consume » ou « par un vent de jugement et un vent brûlant »
  rationale: Le texte hébreu ne précise pas à lui seul s’il faut comprendre l’Esprit divin, un vent, un souffle ou une force agissante. Le corps du texte conserve cette ouverture, tandis que la note signale les principales lectures possibles.
- issue: Valeur de דָּמִים appliqué à Jérusalem
  choice: « le sang versé »
  alternative: « la culpabilité du sang versé » ou « les taches de sang »
  rationale: Le contexte permet à la fois une référence à la violence meurtrière et à la culpabilité qu’elle entraîne. La traduction retenue ne tranche pas explicitement en faveur d’une seule conception juridique ou matérielle.
translation_notes:
  register: Français moderne, international et digne. La syntaxe suit le caractère temporel et prospectif du verset. Les images de lavage, de souillure, de sang et de combustion sont maintenues, tandis que les ambiguïtés de « sangs » et de רוּחַ sont signalées en notes.
