review_pass:
  verdict: revise
  source_fidelity: Le sens temporel de אִם est bien rendu par « quand », et le futur antérieur convient. « Le Seigneur », « souillure », « filles de Sion » et « sang versé » sont globalement fidèles. Toutefois, « éliminé » efface trop entièrement l’image de rinçage/éviction par lavage portée par יָדִיחַ, et l’enchaînement « de Jérusalem le sang versé en son sein » rend l’antécédent de « son sein » inutilement flottant.
  naturalness: Le registre est moderne et digne. Une légère réorganisation rend plus nette la relation entre Jérusalem et « son sein », tout en évitant de faire porter « en son sein » sur « le sang versé ».
  terminology: « Souffle » est un choix recevable pour préserver la polysémie de רוּחַ. « Jugement » est plus direct pour מִשְׁפָּט dans ce contexte. « Un souffle qui consume » conserve l’image active de בָּעֵר sans imposer l’identification au Saint-Esprit. La note doit présenter aussi les possibilités « vent » et « esprit » sans privilégier doctrinalement la majuscule.
  issues:
  - severity: medium
    issue: « éliminé » pour יָדִיחַ
    rationale: Le verbe évoque ici le fait de faire partir en lavant ou en rinçant. « Éliminé » communique le résultat, mais perd l’imagerie de purification aqueuse importante dans le parallélisme avec « lavé ».
  - severity: low
    issue: Portée syntaxique de « en son sein »
    rationale: Dans « éliminé de Jérusalem le sang versé en son sein », le complément peut momentanément paraître qualifier le sang plutôt que désigner l’intérieur de Jérusalem. La formulation révisée clarifie la personnification de la ville.
  - severity: low
    issue: Note sur רוּחַ incomplète dans ses alternatives
    rationale: La note mentionne « esprit » et « vent », mais l’alternative citée ne montre que « Esprit ». Il est préférable de signaler explicitement que « souffle » peut aussi se comprendre comme « vent » ou « esprit », sans conférer une valeur doctrinale à la majuscule.
  revised_text: quand le Seigneur aura lavé la souillure des filles de Sion et aura ôté de son sein le sang versé de Jérusalem[a], par un souffle de jugement et par un souffle qui consume[b].
