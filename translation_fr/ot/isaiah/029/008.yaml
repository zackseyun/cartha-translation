  naturalness: Le registre est globalement moderne, clair et digne. La révision améliore l'idiomaticité des deux images corporelles sans expliciter le résultat final de la comparaison.
  terminology: « mont Sion » convient. Les notes conservent utilement les possibilités littérales liées à נֶפֶשׁ, sans faire de ce terme une affirmation anthropologique technique.
