revisions:
- from: 'Ce sera comme lorsqu’un homme affamé rêve : le voici qui mange, puis il se réveille, l’estomac vide[a] ; ou comme lorsqu’un homme assoiffé rêve : le voici qui boit, puis il se réveille, épuisé, la gorge encore avide[b]. Ainsi en sera-t-il de la multitude de toutes les nations qui combattent contre le mont Sion.'
  to: 'Ce sera comme lorsqu’un homme affamé rêve : le voici qui mange, puis il se réveille, le ventre vide[a] ; ou comme lorsqu’un homme assoiffé rêve : le voici qui boit, puis il se réveille, épuisé, sa soif restant inassouvie[b]. Ainsi en sera-t-il de la multitude de toutes les nations qui combattent contre le mont Sion.'
  rationale: La révision remplace deux formulations corporelles moins naturelles par des expressions françaises idiomatiques. « Le ventre vide » communique le manque de nourriture sans réduire lexicalement נֶפֶשׁ à l’estomac. « Sa soif restant inassouvie » rend l'état de désir intense après le réveil et demeure cohérent avec le contexte immédiat de la soif. Les notes et leurs ancres sont préservées.
