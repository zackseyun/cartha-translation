  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ יַחֲלֹ֨ם הָ/רָעֵ֜ב וְ/הִנֵּ֣ה אוֹכֵ֗ל וְ/הֵקִיץ֮ וְ/רֵיקָ֣ה נַפְשׁ/וֹ֒ וְ/כַ/אֲשֶׁ֨ר יַחֲלֹ֤ם הַ/צָּמֵא֙ וְ/הִנֵּ֣ה שֹׁתֶ֔ה וְ/הֵקִיץ֙ וְ/הִנֵּ֣ה עָיֵ֔ף וְ/נַפְשׁ֖/וֹ שׁוֹקֵקָ֑ה כֵּ֣ן יִֽהְיֶ֗ה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל הַ֥ר צִיּֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/008.yaml
  text: And it will be as when a hungry man dreams[a], and behold, he is eating, but he wakes and his appetite is empty; and as when a thirsty man dreams, and behold, he is drinking, but he wakes, and behold, he is faint and his appetite craves[b]. So will be the multitude of all the nations that wage war against Mount Zion.
translation:
  language: fr
  text: 'Ce sera comme lorsqu’un homme affamé rêve : le voici qui mange, puis il se réveille, le ventre vide[a] ; ou comme lorsqu’un homme assoiffé rêve : le voici qui boit, puis il se réveille, épuisé, sa soif restant inassouvie[b]. Ainsi en sera-t-il de la multitude de toutes les nations qui combattent contre le mont Sion.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « son être est vide » ou « son âme est vide ». Ici, le mot hébreu désigne la personne comme siège de la faim et du désir.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « son être désire ardemment » ou « son âme est avide ». Dans ce contexte, l’expression évoque la soif qui demeure au réveil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ce sera
  rationale: Rend naturellement la formule prophétique avec sa valeur future et résultative.
- source_word: כַּאֲשֶׁר
  choice: comme lorsque
  rationale: Introduit clairement la comparaison et permet de conserver le parallélisme des deux scènes de rêve.
- source_word: הָרָעֵב / הַצָּמֵא
  choice: un homme affamé / un homme assoiffé
  rationale: Les adjectifs substantivés sont masculins singuliers et présentent deux exemples humains représentatifs.
- source_word: וְהִנֵּה
  choice: le voici qui
  rationale: Conserve la vivacité déictique de הִנֵּה dans un français actuel et digne, sans recourir à l’archaïsant « voici, il ».
- source_word: וְהֵקִיץ
  choice: puis il se réveille
  rationale: Le français marque naturellement la succession et le renversement entre l’illusion du rêve et le manque constaté au réveil.
- source_word: וְרֵיקָה נַפְשׁוֹ
  choice: l’estomac vide
  rationale: Dans le contexte immédiat de la faim, נֶפֶשׁ désigne la personne comme siège du besoin corporel. Cette expression française transmet concrètement le manque, tandis qu’une note préserve le sens plus littéral.
- source_word: עָיֵף
  choice: épuisé
  rationale: Exprime l’affaiblissement physique provoqué ici par la soif.
- source_word: וְנַפְשׁוֹ שׁוֹקֵקָה
  choice: la gorge encore avide
  rationale: Associe le siège concret de la soif à l’idée de désir intense portée par שׁוֹקֵקָה. « Encore » explicite en français la persistance évidente du besoin après le rêve, sans modifier l’opposition.
- source_word: הַצֹּבְאִים עַל
  choice: qui combattent contre
  rationale: Le participe de צבא décrit les nations rassemblées en force contre le mont Sion ; « combattent contre » en communique clairement la portée militaire.
theological_decisions:
- issue: Sens de נֶפֶשׁ dans les images de faim et de soif
  choice: Des formulations corporelles (« l’estomac », « la gorge »), avec alternatives littérales en notes
  alternative: « son âme est vide » / « son âme désire ardemment »
  rationale: 'נֶפֶשׁ ne formule pas ici une anthropologie technique : le terme désigne la personne vivante comme siège du besoin. La traduction principale privilégie le sens contextuel tout en conservant l’ambiguïté lexicale dans les notes.'
- issue: Masculin singulier représentatif
  choice: « un homme affamé » / « un homme assoiffé »
  alternative: « une personne affamée » / « une personne assoiffée »
  rationale: Le masculin singulier de l’hébreu est conservé, sans en tirer une affirmation théologique propre au sexe masculin.
- issue: Sort des nations assaillantes
  choice: « Ainsi en sera-t-il »
  alternative: Expliciter qu’elles disparaîtront ou seront déçues
  rationale: 'Le texte laisse la comparaison produire son effet : l’espoir des assaillants se révélera aussi inconsistant qu’un repas ou une boisson rêvés. La traduction n’ajoute pas explicitement le résultat que l’image suggère.'
translation_notes:
  register: Français international moderne, imagé et digne. Le parallélisme des deux rêves est maintenu, avec une syntaxe fluide. Les deux marqueurs de note [a] et [b] figurent dans le texte principal.
