source:
  edition: WLC
  text: וְ/יָדְע֥וּ תֹֽעֵי ר֖וּחַ בִּינָ֑ה וְ/רוֹגְנִ֖ים יִלְמְדוּ לֶֽקַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/024.yaml
  text: And those who go astray in spirit will come to understanding[b][a], and those who grumble will learn instruction.
translation:
  language: fr
  text: Ceux qui ont l’esprit égaré acquerront du discernement, et ceux qui murmurent s’instruiront.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: accéderont à
  rationale: Le verbe signifie littéralement « connaîtront », mais avec בִּינָה il exprime ici l’acquisition de l’intelligence. « Accéderont à » rend naturellement en français cette valeur résultative et future.
- source_word: תֹעֵי רוּחַ
  choice: ceux dont l’esprit s’égare
  rationale: תעה évoque l’égarement ou l’erreur, tandis que רוּחַ désigne vraisemblablement ici la disposition intérieure ou l’esprit humain. Cette formulation conserve l’image verbale sans suggérer nécessairement le Saint-Esprit.
- source_word: בִּינָה
  choice: l’intelligence
  rationale: Le nom désigne la compréhension, le discernement ou l’intelligence. « Intelligence » convient à l’acquisition d’une juste compréhension dans ce contexte.
- source_word: וְרוֹגְנִים
  choice: ceux qui murmurent
  rationale: Le participe désigne des personnes qui récriminent ou se plaignent. « Murmurent » est digne, intelligible et préserve la nuance de résistance.
- source_word: יִלְמְדוּ
  choice: apprendront
  rationale: Traduction directe du futur de למד, naturelle en français.
- source_word: לֶקַח
  choice: l’instruction
  rationale: לֶקַח désigne un enseignement ou une instruction reçue. « Instruction » maintient ici le registre sapientiel et s’associe naturellement à « apprendront ».
theological_decisions:
- issue: Sens de רוּחַ dans תֹעֵי רוּחַ
  choice: l’esprit humain ou la disposition intérieure
  alternative: le vent, ou une référence spécifique à l’Esprit
  rationale: Le contexte porte sur le rétablissement intellectuel et moral de personnes égarées ou récalcitrantes. La lecture anthropologique respecte l’idiome hébreu sans introduire une affirmation pneumatologique plus précise que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme hébreu est conservé, avec deux groupes humains suivis chacun d’un changement futur.
