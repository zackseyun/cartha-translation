revisions:
- from: La multitude de tes étrangers[a] sera comme une fine poussière, et la multitude des hommes impitoyables comme la menue paille qui s’envole. Cela arrivera soudain, en un instant.
  to: La multitude de ceux qui te sont étrangers[a] deviendra comme de la poussière fine, et la multitude des hommes impitoyables comme de la menue paille emportée. Cela se produira soudain, en un instant.
  rationale: La révision rend זָרָיִךְ par une formulation française naturelle qui maintient son sens fondamental de personnes étrangères, tout en laissant à la note et au contexte la possible référence à des envahisseurs. Elle lisse aussi deux tournures françaises et conserve l’intensification hébraïque « soudain, en un instant ».
  reviewer_model: gpt-5.6-terra
