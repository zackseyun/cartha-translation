source:
  edition: WLC
  text: וְ/הָיָ֛ה כְּ/אָבָ֥ק דַּ֖ק הֲמ֣וֹן זָרָ֑יִ/ךְ וּ/כְ/מֹ֤ץ עֹבֵר֙ הֲמ֣וֹן עָֽרִיצִ֔ים וְ/הָיָ֖ה לְ/פֶ֥תַע פִּתְאֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/005.yaml
  text: But the multitude of your strangers shall become like fine dust[a], and the multitude of the ruthless like passing chaff; and it shall happen suddenly[b], in an instant.
translation:
  language: fr
  text: La multitude de ceux qui te sont étrangers[a] deviendra comme de la poussière fine, et la multitude des hommes impitoyables comme de la menue paille emportée. Cela se produira soudain, en un instant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de tes gens venus d’ailleurs ». Dans ce contexte, le terme hébreu désigne vraisemblablement des envahisseurs étrangers.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera / cela arrivera
  rationale: 'Les deux occurrences ont des fonctions légèrement différentes : la première introduit une comparaison portant sur ce que deviendra la multitude, tandis que la seconde annonce la survenue soudaine de l’événement.'
- source_word: כְּאָבָק דַּק
  choice: comme une fine poussière
  rationale: Cette formulation rend à la fois אָבָק, « poussière », et דַּק, « fine, ténue », tout en conservant l’image de quelque chose qui se disperse aisément.
- source_word: הֲמוֹן
  choice: la multitude
  rationale: Le terme désigne une masse nombreuse ou une foule. « Multitude » convient au registre prophétique et peut être repris naturellement dans les deux membres parallèles.
- source_word: זָרָיִךְ
  choice: tes étrangers
  rationale: Le mot désigne fondamentalement des étrangers ou des gens de l’extérieur. Le contexte permet d’y voir des envahisseurs hostiles, mais traduire directement par « ennemis » préciserait plus que l’hébreu.
- source_word: וּכְמֹץ עֹבֵר
  choice: comme la menue paille qui s’envole
  rationale: מֹץ désigne la balle ou menue paille séparée du grain, et עֹבֵר évoque ce qui passe ou est emporté. La formulation française restitue naturellement l’image de sa dispersion rapide sans ajouter explicitement le vent.
- source_word: עָרִיצִים
  choice: les hommes impitoyables
  rationale: עָרִיץ caractérise des êtres violents, oppresseurs ou sans pitié. « Hommes impitoyables » garde la force morale du terme dans une langue actuelle.
- source_word: לְפֶתַע פִּתְאֹם
  choice: soudain, en un instant
  rationale: Les deux expressions rapprochées renforcent l’idée d’une irruption brusque. Leur traduction distincte préserve cette insistance.
