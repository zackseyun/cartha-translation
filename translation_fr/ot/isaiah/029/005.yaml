review_pass:
  verdict: revise
  source_fidelity: Le parallélisme, les deux comparaisons et l’insistance finale sur la soudaineté sont bien rendus. Toutefois, « tes étrangers » est peu naturel en français et peut évoquer des étrangers qui t’appartiennent ou des résidents étrangers, plutôt que les personnes extérieures/hostiles visées par זָרָיִךְ. « Ceux qui te sont étrangers » conserve l’ambiguïté lexicale sans imposer « ennemis ».
  naturalness: « Poussière fine » est plus idiomatique que « fine poussière ». La reprise explicite de « deviendra » dans le second membre rend le parallélisme français plus net. « Menue paille emportée » restitue naturellement l’image de la balle ou paille légère qui passe, sans prétendre préciser le moyen de son déplacement.
  terminology: « Multitude », « hommes impitoyables » et « en un instant » conviennent au registre prophétique moderne. La note explique à juste titre la valeur possible de « personnes venues d’ailleurs » et son contexte hostile, sans traduire de façon doctrinalement ou contextuellement excessive par « ennemis ».
  issues:
  - severity: medium
    issue: « Tes étrangers » est sémantiquement et syntaxiquement maladroit en français.
    rationale: Cette expression peut suggérer des étrangers associés à la personne interpellée. Le substantif hébreu désigne des personnes étrangères, avec une coloration hostile probable dans le contexte, mais cette hostilité n’a pas besoin d’être lexicalisée dans le texte.
  - severity: low
    issue: « Fine poussière » est moins usuel que « poussière fine » ; le second verbe comparatif reste seulement implicite.
    rationale: Ces ajustements améliorent la fluidité et la lisibilité du parallélisme sans modifier le sens.
  revised_text: La multitude de ceux qui te sont étrangers[a] deviendra comme de la poussière fine, et la multitude des hommes impitoyables comme de la menue paille emportée. Cela se produira soudain, en un instant.
  revised_footnotes:
  - marker: a
    text: Ou « de tes gens venus d’ailleurs ». Dans ce contexte, le terme hébreu désigne vraisemblablement des envahisseurs étrangers.
    reason: lexical_alternative
  revision_rationale: La révision rend זָרָיִךְ par une formulation française naturelle qui maintient son sens fondamental de personnes étrangères, tout en laissant à la note et au contexte la possible référence à des envahisseurs. Elle lisse aussi deux tournures françaises et conserve l’intensification hébraïque « soudain, en un instant ».
