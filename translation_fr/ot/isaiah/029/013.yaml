  text: וַ/יֹּ֣אמֶר אֲדֹנָ֗/י יַ֚עַן כִּ֤י נִגַּשׁ֙ הָ/עָ֣ם הַ/זֶּ֔ה בְּ/פִ֤י/ו וּ/בִ/שְׂפָתָי/ו֙ כִּבְּד֔וּ/נִי וְ/לִבּ֖/וֹ רִחַ֣ק מִמֶּ֑/נִּי וַ/תְּהִ֤י יִרְאָתָ/ם֙ אֹתִ֔/י מִצְוַ֥ת אֲנָשִׁ֖ים מְלֻמָּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/013.yaml
  text: 'And the Lord said: Because this people draws near with its mouth and honors me with its lips[a], while its heart is far from me, and their fear of me has become a commandment of men that is taught[b],'
translation:
  language: fr
  text: 'Le Seigneur a dit : « Parce que ce peuple s’approche avec sa bouche et m’honore de ses lèvres[a], tandis que son cœur est loin de moi, et que la crainte qu’ils ont de moi est un précepte humain appris[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la révérence qu’il a pour moi » ou « son culte envers moi » ; littéralement, « leur crainte de moi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « un précepte humain enseigné ». Le participe hébreu peut évoquer ce qui est appris ou enseigné.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: le Seigneur
  rationale: Le terme est un titre divin et non le tétragramme ; « le Seigneur » convient naturellement à la formule prophétique française.
- source_word: יַעַן כִּי
  choice: Puisque
  rationale: La locution introduit la cause de la déclaration divine ; « puisque » garde cette valeur explicative dans un français naturel.
- source_word: נִגַּשׁ
  choice: s’approche de moi
  rationale: Le verbe signifie s’approcher ; le complément « de moi », implicite dans le contexte et soutenu par le contraste avec « loin de moi », rend la relation clairement en français.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Conserve le collectif singulier et le ton prophétique de l’hébreu.
- source_word: בְּפִיו וּבִשְׂפָתָיו
  choice: par sa bouche … de ses lèvres
  rationale: Préserve le parallélisme corporel et les suffixes singuliers renvoyant au collectif « peuple », avec des prépositions françaises idiomatiques.
- source_word: כִּבְּדוּנִי
  choice: m’honore
  rationale: Le verbe כבד exprime ici l’honneur rendu à Dieu ; « honorer » est précis et courant.
- source_word: לִבּוֹ רִחַק מִמֶּנִּי
  choice: son cœur reste loin de moi
  rationale: Rend l’état de distance intérieure et maintient le contraste avec l’approche extérieure. « Reste » exprime naturellement l’état résultant sans surinterpréter le parfait.
- source_word: יִרְאָתָם אֹתִי
  choice: sa crainte envers moi
  rationale: « Crainte » conserve le noyau lexical de יִרְאָה et sa tension avec les nuances possibles de respect, de révérence ou de piété.
- source_word: מִצְוַת אֲנָשִׁים
  choice: un commandement humain
  rationale: Exprime le génitif comme une qualification d’origine humaine. En français moderne, « humain » indique clairement le sens générique de אֲנָשִׁים sans suggérer exclusivement des hommes de sexe masculin.
- source_word: מְלֻמָּדָה
  choice: qu’on lui enseigne
  rationale: Le participe passif de למד désigne ce qui est enseigné ou appris. Cette formulation conserve l’idée de transmission tout en restant naturelle en français.
theological_decisions:
- issue: Sens de la « crainte » envers Dieu
  choice: sa crainte envers moi
  alternative: son respect envers moi ; la révérence qu’il a pour moi ; son culte envers moi
  rationale: Le terme hébreu peut englober crainte, révérence et piété cultuelle. Le texte principal garde « crainte », sa valeur lexicale fondamentale, sans réduire la portée théologique.
- issue: Nature humaine du commandement
  choice: un commandement humain
  alternative: un commandement d’hommes
  rationale: '« Humain » rend ici אֲנָשִׁים dans son sens générique et préserve la critique : la relation à Dieu a été ramenée à une prescription provenant d’êtres humains.'
- issue: Valeur de מְלֻמָּדָה
  choice: qu’on lui enseigne
  alternative: qu’il a appris ; enseigné machinalement
  rationale: La forme permet une nuance passive d’enseignement ou d’apprentissage. Le texte principal ne précise pas « machinalement » ou « par cœur », idées possibles dans le contexte mais non explicites dans le mot seul.
translation_notes:
  register: Français international moderne, digne et accessible. Le collectif « ce peuple » demeure au singulier dans les pronoms. La phrase conserve la structure causale et le contraste entre proximité extérieure et éloignement du cœur. Le guillemet reste ouvert et la virgule finale est maintenue parce que le verset fourni introduit la suite de l’oracle.
