  source_fidelity: La première proposition doit éviter « font déclarer », qui introduit sans appui textuel l’intervention d’un tiers chargé de prononcer la déclaration. « Déclarent un homme coupable » rend directement la nuance judiciaire probable de מַחֲטִיאֵי, tout en laissant la note préserver la possibilité causative. « Celui qui défend le droit » interprète trop étroitement לַמּוֹכִיחַ; le participe peut désigner celui qui reprend ou conteste. Les derniers termes conservent correctement l’idée d’une éviction injuste et sans fondement solide.
  naturalness: La révision garde une phrase fluide et une série participiale naturelle en français moderne. « Celui qui reprend à la porte de la ville » est plus fidèle et moins interprétatif que « celui qui défend le droit », sans perdre le cadre public signalé en note.
  terminology: « Déclarent coupable », « tendent un piège », « le juste » et « motifs sans valeur » conviennent au registre judiciaire et biblique sans imposer une lecture confessionnelle. « À la porte de la ville » explicite sobrement le cadre urbain de שַׁעַר.
  issues:
