  variant: modern international French
source:
  edition: WLC
  text: מַחֲטִיאֵ֤י אָדָם֙ בְּ/דָבָ֔ר וְ/לַ/מּוֹכִ֥יחַ בַּ/שַּׁ֖עַר יְקֹשׁ֑וּ/ן וַ/יַּטּ֥וּ בַ/תֹּ֖הוּ צַדִּֽיק׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/021.yaml
  text: those who make a man an offender by a word[a], and lay a snare for the one who reproves in the gate[c][b], and turn aside the righteous with emptiness.
translation:
  language: fr
  text: ceux qui déclarent un homme coupable pour une parole[a], qui tendent un piège à celui qui reprend à la porte de la ville[b], et qui écartent le juste pour des motifs sans valeur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui font d’un homme un coupable par une parole », ou « qui font pécher un homme par une parole ». L’hébreu permet une nuance judiciaire ou causative; le contexte juridique favorise ici la première.
    reason: lexical_alternative
  - marker: b
    text: Ou « à celui qui conteste » ou « à celui qui défend une cause ». La porte de la ville était le lieu où se tenaient les audiences et où se rendaient les jugements publics.
    reason: cultural_and_lexical_note
  - marker: c
    text: Ou « qui écartent le juste pour rien » ou « qui refusent justice au juste par ce qui est vide ». L’expression hébraïque évoque le vide, la futilité ou des motifs sans consistance.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲטִיאֵי
  choice: font déclarer… coupable
  rationale: Le hiphil de חטא peut exprimer le fait de faire pécher ou de rendre coupable. Le cadre judiciaire du verset favorise ici l’idée de faire condamner quelqu’un, sans effacer l’ambiguïté dans la note.
- source_word: אָדָם
  choice: un homme
  rationale: Le singulier est générique, mais individualise la victime; « un homme » conserve cette forme sans employer l’abstraction « l’humanité ».
- source_word: בְּדָבָר
  choice: par une parole
  rationale: דבר peut désigner une parole, une affaire ou un motif. La traduction garde la formulation concise et son possible sens judiciaire.
- source_word: לַמּוֹכִיחַ
  choice: celui qui défend le droit
  rationale: יכח peut évoquer la réprimande, la contestation ou la défense d’une cause. Dans le contexte du tribunal à la porte, cette formulation rend naturellement la fonction judiciaire tout en laissant la note signaler l’autre nuance.
- source_word: בַּשַּׁעַר
  choice: à la porte de la ville
  rationale: La porte de la ville était le lieu des audiences et des décisions publiques; l’explicitation minimale rend l’expression intelligible au lecteur moderne.
- source_word: יְקֹשׁוּן
  choice: tendent un piège
  rationale: Cette expression française naturelle conserve la métaphore d’un piège délibérément préparé.
- source_word: וַיַּטּוּ
  choice: écartent
  rationale: נטה décrit ici l’action de détourner ou de faire dévier, vraisemblablement dans l’exercice de la justice.
- source_word: בַתֹּהוּ
  choice: par des arguments sans valeur
  rationale: תֹהוּ désigne le vide, la vanité ou ce qui est sans consistance. Dans le cadre judiciaire, il s’agit probablement de motifs dépourvus de valeur; la note conserve d’autres lectures possibles.
- source_word: צַדִּיק
  choice: le juste
  rationale: צדיק peut désigner une personne juste ou innocente dans une procédure. « le juste » préserve les dimensions morale et judiciaire.
