  text: וְ/חָנִ֥יתִי כַ/דּ֖וּר עָלָ֑יִ/ךְ וְ/צַרְתִּ֤י עָלַ֨יִ/ךְ֙ מֻצָּ֔ב וַ/הֲקִֽימֹתִ֥י עָלַ֖יִ/ךְ מְצֻרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/003.yaml
  text: And I will encamp against you all around[a], and I will besiege you with siegeworks[c][b], and I will raise up siege towers against you.
translation:
  language: fr
  text: Je camperai tout autour de toi[a], je t’assiégerai avec un ouvrage de siège[b], et je dresserai contre toi des ouvrages de siège[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « comme un cercle » ; autre traduction possible : « en cercle autour de toi ».'
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu peut aussi désigner « un poste de siège », « une position fortifiée » ou « une garnison ».
    reason: lexical_alternative
  - marker: c
    text: Le terme peut désigner divers ouvrages militaires, notamment des remparts, des rampes ou des tours de siège.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: Je camperai
  rationale: Le verbe חנה signifie « camper, établir son camp ». Dans ce contexte, il évoque directement l’installation militaire autour de la ville.
- source_word: כַדּוּר
  choice: tout autour
  rationale: Le terme évoque ici une disposition circulaire. « Tout autour » exprime naturellement l’encerclement militaire, tandis que l’image plus littérale est conservée en note.
- source_word: עָלָיִךְ / עָלַיִךְ
  choice: autour de toi / contre toi / te
  rationale: La préposition עַל avec le suffixe féminin singulier désigne la ville interpellée. Sa valeur hostile est rendue selon la construction française par « contre toi » ou par le pronom objet « te » ; avec le premier verbe, « autour de toi » explicite l’encerclement.
- source_word: וְצַרְתִּי
  choice: je t’assiégerai
  rationale: Le verbe צור est employé ici au sens militaire d’« assiéger ». Cette formulation française est directe et idiomatique.
- source_word: מֻצָּב
  choice: au moyen d’un ouvrage de siège
  rationale: Le nom désigne ce qui est placé ou établi, peut-être un poste, une garnison ou un dispositif de siège. « Ouvrage de siège » convient au contexte sans imposer une identification trop précise.
- source_word: וַהֲקִימֹתִי
  choice: et je dresserai
  rationale: La forme causative de קום signifie « faire tenir debout, établir, ériger ». « Dresser » convient à l’installation de structures militaires.
- source_word: מְצֻרוֹת
  choice: des fortifications de siège
  rationale: Le terme pluriel relève du vocabulaire du siège et des fortifications, mais son référent matériel exact reste incertain. Cette traduction générale préserve cette latitude.
theological_decisions:
- issue: Locuteur et agent du jugement
  choice: Les verbes à la première personne présentent Dieu comme l’agent direct du siège.
  alternative: Comprendre que Dieu permet ou ordonne indirectement l’action d’armées humaines.
  rationale: L’hébreu emploie trois verbes explicites à la première personne du singulier. La traduction conserve cette affirmation sans préciser l’instrument humain ni réduire l’action divine à une simple permission.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme ternaire de la menace est conservé. Les termes militaires restent suffisamment généraux pour respecter l’incertitude du vocabulaire hébreu.
