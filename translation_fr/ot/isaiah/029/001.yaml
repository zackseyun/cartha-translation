id: ISA.29.1
reference: Isaiah 29:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֚וֹי אֲרִיאֵ֣ל אֲרִיאֵ֔ל קִרְיַ֖ת חָנָ֣ה דָוִ֑ד סְפ֥וּ שָׁנָ֛ה עַל שָׁנָ֖ה חַגִּ֥ים יִנְקֹֽפוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/001.yaml
  text: Ah[a], Ariel, Ariel, the city where David encamped! Add year to year; let the feasts run their round.
translation:
  language: fr
  text: 'Malheur à toi, Ariel, Ariel,

    ville où David a dressé son camp !

    Ajoutez année après année,

    que les fêtes accomplissent leur cycle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ariel » désigne ici Jérusalem. En hébreu, ce nom peut aussi évoquer le « foyer de l’autel » ou le « lion de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à toi
  rationale: L’interjection ouvre ici un oracle menaçant contre Jérusalem. « Malheur à toi » restitue naturellement en français sa force de lamentation et d’avertissement, sans la réduire à une simple interpellation.
- source_word: אֲרִיאֵל
  choice: Ariel
  rationale: Le terme fonctionne comme un nom donné à Jérusalem, comme le montre l’apposition qui suit. La translittération conserve aussi les possibles échos lexicaux du mot hébreu.
- source_word: קִרְיַת חָנָה דָוִד
  choice: ville où David a dressé son camp
  rationale: Cette formulation française naturelle conserve le sens concret du verbe חנה, qui désigne l’action de camper, et son évocation historique liée à David.
- source_word: סְפוּ שָׁנָה עַל שָׁנָה
  choice: Ajoutez année à année
  rationale: L’impératif pluriel et l’expression répétitive sont conservés avec leur brièveté, suggérant la poursuite du temps et des années.
- source_word: חַגִּים
  choice: les fêtes
  rationale: Le mot désigne les célébrations cultuelles récurrentes d’Israël. « Fêtes » est clair, digne et suffisamment large.
- source_word: יִנְקֹפוּ
  choice: accomplissent leur cycle
  rationale: Le verbe évoque un mouvement circulaire ou un cycle achevé. Cette expression rend naturellement la succession annuelle des fêtes tout en maintenant l’image cyclique.
theological_decisions:
- issue: Faut-il traduire אֲרִיאֵל selon un sens lexical ou le conserver comme nom ?
  choice: Conserver « Ariel » dans le texte comme désignation de Jérusalem, avec les sens possibles en note.
  alternative: Traduire par « foyer de l’autel » ou « lion de Dieu ».
  rationale: La répétition vocative et l’apposition « ville où David a dressé son camp » montrent que le terme désigne Jérusalem. Le garder sous la forme « Ariel » préserve le jeu prophétique et l’ambiguïté que la suite du passage peut exploiter.
translation_notes:
  register: Français international moderne, solennel mais accessible. La disposition en lignes fait ressortir l’adresse répétée et le rythme poétique. « Malheur à toi » exprime clairement la tonalité menaçante de l’oracle; la note maintient l’ambiguïté d’« Ariel ».
