  text: וְ/שָׁפַלְתְּ֙ מֵ/אֶ֣רֶץ תְּדַבֵּ֔רִי וּ/מֵֽ/עָפָ֖ר תִּשַּׁ֣ח אִמְרָתֵ֑/ךְ וְֽ֠/הָיָה כְּ/א֤וֹב מֵ/אֶ֨רֶץ֙ קוֹלֵ֔/ךְ וּ/מֵ/עָפָ֖ר אִמְרָתֵ֥/ךְ תְּצַפְצֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/004.yaml
  text: Then you will be brought low; from the earth you will speak[a], and from the dust your speech will be low. Your voice will be like that of a medium from the earth, and from the dust your speech will chirp.
translation:
  language: fr
  text: 'Tu seras abaissée : de la terre, tu parleras, et de la poussière, ta parole sera basse. De la terre, ta voix sera comme celle d’un médium[a], et de la poussière, ta parole pépiera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’un esprit » ou « d’un nécromancien ». Le terme hébreu oub est lié à la consultation des morts; son référent précis — médium, esprit, ou voix associée à cette pratique — est discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפַלְתְּ
  choice: Tu seras abaissée
  rationale: Le féminin singulier correspond à la ville personnifiée à laquelle le prophète s’adresse. Le passif français exprime naturellement l’abaissement subi dans ce contexte de jugement.
- source_word: מֵאֶרֶץ
  choice: depuis la terre
  rationale: Cette formulation conserve l’image d’une voix provenant du sol ainsi que le parallélisme avec « depuis la poussière ».
- source_word: תִּשַּׁח אִמְרָתֵךְ
  choice: ta parole sera assourdie
  rationale: Le verbe décrit une parole abaissée, faible ou étouffée. « Assourdie » rend en français naturel la faiblesse de la voix sans préciser indûment qu’il s’agit d’un chuchotement.
- source_word: כְּאוֹב
  choice: comme celle d’un médium
  rationale: אוֹב est associé à la consultation des morts et peut désigner un médium, l’esprit évoqué ou la voix qui lui est attribuée. « Médium » conserve la référence à la pratique nécromantique sans faire de la ville elle-même un fantôme.
- source_word: תְּצַפְצֵף
  choice: pépiera
  rationale: Le verbe évoque un son aigu et faible, comparable au pépiement d’un oiseau. Le choix garde l’image saisissante et inquiétante de l’hébreu.
theological_decisions:
- issue: La référence de אוֹב dans une comparaison liée à la nécromancie
  choice: médium
  alternative: esprit d’un mort ; revenant ; nécromancien
  rationale: Le texte établit une comparaison avec une voix faible venant de terre et n’approuve pas la pratique évoquée. « Médium » maintient la référence lexicale tout en laissant à la note les autres valeurs possibles du terme.
translation_notes:
  register: Français international moderne, poétique et digne. Le féminin singulier est maintenu pour l’adresse à la ville personnifiée. La répétition de « depuis la terre / depuis la poussière » et de « ta parole » préserve le parallélisme hébreu.
