revisions:
- from: 'Tu seras abaissée : depuis la terre, tu parleras, et depuis la poussière, ta parole sera assourdie. Ta voix, depuis la terre, sera comme celle d’un médium[a], et depuis la poussière, ta parole pépiera.'
  to: 'Tu seras abaissée : de la terre, tu parleras, et de la poussière, ta parole sera basse. De la terre, ta voix sera comme celle d’un médium[a], et de la poussière, ta parole pépiera.'
  rationale: La révision remplace le faux sens potentiel de « assourdie » par « sera basse », qui rend sobrement la parole abaissée et préserve la difficulté de l’hébreu. Elle améliore l’ordre des mots pour un français poétique naturel, sans perdre les répétitions structurantes « de la terre / de la poussière ». La note est reformulée afin de maintenir l’ambiguïté lexicale de oub sans imposer une interprétation de la nécromancie.
  reviewer_model: gpt-5.6-terra
