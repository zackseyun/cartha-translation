  to: Car, lorsqu’il verra ses enfants[a], l’œuvre de mes mains, en son sein, ils sanctifieront mon nom ; ils sanctifieront le Saint de Jacob et éprouveront de la crainte devant[b] le Dieu d’Israël.
  rationale: La révision se limite à améliorer l’idiomaticité française et la position de l’appel de note. Elle ne tranche pas l’ambiguïté des pronoms singuliers ni n’altère le parallélisme, la répétition de « sanctifieront » ou la force révérencielle du dernier verbe.
