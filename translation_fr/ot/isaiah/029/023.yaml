source:
  edition: WLC
  text: כִּ֣י בִ֠/רְאֹת/וֹ יְלָדָ֞י/ו מַעֲשֵׂ֥ה יָדַ֛/י בְּ/קִרְבּ֖/וֹ יַקְדִּ֣ישֽׁוּ שְׁמִ֑/י וְ/הִקְדִּ֨ישׁוּ֙ אֶת קְד֣וֹשׁ יַֽעֲקֹ֔ב וְ/אֶת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל יַעֲרִֽיצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/023.yaml
  text: For when he sees his children[a], the work of my hands, in his midst, they will sanctify my name; they will sanctify the Holy One of Jacob[b], and they will stand in awe of the God of Israel.
translation:
  language: fr
  text: Car, lorsqu’il verra ses enfants[a], l’œuvre de mes mains, en son sein, ils sanctifieront mon nom ; ils sanctifieront le Saint de Jacob et éprouveront de la crainte devant[b] le Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lorsqu’Abraham verra ses enfants, l’œuvre de mes mains, en son sein ». Les pronoms au singulier peuvent renvoyer aux patriarches nommés au verset précédent, notamment à Abraham ou à Jacob ; Jacob peut aussi représenter collectivement Israël.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « craindront » ou « révéreront ». Le verbe hébreu exprime une crainte profonde mêlée de respect devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי בִרְאֹתוֹ
  choice: Car, lorsqu’il verra
  rationale: כִּי rattache le verset à la promesse précédente en en donnant le fondement, tandis que ב suivi de l’infinitif construit a ici une valeur temporelle. La formulation française conserve ces deux rapports.
- source_word: יְלָדָיו
  choice: ses enfants
  rationale: Le terme désigne collectivement les enfants ou descendants sans imposer qu’il s’agisse uniquement de fils.
- source_word: מַעֲשֵׂה יָדַי
  choice: œuvre de mes mains
  rationale: Cette traduction maintient l’image concrète de l’action créatrice ou formatrice de Dieu et respecte la tournure nominale hébraïque.
- source_word: בְּקִרְבּוֹ
  choice: au milieu de lui
  rationale: La formulation préserve le suffixe masculin singulier et l’ambiguïté de son référent, malgré son caractère légèrement marqué en français.
- source_word: יַקְדִּישׁוּ שְׁמִי
  choice: ils sanctifieront mon nom
  rationale: Le hiphil de קדש signifie ici reconnaître ou traiter comme saint. « Sanctifier » conserve le vocabulaire théologique et permet de reproduire la répétition du verbe.
- source_word: וְהִקְדִּישׁוּ אֶת קְדוֹשׁ יַעֲקֹב
  choice: ils sanctifieront le Saint de Jacob
  rationale: La répétition de קדש est maintenue, ainsi que le titre divin caractéristique d’Ésaïe, « le Saint de Jacob ».
- source_word: יַעֲרִיצוּ
  choice: révéreront avec crainte
  rationale: Le verbe ערץ exprime une crainte saisie de respect devant Dieu. Cette expression conserve à la fois la révérence et l’effroi, là où « révérer » seul pourrait atténuer la force du terme.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: le Dieu d’Israël
  rationale: Traduction directe et naturelle de ce titre divin courant.
theological_decisions:
- issue: Référent des pronoms masculins singuliers (« il verra… au milieu de lui »)
  choice: Conserver les pronoms singuliers sans identifier explicitement leur référent dans le texte.
  alternative: Nommer Abraham, Jacob, ou comprendre Jacob/Israël comme une figure collective personnifiée.
  rationale: Le contexte immédiat nomme Jacob et Abraham au verset précédent. Le singulier peut évoquer le patriarche Abraham, le patriarche Jacob, ou Jacob/Israël personnifié. Le texte principal ne tranche donc pas une ambiguïté réelle de l’hébreu.
- issue: Traduction des deux emplois de קדש
  choice: Employer deux fois « sanctifier ».
  alternative: Employer « reconnaître comme saint », « tenir pour saint » ou « honorer comme saint ».
  rationale: La répétition est rhétoriquement et théologiquement significative. « Sanctifier » reste intelligible dans ce contexte et la rend visible.
- issue: Portée de יעריצו
  choice: Rendre ensemble la révérence et la crainte par « révéreront avec crainte ».
  alternative: « craindront », « révéreront » ou « seront saisis de crainte devant ».
  rationale: Le verbe ne désigne ni une simple estime ni seulement la terreur ; il évoque une crainte révérencielle devant le Dieu d’Israël.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe « au milieu de lui » est volontairement formelle afin de préserver le singulier et l’ambiguïté du texte source. Le parallélisme et la répétition de « sanctifieront » sont conservés.
