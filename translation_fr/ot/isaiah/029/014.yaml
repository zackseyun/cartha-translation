source:
  edition: WLC
  text: לָ/כֵ֗ן הִנְ/נִ֥י יוֹסִ֛ף לְ/הַפְלִ֥יא אֶת הָֽ/עָם הַ/זֶּ֖ה הַפְלֵ֣א וָ/פֶ֑לֶא וְ/אָֽבְדָה֙ חָכְמַ֣ת חֲכָמָ֔י/ו וּ/בִינַ֥ת נְבֹנָ֖י/ו תִּסְתַּתָּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/014.yaml
  text: Therefore[a], behold, I will again do something astonishing with this people—something astonishing and marvelous; and the wisdom of its wise men will perish, and the understanding of its discerning men will hide itself.
translation:
  language: fr
  text: 'C’est pourquoi, me voici : je vais encore faire des prodiges à l’égard de ce peuple, prodige sur prodige[a]. La sagesse de ses sages disparaîtra, et l’intelligence de ses hommes avisés se dérobera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « je continuerai de faire des prodiges à l’égard de ce peuple, prodige sur prodige ».'
    reason: La construction יוֹסִף לְהַפְלִיא peut indiquer une action renouvelée ou sa continuation; la répétition הַפְלֵא וָפֶלֶא intensifie l’idée de prodige.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence de l’accusation précédente.
- source_word: הִנְנִי
  choice: me voici
  rationale: Conserve la formule solennelle qui attire l’attention et marque l’intervention personnelle de Dieu.
- source_word: יוֹסִף לְהַפְלִיא
  choice: je vais encore accomplir … des choses prodigieuses
  rationale: יוֹסִף suivi de l’infinitif exprime ici une action renouvelée ou ajoutée; « accomplir des choses prodigieuses » rend le caractère extraordinaire de פלא dans un français naturel.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Respecte le singulier collectif et la formule prophétique.
- source_word: הַפְלֵא וָפֶלֶא
  choice: prodige sur prodige
  rationale: Restitue l’intensification et la répétition du même groupe lexical hébreu sans les aplanir.
- source_word: וְאָבְדָה חָכְמַת חֲכָמָיו
  choice: La sagesse de ses sages disparaîtra
  rationale: Le parfait dans ce contexte prophétique annonce le résultat futur; « disparaîtra » exprime clairement la perte de cette sagesse.
- source_word: וּבִינַת נְבֹנָיו
  choice: l’intelligence de ses hommes avisés
  rationale: « Intelligence » traduit בינה et « hommes avisés » rend le masculin pluriel נבנים en conservant le parallélisme avec « ses sages ».
- source_word: תִּסְתַּתָּר
  choice: se dérobera
  rationale: Rend la nuance réfléchie du verbe et l’image selon laquelle l’intelligence devient introuvable, sans imposer un passif.
theological_decisions:
- issue: Description genrée des sages et des personnes avisées
  choice: ses sages / ses hommes avisés
  alternative: les sages / les personnes avisées de ce peuple
  rationale: Le second groupe est explicitement rendu au masculin, conformément aux formes masculines plurielles hébraïques désignant les sages ou dirigeants représentatifs; « ses sages » reste la formulation française la plus idiomatique.
- issue: Valeur du prodige annoncé
  choice: 'Formulation non interprétative : « des choses prodigieuses, prodige sur prodige »'
  alternative: Préciser qu’il s’agit d’un jugement extraordinaire
  rationale: Le contexte suggère le jugement, mais le verset lui-même souligne surtout le caractère extraordinaire de l’action divine; la traduction préserve cette tension sans ajouter l’interprétation.
- issue: Rapport entre יוֹסִף et l’action prodigieuse
  choice: je vais encore accomplir
  alternative: je continuerai d’agir de façon prodigieuse
  rationale: « Encore » conserve la possibilité d’une nouvelle intervention, tandis que la note signale l’autre analyse possible, celle de la continuation ou de l’accumulation.
translation_notes:
  register: Français moderne, international et digne. Le rythme en deux phrases préserve la solennité prophétique. « Me voici » garde la force déictique sans l’archaïsme de « voici que », et « prodige sur prodige » reproduit l’insistance poétique de l’hébreu.
