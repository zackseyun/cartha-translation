  text: וַ/תְּהִ֨י לָ/כֶ֜ם חָז֣וּת הַ/כֹּ֗ל כְּ/דִבְרֵי֮ הַ/סֵּ֣פֶר הֶֽ/חָתוּם֒ אֲשֶֽׁר יִתְּנ֣וּ אֹת֗/וֹ אֶל יוֹדֵ֥עַ ה/ספר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַר֙ לֹ֣א אוּכַ֔ל כִּ֥י חָת֖וּם הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/011.yaml
  text: And the vision of all this has become to you like the words of a sealed scroll[a], which they give to one who knows writing, saying, “Please read this,” and he says, “I cannot, because it is sealed.”
translation:
  language: fr
  text: 'Et la vision de tout cela est devenue pour vous comme les paroles d’un rouleau scellé qu’on remet à quelqu’un qui sait lire[a], en lui disant : « Lis ceci, s’il te plaît. » Il répond : « Je ne peux pas, car il est scellé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quelqu’un qui connaît le livre/l’écrit » ; c’est-à-dire une personne capable de lire.'
    reason: La traduction rend le sens idiomatique de l’expression hébraïque tout en signalant sa formulation littérale.
lexical_decisions:
- source_word: חָזוּת הַכֹּל
  choice: toute cette vision
  rationale: חָזוּת désigne ici la vision ou révélation prophétique, et הַכֹּל en indique la totalité. « Toute cette vision » est naturel en français et reste proche de la syntaxe hébraïque.
- source_word: כְּדִבְרֵי הַסֵּפֶר הֶחָתוּם
  choice: comme les paroles d’un rouleau scellé
  rationale: דִבְרֵי signifie « paroles » ou « contenu écrit »; סֵפֶר désigne dans ce contexte ancien un rouleau ou document écrit. « Rouleau scellé » conserve précisément l’image historique.
- source_word: יוֹדֵעַ הַסֵּפֶר
  choice: quelqu’un qui sait lire
  rationale: Littéralement, l’expression évoque quelqu’un « qui connaît l’écrit/le rouleau », mais son sens contextuel est celui d’une personne lettrée, capable de lire. La formulation choisie est claire et idiomatique en français.
- source_word: קְרָא נָא זֶה
  choice: Lis ceci, s’il te plaît
  rationale: נָא atténue l’impératif et marque une demande polie; « s’il te plaît » en restitue naturellement la nuance.
- source_word: לֹא אוּכַל
  choice: Je ne peux pas
  rationale: La réponse hébraïque exprime simplement l’incapacité sans répéter le verbe « lire »; le français conserve cette concision.
- source_word: וַתְּהִי לָכֶם
  choice: est devenue pour vous
  rationale: La construction décrit un état résultant qui concerne les destinataires. Le passé composé rend clairement cet effet présent en français moderne.
theological_decisions:
- issue: Métaphore d’une révélation devenue inaccessible
  choice: Conserver sans l’expliquer l’image du rouleau scellé
  alternative: Paraphraser la vision comme une parole de Dieu devenue incompréhensible
  rationale: Le texte communique son sens théologique par une comparaison concrète. La conserver évite de réduire l’ambiguïté entre impossibilité d’accéder au texte et incapacité de le comprendre.
translation_notes:
  register: Français international moderne, clair et digne. Les dialogues emploient le tutoiement, naturel entre interlocuteurs non spécifiés dans cette scène, et la métaphore du rouleau est maintenue sans ajout interprétatif.
