source:
  edition: WLC
  text: וְ/יָסְפ֧וּ עֲנָוִ֛ים בַּֽ/יהוָ֖ה שִׂמְחָ֑ה וְ/אֶבְיוֹנֵ֣י אָדָ֔ם בִּ/קְד֥וֹשׁ יִשְׂרָאֵ֖ל יָגִֽילוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/019.yaml
  text: The humble will again increase their joy in Yahweh[b][a], and the poor among mankind will rejoice in the Holy One of Israel.
translation:
  language: fr
  text: Les humbles auront en Yahvé une joie toujours plus grande[a], et les pauvres parmi les humains[b] se réjouiront dans le Saint d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Les humbles éprouveront de nouveau de la joie en Yahvé. » Le verbe hébreu signifie littéralement « ajouter » ou « augmenter » et peut ici exprimer soit un nouvel accroissement, soit le retour de la joie.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les pauvres de l’être humain ». Le mot hébreu désigne ici les êtres humains en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָסְפוּ ... שִׂמְחָה
  choice: auront ... une joie toujours plus grande
  rationale: Cette formulation française naturelle conserve l’idée d’ajout ou d’accroissement portée par יסף ainsi que le nom distinct « joie », sans attribuer artificiellement aux humbles l’action de faire croître eux-mêmes leur joie.
- source_word: עֲנָוִים
  choice: les humbles
  rationale: Le terme peut désigner des personnes humbles, douces ou socialement abaissées. « Les humbles » préserve sa portée morale et spirituelle sans exclure la situation de faiblesse évoquée par le parallélisme.
- source_word: בַּיהוָה
  choice: en Yahvé
  rationale: La préposition marque ici l’objet ou la sphère de la joie. « Yahvé » rend directement le nom divin יהוה.
- source_word: וְאֶבְיוֹנֵי אָדָם
  choice: les pauvres parmi les humains
  rationale: אֶבְיוֹן désigne le pauvre ou l’indigent, tandis que אָדָם a ici un sens humain générique. La formulation évite de limiter le groupe aux hommes de sexe masculin.
- source_word: בִּקְדוֹשׁ יִשְׂרָאֵל
  choice: dans le Saint d’Israël
  rationale: La traduction maintient le parallélisme avec « en Yahvé » et conserve sans paraphrase le titre divin caractéristique d’Ésaïe.
- source_word: יָגִילוּ
  choice: se réjouiront
  rationale: Le verbe exprime une joie vive, voire l’exultation. « Se réjouiront » est clair en français moderne tout en restant digne et adapté au parallélisme poétique.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le SEIGNEUR
  rationale: Le texte hébreu emploie directement le tétragramme. « Yahvé » rend le nom propre divin au lieu de lui substituer un titre.
- issue: Sens générique de אָדָם
  choice: les humains
  alternative: l’humanité
  rationale: Dans cette construction, אָדָם renvoie aux êtres humains en général, non aux seuls hommes. « Les humains » garde cette valeur collective tout en s’intégrant naturellement à la phrase.
- issue: Valeur de la préposition ב avec la joie
  choice: en Yahvé / dans le Saint d’Israël
  alternative: à cause de Yahvé / à cause du Saint d’Israël
  rationale: La traduction retenue préserve la possibilité que Dieu soit à la fois l’objet et la sphère de la joie, sans réduire la préposition à une simple relation causale.
translation_notes:
  register: Français international moderne, poétique et digne. Le premier membre est reformulé avec naturel pour conserver à la fois le verbe d’accroissement et le nom « joie ». Le parallélisme des deux membres ainsi que le titre « le Saint d’Israël » sont maintenus.
