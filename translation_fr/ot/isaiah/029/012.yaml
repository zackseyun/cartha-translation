source:
  edition: WLC
  text: וְ/נִתַּ֣ן הַ/סֵּ֗פֶר עַל֩ אֲשֶׁ֨ר לֹֽא יָדַ֥ע סֵ֛פֶר לֵ/אמֹ֖ר קְרָ֣א נָא זֶ֑ה וְ/אָמַ֕ר לֹ֥א יָדַ֖עְתִּי סֵֽפֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/012.yaml
  text: And the book is given to one who does not know writing, saying, “Please read this,” and he says, “I do not know writing.”
translation:
  language: fr
  text: 'Puis on donne le document à quelqu’un qui ne sait pas lire, en lui disant : « S’il te plaît, lis ceci. » Il répond : « Je ne sais pas lire. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַסֵּפֶר (hasséfer)
  choice: le document
  rationale: Dans ce contexte, סֵפֶר désigne l’écrit remis à quelqu’un, déjà présenté au verset précédent comme scellé. « Document » rend mieux cette réalité concrète que le moderne « livre ».
- source_word: לֹא יָדַע סֵפֶר / לֹא יָדַעְתִּי סֵפֶר
  choice: qui ne sait pas lire / Je ne sais pas lire
  rationale: L’expression hébraïque signifie littéralement « ne pas connaître l’écrit/les lettres », mais désigne naturellement l’incapacité à lire. La même formulation est conservée dans les deux occurrences.
- source_word: קְרָא נָא זֶה
  choice: Lis donc ceci, je t’en prie !
  rationale: L’impératif קְרָא signifie « lis »; la particule נָא donne à la demande une nuance pressante ou polie, rendue ici par « je t’en prie ».
theological_decisions:
- issue: Nature de l’incapacité du second destinataire
  choice: Une incapacité à lire
  alternative: Une ignorance de l’écriture ou des lettres
  rationale: 'Le contraste avec le destinataire du verset 11 repose sur deux obstacles différents : le premier sait lire, mais le document est scellé; le second ne sait pas lire. Cette lecture découle directement du contexte et ne dépend d’aucune interprétation confessionnelle.'
translation_notes:
  register: Français international moderne, naturel et digne. La tournure impersonnelle « on donne » restitue le passif hébreu sans alourdir la phrase. Le dialogue direct demeure simple et oral.
