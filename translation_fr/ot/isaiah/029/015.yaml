base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/015.yaml
  text: Woe to those who go deep to hide counsel from Yahweh[a], whose deeds are in darkness, and who say, “Who sees us[b], and who knows us?”
translation:
  language: fr
  text: 'Malheur à ceux qui vont très loin[a] pour cacher un projet à Yahweh, dont les actes sont dans les ténèbres et qui disent : « Qui nous voit ? Qui nous connaît ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui creusent profond ». L’hébreu évoque le fait d’aller ou d’agir en profondeur afin de dissimuler leur dessein.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Cette formule conserve la force de dénonciation et de jugement de l’interjection prophétique.
- source_word: הַמַּעֲמִיקִים
  choice: ceux qui s’enfoncent
  rationale: Le verbe évoque le fait d’aller en profondeur; « s’enfoncent » garde cette image tout en suggérant naturellement la recherche du secret.
- source_word: מֵיהוָה לַסְתִּר עֵצָה
  choice: pour cacher un projet à Yahweh
  rationale: La préposition indique que le projet est dissimulé à Yahweh. « Projet » rend ici le sens contextuel de עֵצָה, une décision ou un plan délibéré.
- source_word: בְמַחְשָׁךְ מַעֲשֵׂיהֶם
  choice: dont les actes sont dans les ténèbres
  rationale: La formulation conserve la métaphore concrète des ténèbres, avec ses connotations de secret et de mal.
- source_word: מִי רֹאֵנוּ וּמִי יוֹדְעֵנוּ
  choice: Qui nous voit ? Qui nous connaît ?
  rationale: Cette traduction garde les deux questions brèves et leur formulation volontairement concise, sans expliciter ce que signifie ici « connaître ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte hébreu emploie directement le tétragramme; « Yahweh » le rend comme nom propre sans le remplacer par un titre.
- issue: Portée de « connaître » dans la dernière question
  choice: Qui nous connaît ?
  alternative: Qui sait ce que nous faisons ?
  rationale: Le texte peut impliquer la connaissance de leurs agissements, mais sa formulation porte littéralement sur les personnes. La traduction préserve cette concision et sa tension.
translation_notes:
  register: Français international moderne, sobre et prophétique. La syntaxe reste proche de l’hébreu tout en étant naturelle; l’image de la profondeur et celle des ténèbres sont conservées.
