  edition: WLC
  text: הִתְמַהְמְה֣וּ וּ/תְמָ֔הוּ הִשְׁתַּֽעַשְׁע֖וּ וָ/שֹׁ֑עוּ שָֽׁכְר֣וּ וְ/לֹא יַ֔יִן נָע֖וּ וְ/לֹ֥א שֵׁכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/009.yaml
  text: Be stunned and be astonished[a]; blind yourselves and be blind. They are drunk, but not with wine; they stagger[b], but not from strong drink.
translation:
  language: fr
  text: Restez interdits et soyez stupéfaits[a] ; aveuglez-vous et soyez aveugles[b] ! Ils sont ivres, mais non de vin ; ils titubent, mais non sous l’effet d’une boisson enivrante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Attardez-vous et soyez stupéfaits ». Les deux premiers impératifs peuvent exprimer aussi bien l’hésitation dans le désarroi que la stupeur.
    reason: lexical_alternative
  - marker: b
    text: Les deux verbes hébreux de ce membre sont rares et difficiles ; ils peuvent évoquer l’aveuglement ou l’hébétude.
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְמַהְמְהוּ
  choice: Restez interdits
  rationale: La forme réfléchie ou intransitive peut évoquer le fait de s’attarder, d’hésiter ou de demeurer frappé de stupeur. Dans ce parallélisme, « restez interdits » exprime naturellement le désarroi stupéfait sans réduire le verbe à un simple retard temporel.
- source_word: וּתְמָהוּ
  choice: et soyez stupéfaits
  rationale: L’impératif exprime l’étonnement profond, la consternation ou la stupeur et renforce le premier membre du parallélisme.
- source_word: הִשְׁתַּעַשְׁעוּ
  choice: aveuglez-vous
  rationale: Dans ce contexte, ce verbe rare est traditionnellement rattaché à l’idée d’aveuglement ou d’hébétude plutôt qu’à celle de plaisir. La forme pronominale française garde la nuance réfléchie de l’impératif.
- source_word: וָשֹׁעוּ
  choice: et soyez aveugles
  rationale: Ce second verbe rare prolonge le parallélisme dans le champ de l’aveuglement ou de l’hébétude. La formulation concise conserve la force poétique.
- source_word: שָׁכְרוּ
  choice: Ils sont ivres
  rationale: Le parfait masculin pluriel décrit vivement leur état après la série d’impératifs. Le présent français rend cette condition actuelle sans transformer le verbe en ordre.
- source_word: וְלֹא יַיִן
  choice: mais ce n’est pas de vin
  rationale: La proposition nie que le vin soit la cause de leur ivresse, ce qui maintient l’image métaphorique sans l’expliciter davantage.
- source_word: נָעוּ
  choice: ils titubent
  rationale: Le verbe désigne le balancement ou la démarche chancelante. « Titubent » est naturel en français et convient à l’image de l’ivresse.
- source_word: וְלֹא שֵׁכָר
  choice: mais ce n’est pas à cause d’une boisson enivrante
  rationale: שֵׁכָר désigne une boisson alcoolisée distincte du vin. « Boisson enivrante » est clair en français international et évite l’idée moderne, trop étroite, d’un alcool nécessairement très fort.
theological_decisions:
- issue: Nature des images d’ivresse et d’aveuglement
  choice: Conserver l’ivresse et l’aveuglement comme images d’un état non causé par une boisson, sans en préciser explicitement la nature spirituelle dans le texte.
  alternative: Rendre l’état comme une ivresse littérale ou ajouter une interprétation telle que « endurcissement envoyé par Dieu ».
  rationale: Le verset exclut lui-même le vin et la boisson enivrante comme causes, mais ne formule pas encore une explication doctrinale complète. La traduction préserve donc la tension et laisse le contexte l’interpréter.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme en deux paires d’impératifs, puis en deux descriptions parallèles, reproduit la structure poétique hébraïque. Les marqueurs [a] et [b] sont placés auprès des groupes de verbes qu’ils éclairent.
