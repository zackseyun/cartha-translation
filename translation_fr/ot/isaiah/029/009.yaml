  naturalness: 'La formulation « Ils sont ivres, mais ce n’est pas de vin » n’est pas naturelle en français : « ce n’est pas de vin » décrit l’identité d’une chose, plutôt que la cause ou la matière de l’ivresse. Une construction elliptique et idiomatique, « mais non de vin », restitue exactement le parallélisme hébreu. De même, « non sous l’effet d’une boisson enivrante » exprime naturellement la relation causale sous-entendue.'
  terminology: « Interdits », « stupéfaits », « aveugles », « ivres » et « titubent » sont appropriés dans un registre poétique moderne. « Boisson enivrante » convient pour שֵׁכָר et évite de réduire ce terme à une catégorie moderne précise de spiritueux.
