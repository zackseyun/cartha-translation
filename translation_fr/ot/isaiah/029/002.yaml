  text: And I will distress Ariel[a], and there will be mourning and lamentation, and she will be to me like an altar hearth.
translation:
  language: fr
  text: Je mettrai Ariel[a] dans la détresse ; il y aura plaintes et lamentations, et elle sera pour moi comme un foyer de l’autel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le mot hébreu אֲרִיאֵל (« Ariel ») forme probablement ici un jeu de mots : la ville appelée Ariel sera semblable à un « foyer de l’autel ». La fin du verset peut aussi être traduite plus formellement : « elle sera pour moi comme Ariel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲצִיקוֹתִי
  choice: Je mettrai … dans la détresse
  rationale: Le hifil de צוק/ציק exprime l’idée de causer détresse, pression ou affliction. Cette formulation garde un sens assez large sans préciser indûment qu’il s’agit d’un siège, même si le contexte suivant est militaire.
- source_word: לַאֲרִיאֵל
  choice: Ariel
  rationale: Dans le contexte, אֲרִיאֵל sert de nom ou de désignation à Jérusalem. La translittération conserve ce nom et permet au jeu de mots de se déployer à la fin du verset.
- source_word: תַאֲנִיָּה וַאֲנִיָּה
  choice: plaintes et lamentations
  rationale: Les deux noms presque synonymes intensifient l’expression audible du deuil. Le couple français conserve ce parallélisme sans les réduire à une seule idée.
- source_word: וְהָיְתָה לִּי
  choice: elle deviendra pour moi
  rationale: Le féminin singulier renvoie vraisemblablement à Ariel, c’est-à-dire à Jérusalem personnifiée comme une ville. « Deviendra » exprime naturellement l’état résultant annoncé.
- source_word: כַּאֲרִיאֵל
  choice: comme un brasier d’autel
  rationale: La répétition de אֲרִיאֵל semble jouer sur le nom Ariel et sur son sens probable de foyer ou brasier d’autel. Traduire ici le sens lexical rend perceptibles l’ironie poétique et l’image sacrificielle.
theological_decisions:
- issue: Rendre le jeu de mots produit par la répétition de אֲרִיאֵל
  choice: Employer « Ariel » pour la ville, puis « brasier d’autel » pour le second emploi.
  alternative: 'Employer « Ariel » aux deux endroits : « elle deviendra pour moi comme Ariel ».'
  rationale: Le contexte identifie Ariel à Jérusalem, tandis que la dernière proposition paraît exploiter un autre sens du même terme. Le texte principal communique ce jeu de mots sans imposer une interprétation théologique supplémentaire, et la note préserve la lecture plus formelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Plaintes et lamentations » conserve le redoublement poétique ; le pronom féminin personnifie Jérusalem. La ponctuation met en relief la progression entre détresse, deuil et image finale.
