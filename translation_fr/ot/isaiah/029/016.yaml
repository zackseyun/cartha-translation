    issue: « pour que » introduit une nuance de finalité.
    rationale: La construction française peut faire entendre que le potier serait assimilé à l’argile dans le but de permettre la parole de l’ouvrage. Le texte formule plutôt une conséquence absurde dans le cadre de la question rhétorique.
  - severity: low
    issue: La note de bas de page ne formule pas précisément l’alternative littérale de l’expression initiale.
    rationale: L’alternative concerne הַפְכְּכֶם (« votre renversement / votre bouleversement »), non la question entière sur le potier et l’argile.
