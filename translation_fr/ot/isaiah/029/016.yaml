source:
  edition: WLC
  text: הַ֨פְכְּ/כֶ֔ם אִם כְּ/חֹ֥מֶר הַ/יֹּצֵ֖ר יֵֽחָשֵׁ֑ב כִּֽי יֹאמַ֨ר מַעֲשֶׂ֤ה לְ/עֹשֵׂ֨/הוּ֙ לֹ֣א עָשָׂ֔/נִי וְ/יֵ֛צֶר אָמַ֥ר לְ/יוֹצְר֖/וֹ לֹ֥א הֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/016.yaml
  text: You turn things upside down! Shall the potter be regarded as clay[a], that what is made should say of its maker, “He did not make me,” and what is formed say of the one who formed it, “He has no understanding”?
translation:
  language: fr
  text: 'Quel renversement de votre part ! Le potier doit-il être considéré comme l’argile[a], de sorte que l’ouvrage dise de celui qui l’a fait : « Il ne m’a pas fait », et que ce qui a été façonné dise de celui qui l’a façonné : « Il ne comprend pas » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « Votre renversement ! » Certains comprennent : « Quelle perversité de votre part ! »'
    reason: L’expression hébraïque initiale est elliptique et discutée ; la note préserve l’alternative lexicale sans modifier le lien rhétorique avec la comparaison du potier et de l’argile.
lexical_decisions:
- source_word: הַפְכְּכֶם
  choice: Quel renversement de votre part !
  rationale: Le nom construit sur הפך avec suffixe de deuxième personne du pluriel forme ici une exclamation elliptique. Cette formulation française conserve le reproche et l’idée d’un ordre inversé sans réduire le terme au seul sens moral de « perversité ».
- source_word: אִם
  choice: doit-il
  rationale: אִם introduit ici une question rhétorique plutôt qu’une simple condition. « Doit-il » exprime naturellement l’absurdité dénoncée.
- source_word: כְּחֹמֶר
  choice: comme l’argile
  rationale: חֹמֶר désigne l’argile travaillée par le potier. Le terme maintient l’image concrète du texte.
- source_word: הַיֹּצֵר
  choice: le potier
  rationale: Le participe de יצר peut désigner celui qui façonne ; associé à l’argile, il évoque concrètement le potier.
- source_word: יֵחָשֵׁב
  choice: être considéré
  rationale: Le nifal de חשב signifie ici « être tenu pour, être considéré comme ».
- source_word: מַעֲשֶׂה
  choice: l’ouvrage
  rationale: Dans l’opposition entre celui qui fait et ce qui est fait, מַעֲשֶׂה désigne le produit réalisé. « L’ouvrage » est naturel et préserve cette relation.
- source_word: לְעֹשֵׂהוּ
  choice: de celui qui l’a fait
  rationale: Après אמר, le ל peut introduire la personne visée par la parole. La tournure « dire de » convient au contenu accusateur de la citation.
- source_word: עָשָׂנִי
  choice: Il ne m’a pas fait
  rationale: Le parfait exprime l’action accomplie que l’ouvrage nie ; le passé composé est idiomatique en français moderne.
- source_word: יֵצֶר
  choice: ce qui a été façonné
  rationale: Le nom désigne le produit façonné et forme un parallèle avec מַעֲשֶׂה. La voix passive rend clairement la relation avec celui qui façonne.
- source_word: לְיוֹצְרוֹ
  choice: de celui qui l’a façonné
  rationale: Cette formulation maintient le parallélisme verbal fondé sur יצר et évite de limiter nécessairement le second membre au métier de potier.
- source_word: הֵבִין
  choice: Il n’y comprend rien
  rationale: Le hifil de בין signifie comprendre ou discerner. Cette expression française actuelle rend l’accusation d’incompétence ou d’absence d’intelligence sans la surinterpréter.
theological_decisions:
- issue: Métaphore du potier et de l’argile
  choice: Conserver explicitement « le potier » et « l’argile ».
  alternative: Employer les termes abstraits « le créateur » et « la création », ou le plus littéral « celui qui façonne » dès le premier membre.
  rationale: La force du verset repose sur l’inversion absurde entre l’artisan et la matière. L’image concrète est préservée sans ajouter de formulation doctrinale étrangère au texte.
- issue: Exclamation initiale
  choice: « Quel renversement de votre part ! »
  alternative: « Quelle perversité ! » ou « Vous renversez tout ! »
  rationale: L’hébreu est elliptique et peut être compris comme une exclamation nominale ou comme un reproche portant sur la conduite. La traduction retenue garde l’ambiguïté entre acte de renversement et attitude fautive, tandis que la note signale les principales possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre l’ouvrage et ce qui est façonné est maintenu, ainsi que le ton vif de la question rhétorique.
