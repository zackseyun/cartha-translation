source:
  edition: WLC
  text: מֵ/עִ֨ם יְהוָ֤ה צְבָאוֹת֙ תִּפָּקֵ֔ד בְּ/רַ֥עַם וּ/בְ/רַ֖עַשׁ וְ/ק֣וֹל גָּד֑וֹל סוּפָה֙ וּ/סְעָרָ֔ה וְ/לַ֖הַב אֵ֥שׁ אוֹכֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/006.yaml
  text: From Yahweh of hosts you will be visited with thunder and with earthquake and a great noise[a], with whirlwind and storm[c][b], and with the flame of a consuming fire.
translation:
  language: fr
  text: Tu recevras la visite de Yahweh des armées[a], avec tonnerre, tremblement de terre[b] et grand fracas[c], avec tourbillon et tempête, et avec la flamme d’un feu dévorant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu subiras un châtiment ». Le verbe hébreu signifie littéralement « être visité » et peut désigner une intervention divine favorable ou judiciaire ; ici, le contexte évoque un jugement.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec une secousse » ou « avec un tremblement ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « un grand bruit » ; ou « un son puissant ».
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִם
  choice: de Yahweh
  rationale: Avec le nifal de פקד, מֵעִם indique la provenance ou l’auteur de l’intervention. La tournure française « recevoir la visite de » exprime naturellement cette relation.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh des armées
  rationale: Le nom divin est translittéré « Yahweh », et צְבָאוֹת est conservé dans le titre traditionnel au sens large d’armées ou de puissances célestes, sans en restreindre le référent.
- source_word: תִּפָּקֵד
  choice: tu recevras la visite
  rationale: Le nifal de פקד peut désigner une intervention divine favorable ou judiciaire. Cette formulation française conserve l’image de la visite, tandis que le contexte menaçant fait entendre le jugement sans l’inscrire explicitement dans le verbe.
- source_word: בְּרַעַם
  choice: dans le tonnerre
  rationale: La préposition ב introduit ici les manifestations qui accompagnent l’intervention divine. « Dans le tonnerre » garde la force théophanique de l’image.
- source_word: וּבְרַעַשׁ
  choice: dans un tremblement de terre
  rationale: רַעַשׁ peut désigner une secousse ou un tremblement de terre. Dans cette série de phénomènes violents, le sens concret de « tremblement de terre » convient au contexte.
- source_word: וְקוֹל גָּדוֹל
  choice: et dans un grand fracas
  rationale: קוֹל désigne ici un bruit ou un son, non nécessairement une voix. « Grand fracas » rend à la fois l’intensité et le caractère menaçant du phénomène.
- source_word: סוּפָה וּסְעָרָה
  choice: dans le tourbillon et la tempête
  rationale: Les deux termes sont rendus distinctement afin de préserver l’accumulation poétique des images de vents violents.
- source_word: וְלַהַב אֵשׁ אוֹכֵלָה
  choice: et dans la flamme d’un feu dévorant
  rationale: La formulation conserve la flamme et le participe « dévorant », qui personnifie la puissance destructrice du feu.
theological_decisions:
- issue: Nature de l’intervention exprimée par פקד
  choice: 'Conserver l’image ambiguë de la visite : « tu recevras la visite »'
  alternative: « tu seras punie » ou « il te demandera des comptes »
  rationale: Le contexte indique un jugement, mais le verbe hébreu possède une portée plus large. La traduction retenue préserve cette tension sémantique sans masquer la menace portée par les images qui suivent.
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: « le Seigneur » ou « Jéhovah »
  rationale: La translittération rend visible le nom personnel présent dans le texte hébreu, au lieu de lui substituer un titre.
translation_notes:
  register: Français international actuel, solennel mais accessible. La répétition de « dans » reproduit le rythme cumulatif des manifestations divines sans alourdir excessivement la phrase. Le tutoiement singulier correspond à l’adresse hébraïque à Ariel/Jérusalem.
