- from: Tu recevras la visite de Yahweh des armées[a], dans le tonnerre, dans un tremblement de terre[b] et dans un grand fracas[c], dans le tourbillon et la tempête, et dans la flamme d’un feu dévorant.
  to: Tu recevras la visite de Yahweh des armées[a], avec tonnerre, tremblement de terre[b] et grand fracas[c], avec tourbillon et tempête, et avec la flamme d’un feu dévorant.
  rationale: La révision remplace « dans » par « avec » afin de refléter plus exactement la valeur des prépositions hébraïques dans cette énumération de phénomènes qui accompagnent la visitation. Elle conserve l’idiome de la visitation, le nom Yahweh, le titre « des armées » et la force poétique de la liste, sans transformer explicitement le verbe en condamnation.
