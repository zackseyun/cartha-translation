  naturalness: « Tu recevras la visite de » est une conservation recevable de l’idiome de visitation; la phrase devient plus naturelle et plus précise avec « avec », qui rend l’accompagnement sans donner l’impression d’être à l’intérieur des phénomènes.
  terminology: « Yahweh des armées » conserve le nom divin et le titre צבאות. « Feu dévorant » restitue de façon claire אֵשׁ אֹכֵלָה. Les notes préservent l’alternative judiciaire sans la substituer au texte.
