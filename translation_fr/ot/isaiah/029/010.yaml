  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי נָסַ֨ךְ עֲלֵי/כֶ֤ם יְהוָה֙ ר֣וּחַ תַּרְדֵּמָ֔ה וַ/יְעַצֵּ֖ם אֶת עֵֽינֵי/כֶ֑ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת רָאשֵׁי/כֶ֥ם הַ/חֹזִ֖ים כִּסָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/010.yaml
  text: For Yahweh has poured out on you a spirit of deep sleep[b][a], and has shut your eyes—the prophets—and covered your heads—the seers.
translation:
  language: fr
  text: Car Yahweh a répandu sur vous un esprit de profond sommeil[a] ; il a fermé vos yeux — les prophètes — et couvert vos têtes — les voyants[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de torpeur ». Le terme hébreu peut désigner un profond sommeil ou un état d’hébétude.
    reason: lexical_alternative
  - marker: b
    text: La syntaxe hébraïque identifie probablement « les prophètes » à « vos yeux » et « les voyants » à « vos têtes ». Une autre analyse comprend « les prophètes » et « les voyants » comme des compléments distincts des verbes ; la construction précise demeure difficile.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici l’explication du jugement décrit dans le contexte précédent.
- source_word: נָסַךְ
  choice: a répandu
  rationale: Conserve l’image concrète d’une condition que Yahweh déverse sur le peuple.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: רוּחַ תַּרְדֵּמָה
  choice: un esprit de profond sommeil
  rationale: « Esprit » convient à l’état intérieur imposé, et « profond sommeil » rend directement תַּרְדֵּמָה sans effacer sa possible nuance de torpeur.
- source_word: וַיְעַצֵּם אֶת עֵינֵיכֶם
  choice: il a fermé vos yeux
  rationale: Préserve l’image de la fermeture des yeux sans expliciter excessivement par « aveuglé ».
- source_word: אֶת הַנְּבִיאִים
  choice: les prophètes
  rationale: Compris comme une apposition à « vos yeux », selon le parallélisme probable du verset.
- source_word: רָאשֵׁיכֶם
  choice: vos têtes
  rationale: Maintient l’image hébraïque et son parallélisme avec « vos yeux », plutôt que de l’interpréter comme « vos chefs ».
- source_word: הַחֹזִים
  choice: les voyants
  rationale: Terme prophétique distinct de « prophètes », rendu par son équivalent français courant dans le registre biblique.
- source_word: כִּסָּה
  choice: couvert
  rationale: Conserve l’action et le parallélisme imagé avec la fermeture des yeux.
theological_decisions:
- issue: Action judiciaire de Yahweh
  choice: Attribuer directement à Yahweh le déversement du profond sommeil ainsi que la fermeture et la couverture des organes prophétiques du peuple.
  alternative: 'Employer une formulation permissive, par exemple : « Yahweh a laissé venir sur vous… »'
  rationale: Les verbes hébreux présentent Yahweh comme l’auteur direct de ces actions. La traduction conserve cette tension théologique sans l’atténuer.
- issue: Rapport syntaxique entre les yeux, les prophètes, les têtes et les voyants
  choice: Lire « les prophètes » et « les voyants » comme des appositions respectives à « vos yeux » et « vos têtes ».
  alternative: 'Les comprendre comme des compléments d’objet distincts : « il a fermé les prophètes et couvert vos têtes, les voyants ».'
  rationale: La lecture appositionnelle rend le mieux le parallélisme et l’image selon laquelle les prophètes sont les yeux du peuple et les voyants ses têtes, tout en signalant l’autre analyse possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule clarifie les deux volets du jugement, tandis que les tirets rendent visibles les appositions difficiles de l’hébreu. Les marqueurs suivent les expressions précises qu’ils expliquent.
