review_pass:
  verdict: revise
  source_fidelity: Le sens général et la structure ternaire sont bien rendus. « Car », « l’homme impitoyable », « le moqueur », « n’existera plus » et « seront retranchés » correspondent de façon adéquate à l’hébreu. Toutefois, « guettent l’occasion de faire le mal » explicite indûment un complément d’occasion et l’idée qu’ils commettent eux-mêmes le mal. שֹׁקְדֵי אָוֶן signifie plus sobrement ceux qui veillent/guettent le mal ou l’iniquité; le contexte peut suggérer une vigilance malveillante sans que son objet précis soit formulé.
  naturalness: Le français est naturel et d’un registre biblique moderne approprié. « Guettent le mal » est plus concis et préserve mieux le parallélisme, tout en évitant l’explicitation interprétative de « l’occasion de faire ».
  terminology: « Retranchés » conserve utilement la force judiciaire de וְנִכְרְתוּ. « Moqueur » rend bien לֵץ. La note sur עָרִיץ est appropriée. La note finale doit éviter de présenter « s’appliquent au mal » comme une équivalence simple du participe, car elle atténue l’idée de vigilance.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « guettent l’occasion de faire le mal »
    rationale: Le texte hébreu dit littéralement « ceux qui veillent/guettent le mal (אָוֶן) » et ne mentionne ni « occasion » ni explicitement l’accomplissement du mal par ces personnes. La formulation proposée réduit une ambiguïté que le texte ne résout pas.
  - severity: low
    issue: Note b à resserrer
    rationale: « S’appliquent au mal » peut évoquer principalement la pratique du mal, alors que שֹׁקְדֵי met d’abord en relief une attention vigilante et soutenue. Une formulation fondée sur « à l’affût » ou « guettent » est plus fidèle.
  revised_text: Car l’homme impitoyable disparaîtra[a], le moqueur n’existera plus, et tous ceux qui guettent le mal seront retranchés[b].
