lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de la promesse précédente et convient naturellement à l’enchaînement du discours.
- source_word: אָפֵס
  choice: disparaîtra
  rationale: Exprime la cessation ou la fin complète, avec une valeur future adaptée au contexte.
- source_word: עָרִיץ
  choice: l’homme impitoyable
  rationale: Désigne une personne violente ou oppressive; cette formulation conserve le singulier sans limiter le terme à un dirigeant politique.
- source_word: וְכָלָה
  choice: n’existera plus
  rationale: Rend l’idée d’arriver à son terme ou de cesser, dans un français naturel, sans préciser davantage le mode de disparition.
- source_word: לֵץ
  choice: le moqueur
  rationale: Désigne celui qui raille avec arrogance et mépris; « moqueur » est clair et courant.
- source_word: וְנִכְרְתוּ
  choice: seront retranchés
  rationale: Conserve l’image de כרת et sa portée judiciaire, sans la réduire nécessairement à une destruction physique.
- source_word: כָּל
  choice: tous
  rationale: Rend directement la valeur collective du terme.
- source_word: שֹׁקְדֵי
  choice: ceux qui guettent l’occasion de
  rationale: Le participe évoque une attention vigilante et délibérée; la formulation française explicite qu’ils sont à l’affût d’une occasion liée au mal.
- source_word: אָוֶן
  choice: faire le mal
  rationale: Dans ce contexte moral, le mot désigne le mal ou l’iniquité; cette expression est claire en français moderne.
