revisions:
- from: Car l’homme impitoyable disparaîtra[a], le moqueur n’existera plus, et tous ceux qui guettent l’occasion de faire le mal seront retranchés[b].
  to: Car l’homme impitoyable disparaîtra[a], le moqueur n’existera plus, et tous ceux qui guettent le mal seront retranchés[b].
  rationale: La révision retire l’ajout « l’occasion de faire », qui précisait le rôle des personnes au-delà de l’hébreu. « Guettent le mal » maintient l’image de vigilance de שֹׁקְדֵי et laisse ouverte la nuance contextuelle. Les autres choix sont conservés.
  reviewer_model: gpt-5.6-terra
