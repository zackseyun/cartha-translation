id: ISA.29.18
reference: Isaiah 29:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שָׁמְע֧וּ בַ/יּוֹם הַ/ה֛וּא הַ/חֵרְשִׁ֖ים דִּבְרֵי סֵ֑פֶר וּ/מֵ/אֹ֣פֶל וּ/מֵ/חֹ֔שֶׁךְ עֵינֵ֥י עִוְרִ֖ים תִּרְאֶֽינָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/018.yaml
  text: And on that day the deaf will hear the words of a book[a], and out of gloom and out of darkness the eyes of the blind will see.
translation:
  language: fr
  text: En ce jour-là, les sourds entendront les paroles d’un livre[a], et, sortant de l’obscurité et des ténèbres, les yeux des aveugles verront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les paroles du rouleau » ou « les paroles d’un document » ; le mot hébreu séfer peut désigner divers types de textes écrits.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ
  choice: entendront
  rationale: Dans ce contexte prophétique, la forme verbale exprime une action future; le futur simple est naturel en français.
- source_word: בַיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Rend naturellement l’expression temporelle prophétique tout en conservant son caractère marqué.
- source_word: הַחֵרְשִׁים
  choice: les sourds
  rationale: L’adjectif substantivé désigne des personnes sourdes; cette formulation est concise et idiomatique.
- source_word: דִּבְרֵי סֵפֶר
  choice: les paroles d’un livre
  rationale: Le construit signifie littéralement « paroles/mots d’un écrit »; « livre » est naturel, tandis qu’une note conserve l’étendue sémantique de סֵפֶר.
- source_word: וּמֵאֹפֶל וּמֵחֹשֶׁךְ
  choice: et, sortant de l’obscurité et des ténèbres
  rationale: La préposition מִן indique la provenance ou l’émergence. La formulation préserve les deux termes parallèles sans les réduire à un seul.
- source_word: עֵינֵי עִוְרִים
  choice: les yeux des aveugles
  rationale: Reproduit clairement la construction hébraïque et maintient l’image concrète.
- source_word: תִּרְאֶינָה
  choice: verront
  rationale: Le féminin pluriel s’accorde avec « yeux » en hébreu et annonce le rétablissement de la vue.
theological_decisions:
- issue: Guérison physique littérale ou image d’une restauration spirituelle
  choice: Conserver le vocabulaire sensoriel concret — « sourds », « aveugles », « entendront », « verront » — sans qualification interprétative.
  alternative: Expliciter une compréhension métaphorique en parlant d’intelligence ou de perception spirituelle.
  rationale: L’hébreu emploie des termes sensoriels concrets, mais leur contexte isaïen peut aussi leur donner une portée figurée. La traduction laisse subsister cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme poétique est conservé, avec une ponctuation qui rattache clairement la sortie de l’obscurité et des ténèbres au fait que les yeux voient.
