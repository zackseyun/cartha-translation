source:
  edition: WLC
  text: הֲ/לוֹא עוֹד֙ מְעַ֣ט מִזְעָ֔ר וְ/שָׁ֥ב לְבָנ֖וֹן לַ/כַּרְמֶ֑ל וְ/הַ/כַּרְמֶ֖ל לַ/יַּ֥עַר יֵחָשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/017.yaml
  text: Is it not yet a very little while[a], and Lebanon will turn into an orchard, and the orchard will be regarded as a forest?
translation:
  language: fr
  text: N’est-ce pas encore très peu de temps avant que le Liban ne se change en verger[a] et que le verger ne soit considéré comme une forêt ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « terre fertile » ou « terre cultivée ». Le mot hébreu désigne une terre fertile et cultivée.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: n’est-ce pas
  rationale: La particule introduit une question rhétorique qui appelle une réponse affirmative. La tournure française conserve cette force interrogative sans la réduire à une simple affirmation.
- source_word: עוֹד מְעַט מִזְעָר
  choice: encore très peu de temps
  rationale: La combinaison souligne l’extrême brièveté du délai. Cette formulation est naturelle en français et conserve l’intensification.
- source_word: וְשָׁב
  choice: se changera en
  rationale: Le verbe שׁוב exprime ici un changement d’état plutôt qu’un retour spatial. « Se changera en » rend clairement la transformation.
- source_word: לְבָנוֹן
  choice: le Liban
  rationale: Le nom géographique est conservé, avec l’article normalement employé en français.
- source_word: כַּרְמֶל
  choice: verger
  rationale: Ici, כַּרְמֶל désigne une terre fertile et cultivée, non le mont Carmel. « Verger » donne une image concrète et maintient le contraste avec la forêt, tandis qu’une note signale l’alternative plus générale.
- source_word: לַיַּעַר
  choice: comme une forêt
  rationale: Avec יֵחָשֵׁב, la préposition introduit ce pour quoi le verger sera tenu; « comme une forêt » est idiomatique en français.
- source_word: יֵחָשֵׁב
  choice: sera considéré
  rationale: Le nifal de חשׁב exprime ici le fait d’être tenu ou compté pour quelque chose. Le passif français préserve cette nuance évaluative.
theological_decisions:
- issue: Portée de l’image de transformation
  choice: Présenter le verset comme l’annonce rhétorique d’un renversement spectaculaire sans préciser si celui-ci est littéral, métaphorique ou les deux.
  alternative: Interpréter explicitement la transformation soit comme un changement agricole littéral, soit comme un renouveau social et spirituel métaphorique.
  rationale: L’hébreu annonce clairement un renversement et un renouvellement, mais le verset ne fixe pas à lui seul le niveau d’interprétation. La traduction conserve donc l’image et sa tension prophétique.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée, ainsi que le parallélisme et le contraste imagé entre terre cultivée et forêt.
