id: ISA.29.7
reference: Isaiah 29:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/הָיָ֗ה כַּֽ/חֲלוֹם֙ חֲז֣וֹן לַ֔יְלָה הֲמוֹן֙ כָּל הַ/גּוֹיִ֔ם הַ/צֹּבְאִ֖ים עַל אֲרִיאֵ֑ל וְ/כָל צֹבֶ֨י/הָ֙ וּ/מְצֹ֣דָתָ֔/הּ וְ/הַ/מְּצִיקִ֖ים לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/007.yaml
  text: And the multitude of all the nations that wage war against Ariel[a], even all who wage war against her and her stronghold, and who distress her, will be like a dream[c][b], a vision of the night.
translation:
  language: fr
  text: La multitude de toutes les nations qui font la guerre à Ariel[a] — tous ceux qui font la guerre contre elle et contre sa forteresse[b], ceux qui l’accablent — sera comme un rêve, comme une vision de la nuit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « Ariel » est le nom poétique que donne Ésaïe à Jérusalem.
    reason: cross_reference
  - marker: b
    text: 'Ou « sa place forte ». Certains comprennent plutôt : « les ouvrages de siège dressés contre elle ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « une vision nocturne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: sera
  rationale: Dans ce discours prophétique, la forme introduit le résultat à venir. Le futur français rend naturellement cette valeur sans archaïsme.
- source_word: כַּחֲלוֹם
  choice: comme un rêve
  rationale: Le préfixe כְּ marque une comparaison; cette formulation française conserve directement l’image.
- source_word: חֲזוֹן לַיְלָה
  choice: une vision de la nuit
  rationale: Cette expression proche de la construction hébraïque préserve le parallélisme poétique avec « un rêve » et reste intelligible en français moderne.
- source_word: הֲמוֹן כָּל הַגּוֹיִם
  choice: la multitude de toutes les nations
  rationale: הֲמוֹן désigne une foule ou une masse nombreuse, ici dans un contexte militaire; גּוֹיִם renvoie aux nations étrangères.
- source_word: הַצֹּבְאִים עַל
  choice: qui font la guerre à
  rationale: Le participe de צבא, avec עַל dans ce contexte, exprime une action militaire hostile. « Faire la guerre à » est courant et précis.
- source_word: אֲרִיאֵל
  choice: Ariel
  rationale: Le nom poétique est translittéré plutôt que remplacé par son référent; une note indique qu’il désigne Jérusalem dans ce contexte.
- source_word: וְכָל צֹבֶיהָ
  choice: tous ceux qui font la guerre contre elle
  rationale: Le suffixe féminin renvoie à Ariel. La répétition de « font la guerre » maintient le lien lexical avec le participe précédent.
- source_word: וּמְצֹדָתָהּ
  choice: et contre sa forteresse
  rationale: מְצוֹדָה désigne normalement une forteresse ou une place forte. Dans la syntaxe française, « contre » est répété afin de montrer que la forteresse est aussi l’objet de l’attaque.
- source_word: וְהַמְּצִיקִים לָהּ
  choice: tous ceux qui la mettent dans la détresse
  rationale: Le participe exprime le fait de serrer, d’accabler ou de causer la détresse. Cette traduction conserve une portée plus large qu’un terme limité au siège.
theological_decisions:
- issue: Référent d’« Ariel »
  choice: Conserver « Ariel » dans le texte et préciser en note qu’il s’agit ici du nom poétique de Jérusalem.
  alternative: Remplacer directement « Ariel » par « Jérusalem ».
  rationale: Le texte hébreu emploie אֲרִיאֵל. Garder ce nom préserve l’expression poétique d’Ésaïe sans intégrer son interprétation dans le corps du verset.
- issue: Rapport syntaxique de « sa forteresse »
  choice: 'Comprendre la forteresse d’Ariel comme un autre objet de l’attaque: « contre elle et contre sa forteresse ».'
  alternative: Comprendre l’expression comme désignant les ouvrages de siège dressés contre Ariel.
  rationale: Le nom מְצוֹדָה et son suffixe féminin singulier favorisent le sens de « sa forteresse », mais la formulation hébraïque permet une autre compréhension, signalée en note.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Les tirets isolent l’expansion du sujet, longue en hébreu, et rendent la phrase lisible tout en conservant son ampleur poétique. La répétition de « font la guerre » et de « contre » clarifie les rapports syntaxiques sans atténuer la solennité du verset.
