  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל בֵּ֣ית יַֽעֲקֹ֔ב אֲשֶׁ֥ר פָּדָ֖ה אֶת אַבְרָהָ֑ם לֹֽא עַתָּ֤ה יֵבוֹשׁ֙ יַֽעֲקֹ֔ב וְ/לֹ֥א עַתָּ֖ה פָּנָ֥י/ו יֶחֱוָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/029/022.yaml
  text: 'Therefore thus says Yahweh to the house of Jacob[a], he who redeemed Abraham: Jacob will no longer be ashamed[b], and his face will no longer grow pale.'
translation:
  language: fr
  text: 'C’est pourquoi, ainsi parle Yahweh, lui qui a racheté Abraham[a], au sujet de la maison de Jacob : « Jacob ne sera plus honteux[b], et son visage ne pâlira plus[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La proposition « qui a racheté Abraham » qualifie le plus naturellement Yahweh. Sa position dans l’hébreu a suscité des discussions sur son rattachement syntaxique.
    reason: ambiguïté syntaxique
  - marker: b
    text: 'Ou : « ne sera plus couvert de honte » ou « ne sera plus déshonoré ».'
    reason: alternative lexicale
  - marker: c
    text: Le verbe hébreu évoque le fait de devenir pâle ou blême, image de la honte ou de l’effroi.
    reason: précision lexicale
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien logique avec le contexte précédent.
- source_word: כֹּה אָמַר
  choice: voici ce que dit
  rationale: Formule prophétique idiomatique en français moderne, fidèle à la fonction de la tournure hébraïque.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אֶל בֵּית יַעֲקֹב
  choice: à la maison de Jacob
  rationale: Conserve l’image collective et dynastique de « maison » ainsi que la préposition du texte hébreu.
- source_word: אֲשֶׁר פָּדָה אֶת אַבְרָהָם
  choice: lui qui a racheté Abraham
  rationale: « Racheter » restitue la portée de פדה; la formulation rattache naturellement la proposition à Yahweh tout en signalant en note l’ambiguïté syntaxique.
- source_word: לֹא עַתָּה
  choice: Désormais … ne … plus
  rationale: Rend la valeur contextuelle d’un changement de situation plus naturellement que le littéral « pas maintenant ».
- source_word: יֵבוֹשׁ
  choice: n’aura plus honte
  rationale: Rend le sens courant de בוש sans imposer une cause extérieure à la honte.
- source_word: פָּנָיו יֶחֱוָרוּ
  choice: son visage ne pâlira plus
  rationale: Préserve l’image corporelle du visage qui devient pâle, associée ici à la honte ou à l’effroi.
theological_decisions:
- issue: Référent de la proposition « qui a racheté Abraham »
  choice: La proposition décrit Yahweh.
  alternative: Elle peut être comprise grammaticalement comme se rapportant à la maison de Jacob.
  rationale: Le sens contextuel le plus naturel présente Yahweh comme celui qui a racheté Abraham; une note conserve toutefois l’autre rattachement syntaxique possible.
translation_notes:
  register: Français international moderne, digne et accessible. La formule prophétique est rendue idiomatiquement; « maison de Jacob » et l’image du visage qui pâlit sont conservées pour maintenir la texture du texte hébreu.
