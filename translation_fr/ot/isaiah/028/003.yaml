  yaml_path: translation/ot/isaiah/028/003.yaml
  text: The proud crown of the drunkards of Ephraim will be trampled underfoot[a].
translation:
  language: fr
  text: 'Elle sera foulée aux pieds,

    la couronne d’orgueil des ivrognes d’Éphraïm.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרַגְלַיִם
  choice: aux pieds
  rationale: Avec le verbe « fouler », cette expression française naturelle conserve explicitement l’image des pieds et la valeur instrumentale de l’hébreu.
- source_word: תֵּרָמַסְנָה
  choice: elle sera foulée
  rationale: Le nifal imperfectif exprime ici une action passive à venir. « Sera foulée » rend directement le piétinement sans ajouter l’idée plus forte d’écrasement.
- source_word: עֲטֶרֶת
  choice: couronne
  rationale: « Couronne » conserve l’image poétique et convient au relief prestigieux de Samarie évoqué dans le contexte.
- source_word: גֵּאוּת
  choice: d’orgueil
  rationale: Le substantif français reproduit formellement le groupe nominal hébreu et en garde la force négative dans ce contexte.
- source_word: שִׁכּוֹרֵי
  choice: des ivrognes
  rationale: Le terme désigne ceux que caractérise l’ivresse. « Ivrognes » est clair, concis et actuel, tout en conservant la réprobation du texte.
- source_word: אֶפְרָיִם
  choice: Éphraïm
  rationale: Le nom propre est conservé plutôt que remplacé par son référent contextuel, le royaume du Nord.
theological_decisions:
- issue: Relation métaphorique dans עֲטֶרֶת גֵּאוּת
  choice: la couronne d’orgueil
  alternative: l’orgueilleuse couronne
  rationale: La formulation nominale préserve la structure et une possible nuance selon laquelle la couronne incarne ou manifeste l’orgueil, sans réduire d’emblée le rapport à une simple qualité adjectivale.
translation_notes:
  register: Registre poétique, digne et accessible. L’antéposition du prédicat « Elle sera foulée aux pieds » suit l’ordre emphatique de l’hébreu; le second vers identifie ensuite le sujet. Aucun marqueur de note n’est nécessaire.
