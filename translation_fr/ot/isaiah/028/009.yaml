  text: אֶת מִי֙ יוֹרֶ֣ה דֵעָ֔ה וְ/אֶת מִ֖י יָבִ֣ין שְׁמוּעָ֑ה גְּמוּלֵי֙ מֵֽ/חָלָ֔ב עַתִּיקֵ֖י מִ/שָּׁדָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/009.yaml
  text: Whom will he teach knowledge[a], and to whom will he explain the message? Those weaned from milk[b], those taken from the breasts?
translation:
  language: fr
  text: À qui enseignera-t-il la connaissance, et à qui fera-t-il comprendre[b] le message[a] ? À ceux qui sont sevrés du lait, à ceux qui sont éloignés des seins ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le récit », « ce qui est entendu » ou « l’annonce ».
    reason: lexical_alternative
  - marker: b
    text: L’hébreu ne précise pas le sujet de « enseignera » et de « fera comprendre » ; le contexte peut indiquer que les interlocuteurs parlent d’Ésaïe sur un ton moqueur.
    reason: alternative_reading
lexical_decisions:
- source_word: יוֹרֶה דֵעָה
  choice: enseignera-t-il la connaissance
  rationale: Le hiphil de ירה signifie couramment « enseigner, instruire », et דֵעָה désigne la connaissance. Le futur français convient à la question rhétorique tout en conservant la formulation du texte.
- source_word: יָבִין שְׁמוּעָה
  choice: fera-t-il comprendre le message
  rationale: Le hiphil de בין exprime l’action de faire comprendre. Cette formulation garde explicitement la valeur causative; שְׁמוּעָה peut désigner un message, un récit ou ce qui est entendu.
- source_word: גְּמוּלֵי מֵחָלָב
  choice: ceux qui viennent d’être sevrés
  rationale: גְּמוּלֵי désigne des êtres sevrés, et מן marque l’éloignement du lait. « Viennent d’être » rend naturellement l’idée de très jeunes enfants suggérée par le parallélisme.
- source_word: עַתִּיקֵי מִשָּׁדָיִם
  choice: qui viennent de quitter le sein
  rationale: עַתִּיקֵי évoque ceux qui ont été éloignés ou retirés. Le singulier collectif « le sein » est l’expression idiomatique française, même si l’hébreu emploie la forme duelle/plurielle.
- source_word: אֶת מִי ... וְאֶת מִי
  choice: À qui ... et à qui
  rationale: La répétition de l’interrogatif forme deux questions parallèles. « À qui » est naturel avec « enseigner » et « faire comprendre » en français.
theological_decisions:
- issue: Référent du sujet implicite des verbes à la troisième personne du singulier
  choice: Conserver « il » sans identifier son référent.
  alternative: Identifier le sujet comme Ésaïe, le SEIGNEUR parlant par le prophète, ou la personne dont les prêtres et prophètes ivres se moquent.
  rationale: L’hébreu ne nomme pas le sujet dans ce verset. Le contexte peut évoquer des paroles moqueuses visant Ésaïe, mais l’identifier dans le corps du texte supprimerait une ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe interrogative et le parallélisme sont conservés. « Faire comprendre » maintient la nuance causative du verbe hébreu. Les marqueurs [a] et [b] figurent tous deux dans le texte.
