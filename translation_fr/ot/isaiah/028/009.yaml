  verdict: revise
  source_fidelity: La question double, le sujet implicite à la troisième personne du singulier, et les sens fondamentaux de « enseigner », « faire comprendre », « connaissance » et « message » sont bien rendus. Toutefois, « viennent d’être » / « viennent de quitter » introduit une idée de proximité temporelle (« tout juste ») qui n’est pas explicitement exprimée par les participes hébreux. « Le sein » neutralise aussi la forme plurielle/duelle du texte source.
  naturalness: La formulation interrogative est naturelle en français moderne. « Ceux qui sont sevrés du lait, ceux qui sont éloignés des seins » demeure claire, idiomatique dans un registre biblique sobre, et reproduit le parallélisme sans ajouter l’idée de sevrage récent.
  terminology: « Connaissance », « faire comprendre » et « message » conviennent. La note sur שְׁמוּעָה conserve utilement les possibilités « récit », « ce qui est entendu » et « annonce ». Le marqueur relatif au sujet implicite doit être rattaché aux verbes plutôt qu’à l’expression sur les seins.
  issues:
  - severity: medium
    issue: Ajout de l’idée de temporalité immédiate
    rationale: « Viennent d’être sevrés » et « viennent de quitter » suggèrent que le sevrage ou l’éloignement est tout récent. Les formes גְּמוּלֵי et עַתִּיקֵי décrivent des personnes sevrées/éloignées sans préciser ce degré de récence.
  - severity: low
    issue: Réduction de « seins » au singulier collectif
    rationale: Le singulier collectif français est possible, mais « seins » rend plus directement la forme duelle/plurielle hébraïque et maintient le parallélisme corporel.
  - severity: low
    issue: Ancrage de la note sur le sujet implicite
    rationale: La note [b] porte sur le sujet des deux verbes et doit donc être placée après la seconde expression verbale, non après « sein ».
