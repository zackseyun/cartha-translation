id: ISA.28.5
reference: Isaiah 28:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ יְהוָ֣ה צְבָא֔וֹת לַ/עֲטֶ֣רֶת צְבִ֔י וְ/לִ/צְפִירַ֖ת תִּפְאָרָ֑ה לִ/שְׁאָ֖ר עַמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/005.yaml
  text: In that day Yahweh of Armies will be a crown of beauty and a diadem of splendor for the remnant of his people[a].
translation:
  language: fr
  text: En ce jour-là, Yahvé des armées sera une couronne de beauté et un diadème de splendeur pour le reste de son peuple.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire le titre hébreu יְהוָה צְבָאוֹת par « le SEIGNEUR des armées »; il est traditionnellement rendu par « le SEIGNEUR des puissances » ou « l’Éternel des armées ».
    reason: Signaler les principaux rendus français du nom et du titre divins sans remplacer dans le texte le nom יהוה par un titre.
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Cette formule temporelle prophétique est rendue de façon naturelle en français tout en conservant sa cadence solennelle.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: « Yahvé » représente le nom divin יהוה, tandis que « des armées » rend le sens concret de צְבָאוֹת plus clairement que le traditionnel « des puissances ».
- source_word: יִהְיֶה
  choice: sera
  rationale: L’inaccompli de היה exprime ici l’état futur annoncé par le prophète.
- source_word: לַעֲטֶרֶת צְבִי
  choice: une couronne de beauté
  rationale: « Couronne » rend עֲטֶרֶת et « beauté » conserve la valeur esthétique de צְבִי sans la confondre avec תִּפְאָרָה dans le membre parallèle.
- source_word: וְלִצְפִירַת תִּפְאָרָה
  choice: et un diadème de splendeur
  rationale: « Diadème » préserve la nuance lexicale par rapport à « couronne », et « splendeur » restitue le registre élevé de תִּפְאָרָה.
- source_word: לִשְׁאָר עַמּוֹ
  choice: pour le reste de son peuple
  rationale: Dans Ésaïe, שְׁאָר désigne couramment le groupe survivant; « le reste » est idiomatique en français biblique moderne et la préposition « pour » exprime ici le bénéfice ou la destination.
theological_decisions:
- issue: Rendu du titre divin יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  alternative: le SEIGNEUR des armées
  rationale: Le texte hébreu emploie directement le nom divin יהוה. Le conserver sous la forme « Yahvé » distingue le nom personnel du titre substitutif traditionnel, sans préciser si les armées sont terrestres ou célestes.
- issue: Portée de שְׁאָר
  choice: le reste de son peuple
  alternative: ceux de son peuple qui subsisteront
  rationale: Le terme désigne à la fois les survivants et le motif prophétique du « reste ». La formulation retenue garde cette densité sans développer explicitement ce que le verset laisse implicite.
translation_notes:
  register: Français international moderne, digne et poétique. Le parallélisme « couronne de beauté / diadème de splendeur » est conservé, ainsi que la légère distinction lexicale entre les deux images.
