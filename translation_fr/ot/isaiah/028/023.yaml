  text: Give ear and hear my voice[a]; pay attention and hear my word.
translation:
  language: fr
  text: Prêtez l’oreille et écoutez ma voix ; soyez attentifs et écoutez ma parole.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Prêtez l’oreille
  rationale: L’impératif hiphil pluriel de אזן appelle à tendre attentivement l’oreille. Cette expression française, naturelle dans un registre soutenu, conserve la force de l’appel et le distingue du verbe suivant.
- source_word: וְשִׁמְעוּ
  choice: et écoutez
  rationale: L’impératif qal pluriel de שמע est rendu par « écoutez », formulation idiomatique en français qui préserve l’enchaînement de deux impératifs sans les fondre.
- source_word: קוֹלִי
  choice: ma voix
  rationale: קול désigne naturellement la voix dans ce contexte de parole directe ; « ma voix » conserve aussi le parallélisme poétique.
- source_word: הַקְשִׁיבוּ
  choice: soyez attentifs
  rationale: L’impératif hiphil pluriel de קשב demande une attention soutenue. « Soyez attentifs » est clair, actuel et distinct de « prêtez l’oreille ».
- source_word: וְשִׁמְעוּ
  choice: et écoutez
  rationale: La répétition de שמע est maintenue pour respecter l’insistance et la structure parallèle de l’hébreu.
- source_word: אִמְרָתִי
  choice: ma parole
  rationale: אמרה peut désigner une parole ou un propos. « Ma parole » préserve le singulier et forme un parallèle naturel avec « ma voix ».
