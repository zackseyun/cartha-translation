  text: הֲ/לוֹא֙ אִם שִׁוָּ֣ה פָנֶ֔י/הָ וְ/הֵפִ֥יץ קֶ֖צַח וְ/כַמֹּ֣ן יִזְרֹ֑ק וְ/שָׂ֨ם חִטָּ֤ה שׂוֹרָה֙ וּ/שְׂעֹרָ֣ה נִסְמָ֔ן וְ/כֻסֶּ֖מֶת גְּבֻלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/025.yaml
  text: Does he not[a], when he has leveled its surface, scatter black cumin and sow cumin, and put wheat in rows, and barley in its appointed place[c][b], and spelt at its border?
translation:
  language: fr
  text: Une fois qu’il en a aplani la surface, ne répand-il pas la nigelle[a] et ne sème-t-il pas le cumin ? Ne met-il pas le blé en rangées[b], l’orge à l’endroit qui lui est réservé, et l’épeautre[c] en bordure ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cumin noir » ; l’identification exacte de קֶצַח est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le terme hébreu שׂוֹרָה est difficile ; il peut aussi signifier « à la place principale » ou « au meilleur endroit ».
    reason: lexical_alternative
  - marker: c
    text: Ou « amidonnier » ; l’identification exacte du grain désigné par כֻסֶּמֶת est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִם
  choice: Une fois que… ne…-t-il pas
  rationale: La tournure introduit une question rhétorique avec une nuance temporelle ou conditionnelle. Cette formulation française restitue naturellement l’enchaînement agricole.
- source_word: שִׁוָּה פָנֶיהָ
  choice: il en a aplani la surface
  rationale: Le verbe désigne ici l’action de rendre le terrain plan, et le suffixe féminin renvoie à la surface du sol.
- source_word: הֵפִיץ קֶצַח
  choice: répand… la nigelle
  rationale: Le verbe exprime la dispersion des graines à la volée. « Nigelle » est une identification moderne courante de la plante, tout en restant incertaine.
- source_word: כַמֹּן יִזְרֹק
  choice: sème… le cumin
  rationale: Bien que le verbe puisse littéralement évoquer le fait de jeter, le contexte agricole indique l’ensemencement.
- source_word: חִטָּה שׂוֹרָה
  choice: le blé en rangées
  rationale: חִטָּה désigne le blé. Le terme rare שׂוֹרָה est difficile ; « en rangées » rend une interprétation plausible liée à l’organisation des semis.
- source_word: שְׂעֹרָה נִסְמָן
  choice: l’orge à l’endroit qui lui est réservé
  rationale: שְׂעֹרָה désigne l’orge. נִסְמָן semble indiquer un emplacement marqué ou assigné.
- source_word: כֻסֶּמֶת גְּבֻלָתוֹ
  choice: l’épeautre en bordure
  rationale: Le dernier terme indique la limite ou bordure du champ. « Épeautre » est la désignation traditionnelle du grain, dont l’identification botanique demeure discutée.
