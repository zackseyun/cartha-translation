revisions:
- from: Malheur à la couronne orgueilleuse des ivrognes d’Éphraïm[a], à la fleur qui se fane, parure de sa splendeur, au sommet de la vallée fertile[b] — à ceux que le vin a terrassés[c] !
  to: Malheur à la couronne orgueilleuse des ivrognes d’Éphraïm[a], à la fleur fanée de sa beauté glorieuse, qui se trouve au sommet de la vallée fertile[b] de ceux que le vin a terrassés[c] !
  rationale: La révision rattache « ceux que le vin a terrassés » à « la vallée fertile », conformément à la syntaxe hébraïque, au lieu d’en faire un troisième objet de l’oracle. Elle remplace aussi l’apposition française quelque peu ambiguë « parure de sa splendeur » par une formulation qui rend directement le lien entre la fleur et la beauté glorieuse, sans identifier le référent du pronom.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:50Z'
