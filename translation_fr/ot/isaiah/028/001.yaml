id: ISA.28.1
reference: Isaiah 28:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: ה֗וֹי עֲטֶ֤רֶת גֵּאוּת֙ שִׁכֹּרֵ֣י אֶפְרַ֔יִם וְ/צִ֥יץ נֹבֵ֖ל צְבִ֣י תִפְאַרְתּ֑/וֹ אֲשֶׁ֛ר עַל רֹ֥אשׁ גֵּֽיא שְׁמָנִ֖ים הֲל֥וּמֵי יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/001.yaml
  text: Woe to the proud crown of the drunkards of Ephraim[a], and to the fading flower of his glorious beauty, which is on the head of the fertile valley[c][b], those overcome by wine.
translation:
  language: fr
  text: Malheur à la couronne orgueilleuse des ivrognes d’Éphraïm[a], à la fleur fanée de sa beauté glorieuse, qui se trouve au sommet de la vallée fertile[b] de ceux que le vin a terrassés[c] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « la couronne d’orgueil des ivrognes d’Éphraïm ». La poésie hébraïque permet de comprendre l’orgueil comme caractérisant la couronne ou comme ce dont elle est la couronne.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la vallée des graisses », expression évoquant une terre riche, abondante et luxuriante.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « de ceux que le vin a accablés ». L’hébreu emploie une image forte : ils sont comme frappés ou abattus par le vin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Malheur à
  rationale: Introduit un oracle prophétique de lamentation et de jugement; « Malheur à » en conserve la force en français naturel.
- source_word: עֲטֶרֶת גֵּאוּת
  choice: la couronne orgueilleuse
  rationale: Le groupe construit signifie littéralement « couronne d’orgueil ». La formulation adjectivale préserve la métaphore et reste fluide.
- source_word: שִׁכֹּרֵי אֶפְרַיִם
  choice: des ivrognes d’Éphraïm
  rationale: Le génitif rattache naturellement les personnes caractérisées par l’ivresse à Éphraïm; « ivrognes » rend le substantif avec précision.
- source_word: וְצִיץ נֹבֵל
  choice: à la fleur qui se fane
  rationale: צִיץ désigne une fleur ou une floraison, et נֹבֵל ce qui se flétrit ou se fane. La reprise de « à » explicite la portée de « Malheur ».
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: parure de sa splendeur
  rationale: Les deux noms expriment beauté, magnificence et gloire. « Parure de sa splendeur » conserve leur densité poétique sans répétition maladroite.
- source_word: אֲשֶׁר עַל רֹאשׁ גֵּיא שְׁמָנִים
  choice: au sommet de la vallée fertile
  rationale: רֹאשׁ a ici un sens spatial, tandis que « vallée de richesses/graisses » est un idiome désignant une terre riche et luxuriante.
- source_word: הֲלוּמֵי יָיִן
  choice: ceux que le vin a terrassés
  rationale: Le participe passif de הלם évoque des personnes frappées, abattues ou accablées. « Terrassés » garde cette image vive tout en étant idiomatique.
theological_decisions:
- issue: Référent et relation des images poétiques
  choice: Maintenir la couronne, la fleur et les personnes terrassées par le vin dans une apposition poétique ouverte
  alternative: Identifier explicitement la couronne et la fleur à Samarie ou réduire toutes les images aux seuls ivrognes
  rationale: Le vers hébreu superpose les métaphores sans nommer ici Samarie ni préciser entièrement leurs relations; la traduction ne doit pas résoudre cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et poétique. La syntaxe conserve l’accumulation prophétique du texte hébreu, tandis que le tiret clarifie l’apposition finale sans en supprimer l’ambiguïté.
