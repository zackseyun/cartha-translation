id: ISA.28.17
reference: Isaiah 28:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֤י מִשְׁפָּט֙ לְ/קָ֔ו וּ/צְדָקָ֖ה לְ/מִשְׁקָ֑לֶת וְ/יָעָ֤ה בָרָד֙ מַחְסֵ֣ה כָזָ֔ב וְ/סֵ֥תֶר מַ֖יִם יִשְׁטֹֽפוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/017.yaml
  text: And I will make justice the measuring line[a], and righteousness the plumb line; hail will sweep away the refuge of lies[c][b], and waters will flood the shelter.
translation:
  language: fr
  text: Je ferai de la justice le cordeau[a], et de la droiture le fil à plomb[b] ; la grêle emportera le refuge du mensonge, et les eaux submergeront l’abri[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la règle de mesure » ; le terme hébreu désigne un cordeau utilisé pour mesurer ou tracer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, un instrument à poids servant à vérifier l’aplomb.
    reason: lexical_clarification
  - marker: c
    text: Ou « la cachette » ; le terme hébreu désigne un lieu où l’on se dissimule ou se met à l’abri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Je ferai de
  rationale: Dans cette construction, שׂים exprime l’établissement d’une chose comme norme. « Je ferai de… » est naturel en français et conserve la force déclarative.
- source_word: מִשְׁפָּט
  choice: la justice
  rationale: Le terme désigne ici le juste jugement ou l’ordre équitable pris comme norme divine. « Justice » convient naturellement à la métaphore de la mesure.
- source_word: לְקָו
  choice: le cordeau
  rationale: קָו désigne un cordeau servant à mesurer ou à tracer dans la construction. Ce terme français maintient précisément l’image architecturale.
- source_word: וּצְדָקָה
  choice: la droiture
  rationale: « Droiture » préserve la dimension morale de צְדָקָה et distingue ce terme de מִשְׁפָּט sans introduire une nuance confessionnelle.
- source_word: לְמִשְׁקָלֶת
  choice: le fil à plomb
  rationale: Le mot désigne un poids ou instrument servant à vérifier l’aplomb. « Fil à plomb » est l’équivalent français moderne le plus clair dans la métaphore de construction.
- source_word: וְיָעָה
  choice: emportera
  rationale: Le verbe évoque l’action de balayer ou d’enlever. Avec la grêle pour sujet, « emportera » rend naturellement la violence destructrice, tandis que la note signale l’image plus littérale.
- source_word: בָרָד
  choice: la grêle
  rationale: Équivalent direct et non ambigu du terme hébreu.
- source_word: מַחְסֵה כָזָב
  choice: le refuge du mensonge
  rationale: La construction nominale est conservée. « Mensonge » exprime la fausseté sur laquelle repose la sécurité dénoncée dans le contexte.
- source_word: וְסֵתֶר
  choice: l’abri
  rationale: סֵתֶר peut désigner un lieu où l’on se cache ou se protège. « Abri » convient au parallélisme avec « refuge » et à l’image de la tempête.
- source_word: מַיִם
  choice: les eaux
  rationale: Le pluriel poétique de l’hébreu est maintenu et renforce l’image d’une inondation irrésistible.
- source_word: יִשְׁטֹפוּ
  choice: submergeront
  rationale: שׁטף signifie déborder, inonder ou entraîner. « Submergeront » est idiomatique avec « les eaux » et traduit l’idée d’envahissement total.
theological_decisions:
- issue: Rendu du couple éthique מִשְׁפָּט / צְדָקָה
  choice: justice / droiture
  alternative: jugement / justice
  rationale: Deux termes distincts maintiennent le parallélisme et la tension entre l’exercice juste du jugement et la conformité morale, sans les confondre.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme poétique et la métaphore architecturale, puis les images de tempête et d’inondation. Les termes techniques restent compréhensibles grâce aux notes.
