  variant: modern international French
source:
  edition: WLC
  text: כִּ֚י בְּ/לַעֲגֵ֣י שָׂפָ֔ה וּ/בְ/לָשׁ֖וֹן אַחֶ֑רֶת יְדַבֵּ֖ר אֶל הָ/עָ֥ם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/011.yaml
  text: For with mocking lips and with another tongue he will speak to this people[b][a],
translation:
  language: fr
  text: Car c’est par des lèvres moqueuses[a] et dans une autre langue[b] qu’il parlera à ce peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des lèvres balbutiantes »; certains comprennent l’expression comme désignant une parole difficile à comprendre plutôt qu’une parole moqueuse.
    reason: lexical_alternative
  - marker: b
    text: L’expression désigne ici une langue étrangère; dans le contexte, elle peut évoquer la parole de jugement transmise par des envahisseurs étrangers.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit ici l’explication de ce qui précède; « Car » conserve clairement ce lien logique.
- source_word: בְּלַעֲגֵי שָׂפָה
  choice: par des lèvres moqueuses
  rationale: לַעַג évoque la moquerie ou la dérision. Cette formulation garde l’image hébraïque des lèvres tout en restant naturelle en français; l’autre compréhension possible, « lèvres balbutiantes », est signalée en note.
- source_word: וּבְלָשׁוֹן אַחֶרֶת
  choice: et dans une autre langue
  rationale: לָשׁוֹן désigne la langue, au sens d’organe ou de langage. En français actuel, « dans une autre langue » exprime naturellement ici le parler étranger sans imposer l’expression ambiguë « une autre langue » comme instrument.
- source_word: יְדַבֵּר
  choice: il parlera
  rationale: L’imparfait hébreu prend ici une valeur future dans le discours prophétique. Le sujet implicite reste non précisé dans le verset, comme en hébreu.
- source_word: אֶל הָעָם הַזֶּה
  choice: à ce peuple
  rationale: « Peuple » rend directement עָם et le démonstratif « ce » préserve la force du reproche prophétique.
theological_decisions:
- issue: Sens de la parole étrangère ou dérisoire
  choice: Le texte évoque une parole aux sonorités moqueuses et prononcée dans une autre langue, sans identifier explicitement son agent dans le verset.
  alternative: Comprendre surtout une parole balbutiante ou inintelligible.
  rationale: Le sens de dérision est lexicalement bien attesté pour לַעַג, tandis que « autre langue » suggère un parler étranger. Le contexte peut faire entendre le jugement divin par l’intermédiaire d’étrangers, mais cette identification interprétative n’est pas ajoutée au corps du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La construction « par des lèvres… et dans une autre langue » conserve les deux images hébraïques tout en évitant une tournure artificielle. Les marqueurs suivent leur ordre d’apparition dans le texte français.
