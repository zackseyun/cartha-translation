id: ISA.28.15
reference: Isaiah 28:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֣י אֲמַרְתֶּ֗ם כָּרַ֤תְנֽוּ בְרִית֙ אֶת מָ֔וֶת וְ/עִם שְׁא֖וֹל עָשִׂ֣ינוּ חֹזֶ֑ה שיט שׁוֹטֵ֤ף כִּֽי עבר לֹ֣א יְבוֹאֵ֔/נוּ כִּ֣י שַׂ֧מְנוּ כָזָ֛ב מַחְסֵ֖/נוּ וּ/בַ/שֶּׁ֥קֶר נִסְתָּֽרְנוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/015.yaml
  text: Because you have said[a], “We have made a covenant with death, and with Sheol we have made an agreement. When the overwhelming scourge passes through, it will not come to us[c][b], because we have made falsehood our refuge and have hidden ourselves in deceit.”
translation:
  language: fr
  text: 'Car vous avez dit : « Nous avons conclu une alliance avec la mort et, avec le Shéol[a], nous avons passé un accord[b]. Quand le fléau déferlant[c] passera, il ne nous atteindra pas, car nous avons fait du mensonge notre refuge et nous nous sommes cachés dans la tromperie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le Shéol est, dans la pensée hébraïque, le domaine des morts ; il ne faut pas nécessairement l’identifier aux conceptions ultérieures de l’enfer.
    reason: cultural_note
  - marker: b
    text: 'Le terme hébreu est difficile. On peut aussi traduire : « un pacte » ou « un traité ». Bien qu’il puisse ailleurs signifier « vision », il désigne probablement ici un accord, en parallèle avec « alliance ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « le fléau qui déborde » ou « le fouet déferlant ». L’expression hébraïque, difficile, associe l’image d’un coup qui frappe à celle d’une crue qui emporte tout.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison du jugement annoncé dans le contexte. « Car » conserve clairement la valeur causale tout en convenant au registre prophétique.
- source_word: אֲמַרְתֶּם
  choice: vous avez dit
  rationale: Le parfait hébreu désigne une parole déjà prononcée dont la portée demeure actuelle dans l’accusation.
- source_word: כָּרַתְנוּ בְרִית
  choice: nous avons conclu une alliance
  rationale: Rend naturellement l’expression idiomatique hébraïque, littéralement « couper une alliance », sans en perdre la force.
- source_word: מָוֶת
  choice: la mort
  rationale: Traduction directe qui maintient la personnification implicite de la mort comme partenaire d’alliance.
- source_word: שְׁאוֹל
  choice: le Shéol
  rationale: La translittération préserve la notion hébraïque du domaine des morts sans l’assimiler automatiquement aux conceptions ultérieures de l’enfer.
- source_word: עָשִׂינוּ חֹזֶה
  choice: nous avons passé un accord
  rationale: Dans ce parallélisme avec « alliance », חֹזֶה désigne vraisemblablement un accord ou un pacte, malgré la difficulté lexicale du terme.
- source_word: שיט שׁוֹטֵף
  choice: le fléau déferlant
  rationale: 'Cette formulation conserve la double image difficile du texte : une puissance qui frappe comme un fléau et qui déferle comme une inondation.'
- source_word: כִּי עבר
  choice: quand … passera
  rationale: Dans la parole citée, כִּי prend ici une valeur temporelle naturelle en français, tandis que עבר décrit le passage de la force destructrice.
- source_word: לֹא יְבוֹאֵנוּ
  choice: il ne nous atteindra pas
  rationale: Exprime idiomatiquement l’idée qu’ils se croient hors de portée du désastre, sans affaiblir la négation.
- source_word: כָזָב מַחְסֵנוּ
  choice: nous avons fait du mensonge notre refuge
  rationale: Préserve l’abstraction « mensonge » ainsi que la métaphore frappante du refuge.
- source_word: וּבַשֶּׁקֶר נִסְתָּרְנוּ
  choice: nous nous sommes cachés dans la tromperie
  rationale: Respecte la forme réfléchie du verbe et le parallélisme avec le mensonge, tout en variant naturellement le vocabulaire français.
theological_decisions:
- issue: Sens de שְׁאוֹל
  choice: le Shéol
  alternative: le séjour des morts ; la tombe
  rationale: Le terme hébreu ne correspond pas nécessairement aux notions doctrinales plus tardives de l’enfer. La translittération laisse intacte cette distinction.
- issue: Personnification de la mort et du Shéol
  choice: Les conserver comme partenaires d’une alliance et d’un accord
  alternative: Expliciter qu’il s’agit uniquement d’une image
  rationale: La rhétorique du verset présente les dirigeants comme se vantant d’une entente avec la mort et le Shéol. La traduction garde cette tension sans l’expliquer ni la réduire.
- issue: Nature du « fléau déferlant »
  choice: Conserver l’image mixte et ambiguë
  alternative: Identifier explicitement une armée, un jugement divin ou une inondation
  rationale: Le texte évoque une puissance destructrice sans en donner ici une identification univoque. L’explicitation imposerait une interprétation au-delà du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la déclaration prophétique est conservé, avec un vocabulaire concret. « Shéol » maintient la couleur du monde conceptuel hébraïque, tandis que les notes éclairent les principales difficultés sans résoudre abusivement les ambiguïtés.
