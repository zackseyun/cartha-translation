id: ISA.28.21
reference: Isaiah 28:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּ֤י כְ/הַר פְּרָצִים֙ יָק֣וּם יְהוָ֔ה כְּ/עֵ֖מֶק בְּ/גִבְע֣וֹן יִרְגָּ֑ז לַ/עֲשׂ֤וֹת מַעֲשֵׂ֨/הוּ֙ זָ֣ר מַעֲשֵׂ֔/הוּ וְ/לַֽ/עֲבֹד֙ עֲבֹ֣דָת֔/וֹ נָכְרִיָּ֖ה עֲבֹדָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/021.yaml
  text: For Yahweh will rise up as at Mount Perazim[a]; he will be stirred up as in the Valley of Gibeon[c][b], to do his work—his strange work—and to perform his task—his foreign task.
translation:
  language: fr
  text: Car Yahweh se lèvera comme au mont Peratsim[a] ; il se mettra en mouvement comme dans la vallée de Gabaon[b], afin d’accomplir son œuvre — son œuvre étrange — et d’exécuter sa tâche — sa tâche étrangère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mont Peratsim rappelle la victoire où Yahweh a fait une brèche parmi les ennemis de David (2 Samuel 5.20 ; 1 Chroniques 14.11).
    reason: cross_reference
  - marker: b
    text: La vallée de Gabaon rappelle probablement l’intervention de Yahweh lors de la bataille de Gabaon (Josué 10.10-14).
    reason: cross_reference
  - marker: c
    text: 'Ou : « son œuvre étrangère… sa tâche étrange ». Les deux adjectifs soulignent que cette action est présentée comme inhabituelle ou étrangère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication causale de l’avertissement précédent et conserve naturellement le lien logique.
- source_word: כְהַר פְּרָצִים
  choice: comme au mont Peratsim
  rationale: Le préfixe comparatif renvoie à l’intervention historique associée à ce lieu, plutôt qu’à une simple ressemblance avec la montagne.
- source_word: יָקוּם
  choice: se lèvera
  rationale: Exprime l’intervention résolue de Yahweh dans un registre prophétique naturel et digne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin personnel présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: כְעֵמֶק בְּגִבְעוֹן
  choice: comme dans la vallée de Gabaon
  rationale: Conserve la comparaison et la référence topographique à Gabaon dans une formulation française naturelle.
- source_word: יִרְגָּז
  choice: il s’agitera
  rationale: Préserve la gamme sémantique de רגז — agitation ou mise en mouvement intense — sans réduire le verbe à la seule colère ni suggérer une perte de maîtrise.
- source_word: לַעֲשׂוֹת מַעֲשֵׂהוּ
  choice: afin d’accomplir son œuvre
  rationale: Rend l’action intentionnelle et le nom מַעֲשֶׂה avec une tournure française fluide.
- source_word: זָר
  choice: étrange
  rationale: Maintient l’idée d’une œuvre inhabituelle ou étrangère à ce qui est attendu, sans l’expliquer dans le corps du texte.
- source_word: וְלַעֲבֹד עֲבֹדָתוֹ
  choice: et d’exécuter sa tâche
  rationale: Reproduit le parallélisme tout en évitant en français la lourdeur d’un calque du type « travailler son travail ».
- source_word: נָכְרִיָּה
  choice: étrangère
  rationale: Conserve la variation lexicale et l’accent mis sur le caractère inhabituel ou étranger de cette tâche.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le tétragramme ; « Yahweh » préserve le nom personnel sans le remplacer par un titre.
- issue: Caractère « étrange » et « étranger » de l’action divine
  choice: Conserver ces deux qualificatifs dans le texte
  alternative: Paraphraser par « son jugement inhabituel » ou « son châtiment inattendu »
  rationale: L’hébreu laisse subsister une tension théologique concernant cette action de jugement. La traduction ne précise donc pas dans le texte ce que l’auteur laisse implicite.
- issue: Sens de יִרְגָּז appliqué à Yahweh
  choice: il s’agitera
  alternative: il entrera en fureur / il tremblera / il se mettra en mouvement
  rationale: Le choix garde l’image d’une agitation intense conduisant à l’action, sans imposer exclusivement la colère ou un tremblement physique.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les noms propres suivent les formes françaises usuelles « Peratsim » et « Gabaon ». Le parallélisme et la répétition rhétorique de l’hébreu sont maintenus, avec une ponctuation qui en facilite la lecture.
