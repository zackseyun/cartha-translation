source:
  edition: WLC
  text: וְ/יִסְּר֥/וֹ לַ/מִּשְׁפָּ֖ט אֱלֹהָ֥י/ו יוֹרֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/026.yaml
  text: For his God instructs him in justice[a]; he teaches him.
translation:
  language: fr
  text: Car son Dieu lui enseigne la bonne manière de faire[a] ; il l’instruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il le forme selon la juste règle » ; l’hébreu peut aussi se comprendre de manière plus adverbiale : « Il le forme comme il convient. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִסְּרוֹ
  choice: lui enseigne
  rationale: Le piel de יסר avec suffixe objet désigne ici une instruction ou une formation pratique, non un châtiment. « Lui enseigne » convient au contexte agricole et reste naturel en français.
- source_word: לַמִּשְׁפָּט
  choice: la bonne manière de faire
  rationale: Dans ce contexte de savoir-faire agricole, מִשְׁפָּט renvoie vraisemblablement à la règle ou à la méthode appropriée. Cette formulation française exprime ce sens pratique sans effacer dans la note la valeur plus littérale de jugement ou de juste règle.
- source_word: אֱלֹהָיו
  choice: son Dieu
  rationale: 'Le suffixe possessif est conservé : le savoir-faire du cultivateur est explicitement rapporté à son Dieu.'
- source_word: יוֹרֶנּוּ
  choice: il l’instruit
  rationale: Le hiphil de ירה signifie enseigner, instruire ou diriger. « Il l’instruit » garde la nuance pédagogique tout en évitant de répéter exactement le premier verbe.
theological_decisions:
- issue: Origine de la sagesse agricole
  choice: Le savoir-faire pratique du cultivateur est attribué à Dieu, qui l’enseigne.
  alternative: Le verset peut être compris plus généralement comme une description de la providence divine guidant les compétences humaines.
  rationale: Le sujet explicite « son Dieu » et les deux verbes d’enseignement présentent directement Dieu comme la source de ce savoir, sans imposer une élaboration doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. « La bonne manière de faire » privilégie le sens pratique requis par le contexte agricole, tandis que la note conserve l’ambiguïté de לַמִּשְׁפָּט entre règle juste, procédure appropriée et emploi adverbial.
