  text: וּ/לְ/ר֖וּחַ מִשְׁפָּ֑ט לַ/יּוֹשֵׁב֙ עַל הַ/מִּשְׁפָּ֔ט וְ/לִ֨/גְבוּרָ֔ה מְשִׁיבֵ֥י מִלְחָמָ֖ה שָֽׁעְרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/006.yaml
  text: and a spirit of justice to the one who sits in judgment[c][b][a], and strength to those who turn back the battle at the gate.
translation:
  language: fr
  text: et un esprit de justice[a] pour celui qui siège au tribunal[b], et une force pour ceux qui repoussent l’assaut à la porte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de jugement ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour celui qui siège sur le jugement » ; on pourrait aussi comprendre « sur le siège du jugement ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ceux qui font reculer le combat vers la porte » ; le terme peut aussi désigner le secteur de la porte.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְרוּחַ מִשְׁפָּט
  choice: et un esprit de justice
  rationale: La construction poursuit les attributs ou bienfaits énoncés au verset précédent. « Esprit de justice » restitue naturellement la qualité de discernement et d’équité exprimée par מִשְׁפָּט, sans exclure son sens judiciaire.
- source_word: לַיֹּשֵׁב עַל הַמִּשְׁפָּט
  choice: pour celui qui siège au tribunal
  rationale: Cette formulation française conserve le participe masculin singulier et exprime idiomatiquement l’exercice de l’autorité judiciaire suggéré par « siéger sur le jugement ».
- source_word: וְלִגְבוּרָה
  choice: et une force
  rationale: גְּבוּרָה désigne ici la force ou la vaillance accordée dans un contexte militaire. « Force » maintient le parallélisme avec « esprit de justice ».
- source_word: מְשִׁיבֵי מִלְחָמָה
  choice: pour ceux qui repoussent l’assaut
  rationale: Le participe causatif exprime l’action de faire reculer. Dans ce contexte défensif, « repousser l’assaut » rend en français courant l’idée de faire refluer le combat, sans ajouter d’adversaire non exprimé.
- source_word: שָׁעְרָה
  choice: à la porte
  rationale: Le nom muni du ה directionnel ou locatif situe l’affrontement vers la porte ou dans son secteur. « À la porte » convient au contexte d’une défense urbaine tout en laissant l’alternative directionnelle en note.
theological_decisions:
- issue: Lien syntaxique avec le sujet du verset précédent
  choice: Conserver une proposition nominale coordonnée, dépendante du verset précédent
  alternative: Répéter explicitement « le Seigneur sera » ou présenter ces qualités comme des dons accordés
  rationale: L’hébreu poursuit par des groupes prépositionnels la déclaration précédente selon laquelle le Seigneur « sera » quelque chose pour son peuple. Ne pas répéter le sujet préserve ce lien et évite de trancher entre présence personnelle et don accordé.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le caractère continuatif du fragment hébreu. « Siège au tribunal » et « repoussent l’assaut » privilégient une expression idiomatique tout en documentant dans les notes les formulations plus littérales et les ambiguïtés lexicales.
