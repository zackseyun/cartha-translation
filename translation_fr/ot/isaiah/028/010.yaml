base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/010.yaml
  text: For it is[a], “Command on command, command on command, line on line, line on line, a little here, a little there.”
translation:
  language: fr
  text: 'Car : « Ordre sur ordre, ordre sur ordre, ligne sur ligne, ligne sur ligne, un peu ici, un peu là. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication ou la reprise de l’accusation précédente sans imposer une causalité plus forte que ne le permet le contexte.
- source_word: צַו
  choice: ordre
  rationale: Si le terme est rattaché à la racine צוה, il désigne une prescription ou un commandement. « Ordre » est bref, courant et conserve le rythme saccadé.
- source_word: לָצָו
  choice: sur ordre
  rationale: Dans cette formule répétitive, ל est rendu idiomatiquement par « sur », ce qui donne une accumulation intelligible en français.
- source_word: קַו
  choice: règle
  rationale: Le mot peut désigner un cordeau ou une ligne de mesure. « Règle » reste concis et peut évoquer à la fois la mesure et une prescription, tout en maintenant la cadence.
- source_word: לָקָו
  choice: sur règle
  rationale: Le parallélisme avec « ordre sur ordre » est conservé par la même construction française.
- source_word: זְעֵיר
  choice: un peu
  rationale: Rend simplement l’idée de petite quantité et convient au rythme répétitif.
- source_word: שָׁם
  choice: là
  rationale: Équivalent direct et naturel de l’adverbe de lieu.
- source_word: זְעֵיר שָׁם ... זְעֵיר שָׁם
  choice: un peu ici, un peu là
  rationale: L’hébreu répète littéralement « là… là » ; la tournure distributive française « ici… là » restitue plus naturellement l’effet de fragmentation, tandis que la répétition exacte est signalée en note.
theological_decisions:
- issue: Faut-il comprendre ces mots comme un enseignement direct ou comme des paroles rapportées sur un ton moqueur et enfantin ?
  choice: Des guillemets et une cadence répétitive présentent la formule comme une parole rapportée probablement moqueuse.
  alternative: Une affirmation littérale décrivant une méthode pédagogique, sans indication explicite de moquerie.
  rationale: Le contexte d’Ésaïe 28.9-13 favorise l’idée que les responsables tournent l’enseignement prophétique en ridicule. La traduction en préserve l’effet sans introduire de paraphrase méprisante absente de l’hébreu.
translation_notes:
  register: Français international moderne, digne mais accessible. La répétition serrée et la brièveté des groupes nominaux reproduisent le caractère scandé de l’hébreu ; la note conserve les équivalents plus formels et l’ambiguïté du passage.
