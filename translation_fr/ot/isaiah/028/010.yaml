  source_fidelity: La répétition, la brièveté et le caractère possiblement moqueur de la formule sont bien rendus. Toutefois, « règle » risque de déplacer קַו vers le champ de la prescription, déjà occupé par צַו, alors que le mot désigne d’abord une ligne ou un cordeau de mesure. « Ligne » conserve mieux le contraste lexical et le parallélisme du texte hébreu.
  naturalness: « Ordre sur ordre, ligne sur ligne » est naturel et intelligible en français moderne tout en gardant la cadence scandée. La suppression de « c’est » évite une introduction française un peu lourde et syntaxiquement peu idiomatique devant la citation.
  terminology: « Ordre » est un choix bref et défendable pour צַו dans une expression dont la forme même est disputée et possiblement mimétique. « Ligne » est préférable à « règle » pour קַו. La note maintient à juste titre l’alternative plus littérale avec « pour » et le sens concret de « cordeau ».
  issues:
