  text: הֲ/כֹ֣ל הַ/יּ֔וֹם יַחֲרֹ֥שׁ הַ/חֹרֵ֖שׁ לִ/זְרֹ֑עַ יְפַתַּ֥ח וִֽ/ישַׂדֵּ֖ד אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/024.yaml
  text: Does the plowman plow all day to sow? Does he keep opening and harrowing his ground?[a]
translation:
  language: fr
  text: Le laboureur laboure-t-il toute la journée pour semer ? Est-ce qu’il passe son temps à ouvrir et à herser sa terre[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à ameublir et à égaliser sa terre ». Le sens précis des deux verbes agricoles hébreux est incertain ; ils décrivent probablement des étapes de la préparation du sol.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכֹל הַיּוֹם
  choice: toute la journée
  rationale: L’interrogation introduit une question rhétorique. « Toute la journée » rend naturellement la portée temporelle de l’hébreu.
- source_word: יַחֲרֹשׁ / הַחֹרֵשׁ
  choice: le laboureur laboure
  rationale: Le nom d’agent et le verbe partagent la même racine en hébreu ; cette formulation conserve leur parenté lexicale et l’image agricole.
- source_word: לִזְרֹעַ
  choice: pour semer
  rationale: L’infinitif exprime ici le but du labour ; « pour semer » est précis et idiomatique.
- source_word: יְפַתַּח
  choice: ouvrir
  rationale: Le verbe signifie littéralement « ouvrir » et désigne ici l’ouverture ou l’ameublissement du sol. Le choix conserve l’image lexicale hébraïque.
- source_word: וִישַׂדֵּד
  choice: herser
  rationale: Dans ce contexte agricole, le verbe désigne vraisemblablement le travail qui brise les mottes ou égalise la terre après le labour. « Herser » exprime de façon concise cette étape probable.
- source_word: אַדְמָתוֹ
  choice: son sol
  rationale: Le terme désigne ici la terre cultivée ; « son sol » est naturel en français et garde l’accent sur la terre travaillée.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. La répétition « le laboureur laboure » conserve l’écho de la même racine hébraïque. « Passe-t-il son temps à » rend la valeur continue ou répétée de la seconde question sans suggérer une durée strictement distincte de « toute la journée ».
