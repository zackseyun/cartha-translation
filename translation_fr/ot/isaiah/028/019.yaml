  variant: modern international French
source:
  edition: WLC
  text: מִ/דֵּ֤י עָבְר/וֹ֙ יִקַּ֣ח אֶתְ/כֶ֔ם כִּֽי בַ/בֹּ֧קֶר בַּ/בֹּ֛קֶר יַעֲבֹ֖ר בַּ/יּ֣וֹם וּ/בַ/לָּ֑יְלָה וְ/הָיָ֥ה רַק זְוָעָ֖ה הָבִ֥ין שְׁמוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/019.yaml
  text: As often as it passes through[a], it will seize you; for morning by morning it will pass through, by day and by night[b]; and it will be sheer terror to understand the message.
translation:
  language: fr
  text: Chaque fois qu’il passera, il vous saisira[a]. Car, matin après matin, il passera, de jour comme de nuit. Ce sera une pure terreur que de comprendre le message[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Chaque fois qu’il passera, il vous emportera. »'
    reason: Alternative contextuelle pour יִקַּח, dont le sens premier est « prendre »; dans l’image du fléau dévastateur, « emporter » peut évoquer l’effet de son passage.
  - marker: b
    text: 'Ou : « Ce ne sera que terreur de comprendre la nouvelle. » Certains traduisent : « rien que d’entendre le message », en rattachant étroitement la compréhension à ce qui est entendu.'
    reason: La syntaxe hébraïque de la proposition finale est condensée, et שְׁמוּעָה peut signifier « message », « nouvelle » ou « rapport ».
lexical_decisions:
- source_word: מִדֵּי עָבְרוֹ
  choice: Chaque fois qu’il passera
  rationale: L’expression indique une occurrence répétée. « Chaque fois que » restitue naturellement en français la valeur itérative, tandis que « passera » conserve l’image du fléau qui traverse le pays.
- source_word: יִקַּח אֶתְכֶם
  choice: il vous emportera
  rationale: Dans ce contexte de fléau débordant, לקח ne désigne pas une simple prise neutre. « Emportera » exprime l’effet destructeur du passage sans préciser indûment une capture ou une déportation.
- source_word: כִּי
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente.
- source_word: בַבֹּקֶר בַבֹּקֶר
  choice: matin après matin
  rationale: Cette formulation française garde la répétition distributive et la cadence de l’hébreu.
- source_word: יַעֲבֹר
  choice: il passera
  rationale: Le même verbe français est maintenu pour les deux occurrences de עבר, afin de préserver la cohésion de l’image.
- source_word: בַּיּוֹם וּבַלָּיְלָה
  choice: de jour comme de nuit
  rationale: Expression française naturelle qui rend le mérisme et l’idée d’une menace continuelle.
- source_word: רַק זְוָעָה
  choice: une pure terreur
  rationale: 'רַק donne ici une valeur exclusive ou intensive : rien que de la terreur. « Pure terreur » est fort, concis et actuel.'
- source_word: הָבִין שְׁמוּעָה
  choice: comprendre le message
  rationale: הָבִין signifie directement « comprendre »; שְׁמוּעָה peut désigner ce qui est entendu, une nouvelle, un rapport ou un message. « Message » reste clair sans réduire le terme à une rumeur.
theological_decisions:
- issue: Référent des verbes masculins singuliers
  choice: Employer « il » sans répéter le nom du fléau
  alternative: Expliciter « le fléau dévastateur » dans ce verset
  rationale: Le référent vient du verset précédent. Le pronom maintient le lien contextuel sans ajouter au texte de ce verset une désignation absente de l’hébreu.
- issue: Syntaxe de la proposition finale
  choice: « Ce sera une pure terreur que de comprendre le message »
  alternative: « Rien que d’entendre le message remplira de terreur »
  rationale: La formulation retenue préserve l’association difficile et abrupte entre la terreur, l’acte de comprendre et ce qui est entendu, sans transformer הָבִין (« comprendre ») en simple audition.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence répétitive de l’hébreu est conservée par « matin après matin », et la proposition finale demeure volontairement tendue plutôt que d’être résolue par une paraphrase.
