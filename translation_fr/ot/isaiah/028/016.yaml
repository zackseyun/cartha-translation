source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הִנְ/נִ֛י יִסַּ֥ד בְּ/צִיּ֖וֹן אָ֑בֶן אֶ֣בֶן בֹּ֜חַן פִּנַּ֤ת יִקְרַת֙ מוּסָ֣ד מוּסָּ֔ד הַֽ/מַּאֲמִ֖ין לֹ֥א יָחִֽישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/016.yaml
  text: 'Therefore thus says the Lord GOD: Behold[a], I am laying in Zion a stone, a tested stone, a precious cornerstone, a sure foundation[c][b]; the one who believes will not be in haste.'
translation:
  language: fr
  text: 'C’est pourquoi voici ce que dit le Seigneur DIEU : « Voici que je pose en Sion une pierre, une pierre éprouvée, une pierre angulaire précieuse, une fondation solidement établie[c]. Celui qui croit[a] ne se hâtera pas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui met sa confiance ». Le participe hébreu peut exprimer une confiance sur laquelle on s’appuie aussi bien que le fait de croire.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne se précipitera pas » ; certains comprennent, de manière plus interprétative, « ne cédera pas à la panique ».
    reason: lexical_alternative
  - marker: c
    text: Cette « pierre » est appliquée au Messie en Romains 9.33 et en 1 Pierre 2.6.
    reason: cross_reference
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: le Seigneur DIEU
  rationale: Le titre אֲדֹנָי est rendu par « le Seigneur ». Les capitales de « DIEU » signalent que le second terme représente ici le nom divin יהוה, tout en évitant l’inélégant « le Seigneur SEIGNEUR ».
- source_word: הִנְנִי יִסַּד
  choice: Voici que je pose
  rationale: Cette formulation conserve la force déictique et solennelle de הִנְנִי et exprime naturellement en français l’acte souverain de poser ou d’établir annoncé dans ce contexte.
- source_word: בְּצִיּוֹן
  choice: en Sion
  rationale: La préposition ב localise ici l’acte fondateur à Sion ; « en Sion » est la formulation française naturelle et traditionnelle.
- source_word: אָבֶן אֶבֶן בֹּחַן
  choice: une pierre, une pierre éprouvée
  rationale: La répétition de « pierre » est maintenue, et בֹּחַן est rendu par « éprouvée », qui exprime une qualité vérifiée par l’épreuve.
- source_word: פִּנַּת יִקְרַת
  choice: une pierre angulaire précieuse
  rationale: « Pierre angulaire » conserve l’image architecturale de פִּנָּה, tandis que « précieuse » rend la valeur et l’honneur exprimés par יְקָרָה.
- source_word: מוּסָד מוּסָּד
  choice: une fondation solidement établie
  rationale: La combinaison hébraïque insiste sur une fondation réellement fondée et donc ferme. La formulation française évite une répétition maladroite tout en conservant cette insistance.
- source_word: הַמַּאֲמִין
  choice: celui qui croit
  rationale: Le participe désigne la personne caractérisée par la foi ou la confiance. « Celui qui croit » reste concis et laisse la nuance de confiance être précisée en note.
- source_word: לֹא יָחִישׁ
  choice: ne se hâtera pas
  rationale: Le verbe exprime l’action de se presser ou d’agir avec précipitation. Cette traduction conserve l’image sans l’interpréter directement comme la panique.
theological_decisions:
- issue: Interprétation messianique de la pierre de fondation
  choice: Conserver l’image architecturale sans identifier explicitement la pierre au Messie dans le texte principal.
  alternative: Traduire ou expliciter directement la pierre comme étant le Messie ou le Christ.
  rationale: Le texte hébreu annonce que Dieu pose une pierre de fondation en Sion sans en expliciter ici le référent messianique. L’application christologique ultérieure est indiquée en note plutôt qu’introduite dans la traduction.
- issue: Sens de הַמַּאֲמִין
  choice: celui qui croit
  alternative: celui qui met sa confiance
  rationale: La racine אמן peut exprimer à la fois la foi et la confiance. Le texte principal retient « croit », tandis que la note préserve explicitement la nuance de confiance et d’appui.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme nominal et la répétition de « pierre » sont conservés, tandis que l’expression intensive מוּסָד מוּסָּד est rendue par une tournure française naturelle. La ponctuation distingue clairement l’annonce divine de sa conséquence pour celui qui croit.
