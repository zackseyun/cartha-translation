  text: כִּֽי קָצַ֥ר הַ/מַּצָּ֖ע מֵֽ/הִשְׂתָּרֵ֑עַ וְ/הַ/מַּסֵּכָ֥ה צָ֖רָה כְּ/הִתְכַּנֵּֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/020.yaml
  text: For the bed is too short to stretch oneself out on[a], and the covering too narrow to wrap oneself in.
translation:
  language: fr
  text: Car le lit est trop court pour qu’on puisse s’y étendre, et la couverture trop étroite pour qu’on puisse s’en envelopper.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de ce qui précède et conserve naturellement la valeur causale ou explicative de la conjonction.
- source_word: קָצַר הַמַּצָּע
  choice: le lit est trop court
  rationale: מַצָּע désigne ce sur quoi l’on s’étend; « lit » est ici naturel. Le contexte implique une longueur insuffisante, rendue par « trop court ».
- source_word: מֵהִשְׂתָּרֵעַ
  choice: pour qu’on puisse s’y étendre
  rationale: Rend l’action de s’allonger de tout son long ainsi que l’impossibilité pratique causée par la brièveté du lit.
- source_word: וְהַמַּסֵּכָה
  choice: et la couverture
  rationale: Dans cette image cohérente de literie, le nom désigne ce qui sert à se couvrir; « couverture » convient sans imposer un type d’étoffe précis.
- source_word: צָרָה
  choice: trop étroite
  rationale: L’adjectif exprime une largeur insuffisante pour l’usage envisagé; « trop étroite » explicite cette insuffisance en français idiomatique.
- source_word: כְּהִתְכַּנֵּס
  choice: pour qu’on puisse s’en envelopper
  rationale: Le verbe décrit ici le fait de ramener la couverture autour de soi. La formulation conserve le sens réfléchi dans un français naturel.
