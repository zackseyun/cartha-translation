  text: כִּ֣י לֹ֤א בֶֽ/חָרוּץ֙ י֣וּדַשׁ קֶ֔צַח וְ/אוֹפַ֣ן עֲגָלָ֔ה עַל כַּמֹּ֖ן יוּסָּ֑ב כִּ֧י בַ/מַּטֶּ֛ה יֵחָ֥בֶט קֶ֖צַח וְ/כַמֹּ֥ן בַּ/שָּֽׁבֶט־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/027.yaml
  text: For black cumin is not threshed with a sledge[a], nor is a cart wheel rolled over cumin; rather, black cumin is beaten out with a staff[b], and cumin with a rod.
translation:
  language: fr
  text: Car on ne dépique pas la nigelle avec un traîneau à dépiquer, et l’on ne fait pas rouler la roue d’un chariot sur le cumin. On bat plutôt la nigelle avec un bâton, et le cumin avec une baguette.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’identification exacte de ces plantes n’est pas entièrement certaine : « nigelle » peut aussi être rendu par « cumin noir » et « cumin » a parfois été identifié au carvi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרוּץ
  choice: traîneau à dépiquer
  rationale: Dans ce contexte agricole, le terme désigne un instrument de battage muni d’éléments tranchants. « Traîneau à dépiquer » est le terme français précis et conserve l’image concrète.
- source_word: יוּדַשׁ
  choice: on ne foule pas
  rationale: Le hophal de דוש évoque le dépiquage par foulage ou écrasement. La tournure active indéfinie est naturelle en français et contraste avec le battage plus délicat de la seconde moitié.
- source_word: קֶצַח
  choice: nigelle
  rationale: Le végétal est généralement identifié à Nigella sativa. « Nigelle » est le nom botanique français courant et évite l’ambiguïté commerciale de « cumin noir ».
- source_word: אוֹפַן עֲגָלָה
  choice: la roue d’un chariot
  rationale: Rend directement le groupe construit « roue de chariot » dans un français naturel.
- source_word: יוּסָּב
  choice: on ne fait pas passer ... sur
  rationale: Le passif causatif de סבב décrit la roue que l’on fait circuler sur les graines. Cette formulation restitue clairement l’action agricole sans imposer un mouvement circulaire précis.
- source_word: כַּמֹּן
  choice: cumin
  rationale: « Cumin » est l’identification habituelle du terme hébreu; une autre identification botanique demeure possible et est signalée en note.
- source_word: מַטֶּה
  choice: bâton
  rationale: Le mot désigne ici un instrument de bois servant à frapper. « Bâton » convient au geste agricole et reste distinct du terme parallèle שֵׁבֶט.
- source_word: יֵחָבֶט
  choice: on bat
  rationale: חבט désigne le fait de battre les produits récoltés pour en dégager les graines. Le contexte rend le résultat suffisamment clair sans ajout explicatif.
- source_word: שֵׁבֶט
  choice: baguette
  rationale: Dans ce contexte, « baguette » exprime un instrument plus léger et préserve la distinction avec מַטֶּה, rendu par « bâton ».
- source_word: כִּי ... כִּי
  choice: Car ... plutôt
  rationale: Le premier כִּי introduit l’explication; le second oppose la méthode appropriée aux procédés précédemment écartés. « Plutôt » rend cette opposition idiomatiquement.
