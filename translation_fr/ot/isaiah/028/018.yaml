revisions:
- from: Votre alliance avec la Mort sera annulée, et votre accord avec le shéol[a] ne tiendra pas. Quand le fléau déferlant[b] passera, vous serez pour lui un sol à piétiner.
  to: Votre alliance avec la Mort sera annulée, et votre accord avec le Shéol ne tiendra pas. Lorsque le fléau qui déferle traversera, vous serez foulés aux pieds par lui.[a]
  rationale: La révision retire l’ajout imagé et peu naturel de « sol », explicite le déplacement destructeur du fléau par « traversera » et emploie une construction française idiomatique pour le piétinement. Les deux précisions lexicales sont regroupées sous une note placée à la fin de la phrase afin d’éviter une surcharge d’appels tout en restant rattachées à la proposition qui contient les deux expressions.
