base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/018.yaml
  text: And your covenant with death will be annulled[a], and your agreement with Sheol will not stand; when the overwhelming scourge passes through[b], you will become a trampling place for it.
translation:
  language: fr
  text: Votre alliance avec la Mort sera annulée, et votre accord avec le Shéol ne tiendra pas. Lorsque le fléau qui déferle traversera, vous serez foulés aux pieds par lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression hébraïque associe l’image d’un fouet ou d’un fléau à une force qui déferle comme une crue. Le Shéol est le terme hébreu désignant le domaine des morts ; on peut aussi traduire, selon le contexte, « le séjour des morts » ou, plus étroitement, « la tombe ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻפַּר
  choice: sera annulée
  rationale: Dans ce contexte d’alliance, le passif indique que l’accord sera rendu caduc. « Annulée » exprime clairement cette portée juridique sans introduire ici le sens cultuel d’expiation que la racine peut avoir ailleurs.
- source_word: בְּרִיתְכֶם
  choice: votre alliance
  rationale: « Alliance » conserve le terme formel du texte hébreu et son emploi ironique pour un pacte conclu avec la Mort.
- source_word: אֶת־מָוֶת
  choice: avec la Mort
  rationale: La construction désigne une alliance avec la mort. La majuscule rend perceptible la personnification, en parallèle avec le shéol, sans en faire une affirmation doctrinale supplémentaire.
- source_word: חָזוּתְכֶם
  choice: votre accord
  rationale: En parallèle avec « alliance » et suivi du shéol, le mot désigne ici un arrangement ou un pacte plutôt qu’une vision. « Accord » est naturel et maintient la variation lexicale.
- source_word: שְׁאוֹל
  choice: le shéol
  rationale: La translittération préserve la notion hébraïque du domaine des morts, plus large qu’une tombe individuelle, ainsi que son parallélisme avec la Mort personnifiée.
- source_word: לֹא תָקוּם
  choice: ne tiendra pas
  rationale: Dans le cas d’un accord, קום signifie rester valable ou subsister. « Ne tiendra pas » est idiomatique et garde l’image d’un pacte incapable de demeurer en vigueur.
- source_word: שׁוֹט שׁוֹטֵף
  choice: le fléau déferlant
  rationale: « Fléau » rend l’instrument de châtiment et « déferlant » sa force envahissante, comparable à celle d’une crue. La formule reste concise tout en conservant l’image mixte de l’hébreu.
- source_word: יַעֲבֹר
  choice: passera
  rationale: Le verbe décrit le fléau qui traverse le pays et atteint les destinataires. « Passera » est simple et naturel dans cette proposition temporelle.
- source_word: וִהְיִיתֶם לוֹ לְמִרְמָס
  choice: vous serez pour lui un sol à piétiner
  rationale: 'Cette formulation conserve la relation exprimée par לוֹ et l’image nominale de מִרְמָס : les destinataires deviennent ce que le fléau foule aux pieds. « Un sol à piétiner » est concret et plus naturel que le calque « un piétinement ».'
theological_decisions:
- issue: Personnification de la mort et du shéol
  choice: Conserver la Mort et le shéol comme puissances personnifiées dans le texte principal.
  alternative: Rendre l’image de manière moins personnifiée par « la mort » et « la tombe ».
  rationale: Le verset tourne en dérision la sécurité recherchée par Juda en parlant d’une alliance avec la Mort et d’un accord avec le shéol. Cette personnification reproduit la rhétorique hébraïque sans préciser le statut ontologique de ces réalités.
- issue: Traduction de שְׁאוֹל
  choice: Employer « le shéol » dans le texte principal.
  alternative: Employer « le séjour des morts » ou « la tombe ».
  rationale: « Shéol » maintient l’arrière-plan conceptuel hébraïque et l’ambiguïté du terme. « La tombe » en réduirait la portée, tandis que « le séjour des morts » constitue une explicitation utile en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La syntaxe garde le parallélisme entre l’alliance avec la Mort et l’accord avec le shéol. « Déferlant » préserve l’énergie poétique de l’image, tandis que « un sol à piétiner » conserve son résultat concret sans lourdeur excessive.
