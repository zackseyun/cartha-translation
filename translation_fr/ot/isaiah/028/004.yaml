    issue: La construction « la fleur fanée, sa beauté magnifique » transforme un rapport génitival en apposition.
    rationale: Le groupe hébreu désigne la fleur fanée de la beauté/splendeur glorieuse, non une simple apposition où la fleur serait identifiée à « sa beauté magnifique ». Employer « de » préserve plus exactement le lien syntaxique et l’image.
