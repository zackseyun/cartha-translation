source:
  edition: WLC
  text: וְֽ/הָ֨יְתָ֜ה צִיצַ֤ת נֹבֵל֙ צְבִ֣י תִפְאַרְתּ֔/וֹ אֲשֶׁ֥ר עַל רֹ֖אשׁ גֵּ֣יא שְׁמָנִ֑ים כְּ/בִכּוּרָהּ֙ בְּ/טֶ֣רֶם קַ֔יִץ אֲשֶׁ֨ר יִרְאֶ֤ה הָֽ/רֹאֶה֙ אוֹתָ֔/הּ בְּ/עוֹדָ֥/הּ בְּ/כַפּ֖/וֹ יִבְלָעֶֽ/נָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/004.yaml
  text: 'And the fading flower of his glorious beauty[a], which is on the head of the fertile valley, will be like an early fig before summer: whoever sees it, while it is still in his palm[b], swallows it down.'
translation:
  language: fr
  text: 'Et la fleur fanée de sa beauté splendide, qui se trouve au sommet de la vallée fertile, sera comme une figue précoce avant l’été : dès que quelqu’un l’aperçoit, il l’avale alors qu’elle est encore dans sa paume.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִיצַת נֹבֵל
  choice: la fleur fanée
  rationale: Le syntagme associe l’image de la fleur au participe נֹבֵל, « qui se fane ». « La fleur fanée » conserve cette image dans un français naturel.
- source_word: צְבִי תִפְאַרְתּוֹ
  choice: sa beauté magnifique
  rationale: Les deux noms expriment la beauté et la splendeur, tandis que le suffixe est rendu par « sa ». Cette formulation garde l’intensification esthétique sans lourdeur excessive.
- source_word: גֵּיא שְׁמָנִים
  choice: la vallée fertile
  rationale: Littéralement « vallée des richesses/graisses », l’expression évoque une vallée riche et féconde. « Fertile » transmet clairement cet idiome.
- source_word: כְּבִכּוּרָהּ בְּטֶרֶם קַיִץ
  choice: comme une figue précoce avant l’été
  rationale: בִּכּוּרָה désigne un premier fruit mûr et, dans ce contexte agricole, vraisemblablement une figue précoce. L’image de la maturation avant l’été est conservée.
- source_word: אֲשֶׁר יִרְאֶה הָרֹאֶה אוֹתָהּ
  choice: dès que quelqu’un l’aperçoit
  rationale: La répétition hébraïque du verbe « voir » met en relief l’immédiateté. « Dès que » relie naturellement la découverte du fruit à sa consommation instantanée.
- source_word: בְּעוֹדָהּ בְּכַפּוֹ
  choice: alors qu’elle est encore dans sa paume
  rationale: כַּף désigne précisément la paume, et בְּעוֹדָהּ marque que le fruit s’y trouve encore. Le rendu préserve la vivacité concrète de la scène.
- source_word: יִבְלָעֶנָּה
  choice: il l’avale
  rationale: Le verbe בלע signifie « avaler » et suggère ici une consommation rapide. Le présent français convient à la comparaison générale introduite par le futur.
- source_word: וְהָיְתָה
  choice: sera
  rationale: La forme verbale introduit ce que deviendra la fleur dans la comparaison. Le futur « sera » est direct et adapté au contexte prophétique.
theological_decisions: []
