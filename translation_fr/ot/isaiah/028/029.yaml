source:
  edition: WLC
  text: גַּם זֹ֕את מֵ/עִ֛ם יְהוָ֥ה צְבָא֖וֹת יָצָ֑אָה הִפְלִ֣יא עֵצָ֔ה הִגְדִּ֖יל תּוּשִׁיָּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/029.yaml
  text: This also has come from Yahweh of hosts[a]; he is wonderful in counsel and great in wisdom.
translation:
  language: fr
  text: 'Cela aussi vient de Yahweh des armées : son conseil est merveilleux, et sa sagesse, immense[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa sagesse efficace » ou « son ingéniosité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם זֹאת
  choice: Cela aussi
  rationale: Cette expression rattache la conclusion à l’image agricole précédente et conserve la valeur additive de גַּם.
- source_word: מֵעִם יְהוָה צְבָאוֹת יָצָאָה
  choice: vient de Yahweh des armées
  rationale: Le verbe יָצָאָה avec מֵעִם indique que cette manière d’agir a sa source en Yahweh. Le présent français énonce naturellement cette provenance durable dans le contexte.
- source_word: הִפְלִיא עֵצָה
  choice: son conseil est merveilleux
  rationale: La formulation prédicative française restitue l’excellence extraordinaire exprimée par le hiphil de פלא appliqué à עֵצָה, sans réduire ce dernier à un simple avis.
- source_word: הִגְדִּיל תּוּשִׁיָּה
  choice: sa sagesse, immense
  rationale: Cette tournure poétique rend le parallélisme et la grandeur exprimée par הִגְדִּיל. « Sagesse » demeure clair, tandis que la note signale la dimension pratique et efficace de תּוּשִׁיָּה.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre divin est translittéré afin de préserver explicitement le nom d’alliance présent dans le texte hébreu.
- issue: Rendu du titre צְבָאוֹת
  choice: des armées
  alternative: tout-puissant
  rationale: « Des armées » conserve l’imagerie concrète du titre hébreu au lieu de l’interpréter directement comme une affirmation abstraite de toute-puissance.
translation_notes:
  register: Français international moderne, sobre et poétique. Le parallélisme nominal produit une conclusion sentencieuse naturelle, tout en conservant la tension entre conseil délibératif et sagesse pratique.
