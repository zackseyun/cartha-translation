id: ISA.28.14
reference: Isaiah 28:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה אַנְשֵׁ֣י לָצ֑וֹן מֹֽשְׁלֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה אֲשֶׁ֖ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/014.yaml
  text: Therefore hear the word of Yahweh[a], you scoffing men, rulers of this people who are in Jerusalem.
translation:
  language: fr
  text: C’est pourquoi, écoutez la parole de Yahweh, hommes railleurs[a], dirigeants de ce peuple qui est à Jérusalem[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « hommes de raillerie »; on pourrait aussi traduire : « moqueurs » ou « hommes moqueurs ».'
    reason: La tournure nominale hébraïque admet plusieurs rendus naturels en français.
  - marker: b
    text: 'La proposition peut aussi être comprise ainsi : « dirigeants de ce peuple, vous qui êtes à Jérusalem ».'
    reason: Le rattachement exact de la proposition relative est ambigu.
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Ce connecteur marque la conséquence tirée du contexte précédent et conserve le mouvement argumentatif de l’oracle.
- source_word: שִׁמְעוּ
  choice: écoutez
  rationale: L’impératif pluriel appelle à entendre avec attention, sans expliciter outre mesure l’idée d’obéissance que le verbe peut impliquer.
- source_word: דְבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » maintient la formule prophétique et « Yahweh » rend le nom divin personnel plutôt que de lui substituer un titre.
- source_word: אַנְשֵׁי לָצוֹן
  choice: hommes railleurs
  rationale: Cette expression naturelle en français conserve le nom masculin « hommes » et caractérise ces dirigeants par leur attitude de raillerie.
- source_word: מֹשְׁלֵי
  choice: dirigeants de
  rationale: Le participe désigne ceux qui exercent le pouvoir; « dirigeants » convient au contexte politique sans préciser indûment leur fonction.
- source_word: הָעָם הַזֶּה
  choice: ce peuple
  rationale: Le singulier démonstratif hébreu est rendu directement, avec le ton de l’interpellation prophétique.
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: qui est à Jérusalem
  rationale: La proposition relative est rattachée dans le texte principal à son antécédent grammatical le plus proche, « ce peuple », tout en signalant l’autre rattachement possible en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. Sa translittération préserve cette fonction sans le remplacer par un titre.
- issue: Portée masculine de אַנְשֵׁי
  choice: hommes railleurs
  alternative: railleurs
  rationale: Le contexte vise les dirigeants masculins de Jérusalem; conserver « hommes » reflète explicitement la forme hébraïque sans généraliser l’adresse.
- issue: Rattachement de la relative אֲשֶׁר בִּירוּשָׁלִָם
  choice: elle qualifie « ce peuple »
  alternative: elle précise que les dirigeants sont à Jérusalem
  rationale: Le pronom relatif peut grammaticalement reprendre le groupe immédiatement précédent, mais la localisation peut aussi porter pragmatiquement sur les dirigeants interpellés. La note maintient cette ambiguïté.
translation_notes:
  register: Français moderne, clair et solennel. La syntaxe conserve l’interpellation prophétique et les appositions du texte hébreu, tout en évitant un calque excessivement lourd.
