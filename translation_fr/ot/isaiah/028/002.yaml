  text: הִנֵּ֨ה חָזָ֤ק וְ/אַמִּץ֙ לַֽ/אדֹנָ֔/י כְּ/זֶ֥רֶם בָּרָ֖ד שַׂ֣עַר קָ֑טֶב כְּ֠/זֶרֶם מַ֣יִם כַּבִּירִ֥ים שֹׁטְפִ֛ים הִנִּ֥יחַ לָ/אָ֖רֶץ בְּ/יָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/002.yaml
  text: Behold[a], the Lord has one who is mighty and strong; like a storm of hail, a destroying tempest, like a storm of mighty, overflowing waters[b], he casts it down to the earth with his hand.
translation:
  language: fr
  text: 'Voici[a] : le Seigneur dispose de quelqu’un de fort et de puissant ; tel une tempête de grêle, une tourmente dévastatrice, tel un flot d’eaux puissantes et déferlantes, il la jette à terre de sa main[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Car le Seigneur a quelqu’un de fort et de puissant. » L’expression hébraïque peut souligner que cet agent appartient au Seigneur ou se tient prêt à le servir.'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu ne précise pas l’objet du verbe ; « la » renvoie vraisemblablement à la couronne évoquée au verset précédent. On pourrait aussi traduire : « il l’abat à terre de sa main ».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Marque une annonce prophétique vive et solennelle tout en restant naturelle en français moderne.
- source_word: חָזָק וְאַמִּץ
  choice: fort et puissant
  rationale: Les deux adjectifs cumulent leur force et décrivent sans la nommer précisément la personne dont le Seigneur dispose.
- source_word: לַאדֹנָי
  choice: le Seigneur a quelqu’un
  rationale: Le datif exprime ici vraisemblablement l’appartenance ou la disponibilité de cet agent pour le Seigneur. Cette tournure française transmet ce rapport sans identifier l’agent.
- source_word: כְּזֶרֶם בָּרָד
  choice: pareil à une tempête de grêle
  rationale: זֶרֶם évoque une violente averse ou tempête; la comparaison météorologique et la grêle sont conservées.
- source_word: שַׂעַר קָטֶב
  choice: une tourmente dévastatrice
  rationale: La formulation restitue une tempête caractérisée par la destruction, sans réduire l’image à un simple vent violent.
- source_word: מַיִם כַּבִּירִים שֹׁטְפִים
  choice: des eaux puissantes et déferlantes
  rationale: « puissantes » exprime la force ou l’abondance de כַּבִּירִים, tandis que « déferlantes » rend le mouvement envahissant et irrésistible de שֹׁטְפִים.
- source_word: הִנִּיחַ לָאָרֶץ
  choice: il la jette à terre
  rationale: Dans cette scène de jugement, le hiphil décrit une mise à terre. Le pronom féminin reprend naturellement la couronne évoquée au verset précédent, tout en laissant la référence expliquée en note.
- source_word: בְּיָד
  choice: de sa main
  rationale: Conserve l’image anthropomorphique d’une action directe exercée par l’agent du Seigneur.
theological_decisions:
- issue: Identité de l’être fort et puissant
  choice: « quelqu’un de fort et de puissant », sans identification supplémentaire
  alternative: L’Assyrie ou son roi; un agent indéterminé du jugement divin; le Seigneur lui-même représenté par la tempête
  rationale: Le texte hébreu ne nomme pas cet agent dans le verset. La traduction préserve cette indétermination, même si le contexte suggère un instrument du jugement du Seigneur.
- issue: Sujet et objet de la dernière proposition
  choice: Le sujet reste l’agent fort et puissant; « la » renvoie contextuellement à la couronne du verset 1
  alternative: Faire du Seigneur le sujet; laisser l’objet entièrement inexprimé; traduire « il l’abat »
  rationale: Le verbe masculin singulier permet naturellement de poursuivre avec l’agent annoncé. L’hébreu omet l’objet, mais le français appelle ici un complément; le féminin reprend la couronne sans l’insérer explicitement dans ce verset.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le rythme accumulatif des comparaisons et la violence des images de tempête sont préservés; l’identité de l’agent demeure volontairement indéterminée.
