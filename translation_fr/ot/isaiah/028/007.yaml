source:
  edition: WLC
  text: וְ/גַם אֵ֨לֶּה֙ בַּ/יַּ֣יִן שָׁג֔וּ וּ/בַ/שֵּׁכָ֖ר תָּע֑וּ כֹּהֵ֣ן וְ/נָבִיא֩ שָׁג֨וּ בַ/שֵּׁכָ֜ר נִבְלְע֣וּ מִן הַ/יַּ֗יִן תָּעוּ֙ מִן הַ/שֵּׁכָ֔ר שָׁגוּ֙ בָּֽ/רֹאֶ֔ה פָּק֖וּ פְּלִילִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/007.yaml
  text: 'And even these reel with wine and stagger from strong drink: priest and prophet reel with strong drink[a], they are swallowed up by wine, they stagger from strong drink; they reel in vision[b], they totter in judgment.'
translation:
  language: fr
  text: Et ceux-ci aussi titubent sous l’effet du vin et chancellent sous l’effet de la boisson enivrante. Prêtre et prophète titubent sous l’effet de la boisson enivrante ; ils sont engloutis par le vin, ils chancellent sous l’effet de la boisson enivrante. Ils s’égarent dans leurs visions[a] et trébuchent dans leurs jugements[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ce qu’ils voient ». Le terme hébreu peut désigner la perception visuelle ou, dans ce contexte, la vision prophétique.
    reason: lexical_alternative
  - marker: b
    text: Ou « lorsqu’ils rendent la justice », « dans leurs décisions judiciaires ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֵלֶּה
  choice: Mais ceux-là aussi
  rationale: Cette formulation naturelle conserve à la fois le lien avec le contexte, la désignation du groupe visé et la valeur additive et emphatique de וְגַם.
- source_word: בַּיַּיִן
  choice: sous l’effet du vin
  rationale: Dans ce contexte d’ivresse, ב indique la cause ou le moyen. Cette tournure française exprime clairement l’emprise du vin sans alourdir la phrase.
- source_word: שָׁגוּ
  choice: titubent / s’égarent
  rationale: Le verbe peut décrire aussi bien une démarche chancelante qu’un égarement. « Titubent » convient aux premières occurrences liées à l’ivresse, tandis que « s’égarent » fait ressortir la défaillance de la perception visionnaire dans la dernière proposition.
- source_word: שֵׁכָר
  choice: boissons enivrantes
  rationale: Le terme désigne une boisson alcoolisée autre que le vin. Cette expression moderne et générale évite de préciser sans preuve une boisson particulière.
- source_word: תָּעוּ
  choice: chancellent
  rationale: Le verbe signifie errer ou aller à l’aventure ; dans le tableau concret de l’ivresse, « chancellent » rend naturellement l’instabilité physique tout en laissant entendre la désorientation.
- source_word: כֹּהֵן וְנָבִיא
  choice: Prêtre et prophète
  rationale: Les deux singuliers ont ici une valeur collective et désignent ces catégories de responsables religieux.
- source_word: נִבְלְעוּ מִן הַיַּיִן
  choice: engloutis par le vin
  rationale: La traduction conserve l’image forte du verbe נבלע, selon laquelle le vin les a pour ainsi dire avalés et dominés.
- source_word: בָּרֹאֶה
  choice: dans leurs visions
  rationale: Le mot peut renvoyer au fait de voir ou à une vision prophétique. La présence du prophète favorise ici « visions », tandis que la note signale l’ambiguïté.
- source_word: פָּקוּ
  choice: trébuchent
  rationale: Le verbe évoque une perte d’équilibre. Le choix maintient l’image de l’ivresse tout en l’appliquant à l’exercice du jugement.
- source_word: פְּלִילִיָּה
  choice: dans leurs jugements
  rationale: Le nom concerne la décision ou l’activité judiciaire. « Jugements » reste concis et conserve la portée institutionnelle possible.
theological_decisions:
- issue: Faut-il expliciter les fonctions prophétique et judiciaire dans les deux dernières propositions ?
  choice: Ils s’égarent dans leurs visions et trébuchent dans leurs jugements.
  alternative: Ils s’égarent dans leurs visions prophétiques et trébuchent lorsqu’ils rendent la justice.
  rationale: L’hébreu est bref et laisse une certaine latitude quant à la vision et au jugement. Le texte principal garde cette concision et cette tension, tandis que les notes indiquent les lectures plus explicites.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Les répétitions du vin et des boissons enivrantes sont maintenues pour préserver l’insistance accusatrice et le rythme du texte hébreu. Les deux dernières images conservent le passage de l’instabilité physique à la défaillance dans les responsabilités religieuses et judiciaires.
