  text: לֶ֣חֶם יוּדָ֔ק כִּ֛י לֹ֥א לָ/נֶ֖צַח אָד֣וֹשׁ יְדוּשֶׁ֑/נּוּ וְ֠/הָמַם גִּלְגַּ֧ל עֶגְלָת֛/וֹ וּ/פָרָשָׁ֖י/ו לֹֽא יְדֻקֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/028.yaml
  text: Bread grain is crushed[a], but not forever does one keep threshing it; though the wheel of his cart and his horses rumble over it[b], he does not crush it fine.
translation:
  language: fr
  text: Le grain destiné au pain est broyé[a], mais on ne le bat pas indéfiniment. Même si l’on y fait passer la roue de son chariot et ses chevaux[b], on ne le réduit pas en poudre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le grain à pain est broyé ». Le mot hébreu traduit habituellement par « pain » désigne ici le grain destiné à devenir du pain.
    reason: lexical_alternative
  - marker: b
    text: Ou « ses cavaliers ». Le terme hébreu peut désigner des cavaliers dans certains contextes, mais « chevaux » convient mieux à cette scène agricole.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: le grain destiné au pain
  rationale: Dans ce contexte agricole, « pain » désigne par métonymie le grain dont on fera du pain. Cette formulation rend le sens sans perdre l’image concrète.
- source_word: יוּדָק
  choice: est broyé
  rationale: Le verbe דקק exprime l’action de broyer ou de rendre fin. « Broyé » convient au traitement du grain et permet de reprendre l’idée à la fin du verset.
- source_word: כִּי
  choice: mais
  rationale: 'La particule introduit ici une nuance explicative et contrastive : le grain est certes broyé, mais le battage ne se prolonge pas sans fin.'
- source_word: לֹא לָנֶצַח
  choice: pas indéfiniment
  rationale: L’expression signifie littéralement « pas pour toujours » ; dans ce contexte procédural, « pas indéfiniment » est naturel et précis.
- source_word: אָדוֹשׁ יְדוּשֶׁנּוּ
  choice: on ne le bat pas
  rationale: L’infinitif absolu associé à l’imparfait renforce l’idée verbale. Avec la négation et « indéfiniment », le français exprime clairement qu’on ne continue pas à battre le grain sans fin. Le sujet indéfini « on » préserve la portée générale.
- source_word: וְהָמַם
  choice: Même si l’on fait passer sur lui
  rationale: Le verbe peut évoquer le bruit, l’agitation ou une action violente. Dans l’image agricole, la construction française met en avant le passage bruyant de l’attelage sans imposer une nuance psychologique étrangère au contexte.
- source_word: גִּלְגַּל עֶגְלָתוֹ
  choice: la roue du chariot
  rationale: La traduction conserve le rapport construit entre « roue » et « chariot » et reste immédiatement compréhensible.
- source_word: וּפָרָשָׁיו
  choice: les chevaux
  rationale: Bien que le terme puisse désigner des cavaliers, « chevaux » s’accorde mieux ici avec le chariot et la scène de battage. Une note conserve l’autre possibilité lexicale.
- source_word: לֹא יְדֻקֶּנּוּ
  choice: on ne le réduit pas en poudre
  rationale: 'La reprise de דקק précise la limite du traitement : le grain n’est pas pulvérisé. Cette formulation française rend explicitement le degré impliqué.'
theological_decisions: []
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le rythme proverbial est conservé par deux propositions contrastées. « Battre » est employé au sens agricole courant, et « réduire en poudre » clarifie la limite du broyage.
