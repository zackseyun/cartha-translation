  text: וְ/הָיָ֨ה לָ/הֶ֜ם דְּבַר יְהוָ֗ה צַ֣ו לָ/צָ֞ו צַ֤ו לָ/צָו֙ קַ֤ו לָ/קָו֙ קַ֣ו לָ/קָ֔ו זְעֵ֥יר שָׁ֖ם זְעֵ֣יר שָׁ֑ם לְמַ֨עַן יֵלְכ֜וּ וְ/כָשְׁל֤וּ אָחוֹר֙ וְ/נִשְׁבָּ֔רוּ וְ/נוֹקְשׁ֖וּ וְ/נִלְכָּֽדוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/013.yaml
  text: So the word of Yahweh will be to them[a], “Order on order, order on order, line on line, line on line, a little here, a little there,” so that they may go, and stumble backward, and be broken, and snared, and captured.
translation:
  language: fr
  text: 'Ainsi, la parole de Yahweh sera pour eux : « Ordre sur ordre, ordre sur ordre, ligne sur ligne, ligne sur ligne, un peu ici, un peu là »[a], afin qu’ils aillent, trébuchent en arrière, soient brisés, pris au piège et capturés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « commandement sur commandement, commandement sur commandement ». Traduction traditionnelle : « précepte sur précepte, précepte sur précepte ». L’hébreu est très concis et imite probablement une répétition moqueuse ou enfantine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָהֶם
  choice: Ainsi, ... sera pour eux
  rationale: Le waw avec היה exprime ici la conséquence du contexte précédent. « Ainsi » rend ce lien, tandis que « sera pour eux » conserve la construction hébraïque et sa portée judiciaire.
- source_word: דְּבַר יְהוָה
  choice: la parole de Yahweh
  rationale: « Parole » maintient l’idiome prophétique de דָּבָר, et « Yahweh » rend le nom divin personnel יְהוָה.
- source_word: צַו לָצָו צַו לָצָו
  choice: Ordre sur ordre, ordre sur ordre
  rationale: La formule difficile et saccadée semble imiter une répétition moqueuse ou enfantine. « Ordre » correspond plausiblement à un nom lié à צוה sans moderniser excessivement l’expression.
- source_word: קַו לָקָו קַו לָקָו
  choice: ligne sur ligne, ligne sur ligne
  rationale: קַו désigne couramment une ligne, notamment une ligne de mesure. La traduction conserve la brièveté, le parallélisme et la répétition.
- source_word: זְעֵיר שָׁם זְעֵיר שָׁם
  choice: un peu ici, un peu là
  rationale: Cette tournure distributive est rendue par une expression française naturelle tout en gardant sa cadence répétitive.
- source_word: לְמַעַן
  choice: afin que
  rationale: La locution introduit un but ou un résultat. « Afin que » préserve la force troublante et judiciaire du lien sans la réduire à une simple conséquence descriptive.
- source_word: יֵלְכוּ וְכָשְׁלוּ אָחוֹר
  choice: qu’ils aillent, trébuchent en arrière
  rationale: הלך signifie « aller » et כשל évoque le fait de trébucher ou de chanceler; אָחוֹר précise le mouvement vers l’arrière.
- source_word: וְנִשְׁבָּרוּ
  choice: soient brisés
  rationale: Le niphal de שבר a ici un sens passif. « Être brisés » conserve l’image et la portée judiciaire sans l’intensifier.
- source_word: וְנוֹקְשׁוּ
  choice: pris au piège
  rationale: Le verbe יקשׁ évoque le fait d’être pris dans un piège. Cette formulation est claire en français moderne et conserve la métaphore.
- source_word: וְנִלְכָּדוּ
  choice: capturés
  rationale: לכד signifie saisir ou capturer. « Capturés » distingue le dernier terme de l’image précédente du piège et préserve la progression.
theological_decisions:
- issue: But ou résultat judiciaire de la proposition finale
  choice: La parole de Yahweh devient pour eux un moyen de jugement, afin qu’ils avancent vers leur chute.
  alternative: La proposition pourrait seulement décrire leur perception moqueuse du discours prophétique et la conséquence qui s’ensuit.
  rationale: Le contexte immédiat et לְמַעַן suivi de la série verbale donnent à la phrase une force de but ou de résultat judiciaire. La traduction garde cette tension sans expliquer davantage l’action divine.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition abrupte de l’hébreu est volontairement maintenue. La série finale reste compacte pour reproduire l’accumulation des conséquences judiciaires.
