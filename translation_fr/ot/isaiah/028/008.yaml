  text: For all the tables are full of vomit and filth, with no place left.
translation:
  language: fr
  text: Car toutes les tables sont couvertes de vomissures et d’excréments, sans qu’il reste de place.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִיא
  choice: vomissures
  rationale: Rend directement le terme concret désignant ce qui a été vomi, dans un registre naturel mais suffisamment digne.
- source_word: צֹאָה
  choice: excréments
  rationale: Conserve la crudité de l’image hébraïque sans recourir à un terme familier ou à l’atténuation plus vague « saleté ».
- source_word: בְּלִי מָקוֹם
  choice: il ne reste aucune place propre
  rationale: 'L’expression elliptique signifie littéralement « sans endroit/place ». Dans le contexte de tables entièrement souillées, « propre » explicite sobrement l’idée implicite : aucun emplacement n’est épargné.'
theological_decisions:
- issue: Portée de בְּלִי מָקוֹם
  choice: il ne reste aucune place propre
  alternative: sans aucune place
  rationale: Le français exige une formulation plus complète. L’ajout contextuel de « propre » décrit l’étendue totale de la souillure sans introduire d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, concret et digne. La violence répugnante de l’image prophétique est conservée, avec une syntaxe fluide et sans atténuation confessionnelle.
