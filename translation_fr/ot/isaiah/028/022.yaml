revisions:
- from: Maintenant donc, ne vous moquez pas, de peur que vos liens ne se resserrent. Car j’ai entendu, de la part du Seigneur Yahweh, le maître des armées[a], l’annonce d’une destruction totale, décrétée contre tout le pays[b].
  to: Maintenant donc, ne vous moquez pas, de peur que vos liens ne se resserrent ; car j’ai appris de la part du Seigneur Yahweh des armées qu’une destruction totale est décrétée contre tout le pays[a].
  rationale: La révision conserve le sens et le registre du projet, mais rend le titre divin de manière plus proche de l’hébreu et reformule l’annonce entendue en français plus direct. La note sur l’étendue de הָאָרֶץ est maintenue afin de préserver l’ambiguïté entre « pays » et « terre ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T05:00:48Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : l’interdiction de se moquer, l’image de liens devenant plus contraignants, et l’annonce d’un jugement arrêté sont conservés. Toutefois, le titre divin hébreu אֲדֹנָי יְהוִה צְבָאוֹת est mieux rendu sans ajouter « le maître », qui explicite une relation absente de la formulation nominale hébraïque et alourdit le titre.'
  naturalness: 'Le français est globalement naturel et solennel. « J’ai entendu, de la part de… l’annonce » est cependant syntaxiquement pesant et ambigu : on peut comprendre que l’annonce est ce qui a été entendu, mais la construction est moins idiomatique. « J’ai appris de la part de… qu’une destruction… est décrétée » rend plus clairement la proposition entendue.'
  terminology: « Seigneur Yahweh » préserve correctement אֲדֹנָי יְהוִה. « Yahweh des armées » est le rendu français usuel, concis et suffisamment littéral de יְהוִה צְבָאוֹת dans ce titre composé. La note sur « des armées » n’est pas nécessaire si ce rendu est retenu, et son explication interprétative dépasse l’ambiguïté lexicale à préserver.
  issues:
  - severity: medium
    issue: « le maître des armées » ajoute une explicitation au titre divin.
    rationale: צְבָאוֹת est un pluriel dépendant du nom divin dans un titre conventionnel ; « Yahweh des armées » conserve la forme et évite d’introduire « maître », absent du texte.
  - severity: low
    issue: La construction « j’ai entendu, de la part de …, l’annonce » est lourde.
    rationale: Le parfait שָׁמַעְתִּי peut se rendre naturellement par « j’ai appris » dans cette annonce prophétique, suivi d’une complétive qui exprime clairement le contenu reçu.
  revised_text: Maintenant donc, ne vous moquez pas, de peur que vos liens ne se resserrent ; car j’ai appris de la part du Seigneur Yahweh des armées qu’une destruction totale est décrétée contre tout le pays[a].
  revised_footnotes:
