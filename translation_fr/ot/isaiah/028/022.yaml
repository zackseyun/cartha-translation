source:
  edition: WLC
  text: וְ/עַתָּה֙ אַל תִּתְלוֹצָ֔צוּ פֶּֽן יֶחְזְק֖וּ מֽוֹסְרֵי/כֶ֑ם כִּֽי כָלָ֨ה וְ/נֶחֱרָצָ֜ה שָׁמַ֗עְתִּי מֵ/אֵ֨ת אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת עַל כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/022.yaml
  text: So now[a], do not scoff, lest your bonds be made stronger[b]; for I have heard from the Lord GOD of Armies a complete destruction decreed against the whole land.
translation:
  language: fr
  text: Maintenant donc, ne vous moquez pas, de peur que vos liens ne se resserrent ; car j’ai appris de la part du Seigneur Yahweh des armées qu’une destruction totale est décrétée contre tout le pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute la terre ». Le mot hébreu peut désigner soit le pays, soit la terre entière.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maintenant donc
  rationale: Rend à la fois la transition marquée par וְ et l’urgence temporelle de עַתָּה, dans un français naturel.
- source_word: תִּתְלוֹצָצוּ
  choice: ne vous moquez pas
  rationale: Le verbe לוץ exprime ici une attitude de dérision arrogante; cette formulation conserve la force de l’interdiction sans employer un terme vieilli.
- source_word: פֶּן יֶחְזְקוּ מוֹסְרֵיכֶם
  choice: de peur que vos liens ne se resserrent
  rationale: פֶּן introduit la conséquence redoutée. מוֹסְרֵיכֶם garde l’image concrète de liens, et יֶחְזְקוּ indique qu’ils deviennent plus contraignants.
- source_word: כָלָה וְנֶחֱרָצָה
  choice: une destruction totale, décrétée
  rationale: Dans ce contexte de jugement, כָלָה désigne une fin complète ou destruction totale, tandis que le niphal נֶחֱרָצָה exprime une décision arrêtée ou un décret.
- source_word: שָׁמַעְתִּי מֵאֵת
  choice: j’ai entendu, de la part de
  rationale: Conserve l’image du prophète recevant auditivement un message dont Dieu est la source.
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur Yahweh, le maître des armées
  rationale: Préserve les deux éléments du titre divin, אֲדֹנָי et le nom propre יְהוִה, tandis que « maître des armées » exprime naturellement l’autorité associée à צְבָאוֹת.
- source_word: עַל כָּל הָאָרֶץ
  choice: contre tout le pays
  rationale: עַל prend ici une valeur adversative liée au jugement. Dans le contexte de Juda et de Jérusalem, הָאָרֶץ désigne probablement le pays, tout en pouvant aussi signifier la terre entière.
theological_decisions:
- issue: Rendu du titre divin אֲדֹנָי יְהוִה
  choice: le Seigneur Yahweh
  alternative: le Seigneur DIEU
  rationale: Le choix maintient distinctement le titre אֲדֹנָי et le nom divin יְהוִה, sans les fusionner ni remplacer le nom propre par un titre.
- issue: Référent de צְבָאוֹת
  choice: le maître des armées
  alternative: des armées
  rationale: La formulation principale explicite en français la relation de souveraineté implicite dans le titre, sans décider si les armées sont célestes, terrestres ou les deux.
- issue: Portée de הָאָרֶץ
  choice: tout le pays
  alternative: toute la terre
  rationale: Le contexte immédiat favorise le pays de Juda, mais le mot hébreu permet une portée universelle; cette ambiguïté est donc signalée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. La syntaxe reste proche du mouvement de l’hébreu, tout en évitant les tournures archaïques. « Liens » conserve la métaphore concrète du jugement; « se resserrent » en rend clairement l’intensification.
