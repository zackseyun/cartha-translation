  text: אֲשֶׁ֣ר אָמַ֣ר אֲלֵי/הֶ֗ם זֹ֤את הַ/מְּנוּחָה֙ הָנִ֣יחוּ לֶֽ/עָיֵ֔ף וְ/זֹ֖את הַ/מַּרְגֵּעָ֑ה וְ/לֹ֥א אָב֖וּא שְׁמֽוֹעַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/028/012.yaml
  text: to whom he said, “This is rest; give rest to the weary, and this is repose,” yet they were not willing to hear.
translation:
  language: fr
  text: 'À qui il avait dit : « Voici le repos : accordez du repos à celui qui est fatigué ; voici le répit », mais ils n’ont pas voulu écouter.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנוּחָה
  choice: le repos
  rationale: Équivalent direct et naturel, qui conserve l’idée d’un état ou lieu de repos.
- source_word: הָנִיחוּ
  choice: donnez du repos
  rationale: L’impératif causatif signifie faire reposer ou accorder du repos ; cette formulation préserve sa force verbale.
- source_word: לֶעָיֵף
  choice: à celui qui est épuisé
  rationale: עָיֵף désigne une personne lasse, fatiguée ou épuisée ; le singulier générique de l’hébreu est conservé.
- source_word: הַמַּרְגֵּעָה
  choice: le répit
  rationale: Le terme rare évoque le repos, l’apaisement ou le délassement ; « répit » le distingue de מְנוּחָה sans surinterpréter.
- source_word: וְלֹא אָבוּא שְׁמוֹעַ
  choice: Mais ils n’ont pas voulu écouter
  rationale: אָבוּ exprime le consentement ou la volonté ; la tournure française restitue explicitement leur refus d’écouter.
theological_decisions:
- issue: Identité de celui qui parle
  choice: Conserver le pronom « lui » sans ajouter « Dieu » ou « le Seigneur »
  alternative: Expliciter le locuteur comme Dieu ou le Seigneur
  rationale: Le verset dépend syntaxiquement du contexte précédent et le texte hébreu ne répète pas ici le nom du locuteur.
- issue: Nature du repos offert
  choice: Employer les termes ordinaires « repos » et « répit »
  alternative: Interpréter explicitement ce repos comme salut spirituel, sécurité politique ou observance religieuse
  rationale: Le texte garde une portée imagée et contextuelle qu’il ne convient pas de réduire à une seule lecture théologique.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « Voici… Voici… » conserve le parallélisme hébreu ; la ponctuation en deux phrases dans la citation rend l’exhortation claire sans modifier son contenu.
