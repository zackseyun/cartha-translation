  source_fidelity: 'La formulation initiale « lui qui leur avait dit » inverse la relation syntaxique de אשר אמר אליהם : l’hébreu signifie « à qui il avait dit », les destinataires étant le peuple évoqué dans le contexte. Le reste rend fidèlement le repos, l’impératif causatif « accordez/donnez du repos », le fatigué, et leur refus d’écouter.'
  naturalness: La révision est idiomatique en français moderne et conserve le parallélisme sobre de l’énoncé. « Accordez du repos » est naturel et exprime clairement la valeur causative de l’impératif.
  terminology: « Repos » pour מְנוּחָה et « répit » pour le rare מַרְגֵּעָה sont des choix recevables qui maintiennent une légère distinction sans imposer une interprétation théologique. « Celui qui est fatigué » est plus direct et moins intensifiant que « épuisé ».
  issues:
