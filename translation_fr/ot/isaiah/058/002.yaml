  terminology: « Justice », « droit », « jugements justes » et « voies » conviennent au contexte isaïen et au vocabulaire juridique et éthique du verset. « Proximité de Dieu » conserve la valeur nominale de l’expression hébraïque; la note doit présenter « s’approcher de Dieu » comme véritable alternative sans introduire la notion distincte d’« accès ».
