id: ISA.58.2
reference: Isaiah 58:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אוֹתִ֗/י י֥וֹם יוֹם֙ יִדְרֹשׁ֔וּ/ן וְ/דַ֥עַת דְּרָכַ֖/י יֶחְפָּצ֑וּ/ן כְּ/ג֞וֹי אֲשֶׁר צְדָקָ֣ה עָשָׂ֗ה וּ/מִשְׁפַּ֤ט אֱלֹהָי/ו֙ לֹ֣א עָזָ֔ב יִשְׁאָל֨וּ/נִי֙ מִשְׁפְּטֵי צֶ֔דֶק קִרְבַ֥ת אֱלֹהִ֖ים יֶחְפָּצֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/002.yaml
  text: Yet day after day they seek me[a], and they delight to know my ways, as if they were a nation that practiced righteousness and had not forsaken the justice of its God. They ask me for righteous judgments; they delight in the nearness of God.
translation:
  language: fr
  text: Pourtant, jour après jour, ils me cherchent et prennent plaisir à connaître mes voies, comme s’ils étaient une nation qui pratique la justice et n’abandonne pas le droit de son Dieu. Ils me demandent des jugements justes ; ils prennent plaisir à la proximité de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils prennent plaisir à s’approcher de Dieu ». L’expression hébraïque peut désigner soit la proximité de Dieu, soit le fait de s’approcher de lui.'
    reason: Lecture alternative rendue nécessaire par l’ambiguïté de קִרְבַת אֱלֹהִים.
lexical_decisions:
- source_word: וְאוֹתִי
  choice: Pourtant… me
  rationale: Dans le contexte de la dénonciation précédente, la conjonction prend une valeur adversative. « Pourtant » rend ce contraste tout en conservant Dieu comme objet direct de leur recherche.
- source_word: יוֹם יוֹם
  choice: jour après jour
  rationale: La répétition hébraïque exprime une action habituelle et continue ; cette tournure française en garde le relief.
- source_word: יִדְרֹשׁוּן
  choice: ils me cherchent
  rationale: Le verbe désigne ici le fait de rechercher Dieu, notamment par la consultation ou le culte. « Chercher » demeure naturel et suffisamment large.
- source_word: וְדַעַת דְּרָכַי יֶחְפָּצוּן
  choice: prennent plaisir à connaître mes voies
  rationale: Cette formulation conserve à la fois la notion de plaisir ou de désir portée par חפץ et celle de connaissance, dans un français actuel et digne.
- source_word: כְּגוֹי אֲשֶׁר
  choice: comme s’ils étaient une nation qui
  rationale: 'Le contexte donne à la comparaison une portée ironique : leurs pratiques religieuses les font paraître semblables à un peuple réellement juste, alors que le passage les accuse du contraire.'
- source_word: צְדָקָה עָשָׂה
  choice: pratique la justice
  rationale: « Pratiquer la justice » rend naturellement l’expression hébraïque « faire la justice » et souligne une conduite habituelle.
- source_word: וּמִשְׁפַּט אֱלֹהָיו לֹא עָזָב
  choice: n’abandonne pas le droit de son Dieu
  rationale: מִשְׁפָּט peut désigner le droit, la justice, une règle ou une décision. « Le droit de son Dieu » conserve ici l’idée de l’ordre juste établi par Dieu sans réduire le terme à une ordonnance particulière.
- source_word: יִשְׁאָלוּנִי
  choice: Ils me demandent
  rationale: Le verbe signifie demander ou interroger. Le français retenu est simple et laisse le complément préciser ce qui est sollicité.
- source_word: מִשְׁפְּטֵי צֶדֶק
  choice: des jugements justes
  rationale: La formule peut désigner des décisions conformes à la justice. Cette traduction est claire et conserve le lien lexical avec la justice mentionnée plus tôt.
- source_word: קִרְבַת אֱלֹהִים
  choice: la proximité de Dieu
  rationale: Le nom peut évoquer soit la proximité de Dieu, soit l’action de s’approcher de lui. « Proximité » respecte la forme nominale ; l’autre lecture est signalée en note.
- source_word: יֶחְפָּצוּן
  choice: ils prennent plaisir
  rationale: חפץ exprime le plaisir, le désir ou l’attrait. La même tournure aux deux occurrences met en valeur le parallélisme du verset.
theological_decisions:
- issue: Caractère ironique de la comparaison
  choice: « comme s’ils étaient une nation qui… »
  alternative: « comme une nation qui… »
  rationale: Le contexte prophétique dénonce l’écart entre leur ferveur affichée et leur conduite. La tournure retenue rend perceptible cette ironie contextuelle sans ajouter de jugement doctrinal.
- issue: Sens de קִרְבַת אֱלֹהִים
  choice: « la proximité de Dieu » dans le texte principal
  alternative: « s’approcher de Dieu » ou « l’accès auprès de Dieu »
  rationale: La construction hébraïque permet de comprendre soit la proximité de Dieu, soit la démarche humaine consistant à s’approcher de lui. Le texte principal garde la valeur nominale, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme est conservé par la reprise de « ils prennent plaisir », et le vocabulaire juridique reste accessible sans effacer la diversité sémantique de מִשְׁפָּט.
