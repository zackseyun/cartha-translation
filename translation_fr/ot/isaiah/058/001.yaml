id: ISA.58.1
reference: Isaiah 58:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: קְרָ֤א בְ/גָרוֹן֙ אַל תַּחְשֹׂ֔ךְ כַּ/שּׁוֹפָ֖ר הָרֵ֣ם קוֹלֶ֑/ךָ וְ/הַגֵּ֤ד לְ/עַמִּ/י֙ פִּשְׁעָ֔/ם וּ/לְ/בֵ֥ית יַעֲקֹ֖ב חַטֹּאתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/001.yaml
  text: Cry out with your throat[a]; do not hold back. Raise your voice like a trumpet, and declare to my people their rebellion[b], and to the house of Jacob their sins.
translation:
  language: fr
  text: Crie à pleine gorge, ne te retiens pas ! Élève ta voix comme une trompette[a] ; fais connaître à mon peuple sa révolte[b], et à la maison de Jacob ses péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme un cor de bélier ». Le shofar est un cor employé pour donner un signal ou faire une proclamation.
    reason: cultural_note
  - marker: b
    text: Ou « sa transgression ». Le terme hébreu peut souligner une rébellion délibérée contre Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא בְגָרוֹן
  choice: Crie à pleine gorge
  rationale: L’expression garde l’image corporelle de la gorge tout en rendant naturellement en français l’idée d’un cri puissant et public.
- source_word: אַל תַּחְשֹׂךְ
  choice: ne te retiens pas
  rationale: Cette formulation idiomatique exprime l’interdiction de modérer ou de retenir la proclamation.
- source_word: כַּשּׁוֹפָר
  choice: comme une trompette[a]
  rationale: « Trompette » communique clairement la fonction sonore et publique du shofar ; la nature précise de l’instrument est indiquée en note.
- source_word: הָרֵם קוֹלֶךָ
  choice: Élève ta voix
  rationale: Rend directement l’impératif hébreu dans un registre prophétique naturel et digne.
- source_word: וְהַגֵּד
  choice: fais connaître
  rationale: Exprime une communication explicite et autorisée sans ajouter l’idée plus accusatrice que pourrait porter « dénonce ».
- source_word: לְעַמִּי
  choice: à mon peuple
  rationale: Préserve directement la désignation relationnelle et l’expression d’appartenance.
- source_word: פִּשְׁעָם
  choice: sa révolte[b]
  rationale: 'פֶּשַׁע désigne ici plus qu’une faute générale : une rupture volontaire ou rebelle. Le singulier « sa » s’accorde naturellement avec le collectif français « mon peuple ».'
- source_word: וּלְבֵית יַעֲקֹב
  choice: et à la maison de Jacob
  rationale: Conserve la seconde désignation distincte et le parallélisme du texte hébreu.
- source_word: חַטֹּאתָם
  choice: ses péchés
  rationale: Le pluriel hébreu est maintenu ; le possessif singulier s’accorde naturellement avec « la maison de Jacob », comprise comme collectivité.
theological_decisions:
- issue: Rapport entre « mon peuple » et « la maison de Jacob »
  choice: Les deux expressions restent distinctes dans deux membres parallèles.
  alternative: Lire « la maison de Jacob » comme une simple apposition et fusionner les deux membres.
  rationale: L’hébreu présente deux compléments parallèles. Les conserver maintient à la fois l’intensité rhétorique de l’accusation et le langage d’alliance, sans imposer une identification théologique plus étroite.
- issue: Portée de פֶּשַׁע
  choice: révolte
  alternative: transgression
  rationale: « Révolte » conserve la dimension volontaire et relationnelle du terme, tandis que la note signale l’autre rendu possible sans réduire le mot à une faute générique.
translation_notes:
  register: Français international moderne, direct et solennel. « À pleine gorge » conserve la vigueur concrète de l’hébreu ; les impératifs brefs rendent l’urgence prophétique. La ponctuation distingue les ordres successifs sans alourdir la phrase.
