  variant: modern international French
source:
  edition: WLC
  text: אִם תָּשִׁ֤יב מִ/שַּׁבָּת֙ רַגְלֶ֔/ךָ עֲשׂ֥וֹת חֲפָצֶ֖י/ךָ בְּ/י֣וֹם קָדְשִׁ֑/י וְ/קָרָ֨אתָ לַ/שַּׁבָּ֜ת עֹ֗נֶג לִ/קְד֤וֹשׁ יְהוָה֙ מְכֻבָּ֔ד וְ/כִבַּדְתּ/וֹ֙ מֵ/עֲשׂ֣וֹת דְּרָכֶ֔י/ךָ מִ/מְּצ֥וֹא חֶפְצְ/ךָ֖ וְ/דַבֵּ֥ר דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/013.yaml
  text: If you turn back your foot from the Sabbath[a], from doing your own pleasure on my holy day, and call the Sabbath a delight, the holy thing of Yahweh honorable, and honor it by not going your own ways, nor seeking your own pleasure, nor speaking a word[c][b],
translation:
  language: fr
  text: Si tu détournes ton pied du sabbat[a], si tu renonces à faire ce qui te plaît en mon saint jour, si tu appelles le sabbat « un délice » et le jour saint de Yahweh « digne d’honneur », si tu l’honores[c] en ne suivant pas tes propres voies, en ne recherchant pas ce qui te plaît[d] et en ne prononçant pas une parole[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si tu détournes ton pied du sabbat ». L’image peut évoquer le fait de s’abstenir de fouler aux pieds ou de profaner le sabbat.'
    reason: literal_metaphor
  - marker: b
    text: 'Littéralement : « et parler une parole ». Dans ce contexte, il peut s’agir de s’abstenir de propos ordinaires, intéressés ou futiles.'
    reason: lexical_alternative
  - marker: c
    text: 'Le pronom peut aussi renvoyer à Yahweh plutôt qu’au sabbat ou au jour saint : « si tu l’honores », c’est-à-dire Yahweh.'
    reason: alternative_reading
  - marker: d
    text: L’expression traduite par « ce qui te plaît » peut aussi désigner « tes désirs », « tes occupations » ou « tes affaires personnelles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב מִשַּׁבָּת רַגְלֶךָ
  choice: tu retiens ton pied le jour du sabbat
  rationale: Cette formulation conserve l’image concrète du pied que l’on retient tout en exprimant naturellement l’idée de s’abstenir de traiter le sabbat comme un jour ordinaire. La préposition hébraïque permet une nuance d’éloignement que la note explicite.
- source_word: עֲשׂוֹת חֲפָצֶיךָ
  choice: faire ce qui te plaît
  rationale: חֵפֶץ peut désigner le plaisir, le désir, l’occupation ou les affaires personnelles. La tournure choisie reste naturelle et conserve le lien lexical avec חֶפְצְךָ plus loin dans le verset.
- source_word: בְּיוֹם קָדְשִׁי
  choice: en mon saint jour
  rationale: Rend directement la désignation possessive du jour consacré par Dieu.
- source_word: וְקָרָאתָ לַשַּׁבָּת עֹנֶג
  choice: tu appelles le sabbat « un délice »
  rationale: עֹנֶג signifie délice ou joie exquise. Les guillemets rendent clairement la construction attributive « appeler X Y ».
- source_word: לִקְדוֹשׁ יְהוָה מְכֻבָּד
  choice: le jour saint de Yahweh « digne d’honneur »
  rationale: L’hébreu dit littéralement « le saint de Yahweh » dans une formulation condensée. « Jour » est fourni par le contexte immédiat, et מְכֻבָּד exprime ce qui est honoré ou digne d’honneur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du nom divin conserve le nom personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: וְכִבַּדְתּוֹ
  choice: tu l’honores
  rationale: Le pronom masculin singulier renvoie le plus naturellement au sabbat ou au jour saint dans le fil de la phrase, mais son référent demeure grammaticalement susceptible d’être Yahweh; cette possibilité est signalée en note.
- source_word: מֵעֲשׂוֹת דְּרָכֶיךָ
  choice: en ne suivant pas tes propres voies
  rationale: « Suivre ses voies » restitue naturellement la métaphore hébraïque des voies comme conduite ou manière d’agir.
- source_word: מִמְּצוֹא חֶפְצְךָ
  choice: en ne recherchant pas ce qui te plaît
  rationale: מָצָא avec חֵפֶץ évoque ici la poursuite de ce que l’on désire ou de ses intérêts personnels. Le choix maintient la répétition lexicale du verset.
- source_word: וְדַבֵּר דָּבָר
  choice: en ne prononçant pas une parole
  rationale: La traduction garde la brièveté énigmatique de l’hébreu, littéralement « et parler une parole », sans préciser dans le texte principal quelle catégorie de paroles est visée.
theological_decisions:
- issue: Référent du pronom dans וְכִבַּדְתּוֹ
  choice: 'Le pronom renvoie au sabbat ou au jour saint : « tu l’honores ».'
  alternative: 'Le pronom peut renvoyer à Yahweh : « tu l’honores », avec Yahweh comme antécédent.'
  rationale: La progression syntaxique porte surtout sur le sabbat, qu’il faut appeler délice et considérer comme digne d’honneur. Toutefois, Yahweh est l’antécédent nominal immédiatement disponible dans l’expression précédente, de sorte que l’ambiguïté ne doit pas être supprimée.
- issue: Portée religieuse de וְדַבֵּר דָּבָר
  choice: Conserver la formulation non précisée « ne prononçant pas une parole » et expliquer en note les interprétations contextuelles.
  alternative: Expliciter « ne tenant pas de propos ordinaires, intéressés ou futiles ».
  rationale: L’hébreu ne qualifie pas explicitement la parole. Une précision dans le corps du texte transformerait une inférence contextuelle en interdiction déterminée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure conditionnelle accumulative du verset hébreu et sa ponctuation ouverte vers le verset suivant. Les répétitions de « sabbat », « saint jour » et « ce qui te plaît » sont maintenues pour refléter la cohésion lexicale de l’original.
