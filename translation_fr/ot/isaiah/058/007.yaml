  - severity: low
    issue: Rendu de לֹא תִתְעַלָּם
    rationale: « Ne te dérobe pas à » est possible, mais « ne pas te détourner de » restitue plus naturellement l'idée de se soustraire ou de se détourner de quelqu'un tout en gardant l'image de la « chair ».
