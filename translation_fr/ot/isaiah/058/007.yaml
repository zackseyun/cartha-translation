  text: הֲ/ל֨וֹא פָרֹ֤ס לָֽ/רָעֵב֙ לַחְמֶ֔/ךָ וַ/עֲנִיִּ֥ים מְרוּדִ֖ים תָּ֣בִיא בָ֑יִת כִּֽי תִרְאֶ֤ה עָרֹם֙ וְ/כִסִּית֔/וֹ וּ/מִ/בְּשָׂרְ/ךָ֖ לֹ֥א תִתְעַלָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/007.yaml
  text: Is it not to share your bread with the hungry[a], and bring the poor who are cast out into your house? When you see the naked, to cover him[b], and not hide yourself from your own flesh?
translation:
  language: fr
  text: N’est-ce pas partager ton pain avec celui qui a faim, faire entrer chez toi des pauvres chassés de chez eux[a] ? Quand tu vois une personne nue, la couvrir, et ne pas te détourner de ta propre chair[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu est rare ; il peut désigner des pauvres expulsés, errants ou privés d’abri.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « ta chair » : cette expression peut désigner ta parenté ou ta famille et, par extension, ceux auxquels t’unit une même humanité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹס
  choice: partager
  rationale: Le verbe évoque concrètement le fait de rompre ou de diviser le pain. « Partager » exprime naturellement en français l’acte de donner une part de son propre pain.
- source_word: לָרָעֵב לַחְמֶךָ
  choice: ton pain avec celui qui a faim
  rationale: Cette formulation conserve l’image concrète du pain et désigne clairement son bénéficiaire, tout en restant idiomatique en français.
- source_word: עֲנִיִּים מְרוּדִים
  choice: les pauvres chassés de chez eux
  rationale: עֲנִיִּים désigne les pauvres ou les affligés, tandis que מְרוּדִים est rare et peut évoquer des personnes expulsées, errantes ou privées d’abri. La traduction retenue garde l’idée probable de déplacement forcé sans la réduire à une catégorie moderne précise.
- source_word: תָּבִיא בָיִת
  choice: faire entrer chez toi
  rationale: Le hiphil de בוא exprime ici le fait d’amener ou d’accueillir quelqu’un dans une maison. « Chez toi » rend naturellement l’hospitalité personnelle impliquée.
- source_word: כִּי תִרְאֶה עָרֹם
  choice: Quand tu vois quelqu’un qui est nu
  rationale: כִּי introduit ici une circonstance attendue, et l’adjectif substantivé עָרֹם désigne une personne nue. La formulation française évite le tour catégorisant « le nu ».
- source_word: וְכִסִּיתוֹ
  choice: couvre-le
  rationale: Le verbe signifie littéralement « couvrir » et implique ici de vêtir la personne. Le choix conserve l’image hébraïque tout en demeurant clair.
- source_word: וּמִבְּשָׂרְךָ
  choice: à ta propre chair
  rationale: La métaphore de la « chair » peut viser les proches parents et, plus largement, ceux auxquels lie une solidarité humaine. Sa conservation maintient l’ampleur et l’ambiguïté du texte.
- source_word: לֹא תִתְעַלָּם
  choice: ne te dérobe pas
  rationale: La forme réfléchie évoque le fait de se cacher, de se soustraire ou de détourner son attention. « Ne te dérobe pas » restitue ce mouvement de retrait en français naturel.
theological_decisions:
- issue: Portée de « ta propre chair »
  choice: Conserver l’image hébraïque sans en limiter explicitement la portée.
  alternative: « ta propre famille » ou « tes proches »
  rationale: L’expression peut désigner prioritairement la parenté, mais elle porte aussi une force éthique susceptible d’englober la solidarité humaine. La métaphore préserve cette tension.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement conserve l’adresse individuelle au masculin singulier de l’hébreu. Le parallélisme des actes concrets est maintenu, ainsi que les métaphores du pain, de la couverture et de la chair.
