review_pass:
  verdict: revise
  source_fidelity: Le sens des actes de partage, d'accueil, de vêtement et de non-retrait est bien rendu. « Chassés de chez eux » constitue une lecture défendable de מְרוּדִים, dont le sens précis demeure incertain et est adéquatement nuancé par la note. « Ta propre chair » conserve l'idiome hébreu et son ambiguïté quant à la parenté et à une solidarité plus large.
  naturalness: Le français est globalement moderne et clair. Toutefois, la succession d'infinitifs introduite par « N’est-ce pas » est interrompue par l'impératif « couvre-le ». Maintenir les infinitifs rend la phrase plus cohérente et plus proche de la construction rhétorique de l'hébreu. « Ne pas te détourner de ta propre chair » exprime plus directement le mouvement de retrait de תִתְעַלָּם que « ne te dérobe pas à ».
  terminology: Les termes « pain », « pauvres », « nue », « couvrir » et « chair » sont appropriés. La note sur « chair » préserve l'ouverture sémantique du texte sans imposer une interprétation confessionnelle.
