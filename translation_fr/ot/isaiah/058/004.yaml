source:
  edition: WLC
  text: הֵ֣ן לְ/רִ֤יב וּ/מַצָּה֙ תָּצ֔וּמוּ וּ/לְ/הַכּ֖וֹת בְּ/אֶגְרֹ֣ף רֶ֑שַׁע לֹא תָצ֣וּמוּ כַ/יּ֔וֹם לְ/הַשְׁמִ֥יעַ בַּ/מָּר֖וֹם קוֹלְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/004.yaml
  text: Look[a], you fast for strife and contention, and to strike with a wicked fist[b]. You are not fasting today to make your voice heard on high.
translation:
  language: fr
  text: 'Voyez : vous jeûnez pour vous quereller et vous battre, et pour frapper à coups de poing avec méchanceté[a]. Ce n’est pas en jeûnant comme vous le faites aujourd’hui que vous ferez entendre votre voix là-haut[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « d’un poing de méchanceté » ou « d’un poing de perversité ».'
    reason: lexical_alternative
  - marker: b
    text: « Là-haut » peut désigner le domaine céleste, c’est-à-dire le fait de faire entendre sa voix auprès de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Voyez
  rationale: Interpellation emphatique naturelle en français moderne, qui conserve la force accusatrice du contexte.
- source_word: לְרִיב וּמַצָּה
  choice: pour vous quereller et vous battre
  rationale: Les deux noms désignent la dispute et l’affrontement. Cette paire verbale française est claire et naturelle tout en maintenant la progression vers la violence physique.
- source_word: תָּצוּמוּ
  choice: vous jeûnez
  rationale: Le présent rend ici l’action constatée et dénoncée par le prophète.
- source_word: וּלְהַכּוֹת
  choice: et pour frapper
  rationale: L’infinitif avec ל exprime ici le but ou le résultat; « frapper » en conserve directement la force.
- source_word: בְּאֶגְרֹף רֶשַׁע
  choice: d’un poing méchant
  rationale: Formulation française concise qui rattache la qualification morale au poing, sans atténuer la violence; la construction hébraïque plus littérale est signalée en note.
- source_word: לֹא תָצוּמוּ כַיּוֹם
  choice: Ce n’est pas en jeûnant comme vous le faites aujourd’hui
  rationale: 'Cette tournure conserve la négation ainsi que la valeur comparative de כַיּוֹם : c’est la manière actuelle de jeûner qui ne peut produire le résultat recherché.'
- source_word: לְהַשְׁמִיעַ ... קוֹלְכֶם
  choice: que vous ferez entendre votre voix
  rationale: Rend la valeur causative du hiphil de שמע et son complément « votre voix » dans un français idiomatique.
- source_word: בַּמָּרוֹם
  choice: là-haut
  rationale: Préserve l’expression spatiale et son évocation du domaine céleste sans expliciter « Dieu » ou « le ciel », que l’hébreu ne nomme pas.
theological_decisions:
- issue: Référent de בַּמָּרוֹם (« là-haut »)
  choice: Conserver l’expression spatiale « là-haut »
  alternative: « au ciel » ou « auprès de Dieu »
  rationale: Le contexte évoque vraisemblablement l’écoute divine, mais le texte dit littéralement « dans la hauteur ». La traduction maintient cette implication sans la rendre plus explicite que l’hébreu.
- issue: Portée de la négation dans la dernière proposition
  choice: La manière actuelle de jeûner ne fera pas entendre leur voix là-haut
  alternative: 'Simple constat temporel : « Aujourd’hui, vous ne jeûnez pas pour faire entendre votre voix »'
  rationale: La construction לֹא תָצוּמוּ כַיּוֹם se prête à une lecture comparative portant sur leur façon de jeûner « comme aujourd’hui ». La formulation choisie conserve ce lien tout en laissant entendre l’échec du but religieux recherché.
translation_notes:
  register: Français international moderne, direct et digne. « Voyez » maintient l’interpellation prophétique; « vous quereller et vous battre » évite des abstractions peu naturelles tout en préservant le parallélisme et l’intensification du conflit. Les marqueurs [a] et [b] figurent dans le texte.
