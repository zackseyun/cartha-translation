source:
  edition: WLC
  text: לָ֤/מָּה צַּ֨מְנוּ֙ וְ/לֹ֣א רָאִ֔יתָ עִנִּ֥ינוּ נַפְשֵׁ֖/נוּ וְ/לֹ֣א תֵדָ֑ע הֵ֣ן בְּ/י֤וֹם צֹֽמְ/כֶם֙ תִּמְצְאוּ חֵ֔פֶץ וְ/כָל עַצְּבֵי/כֶ֖ם תִּנְגֹּֽשׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/003.yaml
  text: Why have we fasted[a], and you have not seen? Why have we humbled ourselves, and you do not notice? Look, on the day of your fast you pursue your own pleasure[c][b], and you drive all your laborers hard.
translation:
  language: fr
  text: '« Pourquoi avons-nous jeûné sans que tu le voies ? Pourquoi nous sommes-nous humiliés[a] sans que tu y prêtes attention ? » Voici : le jour où vous jeûnez, vous recherchez ce qui vous plaît[b] et vous opprimez tous ceux qui travaillent pour vous[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nous avons affligé notre âme ». On peut aussi comprendre : « nous nous sommes imposé des privations » ou « nous nous sommes privés ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « vous recherchez votre propre plaisir », « vous cherchez à satisfaire vos désirs » ou, peut-être, « vous vous occupez de vos propres affaires ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « vous poussez durement tous vos travailleurs ». L’hébreu peut désigner soit les travailleurs, soit les travaux ou les tâches exigés : « vous exigez tous vos travaux / toutes vos tâches ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Pourquoi
  rationale: Introduit directement la plainte du peuple sous forme interrogative.
- source_word: צַּמְנוּ
  choice: avons-nous jeûné
  rationale: Le passé composé rend le parfait hébreu comme un acte accompli dont les interlocuteurs attendent encore les effets.
- source_word: רָאִיתָ
  choice: sans que tu le voies
  rationale: Conserve le verbe concret « voir » tout en exprimant naturellement en français le reproche adressé à Dieu.
- source_word: עִנִּינוּ נַפְשֵׁנוּ
  choice: nous sommes-nous humiliés
  rationale: Rend l’idée d’abaissement volontaire associée au jeûne. Une note conserve le sens plus littéral d’affliction ou de privation de soi.
- source_word: תֵדָע
  choice: sans que tu y prêtes attention
  rationale: Dans le parallélisme avec « voir », ידע exprime ici le fait de reconnaître ou de prendre en considération, et non une simple connaissance intellectuelle.
- source_word: הֵן
  choice: Voici
  rationale: Marque avec force le début de la réplique divine dans un registre actuel et digne.
- source_word: בְּיוֹם צֹמְכֶם
  choice: le jour où vous jeûnez
  rationale: Reproduit clairement la valeur temporelle de l’expression hébraïque.
- source_word: תִּמְצְאוּ חֵפֶץ
  choice: vous recherchez votre propre intérêt
  rationale: Dans ce contexte de réprimande, l’expression désigne vraisemblablement la poursuite de ce qui plaît ou profite aux jeûneurs. La note maintient l’ambiguïté entre plaisir, désir et affaires personnelles.
- source_word: עַצְּבֵיכֶם
  choice: vos ouvriers
  rationale: Le nom peut désigner ceux qui travaillent péniblement pour les destinataires; ce sens s’accorde bien avec le verbe suivant, sans exclure en note une référence au travail exigé.
- source_word: תִּנְגֹּשׂוּ
  choice: vous opprimez
  rationale: נגשׂ évoque une pression coercitive, notamment le fait de pousser durement des travailleurs ou d’exiger d’eux leur labeur.
theological_decisions:
- issue: Portée de l’accusation sociale dans le dernier membre du verset
  choice: Le jeûne est dénoncé parce qu’il s’accompagne de recherche d’intérêt personnel et d’oppression des ouvriers.
  alternative: Le texte pourrait viser plus généralement la poursuite de ses propres affaires et l’exigence de tout le travail dû.
  rationale: L’association de חפץ à נגשׂ favorise une accusation d’exploitation économique pendant l’observance religieuse, mais l’ambiguïté lexicale concernant les ouvriers ou le travail exigé est explicitement préservée.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions gardent le ton de plainte du peuple, tandis que « Voici » signale nettement la réplique divine. Le vouvoiement pluriel de la seconde moitié est rendu sans lever les ambiguïtés lexicales du texte hébreu.
