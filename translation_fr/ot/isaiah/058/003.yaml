  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : plainte du peuple, puis réplique divine dénonçant une pratique du jeûne associée à la recherche de satisfactions personnelles et à une pression sur le travail. Toutefois, la note c introduit indûment l’idée de travail « dû » aux jeûneurs, absente de l’hébreu. La note a gagne aussi à conserver explicitement « âme », correspondant à נֶפֶשׁ, plutôt que « personne ».'
  naturalness: Le français est clair, actuel et d’un registre approprié. « Voici » convient bien à הֵן. « Vous recherchez votre propre intérêt » est possible, mais peut restreindre חֵפֶץ à l’avantage économique ; « vous recherchez ce qui vous plaît » conserve mieux l’éventail plaisir/désir/affaires, sans alourdir le texte.
  terminology: « Nous nous sommes humiliés » rend bien l’idiome cultuel עִנִּינוּ נַפְשֵׁנוּ. Pour עַצְּבֵיכֶם, « ceux qui travaillent pour vous » est une lecture contextuellement plausible et naturelle. La note doit préserver l’autre possibilité, celle des travaux ou tâches exigés, sans la reformuler comme une dette de travail.
