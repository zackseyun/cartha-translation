source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶה֮ צ֣וֹם אֶבְחָרֵ/הוּ֒ פַּתֵּ֨חַ֙ חַרְצֻבּ֣וֹת רֶ֔שַׁע הַתֵּ֖ר אֲגֻדּ֣וֹת מוֹטָ֑ה וְ/שַׁלַּ֤ח רְצוּצִים֙ חָפְשִׁ֔ים וְ/כָל מוֹטָ֖ה תְּנַתֵּֽקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/006.yaml
  text: 'Is not this the fast that I choose: to loosen the chains of wickedness[a], to untie the cords of the yoke, to send the oppressed out free[c][b], and to tear off every yoke?'
translation:
  language: fr
  text: 'Le jeûne que je choisis, n’est-ce pas ceci : défaire les liens de la méchanceté[a], dénouer les attaches du joug, laisser partir libres ceux qu’on écrase[b], et rompre tout joug[c] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les liens de l’injustice » ou « les liens du mal ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les opprimés »; l’hébreu décrit littéralement des personnes écrasées.
    reason: lexical_alternative
  - marker: c
    text: L’hébreu répète le mot « joug »; il emploie l’image concrète d’une entrave pour évoquer l’oppression.
    reason: cultural_note
lexical_decisions:
- source_word: צ֣וֹם
  choice: le jeûne
  rationale: Désigne ici la pratique religieuse elle-même; « le jeûne » est l’équivalent français naturel dans cette construction.
- source_word: אֶבְחָרֵהוּ
  choice: que je choisis
  rationale: Le verbe בחר signifie choisir ou sélectionner. Le présent conserve ici l’évaluation formulée par Dieu sans ajouter l’idée interprétative de plaisir.
- source_word: פַּתֵּחַ חַרְצֻבּוֹת רֶשַׁע
  choice: défaire les liens de l’injustice
  rationale: « Défaire » convient à l’action exercée sur des entraves; « liens » garde l’image concrète, tandis que « injustice » exprime naturellement en contexte social la portée de רֶשַׁע sans effacer sa dimension morale.
- source_word: הַתֵּר אֲגֻדּוֹת מוֹטָה
  choice: dénouer les attaches du joug
  rationale: La formulation distingue cette action de la précédente et conserve l’image physique des attaches qui maintiennent un joug.
- source_word: וְשַׁלַּח
  choice: laisser partir
  rationale: שלח signifie fondamentalement envoyer ou faire partir. « Laisser partir » exprime ici la libération sans réduire le verbe au seul terme abstrait « libérer ».
- source_word: רְצוּצִים
  choice: ceux qu’on écrase
  rationale: Le participe passif de רצץ évoque des personnes écrasées ou opprimées. Cette formulation garde la force concrète du verbe hébreu tout en restant idiomatique.
- source_word: חָפְשִׁים
  choice: libres
  rationale: L’adjectif indique l’état de liberté accordé aux personnes qui partent.
- source_word: וְכָל מוֹטָה תְּנַתֵּקוּ
  choice: et rompre tout joug
  rationale: נתק exprime une rupture ou un arrachement énergique. « Rompre » est naturel en français avec « joug » et maintient la vigueur de l’image.
theological_decisions:
- issue: Nature du jeûne choisi par Dieu
  choice: Présenter le jeûne voulu comme des actes concrets qui mettent fin à l’injustice et libèrent les personnes écrasées.
  alternative: Comprendre le passage comme décrivant principalement une disposition intérieure ou une bienveillance générale.
  rationale: Les infinitifs hébreux énumèrent des actions tangibles contre l’oppression. La traduction les conserve sans opposer artificiellement pratique religieuse et justice sociale au-delà de ce que dit le verset.
- issue: Image répétée du joug
  choice: Conserver littéralement les deux occurrences de « joug ».
  alternative: Remplacer l’une ou les deux occurrences par des abstractions telles que « fardeau » ou « oppression ».
  rationale: La répétition de מוֹטָה développe une image physique cohérente de la domination comme entrave à dénouer puis à rompre.
- issue: Portée de רֶשַׁע
  choice: Employer « injustice » dans le texte et signaler « méchanceté » en note.
  alternative: Employer uniquement « méchanceté » ou « mal ».
  rationale: Le contexte vise nettement des pratiques oppressives, ce qui rend « injustice » naturel, mais la note préserve la portée morale plus large possible du mot hébreu.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La question rhétorique est conservée. Les infinitifs donnent à l’énumération un rythme clair, et les images physiques des liens, des attaches et du joug restent visibles sans produire une formulation artificielle.
