  to: 'Le jeûne que je choisis, n’est-ce pas ceci : défaire les liens de la méchanceté[a], dénouer les attaches du joug, laisser partir libres ceux qu’on écrase[b], et rompre tout joug[c] ?'
  rationale: La révision rétablit pour רֶשַׁע un équivalent français qui conserve sa dimension morale générale, tout en gardant « injustice » comme alternative contextuelle. Elle simplifie aussi la note sur le joug afin qu’elle décrive la répétition hébraïque sans ajouter une explication séquentielle. Le reste de la formulation est maintenu, car il est à la fois naturel en français et fidèle aux images et aux verbes du texte hébreu.
