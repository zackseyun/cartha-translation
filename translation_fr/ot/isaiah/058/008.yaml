base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/008.yaml
  text: Then your light will break forth like the dawn[a], and your healing will spring up quickly; your righteousness will go before you[c][b], and the glory of Yahweh will be your rear guard.
translation:
  language: fr
  text: Alors ta lumière jaillira comme l’aurore, et ta guérison[a] germera rapidement ; ta justice[b] marchera devant toi, et la gloire de Yahweh fermera la marche derrière toi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton rétablissement » ou « ta restauration ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ta droiture » ; selon le contexte, le mot peut aussi évoquer « ton bon droit » ou ta justification.
    reason: lexical_alternative
  - marker: c
    text: Littéralement, le verbe hébreu signifie « te rassemblera » ou « te recueillera » ; dans ce contexte, il désigne celui qui protège et regroupe depuis l’arrière.
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּקַע
  choice: jaillira
  rationale: Le nifal de בקע évoque ce qui s’ouvre avec force ou fait irruption. Avec la lumière pour sujet, « jaillira » restitue naturellement en français cette apparition soudaine.
- source_word: כַּשַּׁחַר
  choice: comme l’aurore
  rationale: שׁחר désigne l’aurore ou le point du jour. « Comme l’aurore » conserve l’image et la comparaison hébraïques.
- source_word: אוֹרֶךָ
  choice: ta lumière
  rationale: Traduction directe de אוֹר avec le suffixe possessif de deuxième personne du masculin singulier.
- source_word: אֲרֻכָתְךָ
  choice: ta guérison
  rationale: אֲרֻכָה peut désigner la guérison, le rétablissement ou la restauration. « Ta guérison » convient à l’image d’une blessure qui se répare tout en gardant une portée collective possible.
- source_word: מְהֵרָה
  choice: rapidement
  rationale: L’adverbe exprime la rapidité ; « rapidement » est courant et précis.
- source_word: תִצְמָח
  choice: germera
  rationale: צמח signifie pousser ou germer. « Germera » conserve la métaphore végétale appliquée à la guérison, sans la remplacer par une formulation abstraite.
- source_word: וְהָלַךְ לְפָנֶיךָ
  choice: marchera devant toi
  rationale: הלך signifie marcher ou aller, et לפני indique la position en avant. « Marchera devant toi » conserve la personnification et l’image du déplacement.
- source_word: צִדְקֶךָ
  choice: ta justice
  rationale: צדק recouvre la justice, la droiture et la conformité à ce qui est juste. Dans le contexte social et moral d’Ésaïe 58, « ta justice » est naturel en français biblique moderne sans exclure la droiture personnelle.
- source_word: כְּבוֹד יְהוָה
  choice: la gloire de Yahweh
  rationale: Le syntagme construit est rendu directement ; כבוד désigne la gloire, et le nom divin est translittéré « Yahweh ».
- source_word: יַאַסְפֶךָ
  choice: fermera la marche derrière toi
  rationale: אסף signifie fondamentalement rassembler ou recueillir. Dans le parallélisme spatial avec ce qui marche devant, le verbe décrit l’action de protéger et de regrouper depuis l’arrière. L’expression française « fermer la marche derrière toi » rend clairement cette fonction, tandis que le sens lexical littéral est signalé en note.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR ; Jéhovah
  rationale: Le texte porte le tétragramme, nom propre du Dieu d’Israël. « Yahweh » le représente comme nom plutôt que de lui substituer un titre.
- issue: Portée de צִדְקֶךָ
  choice: ta justice
  alternative: ta droiture ; ton bon droit
  rationale: Le contexte met fortement en avant la conduite juste envers autrui, mais le terme peut aussi évoquer la droiture ou la justification du fidèle. Le texte principal conserve le terme français large « justice », et la note maintient les autres nuances possibles.
- issue: Valeur contextuelle de יַאַסְפֶךָ
  choice: fermera la marche derrière toi
  alternative: te rassemblera ; te recueillera
  rationale: Le parallélisme présente la justice en avant et la gloire de Yahweh à l’arrière. La traduction principale exprime cette protection arrière sans effacer le sens fondamental « rassembler », conservé dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement reproduit l’adresse hébraïque au masculin singulier, qui représente ici le peuple comme un interlocuteur collectif. Les métaphores de la lumière qui jaillit, de la guérison qui germe et de la marche encadrée à l’avant et à l’arrière sont conservées.
