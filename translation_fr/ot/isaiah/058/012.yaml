  source_fidelity: La traduction rend correctement l’opposition entre le pluriel initial (« Les tiens ») et le singulier adressé ensuite (« tu »), ainsi que les images de reconstruction et de restauration. Toutefois, « le pays » n’est pas exprimé dans l’hébreu de la dernière expression et restreint indûment une formulation syntaxiquement dense et quelque peu ambiguë. Le singulier de פֶּרֶץ est aussi mieux conservé par « la brèche ».
  naturalness: « Les tiens rebâtiront les ruines anciennes » et « tu relèveras » sont naturels et d’un registre approprié. « Les fondations de génération en génération » est compréhensible mais raide ; « les fondations des générations passées » rend idiomatiquement la portée temporelle de l’expression. La dernière désignation est reformulée sans l’ajout explicatif « le pays », tout en conservant l’étrangeté relative de l’image des chemins liés à l’habitation.
  terminology: '« Rebâtir », « ruines anciennes », « relever », « réparer » et « restaurateur » conviennent au contexte de restauration. Les titres ne requièrent pas de majuscules : ils décrivent une réputation attribuée au destinataire, non des noms propres.'
