base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/012.yaml
  text: Those from among you will rebuild the ancient ruins[a]; you will raise up the foundations of generation after generation, and you will be called the repairer of the breach[b], the restorer of paths for dwelling.
translation:
  language: fr
  text: Les tiens rebâtiront les ruines anciennes ; tu relèveras les fondations des générations passées. On t’appellera « celui qui répare la brèche », « restaurateur des chemins pour qu’on y habite »[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « restaurateur des chemins où l’on habite » ou « restaurateur des rues pour l’habitation ». La dernière expression peut désigner la remise en état des voies et des lieux de vie afin que la communauté puisse de nouveau être habitée.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנוּ מִמְּךָ
  choice: Les tiens rebâtiront
  rationale: L’expression désigne naturellement des personnes issues du destinataire. « Les tiens » est idiomatique en français et évite le calque peu naturel « ceux qui viennent de toi ».
- source_word: חָרְבוֹת עוֹלָם
  choice: les ruines anciennes
  rationale: חָרְבוֹת désigne des ruines ou des lieux dévastés, et עוֹלָם renvoie ici à leur grande ancienneté plutôt qu’à l’éternité.
- source_word: מוֹסְדֵי דוֹר וָדוֹר
  choice: les fondations de génération en génération
  rationale: La formulation conserve l’expression distributive hébraïque « génération et génération », qui évoque des générations successives.
- source_word: תְּקוֹמֵם
  choice: tu relèveras
  rationale: Le causatif de קום présente l’action de faire se dresser de nouveau les fondations ; « relever » garde cette image dans un français naturel.
- source_word: וְקֹרָא לְךָ
  choice: et l’on t’appellera
  rationale: Le singulier actif impersonnel hébreu se rend naturellement en français par « l’on », sans préciser un agent absent du texte.
- source_word: גֹּדֵר פֶּרֶץ
  choice: Réparateur des brèches
  rationale: גֹּדֵר décrit celui qui ferme ou répare une ouverture, tandis que פֶּרֶץ peut désigner une brèche dans une structure ou dans les défenses d’une communauté.
- source_word: מְשֹׁבֵב נְתִיבוֹת
  choice: Restaurateur des chemins
  rationale: Le participe causatif de שוב exprime ici la remise en état, et נְתִיבוֹת désigne des chemins ou voies de passage.
- source_word: לָשָׁבֶת
  choice: qui rendent le pays habitable
  rationale: 'L’infinitif exprime le but ou le résultat : la restauration des voies permet de nouveau l’installation et l’habitation. Le complément « le pays » explicite sobrement le cadre communautaire implicite.'
