  text: אָ֗ז תִּתְעַנַּג֙ עַל יְהוָ֔ה וְ/הִרְכַּבְתִּ֖י/ךָ עַל בָּ֣מֳותֵי אָ֑רֶץ וְ/הַאֲכַלְתִּ֗י/ךָ נַחֲלַת֙ יַעֲקֹ֣ב אָבִ֔י/ךָ כִּ֛י פִּ֥י יְהוָ֖ה דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/014.yaml
  text: then you will delight yourself in Yahweh[a], and I will make you ride on the heights of the earth; I will feed you with the inheritance of Jacob your father[b], for the mouth of Yahweh has spoken.
translation:
  language: fr
  text: Alors tu trouveras ta joie en Yahweh, et je te ferai parcourir les hauteurs de la terre[a] ; je te nourrirai de l’héritage de Jacob, ton père[b], car la bouche de Yahweh a parlé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les hauts lieux de la terre » ou « les hauteurs du pays ».
    reason: lexical_alternative
  - marker: b
    text: '« Jacob, ton père » emploie le langage familial de l’alliance : Jacob est l’ancêtre du peuple auquel le prophète s’adresse.'
    reason: cultural_note
lexical_decisions:
- source_word: תִּתְעַנַּג עַל
  choice: tu trouveras ta joie en
  rationale: Le hitpael de ענג exprime le fait de prendre un profond plaisir. Cette tournure française naturelle garde l’orientation personnelle vers Yahweh sans alourdir la phrase.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération du tétragramme conserve le nom divin présent dans le texte hébreu au lieu de lui substituer un titre.
- source_word: וְהִרְכַּבְתִּיךָ
  choice: je te ferai chevaucher
  rationale: Le hiphil de רכב a une valeur causative. « Je te ferai chevaucher » en restitue la force et préserve l’image poétique.
- source_word: בָּמֳותֵי אָרֶץ
  choice: les hauteurs de la terre
  rationale: במות désigne ici des hauteurs. La formulation conserve une image ouverte d’élévation, de sécurité ou de bénédiction sans la réduire à une interprétation militaire, géographique ou cultuelle.
- source_word: וְהַאֲכַלְתִּיךָ
  choice: je te nourrirai de
  rationale: Le hiphil de אכל signifie « faire manger » ou « nourrir ». Cette formulation est naturelle en français et exprime la jouissance accordée de l’héritage.
- source_word: נַחֲלַת יַעֲקֹב אָבִיךָ
  choice: l’héritage de Jacob, ton père
  rationale: « Héritage » conserve la portée familiale et alliance. « Jacob, ton père » maintient l’expression hébraïque de solidarité ancestrale, éclairée par une note.
- source_word: כִּי פִּי יְהוָה דִּבֵּר
  choice: car la bouche de Yahweh a parlé
  rationale: La traduction garde la formule prophétique solennelle et son anthropomorphisme explicite plutôt que de la réduire à « Yahweh a parlé ».
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte emploie directement le tétragramme. « Yahweh » conserve le nom propre et évite de le remplacer par un titre.
- issue: Sens des « hauteurs de la terre »
  choice: Conserver la métaphore sans en fixer précisément la portée
  alternative: domination victorieuse sur le pays ; prospérité dans le pays ; hauts lieux du pays
  rationale: L’expression peut évoquer l’élévation, la sécurité, la victoire ou la bénédiction. Le contexte ne contraint pas à une seule de ces nuances.
- issue: « Jacob, ton père » comme langage d’alliance et de parenté
  choice: Conserver l’expression littérale dans le texte et l’expliquer en note
  alternative: Jacob, ton ancêtre
  rationale: Le terme « père » marque la continuité collective du peuple avec Jacob. Le remplacer directement par « ancêtre » clarifierait le sens, mais atténuerait l’idiome familial du texte.
translation_notes:
  register: Français international moderne, poétique et digne. Le tutoiement singulier suit les formes hébraïques et l’adresse au peuple envisagé comme une personne collective. Les images concrètes et la formule prophétique sont conservées.
