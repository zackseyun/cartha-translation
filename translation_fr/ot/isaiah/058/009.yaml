id: ISA.58.9
reference: Isaiah 58:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: אָ֤ז תִּקְרָא֙ וַ/יהוָ֣ה יַעֲנֶ֔ה תְּשַׁוַּ֖ע וְ/יֹאמַ֣ר הִנֵּ֑/נִי אִם תָּסִ֤יר מִ/תּֽוֹכְ/ךָ֙ מוֹטָ֔ה שְׁלַ֥ח אֶצְבַּ֖ע וְ/דַבֶּר אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/009.yaml
  text: Then you will call[a], and Yahweh will answer; you will cry for help, and he will say, ‘Here I am.’ If you remove from your midst the yoke, the pointing of the finger, and speaking wickedness[c][b],
translation:
  language: fr
  text: 'Alors tu appelleras, et Yahweh répondra ; tu crieras au secours, et il dira : « Me voici ! » Si tu ôtes de ton milieu le joug[a], le geste accusateur[b] et les paroles malveillantes[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « joug » représente ici les traitements oppressifs ou les charges imposées aux autres.
    reason: cultural_note
  - marker: b
    text: 'L’hébreu dit littéralement « l’extension du doigt » : probablement un geste accusateur ou méprisant.'
    reason: lexical_alternative
  - marker: c
    text: 'Autres traductions possibles : « les paroles mauvaises » ou « les propos malveillants ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Alors
  rationale: Marque ici la conséquence des conditions énoncées dans le contexte précédent ; « Alors » est naturel et concis.
- source_word: תִּקְרָא
  choice: tu appelleras
  rationale: Dans ce contexte de prière, le verbe désigne l'appel adressé à Dieu et reste parallèle au cri de détresse qui suit.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin יהוה employé directement dans le texte hébreu.
- source_word: תְּשַׁוַּע
  choice: tu crieras au secours
  rationale: Le piel de שׁוע exprime un appel pressant à l'aide ; cette tournure en rend clairement l'urgence.
- source_word: הִנֵּנִי
  choice: Me voici !
  rationale: Expression française idiomatique qui conserve l'immédiateté et la disponibilité exprimées par l'hébreu.
- source_word: מִתּוֹכְךָ
  choice: du milieu de toi
  rationale: Conserve le singulier collectif hébreu et la dimension communautaire de l'exhortation.
- source_word: מוֹטָה
  choice: le joug
  rationale: Maintient l'image concrète du joug, métaphore de l'oppression ou des charges imposées à autrui.
- source_word: שְׁלַח אֶצְבַּע
  choice: le geste accusateur
  rationale: Littéralement « l'extension du doigt » ; la formulation rend en français actuel le geste de désignation hostile ou méprisante sans le réduire à une seule nuance.
- source_word: דַבֶּר אָוֶן
  choice: les paroles malveillantes
  rationale: Rend l'acte de parler et la valeur large de אָוֶן, qui peut évoquer le mal, la nuisance ou la fausseté dans ce contexte.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte porte explicitement le tétragramme ; « Yahweh » préserve le nom personnel sans substituer un titre.
- issue: Valeur sociale de מוֹטָה
  choice: Conserver la métaphore « le joug »
  alternative: traduire directement par « l'oppression »
  rationale: La métaphore appartient au texte source et maintient sa force concrète ; une note en explicite le sens probable sans l'aplatir.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur préserve la structure de promesse, tandis que le singulier « tu » reflète l'adresse collective au peuple. Les images du texte sont conservées et expliquées brièvement en notes.
