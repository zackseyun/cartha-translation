  text: וְ/נָחֲ/ךָ֣ יְהוָה֮ תָּמִיד֒ וְ/הִשְׂבִּ֤יעַ בְּ/צַחְצָחוֹת֙ נַפְשֶׁ֔/ךָ וְ/עַצְמֹתֶ֖י/ךָ יַחֲלִ֑יץ וְ/הָיִ֨יתָ֙ כְּ/גַ֣ן רָוֶ֔ה וּ/כְ/מוֹצָ֣א מַ֔יִם אֲשֶׁ֥ר לֹא יְכַזְּב֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/011.yaml
  text: And Yahweh will guide you continually[a], and satisfy your soul in parched places, and strengthen your bones; and you will be like a well-watered garden[c][b], and like a spring of water whose waters do not fail.
translation:
  language: fr
  text: Yahweh te guidera sans cesse ; il rassasiera ton âme dans les lieux arides et fortifiera tes os[a]. Tu seras comme un jardin bien arrosé, comme une source dont les eaux ne tarissent pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donnera de la vigueur à tes os » ou « rafraîchira tes os ». Le verbe hébreu employé ici est rare et son sens précis est incertain.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dont les eaux ne mentent pas », c’est-à-dire des eaux qui ne font pas défaut et ne déçoivent pas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָחֲךָ
  choice: te guidera
  rationale: Le verbe נחה signifie couramment conduire ou guider. « Guider » exprime naturellement ici la direction constante accordée par Dieu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel présent dans le texte hébreu plutôt que de lui substituer un titre.
- source_word: תָּמִיד
  choice: sans cesse
  rationale: Cette expression française courante rend l’idée de continuité portée par תָּמִיד.
- source_word: וְהִשְׂבִּיעַ
  choice: rassasiera
  rationale: Le hifil de שבע indique que le besoin est pleinement comblé. « Rassasier » convient à נֶפֶשׁ et maintient l’image de plénitude.
- source_word: בְּצַחְצָחוֹת
  choice: dans les lieux arides
  rationale: Le pluriel désigne des conditions ou régions desséchées et brûlées par la chaleur. « Lieux arides » est précis, naturel et conserve l’image spatiale.
- source_word: נַפְשֶׁךָ
  choice: ton âme
  rationale: נֶפֶשׁ peut désigner la personne, la vie ou l’appétit. « Ton âme » préserve ici l’image anthropologique et poétique sans réduire le terme à un besoin seulement physique.
- source_word: וְעַצְמֹתֶיךָ יַחֲלִיץ
  choice: fortifiera tes os
  rationale: Le sens du verbe חלץ est difficile dans ce contexte, mais paraît évoquer la vigueur ou le renouvellement. Cette formulation garde l’image corporelle concrète.
- source_word: כְּגַן רָוֶה
  choice: comme un jardin bien arrosé
  rationale: רָוֶה décrit ce qui est abondamment irrigué ou saturé d’eau. Cette expression est naturelle en français et conserve l’image de fécondité.
- source_word: וּכְמוֹצָא מַיִם
  choice: comme une source
  rationale: מוֹצָא désigne un point d’où l’eau sort. « Source » restitue clairement et sans lourdeur cette réalité en français.
- source_word: אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו
  choice: dont les eaux ne tarissent pas
  rationale: כזב signifie littéralement mentir ou décevoir ; appliqué à des eaux, il décrit une source qui ne manque pas. « Ne tarissent pas » rend naturellement l’effet de l’idiome.
theological_decisions:
- issue: Rendu du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte un nom propre. « Yahweh » le conserve, sans remplacer celui-ci par un titre.
- issue: Portée anthropologique de נֶפֶשׁ
  choice: ton âme
  alternative: ta vie / toi-même
  rationale: Le terme reste polysémique. « Ton âme » maintient ici la profondeur poétique du besoin comblé, tandis que la mention des os exprime ensuite le renouvellement corporel.
- issue: Sens incertain de יַחֲלִיץ
  choice: fortifiera
  alternative: rafraîchira / donnera de la vigueur à
  rationale: Le contexte promet le renouvellement au milieu de l’aridité. « Fortifiera » est plausible sans exclure la nuance d’invigoration, signalée en note.
translation_notes:
  register: Français international moderne, poétique mais immédiatement compréhensible. Le tutoiement singulier suit les formes hébraïques de deuxième personne. La ponctuation distingue les deux ensembles d’images sans alourdir le rythme.
