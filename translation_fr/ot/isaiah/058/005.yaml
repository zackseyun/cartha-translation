base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/005.yaml
  text: 'Is this the fast that I choose: a day for a man to humble himself? Is it to bow down his head like a reed, and to spread out sackcloth and ashes? Will you call this a fast, and a day acceptable to the LORD?'
translation:
  language: fr
  text: 'Est-ce là le jeûne que je choisis : un jour où l’être humain s’impose une privation[a] ? Est-ce courber la tête comme un roseau et étendre le sac et la cendre ? Est-ce cela que tu appelles un jeûne, un jour agréable à l’Éternel ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afflige sa personne » ou « afflige son âme ». Dans le contexte du jeûne, cela évoque le fait de s’imposer une privation, sans se limiter nécessairement à la seule abstinence alimentaire.'
    reason: La note préserve la portée concrète et plus large de l’expression hébraïque ענה נפש, tout en expliquant le choix français dans ce contexte.
lexical_decisions:
- source_word: עַנּוֹת ... נַפְשׁוֹ
  choice: où l’être humain se prive
  rationale: L’expression signifie littéralement « affliger sa personne » et, dans le contexte du jeûne, désigne le fait de se priver ou de s’imposer une privation. Cette formulation naturelle conserve l’idée d’ascèse sans réduire le sens à une disposition intérieure d’humilité.
- source_word: אָדָם
  choice: l’être humain
  rationale: Le terme est générique ici et vise toute personne, non spécifiquement un homme de sexe masculin.
- source_word: כְאַגְמֹן
  choice: comme un roseau
  rationale: Image végétale d’une tige qui se courbe, exprimée par l’équivalent français courant.
- source_word: שַׂק וָאֵפֶר יַצִּיעַ
  choice: se coucher sur le sac et la cendre
  rationale: Le verbe évoque le fait d’étendre ces éléments comme couche; « se coucher sur » rend naturellement le geste rituel sans suggérer seulement qu’on les répand.
- source_word: יוֹם רָצוֹן
  choice: un jour agréable
  rationale: 'רָצוֹן exprime ici l’agrément ou la faveur divine : un jour que l’Éternel accueille favorablement.'
- source_word: יהוה
  choice: l’Éternel
  rationale: Convention française traditionnelle et immédiatement reconnaissable pour le tétragramme, sans imposer une vocalisation reconstruite.
theological_decisions:
- issue: Nature de l’« affliction de la personne »
  choice: se prive
  alternative: s’humilie
  rationale: Le contexte vise les pratiques corporelles du jeûne. « Se prive » garde cette portée concrète, tandis que « s’humilie » pourrait faire croire que Dieu rejette ici l’humilité intérieure elle-même.
- issue: Valeur des questions rhétoriques
  choice: maintien d’une série de questions
  alternative: conversion en affirmations négatives
  rationale: L’hébreu interroge directement l’auditeur et laisse la réprobation ressortir de la rhétorique; la traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement singulier reflète les formes verbales hébraïques adressées à Israël comme interlocuteur collectif.
