    rationale: Le verbe יציע signifie étendre ou disposer le sac et la cendre; il ne dit pas que la personne se couche sur eux. Cette formulation ajoute donc un détail concret non explicite dans le texte hébreu.
  - severity: low
    issue: Portée de « se prive »
    rationale: Dans ce contexte, la privation est une bonne explicitation de ענה נפש, mais le terme hébreu reste plus large, évoquant l’affliction ou l’abaissement de soi. La note doit continuer à signaler cette nuance.
