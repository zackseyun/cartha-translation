id: ISA.58.10
reference: Isaiah 58:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/תָפֵ֤ק לָֽ/רָעֵב֙ נַפְשֶׁ֔/ךָ וְ/נֶ֥פֶשׁ נַעֲנָ֖ה תַּשְׂבִּ֑יעַ וְ/זָרַ֤ח בַּ/חֹ֨שֶׁךְ֙ אוֹרֶ֔/ךָ וַ/אֲפֵלָתְ/ךָ֖ כַּֽ/צָּהֳרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/058/010.yaml
  text: and if you pour yourself out for the hungry and satisfy the afflicted soul[a], then your light will rise in the darkness[b], and your gloom will be like noonday.
translation:
  language: fr
  text: si tu te dépenses pour celui qui a faim et si tu rassasies la personne affligée[a], alors ta lumière se lèvera dans les ténèbres, et ton obscurité deviendra comme le plein midi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’être affligé » ou « l’âme affligée ». Le mot hébreu peut désigner la personne tout entière, et pas seulement son aspect immatériel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפֵק ... נַפְשֶׁךָ
  choice: si tu te dépenses
  rationale: La construction idiomatique avec נֶפֶשׁ exprime le don de soi au bénéfice d’autrui. « Te dépenses » restitue naturellement cette implication personnelle sans réduire l’action à un don matériel ni suggérer une anthropologie dualiste.
- source_word: לָרָעֵב
  choice: pour celui qui a faim
  rationale: L’adjectif substantivé désigne l’affamé, et ל marque ici le bénéficiaire. Cette formulation est claire et naturelle en français international.
- source_word: וְנֶפֶשׁ נַעֲנָה
  choice: la personne affligée
  rationale: נֶפֶשׁ peut désigner la personne entière, tandis que נַעֲנָה qualifie quelqu’un d’accablé ou d’affligé. « Personne affligée » évite de limiter le sens à l’âme immatérielle.
- source_word: תַּשְׂבִּיעַ
  choice: tu rassasies
  rationale: Le hiphil de שׂבע signifie faire parvenir à satiété. « Rassasier » maintient le lien concret avec la faim tout en pouvant évoquer le soulagement complet de l’affligé.
- source_word: וְזָרַח
  choice: se lèvera
  rationale: Dans cette construction conditionnelle, la forme exprime le résultat futur. « Se lèvera » convient naturellement à la lumière qui surgit.
- source_word: בַּחֹשֶׁךְ
  choice: dans les ténèbres
  rationale: Rendu locatif direct qui conserve l’image poétique du texte hébreu.
- source_word: אוֹרֶךָ
  choice: ta lumière
  rationale: Traduction directe qui préserve la métaphore sans l’interpréter explicitement.
- source_word: וַאֲפֵלָתְךָ
  choice: ton obscurité
  rationale: אֲפֵלָה désigne une obscurité profonde. « Obscurité » évite une répétition immédiate de « ténèbres » tout en gardant le contraste lumineux.
- source_word: כַּצָּהֳרָיִם
  choice: comme le plein midi
  rationale: « Plein midi » exprime idiomatiquement la lumière la plus vive associée à צָהֳרַיִם.
theological_decisions:
- issue: Sens anthropologique des deux occurrences de נֶפֶשׁ
  choice: Rendre la première par le pronom réfléchi dans « tu te dépenses » et la seconde par « personne »
  alternative: Traduire uniformément par « âme » ou par « personne »
  rationale: Dans les deux expressions, נֶפֶשׁ renvoie à l’être ou à la vie entière. Le français naturel appelle « te dépenses » dans la première, tandis que « personne affligée » explicite justement la portée globale dans la seconde, sans imposer une doctrine technique de l’âme.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme condition-résultat ainsi que les images de lumière et d’obscurité sont conservés. « Celui qui a faim » est inclusif dans son sens générique.
