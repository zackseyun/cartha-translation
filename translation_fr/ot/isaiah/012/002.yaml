id: ISA.12.2
reference: Isaiah 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הִנֵּ֨ה אֵ֧ל יְשׁוּעָתִ֛/י אֶבְטַ֖ח וְ/לֹ֣א אֶפְחָ֑ד כִּֽי עָזִּ֤/י וְ/זִמְרָת֙ יָ֣הּ יְהוָ֔ה וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/002.yaml
  text: Behold[a], God is my salvation; I will trust and not be afraid, for Yah, Yahweh, is my strength and song[b], and he has become my salvation.
translation:
  language: fr
  text: Voici, Dieu est mon salut ; je me confierai en lui et je n’aurai pas peur, car Yah, Yahweh[a], est ma force et mon chant[b] ; il est devenu mon salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’hébreu juxtapose ici la forme courte du nom divin, « Yah », et sa forme complète, « Yahweh ».
    reason: alternative_reading
  - marker: b
    text: Cette formulation reprend presque mot pour mot Exode 15.2.
    reason: cross_reference
lexical_decisions:
- source_word: הִנֵּה
  choice: Voici
  rationale: Interjection qui attire fortement l’attention. « Voici » conserve la solennité poétique tout en restant compréhensible en français moderne.
- source_word: אֵל
  choice: Dieu
  rationale: Équivalent français naturel de cette désignation divine poétique, sans ajouter l’idée de puissance qui n’est pas explicitement formulée ici.
- source_word: יְשׁוּעָתִי / לִישׁוּעָה
  choice: mon salut
  rationale: Le même terme hébreu encadre le verset. Sa répétition en français préserve ce lien littéraire et le sens de délivrance.
- source_word: אֶבְטַח
  choice: je me confierai en lui
  rationale: L’imparfait hébreu exprime ici une résolution confiante. Le complément « en lui », implicite dans le contexte, rend la tournure idiomatique en français.
- source_word: וְלֹא אֶפְחָד
  choice: et je n’aurai pas peur
  rationale: Rend directement la négation et la valeur prospective du verbe dans un français courant.
- source_word: כִּי
  choice: car
  rationale: Introduit la raison de la confiance exprimée dans la proposition précédente.
- source_word: עָזִּי
  choice: ma force
  rationale: Reproduit le sens lexical direct et maintient l’écho d’Exode 15.2.
- source_word: וְזִמְרָת
  choice: et mon chant
  rationale: La valeur traditionnelle « chant » convient à la formule poétique reprise d’Exode 15.2. Cette formulation conserve l’image sans la réduire à « louange ».
- source_word: יָהּ יְהוָה
  choice: Yah, Yahweh
  rationale: 'Conserve les deux formes successives du nom divin dans l’hébreu : la forme courte יָהּ et le tétragramme יְהוָה. Leur juxtaposition poétique demeure visible au lieu d’être paraphrasée.'
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: il est devenu mon salut
  rationale: Le parfait narratif de היה présente Dieu comme étant devenu concrètement salut pour le locuteur. Le pronom reprend naturellement le sujet divin.
theological_decisions:
- issue: Rendu du double nom divin יָהּ יְהוָה
  choice: Yah, Yahweh
  alternative: le Seigneur, le Seigneur lui-même
  rationale: La translittération préserve la distinction et la succession emphatique des deux formes hébraïques sans transformer la seconde en titre ni ajouter « lui-même ».
- issue: Rapport littéraire avec Exode 15.2
  choice: Conserver « ma force et mon chant » ainsi que la répétition de « mon salut »
  alternative: Interpréter זִמְרָת par « ma louange »
  rationale: Le parallélisme lexical manifeste avec le chant de la mer doit rester perceptible, sans imposer une interprétation plus étroite du nom זִמְרָת.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste fluide tout en conservant les répétitions, l’image inhabituelle de Dieu comme « chant » et le double nom divin du texte hébreu.
