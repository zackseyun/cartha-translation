  text: צַהֲלִ֥י וָ/רֹ֖נִּי יוֹשֶׁ֣בֶת צִיּ֑וֹן כִּֽי גָד֥וֹל בְּ/קִרְבֵּ֖/ךְ קְד֥וֹשׁ יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/006.yaml
  text: Cry aloud and shout for joy[a], inhabitant of Zion[b], for great in your midst is the Holy One of Israel.
translation:
  language: fr
  text: Crie à pleine voix et jubile[a], habitante de Sion[b], car le Saint d’Israël est grand au milieu de toi !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pousse des cris de joie » ou « chante de joie ». Le second impératif peut désigner aussi bien un cri jubilant qu’un chant joyeux.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu dit « habitante de Sion » au féminin singulier et personnifie Sion comme une femme à qui l’on s’adresse directement.
    reason: cultural_note
lexical_decisions:
- source_word: צַהֲלִי
  choice: Crie à pleine voix
  rationale: L’impératif féminin singulier exprime un cri puissant et éclatant. Cette formulation conserve l’intensité vocale et le distingue du second impératif.
- source_word: וָרֹנִּי
  choice: et jubile
  rationale: Le verbe désigne une expression sonore de joie, qui peut être un cri jubilant ou un chant. « Jubile » rend cette joie éclatante sans limiter le sens au chant.
- source_word: יוֹשֶׁבֶת צִיּוֹן
  choice: habitante de Sion
  rationale: Le participe féminin singulier s’adresse directement à Sion personnifiée sous les traits d’une femme. Le singulier et le féminin sont donc conservés.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit la raison des deux exhortations précédentes.
- source_word: גָדוֹל
  choice: grand
  rationale: L’adjectif prédicatif qualifie le Saint d’Israël. « Grand » en conserve le sens général sans le réduire à la seule puissance.
- source_word: בְּקִרְבֵּךְ
  choice: au milieu de toi
  rationale: Le suffixe féminin singulier poursuit l’adresse à Sion personnifiée, tandis que l’expression conserve le sens locatif.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: le Saint d’Israël
  rationale: Cette désignation divine caractéristique d’Ésaïe est rendue de manière traditionnelle, transparente et théologiquement non interprétative.
theological_decisions:
- issue: Personnification de Sion comme destinataire féminine singulière
  choice: 'Conserver l’adresse directe au féminin singulier : « habitante de Sion » et « au milieu de toi »'
  alternative: Employer un collectif tel que « habitants de Sion » ou « peuple de Sion »
  rationale: Toutes les formes d’adresse hébraïques sont au féminin singulier. Leur maintien préserve la personnification poétique de Sion au lieu de la transformer en adresse collective explicite.
- issue: Titre divin propre à la théologie d’Ésaïe
  choice: « le Saint d’Israël »
  alternative: « celui qui est saint, le Dieu d’Israël » ou « le Saint d’Israël » dans un ordre syntaxique non marqué
  rationale: La traduction retenue préserve le titre concis de l’hébreu et sa portée théologique, sans ajouter d’explication doctrinale. Sa position finale maintient aussi l’accent poétique de la proposition hébraïque.
translation_notes:
  register: Français international moderne, poétique et digne. « Crie à pleine voix » et « jubile » rendent les deux impératifs sonores sans les confondre. L’ordre « il est grand… le Saint d’Israël » conserve l’effet d’insistance de l’hébreu tout en restant intelligible en français.
