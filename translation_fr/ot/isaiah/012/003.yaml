id: ISA.12.3
reference: Isaiah 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וּ/שְׁאַבְתֶּם מַ֖יִם בְּ/שָׂשׂ֑וֹן מִ/מַּעַיְנֵ֖י הַ/יְשׁוּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/003.yaml
  text: With joy you will draw water from the springs of salvation[a][b].
translation:
  language: fr
  text: Vous puiserez de l’eau avec joie aux sources du salut[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux puits du salut » ou « aux fontaines du salut ».
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « salut » peut aussi être rendu par « délivrance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁאַבְתֶּם
  choice: Vous puiserez
  rationale: Le qatal qal à la deuxième personne du masculin pluriel, précédé de la conjonction, prend ici naturellement une valeur future dans le discours prophétique. Le français n’exige pas de rendre séparément la conjonction en tête du verset.
- source_word: מַיִם
  choice: de l’eau
  rationale: Le pluriel hébreu fonctionne comme un nom massif; « de l’eau » est la formulation française naturelle avec le verbe « puiser ».
- source_word: בְּ/שָׂשׂוֹן
  choice: avec joie
  rationale: La préposition בְּ accompagnée du nom exprime ici la manière ou la circonstance. « Avec joie » conserve l’expression nominale tout en restant idiomatique.
- source_word: מִ/מַּעַיְנֵי
  choice: aux sources
  rationale: מַעְיָן désigne couramment une source ou une fontaine naturelle. Avec « puiser », le français emploie naturellement « puiser à une source »; « sources » préserve bien l’image.
- source_word: הַ/יְשׁוּעָה
  choice: du salut
  rationale: יְשׁוּעָה peut désigner le salut ou la délivrance. « Salut » conserve à la fois l’idée immédiate de secours et la portée théologique plus large du passage.
theological_decisions:
- issue: Faut-il rendre יְשׁוּעָה dans le sens plus circonscrit de « délivrance » ou par le terme théologiquement plus ample « salut » ?
  choice: salut
  alternative: délivrance
  rationale: Ésaïe 12 célèbre l’action salvatrice de Dieu dans un langage qui possède une profondeur à la fois historique et théologique. « Salut » maintient cette amplitude sans introduire de précision doctrinale étrangère au texte hébreu.
translation_notes:
  register: Français international moderne, clair et digne. Le futur simple convient au discours prophétique, tandis que « avec joie » et « aux sources du salut » conservent l’imagerie concrète et le rythme bref du verset.
