id: ISA.12.1
reference: Isaiah 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָֽמַרְתָּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא אוֹדְ/ךָ֣ יְהוָ֔ה כִּ֥י אָנַ֖פְתָּ בִּ֑/י יָשֹׁ֥ב אַפְּ/ךָ֖ וּֽ/תְנַחֲמֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/001.yaml
  text: And you will say in that day[a], “I will praise you, O Yahweh, for though you were angry with me, your anger has turned away[b], and you comfort me.”
translation:
  language: fr
  text: 'En ce jour-là, tu diras : « Je te louerai[a], Yahweh, car tu as été en colère contre moi ; ta colère s’est détournée[b], et tu me consoles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je te rendrai grâce ». Le verbe hébreu peut exprimer aussi bien l’action de grâce que la louange adressée à Dieu.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ta colère se détourne » ou « revient ». Le mot hébreu signifie proprement « nez » et sert ici d’expression pour la colère.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: tu diras
  rationale: Le qatal avec waw, dans ce discours prophétique, a ici une valeur future. En français, « tu diras » est naturel et fidèle.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Expression temporelle prophétique courante, rendue de façon idiomatique et digne en français.
- source_word: אוֹדְךָ
  choice: Je te louerai
  rationale: Le hiphil de ידה peut exprimer la louange ou l’action de grâce. Dans ce chant de délivrance, « louer » rend bien sa portée cultuelle, sans exclure la gratitude.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Translittération française courante du nom divin, qui préserve ici le nom propre plutôt que de lui substituer un titre.
- source_word: כִּי אָנַפְתָּ בִּי
  choice: car tu as été en colère contre moi, mais
  rationale: כִּי introduit le motif de la louange, tandis que « mais » explicite sobrement le contraste implicite entre la colère passée et son retrait.
- source_word: יָשֹׁב אַפְּךָ
  choice: ta colère s’est détournée
  rationale: אַף désigne idiomatiquement la colère, et שוב son retournement ou son éloignement. Le passé composé exprime naturellement en français l’état résultant.
- source_word: וּתְנַחֲמֵנִי
  choice: et tu me consoles
  rationale: Le piel de נחם signifie consoler ou réconforter. Le présent conserve la forme verbale hébraïque et suggère une consolation actuelle.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: l’Éternel / le Seigneur
  rationale: Le texte porte le tétragramme comme nom divin. « Yahweh » le représente directement, sans remplacer le nom par un titre.
- issue: Rapport logique introduit par כִּי
  choice: car… mais
  alternative: bien que tu aies été en colère contre moi
  rationale: L’hébreu emploie כִּי sans particule concessive distincte. La traduction garde sa valeur causale avec « car » et rend le contraste contextuel par « mais », évitant de transformer toute la proposition en concession explicite.
- issue: Temps de יָשֹׁב
  choice: s’est détournée
  alternative: se détournera / qu’elle se détourne
  rationale: La forme peut être comprise selon la séquence poétique et prophétique. Le passé composé s’accorde avec la louange pour une colère désormais écartée, tout en laissant la note signaler la formulation littérale.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. La syntaxe conserve le ton d’un cantique prophétique. Les marqueurs [a] et [b] figurent dans le texte aux endroits concernés.
