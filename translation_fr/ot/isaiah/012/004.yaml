  text: וַ/אֲמַרְתֶּ֞ם בַּ/יּ֣וֹם הַ/ה֗וּא הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָֽ/עַמִּ֖ים עֲלִֽילֹתָ֑י/ו הַזְכִּ֕ירוּ כִּ֥י נִשְׂגָּ֖ב שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/004.yaml
  text: 'And you will say on that day: “Give thanks to Yahweh[a]; call on his name. Make his deeds known among the peoples[b]; proclaim that his name is exalted.”'
translation:
  language: fr
  text: 'En ce jour-là, vous direz : « Rendez grâce à Yahweh[a], invoquez son nom. Faites connaître ses œuvres parmi les peuples ; proclamez que son nom est exalté[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom hébreu est YHWH, traditionnellement rendu par « le SEIGNEUR ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « proclamez, car son nom est exalté ». Le mot hébreu traduit par « que » peut aussi avoir le sens causal de « car ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: vous direz
  rationale: Le verbe à la 2e personne du pluriel s’inscrit dans la suite du discours prophétique et prend naturellement une valeur future en français.
- source_word: בַּיּוֹם הַהוּא
  choice: En ce jour-là
  rationale: Formulation française naturelle qui conserve le repère temporel et prophétique de l’expression hébraïque.
- source_word: הוֹדוּ לַיהוָה
  choice: Remerciez Yahweh
  rationale: Le hifil impératif pluriel de ידה avec ל exprime ici l’action de rendre grâce. « Remerciez » est direct, naturel et compréhensible.
- source_word: יהוה
  choice: Yahweh
  rationale: La translittération française « Yahweh » représente explicitement le nom divin présent dans le texte hébreu ; une note signale la convention traditionnelle « le SEIGNEUR ».
- source_word: קִרְאוּ בִשְׁמוֹ
  choice: faites appel à son nom
  rationale: קרא avec בְּשֵׁם désigne couramment l’invocation. Cette formulation conserve cette dimension cultuelle sans réduire le syntagme à la simple proclamation du nom.
- source_word: הוֹדִיעוּ בָעַמִּים עֲלִילֹתָיו
  choice: Faites connaître ses œuvres parmi les peuples
  rationale: Le hifil de ידע signifie « faire connaître » ; עֲלִילוֹת désigne les actions ou œuvres, et בָעַמִּים situe cette annonce parmi les différents peuples.
- source_word: הַזְכִּירוּ
  choice: proclamez
  rationale: Le hifil de זכר peut signifier faire mention ou rappeler. Dans ce parallélisme d’annonce publique, « proclamez » en restitue naturellement la portée.
- source_word: כִּי נִשְׂגָּב שְׁמוֹ
  choice: que son nom est élevé
  rationale: כִּי peut introduire le contenu de la proclamation, tandis que נשׂגב exprime ce qui est haut ou élevé. La possibilité causale est maintenue en note.
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le texte porte directement le tétragramme. « Yahweh » préserve le caractère de nom propre, tandis que la convention liturgique française est indiquée en note.
- issue: Valeur de כִּי après הַזְכִּירוּ
  choice: proclamez que son nom est élevé
  alternative: proclamez-le, car son nom est élevé
  rationale: כִּי peut introduire soit le contenu de la proclamation, soit sa raison. La lecture complétive convient au mouvement des impératifs, sans exclure la lecture causale signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Les impératifs pluriels s’adressent à la communauté. La ponctuation fait ressortir la succession poétique des appels à remercier, invoquer, faire connaître et proclamer.
