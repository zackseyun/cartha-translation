review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : les impératifs, l’annonce parmi les peuples et la grandeur du nom sont conservés. Toutefois, « faites appel à son nom » est moins fidèle à l’idiome cultuel קרא בשם que « invoquez son nom », et la formulation de la note b (« proclamez-le ») introduit un pronom-objet absent du texte et ne représente pas correctement l’autre analyse syntaxique de כי.'
  naturalness: Le français est globalement clair et moderne. « Rendez grâce à Yahweh » et « invoquez son nom » sont plus naturels dans ce registre biblique contemporain que « Remerciez Yahweh » et « faites appel à son nom ». « Exalté » rend plus idiomatiquement la majesté exprimée par נשגב.
  terminology: « Yahweh » correspond au choix explicite du projet et la note indique utilement l’usage traditionnel « le SEIGNEUR ». « Œuvres », « peuples » et « proclamez » conviennent au contexte. « Exalté » est préférable à « élevé » pour נשגב dans ce contexte.
  issues:
  - severity: medium
    issue: La note b donne « proclamez-le, car son nom est élevé » comme lecture alternative.
    rationale: 'L’hébreu porte הַזְכִּירוּ (« faites mention/proclamez »), suivi de כי נשגב שמו. Il ne contient pas de pronom correspondant à « le ». L’alternative doit seulement présenter כי avec sa valeur causale : « proclamez, car son nom est exalté ».'
  - severity: low
    issue: « Faites appel à son nom » affaiblit l’idiome d’invocation.
    rationale: קרא בשם signifie couramment invoquer quelqu’un par son nom dans ce contexte de louange. « Invoquez son nom » est à la fois plus exact et plus naturel dans un français biblique moderne.
  - severity: low
    issue: « Élevé » traduit de manière un peu littérale נשגב.
    rationale: Le terme exprime l’élévation majestueuse, l’exaltation. « Exalté » restitue mieux cette nuance sans ajout interprétatif.
