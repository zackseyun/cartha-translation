  to: 'En ce jour-là, vous direz : « Rendez grâce à Yahweh[a], invoquez son nom. Faites connaître ses œuvres parmi les peuples ; proclamez que son nom est exalté[b]. »'
  rationale: La révision améliore la fidélité à l’idiome hébreu d’invocation et au registre de louange, tout en conservant le choix de rendre le tétragramme par « Yahweh ». La note sur כי est corrigée afin de préserver sans ajout la lecture causale possible. Aucune ambiguïté textuelle n’est résolue de façon doctrinale.
