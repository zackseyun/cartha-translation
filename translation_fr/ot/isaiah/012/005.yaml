id: ISA.12.5
reference: Isaiah 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: זַמְּר֣וּ יְהוָ֔ה כִּ֥י גֵא֖וּת עָשָׂ֑ה מידעת זֹ֖את בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/012/005.yaml
  text: Sing praise to Yahweh[a], for he has done gloriously; let this be made known in all the earth.
translation:
  language: fr
  text: Chantez les louanges de Yahweh, car il a agi avec majesté[a] ; que cela soit connu sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car il a accompli des choses magnifiques » ou « car il a agi de façon admirable ».'
    reason: L’expression hébraïque גֵאוּת עָשָׂה peut décrire la majesté ou l’excellence de l’action, ou les œuvres magnifiques accomplies.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Chantez les louanges
  rationale: L’impératif pluriel au piel de זמר appelle une louange chantée ou musicale. Cette formulation exprime naturellement en français à la fois le chant et sa fonction de louange.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu comme nom propre divin plutôt que remplacé par un titre.
- source_word: כִּי
  choice: car
  rationale: La conjonction introduit ici le motif de l’appel à chanter.
- source_word: גֵאוּת עָשָׂה
  choice: il a agi avec majesté
  rationale: גֵאוּת désigne l’élévation, la majesté ou l’excellence. Avec עשה, la formulation adverbiale est naturelle en français et conserve le caractère abstrait du nom hébreu sans le transformer d’office en plusieurs œuvres.
- source_word: מידעת זֹאת
  choice: que cela soit connu
  rationale: 'Dans le contexte des appels à la proclamation, la forme est comprise avec une valeur passive et volitive : ce que Yahweh a fait doit être porté à la connaissance de tous.'
- source_word: בְּכָל הָאָרֶץ
  choice: sur toute la terre
  rationale: Le contexte hymnique universel favorise le sens global de אֶרֶץ. « Sur toute la terre » est l’expression française idiomatique.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte emploie directement le nom divin. Le conserver sous la forme « Yahweh » distingue le nom propre du titre אֲדֹנָי.
- issue: Portée de גֵאוּת עָשָׂה
  choice: il a agi avec majesté
  alternative: il a accompli des choses magnifiques
  rationale: L’hébreu emploie un nom abstrait singulier et permet plusieurs formulations. Le texte principal conserve l’idée de manière majestueuse d’agir, tandis que la note signale l’interprétation centrée sur les actes accomplis.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel « les louanges » rend idiomatiquement l’appel au chant, et le point-virgule maintient le parallélisme des deux exhortations.
