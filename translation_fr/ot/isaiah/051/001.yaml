source:
  edition: WLC
  text: שִׁמְע֥וּ אֵלַ֛/י רֹ֥דְפֵי צֶ֖דֶק מְבַקְשֵׁ֣י יְהוָ֑ה הַבִּ֨יטוּ֙ אֶל צ֣וּר חֻצַּבְתֶּ֔ם וְ/אֶל מַקֶּ֥בֶת בּ֖וֹר נֻקַּרְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/001.yaml
  text: 'Listen to me[a], you who pursue righteousness, you who seek Yahweh: look to the rock from which you were cut[c][b], and to the quarry from which you were dug.'
translation:
  language: fr
  text: 'Écoutez-moi, vous qui poursuivez la justice[a], vous qui cherchez Yahweh : regardez le rocher d’où vous avez été taillés, et le creux de la fosse d’où vous avez été tirés[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la droiture ».
    reason: lexical_alternative
  - marker: b
    text: Le verset 2 éclaire ces images en mentionnant Abraham et Sara.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: L’impératif pluriel appelle à une écoute attentive; « Écoutez-moi » est direct, naturel et fidèle.
- source_word: רֹדְפֵי צֶדֶק
  choice: vous qui poursuivez la justice
  rationale: צֶדֶק désigne ici ce qui est juste et droit devant Dieu. « Justice » conserve en français la portée morale et relationnelle du terme, tandis que « poursuivez » maintient l’image active.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: vous qui cherchez Yahweh
  rationale: La construction participiale est rendue parallèlement à la précédente; le nom divin est translittéré plutôt que remplacé par un titre.
- source_word: הַבִּיטוּ אֶל צוּר
  choice: regardez le rocher
  rationale: La formulation préserve l’impératif concret et la métaphore du rocher sans l’interpréter avant le verset suivant.
- source_word: חֻצַּבְתֶּם
  choice: d’où vous avez été taillés
  rationale: Le passif de חצב évoque l’action de tailler ou d’extraire de la roche. Cette formulation française garde l’image de la taille de pierre.
- source_word: מַקֶּבֶת בּוֹר
  choice: le creux de la fosse
  rationale: L’expression rare associe un lieu creusé ou excavé à une fosse. « Le creux de la fosse » conserve les deux éléments sans réduire d’emblée l’image à une simple « carrière ».
- source_word: נֻקַּרְתֶּם
  choice: d’où vous avez été extraits
  rationale: Le verbe passif exprime l’extraction hors d’une cavité; « extraits » est naturel et maintient le parallélisme avec la pierre taillée.
theological_decisions:
- issue: Interprétation du rocher et de la fosse
  choice: Conserver la métaphore dans le texte principal
  alternative: Identifier explicitement Abraham et Sara
  rationale: Le verset 2 donne cette identification, mais le verset 1 présente encore l’image sous forme métaphorique. La conserver respecte la progression du texte.
- issue: Portée de צֶדֶק
  choice: justice
  alternative: droiture
  rationale: Le mot hébreu couvre la justice et la droiture. « Justice » est clair en français moderne et laisse subsister cette ampleur sémantique; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme des deux groupes interpellés et celui des deux images d’origine sont conservés. Les marqueurs de notes figurent tous dans le texte principal.
