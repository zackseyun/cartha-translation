  source_fidelity: Le texte rend fidèlement les impératifs pluriels, les deux participes désignant les destinataires, le nom Yahweh, ainsi que le double champ imagé de la taille et de l’excavation. « Le creux de la fosse » est une solution prudente pour l’expression rare מַקֶּבֶת בּוֹר et conserve ses deux composantes sans imposer « carrière ». « Extraits » communique bien le passif final, mais « tirés » correspond plus directement et plus naturellement en français à l’image d’une fosse dont un peuple est issu.
  naturalness: Le français est moderne, clair et de registre biblique accessible. « D’où vous avez été tirés » est plus idiomatique que « d’où vous avez été extraits » dans cette métaphore, tout en évitant l’expression peu naturelle « creusés hors de ».
  terminology: « Justice » est un choix défendable pour צֶדֶק dans ce contexte; la note « droiture » signale utilement une autre nuance possible. Yahweh est rendu de façon cohérente. Les notes de renvoi doivent toutefois indiquer que le verset 2 éclaire ensemble les deux images par Abraham et Sara, plutôt que de les présenter comme deux affirmations séparées ou seulement successives.
