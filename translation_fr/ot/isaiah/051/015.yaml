id: ISA.51.15
reference: Isaiah 51:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ רֹגַ֣ע הַ/יָּ֔ם וַ/יֶּהֱמ֖וּ גַּלָּ֑י/ו יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/015.yaml
  text: For I am Yahweh your God[b][a], who stirs up the sea so that its waves roar— Yahweh of hosts is his name.
translation:
  language: fr
  text: Car moi, je suis Yahvé, ton Dieu, qui agite la mer, et ses vagues grondent[a] — Yahvé des armées est son nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui apaise la mer, tandis que ses vagues grondent ». Le participe hébreu peut être compris au sens d’« agiter » ou d’« apaiser »; la proposition qui suit favorise ici « agite ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu dit littéralement : « Yahvé des armées est son nom ». Malgré le discours à la première personne, le texte porte ici « son », et non « mon ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Car moi, je suis
  rationale: Le waw prend ici une valeur explicative dans la suite de l’assurance donnée, tandis que le pronom indépendant אָֽנֹכִי porte l’emphase. Cette formulation française conserve les deux aspects sans lourdeur excessive.
- source_word: יְהוָה
  choice: Yahvé
  rationale: Forme française courante du nom divin יהוה, employée comme nom propre plutôt que remplacée par un titre.
- source_word: אֱלֹהֶיךָ
  choice: ton Dieu
  rationale: Rend directement le nom avec son suffixe masculin singulier de deuxième personne et conserve l’adresse personnelle.
- source_word: רֹגַע
  choice: qui agite
  rationale: Le participe peut être rattaché à l’idée d’agiter ou à celle d’apaiser. La mention immédiate des vagues qui grondent favorise ici le sens « agiter ».
- source_word: הַיָּם
  choice: la mer
  rationale: Traduction directe du nom défini.
- source_word: וַיֶּהֱמוּ
  choice: et … grondent
  rationale: Le verbe décrit le tumulte sonore des vagues. Le présent français s’accorde naturellement avec le participe qui exprime l’action caractéristique de Dieu, tout en gardant la coordination hébraïque.
- source_word: גַּלָּיו
  choice: ses vagues
  rationale: Le suffixe masculin singulier renvoie à la mer; le possessif français « ses » exprime ce rapport naturellement.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahvé des armées
  rationale: Cette traduction conserve le nom divin ainsi que la portée collective et militaire de צְבָאוֹת, sans paraphrase doctrinale.
- source_word: שְׁמוֹ
  choice: est son nom
  rationale: Le suffixe hébreu est à la troisième personne du singulier. La traduction préserve ce changement de personne au lieu de le régulariser en « mon nom ».
theological_decisions:
- issue: Traduction du nom divin יהוה
  choice: Yahvé
  alternative: le Seigneur
  rationale: Le texte porte un nom propre. La forme « Yahvé », adaptée à l’usage français, le préserve au lieu de lui substituer un titre.
- issue: Sens de רֹגַע appliqué à la mer
  choice: qui agite la mer
  alternative: qui apaise la mer
  rationale: Les deux analyses lexicales sont attestées, mais les vagues qui grondent dans la proposition suivante favorisent l’idée d’agitation. L’autre possibilité est signalée en note afin de ne pas effacer l’ambiguïté.
- issue: Personne grammaticale de שְׁמוֹ dans le discours divin
  choice: est son nom
  alternative: est mon nom
  rationale: Malgré le passage inattendu de la première à la troisième personne, le texte massorétique porte bien un suffixe de troisième personne; celui-ci est donc maintenu.
translation_notes:
  register: Français international actuel, sobre et digne. L’emphase de אָנֹכִי est rendue par « moi, je suis ». « Grondent » restitue l’image sonore sans archaïsme. Le titre « Yahvé des armées » conserve la formulation et la tension militaires de l’hébreu.
