source:
  edition: WLC
  text: וָ/אָשִׂ֤ים דְּבָרַ/י֙ בְּ/פִ֔י/ךָ וּ/בְ/צֵ֥ל יָדִ֖/י כִּסִּיתִ֑י/ךָ לִ/נְטֹ֤עַ שָׁמַ֨יִם֙ וְ/לִ/יסֹ֣ד אָ֔רֶץ וְ/לֵ/אמֹ֥ר לְ/צִיּ֖וֹן עַמִּ/י אָֽתָּה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/016.yaml
  text: And I have put my words in your mouth[a], and covered you with the shadow of my hand, to plant the heavens and to found the earth, and to say to Zion[b], ‘You are my people.’
translation:
  language: fr
  text: 'Et j’ai mis mes paroles dans ta bouche, et je t’ai couvert de l’ombre de ma main[a], pour planter les cieux[b], pour fonder la terre et pour dire à Sion : « Tu es mon peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le sens de la préposition : « je t’ai abrité à l’ombre de ma main » ou « sous l’ombre de ma main ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour établir les cieux ». L’hébreu dit littéralement « planter les cieux », image inhabituelle qui peut évoquer la création ou une restauration comparable à une nouvelle création.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׂים
  choice: Et j’ai mis
  rationale: Le verbe שׂים signifie « mettre, placer ». La forme est rendue avec une valeur accomplie, en parallèle avec « je t’ai couvert », tout en conservant l’enchaînement marqué par ו.
- source_word: דְּבָרַי בְּפִיךָ
  choice: mes paroles dans ta bouche
  rationale: Le pluriel « mes paroles » et l’image concrète de paroles placées « dans ta bouche » sont conservés, conformément au langage de mission prophétique.
- source_word: וּבְצֵל יָדִי כִּסִּיתִיךָ
  choice: et je t’ai couvert de l’ombre de ma main
  rationale: « Couvrir » rend directement כסה, tandis que « de l’ombre de ma main » garde la métaphore protectrice et permet une lecture instrumentale de בְּ.
- source_word: לִנְטֹעַ שָׁמַיִם
  choice: pour planter les cieux
  rationale: נטע signifie normalement « planter ». Cette image inhabituelle est préservée plutôt que normalisée par « établir » ou remplacée par « déployer ».
- source_word: וְלִיסֹד אָרֶץ
  choice: pour fonder la terre
  rationale: יסד exprime l’action de fonder ou de poser des fondations. « Fonder » maintient l’image de la fondation et se distingue du verbe précédent.
- source_word: וְלֵאמֹר לְצִיּוֹן
  choice: et pour dire à Sion
  rationale: אמר est le verbe courant « dire » ; aucune intensification interprétative telle que « proclamer » n’est nécessaire.
- source_word: עַמִּי אָתָּה
  choice: Tu es mon peuple
  rationale: Cette formulation française naturelle conserve l’adresse au singulier à Sion personnifiée ainsi que la formule d’appartenance collective « mon peuple ».
theological_decisions:
- issue: Référent du « tu » singulier
  choice: Le singulier est conservé sans identifier explicitement l’interlocuteur.
  alternative: Préciser qu’il s’agit du serviteur, du prophète ou d’Israël/Sion personnifié.
  rationale: Le verset hébreu ne nomme pas explicitement l’interlocuteur de « ta bouche » et « je t’ai couvert ». La traduction préserve donc cette ambiguïté.
- issue: Portée des propositions « planter les cieux » et « fonder la terre »
  choice: Le langage cosmique de création est maintenu tel quel.
  alternative: L’expliciter comme une métaphore de la restauration d’Israël ou comme une description exclusivement littérale de la création cosmique.
  rationale: Le texte associe un langage fort de création à une parole adressée à Sion. Il convient de ne pas réduire cette tension à une seule interprétation.
- issue: Sujet implicite des infinitifs de but
  choice: La tournure « pour planter… pour fonder… et pour dire… » conserve les infinitifs sans ajouter de sujet explicite.
  alternative: Ajouter « afin que je… » ou « afin que tu… », ce qui imposerait une identification du sujet.
  rationale: Les infinitifs hébreux n’expriment pas ici leur sujet de manière autonome ; la formulation française évite autant que possible d’ajouter une précision interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « pour » clarifie la structure des trois propositions finales sans effacer leur parallélisme. L’image saisissante « planter les cieux » et l’ambiguïté de l’interlocuteur sont volontairement conservées.
