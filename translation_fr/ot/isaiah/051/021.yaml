  text: 'Therefore, please hear this, afflicted one, drunk, but not from wine:'
translation:
  language: fr
  text: 'C’est pourquoi, écoute donc ceci, toi qui es affligée, ivre, mais non de vin :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: C’est pourquoi
  rationale: Rend la conséquence introduite par l’adverbe hébreu dans un français naturel et soutenu.
- source_word: שִׁמְעִי נָא
  choice: écoute donc
  rationale: L’impératif féminin singulier s’adresse à la destinataire personnifiée; נָא apporte ici une nuance d’insistance ou de sollicitation, naturellement exprimée par « donc ».
- source_word: עֲנִיָּה
  choice: toi qui es affligée
  rationale: Le féminin singulier décrit la destinataire éprouvée; cette tournure vocative évite le substantif peu naturel « affligée » employé seul.
- source_word: וּשְׁכֻרַת
  choice: ivre
  rationale: Conserve l’image forte de l’hébreu et l’accord féminin avec la destinataire.
- source_word: וְלֹא מִיָּיִן
  choice: mais non de vin
  rationale: 'Exprime le contraste explicite: son état ressemble à l’ivresse, sans avoir le vin pour cause.'
theological_decisions:
- issue: Nature de l’ivresse métaphorique
  choice: Ne pas en préciser la cause dans ce verset
  alternative: Expliciter « ivre du jugement/de la colère »
  rationale: Le texte dit seulement « ivre, mais non de vin »; l’explication appartient au contexte et ne doit pas être ajoutée au verset.
translation_notes:
  register: Français moderne, digne et directement intelligible. Le féminin est conservé pour refléter les formes hébraïques et l’adresse à Sion/Jérusalem personnifiée. La ponctuation finale introduit naturellement la suite du discours.
