id: ISA.51.14
reference: Isaiah 51:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: מִהַ֥ר צֹעֶ֖ה לְ/הִפָּתֵ֑חַ וְ/לֹא יָמ֣וּת לַ/שַּׁ֔חַת וְ/לֹ֥א יֶחְסַ֖ר לַחְמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/014.yaml
  text: The one bent low will soon be set free[a]; he will not die in the pit[b], and his bread will not be lacking.
translation:
  language: fr
  text: Celui qui est courbé sera bientôt libéré[a] ; il ne mourra pas dans la fosse[b], et son pain ne lui manquera pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le captif sera bientôt relâché ». L’expression hébraïque est difficile ; elle peut évoquer une personne courbée sous l’oppression, puis libérée.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans le cachot ». Le mot hébreu traduit par « fosse » peut désigner une fosse, un cachot ou, au sens figuré, la destruction ou la tombe.
    reason: alternative_reading
lexical_decisions:
- source_word: מִהַר
  choice: bientôt
  rationale: Le verbe exprime la hâte ou l’imminence ; « bientôt » rend naturellement ici la promesse d’une délivrance proche.
- source_word: צֹעֶה
  choice: celui qui est courbé
  rationale: Ce participe difficile peut évoquer une personne courbée ou accroupie sous l’oppression. Cette formulation conserve l’image sans préciser indûment qu’il s’agit nécessairement d’un prisonnier.
- source_word: לְהִפָּתֵחַ
  choice: sera libéré
  rationale: Littéralement « être ouvert », le niphal de פתח désigne ici, par emploi idiomatique, la mise en liberté.
- source_word: וְלֹא יָמוּת
  choice: il ne mourra pas
  rationale: Le yiqtol nié exprime l’assurance qu’il échappera à la mort.
- source_word: לַשַּׁחַת
  choice: dans la fosse
  rationale: שחת peut désigner une fosse, un cachot, la tombe ou la destruction. « La fosse » maintient l’image concrète et sa résonance mortelle.
- source_word: וְלֹא יֶחְסַר לַחְמוֹ
  choice: son pain ne lui manquera pas
  rationale: Cette formulation reste proche de l’hébreu, conserve l’image concrète du pain et demeure naturelle en français.
theological_decisions:
- issue: Identification de la personne opprimée
  choice: Une personne opprimée au singulier, susceptible de représenter le peuple exilé
  alternative: Un prisonnier particulier ou, plus généralement, toute personne qui souffre
  rationale: Le singulier grammatical de l’hébreu est conservé, tandis que la formulation reste assez large pour ne pas imposer une identification plus précise que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur exprime l’assurance prophétique ; la répétition de « pas » et l’image concrète du pain préservent la structure et le relief de l’hébreu.
