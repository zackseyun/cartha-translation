id: ISA.51.20
reference: Isaiah 51:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: בָּנַ֜יִ/ךְ עֻלְּפ֥וּ שָׁכְב֛וּ בְּ/רֹ֥אשׁ כָּל חוּצ֖וֹת כְּ/ת֣וֹא מִכְמָ֑ר הַֽ/מְלֵאִ֥ים חֲמַת יְהוָ֖ה גַּעֲרַ֥ת אֱלֹהָֽיִ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/020.yaml
  text: Your sons have fainted[a]; they lie at the head of every street, like an antelope in a net, full of the wrath of Yahweh[b], the rebuke of your God.
translation:
  language: fr
  text: Tes fils se sont évanouis ; ils gisent à l’entrée de toutes les rues[a], comme une antilope prise dans un filet[b]. Ils sont remplis de la fureur de Yahweh, de la réprimande de ton Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à chaque coin de rue ». Littéralement : « à la tête de toutes les rues ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « comme un bœuf sauvage pris dans un filet ». Le terme hébreu désignant l’animal est incertain.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַיִךְ
  choice: Tes fils
  rationale: Le pluriel de בֵּן avec suffixe féminin singulier signifie littéralement « tes fils ». La formulation genrée est conservée, sans l’élargir silencieusement à « tes enfants ».
- source_word: עֻלְּפוּ
  choice: se sont évanouis
  rationale: La forme exprime la perte de forces allant jusqu’à l’évanouissement. Cette tournure française naturelle rend leur effondrement physique.
- source_word: שָׁכְבוּ
  choice: ils gisent
  rationale: Le verbe décrit leur position étendue après leur évanouissement. « Gisent » est concis, expressif et approprié à la gravité de la scène.
- source_word: בְּרֹאשׁ כָּל חוּצוֹת
  choice: à l’entrée de toutes les rues
  rationale: רֹאשׁ désigne la tête, le commencement ou l’extrémité. Dans ce contexte urbain, « à l’entrée » reste proche de l’image hébraïque tout en étant intelligible ; l’interprétation « à chaque coin de rue » est signalée en note.
- source_word: כְּתוֹא
  choice: comme une antilope
  rationale: L’identification zoologique de תּוֹא demeure incertaine. « Antilope » communique naturellement l’image d’un animal sauvage capturé, sans exclure l’autre identification traditionnelle donnée en note.
- source_word: מִכְמָר
  choice: prise dans un filet
  rationale: Le nom désigne un filet servant à capturer des animaux. L’ajout idiomatique de « prise » explicite en français la situation impliquée par l’image hébraïque.
- source_word: הַמְלֵאִים
  choice: Ils sont remplis de
  rationale: Le participe pluriel qualifie les fils. Une nouvelle phrase rend clairement ce rattachement grammatical et évite que la comparaison avec l’antilope ne devienne le référent apparent.
- source_word: חֲמַת יְהוָה
  choice: la fureur de Yahweh
  rationale: חֵמָה évoque une colère ardente et intense ; « fureur » en conserve la force. Le nom divin est rendu par « Yahweh » conformément au choix du projet.
- source_word: גַּעֲרַת אֱלֹהָיִךְ
  choice: la réprimande de ton Dieu
  rationale: גְּעָרָה désigne une réprimande énergique ou une parole de blâme. « Réprimande » préserve ce sens sans y introduire une interprétation doctrinale supplémentaire.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte porte explicitement le tétragramme. « Yahweh » conserve le nom propre divin selon la convention du projet plutôt que de le remplacer par un titre.
- issue: Identification de l’animal תּוֹא
  choice: antilope
  alternative: bœuf sauvage
  rationale: L’espèce exacte est incertaine et n’affecte pas le propos théologique du verset. Le texte principal retient une identification courante, tandis que l’autre possibilité est conservée en note.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Gisent » maintient la gravité poétique du passage sans archaïsme excessif. La division en deux phrases clarifie que « remplis » se rapporte aux fils.
