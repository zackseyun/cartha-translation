  text: אָנֹכִ֧י אָנֹכִ֛י ה֖וּא מְנַחֶמְ/כֶ֑ם מִֽי אַ֤תְּ וַ/תִּֽירְאִי֙ מֵ/אֱנ֣וֹשׁ יָמ֔וּת וּ/מִ/בֶּן אָדָ֖ם חָצִ֥יר יִנָּתֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/012.yaml
  text: I[a], I am he who comforts you. Who are you that you fear man, who dies, and the son of man, who is made like grass?
translation:
  language: fr
  text: « C’est moi, moi, qui vous console. Qui es-tu donc pour avoir peur d’un être humain qui mourra, d’un fils d’homme[a] qui devient pareil à l’herbe ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un être humain ». Ici, l’expression hébraïque « fils d’homme » désigne un être humain ordinaire et n’est pas nécessairement un titre messianique.
    reason: Préciser la valeur idiomatique et non nécessairement messianique de בֶּן־אָדָם tout en conservant l’expression hébraïque dans le texte.
lexical_decisions:
- source_word: אָנֹכִי אָנֹכִי
  choice: C’est moi, moi
  rationale: Le redoublement emphatique est conservé. La tournure française « C’est moi, moi qui… » exprime naturellement l’insistance de l’hébreu sans l’aplanir.
- source_word: הוּא מְנַחֶמְכֶם
  choice: qui vous console
  rationale: Dans cette formule d’auto-identification, הוּא renforce le sujet et s’intègre naturellement à « C’est moi… qui ». Le participe présente l’action de consoler comme caractéristique ou continue. Le pluriel de כֶם est conservé par « vous ».
- source_word: מִי אַתְּ וַתִּירְאִי
  choice: Qui es-tu donc pour avoir peur
  rationale: La question rhétorique et l’interpellation directe sont préservées. « Donc » rend la force argumentative sans ajouter d’explication doctrinale. Le français ne marque pas ici le féminin singulier de l’hébreu.
- source_word: אֱנוֹשׁ יָמוּת
  choice: un être humain qui mourra
  rationale: אֱנוֹשׁ désigne ici l’être humain dans sa fragilité. Le futur « mourra » rend l’imparfait hébreu comme certitude de la mortalité humaine.
- source_word: בֶּן אָדָם
  choice: un fils d’homme
  rationale: Le calque mesuré conserve le parallélisme et l’image hébraïques. L’article indéfini convient à la valeur générique de l’expression dans ce contexte; une note précise qu’il s’agit de l’humanité ordinaire.
- source_word: חָצִיר יִנָּתֵן
  choice: qui sera rendu semblable à l’herbe
  rationale: Le niphal de נתן reçoit ici une valeur résultative ou comparative. Cette formulation garde le passif et l’image de l’herbe, symbole de fragilité et de caractère éphémère.
theological_decisions:
- issue: Valeur de בֶּן אָדָם dans ce contexte prophétique
  choice: un fils d’homme
  alternative: un être humain
  rationale: L’expression est parallèle à אֱנוֹשׁ et désigne ici un humain ordinaire, non nécessairement un titre messianique. La traduction conserve néanmoins la forme imagée de l’hébreu, tandis que la note prévient une lecture indûment titularisée.
translation_notes:
  register: Français international moderne, digne et accessible. L’emphase initiale, la question rhétorique, le passage du « vous » pluriel au « tu » féminin singulier dans l’hébreu, ainsi que le parallélisme poétique sont respectés autant que le permet la morphologie française.
