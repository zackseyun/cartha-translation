  terminology: « Fils d’homme » est une restitution littérale recevable dans ce parallélisme non titularisé, à condition que la note précise clairement son sens idiomatique contextuel. « Être humain » rend naturellement אֱנוֹשׁ et évite de confondre les deux expressions hébraïques.
