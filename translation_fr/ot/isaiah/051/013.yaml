  naturalness: Le français est globalement naturel, digne et accessible. « Sans cesse, toute la journée » est un peu plus idiomatique et direct que « sans cesse, tout au long du jour ».
  terminology: « Yahweh », « oppresseur » et « fureur » sont appropriés. « Celui qui t’a fait » exprime correctement עֹשֶׂךָ sans imposer de terminologie confessionnelle. La note conserve de façon adéquate l’ambiguïté de la proposition introduite par כַּאֲשֶׁר.
