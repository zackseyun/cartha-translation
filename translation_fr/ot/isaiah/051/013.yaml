source:
  edition: WLC
  text: וַ/תִּשְׁכַּ֞ח יְהוָ֣ה עֹשֶׂ֗/ךָ נוֹטֶ֣ה שָׁמַיִם֮ וְ/יֹסֵ֣ד אָרֶץ֒ וַ/תְּפַחֵ֨ד תָּמִ֜יד כָּל הַ/יּ֗וֹם מִ/פְּנֵי֙ חֲמַ֣ת הַ/מֵּצִ֔יק כַּ/אֲשֶׁ֥ר כּוֹנֵ֖ן לְ/הַשְׁחִ֑ית וְ/אַיֵּ֖ה חֲמַ֥ת הַ/מֵּצִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/013.yaml
  text: and you forgot Yahweh your Maker[a], who stretched out the heavens and founded the earth, and you feared continually all day long because of the fury of the oppressor, when he set himself to destroy. But where is the fury of the oppressor?
translation:
  language: fr
  text: Tu as oublié Yahweh, celui qui t’a fait, qui étend les cieux et fonde la terre, et tu as eu peur sans cesse, toute la journée, à cause de la fureur de l’oppresseur, lorsqu’il se préparait à détruire[a]. Mais où est donc la fureur de l’oppresseur ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme s’il était prêt à détruire ».'
    reason: Le groupe כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית peut être compris temporellement ou avec une nuance modale.
lexical_decisions:
- source_word: וַתִּשְׁכַּח
  choice: Tu as oublié
  rationale: Le wayyiqtol qal à la 2e personne du masculin singulier porte ici une accusation à valeur accomplie. Le passé composé est naturel en français moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcription du nom divin, plutôt que substitution par un titre.
- source_word: עֹשֶׂךָ
  choice: celui qui t’a fait
  rationale: Rend directement le participe avec suffixe de 2e personne. Cette formulation est plus naturelle en français courant que « ton Créateur » tout en conservant le lien personnel exprimé par le suffixe.
- source_word: נוֹטֶה שָׁמַיִם
  choice: qui a déployé les cieux
  rationale: « Déployer » restitue l’image cosmologique de נטה et s’intègre naturellement à la proposition relative.
- source_word: וְיֹסֵד אָרֶץ
  choice: et posé les fondations de la terre
  rationale: Explicite sans lourdeur l’image fondatrice portée par יסד.
- source_word: וַתְּפַחֵד
  choice: Tu as eu peur
  rationale: Rend directement פחד sans intensifier le verbe jusqu’à « trembler ».
- source_word: תָּמִיד כָּל הַיּוֹם
  choice: sans cesse, tout au long du jour
  rationale: Conserve les deux indications de durée et leur effet d’insistance dans un français idiomatique.
- source_word: מִפְּנֵי חֲמַת הַמֵּצִיק
  choice: à cause de la fureur de l’oppresseur
  rationale: מִפְּנֵי a ici une valeur causale; « fureur » exprime la force de חֲמַת et « oppresseur » rend directement le participe substantivé.
- source_word: כַּאֲשֶׁר כּוֹנֵן לְהַשְׁחִית
  choice: lorsqu’il se préparait à détruire
  rationale: Rend la lecture temporelle et la notion de préparation ou de disposition exprimée par כּוֹנֵן, avec l’oppresseur comme sujet le plus proche.
- source_word: וְאַיֵּה חֲמַת הַמֵּצִיק
  choice: Mais où est donc la fureur de l’oppresseur ?
  rationale: « Mais » fait ressortir le contraste rhétorique; « donc » soutient naturellement la force de la question en français sans en modifier le sens.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / Jéhovah
  rationale: Le texte emploie directement le tétragramme; sa transcription préserve le nom propre au lieu de lui substituer un titre.
- issue: Référent du sujet de כּוֹנֵן לְהַשְׁחִית
  choice: 'L’oppresseur est le sujet : « lorsqu’il se préparait à détruire »'
  alternative: 'Lecture modale : « comme s’il était prêt à détruire »'
  rationale: L’oppresseur est l’antécédent immédiat et demeure au centre de la question rhétorique suivante. La valeur exacte de כַּאֲשֶׁר et de כּוֹנֵן admet toutefois une nuance modale, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement singulier conforme aux formes hébraïques. La répétition de « la fureur de l’oppresseur » est maintenue pour préserver l’effet rhétorique de l’original.
