id: ISA.51.9
reference: Isaiah 51:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: עוּרִ֨י עוּרִ֤י לִבְשִׁי עֹז֙ זְר֣וֹעַ יְהוָ֔ה ע֚וּרִי כִּ֣/ימֵי קֶ֔דֶם דֹּר֖וֹת עוֹלָמִ֑ים הֲ/ל֥וֹא אַתְּ הִ֛יא הַ/מַּחְצֶ֥בֶת רַ֖הַב מְחוֹלֶ֥לֶת תַּנִּֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/009.yaml
  text: Awake[a], awake, put on strength, arm of Yahweh; awake, as in days of old, generations of long ago[b]. Was it not you who cut Rahab in pieces, who pierced the dragon?
translation:
  language: fr
  text: Réveille-toi, réveille-toi, revêts-toi de force, bras de Yahweh ! Réveille-toi, comme aux jours d’autrefois, comme aux générations des temps anciens. N’est-ce pas toi qui as taillé Rahab en pièces[a], qui as transpercé le dragon[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Rahab est ici le nom poétique d’une puissance ennemie orgueilleuse, souvent comprise dans ce passage comme une désignation de l’Égypte.
    reason: cross_reference
  - marker: b
    text: Ou « le monstre marin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Réveille-toi
  rationale: L’impératif féminin singulier s’adresse au « bras » personnifié. « Réveille-toi » conserve la répétition poétique et reste naturel en français moderne.
- source_word: לִבְשִׁי עֹז
  choice: revêts-toi de force
  rationale: Cette formulation préserve l’image hébraïque qui consiste à se vêtir de force, avec un registre poétique et digne.
- source_word: זְרוֹעַ יְהוָה
  choice: bras de Yahweh
  rationale: L’expression désigne la puissance de Yahweh en action. Le vocatif et le nom divin sont conservés directement.
- source_word: כִּימֵי קֶדֶם
  choice: comme aux jours d’autrefois
  rationale: La formule évoque les temps anciens tout en gardant une tournure française claire et poétique.
- source_word: דֹּרוֹת עוֹלָמִים
  choice: comme au temps des générations anciennes
  rationale: Le second « comme » explicite naturellement le parallélisme en français sans transformer עוֹלָמִים en affirmation métaphysique d’éternité.
- source_word: הֲלוֹא אַתְּ הִיא
  choice: N’est-ce pas toi
  rationale: Cette question rhétorique convient à l’adresse directe au bras personnifié et renvoie à ses actions passées.
- source_word: הַמַּחְצֶבֶת
  choice: qui as taillé … en pièces
  rationale: Le participe vient d’un verbe signifiant tailler ou fendre. « Tailler en pièces » rend ici la défaite violente de Rahab.
- source_word: רַהַב
  choice: Rahab
  rationale: La translittération conserve le nom poétique d’une puissance ennemie orgueilleuse, probablement associé ici à l’Égypte, sans réduire l’image à cette seule identification.
- source_word: מְחוֹלֶלֶת
  choice: qui as transpercé
  rationale: « Transpercé » rend l’action violente du participe et s’accorde avec l’imagerie du combat contre un monstre.
- source_word: תַּנִּין
  choice: le dragon
  rationale: Dans ce contexte poétique, le mot évoque un monstre du chaos plutôt qu’un reptile ordinaire. « Monstre marin » demeure une autre traduction possible.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre divin est rendu directement par « Yahweh », plutôt que remplacé par un titre.
- issue: Interprétation des images de Rahab et du תַּנִּין
  choice: Conserver « Rahab » et « le dragon »
  alternative: Identifier explicitement Rahab à l’Égypte et traduire תַּנִּין par « monstre marin »
  rationale: Les images superposent vraisemblablement l’exode, la défaite de l’Égypte et le langage poétique du combat contre le chaos. Les conserver évite de résoudre une ambiguïté voulue.
translation_notes:
  register: Français international moderne, poétique et digne. La répétition des impératifs, la personnification du bras de Yahweh et les images de combat ont été conservées. Les deux appels « comme » clarifient le parallélisme temporel en français.
