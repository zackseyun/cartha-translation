  text: וְ/שַׂמְתִּ֨י/הָ֙ בְּ/יַד מוֹגַ֔יִ/ךְ אֲשֶׁר אָמְר֥וּ לְ/נַפְשֵׁ֖/ךְ שְׁחִ֣י וְ/נַעֲבֹ֑רָה וַ/תָּשִׂ֤ימִי כָ/אָ֨רֶץ֙ גֵּוֵ֔/ךְ וְ/כַ/ח֖וּץ לַ/עֹבְרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/023.yaml
  text: And I will put it into the hand of those who afflict you, who said to you, ‘Bow down, so that we may pass over’; and you made your back like the ground, and like the street for those passing by.
translation:
  language: fr
  text: 'Je la remettrai entre les mains de ceux qui t’affligent, eux qui t’ont dit : « Courbe-toi pour que nous passions ! » Tu as fait de ton dos comme le sol, comme une rue pour les passants.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשַׂמְתִּיהָ
  choice: Je la remettrai
  rationale: Le pronom féminin renvoie à la coupe évoquée au verset précédent. « Remettrai » exprime naturellement le transfert annoncé, sans ajouter le référent dans le texte.
- source_word: מוֹגַיִךְ
  choice: ceux qui t’affligeaient
  rationale: Le participe désigne ceux qui causaient détresse ou oppression. « Affligeaient » conserve la portée large du terme et convient au contexte.
- source_word: לְנַפְשֵׁךְ
  choice: te
  rationale: Ici, נֶפֶשׁ désigne la personne elle-même; le français idiomatique emploie donc le pronom personnel plutôt que « à ton âme ».
- source_word: שְׁחִי
  choice: Courbe-toi
  rationale: L’impératif exige un abaissement corporel humiliant; « Courbe-toi » rend ce geste sans préciser davantage la posture.
- source_word: וְנַעֲבֹרָה
  choice: que nous passions
  rationale: La forme cohortative exprime le but ou la volonté des oppresseurs. Cette tournure française garde sa concision et sa force.
- source_word: גֵּוֵךְ
  choice: ton dos
  rationale: Le nom désigne ici le dos, présenté comme une surface sur laquelle on passe.
- source_word: כַחוּץ
  choice: comme une rue
  rationale: חוּץ peut désigner l’espace extérieur ou la rue. Le parallélisme avec le sol et les passants favorise « rue ».
- source_word: לַעֹבְרִים
  choice: pour les passants
  rationale: Le participe substantivé désigne ceux qui passent; « les passants » est naturel et conserve l’image.
theological_decisions:
- issue: Référent du pronom féminin dans « Je la remettrai »
  choice: Conserver le pronom implicite renvoyant à la coupe du verset 22
  alternative: 'Expliciter : « Je remettrai cette coupe »'
  rationale: L’hébreu emploie un suffixe pronominal et le contexte immédiat identifie clairement la coupe; conserver le pronom respecte la cohésion du passage sans explicitation interprétative.
- issue: Valeur temporelle de וַתָּשִׂימִי
  choice: « Alors tu faisais »
  alternative: « et tu as fait »
  rationale: Le récit décrit l’humiliation subie de manière durative ou répétée. L’imparfait français rend naturellement cette scène, tandis que « alors » articule la conséquence sans modifier l’image théologique.
translation_notes:
  register: Français international moderne, digne et lisible. L’image brutale du dos transformé en voie de passage est conservée sans l’adoucir. Le tutoiement singulier féminin reflète l’adresse à Sion/Jérusalem.
