  text: כִּ֤י כַ/בֶּ֨גֶד֙ יֹאכְלֵ֣/ם עָ֔שׁ וְ/כַ/צֶּ֖מֶר יֹאכְלֵ֣/ם סָ֑ס וְ/צִדְקָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וִ/ישׁוּעָתִ֖/י לְ/ד֥וֹר דּוֹרִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/008.yaml
  text: For the moth will eat them like a garment[a], and the worm will eat them like wool; but my righteousness will be forever, and my salvation to generation after generation.
translation:
  language: fr
  text: Car la teigne les dévorera comme un vêtement, et la larve les dévorera comme la laine ; mais ma justice[a] subsistera pour toujours, et mon salut subsistera de génération en génération.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ma droiture ». Le mot hébreu peut évoquer aussi bien la rectitude morale que la justice exercée.
    reason: alternative lexicale
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit naturellement en français la raison donnée à l’exhortation précédente.
- source_word: כַבֶּגֶד
  choice: comme un vêtement
  rationale: Rend directement l’image poétique du בֶּגֶד, pièce d’habillement ou vêtement.
- source_word: יֹאכְלֵם
  choice: les dévorera
  rationale: Conserve l’image vive du verbe אכל, « manger », tout en exprimant idiomatiquement en français l’action destructrice d’un insecte.
- source_word: עָשׁ
  choice: la teigne
  rationale: Désigne l’insecte qui s’attaque aux vêtements ; « teigne » est précis et courant dans ce contexte.
- source_word: וְכַצֶּמֶר
  choice: et … comme la laine
  rationale: Préserve le parallélisme avec le vêtement ainsi que le sens concret de צֶמֶר.
- source_word: סָס
  choice: la larve
  rationale: Le terme rare désigne vraisemblablement une créature qui détruit les textiles. « Larve » conserve cette image sans identifier l’espèce avec une précision injustifiée.
- source_word: וְצִדְקָתִי
  choice: mais ma justice
  rationale: « Justice » peut exprimer en français à la fois la rectitude de Dieu et son action conforme au droit. « Mais » rend le contraste implicite entre la disparition des adversaires et la permanence divine.
- source_word: לְעוֹלָם תִּהְיֶה
  choice: subsistera pour toujours
  rationale: Exprime naturellement la permanence durable indiquée par le texte hébreu, sans archaïsme.
- source_word: וִישׁוּעָתִי
  choice: et mon salut
  rationale: « Salut » garde la portée large de יְשׁוּעָה, qui désigne l’action par laquelle Dieu sauve ou délivre.
- source_word: לְדֹר דּוֹרִים
  choice: de génération en génération
  rationale: Formule française naturelle qui préserve la succession continue des générations.
theological_decisions:
- issue: Portée de צִדְקָה dans le contexte prophétique
  choice: justice
  alternative: droiture
  rationale: Le français « justice » conserve la dimension morale, relationnelle et judiciaire du terme hébreu, en lien étroit avec le salut de Dieu. La note maintient explicitement l’autre nuance possible, « droiture », sans réduire le terme à un seul sens.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme poétique est maintenu, avec un vocabulaire concret et accessible. Le point-virgule souligne le contraste entre la disparition des êtres humains visés et la permanence de la justice et du salut de Dieu.
