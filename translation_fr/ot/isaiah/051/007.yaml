base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/007.yaml
  text: 'Listen to me[a], you who know righteousness, people with my law in their hearts: do not fear the reproach of man[d][c][b], and do not be dismayed by their insults.'
translation:
  language: fr
  text: 'Écoutez-moi, vous qui connaissez la justice, peuple qui a ma loi dans son cœur : ne craignez pas l’outrage d’un mortel[a], et ne soyez pas consternés par leurs insultes[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’outrage d’un être humain ». Le terme hébreu est au singulier et peut souligner la fragilité mortelle de l’être humain.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne soyez pas brisés » ou « ne vous laissez pas abattre ». Le verbe hébreu peut évoquer la consternation, l’abattement ou l’effondrement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Écoutez-moi
  rationale: L’impératif pluriel suivi de אֵלַי appelle à une écoute attentive et dirigée; « Écoutez-moi » est naturel et direct en français moderne.
- source_word: יֹדְעֵי צֶדֶק
  choice: vous qui connaissez la justice
  rationale: צֶדֶק désigne ici ce qui est juste et conforme à la volonté de Dieu. « Justice » conserve en français la dimension morale et sociale du terme sans la réduire à la seule rectitude personnelle.
- source_word: עַם תּוֹרָתִי בְלִבָּם
  choice: peuple qui porte mon enseignement dans son cœur
  rationale: תּוֹרָה peut signifier « loi » ou « enseignement ». « Enseignement » rend son ampleur directive sans imposer un sens exclusivement juridique. Le singulier collectif עַם et le singulier conceptuel français « son cœur » sont conservés.
- source_word: אַל תִּירְאוּ חֶרְפַּת אֱנוֹשׁ
  choice: ne craignez pas les outrages des humains
  rationale: חֶרְפָּה évoque l’opprobre, les injures ou les outrages. אֱנוֹשׁ désigne l’être humain, avec une possible nuance de fragilité mortelle; le pluriel générique « des humains » est idiomatique et correspond à la reprise plurielle « leurs ».
- source_word: וּמִגִּדֻּפֹתָם
  choice: par leurs insultes
  rationale: גִּדּוּפוֹת désigne des paroles injurieuses ou outrageantes. « Insultes » est clair et actuel, sans introduire le sens plus spécialisé de « blasphèmes ».
- source_word: אַל תֵּחָתּוּ
  choice: ne soyez pas accablés
  rationale: Le niphal de חתת peut exprimer l’effondrement intérieur, la consternation ou l’abattement. « Ne soyez pas accablés » reste naturel tout en conservant une force supérieure à « ne soyez pas troublés ».
theological_decisions:
- issue: Sens de צֶדֶק
  choice: justice
  alternative: droiture
  rationale: Les deux valeurs sont possibles. « Justice » est courant, digne et assez large pour inclure la conformité morale à Dieu ainsi que l’ordre juste, sans trancher artificiellement entre ces dimensions.
- issue: Sens de תּוֹרָה
  choice: enseignement
  alternative: loi
  rationale: Dans ce contexte, la parole divine est intériorisée. « Enseignement » préserve la portée formative de תּוֹרָה; « loi » demeure possible mais pourrait paraître plus étroitement juridique au lecteur moderne.
- issue: Force de חתת
  choice: être accablés
  alternative: être brisés / être consternés
  rationale: Le verbe peut décrire l’effondrement, l’abattement ou la terreur. Le choix retenu conserve l’idée d’une atteinte intérieure causée par les insultes, sans transformer explicitement l’image en brisure physique.
- issue: Portée de אֱנוֹשׁ
  choice: les humains
  alternative: le mortel / l’être humain
  rationale: Le terme singulier est générique et peut souligner la fragilité humaine. Le français collectif « les humains » s’accorde naturellement avec le possessif pluriel du membre parallèle, tandis que la nuance de mortalité est signalée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le rythme de l’appel prophétique est maintenu, avec un vocabulaire accessible. « Peuple qui porte mon enseignement dans son cœur » explicite naturellement l’intériorisation sans ajouter de contenu théologique étranger au texte.
