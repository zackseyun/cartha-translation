source:
  edition: WLC
  text: וּ/פְדוּיֵ֨י יְהוָ֜ה יְשׁוּב֗וּ/ן וּ/בָ֤אוּ צִיּוֹן֙ בְּ/רִנָּ֔ה וְ/שִׂמְחַ֥ת עוֹלָ֖ם עַל רֹאשָׁ֑/ם שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יַשִּׂיג֔וּ/ן נָ֖סוּ יָג֥וֹן וַ/אֲנָחָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/011.yaml
  text: And the redeemed of Yahweh will return and come to Zion with singing[a]; everlasting joy will be upon their heads; gladness and joy will overtake them[b]; sorrow and sighing will flee away.
translation:
  language: fr
  text: Les rachetés de Yahweh reviendront ; ils arriveront à Sion avec des cris de joie[a]. Une joie éternelle couronnera leur tête ; l’allégresse et la joie les rattraperont[b], tandis que le chagrin et le gémissement s’enfuiront.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en chantant » ; le terme hébreu peut désigner aussi bien des cris de jubilation que le chant.
    reason: lexical_alternative
  - marker: b
    text: Ou « les atteindront » ; le verbe hébreu signifie littéralement « rejoindre, rattraper », présentant ici l’allégresse et la joie comme si elles poursuivaient les rachetés.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְדוּיֵי
  choice: les rachetés
  rationale: Le participe passif de פדה désigne ceux qui ont été rachetés ou délivrés moyennant rançon. « Les rachetés » est naturel en français et conserve la portée de délivrance.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Le tétragramme est rendu par la translittération du nom divin plutôt que par un titre de substitution.
- source_word: יְשׁוּבוּן וּבָאוּ
  choice: reviendront ; ils arriveront
  rationale: 'Les deux verbes sont conservés : שוב exprime le retour et בוא l’arrivée à destination. Le point-virgule évite une coordination française maladroite sans effacer la progression hébraïque.'
- source_word: צִיּוֹן
  choice: Sion
  rationale: La forme française traditionnelle du nom propre préserve sa résonance géographique et poétique.
- source_word: בְּרִנָּה
  choice: avec des cris de joie
  rationale: רִנָּה peut évoquer des cris retentissants de jubilation aussi bien que le chant. Cette formulation conserve cette vigueur sans exclure une expression chantée.
- source_word: שִׂמְחַת עוֹלָם
  choice: une joie éternelle
  rationale: La construction signifie une joie qui dure indéfiniment. « Éternelle » est concise, naturelle et digne.
- source_word: עַל רֹאשָׁם
  choice: couronnera leur tête
  rationale: Cette formulation française rend naturellement l’image de la joie placée sur la tête comme une couronne, tout en gardant le singulier collectif de l’hébreu.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: l’allégresse et la joie
  rationale: Deux termes distincts maintiennent le parallélisme de ces quasi-synonymes sans les confondre.
- source_word: יַשִּׂיגוּן
  choice: les rattraperont
  rationale: Le hiphil de נשׂג évoque ce qui rejoint ou rattrape quelqu’un. Le choix préserve la personnification dynamique de la joie.
- source_word: יָגוֹן וַאֲנָחָה
  choice: le chagrin et les gémissements
  rationale: « Chagrin » rend la douleur affligée de יגון ; le pluriel « gémissements » est idiomatique en français pour אנחה et conserve son caractère audible.
- source_word: נָסוּ
  choice: s’enfuiront
  rationale: Bien que la forme soit un qatal, le contexte prophétique et le parallélisme avec les actions futures justifient une traduction au futur, tout en préservant l’image de la fuite.
theological_decisions:
- issue: Rendu du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur ; Jéhovah
  rationale: Le texte porte explicitement le nom divin. La translittération « Yahweh » le distingue d’un titre et suit directement la donnée hébraïque.
- issue: Valeur temporelle de נָסוּ dans la poésie prophétique
  choice: 'futur : « s’enfuiront »'
  alternative: 'accompli : « se sont enfuis » ; présent : « s’enfuient »'
  rationale: Le qatal présente vivement le résultat certain, mais la scène annoncée est celle du retour futur des rachetés. Le futur français rend clairement cette cohérence temporelle sans nier l’aspect d’accomplissement assuré.
- issue: Image de עַל רֹאשָׁם
  choice: « couronnera leur tête »
  alternative: « sera sur leur tête »
  rationale: Le verbe « couronner » explicite légèrement l’image poétique naturelle en français sans lui donner une portée doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, poétique et digne. La syntaxe reste accessible, conserve les images principales de l’hébreu et évite les archaïsmes. Les deux marqueurs de note [a] et [b] figurent dans le texte.
