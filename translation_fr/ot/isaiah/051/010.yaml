id: ISA.51.10
reference: Isaiah 51:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: הֲ/ל֤וֹא אַתְּ הִיא֙ הַ/מַּחֲרֶ֣בֶת יָ֔ם מֵ֖י תְּה֣וֹם רַבָּ֑ה הַ/שָּׂ֨מָה֙ מַֽעֲמַקֵּי יָ֔ם דֶּ֖רֶךְ לַ/עֲבֹ֥ר גְּאוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/010.yaml
  text: Was it not you who dried up the sea[a], the waters of the great deep[b], who made the depths of the sea a way for the redeemed to cross over?
translation:
  language: fr
  text: N’est-ce pas toi qui as asséché la mer, les eaux du grand abîme[a], qui as fait des profondeurs de la mer un chemin pour que les rachetés[b] puissent passer ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’immense abîme ».'
    reason: Alternative lexicale pour רַבָּה, qui peut exprimer la grandeur ou l’immensité.
  - marker: b
    text: 'Ou : « les délivrés par rachat ».'
    reason: Cette formulation explicite la valeur du participe passif issu de גאל, au prix d’une expression moins concise.
lexical_decisions:
- source_word: הֲלוֹא אַתְּ הִיא
  choice: N’est-ce pas toi
  rationale: La tournure rend la question rhétorique qui appelle une réponse affirmative et conserve l’insistance portée par le pronom hébreu.
- source_word: הַמַּחֲרֶבֶת
  choice: qui as asséché
  rationale: Le participe causatif décrit l’action de rendre la mer sèche; « assécher » est naturel en français et convient à l’allusion à la traversée de la mer.
- source_word: יָם
  choice: la mer
  rationale: La traduction directe préserve l’allusion à l’Exode sans préciser dans le texte un nom géographique absent de l’hébreu.
- source_word: מֵי תְהוֹם רַבָּה
  choice: les eaux du grand abîme
  rationale: Cette formulation conserve à la fois l’image des eaux profondes et la portée solennelle, voire cosmique, de תְהוֹם.
- source_word: מַעֲמַקֵּי יָם
  choice: les profondeurs de la mer
  rationale: Rend naturellement le pluriel hébreu désignant les parties profondes de la mer.
- source_word: דֶּרֶךְ לַעֲבֹר
  choice: un chemin pour que … puissent passer
  rationale: Exprime clairement la fonction du chemin indiquée par l’infinitif hébreu, sans imposer si le mouvement est « à travers » ou « de l’autre côté ».
- source_word: גְּאוּלִים
  choice: les rachetés
  rationale: Le participe passif de גאל désigne ceux qui ont été délivrés par un acte de rachat; « les rachetés » conserve ce motif important chez Ésaïe.
theological_decisions:
- issue: Allusion à l’Exode et portée de l’image de la rédemption
  choice: Conserver l’image historique de la traversée en parlant simplement de « la mer » et des « rachetés ».
  alternative: Identifier explicitement la mer Rouge, ou généraliser le passage en une image purement métaphorique de délivrance.
  rationale: L’hébreu évoque clairement l’Exode sans nommer la mer Rouge. Une traduction non explicitée préserve à la fois l’allusion historique et la portée plus large de la rédemption dans le contexte d’Ésaïe.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve le parallélisme poétique et la question rhétorique de l’hébreu. Le tutoiement convient à l’adresse directe au « bras de l’Éternel » dans le contexte immédiat.
