source:
  edition: WLC
  text: הַקְשִׁ֤יבוּ אֵלַ/י֙ עַמִּ֔/י וּ/לְאוּמִּ֖/י אֵלַ֣/י הַאֲזִ֑ינוּ כִּ֤י תוֹרָה֙ מֵ/אִתִּ֣/י תֵצֵ֔א וּ/מִשְׁפָּטִ֔/י לְ/א֥וֹר עַמִּ֖ים אַרְגִּֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/004.yaml
  text: Pay attention to me[a], my people, and give ear to me, my nation; for instruction will go out from me[c][b], and I will set my justice as a light for the peoples.
translation:
  language: fr
  text: Soyez attentifs à moi, mon peuple, et prêtez-moi l’oreille, ma nation ! Car un enseignement[a] sortira de moi, et j’établirai[c] ma justice[b] comme une lumière pour les peuples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une loi » ou « une instruction » (hébreu תּוֹרָה).
    reason: lexical_alternative
  - marker: b
    text: Ou « mon jugement » (hébreu מִשְׁפָּטִי).
    reason: lexical_alternative
  - marker: c
    text: Le dernier verbe peut aussi être compris au sens de « je ferai reposer » ou « je déposerai » ; le sens précis de l’hébreu est incertain ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: Sois attentif
  rationale: L’impératif appelle à une écoute attentive. Le singulier français s’accorde naturellement avec l’apostrophe collective « mon peuple », tout en conservant la force de l’appel.
- source_word: עַמִּי
  choice: mon peuple
  rationale: Rend directement l’appellation collective et son lien d’appartenance.
- source_word: וּלְאוּמִּי
  choice: ma nation
  rationale: Préserve le parallélisme avec « mon peuple » ainsi qu’une certaine distinction lexicale entre עַם et לְאֹם.
- source_word: הַאֲזִינוּ
  choice: prête-moi l’oreille
  rationale: Expression poétique française claire qui distingue ce second appel à écouter du premier impératif.
- source_word: תּוֹרָה
  choice: enseignement
  rationale: Dans ce contexte, תּוֹרָה désigne largement une instruction faisant autorité, sans se limiter nécessairement à une législation.
- source_word: תֵצֵא
  choice: sortira
  rationale: 'Conserve simplement le mouvement exprimé par יצא : l’enseignement vient de Dieu et se porte au-dehors.'
- source_word: וּמִשְׁפָּטִי
  choice: ma justice
  rationale: מִשְׁפָּט peut désigner le jugement, la décision judiciaire ou la justice. Ici, « justice » s’accorde bien avec l’image positive d’une lumière destinée aux peuples.
- source_word: לְאוֹר עַמִּים
  choice: comme une lumière pour les peuples
  rationale: Formulation française naturelle qui préserve l’image et la portée internationale du pluriel עַמִּים.
- source_word: אַרְגִּיעַ
  choice: j’établirai
  rationale: Le hiphil de רגע est difficile ici. « Établir » exprime de façon cohérente l’idée de faire prendre place ou de fixer la justice, sans masquer les autres analyses possibles, signalées en note.
- source_word: עַמִּים
  choice: les peuples
  rationale: Le pluriel renvoie aux peuples au sens international et maintient le lien lexical avec « mon peuple ».
theological_decisions:
- issue: Portée de תּוֹרָה et de מִשְׁפָּט à l’égard des peuples
  choice: Le verset annonce que l’enseignement faisant autorité et la justice de Dieu se porteront vers les peuples.
  alternative: Le verset viserait plus étroitement la Loi mosaïque et un jugement destiné au seul Israël.
  rationale: La mention explicite des « peuples » et l’image de la lumière indiquent une portée internationale. La traduction ne précise pas davantage la forme que prend cet accomplissement.
- issue: Sens de מִשְׁפָּטִי
  choice: ma justice
  alternative: mon jugement
  rationale: « Justice » fait ressortir ici l’ordre juste de Dieu manifesté comme lumière, tandis que la note conserve le sens judiciaire également possible.
- issue: Interprétation de אַרְגִּיעַ
  choice: j’établirai
  alternative: je ferai reposer / je déposerai
  rationale: Le verbe est lexicalement difficile. Le texte principal privilégie une formulation intelligible dans le contexte, tandis que la note maintient l’ambiguïté réelle de l’hébreu.
translation_notes:
  register: Français international moderne, digne et poétique sans archaïsme excessif. Les impératifs sont au singulier pour s’accorder naturellement avec les vocatifs collectifs « mon peuple » et « ma nation ». L’exclamation rend la vigueur de la double sommation hébraïque.
