  text: שְׂאוּ֩ לַ/שָּׁמַ֨יִם עֵֽינֵי/כֶ֜ם וְֽ/הַבִּ֧יטוּ אֶל הָ/אָ֣רֶץ מִ/תַּ֗חַת כִּֽי שָׁמַ֜יִם כֶּ/עָשָׁ֤ן נִמְלָ֨חוּ֙ וְ/הָ/אָ֨רֶץ֙ כַּ/בֶּ֣גֶד תִּבְלֶ֔ה וְ/יֹשְׁבֶ֖י/הָ כְּמוֹ כֵ֣ן יְמוּת֑וּ/ן וִ/ישֽׁוּעָתִ/י֙ לְ/עוֹלָ֣ם תִּֽהְיֶ֔ה וְ/צִדְקָתִ֖/י לֹ֥א תֵחָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/006.yaml
  text: Lift up your eyes to the heavens[a], and look at the earth beneath; for the heavens will vanish like smoke, and the earth will wear out like a garment, and its inhabitants will die likewise. But my salvation will be forever[b], and my righteousness will not be shattered.
translation:
  language: fr
  text: 'Levez les yeux vers les cieux et regardez vers la terre, en bas : car les cieux se dissiperont comme de la fumée[a], la terre s’usera comme un vêtement, et ses habitants mourront de même. Mais mon salut durera toujours, et ma justice[b] ne sera pas brisée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe hébreu est difficile. Autres sens proposés : « disparaîtront » ou « s’useront ». L’image indique que les cieux passeront.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ma droiture ». Le mot hébreu peut évoquer à la fois la justice, la droiture et la fidélité de Dieu à ce qui est juste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ ... עֵינֵיכֶם
  choice: Levez les yeux
  rationale: Expression française naturelle qui conserve l’impératif pluriel et l’image concrète de l’hébreu.
- source_word: לַשָּׁמַיִם
  choice: vers le ciel
  rationale: En français courant, le singulier « ciel » désigne naturellement l’étendue céleste tout en maintenant l’opposition cosmique avec la terre.
- source_word: אֶל הָאָרֶץ מִתַּחַת
  choice: la terre en bas
  rationale: « Terre » convient au parallèle cosmique avec le ciel ; « en bas » rend explicitement מִתַּחַת.
- source_word: נִמְלָחוּ
  choice: se dissipera
  rationale: Le verbe hébreu est difficile. Dans le contexte et avec la comparaison à la fumée, « se dissipera » exprime la disparition sans imposer une étymologie incertaine.
- source_word: תִּבְלֶה כַּבֶּגֶד
  choice: s’usera comme un vêtement
  rationale: Conserve directement l’image d’un vêtement qui s’use.
- source_word: כְּמוֹ כֵן יְמוּתוּן
  choice: mourront de même
  rationale: Rend la correspondance indiquée par כְּמוֹ כֵן de façon concise et naturelle.
- source_word: וִישׁוּעָתִי לְעוֹלָם תִּהְיֶה
  choice: mon salut durera toujours
  rationale: Formulation française idiomatique exprimant la permanence du salut annoncée par le texte.
- source_word: וְצִדְקָתִי
  choice: ma justice
  rationale: « Justice » est naturel en français biblique moderne et couvre ici l’action droite, fidèle et salvatrice de Dieu, tout en signalant l’autre possibilité en note.
- source_word: לֹא תֵחָת
  choice: ne sera pas anéantie
  rationale: Le verbe exprime ici la ruine ou l’effondrement ; « anéantie » maintient le contraste avec la permanence du salut.
theological_decisions:
- issue: Sens de צִדְקָתִי
  choice: ma justice
  alternative: ma fidélité à ce qui est juste ; ma droiture
  rationale: Le nom hébreu peut désigner la justice, la droiture et, dans ce contexte, l’action fidèle et salvatrice de Dieu. Le texte principal garde le terme français large « justice », tandis que la note préserve l’étendue sémantique.
- issue: Relation entre salut et justice
  choice: Deux termes parallèles distincts sont conservés
  alternative: Fondre les deux notions en une seule idée de délivrance
  rationale: Le parallélisme les rapproche sans les identifier entièrement ; la traduction conserve donc la tension et la richesse du texte.
translation_notes:
  register: Français moderne, international et digne, avec une syntaxe prophétique claire. « Ciel » et « terre » forment un couple cosmique naturel en français. Les répétitions et les comparaisons concrètes de l’hébreu sont conservées sans archaïsme.
