  text: אֵין מְנַהֵ֣ל לָ֔/הּ מִ/כָּל בָּנִ֖ים יָלָ֑דָה וְ/אֵ֤ין מַחֲזִיק֙ בְּ/יָדָ֔/הּ מִ/כָּל בָּנִ֖ים גִּדֵּֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/018.yaml
  text: There is no one to guide her among all the sons she has borne[a], and no one to take her by the hand among all the sons she has raised.
translation:
  language: fr
  text: Il n’y a personne pour la guider parmi tous les fils qu’elle a enfantés[a], et personne pour la prendre par la main parmi tous les fils qu’elle a élevés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’entre tous les enfants qu’elle a mis au monde… d’entre tous les enfants qu’elle a élevés ». L’hébreu dit précisément « fils ».
    reason: Alternative lexicale et de construction ; précision que le terme hébreu est masculin (« fils »).
lexical_decisions:
- source_word: מְנַהֵל
  choice: pour la guider
  rationale: Le participe de נהל exprime l’action de conduire ou guider, avec ici une nuance d’accompagnement appropriée à Jérusalem personnifiée en femme délaissée.
- source_word: לָהּ
  choice: la
  rationale: Le suffixe féminin singulier renvoie à Sion/Jérusalem, personnifiée au féminin dans le contexte.
- source_word: מִכָּל בָּנִים
  choice: parmi tous les fils
  rationale: 'מן avec כל désigne ici un individu issu d’un ensemble : aucun parmi tous ses fils. « Fils » conserve le masculin explicite de בנים.'
- source_word: יָלָדָה
  choice: qu’elle a enfantés
  rationale: Le verbe évoque directement la maternité de la ville personnifiée. « Enfanter » préserve cette image et le participe passé s’accorde avec le complément antéposé « qu’ » renvoyant aux fils.
- source_word: מַחֲזִיק בְּיָדָהּ
  choice: pour la prendre par la main
  rationale: Cette formulation française naturelle conserve l’image concrète du soutien et de l’accompagnement exprimée par l’action de saisir ou tenir sa main.
- source_word: גִּדֵּלָה
  choice: qu’elle a élevés
  rationale: Le piel de גדל signifie ici faire grandir, élever des enfants. « Élever » est courant en français moderne et répond bien à « enfanter » dans le premier membre.
- source_word: אֵין ... וְאֵין
  choice: Il n’y a personne ... personne
  rationale: La reprise de « personne » maintient l’insistance de la double négation hébraïque sans alourdir la phrase française par une seconde tournure existentielle complète.
theological_decisions:
- issue: Rendu genré de בָּנִים
  choice: fils
  alternative: enfants
  rationale: L’hébreu emploie explicitement le masculin pluriel « fils » dans la métaphore maternelle concernant Jérusalem. Le texte principal conserve cette précision, tandis que la note signale le rendu collectif possible en français.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme et l’image maternelle sont préservés; la répétition de « personne » souligne l’abandon total de Jérusalem.
