  text: קָר֤וֹב צִדְקִ/י֙ יָצָ֣א יִשְׁעִ֔/י וּ/זְרֹעַ֖/י עַמִּ֣ים יִשְׁפֹּ֑טוּ אֵלַ/י֙ אִיִּ֣ים יְקַוּ֔וּ וְ/אֶל זְרֹעִ֖/י יְיַחֵלֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/005.yaml
  text: My righteousness is near[a], my salvation has gone out, and my arms will judge the peoples; the coastlands will wait for me[c][b], and for my arm they will hope.
translation:
  language: fr
  text: Ma justice est proche[a], mon salut s’est avancé ; mes bras[b] jugeront les peuples. Les terres côtières[c] m’attendront et mettront leur espérance en mon bras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot hébreu peut exprimer la justice, la droiture ou la réhabilitation.
    reason: lexical_alternative
  - marker: b
    text: L’hébreu porte ici « mes bras », au pluriel, mais emploie « mon bras », au singulier, à la fin du verset. Cette image désigne la puissance de Dieu en action.
    reason: lexical_alternative
  - marker: c
    text: Ou « les îles » ou « les rivages lointains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרוֹב צִדְקִי
  choice: Ma justice est proche
  rationale: Le français « justice » conserve ici la portée morale, judiciaire et salvatrice de צֶדֶק, tandis que « est proche » respecte la valeur stative de קָרוֹב.
- source_word: יָצָא יִשְׁעִי
  choice: mon salut est en marche
  rationale: יָצָא décrit littéralement ce qui est sorti ou s’est avancé. « Est en marche » rend naturellement en français l’action désormais engagée, sans réduire יֵשַׁע à une simple victoire.
- source_word: וּזְרֹעַי
  choice: mes bras
  rationale: La forme hébraïque est plurielle. L’image corporelle est maintenue pour représenter la puissance active de Dieu.
- source_word: עַמִּים יִשְׁפֹּטוּ
  choice: jugeront les peuples
  rationale: « Juger » garde le sens judiciaire fondamental de שׁפט, et « les peuples » conserve la pluralité des groupes humains.
- source_word: אִיִּים
  choice: les terres côtières
  rationale: Dans Ésaïe, אִיִּים peut désigner des îles, des rivages ou, plus largement, des régions maritimes éloignées. « Terres côtières » évite de restreindre indûment le terme aux seules îles.
- source_word: אֵלַי יְקַוּוּ
  choice: m’attendront
  rationale: Le verbe קוה exprime une attente confiante. La construction française directe est naturelle et conserve l’idée d’attente orientée vers Dieu.
- source_word: וְאֶל זְרֹעִי יְיַחֵלוּן
  choice: mettront leur espérance en mon bras
  rationale: Cette formulation rend l’attente pleine d’espoir exprimée par יחל et maintient le singulier « mon bras » du second emploi.
theological_decisions:
- issue: Portée de צִדְקִי dans une annonce de salut
  choice: ma justice
  alternative: mon action juste ; ma délivrance légitime ; ma réhabilitation
  rationale: « Justice » permet de garder ensemble la rectitude de Dieu, son jugement et son intervention salvatrice, sans réduire le mot à une seule de ces dimensions.
- issue: Métaphore anthropomorphique du bras de Dieu
  choice: maintenir « mes bras » puis « mon bras »
  alternative: ma puissance ; mon pouvoir
  rationale: Le texte passe réellement du pluriel au singulier. Conserver cette variation et l’image du bras respecte la texture poétique et ne remplace pas prématurément la métaphore par son interprétation.
- issue: Valeur de l’action accomplie יָצָא
  choice: est en marche
  alternative: est sorti ; s’est manifesté ; va paraître
  rationale: La traduction retenue présente le salut comme déjà mis en mouvement et actuellement opérant, sans transformer explicitement l’accompli hébreu en simple futur.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme est conservé, ainsi que le passage intentionnel de « mes bras » à « mon bras ». Le point-virgule marque les deux mouvements du verset sans alourdir sa cadence.
