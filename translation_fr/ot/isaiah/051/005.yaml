  naturalness: Le français est globalement clair, digne et actuel. « Mon salut s’est avancé » est une formulation littéraire mais naturelle dans ce contexte prophétique et plus exacte que « est en marche ».
  terminology: « Justice » est un choix défendable pour צִדְקִי dans ce contexte judiciaire et salvateur; la note conserve utilement les autres nuances. « Bras »/« mon bras » respecte exactement l’alternance pluriel-singulier du texte hébreu. « Terres côtières » rend bien אִיִּים.
