source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר אֲדֹנַ֣יִ/ךְ יְהוָ֗ה וֵ/אלֹהַ֨יִ/ךְ֙ יָרִ֣יב עַמּ֔/וֹ הִנֵּ֥ה לָקַ֛חְתִּי מִ/יָּדֵ֖/ךְ אֶת כּ֣וֹס הַ/תַּרְעֵלָ֑ה אֶת קֻבַּ֨עַת֙ כּ֣וֹס חֲמָתִ֔/י לֹא תוֹסִ֥יפִי לִ/שְׁתּוֹתָ֖/הּ עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/022.yaml
  text: 'Thus says your Lord[a], Yahweh, and your God, who pleads the cause of his people: Behold, I have taken from your hand the cup of staggering, the bowl of the cup of my wrath[b]; you shall never again drink it.'
translation:
  language: fr
  text: 'Ainsi parle ton Seigneur, Yahweh, ton Dieu, qui défend la cause de son peuple : « Voici, j’ai retiré de ta main la coupe qui fait chanceler[a], la vasque de la coupe de ma fureur[b] ; tu n’en boiras plus jamais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la coupe du vertige » ou « la coupe qui fait vaciller ». Le terme hébreu évoque l’effet étourdissant du jugement.
    reason: lexical_alternative
  - marker: b
    text: Ou « le bol » ou « le gobelet de la coupe de ma fureur ». L’hébreu accumule les images de récipients pour renforcer l’expression.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנַיִךְ
  choice: ton Seigneur
  rationale: Le titre avec suffixe féminin singulier exprime l’autorité souveraine de Dieu sur Sion ; « Seigneur » est naturel et digne en français biblique moderne.
- source_word: יְהוָה
  choice: Yahweh
  rationale: La translittération conserve le nom divin personnel plutôt que de le remplacer par un titre.
- source_word: וֵאלֹהַיִךְ
  choice: ton Dieu
  rationale: 'L’expression est prise en apposition avec les désignations précédentes. La conjonction hébraïque peut être rendue sans « et » afin d’obtenir en français une accumulation naturelle : « ton Seigneur, Yahweh, ton Dieu ».'
- source_word: יָרִיב עַמּוֹ
  choice: qui défend la cause de son peuple
  rationale: 'ריב possède ici une nuance judiciaire : Yahweh prend en charge la cause de son peuple. Cette formulation conserve cette dimension tout en restant idiomatique.'
- source_word: הִנֵּה
  choice: Voici
  rationale: « Voici » garde la force solennelle et déictique de l’annonce prophétique sans archaïsme excessif.
- source_word: לָקַחְתִּי מִיָּדֵךְ
  choice: je retire de ta main
  rationale: Le parfait présente l’acte comme accompli ou assuré. Le présent français convient à une déclaration performative et exprime clairement le retrait de la coupe.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: la coupe qui fait chanceler
  rationale: תַּרְעֵלָה désigne l’étourdissement ou le vacillement produit par le jugement ; la proposition relative rend cet effet clairement en français.
- source_word: קֻבַּעַת
  choice: le calice
  rationale: Le terme désigne un récipient à boire de forme arrondie. « Calice » permet de maintenir la seconde image de récipient et la solennité du passage, sans réduire l’expression à une répétition maladroite.
- source_word: כּוֹס חֲמָתִי
  choice: la coupe de ma fureur
  rationale: חֵמָה évoque une colère intense. « Fureur » conserve la force du terme dans ce contexte de jugement divin.
- source_word: לֹא תוֹסִיפִי לִשְׁתּוֹתָהּ עוֹד
  choice: tu n’en boiras plus jamais
  rationale: La combinaison de יסף, de l’infinitif et de עוֹד marque la cessation définitive ; cette formulation française en restitue l’insistance.
theological_decisions:
- issue: Succession des désignations divines
  choice: ton Seigneur, Yahweh, ton Dieu
  alternative: le Seigneur, Yahweh ton Dieu
  rationale: La formulation retenue préserve les trois désignations apposées et le suffixe « ton », sans confondre le titre אֲדֹנָי avec le nom divin יהוה.
- issue: Métaphore de la coupe du jugement
  choice: Conserver littéralement les images de la coupe et du calice
  alternative: Expliciter comme la souffrance ou le châtiment
  rationale: La métaphore appartient au texte et à un réseau biblique plus large. L’expliciter dans le corps du verset réduirait sa richesse et résoudrait indûment l’image.
- issue: Portée de la promesse finale
  choice: tu n’en boiras plus jamais
  alternative: tu n’en boiras plus
  rationale: L’hébreu accumule les marques de non-répétition. « Plus jamais » en conserve l’emphase, sans déterminer au-delà du contexte la portée historique ou eschatologique de la promesse.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le tutoiement féminin singulier du texte hébreu s’adresse à Sion/Jérusalem personnifiée. La ponctuation présente les paroles divines comme une citation directe.
