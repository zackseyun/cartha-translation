  text: שְׁתַּ֤יִם הֵ֨נָּה֙ קֹֽרְאֹתַ֔יִ/ךְ מִ֖י יָנ֣וּד לָ֑/ךְ הַ/שֹּׁ֧ד וְ/הַ/שֶּׁ֛בֶר וְ/הָ/רָעָ֥ב וְ/הַ/חֶ֖רֶב מִ֥י אֲנַחֲמֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/019.yaml
  text: These two things have come upon you—who will mourn for you?—devastation and destruction[a], famine and sword[b]; who will comfort you?
translation:
  language: fr
  text: 'Ces deux malheurs t’ont frappée : qui te plaindra[a] ? La dévastation et la ruine, la famine et l’épée[b]. Qui te consolera ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui se lamentera sur toi ? » Le verbe hébreu peut exprimer la lamentation ou la compassion.
    reason: lexical_alternative
  - marker: b
    text: 'L’hébreu annonce « deux » malheurs, puis nomme quatre calamités, probablement regroupées en deux paires : « la dévastation et la ruine », puis « la famine et l’épée ».'
    reason: textual_clarification
lexical_decisions:
- source_word: שְׁתַּיִם הֵנָּה
  choice: Ces deux malheurs
  rationale: La traduction conserve le nombre explicite « deux » et la valeur démonstrative de הֵנָּה. « Malheurs » explicite naturellement en français la nature des « choses » annoncées par le contexte.
- source_word: קֹרְאֹתַיִךְ
  choice: t’ont frappée
  rationale: Dans cet emploi avec des calamités pour sujet, קרא signifie qu’elles surviennent à quelqu’un ou l’atteignent. « T’ont frappée » est idiomatique et rend leur caractère désastreux; le féminin renvoie à Sion/Jérusalem personnifiée.
- source_word: מִי יָנוּד לָךְ
  choice: qui te plaindra ?
  rationale: נוּד peut exprimer la lamentation ou la compassion envers une personne éprouvée. « Te plaindra » garde ces deux nuances dans un français actuel et naturel.
- source_word: הַשֹּׁד
  choice: la dévastation
  rationale: שֹׁד désigne les ravages ou la dévastation causés par une action violente.
- source_word: הַשֶּׁבֶר
  choice: la ruine
  rationale: שֶׁבֶר évoque littéralement une fracture ou un effondrement et, dans ce contexte prophétique, la ruine qui en résulte.
- source_word: הָרָעָב
  choice: la famine
  rationale: Équivalent français courant et précis de רָעָב dans un contexte de jugement et de catastrophe.
- source_word: הַחֶרֶב
  choice: l’épée
  rationale: Traduction directe de חֶרֶב; dans cette liste, l’épée représente aussi la guerre et la mort violente sans que cette portée figurative doive être explicitée dans le texte.
- source_word: מִי אֲנַחֲמֵךְ
  choice: Qui te consolera ?
  rationale: Le piel de נחם signifie consoler. Ce choix naturel préserve en outre le motif important de la consolation dans Ésaïe.
theological_decisions:
- issue: L’annonce de « deux » malheurs suivie de quatre termes de calamité
  choice: 'Conserver le nombre « deux » et présenter les quatre termes sans modifier le texte, comme deux paires probables : « la dévastation et la ruine », puis « la famine et l’épée ».'
  alternative: Émender le nombre, parler de quatre malheurs ou remplacer « deux » par une formulation vague telle que « un double malheur ».
  rationale: L’hébreu porte explicitement « deux », tandis que sa structure permet de comprendre les quatre noms comme deux ensembles parallèles. La traduction préserve donc la tension du texte au lieu de la corriger silencieusement.
translation_notes:
  register: Français international moderne, digne et direct. La ponctuation met en relief les deux questions rhétoriques. Le féminin de « frappée » correspond à Sion/Jérusalem personnifiée dans le contexte.
