revisions:
- from: Réveille-toi, réveille-toi ! Lève-toi, Jérusalem, toi qui as bu de la main de Yahweh[a] la coupe de sa fureur ! Tu as bu le bol[b], la coupe qui fait tituber[c] ; tu l’as entièrement vidée.
  to: Réveille-toi, réveille-toi ! Lève-toi, Jérusalem, toi qui as bu de la main de Yahweh[a] la coupe de sa fureur ! Tu as bu le bol de la coupe du vertige[c][b] ; tu l’as vidée jusqu’à la dernière goutte.
  rationale: La révision élimine une ambiguïté non voulue en français tout en conservant la succession des deux noms de récipient et la métaphore du vertige. Elle améliore également la note lexicale relative au premier récipient.
