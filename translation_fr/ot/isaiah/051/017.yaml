  variant: modern international French
source:
  edition: WLC
  text: הִתְעוֹרְרִ֣י הִֽתְעוֹרְרִ֗י ק֚וּמִי יְר֣וּשָׁלִַ֔ם אֲשֶׁ֥ר שָׁתִ֛ית מִ/יַּ֥ד יְהוָ֖ה אֶת כּ֣וֹס חֲמָת֑/וֹ אֶת קֻבַּ֜עַת כּ֧וֹס הַ/תַּרְעֵלָ֛ה שָׁתִ֖ית מָצִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/017.yaml
  text: Awake[a], awake, rise up, Jerusalem, you who have drunk from the hand of Yahweh the cup of his wrath; you have drunk the bowl, the cup of staggering[c][b]; you have drained it dry.
translation:
  language: fr
  text: Réveille-toi, réveille-toi ! Lève-toi, Jérusalem, toi qui as bu de la main de Yahweh[a] la coupe de sa fureur ! Tu as bu le bol de la coupe du vertige[c][b] ; tu l’as vidée jusqu’à la dernière goutte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « de la main de Yahweh » indique que l’épreuve subie par Jérusalem venait de son action judiciaire.
    reason: cultural_note
  - marker: b
    text: Ou « le gobelet » ou « la grande coupe ». Le mot hébreu désigne un récipient à boire en forme de bol.
    reason: lexical_alternative
  - marker: c
    text: Ou « la coupe qui fait tituber ». Le terme hébreu évoque l’effet d’une boisson qui fait chanceler.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוֹרְרִי הִתְעוֹרְרִי
  choice: Réveille-toi, réveille-toi
  rationale: L’impératif réfléchi féminin singulier est rendu par une tournure française naturelle qui conserve à la fois la valeur réfléchie et la répétition insistante.
- source_word: קוּמִי
  choice: Lève-toi
  rationale: Cet impératif prolonge naturellement l’appel au réveil et garde le mouvement poétique du texte.
- source_word: מִיַּד יְהוָה
  choice: de la main de Yahweh
  rationale: La formulation conserve l’image hébraïque de la main comme source et agent de l’action.
- source_word: כּוֹס חֲמָתוֹ
  choice: la coupe de sa fureur
  rationale: « Fureur » exprime ici la force de חֵמָה et maintient le poids judiciaire de la métaphore prophétique.
- source_word: קֻבַּעַת
  choice: le bol
  rationale: Le mot désigne un récipient à boire de forme arrondie. « Bol » en donne un équivalent moderne, tout en laissant la note signaler l’autre possibilité.
- source_word: כּוֹס הַתַּרְעֵלָה
  choice: la coupe qui fait tituber
  rationale: La tournure explicite naturellement en français l’effet étourdissant ou chancelant indiqué par le nom hébreu, sans le réduire à une simple peur.
- source_word: מָצִית
  choice: tu l’as entièrement vidée
  rationale: Cette expression communique l’idée de boire jusqu’au bout et souligne la totalité de l’épreuve, sans ajouter explicitement la « lie », absente du texte.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur / l’Éternel
  rationale: Le texte porte directement le nom divin. Sa translittération préserve le nom propre sans lui substituer un titre.
- issue: Métaphore de la coupe de fureur
  choice: Conserver l’image de la coupe reçue de la main de Yahweh
  alternative: Paraphraser par « châtiment » ou « jugement »
  rationale: La métaphore associe la colère divine à une boisson imposée et entièrement consommée. La conserver respecte la force poétique et théologique du passage sans en résoudre toutes les tensions.
translation_notes:
  register: Français international moderne, poétique et digne. Les impératifs répétés donnent de l’urgence à l’appel, tandis que les images concrètes de la main, de la coupe et du vacillement sont conservées.
