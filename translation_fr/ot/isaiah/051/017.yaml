review_pass:
  verdict: revise
  source_fidelity: La répétition des impératifs, l’adresse féminine à Jérusalem, la « main de Yahweh », la coupe de sa fureur et l’idée d’avoir vidé la coupe sont bien rendues. Toutefois, « tu as bu le bol » se comprend spontanément comme si Jérusalem avait bu le récipient lui-même. La relation entre קֻבַּעַת et « coupe du vertige » doit être exprimée plus clairement.
  naturalness: Le registre est moderne, poétique et globalement naturel. « Le bol de la coupe du vertige » maintient l’image inhabituelle mais intelligible du texte tout en évitant l’ambiguïté matérielle de « boire le bol ». « Vidée jusqu’à la dernière goutte » rend naturellement l’intensité de מָצִית.
  terminology: « Yahweh » respecte la décision de rendre le tétragramme par le nom propre. « Fureur » convient pour חֵמָה. « Vertige » et l’explication du vacillement rendent de façon sobre le sens probable de תַּרְעֵלָה, sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « Tu as bu le bol » est syntaxiquement et sémantiquement maladroit en français.
    rationale: En français, on boit dans un bol, tandis que l’hébreu emploie le récipient comme métonymie de ce qui est bu. La formulation révisée conserve les deux termes du texte hébreu et rend leur lien explicite.
  - severity: low
    issue: La note b donne « la coupe » comme seule alternative à « le bol ».
    rationale: L’alternative utile est plutôt « gobelet » ou « grande coupe » ; « coupe » est déjà le mot suivant dans l’expression hébraïque et ne clarifie pas la distinction entre les deux récipients.
