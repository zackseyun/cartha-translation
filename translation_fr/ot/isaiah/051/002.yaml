source:
  edition: WLC
  text: הַבִּ֨יטוּ֙ אֶל אַבְרָהָ֣ם אֲבִי/כֶ֔ם וְ/אֶל שָׂרָ֖ה תְּחוֹלֶלְ/כֶ֑ם כִּי אֶחָ֣ד קְרָאתִ֔י/ו וַ/אֲבָרְכֵ֖/הוּ וְ/אַרְבֵּֽ/הוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/002.yaml
  text: Look to Abraham your father and to Sarah who bore you; for I called him when he was one[a], and I blessed him and multiplied him.
translation:
  language: fr
  text: Tournez vos regards vers Abraham, votre père, et vers Sara, qui vous a mis au monde. Car je l’ai appelé alors qu’il n’était qu’un seul homme[a] ; je l’ai béni et je l’ai multiplié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « alors qu’il était seul ». L’hébreu dit littéralement : « un ».'
    reason: Alternative lexicale préservant l’ambiguïté de אֶחָד entre unicité numérique et solitude.
lexical_decisions:
- source_word: הַבִּיטוּ
  choice: Portez les regards vers
  rationale: L’impératif pluriel conserve l’image visuelle tout en exprimant l’appel à considérer Abraham et Sara comme exemples.
- source_word: אַבְרָהָם אֲבִיכֶם
  choice: Abraham, votre père
  rationale: « Père » maintient le langage familial et l’identité collective du texte hébreu, sans le réduire au seul sens d’ancêtre.
- source_word: שָׂרָה תְּחוֹלֶלְכֶם
  choice: Sara, qui vous a mis au monde
  rationale: Le verbe évoque les douleurs de l’enfantement et la mise au monde ; cette formulation rend naturellement en français l’image maternelle appliquée au peuple.
- source_word: כִּי
  choice: Car
  rationale: Introduit la raison de l’exhortation précédente avec concision.
- source_word: אֶחָד
  choice: alors qu’il n’était qu’un seul homme
  rationale: La formulation conserve l’idée explicite d’« un » tout en étant idiomatique en français et en soulignant le contraste avec la multiplication qui suit.
- source_word: קְרָאתִיו
  choice: je l’ai appelé
  rationale: Rend simplement l’appel divin sans en préciser abusivement la forme.
- source_word: וַאֲבָרְכֵהוּ
  choice: je l’ai béni
  rationale: Équivalent direct qui préserve la portée de la bénédiction divine.
- source_word: וְאַרְבֵּהוּ
  choice: je l’ai multiplié
  rationale: Rendu proche du hiphil de רבה et du langage des promesses de la Genèse ; la formulation maintient Abraham lui-même comme objet grammatical sans ajouter explicitement « descendance ».
theological_decisions:
- issue: Sens de אֶחָד décrivant Abraham au moment de son appel
  choice: alors qu’il n’était qu’un seul homme
  alternative: alors qu’il était seul
  rationale: Le texte dit littéralement « un » et met en contraste un commencement réduit à un homme avec la multiplication opérée par Dieu. La traduction principale conserve ce motif numérique, tandis que la note signale le sens possible de solitude.
translation_notes:
  register: Français international moderne, digne et accessible. Le pluriel « vous » s’adresse collectivement au peuple. La ponctuation en deux phrases évite une période trop lourde, tandis que le point-virgule souligne le lien entre bénédiction et multiplication.
