id: ISA.51.3
reference: Isaiah 51:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: WLC
  text: כִּֽי נִחַ֨ם יְהוָ֜ה צִיּ֗וֹן נִחַם֙ כָּל חָרְבֹתֶ֔י/הָ וַ/יָּ֤שֶׂם מִדְבָּרָ/הּ֙ כְּ/עֵ֔דֶן וְ/עַרְבָתָ֖/הּ כְּ/גַן יְהוָ֑ה שָׂשׂ֤וֹן וְ/שִׂמְחָה֙ יִמָּ֣צֵא בָ֔/הּ תּוֹדָ֖ה וְ/ק֥וֹל זִמְרָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/051/003.yaml
  text: For Yahweh comforts Zion[a]; he comforts all her ruins. He makes her wilderness like Eden, and her desert like the garden of Yahweh. Joy and gladness will be found in her[d][c][b], thanksgiving and the sound of song.
translation:
  language: fr
  text: Car Yahweh console Sion ; il console toutes ses ruines[a]. Il rend son désert pareil à Éden[b], et sa plaine aride[c] pareille au jardin de Yahweh. On y trouvera allégresse et joie, des actions de grâce et le son des chants[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ses lieux dévastés » ou « tous ses lieux désolés ».
    reason: lexical_alternative
  - marker: b
    text: « Éden » fait écho au jardin du récit de la Genèse ; comparer « le jardin de Yahweh » dans le membre de phrase suivant.
    reason: cross_reference
  - marker: c
    text: Ou « sa steppe » ou « son désert ». Le terme hébreu désigne une plaine aride.
    reason: lexical_alternative
  - marker: d
    text: 'Littéralement : « la voix du chant » ; ou « le son du chant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit ici la raison ou le fondement de l’exhortation et de la promesse précédentes.
- source_word: נִחַם
  choice: console
  rationale: Le verbe exprime ici la consolation restauratrice accordée à Sion. Le présent français garde la vivacité et la certitude prophétiques sans imposer une chronologie trop précise.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transcrit le nom divin plutôt que de lui substituer un titre.
- source_word: כָּל חָרְבֹתֶיהָ
  choice: toutes ses ruines
  rationale: Désigne l’ensemble des lieux de Sion dévastés ou en ruine ; cette formulation est concrète et naturelle.
- source_word: וַיָּשֶׂם
  choice: Il rend
  rationale: Exprime la transformation assurée du désert dans le tableau prophétique, avec un présent vivant.
- source_word: מִדְבָּרָהּ
  choice: son désert
  rationale: Rend le terrain désertique tout en le distinguant du terme topographique suivant.
- source_word: כְּעֵדֶן
  choice: pareil à Éden
  rationale: Conserve le nom propre et son écho au récit de la Genèse.
- source_word: וְעַרְבָתָהּ
  choice: sa plaine aride
  rationale: עֲרָבָה désigne ici une plaine ou steppe aride ; ce choix maintient le parallélisme sans confondre entièrement le mot avec מִדְבָּר.
- source_word: כְּגַן יְהוָה
  choice: pareille au jardin de Yahweh
  rationale: Préserve la construction génitive et le lien explicite avec l’image d’Éden.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: allégresse et joie
  rationale: Rend naturellement les deux termes parallèles de réjouissance festive.
- source_word: יִמָּצֵא בָהּ
  choice: On y trouvera
  rationale: Formulation française idiomatique qui conserve le sens passif-existentiel et la portée future de la promesse.
- source_word: תּוֹדָה וְקוֹל זִמְרָה
  choice: actions de grâce et chants
  rationale: Rend l’expression cultuelle de reconnaissance et la manifestation audible du chant dans un français naturel.
theological_decisions:
- issue: Traduction du nom divin יְהוָה
  choice: Yahweh
  alternative: le Seigneur
  rationale: Le texte hébreu emploie directement le Tétragramme ; la translittération préserve le nom personnel.
- issue: Valeur temporelle des verbes dans la promesse prophétique
  choice: Présent pour « console » et « rend », puis futur pour « on y trouvera »
  alternative: Tout rendre au passé ou tout rendre au futur
  rationale: Ce mélange respecte la présentation vive et certaine de la restauration sans réduire artificiellement les formes hébraïques à un seul cadre temporel.
- issue: Portée de l’image d’Éden
  choice: Conserver « Éden » et « le jardin de Yahweh » comme deux expressions liées
  alternative: Interpréter Éden par « paradis »
  rationale: La conservation des deux formulations laisse intact l’écho scripturaire et évite de transformer l’allusion en interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en valeur le parallélisme poétique. « Plaine aride » préserve la distinction entre les deux termes hébreux relatifs au désert, tandis que « actions de grâce et chants » évite une tournure inutilement archaïque.
