  verdict: revise
  source_fidelity: 'La liste militaire comprend explicitement « chars, hommes, cavaliers » ; le texte français la conserve sans trancher le lien syntaxique condensé entre ses éléments. Les verbes hébreux sont au récit accompli : « porta » et « découvrit » les rendent plus fidèlement et avec un parallélisme temporel cohérent que l’alternance « portait / a découvert ».'
  naturalness: La formulation reste sobre et lisible dans un registre biblique moderne. Le passé simple convient à une narration scripturaire française et évite le décalage de temps du projet.
  terminology: « Élam », « Qir », « carquois », « cavaliers » et « bouclier » sont appropriés. La note sur le bouclier doit éviter de suggérer que l’on retire la protection du combattant ; il s’agit de mettre à nu ou de découvrir le bouclier, vraisemblablement en vue du combat.
  issues:
