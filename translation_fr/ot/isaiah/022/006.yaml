  text: And Elam bore the quiver with chariots and horsemen[b][a], and Kir uncovered the shield.
translation:
  language: fr
  text: Élam porta le carquois, avec des chars, des hommes et des cavaliers[a] ; Qir découvrit le bouclier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu énumère de façon condensée « chars, hommes, cavaliers » ; le lien précis entre ces termes est incertain. On peut aussi comprendre : « avec des chars d’hommes et de cavaliers » ou « sur des chars, avec des hommes et des cavaliers ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « mit à nu le bouclier » ou « dénuda le bouclier ». Cela évoque probablement la préparation du bouclier au combat.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵילָם
  choice: Élam
  rationale: Nom propre traditionnellement translittéré ainsi en français.
- source_word: נָשָׂא
  choice: portait
  rationale: Le verbe désigne ici le fait de porter ou d’emporter une pièce d’équipement militaire ; l’imparfait français convient à la scène descriptive.
- source_word: אַשְׁפָּה
  choice: le carquois
  rationale: Le terme désigne l’étui dans lequel sont placées les flèches.
- source_word: בְּרֶכֶב אָדָם פָּרָשִׁים
  choice: avec des chars, des hommes et des cavaliers
  rationale: Cette formulation garde le caractère condensé de l’énumération militaire hébraïque sans imposer un rapport syntaxique certain entre les trois éléments.
- source_word: אָדָם
  choice: des hommes
  rationale: Dans cette description de forces armées, le mot renvoie naturellement aux hommes engagés dans le combat, tout en restant syntaxiquement lié de façon incertaine à « chars ».
- source_word: פָּרָשִׁים
  choice: des cavaliers
  rationale: Désigne des combattants montés ; « cavaliers » reste plus proche de la forme concrète que « cavalerie ».
- source_word: קִיר
  choice: Qir
  rationale: Translittération française transparente du nom propre קִיר, avec q pour représenter la consonne hébraïque.
- source_word: עֵרָה
  choice: a découvert
  rationale: Conserve l’image littérale consistant à rendre nu ou à ôter ce qui couvre, sans transformer directement l’expression en « préparer au combat ».
- source_word: מָגֵן
  choice: le bouclier
  rationale: Le singulier et l’article préservent l’image collective ou représentative de l’hébreu.
