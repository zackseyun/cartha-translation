    rationale: « portait » (imparfait) puis « a découvert » (passé composé) ne reflètent pas le parallélisme de deux formes narratives hébraïques et produisent une discordance injustifiée en français.
  - severity: medium
    issue: 'Note a : alternatives syntaxiquement et sémantiquement maladroites'
    rationale: « des chars montés par des hommes et des cavaliers » traite à tort les cavaliers comme des occupants de chars et ne présente pas clairement l’ambiguïté de la construction hébraïque.
  - severity: medium
    issue: 'Note b : explication potentiellement trompeuse'
    rationale: « retirer sa protection » peut faire croire qu’on abandonne une protection personnelle. Le verbe vise plutôt l’action de découvrir ou de mettre à nu le bouclier, possiblement pour le combat.
