  text: כָּל קְצִינַ֥יִ/ךְ נָֽדְדוּ יַ֖חַד מִ/קֶּ֣שֶׁת אֻסָּ֑רוּ כָּל נִמְצָאַ֨יִ/ךְ֙ אֻסְּר֣וּ יַחְדָּ֔ו מֵ/רָח֖וֹק בָּרָֽחוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/003.yaml
  text: All your rulers have fled together[a]; they were captured without the bow. All of your fugitives who were found were captured together[b]; they had fled far away.
translation:
  language: fr
  text: Tous tes chefs ont fui ensemble ; ils ont été faits prisonniers sans recours à l’arc.[a] Tous ceux des tiens qu’on a trouvés furent tous faits prisonniers ensemble ;[b] ils s’étaient enfuis au loin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu dit littéralement : « ils furent liés sans/par l’arc ». La préposition peut indiquer qu’ils furent capturés sans recours à l’arc, ou, selon une autre compréhension, alors qu’ils étaient loin de leur arc ou privés d’arc.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « Tous ceux des tiens qu’on a trouvés furent liés ensemble ; ils avaient fui de loin. » La syntaxe condensée de la dernière proposition hébraïque permet différents rattachements.'
    reason: alternative_reading
lexical_decisions:
- source_word: קְצִינַיִךְ
  choice: tes chefs
  rationale: קָצִין peut désigner un dirigeant, un officier ou un commandant. « Chefs » convient au contexte à la fois civil et militaire sans préciser indûment leur fonction.
- source_word: נָדְדוּ
  choice: ont fui
  rationale: Dans ce contexte de siège et de capture, נדד exprime plus naturellement la fuite qu’une simple errance.
- source_word: מִקֶּשֶׁת
  choice: sans qu’on ait à tirer à l’arc
  rationale: 'La préposition מִן est comprise ici dans un sens privatif ou de séparation : les chefs sont capturés sans combat à l’arc. La note conserve l’ambiguïté de la construction.'
- source_word: אֻסָּרוּ / אֻסְּרוּ
  choice: ont été faits prisonniers
  rationale: Le verbe אָסַר signifie littéralement « lier » ; au passif et dans un contexte militaire, il désigne naturellement le fait d’être fait prisonnier.
- source_word: נִמְצָאַיִךְ
  choice: ceux des tiens qu’on a trouvés
  rationale: Cette formulation traduit directement le participe passif « ceux qui ont été trouvés » et évite de transformer explicitement tous les intéressés en « fugitifs », idée seulement suggérée par la dernière proposition.
- source_word: מֵרָחוֹק בָּרָחוּ
  choice: ils avaient fui au loin
  rationale: ברח signifie « fuir » et מֵרָחוֹק indique ici la distance. Le plus-que-parfait rend clairement la fuite antérieure à leur capture, tout en signalant en note que la syntaxe hébraïque est condensée.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement féminin implicite de l’hébreu s’adresse à Jérusalem. La répétition de « ensemble » et de « ont été faits prisonniers » reproduit la structure insistante du verset.
