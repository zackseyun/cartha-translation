  yaml_path: translation/ot/isaiah/022/007.yaml
  text: And your choicest valleys were filled with chariots[a], and the horsemen took their positions at the gate.
translation:
  language: fr
  text: Tes plus belles vallées furent remplies de chars de guerre, et les cavaliers prirent position à la porte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vers la porte ». La terminaison hébraïque peut indiquer une direction, tandis que la construction verbale souligne fortement le fait de prendre position.'
    reason: ambiguïté grammaticale et emphase de l’hébreu
lexical_decisions:
- source_word: מִבְחַר עֲמָקַיִךְ
  choice: tes plus belles vallées
  rationale: מִבְחַר désigne ce qu’il y a de meilleur ou de plus remarquable. Avec le pluriel « vallées » et le suffixe féminin singulier qui renvoie à la ville personnifiée, « tes plus belles vallées » est naturel et conserve la valeur superlative de l’expression.
- source_word: מָלְאוּ רָכֶב
  choice: furent remplies de chars
  rationale: רֶכֶב est ici un collectif désignant les chars ou les forces de chars. Le pluriel français « chars » exprime clairement cette réalité militaire, tandis que la tournure passive respecte le tableau présenté par l’hébreu.
- source_word: הַפָּרָשִׁים
  choice: les cavaliers
  rationale: Le terme désigne des combattants montés. « Cavaliers » est le terme militaire courant, précis et naturel en français moderne.
- source_word: שֹׁת שָׁתוּ
  choice: prirent position
  rationale: La combinaison d’un infinitif absolu et d’un verbe conjugué de שׁית souligne l’action de placer ou d’établir. Dans ce contexte militaire, « prirent position » rend idiomatiquement le déploiement délibéré sans surcharger la phrase.
- source_word: הַשָּׁעְרָה
  choice: à la porte
  rationale: Le hé directionnel peut indiquer un mouvement vers la porte, mais avec le verbe de positionnement, « à la porte » rend bien la position atteinte. L’ambiguïté directionnelle est signalée en note.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement féminin singulier (« tes ») conserve l’adresse à Jérusalem personnifiée. Le vocabulaire militaire reste accessible sans archaïsme.
