  text: וַ/הֲדַפְתִּ֖י/ךָ מִ/מַּצָּבֶ֑/ךָ וּ/מִ/מַּעֲמָֽדְ/ךָ֖ יֶהֶרְסֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/019.yaml
  text: And I will thrust you from your office[a], and he will pull you down from your station.
translation:
  language: fr
  text: Je te chasserai de ton poste, et il te fera tomber de ta position.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’hébreu passe de « Je te chasserai » à « il te fera tomber ». Certaines traductions harmonisent le second membre ainsi : « je te ferai tomber ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲדַפְתִּיךָ
  choice: Je te chasserai
  rationale: Le verbe הדף exprime une poussée énergique qui éloigne. « Chasser » rend naturellement en français l’idée d’une éviction forcée, tandis que le futur convient au discours prophétique.
- source_word: מִמַּצָּבֶךָ
  choice: de ton poste
  rationale: מַצָּב peut désigner une place assignée ou une fonction officielle. Dans le contexte de la destitution de Shebna, « poste » exprime clairement sa charge sans réduire le terme à un emplacement physique.
- source_word: וּמִמַּעֲמָדְךָ
  choice: à ta position
  rationale: מַעֲמָד désigne la place où l’on se tient, la position ou le rang. « Position » conserve le parallélisme institutionnel avec « poste » tout en restant idiomatique après « arracher à ».
- source_word: יֶהֶרְסֶךָ
  choice: il t’arrachera
  rationale: הרס signifie ordinairement démolir ou renverser. Appliqué ici à une personne et à sa position, « arracher » traduit avec force l’idée de la faire tomber et de l’en déloger, tout en conservant le sujet masculin singulier à la troisième personne.
theological_decisions:
- issue: Changement de sujet dans le second membre
  choice: Conserver le passage de la première personne (« Je te chasserai ») à la troisième personne du masculin singulier (« il t’arrachera »).
  alternative: Harmoniser à la première personne (« je t’arracherai ») ou employer une tournure passive (« tu seras arraché »).
  rationale: Le texte massorétique présente explicitement ce changement de personne. Le conserver respecte l’ambiguïté du texte sans identifier silencieusement le sujet de « il » ni lisser la tension grammaticale.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond à l’adresse directe au singulier. « Poste » et « position » rendent le parallélisme des deux termes hébreux sans répétition lourde; la note signale le changement de personne inhabituel.
