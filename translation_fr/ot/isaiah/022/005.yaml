  text: כִּ֣י יוֹם֩ מְהוּמָ֨ה וּ/מְבוּסָ֜ה וּ/מְבוּכָ֗ה לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/גֵ֣יא חִזָּי֑וֹן מְקַרְקַ֥ר קִ֖ר וְ/שׁ֥וֹעַ אֶל הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/005.yaml
  text: For it is a day of tumult and trampling and confusion from the Lord GOD of Armies in the Valley of Vision[c][b][a], a battering down of the wall and a cry to the mountain.
translation:
  language: fr
  text: 'Car c’est un jour de tumulte, de piétinement et de confusion, pour le Seigneur Yahweh, maître des armées,[a] dans la vallée de la Vision : on démolit une muraille[b] et un cri retentit vers la montagne.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venant du Seigneur Yahweh, maître des armées » ou « appartenant au Seigneur Yahweh, maître des armées » ; la préposition hébraïque peut exprimer la relation ou l’appartenance aussi bien que la provenance.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « démolissant une muraille » ; la forme du verbe hébreu est difficile et peut aussi se comprendre comme « brisant » ou « abattant ».
    reason: lexical_alternative
  - marker: c
    text: Ou « et des cris vers la montagne » ou « et un cri en direction de la montagne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Car
  rationale: Introduit l’explication de la lamentation et de l’oracle qui précèdent.
- source_word: מְהוּמָה
  choice: tumulte
  rationale: Exprime le désordre bruyant et l’agitation collective dans un registre prophétique naturel.
- source_word: מְבוּסָה
  choice: écrasement
  rationale: Conserve l’image violente issue de l’idée de fouler aux pieds, tout en désignant naturellement une calamité militaire.
- source_word: מְבוּכָה
  choice: désarroi
  rationale: Rend la confusion et la perte de repères sans réduire le terme à un état purement intellectuel.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  choice: venant du Seigneur Yahweh, maître des armées
  rationale: « Venant de » exprime ici la source du jour de jugement, tandis qu’une note conserve les autres valeurs possibles de la préposition ל. « Yahweh » représente le nom divin et « maître des armées » communique le sens de צְבָאוֹת en français courant.
- source_word: בְּגֵיא חִזָּיוֹן
  choice: dans la vallée de la Vision
  rationale: Conserve littéralement la désignation donnée au lieu et sa valeur de titre.
- source_word: מְקַרְקַר קִיר
  choice: on abat la muraille
  rationale: Rend de façon concise l’action destructrice exprimée par une forme verbale difficile, sans préciser une méthode d’assaut absente du texte.
- source_word: וְשׁוֹעַ אֶל הָהָר
  choice: et un cri monte vers la montagne
  rationale: Restitue l’image directionnelle dans un français idiomatique; « monte » est explicité d’après le mouvement vers la montagne.
theological_decisions:
- issue: Représentation du nom divin יְהוָה
  choice: Yahweh
  alternative: le SEIGNEUR
  rationale: Le nom propre révélé est transcrit afin de le distinguer du titre אֲדֹנָי, rendu par « Seigneur ».
- issue: Valeur de la préposition ל devant le titre divin
  choice: venant du Seigneur Yahweh
  alternative: pour le Seigneur Yahweh / appartenant au Seigneur Yahweh
  rationale: Dans ce contexte de jugement, la provenance ou l’initiative divine s’intègre bien au discours, mais la note préserve l’ambiguïté grammaticale réelle.
translation_notes:
  register: Français international actuel, sobre et prophétique. La triple accumulation nominale est maintenue, avec des termes distincts et concrets. La syntaxe devient légèrement verbale dans la seconde moitié pour rester intelligible en français, tandis que les notes signalent les ambiguïtés du texte hébreu.
