  text: וּ/מִקְוָ֣ה עֲשִׂיתֶ֗ם בֵּ֚ין הַ/חֹ֣מֹתַ֔יִם לְ/מֵ֖י הַ/בְּרֵכָ֣ה הַ/יְשָׁנָ֑ה וְ/לֹ֤א הִבַּטְתֶּם֙ אֶל עֹשֶׂ֔י/הָ וְ/יֹצְרָ֥/הּ מֵֽ/רָח֖וֹק לֹ֥א רְאִיתֶֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/011.yaml
  text: You made a reservoir between the two walls for the waters of the old pool[a], but you did not look to the one who made it, nor did you see the one who formed it long ago.
translation:
  language: fr
  text: Vous avez construit un réservoir entre les deux murailles pour les eaux de l’ancien bassin, mais vous ne vous êtes pas tournés vers celui qui l’a faite, ni n’avez vu celui qui l’a façonnée il y a longtemps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de loin ». L’expression hébraïque peut indiquer une distance dans l’espace, mais elle désigne probablement ici un temps ancien.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוָה
  choice: réservoir
  rationale: Dans ce contexte de travaux hydrauliques et défensifs, le terme désigne un ouvrage où l’eau est recueillie.
- source_word: בֵּין הַחֹמֹתַיִם
  choice: entre les deux murailles
  rationale: Le duel hébreu indique explicitement deux murs; « murailles » convient au contexte fortifié.
- source_word: לְמֵי הַבְּרֵכָה הַיְשָׁנָה
  choice: pour les eaux de l’ancien bassin
  rationale: « Bassin » distingue בְּרֵכָה du réservoir nouvellement construit, tandis que « les eaux » conserve la forme hébraïque naturelle dans un registre biblique.
- source_word: הִבַּטְתֶּם אֶל
  choice: vous avez tourné vos regards vers
  rationale: Cette expression rend l’orientation de l’attention et de la confiance, au-delà d’un simple regard physique.
- source_word: עֹשֶׂיהָ
  choice: celui qui l’a fait
  rationale: La formulation garde le participe et le suffixe féminin sans préciser artificiellement si l’objet visé est la ville, l’installation hydraulique ou un autre élément féminin du contexte.
- source_word: יֹצְרָהּ
  choice: celui qui l’avait façonné
  rationale: « Façonner » conserve l’idée d’une formation intentionnelle; le plus-que-parfait s’accorde avec la lecture temporelle de מֵרָחוֹק.
- source_word: מֵרָחוֹק
  choice: depuis longtemps
  rationale: Dans ce contexte, l’éloignement est probablement temporel et renvoie à l’action ou au dessein ancien de Dieu, tout en laissant l’autre sens en note.
- source_word: לֹא רְאִיתֶם
  choice: vous n’avez pas vu
  rationale: La traduction littérale préserve le parallélisme avec le regard mentionné dans le membre précédent.
theological_decisions:
- issue: Référent de « celui qui l’a fait » et de « celui qui l’avait façonné »
  choice: Dieu est le sujet implicite, tandis que le pronom féminin reste sans antécédent explicitement fixé.
  alternative: Préciser que Dieu a fait le bassin, le réservoir, le système hydraulique ou Jérusalem.
  rationale: Le contexte oppose les préparatifs défensifs à l’absence d’attention envers Dieu. L’hébreu ne fixe toutefois pas sans ambiguïté l’antécédent du suffixe féminin; la traduction conserve donc cette tension.
- issue: Valeur de מֵרָחוֹק
  choice: 'Lecture temporelle: « depuis longtemps »'
  alternative: 'Lecture spatiale: « de loin »'
  rationale: La lecture temporelle s’accorde mieux avec l’idée du façonnement ancien et intentionnel de Dieu, mais la possibilité spatiale demeure réelle et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Murailles » situe naturellement les murs dans le cadre défensif; la structure parallèle « celui qui… » préserve la sobriété et l’ambiguïté de l’hébreu.
