    reason: lexical_alternative
  revision_rationale: La révision corrige les accords obligatoires, évite un plus-que-parfait non imposé par l’hébreu et améliore la fluidité sans expliciter le référent féminin ni imposer une interprétation théologique. La note conserve l’ambiguïté lexicale de מֵרָחוֹק.
