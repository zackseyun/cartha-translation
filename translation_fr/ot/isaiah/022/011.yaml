revisions:
- from: Vous avez construit un réservoir entre les deux murailles pour les eaux de l’ancien bassin. Mais vous n’avez pas tourné vos regards vers celui qui l’a fait, et vous n’avez pas vu celui qui l’avait façonné depuis longtemps[a].
  to: Vous avez construit un réservoir entre les deux murailles pour les eaux de l’ancien bassin, mais vous ne vous êtes pas tournés vers celui qui l’a faite, ni n’avez vu celui qui l’a façonnée il y a longtemps[a].
  rationale: La révision corrige les accords obligatoires, évite un plus-que-parfait non imposé par l’hébreu et améliore la fluidité sans expliciter le référent féminin ni imposer une interprétation théologique. La note conserve l’ambiguïté lexicale de מֵרָחוֹק.
