  text: וּ/תְקַעְתִּ֥י/ו יָתֵ֖ד בְּ/מָק֣וֹם נֶאֱמָ֑ן וְ/הָיָ֛ה לְ/כִסֵּ֥א כָב֖וֹד לְ/בֵ֥ית אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/023.yaml
  text: And I will drive him like a peg into a secure place[b][a], and he will become a throne of honor to his father's house.
translation:
  language: fr
  text: Je l’enfoncerai, comme une cheville, dans un endroit solide[a], et il deviendra un trône d’honneur[b] pour la maison de son père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu sûr » ou « dans un endroit ferme ».
    reason: lexical_alternative
  - marker: b
    text: « Un trône d’honneur » peut aussi se traduire par « un trône glorieux » ou « un siège d’honneur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתִּיו
  choice: Je l’enfoncerai
  rationale: Le verbe תקע évoque ici l’action concrète d’enfoncer ou de fixer une cheville. « Enfoncer » conserve vivement cette image et s’emploie naturellement en français.
- source_word: יָתֵד
  choice: cheville
  rationale: Dans ce contexte, יָתֵד désigne une pièce enfoncée dans un support afin de porter une charge. « Cheville » convient mieux à cette image que « piquet », qui évoquerait surtout le sol, ou « clou », plus étroit.
- source_word: בְּמָקוֹם נֶאֱמָן
  choice: dans un endroit solide
  rationale: נֶאֱמָן exprime ici la fermeté et la fiabilité du lieu. « Solide » rend le sens physique sans produire le littéralisme peu naturel « fidèle ».
- source_word: וְהָיָה
  choice: il deviendra
  rationale: Le contexte présente l’état qui résultera de l’action divine. « Deviendra » exprime cette conséquence tout en restant dans la gamme de sens de היה.
- source_word: לְכִסֵּא כָבוֹד
  choice: un trône d’honneur
  rationale: 'Cette formulation préserve les deux éléments de la métaphore : כִּסֵּא, « trône/siège », et כָבוֹד, « honneur/gloire ». Elle évite de réduire l’image à une simple position honorifique.'
- source_word: לְבֵית אָבִיו
  choice: pour la maison de son père
  rationale: Le לְ indique ici naturellement le bénéfice ou la relation. « Maison de son père » conserve le sens collectif de la famille ou maisonnée ancestrale.
theological_decisions:
- issue: Portrait métaphorique du rôle d’Éliakim
  choice: Conserver les images concrètes de la cheville et du trône.
  alternative: Paraphraser Éliakim comme un dirigeant solidement établi qui honorera sa famille.
  rationale: Le texte superpose les métaphores de stabilité, de soutien et d’honneur. Les maintenir préserve la richesse littéraire et la tension du passage sans imposer une interprétation politique ou doctrinale plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. La construction garde les métaphores hébraïques sans les expliciter abusivement. Les marqueurs de notes sont placés auprès des expressions auxquelles ils se rapportent.
