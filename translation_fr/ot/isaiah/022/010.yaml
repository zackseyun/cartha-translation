  text: וְ/אֶת בָּתֵּ֥י יְרוּשָׁלִַ֖ם סְפַרְתֶּ֑ם וַ/תִּתְֿצוּ֙ הַ/בָּ֣תִּ֔ים לְ/בַצֵּ֖ר הַ/חוֹמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/010.yaml
  text: And you counted the houses of Jerusalem[b][a], and you tore down the houses to fortify the wall.
translation:
  language: fr
  text: Vous avez compté les maisons de Jérusalem, et vous avez démoli les maisons pour fortifier la muraille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת בָּתֵּי יְרוּשָׁלִַם
  choice: les maisons de Jérusalem
  rationale: La construction place l’objet en tête avec אֵת, probablement pour le mettre en relief. En français, l’ordre naturel avec le verbe conserve clairement le sens sans rendre artificiellement le marqueur d’objet.
- source_word: סְפַרְתֶּם
  choice: vous avez recensé
  rationale: Le qal de ספר signifie « compter, dénombrer ». « Recenser » convient ici à l’évaluation méthodique des maisons en vue des préparatifs défensifs, tout en restant naturel en français.
- source_word: וַ/תִּתְֿצוּ
  choice: puis vous en avez démoli
  rationale: נתץ désigne l’action d’abattre ou de démolir une construction. « Démolir » est précis et idiomatique pour des maisons; « puis » exprime la succession narrative du wayyiqtol.
- source_word: הַ/בָּתִּים
  choice: certaines
  rationale: Le pronom « en » reprend les maisons, et « certaines » évite de suggérer que toutes les maisons de Jérusalem ont été détruites. Cette formulation rend naturellement en français le sous-ensemble déterminé par le contexte.
- source_word: לְ/בַצֵּר הַ/חוֹמָה
  choice: pour fortifier la muraille
  rationale: בצר au piel exprime ici le renforcement défensif; « fortifier » restitue le but militaire. « Muraille » désigne naturellement l’enceinte défensive d’une ville.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La répétition hébraïque de « maisons » est allégée par « en… certaines » afin d’éviter une ambiguïté référentielle en français, sans changer le sens contextuel.
