  variant: modern international French
source:
  edition: WLC
  text: וְ/תָל֨וּ עָלָ֜י/ו כֹּ֣ל כְּב֣וֹד בֵּית אָבִ֗י/ו הַ/צֶּֽאֱצָאִים֙ וְ/הַ/צְּפִע֔וֹת כֹּ֖ל כְּלֵ֣י הַ/קָּטָ֑ן מִ/כְּלֵי֙ הָֽ/אַגָּנ֔וֹת וְ/עַ֖ד כָּל כְּלֵ֥י הַ/נְּבָלִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/024.yaml
  text: 'And they will hang on him all the honor of his father’s house: the offspring and the offshoots, every small vessel, from the bowls to all the jars.'
translation:
  language: fr
  text: 'On suspendra à lui tout l’honneur de la maison de son père : les descendants et les rejetons, tous les petits récipients, depuis les coupes jusqu’à toutes les jarres.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבוֹד
  choice: honneur
  rationale: Dans ce contexte familial, le terme désigne le poids, le prestige ou l’honneur de la maison plutôt qu’une gloire visible.
- source_word: הַצֶּאֱצָאִים וְהַצְּפִעוֹת
  choice: les descendants et les rejetons
  rationale: Le premier terme évoque clairement la descendance; le second est rare et probablement parallèle, avec l’idée de ramifications ou de rejetons. La formulation conserve l’image sans prétendre lever toute l’incertitude lexicale.
- source_word: כְּלֵי הַקָּטָן
  choice: tous les petits récipients
  rationale: כְּלִי désigne ici des objets ou récipients, et הַקָּטָן marque leur petitesse ou leur faible importance; le contexte des coupes et jarres favorise « récipients ».
- source_word: אַגָּנוֹת
  choice: coupes
  rationale: Le mot désigne des bassins, coupes ou vasques; « coupes » convient à l’énumération de récipients.
- source_word: נְּבָלִים
  choice: jarres
  rationale: Le terme peut désigner des outres ou des jarres. Le parallélisme avec d’autres récipients permet « jarres », tout en laissant subsister une incertitude matérielle.
theological_decisions:
- issue: La charge placée sur Éliakim et sa portée familiale
  choice: Conserver l’image concrète de toute la maison suspendue à lui, sans l’expliciter théologiquement.
  alternative: Paraphraser en disant que toute sa parenté dépendra de lui ou lui devra son prestige.
  rationale: Le texte emploie une métaphore de suspension qui prolonge l’image du verset précédent. La traduction la préserve, ainsi que la tension entre honneur familial et poids de la dépendance.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe garde la métaphore biblique de la suspension et le deux-points clarifie l’apposition. Aucun marqueur de note n’est requis.
