  text: וְ/נִגְלָ֥ה בְ/אָזְנָ֖/י יְהוָ֣ה צְבָא֑וֹת אִם יְ֠כֻפַּר הֶ/עָוֺ֨ן הַ/זֶּ֤ה לָ/כֶם֙ עַד תְּמֻת֔וּ/ן אָמַ֛ר אֲדֹנָ֥/י יְהוִ֖ה צְבָאֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/014.yaml
  text: 'And the LORD of Armies has revealed in my ears: “Surely this iniquity will not be atoned for you until you die,” says the Lord GOD of Armies.'
translation:
  language: fr
  text: 'Le SEIGNEUR des armées me l’a révélé : « Cette faute ne sera certainement pas expiée pour vous jusqu’à ce que vous mouriez », dit le Seigneur DIEU des armées.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנִגְלָה בְאָזְנַי
  choice: me l’a révélé
  rationale: La tournure hébraïque évoque littéralement une révélation faite « à mes oreilles »; cette formulation française en transmet naturellement le sens auditif sans alourdir la phrase.
- source_word: יְהוָה צְבָאוֹת
  choice: le SEIGNEUR des armées
  rationale: Les petites capitales distinguent le nom divin YHWH, tandis que « des armées » conserve le titre צְבָאוֹת sans préciser s’il s’agit des armées célestes ou terrestres.
- source_word: הֶעָוֹן הַזֶּה
  choice: cette faute
  rationale: « Faute » rend ici עָוֹן de façon claire et digne, en désignant la culpabilité grave dénoncée dans le contexte.
- source_word: יְכֻפַּר ... לָכֶם
  choice: sera expiée pour vous
  rationale: Le passif de כפר est conservé par « être expiée », et לָכֶם est explicitement rendu par « pour vous ».
- source_word: אֲדֹנָי יְהוִה צְבָאוֹת
  choice: le Seigneur DIEU des armées
  rationale: « Seigneur » rend אֲדֹנָי et « DIEU » signale le nom divin YHWH, tout en préservant la succession distincte des deux titres.
theological_decisions:
- issue: Force de la formule négative אִם־יְכֻפַּר
  choice: ne sera certainement pas expiée
  alternative: ne sera pas expiée
  rationale: Dans ce serment implicite, אִם introduit une négation solennelle; « certainement pas » en restitue la force sans ajouter le contenu omis de l’imprécation.
- issue: Portée de עַד תְּמֻתוּן
  choice: jusqu’à ce que vous mouriez
  alternative: avant votre mort
  rationale: La traduction garde la structure temporelle de l’hébreu et son éventuelle tension, sans décider explicitement si la mort constitue une limite après laquelle l’expiation deviendrait possible.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition des titres divins et le langage cultuel d’« expiation » sont conservés en raison de leur poids rhétorique et théologique.
