source:
  edition: WLC
  text: וַ/יְגַ֕ל אֵ֖ת מָסַ֣ךְ יְהוּדָ֑ה וַ/תַּבֵּט֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֶל נֶ֖שֶׁק בֵּ֥ית הַ/יָּֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/008.yaml
  text: And he removed the covering of Judah[b][a], and on that day you looked to the weapons of the House of the Forest.
translation:
  language: fr
  text: Il a retiré ce qui couvrait Juda[a] et, ce jour-là, tu as porté ton regard vers les armes de la Maison de la Forêt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la couverture de Juda ». L’image peut désigner ce qui assurait sa défense ou sa protection.'
    reason: lexical_alternative
  - marker: b
    text: La « Maison de la Forêt » désigne probablement l’arsenal royal ou le palais appelé ailleurs « Maison de la Forêt du Liban ».
    reason: cross_reference
lexical_decisions:
- source_word: וַיְגַל
  choice: Il a retiré
  rationale: Le hiphil de גלה exprime ici l’action d’enlever ou de découvrir. « A retiré » s’accorde naturellement avec l’objet tout en conservant le sujet masculin singulier non identifié du texte hébreu.
- source_word: מָסַךְ
  choice: ce qui couvrait
  rationale: Le nom désigne une couverture, un écran ou un voile. Cette formulation française conserve l’image concrète sans employer « couverture », qui évoquerait trop facilement une pièce de literie, ni la réduire directement à des « défenses » militaires.
- source_word: יְהוּדָה
  choice: Juda
  rationale: Forme française traditionnelle et courante du nom du territoire et de son peuple.
- source_word: וַתַּבֵּט אֶל
  choice: tu as tourné les regards vers
  rationale: Le verbe à la deuxième personne du masculin singulier signifie regarder vers. Le tutoiement singulier maintient l’adresse prophétique à Juda ou Jérusalem personnifié, tandis que l’expression retenue est naturelle et soutenue en français.
- source_word: בַּיּוֹם הַהוּא
  choice: ce jour-là
  rationale: Expression temporelle idiomatique qui conserve la référence prophétique.
- source_word: נֶשֶׁק
  choice: les armes
  rationale: Le terme désigne l’armement ou les armes. « Armes » est clair en français moderne et n’en restreint pas indûment le sens à l’armure.
- source_word: בֵּית הַיָּעַר
  choice: la Maison de la Forêt
  rationale: Traduction formelle du nom « maison de la forêt ». Les majuscules signalent qu’il s’agit du nom d’un bâtiment, tandis que la note en précise l’identification probable.
theological_decisions:
- issue: Force métaphorique de מָסַךְ יְהוּדָה
  choice: Conserver l’image par « ce qui couvrait Juda »
  alternative: « la défense de Juda » ou « ce qui protégeait Juda »
  rationale: Le texte hébreu présente une couverture concrète comme métaphore de la protection. La traduction maintient cette image et laisse la note expliciter sa portée possible sans imposer une interprétation exclusivement militaire.
- issue: Identité du sujet de וַיְגַל
  choice: Conserver « il » sans identifier explicitement le sujet
  alternative: Nommer Dieu, l’ennemi ou employer une tournure impersonnelle
  rationale: Le verbe hébreu est au masculin singulier, mais ce verset ne nomme pas son sujet. Le pronom respecte cette donnée et évite de trancher une ambiguïté contextuelle.
- issue: Destinataire de וַתַּבֵּט
  choice: Employer « tu » au singulier
  alternative: Employer « vous » ou une formulation impersonnelle
  rationale: La forme hébraïque est à la deuxième personne du masculin singulier et s’inscrit vraisemblablement dans une adresse à Juda ou Jérusalem personnifié. Le singulier préserve cette rhétorique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reproduit la forme hébraïque et l’adresse prophétique. « Maison de la Forêt » est traité comme le nom propre traditionnel d’un bâtiment.
