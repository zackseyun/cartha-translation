  text: מַשָּׂ֖א גֵּ֣יא חִזָּי֑וֹן מַה לָּ֣/ךְ אֵפ֔וֹא כִּֽי עָלִ֥ית כֻּלָּ֖/ךְ לַ/גַּגּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/001.yaml
  text: 'An oracle concerning the Valley of Vision: What is the matter with you now[a], that all of you have gone up to the rooftops?'
translation:
  language: fr
  text: 'Proclamation concernant la Vallée de la Vision : Que t’arrive-t-il donc, toi qui es tout entière montée sur les toits ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשָּׂא
  choice: Proclamation
  rationale: Dans un titre prophétique, le terme introduit une parole solennelle. « Proclamation » est clair et actuel, tandis que « fardeau » risquerait de surinterpréter sa nuance étymologique et qu’« oracle » peut évoquer en français des pratiques divinatoires.
- source_word: גֵּיא חִזָּיוֹן
  choice: la Vallée de la Vision
  rationale: Le syntagme construit signifie littéralement « vallée de vision ». Les majuscules signalent ici une désignation poétique sans en préciser le référent dans le texte.
- source_word: מַה לָּךְ אֵפוֹא
  choice: Que t’arrive-t-il donc
  rationale: Cette tournure rend naturellement la question idiomatique adressée à la ville personnifiée; « donc » conserve l’insistance rhétorique de אֵפוֹא.
- source_word: כִּי
  choice: pour que
  rationale: Dans cette question portant sur une situation observée, le français « pour que » introduit naturellement le fait qui motive l’interrogation, sans lui attribuer nécessairement une finalité.
- source_word: עָלִית כֻּלָּךְ
  choice: vous soyez tous montés
  rationale: Le verbe exprime la montée. Le passage du singulier « t’ » au pluriel « vous… tous » rend la ville personnifiée puis l’ensemble de ses habitants, portée collective suggérée par כֻּלָּךְ.
- source_word: לַגַּגּוֹת
  choice: sur les toits
  rationale: La préposition marque ici la montée jusque sur les toits plats, espaces accessibles des maisons; cette formulation est idiomatique en français.
theological_decisions:
- issue: Référent de « la Vallée de la Vision »
  choice: Conserver littéralement la désignation dans le texte sans l’identifier
  alternative: L’identifier directement à Jérusalem ou à une vallée liée à Jérusalem
  rationale: Le verset hébreu ne précise pas explicitement le lieu visé. La note peut signaler l’identification probable sans transformer celle-ci en donnée du texte.
translation_notes:
  register: Français international moderne, digne et accessible. L’adresse passe volontairement du féminin singulier, qui personnifie la ville (« t’ »), au pluriel collectif visant ses habitants (« vous… tous »).
