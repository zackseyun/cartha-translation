  text: צָנ֤וֹף יִצְנָפְ/ךָ֙ צְנֵפָ֔ה כַּדּ֕וּר אֶל אֶ֖רֶץ רַחֲבַ֣ת יָדָ֑יִם שָׁ֣מָּ/ה תָמ֗וּת וְ/שָׁ֨מָּ/ה֙ מַרְכְּב֣וֹת כְּבוֹדֶ֔/ךָ קְל֖וֹן בֵּ֥ית אֲדֹנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/isaiah/022/018.yaml
  text: He will surely wrap you up tightly[a], like a ball, into a broad land. There you will die, and there will be the chariots of your glory[c][b], O shame of your master's house.
translation:
  language: fr
  text: Il te roulera en boule[a], vers un vaste pays[b]. Là, tu mourras, et là seront les chars de ta gloire[c], toi qui es la honte de la maison de ton maître !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Il t’enveloppera étroitement » ou « Il t’enroulera bien serré ». L’hébreu associe une forme verbale intensifiée à un nom de même racine pour appuyer l’image.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « un pays large de mains », expression qui désigne un pays vaste ou spacieux.'
    reason: cultural_note
  - marker: c
    text: 'Littéralement : « les chars de ta gloire ». On pourrait aussi comprendre : « tes chars glorieux » ou « les chars qui faisaient ta gloire » ; l’expression peut désigner les chars dont il tirait fierté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָנוֹף יִצְנָפְךָ צְנֵפָה
  choice: Il t’enroulera bien serré
  rationale: L’infinitif absolu suivi de l’imparfait intensifie l’action, tandis que le nom apparenté renforce l’image de quelque chose enroulé ou enveloppé étroitement. Cette formulation française conserve à la fois l’image et l’emphase sans préciser indûment qu’il s’agit d’un vêtement ou d’un turban.
- source_word: כַּדּוּר
  choice: comme une boule
  rationale: Le terme désigne ici un objet arrondi. « Boule » est naturel en français et s’accorde avec l’image de quelqu’un étroitement enroulé.
- source_word: אֶל אֶרֶץ רַחֲבַת יָדָיִם
  choice: jusque dans un vaste pays
  rationale: L’expression signifie littéralement « vers un pays large de mains » et évoque un territoire vaste ou spacieux. « Jusque dans » exprime la destination sans ajouter un verbe distinct tel que « lancer », absent du texte hébreu.
- source_word: שָׁמָּה
  choice: Là … et là
  rationale: La répétition de l’adverbe dans le texte source est maintenue pour préserver son insistance rhétorique.
- source_word: תָמוּת
  choice: tu mourras
  rationale: Le futur simple rend naturellement la déclaration prophétique directe adressée à Shebna.
- source_word: מַרְכְּבוֹת כְּבוֹדֶךָ
  choice: les chars qui faisaient ta gloire
  rationale: La chaîne construite est condensée et peut désigner les chars prestigieux dont le destinataire tirait gloire. La relative est idiomatique en français tout en gardant le lien entre les chars et sa gloire personnelle.
- source_word: קְלוֹן בֵּית אֲדֹנֶיךָ
  choice: toi qui es la honte de la maison de ton maître
  rationale: L’expression est comprise comme une apostrophe dénonciatrice visant le fonctionnaire. « Maître » rend אֲדֹן comme supérieur humain dans ce contexte, sans en faire un titre divin.
