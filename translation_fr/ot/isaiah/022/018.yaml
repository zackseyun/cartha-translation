    issue: « resteront » ajoute une nuance non exprimée
    rationale: Le texte dit littéralement « là, tu mourras, et là [seront] les chars de ta gloire ». Le verbe « rester » introduit l’idée qu’ils demeureront après sa mort.
  - severity: low
    issue: La relative « qui faisaient ta gloire » interprète la chaîne construite
    rationale: Elle est possible, mais « les chars de ta gloire » maintient plus directement la formulation compacte et son ambiguïté.
  - severity: low
    issue: La note c présente une interprétation comme probable
    rationale: Le texte hébreu permet de comprendre les chars comme ceux dont le destinataire tirait fierté, mais il est préférable de signaler cette lecture comme possible.
