revisions:
- from: Il t’enroulera bien serré[a], comme une boule, jusque dans un vaste pays[b]. Là, tu mourras, et là resteront les chars qui faisaient ta gloire[c], toi qui es la honte de la maison de ton maître !
  to: Il te roulera en boule[a], vers un vaste pays[b]. Là, tu mourras, et là seront les chars de ta gloire[c], toi qui es la honte de la maison de ton maître !
  rationale: La révision retire l’ajout sémantique de « resteront », conserve la construction « chars de ta gloire », qui respecte l’ambiguïté du texte source, et affine la note correspondante. « Roulera en boule » garde l’image du rouleau/de la boule sans ajouter explicitement l’action de lancer.
